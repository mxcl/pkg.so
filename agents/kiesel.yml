id: brew:kiesel
display-name: Kiesel
repo: https://codeberg.org/kiesel-js/kiesel
docs:
  - https://docs.kiesel.dev/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kiesel publishes versioned releases and main-branch builds, tracks conformance
      through Test262, and is packaged by Alpine Linux, Homebrew, and Nix according to
      the supplied package metadata. Official releases 0.2.0 and 0.3.0 were published in
      2026.
  package-nerd-significance:
    - >
      Kiesel is of interest as a young ECMAScript implementation built around Zig and a
      custom bytecode VM rather than an established browser engine. Its Test262
      tracking, embeddability goal, and availability in several system package
      collections make implementation progress easy to follow and test.
  project-history:
    - >
      Linus Groh began Kiesel as a from-scratch project for learning Zig, with the
      longer-term aim of following current ECMAScript standards. The official repository
      was created on Codeberg in July 2023.
    - >
      The implementation draws stylistic influence from SerenityOS and Ladybird's LibJS,
      particularly its close-to-spec approach. The project describes itself as
      early-stage and combines mostly Zig code with selected components for garbage
      collection, regular expressions, internationalization, and Temporal.
  related-projects:
    - LibJS influenced Kiesel's specification-oriented implementation style.
    - Test262 is used to track Kiesel's ECMAScript conformance.
  sources:
    - https://codeberg.org/api/v1/repos/kiesel-js/kiesel
    - https://codeberg.org/api/v1/repos/kiesel-js/kiesel/releases
    - https://codeberg.org/kiesel-js/kiesel
    - https://kiesel.dev/
    - source_facts.package-manager
  summary:
    - >
      Kiesel is an experimental JavaScript engine written in Zig. It provides a custom
      bytecode virtual machine and runtime, plus a command-line REPL and file
      interpreter.
  timeline:
    - '2023: The official Codeberg repository was created on July 2.'
    - '2026: Kiesel 0.2.0 was released on May 11.'
    - '2026: Kiesel 0.3.0 was released on July 17.'
  usage:
    - >
      The `kiesel` executable opens a REPL when run interactively, evaluates JavaScript
      files, or executes source passed with `--command`. Diagnostic options can print
      the parsed AST, bytecode, or intermediate representation, while embedding in other
      projects remains an explicit goal.
related-packages:
  - id: brew:quickjs
    reason: >
      Choose QuickJS for a mature, compact C engine with a documented embedding API and
      `qjsc` compiler; choose Kiesel to explore a newer Zig implementation and its
      custom bytecode VM.
    rel: alternative
    sources:
      - https://kiesel.dev/
      - https://docs.kiesel.dev/kiesel.1.html
      - https://bellard.org/quickjs/
      - https://bellard.org/quickjs/quickjs.html
