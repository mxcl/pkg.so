history:
  adoption-history:
    - >
      SubEthaEdit became widely known for real-time collaborative text editing on macOS.
      Its collaboration model found uses in pair programming, tutoring, meetings,
      creative writing, and shared note-taking.
    - >
      Version 5 made the application free and open source under the MIT License, moving
      its development to community contributors while retaining official releases
      through subethaedit.net and the Mac App Store.
  package-nerd-significance:
    - >
      SubEthaEdit is historically notable as an early desktop collaborative editor,
      predating the normalization of browser-based shared documents and remote
      pair-programming tools.
    - >
      For macOS package enthusiasts it combines a native Cocoa editor, Bonjour-style
      discovery and network collaboration, extensible syntax modes, AppleScript
      automation, and the Unix-oriented `see` command-line tool.
  project-history:
    - >
      SubEthaEdit originated as a macOS plain-text editor distinguished by live
      multi-user editing. Over successive major releases it accumulated syntax
      highlighting, scripting, Web preview, regular-expression search, code folding,
      encrypted collaboration, and extensive native macOS integration.
    - >
      The fifth major generation revived the application as a free and open-source
      project maintained by the SubEthaEdit Contributors, organized by Dominik Wagner.
      Subsequent releases added dark mode, Apple Silicon support, interface
      modernization, and continued mode and compatibility maintenance.
  related-projects:
    - The `see` command-line tool connects shell workflows to the graphical editor.
    - >
      The project acknowledges the Xerox PARC Jupiter project for its
      transactional-transformation foundations.
    - Sparkle is used in the surrounding update infrastructure.
  sources:
    - https://github.com/subethaedit/SubEthaEdit
    - https://github.com/subethaedit/SubEthaEdit/blob/develop/ChangeLog.md
    - https://subethaedit.net/
  summary:
    - >
      SubEthaEdit is a native macOS plain-text and source editor best known for live
      collaborative editing. It combines general editing, syntax modes, automation, Web
      preview, and networked multi-user documents.
  timeline:
    - >
      Early project: SubEthaEdit established its reputation as a native collaborative
      editor for macOS.
    - >
      Version 3 era: Collaboration gained encrypted connections, NAT traversal, friend
      discovery, and broader editing features.
    - 'Version 5: SubEthaEdit became free and open source.'
    - 'Version 5.1.5: Native Apple Silicon support was added.'
  usage:
    - >
      SubEthaEdit can be used as a conventional plain-text or source editor with syntax
      highlighting, folding, regular-expression search, split views, Web preview, and
      extensible modes.
    - >
      For collaboration, a user shares a document over the local network or via a
      connection link, assigns participant permissions, and edits live while participant
      colors and change highlighting show authorship.
    - >
      Shell users can install the `see` command-line tool and use `man see` for its
      complete interface, including piping text into or out of the editor.
