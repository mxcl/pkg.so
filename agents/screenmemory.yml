history:
  adoption-history:
    - >
      ScreenMemory launched in 2023 and has remained actively maintained as a
      commercial, local-first Mac utility. Its official changelog records frequent
      releases across the 1.x and 2.x lines, while the homepage offers both a limited
      free edition and paid licenses.
    - >
      The Homebrew cask recorded in source_facts.package-manager gives package-manager
      users a reproducible installation route. Official sources do not publish a user
      count.
  package-nerd-significance:
    - >
      ScreenMemory belongs to the screen-recall category but uses a deliberately
      straightforward architecture: periodic screenshots, local OCR, a timeline, and
      local storage rather than mandatory cloud ingestion. That makes storage growth,
      retention policy, blacklist configuration, and backup handling especially relevant
      to technically minded users.
    - >
      Its official changelog is unusually detailed for a small proprietary utility,
      documenting changes to OCR, SQLite use, timeline performance, storage relocation,
      compression, and failure handling for removable volumes.
  project-history:
    - >
      ScreenMemory was launched in 2023 as a macOS application for continuously taking
      screenshots and revisiting them through a time-based interface. The product
      evolved from a simple visual record into a searchable activity history with local
      OCR, application-aware timelines, privacy exclusions, multi-monitor capture, and
      calendar navigation.
    - >
      Version 2.0 introduced a redesigned interface in December 2024. The 2.x series
      subsequently improved search, calendars, compression controls, time-lapse export,
      storage relocation, removable-volume handling, and timeline performance.
  related-projects:
    - Rewind
    - TimeSnapper
    - ManicTime
    - Homebrew Cask
  sources:
    - 'Official changelog: https://screenmemory.app/changelog.html'
    - 'Official homepage and FAQ: https://screenmemory.app/'
    - source_facts.package-manager
  summary:
    - >
      ScreenMemory is a macOS activity-recall utility that continuously captures
      screenshots, performs local OCR, and lets users search or browse their visual
      history on a timeline and calendar.
  timeline:
    - '2023: ScreenMemory launched.'
    - >
      2024: The 1.x line added richer timelines, notes, storage relocation, broader OCR
      language support, and other workflow improvements.
    - '2024: ScreenMemory 2.0 introduced a redesigned interface.'
    - >
      2025: The 2.x line improved search and added compression controls and experimental
      time-lapse export.
    - '2026: Releases improved timeline performance and removable-volume handling.'
  usage:
    - >
      ScreenMemory runs in the background, periodically capturing the user’s displays.
      Users revisit a date or time, scrub the application-aware timeline, or search OCR
      text to recover a page, document, conversation, or work interval.
    - >
      Recorded data stays locally on the Mac. Users can exclude sensitive applications,
      adjust capture and retention settings, and move the data to a custom location. The
      official FAQ warns that anyone with access to the underlying files can view the
      stored history.
