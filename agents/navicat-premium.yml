history:
  adoption-history:
    - >
      Navicat Premium became PremiumSoft's flagship multi-database client, appealing to
      developers and administrators who work with heterogeneous database estates. It is
      distributed for Windows, macOS, and Linux and combines capabilities otherwise
      split among engine-specific Navicat editions.
  package-nerd-significance:
    - >
      Navicat Premium is a recognizable proprietary counterpart to multi-database tools
      such as DBeaver and DataGrip. Its Homebrew cask lets macOS users install and track
      the vendor application through the same workflow used for other developer tooling.
  project-history:
    - >
      PremiumSoft began building Navicat as graphical database software and later
      released Navicat Premium as a unified client for multiple database systems.
      Subsequent major versions expanded beyond administration and SQL editing into
      modeling, synchronization, automation, analytics, collaboration, and
      cloud-database support.
  related-projects:
    - Navicat Premium Lite
    - Navicat for PostgreSQL
    - Navicat for SQL Server
    - Navicat for SQLite
  sources:
    - https://www.navicat.com/en/company/aboutus.html
    - https://www.navicat.com/en/products/navicat-premium
    - https://www.navicat.com/en/support/online-manual
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Navicat Premium is PremiumSoft's proprietary, cross-platform graphical database
      administration and development suite supporting multiple database systems from one
      application.
  timeline:
    - '2001: PremiumSoft was established and began developing database-management software.'
    - '2009: Navicat Premium was part of the Navicat 9 product family.'
    - '2019: Navicat Premium 15 was released.'
    - >
      2024: Navicat 17 expanded the flagship product's modeling, analytics, and
      connectivity features.
  usage:
    - >
      Users maintain connections to different database engines, inspect and edit data
      and schema objects, write SQL, model databases, migrate or synchronize data,
      create dashboards and dictionaries, and automate repetitive database work.
