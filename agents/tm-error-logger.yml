history:
  adoption-history:
    - >
      TM Error Logger serves Mac users who need more diagnostic detail than a generic
      Time Machine failure notification provides. Its ability to remain running,
      periodically inspect logs, and send email notifications supports unattended backup
      monitoring.
    - >
      The application changed from paid software to donationware in 2019, while Homebrew
      Cask supplies a package-managed installation option.
  package-nerd-significance:
    - >
      TM Error Logger is a focused system utility that turns macOS backup log entries
      into actionable reports. Its long version history tracks recurring changes in
      macOS logging, privacy controls, processor architecture, and Time Machine
      behavior.
    - >
      For package-oriented Mac users, it represents the classic small independent
      utility: narrowly scoped, GUI-based, maintained across many operating-system
      generations, and distributable as a cask.
  project-history:
    - >
      Rich Love of Carnation Software developed TM Error Logger as a macOS utility for
      finding the files or folders responsible for Time Machine backup failures. The
      official version history records releases from at least February 2009.
    - >
      The application underwent a 64-bit rewrite in 2018, became donationware in 2019,
      and gained a universal Intel and Apple-silicon build in 2020. Later maintenance
      followed changes in Catalina, Big Sur, Monterey, Ventura, Sonoma, and Sequoia.
  related-projects:
    - Apple Time Machine
    - macOS Console
    - Disk Utility
  sources:
    - 'Official product page: https://carnationsoftware.com/TM_Error_Log_WebPage.html'
    - 'Official version history: https://carnationsoftware.com/TM_Error_Logger_Versions.html'
  summary:
    - >
      TM Error Logger is a macOS Time Machine diagnostic and notification utility by
      Rich Love of Carnation Software.
  timeline:
    - '2009: The official version history records an early 1.04 release.'
    - '2018: Version 5.0 introduced a 64-bit rewrite.'
    - '2019: Version 6.0 changed the application to donationware.'
    - '2020: Version 7.0 became a universal Intel and Apple-silicon application.'
    - '2024: Version 8.0 added macOS Sequoia compatibility.'
    - '2025: Version 8.0.3 documented Sequoia mail-permission requirements.'
  usage:
    - >
      Users run TM Error Logger after a failed backup to inspect recent Time Machine
      errors and identify the responsible file or folder. It can reveal the problem
      folder and launch Time Machine preferences or Disk Utility.
    - >
      When left running, it polls the system log periodically and can send email
      notifications when a Time Machine error occurs. On macOS Sequoia, the official
      history notes that Mail permission must be enabled for email sending.
