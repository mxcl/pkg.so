id: cask:stratoshark
display-name: Stratoshark
repo: https://gitlab.com/wireshark/wireshark
docs:
  - https://stratoshark.org/docs/relnotes
  - https://gitlab.com/wireshark/wireshark/-/blob/master/doc/stratoshark-quick-start.adoc
  - https://wiki.wireshark.org/Stratoshark
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/stratoshark/preferences
    - ~/.config/stratoshark/preferences
  windows:
    - '%APPDATA%\Stratoshark\preferences'
credentials-file-location: null
history:
  adoption-history:
    - >
      The Wireshark Foundation hosts Stratoshark, while the official site credits Sysdig
      with creating it for the community. Early releases are explicitly experimental
      previews toward 1.0, with packages for Windows and macOS and source shared through
      Wireshark's repository.
  package-nerd-significance:
    - >
      Stratoshark applies Wireshark's mature dissection, filtering, and three-pane
      analysis model to system calls and structured logs. It is especially interesting
      to observability and security-tool users because it interoperates with Falco and
      Sysdig capture formats while sharing a codebase and interface conventions with
      Wireshark.
  project-history:
    - >
      Stratoshark was created as a sibling to Wireshark for inspecting application
      behavior below the request level. It combines Wireshark-style analysis with
      capture and enrichment technology from the Falco ecosystem.
  related-projects:
    - >
      Wireshark supplies the shared interface, dissection engine, filtering model, and
      source repository.
    - Falco and Sysdig supply compatible event and capture ecosystems.
    - >
      The strato command-line tool provides a terminal-oriented counterpart analogous to
      TShark.
  sources:
    - https://gitlab.com/wireshark/wireshark
    - https://stratoshark.org/
    - https://stratoshark.org/docs/relnotes/stratoshark-0.10.0/
    - https://stratoshark.org/docs/relnotes/stratoshark-0.9.0/
  summary:
    - >
      Stratoshark is an open-source system-call and log analyzer that brings Wireshark's
      inspection and filtering workflow to applications, containers, and cloud-oriented
      telemetry.
  timeline:
    - '2025: Stratoshark 0.9.0 was released as an experimental preview toward 1.0.'
    - >
      2026: The 0.10 line added the strato CLI, additional audit-log readers, Procmon
      input, Lua debugging, and a shared theme system.
  usage:
    - >
      Users capture local Linux system calls or load supported system-call and audit-log
      data, then inspect events, apply display filters, follow file-descriptor streams,
      graph activity, and enrich findings using compatible Falco plugins. The graphical
      interface is intentionally familiar to Wireshark users.
