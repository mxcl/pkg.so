id: brew:mysql@9.7
display-name: MySQL 9.7
repo: https://github.com/mysql/mysql-server
docs:
  - https://dev.mysql.com/doc/refman/9.7/en
  - https://dev.mysql.com/doc/refman/9.7/en/mysql-config-editor.html
  - https://dev.mysql.com/doc/refman/9.7/en/option-files.html
config-file-location:
  unix:
    - /etc/my.cnf
    - /etc/mysql/my.cnf
    - SYSCONFDIR/my.cnf
    - $MYSQL_HOME/my.cnf
    - ~/.my.cnf
    - DATADIR/mysqld-auto.cnf
  windows:
    - '%WINDIR%\my.ini'
    - '%WINDIR%\my.cnf'
    - C:\my.ini
    - C:\my.cnf
    - BASEDIR\my.ini
    - BASEDIR\my.cnf
    - C:\ProgramData\MySQL\MySQL Server 9.7\my.ini
    - DATADIR\mysqld-auto.cnf
credentials-file-location:
  unix:
    - ~/.mylogin.cnf
  windows:
    - '%APPDATA%\MySQL\.mylogin.cnf'
history:
  adoption-history:
    - >
      MySQL became one of the defining databases of the web application stack and
      remains broadly available from operating-system, container, cloud, and language
      package ecosystems. Its protocol and tooling also shaped a wider compatibility
      ecosystem.
  package-nerd-significance:
    - >
      MySQL packaging exposes recurring database-maintenance concerns: service
      lifecycle, data-directory ownership, upgrade compatibility, configuration
      precedence, client/server splits, versioned formulae, and conflicts with
      compatible alternatives. Homebrew's versioned formula lets users deliberately
      track the 9.7 innovation release rather than another MySQL line.
  project-history:
    - >
      MySQL was founded in 1995 as an open-source relational database. Sun Microsystems
      acquired MySQL AB in 2008, and Oracle became its steward through the 2010
      acquisition of Sun. Oracle continues to publish the server, clients, source code,
      and reference manuals.
  related-projects:
    - >
      MariaDB originated as a MySQL-compatible alternative and is substituted for MySQL
      package names by some distributions. MySQL Client is the client-only companion
      package, while MySQL Router provides routing for distributed deployments.
  sources:
    - https://dev.mysql.com/doc/refman/9.7/en/
    - https://github.com/mysql/mysql-server
    - https://www.mysql.com/news-and-events/events/mysql-30th/
  summary:
    - >
      MySQL is an open-source relational database management system; this versioned
      Homebrew formula includes the 9.7 server, clients, administration utilities,
      router, and supporting tools.
  timeline:
    - '1995: MySQL was founded.'
    - '2008: Sun Microsystems acquired MySQL AB.'
    - "2010: Oracle acquired Sun Microsystems and became MySQL's steward."
    - '2026: MySQL 9.7 is distributed as a versioned Homebrew innovation-series formula.'
  usage:
    - >
      Users run `mysqld` as the database service and use `mysql` and companion programs
      for queries, administration, backups, imports, checks, routing, and diagnostics.
      Production use requires deliberate management of configuration, credentials, data
      storage, backups, service startup, and version upgrades.
related-packages:
  - id: brew:mysql@8.4
    reason: >
      Choose MySQL 8.4 when a fixed LTS feature set and longer support period are
      preferable to the faster 9.7 Innovation cadence.
    rel: alternative
    sources:
      - https://dev.mysql.com/doc/refman/8.4/en/mysql-releases.html
      - https://dev.mysql.com/doc/refman/9.7/en/mysql-releases.html
  - id: brew:mariadb@11.8
    reason: >
      Choose MariaDB 11.8 when a MySQL-compatible LTS implementation is acceptable and
      its documented differences have been tested with the application.
    rel: alternative
    sources:
      - https://mariadb.org/11-8-lts-released/
      - >
        https://mariadb.com/docs/release-notes/community-server/about/compatibility-and-differences/mariadb-vs-mysql-compatibility
  - id: brew:mysqltuner
    reason: >
      MySQLTuner supports the MySQL 9.7 line and can assess configuration, status,
      capacity, performance, and security after the server has accumulated
      representative traffic.
    rel: adjacent_workflow
    sources:
      - https://github.com/jmrenouard/MySQLTuner-perl
      - https://github.com/jmrenouard/MySQLTuner-perl/blob/master/USAGE.md
tags:
  - cli
  - client-server
  - data-storage
  - database-server
  - mysql
  - relational-database
  - sql
provenance:
  category-sources:
    - 'MySQL 9.7 Reference Manual: https://dev.mysql.com/doc/refman/9.7/en/'
    - source_facts.description
  display-name-sources:
    - Official MySQL 9.7 Reference Manual.
    - source_facts.name
  docs-sources:
    - >
      Oracle's official versioned reference manual is the primary documentation surface
      and explicitly documents configuration and login-path files.
  history-sources:
    - https://dev.mysql.com/doc/refman/9.7/en/
    - https://github.com/mysql/mysql-server
    - https://www.mysql.com/news-and-events/events/mysql-30th/
  repo-sources:
    - >
      source_facts.repo is empty; source_facts.homepage identifies Oracle's official
      MySQL source repository.
  tags-sources:
    - Official MySQL 9.7 Reference Manual.
    - source_facts.description
    - source_facts.executables
category-confidence: high
category-path:
  - data
  - databases
  - relational-databases
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
