history:
  adoption-history:
    - >
      LightBurn is distributed directly for macOS, Windows, and Linux and is also
      available to macOS package-manager users through the Homebrew `lightburn` cask.
      Its device-oriented workflow supports a range of laser controllers, making it a
      common single application for designing and sending jobs.
  package-nerd-significance:
    - >
      LightBurn is a prominent proprietary package in digital-fabrication setups because
      installation is only one part of the state users care about: device profiles,
      preferences, hotkeys, material libraries, art libraries, and presets also need
      backup or migration. Its bundle and export formats make that workstation state
      comparatively portable.
  project-history:
    - >
      LightBurn developed as an integrated layout, editing, preview, and machine-control
      application for laser cutters and engravers. The product expanded beyond basic
      project editing to include camera workflows, device profiles, material libraries,
      art libraries, hotkey customization, and migration bundles.
    - >
      Recent development included a move to the Qt 6 framework for LightBurn 2.0.
      Official documentation continues to preserve versioned and legacy guides alongside
      the current manual.
  related-projects:
    - >
      LightBurn communicates with supported laser-controller ecosystems rather than
      requiring users to prepare every job in vendor-specific control software.
    - >
      Its `.lbprefs`, `.lbdev`, `.clb`, `.lbart`, and `.lbzip` formats cover
      preferences, devices, libraries, and migration bundles.
  sources:
    - >
      Official File menu guide:
      https://docs.lightburnsoftware.com/latest/Reference/UI/FileMenu/
    - >
      Official development update:
      https://lightburnsoftware.com/blogs/news/lightburn-development-update
    - 'Official documentation: https://docs.lightburnsoftware.com/latest/'
    - 'Official migration guide: https://docs.lightburnsoftware.com/legacy/Guides/Migration'
    - 'Official product site: https://lightburnsoftware.com/'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      LightBurn is proprietary layout, editing, preview, and control software for laser
      cutters and engravers.
  timeline:
    - '2024: LightBurn publicly described version 2.0 development on a new Qt 6 framework.'
    - >
      LightBurn 1.6: Import and Export Bundle features consolidated migration of
      settings, devices, libraries, and related state.
    - 'LightBurn 2.0: The application transitioned to its newer development framework.'
  usage:
    - >
      Users create or import artwork, assign layer-specific laser operations, preview
      toolpaths, configure a laser device, and send jobs to the machine. Material
      libraries and test presets help retain settings for recurring materials and
      operations.
    - >
      Preferences can be exported as `.lbprefs`; device profiles and libraries are
      managed separately, while user bundles can move several kinds of configuration
      together. The official UI exposes the preferences directory through File →
      Preferences → Open Prefs Folder, but the documentation reviewed does not state a
      stable macOS filesystem path.
