id: brew:gcovr
display-name: gcovr
repo: https://github.com/gcovr/gcovr
docs:
  - https://gcovr.com/en/stable
config-file-location:
  unix:
    - gcovr.cfg in the -r/--root directory
credentials-file-location: null
history:
  adoption-history:
    - >
      gcovr became a common packaging target because it sits at a practical boundary
      between C/C++ test builds and CI coverage dashboards. Its documentation focuses on
      command-line operation, configuration files, filtering, reproducible timestamps,
      and multiple report formats, which are all package-manager-friendly workflows.
  package-nerd-significance:
    - >
      gcovr matters because it gives gcov users a single small CLI for report formats
      expected by CI systems and code-quality services. It is a bridge package: not a
      compiler, not a test framework, but the adapter that makes compiler-native
      coverage data useful to modern automation.
  project-history:
    - >
      The official changelog traces gcovr releases back to version 2.0 on 22 August
      2010. The current GitHub repository was created in May 2013 and describes the
      project as generating code coverage reports with gcc/gcov.
  related-projects:
    - GCC and gcov provide the compiler and raw coverage data that gcovr processes.
    - >
      LCOV, Cobertura, Coveralls, SonarQube, and JaCoCo are report ecosystems supported
      by gcovr output formats.
    - Python is the implementation and packaging ecosystem for the gcovr CLI.
  sources:
    - https://api.github.com/repos/gcovr/gcovr
    - https://gcovr.com/en/stable
    - https://gcovr.com/en/stable/changelog.html
    - https://gcovr.com/en/stable/guide.html
    - https://github.com/gcovr/gcovr
  summary:
    - >
      gcovr is a Python-based coverage reporting tool for GCC/gcov data. It turns
      compiler coverage output into human and machine-readable reports, including text,
      HTML, CSV, JSON, Cobertura, Coveralls, SonarQube, JaCoCo, and LCOV formats.
  timeline:
    - '2010: The official changelog records gcovr 2.0.'
    - '2013: GitHub records the gcovr repository creation.'
    - '2018: gcovr 4.0 appears in the official changelog.'
    - '2021: gcovr 5.0 appears in the official changelog.'
    - '2024: gcovr 8.0 appears in the official changelog.'
    - '2026: gcovr 8.6 is documented with Python 3.14 support and Python 3.9 support dropped.'
  usage:
    - >
      Typical use is to compile code with coverage flags, run tests, and invoke gcovr
      from a project root to collect gcov data and emit reports. The configuration file
      support lets repeatable coverage options live in a repository instead of only in
      CI shell scripts.
related-packages:
  - id: brew:lcov
    reason: >
      LCOV is gcovr's explicitly documented alternative for processing gcov data and is
      a strong choice for its established trace-file tools and HTML-centric workflow,
      while gcovr emphasizes text and multiple CI report formats.
    rel: alternative
    sources:
      - https://gcovr.com/en/stable/
      - https://github.com/linux-test-project/lcov#readme
