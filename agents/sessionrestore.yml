history:
  adoption-history:
    - >
      SessionRestore is distributed as a commercial macOS application and native Safari
      extension. The official product page supports both Apple Silicon and Intel Macs
      and advertises integration with Safari and Safari Technology Preview.
  package-nerd-significance:
    - >
      SessionRestore represents a specialized class of desktop package: a browser-state
      utility whose value lies in preserving and organizing large working sets of tabs
      outside ordinary bookmarks. Its import/export support and migration from legacy
      Safari extensions are particularly relevant to users maintaining long-lived
      browsing workflows.
  project-history:
    - >
      SessionRestore began in Safari's older JavaScript-extension ecosystem. When Safari
      12.1 on macOS 10.14.4 enabled the necessary native extension model, SweetP
      Productions rewrote it as a native Safari App Extension and provided an import
      path from the deprecated JavaScript version.
    - >
      Subsequent releases expanded the native application with autosave, searchable
      metadata, session editing, iCloud synchronization, Apple Silicon support, and
      import/export facilities.
  related-projects:
    - >
      The native application can import data from the deprecated SessionRestore
      JavaScript extension and from the separate Sessions extension.
  sources:
    - >
      Official migration announcement:
      https://support.sweetpproductions.com/topic/516/sessionrestore-is-now-a-native-safari-app-extension
    - 'Official product page: https://sessionrestore.sweetpproductions.com/'
    - >
      Official release history:
      https://sweetpproductions.com/products/sessionrestore/updates.htm
  summary:
    - >
      SessionRestore is a macOS Safari session manager from SweetP Productions. It
      saves, searches, edits, exports, and restores collections of Safari windows and
      tabs, with optional autosave and iCloud synchronization.
  timeline:
    - >
      2019: SweetP Productions announced the rewritten native Safari App Extension and
      migration path from the legacy JavaScript extension.
    - >
      Version 2.0: Added iCloud support for preferences and saved sessions and migrated
      to a new database.
    - 'Version 2.3: Added native Apple Silicon support.'
  usage:
    - >
      Users invoke SessionRestore through its Safari extension or main application to
      save the current tab, window, or complete browsing session. Saved sessions can be
      renamed, tagged, annotated, searched, reorganized, exported, and reopened later.
    - >
      Autosave is intended as protection against crashes or accidental tab loss, while
      manual session grouping supports research and topic-oriented browsing workflows.
