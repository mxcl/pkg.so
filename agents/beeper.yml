  summary:
    - >
      Beeper is a cross-platform universal inbox that connects multiple chat networks in
      one desktop and mobile interface.
  timeline:
    - '2021: Beeper was announced.'
    - '2024: Beeper removed its waitlist and renamed Beeper Cloud to Beeper.'
    - '2024: Automattic acquired Beeper.'
  usage:
    - >
      Users create or sign in to a Beeper account, securely save their recovery key, and
      connect supported messaging accounts from Settings. The desktop application
      provides a combined inbox, cross-network search, labels, notification controls,
      and per-network account settings.
