history:
  adoption-history:
    - >
      Beeper said that more than 115,000 people had beta-tested the service before its
      April 2024 general release, with 466,000 people having waited for access. At that
      release it supported desktop and mobile platforms and connections to numerous chat
      networks.
    - >
      Automattic acquired Beeper in April 2024. Beeper continued as an independent team
      within Automattic's Other Bets division, while its team and product direction
      began converging with Texts.com.
  package-nerd-significance:
    - >
      Beeper is notable to desktop-package users because it attempts to consolidate many
      otherwise separately packaged messaging clients into a single cross-platform
      application. Its history also intersects with Matrix-based bridging, encrypted
      local caches, and the operational difficulties of providing one interface over
      independently evolving chat networks.
  project-history:
    - >
      Beeper was announced in 2021 as a universal chat application. The product was
      formerly called Beeper Cloud and was described as being powered by Matrix.
    - >
      In April 2024, Beeper removed its waitlist, renamed Beeper Cloud to Beeper, and
      announced its acquisition by Automattic. The company said Beeper had previously
      been in beta and was becoming generally available.
  related-projects:
    - Matrix
    - Texts.com
    - Automattic
  sources:
