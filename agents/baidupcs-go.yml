history:
  adoption-history:
    - >
      BaiduPCS-Go has a sizable niche audience for users who prefer scripting Baidu
      Network Disk operations from terminals and servers. GitHub reported 5,219 stars
      for qjfoidnh/BaiduPCS-Go, and the Homebrew formula API reported stable version
      4.0.1 with 91 installs in the previous 30 days as of June 30, 2026.
    - >
      Package-manager coverage in the input includes Homebrew, Nix, Arch pacman, and
      winget, indicating cross-platform packaging beyond the upstream binary releases.
  package-nerd-significance:
    - >
      BaiduPCS-Go is a classic cloud-storage CLI package: it wraps a consumer service
      with a scriptable command surface, stores session/config state locally, and keeps
      chasing upstream API changes. That makes it useful to package nerds who automate
      backups, remote file movement, and headless server workflows around a service that
      otherwise favors GUI clients.
  project-history:
    - >
      The README says BaiduPCS-Go was inspired by GangZhuo/BaiduPCS, then based on
      iikira/BaiduPCS-Go, and that this maintained version continues from iikira's
      original v3.6.2. The qjfoidnh GitHub repository was created on November 6, 2020.
    - >
      The project has had to track changing Baidu service behavior. Its README changelog
      includes repeated fixes for upload, download, rapid-transfer, and shared-link
      transfer behavior, including v4.0.0 in 2025 and v4.0.1 in 2026.
  related-projects:
    - GangZhuo/BaiduPCS is cited by the README as an inspiration.
    - iikira/BaiduPCS-Go is cited by the README as the direct base for this maintained line.
  sources:
    - https://api.github.com/repos/qjfoidnh/BaiduPCS-Go
    - https://api.github.com/repos/qjfoidnh/BaiduPCS-Go/releases/latest
    - https://formulae.brew.sh/api/formula/baidupcs-go.json
    - https://raw.githubusercontent.com/qjfoidnh/BaiduPCS-Go/main/README.md
  summary:
    - >
      BaiduPCS-Go is a Go command-line client for Baidu Network Disk that presents
      cloud-storage operations through shell-like commands. The maintained qjfoidnh
      repository describes itself as continuing from iikira/BaiduPCS-Go v3.6.2 and
      adding transfer/save support for shared links.
  timeline:
    - '2020-11-06: qjfoidnh/BaiduPCS-Go repository created.'
    - >
      2021-2025: README changelog documents frequent fixes for Baidu upload/download and
      transfer behavior.
    - '2025-10-29: v4.0.0 released with upload policy changes and interface-change notes.'
    - '2026-03-26: v4.0.1 released as an emergency fix for command parameter errors.'
  usage:
    - >
      The README organizes usage around login, account switching, listing remote
      directories, downloading, uploading, generating direct links, copying, moving,
      sharing, offline downloads, recycle-bin management, glob-style matching, and
      configuration commands. It is intended to feel like Linux shell file handling for
      Baidu Network Disk.
