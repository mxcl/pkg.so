credentials-file-location: null
history:
  adoption-history:
    - >
      SMARTReporter began as a free utility, spent nearly a decade as a commercial
      application, and later returned to free-of-charge distribution. Its menu-bar
      status display and background checks target Mac users who want continuous
      disk-health warnings rather than occasional manual checks in Disk Utility.
  package-nerd-significance:
    - >
      SMARTReporter combines drive-reported S.M.A.R.T. status with macOS I/O-error,
      software RAID, and free-space checks. It is notable to system-tool users because
      it incorporates smartmontools for advanced attribute inspection while explicitly
      warning that predictive monitoring cannot replace backups.
  project-history:
    - >
      CoreCode first released SMARTReporter publicly in 2004. The application evolved
      from a simple S.M.A.R.T. status monitor into a broader disk-warning utility with
      email and on-screen notifications, I/O-error detection, software RAID monitoring,
      self-tests, attribute history, and disk-space checks.
    - >
      In 2012 CoreCode released a complete version 3 rewrite with a redesigned interface
      and expanded monitoring. CoreCode later made the application fully free to use
      again after nearly ten years as commercial software.
  related-projects:
    - >
      smartmontools: The open-source S.M.A.R.T. utility suite used for SMARTReporter's
      advanced attribute support.
    - >
      SMARTReporter Lite: The discontinued 2.x line, retained as a free and open-source
      edition after the version 3 rewrite.
    - >
      Apple Disk Utility: A macOS tool that can display disk S.M.A.R.T. status manually
      but does not provide SMARTReporter's continuous notification workflow.
  sources:
    - 'Official CoreCode news archive: https://www.corecode.io/news.html'
    - 'Official FAQ: https://www.corecode.io/smartreporter/faq.html'
    - 'Official readme and usage guide: https://www.corecode.io/smartreporter/readme.html'
    - 'Official release history: https://www.corecode.io/smartreporter/history.html'
  summary:
    - >
      SMARTReporter is a macOS disk-health monitoring utility that periodically checks
      S.M.A.R.T. status and can also warn about I/O errors, degraded software RAID sets,
      and low free space.
  timeline:
    - '2004: Initial public release.'
    - >
      2012: Version 3 delivered a complete rewrite, redesigned interface, and expanded
      monitoring features.
    - '2021: SMARTReporter returned to fully free-to-use distribution.'
  usage:
    - >
      SMARTReporter is normally configured to launch at login and remain running,
      displaying disk status through its Dock or menu-bar icon. Users may enable
      notifications, email alerts, software RAID checks, free-space thresholds,
      scheduled S.M.A.R.T. self-tests, and attribute-history collection. The vendor
      stresses that alerts are indicators, not guarantees, and that regular backups
      remain essential.
