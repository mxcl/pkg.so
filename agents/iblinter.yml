id: brew:iblinter
display-name: IBLinter
repo: null
docs:
  - https://github.com/IBDecodable/IBLinter#readme
config-file-location:
  macos:
    - <project-root>/.iblinter.yml
  unix:
    - <project-root>/.iblinter.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      IBLinter became one of the more visible packages in this batch: the GitHub page
      shows a large star count for a narrowly scoped linter, and Homebrew analytics show
      thousands of installs over a 365-day window. That reflects a practical need in
      teams that treat storyboards and XIBs as reviewable source files rather than
      opaque editor artifacts.
  package-nerd-significance:
    - >
      IBLinter is a neat example of the SwiftLint pattern spreading to adjacent Apple
      build artifacts: a focused Swift CLI, Homebrew and Mint installation, CocoaPods
      integration for build phases, and a rule-based config file for otherwise awkward
      XML UI resources.
  project-history:
    - >
      The README describes IBLinter as inspired by SwiftLint and focused on XML-based
      Interface Builder resources. It offers installation through Homebrew, Mint,
      CocoaPods, or source builds, which matches the distribution habits of
      Apple-platform developer tools.
  related-projects:
    - >
      The README explicitly names realm/SwiftLint as inspiration, and installation docs
      place IBLinter beside Homebrew, Mint, CocoaPods, and Xcode build-phase workflows.
  sources:
    - https://formulae.brew.sh/formula/iblinter
    - https://github.com/IBDecodable/IBLinter
    - https://github.com/IBDecodable/IBLinter/releases
  summary:
    - >
      IBLinter is a Swift command-line linter for Interface Builder files, aimed at
      normalizing `.xib` and `.storyboard` files in iOS and macOS projects.
  timeline:
    - 'v0.1.0: The repository contains an early tagged release for the linter.'
    - '0.4.x: The tag history shows a long sequence of 0.4 maintenance releases.'
    - '2022: GitHub lists 0.5.0 as a February 2022 release.'
    - '0.5.0: Homebrew packages the same stable version.'
  usage:
    - >
      Teams use IBLinter in local checks or build phases to enforce conventions on
      Interface Builder files. The README documents a project-root configuration file
      with enabled rules, disabled rules, and excluded paths, which lets teams tune lint
      behavior for their repository.
related-packages:
  - id: brew:swiftlint
    reason: >
      Use SwiftLint alongside IBLinter in an Xcode or CI workflow to lint Swift source
      while IBLinter checks the project's storyboard and XIB resources.
    rel: adjacent_workflow
    sources:
      - https://github.com/IBDecodable/IBLinter
      - https://github.com/realm/SwiftLint
tags:
  - cli
  - interface-builder
  - linter
  - storyboard
  - swift
  - xib
