id: cask:bunch
display-name: Bunch
repo: https://github.com/ttscoff/bunch
docs:
  - https://bunchapp.co/docs
  - https://bunchapp.co/docs/bunch-files/quick-reference
  - https://bunchapp.co/docs/using-bunch/getting-started
config-file-location:
  macos:
    - ~/Documents/Bunches
credentials-file-location: null
history:
  adoption-history:
    - >
      Bunch is distributed to macOS package-manager users through the Homebrew Cask
      named `bunch`, as recorded in source_facts.package-manager. Its official site also
      maintains links to integrations, examples, and third-party coverage.
  package-nerd-significance:
    - >
      Bunch applies the dotfile-friendly virtues of plain text, composability, and
      version control to desktop workspace automation. Its human-readable `.bunch` files
      make GUI-oriented Mac automation unusually portable and inspectable.
  project-history:
    - >
      Developer Brett Terpstra created Bunch after using Script Editor and Automator
      applets to launch task-specific groups of applications. Wanting something faster
      to configure and easier to modify, he developed the idea into a menu-bar context
      switcher controlled by text files.
    - >
      The project later expanded beyond launching applications to support files,
      websites, shell commands, AppleScript, Automator workflows, scheduling, variables,
      URL handlers, and a companion command-line interface.
  related-projects:
    - >
      The developer identifies Script Editor and Automator applets as predecessors to
      Bunch's workflow.
    - The Bunch CLI exposes Bunch operations to shells and other automation tools.
  sources:
    - https://bunchapp.co/docs/
    - https://bunchapp.co/docs/bunch-files/bunch-folder/
    - https://bunchapp.co/docs/integration/cli/
    - source_facts.package-manager
  summary:
    - >
      Bunch is a macOS menu-bar automation utility that turns plain-text `.bunch` files
      into reusable work or leisure contexts. Opening or closing a Bunch can launch and
      quit applications, open resources, change system settings, and run scripts.
  timeline:
    - >
      Origins: Brett Terpstra evolves task-specific Script Editor and Automator applets
      into a text-configured utility.
    - >
      Later development: Bunch grows into a general context switcher with scripting,
      scheduling, URL-handler, and CLI integration.
  usage:
    - >
      Users normally keep one `.bunch` file per context in the Bunch Folder, which
      defaults to `~/Documents/Bunches`. Selecting an entry from the menu opens the
      configured applications, files, sites, or commands; closing it can reverse
      applicable actions.
    - >
      The Bunch Folder can be relocated, including to a synchronized folder, and the CLI
      or URL handler can trigger Bunches from other automation systems.
