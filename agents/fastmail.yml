history:
  adoption-history:
    - >
      Fastmail developed a long-lived customer base around paid, advertising-free email
      with open client access and responsive support. Billing began in 2002 after an
      initial development and preview period.
    - >
      The service broadened from webmail into calendars, contacts, custom domains,
      mobile and desktop applications, and standards-based access. Fastmail reported in
      2024 that more than 90 percent of subscriptions renewed annually.
  package-nerd-significance:
    - >
      Fastmail has particular significance for technically minded mail users because it
      combines a hosted service with IMAP, SMTP, CalDAV, CardDAV, and JMAP rather than
      confining access to one proprietary client.
    - >
      The desktop cask represents a service-backed application with offline
      synchronization. Credentials and account data are managed through authentication
      and secure application storage, so treating them as a portable plaintext dotfile
      would be misleading.
  project-history:
    - >
      Jeremy Howard prototyped Fastmail in 1999 to provide a professional alternative to
      ISP mailboxes, slow advertising-funded webmail, and enterprise systems. Rob
      Mueller joined the early development effort, and paid billing began in 2002.
    - >
      Opera Software acquired Fastmail in 2010. Fastmail staff bought the service back
      in 2013, restoring its independence. The company acquired Pobox and Listbox in
      2015 and continued developing email standards and clients.
  related-projects:
    - >
      Fastmail acquired Pobox and Listbox in 2015. Its standards work includes JMAP,
      while supported client protocols include IMAP, SMTP, CalDAV, and CardDAV.
  sources:
    - https://www.fastmail.com/blog/fastmail-sale-to-opera-the-story-from-one-of-the-owners/
    - https://www.fastmail.com/blog/twenty-five-years-of-fastmail/
    - https://www.fastmail.com/company/about/
    - https://www.fastmail.help/hc/en-us/articles/14026270682511-The-Fastmail-desktop-app
    - source_facts.description
  summary:
    - >
      Fastmail is an independent subscription email service founded in 1999, offering
      mail, calendars, contacts, web and native applications, offline access, and
      standards-based clients.
  timeline:
    - '1999: Jeremy Howard prototyped Fastmail.'
    - '2002: Fastmail began billing customers.'
    - '2010: Opera Software acquired Fastmail.'
    - '2013: Fastmail staff bought the service back from Opera.'
    - '2015: Fastmail acquired Pobox and Listbox.'
    - '2024: Fastmail marked its twenty-fifth anniversary.'
  usage:
    - >
      Users access hosted mail, calendars, contacts, notes, and files through Fastmail's
      web, mobile, or desktop applications. The desktop application supports offline
      work and synchronizes changes after connectivity returns.
    - >
      Third-party programs use documented service settings and individual app passwords.
      The official desktop documentation does not identify a portable configuration or
      plaintext credentials file.
