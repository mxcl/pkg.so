display-name: Proxifier
repo: null
docs:
  - https://www.proxifier.com/docs/mac-v2/profiles.htm
  - https://www.proxifier.com/docs/mac-v3
config-file-location:
  macos:
    - /Library/Application Support/Proxifier/Profiles/Default.ppx
credentials-file-location:
  macos:
    - /Library/Application Support/Proxifier/Profiles/Default.ppx
history:
  adoption-history:
    - >
      The official changelog shows continued macOS maintenance across major
      operating-system transitions. Version 2 added portable XML profiles shared with
      Windows, while version 3 moved interception from a kernel extension to Apple's
      Network Extension framework for newer macOS releases.
  package-nerd-significance:
    - >
      Proxifier is useful when an application has no native proxy support or when
      per-application and per-host routing rules are needed. Its human-readable PPX
      profiles are portable across Windows and macOS and can be encrypted when they
      contain proxy passwords.
  project-history:
    - >
      Proxifier is a long-running commercial proxy-routing utility. The Mac v2 line
      began in 2011, and Mac v3 reached its release version in November 2020 after
      adopting Apple's Network Extension framework.
  related-projects:
    - SOCKS4, SOCKS4A, SOCKS5, HTTPS, and HTTP proxies are supported.
    - Windows and macOS Proxifier profiles use a compatible PPX format.
  sources:
    - https://www.proxifier.com/changelog/mac.html
    - https://www.proxifier.com/changelog/mac2.html
    - https://www.proxifier.com/docs/mac-v2/profiles.htm
    - https://www.proxifier.com/docs/mac-v3/
  summary:
    - >
      Proxifier is a proprietary network client that transparently routes selected
      applications—or all system TCP connections—through proxy servers or proxy chains.
  timeline:
    - '2011: Proxifier for Mac v2 was released.'
    - "2020: Proxifier for Mac v3 was released using Apple's Network Extension framework."
  usage:
    - >
      Users define proxy servers or chains, create ordered proxification rules for
      applications and destinations, and optionally route DNS resolution through a
      proxy. Profiles can be saved, imported, exported, shared across platforms, and
      encrypted when they contain proxy credentials.
