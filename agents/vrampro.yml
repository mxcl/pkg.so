history:
  adoption-history:
    - >
      The official site targets Apple Silicon power users—particularly developers, AI
      researchers, and creative professionals—who need more predictable GPU access to
      unified memory. Reliable official evidence for broader adoption or a dated release
      chronology is not published.
  package-nerd-significance:
    - >
      VRAM Pro packages an otherwise terminal-driven sysctl adjustment in a graphical
      interface. It is especially relevant to local-LLM and Metal users experimenting
      with the boundary between system RAM and GPU-reserved unified memory.
  project-history:
    - >
      VRAM Pro was created as a macOS graphical utility for changing the amount of Apple
      Silicon unified memory reserved for GPU workloads. The official site does not
      provide a dated origin story or release timeline.
  related-projects:
    - >
      The app wraps the same class of system adjustment that advanced users can perform
      with the iogpu.wired_limit_mb sysctl setting.
  sources:
    - 'Official product page and FAQ: https://vrampro.com/'
  summary:
    - >
      VRAM Pro is a macOS utility that adjusts GPU memory allocation on Apple Silicon
      systems through presets or manual controls.
  timeline:
    - 'Undated: VRAM Pro became available as a directly distributed Apple Silicon utility.'
  usage:
    - >
      Users select a VRAM allocation for local AI, Metal, 3D, rendering, or
      high-resolution video workloads. Administrator approval is required for system
      changes, and choosing Default VRAM restores macOS-managed allocation.
