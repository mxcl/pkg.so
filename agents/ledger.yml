credentials-file-location: null
history:
  adoption-history:
    - >
      Ledger became one of the foundational tools in the plain-text accounting
      community. Package-manager coverage across Homebrew, Debian, Ubuntu, Fedora, Arch,
      MacPorts, Nix, Alpine, and openSUSE reflects adoption by Unix users who prefer
      version-controlled finance data and scriptable reports.
  package-nerd-significance:
    - >
      Ledger is package-nerd significant because it helped define plain-text accounting
      as a durable command-line category. It also inspired ports and related tools,
      including editor modes, hledger, Beancount, and ecosystem utilities that treat
      financial records as auditable text.
  project-history:
    - >
      The official Ledger site says Ledger began in 2003, was written by John Wiegley,
      and is released under the BSD license. Its design centers on text files,
      double-entry accounting, and report generation rather than a graphical accounting
      database.
    - >
      The GitHub repository continues that positioning: Ledger reads text files,
      generates reports, and stores no other database state. The project accumulated a
      long 3.x release history, with signed tags and release maintenance visible through
      the ledger/ledger repository.
  related-projects:
    - >
      Related projects include ledger-mode for Emacs, vim-ledger, hledger, Beancount,
      Fava, plain-text-accounting workflows, and shell/reporting tools that consume
      Ledger journals.
  sources:
    - https://formulae.brew.sh/formula/ledger
    - https://github.com/ledger/ledger
    - https://github.com/ledger/ledger-mode
    - https://github.com/ledger/ledger/releases
    - https://github.com/ledger/ledger/tags
    - https://ledger-cli.org/
    - https://ledger-cli.org/2.6/doc/ledger.html
    - https://ledger-cli.org/doc/ledger3.html
  summary:
    - >
      Ledger is a command-line, double-entry accounting system built around plain-text
      journals. Users write transactions in Ledger's text format and run reports from
      the Unix shell without a separate database.
  timeline:
    - '2003: Ledger began, according to the official project site.'
    - "2003-2009: Ledger 2.6 documentation carries John Wiegley's copyright range."
    - '2020-05-01: v3.2.0 tag published.'
    - '2023-02-08: v3.3.0 tag published.'
    - '2023-03-30: v3.3.2 release published.'
  usage:
    - >
      The basic workflow is to keep a journal file of dated transactions, then run
      commands such as balance, register, equity, prices, and other reports. The
      documentation emphasizes that Ledger has no graphical interface and returns
      accounting to text journals and shell output.
related-packages:
  - id: brew:hledger
    reason: >
      hledger is the closest journal-compatible alternative, trading Ledger's C++ speed
      and embedded expressions for a Haskell implementation with active maintenance and
      official CLI, TUI, web, and HTTP interfaces.
    rel: alternative
    sources:
      - https://ledger-cli.org/
      - https://hledger.org/ledger.html
  - id: brew:beancount
    reason: >
      Beancount is a Python plain-text accounting alternative with a distinct file
      format and stronger inventory and capital-gains modeling.
    rel: alternative
    sources:
      - https://ledger-cli.org/
      - https://beancount.github.io/docs/
      - https://hledger.org/faq.html
