history:
  adoption-history:
    - >
      Wrike grew from a startup into a work-management platform used by organizations
      across many countries. Its official history records expansion into enterprise,
      marketing, and professional-services offerings as well as offices in North
      America, Europe, and Asia-Pacific.
    - >
      Wrike became part of Citrix in 2021 and returned to operation as an independent
      entity in 2022.
  package-nerd-significance:
    - >
      The macOS cask packages a native desktop shell for a primarily cloud-hosted
      work-management service, illustrating how SaaS products are delivered through
      desktop package managers for notification, multi-tab, and browser-independent
      workflows.
    - >
      Because work data and authentication are service-backed, installing the package
      supplies the client rather than a self-contained project-management server.
  project-history:
    - >
      Wrike was founded in 2006 by Andrew Filev to develop collaborative work-management
      software beyond email and spreadsheets.
    - >
      The product expanded with enterprise plans, real-time collaborative editing,
      Gantt-chart planning, specialized marketing and professional-services offerings,
      workflow automation, integrations, dashboards, and AI-assisted work features.
  related-projects:
    - Wrike's web application and mobile clients provide access to the same service.
    - >
      Wrike Integrate and its marketplace connections extend the platform into other
      business systems; project-management and collaborative-work platforms occupy the
      same software category.
  sources:
    - https://help.wrike.com/
    - https://help.wrike.com/hc/en-us/articles/115004231249-Wrike-s-Desktop-App
    - https://www.wrike.com/company/
  summary:
    - >
      Wrike is a cloud work-management and collaboration platform with a macOS desktop
      client for planning projects, coordinating tasks, communicating, and receiving
      notifications.
  timeline:
    - '2006: Wrike was founded.'
    - >
      2006–2013: Enterprise features, real-time collaborative editing, and Gantt-chart
      functionality were established.
    - '2016–2017: Wrike for Marketers was introduced.'
    - '2018: Wrike held its first Collaborate user conference.'
    - '2019: Wrike for Professional Services and Wrike Integrate were introduced.'
    - '2021: Wrike became part of Citrix.'
    - '2022: Wrike became an independent entity again.'
  usage:
    - >
      Teams organize projects, tasks, workflows, files, and discussions in shared
      workspaces and use dashboards, timelines, notifications, and automation to
      coordinate delivery.
    - >
      The desktop app offers browser-independent access, multiple tabs,
      unread-notification counts, desktop notifications, and optional launch at login.
      Signing out of Wrike also ends active browser and desktop sessions.
