history:
  adoption-history:
    - >
      Chime has remained a comparatively focused macOS editor rather than a broad
      cross-platform IDE. Version 2 expanded its language coverage and introduced native
      extensions, a command-line tool, and fuzzy quick-open while preserving a
      minimalist Mac-native interface.
    - >
      The stable 2.x application was distributed as closed-source software. The later
      3.0 redevelopment opened the editor source and emphasized reusable Swift packages,
      although its maintainers describe the current editor build as alpha and mostly
      non-functional compared with stable 2.x.
  package-nerd-significance:
    - >
      Chime is notable to macOS development enthusiasts for treating native platform
      integration as a core design constraint. Its use of Swift, AppKit, SwiftUI,
      ExtensionKit, Language Server Protocol, tree-sitter, and reusable packages
      contrasts with editors built around browser runtimes.
    - >
      Its transition from a commercial application to a free, open-source redevelopment
      also makes it an instructive example of a proprietary Mac utility being decomposed
      into community-usable packages and extensions.
  project-history:
    - >
      Chime Systems began Chime as a native, focused text and code editor for macOS. The
      project's public site has existed since 2017 and emphasizes a minimalist
      interface, semantic editing, native extensions, and Language Server Protocol
      support.
    - >
      Chime 2.0 arrived in October 2022 with an ExtensionKit-based extension system,
      support for 23 additional languages and formats, a command-line tool, and fuzzy
      quick-open. Large portions of its supporting SDK and language extensions were
      released as open source.
    - >
      The project later moved from a commercial product to a free application and began
      an open-source 3.0 rewrite. The maintainers are rebuilding the core application
      architecture while extracting components into packages; the stable 2.x release
      remains the recommended editor for ordinary use while 3.0 is under development.
  related-projects:
    - ChimeKit, Chime's Swift SDK and extension framework.
    - >
      Tree-sitter and Language Server Protocol implementations used for semantic and
      syntax-aware editing.
    - >
      Other native macOS editors cited by the project include BBEdit, CodeEdit,
      CodeRunner, CotEditor, and Nova.
  sources:
    - 'Official Chime 2.0 announcement: https://www.chimehq.com/blog/version-two'
    - 'Official DocC documentation: https://chimehq.github.io/Chime/documentation/chime/'
    - 'Official homepage: https://www.chimehq.com/'
    - 'Official repository and README: https://github.com/ChimeHQ/Chime'
  summary:
    - >
      Chime is a native macOS text and code editor created by Chime Systems. It combines
      a focused interface with semantic editing, LSP support, native extensions,
      multiple cursors, project search, and syntax support for numerous programming
      languages.
  timeline:
    - "2017: Chime Systems' official site dates the project presence to this year."
    - >
      2022-10-24: Chime 2.0 introduced native extensions, 23 additional languages and
      formats, a command-line tool, and fuzzy quick-open.
    - 'Later: Chime changed from a commercial product to a free application.'
    - >
      2026: An open-source Chime 3.0 alpha and architectural rewrite were under active
      development.
  usage:
    - >
      Chime is used to edit individual files or projects on macOS, with features
      including completions, search, quick-open, multiple cursors, file navigation,
      theming, and semantic information.
    - >
      Language functionality can be extended through bundled native extensions backed by
      ChimeKit. The 3.0 README advises ordinary editor users to use the stable 2.x
      download while the open-source rewrite remains incomplete.
