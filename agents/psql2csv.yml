history:
  adoption-history:
    - >
      The official README documents distribution through Homebrew, while the supplied
      package metadata also records Nix packaging. Its deliberately small, single-script
      form also supports manual installation into PATH.
  package-nerd-significance:
    - >
      psql2csv exemplifies the Unix package tradition of wrapping a capable lower-level
      client with a narrowly focused command. It makes scripted PostgreSQL-to-CSV export
      convenient while preserving access to psql connection and variable options.
  project-history:
    - >
      Philipe Fatio created psql2csv as a shell-based frontend that runs a PostgreSQL
      query through psql and emits CSV. The repository's official documentation presents
      it as a compact command-line utility rather than a separate database client.
  related-projects:
    - PostgreSQL psql performs the database connection and query work.
    - PostgreSQL COPY provides the underlying export semantics documented by the project.
  sources:
    - 'Official project README: https://github.com/fphilipe/psql2csv#readme'
  summary:
    - >
      psql2csv is a command-line wrapper for running PostgreSQL queries with psql and
      writing the results as configurable CSV.
  timeline:
    - 'Initial project phase: Published as a standalone shell script for psql-to-CSV export.'
    - 'Homebrew adoption: The official README documents installation with brew.'
    - "2019: The README's advanced example documents parameterized recurring-report workflows."
  usage:
    - >
      A query can be supplied as the final argument or through standard input, with CSV
      written to standard output. Users can control delimiters, quoting, escaping, NULL
      representation, headers, encoding, time zone, and search path; remaining arguments
      are forwarded to psql.
