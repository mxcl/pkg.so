history:
  adoption-history:
    - >
      doh is more of a reference-quality utility from the curl orbit than a mass-adopted
      DNS client. Its adoption significance comes from being packaged and visible as a
      standalone libcurl DoH example at the exact layer where curl users think about
      HTTP transport behavior.
  package-nerd-significance:
    - >
      For package maintainers, doh is interesting because it exposes DNS-over-HTTPS as a
      tiny installable command rather than as a feature hidden inside a larger resolver
      or browser stack. It is also a compact libcurl demonstration for network
      debugging.
  project-history:
    - >
      The curl/doh repository was created in April 2018, during the period when
      DNS-over-HTTPS was moving from emerging protocol work into practical client
      tooling. Its README describes a libcurl-using application that resolves host names
      through DoH and uses POST requests unconditionally.
    - >
      The project has stayed deliberately small. GitHub lists a single 0.1 release from
      September 2019, while the README keeps the interface to a simple form: doh
      options, a host, and an optional DoH URL.
  related-projects:
    - >
      doh belongs to the curl/libcurl ecosystem and overlaps with DoH-capable DNS
      clients such as doggo and doge, while staying narrower than general DNS tools like
      dig.
  sources:
    - https://github.com/curl/doh#readme
    - https://api.github.com/repos/curl/doh
    - https://github.com/curl/doh/releases/tag/doh-0.1
  summary:
    - >
      doh is a small curl project utility: a stand-alone DNS-over-HTTPS resolver built
      on libcurl.
  timeline:
    - '2018: curl/doh repository created.'
    - '2019: doh-0.1 release published.'
    - >
      2026: Repository still receives maintenance activity, but remains a compact
      single-purpose tool.
  usage:
    - >
      The command resolves a hostname through a DoH server, defaulting to Cloudflare
      when no DoH URL is supplied. The README examples also show targeting Google's DoH
      endpoint explicitly.
related-packages:
  - id: brew:doggo
    reason: >
      Choose doggo when you need DoH alongside UDP, TCP, DoT, DoQ, DNSCrypt, reverse
      lookups, EDNS controls, and JSON output; choose doh for a minimal libcurl-based
      DoH resolver.
    rel: alternative
    sources:
      - https://github.com/curl/doh#readme
      - https://doggo.mrkaran.dev/docs
  - id: brew:q
    reason: >
      Choose q for a compact client that adds DoT, DoQ, ODoH, DNSCrypt, DNS Stamps, and
      structured output; doh is narrower and specifically demonstrates DoH through
      libcurl.
    rel: alternative
    sources:
      - https://github.com/curl/doh#readme
      - https://github.com/natesales/q#readme
  - id: brew:doge
    reason: >
      Choose doge for human-readable conventional DNS, DoT, DoH, and JSON workflows;
      choose doh when a focused POST-based DoH lookup tool is sufficient.
    rel: alternative
    sources:
      - https://github.com/curl/doh#readme
      - https://dog.ramfield.net/
