history:
  adoption-history:
    - >
      The project is distributed through its GitHub releases and as a Homebrew cask.
      Community contributions have broadened its translations and reminder-management
      features while preserving its focused menu-bar interface.
  package-nerd-significance:
    - >
      Reminders MenuBar provides a small, open-source alternative to opening Apple's
      full Reminders application. It is a representative SwiftUI menu-bar utility and
      integrates with the system reminder database through Apple's EventKit API rather
      than maintaining a separate task service.
  project-history:
    - >
      Rafael Damasceno developed Reminders MenuBar as an open-source macOS utility using
      SwiftUI and Apple Reminders as its data source. Successive releases expanded it
      from a compact reminder viewer into a menu-bar editor with natural-language entry,
      searching, filtering, recurrence handling, tags, keyboard control, and automatic
      updates.
  related-projects:
    - >
      Apple Reminders supplies the underlying reminder data, optionally synchronized
      through iCloud. Sparkle provides the application's update mechanism in newer
      releases.
  sources:
    - https://github.com/DamascenoRafael/reminders-menubar
    - https://github.com/DamascenoRafael/reminders-menubar/releases
  summary:
    - >
      Reminders MenuBar is an open-source macOS menu-bar application for viewing and
      editing Apple Reminders without opening the full Reminders application.
  timeline:
    - >
      Version 1.x: The application developed a broad set of menu-bar reminder viewing
      and editing features.
    - >
      Version 2.0: The interface was redesigned, Sparkle updates were added, and support
      for tags and cross-list search was expanded.
    - >
      Version 2.2: The application raised its minimum system requirement to macOS
      Monterey and added further keyboard-oriented reminder entry features.
  usage:
    - >
      After granting macOS Reminders permission, users can inspect upcoming items,
      create reminders with natural-language dates, search and filter by list or tag,
      edit reminder properties, and mark items complete from the menu bar.
