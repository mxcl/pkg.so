id: brew:kconf
display-name: kconf
repo: null
docs:
  - https://github.com/particledecay/kconf#readme
config-file-location:
  unix:
    - ~/.kube/config
credentials-file-location:
  unix:
    - ~/.kube/config
history:
  adoption-history:
    - >
      The batch input records Homebrew and Nix packages. Upstream release history shows
      rapid 1.x releases during 2020 and a 2.0.0 release on November 17, 2023.
  package-nerd-significance:
    - >
      kconf is a small example of Kubernetes CLI tooling that wraps a common dotfile
      workflow instead of introducing a new service or database. Its package value is
      convenience: one executable for a task many operators otherwise solve with shell
      snippets.
  project-history:
    - >
      The repository was created in January 2020. Its README explains the motivation as
      replacing shell automation around the KUBECONFIG environment variable with
      commands that merge, list, view, remove, and switch contexts in
      $HOME/.kube/config.
  related-projects:
    - >
      kconf's workflow is built around kubectl's default use of $HOME/.kube/config and
      the Kubernetes kubeconfig format.
  sources:
    - https://github.com/particledecay/kconf
    - https://github.com/particledecay/kconf/releases
    - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
  summary:
    - >
      kconf is an opinionated command-line tool for managing multiple kubeconfig entries
      in the default Kubernetes config file.
  timeline:
    - '2020-01-14: GitHub repository created.'
    - '2020-01-21: v1.0.0 first stable release published.'
    - '2020-04-03: v1.1.2 added a view command for extracting a single kubeconfig.'
    - '2023-11-17: v2.0.0 release published.'
  usage:
    - >
      kconf is used to add kubeconfig files, optionally rename contexts on import, list
      contexts, print one context's config, switch contexts, and set namespaces while
      leaving kubectl pointed at its default config path.
related-packages:
  - id: brew:kubectx
    reason: >
      Choose kubectx when you primarily need fast context and namespace switching,
      previous-context shortcuts, interactive selection, or isolated/read-only shells;
      choose kconf when importing and consolidating kubeconfig files is central.
    rel: alternative
    sources:
      - https://github.com/particledecay/kconf
      - https://github.com/ahmetb/kubectx
  - id: brew:kubernetes-cli
    reason: >
      kubectl is the downstream client that reads the kubeconfig entries and current
      context managed by kconf, so the two tools form the practical
      configuration-and-cluster-operation workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/particledecay/kconf
      - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
      - https://kubernetes.io/docs/reference/kubectl/
