id: brew:gdtoolkit
display-name: GDScript Toolkit
repo: https://github.com/Scony/godot-gdscript-toolkit
docs:
  - https://github.com/Scony/godot-gdscript-toolkit#readme
config-file-location:
  unix:
    - ./gdlintrc
    - ./gdformatrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The README shows distribution through PyPI-compatible pip and pipx workflows, plus
      integration as a GitHub Action and as pre-commit hooks. Release metadata shows
      active 4.x releases through 2025.
  package-nerd-significance:
    - >
      gdtoolkit is notable because it brings the Python packaging and formatter/linter
      culture associated with tools such as Black, Radon, and pre-commit into the Godot
      ecosystem. For package managers, it is a compact bundle of multiple
      language-specific developer tools under one formula.
  project-history:
    - >
      The official repository was created in 2019 and describes the project as a
      daily-work toolkit for GDScript. The README lists a parser, static-analysis
      linter, formatter, and cyclomatic-complexity calculator, exposed through commands
      such as gdparse, gdlint, gdformat, gdradon, and gd2py.
    - >
      As Godot evolved, the toolkit documented separate installation tracks for Godot 3
      and Godot 4 through gdtoolkit==3.* and gdtoolkit==4.*. It also documents direct
      installation from Git for the master branch.
  related-projects:
    - >
      The toolkit is tied to Godot and GDScript, and its README relates gdradon to
      Radon's Python metrics command. Its workflow integrations also place it near
      pre-commit and GitHub Actions in day-to-day package use.
  sources:
    - https://github.com/Scony/godot-gdscript-toolkit
    - https://github.com/Scony/godot-gdscript-toolkit#readme
    - https://github.com/Scony/godot-gdscript-toolkit/releases
    - https://github.com/Scony/godot-gdscript-toolkit/wiki
  summary:
    - >
      GDScript Toolkit is an independent tool suite for Godot's GDScript language,
      providing parser, linter, formatter, metrics, conversion, and automation commands.
  timeline:
    - '2019: Official GitHub repository created.'
    - '2024: 3.6.0 and 4.3.x releases published for Godot-version-specific tool lines.'
    - '2025: 4.5.0 release published.'
  usage:
    - >
      Developers use gdformat to rewrite GDScript files, gdlint to enforce naming and
      style rules, gdparse to inspect parse trees, and gdradon to calculate code metrics
      similar to Radon for Python. The project is commonly wired into CI or pre-commit
      so Godot projects can reject unformatted or lint-failing scripts.
related-packages:
  - id: brew:pre-commit
    reason: >
      Use pre-commit to run GDScript Toolkit's officially supplied gdlint and gdformat
      hooks automatically during commits or across all files in CI.
    rel: adjacent_workflow
    sources:
      - https://github.com/Scony/godot-gdscript-toolkit#using-gdtookit-in-pre-commit
      - https://pre-commit.com/
