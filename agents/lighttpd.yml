id: brew:lighttpd
display-name: lighttpd
repo: https://git.lighttpd.net/lighttpd/lighttpd1.4.git
docs:
  - https://redmine.lighttpd.net/projects/lighttpd/wiki/Docs
config-file-location:
  unix:
    - /etc/lighttpd/lighttpd.conf
    - /etc/lighttpd/conf.d/*.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      lighttpd spread through Unix package managers because it was small, permissively
      licensed, and useful wherever Apache was too heavy or a reverse proxy/static-file
      server was enough. Its FastCGI support made it a practical companion for PHP,
      Ruby, Python, Perl, and other application stacks before nginx became the default
      lightweight-web-server answer for many administrators.
  package-nerd-significance:
    - >
      lighttpd is package-nerd significant because it preserves a distinct branch of
      web-server history: event-driven C infrastructure from the c10k era, a compact
      module system, and long-lived distro packaging across Linux, BSD, macOS, and
      Windows-adjacent ecosystems. It is also a reminder that "small web server" was a
      competitive category before nginx and Caddy dominated newer conversations.
  project-history:
    - >
      Jan Kneschke's own project story traces lighttpd to February 2003, when he used
      Dan Kegel's c10k problem as a distraction while finishing a thesis. The prototype
      was explicitly about handling 10,000 parallel connections on one server after
      seeing Apache-style deployments exhaust memory with much smaller concurrency.
    - >
      The project evolved into the 1.4 series with modules for FastCGI, CGI,
      authentication, compression, URL rewriting, proxying, TLS, and other common
      web-server jobs. Its official site continued to emphasize secure, fast, compliant,
      flexible service and lower resource use than other popular web servers.
  related-projects:
    - >
      lighttpd is historically compared with Apache httpd, nginx, thttpd, and other
      event-driven or lightweight HTTP daemons. Its FastCGI usage ties it to
      PHP-FPM-style application serving, and its module set overlaps with reverse
      proxies used in modern web stacks.
  sources:
    - https://git.lighttpd.net/lighttpd/lighttpd1.4.git
    - https://redmine.lighttpd.net/projects/lighttpd/wiki/Docs
    - https://support.usr.com/support/3510/licenses/LIGHTTPD.htm
    - https://www.lighttpd.net/
    - https://www.lighttpd.net/story/
  summary:
    - >
      lighttpd, pronounced "lighty", is a lightweight open-source HTTP server designed
      for high-performance environments with low memory and CPU use. It became part of
      the early-2000s wave of event-driven web servers that challenged process-heavy
      Apache deployments for static content, FastCGI, and constrained systems.
  timeline:
    - >
      2003-02: Jan Kneschke began the proof-of-concept that became lighttpd while
      thinking about the c10k problem.
    - >
      2004: lighttpd licensing and copyright notices identify Jan Kneschke and
      incremental as early rightsholders.
    - >
      2000s: lighttpd became a common package-manager web server for FastCGI and
      low-resource deployments.
    - >
      2026: The official site still described active 1.4.x releases and a focus on
      secure, fast, compliant, flexible service.
  usage:
    - >
      Administrators generally run lighttpd as a daemon with a central lighttpd.conf
      file and optional included configuration fragments. It is used for static sites,
      embedded-device admin interfaces, FastCGI applications, reverse proxying, and
      small services where predictable resource usage matters.
related-packages:
  - id: brew:spawn-fcgi
    reason: >
      Use spawn-fcgi alongside lighttpd when FastCGI application processes should be
      started, privilege-separated, and supervised independently from the web server.
    rel: adjacent_workflow
    sources:
      - https://blog.lighttpd.net/articles/2009/04/03/spawn-fcgi-removed-from-lighttpd-1-4/
      - https://git.lighttpd.net/lighttpd/spawn-fcgi/src/branch/master/README.md
