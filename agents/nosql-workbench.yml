history:
  adoption-history:
    - >
      AWS released NoSQL Workbench in preview for Windows and macOS in September 2019,
      made it generally available in March 2020, and added Linux support in May 2020.
    - >
      Subsequent releases integrated PartiQL, CloudFormation model import and export,
      CSV interchange, control-plane operations, bundled DynamoDB Local, sample-data
      generation, native Apple silicon support, table cloning, and access-pattern
      modeling.
  package-nerd-significance:
    - >
      NoSQL Workbench packages an AWS-specific modeling and query environment as a local
      desktop application. This gives DynamoDB developers a reproducible GUI companion
      to the AWS console, CLI, SDKs, and infrastructure templates.
    - >
      Its inclusion of DynamoDB Local is particularly useful for offline experimentation
      and package-managed development workstations, while its code generation and
      CloudFormation interchange connect graphical modeling with source-controlled
      application and infrastructure code.
  project-history:
    - >
      AWS introduced NoSQL Workbench to help developers design and visualize DynamoDB
      data models, execute operations, and generate application code. The initial
      preview arrived in 2019 and general availability followed in 2020.
    - >
      The application evolved into a cross-platform suite centered on a data modeler and
      operation builder. It supports local experimentation as well as connections to AWS
      accounts using access keys, temporary credentials, and IAM roles.
  related-projects:
    - >
      Amazon DynamoDB is the managed key-value and document database targeted by the
      workbench.
    - DynamoDB Local provides a local database instance for development and testing.
    - >
      PartiQL supplies SQL-compatible querying, while AWS CloudFormation supports
      importing and exporting infrastructure-oriented models.
  sources:
    - >
      https://aws.amazon.com/blogs/aws/nosql-workbench-for-amazon-dynamodb-available-in-preview/
    - >
      https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkbenchDocumentHistory.html
    - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/workbench.html
    - >
      https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/workbench.querybuilder.connect.html
  summary:
    - >
      NoSQL Workbench for Amazon DynamoDB is AWS's cross-platform desktop environment
      for designing DynamoDB data models, validating access patterns, generating sample
      data and code, and exploring local or live datasets.
  timeline:
    - '2019: AWS released the initial NoSQL Workbench preview.'
    - '2020: NoSQL Workbench reached general availability and added Linux support.'
    - '2020: The operation builder added PartiQL support.'
    - >
      2021: CloudFormation model interchange, saved operations, and CSV import and
      export arrived.
    - '2022: AWS added control-plane operations and bundled DynamoDB Local support.'
    - '2023: Sample-data generation and native Apple silicon support arrived.'
    - '2024: Table cloning and operation-builder improvements expanded the client.'
    - '2026: AWS introduced an updated data modeler with access-pattern support.'
  usage:
    - >
      Developers create projects containing DynamoDB tables, indexes, attributes, sample
      data, and access patterns, then validate operations before committing a design to
      DynamoDB Local or an AWS account.
    - >
      The operation builder explores live datasets, constructs DynamoDB requests,
      generates code in multiple languages, and can clone tables between local and
      hosted environments.
    - >
      AWS connections are configured in the application with a Region and credentials
      such as an access-key ID and secret access key; temporary session tokens and IAM
      role ARNs are optional. The official connection guide does not document a fixed
      credentials-file path.
