credentials-file-location: null
history:
  adoption-history:
    - >
      Skint developed within The Eclectic Light Company's family of macOS security
      utilities as a simpler, continuously running companion to SilentKnight.
    - >
      The developer added SkintM, a menu-bar variant, in 2024 and continued adapting
      both applications to changes in macOS security data through macOS Tahoe. The
      developer recommends the newer SilentKnight 3 instead for macOS Golden Gate.
  package-nerd-significance:
    - >
      Skint packages several otherwise scattered macOS integrity and malware-protection
      checks into a lightweight native status utility.
    - >
      Its preference files contain machine-readable results that administrators can
      harvest with scripts, bridging a desktop status application and lightweight fleet
      reporting.
  project-history:
    - >
      Howard Oakley released the first free version of Skint in January 2024 as a
      companion to SilentKnight. It checks important Mac security settings without
      querying Apple's software-update servers or initiating updates.
    - >
      Early releases added clearer status reporting, changing Dock indicators, saved
      check results, and the separate SkintM menu-bar application. Later updates
      accommodated changes to XProtect handling in newer macOS releases.
  related-projects:
    - SkintM performs the same checks from the macOS menu bar.
    - >
      SilentKnight provides deeper checks and update capabilities, while silnite offers
      related command-line reporting.
    - SystHist reports installed macOS system and security-update history.
  sources:
    - >
      https://eclecticlight.co/2024/01/29/skint-will-keep-a-quiet-eye-on-your-macs-key-settings/
    - >
      https://eclecticlight.co/2024/02/27/keep-a-more-watchful-eye-on-your-mac-with-skint-1-04/
    - https://eclecticlight.co/2026/09/16/what-has-happened-with-xprotect/
    - https://eclecticlight.co/lockrattler-systhist/
  summary:
    - >
      Skint and its bundled menu-bar sibling SkintM are lightweight macOS utilities that
      periodically check important system-security settings, protection data, and
      security-update status.
  timeline:
    - '2024-01-29: The first public version of Skint is released.'
    - '2024-02: Skint 1.04 adds saved results and the SkintM menu-bar variant.'
    - '2024-08: Skint 1.08 adapts its XProtect check for macOS Sequoia.'
    - '2025-09: Skint and SkintM 1.09 add macOS Tahoe compatibility.'
    - '2026: The developer recommends SilentKnight 3 instead on macOS Golden Gate.'
  usage:
    - >
      Users can launch Skint for an on-demand check or leave Skint or SkintM running to
      repeat checks roughly every 24 hours. Results use green, amber, and red
      indicators.
    - >
      Checks cover SIP, the signed system volume, Gatekeeper and XProtect, XProtect
      Remediator, recent malware scans, application status, and whether the installed
      major macOS release has current security updates.
