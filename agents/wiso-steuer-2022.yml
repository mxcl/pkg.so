history:
  adoption-history:
    - >
      Buhl distributes WISO Steuer across desktop, browser, and mobile clients. This
      edition is also cataloged as a versioned Homebrew cask for macOS.
  package-nerd-significance:
    - >
      Its package year is one ahead of its fiscal year: WISO Steuer 2022 prepares the
      2021 declaration. Preserving that distinction matters when selecting or archiving
      annual tax-software releases.
  project-history:
    - >
      WISO Steuer 2022 is the macOS edition of Buhl's German tax-preparation software
      for fiscal year 2021. It is one release in an annually versioned product line
      updated for changing tax rules and forms.
