  timeline:
    - '2022: The versioned macOS application targets fiscal-year 2021 declarations.'
  usage:
    - >
      Users enter or import income and deductible expenses, check the calculated result,
      and prepare the declaration for electronic submission. Buhl documents local
      tax-case files separately from application configuration; no official
      configuration-file path is documented.
