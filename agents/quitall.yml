history:
  adoption-history:
    - >
      QuitAll is distributed as a downloadable macOS application and through the
      Homebrew Cask catalog.
  package-nerd-significance:
    - >
      QuitAll represents the class of focused macOS menu-bar utilities that package
      managers make easy to install alongside larger desktop applications.
  project-history:
    - >
      Amico Apps developed QuitAll as a macOS utility for closing running applications
      from one interface. Its feature set grew beyond manual quitting to include force
      quitting, automatic inactivity rules, background-app visibility, shortcuts, and
      appearance settings.
  related-projects:
    - Quitter provides related inactivity-based hiding and quitting behavior on macOS.
  sources:
    - Homebrew distribution is identified by source_facts.package-manager.brew-cask.
    - 'Official product page: https://amicoapps.com/app/quitall/'
    - 'Official support page: https://amicoapps.com/support/quitall/'
  summary:
    - >
      QuitAll is a macOS utility for viewing running applications and quitting one,
      several, or all of them from a consolidated interface.
  timeline:
    - >
      Current product: Supports normal and forced quitting, inactivity-based automatic
      quitting, customizable shortcuts, and light and dark modes.
  usage:
    - >
      Users select running applications and request a normal quit, allowing applications
      to prompt for unsaved work. Holding Option switches the action to Force Quit.
    - >
      Automatic rules can close applications after a configured period of inactivity.
      Settings are managed in the graphical application; no official local
      configuration-file path is documented.
