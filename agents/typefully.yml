history:
  adoption-history:
    - >
      Typefully’s official documentation shows its scope expanding beyond its original
      X-oriented writing workflow to support X, LinkedIn, Threads, Bluesky, Mastodon,
      and Substack Notes. Social Sets provide separate drafts, schedules, analytics,
      settings, and team access for personal, brand, and client accounts.
  package-nerd-significance:
    - >
      Typefully is primarily a hosted service, so the Homebrew cask packages a desktop
      client rather than a self-contained publishing stack. Its public API, Zapier
      integration, MCP server, and official agent-skill repository make it notable as a
      social-publishing service with several automation surfaces.
  project-history:
    - >
      By 2026, Typefully offered a dedicated macOS application alongside its browser
      interface. Its documented feature set includes drafting, cross-posting, scheduled
      queues, calendars, analytics, collaboration, API access, and AI-assisted editing.
  related-projects:
    - >
      Typefully integrates with X, LinkedIn, Threads, Bluesky, Mastodon, Substack Notes,
      Zapier, and MCP-compatible AI clients.
    - >
      Typefully maintains a separate official agent-skills repository at
      https://github.com/typefully/agent-skills; that repository is an integration
      project, not the source repository for the Typefully desktop application.
  sources:
    - https://support.typefully.com/en/
    - https://support.typefully.com/en/articles/13128440-typefully-mcp-server
    - https://support.typefully.com/en/articles/8717329-mac-app-for-typefully
    - https://support.typefully.com/en/articles/8717684-social-sets-and-accounts
    - >
      https://support.typefully.com/en/articles/8728077-what-and-where-can-i-publish-with-typefully
    - https://typefully.com/docs/api
  summary:
    - >
      Typefully is a hosted writing, scheduling, collaboration, and analytics service
      for publishing content across text-oriented social networks. The cask installs its
      macOS client.
  timeline:
    - >
      2026-08-11: Official documentation described Typefully’s dedicated Mac application
      and multi-network publishing workflow.
    - >
      2026-08-28: Official documentation introduced the Typefully MCP server for
      conversational content management.
  usage:
    - >
      Users connect social accounts into Social Sets, prepare drafts, optionally tailor
      them per network, and publish immediately or place them in a scheduled queue or
      calendar.
    - >
      Developers and automation users can manage drafts and publishing through the
      public API, Zapier integration, or MCP server. API keys and OAuth grants should be
      treated as credentials, but the official desktop documentation does not identify a
      local credential file.
