id: cask:bootstrap-studio
display-name: Bootstrap Studio
repo: null
docs:
  - https://bootstrapstudio.io/docs
config-file-location:
  linux:
    - ~/.config/bstudio
  macos:
    - ~/Library/Application Support/bstudio
  windows:
    - C:\Users\<yourname>\AppData\Roaming\bstudio
credentials-file-location: null
history:
  adoption-history:
    - >
      Bootstrap Studio is distributed commercially for macOS, Windows, and Linux and
      follows a frequent-update model. Its official release archive documents continued
      adaptation to newer Bootstrap versions and modern workflows rather than a static
      one-time design tool.
    - >
      The application broadened from drag-and-drop Bootstrap composition into code-heavy
      workflows, reusable components, SASS, external editor integration, static blog
      generation, and AI-assisted site editing.
  package-nerd-significance:
    - >
      Bootstrap Studio is unusual among GUI web builders in providing a native Linux
      edition alongside macOS and Windows releases. Package users also care about its
      self-contained .bsdesign project format and its documented per-user bstudio
      configuration directory.
  project-history:
    - >
      Bootstrap Studio was created as a proprietary visual environment for building
      responsive sites with the Bootstrap framework. Its design model combines
      drag-and-drop components with direct HTML, CSS, JavaScript, and SASS editing, then
      exports ordinary web assets.
  related-projects:
    - Bootstrap is the front-end framework used to assemble designs.
    - >
      Bootstrap Icons and Google Fonts are among the asset sets maintained in Bootstrap
      Studio releases.
  sources:
    - 'Official documentation: https://bootstrapstudio.io/docs/'
    - 'Official release archive: https://bootstrapstudio.io/pages/releases/'
    - >
      Official reset and configuration guidance:
      https://bootstrapstudio.io/docs/reinstalling.html
  summary:
    - >
      Bootstrap Studio is a cross-platform visual web-development application for
      designing responsive Bootstrap sites and exporting standard HTML, CSS, JavaScript,
      images, and related assets.
  timeline:
    - '2024-12: Version 7.0 added static blog components and freely reorganizable panels.'
    - >
      2026-02: Version 8.0 introduced an AI assistant for editing sites, writing code
      and text, creating pages, and generating images.
    - >
      2026-03: Version 8.0.1 updated the AI assistant, responsive video controls, fonts,
      and icon sets.
  usage:
    - >
      Users construct sites by dragging components onto a visual stage, edit markup and
      styles directly when needed, save complete projects as .bsdesign files, and export
      deployable static web folders. Automatic backups default to five-minute intervals
      and can be configured in the application settings.
