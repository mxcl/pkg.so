id: brew:git-if
display-name: Git (Glulx interpreter)
repo: https://github.com/DavidKinder/Git
docs:
  - https://ifarchive.org/indexes/if-archive/programming/glulx/interpreters/git
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Git's adoption is tied to the Glulx ecosystem rather than general-purpose
      developer tooling. IFWiki lists it as a Glulx interpreter used by projects such as
      Gargoyle, Windows Git, and other interactive-fiction front ends, giving it a role
      as a fast interpreter core for playable story files.
  package-nerd-significance:
    - >
      The package is a naming oddity: `git-if` installs software named Git that is
      unrelated to source control. It is useful to package catalogs because it preserves
      an interactive-fiction interpreter without colliding with the ubiquitous `git`
      command.
  project-history:
    - >
      IF Archive identifies the interpreter as Iain Merrick's Git and describes it as
      optimized for speed. Archived binaries show releases for PocketPC, MS-DOS, Windows
      console mode, and source distributions, while the maintained GitHub repository
      describes the code as originally written by Merrick and later maintained by David
      Kinder.
  related-projects:
    - >
      Git belongs to the Glulx interpreter family alongside Glulxe and front ends such
      as Gargoyle. It also depends on the Glk interface layer, with Windows Glk serving
      the Windows build.
  sources:
    - https://github.com/DavidKinder/Git
    - https://ifarchive.org/if-archive/programming/glulx/interpreters/git/
    - https://ifarchive.org/indexes/if-archive/programming/glulx/interpreters/git
    - https://raw.githubusercontent.com/DavidKinder/Git/master/README.md
    - https://www.ifwiki.org/Git
  summary:
    - >
      Git, packaged by Homebrew as `git-if`, is an interpreter for the Glulx virtual
      machine used by interactive-fiction games. The package name avoids confusion with
      the Git version-control system.
  timeline:
    - '2004: IF Archive records PocketPC and MS-DOS builds for early 1.0.x releases.'
    - '2010: DavidKinder/Git repository created on GitHub.'
    - '2017: IF Archive records source and Windows console builds for Git 1.3.5.'
    - '2023: IF Archive records source code for Git 1.3.8.'
    - '2025: IF Archive records a Windows binary of Git 1.3.8 using Windows Glk.'
  usage:
    - >
      Practitioners use Git by building it with a Glk library, which provides the user
      interface layer. The GitHub README notes that Windows Glk support is included for
      Windows builds, while Unix-style builds depend on an appropriate Glk
      implementation.
related-packages:
  - id: brew:glulxe
    reason: >
      Choose Glulxe when you want the reference Glulx interpreter; Git targets the same
      virtual machine but explicitly prioritizes execution speed.
    rel: alternative
    sources:
      - https://github.com/DavidKinder/Git#readme
      - https://github.com/erkyrath/glulxe#readme
  - id: cask:gargoyle
    reason: >
      Gargoyle provides a graphical cross-platform interactive-fiction player that
      bundles Git as one of its interpreters, making it a practical front end for
      playing Glulx stories without assembling a Glk-based interpreter manually.
    rel: adjacent_workflow
    sources:
      - https://github.com/DavidKinder/Git#readme
      - https://github.com/garglk/garglk#readme
