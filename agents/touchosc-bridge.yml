history:
  adoption-history:
    - >
      TouchOSC Bridge became the desktop companion for a common TouchOSC workflow: using
      a mobile touch surface as a networked MIDI controller for software running on a
      Mac or Windows PC.
    - >
      Hexler continues to distribute Bridge free of charge. The newer TouchOSC can also
      communicate through other wired, wireless, and virtual MIDI paths, but Bridge
      remains documented as a convenient network or USB transport and remains important
      for TouchOSC Mk1 installations.
  package-nerd-significance:
    - >
      Bridge is a small companion utility whose value comes from interoperability rather
      than a standalone interface. It creates virtual MIDI ports and translates network
      or USB traffic into endpoints that ordinary music applications can consume.
    - >
      For package-manager users, installing Bridge avoids manual virtual-MIDI and
      network-routing setup when connecting TouchOSC devices to desktop audio software.
  project-history:
    - >
      Hexler developed TouchOSC Bridge as part of the TouchOSC ecosystem. It runs in the
      macOS menu bar or Windows system tray and relays MIDI bidirectionally between
      TouchOSC and MIDI-capable applications.
    - >
      The Bridge line has been maintained alongside both TouchOSC Mk1 and the
      next-generation TouchOSC. Later maintenance added USB connectivity, System
      Exclusive forwarding, MIDI-processing fixes, virtual-driver updates, and
      installer-signing updates.
  related-projects:
    - TouchOSC
    - TouchOSC Mk1
    - MIDI
    - Open Sound Control
    - Protokol
  sources:
    - https://hexler.net/touchosc-mk1
    - https://hexler.net/touchosc/bridge-releases
    - https://hexler.net/touchosc/connections
    - https://hexler.net/touchosc/manual
  summary:
    - >
      TouchOSC Bridge is Hexler's free desktop companion for carrying MIDI messages
      between TouchOSC and MIDI-capable software over a network or supported USB
      connection.
  timeline:
    - >
      TouchOSC Mk1 era: Bridge provides network MIDI connectivity between mobile
      TouchOSC and desktop applications.
    - 'Later releases: USB connectivity is added for supported iOS workflows.'
    - '2021: The virtual MIDI driver receives a Windows update.'
    - '2022: System Exclusive forwarding and MIDI-processing fixes are released.'
    - '2024: The Windows installer receives updated USB guidance and code signing.'
  usage:
    - >
      Launch Bridge on the desktop; it exposes a virtual MIDI interface and advertises
      itself to TouchOSC. In TouchOSC, enable a Bridge connection, select the host
      running Bridge, and choose the corresponding Bridge ports in the MIDI connection
      settings.
    - >
      Music, performance, or visualization software can then receive MIDI generated by
      the TouchOSC control surface and send MIDI back through the same bridge.
