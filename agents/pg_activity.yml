id: brew:pg_activity
display-name: pg_activity
repo: https://github.com/dalibo/pg_activity
docs:
  - https://github.com/dalibo/pg_activity/blob/master/docs/man/pg_activity.pod
  - https://github.com/dalibo/pg_activity/blob/master/README.md
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME:-~/.config}/pg_activity.conf
    - /etc/pg_activity.conf
    - ${XDG_CONFIG_HOME:-~/.config}/pg_activity/<profile>.conf
    - /etc/pg_activity/<profile>.conf
credentials-file-location:
  unix:
    - ~/.pgpass
  windows:
    - '%APPDATA%\postgresql\pgpass.conf'
history:
  adoption-history:
    - >
      The official project documents distribution packages, PostgreSQL Global
      Development Group repositories, PyPI, pipx, and source installation. The input
      also records a Homebrew formula, extending its package-manager availability to
      Homebrew users.
  package-nerd-significance:
    - >
      pg_activity brings the familiar top-style terminal workflow to PostgreSQL
      administration. Its presence across operating-system repositories, Python
      packaging, PGDG repositories, and Homebrew reflects the utility of small
      interactive observability tools that can be installed close to a database server.
  project-history:
    - >
      Dalibo maintains pg_activity as an interactive PostgreSQL activity monitor. The
      tool is implemented in Python, uses psycopg and libpq for database connectivity,
      and has accumulated built-in display profiles and support for modern PostgreSQL
      activity, locking, worker, replication, and system metrics.
  related-projects:
    - PostgreSQL
    - libpq
    - psycopg
    - top
  sources:
    - https://github.com/dalibo/pg_activity/blob/master/README.md
    - https://github.com/dalibo/pg_activity/blob/master/docs/man/pg_activity.pod
    - source_facts.package-manager
  summary:
    - >
      pg_activity is a top-like terminal monitor for PostgreSQL sessions, queries,
      locks, transaction activity, workers, replication, and host resource consumption.
  timeline:
    - The official sources reviewed do not provide a reliable concise origin timeline.
  usage:
    - >
      Administrators connect using standard libpq parameters, environment variables, and
      password mechanisms, then switch among running, waiting, and blocking activity
      views. Interactive keys sort metrics, pause or refresh data, inspect queries,
      and—with sufficient database privileges—cancel or terminate backends. Full host
      CPU, memory, and I/O data requires running on the database server with suitable
      operating-system access.
tags:
  - cli
  - database
  - dba
  - interactive
  - monitoring
  - observability
  - postgresql
  - terminal
provenance:
  category-sources:
    - >
      https://github.com/dalibo/pg_activity/blob/master/README.md describes PostgreSQL
      server activity monitoring.
    - >
      source_facts.description: Top-like interactive monitoring tool for PostgreSQL
      server activity.
  display-name-sources:
    - The official repository README and manual use the name “pg_activity”.
  docs-sources:
    - Official repository README and bundled manual.
  history-sources:
    - https://github.com/dalibo/pg_activity/blob/master/README.md
    - https://github.com/dalibo/pg_activity/blob/master/docs/man/pg_activity.pod
    - source_facts.package-manager
  repo-sources:
    - >
      The official README's source-install instructions clone
      https://github.com/dalibo/pg_activity.git.
    - source_facts.homepage points to the official Dalibo GitHub repository.
    - source_facts.repo is empty.
  tags-sources:
    - https://github.com/dalibo/pg_activity/blob/master/README.md
    - https://github.com/dalibo/pg_activity/blob/master/docs/man/pg_activity.pod
    - source_facts.description
category-confidence: high
category-path:
  - data
  - database-monitoring
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
