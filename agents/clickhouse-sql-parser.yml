history:
  adoption-history:
    - >
      The tool is available both as a Go install target and as a Homebrew formula,
      matching common distribution paths for Go developer CLIs.
  package-nerd-significance:
    - >
      It is interesting to package managers because it bridges library and CLI
      packaging: the same Go module can be consumed by applications and installed as a
      standalone formatter/parser executable.
  project-history:
    - >
      The official README says the project aims to build a ClickHouse SQL parser in Go
      and notes inspiration from memefish, a Go SQL parser for Cloud Spanner.
  related-projects:
    - >
      The README explicitly cites memefish as an inspiration and targets the ClickHouse
      SQL dialect.
  sources:
    - >
      Official GitHub README: project goal, features, Go library examples, CLI
      installation, and usage examples.
  summary:
    - >
      ClickHouse SQL Parser is a Go library and CLI for parsing ClickHouse SQL into an
      AST and formatting or beautifying ClickHouse queries.
  usage:
    - >
      Developers import the parser package in Go code or run `clickhouse-sql-parser`
      from the shell to parse SQL strings, format SQL, beautify SQL, or read queries
      from files.
related-packages:
  - id: brew:sqlfluff
    reason: >
      Choose SQLFluff when the main task is configurable linting and auto-formatting
      with an officially supported ClickHouse dialect; choose this parser when Go code
      needs a typed AST and transformation API.
    rel: alternative
    sources:
      - https://github.com/AfterShip/clickhouse-sql-parser#readme
      - https://docs.sqlfluff.com/en/stable/reference/dialects/
  - id: cask:clickhouse
    reason: >
      Use the parser to analyze, validate, rewrite, or format ClickHouse-dialect queries
      before sending them to a ClickHouse database or local ClickHouse workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/AfterShip/clickhouse-sql-parser#readme
      - https://clickhouse.com/docs
