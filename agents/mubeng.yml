history:
  project-history:
    - >
      The project grew around operational proxy-pool workflows rather than a general web
      server role. Its README documents support for HTTP, HTTPS, SOCKS v4(A), SOCKS v5,
      and Amazon API Gateway proxy schemes, plus examples for Burp Suite upstream
      proxying and OWASP ZAP proxy chaining. The changelog records later additions such
      as proxy server authentication, live-reloading watched proxy files, HTTPS proxy
      protocol support, and helper functions for proxy formatting.
  sources:
    - https://api.github.com/repos/mubeng/mubeng
    - https://formulae.brew.sh/formula/mubeng
    - https://github.com/mubeng/mubeng
    - https://github.com/mubeng/mubeng/blob/master/CHANGELOG.md
  summary:
    - >
      mubeng is a Go-based proxy utility organized around two jobs: running a local
      proxy server that rotates outbound proxy IPs, and checking whether entries in a
      proxy list are usable. The public GitHub repository was created in 2021 under the
      mubeng organization and describes the tool as an "incredibly fast proxy checker &
      IP rotator".
  usage:
    - >
      In practice, users point mubeng at a proxy list and either ask it to validate the
      pool or expose a local address that rotates requests through the pool. Its
      package-manager niche is security, scraping, testing, and bug-bounty-adjacent
      command-line work where rotating or validating many proxies is useful.
related-packages:
  - id: cask:burp-suite
    reason: >
      Run mubeng as Burp Suite's upstream proxy when interactive web-security testing
      needs requests rotated through mubeng's proxy pool.
    rel: adjacent_workflow
    sources:
      - https://github.com/mubeng/mubeng#burp-suite-upstream-proxy
      - https://portswigger.net/burp/documentation/desktop/settings/network/connections
