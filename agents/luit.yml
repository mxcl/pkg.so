history:
  adoption-history:
    - >
      luit began inside the XFree86 and Xorg terminal ecosystem and became a small but
      widely packaged Unix utility. The maintainer's page lists portability across SVR4
      Unix, AIX, Tru64, BSD systems, macOS, and Linux, and the package appears in common
      Unix package sets such as Homebrew, Debian, Fedora, MacPorts, Nix, Arch, and
      openSUSE.
    - >
      Its adoption is mostly invisible: users encounter it through xterm or
      legacy-locale workflows rather than as a standalone application. That invisibility
      is part of its packaging importance, because terminal emulators and old
      applications still need reliable conversion behavior when UTF-8 terminals meet
      non-UTF-8 programs.
  package-nerd-significance:
    - >
      luit matters to package nerds because it is a small compatibility utility with a
      long tail of platform-specific behavior. It exposes classic distribution issues:
      upstream fork history, XFree86/Xorg lineage, font-encoding data split into
      separate packages, iconv availability, and packagers accidentally adding
      unnecessary X library dependencies.
  project-history:
    - >
      Juliusz Chroboczek wrote luit for the XFree86 Project in 2001-2002. The official
      history credits later fixes and improvements from several people, especially
      Tomohiro Kubota's CJK encoding extensions, and notes that the program uses the
      MIT-X11 license like xterm.
    - >
      Thomas E. Dickey adopted luit maintenance in 2006 after a period without a
      maintainer, motivated by keeping it useful with xterm. The Invisible Island
      history emphasizes two long-running maintenance themes: correcting distribution
      and path changes made in Xorg-era packaging, and reducing dependence on the
      lightly maintained font-encoding library by implementing efficient iconv-based
      conversion.
    - >
      As of the 2.0 line, luit deprecated the font-encoding library path while
      preserving support for `.enc` files and broader encoding selection. The official
      page documents the practical consequences for packagers: encoding data is often
      packaged separately, dependencies are sometimes incomplete, and luit is not itself
      an X application even though it is most useful with xterm.
  related-projects:
    - xterm is the primary terminal emulator associated with luit usage.
    - XFree86 and Xorg are the historical source trees where luit circulated.
    - >
      iconv and font-encoding provide the conversion mechanisms and data paths discussed
      by the maintainer.
  sources:
    - https://formulae.brew.sh/formula/luit
    - https://invisible-island.net/luit/luit.html
    - https://invisible-island.net/luit/luit.log.html
    - https://invisible-island.net/luit/manpage/luit.html
  summary:
    - >
      luit is a terminal encoding filter that sits between an application and a UTF-8
      terminal emulator, translating application output into UTF-8 and terminal input
      back into the locale encoding.
  timeline:
    - '2001-2002: Written by Juliusz Chroboczek for XFree86.'
    - '2006: Thomas E. Dickey adopts maintenance to keep luit working with xterm.'
    - "2010: Xorg incorporates Dickey's luit work into its repository."
    - '2013: luit 2.0 release line appears in the maintainer history.'
    - '2018-2022: Invisible Island page documents ongoing maintenance and portability notes.'
  usage:
    - >
      The manpage describes luit as a filter run between an arbitrary application and a
      UTF-8 terminal emulator. It is mainly used with xterm, but the official page
      stresses that luit itself is not an X application.
    - >
      Power users and packagers use options such as `-list-fontenc` and `-encoding` to
      inspect and choose encoding tables, especially when diagnosing missing CJK or
      legacy encoding data.
related-packages:
  - id: brew:xterm
    reason: >
      xterm can invoke luit automatically when a program using a legacy locale needs to
      communicate with a UTF-8 terminal, making the two tools a directly documented
      terminal workflow.
    rel: adjacent_workflow
    sources:
      - https://invisible-island.net/luit/manpage/luit.html
      - https://invisible-island.net/xterm/
