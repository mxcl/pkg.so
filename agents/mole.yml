history:
  project-history:
    - >
      The tool's practical role is in the Mac utility niche usually occupied by GUI
      cleaners and uninstallers. Mole's README explicitly compares its feature set to
      CleanMyMac, AppCleaner, DaisyDisk, and iStat Menus: cache and log removal,
      orphaned app data cleanup, application uninstall plus launch agents and hidden
      remnants, disk-usage inspection, cache rebuilding, service refreshes, and live
      CPU, GPU, memory, disk, and network stats.
  sources:
    - https://github.com/tw93/Mole
    - https://github.com/tw93/Mole/releases
    - https://mole.fit/
    - https://ports.macports.org/port/mole-cleaner/
  summary:
    - >
      Mole is a macOS cleanup and maintenance tool published under the tw93/Mole GitHub
      project. Its README presents the CLI as free and open source and describes it as a
      terminal tool for cleaning, uninstalling, analyzing, optimizing, and monitoring a
      Mac. The same project links a native Mole for Mac app that adds visual cleanup
      review, app updates, uninstall workflows, maintenance tools, disk maps, live
      status, and a menu-bar HUD.
  usage:
    - >
      Package-manager adoption is macOS-focused. Homebrew, MacPorts, and Nix carry it as
      a command-line utility, while the upstream project separates the free CLI from the
      paid native app. Public source-backed history beyond the repository and product
      site is thin, so this entry treats Mole as a young package-manager-visible Mac
      maintenance utility rather than making claims about its origin story or broader
      adoption.
