id: brew:cargo-instruments
display-name: cargo-instruments
repo: null
docs:
  - https://github.com/cmyr/cargo-instruments#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages cargo-instruments as a formula, and the official README presents
      brew install cargo-instruments as the simplest installation path. Crates.io
      metadata reported 47,159 downloads and version 0.4.17 when checked on 2026-06-30.
  package-nerd-significance:
    - >
      It is a niche but useful bridge between the Rust package workflow and Apple's
      native profiler, notable because it exposes Instruments through a cargo subcommand
      instead of requiring users to manually stage and launch binaries.
  project-history:
    - >
      The crate first appeared on crates.io in March 2019 and remains a macOS-focused
      tool: the official README says it requires macOS because it uses Instruments,
      selecting either the older instruments command or xcrun xctrace depending on the
      macOS version.
  related-projects:
    - >
      Related tooling includes Cargo itself and Xcode Instruments; cargo-instruments
      delegates profiling to Apple's Instruments/xctrace tooling.
  sources:
    - https://api.github.com/repos/cmyr/cargo-instruments
    - https://github.com/cmyr/cargo-instruments
    - https://github.com/cmyr/cargo-instruments#readme
    - https://crates.io/api/v1/crates/cargo-instruments
    - https://formulae.brew.sh/api/formula/cargo-instruments.json
  summary:
    - >
      cargo-instruments is a Cargo subcommand for profiling Rust binaries with Apple's
      Xcode Instruments. Its README describes it as glue between Cargo and Xcode's
      profiling suite, producing trace files that can be opened in Instruments.app.
  timeline:
    - '2019: First crates.io release 0.1.0.'
    - '2026: Crates.io latest version 0.4.17 and Homebrew stable version 0.4.17.'
  usage:
    - >
      Users run cargo instruments against a package binary, example, or benchmark
      target, choose an Instruments template such as Allocations or Time Profiler, and
      inspect the generated .trace output under target/instruments or another requested
      path.
