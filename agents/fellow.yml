history:
  adoption-history:
    - >
      After testing with its first customer, Shopify, Fellow launched publicly in 2019
      and developed through several major product generations. The service later
      broadened from collaborative meeting management into enterprise AI-assisted
      recording, transcription, summaries, and meeting intelligence.
  package-nerd-significance:
    - >
      Fellow represents the modern service-backed productivity cask: Homebrew installs
      the desktop client, while calendars, meeting records, integrations, and AI
      processing depend on a hosted workspace. It is especially relevant to teams
      standardizing meeting capture across Zoom, Google Meet, and Microsoft Teams.
  project-history:
    - >
      Fellow was founded in Ottawa in November 2017 by Amin Mirzaee, Aydin Mirzaee, and
      Samuel Cormier-Iijima after their experience managing teams following Fluidware's
      acquisition by SurveyMonkey highlighted problems with meeting coordination.
    - >
      The project began as a meeting-management system for agendas, notes, feedback, and
      action items. In 2023 it introduced AI note-taking, subsequently positioning
      Fellow as a governed meeting assistant for recording, transcription, summaries,
      and follow-up workflows.
  related-projects:
    - >
      Fellow officially integrates with collaboration and knowledge tools including
      Notion and Jira, allowing meeting notes or action items to feed established team
      workflows.
  sources:
    - https://fellow.ai/
    - https://fellow.app/about
    - https://fellow.app/blog/how-to-run-effective-meetings-with-fellow-and-notion/
    - https://help.fellow.app/en/
  summary:
    - >
      Fellow is a hosted meeting-management and AI note-taking platform with desktop
      access, collaborative agendas, transcripts, summaries, and action-item tracking.
  timeline:
    - '2017: Fellow was founded in Ottawa.'
    - '2019: Fellow completed its seed round and public launch.'
    - '2023: Fellow introduced AI note-taking through Copilot.'
  usage:
    - >
      Teams connect their calendars and use Fellow before, during, and after meetings to
      prepare agendas, capture or record discussions, generate summaries, and track
      action items.
    - >
      Administrators can govern recording, access, retention, integrations, and
      workspace-wide meeting policies. No official fixed local configuration or
      credential-file path is documented.
related-packages:
  - id: cask:granola
    reason: >
      Choose Granola when you want a desktop meeting notepad that transcribes computer
      audio without sending a visible note-taking bot into the call, whereas Fellow
      emphasizes governed, organization-wide meeting capture and workflows.
    rel: alternative
    sources:
      - >
        https://docs.granola.ai/help-center/getting-started/setting-up-granola-for-the-first-time
      - https://fellow.ai/
  - id: cask:notion
    reason: >
      Fellow's documented Notion integration sends meeting notes and action items into a
      Notion knowledge workspace for longer-term organization and sharing.
    rel: adjacent_workflow
    sources:
      - https://fellow.app/blog/how-to-run-effective-meetings-with-fellow-and-notion/
      - https://www.notion.com/product
