history:
  adoption-history:
    - >
      By early summer 2016, Lyft was using Envoy for all edge and service-to-service
      networking across more than one hundred services and millions of requests per
      second. That production pedigree made Envoy unusually credible for teams trying to
      move from monoliths to microservices.
    - >
      CNCF's graduation announcement named large-scale users and contributors including
      Airbnb, Booking.com, eBay, F5, Google, IBM, Lyft, Medium, Microsoft, Netflix,
      Pinterest, Salesforce, Square, Stripe, Tencent, Twilio, Verizon, and VSCO. It also
      framed Envoy as an enterprise-ready project with hundreds of contributors and
      thousands of commits by late 2018.
    - >
      Envoy's adoption grew alongside service mesh and cloud-native gateway products.
      CNCF and the Envoy README describe it as a CNCF-hosted project with official
      documentation, release process, security policy, public user and developer lists,
      and related repositories for APIs, examples, and performance testing.
  package-nerd-significance:
    - >
      Envoy matters to package nerds because it is a large, fast-moving, C++
      infrastructure binary whose Homebrew formula gives developers a direct way to
      install and test the same proxy that underpins many Kubernetes and service-mesh
      stacks.
    - >
      It is also a canonical example of a package where the command-line executable is
      only the visible tip of a broader ecosystem: APIs, generated configuration, xDS
      control planes, security releases, service meshes, and gateway products all orbit
      the `envoy` binary.
  project-history:
    - >
      Matt Klein described Envoy as beginning inside Lyft in May 2015 after the company
      found that existing open source options did not fit its microservice networking
      and observability needs. The first MVP was deployed in September 2015, initially
      as Lyft's edge proxy, and it later expanded into sidecar service-to-service
      proxying.
    - >
      Lyft announced Envoy publicly on September 14, 2016, then donated it to CNCF in
      September 2017 as CNCF's eleventh hosted project. CNCF announced Envoy's
      graduation on November 28, 2018, citing neutral governance, multi-organization
      committership, adoption, and community sustainability.
  related-projects:
    - >
      Envoy is closely related to Kubernetes-era service mesh and gateway systems,
      including Istio and Ambassador/API gateway products that use Envoy as a data
      plane.
    - >
      The Envoy project also maintains related repositories and assets for API
      definitions, performance testing, and filter examples.
  sources:
    - https://www.envoyproxy.io/
    - https://www.envoyproxy.io/docs
    - https://github.com/envoyproxy/envoy
    - https://eng.lyft.com/envoy-joins-the-cncf-dc18baefbc22
    - https://www.cncf.io/announcements/2018/11/28/cncf-announces-envoy-graduation/
  summary:
    - >
      Envoy is a high-performance C++ edge, middle, and service proxy created at Lyft
      and later hosted by the Cloud Native Computing Foundation. It became important to
      cloud-native operators because it moved common network behavior out of application
      libraries and into a language-agnostic proxy process.
    - >
      Package-manager users most often encounter Envoy as the standalone `envoy` binary
      used for local configuration testing, service-mesh sidecars, gateways, and proxy
      experiments. Its popularity is tied less to a traditional Unix CLI workflow than
      to the way it became a common data plane for Kubernetes-era networking.
  timeline:
    - '2015-05: Envoy development began at Lyft.'
    - '2015-09: MVP deployed at Lyft, initially as an edge proxy.'
    - '2016-06: Fully deployed at Lyft for edge and service-to-service networking.'
    - '2016-09-14: Lyft publicly announced Envoy.'
    - '2017-09: Envoy joined CNCF as its eleventh hosted project.'
    - '2018-11-28: CNCF announced Envoy graduation.'
  usage:
    - >
      Envoy runs out of process, so it can sit next to applications written in any
      language or runtime. Its documented feature set includes HTTP/2, gRPC, load
      balancing, retries, timeouts, circuit breaking, rate limiting, stats, logging,
      tracing, external authorization, and a rich configuration API.
    - >
      Common package-level use cases are starting a local Envoy binary with an explicit
      configuration file, validating proxy behavior in development, running it as a
      sidecar in service mesh deployments, or using it as an edge or middle proxy in
      front of applications.
related-packages:
  - id: brew:egctl
    reason: >
      Use egctl alongside Envoy when operating Envoy Gateway, whose control plane
      translates Kubernetes Gateway API resources into xDS configuration for managed
      Envoy Proxy instances.
    rel: adjacent_workflow
    sources:
      - https://gateway.envoyproxy.io/docs/concepts/proxy/
      - https://gateway.envoyproxy.io/latest/tasks/operations/egctl/
  - id: brew:istioctl
    reason: >
      Use istioctl to install and inspect an Istio mesh whose sidecar data plane deploys
      Envoy proxies beside workloads and configures them through Istio's control plane.
    rel: adjacent_workflow
    sources:
      - https://istio.io/latest/docs/overview/dataplane-modes/
      - https://istio.io/latest/docs/reference/commands/istioctl/
