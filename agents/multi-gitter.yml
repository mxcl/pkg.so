    - https://formulae.brew.sh/formula/multi-gitter
    - https://github.com/lindell/multi-gitter
  summary:
    - >
      multi-gitter is a Go command-line tool from the lindell/multi-gitter project for
      making the same scripted change across many Git repositories. Its README frames
      the core workflow as running any script or program inside each selected
      repository, then creating pull requests wherever the script changed files; it also
      supports manual merging or automatic merging after CI succeeds. The project fits
      the multi-repository maintenance niche that grew around microservices and internal
      shared libraries: dependency bumps, pull-request-template synchronization,
      search-and-replace edits, lint fixes, and mechanical refactors that would be
      tedious to apply repository by repository.
  usage:
    - >
      In practice, users point multi-gitter at an organization, user, or explicit
      repository list, provide a branch name and commit message, and let their own Bash,
      Python, Node.js, Go, or other script do the actual edit. That keeps the tool
      narrower than a refactoring framework: it handles checkout, fan-out, commits, pull
      requests, reviewer/CI integration, and provider tokens, while users keep using
      ordinary scripts for the content change. Its package-manager niche is a
      developer-automation CLI distributed through Homebrew, MacPorts, and Scoop, useful
      for teams that chose many repositories instead of a monorepo.
