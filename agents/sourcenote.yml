history:
  adoption-history:
    - >
      SourceNote was released for other users after its author had adopted it as a daily
      tool in his own programming workflow.
    - >
      The application targets programmers and writers who want a low-friction,
      searchable place for temporary snippets without creating extra documents or
      leaving their current application.
  package-nerd-significance:
    - >
      SourceNote turns an ephemeral clipboard action into a lightweight snippet archive:
      copying twice can preserve text without interrupting work.
    - >
      Its local note storage and JSON or CSV export suit users who value inspectable,
      portable data, although the official documentation does not describe a source-code
      repository or extensibility ecosystem.
  project-history:
    - >
      Devin Abbott created SourceNote to solve a personal programming problem:
      preserving code that might be useful later without leaving it commented in a
      codebase or accumulating unsaved scratch documents.
    - >
      The resulting macOS application runs a lightweight clipboard helper, creates notes
      through a double-copy gesture or configurable shortcut, and provides built-in
      editing and search.
  related-projects:
    - >
      SourceNoteClipboard is the lightweight login helper used to watch the macOS
      clipboard for note-creation gestures.
    - >
      Clipboard-history utilities and snippet managers address related workflows, while
      SourceNote emphasizes deliberately curated, searchable text notes.
  sources:
    - https://www.sourcenoteapp.com/
    - https://www.sourcenoteapp.com/documentation
  summary:
    - >
      SourceNote is a macOS text-snippet and notes application by Devin Abbott. It acts
      as a curated clipboard history, allowing text from any application to be saved
      quickly and searched later.
  timeline:
    - >
      Origin: Devin Abbott wrote SourceNote to improve his own programming workflow and
      later released it for others with similar needs.
  usage:
    - >
      Press Copy twice within one second, or use a configured shortcut, to save selected
      text as a permanent local note.
    - >
      Edit and search notes inside SourceNote, search across the collection, and export
      the full collection as JSON or CSV.
