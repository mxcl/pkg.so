credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions cover Homebrew, Nix, Cargo, source
      installation, and a Linux install script. That places funzzy in the small-tool
      ecosystem where developers can install the same workflow runner through a language
      package manager or an OS package manager.
  package-nerd-significance:
    - >
      funzzy is interesting as a package because it packages the Unix `entr` idea in a
      Rust binary with a declarative YAML workflow file. It sits between a raw file
      watcher and a full build system: small enough to install as a CLI, but structured
      enough to encode repeated local checks.
  project-history:
    - >
      The project is authored by Cristian Oliveira and is packaged as the `funzzy` crate
      with two binaries, `funzzy` and the short alias `fzz`. The Cargo manifest
      identifies the package as MIT licensed and points to the GitHub repository as the
      official source.
    - >
      The README frames the tool around local developer workflows, especially personal
      automated checks similar to GitHub Actions. Its configuration evolved from a
      simple `.watch.yaml` task list into richer formats that share common watch rules
      and nest task groups.
  related-projects:
    - The README explicitly cites antr and entr as inspirations.
    - >
      The README notes that yq and nrr pair well with funzzy for extracting commands or
      speeding JavaScript and TypeScript task execution.
  sources:
    - https://github.com/cristianoliveira/funzzy
    - https://github.com/cristianoliveira/funzzy/blob/master/Cargo.toml
    - https://github.com/cristianoliveira/funzzy/blob/master/README.md
    - https://github.com/cristianoliveira/funzzy/blob/master/docs/USAGE.md
    - https://github.com/cristianoliveira/funzzy/releases/tag/v1.0.0
  summary:
    - >
      funzzy is a Rust command-line file watcher and task runner that watches paths and
      runs configured shell commands when matching files change. Its README describes it
      as a lightweight watcher inspired by antr and entr, with workflows defined in YAML
      or by piping file lists on standard input.
  timeline:
    - >
      2023: v1.0.0 release notes describe cancellable tasks, filters, command templates,
      and improved output feedback.
    - 'v1.4.0: README examples document fail-fast and non-blocking workflow usage.'
    - >
      v1.6.0: Documentation introduces common rules and nested groups for reducing
      duplicated watch patterns.
  usage:
    - >
      A typical workflow starts with `funzzy init`, which creates `.watch.yaml`; running
      `funzzy` or `fzz` then watches the configured paths and runs matching commands.
      The docs also support one-off shell pipelines such as feeding changed files into
      `funzzy 'command {{relative_path}}'`.
    - >
      The configuration format supports command lists, glob-style change patterns,
      ignore patterns, tasks that run on initialization, target filtering, fail-fast
      mode, non-blocking cancellation of long-running tasks, and alternate config files
      via `-c` or `--config`.
related-packages:
  - id: brew:entr
    reason: >
      Choose entr for a smaller Unix-style workflow where a file list is piped on
      standard input and one command is rerun, instead of maintaining Funzzy's YAML task
      configuration.
    rel: alternative
    sources:
      - https://github.com/cristianoliveira/funzzy
      - https://eradman.com/entrproject/
      - https://github.com/eradman/entr
  - id: brew:watchexec
    reason: >
      Choose watchexec for a cross-platform command rerunner configured primarily
      through command-line watch and ignore options; choose Funzzy when you want
      reusable multi-job YAML workflows and explicit run-state reporting.
    rel: alternative
    sources:
      - https://github.com/cristianoliveira/funzzy
      - https://watchexec.github.io/docs
      - https://github.com/watchexec/watchexec
