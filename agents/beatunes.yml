history:
  adoption-history:
    - >
      The 2006 announcement described beaTunes as an iTunes add-on used particularly by
      DJs, athletes, and audiophiles. Its playlist matching, tempo analysis, and
      metadata-repair workflow addressed both performance-oriented and personal
      music-library use.
    - >
      The application subsequently supported both iTunes or Music.app libraries and
      folder-based libraries. It remains a cross-platform desktop product for macOS and
      Windows.
  package-nerd-significance:
    - >
      beaTunes represents the specialist class of desktop music-library tools that
      augment a general media player with acoustic analysis and metadata quality
      control. Package users value it for BPM and key analysis, duplicate detection, tag
      inspection, and rule-based playlist construction.
  project-history:
    - >
      beaTunes began in 2006 as a companion for iTunes, centered on analyzing music and
      building better playlists. An official anniversary account dates its earliest
      distribution to July 2006, while version 1.1 was announced in December that year.
    - >
      Over time, its analysis expanded to cover tempo, musical key, loudness, acoustic
      fingerprints, similarity, segmentation, and color or timbre-related metadata. Its
      library model also expanded beyond iTunes to support folder-based collections.
  related-projects:
    - >
      beaTunes can work with Apple iTunes and Music.app libraries or directly with
      folder-based music libraries.
    - >
      Official documentation also describes optional metadata-related workflows
      involving services such as Last.fm and AcousticBrainz.
  sources:
    - >
      Official 2006 release announcement:
      https://blog.beatunes.com/2006/12/beatunes-11-is-released.html
    - 'Official FAQ: https://www.beatunes.com/en/beatunes-faq.html'
    - 'Official product page: https://www.beatunes.com/en/'
    - >
      Official tenth-anniversary account:
      https://blog.beatunes.com/2016/07/10-year-anniversary-sale.html
  summary:
    - >
      beaTunes is a commercial music-library analysis and playlist application for macOS
      and Windows. It analyzes acoustic and metadata properties, detects
      inconsistencies, and helps users construct matching playlists.
  timeline:
    - '2006: beaTunes was first distributed as an iTunes-oriented music analysis tool.'
    - >
      2006: Version 1.1 added and refined analysis, playlist matching, metadata
      correction, and multi-core support.
    - >
      Later development: Folder-based libraries and deeper acoustic and metadata
      analysis broadened its role beyond an iTunes add-on.
  usage:
    - >
      Users analyze tracks to obtain properties such as BPM, key, loudness, similarity,
      segmentation, and acoustic fingerprints, then inspect suspected metadata
      inconsistencies.
    - >
      Rule-based matching can suggest songs or assemble playlists for DJ sets, exercise,
      events, or ordinary listening. The application can synchronize supported changes
      with iTunes or Music.app or work directly on folder-based libraries.
