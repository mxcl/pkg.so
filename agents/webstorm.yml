id: cask:webstorm
display-name: WebStorm
repo: null
docs:
  - https://www.jetbrains.com/help/webstorm
config-file-location:
  linux:
    - ~/.config/JetBrains/WebStorm<version>
  macos:
    - ~/Library/Application Support/JetBrains/WebStorm<version>
  windows:
    - '%APPDATA%\JetBrains\WebStorm<version>'
credentials-file-location: null
history:
  adoption-history:
    - >
      WebStorm became an established commercial IDE for JavaScript and front-end
      development, particularly among developers using the wider JetBrains tool family.
      JetBrains presents it as a batteries-included alternative to assembling a
      web-development environment from a lightweight editor and numerous extensions.
    - >
      In 2024, JetBrains made the full WebStorm IDE free for qualifying non-commercial
      work, including learning, hobby development, content creation, and unpaid
      open-source contributions, while retaining commercial subscriptions.
  package-nerd-significance:
    - >
      WebStorm is a large, frequently updated proprietary developer package built on the
      IntelliJ Platform. It integrates JavaScript and TypeScript tooling, package
      managers, build tools, testing, debugging, version control, and an extension
      marketplace while maintaining version-specific per-user configuration directories.
  project-history:
    - >
      JetBrains released WebStorm 1.0 on May 27, 2010 alongside PhpStorm 1.0. It
      originated as a language-specific IDE for web technologies and evolved with the
      JavaScript ecosystem to support TypeScript, Node.js, and major client-side
      frameworks.
  related-projects:
    - IntelliJ IDEA
    - IntelliJ Platform
    - PhpStorm
    - JetBrains Toolbox App
  sources:
    - 'Official 1.0 announcement: https://blog.jetbrains.com/blog/2010/05/27/pr_270510/'
    - >
      Official directory documentation:
      https://www.jetbrains.com/help/webstorm/directories-used-by-the-ide-to-store-settings-caches-plugins-and-logs.html
    - >
      Official non-commercial licensing announcement:
      https://blog.jetbrains.com/blog/2024/10/24/webstorm-and-rider-are-now-free-for-non-commercial-use/
    - 'Official product page: https://www.jetbrains.com/webstorm/'
  summary:
    - >
      WebStorm is JetBrains' cross-platform integrated development environment for
      JavaScript, TypeScript, and related web technologies.
  timeline:
    - '2010: JetBrains released WebStorm 1.0.'
    - >
      Subsequent releases: WebStorm expanded alongside TypeScript, Node.js, and
      successive generations of web frameworks and tooling.
    - '2024: JetBrains made WebStorm free for qualifying non-commercial use.'
  usage:
    - >
      Developers use WebStorm for code editing, analysis, navigation, refactoring,
      debugging, testing, version control, and running JavaScript and TypeScript
      toolchains. User settings reside in a versioned operating-system-specific
      configuration directory; project-specific IDE metadata is commonly kept in each
      project's .idea directory.
