history:
  adoption-history:
    - >
      The application evolved from a Quick Look-oriented package previewer into a full
      macOS application, while retaining Finder integration. Later releases added a
      command-line tool, AppleScript support, saved searches, package comparison,
      entitlement inspection, and manifest export.
  package-nerd-significance:
    - >
      Suspicious Package is useful to package maintainers and cautious macOS users
      because it exposes payload paths, ownership, permissions, installer scripts,
      signatures, entitlements, receipts, and other metadata without performing the
      installation.
  project-history:
    - >
      Mothers Ruin Software first released Suspicious Package in January 2008. Version 2
      expanded package and signature inspection, and version 3 in 2016 introduced the
      standalone application that bundles its Quick Look integration and provides
      Finder-like payload browsing.
  related-projects:
    - >
      Apple Installer and macOS package receipts provide the formats inspected by the
      application.
    - >
      Mothers Ruin Software's Apparency and Archaeology are related inspection utilities
      referenced by the official site.
  sources:
    - https://www.mothersruin.com/software/SuspiciousPackage/faq.html
    - https://www.mothersruin.com/software/SuspiciousPackage/relnotes.html
    - https://www.mothersruin.com/software/SuspiciousPackage/use.html
  summary:
    - >
      Suspicious Package is a long-running macOS utility from Mothers Ruin Software for
      examining installer packages before installation.
  timeline:
    - '2008: Initial release of Suspicious Package.'
    - '2014: Version 2 added broader payload, script, signature, and certificate inspection.'
    - '2016: Version 3 debuted the full application with bundled Quick Look integration.'
    - '2018: The spkg command-line tool was introduced.'
    - '2021: Version 4 expanded package analysis and modernized platform support.'
  usage:
    - >
      Open a macOS installer package to browse its payload, inspect scripts and security
      metadata, review flagged issues, export selected files, or create manifests for
      comparing package revisions. The tool provides evidence for manual review; the
      official FAQ explicitly says it does not determine whether a package is malware.
