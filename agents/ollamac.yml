history:
  adoption-history:
    - >
      The official installation instructions support both GitHub releases and the
      Homebrew cask, making Ollamac convenient for macOS users who already manage
      desktop applications through Homebrew.
  package-nerd-significance:
    - >
      Ollamac represents the lightweight native-client layer around Ollama: model
      storage and inference remain with Ollama, while the cask supplies a macOS-native
      chat interface with configurable host support.
  project-history:
    - >
      Kevin Hermawan created Ollamac as a free and open-source native Mac application
      for Ollama. Its implementation draws on the maintainer's OllamaKit and several
      SwiftUI-oriented open-source components.
  related-projects:
    - Ollama provides the local model runtime that Ollamac expects.
    - OllamaKit, also maintained by Kevin Hermawan, is acknowledged as a supporting component.
    - BoltAI is identified by the project as another macOS client capable of using Ollama.
  sources:
    - https://github.com/kevinhermawan/Ollamac#readme
  summary:
    - >
      Ollamac is a native macOS client for chatting with models served by Ollama. It
      emphasizes a simple local interface, syntax highlighting, configurable Ollama
      hosts, and compatibility with all models exposed by Ollama.
  timeline:
    - >
      The official README documents distribution through both GitHub Releases and the
      Homebrew cask.
  usage:
    - >
      Install Ollama first, pull at least one model, then install Ollamac from its
      GitHub releases or with `brew install --cask ollamac`. Ollamac can use the local
      Ollama service or another configured Ollama host.
