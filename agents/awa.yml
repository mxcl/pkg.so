history:
  adoption-history:
    - >
      AWA reports that its catalog grew from more than 55 million tracks in 2019 to 150
      million in 2024 and 200 million in 2026. By its fourth anniversary it reported
      more than 18 million cumulative downloads, about 11 million playlists, and more
      than 10 billion plays.
    - >
      The service expanded beyond conventional on-demand streaming through community
      playlists, comments, and AWA Lounge live audio events. Its ninth-anniversary
      announcement reported participation by more than 1,000 artists in Lounge.
  package-nerd-significance:
    - >
      AWA is chiefly a hosted subscription service, but its native Mac and Windows
      clients make it relevant to desktop package catalogs. The Homebrew cask packages
      the vendor's proprietary Mac distribution rather than a public source build.
  project-history:
    - >
      AWA launched in Japan on May 27, 2015 as a subscription music-streaming service.
      It emphasized discovery through human-curated and user-created playlists and later
      broadened the product with comments and the social live-audio space AWA Lounge.
  related-projects:
    - AWA Lounge is the service's live audio and shared-listening environment.
    - Homebrew Cask supplies the awa package-manager entry represented by this record.
  sources:
    - 'Official AWA help center: https://guide.awa.fm/hc/en-us'
    - 'Official AWA homepage: https://awa.fm/'
    - >
      Official eleventh-anniversary announcement:
      https://news.awa.fm/jpn/2026/5/28/11th-anniversary
    - 'Official fourth-anniversary history: https://news.awa.fm/jpn/5/27/awa-4th-anniversary'
    - >
      Official ninth-anniversary announcement:
      https://news.awa.fm/jpn/2024/6/3/awa9thanniversary
  summary:
    - >
      AWA is a Japanese subscription music-streaming service launched in 2015. It
      combines on-demand and offline listening with recommendations, lyrics, playlists,
      and the AWA Lounge live community feature.
  timeline:
    - '2015: AWA launched as a subscription music-streaming service on May 27.'
    - '2019: AWA reported 55 million-plus tracks and more than 18 million cumulative downloads.'
    - '2024: The catalog passed 150 million tracks as AWA marked its ninth anniversary.'
    - '2026: AWA marked eleven years and announced a catalog exceeding 200 million tracks.'
  usage:
    - >
      Listeners use AWA on phones, tablets, Mac, Windows, watches, televisions, cars,
      voice assistants, and casting devices. The paid Standard plan supports
      unrestricted full and offline playback; the Free plan provides limited listening
      without advertising.
    - >
      Desktop users create an account or sign in with supported identity methods, then
      stream music, manage playlists, view synchronized lyrics, and receive
      recommendations. The official help material does not document a supported local
      configuration or credentials file.
