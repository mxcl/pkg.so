history:
  adoption-history:
    - >
      USB Overdrive has remained in use across successive Mac operating-system
      generations; the developer states that it has been available for approximately 25
      years and continues to honor original registration codes. Its broad device model
      gave Mac users a common configuration layer for peripherals from many
      manufacturers.
  package-nerd-significance:
    - >
      USB Overdrive is a long-lived example of third-party Mac driver software
      distributed outside the Mac App Store. Packaging and upgrading it requires
      attention to privileged driver components, login helpers, operating-system
      compatibility, and Apple's evolving extension-approval model.
  project-history:
    - >
      USB Overdrive was created as a configurable driver for third-party Mac input
      devices. It supports mice, keyboards, trackballs, joysticks, gamepads, and other
      compliant USB or Bluetooth controllers, with global, per-application, and
      per-device mappings.
    - >
      The software was rewritten for Mac OS X in 2008. Later generations added 64-bit
      support, broader Bluetooth and keyboard handling, and compatibility changes for
      successive macOS releases. Version 5 replaced the older preference-pane-oriented
      interface with an application and modern system extension.
  related-projects:
    - macOS HID drivers
    - SteerMouse
    - Logitech device software
  sources:
    - 'Official downloads and release history: https://www.usboverdrive.com/downloads/'
    - 'Official information: https://www.usboverdrive.com/information/'
    - 'Official licensing history: https://www.usboverdrive.com/why-buy/'
    - 'Official support documentation: https://www.usboverdrive.com/support/'
  summary:
    - >
      USB Overdrive is a macOS driver and configuration utility for remapping and tuning
      third-party USB and Bluetooth input devices.
  timeline:
    - >
      Circa 2001: USB Overdrive entered long-term commercial distribution, based on the
      developer's approximately 25-year product history and sales history.
    - '2008: The software was rewritten from scratch for Mac OS X.'
    - >
      2009: Version 3.0 added Snow Leopard 64-bit support, a new low-level engine,
      device-specific settings, and import/export support.
    - >
      2021: Version 5 introduced Big Sur compatibility and an application-based
      interface in place of the System Preferences pane.
    - >
      2020s: Version 5 releases continued adapting the system extension and application
      to newer macOS generations.
  usage:
    - >
      Users configure buttons, wheels, keys, switches, pointer behavior, and scrolling
      globally or for a particular device and application. Common assignments include
      mouse clicks, keyboard shortcuts, scrolling, application launching, and document
      opening.
