history:
  adoption-history:
    - >
      SelfControl has remained a volunteer-maintained open-source utility and has
      accumulated contributions and translations from its community. The official
      project reports translations into twelve languages, while its intentionally strict
      blocking behavior has defined its niche among focus tools.
  package-nerd-significance:
    - >
      SelfControl is notable for making a deliberately irreversible timer the core
      feature: quitting the app, restarting the Mac, or deleting the application does
      not end an active block. Its GPL source, privileged helper, packet-filter
      integration, reusable blocklist files, and bundled CLI also make it unusually
      inspectable and scriptable for a desktop focus utility.
  project-history:
    - >
      SelfControl originated at Eyebeam and was developed by Charlie Stigler, Steve
      Lambert, and contributors as free software under the GNU GPL. Source headers
      document development in 2009, and the project later moved through pre-2.0, 2.x,
      3.x, and 4.x generations while remaining specific to macOS.
  related-projects:
    - >
      selfcontrol-cli is the command-line helper bundled inside SelfControl.app for
      scripted blocks and status checks.
    - Saved .selfcontrol blocklist files allow lists to be reused or transferred between Macs.
    - >
      SelfControl's privileged helper applies and preserves an active block
      independently of the main user interface.
  sources:
    - >
      Official CLI source with 2009 origin header:
      https://github.com/SelfControlApp/selfcontrol/blob/master/cli-main.m
    - 'Official FAQ: https://github.com/SelfControlApp/selfcontrol/wiki/FAQ'
    - >
      Official command-line guide:
      https://github.com/SelfControlApp/selfcontrol/wiki/Running-SelfControl-from-the-Terminal
    - 'Official homepage: https://selfcontrolapp.com/'
    - 'Official repository README: https://github.com/SelfControlApp/selfcontrol'
  summary:
    - >
      SelfControl is a free, GPL-licensed macOS application that blocks selected
      websites, mail servers, or other Internet destinations for a user-chosen period.
      An active block is designed to survive application removal and system restarts
      until its timer expires.
  timeline:
    - '2009: Source headers document SelfControl development at Eyebeam.'
    - '2013: The official wiki documents building SelfControl from source.'
    - '2014: SelfControl 2.0 is the recommended replacement for pre-2.0 releases.'
    - '2021: The project documents the command-line interface for SelfControl 4.x.'
  usage:
    - >
      Users create a blocklist or allowlist, select a duration, and start a block that
      cannot normally be cancelled early. Lists can be saved as .selfcontrol files.
      Advanced users can invoke the bundled selfcontrol-cli with a blocklist, ISO-8601
      end time, and optional JSON settings; the project recommends testing short blocks
      because shared hosting, DNS behavior, VPNs, and proxies can affect results.
