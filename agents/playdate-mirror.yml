history:
  adoption-history:
    - >
      Panic distributes Mirror for macOS, Windows, and several Linux families, making
      Playdate capture available beyond the platform used for the Homebrew cask.
    - >
      Its role expanded beyond streaming and recording to accessibility: a connected
      computer can enlarge the Playdate display, route audio to assistive equipment, and
      translate standard controller, keyboard, or mouse input into Playdate controls.
  package-nerd-significance:
    - >
      Mirror is a small cross-platform hardware companion that turns Playdate's USB
      connection into a live audiovisual and input bridge. It is useful to streamers,
      reviewers, developers, accessibility users, and anyone who wants a larger display.
    - >
      The Playdate SDK exposes callbacks for games to detect Mirror sessions, showing
      that Mirror is integrated into the platform rather than being an unrelated
      screen-capture utility.
  project-history:
    - >
      Panic developed Mirror as the official desktop companion for routing a connected
      Playdate's screen and audio to a computer in real time.
    - >
      Subsequent releases improved the companion while Playdate OS and the SDK added
      explicit Mirror lifecycle callbacks, allowing games to react when mirroring begins
      or ends.
  related-projects:
    - Playdate is Panic's handheld game system and the required source device.
    - >
      The Playdate SDK documents `playdate.mirrorStarted()` and `playdate.mirrorEnded()`
      callbacks for software that needs to adjust behavior during a Mirror session.
  sources:
    - https://devforum.play.date/c/announcement/40
    - https://help.play.date/games/mirror/
    - https://play.date/mirror/
    - https://sdk.play.date/changelog/
  summary:
    - >
      Playdate Mirror is Panic's official cross-platform companion application for
      displaying, recording, streaming, and controlling a USB-connected Playdate through
      a computer.
  timeline:
    - '2024-09-07: Panic announced Mirror 1.2.0.'
    - '2025-04-23: Playdate SDK 2.7.0 added Mirror session callbacks.'
    - '2025-11-27: Panic announced Mirror 1.3.0.'
    - '2026-05-29: Panic announced Mirror 1.4.0.'
  usage:
    - >
      Connect and unlock a Playdate over USB, launch Mirror, and the handheld's display
      and audio appear on the computer in real time.
    - >
      Mirror can record MP4 captures, provide a window to streaming software, enlarge
      the display, route audio, and accept alternative input from standard controllers,
      keyboards, or a mouse.
    - >
      Recordings default to the Playdate's native 400-by-240 resolution; the documented
      2x capture option produces 800-by-480 output.
