history:
  adoption-history:
    - >
      The original Mac utility attracted user feedback soon after its 2006 public
      release and grew into a cross-platform password-management product. Version 7
      supported both 1Password memberships and, on Mac, separately licensed standalone
      vaults, making it a bridge between the product's local-vault era and its
      account-centered service.
    - >
      1Password now directs users toward version 8. Its official support material says
      version 7 will be retired starting in early 2027 and will then stop reflecting
      changes made in a 1Password account.
  package-nerd-significance:
    - >
      The versioned Homebrew cask preserves access to the older native 1Password
      generation for users who require its standalone-vault workflow or compatibility
      with older systems. It also illustrates the packaging challenges around
      security-sensitive, proprietary desktop applications whose major versions have
      materially different architectures and support policies.
  project-history:
    - >
      1Password began as an internal form-filling tool created by Roustem Karimov and
      Dave Teare in 2005. The first public version, then called 1Passwd, was uploaded on
      May 19, 2006.
    - >
      1Password 7 for Mac entered public beta in March 2018 and launched in May 2018.
      The release introduced a rebuilt single-process architecture, a redesigned
      interface, account and vault organization, and an expanded Watchtower security
      suite. A corresponding rebuilt Windows release followed on May 29, 2018.
  related-projects:
    - 1Password 8 is the supported successor generation.
    - >
      1Password browser extensions provide browser saving and filling alongside the
      desktop application.
  sources:
    - >
      Official Mac 7 announcement:
      https://1password.com/blog/1password-7-for-mac-the-best-ever
    - >
      Official Windows 7 announcement:
      https://1password.com/blog/1password-7-for-windows-the-best-ever
    - 'Official company history: https://1password.com/blog/accel-partnership'
    - 'Official support lifecycle notice: https://support.1password.com/add-account/'
    - 'Official system requirements: https://support.1password.com/system-requirements/'
  summary:
    - >
      1Password 7 is the 2018 generation of 1Password's password manager. It stores
      passwords and other sensitive records in encrypted vaults, fills sign-in details,
      generates passwords, and uses Watchtower to flag security problems.
  timeline:
    - >
      2005: Roustem Karimov and Dave Teare began developing the tool for their own
      web-development work.
    - '2006: The first public version, named 1Passwd, was released on May 19.'
    - '2018: 1Password 7 for Mac and Windows launched.'
    - 'Early 2027: 1Password plans to retire version 7 account synchronization.'
  usage:
    - >
      Users unlock the app with their account password, organize sensitive items into
      vaults, and use the desktop app and browser integration to save and fill
      credentials. Version 7 can export 1PIF, CSV, or tab-delimited data; exported files
      are unencrypted and must be handled carefully.
