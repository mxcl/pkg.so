config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package was first uploaded to PyPI as 1.3.0 in December 2017 and was still
      being released as 5.17.3 in June 2026. The batch package metadata also lists
      Homebrew distribution, making it available to macOS and Linux users who prefer
      system package managers over pip.
    - >
      The official README advertises PyPI version and download badges and the docs link
      to a web application frontend, which points to usage beyond local scripting.
  package-nerd-significance:
    - >
      checkdmarc matters to package nerds because it sits at the intersection of DNS
      operations, email authentication, and Python packaging. It turns a set of fiddly
      RFC-driven DNS checks into an installable command that can be upgraded through
      PyPI or Homebrew.
    - >
      Its dependency and changelog history also show the maintenance burden common to
      security-adjacent CLIs: protocol changes, cryptography/OpenSSL dependency updates,
      DNS edge cases, and output stability all need to ship quickly.
  project-history:
    - >
      The upstream repository was created under domainaware in December 2017, and the
      project metadata describes checkdmarc as a Python module and command-line parser
      for SPF and DMARC records. The official documentation later expanded the scope to
      CLI, API, and web interfaces for validating SPF, DMARC, BIMI, MX, MTA-STS, SMTP
      TLS reporting, SOA, DNSSEC, and nameserver data.
    - >
      The changelog shows continuing maintenance through the 5.x line, including updates
      for newer DMARC behavior such as RFC 9989 handling and ongoing parser, DNS, TLS,
      and dependency fixes.
  related-projects:
    - >
      checkdmarc-web-frontend is the related web interface linked from the official
      documentation.
    - >
      dnspython, SPF, DMARC, BIMI, MTA-STS, and SMTP TLS reporting are adjacent
      technologies that define much of the tool's job.
  sources:
    - https://github.com/domainaware/checkdmarc
    - https://domainaware.github.io/checkdmarc/
    - https://github.com/domainaware/checkdmarc/blob/master/CHANGELOG.md
    - https://pypi.org/project/checkdmarc/
  summary:
    - >
      checkdmarc is a Python module and command-line tool for validating DNS records
      used by email authentication, especially SPF and DMARC. Its package-manager
      significance comes from packaging operational email-security checks as a
      repeatable CLI rather than a one-off DNS debugging script.
  timeline:
    - '2017: domainaware/checkdmarc repository created and 1.3.0 uploaded to PyPI.'
    - >
      2025: Official Sphinx documentation described checkdmarc as a module, CLI, and web
      application for SPF and DMARC validation.
    - '2026: 5.17.3 released with Python metadata and validation fixes.'
  usage:
    - >
      Typical usage is to run the checkdmarc executable against one or more domains and
      inspect machine-readable JSON or CSV output. The tool is aimed at operators who
      need to validate SPF and DMARC records and related email-security DNS
      configuration.
    - >
      Because it is also a Python module, the same checks can be embedded into
      automation or reporting pipelines instead of being used only as an interactive
      CLI.
