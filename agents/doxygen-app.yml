id: cask:doxygen-app
display-name: Doxygen
repo: https://github.com/doxygen/doxygen
docs:
  - https://www.doxygen.nl/manual/config.html
  - https://www.doxygen.nl/manual/doxygen_usage.html
  - https://www.doxygen.nl/manual/index.html
  - https://www.doxygen.nl/manual/starting.html
config-file-location:
  unix:
    - ./Doxyfile
  windows:
    - .\Doxyfile
credentials-file-location: null
history:
  adoption-history:
    - >
      The official repository calls Doxygen the de facto standard for generating
      documentation from annotated C++ sources. Its language support expanded beyond C++
      to include C, Objective-C, C#, Java, Python, PHP, Fortran, VHDL, and other
      languages.
    - >
      Doxygen became common in source distributions because it can produce browsable
      HTML, manuals, man pages, XML, and other formats while also extracting structure
      from undocumented code. Graph generation and cross-project tag files support
      larger codebases.
  package-nerd-significance:
    - >
      Doxygen is a long-lived staple of developer-tool package collections and build
      pipelines. Its text-based Doxyfile makes documentation generation reproducible,
      while Doxywizard supplies a desktop front end over the same configuration model.
    - >
      For package maintainers, Doxygen is important both as an end-user documentation
      tool and as a build-time dependency used to produce API references from source
      releases.
  project-history:
    - >
      Doxygen has been maintained by Dimitri van Heesch since 1997. It was designed to
      generate reference documentation directly from source code and annotations while
      supporting several output formats.
    - >
      The project moved from Subversion to Git hosted on GitHub in May 2013. It
      continues to publish a detailed official manual and regular source releases.
  related-projects:
    - Doxywizard is Doxygen's graphical configuration front end.
    - Graphviz is commonly used by Doxygen to generate dependency and relationship diagrams.
    - CMake includes integration for adding Doxygen documentation targets.
  sources:
    - 'Official manual overview: https://www.doxygen.nl/manual/index.html'
    - >
      Official release chronology:
      https://github.com/doxygen/doxygen/blob/master/doc_internal/releases.md
    - 'Official repository README: https://github.com/doxygen/doxygen#readme'
  summary:
    - >
      Doxygen is a cross-platform documentation generator, best known for producing API
      references from annotated C and C++ sources while supporting many other languages
      and output formats.
  timeline:
    - "1997: Doxygen's official copyright history begins."
    - 'May 2013: The project moved from Subversion to Git on GitHub.'
  usage:
    - >
      A typical workflow runs `doxygen -g` to create a Doxyfile, edits that file to
      select input and output options, and then runs `doxygen` with the configuration
      file. Doxywizard can create and edit the same configuration through a GUI.
