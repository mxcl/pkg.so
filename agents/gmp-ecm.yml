history:
  adoption-history:
    - >
      GMP-ECM is packaged across Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu,
      and openSUSE families in the batch metadata. That spread reflects its role as a
      reusable scientific computing component rather than a general desktop application.
    - >
      The AUTHORS file shows contributions from number-theory and high-performance
      arithmetic specialists, including work on batch mode, GPU code, Visual C builds,
      expression parsing, primality testing tools, NTT code, and assembly optimizations.
  package-nerd-significance:
    - >
      GMP-ECM matters in packaging because it is the canonical small tool behind a very
      specific algorithmic niche. A distro package gives researchers and
      computational-number-theory users the same tuned implementation without rebuilding
      GMP-linked arithmetic code by hand.
    - >
      Its history is also a reminder that scientific packages often expose both an
      executable and a library ABI; the package is not merely an end-user command but
      part of the factoring stack used by other tools.
  project-history:
    - >
      The project originates with Paul Zimmermann, listed in the AUTHORS file as the
      author of the first version. The codebase later moved to INRIA GitLab, and the
      bundled README notes that the older README text predates that move.
    - >
      Over time GMP-ECM accumulated both command-line and library interfaces. README.lib
      documents ecm_factor, ecm_init, and ecm_clear for applications linking against
      libecm, while the main README documents ecm as a stdin-driven factoring command
      using B1 and B2 bounds.
    - >
      The NEWS file records long-running engineering work: new P-1 and P+1 stage 2
      algorithms in the 6.2 series, GPL/LGPL licensing adjustment in 6.4.1, thread
      safety and GPU stage-1 code in 7.0, and portability fixes through the 7.0.7
      release line.
  related-projects:
    - GMP supplies the multiprecision arithmetic foundation.
    - >
      P-1, P+1, MPQS, and NFS are related factoring methods discussed in the README's
      guidance.
  sources:
    - https://gitlab.inria.fr/api/v4/projects/zimmerma%2Fecm
    - https://gitlab.inria.fr/zimmerma/ecm
    - https://gitlab.inria.fr/zimmerma/ecm/-/raw/master/AUTHORS
    - https://gitlab.inria.fr/zimmerma/ecm/-/raw/master/NEWS
    - https://gitlab.inria.fr/zimmerma/ecm/-/raw/master/README
    - https://gitlab.inria.fr/zimmerma/ecm/-/raw/master/README.lib
  summary:
    - >
      GMP-ECM is a command-line program and library for integer factorization using the
      elliptic curve method, with support for P-1 and P+1 methods. It is a specialist
      number-theory tool built on GMP and used when practitioners need to search for
      medium-sized factors of large composites.
  timeline:
    - >
      2008: Stage 2 improvements for P-1 and P+1 described in the ANTS-VIII paper
      referenced by NEWS.
    - >
      2012: Version 6.4.1 licensing changed to GPL-3-or-later for the binary and
      LGPL-3-or-later for the library.
    - '2020: Public INRIA GitLab project created after earlier hosting.'
    - '2026: Version 7.0.7 tag committed with MacOS fixes and mmap batch-data support.'
  usage:
    - >
      Practitioners feed one composite number per line to ecm and choose a stage-1 bound
      B1, with an optional B2. The README examples cover one-curve ECM runs, multiple
      curves with -c, P-1 with -pm1, P+1 with -pp1, save/resume workflows, and
      expression syntax such as powers and Fermat-number forms.
    - >
      Library users include ecm.h and link against libecm to call ecm_factor from their
      own factoring software. That split lets package managers install both a CLI for
      interactive factor hunting and a library for larger systems.
related-packages:
  - id: brew:pari
    reason: >
      Choose PARI/GP when you need a broader interactive number-theory system whose
      `factorint` combines ECM with SQUFOF, Pollard rho, and MPQS; choose GMP-ECM for
      direct control of dedicated ECM, P-1, and P+1 runs.
    rel: alternative
    sources:
      - https://gitlab.inria.fr/zimmerma/ecm/-/raw/master/README
      - https://pari.math.u-bordeaux.fr/dochtml/html-stable/Arithmetic_functions.html
