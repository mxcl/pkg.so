history:
  adoption-history:
    - >
      Kubebuilder became a foundational tool in the Kubernetes operator ecosystem
      because it is developed with controller-runtime and controller-tools. The README
      explicitly names Operator SDK as an example of a project that uses Kubebuilder as
      a library and plugin system, which made Kubebuilder's conventions visible beyond
      users who install the kubebuilder binary directly.
    - >
      The project is distributed through GitHub releases and Homebrew, but its larger
      adoption story is in generated code: many operator repositories carry
      Kubebuilder-style PROJECT files, Makefiles, RBAC manifests, controller tests, and
      controller-runtime patterns.
  package-nerd-significance:
    - >
      For package nerds, Kubebuilder is one of the important Kubernetes CLIs because
      installing a single binary gives access to a large, opinionated development
      workflow. It is the kind of tool where package version, generated layout version,
      and dependency versions all matter.
    - >
      It also marks the point where Kubernetes extension development moved from
      hand-rolled controller boilerplate toward reproducible project scaffolding. That
      makes the package culturally important even when the final runtime artifact is a
      controller image rather than the kubebuilder binary itself.
  project-history:
    - >
      The kubernetes-sigs/kubebuilder repository was created on 2018-03-14, and the
      first GitHub release listed by the releases API, v1.9-alpha.30, was published on
      2018-03-15. From the start, Kubebuilder sat inside the Kubernetes SIGs ecosystem
      rather than as a third-party wrapper.
    - >
      The Kubebuilder Book frames the project as a way to reduce the boilerplate
      involved in building Kubernetes APIs with CRDs. The README compares its role to
      application frameworks such as Ruby on Rails or Spring Boot: it encodes the
      canonical Kubernetes API-building approach into generators, libraries, plugins,
      and conventions.
    - >
      Over time the project formalized plugin and project versioning. The documentation
      distinguishes Kubebuilder release versions, PROJECT file schema versions, and
      plugin versions, which reflects how a scaffolding tool has to evolve while
      preserving already-generated operator projects.
  related-projects:
    - >
      controller-runtime is the runtime library foundation for Kubebuilder-generated
      controllers.
    - >
      controller-tools supplies code and manifest generation pieces used in the
      Kubebuilder workflow.
    - >
      Operator SDK uses Kubebuilder as a library and extends the workflow for additional
      operator styles.
    - >
      Custom Resource Definitions are the Kubernetes API-extension mechanism Kubebuilder
      targets.
  sources:
    - https://api.github.com/repos/kubernetes-sigs/kubebuilder
    - https://api.github.com/repos/kubernetes-sigs/kubebuilder/releases
    - https://book.kubebuilder.io/
    - https://formulae.brew.sh/formula/kubebuilder
    - https://github.com/kubernetes-sigs/controller-runtime
    - https://github.com/kubernetes-sigs/controller-tools
    - https://github.com/kubernetes-sigs/kubebuilder
    - >
      https://github.com/kubernetes-sigs/kubebuilder/blob/master/docs/book/src/plugins/plugins-versioning.md
    - https://github.com/operator-framework/operator-sdk
  summary:
    - >
      Kubebuilder is the Kubernetes SIG API Machinery framework and CLI for building
      Kubernetes APIs and controllers with Custom Resource Definitions. It scaffolds Go
      projects, controllers, webhooks, manifests, tests, and deployment configuration
      around the controller-runtime and controller-tools libraries.
  timeline:
    - '2018-03-14: GitHub repository created under kubernetes-sigs.'
    - '2018-03-15: GitHub release v1.9-alpha.30 published.'
    - '2018-03-20: GitHub release v1alpha1.0 published for Kubernetes 1.9-era scaffolding.'
    - '2026-06-15: GitHub release v4.15.0 published.'
  usage:
    - >
      Users typically run kubebuilder init to create a project and kubebuilder create
      api to add APIs and controllers. The generated project is then edited as normal Go
      code while Kubebuilder-owned markers and generators keep CRDs, RBAC, and webhook
      manifests synchronized.
    - >
      Kubebuilder is not just a one-shot template generator. Its plugin versioning,
      migrations, and library hooks support long-lived projects that may need to adopt
      newer Kubernetes APIs or scaffolding layouts without abandoning existing code.
related-packages:
  - id: brew:operator-sdk
    reason: >
      Choose Operator SDK when you want an operator-focused toolkit with broader
      language and lifecycle extensions; it uses Kubebuilder's library and plugin system
      underneath its Go scaffolding.
    rel: alternative
    sources:
      - https://github.com/kubernetes-sigs/kubebuilder
      - https://github.com/operator-framework/operator-sdk
  - id: brew:kustomize
    reason: >
      Kubebuilder-generated projects use Kustomize to assemble CRDs, RBAC, manager,
      webhook, and deployment manifests through their generated Make targets.
    rel: adjacent_workflow
    sources:
      - https://github.com/kubernetes-sigs/kubebuilder
      - https://book.kubebuilder.io/quick-start
      - https://kustomize.io/
  - id: brew:kubernetes-cli
    reason: >
      Kubebuilder's documented test and deployment workflow uses kubectl to apply
      generated sample resources and Kustomize directories to a cluster.
    rel: adjacent_workflow
    sources:
      - https://book.kubebuilder.io/quick-start
      - https://kubernetes.io/docs/reference/kubectl/
