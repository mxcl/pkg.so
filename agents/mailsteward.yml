history:
  adoption-history:
    - >
      MailSteward has been offered in Lite, standard, and Pro editions. The standard
      application embeds SQLite and stores an archive in a portable database file, while
      the Pro edition uses a separately installed MySQL server for larger collections.
    - >
      Its longevity is reflected in the official multi-generation release history and
      continued support for importing locally stored Apple Mail data and Gmail exports.
  package-nerd-significance:
    - >
      MailSteward is interesting to package and data-management enthusiasts because it
      treats email as a durable, searchable archive rather than merely as a live
      mailbox. Its use of SQLite or MySQL, scheduled operation through `crontab`, and
      exports to mbox, SQL, text, and standalone database files make the archive
      comparatively portable and inspectable.
  project-history:
    - >
      MailSteward developed as a macOS utility for copying email into a local relational
      database, enabling long-term searching, tagging, attachment handling,
      deduplication, and export independently of the original mail client.
    - >
      The product family expanded into Lite, standard, and Pro editions, with the Pro
      edition adopting MySQL for archives beyond the scale targeted by the embedded
      SQLite edition. Successive releases have added database-management, reporting,
      scheduling, and import improvements.
  related-projects:
    - >
      MailSteward commonly works with Apple Mail and Gmail exports. MailSteward Pro
      depends on a separately installed MySQL server, while the standard edition embeds
      SQLite.
  sources:
    - https://mailsteward.com/
    - https://mailsteward.com/faq/
    - https://mailsteward.com/manual/
    - https://mailsteward.com/upgrade/
  summary:
    - >
      MailSteward is a proprietary macOS email archiving and management application. It
      copies messages into a local database for durable search, tagging, attachment
      access, reporting, backup, and export.
  timeline:
    - >
      Version 10 era: Official release notes document sustained maintenance of
      large-import, attachment, and database workflows.
    - 'Version 17 era: Google Takeout importing and other archive-maintenance work continued.'
    - >
      Version 18 era: Database-setting profiles, statistics, and current macOS
      compatibility were added or refined.
  usage:
    - >
      Users archive locally stored Apple Mail messages or import Gmail exports, then
      search by dates, correspondents, keywords, mailboxes, and attachment content.
      Archived results can be tagged, printed, or exported as text, mbox, SQL, or
      another MailSteward database.
    - >
      The standard edition uses a single SQLite database file that can be copied and
      backed up. MailSteward Pro targets larger archives through MySQL. Standard and Pro
      editions can schedule recurring archival runs.
