history:
  adoption-history:
    - >
      MARISA entered package-manager culture as a small native library plus utilities:
      the supplied Homebrew facts list packages in Homebrew, Debian/Ubuntu, Fedora, Nix,
      Arch, and openSUSE families. Its adoption is strongest where compact dictionaries
      and prefix search matter more than a standalone user interface.
    - >
      The GitHub project has hundreds of stars and forks, indicating a modest but
      durable user base for a specialized data-structure library.
  package-nerd-significance:
    - >
      MARISA is the kind of formula package maintainers keep around because other
      software can depend on it quietly. It is not a broad Markdown-style tool; it is a
      compact C++ library with testable command-line utilities, a permissive/copyleft
      dual license, and cross-distro packaging.
  project-history:
    - >
      The official repository describes MARISA as a static, space-efficient trie data
      structure and libmarisa as the C++ implementation. Its README emphasizes
      dictionary operations such as lookup, reverse lookup, common-prefix search, and
      predictive search, and compares the MARISA trie favorably against other trie
      implementations on an English Wikipedia title dataset.
    - >
      The current GitHub repository was created in 2016 and still publishes source and
      binary-oriented build instructions with CMake. The project has continued with
      modern releases, including v0.3.1 in July 2025, after earlier 0.2.x and 0.3.x
      tags.
  related-projects:
    - >
      The README compares MARISA with darts-clone and tx-trie as alternative compact
      trie implementations.
    - >
      Bindings and language files in the repository indicate use from C++, C, Python,
      Ruby, and Perl-adjacent tooling.
  sources:
    - https://api.github.com/repos/s-yata/marisa-trie
    - https://github.com/s-yata/marisa-trie
    - https://www.s-yata.jp/marisa-trie/docs/readme.en.html
    - source_facts.package-manager
  summary:
    - >
      MARISA is a compact static trie implementation whose name expands to Matching
      Algorithm with Recursively Implemented StorAge. The Homebrew package exposes
      libmarisa and its dictionary-building/search command-line tools rather than an
      end-user application.
  timeline:
    - '2016: Current GitHub repository created.'
    - '2025: v0.3.1 listed as the latest GitHub release.'
    - >
      2026: Package-manager metadata shows Homebrew, Debian/Ubuntu, Fedora, Nix, Arch,
      and openSUSE coverage.
  usage:
    - >
      Typical CLI usage is to build a MARISA-based dictionary with marisa-build and
      inspect or query it with tools such as marisa-lookup, marisa-reverse-lookup,
      marisa-common-prefix-search, and marisa-predictive-search. Library users embed
      libmarisa when they need static dictionaries with compact storage and fast lookup
      behavior.
related-packages:
  - id: brew:libdatrie
    reason: >
      Choose libdatrie when you want a C double-array trie suited to lexical analyzers
      and spelling dictionaries instead of MARISA's particularly compact static C++ trie
      and predictive-search toolkit.
    rel: alternative
    sources:
      - https://www.s-yata.jp/marisa-trie/docs/readme.en.html
      - https://github.com/tlwg/libdatrie
