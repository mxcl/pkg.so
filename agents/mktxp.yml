id: brew:mktxp
display-name: MKTXP
repo: https://github.com/akpw/mktxp
docs:
  - https://github.com/akpw/mktxp
  - https://github.com/akpw/mktxp#readme
config-file-location:
  unix:
    - ~/.config/mktxp/mktxp.conf
    - ~/.config/mktxp/_mktxp.conf
    - ~/mktxp/mktxp.conf
    - ~/mktxp/_mktxp.conf
    - /etc/mktxp/mktxp.conf
    - /etc/mktxp/_mktxp.conf
credentials-file-location:
  unix:
    - ~/.config/mktxp/mktxp.conf
    - /etc/mktxp/mktxp.conf
history:
  adoption-history:
    - >
      Package-manager adoption reflects the tool's role in home-lab and
      network-monitoring workflows: the input records Homebrew and Nix package names,
      while the upstream README documents installation from PyPI, GitHub source, GitHub
      Container Registry, and deployment through Kubernetes or the mktxp-stack project.
    - >
      Later 1.2 releases expanded operational use cases with custom labels,
      multi-router/concurrent scrape support, multi-target exporter support, Docker path
      improvements, and richer RouterOS collectors. These are packaging-relevant because
      users often run MKTXP as a service or containerized exporter rather than as an
      occasional CLI.
  package-nerd-significance:
    - >
      MKTXP is notable to package maintainers because it sits at the intersection of
      Python packaging, observability tooling, and appliance monitoring. It ships as a
      CLI, a PyPI package, a Homebrew formula, a Nix package, and a GitHub container
      image, so packaging quality affects both interactive local use and long-running
      service deployments.
    - >
      The 2026 move to pyproject.toml and improved Docker/XDG configuration paths
      matters for downstream packaging: it reduces friction around build metadata,
      non-root containers, bind-mounted config directories, and service-manager
      integration.
  project-history:
    - >
      The upstream project is maintained at akpw/mktxp on GitHub and describes itself as
      a Prometheus exporter for MikroTik RouterOS devices. Its README documents local
      installs, Docker images, Kubernetes examples, CLI commands, RouterOS user setup,
      and a system configuration file for exporter runtime settings.
    - >
      The package became a PyPI-distributed Python application early in 2021, with PyPI
      release history beginning at 0.14 on January 4, 2021. The project reached 1.0 on
      January 4, 2023 and has continued through the 1.2 series, with GitHub marking
      v1.2.19 as the latest release on July 10, 2026.
  related-projects:
    - mktxp-stack is the upstream companion project for a ready-to-go MKTXP monitoring stack.
    - >
      Prometheus and Grafana are the primary monitoring and visualization tools
      documented by the project.
    - MikroTik RouterOS is the monitored network-device platform.
  sources:
    - https://github.com/akpw/mktxp
    - https://github.com/akpw/mktxp#readme
    - https://github.com/akpw/mktxp/releases
    - https://pypi.org/project/mktxp/
    - source_facts.package-manager
  summary:
    - >
      MKTXP is a Python command-line Prometheus exporter for MikroTik RouterOS devices.
      It exports RouterOS metrics for Prometheus, can print selected metrics directly on
      the command line, and is commonly paired with Grafana dashboards or the companion
      mktxp-stack deployment.
  timeline:
    - '2021-01-04: PyPI release history begins with version 0.14.'
    - '2023-01-04: Version 1.0 released on PyPI.'
    - >
      2025-09-15: v1.2.14 release notes include injectable device-level custom labels
      and dedicated config sections for new parameters.
    - >
      2025-12-22: v1.2.16 release notes describe Dockerfile improvements and support for
      /etc/mktxp or XDG standard paths.
    - '2026-07-10: v1.2.19 marked latest on GitHub and published on PyPI.'
  usage:
    - >
      Typical use starts by editing mktxp.conf with RouterOS addresses and API
      credentials, then running mktxp export to serve Prometheus metrics on the
      configured HTTP listener. The README also documents mktxp print for command-line
      inspection and mktxp edit or mktxp edit -i for editing main and system
      configuration.
    - >
      Configuration is centered on mktxp.conf for router entries and _mktxp.conf for
      system options. The README documents XDG-style local configuration under
      ~/.config/mktxp, legacy local configuration under ~/mktxp, and container-oriented
      configuration under /etc/mktxp via --cfg-dir or bind mounts.
related-packages:
  - id: brew:prometheus
    reason: >
      Prometheus is the documented collector for MKTXP's RouterOS metrics endpoint and
      is the next component in the standard monitoring workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/akpw/mktxp/blob/main/docs/exporter.md
      - https://github.com/prometheus/prometheus
  - id: brew:grafana
    reason: >
      Grafana provides the dashboards used to visualize MKTXP metrics, and upstream's
      mktxp-stack ships a preconfigured MKTXP Grafana dashboard.
    rel: adjacent_workflow
    sources:
      - https://github.com/akpw/mktxp/blob/main/README.md
      - https://github.com/akpw/mktxp-stack
      - https://github.com/grafana/grafana
