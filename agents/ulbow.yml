history:
  adoption-history:
    - >
      Ulbow was offered as free macOS software intended to make Apple's unified log
      accessible without requiring users to compose command-line predicates. The
      developer described it as his main log browser while continuing to support
      Consolation 3.
    - >
      By 2025, the developer still reported using Ulbow daily, while introducing LogUI
      as an experimental modern successor based on OSLog and SwiftUI.
  package-nerd-significance:
    - >
      Ulbow packages advanced access to Apple's normally cumbersome unified logging
      system into a focused GUI. It is useful to Mac administrators and troubleshooters
      who need historical log extraction, reusable predicates, regex filtering,
      logarchive inspection, and export without building every query around the log
      command.
  project-history:
    - >
      Howard Oakley unveiled early Ulbow development in October 2019 after work on
      Consolation. It reused parsing engines refined through Consolation 3 while
      adopting a simpler, interactive browser interface.
    - >
      Ulbow 1.0 was released in January 2020 with an integrated Help book, predicate and
      format libraries, logarchive support, and RTF, text, and CSV export.
    - >
      The later experimental LogUI project was presented in 2025 as a possible successor
      using newer OSLog and SwiftUI APIs; the developer explained that Ulbow continued
      to rely on the log command for compatibility with older macOS releases.
  related-projects:
    - >
      Consolation 3 is Ulbow's dialog-oriented predecessor and shares its lineage of
      log-parsing work.
    - LogUI is the developer's experimental OSLog- and SwiftUI-based successor.
    - >
      Apple Console and the macOS log command address the same unified-log data but
      expose different workflows.
  sources:
    - https://eclecticlight.co/2019/10/06/last-week-on-my-mac-opening-the-log/
    - >
      https://eclecticlight.co/2020/01/24/ulbow-1-0-my-new-free-unified-log-browser-is-released/
    - https://eclecticlight.co/2023/08/01/log-literacy-how-to-make-and-use-logarchives/
    - https://eclecticlight.co/2025/02/26/introducing-logui-an-experimental-log-browser/
  summary:
    - >
      Ulbow is a free macOS browser for Apple's unified log, created by Howard Oakley as
      a more approachable successor to Consolation 3. It combines reusable predicates
      and display formats with fast filtering, logarchive browsing, and export tools.
  timeline:
    - '2019: Early Ulbow development was publicly unveiled.'
    - '2020: Ulbow 1.0 was released with an integrated Help book and standalone manual.'
    - >
      2025: The developer introduced LogUI as an experimental modern successor while
      noting continued daily Ulbow use.
  usage:
    - >
      Users select or compose a predicate, choose a secondary filter and display style,
      set the desired time period, and retrieve matching unified-log entries.
    - >
      Ulbow can inspect the live Mac log, open saved logarchives or individual tracev3
      files, create logarchives, and export extracts as rich text, plain text, or CSV.
    - >
      Administrative access may be needed for some log operations, and creating a
      logarchive can require an administrator password.
