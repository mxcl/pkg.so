id: brew:dict
display-name: dict
repo: https://github.com/cheusov/dictd
docs:
  - https://github.com/cheusov/dictd#readme
  - https://www.dict.org/bin/Dict
config-file-location:
  unix:
    - ~/.dictrc
    - /etc/dict.conf
    - /etc/dictd.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      dict became package-manager material because it gives terminal users a network
      dictionary client, while also letting administrators run local DICT servers. The
      upstream README points operators to dict.org mailing lists for release, database,
      and server-operator discussion, which reflects the project culture around shared
      dictionary services.
  package-nerd-significance:
    - >
      For package nerds, dict is interesting because it packages a complete protocol
      ecosystem rather than a single command: CLI client, daemon, database tooling,
      compression format, sample configs, and a standards document all live close
      together.
  project-history:
    - >
      The DICT protocol was published as RFC 2229 in October 1997 to replace older
      webster-style dictionary access with a TCP query/response protocol that could
      address multiple dictionary databases through one interface. The dictd source tree
      carries that protocol lineage into a client, daemon, formatter, dictzip
      compressor, and supporting tools.
    - >
      The current public repository describes itself as client/server software,
      human-language dictionary databases, and tools supporting RFC 2229. Its NEWS file
      shows long maintenance across Unix-like systems, including 2011 utility additions,
      2020 IPv6 support, and a 2023 build-system refresh.
  related-projects:
    - >
      RFC 2229, dict.org, dictd, dictfmt, and dictzip form the closely related DICT
      protocol toolchain.
  sources:
    - https://datatracker.ietf.org/doc/html/rfc2229
    - https://github.com/cheusov/dictd
    - https://raw.githubusercontent.com/cheusov/dictd/master/README.pod
    - https://raw.githubusercontent.com/cheusov/dictd/master/doc/NEWS
    - https://raw.githubusercontent.com/cheusov/dictd/master/dict/dict.1.in
    - https://raw.githubusercontent.com/cheusov/dictd/master/dictd/dictd.8.in
  summary:
    - >
      dict is the command-line client and companion server/tool suite for the DICT
      Dictionary Server Protocol. It sits in the Unix tradition of small text tools
      while exposing network dictionary lookup, formatting, compression, and server
      administration utilities.
  timeline:
    - '1997: RFC 2229 publishes the DICT Dictionary Server Protocol.'
    - '2011: dict_lookup is added for translating selected words and phrases.'
    - '2020: dict and dictd gain IPv6 support.'
    - '2023: dictd 2.0.0 switches to the mk-configure build system.'
  usage:
    - >
      The client reads server settings from ~/.dictrc or /etc/dict.conf and connects to
      DICT servers on the RFC port by default. Typical use is direct word lookup,
      database listing, matching strategies, or using dictd and dictfmt to serve and
      build dictionaries locally.
related-packages:
  - id: brew:define
    reason: >
      Choose define for a simpler CLI that aggregates dictionary and thesaurus APIs from
      multiple providers; choose dict when you need the open RFC 2229 protocol,
      configurable DICT servers, or local server/database tooling.
    rel: alternative
    sources:
      - https://github.com/cheusov/dictd
      - https://datatracker.ietf.org/doc/html/rfc2229
      - https://github.com/Rican7/define
