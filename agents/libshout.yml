config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libshout spread through the ecosystem because source clients, encoders, automation
      scripts, and language bindings could reuse the same stream-to-server plumbing
      instead of reimplementing Icecast protocol behavior. Icecast's download page lists
      libshout alongside bindings for Java, Python, Perl, Ruby, OCaml, and other wrapper
      projects.
    - >
      The library is packaged by Homebrew, Debian and Ubuntu, Fedora, Alpine, Arch,
      MacPorts, Nix, and other package systems, which reflects its role as a build
      dependency for audio streaming tools rather than a standalone end-user app.
  package-nerd-significance:
    - >
      libshout is a small but culturally important streaming library: it belongs to the
      Xiph/Icecast world of open Internet audio, where servers, codecs, source clients,
      and metadata conventions are separate packages that distros wire together.
    - >
      It is also a classic package-manager dependency: easy to overlook until a
      streaming app needs Icecast output, at which point libshout is the boring C ABI
      that keeps the app from owning protocol edge cases.
  project-history:
    - >
      Icecast.org describes the Icecast project as a collection of programs and
      libraries for streaming audio over the Internet, with Icecast as the server, IceS
      as a source client, and libshout as the library for communicating with Icecast
      servers. The Icecast download page describes libshout as the library used to write
      a source client like ices.
    - >
      The libshout 2 documentation describes the library as a way to stream audio to
      Icecast or Shoutcast-compatible servers. By the 2015 libshout 2.4.0 release, the
      project had added TLS support, audio-only WebM, improved metadata APIs, HTTP
      protocol improvements, and basic RoarAudio protocol support.
  related-projects:
    - >
      Icecast is the server that receives streams, IceS is a source client, ezstream is
      another source-client tool in the Icecast ecosystem, and Xiph.Org codec projects
      such as Ogg Vorbis, Opus, FLAC, Speex, and Theora often appear in the same
      streaming stack.
  sources:
    - https://gitlab.xiph.org/xiph/icecast-libshout
    - https://icecast.org/download/
    - https://icecast.org/faq/
    - https://icecast.org/news/libshout-release-2_4_0/
    - https://icecast.org/news/libshout-release-2_4_2/
    - https://icecast.org/news/libshout-release-2_4_6/
  summary:
    - >
      libshout is Xiph.Org's C library for writing Icecast source clients. It hides the
      connection, timing, metadata, and protocol details needed to send a live stream to
      an Icecast server.
  timeline:
    - >
      2003: The libshout 2 DocBook documentation records Brendan Cully and Xiph.Org
      copyright metadata.
    - >
      2015-11-17: Icecast announced libshout 2.4.0 with TLS, audio-only WebM, metadata,
      and HTTP protocol improvements.
    - '2019-04-28: Icecast announced libshout 2.4.2 with updated documentation.'
    - >
      2022-04-10: Icecast announced libshout 2.4.6 with pkg-config fixes, optional
      Vorbis support, documentation cleanup, metadata API updates, plain-text streaming
      support, and tool build controls.
  usage:
    - >
      A program using libshout opens a connection to an Icecast server, identifies a
      mountpoint, sends encoded audio data, and updates metadata through the library
      APIs. The library handles socket connection behavior, stream timing, and data
      validation before the stream reaches the server.
    - >
      The Homebrew package also installs the `shout` command, but libshout's main value
      is as a library for applications that need to become Icecast source clients.
related-packages:
  - id: brew:icecast
    reason: >
      Icecast is the server-side companion that receives and publishes streams sent by
      applications using libshout.
    rel: adjacent_workflow
    sources:
      - https://icecast.org/docs/icecast-2.4.1/faq.html
      - https://icecast.org/docs/
  - id: brew:ezstream
    reason: >
      ezstream is a command-line Icecast source client built on libshout, making it
      useful when a ready-made streaming tool is preferable to writing a client.
    rel: adjacent_workflow
    sources:
      - https://icecast.org/ezstream/
      - https://icecast.org/download/
