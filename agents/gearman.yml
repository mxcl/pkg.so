history:
  adoption-history:
    - >
      Gearman was adopted as a general-purpose distributed work system for web
      infrastructure, background jobs, heterogeneous language stacks, and
      database-related workflows. The official site names high-availability web sites
      and database replication event transport as example use cases, and highlights
      clients and workers in different languages speaking the same protocol.
  package-nerd-significance:
    - >
      Gearman is historically significant because it represents an older but durable
      Unix package pattern: a small daemon, a protocol, language bindings, and
      command-line tools that package managers can distribute separately or together. It
      is closely associated with the same LiveJournal/Danga infrastructure lineage that
      produced memcached, MogileFS, and Perlbal.
  project-history:
    - >
      The official manual says Gearman was originally created at Danga Interactive, the
      company behind LiveJournal, and that its name is an anagram of Manager. It was
      used at LiveJournal for several purposes, including as a coordination mechanism
      for MogileFS.
    - >
      The original implementation was written in Perl. As companies such as Digg and
      Yahoo began using Gearman, APIs in other languages such as PHP appeared. In early
      2008, a C port of the job server and libraries began, and by the end of 2008 the C
      server was ready for its first release.
    - >
      The modern gearmand repository notes that GitHub holds the latest source and
      versions 1.1.13 and later, while older releases before 1.1.13 live in the
      Launchpad repository.
  related-projects:
    - >
      The official history places Gearman in the Danga/LiveJournal family alongside
      memcached, MogileFS, and Perlbal. It also relates to the older Perl job server,
      the C gearmand server, language bindings such as PHP and Perl, and alternative
      implementations such as pure Java.
  sources:
    - https://gearman.org/
    - https://gearman.org/manual
    - https://gearman.org/manual/introduction/
    - https://github.com/gearman/gearmand
    - https://github.com/gearman/gearmand#readme
    - https://github.com/gearman/gearmand/releases
    - https://launchpad.net/gearmand/
  summary:
    - >
      Gearman is an open-source job server and application framework for distributing
      work to other machines or processes, with clients and workers connected through a
      language-neutral protocol.
  timeline:
    - '2005: First Gearman blog post referenced by the official manual.'
    - '2008: C job server and libraries started and reached first release readiness.'
    - '2016: gearman/gearmand GitHub repository created.'
    - '2020: 1.1.19 maintenance release published.'
    - '2022: 1.1.20 maintenance release published.'
    - '2025: 1.1.22 maintenance release published.'
  usage:
    - >
      A typical Gearman deployment runs gearmand as the job server, has clients submit
      named jobs, and has one or more workers register functions and return results. The
      command-line package includes gearmand, gearman, and gearadmin for running the
      server, submitting or working jobs, and inspecting server state.
