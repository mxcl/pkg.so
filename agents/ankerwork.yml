    - https://us.ankerwork.com/pages/download-software
    - https://us.ankerwork.com/pages/voice-radar
    - source_facts.package-manager
  summary:
    - >
      AnkerWork is a proprietary desktop companion application for configuring supported
      AnkerWork webcams, headsets, speakerphones, and video bars and applying device
      firmware updates.
  timeline:
    - >
      2020: Anker's official product history records the creation of the PowerConf
      speakerphone series.
    - >
      2021: AnkerWork's privacy policy was already documenting use of the brand's
      applications and accounts.
    - '2022: AnkerWork documented VoiceRadar 2.0 in its SR500 product line.'
  usage:
    - >
      Users connect a supported AnkerWork device, adjust video or audio behavior,
      inspect device information, and install firmware updates. The vendor also
      documents local image-to-PDF and collage features in the general desktop
      application.
