history:
  adoption-history:
    - >
      AnkerWork distributes the application for macOS and Windows as a companion to its
      webcams, headsets, speakerphones, and video bars. Official materials do not
      provide application installation or active-user figures.
  package-nerd-significance:
    - >
      The Homebrew cask provides a reproducible macOS installation route for a
      proprietary hardware-control utility that the vendor otherwise distributes from
      its download center. It is representative of casks used to manage peripheral
      settings and firmware outside the operating system's built-in controls.
  project-history:
    - >
      AnkerWork is an official Anker sub-brand focused on equipment for hybrid work. Its
      desktop application serves as the configuration and firmware-management layer for
      supported AnkerWork audio and video devices.
  related-projects:
    - Anker
    - Anker PowerConf
    - AnkerWork VoiceRadar
    - Homebrew Cask
  sources:
