history:
  project-history:
    - >
      The tool grew around the practical lifecycle of embedded-Linux updates: create an
      Artifact, validate it, inspect or dump it, sign it, and preserve metadata while
      modifying update payloads. Release notes show the format and tooling maturing
      through signing support in 2017, artifact format v3 documentation and
      image/artifact modification work in 2018, update-module read/write support in
      2019, safer handling of signed and compressed artifacts in 2021, and
      cloud/HSM-oriented signing additions such as GCP KMS support in 2022.
  sources:
    - https://docs.mender.io/artifact-creation/ci-cd/github-actions
    - https://docs.mender.io/artifact-creation/create-an-artifact
    - https://docs.mender.io/overview/artifact
    - https://docs.mender.io/release-information/release-notes-changelog/mender-artifact
    - https://github.com/mendersoftware/mender-artifact
  summary:
    - >
      mender-artifact is the library and CLI for working with Mender Artifact files, the
      .mender archives used by Mender's over-the-air update system. Mender documentation
      defines an Artifact as a tar-based archive containing versioning data, extensions,
      metadata, and one or more payload files. The GitHub project describes artifacts as
      wrappers that can carry binaries, metadata, checksums, signatures, and scripts
      used during deployments.
  usage:
    - >
      In package-manager terms, mender-artifact is a workstation tool rather than a
      device daemon. Developers and CI pipelines use it to package operating-system and
      application updates before upload to a Mender server; Mender's GitHub Actions
      documentation builds on that flow by uploading artifacts and triggering
      deployments from CI.
related-packages:
  - id: brew:mender-cli
    reason: >
      Use mender-cli after creating an Artifact to authenticate to a Mender server and
      upload the `.mender` file through the management API.
    rel: adjacent_workflow
    sources:
      - https://docs.mender.io/artifact-creation/create-an-artifact
      - https://docs.mender.io/server-integration/using-the-apis
      - https://github.com/mendersoftware/mender-cli#readme
