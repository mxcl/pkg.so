history:
  adoption-history:
    - >
      The official macOS site positions Nestopia as a particularly robust and accurate
      NES emulator. Its support for many cartridge mappers, the Famicom Disk System, the
      Zapper, and additional sound chips broadened compatibility with software that
      simpler emulators could not reproduce accurately.
  package-nerd-significance:
    - >
      Nestopia is notable to emulator-package users for prioritizing cycle-exact
      behavior over minimal resource use. The packaged macOS edition also illustrates
      the long-running practice of adapting established emulator cores to a native
      platform shell.
  project-history:
    - >
      Nestopia was created as a Nintendo Entertainment System and Famicom emulator
      centered on accurate, cycle-exact hardware emulation. Richard Bannister
      distributes the native macOS edition through his official emulator collection.
    - >
      Bannister resumed releases across his emulator collection in 2018 after a
      decade-long hiatus, replacing the older shell with a 64-bit Cocoa implementation
      and later adopting Metal for newer macOS releases.
  related-projects:
    - >
      The macOS edition can use Bannister's optional Emulator Enhancer for capabilities
      such as controller support, full-screen display, audio effects, recent-game
      access, and network play.
    - >
      Nestopia belongs to the same package category as other NES emulators, but its
      official description particularly emphasizes timing accuracy and mapper support.
  sources:
    - https://www.bannister.org/software/index.htm
    - https://www.bannister.org/software/nestopia.htm
  summary:
    - >
      Nestopia is a cycle-exact Nintendo Entertainment System and Famicom emulator
      distributed for macOS by Richard Bannister.
  timeline:
    - >
      2018: Bannister resumed releases of his macOS emulator collection using a new
      64-bit Cocoa shell.
    - '2019: The shared emulator shell moved from OpenGL to Metal for newer macOS releases.'
  usage:
    - >
      Users open legally obtained NES or Famicom software images in the desktop
      application. The emulator supports specialized cartridge mappers, Famicom Disk
      System software, the Zapper, and common expansion-audio chips.
