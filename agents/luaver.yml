id: brew:luaver
display-name: luaver
repo: null
docs:
  - https://dhavalkapil.com/luaver
  - https://github.com/DhavalKapil/luaver#readme
config-file-location:
  unix:
    - ~/.bashrc
    - ~/.zshrc
credentials-file-location: null
history:
  adoption-history:
    - >
      luaver is a niche developer convenience tool rather than a broad platform
      dependency. Its adoption is visible mainly through its GitHub repository, Homebrew
      formula, and author documentation; the input metadata lists Homebrew as its
      package-manager surface.
  package-nerd-significance:
    - >
      luaver matters to package nerds because Lua's ecosystem has several actively used
      runtime versions plus LuaJIT, and LuaRocks state depends on the chosen runtime. A
      small version manager reduces global-package drift during testing.
    - >
      Its ceiling is also clear: it is a convenience wrapper around building and
      switching Lua-family tools, not a universal package manager. That simplicity is
      exactly why it remains easy to package.
  project-history:
    - >
      The project README describes luaver as a Lua Version Manager that manages and
      switches between versions of Lua, LuaJIT, and LuaRocks. Its feature set is
      intentionally narrow: install or uninstall versions, switch versions, keep Lua and
      LuaRocks trees consistent, and allow different terminal sessions to use different
      environments.
  related-projects:
    - Lua is the main runtime luaver installs and switches.
    - LuaJIT is the alternate runtime luaver supports.
    - >
      LuaRocks is the package manager luaver installs and keeps version-associated with
      Lua runtimes.
  sources:
    - https://dhavalkapil.com/blogs/Lua-Version-Manager/
    - https://github.com/DhavalKapil/luaver
    - source_facts.package-manager
  summary:
    - >
      luaver is a shell-based version manager for Lua, LuaJIT, and LuaRocks. It gives
      Lua developers a way to install and switch runtimes and package-manager versions
      without relying only on system packages.
  timeline:
    - '2016: The luaver author publishes Lua Version Manager documentation.'
    - '2020s: The GitHub project remains the official source and Homebrew packages the tool.'
  usage:
    - >
      Typical usage is shell-driven: install a Lua version, install a LuaJIT or LuaRocks
      version, switch with luaver use, use-luajit, or use-luarocks, and optionally set
      defaults for new terminal sessions.
    - >
      It is most useful when a developer needs to test Lua libraries against several
      Lua, LuaJIT, and LuaRocks combinations while keeping rock trees and shell state
      separated.
related-packages:
  - id: brew:lua
    reason: >
      Install Lua through luaver when projects must be tested against several
      reference-interpreter versions instead of the single version selected by the
      system package manager.
    rel: adjacent_workflow
    sources:
      - https://dhavalkapil.com/luaver/
      - https://www.lua.org/about.html
  - id: brew:luajit
    reason: >
      luaver can install and switch LuaJIT alongside standard Lua, making LuaJIT the
      documented alternate runtime in a multi-version test setup.
    rel: adjacent_workflow
    sources:
      - https://dhavalkapil.com/luaver/
      - https://luajit.org/luajit.html
  - id: brew:luarocks
    reason: >
      luaver installs LuaRocks versions and keeps their rock trees associated with the
      selected Lua runtime, preventing dependencies from different runtimes from being
      mixed.
    rel: adjacent_workflow
    sources:
      - https://dhavalkapil.com/blogs/Lua-Version-Manager/
      - https://luarocks.org/
