history:
  adoption-history:
    - >
      The application evolved as a commercial macOS utility with a trial edition and
      later gained distribution through the Mac App Store. Its version history tracks
      repeated compatibility updates for macOS releases and architectural transitions,
      including 64-bit operation and native Apple Silicon support.
    - >
      Long-term maintenance has emphasized preserving the utility's specialized
      batch-file workflow across changing Mac platforms rather than turning it into a
      general-purpose file manager.
  package-nerd-significance:
    - >
      Big Mean Folder Machine is notable as a focused GUI counterpart to shell pipelines
      used for bulk file organization. It packages potentially elaborate grouping,
      collision handling, metadata extraction, and directory construction into a guided
      Mac interface.
    - >
      Its droplet feature is particularly characteristic of classic Mac automation
      culture: a configured operation can be saved as a small drag-and-drop application
      and reused without rebuilding the workflow.
  project-history:
    - >
      publicspace.net first released the product publicly as a beta in June 2007,
      initially under the name Big Bang. It was renamed Big Mean Folder Machine before
      the second beta because the original name was already taken, and version 1.0
      followed in October 2007.
    - >
      Version 1.6 introduced reusable droplet applications and remembered settings. The
      2.0 series began in public beta in 2009 with a redesigned assistant interface,
      faster conflict resolution, a new droplet implementation, and Sparkle-based
      updates. Subsequent releases added Mac App Store integration, new
      batch-preservation behavior, broader media metadata support, and compatibility
      with newer Mac hardware and operating systems.
  related-projects:
    - >
      The application is part of the publicspace.net productivity suite alongside A
      Better Finder Rename, A Better Finder Attributes, and Nifty File Lists.
  sources:
    - 'Official downloads page: https://www.publicspace.net/BigMeanFolderMachine/download.html'
    - 'Official manual: https://www.publicspace.net/BigMeanFolderMachine/Manual.html'
    - 'Official version history: https://www.publicspace.net/BigMeanFolderMachine/version.html'
  summary:
    - >
      Big Mean Folder Machine is a commercial macOS utility for reorganizing large file
      collections. It can split collections into folder hierarchies or size- and
      count-based batches, merge hierarchies, resolve filename conflicts, and organize
      media using file metadata.
  timeline:
    - >
      2007: First public beta released; the product was renamed from Big Bang to Big
      Mean Folder Machine.
    - '2007: Version 1.0 became the first full release.'
    - '2008: Version 1.6 added remembered settings and reusable drag-and-drop droplets.'
    - '2009: Version 2.0 entered public beta with a redesigned interface and faster processing.'
    - '2011: The application was accepted into the Mac App Store.'
    - '2018: Version 2.37 added HEIC and HEIF support.'
    - '2020: Version 2.42 added native Apple Silicon support.'
    - '2021: Version 2.43 improved license-unlock handling.'
  usage:
    - >
      Users select source folders, define one or more grouping criteria, choose
      filename-conflict behavior, and select a destination. The application can build
      nested hierarchies from names, dates, image metadata, or music tags; divide
      collections into batches of a chosen file count or disk size; or flatten several
      hierarchies into one folder.
    - >
      Repeated configurations can be packaged as droplet applications for drag-and-drop
      processing. The official documentation recommends the guided interface for jobs
      that would otherwise require extensive manual movement and renaming in Finder.
