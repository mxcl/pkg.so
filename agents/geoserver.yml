id: brew:geoserver
display-name: GeoServer
repo: https://github.com/geoserver/geoserver
docs:
  - https://docs.geoserver.org/
  - https://docs.geoserver.org/stable/en/developer
  - https://docs.geoserver.org/stable/en/user
config-file-location:
  unix:
    - $GEOSERVER_DATA_DIR/global.xml
    - $GEOSERVER_DATA_DIR/logging.xml
    - $GEOSERVER_DATA_DIR/workspaces/
credentials-file-location:
  unix:
    - $GEOSERVER_DATA_DIR/security/usergroup/default/users.xml
history:
  adoption-history:
    - >
      GeoServer became significant because it connected open spatial databases, desktop
      GIS, browser mapping, and standard OGC service protocols. Practitioners could
      publish PostGIS, shapefile, GeoTIFF, and other datasets without building a custom
      map server for each deployment.
  package-nerd-significance:
    - >
      For package-manager users, GeoServer is the server component that turns a local
      machine or CI environment into an OGC service endpoint. A formula-managed install
      makes it easier to reproduce a Java geospatial stack without hand-assembling the
      web application and its supporting scripts.
  project-history:
    - >
      GeoServer began in 2001 at The Open Planning Project, a New York nonprofit
      technology incubator that wanted spatial-data sharing tools for civic
      participation and transparent government. The project grew alongside GeoTools, the
      Java GIS toolkit founded by people involved with GeoServer, which supplied
      data-source support such as shapefiles and databases.
    - >
      The project evolved during the same period that OGC web-service standards such as
      Web Feature Service and Web Map Service were being defined. GeoServer's later move
      into the Open Source Geospatial Foundation gave the project a neutral
      collaboration home in the open-source GIS ecosystem.
  related-projects:
    - GeoTools, PostGIS, QGIS, OpenLayers, OGC WMS, OGC WFS, OGC WCS
  sources:
    - https://docs.geoserver.org/
    - https://docs.geoserver.org/main/en/user/introduction/history/
    - https://github.com/geoserver/geoserver
    - https://www.osgeo.org/projects/geoserver/
  summary:
    - >
      GeoServer is a Java server for publishing, editing, and serving geospatial data
      through open geospatial web-service standards. Its history is closely tied to the
      Java GIS stack, GeoTools, and the broader open-source geospatial community around
      PostGIS, QGIS, OpenLayers, and OSGeo.
  timeline:
    - '2001: GeoServer was started by The Open Planning Project.'
    - >
      2000s: GeoServer grew with GeoTools and related open-source GIS projects such as
      PostGIS, QGIS, and OpenLayers.
    - 'After project growth: GeoServer joined the Open Source Geospatial Foundation.'
  usage:
    - >
      Administrators use GeoServer to create workspaces, register data stores, publish
      layers, style maps, and expose services such as WMS, WFS, WCS, WMTS, and OGC API
      endpoints. Developers and GIS teams use it in local stacks, test fixtures, and
      production deployments that need standards-based geospatial publishing.
related-packages:
  - id: brew:postgis
    reason: >
      Use PostGIS as GeoServer's spatial database when published layers need indexed,
      queryable geospatial storage rather than standalone files.
    rel: adjacent_workflow
    sources:
      - https://docs.geoserver.org/stable/en/user/gettingstarted/postgis-quickstart/
      - https://postgis.net/
