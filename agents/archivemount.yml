config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts show unusually broad distro/package coverage for such a
      small tool: Alpine, Debian, Fedora, Homebrew, MacPorts, Nix, Ubuntu, and openSUSE
      naming all appear. That is consistent with the tool's job: it plugs a practical
      gap in Unix workflows and can be carried by system package managers with few
      moving parts.
    - >
      The `-ng` releases also show maintenance motivated by downstream bug reports,
      including Debian bugs, upstream GitHub issues, FUSE3 changes, macOS porting, and
      non-ASCII filename handling.
  package-nerd-significance:
    - >
      archivemount is the kind of tiny Unix package that stays useful for decades
      because it composes two stable primitives, libarchive and FUSE, into a
      shell-friendly workflow.
    - >
      The `-ng` handoff is also a packaging story: old upstream tarballs, downstream
      distro bugs, and a maintained forge repo converge so distros can keep shipping a
      working command instead of carrying piles of local patches.
  project-history:
    - >
      The maintained SourceHut project is `archivemount-ng`, whose summary says it is
      derived from upstream tarballs with Debian and upstream bug fixes. Its README
      states that archivemount is glue between libarchive and FUSE and can mount
      possibly compressed archives for filesystem-style access.
    - >
      The `-ng` repository imported historical upstream tarballs on 2024-06-14,
      including 0.1 through 0.9.1, and then released version 1 on 2024-06-17 with fixes
      and modernization such as FUSE3 support, a Makefile replacing the autotools build,
      README adaptation, and multiple Debian/upstream bug fixes.
  related-projects:
    - The README names libarchive and FUSE as the two main underlying projects.
    - >
      The README and release notes reference the older upstream GitHub project at
      `cybernoid/archivemount` as the source of several inherited issues and pull
      requests.
  sources:
    - https://git.sr.ht/~nabijaczleweli/archivemount-ng
    - https://git.sr.ht/~nabijaczleweli/archivemount-ng/refs
    - https://git.sr.ht/~nabijaczleweli/archivemount-ng/refs/rss.xml
  summary:
    - >
      archivemount is a small FUSE/libarchive utility that mounts archives such as tar,
      zip, ISO, and compressed archive files as ordinary filesystems.
  timeline:
    - >
      2024-06-14: `archivemount-ng` imports upstream archivemount tarballs including 0.1
      through 0.9.1.
    - '2024-06-17: Release 1 fixes multiple Debian/upstream bugs and adds FUSE3 support.'
    - '2024-12-21: Release 1a ports the project to macOS.'
    - '2025-05-14: Release 1b fixes non-ASCII filename handling.'
  usage:
    - >
      The man page synopsis is simply `archivemount [options] archive mountpoint`;
      unmounting is done with `umount` or `fusermount -u`. Options include read-only
      modes, password prompting, no-save/no-backup behavior, subtree filtering, and raw
      compressed-file mounting.
    - >
      The README warns that write support recreates the whole archive at unmount time,
      requires space and time, and carries explicit data-loss risk. For package users,
      the sane mental model is read-mostly archive browsing through FUSE, not a
      transactional archive editor.
related-packages:
  - id: brew:ratarmount
    reason: >
      Choose ratarmount for indexed random access, recursive archives, union mounts, or
      remote archives; its official documentation explicitly contrasts these
      capabilities with archivemount's libarchive-based approach.
    rel: alternative
    sources:
      - https://github.com/mxmlnkn/ratarmount#readme
      - https://git.sr.ht/~nabijaczleweli/archivemount-ng
