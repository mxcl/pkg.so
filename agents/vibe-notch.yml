credentials-file-location: null
history:
  adoption-history:
    - >
      Vibe Notch targets Claude Code users who want to monitor several sessions and
      handle permission requests without repeatedly returning to a terminal. Its
      official GitHub project has attracted a contributor community around that focused
      workflow.
  package-nerd-significance:
    - >
      For package-manager users, Vibe Notch is an example of a native macOS companion
      built around an AI command-line tool rather than a replacement for it. The cask
      makes a SwiftUI menu-bar utility and its automatic Claude Code hook integration
      installable alongside the CLI.
  project-history:
    - >
      The project was initially named Claude Island and later became Vibe Notch. Its
      README records a v1.2 release in December 2025, a four-month development pause,
      and resumed maintenance with v1.3 in April 2026.
  related-projects:
    - >
      Claude Code, whose hook events and session files provide Vibe Notch's underlying
      workflow.
    - Sparkle, used by the distributed application for automatic updates.
  sources:
    - 'Official product site: https://vibenotch.app/'
    - 'Official project README: https://github.com/farouqaldori/vibe-notch#readme'
    - 'Official releases: https://github.com/farouqaldori/vibe-notch/releases'
  summary:
    - >
      Vibe Notch is an open-source macOS menu-bar application that presents Claude Code
      activity through a Dynamic Island-style notch overlay. It monitors concurrent
      sessions, shows tool and file activity, renders chat history, and lets users
      approve or deny tool requests.
  timeline:
    - >
      December 2025: Version 1.2 was released under the project's earlier Claude Island
      identity.
    - 'April 2026: Development resumed with the 1.3 series.'
    - 'April 2026: The 1.3.2 release adopted the Vibe Notch name.'
  usage:
    - >
      On first launch, the application installs Claude Code hooks and records their
      registration in `~/.claude/settings.json`; hook scripts live under
      `~/.claude/hooks/`. The hooks send session events to the native application
      through a Unix socket.
    - >
      Typical use is to leave the menu-bar application running while one or more Claude
      Code terminals are active, then inspect progress or answer permission prompts from
      the notch overlay.
