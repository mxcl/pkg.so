history:
  package-nerd-significance:
    - >
      Its package significance is archival and Unix-philosophy oriented. There is no
      modern repository or broad adoption trail in the sources found, but the original
      page and USENIX article make it a source-backed example of late-1990s command-line
      experimentation around interactive filters.
  project-history:
    - >
      The project page ties vip to Singer's Toolman work and to an article, 'Toolman
      Edits Pipes -- Interactively!', published in the October 1997 issue of the USENIX
      Association's ;login: magazine. The page distributes the Bourne shell script,
      troff/PostScript man page, and article in HTML, text, PDF, and PostScript forms.
  sources:
    - https://users.cs.duke.edu/~des/scripts/vip.man
    - https://users.cs.duke.edu/~des/scripts/vip_article.html
    - https://users.cs.duke.edu/~des/vip.html
  summary:
    - >
      vip is a small Unix pipeline utility by Daniel E. Singer that inserts an
      interactive editor into a pipeline while still being used syntactically like a
      filter. The primary surviving project page is a Duke University page last updated
      on December 17, 1997.
  timeline:
    - '1997-10: The USENIX ;login: article about vip appeared.'
    - '1997-12-17: The Duke-hosted vip home page records its last update.'
  usage:
    - >
      vip's historical use case is classic Unix shell composition: place it in a
      pipeline where a normal filter would appear, edit the data interactively, then
      pass the result downstream. That makes it a small but recognizable member of the
      family of tools that exploit pipes, $EDITOR-style workflows, and shell filters
      rather than persistent project state.
