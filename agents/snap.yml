id: brew:snap
display-name: snap
repo: null
docs:
  - https://snapcraft.io/docs
config-file-location: null
credentials-file-location:
  linux:
    - ~/.snap/auth.json
history:
  adoption-history:
    - >
      Official Ubuntu installation docs say snap is pre-installed and ready to use on
      Ubuntu 16.04 LTS and later. The supplied metadata shows Homebrew, Debian, and
      Ubuntu packaging.
  package-nerd-significance:
    - >
      snap is significant because it is both a package format interface and a
      distribution mechanism: snapd manages confinement, automatic updates, channels,
      revisions, assertions, and cross-distribution installation semantics.
  project-history:
    - >
      The official snapd repository was created in October 2015. Snapcraft documentation
      describes snaps as self-contained packages across Linux distributions, while snapd
      handles installation, confinement, and updates.
  related-projects:
    - snapd
    - Snapcraft
    - Snap Store
    - Ubuntu Core
  sources:
    - https://api.github.com/repos/canonical/snapd
    - https://github.com/canonical/snapd
    - https://snapcraft.io/docs/
    - https://snapcraft.io/docs/reference/glossary/
    - https://snapcraft.io/docs/tutorials/get-started/
    - https://snapcraft.io/docs/tutorials/install-the-daemon/ubuntu/
    - input source_facts.package-manager
  summary:
    - >
      snap is the command-line interface provided by snapd for working with .snap
      packages and the Snap ecosystem.
  timeline:
    - '2015: Official snapd GitHub repository created.'
    - >
      2016: Ubuntu 16.04 LTS and later include snap support by default according to
      official docs.
    - >
      2026: Official docs describe snapd as handling installation, confinement, and
      updates across Linux distributions.
  usage:
    - >
      Users run snap list, snap install, snap refresh, snap remove, and snap run to
      manage installed snaps. Advanced functionality is documented as command-line
      oriented even when graphical package managers are available.
tags:
  - cli
  - linux
  - package-management
  - snap
  - snapd
  - software-distribution
