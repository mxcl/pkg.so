history:
  adoption-history:
    - >
      Cisdem distributes Data Recovery directly for macOS and it is also packaged as a
      Homebrew cask. The official company history identifies it as part of Cisdem's
      early Mac application portfolio.
  package-nerd-significance:
    - >
      The Homebrew cask gives command-line-oriented Mac administrators a repeatable
      installation path for a proprietary recovery utility. Unlike open-source recovery
      tools, its practical interest lies in packaging a signed graphical workflow for
      scans, previews, RAW recovery, damaged-media repair, and recovery-mode use.
  project-history:
    - >
      Cisdem records Data Recovery for Mac 2.0.0 in March 2015. Subsequent releases
      expanded the product beyond deleted-file recovery to formatted and unmountable
      media, raw scans, Apple-silicon recovery procedures, boot-drive creation, and
      repair of damaged media.
  related-projects:
    - Cisdem Data Recovery is part of Cisdem's macOS utility portfolio.
    - >
      Disk Utility is used in the official troubleshooting workflow to check whether
      macOS recognizes and mounts a target drive.
  sources:
    - https://www.cisdem.com/about.html
    - https://www.cisdem.com/data-recovery-mac.html
    - https://www.cisdem.com/resource/cisdem-data-recovery-user-guide.html
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Cisdem Data Recovery is a proprietary macOS utility for scanning storage devices
      and restoring deleted, formatted, inaccessible, or otherwise lost files. It also
      provides workflows for RAW recovery, unbootable Macs, and selected damaged-file
      repair.
  timeline:
    - '2015: Cisdem lists Data Recovery for Mac 2.0.0 among its early Mac products.'
    - >
      Later development: Support expanded to Apple-silicon recovery workflows, RAW
      recovery, macOS boot media, and damaged-media repair.
    - '2026: The supplied Homebrew Cask record distributes version 20.6.0.'
  usage:
    - >
      Users select a disk or storage device, run quick and deep scans, filter or preview
      discovered files, and recover selected data to a different destination. Cisdem
      advises avoiding writes to the affected source and saving recovered files
      elsewhere to reduce overwrite risk.
