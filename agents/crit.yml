history:
  adoption-history:
    - >
      Official quickstart instructions put Homebrew first and also document Go, Nix, and
      Windows binary installs. The README lists integrations with multiple AI coding
      tools, including Codex, Cursor, Claude Code, Copilot, Gemini, Qwen, Aider, and
      others, which positions the package as glue between local review workflows and
      agent CLIs.
  package-nerd-significance:
    - >
      crit is notable as an early package-manager-distributed tool aimed specifically at
      agent-assisted development loops. The packaging story is intentionally simple: one
      local binary, Homebrew install path, optional Go/Nix/Windows installs, and no
      requirement that the coding agent itself own the review UI.
  project-history:
    - >
      The project appeared publicly in 2026 and its README frames the problem as making
      agent output reviewable in interfaces suited to the artifact: markdown plans, code
      diffs, running web apps, and static HTML previews. Its official site describes the
      same local feedback-loop focus for AI agent code changes.
  related-projects:
    - >
      crit integrates with AI coding agents and editor/CLI assistants rather than
      replacing them.
    - crit-web is the related self-hostable service used when sharing reviews.
  sources:
    - https://crit.md/
    - https://github.com/tomasz-tomczyk/crit#readme
    - https://github.com/tomasz-tomczyk/crit/releases/tag/v0.1.0
  summary:
    - >
      crit is a local review-loop tool for AI-assisted development. It packages a
      browser review interface and a single CLI binary so users can review plans, diffs,
      and local web previews, then send comments back to coding agents.
  timeline:
    - '2026: Repository created in February.'
    - '2026: v0.1.0 release published on February 16.'
    - '2026: Rapid 0.x releases followed in February as the review-loop workflow evolved.'
  usage:
    - >
      Users run crit with no arguments to auto-detect git changes, pass markdown or HTML
      files for review, or pass a localhost URL for live web review. Configuration is
      split between global and project .crit.config.json files, with global-only
      settings for sensitive agent command execution and authentication-related options.
