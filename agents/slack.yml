history:
  adoption-history:
    - >
      Slack grew from a small group of beta users into workplace infrastructure used
      across many industries. By 2018, Slack described a globally distributed staff of
      more than 1,000 and millions of professional users; its 2024 anniversary account
      said more than a million developers had built integrations for the platform.
    - >
      Salesforce completed its acquisition of Slack Technologies in July 2021. Slack
      subsequently became a central conversational and collaboration layer in
      Salesforce's product strategy.
  package-nerd-significance:
    - >
      Slack helped normalize persistent, channel-based workplace communication, emoji
      reactions, searchable team history, and extensive application integrations. For
      package users, the desktop cask is a common way to keep the native client
      reproducibly installed outside an app store.
    - >
      Its desktop client is also relevant to fleet administrators: Slack officially
      supports centrally managed defaults and enforced settings on macOS, Windows, and
      Linux.
  project-history:
    - >
      Slack emerged from a gaming-project context and publicly launched as a messaging
      product in 2014. The product developed from simple workplace messaging into a
      platform organized around channels, threads, integrations, external collaboration,
      huddles, workflow automation, canvases, and AI-assisted search and summaries.
  related-projects:
    - Salesforce acquired Slack in 2021 and integrates it with Salesforce data and Agentforce.
    - >
      The Slack Marketplace and Slack APIs support third-party and internal application
      integrations.
    - Slack Connect extends channels to collaboration between organizations.
  sources:
    - 'Official Salesforce acquisition announcement: https://www.salesforce.com/news/?p=49185'
    - >
      Official desktop configuration guide:
      https://slack.com/help/articles/11906214948755-Manage-desktop-app-configurations
    - 'Official product overview: https://slack.com/help/articles/115004071768-What-is-Slack'
    - 'Official tenth-anniversary history: https://slack.com/blog/news/slack-turns-10'
  summary:
    - >
      Slack is a channel-based team communication and collaboration service that evolved
      into an extensible workplace platform and became part of Salesforce in 2021.
  timeline:
    - '2014: Slack publicly launched.'
    - >
      2018: Slack reported growth from a few thousand beta testers to millions of
      professional users.
    - '2021-07-21: Salesforce completed its acquisition of Slack Technologies.'
    - '2024-02-14: Slack marked ten years and began rolling out Slack AI.'
  usage:
    - >
      Teams organize work in channels, direct messages, threads, huddles, canvases,
      lists, and searchable shared history. Integrations and workflows bring
      notifications, data, and actions from other tools into the workspace.
    - >
      Desktop administrators can distribute managed settings. Slack documents
      /etc/slack-desktop.conf for Linux; macOS management uses plist or mobileconfig
      profiles under the com.tinyspeck.slackmacgap domain, while Windows management uses
      Group Policy registry locations.
