config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      getdns occupies a specialized layer in the DNS ecosystem: lower-level than
      application frameworks but higher-level than raw resolver libraries. Its
      distribution through Homebrew and major Unix-like package managers reflects use by
      DNS engineers, resolver-tool authors, and privacy-focused networking users.
  package-nerd-significance:
    - >
      For package maintainers, getdns is important because optional features map
      directly to dependency choices: OpenSSL, libunbound, libidn2, event-loop
      libraries, and Stubby support all affect the build. Its packaging footprint
      therefore records how each platform chooses resolver, DNSSEC, and DNS privacy
      tradeoffs.
  project-history:
    - >
      The API specification was originally edited by Paul Hoffman, and the open source C
      implementation has been developed with NLnet Labs, Sinodun, and No Mountain
      Software. The GitHub repository dates to 2014 and the release history shows a 1.x
      line that added DNS privacy work, CMake builds, platform fixes, and Stubby
      integration.
  related-projects:
    - >
      getdns is closely related to Stubby, Unbound, libidn2, OpenSSL, and event-loop
      libraries such as libevent, libuv, and libev.
  sources:
    - https://api.github.com/repos/getdnsapi/getdns
    - https://getdnsapi.net/
    - https://getdnsapi.net/documentation/spec/
    - https://getdnsapi.net/releases/
    - https://github.com/getdnsapi/getdns
    - https://raw.githubusercontent.com/getdnsapi/getdns/develop/ChangeLog
    - https://raw.githubusercontent.com/getdnsapi/getdns/develop/README.md
  summary:
    - >
      getdns is a C implementation of a modern asynchronous DNS API. It was designed to
      expose DNS data, DNSSEC validation, event-loop integration, and DNS privacy
      features to application developers who do not want to hand-code low-level resolver
      behavior.
  timeline:
    - '2014: The public GitHub repository for getdns was created.'
    - '2019: The 1.6.0 beta moved the build system to CMake.'
    - '2020: Version 1.6.0 was released.'
    - '2021: Version 1.7.0 added transport and DNS behavior fixes.'
    - '2022: Version 1.7.3 shipped as a quickfix release with Stubby 0.4.3.'
  usage:
    - >
      Practitioners use libgetdns in C programs that need asynchronous DNS lookups,
      DNSSEC status, IDNA handling, event-loop adapters, or DNS-over-TLS behavior. The
      package also installs `getdns_query` for command-line testing and
      `getdns_server_mon` for server capability checks.
related-packages:
  - id: brew:stubby
    reason: >
      Stubby is built on getdns and turns the library's DNS Privacy support into a local
      DNS-over-TLS stub resolver for applications on the same machine.
    rel: adjacent_workflow
    sources:
      - https://github.com/getdnsapi/getdns#stubby
      - https://github.com/getdnsapi/stubby#readme
  - id: brew:c-ares
    reason: >
      c-ares is a lighter asynchronous DNS-library alternative when an application
      primarily needs nonblocking name resolution rather than getdns's structured DNS,
      DNSSEC, and DNS-over-TLS feature set.
    rel: alternative
    sources:
      - https://c-ares.org/docs.html
      - https://getdnsapi.net/documentation/spec/
  - id: brew:ldns
    reason: >
      ldns is an alternative DNS programming library with a broad suite of DNS and
      DNSSEC utilities, suited to low-level packet and zone manipulation rather than
      getdns's application-oriented asynchronous API.
    rel: alternative
    sources:
      - https://nlnetlabs.nl/projects/ldns/about/
      - https://getdnsapi.net/documentation/spec/
