id: cask:intellij-idea@eap
display-name: IntelliJ IDEA EAP
repo: https://github.com/JetBrains/intellij-community
docs:
  - https://www.jetbrains.com/help/idea
  - https://www.jetbrains.com/idea/nextversion
config-file-location:
  linux:
    - ~/.config/JetBrains/IntelliJIdea<version>
  macos:
    - ~/Library/Application Support/JetBrains/IntelliJIdea<version>
  windows:
    - '%APPDATA%\JetBrains\IntelliJIdea<version>'
credentials-file-location: null
history:
  adoption-history:
    - >
      IntelliJ IDEA became a major JVM development environment and JetBrains reported
      more than four million users at its twentieth anniversary. Its open-source
      codebase also became the foundation for a broad plugin ecosystem and for tools
      including Android Studio.
    - >
      The EAP channel gives developers and plugin authors access to forthcoming IDE and
      platform changes before stable release, creating a feedback loop between JetBrains
      and early adopters.
  package-nerd-significance:
    - >
      The EAP cask allows a preview IDE to be installed alongside stable development
      tools. Package maintainers and plugin authors care about it because bundled
      runtimes, plugin APIs, project models, and platform behavior can change before
      general availability.
  project-history:
    - >
      JetBrains launched IntelliJ IDEA in 2001 as a Java IDE emphasizing code
      navigation, analysis, and refactoring.
    - >
      In 2009 JetBrains introduced the free, Apache-licensed Community Edition and
      open-sourced the shared IntelliJ Platform. JetBrains placed an official Community
      Edition mirror in its GitHub organization in 2011.
  related-projects:
    - IntelliJ Platform
    - Android Studio
    - Kotlin
    - JetBrains IDEs
  sources:
    - https://blog.jetbrains.com/idea/2009/10/intellij-idea-open-sourced/
    - https://blog.jetbrains.com/idea/2011/10/intellij-idea-community-edition-now-on-github/
    - https://blog.jetbrains.com/idea/2021/01/intellij-idea-turns-20/
    - https://www.jetbrains.com/idea/nextversion/
  summary:
    - >
      IntelliJ IDEA EAP is the early-access distribution of JetBrains' IntelliJ IDEA
      integrated development environment.
  timeline:
    - '2001: JetBrains launched IntelliJ IDEA.'
    - '2009: IntelliJ IDEA Community Edition and the IntelliJ Platform were open-sourced.'
    - '2011: JetBrains published the official IntelliJ IDEA Community Edition mirror on GitHub.'
  usage:
    - >
      Developers use EAP builds to evaluate upcoming IDE features, test projects and
      plugins against the next platform release, and report defects before stable
      release. Because EAP builds are previews, they are commonly kept separate from
      production IDE installations.
