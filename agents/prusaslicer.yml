history:
  adoption-history:
    - >
      Prusa Research released Slic3r Prusa Edition in November 2016 to accelerate slicer
      development for its printers. The project gained a dedicated development team, was
      rewritten from Perl to C++, and expanded beyond Prusa hardware with profiles for
      printers from many manufacturers.
  package-nerd-significance:
    - >
      PrusaSlicer is a prominent open-source link in the RepRap slicer family. Its
      lineage, portable profile bundles, command-line capabilities, broad printer
      support, and downstream forks make it important to 3D-printing users who manage
      repeatable toolchains rather than treating slicing as a printer-specific black
      box.
  project-history:
    - >
      PrusaSlicer descends from Alessandro Ranellucci's Slic3r, which began in the
      RepRap community in 2011. Prusa Research forked it as Slic3r Prusa Edition in
      2016. In May 2019, the substantially rewritten version 2.0 adopted the PrusaSlicer
      name and added a redesigned interface and MSLA support.
  related-projects:
    - Slic3r is the upstream project from which Slic3r Prusa Edition originated.
    - SuperSlicer is a downstream fork of PrusaSlicer.
    - PrusaControl was discontinued, with some functionality incorporated into PrusaSlicer.
  sources:
    - https://blog.prusa3d.com/celebrating-slic3rs-10th-anniversary_54724/
    - https://blog.prusa3d.com/prusaslicer-2-release_30008/
    - https://github.com/prusa3d/PrusaSlicer
    - https://help.prusa3d.com/product/prusaslicer/about-prusaslicer_205
  summary:
    - >
      PrusaSlicer is Prusa Research's open-source slicer for converting 3D models into
      instructions for FDM and mSLA printers. Although developed by a printer
      manufacturer, it supports machines from many vendors.
  timeline:
    - '2011: Slic3r began within the RepRap community.'
    - '2016: Prusa Research released Slic3r Prusa Edition.'
    - >
      2019: Version 2.0 was renamed PrusaSlicer after a major C++ rewrite and interface
      overhaul.
  usage:
    - >
      Users import 3D models, select printer, filament or resin, and print profiles,
      arrange and modify objects, preview toolpaths, and export G-code or resin-print
      data. Custom profiles can be exported as configuration bundles and transferred
      between installations.
