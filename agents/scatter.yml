history:
  adoption-history:
    - >
      Scatter Desktop connected decentralized applications to locally managed wallet
      identities and supported EOS, Ethereum, and Tron. The related ScatterJS library
      documented Scatter Desktop as one implementation of the Scatter protocols
      alongside compatible third-party wallets.
    - >
      The official repository records 36 releases, with its latest listed release,
      Scatter Simple, published in April 2020. The Homebrew Cask record brought the
      desktop client into macOS package-manager workflows.
  package-nerd-significance:
    - >
      Scatter sits at the intersection of Electron desktop packaging, cryptocurrency key
      management, and dapp authentication. Its repository also preserves a period when
      wallet-specific JavaScript bridges were a common way for web applications to reach
      locally protected keys.
  project-history:
    - >
      Scatter Desktop was developed by GetScatter as an open-source desktop blockchain
      wallet and local-machine authentication provider. Its Electron client depended on
      ScatterEmbed for the embedded wallet interface and offered builds for macOS,
      Windows, and Linux.
  related-projects:
    - ScatterEmbed supplied the embedded wallet software used by the desktop client.
    - >
      scatter-js allowed web applications to communicate with Scatter Desktop and other
      wallets implementing Scatter protocols.
  sources:
    - 'Homebrew Cask provenance: source_facts.package-manager and source_facts.provenance'
    - 'Official ScatterJS repository: https://github.com/GetScatter/scatter-js'
    - 'Official desktop repository and README: https://github.com/GetScatter/ScatterDesktop'
  summary:
    - >
      Scatter Desktop is an open-source Electron cryptocurrency wallet and local
      authentication client for decentralized applications, with support documented for
      EOS, Ethereum, and Tron.
  timeline:
    - "2020: The repository's latest listed release, Scatter Simple, was published on April 23."
  usage:
    - >
      Users manage blockchain assets and authorize compatible decentralized applications
      through a locally running desktop wallet. Developers can run the Electron client
      with ScatterEmbed and point development builds at an embed instance through the
      source tree's .env file.
