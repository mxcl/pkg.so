history:
  adoption-history:
    - >
      Tana moved from a stealth prototype to early access in 2022 and built a community
      around connected outlining, daily notes, and reusable supertags. Tana reported a
      public launch in 2025 after several years of early-access development.
    - >
      In March 2026, the company separated the original power-user knowledge tool,
      renamed Tana Outliner, from a new team-oriented Tana product. The existing
      outliner remained supported and continued to receive improvements.
  package-nerd-significance:
    - >
      Tana Outliner attracted productivity-tool enthusiasts by combining an outliner
      with graph references, typed nodes, fields, live searches, multiple views, and
      user-defined commands. Supertags let users progressively turn free-form notes into
      structured, queryable objects without first designing a separate database.
    - >
      The desktop package matters beyond being a web wrapper because it supports
      capabilities such as meeting audio capture and transcription. The official release
      repository distributes auto-updating builds, while the Homebrew cask provides a
      package-manager installation path.
  project-history:
    - >
      The founders began building Tana around 2020 with the goal of joining unstructured
      notes and structured knowledge. During 2022 it emerged from stealth into early
      access, and a dedicated desktop application for macOS, Windows, and Linux followed
      in October 2023.
    - >
      Tana increasingly added AI, voice capture, meeting transcription, automation,
      mobile tools, and MCP/API integrations. In 2026 the company preserved this product
      as Tana Outliner while launching a distinct, more collaboration-focused Tana
      experience.
  related-projects:
    - >
      The newer Tana product is a separate team-oriented workspace built around
      meetings, documents, shared context, and AI agents.
    - >
      Tana Mobile and Tana Capture complement Tana Outliner for mobile and quick-capture
      workflows.
    - >
      The Tana API and MCP integration expose workspace context to external automation
      and AI tools.
  sources:
    - Input source_facts.package-manager.brew-cask.
    - https://github.com/tanainc/tana-desktop-releases
    - https://outliner.tana.inc/blog/news
    - https://outliner.tana.inc/blog/the-next-chapter-for-tana
    - https://outliner.tana.inc/learn
  summary:
    - >
      Tana Outliner is the original Tana knowledge-management product: a connected
      outliner and knowledge graph with structured supertags, live searches, AI tools,
      daily notes, tasks, and meeting capture.
  timeline:
    - 'Circa 2020: Development began on the knowledge-graph workspace.'
    - '2022: Tana moved from a stealth prototype into early access.'
    - '2023-10-10: Tana launched its desktop application for macOS, Windows, and Linux.'
    - '2025: Tana reached public launch.'
    - >
      2026-03-31: The original product was renamed Tana Outliner as the company
      introduced a separate new Tana.
  usage:
    - >
      Users capture information as nested nodes, reference the same node from multiple
      contexts, add reusable supertags and fields, and present results as outlines,
      tables, cards, calendars, or other views. Daily notes, searches, command nodes, AI
      chat, meeting transcription, and integrations support personal knowledge and
      workflow automation.
