history:
  adoption-history:
    - >
      Audirvāna expanded from a macOS-only audiophile player into a broader playback
      platform. It gained its own library manager in 2014, integrated Qobuz in 2015,
      added TIDAL and HighResAudio in 2016, and reached Windows in 2018.
    - >
      The Studio and Origin platform arrived in 2021. Audirvāna subsequently added
      radio, podcasts, Chromecast Audio, and other playback features; its Plays with
      Audirvāna certification program began in 2023, followed by Linux and NAS-oriented
      availability in 2024.
  package-nerd-significance:
    - >
      Audirvāna is notable in desktop package catalogs as a long-running proprietary
      audiophile player whose appeal centers on direct, carefully controlled delivery of
      digital audio to external DACs.
    - >
      Its progression from a Mac-native player to Windows, remote-control apps,
      streaming integrations, and Linux-based audio servers reflects the convergence of
      local music libraries, streaming services, and dedicated hi-fi hardware.
  project-history:
    - >
      French developer Damien Plisson created Audirvāna after finding existing
      computer-based audiophile playback unsatisfactory. The first macOS version was
      released in 2011 and was designed to bypass default Mac audio processing in favor
      of direct DAC access.
    - >
      Version 3 arrived in 2017 with MQA support, oversampling, and UPnP/DLNA
      capability. The product line later evolved into Audirvāna Studio and Audirvāna
      Origin.
  related-projects:
    - >
      Audirvāna Remote provides mobile control. Audirvāna Studio is the
      subscription-oriented product, while Audirvāna Origin focuses on locally stored
      music.
  sources:
    - https://audirvana.com/about/
    - https://audirvana.com/changes-since-older-versions/
    - https://help.audirvana.com/support/home
  summary:
    - >
      Audirvāna is high-fidelity audio playback and library-management software created
      by Damien Plisson. It is designed to turn computers and compatible servers into
      digital sources for hi-fi systems.
  timeline:
    - '2011: First macOS version released.'
    - '2014: Independent music-library management added.'
    - '2015: Qobuz integration added.'
    - '2016: TIDAL and HighResAudio integrations followed.'
    - '2017: Version 3 added MQA, oversampling, and UPnP/DLNA.'
    - '2018: First Windows version released.'
    - '2021: Current Studio and Origin platform launched.'
    - '2023: Plays with Audirvāna certification program launched.'
    - '2024: Linux version introduced for NAS and Linux-based audio servers.'
  usage:
    - >
      Audirvāna is commonly used to organize and play local music libraries, access
      supported streaming services, and send high-resolution audio to DACs and network
      players. Device-specific audio settings, remote control, UPnP/DLNA, and Chromecast
      support serve more elaborate listening systems.
