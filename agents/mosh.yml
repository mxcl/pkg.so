history:
  project-history:
    - >
      The 2012 evaluation reported real-world keystroke traces from six users and found
      that Mosh could immediately display the effects of 70 percent of keystrokes; over
      a commercial EV-DO network, median keystroke response latency was under 5 ms
      compared with 503 ms for SSH. The USENIX page also records more than 15,000
      downloads in the first week after release, making Mosh one of the better-known
      examples of systems research packaged as a practical Unix tool.
  sources:
    - https://formulae.brew.sh/formula/mosh
    - https://github.com/mobile-shell/mosh
    - https://mosh.org/
    - https://www.usenix.org/conference/atc12/technical-sessions/presentation/winstein
  summary:
    - >
      Mosh, the mobile shell, originated at MIT CSAIL as research by Keith Winstein and
      Hari Balakrishnan and was presented at USENIX ATC 2012. The paper framed it as a
      remote terminal application for intermittent connectivity, roaming between
      networks, and speculative local echo over high-latency paths. Its core technical
      contribution was the State Synchronization Protocol, a UDP-based protocol for
      synchronizing client and server terminal state even when the client's IP address
      changes.
  usage:
    - >
      In everyday use, mosh looks like ssh at the command line but uses SSH only to
      authenticate and start mosh-server on the remote host. After the bootstrap, the
      terminal session moves to UDP, usually on a high port in the 60000-61000 range. It
      is packaged broadly across Unix-like systems because its main audience is shell
      users who work from laptops, unstable Wi-Fi, cellular links, or roaming networks
      and want terminal sessions to survive connectivity changes.
related-packages:
  - id: brew:openssh
    reason: >
      OpenSSH provides Mosh's documented authentication and server-bootstrap step and
      remains the better general-purpose choice for noninteractive commands, forwarding,
      and file transfer.
    rel: adjacent_workflow
    sources:
      - https://mosh.org/
      - https://www.openssh.com/manual.html
  - id: brew:et
    reason: >
      Eternal Terminal is an alternative reconnecting remote shell that emphasizes
      native scrolling and tmux integration, while Mosh emphasizes predictive echo, UDP
      roaming, and synchronized terminal state.
    rel: alternative
    sources:
      - https://eternalterminal.dev/
      - https://mosh.org/
  - id: brew:tmux
    reason: >
      tmux complements Mosh by keeping and multiplexing server-side terminal sessions
      while Mosh supplies the documented roaming transport used to reach them.
    rel: adjacent_workflow
    sources:
      - https://mosh.org/
      - https://github.com/tmux/tmux/wiki
