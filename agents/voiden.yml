id: cask:voiden
display-name: Voiden
repo: https://github.com/VoidenHQ/voiden
docs:
  - https://docs.voiden.md/
config-file-location:
  unix:
    - <project-root>/.voiden/env-public.yaml
    - <project-root>/.voiden/env-{profile}-public.yaml
  windows:
    - <project-root>\.voiden\env-public.yaml
    - <project-root>\.voiden\env-{profile}-public.yaml
credentials-file-location:
  unix:
    - <project-root>/.voiden/env-private.yaml
    - <project-root>/.voiden/env-{profile}-private.yaml
  windows:
    - <project-root>\.voiden\env-private.yaml
    - <project-root>\.voiden\env-{profile}-private.yaml
history:
  adoption-history:
    - >
      Voiden is distributed for macOS, Windows, and Linux, with Homebrew, APT, Snap, and
      Nix workflows documented by the project. Its file-based approach is intended to
      fit existing Git branches, pull requests, editors, terminals, and CI systems
      rather than introducing a hosted collaboration service.
  package-nerd-significance:
    - >
      Voiden treats API requests and their documentation as diffable source artifacts
      rather than opaque application state. That makes it notable to package and tooling
      enthusiasts interested in local-first software, reproducible developer workflows,
      composable text formats, and avoiding cloud lock-in.
  project-history:
    - >
      Voiden was developed as an offline, open-source alternative to cloud-oriented API
      clients. The project centers its workflow on plain-text .void documents that
      combine Markdown with reusable request blocks.
    - >
      The project expanded beyond its Electron desktop application with plugins,
      importers for established API formats, scripting hooks, and the headless
      @voiden/runner for terminal and CI execution.
  related-projects:
    - Postman and Insomnia collections can be imported into Voiden.
    - OpenAPI documents can be imported into native Voiden workflows.
    - '@voiden/runner executes .void files in terminals and CI systems.'
  sources:
    - https://docs.voiden.md/
    - https://docs.voiden.md/docs/getting-started-section/advanced-environment-config/
    - https://github.com/VoidenHQ/voiden#readme
    - https://voiden.md/
  summary:
    - >
      Voiden is an offline, Git-native API development workspace. It combines executable
      requests, tests, notes, and documentation in plain-text .void files stored
      alongside source code.
  timeline:
    - >
      The project established .void as a Markdown-based format for executable API
      requests and documentation.
    - >
      Later development added REST, GraphQL, gRPC, WebSocket, scripting, import, plugin,
      and batch-runner workflows.
    - >
      2026: Official materials documented cross-platform package-manager distribution
      and a headless runner for CI use.
  usage:
    - >
      Developers create .void files containing Markdown and structured request blocks,
      execute them in the desktop application, and commit them with the surrounding
      code. Workflows cover API design, manual exploration, assertions, documentation,
      and batch execution.
    - >
      Environment profiles live in a project-local .voiden directory. Public YAML files
      are designed for version control, while private files hold sensitive local values
      and are automatically excluded through .gitignore management.
