history:
  adoption-history:
    - >
      ShadowsocksX packaged the Shadowsocks client model in a menu-bar-oriented Mac
      interface. The official help page documents drag-to-Applications installation and
      automatic configuration of macOS global proxy settings.
    - >
      The supplied package metadata says this particular cask was removed according to
      regulations. The Shadowsocks organization subsequently presents ShadowsocksX-NG as
      the next-generation macOS implementation.
  package-nerd-significance:
    - >
      ShadowsocksX is notable in package-manager history as an early native Mac front
      end for the Shadowsocks ecosystem. It turned a local proxy client and PAC-based
      routing into a conventional menu-bar application, reducing the setup needed for
      desktop users.
    - >
      It is also a useful example of a package name outliving its preferred
      implementation: package users may encounter the historical ShadowsocksX cask while
      the upstream organization now highlights ShadowsocksX-NG.
  project-history:
    - >
      ShadowsocksX was developed as a GUI for OS X 10.8 and later. Its official help
      describes automatic system-proxy configuration, GFWList PAC routing, and a local
      SOCKS service on 127.0.0.1:1080.
    - >
      The application shared its official repository and wiki with the historical
      shadowsocks-iOS project. A later clean-room-style successor, ShadowsocksX-NG, was
      written in Swift to reduce the maintenance burden of the original implementation
      and its embedded client dependencies.
  related-projects:
    - Shadowsocks is the underlying encrypted proxy ecosystem.
    - >
      ShadowsocksX-NG is the official organization's next-generation macOS client and
      explains that it replaced the difficult-to-maintain original implementation.
  sources:
    - 'Official Shadowsocks organization profile: https://github.com/shadowsocks'
    - >
      Official ShadowsocksX OS X help:
      https://github.com/shadowsocks/shadowsocks-iOS/wiki/Shadowsocks-for-OSX-Help
    - 'Official ShadowsocksX-NG README: https://github.com/shadowsocks/ShadowsocksX-NG'
    - 'Package status: source_facts.description'
  summary:
    - >
      ShadowsocksX is the historical macOS GUI client for Shadowsocks. It runs from the
      menu bar, configures macOS proxy settings, and exposes a local SOCKS proxy for
      applications using the system proxy or an explicit local endpoint.
  timeline:
    - >
      2015: The official OS X help wiki documented the mature menu-bar workflow,
      automatic system-proxy configuration, PAC mode, and local SOCKS endpoint.
    - >
      Later: ShadowsocksX-NG emerged as the official organization's next-generation
      Swift implementation.
    - 'Package status: The supplied cask metadata records removal according to regulations.'
  usage:
    - >
      Users install the application in /Applications, launch it, configure a Shadowsocks
      server through the menu-bar preferences, and allow it to manage system proxy
      settings.
    - >
      Advanced use includes disabling the global proxy while retaining the local service
      at 127.0.0.1:1080, selecting a different server, and reviewing ShadowsocksX
      messages in Console.app.
