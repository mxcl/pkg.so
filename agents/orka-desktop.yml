history:
  adoption-history:
    - >
      MacStadium distributes Orka Desktop as a free macOS application, through GitHub
      releases, and through the Homebrew cask. It targets iOS and macOS developers,
      testers, DevOps engineers, support teams, and IT administrators who need local
      Apple-silicon virtual machines.
  package-nerd-significance:
    - >
      Orka Desktop connects macOS VM creation with OCI registry workflows. Package and
      CI practitioners can build and test an image locally, publish it to a compatible
      registry, and reuse it with Orka cloud infrastructure instead of maintaining
      unrelated local and remote image formats.
  project-history:
    - >
      MacStadium developed Orka Desktop as a workstation-oriented companion to its Orka
      cloud platform. The application creates and manages macOS virtual machines locally
      and can save, pull, and push VM images using OCI-compatible registries.
  related-projects:
    - MacStadium Orka is the associated cloud platform for running macOS workloads.
    - >
      OCI-compatible registries such as GitHub Container Registry and Docker Hub can
      store images produced or consumed by Orka Desktop.
  sources:
    - https://github.com/macstadium/orka-desktop
    - >
      https://support.macstadium.com/hc/en-us/articles/28396626048667-Welcome-to-Orka-Desktop-3-0
  summary:
    - >
      Orka Desktop is MacStadium's free local macOS virtualization application for
      creating, managing, testing, and sharing Apple-silicon virtual-machine images.
  timeline:
    - >
      Orka Desktop 3.0: MacStadium documented a workflow centered on local macOS VMs and
      OCI-compatible image registries.
  usage:
    - >
      Users create a clean macOS VM from an Apple IPSW or pull an existing image from a
      registry, allocate CPU, memory, storage, and display settings, and operate the VM
      through the graphical application. Images can be pushed to registries for
      collaboration or deployment to Orka cloud environments. Registry credentials are
      entered in the application, but the official guide does not document a credentials
      file path.
