history:
  adoption-history:
    - >
      Evernote became a widely recognized cross-platform personal-information product
      built around synchronized notes, notebooks, tags, attachments, web capture, and
      search. Official company material described more than 250 million customers and
      nearly 11 billion notes at the time the Bending Spoons acquisition was announced.
    - >
      Its long-term appeal has centered on acting as an external memory or 'second
      brain': users accumulate searchable personal and professional archives and access
      them across desktop, web, and mobile clients.
  package-nerd-significance:
    - >
      Evernote helped normalize cloud-synchronized note databases, web clipping,
      searchable attachments, and OCR as mainstream productivity workflows. Long-lived
      personal archives and cross-device clients made migration, export, offline access,
      and local storage behavior especially important to power users.
    - >
      The desktop package maintains a local database for synchronized notebooks and
      notes, enabling offline access after sign-in while the service remains account-
      and cloud-centered.
  project-history:
    - >
      Stepan Pachikov founded Evernote around the idea that software could augment human
      memory. The product evolved from note capture and organization into a broader
      information-management workspace spanning notes, tasks, calendars, search, and
      collaboration.
    - >
      Evernote introduced a rebuilt generation of clients as version 10 in 2020. Bending
      Spoons announced an agreement to acquire the company in November 2022 and
      completed the acquisition in January 2023. Evernote version 11 arrived in 2026
      with AI Assistant, semantic search, and AI meeting-note capabilities.
  related-projects:
    - Evernote Web Clipper
    - Evernote Tasks
    - Evernote Calendar
    - Evernote Web
  sources:
    - https://evernote.com/blog/bending-spoons-to-acquire-evernote
    - https://evernote.com/blog/ian-small-new-ceo
    - https://evernote.com/en-us/blog/introducing-v11
    - https://evernote.com/ja-jp/blog/new-phase-in-evernote-history
    - >
      https://help.evernote.com/hc/en-us/articles/209005177-Set-up-offline-notes-and-notebooks-on-mobile-devices
  summary:
    - >
      Evernote is a cross-platform note-taking and personal-information service for
      capturing, organizing, searching, synchronizing, and acting on notes and related
      content.
  timeline:
    - '2020: Evernote introduced its rebuilt version 10 client generation.'
    - '2022: Bending Spoons announced an agreement to acquire Evernote.'
    - '2023: Bending Spoons completed the acquisition.'
    - '2026: Evernote introduced version 11 with new AI and semantic-search features.'
  usage:
    - >
      Users create notes and notebooks, organize material with tags, attach documents
      and media, clip web content, search text and recognized content, track tasks, and
      synchronize their workspace across devices. Desktop clients keep synchronized
      notes in a local database for offline access.
