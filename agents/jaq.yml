history:
  adoption-history:
    - >
      jaq spread through Rust and package-manager channels: the README links
      crates.io/docs.rs badges for `jaq-core`, binary releases for Linux, macOS, and
      Windows, Homebrew install commands, and a Repology packaging badge. Homebrew API
      data available during this enrichment recorded 2,232 installs over 365 days.
    - >
      The project also gained formal support and review. The README credits NLnet and
      NGI0 funding, and its security section records Radically Open Security audits tied
      to NLnet grants, with audit findings addressed and fuzzing targets added.
  package-nerd-significance:
    - >
      jaq matters to package nerds because it is a modern reimplementation of a beloved
      Unix data-filter language with a Rust library boundary, strong benchmarking
      culture, audit notes, and multi-format ambitions. It is the kind of package users
      install when they care about jq semantics, startup cost, embedding, and
      structured-data plumbing.
  project-history:
    - >
      The GitHub repository was created in December 2020. The README says jaq was
      originally motivated by the startup time of jq 1.6 and later kept its focus on
      correctness, performance, and a small implementation that is easier to audit and
      contribute to.
    - >
      The project expanded beyond JSON-only jq compatibility. The README and manual
      document YAML, CBOR, TOML, XML, CSV, TSV, byte strings, non-string object keys,
      in-place replacement, and explicit documentation of divergences from jq. Release
      notes for the 3.0 line describe multi-format support as a major shift, effectively
      making jaq a structured-data transformation tool rather than only a jq clone.
  related-projects:
    - >
      jaq is directly related to jq, gojq, the jq language specification work linked
      from its manual, and Rust crates such as `jaq-core`, `jaq-json`, `jaq-all`, and
      `jaq-fmts`. The README also mentions hifijson as a related parser project with
      fuzzing history.
  sources:
    - https://api.github.com/repos/01mf02/jaq
    - https://api.github.com/repos/01mf02/jaq/releases?per_page=10
    - https://formulae.brew.sh/api/formula/jaq.json
    - https://gedenkt.at/jaq/manual/
    - https://github.com/01mf02/jaq
    - https://raw.githubusercontent.com/01mf02/jaq/main/README.md
  summary:
    - >
      jaq is a Rust implementation of the jq language and command-line JSON processing
      workflow, focused on correctness, speed, and simplicity. It is both a `jaq`
      executable for shell pipelines and a Rust library, `jaq-core`, for embedding
      jq-like filters in applications.
  timeline:
    - '2020: GitHub repository created for the Rust jq clone.'
    - >
      2024: v2.0.1 release notes focused on command-line flag behavior such as
      `--null-input`, `--slurpfile`, and `--from-file`.
    - >
      2025: v2.2.0 release notes recorded path-related language work and noted that
      jaq-core had been audited by Radically Open Security.
    - >
      2025: v3.0.0-alpha release notes introduced a new manual and support for YAML,
      CBOR, TOML, and XML under NLnet-backed work.
    - >
      2026: v3.0.0 release notes described multi-format support for YAML, CBOR, TOML,
      XML, CSV, TSV, and JSON.
    - "2026: v3.1.0 release notes added jq's `input_filename` filter and compatibility fixes."
  usage:
    - >
      Users can treat `jaq` as a drop-in `jq` replacement for many filters, use it to
      transform JSON and other structured formats, or embed `jaq-core` in Rust programs.
      The manual covers the CLI, jq core language, standard library, advanced features,
      supported formats, examples, and documented compatibility differences.
related-packages:
  - id: brew:jq
    reason: >
      Choose jq for the canonical C implementation and compatibility baseline; choose
      jaq for a Rust implementation with additional structured-data formats and an
      embeddable Rust API.
    rel: alternative
    sources:
      - https://github.com/01mf02/jaq
      - https://jqlang.github.io/jq/
  - id: brew:gojq
    reason: >
      Choose gojq when a pure-Go executable or Go library and arbitrary-precision
      integer arithmetic are priorities; choose jaq for its Rust API and broader
      built-in format support.
    rel: alternative
    sources:
      - https://github.com/01mf02/jaq
      - https://github.com/itchyny/gojq/blob/main/README.md
