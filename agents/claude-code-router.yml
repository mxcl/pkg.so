id: brew:claude-code-router
display-name: Claude Code Router
repo: https://github.com/musistudio/claude-code-router
docs:
  - https://musistudio.github.io/claude-code-router/docs/cli/quick-start
  - https://github.com/musistudio/claude-code-router#readme
  - https://musistudio.github.io/claude-code-router/en
config-file-location:
  unix:
    - ~/.claude-code-router/config.json
  windows:
    - '%APPDATA%\Claude Code Router\config.json'
credentials-file-location:
  unix:
    - ~/.claude-code-router/config.json
  windows:
    - '%APPDATA%\Claude Code Router\config.json'
history:
  adoption-history:
    - >
      Distribution is source-backed through npm and Homebrew. The npm registry records
      75 versions of `@musistudio/claude-code-router`, and Homebrew metadata records
      version 2.0.0 from the npm registry with Node as a dependency.
    - >
      The README documents desktop downloads from GitHub Releases for macOS, Windows,
      and Linux AppImage, while the Homebrew formula covers the CLI-oriented install
      path for package-manager users.
  package-nerd-significance:
    - >
      Claude Code Router matters to package nerds because it turns an AI coding tool's
      network boundary into a local, configurable package. Instead of patching every
      client, users install one gateway and let profiles, environment, and local
      endpoints do the switching.
    - >
      It is also a snapshot of the 2025-2026 AI CLI ecosystem: npm package, Homebrew
      formula, Electron-style desktop artifacts, local daemon ports, provider presets,
      and plugin hooks all converge around agentic coding workflows.
  project-history:
    - >
      The npm scope `@musistudio/claude-code-router` was first published in June 2025,
      during the early expansion of Claude Code companion tools. The package's own
      description framed the project around using Claude Code with alternate LLM
      providers, and the README later broadened the project into a local gateway and
      desktop dashboard for Claude Code, Codex, ZCode, and compatible clients.
    - >
      The project follows a familiar proxy pattern from developer tooling: keep the
      user's editor or agent workflow stable while swapping model backends behind a
      local endpoint. Its documented routing model includes provider presets, custom
      endpoints, fallback routing, request logs, profiles, plugins, and virtual models.
  related-projects:
    - Claude Code is the primary agent client the router was built around.
    - >
      Codex and ZCode are named by the README as compatible clients for the local
      gateway profiles.
    - >
      OpenRouter, DeepSeek, Gemini, Mistral, Moonshot, Kimi Code, Z.AI, Bailian,
      Anthropic Messages, and OpenAI-compatible APIs are named in the README as
      supported provider or protocol targets.
    - musistudio/codexl is credited in the README for Codex support and bot handoff.
  sources:
    - https://github.com/musistudio/claude-code-router
    - https://registry.npmjs.org/@musistudio%2fclaude-code-router
    - https://formulae.brew.sh/api/formula/claude-code-router.json
  summary:
    - >
      Claude Code Router is a local gateway for routing Claude Code and compatible agent
      traffic to different model providers. Its current official README describes both a
      CLI service and a desktop control panel that expose local gateway services and
      manage provider, route, credential, and profile configuration.
  timeline:
    - '2025-06: npm registry records the first `@musistudio/claude-code-router` publication.'
    - >
      2026: Homebrew formula `claude-code-router` packages version 2.0.0 from the npm
      registry.
    - >
      2026: The official README documents CLI, desktop app, gateway, profile, plugin,
      and provider-deeplink workflows.
  usage:
    - >
      Users start the service with `ccr start`, then point Claude Code or another
      supported agent profile at the local gateway. The README documents default local
      services on ports 3456 and 3457, plus a web management UI on port 3458.
    - >
      Its main use case is model-provider routing: default, background, thinking,
      long-context, image, web-search, subagent, conditional, and fallback routes can be
      mapped to different providers or models while credentials remain in the local
      router configuration.
related-packages:
  - id: cask:claude-code
    reason: >
      Use Claude Code as an agent client while Claude Code Router supplies its local
      model endpoint, provider selection, credential pools, and fallback routing.
    rel: adjacent_workflow
    sources:
      - https://github.com/musistudio/claude-code-router#readme
      - https://github.com/anthropics/claude-code#readme
  - id: cask:codex
    reason: >
      Codex is another explicitly supported client whose model traffic and agent profile
      can be managed through the router.
    rel: adjacent_workflow
    sources:
      - https://github.com/musistudio/claude-code-router#readme
      - https://github.com/openai/codex#readme
tags:
  - ai
  - claude-code
  - cli
  - llm-providers
  - model-routing
  - proxy
