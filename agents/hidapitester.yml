history:
  adoption-history:
    - >
      The project supplies prebuilt binaries for macOS, Linux, Windows, and Raspberry
      Pi-class Linux systems. Homebrew also packages it as the `hidapitester` formula.
  package-nerd-significance:
    - >
      hidapitester provides a small, scriptable way to enumerate HID devices and
      exercise input, output, and feature reports without writing a custom HIDAPI
      program. It is useful for firmware development, USB debugging, manufacturing
      tests, and validating unusual HID hardware.
  project-history:
    - >
      Tod E. Kurt developed hidapitester as a simple command-line test program built on
      HIDAPI. Its release series added detailed device listing, report-descriptor
      access, serial-number filtering, continuous input-report monitoring, improved
      diagnostics, and multi-platform builds.
  related-projects:
    - HIDAPI supplies the cross-platform HID access layer used by hidapitester.
    - >
      The repository includes hardware-test material aimed primarily at RP2040/Raspberry
      Pi Pico targets, with support for other microcontroller families.
  sources:
    - https://github.com/todbot/hidapitester
    - https://github.com/todbot/hidapitester/releases
  summary:
    - >
      hidapitester is a cross-platform command-line utility for discovering and directly
      exercising USB and other HIDAPI-supported Human Interface Devices.
  timeline:
    - "0.1: First public release in the repository's release series."
    - '0.2: Added Apple silicon builds and testing against HIDAPI 0.10.1.'
    - '0.5: Added report-descriptor retrieval and explicit version reporting.'
    - >
      0.6: Added richer bus details, continuous input-report reading, improved errors,
      CMake support, and HIDAPI 0.15 builds.
  usage:
    - >
      Users select a device by vendor/product ID, usage page, usage, serial number, or
      HID path, then issue ordered commands to open it and send or read HID reports.
    - >
      It is commonly used interactively during device bring-up or embedded in shell
      scripts and hardware test fixtures.
