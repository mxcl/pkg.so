history:
  adoption-history:
    - >
      Abstract was adopted by design teams that wanted source-control-like collaboration
      without asking designers to operate Git directly. The documented desktop workflow
      is closely associated with Sketch files, team review, and maintaining an auditable
      record of design decisions.
  package-nerd-significance:
    - >
      Abstract is notable for translating package and source-control culture—branches,
      commits, merges, histories, and controlled mainline changes—into a graphical
      design workflow. Its Homebrew cask also placed a proprietary design client
      alongside developer tools in reproducible workstation setups.
  project-history:
    - >
      Abstract built a hosted design-management product around versioning and
      documenting design work. Its desktop workflow applies branches, commits, reviews,
      and merges to Sketch-based projects, with organization and account administration
      supplied by the hosted service.
  related-projects:
    - Sketch
    - Git
    - design systems
  sources:
