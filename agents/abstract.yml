    - https://help.goabstract.com/hc/en-us/articles/360050378391-Merging-to-the-main-branch
    - source_facts.description
  summary:
    - >
      Abstract is a proprietary design collaboration platform for managing, versioning,
      reviewing, and documenting design work.
  timeline:
    - >
      Desktop-product era: Abstract established branch, commit, review, and merge
      workflows for Sketch design files.
    - >
      Later releases: Online organization, account, provisioning, and documentation
      features complemented the desktop workflow.
  usage:
    - >
      A team organizes work into Abstract organizations and projects. Designers create
      branches, open Sketch files through the Abstract desktop application, save and
      commit iterations, request review, and merge approved work into the main branch.
