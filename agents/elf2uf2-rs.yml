history:
  adoption-history:
    - >
      The docs.rs release history shows a 1.0.0 release in 2021, continued 1.x releases
      through 2023, a 2.0.0 release in 2024, and 2.2.0 in 2025. The input metadata shows
      Homebrew, Nix, and pacman packaging.
  package-nerd-significance:
    - >
      elf2uf2-rs is a package-manager-friendly bridge between embedded Rust builds and
      board flashing: a single CLI turns Cargo output into a deployable UF2 workflow
      without requiring users to build Raspberry Pi SDK tools separately.
  project-history:
    - >
      The official README describes elf2uf2-rs as a tool for converting ELF binaries
      into UF2 format and flashing them to microcontrollers including RP2040 and RP2350
      boards. It credits Raspberry Pi's elf2uf2 as the basis.
    - >
      docs.rs describes the crate as a Rust port of elf2uf2 and shows that it is
      published as a command-line package rather than a library.
  related-projects:
    - Raspberry Pi's elf2uf2 is credited by the official README as the basis for elf2uf2-rs.
    - Cargo is part of the documented install and project-runner workflow.
  sources:
    - https://docs.rs/crate/elf2uf2-rs/latest
    - https://github.com/JoNil/elf2uf2-rs
    - source_facts.package-manager
  summary:
    - >
      elf2uf2-rs is a Rust CLI for converting ELF firmware binaries to UF2 and deploying
      them to supported microcontroller boards.
  timeline:
    - '2021-01-29: docs.rs lists 1.0.0 and 1.1.0 releases.'
    - '2024-01-07: docs.rs lists 2.0.0.'
    - '2025-10-06: docs.rs lists 2.2.0.'
    - '2026 batch: Input metadata shows Homebrew, Nix, and pacman packages.'
  usage:
    - >
      Users run elf2uf2-rs to convert firmware to UF2 files or deploy ELF output
      directly to a connected board. The README also documents adding a runner command
      to .cargo/config.toml so cargo run can flash a microcontroller.
related-packages:
  - id: brew:picotool
    reason: >
      Choose Raspberry Pi's picotool for first-party RP2040/RP2350 ELF and UF2 handling
      plus richer device inspection, verification, reboot, partition, and security
      operations.
    rel: alternative
    sources:
      - https://github.com/JoNil/elf2uf2-rs#readme
      - https://github.com/raspberrypi/picotool#readme
  - id: brew:probe-rs-tools
    reason: >
      Choose probe-rs Tools when firmware should be flashed and debugged through a
      hardware debug probe with RTT or defmt logging rather than through a UF2 USB
      bootloader.
    rel: alternative
    sources:
      - https://github.com/JoNil/elf2uf2-rs#readme
      - https://probe.rs/docs/tools/probe-rs/
