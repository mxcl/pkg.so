id: cask:mailmate
display-name: MailMate
repo: null
docs:
  - https://manual.mailmate-app.com/
config-file-location:
  macos:
    - ~/Library/Application Support/MailMate/*.plist
    - ~/Library/Application Support/MailMate/Resources/
    - ~/Library/Application Support/MailMate/Bundles/
    - ~/Library/Preferences/com.freron.MailMate.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      MailMate 1.4 entered Apple's Mac App Store in December 2011. Its continuing appeal
      has centered on keyboard-driven workflows, advanced searching and smart mailboxes,
      Markdown composition, and extensibility for users who want more control than
      mainstream mail clients typically expose.
  package-nerd-significance:
    - >
      MailMate is notable among macOS packages for combining a native graphical email
      client with unusually transparent, file-based customization. Property-list
      resources, custom key bindings, bundles, URL schemes, and the `emate` command make
      it especially interesting to automation-oriented and configuration-conscious
      users.
  project-history:
    - >
      Freron Software, founded in Copenhagen in 2010, developed MailMate as a Mac email
      client focused exclusively on IMAP. Version 1.0 was released in February 2011
      after a series of public beta releases.
    - >
      The early releases established MailMate's characteristic power-user model:
      universal mailboxes, advanced smart mailboxes, extensive keyboard control,
      alternative message layouts, offline operation, and dynamic signatures. Version
      1.4 added Markdown composition and reached the Mac App Store.
  related-projects:
    - >
      MailMate integrates with tools such as SpamSieve, task managers, calendar
      applications, text editors, and macOS automation facilities. It competes with
      general-purpose clients such as Apple Mail while deliberately retaining an
      IMAP-centered, plain-text-first design.
  sources:
    - https://blog.freron.com/2011/mailmate-1-0-released/
    - https://blog.freron.com/2011/mailmate-1-4-released/
    - https://manual.mailmate-app.com/
    - https://manual.mailmate-app.com/customization
  summary:
    - >
      MailMate is a proprietary macOS IMAP email client created by Freron Software for
      users who manage substantial volumes of mail and value searching, smart mailboxes,
      keyboard control, and customizable workflows.
  timeline:
    - '2010: Freron Software was founded and public MailMate beta releases appeared.'
    - '2011-02: MailMate 1.0 was released.'
    - >
      2011-12: MailMate 1.4 added Markdown support and became available through the Mac
      App Store.
  usage:
    - >
      MailMate is used to read and compose mail across IMAP accounts, search message
      metadata and bodies, build smart mailboxes, and process inboxes through
      keyboard-oriented archive and delete workflows. Messages are composed as plain
      text, with optional Markdown conversion to HTML.
    - >
      Advanced users customize property-list resources, key bindings, bundles, layouts,
      and integrations under MailMate's Application Support directory. The official
      manual warns that low-level customization interfaces may change.
