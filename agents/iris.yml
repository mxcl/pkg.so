history:
  adoption-history:
    - >
      Iris has been offered across Windows, macOS, Linux, and mobile platforms in
      several forms, including Iris, Iris Pro, Iris mini, and Iris micro. The official
      model history says the main product moved from free software to a freemium model
      and then to a paid product with a free trial.
  package-nerd-significance:
    - >
      Iris belongs to the desktop color-temperature and eye-comfort tool tradition
      alongside f.lux, Redshift, and operating-system features such as Night Shift.
      Package users may value it for its unusually broad controls, including software
      brightness reduction without relying solely on monitor backlight PWM,
      multi-monitor handling, timers, and screen effects.
  project-history:
    - >
      Iris was created by Daniel Georgiev as eye-protection and productivity software.
      It began around automatic blue-light and brightness adjustment, then accumulated
      selectable modes, timers, screen effects, application-aware pausing, multi-monitor
      support, settings import/export, and multiple lightweight editions.
    - >
      Official changelog entries document active desktop development by 2017 and later
      macOS work including monitor detection, Apple notarization, entitlements, and
      compatibility updates for macOS Ventura.
  related-projects:
    - >
      The official product page names Iris mini as a smaller alternative and identifies
      f.lux, Twilight, Night Shift, Night Light, and Redshift as related
      blue-light-reduction tools.
  sources:
    - 'Official Iris page: https://iristech.co/iris/'
    - 'Official changelog: https://iristech.co/iris-changelog/'
    - 'Official feature reference: https://iristech.co/features/'
    - 'Official help center: https://iristech.co/help/'
    - 'Official model history: https://iristech.co/models/'
  summary:
    - >
      Iris is cross-platform display-adjustment software focused on blue-light
      reduction, flicker-free brightness control, eye comfort, sleep routines, and
      productivity reminders.
  timeline:
    - >
      2017: Official changelog entries document Iris 0.9 releases and expanded timing,
      location, and rest-screen controls.
    - >
      2018: The official help and feature documentation was consolidated around simple
      and advanced application views.
    - >
      2019: Iris for macOS added improved monitor detection, translations, and separate
      settings for multiple monitors.
    - '2022: Iris 1.2.2 for macOS added notarization and compatibility work for macOS Ventura.'
  usage:
    - >
      Iris normally runs in the background, determines day and night from location or
      the system clock, and gradually changes display color temperature and brightness.
      Users can instead select manual or paused operation and configure presets,
      per-monitor behavior, break reminders, shortcuts, and application-specific pauses.
    - >
      Color-sensitive work may require pausing Iris or using its application triggers
      because blue-light filtering alters displayed colors.
