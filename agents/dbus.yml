  display-name-sources:
    - Official freedesktop page uses D-Bus; source_facts.name is dbus.
  docs-sources:
    - >
      Official freedesktop page links D-Bus documentation; official dbus.freedesktop.org
      hosts the D-Bus specification and API reference.
  history-sources:
    - https://dbus.freedesktop.org/doc/dbus-specification.html
    - https://www.freedesktop.org/wiki/Software/dbus/
    - https://www.freedesktop.org/wiki/Software/DBusBindings/
  repo-sources:
    - >
      source_facts.repo is empty; official freedesktop D-Bus page says the reference
      implementation is in the dbus/dbus project on freedesktop.org GitLab.
  tags-sources:
    - >
      freedesktop D-Bus page describes system and session daemons, message passing, and
      interprocess communication; source_facts.executables lists dbus-daemon and related
      CLI tools.
