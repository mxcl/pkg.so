id: brew:mkdocs
display-name: MkDocs
repo: https://github.com/mkdocs/mkdocs
docs:
  - https://www.mkdocs.org/
  - https://www.mkdocs.org/user-guide/configuration
config-file-location:
  unix:
    - mkdocs.yml
credentials-file-location: null
history:
  project-history:
    - >
      The tool grew around a small core with extension points rather than a large
      documentation platform. Its own README and site emphasize themes, plugins, and
      Python Markdown extensions; built-in and third-party themes handle presentation,
      plugins add indexing or generated content, and the output can be hosted anywhere
      static files are served. Release notes show the 1.0 release in 2018 and continued
      1.x maintenance through 1.6.1 in 2024, including changes around local preview,
      drafts, translations, and strict-mode behavior.
  sources:
    - https://api.github.com/repos/mkdocs/mkdocs
    - https://formulae.brew.sh/api/formula/mkdocs.json
    - https://github.com/mkdocs/mkdocs
    - https://raw.githubusercontent.com/mkdocs/mkdocs/master/README.md
    - https://www.mkdocs.org/
    - https://www.mkdocs.org/about/release-notes/
    - https://www.mkdocs.org/getting-started/
  summary:
    - >
      MkDocs is a Python static site generator for project documentation. Its
      documentation credits Tom Christie in the 2014 copyright line and the MkDocs team
      as maintainers, while the public GitHub repository was created in January 2014.
      The project established a simple convention that became its niche: documentation
      lives as Markdown files, site settings live in a single mkdocs.yml file, and the
      mkdocs command builds a static HTML site or runs a local auto-reloading preview
      server.
  usage:
    - >
      MkDocs sits in package managers as the base documentation generator. It is
      packaged widely across Linux distributions, Homebrew, Chocolatey, and Nix, and
      Homebrew records a conflict with mkdocs-material because both packages install a
      mkdocs binary. GitHub metadata shows broad adoption for the repository, with tens
      of thousands of stars and many dependent projects, which fits its role as the
      common base beneath themes such as Material for MkDocs.
related-packages:
  - id: brew:mkdocs-material
    reason: >
      Add Material for MkDocs when a MkDocs site needs a feature-rich responsive theme,
      integrated search, navigation options, and additional documentation plugins.
    rel: adjacent_workflow
    sources:
      - https://squidfunk.github.io/mkdocs-material/getting-started/
      - https://squidfunk.github.io/mkdocs-material/creating-your-site/
      - https://www.mkdocs.org/user-guide/choosing-your-theme/
tags:
  - cli
  - documentation
  - markdown
  - python
  - static-site-generator
provenance:
  category-sources:
    - source_facts.description identifies project documentation with Markdown.
  display-name-sources:
    - Official documentation title is MkDocs.
  docs-sources:
    - Official MkDocs homepage and configuration guide.
  history-sources:
    - https://api.github.com/repos/mkdocs/mkdocs
    - https://formulae.brew.sh/api/formula/mkdocs.json
    - https://github.com/mkdocs/mkdocs
    - https://raw.githubusercontent.com/mkdocs/mkdocs/master/README.md
    - https://www.mkdocs.org/
    - https://www.mkdocs.org/about/release-notes/
    - https://www.mkdocs.org/getting-started/
  repo-sources:
