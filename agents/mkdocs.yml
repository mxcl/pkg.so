      Official MkDocs documentation has an Edit on GitHub link to the mkdocs/mkdocs
      repository.
  tags-sources:
    - >
      Official configuration docs identify MkDocs as a YAML-configured Markdown
      documentation site generator.
category-confidence: high
category-path:
