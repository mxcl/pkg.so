history:
  adoption-history:
    - >
      PAIR's initial public releases supplied signed desktop installers for Windows and
      macOS, Debian packages for Linux, and a terminal interface for headless systems.
      Its early audience is users with multiple local computers running Ollama or LM
      Studio rather than operators of a centralized cloud cluster.
  package-nerd-significance:
    - >
      PAIR packages discovery, trust bootstrapping, engine lifecycle management,
      workload-aware routing, and compatible proxy endpoints into one cross-platform
      local tool. It interests self-hosting and local-AI users because existing OpenAI-
      or Ollama-compatible clients can use several machines without treating their
      combined GPUs as one device.
  project-history:
    - >
      NVIDIA released Personal AI Router as an Apache-2.0 project for routing
      independent local inference requests among paired computers. The project
      deliberately routes each request to one eligible node; it does not pool GPU
      memory, shard models, or split an in-flight request across machines.
  related-projects:
    - Ollama and LM Studio are the inference engines supported by the initial PAIR releases.
    - >
      Applications can connect through PAIR's Ollama-compatible and OpenAI-compatible
      local endpoints.
  sources:
    - https://github.com/NVIDIA/Personal-AI-Router
    - https://github.com/NVIDIA/Personal-AI-Router/blob/main/docs/getting-started.mdx
    - https://github.com/NVIDIA/Personal-AI-Router/blob/main/docs/overview.mdx
    - https://github.com/NVIDIA/Personal-AI-Router/releases
  summary:
    - >
      NVIDIA Personal AI Router, abbreviated PAIR, routes local inference requests
      across paired computers on the same network.
  timeline:
    - '2026-08-26: NVIDIA published Personal AI Router 0.1.0.'
    - >
      2026-08-28: Version 0.1.1 corrected cross-platform build tooling while remaining
      functionally equivalent to 0.1.0.
  usage:
    - >
      Users install PAIR on each participating machine, pair trusted nodes with a
      six-digit PIN, start or adopt an Ollama or LM Studio engine, add models, and point
      compatible applications at PAIR's local proxy endpoint. PAIR selects an eligible
      node according to engine availability, model availability, and workload.
