id: brew:hex
display-name: hx
repo: null
docs:
  - https://github.com/sitkevij/hex#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README advertises packaging availability through a package-status badge and
      documents installation through Cargo, source builds, Arch Linux, Debian package
      downloads, Guix, and Docker. The Homebrew formula packages the GitHub release
      archive, while the input package metadata records packages for apk, Debian,
      MacPorts, Nix, pacman, winget, and zypper.
  package-nerd-significance:
    - >
      Package maintainers care about hx because it is a modern Rust reworking of the
      classic hexdump/xxd niche with predictable CLI behavior, color controls, and
      cross-platform packaging. The name mismatch between the package hex and executable
      hx is also the kind of detail package indexes must preserve accurately.
  project-history:
    - >
      The GitHub repository was created in March 2018 and describes the project as a
      futuristic take on hexdump. Its README documents file and stdin input, multiple
      numeric output formats, byte-array emitters for several programming languages,
      NO_COLOR support, and package-manager installation paths.
    - >
      The release history shows the tool maturing through 0.4.x releases in 2020-2021,
      0.5.0 and 0.6.0 releases in 2023-2024, and a 0.7.0 release in 2025. The project
      keeps the executable name hx even though the repository and several packages use
      the name hex.
  related-projects:
    - >
      The README positions hx as a hexdump alternative and documents NO_COLOR behavior
      through the author's no_color Rust crate. Its source-array output overlaps with
      workflows usually handled by xxd -i or small language-specific binary embedding
      tools.
  sources:
    - https://api.github.com/repos/sitkevij/hex/releases
    - https://formulae.brew.sh/formula/hex
    - https://github.com/sitkevij/hex
  summary:
    - >
      Hex, installed as hx, is a Rust command-line hexdump-style viewer focused on
      colorized, source-code-friendly output.
  timeline:
    - '2018: GitHub repository created.'
    - '2020: v0.4.0 release published.'
    - '2021: v0.4.1 and v0.4.2 releases published.'
    - '2023: v0.5.0 release published.'
    - '2024: v0.6.0 release published.'
    - '2025: v0.7.0 release published and packaged by Homebrew.'
  usage:
    - >
      hx accepts a file path or stdin and writes a formatted hexadecimal view to stdout.
      Besides the normal hex-plus-ASCII display, it can emit byte arrays for Rust, C,
      Go, Python, F#, Kotlin, Java, and Swift, making it useful when turning binary
      fixtures into source snippets.
related-packages:
  - id: brew:hevi
    reason: >
      Choose hevi when parser-aware highlighting, configurable palettes, or persistent
      XDG/AppData settings matter more than hx's source-array emitters.
    rel: alternative
    sources:
      - https://github.com/sitkevij/hex#readme
      - https://codeberg.org/arnauc/hevi
