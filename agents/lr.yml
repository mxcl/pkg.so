config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager facts list Homebrew, Debian, Ubuntu, and Nix
      packaging. That spread fits lr's niche: it is not a coreutils replacement, but it
      appeals to users who want recursive listings and filter expressions without
      assembling long `find` pipelines.
    - >
      GitHub metadata shows a modest but real audience, with 165 stars and ongoing
      repository activity through 2025.
  package-nerd-significance:
    - >
      lr is interesting to package nerds because it sits between canonical Unix tools
      rather than replacing only one of them. It packages a personal Unix workflow into
      a small C utility with manpage-style semantics, making it attractive to people who
      care about composable file enumeration.
  project-history:
    - >
      Leah Neukirchen's GitHub repository describes lr as a tool for generating file
      listings with selected features from `ls(1)`, `find(1)`, `stat(1)`, and `du(1)`.
      The repository was created in October 2015 and the first tagged release, v0.1,
      followed in November 2015.
    - >
      The NEWS file shows the tool maturing through Unix-flavored features: chmod-style
      mode checks, timestamp selection, colorized symlink targets, broken-link display,
      Linux ACL/capability/xattr display, breadth-first traversal, shell quoting, OSC 8
      hyperlinks, and permission-error behavior.
  related-projects:
    - >
      lr overlaps with `ls`, `find`, `stat`, `du`, `xargs`, and the author's `xe`
      utility, which the README recommends for command execution workflows.
  sources:
    - https://api.github.com/repos/leahneukirchen/lr
    - https://api.github.com/repos/leahneukirchen/lr/git/ref/tags/v0.1
    - https://github.com/leahneukirchen/lr
    - https://raw.githubusercontent.com/leahneukirchen/lr/master/NEWS.md
    - source_facts.package-manager
  summary:
    - >
      lr is a recursive file-listing command that combines parts of `ls`, `find`,
      `stat`, and `du` into one Unix-style CLI.
  timeline:
    - '2015: GitHub repository created and v0.1 tagged.'
    - >
      2017: v1.0 changed quoting behavior and added locale, color, @file input, and
      better error reporting.
    - '2023: v1.6 added basename sorting and large-file defaults.'
    - '2025: v2.0 changed permission-denied behavior and added quiet mode.'
  usage:
    - >
      lr is run directly as `lr` over one or more paths. The README includes a 'Rosetta
      stone' mapping common `ls` and `find` invocations to lr commands, and documents
      filters, sort keys, custom formats, depth control, symlink handling, NUL-delimited
      input/output, and long-output formats.
    - >
      The tool has no documented config file or credentials; behavior is controlled
      through command-line flags and filter expressions.
related-packages:
  - id: brew:fd
    reason: >
      Choose fd for a fast, opinionated filename and path search with convenient
      defaults; choose lr when recursive results also need ls/stat/du-style metadata,
      sorting, or expression-based formatting.
    rel: alternative
    sources:
      - https://github.com/sharkdp/fd#readme
      - https://github.com/leahneukirchen/lr#readme
  - id: brew:eza
    reason: >
      Choose eza for a polished modern ls-style presentation of directory contents;
      choose lr for recursive traversal and find-like filtering across an entire result
      set.
    rel: alternative
    sources:
      - https://github.com/eza-community/eza#readme
      - https://github.com/leahneukirchen/lr#readme
