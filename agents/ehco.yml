history:
  adoption-history:
    - >
      ehco appears to have niche adoption compared with larger proxy stacks. The input
      package metadata lists Homebrew as the only package manager, while the upstream
      releases provide ready-made binaries for major platforms.
  package-nerd-significance:
    - >
      For package maintainers, ehco is a small Go networking binary with straightforward
      release assets. It is interesting mostly as an example of the long tail of useful
      relay tools that are too small for broad distro fame but useful enough to package.
  project-history:
    - >
      The first public GitHub release was v0.0.1 in June 2019. The project reached
      v1.0.0 in February 2021, and release notes around v1.0 and v1.1 show it adding
      monitoring, metrics, hot reload, load-balancing improvements, and prebuilt
      binaries.
    - >
      Later releases continued the same practical operations focus, including VLESS and
      Shadowsocks-related work in 2026 and an updater tied to GitHub releases.
  related-projects:
    - >
      The release history references xray, VLESS, and Shadowsocks as related proxy and
      tunneling ecosystems.
    - >
      Comparable usage overlaps with simple TCP/UDP forwarding tools, tunnels, and
      lightweight proxy stacks.
  sources:
    - https://github.com/Ehco1996/ehco#readme
    - https://github.com/Ehco1996/ehco/releases
  summary:
    - >
      ehco is a lightweight Go TCP/UDP relay and tunneling tool. Its public history is
      thin but clear: a small networking CLI for forwarding traffic, debugging
      connectivity, and deploying simple relay paths.
  timeline:
    - '2019-06-15: v0.0.1 is published.'
    - '2020-06-23: v0.1.0 is published.'
    - '2021-02-15: v1.0.0 is published.'
    - '2021-09-05: v1.1.0 adds a new batch of relay, monitoring, and hot-reload changes.'
    - '2026-03-13: v1.1.6 includes VLESS user sync and Shadowsocks 2022 support.'
  usage:
    - >
      The README positions ehco for relaying TCP or UDP traffic between hosts, simple
      network tunneling, debugging connectivity, lightweight proxy alternatives, and
      internal infrastructure tooling.
related-packages:
  - id: brew:socat
    reason: >
      socat is an alternative for ad hoc bidirectional data transfer across a much
      broader set of address types, while ehco concentrates on lightweight TCP/UDP
      relaying and tunneling.
    rel: alternative
    sources:
      - https://github.com/Ehco1996/ehco#readme
      - http://www.dest-unreach.org/socat/
