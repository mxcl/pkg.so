history:
  adoption-history:
    - >
      Frigade states that its own team uses Yap for prompting coding agents, writing
      email, and sending Slack messages. The project is distributed as a signed and
      notarized macOS application, through GitHub releases, and through Homebrew.
  package-nerd-significance:
    - >
      Yap is a compact, native, open-source alternative to cloud-connected or
      Electron-based dictation utilities. Package enthusiasts may value its MIT license,
      Homebrew distribution, absence of bundled model weights, and reliance on
      operating-system speech facilities rather than a separate runtime or hosted API.
  project-history:
    - >
      Frigade built Yap after macOS 26 introduced SpeechAnalyzer and SpeechTranscriber
      APIs capable of on-device streaming transcription. The project was designed as a
      small native Swift application without an embedded browser engine or bundled
      speech model.
    - >
      The developers open-sourced the application and made local processing its central
      constraint: Yap requires no account or API key, makes no network calls, and keeps
      audio and transcript history on the Mac.
  related-projects:
    - >
      Apple SpeechAnalyzer and SpeechTranscriber provide the on-device transcription
      foundation.
    - Frigade is the organization that created and maintains Yap.
  sources:
    - 'Official product page: https://frigade.com/yap'
    - 'Official repository README: https://github.com/FrigadeHQ/yap/blob/main/README.md'
  summary:
    - >
      Yap is an open-source, on-device voice-dictation application for Apple-silicon
      Macs running macOS 26 or later. A global shortcut starts and stops recording,
      after which Yap pastes the transcription into the focused application.
  timeline:
    - >
      macOS 26 era: Frigade built Yap around Apple's new on-device SpeechAnalyzer and
      SpeechTranscriber APIs.
    - The reviewed official sources do not publish a more precise first-release date.
  usage:
    - >
      Users invoke Yap with a configurable global shortcut, speak, and invoke the
      shortcut again to paste the resulting text into the active field. It is intended
      for tasks such as agent prompting, email, chat, browser forms, and terminal input.
      Searchable transcript history remains local.
