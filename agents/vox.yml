history:
  adoption-history:
    - >
      By the end of 2014, Coppertino described VOX as a popular Mac App Store
      alternative to iTunes. The product later expanded from local high-resolution
      playback into an ecosystem spanning iOS, cloud music storage, internet radio,
      Sonos, and a cross-platform VOX Universal beta.
  package-nerd-significance:
    - >
      VOX appeals to Mac audio enthusiasts because it handles formats such as FLAC,
      ALAC, DSD, APE, CUE, and high-resolution PCM while exposing audiophile-oriented
      controls including sample-rate synchronization, Hog Mode, Audio Units, gapless
      playback, and a multiband equalizer.
  project-history:
    - >
      VOX was developed by Coppertino as a Mac-focused music player emphasizing
      high-resolution and lossless playback. Coppertino's official 2014 retrospective
      describes a year of development and plans to extend the product to iOS and a new
      music service, which became part of the broader VOX ecosystem.
  related-projects:
    - VOX Music Cloud provides synchronized, uncompressed music storage for VOX clients.
    - VOX Radio supplies an internet-radio catalog.
    - VOX Universal extends the player concept to macOS and Windows.
  sources:
    - >
      Official 2014 retrospective:
      https://vox.rocks/blog/2014-made-vox-the-best-itunes-alternative-for-mac/
    - 'Official Mac player page: https://vox.rocks/mac-music-player'
    - 'Official VOX Music Cloud guide: https://vox.rocks/loop-music-cloud-storage/how-to-use'
    - 'Official VOX Premium overview: https://vox.rocks/vox-player-premium'
  summary:
    - >
      VOX is Coppertino's high-resolution music player for macOS, designed for local
      libraries and external music sources and supplemented by optional cloud, radio,
      and premium audio features.
  timeline:
    - >
      2014: Coppertino published its year-end account of VOX's Mac adoption and
      announced forthcoming iOS and music-service expansion.
    - >
      Later: VOX expanded into Music Cloud, internet radio, iOS, and a cross-platform
      Universal client.
  usage:
    - >
      Users play local lossless and high-resolution libraries, connect supported
      external sources, tune advanced output settings, listen to internet radio, and
      optionally upload original-quality audio to VOX Music Cloud for synchronized
      playback.
