history:
  adoption-history:
    - >
      Roku distributes Remote Tool as part of its official suite of channel-development
      utilities, alongside layout, profiling, resource-monitoring, deep-linking,
      streaming, and static-analysis tools.
  package-nerd-significance:
    - >
      Remote Tool turns a physical-device interaction loop into a desktop developer
      workflow. Its script import, export, and replay facilities make remote-control
      sequences repeatable for development and lightweight test automation.
  project-history:
    - >
      Roku created Remote Tool as an extended standalone developer utility for
      controlling Roku devices and channels without repeatedly using a physical remote.
  related-projects:
    - >
      Roku's Advanced Layout Editor, Resource Monitor, BrightScript Profiler, Deep
      Linking Tester, Stream Tester, and Static Channel Analysis tools cover adjacent
      stages of Roku channel development and testing.
  sources:
    - https://devtools.web.roku.com/
    - https://devtools.web.roku.com/RokuRemote/
  summary:
    - >
      Roku Remote Tool is an official Roku development utility providing a virtual
      remote, keyboard text entry, and reusable scripted device interactions.
  timeline:
    - >
      Remote Tool became part of Roku's consolidated developer-tools collection as an
      extended standalone application.
  usage:
    - >
      Developers use the virtual remote to navigate a Roku device or channel, enter text
      into keyboard screens, record or author command scripts, run those scripts against
      a device, and import or export them for repeated automation.
