  - https://docs.projectdiscovery.io/opensource/cloudlist/usage
  - https://github.com/projectdiscovery/cloudlist#readme
config-file-location:
  unix:
    - ~/.config/cloudlist/config.yaml
    - ~/.config/cloudlist/provider-config.yaml
credentials-file-location:
  unix:
    - ~/.config/cloudlist/provider-config.yaml
history:
  adoption-history:
    - >
      The input record lists Homebrew and Nix package availability, while the official
      repository publishes Go release assets and documents command flags for common Unix
      security-tool workflows.
  package-nerd-significance:
    - >
      Cloudlist fits the ProjectDiscovery ecosystem of pipeline-friendly security tools:
      it emits to stdout, supports JSON, and is designed to feed broader
      attack-surface-management workflows.
  project-history:
    - >
      The official ProjectDiscovery repository describes Cloudlist as a tool for listing
      assets from multiple cloud providers, with features for multiple provider
      configurations, keyless authentication, filters, output formats, stdout pipelines,
      and provider extensibility.
  related-projects:
    - >
      The official README acknowledges inspiration from Smogcloud and Cloudmapper and
      links ProjectDiscovery documentation.
  sources:
    - >
      https://docs.projectdiscovery.io/opensource/cloudlist/running documents
      provider-config.yaml and provider API keys.
    - >
      https://github.com/projectdiscovery/cloudlist#readme describes Cloudlist,
      features, flags, and default config paths.
    - source_facts.package-manager lists Homebrew and Nix package names.
  summary:
    - >
      Cloudlist is ProjectDiscovery's multi-cloud asset listing CLI, intended to help
      blue teams centralize asset discovery across cloud providers.
  timeline:
    - '2026: GitHub releases list v1.4.0 as the latest visible release.'
    - '2026: The v1.4.0 release notes add DNS metadata and parsing fixes.'
  usage:
    - >
      Users run cloudlist with provider filters, service filters, JSON output, and
      optional output files; the default config paths are
      ~/.config/cloudlist/config.yaml and ~/.config/cloudlist/provider-config.yaml.
related-packages:
  - id: brew:httpx
    reason: >
      Pipe Cloudlist's discovered hosts into httpx to identify live HTTP services before
      deeper assessment, following ProjectDiscovery's documented workflow.
    rel: adjacent_workflow
    sources:
      - https://docs.projectdiscovery.io/opensource/cloudlist/running
      - https://docs.projectdiscovery.io/tools/httpx/overview
  - id: brew:nuclei
    reason: >
      Use Nuclei after Cloudlist and httpx to scan discovered cloud-hosted services with
      security templates, exactly as shown in the official Cloudlist guide.
    rel: adjacent_workflow
    sources:
      - https://docs.projectdiscovery.io/opensource/cloudlist/running
      - https://docs.projectdiscovery.io/opensource/nuclei
