history:
  adoption-history:
    - >
      dosfstools became infrastructure because FAT filesystems remained common on USB
      drives, SD cards, firmware update media, cameras, and Windows-compatible exchange
      volumes. Source facts list packaging across apk, Homebrew, Debian, Fedora,
      MacPorts, Nix, pacman, Ubuntu, and zypper.
    - >
      Compatibility symlinks keep older command names such as dosfsck, fsck.msdos,
      fsck.vfat, mkdosfs, mkfs.msdos, mkfs.vfat, and dosfslabel available for
      distributions and scripts that predate the current mkfs.fat/fsck.fat/fatlabel
      naming.
  package-nerd-significance:
    - >
      dosfstools is package-nerd significant because it is boring in exactly the
      valuable way: a tiny suite of root-adjacent utilities that must encode filesystem
      folklore from DOS, Windows, Linux, SD cards, Atari variants, and old command
      names.
    - >
      The 2016 portability work is especially relevant for Homebrew and MacPorts: it
      turned a historically Linux-centered tool into something more natural to ship on
      other Unix-like systems.
  project-history:
    - >
      The official source tree records mkfs.fat lineage beginning with Linus Torvalds in
      1991 and fsck.fat lineage beginning with Werner Almesberger in 1993. Later
      copyright history in the source credits work by Remy Card, David Hudson, H. Peter
      Anvin, Roman Hodek, Daniel Baumann, Andreas Bombe, and Pali Rohár.
    - >
      Roman Hodek's 1998 work added or fixed major FAT features such as Atari format
      support, larger filesystems, and FAT32 support. The modern project now presents
      itself as a GPLv3-or-later suite consisting of mkfs.fat, fsck.fat, and fatlabel.
    - >
      The NEWS file shows a portability turn in version 4.0 in 2016: Linux-specific
      assumptions were reduced, the build moved to autotools, and the tools were tested
      on FreeBSD and OS X. Version 4.1 added a test suite in 2017, and version 4.2 in
      2021 expanded fatlabel behavior, FAT label compatibility, repair prompts, Year
      2038 fixes, and many fsck/mkfs correctness details.
  related-projects:
    - >
      dosfstools is related to the Linux FAT/vfat/msdos filesystem stack, mtools,
      historical DOS/Windows FAT implementations, SD-card formatting expectations, and
      the older compatibility command names dosfsck, mkdosfs, and dosfslabel.
  sources:
    - https://github.com/dosfstools/dosfstools
    - https://raw.githubusercontent.com/dosfstools/dosfstools/master/NEWS
    - https://raw.githubusercontent.com/dosfstools/dosfstools/master/src/mkfs.fat.c
    - https://raw.githubusercontent.com/dosfstools/dosfstools/master/src/fsck.fat.c
    - https://formulae.brew.sh/formula/dosfstools
  summary:
    - >
      dosfstools is the small system-tool collection behind mkfs.fat, fsck.fat, and
      fatlabel, used to create, check, and label FAT-family filesystems. It sits at the
      practical boundary between Unix-like systems and decades of DOS/Windows-compatible
      removable media.
  timeline:
    - >
      1991: mkfs.fat lineage begins with Linus Torvalds' FAT/MS-DOS filesystem creation
      utility.
    - "1993: fsck.fat lineage begins with Werner Almesberger's FAT checker."
    - '1998: Roman Hodek adds Atari format support, FAT32 support, and large-filesystem work.'
    - '2015: Version 3.0.28 makes fsck.fat default to interactive repair mode.'
    - >
      2016: Version 4.0 makes the tools portable beyond Linux and converts the build to
      autotools.
    - '2017: Version 4.1 adds a test suite.'
    - '2021: Version 4.2 expands fatlabel, fsck, mkfs, compatibility, and Year 2038 handling.'
  usage:
    - >
      The commands create FAT filesystems, check and repair FAT filesystems, and read or
      write labels and volume IDs. They are normally used by administrators, installers,
      image-building scripts, and packaging workflows that need FAT-formatted media or
      disk images.
    - >
      Release notes emphasize edge-case correctness: volume label compatibility with
      MS-DOS and Windows variants, FAT12/FAT16/FAT32 cluster handling, sparse-file test
      images, CHS geometry for SD cards, MBR helper behavior, and repair behavior for
      corrupt FAT tables.
related-packages:
  - id: brew:mtools
    reason: >
      Use mtools alongside dosfstools to copy, inspect, rename, and otherwise manipulate
      files on FAT media or images without mounting them.
    rel: adjacent_workflow
    sources:
      - https://github.com/dosfstools/dosfstools
      - https://www.gnu.org/software/mtools/
  - id: brew:fatsort
    reason: >
      Use FATSort after creating or populating FAT media when hardware displays files in
      raw directory-entry order and that ordering needs to be changed.
    rel: adjacent_workflow
    sources:
      - https://github.com/dosfstools/dosfstools
      - https://fatsort.sourceforge.io/
