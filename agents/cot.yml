id: brew:cot
display-name: Cot
repo: null
docs:
  - https://docs.rs/cot/latest/cot
  - https://cot.rs/guide/latest
config-file-location:
  unix:
    - config/dev.toml
    - config/prod.toml.example
credentials-file-location:
  unix:
    - config/dev.toml
    - config/prod.toml.example
history:
  adoption-history:
    - >
      Cot is newer and smaller than established Rust web frameworks, but its crates.io
      badge, GitHub releases, Homebrew formula, and Nix package entry show early
      packaging beyond direct `cargo install`. Its adoption story is therefore
      early-stage package availability rather than broad ecosystem standardization.
  package-nerd-significance:
    - >
      For package maintainers, Cot is a Rust CLI plus framework stack with code
      generation and config-file conventions. It is the kind of package where keeping
      the CLI version aligned with the framework crates matters more than merely
      installing a standalone binary.
  project-history:
    - >
      The cot-rs/cot repository was created in June 2024. The README describes Cot as a
      modern, fast Rust web framework built on axum and familiar to Django users, with
      integrated ORM, admin panel, templates, security defaults, and documentation.
  related-projects:
    - Rust, axum, Django, crates.io, cot-cli.
  sources:
    - https://github.com/cot-rs/cot
    - https://cot.rs/guide/latest/
    - https://api.github.com/repos/cot-rs/cot
    - https://api.github.com/repos/cot-rs/cot/releases?per_page=100
  summary:
    - >
      Cot is a Rust web framework and CLI that explicitly aims for a Django-like,
      batteries-included developer experience. Its package-manager relevance is that it
      ships not just a library but a project generator and service-running workflow
      through `cot`/cot-cli.
  timeline:
    - '2024: cot-rs/cot repository created.'
    - '2025: First GitHub releases published.'
    - '2026: Project continued publishing releases and package-manager entries.'
  usage:
    - >
      The guide shows the CLI creating projects and running services, with `-c` or
      `--config` selecting configuration and `config/dev.toml` as the default
      development config. That makes the Homebrew package useful for developers who want
      the generator and runtime command available outside a single Cargo workspace.
related-packages:
  - id: brew:bacon
    reason: >
      Cot's guide recommends bacon for live reloading, while bacon continuously runs
      Cargo checks or tests beside an editor during Cot development.
    rel: adjacent_workflow
    sources:
      - https://cot.rs/guide/latest/
      - https://dystroy.org/bacon/
tags:
  - cli
