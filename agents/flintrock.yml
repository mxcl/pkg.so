id: brew:flintrock
display-name: Flintrock
repo: https://github.com/nchammas/flintrock
docs:
  - https://github.com/nchammas/flintrock#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/Flintrock/config.yaml
    - ~/.config/Flintrock/config.yaml
  macos:
    - ~/Library/Application Support/Flintrock/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project README lists external talks, guides, and papers that used or discussed
      Flintrock, including a Spark Summit talk titled 'Flintrock: A faster, better
      spark-ec2'.
    - >
      Official install guidance centers on pipx/PyPI and GitHub releases, while the
      README notes Homebrew as a community-supported distribution that may be out of
      date.
  package-nerd-significance:
    - >
      Flintrock is notable in package history as a CLI that wrapped a complicated cloud
      data workflow into a user-level package instead of a long-lived infrastructure
      framework.
    - >
      Its packaging story also shows the boundary between official Python application
      distribution and community package-manager formulas: the project points users to
      pipx for current releases and marks Homebrew as community supported.
  project-history:
    - >
      The README explicitly positions Flintrock as a faster, better alternative to
      spark-ec2. Its motivation section says spark-ec2 made Spark accessible but had
      pain points around launch speed, missing config files, non-resizable clusters, and
      custom machine images.
    - >
      Flintrock developed into a Python CLI with YAML configuration, subcommands for
      launch, destroy, login, describe, add-slaves, remove-slaves, run-command, and
      copy-file, and support for current Spark and Hadoop/HDFS defaults.
  related-projects:
    - >
      Flintrock is directly related to Apache Spark, Hadoop/HDFS, Amazon EC2, spark-ec2,
      and S3A access through Hadoop.
    - >
      The README contrasts Flintrock with permanent-infrastructure tools such as
      Terraform, Ansible, Ubuntu Juju, Databricks, Amazon EMR, and Apache Bigtop.
  sources:
    - https://api.github.com/repos/nchammas/flintrock/releases
    - https://github.com/nchammas/flintrock
  summary:
    - >
      Flintrock is a command-line tool for launching Apache Spark clusters, especially
      short-lived EC2 clusters for experimentation, performance testing, and automated
      pipelines.
  timeline:
    - '2016: Release v0.7.0 was published.'
    - '2017: Release v0.9.0 was published.'
    - '2020: Release v1.0.0 was published.'
    - '2021: Release v2.0.0 was published.'
    - >
      2023: Release v2.1.0 was published and standalone builds stopped after this line
      according to the README.
  usage:
    - >
      A typical workflow is to run flintrock configure, save EC2 and Spark defaults into
      config.yaml, launch a cluster, work on Spark, and destroy the cluster afterward.
    - >
      The README recommends IAM roles for S3 access rather than copying AWS credentials
      to clusters, and describes Flintrock as unsuitable for permanent infrastructure or
      non-Spark Hadoop services.
related-packages:
  - id: brew:apache-spark
    reason: >
      Flintrock provisions and operates clusters running Apache Spark, while the Apache
      Spark package supplies the engine, shells, and submission tools used for Spark
      applications.
    rel: adjacent_workflow
    sources:
      - https://github.com/nchammas/flintrock#readme
      - https://spark.apache.org/docs/latest/
  - id: brew:hadoop
    reason: >
      Flintrock can install HDFS alongside Spark and documents Hadoop version alignment
      for S3A access, making Hadoop a concrete companion when distributed storage is
      required.
    rel: adjacent_workflow
    sources:
      - https://github.com/nchammas/flintrock#accessing-data-on-s3
      - https://hadoop.apache.org/docs/current/
tags:
