history:
  adoption-history:
    - >
      The documented distribution model mirrors Tokyo Cabinet: upstream source packages,
      with binary packages handled by distributors. In Homebrew and similar
      package-manager contexts, that made Tokyo Dystopia a niche but useful package for
      developers who wanted an embeddable full-text search library and CLI tools without
      deploying a larger search server.
  package-nerd-significance:
    - >
      Tokyo Dystopia is significant in the package-nerd niche because it packages a
      late-2000s search engine as a small Unix library/toolkit: it depends on Tokyo
      Cabinet, installs many focused binaries, and exposes enough low-level pieces for
      scripting, experiments, and embedded search features.
  project-history:
    - >
      The official page carries a 2007-2010 FAL Labs copyright notice and was last
      updated on 2010-08-05. It describes Tokyo Dystopia as written and maintained by
      FAL Labs, and the specification says installation requires the latest Tokyo
      Cabinet first, making Dystopia part of the same FAL Labs database-tool family.
  related-projects:
    - >
      Tokyo Dystopia is directly related to Tokyo Cabinet, which the official
      installation instructions require. It belongs to the FAL Labs Tokyo family
      alongside Tokyo Cabinet and Tokyo Tyrant.
  sources:
    - https://dbmx.net/tokyodystopia
    - https://dbmx.net/tokyodystopia/spex.html
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Tokyo Dystopia is FAL Labs' lightweight full-text search system, documented as a
      C99/POSIX, LGPL-licensed package for searching large sets of records by specified
      patterns. It complements Tokyo Cabinet by adding full-text indexing and
      search-oriented APIs rather than general key/value storage.
  timeline:
    - '2007: Official copyright range begins for Tokyo Dystopia.'
    - '2010: Official page last updated and latest source package listed as 0.9.15.'
    - 'Current: Homebrew still identifies it as a lightweight full-text search system.'
  usage:
    - >
      The official specification documents `./configure`, `make`, `make check`, and
      `make install`, producing headers, `libtokyodystopia`, pkg-config metadata,
      command-line tools such as `dystmgr`, `tcqmgr`, `tcwmgr`, and `lapumgr`, and CGI
      helpers. Its core model stores indexed text records and supports phrase, prefix,
      suffix, token, and character N-gram search, with Unicode-oriented multilingual
      support.
