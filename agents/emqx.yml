credentials-file-location: null
history:
  adoption-history:
    - >
      The anniversary post gives the clearest official adoption snapshot: more than 10K
      GitHub stars, more than 20M downloads, more than 20,000 enterprise users, and more
      than 30,000 active cluster deployments per month at the time of that post.
    - >
      EMQX's commercial adoption story is also official: EMQ says the company opened in
      2017 in response to enterprise users deploying EMQX at scale, and the anniversary
      post cites over 400 customers and over 70 Fortune 500 companies using EMQX in IoT,
      IIoT, connected-vehicle, and other mission-critical applications.
  package-nerd-significance:
    - >
      EMQX is a heavier package-manager entry than most CLIs in this batch: it ships a
      broker, management commands, Erlang runtime expectations, configuration layers, a
      dashboard, and service-style deployment behavior. For package maintainers, it sits
      closer to Redis, RabbitMQ, or Mosquitto than to a single-purpose command.
    - >
      It matters to package nerds because it exposes the messy but useful intersection
      of package managers and distributed systems: local development installs, service
      supervision, data directories, versioned config migration, and network ports all
      have to line up before the binary is useful.
  project-history:
    - >
      EMQ's tenth-anniversary post says EMQX was released as an open-source project on
      GitHub on December 17, 2012. The same source frames its origin around Erlang,
      MQTT, and open source, and says development continued through the 2010s as MQTT
      became a default protocol for IoT messaging.
    - >
      The official history highlights several product milestones: early MQTT 3.1 and
      3.1.1 compatibility, EMQX 3.0 in 2018 with full MQTT 5.0 server support, EMQX 4.0
      in 2020 with a built-in SQL-based rule engine, and EMQX 5.0 with larger-scale
      clustering, MQTT over QUIC, and 100M+ connection testing.
    - >
      The README describes EMQX as a platform rather than only a broker, with support
      for MQTT 5.0, 3.1.1, and 3.1, plus MQTT-SN, CoAP, LwM2M, and MQTT over QUIC. It
      also documents the 5.9.0 licensing/product change that unified features from the
      previous open-source and enterprise editions under BSL 1.1.
  related-projects:
    - >
      Related EMQ projects and surfaces include EMQX Cloud, the EMQX Kubernetes
      Operator, MQTTX, the EMQX rule engine and data integrations, and the broader MQTT
      broker ecosystem that includes Mosquitto, VerneMQ, HiveMQ, and RabbitMQ MQTT
      plugins.
  sources:
    - https://www.emqx.com/en/blog/reflections-on-the-tenth-anniversary-of-emqx
    - https://github.com/emqx/emqx
    - https://docs.emqx.com/en/emqx/latest/configuration/configuration.html
    - https://docs.emqx.com/en/emqx/latest/configuration/configuration.md
  summary:
    - >
      EMQX is an Erlang-based MQTT broker and IoT messaging platform for high-scale
      device connectivity, MQTT protocol support, clustering, rules, data integrations,
      and operational management.
  timeline:
    - '2012: EMQX released as an open-source project on GitHub on December 17.'
    - '2017: EMQ opened as a company after enterprise deployment demand grew.'
    - '2018: EMQX 3.0 released with complete MQTT 5.0 server support.'
    - '2020: EMQX 4.0 introduced a built-in SQL-based rule engine.'
    - >
      2022: EMQX 5.0 arrived with 100M+ connection testing and MQTT over QUIC
      highlighted by EMQ.
    - 'v5.9.0: EMQX unified prior open-source and enterprise features under BSL 1.1.'
  usage:
    - >
      Package users run EMQX as a broker service, commonly exposing MQTT ports, the
      Dashboard, and HTTP APIs. The official README shows Docker startup, Kubernetes
      operator documentation, downloads for self-managed installs, and build-from-source
      instructions.
    - >
      Configuration became more HOCON-oriented in EMQX 5. The official configuration
      docs describe `etc` as the static configuration directory, `data/configs` as the
      dynamic runtime configuration directory, `base.hocon` for configuration-as-code,
      `cluster.hocon` for changes persisted through Dashboard/API/CLI, and `emqx.conf`
      for backward-compatible immutable settings.
    - >
      In deployed systems, EMQX is commonly used as the MQTT ingress and routing layer
      for IoT data, with rules and bridges sending messages to Kafka, RabbitMQ,
      PostgreSQL, MySQL, MongoDB, Redis, ClickHouse, cloud messaging services, webhooks,
      and observability systems.
related-packages:
  - id: brew:mosquitto
    reason: >
      Choose Eclipse Mosquitto for a lightweight MQTT broker with lower resource needs
      in small or edge deployments; choose EMQX when built-in clustering, dashboards,
      integrations, and large-scale operation matter.
    rel: alternative
    sources:
      - https://www.emqx.com/en/blog/emqx-vs-mosquitto-2023-mqtt-broker-comparison
      - https://mosquitto.org/
  - id: cask:mqttx
    reason: >
      Use MQTTX to connect to EMQX, publish and subscribe to test topics, inspect MQTT
      traffic, and exercise broker authentication and protocol behavior.
    rel: adjacent_workflow
    sources:
      - https://docs.emqx.com/en/cloud/latest/connect_to_deployments/mqttx.html
      - https://mqttx.app/docs/
