display-name: Timing
repo: null
docs:
  - https://timingapp.com/help
  - https://timingapp.com/help/faq
  - https://timingapp.com/help/preferences
config-file-location:
  macos:
    - ~/Library/Preferences/info.eurocomp.Timing2.plist
    - ~/Library/Preferences/info.eurocomp.TimingHelper.plist
    - ~/Library/Preferences/info.eurocomp.Timing.plist
    - ~/Library/Preferences/info.eurocomp.Timing-lite.plist
    - ~/Library/Preferences/info.eurocomp.Timing-setapp.plist
    - ~/Library/Preferences/info.eurocomp.Timing-setapp.TimingHelper.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Timing has developed as a commercial Mac productivity tool aimed at freelancers,
      professionals, and teams that need reliable time records without continuously
      operating timers. Later additions included multi-Mac synchronization, a web app,
      teams, integrations, reports, and APIs.
  package-nerd-significance:
    - >
      Timing is notable among Mac productivity packages for treating observed
      application, document, and website activity as the raw material for time records.
      It also documents its local SQLite-oriented data directory and preference files,
      making backup and migration behavior unusually visible for a proprietary desktop
      application.
  project-history:
    - >
      Timing was founded in January 2011, according to its official press kit. It was
      designed around automatic observation of application, document, and website usage
      rather than requiring users to start and stop every timer manually.
    - >
      The product subsequently grew beyond its Mac timeline into synchronization, a web
      application, team workflows, integrations, reporting, automation interfaces, and
      AI-assisted activity summaries.
  related-projects:
    - Timing Sync
    - Timing Web App
    - Timing for Teams
  sources:
    - 'Official FAQ: https://timingapp.com/help/faq'
    - 'Official knowledge base: https://timingapp.com/help/'
    - 'Official press kit: https://timingapp.com/presskit/'
    - 'Official product page: https://timingapp.com/'
  summary:
    - >
      Timing is a proprietary automatic time and productivity tracker for macOS. It
      observes application, document, and website activity, then lets users review,
      categorize, report, and synchronize that activity.
  timeline:
    - '2011-01: Timing was founded'
    - '2021: Official updates documented continuing Mac and web-app development'
    - >
      2023-09-07: The press kit records a release milestone under the current company
      presentation
  usage:
    - >
      Timing's tracker runs in the background, preferably at login, and records
      application activity. Users review the timeline, assign activity to projects,
      create manual entries where needed, and generate reports or exports.
    - >
      Local data normally resides under ~/Library/Application
      Support/info.eurocomp.Timing2, with documented legacy and distribution-specific
      alternatives. Timing Sync can merge data across Macs and is required for the web
      app and some online features.
