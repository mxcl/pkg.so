history:
  adoption-history:
    - >
      Version 15 carried Navicat Premium's established multi-database desktop workflow
      onto a release with native Linux support, macOS dark mode, and integrated
      visualization. The versioned Homebrew cask allowed macOS users to retain this
      major release independently of the current Navicat line.
  package-nerd-significance:
    - >
      The version-pinned cask is useful where database tooling must remain compatible
      with an older operating system, license, plugin, or organizational workflow. It
      also preserves access to a historically significant Navicat release without
      treating the moving latest-version cask as reproducible.
  project-history:
    - >
      Navicat Premium 15 was launched on November 25, 2019. It extended the
      multi-database client with Data Visualization and improvements to data transfer,
      SQL Builder, and modeling, while adding dark mode and native Linux support.
  related-projects:
    - Navicat Premium
    - Navicat Premium Lite
    - Navicat Data Modeler 3
    - Navicat Monitor 2
  sources:
    - https://www.navicat.com/en/company/aboutus
    - >
      https://www.navicat.com/en/company/aboutus/blog/1269-welcome-to-navicat-premium-15-data-visualization.html
    - https://www.navicat.com/manual/pdf_manual/en/navicat_new/mac_manual/navicat_mac_en.pdf
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Navicat Premium 15 is the version-pinned fifteenth major release of Navicat's
      proprietary multi-database administration and development suite.
  timeline:
    - '2009: The original Navicat Premium multi-database product was released.'
    - '2019-11-25: Navicat Premium 15 was officially launched.'
    - '2021: Navicat 16 succeeded the version 15 product generation.'
  usage:
    - >
      Users connect to multiple database engines, edit schemas and data, run SQL,
      transfer or synchronize data, build models, automate tasks, and create
      visualizations. The versioned cask is appropriate specifically when release 15 is
      required.
