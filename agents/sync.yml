history:
  adoption-history:
    - >
      Sync initially targeted individuals needing private cloud storage, then expanded
      toward businesses and teams handling confidential information.
    - >
      The company states that the service is used across more than 180 countries. Its
      desktop, mobile, and web clients made the encrypted service accessible without
      requiring users to administer storage infrastructure.
  package-nerd-significance:
    - >
      Sync is a useful contrast to self-hosted synchronization packages: it is a
      proprietary managed cloud service whose desktop client can still be installed and
      maintained through Homebrew Cask.
    - >
      Its product identity is built around end-to-end encryption, cross-device
      synchronization, recovery, and controlled sharing rather than exposing a local
      synchronization daemon or public source repository.
  project-history:
    - >
      Thomas Savundra, Suhan Shan, and Darius Antia founded Sync in 2011 to create cloud
      storage with privacy protection built in.
    - >
      The free and Pro services launched under the Sync.com name in summer 2013. The
      platform subsequently grew beyond individual storage into secure document sharing
      and team collaboration.
  related-projects:
    - Sync Vault, a cloud-only storage area accessible through Sync clients.
    - >
      Sync CloudFiles, which exposes cloud files through Windows Explorer and macOS
      Finder while reducing local storage use.
  sources:
    - https://help.sync.com/hc/en-us/articles/38275586765075-The-Sync-desktop-application
    - https://www.sync.com/
    - https://www.sync.com/about/
    - https://www.sync.com/blog/celebrating-10-years-of-sync-com
    - source_facts.package-manager
  summary:
    - >
      Sync is a proprietary end-to-end-encrypted cloud-storage and collaboration service
      with desktop, mobile, and web applications. The desktop client synchronizes a
      local Sync folder and integrates cloud files with the operating system's file
      manager.
  timeline:
    - '2011: Thomas Savundra, Suhan Shan, and Darius Antia founded Sync.'
    - '2013: Free and Pro products launched under the Sync.com name.'
    - '2023: Sync marked ten years of the Sync.com brand.'
  usage:
    - >
      Install the desktop client, sign in to a Sync account, and work from the local
      Sync folder or through Finder-integrated CloudFiles. Changes are synchronized to
      the service and other connected devices.
    - >
      Use the web panel and sharing features for collaboration, permissions, link
      sharing, version history, and deleted-file recovery.
