  history-sources:
    - https://gettaurus.org/docs/CommandLine
    - https://gettaurus.org/docs/Index
    - https://github.com/Blazemeter/taurus/blob/master/README.md
    - https://github.com/Blazemeter/taurus/tags
  repo-sources:
    - >
      Official GitHub repository README links back to Taurus documentation and describes
      Taurus.
    - Official Taurus documentation includes a 'fork me on GitHub' link to Blazemeter/taurus.
  tags-sources:
    - >
      Official Taurus docs identify the bzt command-line tool, YAML/JSON configuration,
      JMeter, Selenium, cloud scaling, and reporting; GitHub topics include performance,
      load-testing, jmeter, and selenium.
