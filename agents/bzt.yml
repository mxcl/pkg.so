id: brew:bzt
display-name: Taurus
repo: https://github.com/Blazemeter/taurus
docs:
  - https://gettaurus.org/docs/CommandLine
  - https://gettaurus.org/docs/ConfigSyntax
  - https://gettaurus.org/docs/Index
config-file-location:
  unix:
    - /etc/bzt.d
    - ~/.bzt-rc
credentials-file-location:
  unix:
    - ~/.bzt-rc
history:
  adoption-history:
    - >
      Taurus adoption is concentrated among performance-testing and CI users who already
      know tools like JMeter but want easier automation, configuration merging, and
      reporting. Homebrew packaging makes the `bzt` command easy to install on macOS
      developer machines.
    - >
      Unlike broad Unix utilities, Taurus is specialized; the input facts list Homebrew
      as its package-manager channel here. Its wider distribution path is Python
      packaging via `pip install bzt`, which the upstream README recommends.
  package-nerd-significance:
    - >
      Taurus is package-interesting because it turns a stack of heavyweight test tools
      into one CLI entry point. Installing `bzt` gives developers a small command
      surface over JMeter, Selenium, Gatling, Locust, and reporting integrations.
    - >
      It also demonstrates the split between package ecosystems: Homebrew carries the
      command for convenience, while Python packaging remains the upstream's primary
      installation path.
  project-history:
    - >
      The official README describes Taurus as a convenience wrapper that hides the
      complexity of performance and functional tests while relying on underlying tools
      such as JMeter, Gatling, Locust.io, and Selenium WebDriver. The project is free
      and open source under Apache 2.0.
    - >
      The gettaurus.org documentation presents Taurus as a YAML-based command-line
      framework for load testing, continuous integration, reporting, and cloud-provider
      workflows. Its Git tag history starts at 1.0.0 and continues through a long 1.x
      series.
  related-projects:
    - Apache JMeter is Taurus's default and most prominent load-generator integration.
    - >
      Gatling, Locust.io, Selenium WebDriver, ApacheBench, k6, Mocha, and JUnit appear
      in the official documentation as supported executors or workflows.
    - BlazeMeter provides the project context and cloud-testing integration.
  sources:
    - https://gettaurus.org/docs/CommandLine
    - https://gettaurus.org/docs/Index
    - https://github.com/Blazemeter/taurus/blob/master/README.md
    - https://github.com/Blazemeter/taurus/tags
  summary:
    - >
      Taurus, installed as the `bzt` command, is BlazeMeter's open-source
      automation-friendly framework for continuous testing. It wraps tools such as
      JMeter, Gatling, Locust, Selenium WebDriver, and others behind a YAML/JSON
      configuration model.
  timeline:
    - "2010s: Taurus grows as BlazeMeter's open-source continuous-testing CLI."
    - '2016: Early public 1.x tags such as 1.0.0 appear in the upstream repository history.'
    - >
      2020s: The gettaurus.org docs describe `bzt` as the command-line tool and document
      YAML/JSON configuration workflows.
    - >
      2020s: The README continues to recommend PyPI installation while Homebrew packages
      the CLI for macOS users.
  usage:
    - >
      Users create YAML or JSON test configurations and run them with `bzt config.yml`,
      or launch shorthand flows such as `bzt my-existing.jmx` for JMeter files. The
      command-line docs describe config merging from base config, `/etc/bzt.d`,
      `~/.bzt-rc`, user-supplied configs, generated JMX shorthand, includes, aliases,
      and overrides.
    - >
      `~/.bzt-rc` is specifically documented as a per-user preference file and a
      recommended place for API keys and tokens because it is not copied into artifact
      directories.
related-packages:
  - id: brew:jmeter
    reason: >
      Use Apache JMeter with Taurus when you need Taurus's default load generator or
      want `bzt` to execute and report on existing `.jmx` test plans.
    rel: adjacent_workflow
    sources:
      - https://gettaurus.org/docs/JMeter/
      - https://jmeter.apache.org/
  - id: brew:k6
    reason: >
      Install Grafana k6 alongside Taurus when you want Taurus configuration,
      aggregation, and reporting around its officially supported k6 executor.
    rel: adjacent_workflow
    sources:
      - https://gettaurus.org/docs/ExecutionSettings/
      - https://grafana.com/oss/k6/
tags:
  - cli
  - continuous-testing
  - jmeter
  - load-testing
  - performance-testing
  - selenium
  - testing
