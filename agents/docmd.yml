id: brew:docmd
display-name: docmd
repo: https://github.com/docmd-io/docmd
docs:
  - https://docs.docmd.io/
config-file-location:
  unix:
    - ./docmd.config.json
    - ./docmd.config.ts
    - ./docmd.config.js
credentials-file-location: null
history:
  adoption-history:
    - >
      docmd is early but visible. The repository has more than two thousand GitHub
      stars, Homebrew packages the npm-distributed core package, and the project
      publishes frequent GitHub releases. Homebrew analytics show hundreds of recent
      installs, which is notable for such a new documentation generator.
  package-nerd-significance:
    - >
      docmd is interesting as a snapshot of documentation tooling after LLM workflows
      became mainstream. Its package story mixes npm, Docker, Homebrew, generated
      `llms.txt` context, a native MCP command, and plugin metadata, showing how docs
      generators adapted from static sites toward agent-readable project surfaces.
  project-history:
    - >
      The GitHub repository was created in May 2025. By 2026, the README described docmd
      as production-ready documentation from Markdown with no required config, built-in
      search, versioning, internationalization, plugins, Docker images, and AI-oriented
      features.
  related-projects:
    - >
      The README compares docmd with Docusaurus, MkDocs, VitePress, and Mintlify.
      Related official repositories include docmd-search for semantic search and
      docmd-skills for generated agent instruction sets.
  sources:
    - https://github.com/docmd-io/docmd
    - https://raw.githubusercontent.com/docmd-io/docmd/main/README.md
    - https://api.github.com/repos/docmd-io/docmd
    - https://github.com/docmd-io/docmd/releases
    - https://formulae.brew.sh/api/formula/docmd.json
  summary:
    - >
      docmd is a young TypeScript documentation generator for Markdown projects. Its
      public positioning is explicitly modern documentation tooling: zero-config static
      output, small client payloads, local search, AI context files, and a CLI-centered
      workflow.
  timeline:
    - '2025: GitHub repository created.'
    - '2026-05: 0.8.5 release introduced an offline semantic search preview.'
    - '2026-06: 0.8.6 release emphasized native MCP and agent skills.'
    - '2026-06: 0.8.9 release hardened plugin registry and semantic-search packaging.'
  usage:
    - >
      The normal workflow is `npx @docmd/core dev` for local development and `npx
      @docmd/core build` for static output. A `docmd.config.json`, TypeScript, or
      JavaScript config file is optional and used when the generated navigation and
      defaults need more control.
related-packages:
  - id: brew:mkdocs
    reason: >
      Choose MkDocs when a Python-based documentation generator and its mature plugin
      ecosystem fit the project better; docmd's official comparison identifies that as
      MkDocs' principal advantage.
    rel: alternative
    sources:
      - https://docs.docmd.io/04/comparison/
      - https://www.mkdocs.org/
tags:
  - cli
  - documentation
  - markdown
  - static-site-generator
