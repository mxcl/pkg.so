history:
  adoption-history:
    - >
      dyff spread through infrastructure and configuration workflows rather than general
      prose diffing. Its README documents FreeBSD ports/packages, Homebrew tap
      installation, mise, MacPorts, GitHub release binaries, a curl installer, and go
      install; the batch input also lists Homebrew, MacPorts, Nix, Scoop, and zypper.
  package-nerd-significance:
    - >
      dyff is package-nerd relevant because modern infrastructure is YAML-heavy and
      ordinary line diff is often noisy for structured config. It packages the
      BOSH/Cloud Foundry style of semantic manifest comparison into a standalone CLI
      that also fits Kubernetes, Git, CI, and cross-platform binary distribution.
  project-history:
    - >
      The official git history starts on 2018-03-09, with early commits adding
      Cobra-generated command structure and, by 2018-03-11, json, yaml, and between
      subcommands. Tags begin with v0.1-alpha in April 2018 and continue through v1.12.0
      in April 2026.
  related-projects:
    - >
      The official README names BOSH v1 as the inspiration and references Spruce path
      syntax, go-patch paths, kubectl diff integration, cf-deployment examples, Git
      external diff usage, jq pipelines, and Go installation.
  sources:
    - https://github.com/homeport/dyff#readme
    - https://github.com/homeport/dyff/blob/main/.docs/commands/dyff.md
    - https://github.com/homeport/dyff
  summary:
    - >
      dyff is Homeport's diff tool for YAML files and sometimes JSON. Its official
      README says it was inspired by old BOSH v1 deployment output that reported only
      the changed parts of YAML from one version to another.
  timeline:
    - '2018: Initial git commit and alpha tags.'
    - >
      2018: Early subcommands for JSON conversion, YAML conversion, and file comparison
      land in the official repository.
    - '2026: v1.12.0 tagged on 2026-04-26.'
  usage:
    - >
      dyff compares local files, remote URIs, or stdin; reports differences by YAML
      document location; can use Spruce dot-style paths or go-patch path syntax;
      converts YAML and JSON; preserves map order; and can be wired into kubectl diff or
      Git external diff commands.
related-packages:
  - id: brew:jd
    reason: >
      Choose jd when you need to create or apply structural patches or control set and
      multiset array semantics; choose dyff for compact, YAML-oriented human review and
      kubectl or Git integration.
    rel: alternative
    sources:
      - https://github.com/homeport/dyff/blob/main/README.md
      - https://github.com/josephburnett/jd
