history:
  adoption-history:
    - >
      The early 0.x product emphasized a serverless, local-first design, which
      simplified private deployment and kept chat data in the client. Maintainers later
      concluded that synchronization, knowledge bases, sharing, and scheduled agents
      required server-side persistence.
    - >
      A desktop public beta began with version 1.83.0 in April 2025. It combined
      local-first operation with connections to LobeHub Cloud or self-hosted instances
      and introduced desktop integrations such as local-file and stdio MCP support.
  package-nerd-significance:
    - >
      LobeHub is relevant to package and self-hosting enthusiasts because the same
      open-source project spans a packaged desktop client, Docker deployment, cloud
      operation, model-provider configuration, plugins, MCP integrations, and
      local-first workflows.
    - >
      Its development illustrates the rapid evolution of open-source LLM front ends into
      broader agent platforms, including the architectural shift from browser-local
      storage toward optional databases and synchronized desktop clients.
  project-history:
    - >
      The project developed publicly as LobeChat, an open-source interface and framework
      for interacting with multiple large-language-model providers. Its initial
      architecture favored client-side, local-first operation and straightforward
      one-click deployment.
    - >
      In March 2024, maintainers outlined the path toward 1.0 and server-side database
      support. The desktop application entered public beta in April 2025. The project
      subsequently adopted the LobeHub identity and broadened its focus from chat toward
      creating, organizing, scheduling, and collaborating with AI agents.
  related-projects:
    - >
      LobeHub's ecosystem includes lobe-ui, lobe-icons, lobe-tts, the chat plugin SDK,
      agent indexes, and plugin indexes.
    - >
      Docker, Vercel, PostgreSQL-compatible storage, model-provider APIs, and the Model
      Context Protocol are important deployment or integration technologies around the
      project.
  sources:
    - 'Current official repository: https://github.com/lobehub/lobehub'
    - >
      Official 1.0 architecture announcement:
      https://github.com/lobehub/lobehub/discussions/1768
    - 'Official desktop-beta announcement: https://github.com/lobehub/lobehub/issues/7594'
    - 'Official documentation: https://lobehub.com/docs'
    - 'Supplied official repository fact: source_facts.repo'
  summary:
    - >
      LobeHub, formerly centered on the LobeChat name, is an open-source AI agent and
      chat platform available as a web deployment, self-hosted service, and desktop
      application.
  timeline:
    - '2023: The public LobeChat community discussed plans for an official desktop application.'
    - >
      2024: Maintainers announced a move beyond the 0.x local-only architecture toward
      optional server-side database support.
    - >
      2025: The official desktop client entered public beta with local-first, cloud, and
      self-hosted modes.
    - >
      Later: The project adopted the LobeHub identity and expanded toward collaborative
      and scheduled agent operations.
  usage:
    - >
      Desktop users can run locally, connect to LobeHub Cloud, or attach the client to a
      self-hosted instance. They can configure model providers and extend agents with
      plugins, local files, and MCP servers.
    - >
      Self-hosters deploy the service through Docker or supported cloud platforms and
      supply model, authentication, database, and storage settings through deployment
      environment variables.
