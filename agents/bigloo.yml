config-file-location:
  unix:
    - .bigloorc
    - ~/.bigloorc
credentials-file-location: null
history:
  adoption-history:
    - >
      Bigloo has stayed visible in Unix package collections as a niche but serious
      Scheme compiler: the input package facts list Homebrew, Fedora, MacPorts, Nix, and
      Arch packages. The official site also names Hop and php tools as projects
      implemented using Bigloo.
  package-nerd-significance:
    - >
      Bigloo matters to package historians because it is one of the older packaged
      Scheme systems that treated Scheme as a systems-programming tool: C linkage,
      standalone binaries, multiple backends, and a Unix-style tool suite make it more
      than just another REPL.
  project-history:
    - >
      The official Bigloo site traces the project under an Inria copyright range
      beginning in 1992 and presents Bigloo as a Scheme descendant designed for the
      places where C or C++ would normally be used. Its documentation emphasizes
      modules, native executables, C interop, a JVM backend, threads, and libraries
      rather than a purely academic interpreter.
  related-projects:
    - >
      Related Scheme implementations include Guile, Racket, Chez Scheme, Chicken Scheme,
      and Gambit; Bigloo's official site also links Hop as a Bigloo-implemented project.
  sources:
    - GitHub repository metadata from https://api.github.com/repos/manuel-serrano/bigloo.
    - Official Bigloo homepage and download page.
    - Package adoption from source_facts.package-manager.
  summary:
    - >
      Bigloo is a long-running Scheme implementation from Inria, positioned as a
      practical Scheme compiler and environment for producing small standalone binaries
      and interoperating with C and Java.
  timeline:
    - '1992: Official Bigloo site copyright range begins.'
    - '2018: Official GitHub repository metadata shows the public GitHub repository created.'
    - '2026: Official download page lists Bigloo 4.7a.'
  usage:
    - >
      Package users install Bigloo when they want the `bigloo` compiler and companion
      tools such as dependency, archive, profiler, and tags helpers for Scheme projects
      that compile to native code or the JVM.
