config-file-location:
  unix:
    - ~/.crystal/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Crystal became available through the Homebrew cask `stravu-crystal`. Its official
      repository records about 3,100 GitHub stars before deprecation, indicating notable
      interest in desktop orchestration for coding agents.
  package-nerd-significance:
    - >
      Crystal captured an early packageable pattern for agentic development: running
      competing or complementary coding-agent sessions in isolated Git worktrees,
      reviewing their diffs, and integrating selected changes. It is also a useful
      historical bridge between single-agent coding assistants and fuller local AI
      workspaces.
  project-history:
    - >
      Stravu created Crystal as an open-source Electron desktop application for running
      multiple Claude Code sessions in parallel Git worktrees. Later releases added
      OpenAI Codex support and a panel-based workspace.
    - >
      The maintainers deprecated Crystal in February 2026 and replaced it with
      Nimbalyst. The final Crystal release advises migration while allowing existing
      installations to continue operating.
  related-projects:
    - Nimbalyst is Crystal's official successor.
    - Claude Code and OpenAI Codex are the coding agents integrated by later Crystal releases.
    - Git worktrees provide the session-isolation mechanism.
  sources:
    - https://github.com/stravu/crystal
    - https://github.com/stravu/crystal/releases
    - source_facts.package-manager
  summary:
    - >
      Crystal was an open-source desktop manager for parallel AI coding sessions, using
      Git worktrees to isolate changes made by Claude Code and OpenAI Codex. It was
      deprecated in favor of Nimbalyst in February 2026.
  timeline:
    - >
      2025: Public releases established the multi-session Git-worktree workflow and
      later added OpenAI Codex support.
    - '2025-08: Homebrew cask installation was added.'
    - '2026-02: Crystal was deprecated and replaced by Nimbalyst.'
  usage:
    - >
      Users selected or created a Git project, started one or more agent sessions from
      prompts, monitored output and diffs, tested changes in isolated worktrees, and
      then rebased or merged chosen work into the main branch.
    - >
      Crystal expected the selected coding agent and Git to be installed separately. Its
      settings were persisted in `~/.crystal/config.json`; third-party deployment
      environment variables could be supplied through project settings.
