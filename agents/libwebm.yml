history:
  adoption-history:
    - >
      WebM gained early browser and tooling momentum because Chromium added initial WebM
      and VP8 support on the announcement day, and Google framed the format as part of
      the open HTML5 video stack. Chromium's 2020 retrospective describes WebM and
      WebRTC as foundational web media projects and cites adoption by major video
      platforms and technology companies across VP8, VP9, and AV1-era work.
    - >
      libwebm's adoption is quieter than the WebM format itself: it is the container
      library that package managers expose for encoders, muxers, parsers,
      media-inspection tools, and test programs that need a native WebM implementation.
  package-nerd-significance:
    - >
      libwebm is one of those small libraries that makes an open media format real in
      build graphs. Installing it gives media packages a maintained WebM parser and
      muxer without pulling in a whole browser, and its canonical Git-on-Google plus
      GitHub mirror layout is typical of Chromium-adjacent infrastructure.
  project-history:
    - >
      Google and browser partners announced WebM on 2010-05-19 as an open, freely
      implementable web-optimized video format centered on VP8. The WebM Project FAQ
      defines WebM files as VP8 or VP9 video, Vorbis or Opus audio, and WebVTT text
      tracks in a Matroska-based structure.
    - >
      The WebM developer overview lists libwebm as the WebM file parser, with the
      canonical browse repository at chromium.googlesource.com/webm/libwebm and a GitHub
      mirror. The README focuses on building libwebm with CMake or Makefile.unix and
      running parser/muxer tests, reflecting its role as a library component rather than
      an end-user player.
  related-projects:
    - >
      Related projects include libvpx, webm-tools, WebM DirectShow filters, Matroska,
      WebVTT, Vorbis, Opus, VP8, VP9, AV1, Chromium, YouTube, and the Alliance for Open
      Media.
  sources:
    - https://blog.chromium.org/2010/05/
    - https://blog.chromium.org/2020/05/celebrating-10-years-of-webm-and-webrtc.html
    - https://chromium.googlesource.com/webm/libwebm/
    - https://github.com/webmproject/libwebm/
    - https://www.webmproject.org/
    - https://www.webmproject.org/about/faq/
    - https://www.webmproject.org/code/
  summary:
    - >
      libwebm is the WebM Project's C++ parser and muxer library for the WebM container,
      which is based on Matroska and designed for open web video. It sits next to libvpx
      in the WebM ecosystem: libvpx handles VP8/VP9 codec work, while libwebm handles
      the container-level reading and writing that tools need.
  timeline:
    - '2010-05-19: WebM and VP8 are announced, and Chromium adds initial support.'
    - >
      2011-01-11: Chromium describes broad WebM adoption by browsers, tools, and
      hardware vendors after launch.
    - >
      2013: The WebM Project delivers VP9-era bitrate improvements, according to
      Chromium's 2020 retrospective.
    - >
      2018: AV1-era open media work is described as adding further bitrate savings in
      the Chromium retrospective.
    - '2020-05-27: Chromium publishes a ten-year WebM and WebRTC retrospective.'
    - >
      2025: The libwebm repository continues as a Chromium Gitiles project with a GitHub
      mirror and version tags such as libwebm-1.0.0.32.
  usage:
    - >
      The package ships sample and utility programs such as mkvmuxer_sample,
      mkvparser_sample, vttdemux, and webm2pes. Developers use the library to parse WebM
      files, mux WebM output, inspect tracks and cues, and build media tooling around
      the WebM container.
