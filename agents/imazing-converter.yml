history:
  adoption-history:
    - >
      iMazing distributes Converter free of charge for macOS and Windows and also
      bundles it with the main iMazing application. It addresses compatibility gaps on
      systems and applications that cannot directly consume Apple's newer media formats.
  package-nerd-significance:
    - >
      The utility is a focused compatibility package: it converts modern Apple-oriented
      codecs into broadly supported legacy formats without requiring a full media
      editor, cloud upload, or command-line codec setup.
  project-history:
    - >
      DigiDNA's iMazing team created iMazing Converter as a lightweight companion to its
      broader Apple-device management product. It was designed around the HEIC and HEVC
      formats Apple introduced to iOS users in 2017.
    - >
      The application supports both still-image and video conversion, with controls for
      image resolution, quality, metadata, and color profiles. Official documentation
      emphasizes that conversion happens locally and does not require an Internet
      connection.
  related-projects:
    - iMazing
    - Apple HEIF/HEIC
    - HEVC/H.265
    - JPEG
    - PNG
    - AVC/H.264
  sources:
    - https://imazing.com/converter
    - https://imazing.com/converter/download
    - https://imazing.com/guides/how-to-convert-heic-to-jpeg
  summary:
    - >
      iMazing Converter is a free macOS and Windows utility that converts HEIC images to
      JPEG or PNG and HEVC/H.265 videos to MP4/H.264.
  timeline:
    - >
      2017: Apple introduced HEIF/HEIC and HEVC capture formats with iOS 11, creating
      the compatibility problem addressed by the utility.
    - >
      2026: Official releases supported macOS and Windows and conversion of both HEIC
      images and HEVC videos.
  usage:
    - >
      Users drag individual media files or folders into the application, select output
      quality, resolution, format, and metadata behavior, then choose a destination.
      Processing occurs locally without uploading files to a cloud service.
