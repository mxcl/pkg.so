history:
  adoption-history:
    - >
      MariaDB 11.8's adoption story is about being the next LTS after 11.4. The
      Foundation said users could upgrade to 11.8 from 11.4 or older MariaDB releases,
      and the line appears alongside other maintained long-term releases in MariaDB
      Foundation release announcements.
    - >
      For Homebrew users, mariadb@11.8 provides the newer LTS branch without requiring
      the unversioned mariadb formula to stay there forever. That matters for local
      databases with persistent data directories, applications testing MariaDB Vector
      features, and CI environments that need a reproducible server version.
  package-nerd-significance:
    - >
      mariadb@11.8 is the versioned formula for the fresh LTS path: newer than 11.4,
      less transient than a rolling or short-term line. It is the branch to pin when
      teams want current MariaDB LTS behavior without automatically crossing into future
      major LTS releases.
    - >
      Its significance is higher than an ordinary point-in-time package because
      databases have durable on-disk state. A versioned formula protects repeatable
      tests, dumps, migrations, and compatibility checks while still letting users
      deliberately opt into later branches.
  project-history:
    - >
      MariaDB started in 2009 as a MySQL-compatible community fork and has since
      developed independent release lines under MariaDB Foundation and MariaDB
      Corporation stewardship. By 2025, MariaDB had moved toward yearly LTS releases for
      users who want stable feature sets with long maintenance windows.
    - >
      MariaDB Foundation announced MariaDB 11.8 as an LTS release candidate in February
      2025 and described it as succeeding 11.4. The 11.8 LTS release announcement says
      it was the yearly long-term-support release for 2025 and the first LTS with
      MariaDB Vector support. The 11.8.2 release notes identify 4 June 2025 as the
      Stable GA date.
  related-projects:
    - MariaDB 11.4 is the previous LTS branch and common direct predecessor.
    - MariaDB 10.11 is the older 10.x LTS line for conservative compatibility.
    - >
      MariaDB Connector/C provides the C client library used by applications and build
      systems around 11.8.
  sources:
    - https://mariadb.com/docs/release-notes/community-server/11.8/11.8.2
    - >
      https://mariadb.com/docs/server/clients-and-utilities/server-client-software/download/getting-the-mariadb-source-code
    - >
      https://mariadb.com/docs/server/server-management/install-and-upgrade-mariadb/configuring-mariadb/configuring-mariadb-with-option-files
    - https://mariadb.org/11-8-lts-released/
    - https://mariadb.org/about/
    - https://mariadb.org/mariadb-community-server-corrective-releases/
    - https://mariadb.org/mariadb-server-turns-fifteen/
    - https://mariadb.org/tag/mariadb-11-8/
  summary:
    - >
      MariaDB 11.8 is the 2025 long-term-support MariaDB Server line. The Homebrew
      mariadb@11.8 formula is the versioned choice for users who want the current 11.x
      LTS generation, including the newer feature set, while keeping a pinned branch for
      predictable development and deployment.
  timeline:
    - '2009: MariaDB began as a community fork of MySQL.'
    - '2024: MariaDB 11.4 became the previous LTS line.'
    - '2025: MariaDB Foundation announced MariaDB 11.8 as LTS, with GA planned for May.'
    - '2025: MariaDB 11.8 LTS was released as the yearly long-term-support release for 2025.'
    - '2025: MariaDB 11.8.2 became Stable GA on 4 June 2025.'
    - '2026: MariaDB Foundation listed 11.8 among maintained long-term release lines.'
  usage:
    - >
      Use mariadb@11.8 when production targets the 2025 LTS line, when testing features
      introduced around 11.8 such as MariaDB Vector support, or when planning upgrades
      from 11.4 while keeping the database branch fixed.
    - >
      Configuration follows the normal MariaDB option-file rules documented for the
      server. Package users should also watch release notes before upgrades because even
      LTS maintenance releases can change packaged tools, plugins, security fixes, and
      client/server behavior.
related-packages:
  - id: brew:mariadb@12.3
    reason: >
      Choose MariaDB 12.3 for the subsequent LTS generation and its longer current
      Community maintenance horizon when upgrade testing permits.
    rel: alternative
    sources:
      - https://mariadb.org/mariadb-server-12-3-lts-released/
      - https://mariadb.org/about/
  - id: brew:mariadb@11.4
    reason: >
      Choose MariaDB 11.4 when an existing deployment requires its earlier 11.x
      compatibility baseline or its Community maintenance window through 2029.
    rel: alternative
    sources:
      - https://mariadb.org/11-4-lts/
      - https://mariadb.org/about/
  - id: brew:mysql@8.4
    reason: >
      Choose MySQL 8.4 for Oracle's MySQL LTS implementation when MySQL-specific
      behavior or certification is more important than MariaDB 11.8 features.
    rel: alternative
    sources:
      - https://dev.mysql.com/doc/refman/8.4/en/
      - >
        https://mariadb.com/docs/release-notes/community-server/about/compatibility-and-differences/mariadb-vs-mysql-compatibility
  - id: brew:mariadb-connector-c
    reason: >
      Use MariaDB Connector/C for official C and C++ application connectivity to a
      MariaDB 11.8 server.
    rel: adjacent_workflow
    sources:
      - https://mariadb.com/docs/connectors/mariadb-connector-c
