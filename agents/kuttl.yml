credentials-file-location: null
history:
  adoption-history:
    - >
      KUTTL became part of the Kubernetes operator testing toolkit because it let
      operator authors write YAML-centered tests that apply resources, wait for
      assertions, and run against real or local control planes. The repository topics
      and README connect it to Kubernetes, operators, KUDO, and Operator SDK.
  package-nerd-significance:
    - >
      KUTTL is package-nerd relevant because it packages a Kubernetes-specific test
      runner as a kubectl plugin. It sits at the border between CLI packaging, cluster
      lifecycle tooling, and declarative test fixtures.
  project-history:
    - >
      KUTTL began under the KUDO project and then split into its own release stream. The
      v0.1.0 release notes describe the initial release as separate from KUDO, with
      mocked, KinD, and kubeconfig-backed control planes plus library integration and
      solo E2E execution.
  related-projects:
    - >
      KUTTL is related to KUDO, kubectl plugins, Kubernetes operators, KinD, and
      Operator SDK scorecard-style testing workflows.
  sources:
    - https://github.com/kudobuilder/kuttl
    - https://github.com/kudobuilder/kuttl/blob/main/docs/README.md
    - https://github.com/kudobuilder/kuttl/releases/tag/v0.1.0
    - https://github.com/kudobuilder/kuttl/releases/tag/v0.26.0
    - https://github.com/kudobuilder/kuttl/releases?page=4
  summary:
    - >
      KUTTL, the KUbernetes Test TooL, is a kubectl plugin and Go project for
      declarative testing of Kubernetes operators and other Kubernetes objects.
  timeline:
    - >
      v0.1.0: Initial release separated KUTTL from KUDO and added multiple test
      control-plane modes.
    - 'v0.4.0: Switched APIs to kuttl.dev/v1beta and deprecated kudo.dev support.'
    - >
      v0.26.0: Added namespace collision fixes and noted Homebrew formula-to-cask
      migration feedback.
  usage:
    - >
      Users install it as the `kubectl kuttl` plugin and run suites with `kubectl kuttl
      test path/to/test-suite`. The getting-started docs require Kubernetes and kubectl
      1.13 or later, and the repository includes `kuttl-test.yaml` as the conventional
      suite configuration file.
related-packages:
  - id: brew:kind
    reason: >
      Use kind to provide the disposable Kubernetes-in-Docker control plane that KUTTL
      supports for integration and operator test suites.
    rel: adjacent_workflow
    sources:
      - https://github.com/kudobuilder/kuttl/blob/main/docs/testing.md
      - https://kind.sigs.k8s.io/
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl to inspect and manage the cluster resources exercised by KUTTL, which
      itself installs and runs as the `kubectl kuttl` plugin.
    rel: adjacent_workflow
    sources:
      - https://github.com/kudobuilder/kuttl
      - https://kubernetes.io/docs/reference/kubectl/
