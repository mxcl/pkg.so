id: brew:btcli
display-name: btcli
repo: https://github.com/opentensor/btcli
docs:
  - https://docs.bittensor.com/btcli
  - https://docs.learnbittensor.org/getting-started/install-btcli
config-file-location:
  unix:
    - ~/.bittensor/config.yml
    - ~/.bittensor/btcli.yaml
credentials-file-location:
  unix:
    - ~/.bittensor/wallets
history:
  adoption-history:
    - >
      btcli adoption follows Bittensor ecosystem adoption rather than classic Unix
      utility adoption. The official README documents installation from PyPI, Homebrew,
      and source, plus use with the broader bittensor SDK through the bittensor[cli]
      extra.
    - >
      The Homebrew formula gives macOS users a package-manager path alongside Python
      packaging, which matters because the README recommends Homebrew-installed
      Python/OpenSSL on macOS.
  package-nerd-significance:
    - >
      btcli is interesting as a blockchain-network CLI crossing Python packaging and
      Homebrew. It is young compared with the other tools in this batch, but it shows
      how Web3 and AI-network projects ship operational CLIs into general-purpose
      package managers for developer onboarding.
  project-history:
    - >
      The standalone opentensor/btcli repository began with public commits in July 2024
      and an MIT-licensed README for the Bittensor CLI. Its first listed tag in the
      local git history is v8.0.0 in September 2024.
    - >
      The README frames btcli as a tool for common Bittensor operations: creating
      wallets, registering subnets or neurons, delegating TAO, viewing Senate proposals,
      and voting.
  related-projects:
    - >
      The README links btcli to the Bittensor SDK repository, the btwallet repository,
      and the Bittensor whitepaper.
    - >
      The bittensor[cli] Python extra is documented as a way to install btcli alongside
      the SDK.
  sources:
    - >
      Local git history from https://github.com/opentensor/btcli shows first commits in
      2024, tag v8.0.0 in 2024, and tag v9.23.1 in 2026.
    - >
      Official README describes btcli as the Bittensor CLI and lists wallet, subnet,
      staking, delegation, Senate proposal, and voting operations:
      https://raw.githubusercontent.com/opentensor/btcli/main/README.md
    - >
      Official README documents PyPI, Homebrew, source, and SDK-extra installation
      paths: https://raw.githubusercontent.com/opentensor/btcli/main/README.md
    - Package-manager adoption from source_facts.package-manager.
  summary:
    - >
      btcli is the command-line client for the Bittensor network. It packages wallet,
      subnet, staking, delegation, governance, and node-management workflows into a
      terminal tool distributed through PyPI, Homebrew, and source installs.
  timeline:
    - >
      2024: Public git history for opentensor/btcli starts with README and Typer-related
      commits.
    - '2024: v8.0.0 appears as an early standalone btcli tag.'
    - '2026: The repository history shows v9.23.1, indicating active release cadence.'
  usage:
    - >
      Users run btcli to manage Bittensor wallets, chain configuration, subnet and
      neuron registration, staking and delegation, and governance voting. The tool reads
      common defaults from ~/.bittensor/config.yml, stores wallet material under
      ~/.bittensor/wallets, and supports command-level help with --help.
related-packages:
  - id: brew:bittensor
    reason: >
      Choose the unified Bittensor package for new installations because upstream
      superseded the standalone bittensor-cli package and now ships btcli with the SDK.
    rel: alternative
    sources:
      - https://github.com/RaoFoundation/btcli
      - https://github.com/RaoFoundation/subtensor/tree/main/sdk/python
      - https://www.bittensor.com/docs
tags:
  - bittensor
  - blockchain
  - cli
  - staking
  - wallet
