id: brew:cloudformation-guard
display-name: AWS CloudFormation Guard
repo: null
docs:
  - https://docs.aws.amazon.com/cfn-guard/latest/ug/cfn-guard-validate.html
  - https://docs.aws.amazon.com/cfn-guard/latest/ug/what-is-guard.html
  - https://github.com/aws-cloudformation/cloudformation-guard#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CloudFormation Guard is adopted by platform, security, and compliance teams that
      need repeatable checks on infrastructure definitions. It fits naturally into CI
      because the CLI validates files without requiring cloud-side deployment.
    - >
      The Homebrew package is comparatively specialized, but the tool has a clearer
      package-manager role than many AWS side tools: install cfn-guard, run a rules file
      against templates, and fail the build if policy checks do not pass.
  package-nerd-significance:
    - >
      cfn-guard is significant as a compact Rust-based policy CLI in the IaC packaging
      ecosystem. It competes in the same mental space as linters and policy engines, but
      its syntax and examples are tailored to CloudFormation users.
    - >
      For package maintainers, the interesting bit is that cfn-guard is useful even
      without AWS credentials: it packages cleanly as an offline validator that can run
      in local pre-commit hooks, CI containers, and developer laptops.
  project-history:
    - >
      AWS created the cloudformation-guard repository in 2020 and published an initial
      preview release shortly afterward. The project gave CloudFormation users a
      lightweight validation language that could run locally or in CI before templates
      reached deployment.
    - >
      Guard's scope widened beyond only CloudFormation templates: the official
      repository describes validation for JSON- and YAML-formatted data including
      Kubernetes configurations and Terraform JSON plans, while AWS docs keep
      CloudFormation as the primary user-facing context.
  related-projects:
    - AWS CloudFormation is the primary template ecosystem Guard was built to validate.
    - >
      CloudFormation Hooks and AWS Config rules are related governance mechanisms with
      different execution models.
    - >
      cfn-lint is adjacent template validation tooling, while CloudFormation CLI
      supports extension authoring rather than policy checks.
  sources:
    - https://docs.aws.amazon.com/cfn-guard/latest/ug/what-is-guard.html
    - https://docs.aws.amazon.com/cfn-guard/latest/ug/cfn-guard-validate.html
    - https://github.com/aws-cloudformation/cloudformation-guard
  summary:
    - >
      AWS CloudFormation Guard, exposed as cfn-guard, is a policy-as-code CLI and rule
      language for validating structured configuration such as CloudFormation templates.
      AWS documentation and the upstream repository both describe it as a way to write
      declarative guard rules and validate JSON/YAML data.
  timeline:
    - '2020: Official cloudformation-guard GitHub repository was created.'
    - '2020: Initial preview release v0.5.0-beta was published.'
    - >
      2020s: Guard documentation expanded around validation, testing, and rule authoring
      workflows.
    - >
      2020s: The repository described validation beyond CloudFormation templates,
      including Kubernetes and Terraform JSON inputs.
  usage:
    - >
      Users write Guard rules, then run cfn-guard validate against templates or other
      structured data. AWS also documents related commands for testing rules and
      generating rule files from existing templates.
    - >
      There is no single official user config or credential file location for cfn-guard;
      rules and data files are supplied explicitly as command inputs.
related-packages:
  - id: brew:cfn-lint
    reason: >
      Run cfn-lint before Guard to validate CloudFormation syntax, resource properties,
      and template structure, then use Guard for organization-specific policy checks.
    rel: adjacent_workflow
    sources:
      - https://docs.aws.amazon.com/cfn-guard/latest/ug/what-is-guard.html
      - https://github.com/aws-cloudformation/cfn-lint#readme
