id: brew:git-recent
display-name: git-recent
repo: https://github.com/paulirish/git-recent
docs:
  - https://github.com/paulirish/git-recent#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-recent spread as a small personal-workflow utility through npm and Homebrew,
      with Nix also recorded in the input package metadata. Its adoption significance
      comes less from enterprise deployment and more from shell users copying a tiny Git
      helper into daily branch-switching habits.
  package-nerd-significance:
    - >
      git-recent is a compact example of the Git subcommand packaging pattern: one
      executable on PATH becomes a Git verb, distributed through npm, Homebrew, and Nix,
      and upgraded without changing the underlying Git data model.
  project-history:
    - >
      The README records the tool's origin in Paul Irish's dotfiles in May 2016,
      followed by a standalone repository and npm publication in August 2016. The
      original script became git-recent-og after the 2.0 rewrite.
    - >
      The 2.0 line, released in 2025 according to the changelog, added an fzf-based
      interactive UI for browsing branches, viewing branch-specific commits, inspecting
      a diff against main, and checking out the selected branch.
  related-projects:
    - fzf powers the 2.x interactive branch picker.
    - delta can format diffs shown from the interactive UI.
    - >
      The README points branch-navigation enthusiasts to git-fuzzy, lazygit, tig, and
      fzf-git.sh.
  sources:
    - https://formulae.brew.sh/formula/git-recent
    - https://github.com/paulirish/dotfiles/commit/1ca1ff760832af558447145fa2a367046b1829d2
    - https://github.com/paulirish/git-recent
    - https://github.com/paulirish/git-recent#readme
  summary:
    - >
      git-recent is a Git branch navigation helper by Paul Irish for browsing recently
      touched branches and checking one out with a short interactive flow.
  timeline:
    - '2016: Script added to paulirish/dotfiles.'
    - '2016: Standalone repository released and package published to npm.'
    - '2018: Count parameter added.'
    - '2019: Final 1.x bugfix recorded in the README changelog.'
    - >
      2025: 2.0 upgrade added fzf integration and renamed the original implementation to
      git-recent-og.
  usage:
    - >
      Practitioners run git recent inside a repository, navigate the fzf list of
      branches, press Enter to check out a selection, and use Ctrl-O to inspect a diff.
      The README notes optional delta integration for formatted diffs and worktree
      detection that can guide a user to an existing checkout.
    - >
      Users who do not want the fzf dependency can run git recent-og, the renamed 2016
      implementation, with options such as -n to limit the number of branches shown.
related-packages:
  - id: brew:fzf
    reason: >
      fzf is the required interactive selector for git-recent 2.x, providing the branch
      list navigation and selection interface used by `git recent`.
    rel: adjacent_workflow
    sources:
      - https://github.com/paulirish/git-recent#readme
      - https://github.com/junegunn/fzf#readme
  - id: brew:git-delta
    reason: >
      Install git-delta when you want syntax-highlighted formatting for git-recent's
      Ctrl-O branch-diff preview; git-recent detects delta and otherwise falls back to
      plain output.
    rel: adjacent_workflow
    sources:
      - https://github.com/paulirish/git-recent#readme
      - https://dandavison.github.io/delta/
  - id: brew:git-plus
    reason: >
      Choose git-plus when you prefer a simpler recent-branch command bundled with
      multi-repository, branch-relation, stale-branch, and semantic-version helpers
      instead of git-recent's dedicated fzf interface.
    rel: alternative
    sources:
      - https://github.com/paulirish/git-recent#readme
      - https://github.com/tkrajina/git-plus#readme
tags:
  - branches
  - cli
  - fzf
  - git
  - workflow
