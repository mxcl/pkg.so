history:
  adoption-history:
    - >
      The project was aimed at integration into office suites and document converters
      rather than direct end-user operation. Its wiki tells most people to wait for
      integration into LibreOffice, AbiWord, or Calligra, while offering console tools
      such as wps2html and wps2odt for users willing to build or script the converter
      path.
    - >
      Within the Document Liberation Project ecosystem, libwps fits the pattern of
      reverse-engineered import libraries that preserve access to documents created in
      proprietary office programs that no longer define mainstream exchange formats.
  package-nerd-significance:
    - >
      libwps is package-nerd archaeology: Microsoft Works was common on consumer PCs,
      but its formats are awkward in modern workflows. A small library package can
      decide whether an old .wps or .wks file is readable without booting a vintage
      Windows environment.
  project-history:
    - >
      The SourceForge wiki describes libwps as a Microsoft Works DOS/Windows file-format
      import filter based on librevenge. Its scope widened beyond plain Works
      word-processing files: the recognized-format list includes Works word processing,
      spreadsheet, and database files, plus Microsoft Write, Word for DOS, Pocket Word,
      XYWrite, Lotus, Multiplan, and Quattro Pro variants.
    - >
      The SourceForge file archive shows libwps 0.1.2 published on 2007-12-13, the 0.2.0
      line on 2010-11-16, the 0.3.0 line on 2014-05-23, and the 0.4.0 line on
      2015-05-17.
  related-projects:
    - >
      Related projects include LibreOffice, AbiWord, Calligra, librevenge, libwpd,
      libodfgen, and the Document Liberation Project.
  sources:
    - https://sourceforge.net/p/libwps/code/ci/master/tree/
    - https://sourceforge.net/p/libwps/wiki/Home/
    - https://sourceforge.net/projects/libwps/files/libwps/
    - https://www.documentliberation.org/about/
  summary:
    - >
      libwps is an import library for Microsoft Works and related legacy office files,
      built on librevenge and used by word processors and converters.
  timeline:
    - '2007-12-13: libwps 0.1.2 published on SourceForge.'
    - '2010-11-16: libwps 0.2.0 published on SourceForge.'
    - '2014-05-23: libwps 0.3.0 published on SourceForge.'
    - '2015-05-17: libwps 0.4.0 published on SourceForge.'
    - '2018-06-13: The project wiki notes an update to its browser-based conversion tool.'
  usage:
    - >
      Packagers ship libwps so office suites can import Works files and so command-line
      tools can convert or inspect old documents in bulk. The package is especially
      useful in migration, archival cleanup, and recovery of small-business or
      home-office documents created with Microsoft Works.
related-packages:
  - id: brew:writerperfect
    reason: >
      writerperfect adds the practical wps2odt and wks2ods conversion front ends, using
      libwps to turn Microsoft Works documents and spreadsheets into OpenDocument files
      for headless migration.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/libwpd/wiki/writerperfect/
      - https://libwpd.sourceforge.net/download.html
      - https://sourceforge.net/p/libwps/wiki/Home/
