history:
  adoption-history:
    - >
      Testimonials retained on the official site show the public beta in use by early
      2015 and emphasize its simpler interface relative to the standard Evernote Mac
      experience. The current site uses retrospective language, thanks past supporters,
      and limits downloads to previous purchasers, indicating that active commercial
      distribution has ended.
  package-nerd-significance:
    - >
      Alternote captures a period when third-party desktop clients flourished around
      Evernote's public service APIs. Its continued Homebrew Cask presence is useful for
      prior license holders, while also illustrating the packaging challenges of
      discontinued proprietary applications tied to an external cloud backend.
  project-history:
    - >
      Alternote emerged as a Mac-focused alternative interface for Evernote, emphasizing
      distraction-free writing, responsive search, typography, night mode, compact
      presentation, and limited Markdown-style expansion.
    - >
      Rather than operating its own synchronization backend, Alternote connected
      directly to Evernote. Its official FAQ explains that it was intentionally
      exclusive to Evernote and could not access local-only Evernote notebooks through
      the public interface.
  related-projects:
    - Evernote
    - Yinxiang Biji
  sources:
    - 'Input description: source_facts.description'
    - 'Official product page and FAQ: https://alternoteapp.com/'
  summary:
    - >
      Alternote is a discontinued proprietary Mac note-taking client that provided a
      focused writing interface over Evernote's synchronization backend.
  timeline:
    - >
      2015: Public beta users were discussing Alternote in testimonials preserved on the
      official site.
    - >
      Later: The official site ended general sales and retained downloads for previous
      purchasers.
  usage:
    - >
      Alternote signs into Evernote and synchronizes cloud notebooks while presenting a
      Mac-native writing interface with search, tags, selective sync, to-do lists,
      rich-text controls, and Markdown-like expansion.
    - >
      It does not support local-only Evernote notebooks, iCloud, or Dropbox. Continued
      usefulness depends on compatibility with Evernote's service and APIs.
