history:
  adoption-history:
    - >
      The official site documents distribution as a static cross-platform binary and
      through Cargo and Homebrew. Its integrations target local development, pre-commit
      hooks, GitHub Actions, Docker, and CI security scanning.
  package-nerd-significance:
    - >
      evnx combines several frequently separate package categories—dotenv editing,
      schema validation, secret scanning, format conversion, encrypted backup, and
      secret-manager migration—inside one Rust CLI.
    - >
      It is particularly relevant to package-oriented development workflows because it
      offers a dependency-light executable, machine-readable output, CI exit codes, and
      SARIF reporting.
  project-history:
    - >
      The author describes evnx as growing from an accidental `.env` exposure and the
      need for preventive tooling. The project developed into a Rust CLI covering the
      environment-file lifecycle, including initialization, validation, synchronization,
      scanning, conversion, diagnostics, and experimental cloud migration.
  related-projects:
    - >
      The official project material identifies companion repositories for evnx testing,
      a GitHub Action, Homebrew packaging, and Scoop packaging.
  sources:
    - https://github.com/urwithajit9/evnx
    - https://www.evnx.dev/
    - https://www.evnx.dev/blog/why-i-built-evnx
    - https://www.evnx.dev/guides/commands/init
  summary:
    - >
      evnx is a cross-platform Rust command-line tool for creating, validating,
      synchronizing, scanning, converting, and securing `.env` files.
  timeline:
    - >
      2024: The incident described by the author became the motivation for preventive
      `.env` tooling.
    - >
      The project expanded from environment-file management into secret scanning, CI
      integration, format conversion, encrypted backup, and cloud migration.
    - '2026: The official site documented the 0.3.x series as a cross-platform Rust CLI.'
  usage:
    - >
      Typical workflows start with `evnx init`, which creates project-local
      `.env.example` and `.env` files and updates `.gitignore`. Users can then run `evnx
      doctor`, `evnx validate`, or `evnx scan` locally or in CI.
    - >
      The tool also synchronizes `.env` with `.env.example`, converts variables to
      deployment formats such as Kubernetes or Terraform, manages values without manual
      editing, and can migrate secrets to supported services.
