history:
  adoption-history:
    - >
      VibeTunnel addresses a workflow popularized by long-running development servers
      and coding agents: checking and controlling a terminal from another computer,
      tablet, or phone. The project supports a native macOS application as well as an
      npm-distributed Linux and headless server.
    - >
      Its remote-access guidance integrates with established networking services such as
      Tailscale and ngrok rather than requiring users to construct their own SSH and
      port-forwarding setup.
  package-nerd-significance:
    - >
      VibeTunnel combines a native menu-bar application, a TypeScript/Node.js terminal
      server, a web client, and native terminal components in one open-source project.
      That cross-stack packaging makes it notable to users interested in terminal
      multiplexing, remote developer environments, and browser-delivered command-line
      interfaces.
    - >
      It is especially relevant to AI-assisted development because users can watch and
      interact with long-running command-line agents from mobile browsers while
      retaining access to the underlying shell.
  project-history:
    - >
      VibeTunnel was created by a small group of open-source developers, including Mario
      Zechner, Armin Ronacher, and Peter Steinberger, as a browser-based way to expose
      and control terminal sessions. It developed native macOS and web-server components
      and later documented Linux and headless deployment.
    - >
      The project uses a public repository, an MIT license, a dedicated documentation
      site, and a release process for both the macOS application and npm package.
  related-projects:
    - >
      Tailscale, ngrok, Cloudflare Tunnel, Pinggy, and Pangolin, which can provide
      remote network reachability.
    - asciinema, whose format VibeTunnel uses for terminal session recordings.
    - ghostty-web, used by the browser terminal frontend.
  sources:
    - 'Official documentation: https://docs.vibetunnel.sh/docs/introduction'
    - 'Official homepage: https://vibetunnel.sh/'
    - 'Official repository README: https://github.com/amantus-ai/vibetunnel#readme'
  summary:
    - >
      VibeTunnel is an open-source terminal-sharing system that proxies terminal
      sessions into a web browser. It offers a native macOS controller, a Node.js
      server, a responsive web frontend, and Linux or headless operation.
  timeline:
    - '2024: The documented beta release series was underway.'
    - >
      2025: The project documented macOS, Linux, and headless installation and
      deployment workflows.
    - >
      2026: Development continued across macOS, iOS, web, authentication, and
      remote-tunnel integrations.
  usage:
    - >
      On macOS, users launch the menu-bar application and open its local or remotely
      exposed browser URL. Linux and headless users can install the npm package, run
      `vibetunnel-server`, and connect to the default local service on port 4020.
    - >
      Remote access can be placed behind Tailscale, ngrok, Cloudflare Tunnel, Pinggy, or
      Pangolin. Authentication options include operating-system accounts,
      environment-provided credentials, Ed25519 SSH authorized keys, and an explicitly
      unsafe no-auth mode for trusted environments.
    - >
      The server persists its generated JWT signing secret at
      `~/.vibetunnel/jwt-secret`. SSH-key authentication reads `~/.ssh/authorized_keys`;
      some macOS integration secrets are instead held in Keychain and therefore have no
      filesystem credential path.
