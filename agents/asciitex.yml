config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      asciiTeX appears to have stayed niche: the input facts list only Homebrew
      packaging, and the official site focuses on SourceForge downloads,
      build-from-source instructions, and a Windows installer. Its adoption story is
      therefore less about ecosystem ubiquity and more about preserving a small utility
      for ASCII math rendering.
  package-nerd-significance:
    - >
      asciiTeX is a good example of the long tail in package managers: a dormant
      SourceForge-era C/GTK utility remains useful enough to package because it solves a
      specific text-only problem and has no modern service dependency.
  project-history:
    - >
      The official homepage describes asciiTeX as an ASCII equation renderer released
      under the GPL. It says the project is a fork of eqascii, adding new features and
      many bug fixes, and it documents both a GTK graphical interface and a command-line
      program named `asciiTeX`.
    - >
      The same official page now carries a maintenance note saying asciiTeX is not
      maintained and points users to two successor paths: a fork at larseggert/asciiTeX
      and the original author's newer libtexprintf/utftex work for monospace TeX-like
      math formatting with Unicode support.
  related-projects:
    - eqascii is the project asciiTeX forked from.
    - larseggert/asciiTeX is listed by the official homepage as an updated fork.
    - libtexprintf and utftex are listed by the original author as newer alternatives.
  sources:
    - https://asciitex.sourceforge.net/
    - https://sourceforge.net/p/asciitex/code/
    - https://sourceforge.net/projects/asciitex/files/
    - source_facts.package-manager
  summary:
    - >
      asciiTeX is an ASCII equation renderer for producing plain-text mathematical
      notation with LaTeX-like syntax. It is historically interesting as a small
      scientific/terminal utility for email, source comments, and other contexts where
      rendered images or Unicode math are inconvenient.
  timeline:
    - >
      SourceForge era: asciiTeX published as a GPL fork of eqascii with command-line and
      GTK interfaces.
    - >
      Current official homepage: project marked unmaintained and successor/fork links
      documented.
  usage:
    - >
      The command-line form accepts equations directly or from a file: `asciiTeX [-v]
      [-h] [-f file] [-ll line-length] [equation]`. It supports LaTeX-like constructs
      such as fractions, superscripts, subscripts, roots, sums, products, integrals,
      braces, arrows, limits, and overlines, then emits fixed-width ASCII output.
related-packages:
  - id: brew:utftex
    reason: >
      Choose utftex for Unicode mathematical output and broader TeX-like syntax;
      asciiTeX's official homepage recommends the same author's libtexprintf/utftex work
      as its modern successor.
    rel: alternative
    sources:
      - https://asciitex.sourceforge.net/
      - https://github.com/bartp5/libtexprintf
