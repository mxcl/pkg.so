history:
  adoption-history:
    - >
      Feed The Beast grew around curated modded-Minecraft packs and community
      infrastructure. The official app became the supported distribution point for FTB
      packs and later also gained discovery and management support for CurseForge packs.
  package-nerd-significance:
    - >
      Modpack launchers sit between game package managers and desktop clients: they
      resolve large collections of mods, preserve separate instances and versions,
      obtain supporting libraries, and manage the Java runtime environment needed to
      launch Minecraft. Packaging the FTB App as a Homebrew cask makes the launcher
      itself reproducible even though its managed game content remains
      application-controlled.
  project-history:
    - >
      Feed The Beast's official forum opened in August 2012 for discussion of its mod
      pack, map pack, texture packs, servers, and related community activity. The
      present Electron-based FTB App continues that distribution role as the officially
      supported installer and instance manager for FTB modpacks.
    - >
      The current app's published changelog begins with version 1.0.0 in January 2022.
      Subsequent releases added richer instance management, integrated support and
      changelog views, Linux packaging, and major internal framework updates.
  related-projects:
    - Minecraft
    - CurseForge
    - Minecraft Forge
    - Fabric
    - Java
  sources:
    - https://forum.feed-the-beast.com/threads/welcome-to-the-forums.2/
    - https://www.feed-the-beast.com/ftb-app
    - https://www.feed-the-beast.com/ftb-app/changes
  summary:
    - >
      FTB App is Feed The Beast's official desktop launcher for finding, installing,
      creating, updating, and managing modded-Minecraft packs and isolated game
      instances.
  timeline:
    - >
      2012: Official Feed The Beast community forum opened around the FTB mod pack and
      map pack.
    - '2022: FTB App 1.0.0 appears in the official changelog.'
    - >
      2023: The 1.5 series added an integrated support section and further launcher
      reliability work.
    - >
      2025: Version 1.28 moved major portions of the app from Vue 2 to Vue 3 and
      introduced official Flatpak releases.
  usage:
    - >
      Players search for FTB or CurseForge packs, install one or more versions, tune
      instance settings such as memory, and launch the selected Minecraft environment.
      Pack creators can assemble packs by adding or removing mods and share their
      creations.
