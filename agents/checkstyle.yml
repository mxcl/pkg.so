history:
  adoption-history:
    - >
      Checkstyle is distributed through GitHub releases and Maven Central according to
      the official README and website. The batch metadata also lists Homebrew, Debian,
      Ubuntu, MacPorts, and Nix, reflecting its role as both a Java build dependency and
      a standalone command-line tool.
    - >
      The README points users to Maven artifacts, command-line usage, configuration
      documentation, discussions, Stack Overflow, Google Groups, and contributor
      channels, evidence of a mature tool with both user and maintainer communities.
  package-nerd-significance:
    - >
      Package nerds care about Checkstyle because it is a durable example of a Java
      quality tool that lives simultaneously in Maven Central, binary release pages,
      system package managers, and build plugins. It predates many modern linter
      ecosystems while still shipping frequent releases.
    - >
      Its configuration model is also historically important: a tree of modules rooted
      at Checker, XML DTD/XSD validation, and style configuration files made it flexible
      enough for many organizations before language-server and formatter-first workflows
      became common.
  project-history:
    - >
      The official site describes Checkstyle as a development tool that helps
      programmers write Java code adhering to a coding standard and automates checking
      tasks that would otherwise be manual. It is highly configurable and ships example
      configurations for Sun Code Conventions and Google Java Style.
    - >
      The current GitHub repository was created in 2013, but the official site footer
      and release-note history identify the project as dating back to 2001. Modern
      releases continue under the checkstyle/checkstyle GitHub organization, with 13.7.0
      published in June 2026.
  related-projects:
    - >
      Maven and the Maven Checkstyle Plugin are central distribution and
      build-integration paths.
    - >
      ANTLR, Apache Commons, Guava, and Picocli are libraries listed by the project;
      Google Java Style, Sun Code Conventions, and OpenJDK style are major configuration
      targets.
  sources:
    - https://checkstyle.org/
    - https://checkstyle.org/cmdline.html
    - https://checkstyle.org/config.html
    - https://checkstyle.org/releasenotes.html
    - https://github.com/checkstyle/checkstyle
  summary:
    - >
      Checkstyle is a long-running Java code-quality tool for checking source code
      against coding standards. It is one of the classic packaged Java developer tools:
      available as a command-line jar, Maven artifact, build-tool integration, and
      operating-system package.
  timeline:
    - '2001: Checkstyle project history begins, according to the official site copyright range.'
    - '2013: checkstyle/checkstyle GitHub repository created.'
    - '2026: Checkstyle 13.7.0 released and official site published for version 13.7.0.'
  usage:
    - >
      Typical command-line usage runs java -jar checkstyle-*-all.jar with a required
      configuration XML file and one or more files or folders. The official docs
      describe plain, XML, and SARIF output and the -c option for choosing the
      configuration.
    - >
      In build systems, Checkstyle is commonly used through Maven or other Java build
      integrations to enforce project, company, Google, Sun, OpenJDK, or custom style
      rules.
related-packages:
  - id: brew:pmd
    reason: >
      Choose PMD when you need broader AST-based source analysis or copy-paste
      detection; Checkstyle is more focused on configurable Java coding conventions and
      formatting rules.
    rel: alternative
    sources:
      - https://checkstyle.org/
      - https://pmd.github.io/
  - id: brew:spotbugs
    reason: >
      Use SpotBugs alongside Checkstyle to inspect compiled Java bytecode for bug
      patterns while Checkstyle enforces source-level conventions.
    rel: adjacent_workflow
    sources:
      - https://checkstyle.org/
      - https://spotbugs.github.io/
