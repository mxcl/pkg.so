history:
  adoption-history:
    - >
      Free Download Manager expanded beyond its original Windows audience to macOS,
      Linux, and Android. Its official site reports more than 180 million users and
      availability in 24 languages.
  package-nerd-significance:
    - >
      FDM represents the graphical, browser-integrated branch of download-manager
      culture. It combines features commonly split among command-line downloaders,
      scheduling tools, and BitTorrent clients in one desktop application.
  project-history:
    - >
      Free Download Manager has been developed since 2004. Earlier generations were
      released as open-source software, while the current product is distributed and
      maintained by SoftDeluxe through its official site.
    - >
      The long-running official changelog documents continuing development across
      browser integration, segmented downloads, scheduling, torrent handling, platform
      support, and user-interface revisions.
  related-projects:
    - >
      Related tool categories include command-line downloaders such as curl and wget,
      graphical download accelerators, and dedicated BitTorrent clients.
  sources:
    - https://www.freedownloadmanager.org/
    - https://www.freedownloadmanager.org/about.htm
    - https://www.freedownloadmanager.org/changelog.htm
  summary:
    - >
      Free Download Manager is a cross-platform graphical download manager from
      SoftDeluxe. It manages ordinary file transfers and BitTorrent downloads while
      providing acceleration, scheduling, browser integration, and bandwidth controls.
  timeline:
    - '2004: Free Download Manager 1.0 was released.'
    - '2007: The project published source code under the GNU GPL.'
    - '2016: The 5.x generation supported both Windows and macOS.'
    - '2020: An official Linux edition joined the supported platforms.'
  usage:
    - >
      Users add downloads from the application or a browser, organize them in a queue,
      and apply schedules, speed limits, traffic controls, and file-management rules.
      The same interface can handle direct downloads and torrents.
