id: brew:dockerfile-language-server
display-name: Dockerfile Language Server
repo: https://github.com/rcjsuen/dockerfile-language-server
docs:
  - https://github.com/rcjsuen/dockerfile-language-server#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project's adoption is more important through editor integrations than through
      direct command-line use. Its README lists users including Microsoft's VS Code
      Docker extension, Sublime LSP Dockerfile support, Zed Dockerfile support,
      atom-ide-docker, Sourcegraph, Theia, and Emacs lsp-mode.
    - >
      Homebrew packages it as `dockerfile-language-server`, giving non-npm
      package-manager users a direct install path for `docker-langserver`. The Homebrew
      formula API reported stable version 0.15.0, 43 installs in the previous 30 days,
      and 1,436 installs in the previous year as of June 30, 2026.
  package-nerd-significance:
    - >
      This package matters because it turns Dockerfile editing support into a reusable
      protocol server instead of one editor plugin per editor. For package managers, the
      interesting boundary is the small `docker-langserver` executable that bridges
      Homebrew, npm, Docker images, and LSP-capable editors.
  project-history:
    - >
      The GitHub repository was created in June 2017, soon after the Language Server
      Protocol had become the common way to share editor intelligence across IDEs. The
      README is explicit that this repository is the server launcher and LSP-facing
      layer, while Dockerfile analysis lives in sibling libraries such as
      `dockerfile-ast`, `dockerfile-language-service`, and `dockerfile-utils`.
    - >
      The npm package `dockerfile-language-server-nodejs` was first published in July
      2017 and reached version 0.15.0 in October 2025. GitHub releases show a v0.0.24
      release in June 2020, while tags and npm metadata show later maintenance
      continuing through the 0.15.x line.
  related-projects:
    - >
      The server delegates Dockerfile parsing and feature logic to `dockerfile-ast`,
      `dockerfile-language-service`, and `dockerfile-utils`.
    - >
      Downstream integrations listed by the README include VS Code Docker, Sublime LSP
      Dockerfile, Zed, atom-ide-docker, Sourcegraph, Theia, and Emacs lsp-mode.
  sources:
    - https://github.com/rcjsuen/dockerfile-language-server#readme
    - https://api.github.com/repos/rcjsuen/dockerfile-language-server
    - https://registry.npmjs.org/dockerfile-language-server-nodejs
    - https://github.com/rcjsuen/dockerfile-language-server/releases/tag/v0.0.24
    - https://formulae.brew.sh/api/formula/dockerfile-language-server.json
  summary:
    - >
      Dockerfile Language Server is Ryan C. J. Suen's TypeScript/Node.js language-server
      wrapper for Dockerfile editor features. It packages Dockerfile parsing,
      diagnostics, completion, hover, formatting, rename, document symbols, semantic
      highlighting, and other LSP capabilities behind the `docker-langserver`
      executable.
  timeline:
    - >
      2017: GitHub repository created and npm package
      `dockerfile-language-server-nodejs` first published.
    - '2020: GitHub release v0.0.24 published.'
    - '2025: npm metadata records the 0.15.0 package version.'
    - '2026: Homebrew formula API reports stable 0.15.0.'
  usage:
    - >
      Users install the Node package or Homebrew formula, then run `docker-langserver`
      over Node IPC, stdio, or a socket so an editor or language-server client can speak
      LSP to it. The README also documents Docker image usage under
      `rcjsuen/docker-langserver`.
related-packages:
  - id: brew:docker-language-server
    reason: >
      Choose Docker Language Server for Docker-maintained support spanning Dockerfiles,
      Compose, and Bake; choose Dockerfile Language Server for the established Node.js
      server used by numerous editor integrations.
    rel: alternative
    sources:
      - https://github.com/rcjsuen/dockerfile-language-server#readme
      - https://github.com/docker/docker-language-server#readme
