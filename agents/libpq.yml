provenance:
  category-sources:
    - >
      source_facts.description says libpq is the Postgres C API library; official
      PostgreSQL docs describe libpq as the C application programmer's interface.
  display-name-sources:
    - source_facts.name is libpq; official PostgreSQL documentation chapter is titled libpq.
  docs-sources:
    - >
      source_facts.homepage points to the official PostgreSQL libpq documentation;
      official docs page is dedicated to libpq.
  history-sources:
    - https://formulae.brew.sh/formula/libpq
    - https://www.postgresql.org/about/news/postgresql-16-released-2715/
    - https://www.postgresql.org/about/press/presskit17/
    - https://www.postgresql.org/docs/current/history.html
    - https://www.postgresql.org/docs/current/libpq.html
    - https://www.postgresql.org/support/versioning/
  repo-sources:
    - >
      source_facts.repo is empty; official PostgreSQL documentation says to clone the
      official Git mirror from https://git.postgresql.org/git/postgresql.git.
  tags-sources:
    - >
      source_facts.description names the Postgres C API library; official docs identify
      libpq as the PostgreSQL C client interface.
