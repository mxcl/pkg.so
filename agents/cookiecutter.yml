id: brew:cookiecutter
display-name: Cookiecutter
repo: https://github.com/cookiecutter/cookiecutter
docs:
  - https://cookiecutter.readthedocs.io/en/stable
config-file-location:
  unix:
    - ~/.cookiecutterrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Cookiecutter spread through reusable Git-hosted templates, especially Python
      package templates such as `cookiecutter-pypackage`. Its package metadata in this
      batch records broad distribution across Homebrew, Debian, Ubuntu, Nix, Scoop, and
      openSUSE packaging channels.
  package-nerd-significance:
    - >
      Cookiecutter matters to package maintainers because it normalized sharable
      scaffolds as packages and repositories, making packaging policy, test layout,
      license files, CI skeletons, and release boilerplate reproducible across many new
      projects.
  project-history:
    - >
      The official repository was created in July 2013. The README credits Audrey M. Roy
      Greenfeld as creator and development lead, and describes the tool as a
      command-line utility for creating projects from cookiecutters, or project
      templates.
  related-projects:
    - >
      Official examples and README links point users to cookiecutter-pypackage,
      cookiecutter-django, cookiecutter-pytest-plugin, and other community templates.
  sources:
    - https://github.com/cookiecutter/cookiecutter
    - https://raw.githubusercontent.com/cookiecutter/cookiecutter/main/README.md
    - https://cookiecutter.readthedocs.io/en/stable/advanced/user_config.html
    - https://api.github.com/repos/cookiecutter/cookiecutter
  summary:
    - >
      Cookiecutter is a cross-platform project generator for creating source trees from
      templates. It became one of the standard Python-era answers to repeatable project
      scaffolding, but its templates can target many languages and markup formats.
  timeline:
    - '2013: Official GitHub repository created.'
    - '2013: Documentation copyright begins with Audrey M. Roy Greenfeld.'
    - '2013: User configuration support documented as new in Cookiecutter 0.7.'
    - '2016: Command-line `--config-file` support documented as new in Cookiecutter 1.3.'
  usage:
    - >
      Users invoke Cookiecutter against a local template or a remote repository, answer
      prompts from `cookiecutter.json`, and receive a rendered project directory.
      Advanced usage includes hooks, replay data, default context, abbreviations for
      common hosts, and a per-user `~/.cookiecutterrc` file.
related-packages:
  - id: brew:copier
    reason: >
      Copier is an alternative project-template engine to choose when first-class
      updating of an already generated project from an evolving template is a central
      requirement.
    rel: alternative
    sources:
      - https://cookiecutter.readthedocs.io/en/stable/
      - https://copier.readthedocs.io/en/stable/
  - id: brew:cruft
    reason: >
      cruft extends Cookiecutter-based workflows by recording template provenance and
      checking, diffing, or applying template updates after initial project generation.
    rel: adjacent_workflow
    sources:
      - https://cruft.github.io/cruft/
      - https://github.com/cookiecutter/cookiecutter
