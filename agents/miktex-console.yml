config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MiKTeX became especially associated with accessible TeX use on Windows. The
      project now also supports macOS and Linux, while MiKTeX Console provides a
      graphical maintenance surface.
    - >
      The supplied package-manager facts show that the macOS application is distributed
      as the Homebrew cask miktex-console.
  package-nerd-significance:
    - >
      MiKTeX is notable for integrating package management into a TeX distribution. Its
      “Just enough TeX” model can install missing LaTeX packages and fonts as documents
      require them, contrasting with installations that begin with a largely complete
      TeX tree.
    - >
      MiKTeX Console exposes package updates and installation maintenance through a
      desktop interface, making the cask useful as both a typesetting environment and a
      package-management frontend.
  project-history:
    - >
      Christian Schenk is responsible for the MiKTeX project. Official source headers
      trace core MiKTeX code to 1996.
    - >
      MiKTeX developed into an open-source, cross-platform implementation of TeX and
      related programs with its own package repository, setup tooling, and integrated
      package manager.
  related-projects:
    - TeX and LaTeX provide the underlying typesetting ecosystem.
    - TeXworks is bundled as an editor and document-preview frontend.
    - TeX Live is a separate TeX distribution serving many of the same workflows.
  sources:
    - https://docs.miktex.org/
    - https://github.com/MiKTeX/miktex
    - https://miktex.org/Home/About
    - https://miktex.org/impressum
    - source_facts.package-manager
  summary:
    - >
      MiKTeX is an open-source TeX/LaTeX distribution maintained by Christian Schenk. It
      combines TeX engines, formats, fonts, utilities, and a package manager; MiKTeX
      Console is its graphical configuration and update application.
  timeline:
    - >
      1996: Copyright dates in official MiKTeX core sources show the project was
      underway by this year.
    - '2015: The project announced its command-line MiKTeX Setup Utility.'
    - '2020: MiKTeX adopted date-based release versioning.'
    - '2021: MiKTeX Console added a package-documentation browser.'
  usage:
    - >
      Users install MiKTeX to compile TeX and LaTeX documents, then use MiKTeX Console
      to install updates, manage packages, select repositories, and perform maintenance
      such as refreshing the file-name database.
    - >
      MiKTeX can automatically retrieve missing components during document compilation,
      allowing a smaller initial installation.
