id: brew:gnutls
display-name: GnuTLS
repo: https://gitlab.com/gnutls/gnutls
docs:
  - https://gnutls.org/manual/gnutls.html
  - https://gnutls.org/reference
config-file-location:
  unix:
    - /etc/gnutls/config
credentials-file-location: null
history:
  adoption-history:
    - >
      GnuTLS found adoption where applications needed a GNU-maintained TLS
      implementation that could be shipped broadly by distributions. Package managers
      carry it not only for the user-facing commands but also because other software
      links against libgnutls for HTTPS, mail, directory services, and other encrypted
      protocols.
    - >
      The library's ecosystem significance comes from being a stack component rather
      than a stand-alone application. Many users meet it indirectly through
      dependencies, while administrators and developers use the command-line tools to
      debug handshakes, inspect certificates, test servers, and work with PKCS#11
      tokens.
  package-nerd-significance:
    - >
      GnuTLS is one of the packages that turns TLS from a browser feature into ordinary
      Unix plumbing. It sits in dependency graphs, exposes inspection tools for humans,
      and gives source-built software a distribution-provided cryptographic backend.
  project-history:
    - >
      GnuTLS emerged inside the GNU ecosystem as a portable C implementation of the SSL,
      TLS, and DTLS protocol families. The manual presents it as a library meant to hide
      protocol complexity behind an API while still exposing certificate handling, key
      exchange, session management, and authentication choices to applications.
    - >
      The project developed alongside changes in TLS itself. It added protocol support,
      X.509 and OpenPGP certificate features, PKCS#11 work, command-line tools such as
      certtool and gnutls-cli, and library interfaces for both application developers
      and system integrators. Its GitLab project became the official source-control and
      issue-tracking home.
  related-projects:
    - libtasn1 and nettle are important lower-level libraries in the GnuTLS stack.
    - >
      PKCS#11 providers and smart-card tooling integrate with GnuTLS through p11tool and
      library support.
    - Applications that link against libgnutls form the main adoption surface for the package.
  sources:
    - https://gitlab.com/gnutls/gnutls
    - https://gnutls.org/
    - https://gnutls.org/manual/gnutls.html
    - https://gnutls.org/reference
    - https://lists.gnupg.org/pipermail/gnutls-devel/2013-May/006176.html
    - https://lists.gnupg.org/pipermail/gnutls-help/2003-October/000001.html
  summary:
    - >
      GnuTLS is the GNU Project's TLS library and tool suite for encrypted network
      protocols. It is packaged both as a developer library and as a set of diagnostic
      and certificate-management commands, which makes it important to operating-system
      distributions, network applications, and administrators who need scriptable TLS
      tooling.
  timeline:
    - '2003: GnuTLS 1.0.0 marked an early stable release line.'
    - '2011: GnuTLS 3.0 introduced a major branch with expanded TLS support.'
    - >
      2013: GnuTLS 3.1.10 changed the library licensing to LGPLv2.1 or later for wider
      linking compatibility.
    - '2020s: GitLab served as the official repository and issue-tracking home.'
  usage:
    - >
      Practitioners use libgnutls in applications that need TLS or DTLS support, and use
      gnutls-cli, gnutls-serv, gnutls-cli-debug, certtool, ocsptool, p11tool, and
      psktool for testing and certificate workflows. The manual also covers
      authentication choices, priority strings, session tickets, certificate
      credentials, and integration patterns.
    - >
      In package-manager culture, installing GnuTLS often satisfies both build-time
      library requirements and operational tooling needs. It is a small command-line
      surface on top of a security-sensitive shared library, so maintainers care about
      ABI stability, protocol defaults, and timely security updates.
related-packages:
  - id: brew:nettle
    reason: >
      Nettle supplies the cryptographic primitives used by GnuTLS's documented
      cryptographic backend.
    rel: adjacent_workflow
    sources:
      - https://www.gnutls.org/manual/gnutls.html
      - https://www.lysator.liu.se/~nisse/nettle/
  - id: brew:libtasn1
    reason: >
      Libtasn1 provides the ASN.1 and DER functionality that GnuTLS uses for certificate
      and protocol data structures.
    rel: adjacent_workflow
    sources:
      - https://www.gnutls.org/manual/gnutls.html
      - https://www.gnu.org/software/libtasn1/
  - id: brew:p11-kit
    reason: >
      p11-kit can provide GnuTLS with configured PKCS #11 modules and a system
      trust-policy module for smart cards, HSMs, and shared certificate trust.
    rel: adjacent_workflow
    sources:
      - https://www.gnutls.org/manual/gnutls.html
      - https://p11-glue.github.io/p11-glue/p11-kit/manual/
  - id: brew:openssl@3
    reason: >
      Choose OpenSSL 3 as an alternative general-purpose TLS and cryptography stack when
      software targets OpenSSL's native APIs or provider architecture; GnuTLS only
      offers a limited compatibility layer.
    rel: alternative
    sources:
      - https://www.gnutls.org/manual/gnutls.html
      - https://docs.openssl.org/3.0/man7/migration_guide/
