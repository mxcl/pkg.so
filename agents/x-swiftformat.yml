id: cask:x-swiftformat
display-name: X-SwiftFormat
repo: null
docs:
  - https://github.com/ruiaureliano/X-SwiftFormat/blob/main/DOCS.md
  - https://github.com/swiftlang/swift-format/blob/main/Documentation/Configuration.md
  - https://github.com/ruiaureliano/X-SwiftFormat#readme
config-file-location:
  unix:
    - .swift-format
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation from GitHub and through Homebrew Cask.
      The host application exposes formatter settings and an Xcode Source Editor
      command, while later releases added multiple named configuration environments for
      developers working across projects.
  package-nerd-significance:
    - >
      X-SwiftFormat packages Apple's swift-format engine and SwiftSyntax-based
      formatting in a native Xcode extension. It is a useful example of command-line
      formatting infrastructure being exposed through macOS extension controls while
      retaining a portable, repository-friendly JSON configuration format.
  project-history:
    - >
      Rui Aureliano created X-SwiftFormat as an Xcode extension built on Apple's
      swift-format and SwiftSyntax projects. The initial published release series
      targeted Xcode 12 and Swift 5.3.
    - >
      Subsequent releases tracked Xcode and Swift toolchain changes. Version 1.1 added
      multiple configuration environments, and the 2.x series moved to Xcode 15 and
      newer Swift releases.
  related-projects:
    - swift-format
    - SwiftSyntax
    - Swift
    - Xcode
  sources:
    - https://github.com/ruiaureliano/X-SwiftFormat
    - https://github.com/ruiaureliano/X-SwiftFormat/blob/main/DOCS.md
    - https://github.com/ruiaureliano/X-SwiftFormat/releases
    - https://github.com/swiftlang/swift-format
  summary:
    - >
      X-SwiftFormat is a macOS host application and Xcode Source Editor extension for
      formatting Swift code with Apple's swift-format technology.
  timeline:
    - '2020: The 1.0.x release series targeted Xcode 12 and Swift 5.3.'
    - '2020: Version 1.1 added multiple configuration environments.'
    - '2022: Versions 1.2 and 1.3 tracked Xcode 13.4 and Xcode 14.'
    - '2023: Version 2.0 adopted Xcode 15 and Swift 5.9.'
  usage:
    - >
      Users launch the host application once, enable its Xcode Source Editor extension
      in macOS settings, and invoke Format Swift Code from Xcode's Editor menu. The
      application also previews formatting and manages rules and named environments.
    - >
      X-SwiftFormat can export a `.swift-format` JSON configuration. The underlying
      formatter searches for that filename beside a Swift source file and then in parent
      directories, making a repository root a conventional location. No credentials are
      required.
