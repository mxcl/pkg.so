config-file-location:
  macos:
    - ~/Library/Application Support/coing.ClockifyDesktop/default.realm
    - ~/Library/Application Support/coing.ClockifyDesktop/default.realm.lock
credentials-file-location: null
history:
  adoption-history:
    - >
      Clockify's free, workspace-based offering and availability on the web, desktop,
      mobile, and browser extensions helped it spread among individuals and teams.
      CAKE.com's official history records one million registered users in 2019, two
      years after launch.
  package-nerd-significance:
    - >
      Clockify is a useful example of a service-backed desktop package: the cask
      installs a native client, while accounts, workspaces, shared time entries, and
      reporting are coordinated by the hosted service. Its local Realm files support the
      client but are not a portable substitute for service data.
  project-history:
    - >
      CAKE.com, then known as COING, developed and launched Clockify in 2017 as its
      first product. The product grew from time tracking into a broader work-hours
      platform, and in 2023 it became part of the CAKE.com productivity-suite brand
      alongside Pumble and Plaky.
  related-projects:
    - >
      Pumble and Plaky are sister products in the CAKE.com suite. Toggl Track, Harvest,
      and Kimai address related time-tracking workflows.
  sources:
    - 'Official CAKE.com company history: https://cake.com/about'
    - 'Official Clockify Help Center: https://clockify.me/help/'
    - 'Official Clockify homepage: https://clockify.me/'
  summary:
    - >
      Clockify is CAKE.com's hosted time tracker and timesheet application for recording
      work hours across projects. It provides timer, timesheet, calendar, reporting,
      attendance, and activity features through web and client applications.
  timeline:
    - '2017: COING developed and launched Clockify.'
    - '2019: Clockify reached one million registered users.'
    - >
      2023: The parent company rebranded from COING to CAKE.com and grouped Clockify
      into its productivity suite.
  usage:
    - >
      Users create or join a workspace, organize work by project and task, then record
      time with a timer or manual timesheet. Reports group and filter entries for
      analysis, export, billing, attendance, or team oversight.
