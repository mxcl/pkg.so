history:
  adoption-history:
    - >
      Fork began as a macOS client and later added a Windows edition. Continuous
      releases expanded it from core staging and history views into a broad desktop Git
      environment with interactive rebase, conflict resolution, Git LFS, submodules,
      worktrees, hosting-service accounts, custom commands, and repository-management
      tools.
  package-nerd-significance:
    - >
      Fork is representative of polished proprietary Git clients distributed through
      native application package managers. It appeals to developers who want Git's
      underlying workflows and command interoperability while preferring visual commit
      graphs, selective staging, integrated diffs, and guided history rewriting.
  project-history:
    - >
      The official release history records the product under the temporary name
      GitClient before it adopted the name Fork in April 2016. Early 2016 builds
      established its repository sidebar, commit graph, working-directory views,
      staging, branching, merging, and a native macOS installer. The developers describe
      Fork as a family-built product that became their full-time work.
  related-projects:
    - >
      Fork operates on standard Git repositories and integrates with hosting services
      such as GitHub, GitLab, and Bitbucket, as well as Git LFS, Git-flow, external
      editors, terminals, and diff tools.
  sources:
    - 'Official Windows release notes: https://fork.dev/releasenoteswin'
    - 'Official blog: https://fork.dev/blog/'
    - 'Official homepage: https://fork.dev/'
    - 'Official macOS release notes: https://fork.dev/releasenotes'
  summary:
    - >
      Fork is a commercial graphical Git client for macOS and Windows focused on
      repository management, history inspection, diffs, staging, rebasing, and conflict
      resolution.
  timeline:
    - '2016: The project adopts the name Fork and publishes its early macOS builds.'
    - >
      2017: Fork adds Git LFS, Git-hosting integrations, SSH-key management, and other
      advanced workflows.
    - '2018: The Windows client develops into a full-featured counterpart.'
    - '2024: Fork adds native worktree management to its macOS release line.'
  usage:
    - >
      Developers use Fork to clone or open repositories, inspect commit graphs, stage
      individual changes, create commits and branches, fetch and push, rebase
      interactively, resolve conflicts, inspect blame and file history, manage stashes
      and worktrees, and recover commits through reflog.
