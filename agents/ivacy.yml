history:
  adoption-history:
    - >
      Ivacy expanded from a consumer VPN service into a multi-platform product with
      native applications, browser extensions, router instructions, and manual
      connection guides. Its official history highlights partnerships and a large
      international server footprint as parts of its consumer adoption strategy.
    - >
      The service later evolved into “Ivacy Powered by PureVPN.” Existing subscriptions
      and credentials were carried into PureVPN, while new Ivacy subscriptions ceased to
      be sold.
  package-nerd-significance:
    - >
      The Ivacy cask represents the package-manager pattern for proprietary
      hosted-service clients: Homebrew installs the macOS application, but accounts,
      subscriptions, servers, and authentication remain vendor-managed.
    - >
      Its PureVPN transition illustrates how desktop packages tied to online services
      can outlive a product’s independent commercial identity or require migration when
      vendors consolidate.
  project-history:
    - >
      Ivacy says it began in 2007 when two founders envisioned a consumer privacy
      service. The company credits itself with adding split tunneling in 2010 and
      subsequently produced VPN software and setup material for a wide range of
      platforms.
    - >
      Ivacy later became Ivacy Powered by PureVPN. The official migration page says
      existing plans, add-ons, credentials, and renewal preferences are handled through
      PureVPN, while future purchases are made there.
  related-projects:
    - PureVPN is the service now handling Ivacy subscriptions and account migration.
    - >
      Ivacy’s official setup material covers OpenVPN and WireGuard workflows in addition
      to its native applications.
  sources:
    - https://support.ivacy.com/
    - https://support.ivacy.com/setup-guide/
    - https://www.ivacy.com/
    - https://www.ivacy.com/about-us/
  summary:
    - >
      Ivacy VPN is a consumer VPN brand launched in 2007 and now operated as Ivacy
      Powered by PureVPN. It supplied native clients and setup guides for desktop,
      mobile, browser, router, and entertainment-device environments.
  timeline:
    - '2007: Ivacy says the VPN service began.'
    - '2010: Ivacy says it introduced split tunneling.'
    - '2021: Ivacy discontinued support for PPTP, L2TP, and SSTP.'
    - >
      By 2026: Ivacy had evolved into Ivacy Powered by PureVPN, with new subscriptions
      handled by PureVPN.
  usage:
    - >
      Users historically installed the Ivacy application, authenticated with an Ivacy
      subscription, selected a VPN location or use case, and connected through the
      graphical client. Official documentation also covers manual and router
      configurations.
    - >
      Existing customers can use their Ivacy credentials during the PureVPN transition.
      No official standalone credentials-file or application configuration-file location
      is documented.
