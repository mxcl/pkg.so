history:
  adoption-history:
    - >
      Neodisk is distributed as a downloadable macOS application and through the
      Homebrew cask documented by both its official site and README.
    - >
      The project is free software under GPL-3.0-or-later. Its public repository accepts
      issues and contributions, while packaged releases provide a conventional
      drag-to-Applications installation.
  package-nerd-significance:
    - >
      Neodisk combines the two visual idioms commonly associated with graphical disk
      analyzers—treemaps and sunbursts—while intentionally refusing to delete or modify
      files. Cleanup decisions remain in Finder.
    - >
      It is notable to package enthusiasts as a native Swift, open-source macOS
      alternative in a category populated by Disk Inventory X, GrandPerspective,
      DaisyDisk, and related tools. Its README openly documents these design influences
      and the Radix-derived scanning engine.
  project-history:
    - >
      Neodisk was developed as a read-only macOS disk-space visualizer built around the
      NeodiskKit scanning engine. The engine and data model derive from Colin Kim's
      Radix project, with attribution retained in the license.
    - >
      The interface drew on earlier cushion-treemap and sunburst disk analyzers. The
      project subsequently added persistent scan snapshots, change comparison, duplicate
      detection, file-age visualization, cloud-drive scanning, multilingual support, and
      automatic updates.
  related-projects:
    - Radix, the source of the derived scan engine and core data model
    - >
      Disk Inventory X and GrandPerspective, cited inspirations for cushion-treemap
      presentation
    - DaisyDisk and SquirrelDisk, cited inspirations for sunburst presentation
  sources:
    - https://github.com/tkslucas/Neodisk#readme
    - https://neodisk.app/
    - https://neodisk.app/privacy
    - source_facts.package-manager
  summary:
    - >
      Neodisk is a free, open-source, read-only macOS disk-space visualizer. It scans
      local disks and optional cloud drives and presents their usage through treemap,
      flat, and sunburst views.
  timeline:
    - 'Initial design: Built as a native macOS visualizer on the NeodiskKit scan engine'
    - >
      Later development: Added snapshots, change tracking, duplicate detection, and
      cloud-drive scanning
  usage:
    - >
      Scan a volume or folder, navigate its space usage visually, search the scan,
      inspect large or duplicate files, and reveal selected items in Finder.
    - >
      Neodisk deliberately provides no delete action. Its only file actions are Reveal
      in Finder, Open, and Copy Path, leaving destructive cleanup to Finder.
    - >
      Optional Google Drive scanning reads metadata only. The official privacy page
      states that tokens are held in the macOS Keychain and cached scan data is deleted
      when the user signs out.
