history:
  adoption-history:
    - >
      Digiarty says the Mac converter served more than 90 million users from 2010
      onward. This is a vendor-reported adoption figure rather than an independently
      audited measurement.
    - >
      The official FAQ now identifies the product as discontinued and recommends the
      vendor's newer Macxvideo AI product for current macOS and Apple silicon
      compatibility.
  package-nerd-significance:
    - >
      The cask preserves access to a discontinued proprietary Mac utility whose
      lifecycle is no longer represented by the vendor's current flagship product.
    - >
      It typifies package-manager entries for desktop media applications: installation
      can be automated, but the application remains closed-source, GUI-oriented, and
      separately licensed.
  project-history:
    - >
      WinX HD Video Converter for Mac was Digiarty's macOS video-conversion application,
      combining format transcoding with compression, basic editing, downloading, and
      screen recording.
    - >
      The vendor continued updating it for newer codecs and resolutions before
      discontinuing active maintenance in favor of Macxvideo AI.
  related-projects:
    - Macxvideo AI is the vendor-designated successor for current Mac systems.
    - >
      WinX HD Video Converter Deluxe is the related Windows-oriented product documented
      by the same vendor.
  sources:
    - https://www.winxdvd.com/hd-video-converter-for-mac/
    - https://www.winxdvd.com/hd-video-converter-for-mac/tech-faq.htm
    - https://www.winxdvd.com/help/how-to-use-video-converter-for-mac.htm
  summary:
    - >
      WinX HD Video Converter for Mac was a proprietary Digiarty desktop application for
      converting, compressing, editing, downloading, and recording video. It is now
      discontinued.
  timeline:
    - "2010: The vendor's stated user-adoption period began."
    - >
      Later releases: Support expanded to formats and codecs including 4K, 8K, HEVC,
      AV1, H.264, and VP9.
    - >
      By 2026: The official FAQ described the product as discontinued and no longer
      actively maintained.
  usage:
    - >
      Users import or drag in a video, choose an output format or target device, select
      an output directory, and run the conversion.
    - >
      Additional workflows include trimming, cropping, merging, rotating, adding
      subtitles, reducing file size, downloading online video, and recording the Mac
      screen.
