    - https://github.com/micasa-dev
    - https://micasa.dev/
    - https://ostechnix.com/micasa-terminal-home-maintenance-tracker/
  summary:
    - >
      micasa is a Go terminal application by Phillip Cloud for keeping household
      maintenance data local. Its public site presents the package as "home maintenance,
      from the terminal," with workflows for schedules, projects, quotes, vendors,
      service history, documents, and offline/local-LLM use. The project deliberately
      avoids a hosted service model: the repository and site describe a keyboard-driven,
      Vim-style modal TUI backed by a single SQLite file, with no cloud account or
      subscription.
  usage:
    - >
      In package-manager terms, micasa is a niche productivity CLI rather than a
      developer build tool. Homebrew packages it as `micasa`, while the upstream
      installation path also supports `go install` and binary releases for Linux, macOS,
      and Windows. Its closest relatives are less other package-manager formulas than
      local-first personal databases and TUI tools; the project itself names VisiData as
      an inspiration.
