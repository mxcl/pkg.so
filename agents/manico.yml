history:
  adoption-history:
    - >
      Manico has persisted across multiple commercial generations, including a migration
      path for owners of 1.x licenses. The official site does not publish installation
      totals or other adoption figures.
  package-nerd-significance:
    - >
      Manico packages a keyboard-centric alternative to both the Dock and Command-Tab.
      Its Dock, switcher, and custom modes appeal to macOS users who optimize frequently
      repeated desktop navigation around shortcuts and muscle memory.
  project-history:
    - >
      Tutu Studio developed Manico as a native macOS utility for rapidly launching and
      switching applications. The official site's copyright lineage begins in 2013, and
      the product subsequently progressed through multiple major generations.
  related-projects:
    - >
      Manico occupies the macOS launcher-and-switcher niche alongside the built-in Dock
      and Command-Tab switcher, which its workflow augments or replaces.
  sources:
    - https://manico.im/
  summary:
    - >
      Manico is a commercial macOS application launcher and switcher from Tutu Studio.
      It maps applications to keyboard shortcuts through Dock, switcher, and
      user-defined modes.
  timeline:
    - "2013: The official site dates Manico's product lineage to this year."
    - '1.x era: Manico established its keyboard-driven launcher and switcher workflow.'
    - >
      3.x era: Existing 1.x customers were offered a license-redemption path for the
      newer generation.
  usage:
    - >
      Users invoke Manico with a configurable activation key and select applications
      through number-key shortcuts. Dock mode follows Dock contents, switcher mode maps
      running applications, and custom mode lets users choose applications and bindings.
    - >
      Preferences control appearance, bar position, menu-bar visibility, and a silent
      mode for selected applications. A usage view graphs how frequently the launcher is
      invoked.
