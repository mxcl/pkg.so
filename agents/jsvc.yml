config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      jsvc has been adopted mostly through server packaging rather than through
      standalone application fandom. It appears in Homebrew and in Linux distribution
      packages as the practical wrapper for Java daemons, and it is closely associated
      with Java server deployments such as Tomcat-style service startup.
  package-nerd-significance:
    - >
      For package maintainers, jsvc is a small but telling example of the glue code
      needed to make a cross-platform runtime behave like a native Unix service. Its
      packaging spans Java, C, init systems, architecture support, and distribution
      policy.
  project-history:
    - >
      Apache Commons Daemon packages a Java API with native launchers. The jsvc command
      became the Unix side of that project, while the same project points Windows users
      toward procrun for Windows Service integration. The Apache Commons Daemon source
      tree has release tags reaching back to 1.0-era releases in 2007, and Apache
      release notes document a long maintenance line for changes in operating-system
      support and JVM integration.
  related-projects:
    - Apache Commons Daemon also includes procrun for Windows service integration.
    - >
      Apache Tomcat is a common Java server context where Commons Daemon-style service
      launchers are relevant.
  sources:
    - https://commons.apache.org/proper/commons-daemon/changes.html
    - https://commons.apache.org/proper/commons-daemon/index.html
    - https://commons.apache.org/proper/commons-daemon/jsvc.html
    - https://formulae.brew.sh/formula/jsvc
    - https://github.com/apache/commons-daemon/tags
  summary:
    - >
      jsvc is the Unix-oriented launcher in Apache Commons Daemon for running Java
      server applications as background daemons. It matters because it bridges JVM
      services with classic Unix service expectations: start as root for privileged
      work, bind low ports, switch to an unprivileged user, write pid files, and
      cooperate with init-style supervision.
  timeline:
    - '2007: Apache Commons Daemon 1.0-era source tags appear in the Apache repository history.'
    - '2023: Apache Commons Daemon 1.3.4 continued the 1.x maintenance series.'
    - '2026: Apache Commons Daemon 1.6.x release notes recorded continued platform maintenance.'
  usage:
    - >
      Operators use jsvc when a Java process needs Unix daemon behavior that the JVM
      does not provide by itself. The command is especially useful for services that
      need a privileged startup step followed by a drop to a less privileged account.
related-packages:
  - id: brew:tomcat
    reason: >
      Use Tomcat with jsvc when a Tomcat server must run as a conventional Unix daemon;
      Tomcat officially identifies jsvc as its Unix-specific Commons Daemon wrapper.
    rel: adjacent_workflow
    sources:
      - https://github.com/apache/tomcat/blob/main/RUNNING.txt
      - https://commons.apache.org/proper/commons-daemon/jsvc.html
