history:
  adoption-history:
    - >
      Onlook appealed to designers and front-end developers seeking visual editing
      without surrendering ownership of the generated React code. The desktop
      application was distributed through downloadable builds and Homebrew Cask, while
      the public repository enabled local development and community contributions.
    - >
      The project subsequently migrated its primary experience from Electron to the web
      to remove desktop setup overhead and enable shared, resumable, and collaborative
      projects. The original desktop editor remains historically relevant to the cask
      entry.
  package-nerd-significance:
    - >
      Onlook sits at the boundary between design software and code editors: visual DOM
      manipulation is mapped back to source files rather than stored only in a
      proprietary canvas. Its evolution from a packaged Electron application to a
      hosted, container-backed web application also illustrates how rapidly AI
      development tools can outgrow desktop package artifacts.
  project-history:
    - >
      Onlook started as an open-source, local-first desktop visual editor for React
      applications. It connected rendered DOM elements to their source locations so
      visual edits could be written back to code in real time.
    - >
      The project expanded from direct visual editing into project creation, AI-assisted
      code changes, Tailwind styling, checkpoints, deployment, and collaboration. Its
      maintainers later moved the principal product from Electron to a browser
      application backed by remote containers and persisted project data.
  related-projects:
    - >
      The project describes itself as an open-source alternative in the same broad space
      as Webflow, Bolt.new, Lovable, v0, Replit Agent, and Figma Make.
    - >
      Next.js, Tailwind CSS, Supabase, CodeSandbox, and Bun are documented parts of the
      current implementation.
  sources:
    - https://docs.onlook.com/
    - https://docs.onlook.com/developers/architecture
    - https://docs.onlook.com/migrations/electron-to-web-migration
    - https://github.com/onlook-dev/onlook
    - https://github.com/onlook-dev/onlook/wiki
    - https://onlook.com/
  summary:
    - >
      Onlook is an open-source visual-first development environment for creating and
      editing React and Next.js interfaces with direct code synchronization and AI
      assistance.
  timeline:
    - >
      2024: The project publicly described its local-first desktop editor and real-time
      design-to-code workflow.
    - >
      2024: Official announcements highlighted project creation, one-command setup,
      Tailwind editing, and integrations with external code editors.
    - >
      Later: The primary product migrated from Electron to a web architecture using
      remote containers and persisted cloud project data.
    - >
      Current direction: The repository describes the original editor as the project
      that started Onlook while a hosted AI-native design product proceeds in early
      access.
  usage:
    - >
      Users create or import a supported web project, manipulate its interface visually,
      edit Tailwind styles, and use AI chat while Onlook updates the underlying source
      code.
    - >
      The historical desktop application operated on locally running React projects. The
      newer web architecture runs project code in containers and displays it in an
      iframe, while retaining visual-to-source mapping and code editing.
