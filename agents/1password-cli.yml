id: cask:1password-cli
display-name: 1Password CLI
repo: null
docs:
  - https://www.1password.dev/cli
  - https://www.1password.dev/cli/config-directories
  - https://www.1password.dev/cli/get-started
  - https://www.1password.dev/cli/reference
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/op
    - ~/.config/op
    - ~/.op
    - ${XDG_CONFIG_HOME}/.op
credentials-file-location: null
history:
  adoption-history:
    - >
      CLI adoption is tied to developer and operations workflows: Homebrew, winget,
      manual installs, Docker images, shell plugins, scripts, and desktop-app-backed
      authentication are all documented official distribution or usage paths.
  package-nerd-significance:
    - >
      For package maintainers, 1Password CLI is notable because the Homebrew cask wraps
      a proprietary vendor-distributed binary, while the install docs state the cask is
      maintained by both Homebrew and 1Password developers and downloads from
      AgileBits/1Password CDN domains.
  project-history:
    - >
      The official get-started documentation describes 1Password CLI as bringing
      1Password to the terminal, with installation paths for macOS, Windows, and Linux
      and integration with the desktop app for local authentication.
    - >
      1Password's official CLI 2 release notes show an actively maintained
      product-history stream for the modern CLI, including package installer changes,
      desktop app integration fixes, shell plugin work, and Docker tag behavior after
      CLI 1 deprecation.
  related-projects:
    - >
      Related official surfaces include the 1Password desktop apps, 1Password Connect,
      shell plugins, Docker images, and the Homebrew Cask packaging repository.
  sources:
    - https://app-updates.agilebits.com/product_history/CLI2
    - https://www.1password.dev/cli/config-directories.md
    - https://www.1password.dev/cli/get-started.md
    - https://www.1password.dev/cli/reference
  summary:
    - >
      1Password CLI is the official op command for using 1Password from a terminal,
      scripts, and developer workflows.
  timeline:
    - >
      2020s: 1Password CLI 2 becomes the actively maintained CLI line documented by the
      official CLI2 release notes.
    - >
      2020s: Official install docs document Homebrew, winget, Linux package managers,
      manual downloads, and desktop app integration.
    - '2025: CLI 2 release notes mention Docker tag behavior following CLI 1 deprecation.'
  usage:
    - >
      Users run op to sign in, manage vault items, retrieve secrets, automate scripts,
      and integrate 1Password with shell and development workflows. The configuration
      directory can be controlled with --config or OP_CONFIG_DIR, otherwise it follows
      documented XDG and legacy directory precedence.
tags:
  - cli
  - developer-tools
  - password-manager
  - secrets-management
provenance:
  category-sources:
    - >
      Official 1Password CLI docs describe secure terminal access to 1Password vault
      data and secrets during development.
  display-name-sources:
    - Official 1Password documentation uses the product name 1Password CLI.
  docs-sources:
    - >
      1Password CLI get-started docs describe the CLI as `op`, app integration, service
      account token authentication, and official install methods.
    - >
      1Password configuration directory docs list default and precedence-ordered
      configuration directories.
    - source_facts.homepage is the official 1Password CLI documentation surface.
  history-sources:
    - https://app-updates.agilebits.com/product_history/CLI2
    - https://www.1password.dev/cli/config-directories.md
    - https://www.1password.dev/cli/get-started.md
    - https://www.1password.dev/cli/reference
  repo-sources:
    - >
      1Password's official CLI documentation and release pages distribute the vendor CLI
      but do not identify an official public source repository for the CLI
      implementation.
    - source_facts.repo is empty.
  tags-sources:
    - >
      Official docs describe loading secrets, app integration, and service account token
      authentication.
    - source_facts.description says command-line interface for 1Password.
category-confidence: high
category-path:
  - security
  - secrets-management
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: medium
tags-confidence: high
