history:
  adoption-history:
    - >
      The original open-source Medis repository accumulated a substantial developer
      following as an approachable Redis desktop client. The current Medis 2 product
      continues the name as a free macOS-focused application and is also distributed
      through Homebrew.
  package-nerd-significance:
    - >
      Medis gives Redis users a graphical counterpart to redis-cli for inspecting keys
      and running commands. Its production-oriented alert mode, non-blocking handling of
      large keyspaces, and SSH/SSL connectivity are particularly relevant to developers
      who want convenience without casually issuing destructive writes.
  project-history:
    - >
      The original Medis was an MIT-licensed Electron, React, and Redux application
      powered by ioredis and ssh2. Medis 2 was subsequently rewritten from the beginning
      with native technology and added features including tree views, streams, alert
      mode, and dark mode.
  related-projects:
    - >
      The legacy Medis 1 code is published at https://github.com/luin/medis. Medis works
      with Redis and Redis-compatible services and supports modules and encodings such
      as RedisJSON and MessagePack.
  sources:
    - https://docs.getmedis.com/
    - https://getmedis.com/
    - https://github.com/luin/medis
  summary:
    - >
      Medis is a macOS graphical client for Redis, designed for browsing and editing
      keys, issuing commands, and connecting through SSH or SSL.
  timeline:
    - 'Medis 1: Released as an open-source, Electron-based Redis management application.'
    - >
      Medis 2: Rewritten as a native application with an expanded production-oriented
      feature set.
  usage:
    - >
      Users create Redis connections, browse keys in a tree, inspect or edit common
      Redis data types, and run arbitrary commands. SSH tunnels, SSL, automatic
      JSON/MessagePack recognition, and alert mode support remote and
      production-oriented workflows.
