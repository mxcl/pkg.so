history:
  adoption-history:
    - >
      quartz-wm is included in XQuartz, the macOS X.Org distribution. The supplied
      metadata also records standalone packaging through Homebrew, MacPorts, and Nix.
  package-nerd-significance:
    - >
      The package illustrates how Unix graphical applications integrate with macOS
      through separately packaged X11 components. XQuartz specifically identifies its
      Apple Public Source License as distinct from other components' licenses.
  project-history:
    - >
      quartz-wm belongs to the X11-on-macOS ecosystem. Its former XQuartz GitHub
      repository was archived in January 2021 and directs development to freedesktop.org
      GitLab.
  related-projects:
    - XQuartz supplies the surrounding X server, libraries, and applications.
  sources:
    - >
      [Former official repository](https://github.com/XQuartz/quartz-wm): relocation
      notice and archive date.
    - '[Official FAQ](https://www.xquartz.org/FAQs.html): session startup.'
    - '[XQuartz homepage](https://www.xquartz.org/): distribution role and licensing.'
    - 'source_facts.package-manager: standalone packaging.'
  summary:
    - quartz-wm is the window manager used by XQuartz on macOS.
  timeline:
    - >
      2021-01-25: Former GitHub repository archived; its README directs users to
      freedesktop.org GitLab.
  usage:
    - >
      It runs within an XQuartz session to manage X11 application windows. The official
      FAQ demonstrates launching quartz-wm from an X session startup script.
    - >
      No explicit package-specific configuration-file location or dedicated credentials
      file was verified in the reviewed official documentation.
