id: brew:kaf
display-name: Kaf
repo: null
docs:
  - https://github.com/birdayz/kaf#readme
config-file-location:
  unix:
    - ~/.kaf/config
credentials-file-location:
  unix:
    - ~/.kaf/config
history:
  adoption-history:
    - >
      Kaf has a smaller footprint than Apache Kafka or K9s, but its package-manager
      presence in Homebrew, MacPorts, Nix, and Scoop shows the value of a lightweight
      Kafka CLI for local workstations and scripts.
    - >
      The repository metadata showed a multi-year maintenance history and a modest but
      real audience by July 2026, with thousands of GitHub stars rather than only
      incidental packaging.
  package-nerd-significance:
    - >
      Kaf matters to package collectors because it represents the ergonomic rewrite
      pattern: a large server project ships official scripts, and the ecosystem produces
      a smaller native CLI that is easier to install, tab-complete, and carry between
      machines.
    - >
      Its Homebrew formula is also useful metadata: it distinguishes the Kafka client
      utility named kaf from Apache Kafka itself and from similarly named tools such as
      kafkactl.
  project-history:
    - >
      The birdayz/kaf repository was created in September 2018, and the first GitHub
      release series began with v0.1.0 on September 30, 2018. The project describes
      itself as a modern CLI for Apache Kafka, written in Go.
    - >
      Its design follows the pattern of a single-purpose operational CLI: configuration
      lives under the user's home directory, commands wrap common Kafka interactions,
      and the binary can be distributed through package managers without installing the
      full Kafka distribution.
  related-projects:
    - >
      Kaf is related to Apache Kafka, Sarama-based Go Kafka tooling, kafkactl, kcat, and
      the Kafka command scripts included with the Apache distribution.
  sources:
    - https://api.github.com/repos/birdayz/kaf
    - https://formulae.brew.sh/formula/kaf
    - https://github.com/birdayz/kaf
    - https://github.com/birdayz/kaf/releases
  summary:
    - >
      Kaf is a Go-based command-line client for Apache Kafka. It gives Kafka users a
      compact native CLI alternative to the JVM-centered scripts that ship with Apache
      Kafka itself.
  timeline:
    - '2018-09: Public GitHub repository created.'
    - '2018-09-30: v0.1.0 release published.'
    - '2026-07-01: Repository metadata showed more than 2,400 stars.'
  usage:
    - >
      Kaf is used for direct Kafka administration and inspection tasks such as working
      with topics, consumers, producers, and cluster metadata from a local shell.
    - >
      Because Kafka credentials and cluster definitions can live in the Kaf
      configuration file, the package is part of the user's data-infrastructure access
      surface, not merely a display utility.
related-packages:
  - id: brew:kafkactl
    reason: >
      Choose kafkactl when you need a broader kubectl-style administration surface
      including ACLs, schemas, SCRAM users, Kubernetes-assisted access, and named
      contexts; Kaf offers a smaller overlapping Kafka CLI.
    rel: alternative
    sources:
      - https://github.com/birdayz/kaf
      - https://github.com/deviceinsight/kafkactl
  - id: brew:kcat
    reason: >
      Choose kcat for a lightweight, pipe-oriented Kafka producer and consumer with
      metadata inspection; choose Kaf when you also need higher-level topic and
      consumer-group administration.
    rel: alternative
    sources:
      - https://github.com/birdayz/kaf
      - https://github.com/edenhill/kcat
  - id: brew:kafka
    reason: >
      Apache Kafka supplies the brokers, topics, records, and consumer groups that Kaf
      connects to and administers.
    rel: adjacent_workflow
    sources:
      - https://github.com/birdayz/kaf
      - https://kafka.apache.org/documentation/
