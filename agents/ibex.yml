history:
  adoption-history:
    - >
      IBEX is a specialist scientific-computing package rather than a mass-market
      developer tool. Its adoption is visible through the maintained documentation site,
      GitHub releases, Homebrew packaging, and the presence of solver executables that
      let users try interval methods without embedding the C++ API first.
  package-nerd-significance:
    - >
      IBEX matters to package nerds because it is a rare Homebrew formula in the
      rigorous numerical-constraint niche: it packages both a C++ library and solver
      CLIs, pulls in parser/build dependencies such as Bison, Flex, CMake, and pkgconf,
      and exposes a domain-specific modeling language, Minibex.
  project-history:
    - >
      The IBEX documentation describes the library as a layered toolkit:
      symbolic-numeric interval calculations, contractor programming, and system solving
      or global optimization. The documentation copyright line spans 2007-2020 under IMT
      Atlantique, while the GitHub repository records release tags from the 1.x series
      through the 2.x series.
  related-projects:
    - >
      The documentation says IBEX relies on third-party interval arithmetic libraries
      such as Gaol or Filib depending on platform, and it points to plugins or packages
      for affine arithmetic, AMPL compatibility, and semi-infinite programming.
  sources:
    - https://formulae.brew.sh/formula/ibex
    - https://github.com/ibex-team/ibex-lib
    - https://github.com/ibex-team/ibex-lib/releases
    - https://ibex-team.github.io/ibex-lib/
    - https://ibex-team.github.io/ibex-lib/intro.html
  summary:
    - >
      IBEX is a C++ numerical library for interval arithmetic and constraint programming
      over real numbers, distributed with command-line tools such as IbexSolve and
      IbexOpt.
  timeline:
    - '2007-2020: The published documentation carries an IMT Atlantique copyright range.'
    - 'ibex-1.19: The repository contains a release tag for the 1.x line.'
    - 'ibex-2.0.x: The repository tag history shows the transition to the 2.x line.'
    - '2025: The GitHub releases page lists v2.9.1 as an April 2025 release.'
  usage:
    - >
      Users apply IBEX to constraint satisfaction, set characterization, interval
      computations, contractor-based pruning, and global optimization. The docs
      emphasize reliable characterization with boxes and account for uncertainty sources
      such as floating-point approximation, round-off error, model uncertainty, and
      measurement noise.
