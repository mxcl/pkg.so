credentials-file-location: null
history:
  project-history:
    - >
      The tool's milestones are tied to practical embedded work: user-space operation
      without kernel modifications, programming and breakpoints, memory inspection,
      power profiling, bootloader access, multiple object-file formats, disassembly,
      symbol-table handling, call-graph analysis, and simulation mode. Those features
      make it useful both for ordinary firmware loading/debugging and for
      reverse-engineering or protocol work around MSP430 devices.
  sources:
    - https://dlbeer.co.nz/mspdebug/
    - https://formulae.brew.sh/formula/mspdebug
    - https://github.com/dlbeer/mspdebug
    - https://manpages.ubuntu.com/manpages/noble/man1/mspdebug.1.html
    - https://packages.debian.org/sid/mspdebug
  summary:
    - >
      MSPDebug is Daniel Beer's free command-line debugger and programmer for Texas
      Instruments MSP430 microcontrollers. The project page describes support for
      FET430UIF, eZ430, RF2500, Olimex MSP430-JTAG-TINY, Launchpad, Chronos, GoodFET,
      and other compatible devices, plus use either as a GDB proxy or as an independent
      debugger.
  usage:
    - >
      Its package-manager niche is the open embedded-toolchain slot beside msp430-gcc
      and GDB. The upstream page notes availability in Fedora, Gentoo, OpenBSD ports,
      Debian, and Ubuntu, while Homebrew and other Unix package managers provide it for
      developers who need MSP430 board access from macOS or Linux without vendor IDEs.
related-packages:
  - id: brew:gdb
    reason: >
      Run MSPDebug as a remote stub so GDB supplies source-level debugging while
      MSPDebug communicates with and controls the MSP430 target.
    rel: adjacent_workflow
    sources:
      - https://github.com/dlbeer/mspdebug
      - https://github.com/dlbeer/mspdebug/blob/master/mspdebug.man
      - https://www.gnu.org/software/gdb/
