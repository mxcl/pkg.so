id: cask:qt-design-studio
display-name: Qt Design Studio
repo: https://code.qt.io/cgit/qt-creator/qt-creator.git
docs:
  - https://doc.qt.io/qtdesignstudio
  - https://wiki.qt.io/QtDesignStudio
config-file-location:
  unix:
    - ~/.config/QtProject/QtDesignStudio.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Qt positions Design Studio as a bridge between designers and developers working on
      Qt Quick interfaces. Its workflow combines graphical editing with QML and supports
      moving production-ready projects into Qt Creator.
    - >
      Qt expanded availability after the initial release: the 1.1 beta added Linux
      packages, while later releases developed the product through the 2.x, 3.x, and 4.x
      series. The official Qt wiki now describes both community and commercial editions.
  package-nerd-significance:
    - >
      Qt Design Studio occupies a specialized place beside Qt Creator: it focuses on
      visual UI construction and designer-developer handoff while Qt Creator handles
      broader application implementation. The Homebrew cask provides repeatable
      installation of this substantial vendor tool on macOS.
    - >
      Its source relationship is also notable: Qt Design Studio is based on Qt Creator,
      and the official Qt Creator repository carries dedicated qds branches and tags.
  project-history:
    - >
      Qt released Qt Design Studio 1.0 in October 2018 after a technology preview
      earlier that year. The initial product emphasized graphical UI design, QML
      editing, timelines, Photoshop import, and live previews on target devices.
    - >
      The environment developed from Qt's QML and Qt Quick design tooling and remains
      based on Qt Creator. Modern projects combine .qmlproject metadata and QML UI files
      with CMake output that developers can open, build, and run in Qt Creator.
  related-projects:
    - Qt
    - Qt Quick
    - QML
    - Qt Creator
    - Qt for MCUs
    - Figma
  sources:
    - 'Official Qt Creator repository: https://code.qt.io/cgit/qt-creator/qt-creator.git/'
    - >
      Official Qt Design Studio 1.0 announcement:
      https://www.qt.io/ja-jp/blog/2018/10/28/qt-design-studio-1-0-released
    - 'Official Qt Design Studio documentation: https://doc.qt.io/qtdesignstudio/'
    - 'Official Qt Design Studio wiki: https://wiki.qt.io/QtDesignStudio'
    - >
      Official designer-developer workflow documentation:
      https://doc.qt.io/qtdesignstudio/studio-designer-developer-workflow.html
  summary:
    - >
      Qt Design Studio is Qt's visual environment for designing, prototyping, and
      implementing Qt Quick user interfaces. It combines graphical editing and
      QML-oriented workflows for designers, front-end developers, and technical artists.
  timeline:
    - '2018: Qt released Qt Design Studio 1.0.'
    - '2019: The 1.1 release line added Linux packages.'
    - '2020: Qt released Qt Design Studio 2.0.'
    - '2023: Qt released Qt Design Studio 4.0.'
  usage:
    - >
      Designers and developers use Qt Design Studio to create screens and reusable
      components, edit QML, build animations and interactions, import design assets,
      preview interfaces, and hand compilable projects to Qt Creator.
    - >
      Qt Account login can be required by Qt's installer or licensed distributions, but
      no separate Qt Design Studio credentials-file location is officially documented.
