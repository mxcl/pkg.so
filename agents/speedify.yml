history:
  adoption-history:
    - >
      Speedify expanded across Windows, macOS, iOS, Android, and Linux and is offered
      for individual devices, managed teams, routers, and embedded deployments. Official
      company material describes use across millions of devices.
  package-nerd-significance:
    - >
      Speedify combines VPN tunneling with software-defined channel bonding, making it
      distinct from clients that merely select one network path. For package users,
      installing the desktop client supplies access to a separately operated service
      rather than a self-contained VPN implementation.
  project-history:
    - >
      Connectify launched Speedify in 2014 as a software channel-bonding service. It
      subsequently developed into an encrypted bonding VPN designed to combine Wi-Fi,
      cellular, Ethernet, Starlink, and satellite links while preserving sessions during
      link failure.
  related-projects:
    - Pair & Share lets nearby Speedify devices share cellular connections.
    - Speedify for Teams adds centralized account and device management.
    - Dedicated and self-hosted Speed Servers serve business deployments.
  sources:
    - https://speedify.com/
    - >
      https://speedify.com/blog/combining-internet-connections/dedicated-bonding-router-value-for-money/
    - https://speedify.com/wp-content/uploads/Speedify-Press-Release-Apr-28-2026-2.pdf
    - https://support.speedify.com/
  summary:
    - >
      Speedify is a commercial channel-bonding VPN that combines multiple Internet
      connections for throughput, resilience, and encrypted transport.
  timeline:
    - '2014: Speedify launched as a channel-bonding service.'
    - '2019: Speedify added Linux support, including Raspberry Pi deployments.'
    - >
      2026: Official company material described consumer, enterprise, router, and
      embedded deployments.
  usage:
    - >
      Users install the client, sign in or select an available service tier, and connect
      through Speedify. Connections can be marked primary, secondary, backup, or
      unavailable; traffic is distributed across usable links and rerouted when a link
      fails.
