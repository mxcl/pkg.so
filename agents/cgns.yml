history:
  adoption-history:
    - >
      The official site describes CGNS as administered by an international steering
      committee and as an AIAA Recommended Practice. In 1999 the CGNS Steering Committee
      was created as a voluntary public forum, and in January 2000 it became a
      subcommittee of the AIAA CFD Committee on Standards.
  package-nerd-significance:
    - >
      For scientific package maintainers, CGNS is notable because it is both a file/data
      standard and the single public C/C++/Fortran implementation referenced by the
      project, with command-line utilities such as cgnscheck, cgnsconvert, cgnsdiff, and
      format converters.
  project-history:
    - >
      CGNS began under NASA-funded CFD data exchange work and produced both a documented
      standard data model and software to read, write, and modify data in that format.
      Version 1.0 of the Mid-Level Library was released in May 1998.
  related-projects:
    - >
      The official history names NPARC, TLNS3D, CFL3D, GMAN, OVERFLOW, and Visual3 as
      prototype or demonstrator applications involved in CGNS development.
  sources:
    - https://api.github.com/repos/CGNS/CGNS
    - https://github.com/CGNS/CGNS
    - https://cgns.github.io/
    - https://cgns.org/
    - https://formulae.brew.sh/api/formula/cgns.json
    - https://cgns.org/general/history.html
    - https://cgns.org/general/implementations.html
  summary:
    - >
      CGNS is a standard and reference software stack for storing, exchanging, and
      archiving computational fluid dynamics data.
  timeline:
    - '1998: Version 1.0 of the Mid-Level Library was released.'
    - '1999: CGNS Steering Committee was created.'
    - >
      2000: CGNS Steering Committee became a subcommittee of the AIAA CFD Committee on
      Standards.
    - "2001: A User's Guide to CGNS was made available."
    - '2011: Version 3.1 added 64-bit capability and concurrent ADF/HDF5 support.'
  usage:
    - >
      CGNS is used by CFD applications to exchange grids, boundary conditions, flow
      solutions, and related aerodynamic analysis data through a portable binary format
      and platform-independent APIs for C, C++, Fortran, and Fortran90.
related-packages:
  - id: brew:hdf5
    reason: >
      HDF5 is CGNS's officially recommended underlying storage mechanism, so it is the
      relevant companion when building CGNS-enabled scientific applications or
      inspecting their low-level data storage.
    rel: adjacent_workflow
    sources:
      - https://cgns.org/cgns-archives/CGNS_docs_current/overview/elements.html
      - https://docs.hdfgroup.org/documentation/hdf5/latest/
