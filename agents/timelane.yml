history:
  adoption-history:
    - >
      Timelane serves Apple-platform developers who need a visual account of
      asynchronous behavior in Instruments. The desktop app is distributed through
      GitHub Releases and Homebrew Cask, while related Swift packages instrument
      application code.
  package-nerd-significance:
    - >
      Timelane exemplifies an Apple developer-tool packaging pattern in which a macOS
      app installs an Instruments component while source dependencies add
      instrumentation to a project. Homebrew can manage the app independently of Swift’s
      source-package workflow.
  project-history:
    - >
      Marin Todorov published Timelane as an open-source macOS application and
      Instruments integration for profiling asynchronous code. The app bundles the
      Timelane Instrument installer and directs developers to companion code and
      examples.
    - >
      The official app repository is MIT-licensed and identifies 2020 copyright,
      providing a dated baseline for the standalone Timelane application.
  related-projects:
    - TimelaneCore
    - TimelaneCombine
    - Apple Instruments
    - Apple Combine
  sources:
    - Input `source_facts.description` and `source_facts.package-manager`.
    - https://github.com/icanzilb/Timelane
    - https://github.com/icanzilb/Timelane/releases
    - https://timelane.tools/
  summary:
    - >
      Timelane is an open-source macOS developer tool that visualizes asynchronous
      operations through an Apple Instruments integration.
  timeline:
    - '2020: The Timelane app repository records its MIT-licensed application baseline.'
    - 'Homebrew distribution: Timelane became installable as the `timelane` cask.'
  usage:
    - >
      Developers install Timelane.app, use it to install the Timelane Instrument, add
      the appropriate companion instrumentation to their code, and inspect asynchronous
      activity in Apple Instruments.
