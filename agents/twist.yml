history:
  adoption-history:
    - >
      Doist first developed Twist around its own distributed team's practices. Official
      product material says it subsequently became a communication tool for other teams
      seeking organized, asynchronous collaboration.
  package-nerd-significance:
    - >
      The cask installs a desktop client for a hosted collaboration platform, not a
      self-contained messaging server. Conversations remain tied to a Twist workspace
      and account, while the same workspace is available through web, mobile, and other
      desktop clients.
  project-history:
    - >
      Twist was created by Doist as a communication system reflecting the company's
      emphasis on transparency, collaboration, and asynchronous work. Its information
      model organizes workspaces into channels, topic-specific threads, comments, an
      inbox, and direct messages.
    - >
      Doist later rebuilt the product around a more focused thread view, an inbox that
      lets users mark discussions done, faster search, and broader keyboard navigation,
      while retaining asynchronous communication as its central design principle.
  related-projects:
    - >
      Todoist is Doist's task-management product and has an official Twist integration
      that can turn threads or comments into tasks.
    - Twist exposes an official developer API and integration system.
  sources:
    - https://developer.twist.com/
    - https://support.twist.com/help
    - https://twist.com/help/articles/the-new-and-updated-twist-HSc4VzbsE
    - https://twist.com/help/articles/what-is-twist-aTA4QrqG
  summary:
    - >
      Twist is Doist's team communication platform, designed around asynchronous,
      searchable discussions rather than continuous real-time chat.
  timeline:
    - >
      Initial product era: Doist created Twist for its own distributed-work
      communication practices.
    - >
      Rebuild era: Doist relaunched Twist with threads placed at the center of the
      interface and an inbox-oriented processing workflow.
    - >
      Present maintenance era: Doist continues to maintain the platform while exploring
      future communication features.
  usage:
    - >
      Teams create channels for projects, departments, clients, or topics and start a
      separate thread for each substantial discussion. The inbox collects relevant
      thread activity, while direct messages serve shorter or more immediate exchanges.
    - >
      Installing the cask supplies the macOS client, but use requires a Twist account
      and hosted workspace. Official documentation does not identify an editable
      configuration file or reusable credentials file on macOS.
