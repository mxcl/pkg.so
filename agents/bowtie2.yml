history:
  adoption-history:
    - >
      Bowtie 2 became a standard first-stage aligner for short-read sequencing
      pipelines, including variation calling, ChIP-seq, RNA-seq, bisulfite sequencing,
      and comparative genomics. The manual explicitly names SAMtools and GATK as
      downstream SAM consumers and says Bowtie 2 is tightly integrated into many other
      tools.
    - >
      Distribution is broad: the supplied package facts list Homebrew, Debian, Ubuntu,
      Fedora, MacPorts, Nix, and openSUSE, while the official manual highlights Bioconda
      and SourceForge binaries. Prebuilt genome indexes on the official site further
      cement it as a practical packaged tool rather than just a paper artifact.
  package-nerd-significance:
    - >
      Bowtie 2 is significant because it is both research software and production
      infrastructure. Package maintainers care about CPU threading, index formats,
      bundled or external compression libraries, reproducible versions for scientific
      workflows, and compatibility with SAM/BAM pipelines.
    - >
      It is also a good example of bioinformatics packaging culture: official
      SourceForge releases, GitHub development, Bioconda-first scientific distribution,
      system packages, downloadable reference indexes, and citation-driven adoption all
      coexist.
  project-history:
    - >
      Bowtie 2 followed Bowtie 1, which the manual says was released in 2009 for the
      shorter reads common at the time. Bowtie 2 was introduced for longer reads and
      newer sequencing workloads, adding gapped alignment, local alignment, flexible
      paired-end handling, richer mapping qualities, and a different command-line and
      index format.
    - >
      The Bowtie 2 news archive shows beta releases in 2011. The main Bowtie 2 paper,
      'Fast gapped-read alignment with Bowtie 2,' appeared in Nature Methods in 2012.
      The public GitHub repository was created in December 2012, and the official news
      archive notes that the source moved to GitHub in February 2014.
  related-projects:
    - Bowtie 1 is the predecessor for shorter, ungapped alignments.
    - SAMtools and GATK are downstream tools named by the manual as SAM consumers.
    - BWA, minimap2, STAR, and HISAT2 are related read aligners in genomics workflows.
    - >
      Bioconda is a major distribution channel for scientific command-line packages
      including Bowtie 2.
  sources:
    - https://api.github.com/repos/BenLangmead/bowtie2
    - https://bowtie-bio.sourceforge.net/bowtie2/index.shtml
    - https://bowtie-bio.sourceforge.net/bowtie2/manual.shtml
    - https://bowtie-bio.sourceforge.net/bowtie2/news.shtml
    - https://github.com/BenLangmead/bowtie2
  summary:
    - >
      Bowtie 2 is a fast, memory-efficient DNA sequencing read aligner and one of the
      canonical command-line tools in genomics packaging. It aligns sequencing reads to
      long reference genomes and emits SAM for downstream tools.
  timeline:
    - '2009: Bowtie 1 released for then-common short sequencing reads.'
    - '2011: Bowtie 2 beta releases appeared in the official news archive.'
    - '2012: Bowtie 2 paper published in Nature Methods.'
    - '2012: Public GitHub repository created.'
    - '2014: Official news archive announced Bowtie 2 source on GitHub.'
    - '2018: Thread-scaling paper published for high-thread-count processors.'
    - '2026: Bowtie 2 v2.5.5 listed as the latest official release.'
  usage:
    - >
      Users build or download a Bowtie 2 index for a reference genome, run `bowtie2`
      against FASTQ reads, and feed SAM output into downstream genomics tools. Companion
      commands include `bowtie2-build` for index construction and `bowtie2-inspect` for
      index inspection.
    - >
      Bowtie 2 is optimized for typical Illumina-style reads aligned to long genomes,
      while still handling local, end-to-end, paired-end, and very long read cases with
      different performance tradeoffs.
related-packages:
  - id: brew:samtools
    reason: >
      Use SAMtools immediately downstream to convert, sort, index, inspect, and analyze
      Bowtie 2's SAM/BAM output, following the workflow documented in the Bowtie 2
      manual.
    rel: adjacent_workflow
    sources:
      - https://bowtie-bio.sourceforge.net/bowtie2/manual.shtml
      - https://www.htslib.org/doc/samtools.html
  - id: brew:bwa
    reason: >
      Choose BWA for established Burrows–Wheeler short-read workflows, particularly
      where an existing pipeline standardizes on BWA-MEM and its SAM conventions.
    rel: alternative
    sources:
      - https://bowtie-bio.sourceforge.net/bowtie2/manual.shtml
      - https://github.com/lh3/bwa
  - id: brew:minimap2
    reason: >
      Choose minimap2 when the workload centers on noisy long reads, long transcript
      alignment, or assembly-to-assembly mapping rather than Bowtie 2's typical
      short-read use case.
    rel: alternative
    sources:
      - https://bowtie-bio.sourceforge.net/bowtie2/manual.shtml
      - https://github.com/lh3/minimap2
      - https://lh3.github.io/minimap2/minimap2.html
