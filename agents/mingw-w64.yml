history:
  project-history:
    - >
      Technically, MinGW-w64 is not just a compiler binary. It is a collection of
      Windows header files, import libraries, runtime libraries, and tools that combine
      with GCC or LLVM to build native Windows applications and libraries. SourceForge
      describes it as a complete runtime environment for GCC targeting native 32-bit and
      64-bit Windows binaries.
  sources:
    - https://sourceforge.net/p/mingw-w64/wiki2/History/
    - https://sourceforge.net/projects/mingw-w64/
    - https://www.mingw-w64.org/
    - https://www.mingw-w64.org/downloads/
    - https://www.mingw-w64.org/source/
  summary:
    - >
      MinGW-w64 is a continuation and expansion of the original MinGW effort to support
      GCC on Windows. The project history traces its start to work on 64-bit Windows
      support in 2005, while the official site describes the public fork from mingw.org
      in 2007 as a move to provide 64-bit support and additional Windows APIs.
  usage:
    - >
      Its ecosystem role is large for cross-compilation. Distributions such as MSYS2,
      standalone toolchain builds, and Unix package managers use MinGW-w64 to let
      developers produce Windows PE executables from Windows, macOS, and Linux
      environments. The Homebrew formula exposes that niche directly by installing
      cross-compiler tools with target prefixes such as `i686-w64-mingw32` and
      `x86_64-w64-mingw32`.
related-packages:
  - id: brew:llvm
    reason: >
      LLVM and Clang can be paired with Mingw-w64's Windows headers and libraries when
      you prefer a Clang-based cross-toolchain over the formula's GCC-oriented commands.
    rel: alternative
    sources:
      - https://www.mingw-w64.org/
      - https://www.mingw-w64.org/downloads/
      - https://clang.llvm.org/docs/CrossCompilation.html
  - id: brew:cmake
    reason: >
      CMake can drive cross-builds through toolchain files and provides MinGW-oriented
      generators, making it a practical build-system front end for Mingw-w64 projects.
    rel: adjacent_workflow
    sources:
      - https://www.mingw-w64.org/downloads/
      - https://cmake.org/cmake/help/latest/guide/user-interaction/index.html
