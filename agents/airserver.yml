history:
  adoption-history:
    - >
      AirServer was adopted early in AirPlay's life as a way to turn existing Macs into
      receivers. Official 2011 posts describe rapid update cycles, user feedback,
      localization, classroom use, multiple-display support, password protection, and
      compatibility across old and new Mac releases. It later expanded to Windows and
      added support for Miracast and Google Cast alongside AirPlay.
  package-nerd-significance:
    - >
      AirServer is significant to package enthusiasts as a long-lived proprietary
      protocol bridge: software can turn a general-purpose computer into the kind of
      wireless receiver otherwise supplied by dedicated hardware. Its long compatibility
      history also illustrates the maintenance burden of tracking proprietary casting
      protocols and operating-system changes.
  project-history:
    - >
      AirServer launched for Mac during the early AirPlay era in 2011. The vendor
      reported twelve updates within six weeks by June 2011, followed by AirServer 3.0
      with iOS 5 and OS X Lion support in October 2011. Subsequent editions broadened
      the product from an AirPlay receiver into a multi-protocol receiver spanning
      AirPlay, Google Cast, and Miracast.
  related-projects:
    - Apple AirPlay is the protocol ecosystem around which AirServer originated.
    - Google Cast and Miracast are supported by later AirServer editions.
    - AirServer Connect is the vendor's dedicated receiver-hardware line.
  sources:
    - >
      Official Mac release notes:
      https://support.airserver.com/support/solutions/articles/43000516020-airserver-for-mac-release-notes
    - 'Official press archive: https://www.airserver.com/Press'
    - 'Official product page: https://www.airserver.com/'
  summary:
    - >
      AirServer is a proprietary screen-mirroring receiver application that turns a Mac
      or PC into a receiver for phones, tablets, and computers using protocols such as
      AirPlay, Google Cast, and Miracast.
  timeline:
    - '2011: AirServer launched for Mac during the early AirPlay era.'
    - '2011-06: AirServer 2.2 added iOS 5 and 24-bit audio support.'
    - '2011-10-10: AirServer 3.0 added enhanced iOS 5 and OS X Lion support.'
    - '2020: Mac releases added notarization and updated Google Cast support.'
    - '2026-05: AirServer 7.3 added native Apple Silicon support.'
  usage:
    - >
      Users install AirServer on the receiving Mac, activate and configure it, then
      select that computer from a compatible sender's screen-mirroring or casting
      interface. Common uses include presentations, classrooms, demonstrations,
      recording, and receiving media without dedicated receiver hardware.
