history:
  adoption-history:
    - >
      Thrax's adoption is specialized: it serves finite-state grammar,
      language-processing, and computational-linguistics workflows rather than broad
      application development. Its Homebrew package makes the OpenGrm tools available to
      macOS users who want command-line programs such as `thraxcompiler`,
      `thraxmakedep`, and `thraxrewrite-tester` without building the OpenFst-related
      stack manually.
  package-nerd-significance:
    - >
      For package nerds, Thrax is a good example of a niche research-grade CLI where
      packaging matters because the dependency and build flags are the hard part. The
      official README calls out C++11, POSIX, bison, OpenFst, and specific OpenFst
      features, so a package manager saves users from reproducing a fragile local build
      recipe.
  project-history:
    - >
      The official OpenGrm README presents Thrax as release 1.2 and ties it directly to
      OpenFst: users need OpenFst with FAR, PDT, and MPDT support or the OpenFst
      `--enable-grm` option. The documentation is hosted on the OpenFst/OpenGrm TWiki
      rather than a public GitHub repository.
  related-projects:
    - >
      Related projects include OpenFst, OpenGrm, weighted finite-state transducer tools,
      grammar compilers, and language-processing toolkits that use rewrite rules and
      finite-state archives.
  sources:
    - >
      https://www.openfst.org/twiki/bin/view/GRM/ReadMe - official OpenGrm Thrax README
      for release, requirements, OpenFst dependency, installation, and usage paths.
    - >
      https://www.openfst.org/twiki/bin/view/GRM/Thrax - official Thrax documentation
      entry point.
    - >
      https://www.openfst.org/twiki/bin/view/GRM/ThraxQuickTour - official quick tour
      for compiler workflow, `thraxmakedep`, `thraxrewrite-tester`, PDT/MPDT, feature,
      and morphology notes.
  summary:
    - >
      OpenGrm Thrax is a grammar compiler toolkit for compiling grammars written as
      regular expressions and context-dependent rewrite rules into weighted finite-state
      transducers using the OpenFst format.
  timeline:
    - '2017: Official OpenGrm README revision documents Thrax release 1.2.'
    - >
      2019: Official quick tour revision documents the OpenGrm Thrax grammar compiler
      workflow.
    - >
      Thrax 1.1.0: Official quick tour notes added support for linguistic features and
      aspects of paradigmatic morphology.
    - >
      Thrax 1.2.4: Official quick tour notes a more bash-friendly separator for
      PDT/parens/assignments triples.
  usage:
    - >
      The quick tour recommends copying the installed sample grammars from
      `/usr/local/share/thrax/grammars`, running `thraxmakedep`, building with `make`,
      and testing the resulting FAR archive with `thraxrewrite-tester`. The same page
      documents grammar features for tokenization, rewrite rules, PDT/MPDT usage, and
      morphological paradigms.
