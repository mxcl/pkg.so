id: cask:sourcegit
display-name: SourceGit
repo: null
docs:
  - https://github.com/sourcegit-scm/sourcegit#readme
config-file-location:
  linux:
    - ${XDG_CONFIG_HOME:-~/.config}/SourceGit/preference.json
  macos:
    - ~/Library/Application Support/SourceGit/preference.json
  windows:
    - '%APPDATA%\SourceGit\preference.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream distributes SourceGit for Windows, macOS, and Linux and documents
      installation through Homebrew, Scoop, Linux repositories, AppImage, and GitHub
      releases.
  package-nerd-significance:
    - >
      SourceGit is a native-style, cross-platform Git GUI whose packaging still depends
      on the system Git installation and its credential helpers. Its portable mode on
      Windows packages and Linux AppImages is useful to users who want application state
      kept beside the executable.
  project-history:
    - >
      SourceGit is developed as a free, open-source graphical front end for Git. Its
      upstream repository publishes desktop builds and maintains the application,
      installation instructions, and user documentation together.
  related-projects:
    - Git supplies the underlying version-control commands.
    - >
      Git Credential Manager or git-credential-libsecret can provide authentication on
      supported systems.
  sources:
    - https://github.com/sourcegit-scm/sourcegit#readme
    - https://github.com/sourcegit-scm/sourcegit/releases
  summary:
    - SourceGit is a free, cross-platform graphical client for Git.
  timeline:
    - >
      2026: Upstream continued publishing frequent cross-platform releases and expanded
      documented package-installation channels.
  usage:
    - >
      Users open or clone Git repositories and use the GUI for commits, branches,
      remotes, tags, stashes, worktrees, submodules, history, blame, diffs, rebasing,
      merging, and other Git operations. Git 2.25.1 or newer is required.
tags:
  - cross-platform
  - desktop
  - git
  - gui
  - version-control
provenance:
  category-sources:
    - >
      Official README describes SourceGit as an open-source Git GUI client:
      https://github.com/sourcegit-scm/sourcegit#readme
  display-name-sources:
    - 'Official README: https://github.com/sourcegit-scm/sourcegit#readme'
    - current_curation.display-name
  docs-sources:
    - The official README is upstream's principal user and installation guide.
  history-sources:
    - https://github.com/sourcegit-scm/sourcegit#readme
    - https://github.com/sourcegit-scm/sourcegit/releases
  repo-sources:
    - >
      source_facts.repo is already populated; repository determination was intentionally
      skipped as instructed.
  tags-sources:
    - 'Official feature list: https://github.com/sourcegit-scm/sourcegit#readme'
    - source_facts.description
category-confidence: high
category-path:
  - developer-tools
  - version-control
  - git-clients
display-name-confidence: high
docs-confidence: medium
history-confidence: medium
repo-confidence: high
tags-confidence: high
