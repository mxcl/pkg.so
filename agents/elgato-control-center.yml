history:
  adoption-history:
    - >
      Control Center became the common companion application for Elgato's Wi-Fi lighting
      accessories across desktop and mobile environments. Official support material
      covers Key Light, Ring Light, manual pairing, signal strength, firmware updates,
      and accessory automation.
  package-nerd-significance:
    - >
      The Homebrew cask turns a hardware companion application into a manageable macOS
      package. It matters in streaming and studio setups where lighting software must be
      installed consistently alongside capture and broadcast tools.
  project-history:
    - >
      Elgato developed Control Center as the control and pairing surface for its
      network-connected lighting products. Over time its support scope expanded to cover
      firmware management, network diagnostics, automatic switch-off behavior, and
      multiple Wi-Fi accessory families.
  related-projects:
    - Elgato Key Light
    - Elgato Ring Light
    - Elgato Stream Deck
  sources:
    - https://help.elgato.com/hc/en-us/sections/360004115951-Elgato-Control-Center-Software
    - source_facts.package-manager
    - source_facts.source-archive
  summary:
    - >
      Elgato Control Center discovers, pairs, configures, and controls Elgato Wi-Fi
      lighting accessories.
  timeline:
    - >
      2026 input snapshot: Homebrew distributes Elgato Control Center 1.9 for macOS from
      Elgato's official delivery infrastructure.
  usage:
    - >
      Users pair supported lights over the local network and adjust their operation from
      the desktop app. Official guides also cover manual IP pairing, Wi-Fi diagnostics,
      firmware updates, automatic shutoff, and finding device network identifiers.
