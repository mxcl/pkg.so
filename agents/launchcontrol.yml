config-file-location:
  macos:
    - ~/Library/LaunchAgents/*.plist
    - /Library/LaunchAgents/*.plist
    - /Library/LaunchDaemons/*.plist
    - ~/Library/Application Support/LaunchControl/Templates
    - /Library/Preferences/com.soma-zone.LaunchControl.fdautil.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      LaunchControl has been maintained across successive macOS generations since 2013,
      adding Apple Silicon support, contemporary macOS compatibility, Homebrew-service
      awareness, and utilities for increasingly restricted macOS security models.
  package-nerd-significance:
    - >
      LaunchControl exposes launchd's property-list model, job domains, override
      database, logs, validation errors, and runtime state in one interface. It is
      especially useful to users who want more visibility than launchctl or brew
      services normally provides.
  project-history:
    - >
      LaunchControl originated as a graphical editor and debugger for Apple's launchd
      service manager. Its official release history begins with version 1.0 in February
      2013.
    - >
      Version 2.0 arrived in October 2022 with a redesigned interface, multiple windows
      and tabs, and support for macOS Ventura. Later releases added deeper service
      validation, Homebrew integration, Full Disk Access tooling, and optional
      AI-assisted job analysis.
  related-projects:
    - Apple launchd and launchctl provide the underlying service-management system.
    - Homebrew services installs and controls launchd jobs for supported formulae.
    - Cron is an older scheduler whose records LaunchControl can import and export.
  sources:
    - 'Official product page: https://www.soma-zone.com/LaunchControl/'
    - 'Official release notes: https://www.soma-zone.com/LaunchControl/ReleaseNotes.html'
    - 'Official user manual: https://www.soma-zone.com/LaunchControl/manual.html'
    - source_facts.package-manager
  summary:
    - >
      LaunchControl is a proprietary macOS utility from soma-zone for creating, editing,
      validating, loading, and debugging launchd jobs.
  timeline:
    - '2013: LaunchControl 1.0 was released.'
    - '2015: Cron import and export were added.'
    - '2020: Native Apple Silicon support was added.'
    - '2022: LaunchControl 2.0 introduced a modern multiwindow interface.'
    - >
      2025: The application added awareness of Homebrew-managed services and later
      optional AI-assisted job analysis.
  usage:
    - >
      Users employ LaunchControl to inspect user agents, global agents, and daemons;
      edit their plist definitions; validate configuration; load or unload jobs; inspect
      output and launchd logs; and diagnose failed background services.
    - >
      Homebrew users can use its dedicated service view to inspect jobs created for
      installed formulae. Templates and cron import/export support repeatable service
      creation.
