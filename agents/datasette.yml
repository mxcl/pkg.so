id: brew:datasette
display-name: Datasette
repo: https://github.com/simonw/datasette
docs:
  - https://docs.datasette.io/en/stable
  - https://docs.datasette.io/en/stable/cli-reference.html
  - https://docs.datasette.io/en/stable/getting_started.html
config-file-location:
  unix:
    - datasette.yaml
    - datasette.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The README explicitly targets data journalists, museums, archivists, local
      governments, scientists, researchers, and other people with data to share. That
      audience explains its adoption pattern: simple local inspection first, then
      repeatable publishing to the web.
  package-nerd-significance:
    - >
      Datasette matters in package catalogs because it turns SQLite files into
      browsable, queryable web apps with one command, making a database file feel like a
      portable software artifact.
  project-history:
    - >
      Datasette was created by Simon Willison and the official changelog traces public
      releases back to November 2017. The project grew from a lightweight SQLite
      publishing tool into a broader data exploration platform with plugins, publishing
      commands, and hosted demos.
  related-projects:
    - >
      SQLite is the central related technology; Datasette Lite and the Datasette plugin
      ecosystem extend the same publishing model.
  sources:
    - https://github.com/simonw/datasette/blob/main/README.md
    - https://docs.datasette.io/en/stable
    - https://docs.datasette.io/en/stable/changelog.html
  summary:
    - >
      Datasette is an open-source tool for exploring and publishing SQLite-backed data
      as an interactive website and JSON API.
  timeline:
    - '2017: Datasette 0.1 appears in the official changelog.'
    - '2018: Early 0.x releases expand the publishing and exploration workflow.'
    - '2024: Datasette 1.0 alpha releases continue the long-running plugin-oriented line.'
  usage:
    - >
      Package users usually install the CLI, point it at one or more SQLite databases,
      and run `datasette serve` locally or `datasette publish` to deploy a site and API.
related-packages:
  - id: brew:sqlite-utils
    reason: >
      Use sqlite-utils to import, clean, transform, index, or query SQLite data before
      exploring and publishing the resulting database with Datasette.
    rel: adjacent_workflow
    sources:
      - https://docs.datasette.io/en/stable/ecosystem.html
      - https://sqlite-utils.datasette.io/
