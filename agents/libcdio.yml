history:
  adoption-history:
    - >
      libcdio became a plumbing package for multimedia stacks rather than an end-user
      application. Its command-line tools such as cd-info, cd-read, iso-info, iso-read,
      cd-drive, and mmc-tool made it useful to packagers and diagnostics, while
      libraries such as libiso9660 let other programs consume disc images and physical
      discs through the same dependency.
    - >
      The project is packaged broadly across Unix-like distributions and Homebrew. That
      adoption reflects a narrow but durable need: software still needs to inspect
      optical media, parse ISO images, read CD-DA, or issue low-level drive commands
      even as optical drives became less common.
  package-nerd-significance:
    - >
      libcdio is package-nerd catnip because it sits at the junction of hardware, file
      formats, ancient media-player portability, GNU packaging, and command-line
      diagnostics. It also explains recurring dependency chains such as libcdio,
      libcdio-paranoia, libcddb, vcdimager, and ISO-9660 tooling in old-school
      multimedia formulas.
  project-history:
    - >
      The GNU manual gives libcdio an unusually explicit origin story. Rocky Bernstein
      describes becoming interested in Video CDs through VCDImager, extracting reusable
      VCD and CD-reading pieces with Herbert Valerio Riedel's encouragement, and naming
      the CD reading/control library libcdio to avoid confusion with CD-I.
    - >
      The same manual frames the project as an answer to the portability mess in
      early-2000s media players. Around 2002, applications such as xine, MPlayer, VLC,
      and XMMS carried platform-specific CD access code. libcdio set out to isolate that
      OS and device variability behind one library, then grew ISO-9660 support, MMC
      command support, and cdparanoia integration.
  related-projects:
    - >
      Related projects include VCDImager, libvcdinfo, libiso9660, libcdio-paranoia,
      cdparanoia, libcddb, libburn, xine, MPlayer, VLC, and other applications that
      historically needed portable CD or CD-image access.
  sources:
    - https://formulae.brew.sh/formula/libcdio
    - https://ftp.gnu.org/gnu/libcdio/
    - https://github.com/libcdio/libcdio
    - https://savannah.gnu.org/projects/libcdio
    - https://www.gnu.org/software/libcdio/libcdio.html
  summary:
    - >
      libcdio is the GNU Compact Disc Input and Control library: a C library and tool
      set for accessing CD-ROM drives, CD images, ISO-9660 filesystems, UDF media, and
      MMC device commands through a common API.
  timeline:
    - >
      2002: libcdio's manual describes the portability problem in free software CD/media
      players around this period.
    - '2003-11-22: GNU FTP archive lists libcdio 0.64.'
    - >
      2008-2010: GNU manual copyright range shows continued documentation work by Rocky
      Bernstein and Herbert Valerio Riedel.
    - '2012-2014: GNU manual copyright range records later documentation maintenance.'
    - '2025: GNU manual copyright line records renewed documentation updates.'
  usage:
    - >
      Users usually encounter libcdio indirectly through media players, ripping tools,
      image-inspection commands, or build dependencies. Developers use it to avoid
      writing separate drive-access code for Linux, BSD, macOS, Windows-style layers,
      and image formats.
related-packages:
  - id: brew:libcdio-paranoia
    reason: >
      Add libcdio-paranoia when a libcdio-based workflow needs cdparanoia-style
      digital-audio extraction and error correction rather than general disc access
      alone.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/libcdio/libcdio.html
      - https://github.com/libcdio/libcdio-paranoia
  - id: brew:libcddb
    reason: >
      Add libcddb when cd-info or another libcdio-based audio-CD application needs
      CDDB-derived album and track metadata.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/libcdio/libcdio.html
      - https://libcddb.sourceforge.net/
