history:
  adoption-history:
    - >
      The application brought SwiftPlantUML's source-analysis workflow into Xcode and
      Finder. The author recommends the related command-line utility when generating
      large diagrams spanning Swift files in multiple folders.
  package-nerd-significance:
    - >
      SwiftPlantUMLApp connects several developer-tool ecosystems: an Xcode extension
      provides the interface, SwiftPlantUML performs analysis, SourceKitten supplies
      source information, and PlantUML provides the diagram representation.
  project-history:
    - >
      Marco Eidinger developed SwiftPlantUMLApp as a macOS host application with Xcode
      Source Editor and Finder Action extensions. It uses the author's SwiftPlantUML
      package and an XPC service so SourceKitten-dependent analysis can operate outside
      the sandbox restrictions of Source Editor extensions.
  related-projects:
    - SwiftPlantUML
    - PlantUML
    - SourceKitten
  sources:
    - https://github.com/MarcoEidinger/SwiftPlantUML
    - https://github.com/MarcoEidinger/SwiftPlantUML-Xcode-Extension
  summary:
    - >
      SwiftPlantUMLApp generates and displays PlantUML class diagrams from Swift code
      selected in Xcode or Finder.
  timeline:
    - >
      Initial implementation: The project introduced a macOS host app and Xcode Source
      Editor extension for SwiftPlantUML.
    - >
      Later development: A Finder Action extension added diagram generation from
      selected Swift files.
  usage:
    - >
      Users launch the application, enable its Xcode Source Editor or Finder extension
      in macOS settings, and generate diagrams from a Swift file or selected source. The
      hosting application controls diagram visualization.
