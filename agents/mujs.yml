id: brew:mujs
display-name: MuJS
repo: https://cgit.ghostscript.com/cgi-bin/cgit.cgi/mujs.git
docs:
  - https://mujs.com/introduction.html
  - https://mujs.com/reference.html
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The interpreter is aimed at applications that need scripting without pulling in a
      large browser engine. Its introduction page emphasizes ES5 compliance, portable C,
      building from a single C file, a small footprint, a simple embedding API, and a
      default sandboxed build. The README presents the package as a lightweight
      interpreter for extending other software with scripting capabilities, with
      command-line interpreter, static library, and header installation targets.
  sources:
    - https://api.github.com/repos/ArtifexSoftware/mujs
    - https://formulae.brew.sh/formula/mujs
    - https://github.com/ArtifexSoftware/mujs
    - https://mujs.com/
    - https://mujs.com/introduction.html
  summary:
    - >
      MuJS is an embeddable JavaScript interpreter in C developed and maintained by
      Artifex Software. The project site says it was originally developed for the MuPDF
      viewer, then made useful as an independent component. The GitHub mirror records
      Artifex copyright years beginning in 2013, and the public repository mirror was
      created in 2017.
  usage:
    - >
      In package-manager ecosystems, MuJS belongs with embeddable language runtimes such
      as Lua, Duktape, QuickJS, and JerryScript. Its distinguishing role is a small C
      implementation tied historically to the MuPDF and Ghostscript/Artifex family,
      suitable for projects that want JavaScript extension points without V8-scale
      dependencies.
related-packages:
  - id: brew:quickjs-ng
    reason: >
      Choose QuickJS-NG when an embeddable engine with active community development and
      support for newer ECMAScript features matters more than MuJS's deliberately small
      ES5-oriented design.
    rel: alternative
    sources:
      - https://mujs.com/introduction.html
      - https://quickjs-ng.github.io/quickjs/
  - id: brew:duktape
    reason: >
      Choose Duktape for another compact, portable C/C++ embedding engine with extensive
      API documentation and partial post-ES5 functionality.
    rel: alternative
    sources:
      - https://mujs.com/introduction.html
      - https://duktape.org/guide.html
