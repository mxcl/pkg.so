history:
  adoption-history:
    - >
      Dash became a macOS developer-workflow tool by combining offline documentation
      with integrations for editors, IDEs, launchers, terminals, and other applications.
      Kapeli currently advertises more than 200 API docsets plus community-contributed
      documentation and cheat sheets.
  package-nerd-significance:
    - >
      Dash helped popularize the docset as a locally indexed, package-like unit of
      developer documentation. Its appeal to package enthusiasts is reproducible offline
      access to many ecosystems’ references through a single fast search interface.
  project-history:
    - >
      Kapeli developed Dash as a native documentation browser and later expanded it with
      snippets, custom docset generation, search profiles, URL schemes, and broad editor
      integration. Dash 4 was released in February 2017 with a redesigned interface,
      dark mode, and configurable fallback web searches.
  related-projects:
    - Dash-User-Contributions distributes community-maintained docsets used by Dash.
    - >
      Zeal is a related cross-platform documentation browser compatible with Dash-style
      docsets.
  sources:
    - 'Official Kapeli announcement for Dash 4: https://blog.kapeli.com/dash-4-now-available'
    - 'Official docset-generation guide: https://kapeli.com/docsets'
    - 'Official product page: https://kapeli.com/dash'
    - 'Official user guide: https://kapeli.com/dash_guide'
  summary:
    - >
      Dash is Kapeli’s documentation browser and snippet manager. It downloads and
      indexes API documentation for offline use and exposes integrations and URL schemes
      that make reference lookup part of a developer’s normal editing workflow.
  timeline:
    - '2017: Kapeli released Dash 4 with a redesigned interface and dark mode.'
    - >
      Current era: Dash provides offline access to more than 200 API documentation sets
      and supports custom docset generation.
  usage:
    - >
      Users install docsets in Settings, search all enabled references from Dash, narrow
      searches with docset keywords or profiles, and invoke searches from editors
      through integrations or the dash:// URL scheme. Dash can also store and expand
      reusable text or code snippets.
