config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dysk has become comparatively visible for a modern replacement-style system
      utility. Its packaging footprint includes crates.io, Homebrew, distro packages,
      and conda-forge, and Homebrew analytics show much higher direct install activity
      than many niche utilities in this batch.
  package-nerd-significance:
    - >
      dysk is part of the Rust rewrite wave for everyday Unix tools: small
      single-purpose binaries with nicer defaults, structured output, color/table
      rendering, and easy cross-platform packaging. Its link to `lfs-core` is also
      useful for packagers because the display CLI and filesystem-query library are
      separate concerns.
  project-history:
    - >
      The Canop/dysk repository was created in 2020. Its README says dysk was previously
      known as lfs, documents Linux and Mac support, and points to dystroy.org as the
      complete documentation site.
    - >
      The project later became a crates.io and Homebrew-packaged Rust CLI. The README
      highlights table output, selectable columns, JSON and CSV output, filters,
      sorting, and the separate `lfs-core` crate that provides the filesystem data.
  related-projects:
    - >
      Related projects include `df`, `du`, `lsblk`, `dust`, `dua`, `ncdu`, `jq`, and
      Canop's `lfs-core` crate.
  sources:
    - https://github.com/Canop/dysk#readme
    - https://api.github.com/repos/Canop/dysk
    - https://dystroy.org/dysk
    - https://crates.io/crates/dysk
    - https://crates.io/api/v1/crates/dysk
    - https://formulae.brew.sh/formula/dysk
  summary:
    - >
      dysk is a Rust command-line utility for listing filesystem and disk-usage
      information on Linux and macOS, positioned as a more readable and featureful
      alternative to `df`.
  timeline:
    - '2020: Canop/dysk repository is created.'
    - '2023: The `dysk` crate appears on crates.io.'
    - >
      2020s: README notes the rename from lfs to dysk and documents JSON, CSV, filters,
      sorting, and `lfs-core`.
    - '2026: Homebrew and crates.io both track dysk 3.6.1.'
  usage:
    - >
      Users run `dysk` as an interactive or scriptable replacement for `df`, choosing
      columns, filtering filesystems, sorting output, or emitting JSON/CSV for
      downstream tools such as `jq`.
related-packages:
  - id: brew:duf
    reason: >
      Choose duf for a simpler, highly visual `df` replacement; choose dysk when you
      need query filters, configurable columns, or JSON and CSV output.
    rel: alternative
    sources:
      - https://dystroy.org/dysk/
      - https://github.com/muesli/duf#readme
  - id: brew:jq
    reason: >
      jq complements dysk by filtering, transforming, and formatting the filesystem
      records emitted by `dysk --json`.
    rel: adjacent_workflow
    sources:
      - https://dystroy.org/dysk/
      - https://jqlang.github.io/jq/manual/
