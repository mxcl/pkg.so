history:
  adoption-history:
    - >
      Pokémon TCG Live replaced Pokémon TCG Online as the supported digital Pokémon
      card-game client. Existing users could migrate eligible cards and accessories
      through the shared Pokémon account service, although some assets and excess card
      copies did not transfer.
    - >
      The official launch expanded the successor client across Windows, macOS, iOS, and
      Android with cross-platform play. Pokémon continued to add contemporary
      expansions, starter decks, ranked play, events, and client improvements through
      2026.
  package-nerd-significance:
    - >
      The desktop packages provide a first-party digital implementation of the physical
      Pokémon Trading Card Game outside mobile app stores. They are notable as
      proprietary, frequently updated game clients tied to a live account service and
      current tabletop expansion schedule.
    - >
      For package maintainers, the independently hosted Windows and macOS installers
      contrast with mobile distribution through Apple and Google stores, while client
      versions must remain compatible with the live service.
  project-history:
    - >
      Pokémon TCG Live was developed as the modern successor to the long-running Pokémon
      TCG Online client, with development brought in-house by The Pokémon Company
      International. It introduced a newer card-logic engine, ranked ladder, Battle
      Pass, duplicate-card protection, avatars, and updated presentation.
    - >
      Following a global beta, Pokémon TCG Live launched worldwide on June 8, 2023.
      Pokémon TCG Online was removed and its servers were shut down three days earlier,
      with an account and collection migration path retained for former users.
  related-projects:
    - Pokémon TCG Online was the predecessor service and was shut down on June 5, 2023.
    - >
      Pokémon Trainer Central supplies the account system used to sign in and migrate
      eligible data.
    - >
      The physical Pokémon Trading Card Game supplies the rules, expansions, and product
      code cards represented in the client.
  sources:
    - >
      https://support.pokemon.com/hc/en-us/articles/4403847473684-How-do-I-install-Pok%C3%A9mon-TCG-Live-on-my-device
    - >
      https://support.pokemon.com/hc/en-us/articles/4406895467668-Pok%C3%A9mon-TCG-Online-Sunset-Information
    - >
      https://www.pokemon.com/uk/pokemon-news/pokemon-trading-card-game-live-launches-on-june-8-2023
    - >
      https://www.pokemon.com/us/pokemon-news/pokemon-tcg-live-landscape-layout-and-deck-editor-updates
  summary:
    - >
      Pokémon Trading Card Game Live is The Pokémon Company International's free
      cross-platform client for collecting digital Pokémon cards, building decks, and
      playing the Pokémon Trading Card Game online.
  timeline:
    - >
      2022-02-16: Pokémon TCG Live became available as an authorized application for
      child accounts during its beta period.
    - '2023-06-05: Pokémon TCG Online was removed and its servers shut down.'
    - '2023-06-08: Pokémon TCG Live exited global beta and launched worldwide.'
    - >
      2026: Pokémon continued updating the client with new expansions, formats, tablet
      landscape support, and deck-editor improvements.
  usage:
    - >
      Players sign in with a Pokémon account, build or import 60-card decks, play online
      matches, progress through ranked and Battle Pass systems, and earn cards and
      cosmetic rewards.
    - >
      Former Pokémon TCG Online players can migrate eligible collection data. Code cards
      from supported physical products can be redeemed in Live, but each code can only
      be used once.
