id: brew:ack
display-name: ack
repo: https://github.com/beyondgrep/ack3
docs:
  - https://beyondgrep.com/documentation
config-file-location:
  unix:
    - ~/.ackrc
    - /etc/ackrc
  windows:
    - C:\Users\$USER\AppData\Roaming\ackrc
    - C:\ProgramData\ackrc
credentials-file-location: null
history:
  adoption-history:
    - >
      ack spread through developer package managers because it gave programmers
      grep-like searching with recursive traversal, source-file type detection,
      VCS-directory ignores, highlighting, and project/user configuration.
    - >
      The input package facts list ack across Homebrew, Debian, Ubuntu, Fedora/dnf,
      MacPorts, Nix, Scoop, Chocolatey, Alpine, and openSUSE/zypper, showing unusually
      broad cross-platform packaging for a small CLI.
  package-nerd-significance:
    - >
      ack is important in CLI package history as one of the classic programmer-focused
      grep replacements, alongside later tools such as ag and ripgrep.
    - >
      For package maintainers it is intentionally boring in a useful way: mostly Perl,
      few runtime assumptions, one main executable, and behavior that users expect to be
      identical across Unix, Windows, and package-manager installs.
  project-history:
    - >
      ack was written and maintained by Andy Lester. The ack3 README describes it as a
      code-searching tool similar to grep, portable across platforms that run Perl.
    - >
      The project evolved through major release lines: ack 2.0 in 2013 changed default
      search behavior and ackrc handling, and ack 3.0 in 2019 was the first official ack
      3 release.
  related-projects:
    - Related tools include grep, GNU grep, File::Next, The Silver Searcher, and ripgrep.
  sources:
    - https://beyondgrep.com/changes.txt
    - https://beyondgrep.com/documentation/
    - https://raw.githubusercontent.com/beyondgrep/ack2/dev/Changes
    - https://raw.githubusercontent.com/beyondgrep/ack3/dev/README.md
    - source_facts.package-manager
  summary:
    - >
      ack is a Perl-based source-code search tool, similar to grep but optimized for
      programmers searching large source trees.
  timeline:
    - '2005: ack copyright history begins in the official ack3 README.'
    - '2013: ack 2.0 released with changed defaults and multiple ackrc support.'
    - '2019: ack 3.0.0 becomes the first official ack 3 release.'
    - >
      2026: ack 3.10.0 changelog records security fixes for ANSI escapes and project
      .ackrc handling.
  usage:
    - >
      Typical usage is interactive and recursive, for example running ack PATTERN inside
      a source tree. The official documentation emphasizes default recursion,
      source-aware file selection, filetype filters, match highlighting, and GNU
      grep-like switches.
    - >
      ack reads options from ackrc files, including global, user, project, and
      explicitly supplied ackrc locations, which lets users encode local filetype and
      ignore rules without wrapper scripts.
related-packages:
  - id: brew:ripgrep
    reason: >
      Choose ripgrep when speed, Unicode support, and automatic Git-ignore filtering are
      priorities; its official comparison describes ack as serving the same recursive
      code-search task.
    rel: alternative
    sources:
      - https://github.com/BurntSushi/ripgrep#readme
      - https://beyondgrep.com/feature-comparison/
  - id: brew:the_silver_searcher
    reason: >
      Choose The Silver Searcher for an ack-like interface implemented in C with an
      explicit emphasis on faster code-tree searching.
    rel: alternative
    sources:
      - https://github.com/ggreer/the_silver_searcher#readme
      - https://beyondgrep.com/feature-comparison/
tags:
  - cli
  - code-search
  - grep
  - perl
  - search
