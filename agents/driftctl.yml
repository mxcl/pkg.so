history:
  adoption-history:
    - >
      driftctl was adopted by infrastructure and DevSecOps users because it filled a gap
      between Terraform state and actual cloud-provider state. The official installation
      docs list direct binaries, Docker, Homebrew, and MacPorts, while the README shows
      badges for release downloads and Docker pulls, reflecting distribution beyond
      source builds.
  package-nerd-significance:
    - >
      For package nerds, driftctl is a neat example of a Go-style single-binary cloud
      CLI that shipped through releases, Docker, Homebrew, MacPorts, and distro package
      indexes. It also marks a moment when IaC drift moved from an enterprise-platform
      feature into a small installable tool.
  project-history:
    - >
      The public repository was created in September 2020 and the official docs describe
      the tool as a CLI for measuring infrastructure-as-code coverage and tracking
      drift. Its README now states that the project is in maintenance mode, which makes
      the package historically important as a snapshot of the early standalone
      drift-detection tooling wave.
  related-projects:
    - Terraform is the primary IaC system referenced by driftctl docs and examples.
    - Snyk is the maintaining organization for the repository and documentation.
    - >
      The official Docker image snyk/driftctl is documented as an alternate installation
      and execution path.
  sources:
    - https://github.com/snyk/driftctl
    - https://raw.githubusercontent.com/snyk/driftctl/main/README.md
    - https://docs.driftctl.com/0.40.0/
    - >
      https://raw.githubusercontent.com/snyk/driftctl-docs/main/versioned_docs/version-0.40.0/intro.mdx
    - >
      https://raw.githubusercontent.com/snyk/driftctl-docs/main/versioned_docs/version-0.40.0/installation.mdx
    - >
      https://raw.githubusercontent.com/snyk/driftctl-docs/main/versioned_docs/version-0.40.0/usage.mdx
    - https://formulae.brew.sh/formula/driftctl
  summary:
    - >
      driftctl is a Snyk-maintained infrastructure-drift scanner for Terraform-era IaC
      workflows. It measures how much cloud infrastructure is covered by code and
      reports unmanaged or drifted resources.
  timeline:
    - '2020: Public snyk/driftctl repository created.'
    - '2020: Early v0.1.x tags appear in the public repository.'
    - '2023: v0.40.0 release published and documented as the stable Homebrew version.'
    - '2026: README identifies the project as being in maintenance mode.'
  usage:
    - >
      Typical use centers on driftctl scan, with Terraform state supplied locally, from
      S3, from multiple state files, or by glob. The docs also show AWS credential usage
      through environment variables, named profiles, and Docker mounts for ~/.aws and
      ~/.driftctl.
