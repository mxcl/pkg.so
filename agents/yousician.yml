history:
  adoption-history:
    - >
      Yousician expanded from an instrument-learning product family into a subscription
      platform covering guitar, bass, ukulele, piano, and singing on computers and
      mobile devices.
    - >
      The official company page presents Yousician alongside GuitarTuna as its two
      principal music products and reports a large combined monthly user base.
  package-nerd-significance:
    - >
      For package-manager users, Yousician is notable as a proprietary, account-backed
      desktop application distributed as a macOS cask rather than as an open-source
      command-line package. The cask automates installation of the vendor's launcher.
  project-history:
    - >
      The product originated within the company formerly called Ovelin. In 2015, the
      company announced that it was adopting the Yousician name and launching a namesake
      multi-instrument learning product alongside GuitarTuna, WildChords, and
      GuitarBots.
    - >
      Yousician developed around proprietary audio-recognition technology that listens
      to a learner play and gives immediate feedback on accuracy and timing.
  related-projects:
    - GuitarTuna
    - GuitarBots
    - WildChords
  sources:
    - 'Official company overview: https://yousician.com/company'
    - >
      Official rebranding announcement:
      https://yousician.com/blog/ovelin-rebrands-to-yousician
    - 'Official support center: https://support.yousician.com/hc/en-us'
  summary:
    - >
      Yousician is an interactive music-education application that combines guided
      lessons, songs, exercises, progress tracking, and real-time feedback for several
      instruments and singing.
  timeline:
    - '2015: Ovelin announced its rebranding as Yousician and introduced the namesake product.'
    - >
      2020s: Yousician operates across desktop and mobile platforms as a
      multi-instrument subscription service.
  usage:
    - >
      Learners select an instrument and follow lessons or songs while the application
      listens through a microphone, MIDI connection, or supported audio setup and scores
      timing and accuracy.
    - >
      A Yousician account carries subscription status and learning progress across
      supported applications and devices. The vendor does not document a user-managed
      credentials file or stable configuration-file path.
