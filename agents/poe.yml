history:
  adoption-history:
    - >
      Poe expanded beyond a general AI-chat interface into a cross-platform service and
      creator ecosystem. By November 2023, its official clients covered the web, macOS,
      iOS, and Android in multiple interface languages.
  package-nerd-significance:
    - >
      Poe packages a changing catalog of third-party AI models behind one proprietary
      desktop client and account. For package maintainers, the macOS cask is chiefly a
      delivery wrapper for a continuously evolving hosted service rather than a
      self-contained model runtime.
  project-history:
    - >
      Quora developed Poe as a platform for interacting with bots powered by third-party
      AI models. The service later added user-created prompt bots, server bots,
      interactive apps, creator monetization, and APIs.
  related-projects:
    - >
      Poe exposes models and services from providers including OpenAI, Anthropic,
      Google, Meta, and other AI vendors.
    - >
      The Poe Creator Platform supplies the documentation and protocols used to build
      bots and apps for the service.
  sources:
    - https://creator.poe.com/docs/intro
    - https://help.poe.com/hc/en-us/articles/19944206309524-Poe-FAQs
    - https://poe.com/it/blog/poe-is-now-available-in-eight-new-languages
    - https://poe.com/tos
  summary:
    - >
      Poe is Quora's cross-platform platform for chatting with AI bots and creating
      AI-powered bots and applications.
  timeline:
    - >
      2023-11-13: Poe announced eight additional interface languages across its web,
      macOS, iOS, and Android clients.
    - >
      2026: Official documentation describes Poe as both a multi-model assistant service
      and a platform for prompt bots, server bots, and interactive apps.
  usage:
    - >
      Users sign in, select an official or user-created bot, and submit text or
      multimodal prompts. The available models and the compute-point cost vary by bot.
    - >
      Creators can publish prompt bots, connect server-hosted bots, or build interactive
      applications through the Poe Creator Platform.
