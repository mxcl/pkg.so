id: brew:bettercap
display-name: bettercap
repo: null
docs:
  - https://www.bettercap.org/
  - https://www.bettercap.org/usage/interactive_session
config-file-location:
  unix:
    - ~/bettercap.env
credentials-file-location: null
history:
  adoption-history:
    - >
      bettercap became a common package-manager install for offensive-security labs
      because it combines sniffing, spoofing, Wi-Fi handshakes, BLE enumeration,
      packet/protocol proxies, and a REST/web UI under one executable. Homebrew,
      Debian/Ubuntu, Arch, Alpine, Nix, MacPorts, and openSUSE packaging in the input
      reflects that cross-platform adoption.
    - >
      The GitHub repository's large star and fork counts, Docker image badge, and active
      release stream indicate that bettercap is used beyond macOS packaging: it is a
      standard tool people expect to be available in disposable lab machines,
      containers, and security-focused Unix environments.
  package-nerd-significance:
    - >
      bettercap is package-nerd interesting because it is one of the few security CLI
      packages that collapses many historically separate tools into one Go binary with
      modules, a web UI, REST API, caplets, and packaged defaults. It sits at the
      intersection of classic Unix networking tools, wireless security suites, and
      modern self-contained Go distribution.
    - >
      For Homebrew-style package history, bettercap also illustrates how
      offensive-security tooling moved from language/runtime-heavy installs toward
      portable binaries that can be installed quickly on a laptop, container, or lab
      host and then extended with scripts and modules.
  project-history:
    - >
      The current public repository was created in January 2018 and hosts the Go
      implementation, documentation links, caplets, modules, tests, and release
      automation for bettercap 2.x. The project replaced the older single-purpose idea
      of a LAN MITM helper with a modular framework covering wireless and wired network
      attack surfaces.
    - >
      Official release tags show the 2.x line continuing through regular maintenance and
      feature releases, including v2.40.0 in September 2024, v2.41.0 in January 2025,
      and v2.41.7 in May 2026.
  related-projects:
    - >
      Related tools include Wireshark and tcpdump for packet inspection, aircrack-ng for
      Wi-Fi security workflows, mitmproxy for programmable proxying, nmap for network
      discovery, and ettercap as an older MITM-oriented tool whose niche bettercap
      partly modernized.
  sources:
    - https://api.github.com/repos/bettercap/bettercap
    - https://api.github.com/repos/bettercap/bettercap/releases
    - https://raw.githubusercontent.com/bettercap/bettercap/master/README.md
    - source_facts.package-manager
  summary:
    - >
      bettercap is a Go-based network reconnaissance and attack framework packaged as a
      command-line tool for security researchers, red teamers, and reverse engineers.
      Its official description frames it as an all-in-one toolkit for Wi-Fi, Bluetooth
      Low Energy, HID, CAN-bus, IPv4, and IPv6 reconnaissance and MITM work.
  timeline:
    - >
      2018: Current bettercap/bettercap GitHub repository created for the Go-based 2.x
      project.
    - '2024: v2.40.0 released, showing the mature 2.x line still receiving updates.'
    - '2025: v2.41.0 released.'
    - '2026: v2.41.7 published in May, with repository activity continuing in June.'
  usage:
    - >
      Users typically run bettercap interactively or with caplets to discover hosts,
      inspect traffic, run spoofers, capture Wi-Fi handshakes, enumerate BLE devices, or
      script network experiments. Its official docs emphasize an interactive session
      workflow and module-driven operation rather than a single fire-and-forget scan
      command.
    - >
      Because the tool performs real attack and monitoring functions, its practical use
      belongs in authorized security testing, lab networks, red-team exercises, and
      research settings.
related-packages:
  - id: brew:ettercap
    reason: >
      Choose Ettercap when you want a classic, more narrowly MITM-focused suite with
      unified sniffing, ARP poisoning, filtering, and text or graphical interfaces.
    rel: alternative
    sources:
      - https://github.com/bettercap/bettercap
      - https://ettercap.github.io/ettercap/
  - id: brew:nmap
    reason: >
      Use Nmap for systematic host, port, service, and OS discovery before focusing
      bettercap modules on selected systems during an authorized assessment.
    rel: adjacent_workflow
    sources:
      - https://github.com/bettercap/bettercap
      - https://nmap.org/book/man.html
  - id: brew:wireshark
    reason: >
      Open packet captures from a bettercap monitoring session in Wireshark when you
      need graphical protocol dissection, display filters, and detailed flow analysis.
    rel: adjacent_workflow
    sources:
      - https://www.bettercap.org/modules/ethernet/net_sniff/
      - https://www.wireshark.org/docs/wsug_html_chunked/
tags:
  - bluetooth
  - cli
  - mitm
  - monitoring
  - network-security
  - wifi
