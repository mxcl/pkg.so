id: brew:fusesoc
display-name: FuseSoC
repo: https://github.com/olofk/fusesoc
docs:
  - https://fusesoc.readthedocs.io/en/stable
  - https://fusesoc.readthedocs.io/en/stable/user/package_manager
  - https://fusesoc.net
config-file-location:
  linux:
    - ./fusesoc.conf
    - $XDG_CONFIG_HOME/fusesoc/fusesoc.conf
    - /etc/fusesoc/fusesoc.conf
  macos:
    - ./fusesoc.conf
    - $XDG_CONFIG_HOME/fusesoc/fusesoc.conf
    - /etc/fusesoc/fusesoc.conf
  windows:
    - .\fusesoc.conf
    - '%HOMEPATH%\.config\fusesoc\fusesoc.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      FuseSoC grew into infrastructure for reusable open-source silicon and FPGA
      projects by standardizing how HDL cores declare files, dependencies, parameters,
      generators, and tool targets. Its official documentation describes support for
      Linux, macOS, and Windows and distribution through Python packaging; the supplied
      record additionally shows a Homebrew formula.
  package-nerd-significance:
    - >
      FuseSoC applies package-manager concepts—named packages, dependency resolution,
      registries or libraries, versioned metadata, and reproducible acquisition—to HDL
      intellectual-property cores. This makes it an important bridge between software
      package culture and FPGA/ASIC engineering.
  project-history:
    - >
      FuseSoC was created by Olof Kindgren as a package manager and build abstraction
      layer for FPGA and ASIC development. Over time, build-tool execution was separated
      into the related Edalize project, while FuseSoC retained core discovery,
      dependency management, parameter handling, and orchestration.
    - >
      The project established the CAPI core-description formats and a library model in
      which local or remotely synchronized collections of `.core` files are discovered
      and resolved. The `fusesoc-cores` library serves as an official starting
      collection.
  related-projects:
    - >
      Edalize supplies the EDA backend abstraction used by FuseSoC. `fusesoc-cores` is
      an official core library, and CAPI defines FuseSoC's core metadata format.
  sources:
    - https://fusesoc.net
    - https://fusesoc.readthedocs.io/en/stable/
    - https://fusesoc.readthedocs.io/en/stable/user/package_manager/
    - https://github.com/olofk/fusesoc
    - source_facts.package-manager
  summary:
    - >
      FuseSoC is a cross-platform package manager and build system for reusable FPGA and
      ASIC design cores.
  timeline:
    - 'Early project: Olof Kindgren created FuseSoC to package and build reusable HDL cores.'
    - 'Later architecture: EDA backend handling was factored into the related Edalize project.'
    - >
      CAPI2 era: FuseSoC standardized richer core metadata, targets, parameters,
      generators, and dependencies.
    - >
      Current releases: Official documentation describes FuseSoC 2.x as a Python-based,
      cross-platform hardware package manager and build system.
  usage:
    - >
      Users register local or remote core libraries, select a top-level core and target,
      and let FuseSoC resolve dependencies and invoke appropriate simulation, synthesis,
      or implementation tooling through Edalize. Configuration lookup starts with
      `fusesoc.conf` in the current directory, then the user's XDG-style configuration
      directory, and finally `/etc/fusesoc` on Unix-like systems.
related-packages:
  - id: brew:icarus-verilog
    reason: >
      Icarus Verilog is a supported FuseSoC simulation backend and is the simulator used
      by the official FuseSoC quick-start example.
    rel: adjacent_workflow
    sources:
      - https://github.com/olofk/fusesoc
      - https://fusesoc.net
  - id: brew:verilator
    reason: >
      Verilator is a supported FuseSoC backend for compiling Verilog or SystemVerilog
      designs into fast C++ or SystemC simulation models.
    rel: adjacent_workflow
    sources:
      - https://fusesoc.net
      - https://fusesoc.readthedocs.io/en/stable/user/build_system/eda_flows.html
      - https://verilator.org/guide/latest/
