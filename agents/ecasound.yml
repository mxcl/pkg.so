id: brew:ecasound
display-name: Ecasound
repo: https://github.com/kaivehmanen/ecasound
docs:
  - https://nosignal.fi/ecasound/Documentation
  - https://nosignal.fi/ecasound/Documentation/ecasound_manpage.html
  - https://nosignal.fi/ecasound/Documentation/users_guide/ecasound_users_guide.pdf
config-file-location:
  unix:
    - '{prefix}/share/ecasound/ecasoundrc'
    - ~/.ecasound/ecasoundrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Ecasound's adoption is rooted in Linux and Unix audio culture. The official site
      names GNU/Linux as the primary platform and also mentions FreeBSD, Mac OS X,
      Solaris, and limited Windows support through Cygwin.
    - >
      Package metadata shows it is available across Homebrew, Debian, Ubuntu, Alpine,
      Arch, and Nix, matching its role as a command-line audio utility that is often
      installed from an operating-system package manager rather than embedded as an
      application dependency.
  package-nerd-significance:
    - >
      Ecasound matters to package nerds because it preserves an old-school
      audio-processing model: GPL source releases, man pages, per-user rc files, plugin
      backends, shell automation, and a suite of small utilities. It is a useful
      contrast to GUI DAWs and newer plugin-host ecosystems.
    - >
      Its packaging also captures dependency surface that audio users care about: JACK,
      LADSPA/LV2-era effects, sndfile/FLAC support, scripting interfaces, and cross-Unix
      build portability.
  project-history:
    - >
      The official site states that Ecasound is designed for multitrack audio processing
      and includes a versatile console-mode user interface. The project page is
      copyrighted 1999-2020 by Kai Vehmanen, and the news archive marks June 30, 1999 as
      the date of the first public release, version 1.1.4r1.
    - >
      Across the 2000s and 2010s, release notes show the project accumulating Unix audio
      integrations and operational polish: JACK-related fixes, LADSPA and LV2 plugin
      support, FLAC and sndfile work, Open Sound Control support, Python interface
      changes, and portability fixes for systems such as macOS and Cygwin.
    - >
      The release advertised on the official home page is 2.9.3, released January 11,
      2020. The official changelog points readers to release notes, the NEWS file, and
      the SourceForge gitweb source browser for detailed history.
  related-projects:
    - >
      The Ecasound documentation and news archive place it near JACK, ALSA, LADSPA, LV2,
      libsndfile, FLAC, OSC, and scripting interfaces such as ECI.
    - >
      The official news archive also mentions related front ends and tools such as TkEca
      and ecawave in the broader Ecasound ecosystem.
  sources:
    - https://nosignal.fi/ecasound/
    - https://nosignal.fi/ecasound/news.php
    - https://nosignal.fi/ecasound/history.php
    - https://nosignal.fi/ecasound/Documentation/
    - https://nosignal.fi/ecasound/Documentation/ecasound_manpage.html
    - https://sourceforge.net/p/ecasound/code/ci/master/tree/
  summary:
    - >
      Ecasound is a long-running command-line audio processing package for playback,
      recording, format conversion, multitrack effects, mixing, and signal routing. It
      is one of the older Unix-style audio tools whose appeal comes from scriptability
      and composable command-line processing rather than a graphical workstation
      interface.
  timeline:
    - '1999: First public Ecasound release, 1.1.4r1.'
    - '2007: Ecasound 2.4.6 adds support for a custom configuration resource file.'
    - '2009: Project marks ten years since the first public release.'
    - '2012: Ecasound 2.9.0 released with LV2 support.'
    - '2020: Ecasound 2.9.3 released with Python 3 support and maintenance fixes.'
  usage:
    - >
      Ecasound is commonly used as a CLI engine for audio chains: users define inputs,
      outputs, chain operators, effects, controllers, and routing, then run or script
      processing from a shell. The documentation page points new users to examples,
      tutorials, the user guide, man pages, and programmer/API material.
    - >
      The package also exposes helper tools such as ecaconvert, ecaplay, ecanormalize,
      ecalength, ecamonitor, and ecasignalview, which makes the Homebrew formula feel
      like a small Unix audio toolbox rather than a single executable.
related-packages:
  - id: brew:jack
    reason: >
      JACK is an officially supported real-time audio runtime for Ecasound, allowing its
      inputs and outputs to participate in low-latency audio routing between
      applications.
    rel: adjacent_workflow
    sources:
      - https://github.com/kaivehmanen/ecasound
      - https://jackaudio.org/
  - id: brew:qjackctl
    reason: >
      QjackCtl can manage and patch the JACK server graph used by Ecasound, pairing
      graphical connection control with Ecasound's scriptable audio chains.
    rel: adjacent_workflow
    sources:
      - https://github.com/kaivehmanen/ecasound
      - https://qjackctl.sourceforge.io/
