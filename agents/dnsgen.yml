id: brew:dnsgen
display-name: DNSGen
repo: https://github.com/AlephNullSK/dnsgen
docs:
  - https://github.com/AlephNullSK/dnsgen#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DNSGen's adoption is centered on offensive-security and OSINT workflows. The
      repository is the main upstream surface, while the input metadata shows Homebrew
      packaging for workstation installation.
  package-nerd-significance:
    - >
      DNSGen matters as a small composable recon package: it does candidate generation
      and leaves resolution, filtering, and reporting to other Unix-style tools.
  project-history:
    - >
      The official README presents DNSGen 2.0 as an advanced DNS name permutation
      engine. It generates domain-name variations using insertion, number manipulation,
      affixing, cloud-provider, region, microservice, internal-tooling, and port-prefix
      patterns.
    - >
      The project credits Aleph Null s.r.o. for the original concept and names altdns
      and massdns as related inspiration or workflow neighbors.
  related-projects:
    - altdns is named by the README as an inspiration.
    - massdns is named by the README for DNS resolution workflows.
  sources:
    - https://github.com/AlephNullSK/dnsgen
    - https://github.com/AlephNullSK/dnsgen#readme
    - source_facts.package-manager
  summary:
    - >
      DNSGen is a DNS name permutation CLI for security researchers and penetration
      testers doing subdomain discovery and reconnaissance.
  timeline:
    - >
      2026 batch: Official README documents DNSGen 2.0 and Homebrew input metadata lists
      a packaged CLI.
    - >
      Current README: Project documents Python package installation and development
      setup through pip, uv, and Git.
  usage:
    - >
      Typical usage is to feed DNSGen known domains or hostnames, optionally add a
      custom wordlist, and pipe generated candidates into massdns or another resolver to
      find live subdomains.
related-packages:
  - id: brew:massdns
    reason: >
      DNSGen's official workflow pipes generated hostname candidates into MassDNS for
      high-volume DNS resolution and filtering of live names.
    rel: adjacent_workflow
    sources:
      - https://github.com/AlephNullSK/dnsgen#readme
      - https://github.com/blechschmidt/massdns
