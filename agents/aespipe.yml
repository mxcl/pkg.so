history:
  adoption-history:
    - >
      aespipe persisted because it fits existing Unix archive and image workflows. Its
      examples combine tar, cpio, bzip2, gpg-encrypted key files, mkisofs, dd, and mount
      options instead of inventing a new archive format or backup system.
    - >
      The README also carries practical operational warnings, such as swap exposure when
      gpg handles aespipe keys, and documents build-time choices for hardware AES
      implementations. That makes the project feel closer to systems-operator tooling
      than to a general desktop encryption app.
  package-nerd-significance:
    - >
      aespipe is interesting because it packages a very Unix-shaped abstraction:
      encryption as a pipe filter. It can be chained with archival and disk-image tools
      without forcing users into a monolithic storage system.
    - >
      It also preserves loop-AES compatibility knowledge. For package maintainers and
      old-system operators, aespipe is part of the small-tool layer around encrypted
      block images, removable media, and scriptable archives.
  project-history:
    - >
      aespipe is tied to loop-AES, the Linux loop-device encryption project. loop-AES
      handled encrypted local filesystems and partitions, while aespipe supplied the
      stream-oriented companion for archives, removable media, and compatible encrypted
      images.
    - >
      The current README is dated 2025-04-29 and gives a 2002-2025 copyright range for
      Jari Ruusu. The loop-AES index still publishes aespipe tarballs, signatures,
      README files, ciphers code, and loop-AES material together, reflecting a
      long-maintained small-tool ecosystem rather than a one-off filter.
  related-projects:
    - >
      Related projects include loop-AES, Linux loop devices, gpg, tar, cpio, bzip2,
      mkisofs, dd, Brian Gladman AES implementations, and hardware AES acceleration
      backends.
  sources:
    - https://loop-aes.sourceforge.net/
    - https://loop-aes.sourceforge.net/aespipe.README
    - https://sourceforge.net/projects/loop-aes/files/aespipe/
  summary:
    - >
      aespipe is an AES encrypting and decrypting pipe written by Jari Ruusu and
      distributed from the loop-AES project site. The official README says it reads
      standard input, writes standard output, and can create or restore encrypted tar
      and cpio archives as well as loop-AES-compatible encrypted disk images.
  timeline:
    - '2002: The official README copyright range begins.'
    - '2025-04-29: The official aespipe README date.'
    - '2025-09-02: The loop-AES index shows updated aespipe tarballs and signatures.'
    - '2026-04-15: The loop-AES index shows ongoing updates to the broader loop-AES material.'
  usage:
    - >
      The recurring usage pattern is to let another Unix tool produce or consume a byte
      stream while aespipe handles encryption or decryption in the middle. The README
      shows encrypted compressed tar archives, encrypted CD-ROM images, and adding or
      removing encryption from an existing small filesystem.
    - >
      Build documentation covers portable software AES plus optimized x86, amd64, ARM,
      aarch64, VIA PadLock, Intel AES, and ARM crypto-extension paths. The hardware
      hooks matter because aespipe is often used for bulk data streams rather than tiny
      secrets.
related-packages:
  - id: brew:gnupg
    reason: >
      Use GnuPG alongside aespipe to encrypt its key files, a workflow documented by
      aespipe's official examples.
    rel: adjacent_workflow
    sources:
      - https://loop-aes.sourceforge.net/aespipe.README
      - https://gnupg.org/documentation/index.html
  - id: brew:cpio
    reason: >
      GNU cpio can create or extract the archive stream that aespipe encrypts or
      decrypts in an official documented pipeline.
    rel: adjacent_workflow
    sources:
      - https://loop-aes.sourceforge.net/aespipe.README
      - https://www.gnu.org/software/cpio/manual/
