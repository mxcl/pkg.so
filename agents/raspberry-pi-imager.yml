history:
  adoption-history:
    - >
      Raspberry Pi introduced Imager to simplify a setup process that previously varied
      by host operating system and often required users to locate and flash images
      manually. It became Raspberry Pi's recommended path for installing Raspberry Pi OS
      and other supported systems, with releases for Windows, macOS, Linux, and
      Raspberry Pi OS.
    - >
      Advanced customisation grew from a compact optional panel into a central workflow.
      Raspberry Pi Imager 2.0 made device, operating-system, storage, system
      customisation, and writing into an explicit wizard and added Raspberry Pi Connect
      enrolment.
  package-nerd-significance:
    - >
      Imager replaced a collection of platform-specific flashing instructions with one
      official, cross-platform frontend backed by a remotely supplied OS catalogue. It
      is particularly useful for reproducible headless setups because networking,
      accounts, locale, SSH, and remote-access choices can be embedded before first
      boot.
    - >
      For maintainers and image publishers, its JSON catalogue, custom repository
      option, checksum verification, compressed-image handling, and CLI mode make it
      more than a graphical wrapper around raw disk copying.
  project-history:
    - >
      Raspberry Pi launched Imager on 5 March 2020. The original implementation was
      derived from PiBakery and was completed by Floris Bos, who had also worked on
      NOOBS and PiServer. It was open source from launch.
    - >
      Version 1.5 added OS download telemetry and richer catalogue grouping in December
      2020. Version 1.6 added an advanced options panel in March 2021. Version 2.0,
      released in November 2025, substantially redesigned the interface and elevated OS
      customisation into the main workflow.
  related-projects:
    - Raspberry Pi OS is the default operating system commonly written by Imager.
    - PiBakery was the tool from which the original Imager implementation was derived.
    - NOOBS was an earlier Raspberry Pi installation mechanism.
    - Etcher and `dd` are alternative general-purpose image-writing tools.
  sources:
    - >
      Official 2020 launch announcement:
      https://www.raspberrypi.com/news/raspberry-pi-imager-imaging-utility/
    - >
      Official Imager 2.0 announcement:
      https://www.raspberrypi.com/news/a-new-raspberry-pi-imager/
    - >
      Official documentation:
      https://www.raspberrypi.com/documentation/computers/getting-started.html
    - 'Official v1.5 announcement: https://www.raspberrypi.com/news/raspberry-pi-imager-update/'
    - >
      Official v1.6 announcement:
      https://www.raspberrypi.com/news/raspberry-pi-imager-update-to-v1-6/
  summary:
    - >
      Raspberry Pi Imager is Raspberry Pi's official cross-platform utility for
      selecting, customising, downloading, verifying, and writing operating-system
      images to microSD cards and other boot media.
  timeline:
    - '2020-03-05: Raspberry Pi Imager launched as an open-source imaging utility.'
    - >
      2020-12: Version 1.5 added nested catalogue categories, version tracking, and
      download telemetry.
    - '2021-03: Version 1.6 added advanced preconfiguration options.'
    - >
      2025-11-24: Version 2.0 introduced a new wizard, expanded accessibility, and
      Raspberry Pi Connect setup.
  usage:
    - >
      The standard workflow selects a Raspberry Pi model, an operating system, and a
      target storage device, then optionally preconfigures hostname, locale, user
      credentials, Wi-Fi, SSH, and Raspberry Pi Connect before writing and verifying the
      image. It also accepts custom local images and offers a CLI for scripted writes
      with optional SHA-256 checking.
