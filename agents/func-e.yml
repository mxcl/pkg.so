credentials-file-location: null
history:
  adoption-history:
    - >
      func-e is distributed from GitHub releases, through its install script at
      func-e.io, Homebrew, and winget package facts. Its audience is Envoy and
      service-mesh users who want a repeatable local way to try Envoy versions or
      validate production configuration.
  package-nerd-significance:
    - >
      func-e is a useful package-manager case because it packages not Envoy itself but a
      resolver and launcher around Envoy. The documented XDG-like directory variables
      and override URLs make it friendly to reproducible local testing while still
      depending on external Envoy release metadata.
  project-history:
    - >
      The project presents itself as a small Envoy runner and version manager: install
      func-e, choose or resolve an Envoy build, and run it with a config file or inline
      YAML. Official releases show public versioned distribution beginning with v0.5.0
      in July 2021, v1.0.0 in October 2021, and continued releases through the 1.x
      series.
  related-projects:
    - Envoy is the proxy that func-e downloads and runs.
    - Tetrate's archive endpoint supplies the default Envoy versions JSON used by func-e.
    - >
      Service-mesh workflows are the operational context for validating Envoy
      configuration locally.
  sources:
    - https://func-e.io/
    - https://github.com/tetratelabs/func-e
    - https://github.com/tetratelabs/func-e#readme
    - https://github.com/tetratelabs/func-e/blob/master/USAGE.md
    - https://github.com/tetratelabs/func-e/releases
  summary:
    - >
      func-e is a Tetrate command-line tool for running Envoy. It downloads and selects
      Envoy versions, runs Envoy with a supplied configuration, and stores supporting
      data, logs, and runtime files under documented func-e directories.
  timeline:
    - '2021: v0.5.0 appears in official GitHub releases.'
    - '2021: v1.0.0 appears in official GitHub releases.'
    - '2025: v1.2.0 appears in official GitHub releases.'
    - '2026: v1.6.0 appears in official GitHub releases.'
  usage:
    - >
      The typical workflow is to run func-e with an Envoy config file or inline config,
      list available Envoy versions, select a version with func-e use, or override with
      ENVOY_PATH. It stores Envoy binaries under FUNC_E_DATA_HOME and logs under
      FUNC_E_STATE_HOME by default.
