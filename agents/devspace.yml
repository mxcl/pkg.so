history:
  adoption-history:
    - >
      DevSpace found a niche among Kubernetes development teams that wanted a repeatable
      local-to-cluster workflow without asking every developer to memorize kubectl,
      Helm, image build, port-forwarding, and file-sync commands. CNCF sandbox status
      gave the project a recognizable cloud-native governance home.
  package-nerd-significance:
    - >
      DevSpace is interesting as a package because it packages a whole Kubernetes
      development workflow into one CLI. The formula is not merely a wrapper around
      kubectl; it is a portable workflow runner whose config travels with the repo and
      can standardize local, staging, and production-adjacent routines.
  project-history:
    - >
      The official README says DevSpace was created by Loft Labs and is a Cloud Native
      Computing Foundation sandbox project. The documentation describes it as a
      client-only developer tool: it runs on the user's machine, talks to Kubernetes
      through the normal kube-context, and does not require a server-side DevSpace
      component.
    - >
      DevSpace's configuration model grew around devspace.yaml. The current config
      reference says every project using DevSpace needs a devspace.yaml that defines how
      to build, deploy, debug, and develop the project.
  related-projects:
    - >
      kubectl, Helm, Docker, and Kubernetes are adjacent tools in the workflow DevSpace
      automates.
    - Loft Labs is the original creator and related commercial/cloud-native ecosystem vendor.
  sources:
    - https://github.com/devspace-sh/devspace
    - https://www.devspace.sh/docs/getting-started/development
    - https://www.devspace.sh/docs/configuration/reference
  summary:
    - >
      DevSpace is a command-line tool for developing, deploying, and debugging
      applications with Docker and Kubernetes. Its package-manager identity is centered
      on a single local binary plus a project-level devspace.yaml file that teams commit
      with their source.
  timeline:
    - 'Created by Loft Labs: DevSpace begins as a Kubernetes developer workflow tool.'
    - >
      CNCF sandbox: the official README identifies DevSpace as a Cloud Native Computing
      Foundation sandbox project.
    - >
      6.x docs: the current documentation centers the workflow on devspace.yaml and
      devspace dev.
  usage:
    - >
      The common loop is to initialize or maintain a devspace.yaml, select a Kubernetes
      context and namespace, and run devspace dev. The official docs describe devspace
      dev as executing a configured pipeline, deploying dependencies and manifests,
      starting a development container, syncing files, forwarding ports, and exposing a
      localhost UI.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      DevSpace uses the active Kubernetes kube-context and talks directly to the cluster
      like kubectl, so kubectl is the natural companion for inspecting and administering
      the same environment.
    rel: adjacent_workflow
    sources:
      - https://github.com/devspace-sh/devspace
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:helm
    reason: >
      Choose Helm alongside DevSpace when the development pipeline deploys or customizes
      Helm charts; DevSpace's initialization workflow explicitly supports Helm as a
      deployment method.
    rel: adjacent_workflow
    sources:
      - https://www.devspace.sh/docs/getting-started/initialize-project
      - https://helm.sh/docs/
