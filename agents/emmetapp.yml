history:
  adoption-history:
    - >
      SpeedyHill Technologies distributes emmetapp commercially for macOS under
      one-device and three-device perpetual licenses. The official site advertises
      frequent updates and support for multiple displays.
    - >
      The official site positions emmetapp against established macOS window utilities
      such as Rectangle, Magnet, Moom, and Lasso, emphasizing its combination of tiling
      and window stacking.
  package-nerd-significance:
    - >
      emmetapp represents the polished, keyboard-driven macOS branch of the
      tiling-window-manager ecosystem. Unlike many configuration-oriented tilers, its
      official site explicitly emphasizes custom visual spaces and the absence of
      configuration files.
  project-history:
    - >
      SpeedyHill Technologies developed emmetapp as a macOS workflow and
      window-management application. It combines tiling, stacking, focus switching, and
      resizing around user-defined screen regions called spaces.
  related-projects:
    - The official FAQ compares emmetapp with Rectangle, Magnet, Moom, and Lasso.
  sources:
    - https://emmetapp.com/
  summary:
    - >
      emmetapp is a keyboard-driven macOS window manager that tiles and stacks windows
      in user-defined screen regions.
  timeline:
    - >
      2023: The official product site identifies SpeedyHill Technologies, LLC as the
      publisher.
  usage:
    - >
      Users define screen spaces with a grid or pixel-precise controls, move and resize
      windows into those spaces, cycle through stacked windows, and switch focus from
      the keyboard.
    - >
      The application supports multi-display workflows and is designed to be configured
      through its graphical interface rather than a configuration file.
