history:
  adoption-history:
    - >
      dpcmd's adoption is naturally tied to owners and service benches using DediProg
      SPI flash programmers. Homebrew packaging makes the vendor Linux tool easier to
      install on macOS or Linux systems used for firmware flashing work.
  package-nerd-significance:
    - >
      dpcmd is package-nerd significant as hardware-support plumbing: small,
      vendor-specific, and essential when someone needs to recover or provision SPI
      flash. Its dependencies and build style are boring, which is exactly what
      maintainers want for a flashing tool.
  project-history:
    - >
      The official GitHub repository was created in August 2015 and describes itself as
      Linux software for SF100/SF600. Its README is narrow and practical: install
      libusb, libxml2, and pkg-config, build with make, and use the resulting dpcmd
      binary from the source tree.
    - >
      The public GitHub release list is sparse but shows a 1.2.1.03 release in September
      2017 and V1.14.20.x/V1.14.21.x releases in 2024. That suggests a vendor-maintained
      hardware utility with intermittent public release points rather than a
      community-driven CLI.
  related-projects:
    - >
      dpcmd is related to DediProg SF100 and SF600 programmers, SPI flash workflows,
      libusb, libxml2, and firmware flashing utilities.
  sources:
    - >
      https://github.com/DediProgSW/SF100Linux#readme - official README for purpose,
      dependencies, build instructions, and usage.
    - >
      https://api.github.com/repos/DediProgSW/SF100Linux - official GitHub repository
      metadata.
    - >
      https://api.github.com/repos/DediProgSW/SF100Linux/releases?per_page=100 -
      official GitHub release metadata.
  summary:
    - >
      dpcmd is the command-line program built from DediProg's SF100Linux repository for
      DediProg SF100 and SF600 SPI flash programmers.
  timeline:
    - '2015: GitHub repository created for DediProgSW/SF100Linux.'
    - '2017: GitHub release 1.2.1.03 published.'
    - '2024: V1.14.20.x and V1.14.21.x releases published.'
  usage:
    - >
      The README's basic example writes an image file to a flash chip with ./dpcmd
      --auto image.bin --verify, automatically detecting the chip, updating differing
      contents, reading back, and verifying the write. Advanced usage is delegated to
      dpcmd --help.
