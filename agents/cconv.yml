id: brew:cconv
display-name: cconv
repo: null
docs:
  - https://github.com/xiaoyjy/cconv#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list cconv packages in Homebrew, Debian, Ubuntu, and Nix,
      which is typical for a compact C text-processing utility that remains useful even
      with a quiet upstream.
  package-nerd-significance:
    - >
      cconv is the kind of utility package that survives because it does one culturally
      specific text transformation from the shell. Its interest is mostly practical: it
      exposes Chinese script conversion through familiar iconv-like flags and can be
      installed without a larger runtime.
  project-history:
    - >
      The official README calls cconv a simplified-traditional Chinese conversion tool
      based on iconv and notes that the GitHub repository is the project's new address.
      The GitHub repository was created in 2015, but the ChangeLog shows earlier 0.5 and
      0.6 series development before the current v0.6.3 release line.
  related-projects:
    - >
      GNU libiconv is referenced by the README as the model and underlying
      text-conversion context.
    - >
      OpenCC is a related package-space neighbor for Chinese script conversion, although
      cconv is its own smaller iconv-like tool.
  sources:
    - https://api.github.com/repos/xiaoyjy/cconv
    - https://github.com/xiaoyjy/cconv
    - https://github.com/xiaoyjy/cconv#readme
    - https://formulae.brew.sh/api/formula/cconv.json
  summary:
    - >
      cconv is an iconv-based command-line tool for converting Chinese text between
      Simplified and Traditional forms. In package-manager terms it is a small,
      old-school Unix text filter: narrow purpose, autotools build, and useful in
      pipelines where users need script conversion rather than a larger localization
      framework.
  timeline:
    - '0.5 series: Early cconv releases recorded in the official ChangeLog.'
    - '0.6.0: Cross-handling logic rewritten and conversion conditions expanded.'
    - '0.6.1-0.6.3: Tables and bug fixes updated.'
    - '2015: Official GitHub repository created.'
  usage:
    - >
      The README presents cconv with iconv-style -f and -t encoding options and an
      example converting UTF-8 Simplified Chinese text to utf8-tw Traditional Chinese
      output.
related-packages:
  - id: brew:opencc
    reason: >
      Choose OpenCC when conversion must account for phrases, regional wording, or
      variants across Mainland China, Taiwan, Hong Kong, and Japanese Kanji; cconv
      offers a smaller iconv-style filter.
    rel: alternative
    sources:
      - https://github.com/xiaoyjy/cconv
      - https://opencc.byvoid.com/
