credentials-file-location: null
history:
  adoption-history:
    - >
      GanttProject gained broad desktop adoption through free cross-platform
      distributions and durable `.gan` project files. The project's history records that
      the Windows installer for version 2.0.10 was downloaded 1.7 million times from
      Google Code during an unusually long stable period.
    - >
      The application later added Microsoft Project and spreadsheet interoperability,
      report export, WebDAV collaboration, and the optional commercial GanttProject
      Cloud service while retaining an open-source desktop core.
  package-nerd-significance:
    - >
      GanttProject is a long-lived example of a Java desktop application successfully
      packaged across Linux, macOS, and Windows. Its self-contained macOS distribution
      and support for native Apple Silicon reduce Java-runtime setup friction, while the
      platform-independent archive remains useful to users who manage their own runtime.
    - >
      Its longevity, GPL licensing, readable project-file continuity, and availability
      outside a mandatory SaaS account distinguish it in the project-management
      category.
  project-history:
    - >
      Alexandre Thomas wrote the first GanttProject version while studying at the
      University of Marne-la-Vallée, and registered its SourceForge project on 29
      January 2003. Community developers quickly joined. Version 2.0 followed in 2005,
      and Dmitry Barashev assumed project leadership in 2006.
    - >
      Development moved to Google Code in 2009. BarD Software was founded in 2012 to
      coordinate development and support. Named 2.x series included Praha, Brno,
      Ostrava, and Pilsen; GanttProject 3.0 and GanttProject Cloud entered public beta
      in 2020, with the desktop 3.0 release following in February 2021.
  related-projects:
    - GanttProject Cloud
    - Microsoft Project
    - WebDAV
  sources:
    - https://docs.ganttproject.biz/
    - https://github.com/bardsoftware/ganttproject#readme
    - https://www.ganttproject.biz/about
  summary:
    - >
      GanttProject is a GPL-licensed desktop project-planning application with task
      dependencies, milestones, baselines, Gantt and resource-load charts, cost
      calculation, and document export.
  timeline:
    - '2003-01-29: The GanttProject SourceForge project was registered.'
    - '2005: GanttProject 2.0 was released.'
    - '2006: Dmitry Barashev took over project leadership.'
    - '2009: Development migrated to Google Code.'
    - '2012: BarD Software was founded; the Praha and Brno series were released.'
    - '2015: GanttProject 2.7 Ostrava was released.'
    - '2016: GanttProject 2.8 Pilsen was released.'
    - '2020: GanttProject 3.0 and GanttProject Cloud entered public beta.'
    - '2021-02-01: GanttProject 3.0 was released.'
  usage:
    - >
      Users build a work-breakdown structure, assign dates, dependencies, milestones,
      people, and costs, then inspect the plan through Gantt, PERT, and resource-load
      views.
    - >
      Projects can be exported to PDF, HTML, PNG, CSV, and spreadsheet-oriented formats,
      exchanged with Microsoft Project, or shared through WebDAV and GanttProject Cloud.
