history:
  adoption-history:
    - >
      SlidePilot targets presenters who create PDF decks, particularly users of LaTeX
      Beamer. Its documentation also supports ordinary PDFs, broadening its use beyond
      the TeX community.
    - >
      The project added presenter layouts, PDF and rich-text notes, drawing tools,
      pointers, timing tools, automatic document reload, embedded video support, and an
      iOS remote-control companion.
  package-nerd-significance:
    - >
      SlidePilot is useful to package-oriented LaTeX users because it treats the
      generated PDF as the presentation artifact instead of requiring a proprietary
      authoring format at presentation time. Homebrew Cask provides a reproducible
      installation route for the native macOS application.
    - >
      Its automatic document reload supports the edit-compile-present loop common in
      Beamer workflows, while its public Swift source makes the presentation client
      inspectable and modifiable.
  project-history:
    - >
      SlidePilot was developed as a native Swift application for presenting PDFs on
      macOS, with special attention to notes produced by the LaTeX Beamer class. The
      official repository also serves as its issue, feature-request, and contribution
      venue.
    - >
      The project's release history records the later publication of the full
      application source and continued development of presenter tooling and its
      remote-control companion.
  related-projects:
    - >
      LaTeX Beamer: The presentation document class whose PDF notes workflow receives
      dedicated SlidePilot support.
    - 'SlidePilot Remote: The official iOS companion for controlling presentations.'
    - 'pdfpc: Another presenter console centered on PDF slide decks.'
  sources:
    - https://github.com/SlidePilot/SlidePilot-macOS
    - https://github.com/SlidePilot/SlidePilot-macOS/releases
    - https://slidepilot.gitbook.io/slidepilot
    - https://www.slidepilotapp.com/en/
  summary:
    - >
      SlidePilot is a native, open-source macOS presenter application for PDF slide
      decks, with dedicated support for LaTeX Beamer notes.
  timeline:
    - >
      Initial product: SlidePilot was developed as a macOS PDF presenter focused on
      LaTeX Beamer workflows.
    - 'Version 1.6.0: SlidePilot Remote introduced iPhone-based presentation control.'
    - 'Version 1.6.3: The project announced that SlidePilot was fully open source.'
    - 'Version 1.8.0: The application added persistent and exportable slide drawings.'
  usage:
    - >
      Users open a PDF, configure the presenter layout, and present through separate
      presenter and audience views. They can display current and upcoming slides, use
      Beamer or rich-text notes, point or draw over slides, and monitor presentation
      time.
    - >
      When a source document is rebuilt externally, SlidePilot can reload the resulting
      PDF, making it suitable for live iteration on LaTeX-generated decks.
