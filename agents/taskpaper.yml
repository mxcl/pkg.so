history:
  adoption-history:
    - >
      TaskPaper has served Mac users since 2006 and encouraged an ecosystem of
      compatible applications by keeping its document format plain-text and openly
      editable.
  package-nerd-significance:
    - >
      TaskPaper appeals to package-oriented users because its primary data is portable
      text rather than an opaque database. Its JavaScript API, scripts, themes, and
      editor-compatible files also make it unusually automation-friendly for a desktop
      task manager.
  project-history:
    - >
      Jesse Grosjean of Hog Bay Software began developing TaskPaper in 2006. TaskPaper 3
      thoroughly modernized the application while retaining the original plain-text
      foundation. The developer now describes it as finished, polished software that
      will continue to track current macOS releases without pursuing major new features.
  related-projects:
    - >
      Bike is another Hog Bay Software outliner. TaskPaper-compatible applications can
      consume the same plain-text format.
  sources:
    - "Official User's Guide: https://guide.taskpaper.com/"
    - 'Official homepage: https://www.taskpaper.com/'
    - 'Official release notes: https://www.taskpaper.com/releases/'
  summary:
    - >
      TaskPaper is a macOS plain-text task manager and outliner created by Hog Bay
      Software. Projects, tasks, notes, and tags remain readable in ordinary text
      editors.
  timeline:
    - '2006: TaskPaper development began.'
    - >
      TaskPaper 3: The application was modernized while preserving its original
      plain-text foundation.
  usage:
    - >
      Users type projects, tasks, notes, and @tags into plain-text documents, then fold,
      focus, search, and filter the resulting outline. Scripts, themes, dates, and
      Reminders integration support more elaborate workflows.
