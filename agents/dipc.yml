history:
  adoption-history:
    - >
      dipc's official README documents Cargo, Homebrew, Nix, source, and community AUR
      installation paths. That spread is typical of small Rust CLIs: Cargo provides the
      language-native channel, while Homebrew and Nix make it easier to include in
      desktop image and wallpaper workflows.
  package-nerd-significance:
    - >
      dipc is a compact example of theme-culture packaging: color schemes such as
      Catppuccin, Dracula, Gruvbox, Nord, Rose Pine, Solarized, and Tokyo Night become a
      command-line image-processing interface. It is interesting less as a huge
      ecosystem package and more as a modern desktop-customization CLI with multiple
      package-manager entry points.
  project-history:
    - >
      The public repository was created in April 2023. Early releases built out the CLI,
      theme support, batch image processing, CIELAB DeltaE method selection, and later
      an interactive TUI for choosing files, palettes, variations, and output names.
  related-projects:
    - >
      dipc's practical neighborhood is the color-theme ecosystem and image-processing
      pipelines rather than one direct upstream project. Its README names built-in
      palettes including Catppuccin, Dracula, Everforest, Gruvbox, Kanagawa, Nord, Rose
      Pine, Solarized, and Tokyo Night.
  sources:
    - https://api.github.com/repos/doprz/dipc
    - https://github.com/doprz/dipc#readme
    - https://api.github.com/repos/doprz/dipc/releases?per_page=5
  summary:
    - >
      dipc is a Rust command-line image palette converter for recoloring images and
      wallpapers with named color palettes and themes. Its README describes a
      deliberately focused Unix-style tool that does one image-conversion job and
      supports stdin/stdout pipelines.
  timeline:
    - '2023: Public GitHub repository created.'
    - >
      2023: v1.0.0 release adds a rewritten CLI, user-provided themes, batch processing,
      and DeltaE options.
    - '2025: v1.1.0 release adds stdin/stdout support and Nix flake improvements.'
    - '2025: v1.2.0 release adds an interactive TUI.'
  usage:
    - >
      Users pass a built-in palette name, a JSON theme path, or inline JSON plus one or
      more image files. The README shows directory conversion, multiple input images,
      output renaming, style selection, DeltaE method selection, TUI mode, and pipelines
      such as screenshot capture into dipc and then into another image tool.
