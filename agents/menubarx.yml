history:
  adoption-history:
    - >
      MenubarX is distributed as a macOS productivity application with both free and Pro
      functionality. Its official site presents web applications and progressive web
      applications as its primary use case, while its release history shows sustained
      compatibility work for changing macOS menu-bar behavior and web services.
  package-nerd-significance:
    - >
      MenubarX turns arbitrary web services into lightweight menu-bar tools, covering a
      niche between browser tabs, progressive web applications, and native clients.
      Package users can install one shell for many dashboards and services instead of
      maintaining separate desktop wrappers.
  project-history:
    - >
      MenubarX was developed by 6X Studio as a macOS menu-bar browser. It provides
      tabbed web views with pinning, detached windows, resizing, user-agent switching,
      bookmarks, automatic refresh, notifications, and progressive-web-application
      workflows.
    - >
      The official release history records continued additions including custom scripts
      and style sheets, iCloud synchronization, local-file previews, compatibility modes
      for menu-bar managers, picture-in-picture, multilingual support, transparency
      controls, and custom proxy support.
  related-projects:
    - >
      MenubarX overlaps with site-specific browsers, progressive web applications, and
      macOS menu-bar management utilities such as Bartender and Hidden Bar.
  sources:
    - https://menubarx.app/
    - https://menubarx.app/faq/
    - https://menubarx.app/version/
  summary:
    - >
      MenubarX is a macOS menu-bar browser that keeps websites and web applications
      available in compact, configurable windows.
  timeline:
    - >
      2022: The official release history documents the 1.4 and 1.5 release series,
      including permissions, URL schemes, and per-window shortcuts.
    - >
      2023: Releases added custom scripts and styles, iCloud synchronization, custom
      home pages, and broader language support.
    - '2024: Version 1.7 introduced a redesigned menu-bar layout and icons.'
    - '2025: Version 1.7.6 added custom HTTP and SOCKS5 proxy support.'
  usage:
    - >
      Users create menu-bar tabs for websites, choose desktop or mobile user agents, pin
      or detach windows, configure refresh intervals, use bookmarks and shortcuts, and
      keep services such as messaging, calendars, media controls, or dashboards readily
      accessible.
