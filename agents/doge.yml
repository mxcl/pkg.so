history:
  adoption-history:
    - >
      doge is a small package-manager preservation story rather than a broad ecosystem
      tool. Its official README lists Homebrew, Cargo, and Arch-style installation
      routes, and the GitHub repository remains modest in size compared with its
      better-known predecessor dog and the Go reimplementation doggo.
  package-nerd-significance:
    - >
      doge matters mostly because it shows how beloved CLI tools survive after upstream
      momentum slows: a renamed fork, package-manager formulas, and a tiny maintenance
      community keep a useful command installable.
  project-history:
    - >
      The current doge repository was created in February 2024 and describes itself as
      reviving a command-line DNS client forked from ogham/dog. Its README keeps the
      original dog-like usage model: quick hostname queries, record-type arguments,
      named resolvers, JSON output, and optional DNS-over-TLS or DNS-over-HTTPS
      transports.
    - >
      The first GitHub release in the revived repository was v0.2.1-beta in February
      2024, labeled as a return of the project, followed by stable-looking 0.2.x
      releases through v0.2.9 in August 2025.
  related-projects:
    - >
      doge is directly related to ogham/dog, the Rust DNS client it forked from, and
      overlaps in purpose with doggo, dig, drill, and curl/doh.
  sources:
    - https://github.com/Dj-Codeman/dog_community#readme
    - https://api.github.com/repos/Dj-Codeman/dog_community
    - https://github.com/Dj-Codeman/dog_community/releases/tag/v0.2.1-beta
    - https://github.com/Dj-Codeman/dog_community/releases/tag/v0.2.9
  summary:
    - >
      doge is a community-maintained continuation of the Rust DNS lookup tool dog,
      keeping the short, colorful CLI style while adding packaging and maintenance
      around a new executable name.
  timeline:
    - '2024: doge repository created as a revival/fork of ogham/dog.'
    - '2024: v0.2.1-beta published as the first GitHub release in the revived repository.'
    - '2025: v0.2.9 published, continuing the 0.2.x maintenance line.'
  usage:
    - >
      Users reach for doge as a friendlier dig-style DNS client: short command forms for
      A, MX, and other records, explicit nameserver selection, TCP/UDP/TLS/HTTPS
      transport switches, and JSON output for scripts.
related-packages:
  - id: brew:doggo
    reason: >
      Choose doggo for a cross-platform Go client with DoQ, DNSCrypt, EDNS features,
      reverse lookups, and dedicated documentation; choose doge for the Rust dog lineage
      and its compact familiar interface.
    rel: alternative
    sources:
      - https://dog.ramfield.net/
      - https://doggo.mrkaran.dev/docs
  - id: brew:q
    reason: >
      Choose q when you need additional encrypted transports such as DoQ and ODoH plus
      JSON or YAML output, while doge offers the maintained dog-style interface.
    rel: alternative
    sources:
      - https://dog.ramfield.net/
      - https://github.com/natesales/q#readme
  - id: brew:bind
    reason: >
      Choose BIND when you need the established dig client together with
      authoritative-server, resolver, DNSSEC, and administration tooling; doge is a
      smaller lookup-focused package.
    rel: alternative
    sources:
      - https://github.com/Dj-Codeman/dog_community#readme
      - https://www.isc.org/bind/
