history:
  adoption-history:
    - >
      The README documents Homebrew installation and manual copying of the shell script.
      Repository metadata captured during this run showed a few hundred GitHub stars,
      consistent with a niche but useful macOS administration utility.
  package-nerd-significance:
    - >
      maclaunch matters to package and system tinkerers because launchd agents and
      daemons are a common side effect of installing Mac software. A small CLI that
      filters and toggles them gives Homebrew-era Mac users a scriptable way to audit
      what starts automatically.
  project-history:
    - >
      The official repository was created in January 2017. Its scope is intentionally
      narrow: enumerate startup mechanisms such as LaunchAgents, LaunchDaemons, kernel
      extensions, system extensions, hooks, emond scripts, and cron scripts, then toggle
      them without rewriting their files.
  related-projects:
    - >
      The tool is related to `launchctl`, `kextutil`, `systemextensionsctl`, and other
      macOS startup-management surfaces that it wraps or inspects.
  sources:
    - https://api.github.com/repos/hazcod/maclaunch
    - https://github.com/hazcod/maclaunch
    - https://github.com/hazcod/maclaunch#readme
    - source_facts.package-manager
  summary:
    - >
      maclaunch is a shell-based macOS CLI for listing, enabling, and disabling startup
      items. The README positions it as a way to inspect persistent launch mechanisms
      and control them with native macOS tools.
  timeline:
    - '2017: Official GitHub repository created.'
    - '2023: Repository activity continued through commits pushed to the default branch.'
  usage:
    - >
      Typical commands are `maclaunch list`, `maclaunch list enabled`, `maclaunch list
      system`, `maclaunch enable <filter>`, and `maclaunch disable <filter>`. The README
      also documents `ML_SYSTEM` for showing or hiding likely-uninteresting system
      startup items.
