history:
  adoption-history:
    - >
      The developers originally built Archaeology for their own product debugging and
      day-to-day macOS investigations. They released it publicly after repeatedly
      finding the internal tool useful, while continuing to characterize it as
      deliberately niche.
  package-nerd-significance:
    - >
      Archaeology consolidates inspection of numerous nested, obscure, or Apple-specific
      binary formats into one native interface. It is particularly relevant to macOS
      developers, reverse engineers, and packaging specialists investigating bundles,
      code signatures, receipts, provisioning profiles, property lists, and Mach-O
      binaries.
  project-history:
    - >
      Mothers Ruin Software created Archaeology as an internal debugging utility before
      making it publicly available. Its decoders combine public platform APIs with
      reverse engineering for formats that lack public specifications or APIs. The
      official release history documents continuing updates for changes in macOS binary
      formats.
  related-projects:
    - trowel
    - Apparency
    - Legion
  sources:
    - https://www.mothersruin.com/software/Archaeology/
    - https://www.mothersruin.com/software/Archaeology/formats.html
    - https://www.mothersruin.com/software/Archaeology/relnotes.html
    - https://www.mothersruin.com/software/Archaeology/reverse/
    - https://www.mothersruin.com/software/Archaeology/use.html
  summary:
    - >
      Archaeology is a macOS utility for recursively identifying and decoding binary
      file formats, including many Apple-specific structures.
  timeline:
    - The project began as an internal debugging tool at Mothers Ruin Software.
    - '2025: Version 1.5 was released with support for newer URL Bookmark formats.'
  usage:
    - >
      Users open or drag a file into Archaeology, inspect its decoded representation,
      and recursively decode embedded data. Values can be searched, copied, exported,
      hashed, or opened in a hex editor. The bundled trowel command-line tool can ask
      the GUI to open a path.
