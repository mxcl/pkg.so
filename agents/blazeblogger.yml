id: brew:blazeblogger
display-name: BlazeBlogger
repo: https://code.google.com/archive/p/blazeblogger
docs:
  - http://docs.blackened.cz/en-US/BlazeBlogger/1.2.0/html/User_Guide/index.html
  - http://blaze.blackened.cz/documentation
config-file-location:
  unix:
    - .blaze/
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site archives release and packaging posts for Debian, Fedora, Gentoo,
      Slackware, and Ubuntu, while the input package facts also list Homebrew, MacPorts,
      Nix, pacman, and zypper names. Its audience was the Unix user who wanted blog
      publishing to feel like editing files and running commands.
  package-nerd-significance:
    - >
      BlazeBlogger is package-nerd interesting because it is a static site generator
      before that category fully consolidated around Git-hosted Markdown workflows. It
      reflects an era when distribution packages, manpage-like commands, and local
      directory state were enough to make a personal publishing stack.
  project-history:
    - >
      The official site describes BlazeBlogger as a simple but capable command-line CMS
      that produces static content without a database server or server-side scripting.
      The site footer and metadata place the project site in the 2009-2011 period and
      identify Jaromir Hradilek as the copyright holder.
    - >
      The documentation page records the 1.2.0 User Guide and points to the Google Code
      project page, bug tracker, discussion group, and downloadable quick-reference
      material.
  related-projects:
    - >
      Related projects include other static site generators and command-line blog tools
      such as nanoblogger, Jekyll, ikiwiki, and the author's linked pidiblog project.
  sources:
    - http://blaze.blackened.cz/documentation
    - http://docs.blackened.cz/en-US/BlazeBlogger/1.2.0/html/User_Guide/index.html
    - https://code.google.com/archive/p/blazeblogger
    - input source_facts.executables
    - input source_facts.package-manager
  summary:
    - >
      BlazeBlogger is a Perl-based command-line CMS/static-blog generator from the
      late-2000s wave of lightweight, database-free publishing tools. It targets users
      who want a site generated from local files rather than a server-side blog engine.
  timeline:
    - >
      2009: Official site archive begins and site metadata uses BlazeBlogger 1.2.0 as
      generator.
    - '2010: Official archive includes distro packaging posts and 1.1.x releases.'
    - >
      2011: BlazeBlogger 1.2.0 and its User Guide are published; official site shows
      Slackware package news in May.
  usage:
    - >
      The Homebrew package exposes the `blaze` front command and helper commands
      including `blaze-init`, `blaze-add`, `blaze-edit`, `blaze-list`, `blaze-make`, and
      `blaze-config`. The curated config location is the local `.blaze/` project
      directory.
related-packages:
  - id: brew:hugo
    reason: >
      Choose Hugo for an actively documented static-site workflow with richer content
      types, templates, modules, asset processing, and deployment support; BlazeBlogger
      offers a smaller blog-specific command suite.
    rel: alternative
    sources:
      - http://blaze.blackened.cz/documentation
      - https://gohugo.io/documentation/
tags:
  - blogging
  - cli
  - cms
  - perl
  - static-site
