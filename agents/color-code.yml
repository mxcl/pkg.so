history:
  adoption-history:
    - >
      ColorCode entered Debian packaging in December 2009, which is the most visible
      upstream-cited adoption milestone. The supplied Homebrew metadata also maps it to
      Debian and Ubuntu packages, making it a small cross-distribution desktop game
      rather than a single-manager formula.
  package-nerd-significance:
    - >
      ColorCode is a representative example of Homebrew carrying lightweight open-source
      desktop software alongside CLI tools. Its upstream history also shows the usual
      long tail of small Qt applications: source tarballs and distro packaging matter
      more than a large hosted forge presence.
  project-history:
    - >
      The project had a dedicated website by October 2009, shortly after the 0.5
      release. Its early releases expanded the game from a configurable MasterMind clone
      into a richer puzzle implementation with alternate game modes,
      accessibility-oriented scaling, preferences, a timer, stored game lists, and a
      built-in solver.
  related-projects:
    - >
      The project is explicitly positioned as a MasterMind clone and solver. Its
      package-manager footprint links it to desktop game packaging in Debian, Ubuntu,
      and Homebrew.
  sources:
    - http://colorcode.laebisch.com/
  summary:
    - >
      ColorCode is a GPL-licensed Qt MasterMind clone by Dirk Laebisch. It is packaged
      less as a Unix command-line tool than as a small desktop puzzle game that happens
      to be distributed through Unix package managers.
  timeline:
    - '2009: ColorCode 0.5 released and the dedicated project website launched.'
    - '2009: Debian packaging announced by upstream.'
    - '2010: ColorCode 0.6 added a second game mode and settings dialogs.'
    - '2011: ColorCode 0.7 added separate solver and timer threads plus game lists.'
    - '2015: ColorCode 0.8.5 became the first feature-complete Qt 5 release.'
    - '2023: ColorCode 0.8.7 added CMake as a build option while keeping qmake.'
  usage:
    - >
      Users run the `colorcode` executable to play MasterMind variants with configurable
      color counts, column counts, duplicate-peg rules, predefined difficulty levels,
      and optional solver assistance.
