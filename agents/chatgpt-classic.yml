history:
  adoption-history:
    - >
      OpenAI continues to support ChatGPT Classic for users of the previous macOS
      desktop experience, while directing agentic and Codex workflows toward the newer
      unified application.
  package-nerd-significance:
    - >
      The cask preserves access to a superseded but supported desktop client. It is
      useful where users deliberately need the classic application rather than silently
      migrating to OpenAI's newer desktop architecture.
  project-history:
    - >
      OpenAI originally distributed the application as its ChatGPT desktop client for
      macOS. On July 9, 2026, OpenAI renamed the previous client ChatGPT Classic when it
      introduced a newer unified ChatGPT desktop application combining Chat, Work, and
      Codex.
  related-projects:
    - ChatGPT
    - Codex
