    - source_facts.package-manager
  summary:
    - >
      ChatGPT Classic is OpenAI's previous native ChatGPT application for macOS,
      retained as a separately packaged client after the introduction of a newer unified
      desktop application.
  timeline:
    - '2026-07-09: The previous macOS ChatGPT app was renamed ChatGPT Classic.'
  usage:
    - >
      Install it when the older ChatGPT desktop experience is specifically required.
      OpenAI recommends the newer ChatGPT application for agentic features and Codex.
      The classic app supports macOS 14 on Apple Silicon or Intel hardware.
