history:
  adoption-history:
    - >
      Pinta became a cross-platform option for users wanting a lightweight, approachable
      bitmap editor with layers and effects. Official materials support Linux, macOS,
      Windows, and BSD-family systems, and the project is distributed through several
      operating-system package ecosystems.
  package-nerd-significance:
    - >
      Pinta occupies the useful space between basic paint programs and larger editors
      such as GIMP. Package users value it as a native, open-source image editor with a
      comparatively small conceptual footprint and broad desktop portability.
    - >
      Its GTK and .NET lineage also makes Pinta an interesting packaging case:
      maintainers must integrate a managed application with native GTK dependencies
      across several operating systems.
  project-history:
    - >
      Pinta was created by Jonathan Pobst in 2010 as a GTK-based program inspired by
      Paint.NET. Its official repository notes that some Paint.NET code was reused under
      its license.
    - >
      The official user guide says Pobst maintained Pinta through version 1.0, after
      which a development community continued the project. It subsequently remained an
      actively maintained free and open-source application and expanded from its
      original GTK# environment to current GTK and .NET technology.
  related-projects:
    - Paint.NET is Pinta's principal design and code-lineage influence.
    - >
      GIMP is a more feature-rich open-source image editor commonly considered alongside
      Pinta, while Microsoft Paint and Paintbrush represent the simpler paint-program
      niche it also serves.
  sources:
    - 'Official homepage: https://www.pinta-project.com/'
    - 'Official repository README: https://github.com/PintaProject/Pinta'
    - 'Official user guide: https://www.pinta-project.com/user-guide/'
  summary:
    - >
      Pinta is a free, open-source, cross-platform bitmap drawing and image-editing
      application. It combines familiar paint tools with layers, adjustments, effects,
      and unlimited undo while emphasizing a straightforward interface.
  timeline:
    - '2010: Jonathan Pobst created Pinta as a GTK-based editor inspired by Paint.NET.'
    - >
      After version 1.0: Maintenance transitioned from the original author to the wider
      Pinta development community.
  usage:
    - >
      Users employ Pinta for drawing, pixel art, screenshots, basic photo retouching,
      resizing and rotating images, layered compositions, and applying effects. It is
      commonly chosen when a full professional graphics suite would be unnecessarily
      complex.
