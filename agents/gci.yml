history:
  adoption-history:
    - >
      GCI adoption is clearest in Go tooling workflows rather than end-user
      applications. Its README points CI users toward golangci-lint, and the repository
      includes a .golangci.yml that enables the gci linter alongside gofmt, gofumpt, and
      goimports.
    - >
      Official GitHub repository metadata showed several hundred stars and dozens of
      forks by mid-2026, a modest but real signal for a specialized Go formatter.
  package-nerd-significance:
    - >
      GCI is package-nerd relevant because import sorting is a tiny behavior that
      creates outsized diff churn in Go repositories. Pinning a deterministic formatter
      in package managers and CI makes formatting a reproducible build-adjacent rule
      instead of a reviewer preference.
    - >
      Its section model gives teams a stricter import taxonomy than goimports alone,
      which makes it useful in repositories that care about separating standard-library,
      third-party, local-module, and custom-prefix imports.
  project-history:
    - >
      The official GitHub repository was created on July 15, 2020, and the first listed
      GitHub release, v0.1, was published on July 21, 2020.
    - >
      The README documents steady feature evolution in the 0.x line, including C import
      block handling since v0.9.0 and a v0.10.0 command-line change requiring repeated
      -s/--section flags for multiple sections.
  related-projects:
    - >
      The README explicitly positions GCI near goimports by noting that it allows more
      custom formatting than goimport does.
    - >
      The repository configuration and README connect GCI to golangci-lint, gofmt,
      gofumpt, and goimports in normal Go CI formatting workflows.
  sources:
    - https://api.github.com/repos/daixiang0/gci
    - https://api.github.com/repos/daixiang0/gci/releases?per_page=100
    - https://github.com/daixiang0/gci
    - https://raw.githubusercontent.com/daixiang0/gci/master/.golangci.yml
    - https://raw.githubusercontent.com/daixiang0/gci/master/README.md
  summary:
    - >
      GCI is a Go command-line formatter focused on deterministic import ordering. Its
      README describes it as a tool that controls Go package import order and makes that
      order deterministic.
    - >
      The project exists in the same formatting niche as gofmt and goimports, but its
      distinguishing feature is configurable import sections for teams that want more
      structure than default Go formatting provides.
  timeline:
    - '2020: Repository created on July 15'
    - '2020: v0.1 released on July 21'
    - '2022: v0.9.0 released on November 25'
    - '2023: v0.10.0 released on March 10'
    - '2026: v0.14.0 released on February 28'
  usage:
    - >
      The README recommends installing with go install github.com/daixiang0/gci@latest
      or with an explicit version. The CLI provides print, write, list, and diff modes
      so it can either report formatting drift or rewrite files in place.
    - >
      GCI groups imports into sections such as standard, default, custom prefix, blank,
      dot, alias, and localmodule. Local module detection reads go.mod or go.work in the
      directory where gci is invoked.
related-packages:
  - id: brew:goimports
    reason: >
      Choose goimports when automatically adding and removing imports alongside
      gofmt-style formatting is more important than GCI's configurable import-section
      ordering.
    rel: alternative
    sources:
      - https://github.com/daixiang0/gci#readme
      - https://pkg.go.dev/golang.org/x/tools/cmd/goimports
  - id: brew:golangci-lint
    reason: >
      golangci-lint embeds GCI as an autofixing formatter, allowing its section-order
      rules to run with the rest of a repository's lint and formatting checks.
    rel: adjacent_workflow
    sources:
      - https://golangci-lint.run/docs/formatters/configuration/#gci
      - https://github.com/daixiang0/gci#readme
