history:
  adoption-history:
    - >
      Crescendo attracted interest as an open-source example of Apple's Endpoint
      Security Framework and as a ready-made event viewer. Its repository also exposes a
      reusable Swift framework and a command-line component for developers investigating
      the same APIs.
    - >
      Installation through Homebrew Cask provides a convenient route to the compiled
      macOS application, although operation still requires approval of its system
      extension and Full Disk Access.
  package-nerd-significance:
    - >
      Crescendo is useful both as an endpoint event viewer and as reference code for a
      macOS security API whose entitlement, signing, system-extension, and privacy
      requirements make small experiments unusually difficult to package.
    - >
      Its combination of GUI application, command-line component, framework wrapper, and
      privileged system extension illustrates the packaging complexity of modern macOS
      security software.
  project-history:
    - >
      Crescendo was created as a Swift-based real-time event viewer for macOS using
      Apple's Endpoint Security Framework. The project consists of a system extension, a
      framework wrapper, and an application that presents captured events.
    - >
      The initial packaged release announced that Crescendo was ready to monitor
      activity on a Mac. A subsequent release added daemon-style operation, process
      blacklisting, event purging, and interface improvements.
  related-projects:
    - Apple Endpoint Security Framework
    - macOS system extensions
    - Console.app
  sources:
    - https://github.com/SuprHackerSteve/Crescendo#readme
    - https://github.com/SuprHackerSteve/Crescendo/releases
  summary:
    - >
      Crescendo is an open-source macOS endpoint-security event viewer written in Swift.
      It displays real-time system events collected by a privileged system extension.
  timeline:
    - >
      Initial public release: Crescendo v1.0.3 introduced the packaged event-monitoring
      application.
    - >
      Crescendo v1.0.4: Added daemon mode, process blacklisting, event purging, and
      interface improvements.
  usage:
    - >
      Move Crescendo to `/Applications`, start it, approve the system extension, and
      grant the extension Full Disk Access in macOS privacy settings.
    - >
      The application displays Endpoint Security events for investigation. Its blacklist
      feature can prevent configured executable paths from launching.
    - >
      Developers can build the example CLI or embed the framework, but production builds
      require Apple's endpoint-security entitlement and appropriate signing.
