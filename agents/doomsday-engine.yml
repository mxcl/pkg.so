credentials-file-location: null
history:
  adoption-history:
    - >
      Doomsday grew from a Hexen-focused OpenGL port into a shared engine for Doom,
      Heretic, and Hexen. Official distribution has included Windows and macOS
      applications, Linux packages, distribution repositories, and Flatpak builds.
    - >
      Its audience includes players seeking enhanced graphics and modern controls as
      well as mod authors using packages, definitions, plugins, and the engine's
      scripting facilities.
  package-nerd-significance:
    - >
      Doomsday is a long-running example of the source-port ecosystem that followed
      commercial release of classic game-engine source code. Its modularization of
      several related games into one engine is especially relevant to maintainers
      packaging shared runtime code separately from copyrighted game data.
    - >
      The project also spans several packaging eras: manually installed ports,
      distribution packages, automated development builds, a graphical frontend, and
      Flatpak delivery.
  project-history:
    - >
      Jaakko Keränen began the project in May 1999 as JHexen, an OpenGL-enhanced Windows
      port of Raven Software's released Hexen source code. The first versions appeared
      in late 1999 and early 2000.
    - >
      During 2000, study of the related Doom, Heretic, and Hexen codebases led the
      project to extract their common systems into a game-independent engine. The
      resulting Doomsday Engine uses game modules while sharing rendering, audio, input,
      networking, and other infrastructure.
  related-projects:
    - Doom
    - Heretic
    - Hexen
    - JHexen
    - jDoom
    - jHeretic
  sources:
    - https://dengine.net/source
    - https://manual.dengine.net/doomsday_engine
    - https://manual.dengine.net/guide/configuration
    - https://manual.dengine.net/version
  summary:
    - >
      Doomsday Engine is an enhanced, modular source port for Doom, Heretic, and Hexen
      on Windows, macOS, and Linux.
  timeline:
    - '1999: Jaakko Keränen began JHexen in May; the first versions followed later that year.'
    - '2000: The project broadened into the game-independent Doomsday Engine.'
    - '2012: The 1.9 series moved major platform services from SDL to Qt and C++.'
    - '2017: Doomsday 2 introduced a redesigned Home interface and package-oriented workflows.'
    - >
      2019: Version 2.2 added further scripting and modding facilities plus Flatpak
      distribution.
  usage:
    - >
      Players provide compatible Doom, Heretic, or Hexen game data, select a game
      profile, and launch it through Doomsday's frontend. Configuration covers controls,
      rendering, audio, data-file paths, packages, and persistent interface state;
      command-line response files support repeatable launch profiles.
