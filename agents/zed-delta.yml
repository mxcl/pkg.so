id: cask:zed-delta
display-name: Delta
repo: null
docs:
  - https://delta.dev/docs/concepts/core-concepts
  - https://delta.dev/docs/configuration/settings
  - https://delta.dev/docs/getting-started
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/delta/settings.json
    - ~/.config/delta/settings.json
  macos:
    - ~/Library/Application Support/delta/settings.json
  windows:
    - '%APPDATA%\delta\settings.json'
credentials-file-location:
  unix:
    - ~/.config/delta/.env
  windows:
    - '%USERPROFILE%\.config\delta\.env'
history:
  adoption-history:
    - >
      Zed Industries introduced Delta in private beta on August 12, 2026. After
      early-access testing by thousands of applicants, the company opened a public beta
      on September 16, 2026 for macOS, Linux, Windows, and the web.
    - >
      At the public-beta announcement, Zed Industries reported that its 33-person team
      had landed 570 changes to Delta's main branch after replacing pull requests on
      Delta's own repository with Delta-native collaboration.
  package-nerd-significance:
    - >
      Delta is notable for treating an agent conversation, its evolving checkout, review
      comments, and fine-grained file history as one shareable artifact rather than
      reducing agent work to a final Git diff.
    - >
      Its DeltaDB layer complements Git instead of replacing normal repositories and
      commits. For tooling enthusiasts, this makes Delta an experiment in agent-native
      collaboration, continuous worktree replication, and review between commits.
  project-history:
    - >
      Delta was created by Zed Industries as a separate application built around
      DeltaDB, a synchronization and version-control layer that records fine-grained
      changes alongside human and agent conversations. The company chose a new client
      rather than initially embedding the system in the Zed editor.
    - >
      The initial product centered on multiplayer agent threads, synchronized checkouts,
      contextual review, and compatibility with existing Git repositories. It progressed
      from private beta in August 2026 to public beta in September 2026.
  related-projects:
    - "DeltaDB: Delta's fine-grained version-control and synchronization layer."
    - >
      Zed: the open-source editor from the same company; Zed Industries says DeltaDB
      will eventually come to Zed.
    - 'Git: remains the repository and commit layer beneath Delta projects.'
    - 'Claude Code and other model providers: agent and model integrations supported by Delta.'
  sources:
    - 'Input package identity: source_facts.package-manager.brew-cask'
    - 'Official Delta and Git guide: https://delta.dev/docs/concepts/delta-and-git'
    - 'Official Delta documentation: https://delta.dev/docs/getting-started'
    - 'Official Delta homepage: https://delta.dev/'
    - 'Official launch announcement: https://zed.dev/blog/introducing-delta'
    - 'Official public-beta announcement: https://zed.dev/blog/delta-public-beta'
  summary:
    - >
      Delta is Zed Industries' collaborative workspace for coding with AI agents. Its
      central unit is a thread that keeps conversation, repository checkout, changes,
      and review context synchronized as a shareable artifact.
  timeline:
    - '2026-08-12: Zed Industries introduced Delta and began inviting users to a private beta.'
    - '2026-09-16: Delta entered public beta on macOS, Linux, Windows, and the web.'
    - >
      2026-09: Zed Industries reported that its team was building Delta through Delta
      itself after disabling pull requests on the project's repository.
  usage:
    - >
      A developer opens a Git repository, starts an agent thread, and lets Delta create
      an isolated checkout or use an existing one. Changes can be inspected, discussed
      inline, revised, and transferred back to the normal Git workflow.
    - >
      Teams can share threads, review code in the context of the conversation that
      produced it, run agents on local or cloud machines, and use hosted models,
      subscription-backed providers, or configured API keys.
