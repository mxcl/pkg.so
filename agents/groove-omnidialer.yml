history:
  adoption-history:
    - >
      Groove OmniDialer became part of Clari's expanded revenue platform after Clari
      announced its acquisition of Groove in August 2023. It is now documented and
      supported under the Clari Groove product family.
    - >
      Official guides position the dialer as a cross-workflow calling surface available
      from Groove, email, Salesforce, and telephone links on other web pages. Its tight
      Salesforce activity-logging integration targets sales teams that need calls and
      notes captured in their system of record.
  package-nerd-significance:
    - >
      The Homebrew cask packages a proprietary Electron-style desktop companion whose
      installation is otherwise initiated from an authenticated Clari Groove workspace.
      It is useful for managed Mac fleets where sales tooling must be installed
      consistently, although use still requires an organization-provisioned Groove
      account and Dialer license.
  project-history:
    - >
      Groove developed a sales-engagement suite centered on workflow automation for
      revenue teams, including its OmniDialer desktop calling application.
    - >
      Clari announced the acquisition of Groove on 14 August 2023, integrating Groove's
      sales-engagement capabilities into Clari's revenue platform. Subsequent official
      documentation refers to the application as Clari Groove OmniDialer or Groove
      OmniDialer.
  related-projects:
    - Clari Groove web application and Omnibar.
    - Salesforce, which supplies the contact records and receives logged call activity.
    - Clari Copilot and Groove Conversations, which can consume recorded OmniDialer calls.
  sources:
    - >
      Clari acquisition announcement:
      https://www.clari.com/press/clari-to-acquire-groove-cementing-revenue-platform-leadership/
    - >
      Official installation guide:
      https://clari.my.site.com/customer/articles/Knowledge/Install-Groove-OmniDialer
    - >
      Official settings guide:
      https://clari.my.site.com/customer/articles/Knowledge/Groove-OmniDialer-Settings
    - >
      Official workflow guide:
      https://clari.my.site.com/customer/articles/Knowledge/Groove-OmniDialer-Everywhere
  summary:
    - >
      Groove OmniDialer is Clari Groove's proprietary desktop sales dialer. It supports
      outbound and inbound calls, Salesforce-aware click-to-call workflows, call
      logging, voicemail, forwarding, bridge dialing, and organization-managed caller
      identities.
  timeline:
    - '2023-08-14: Clari announced its acquisition of Groove.'
    - >
      2024: Clari published OmniDialer workflow documentation covering Groove, email,
      Salesforce, and general web use.
    - >
      2025: Clari published updated installation and settings guides for the standalone
      macOS and Windows desktop application.
  usage:
    - >
      A licensed user signs in through the Clari Groove web application, installs the
      desktop dialer, provisions or selects a Groove phone number, grants microphone
      access, and chooses caller-ID and optional forwarding settings.
    - >
      Sales representatives can call from Groove flows and actions, email, Salesforce
      records, or telephone links on web pages. Depending on administrator settings,
      calls, notes, results, and recordings can be logged to Salesforce and surfaced in
      Groove analytics or related Clari products.
