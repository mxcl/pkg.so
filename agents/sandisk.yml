history:
  adoption-history:
    - >
      The application is intended primarily for owners of compatible SANDISK flash
      drives, memory cards, and portable SSDs. Its usefulness and available security
      operations depend on the attached storage model and operating system.
  package-nerd-significance:
    - >
      SANDISK is vendor-specific companion software rather than a general-purpose
      storage utility. Package users install it to expose backup, content-management,
      firmware, locking, and encryption workflows associated with supported SANDISK
      hardware.
  project-history:
    - >
      The SANDISK application succeeded the SANDISK Memory Zone branding and expanded
      that product's storage-management role across mobile and desktop systems.
    - >
      The current application combines file browsing and transfer, scheduled backup,
      restore, storage-device management, and access to hardware- or software-based
      protection on compatible products.
  related-projects:
    - SANDISK Memory Zone
    - SANDISK Security
    - SecureAccess
    - PrivateAccess
  sources:
    - https://support-en.sandisk.com/app/answers/detailweb/a_id/52507
    - https://support-en.sandisk.com/app/answers/detailweb/a_id/53076
    - https://www.sandisk.com/topics/accessories/sandisk-app-for-backups
  summary:
    - >
      SANDISK is the official companion application for backing up, accessing,
      organizing, and protecting data on compatible SANDISK storage devices.
  timeline:
    - 'Product transition: SANDISK App succeeded the SANDISK Memory Zone name.'
    - >
      Current generation: Mobile and desktop functions were consolidated around backup,
      file management, device compatibility, and storage protection.
  usage:
    - >
      Users browse attached storage, copy or move files, schedule incremental backups,
      inspect previous backups, restore content, and free space on source devices.
    - >
      Supported products may also expose drive locking, password protection, firmware
      updates, or encrypted vault operations. These capabilities vary by device and
      platform.
