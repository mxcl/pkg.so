history:
  adoption-history:
    - >
      brew-gem remained a niche packaging helper but has persisted unusually long for a
      glue tool. GitHub metadata and Homebrew formula data show current activity and a
      stable 1.3.x line, while Homebrew analytics reported several thousand installs
      over the prior year at lookup time.
  package-nerd-significance:
    - >
      brew-gem matters because it captures a recurring package-manager problem: language
      package managers are good at libraries, while OS/package managers are good at
      executable lifecycle management. It is a compact example of turning language-level
      packages into system-level formulae without maintaining a formula by hand for
      every gem.
  project-history:
    - >
      The sportngin/brew-gem repository was created in February 2014, with early v0.2.x
      releases following within weeks. The README explains the core idea: generate a
      stub formula that runs `gem install` into the formula prefix so the resulting
      package and dependencies live under Homebrew's Cellar.
    - >
      The project explicitly limits its purpose to standalone Ruby command-line tools,
      not development libraries. That philosophy made it a pragmatic workaround for Ruby
      CLI tools that users wanted to manage with `brew list`, `brew upgrade`, and
      Homebrew-style uninstalls.
  related-projects:
    - RubyGems supplies the upstream packages that brew-gem wraps.
    - Homebrew supplies the formula and Cellar lifecycle model.
    - >
      Shell completion handling in the README links the tool to bash and zsh completion
      packaging.
  sources:
    - https://formulae.brew.sh/api/formula/brew-gem.json
    - https://github.com/sportngin/brew-gem
    - https://raw.githubusercontent.com/sportngin/brew-gem/master/README.md
  summary:
    - >
      brew-gem is a small bridge between RubyGems and Homebrew: it generates Homebrew
      formulae that install Ruby gems as self-contained Cellar packages.
  timeline:
    - '2014: Repository created and v0.2.0 released.'
    - '2014: v0.3.0 released with early Homebrew integration improvements.'
    - '2018: v0.9.0 release addressed compatibility with newer Homebrew behavior.'
    - '2026: Homebrew stable version reported as 1.3.4.'
  usage:
    - >
      Users run commands such as `brew gem install heroku`, optionally choosing a
      specific gem version or Homebrew-installed Ruby. Installed gems are listed with a
      `gem-` prefix, making Ruby CLI tools visible to normal Homebrew workflows.
related-packages:
  - id: brew:ruby
    reason: >
      Use Homebrew Ruby alongside brew-gem when you want generated gem formulae to use a
      Homebrew-managed interpreter via brew-gem's documented `--homebrew-ruby` option.
    rel: adjacent_workflow
    sources:
