history:
  adoption-history:
    - >
      The project became a familiar utility for Intel Mac users who wanted a higher
      cooling baseline during sustained workloads. Its official README documents
      Homebrew Cask installation, connecting the menu-bar utility with reproducible
      macOS package-management workflows.
  package-nerd-significance:
    - >
      smcFanControl is emblematic of Intel-era Mac hardware utilities: a small native
      application exposing System Management Controller fan behavior that macOS
      otherwise manages automatically. Its conservative refusal to set minimum speeds
      below Apple's defaults is central to the project's identity.
  project-history:
    - >
      Hendrik Holtmann created smcFanControl as a GPL-licensed macOS utility during the
      early Intel Mac era. Its source dates to 2006, and later releases added support
      for newer Intel Mac models, macOS releases, dark appearance modes, and lower
      energy use.
  related-projects:
    - >
      The application controls fan behavior through Apple's System Management
      Controller. The repository also contains an smc command-line component.
  sources:
    - https://github.com/hholtmann/smcFanControl
    - https://github.com/hholtmann/smcFanControl/blob/master/main.m
    - https://github.com/hholtmann/smcFanControl/releases
  summary:
    - >
      smcFanControl is an open-source macOS menu-bar utility for raising the minimum
      speed of built-in fans so an Intel Mac can run cooler.
  timeline:
    - '2006: The source copyright history begins during the first generation of Intel Macs.'
    - '2014: The 2.5 generation added newer macOS compatibility and reduced energy use.'
    - '2016: Version 2.6 updated platform requirements and fixed compatibility issues.'
    - '2018: A 2.6.1 beta added dark-mode and 2018 MacBook Pro support.'
  usage:
    - >
      Users choose a higher minimum fan speed or a saved favorite from the menu-bar
      application. The utility does not permit minimum speeds below Apple's defaults,
      and macOS can still raise fan speed beyond the selected minimum when cooling
      demands it.
