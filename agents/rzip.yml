history:
  adoption-history:
    - >
      rzip was packaged across several Unix-like systems as a specialized compression
      utility, but remained less universal than gzip or bzip2. Paul Russell's
      contribution to Debian packaging, acknowledged by the author, helped place it in
      the conventional distribution-package ecosystem.
  package-nerd-significance:
    - >
      rzip is notable for applying an rsync-inspired long-range matching stage before
      bzip2 compression. Its very large history window can find repetition beyond the
      reach of conventional compressors, making it an instructive specialist tool
      despite operational limitations such as the lack of standard-input and
      standard-output streaming.
  project-history:
    - >
      Andrew Tridgell first implemented the ideas behind rzip in 1998 while working on
      rsync. That implementation was too slow for practical use and was replaced by the
      current design in 2003.
  related-projects:
    - >
      rsync supplied the context in which rzip's long-range redundancy ideas were first
      explored.
    - >
      bzip2 supplies the strong second-stage compression used after rzip's long-distance
      matching pass.
    - >
      gzip and bzip2 are the conventional Unix compression tools against which the
      official manual compares rzip.
  sources:
    - 'Official project site: https://rzip.samba.org/'
    - >
      Official rzip manual, including HISTORY, BUGS, CREDITS, and AUTHOR sections:
      https://rzip.samba.org/rzip/rzip-man.html
  summary:
    - >
      rzip is a file-compression utility by Andrew Tridgell designed to exploit
      long-distance redundancy in very large files before applying bzip2 compression.
  timeline:
    - '1998: The ideas behind rzip were first implemented during work on rsync.'
    - '2003: The impractically slow original implementation was replaced by the current design.'
  usage:
    - >
      Users compress files with rzip and restore them with rzip or runzip. It is most
      useful for large files containing repeated data separated by long distances;
      unlike typical Unix filters, it cannot compress or decompress through standard
      input or standard output.
