history:
  adoption-history:
    - >
      Minecraft grew from a 2009 PC release into a game enjoyed by millions of players
      worldwide. Its open-ended building, survival, multiplayer, and extensibility
      encouraged large communities around shared servers, custom maps, texture packs,
      and modifications.
    - >
      Java Edition and Bedrock Edition became the principal edition families. The
      desktop package represented by this cask supplies Minecraft.app through Homebrew,
      bringing the official launcher into a package-managed macOS setup.
  package-nerd-significance:
    - >
      Minecraft is unusually important to package and systems enthusiasts because its
      Java heritage, server ecosystem, mod loaders, world formats, and version-specific
      profiles generated extensive tooling around runtimes, launchers, backups, and
      reproducible mod collections.
    - >
      The Homebrew cask packages the official macOS application rather than Minecraft's
      proprietary game source. There is therefore no official public source repository
      for the packaged game to report.
  project-history:
    - >
      Minecraft first appeared for PC in 2009 and reached its full release in 2011.
      Mojang continued expanding it through major updates and, later, more frequent game
      drops.
    - >
      The game retained a simple core loop—explore, gather, craft, build, and
      survive—while growing into multiple editions and a wider franchise.
  related-projects:
    - >
      Minecraft: Java Edition is the Java-based desktop edition closely associated with
      community servers and mods.
    - 'Minecraft: Bedrock Edition is the cross-platform edition.'
    - Minecraft Realms provides official hosted multiplayer worlds.
    - Minecraft Education adapts the game for teaching and classroom use.
  sources:
    - https://help.minecraft.net/hc/en-us
    - https://www.minecraft.net/en-us/15th-anniversary
    - https://www.minecraft.net/en-us/about-minecraft
    - https://www.minecraft.net/en-us/updates/minecraft-updates-timeline-and-evolution
    - source_facts.package-manager
  summary:
    - >
      Minecraft is Mojang's open-world sandbox game centered on block-based exploration,
      construction, crafting, and survival. It supports solo and multiplayer play and
      has developed a substantial server, creator, and modding culture.
  timeline:
    - '2009: The first PC version was released and Mojang Specifications was founded.'
    - '2011: Minecraft reached its full release.'
    - '2023: Mojang began the game-drop release model for more frequent content additions.'
  usage:
    - >
      Players generate or join worlds, gather resources, construct buildings and
      machines, explore, and optionally fight hostile creatures. Creative mode
      emphasizes unrestricted building, while survival play adds resource and health
      constraints.
    - >
      Desktop users commonly use the launcher to select game installations and updates;
      multiplayer users join community servers or use the official Realms service.
