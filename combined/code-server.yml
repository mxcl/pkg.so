id: brew:code-server
display-name: code-server
homepage: https://coder.com
repo: https://github.com/coder/code-server
docs:
  - https://coder.com/docs/code-server/FAQ
  - https://coder.com/docs/code-server/guide
  - https://coder.com/docs/code-server/install
config-file-location:
  unix: ~/.config/code-server/config.yaml
credentials-file-location:
  unix: ~/.config/code-server/config.yaml
history:
  adoption-history:
    - >
      code-server became a standard self-hosted way to get VS Code in a browser,
      especially for remote Linux machines and cloud development boxes. Official docs
      support install scripts, Debian and RPM packages, AUR, Homebrew, Docker, Helm,
      Raspberry Pi, Termux, and cloud-provider guides; the input also records Homebrew
      and Nix distribution.
  package-nerd-significance:
    - >
      For package nerds, code-server is significant because it turns a large desktop
      editor into a service-oriented CLI package. Its packaging story spans native
      packages, Homebrew, Nix, Docker images, Helm charts, AUR recipes, install scripts,
      and upstream VS Code version tracking, which makes it a useful case study in
      repackaging a fast-moving Electron editor for headless and server environments.
  project-history:
    - >
      The GitHub repository was created in 2019. The official contributing docs describe
      the early v1 architecture as a Code submodule plus a large patch that split the UI
      into a browser front-end and a server process. As VS Code's web architecture
      matured, code-server v2 and later used the Code front-end while implementing the
      server side, later reducing its patch set as upstream Code opened more server
      pieces.
  related-projects:
    - >
      Related projects and comparators include Visual Studio Code, Code OSS, Coder,
      Theia, OpenVSCode Server, GitHub Codespaces, VS Code web, devcontainers, and
      remote development tooling.
  sources:
    - https://github.com/coder/code-server
    - https://coder.com/docs/code-server/FAQ
    - https://coder.com/docs/code-server/install
    - https://coder.com/docs/code-server/CONTRIBUTING
    - https://github.com/coder/code-server/releases
  summary:
    - >
      code-server is Coder's project for running VS Code on a remote machine and
      accessing it through a browser. It packages the VS Code editing experience as a
      self-hosted web IDE with a `code-server` CLI, install script, service setup, and
      browser login flow.
  timeline:
    - '2019: GitHub repository for coder/code-server created.'
    - >
      2019: v1 architecture split Code into browser front-end and server pieces,
      according to official contributing docs.
    - '2022: v4 releases tracked upstream VS Code versions in the changelog.'
    - '2026: Recent releases continued tracking current VS Code versions.'
  usage:
    - >
      Typical use is installing `code-server`, starting it as a user service or
      container, then visiting localhost or a secured remote URL in a browser. The
      default config is created at `~/.config/code-server/config.yaml`, stores bind
      address, auth mode, password or hashed password, and TLS settings, and can be
      overridden by flags or environment variables.
related-packages:
  - id: brew:coder
    reason: >
      Use Coder alongside code-server when a team needs managed remote workspaces; Coder
      documents an official module that installs and exposes code-server inside a
      workspace.
    rel: adjacent_workflow
    sources:
      - https://coder.com/docs/code-server/coder
      - https://coder.com/docs/user-guides/workspace-access
category: developer-tools
package-manager:
  brew: code-server
  nix: code-server
package-manager-url: https://formulae.brew.sh/formula/code-server
license: MIT
tags:
