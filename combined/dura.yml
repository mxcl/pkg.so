id: brew:dura
display-name: Dura
homepage: https://github.com/tkellogg/dura
repo: https://github.com/tkellogg/dura
docs:
  - https://github.com/tkellogg/dura#readme
config-file-location:
  unix: ~/.config/dura/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Cargo, Homebrew on macOS, Arch
      via `dura-git`, and Nix/NixOS. That spread is typical of a developer utility that
      is useful to package-manager-heavy users even when it is not a language runtime or
      framework dependency.
    - >
      By June 2026, the GitHub API reported several thousand stars, while crates.io
      remained a smaller distribution channel. That pattern fits a tool discovered and
      evaluated mostly as a workflow idea, with package managers used once a developer
      decides to keep it running.
  package-nerd-significance:
    - >
      Dura is interesting to package nerds because it packages a personal
      disaster-recovery habit as a daemonized CLI: automatic local commits without
      changing the developer's visible branch state. It also sits near tools like `git
      stash`, editor local history, and filesystem backup, but uses Git's object model
      as the storage layer.
  project-history:
    - >
      The GitHub repository was created at the end of 2021, and the README says people
      had been using it since January 1, 2022. The project reached crates.io in January
      2022 as `dura`, described there as backing up work automatically via Git commits.
    - >
      Dura's design centers on per-commit `dura/` branches. It snapshots dirty working
      trees in the background so a developer can recover from editor mistakes, crashes,
      or bad resets by checking Git history rather than relying on per-file undo.
  related-projects:
    - >
      Dura's own recovery instructions compare the workflow to `git stash` and normal
      Git commands, and the project uses libgit2 for writing commits. In practice it
      overlaps with editor local-history features and continuous backup tools, but
      remains Git-native.
  sources:
    - https://github.com/tkellogg/dura
    - https://api.github.com/repos/tkellogg/dura
    - https://crates.io/crates/dura
    - https://api.github.com/repos/tkellogg/dura/releases
  summary:
    - >
      Dura is a Rust developer tool that watches Git repositories and makes background
      snapshot commits without moving HEAD, changing the current branch, or touching the
      index. It belongs to the small family of tools that treat Git as a local safety
      net rather than only as a collaboration system.
  timeline:
    - '2021-12-31: GitHub repository created.'
    - '2022-01-01: README says many users had been using it from this date onward.'
    - '2022-01-23: `dura` crate created on crates.io.'
    - '2022-06-18: 0.2.0-rc1 release published on GitHub.'
  usage:
    - >
      Typical use is `dura serve` in the background, then `dura watch` inside each Git
      repository to snapshot. Recovery is performed through normal Git inspection and
      checkout/reset operations against the generated `dura/<commit>` branches.
related-packages:
  - id: brew:tig
    reason: >
      Use Tig to browse Dura's generated branches and locate a recovery commit, a
      workflow explicitly suggested by Dura's recovery instructions.
    rel: adjacent_workflow
    sources:
      - https://github.com/tkellogg/dura#how-to-recover
      - https://jonas.github.io/tig/
category: developer-tools
package-manager:
  brew: dura
  macports: dura
  nix: dura
package-manager-url: https://formulae.brew.sh/formula/dura
license: Apache-2.0
tags:
  - automatic-backup
  - cli
  - git
  - snapshots
  - version-control
description: Backs up your work automatically via Git commits
executables:
  - dura
provenance:
  formula: dura
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
