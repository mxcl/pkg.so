id: brew:livebook-cli
display-name: Livebook CLI
homepage: https://livebook.dev
repo: https://github.com/livebook-dev/livebook
docs:
  - https://github.com/livebook-dev/livebook#readme
  - https://livebook.hexdocs.pm/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Livebook expanded beyond local Elixir notebooks through desktop builds, Docker
      images, embedded-device support, and deployment-oriented notebook applications.
  package-nerd-significance:
    - >
      The Homebrew formula packages Livebook as a command-line tool, giving macOS and
      Linux users a package-manager-native route to an Elixir notebook environment
      without treating it as an ordinary Mix dependency.
  project-history:
    - >
      Livebook was created as an open-source environment for interactive and
      collaborative Elixir notebooks. Its native Live Markdown format keeps notebooks
      readable, diffable, and suitable for version control.
  related-projects:
    - >
      Elixir and Erlang provide the language runtime; Kino supplies interactive notebook
      widgets; Livebook Desktop and the Livebook container images are alternative
      distributions of the same project.
  sources:
    - 'Official documentation: https://livebook.hexdocs.pm/'
    - 'Official release blog: https://news.livebook.dev/'
    - 'Official repository and installation guide: https://github.com/livebook-dev/livebook'
  summary:
    - >
      Livebook is an interactive notebook and application platform centered on Elixir.
      The livebook-cli package exposes its server and related workflows from the command
      line.
  timeline:
    - '2023: Official container distribution moved to GitHub Container Registry'
    - '2023: Livebook 0.9 was announced'
    - '2026: Homebrew continues to distribute the project as livebook-cli'
  usage:
    - >
      Run `livebook server` to start a local instance and `livebook server --help` to
      inspect CLI configuration. Livebook also supports environment-variable
      configuration and Docker-based deployment.
related-packages:
  - id: brew:elixir
    reason: >
      Install Elixir when you want Livebook's native language toolchain or need to run
      Livebook directly through Mix rather than a prebuilt distribution.
    rel: adjacent_workflow
    sources:
      - https://github.com/livebook-dev/livebook
      - https://elixir-lang.org/development/
      - https://elixir-lang.org/docs/
category: developer-tools
package-manager:
  brew: livebook-cli
  nix: livebook
  winget: Livebook.Livebook
package-manager-url: https://formulae.brew.sh/formula/livebook-cli
license: Apache-2.0
tags:
  - cli
  - data-science
  - elixir
  - interactive-computing
  - live-markdown
  - notebook
description: Code notebooks for Elixir developers
executables:
  - livebook
provenance:
  formula: livebook-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
