id: brew:gauche
display-name: Gauche
homepage: https://practical-scheme.net/gauche/
repo: https://github.com/shirok/Gauche
docs:
  - https://practical-scheme.net/gauche
  - https://practical-scheme.net/gauche/man
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gauche's adoption is strongest in the Scheme and Unix scripting communities rather
      than in mainstream application packaging. Its presence in Homebrew, Debian,
      Fedora, MacPorts, Nix, and Scoop reflects its role as a portable Scheme runtime
      for users who want a Lisp-family scripting tool available from normal package
      managers.
  package-nerd-significance:
    - >
      For package-manager users, Gauche is notable because it treats Scheme as a
      practical Unix scripting environment with its own package tooling and
      batteries-included runtime. It is a small but durable example of a language
      implementation whose packaging value is not only the compiler or interpreter, but
      also the ecosystem of command-line helpers around it.
  project-history:
    - >
      The project is developed by Shiro Kawai and is distributed from the Practical
      Scheme site, with releases and source hosted in the official GitHub repository.
      The homepage emphasizes long-term maintenance, backward compatibility, quick
      startup, operating-system integration, Unicode, networking, threads, regular
      expressions, and a broad library set.
  related-projects:
    - >
      Gauche is related to the R7RS Scheme standard, SRFI libraries, the `get-gauche`
      installer project, and the broader family of Scheme implementations. The project
      also maintains extension packages such as Gauche-gtk2.
  sources:
    - https://github.com/shirok/Gauche
    - https://practical-scheme.net/gauche/
    - https://practical-scheme.net/gauche/download.html
    - https://practical-scheme.net/gauche/man/gauche-refe/index.html
  summary:
    - >
      Gauche is an R7RS Scheme implementation aimed at practical scripting rather than
      only language experimentation. Its official site presents it as a fast Scheme
      engine for automation, build tools, shell-like scripting, and larger real-world
      programs.
  timeline:
    - '2000s: Gauche becomes a long-running Practical Scheme implementation for scripting.'
    - '2013: The official GitHub repository was created.'
    - >
      2020s: The project continues to publish releases and documentation for R7RS Scheme
      and Gauche extensions.
  usage:
    - >
      Users run Gauche through the `gosh` interpreter and supporting tools such as
      `gauche-config`, `gauche-install`, and `gauche-package`. Official documentation
      describes Scheme scripting, REPL use, modules, extension packages, standalone
      executables, R7RS libraries, SRFIs, and Gauche-specific libraries.
related-packages:
  - id: brew:guile
    reason: >
      Choose GNU Guile when GNU integration, embedding in C applications, or a
      multi-language extension platform matters; choose Gauche for an R7RS-oriented
      Scheme focused on fast, practical scripting.
    rel: alternative
    sources:
      - https://practical-scheme.net/gauche/
      - https://www.gnu.org/software/guile/manual/guile.html
  - id: brew:chibi-scheme
    reason: >
      Choose Chibi-Scheme for a very small embeddable R7RS-small implementation with
      minimal dependencies; choose Gauche for a broader batteries-included scripting
      runtime and R7RS-large support.
    rel: alternative
    sources:
      - https://practical-scheme.net/gauche/
      - https://github.com/ashinn/chibi-scheme
category: language-runtime
package-manager:
  brew: gauche
  debian: gauche
  dnf: gauche
  macports: gauche
  nix: gauche
  scoop: main/gauche
package-manager-url: https://formulae.brew.sh/formula/gauche
license: BSD-3-Clause
tags:
  - cli
  - interpreter
  - programming-language
  - r7rs
  - runtime
  - scheme
  - scripting
description: R7RS Scheme implementation, developed to be a handy script interpreter
executables:
  - gauche-cesconv
  - gauche-config
  - gauche-install
  - gauche-package
  - gosh
provenance:
  formula: gauche
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
