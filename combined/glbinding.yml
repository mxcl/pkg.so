id: brew:glbinding
display-name: glbinding
homepage: https://glbinding.org/
repo: https://github.com/cginternals/glbinding
docs:
  - https://glbinding.org/docs.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      glbinding gained packaging across graphics-oriented development environments
      because it sits between OpenGL applications and windowing/toolkit stacks such as
      GLFW, GTK, Qt, and SDL. Its documentation also points to distribution through
      Homebrew, Debian, Ubuntu, Arch, vcpkg, Conan, and prebuilt Windows archives.
  package-nerd-significance:
    - >
      For package maintainers, glbinding is interesting because it packages generated
      API code, CMake config files, examples, documentation, and tools around the
      Khronos registry. It also exposes a classic compatibility question for graphics
      stacks: the package must align compiler support, OpenGL headers, context-creation
      libraries, and downstream C++ ABI expectations.
  project-history:
    - >
      The cginternals project released glbinding 1.0.0 in 2014 and continued through 2.x
      and 3.x documentation lines. Its design reflects the C++11 era of OpenGL tooling:
      stronger typing, generated headers, feature-centered includes, callbacks,
      multi-context support, and CMake integration instead of ad hoc extension-loader
      code.
  related-projects:
    - OpenGL, Khronos OpenGL Registry, khrbinding-generator, GLEW, GLFW, Qt, GTK, SDL, CMake.
  sources:
    - https://api.github.com/repos/cginternals/glbinding/releases?per_page=100
    - https://glbinding.org/
    - https://glbinding.org/docs.html
    - https://raw.githubusercontent.com/cginternals/glbinding/master/README.md
  summary:
    - >
      glbinding is a cross-platform C++ binding for the OpenGL API generated from the
      Khronos gl.xml specification. It replaces traditional macro-heavy OpenGL loaders
      with real functions, variables, C++ enum classes, lazy function resolution, and
      metadata around the generated API.
  timeline:
    - '2014: glbinding 1.0.0 is published on GitHub releases.'
    - '2016: glbinding 2.0.0 is published, followed by the 2.1 release line.'
    - >
      2018: The project documents v3.0 and v2.1 as stable documentation branches on
      glbinding.org.
    - >
      2019: The README notes Khronos KHR header dependency handling as part of
      downstream build setup.
  usage:
    - >
      Practitioners include glbinding headers, initialize the binding after creating an
      OpenGL context, and then call OpenGL functions through the generated C++
      namespaces. Projects commonly link it through CMake targets such as
      glbinding::glbinding and optionally glbinding::glbinding-aux for metadata,
      logging, and diagnostic support.
related-packages:
  - id: brew:glew
    reason: >
      Choose GLEW for the conventional C/C++ extension-loader model and broad legacy
      compatibility; choose glbinding for generated modern-C++ namespaces, typed enums,
      real functions, callbacks, and metadata.
    rel: alternative
    sources:
      - https://github.com/cginternals/glbinding
      - https://glew.sourceforge.net/
  - id: brew:gtk4
    reason: >
      GTK 4 can create the window and OpenGL context around a glbinding-based renderer,
      and glbinding ships an explicit GTK 4 OpenGL integration example.
    rel: adjacent_workflow
    sources:
      - https://github.com/cginternals/glbinding
      - https://www.gtk.org/docs/
category: media
