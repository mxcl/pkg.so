id: brew:musepack
display-name: Musepack
homepage: https://www.musepack.net/
repo: http://svn.musepack.net/
docs:
  - https://www.musepack.net/
  - https://www.musepack.net/index.php?pg=gen
  - https://www.musepack.net/index.php?pg=pro
  - https://www.musepack.net/index.php?pg=src
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project status page says Stream Version 8 has been stable and robust
      since its 2007 release and that Musepack is supported by more than 80 audio player
      applications plus standalone hardware audio players. The Linux tools page calls
      the 2009 SV8 command-line tools the first official stable release for Linux.
  package-nerd-significance:
    - >
      Musepack is interesting to package maintainers because it preserves a specialist
      audiophile codec stack: source releases, reference command-line tools, SV7
      compatibility, SV8 migration utilities, and libraries for older MPC collections.
  project-history:
    - >
      The official site says Musepack is based on MPEG-1 Layer II ideas, has been
      developed since 1997, and has heavily optimized patentless code. Its FAQ credits
      Andree Buschmann as creator and Frank Klemm plus the Musepack Development Team as
      later developers.
  sources:
    - https://www.musepack.net/
    - https://www.musepack.net/index.php?pg=gen
    - https://www.musepack.net/index.php?pg=lin
    - https://www.musepack.net/index.php?pg=src
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      Musepack is an open-source lossy audio compression format and command-line tool
      suite with a strong emphasis on high-quality, transparent audio compression.
  timeline:
    - '1997: Official site says Musepack development began from MPEG-1 Layer II ideas.'
    - '2007: Official project status says Stream Version 8 became stable and robust.'
    - '2009: Official Linux page lists the first official stable SV8 tools release.'
    - '2011: Official source page lists SV8 libraries and tools r475.'
    - '2024: Official project status reiterates SV8 stability and broad player support.'
  usage:
    - >
      The official Linux tools page maps the package's executables to practical jobs:
      mpcenc encodes WAV or lossless files to MPC, mpcdec decodes MPC to WAV or checks
      stream errors, mpcgain writes ReplayGain data, mpcchap edits SV8 chapters, mpccut
      cuts stream segments losslessly, and mpc2sv8 converts SV7 files to SV8.
related-packages:
  - id: brew:musikcube
    reason: >
      Use musikcube to index and play an MPC collection in a terminal library/player;
      its official changelog says the FFmpeg-backed decoder added Musepack playback
      support.
    rel: adjacent_workflow
    sources:
      - https://www.musepack.net/index.php?pg=lin
      - https://github.com/clangen/musikcube/blob/master/CHANGELOG.txt
      - https://github.com/clangen/musikcube
