id: brew:jwt-ui
display-name: JWT UI
homepage: https://jwtui.cli.rs/
repo: https://github.com/jwt-rs/jwt-ui
docs:
  - https://github.com/jwt-rs/jwt-ui#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      jwt-ui is narrower than jwt-cli but was packaged for terminal-oriented users
      across Homebrew, Cargo, Scoop, Arch Linux, Docker, and manual release binaries.
      Its README also credits Auth0 by Okta branding, connecting it to mainstream
      identity-tooling culture.
  package-nerd-significance:
    - >
      Its package-nerd appeal is the packaging of a web-debugging habit into a fully
      offline terminal app: no browser tab, no pasting sensitive tokens into a website,
      and still installable from the usual CLI package managers.
  project-history:
    - >
      The jwt-rs project published early GitHub releases in January 2024, with v0.0.3 on
      January 11 and v1.0.0 later the same day. The README presents the tool as a
      TUI-first JWT decoder/encoder with mouse support, keyboard shortcuts, dark and
      light themes, clipboard support, and a stdout mode for non-interactive use.
    - >
      The project builds on Rust terminal UI conventions while keeping JWT-specific
      workflows visible: token input, header and payload display, signature validation
      with HMAC/RSA/ECDSA/EdDSA secrets, JWKS support for decoding, and optional
      JSON/stdout output.
  related-projects:
    - >
      JWT UI is explicitly inspired by JWT.io and jwt-cli; it overlaps with jwt-cli for
      token encode/decode tasks but chooses an interactive terminal interface instead of
      a subcommand-first CLI.
  sources:
    - https://crates.io/crates/jwt-ui
    - https://github.com/jwt-rs/jwt-ui
    - https://github.com/jwt-rs/jwt-ui/releases
    - https://jwtui.cli.rs/
    - https://www.rfc-editor.org/rfc/rfc7519
  summary:
    - >
      JWT UI is a Rust terminal user interface for decoding and encoding JSON Web
      Tokens, positioned as an offline terminal alternative inspired by JWT.io and
      jwt-cli.
  timeline:
    - '2024-01-11: Early v0.0.3 and v1.0.0 GitHub releases published.'
    - '2024-01-15: v1.0.4 GitHub release published.'
    - >
      2024: README documents Homebrew, Scoop, Cargo, Arch Linux, Docker, install-script,
      and manual binary installation paths.
  usage:
    - >
      Users run `jwtui` to open the interactive terminal interface, pass a token as an
      argument to prefill the decoder, or use stdout flags to print decoded token data
      in scripts. Secrets can be supplied as plain text, file references, base64
      strings, or JWKS data depending on algorithm and mode.
related-packages:
  - id: brew:jwt-cli
    reason: >
      Choose jwt-cli for a conventional pipeline-friendly encode/decode CLI; JWT UI
      explicitly positions itself as the interactive terminal alternative.
    rel: alternative
    sources:
      - https://jwtui.cli.rs/
      - https://github.com/mike-engel/jwt-cli
category: security
package-manager:
  brew: jwt-ui
  pacman: jwt-ui
package-manager-url: https://formulae.brew.sh/formula/jwt-ui
license: MIT
tags:
  - cli
  - jwt
  - rust
  - security
  - terminal-ui
  - token
description: TUI for decoding and encoding JWT tokens
executables:
  - jwtui
provenance:
  formula: jwt-ui
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
