id: brew:lorem
display-name: lorem
homepage: https://github.com/per9000/lorem
repo: https://github.com/per9000/lorem
docs:
  - https://github.com/per9000/lorem#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The batch input records availability through Homebrew, Nix, and Arch/pacman, and
      Homebrew also notes the alias `ipsum`. That spread is modest but useful for a
      single-purpose text-generation CLI.
  package-nerd-significance:
    - >
      `lorem` is the sort of tiny Unix-style utility package that survives because it
      solves one boring developer need: generating dummy text in scripts, demos, tests,
      and terminals without opening a browser.
  project-history:
    - >
      The official README describes `lorem` as a Python lorem ipsum generator for the
      console. The GitHub repository was created in 2014 and exposes a compact CLI
      rather than a framework or service.
  related-projects:
    - >
      Other lorem ipsum generators fill the same niche, but this package is specifically
      the `per9000/lorem` console tool packaged by Homebrew.
  sources:
    - https://api.github.com/repos/per9000/lorem
    - https://formulae.brew.sh/formula/lorem
    - https://github.com/per9000/lorem#readme
    - source_facts.package-manager-url
  summary:
    - >
      `lorem` is a small Python command-line generator for lorem ipsum and other sample
      text. Its package-manager value is straightforward: install one executable and get
      predictable placeholder text from the shell.
  timeline:
    - '2014: `per9000/lorem` repository created on GitHub.'
    - '2024: Repository metadata shows activity through February 2024.'
    - '2024: v0.8.0 tag present in the official repository.'
  usage:
    - >
      By default the command prints a short lorem ipsum phrase. The README documents
      switches for words, sentences, lines, and characters; quote sources such as lorem,
      Decamerone, Faust, Fleurs du mal, Strindberg, Poe, Strandberg, and Bible text;
      case changes; randomization; version display; and built-in self-tests.
related-packages: []
category: developer-tools
