id: brew:dissent
display-name: dissent
homepage: https://github.com/diamondburned/dissent
repo: https://github.com/diamondburned/dissent
docs:
  - https://github.com/diamondburned/dissent#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README points users to Flathub, GitHub release binaries, and
      distribution packages, and the input package metadata records Homebrew, Alpine,
      Nix, and Windows winget entries. This makes Dissent part of the modern
      unofficial-client packaging ecosystem: desktop app first, but still discoverable
      through command-line package managers.
  package-nerd-significance:
    - >
      Dissent is significant to package nerds because it shows how a Linux-native
      desktop app can move through several distribution channels at once: Flatpak for
      desktop users, GitHub releases for direct downloads, language-toolchain
      installation for builders, and package-manager formulas for people who expect
      everything installable from one index.
  project-history:
    - >
      The GitHub repository was created in April 2022. The README says the project was
      previously named gtkcord4, and early tagged releases began with v0.0.1 later that
      month.
  related-projects:
    - >
      Related projects and platforms include Discord, gtkcord4 as the former project
      name, GTK4, libadwaita, Flathub, and distribution package indexes.
  sources:
    - https://github.com/diamondburned/dissent
    - https://api.github.com/repos/diamondburned/dissent
    - https://github.com/diamondburned/dissent/releases/tag/v0.0.1
    - https://github.com/diamondburned/dissent/releases/tag/v0.0.37
    - https://flathub.org/apps/so.libdb.dissent
    - https://formulae.brew.sh/formula/dissent
  summary:
    - >
      Dissent is a third-party Discord client built in Go with GTK4 and libadwaita,
      aimed at a native desktop experience rather than full parity with Discord's
      official client. It is a GUI application packaged like a developer-friendly
      desktop tool, with prebuilt releases, Flatpak distribution, and source
      installation.
  timeline:
    - '2022-04: GitHub repository created'
    - '2022-04: v0.0.1 release published'
    - '2025-09: v0.0.37 release published'
  usage:
    - >
      The README emphasizes text chat, Markdown and emoji support, guild and channel
      navigation, image and file handling, user CSS, and partial support for threads,
      forums, reactions, and summaries. It also warns that unofficial Discord clients
      carry account risk and recommends token-based login over username and password
      login.
related-packages:
  - id: cask:discord
    reason: >
      Discord's official desktop client is the safer alternative when voice, video,
      streaming, full feature coverage, or supported account access matters more than
      Dissent's lightweight native GTK interface.
    rel: alternative
    sources:
      - https://github.com/diamondburned/dissent#readme
      - https://discord.com/download
category: networking
package-manager:
  apk: dissent
  brew: dissent
  nix: dissent
  winget: diamondburned.Dissent
package-manager-url: https://formulae.brew.sh/formula/dissent
license: GPL-3.0-or-later
tags:
  - chat-client
  - cli
  - discord
  - go
  - gtk4
description: GTK4 Discord client in Go
executables:
  - dissent
provenance:
  formula: dissent
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
