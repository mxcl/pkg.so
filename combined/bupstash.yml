id: brew:bupstash
display-name: bupstash
homepage: https://bupstash.io
repo: https://github.com/andrewchambers/bupstash
docs:
  - https://bupstash.io/
  - https://bupstash.io/doc/guides/Getting%20Started.html
  - https://bupstash.io/doc/man/bupstash-keyfiles.html
  - https://bupstash.io/doc/man/bupstash.html
config-file-location: null
credentials-file-location:
  unix:
    - User-selected key file, for example backups.key (selected with --key
    - BUPSTASH_KEY)
history:
  adoption-history:
    - >
      Bupstash gained enough command-line backup interest to be packaged across several
      ecosystems; the input metadata records apk, Homebrew, MacPorts, Nix, and Arch
      packages. Its adoption is narrower than older tools such as bup or Borg, but it
      has a clear niche among users who want encrypted deduplication without operating a
      large backup service.
  package-nerd-significance:
    - >
      Bupstash is significant because it shows the post-Borg/Restic generation of backup
      tooling: single-binary CLI distribution, strong default encryption, SSH-friendly
      self-hosting, and deduplication that still works with encrypted data. Its
      key-separation model is especially attractive for package nerds thinking about
      ransomware-resistant unattended backups.
  project-history:
    - >
      The public repository was created in August 2020, and Andrew Chambers introduced
      Bupstash publicly in November 2020. The README and website describe a beta-stage
      tool designed for efficient deduplication, strong privacy, offline decryption
      keys, encrypted tag search, slow-network performance, restricted remote access
      controls, and low memory use.
    - >
      The technical overview explains the implementation model: arbitrary data streams
      are chunked, deduplicated, encrypted client side, stored locally or remotely, and
      indexed with encrypted metadata. The design uses keyed hashes for addressing
      chunks, a rolling hash for split points, libsodium cryptography, hash trees for
      large streams, and client-side metadata sync for queries.
  related-projects:
    - >
      Bupstash is related to bup by name and backup focus, and to Borg, Restic, Attic,
      Tarsnap, Duplicity, and rdiff-backup as part of the wider deduplicating and
      encrypted backup-tool family.
  sources:
    - https://acha.ninja/blog/introducing_bupstash/
    - https://bupstash.io/
    - https://bupstash.io/doc/guides/Getting%20Started.html
    - https://bupstash.io/doc/man/bupstash.html
    - https://github.com/andrewchambers/bupstash
    - >
      https://raw.githubusercontent.com/andrewchambers/bupstash/master/doc/technical_overview.md
    - source_facts.package-manager
  summary:
    - >
      Bupstash is a Rust backup tool focused on encrypted, deduplicated, incremental
      backups with client-side encryption and remote repositories over SSH. It occupies
      the same practical space as modern deduplicating backup CLIs but makes encrypted
      metadata, queryable tags, and offline decryption keys central features.
  timeline:
    - '2020-08: Public GitHub repository created.'
    - '2020-11-20: Introductory Bupstash blog post published.'
    - >
      2021: Project documentation covered garbage collection, encrypted metadata, and
      operational guides.
    - '2026: Homebrew metadata lists Bupstash as a packaged encrypted-backup CLI.'
  usage:
    - >
      Typical usage starts by initializing a repository, creating a key file, setting
      `BUPSTASH_REPOSITORY` and `BUPSTASH_KEY`, then using commands such as `put`,
      `list`, `get`, `diff`, `restore`, `rm`, and `gc`. Bupstash can store file trees,
      tar streams, and command output, and its `put` command benefits from avoiding
      already-sent file content.
related-packages:
  - id: brew:restic
    reason: >
      Choose restic when you prefer its mature repository workflow and broad
      snapshot-oriented interface; choose bupstash when encrypted metadata queries and
      capability-restricted subkeys are especially valuable.
    rel: alternative
    sources:
      - https://bupstash.io/doc/man/bupstash.html
      - https://restic.readthedocs.io/en/stable/010_introduction.html
  - id: brew:borgbackup
    reason: >
      Choose Borg when compression choices, mountable archives, and established SSH
      repository operation are priorities; choose bupstash for its encrypted tag queries
      and put-only or metadata-only subkeys.
    rel: alternative
    sources:
      - https://bupstash.io/doc/man/bupstash.html
      - https://borgbackup.readthedocs.io/en/stable/
  - id: brew:bup
    reason: >
      Choose bup when Git-packfile compatibility and Git-based inspection are useful;
      choose bupstash when built-in encryption and offline-key workflows are required.
    rel: alternative
    sources:
      - https://bupstash.io/doc/guides/Getting%20Started.html
      - https://bup.github.io/
category: system
package-manager:
  apk: bupstash
  brew: bupstash
  macports: bupstash
  nix: bupstash
  pacman: bupstash
package-manager-url: https://formulae.brew.sh/formula/bupstash
license: MIT
tags:
  - backup
  - cli
  - deduplication
  - encrypted-backup
  - incremental-backup
  - self-hosted
description: Easy and efficient encrypted backups
executables:
  - bupstash
provenance:
  formula: bupstash
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
