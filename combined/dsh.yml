id: brew:dsh
display-name: dsh
homepage: https://www.netfort.gr.jp/~dancer/software/dsh.html.en
repo: null
docs:
  - https://www.netfort.gr.jp/~dancer/software/dsh.html.en
config-file-location:
  unix:
    - /etc/dsh/dsh.conf
    - ~/.dsh/dsh.conf
    - /etc/dsh/machines.list
    - ~/.dsh/machines.list
    - /etc/dsh/group/groupname
    - ~/.dsh/group/groupname
credentials-file-location: null
history:
  adoption-history:
    - >
      dsh's adoption is old-school Unix administration adoption: package-manager
      availability, config files in /etc and ~/.dsh, and use on clusters where the same
      command must run across many hosts. The official page says it was installed on
      many clusters and was also used by the related dmachinemon system.
    - >
      Homebrew analytics showed only 71 installs over the preceding 365 days during this
      batch, which fits a mature, niche sysadmin utility rather than an actively trendy
      tool.
  package-nerd-significance:
    - >
      dsh is package-nerd significant because it captures a pre-cloud cluster-management
      pattern: small C utilities, text host lists, rsh/ssh wrappers, and distro
      packaging did the work that later orchestration systems absorbed. It is also an
      example of a name collision family: several unrelated tools called dsh existed in
      Perl, C, Python, and AIX-compatible forms.
  project-history:
    - >
      The official page says dsh grew from the author's own Debian cluster
      administration needs: repeatedly writing ad hoc scripts for many hosts was
      inefficient, so a personal tool was polished into a public program. The page's
      HTML creation stamp is 2001-08-31, and its public download index carries a long
      0.22 through 0.25 release stream.
    - >
      By the 0.24.2 note dated 2003-08-26, the project had already dealt with
      portability and security-advisory review around its asprintf implementation. Later
      releases moved into the 0.25 series, with Homebrew packaging 0.25.10 from the
      upstream download area.
  related-projects:
    - dmachinemon is named by the official page as a system that used dsh extensively.
    - >
      The official related-work list points to other distributed-shell projects,
      including Perl dsh, another C dsh, and pydsh.
    - ssh, rsh, and remsh are the remote-shell mechanisms dsh wraps.
  sources:
    - https://www.netfort.gr.jp/~dancer/software/dsh.html.en
    - https://www.netfort.gr.jp/~dancer/software/downloads/
    - https://formulae.brew.sh/formula/dsh
  summary:
    - >
      dsh, Dancer's shell, is Junichi Uekawa's C implementation of a distributed shell
      wrapper for running rsh, remsh, or ssh commands over many Unix hosts.
  timeline:
    - '2001-08-31: The official HTML page records its creation date.'
    - '2002: The official references section links Japanese research reports evaluating dsh.'
    - >
      2003-08-10: A Bugtraq security advisory about dsh was posted; the maintainer later
      explained why the checked implementation was not affected on common platforms.
    - '2003-08-26: The official page documents the 0.24.2 security-review note.'
    - >
      0.25.10: The upstream download index and Homebrew formula identify 0.25.10 as the
      packaged stable release.
  usage:
    - >
      The canonical usage is to put host lists or groups in text config files and run
      commands such as `dsh -a -c -- uname -a` or `dsh -g group -c -- command`. The tool
      also supports limiting the number of simultaneous connections, hierarchical
      invocation, and NIS netgroups.
related-packages:
  - id: brew:pssh
    reason: >
      Choose PSSH when you want a maintained Python suite that parallels not only remote
      commands but also scp, rsync, file collection, and process termination across a
      host list.
    rel: alternative
    sources:
      - https://github.com/lilydjwg/pssh#readme
      - https://www.netfort.gr.jp/~dancer/software/dsh.html.en
  - id: brew:parallel
    reason: >
      Choose GNU Parallel when remote SSH fan-out should be part of a broader
      command-parallelization and shell-pipeline tool rather than a dedicated
      distributed shell.
    rel: alternative
    sources:
      - https://www.gnu.org/software/parallel/parallel.html
      - https://www.netfort.gr.jp/~dancer/software/dsh.html.en
  - id: brew:openssh
    reason: >
      OpenSSH supplies the `ssh` remote-command transport that dsh is documented to
      invoke across its configured machine lists.
    rel: adjacent_workflow
    sources:
      - https://www.netfort.gr.jp/~dancer/software/dsh.html.en
      - https://www.openssh.com/manual.html
category: system
package-manager:
  brew: dsh
  debian: dsh
  macports: dsh
  ubuntu: dsh
package-manager-url: https://formulae.brew.sh/formula/dsh
license: GPL-2.0-or-later
tags:
  - cli
  - cluster-management
  - distributed-shell
  - remote-execution
  - ssh
description: Dancer's shell, or distributed shell
executables:
  - dsh
provenance:
  formula: dsh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
