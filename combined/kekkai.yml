id: brew:kekkai
display-name: Kekkai
homepage: https://github.com/catatsuy/kekkai
repo: https://github.com/catatsuy/kekkai
docs:
  - https://github.com/catatsuy/kekkai#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kekkai is a young, specialized security utility. By 2026-07-01, Homebrew formula
      metadata listed v0.2.9, and GitHub API metadata reported 132 stars and one fork.
  package-nerd-significance:
    - >
      Kekkai is notable as a small single-binary alternative to heavier file-integrity
      stacks. It packages a deliberately narrow deployment-time manifest model that fits
      immutable-server and cloud-IAM workflows.
  project-history:
    - >
      The project was created on GitHub on 2025-08-12 by catatsuy. Its README presents
      it as a production-server tool designed around content-only hashing, immutable
      exclude rules, symlink-aware checks, and optional manifest storage in Amazon S3.
  related-projects:
    - Amazon S3 is used as the recommended secure manifest store.
    - >
      Traditional tools such as tar and rsync are named by the README as less suitable
      comparisons for this content-hash use case.
  sources:
    - https://api.github.com/repos/catatsuy/kekkai
    - https://api.github.com/repos/catatsuy/kekkai/releases?per_page=10
    - https://formulae.brew.sh/api/formula/kekkai.json
    - https://github.com/catatsuy/kekkai
    - https://raw.githubusercontent.com/catatsuy/kekkai/main/README.md
  summary:
    - >
      Kekkai is a Go file-integrity monitoring CLI that records content hashes during
      deployment and verifies them later to detect unauthorized file changes.
  timeline:
    - '2025-08-12: GitHub repository created.'
    - '2026-01-03: v0.2.0 release published.'
    - '2026-06-28: v0.2.9 release published.'
    - '2026-07-01: Homebrew formula metadata listed kekkai v0.2.9.'
  usage:
    - >
      The typical workflow is to generate a manifest for a deployed application
      directory, store it locally or in S3, and run periodic verification from cron or
      monitoring systems. The README emphasizes excluding only generated files such as
      logs, caches, uploads, and NFS mounts.
related-packages:
  - id: brew:awscli
    reason: >
      Use AWS CLI to configure versioning, encryption, and lifecycle controls for the S3
      bucket that stores Kekkai manifests, following Kekkai's official production
      guidance.
    rel: adjacent_workflow
    sources:
      - https://github.com/catatsuy/kekkai#s3-configuration
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.html
category: security
package-manager:
  brew: kekkai
package-manager-url: https://formulae.brew.sh/formula/kekkai
license: MIT
tags:
  - cli
  - file-integrity
  - monitoring
  - s3
description: File integrity monitoring tool
executables:
  - kekkai
provenance:
  formula: kekkai
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
