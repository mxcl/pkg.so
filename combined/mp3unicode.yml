history:
  sources:
    - https://formulae.brew.sh/formula/mp3unicode
    - https://github.com/alonbl/mp3unicode
    - https://mp3unicode.sourceforge.net/
    - https://mp3unicode.sourceforge.net/manpage.html
  summary:
    - >
      MP3Unicode is a small command-line utility by Andrei Dubovik and Alon Bar-Lev for
      converting MP3 ID3 tag text between character encodings. Its project page and man
      page describe the core workflow: read ID3v2, or ID3v1 when ID3v2 is absent,
      interpret text fields with a chosen source encoding such as cp1251, and write the
      result back as Unicode ID3v2 while optionally stripping ID3v1.
  usage:
    - >
      The tool belongs to the class of audio-library repair utilities that exist because
      older MP3 collections often contain tags written in local 8-bit encodings. Its
      practical use is batch cleanup: users select a source encoding, choose whether
      ID3v1 and ID3v2 tags should be written, removed, or preserved, and can preview
      changes before modifying files. The 1.2.1 release noted fixes around command-line
      behavior and save-failure reporting, matching its role as a narrow Unix-style
      fixer rather than a general tag editor.
