id: brew:dnscontrol
display-name: DNSControl
homepage: https://dnscontrol.org/
repo: https://github.com/DNSControl/dnscontrol
docs:
  - https://docs.dnscontrol.org/
  - https://dnscontrol.org/
config-file-location:
  unix: ./dnsconfig.js
credentials-file-location:
  unix: ./creds.json
history:
  adoption-history:
    - >
      DNSControl's adoption story is unusually package-nerdy because its own README
      cites Stack Overflow using it for hundreds of domains and subdomains. That
      production pedigree, plus support for many providers, made it attractive to teams
      that wanted DNS changes reviewed, tested, and applied like code.
  package-nerd-significance:
    - >
      DNSControl matters to package and ops people because it turns DNS into a
      reproducible artifact with reviewable diffs. It also represents the CLI packaging
      sweet spot: a Go binary, strong docs, release automation, Docker support, Homebrew
      availability, and enough provider plugins to justify distro packaging.
  project-history:
    - >
      Stack Overflow introduced DNSControl publicly in 2017 as the system it built to
      manage DNS with a describe-once, use-anywhere model. The project grew from Stack
      Exchange's operational needs into an open-source tool with provider plugins, a
      compiler-like intermediate representation, and a documentation site for the DSL
      and provider ecosystem.
  related-projects:
    - >
      Terraform DNS providers solve adjacent infrastructure-as-code problems with a
      different state model.
    - >
      BIND zone files are a common input, output, or migration target for DNSControl
      workflows.
  sources:
    - https://blog.serverfault.com/2017/04/11/introducing-dnscontrol-dns-as-code-has-arrived/
    - https://github.com/DNSControl/dnscontrol
    - https://docs.dnscontrol.org/
    - https://docs.dnscontrol.org/getting-started/getting-started
    - https://docs.dnscontrol.org/commands/creds-json
  summary:
    - >
      DNSControl is an infrastructure-as-code tool for managing DNS records across
      multiple registrars and DNS providers. It uses a JavaScript-like DSL in
      dnsconfig.js, provider credentials in creds.json, and commands such as preview and
      push to turn repository-managed DNS intent into provider changes.
  timeline:
    - '2017: Stack Overflow introduces DNSControl as DNS as code.'
    - '2024: v4.x releases continue the provider-plugin and DNS compiler model.'
    - '2026: The project documents 64 supported DNS providers and registrars in its README.'
  usage:
    - >
      A typical workflow is to keep dnsconfig.js, creds.json, and optional zone files in
      a Git repository, run dnscontrol preview to inspect changes, and run dnscontrol
      push to apply them. The getting-started guide explicitly walks users through
      creating a config directory, dnsconfig.js, creds.json, and a zones directory for
      local testing.
related-packages:
  - id: brew:bind
    reason: >
      BIND is a practical companion when DNSControl is used to import existing BIND
      zones or generate zone files through its BIND provider, while DNSControl supplies
      the review-and-deployment layer around those files.
    rel: adjacent_workflow
    sources:
      - https://docs.dnscontrol.org/getting-started/migrating
      - https://www.isc.org/bind/
category: cloud-infrastructure
package-manager:
  apk: dnscontrol
  brew: dnscontrol
  macports: dnscontrol
  nix: dnscontrol
  winget: StackExchange.DNSControl
package-manager-url: https://formulae.brew.sh/formula/dnscontrol
license: MIT
tags:
  - automation
  - cli
  - dns
  - infrastructure-as-code
  - multi-provider
description: Synchronize your DNS to multiple providers from a simple DSL
executables:
  - dnscontrol
provenance:
  formula: dnscontrol
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
