config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ballerburg's adoption is niche but unusually long-lived: the official site links
      to Fedora, Debian, and Ubuntu packages and lists related ports or
      reimplementations, while the input facts include Homebrew, Debian, Fedora, Nix,
      Ubuntu, and zypper packaging.
    - >
      The Homebrew formula API reported stable version 1.2.3 with 39 installs in the
      previous 30 days as of June 30, 2026.
  package-nerd-significance:
    - >
      Ballerburg is the kind of package that keeps distribution archives charming: a
      small SDL port preserving an Atari ST game in source form, with enough portability
      to appear across Linux distributions and Homebrew. It is not infrastructure, but
      it is a useful example of retro software surviving through package managers.
  project-history:
    - >
      The official Ballerburg SDL site says Ballerburg was originally written in 1987 by
      Eckhard Kruse for the then-new Atari ST machines. It also credits Kruse for
      releasing the source, enabling a later adaptation of the original source code to
      modern operating systems using SDL.
    - >
      The current FramaGit project describes Ballerburg SDL as a classical castle combat
      game for GNU/Linux and other SDL-supported systems, where two castles fire
      cannonballs over a mountain until one king is defeated or capitulates.
  related-projects:
    - The official site links to the original Eckhard Kruse Ballerburg page.
    - >
      The official site also lists related projects including Ballerr, Ballerburg OS X,
      and a Ballerburg X11-Basic reimplementation.
  sources:
    - https://baller.frama.io/
    - https://formulae.brew.sh/api/formula/ballerburg.json
    - https://framagit.org/api/v4/projects/baller%2Fballerburg
  summary:
    - >
      Ballerburg SDL is a free-software port of the classic Ballerburg castle-combat
      game to SDL-supported modern systems. Its historical interest is retrocomputing:
      an Atari ST game from 1987 made buildable and packageable for contemporary
      Unix-like desktops.
  timeline:
    - '1987: Original Ballerburg written by Eckhard Kruse for Atari ST machines.'
    - '2025-02-12: Current FramaGit project metadata reports the repository creation date.'
    - '2026-06-30: Homebrew formula reports stable ballerburg 1.2.3.'
  usage:
    - >
      The package installs the `ballerburg` executable. Users play a two-castle
      artillery game where economic choices, tower building, cannon aiming, terrain, and
      the opponent's king determine the match.
