history:
  adoption-history:
    - >
      Bilibili grew from an anime, comics, and games-oriented video community into a
      broad platform for user-generated video, professionally produced content,
      livestreaming, and mobile and desktop viewing.
    - >
      Native clients extended access beyond the website while retaining Bilibili's
      characteristic danmaku, or time-synchronized on-screen comments. The macOS client
      is also distributed through Homebrew Cask.
  package-nerd-significance:
    - >
      The cask makes the official proprietary desktop client reproducibly installable on
      macOS. It should not be confused with the numerous unofficial Bilibili downloaders
      and client ports hosted on public source-control sites.
  project-history:
    - >
      Bilibili's official corporate filings state that its website launched in June 2009
      and adopted the name bilibili in January 2010. The service subsequently developed
      into a major Chinese video and entertainment platform while retaining its
      community-oriented interaction model.
  related-projects:
    - >
      The desktop client complements Bilibili's official website, mobile applications,
      television client, livestreaming service, and creator ecosystem.
  sources:
    - >
      Official Bilibili investor-relations annual report:
      https://ir.bilibili.com/media/3xfch12a/annual-and-transition-report-of-foreign-private-issuers-sections-13-or-15-d.pdf
    - 'Official application center: https://app.bilibili.com/'
    - 'Official company overview: https://ir.bilibili.com/company-profile'
  summary:
    - 哔哩哔哩 is Bilibili's official desktop client for its video-sharing and streaming platform.
  timeline:
    - "2009: Bilibili's website first launched in June."
    - '2010: The website officially adopted the bilibili name in January.'
    - "2011: Commercial operations commenced, according to Bilibili's corporate disclosures."
    - '2013: Bilibili Inc. was founded.'
    - '2018: Bilibili listed on Nasdaq.'
    - '2021: Bilibili completed a secondary listing in Hong Kong.'
  usage:
    - >
      Users sign in to discover and watch videos, follow creators, access livestreams,
      manage viewing activity, and participate through ordinary comments and
      synchronized danmaku comments.
