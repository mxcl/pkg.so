id: brew:ctl
display-name: CTL
homepage: https://github.com/aces-aswf/CTL
repo: https://github.com/aces-aswf/CTL
docs:
  - https://github.com/ampas/CTL#readme
  - >
    https://www.oscars.org/science-technology/sci-tech-projects/color-transformation-language
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README frames CTL around interchange: two parties using the same CTL program
      and parameters can apply the identical transform to an image. Installation docs
      list Homebrew as the quickest macOS path, source builds for Linux, macOS, and
      Windows, and Docker as an isolated runtime.
  package-nerd-significance:
    - >
      CTL matters to package maintainers because it packages a film-industry color DSL
      together with C++ libraries, OpenEXR integration, command-line rendering tools,
      and optional containerized builds. It sits at the boundary between media
      standards, developer tooling, and reproducible color pipelines.
  project-history:
    - >
      CTL was designed so color transforms could be distributed as concise programs and
      interpreted consistently by color-management systems. Its syntax, concepts, and
      functions are documented in SMPTE RDD 15, and the repository contains the
      interpreter, libraries, ctlrender command, OpenEXR sample applications, tests, and
      documentation.
    - >
      The current official source is maintained under the aces-aswf organization. The
      README explicitly separates CTL from ACES: ACES uses CTL for reference transforms,
      but CTL itself can describe any color transform.
  related-projects:
    - >
      CTL is maintained in the ACES project ecosystem and is commonly encountered
      alongside ACES, OpenEXR, and color-management tooling, while remaining a distinct
      language.
  sources:
    - https://github.com/aces-aswf/CTL#readme
    - https://github.com/aces-aswf/CTL/blob/master/INSTALL.md
    - https://pub.smpte.org/doc/rdd15/20070924-pub/
    - https://api.github.com/repos/aces-aswf/CTL/releases?per_page=10
  summary:
    - >
      CTL, the Color Transformation Language, is a small domain-specific programming
      language for digital color management. The official repository presents it as a
      standalone project maintained in the ACES ecosystem and used to express portable
      color transforms.
  timeline:
    - '2007: CTL language material was documented in SMPTE RDD 15.'
    - '2024: ctl-1.5.3 release published on GitHub.'
    - '2026: ctl-1.5.5 release published on GitHub.'
  usage:
    - >
      The main command-line workflow is ctlrender, which applies a CTL transform to
      image files such as OpenEXR inputs. The package also ships OpenEXR-oriented sample
      tools used in color-pipeline testing and conversion workflows.
related-packages:
  - id: brew:openexr
    reason: >
      CTL ships OpenEXR-based sample applications, so OpenEXR is the natural image-I/O
      companion for applying and testing CTL transforms.
    rel: adjacent_workflow
    sources:
      - https://github.com/aces-aswf/CTL#readme
      - https://github.com/AcademySoftwareFoundation/openexr
category: media
package-manager:
  brew: ctl
  dnf: CTL
  zypper: ctl
