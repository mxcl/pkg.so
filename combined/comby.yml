id: brew:comby
display-name: Comby
homepage: https://comby.dev
repo: https://github.com/comby-tools/comby
docs:
  - https://comby.dev/docs/basic-usage
  - https://comby.dev/docs/overview
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Homebrew installation on macOS, binaries for
      Ubuntu-like Linux systems, Docker images, Windows use through WSL, and source
      builds through OCaml/opam. The supplied package-manager metadata lists Homebrew
      and Nix, while the upstream distribution story emphasizes prebuilt binaries and
      containers.
  package-nerd-significance:
    - >
      Comby matters to package nerds because it packages a source-to-source
      transformation engine as a single CLI spanning many languages. Its OCaml
      implementation, PCRE linkage, binary distribution, Docker image, and Homebrew/Nix
      formulas make it a useful case study in shipping a specialized developer tool
      beyond one language ecosystem.
  project-history:
    - >
      Comby's documentation presents the core idea as lightweight matching of syntactic
      structures such as balanced delimiters, strings, and comments across many
      languages. The README frames it as a practical alternative when regular
      expressions become fragile for nested code constructs.
  related-projects:
    - >
      Comby is related to `sed`, regular-expression search tools, language-server and
      code-intelligence workflows, Sourcegraph-style code search, and language-specific
      refactoring engines.
  sources:
    - https://comby.dev/docs/overview
    - https://github.com/comby-tools/comby
    - https://raw.githubusercontent.com/comby-tools/comby/master/README.md
    - https://comby.dev/blog/
  summary:
    - >
      Comby is a structural search-and-replace tool for source code. It occupies the
      space between regex-based text replacement and full language-specific refactoring
      engines.
  timeline:
    - >
      2019: Public Comby materials and README examples emphasized structural matching
      compared with regex approaches.
    - '2020: The Comby website and documentation moved into a refreshed Docusaurus site.'
    - '2022: Comby blog posts documented experiments with type information for safer rewrites.'
  usage:
    - >
      Users write templates with holes such as `:[condition]` to match code structures
      and replacements that preserve or transform matched parts. Comby is commonly used
      for large mechanical code changes, interactive review of rewrites, and
      language-aware searches where plain `sed` or regexes are too coarse.
related-packages:
  - id: brew:ast-grep
    reason: >
      Choose ast-grep for tree-sitter-backed AST search, composable lint rules, and
      syntax-aware rewriting; choose Comby when parser-independent templates and support
      for arbitrary text formats are more important.
    rel: alternative
    sources:
      - https://ast-grep.github.io/advanced/tool-comparison
      - https://comby.dev/docs/overview
category: developer-tools
