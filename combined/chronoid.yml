  macos: macOS Keychain
history:
  adoption-history:
    - >
      Chronoid targets privacy-conscious macOS users who want automatic activity records
      without sending their work history to a vendor cloud. Its official documentation
      recommends a workflow of granting macOS permissions, creating projects, and
      reviewing reports after collecting activity for a day or two.
  package-nerd-significance:
    - >
      Chronoid is notable among productivity casks for its local-first design: tracked
      activity is held in SQLite, while license keys, API keys, and other secrets are
      placed in macOS Keychain. This makes its storage behavior unusually explicit for
      an automatic time tracker.
  project-history:
    - >
      Chronoid emerged as a native macOS automatic time-tracking and productivity
      application. By 2025 its public release series was adding AI-provider settings,
      Pomodoro and web-blocking features, productivity analysis, scheduled tracking,
      reports, and invoicing.
  related-projects:
    - >
      Chronoid can connect to user-selected AI providers, including local services such
      as Ollama or LM Studio and cloud providers configured by the user.
  sources:
    - https://www.chronoid.app/changelog — official release history.
    - https://www.chronoid.app/docs — official documentation and recommended setup path.
    - >
      https://www.chronoid.app/features/privacy — official local-storage and Keychain
      design notes.
  summary:
    - >
      Chronoid is a local-first macOS time tracker and productivity assistant. It
      records application, website, document, and project activity locally and adds
      reporting, focus, invoicing, and optional AI-assisted workflows.
  timeline:
    - >
      2025: Public 1.0-series changelog documented rapid expansion of tracking, focus,
      reporting, and AI features.
    - '2025-10: Scheduled automatic tracking appeared in version 1.0.54.'
    - '2025-11: Invoice generation appeared in version 1.0.61.'
  usage:
    - >
      Users leave Chronoid running from the macOS menu bar to record activity
      automatically, classify it into projects, inspect timelines and reports, run
      Pomodoro sessions, block distracting websites, and export reports or invoices.
      Automatic tracking requires relevant macOS permissions.
