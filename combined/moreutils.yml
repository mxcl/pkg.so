history:
  project-history:
    - >
      The package's best-known utility is sponge, which reads all standard input before
      writing to its output file so pipelines can safely transform a file in place. The
      collection also includes chronic, combine, errno, ifdata, ifne, isutf8, lckdo,
      mispipe, parallel, pee, ts, vidir, vipe, and zrun. Debian's package page describes
      moreutils as "additional Unix utilities" and lists the same commands, while the
      upstream page notes Debian, Ubuntu, and other distribution availability plus the
      git repository at joeyh.name.
  sources:
    - https://github.com/pgdr/moreutils
    - https://joeyh.name/code/moreutils/
    - https://lwn.net/Articles/672352/
    - https://packages.debian.org/sid/moreutils
  summary:
    - >
      moreutils is Joey Hess's collection of small Unix tools that fill gaps left by the
      traditional toolbox. The project page says it began after Hess blogged about
      whether there was room for new general-purpose Unix tools, concluding that basic
      utilities could still "fall through the cracks". That origin explains the
      package's curatorial style: it collects commands that are small, composable, and
      broadly useful without trying to become a new shell or a large framework.
  usage:
    - >
      In practice, moreutils is package-manager glue for shell users. It is the kind of
      dependency installed because one tiny command solves an awkward pipeline problem:
      ts timestamps streams, vidir edits directory entries in an editor, vipe drops an
      editor into a pipeline, pee tees input to multiple commands, and mispipe preserves
      the exit status shell pipelines often obscure. Its niche overlaps with coreutils,
      util-linux, GNU parallel, and ad hoc shell functions, but its value is the curated
      set of boring commands that compose with the rest of Unix.
related-packages: []
