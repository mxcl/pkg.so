id: brew:enter-tex
display-name: Enter TeX
homepage: https://gitlab.gnome.org/swilmet/enter-tex
repo: https://gitlab.gnome.org/World/gedit/enter-tex
docs:
  - https://gitlab.gnome.org/World/gedit/enter-tex/-/blob/main/docs/more-information.md
  - https://gitlab.gnome.org/swilmet/enter-tex
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project's own documentation points users to operating-system packages via
      Repology and notes old tarball locations for the LaTeXila and GNOME LaTeX names.
      Homebrew also packages it as `enter-tex`, showing that the editor is distributed
      outside Linux desktop repositories even though its roots are clearly GNOME.
  package-nerd-significance:
    - >
      Package nerds care about Enter TeX because it preserves the lineage of a
      long-running GNOME LaTeX editor under a new name. The rename history means package
      metadata, old tarballs, and dependency expectations matter when connecting modern
      formulas to older distro packages.
  project-history:
    - >
      The project began as a focused LaTeX editor and later changed names as it moved
      through GNOME-adjacent identities: LaTeXila, GNOME LaTeX, and Enter TeX. Its
      official documentation frames the application around editing TeX source directly
      while simplifying authoring with build tools, completion, document structure
      navigation, symbol tables, templates, spell-checking, and PDF source
      synchronization.
    - >
      Enter TeX depends on GTK 3 and a set of Gedit Technology libraries, which places
      it in the GNOME text-editor ecosystem rather than among standalone terminal LaTeX
      helpers.
  related-projects:
    - >
      Enter TeX is based on Gedit Technology libraries including libgedit-amtk,
      libgedit-gfls, libgedit-gtksourceview, libgedit-tepl, and gspell.
    - >
      Latexmk is the recommended default build helper, with traditional TeX commands
      such as pdflatex, dvipdf, and bibtex also supported.
  sources:
    - https://gitlab.gnome.org/swilmet/enter-tex/-/blob/main/README.md
    - https://gitlab.gnome.org/World/gedit/enter-tex/-/blob/main/docs/more-information.md
    - https://formulae.brew.sh/formula/enter-tex
  summary:
    - >
      Enter TeX is a GTK/GNOME-oriented TeX and LaTeX editor whose official README says
      development began in 2009. It continues the same application line that was
      previously known as LaTeXila and then GNOME LaTeX.
  timeline:
    - '2009: Development begins, according to the official README.'
    - '2010s: The application is known as LaTeXila and later GNOME LaTeX.'
    - '2020s: The project is distributed as Enter TeX with releases created from Git tags.'
  usage:
    - >
      Enter TeX is used as a graphical editor for TeX and LaTeX documents. Its
      build-tool integration defaults to Latexmk while still supporting lower-level
      commands such as pdflatex, dvipdf, and bibtex, which suits users who want a GUI
      but still work directly with TeX source.
    - >
      The package is most relevant to desktop users who want GNOME-style editing,
      project management, completion, document outlines, and symbol helpers rather than
      a terminal-only LaTeX workflow.
related-packages:
  - id: brew:texlive
    reason: >
      Install TeX Live alongside Enter TeX to provide the TeX engines, macro packages,
      fonts, and utilities needed to compile documents edited in the application.
    rel: adjacent_workflow
    sources:
      - https://gitlab.gnome.org/World/gedit/enter-tex/-/blob/main/docs/more-information.md
      - https://www.tug.org/texlive/
category: productivity
package-manager:
  brew: enter-tex
  debian: enter-tex
  nix: enter-tex
  pacman: enter-tex
package-manager-url: https://formulae.brew.sh/formula/enter-tex
license: GPL-3.0-or-later
