id: brew:osctrl-mcp
display-name: osctrl-mcp
homepage: https://docs.osctrl.net/components/osctrl-mcp/
repo: https://github.com/jmpsec/osctrl
docs:
  - https://docs.osctrl.net/
  - https://docs.osctrl.net/components/osctrl-mcp
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The parent osctrl project reports production use, but the reviewed sources do not
      establish separate adoption figures for its MCP component.
  package-nerd-significance:
    - >
      The separately packaged executable connects the osquery fleet-management ecosystem
      with clients implementing Model Context Protocol.
  project-history:
    - >
      osctrl-mcp is developed within osctrl, whose purpose is managing systems through
      osquery's remote API. The project provides both a standalone MCP executable and an
      optional hosted MCP endpoint.
  related-projects:
    - osctrl; osquery; Model Context Protocol.
  sources:
    - '[Official osctrl README](https://github.com/jmpsec/osctrl#readme).'
    - >
      source_facts.executables and source_facts.package-manager identify the separately
      packaged executable.
  summary:
    - osctrl-mcp provides MCP clients with access to osctrl fleet-management capabilities.
  timeline:
    - '2026: The official README documents standalone and hosted MCP interfaces.'
  usage:
    - >
      The standalone server communicates over standard input and output. Fleet tools
      enforce permissions; mutating tools are separately gated and disabled by default.
category: security
package-manager:
  brew: osctrl-mcp
package-manager-url: https://formulae.brew.sh/formula/osctrl-mcp
license: MIT
tags:
  - cli
  - endpoint-management
  - fleet-management
  - mcp-server
  - osquery
description: Fast and efficient osquery management
executables:
  - osctrl-mcp
provenance:
  formula: osctrl-mcp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
