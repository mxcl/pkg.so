id: brew:git-town
display-name: Git Town
homepage: https://www.git-town.com/
repo: https://github.com/git-town/git-town
docs:
  - https://www.git-town.com/
  - https://www.git-town.com/all-commands
  - https://www.git-town.com/configuration-file.html
config-file-location:
  unix:
    - git-town.toml
    - .git-town.toml
    - .git-branches.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Git Town's adoption is tied to teams that want a consistent branch lifecycle
      without replacing Git hosting. Package availability through Homebrew, MacPorts,
      Nix, pacman, Scoop, and zypper makes the same workflow commands installable across
      developer workstations.
  package-nerd-significance:
    - >
      The package is significant because it shows how much workflow policy can live in a
      Git extension without requiring a hosted service. It is a single CLI that packages
      branch naming, stack metadata, forge integration, and cleanup behavior into
      reproducible local commands.
  project-history:
    - >
      The GitHub repository was created in 2014. The project grew from branch workflow
      automation into a broader Git productivity layer that supports Git Flow, GitHub
      Flow, GitLab Flow, trunk-based development, monorepos, and stacked changes.
    - >
      The command set and configuration model continued to evolve through the 2020s. The
      documentation describes configuration files named git-town.toml, .git-town.toml,
      and .git-branches.toml, while the changelog records work on stacked proposal
      breadcrumbs, direct commits into ancestor branches, forge connectors, CI/headless
      behavior, and configuration precedence.
  related-projects:
    - >
      Git Town sits beside Git itself, GitHub and GitLab forge CLIs, stacked-change
      tools, and branch-management workflows such as Git Flow and trunk-based
      development.
  sources:
    - https://api.github.com/repos/git-town/git-town
    - https://formulae.brew.sh/formula/git-town
    - https://github.com/git-town/git-town
    - https://raw.githubusercontent.com/git-town/git-town/main/CHANGELOG.md
    - https://raw.githubusercontent.com/git-town/git-town/main/README.md
    - https://www.git-town.com/
    - https://www.git-town.com/all-commands
    - https://www.git-town.com/configuration-file.html
  summary:
    - >
      Git Town is a high-level Git command-line interface for managing feature branches,
      stacked changes, pull requests, and branch cleanup. It wraps common multi-branch
      workflows in memorable commands such as hack, sync, propose, ship, append,
      prepend, and swap.
  timeline:
    - '2014: Git Town repository created.'
    - >
      2025: Git Town 22.5.0 added proposal breadcrumbs for stacked branches and a commit
      command for committing into ancestor branches.
    - >
      2026: Git Town 23.0.0 changed up/down navigation semantics and documented
      non-interactive behavior for headless environments.
  usage:
    - >
      Practitioners use Git Town to create up-to-date feature branches, synchronize
      branch stacks, create pull or merge requests, navigate branch hierarchies, ship
      completed work, and clean up local and remote branches. In stacked-change
      workflows, commands such as append, prepend, set-parent, diff-parent, and swap
      encode parent-child branch relationships that plain Git does not model directly.
related-packages:
  - id: brew:git-flow
    reason: >
      git-flow is the more prescriptive alternative for teams committed to long-lived
      develop, release, and hotfix branches, while Git Town also supports GitHub Flow,
      GitLab Flow, trunk-based development, and stacked changes.
    rel: alternative
    sources:
      - https://github.com/nvie/gitflow#readme
      - https://www.git-town.com/introduction.html
  - id: brew:gh
    reason: >
      Git Town can use GitHub CLI for authenticated pull-request operations while Git
      Town coordinates the surrounding branch and stack workflow.
    rel: adjacent_workflow
    sources:
      - https://www.git-town.com/configuration.html
      - https://cli.github.com/manual/gh
  - id: brew:glab
    reason: >
      Git Town can use GLab for authenticated GitLab merge-request operations while
      continuing to manage local branch synchronization and lineage.
    rel: adjacent_workflow
    sources:
      - https://www.git-town.com/configuration.html
      - https://docs.gitlab.com/cli/
  - id: brew:git
    reason: >
      Git Town calls the installed Git executable and stores part of its configuration
      in local or global Git metadata.
    rel: adjacent_workflow
    sources:
      - https://www.git-town.com/install.html
      - https://www.git-town.com/preferences.html
      - https://git-scm.com/docs/git
category: developer-tools
package-manager:
  brew: git-town
  macports: git-town
  nix: git-town
  pacman: git-town
  scoop: main/git-town
  zypper: git-town
package-manager-url: https://formulae.brew.sh/formula/git-town
license: MIT
tags:
  - branch-management
  - cli
  - git
  - stacked-changes
  - workflow
description: High-level command-line interface for Git
executables:
  - git-town
provenance:
  formula: git-town
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
