id: brew:addlicense
display-name: addlicense
homepage: https://github.com/google/addlicense
repo: https://github.com/google/addlicense
docs:
  - https://github.com/google/addlicense#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      addlicense fits the common open-source maintenance workflow where license headers
      are enforced in presubmit, CI, or pre-commit rather than by hand. The supplied
      package-manager metadata shows Homebrew and Nix packaging, while the README
      documents go install, Docker, and an official pre-commit hook.
  package-nerd-significance:
    - >
      For package and release engineers, addlicense is a boring tool in the best sense:
      it makes source-header policy reproducible and automatable. It is useful in repos
      where license conformance needs to be enforced before vendoring, releasing, or
      importing code into downstream packaging.
  project-history:
    - >
      The official GitHub repository was created in June 2016. Its README describes a Go
      program that modifies source files in place, avoids duplicating headers that
      already exist, and supports Apache, BSD, MIT, and MPL-style headers plus custom
      license files.
    - >
      The project is hosted under the google organization but explicitly says it is not
      an official Google product. The official tag list shows stable v1.x tags, and the
      README now documents Go installation, a GitHub Container Registry image, and
      pre-commit integration.
  related-projects:
    - pre-commit is documented as an official hook consumer.
    - doublestar is referenced by the README for ignore-pattern semantics.
  sources:
    - https://api.github.com/repos/google/addlicense
    - https://api.github.com/repos/google/addlicense/tags?per_page=100
    - https://github.com/google/addlicense#readme
    - source_facts.package-manager
  summary:
    - >
      addlicense is a Google-maintained Go command that recursively scans source trees
      and adds or checks copyright license headers. It is deliberately simple: run it
      over patterns, choose a supported license template or file, and optionally fail CI
      with -check.
  timeline:
    - '2016-06: GitHub repository created.'
    - 'v1.0.0: First stable tag appears in the official tag list.'
    - 'Current README: Go install, container, and pre-commit workflows are documented.'
  usage:
    - >
      Typical use is addlicense . or addlicense with multiple file and directory
      patterns. Important package-maintainer flags include -check for verification-only
      runs, -ignore for vendored or generated files, -l for the license family, -f for
      custom text, -s for SPDX identifiers, and -c/-y for copyright holder and year.
related-packages:
  - id: brew:pre-commit
    reason: >
      pre-commit is the strongest companion because addlicense publishes an official
      hook configuration that lets repositories enforce license headers automatically
      before commits and in CI.
    rel: adjacent_workflow
    sources:
      - https://github.com/google/addlicense#running-with-pre-commit
      - https://pre-commit.com/
category: developer-tools
package-manager:
  brew: addlicense
  nix: addlicense
package-manager-url: https://formulae.brew.sh/formula/addlicense
license: Apache-2.0
tags:
  - cli
  - go
  - license
  - pre-commit
  - source-code
description: Scan directories recursively to ensure source files have license headers
executables:
  - addlicense
provenance:
  formula: addlicense
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
