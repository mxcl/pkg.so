config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Bento4 became useful to streaming-video developers because it put many packaging
      chores into small Unix-style commands. Instead of opening a media framework or
      writing MP4 box parsing code, users can run tools such as mp4dump, mp4info,
      mp4fragment, mp4dash, mp4hls, mp4encrypt, and mp4decrypt.
    - >
      Distribution adoption is broad for a media tool: the input facts list Homebrew,
      MacPorts, Nix, apk, Scoop, and WinGet. That cross-platform packaging matches the
      project's own design goal of portable SDK source plus ready command-line
      utilities.
  package-nerd-significance:
    - >
      Bento4 is package-nerd significant because it is a dense bundle of specialist
      media executables. The Homebrew formula exposes a whole toolbox, not just one
      command, so downstream package manifests become a map of MP4 operations.
    - >
      It also sits at a useful boundary between standards and everyday packaging. ISO
      BMFF, DASH, CMAF, CENC, Widevine/PlayReady-related packaging, and HLS all surface
      as concrete CLI names that can be scripted and version-pinned.
  project-history:
    - >
      The public GitHub repository dates to January 2015, but the project presents
      itself as an SDK rather than only a CLI collection: portable C++ code, build
      targets for Unix-like systems, Windows, macOS, iOS, Android, and tool binaries
      built on the same API.
    - >
      Bento4 tracks the practical evolution of MP4 distribution. Its README and
      documentation cover fragmented MP4, MPEG-DASH, HLS, CMAF, Common Encryption, PIFF,
      OMA DCF/PDCF, metadata, and codec-specific utilities for AVC, HEVC, AAC, AC-3,
      EC-3, Dolby Atmos, DTS, ALAC, and other formats.
  related-projects:
    - >
      FFmpeg often appears nearby in media pipelines, but Bento4 focuses more directly
      on MP4 boxes, fragmentation, packaging, and encryption utilities.
    - GPAC/MP4Box is a related MP4/DASH packaging toolchain in the same command-line culture.
    - >
      DASH, HLS, CMAF, CENC, Widevine, and PlayReady are the standards and DRM
      ecosystems that make Bento4 operationally important.
  sources:
    - https://github.com/axiomatic-systems/Bento4
    - https://www.bento4.com/documentation
  summary:
    - >
      Bento4 is Axiomatic Systems' C++ SDK and command-line tool suite for ISO Base
      Media File Format and MP4-family workflows. It is one of the tools package people
      reach for when they need to inspect, fragment, encrypt, decrypt, mux, tag, or
      package MP4 assets from a shell.
  timeline:
    - '2015: The axiomatic-systems/Bento4 GitHub repository was created.'
    - >
      2020: Release notes in the README record the 1.6.0-638 line with AV1,
      documentation, inspector API, and bug-fix work.
    - >
      2020s: Bento4 remained packaged across Unix, macOS, Windows, and Linux package
      ecosystems for MP4/DASH/HLS/CMAF workflows.
  usage:
    - >
      Typical package use is file-oriented: inspect an MP4's boxes, extract or mux
      elementary streams, create fragmented MP4 for streaming, produce DASH or HLS
      outputs, generate PSSH boxes, or apply/decode Common Encryption workflows.
    - >
      Because the tools are composable CLIs, Bento4 often appears in build pipelines,
      video test fixtures, CDN preparation jobs, DRM packaging flows, and debugging
      sessions where ffmpeg alone is too codec-focused and not box-structure-specific
      enough.
related-packages:
  - id: brew:gpac
    reason: >
      Choose GPAC when you want a broader standards-oriented multimedia framework
      centered on MP4Box and a general filter engine, while Bento4 offers a focused
      suite of MP4 packaging and encryption utilities.
    rel: alternative
    sources:
      - https://www.bento4.com/documentation/
      - https://wiki.gpac.io/MP4Box/MP4Box
      - https://wiki.gpac.io/Filters/Filters
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg when the job primarily requires encoding, decoding, filtering, or
      general-purpose muxing; choose Bento4 when detailed MP4 box manipulation,
      fragmentation, or DRM packaging is central.
    rel: alternative
    sources:
      - https://www.bento4.com/documentation/
      - https://ffmpeg.org/about.html
      - https://ffmpeg.org/ffmpeg-formats.html
