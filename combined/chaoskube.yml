id: brew:chaoskube
display-name: chaoskube
homepage: https://github.com/linki/chaoskube
repo: https://github.com/linki/chaoskube
docs:
  - https://github.com/linki/chaoskube#readme
config-file-location:
  unix: ~/.kube/config
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      Distribution centered on Kubernetes-native deployment as well as package-manager
      installs. The README documents Helm installation through a chaoskube chart and raw
      Kubernetes manifests, while the supplied facts show Homebrew formula distribution.
  package-nerd-significance:
    - >
      chaoskube is package-nerd interesting because it packages a chaos-monkey pattern
      into one Go binary plus Kubernetes deployment artifacts: a small CLI that also
      behaves like a cluster workload and is installable through Homebrew and Helm.
  project-history:
    - >
      The linki/chaoskube repository was created in 2016. Its README frames the tool
      around a narrow chaos-engineering job: connect to a Kubernetes cluster, select
      eligible pods, and terminate one at intervals, with dry-run mode enabled by
      default.
  related-projects:
    - >
      The README compares chaoskube with kube-monkey, PowerfulSeal, fabric8 chaos
      monkey, k8aos, pod-reaper, kubernetes-pod-chaos-monkey, and KubeInvaders.
    - Kubernetes and Helm are central runtime/distribution dependencies for the project.
  sources:
    - https://github.com/linki/chaoskube#readme
    - https://formulae.brew.sh/formula/chaoskube
  summary:
    - >
      chaoskube is a Kubernetes chaos-engineering tool that periodically terminates
      random pods so teams can test how workloads behave under pod failure.
  timeline:
    - '2016: Public GitHub repository created for linki/chaoskube.'
    - '2016: Early v0.1.0 tag established the chaoskube release line.'
    - '2018: README examples show v0.21.0-era usage against Kubernetes 1.10 clusters.'
    - '2026: Repository metadata shows continued maintenance, with v0.39.0 among recent tags.'
  usage:
    - >
      Users run chaoskube locally against their current kubeconfig or deploy it inside a
      cluster. The README documents filters for namespaces, labels, annotations, owner
      kinds, pod names, minimum age, quiet times, dry-run mode, metrics, Slack
      notification, and interval controls.
related-packages:
  - id: brew:helm
    reason: >
      Helm complements chaoskube as its documented in-cluster installation method; the
      official README provides a chart repository and `helm install` workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/linki/chaoskube#helm
      - https://helm.sh/docs/
category: cloud-infrastructure
package-manager:
  brew: chaoskube
package-manager-url: https://formulae.brew.sh/formula/chaoskube
license: MIT
tags:
  - chaos-engineering
  - cli
  - go
  - helm
  - kubernetes
  - pods
  - resilience-testing
description: Periodically kills random pods in your Kubernetes cluster
executables:
  - chaoskube
provenance:
  formula: chaoskube
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
