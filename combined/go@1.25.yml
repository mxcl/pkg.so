id: brew:go@1.25
display-name: Go 1.25
homepage: https://go.dev/
repo: https://go.googlesource.com/go
docs:
  - https://go.dev/doc
  - https://go.dev/ref/mod
  - https://pkg.go.dev/cmd/go
config-file-location:
  linux: >
    ~/.config/go/env (default GOENV file, derived from Go docs: per-user config dir plus
    go/env)
  macos: >
    ~/Library/Application Support/go/env (default GOENV file, derived from Go docs:
    per-user config dir plus go/env)
  windows: >
    %AppData%\go\env (default GOENV file, derived from Go docs: per-user config dir plus
    go/env)
credentials-file-location: null
history:
  adoption-history:
    - >
      Go adoption accelerated after the Go 1 compatibility milestone because users could
      treat the language and standard library as a stable platform. The Go project later
      integrated modules into the go command: Go 1.11 introduced preliminary module
      support, and Go 1.13 made the module mirror and checksum database part of default
      module authentication and download behavior.
    - >
      Package managers use versioned Go formulae so projects can build against a named
      toolchain line when they need reproducible compiler behavior, compatibility
      testing, or staggered migrations between Go releases.
  package-nerd-significance:
    - >
      Go matters to package maintainers because it is both a language runtime and a
      build toolchain for a large ecosystem of statically linked command-line programs.
      Versioned Go packages are important when downstream packages need predictable
      compiler semantics, module behavior, or bootstrap compatibility.
    - >
      The go command's module proxy and checksum database changed packaging culture by
      making dependency versions, module archives, and integrity checks part of the
      default development workflow rather than an external vendoring convention.
  project-history:
    - >
      Robert Griesemer, Rob Pike, and Ken Thompson began sketching Go at Google on
      September 21, 2007, with early compiler work following in January 2008. The Go
      project was launched publicly as open source on November 10, 2009, and Go 1 was
      released on March 28, 2012 as the stable compatibility baseline for the language
      and core libraries.
    - >
      After Go 1, the project evolved through regular major releases that maintained the
      Go 1 compatibility promise while improving the compiler, runtime, standard
      library, supported ports, and command-line tools. Go 1.25.0 was released on August
      12, 2025 as one of those regular release-line milestones.
  related-projects:
    - >
      The core project is the Go source tree and toolchain. Related official surfaces
      include the Go documentation site, the Go module reference, pkg.go.dev for package
      documentation, the Go module mirror, and the checksum database.
  sources:
    - https://go.dev/blog/1year
    - https://go.dev/blog/go1
    - https://go.dev/blog/go1.11
    - https://go.dev/blog/go1.13
    - https://go.dev/doc/devel/release
    - https://go.dev/doc/faq
    - https://go.dev/doc/go1.25
    - https://go.dev/ref/mod
  summary:
    - >
      Go is an open-source, compiled programming language and toolchain designed around
      simplicity, efficient builds, concurrency, and production-scale software. The
      Homebrew go@1.25 formula is a versioned package track for the Go 1.25 release
      line; its historical context is the broader Go project rather than a separate
      fork.
  timeline:
    - '2007: Robert Griesemer, Rob Pike, and Ken Thompson began sketching the goals for Go.'
    - '2009: The Go project was launched publicly as open source.'
    - '2012: Go 1 established the long-term compatibility baseline.'
    - '2018: Go 1.11 introduced preliminary module support.'
    - '2019: Go 1.13 used the Go module mirror and checksum database by default.'
    - '2025: Go 1.25.0 was released.'
  usage:
    - >
      The package provides the go command and gofmt, covering module-aware builds,
      tests, formatting, dependency resolution, cross-compilation, and installation of
      Go tools. For a versioned track such as go@1.25, users typically install it to
      keep a specific Go release line available alongside other toolchain versions.
related-packages: []
category: language-runtime
package-manager:
  apk: go
  brew: go@1.25
  chocolatey: go
  dnf: golang
  macports: go-1.25
  nix: go_1_25
  pacman: go
  scoop: main/go
  winget: GoLang.Go
  zypper: go1.25
package-manager-url: https://formulae.brew.sh/formula/go@1.25
license: BSD-3-Clause
