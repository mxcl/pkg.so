id: brew:erdtree
display-name: erdtree
homepage: https://github.com/solidiquis/erdtree
repo: https://github.com/solidiquis/erdtree
docs:
  - https://github.com/solidiquis/erdtree#readme
config-file-location:
  unix:
    - $ERDTREE_TOML_PATH
    - $XDG_CONFIG_HOME/erdtree/.erdtree.toml
    - $XDG_CONFIG_HOME/.erdtree.toml
    - ~/.config/erdtree/.erdtree.toml
    - ~/.erdtree.toml
    - $ERDTREE_CONFIG_PATH
    - $XDG_CONFIG_HOME/erdtree/.erdtreerc
    - $XDG_CONFIG_HOME/.erdtreerc
    - ~/.config/erdtree/.erdtreerc
    - ~/.erdtreerc
  windows:
    - '%APPDATA%\erdtree\.erdtree.toml'
    - '%APPDATA%\erdtree\.erdtreerc'
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is package-manager driven: the input facts list Homebrew, MacPorts, Nix,
      Arch, Scoop, winget, and zypper packages. That spread matches the project's
      cross-platform claim and its appeal as a workstation utility rather than a server
      daemon or library.
  package-nerd-significance:
    - >
      erdtree matters to command-line tool collectors because it combines several
      familiar Unix inspection patterns into one packaged binary. It is also a neat
      packaging case: one Rust crate surfaces as a cross-platform CLI with shell
      completions, config files, and operating-system-specific filesystem behavior.
  project-history:
    - >
      The official repository was created in 2022 and reached a 1.0 GitHub release in
      2023. The project is part of the modern wave of Rust replacements and hybrids for
      classic Unix command-line utilities, with attention to Git ignore rules, colored
      output, icons, multiple layout modes, and parallel traversal.
  related-projects:
    - >
      erdtree is explicitly compared with `tree`, `du`, `find`, `wc`, `ls`, exa, dua,
      dust, and fd in its README.
  sources:
    - https://github.com/solidiquis/erdtree
    - https://github.com/solidiquis/erdtree/releases
    - https://api.github.com/repos/solidiquis/erdtree
  summary:
    - >
      erdtree, installed as `erd`, is a Rust filesystem tree viewer and disk-usage
      analyzer. Its README positions it as a cross-platform, multi-threaded blend of
      `du`, `tree`, `find`, `wc`, and `ls`.
  timeline:
    - '2022: The GitHub repository was created.'
    - '2023: Version 1.0 was published on GitHub releases.'
    - >
      2020s: Packages appear across Unix-like and Windows package managers according to
      the supplied package-manager facts.
  usage:
    - >
      Users run `erd` against a directory to inspect file trees and disk usage. The
      README documents options for logical or physical sizes, line and word counts, long
      metadata views, glob or regex filtering, depth limits, sorting, icons, Git ignore
      behavior, thread counts, and one-filesystem traversal.
related-packages:
  - id: brew:dust
    reason: >
      Choose Dust when you primarily want a modern, non-interactive `du` replacement;
      erdtree's own comparison positions it as the more specialized disk-usage
      alternative.
    rel: alternative
    sources:
      - https://github.com/solidiquis/erdtree#comparisons-against-similar-programs
      - https://github.com/bootandy/dust
  - id: brew:dua-cli
    reason: >
      Choose dua-cli when interactive disk-usage exploration and cleanup matter more
      than erdtree's static tree, metadata, and search-oriented views.
    rel: alternative
    sources:
      - https://github.com/solidiquis/erdtree#dua
      - https://github.com/Byron/dua-cli
  - id: brew:fd
    reason: >
      Use fd for more comprehensive file finding, while retaining erdtree for tree
      visualization and directory-size analysis.
    rel: adjacent_workflow
    sources:
      - https://github.com/solidiquis/erdtree#fd
      - https://github.com/sharkdp/fd
category: system
package-manager:
  brew: erdtree
  macports: erd
  nix: erdtree
  pacman: erdtree
  scoop: main/erdtree
  winget: Solidiquis.Erdtree
  zypper: erdtree
package-manager-url: https://formulae.brew.sh/formula/erdtree
license: MIT
tags:
  - cli
  - cross-platform
  - disk-usage
  - file-tree
  - filesystem
  - rust
description: Multi-threaded file-tree visualizer and disk usage analyzer
executables:
  - erd
provenance:
  formula: erdtree
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
