history:
  adoption-history:
    - >
      libwmf became useful in Unix graphics and document-conversion stacks because WMF
      was common in Microsoft Office-era documents and clip art. Package-manager
      adoption follows the need to convert or render legacy WMF assets in automated
      pipelines, desktop software, and document import filters.
  package-nerd-significance:
    - >
      libwmf is the sort of package that keeps old document formats from becoming data
      loss. Its nerd appeal is in the bridge: a small Unix library and converter
      collection sitting between Microsoft GDI-era metafile records and modern open
      graphics formats such as SVG.
  project-history:
    - >
      WMF predates libwmf: RFC 7903 says Microsoft released Windows Metafile with
      Windows 3.0, and Microsoft's protocol documentation describes WMF as an image
      container made of variable-length metafile records. libwmf exists to interpret
      that Windows-oriented graphics record stream on non-Windows and package-managed
      systems.
    - >
      The libwmf README preserves early project history: Francis James Franklin
      described a May 2001 restructuring based on Caolan McNamara's libwmf, moving it
      away from batch-process origins and toward a better-behaved library with
      device-layer output interfaces. The NEWS file records a libwmf 0.2.1 release on
      2001-08-22.
  related-projects:
    - >
      Related formats and tools include Windows GDI, EMF, EMF+, Microsoft Office and
      clip-art workflows, SVG, EPS, Xfig, GD, ImageMagick-style conversion pipelines,
      and document import filters that need legacy vector graphics support.
  sources:
    - https://github.com/caolanm/libwmf
    - https://github.com/caolanm/libwmf/blob/master/NEWS
    - https://github.com/caolanm/libwmf/releases
    - >
      https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-wmf/4813e7fd-52d0-4f42-965f-228c8b7488d2
    - https://www.rfc-editor.org/info/rfc7903/
  summary:
    - >
      libwmf is a library and tool suite for reading Microsoft Windows Metafile graphics
      and converting them to formats such as SVG, EPS, FIG, GD, and other image outputs.
      It is a compatibility package for old office, clip-art, and document workflows
      where WMF files still appear.
  timeline:
    - >
      1990: Windows 3.0 era introduces WMF as a Windows graphics interchange format,
      according to RFC 7903.
    - >
      2001-05-13: The libwmf README describes a major restructuring candidate for libwmf
      0.2.0.
    - '2001-08-22: libwmf 0.2.1 release is recorded in NEWS.'
    - >
      2016-09: RFC 7903 registers Windows image media types including image/wmf and
      image/x-wmf.
    - >
      2024-04-23: Microsoft publishes protocol revision 18.0 of the Windows Metafile
      Format specification.
    - >
      2026: The GitHub releases page lists libwmf 0.2.15 with parser validation,
      resource-limit, test-suite, and MSVC build fixes.
  usage:
    - >
      The Homebrew package includes commands such as wmf2eps, wmf2fig, wmf2gd, wmf2svg,
      libwmf-config, and libwmf-fontmap. Users run it directly for conversion, while
      applications link the library when they need WMF import or rendering support.
