id: brew:install-nothing
display-name: install-nothing
homepage: https://github.com/buyukakyuz/install-nothing
repo: https://github.com/buyukakyuz/install-nothing
docs:
  - https://github.com/buyukakyuz/install-nothing#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package crossed from a GitHub novelty into package-manager distribution. The
      input metadata records Homebrew, Nix, and Winget entries, and Homebrew packages
      the v0.5.0 source archive.
  package-nerd-significance:
    - >
      For package nerds, install-nothing is mostly a meta-package joke: a real formula
      whose purpose is to parody installer progress, bootstrap rituals, and the
      emotional texture of watching dependencies install.
    - >
      Its significance is in the contradiction between function and packaging. The
      package has install instructions, releases, binaries, Docker support, and
      package-manager entries for a tool whose documented job is to do no real
      installation work.
  project-history:
    - >
      The GitHub repository was created in 2025. The README describes a terminal program
      that simulates installing things, includes an asciinema demo, and documents
      binary, source, and Docker usage.
    - >
      Tagged releases began with early 0.x versions and reached v0.5.0 in 2025. The
      README exposes small controls for selecting or excluding simulated installation
      stages, keeping the joke interactive rather than a static message.
  related-projects:
    - >
      install-nothing is related more to terminal demos, installer parodies, Rust CLIs,
      Cargo-built novelty tools, Homebrew joke packages, Nix packaging, and Winget
      distribution than to a functional dependency manager.
  sources:
    - https://api.github.com/repos/buyukakyuz/install-nothing
    - https://api.github.com/repos/buyukakyuz/install-nothing/releases
    - https://formulae.brew.sh/api/formula/install-nothing.json
    - https://github.com/buyukakyuz/install-nothing
  summary:
    - >
      install-nothing is a Rust terminal application that simulates installing things
      while deliberately not installing anything. Its package history is short, but it
      fits a recognizable CLI culture niche: a package-manager joke that is still
      distributed as a real executable.
  timeline:
    - '2025: GitHub repository created.'
    - '2025: v0.3.0, v0.4.x, and v0.5.0 tags appear.'
    - '2025: Homebrew packages v0.5.0 from the GitHub source archive.'
  usage:
    - >
      Users either run the downloaded binary, run it from source with Cargo, or run it
      in Docker. The command accepts optional stage names and an exclusion flag, then
      prints simulated installation progress until interrupted or completed.
related-packages: []
category: developer-tools
