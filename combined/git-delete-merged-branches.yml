id: brew:git-delete-merged-branches
display-name: git-delete-merged-branches
homepage: https://github.com/hartwork/git-delete-merged-branches
repo: https://github.com/hartwork/git-delete-merged-branches
docs:
  - https://github.com/hartwork/git-delete-merged-branches#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README lists install paths through pip and distribution packages
      including Arch AUR, Debian, Gentoo, Homebrew, MacPorts, NixOS, Ubuntu, and Void
      Linux. That makes the tool visible in the same package-manager space as Git
      workflow helpers rather than only as a Python package.
    - >
      Its README also documents a command-name clash with git-extras, whose utility
      collection ships a simpler `git-delete-merged-branches` script. The standalone
      project responds by offering `python3 -m git_delete_merged_branches` and `git-dmb`
      invocation paths.
  package-nerd-significance:
    - >
      The package is a good example of a small workflow CLI whose value lies in
      guardrails: branch deletion is risky, so the project packages conservative
      prompts, dry runs, `--force-with-lease`, and no shell-command construction.
    - >
      Its overlap with git-extras is package-manager-relevant because PATH order can
      decide which command a user runs when both packages are installed.
  project-history:
    - >
      The upstream Git history begins in July 2020 with code for version 1.0.0. The
      project advanced quickly through early releases and later settled into a
      maintained CLI with tests, pre-commit integration, and package-manager
      distribution.
    - >
      The README frames the tool around safe cleanup rather than raw deletion. It
      detects multiple forms of de-facto merges, including rebase merges, squash merges
      with extra effort, and cherry-picks by leveraging `git cherry`; it also supports
      workflows with multiple release branches.
  related-projects:
    - >
      git-extras is a related utility collection and a direct command-name conflict
      noted by the README.
    - >
      GitHub's automatic deletion of branches for merged pull requests is mentioned as a
      complementary hosting-side cleanup feature.
    - `git cherry` is the Git command named by the README as part of merge-detection logic.
  sources:
    - >
      https://formulae.brew.sh/formula/git-delete-merged-branches documents Homebrew
      packaging.
    - >
      https://github.com/hartwork/git-delete-merged-branches documents installation,
      examples, features, safety rules, best practices, and the git-extras command-name
      clash.
    - >
      https://github.com/hartwork/git-delete-merged-branches/releases documents release
      progression.
  summary:
    - >
      git-delete-merged-branches is a Python command-line tool for cleaning up local and
      remote Git branches after their work has been merged. Its package installs the
      shorter `git-dmb` executable and documents safety-focused branch deletion.
  timeline:
    - '2020: The repository begins with version 1.0.0 code.'
    - '2020: Rapid 1.x through 6.x releases establish the CLI and packaging shape.'
    - '2021: Version 6.4.0 continues the maintained Python CLI line.'
    - '2022: Version 7.4.0 lands after several 7.x releases.'
    - '2025: Version 7.5.0 is released.'
    - '2026: Version 7.6.0 is released.'
  usage:
    - >
      Practitioners run it inside a repository to update remotes, fast-forward tracked
      release branches, list local and remote branches that appear merged, and ask
      before deletion. A `--dry-run` mode lets users inspect actions first, and
      `--verbose` shows Git commands.
    - >
      The tool is used when teams accumulate topic branches across local clones, forks,
      and remote hosts. It is provider-agnostic and documents use with GitHub, GitLab,
      Gitea, and other Git hosting because it works through Git commands rather than a
      hosting API.
related-packages:
  - id: brew:git-extras
    reason: >
      Choose git-extras when you want its broader collection of Git utilities and only
      need its simpler merged-branch deletion script; avoid installing both commands
      without accounting for their documented PATH collision.
    rel: alternative
    sources:
      - >
        https://github.com/hartwork/git-delete-merged-branches#name-clash-on-git-delete-merged-branches-with-git-extras
      - https://github.com/tj/git-extras
category: developer-tools
package-manager:
  brew: git-delete-merged-branches
  debian: git-delete-merged-branches
  nix: git-delete-merged-branches
  ubuntu: git-delete-merged-branches
package-manager-url: https://formulae.brew.sh/formula/git-delete-merged-branches
license: GPL-3.0-or-later
tags:
  - branch-management
  - cli
  - git
  - repository-cleanup
description: Command-line tool to delete merged Git branches
executables:
  - git-dmb
provenance:
  formula: git-delete-merged-branches
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
