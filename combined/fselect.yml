id: brew:fselect
display-name: fselect
homepage: https://fselect.rocks
repo: https://github.com/jhspetersson/fselect
docs:
  - https://fselect.rocks/
  - https://github.com/jhspetersson/fselect#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation from Cargo, Debian/Ubuntu packages, RPM
      packages, Arch AUR, NixOS, Windows binaries, winget, Chocolatey, Scoop, Homebrew,
      and MacPorts. That range made fselect a cross-platform package-manager citizen
      rather than only a Rust crate.
  package-nerd-significance:
    - >
      fselect is notable in package-manager culture as a Rust CLI that recasts a classic
      Unix task as a query language. Its packaging matrix also shows the modern path for
      developer tools: Cargo first, prebuilt GitHub assets, then Homebrew, MacPorts,
      winget, Scoop, Chocolatey, Nix, AUR, and distro packages.
  project-history:
    - >
      The upstream README frames fselect as a complement rather than a full replacement
      for traditional `find` and `ls`. Its feature set grew around filesystem metadata
      queries: paths and sizes, dates, regular expressions, archive search, ignore-file
      support, media metadata, hashes, MIME types, permissions, output formats, and
      interactive mode.
    - >
      By the 0.10 series, release notes show the project adding support for `plocate`
      and Everything indexes, subqueries in FROM clauses, date functions, git-related
      fields, and more metadata extractors.
  related-projects:
    - Traditional Unix `find` and `ls` are the tools the README positions fselect alongside.
    - >
      plocate and Everything are optional index-backed search integrations documented by
      the project.
  sources:
    - https://fselect.rocks/
    - https://github.com/jhspetersson/fselect
    - https://github.com/jhspetersson/fselect/releases
  summary:
    - >
      fselect is a command-line file-search tool that lets users query filesystem
      metadata with a relaxed SQL-like language. It is written in Rust and distributed
      through source builds, release binaries, and multiple package managers.
  timeline:
    - '0.8.x: fselect already had a public GitHub release series.'
    - '0.10.0: The project entered the 0.10 release line.'
    - '0.10.1: Release notes added FROM-clause subqueries and date functions.'
    - >
      0.10.2: Release notes added plocate and Everything support plus additional
      metadata fields.
  usage:
    - >
      Users run queries such as `fselect size, path from /home/user where name =
      '*.cfg'` or quote a whole query string. The grammar supports SELECT-like column
      lists, FROM roots, WHERE expressions, GROUP BY, ORDER BY, LIMIT, OFFSET, and
      output formats.
    - >
      The tool is useful when a shell pipeline would otherwise need several commands to
      filter by metadata, image dimensions, media tags, permissions, timestamps, archive
      contents, or indexed file-search backends.
related-packages:
  - id: brew:fsql
    reason: >
      Choose fsql for a smaller Go-based filesystem query tool with an interactive mode
      and SQL-esque filters; choose fselect for broader metadata, aggregation, archive,
      and output-format features.
    rel: alternative
    sources:
      - https://fselect.rocks/
      - https://github.com/kashav/fsql#readme
  - id: brew:findutils
    reason: >
      Choose GNU findutils when you need the established `find` and `xargs` expression
      model and portable shell-script conventions instead of fselect's SQL-like
      language.
    rel: alternative
    sources:
      - https://fselect.rocks/
      - https://www.gnu.org/software/findutils/manual/html_mono/find.html
category: developer-tools
package-manager:
  brew: fselect
  macports: fselect
  nix: fselect
  scoop: main/fselect
  winget: fselect.fselect
package-manager-url: https://formulae.brew.sh/formula/fselect
license: Apache-2.0 OR MIT
tags:
  - cli
  - file-search
  - filesystem
  - sql-like-query
description: Find files with SQL-like queries
executables:
  - fselect
provenance:
  formula: fselect
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
