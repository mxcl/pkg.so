id: brew:arxiv_latex_cleaner
display-name: arxiv_latex_cleaner
homepage: https://github.com/google-research/arxiv-latex-cleaner
repo: https://github.com/google-research/arxiv-latex-cleaner
docs:
  - https://github.com/google-research/arxiv-latex-cleaner#readme
config-file-location:
  unix: cleaner_config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The documented primary installation path is `pip install arxiv-latex-cleaner`,
      with Homebrew as an option on macOS. The provided package-manager facts also list
      Nix, and the GitHub repository metadata reported several thousand stars and
      hundreds of forks at research time.
    - >
      Its adoption story is bound to academic workflow pain: arXiv uploads expose
      comments, reject oversized bundles, and require the right source subset. The tool
      turns that cleanup into a repeatable command-line step.
  package-nerd-significance:
    - >
      This package is a neat example of a niche research-workflow CLI becoming a
      package-manager target. It is Python-first and pip-installable, but Homebrew and
      Nix packaging make it available to users who manage publishing tools outside
      Python virtual environments.
    - >
      The package also exposes a common scientific-computing packaging tension: it wraps
      LaTeX, image, PDF, YAML, regex, and optional system tools into one small CLI whose
      inputs are messy project directories rather than clean APIs.
  project-history:
    - >
      The public GitHub repository was created in January 2019. The README frames the
      tool around a concrete academic publishing task: take a folder of LaTeX sources
      and produce a sibling `_arXiv` folder ready to zip and upload.
    - >
      The release history shows v0.1.x releases beginning by 2020 and v1.0.x releases
      from 2023 onward, with v1.0.11 published in March 2026. The README notes that the
      project is not an officially supported Google product.
  related-projects:
    - >
      The README references arXiv submission workflows, PGF/TikZ externalization,
      Ghostscript for PDF compression, Inkscape-generated SVG/PDF assets, and Python
      packaging.
  sources:
    - https://api.github.com/repos/google-research/arxiv-latex-cleaner
    - https://api.github.com/repos/google-research/arxiv-latex-cleaner/releases
    - https://github.com/google-research/arxiv-latex-cleaner
    - https://raw.githubusercontent.com/google-research/arxiv-latex-cleaner/main/README.md
    - source_facts.package-manager
  summary:
    - >
      arxiv_latex_cleaner is a Python CLI from google-research for preparing LaTeX paper
      source trees for arXiv submission. It removes auxiliary files, comments, unused
      files and images, and can resize or compress assets to fit arXiv constraints.
  timeline:
    - '2019: Public GitHub repository created.'
    - '2020: v0.1.x GitHub releases published.'
    - '2023: v1.0.1 release published.'
    - '2026: v1.0.11 release published.'
  usage:
    - >
      Users run `arxiv_latex_cleaner /path/to/latex`, optionally with flags such as
      `--resize_images`, `--compress_pdf`, `--convert_png_to_jpg`, or `--config
      cleaner_config.yaml`. The README includes a YAML configuration example and
      documents regex-based replacement rules.
    - >
      Important features include privacy-oriented comment and command removal,
      size-oriented pruning/resizing/compression, and replacing TikZ source with
      externalized graphics when configured.
related-packages: []
category: science
