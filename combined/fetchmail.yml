tags:
  - cli
  - email
  - imap
  - mail-retrieval
  - pop3
description: Client for fetching mail from POP, IMAP, ETRN or ODMR-capable servers
executables:
  - fetchmail
  - fetchmailconf
provenance:
  formula: fetchmail
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
