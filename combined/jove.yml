id: brew:jove
display-name: JOVE
homepage: https://directory.fsf.org/wiki/Jove
repo: https://github.com/jonmacs/jove
docs:
  - https://github.com/jonmacs/jove#readme
  - https://github.com/jonmacs/jove/tree/master/doc
config-file-location:
  unix: ~/.joverc
credentials-file-location: null
history:
  adoption-history:
    - >
      JOVE's adoption predates GitHub and modern packaging. It became a recognizable
      small editor in Unix culture because it offered Emacs-like keybindings and
      behavior without the size and extension machinery of full Emacs. The input
      metadata records packaging in Homebrew, Debian, MacPorts, Nix, and Ubuntu, showing
      that the editor remained packagable decades after its early BSD origins.
  package-nerd-significance:
    - >
      JOVE is historically significant because it is a living fossil of editor
      packaging: small enough for constrained Unix systems, Emacs-like enough to matter
      culturally, and portable enough to survive into modern package managers. It helps
      explain why Unix repositories still carry multiple Emacs-like editors instead of
      treating GNU Emacs as the only lineage.
  project-history:
    - >
      JOVE was created by Jonathan Payne as a compact Emacs-like editor for small Unix
      systems. The project README emphasizes portability across old and new systems,
      manual configuration rather than an autoconf-style setup, and historically
      constrained targets such as PDP-11, DOS, Macintosh, Windows, Cygwin, BSD, Solaris,
      and Linux.
    - >
      The distribution's documentation records a long-lived maintenance culture.
      Jonathan Payne retained overall control while D. Hugh Redelmeier coordinated
      day-to-day fixes and portability work through the jovehacks mailing list;
      acknowledgements name contributors who helped with pty code, Berkeley features, PC
      and Macintosh versions, Win32 support, mouse support, testing, and portability.
  related-projects:
    - >
      JOVE is related to Gosling Emacs, GNU Emacs, teach-emacs tutorial material, and
      other small Emacs-like editors such as mg, Zile, and JOE. Its package-manager
      neighbors are usually classic Unix editors rather than modern IDEs.
  sources:
    - https://directory.fsf.org/wiki/Jove
    - https://formulae.brew.sh/formula/jove
    - https://github.com/jonmacs/jove
    - https://github.com/jonmacs/jove/releases
    - https://raw.githubusercontent.com/jonmacs/jove/master/README
  summary:
    - >
      JOVE, Jonathan's Own Version of Emacs, is a small Emacs-style editor with roots in
      early BSD Unix. The maintained GitHub repository describes it as a venerable 1982,
      fast, small Emacs clone originally written for 2.8BSD on a PDP-11.
  timeline:
    - >
      1982: The GitHub repository description identifies JOVE as originating in this era
      for 2.8BSD on PDP-11.
    - "1986-2002: The README copyright notice covers Jonathan Payne's long maintenance period."
    - '2004-07: The README was updated with Unix build and portability guidance.'
    - '2020: GitHub release metadata begins for the 4.17.2.7 candidate series.'
    - '2025-05: Release 4.17.5.5 was published on GitHub.'
  usage:
    - >
      JOVE is used as a terminal text editor for users who want Emacs-like editing with
      a smaller binary and simpler model. Its documentation includes jove and teachjove
      manpages, a global jove.rc, a per-user ~/.joverc, and manuals adapted from early
      Emacs documentation with JOVE-specific changes.
related-packages:
  - id: brew:mg
    reason: >
      Choose mg for another small, fast Emacs-like terminal editor with a deliberately
      compact memory footprint and a more directly maintained portable OpenBSD lineage.
    rel: alternative
    sources:
      - https://github.com/jonmacs/jove/blob/main/README
      - https://github.com/ibara/mg
      - https://github.com/ibara/mg/blob/master/tutorial
category: productivity
package-manager:
  brew: jove
  debian: jove
  macports: jove
  nix: jove
  ubuntu: jove
package-manager-url: https://formulae.brew.sh/formula/jove
license: jove
tags:
  - cli
  - emacs-like
  - small
  - text-editor
  - unix
description: Emacs-style editor with vi-like memory, CPU, and size requirements
executables:
  - jove
  - teachjove
provenance:
  formula: jove
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
