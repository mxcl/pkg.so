id: brew:bashish
display-name: Bashish
homepage: https://bashish.sourceforge.net/
repo: https://github.com/arnognulf/bashish
docs:
  - https://bashish.sourceforge.net/
  - https://bashish.sourceforge.net/doc.html
config-file-location:
  unix: ~/.bashish/
credentials-file-location: null
history:
  adoption-history:
    - >
      The official news page records early packaging interest: Debian
      request-for-sponsorship work, a Gentoo ebuild attempt, and Pascal Bleser's SuSE
      Guru repositories. The SourceForge file feed shows released source archives and
      distro packages for 2.2.x in 2010.
    - >
      Bashish occupied a niche before modern prompt frameworks became common: it offered
      themed prompts, titles, and per-application terminal appearance across many
      terminal emulators and shells.
  package-nerd-significance:
    - >
      Bashish is package-nerd interesting because it captures a pre-Starship,
      pre-Powerlevel prompt era where terminal look-and-feel was managed by shell
      wrappers, startup-file edits, and terminal escape/control behavior rather than a
      single cross-shell binary.
    - >
      It is also a small historical artifact of SourceForge distribution culture:
      tarballs, .deb, RPM, Slackware packages, Gentoo bugs, and distro repositories all
      appear in the official release trail.
  project-history:
    - >
      Bashish developed as a shell and terminal theming layer rather than a single
      prompt theme. Its README explains that application theming works by placing
      launchers in the path: the launcher applies a terminal theme, runs the real
      command with the original arguments and exit code, and restores the terminal
      afterward.
    - >
      The 2.x ChangeLog shows a project concerned with terminal compatibility, startup
      speed, per-theme APIs, revision-control prompt indicators, and retro terminal
      themes. Version 2.2.2 explicitly notes a revival after bitrot, fixes for
      gnome-terminal behavior, new BashPrompt-derived themes, and the move to GitHub.
  related-projects:
    - >
      The Bashish ChangeLog imports or adapts themes from the BashPrompt project. Its
      own README positions it alongside shell prompt customization and terminal emulator
      theming rather than as a general shell framework.
  sources:
    - https://bashish.sourceforge.net/
    - https://bashish.sourceforge.net/news.html
    - https://github.com/arnognulf/bashish/blob/master/ChangeLog
    - https://github.com/arnognulf/bashish/blob/master/README
    - https://sourceforge.net/projects/bashish/files/bashish/2.2.4/ChangeLog/download
  summary:
    - >
      Bashish is a terminal theme environment from the SourceForge-era desktop
      customization world. Its official site describes it as software that changes
      terminal colors, fonts, transparency, background images, and prompts for shells
      such as bash, zsh, and tcsh.
  timeline:
    - >
      2006: Official news notes SuSE/Gentoo packaging work, Debian RFS activity, and
      Bashish 2.0.5/2.0.6 updates.
    - >
      2010: SourceForge publishes the 2.2.4 source archive and distro packages; the
      ChangeLog calls out startup speedups and package fixes.
    - >
      2010: Version 2.2.2 ChangeLog says Bashish is now on GitHub at
      `github.com/arnognulf/bashish`.
    - >
      2010s: Later ChangeLog entries continue terminal compatibility and theme fixes,
      including Mac OS X foreground/background handling.
  usage:
    - >
      The README tells users to run `bashish` once to set up shell startup files,
      restart the shell, list themes with `bashish list`, and select themes with
      commands such as `bashish conda` or `bashish conda blue`.
    - >
      The project supports prompt theming for common shells and terminal theming for
      terminal emulators including xterm, rxvt, rxvt-unicode, gnome-terminal, Linux
      console, mlterm, SGI xwsh, Terminal.app, PuTTY, Cygwin, screen, and others, with
      varying feature support.
related-packages: []
category: system
package-manager:
  brew: bashish
  macports: bashish
package-manager-url: https://formulae.brew.sh/formula/bashish
license: GPL-2.0-or-later
tags:
  - bash
  - cli
  - prompt
  - shell
  - terminal
  - themes
description: Theme environment for text terminals
executables:
  - bashish
  - bashishtheme
provenance:
  formula: bashish
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
