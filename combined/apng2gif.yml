id: brew:apng2gif
display-name: apng2gif
homepage: https://apng2gif.sourceforge.net/
repo: null
docs:
  - https://apng2gif.sourceforge.net/
  - https://sourceforge.net/projects/apng2gif/files/1.8
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      apng2gif adoption is naturally narrow: it serves people who keep high-quality APNG
      masters but still need GIF output for older or more constrained web/image
      pipelines. The official page explicitly frames webmasters as a practical audience.
  package-nerd-significance:
    - >
      apng2gif is the kind of tiny media converter package that survives because it does
      one format edge case well. Its value is not breadth; it is a low-friction CLI for
      APNG fallback assets and batch conversion.
    - >
      It also sits in a small APNG tools family where each utility handles one direction
      or maintenance step in an animated-image workflow.
  project-history:
    - >
      The project page presents apng2gif as a focused APNG-to-GIF converter with both a
      command-line version and a Windows GUI. It is distributed through SourceForge
      along with source and prebuilt binaries for major desktop operating systems.
    - >
      The SourceForge 1.8 file page records an improved APNG decoder based on apngdis
      2.9, loop-count adjustment, duplicate-frame optimization, and 64-bit Windows
      binaries. That is about as much public project history as the official sources
      expose.
  related-projects:
    - The official page links gif2apng, apngasm, apngdis, and apngopt as related APNG tools.
  sources:
    - https://apng2gif.sourceforge.net/
    - https://sourceforge.net/projects/apng2gif/files/1.8/
  summary:
    - >
      apng2gif is a small SourceForge-hosted converter that turns Animated PNG files
      into animated GIFs. The official page says it respects APNG frame delays and loop
      counts while providing transparency-threshold and background-blending options.
  timeline:
    - >
      2017-05-19: The SourceForge 1.8 file page records source and binary artifacts and
      README text.
    - '2017-05-22: The SourceForge 1.8 file page records the 32-bit Windows GUI binary.'
    - >
      1.8: Release notes record an improved decoder based on apngdis 2.9 and
      duplicate-frame optimization.
  usage:
    - >
      The documented command line is apng2gif anim.png [anim.gif] [-t tlevel] [-b
      bcolor]. The -t option controls transparency threshold, the -b option blends
      against a background color, and -b overrides -t.
    - >
      The project page describes converting 24/32-bit APNG to a single global 256-color
      GIF palette using a Wu quantization grid, which is the practical tradeoff behind
      the tool: keep APNG masters, generate GIF fallbacks when needed.
related-packages:
  - id: brew:apngasm
    reason: >
      Use apngasm to assemble optimized APNG animations from frame sequences, then
      apng2gif when the same animation also needs a GIF-compatible fallback.
    rel: adjacent_workflow
    sources:
      - https://apng2gif.sourceforge.net/
      - https://apngasm.sourceforge.net/
