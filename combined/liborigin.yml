docs:
  - https://github.com/gerlachs/liborigin#readme
  - https://sourceforge.net/projects/liborigin/files
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      liborigin serves a niche but persistent scientific-data need: reading Origin
      project files without requiring Origin on Windows. The supplied metadata records
      packages in Homebrew, Fedora, Arch Linux, and openSUSE ecosystems.
  package-nerd-significance:
    - >
      liborigin is the kind of compatibility library package maintainers value because
      it keeps scientific data script-accessible after it has been stored in a
      proprietary binary format. It also exposes conventional C/C++ packaging surfaces
      through CMake and pkg-config.
  project-history:
    - >
      The SourceForge project was registered on 2005-09-02. Its current README describes
      the standalone code as drawing on the original SourceForge liborigin, SciDAVis
      liborigin, and the older liborigin2 codebase, and names contributors whose work
      spans 2005 through 2026.
    - >
      The project uses CMake and builds shared and static libraries, development
      headers, pkg-config metadata, and the opj2dat extractor. In 2026 the official
      SourceForge README identified gerlachs/liborigin as the development repository.
  related-projects:
    - >
      Origin and OriginPro produce the OPJ files liborigin reads; SciDAVis contributed
      related liborigin code, and the official README also points to Ropj and openopj.
  sources:
    - https://github.com/gerlachs/liborigin#readme
    - https://sourceforge.net/p/liborigin/git/ci/master/tree/
    - https://sourceforge.net/projects/liborigin/
    - https://sourceforge.net/projects/liborigin/files/
    - source_facts.package-manager
  summary:
    - >
      liborigin is a C++ library and command-line utility package for reading OriginLab
      OPJ project files. It lets open-source scientific tools extract data from a
      proprietary graphing and analysis format.
  timeline:
    - '2005: The SourceForge project is registered on September 2.'
    - '2018: The standalone 3.0 release line begins.'
    - '2024: liborigin 3.0.3 is released.'
    - >
      2026: The official project publishes 3.0.4 and names gerlachs/liborigin as its
      development repository.
  usage:
    - >
      Developers link liborigin to parse OPJ files, while the included opj2dat program
      extracts project data tables into ASCII .dat files. The official README documents
      support for OPJ projects from Origin 3.5 through Origin 2022b.
related-packages: []
