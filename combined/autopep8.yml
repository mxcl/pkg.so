id: brew:autopep8
display-name: autopep8
homepage: https://github.com/hhatto/autopep8
repo: https://github.com/hhatto/autopep8
docs:
  - https://github.com/hhatto/autopep8#readme
config-file-location:
  unix:
    - ~/.config/pycodestyle
    - setup.cfg
    - tox.ini
    - .pep8
    - .flake8
    - pyproject.toml
  windows:
    - ~\.pycodestyle
    - setup.cfg
    - tox.ini
    - .pep8
    - .flake8
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      autopep8 spread through Python packaging and editor integrations as a command-line
      formatter. The batch input lists Homebrew plus Debian/Ubuntu and Arch packages,
      while the official README points users to pip, PyPI, GitHub, and pre-commit hook
      usage.
    - >
      Its GitHub metadata shows thousands of stars and hundreds of forks, consistent
      with long-running use in Python developer workflows even as opinionated formatters
      became more prominent later.
  package-nerd-significance:
    - >
      autopep8 is useful to package nerds because it bridges Python packaging, linter
      configuration, editor formatting, and pre-commit automation without imposing a
      single style regime. Its behavior is legible in terms of pycodestyle codes, which
      makes distro and CI behavior easier to explain than opaque formatter output.
  project-history:
    - >
      The official GitHub repository was created in December 2010. The README describes
      autopep8 as a tool that automatically formats Python code to conform to PEP 8,
      using pycodestyle to determine which parts need formatting.
    - >
      The project grew around pycodestyle error codes: the README lists many E and W
      codes autopep8 can fix, plus conservative defaults and more aggressive modes for
      changes that may affect semantics.
  related-projects:
    - pycodestyle supplies the style diagnostics autopep8 uses.
    - flake8 and pep8-style configuration files influence autopep8 configuration discovery.
    - >
      Black, yapf, docformatter, and eradicate are adjacent Python formatting or cleanup
      tools.
  sources:
    - https://api.github.com/repos/hhatto/autopep8
    - https://github.com/hhatto/autopep8#readme
    - source_facts.package-manager
  summary:
    - >
      autopep8 is a Python formatter that uses pycodestyle diagnostics to rewrite code
      toward PEP 8. It predates the Black era of Python formatting and represents the
      earlier style of configurable, error-code-driven automatic cleanup.
  timeline:
    - '2010: hhatto/autopep8 GitHub repository created.'
    - >
      2010s: autopep8 becomes a common PEP 8 cleanup command distributed through PyPI
      and OS package managers.
    - >
      2020s: autopep8 continues supporting pyproject.toml, pre-commit, modern Python
      versions, and pycodestyle-based fixes.
  usage:
    - >
      Common usage is autopep8 --in-place with one or more --aggressive flags, or --diff
      for review. The README also documents module use through fix_code(), recursive
      operation, parallel jobs, line ranges, pre-commit integration, and pyproject.toml
      support.
    - >
      Configuration can come from a global pycodestyle file, project files such as
      setup.cfg, tox.ini, .pep8, and .flake8, or pyproject.toml under [tool.autopep8],
      which takes precedence over other configuration files.
related-packages:
  - id: brew:pycodestyle
    reason: >
      Use pycodestyle alongside autopep8 when you need the underlying PEP 8 diagnostics
      and stable error codes that drive autopep8's fixes.
    rel: adjacent_workflow
    sources:
      - https://github.com/hhatto/autopep8#readme
      - https://pycodestyle.pycqa.org/en/stable/
  - id: brew:black
    reason: >
      Choose Black when you prefer a deliberately opinionated formatter with little
      style configuration and consistent whole-project output.
    rel: alternative
    sources:
      - https://black.readthedocs.io/en/stable/
      - https://black.readthedocs.io/en/stable/the_black_code_style/current_style.html
  - id: brew:yapf
    reason: >
      Choose YAPF when you want a clang-format-inspired optimizer with selectable base
      styles and a much larger set of formatting controls.
    rel: alternative
    sources:
      - https://github.com/google/yapf#readme
category: developer-tools
package-manager:
  brew: autopep8
  debian: python3-autopep8
  pacman: autopep8
  ubuntu: python3-autopep8
package-manager-url: https://formulae.brew.sh/formula/autopep8
license: MIT
tags:
  - cli
  - formatter
  - pep8
  - python
description: Automatically formats Python code to conform to the PEP 8 style guide
executables:
  - autopep8
provenance:
  formula: autopep8
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
