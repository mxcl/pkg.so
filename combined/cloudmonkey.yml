id: brew:cloudmonkey
display-name: CloudMonkey
homepage: https://github.com/apache/cloudstack-cloudmonkey
repo: https://github.com/apache/cloudstack-cloudmonkey
docs:
  - https://github.com/apache/cloudstack-cloudmonkey/wiki
  - https://github.com/apache/cloudstack-cloudmonkey/wiki/Getting-Started
  - https://github.com/apache/cloudstack-cloudmonkey#readme
config-file-location:
  unix: ~/.cmk/config
credentials-file-location:
  unix: ~/.cmk/config
history:
  adoption-history:
    - >
      CloudMonkey's adoption follows CloudStack operators rather than the broader
      cloud-native ecosystem. Apache's downloads page lists CloudMonkey releases next to
      CloudStack source releases and the CloudStack Terraform provider, and third-party
      CloudStack operators have documented cmk as the practical front end to the
      CloudStack API.
  package-nerd-significance:
    - >
      CloudMonkey matters to package maintainers because it represents a long-lived
      infrastructure CLI that crossed language and distribution eras: a Python
      PyPI-style tool became a standalone Go binary named cmk, distributed through
      Homebrew, MacPorts, Nix, Docker, GitHub releases, and Apache source releases. It
      is also a useful example of an Apache project adjunct tool packaged independently
      from a larger server platform.
  project-history:
    - >
      Apache CloudStack's early wiki described cloudmonkey as a Python command-line
      interface for CloudStack, usable both interactively and as a command-line tool for
      configuration and management. The modern Apache repository now explains that
      CloudMonkey was rewritten and simplified in Go, with compatibility for Apache
      CloudStack 4.9 and later, while the legacy Python version served CloudStack
      4.0-incubating and later.
    - >
      The Go rewrite became the package-manager-relevant lineage: it ships as the cmk
      executable, stores configuration under ~/.cmk, and is released separately from the
      main CloudStack server project while remaining part of the Apache CloudStack
      ecosystem.
  related-projects:
    - >
      CloudMonkey is tied directly to Apache CloudStack and its API surface. Nearby
      operator tools include the Apache CloudStack Terraform Provider, the CloudStack
      web UI, and automation stacks that call the CloudStack API through libraries or
      infrastructure-as-code providers.
  sources:
    - https://cwiki.apache.org/confluence/display/CLOUDSTACK/CloudStack%2Bcloudmonkey%2BCLI
    - https://github.com/apache/cloudstack-cloudmonkey
    - https://cloudstack.apache.org/downloads/
    - https://cloudstack.apache.org/blog/cloudmonkey-6.5-release/
    - https://github.com/apache/cloudstack-cloudmonkey/blob/main/CHANGES.md
  summary:
    - >
      CloudMonkey is the Apache CloudStack command-line client and interactive shell. It
      started as a Python CLI for CloudStack 4.0-era installations and later moved to
      the modern Go-based cmk tool used with newer CloudStack deployments.
  timeline:
    - >
      2012: Apache CloudStack wiki documented the Python cloudmonkey CLI for CloudStack
      4.0-incubating and later.
    - '2018: CloudMonkey 6.0 marked the modern Go-based cmk rewrite and simplified feature set.'
    - '2023: Apache mirrors carried CloudMonkey 6.3.0 source releases.'
    - >
      2025: CloudMonkey 6.5.0 added upload improvements, 2FA prompts, and better
      autocompletion.
    - '2026: Apache downloads listed CloudMonkey 6.5.0 as the current CloudMonkey release.'
  usage:
    - >
      CloudMonkey is used to call CloudStack APIs, manage resources, script
      administrative tasks, and work in an interactive shell without relying on the web
      UI. Official repository documentation describes it as simplifying Apache
      CloudStack configuration and management, and release notes continue to improve CLI
      mode, output handling, 2FA prompts, autocompletion, and upload workflows.
related-packages: []
category: cloud-infrastructure
package-manager:
  brew: cloudmonkey
  macports: cloudmonkey
  nix: cloudmonkey
package-manager-url: https://formulae.brew.sh/formula/cloudmonkey
license: Apache-2.0
tags:
  - administration
  - apache-cloudstack
  - cli
  - cloud
  - shell
description: Apache CloudStack CloudMonkey CLI
executables:
  - cmk
provenance:
  formula: cloudmonkey
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
