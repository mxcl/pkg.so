id: brew:kubernetes-mcp-server
display-name: Kubernetes MCP Server
homepage: https://github.com/containers/kubernetes-mcp-server
repo: https://github.com/containers/kubernetes-mcp-server
docs:
  - https://github.com/containers/kubernetes-mcp-server/blob/main/README.md
config-file-location:
  unix:
    - /etc/kubernetes-mcp-server/config.toml
    - ~/.kube/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The package reflects the 2025-2026 wave of MCP tooling in which command-line and
      editor agents gained structured access to infrastructure APIs. Its distribution
      includes native binaries, MCP bundle assets, npm, PyPI, and container packaging
      paths.
  package-nerd-significance:
    - >
      For package collectors, kubernetes-mcp-server is notable because it packages an
      AI-agent integration as a normal CLI/server binary rather than as only an editor
      extension or JavaScript package.
  project-history:
    - >
      The project is part of the containers GitHub organization and positions itself as
      a native Kubernetes API implementation rather than a wrapper around kubectl or
      helm. Its README emphasizes direct API-server interaction, native binaries,
      Kubernetes and OpenShift support, Helm operations, Tekton operations, telemetry,
      and TOML configuration.
  related-projects:
    - >
      Related projects include Kubernetes, OpenShift, Helm, Tekton, kubectl, and the
      Model Context Protocol ecosystem.
  sources:
    - https://github.com/containers/kubernetes-mcp-server
    - https://github.com/containers/kubernetes-mcp-server/releases
    - >
      https://raw.githubusercontent.com/containers/kubernetes-mcp-server/main/docs/configuration.md
  summary:
    - >
      Kubernetes MCP Server is a Go-based Model Context Protocol server that exposes
      Kubernetes and OpenShift operations to MCP-capable AI assistants and development
      tools.
  timeline:
    - >
      2026: The GitHub releases page listed v0.0.63 assets for Linux, macOS, Windows,
      and MCPB bundles on June 23.
  usage:
    - >
      Users run the server beside an MCP client such as Claude Desktop, VS Code, or
      Cursor, with access derived from kubeconfig or in-cluster configuration. The
      server can use /etc/kubernetes-mcp-server/config.toml and drop-in TOML files for
      persistent configuration.
related-packages:
  - id: brew:helm
    reason: >
      Install Helm when the MCP server's optional helm toolset is enabled, allowing an
      agent to inspect and manage chart releases through the server's documented Helm
      integration.
    rel: adjacent_workflow
    sources:
      - https://github.com/containers/kubernetes-mcp-server
      - https://helm.sh/docs/intro/introduction/
category: ai
package-manager:
  brew: kubernetes-mcp-server
package-manager-url: https://formulae.brew.sh/formula/kubernetes-mcp-server
license: Apache-2.0
tags:
  - ai
  - cli
  - kubernetes
  - mcp
  - model-context-protocol
  - openshift
  - server
description: MCP server for Kubernetes
executables:
  - kubernetes-mcp-server
provenance:
  formula: kubernetes-mcp-server
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
