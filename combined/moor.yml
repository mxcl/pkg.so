id: brew:moor
display-name: moor
homepage: https://github.com/walles/moor
repo: https://github.com/walles/moor
docs:
  - https://github.com/walles/moor#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      Technically, moor is a modern less-like pager with defaults aimed at source code
      and colored terminal output. The README lists syntax highlighting through Chroma,
      incremental search and filtering, case-sensitive search when uppercase is used,
      regex search for valid regexes, persisted deduplicated search history, background
      input reading with multi-threaded search for large input, ANSI color support,
      UTF-8 support, and transparent decompression for compressed text files and
      streams.
  sources:
    - https://github.com/walles/moor
    - https://github.com/walles/moor/releases/tag/v2.0.0
  summary:
    - >
      moor is a terminal pager maintained in the walles/moor GitHub project. Its README
      says the tool reads and displays UTF-8 text from files or pipes and is designed to
      "do the right thing" without configuration. The project began under the name moar;
      the README notes that version 2.0.0 renamed moar to moor while keeping it the same
      tool, and the v2.0.0 release notes record the rename plus a stable embedding API.
  usage:
    - >
      Its package-manager niche is the developer workstation pager slot: a drop-in-ish
      alternative for people used to less but wanting code highlighting, smart search,
      decompression, and colored diff/log output without assembling shell aliases around
      less, bat, zless, bzless, or custom filters.
related-packages:
  - id: brew:less
    reason: >
      Choose less when you want the traditional, widely deployed Unix pager and its
      mature lesskey configuration model; choose Moor for built-in syntax highlighting,
      incremental filtering, and transparent decompression.
    rel: alternative
    sources:
      - https://github.com/walles/moor
      - https://www.greenwoodsoftware.com/less/faq.html
  - id: brew:bat
    reason: >
      Use bat to preprocess and decorate file content, then set BAT_PAGER=moor when you
      want Moor's interactive search and paging for bat's output.
    rel: adjacent_workflow
    sources:
      - https://github.com/walles/moor
      - https://github.com/sharkdp/bat
  - id: brew:riff
    reason: >
      Riff refines diff output and officially prefers Moor as a pager, producing a
      focused colored-diff workflow for Git and traditional diff output.
    rel: adjacent_workflow
    sources:
      - https://github.com/walles/riff
      - https://github.com/walles/moor
category: developer-tools
package-manager:
  apk: moor
  brew: moor
  macports: moor
  nix: moor
  pacman: moor
  scoop: extras/moor
  winget: walles.moor
package-manager-url: https://formulae.brew.sh/formula/moor
license: BSD-2-Clause
tags:
  - cli
  - pager
  - rust
  - terminal
description: Nice to use pager for humans
executables:
  - moar
  - moor
provenance:
  formula: moor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
