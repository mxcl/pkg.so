id: brew:csvlens
display-name: csvlens
homepage: https://github.com/YS-L/csvlens
repo: https://github.com/YS-L/csvlens
docs:
  - https://github.com/YS-L/csvlens#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents installation through direct release downloads,
      Homebrew, Arch Linux, Windows winget, several BSD package systems, and Cargo. That
      distribution footprint is notable for a comparatively young terminal data viewer
      because it covers Unix, macOS, Windows, BSD ports, and Rust's native package
      channel.
  package-nerd-significance:
    - >
      For package maintainers, csvlens is representative of the modern single-binary
      Rust CLI pattern: small user-facing surface, terminal-first UX, release archives
      for multiple platforms, Cargo installability, and packaging in Homebrew and OS
      repositories.
  project-history:
    - >
      The public release stream visible on GitHub begins with the 0.3.x series in 2023,
      and the changelog shows the project continuing as an interactive terminal viewer
      rather than a batch-processing CSV suite. Later releases added package-friendly
      polish such as a library target, aarch64 release targets, auto-delimiter defaults,
      row marking, and automatic reload.
  related-projects:
    - >
      The README frames csvlens as closer to less than to full CSV transformation
      suites; in practice it complements tools such as csvq, csvtk, xsv, and csvkit by
      focusing on interactive viewing.
  sources:
    - https://github.com/YS-L/csvlens#readme
    - https://github.com/YS-L/csvlens/blob/main/CHANGELOG.md
    - https://github.com/YS-L/csvlens/releases
  summary:
    - >
      csvlens is a Rust-based command-line CSV viewer positioned as a CSV-aware analogue
      of less: it opens files or stdin in an interactive terminal table view with
      search, filtering, sorting, column selection, wrapping, and clipboard-oriented
      actions.
  timeline:
    - '2023: Earliest GitHub release visible in the public release list is v0.3.2.'
    - '2024: v0.13.0 added aarch64 release targets.'
    - '2026: v0.15.x added auto-reload and stdin streaming refinements.'
  usage:
    - >
      csvlens is commonly used where a user wants to inspect CSV or TSV-like output
      without importing it into a spreadsheet: open a file, pipe command output into the
      viewer, search or filter rows, narrow columns, sort interactively, and optionally
      print a selected value or marked rows back to stdout.
related-packages:
  - id: brew:visidata
    reason: >
      Choose VisiData when CSV inspection must grow into spreadsheet-like exploration,
      joins, aggregations, reshaping, or support for many non-CSV data sources.
    rel: alternative
    sources:
      - https://github.com/YS-L/csvlens#readme
      - https://www.visidata.org/docs/
  - id: brew:tabiew
    reason: >
      Choose Tabiew when you want a terminal table viewer with SQL querying and native
      support for formats such as Parquet, Arrow, JSON, SQLite, and Excel in addition to
      CSV.
    rel: alternative
    sources:
      - https://github.com/YS-L/csvlens#readme
      - https://github.com/shshemi/tabiew#readme
  - id: brew:qsv
    reason: >
      qsv can perform broad CSV transformations and then invoke its documented csvlens
      library integration for interactive viewing inside the same workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/YS-L/csvlens#readme
      - https://github.com/dathere/qsv
category: data
