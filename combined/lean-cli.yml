id: brew:lean-cli
display-name: lean-cli
homepage: https://github.com/leancloud/lean-cli
repo: https://github.com/leancloud/lean-cli
docs:
  - https://docs.leancloud.cn/sdk/engine/cli
  - https://github.com/leancloud/lean-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool is mainly adopted inside LeanCloud's platform workflow rather than as a
      general-purpose cloud CLI. Homebrew and Scoop packaging make it available to
      developers who deploy LeanEngine apps from local machines.
  package-nerd-significance:
    - >
      lean-cli is package-manager-significant because it exposes a regional PaaS
      workflow through a native CLI. It is also a naming trap in package indexes because
      it is unrelated to QuantConnect's LEAN CLI and the Lean theorem prover ecosystem.
  project-history:
    - >
      The repository README describes lean-cli as the LeanEngine command-line tool and
      documents Homebrew, GitHub release, and LeanCloud CDN installation paths. The
      public tags show the 1.0 line appearing in March 2022 and the 1.2 line continuing
      through May 2023.
  related-projects:
    - >
      Related projects and services include LeanCloud, LeanEngine, TapTap Developer
      Services, LeanDB, LeanCache, and LeanCloud's releases.leanapp.cn distribution
      channel.
  sources:
    - https://docs.leancloud.cn/en/sdk/engine/cli/
    - https://formulae.brew.sh/formula/lean-cli
    - https://github.com/leancloud/lean-cli
    - https://github.com/leancloud/lean-cli/tags
  summary:
    - >
      lean-cli is LeanCloud's command-line tool for developing and managing LeanCloud
      and TapTap Developer Services applications, especially LeanEngine projects.
  timeline:
    - '2022-03-29: v1.0.0 tag published for leancloud/lean-cli.'
    - '2022-10-19: v1.1.0 tag published.'
    - '2023-05-15: v1.2.4 tag published.'
  usage:
    - >
      The official CLI guide documents commands for login, app switching, local
      development with up, project creation, deployment, publishing, database access,
      file management, logs, debug console access, and environment inspection.
related-packages: []
category: cloud-infrastructure
package-manager:
  brew: lean-cli
  scoop: main/lean-cli
package-manager-url: https://formulae.brew.sh/formula/lean-cli
license: Apache-2.0
tags:
  - cli
  - cloud-apps
  - deployment
  - leancloud
  - leanengine
description: Command-line tool to develop and manage LeanCloud apps
executables:
  - tds
provenance:
  formula: lean-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
