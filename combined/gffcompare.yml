id: brew:gffcompare
display-name: GffCompare
homepage: https://ccb.jhu.edu/software/stringtie/gffcompare.shtml
repo: https://github.com/gpertea/gffcompare
docs:
  - https://ccb.jhu.edu/software/stringtie/gff.shtml
  - https://ccb.jhu.edu/software/stringtie/gffcompare.shtml
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GffCompare became part of the practical RNA-seq transcript-assembly toolkit
      through its use with StringTie and Cufflinks-style GTF output. The official
      documentation presents it as a general evaluator for transcript-discovery and
      gene-prediction pipelines.
  package-nerd-significance:
    - >
      GffCompare is useful in scientific package collections because it turns GFF/GTF
      annotation comparison into a reproducible command-line step. It emits
      machine-oriented mapping tables and accuracy statistics that fit naturally into
      scripted bioinformatics pipelines.
  project-history:
    - >
      GffCompare originated as a utility for assessing how accurately query transcripts
      match a reference annotation. Its scope expanded to comparing, merging,
      annotating, and measuring one or more GFF/GTF transcript sets.
    - >
      The utility is maintained in the StringTie ecosystem at Johns Hopkins University's
      Center for Computational Biology. It is accompanied by `trmap`, a streaming
      transcript-to-reference overlap mapper that shares its classification logic.
  related-projects:
    - >
      StringTie assembles and quantifies RNA-seq transcripts and commonly produces input
      evaluated by GffCompare.
    - >
      Cufflinks is an earlier transcript assembler whose output is used in the official
      comparison examples.
    - GffRead is a related GFF/GTF processing utility documented alongside GffCompare.
  sources:
    - https://ccb.jhu.edu/software/stringtie/gff.shtml
    - https://ccb.jhu.edu/software/stringtie/gffcompare.shtml
  summary:
    - >
      GffCompare is a command-line bioinformatics utility for comparing, merging, and
      annotating GFF/GTF transcript files and estimating agreement with a reference
      annotation.
  timeline:
    - >
      Original role: Developed to assess query transcript structures against reference
      annotations.
    - >
      2020: GffCompare and GffRead were described together in the official GFF Utilities
      publication referenced by the project site.
  usage:
    - >
      Users supply one or more query GFF/GTF files and may add a reference with `-r`.
      Typical outputs include summary statistics, combined annotations, locus and
      tracking files, and query-to-reference mapping tables.
    - >
      Common uses include benchmarking transcript assemblers, identifying matching or
      novel isoforms, consolidating annotations, and classifying transcript overlaps.
related-packages:
  - id: brew:stringtie
    reason: >
      StringTie assembles and quantifies RNA-seq transcripts, while its official
      workflow directs users to GffCompare to evaluate and further process the resulting
      GTF annotations.
    rel: adjacent_workflow
    sources:
      - https://ccb.jhu.edu/software/stringtie/
      - https://ccb.jhu.edu/software/stringtie/gffcompare.shtml
  - id: brew:gffread
    reason: >
      GffRead complements GffCompare by validating, filtering, converting, and
      extracting sequences from the GFF/GTF annotations being compared.
    rel: adjacent_workflow
    sources:
      - https://ccb.jhu.edu/software/stringtie/gff.shtml
      - https://github.com/gpertea/gffread
category: science
