id: brew:cfripper
display-name: CFRipper
homepage: https://cfripper.readthedocs.io
repo: https://github.com/Skyscanner/cfripper
docs:
  - https://cfripper.readthedocs.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official documentation is published on Read the Docs, the README advertises PyPI
      and Homebrew badges, and the package metadata in this batch shows Homebrew and Nix
      packaging.
    - >
      CFRipper's adoption is tied to security review workflows for CloudFormation
      templates: it is useful before deployment, in CI, or as a library embedded in
      custom cloud-governance checks.
  package-nerd-significance:
    - >
      CFRipper is notable because it packages cloud-security review into an ordinary
      CLI: a repository can add it to pre-deploy checks without first building an
      internal CloudFormation parser and IAM rule engine.
    - >
      It also shows the common packaging path for Python security tools: library plus
      CLI, PyPI first, then Homebrew or Nix for operators who want a standalone command.
  project-history:
    - >
      The official GitHub repository was created in July 2018. Its documentation
      presents CFRipper as both a library and command-line analyzer, with examples for
      scanning CloudFormation YAML or JSON templates, resolving references, emitting
      text or JSON output, and loading custom rule configuration.
    - >
      The project sits in the CloudFormation security-analysis niche rather than the
      general linting niche: its examples focus on wildcard principals, overprivileged
      IAM roles, monitored issues, and compliance rule customization.
  related-projects:
    - AWS CloudFormation templates are the artifacts CFRipper analyzes.
    - IAM policy and principal rules are central to the README examples.
    - >
      cfn-lint is an adjacent CloudFormation validation tool, while CFRipper focuses on
      security and compliance rules.
  sources:
    - https://api.github.com/repos/Skyscanner/cfripper
    - https://github.com/Skyscanner/cfripper
    - https://cfripper.readthedocs.io
    - https://cfripper.readthedocs.io/
    - https://formulae.brew.sh/api/formula/cfripper.json
  summary:
    - >
      CFRipper is a Skyscanner library and CLI for analyzing AWS CloudFormation
      templates for security and compliance issues. The official README describes it as
      a way to prevent deploying insecure AWS resources and to add custom compliance
      plugins.
  timeline:
    - '2018: The Skyscanner/cfripper repository is created on GitHub.'
    - >
      2018: The project documents CloudFormation security analysis and custom compliance
      plugins.
    - '2026: The repository and Read the Docs site remain the official documentation surfaces.'
  usage:
    - >
      The README documents running `cfripper` against one or more CloudFormation
      templates, choosing `txt` or `json` output, using `--resolve`, writing results
      with `--output-folder`, and passing custom rules config or rules filter folders.
    - >
      The official docs show rules config files as command inputs rather than a fixed
      application config location, so `config-file-location` remains null. No official
      credential file location is documented for the CLI.
related-packages:
  - id: brew:cfn-lint
    reason: >
      Run cfn-lint alongside CFRipper to catch CloudFormation schema and
      template-validity problems before CFRipper applies its security and compliance
      rules.
    rel: adjacent_workflow
    sources:
      - https://github.com/Skyscanner/cfripper#readme
      - https://github.com/aws-cloudformation/cfn-lint#readme
  - id: brew:checkov
    reason: >
      Choose Checkov when the same security scan must cover CloudFormation plus
      Terraform, Kubernetes, Helm, Dockerfiles, and other IaC formats; choose CFRipper
      for a focused, plugin-extensible CloudFormation analyzer.
    rel: alternative
    sources:
      - https://github.com/Skyscanner/cfripper#readme
      - https://www.checkov.io/
      - https://github.com/bridgecrewio/checkov#readme
category: security
package-manager:
  brew: cfripper
  nix: cfripper
package-manager-url: https://formulae.brew.sh/formula/cfripper
license: Apache-2.0
tags:
  - aws
  - cli
  - cloudformation
  - security
  - static-analysis
description: Library and CLI tool to analyse CloudFormation templates for security issues
executables:
  - cfripper
provenance:
  formula: cfripper
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
