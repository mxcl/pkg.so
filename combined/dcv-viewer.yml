    reason: >
      Choose Jump Desktop when you need a general remote-access client built around
      Fluid, RDP, or VNC; choose DCV Viewer when the remote environment specifically
      exposes Amazon DCV, especially for GPU-backed visualization workloads.
    rel: alternative
    sources:
