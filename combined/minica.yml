id: brew:minica
display-name: minica
homepage: https://github.com/jsha/minica
repo: https://github.com/jsha/minica
docs:
  - https://github.com/jsha/minica#readme
  - https://pkg.go.dev/github.com/jsha/minica
config-file-location: null
credentials-file-location:
  unix:
    - ./minica-key.pem
    - ./minica.pem
    - ./<domain>/key.pem
    - ./<domain>/cert.pem
  windows:
    - .\minica-key.pem
    - .\minica.pem
    - .\<domain>\key.pem
    - .\<domain>\cert.pem
history:
  project-history:
    - >
      The tool automatically creates a root key and certificate and then signs
      end-entity certificates for requested DNS names or IP addresses. It does not
      provide OCSP or CRL services, and the README positions it as appropriate for RPC
      systems or microservices rather than as a public CA or full PKI platform.
  sources:
    - https://github.com/jsha/minica
    - https://pkg.go.dev/github.com/jsha/minica
  summary:
    - >
      minica is a small certificate-authority utility from the `jsha/minica` repository.
      Its README defines the intended trust model narrowly: it is for situations where
      the CA operator also operates each host that will use the generated certificate.
  usage:
    - >
      In practice, minica is used by developers and operators who need local or internal
      TLS certificates with more structure than a single ad hoc self-signed certificate.
      The Homebrew package installs a tiny Go-based CLI alternative to heavier
      internal-CA systems such as step-ca, Vault PKI, or a full ACME deployment when the
      operator controls both the CA and the hosts.
related-packages:
  - id: brew:mkcert
    reason: >
      Choose mkcert for locally trusted development HTTPS because it installs its
      generated CA into supported system and browser trust stores; choose minica when
      you control multiple service hosts and will distribute trust yourself.
    rel: alternative
    sources:
      - https://github.com/jsha/minica
      - https://github.com/FiloSottile/mkcert
  - id: brew:step
    reason: >
      Choose step when you need broader PKI automation, an online CA client,
      revocation-capable infrastructure, ACME, SSH certificates, or cryptographic
      operations beyond minica's static file workflow.
    rel: alternative
    sources:
      - https://github.com/jsha/minica
      - https://smallstep.com/docs/step-cli/
category: security
package-manager:
  brew: minica
  debian: minica
  nix: minica
  ubuntu: minica
package-manager-url: https://formulae.brew.sh/formula/minica
license: MIT
tags:
  - certificate-authority
  - certificates
  - cli
  - pki
  - tls
description: Small, simple certificate authority
executables:
  - minica
provenance:
  formula: minica
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
