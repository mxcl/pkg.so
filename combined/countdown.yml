id: brew:countdown
display-name: Countdown
homepage: https://github.com/antonmedv/countdown
repo: https://github.com/antonmedv/countdown
docs:
  - https://github.com/antonmedv/countdown#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official install instructions name Homebrew, `go install`, and prebuilt GitHub
      release binaries, which is the typical distribution mix for a compact Go CLI.
  package-nerd-significance:
    - >
      Its packaging is intentionally simple: one executable, no documented config file,
      and release artifacts suitable for Homebrew-style formula maintenance.
  project-history:
    - >
      The public repository was created in 2019 and describes a focused CLI for
      countdowns, target times, count-up mode, titles, pausing, and optional macOS
      speech announcements.
  related-projects:
    - fx
    - walk
    - howto
  sources:
    - https://github.com/antonmedv/countdown
    - https://api.github.com/repos/antonmedv/countdown
    - https://github.com/antonmedv/countdown/releases
  summary:
    - Countdown is a small Go terminal countdown timer distributed as a command-line utility.
  timeline:
    - '2019: Public GitHub repository created and 1.0.0 release published.'
    - '2023: 1.5.0 release published.'
  usage:
    - >
      Users invoke `countdown` with a Go-style duration or a target time, optionally
      chaining a shell command after completion.
related-packages: []
