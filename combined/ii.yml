id: brew:ii
display-name: ii
homepage: https://tools.suckless.org/ii/
repo: https://git.suckless.org/ii
docs:
  - https://tools.suckless.org/ii
  - https://tools.suckless.org/ii/usage
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ii's adoption has been strongest among Unix minimalists, suckless users, and
      people writing bots or personal IRC workflows. Its package-manager spread across
      Homebrew and Linux distributions reflects that it is small enough to package but
      distinctive enough to keep around.
  package-nerd-significance:
    - >
      ii is a canonical tiny Unix package: the interface is the filesystem, composition
      happens with shell tools, and the implementation goal is small enough to audit. It
      is useful package-manager lore because it shows how far plain files and FIFOs can
      replace application UI.
  project-history:
    - >
      The suckless source log reaches back to early 2007, with release tags appearing
      that year. The project page and README define ii's core idea plainly: make IRC
      scriptable with standard command-line and filesystem tools instead of a large
      terminal client UI.
    - >
      Over time ii kept the same small-file abstraction while accumulating pragmatic
      Unix fixes: portability changes, manual-page updates, OpenBSD pledge support,
      release bumps, and later direct TLS support through libretls.
  related-projects:
    - >
      ii is part of the suckless tools family and is described by suckless as the big
      brother of sic. It is also conceptually related to filesystem- and FIFO-oriented
      chat clients and shell-driven IRC bot workflows.
  sources:
    - https://git.suckless.org/ii
    - https://git.suckless.org/ii/file/README.html
    - https://tools.suckless.org/ii/
    - https://tools.suckless.org/ii/usage
  summary:
    - >
      ii, short for irc it, is a minimalist IRC client from suckless.org that represents
      IRC servers, channels, and private messages as directories containing FIFO `in`
      files and log-like `out` files.
  timeline:
    - '2007: Early public source history and 1.2/1.3 release tags.'
    - '2008: Version 1.4 prepared with cleanup and documentation fixes.'
    - >
      2011: Version 1.6 kept the implementation under a small line-count target after
      restructuring.
    - '2016: OpenBSD pledge support added.'
    - '2022: Version 2.0 release bump.'
    - '2025: Direct TLS support added.'
  usage:
    - >
      A user starts ii against a server, then writes IRC commands to `in` files and
      reads messages from `out` files. Joining a channel can be as simple as echoing `/j
      directory.
related-packages:
  - id: brew:sic
    reason: >
      Choose sic for an even smaller IRC client that multiplexes communication through
      standard input and output instead of ii's per-server and per-channel filesystem
      tree.
    rel: alternative
    sources:
      - https://tools.suckless.org/ii/
      - https://tools.suckless.org/sic/
      - https://git.suckless.org/sic/file/README.html
category: networking
