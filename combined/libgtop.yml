id: brew:libgtop
display-name: libgtop
homepage: https://gitlab.gnome.org/GNOME/libgtop
repo: https://gitlab.gnome.org/GNOME/libgtop
docs:
  - https://gitlab.gnome.org/GNOME/libgtop
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libgtop became a distro-library dependency rather than an end-user command in its
      own right. The batch input lists packages for Homebrew, MacPorts, Nix, Arch,
      Alpine, and openSUSE, reflecting its role as a support library for
      system-monitoring and GNOME-adjacent software.
  package-nerd-significance:
    - >
      libgtop is a preservation layer for old desktop portability work. Package
      maintainers care about it because it sits at the intersection of GNOME, GLib,
      process inspection, platform-specific kernel interfaces, and ABI stability across
      long-lived desktop applications.
  project-history:
    - >
      The source tree identifies Martin Baulig's April 1998 contribution of LibGTop
      1.0-era headers, and the RPM spec records a 0.25.0 release on August 19, 1998. The
      package description framed libgtop as a library for fetching running-system
      information, using /proc directly on Linux and a helper server for systems where
      information had to come from /dev/kmem or equivalent kernel interfaces.
    - >
      A May 1999 GNOME mailing-list message referred to a LIBGTOP_STABLE_1_0 branch that
      would remain binary-compatible with LibGTop 1.0.1 as shipped with GNOME 1.0. That
      places libgtop squarely in the early GNOME platform period, when desktop utilities
      needed shared C libraries to hide differences between Unix process-accounting
      APIs.
  related-projects:
    - GNOME is the desktop project that hosts libgtop.
    - GLib and GObject provide the base C platform used by libgtop.
    - >
      Linux /proc and non-Linux kernel interfaces such as /dev/kmem are the low-level
      data sources abstracted by the library.
  sources:
    - https://gitlab.gnome.org/GNOME/libgtop
    - https://gitlab.gnome.org/GNOME/libgtop/-/raw/master/AUTHORS
    - https://gitlab.gnome.org/GNOME/libgtop/-/raw/master/glibtop.h
    - https://gitlab.gnome.org/GNOME/libgtop/-/raw/master/libgtop.spec.in
    - https://mail.gnome.org/archives/gnome-list/1999-May/msg00105.html
  summary:
    - >
      libgtop is a GNOME-era C library for querying system information such as CPU,
      memory, and process state across Unix-like platforms. Its value is not a flashy
      user interface but an old portability layer over platform-specific process and
      kernel data sources.
  timeline:
    - '1998-04: Martin Baulig contributed LibGTop 1.0-era source code.'
    - '1998-08-16: The RPM spec recorded the first RPM packaging entry.'
    - '1998-08-19: The RPM changelog recorded the LibGTop 0.25.0 release.'
    - >
      1999-05: GNOME mailing-list traffic described the stable 1.0 branch as
      binary-compatible with LibGTop 1.0.1 from GNOME 1.0.
  usage:
    - >
      Developers use libgtop when a GNOME or GLib-based program needs process, memory,
      CPU, mount, or related host information without embedding per-platform probing
      code. The installed helper programs libgtop_daemon2 and libgtop_server2 exist for
      the older server-mediated access model documented in the package spec.
related-packages: []
