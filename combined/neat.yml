id: cask:neat
display-name: Neat
homepage: https://neat.run/
repo: https://github.com/neat-run/activity-feed-public
docs:
  - https://github.com/neat-run/activity-feed-public#readme
  - https://neat.run/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Neat's official account of its 2021 Product Hunt launch describes its first
      public-download milestone. The product later broadened beyond GitHub by adding
      Linear as its second integration in April 2022.
  package-nerd-significance:
    - >
      Neat represents the focused menu-bar-client style of developer tooling: instead of
      duplicating an entire forge or issue tracker, it filters activity from GitHub and
      Linear into a keyboard-driven native desktop feed.
    - >
      Its promise that data is stored locally is particularly relevant for developers
      who want notification triage without routing repository and issue activity through
      an additional collaboration service.
  project-history:
    - >
      Neat began as a desktop notification client centered on GitHub activity and
      pull-request review. The public release repository describes itself as a
      distribution point for Neat releases rather than the application's source tree.
    - >
      The product subsequently added prioritization and preference controls, followed by
      a Linear integration that placed code-review and issue-tracker notifications in
      the same desktop and menu-bar workflow.
  related-projects:
    - >
      GitHub supplies pull-request and repository activity, while Linear supplies
      issue-tracking activity; Neat presents notifications from both services in one
      local desktop feed.
  sources:
    - https://github.com/neat-run/activity-feed-public
    - https://neat.run/
    - https://neat.run/blog
  summary:
    - >
      Neat is a macOS desktop and menu-bar notification client for triaging GitHub pull
      requests and Linear activity with keyboard navigation and granular notification
      preferences.
  timeline:
    - >
      2021: Neat launched publicly on Product Hunt and documented its first download
      milestone.
    - '2022-04: Neat announced Linear as its second integration.'
  usage:
    - >
      Developers connect GitHub and optionally Linear, select which activity should
      interrupt them, and work through pull-request or issue notifications from the menu
      bar using keyboard navigation.
    - >
      The official site says application data is stored locally, but it does not
      document configuration or credential files suitable for curation.
related-packages: []
