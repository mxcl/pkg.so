id: cask:prepros
display-name: Prepros
homepage: https://prepros.io/
repo: https://github.com/Subash/Prepros
docs:
  - https://prepros.io/help
config-file-location:
  linux: /home/<YOUR_USER_NAME>/.config/Prepros-7
  macos: /Users/<YOUR_USER_NAME>/Library/Application Support/Prepros-7
  windows: C:\Users\<YOUR_USER_NAME>\AppData\Roaming\Prepros-7
credentials-file-location: null
history:
  adoption-history:
    - >
      Prepros is distributed as a desktop application for macOS, Windows, and Linux and
      is also packaged as a Homebrew cask on macOS.
  package-nerd-significance:
    - >
      Prepros offers a GUI-centered alternative to assembling and maintaining a
      Node.js-based front-end build chain, making Sass, Less, JavaScript, image, and
      live-reload workflows accessible without a large project configuration.
  project-history:
    - >
      Prepros was created as an integrated web-development companion that bundles common
      preprocessing and browser-reload tasks behind a graphical interface.
  related-projects:
    - >
      Its documented toolchain overlaps with Sass, Less, Babel, Webpack, Tailwind CSS,
      and BrowserSync-style live-reload workflows.
  sources:
    - https://prepros.io/
    - https://prepros.io/help/bundle-javascript
    - https://prepros.io/help/getting-started
    - https://prepros.io/help/tailwindcss
  summary:
    - >
      Prepros is a cross-platform graphical front-end development tool that watches
      projects, compiles source assets, bundles JavaScript, and reloads browser
      previews.
  timeline:
    - >
      Prepros 6: Project configuration files from this generation remain importable by
      later releases.
    - >
      Prepros 7: Current-generation settings are stored in an operating-system-specific
      Prepros-7 directory.
  usage:
    - >
      Users add a project folder, adjust project or file settings, and let Prepros watch
      and compile files automatically. It can also proxy a dynamic local server and
      bundle JavaScript dependencies.
category: developer-tools
package-manager:
  brew-cask: prepros
package-manager-url: https://formulae.brew.sh/cask/prepros
tags:
  - asset-compilation
  - gui
  - javascript
  - less
  - live-reload
  - preprocessor
  - sass
  - web-development
description: Web development companion
applications:
  - Prepros.app
provenance:
  cask: prepros
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
