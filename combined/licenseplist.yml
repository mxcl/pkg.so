id: brew:licenseplist
display-name: LicensePlist
homepage: >
  https://www.slideshare.net/mono0926/licenseplist-a-license-list-generator-of-all-your-dependencies-for-ios-applications
repo: https://github.com/mono0926/LicensePlist
docs:
  - https://github.com/mono0926/LicensePlist#readme
config-file-location:
  unix: license_plist.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      LicensePlist found adoption among iOS teams that needed a repeatable build-step
      for open-source acknowledgements. Its Homebrew formula and Run Script Phase
      example made it fit the daily workflow of Xcode projects.
  package-nerd-significance:
    - >
      LicensePlist is notable because it packages an Apple-specific compliance task as a
      small CLI instead of a manual Settings.bundle chore. It also shows how package
      metadata has to cross from dependency managers into platform UI assets.
  project-history:
    - >
      The public repository was created on 2017-04-28. The README describes LicensePlist
      as a command-line tool for generating plists of dependencies, with manual
      dependency entries supplied by a YAML config file.
    - >
      The project remained tightly scoped to Apple development workflows. The README
      documents installation through CocoaPods, Homebrew, Mint, an Xcode Swift Package
      Manager setup path, release binaries, and source builds.
  related-projects:
    - >
      Related projects and ecosystems include CocoaPods, Carthage, Swift Package
      Manager, Mint, Xcode Settings.bundle files, and iOS acknowledgement screens.
  sources:
    - https://api.github.com/repos/mono0926/LicensePlist
    - https://formulae.brew.sh/formula/licenseplist
    - https://github.com/mono0926/LicensePlist
    - https://github.com/mono0926/LicensePlist/issues/71
    - https://raw.githubusercontent.com/mono0926/LicensePlist/main/README.md
  summary:
    - >
      LicensePlist is a Swift command-line tool that generates iOS Settings.bundle
      acknowledgement plist files from app dependencies. Its niche is Apple-platform
      license disclosure: it turns CocoaPods, Carthage, Swift-package, and manually
      listed dependency data into files an iOS app can display in Settings.
  timeline:
    - '2017-04-28: GitHub repository created.'
    - >
      2017: GitHub issue history shows Homebrew installation work around the 1.6.0
      release line.
    - '2020: README badge and project metadata identify Swift 5.3-era development.'
    - >
      2026: Repository metadata lists Swift, iOS, license-management, Swift Package
      Manager, and Xcode topics.
  usage:
    - >
      Users run license-plist from an app repository, optionally pointing it at
      dependency manifests and output paths. The generated com.mono0926.LicensePlist
      files are copied into Settings.bundle so licenses appear inside the iOS Settings
      app.
related-packages:
  - id: brew:cocoapods
    reason: >
      LicensePlist reads the Pods directory produced by CocoaPods and converts those
      dependency licenses into application acknowledgement files.
    rel: adjacent_workflow
    sources:
      - https://github.com/mono0926/LicensePlist
      - https://guides.cocoapods.org/using/using-cocoapods.html
  - id: brew:carthage
    reason: >
      LicensePlist can inspect a Carthage Cartfile as an input when generating the
      application's acknowledgement bundle.
    rel: adjacent_workflow
    sources:
      - https://github.com/mono0926/LicensePlist
      - https://github.com/Carthage/Carthage
  - id: brew:mint
    reason: >
      LicensePlist can be installed through Mint and can scan Mintfile dependencies for
      inclusion in generated acknowledgements.
    rel: adjacent_workflow
    sources:
      - https://github.com/mono0926/LicensePlist
      - https://github.com/yonaskolb/Mint
  - id: brew:licensefinder
    reason: >
      Choose LicenseFinder when the goal is dependency-license policy enforcement and
      approval tracking rather than generating Apple Settings.bundle acknowledgements.
    rel: alternative
    sources:
      - https://github.com/pivotal/LicenseFinder
      - https://github.com/mono0926/LicensePlist
category: developer-tools
package-manager:
  brew: licenseplist
  nix: license-plist
package-manager-url: https://formulae.brew.sh/formula/licenseplist
license: MIT
tags:
  - cli
  - ios
  - license-compliance
  - licenses
  - plist
  - xcode
description: License list generator of all your dependencies for iOS applications
executables:
  - license-plist
provenance:
  formula: licenseplist
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
