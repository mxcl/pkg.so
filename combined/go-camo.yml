config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      go-camo fit an operational niche for sites that hosted HTTPS pages while allowing
      user-supplied image URLs. Its significance came less from broad framework adoption
      and more from giving operators a static Go binary, native TLS and HTTP/2 support,
      HMAC URL validation, and deployment guidance for process supervisors, Heroku,
      containers, and CDN-fronted installations.
  package-nerd-significance:
    - >
      For package maintainers, go-camo is the kind of small network daemon that benefits
      from binary distribution: a single executable plus man pages and service-manager
      examples. Its packaging in Homebrew and Nix makes the image-proxy pattern
      installable without a Node or Ruby runtime.
  project-history:
    - >
      The project was announced to the Go community in July 2012 as a Go version of
      GitHub's Camo server. Its README keeps that lineage explicit by describing go-camo
      as a Go version of a camo server and by comparing it with the original atmos/camo
      project.
  related-projects:
    - atmos/camo
    - GitHub Camo
    - Stripe Smokescreen
  sources:
    - https://github.com/atmos/camo
    - https://github.com/cactus/go-camo
    - https://github.com/cactus/go-camo/releases
    - https://groups.google.com/g/golang-nuts/c/U6hCvaIXtlk
  summary:
    - >
      go-camo is a secure image proxy server written in Go. It implements the camo
      pattern: a web application rewrites remote image URLs into signed proxy URLs, and
      the proxy fetches and serves those images over TLS to avoid mixed-content
      warnings.
  timeline:
    - '2012: The GitHub repository was created.'
    - >
      2012: The author announced Go-Camo on golang-nuts as a Go version of GitHub's Camo
      server.
    - '2013: v0.1.x releases were published on GitHub.'
    - '2026: v2.7.x releases showed ongoing maintenance of the Go daemon line.'
  usage:
    - >
      Practitioners deploy go-camo beside a web application. The application signs the
      original image URL with an HMAC key and emits a go-camo URL; go-camo validates the
      signature, decodes the target URL, fetches the remote image, and streams it back.
      The README also documents operational controls such as `GOCAMO_HMAC`, HTTP proxy
      variables, private-address rejection for SSRF-style risk reduction, allow/deny
      filters, and supervisor-based production operation.
