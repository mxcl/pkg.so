id: brew:mockserver
display-name: MockServer
homepage: https://www.mock-server.com/
repo: https://github.com/mock-server/mockserver
docs:
  - https://www.mock-server.com/
  - https://www.mock-server.com/mock_server/getting_started.html
config-file-location:
  unix:
    - mockserver.properties
    - mockserver.json
credentials-file-location: null
history:
  project-history:
    - >
      Its technical scope expanded from simple HTTP response mocking into a broader
      service-virtualization tool. The project site describes support for HTTP/1.1,
      HTTP/2, HTTP/3, HTTPS, gRPC, request recording, proxying, deterministic
      replacement of fragile dependencies, contract-first development against APIs that
      do not exist yet, and resilience testing through latency, errors, dropped
      connections, and malformed responses.
  sources:
    - https://api.github.com/repos/mock-server/mockserver-monorepo
    - https://formulae.brew.sh/formula/mockserver
    - https://github.com/mock-server/mockserver-monorepo
    - https://www.mock-server.com/
  summary:
    - >
      MockServer is an open-source HTTP and proxy testing tool maintained in the
      mock-server GitHub organization, with James D Bloom listed as maintainer in the
      repository. The monorepo was created in 2013, and the project describes itself as
      an HTTP(S) mock server and proxy for testing, able to mock APIs, inspect or modify
      traffic, and inject failures.
  usage:
    - >
      In practice, developers run MockServer as a standalone service, Docker container,
      Java/Maven test dependency, or CLI-installed server, then create expectations over
      HTTP APIs or client libraries. Homebrew packages the `mockserver` executable for
      local use, placing it in the developer-testing niche between lightweight fake
      servers and larger commercial service-virtualization platforms.
related-packages:
  - id: brew:wiremock-standalone
    reason: >
      Choose WireMock Standalone for a mature HTTP API simulator with a strong Java
      ecosystem and portable standalone process; choose MockServer when its combined
      mocking, traffic inspection, proxying, and failure-injection model better fits the
      test.
    rel: alternative
    sources:
      - https://www.mock-server.com/
      - https://wiremock.org/docs/
      - https://wiremock.org/docs/standalone/
  - id: brew:hoverfly
    reason: >
      Choose Hoverfly for a lightweight capture-and-simulate service-virtualization
      proxy with portable simulation files; choose MockServer for its broader
      expectation, verification, protocol, and programmable proxy feature set.
    rel: alternative
    sources:
      - https://www.mock-server.com/
      - https://hoverfly.io/
      - https://docs.hoverfly.io/en/latest/
category: developer-tools
package-manager:
  brew: mockserver
package-manager-url: https://formulae.brew.sh/formula/mockserver
license: Apache-2.0
tags:
  - cli
  - http
  - mock-server
  - proxy
  - testing
description: Mock HTTP server and proxy
executables:
  - mockserver
provenance:
  formula: mockserver
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
