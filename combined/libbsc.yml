id: brew:libbsc
display-name: libbsc
homepage: http://libbsc.com
repo: https://github.com/IlyaGrebnov/libbsc
docs:
  - http://libbsc.com
  - https://github.com/IlyaGrebnov/libbsc#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libbsc is not a universal archive format, but it has enough of a
      compression-benchmark and systems-programming audience to be packaged by Homebrew,
      MacPorts, and Nix. Its adoption is strongest where users want an installable
      command-line compressor plus a C/C++ library for block compression experiments.
  package-nerd-significance:
    - >
      libbsc is interesting to package nerds because it packages a research-flavored
      compression stack, including BWT, Sort Transform, LZP, SIMD, multicore scheduling,
      and CUDA, behind a small command and library rather than a broad archival
      ecosystem.
  project-history:
    - >
      The project announced its first public community technology preview as version
      1.0.0 on April 7, 2010. Its early changelog quickly added large-file support, GNU
      compiler support, multicore processing, and source-code publication under a
      free-software license.
    - >
      The 2011 and 2012 releases moved the project toward hardware-conscious compression
      work: parallel LZP, larger block sizes, NVIDIA GPU acceleration of forward Sort
      Transform algorithms, and Kepler GPU support. The 2021 series replaced older
      suffix-array and CUDA helper code with libsais and cub, then added SIMD-oriented
      dispatch and performance work.
  related-projects:
    - >
      Related components named in libbsc's own changelog include libsais, libcubwt,
      NVIDIA CUDA, cub, Burrows-Wheeler Transform tooling, Sort Transform
      implementations, and LZP compressors.
  sources:
    - https://formulae.brew.sh/formula/libbsc
    - https://github.com/IlyaGrebnov/libbsc
    - https://raw.githubusercontent.com/IlyaGrebnov/libbsc/master/CHANGES
    - https://raw.githubusercontent.com/IlyaGrebnov/libbsc/master/README
  summary:
    - >
      libbsc is a lossless block-sorting compression library and the companion bsc file
      compressor, maintained by Ilya Grebnov for high-performance compression of files
      and memory blocks.
  timeline:
    - '2010-04-07: Version 1.0.0 marked the first public community technology preview.'
    - '2010-05-03: Version 2.0.0 released source code and added multicore support.'
    - >
      2011-08-26: Version 3.0.0 added NVIDIA GPU acceleration of forward Sort Transform
      algorithms.
    - '2012-07-08: Version 3.1.0 added Kepler GPU support with CUDA Toolkit 4.2.'
    - >
      2021-06-24: Version 3.1.1 replaced divsufsort with libsais and back40computing
      code with cub.
    - '2023-02-10: Version 3.3.0 added GPU acceleration of forward Burrows-Wheeler Transform.'
  usage:
    - >
      The bsc executable compresses large files in blocks, while libbsc exposes the same
      algorithms for memory blocks. The README documents multicore block processing and
      optional NVIDIA CUDA acceleration on supported GPUs.
related-packages:
  - id: brew:zstd
    reason: >
      Choose Zstandard for a standardized general-purpose format with a wide
      speed-versus-ratio range and very fast decoding; choose libbsc when experimenting
      with block-sorting compression and its optional GPU acceleration.
    rel: alternative
    sources:
      - https://github.com/IlyaGrebnov/libbsc
      - https://facebook.github.io/zstd/
  - id: brew:bzip2
    reason: >
      Choose bzip2 when compatibility with the long-established .bz2 ecosystem matters;
      choose libbsc for its newer high-performance block-sorting implementation,
      multicore processing, and optional CUDA support.
    rel: alternative
    sources:
      - https://github.com/IlyaGrebnov/libbsc
      - https://sourceware.org/bzip2/
      - https://sourceware.org/bzip2/manual/manual.html
category: data
package-manager:
  brew: libbsc
  macports: bsc
  nix: bsc
package-manager-url: https://formulae.brew.sh/formula/libbsc
license: Apache-2.0
tags:
  - block-sorting
  - cli
  - compression
  - data-compression
  - library
description: High performance block-sorting data compression library
executables:
  - bsc
provenance:
  formula: libbsc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
