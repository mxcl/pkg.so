id: brew:dzr
display-name: DZR
homepage: https://github.com/yne/dzr
repo: https://github.com/yne/dzr
docs:
  - https://github.com/yne/dzr
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents packaging across Homebrew, Arch AUR, Gentoo GURU, Snap,
      Flatpak, Nix flakes, Termux-style manual install, and VSCode VSIX releases. GitHub
      API metadata showed 253 stars and 20 forks on 2026-06-30, suggesting a niche but
      established CLI-media audience.
  package-nerd-significance:
    - >
      DZR is package-nerd interesting because it is a tiny shell media stack distributed
      through many packaging channels, with helper executables that expose specific
      parts of the workflow rather than hiding everything behind one large application.
  project-history:
    - >
      The project sits in the tradition of lightweight media CLIs that wrap web APIs and
      local players. Its README emphasizes few dependencies, live lyrics, metadata
      tagging from Deezer metadata, and avoiding permanent local music caching.
  related-projects:
    - >
      The README points users toward dzr-tagged frontends and documents integration with
      local players such as mpv and mpg123, plus a VSCode extension build.
  sources:
    - https://github.com/yne/dzr
    - https://raw.githubusercontent.com/yne/dzr/master/README.md
    - https://api.github.com/repos/yne/dzr
  summary:
    - >
      DZR is a shell-based command-line player for Deezer, with companion utilities for
      URLs, subtitles/lyrics, decoding, and ID3 metadata. Its repository was created in
      October 2019 and describes support across Linux, BSD, macOS, Android/Termux,
      Windows through WSL, and an experimental VSCode extension.
  timeline:
    - '2019-10-15: Public GitHub repository created.'
    - >
      2021: README links to an asciinema CLI preview and notes legal constraints around
      playback without local caching.
    - '2026: Repository remained active, with the GitHub API showing a push in March 2026.'
  usage:
    - >
      Typical usage is interactive browsing with `dzr`, opening a specific Deezer API
      path, playing a track URL, piping playback through a chosen PLAYER such as mpv or
      mpg123, generating SRT lyrics with `dzr-srt`, or tagging MP3 files with `dzr-id3`.
related-packages:
  - id: brew:mpv
    reason: >
      mpv is a documented DZR playback backend and can combine DZR's streamed audio with
      subtitles generated by `dzr-srt`.
    rel: adjacent_workflow
    sources:
      - https://github.com/yne/dzr#readme
      - https://mpv.io/manual/stable/
  - id: brew:mpg123
    reason: >
      mpg123 is DZR's documented lightweight alternative playback backend when only MPEG
      audio playback is needed.
    rel: adjacent_workflow
    sources:
      - https://github.com/yne/dzr#readme
      - https://www.mpg123.de/
  - id: brew:eye-d3
    reason: >
      eyeD3 complements DZR because `dzr-id3` uses it to inject Deezer cover, artist,
      and other ID3 metadata into MP3 files.
    rel: adjacent_workflow
    sources:
      - https://github.com/yne/dzr#readme
      - https://eyed3.readthedocs.io/en/latest/
category: media
package-manager:
  brew: dzr
package-manager-url: https://formulae.brew.sh/formula/dzr
license: Unlicense
tags:
  - cli
  - deezer
  - lyrics
  - music
  - player
  - vscode-extension
description: Command-line Deezer.com player
executables:
  - dzr
  - dzr-dec
  - dzr-id3
  - dzr-srt
  - dzr-url
provenance:
  formula: dzr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
