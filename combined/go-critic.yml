id: brew:go-critic
display-name: go-critic
homepage: https://go-critic.com
repo: https://github.com/go-critic/go-critic
docs:
  - https://go-critic.com/
  - https://go-critic.com/overview.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      go-critic became part of the broader Go linting ecosystem through direct CLI use
      and through golangci-lint, whose go-critic entry exposes it as `gocritic`. The
      repository README tells most users that using go-critic under golangci-lint is
      enough, reflecting its role as a specialized checker set inside larger lint
      pipelines.
  package-nerd-significance:
    - >
      For package catalogs, go-critic represents the Go ecosystem's preference for
      composable command-line analyzers. It can be installed as a small binary, run
      directly, or consumed by a linter runner, which lets distributions package it
      without owning editor or CI integration logic.
  project-history:
    - >
      The go-critic repository was created in 2018 and the project was announced that
      year as both a linter and a sandbox for prototyping static-analysis ideas. Its
      documentation describes project goals around providing useful checks, proving
      check implementations before proposing them elsewhere, and keeping useful checks
      that lack a better home.
  related-projects:
    - golangci-lint
    - ruleguard
    - go vet
    - staticcheck
  sources:
    - https://github.com/go-critic/go-critic
    - https://github.com/go-critic/go-critic/releases
    - https://go-critic.com/
    - https://go-critic.com/overview.html
    - https://golangci-lint.run/docs/product/thanks/
  summary:
    - >
      go-critic is an opinionated static-analysis linter for Go source code. It collects
      diagnostics, style checks, performance checks, and experimental rules that are
      often missing from smaller, single-purpose Go linters.
  timeline:
    - '2018: The GitHub repository was created and the linter was announced.'
    - '2019: v0.3.4 and v0.4.0 releases appeared on GitHub.'
    - '2020: v0.4.x releases continued the checker-set expansion.'
    - '2026: v0.14.x releases documented continued maintenance.'
  usage:
    - >
      Practitioners run `go-critic check` against packages, directories, or files,
      enabling and disabling individual checks or tag groups such as diagnostic, style,
      performance, experimental, opinionated, and security. The CLI also includes `doc`
      for checker documentation and checker-specific parameters, which makes it useful
      both as a standalone audit tool and as a source of extra rules in CI.
related-packages:
  - id: brew:golangci-lint
    reason: >
      Use golangci-lint when you want go-critic's `gocritic` checks combined with many
      other Go analyzers behind one configuration and CI-facing command.
    rel: adjacent_workflow
    sources:
      - https://github.com/go-critic/go-critic
      - https://golangci-lint.run/docs/linters/configuration/#gocritic
category: developer-tools
package-manager:
  brew: go-critic
  macports: go-critic
  nix: go-critic
package-manager-url: https://formulae.brew.sh/formula/go-critic
license: MIT
tags:
  - cli
  - code-quality
  - go
  - linter
  - static-analysis
description: Opinionated Go source code linter
executables:
  - gocritic
provenance:
  formula: go-critic
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
