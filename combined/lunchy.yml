id: brew:lunchy
display-name: lunchy
homepage: https://github.com/eddiezane/lunchy
repo: https://github.com/eddiezane/lunchy
docs:
  - https://github.com/eddiezane/lunchy#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lunchy gained the most visible adoption among macOS developers who wanted short
      commands for launch agent plists. Its README documents installation through both
      RubyGems and Homebrew, and the supplied package metadata identifies the Homebrew
      formula.
    - >
      Repository metadata shows a larger audience than the later Go port, with thousands
      of stars, which fits its role as the older and better-known Lunchy implementation.
  package-nerd-significance:
    - >
      Lunchy is package-nerd-significant because it sits directly at the intersection of
      Homebrew-installed daemons, user LaunchAgents, and local development services. It
      made package-installed plist files feel more like init-system services on macOS.
    - >
      For historical package data, Lunchy is also the origin point for later ports such
      as lunchy-go, making it a small but recognizable node in the macOS
      service-management tooling family.
  project-history:
    - >
      The public repository was created in 2011. The README says Lunchy was written as
      part of project time at Carbon Five and lists Mike Perham, Eddie Zaneski, Mr
      Rogers, and other contributors in its About section.
    - >
      The README also preserves a bit of package-culture trivia: the name was originally
      intended to be `launchy`, but the gem name was already taken, so the project
      became Lunchy.
  related-projects:
    - `launchctl` and launchd are the macOS facilities Lunchy wraps.
    - RubyGems and Homebrew are the installation channels documented by upstream.
    - lunchy-go is a later Go port of the Lunchy workflow.
  sources:
    - https://api.github.com/repos/eddiezane/lunchy
    - https://github.com/eddiezane/lunchy#readme
    - source_facts.package-manager
  summary:
    - >
      Lunchy is a Ruby command-line wrapper around macOS `launchctl`. It was created to
      make common launch agent operations feel like simple service commands rather than
      exact plist-path invocations.
  timeline:
    - '2011: eddiezane/lunchy repository created.'
    - '2011: README says Lunchy was written as part of project time at Carbon Five.'
    - >
      Later: Lunchy distributed through RubyGems and Homebrew per upstream README and
      supplied package metadata.
  usage:
    - >
      Lunchy accepts commands such as `ls`, `start`, `stop`, `restart`, `status`,
      `install`, `uninstall`, `show`, and `edit`, using a substring pattern matched
      against launch agent plist filenames.
    - >
      The README contrasts `launchctl load
      ~/Library/LaunchAgents/io.redis.redis-server.plist` with `lunchy start redis`,
      which captures the package's appeal: hide verbose plist mechanics behind the
      service name a developer remembers.
related-packages:
  - id: brew:lunchy-go
    reason: >
      Choose lunchy-go for the same friendly launchctl workflow when you want a
      standalone Go implementation with Homebrew scanning and project-level service
      profiles.
    rel: alternative
    sources:
      - https://github.com/eddiezane/lunchy#readme
      - https://github.com/sosedoff/lunchy-go#readme
