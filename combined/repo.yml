id: brew:repo
display-name: repo
homepage: https://source.android.com/source/developing.html
repo: https://gerrit.googlesource.com/git-repo
docs:
  - https://source.android.com/docs/setup/reference/repo
  - https://gerrit.googlesource.com/git-repo/+/HEAD/README.md
config-file-location:
  unix: .repo/
credentials-file-location:
  unix: ~/.netrc
history:
  adoption-history:
    - >
      Repo became foundational to the Android Open Source Project's development workflow
      and is also packaged by multiple operating-system package managers. Its canonical
      documentation notes that many distributions ship it directly.
  package-nerd-significance:
    - >
      Repo is a notable package-management-adjacent tool because it coordinates a source
      distribution assembled from many Git repositories. It popularized manifest-driven
      checkout and synchronization for Android-scale source trees while deliberately
      remaining a layer above Git.
  project-history:
    - >
      Repo was created for the Android development workflow to coordinate many Git
      repositories as one logical source tree. It is implemented as a Python launcher
      and command suite, with its canonical source hosted by the Gerrit project at
      googlesource.com.
  related-projects:
    - Git supplies the underlying repositories and object model.
    - Gerrit is the review system targeted by Repo's upload workflow.
    - >
      Android manifests describe the collection of repositories, revisions, and paths
      managed by Repo.
  sources:
    - 'Official Android command reference: https://source.android.com/docs/setup/reference/repo'
    - >
      Official internal filesystem documentation:
      https://gerrit.googlesource.com/git-repo/+/HEAD/docs/internal-fs-layout.md
    - 'Official source and README: https://gerrit.googlesource.com/git-repo/'
  summary:
    - >
      Repo is Google's multiple-Git-repository management tool. It initializes
      manifest-defined workspaces, synchronizes projects, starts coordinated topic
      branches, reports status, and uploads changes for review.
  timeline:
    - '2008: Repo entered use as part of the Android open-source development infrastructure.'
    - '2026: The maintained 2.x series continued to receive releases.'
  usage:
    - >
      A user runs `repo init` to establish a manifest-driven client, `repo sync` to
      populate or update its Git repositories, and commands such as `start`, `status`,
      and `upload` to coordinate development across projects. Workspace metadata and
      Repo's own checkout live under `.repo/`.
category: developer-tools
package-manager:
  apk: repo
  brew: repo
  debian: repo
  dnf: repo
  macports: repo
  pacman: repo
  ubuntu: repo
package-manager-url: https://formulae.brew.sh/formula/repo
license: Apache-2.0
tags:
  - android
  - cli
  - git
  - repository-management
  - version-control
description: Repository tool for Android development
executables:
  - repo
provenance:
  formula: repo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
