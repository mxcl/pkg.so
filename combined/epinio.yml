id: brew:epinio
display-name: Epinio
homepage: https://epinio.io/
repo: https://github.com/epinio/epinio
docs:
  - https://docs.epinio.io/
config-file-location:
  unix: ~/.config/epinio/settings.yaml
credentials-file-location:
  unix: ~/.config/epinio/settings.yaml
history:
  adoption-history:
    - >
      Epinio's adoption is concentrated in the cloud-native and Rancher/SUSE ecosystem
      rather than general-purpose Unix tooling. The official docs link Rancher-related
      projects, community Slack, and GitHub discussions, while the README documents
      release binaries and Homebrew installation for the CLI.
  package-nerd-significance:
    - >
      Epinio matters to package nerds as a compact CLI entry point into a larger
      Kubernetes platform. Packaging the CLI through Homebrew makes the developer-facing
      part easy to install even though the running system depends on cluster-side
      components.
  project-history:
    - >
      The GitHub repository was created in November 2020. The project was originally
      associated with SUSE and later lists Krumware and SUSE in the docs and copyright
      notices. Current documentation describes Epinio as a Krumware project in
      collaboration with SUSE.
    - >
      Epinio evolved as a developer-facing layer over Kubernetes: the CLI pushes
      applications, Cloud Native Buildpacks and Paketo buildpacks can build them, and
      operators retain control of the cluster, ingress, service templates, and platform
      setup.
  related-projects:
    - >
      Rancher, Fleet, Elemental, and Rancher Desktop appear as related projects in the
      official docs navigation.
    - Paketo and Cloud Native Buildpacks are used for application build workflows.
  sources:
    - https://docs.epinio.io/
    - https://github.com/epinio/epinio
    - https://raw.githubusercontent.com/epinio/epinio/main/README.md
    - https://api.github.com/repos/epinio/epinio
  summary:
    - >
      Epinio is a Kubernetes application-development platform and CLI that turns
      application source into a running URL in one step. Its documentation positions it
      as a PaaS-style abstraction over Kubernetes for developers who do not want to work
      directly with Kubernetes internals.
  timeline:
    - '2020: The GitHub repository is created.'
    - '2020-2024: Project copyright is listed under SUSE.'
    - '2025-2026: Project copyright is listed under Krumware.'
    - '2026: Official docs publish version 1.14.0.'
  usage:
    - >
      Typical usage starts with a Kubernetes cluster plus ingress and certificate
      management, then installing Epinio through Helm and using the epinio CLI to create
      namespaces and push applications. The project targets teams that want a
      Heroku-like developer experience on top of Kubernetes.
related-packages:
  - id: brew:helm
    reason: >
      Epinio's official installation workflow deploys and upgrades the platform through
      its Helm chart, making Helm the primary cluster-side installation companion.
    rel: adjacent_workflow
    sources:
      - https://docs.epinio.io/getting-started/quickstart
      - https://docs.epinio.io/reference/helm
      - https://helm.sh/docs/
  - id: brew:kubernetes-cli
    reason: >
      Epinio requires a Kubernetes cluster and its quickstart explicitly lists kubectl
      for inspecting and operating the cluster on which Epinio is installed.
    rel: adjacent_workflow
    sources:
      - https://docs.epinio.io/getting-started/quickstart
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:minikube
    reason: >
      The Epinio quickstart documents minikube-specific networking and domain setup,
      making minikube a practical local cluster for trying the platform.
    rel: adjacent_workflow
    sources:
      - https://docs.epinio.io/getting-started/quickstart
      - https://minikube.sigs.k8s.io/docs/
category: cloud-infrastructure
package-manager:
  brew: epinio
package-manager-url: https://formulae.brew.sh/formula/epinio
license: Apache-2.0
tags:
  - app-deployment
  - cli
  - cloud-native
  - kubernetes
  - paas
description: CLI for Epinio, the Application Development Engine for Kubernetes
executables:
  - epinio
provenance:
  formula: epinio
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
