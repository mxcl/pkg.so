id: brew:cozypkg
display-name: cozypkg
homepage: https://cozystack.io
repo: https://github.com/cozystack/cozystack
docs:
  - https://cozystack.io/docs
  - https://github.com/cozystack/cozystack#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The batch source facts list only Homebrew distribution for cozypkg, and the
      Cozystack README points users to the Cozystack documentation and GitHub releases
      for the main platform. This suggests targeted adoption by Cozystack users rather
      than broad Linux-distribution packaging.
  package-nerd-significance:
    - >
      cozypkg is useful package-history metadata because it captures a rename inside a
      young Kubernetes platform ecosystem. Keeping the old package name linked to
      Cozystack and cozyhr helps users understand why adjacent formulae may overlap.
  project-history:
    - >
      The official Cozystack README describes Cozystack as a free platform and framework
      for building clouds, originally built and sponsored by Aenix, and later a CNCF
      Sandbox project. cozypkg belongs to that packaging-oriented Cozystack toolchain.
    - >
      The official cozyhr README supplies the key naming history: cozyhr was formerly
      known as cozypkg. That makes cozypkg historically significant as the earlier name
      attached to the local Helm and Flux CD wrapper workflow.
  related-projects:
    - Related projects include Cozystack, cozyhr, Helm, Flux CD, and Kubernetes.
  sources:
    - https://github.com/cozystack/cozystack#readme
    - https://github.com/cozystack/cozyhr#readme
  summary:
    - >
      cozypkg is represented in Homebrew as a CLI for managing Cozystack packages, while
      the closely related official cozyhr README says that cozyhr was formerly known as
      cozypkg.
  timeline:
    - 'Former name: The cozyhr README states that cozyhr was formerly known as cozypkg.'
    - >
      Current context: Cozystack is documented as a CNCF Sandbox project and
      cloud-building framework.
  usage:
    - >
      As described by the source facts, cozypkg manages Cozystack packages. In the
      related renamed cozyhr documentation, the workflow centers on local Helm chart
      directories and HelmRelease operations used with Flux CD.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Choose kubectl when you want to manage Cozystack Package resources directly;
      cozypkg adds variant selection, dependency ordering, and cascade analysis for that
      same resource workflow.
    rel: alternative
    sources:
      - https://cozystack.io/docs/v1.6/guides/concepts/
      - https://kubernetes.io/docs/reference/kubectl/
category: cloud-infrastructure
