id: brew:mkdocs-material
display-name: Material for MkDocs
homepage: https://squidfunk.github.io/mkdocs-material/
repo: https://github.com/squidfunk/mkdocs-material
docs:
  - https://squidfunk.github.io/mkdocs-material
config-file-location:
  unix: mkdocs.yml
credentials-file-location: null
history:
  project-history:
    - >
      The project became one of the central packages in the MkDocs ecosystem because it
      expanded the role of a theme into a batteries-included documentation layer. Its
      documentation and changelog describe feature milestones such as instant
      navigation, navigation tabs and sections, search configuration, social cards, blog
      support, tags, privacy-aware asset handling, and integrations for common Markdown
      extensions. Its adoption is visible both in GitHub metadata and in testimonial use
      by projects and organizations; the project homepage names FastAPI/Typer/SQLModel
      and Hummingbot Foundation as users of the theme for their public documentation.
  sources:
    - https://api.github.com/repos/squidfunk/mkdocs-material
    - https://formulae.brew.sh/api/formula/mkdocs-material.json
    - https://github.com/squidfunk/mkdocs-material
    - https://squidfunk.github.io/mkdocs-material/
    - https://squidfunk.github.io/mkdocs-material/changelog/
    - https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/
  summary:
    - >
      Material for MkDocs is the Python package and MkDocs theme maintained under Martin
      Donath's squidfunk project. The GitHub repository was created in 2016 and presents
      the package as a documentation framework built on top of MkDocs: authors write
      Markdown, configure MkDocs, and select the Material theme to get search,
      responsive navigation, localization, extensions, and a polished documentation UI
      without moving to a hosted documentation platform.
  usage:
    - >
      In package-manager terms, mkdocs-material is slightly unusual because it installs
      an executable named mkdocs, the same command as the core MkDocs package. Homebrew
      records that mkdocs and mkdocs-material conflict for that reason, even though the
      package is conceptually a theme and plugin bundle layered on MkDocs rather than a
      replacement for the static site generator itself.
related-packages:
  - id: brew:mkdocs
    reason: >
      MkDocs is the underlying generator whose `mkdocs.yml` configuration, build
      commands, theme interface, and plugin system Material for MkDocs extends.
    rel: adjacent_workflow
    sources:
      - https://squidfunk.github.io/mkdocs-material/getting-started/
      - https://squidfunk.github.io/mkdocs-material/creating-your-site/
      - https://www.mkdocs.org/user-guide/choosing-your-theme/
category: developer-tools
package-manager:
  apk: mkdocs-material
  brew: mkdocs-material
  chocolatey: mkdocs-material
  debian: mkdocs-material
  dnf: mkdocs-material
  nix: mkdocs
  pacman: mkdocs-material
  ubuntu: mkdocs-material
package-manager-url: https://formulae.brew.sh/formula/mkdocs-material
license: MIT
tags:
  - cli
  - documentation
  - markdown
  - material-design
  - mkdocs
  - python
  - static-site-generator
  - theme
description: Material Design theme for MkDocs
executables:
  - mkdocs
provenance:
  formula: mkdocs-material
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
