id: brew:macos-term-size
display-name: macos-term-size
homepage: https://github.com/sindresorhus/macos-terminal-size
repo: https://github.com/sindresorhus/macos-terminal-size
docs:
  - https://github.com/sindresorhus/macos-terminal-size#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The batch input records Homebrew packaging, and the README points users to
      downloadable release binaries. Repository metadata captured during this run showed
      modest GitHub adoption, which fits the project's role as a tiny single-purpose
      helper rather than a broad framework.
  package-nerd-significance:
    - >
      The package is useful because terminal dimensions are a small but annoying
      portability edge case for scripts. Packaging it in Homebrew gives macOS shell
      users a dependable native helper without pulling in a larger cross-platform stack.
  project-history:
    - >
      The official repository was created in May 2017. Its README describes a focused
      macOS utility that works even when run non-interactively, such as from a child
      process or with output redirected.
  related-projects:
    - >
      The README points to the author's cross-platform `terminal-size` project and the
      Windows-specific `windows-terminal-size` companion.
  sources:
    - https://api.github.com/repos/sindresorhus/macos-terminal-size
    - https://github.com/sindresorhus/macos-terminal-size
    - https://github.com/sindresorhus/macos-terminal-size#readme
    - source_facts.package-manager
  summary:
    - >
      macos-term-size is a small C command-line utility that prints the current terminal
      window size on macOS.
  timeline:
    - '2017: Official GitHub repository created.'
    - '2023: Repository activity continued through commits pushed to the default branch.'
  usage:
    - >
      The command is installed as `terminal-size` and prints columns followed by rows.
      The README contrasts this with `tput cols`, showing that `terminal-size` keeps
      reporting the actual terminal size in situations where `tput` may fall back to a
      default.
related-packages: []
category: system
package-manager:
  brew: macos-term-size
