id: brew:aubio
display-name: aubio
homepage: https://aubio.org
repo: https://github.com/aubio/aubio
docs:
  - https://aubio.org/manual/latest
  - https://aubio.org/doc/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      aubio spread through several packaging ecosystems because it sits at the
      intersection of command-line audio tooling, Python music-analysis workflows, and C
      library integration. The batch package metadata lists Homebrew, Alpine,
      Debian/Ubuntu as `aubio-tools`, Fedora, MacPorts, Nix, Arch, and openSUSE
      packaging.
    - >
      The official manual acknowledges Debian/Ubuntu packages, precompiled binaries,
      Python packaging through PyPI, and source builds. That mix explains its
      long-running appeal: users can install only the CLI tools, embed the C library, or
      use the Python bindings in analysis notebooks and scripts.
  package-nerd-significance:
    - >
      aubio is the sort of package that quietly anchors larger workflows. It has tiny
      command-line tools that can be chained in scripts, a C API for applications, and
      Python bindings that use NumPy arrays efficiently. That makes it show up in
      package managers for media users, scientists, educators, and plugin developers.
    - >
      Its dependency story is also interesting: the official site notes that as of 0.4.0
      aubio had no required dependencies, while optional integrations can pull in libav,
      libsndfile, libsamplerate, FFTW, JACK, Apple audio frameworks, and more. Package
      maintainers therefore decide how much audio ecosystem surface to enable.
  project-history:
    - >
      The official site describes aubio as a tool for extracting annotations from audio
      signals, with real-time-friendly algorithms that can be used offline in editors
      and samplers or online in audio effects and virtual instruments. The site footer
      dates the aubio team back to 2003, and the project remains maintained through its
      own gitweb and GitHub repository.
    - >
      The manual for aubio 0.4.9 describes the project as algorithms and tools to label
      and transform music and sounds, with Python documentation, command-line tools,
      developer documentation, Doxygen API docs, and build instructions. Its
      project-pages section links the homepage, GitHub repository, PyPI package, Doxygen
      docs, and mailing lists.
  related-projects:
    - "NumPy: aubio's Python interface exposes aubio arrays directly as NumPy arrays."
    - >
      libav, libsndfile, libsamplerate, FFTW, JACK, and Apple AudioToolbox: optional
      integrations documented by the official site.
    - 'PyPI package `aubio`: official manual lists aubio on PyPI as a project page.'
  sources:
    - https://aubio.org/
    - https://aubio.org/manual/latest/
    - https://git.aubio.org/?p=aubio.git;a=summary
  summary:
    - >
      aubio is a C library and command-line toolkit for extracting musical annotations
      from audio: onsets, pitch, tempo, beats, MFCCs, and related descriptors. In
      package-manager terms it is both a developer library and a bag of small Unix-style
      audio analysis commands.
  timeline:
    - '2003: aubio project/team history begins according to the official site footer.'
    - '0.4.0: Official site notes aubio had no required dependencies as of this release.'
    - '2018: Official homepage footer span reaches 2003-2018.'
    - '2019: 0.4.9 release line appears in official manual and tags.'
    - '2026: Official gitweb shows ongoing maintenance commits.'
  usage:
    - >
      As a CLI package, aubio gives users commands such as `aubio`, `aubiocut`,
      `aubioonset`, `aubiopitch`, `aubiotrack`, `aubionotes`, `aubiomfcc`, and
      `aubioquiet`. The manual's command-line section documents these as separate tools
      rather than a single subcommand-heavy executable.
    - >
      As a library, aubio offers algorithms for onset detection, pitch tracking, tempo
      and beat detection, MFCCs, FFT and phase vocoder work, filters,
      transient/steady-state separation, sound-file I/O, and math utilities. Optional
      dependencies add media-file, resampling, FFT, JACK, and platform audio support.
related-packages: []
category: media
