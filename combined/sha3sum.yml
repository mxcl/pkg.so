id: brew:sha3sum
display-name: sha3sum
homepage: https://codeberg.org/maandree/sha3sum
repo: https://codeberg.org/maandree/sha3sum
docs:
  - https://codeberg.org/maandree/sha3sum
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      source_facts.package-manager records Homebrew, DNF, pacman, and Zypper packaging.
      These records demonstrate distribution availability rather than adoption scale.
  package-nerd-significance:
    - >
      The author advises distributions to package the compatibility sha3sum command
      separately because its name can conflict with other implementations, including
      BusyBox. The suite can also be built as a multicall executable.
  project-history:
    - >
      Mattias Andrée developed sha3sum as a collection of Keccak-family checksum tools.
      The author's source-control history documents development by November 2014.
  related-projects:
    - >
      The README references libkeccak and traditional checksum commands. BusyBox
      compatibility influences the common sha3sum command and packaging guidance.
  sources:
    - "[Author's project page](https://www.maandree.se/proj/sha3sum.html)"
    - "[Maintainer's README](https://github.com/maandree/sha3sum#readme)"
    - >
      [Official development
      history](https://git.maandree.se/sha3sum/commit/?h=1.2&id=ab6409ba17177d397fdfd732ebba8a8a7d8ca77e)
    - source_facts.package-manager
  summary:
    - >
      sha3sum is a C collection of checksum utilities covering Keccak, SHA-3, SHAKE, and
      RawSHAKE.
  timeline:
    - '2014: The official repository records development in November.'
  usage:
    - >
      The utilities generate or verify file checksums and expose hashing parameters
      through command-line options. No default persistent configuration or credential
      file is documented in the README.
category: security
package-manager:
  brew: sha3sum
  dnf: sha3sum
  pacman: sha3sum
  zypper: sha3sum
package-manager-url: https://formulae.brew.sh/formula/sha3sum
license: ISC
tags:
  - checksum
  - cli
  - cryptography
  - hashing
  - keccak
  - sha3
description: Keccak, SHA-3, SHAKE, and RawSHAKE checksum utilities
executables:
  - keccak-224sum
  - keccak-256sum
  - keccak-384sum
  - keccak-512sum
  - keccaksum
  - rawshake128sum
  - rawshake256sum
  - rawshake512sum
  - sha3-224sum
  - sha3-256sum
  - sha3-384sum
  - sha3-512sum
  - sha3sum
  - shake128sum
  - shake256sum
  - shake512sum
provenance:
  formula: sha3sum
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
