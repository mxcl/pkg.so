credentials-file-location: null
history:
  adoption-history:
    - >
      DiskCatalogMaker became a long-running specialist Mac utility and was later
      offered in multiple editions, including a Roxio Edition and a Mac App Store
      edition.
  package-nerd-significance:
    - >
      Its 1993 origin makes it an unusually durable example of classic Mac shareware
      surviving into modern macOS package-manager workflows. Homebrew Cask gives users a
      repeatable way to install a proprietary utility whose own catalog formats and
      decades-long release history predate contemporary package managers.
  project-history:
    - >
      DiskCatalogMaker was first publicly released for Mac OS System 7 on March 22,
      1993. The application evolved from basic removable-media cataloging into a modern
      macOS catalog database and search tool, adding 64-bit support, large-data
      handling, Retina support, smarter rescanning, APFS improvements, and
      duplicate-file discovery.
  related-projects:
    - Roxio Toast integrated with a Roxio Edition of DiskCatalogMaker.
    - >
      The official support material documents importing data from other cataloging
      programs, including DiskTracker.
  sources:
    - https://diskcatalogmaker.com/history.html
    - https://diskcatalogmaker.com/support.html
  summary:
    - >
      DiskCatalogMaker is a proprietary Mac disk-cataloging utility that records the
      contents of disks and folders so users can browse and search them without keeping
      the original media mounted.
  timeline:
    - '1993: Version 1.0 received its initial public release for Mac OS System 7.'
    - >
      2017: Version 7 introduced a 64-bit Cocoa application, Retina support, columns
      view, and smart rescanning.
    - >
      2026: Version 9.2 added duplicate-file discovery and raised the maximum
      search-result count.
  usage:
    - >
      Users scan disks, folders, NAS storage, archival media, or backup collections into
      catalog files, then search, inspect, merge, separate, export, or print the
      recorded metadata. The tool is particularly useful for offline media libraries and
      archives spread across many volumes.
