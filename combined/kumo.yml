history:
  adoption-history:
    - >
      Kumo's main adoption channel is the Java ecosystem through Maven Central artifacts
      such as `kumo-core`, with a later Homebrew formula exposing the CLI as a
      standalone command. The project is niche, but it has persisted because word-cloud
      generation is a recurring visualization need and the Java API includes shapes,
      colors, tokenizers, and collision strategies.
  package-nerd-significance:
    - >
      Kumo is package-nerd interesting as a small visualization library that crossed
      from Maven dependency to Homebrew CLI. It is not a broad media platform; its value
      is that a specific Java image-generation library became scriptable as a packaged
      command.
  project-history:
    - >
      Kenny Cason introduced Kumo in a July 3, 2014 blog post as a Java word-cloud
      library that could directly generate an image file or return a BufferedImage. The
      GitHub README keeps that framing: Kumo is intended to be a powerful, user-friendly
      Java API for word-cloud rendering.
  related-projects:
    - >
      Kumo is related to Java AWT image generation, Maven Central Java libraries,
      tokenizer libraries, word-cloud visualizers, and command-line media generation
      tools.
  sources:
    - https://formulae.brew.sh/formula/kumo
    - https://github.com/kennycason/kumo
    - https://github.com/kennycason/kumo/blob/master/CLI.md
    - https://kennycason.com/posts/2014-07-03-kumo-wordcloud.html
  summary:
    - >
      Kumo is a Java word-cloud library and CLI created by Kenny Cason, with a project
      history centered on generating word-cloud images directly from Java rather than
      through browser applets or external services.
  timeline:
    - >
      2014: Kenny Cason published the Kumo Java word-cloud announcement and linked the
      GitHub repository.
    - >
      2010s: Kumo became available through Maven Central modules such as `kumo-core` and
      `kumo-tokenizers`.
    - >
      2020s: The repository documents a Homebrew-installable CLI and a dedicated CLI
      usage guide.
    - >
      2025: The README records maintainer intent to revisit issues and consider a Kotlin
      conversion.
  usage:
    - >
      Library users feed text through a `FrequencyAnalyzer`, build a `WordCloud` with a
      chosen dimension, collision mode, background, palette, and font scaling strategy,
      then write the resulting image. CLI users can generate standard, polar, or layered
      word clouds from local files or URLs and tune inputs, output size, stop words,
      collision mode, colors, font scaling, and tokenization.
