id: brew:fantom
display-name: Fantom
homepage: https://fantom.org/
repo: https://github.com/fantom-lang/fantom
docs:
  - https://fantom.org/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Fantom is distributed through an official zip that works on Windows, macOS, and
      Linux, with Homebrew documented for macOS, a Windows installer linked from Fantom
      Factory, and a Docker image published from the repository. The community is
      centered on the official forum and Slack.
    - >
      The GitHub release stream shows continued maintenance through Fantom 1.0.83 in
      March 2026, while the official changelog records ongoing compiler, JavaScript,
      library, timezone, YAML, markdown, graphics, and tooling work.
  package-nerd-significance:
    - >
      Fantom matters to package nerds as a complete but relatively niche language
      ecosystem: runtime, compiler, shell, test tool, repository manager, standard pods,
      official docs, and cross-platform binary distribution all ship together. Its pod
      model gives it its own package/deployment vocabulary rather than simply borrowing
      Java's JAR/package split.
  project-history:
    - >
      The official WhyFantom document says Fantom was initially developed in 2005 during
      a period of stagnation in Java and before statically typed JavaScript-transpiled
      options were available. The original mission targeted portable software across the
      JVM and .NET CLR, later shifting focus to the JVM and JavaScript for web
      applications.
    - >
      Fantom's design centers on portable APIs and pods. The documentation argues that
      pods unify deployment, versioning, and namespace, avoiding the mismatch between
      Java packages and JAR files.
  related-projects:
    - The JVM is a primary runtime target.
    - JavaScript is the browser and web-application target.
    - Eggbox is linked by the official site as a pod repository.
  sources:
    - https://fantom.org/
    - https://fantom.org/doc
    - https://fantom.org/doc/docIntro/WhyFantom
    - https://fantom.org/doc/docIntro/ChangeLog
    - https://fantom.org/download
    - https://github.com/fantom-lang/fantom
    - https://raw.githubusercontent.com/fantom-lang/fantom/master/readme.md
    - https://api.github.com/repos/fantom-lang/fantom
    - https://api.github.com/repos/fantom-lang/fantom/releases?per_page=10
  summary:
    - >
      Fantom is a portable programming language and runtime that runs on the JVM and
      modern web browsers. Its official docs emphasize Java-like syntax, static and
      dynamic typing, a system library, closures, immutability, actor concurrency, and a
      pod-based deployment model.
  timeline:
    - '2005: Fantom initially developed.'
    - '2020: GitHub repository created and v1.0.74 released on GitHub.'
    - '2024: v1.0.80 introduced a new ECMAScript class-based JavaScript design.'
    - '2026: v1.0.83 released.'
  usage:
    - >
      The command-line toolset includes `fan` for running Fantom programs, `fanc` for
      compilation, `fansh` for an interactive shell, `fant` for tests, and `fanr` for
      repository and package management. The official docs index groups these under
      command-line tools and language/runtime documentation.
    - >
      Fantom source is organized around pods and can target server-side JVM execution
      and browser-oriented JavaScript output. Package users typically install the
      runtime, place its tools on PATH, and then run or build pod-based applications.
related-packages: []
