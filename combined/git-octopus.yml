id: brew:git-octopus
display-name: git-octopus
homepage: https://github.com/lesfurets/git-octopus
repo: https://github.com/lesfurets/git-octopus
docs:
  - https://lesfurets.github.io/git-octopus/doc/git-conflict.html
  - https://lesfurets.github.io/git-octopus/doc/git-octopus.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Compared with the single-purpose Git helpers in this batch, git-octopus had a
      broader process pitch: its README describes CI jobs that merge all feature
      branches with the mainline and force-push the assembled result to an octopus
      branch for build and deployment. Packaging reached Homebrew, Fedora/RHEL-style RPM
      instructions, and Nix, which signals use beyond a private script.
  package-nerd-significance:
    - >
      The package matters to Git workflow enthusiasts because it turns Git's native
      octopus-merge idea into a CI/CD convention with installable commands,
      manpage-style documentation, release notes, and distribution packaging. It also
      documents a concrete branch policy: keep the mainline ready to ship, isolate work
      on small branches, and continuously test their combined result.
  project-history:
    - >
      LesFurets published the repository on GitHub in 2014 and described the project as
      an attempt to reconcile feature branching with continuous integration and
      delivery. The first GitHub release, v1.0, appeared in 2015, followed by releases
      that added conflict-resolution support, documentation improvements, and chunk-mode
      changes.
  related-projects:
    - git merge
    - continuous integration systems
    - feature-branch workflows
  sources:
    - https://formulae.brew.sh/formula/git-octopus
    - https://github.com/lesfurets/git-octopus
    - https://lesfurets.github.io/git-octopus/doc/git-conflict.html
    - https://lesfurets.github.io/git-octopus/doc/git-octopus.html
    - https://raw.githubusercontent.com/lesfurets/git-octopus/master/README.md
    - https://raw.githubusercontent.com/lesfurets/git-octopus/master/RELEASE.md
  summary:
    - >
      git-octopus is a Git extension for a continuous merge workflow based on feature
      branches. It adds git octopus for pattern-based multi-branch merges and git
      conflict for recording conflict resolutions that can be reused.
  timeline:
    - '2014: Repository was created on GitHub.'
    - '2015: v1.0 was released.'
    - '2015: v1.1 introduced a first step toward conflict resolution.'
    - '2016: v1.4 was released and RPM packaging notes documented version 1.4 packaging.'
    - '2017: v2.0 beta releases marked a Go rewrite.'
  usage:
    - >
      Teams use git-octopus to continuously build an integration branch made from many
      feature branches without making that merge part of long-lived history. When merges
      fail, git conflict can diagnose conflict pairs and store standard Git refs
      containing recorded resolutions that can be fetched and pushed.
related-packages:
  - id: brew:git
    reason: >
      Git itself can merge several named heads with its built-in octopus strategy;
      choose it for direct multi-head merges, while git-octopus adds branch-pattern
      expansion, CI-oriented diagnostics, and reusable conflict-resolution refs.
    rel: alternative
    sources:
      - https://git-scm.com/docs/git-merge
      - https://lesfurets.github.io/git-octopus/doc/git-octopus.html
      - https://lesfurets.github.io/git-octopus/doc/git-conflict.html
category: developer-tools
package-manager:
  brew: git-octopus
  dnf: git-octopus
  nix: git-octopus
package-manager-url: https://formulae.brew.sh/formula/git-octopus
license: LGPL-3.0-only
tags:
  - cli
  - conflict-resolution
  - continuous-integration
  - git
  - git-extension
  - merge
description: Continuous merge workflow
executables:
  - git-apply-conflict-resolution
  - git-conflict
  - git-octopus
provenance:
  formula: git-octopus
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
