id: brew:kondo
display-name: Kondo
homepage: https://github.com/tbillington/kondo
repo: https://github.com/tbillington/kondo
docs:
  - https://github.com/tbillington/kondo#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kondo fits a package-manager niche created by large dependency caches across
      JavaScript, Rust, Java, Python, game, mobile, and infrastructure projects.
      Homebrew, MacPorts, Arch, Winget, and other package ecosystems make it available
      as a workstation utility.
  package-nerd-significance:
    - >
      Kondo is notable because it turns repeated manual `rm -rf` cleanup into an
      indexed, prompted workflow across many build systems. Its README deliberately
      warns that the core operation is essentially recursive deletion with confirmation.
  project-history:
    - >
      The repository was created on 2020-01-27 and the 0.1.0 release was published on
      2020-01-28. The README presents Kondo as a pragmatic cleanup tool with support for
      more than twenty project types.
  related-projects:
    - >
      The README lists adjacent cleanup tools including The Tin Summer, Detox, Sweep,
      npkill, Cargo Cleanall, Cargo Sweep, Cargo Wipe, and cargo-clean-recursive.
  sources:
    - https://api.github.com/repos/tbillington/kondo
    - https://github.com/tbillington/kondo
    - https://github.com/tbillington/kondo/releases/tag/0.1.0
    - https://raw.githubusercontent.com/tbillington/kondo/master/README.md
  summary:
    - >
      Kondo is a Rust CLI and GUI project-cleanup tool for reclaiming disk space from
      dependency directories and build artifacts such as `node_modules`, `target`, and
      `build`.
  timeline:
    - '2020-01-27: GitHub repository created.'
    - '2020-01-28: 0.1.0 release published.'
    - '2022-01-05: v0.5 release published.'
  usage:
    - >
      Running `kondo` scans the working directory, while passing paths scans selected
      project roots. Options such as `--older 3M` filter cleanup candidates by
      modification age.
related-packages:
  - id: brew:cargo-sweep
    reason: >
      cargo-sweep is a narrower alternative for Rust projects that offers selective
      cleanup by age, toolchain, size, or recorded build timestamps; its README
      currently marks it unmaintained, so Kondo is the safer general-purpose choice.
    rel: alternative
    sources:
      - https://github.com/tbillington/kondo
      - https://github.com/holmgr/cargo-sweep
category: system
package-manager:
  apk: kondo
  brew: kondo
  macports: kondo
  nix: kondo
  pacman: kondo
  scoop: main/kondo
  winget: tbillington.kondo
package-manager-url: https://formulae.brew.sh/formula/kondo
license: MIT
tags:
  - cli
  - dependencies
  - disk-cleanup
  - project-cleanup
description: Save disk space by cleaning non-essential files from software projects
executables:
  - kondo
provenance:
  formula: kondo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
