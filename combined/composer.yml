id: brew:composer
display-name: Composer
homepage: https://getcomposer.org/
repo: https://github.com/composer/composer
docs:
  - https://getcomposer.org/doc
config-file-location:
  linux:
    - ./composer.json
    - $COMPOSER_HOME/config.json
    - $XDG_CONFIG_HOME/composer/config.json
    - ~/.composer/config.json
  macos:
    - ./composer.json
    - $COMPOSER_HOME/config.json
    - ~/.composer/config.json
  windows:
    - .\composer.json
    - '%COMPOSER_HOME%\config.json'
    - '%APPDATA%\Composer\config.json'
credentials-file-location:
  macos: ~/Library/Application Support/Composer/auth.json
  unix:
    - $XDG_CONFIG_HOME/composer/auth.json
    - ~/.composer/auth.json
history:
  adoption-history:
    - >
      Packagist records `composer/composer` package versions starting with 1.0.0-alpha1
      in 2012, and GitHub releases include 1.0.0-alpha1 in 2013. The official README
      points users to Packagist for public packages and to Private Packagist for private
      hosting, showing how Composer became both a CLI and a package ecosystem.
  package-nerd-significance:
    - >
      Composer is package-manager infrastructure, not just a CLI. Its resolver, lock
      file, Packagist integration, authentication model, and VCS support made PHP
      packages installable with dependency constraints in a way familiar to users of
      npm, Bundler, and other language package managers.
  project-history:
    - >
      Composer was created by Nils Adermann and Jordi Boggiano and released under the
      MIT license. Official documentation describes it as inspired by npm and Bundler,
      bringing per-project dependency resolution and installation to PHP. Packagist
      serves as the public package index for Composer packages.
  related-projects:
    - >
      Composer is closely tied to Packagist, Private Packagist, PHP's PHAR distribution
      model, and language package managers such as npm and Bundler that influenced its
      design.
  sources:
    - https://getcomposer.org/doc/00-intro.md
    - https://github.com/composer/composer
    - https://raw.githubusercontent.com/composer/composer/main/README.md
    - https://packagist.org/packages/composer/composer.json
    - https://github.com/composer/composer/releases/tag/1.0.0-alpha1
    - https://github.com/composer/composer/releases/tag/1.0.0
    - https://github.com/composer/composer/releases/tag/2.0.0
    - https://getcomposer.org/doc/articles/authentication-for-private-packages.md
  summary:
    - >
      Composer is the standard dependency manager for PHP projects. It lets projects
      declare library dependencies, resolves installable versions, and installs packages
      into the project rather than acting like a system package manager.
  timeline:
    - '2012: Packagist records `composer/composer` 1.0.0-alpha1.'
    - '2013: GitHub releases include Composer 1.0.0-alpha1.'
    - '2016: Composer 1.0.0 was released.'
    - '2020: Composer 2.0.0 was released.'
    - '2026: Packagist continues to track active Composer 2.x development.'
  usage:
    - >
      Normal Composer usage starts with a project `composer.json`, produces a lock file
      for reproducible installs, and installs dependencies into `vendor`. It can be
      installed locally as a PHAR, globally on PATH, through Docker, or through OS
      package managers such as Homebrew.
related-packages: []
category: developer-tools
package-manager:
  apk: composer
  brew: composer
  chocolatey: composer
  debian: composer
  dnf: composer
  pacman: composer
  scoop: main/composer
  ubuntu: composer
  zypper: php-composer
package-manager-url: https://formulae.brew.sh/formula/composer
license: MIT
tags:
  - cli
  - dependency-manager
  - package-manager
  - packages
  - php
description: Dependency Manager for PHP
executables:
  - composer
provenance:
  formula: composer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
