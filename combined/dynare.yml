id: brew:dynare
display-name: Dynare
homepage: https://www.dynare.org/
repo: https://git.dynare.org/Dynare/dynare
docs:
  - https://www.dynare.org/manual
  - https://www.dynare.org/
  - https://www.dynare.org/resources
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dynare's adoption is unusually institutional for a package-manager formula. The
      official About page says public bodies including central banks, ministries of
      economy and finance, international organizations, and some private financial
      institutions use it for policy analysis and forecasting support.
    - >
      In academia, Dynare is used for research and postgraduate macroeconomics teaching.
      The project also maintains a forum, annual conference, and training events, which
      gives the software a community lifecycle closer to scientific infrastructure than
      to a casual command-line utility.
    - >
      Package-manager availability complements official installers. The download page
      documents Windows, macOS, GNU/Linux, BSD, MATLAB Online, Docker, and source
      options, and the Homebrew formula tracks the stable release for macOS and Linux
      users, particularly Octave-oriented workflows.
  package-nerd-significance:
    - >
      Dynare is significant because it packages a deep research workflow rather than a
      generic programming library. It sits at the intersection of scientific computing,
      macroeconomics, MATLAB/Octave ecosystems, generated code, native numerical
      libraries, manuals, examples, and long-lived institutional governance.
    - >
      For package maintainers, Dynare is also a reminder that some CLI packages are only
      the visible tip of a much larger scientific stack. The formula's value is not just
      the executable; it is the ability to reproduce a recognized macroeconomic-modeling
      environment through common OS package tooling.
  project-history:
    - >
      Dynare's official reference manual carries copyright years 1996-2026, making it
      one of the older continuously maintained domain-specific scientific software
      packages in the package-manager ecosystem. The project is hosted at CEPREMAP in
      Paris and developed by a core team of researchers.
    - >
      The official site describes Dynare as a platform where users write a model text
      file containing variables, equations, tasks, and desired output, while Dynare
      applies numerical methods for nonlinear solving, optimization, matrix
      factorizations, Kalman filtering and smoothing, Bayesian estimation, graph
      algorithms, and optimal control.
    - >
      The modern source tree is hosted on the Dynare GitLab instance. Its README directs
      most users to precompiled packages from the Dynare website, while documenting
      source builds for the preprocessor, MATLAB and Octave MEX files, and manuals. The
      build system and dependency list reflect a substantial scientific-code
      distribution rather than a small single-binary CLI.
  related-projects:
    - >
      Related projects and environments include MATLAB, GNU Octave, DSGE model
      toolchains, SLICOT, SuiteSparse, X-13ARIMA-SEATS, Dynare's forum and conferences,
      and macroeconomic models used by central banks and academic researchers.
  sources:
    - https://www.dynare.org/about/
    - https://www.dynare.org/manual/
    - https://www.dynare.org/download/
    - https://www.dynare.org/news/
    - https://git.dynare.org/Dynare/dynare
    - https://git.dynare.org/Dynare/dynare/-/raw/master/README.md
    - https://formulae.brew.sh/formula/dynare
  summary:
    - >
      Dynare is a free, open-source platform for specifying, solving, simulating, and
      estimating dynamic economic models, especially DSGE, OLG, heterogeneous-agent, and
      semi-structural macroeconomic models.
  timeline:
    - '1996: Dynare manual copyright history begins.'
    - >
      2010s-2020s: Dynare is maintained as a CEPREMAP-hosted open-source project with
      GitLab source hosting and an active user community.
    - '2026: Dynare 7.0 is released in March, followed by Dynare 7.1 in May.'
    - >
      2026: Official download pages offer installers, source archives, Docker, BSD
      guidance, and Homebrew-oriented macOS/Octave instructions.
  usage:
    - >
      Users normally write `.mod` model files and run Dynare from MATLAB, GNU Octave, or
      tooling around the `dynare-preprocessor`. Common workflows include solving and
      simulating DSGE or OLG models, estimating parameters from data, computing optimal
      policy, and producing numerical or graphical output.
    - >
      The Homebrew package exposes `dynare-preprocessor`, which is the
      package-manager-facing piece of a larger MATLAB/Octave-centered application. That
      makes the formula useful both as a dependency for local model workflows and as a
      reproducible install path for economic research environments.
related-packages:
  - id: brew:octave
    reason: >
      GNU Octave is the free MATLAB-compatible runtime officially supported for running
      Dynare models without a proprietary MATLAB installation.
    rel: adjacent_workflow
    sources:
      - https://www.dynare.org/manual/introduction.html
      - https://docs.octave.org/octave/
category: science
