id: brew:glassfish
display-name: Eclipse GlassFish
homepage: https://glassfish.org/
repo: https://github.com/eclipse-ee4j/glassfish
docs:
  - https://glassfish.org/documentation
config-file-location:
  unix:
    - domain-dir/config/domain.xml
    - as-install/lib/templates/domain.xml
    - asenv.conf
credentials-file-location:
  unix: ~/.asadminpass
history:
  adoption-history:
    - >
      GlassFish has significance beyond a normal application server because it served as
      the proving ground for Java EE and then Jakarta EE compatibility. Application
      developers, framework authors, and specification implementers use it as an open
      implementation to test APIs, deploy sample applications, and inspect server
      behavior against the platform TCKs.
  package-nerd-significance:
    - >
      For package maintainers, GlassFish is a large Java distribution with server
      profiles, Maven artifacts, Docker images, embedded jars, generated documentation,
      and compatibility-sensitive release lines. It also bridges old Java EE naming and
      Jakarta EE naming, which matters when packaging libraries and examples that target
      a specific platform generation.
  project-history:
    - >
      GlassFish originated in the Sun and Oracle Java EE ecosystem as the open-source
      application server associated with the platform reference implementation. The
      Eclipse proposal for GlassFish records the 2018 transition of Oracle Java EE 8 and
      GlassFish technologies into the Eclipse Foundation under EE4J.
    - >
      Under Eclipse, the project became Eclipse GlassFish, a Jakarta EE-compatible
      implementation owned by the Eclipse Foundation and maintained by the community.
      The repository keeps the server, web profile, embedded distributions, tests, build
      profiles, documentation, and release notes together around the Jakarta EE
      compatibility matrix.
  related-projects:
    - Jakarta EE, Eclipse EE4J, Java EE, Open MQ, HK2, Maven Central, TCKs.
  sources:
    - https://api.github.com/repos/eclipse-ee4j/glassfish/releases?per_page=100
    - https://glassfish.org/documentation
    - https://projects.eclipse.org/proposals/eclipse-glassfish
    - https://raw.githubusercontent.com/eclipse-ee4j/glassfish/master/README.md
  summary:
    - >
      Eclipse GlassFish is the community application server that implements Jakarta EE
      and carries the GlassFish lineage from the Java EE reference implementation into
      the Eclipse EE4J era. It is a full server distribution, an embedded runtime, a
      compatibility target, and a development environment for enterprise Java
      applications.
  timeline:
    - >
      2018: Eclipse GlassFish proposal is published as part of the transition of Oracle
      Java EE 8 and GlassFish technologies to Eclipse.
    - '2020: GlassFish 6.0.0 is released from the Eclipse repository generation.'
    - '2021: GlassFish 6.1 and 6.2 track Jakarta EE 9.1 compatibility.'
    - >
      2020s: The README maps GlassFish 5.1 through 8.0 to Java EE and Jakarta EE
      platform generations.
  usage:
    - >
      Practitioners install the distribution, start a domain with asadmin, deploy WAR or
      EAR applications, use the administration console, run clustered or embedded
      deployments, and build from source when they need to test server changes. The
      Homebrew formula exposes the traditional command-line surface, including asadmin,
      startserv, and stopserv.
related-packages:
  - id: brew:tomcat
    reason: >
      Choose Apache Tomcat for applications needing only the Jakarta Servlet, Pages,
      WebSocket, EL, Authentication, and related web-profile subset; choose GlassFish
      for a complete Jakarta EE application server with the full required and optional
      API set.
    rel: alternative
    sources:
      - https://projects.eclipse.org/proposals/eclipse-glassfish
      - https://tomcat.apache.org/whichversion.html
category: developer-tools
package-manager:
  brew: glassfish
package-manager-url: https://formulae.brew.sh/formula/glassfish
license: EPL-2.0
tags:
  - application-server
  - cli
  - eclipse
  - jakarta-ee
  - java
  - server
description: Java EE application server
executables:
  - asadmin
  - asadmin.java
  - debug-asadmin
  - startserv
  - stopserv
provenance:
  formula: glassfish
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
