id: brew:htmlcompressor
display-name: HTML Compressor
homepage: https://code.google.com/archive/p/htmlcompressor/
repo: https://code.google.com/archive/p/htmlcompressor/source
docs:
  - >
    http://htmlcompressor.googlecode.com/svn/trunk/doc/com/googlecode/htmlcompressor/compressor/HtmlCompressor.html
  - https://code.google.com/archive/p/htmlcompressor
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The original Maven coordinates under com.googlecode.htmlcompressor reached Maven
      Central in 2011, and later com.github.hazendaz coordinates carried the project
      forward. Homebrew packages the command-line form, which keeps the tool available
      to shell users even though the codebase is primarily a Java library.
  package-nerd-significance:
    - >
      HTML Compressor is a time capsule from the Google Code and early Maven era of web
      performance tooling. Package nerds care because it connects a Java library, old
      Google Code docs, Maven artifacts, and a Homebrew CLI wrapper around the
      once-common task of pre-minifying server-rendered pages.
  project-history:
    - >
      The preserved ChangeLog begins with an initial 0.1 release on March 7, 2009,
      followed quickly by XML compression, JSP and Velocity integration, command-line
      support, and JavaScript/CSS compression hooks. Version 1.4 in 2011 completed a
      Maven migration and made the project available as a Maven artifact.
    - >
      Google Code archival pages preserve the old project, while the hazendaz GitHub
      repository describes itself as an automatic export from
      code.google.com/p/htmlcompressor. The GitHub README also records the later split
      between 1.x for javax namespace support and 2.x for jakarta namespace support.
  related-projects:
    - >
      Related tools include YUI Compressor, Google Closure Compiler, HTML Tidy,
      html-minifier, and build-pipeline minifiers that compress HTML, CSS, and
      JavaScript assets.
  sources:
    - Maven Central and Homebrew metadata document package-manager distribution.
    - The GitHub ChangeLog documents the original 2009-2012 release line.
    - >
      The GitHub README documents the Google Code export, package contents, command-line
      usage, and javax/jakarta version split.
  summary:
    - >
      HTML Compressor is a Java HTML/XML minifier that removes unnecessary whitespace,
      comments, and other bytes without intentionally changing document structure. The
      original project lived on Google Code, then survived through an exported GitHub
      repository and Maven coordinates.
  timeline:
    - >
      2009: Version 0.1 was released, followed by XML compressor, JSP taglib, Velocity,
      and command-line additions.
    - '2011: Version 1.4 migrated the project to Maven and published it as a Maven artifact.'
    - '2012: Version 1.5.3 was released in the original ChangeLog line.'
    - '2015: The GitHub repository was created as an export from Google Code.'
    - >
      2025: GitHub releases show maintained 1.x and 2.x lines for javax and jakarta
      namespaces.
    - '2026: The GitHub release stream continued with paired 1.x and 2.x artifacts.'
  usage:
    - >
      The compressor is used to shrink HTML or XML by removing comments, repeated
      spaces, optional quotes, protocol prefixes, and inline CSS or JavaScript overhead
      depending on options. It also includes command-line, JSP taglib, Velocity
      directive, and Java API workflows.
related-packages:
  - id: brew:minify
    reason: >
      Choose Minify for a modern cross-platform CLI that handles whole web-asset trees
      and formats beyond HTML/XML, including CSS, JavaScript, JSON, and SVG; HTML
      Compressor remains useful for Java embedding and its framework integrations.
    rel: alternative
    sources:
      - https://github.com/hazendaz/htmlcompressor#readme
      - https://github.com/tdewolff/minify
      - https://github.com/tdewolff/minify/blob/master/cmd/minify/README.md
category: developer-tools
package-manager:
  brew: htmlcompressor
package-manager-url: https://formulae.brew.sh/formula/htmlcompressor
license: Apache-2.0
tags:
  - cli
  - compressor
  - html
  - java
  - minifier
  - xml
description: Minify HTML or XML
executables:
  - htmlcompressor
provenance:
  formula: htmlcompressor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
