id: brew:cxgo
display-name: CxGo
homepage: https://gotranspile.dev
repo: https://github.com/gotranspile/cxgo
docs:
  - https://github.com/gotranspile/cxgo/tree/main/docs
  - https://github.com/gotranspile/cxgo#readme
  - https://github.com/gotranspile/cxgo/blob/main/FAQ.md
config-file-location:
  unix: ./cxgo.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents successful tests on several real-world ports, including
      Potrace, G722, PortableGL, and Physac, while warning users not to rely on it in
      production or sensitive environments.
  package-nerd-significance:
    - >
      CxGo is notable to package maintainers because it sits at the boundary between
      porting and packaging: it can turn legacy C codebases into Go projects, but its
      experimental status means the package is most useful for controlled migrations and
      inspection rather than blind production conversion.
  project-history:
    - >
      The official README describes CxGo as a practical C-to-Go translator that uses
      modernc.org/cc for preprocessing and parsing C, then applies a custom type-checker
      and AST translation layer. Its stated goals are correctness, human-readable
      output, and configurable translation.
  related-projects:
    - >
      CxGo depends on the Go ecosystem, modernc.org/cc, and its own translated example
      projects such as gotrace and g722.
  sources:
    - https://github.com/gotranspile/cxgo
    - https://raw.githubusercontent.com/gotranspile/cxgo/main/README.md
    - https://raw.githubusercontent.com/gotranspile/cxgo/main/docs/config.md
    - https://github.com/gotranspile/cxgo/releases
  summary:
    - CxGo is an experimental source-to-source compiler for translating C source code into Go.
  timeline:
    - The README marks CxGo experimental and documents compiler-test coverage.
    - GitHub release metadata lists v0.5.2 among the published releases.
    - The config reference documents cxgo.yml as the YAML project configuration file.
  usage:
    - >
      Users install cxgo with go install or a release binary, run cxgo against a C file
      for simple cases, and use cxgo.yml for larger conversions that need roots, include
      paths, file lists, replacements, identifier hints, VCS input, and pre/post
      commands.
related-packages:
  - id: brew:go
    reason: >
      CxGo emits Go source, and the official Go toolchain provides the formatter,
      compiler, and test commands used to validate and build that translated code.
    rel: adjacent_workflow
    sources:
      - https://github.com/gotranspile/cxgo
      - https://go.dev/doc/
category: developer-tools
package-manager:
  brew: cxgo
package-manager-url: https://formulae.brew.sh/formula/cxgo
license: MIT
tags:
  - c
  - cli
  - go
  - source-to-source-compiler
  - transpiler
description: Transpiling C to Go
executables:
  - cxgo
provenance:
  formula: cxgo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
