id: brew:git-cliff
display-name: git-cliff
homepage: https://git-cliff.org/
repo: https://github.com/orhun/git-cliff
docs:
  - https://git-cliff.org/docs
config-file-location:
  unix:
    - cliff.toml
    - .cliff.toml
    - .config/cliff.toml
    - ~/cliff.toml
    - ~/.cliff.toml
    - ~/.config/cliff.toml
  windows:
    - cliff.toml
    - .cliff.toml
    - .config/cliff.toml
    - C:\Users\<user>\AppData\Roaming\cliff.toml
    - C:\Users\<user>\AppData\Roaming\.cliff.toml
    - C:\Users\<user>\AppData\Roaming\.config\cliff.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      git-cliff gained adoption because it solves a recurring maintainer problem:
      turning commit history into readable release notes without hand-editing every
      release. The README links official documentation, community writing, a RustLab
      2023 talk, an interview, editor support, and related projects, which shows a tool
      with a visible release-management ecosystem rather than a one-off script.
  package-nerd-significance:
    - >
      For package maintainers, git-cliff matters because it packages release-note
      generation as a reproducible build step. Its availability across Homebrew, Linux
      distributions, Scoop, winget, crates.io, npm, PyPI, and container workflows makes
      it easy to use in heterogeneous release pipelines.
  project-history:
    - >
      The project is authored by Orhun Parmaksiz and began its documented release series
      with v0.1.0 on 2021-08-12. Its changelog records steady growth across the 0.x line
      into 2022 and a larger 2.x line by 2026, with work on configuration, templating,
      remote integrations, CI packaging, npm packaging, PyPI wheels, and Docker images.
  related-projects:
    - >
      The README lists related changelog and release tools including git-journal,
      clog-cli, relnotes, cocogitto, release-plz, and other Git changelog generators.
  sources:
    - https://formulae.brew.sh/formula/git-cliff
    - https://git-cliff.org/docs
    - https://github.com/orhun/git-cliff
    - https://raw.githubusercontent.com/orhun/git-cliff/main/CHANGELOG.md
    - https://raw.githubusercontent.com/orhun/git-cliff/main/README.md
  summary:
    - >
      git-cliff is a Rust changelog generator that derives release notes from Git
      history. It sits in the release-engineering space around Conventional Commits,
      templated changelogs, and automated package publishing.
  timeline:
    - '2021: v0.1.0 release documented in the changelog.'
    - '2022: 0.8.x releases continued the early public line.'
    - >
      2026: 2.13.x changelog entries documented mature CI, packaging, configuration, and
      remote work.
  usage:
    - >
      Practitioners configure cliff.toml, choose parsers for Conventional Commits or
      custom commit patterns, and render changelogs through the CLI or in CI. The
      template system lets maintainers align generated notes with project conventions
      while still deriving content from Git data.
related-packages:
  - id: brew:cocogitto
    reason: >
      Choose Cocogitto when you need a broader Conventional Commits and SemVer toolbox
      that also validates commits and performs version bumps; git-cliff is more narrowly
      focused on deeply customizable changelog generation.
    rel: alternative
    sources:
      - https://git-cliff.org/docs/
      - https://docs.cocogitto.io/
      - https://github.com/cocogitto/cocogitto#similar-projects
  - id: brew:cargo-release
    reason: >
      cargo-release can run git-cliff through its release hooks, placing generated
      changelog updates inside a Rust crate's versioning, tagging, and publishing
      workflow.
    rel: adjacent_workflow
    sources:
      - https://git-cliff.org/docs/integration/cargo-release/
      - https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
category: developer-tools
package-manager:
  apk: git-cliff
  brew: git-cliff
  macports: git-cliff
  nix: git-cliff
  pacman: git-cliff
  scoop: main/git-cliff
  winget: orhun.git-cliff
  zypper: git-cliff
package-manager-url: https://formulae.brew.sh/formula/git-cliff
license: Apache-2.0 AND MIT
tags:
  - changelog
  - cli
  - conventional-commits
  - git
  - release-notes
description: Highly customizable changelog generator
executables:
  - git-cliff
provenance:
  formula: git-cliff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
