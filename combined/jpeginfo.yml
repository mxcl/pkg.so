id: brew:jpeginfo
display-name: jpeginfo
homepage: https://www.kokkonen.net/tjko/projects.html
repo: https://github.com/tjko/jpeginfo
docs:
  - https://github.com/tjko/jpeginfo#readme
  - https://www.kokkonen.net/tjko/projects.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      jpeginfo appears in Unix package collections as a companion to image-processing
      pipelines, especially where maintainers need a lightweight integrity checker
      rather than a full image editor. Its availability through Homebrew, Debian,
      Fedora, MacPorts, Nix, Ubuntu, and openSUSE reflects that quiet utility role.
  package-nerd-significance:
    - >
      jpeginfo is package-nerd useful because it exposes low-level JPEG facts without
      dragging in a heavyweight graphics stack. It pairs naturally with `jpegoptim`: one
      tool checks and reports, the other rewrites and compresses.
  project-history:
    - >
      The README records copyright years starting in 1995 and lists v1.0 as the first
      public release. The program was built on IJG libjpeg and kept the style of
      traditional command-line inspection tools: one binary, option flags, report
      columns, and exit codes suitable for shell scripts.
    - >
      Later releases added checksum support, GNU autoconf configuration, comment and
      Exif recognition, CSV and JSON output, stdin support, and stronger digest options.
      GitHub releases in January and October 2023 document the modern 1.6 and 1.7
      series.
  related-projects:
    - Related projects include IJG libjpeg, libjpeg-turbo, mozjpeg, and jpegoptim.
  sources:
    - https://github.com/tjko/jpeginfo
    - https://github.com/tjko/jpeginfo/releases
    - https://raw.githubusercontent.com/tjko/jpeginfo/master/README
    - https://raw.githubusercontent.com/tjko/jpeginfo/master/jpeginfo.1
    - https://www.kokkonen.net/tjko/projects.html
  summary:
    - >
      jpeginfo is Timo Kokkonen's small Unix-style utility for listing JPEG/JFIF
      metadata and checking file integrity. Its project page describes it as a tool for
      informative JPEG listings, error checks, and optional deletion of broken JPEG
      files.
  timeline:
    - '1995: Copyright period begins in the upstream README.'
    - 'v1.0: First public release, as listed in the upstream history.'
    - '2023-01-08: v1.6.2 added SHA-256 digest support and improved Win32 support.'
    - >
      2023-01-16: v1.7.0 added CSV output, JSON output, stdin support, headers, and
      SHA-512 support.
    - '2023-10-29: v1.7.1 added `--files-from` and `--files-stdin`.'
  usage:
    - >
      Typical use is batch inspection of JPEG dimensions, markers,
      progressive/non-progressive status, comments, and optional checksum columns. The
      `--check` mode makes it useful in scripts that reject damaged uploads or clean
      photo archives.
related-packages:
  - id: brew:jpegoptim
    reason: >
      Use jpeginfo to inspect or validate JPEG files before or after jpegoptim rewrites
      them for lossless optimization or controlled recompression.
    rel: adjacent_workflow
    sources:
      - https://github.com/tjko/jpeginfo#readme
      - https://github.com/tjko/jpegoptim#readme
category: media
package-manager:
  apk: jpeginfo
  brew: jpeginfo
  debian: jpeginfo
  dnf: jpeginfo
  macports: jpeginfo
  nix: jpeginfo
  ubuntu: jpeginfo
  zypper: jpeginfo
package-manager-url: https://formulae.brew.sh/formula/jpeginfo
license: GPL-3.0-or-later
tags:
  - checksums
  - cli
  - image-metadata
  - integrity-check
  - jfif
  - jpeg
description: Prints information and tests integrity of JPEG/JFIF files
executables:
