id: brew:far2l-tty
display-name: far2l-tty
homepage: https://github.com/elfmz/far2l
repo: https://github.com/elfmz/far2l
docs:
  - https://github.com/elfmz/far2l#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official project documentation points to Debian and Ubuntu packages, Homebrew
      installation, community packages, and portable builds, showing that far2l moved
      from a source-port project into distribution packaging. The README notes that the
      compact Homebrew TTY build omits some large optional features such as Python
      subplugins and selected NetRocks protocols to keep dependencies smaller.
  package-nerd-significance:
    - >
      Package maintainers care about far2l-tty because it is a split build of a
      dependency-heavy desktop/terminal application. The TTY package captures the
      minimal, server-friendly use case while leaving GUI and optional protocol bindings
      to larger builds.
  project-history:
    - >
      The far2l upstream describes itself as a Linux fork of FAR Manager v2 that also
      works on macOS and BSD. The project keeps much of the original FAR-style workflow
      and plugin model while adapting it to Unix desktop and terminal backends.
    - >
      The TTY flavor is one of several runtime backends documented by the project. It
      trades the richer GUI or X11-assisted terminal modes for a smaller plain-terminal
      build, which is why Homebrew ships a separate far2l-tty formula.
  related-projects:
    - FAR Manager is the Windows project far2l ports and adapts.
    - >
      NetRocks is the far2l plugin family that provides many of the remote filesystem
      protocols highlighted by the project.
  sources:
    - https://github.com/elfmz/far2l
    - https://github.com/elfmz/far2l#readme
    - https://github.com/elfmz/far2l/releases
  summary:
    - >
      far2l-tty is the terminal-oriented Homebrew packaging of far2l, a Linux and
      Unix-like port of FAR Manager v2. Its importance is mostly cultural and practical:
      it brings the keyboard-heavy, two-panel file-manager workflow associated with FAR
      on Windows into Unix terminals, including server and remote-shell environments.
  timeline:
    - '2016: The public GitHub repository was created.'
    - '2023: Ubuntu packaging began appearing for the far2l package family.'
    - >
      2025: Debian and Ubuntu documentation in the README describes separate GUI, TTY
      X/Xi, and plain TTY packaging choices.
  usage:
    - >
      Users run far2l as a terminal or desktop file manager, editor, archive browser,
      and remote-file tool. The documented NetRocks plugin covers protocols such as
      SFTP, SCP, FTP, SMB, NFS, WebDAV, and optionally AWS S3, so far2l-tty is useful on
      machines where a console file manager plus network browsing is preferable to a
      GUI.
related-packages:
  - id: brew:midnight-commander
    reason: >
      Choose Midnight Commander for the established GNU two-panel terminal file-manager
      experience and broad virtual-filesystem support; choose far2l-tty when you
      specifically prefer FAR-compatible interaction and plugins such as NetRocks.
    rel: alternative
    sources:
      - https://github.com/elfmz/far2l#readme
      - https://midnight-commander.org/
category: productivity
package-manager:
  brew: far2l-tty
  debian: far2l
  nix: far2l
  ubuntu: far2l
package-manager-url: https://formulae.brew.sh/formula/far2l-tty
license: GPL-2.0-only
tags:
  - cli
  - file-manager
  - netrocks
  - terminal
  - tty
  - unix
description: Unix TTY port of FAR Manager v2 (with NetRocks support)
executables:
  - far2l
  - far2ledit
provenance:
  formula: far2l-tty
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
