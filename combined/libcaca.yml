history:
  adoption-history:
    - >
      libcaca became widely packaged because it is both a library and a memorable
      collection of terminal demos and converters. Distribution packages often expose
      caca-utils commands such as cacaview, img2txt, cacafire, cacademo, and cacaplay.
  package-nerd-significance:
    - >
      libcaca is package-index folklore: useful enough to ship everywhere, unserious
      enough to be remembered, and technically richer than the joke suggests. Its
      presence in package managers marks the long Unix tradition of terminal graphics,
      demos, and image conversion tools.
  project-history:
    - >
      The NEWS file starts with a 0.1 release that already had S-Lang, ncurses, and
      conio drivers plus primitive drawing routines. Subsequent early releases added 256
      color pairs, mouse support, BMP loading, image viewing through cacaview,
      antialiasing, dithering controls, alpha handling, and the cacafire demo.
    - >
      The 0.99 beta line expanded libcaca from a funny terminal renderer into a
      surprisingly broad text-graphics toolkit. The 0.99.beta1 notes list a switch to
      the WTFPL, a split into libcucul and libcaca, Unicode and TrueColor support,
      Floyd-Steinberg dithering, gamma correction, export formats including HTML, IRC,
      ANSI, SVG, PostScript, and TGA, OpenGL output, a telnet server, and image-to-IRC
      tooling. The 0.99.beta15 notes say libcucul was merged back into libcaca for
      clarity.
  related-projects:
    - >
      Related projects and concepts include aalib-style text rendering, FIGlet and
      TOIlet fonts, ncurses, S-Lang, Imlib2-backed image viewing, OpenGL text output,
      and terminal demo programs such as cacafire.
  sources:
    - http://caca.zoy.org/wiki/libcaca
    - https://formulae.brew.sh/formula/libcaca
    - https://github.com/cacalabs/libcaca
    - https://github.com/cacalabs/libcaca/releases
    - https://github.com/cacalabs/libcaca/tags
    - https://raw.githubusercontent.com/cacalabs/libcaca/main/NEWS
    - https://raw.githubusercontent.com/cacalabs/libcaca/main/README
  summary:
    - >
      libcaca is the Colour ASCII Art Library, a terminal/media library and utility
      suite for rendering images, demos, and animations as colored text.
  timeline:
    - '0.1: Initial release with S-Lang, ncurses, conio drivers, and basic drawing primitives.'
    - >
      0.99.beta1: Switched to WTFPL, split libcucul from libcaca, and added Unicode,
      TrueColor, dithering, exporters, OpenGL, cacaserver, and img2irc.
    - '2008-09-27: v0.99.beta14 and v0.99.beta15 tags were published on GitHub.'
    - '2010-02-08: v0.99.beta17 tag was published on GitHub.'
    - '2012-04-06: v0.99.beta18 tag was published on GitHub.'
    - '2013-09-16: v0.99.beta19 tag was published on GitHub.'
    - >
      2021-10-19: v0.99.beta20 release added IPv6 support in cacaserver and
      memory-safety fixes.
  usage:
    - >
      Developers can link against libcaca through pkg-config, while end users use tools
      such as img2txt and cacaview to convert or view pixel images in terminals. The
      README documents optional output backends including ncurses, S-Lang, conio, X11,
      OpenGL, Win32, and a network server.
related-packages:
  - id: brew:chafa
    reason: >
      Choose Chafa for modern terminal graphics protocols, animated formats, Unicode
      mosaics, automatic terminal support, and a stable C API; choose libcaca for its
      established colored character-art ecosystem and bundled demos.
    rel: alternative
    sources:
      - https://hpjansson.org/chafa/
      - https://github.com/cacalabs/libcaca
  - id: brew:aalib
    reason: >
      Choose AA-lib for a classic, deliberately monochrome ASCII-art graphics API;
      choose libcaca when colored output, Unicode, broader exporters, and multiple
      graphical display backends are useful.
    rel: alternative
    sources:
      - https://aa-project.sourceforge.net/aalib/
      - https://github.com/cacalabs/libcaca
  - id: brew:jp2a
    reason: >
      Choose jp2a for a focused command-line image-to-ASCII conversion workflow; choose
      libcaca when an embeddable graphics library, interactive viewer, animations, or
      multiple output drivers are required.
    rel: alternative
    sources:
      - https://github.com/Talinx/jp2a
      - https://github.com/cacalabs/libcaca
category: media
