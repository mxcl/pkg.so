id: brew:naabu
display-name: Naabu
homepage: https://docs.projectdiscovery.io/tools/naabu/overview
repo: https://github.com/projectdiscovery/naabu
docs:
  - https://docs.projectdiscovery.io/opensource/naabu/running
  - https://docs.projectdiscovery.io/tools/naabu/overview
config-file-location:
  unix: ~/.config/naabu/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Naabu is adopted mostly by bug bounty hunters, pentesters, and security engineers
      who already compose ProjectDiscovery tools into pipelines. On July 1, 2026 the
      GitHub API showed 6,029 stars and 691 forks. Homebrew reported 1,696 installs over
      365 days, which is meaningful but modest beside Go install paths, container usage,
      and Linux package channels.
  package-nerd-significance:
    - >
      Naabu is not trying to replace nmap as a universal network mapper. Its niche is
      fast, scriptable port discovery that produces clean output for the next tool in a
      recon pipeline. That separation of concerns is the package-nerd angle: use Naabu
      for speed and breadth, then hand fewer targets to slower service/version or
      vulnerability scanners.
  project-history:
    - >
      The README and ProjectDiscovery docs describe Naabu as a simple scanner that
      performs SYN, CONNECT, and UDP probes and returns ports that respond. Over time it
      gained features useful in large recon jobs: IPv4/IPv6 scanning, DNS port scans,
      automatic IP deduplication, host discovery, CDN/WAF exclusion, JSON/CSV output,
      passive port enumeration through Shodan InternetDB, native UDP service probes, and
      nmap integration for follow-up service discovery.
  related-projects:
    - ProjectDiscovery
    - nuclei
    - httpx
    - subfinder
    - dnsx
    - nmap
    - Shodan InternetDB
  sources:
    - https://api.github.com/repos/projectdiscovery/naabu
    - https://api.github.com/repos/projectdiscovery/naabu/releases/latest
    - https://docs.projectdiscovery.io/opensource/naabu/overview
    - https://docs.projectdiscovery.io/opensource/naabu/running
    - https://formulae.brew.sh/api/formula/naabu.json
    - https://formulae.brew.sh/formula/naabu
    - https://github.com/projectdiscovery/naabu
    - https://pkg.go.dev/github.com/projectdiscovery/naabu
  summary:
    - >
      Naabu is ProjectDiscovery's fast Go port scanner for enumerating open ports across
      hosts, lists, CIDRs, and discovery pipelines. The GitHub repository was created on
      January 21, 2020, and the project sits in the same offensive-security and
      attack-surface-discovery family as subfinder, httpx, nuclei, dnsx, and other
      ProjectDiscovery tools.
  timeline:
    - '2020-01-21: GitHub repository created.'
    - '2026-05-05: v2.6.1 published on GitHub.'
    - >
      2026-07-01: GitHub API showed 6,029 stars and Homebrew API showed 1,696 installs
      over 365 days.
  usage:
    - >
      The basic use is `naabu -host example.com` or feeding hosts on stdin with flags
      such as `-p`, `-top-ports`, `-json`, `-o`, and `-rate`. Operators use it as the
      port-enumeration stage between subdomain discovery and HTTP/service probing, often
      handing discovered ports to httpx, nuclei, or nmap. The docs call out that SYN
      scans need sufficient privileges, while non-root use falls back to CONNECT scans.
related-packages:
  - id: brew:nmap
    reason: >
      Naabu can invoke Nmap on discovered ports for deeper service discovery, combining
      Naabu's fast enumeration with Nmap's broader inspection capabilities.
    rel: adjacent_workflow
    sources:
      - https://github.com/projectdiscovery/naabu#nmap-integration
      - https://nmap.org/book/man.html
  - id: brew:httpx
    reason: >
      ProjectDiscovery documents piping Naabu's discovered ports into httpx to identify
      reachable HTTP services.
    rel: adjacent_workflow
    sources:
      - https://docs.projectdiscovery.io/opensource/naabu/running
      - https://github.com/projectdiscovery/httpx
category: security
package-manager:
  apk: naabu
  brew: naabu
  nix: naabu
