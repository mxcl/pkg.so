id: brew:kalker
display-name: Kalker
homepage: https://kalker.strct.net
repo: https://github.com/PaddiM8/kalker
docs:
  - https://github.com/PaddiM8/kalker#readme
  - https://kalker.strct.net
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/kalker/default.kalker
    - ~/.config/kalker/default.kalker
  macos: ~/Library/Application Support/kalker/default.kalker
  windows: '%APPDATA%\kalker\default.kalker'
credentials-file-location: null
history:
  adoption-history:
    - >
      Kalker followed the Rust CLI adoption path: Cargo installation from upstream,
      release binaries for major desktop platforms, then distribution through package
      managers including Homebrew, MacPorts, AUR, Nix/NixOS, NetBSD pkgsrc, Scoop, and
      winget as recorded by its README and batch package metadata.
    - >
      By 2026-07-01, the repository metadata showed roughly low-thousands GitHub stars,
      enough to mark it as a recognized niche calculator rather than infrastructure
      software.
  package-nerd-significance:
    - >
      Kalker is interesting to package nerds because it is a multi-surface Rust project
      whose CLI, library, npm binding, and browser demo all orbit one calculation
      engine. It also shows the modern pattern of a small desktop utility being
      available through Cargo, OS package managers, JavaScript packaging, and
      WebAssembly at the same time.
  project-history:
    - >
      The GitHub repository was created on 2020-06-04, and GitHub releases show public
      0.1.x builds beginning on 2020-06-12. The README describes Kalker as supporting
      variables, user-defined functions, complex numbers, differentiation, integration,
      vectors, matrices, number bases, syntax highlighting, and loading predefined
      function files.
    - >
      The project split its reusable engine from its front ends: the README identifies
      the Rust crate `kalk` as the library that powers the tool, plus `@paddim8/kalk`
      JavaScript bindings and `@paddim8/kalk-component` for browser use. That made
      Kalker more than a single binary while keeping the Homebrew package focused on the
      `kalker` executable.
  related-projects:
    - >
      `kalk` is the Rust crate behind Kalker, and `@paddim8/kalk` exposes the engine to
      JavaScript and WebAssembly use.
    - >
      Kalker sits near terminal calculators such as bc, qalc, and eva, but emphasizes
      human-readable math syntax and multi-platform app surfaces.
  sources:
    - https://api.github.com/repos/PaddiM8/kalker
    - https://crates.io/crates/kalker
    - https://github.com/PaddiM8/kalker
    - https://github.com/PaddiM8/kalker/releases
    - https://kalker.xyz
    - https://www.npmjs.com/package/@paddim8/kalk
  summary:
    - >
      Kalker is a Rust-based scientific calculator packaged as a command-line tool and
      also presented as a website, Android app, WebAssembly-backed browser calculator,
      Rust library, JavaScript binding, and web component. In package-manager terms it
      belongs to the small but loved class of terminal calculators that try to feel like
      math notation rather than a four-function shell utility.
  timeline:
    - '2020: GitHub repository created and 0.1.x releases published.'
    - >
      2024: v2.2.0 released, showing the project had moved well beyond its initial Rust
      CLI shape.
    - '2025: v2.2.2 released on GitHub.'
  usage:
    - >
      Typical use is interactive or one-shot calculation with math-like syntax: defining
      variables and functions, evaluating symbolic-looking expressions, using constants
      and built-in functions, and loading a personal file of predefined formulas. Its
      appeal is strongest for people who want a terminal-native calculator without
      switching mental models to a spreadsheet or CAS notebook.
    - >
      The documented file-loading behavior and default startup file make it useful for
      recurring domain formulas, such as physics constants or repeated engineering
      calculations, while staying lightweight enough for shell workflows.
related-packages:
  - id: brew:libqalculate
    reason: >
      Choose libqalculate's `qalc` for units, currency conversion, arbitrary precision,
      uncertainty handling, and broader symbolic features; choose Kalker for its lighter
      math-like syntax and shared native, web, and library ecosystem.
    rel: alternative
    sources:
      - https://qalculate.github.io/manual/qalc.html
      - https://kalker.xyz/
category: productivity
package-manager:
  apk: kalker
  brew: kalker
  macports: kalker
  nix: kalker
  scoop: main/kalker
  winget: PaddiM8.kalker
package-manager-url: https://formulae.brew.sh/formula/kalker
license: MIT
tags:
  - calculator
  - cli
  - functions
  - math
  - scientific-calculator
  - variables
description: Full-featured calculator with math syntax
executables:
  - kalker
provenance:
  formula: kalker
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
