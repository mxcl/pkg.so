id: brew:matcha
display-name: Matcha
homepage: https://github.com/piqoni/matcha
repo: https://github.com/piqoni/matcha
docs:
  - https://github.com/piqoni/matcha#readme
config-file-location:
  unix: config.yaml
credentials-file-location:
  unix: config.yaml
history:
  adoption-history:
    - >
      Matcha's package-manager adoption is modest but cross-platform. The batch input
      records Homebrew, Nix, Scoop, Winget, and zypper packaging, which fits a small
      self-hosted personal productivity CLI with prebuilt binaries and Go install
      support.
  package-nerd-significance:
    - >
      Matcha is package-nerd-relevant as part of the newer wave of single-binary Go
      personal tools: it replaces a hosted feed reader with a local cron-friendly
      program and plain Markdown output. Its optional LLM features also show how small
      CLIs started bolting AI summary workflows onto older RSS habits.
  project-history:
    - >
      The project README describes Matcha as a way to consume RSS feeds and topics at
      the user's own pace, especially through Markdown viewers such as Obsidian or
      directly in terminal mode. Its MIT license file records 2022 as the project
      copyright year.
    - >
      The README shows Matcha expanding from daily RSS digests into a personal
      information workflow: Google News keyword tracking, Instapaper bookmarking,
      weather, OPML import, terminal output, OpenAI-compatible summarization, and
      analyst/notification features.
  related-projects:
    - >
      The README points web users to `piqoni/go-digest`. Matcha also overlaps with
      Obsidian-based personal knowledge workflows, OPML-based feed readers, local
      AI/OpenAI-compatible summarizers, and terminal RSS tools.
  sources:
    - https://github.com/piqoni/matcha
    - https://github.com/piqoni/matcha/releases/tag/v0.9.0
    - https://raw.githubusercontent.com/piqoni/matcha/main/LICENSE
    - https://raw.githubusercontent.com/piqoni/matcha/main/README.md
    - source_facts.package-manager
  summary:
    - >
      Matcha is a Go-based RSS daily digest generator that writes feed, topic, weather,
      bookmarking, and optional LLM summary output into Markdown or a terminal view.
  timeline:
    - "2022: Matcha's MIT license records the project copyright year."
    - '2025: GitHub release v0.9.0 is published.'
    - >
      2020s: README-documented features include terminal mode, Markdown digests, OPML
      import, OpenAI-compatible summarization, and analyst notifications.
  usage:
    - >
      On first run, Matcha generates a `config.yaml` file and a Markdown digest in the
      same directory. Users edit feeds, Google News keywords, the Markdown output
      directory, OPML path, weather coordinates, and optional OpenAI-compatible
      settings; they can run it on demand or from cron.
    - >
      The config may contain credentials such as `openai_api_key` and notification
      webhook URLs, so the configuration file is also the credential-bearing file when
      those optional features are enabled.
related-packages:
  - id: brew:newsboat
    reason: >
      Choose Newsboat when you want an interactive text-console RSS/Atom reader rather
      than Matcha's generated daily Markdown digest.
    rel: alternative
    sources:
      - https://github.com/piqoni/matcha
      - https://newsboat.org/
category: productivity
package-manager:
  brew: matcha
  nix: matcha
  scoop: main/matcha
  winget: floatpane.matcha
  zypper: matcha
package-manager-url: https://formulae.brew.sh/formula/matcha
license: MIT
tags:
  - cli
  - daily-digest
  - feed-reader
  - markdown
  - rss
description: Daily digest generator for your RSS feeds
executables:
  - matcha
provenance:
  formula: matcha
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
