id: brew:mani
display-name: mani
homepage: https://manicli.com
repo: https://github.com/alajmo/mani
docs:
  - https://manicli.com/
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/mani/config.yaml
    - ~/.config/mani/config.yaml
  macos: ~/Library/Application Support/mani/config.yaml
  unix:
    - mani.yaml
    - mani.yml
    - .mani.yaml
    - .mani.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents distribution through project releases, curl install,
      Homebrew, MacPorts, Arch AUR, Nix, Go install, and source builds. That
      package-manager spread reflects a niche but real audience among developers who
      maintain many Git repositories.
  package-nerd-significance:
    - >
      mani sits in the same tooling family as `myrepos`, `repo`, `vcstool`, `meta`, and
      other multi-repository helpers, but packages the workflow as a single Go binary
      with shell completion and a YAML-first configuration model.
  project-history:
    - >
      The public repository was created in October 2019. The project's own background
      document says it was written because the author wanted a central place for many
      repositories, with names, URLs, descriptions, one-command cloning, ad-hoc or named
      commands across selected repositories, and an overview of repositories and command
      output.
    - >
      mani's design centers on a user-editable YAML file instead of treating the config
      as an opaque state file. The documentation highlights projects, tasks, specs,
      targets, themes, and environment variables as the core concepts in `mani.yaml`.
  related-projects:
    - >
      The official project background names gita, gr, meta, mu-repo, myrepos, repo, and
      vcstool as similar software.
    - The README points to the author's `sake` project as a related tool for managing servers.
  sources:
    - https://github.com/alajmo/mani
    - https://github.com/alajmo/mani#readme
    - https://github.com/alajmo/mani/blob/main/docs/config.md
    - https://github.com/alajmo/mani/blob/main/docs/project-background.md
    - https://github.com/alajmo/mani/releases/tag/v0.32.1
  summary:
    - >
      mani is a Go command-line tool for managing many repositories from one YAML
      inventory. It combines project metadata, cloning and synchronization, task
      definitions, filtering, and command execution across groups of repositories.
  timeline:
    - '2019: Public GitHub repository created.'
    - '2020-2021: README copyright years indicate early MIT-licensed public development.'
    - '2026: v0.32.1 release published on GitHub.'
  usage:
    - >
      Typical use starts with `mani init` in a directory containing Git repositories,
      which generates a `mani.yaml` inventory. Users then run commands such as listing
      projects or executing `git status` across all projects, optionally in parallel and
      with tabular output.
related-packages:
  - id: brew:gita
    reason: >
      Choose Gita when you primarily want side-by-side Git status and direct batch
      delegation of Git commands, without mani's broader YAML task and synchronization
      model.
    rel: alternative
    sources:
      - https://manicli.com/project-background/
      - https://github.com/nosarthur/gita
  - id: brew:repo
    reason: >
      Choose Repo for manifest-driven collections such as Android source trees, where a
      dedicated manifest controls coordinated checkout and synchronization across many
      Git repositories.
    rel: alternative
    sources:
      - https://manicli.com/project-background/
      - https://source.android.com/docs/setup/reference/repo
category: developer-tools
package-manager:
  brew: mani
  macports: mani
  nix: mani
package-manager-url: https://formulae.brew.sh/formula/mani
license: MIT
tags:
  - automation
  - cli
  - git
  - multi-repo
  - repository-management
description: CLI tool to help you manage repositories
executables:
  - mani
provenance:
  formula: mani
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
