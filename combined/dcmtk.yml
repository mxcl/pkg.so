id: brew:dcmtk
display-name: DCMTK
homepage: https://dcmtk.org/en/dcmtk/
repo: https://github.com/DCMTK/dcmtk
docs:
  - https://support.dcmtk.org/docs
  - https://support.dcmtk.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The early European CTN software was extended through 1994 and 1995 for EuroPACS,
      ECR, and CAR demonstrations. In 1996 the software was rewritten around a new C++
      DICOM encoding/decoding library, gained modality worklist support, and was renamed
      DCMTK beginning with release 3.0.
  package-nerd-significance:
    - >
      DCMTK is one of the canonical open-source DICOM toolkits in Unix package
      collections. Package nerds care because installing one package exposes a deep
      medical-imaging toolbox: networking tools, image converters, structured reporting
      tools, DICOMDIR support, compression modules, and reusable C++ libraries.
  project-history:
    - >
      The official HISTORY file traces DCMTK back to a 1993 DICOM implementation
      developed by OFFIS and Oldenburg University with CERIUM support for an RSNA'93
      demonstration. It began with an early DICOM Upper Layer Protocol facility from the
      Mallinckrodt Institute of Radiology, with the rest developed independently and
      demonstrated interoperating with about 20 vendor implementations.
  related-projects:
    - >
      The official history names European CTN as the direct predecessor. The README also
      points to commercial OFFIS expansion modules that build on the freely available
      toolkit.
  sources:
    - https://support.dcmtk.org/docs/
    - https://raw.githubusercontent.com/DCMTK/dcmtk/master/README
    - https://raw.githubusercontent.com/DCMTK/dcmtk/master/HISTORY
    - https://api.github.com/repos/DCMTK/dcmtk
  summary:
    - >
      DCMTK is the OFFIS DICOM Toolkit: a C++ toolkit and suite of command-line
      applications implementing parts of the DICOM/MEDICOM standard. The official
      documentation describes source code, documentation, installation instructions,
      libraries, and applications for DICOM data handling.
  timeline:
    - "1993: OFFIS/Oldenburg/CERIUM DICOM implementation demonstrated at RSNA'93."
    - >
      1994-1995: European CTN software extended and used in DICOM demonstrations at
      EuroPACS, ECR, and CAR.
    - >
      1996: Software rewritten around a new C++ DICOM library and renamed DCMTK with
      release 3.0.
    - '1997: DICOMDIR creation tool added for demonstration CDs.'
    - >
      1998-2001: Image rendering, display calibration, GSPS, print management, TLS,
      digital signatures, and structured reporting support added.
  usage:
    - >
      As a package, DCMTK is both a library stack and a large CLI toolbox: users get
      utilities for dumping, converting, sending, receiving, querying, storing, signing,
      compressing, and transforming DICOM objects. The Homebrew input lists dozens of
      installed executables, which matches the official documentation's multi-subpackage
      toolkit layout.
related-packages:
  - id: brew:dcm2niix
    reason: >
      Choose dcm2niix when DCMTK-managed or inspected DICOM studies need to be converted
      specifically into NIfTI images and BIDS metadata for neuroimaging research.
    rel: adjacent_workflow
    sources:
      - https://dcmtk.org/en/dcmtk/
      - https://github.com/rordenlab/dcm2niix/blob/master/docs/source/dcm2niix.rst
