history:
  adoption-history:
    - >
      Crest is distributed directly by its developer and through Homebrew Cask. Its
      official site presents it as a consumer macOS utility with a free tier and a paid
      Pro tier rather than as an open-source project.
    - >
      The official site publishes customer reviews and team licensing, but it does not
      provide enough evidence to characterize broad adoption quantitatively.
  package-nerd-significance:
    - >
      Crest represents the modern Homebrew Cask pattern of packaging a signed,
      notarized, self-updating proprietary macOS application. It also illustrates how
      desktop utilities increasingly integrate with command-line coding agents while
      retaining a native GUI distribution model.
  project-history:
    - >
      Crest is a native macOS notch utility created by independent developer Zakaria
      Swaidan. Its published changelog records active releases from at least June 2026.
    - >
      Crest 6, released in September 2026, redesigned the notch interface around
      customizable pages and widgets and added interactions for Claude Code, Codex, and
      GitHub Copilot CLI. The product later became part of a three-app suite with Take
      and Minutes.
  related-projects:
    - 'Take: the companion screen-recording application in the Crest suite.'
    - "Minutes: the suite's on-device meeting-notes application."
    - >
      Claude Code, Codex, and GitHub Copilot CLI: coding agents whose approval prompts
      and status can appear in Crest.
  sources:
    - https://crestnotch.app/
    - https://crestnotch.app/changelog
    - https://crestnotch.app/support
    - source_facts.description
  summary:
    - >
      Crest is a native macOS productivity utility that turns the MacBook notch, or a
      top-of-screen pill on other displays, into a configurable control surface for
      media, files, calendars, system information, and coding agents.
  timeline:
    - >
      2026-06-25: Crest's published changelog records the 3.3 release line with six new
      utility modules.
    - >
      2026-09-30: Crest 6.0.0 introduces a redesigned page-and-widget interface and
      coding-agent prompts in the notch.
    - '2026-10-07: Version 6.4.1 improves idle energy use and Shelf file handling.'
  usage:
    - >
      Users open Crest from the display notch or top-of-screen pill and arrange widgets
      for media, calendar events, reminders, notes, files, clipboard history, weather,
      system status, and focus tools.
    - >
      Optional integrations surface questions and command approvals from supported
      coding agents. Crest's free tier does not require an account; starting a Pro trial
      or unlocking a purchase requires signing in, but the official documentation does
      not publish a credentials-file location.
