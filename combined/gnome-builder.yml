id: brew:gnome-builder
display-name: Builder
homepage: https://apps.gnome.org/Builder/
repo: https://gitlab.gnome.org/GNOME/gnome-builder
docs:
  - https://builder.readthedocs.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Builder became the practical successor to older GNOME development tools such as
      Anjuta for many contributors. Its significance comes less from general IDE market
      share and more from being aligned with GNOME's release cadence, Human Interface
      Guidelines, GTK stack, Flatpak packaging model, and contributor onboarding.
  package-nerd-significance:
    - >
      Builder matters to package nerds because it packages an opinionated
      desktop-development environment around the same primitives used by GNOME
      maintainers: Meson, Flatpak manifests, GitLab-hosted projects, GTK, GLib, and
      GNOME documentation. Installing Builder is often the shortest route from a
      distribution workstation to a reproducible GNOME app build.
  project-history:
    - >
      Builder was started by Christian Hergert as an IDE focused on GNOME application
      development and was crowdfunded through the 'Builder, An IDE of our GNOME'
      Indiegogo campaign. The first GNOME 3.16-era release announcement describes
      Builder and LibIDE as a shared foundation for auto-completion, indentation, build
      systems, version control, diagnostics, symbols, search, snippets, devices, and
      documentation.
    - >
      As GNOME application development moved toward Flatpak, Meson, GTK 4, libadwaita,
      language servers, and sandboxed runtimes, Builder evolved from a GNOME-specific
      code editor into a workbench for the whole GNOME app lifecycle. Its GNOME wiki
      page highlights global search, auto-completion, side-by-side editing, Git
      repository cloning, profiling, and debugging.
  related-projects:
    - >
      Builder is closely related to GTK, GLib, GtkSourceView, Meson, Flatpak, Sysprof,
      Devhelp, GNOME Code Assistance, Anjuta, GNOME GitLab, and libadwaita.
  sources:
    - https://builder.readthedocs.io/
    - https://gitlab.gnome.org/GNOME/gnome-builder
    - https://mail.gnome.org/archives/builder-list/2015-March/msg00006.html
    - https://wiki.gnome.org/Apps/Builder
    - https://www.indiegogo.com/projects/builder-an-ide-of-our-gnome
  summary:
    - >
      GNOME Builder is the GNOME project's integrated development environment for
      writing GNOME-based applications. It combines a GTK source editor with GNOME-aware
      project creation, build, run, profiling, debugging, documentation, Git, and
      Flatpak workflows.
  timeline:
    - '2015-01: Builder crowdfunding campaign runs for GNOME application development.'
    - >
      2015-03-24: GNOME Builder 3.16.0 release announcement describes the initial
      LibIDE-backed preview.
    - >
      2016: Builder gains broader language and workflow support as GNOME app development
      standardizes around the tool.
    - '2022: Builder enters the GNOME 43 development cycle with a GTK 4 port.'
    - "2026: Builder releases continue under GNOME's numbered app release cycle."
  usage:
    - >
      Practitioners use Builder to clone GNOME projects, create app templates, edit C,
      Python, Rust, Vala, and other sources, run Meson builds, inspect documentation,
      debug applications, profile performance with Sysprof integration, and build or run
      Flatpak applications in a GNOME-native interface.
related-packages:
  - id: brew:blueprint-compiler
    reason: >
      Blueprint Compiler is a strong companion for modern GTK 4 projects because its
      official documentation identifies GNOME Builder as providing built-in Blueprint
      language support.
    rel: adjacent_workflow
    sources:
      - https://gnome.pages.gitlab.gnome.org/blueprint-compiler/
      - https://builder.readthedocs.io/
  - id: brew:meson
    reason: >
      Meson complements Builder as a directly supported build system and is the build
      format used by GNOME's introductory Builder project workflow.
    rel: adjacent_workflow
    sources:
      - https://apps.gnome.org/Builder/
      - https://mesonbuild.com/
  - id: brew:sysprof
    reason: >
      Sysprof complements Builder when profiling GNOME applications because Builder
      exposes an integrated native profiler and GNOME documents Sysprof as its
      system-wide profiling tool.
    rel: adjacent_workflow
    sources:
      - https://apps.gnome.org/Builder/
      - https://developer.gnome.org/documentation/tools/sysprof.html
category: developer-tools
