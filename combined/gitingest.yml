id: brew:gitingest
display-name: Gitingest
homepage: https://gitingest.com
repo: https://github.com/coderamp-labs/gitingest
docs:
  - https://gitingest.com/docs
  - https://github.com/coderamp-labs/gitingest#readme
config-file-location:
  unix: .gitingestignore
credentials-file-location: null
history:
  adoption-history:
    - >
      Gitingest's adoption is tied to the rise of LLM-assisted development, where
      developers often need compact repository context that can be pasted into a model
      or passed to an agent. Its repository metadata and badges show distribution
      through PyPI, Homebrew, browser extension stores, and a public website, which
      helped it reach both terminal users and browser-first users.
    - >
      The repository metadata collected for this enrichment on July 1, 2026 reported
      14,992 GitHub stars, making it one of the more visible package-manager entries in
      this batch despite its recent origin.
  package-nerd-significance:
    - >
      Gitingest is package-nerd significant because it packages an LLM-era workflow as a
      normal CLI with PyPI and Homebrew distribution. It turns repository structure into
      a portable text artifact, which fits shell pipelines, prompt assembly, and agent
      tooling without requiring a full IDE integration.
  project-history:
    - >
      The repository was created in November 2024 by coderamp-labs. The project grew
      around the convention of replacing `hub` with `ingest` in a GitHub URL, while also
      offering a `gitingest` command and Python API for local or scripted use.
    - >
      The README presents Gitingest as more than a command: it links the hosted
      gitingest.com service, browser extensions, a PyPI package, Docker self-hosting,
      and Python synchronous and asynchronous APIs. Releases in 2025 show the project
      moving through early 0.x versions as the LLM code-context use case matured.
  related-projects:
    - >
      Related surfaces include PyPI, gitingest.com, browser extensions for Chromium and
      Firefox-derived browsers, GitHub personal access tokens, and LLM tooling that
      consumes repository context.
  sources:
    - https://api.github.com/repos/coderamp-labs/gitingest
    - https://github.com/coderamp-labs/gitingest
    - https://github.com/coderamp-labs/gitingest/releases/tag/v0.3.1
    - https://pypi.org/project/gitingest/
    - https://pypi.org/pypi/gitingest/json
    - https://raw.githubusercontent.com/coderamp-labs/gitingest/main/README.md
  summary:
    - >
      Gitingest is a Python-based CLI, web service, and importable package that converts
      Git repositories or local directories into prompt-friendly text digests for large
      language model workflows. Its central idea is deliberately simple: turn codebases
      into structured context containing a tree, selected file contents, size data, and
      token counts.
  timeline:
    - '2024: Repository created by coderamp-labs.'
    - '2025: Early 0.x releases published on GitHub.'
    - >
      2025: README documented CLI, Python package, browser extension, and self-hosted
      server usage.
    - >
      2026: Repository metadata collected for this enrichment reported broad GitHub
      visibility.
  usage:
    - >
      Practitioners run `gitingest /path/to/directory` or `gitingest
      https://github.com/owner/repo` to write a digest file, use `--output -` to stream
      output to standard output, or import `ingest` and `ingest_async` from Python. For
      private repositories, the README documents a token argument and `GITHUB_TOKEN`
      environment variable.
related-packages:
  - id: brew:repomix
    reason: >
      Choose Repomix when you want configurable XML, Markdown, JSON, or plain-text
      output, token-aware compression, security checks, or direct MCP integration in
      addition to repository packing.
    rel: alternative
    sources:
      - https://gitingest.com/docs
      - https://repomix.com/guide/
      - https://github.com/yamadashy/repomix
