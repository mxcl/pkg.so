id: brew:dynein
display-name: dynein
homepage: https://github.com/awslabs/dynein
repo: https://github.com/awslabs/dynein
docs:
  - https://github.com/awslabs/dynein
config-file-location:
  unix:
    - ~/.dynein/config.yml
    - ~/.aws/config
credentials-file-location:
  unix: ~/.aws/credentials
history:
  adoption-history:
    - >
      dynein has stayed a focused AWS developer tool rather than a broad database
      client. Its adoption path is through GitHub releases, Homebrew, and source builds,
      aimed at users who already work with DynamoDB and AWS credentials but want a
      concise shell workflow.
  package-nerd-significance:
    - >
      dynein is interesting as a single-purpose cloud database CLI from the AWS Labs
      ecosystem. It overlaps with `aws dynamodb` but optimizes the interactive developer
      loop: shorter commands, table context, shell completion, JSON ergonomics, and
      Homebrew installation.
  project-history:
    - >
      The awslabs/dynein repository was created in 2020. Its README describes dynein as
      a terminal-first DynamoDB CLI designed to reduce typing, use standard JSON instead
      of DynamoDB JSON where possible, and provide table context switching through
      commands such as `dy use` and `dy config`.
  related-projects:
    - >
      Related projects include Amazon DynamoDB, AWS CLI, DynamoDB Local, aws-sdk-rust,
      CloudFormation, and other database-specific CLIs that trade general cloud coverage
      for faster daily table and item operations.
  sources:
    - https://github.com/awslabs/dynein#readme
    - https://api.github.com/repos/awslabs/dynein
    - https://formulae.brew.sh/formula/dynein
    - https://aws.amazon.com/dynamodb/
    - https://aws.amazon.com/cli/
  summary:
    - >
      dynein is an AWS Labs command-line interface for Amazon DynamoDB, written in Rust
      and shipped as the `dy` executable.
  timeline:
    - '2020: awslabs/dynein repository is created.'
    - >
      2020s: README documents binary downloads, Homebrew installation, source builds,
      AWS credential prerequisites, and DynamoDB Local support.
    - '2026: Homebrew packages dynein 0.3.0 as the `dy` executable.'
  usage:
    - >
      Users configure normal AWS credentials, then run `dy ls`, `dy scan`, `dy get`, `dy
      query`, `dy put`, `dy upd`, `dy del`, import/export commands, backup/restore
      commands, and DynamoDB Local workflows. The README states that dynein stores local
      config under `$HOME/.dynein/` and uses AWS credential sources such as
      `~/.aws/credentials`, environment variables, profiles, and instance roles.
related-packages:
  - id: brew:awscli
    reason: >
      AWS CLI configures and verifies the same AWS credential environment that dynein
      uses, and dynein's official README recommends testing it with `aws dynamodb
      list-tables`.
    rel: adjacent_workflow
    sources:
      - https://github.com/awslabs/dynein#readme
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
category: data
package-manager:
  brew: dynein
  nix: dynein
package-manager-url: https://formulae.brew.sh/formula/dynein
license: Apache-2.0
tags:
  - aws
  - cli
  - database
  - dynamodb
  - nosql
  - rust
description: DynamoDB CLI
executables:
  - dy
provenance:
  formula: dynein
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
