id: brew:kotofetch
display-name: kotofetch
homepage: https://github.com/hxpe-dev/kotofetch
repo: https://github.com/hxpe-dev/kotofetch
docs:
  - https://github.com/hxpe-dev/kotofetch#readme
config-file-location:
  linux: ~/.config/kotofetch/config.toml
  macos: ~/Library/Application Support/kotofetch/config.toml
  windows: '%APPDATA%\kotofetch\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Arch AUR, Nix or NixOS builds, prebuilt
      binaries, and source builds, which points to adoption among terminal customization
      and Japanese-learning users.
    - >
      The project README includes a community showcase and GitHub topics around fetch
      tools, terminal, command-line, Japanese, and desktop rice communities.
  package-nerd-significance:
    - >
      kotofetch belongs to the terminal-fetch and desktop-customization package family:
      small, aesthetic CLIs that are easy to package and often spread through
      screenshots and dotfiles.
    - >
      Its packaging surface is more involved than the tool's simple output suggests
      because it ships release artifacts for several platforms and supports config
      files, custom quote files, Nix builds, and AUR installation.
  project-history:
    - >
      The official README describes kotofetch as a small, configurable CLI with built-in
      quotes and user customization for padding, width, translation display, and text
      styles.
    - >
      The project is implemented primarily in Rust, uses Cargo, and publishes Linux,
      Windows, and macOS release artifacts from the GitHub repository.
    - >
      The latest official release at research time was v0.2.22, published on 2026-05-05,
      adding animations and shell autocompletion and fixing help comments.
  related-projects:
    - Anki and AnkiConnect are optional integrations for importing decks.
    - >
      Other fetch-style terminal tools are adjacent in usage culture, though kotofetch
      focuses on Japanese quotes rather than system information.
  sources:
    - https://api.github.com/repos/hxpe-dev/kotofetch/releases/latest
    - https://github.com/hxpe-dev/kotofetch#readme
    - https://raw.githubusercontent.com/hxpe-dev/kotofetch/main/CHANGELOG.md
  summary:
    - >
      kotofetch is a Rust command-line tool that displays Japanese quotes in the
      terminal with configurable layout, translations, colors, quote sources, and
      animations.
  timeline:
    - '2026: v0.2.19 added Anki deck import, furigana display, and new built-in quotes.'
    - '2026: v0.2.21 added multiple translation display and a furigana position option.'
    - '2026: v0.2.22 added animations and shell autocompletion.'
  usage:
    - >
      Users run kotofetch to display a quote using configuration defaults or override
      translation modes, furigana position, padding, selected quote modes, animation
      type, and animation duration from the command line.
    - >
      Users can add custom quote TOML files, import Anki decks through AnkiConnect, and
      generate shell completion scripts.
related-packages:
  - id: cask:anki
    reason: >
      Use Anki desktop with the AnkiConnect add-on when `kotofetch init anki` should
      turn a flashcard deck into a local Japanese quote collection.
    rel: adjacent_workflow
    sources:
      - https://github.com/hxpe-dev/kotofetch#readme
      - https://docs.ankiweb.net/
category: toys
package-manager:
  brew: kotofetch
  nix: kotofetch
package-manager-url: https://formulae.brew.sh/formula/kotofetch
license: MIT
tags:
  - cli
  - japanese
  - quotes
  - rust
  - terminal
description: Small, configurable CLI that displays Japanese quotes in the terminal
executables:
  - kotofetch
provenance:
  formula: kotofetch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
