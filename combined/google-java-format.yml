id: brew:google-java-format
display-name: google-java-format
homepage: https://github.com/google/google-java-format
repo: https://github.com/google/google-java-format
docs:
  - https://github.com/google/google-java-format#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption grew through the Java tooling ecosystem because the formatter is
      intentionally prescriptive. The official README lists third-party integrations for
      Visual Studio Code, Gradle, Maven, SBT, and GitHub Actions, showing how package
      maintainers and build-tool authors wrapped the same formatter for their own
      workflows.
    - >
      Package-manager adoption followed the CLI packaging model: Homebrew, MacPorts,
      Nix, and Scoop package the formatter so users can run `google-java-format` or
      `google-java-format-diff` without hand-managing the release jar.
  package-nerd-significance:
    - >
      google-java-format matters to package nerds because it packages a style guide as
      executable policy. It is a canonical example of a formatter with almost no
      bikeshed surface: installation, editor integration, and CI wiring matter more than
      local configuration.
    - >
      It also sits at the intersection of Java release engineering and package
      distribution: jars, native binaries, IDE plugins, Maven artifacts, and OS
      package-manager formulae all expose the same opinionated formatting behavior.
  project-history:
    - >
      Google opened the GitHub repository in May 2015 and published a 0.1 Alpha release
      in November 2015. The 1.0 release followed in April 2016, establishing the
      formatter as a packaged tool rather than only an internal style convention.
    - >
      The README describes several integration surfaces around the same formatter
      engine: a command-line jar or native binary, a diff-oriented helper script,
      JetBrains and Eclipse plugins, and use as a Java library from Maven or Gradle
      builds. That shape made the project useful both for individual developer machines
      and for automated formatting checks.
  related-projects:
    - >
      The README points to Google Java Style, the IntelliJ and Eclipse plugins,
      google-java-format-diff, Spotless Gradle and Maven integrations, fmt-maven-plugin,
      sbt-java-formatter, and GitHub Actions wrappers.
  sources:
    - https://api.github.com/repos/google/google-java-format
    - https://github.com/google/google-java-format
    - https://github.com/google/google-java-format#readme
    - https://github.com/google/google-java-format/releases
  summary:
    - >
      google-java-format is Google's command-line and library implementation of the
      Google Java Style formatter. The project deliberately avoids user-configurable
      formatting rules so Java code can be normalized to one Google style across
      editors, builds, and scripts.
  timeline:
    - '2015: GitHub repository created under google/google-java-format.'
    - '2015: 0.1 Alpha published on GitHub Releases.'
    - '2016: 1.0 release published on GitHub Releases.'
    - >
      2017: 1.x releases added a steady release cadence for package managers and editor
      integrations.
    - >
      2021: JDK strong encapsulation made the documented `--add-exports` flags important
      for plugin and library users.
  usage:
    - >
      The common package-manager use is formatting whole Java files from the shell,
      rewriting files in place with `--replace`, checking changed lines with the diff
      helper, or enforcing style in CI with a nonzero exit when files differ. The
      library mode supports code generators and build tools that need formatted Java
      output.
    - >
      The formatter depends on javac internals through the `jdk.compiler` module, so
      editor and library integrations document extra JVM export flags on strongly
      encapsulated JDKs.
related-packages:
  - id: brew:checkstyle
    reason: >
      Use Checkstyle alongside google-java-format when a project must enforce broader
      Google Java Style rules that extend beyond automatically rewriting layout and
      imports.
    rel: adjacent_workflow
    sources:
      - https://github.com/google/google-java-format
      - https://checkstyle.org/google-style.html
      - https://checkstyle.org/checks.html
  - id: brew:ktfmt
    reason: >
      Use ktfmt as the corresponding opinionated formatter for Kotlin sources in a mixed
      Java/Kotlin repository that already formats Java with google-java-format.
    rel: adjacent_workflow
    sources:
      - https://github.com/google/google-java-format
      - https://github.com/facebook/ktfmt
category: developer-tools
package-manager:
  brew: google-java-format
  macports: google-java-format
  nix: google-java-format
  scoop: extras/google-java-format
package-manager-url: https://formulae.brew.sh/formula/google-java-format
license: Apache-2.0
tags:
  - cli
  - code-quality
  - formatter
  - google-java-style
  - java
description: Reformats Java source code to comply with Google Java Style
executables:
  - google-java-format
  - google-java-format-diff
provenance:
  formula: google-java-format
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
