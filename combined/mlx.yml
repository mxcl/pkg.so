id: brew:mlx
display-name: MLX
homepage: https://ml-explore.github.io/mlx/build/html/index.html
repo: https://github.com/ml-explore/mlx
docs:
  - https://ml-explore.github.io/mlx/build/html/index.html
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      Technically, MLX sits in the NumPy, PyTorch, JAX, and ArrayFire family rather than
      being only a model runner. Its README emphasizes familiar NumPy-like APIs, C, C++,
      and Swift bindings, PyTorch-like higher-level neural-network and optimizer
      packages, composable transformations for automatic differentiation and
      vectorization, lazy computation, dynamic graph construction, CPU/GPU execution,
      and unified memory so arrays can be operated on across supported devices without
      explicit transfers.
  sources:
    - https://formulae.brew.sh/formula/mlx
    - https://github.com/ml-explore/mlx
    - https://github.com/ml-explore/mlx-examples
    - https://lmstudio.ai/blog/lmstudio-v0.3.4
    - https://ml-explore.github.io/mlx/build/html/usage/unified_memory.html
    - https://opensource.apple.com/projects/mlx
  summary:
    - >
      MLX is Apple's open source array framework for machine learning on Apple silicon.
      The project is published under the ml-explore organization and is described by
      Apple and the upstream README as an array framework optimized for Apple silicon
      and its unified memory architecture. The MLX examples citation credits the initial
      software suite to Awni Hannun, Jagrit Digani, Angelos Katharopoulos, and Ronan
      Collobert, with a 2023 citation entry.
  usage:
    - >
      The framework quickly became the base layer for a cluster of Apple-silicon ML
      tools: MLX LM for language models, MLX examples for reference implementations
      across text, image, audio, video, and multimodal models, and community-converted
      model weights on Hugging Face. LM Studio also shipped an MLX engine for on-device
      LLM use on Apple-silicon Macs. In package managers, the `mlx` package is the
      foundation dependency; users install higher-level packages such as `mlx-lm` when
      they want complete model workflows.
related-packages:
  - id: brew:mlx-lm
    reason: >
      Choose MLX LM when you want ready-made generation, conversion, quantization,
      fine-tuning, and serving workflows built on the lower-level MLX framework.
    rel: adjacent_workflow
    sources:
      - https://github.com/ml-explore/mlx-lm
      - https://github.com/ml-explore/mlx
category: ai
package-manager:
  brew: mlx
  macports: mlx
package-manager-url: https://formulae.brew.sh/formula/mlx
license: MIT AND Apache-2.0
