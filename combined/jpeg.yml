credentials-file-location: null
history:
  adoption-history:
    - >
      IJG libjpeg spread because it gave Unix, desktop, and embedded software a
      royalty-free way to read and write JPEG files. Package managers expose both the
      library and its small CLI utilities, making it a dependency of image viewers,
      converters, web tooling, and batch-processing scripts.
    - >
      The 6b ABI became especially important in distribution culture because many
      downstream projects and alternative implementations, including libjpeg-turbo and
      mozjpeg-compatible builds, preserved or targeted that interface.
  package-nerd-significance:
    - >
      For package maintainers, IJG JPEG is a canonical example of a tiny-looking formula
      that underpins a huge dependency graph. Its ABI history explains why distributions
      often care about which JPEG implementation satisfies `libjpeg` and why
      compatibility with IJG behavior still matters decades after the format became
      ordinary.
  project-history:
    - >
      IJG's package grew around a portable C implementation of the JPEG standard, plus
      command-line tools such as `cjpeg`, `djpeg`, `jpegtran`, `rdjpgcom`, and
      `wrjpgcom`. Its README emphasizes portability, flexibility, and
      industrial-strength reuse rather than tutorial code, which explains why libjpeg
      became infrastructure rather than just a sample implementation.
    - >
      The package also became a baseline for later JPEG implementations and forks.
      libjpeg-turbo maintains a reference repository of IJG code for comparison and
      benchmarking, while the IJG reference site frames libjpeg as the technical basis
      of a media format that remains massively deployed.
  related-projects:
    - >
      Related projects include libjpeg-turbo, mozjpeg, JPEG Club's IJG reference
      material, and the many CLI tools that build on libjpeg-compatible APIs.
  sources:
    - https://github.com/libjpeg-turbo/ijg
    - https://jpegclub.org/reference/
    - https://www.ijg.org/
  summary:
    - >
      The Homebrew `jpeg` formula represents the Independent JPEG Group's libjpeg
      software, one of the classic Unix image libraries behind JPEG encoding, decoding,
      and transformation tools. IJG describes itself as an informal group that writes
      and distributes a widely used free JPEG compression library, with the first
      version released on 7 October 1991.
  timeline:
    - '1991-10-07: IJG released the first version of its JPEG software.'
    - >
      1998-03-27: IJG release 6b established a long-lived compatibility target for
      downstream libraries and tools.
    - >
      2024: The IJG reference site marked JPEG's 33rd anniversary and described ongoing
      libjpeg development.
    - '2026-01-25: IJG release 10 was published.'
  usage:
    - >
      `cjpeg` and `djpeg` convert between JPEG and other image formats, `jpegtran`
      performs lossless transforms and transcoding, and `rdjpgcom`/`wrjpgcom` handle
      textual comments. Developers also link against libjpeg directly when adding JPEG
      support to applications.
related-packages:
  - id: brew:jpeg-turbo
    reason: >
      Choose libjpeg-turbo when you need libjpeg-compatible APIs with SIMD-accelerated
      JPEG encoding and decoding on common CPU architectures.
    rel: alternative
    sources:
      - https://www.ijg.org/
      - https://www.libjpeg-turbo.org/About/TurboJPEG
  - id: brew:mozjpeg
    reason: >
      Choose MozJPEG when compression efficiency and smaller standards-compatible JPEG
      output matter more than staying on the canonical IJG implementation.
    rel: alternative
    sources:
      - https://www.ijg.org/
      - https://github.com/mozilla/mozjpeg
