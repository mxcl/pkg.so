id: brew:scmpuff
display-name: scmpuff
homepage: https://github.com/mroth/scmpuff
repo: https://github.com/mroth/scmpuff
docs:
  - https://github.com/mroth/scmpuff#readme
config-file-location:
  unix:
    - ~/.bash_profile
    - ~/.zshrc
    - ~/.config/fish/config.fish
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents binary installation and Homebrew installation. The
      input also records packages in Homebrew, Nix, and pacman, indicating adoption
      across several Unix-oriented package ecosystems.
  package-nerd-significance:
    - >
      scmpuff represents the package-manager tradition of small, composable command-line
      enhancements: it retains ordinary Git commands while making interactive filename
      selection faster.
  project-history:
    - >
      scmpuff was developed as a minimal reinterpretation of SCM Breeze's core
      numeric-shortcut functionality, emphasizing simplicity, speed, robustness, and
      cross-platform shell support.
  related-projects:
    - Git is the underlying version-control system.
    - SCM Breeze is the project explicitly identified as scmpuff's inspiration.
  sources:
    - 'Official README: https://github.com/mroth/scmpuff#readme'
    - source_facts.package-manager
  summary:
    - >
      scmpuff is a compiled command-line and shell-integration utility that assigns
      numeric shortcuts to files shown in Git status output.
  timeline:
    - 'Public project: Developed on GitHub as a minimal reinterpretation of SCM Breeze.'
    - >
      Current distribution: Official installation instructions include Homebrew and
      downloadable binaries.
  usage:
    - >
      Users initialize scmpuff from Bash, Zsh, or Fish startup configuration, run its
      status wrapper, and substitute displayed numbers or numeric ranges for filenames
      in ordinary Git commands such as add, checkout, and reset.
category: developer-tools
package-manager:
  brew: scmpuff
  nix: scmpuff
  pacman: scmpuff
package-manager-url: https://formulae.brew.sh/formula/scmpuff
license: MIT
tags:
  - cli
  - git
  - shell
  - shortcuts
  - workflow
description: Numeric file selection shortcuts for common git commands
executables:
  - scmpuff
provenance:
  formula: scmpuff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
