id: brew:dfc
display-name: dfc
homepage: https://github.com/Rolinh/dfc
repo: https://github.com/Rolinh/dfc
docs:
  - https://github.com/Rolinh/dfc#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/dfc/dfcrc
    - ~/.config/dfc/dfcrc
    - ~/.dfcrc
credentials-file-location: null
history:
  adoption-history:
    - >
      dfc fits the long Unix tradition of disk-usage status tools, but presents
      filesystem capacity in a more visual terminal format than plain `df`. Its
      package-manager presence is helped by the README's packager notes and tiny
      dependency surface.
  package-nerd-significance:
    - >
      Package maintainers care about dfc because it is boring in the best way: a small C
      utility with standard-library runtime needs, optional gettext translation support,
      and clear install-time knobs for prefix and sysconfdir.
  project-history:
    - >
      The official tag history begins in 2012 with the 1.x series and reaches the 3.x
      series by 2013. The README emphasizes a C/CMake build, minimal runtime
      dependencies, translated configuration files, and packager-friendly installation
      options.
  related-projects:
    - >
      dfc is related to `df`, terminal monitoring utilities, and filesystem
      capacity-reporting tools that trade detailed per-file analysis for quick
      mount-level summaries.
  sources:
    - https://github.com/Rolinh/dfc#readme
    - https://github.com/Rolinh/dfc/tags
  summary:
    - >
      dfc is a small terminal utility for reporting filesystem space usage with color
      and graph-oriented output, plus export formats such as HTML, JSON, and CSV.
  timeline:
    - '2012: v1.0.1 appears in the official tag history.'
    - '2013: v3.0.x releases are tagged.'
    - '2017: v3.1.0 and v3.1.1 are tagged.'
    - '2025: the default branch receives a CMake compatibility fix.'
  usage:
    - >
      Users run `dfc` to inspect mounted filesystem space and can customize behavior
      with a `dfcrc` file under XDG config, `$HOME/.config`, or `$HOME/.dfcrc`.
related-packages:
  - id: brew:duf
    reason: >
      Choose duf for a modern cross-platform `df` replacement with sorting, grouping,
      filtering, and JSON output; choose dfc when its graph-oriented display and HTML or
      CSV exports better fit the workflow.
    rel: alternative
    sources:
      - https://github.com/Rolinh/dfc#readme
      - https://github.com/muesli/duf#readme
category: system
package-manager:
  apk: dfc
  brew: dfc
  debian: dfc
  dnf: dfc
  nix: dfc
  pacman: dfc
  ubuntu: dfc
  zypper: dfc
package-manager-url: https://formulae.brew.sh/formula/dfc
license: BSD-3-Clause
tags:
  - cli
  - disk-usage
  - filesystem
  - monitoring
  - terminal
description: Display graphs and colors of file system space/usage
executables:
  - dfc
provenance:
  formula: dfc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
