id: brew:avro-tools
display-name: Avro Tools
homepage: https://avro.apache.org/
repo: https://github.com/apache/avro
docs:
  - https://avro.apache.org/docs
  - https://avro.apache.org/docs/1.12.0/api/java/org/apache/avro/tool/package-summary.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Avro's adoption is tied to data-platform workflows where schema evolution and
      compact record serialization matter. Apache's project site now explicitly calls
      Avro a leading serialization format for record data and a first choice for
      streaming data pipelines.
    - >
      The avro-tools jar became the everyday operator interface for that ecosystem. Even
      users who do not write Java often keep avro-tools around because it can inspect
      and transform Avro files without having to compile a language binding into a
      one-off program.
  package-nerd-significance:
    - >
      For package nerds, avro-tools is the canonical example of a data-format CLI
      shipped as a Java artifact but consumed like a Unix tool. The formula is less
      about libraries and more about making a jar feel like a normal executable in
      scripts.
    - >
      It also anchors the split packaging story for Avro: avro-tools for the Java CLI,
      avro-c for native C utilities, and avro-cpp for generated C++ bindings, all backed
      by one upstream release stream.
  project-history:
    - >
      Apache Avro's 1.0.0 release was announced in July 2010. The project defined a
      compact binary data format, a JSON-based schema system, object container files,
      and RPC support, then shipped language implementations from a single
      Apache-managed source tree.
    - >
      The tools package grew naturally out of Avro's Java implementation: once a format
      has schemas, container files, IDL, and generated code, it needs a portable
      command-line utility. The Homebrew avro-tools formula packages that Java-oriented
      CLI separately from native C and C++ formulas.
  related-projects:
    - avro-c and avro-cpp package native parts of the same Apache Avro source tree.
    - >
      Apache Avro language bindings and the Avro specification define the data files
      that avro-tools reads and writes.
    - >
      Data platforms that store or stream Avro records often use avro-tools for local
      inspection and pipeline debugging.
  sources:
    - https://avro.apache.org/
    - https://avro.apache.org/blog/2010/07/15/avro-1.0.0/
    - https://avro.apache.org/blog/releases/
    - https://avro.apache.org/docs/
    - https://avro.apache.org/docs/1.12.0/api/java/org/apache/avro/tool/package-summary.html
    - https://github.com/apache/avro
    - source_facts.description
    - source_facts.executables
  summary:
    - >
      Avro Tools is the Java command-line utility package for Apache Avro. It is the
      package users reach for when they want to inspect schemas, convert data, generate
      code, or manipulate Avro object container files from a terminal.
  timeline:
    - '2010: Apache Avro 1.0.0 announced as the first Avro release.'
    - '2021: Avro 1.11.0 released with 120 JIRA issues addressed.'
    - '2024: Avro 1.12.0 released by the Apache Avro community.'
    - '2025: Avro 1.12.1 listed as the latest Apache Avro release.'
  usage:
    - >
      Common avro-tools usage includes printing or validating schemas, converting
      between JSON and Avro container files, compiling schemas or IDL to generated
      language code, and debugging records in data pipelines. Package managers usually
      expose this as an avro-tools command wrapping the upstream jar.
    - >
      Avro Tools has no documented per-user config file or credential file. Inputs are
      schemas, Avro files, IDL/protocol files, and command-line options.
related-packages:
  - id: brew:avro-c
    reason: >
      Pair Avro Tools with Avro C when a native C application needs the Avro library
      while operators still want the broader Java CLI for inspection, conversion,
      compilation, or repair.
    rel: adjacent_workflow
    sources:
      - https://avro.apache.org/docs/1.12.0/api/java/org/apache/avro/tool/package-summary.html
      - https://avro.apache.org/docs/1.8.0/api/c/index.html
  - id: brew:avro-cpp
    reason: >
      Pair Avro Tools with Avro C++ when an application uses generated C++ records but
      developers also need the Java CLI's file inspection, conversion, metadata, and
      repair commands.
    rel: adjacent_workflow
    sources:
      - https://avro.apache.org/docs/1.12.0/api/java/org/apache/avro/tool/package-summary.html
      - https://avro.apache.org/docs/1.12.0/api/cpp/html/index.html
category: data
