id: brew:greenmask
display-name: Greenmask
homepage: https://www.greenmask.io/
repo: https://github.com/GreenmaskIO/greenmask
docs:
  - https://docs.greenmask.io/
config-file-location:
  unix: config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Greenmask entered package-manager culture as a CLI for teams that need repeatable
      sanitized databases for staging, analytics, and development. The batch package
      facts show Homebrew and Nix packaging, while upstream distributes release assets,
      Docker-oriented workflows, and documentation that emphasizes CI/CD integration.
  package-nerd-significance:
    - >
      Greenmask matters to package users because it packages a messy operational
      workflow into one repeatable binary: masked dumps, synthetic data, subsetting,
      restore order, and storage backends. That makes it attractive for development
      environments where production-like data is useful but raw production data is
      unsafe.
    - >
      For Homebrew-style packaging, it is also a representative modern Go CLI: single
      binary, release assets, Docker examples, and docs-first operational commands.
  project-history:
    - >
      The project presents itself as a stateless logical dump proxy that does not
      require database schema changes and remains compatible with familiar PostgreSQL
      tools such as pg_restore. That design places it closer to backup and staging-data
      infrastructure than to an application-level masking library.
    - >
      The v0.1.0 release notes describe the January 2024 release as the first
      production-ready version, with CI/CD, a Docker Compose playground, transformer
      improvements, JSON-line protocol fixes, and binary assets. The v0.2.0 release
      notes describe an October 2024 milestone focused on database subsetting, pgzip
      compression, topological restore order, INSERT-format restoration, dynamic
      transformer parameters, and transformer-engine refactoring.
  related-projects:
    - >
      PostgreSQL pg_dump and pg_restore are central compatibility references in the
      documentation.
    - >
      Docker Compose, MinIO, and S3-compatible storage appear in the official examples
      and feature descriptions.
    - >
      Transformer concepts such as random, hash, template, and CMD transformers form the
      project's internal extension surface.
  sources:
    - https://api.github.com/repos/GreenmaskIO/greenmask/releases?per_page=100
    - https://docs.greenmask.io/v0.2.21/
    - https://docs.greenmask.io/v0.2.21/release_notes/greenmask_0_1_0/
    - https://docs.greenmask.io/v0.2.21/release_notes/greenmask_0_2_0/
    - https://github.com/GreenmaskIO/greenmask
  summary:
    - >
      Greenmask is an open-source database dump, anonymization, synthetic-data
      generation, and restore tool aimed at PostgreSQL workflows, with MySQL work
      represented in the project materials as a developing area. Its history is short
      but well documented through official release notes and GitHub releases.
  timeline:
    - '2024: v0.1.0 release notes marked the first production-ready version.'
    - >
      2024: v0.2.0 added database subsetting, pgzip support, topological restore order,
      and transformer refactoring.
    - '2025: v1.0.0b1 release metadata appeared for the 1.0 beta line.'
    - '2026: v0.2.x releases continued through v0.2.21 in the official GitHub release feed.'
  usage:
    - >
      Greenmask is used around logical backup and restore flows: dump a database, apply
      transformations or subsets, store the result locally or in S3-compatible storage,
      and restore into another environment. The documentation emphasizes deterministic
      transformers, dynamic parameters, validation output, schema diff checks, and
      compatibility with PostgreSQL dump/restore routines.
    - >
      The default configuration convention in the batch curation is config.yml, matching
      the project's example configuration style.
related-packages:
  - id: brew:pgsync
    reason: >
      Choose pgsync for direct, selective PostgreSQL-to-PostgreSQL copying with simple
      server-side data rules; choose Greenmask for reusable logical dumps, richer
      transformers, subsetting, validation, and later restoration.
    rel: alternative
    sources:
      - https://www.greenmask.io/docs/greenmask
      - https://github.com/ankane/pgsync#readme
category: data
package-manager:
  brew: greenmask
  nix: greenmask
package-manager-url: https://formulae.brew.sh/formula/greenmask
license: Apache-2.0
