id: brew:dbus
display-name: D-Bus
homepage: https://wiki.freedesktop.org/www/Software/dbus
repo: https://gitlab.freedesktop.org/dbus/dbus
docs:
  - https://dbus.freedesktop.org/doc/api/html
  - https://dbus.freedesktop.org/doc/dbus-specification.html
  - https://www.freedesktop.org/wiki/Software/dbus
config-file-location:
  unix:
    - /usr/share/dbus-1/system.conf
    - /usr/share/dbus-1/session.conf
    - /etc/dbus-1/system.d
    - /etc/dbus-1/session.d
credentials-file-location: null
history:
  adoption-history:
    - >
      freedesktop.org describes dbus as the reference implementation and says released
      versions are available in all major Linux distributions. The project page also
      notes that D-Bus was heavily tested in real-world use over several years before
      being treated as set in stone.
  package-nerd-significance:
    - >
      As a package, dbus sits near the base of the modern Linux desktop graph: many GUI,
      service, policy, and session components do not expose D-Bus directly to users, but
      they rely on its daemon, activation files, bus names, and language bindings.
  project-history:
    - >
      The D-Bus specification credits authors from Red Hat, CodeFactory, Imendio,
      Collabora, and others, and its first released document was revision 0.8 in
      September 2003. The protocol was declared frozen for compatible extension in
      November 2006, making later changes conservative and versioned.
  related-projects:
    - >
      Related projects include libdbus, dbus-daemon, dbus-glib, GDBus, QtDBus, sd-bus,
      and language bindings for Python, Ruby, Go, Rust, and other ecosystems.
  sources:
    - https://dbus.freedesktop.org/doc/dbus-specification.html
    - https://www.freedesktop.org/wiki/Software/dbus/
    - https://www.freedesktop.org/wiki/Software/DBusBindings/
  summary:
    - >
      D-Bus is the freedesktop.org message bus system and reference implementation for
      low-overhead local IPC, providing both a protocol and the dbus-daemon used by Unix
      desktop and system services.
  timeline:
    - '2003: D-Bus specification revision 0.8 is the first released document.'
    - '2006: D-Bus protocol is frozen for compatible extensions.'
    - >
      2024: Specification revision 0.43 documents more modern interfaces and
      service-loading guidance.
    - >
      2026: freedesktop.org lists dbus 1.16.x as the stable branch and 1.14.x as a
      legacy branch supported for security fixes until mid-2026.
  usage:
    - >
      D-Bus supplies a system bus for events such as hardware or printer changes and a
      per-login-session bus for desktop IPC. The package also ships tools such as
      dbus-daemon, dbus-send, dbus-monitor, dbus-run-session, and dbus-uuidgen for
      debugging and service integration.
related-packages:
  - id: brew:dbus-glib
    reason: >
      Use dbus-glib only when building or maintaining older GLib software that depends
      on its legacy D-Bus binding and dbus-binding-tool generator.
    rel: adjacent_workflow
    sources:
      - https://dbus.freedesktop.org/doc/dbus-glib/ch01.html
      - https://dbus.freedesktop.org/doc/dbus-glib/dbus-binding-tool.html
  - id: brew:glib
    reason: >
      GLib supplies GDBus in GIO, the recommended modern API for GLib applications that
      communicate through a D-Bus message bus.
    rel: adjacent_workflow
    sources:
      - https://dbus.freedesktop.org/doc/dbus-glib/ch01.html
      - https://docs.gtk.org/gio/class.DBusConnection.html
category: system
package-manager:
  apk: dbus
  brew: dbus
  debian: dbus
  dnf: dbus
  macports: dbus
  nix: dbus
  pacman: dbus
  ubuntu: dbus
  zypper: dbus-1-daemon
package-manager-url: https://formulae.brew.sh/formula/dbus
license: AFL-2.1 OR GPL-2.0-or-later
tags:
  - cli
  - daemon
  - desktop
  - ipc
  - message-bus
  - system-service
description: Message bus system, providing inter-application communication
executables:
  - dbus-cleanup-sockets
  - dbus-daemon
  - dbus-launch
  - dbus-monitor
  - dbus-run-session
  - dbus-send
  - dbus-test-tool
  - dbus-update-activation-environment
  - dbus-uuidgen
provenance:
  formula: dbus
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
