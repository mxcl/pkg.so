id: brew:tele
display-name: tele
homepage: https://github.com/sorokin-vladimir/tele
repo: https://github.com/sorokin-vladimir/tele
docs:
  - https://github.com/sorokin-vladimir/tele/blob/main/docs/keybindings.md
  - https://github.com/sorokin-vladimir/tele#readme
config-file-location:
  unix: ~/.config/tele/config.yml
  windows: '%USERPROFILE%\.config\tele\config.yml'
credentials-file-location:
  unix:
    - $XDG_STATE_HOME/tele
    - ~/.local/state/tele
  windows: '%USERPROFILE%\.local\state\tele'
history:
  adoption-history:
    - >
      The project offers binaries and installation paths for Unix-like systems and
      Windows, including Homebrew, APT-compatible repositories, RPM-family repositories,
      Alpine, AUR, Snap, Scoop, winget, Nix, and release downloads. A separate Homebrew
      beta package permits stable and prerelease installations to coexist.
    - >
      The README describes the client as usable for daily messaging while still under
      active development, with some Telegram features intentionally absent or
      incomplete.
  package-nerd-significance:
    - >
      tele packages a GUI-dominated service as a single, keyboard-first terminal
      program. Its broad packaging matrix, static Go implementation, SSH-friendly
      interface, XDG-aware state layout, and separate beta channel make it especially
      interesting to terminal and package-manager enthusiasts.
  project-history:
    - >
      tele was developed in Go as a terminal-native Telegram client for keyboard-driven
      workflows. Its interface draws on Vim-style navigation and the interaction
      patterns of tools such as lazygit.
    - >
      During 2026 the project rapidly added drafts, forwarding, downloads, reactions,
      mouse support, richer media, persistent offline history, and more reliable
      multi-channel package publishing. Account state was later consolidated beneath an
      XDG-style state directory to prevent session and database corruption from
      concurrent instances.
  related-projects:
    - Telegram Desktop and Telegram Web are the project's GUI and browser counterparts.
    - >
      The interface is built with Bubble Tea and Lip Gloss and cites lazygit as an
      inspiration.
    - The Telegram implementation uses gotd/td.
  sources:
    - 'Official README: https://github.com/sorokin-vladimir/tele'
    - 'Official changelog: https://github.com/sorokin-vladimir/tele/blob/main/CHANGELOG.md'
    - 'Official releases: https://github.com/sorokin-vladimir/tele/releases'
  summary:
    - >
      tele is an actively developed, keyboard-first Telegram client for the terminal,
      implemented in Go and designed for local terminal, tmux, and SSH workflows.
  timeline:
    - >
      2026-06: Draft synchronization, forwarding, downloads, proxy support, and
      reliability improvements arrived across early 1.x releases
    - >
      2026-07: Mouse support, media improvements, a beta packaging channel, and
      persistent offline history were added
    - >
      2026-07-18: Release publishing was changed so failures in one package channel no
      longer blocked Homebrew and deb/rpm updates
    - >
      2026-07-23: Version 1.9.0 added SQLite-backed offline history and an
      in-application shortcut reference
  usage:
    - >
      On first launch, users authenticate with a phone number, SMS code, and optional
      two-factor password. The client stores configuration separately from sensitive
      Telegram session and local-account state.
    - >
      Navigation is primarily keyboard-driven, with Vim-inspired movement, pane
      shortcuts, message actions, chat search, media viewing, attachment sending, and
      optional mouse support.
related-packages:
  - id: cask:telegram-a
    reason: >
      Choose Telegram A for an official graphical web/desktop client with calls and
      broad visual features; choose tele for a keyboard-first terminal, tmux, or SSH
      workflow.
    rel: alternative
    sources:
      - https://github.com/sorokin-vladimir/tele#readme
      - https://github.com/Ajaxy/telegram-tt#readme
      - https://web.telegram.org/a/
category: networking
package-manager:
  brew: tele
  winget: sorokin-vladimir.tele
package-manager-url: https://formulae.brew.sh/formula/tele
license: GPL-3.0-only
tags:
  - cli
  - go
  - keyboard-first
  - messaging
  - ssh
  - telegram
  - terminal
  - tui
  - vim-keybindings
description: 'Telegram client for the terminal: a keyboard-first TUI and a CLI'
executables:
  - tele
provenance:
  formula: tele
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
