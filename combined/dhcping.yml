id: brew:dhcping
display-name: dhcping
homepage: https://www.mavetju.org/unix/general.php
repo: null
docs:
  - http://www.mavetju.org/unix/general.php
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dhcping fits the long-lived Unix pattern of small health-check commands: it can be
      placed in monitoring scripts where a full DHCP client transaction or packet
      analyzer would be too heavy. The manual explicitly describes setup for a
      monitoring host against a DHCP server.
  package-nerd-significance:
    - >
      Package nerds care about dhcping because it packages a single operational question
      as a command: is the DHCP server answering? That makes it useful in init scripts,
      monitoring checks, and network bring-up debugging without pulling in a larger
      tool.
  project-history:
    - >
      The official Mavetju tools page lists DHCPING 1.2 as a DHCP daemon ping program
      for checking whether a DHCP server is still running. Its change log records a 1.0
      initial release, DHCPINFORM support in 1.1, and
      documentation/autoconfiguration/Solaris linking fixes in 1.2.
  related-projects:
    - dhcpdump is the sibling diagnostic tool for decoding DHCP packets.
    - dhcpd and dhclient are the server/client tools dhcping is commonly used around.
  sources:
    - http://www.mavetju.org/unix/general.php
    - http://www.mavetju.org/unix/dhcping-man.php
    - http://www.mavetju.org/unix/dhcping-changes.txt
  summary:
    - >
      dhcping is a focused DHCP availability probe. It sends DHCPREQUEST or DHCPINFORM
      traffic to check whether a DHCP server responds, making it a small monitoring and
      diagnostics companion rather than a general DHCP client.
  timeline:
    - '2002: Change log revision records dhcping releases through version 1.2.'
    - '1.0: Initial release.'
    - '1.1: DHCPINFORM option added.'
    - '1.2: Documentation, autoconfiguration, and Solaris/SunOS linking fixes.'
  usage:
    - >
      The man page documents required client IP, server IP, and client hardware address
      arguments, a timeout, quiet and verbose modes, and DHCPREQUEST or DHCPINFORM
      operation. Because it binds to the bootpc port, the documentation notes that it
      must run with appropriate privileges.
related-packages:
  - id: brew:dhcpdump
    reason: >
      Use dhcpdump when dhcping establishes a failure or ambiguous response and
      packet-level DHCP headers and options must be inspected.
    rel: adjacent_workflow
    sources:
      - https://www.mavetju.org/unix/dhcping-man.php
      - https://www.mavetju.org/unix/dhcpdump-man.php
category: networking
package-manager:
  apk: dhcping
  brew: dhcping
  debian: dhcping
  macports: dhcping
  nix: dhcping
