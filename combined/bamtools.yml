history:
  adoption-history:
    - >
      BamTools became a routine distribution package for bioinformatics environments:
      the supplied package facts list Homebrew, Debian/Ubuntu, MacPorts, and Nix
      packages. That adoption matters because genomics pipelines often rely on system
      packages for reproducible command-line utilities on shared clusters and CI images.
  package-nerd-significance:
    - >
      For package nerds, BamTools sits at the intersection of library packaging and
      scientific reproducibility. It is small enough to be a normal Unix package but
      domain-specific enough that ABI, zlib linkage, and command compatibility matter to
      downstream genomics stacks.
    - >
      Its relationship to SAMtools makes it historically useful: SAMtools became the
      canonical C toolkit, while BamTools offered a C++-oriented alternative that
      distributions could ship for software expecting the BamTools API.
  project-history:
    - >
      The official repository history begins in April 2009 with an initial import by the
      BamTools maintainers. The README identifies BamTools as both a programmer's API
      and an end-user toolkit for BAM files and credits Derek Barnett, Erik Garrison,
      Gabor Marth, and Michael Stromberg in the 2009-2010 copyright notice.
    - >
      The README explicitly acknowledges Heng Li's SAMtools as the original C-language
      BAM API and toolkit, placing BamTools in the second wave of tooling around the
      SAM/BAM ecosystem: a C++ library and CLI layer for developers and pipeline authors
      who wanted BAM manipulation without binding directly to SAMtools internals.
    - >
      BamTools reached the 2.x series by 2011 and has continued to receive maintenance
      releases, including the 2.5.x line used by modern package managers.
  related-projects:
    - >
      BamTools is directly related to SAMtools and the SAM/BAM file-format ecosystem. It
      is commonly adjacent to HTSlib/SAMtools-style tooling, alignment pipelines, and
      downstream genomics packages that consume BAM files.
  sources:
    - https://github.com/pezmaster31/bamtools
    - https://github.com/pezmaster31/bamtools/blob/master/README
    - https://github.com/pezmaster31/bamtools/commit/3ba4b5eb3f88fd8f24af8bf83ba218b84faa87ba
    - https://github.com/pezmaster31/bamtools/wiki
    - input.source_facts.package-manager
  summary:
    - >
      BamTools is a C++ API and command-line toolkit for working with BAM files, the
      binary alignment format used throughout high-throughput sequencing workflows. It
      is a packaging-significant bioinformatics utility because it provides both
      reusable libraries and small CLI tools for common BAM inspection and
      transformation jobs.
  timeline:
    - '2009: Initial BamTools import appears in the official Git history.'
    - '2009-2010: README copyright credits the original BamTools authors.'
    - '2011: v2.0.0 is tagged, establishing the 2.x API/toolkit line.'
    - '2017: v2.5.1 is tagged in the long-lived 2.5 series.'
    - '2025: v2.5.3 is tagged as a maintenance release.'
  usage:
    - >
      The source tree builds a bamtools toolkit binary with subcommands such as convert,
      count, coverage, filter, header, index, merge, random, resolve, revert, sort,
      split, and stats. The same repository also exposes a C++ API for applications that
      need to read or write BAM data programmatically.
    - >
      Typical users are bioinformatics developers, sequencing pipeline maintainers, and
      researchers doing command-line BAM file processing outside larger workflow
      systems.
related-packages:
  - id: brew:samtools
    reason: >
      Choose SAMtools for the actively maintained, HTSlib-backed command suite with
      broader SAM, BAM, and CRAM operations; BamTools is the C++-API-oriented
      alternative and explicitly acknowledges SAMtools as its predecessor.
    rel: alternative
    sources:
      - https://github.com/pezmaster31/bamtools
      - https://github.com/samtools/samtools
      - https://www.htslib.org/doc/samtools.html
