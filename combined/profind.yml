history:
  adoption-history:
    - >
      ProFind serves Mac users who want direct control over file searching rather than
      depending entirely on Spotlight. Its optional caches also address external,
      network, and temporarily disconnected disks.
  package-nerd-significance:
    - >
      ProFind is notable for combining a native graphical search interface with boolean
      expressions, regular expressions, natural-language filters, content extraction,
      OCR, hashing, scripts, Shortcuts, and searchable disk caches.
  project-history:
    - >
      Official release notes document continued development from at least 2019, when
      ProFind added remote searching and expanded content-search capabilities.
    - >
      Later releases added folder groups, on-device image recognition, richer content
      caching, a visual query editor, archive searching, and direct filesystem browsing
      from the search field.
  related-projects:
    - >
      ProFind Remote is the official companion iOS application for searching a Mac over
      the local network.
    - >
      Spotlight metadata can be queried, although ProFind's principal searches do not
      require Spotlight.
  sources:
    - https://www.zeroonetwenty.com/profind/
    - https://www.zeroonetwenty.com/profind/release-notes.html
  summary:
    - >
      ProFind is a macOS file-search utility by Ross Tulloch/zeroonetwenty. It searches
      names, metadata, tags, file contents, archives, and images across local, external,
      and network storage.
  timeline:
    - >
      2019: Official release notes document ProFind Remote support and expanded
      document-content searching.
    - '2022: On-device image-recognition search and folder groups were introduced.'
    - >
      2025: The application added a URL scheme and expanded query and content-copying
      features.
    - '2026: Visual query editing, live-directory browsing, and ZIP/TAR searching were added.'
  usage:
    - >
      Users enter ordinary words or structured expressions combining filters for dates,
      sizes, types, tags, locations, content, regular expressions, and boolean logic.
    - >
      Results can be previewed, exported, or passed to shell scripts, AppleScript, and
      macOS Shortcuts. Optional caches accelerate repeated searches and retain indexes
      for disconnected disks.
