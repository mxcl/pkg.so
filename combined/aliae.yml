id: brew:aliae
display-name: aliae
homepage: https://aliae.dev
repo: https://github.com/jandedobbeleer/aliae
docs:
  - https://aliae.dev/docs
config-file-location:
  unix: ~/.aliae.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      aliae is newer and smaller than Oh My Posh, but it benefits from the same author
      ecosystem and is distributed through Homebrew, Nix, and WinGet according to the
      input facts. The README links to official docs, releases, Discord community, and
      sponsorship channels.
    - >
      Its adoption pattern is dotfiles-first: users who maintain several shells or
      operating systems can reduce duplicated alias/function/env/path snippets.
  package-nerd-significance:
    - >
      aliae is interesting to package users because shell state is usually messy and
      local. A package-manager-installed binary plus a checked-in YAML file gives a
      reproducible way to share aliases and environment setup across machines.
    - >
      It is deliberately narrower than a full dotfile framework. That makes it
      attractive when a user wants cross-shell aliases and PATH/env/script management
      without adopting a large bootstrap system.
  project-history:
    - >
      The public GitHub repository was created in June 2023. The official docs say aliae
      came from wanting the same shell experience across all shells used while building
      and validating Oh My Posh.
    - >
      The documentation presents the core idea as a single template-enabled YAML
      configuration that works across shells and platforms. That puts aliae near dotfile
      managers and shell plugin tools, but with a narrower focus on shell initialization
      artifacts.
  related-projects:
    - >
      Related projects include Oh My Posh, shell plugin managers, chezmoi-style dotfile
      management, and per-shell alias/function systems.
  sources:
    - https://aliae.dev/docs
    - https://api.github.com/repos/JanDeDobbeleer/aliae
    - https://github.com/JanDeDobbeleer/aliae
    - https://raw.githubusercontent.com/JanDeDobbeleer/aliae/main/README.md
    - >
      https://raw.githubusercontent.com/JanDeDobbeleer/aliae/main/website/docs/setup/configuration.mdx
  summary:
    - >
      aliae is a cross-shell alias and shell-environment manager by Jan De Dobbeleer. It
      lets users define aliases, functions, environment variables, PATH entries,
      scripts, and symlinks once in YAML and emit shell-specific initialization code.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2023-2026: Project documented as a cross-platform shell management tool.'
    - >
      2026: Official docs describe default home-directory YAML config and custom config
      locations.
  usage:
    - >
      By default aliae expects `.aliae.yaml` in the user's home directory. The official
      configuration docs also allow a custom path with `--config` or the `ALIAE_CONFIG`
      environment variable, including local files or remote config URLs.
    - >
      A typical shell setup evaluates `aliae init zsh`, `aliae init bash`, or another
      shell target during startup. The YAML can include shell/OS conditionals so one
      config can produce different output for Bash, Zsh, PowerShell, Nushell, Xonsh,
      tcsh, and other supported shells.
related-packages:
  - id: brew:oh-my-posh
    reason: >
      Use Oh My Posh alongside aliae for a portable themed prompt while aliae manages
      the surrounding aliases, environment, PATH entries, links, and shell-specific
      initialization scripts.
    rel: adjacent_workflow
    sources:
      - https://aliae.dev/docs
      - https://aliae.dev/docs/setup/configuration
      - https://ohmyposh.dev/docs/
category: developer-tools
package-manager:
  brew: aliae
  nix: aliae
  winget: JanDeDobbeleer.Aliae
package-manager-url: https://formulae.brew.sh/formula/aliae
license: MIT
tags:
  - aliases
  - cli
  - configuration
  - cross-platform
  - shell
  - yaml
description: Cross shell and platform alias management
executables:
  - aliae
provenance:
  formula: aliae
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
