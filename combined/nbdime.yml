id: brew:nbdime
display-name: nbdime
homepage: https://nbdime.readthedocs.io
repo: https://github.com/jupyter/nbdime
docs:
  - https://nbdime.readthedocs.io/en/latest
config-file-location:
  unix:
    - nbdime_config.json in directories listed by `jupyter --paths`
    - ./nbdime_config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The package reached PyPI as 0.1.0 on 2016-12-16 and 1.0.0 on 2018-05-15. GitHub
      API data retrieved on 2026-07-01 showed 2,836 stars and 192 forks. PyPI Stats
      reported 317,876 downloads for the recent last-month window, and Homebrew Formulae
      reported 758 installs over the prior 365 days.
    - >
      Its adoption comes from being the practical local answer to notebook version
      control. Jupyter users can keep notebooks in Git, but nbdime makes diffs
      human-readable and merges less hazardous by understanding notebook structure.
  package-nerd-significance:
    - >
      nbdime matters because it turns notebooks from opaque JSON blobs back into
      reviewable development artifacts. It does not replace Git or Jupyter; it patches
      the exact place where their defaults are weakest together.
  project-history:
    - >
      The jupyter/nbdime repository was created on 2015-11-16. The problem it addresses
      is old and specific: .ipynb files are JSON documents, so line-based diff and merge
      tools are noisy and often misleading for code cells, markdown cells, metadata,
      execution counts, rich outputs, and embedded images.
    - >
      The project became part of the Jupyter ecosystem discussion early. Jupyter
      Enhancement Proposal 8, 'Diffing and merging notebooks', says preliminary work
      resided in nbdime and frames the core use cases as version-control merge commands,
      diff commands, notebook change inspection, and automated regression testing.
  related-projects:
    - Project Jupyter
    - Jupyter Enhancement Proposal 8
    - Git diff and merge drivers for notebook files
  sources:
    - https://api.github.com/repos/jupyter/nbdime
    - https://formulae.brew.sh/api/formula/nbdime.json
    - https://github.com/jupyter/nbdime
    - https://jupyter.org/enhancement-proposals/08-notebook-diff/notebook-diff.html
    - https://nbdime.readthedocs.io/
    - https://pypi.org/pypi/nbdime/json
    - https://pypistats.org/api/packages/nbdime/recent
    - >
      https://pyvideo.org/scipy-2016/diffing-and-merging-jupyter-notebooks-with-nbdime-scipy-2016-min-ragan-kelley.html
    - https://raw.githubusercontent.com/jupyter/nbdime/master/README.md
  summary:
    - >
      nbdime is the Jupyter notebook diff and merge toolkit: terminal diffs,
      web-rendered diffs, three-way merges, Git and Mercurial integration commands, and
      notebook-aware conflict handling.
  timeline:
    - '2015-11-16: jupyter/nbdime repository created.'
    - "2016-07-15: 'Diffing and Merging Jupyter Notebooks with nbdime' presented at SciPy 2016."
    - '2016-12-16: nbdime 0.1.0 uploaded to PyPI.'
    - '2018-05-15: nbdime 1.0.0 uploaded to PyPI.'
    - '2026-02-10: nbdime 4.0.4 published.'
  usage:
    - >
      Users run nbdiff for terminal-friendly notebook comparisons, nbdiff-web for
      rendered browser diffs, nbmerge for three-way notebook merges, nbmerge-web for
      browser-assisted conflict resolution, and nbshow for terminal presentation of a
      notebook.
    - >
      The Git integration is the package-nerd move: configure nbdime as the diff and
      merge driver so normal git diff and git merge behavior can route .ipynb files
      through notebook-aware tooling while leaving ordinary files alone.
related-packages:
  - id: brew:jupytext
    reason: >
      Choose Jupytext when cleaner version control is best achieved by pairing notebooks
      with Markdown or script representations, rather than structurally diffing and
      merging the .ipynb files themselves.
    rel: alternative
    sources:
      - https://nbdime.readthedocs.io/en/latest/
      - https://jupytext.readthedocs.io/en/latest/
  - id: brew:git
    reason: >
      Git can invoke nbdime as the registered diff and merge driver for .ipynb files
      while retaining its normal behavior for other files.
    rel: adjacent_workflow
    sources:
      - https://nbdime.readthedocs.io/en/latest/vcs.html
      - https://git-scm.com/docs
  - id: brew:jupyterlab
    reason: >
      JupyterLab supplies the notebook workspace in which nbdime's installed server and
      front-end extensions expose notebook-aware comparisons.
    rel: adjacent_workflow
    sources:
      - https://nbdime.readthedocs.io/en/latest/installing.html
      - https://jupyterlab.readthedocs.io/en/latest/
category: developer-tools
package-manager:
  brew: nbdime
  nix: nbmerge
package-manager-url: https://formulae.brew.sh/formula/nbdime
license: BSD-3-Clause
tags:
  - cli
  - diff
  - jupyter
  - merge
  - notebooks
description: Jupyter Notebook Diff and Merge tools
executables:
  - git-nbdiffdriver
  - git-nbdifftool
  - git-nbmergedriver
  - git-nbmergetool
  - hg-nbdiff
  - hg-nbdiffweb
  - hg-nbmerge
  - hg-nbmergeweb
  - nbdiff
  - nbdiff-web
  - nbdime
  - nbmerge
  - nbmerge-web
  - nbshow
provenance:
  formula: nbdime
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
