  - https://hookproductivity.com/help/integration
config-file-location:
  macos: ~/Library/Preferences/com.cogsciapps.hook.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Hookmark's usefulness has broadened through integrations with linkable Mac
      applications, including browsers, mail clients, Finder, task managers, note-taking
      tools, and reference managers. The product offers both contextual navigation and a
      searchable bookmarks window, with later versions adding cross-application tags.
  package-nerd-significance:
    - >
      Hookmark appeals to macOS power users because it creates stable, automatable links
      across otherwise separate applications and data stores. Its plain-text `.hookmark`
      files can be kept in synchronized folders or version-control repositories, making
      contextual links portable and inspectable in ways that Finder aliases often are
      not.
  project-history:
    - >
      CogSci Apps originally shipped the product under the name Hook. It was renamed
      Hookmark in autumn 2022, when the application also introduced the `.hookmark` file
      extension while retaining compatibility with older `.hook` files.
  related-projects:
    - >
      Hookmark integrates with many independent macOS tools rather than replacing them,
      including DEVONthink, Obsidian, Craft, OmniFocus, Things, Finder, and Apple Mail.
    - >
      Hookmark for iPhone and iPad extends access to the product's linked information on
      mobile Apple devices.
  sources:
    - https://hookproductivity.com/help/general/getting-started/
    - https://hookproductivity.com/help/general/overview/
    - https://hookproductivity.com/help/hook-window/make-hook-file/
    - https://hookproductivity.com/help/integration/
  summary:
    - >
      Hookmark is a macOS contextual-bookmarking and deep-linking utility developed by
      CogSci Apps. It creates links to files, messages, tasks, web pages, and other
      application objects and can connect those resources bidirectionally.
  timeline:
    - '2022: Hook was renamed Hookmark and `.hookmark` files were introduced.'
    - '2023: Official documentation described planned mobile access to synchronized bookmarks.'
    - '2025: Hookmark 6.1 added tagging across linked resources.'
  usage:
    - >
      A typical workflow invokes Hookmark over the currently selected resource, copies
      its link, and uses `Hook to Copied Link` to create a bidirectional relationship
      with another item. Users can later navigate through hooked items, search the
      bookmarks database, apply tags, or create portable plain-text `.hookmark` files.
      The documented default location for generated Hookmark files is
      `~/Documents/Hook/Hook Files`; this is a user-content directory, not an
      application configuration file.
