id: brew:mitie
display-name: MITIE
homepage: https://github.com/mit-nlp/MITIE/
repo: https://github.com/mit-nlp/MITIE
docs:
  - https://github.com/mit-nlp/MITIE#readme
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://blog.dlib.net/2014/04/mitie-completely-free-and-state-of-art.html
    - https://formulae.brew.sh/formula/mitie
    - https://github.com/mit-nlp/MITIE
  summary:
    - >
      MITIE, the MIT Information Extraction library, is a C++ library and tool
      collection for information extraction tasks such as named-entity recognition and
      relation extraction. Davis King's dlib announcement introduced MITIE as a free
      information-extraction toolkit with a C API and a streaming command-line
      named-entity recognizer, with plans for additional language bindings and NLP
      tools.
  usage:
    - >
      The GitHub project presents MITIE as a library first and a set of examples and
      command-line tools second. Its core is written in C++, but the project documents
      bindings for Python, R, Java, C, and MATLAB, with outside bindings for other
      languages. In practice, users build the shared library, download trained model
      files, run examples, or use tools such as `ner_stream`; the Homebrew package
      exposes demonstration and streaming executables for the smaller NLP tooling niche
      rather than a full application server.
related-packages:
  - id: brew:stanford-ner
    reason: >
      Stanford NER is a Java CRF-based alternative with established English classifiers
      and CoreNLP integration; MITIE is preferable when native C++ APIs, relation
      detection, or its broader set of language bindings is needed.
    rel: alternative
    sources:
      - https://github.com/mit-nlp/MITIE
      - https://nlp.stanford.edu/software/CRF-NER.shtml
      - https://stanfordnlp.github.io/CoreNLP/ner.html
category: ai
package-manager:
