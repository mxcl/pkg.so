id: brew:eless
display-name: eless
homepage: https://eless.scripter.co/
repo: https://github.com/kaushalmodi/eless
docs:
  - https://eless.scripter.co/
  - https://github.com/kaushalmodi/eless#readme
config-file-location:
  unix: ~/.emacs.d/elesscfg
credentials-file-location: null
history:
  adoption-history:
    - >
      eless remained a niche terminal productivity tool rather than a broad ecosystem
      package. Its adoption path is mostly manual installation and Homebrew, aimed at
      users who already have Emacs installed and want it to serve as a pager.
  package-nerd-significance:
    - >
      eless is a neat package-manager edge case: the package is just a small script, but
      it turns a large editor runtime into a pager. That makes it interesting for CLI
      catalogs because its real capability comes from composition with Emacs rather than
      from a large standalone binary.
  project-history:
    - >
      The eless repository was created in April 2017. Its README describes the tool as a
      combination of a Bash script and a minimal Emacs `view-mode` configuration,
      created because the author wanted something like `less` but with Emacs' richer
      viewing modes.
    - >
      The project is intentionally small and literate: the README says the script and
      documentation are generated from one Org Babel source file, and the documentation
      site is generated from the same file.
  related-projects:
    - >
      eless relates to `less`, Emacs view-mode, dired, man, Info, git diff pagers, and
      other enhanced pagers such as bat or delta, though its implementation is centered
      on Emacs rather than terminal rendering alone.
  sources:
    - https://github.com/kaushalmodi/eless
    - https://raw.githubusercontent.com/kaushalmodi/eless/master/README.org
    - https://eless.scripter.co/
    - https://api.github.com/repos/kaushalmodi/eless
  summary:
    - >
      eless is a Bash-and-Emacs pager that tries to behave like a better `less`: quick
      to launch, independent of the user's normal Emacs configuration, and useful for
      syntax-highlighted files, man pages, Info manuals, diffs, logs, directories, and
      piped output.
  timeline:
    - '2017: GitHub repository created.'
    - '2017: eless documented as a Bash script plus minimal Emacs view-mode configuration.'
    - '2022: Last observed repository push from GitHub metadata before this enrichment run.'
  usage:
    - >
      Users run `eless file`, pipe command output into it, set `PAGER=eless` for git or
      man-page workflows, inspect directories through dired, view colored diffs, or
      follow logs with auto-revert behavior. It deliberately avoids requiring an
      already-running Emacs server.
    - >
      Because it depends on Emacs, Bash, Perl, and Texinfo for some workflows, eless is
      most attractive to terminal users who already live near the Emacs ecosystem and
      want a richer pager without changing every command-line habit.
related-packages:
  - id: brew:less
    reason: >
      Choose less for a lightweight, ubiquitous terminal pager when Emacs-backed syntax
      rendering, dired, and editor modes are unnecessary.
    rel: alternative
    sources:
      - https://eless.scripter.co/
      - https://www.greenwoodsoftware.com/less/
  - id: brew:bat
    reason: >
      Choose bat for a modern highlighted file viewer with automatic paging and
      Git-aware output when a standalone Rust CLI is preferable to an Emacs-backed
      pager.
    rel: alternative
    sources:
      - https://eless.scripter.co/
      - https://github.com/sharkdp/bat#readme
  - id: brew:emacs
    reason: >
      Install GNU Emacs alongside eless because the official requirements identify Emacs
      view-mode as the runtime that supplies its rendering and navigation features.
    rel: adjacent_workflow
    sources:
      - https://eless.scripter.co/
      - https://www.gnu.org/software/emacs/
category: productivity
package-manager:
  brew: eless
package-manager-url: https://formulae.brew.sh/formula/eless
license: MIT
tags:
  - bash
  - cli
  - emacs
  - less
  - pager
  - terminal
description: Better less using Emacs view-mode and Bash
executables:
  - eless
provenance:
  formula: eless
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
