id: brew:git-standup
display-name: git-standup
homepage: https://github.com/nilbuild/git-standup
repo: https://github.com/nilbuild/git-standup
docs:
  - https://github.com/nilbuild/git-standup#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-standup became one of the more recognizable lightweight Git extensions because
      its workflow matches a common team ritual. The README documents installation
      through curl, npm, Homebrew, Arch AUR, and manual install, giving it reach across
      shell users and package-manager ecosystems.
  package-nerd-significance:
    - >
      The package is significant as a tiny Git porcelain that turns commit history into
      a social workflow artifact. It is useful in package collections because it has no
      hosted-service dependency and makes a daily engineering habit scriptable from Git
      alone.
  project-history:
    - >
      The project appeared in 2016 as a personal productivity script. The README
      explains the origin plainly: the author wanted a small tool for remembering where
      work had stopped across several repositories and for running standup updates from
      Git history.
    - >
      Early tags and releases landed rapidly in April 2016, with 2.x releases adding
      options for branch selection, author filtering, date ranges, recursion, fetching,
      report files, diff stats, and signed-commit display. The repository later moved
      under the nilbuild organization while retaining the familiar git-standup package
      identity.
  related-projects:
    - >
      git-standup is related to Git's own log command and to team standup/reporting
      scripts that summarize commit history.
  sources:
    - https://formulae.brew.sh/formula/git-standup
    - https://github.com/nilbuild/git-standup
    - https://github.com/nilbuild/git-standup/blob/master/README.md
    - https://github.com/nilbuild/git-standup/releases
  summary:
    - >
      git-standup is a Git extension that summarizes recent commits so developers can
      reconstruct work done for standup meetings or inspect another contributor's recent
      activity.
  timeline:
    - '2016: Initial public repository and 1.0.0 tag appeared.'
    - '2016: 2.x releases added broader reporting options.'
    - '2020: 2.3.2 release was published.'
  usage:
    - >
      Practitioners run git standup in one repository or a parent directory containing
      several repositories. By default it reports commits from the last working day;
      options select authors, include all contributors, recurse to a chosen depth, fetch
      before reporting, filter by dates, show diff stats, or write
      git-standup-report.txt.
related-packages:
  - id: brew:git
    reason: >
      Git supplies the commit history that git-standup summarizes, so it is the
      essential companion for generating standup reports from local repositories.
    rel: adjacent_workflow
    sources:
      - https://github.com/nilbuild/git-standup#readme
      - https://git-scm.com/docs/git-log
category: developer-tools
package-manager:
  brew: git-standup
  nix: git-standup
package-manager-url: https://formulae.brew.sh/formula/git-standup
license: MIT
tags:
  - cli
  - commit-history
  - git
  - reporting
  - standup
description: Git extension to generate reports for standup meetings
executables:
  - git-standup
provenance:
  formula: git-standup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
