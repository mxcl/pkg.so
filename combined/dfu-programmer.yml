id: brew:dfu-programmer
display-name: dfu-programmer
homepage: https://github.com/dfu-programmer/dfu-programmer
repo: https://github.com/dfu-programmer/dfu-programmer
docs:
  - http://dfu-programmer.github.io
  - https://github.com/dfu-programmer/dfu-programmer#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts list dfu-programmer across Homebrew, Debian, Ubuntu,
      Arch, Alpine, MacPorts, Nix, Scoop, and openSUSE-style packaging. That spread
      matches its role as a small, hardware-adjacent CLI that distribution maintainers
      keep available for developers who need repeatable firmware flashing from scripts
      or build instructions.
  package-nerd-significance:
    - >
      Package nerds care about dfu-programmer because it represents the non-glamorous
      edge where package managers meet USB permissions, libusb ABI changes, vendor
      bootloaders, and hardware testability. It is also a good example of why small
      firmware CLIs tend to persist in distributions: one binary can replace a GUI-only
      vendor workflow for many boards.
  project-history:
    - >
      The project README says dfu-programmer was created because Atmel FLIP did not
      support USB flashing on Linux and generic DFU loaders did not work with Atmel
      chips. Its release notes show a long 0.x line beginning with an initial 0.1
      release, expanding chip coverage through AVR, 8051, AVR32, XMEGA, and experimental
      STM32 support, and later modernizing around libusb-1.0.
  related-projects:
    - >
      dfu-util is the broader USB DFU utility in the same package-manager neighborhood;
      Atmel FLIP is the vendor tool explicitly mentioned by dfu-programmer as part of
      its motivation.
  sources:
    - https://github.com/dfu-programmer/dfu-programmer#readme
    - https://raw.githubusercontent.com/dfu-programmer/dfu-programmer/master/NEWS
    - https://github.com/dfu-programmer/dfu-programmer/releases
  summary:
    - >
      dfu-programmer is a command-line USB firmware flashing tool for chips with
      Atmel-compatible DFU bootloaders. In package-manager culture it sits in the small
      but important embedded-tooling shelf: the utility you install when a board exposes
      a DFU bootloader but vendor GUI tools are the wrong shape for a Unix workflow.
  timeline:
    - '2005: 0.2.0 added limited at89c513x support.'
    - '2007: 0.4.0 refined OS X compilation and flashing behavior.'
    - '2011: 0.5.3 added libusb 1.0 support.'
    - '2014: 0.7.0 migrated the repository and website to GitHub.'
    - '2022: 1.0.0 removed libusb0 support.'
    - '2023: 1.1.0 added the --erase-first option.'
  usage:
    - >
      Typical use is direct and device-oriented: build or install the tool, connect a
      supported target in bootloader mode, erase or flash memory, and optionally use
      completion or target-listing helpers. The official README emphasizes
      Unix/Linux/macOS source builds, Windows driver considerations, and the supported
      chip matrix.
related-packages:
  - id: brew:dfu-util
    reason: >
      Choose dfu-util for broadly standards-compliant USB DFU and DfuSe devices;
      dfu-programmer is the Atmel-focused alternative for bootloaders that standard DFU
      loaders historically could not handle.
    rel: alternative
    sources:
      - https://dfu-programmer.github.io/
      - https://dfu-util.sourceforge.net/
category: system
package-manager:
  apk: dfu-programmer
  brew: dfu-programmer
  debian: dfu-programmer
  macports: dfu-programmer
  nix: dfu-programmer
  pacman: dfu-programmer
  scoop: extras/dfu-programmer
  ubuntu: dfu-programmer
  zypper: dfu-programmer
package-manager-url: https://formulae.brew.sh/formula/dfu-programmer
license: GPL-2.0-or-later
