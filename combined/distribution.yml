id: brew:distribution
display-name: distribution
homepage: https://github.com/time-less-ness/distribution
repo: https://github.com/time-less-ness/distribution
docs:
  - https://github.com/time-less-ness/distribution#readme
config-file-location:
  unix: ~/.distributionrc
credentials-file-location: null
history:
  adoption-history:
    - >
      distribution's own installation notes mention Homebrew as the simple install
      route, while the input package facts show availability in Brew and Nix. That is
      modest adoption, but enough to place it in the family of small terminal
      data-inspection packages.
  package-nerd-significance:
    - >
      distribution is package-nerdy because it makes ad hoc shell observability
      friendlier without asking users to leave the terminal or produce a heavyweight
      plot. It is the kind of tiny data tool that survives in package managers because
      it composes with everything.
  project-history:
    - >
      The README says the original scripts were written in Perl and Python by Tim Ellis,
      then expanded beyond simple frequency histograms into time-series and arbitrary
      x-axis graphs. The current canonical README also records a project-control
      transfer from the previous maintainer to wizzat.
  related-projects:
    - >
      The README names holman's spark as a related compact graphing project, contrasting
      spark's smaller output with distribution's more verbose higher-resolution charts.
    - >
      Standard Unix tools such as sort, uniq, du, awk, and ps are common upstream
      producers for distribution pipelines.
  sources:
    - https://github.com/time-less-ness/distribution#readme
    - https://api.github.com/repos/time-less-ness/distribution
  summary:
    - >
      distribution is a terminal histogram and graphing tool for turning command output
      into character-based charts. Its appeal is the old Unix habit of inserting one
      small filter into a pipeline to make text data easier to inspect.
  timeline:
    - '2017: Current canonical GitHub repository created.'
    - '2017: README records transfer of project control to the wizzat distribution repository.'
    - '2022: Repository metadata shows continued maintenance activity into the early 2020s.'
  usage:
    - >
      The common pattern is to pipe a list, count stream, syslog slice, process list, or
      du output into distribution and let it render a proportional ASCII or Unicode
      chart. It supports tokenization, pre-aggregated key/value input, numeric-only
      graphs, colors, terminal-size aware output, and an rcfile for preferred defaults.
related-packages:
  - id: brew:spark
    reason: >
      Choose spark for very compact Unicode sparklines; distribution's own documentation
      recommends it when distribution's verbose, higher-resolution charts are
      unnecessary.
    rel: alternative
    sources:
      - https://github.com/wizzat/distribution#readme
      - https://github.com/holman/spark#readme
category: data
package-manager:
  brew: distribution
  nix: distribution
  zypper: distribution-registry
package-manager-url: https://formulae.brew.sh/formula/distribution
license: GPL-2.0-only
tags:
  - ascii
  - cli
  - histogram
  - terminal
  - visualization
description: Create ASCII graphical histograms in the terminal
executables:
  - distribution
provenance:
  formula: distribution
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
