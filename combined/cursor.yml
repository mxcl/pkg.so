history:
  adoption-history:
    - >
      Cursor became prominent as AI-assisted programming shifted from isolated
      completion extensions toward editor-native chat and agent workflows. Its ongoing
      official changelog documents a rapid release cadence and expansion into background
      agents, automation, command-line use, and remote control.
  package-nerd-significance:
    - >
      Cursor is a prominent example of a proprietary developer application distributed
      as a desktop package while retaining the familiar extension, settings, and
      workflow model of a VS Code-derived editor. It helped establish the AI-native
      editor as a distinct package category rather than merely an editor plugin.
  project-history:
    - >
      Cursor was developed by Anysphere as an AI-first code editor. Public changelog
      entries date to 2023, when the product already offered project-oriented AI
      features; later releases progressively integrated codebase chat, predictive
      editing, agentic changes, terminal interaction, and remote agents.
  related-projects:
    - >
      Visual Studio Code provides the editor ecosystem and interaction model from which
      Cursor is derived.
    - >
      GitHub Copilot and other AI coding assistants address overlapping completion,
      chat, and agent workflows.
  sources:
    - https://cursor.com/changelog
    - https://cursor.com/docs
    - https://www.cursor.com/changelog/new-ai-project
    - source_facts.description
  summary:
    - >
      Cursor is a proprietary AI-first code editor that combines conventional source
      editing with codebase-aware chat, predictive completion, and autonomous coding
      agents.
  timeline:
    - "2023: Cursor's official changelog documented early AI project and editor workflows."
    - >
      2024–2025: The editor broadened from chat and completion toward increasingly
      agentic code changes and terminal interaction.
    - >
      2026: Cursor's changelog records continued expansion into cloud agents,
      automations, and remote-control workflows.
  usage:
    - >
      Developers open or clone a codebase in Cursor and use familiar editor features
      alongside inline completion, natural-language code questions, multi-file edits,
      and agents that can inspect and modify projects. The separate CLI supports browser
      login or API-key authentication.
