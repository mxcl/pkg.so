id: brew:certgraph
display-name: CertGraph
homepage: https://lanrat.github.io/certgraph/
repo: https://github.com/lanrat/certgraph
docs:
  - https://github.com/lanrat/certgraph#readme
  - https://lanrat.github.io/certgraph
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README lists Linux distribution packaging in BlackArch and Kali Linux, while
      the supplied package facts show Homebrew, MacPorts, and Nix packaging. That spread
      places CertGraph in the security-reconnaissance package ecosystem rather than only
      as a source checkout.
  package-nerd-significance:
    - >
      For package maintainers, CertGraph is a compact example of
      certificate-transparency tooling that matters because it crosses CLI, OSINT, and
      graph visualization workflows. It is also a useful package because its upstream
      provides a single Go binary and official multi-platform releases.
  project-history:
    - >
      The public GitHub repository was created in 2016 under lanrat/certgraph. The
      project later added GitHub Pages documentation and a web UI that consumes JSON
      graph output, and its release process now publishes prebuilt binaries for Linux,
      macOS, and Windows.
  related-projects:
    - >
      The README names crt.sh and Censys as Certificate Transparency drivers and links
      the web UI hosted from the same project.
  sources:
    - https://api.github.com/repos/lanrat/certgraph
    - https://github.com/lanrat/certgraph
    - https://lanrat.github.io/certgraph/
    - https://github.com/lanrat/certgraph#readme
    - https://lanrat.github.io/certgraph
    - https://formulae.brew.sh/api/formula/certgraph.json
  summary:
    - >
      CertGraph is a Go command-line tool for exploring relationships exposed by TLS
      certificate Subject Alternative Names. Its README describes it as creating a
      directed graph of domains and certificate alternate-name edges, with drivers for
      live TLS connections and Certificate Transparency sources.
  timeline:
    - '2016: Public GitHub repository created.'
    - '2022: Version-tagged upstream release history includes v20220513.20220514.0.'
    - '2025: v0.1.0 through v0.1.2 GitHub releases published with prebuilt binaries.'
  usage:
    - >
      CertGraph is used for host-name enumeration and certificate relationship
      discovery. Operators can crawl from seed hostnames, switch between HTTP, SMTP,
      crt.sh, and Censys drivers, emit JSON, save certificates, or serve the graph
      through the bundled web UI.
related-packages:
  - id: brew:certigo
    reason: >
      Use certigo after CertGraph's documented --save workflow to inspect or validate
      the collected PEM certificates and emit scriptable JSON.
    rel: adjacent_workflow
    sources:
      - https://github.com/lanrat/certgraph#readme
      - https://github.com/square/certigo#readme
category: security
package-manager:
  brew: certgraph
  macports: certgraph
  nix: certgraph
package-manager-url: https://formulae.brew.sh/formula/certgraph
license: GPL-2.0-or-later
tags:
  - certificate-transparency
  - certificates
  - cli
  - graph
  - san
  - tls
  - x509
description: Crawl the graph of certificate Alternate Names
executables:
  - certgraph
provenance:
  formula: certgraph
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
