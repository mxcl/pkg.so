id: brew:fzf
display-name: fzf
homepage: https://junegunn.github.io/fzf/
repo: https://github.com/junegunn/fzf
docs:
  - https://github.com/junegunn/fzf#readme
  - https://junegunn.github.io/fzf
  - https://junegunn.github.io/fzf/getting-started
config-file-location:
  unix:
    - $FZF_DEFAULT_OPTS_FILE
    - ~/.fzfrc
credentials-file-location: null
history:
  adoption-history:
    - >
      fzf is widely packaged by operating-system and language-adjacent package managers.
      The official README documents Homebrew, MacPorts, Debian/Ubuntu, Fedora, Alpine,
      Nix, Arch, FreeBSD, NetBSD, OpenBSD, Gentoo, Spack, Void, Chocolatey, Scoop,
      Winget, MSYS2, git installs, binary releases, and Vim plugin installation.
  package-nerd-significance:
    - >
      fzf is one of the canonical examples of a small CLI package becoming a platform
      primitive. Package maintainers care about it because it is not just an executable
      but also shell scripts, editor integration, completions, optional tmux/Zellij
      behavior, binary releases, and cross-platform package-manager coverage.
  project-history:
    - >
      The GitHub repository was created in October 2013, and the README copyright line
      spans 2013-2026. Over time the project expanded from a fuzzy selector into a
      terminal UI toolkit with preview windows, event bindings, reload actions, shell
      integrations, Vim and Neovim support, and packaged binaries.
    - >
      Recent changelog entries show active development in the 0.70 series and later,
      including popup support for tmux and Zellij, reload tracking, performance
      improvements, Nushell integration, new preview and border behavior, and
      HTTP/listen-related enhancements.
  related-projects:
    - >
      The README points to fzf.vim as a separate project for richer Vim commands,
      fzf-lua for Neovim users who prefer Lua plugins, fzf-tmux for tmux-pane use on
      older setups, and an official wiki page for related projects.
  sources:
    - https://api.github.com/repos/junegunn/fzf
    - https://github.com/junegunn/fzf
    - https://github.com/junegunn/fzf/releases
    - https://raw.githubusercontent.com/junegunn/fzf/master/CHANGELOG.md
    - https://raw.githubusercontent.com/junegunn/fzf/master/README-VIM.md
    - https://raw.githubusercontent.com/junegunn/fzf/master/README.md
  summary:
    - >
      fzf is a general-purpose command-line fuzzy finder and interactive terminal
      toolkit. Its README describes it as a fast, portable, programmable single-binary
      tool for selecting files, browsing command history, previewing data, navigating
      datasets, and building custom terminal menus.
  timeline:
    - '2013: GitHub repository created.'
    - '2013: README copyright period begins.'
    - '2020: GitHub Releases feed includes release 0.24.0.'
    - '2026: Release v0.73.1 published.'
  usage:
    - >
      The basic model is Unix-pipeline friendly: fzf reads newline-separated candidates
      from stdin and writes the selected item to stdout. Without stdin, it can traverse
      the current directory. Shell integration adds key bindings and fuzzy completion
      for Bash, Zsh, Fish, and Nushell, while the Vim integration exposes functions and
      the `:FZF` command.
related-packages:
  - id: brew:fzy
    reason: >
      Choose fzy when you want a smaller C-based stdin-to-stdout fuzzy selector whose
      official documentation emphasizes scoring quality and an interface drawn below the
      current cursor.
    rel: alternative
    sources:
      - https://github.com/jhawthorn/fzy#readme
      - https://github.com/junegunn/fzf#readme
  - id: brew:fd
    reason: >
      Use fd to generate fast, .gitignore-aware file and directory candidates for fzf;
      fzf's official README documents fd as both its default candidate source and a
      shell-completion backend.
    rel: adjacent_workflow
    sources:
      - https://github.com/junegunn/fzf#respecting-gitignore
      - https://github.com/sharkdp/fd#readme
category: developer-tools
package-manager:
  apk: fzf
  brew: fzf
  chocolatey: fzf
  debian: fzf
  dnf: fzf
  macports: fzf
  nix: fzf
  pacman: fzf
  scoop: main/fzf
  ubuntu: fzf
  winget: junegunn.fzf
  zypper: fzf
package-manager-url: https://formulae.brew.sh/formula/fzf
license: MIT
tags:
  - cli
  - fuzzy-finder
  - go
  - search
  - shell-integration
  - terminal
description: Command-line fuzzy finder written in Go
executables:
  - fzf
  - fzf-preview.sh
  - fzf-tmux
provenance:
  formula: fzf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
