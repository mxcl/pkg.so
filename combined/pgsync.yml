id: brew:pgsync
display-name: pgsync
homepage: https://github.com/ankane/pgsync
repo: https://github.com/ankane/pgsync
docs:
  - https://github.com/ankane/pgsync#readme
config-file-location:
  unix: .pgsync.yml
credentials-file-location:
  unix:
    - .pgsync.yml
    - .pgsync-<database>.yml
  windows:
    - .pgsync.yml
    - .pgsync-<database>.yml
history:
  adoption-history:
    - The official README describes pgsync as battle-tested at Instacart.
    - >
      The tool is distributed through RubyGems, Homebrew, Docker, and Nix, and its
      changelog records continued compatibility work across Ruby, PostgreSQL, and
      packaging environments.
  package-nerd-significance:
    - >
      pgsync occupies the practical middle ground between full database dumps and
      application-specific seed scripts: it can copy selected tables, filtered rows, and
      related record groups while handling schema differences.
    - >
      Its server-side data rules are especially significant for developers who need
      production-like local datasets without allowing sensitive values to leave the
      source database.
  project-history:
    - >
      Andrew Kane released pgsync in December 2015 as a Ruby command-line tool inspired
      by heroku-pg-transfer.
    - >
      It evolved from basic database copying into a parallel synchronization tool with
      partial-table selection, schema operations, resumable batching, framework
      integrations, safety restrictions, and server-side sensitive-data transformations.
  related-projects:
    - The project credits heroku-pg-transfer as an inspiration.
    - Its README points to pgslice, Dexter, and PgHero as related PostgreSQL tools.
  sources:
    - >
      https://github.com/ankane/pgsync#readme — official overview, Instacart adoption
      statement, setup, usage, security, and related projects.
    - >
      https://github.com/ankane/pgsync/blob/master/CHANGELOG.md — official dated release
      history.
  summary:
    - >
      pgsync is a Ruby-based command-line utility for synchronizing PostgreSQL data
      between databases with parallel transfer, selective copying, safety controls, and
      data masking.
  timeline:
    - '2015-12-07: Version 0.1.0, the first release.'
    - >
      2016: Added richer groups, partial-row synchronization, wildcard tables, and batch
      transfers.
    - >
      2020: Added Django and Laravel integrations, parallel jobs, trigger controls, and
      Amazon RDS support.
    - '2024-07-10: Version 0.8.0 added a Linux ARM64 Docker image.'
  usage:
    - >
      Running `pgsync --init` in a project creates `.pgsync.yml`; named database
      configurations use `.pgsync-<database>.yml`. Commands search from the working
      directory through parent directories for configuration.
    - >
      Users can synchronize all data, selected tables, filtered records, or named
      groups; optionally preserve or truncate destination rows, transfer schemas, defer
      constraints, and resume large append-only backfills.
    - >
      Data rules can replace or null sensitive fields on the source server, and the
      destination is restricted to localhost by default unless explicitly marked safe.
category: data
package-manager:
  brew: pgsync
  nix: pgsync
package-manager-url: https://formulae.brew.sh/formula/pgsync
license: MIT
tags:
  - cli
  - data-transfer
  - database-sync
  - postgresql
description: Sync Postgres data between databases
executables:
  - pgsync
provenance:
  formula: pgsync
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
