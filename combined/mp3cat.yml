config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The distinctive feature is the "mp3dir" workflow. Instead of producing one file,
      mp3cat can append valid frames to current.mp3 and rotate timestamped segment files
      after a size threshold. The same format can be read like a following log: mp3cat
      waits at the end of current.mp3, notices rotations, and continues from the next
      file. The accompanying tools, including mp3log-conf and mp3stream-conf, place it
      in the same practical niche as daemontools-style audio logging and simple MP3
      streaming.
  sources:
    - https://formulae.brew.sh/formula/mp3cat
    - https://github.com/tomclegg/mp3cat
    - https://tomclegg.ca/mp3cat
  summary:
    - >
      mp3cat is a small Unix-style MP3 stream utility distributed from Tom Clegg's site
      and GitHub repository. Its core behavior is deliberately narrow: it copies a byte
      stream while skipping everything except MP3 frames with valid headers, so it can
      clean concatenated or noisy input and write the remaining frames to standard
      output or to its own directory format.
  usage:
    - >
      The project page says the software was written for Kootenay Cooperative Radio in
      Nelson, British Columbia, and presents a live-radio use case: record from a sound
      card into an mp3dir, clean old segments, and stream the directory to network
      clients. In package managers it is a niche command-line audio utility rather than
      a general editor or encoder; Homebrew describes it simply as a tool that reads and
      writes MP3 files.
