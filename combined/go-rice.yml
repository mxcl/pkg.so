id: brew:go-rice
display-name: go.rice
homepage: https://github.com/GeertJohan/go.rice
repo: https://github.com/GeertJohan/go.rice
docs:
  - https://github.com/GeertJohan/go.rice#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      go.rice became one of the named tools in the pre-embed era of Go asset packaging.
      The Go project's later embed design documents described the broader ecosystem
      problem as one with many tools that required a manual generation step, the same
      workflow category that go.rice served.
  package-nerd-significance:
    - >
      The Homebrew formula matters because it exposes the rice executable as a small
      packaging-time helper for Go programs that predate or cannot yet use the standard
      //go:embed workflow.
  project-history:
    - >
      The public repository for go.rice was created in 2013 by GeertJohan, during the
      period when Go projects commonly used external generators to ship self-contained
      binaries with static assets. Its README describes a development/deployment split:
      during development it reads resources from disk, while the rice tool can embed
      generated Go source or append a zip payload to a built executable for deployment.
  related-projects:
    - >
      Related Go asset-embedding tools include statik and the standard library embed
      package introduced in Go 1.16.
  sources:
    - https://api.github.com/repos/GeertJohan/go.rice
    - https://formulae.brew.sh/formula/go-rice
    - https://github.com/GeertJohan/go.rice
    - https://go.dev/doc/go1.16
    - https://go.googlesource.com/proposal/+/master/design/draft-embed.md
  summary:
    - >
      go.rice is a Go resource-embedding library and command-line tool for bundling web
      assets, templates, and other static files into Go programs.
  timeline:
    - '2013: GitHub repository created for go.rice.'
    - >
      2021: Go 1.16 added standard static-file embedding through //go:embed, changing
      the ecosystem around tools such as go.rice.
  usage:
    - >
      Practitioners use go.rice by declaring boxes such as rice.FindBox("html-files"),
      serving them through HTTP helpers, reading template strings, and running rice
      embed-go or rice append before distributing a standalone executable.
related-packages:
  - id: brew:go-statik
    reason: >
      Choose statik when a generated Go package exposed as an http.FileSystem is
      preferable to go.rice's named boxes and embed-or-append deployment choices.
    rel: alternative
    sources:
      - https://github.com/rakyll/statik
      - https://github.com/GeertJohan/go.rice
category: developer-tools
package-manager:
  brew: go-rice
  nix: go-rice
package-manager-url: https://formulae.brew.sh/formula/go-rice
license: BSD-2-Clause
