id: brew:consul-backinator
display-name: consul-backinator
homepage: https://github.com/myENA/consul-backinator
repo: https://github.com/myENA/consul-backinator
docs:
  - https://github.com/myENA/consul-backinator#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears niche and ops-focused. The README documents Homebrew
      installation, go get, source builds, Docker Hub images, and Nomad job usage, while
      the input package metadata lists only Homebrew among package managers.
  package-nerd-significance:
    - >
      consul-backinator is significant as a package because it fills a gap around Consul
      disaster recovery workflows. It also shows the 2010s pattern of shipping a Go ops
      tool simultaneously as a single binary, Homebrew formula, Docker image, and Nomad
      job.
  project-history:
    - >
      The upstream README describes consul-backinator as a flexible Consul KV backup and
      restore tool written in Go using the official Consul API. Its first tagged GitHub
      release is labeled v1.0 and was published in June 2016.
    - >
      The tool grew around practical backup concerns: gzip-compressed JSON payloads,
      AES-256 encryption, HMAC-SHA256 validation, path transformation, S3 support,
      Docker images, Nomad usage, ACL backup, and prepared-query backup.
  related-projects:
    - Consul is the backing service.
    - >
      The README credits HashiCorp's Consul daemon, Consul API, and Go package, and
      mentions go-discover for cloud node discovery.
  sources:
    - https://github.com/myENA/consul-backinator
    - https://github.com/myENA/consul-backinator/releases/tag/v1.0
  summary:
    - >
      consul-backinator is a Go utility for backing up and restoring Consul data,
      especially KV pairs, ACL tokens, and prepared queries. It is an operations-side
      companion to Consul rather than a HashiCorp core project.
  timeline:
    - '2016: GitHub release v1.0 is tagged as the first tagged release.'
    - >
      2016: README examples show backup output dated May 2016 and document Homebrew, Go,
      Docker, and Nomad installation paths.
  usage:
    - >
      Operators use the backup, restore, and dump subcommands. The README documents
      Consul connection settings through flags and environment variables, optional S3
      URIs, encryption keys, signatures, ACL files, prepared queries, and destructive
      restore safeguards.
related-packages:
  - id: cask:consul
    reason: >
      Consul's built-in snapshot commands are the official alternative for atomic
      disaster-recovery snapshots of full server state; choose consul-backinator when
      selective KV, ACL, or prepared-query backups, transformations, encrypted JSON, or
      its direct S3 workflow are required.
    rel: alternative
    sources:
      - https://developer.hashicorp.com/consul/commands/snapshot
      - https://github.com/myENA/consul-backinator#readme
category: cloud-infrastructure
