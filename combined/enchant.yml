id: brew:enchant
display-name: Enchant
homepage: https://rrthomas.github.io/enchant/
repo: https://github.com/rrthomas/enchant
docs:
  - https://github.com/rrthomas/enchant#readme
  - https://rrthomas.github.io/enchant
config-file-location:
  unix:
    - $ENCHANT_CONFIG_DIR/enchant.ordering
    - $XDG_CONFIG_HOME/enchant/enchant.ordering
    - ~/.config/enchant/enchant.ordering
credentials-file-location: null
history:
  adoption-history:
    - >
      Enchant became valuable because desktop and editor software need spell checking
      without hard-coding one spelling engine. The project homepage lists GNU Emacs as
      of version 27.1, AbiWord, LyX, and Gtk/GNOME applications through gspell and
      GtkSpell as users.
    - >
      The backend list also explains why distributions package it carefully:
      language-specific and platform-specific spell checkers can coexist behind one API,
      so a package manager can wire applications to available dictionaries and providers
      without each application growing its own compatibility layer.
  package-nerd-significance:
    - >
      Enchant is package-nerd glue: it does not win by having the best dictionary
      itself, but by keeping spell-checking consumers decoupled from provider churn. It
      is the kind of library that makes desktop text stacks less brittle across Linux,
      BSD, macOS, and language-specific dictionary packages.
    - >
      Its current NEWS also shows the maintenance burden typical of ecosystem glue
      packages: recent releases fix provider crashes, command-line compatibility,
      personal word list behavior, relocatability, and editor-facing quirks rather than
      flashy features.
  project-history:
    - >
      Enchant began in the AbiWord ecosystem; the project homepage credits Dom Lachowicz
      and says older versions remain available from the AbiSource website. The NEWS file
      shows a long 1.x history, including 1.6.0 in 2010, followed by 2.0.0 in 2017.
    - >
      In 2025, release 2.8.3 marked Enchant's move from the defunct AbiWord project to
      direct maintenance by Reuben Thomas. The same release also rewrote the two
      command-line utilities in Vala and noted that Enchant's core had moved to Vala
      while providers remained a mix of C, C++, and Objective-C++.
  related-projects:
    - >
      Hunspell, Nuspell, GNU Aspell, Hspell, Voikko, AppleSpell, and Zemberek are
      documented spell-checking backends.
    - AbiWord, GNU Emacs, LyX, gspell, and GtkSpell are listed users or integration paths.
    - >
      Python, Rust, Go, Common Lisp, C, C++, and Vala bindings or language connections
      are documented on the project homepage.
  sources:
    - https://rrthomas.github.io/enchant
    - https://raw.githubusercontent.com/rrthomas/enchant/master/README.md
    - https://raw.githubusercontent.com/rrthomas/enchant/master/NEWS
    - https://github.com/rrthomas/enchant
    - https://api.github.com/repos/rrthomas/enchant
  summary:
    - >
      Enchant is a provider-neutral spell-checking library and command-line program. Its
      purpose is to let applications use Hunspell, Nuspell, Aspell, Hspell, Voikko,
      AppleSpell, Zemberek, and other providers through one consistent interface.
  timeline:
    - 'Early releases: Enchant originated under the AbiWord/AbiSource umbrella.'
    - '2010: Enchant 1.6.0 released.'
    - '2017: Enchant 2.0.0 released.'
    - '2025: Enchant 2.8.3 moved maintenance from defunct AbiWord affiliation to Reuben Thomas.'
    - '2026: Enchant 2.8.x releases continued active maintenance for CLI and provider behavior.'
  usage:
    - >
      Application developers link against libenchant through C or C++ bindings, while
      users and scripts can call `enchant-2` for Ispell-compatible non-interactive spell
      checking. `enchant-lsmod-2` reports available providers and dictionaries.
    - >
      Configuration is documented through the `enchant(5)` man page, which controls
      provider selection by language and personal word lists. That makes Enchant both a
      developer library and a small user-facing CLI package.
related-packages:
  - id: brew:hunspell
    reason: >
      Use Hunspell as a widely deployed dictionary and morphology engine behind Enchant;
      Enchant officially lists it as a supported provider.
    rel: adjacent_workflow
    sources:
      - https://rrthomas.github.io/enchant/
      - https://hunspell.github.io/
  - id: brew:nuspell
    reason: >
      Use Nuspell behind Enchant when you want a modern C++ spell-checking engine
      compatible with Hunspell dictionaries.
    rel: adjacent_workflow
    sources:
      - https://rrthomas.github.io/enchant/
      - https://nuspell.github.io/documentation.html
  - id: brew:aspell
    reason: >
      Use GNU Aspell as another Enchant backend, particularly when its interactive
      spelling tools and native dictionary ecosystem fit the workflow.
    rel: adjacent_workflow
    sources:
      - https://rrthomas.github.io/enchant/
      - http://aspell.net/man-html/Introduction.html
  - id: brew:gspell
    reason: >
      Use gspell when adding spell checking to GTK applications; Enchant identifies
      gspell as an application-layer integration through which GTK/GNOME software
      consumes Enchant providers.
    rel: adjacent_workflow
    sources:
      - https://rrthomas.github.io/enchant/
      - https://gitlab.gnome.org/GNOME/gspell
category: developer-tools
package-manager:
  brew: enchant
  debian: enchant-2
  dnf: enchant
  macports: enchant
  nix: enchant
  pacman: enchant
  ubuntu: enchant-2
  zypper: enchant-2-backend-aspell
package-manager-url: https://formulae.brew.sh/formula/enchant
