id: brew:dolt
display-name: Dolt
homepage: https://www.dolthub.com
repo: https://github.com/dolthub/dolt
docs:
  - https://docs.dolthub.com/
config-file-location:
  unix:
    - ~/.dolt/config_global.json
    - .dolt/config.json
credentials-file-location:
  unix: ~/.dolt/creds/*.jwk
history:
  adoption-history:
    - >
      Dolt is packaged unusually widely for a database engine with version-control
      semantics. The official README documents direct release installs, Homebrew, Arch
      Linux official repositories, MacPorts, Windows installers, Chocolatey, Docker
      images, and source builds; the package metadata also lists additional package
      managers such as Nix, Scoop, Winget, and apk.
    - >
      Its adoption story is tied to a specific audience: data engineers, analysts, and
      application developers who want data changes to have branch, diff, blame, merge,
      and remote workflows instead of living only inside dumps, migrations, or opaque
      database snapshots.
  package-nerd-significance:
    - >
      Dolt is significant because it bends two familiar package categories into one
      installable tool: a database binary and a Git-like version-control CLI. For
      package nerds, it is a rare case where the command name, storage engine, server
      mode, and hosted ecosystem all revolve around one data-versioning model.
    - >
      It also demonstrates a modern database project that treats command-line ergonomics
      as central. Installing dolt gives users both a database server and a VCS-shaped
      toolbox, which is why it shows up across OS package managers rather than only as a
      server image.
  project-history:
    - >
      The Dolt repository was created in July 2019 and its README has long summarized
      the project as Git for Data. The core idea is simple and unusual: Git versions
      files, while Dolt versions tables.
    - >
      The earliest listed GitHub release in the current release stream is v0.9.7 from
      August 2019. By 2026, Dolt had reached the 2.x series with frequent releases,
      showing a long-lived database engine rather than a one-off CLI experiment.
    - >
      Dolt's project surface expanded into a broader DoltHub ecosystem. The README
      points to DoltHub for sharing public databases, DoltLab for self-hosting a
      DoltHub-like service, Hosted Dolt for managed servers, and Doltgres as the related
      Postgres-flavored project.
  related-projects:
    - >
      Dolt is closely related to DoltHub, DoltLab, Hosted Dolt, and Doltgres.
      Conceptually it also sits between Git, MySQL-compatible databases, data
      version-control systems, and hosted dataset-sharing platforms.
  sources:
    - https://github.com/dolthub/dolt#readme
    - https://api.github.com/repos/dolthub/dolt
    - https://github.com/dolthub/dolt/releases/tag/v0.9.7
    - https://github.com/dolthub/dolt/releases/tag/v2.1.10
  summary:
    - >
      Dolt is a version-controlled SQL database: it gives tables Git-like clone, branch,
      diff, merge, push, and pull workflows while exposing a MySQL-compatible server and
      client experience.
  timeline:
    - '2019: Dolt repository created and v0.9.7 released.'
    - '2020: Dolt continued frequent 0.x releases while maturing the database format and CLI.'
    - '2024: README points users to published use cases and a broader DoltHub ecosystem.'
    - '2026: v2.1.10 released, with active development continuing in late June.'
  usage:
    - >
      Dolt can be used as a Git-like CLI in a data repository, a SQL query tool, or a
      MySQL-compatible server. The README lists familiar commands such as init, status,
      add, diff, commit, log, branch, checkout, merge, clone, fetch, pull, push, remote,
      tag, and blame alongside SQL-specific commands.
    - >
      A typical workflow imports or edits tables, stages table changes, commits them,
      branches for experiments, merges teammate changes, and pushes or pulls from a
      remote. The same data can also be served to MySQL clients through dolt sql-server.
related-packages: []
category: data
package-manager:
  apk: dolt
  brew: dolt
  chocolatey: dolt
  macports: dolt
  nix: dolt
  pacman: dolt
  scoop: main/dolt
  winget: DoltHub.Dolt
package-manager-url: https://formulae.brew.sh/formula/dolt
license: Apache-2.0
tags:
  - cli
  - data-versioning
  - database
  - sql
  - version-control
description: Git for Data
executables:
  - dolt
provenance:
  formula: dolt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
