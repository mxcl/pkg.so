id: brew:detox
display-name: detox
homepage: https://detox.sourceforge.net/
repo: https://github.com/dharple/detox
docs:
  - https://detox.sourceforge.net/
  - https://github.com/dharple/detox#readme
config-file-location:
  unix:
    - ~/.detoxrc
    - /etc/detoxrc
    - /usr/local/etc/detoxrc
credentials-file-location: null
history:
  adoption-history:
    - >
      detox became a package-manager utility for users with messy download, transfer,
      media, or archival directories. Its README explicitly notes that many
      distributions include detox, and its package-manager footprint spans Homebrew,
      Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, and Nix-style ecosystems in the
      supplied facts.
  package-nerd-significance:
    - >
      detox is package-nerd bait because it is a small C utility that encodes decades of
      shell pain around filenames. Its 2.0 and 3.0 changes are also a tidy example of
      Unix tools adapting from ASCII-centric transliteration toward UTF-8-preserving
      behavior.
  project-history:
    - >
      Doug Harple's man page says detox began as a way to clean up files received from
      other operating systems, where spaces, parentheses, brackets, ampersands, and
      similar characters were easy to create but annoying in FreeBSD and Linux shells.
      The GitHub repository preserves older 1.x releases and modernized 2.x and 3.x
      lines.
  related-projects:
    - >
      The project belongs near renameutils, convmv, iconv-driven scripts, shell-safe
      filename tools, and other Unix file hygiene utilities.
  sources:
    - https://github.com/dharple/detox
    - https://github.com/dharple/detox/blob/main/README.md
    - https://github.com/dharple/detox/blob/main/CHANGELOG.md
    - https://github.com/dharple/detox/blob/main/man/detox.1
    - https://api.github.com/repos/dharple/detox
  summary:
    - >
      detox is a Unix-style filename cleanup utility. Its README and man page describe
      replacing awkward or unsafe filename characters, transcoding legacy encodings such
      as ISO-8859-1 and CP-1252 to UTF-8, and previewing changes with dry-run mode.
  timeline:
    - '2008: GitHub release v1.2.0 is labeled as a legacy release from 2008.'
    - '2017: v1.3.0 migrated the build to the full autoconf suite.'
    - >
      2021: 2.0.0-beta1 changed default transliteration behavior and added built-in
      config support.
    - '2024: 2.0.0 added XDG_CONFIG_HOME lookup and merged v1.4.5.'
    - '2025: 3.0.0 removed most transliteration from the default Unicode tables.'
  usage:
    - >
      The usual workflow is cautious batch renaming: run detox -n or --dry-run first,
      then apply a sequence to one file, a directory, or a recursive tree. The man page
      documents system and user detoxrc files for custom sequences and translation
      tables.
related-packages:
  - id: brew:convmv
    reason: >
      Choose convmv when the primary job is converting filename character encodings or
      Unicode normalization forms; unlike detox, it previews changes by default and
      requires --notest to rename.
    rel: alternative
    sources:
      - https://github.com/dharple/detox
      - https://www.j3e.de/linux/convmv/man/
  - id: brew:renameutils
    reason: >
      Choose renameutils when you want to edit a batch of proposed filenames in a text
      editor or perform interactive renames instead of applying detox's configured
      character-replacement sequences.
    rel: alternative
    sources:
      - https://github.com/dharple/detox
      - https://www.nongnu.org/renameutils/
category: system
package-manager:
  apk: detox
  brew: detox
  debian: detox
  dnf: detox
  macports: detox
  nix: detox
  pacman: detox
  ubuntu: detox
package-manager-url: https://formulae.brew.sh/formula/detox
license: BSD-3-Clause
tags:
  - cleanup
  - cli
  - file-renaming
  - filenames
  - unix
description: Utility to replace problematic characters in filenames
executables:
  - detox
  - inline-detox
provenance:
  formula: detox
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
