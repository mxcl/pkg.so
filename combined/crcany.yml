id: brew:crcany
display-name: crcany
homepage: https://github.com/madler/crcany
repo: https://github.com/madler/crcany
docs:
  - https://github.com/madler/crcany#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      crcany is specialized infrastructure software rather than a broad end-user CLI.
      Its package appeal comes from bundling reference CRC definitions, code generation,
      test tooling, and small executables that can be built with make.
  package-nerd-significance:
    - >
      For maintainers and systems programmers, crcany matters because it turns CRC
      catalogue data into reproducible C implementations and tests. That makes it useful
      as both a command-line tool and a source-code generator for packages that need
      exact checksum behavior.
  project-history:
    - >
      The madler/crcany repository was created in 2016. Its README describes the project
      as a definitive reference for computing and combining any CRC with bit-at-a-time,
      byte-at-a-time, or word-at-a-time algorithms on big- or little-endian
      architectures.
  related-projects:
    - >
      The README explicitly references Greg Cook's CRC catalogue and Ross Williams's CRC
      tutorial as the parameter and background sources that crcany consumes.
  sources:
    - https://github.com/madler/crcany
    - https://github.com/madler/crcany#readme
    - https://github.com/madler/crcany/tags
    - https://github.com/madler/crcany/commit/e24f7b2b5daea125848e1a0eb2fa5042b3872461
    - https://github.com/madler/crcany/commit/41db4b35905f695410dfa76101116b16a486d393
  summary:
    - >
      crcany is Mark Adler's suite of programs for computing arbitrary CRCs and
      generating C code for efficient CRC calculation and combination.
  timeline:
    - '2016: madler/crcany repository created.'
    - '2020: crcany 2.0 commit present in the official repository.'
    - '2021: crcany 2.1 commit present in the official repository.'
  usage:
    - >
      The suite can compute CRCs from named catalogue parameters, combine CRCs from byte
      sequences, and generate .c and .h files for one or more CRC definitions. The
      README also documents a make test target that checks calculations and generated
      code against catalogued CRCs.
related-packages: []
category: developer-tools
package-manager:
  brew: crcany
package-manager-url: https://formulae.brew.sh/formula/crcany
license: Zlib
tags:
  - c
  - checksum
  - cli
  - code-generation
  - crc
description: Compute any CRC, a bit at a time, a byte at a time, and a word at a time
executables:
  - crcany
provenance:
