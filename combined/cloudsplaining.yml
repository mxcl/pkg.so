id: brew:cloudsplaining
display-name: Cloudsplaining
homepage: https://cloudsplaining.readthedocs.io/en/latest/
repo: https://github.com/salesforce/cloudsplaining
docs:
  - https://cloudsplaining.readthedocs.io/en/latest
  - https://github.com/salesforce/cloudsplaining#readme
config-file-location:
  unix: ./exclusions.yml
credentials-file-location:
  unix: ~/.aws/credentials
history:
  adoption-history:
    - >
      The upstream README documents installation through pip and Homebrew, including
      Salesforce's Homebrew tap, making it easy to put the scanner into Unix security
      and cloud-audit workflows.
    - >
      Its adoption niche is AWS security engineering, penetration testing, and
      compliance review: it focuses on practical IAM risks such as data exfiltration,
      infrastructure modification, resource exposure, privilege escalation, and
      credentials exposure.
  package-nerd-significance:
    - >
      Cloudsplaining is a good example of a cloud-security Python tool packaged for both
      pip and Homebrew: it turns a cloud API audit into a repeatable shell command that
      can live in developer laptops, CI jobs, and consulting toolkits.
  project-history:
    - >
      The project was created as a companion to Salesforce's Policy Sentry work: the
      README explains that Policy Sentry made least-privilege policy creation easier,
      but existing AWS accounts still had large backlogs of broad IAM policies that
      needed assessment.
    - >
      Cloudsplaining's public release stream began in 2020, with the GitHub releases
      page marking version 0.0.2 as the open source release. The tool's core model has
      remained a CLI workflow that downloads AWS IAM account authorization details,
      scans them, and emits HTML plus JSON results.
  related-projects:
    - >
      Policy Sentry is the closest related Salesforce project and is cited in the README
      as the motivation for Cloudsplaining.
    - >
      Cloudsplaining also intersects with AWS IAM, AWS SecurityAudit-style permissions,
      and IAM privilege-escalation research such as Pathfinding.cloud.
  sources:
    - https://github.com/salesforce/cloudsplaining#readme
    - https://cloudsplaining.readthedocs.io/en/latest/
    - https://github.com/salesforce/cloudsplaining/releases
  summary:
    - >
      Cloudsplaining is a Salesforce open source command-line tool for auditing AWS IAM
      policies and producing risk-prioritized least-privilege reports.
  timeline:
    - '2020: Version 0.0.2 was published as the open source release on GitHub.'
    - >
      2020: Early releases added HTML report improvements, recursive scanning,
      trust-policy reporting, and automated Homebrew updates.
    - '2020: The README documented both pip and Homebrew installation paths.'
  usage:
    - >
      Typical use starts with configured AWS credentials, `cloudsplaining download` to
      collect account authorization details, `cloudsplaining create-exclusions-file` to
      generate `exclusions.yml`, and `cloudsplaining scan` to generate reports.
    - >
      The CLI can also scan a single IAM policy file, which makes it useful both for
      full-account audits and for reviewing individual policy documents during
      development.
related-packages:
  - id: brew:scoutsuite
    reason: >
      Choose Scout Suite for a broader point-in-time audit across AWS and other cloud
      providers; choose Cloudsplaining for focused AWS IAM least-privilege and
      privilege-escalation analysis.
    rel: alternative
    sources:
      - https://github.com/nccgroup/ScoutSuite
      - https://github.com/nccgroup/ScoutSuite/wiki
      - https://cloudsplaining.readthedocs.io/en/latest/user-guide/overview/
category: security
package-manager:
  brew: cloudsplaining
package-manager-url: https://formulae.brew.sh/formula/cloudsplaining
license: BSD-3-Clause
tags:
  - aws
  - cli
  - iam
  - least-privilege
  - policy-analysis
  - security-assessment
description: AWS IAM Security Assessment tool
executables:
  - cloudsplaining
provenance:
  formula: cloudsplaining
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
