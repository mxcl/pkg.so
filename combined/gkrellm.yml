id: brew:gkrellm
display-name: GKrellM
homepage: https://billw2.github.io/gkrellm/gkrellm.html
repo: http://git.srcbox.net/gkrellm
docs:
  - https://billw2.github.io/gkrellm/gkrellm.html
config-file-location:
  unix:
    - ~/.gkrellm2/user-config
    - ~/.gkrellm2/theme_config
    - ~/.gkrellm2/plugin_enable
    - ~/.gkrellm2/plugin_placement
    - ~/.gkrellm2/themes/*/gkrellmrc
    - ~/.gkrellmd.conf
    - /etc/gkrellmd.conf
    - /usr/local/etc/gkrellmd.conf
credentials-file-location:
  unix: ~/.gkrellm2/user-config
history:
  adoption-history:
    - >
      GKrellM's adoption came from Unix desktop users who wanted always-visible local
      telemetry before dashboard web apps became common. The official page points to
      theme documentation, plugins, screenshots, and mailing-list archives, which
      reflects a desktop community built around customization.
    - >
      Package metadata in this batch shows GKrellM packaged by Homebrew, Debian, Fedora,
      MacPorts, Nix, Ubuntu, and openSUSE. That spread is typical for a long-lived GTK
      utility that remained useful to desktop and workstation users across Unix-like
      systems.
  package-nerd-significance:
    - >
      GKrellM matters because it is a durable example of old Unix desktop tooling that
      did many practical things in a small footprint. It packs sensors, mail, network,
      filesystems, plugins, theming, and remote collection into one GTK application.
    - >
      For packagers, it is interesting because it carries desktop UI dependencies,
      optional sensor and TLS features, daemon installation, translations, plugins, and
      platform-specific build paths in one compact package.
  project-history:
    - >
      The official release README identifies Bill Wilson as author, Stefan Gehn as
      maintainer, and gives copyright years beginning in 1999. It describes GKrellM as
      GNU or Gtk Krell Monitors, a single process that manages multiple stacked monitors
      and supports themes.
    - >
      GKrellM evolved in the classic GTK desktop-monitor tradition: dense visual meters,
      configurable alarms, click actions, mailbox checks, hardware sensors, and many
      themes. Its official page emphasizes matching the user's window manager or GTK
      theme and reducing system load by putting many monitors into one process.
    - >
      The maintained source release history shows long-lived care for portability and
      packaging. Later releases added OpenSSL and GnuTLS updates, systemd service files
      for gkrellmd, Meson build rules, macOS build choices, Solaris and BSD fixes,
      Windows fixes, and modern compiler compatibility.
  related-projects:
    - GTK is the UI toolkit used by GKrellM.
    - gkrellmd is the companion server for remote monitoring.
    - >
      lm_sensors, sysfs sensors, mbmon, hddtemp, and nvidia-settings are named sensor
      data sources.
    - GKrellM plugins and themes form the surrounding customization ecosystem.
  sources:
    - https://billw2.github.io/gkrellm/gkrellm.html
    - https://formulae.brew.sh/formula/gkrellm
    - https://gkrellm.srcbox.net/releases/gkrellm-2.5.1.tar.bz2
  summary:
    - >
      GKrellM is an extensible GTK system-monitoring application built around a vertical
      stack of small monitors. It shows CPU, disk, network, memory, swap, sensors, file
      systems, mail, battery, uptime, and other host data in one themed process, with
      plugins and a gkrellmd server for remote monitoring.
  timeline:
    - "1999: The release README's copyright range begins, identifying the early project era."
    - '2010: GKrellM 2.3.5 documents portability, IPv6, mail, and build fixes.'
    - '2016: GKrellM 2.3.8 through 2.3.10 add disk, network, Pango, and NVMe-related fixes.'
    - '2019: GKrellM 2.3.11 updates OpenSSL support and fixes disk-formatting safety issues.'
    - >
      2025: GKrellM 2.4.0 and 2.5.0 modernize service installation, TLS support, Meson
      builds, and platform support.
    - >
      2026: GKrellM 2.5.1 fixes Windows, Solaris, DragonFlyBSD, FreeBSD, Linux, macOS,
      and Meson build issues.
  usage:
    - >
      Practitioners run gkrellm as a desktop monitor or gkrellmd as a data-collection
      server. The client can connect to a remote gkrellmd host, which lets users watch
      another machine with the same compact panel interface.
    - >
      Users configure themes, sensor warnings, chart behavior, mail checks, mount
      buttons, click commands, and plugins through files under the GKrellM configuration
      directory. The result is closer to a personalized instrument panel than a generic
      metrics dashboard.
related-packages:
  - id: brew:lm-sensors
    reason: >
      On Linux, GKrellM can display temperatures, voltages, and fan readings supplied
      through lm-sensors and the kernel hardware-monitoring interfaces.
    rel: adjacent_workflow
    sources:
      - https://billw2.github.io/gkrellm/gkrellm.html
      - https://github.com/lm-sensors/lm-sensors#readme
category: system
package-manager:
  brew: gkrellm
  debian: gkrellm
  dnf: gkrellm
  macports: gkrellm
  ubuntu: gkrellm
  zypper: gkrellm
package-manager-url: https://formulae.brew.sh/formula/gkrellm
license: GPL-3.0-or-later
tags:
  - cli
  - desktop
  - gtk
  - plugins
  - server-monitoring
  - system-monitoring
description: Extensible GTK system monitoring application
executables:
  - gkrellm
  - gkrellmd
provenance:
  formula: gkrellm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
