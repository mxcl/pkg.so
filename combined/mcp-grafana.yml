id: brew:mcp-grafana
display-name: mcp-grafana
homepage: https://github.com/grafana/mcp-grafana
repo: https://github.com/grafana/mcp-grafana
docs:
  - https://grafana.com/docs/grafana/latest/developer-resources/mcp
  - https://grafana.com/docs/grafana/latest/developer-resources/mcp/guides
  - https://github.com/grafana/mcp-grafana#readme
config-file-location: null
credentials-file-location:
  unix: /var/run/secrets/grafana/token
history:
  adoption-history:
    - >
      By July 2026, official GitHub metadata showed thousands of stars and hundreds of
      forks, while the supplied package-manager facts list Homebrew and Nix packaging.
      Its placement under the Grafana organization gives it first-party visibility that
      most MCP servers do not have.
    - >
      The project reflects a broader shift in observability tooling: instead of only
      exposing dashboards through browser UI and APIs, Grafana can be queried and
      modified through AI clients using a local or hosted MCP server.
  package-nerd-significance:
    - >
      mcp-grafana is significant because it is a first-party MCP server from a major
      observability vendor, not just a community adapter. For package managers, that
      means a fast-moving operational tool with real deployment modes: uvx for local
      clients, Docker for containers, binaries for PATH installs, and Helm for clusters.
    - >
      It also shows how MCP packages can grow beyond simple CRUD wrappers into
      opinionated context-management tools, such as compact dashboard summaries and
      JSONPath dashboard property extraction to control model context size.
  project-history:
    - >
      The official GitHub repository was created in December 2024 and is maintained
      under the grafana organization with Apache-2.0 licensing. The project has
      first-party Grafana documentation as well as a GitHub README, Go package
      documentation, Docker image usage, binary releases, uvx startup, and a Helm chart
      route.
    - >
      The release stream grew quickly through 2025 and 2026, with GitHub releases such
      as v0.12.0 in April 2026 and v0.17.0 in June 2026. The README shows the server
      expanding beyond basic dashboard access into richer Grafana ecosystem coverage.
  related-projects:
    - >
      Related projects include Grafana, Grafana Cloud, Grafana OnCall, Grafana Incident,
      the Grafana Helm charts, and other observability-focused MCP servers.
  sources:
    - https://github.com/grafana/mcp-grafana
    - https://github.com/grafana/mcp-grafana#readme
    - https://github.com/grafana/mcp-grafana/releases
    - https://grafana.com/docs/grafana/latest/developer-resources/mcp
    - https://pkg.go.dev/github.com/grafana/mcp-grafana
    - source_facts.package-manager
  summary:
    - >
      mcp-grafana is Grafana Labs' Model Context Protocol server for Grafana. It exposes
      Grafana instances and related observability workflows to MCP-compatible clients
      through tools for dashboards, datasources, incidents, alerting, on-call data,
      snapshots, and more.
  timeline:
    - '2024-12: GitHub repository created under grafana.'
    - '2026-04: v0.12.0 release published.'
    - '2026-06: v0.17.0 release published.'
    - '2026-07: Repository metadata showed active maintenance and broad GitHub adoption.'
  usage:
    - >
      The README quick start configures an MCP client to run mcp-grafana with
      GRAFANA_URL and GRAFANA_SERVICE_ACCOUNT_TOKEN. It also documents token-file
      support through GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE, username/password
      alternatives, organization selection, custom headers, Docker, binary, Helm, and
      transport options.
    - >
      Documented tools cover dashboard retrieval and patching, datasource queries,
      Prometheus/Loki/CloudWatch/Athena/ClickHouse/Snowflake-related workflows,
      incidents, Sift investigations, alerting, OnCall, teams, roles, annotations,
      snapshots, rendering, and provisioning repository validation.
related-packages:
  - id: brew:grafana
    reason: >
      Grafana provides the dashboards, datasources, alerts, and other observability
      resources that mcp-grafana exposes to MCP clients.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/grafana/latest/ai-tools/mcp/
      - https://github.com/grafana/grafana
category: ai
package-manager:
  brew: mcp-grafana
  nix: mcp-grafana
package-manager-url: https://formulae.brew.sh/formula/mcp-grafana
license: Apache-2.0
tags:
  - ai
  - cli
  - dashboards
  - grafana
  - mcp
  - monitoring
  - observability
description: MCP server for Grafana
executables:
  - mcp-grafana
provenance:
  formula: mcp-grafana
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
