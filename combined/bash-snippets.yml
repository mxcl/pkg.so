id: brew:bash-snippets
display-name: bash-snippets
homepage: https://github.com/alexanderepstein/Bash-Snippets
repo: https://github.com/alexanderepstein/Bash-Snippets
docs:
  - https://github.com/alexanderepstein/Bash-Snippets/blob/master/gist/README.md
  - https://github.com/alexanderepstein/Bash-Snippets#readme
config-file-location:
  unix: ~/.config/gist.conf
credentials-file-location:
  unix: ~/.config/gist.conf
history:
  adoption-history:
    - >
      Adoption is visible mainly through packaging and the number of bundled commands.
      The batch input lists Homebrew and Nix packages, and also notes a Winget mapping
      for the `crypt` tool. That split reflects how individual snippets can become
      useful enough to travel separately from the original collection.
    - >
      The repository's tag list shows a long v1.x series, indicating incremental
      releases rather than a single one-off script dump.
  package-nerd-significance:
    - >
      bash-snippets is not historically central like Bash itself, but it is package-nerd
      significant as a specimen of the shell-script bundle. Package managers turn a
      loose collection of personal productivity scripts into a repeatable installable
      toolset, while also surfacing the maintenance risk of API-backed scripts whose
      external services can change.
    - >
      It also captures a particular era of command-line culture: small Bash wrappers
      over web APIs, clipboard-friendly transformations, and terminal toys packaged as
      serious conveniences.
  project-history:
    - >
      The official README presents Bash-Snippets as a dependency-light collection of
      small Bash scripts tested on macOS and Linux, with some Windows 10 testing in the
      official developer Bash instance. The project ships many independent commands,
      including `crypt`, `currency`, `geo`, `gist`, `lyrics`, `meme`, `movies`,
      `newton`, `qrify`, `stocks`, `transfer`, and `ytview`.
    - >
      The project is community-script shaped rather than framework shaped. The README
      includes per-tool sections, screenshots, author credits for individual tools, and
      a maintainer note asking for help, which is typical for a useful personal toolkit
      that grew into a packaged collection.
  related-projects:
    - >
      Related projects are the tools and services wrapped by the snippets: OpenSSL for
      `crypt`, GitHub Gist for `gist`, transfer.sh-style upload workflows, QR generation
      services, and other small Unix command-line helpers.
  sources:
    - >
      Official README describes Bash-Snippets as small Bash scripts for heavy terminal
      users with no dependencies.
    - >
      Official README documents macOS/Linux testing, partial Windows testing, bundled
      tools, examples, and maintainer note.
    - Official gist README documents `~/.config/gist.conf` usage.
    - Official tag list shows a v1.x release series.
    - input.source_facts.package-manager lists Homebrew, Nix, and Winget package mappings.
  summary:
    - >
      bash-snippets is a collection of small Bash scripts for terminal-heavy users. Its
      package-manager identity is a grab bag of shell conveniences: install once, get
      many tiny commands for weather-like lookups, media, crypto, QR codes, GitHub
      gists, file transfer, and other everyday terminal tasks.
  timeline:
    - '2010s: Bash-Snippets develops as a multi-command Bash toolkit for terminal users.'
    - '2010s: v1.0.0 and subsequent v1.x tags establish release packaging.'
    - '2020s: Homebrew and Nix package the collection; Winget maps the `crypt` tool separately.'
  usage:
    - >
      Users install the package to put the bundled scripts on PATH, then call the
      individual commands directly. The README documents examples such as encrypting and
      decrypting files with `crypt`, converting currencies with `currency`, managing
      GitHub gists with `gist`, generating QR codes with `qrify`, and uploading files
      with `transfer`.
    - >
      The `gist` tool is the notable credentials surface: its official guide uses
      `~/.config/gist.conf` for GitHub-related configuration, so that file is both
      configuration and credential-bearing state.
related-packages: []
category: system
package-manager:
  brew: bash-snippets
  nix: bash-snippets
  winget: TheCryptTeam.Crypt
