id: brew:ldcli
display-name: LaunchDarkly CLI
homepage: https://launchdarkly.com/docs/home/getting-started/ldcli
repo: https://github.com/launchdarkly/ldcli
docs:
  - https://launchdarkly.com/docs/home/getting-started/ldcli
config-file-location:
  unix: $XDG_CONFIG_HOME/ldcli/config.yml
credentials-file-location:
  unix: $XDG_CONFIG_HOME/ldcli/config.yml
history:
  adoption-history:
    - >
      Adoption is concentrated among LaunchDarkly customers and automation workflows
      rather than the broader open-source CLI audience. Homebrew packaging makes it
      convenient for macOS developers and CI jobs that provision tools through Brew.
  package-nerd-significance:
    - >
      ldcli is a representative SaaS vendor CLI: small in package-manager terms, but
      important because it moves product administration into repeatable shell workflows.
  project-history:
    - >
      LaunchDarkly publishes ldcli from the launchdarkly GitHub organization under the
      Apache-2.0 license and documents it from the LaunchDarkly product documentation
      site.
    - >
      The public release tag history includes v0.0.1 in March 2024 and a 3.x release
      line after the early 0.x series, indicating a relatively recent CLI compared with
      older LaunchDarkly SDKs and support tools.
  related-projects:
    - >
      Related LaunchDarkly tools include ld-find-code-refs for code reference scanning
      and the broader LaunchDarkly SDK ecosystem.
  sources:
    - https://formulae.brew.sh/formula/ldcli
    - https://github.com/launchdarkly/ldcli
    - https://github.com/launchdarkly/ldcli/releases/tag/v0.0.1
    - https://launchdarkly.com/docs/home/getting-started/ldcli
  summary:
    - >
      LaunchDarkly CLI, distributed as ldcli, is LaunchDarkly's official command-line
      tool for creating, authenticating, and managing LaunchDarkly resources from a
      terminal.
  timeline:
    - '2024-03: Public v0.0.1 release tag appears in the LaunchDarkly ldcli repository.'
    - >
      2024: The early 0.x release sequence adds the initial Homebrew-distributed
      command-line workflow.
    - '2020s: A 3.x release line appears in the same public repository.'
  usage:
    - >
      The CLI is used to authenticate with LaunchDarkly and manage feature-flag-related
      resources from scripts or terminals. The curated configuration and credential path
      points to $XDG_CONFIG_HOME/ldcli/config.yml.
related-packages:
  - id: brew:ld-find-code-refs
    reason: >
      Use ld-find-code-refs alongside ldcli to scan repositories and publish
      code-reference data that helps LaunchDarkly users identify flag usage and removal
      readiness.
    rel: adjacent_workflow
    sources:
      - https://launchdarkly.com/docs/home/flags/code-references
      - https://github.com/launchdarkly/ld-find-code-refs
      - https://github.com/launchdarkly/ldcli
category: developer-tools
package-manager:
  brew: ldcli
package-manager-url: https://formulae.brew.sh/formula/ldcli
license: Apache-2.0
tags:
  - cli
  - developer-tools
  - feature-flags
  - launchdarkly
description: CLI for managing LaunchDarkly feature flags
executables:
  - ldcli
provenance:
  formula: ldcli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
