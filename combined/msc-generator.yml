id: brew:msc-generator
display-name: Msc-generator
homepage: https://gitlab.com/msc-generator/msc-generator
repo: https://gitlab.com/msc-generator/msc-generator
docs:
  - https://msc-generator.gitlab.io/msc-generator
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/msc-generator
    - https://gitlab.com/msc-generator/msc-generator/-/raw/master/README.md
    - https://msc-generator.gitlab.io/msc-generator/
  summary:
    - >
      Msc-generator grew out of the same text-to-diagram tradition as mscgen. Its own
      manual describes the signalling-chart engine as a heavily extended and completely
      rewritten version of Michael C. McTernan's mscgen 0.08, with the focus shifted
      from interprocess communication toward networking. It kept command-line
      compatibility with mscgen so tools wired to mscgen, including Doxygen workflows,
      could use Msc-generator as a drop-in renderer, and version 4.5 added a dedicated
      mscgen compatibility mode.
  usage:
    - >
      The project expanded beyond classic Message Sequence Charts. The README records a
      Windows GUI with OLE embedding in version 2.2, a new drawing engine in version
      3.0, Graphviz DOT graph support in version 5.0, a block-diagram language in
      version 6.0, a Linux and macOS GUI launched with `msc-gen --gui` in version 7.0,
      and a new Office-document embedding method in version 8.0. In practice, users
      write chart descriptions as text and render signalling charts, Graphviz-style
      graphs, or block diagrams through `msc-gen` or the GUI, with output suitable for
      documentation and Office documents. Its package niche is the richer successor to
      mscgen: heavier than the small original tool, but broader in chart types, GUI
      support, and document embedding.
related-packages:
  - id: brew:mscgen
    reason: >
      Choose mscgen for a small, focused MSC renderer; choose Msc-generator when you
      need its backward-compatible syntax plus richer charts, Graphviz graphs, GUIs, or
      Office embedding.
    rel: alternative
    sources:
      - https://msc-generator.gitlab.io/msc-generator/
      - https://www.mcternan.me.uk/mscgen/
