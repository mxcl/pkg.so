id: brew:deck
display-name: deck
homepage: https://github.com/k1LoW/deck
repo: https://github.com/k1LoW/deck
docs:
  - https://github.com/k1LoW/deck/tree/main/docs
  - https://github.com/k1LoW/deck#readme
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME:-$HOME/.config}/deck/config.yml
    - ${XDG_CONFIG_HOME:-$HOME/.config}/deck/config-{profile}.yml
credentials-file-location:
  unix:
    - ${XDG_DATA_HOME:-$HOME/.local/share}/deck/credentials.json
    - ${XDG_DATA_HOME:-$HOME/.local/share}/deck/credentials-{profile}.json
    - ${XDG_STATE_HOME:-$HOME/.local/state}/deck/token.json
    - ${XDG_STATE_HOME:-$HOME/.local/state}/deck/token-{profile}.json
history:
  adoption-history:
    - >
      The README documents Homebrew, `go install`, and manual release-binary
      installation. Formula metadata also shows packaging in Homebrew, Debian/Ubuntu,
      Nix, and winget contexts, while the official releases include cross-platform
      artifacts.
  package-nerd-significance:
    - >
      deck is a package-nerd-friendly productivity tool because it treats slide decks as
      editable, reproducible source material without asking users to abandon Google
      Slides as the rendering and collaboration surface. It also shows a modern Go CLI
      packaging pattern: Homebrew, `go install`, GitHub releases, and OS package
      artifacts.
  project-history:
    - >
      The GitHub repository was created in March 2025, and the README describes the
      project around continuous deck building and separation of Markdown content from
      Google Slides design. Its release stream moved quickly through many versions, with
      v1.24.0 published in June 2026.
  related-projects:
    - >
      Related projects include googleworkspace/md2googleslides for Markdown-to-Slides
      generation and Songmu/laminate for selecting code-block image generation commands.
  sources:
    - https://github.com/k1LoW/deck#readme
    - https://api.github.com/repos/k1LoW/deck
    - https://github.com/k1LoW/deck/releases/tag/v1.24.0
  summary:
    - >
      deck is a Go CLI for building Google Slides presentations from Markdown while
      keeping slide content and slide design separate. It is aimed at people who want
      versionable text sources and iterative updates against a real Google Slides deck.
  timeline:
    - '2025: Public GitHub repository created.'
    - >
      2025: README documented Markdown-to-Google-Slides workflow, OAuth setup, Homebrew
      installation, and release binaries.
    - '2026: v1.24.0 release published.'
  usage:
    - >
      Users configure Google OAuth client credentials, create or identify a Google
      Slides presentation, write slides in Markdown with YAML frontmatter, and run
      commands such as `deck new`, `deck apply`, `deck apply --watch`, `deck open`, and
      `deck ls-layouts`. Configuration can live in XDG config paths, while credentials
      and OAuth tokens live under XDG data and state paths.
related-packages:
  - id: brew:marp-cli
    reason: >
      Choose Marp CLI when Markdown should render directly to static HTML, PDF,
      PowerPoint, or images; choose deck when the destination must remain a native,
      collaboratively editable Google Slides presentation.
    rel: alternative
    sources:
      - https://github.com/k1LoW/deck#readme
      - https://github.com/marp-team/marp-cli#readme
category: productivity
package-manager:
  brew: deck
  debian: deck
  nix: deck
  ubuntu: deck
  winget: sfx101.deck
package-manager-url: https://formulae.brew.sh/formula/deck
license: MIT
tags:
  - automation
  - cli
  - google-slides
  - markdown
  - presentations
  - slides
description: Creates slide deck using Markdown and Google Slides
executables:
  - deck
provenance:
  formula: deck
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
