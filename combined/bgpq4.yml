id: brew:bgpq4
display-name: bgpq4
homepage: https://github.com/bgp/bgpq4
repo: https://github.com/bgp/bgpq4
docs:
  - https://github.com/bgp/bgpq4#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input metadata lists bgpq4 packages across Alpine, Homebrew, Debian,
      Fedora/DNF, Nix, and Ubuntu, and the upstream README includes a packaging-status
      badge. That breadth matters because bgpq4 is the sort of tool network engineers
      want available on jump hosts, CI runners, and laptops without hand-building it.
  package-nerd-significance:
    - >
      bgpq4 is a package-nerd favorite because it condenses a brittle BGP
      edge-operations task into a single auditable binary. It is small C code, has no
      daemon to operate, emits plain text suitable for config generation pipelines, and
      exists precisely where package managers shine: getting a boring but critical
      network-ops tool onto many Unix-like systems.
  project-history:
    - >
      The bgpq4 changelog explicitly records version 0.0.1 in 2019 as the point where
      bgpq3 was forked into bgpq4. The repository preserves older bgpq3 history back to
      the 2007 rewrite, but the bgpq4 line is documented as the post-2019 fork.
    - >
      Early bgpq4 releases removed legacy options, improved performance by using IRRd
      4's A query when available, and added Mikrotik support. Later releases reorganized
      the source tree, adopted OpenBSD-style formatting, reduced memory use with a
      red-black tree for ASN storage, and added outputs such as Junos as-path-origin,
      Nokia SR Linux, Mikrotik RouterOS v6/v7, Arista EOS, Huawei XPL, and other
      router-policy formats.
  related-projects:
    - >
      bgpq3 is the direct predecessor. The tool also lives beside IRRd, RADB-style IRR
      services, RPKI-aware workflows, and router stacks such as Cisco IOS/IOS XR, JunOS,
      BIRD, OpenBGPD, Nokia SR OS/SR Linux, Mikrotik RouterOS, Huawei, and Arista EOS.
  sources:
    - https://api.github.com/repos/bgp/bgpq4
    - https://github.com/bgp/bgpq4#readme
    - https://raw.githubusercontent.com/bgp/bgpq4/main/CHANGES
    - input.source_facts.package-manager
  summary:
    - >
      bgpq4 is the modern bgpq-family CLI for generating router filters from IRR data.
      It keeps the operator-friendly model of bgpq3 while focusing on newer IRRd
      behavior, newer vendor outputs, and ongoing maintenance.
  timeline:
    - '2007: The inherited bgpq-family Git history begins with the bgpq3 rewrite.'
    - >
      2019: bgpq3 is forked into bgpq4; early releases remove legacy flags and use IRRd
      4's A query when available.
    - >
      2021: Version 1.3 reorganizes the repository, reformats large parts of the code,
      and reduces memory use.
    - '2022: Version 1.5 adds Junos as-path-origin support.'
    - '2023: Versions 1.10 and 1.11 add Nokia SR Linux support and tighten AS23456 handling.'
    - '2026: Version 1.16 is released.'
  usage:
    - >
      The README describes bgpq4 as producing prefix lists, extended access lists,
      policy-statement terms, and AS-path lists from IRR objects. Operators pass ASNs,
      AS sets, route sets, or prefixes, select sources such as RPKI, AFRINIC, ARIN,
      APNIC, LACNIC, and RIPE, and choose target syntax for Cisco, Juniper, BIRD,
      OpenBGPD, Nokia, Mikrotik, Huawei, Arista, or JSON output.
related-packages:
  - id: brew:bgpq3
    reason: >
      Choose bgpq3 only when compatibility with an existing bgpq3 deployment or its
      historical behavior is required; bgpq4 is its successor fork and carries newer
      IRRd and router-format work.
    rel: alternative
    sources:
      - https://github.com/snar/bgpq3#readme
      - https://github.com/bgp/bgpq4#readme
      - https://raw.githubusercontent.com/bgp/bgpq4/main/CHANGES
category: networking
