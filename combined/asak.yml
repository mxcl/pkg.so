id: brew:asak
display-name: asak
homepage: https://github.com/chaosprint/asak
repo: https://github.com/chaosprint/asak
docs:
  - https://github.com/chaosprint/asak#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its package-manager footprint is still young and modest: the Homebrew and Nix
      package facts in the input show it has crossed from a GitHub/Cargo-style Rust
      project into Unix package-manager distribution, but there is no official upstream
      narrative of broad adoption.
  package-nerd-significance:
    - >
      For package maintainers, asak is interesting as a small modern Rust TUI sitting at
      the boundary between terminal UX and native audio stacks. Its build script
      generates shell completions and man pages, and its Linux dependency notes make
      audio backend packaging visible.
  project-history:
    - >
      The public GitHub repository was created in February 2024. By the documented 0.3.x
      releases, asak already exposed the core terminal workflow; the 0.3.7 release
      description calls out improved UI plus MP3 and Ogg support, and the 0.4.0 release
      is described upstream as a new UI and logic pass.
  related-projects:
    - cpal is the Rust audio I/O layer mentioned by the README for Linux audio dependencies.
    - >
      ratatui-style terminal audio tools and waveform browsers occupy a similar CLI/TUI
      niche, though the upstream README does not name direct sibling projects.
  sources:
    - https://github.com/chaosprint/asak
    - https://github.com/chaosprint/asak#readme
    - https://github.com/chaosprint/asak/releases
  summary:
    - >
      asak is a Rust terminal audio utility that combines playback, waveform preview,
      recording, and audio device selection in a keyboard-driven TUI. Its upstream
      README presents it as a current-working-directory audio browser and recorder
      rather than a long-running daemon or studio suite.
  timeline:
    - '2024-02: Public GitHub repository created.'
    - '2024-06: v0.3.3 release published.'
    - '2026-04: v0.3.7 release notes describe improved UI and MP3/Ogg support.'
    - '2026-04: v0.4.0 release notes describe a new UI and logic update.'
  usage:
    - >
      Users run `asak` from the directory containing audio files, choose Play, Rec, or
      Settings, browse supported audio files, preview waveforms, record WAV files, and
      select playback or recording devices. The README notes Linux builds usually need
      ALSA and JACK development packages through cpal.
related-packages:
  - id: brew:sox
    reason: >
      Choose SoX when you need scriptable recording, playback, conversion, or effects
      processing rather than asak's interactive waveform-oriented TUI.
    rel: alternative
    sources:
      - https://github.com/chaosprint/asak#readme
      - https://sox.sourceforge.net/
category: media
package-manager:
  brew: asak
  nix: asak
package-manager-url: https://formulae.brew.sh/formula/asak
license: MIT
tags:
  - audio
  - cli
  - recording
  - rust
  - tui
  - waveform
description: Cross-platform audio recording/playback CLI tool with TUI
executables:
  - asak
provenance:
  formula: asak
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
