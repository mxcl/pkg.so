id: brew:marp-cli
display-name: Marp CLI
homepage: https://github.com/marp-team/marp-cli
repo: https://github.com/marp-team/marp-cli
docs:
  - https://github.com/marp-team/marp-cli#readme
  - https://marp.app/
config-file-location:
  unix:
    - marp.config.js
    - marp.config.mjs
    - marp.config.cjs
    - marp.config.ts
    - .marprc
    - .marprc.json
    - .marprc.yaml
    - .marprc.yml
    - package.json
    - file supplied with --config-file
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026-07-01 GitHub metadata showed 3,673 stars and 189 forks for marp-cli, while
      the npm registry listed @marp-team/marp-cli 4.4.0 as current. The supplied
      package-manager facts list Homebrew, Nix, and Scoop, and the README also points to
      npm, Docker Hub, and standalone binaries.
    - >
      The broader Marp homepage describes an official toolset including Marp for VS
      Code, Marp CLI, Marp Core, and Marpit. That ecosystem story helped the CLI become
      the automation/export counterpart to editor-based slide authoring.
  package-nerd-significance:
    - >
      Marp CLI is significant because it turns Markdown slide decks into reproducible
      build artifacts. In package-manager culture it is a classic docs-as-code tool:
      install one CLI in CI, keep slides in git, and export web, PDF, and PowerPoint
      deliverables from the same source.
  project-history:
    - >
      The marp-cli repository was created on 2018-08-09, and the npm package was first
      published on 2018-08-21. It belongs to the Marp team ecosystem, using Marp Core
      and the Marpit framework as the conversion engine.
    - >
      The README presents Marp CLI as a tool for converting Marp or Marpit Markdown
      decks into static HTML/CSS, PDF, PowerPoint documents, and images. Over time it
      accumulated browser-based export paths, watch/preview/server modes, Docker usage,
      standalone binaries, and configuration through cosmiconfig-style files.
  related-projects:
    - 'Marp CLI depends on the Marp ecosystem: Marp, Marp Core, and Marpit.'
    - >
      Marp for VS Code is the editor-side companion for writing and previewing Marp
      Markdown decks.
  sources:
    - https://github.com/marp-team/marp-cli
    - https://marp.app/
    - https://raw.githubusercontent.com/marp-team/marp-cli/main/README.md
    - https://registry.npmjs.org/@marp-team%2fmarp-cli
  summary:
    - >
      Marp CLI is the command-line interface for the Marp/Marpit Markdown presentation
      ecosystem, converting slide decks into HTML, PDF, PowerPoint, images, and related
      outputs.
  timeline:
    - '2018: GitHub repository created and npm package first published.'
    - '2024: Marp CLI v4 introduced major updates in the Marp team release stream.'
    - '2026: v4.4.0 added Node.js v26 support and Linux ARM64 standalone builds.'
  usage:
    - >
      Users write slides in Marp Markdown and run marp to produce HTML, PDF, PPTX,
      PNG/JPEG images, presenter notes, or a local preview/server. PDF, PPTX, and image
      export use a browser such as Chrome, Edge, or Firefox.
    - >
      Marp CLI discovers config files such as marp.config.js, marp.config.mjs,
      marp.config.cjs, marp.config.ts, .marprc variants, or a marp section in
      package.json. It also accepts --config-file/--config/-c for explicit
      configuration.
related-packages:
  - id: brew:pandoc
    reason: >
      Choose Pandoc when the same Markdown source must feed a broader
      document-conversion pipeline or multiple slide frameworks; choose Marp CLI for
      Marp theming, preview, watch, and server workflows.
    rel: alternative
    sources:
      - https://github.com/marp-team/marp-cli
      - https://pandoc.org/MANUAL.html#slide-shows
category: productivity
package-manager:
  brew: marp-cli
  nix: marp-cli
  scoop: main/marp
package-manager-url: https://formulae.brew.sh/formula/marp-cli
license: MIT
tags:
  - cli
  - html
  - markdown
  - pdf
  - presentations
  - slides
description: Easily convert Marp Markdown files into static HTML/CSS, PDF, PPT and images
executables:
  - marp
provenance:
  formula: marp-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
