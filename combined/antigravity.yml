id: cask:antigravity
display-name: Google Antigravity
homepage: https://antigravity.google/product/antigravity-2
repo: null
docs:
  - https://antigravity.google/docs/features?app=antigravity
  - https://antigravity.google/docs?app=antigravity
  - https://www.antigravity.google/docs/settings
config-file-location:
  unix:
    - ~/.gemini/config/mcp_config.json
    - .agents/mcp_config.json
    - ~/.gemini/config/hooks.json
    - .agents/hooks.json
credentials-file-location:
  unix: ~/.gemini/antigravity/mcp_oauth_tokens.json
history:
  adoption-history:
    - >
      Official sources position Antigravity 2.0 as a multi-platform product for
      developers working with autonomous agents, but do not publish sufficiently
      detailed adoption figures or a long-term adoption record.
  package-nerd-significance:
    - >
      The Homebrew cask gives macOS package users a reproducible installation route for
      an otherwise vendor-distributed desktop application. The product is notable for
      combining project-scoped permissions, worktrees, agent orchestration, skills, MCP
      servers, hooks, and plugins in one graphical environment.
  project-history:
    - >
      Antigravity 2.0 is Google's agent-oriented development platform. Its documentation
      describes a move from a legacy repository-centric workspace model to Projects that
      can contain multiple folders and isolated agent settings.
  related-projects:
    - Gemini
    - Model Context Protocol
    - Git
    - Homebrew
  sources:
    - 'Official Projects documentation: https://antigravity.google/docs/projects?app=cli'
    - 'Official getting-started documentation: https://antigravity.google/docs?app=antigravity'
    - 'Official product page: https://www.antigravity.google/product/antigravity-2'
  summary:
    - >
      Google Antigravity is a desktop platform for launching, monitoring, and
      coordinating autonomous development agents across projects.
  timeline:
    - '2026: Antigravity 2.0 documentation describes the Project-based orchestration model.'
  usage:
    - >
      Users create Projects containing one or more folders, configure project-specific
      permissions and security settings, and run agents in local folders or isolated Git
      worktrees. The application also supports scheduled tasks and customizable skills,
      MCP servers, hooks, and plugins.
category: developer-tools
package-manager:
  brew-cask: antigravity
package-manager-url: https://formulae.brew.sh/cask/antigravity
tags:
  - agent-orchestration
  - ai-agents
  - automation
  - developer-workspace
  - git-worktrees
  - mcp
description: Agent orchestration platform
applications:
  - Antigravity.app
provenance:
  cask: antigravity
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
