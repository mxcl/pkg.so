history:
  adoption-history:
    - >
      PdfCraft is distributed through official builds for macOS, Windows, Linux,
      FreeBSD, and the web, with a separate command-line binary for scripts and agents.
      The macOS build is also packaged through Homebrew Cask.
    - >
      The project is recent, so its release activity demonstrates early community
      participation but does not yet establish long-term adoption.
  package-nerd-significance:
    - >
      PdfCraft is notable as a from-scratch Rust implementation of a complex document
      format, packaged as a desktop application, command-line tool, reusable engine, web
      build, and MCP server.
    - >
      Its local-first model avoids accounts, telemetry, and cloud dependencies, while
      atomic and incremental saves, broad platform packaging, and corpus-based
      compatibility testing address concerns that matter to maintainers of
      document-processing software.
  project-history:
    - >
      PdfCraft was created by the ArtCraft community as an open-source, clean-room PDF
      workbench inspired by the offline feature set of Adobe Acrobat. Its layered Rust
      workspace covers parsing, rendering, encryption, editing, forms, annotations,
      automation, and user interfaces.
    - >
      The repository initially published release artifacts under the PrintCraft name in
      early October 2026. PdfCraft-branded version 0.4.0 followed on October 8, and
      version 0.5.0 was released on October 10 with an expanded set of editing,
      security, localization, packaging, and automation improvements.
  related-projects:
    - >
      Adobe Acrobat: the proprietary PDF application whose offline workflows provide
      PdfCraft's clean-room behavioral target.
    - >
      GridCraft and other ArtCraft applications: sibling open-source creative and
      productivity tools.
    - >
      qpdf, Poppler, and hayro: independent PDF implementations used by the project for
      output and compatibility verification.
  sources:
    - https://getartcraft.com/apps/pdfcraft
    - https://github.com/storytold/pdfcraft#readme
    - https://github.com/storytold/pdfcraft/blob/main/ROADMAP.md
    - https://github.com/storytold/pdfcraft/releases
    - source_facts.description
  summary:
    - >
      PdfCraft is an open-source, local-first PDF workbench written in Rust. It reads,
      renders, edits, organizes, combines, splits, annotates, fills, signs, and secures
      PDF documents through desktop, web, command-line, and agent-facing interfaces.
  timeline:
    - '2026-10-03: The repository publishes early PrintCraft 0.1-series artifacts.'
    - '2026-10-08: PdfCraft 0.4.0 is released under the PdfCraft name.'
    - >
      2026-10-10: PdfCraft 0.5.0 expands editing, security, localization, and automation
      support.
  usage:
    - >
      Desktop users open and edit PDFs through the native interface, including page
      organization, comments, forms, bookmarks, protection, text operations, and
      incremental saving.
    - >
      Automation users can invoke JSON-Schema-described operations through pdfcraft-cli,
      embed the Rust automation API, or connect agents through the opt-in stdio MCP
      server. The official project states that it requires no account and has no
      telemetry or cloud dependency.
