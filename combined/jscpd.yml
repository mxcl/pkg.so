id: brew:jscpd
display-name: jscpd
homepage: https://jscpd.dev/
repo: https://github.com/kucherenko/jscpd
docs:
  - https://github.com/kucherenko/jscpd#readme
config-file-location:
  unix: .jscpd.json
credentials-file-location: null
history:
  adoption-history:
    - >
      jscpd gained adoption as a lightweight alternative to heavier static-analysis
      suites for teams that wanted to fail builds or generate reports when duplication
      crossed a threshold. The npm package had a long 0.x to 4.x TypeScript/Node.js
      history before the 5.x Rust-native release line appeared in June 2026.
    - >
      Homebrew packages jscpd as a CLI, npm distributes it for JavaScript toolchains,
      and the project site promotes curl, npm, cargo, brew, and nix installation paths.
      That multi-channel distribution matches its role as a language-agnostic
      source-code utility.
  package-nerd-significance:
    - >
      jscpd is notable because duplicate-code detection sits between linting, static
      analysis, and build policy. The 2026 Rust rewrite also makes it a packaging case
      study: a Node-era CLI kept its ecosystem-facing package names while shifting core
      performance-sensitive work into a native binary.
  project-history:
    - >
      The GitHub repository was created in May 2013, and the npm package history begins
      in June 2013. The name originally stood for JavaScript Copy/Paste Detector, but
      the project expanded well beyond JavaScript into a broad multi-language
      duplicate-code scanner.
    - >
      The README describes the detection engine as Rabin-Karp based. By 2026 the project
      documentation described support for more than 220 formats, multiple reporters,
      GitHub Action integration, an MCP server, AI-oriented reporter output, and a
      Rust-powered v5 engine.
  related-projects:
    - >
      Related projects include PMD CPD, Simian, SonarQube duplication detection,
      MegaLinter's jscpd integration, and jscpd's own GitHub Action and MCP server
      packages.
  sources:
    - https://formulae.brew.sh/formula/jscpd
    - https://github.com/kucherenko/jscpd
    - https://github.com/kucherenko/jscpd/releases
    - https://jscpd.dev/
    - https://registry.npmjs.org/jscpd
    - https://www.npmjs.com/package/jscpd
  summary:
    - >
      jscpd is a copy/paste detector for source code. It scans files for duplicated
      token sequences, reports clones in multiple formats, and is used as a code-quality
      gate in local development and CI.
  timeline:
    - '2013: GitHub repository and npm package history began.'
    - '2018: jscpd 1.0.0 was published after years of 0.x releases.'
    - '2020: jscpd 3.x releases continued the Node.js/TypeScript era.'
    - '2024: jscpd 4.0.0 was published on npm.'
    - >
      2026: jscpd 4.2.x and 5.0.x releases appeared, with project docs presenting v5 as
      a Rust-powered rewrite.
  usage:
    - >
      Developers run jscpd against a repository or source directory, tune thresholds and
      ignore patterns through configuration such as .jscpd.json, and consume terminal,
      JSON, HTML, badge, CI, or AI-oriented reports.
related-packages:
  - id: brew:pmd
    reason: >
      Choose PMD when duplicate detection should be paired with its broader rules-based
      source analyzer, especially in Java-centric workflows; choose jscpd for a focused
      standalone clone detector with broad reporting and repository-analysis features.
    rel: alternative
    sources:
      - https://jscpd.dev/
      - https://docs.pmd-code.org/latest/pmd_userdocs_cpd.html
category: developer-tools
package-manager:
  brew: jscpd
package-manager-url: https://formulae.brew.sh/formula/jscpd
license: MIT
tags:
  - cli
  - code-quality
  - copy-paste-detection
  - duplication
  - source-code
description: Copy/paste detector for programming source code
executables:
  - jscpd
provenance:
  formula: jscpd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
