credentials-file-location: null
history:
  project-history:
    - >
      Its authorship history is unusually clear for a small audio utility. Ricardo
      Cerqueira originally wrote MP3Info, and Cedric Tefft took over maintenance in
      January 2000. The homepage also places the project in the ibiblio Linux archive
      lineage, formerly MetaLab and SunSite, which explains its long-standing presence
      in Unix package collections.
  sources:
    - https://formulae.brew.sh/formula/mp3info
    - https://ibiblio.org/mp3info/
    - https://ibiblio.org/mp3info/ChangeLog
    - https://ibiblio.org/mp3info/mp3info.html
  summary:
    - >
      mp3info is an MP3 metadata and technical-information utility hosted at ibiblio.
      The project page describes it as a small tool for reading and modifying ID3 tags,
      while also reporting technical properties such as playing time, bit rate, sampling
      frequency, and other attributes in predefined or user-specified output formats.
  usage:
    - >
      Technically, mp3info grew from a basic ID3 and MP3-inspection tool into a
      scriptable console utility with an optional interactive/curses mode and a GTK
      interface. The changelog records support for ID3 v1.1 track numbers, a technical
      info display option, VBR handling, tolerance for non-standard leading headers,
      user-specifiable printf-like output, and fixes around tag detection and CBR/VBR
      reporting. In practice it is used where heavier tag editors are unnecessary: shell
      scripts, archive audits, quick metadata edits, and extraction of MP3 properties
      for reports or filenames.
related-packages:
  - id: brew:eye-d3
    reason: >
      Choose eyeD3 for maintained ID3v2.3/2.4 editing, plugins, and a Python API; choose
      MP3Info for a small ID3v1-oriented CLI with flexible technical-property output.
    rel: alternative
    sources:
      - https://www.ibiblio.org/mp3info/mp3info.html
      - https://eyed3.readthedocs.io/en/latest/
  - id: brew:id3v2
    reason: >
      Choose id3v2 when shell work specifically requires richer ID3v2 tags; choose
      MP3Info when technical MP3 inspection and established ID3v1 operations are the
      priority.
    rel: alternative
    sources:
      - https://www.ibiblio.org/mp3info/mp3info.html
      - https://id3v2.sourceforge.net/
