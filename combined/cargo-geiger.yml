license: Apache-2.0 OR MIT
tags:
  - cargo
  - cli
  - rust
  - security
  - static-analysis
  - unsafe-code
description: Detects usage of unsafe Rust in a Rust crate and its dependencies
executables:
  - cargo-geiger
provenance:
  formula: cargo-geiger
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
