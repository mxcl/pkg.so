id: brew:backlog-md
display-name: Backlog.md
homepage: https://github.com/MrLesk/Backlog.md
repo: https://github.com/MrLesk/Backlog.md
docs:
  - https://github.com/MrLesk/Backlog.md#readme
  - https://github.com/MrLesk/Backlog.md/blob/main/ADVANCED-CONFIG.md
  - https://github.com/MrLesk/Backlog.md/blob/main/CLI-INSTRUCTIONS.md
config-file-location:
  unix:
    - backlog.config.yml
    - backlog/config.yml
    - .backlog/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Backlog.md is young, but the official repository metadata shows substantial GitHub
      attention, and the README advertises multiple install channels. Its adoption path
      is unusually modern: instead of replacing GitHub Issues or Jira globally, it
      stores tasks as files in each repo so both people and coding agents can read,
      edit, commit, and review them alongside code.
  package-nerd-significance:
    - >
      Backlog.md is significant because it packages a workflow pattern that became
      common with coding agents: project-local, reviewable task state rather than remote
      SaaS state. For package-manager people, it is also a neat cross-ecosystem
      artifact, distributed through npm/Bun, Homebrew, and Nix while remaining just a
      CLI over files.
  project-history:
    - >
      The GitHub repository was created in June 2025. Its README positions Backlog.md as
      a self-contained project board for any Git repo, powered by plain Markdown files
      and a zero-config CLI, with Git optional for local non-code projects.
    - >
      Early releases moved quickly: the repository's GitHub releases show v0.1.0 in June
      2025 and v1.47.1 by June 2026. The README documents installation through npm, Bun,
      Homebrew, and Nix, plus CLI instructions and optional MCP integration for Claude
      Code, Codex, Gemini CLI, Kiro, Cursor, and similar tools.
  related-projects:
    - >
      The README explicitly targets Claude Code, Codex, Gemini CLI, Kiro, Cursor, and
      other MCP or CLI-compatible AI assistants. It is adjacent to Git-native task
      trackers, terminal Kanban tools, Markdown issue stores, and MCP server tooling.
  sources:
    - https://api.github.com/repos/MrLesk/Backlog.md
    - https://api.github.com/repos/MrLesk/Backlog.md/releases
    - https://github.com/MrLesk/Backlog.md#readme
    - https://github.com/MrLesk/Backlog.md/blob/main/ADVANCED-CONFIG.md
    - https://github.com/MrLesk/Backlog.md/blob/main/CLI-INSTRUCTIONS.md
  summary:
    - >
      Backlog.md is a Markdown-native task manager, terminal Kanban board, browser UI,
      and MCP-capable workflow tool for projects that want task state stored in the
      repository. Its identity is tightly tied to AI-agent and spec-driven development
      workflows.
  timeline:
    - '2025: GitHub repository created for MrLesk/Backlog.md.'
    - '2025: v0.1.0 published in GitHub releases.'
    - >
      2025: README frames Backlog.md around spec-driven AI development and project-local
      Markdown task files.
    - '2026: v1.47.1 published in GitHub releases.'
  usage:
    - >
      Users initialize a project with backlog init, create and edit tasks through the
      CLI, inspect work with backlog board or backlog search, launch a local web UI with
      backlog browser, and optionally expose an MCP server with backlog mcp start. The
      README recommends using commands, MCP, or the web UI rather than hand-editing task
      files so metadata stays consistent.
related-packages: []
category: productivity
package-manager:
  brew: backlog-md
package-manager-url: https://formulae.brew.sh/formula/backlog-md
license: MIT
tags:
