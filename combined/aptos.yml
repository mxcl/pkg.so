id: brew:aptos
display-name: Aptos CLI
homepage: https://aptosfoundation.org/
repo: https://github.com/aptos-labs/aptos-core
docs:
  - https://aptos.dev/build/cli
  - https://aptos.dev/build/cli/setup-cli
config-file-location:
  unix:
    - .aptos/config.yaml
    - ~/.aptos/global_config.yaml
credentials-file-location:
  unix:
    - .aptos/config.yaml
    - ~/.aptos/global_config.yaml
history:
  adoption-history:
    - >
      The CLI appears in Homebrew and winget package metadata, matching Aptos'
      cross-platform developer audience. The aptos-core repository is active and
      high-visibility, with thousands of stars and forks in the official GitHub API
      metadata.
    - >
      Official release notes continue to mention CLI releases alongside node and
      framework changes, which is typical for chain toolchains where package users track
      both client compatibility and protocol cadence.
  package-nerd-significance:
    - >
      Aptos CLI is a good example of a blockchain package where the executable, protocol
      implementation, SDK surface, and release engineering all live in one large
      monorepo. Packagers care about it because a CLI version is not just a convenience
      binary; it also encodes current Move tooling, network defaults, and compatibility
      expectations.
  project-history:
    - >
      The official aptos-core repository was created in February 2022 and describes
      Aptos as a layer 1 blockchain focused on broad blockchain use, better technology,
      and user experience. The Homebrew package exposes the `aptos` executable from that
      repository rather than a separate standalone CLI project.
    - >
      Aptos documentation treats the CLI as the normal entry point for local developer
      work: users install it, initialize profiles, select network endpoints, generate or
      enter a private key, and then run account and Move-package workflows from the
      terminal.
  related-projects:
    - >
      Related official surfaces include aptos-core, the Aptos developer documentation,
      Move tooling, and Aptos network APIs.
  sources:
    - https://api.github.com/repos/aptos-labs/aptos-core
    - https://api.github.com/repos/aptos-labs/aptos-core/releases
    - https://aptos.dev/build/cli
    - https://aptos.dev/build/cli/setup-cli
    - source_facts.package-manager
  summary:
    - >
      Aptos CLI is the command-line front end for the Aptos blockchain toolchain. In
      package-manager terms it is the small executable that turns the much larger
      aptos-core monorepo into something developers can install, initialize, and use
      from a shell.
  timeline:
    - '2022: The official aptos-core repository was created.'
    - >
      2022: Homebrew and other package metadata began distributing the `aptos`
      executable for developer workflows.
    - >
      2026: Aptos node release notes still include explicit Aptos CLI release work,
      showing the CLI remains part of the main release train.
  usage:
    - >
      Typical use starts with `aptos init`, which writes a profile containing REST and
      faucet endpoints plus account key material. Named profiles let developers switch
      accounts and networks while reusing the same `aptos` binary for Move package
      publishing, account funding, and transaction workflows.
    - >
      For package users, the important behavior is that local workspace configuration is
      discovered at `.aptos/config.yaml`, while a shared configuration can live at
      `~/.aptos/global_config.yaml`.
related-packages: []
category: developer-tools
package-manager:
  brew: aptos
  winget: AptosCore.aptos
package-manager-url: https://formulae.brew.sh/formula/aptos
license: Apache-2.0
tags:
  - aptos
  - blockchain
  - cli
  - move
  - smart-contracts
description: Layer 1 blockchain built to support fair access to decentralized assets for all
executables:
  - aptos
provenance:
  formula: aptos
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
