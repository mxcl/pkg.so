id: brew:gnu-barcode
display-name: GNU Barcode
homepage: https://www.gnu.org/software/barcode/
repo: https://git.savannah.gnu.org/cgit/barcode.git
docs:
  - https://www.gnu.org/software/barcode
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Barcode's upstream README notes distribution through ftp.gnu.org and GNU
      mirrors, a Windows port through GnuWin32, FreeBSD ports packaging, and downstream
      use by GLabels. Its adoption pattern is therefore typical of focused Unix
      utilities: not a broad platform, but a reusable program and library that other
      label-printing tools could embed.
  package-nerd-significance:
    - >
      Package maintainers care about GNU Barcode because it exposes a narrow, scriptable
      function with few moving parts: encode strings, select a symbology, and produce
      printer-friendly output. Its library/front-end split also made it useful as a
      dependency for label software rather than only as a standalone command.
  project-history:
    - >
      The project was authored and maintained in the GNU ecosystem by Alessandro Rubini.
      Its README describes a package built to cover common barcode creation needs with a
      conventional printer, shipping both a library and a command-line front end so
      applications and scripts can generate barcode symbols.
    - >
      The 0.99 NEWS entry records later maintenance work including internationalization,
      GPLv3-or-later licensing, SVG support, and PCL output. That makes GNU Barcode a
      small but durable example of GNU's printer-and-text utility culture.
  related-projects:
    - GLabels used GNU Barcode internally according to the upstream README.
    - Bookland.py is discussed by the README as a related ISBN-oriented barcode program.
    - GnuWin32 maintained a Windows port listed by upstream.
  sources:
    - https://git.savannah.gnu.org/cgit/barcode.git/plain/NEWS
    - https://git.savannah.gnu.org/cgit/barcode.git/plain/README
    - https://www.gnu.org/software/barcode/
  summary:
    - >
      GNU Barcode is a GNU command-line tool and library for turning text strings into
      printable barcode output, originally centered on PostScript and Encapsulated
      PostScript and later extended with output formats such as SVG and PCL.
  timeline:
    - '1999: GNU Barcode web page copyright record begins.'
    - '2011: GNU Barcode 0.99 NEWS records i18n, GPLv3-or-later, SVG, and PCL work.'
    - '2013: 0.99 NEWS copyright update recorded by the Free Software Foundation.'
  usage:
    - >
      Practitioners use the `barcode` command to read strings from the command line or
      standard input and emit printable barcode pages or EPS fragments. It supports
      common product and book codes including UPC, EAN, ISBN, CODE39, and related
      formats, with sizing and label-table options useful for sticker sheets and print
      workflows.
related-packages:
  - id: brew:zint
    reason: >
      Choose Zint when you need a broader modern symbology set, raster and vector
      formats, or a GUI; its API was explicitly designed to ease migration from GNU
      Barcode.
    rel: alternative
    sources:
      - https://www.gnu.org/software/barcode/
      - https://zint.org.uk/manual/chapter/1/
      - https://zint.org.uk/manual/chapter/5/
category: developer-tools
