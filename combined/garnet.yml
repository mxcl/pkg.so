id: brew:garnet
display-name: Garnet
homepage: https://microsoft.github.io/garnet/
repo: https://github.com/microsoft/garnet
docs:
  - https://microsoft.github.io/garnet/docs/getting-started
  - https://microsoft.github.io/garnet
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Garnet's adoption path is deliberately Redis-compatible: it starts from the RESP
      wire protocol so existing Redis clients can talk to it. The README also points to
      a managed Azure Cosmos DB Garnet Cache offering, moving the project from
      open-source package to managed service surface.
  package-nerd-significance:
    - >
      Garnet is significant for package and infrastructure users because it is a
      Redis-protocol server distributed as source, NuGet packages, a .NET tool,
      Homebrew, Nix, and Scoop packages. It is also a rare Microsoft Research database
      system designed to be both benchmark-visible and drop-in-client-friendly.
  project-history:
    - >
      The public GitHub repository was created in August 2023, and v1.0.0 was released
      in March 2024. Microsoft describes Garnet as a new cache-store focused on
      throughput, latency, scalability, storage, recovery, cluster sharding, key
      migration, and replication.
    - >
      The project builds on Microsoft research in storage and systems, with the README
      naming Tsavorite as Garnet's storage layer and noting a Garnet paper planned for
      PVLDB 2026.
  related-projects:
    - >
      Garnet is related to Redis through RESP compatibility, StackExchange.Redis as a
      supported client example, Tsavorite as its storage engine, DiskANN for
      vector-search previews, and Azure Cosmos DB Garnet Cache as a managed offering.
  sources:
    - https://api.github.com/repos/microsoft/garnet
    - https://api.github.com/repos/microsoft/garnet/releases?per_page=100
    - https://github.com/microsoft/garnet
    - https://microsoft.github.io/garnet/docs/getting-started
    - https://raw.githubusercontent.com/microsoft/garnet/main/README.md
  summary:
    - >
      Garnet is a Microsoft Research remote cache-store that speaks the Redis RESP
      protocol while using a .NET and Tsavorite-based architecture.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2024: v1.0.0 released.'
    - >
      2026: Preview 2.0.1 beta releases published and the Garnet paper scheduled for
      PVLDB 2026.
  usage:
    - >
      Users run GarnetServer and connect with Redis-compatible clients on the usual
      cache-server model. The docs cover building with .NET, deploying the server,
      connecting RESP clients, configuration options, TLS, cluster mode, command
      support, and benchmarking.
related-packages:
  - id: brew:redis
    reason: >
      Choose Redis when you want the established Redis server and its broader native
      ecosystem; Garnet is a distinct cache implementation that emphasizes performance
      while retaining RESP client compatibility.
    rel: alternative
    sources:
      - https://microsoft.github.io/garnet/docs/getting-started
      - https://redis.io/docs/latest/
  - id: brew:valkey
    reason: >
      Choose Valkey when vendor-neutral BSD licensing and continuity with Redis OSS are
      priorities; choose Garnet to evaluate Microsoft's Tsavorite-based cache
      architecture behind compatible RESP clients.
    rel: alternative
    sources:
      - https://microsoft.github.io/garnet/docs/getting-started
      - https://valkey.io/docs/topics/introduction/
      - https://valkey.io/topics/migration/
