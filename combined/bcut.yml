history:
  adoption-history:
    - >
      Bilibili's official 2021 social-responsibility report stated that 必剪 had reached
      more than nine million UP creators since launch. The desktop application extended
      the service beyond its original mobile editing workflow.
  package-nerd-significance:
    - >
      必剪 is notable as a platform-integrated creator tool: editing, Bilibili-oriented
      effects, account identity, and direct publication are packaged into one desktop
      and mobile workflow rather than requiring a general-purpose editor plus a separate
      upload process.
  project-history:
    - >
      Bilibili launched the 必剪 video-creation application in 2020 to give UP creators an
      integrated environment for editing and submission. The official desktop edition
      followed in December 2021.
    - >
      The product subsequently expanded its editing and creator-assistance features,
      including automatic speech-to-subtitle alignment, platform-specific interaction
      graphics, material libraries, effects, and AI-assisted video creation.
  related-projects:
    - >
      必剪 is tightly integrated with Bilibili accounts, creator workflows, media
      libraries, and video submission.
  sources:
    - 'Bilibili 2020 ESG report: https://ir.bilibili.com/media/aa4hs5g1/cn-2020.pdf'
    - 'Bilibili 2021 ESG report: https://ir.bilibili.com/media/nvgnk1hk/cn-2021.pdf'
    - 'Official desktop-release announcement: https://www.bilibili.com/video/BV1Nf4y1T7Cq/'
    - 'Official product site: https://bcut.bilibili.cn/'
  summary:
    - >
      必剪 (BCUT) is Bilibili's video-editing application for mobile and desktop, designed
      around the editing and publishing workflows of Bilibili creators.
  timeline:
    - '2020: Bilibili launched the 必剪 video-creation application.'
    - >
      2021: Bilibili reported that the application had covered more than nine million UP
      creators.
    - '2021: The official desktop edition was released in December.'
  usage:
    - >
      Creators edit video on a multitrack timeline, add music, stickers, text,
      transitions and effects, generate aligned subtitles from speech, insert
      Bilibili-specific interaction graphics, and publish through a connected Bilibili
      account.
category: media
