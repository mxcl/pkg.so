id: brew:imessage-exporter
display-name: iMessage Exporter
homepage: https://github.com/ReagentX/imessage-exporter
repo: https://github.com/ReagentX/imessage-exporter
docs:
  - https://github.com/ReagentX/imessage-exporter#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The binary docs list installation through Cargo, Homebrew, prebuilt macOS
      binaries, and source builds. Homebrew formula metadata records bottled
      distribution, while the GitHub repository has accumulated several thousand stars,
      indicating visibility beyond a narrow personal script.
    - >
      The project also accumulated a small ecosystem around the author's
      reverse-engineering work: crabstep for typedstream parsing and crabapple for
      encrypted iOS backup handling are both referenced by the documentation.
  package-nerd-significance:
    - >
      iMessage Exporter is significant because the hard part is not the CLI wrapper; it
      is the encoded domain knowledge about Apple's SQLite schemas, binary typedstream
      payloads, attachment formats, and platform-specific backup layouts.
    - >
      For package managers, it packages a high-churn reverse-engineering project into a
      normal command. That makes a local-data liberation workflow installable with brew
      or cargo instead of a pile of ad hoc scripts.
  project-history:
    - >
      The repository was created in May 2022. Its README describes a dual crate: a
      binary named imessage-exporter and a library named imessage_database for accessing
      iMessage data as native cross-platform structures.
    - >
      The project grew from basic export into detailed reverse engineering of
      Messages.app data. The feature docs cover macOS chat.db, iOS backups, jailbroken
      iOS filesystem data, typedstream message bodies, attachments, edited and unsent
      messages, tapbacks, stickers, URL previews, Apple Pay messages, Digital Touch, and
      many other message forms.
    - >
      Release 3.0.0 in June 2025 adopted the crabstep typedstream deserializer and
      emphasized performance. Release 4.0.0 in March 2026 added jailbroken iOS
      filesystem support, restructured diagnostics, dependency reductions, API breaks,
      and HTML-output hardening.
  related-projects:
    - imessage_database is the library crate in the same repository.
    - crabstep is used for typedstream deserialization.
    - crabapple is referenced for encrypted iOS backup handling.
    - >
      SQLite viewers, Xplist, GNUstep/libobjc sources, and preserved Darwin sources are
      credited by the project as reverse-engineering aids.
  sources:
    - https://api.github.com/repos/ReagentX/imessage-exporter
    - https://api.github.com/repos/ReagentX/imessage-exporter/releases
    - https://formulae.brew.sh/api/formula/imessage-exporter.json
    - https://github.com/ReagentX/imessage-exporter
    - https://raw.githubusercontent.com/ReagentX/imessage-exporter/develop/README.md
    - https://raw.githubusercontent.com/ReagentX/imessage-exporter/develop/docs/features.md
    - >
      https://raw.githubusercontent.com/ReagentX/imessage-exporter/develop/imessage-exporter/README.md
  summary:
    - >
      iMessage Exporter is a Rust CLI and library for reading Apple's Messages databases
      and exporting message history to portable formats. It is package-nerd interesting
      because it turns a private, shifting Apple data store into a reproducible
      command-line archive workflow.
  timeline:
    - '2022: The GitHub repository is created.'
    - >
      2025: Version 3.0.0 adopts crabstep typedstream deserialization and reports large
      export performance gains.
    - >
      2026: Version 4.0.0 adds jailbroken iOS filesystem data support, diagnostics
      changes, dependency reductions, API changes, and HTML security work.
    - >
      2026: Version 4.2.0 is published after the 4.x series has expanded support for
      modern Messages features.
  usage:
    - >
      The CLI exports local macOS Messages data or iOS backup data to txt or html, can
      copy or convert attachments, and can run diagnostics against the message database.
      The documented default macOS source is ~/Library/Messages/chat.db and the default
      export directory is ~/imessage_export.
    - >
      It is mostly read-only archival tooling: useful for personal backups, migration,
      compliance retention, legal discovery preparation, and diagnostics, rather than
      for sending messages or modifying Apple's database.
related-packages:
  - id: brew:msgvault
    reason: >
      Choose Msgvault when imported iMessage history should remain in a searchable local
      archive alongside other communications; choose iMessage Exporter for direct text
      or HTML exports and database diagnostics.
    rel: alternative
    sources:
      - https://github.com/ReagentX/imessage-exporter/blob/develop/imessage-exporter/README.md
      - https://github.com/kenn-io/msgvault/blob/main/docs/usage/text-messages.md
  - id: brew:imagemagick
    reason: >
      iMessage Exporter officially uses ImageMagick on non-macOS systems when
      attachment-copy modes need HEIC images converted to JPEG.
    rel: adjacent_workflow
    sources:
      - https://github.com/ReagentX/imessage-exporter/blob/develop/imessage-exporter/README.md
      - https://imagemagick.org/command-line-processing
  - id: brew:ffmpeg
    reason: >
      iMessage Exporter officially uses FFmpeg for video conversion on all platforms and
      for audio conversion outside macOS during full attachment exports.
    rel: adjacent_workflow
    sources:
      - https://github.com/ReagentX/imessage-exporter/blob/develop/imessage-exporter/README.md
      - https://ffmpeg.org/documentation.html
category: productivity
package-manager:
  brew: imessage-exporter
package-manager-url: https://formulae.brew.sh/formula/imessage-exporter
license: GPL-3.0-only
tags:
  - cli
  - database
  - imessage
  - macos
  - message-export
description: Command-line tool to export and inspect local iMessage database
executables:
  - imessage-exporter
provenance:
  formula: imessage-exporter
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
