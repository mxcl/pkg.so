id: brew:asn
display-name: asn
homepage: https://github.com/nitefood/asn
repo: https://github.com/nitefood/asn
docs:
  - https://github.com/nitefood/asn#readme
config-file-location:
  unix: ~/.asnrc
credentials-file-location:
  unix:
    - ~/.asn/ipinfo_token
    - /etc/asn/ipinfo_token
    - ~/.asn/iqs_token
    - /etc/asn/iqs_token
    - ~/.asn/cloudflare_token
    - /etc/asn/cloudflare_token
history:
  adoption-history:
    - >
      asn has unusually broad packaging for a shell network tool. The README displays OS
      support for Debian, Ubuntu, Kali, CentOS, Red Hat, Rocky Linux, Fedora, Arch,
      Manjaro, Alpine, openSUSE, FreeBSD, Nix, macOS, Windows environments, and
      Raspberry Pi, and the input package facts list apk, Homebrew, Debian, Nix, and
      Ubuntu packages.
    - >
      GitHub metadata shows roughly two thousand stars and active releases through 2026.
      Homebrew analytics show continuing installs, while the README's Repology badge
      points at multi-repository packaging status.
  package-nerd-significance:
    - >
      asn is significant because it packages a messy incident-response habit, asking
      several network-intelligence services about an address or ASN, into a scriptable
      CLI. For package maintainers, it is also an instructive case: a Bash tool with
      many external command and API integrations, distro packages, container usage, and
      optional credential files.
    - >
      It occupies the same practical shelf as whois, dig, mtr, bgp.tools shortcuts, and
      OSINT helper scripts, but makes the package-manager version matter because release
      updates can add or repair upstream data-provider integrations.
  project-history:
    - >
      The nitefood/asn repository was created in July 2020. The README describes a
      single command-line tool that can also run as a web traceroute server and as a
      JSON-producing lookup API endpoint.
    - >
      The project grew beyond simple ASN lookup into a collector of network intelligence
      APIs and command-line workflows. Its README lists Team Cymru, Prefix Whois,
      PeeringDB, CAIDA ASRank, RIPEStat, RIPE IPmap, Shodan, Cloudflare Radar,
      GreyNoise, NVD, IPQualityScore, ipinfo.io, and other data providers as supported
      inputs.
  related-projects:
    - >
      The README documents integrations with mtr, Team Cymru IP to ASN mapping, Prefix
      Whois, PeeringDB, CAIDA ASRank, RIPEStat, Cloudflare Radar, Shodan, GreyNoise,
      ipinfo.io, and other network-data services.
  sources:
    - https://api.github.com/repos/nitefood/asn
    - https://api.github.com/repos/nitefood/asn/releases
    - https://formulae.brew.sh/api/formula/asn.json
    - https://github.com/nitefood/asn#readme
    - source_facts.package-manager
  summary:
    - >
      asn is a Bash-based network lookup, recon, and traceroute server tool centered on
      autonomous systems, prefixes, RPKI validity, BGP statistics, geolocation,
      reputation, and IP/ASN investigation workflows.
  timeline:
    - '2020: GitHub repository created.'
    - '2024: v0.76 and v0.78 releases published.'
    - '2025: v0.79 and v0.80 releases published.'
    - '2026: v0.81.0 published and listed by Homebrew as the stable version.'
  usage:
    - >
      The common workflow is to run `asn` against an IP address, hostname, prefix, AS
      number, URL, or organization name and inspect enriched network output. The tool
      can do AS path tracing with mtr, RPKI checks, organization searches, Shodan recon,
      country CIDR mapping, bulk geolocation, and JSON output for pipelines.
    - >
      Configuration is deliberately Unix-like: defaults can be overridden with
      `$HOME/.asnrc`, and optional API tokens are read from `$HOME/.asn/` for user mode
      or `/etc/asn/` for server mode. Docker and Google Cloud Shell workflows are
      documented for users who do not want a local install.
related-packages:
  - id: brew:mtr
    reason: >
      asn uses mtr for its default hop-by-hop AS path tracing, while mtr itself is
      preferable when the task is focused on continuous latency and packet-loss
      diagnosis.
    rel: adjacent_workflow
    sources:
      - https://github.com/nitefood/asn#readme
      - https://www.bitwizard.nl/mtr.php
  - id: brew:ipinfo-cli
    reason: >
      IPinfo CLI is a focused alternative for direct and bulk IP or ASN lookups against
      the official IPinfo API, whereas asn aggregates many providers and adds routing,
      reputation, and traceroute workflows.
    rel: alternative
    sources:
      - https://github.com/nitefood/asn#readme
      - https://github.com/ipinfo/cli#readme
category: networking
package-manager:
  apk: asn
  brew: asn
  debian: asn
  nix: asn
  ubuntu: asn
package-manager-url: https://formulae.brew.sh/formula/asn
license: MIT
tags:
  - asn
  - bgp
  - cli
  - ip-geolocation
  - ipv4
  - ipv6
  - network
  - network-recon
  - osint
  - rpki
description: Organization lookup and server tool (ASN / IPv4 / IPv6 / Prefix / AS Path)
executables:
  - asn
provenance:
  formula: asn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
