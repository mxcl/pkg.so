id: brew:mosdepth
display-name: mosdepth
homepage: https://github.com/brentp/mosdepth
repo: https://github.com/brentp/mosdepth
docs:
  - https://github.com/brentp/mosdepth/wiki
  - https://github.com/brentp/mosdepth#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      mosdepth gained adoption because sequencing coverage summaries are a routine need
      for variant calling QC, copy-number workflows, targeted panels, exomes, and whole
      genomes. The paper compared mosdepth with samtools, bedtools, and sambamba and
      showed faster runtime on a 30x genome benchmark.
    - >
      The official README documents binary releases, Bioconda, Homebrew, and Docker
      usage, making it straightforward to package in bioinformatics environments and
      reproducible workflow containers.
  package-nerd-significance:
    - >
      mosdepth is notable to package maintainers because it is a compact compiled
      bioinformatics binary whose value comes from speed, HTSlib integration, and
      predictable command-line output files rather than from daemon-style services or
      configuration.
    - >
      It is also a representative Nim-based scientific CLI in package-manager ecosystems
      that otherwise contain many C/C++, Python, and Perl genomics tools.
  project-history:
    - >
      mosdepth was introduced by Brent S. Pedersen and Aaron R. Quinlan in a
      Bioinformatics paper published online in October 2017 and appearing in the March
      2018 issue. The paper presented it as a quick coverage calculator for genome and
      exome sequencing data.
    - >
      The implementation is written in Nim and uses HTSlib via hts-nim. Its algorithm
      tracks alignment chunk starts and ends in chromosome-sized arrays rather than
      using a pileup engine for every read base.
  related-projects:
    - >
      samtools depth, BEDTools genomecov, and sambamba are related depth/coverage tools
      compared in the official paper and README.
    - HTSlib and hts-nim are implementation dependencies named in the README and paper.
  sources:
    - https://academic.oup.com/bioinformatics/article/34/5/867/4583630
    - https://github.com/brentp/mosdepth
    - https://github.com/brentp/mosdepth/wiki
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC6030888/
    - input.source_facts.package-manager
  summary:
    - >
      mosdepth is a command-line tool for fast BAM/CRAM depth and coverage calculation
      across whole-genome, exome, or targeted sequencing datasets.
  timeline:
    - '2017: Bioinformatics article published online introducing mosdepth.'
    - '2018: Article appears in Bioinformatics volume 34 issue 5.'
    - '2025: GitHub wiki FAQ updated.'
    - '2026: GitHub releases list a latest release dated April 24, 2026.'
  usage:
    - >
      The CLI consumes position-sorted BAM or CRAM input and can report per-base depth,
      region summaries from BED files, fixed windows, quantized coverage, coverage
      thresholds, and distributions.
    - >
      Users choose mosdepth when they need fast genome-wide or region-based coverage
      calculation and can accept the memory profile of chromosome-sized arrays.
related-packages:
  - id: brew:samtools
    reason: >
      Choose samtools when coverage calculation must sit inside a broader SAM/BAM/CRAM
      viewing, conversion, sorting, indexing, and manipulation workflow; its depth
      command is an official mosdepth comparator.
    rel: alternative
    sources:
      - https://www.htslib.org/doc/samtools-depth.html
      - https://academic.oup.com/bioinformatics/article/34/5/867/4583630
  - id: brew:bedtools
    reason: >
      Choose BEDTools genomecov when coverage output needs to integrate with its broader
      genomic-interval toolkit or use its histogram and BedGraph modes; it is also an
      official mosdepth comparator.
    rel: alternative
    sources:
      - https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html
      - https://academic.oup.com/bioinformatics/article/34/5/867/4583630
category: science
package-manager:
  brew: mosdepth
  nix: mosdepth
  ubuntu: mosdepth
package-manager-url: https://formulae.brew.sh/formula/mosdepth
license: MIT
