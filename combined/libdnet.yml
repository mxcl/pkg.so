id: brew:libdnet
display-name: libdnet
homepage: https://github.com/ofalk/libdnet
repo: https://github.com/ofalk/libdnet
docs:
  - https://github.com/ofalk/libdnet#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official libdnet site listed projects using it such as arpd, firewalk,
      fragroute, honeyd, Nmap, Scapy, Unicornscan, and other network-testing or
      packet-manipulation tools. That placement made libdnet part of the classic Unix
      security-tool stack, often paired conceptually with libpcap for capture and
      libnet-style packet construction.
  package-nerd-significance:
    - >
      libdnet is a package-nerd fossil with real utility: it carries early-2000s
      network-security tooling assumptions into modern distributions. Packaging it well
      keeps old but still-useful packet tools buildable, especially where source has
      moved from SourceForge/CVS through Google Code-era references into maintained
      GitHub forks.
  project-history:
    - >
      The original libdnet site is signed by Dug Song and presents the project as a
      small systems library for C, C++, Python, Perl, and Ruby users across BSD, Linux,
      Mac OS X, Windows, Solaris, IRIX, HP-UX, and Tru64. Its SourceForge-era download
      section listed libdnet 1.11 in January 2005 and CVS as the source-control
      mechanism.
    - >
      The GitHub tag history preserves the older imported lineage, including DNET_1_10
      in February 2005 and libdnet-1.12 in January 2007, then shows renewed maintenance
      under the ofalk repository with releases from 2020 onward. The 2023-2024 releases
      focused on modern build tooling, CMake/autotools cleanup, Python binding rebuilds,
      CI, and portability fixes.
  related-projects:
    - >
      The official site names libpcap, WinPcap, pypcap, dpkt, libnet, PktFilter, and
      TUN/TAP drivers as related work, and lists Nmap, Scapy, honeyd, fragroute, arpd,
      and Unicornscan among downstream users.
  sources:
    - https://github.com/ofalk/libdnet
    - https://github.com/ofalk/libdnet/releases
    - https://github.com/ofalk/libdnet/tags
    - https://libdnet.sourceforge.net/
  summary:
    - >
      libdnet is a portable low-level networking library that wraps address
      manipulation, ARP and route-table access, firewalling, interface handling,
      tunneling, and raw packet transmission behind one API.
  timeline:
    - '2005: libdnet 1.11 listed on the official site.'
    - '2005: DNET_1_10 tag imported into the GitHub history.'
    - '2007: libdnet-1.12 tag published.'
    - '2020: libdnet-1.14 tag published in the maintained GitHub repository.'
    - '2023: 1.16.x and 1.17.0 releases modernized build support.'
    - '2024: 1.18.0 and 1.18.2 releases continued portability and tooling fixes.'
  usage:
    - >
      Developers use libdnet when they need portable access to network interfaces,
      routes, ARP tables, filters, tunnels, or raw Ethernet/IP transmission without
      writing per-OS code. The package also ships `dnet` and `dnet-config`, making it
      useful both as a development library and as an installed build dependency for
      older networking tools.
related-packages:
  - id: brew:libpcap
    reason: >
      Use libpcap alongside libdnet when a program must capture packets as well as
      construct, transmit, or manipulate them; the official dnet(3) manual explicitly
      describes the APIs as complementary.
    rel: adjacent_workflow
    sources:
      - https://libdnet.sourceforge.net/dnet.3.txt
      - https://www.tcpdump.org/manpages/pcap.3pcap.html
  - id: brew:fragroute
    reason: >
      fragroute is a concrete libdnet-based workflow for intercepting and rewriting
      outbound traffic during IDS and network-stack testing.
    rel: adjacent_workflow
    sources:
      - https://libdnet.sourceforge.net/
      - https://www.monkey.org/~dugsong/fragroute/
category: networking
package-manager:
  apk: libdnet
  brew: libdnet
  dnf: libdnet
  macports: libdnet
  nix: libdnet
  pacman: libdnet
  zypper: libdnet-devel
package-manager-url: https://formulae.brew.sh/formula/libdnet
license: BSD-3-Clause
tags:
  - c-library
  - cli
  - low-level-networking
  - networking
  - packet-transmission
description: Portable low-level networking library
executables:
  - dnet
  - dnet-config
provenance:
  formula: libdnet
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
