id: brew:bounceback
display-name: BounceBack
homepage: https://github.com/D00Movenok/BounceBack
repo: https://github.com/D00Movenok/BounceBack
docs:
  - https://github.com/D00Movenok/BounceBack/wiki
  - https://github.com/D00Movenok/BounceBack#readme
config-file-location:
  unix: config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      BounceBack appears to be a niche security-operations package rather than a broad
      platform dependency. Its Homebrew formula gives it a package-manager entry point,
      while the upstream README directs users to download release archives, edit
      `config.yml`, and run the `bounceback` binary.
    - >
      Repository metadata shows meaningful interest for a specialized red-team tool, but
      its adoption story is still mostly upstream GitHub releases plus the Homebrew
      package.
  package-nerd-significance:
    - >
      For package nerds, BounceBack is interesting as a security tradecraft tool
      packaged like an ordinary CLI. It shows how red-team infrastructure utilities
      increasingly ship as small Go binaries with YAML config, release archives, and
      Homebrew distribution.
  project-history:
    - >
      The public repository was created in May 2023. Its README describes BounceBack as
      a highly customizable reverse proxy with WAF-like filtering, real-time traffic
      analysis, IP and geolocation rules, domain fronting support, Malleable C2 profile
      validation, and multiple proxy protocols.
    - >
      The first GitHub release line began with v1.0.0 in July 2023, followed by 1.4 and
      1.5 releases through 2026.
  related-projects:
    - >
      Cobalt Strike Malleable C2 profiles are directly relevant because BounceBack
      validates inbound traffic against Malleable profile rules.
    - >
      Generic reverse proxies and web application firewalls are adjacent infrastructure
      patterns, though BounceBack applies them to red-team OPSEC.
  sources:
    - https://api.github.com/repos/D00Movenok/BounceBack
    - https://github.com/D00Movenok/BounceBack
    - https://github.com/D00Movenok/BounceBack/releases
    - https://github.com/D00Movenok/BounceBack/wiki
    - https://raw.githubusercontent.com/D00Movenok/BounceBack/main/config.yml
  summary:
    - >
      BounceBack is a Go-based red-team redirector and reverse proxy for hiding
      command-and-control, phishing, or other operation infrastructure from scanners and
      unwanted visitors.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2023: v1.0.0 published on GitHub Releases.'
    - '2024: v1.5.0 and v1.5.1 release line continued.'
    - '2026: v1.5.3 published.'
  usage:
    - >
      Operators configure rules, proxies, and globals in `config.yml`, optionally
      refresh bundled banned-IP data, and run `bounceback` with a config and log path.
      The tool supports HTTP(S), DNS, raw TCP, TLS-wrapped TCP, and UDP proxying with
      rule pipelines.
    - >
      The practical use case is traffic triage: allow expected operator or target
      traffic through while rejecting traffic from scanners, security vendors,
      sandboxes, or requests that fail a configured C2 profile.
related-packages: []
category: security
