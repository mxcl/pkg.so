id: brew:leaf-markdown-viewer
display-name: Leaf
homepage: https://leaf.rivolink.mg/
repo: https://github.com/RivoLink/leaf
docs:
  - https://github.com/RivoLink/leaf#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/leaf/config.toml
    - ~/.config/leaf/config.toml
  windows: '%APPDATA%\leaf\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Leaf's official installation matrix includes native scripts, npm, Homebrew, Cargo,
      and Arch's AUR. The supplied package metadata also records MacPorts and Scoop
      packages, giving the Rust binary several routes into Unix, macOS, and Windows
      environments.
  package-nerd-significance:
    - >
      Leaf packages a GUI-like Markdown-reading workflow as a single terminal-oriented
      Rust program, while retaining stdin/stdout composition and shell completion. Its
      simultaneous distribution as native binaries, a Cargo crate, and an npm package is
      useful across mixed developer toolchains.
  project-history:
    - >
      The official GitHub repository was created in April 2026 and published version
      1.0.0 the following day. Subsequent releases expanded the viewer into a
      cross-platform terminal application with interactive and pipeline-oriented modes.
  related-projects:
    - fzf can use Leaf's inline mode as a rich terminal preview command.
    - Vim and other editors can launch Leaf in watch mode for live Markdown previews.
  sources:
    - https://api.github.com/repos/RivoLink/leaf
    - https://github.com/RivoLink/leaf#readme
    - https://github.com/RivoLink/leaf/blob/main/src/config.rs
    - https://github.com/RivoLink/leaf/releases/tag/1.0.0
    - https://github.com/RivoLink/leaf/releases/tag/1.26.2
    - source_facts.package-manager
  summary:
    - >
      Leaf is a terminal Markdown previewer that combines a full-screen TUI with an
      inline renderer for shell pipelines. It supports live reload, file pickers,
      themes, editor integration, syntax highlighting, diagrams, and keyboard and mouse
      navigation.
  timeline:
    - '2026: The official repository was created on April 6.'
    - '2026: Version 1.0.0 was released on April 7.'
    - '2026: Version 1.26.2 was released on July 27.'
  usage:
    - >
      Users run `leaf FILE.md` to preview a document, add `--watch` for automatic
      reloads, invoke `leaf` without a path to choose a file, or use `--inline` to
      render into the current terminal or an `fzf` preview. A TOML file controls
      defaults such as theme, editor, width, watch mode, and extra file types.
related-packages:
  - id: brew:glow
    reason: >
      Choose Glow when you want a mature terminal Markdown reader that can also fetch
      HTTP, GitHub, and GitLab sources; choose Leaf for live reload, richer document
      navigation, and its explicitly documented fzf and editor workflows.
    rel: alternative
    sources:
      - https://github.com/RivoLink/leaf#readme
      - https://github.com/charmbracelet/glow#readme
  - id: brew:fzf
    reason: >
      Leaf officially documents `leaf --inline ansi` as an fzf preview command, pairing
      fzf's interactive selection with rendered Markdown or syntax-highlighted file
      previews.
    rel: adjacent_workflow
    sources:
      - https://github.com/RivoLink/leaf#readme
      - https://github.com/junegunn/fzf#readme
category: productivity
package-manager:
  brew: leaf-markdown-viewer
  macports: leaf
  scoop: main/leaf-markdown-viewer
package-manager-url: https://formulae.brew.sh/formula/leaf-markdown-viewer
license: MIT
tags:
  - cli
  - live-reload
  - markdown
  - preview
  - rust
  - syntax-highlighting
  - terminal
  - tui
description: Terminal Markdown previewer with a GUI-like experience
executables:
  - leaf
provenance:
  formula: leaf-markdown-viewer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
