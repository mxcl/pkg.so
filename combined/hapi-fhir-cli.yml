id: brew:hapi-fhir-cli
display-name: HAPI FHIR CLI
homepage: https://hapifhir.io/
repo: https://github.com/hapifhir/hapi-fhir
docs:
  - https://hapifhir.io/hapi-fhir/docs
  - https://hapifhir.io/hapi-fhir/docs/tools/hapi_fhir_cli.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI's adoption follows the library's role in FHIR implementer workflows rather
      than general-purpose command-line culture. Official docs describe downloadable
      archives from GitHub Releases and Homebrew installation on macOS, which makes the
      tool easy to install for local test servers and healthcare data operations.
  package-nerd-significance:
    - >
      For package nerds, hapi-fhir-cli is notable because it turns a large Java
      healthcare interoperability stack into one executable command. Packaging it avoids
      asking users to download release archives manually, manage wrapper scripts, or
      locate the right Java artifact for common FHIR server and terminology tasks.
  project-history:
    - >
      HAPI FHIR's official documentation frames the library as a Java implementation of
      HL7 FHIR, designed around usable API patterns comparable in spirit to JAXB and
      JAX-WS. The project changelog records HAPI FHIR 0.1 as released on 2014-04-15,
      with several 0.x releases following during 2014.
    - >
      The CLI is documented as HAPI FHIR's command-line tool, exposing built-in HAPI
      features through command options. It lives inside the larger `hapifhir/hapi-fhir`
      repository alongside modules for clients, server implementations, JPA storage,
      validation, terminology, version converters, and related tooling.
  related-projects:
    - >
      The CLI is part of the broader HAPI FHIR project and works in the HL7 FHIR
      ecosystem. Its terminology examples reference SNOMED CT and LOINC distribution
      files, and its server commands relate to the HAPI FHIR JPA server modules.
  sources:
    - https://formulae.brew.sh/formula/hapi-fhir-cli
    - https://github.com/hapifhir/hapi-fhir
    - https://hapifhir.io/hapi-fhir/docs
    - https://hapifhir.io/hapi-fhir/docs/getting_started/introduction.html
    - https://hapifhir.io/hapi-fhir/docs/introduction/changelog_2014.html
    - https://hapifhir.io/hapi-fhir/docs/tools/hapi_fhir_cli.html
  summary:
    - >
      hapi-fhir-cli is the command-line distribution of HAPI FHIR, the Java
      implementation of the HL7 FHIR specification. It packages server, example-loading,
      terminology, validation, and maintenance tasks for people working with healthcare
      interoperability data.
  timeline:
    - '2014-04-15: HAPI FHIR 0.1 release recorded in the official changelog.'
    - '2014: HAPI FHIR 0.2 through 0.8 releases recorded across the official 2014 changelog.'
    - >
      2020s: Official documentation includes a dedicated command-line tool page and
      Homebrew installation command.
  usage:
    - >
      The documented CLI can start a local fully functional FHIR server for testing,
      upload example resources from HL7, upload terminology such as SNOMED CT and LOINC,
      and troubleshoot individual commands with debug output. Those commands make it
      useful for validating data pipelines and preparing local FHIR environments without
      writing Java code.
related-packages: []
category: data
package-manager:
  brew: hapi-fhir-cli
package-manager-url: https://formulae.brew.sh/formula/hapi-fhir-cli
license: Apache-2.0
