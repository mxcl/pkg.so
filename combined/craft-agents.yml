id: cask:craft-agents
display-name: Craft Agents
homepage: https://agents.craft.do/
repo: https://github.com/craft-ai-agents/craft-agents-oss
docs:
  - https://agents.craft.do/docs/getting-started/installation
  - https://agents.craft.do/docs/getting-started/introduction
  - https://agents.craft.do/docs/getting-started/quickstart
  - https://agents.craft.do/docs/reference/cli
config-file-location:
  unix:
    - ~/.craft-agent/config.json
    - ~/.craft-agent/preferences.json
    - ~/.craft-agent/theme.json
    - ~/.craft-agent/workspaces/{workspace-id}/sources/{source-slug}/config.json
credentials-file-location:
  unix: ~/.craft-agent/credentials.enc
history:
  adoption-history:
    - >
      Craft Agents is distributed as a desktop application for macOS, Windows, and
      Linux, with additional headless-server, browser, and CLI workflows. Its
      source-oriented installation documentation also supports building the Electron
      application from the public monorepo.
    - >
      The project aims at users who want coding-agent capabilities across broader
      digital workflows, including Craft documents, GitHub, Linear, Slack, local files,
      MCP servers, and REST APIs.
  package-nerd-significance:
    - >
      Craft Agents is package-nerd relevant as an open-source, local-first agent
      workbench that combines a desktop GUI with a scriptable CLI and headless server.
      Its configuration is exposed as files beneath ~/.craft-agent, making sources,
      skills, themes, permissions, and workspaces inspectable and portable.
    - >
      It also reflects the emerging packaging pattern for AI tools: an Electron desktop
      client, local encrypted credential storage, multiple model providers, MCP and REST
      integrations, and optional remote execution from the same monorepo.
  project-history:
    - >
      Craft Agents was created by Craft as an opinionated, graphical environment for
      working with AI agents beyond coding-only tasks. Official documentation says it is
      built on the Claude Agent SDK and extends that foundation with persistent
      sessions, review-oriented execution modes, multiple workspaces, and connected data
      sources.
    - >
      The project is open source under Apache 2.0. Its public repository was originally
      hosted under the lukilabs organization and later moved to the craft-ai-agents
      organization while retaining the established repository URL redirects.
  related-projects:
    - Craft is the document platform whose spaces can be connected as sources.
    - >
      Claude Code and the Claude Agent SDK provide an important technical and workflow
      reference point.
    - >
      Model connections include Anthropic, OpenAI, Google, GitHub Copilot, OpenRouter,
      and compatible providers.
    - MCP servers, REST APIs, and local folders are supported as source types.
  sources:
    - https://agents.craft.do/docs/getting-started/installation
    - https://agents.craft.do/docs/getting-started/introduction
    - https://agents.craft.do/docs/sources/overview
    - https://github.com/lukilabs/craft-agents-oss
  summary:
    - >
      Craft Agents is an open-source desktop and server-based AI-agent environment for
      working across documents, source repositories, APIs, messaging services, and local
      files.
  timeline:
    - >
      2025: Public repository history and early packaged releases established the Craft
      Agents desktop application.
    - '2026: The repository organization transitioned from lukilabs to craft-ai-agents.'
    - >
      2026: Official documentation describes desktop, browser, CLI, messaging, and
      remote-server access.
  usage:
    - >
      Users create persistent agent sessions, attach workspaces and sources, select an
      AI-model connection, and move between Explore, Ask to Edit, and Execute permission
      modes. Sources can represent MCP servers, REST APIs, Craft spaces, GitHub
      repositories, or local folders.
    - >
      Configuration is stored beneath ~/.craft-agent. The official repository documents
      config.json, preferences.json, and theme.json, while credentials are stored
      encrypted with AES-256-GCM in credentials.enc. Workspace source definitions use
      per-source config.json files.
category: ai
package-manager:
  brew-cask: craft-agents
package-manager-url: https://formulae.brew.sh/cask/craft-agents
tags:
