id: brew:cfv
display-name: cfv
homepage: https://github.com/cfv-project/cfv
repo: https://github.com/cfv-project/cfv
docs:
  - https://github.com/cfv-project/cfv/blob/python3/README.md
  - https://github.com/cfv-project/cfv/blob/python3/cfv.1
config-file-location:
  unix:
    - ~/.cfvrc
    - ~/_cfvrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents distribution through PyPI and mentions operating-system
      packaging paths such as Arch Linux, FreeBSD ports, and NixOS. The input package
      facts also show package-manager entries for Homebrew, MacPorts, and Nix.
  package-nerd-significance:
    - >
      For package and archive maintainers, cfv is interesting because it covers several
      checksum dialects in one small CLI, including formats that ordinary coreutils
      checksum commands do not create or parse.
  project-history:
    - >
      The maintained cfv project describes itself as a friendly fork of Matthew
      Mueller's original cfv, maintained by Lisa Gnedt. Its manual page still carries
      the older utility's shape: a single command for testing and creating many
      checksum-file formats.
  related-projects:
    - >
      The README compares cfv with GNU coreutils checksum commands, cksfv, RHash,
      aria2c, bsdsfv, pure-sfv, and bcfv.
  sources:
    - https://api.github.com/repos/cfv-project/cfv
    - https://github.com/cfv-project/cfv
    - https://github.com/cfv-project/cfv/blob/python3/README.md
    - https://github.com/cfv-project/cfv/blob/python3/cfv.1
    - https://formulae.brew.sh/api/formula/cfv.json
  summary:
    - >
      cfv is a command-line file verification utility for creating and checking checksum
      files used around archives, releases, and file-sharing workflows.
  timeline:
    - '2005: The cfv man page was dated 05 Feb 2005.'
    - >
      Python 3 era: The cfv-project fork documents Python >= 3.7 support and points
      Python 2 users to a separate branch.
  usage:
    - >
      cfv is used to verify that files match checksum manifests and to create manifests
      in formats including SFV, CSV, CRC, MD5, SHA-family sums, BLAKE3 b3sum files,
      BitTorrent metainfo files, and test-only PAR/PAR2 files.
related-packages:
  - id: brew:rhash
    reason: >
      Choose RHash when you want faster broad-format hashing, recursive processing,
      magnet links, or a reusable hashing library; cfv's official comparison says RHash
      covers most of the same formats but lacks cfv's missing-file-only mode.
    rel: alternative
    sources:
      - https://github.com/cfv-project/cfv
      - https://github.com/rhash/RHash
  - id: brew:cksfv
    reason: >
      Choose cksfv for a smaller utility focused specifically on creating and checking
      SFV manifests, while cfv handles many additional manifest formats.
    rel: alternative
    sources:
      - https://github.com/cfv-project/cfv
      - https://gitlab.com/heikkiorsila/cksfv
  - id: brew:coreutils
    reason: >
      GNU Coreutils supplies familiar md5sum and SHA-family commands for straightforward
      single-algorithm manifests, whereas cfv adds multi-format discovery and
      compatibility.
    rel: alternative
    sources:
      - https://github.com/cfv-project/cfv
      - https://www.gnu.org/software/coreutils/manual/coreutils.html
  - id: brew:aria2
    reason: >
      Choose aria2c when checksum verification is part of downloading BitTorrent or
      Metalink content; cfv is the more general tool for creating and checking local
      manifest files.
    rel: alternative
    sources:
      - https://github.com/cfv-project/cfv
      - https://aria2.github.io/manual/en/html/aria2c.html
category: system
package-manager:
  brew: cfv
  macports: cfv
  nix: cfv
package-manager-url: https://formulae.brew.sh/formula/cfv
license: GPL-2.0-or-later
tags:
  - checksum
  - cli
  - file-integrity
  - file-verification
  - hashing
  - torrent
description: Test and create various files (e.g., .sfv, .csv, .crc., .torrent)
executables:
  - cfv
provenance:
  formula: cfv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
