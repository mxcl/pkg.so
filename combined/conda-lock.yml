id: brew:conda-lock
display-name: conda-lock
homepage: https://conda.github.io/conda-lock/
repo: https://github.com/conda/conda-lock
docs:
  - https://conda.github.io/conda-lock
config-file-location:
  unix:
    - ./environment.yml
    - ./conda-lock.yml
    - ./pyproject.toml
    - ./meta.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      conda-lock fits the reproducible-environments gap between human-authored conda
      environment.yml files and fully pinned, multi-platform deployment artifacts. Its
      documentation emphasizes environment.yml, meta.yaml, pyproject.toml, integrated
      pip support, and solveless conda installation.
  package-nerd-significance:
    - >
      For package-manager users, conda-lock is important because it makes conda
      environments behave more like lockfile-centered ecosystems: input specs remain
      readable while machine-resolved artifacts preserve exact packages across Linux,
      macOS, Windows, and architecture variants.
  project-history:
    - >
      The official repository was created in 2019. Version 1.0.0, published in March
      2022, introduced the unified lock format as the default and documented the old
      explicit per-platform style as a compatibility mode. Version 2.0.0, published in
      May 2023, was the first release under the Conda organization after graduating from
      conda-incubator.
  related-projects:
    - >
      conda-lock is closely tied to conda, conda-forge, mamba, pip, Poetry-style
      pyproject metadata, and conda environment.yml workflows.
  sources:
    - https://conda.github.io/conda-lock
    - https://github.com/conda/conda-lock
    - https://github.com/conda/conda-lock/releases/tag/v1.0.0
    - https://github.com/conda/conda-lock/releases/tag/v2.0.0
  summary:
    - >
      conda-lock generates reproducible lock files for conda environments by solving for
      target platforms ahead of installation, so installers can consume pinned lock
      output without invoking the conda solver at deploy time.
  timeline:
    - '2019: Official GitHub repository created.'
    - '2022: v1.0.0 released with the unified lock format.'
    - '2023: v2.0.0 released as the first release under the Conda organization.'
  usage:
    - >
      Users typically provide one or more source files such as environment.yml,
      conda-lock.yml, pyproject.toml, or meta.yaml, choose target platforms, generate
      conda-lock.yml, and install or render platform-specific lock files in CI or
      deployment workflows.
related-packages:
  - id: brew:pixi
    reason: >
      Choose Pixi when you want a project-centric Conda workflow with its own pixi.toml
      and pixi.lock; conda-lock provides an official command and migration guide for
      translating existing specifications.
    rel: alternative
    sources:
      - https://conda.github.io/conda-lock/pixi-migration/
      - https://pixi.sh/latest/
  - id: brew:micromamba
    reason: >
      Use micromamba alongside conda-lock as a lightweight Conda-compatible solver and
      environment installer in workflows where conda-lock prepares or consumes
      reproducible environment metadata.
    rel: adjacent_workflow
    sources:
      - https://github.com/conda/conda-lock#readme
      - https://mamba.readthedocs.io/en/stable/user_guide/micromamba.html
category: developer-tools
package-manager:
  brew: conda-lock
package-manager-url: https://formulae.brew.sh/formula/conda-lock
license: MIT
tags:
  - cli
  - conda
  - lockfile
  - package-manager
  - python
  - reproducible-environments
description: Lightweight lockfile for conda environments
executables:
  - conda-lock
provenance:
  formula: conda-lock
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
