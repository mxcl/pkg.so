id: brew:kubefirst
display-name: Kubefirst
homepage: https://kubefirst.konstruct.io/docs/
repo: https://github.com/konstructio/kubefirst
docs:
  - https://kubefirst-pro.konstruct.io/docs
  - https://kubefirst.konstruct.io/docs
  - https://github.com/konstructio/kubefirst#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kubefirst targeted platform-engineering teams that wanted a repeatable GitOps
      baseline instead of wiring together Argo CD, infrastructure automation, secrets,
      ingress, and application delivery by hand. The README lists install guides for
      Akamai, AWS, Azure, Civo, DigitalOcean, Google Cloud, Vultr, K3s, and k3d, showing
      that the project positioned itself as cloud-provider agnostic.
    - >
      On March 5, 2024, Civo announced that it had acquired Kubefirst from Kubeshop and
      would keep the open source version and cloud-agnostic integrations. That
      acquisition is a notable adoption milestone because it moved the project from
      independent platform tool to part of a cloud provider's developer-platform
      portfolio.
  package-nerd-significance:
    - >
      Kubefirst is significant less as a tiny Unix-style utility and more as an example
      of a full platform bootstrapper distributed like a normal CLI. It sits in the same
      package-manager lane as cluster installers and GitOps bootstrappers: one binary
      creates a large opinionated stack.
  project-history:
    - >
      Civo's acquisition announcement states that Kubefirst started in 2019 as an open
      source project. The public GitHub repository under konstructio was created on
      January 26, 2021, and the README describes the Kubefirst CLI as creating instant
      GitOps platforms that integrate cloud-native tools from scratch in minutes.
    - >
      The project evolved from a CLI-only bootstrapper into a broader platform story.
      The repository README documents Kubefirst Pro as a commercial platform management
      UI installed with the OSS platform by default, and the Konstruct documentation
      presents the successor product direction as an internal developer platform with
      GitOps delivery.
  related-projects:
    - >
      Konstruct is the Civo documentation and product direction associated with the
      Kubefirst platform lineage.
    - >
      Argo CD, GitLab, Vault, Atlantis, external-dns, ingress-nginx, and External
      Secrets Operator appear in the repository topics and reflect the cloud-native
      tools Kubefirst assembled into a platform.
  sources:
    - https://api.github.com/repos/konstructio/kubefirst
    - https://formulae.brew.sh/formula/kubefirst
    - https://github.com/konstructio/kubefirst
    - https://github.com/konstructio/kubefirst/releases
    - https://kubefirst-pro.konstruct.io/docs
    - https://www.civo.com/newsroom/civo-acquires-kubefirst
  summary:
    - >
      Kubefirst is a Kubernetes platform bootstrapper focused on creating GitOps-based
      application delivery environments. Its CLI-oriented packaging made a multi-tool
      platform stack installable from developer package managers, while its product
      history moved from open source project to Civo-owned Konstruct-era platform
      tooling.
  timeline:
    - >
      2019: Kubefirst started as an open source project, according to Civo's acquisition
      announcement
    - '2021-01-26: konstructio/kubefirst public GitHub repository created'
    - '2024-03-05: Civo announced acquisition of Kubefirst from Kubeshop'
    - '2026-01-31: v2.10.5 release published'
  usage:
    - >
      Users run the kubefirst CLI to create a GitOps platform rather than a single
      Kubernetes resource. Its workflows are organized around platform installs for
      public clouds and local clusters, with documentation for each target provider's
      prerequisites, command flow, and resulting platform.
    - >
      Package-manager users care about the CLI because it turns a large platform
      bootstrap into a versioned command-line artifact, making it easier to install,
      pin, upgrade, and reproduce in automation.
related-packages:
  - id: brew:argocd
    reason: >
      Argo CD is the documented GitOps engine bootstrapped against a Kubefirst
      platform's GitOps repository, so its CLI is useful for inspecting and operating
      the resulting delivery system.
    rel: adjacent_workflow
    sources:
      - https://kubefirst.konstruct.io/docs/2.6/akamai/explore/gitops/
      - https://argo-cd.readthedocs.io/en/stable/user-guide/commands/argocd/
