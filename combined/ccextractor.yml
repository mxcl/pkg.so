docs:
  - https://ccextractor.org/docs/cchome
  - https://ccextractor.org/public/general/command_line_usage
  - https://github.com/CCExtractor/ccextractor#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CCExtractor has crossed from specialist broadcast/video tooling into mainstream
      packaging. Its README and downloads page document Windows package managers such as
      WinGet, Chocolatey, and Scoop, while the supplied package facts list Homebrew,
      Nix, Ubuntu, Scoop, and WinGet.
  package-nerd-significance:
    - >
      CCExtractor is significant because it packages an unusually deep media-domain
      parser behind a single CLI. It handles closed captions, teletext subtitles, DVD
      sources, transport streams, and related formats, making it a staple utility for
      automation, archival, accessibility, and media repair workflows.
  project-history:
    - >
      The official GitHub repository was created in April 2014 and is described by its
      metadata as the official version maintained by the core team. The project is
      GPL-2.0 licensed and combines a C core with C++, Python, and newer Rust components
      documented in its change log.
  related-projects:
    - >
      Official docs mention the Flutter GUI and additional CCExtractor-team projects
      such as Subtitle Downloader, Activity Extractor, and CCAligner.
  sources:
    - https://api.github.com/repos/CCExtractor/ccextractor
    - https://github.com/CCExtractor/ccextractor
    - https://www.ccextractor.org
    - https://ccextractor.org/docs/cchome
    - https://ccextractor.org/public/general/command_line_usage
    - https://github.com/CCExtractor/ccextractor#readme
    - https://formulae.brew.sh/api/formula/ccextractor.json
  summary:
    - >
      CCExtractor is the official closed-caption and subtitle extraction tool maintained
      by the CCExtractor project. The README describes it as software for producing
      subtitles from TV recordings and keeping up with many source formats.
  timeline:
    - '2014: Official GitHub repository created.'
    - '2021: 0.94 release notes record CEA-708 extraction changes and Rust decoder work.'
    - >
      2025: 0.95 and 0.96 release notes record broader Rust porting, Docker usage, and
      expanded subtitle format support.
    - '2026: Homebrew formula packages CCExtractor 0.96.6.'
  usage:
    - >
      The main workflow is command-line subtitle extraction: run ccextractor on video
      inputs to produce subtitle files. Official command-line documentation says the
      main program is console-based and can be scripted for integration into larger
      processes.
related-packages: []
