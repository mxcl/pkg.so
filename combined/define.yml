id: brew:define
display-name: define
homepage: https://github.com/Rican7/define
repo: https://github.com/Rican7/define
docs:
  - https://github.com/Rican7/define#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/define/config.json
    - ~/.define.conf.json
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/define/config.json
    - ~/.define.conf.json
history:
  adoption-history:
    - >
      define is packaged for Homebrew and also supports `go install`, so it fits both
      package-manager installation and Go developer workflows.
  package-nerd-significance:
    - >
      define is interesting as a small example of packaging API-backed reference data
      for the shell. It has the classic CLI shape - flags, environment variables, config
      files, release binaries, and `go install` - while depending on external dictionary
      services for some sources.
  project-history:
    - >
      The README describes define as a command-line dictionary and thesaurus application
      with multiple sources. Its configuration model was built for CLI use: command-line
      flags override environment variables, which override JSON configuration files.
    - >
      The public release history starts with v0.1.0 in March 2018, followed by small
      0.1.x releases and later 0.2, 0.3, and 0.4 releases through March 2024.
  related-projects:
    - >
      The README documents Merriam-Webster and Oxford dictionary API credentials as
      source-specific integrations.
  sources:
    - https://github.com/Rican7/define
    - https://github.com/Rican7/define/releases/tag/v0.1.0
    - https://github.com/Rican7/define/releases/tag/v0.2.0
    - https://github.com/Rican7/define/releases/tag/v0.3.0
    - https://github.com/Rican7/define/releases/tag/v0.4.0
    - https://formulae.brew.sh/formula/define
  summary:
    - >
      define is a Go command-line dictionary and thesaurus client that can query
      multiple reference sources from the terminal.
  timeline:
    - '2018: v0.1.0 is published.'
    - '2023: v0.2.0 and v0.3.0 are published.'
    - '2024: v0.4.0 is published.'
  usage:
    - >
      The tool is used as a terminal reference lookup. Its README calls out command-line
      flags for one-off use, environment variables for API keys, and configuration files
      for dotfile-friendly defaults such as preferred sources.
related-packages:
  - id: brew:dict
    reason: >
      Choose dict for the standardized DICT network protocol, configurable dictionary
      servers, and local server administration; choose define for a simpler
      multi-provider lookup client with HTTP API integrations.
    rel: alternative
    sources:
      - https://github.com/Rican7/define
      - https://github.com/cheusov/dictd
      - https://www.dict.org/bin/Dict
  - id: brew:wordnet
    reason: >
      Choose WordNet for a local lexical database centered on word senses and semantic
      relationships; choose define for convenient terminal definitions and thesaurus
      results drawn from multiple services.
    rel: alternative
    sources:
      - https://github.com/Rican7/define
      - https://wordnet.princeton.edu/
      - https://wordnet.princeton.edu/documentation
category: productivity
package-manager:
  brew: define
package-manager-url: https://formulae.brew.sh/formula/define
license: MIT
tags:
  - cli
  - command-line-tool
  - dictionary
  - go
  - reference
  - thesaurus
description: Command-line dictionary (thesaurus) app, with access to multiple sources
executables:
  - define
provenance:
  formula: define
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
