id: cask:zcode
display-name: ZCode
homepage: https://zcode.z.ai/en/
repo: null
docs:
  - https://zcode.z.ai/en/docs/configuration
  - https://zcode.z.ai/en/docs/install
  - https://zcode.z.ai/en/docs/welcome
config-file-location:
  unix:
    - ~/.zcode
    - .zcode
credentials-file-location:
  unix: ~/.zcode/v2/credentials.json
history:
  adoption-history:
    - >
      ZCode is distributed for macOS and Windows, with Linux builds available through a
      beta group. Its model connectivity supports Z.ai and BigModel accounts, API keys,
      and compatible third-party providers, broadening use beyond a single bundled model
      service.
  package-nerd-significance:
    - >
      ZCode exemplifies the shift from editor plug-ins toward standalone agentic
      development environments. Package enthusiasts may care about its desktop release
      cadence, terminal and Git integration, remote SSH and Docker workspaces, MCP
      configuration, reusable commands and skills, and compatibility with multiple model
      endpoints.
  project-history:
    - >
      ZCode developed into a dedicated Agentic Development Environment centered on the
      first-party ZCode Agent and GLM models. The 3.x generation emphasizes long-horizon
      tasks, persistent workspace context, review workflows, remote control, bot
      channels, and an extensible plugin system.
  related-projects:
    - >
      ZCode integrates with Z.ai and BigModel services and can import historical
      conversations from Claude Code. It also supports Anthropic- and OpenAI-compatible
      model providers and Model Context Protocol servers.
  sources:
    - 'Official installation documentation: https://zcode.z.ai/en/docs/install'
    - 'Official model configuration: https://zcode.z.ai/en/docs/configuration'
    - 'Official product site: https://zcode.z.ai/en'
    - 'Official welcome documentation: https://zcode.z.ai/en/docs/welcome'
  summary:
    - >
      ZCode is a desktop agentic development environment designed for sustained
      AI-assisted software-development tasks, with deep GLM integration and support for
      external model providers.
  timeline:
    - >
      3.x generation: ZCode adopted an in-house agent architecture focused on
      long-horizon tasks and unified review workflows.
    - >
      2026: Official documentation describes GLM-5.2 integration, desktop releases,
      Linux beta builds, remote control, and bot-channel workflows.
  usage:
    - >
      Developers open a local, SSH, or Docker workspace and instruct ZCode Agent to
      inspect code, edit files, run terminal commands, debug, preview applications, and
      review Git changes. Users can connect an account or API-key-backed model provider
      and extend workflows with commands, skills, plugins, and MCP servers.
category: developer-tools
package-manager:
  brew-cask: zcode
package-manager-url: https://formulae.brew.sh/cask/zcode
