id: brew:got
display-name: Game of Trees
homepage: https://gameoftrees.org/
repo: https://git.gameoftrees.org/gitweb?p=got.git
docs:
  - https://gameoftrees.org/
  - https://gameoftrees.org/got.1.html
  - https://gameoftrees.org/got.conf.5.html
config-file-location:
  unix:
    - ~/.got/got.conf
    - /etc/got.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Got started with OpenBSD as its home audience and later gained an official
      portable version for Linux, FreeBSD, NetBSD, DragonFlyBSD, and macOS. The portable
      page lists pre-packaged versions for Alpine, MacPorts, Homebrew, NixOS, Void, Arch
      AUR, pkgsrc, Debian, Ubuntu, FreeBSD ports, Chimera Linux, GNU Guix, and
      Slackware, showing adoption beyond OpenBSD while retaining an OpenBSD-centered
      development culture.
  package-nerd-significance:
    - >
      Game of Trees is notable in package-manager culture because it is a serious
      alternative command-line interface and tool suite for Git-format repositories,
      built with BSD licensing and OpenBSD sensibilities. Packaging it gives non-OpenBSD
      users access to got, gotadmin, gotd, gotwebd, tog, and related workflows without
      replacing Git's on-disk repository format.
  project-history:
    - >
      The project is an OpenBSD-style version-control effort with a C codebase, BSD
      licensing, manual pages, and a command set split across tools such as got,
      gotadmin, gotd, gotwebd, and tog. The got(1) manual describes got as a distributed
      version control system using the Git repository format, with checked-out work
      trees and synchronization between repositories.
    - >
      A EuroBSDcon 2019 presentation described Game of Trees as a work-in-progress
      version control system intended to appeal to OpenBSD developers, designed and
      written from scratch, compatible with Git repositories, and built around concise
      manual pages. The public release directory shows a long sequence of 0.x tarball
      releases beginning with the 0.1 through 0.39 archives listed together in 2020,
      then steady release growth through 0.126 in 2026.
  related-projects:
    - Git is the repository format and interoperability target.
    - tog is the interactive terminal repository browser shipped in the Game of Trees family.
    - gotd and gotwebd provide repository server and web browser interfaces.
    - got-portable is the portability branch for Linux, BSDs, and macOS.
    - Game of Trees Hub is the related hosting service linked from the official site.
  sources:
    - https://formulae.brew.sh/formula/got
    - https://gameoftrees.org/
    - https://gameoftrees.org/code.html
    - https://gameoftrees.org/got.1.html
    - https://gameoftrees.org/got.conf.5.html
    - https://gameoftrees.org/portable.html
    - https://gameoftrees.org/releases/
    - https://www.openbsd.org/papers/eurobsdcon2019-gameoftrees.pdf
  summary:
    - >
      Game of Trees, usually invoked as got, is a version control system that stores
      history in Git repositories while prioritizing ease of use and simplicity over
      flexibility. The official site says it is developed on OpenBSD, aimed especially
      at OpenBSD developers, and designed so Git can still be used for functionality not
      implemented in Got.
  timeline:
    - >
      2017: got(1) manual copyright begins with Martin Pieuchot, with later Stefan
      Sperling copyright years.
    - >
      2019: EuroBSDcon presentation describes Game of Trees as a work-in-progress VCS
      for OpenBSD developers.
    - >
      2020-09: The release directory lists got 0.1 through 0.39 tarballs with September
      2020 timestamps.
    - >
      2023: FOSDEM material covers gotd and the portable page describes support beyond
      OpenBSD.
    - '2026-05: Game of Trees 0.126 and Game of Trees -portable 0.126 are released.'
  usage:
    - >
      Users can initialize, import, clone, check out, diff, commit, branch, tag, fetch,
      and send Git-format repositories through got commands. The got.conf manual
      documents per-repository and per-work-tree configuration for authors, remotes,
      branches, signer settings, and fetch/send behavior, while related tools handle
      repository administration, server operation, web browsing, and terminal browsing.
related-packages:
  - id: brew:git
    reason: >
      Choose Git when you need the broadest command and hosting ecosystem or operations
      that Got still delegates to Git, while choosing Got for its smaller
      OpenBSD-oriented interface over the same repository format.
    rel: alternative
    sources:
      - https://gameoftrees.org/got.1.html
      - https://git-scm.com/docs
category: developer-tools
package-manager:
  apk: got
  brew: got
  debian: got
  macports: got
  nix: got
  ubuntu: got
package-manager-url: https://formulae.brew.sh/formula/got
license: ISC
tags:
  - cli
  - git
  - scm
  - version-control
description: Version control system
executables:
  - gitwrapper
  - got
  - gotadmin
  - gotctl
  - gotd
  - gotsh
  - gotwebctl
  - gotwebd
  - tog
provenance:
  formula: got
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
