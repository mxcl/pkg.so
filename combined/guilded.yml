history:
  adoption-history:
    - >
      Guilded targeted organized gaming communities with server-based chat plus
      calendars, forums, scheduling, voice, and video features. Roblox's acquisition
      announcement states that the service launched in 2017 and added a bot API in March
      2021.
    - >
      Roblox acquired Guilded in August 2021 while retaining it as an independent
      product group. Current onboarding connects a Guilded account to Roblox identity,
      further integrating the community platform with Roblox's ecosystem.
  package-nerd-significance:
    - >
      Guilded's Homebrew cask offers a manageable macOS installation path for a
      proprietary, cross-platform group-chat client. Its interest to package users lies
      less in local configurability than in distributing a gaming-community alternative
      to general-purpose chat applications.
  project-history:
    - >
      Guilded launched in 2017 as a platform for gaming communities. Its product
      combined text and direct messaging with tiered voice chat, video, integrated event
      calendars, scheduling, forums, and community-management tools.
    - >
      In March 2021 Guilded launched a bot API intended to make community bot
      development more accessible. Roblox acquired Guilded on 16 August 2021, and the
      team continued operating as an independent product group.
  related-projects:
    - Roblox provides the account identity used by current Guilded registration.
    - Guilded's bot API supports community automation around Guilded servers.
  sources:
    - >
      https://about.roblox.com/newsroom/2021/08/roblox-acquires-guilded-platform-connect-gaming-communities
    - >
      https://support.guilded.gg/hc/en-us/articles/31402934778647-How-to-Create-a-Guilded-Account
    - https://www.guilded.gg/home/index.html
    - source_facts.package-manager
  summary:
    - >
      Guilded is a group-chat and community-management platform designed primarily for
      gaming communities, with messaging, voice, video, calendars, forums, scheduling,
      and server organization.
  timeline:
    - '2017: Guilded launched.'
    - '2021-03: Guilded launched its bot API.'
    - '2021-08-16: Roblox announced its acquisition of Guilded.'
    - >
      2025: Official onboarding documentation centered Guilded registration on Roblox
      accounts.
  usage:
    - >
      Communities create or join servers, organize members into groups and channels,
      schedule events, maintain forums, and communicate through text, voice, video, and
      direct messages.
    - >
      Current users authenticate through a connected Roblox account; account age and
      verification can affect features such as streaming, video, and file uploads.
