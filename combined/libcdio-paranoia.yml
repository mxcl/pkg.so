id: brew:libcdio-paranoia
display-name: libcdio-paranoia
homepage: https://github.com/libcdio/libcdio-paranoia
repo: https://github.com/libcdio/libcdio-paranoia
docs:
  - https://github.com/libcdio/libcdio-paranoia#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The original cdparanoia became a default Unix answer for accurate audio-CD
      extraction because it favored repeated reads, jitter handling, and explicit
      progress reporting over speed. libcdio-paranoia carried that model into the
      libcdio ecosystem, making it a dependency for CD-ripping stacks that wanted the
      paranoia algorithm through a more portable device abstraction.
    - >
      Homebrew, Debian/Ubuntu, Fedora, Arch, Alpine, Nix, MacPorts, and openSUSE package
      it either as libcdio-paranoia or as cd-paranoia utilities, reflecting its role as
      both a library and a command-line tool provider.
  package-nerd-significance:
    - >
      This package is interesting because it is a compatibility bridge between two
      famous CD stacks: Xiph's cdparanoia, a classic ripper with a strong
      error-correction culture, and GNU libcdio, the OS-independent CD access library.
      It also explains why some distributions split cdparanoia functionality into
      libcdio-derived packages instead of shipping only the older Xiph source.
  project-history:
    - >
      The upstream cdparanoia lineage began as Paranoia I/II patches to Heiko
      Eissfeldt's cdda2wav in late 1994. Xiph's FAQ says cdparanoia became an
      independent rewrite in January 1998 as Paranoia III, with the library doing the
      extraction and correction work below the command-line ripper.
    - >
      The libcdio-paranoia repository describes itself as a port of Xiph.org's cdda
      paranoia to use libcdio for CD-ROM access, allowing cdparanoia-style extraction on
      platforms beyond GNU/Linux. Its 2024 release notes also record a move of the code
      from Savannah to GitHub and a requirement for libcdio 2.0.0 or newer.
  related-projects:
    - >
      Related projects include Xiph cdparanoia, cdda2wav, libcdio, GNU libcdio's cd-info
      and CD-DA libraries, and CD-ripping tools such as Whipper that care about sample
      offsets and accurate extraction.
  sources:
    - https://formulae.brew.sh/formula/libcdio-paranoia
    - https://github.com/libcdio/libcdio-paranoia
    - https://github.com/libcdio/libcdio-paranoia/releases
    - https://xiph.org/paranoia/
    - https://xiph.org/paranoia/faq.html
  summary:
    - >
      libcdio-paranoia is the cdparanoia audio-extraction code adapted to use libcdio
      for CD-ROM access. Its practical reason to exist is portability: it keeps the
      paranoia error-correction model while delegating device access to libcdio instead
      of the original Linux-only access layer.
  timeline:
    - '1994: Paranoia I/II began as patches to cdda2wav.'
    - '1998-01: cdparanoia became an independent rewrite as Paranoia III.'
    - >
      2001: cdparanoia III 9.8 marked the end of the previous generation for Linux 2.0
      through early 2.4.
    - '2008-09-11: Xiph listed cdparanoia III 10.2 as the stable release.'
    - >
      2024-05-07: libcdio-paranoia release-10.2+2.0.2 notes recorded the move to GitHub
      and a large drive-gap fix.
  usage:
    - >
      The visible command is cd-paranoia, used to extract CD-DA audio into WAV,
      AIFF/AIFC, or raw PCM-style output. The library form is used by applications that
      want paranoia-style CD-DA reads while relying on libcdio for drive and image
      access.
related-packages:
  - id: brew:libcdio
    reason: >
      Use GNU libcdio directly for general optical-disc and image access;
      libcdio-paranoia specifically layers robust audio-extraction behavior over that
      interface.
    rel: adjacent_workflow
    sources:
      - https://github.com/libcdio/libcdio-paranoia
      - https://www.gnu.org/software/libcdio/libcdio.html
