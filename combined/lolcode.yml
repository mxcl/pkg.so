id: brew:lolcode
display-name: LOLCODE
homepage: http://www.lolcode.org/
repo: https://github.com/justinmeza/lci
docs:
  - https://github.com/justinmeza/lci#readme
  - https://lolcode.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      For package-manager users, `lci` matters because it gives LOLCODE a small,
      buildable command-line implementation rather than leaving the language as only a
      meme-era specification. The input metadata records packages in Homebrew and Nix,
      while GitHub repository metadata shows a long-lived public repository with
      hundreds of stars and forks.
  package-nerd-significance:
    - >
      `lolcode` is a classic package-manager curiosity: a real CLI interpreter for a
      joke language that still has a spec, tests, releases, and source builds. It is
      useful in package catalogs because it exercises build systems, esolang culture,
      and the boundary between novelty languages and maintained command-line tools.
  project-history:
    - >
      The LOLCODE specification archive records version 1.2 as a final draft dated 12
      July 2007 and version 1.3 as a later draft that advances the 1.2 specification
      with proposals from the original forum and site. The official lolcode.org page
      links the language specification and the `lci` interpreter together, making the
      interpreter the project-facing implementation for users who want to run LOLCODE
      programs.
    - >
      `lci` was created and maintained by Justin J. Meza and its README describes it as
      a C interpreter designed to be correct, portable, fast, and precisely documented.
      The repository was created on GitHub in 2010, carries GPL-3.0-or-later licensing
      in the README, and keeps the main branch aligned with the LOLCODE 1.3 language
      specification while directing newer experimental language work to a `future`
      branch.
  related-projects:
    - `lolcode-spec` archives the LOLCODE language specifications.
    - >
      `httpd.lol` is linked from the `lci` README as an example of newer language
      features on the `future` branch.
  sources:
    - https://api.github.com/repos/justinmeza/lci
    - https://github.com/justinmeza/lci#readme
    - https://github.com/justinmeza/lolcode-spec/blob/master/v1.2/lolcode-spec-v1.2.md
    - https://github.com/justinmeza/lolcode-spec/blob/master/v1.3/lolcode-spec-v1.3.md
    - https://www.lolcode.org/
    - source_facts.package-manager-url
  summary:
    - >
      The Homebrew `lolcode` formula packages `lci`, Justin Meza's C interpreter for
      LOLCODE. LOLCODE itself is an esoteric programming language presented on
      lolcode.org, and `lci` became the practical Unix-style command-line interpreter
      linked from that official site.
  timeline:
    - '2007: LOLCODE 1.2 final draft dated 12 July 2007.'
    - '2010: `justinmeza/lci` repository created on GitHub.'
    - '2014: `lolcode-spec` archive repository created on GitHub.'
    - '2026: `lci` repository metadata shows continued activity.'
  usage:
    - >
      The official lolcode.org example installs by cloning `justinmeza/lci`, running
      CMake, and building with `make`. The README documents Linux, macOS, and Windows
      builds, optional generated documentation, and `ctest` for the bundled conformance
      tests.
    - >
      Users run LOLCODE source through the `lci` executable. The official language
      examples use the familiar `HAI`, `CAN HAS STDIO?`, `VISIBLE`, and `KTHXBYE` form,
      while the 1.2 and 1.3 specs define syntax, comments, file structure, variables,
      and related language behavior.
related-packages: []
category: language-runtime
