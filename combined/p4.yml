id: cask:p4
display-name: P4
homepage: https://www.perforce.com/products/helix-core-apps/command-line-client
repo: null
docs:
  - >
    https://help.perforce.com/helix-core/server-apps/cmdref/current/Content/CmdRef/Home-cmdref.html
  - https://www.perforce.com/products/helix-core-apps/command-line-client
config-file-location:
  unix:
    - P4CONFIG-named file in the current working directory
    - a parent directory, for example .p4config.txt
  windows:
    - P4CONFIG-named file in the current working directory
    - a parent directory, for example .p4config.txt
    - Perforce settings stored by p4 set in the Windows registry
credentials-file-location:
  unix: ~/.p4tickets
  windows:
    - '%USERPROFILE%\p4tickets.txt'
    - P4PASSWD in the Windows registry when set with p4 set
    - P4V
history:
  adoption-history:
    - >
      P4 became associated with centralized version-control deployments that must handle
      large repositories and binary assets. Perforce presents the wider P4 platform as
      serving demanding game, semiconductor, media, and enterprise engineering
      workflows.
  package-nerd-significance:
    - >
      The p4 executable is the canonical automation interface to P4 Server. It matters
      to package users because a small command-line client unlocks workspace
      synchronization, changelists, shelving, branching, merging, administration, and
      scripted CI access to an otherwise server-centered commercial ecosystem.
    - >
      Its P4CONFIG search behavior is especially useful in developer environments:
      repository-local or parent-directory settings can automatically select the correct
      server, user, and workspace as the shell moves between projects.
  project-history:
    - >
      Christopher Seiwald started Perforce in 1995 around a version-control system
      originally called Perforce and commonly abbreviated P4. The product was renamed
      Helix Core in 2016 as Perforce expanded into a broader software portfolio.
    - >
      In 2025, Perforce announced that Helix Core would again use the P4 name.
      Long-established command names such as p4 sync and p4 submit made the change a
      return to terminology already familiar to users.
  related-projects:
    - P4 Server is the service operated by the client.
    - P4V provides a graphical client for the same server and workspace model.
    - >
      P4Merge, P4 Admin, and P4 Code Review cover comparison, administration, and review
      workflows around P4.
  sources:
    - https://help.perforce.com/helix-core/
    - >
      https://help.perforce.com/helix-core/server-apps/cmdref/current/Content/P4Guide/configuration.process.configfiles.html
    - >
      https://help.perforce.com/helix-core/server-apps/cmdref/current/content/CmdRef/p4_tickets.html
    - https://www.perforce.com/blog/vcs/introducing-the-p4-platform
  summary:
    - >
      P4 CLI is the command-line client for Perforce P4, the centralized version-control
      platform formerly branded Helix Core. It connects local workspaces to P4 Server
      and exposes both everyday versioning operations and lower-level administrative
      capabilities.
  timeline:
    - >
      1995: Christopher Seiwald founded Perforce around the version-control system
      commonly called P4.
    - '2016: The original Perforce version-control product was renamed Helix Core.'
    - '2025: Perforce announced the return from the Helix Core product name to P4.'
  usage:
    - >
      Users configure a server address, identity, and client workspace, then run
      commands such as p4 sync, p4 edit, p4 submit, and p4 reconcile. Authentication
      tickets obtained through p4 login are kept in the P4TICKETS file.
    - >
      Teams with several workspaces commonly set P4CONFIG to a filename such as
      .p4config. P4 searches the working directory and its parents for that file,
      allowing settings to follow each workspace.
category: developer-tools
