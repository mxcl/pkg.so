id: brew:minijinja-cli
display-name: MiniJinja CLI
homepage: https://docs.rs/minijinja/latest/minijinja/
repo: https://github.com/mitsuhiko/minijinja
docs:
  - https://docs.rs/crate/minijinja-cli
  - https://docs.rs/minijinja/latest/minijinja
  - https://github.com/mitsuhiko/minijinja#readme
config-file-location:
  unix: ~/.minijinja.toml
credentials-file-location: null
history:
  sources:
    - https://crates.io/crates/minijinja-cli
    - https://docs.rs/crate/minijinja-cli/latest
    - https://github.com/mitsuhiko/minijinja
    - https://lucumr.pocoo.org/2024/8/27/minijinja/
  summary:
    - >
      MiniJinja is Armin Ronacher's Rust reimplementation of the Jinja2 template
      language he originally created for Python. Ronacher described the project as
      emerging from an infrastructure-automation experiment where Rust needed
      dynamically loaded Jinja-style templates without the heavier dependency profile or
      compile-time model of alternatives such as Askama. The library deliberately
      follows Jinja2 syntax and behavior so existing templates, editor integrations, and
      mental models remain useful in Rust programs.
  usage:
    - >
      The CLI packages that engine as a small command-line renderer: templates can be
      read from files or standard input, data can be supplied on the command line, and
      rendered output is written to stdout. In package-manager terms, minijinja-cli is
      the executable companion to the minijinja crate rather than a separate templating
      ecosystem. Its niche is scripting, config generation, release automation, and
      other places where users want Jinja-compatible text generation without embedding
      Python.
related-packages:
  - id: brew:jinja2-cli
    reason: >
      Choose jinja2-cli when Python's native Jinja2 engine, custom Python filters, or
      Jinja2 extensions matter more than MiniJinja CLI's compiled Rust implementation.
    rel: alternative
    sources:
      - https://github.com/mitsuhiko/minijinja/blob/main/minijinja-cli/README.md
      - https://github.com/mattrobenolt/jinja2-cli
category: developer-tools
package-manager:
  apk: minijinja-cli
  brew: minijinja-cli
package-manager-url: https://formulae.brew.sh/formula/minijinja-cli
license: Apache-2.0
tags:
  - cli
  - jinja
  - rust
  - template-rendering
  - templating
description: Render Jinja2 templates directly from the command-line to stdout
executables:
  - minijinja-cli
provenance:
  formula: minijinja-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
