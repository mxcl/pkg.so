id: brew:iam-policy-json-to-terraform
display-name: iam-policy-json-to-terraform
homepage: https://flosell.github.io/iam-policy-json-to-terraform/
repo: https://github.com/flosell/iam-policy-json-to-terraform
docs:
  - https://github.com/flosell/iam-policy-json-to-terraform#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README and project site present both a web version and a command-line version,
      which helped the tool serve quick one-off conversions as well as automation.
      GitHub repository metadata showed hundreds of stars by 2026, and the Homebrew
      formula packaged it as a CLI with macOS and Linux bottles.
    - >
      Its adoption niche is Terraform users working with AWS IAM policies, especially
      when policy JSON comes from AWS examples or preexisting infrastructure and needs
      to become an aws_iam_policy_document block rather than a raw JSON blob.
  package-nerd-significance:
    - >
      Package nerds care about this package as an example of a tiny IaC workflow tool
      that became useful enough for Homebrew and Nix packaging. Its value comes from
      removing a repetitive translation step rather than from being a platform.
  project-history:
    - >
      The GitHub repository was created on April 28, 2018, and the changelog records
      version 1.0.0 on the same date as the initial release. That release read IAM
      policy JSON from standard input and wrote Terraform HCL to standard output, with
      support for core IAM policy properties such as Sid, Effect, Action, Resource, and
      Condition.
    - >
      The project expanded through small, targeted releases: version 1.1.0 added
      Condition support with multiple values and a -name flag, version 1.2.0 added
      wildcard-principal support, version 1.6.0 improved conversion of heredoc-style
      policy input containing HCL expressions, and version 1.9.0 stopped generating
      empty sid entries when missing from input JSON.
  related-projects:
    - >
      The tool is directly related to Terraform, the AWS provider's
      aws_iam_policy_document data source, and AWS IAM JSON policy documents.
    - >
      Adjacent tools include Terraform import and broader infrastructure converters, but
      this project intentionally focuses on IAM policy document conversion.
  sources:
    - https://flosell.github.io/iam-policy-json-to-terraform/
    - https://formulae.brew.sh/formula/iam-policy-json-to-terraform
    - https://github.com/flosell/iam-policy-json-to-terraform
    - https://github.com/flosell/iam-policy-json-to-terraform/blob/master/CHANGELOG.md
    - https://github.com/flosell/iam-policy-json-to-terraform/releases
  summary:
    - >
      iam-policy-json-to-terraform is a small Go-based converter that turns AWS IAM
      policy JSON into Terraform aws_iam_policy_document HCL. It exists for the
      practical infrastructure-as-code chore of translating policies copied from AWS
      documentation, consoles, or existing files into Terraform-native data sources.
  timeline:
    - '2018: Repository created and 1.0.0 released with stdin JSON to stdout HCL conversion.'
    - '2018: 1.1.0 added multi-value Condition handling and a generated-policy name flag.'
    - '2019: 1.2.0 added wildcard-principal support.'
    - '2020: 1.6.0 improved conversion of heredoc input containing HCL expressions.'
    - '2025: 1.9.0 changed missing Sid handling; 1.9.2 added a Linux ARM64 build target.'
  usage:
    - >
      The README shows piping raw JSON into iam-policy-json-to-terraform or redirecting
      a policy file through standard input. The output is Terraform HCL for an
      aws_iam_policy_document data source.
    - >
      The tool is deliberately narrow: it converts one policy representation into
      another. It does not manage AWS resources or run Terraform, which keeps it useful
      in scripts, editor workflows, and migration chores.
related-packages:
  - id: brew:opentofu
    reason: >
      Use OpenTofu to initialize, plan, and apply compatible Terraform configuration
      containing the generated aws_iam_policy_document HCL.
    rel: adjacent_workflow
    sources:
      - https://flosell.github.io/iam-policy-json-to-terraform/
      - https://opentofu.org/docs/intro/migration/
      - https://opentofu.org/docs/
  - id: brew:terraform-iam-policy-validator
    reason: >
      After incorporating the generated HCL into a Terraform configuration, validate the
      planned IAM policies against AWS IAM Access Analyzer checks.
    rel: adjacent_workflow
    sources:
      - https://github.com/flosell/iam-policy-json-to-terraform
      - https://github.com/awslabs/terraform-iam-policy-validator
category: developer-tools
package-manager:
  brew: iam-policy-json-to-terraform
  nix: iam-policy-json-to-terraform
package-manager-url: https://formulae.brew.sh/formula/iam-policy-json-to-terraform
license: Apache-2.0
tags:
  - aws
  - cli
  - converter
  - iam
  - infrastructure-as-code
  - terraform
description: Convert a JSON IAM Policy into terraform
executables:
  - iam-policy-json-to-terraform
provenance:
  formula: iam-policy-json-to-terraform
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
