id: brew:merman-cli
display-name: merman-cli
homepage: https://frankorz.com/merman/
repo: https://github.com/Latias94/merman
docs:
  - https://github.com/Latias94/merman#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      Its niche is the browserless side of Mermaid rendering. Instead of launching
      Chromium or a JavaScript runtime, Merman exposes Rust crates for parsing, semantic
      JSON, typed render models, SVG, raster output, and terminal-oriented ASCII or
      Unicode output. The CLI packages those capabilities for users who want
      Mermaid-style diagrams in build scripts, terminals, or Rust-heavy environments
      where headless browser dependencies are undesirable.
  sources:
    - https://crates.io/crates/merman-cli
    - https://docs.rs/merman
    - https://formulae.brew.sh/formula/merman-cli
    - https://github.com/Latias94/merman
  summary:
    - >
      merman-cli is the command-line wrapper around Merman, an independent Rust
      implementation of Mermaid parsing, layout, and rendering. The project describes
      itself as Mermaid.js, but headless, in Rust, and notes that it is not affiliated
      with or endorsed by the Mermaid project. Its stated compatibility target is a
      pinned Mermaid release, with parity checked through semantic, layout, and SVG
      baselines.
  usage:
    - >
      Because the public footprint is still mostly the project README, docs.rs, and
      crates packaging, there is limited independent history to report. The strongest
      sourced context is technical: it is a parity-focused compatibility implementation
      by Mermaid users, distributed as Rust crates and as a Homebrew CLI.
related-packages:
  - id: brew:mermaid-cli
    reason: >
      Choose the official Mermaid JavaScript CLI when Chromium-based Mermaid rendering
      and exact upstream browser behavior matter more than Merman's native Rust,
      browserless execution.
    rel: alternative
    sources:
      - https://github.com/Latias94/merman
      - https://github.com/mermaid-js/mermaid-cli
category: developer-tools
package-manager:
