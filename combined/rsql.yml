id: brew:rsql
display-name: rsql
homepage: https://theseus-rs.github.io/rsql/rsql_cli/
repo: https://github.com/theseus-rs/rsql
docs:
  - https://github.com/theseus-rs/rsql#readme
  - https://theseus-rs.github.io/rsql/rsql_cli
config-file-location:
  unix: ~/.rsql/rsql.toml
  windows: '%APPDATA%\rsql\rsql.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project offers shell, Cargo, archive, and Windows installer methods,
      while source_facts.package-manager records Homebrew distribution. Its
      documentation describes a broad driver set spanning databases, cloud services, and
      tabular files.
  package-nerd-significance:
    - >
      rsql applies a single interactive SQL interface to heterogeneous data sources.
      Package enthusiasts may value its Rust implementation, driver-oriented workspace,
      safe-code policy, self-contained installers, and ability to treat ordinary files
      as queryable data.
  project-history:
    - >
      rsql was developed by the theseus-rs organization as a modern command-line SQL
      interface. The repository evolved into a multi-crate Rust workspace containing the
      CLI, core, REPL, drivers, and formatter components.
  related-projects:
    - >
      PostgreSQL, MySQL, SQLite, and DuckDB: Representative database engines supported
      by rsql.
    - >
      CSV, Parquet, Arrow, Avro, and Excel: Representative file formats exposed through
      its SQL interface.
  sources:
    - https://github.com/theseus-rs/rsql#readme
    - https://theseus-rs.github.io/rsql/rsql_cli/
    - https://theseus-rs.github.io/rsql/rsql_cli/book/
    - source_facts.package-manager
  summary:
    - >
      rsql is a Rust command-line SQL client providing one interactive interface for
      relational databases, cloud data sources, and common structured file formats.
  timeline:
    - '2026: Official release documentation lists version 0.20.0, published on July 26.'
    - >
      2026: The project documents support for more than 20 data sources and formats and
      interface translations for more than 40 languages.
  usage:
    - >
      Users connect with a URL, enter an interactive REPL, or append a query for
      one-shot execution. The client supplies completion, command history, multiple
      output formats, and drivers for databases and files. Its guide also documents
      customization through an `rsql.toml` configuration file, although the reviewed
      official material did not establish a reliable default filesystem location.
category: data
package-manager:
  brew: rsql
package-manager-url: https://formulae.brew.sh/formula/rsql
license: Apache-2.0 OR MIT
tags:
  - cli
  - data-files
  - database
  - rust
  - sql
description: CLI for relational databases and common data file formats
executables:
  - rsql
provenance:
  formula: rsql
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
