id: brew:dosbox-x
display-name: DOSBox-X
homepage: https://dosbox-x.com/
repo: https://github.com/joncampbell123/dosbox-x
docs:
  - https://dosbox-x.com/wiki
config-file-location:
  unix: dosbox-x.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      DOSBox-X's adoption is strongest among users who need more than a game-focused
      DOSBox profile: people running old DOS applications, Windows 3.x/9x/ME software,
      PC-98 programs, networking, printing, save states, menu-driven configuration, and
      development or preservation workloads.
    - >
      The project publishes Windows, Linux, macOS, and DOS builds, and source facts list
      distribution through Homebrew, Debian/Ubuntu, MacPorts, Nix, Scoop, and winget.
  package-nerd-significance:
    - >
      DOSBox-X is significant because it is the sprawling, preservation-heavy DOSBox
      branch: it values knobs, hardware coverage, and compatibility experiments that a
      simpler game launcher might avoid. For package nerds, it is the variant you reach
      for when emulation coverage and configurability matter more than minimalism.
    - >
      It also documents the genealogy of DOSBox forks unusually clearly, naming its
      relationship to DOSBox, DOSBox SVN Daum, DOSBox ECE, DOSBox Staging, DOSVAX, and
      vDosPlus.
  project-history:
    - >
      The official README says DOSBox-X began as a fork of the original DOSBox project
      around mid-2011. Maintainer Jonathan Campbell wanted to make broad emulator
      changes, many of them non-game-related, without depending on upstream acceptance
      in a project whose primary focus was DOS games.
    - >
      DOSBox-X later incorporated features and improvements from DOSBox SVN Daum and
      from other projects including DOSBox ECE, DOSBox Staging, DOSVAX/DOSVAXJ3, and
      vDosPlus. The project identifies itself as a separate project from DOSBox because
      the two have different schedules and priorities.
    - >
      GitHub release history shows public Windows release artifacts by February 2018,
      and the README describes a monthly release pattern in which new versions are
      normally made public at the start of each month.
  related-projects:
    - >
      DOSBox-X is related to original DOSBox, DOSBox SVN, DOSBox SVN Daum, DOSBox ECE,
      DOSBox Staging, DOSVAX/DOSVAXJ3, vDosPlus, DOSLIB/DOSLIB2, and HX DOS Extender.
  sources:
    - https://github.com/joncampbell123/dosbox-x
    - https://dosbox-x.com/wiki
    - https://dosbox-x.com/about.html
    - https://api.github.com/repos/joncampbell123/dosbox-x/releases?per_page=100
    - https://formulae.brew.sh/formula/dosbox-x
  summary:
    - >
      DOSBox-X is a DOSBox-derived emulator that expands beyond DOS gaming into
      accurate, highly configurable emulation for DOS applications, Windows 3.x/9x/ME
      environments, PC-98/DOS/V use cases, development, testing, and preservation.
  timeline:
    - '2011: DOSBox-X starts as a fork of the original DOSBox project.'
    - '2018: GitHub release artifacts show public DOSBox-X Windows builds.'
    - >
      2020s: The project documents a monthly release pattern with new versions normally
      published near the start of each month.
    - '2026: Releases continue under date-based dosbox-x-vYYYY.MM.DD tags.'
  usage:
    - >
      Users run dosbox-x as a configurable virtual DOS machine for games, applications,
      Windows-on-DOS setups, and hardware-accuracy testing. The wiki is the main user
      guide for setup and operation, while the README points builders to INSTALL and
      BUILD documents.
    - >
      Its monthly release model and wide option surface make it attractive for packagers
      who want frequent upstream fixes, but it also means package maintainers need to
      watch config compatibility, SDL build choices, and optional platform-specific
      features.
related-packages:
  - id: brew:dosbox-staging
    reason: >
      Choose DOSBox Staging for a modern, mostly drop-in DOSBox continuation centered on
      DOS games, sensible defaults, and ease of use.
    rel: alternative
    sources:
      - https://dosbox-x.com/about.html
      - https://www.dosbox-staging.org/about/
  - id: cask:dosbox
    reason: >
      Choose original DOSBox when the upstream project's established game-focused
      behavior and configuration compatibility are more important than DOSBox-X's
      expanded platform coverage.
    rel: alternative
    sources:
      - https://dosbox-x.com/about.html
      - https://www.dosbox.com/DOSBoxManual.html
category: games
package-manager:
  brew: dosbox-x
  debian: dosbox-x
  macports: dosbox-x
  nix: dosbox-x
  scoop: extras/dosbox-x
  ubuntu: dosbox-x
  winget: joncampbell123.DOSBox-X
package-manager-url: https://formulae.brew.sh/formula/dosbox-x
license: GPL-2.0-or-later
