id: brew:bingrep
display-name: bingrep
homepage: https://github.com/m4b/bingrep
repo: https://github.com/m4b/bingrep
docs:
  - https://github.com/m4b/bingrep#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bingrep stayed small but packaged: the supplied package facts list Homebrew,
      MacPorts, Nix, and Arch packages, while crates.io provides the Rust-native cargo
      install path.
  package-nerd-significance:
    - >
      Package nerds care about bingrep as a lightweight alternative view over the same
      artifact formats handled by objdump, nm, readelf, and file. It is less
      foundational than GNU Binutils, but useful when the job is visual triage of
      sections, headers, offsets, and symbols.
  project-history:
    - >
      The GitHub repository was created in February 2017, and the crate first appeared
      on crates.io in July 2017. The README says the tool grew from a personal
      binary-inspection workflow and was uploaded after the author had been sharing
      screenshots of binary data.
    - >
      Its README lists support for ELF, Mach-O, Unix/BSD archives, and debug-only PE
      parsing, with goblin as the backend responsible for loading and parsing binary
      formats.
  related-projects:
    - >
      bingrep is closely related to m4b/goblin, its binary parsing backend. It sits in
      the same working niche as readelf, objdump, nm, strings, and newer Rust
      binary-inspection tools.
  sources:
    - GitHub API reports repository creation in 2017.
    - GitHub README documents origins, supported formats, examples, and goblin relationship.
    - crates.io API reports crate publication and release chronology.
    - input.source_facts.package-manager lists package-manager availability.
  summary:
    - >
      bingrep is a Rust command-line viewer for inspecting executable and archive
      formats with colored, grep-like output aimed at quick binary analysis.
  timeline:
    - '2017: GitHub repository is created.'
    - '2017: 0.1.0 is published to crates.io.'
    - '2026: 0.12.1 is published to crates.io.'
  usage:
    - >
      Common use is `bingrep /bin/ls` to view binary metadata, with options for debug
      output, symbol demangling, experimental hextable output, ranges, and ELF string
      searching.
related-packages:
  - id: brew:binutils
    reason: >
      GNU Binutils is the more established, scriptable alternative when separate tools
      such as objdump, readelf, and nm are preferable to bingrep's consolidated colored
      view.
    rel: alternative
    sources:
      - https://github.com/m4b/bingrep#readme
      - https://sourceware.org/binutils/docs/
  - id: brew:binsider
    reason: >
      Binsider is an interactive TUI alternative for Linux ELF analysis when dynamic
      tracing, linked-library inspection, strings, and hexdumps are needed alongside
      structural views.
    rel: alternative
    sources:
      - https://github.com/m4b/bingrep#readme
      - https://github.com/orhun/binsider
      - https://binsider.dev/
category: developer-tools
package-manager:
  brew: bingrep
  macports: bingrep
  nix: bingrep
  pacman: bingrep
package-manager-url: https://formulae.brew.sh/formula/bingrep
license: MIT
tags:
  - binary-analysis
  - cli
  - grep
  - rust
description: Greps through binaries from various OSs and architectures
executables:
  - bingrep
provenance:
  formula: bingrep
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
