id: brew:gdown
display-name: gdown
homepage: https://github.com/wkentaro/gdown
repo: https://github.com/wkentaro/gdown
docs:
  - https://github.com/wkentaro/gdown#readme
config-file-location: null
credentials-file-location:
  unix: ~/.cache/gdown/cookies.txt
history:
  adoption-history:
    - >
      The repository's packaging metadata and README badges show distribution through
      PyPI, while the input package facts show availability through Homebrew, Debian,
      MacPorts, and Nix. The official GitHub repository also has several thousand stars,
      reflecting broad use beyond a single package manager.
  package-nerd-significance:
    - >
      For package and data workflow users, gdown matters because it turns a web-app
      download flow into a scriptable artifact fetch. It is common in machine-learning
      examples, reproducible notebooks, CI scripts, and package recipes that need to
      pull large public Drive assets without teaching curl about Google's confirmation
      pages.
  project-history:
    - >
      The official repository was created in 2015 under wkentaro/gdown and describes the
      project as a Google Drive public file and folder downloader. Its README positions
      it explicitly as a tool for the gap left by curl and wget on Google Drive URLs,
      later expanding to folder downloads, Google Docs/Sheets/Slides export formats,
      resumable transfers, cookies, proxies, and a Python API.
    - >
      By the 5.x and 6.x release series, gdown had become both a CLI and a reusable
      Python package, with installation documented through pip and uv and with examples
      for direct file IDs, shared links, recursive folders, JSON listing, cached
      downloads, and arbitrary HTTP/HTTPS URLs.
  related-projects:
    - >
      gdown is related to curl and wget as a specialized downloader for Google Drive
      URLs, and to other Google Drive CLI clients such as glotlabs/gdrive when
      OAuth-backed Drive management rather than public-file download is needed.
  sources:
    - https://github.com/wkentaro/gdown
    - https://github.com/wkentaro/gdown#readme
    - https://github.com/wkentaro/gdown/releases
  summary:
    - >
      gdown is a Python command-line tool and library for downloading public Google
      Drive files and folders in cases where ordinary curl or wget downloads hit Google
      Drive confirmation pages, awkward share-link formats, or export flows.
  timeline:
    - '2015: Official GitHub repository created.'
    - '2024: v5.2.0 published in the 5.x release line.'
    - '2026: v6.0.0 and v6.1.0 published, continuing active maintenance.'
  usage:
    - >
      Common usage is to paste a Google Drive share URL or file ID into the gdown CLI,
      optionally adding output paths, resume mode, folder mode, export formats, or
      cookie support. Python users can call gdown.download, gdown.download_folder, or
      cached_download from scripts and data-processing workflows.
related-packages:
  - id: brew:gdrive-downloader
    reason: >
      Choose gdrive-downloader for a Bash-oriented alternative with parallel downloads,
      API-key and OAuth modes, and minimal native command-line dependencies instead of a
      Python library.
    rel: alternative
    sources:
      - https://github.com/wkentaro/gdown#readme
      - https://github.com/Akianonymus/gdrive-downloader#readme
  - id: brew:gdrive
    reason: >
      Choose gdrive when you need an authenticated Drive account client for listing,
      uploading, downloading, exporting, and organizing files rather than a downloader
      centered on shared links.
    rel: alternative
    sources:
      - https://github.com/wkentaro/gdown#readme
      - https://github.com/glotlabs/gdrive#readme
      - https://github.com/glotlabs/gdrive/blob/main/docs/basic_usage.md
  - id: brew:rclone
    reason: >
      Choose rclone when Google Drive must participate in repeatable copy,
      synchronization, service-account, shared-drive, or multi-cloud workflows rather
      than a single-purpose download flow.
    rel: alternative
    sources:
      - https://github.com/wkentaro/gdown#readme
      - https://rclone.org/drive/
      - https://rclone.org/docs/
category: networking
package-manager:
  brew: gdown
  debian: gdown
  macports: gdown
  nix: gdown
package-manager-url: https://formulae.brew.sh/formula/gdown
license: MIT
tags:
