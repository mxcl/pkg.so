  - downloader
  - file-transfer
  - google-drive
  - python
description: Google Drive Public File Downloader when Curl/Wget Fails
executables:
  - gdown
provenance:
  formula: gdown
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
