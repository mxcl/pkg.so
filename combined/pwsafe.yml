id: brew:pwsafe
display-name: pwsafe
homepage: https://github.com/nsd20463/pwsafe
repo: https://github.com/nsd20463/pwsafe
docs:
  - https://github.com/nsd20463/pwsafe#readme
config-file-location: null
credentials-file-location:
  unix:
    - ~/.pwsafe.dat
    - ~/.pwsafe.dat~
history:
  adoption-history:
    - >
      pwsafe has been packaged across Homebrew, MacPorts, Alpine, Nix, and Scoop, giving
      the older command-line client a presence on several Unix-like and cross-platform
      package ecosystems.
  package-nerd-significance:
    - >
      It is a compact, script-friendly implementation of the Password Safe workflow and
      file format, useful to users who prefer terminal tools and portable encrypted
      databases over a graphical password manager.
  project-history:
    - >
      Nicolas S. Dade developed pwsafe as a command-line tool compatible with
      Counterpane's Password Safe. The repository records copyright from 2004 and
      explains that its former project domain is gone, leaving GitHub as the current
      development and documentation home.
  related-projects:
    - >
      Counterpane Password Safe, whose encrypted database format and workflow pwsafe
      implements for command-line users.
    - >
      The separate pwsafe/pwsafe graphical Password Safe project should not be confused
      with this nsd20463/pwsafe command-line client.
  sources:
    - 'Official manual source: https://github.com/nsd20463/pwsafe/blob/master/pwsafe.1.in'
    - 'Official repository README: https://github.com/nsd20463/pwsafe#readme'
    - source_facts.package-manager
  summary:
    - >
      pwsafe is a GPL command-line password manager and password generator compatible
      with Counterpane's Password Safe encrypted databases.
  timeline:
    - '2004: Earliest copyright year stated by the project.'
    - '2020: Latest copyright year in the current repository README.'
  usage:
    - >
      Users invoke pwsafe from a terminal to create, inspect, or modify encrypted
      password databases and to generate passwords. The official pwsafe(1) manual is the
      authoritative command and option reference.
category: security
package-manager:
  apk: pwsafe
  brew: pwsafe
  macports: pwsafe
  nix: pwsafe
  scoop: extras/pwsafe
package-manager-url: https://formulae.brew.sh/formula/pwsafe
license: GPL-2.0-or-later
tags:
  - cli
  - encryption
  - password-generator
  - password-manager
  - security
description: Generate passwords and manage encrypted password databases
executables:
  - pwsafe
provenance:
  formula: pwsafe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
