id: brew:asciinema
display-name: asciinema
homepage: https://asciinema.org
repo: https://github.com/asciinema/asciinema
docs:
  - https://docs.asciinema.org/
  - https://docs.asciinema.org/manual/cli/configuration
  - https://docs.asciinema.org/manual/cli/configuration/v3
config-file-location:
  unix:
    - ~/.config/asciinema/config.toml
    - /etc/asciinema/config.toml
credentials-file-location:
  unix: ~/.local/state/asciinema/install-id
history:
  adoption-history:
    - >
      asciinema spread because it solved a packaging-era problem: terminal sessions are
      text streams, not pixels, so they can be captured, replayed, embedded, uploaded,
      and versioned more naturally than screen recordings. Its official README
      emphasizes `.cast` files, terminal replay, web embedding, server upload, and live
      streaming.
    - >
      The input package facts show broad distribution across Alpine, Homebrew, Debian,
      Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE packaging. That breadth matches
      actual usage: developers install it from the system package manager, run
      `asciinema rec`, then share the resulting recording locally, on asciinema.org, or
      on a self-hosted server.
  package-nerd-significance:
    - >
      asciinema is a classic terminal-culture package: tiny command, durable text-like
      artifact, easy package-manager install, and excellent demos in READMEs and bug
      reports. It also has a notable implementation migration from Python to Rust, which
      affects downstream packagers, dependency closure, generated man pages, and shell
      completions.
  project-history:
    - >
      The GitHub repository was created in 2011 and the project identifies Marcin Kulik
      as copyright holder from that year. The early release stream reached v0.1 in 2012
      and v1.0.0 in March 2015, establishing asciinema as a small command-line recorder
      tied to the asciinema.org sharing service.
    - >
      The project evolved from a Python implementation to a Rust implementation. The
      current README says active development happens on the `develop` branch, that the
      current 3.x generation is written in Rust, and that the previous 2.x generation
      written in Python remains available on the `python` branch.
  related-projects:
    - asciinema-player embeds recordings on web pages.
    - asciinema-server, including asciinema.org, hosts uploads and relay streaming.
    - The asciicast file format is the recording format used by the CLI and player.
  sources:
    - https://api.github.com/repos/asciinema/asciinema/releases
    - https://docs.asciinema.org/
    - https://docs.asciinema.org/manual/cli/configuration/v3
    - https://github.com/asciinema/asciinema
    - source_facts.package-manager
  summary:
    - >
      asciinema is a terminal-session recorder, streamer, and player built around
      lightweight terminal event captures rather than conventional video files. It
      became a standard CLI/package-manager tool for sharing reproducible terminal
      demos, bug reports, tutorials, and command-line workflows.
  timeline:
    - '2011: GitHub repository created; project copyright line starts at 2011.'
    - '2012: v0.1 tag commit in the repository.'
    - '2015: v1.0.0 release published.'
    - '2018: v2.0.0 release published.'
    - '2025: v3.0.0 release published, marking the Rust 3.x generation.'
    - '2026: v3.2.1 release published.'
  usage:
    - >
      Common usage is `asciinema rec demo.cast` to capture a shell session, replaying
      recordings in a terminal, embedding them on a web page with asciinema-player, or
      uploading/streaming them through an asciinema server. CLI 3.x adds TOML
      configuration at the user and system level for server URL, recording behavior,
      playback, notifications, and hotkeys.
related-packages:
  - id: brew:agg
    reason: >
      Use agg after recording with asciinema when the resulting .cast session must be
      exported as a portable animated GIF for documentation or sites without an
      asciinema player.
    rel: adjacent_workflow
    sources:
      - https://docs.asciinema.org/manual/agg/
      - https://docs.asciinema.org/manual/agg/usage/
  - id: brew:ttyrec
    reason: >
      Choose ttyrec for a smaller traditional tty recorder and ttyplay workflow when web
      publishing, asciicast interoperability, and asciinema's live-streaming features
      are unnecessary.
    rel: alternative
    sources:
      - https://0xcc.net/ttyrec/
      - https://docs.asciinema.org/manual/cli/
category: developer-tools
package-manager:
  apk: asciinema
  brew: asciinema
  debian: asciinema
  dnf: asciinema
  macports: asciinema
  nix: asciinema
  pacman: asciinema
  ubuntu: asciinema
  zypper: asciinema
package-manager-url: https://formulae.brew.sh/formula/asciinema
license: GPL-3.0-only
tags:
  - cli
  - recording
  - sharing
  - streaming
  - terminal
description: Record and share terminal sessions
executables:
  - asciinema
provenance:
  formula: asciinema
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
