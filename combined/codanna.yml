id: brew:codanna
display-name: Codanna
homepage: https://docs.codanna.sh/
repo: https://github.com/bartolli/codanna
docs:
  - https://docs.codanna.sh/
  - https://docs.codanna.sh/features/semantic-search
  - https://docs.codanna.sh/reference/customization
  - https://docs.codanna.sh/reference/debugging
config-file-location:
  unix: .codanna/settings.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Codanna is distributed through its own installer, Homebrew, Cargo, Nix, and GitHub
      releases. Its packaging matters because AI coding-agent users often need a small
      local binary that can be installed in developer shells and spawned as an MCP
      server.
  package-nerd-significance:
    - >
      Codanna is part of the recent wave of package-manager-installed AI-agent support
      tools: local-first, Rust binary distribution, MCP integration, and semantic
      indexing without requiring a hosted code-search service.
  project-history:
    - >
      The official docs say Codanna came from a need for rapid research and
      pair-programming exploration where LSP servers were too slow for repeated
      questions. Its README positions it as code context for AI assistants, with
      structured symbol lookup, relationship tracing, and semantic search.
  related-projects:
    - >
      Language servers, ripgrep-style code search, vector embedding services, and MCP
      clients are adjacent tools in Codanna workflows.
  sources:
    - https://docs.codanna.sh/
    - https://docs.codanna.sh/features/semantic-search
    - https://docs.codanna.sh/installation
    - https://docs.codanna.sh/reference/customization
    - https://github.com/bartolli/codanna/releases
  summary:
    - >
      Codanna is a Rust-based local code intelligence CLI and MCP server for AI coding
      agents. It indexes code, tracks relationships, and provides semantic search over
      code and documents.
  timeline:
    - '2026: Official releases include prebuilt Linux, macOS, and Windows assets.'
    - >
      2026: v0.9.23 is documented as a resolver precision release with MCP and indexing
      changes.
  usage:
    - >
      A typical workflow is to run codanna init, index a project, then query via CLI or
      MCP tools such as semantic_search_with_context. Configuration lives in
      .codanna/settings.toml, while embedding API keys are intentionally
      environment-only.
related-packages:
  - id: cask:codex
    reason: >
      Codanna documents a persistent MCP configuration for Codex CLI, allowing Codex to
      query Codanna's local code index as an agent tool.
    rel: adjacent_workflow
    sources:
      - https://docs.codanna.sh/
      - https://developers.openai.com/codex/mcp
  - id: cask:claude-code
    reason: >
      Codanna documents Claude Code as an MCP client that can automatically launch its
      server for indexed code search and relationship queries.
    rel: adjacent_workflow
    sources:
      - https://docs.codanna.sh/installation
      - https://code.claude.com/docs/en/mcp
  - id: cask:cursor
    reason: >
      Codanna provides a documented Cursor MCP configuration, making Cursor a supported
      client for its local semantic-search and code-intelligence tools.
    rel: adjacent_workflow
    sources:
      - https://docs.codanna.sh/
      - https://cursor.com/docs
category: ai
package-manager:
  brew: codanna
package-manager-url: https://formulae.brew.sh/formula/codanna
license: Apache-2.0
tags:
  - ai
  - ai-agents
  - cli
  - code-intelligence
  - mcp
  - semantic-search
description: Code intelligence system with semantic search
executables:
  - codanna
provenance:
  formula: codanna
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
