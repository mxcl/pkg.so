id: brew:mago
display-name: Mago
homepage: https://github.com/carthage-software/mago
repo: https://github.com/carthage-software/mago
docs:
  - https://mago.carthage.software/
config-file-location:
  unix: mago.toml
  windows: mago.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Mago's adoption is still young, but its packaging story is already broad for a PHP
      developer tool. Official docs list installation through the Carthage shell
      installer, Composer, Homebrew, Cargo, and Docker, while the supplied Homebrew
      input also lists Nix and winget packages.
    - >
      The project has several thousand GitHub stars and more than a hundred forks, which
      is notable for a relatively new PHP toolchain and reflects interest in Rust-based
      replacements or complements for PHPStan, Psalm, PHP-CS-Fixer, and formatters.
  package-nerd-significance:
    - >
      Mago is package-nerd significant because it compresses several familiar PHP QA
      tools into one Rust binary. That changes packaging ergonomics: package managers
      can offer static analysis, linting, formatting, shell completions, schemas, and
      update workflows as a single install.
    - >
      Its version-pinning and schema model are especially relevant to maintainers
      because code-formatting and lint behavior must be reproducible across local
      machines, CI, and editor integrations.
  project-history:
    - >
      The public GitHub repository was created in October 2024. The documentation brands
      Mago as an oxidized PHP toolchain and describes three core tools in one binary:
      analyzer, linter, and formatter.
    - >
      By 2025 the project had a long beta release train toward 1.0, and by mid-2026 the
      documentation showed a latest 1.42.0 version. The docs also show configuration
      discovery, schema publishing for editors, project version pinning, self-update
      behavior, and WebAssembly playground support.
  related-projects:
    - >
      PHPStan, Psalm, Phan, PHP-CS-Fixer, and Pretty PHP are adjacent PHP analysis,
      linting, and formatting tools referenced or benchmarked against in Mago's
      documentation.
    - >
      Composer, Homebrew, Cargo, Docker, Nix, and winget are relevant distribution
      channels for the toolchain.
  sources:
    - https://github.com/carthage-software/mago
    - https://github.com/carthage-software/mago/releases
    - https://mago.carthage.software/latest/en/
    - https://mago.carthage.software/latest/en/guide/configuration/
    - source_facts.package-manager
    - source_facts.repo
  summary:
    - >
      Mago is a Rust-written PHP toolchain that combines static analysis, linting,
      formatting, and guard-style checks in one binary. It targets PHP projects that
      want faster local and CI feedback without installing a PHP runtime for the tool
      itself.
  timeline:
    - '2024: Public GitHub repository created.'
    - '2025: 1.0.0 beta releases published.'
    - '2026: Documentation shows the 1.42.0 stable line.'
    - '2026: Benchmarks and playground are promoted in official docs.'
  usage:
    - >
      The standard workflow is to install Mago, run `mago init` in a PHP project, and
      then run `mago analyze`, `mago lint`, or `mago fmt`. The official docs say
      initialization detects project layout and writes `mago.toml`.
    - >
      Mago discovers configuration from the workspace, `$XDG_CONFIG_HOME`, `~/.config`,
      and the home directory, looking for `mago` and `mago.dist` files in TOML, YAML,
      YML, or JSON formats. It also publishes JSON schemas so editors and CI can
      validate configuration.
related-packages:
  - id: brew:phpstan
    reason: >
      Choose PHPStan when you want the established dedicated PHP static-analysis
      ecosystem; choose Mago when a single native binary covering analysis, linting,
      formatting, and guard checks is preferable.
    rel: alternative
    sources:
      - https://github.com/carthage-software/mago
      - https://github.com/carthage-software/php-toolchain-benchmarks
      - https://phpstan.org/
  - id: brew:psalm
    reason: >
      Choose Psalm for a dedicated PHP type-analysis workflow and its annotation
      ecosystem; Mago is a unified alternative that explicitly supports Psalm
      annotations alongside other code-quality functions.
    rel: alternative
    sources:
      - https://github.com/carthage-software/mago
      - https://mago.carthage.software/
      - https://psalm.dev/
  - id: brew:php-cs-fixer
    reason: >
      Choose PHP-CS-Fixer for its focused, mature rule-based coding-standard fixer;
      choose Mago when formatting should share one executable and configuration workflow
      with linting and static analysis.
    rel: alternative
    sources:
      - https://github.com/carthage-software/mago
      - https://github.com/carthage-software/php-toolchain-benchmarks
      - https://cs.symfony.com/
category: developer-tools
package-manager:
  brew: mago
  nix: mago
  winget: CarthageSoftware.Mago
package-manager-url: https://formulae.brew.sh/formula/mago
license: Apache-2.0 OR MIT
tags:
  - cli
  - formatter
  - linter
  - php
  - static-analysis
  - toolchain
description: Toolchain for PHP to help developers write better code
executables:
  - mago
provenance:
  formula: mago
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
