history:
  adoption-history:
    - >
      QIDI Studio is distributed for macOS, Windows, and Linux and is tailored to QIDI
      printers, filaments, presets, device connectivity, and support workflows.
    - >
      The application supports both local network connections and remote device
      workflows, while exported G-code can also be transferred manually by USB storage.
  package-nerd-significance:
    - >
      QIDI Studio is a clear example of open-source slicer lineage being adapted by a
      hardware vendor: it descends through Bambu Studio and PrusaSlicer to Slic3r and
      the RepRap community.
    - >
      For package users, that ancestry explains its familiar profile-and-plate workflow
      while its QIDI-specific presets, network functions, account features, and release
      cadence distinguish it from upstream slicers.
  project-history:
    - >
      QIDI Technology developed QIDI Studio as its professional slicer and
      printer-management application. The project is licensed under AGPL-3.0.
    - >
      The official project records a direct lineage from Bambu Studio, which is based on
      PrusaSlicer, itself derived from Slic3r. QIDI releases continue to synchronize
      selected upstream Bambu Studio changes while adding QIDI printer and service
      features.
  related-projects:
    - Bambu Studio is QIDI Studio's immediate upstream foundation.
    - PrusaSlicer and Slic3r form the earlier open-source lineage.
    - >
      The QIDI Link mobile application complements QIDI Studio with mobile monitoring
      and control.
  sources:
    - https://github.com/QIDITECH/QIDIStudio
    - https://github.com/QIDITECH/QIDIStudio/releases
    - https://us.qidi3d.com/pages/qidi-studio
    - https://wiki.qidi3d.com/en/software/qidi-studio/quick-guide
  summary:
    - >
      QIDI Studio is QIDI Technology's open-source slicer and device application for
      preparing models, generating G-code, and sending jobs to QIDI 3D printers.
  timeline:
    - >
      Upstream lineage: Slic3r led to PrusaSlicer, then Bambu Studio, and subsequently
      QIDI Studio.
    - >
      2026: QIDI Studio releases continued incorporating upstream slicing changes
      alongside QIDI device, cloud-sync, printer-profile, and account features.
  usage:
    - >
      Users import 3D models, arrange and modify them on a build plate, choose printer,
      filament, and process presets, slice the plate, and inspect the resulting layers,
      material use, and estimated print time.
    - >
      Completed G-code can be sent to a connected printer over the network, exported
      locally, or transferred with a USB drive.
related-packages:
  - id: cask:bambu-studio
    reason: >
      Choose Bambu Studio for Bambu Lab's first-party printer workflow; QIDI Studio is
      derived from it and adds QIDI-specific machines, presets, and device integration.
    rel: alternative
    sources:
      - https://github.com/QIDITECH/QIDIStudio
      - https://github.com/bambulab/BambuStudio
  - id: cask:orcaslicer
    reason: >
      Choose OrcaSlicer for a community-driven, cross-vendor slicer with extensive
      calibration tooling and broad printer profiles; choose QIDI Studio for QIDI's
      first-party device workflow.
    rel: alternative
    sources:
      - https://github.com/QIDITECH/QIDIStudio
      - https://github.com/OrcaSlicer/OrcaSlicer
  - id: cask:prusaslicer
    reason: >
      Choose PrusaSlicer for Prusa's broadly supported upstream slicer and profile
      ecosystem; QIDI Studio follows its lineage indirectly and specializes the
      experience for QIDI hardware.
    rel: alternative
    sources:
      - https://github.com/QIDITECH/QIDIStudio
      - https://github.com/prusa3d/PrusaSlicer
