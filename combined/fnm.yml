id: brew:fnm
display-name: fnm
homepage: https://github.com/Schniz/fnm
repo: https://github.com/Schniz/fnm
docs:
  - https://github.com/Schniz/fnm/tree/master/docs
  - https://github.com/Schniz/fnm#readme
config-file-location:
  unix:
    - ./.node-version
    - ./.nvmrc
    - ./package.json
credentials-file-location: null
history:
  adoption-history:
    - >
      fnm has broad package-manager coverage. The supplied package metadata lists
      Homebrew, Alpine, Chocolatey, MacPorts, Nix, Arch, Scoop, WinGet, and openSUSE
      packaging, while the official README documents installation through Homebrew,
      WinGet, Scoop, Chocolatey, Cargo, release binaries, and an install script.
  package-nerd-significance:
    - >
      fnm is significant to package-manager users because it is both a language runtime
      manager and a packaged CLI with native support across Unix and Windows package
      ecosystems. Its Rust implementation and project-file compatibility make it a
      common alternative to shell-heavy Node version managers.
  project-history:
    - >
      The project occupies the same problem space as earlier Node version managers but
      frames its design around a small Rust binary and fast shell startup. Official
      documentation is split between the repository README and a dedicated `docs`
      directory covering commands and configuration.
  related-projects:
    - >
      fnm is related to Node.js and project version files such as `.node-version` and
      `.nvmrc`. It is also related to package-manager distribution channels including
      Homebrew, WinGet, Scoop, Chocolatey, Cargo, Nix, Arch, Alpine, MacPorts, and
      openSUSE.
  sources:
    - https://formulae.brew.sh/api/formula.json
    - https://formulae.brew.sh/formula/fnm
    - https://github.com/Schniz/fnm
    - https://github.com/Schniz/fnm#readme
    - https://github.com/Schniz/fnm/tree/master/docs
  summary:
    - >
      fnm, short for Fast Node Manager, is a cross-platform Node.js version manager
      built in Rust. Its official README emphasizes speed, single-file installation,
      instant startup, and compatibility with `.node-version` and `.nvmrc` project
      files.
  timeline:
    - >
      Current: Official README describes fnm as a fast and simple Node.js version
      manager built in Rust.
    - >
      Current: Official README documents Homebrew, WinGet, Scoop, Chocolatey, Cargo,
      release-binary, and install-script installation paths.
    - >
      Current: Supplied package metadata lists fnm across Homebrew, Alpine, Chocolatey,
      MacPorts, Nix, Arch, Scoop, WinGet, and openSUSE.
  usage:
    - >
      Typical fnm usage starts with installing the binary, evaluating `fnm env` in the
      user's shell, and letting fnm select Node versions from project files. The README
      documents shell setup for Bash, Zsh, Fish, PowerShell, and Windows Command Prompt,
      plus completions for common shells.
related-packages:
  - id: brew:n
    reason: >
      Choose n for a minimal Unix-oriented Node manager that installs one active runtime
      into a common prefix; choose fnm when you need native Windows support and
      shell-driven per-project switching.
    rel: alternative
    sources:
      - https://github.com/Schniz/fnm#readme
      - https://github.com/tj/n
category: developer-tools
package-manager:
  apk: fnm
  brew: fnm
  chocolatey: fnm
  macports: fnm
  nix: fnm
  pacman: fnm
  scoop: main/fnm
  winget: Schniz.fnm
  zypper: fnm
package-manager-url: https://formulae.brew.sh/formula/fnm
license: GPL-3.0-only
tags:
  - cli
  - javascript
  - nodejs
  - rust
  - version-manager
description: Fast and simple Node.js version manager
executables:
  - fnm
provenance:
  formula: fnm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
