id: brew:binocle
display-name: binocle
homepage: https://github.com/sharkdp/binocle
repo: https://github.com/sharkdp/binocle
docs:
  - https://github.com/sharkdp/binocle#readme
config-file-location:
  unix: /usr/local/etc/binkd.conf-dist
credentials-file-location: null
history:
  adoption-history:
    - >
      binocle is packaged beyond Cargo: the supplied package facts list Homebrew,
      MacPorts, Nix, and Arch, and the README documents release binaries, a Debian
      package, Arch installation, and cargo install.
  package-nerd-significance:
    - >
      binocle is interesting because it packages binary archaeology as a visual
      workflow. It does not replace readelf or objdump; it helps decide where to look
      before switching to lower-level tools.
  project-history:
    - >
      The sharkdp/binocle repository was created in September 2021, with v0.1.0 released
      in October 2021. Its README explains the central idea: colorize bytes by rule and
      render them in a rectangular grid with controls for offset, stride, width, and
      colorization mode.
    - >
      The README includes examples for ELF binaries, memory dumps, Doom assets, and perf
      samples, and explicitly lists related visual binary-analysis projects.
  related-projects:
    - >
      The README lists related work including binvis.io, cantor.dust, veles, and
      hobbits, alongside academic work on visual binary fragment types.
  sources:
    - GitHub API reports repository creation and releases.
    - >
      GitHub README documents purpose, operation model, installation, examples, and
      related work.
    - crates.io API reports crate publication and latest crate version.
    - input.source_facts.package-manager lists package-manager availability.
  summary:
    - >
      binocle is a graphical binary-data visualizer that maps bytes to pixels so users
      can spot structure, image-like regions, and suspicious or interesting areas in
      large files.
  timeline:
    - '2021: GitHub repository is created.'
    - '2021: v0.1.0 release and crates.io publication.'
    - '2023: v0.3.2 release.'
  usage:
    - >
      Users open a file in the GUI, adjust offset, stride, grid width, and colorization
      parameters, and visually inspect regions that would be tedious to interpret from a
      plain hex dump.
related-packages: []
category: developer-tools
package-manager:
  brew: binocle
  macports: binocle
  nix: binocle
  pacman: binocle
package-manager-url: https://formulae.brew.sh/formula/binocle
license: Apache-2.0 OR MIT
tags:
  - binary-data
  - cli
  - gui
  - reverse-engineering
  - visualization
description: Graphical tool to visualize binary data
executables:
  - binocle
provenance:
  formula: binocle
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
