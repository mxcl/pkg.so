id: brew:baguette
display-name: Baguette
homepage: https://tddworks.github.io/baguette/
repo: https://github.com/tddworks/baguette
docs:
  - https://github.com/tddworks/baguette#readme
  - https://tddworks.github.io/baguette
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Baguette is new but visible in the Homebrew ecosystem. The Homebrew formula API
      reported stable version 0.1.77 with 107 installs in the previous 30 days as of
      June 30, 2026, while GitHub reported 1,457 stars.
    - >
      Its adoption is likely concentrated among iOS automation, device-farm, QA, and
      simulator-infrastructure users who need headless control without opening Xcode or
      Simulator.app.
  package-nerd-significance:
    - >
      Baguette is interesting because it packages fragile simulator-control knowledge
      into a brew-installable CLI. Package nerds care less about its age and more about
      the packaging boundary: a single formula can expose private-framework simulator
      automation, HID-style gestures, streaming, and a web control plane.
  project-history:
    - >
      The public GitHub repository was created on May 1, 2026. The README describes a
      single Swift CLI named `baguette` plus a self-contained web UI for booting
      simulators, streaming screens, sending taps and gestures, inspecting accessibility
      trees, tailing logs, taking screenshots, recording, and exposing a multi-device
      farm view.
    - >
      The project is explicitly tied to Apple's simulator stack: the README says it
      links against private SimulatorKit/CoreSimulator frameworks and requires Xcode 26.
      That makes it closer to a power-user automation tool than a general mobile-testing
      framework.
  related-projects:
    - >
      Apple CoreSimulator and SimulatorKit are the underlying simulator technologies
      referenced by the README.
    - >
      The README mentions dependencies including Swift ArgumentParser, Hummingbird,
      HummingbirdWebSocket, Mockable, and DeviceKit-style chrome/bezel data.
  sources:
    - https://api.github.com/repos/tddworks/baguette
    - https://api.github.com/repos/tddworks/baguette/releases/latest
    - https://formulae.brew.sh/api/formula/baguette.json
    - https://raw.githubusercontent.com/tddworks/baguette/main/README.md
  summary:
    - >
      Baguette is a young Swift command-line tool for headless iOS Simulator control,
      screen streaming, host-side input injection, and a local web UI. It targets macOS,
      Apple Silicon, and Xcode/iOS 26-era simulator internals.
  timeline:
    - '2026-05-01: Public GitHub repository created.'
    - '2026-06-24: v0.1.77 released on GitHub.'
    - '2026-06-30: Homebrew formula reports stable baguette 0.1.77.'
  usage:
    - >
      Common workflows include `baguette serve` for the local browser UI, `baguette
      list`, `baguette boot --udid`, `baguette tap --udid`, `baguette screenshot`,
      `baguette logs`, and device-farm pages served from localhost. The README also
      documents build-from-source commands using `make` and `swift test`.
related-packages: []
