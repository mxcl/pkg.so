id: brew:castget
display-name: castget
homepage: https://castget.johndal.com/
repo: https://github.com/mlj/castget
docs:
  - https://castget.johndal.com/
  - https://castget.johndal.com/castget.1.html
  - https://castget.johndal.com/castgetrc.5.html
config-file-location:
  unix: ~/.castgetrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream site points users to pre-built packages and ports for several
      Unix-like systems. The supplied package facts list Homebrew, Fedora, Nix, and Arch
      packaging, which fits castget's role as a lightweight package-manager install
      rather than a large application platform.
  package-nerd-significance:
    - >
      castget matters as a classic single-purpose Unix tool: it delegates scheduling to
      cron or a shell, stores state around RSS channels, and uses a dotfile instead of a
      GUI account model. For package maintainers it is also pleasantly old-school, with
      a C/autotools source build and a tiny runtime concept.
  project-history:
    - >
      The manpage credits Marius L. Johndal from 2005 through 2019 and Jick Nan in 2007,
      placing castget in the older Unix podcast-downloader generation. The official news
      log records 1.2.x maintenance releases in 2017 and a 2.0.0/2.0.1 release sequence
      in October 2019.
  related-projects:
    - >
      castget sits alongside other command-line podcast and RSS enclosure tools, but its
      own docs emphasize RSS enclosures, podcasts, ID3v2 tagging, and M3U playlists
      rather than full podcast library management.
  sources:
    - https://api.github.com/repos/mlj/castget
    - https://github.com/mlj/castget
    - https://castget.johndal.com/
    - https://castget.johndal.com/castget.1.html
    - https://castget.johndal.com/castgetrc.5.html
    - https://formulae.brew.sh/api/formula/castget.json
  summary:
    - >
      castget is a small command-line RSS enclosure downloader aimed primarily at
      unattended podcast downloads. Its official site describes simple configuration,
      ID3v2 tagging, M3U playlist generation, and broad RSS/Media RSS handling.
  timeline:
    - '2005: castget copyright begins under Marius L. Johndal.'
    - '2007: Jick Nan is credited in the castget manpage.'
    - '2017: 1.2.3 and 1.2.4 bug-fix releases are announced.'
    - '2019: 2.0.0 and 2.0.1 are announced; 2.0.1 fixes missing man pages.'
  usage:
    - >
      Users define feeds as named channels in ~/.castgetrc, then run castget to download
      new enclosures, list pending items, catch up channels, filter URLs, or resume
      downloads. The rc file supports per-channel and global options for feed URL, spool
      directory, playlist path, filters, filenames, and ID3 metadata.
related-packages: []
category: media
package-manager:
  brew: castget
  dnf: castget
  nix: castget
  pacman: castget
package-manager-url: https://formulae.brew.sh/formula/castget
license: LGPL-2.1-only
tags:
  - cli
  - downloader
  - podcast
  - rss
description: Command-line podcast and RSS enclosure downloader
executables:
  - castget
provenance:
  formula: castget
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
