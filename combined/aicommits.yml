id: brew:aicommits
display-name: aicommits
homepage: https://github.com/Nutlope/aicommits
repo: https://github.com/Nutlope/aicommits
docs:
  - https://github.com/Nutlope/aicommits
config-file-location:
  unix: ~/.aicommits
credentials-file-location:
  unix: ~/.aicommits
history:
  adoption-history:
    - >
      The official README documents npm installation and a global CLI, while the
      Homebrew formula packages the same tool for brew users. The GitHub repository had
      over 9,000 stars when checked through the official repository API.
    - >
      The npm registry listed 98 published versions and latest version 3.4.0; Homebrew
      also listed 3.4.0 as the stable formula version.
  package-nerd-significance:
    - >
      aicommits became one of the recognizable package names in the AI commit-message
      subgenre: a tiny npm-installed executable, a memorable binary alias `aic`, a
      Homebrew formula, and a configuration dotfile. It is also directly named by
      aicommit2 as an architectural inspiration.
  project-history:
    - >
      The public npm package and GitHub repository both date to February 2023, placing
      aicommits among the early wave of ChatGPT-era developer CLIs. The project was
      initially centered on OpenAI-backed commit-message generation and later expanded
      provider support to TogetherAI, Groq, xAI, OpenRouter, Ollama, LM Studio, and
      custom OpenAI-compatible endpoints.
    - >
      The tool grew from a simple `git add` plus `aicommits` workflow into a small Git
      integration package: it supports selectable message formats, multiple generated
      recommendations, custom prompts, clipboard output, direct commit invocation, and a
      prepare-commit-msg hook.
  related-projects:
    - aicommit2, which cites aicommits as inspiration.
    - Git commit hooks, especially prepare-commit-msg.
    - OpenAI-compatible API providers and local model runners such as Ollama and LM Studio.
  sources:
    - https://formulae.brew.sh/api/formula/aicommits.json
    - https://github.com/Nutlope/aicommits
    - https://registry.npmjs.org/aicommits
  summary:
    - >
      aicommits is a JavaScript/Node command-line utility that writes Git commit
      messages from staged diffs using AI models. Its README presents it bluntly as a
      CLI that writes commit messages so users do not have to.
  timeline:
    - '2023: npm package record created and GitHub repository opened.'
    - '2023: Tool ships as a global npm CLI for AI-generated Git commit messages.'
    - '2026: npm and Homebrew list 3.4.0 as current/latest.'
  usage:
    - >
      The normal workflow is `git add <files...>` followed by `aicommits`; unknown flags
      are passed through to `git commit`. Users can also install a prepare-commit-msg
      hook so Git opens the generated message in the configured editor before
      committing.
    - >
      Configuration is created by `aicommits setup` in `~/.aicommits`, and the README
      also documents environment-variable configuration for API keys and provider
      settings.
related-packages:
  - id: brew:aicommit2
    reason: >
      Choose aicommit2 when you need Jujutsu or YADM support, simultaneous
      multi-provider generation, code review, or LazyGit integration; choose aicommits
      for a more focused Git workflow.
    rel: alternative
    sources:
      - https://github.com/Nutlope/aicommits
      - https://github.com/tak-bro/aicommit2
  - id: brew:aicommit
    reason: >
      Choose Coder's aicommit when generated messages should follow repository-history
      context and `COMMITS.md` rules; choose aicommits for multiple candidates,
      selectable formats, local providers, and its Git hook.
    rel: alternative
    sources:
      - https://github.com/Nutlope/aicommits
      - https://github.com/coder/aicommit
category: ai
