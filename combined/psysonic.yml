id: cask:psysonic
display-name: Psysonic
homepage: https://www.psysonic.de/
repo: https://github.com/Psysonic/psysonic
docs:
  - https://github.com/Psysonic/psysonic#readme
  - https://github.com/Psysonic/psysonic/blob/main/ORBIT.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through Homebrew, WinGet, Scoop, AUR
      and Nix, alongside native installation formats. This establishes packaging reach
      without establishing user counts.
  package-nerd-significance:
    - >
      Psysonic connects the self-hosted music ecosystem with desktop package managers
      and a Rust/Tauri application stack.
  project-history:
    - >
      Psysonic describes itself as inspired by Winamp and built with Rust, Tauri and
      React. Development focuses on Navidrome while retaining compatibility with other
      Subsonic servers where their APIs support the requested features.
  related-projects:
    - Navidrome, Subsonic, Gonic, Airsonic, Winamp and Tauri.
  sources:
    - https://github.com/Psysonic/psysonic
    - https://www.psysonic.de/
  summary:
    - Psysonic is an open-source desktop music client for self-hosted libraries.
  timeline:
    - 'Undated: Official README documents distribution for Linux, macOS and Windows.'
  usage:
    - >
      Connect a music server to browse and play its library, manage playlists and use
      optional scrobbling. Some advanced features require Navidrome-specific support.
category: media
package-manager:
  brew-cask: psysonic
package-manager-url: https://formulae.brew.sh/cask/psysonic
tags:
  - desktop-app
  - music-player
  - navidrome
  - self-hosted
  - subsonic
description: Desktop client for Navidrome and other Subsonic-compatible servers
applications:
  - Psysonic.app
provenance:
  cask: psysonic
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
