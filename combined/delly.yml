id: brew:delly
display-name: DELLY
homepage: https://github.com/dellytools/delly
repo: https://github.com/dellytools/delly
docs:
  - https://github.com/dellytools/delly/wiki
  - https://github.com/dellytools/delly#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DELLY is distributed through precompiled releases, containers, Bioconda, Homebrew,
      and source builds. Its official repository documents workflows for short-read,
      long-read, assembly-based, germline, somatic, and copy-number analysis.
  package-nerd-significance:
    - >
      DELLY exemplifies specialist scientific software reaching users through general
      and domain-specific package ecosystems. Its single executable participates in
      pipelines alongside BAM/CRAM tooling, reference genomes, bcftools, and R
      visualization scripts.
  project-history:
    - >
      DELLY originated as an integrated paired-end and split-read structural-variant
      discovery method. Its foundational paper was published in Bioinformatics in 2012;
      the modern DELLY2 implementation also uses read depth and supports long reads,
      assemblies, and copy-number analysis.
  related-projects:
    - >
      Related tools and ecosystems include HTSlib, bcftools, SAM/BAM/CRAM tooling,
      Bioconda, minimap2, minigraph, and wally.
  sources:
    - https://doi.org/10.1093/bioinformatics/bts378
    - https://github.com/dellytools/delly
  summary:
    - >
      DELLY is an open-source genomics command-line tool for discovering, genotyping,
      filtering, and visualizing structural variants and copy-number variants from
      sequencing data.
  timeline:
    - '2012: The foundational DELLY paper was published in Bioinformatics.'
    - 'Later DELLY2 releases: Added integrated CNV, long-read, and assembly-oriented workflows.'
  usage:
    - >
      Users provide an indexed reference genome and sorted, indexed, preferably
      duplicate-marked BAM or CRAM files. Common commands include delly sr, delly lr,
      delly asm, delly cnv, delly merge, and delly filter.
    - >
      DELLY accepts user-supplied tabular files for workflows such as sample
      classification and alternate alignments, but the official documentation does not
      define a fixed per-user configuration-file location.
related-packages:
  - id: brew:samtools
    reason: >
      Use SAMtools to sort, index, duplicate-mark, inspect, and otherwise prepare the
      BAM or CRAM inputs required by DELLY workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/dellytools/delly
      - https://www.htslib.org/doc/samtools.html
  - id: brew:bcftools
    reason: >
      Use bcftools after DELLY to view, convert, query, and filter its BCF or VCF
      structural-variant output.
    rel: adjacent_workflow
    sources:
      - https://github.com/dellytools/delly
      - https://samtools.github.io/bcftools/bcftools.html
  - id: brew:minimap2
    reason: >
      Use minimap2 to create long-read alternate alignments that DELLY can consult when
      filtering structural variants against another linear reference.
    rel: adjacent_workflow
    sources:
      - https://github.com/dellytools/delly
      - https://lh3.github.io/minimap2/minimap2.html
  - id: brew:minigraph
    reason: >
      Use minigraph to align reads against a pangenome graph and supply the resulting
      GAF alignment to DELLY's alternate-alignment workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/dellytools/delly
      - https://github.com/lh3/minigraph#readme
category: science
package-manager:
  brew: delly
  debian: delly
  nix: delly
  ubuntu: delly
package-manager-url: https://formulae.brew.sh/formula/delly
license: BSD-3-Clause
tags:
  - bam
  - bioinformatics
  - cli
  - copy-number-variants
  - cram
  - genomics
  - structural-variants
  - variant-calling
description: Structural variant discovery by paired-end and split-read analysis
executables:
  - delly
provenance:
  formula: delly
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
