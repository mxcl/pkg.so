id: cask:kiro
display-name: Kiro
homepage: https://kiro.dev/
repo: https://github.com/kirodotdev/Kiro
docs:
  - https://kiro.dev/docs
  - https://kiro.dev/docs/cli/reference/settings
  - https://kiro.dev/docs/getting-started/installation
config-file-location:
  unix:
    - ~/.kiro/settings/cli.json
    - <project-directory>/.kiro/settings/cli.json
  windows:
    - '%USERPROFILE%\.kiro\settings\cli.json'
    - <project-directory>\.kiro\settings\cli.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Kiro attracted more than 100,000 users during its first five days of preview,
      according to the project's first-anniversary retrospective, and the total more
      than doubled by October 2025.
    - >
      The waitlist was removed in October 2025. General availability followed in
      November with team plans, property-based testing, checkpointing, and the Kiro CLI.
      The product later expanded into web and mobile experiences.
  package-nerd-significance:
    - >
      Kiro is part of the wave of Code OSS-derived AI development environments, but
      distinguishes itself through structured specifications, steering files, agent
      hooks, and task-oriented workflows.
    - >
      For package enthusiasts it is notable as an AWS-operated, cross-platform IDE
      distributed independently of traditional language package ecosystems while
      retaining compatibility with VS Code settings and Open VSX extensions.
  project-history:
    - >
      AWS introduced Kiro in preview on July 14, 2025 as an agentic IDE centered on
      spec-driven development. The original release combined structured requirements,
      designs, and task lists with chat, steering rules, hooks, MCP support, and a Code
      OSS foundation.
    - >
      Kiro reached general availability on November 17, 2025 and added a terminal CLI.
      During 2026 the product family expanded with autonomous web workflows, mobile
      access, parallel agents, and additional extension mechanisms.
  related-projects:
    - Code OSS
    - Visual Studio Code
    - Open VSX
    - Model Context Protocol
    - AWS Builder ID
  sources:
    - 'Official about page: https://kiro.dev/about/'
    - 'Official first-anniversary retrospective: https://kiro.dev/blog/one-year/'
    - 'Official general-availability announcement: https://kiro.dev/blog/general-availability/'
    - 'Official introduction: https://kiro.dev/blog/introducing-kiro/'
  summary:
    - >
      Kiro is an AWS-built agentic development environment combining an IDE, terminal
      CLI, and agent workflows around specifications, steering, hooks, and
      software-engineering tasks.
  timeline:
    - '2025-07-14: Kiro launched in preview.'
    - '2025-10-16: Kiro removed its access waitlist.'
    - '2025-11-17: Kiro became generally available and introduced Kiro CLI.'
    - '2026-05-18: Kiro Web launched in preview for paid subscribers.'
    - >
      2026-07-14: Kiro reported that more than 100,000 developers had tried the IDE
      within its first five days.
  usage:
    - >
      Developers open a repository, collaborate with the coding agent through chat, or
      create a specification that turns a prompt into requirements, design, and
      implementation tasks. Hooks, steering rules, MCP servers, and extensions customize
      the workflow.
    - >
      Kiro CLI settings are stored globally in `~/.kiro/settings/cli.json`; workspace
      overrides can be stored in `.kiro/settings/cli.json`. Browser login or the
      `KIRO_API_KEY` environment variable supplies CLI authentication, but official
      documentation does not identify a credentials file.
category: developer-tools
package-manager:
  brew-cask: kiro
package-manager-url: https://formulae.brew.sh/cask/kiro
tags:
  - ai-ide
  - aws
  - code-editor
  - code-oss
  - coding-agent
  - cross-platform
  - developer-tools
  - mcp
  - spec-driven-development
description: Agent-centric IDE with spec-driven development
applications:
  - Kiro.app
provenance:
  cask: kiro
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
