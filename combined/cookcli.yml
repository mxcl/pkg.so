id: brew:cookcli
display-name: CookCLI
homepage: https://cooklang.org
repo: https://github.com/cooklang/cookcli
docs:
  - https://cooklang.org/docs/getting-started-commands
config-file-location:
  unix:
    - ./config/aisle.conf
    - ~/.config/cooklang/aisle.conf
    - /etc/cooklang/aisle.conf
    - ./config/pantry.conf
    - ~/.config/cooklang/pantry.conf
    - /etc/cooklang/pantry.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      CookCLI's package-manager footprint is modest but useful for Unix-style users: the
      Homebrew formula installs `cookcli`, while the input package facts also record a
      MacPorts package named `cook`. Official documentation presents Homebrew and GitHub
      Releases as installation paths.
  package-nerd-significance:
    - >
      The package is notable as a small domain-specific CLI for people who treat recipes
      as versionable data. Its appeal is less about scale and more about fitting cooking
      workflows into the familiar Unix pattern of plain files, composable commands,
      offline use, and package-manager installation.
  project-history:
    - >
      The official repository was created in January 2021, and the first GitHub release,
      a demo release tagged 0.0.1, was published in July 2021. The project remained
      aligned with Cooklang's plain-text recipe model rather than becoming a hosted
      recipe service.
  related-projects:
    - >
      CookCLI is part of the Cooklang ecosystem, alongside the Cooklang specification,
      recipe examples, editors, mobile apps, and the broader `cooklang` GitHub
      organization.
  sources:
    - https://cooklang.org/docs/getting-started-commands
    - https://github.com/cooklang/cookcli
    - https://github.com/cooklang/cookcli/releases
    - https://api.github.com/repos/cooklang/cookcli
  summary:
    - >
      CookCLI is the command-line companion to Cooklang, a plain-text recipe markup
      ecosystem. It packages recipe rendering, shopping-list generation, search, import,
      validation, reporting, pantry features, and a local web server behind the `cook`
      executable.
  timeline:
    - '2021: Official GitHub repository created.'
    - '2021: First public GitHub release, 0.0.1, published as a demo release.'
    - >
      2026: Official docs describe CookCLI as a tool for recipe management, shopping
      lists, automation, and a local web UI.
  usage:
    - >
      Typical usage is local and file-oriented: users seed example recipes, render
      `.cook` files, combine recipes into shopping lists, run `cook server` for a local
      browser UI, and point commands at a recipe directory with `--base-path`.
related-packages:
  - id: brew:git
    reason: >
      Git complements CookCLI because Cooklang officially recommends version-controlling
      its plain-text recipes, menus, and configuration files for tracking and sharing a
      collection.
    rel: adjacent_workflow
    sources:
      - https://cooklang.org/docs/getting-started/
      - https://git-scm.com/docs
category: productivity
package-manager:
  brew: cookcli
  macports: cook
package-manager-url: https://formulae.brew.sh/formula/cookcli
license: MIT
tags:
  - cli
  - cooklang
  - recipes
  - shopping-list
  - web-server
description: CLI-tool for cooking recipes formated using Cooklang
executables:
  - cook
provenance:
  formula: cookcli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
