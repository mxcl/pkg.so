id: brew:aider
display-name: Aider
homepage: https://aider.chat/
repo: https://github.com/Aider-AI/aider
docs:
  - https://aider.chat/docs
  - https://aider.chat/docs/config.html
  - https://aider.chat/docs/config/aider_conf.html
  - https://aider.chat/docs/config/api-keys.html
  - https://aider.chat/docs/config/dotenv.html
config-file-location:
  unix:
    - ~/.aider.conf.yml
    - .aider.conf.yml in git repository root
    - .aider.conf.yml in current directory
credentials-file-location:
  unix:
    - ~/.env
    - .env in git repository root
    - .env in current directory
history:
  adoption-history:
    - >
      Aider is distributed primarily as the Python package `aider-chat`, with official
      installation docs, PyPI metadata, and a Homebrew formula. The README also shows
      upstream-maintained usage badges, including 6.8M PyPI installs, 15B tokens per
      week processed by Aider users, and a Top 20 OpenRouter ranking at the time
      checked.
    - >
      Homebrew listed version 0.86.2 as stable and reported 13,890 installs over 365
      days when checked. The official GitHub repository API reported more than 46,000
      stars, making Aider one of the larger open-source terminal AI coding assistants.
  package-nerd-significance:
    - >
      Aider is a package-nerd landmark because it made a Python CLI, a Git workflow, and
      fast-moving LLM integrations feel like a package-manager-native developer tool. It
      sits at the intersection of PyPI, Homebrew, model-provider APIs, local model
      runners, Git repositories, and editor integration without being owned by a single
      IDE.
    - >
      Its release cadence and self-hosted coding statistics also make it useful evidence
      for how AI coding tools package themselves: not as one-off demos, but as
      continuously shipped CLIs with docs, config conventions, and measurable usage.
  project-history:
    - >
      The Aider GitHub repository was created in May 2023, during the first broad wave
      of LLM coding tools. The project chose a terminal and Git-centered workflow rather
      than an IDE extension-first approach: users run `aider` inside a repository, add
      files to the chat, request changes, and review commits or diffs with normal Git
      tools.
    - >
      Aider's official docs and README show rapid expansion beyond basic chat-to-code.
      Major surfaces include repo maps for larger codebases, automatic commits, linting
      and testing, watch mode for editor integration, browser and image inputs, voice
      input, copy/paste workflows for web chat, and many model backends.
    - >
      The project also publishes a release history page with stats on Aider writing its
      own code, making it part tool and part public experiment in AI-assisted software
      maintenance.
  related-projects:
    - Git, which Aider uses for repository state, diffs, and commits.
    - >
      LLM provider APIs including Anthropic, OpenAI, DeepSeek, OpenRouter, and local
      model backends.
    - Other AI coding assistants and terminal-first coding agents.
  sources:
    - https://aider.chat/HISTORY.html
    - https://aider.chat/docs
    - https://formulae.brew.sh/api/formula/aider.json
    - https://github.com/Aider-AI/aider
    - https://pypi.org/pypi/aider-chat/json
  summary:
    - >
      Aider is an open-source AI pair-programming tool that runs in the terminal, edits
      files in an existing Git repository, and uses LLMs to make code changes. Its
      README describes it as AI pair programming in your terminal, with Git integration,
      repo maps, model support, lint/test loops, image and web context, and IDE/editor
      workflows.
  timeline:
    - >
      2023: GitHub repository created and PyPI package appears for terminal AI pair
      programming.
    - '2024: Aider grows around repo maps, model support, Git commits, and terminal workflows.'
    - >
      2025: README badges report millions of installs, weekly token usage, and
      OpenRouter ranking.
    - '2026: Homebrew and PyPI list 0.86.2 as current/stable in checked metadata.'
  usage:
    - >
      The common workflow is to install Aider, enter a Git repository, choose a model or
      API key, and ask for code changes from the terminal. Aider can edit files, create
      commits, run tests and linters, and use repository maps to reason over code beyond
      the immediate chat context.
    - >
      Configuration is split between YAML settings and environment/API-key storage. The
      docs say Aider looks for `.aider.conf.yml` in the home directory, Git root, and
      current directory, while `.env` files store API keys and other model settings.
related-packages:
  - id: brew:opencode
    reason: >
      Choose OpenCode when you want a terminal coding agent with configurable build/plan
      agents and broad provider selection; choose Aider when its Git-centered
      pair-programming and automatic-commit workflow is the better fit.
    rel: alternative
    sources:
      - https://aider.chat/docs/
      - https://opencode.ai/docs
      - https://opencode.ai/docs/agents/
      - https://opencode.ai/docs/providers/
  - id: cask:codex
    reason: >
      Choose Codex when you want OpenAI's coding-agent experience across terminal and
      related Codex surfaces; choose Aider for a provider-agnostic terminal workflow
      built explicitly around existing Git repositories.
    rel: alternative
    sources:
      - https://aider.chat/docs/
      - https://developers.openai.com/learn/codex
      - https://github.com/openai/codex
category: ai
package-manager:
  brew: aider
package-manager-url: https://formulae.brew.sh/formula/aider
license: Apache-2.0
