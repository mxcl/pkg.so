config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GridCraft entered public distribution through cross-platform GitHub release
      artifacts and a Homebrew Cask. Its early release series provides native builds for
      macOS, Windows, Linux, and FreeBSD alongside a WebAssembly version.
    - >
      The project is very new, so reliable evidence of long-term or institutional
      adoption is not yet available.
  package-nerd-significance:
    - >
      GridCraft is notable to package enthusiasts as a Rust-native, open-source
      spreadsheet application that treats XLSX as its native format while shipping
      across several desktop package formats and the web.
    - >
      Its command-oriented engine, CLI, JSON control channel, and MCP server expose
      spreadsheet operations to automation and agents rather than limiting them to the
      graphical interface.
  project-history:
    - >
      GridCraft was developed by the ArtCraft team as an open-source, clean-room
      spreadsheet intended to reproduce familiar Excel-style workflows without using
      Microsoft code or assets. It is implemented in Rust and licensed under MIT or
      Apache-2.0.
    - >
      The first tagged public release, version 0.1.0, appeared on October 8, 2026.
      Versions 0.3.0 and 0.4.0 followed within days, adding expanded release packaging
      and distribution polish.
  related-projects:
    - >
      Microsoft Excel: the proprietary spreadsheet whose workflows and XLSX format
      GridCraft seeks to support through clean-room development.
    - >
      PdfCraft and other ArtCraft applications: sibling Rust-native creative and
      productivity tools that share project conventions but not application code.
    - 'MCP: an automation interface through which agents can invoke GridCraft commands.'
  sources:
    - https://getartcraft.com/apps/gridcraft
    - https://github.com/storytold/gridcraft#readme
    - https://github.com/storytold/gridcraft/releases
    - source_facts.description
  summary:
    - >
      GridCraft is an open-source, Rust-native spreadsheet editor with an Excel-style
      interface, XLSX compatibility, desktop and web builds, and automation interfaces
      for command-line tools and agents.
  timeline:
    - '2026-10-08: GridCraft 0.1.0 becomes the first tagged public release.'
    - '2026-10-08: Version 0.3.0 expands packaged releases and download documentation.'
    - '2026-10-10: Version 0.4.0 publishes refreshed cross-platform artifacts.'
  usage:
    - >
      Users can create and edit spreadsheets through the native desktop interface or web
      build, with XLSX as the primary format and CSV and TSV also supported.
    - >
      Automation users can evaluate formulas, modify workbooks through the CLI, drive
      the interface over a JSON control channel, or connect agents through the MCP
      server. The official project description states that GridCraft has no
      subscription, licence server, or telemetry.
