id: brew:gitg
display-name: gitg
homepage: https://wiki.gnome.org/Apps/Gitg
repo: https://gitlab.gnome.org/GNOME/gitg
docs:
  - https://wiki.gnome.org/Apps/Gitg
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gitg's adoption is tied less to a broad plugin ecosystem and more to the GNOME
      desktop. It appears in Linux and Unix package collections as the GNOME-native
      answer for users who want visual commit history, branch inspection, and simple
      repository operations without leaving the desktop environment.
  package-nerd-significance:
    - >
      For package nerds, gitg is a classic desktop adjunct to Git: a small GUI that
      distribution maintainers can package alongside the command-line tool, useful for
      users who prefer visual history browsing but still work in ordinary Git
      repositories.
  project-history:
    - >
      The official GNOME repository history begins with an initial import in June 2008,
      placing gitg among the long-running desktop Git clients that emerged as
      distributed version control became common on Linux desktops. It remained within
      GNOME infrastructure, using GNOME distribution channels, translation systems, and
      application packaging practices.
    - >
      The release stream shows early 0.x releases from 2009 onward, later 3.x releases
      aligned with GNOME-era versioning, and the v44 release in 2023. The project uses
      modern GNOME build tooling and advertises source downloads, Flatpak installation,
      and development builds from its GitLab repository.
  related-projects:
    - >
      gitg is part of the GNOME application ecosystem and relates to Git itself, GNOME
      GitLab, Flathub distribution, and other graphical Git clients such as gitk and Git
      GUI.
  sources:
    - https://download.gnome.org/sources/gitg/
    - https://gitlab.gnome.org/GNOME/gitg
    - https://wiki.gnome.org/Apps/Gitg
  summary:
    - >
      gitg is a GNOME graphical interface for Git repositories. Its README describes it
      as a small, fast, convenient tool for visualizing repository history, with
      additional utilities for repository management and committing work.
  timeline:
    - '2008: Initial import appears in the official repository.'
    - '2009: v0.0.1 begins the tagged release stream.'
    - '2019: v3.32.1 marks the later 3.x release line.'
    - '2023: v44 is tagged in the GNOME-style release series.'
  usage:
    - >
      Practitioners launch gitg from the GNOME menu or from a terminal, often inside a
      repository, to browse commit history, inspect branches, and perform lightweight
      repository management tasks. It complements command-line Git rather than replacing
      it.
related-packages:
  - id: brew:git-gui
    reason: >
      Choose git gui for Git's Tcl/Tk staging-and-commit interface distributed with the
      Git suite; choose gitg for a GNOME-native client with a stronger visual
      repository-history experience.
    rel: alternative
    sources:
      - https://wiki.gnome.org/Apps/Gitg
      - https://git-scm.com/docs/git-gui
  - id: brew:tig
    reason: >
      Choose Tig when repository history, diffs, blame, staging, and status must remain
      usable in a terminal or remote shell; choose gitg for a GNOME desktop GUI.
    rel: alternative
    sources:
      - https://wiki.gnome.org/Apps/Gitg
      - https://jonas.github.io/tig/doc/manual.html
category: developer-tools
package-manager:
  apk: gitg
  brew: gitg
  debian: gitg
  dnf: gitg
  macports: gitg
  nix: gitg
  pacman: gitg
  ubuntu: gitg
  winget: gnome.gitg
  zypper: gitg
package-manager-url: https://formulae.brew.sh/formula/gitg
license: GPL-2.0-or-later
tags:
  - cli
  - desktop-app
  - git
  - gnome
  - gui
  - repository-viewer
description: GNOME GUI client to view git repositories
executables:
  - gitg
provenance:
  formula: gitg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
