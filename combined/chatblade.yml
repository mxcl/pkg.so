id: brew:chatblade
display-name: Chatblade
homepage: https://github.com/npiv/chatblade
repo: https://github.com/npiv/chatblade
docs:
  - https://github.com/npiv/chatblade#readme
config-file-location:
  unix:
    - ~/.config/chatblade/{prompt_name}
    - ~/.config/chatblade/{prompt_name}.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Chatblade was distributed through pip, Homebrew, and source installs from GitHub;
      the input facts also list Nix and pacman packaging. Its README examples target
      shell users who want to pipe content into ChatGPT, keep named sessions, and reuse
      prompt preambles from a config directory.
  package-nerd-significance:
    - >
      Chatblade is notable as an early packaged LLM command-line client that made
      ChatGPT feel like a Unix filter. Its package significance is less about long-term
      infrastructure and more about the 2023 moment when package managers filled quickly
      with small CLIs wrapping hosted LLM APIs for pipes, prompts, and shell automation.
  project-history:
    - >
      The GitHub repository was created in March 2023, a few months after ChatGPT
      popularized conversational LLM workflows. Release metadata shows a first public
      release on March 20, 2023, rapid 0.2.x releases in April 2023, and a latest v0.7.0
      release in October 2024. The README now states that the project is archived and no
      longer under active development.
  related-projects:
    - The README recommends `llm` and Fabric as modern CLI tools in the same spirit.
    - >
      OpenAI ChatGPT and OpenAI/Azure OpenAI APIs are the model services documented by
      the README.
    - >
      Codex and Claude Code are mentioned by the README as newer direct coding-assistant
      options.
  sources:
    - https://github.com/npiv/chatblade
    - https://api.github.com/repos/npiv/chatblade
    - https://api.github.com/repos/npiv/chatblade/releases
  summary:
    - >
      Chatblade is a command-line ChatGPT client built for the early wave of LLM CLI
      tooling: it accepts arguments or piped input, stores sessions, loads reusable
      prompt files, streams responses, and can extract Markdown or JSON from model
      output.
  timeline:
    - '2023-03: GitHub repository created and first public release v0.0.1 published.'
    - '2023-04: Rapid 0.2.x releases added early functionality.'
    - '2024-10: Latest upstream GitHub release metadata lists v0.7.0.'
    - '2026: README states the project is archived and recommends newer CLI tools.'
  usage:
    - >
      Common uses include `chatblade question`, piping files or RSS feeds into a prompt,
      continuing the last conversation with `-l`, creating named sessions with `-S`,
      loading prompt files with `-p`, selecting models with `-c`, and extracting
      structured output with `-e`. Authentication is by `OPENAI_API_KEY` or an explicit
      `--openai-api-key` option.
related-packages:
  - id: brew:llm
    reason: >
      Choose LLM for a maintained, plugin-based CLI supporting many hosted and local
      model providers; Chatblade's archived README explicitly recommends it as a
      successor.
    rel: alternative
    sources:
      - https://github.com/npiv/chatblade#readme
      - https://llm.datasette.io/en/stable/
  - id: brew:fabric-ai
    reason: >
      Choose Fabric when reusable, named prompt patterns and repeatable AI workflows
      matter more than Chatblade's ChatGPT-centered session interface; Chatblade's
      maintainer explicitly recommends it.
    rel: alternative
    sources:
      - https://github.com/npiv/chatblade#readme
      - https://github.com/danielmiessler/Fabric#readme
category: ai
package-manager:
  brew: chatblade
  nix: chatblade
  pacman: chatblade
package-manager-url: https://formulae.brew.sh/formula/chatblade
license: GPL-3.0-only
tags:
  - ai
  - chatgpt
  - cli
  - openai
  - terminal
description: CLI Swiss Army Knife for ChatGPT
executables:
  - chatblade
provenance:
  formula: chatblade
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
