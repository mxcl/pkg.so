id: brew:evernote2md
display-name: evernote2md
homepage: https://github.com/wormi4ok/evernote2md
repo: https://github.com/wormi4ok/evernote2md
docs:
  - https://github.com/wormi4ok/evernote2md#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew installation, manual binaries from GitHub Releases,
      a Docker image, and wiki pages for macOS and custom tag formatting, reflecting use
      by people migrating note archives across platforms.
  package-nerd-significance:
    - >
      The package fills a classic packaging niche: a zero-dependency command-line bridge
      from a proprietary export format to plain-text Markdown archives.
  project-history:
    - >
      The project focuses on the file-conversion side of leaving or archiving Evernote:
      it accepts ENEX files, directories, or glob patterns and writes Markdown notes
      plus attachment directories.
  related-projects:
    - >
      The README points users who want to reorganize converted notes toward mdmv,
      another Markdown-file tool by the same author.
  sources:
    - https://github.com/wormi4ok/evernote2md#readme
    - https://github.com/wormi4ok/evernote2md/wiki
    - https://github.com/wormi4ok/evernote2md/releases/latest
  summary:
    - >
      evernote2md is a small CLI converter that turns Evernote ENEX exports into a
      directory of Markdown files and extracted attachments.
  timeline:
    - README documents Homebrew, GitHub Releases, Docker usage, and wiki-based usage notes.
    - >
      README notes newer Evernote app export limits and points users toward notebook
      export workflows.
  usage:
    - >
      Users export notes from Evernote, run `evernote2md` with an input path and
      optional output directory, and receive one Markdown file per note. The converter
      preserves attachments, links to attachments, tags, highlighted text, and
      created/modified times.
related-packages:
  - id: brew:evernote-backup
    reason: >
      Use evernote-backup first when you need to synchronize an entire Evernote account
      and create ENEX files that evernote2md can convert into Markdown.
    rel: adjacent_workflow
    sources:
      - https://github.com/vzhd1701/evernote-backup#readme
      - https://github.com/wormi4ok/evernote2md#readme
category: productivity
package-manager:
  brew: evernote2md
  macports: evernote2md
package-manager-url: https://formulae.brew.sh/formula/evernote2md
license: MIT
tags:
  - cli
  - conversion
  - enex
  - evernote
  - markdown
description: Convert Evernote .enex file to Markdown
executables:
  - evernote2md
provenance:
  formula: evernote2md
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
