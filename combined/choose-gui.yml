id: brew:choose-gui
display-name: choose
homepage: https://github.com/chipsenkbeil/choose
repo: https://github.com/chipsenkbeil/choose
docs:
  - https://github.com/chipsenkbeil/choose#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages it as choose-gui and the upstream README documents `brew install
      choose-gui`, while warning that the formula is not maintained in the upstream
      repository. The supplied package-manager facts also list MacPorts, Nix, apk,
      pacman, and zypper names.
  package-nerd-significance:
    - >
      It is a representative tiny Homebrew utility for bridging terminal pipelines with
      a native macOS selection UI: not a broad platform, but useful to package
      collectors because it overlaps shell composition, launchers, and fuzzy-finder
      workflows.
  project-history:
    - >
      The upstream GitHub repository was created in 2015. Its README describes the
      project as a fuzzy matcher for OS X/macOS using standard input and output plus a
      native GUI, with example integrations for Vim, Emacs, application launchers,
      password-store, and snippets.
    - >
      The project reached a 1.0 GitHub release in March 2015 and continued with later
      releases through 1.5.0 in February 2025.
  related-projects:
    - >
      Related tools include other fuzzy selectors such as fzf and skim, plus macOS
      launcher workflows; upstream also ships example Vim and Emacs integrations.
  sources:
    - https://github.com/chipsenkbeil/choose#readme
    - https://github.com/chipsenkbeil/choose/releases
    - https://formulae.brew.sh/api/formula/choose-gui.json
  summary:
    - >
      choose is a small macOS-oriented fuzzy chooser that takes candidate lines on
      stdin, lets the user pick through a native GUI, and writes the selected result to
      stdout.
  timeline:
    - '2015: GitHub repository created and 1.0 release published.'
    - '2020: 1.1 and 1.2 releases published.'
    - '2023: 1.3.x releases published.'
    - '2025: 1.5.0 release published and Homebrew stable version reports 1.5.0.'
  usage:
    - >
      Typical use is Unix-pipeline shaped: feed choices from `ls`, `find`, or another
      command into `choose`, then pass the selected output to tools such as `open`,
      `pass`, `pbcopy`, editors, or shell scripts.
related-packages:
  - id: brew:fzf
    reason: >
      Choose fzf when you want a cross-platform terminal interface, shell completion,
      previews, and richer programmable workflows instead of choose's native macOS
      window.
    rel: alternative
    sources:
      - https://github.com/chipsenkbeil/choose#readme
      - https://github.com/junegunn/fzf#readme
category: productivity
package-manager:
  apk: choose
  brew: choose-gui
  macports: choose-gui
  nix: choose-gui
  pacman: choose
  scoop: main/choose
  zypper: choose
package-manager-url: https://formulae.brew.sh/formula/choose-gui
license: MIT
tags:
  - cli
  - fuzzy-finder
  - gui
  - launcher
  - macos
  - stdin
  - stdout
description: Fuzzy matcher that uses std{in,out} and a native GUI
executables:
  - choose
provenance:
  formula: choose-gui
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
