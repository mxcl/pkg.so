id: brew:displayplacer
display-name: displayplacer
homepage: https://github.com/jakehilborn/displayplacer
repo: https://github.com/jakehilborn/displayplacer
docs:
  - https://github.com/jakehilborn/displayplacer#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README leads with Homebrew installation and release downloads, while the input
      package metadata also records MacPorts. Its adoption is tightly tied to macOS
      automation culture: shell scripts, hotkeys, Automator, BetterTouchTool, and
      repeatable monitor profiles.
  package-nerd-significance:
    - >
      displayplacer is a package-nerd favorite because it fills a native-platform gap
      with a single CLI. It turns GUI display state into reproducible command arguments,
      making macOS monitor layouts manageable by dotfiles, launchers, and
      package-installed tooling.
  project-history:
    - >
      The GitHub repository was created in June 2015, with the first GitHub release
      listed as v1.0.0 in November 2018. Later releases include v1.4.0 in June 2023,
      when the README notes a backward-compatibility concern around changed
      `displayplacer list` output.
  related-projects:
    - >
      Related tools and workflows include XRandR on Linux, macOS Displays settings,
      Automator, BetterTouchTool, and user scripts that compensate for changing monitor
      identifiers.
  sources:
    - https://github.com/jakehilborn/displayplacer
    - https://api.github.com/repos/jakehilborn/displayplacer
    - https://github.com/jakehilborn/displayplacer/releases/tag/v1.0.0
    - https://github.com/jakehilborn/displayplacer/releases/tag/v1.4.0
    - https://formulae.brew.sh/formula/displayplacer
  summary:
    - >
      displayplacer is a macOS command-line utility for configuring multi-display
      resolutions, arrangements, mirroring, rotation, refresh rate, color depth, and
      enabled state. Upstream describes it as essentially an XRandR-like tool for macOS,
      which explains its strong appeal to users who script workstation layouts.
  timeline:
    - '2015-06: GitHub repository created'
    - '2018-11: v1.0.0 release published'
    - '2023-06: v1.4.0 release published'
  usage:
    - >
      Users commonly run `displayplacer list` to print the current layout and supported
      modes, then reuse generated arguments in scripts to restore a known display
      arrangement. The README spends unusual space on screen ID stability because macOS
      can expose changing identifiers when external displays wake or reconnect.
related-packages:
  - id: cask:bettertouchtool
    reason: >
      displayplacer's README recommends BetterTouchTool for hotkey-driven display
      profiles, and BetterTouchTool can execute the saved displayplacer command as a
      shell-script action.
    rel: adjacent_workflow
    sources:
      - https://github.com/jakehilborn/displayplacer#readme
      - https://docs.folivora.ai/docs/actions/action-definitions/
category: system
package-manager:
  brew: displayplacer
  macports: displayplacer
package-manager-url: https://formulae.brew.sh/formula/displayplacer
license: MIT
tags:
  - cli
  - configuration
  - display
  - macos
  - monitor
description: Utility to configure multi-display resolutions and arrangements
executables:
  - displayplacer
provenance:
  formula: displayplacer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
