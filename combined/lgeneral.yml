history:
  adoption-history:
    - >
      LGeneral has survived as a small open-source game package through SourceForge,
      Linux distributions, MacPorts, Homebrew, Debian/Ubuntu packages named around
      `lgc-pg`, and a Flathub package. That cross-packaging pattern is typical for older
      SDL games kept alive by maintainers and distro archivists.
  package-nerd-significance:
    - >
      LGeneral is significant as a preservation package: it keeps a Panzer General-like
      engine available on Unix-like systems while separating executable code, converted
      legacy data, free scenario data, and distro packaging. It is the kind of game
      formula that exists because packaging culture values keeping old engines
      buildable.
  project-history:
    - >
      The official LGames page describes LGeneral as a turn-based strategy engine
      heavily inspired by Panzer General, with single scenarios, campaigns, human or AI
      opponents, entrenchment, defensive fire, supply, weather, reinforcements, and
      related tactical mechanics.
    - >
      Its distribution history is unusually tied to data conversion. The official
      downloads note that the engine requires `pg-data.tar.gz` or the original DOS
      version of Panzer General, and the formula exposes helper tools such as `lgc-pg`,
      `lged`, `ltrextract`, and `shptool` alongside the game binary.
  related-projects:
    - >
      LGeneral is related to Panzer General, LGames projects such as LBreakout and
      LTris, SDL, SDL_mixer, K.u.k General data, Flathub packaging, and old-game data
      conversion tools.
  sources:
    - https://formulae.brew.sh/formula/lgeneral
    - https://lgames.sourceforge.io/LGeneral
    - https://sourceforge.net/projects/lgeneral/rss?path=/lgeneral
  summary:
    - >
      LGeneral is an open-source turn-based strategy engine inspired by Panzer General.
      It packages a retro tactical wargame engine, conversion tools, editor-related
      utilities, and data workflows around Panzer General-style scenarios and campaigns.
  timeline:
    - '2002: The LGames website footer marks the start of the hosted project era.'
    - '2007-09-27: SourceForge lists the `lgeneral-1.2beta-13` source archive.'
    - '2010-09-29: SourceForge lists `lgeneral-1.2.tar.gz`.'
    - '2017-08-27: SourceForge lists `lgeneral-1.4.0.tar.gz`.'
    - '2021-01-08: SourceForge lists `lgeneral-1.4.4.tar.gz` and a Windows zip.'
  usage:
    - >
      Players run `lgeneral` for campaigns or scenarios, while package maintainers and
      users may use the converter tooling to prepare Panzer General-derived data. The
      official page also points to K.u.k General data as a free stand-alone WWI scenario
      package.
