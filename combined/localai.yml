id: brew:localai
display-name: LocalAI
homepage: https://localai.io
repo: https://github.com/mudler/LocalAI
docs:
  - https://localai.io
  - https://localai.io/basics/getting_started
config-file-location:
  unix:
    - models/*.yaml
    - BASEPATH/configuration/runtime_settings.json
    - BASEPATH/configuration/external_backends.json
credentials-file-location:
  unix: BASEPATH/configuration/api_keys.json
history:
  adoption-history:
    - >
      LocalAI rode the demand for self-hosted, OpenAI-compatible inference after local
      LLM tooling became mainstream in 2023. Its adoption signals are unusually strong
      for a CLI/server package: the official repository shows tens of thousands of
      stars, thousands of forks, and thousands of commits, while Homebrew and Nix
      packaging make the binary accessible outside container workflows.
    - >
      The project broadened adoption by supporting multiple install styles: container
      images for CPU and GPU targets, binaries for Linux and macOS, model-gallery
      installs, and a local-ai CLI that can run models and open chat sessions. Its
      compatibility story also widened from OpenAI-style APIs to Anthropic Messages,
      Open Responses, Ollama-related workflows, and MCP-enabled agents.
  package-nerd-significance:
    - >
      LocalAI is package-nerd significant because it turns a fast-moving stack of model
      runtimes, backends, APIs, and hardware-specific acceleration into one installable
      command. It is the sort of package where the formula is only the visible tip; the
      real work is coordinating llama.cpp, vLLM, whisper.cpp, stable-diffusion, MLX, OCI
      backends, GPU variants, and API compatibility.
    - >
      It also captures a packaging shift in AI tooling: instead of a single static CLI,
      LocalAI became a launcher and orchestrator that downloads or connects model and
      backend artifacts at runtime. That makes it attractive to self-hosters and
      developers, but also means package metadata must clearly distinguish the
      CLI/server from the larger optional backend ecosystem.
  project-history:
    - >
      The mudler/LocalAI repository was created in March 2023. The README describes
      LocalAI as an open-source AI engine for LLMs, vision, voice, image, and video on
      local hardware, with no GPU required and privacy-first operation because data
      stays on the user's infrastructure.
    - >
      In 2023, LocalAI focused on making local models usable behind OpenAI-compatible
      endpoints. Official news from mid-2023 records rapid support for model galleries,
      GPU offload, Apple Metal, Falcon-family models, Hugging Face backends,
      stable-diffusion, text-to-audio, and static Linux binaries. A late-2023 maintainer
      update described a move toward a gRPC backend structure and a C++ llama.cpp
      backend to track upstream more closely.
    - >
      By 2025 and 2026, LocalAI had expanded into a modular backend architecture. The
      v3.0.0 announcement introduced a backend gallery based on OCI images, realtime
      WebSocket APIs, dynamic VRAM handling, multimodal upgrades, and deprecation of
      older extras images. The v4.0.0 announcement framed the project as a complete AI
      orchestration platform with agents, Agenthub, a React UI rewrite, Canvas mode, MCP
      support, WebRTC realtime audio, and more backends.
  related-projects:
    - >
      llama.cpp, vLLM, whisper.cpp, stable-diffusion, MLX, and other model runtimes are
      backend building blocks named by the LocalAI README.
    - >
      OpenAI-compatible SDKs and clients are primary integration targets because LocalAI
      exposes compatible API endpoints.
    - >
      Ollama, GPT4All, and other local-model tools sit in the same self-hosted inference
      ecosystem, while LocalAI differentiates itself through broad API compatibility and
      backend orchestration.
  sources:
    - https://api.github.com/repos/mudler/LocalAI
    - https://github.com/mudler/LocalAI
    - https://github.com/mudler/LocalAI/discussions/1222
    - https://github.com/mudler/LocalAI/discussions/5689
    - https://github.com/mudler/LocalAI/discussions/9006
    - https://localai.io/basics/getting_started/
    - https://localai.io/basics/news/index.html
    - https://localai.io/reference/binaries/
  summary:
    - >
      LocalAI is an open-source local AI inference server and CLI that exposes
      OpenAI-compatible APIs for self-hosted models. It began in the 2023 local-LLM wave
      and grew from a local OpenAI API replacement into a broader multimodal AI engine
      with model galleries, backend management, web UI, agents, and distributed
      operation.
  timeline:
    - >
      2023: The mudler/LocalAI repository is created and early releases focus on local
      OpenAI-compatible inference.
    - >
      2023: v1.x news records model galleries, GPU offload, Apple Metal support,
      text-to-audio, static binaries, and backend refactoring.
    - >
      2025: v3.0.0 introduces the backend gallery, realtime WebSocket API, dynamic VRAM
      handling, and a new modular backend model.
    - >
      2026: v4.0.0 adds native agents, Agenthub, React UI, Canvas mode, MCP support,
      WebRTC realtime audio, and additional backends.
    - >
      2026: Official README highlights support for 60+ backends, multiple hardware
      accelerators, multimodal APIs, and distributed mode.
  usage:
    - >
      Users commonly run LocalAI as a local server, then point OpenAI-compatible SDKs or
      clients at localhost. The getting-started guide documents curl requests to
      /v1/chat/completions, model installation from the gallery, automatic backend
      detection based on GPU capabilities, built-in agents, and distributed mode for
      production or larger compute needs.
    - >
      The Homebrew formula installs the local-ai executable, but official docs still
      treat containers as the fullest-feature path because some Python-based and heavy
      media backends are not included in all binaries. The binary reference documents
      direct Linux and macOS downloads and notes backend limitations for binary builds.
related-packages:
  - id: brew:ollama
    reason: >
      Choose Ollama for a streamlined model pull-and-run workflow with its own local
      API; choose LocalAI when broader OpenAI and Anthropic compatibility, multiple
      interchangeable backends, and wider multimodal orchestration are required.
    rel: alternative
    sources:
      - https://localai.io/docs/
      - https://localai.io/docs/getting-started/
      - https://docs.ollama.com/
      - https://github.com/ollama/ollama
  - id: brew:llama.cpp
    reason: >
      Use llama.cpp directly when a focused C/C++ GGUF inference runtime and its native
      CLI or server are sufficient; use it alongside LocalAI when LocalAI's API and
      orchestration layer should manage llama.cpp-backed models.
    rel: adjacent_workflow
    sources:
      - https://github.com/mudler/LocalAI
      - https://github.com/ggml-org/llama.cpp
category: ai
