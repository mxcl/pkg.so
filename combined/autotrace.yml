id: brew:autotrace
display-name: AutoTrace
homepage: https://autotrace.sourceforge.net/
repo: https://github.com/autotrace/autotrace
docs:
  - https://github.com/autotrace/autotrace#readme
  - https://github.com/autotrace/autotrace/blob/master/autotrace.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AutoTrace has survived mostly as a packaging and interoperability tool rather than
      as a glossy end-user application. The official README lists Homebrew, MacPorts,
      Fedora/RHEL, Arch, FreeBSD, and Windows release installers; the input additionally
      records Nix and zypper packages.
    - >
      Its adoption is helped by broad input and output format support, especially when
      built with ImageMagick or GraphicsMagick. That makes it a convenient package for
      scripts, conversion pipelines, and graphics experiments where a CLI vectorizer is
      easier to depend on than a desktop drawing program.
  package-nerd-significance:
    - >
      AutoTrace is package-nerd relevant because image vectorization has many optional
      format dependencies and old graphics-library edges. Maintainers have to care about
      ImageMagick versus GraphicsMagick support, GLib, gettext translations, platform
      build systems, and whether users expect both the `autotrace` binary and
      `libautotrace` development files.
  project-history:
    - >
      The official README says AutoTrace was originally developed by Martin Weber and
      that some code was derived from GNU fontutils' `limn`, although most was
      rewritten. That origin explains both the traditional Unix graphics-tool feel and
      the split between command-line utility and embeddable library.
    - >
      The modern GitHub repository was created in 2013 and carries the project forward
      with build automation, cross-platform CI, translation infrastructure, and
      package-manager installation notes. The README also identifies `libautotrace` as a
      library interface, with the program under GPL and the library under LGPL.
  related-projects:
    - 'GNU fontutils limn: upstream notes code lineage.'
    - 'frontline: upstream README lists it as an inactive GUI frontend.'
    - 'ImageMagick and GraphicsMagick: optional format providers for additional input support.'
    - 'potrace: a related bitmap tracing tool in the same packaging niche.'
  sources:
    - https://github.com/autotrace/autotrace
    - https://raw.githubusercontent.com/autotrace/autotrace/master/README.md
    - source_facts.package-manager
  summary:
    - >
      AutoTrace is a bitmap-to-vector converter and library. It sits in the same
      practical family as potrace and vectorization tools, turning raster images into
      formats such as SVG, EPS, PDF, DXF, and related vector outputs.
  timeline:
    - >
      Pre-2013: Original AutoTrace development by Martin Weber, with lineage from GNU
      fontutils' `limn`.
    - '2013: GitHub repository created for the continuing autotrace project.'
    - '2018-2020: CI-era tags in the GitHub repository show renewed automation activity.'
    - >
      2020s: README documents package-manager installation and Windows installers from
      GitHub releases.
  usage:
    - >
      The basic CLI pattern is `autotrace input.png -output-file output.svg`, with
      options for centerline tracing and color reduction. The README points users to
      `autotrace --help` and the man page for the full option set.
    - >
      Developers can also call `libautotrace` through C headers and pkg-config, reading
      a bitmap and writing splines through output handlers. This dual CLI/library shape
      is why it appears in both user-facing package managers and build-time dependency
      lists.
related-packages:
  - id: brew:potrace
    reason: >
      Choose Potrace for a focused black-and-white bitmap-to-outline workflow with its
      companion preprocessing tool; choose AutoTrace when color reduction, centerline
      tracing, or AutoTrace's broader format handlers are needed.
    rel: alternative
    sources:
      - https://potrace.sourceforge.net/
      - https://github.com/autotrace/autotrace/blob/master/README.md
  - id: brew:imagemagick
    reason: >
      AutoTrace can use ImageMagick as an input provider for formats beyond its native
      readers, making ImageMagick a useful preparation and format-conversion companion.
    rel: adjacent_workflow
    sources:
      - https://github.com/autotrace/autotrace/blob/master/README.md
      - https://imagemagick.org/command-line-processing.php
category: media
package-manager:
  brew: autotrace
  dnf: autotrace
  macports: autotrace
  nix: autotrace
  zypper: autotrace
package-manager-url: https://formulae.brew.sh/formula/autotrace
license: GPL-2.0-or-later AND LGPL-2.1-or-later
tags:
  - cli
  - graphics
  - image-conversion
  - vector
description: Convert bitmap to vector graphics
executables:
  - autotrace
provenance:
  formula: autotrace
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
