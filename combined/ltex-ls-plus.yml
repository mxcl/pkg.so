id: brew:ltex-ls-plus
display-name: LTeX+ LS
homepage: https://ltex-plus.github.io/ltex-plus/
repo: https://github.com/ltex-plus/ltex-ls-plus
docs:
  - https://ltex-plus.github.io/ltex-plus
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LTeX+ LS is the maintained successor in a lineage that already had editor adoption
      through LTeX and VS Code. Official GitHub signals show about 240 stars, 16 forks,
      1,613 commits, and 13 releases, and the supplied package-manager facts show
      Homebrew and Nix packaging.
    - >
      Release activity is current: GitHub lists 18.7.0 as the latest stable release on
      Jun 13, 2026 and an 18.7.1 alpha/nightly prerelease on Jun 23, 2026. That makes
      the `ltex-ls-plus` package the active branch of the LTeX language-server story
      after the original `ltex-ls` repository was archived.
  package-nerd-significance:
    - >
      Package nerds care about LTeX+ LS because it packages a heavyweight grammar engine
      into a language-server-shaped artifact with Java and LanguageTool bundled. That
      lets editors, CI scripts, and command-line workflows get offline grammar checking
      without separately managing LanguageTool or a JVM.
    - >
      It is also a visible example of open-source succession: an abandoned VS Code
      grammar-checking extension led to LTeX, and LTeX's archival led to LTeX+,
      preserving package continuity for users who still expect `ltex-ls`-style binaries.
  project-history:
    - >
      The official README identifies LTeX+ LS as an implementation of the Language
      Server Protocol that checks markup documents with LanguageTool. It can run as an
      editor-facing language server or directly over file and directory paths as a
      command-line checker.
    - >
      The project explicitly continues earlier work: its README says that until version
      16.0.0 Julian Valentin developed the code as LTeX LS, and that LTeX LS itself was
      a fork of Adam Voss's abandoned languagetool-languageserver. The LTeX+ website
      similarly describes LTeX+ as a successor/fork of the abandoned LTeX extension and
      the earlier LanguageTool VS Code extension.
  related-projects:
    - LanguageTool is the grammar and spelling engine.
    - LTeX LS is the direct predecessor.
    - languagetool-languageserver is an earlier abandoned project in the lineage.
    - vscode-ltex-plus is the reference editor client.
  sources:
    - https://github.com/ltex-plus/ltex-ls-plus
    - https://github.com/ltex-plus/ltex-ls-plus/releases
    - https://ltex-plus.github.io/ltex-plus/
    - source_facts.package-manager
  summary:
    - >
      LTeX+ LS is the maintained LTeX+ language server, using LanguageTool to provide
      offline grammar and spelling diagnostics for LaTeX, Markdown, Typst, Org,
      reStructuredText, Quarto, and other markup formats through LSP or a CLI.
  timeline:
    - >
      Pre-LTeX: Adam Voss's languagetool-languageserver provides an earlier LanguageTool
      language-server base.
    - 'Through 16.0.0: Julian Valentin develops LTeX LS.'
    - '2026: LTeX+ LS is active, with GitHub listing 18.7.0 as latest stable on Jun 13, 2026.'
    - '2026: GitHub lists an 18.7.1 alpha/nightly prerelease on Jun 23, 2026.'
  usage:
    - >
      The official docs position LTeX+ as usable standalone from the command line, as an
      LSP server, or via editor extensions. The README says the reference client is the
      LTeX+ VS Code extension and that the language server can also print results to
      standard output without any language client.
related-packages:
  - id: brew:harper
    reason: >
      Choose Harper for a smaller, English-focused local grammar checker and native
      language server; choose LTeX+ LS for multilingual LanguageTool checking and
      markup-aware LaTeX and Markdown workflows.
    rel: alternative
    sources:
      - https://ltex-plus.github.io/ltex-plus/
      - https://github.com/Automattic/harper/blob/master/COMPARISON.md
      - https://writewithharper.com/docs/integrations/language-server
  - id: brew:languagetool
    reason: >
      Choose standalone LanguageTool when its GUI, HTTP API, or self-hosted server is
      the primary interface; choose LTeX+ LS when editor-independent LSP integration and
      markup-aware parsing are required.
    rel: alternative
    sources:
      - https://ltex-plus.github.io/ltex-plus/faq.html
      - https://dev.languagetool.org/
      - https://languagetool.org/http-api
