id: brew:corral
display-name: Corral
homepage: https://github.com/ponylang/corral
repo: https://github.com/ponylang/corral
docs:
  - https://github.com/ponylang/corral#readme
config-file-location:
  unix:
    - corral.json
    - lock.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Corral grew out of requirements work comparing Pony's needs with dependency
      managers in Go, Rust, and earlier Pony Stable workflows. Its design favors
      source-based dependencies, semver constraints, VCS locators, and checked-in lock
      files for reproducible Pony builds.
  package-nerd-significance:
    - >
      Corral is package-nerd material because it encodes a small-language
      dependency-management model: bundle-vs-package terminology, VCS-backed locators,
      transitive dependencies, lock files, and a separation between a shared repo cache
      and per-project checked-out dependency tree.
  project-history:
    - >
      The official repository was created in 2017 and describes Corral as beta-level
      software. Its design notes explain the name as a deliberate sibling to Pony
      Stable: a corral is like a stable, but distinct enough to avoid confusion with the
      older Pony dependency tool.
  related-projects:
    - >
      Related projects include Pony, ponyc, ponyup, Pony Stable, Go modules, Cargo, and
      other VCS-oriented dependency managers.
  sources:
    - https://github.com/ponylang/corral
    - https://raw.githubusercontent.com/ponylang/corral/main/README.md
    - https://raw.githubusercontent.com/ponylang/corral/main/doc/design.md
    - >
      https://raw.githubusercontent.com/ponylang/corral/main/doc/package_dependency_management.md
    - https://raw.githubusercontent.com/ponylang/corral/main/DOCS.md
    - https://api.github.com/repos/ponylang/corral
  summary:
    - >
      Corral is the Pony language dependency manager. It manages Pony bundles with
      corral.json manifests, lock.json revision locks, a shared VCS repo cache, and a
      per-project dependency tree used to populate PONYPATH.
  timeline:
    - '2017: Official GitHub repository created.'
    - >
      2010s: Design documents compare Pony dependency management with Go, Rust, and Pony
      Stable approaches.
    - 'Present: README recommends ponyup for prebuilt binaries on Linux, macOS, and Windows.'
  usage:
    - >
      A typical project runs corral init to create corral.json and lock.json, corral add
      to add a dependency, corral update to resolve and fetch dependencies, and corral
      run -- ponyc to compile with the resolved dependency directories on PONYPATH.
related-packages:
  - id: brew:ponyc
    reason: >
      Corral resolves Pony dependencies and its documented workflow runs ponyc with the
      resulting dependency directories added to PONYPATH.
    rel: adjacent_workflow
    sources:
      - https://github.com/ponylang/corral/blob/main/doc/design.md
      - https://github.com/ponylang/ponyc
category: developer-tools
package-manager:
  brew: corral
package-manager-url: https://formulae.brew.sh/formula/corral
license: BSD-2-Clause
tags:
  - cli
  - dependency-manager
  - package-management
  - pony
description: Dependency manager for the Pony language
executables:
  - corral
provenance:
  formula: corral
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
