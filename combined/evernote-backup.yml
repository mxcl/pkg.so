id: brew:evernote-backup
display-name: evernote-backup
homepage: https://github.com/vzhd1701/evernote-backup
repo: https://github.com/vzhd1701/evernote-backup
docs:
  - https://github.com/vzhd1701/evernote-backup#readme
config-file-location: null
credentials-file-location:
  unix: en_backup.db
history:
  adoption-history:
    - >
      The project documents portable binaries, Homebrew for macOS, pipx and uv for
      Python tool installation, Docker images, and source installation with Poetry,
      which made it usable across desktop and server backup setups.
  package-nerd-significance:
    - >
      The package is notable in the notes-migration niche because it separates online
      sync from offline export, giving users a scriptable backup database rather than
      only a one-shot conversion tool.
  project-history:
    - >
      The README presents the project as a backup and export tool for Evernote and
      Yinxiang accounts. Its core workflow is database initialization, incremental
      syncing from the Evernote Cloud API, and offline ENEX export.
  related-projects:
    - >
      The project maintains a similar-projects list covering ENEX exporters,
      Evernote-to-SQLite tools, and note-sync utilities.
  sources:
    - https://github.com/vzhd1701/evernote-backup#readme
    - https://github.com/vzhd1701/evernote-backup/blob/master/SIMILAR_PROJECTS.md
    - https://github.com/vzhd1701/evernote-backup/releases/latest
  summary:
    - >
      evernote-backup is a CLI for keeping a local SQLite backup of Evernote notebooks
      and exporting that backup to ENEX files.
  timeline:
    - >
      README documents Homebrew, pipx, uv, Docker, portable binaries, and Poetry source
      installs.
    - README documents incremental Evernote Cloud API sync and offline ENEX export.
  usage:
    - >
      A typical run initializes `en_backup.db`, syncs account changes into that local
      database, and exports notebooks or individual notes as ENEX. After initialization,
      users can schedule `evernote-backup sync` to keep the local database current.
related-packages:
  - id: brew:evernote2md
    reason: >
      Use evernote-backup to synchronize an account and export notebooks as ENEX, then
      pass those ENEX files to evernote2md to create Markdown notes and extracted
      attachments.
    rel: adjacent_workflow
    sources:
      - https://github.com/vzhd1701/evernote-backup#readme
      - https://github.com/wormi4ok/evernote2md#readme
category: productivity
package-manager:
  brew: evernote-backup
  scoop: main/evernote-backup
package-manager-url: https://formulae.brew.sh/formula/evernote-backup
license: MIT
tags:
  - backup
  - cli
  - evernote
  - export
  - notes
description: Backup & export all Evernote notes and notebooks
executables:
  - evernote-backup
provenance:
  formula: evernote-backup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
