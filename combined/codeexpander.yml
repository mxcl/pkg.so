history:
  adoption-history:
    - >
      CodeExpander is distributed for macOS and Windows with free and paid
      functionality. Its documentation targets developers, designers, writers, product
      managers, and other users who repeatedly enter templates or need screenshot and
      clipboard tools.
  package-nerd-significance:
    - >
      CodeExpander combines three utilities often packaged separately—text expansion,
      screenshot annotation, and clipboard history. Its support for keeping synchronized
      snippet data in a user's own GitHub, Gitee, GitLab, or WebDAV account is notable
      for users who prefer portable or self-controlled data storage.
  project-history:
    - >
      ONCE.WORK develops CodeExpander Pro as proprietary desktop software. Its official
      GitHub repository contains the product's landing and documentation source rather
      than the desktop application's source code. The 2026 changelog records expansion
      of AI assistance, per-snippet cloud synchronization, capture performance, and
      snippet persistence features.
  related-projects:
    - >
      CodeExpander can import TextExpander data and can synchronize through GitHub Gist,
      Gitee Gist, GitLab, WebDAV, or the optional CodeExpander cloud service.
  sources:
    - https://codeexpander.com/en/docs/changelog/
    - https://codeexpander.com/en/docs/getting-started/
    - https://codeexpander.com/en/docs/introduction/
    - https://codeexpander.com/en/docs/sync/gist-webdav/
    - https://github.com/oncework/codeexpander
  summary:
    - >
      CodeExpander Pro is a cross-platform productivity application combining
      abbreviation-based snippet expansion, screenshot capture and annotation, and
      clipboard history.
  timeline:
    - >
      2026-03: Official changelog records expanded AI and per-snippet synchronization
      capabilities.
    - >
      2026-04: Official changelog records code explanation, review, unit-test
      generation, and capture-performance improvements.
  usage:
    - >
      Users create a snippet with an abbreviation, type that abbreviation in a text
      field, and press a configurable trigger key to insert its content. The same
      application provides screenshot annotation and searchable clipboard history, while
      optional synchronization moves snippets between devices.
category: productivity
