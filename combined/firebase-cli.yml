id: brew:firebase-cli
display-name: Firebase CLI
homepage: https://firebase.google.com/docs/cli/
repo: https://github.com/firebase/firebase-tools
docs:
  - https://firebase.google.com/docs/cli
  - https://github.com/firebase/firebase-tools#readme
config-file-location:
  unix: ~/.config/configstore/firebase-tools.json
credentials-file-location:
  unix: ~/.config/configstore/firebase-tools.json
history:
  adoption-history:
    - >
      The primary installation path is npm: `npm install -g firebase-tools` provides the
      globally accessible `firebase` command. The official README also documents a
      standalone binary installer, which matters for users who want a dependency-light
      CLI outside a Node development environment.
    - >
      Firebase CLI adoption is tied to Firebase project workflows. Developers use it
      locally for `firebase init`, `firebase login`, emulator startup, and deployment;
      teams use it in CI for deploys, project listing, and authenticated service-account
      or token-based automation.
  package-nerd-significance:
    - >
      Firebase CLI is significant because it is a cloud product's operational surface
      packaged as a local developer tool. Installing one package gives a project its
      deploy command, emulator runner, auth setup, project selector, data import/export
      utility, and CI automation hook.
    - >
      For package managers, it is also a Node-based CLI with standalone binary
      distribution, so it sits at the intersection of npm global installs,
      Homebrew-style desktop tooling, and vendor-managed cloud workflows.
  project-history:
    - >
      The firebase-tools GitHub repository was created in December 2013, during
      Firebase's early developer-platform era. The official README now describes it as
      both the Firebase Command Line Interface tools and the home of the official
      Firebase MCP Server.
    - >
      Firebase CLI grew with the Firebase platform. Its README command list shows the
      tool expanding beyond Hosting deployment into project management, local emulators,
      App Distribution, Authentication, Realtime Database, Extensions, Firestore, Cloud
      Functions, Hosting, and Remote Config.
  related-projects:
    - >
      Firebase Hosting, Cloud Functions for Firebase, Realtime Database, Cloud
      Firestore, Authentication, Remote Config, App Distribution, Extensions, and the
      Emulator Suite are first-party services managed by the CLI.
    - >
      Node.js and npm are the primary runtime and package-manager path documented for
      installing firebase-tools.
    - >
      Google Cloud service-account credentials and Application Default Credentials are
      supported authentication paths for automation.
  sources:
    - https://firebase.google.com/docs/cli
    - https://github.com/firebase/firebase-tools
    - https://raw.githubusercontent.com/firebase/firebase-tools/master/README.md
    - https://api.github.com/repos/firebase/firebase-tools
  summary:
    - >
      Firebase CLI is Google's command-line tool for testing, managing, and deploying
      Firebase projects. The `firebase` executable covers project setup, deployment,
      local emulation, Hosting, Realtime Database, Firestore, Cloud Functions,
      Authentication import/export, Extensions, App Distribution, Remote Config, and
      related Firebase operations.
  timeline:
    - '2013: firebase-tools repository is created on GitHub.'
    - >
      2010s: npm global installation becomes the primary documented installation path
      for the `firebase` command.
    - >
      2020s: CLI command surface includes local emulators, App Distribution, Extensions,
      Firestore, Functions, Hosting, and Remote Config workflows.
    - >
      2026: Repository metadata and the README snapshot used for this enrichment show
      active maintenance and the addition of the official Firebase MCP Server in the
      same repository.
  usage:
    - >
      A typical workflow starts with `firebase login` and `firebase init`, which creates
      a `firebase.json` configuration file in the current project directory. Deployment
      commands then rely on that local project folder and configuration.
    - >
      The CLI is also a local development surface. Commands such as `emulators:start`,
      `emulators:exec`, `serve`, and Functions shell support let developers test
      Firebase services before deploying to Google-hosted infrastructure.
related-packages:
  - id: brew:node
    reason: >
      Node.js supplies npm, the primary installation path documented for Firebase CLI,
      and is also the runtime used by many Firebase Functions and local development
      workflows.
    rel: adjacent_workflow
    sources:
      - https://firebase.google.com/docs/cli
      - https://github.com/firebase/firebase-tools/blob/main/README.md
      - https://nodejs.org/en/learn/getting-started/an-introduction-to-the-npm-package-manager
category: cloud-infrastructure
package-manager:
  brew: firebase-cli
  scoop: main/firebase
  winget: Google.FirebaseCLI
package-manager-url: https://formulae.brew.sh/formula/firebase-cli
license: MIT
tags:
  - cli
  - cloud
  - deployment
  - emulators
  - firebase
  - hosting
description: Firebase command-line tools
executables:
  - firebase
provenance:
  formula: firebase-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
