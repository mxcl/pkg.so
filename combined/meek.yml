id: brew:meek
display-name: meek
homepage: https://www.torproject.org
repo: https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/meek
docs:
  - >
    https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/meek/-/blob/main/README.md
  - https://tb-manual.torproject.org/circumvention
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      meek's adoption is tied to Tor Browser's censorship-circumvention workflow, where
      pluggable transports help users connect when direct Tor access is blocked. The Tor
      support documentation keeps circumvention guidance under Tor Browser support,
      while the package input shows meek available in Homebrew, Alpine, Nix, and Arch.
    - >
      Its deployment history is also shaped by changing support for domain fronting
      among large providers, so meek is best understood as one member of Tor's
      anti-censorship transport family rather than a general-purpose proxy.
  package-nerd-significance:
    - >
      meek is significant because it packages anti-censorship research into small
      Unix-style client and server binaries. For packagers, it is a privacy-networking
      tool whose value comes from predictable executable names, Tor integration, and
      minimal visible configuration rather than from broad standalone CLI features.
  project-history:
    - >
      The official tag history reaches back to 0.0 in February 2014 and 0.1 in March
      2014, with David Fifield as the author on early commits. The current Tor GitLab
      project was created in June 2020 as part of Tor's anti-censorship
      pluggable-transports namespace, preserving a project with older history.
    - >
      The README explains the architecture: `meek-client` runs on the censored client,
      `meek-server` runs on a Tor relay, and reflector components for App Engine, nginx,
      PHP, WSGI, and browser-extension helpers make HTTPS traffic look like allowed web
      traffic.
  related-projects:
    - >
      meek is part of Tor's pluggable-transport ecosystem and relates to Tor Browser,
      Tor bridges, domain fronting, App Engine reflectors, nginx/PHP/WSGI reflectors,
      and browser-extension TLS camouflage.
  sources:
    - >
      https://gitlab.torproject.org/api/v4/projects/tpo%2Fanti-censorship%2Fpluggable-transports%2Fmeek
    - >
      https://gitlab.torproject.org/api/v4/projects/tpo%2Fanti-censorship%2Fpluggable-transports%2Fmeek/repository/tags
    - https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/meek
    - >
      https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/meek/-/raw/main/README
    - https://support.torproject.org/tor-browser/circumvention/
  summary:
    - >
      meek is a Tor pluggable transport designed to resist blocking by encoding traffic
      as HTTPS requests and responses reflected through hard-to-block third-party web
      services. Its README identifies domain fronting as the key trick behind the
      transport.
  timeline:
    - '2014: Official tag 0.0 is created in February, followed by 0.1 in March.'
    - >
      2020: Current Tor GitLab project is created in the anti-censorship
      pluggable-transports namespace.
    - '2022: Official tag v0.38.0 is created.'
  usage:
    - >
      Users normally encounter meek through Tor pluggable-transport configuration rather
      than by hand-running it. The README documents direct client usage with
      `meek-client --url=... --front=...`, server-side `meek-server`, and helper
      components for reflector services and browser-based TLS camouflage.
related-packages:
  - id: brew:tor
    reason: >
      Run meek as a pluggable transport for the tor daemon when direct access to the Tor
      network is censored.
    rel: adjacent_workflow
    sources:
      - >
        https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/meek/-/blob/main/README.md
      - https://support.torproject.org/little-t-tor/circumvention/using-bridges/
  - id: brew:snowflake
    reason: >
      Choose Snowflake instead when volunteer-operated ephemeral WebRTC proxies work
      better than meek's cloud-site camouflage in the affected network.
    rel: alternative
    sources:
      - https://support.torproject.org/tor-browser/circumvention/unblocking-tor/
      - https://support.torproject.org/anti-censorship/what-is-snowflake/
  - id: brew:obfs4proxy
    reason: >
      Choose obfs4proxy when bridge-based traffic obfuscation is effective and obtaining
      an obfs4 bridge is practical, rather than relying on meek's cloud-provider
      technique.
    rel: alternative
    sources:
      - https://support.torproject.org/tor-browser/circumvention/unblocking-tor/
      - https://community.torproject.org/relay/setup/bridge/
category: networking
package-manager:
  apk: meek
  brew: meek
  nix: meek
  pacman: meek
package-manager-url: https://formulae.brew.sh/formula/meek
license: CC0-1.0
tags:
  - anti-censorship
  - cli
  - networking
  - pluggable-transport
  - privacy
  - tor
description: Blocking-resistant pluggable transport for Tor
executables:
  - meek-client
  - meek-server
provenance:
  formula: meek
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
