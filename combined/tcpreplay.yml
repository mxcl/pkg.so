id: brew:tcpreplay
display-name: tcpreplay
homepage: https://tcpreplay.appneta.com/
repo: https://github.com/appneta/tcpreplay
docs:
  - https://tcpreplay.appneta.com/wiki
  - https://tcpreplay.appneta.com/wiki/installation.html
config-file-location:
  unix:
    - $$/.tcpreplayrc
    - $$/.tcppreprc
    - $$/.tcprewriterc
    - $$/.tcpbridgerc
credentials-file-location: null
history:
  adoption-history:
    - >
      The official overview says Tcpreplay is used by firewall, IDS, IPS, NetFlow and
      other networking vendors, enterprises, universities, labs, and open source
      projects. The supplied package metadata shows the same package name across
      Homebrew, Debian, Ubuntu, Fedora/DNF, Arch, Alpine, MacPorts, Nix, and openSUSE,
      which matches its role as a standard Unix networking utility rather than a
      single-platform app.
  package-nerd-significance:
    - >
      Tcpreplay matters because it is the boring, scriptable answer to a recurring lab
      problem: replay this exact capture again, faster, slower, edited, looped, or
      through a particular interface. Its many helper executables make the package
      larger than a single CLI, but they also make it a recognizable toolbox for
      traffic-generator and packet-capture workflows.
  project-history:
    - >
      The project traces its own history to Matt Undy of Anzen Computing, who released
      version 1.0.1 as part of the nidsbench toolkit in 1999. Development later passed
      through separate 2001 efforts by Matt Bing at NFR and Aaron Turner at OneSecure,
      after which Turner and Bing continued development together and the project gained
      major rewrites plus companion tools.
    - >
      A later maintainer handoff came in 2013, when Fred Klassen, sponsored by AppNeta,
      took over maintenance. The official history page identifies version 4.0.0 as
      Klassen's first major release, and the overview describes version 4.0 as the point
      where Tcpreplay was expanded for IP Flow and NetFlow testing, higher playback
      accuracy, flow statistics, and netmap-based high-speed replay.
  related-projects:
    - >
      tcpdump and Wireshark provide common capture inputs; libpcap underlies
      capture-file handling; netmap and AF_XDP appear in the official documentation as
      high-performance packet I/O paths; tcpprep, tcprewrite, tcpreplay-edit, tcpbridge,
      tcpcapinfo, and tcpliveplay are companion tools in the suite.
  sources:
    - https://tcpreplay.appneta.com/wiki/history.html
    - https://tcpreplay.appneta.com/wiki/installation.html
    - https://tcpreplay.appneta.com/wiki/overview.html
    - https://tcpreplay.appneta.com/wiki/products.html
    - input source_facts.package-manager
  summary:
    - >
      Tcpreplay is a Unix-oriented suite for editing and replaying packet captures. In
      package-manager catalogs it sits in the practical network-testing niche: a toolset
      for turning saved tcpdump or Wireshark traffic into repeatable traffic-generation,
      firewall, IDS, IPS, NetFlow, and lab tests.
  timeline:
    - '1999: Matt Undy released tcpreplay 1.0.1 as part of nidsbench.'
    - >
      2001: Matt Bing and Aaron Turner independently resumed work, then continued
      development together.
    - '2013: Fred Klassen, sponsored by AppNeta, took over maintenance.'
    - >
      4.0.0: First major AppNeta-sponsored release, with NetFlow/IP Flow-oriented
      enhancements.
    - '2024: Official installation page listed the 4.5.1 release and release announcement.'
  usage:
    - >
      The suite replays pcap files at chosen speeds, edits packets on the fly,
      classifies client and server traffic, rewrites Layer 2 through Layer 4 headers,
      bridges traffic, inspects captures, and prepares captures for replay. Typical
      package-nerd use is to install it next to tcpdump, Wireshark, and libpcap tooling,
      then use saved captures as reproducible network fixtures.
category: networking
package-manager:
  apk: tcpreplay
  brew: tcpreplay
  debian: tcpreplay
  dnf: tcpreplay
  macports: tcpreplay
  nix: tcpreplay
  pacman: tcpreplay
  ubuntu: tcpreplay
  zypper: tcpreplay
package-manager-url: https://formulae.brew.sh/formula/tcpreplay
license: BSD-2-Clause AND BSD-3-Clause AND BSD-4-Clause AND GPL-3.0-or-later AND ISC
tags:
  - cli
  - network-testing
  - packet-replay
  - pcap
  - traffic-generator
description: Replay saved tcpdump files at arbitrary speeds
executables:
  - tcpbridge
  - tcpcapinfo
  - tcpliveplay
  - tcpprep
  - tcpreplay
  - tcpreplay-edit
  - tcprewrite
provenance:
  formula: tcpreplay
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
