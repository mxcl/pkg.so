id: brew:gnustep-base
display-name: GNUstep Base
homepage: https://www.gnustep.org/
repo: https://github.com/gnustep/libs-base
docs:
  - https://www.gnustep.org/resources/documentation
  - https://www.gnustep.org/resources/documentation/Developer/Base/Reference/index.html
config-file-location:
  linux: /etc/GNUstep/GNUstep.conf
  unix: ~/.GNUstep.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      GNUstep Base has been adopted mostly by developers who want the OpenStep or
      Cocoa-style Objective-C model outside Apple's platforms, along with GNUstep
      applications that depend on Foundation behavior. Its importance is less about mass
      end-user visibility and more about keeping an older but influential object system
      buildable through ordinary Unix package managers.
    - >
      The package appears across Unix distributions because it is a common dependency
      for GNUstep applications and developer tools. It also serves portability work:
      code can use Foundation-style APIs without tying every build to a proprietary
      platform SDK.
  package-nerd-significance:
    - >
      GNUstep Base is a package-manager hinge for the GNUstep world. It brings
      Objective-C runtime concerns, Foundation compatibility, file layout conventions,
      and command-line developer utilities into one package, so a small formula or
      distribution package unlocks a larger OpenStep-derived ecosystem.
  project-history:
    - >
      GNUstep began as a free software implementation of the OpenStep APIs, preserving
      the NeXT/OpenStep programming model on Unix-like systems and other platforms. The
      Base library became the project's core runtime-facing library: the part needed by
      command-line tools, daemons, tests, and higher GNUstep frameworks before any GUI
      code enters the picture.
    - >
      The library's repository history and documentation show a long-running Foundation
      implementation maintained apart from the graphical back end. It accumulated
      compatibility work for Objective-C runtimes, property-list formats, Unicode and
      encoding handling, networking, process control, and developer utilities such as
      defaults, plparse, plutil, autogsdoc, and gspath.
  related-projects:
    - GNUstep Make provides the build system commonly paired with GNUstep Base.
    - GNUstep GUI and back-end packages build graphical application support above Base.
    - Objective-C runtimes such as libobjc2 are relevant to many GNUstep deployments.
  sources:
    - https://github.com/gnustep/libs-base
    - https://www.gnustep.org/
    - https://www.gnustep.org/resources/documentation
    - https://www.gnustep.org/resources/documentation/Developer/Base/Reference/index.html
  summary:
    - >
      GNUstep Base is the non-graphical Foundation layer of GNUstep, the GNU
      implementation of the OpenStep object and application environment. It gives
      Objective-C programs a portable class library for strings, collections, files,
      processes, property lists, notifications, distributed objects, and other services
      that sit below a graphical application framework.
  timeline:
    - '1990s: GNUstep formed around a free implementation of the OpenStep environment.'
    - >
      2000s: GNUstep Base matured as the Foundation-compatible non-graphical library
      used by GNUstep tools and applications.
    - >
      2010s: Repository hosting and distribution packaging made GNUstep Base easier to
      consume as a standalone dependency.
    - >
      2020s: The Base reference documentation and GitHub repository remained core entry
      points for developers.
  usage:
    - >
      Practitioners use GNUstep Base as a library dependency for Objective-C software
      and as a toolbox for inspecting and manipulating GNUstep property lists, defaults,
      documentation, and path configuration. The installed commands are practical
      companions to the library rather than a single monolithic application.
    - >
      Developers building GNUstep applications usually combine GNUstep Base with GNUstep
      Make, an Objective-C compiler/runtime, and, for graphical programs, GUI and
      back-end packages. For non-graphical Objective-C tools, Base alone supplies much
      of the Foundation-style environment.
related-packages: []
category: developer-tools
package-manager:
  brew: gnustep-base
  debian: gnustep-base-common
  dnf: gnustep-base
  macports: gnustep-base
  nix: gnustep-base
  pacman: gnustep-base
  ubuntu: gnustep-base-common
  zypper: gnustep-base
package-manager-url: https://formulae.brew.sh/formula/gnustep-base
license: GPL-2.0-or-later
tags:
  - cli
  - cocoa-compatible
  - foundation
  - framework
  - library
  - objective-c
  - openstep
description: Library of general-purpose, non-graphical Objective C objects
executables:
