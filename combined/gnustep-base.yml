  - autogsdoc
  - classes
  - cvtenc
  - defaults
  - gdnc
  - gdomap
  - gspath
  - make_strings
  - pl
  - pl2link
  - pldes
  - plget
  - plmerge
  - plparse
  - plser
  - plutil
  - sfparse
  - xmlparse
provenance:
  formula: gnustep-base
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
