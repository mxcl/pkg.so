id: brew:jenkins-cli
display-name: Jenkins CLI
homepage: https://github.com/jenkins-zh/jenkins-cli
repo: https://github.com/jenkins-zh/jenkins-cli
docs:
  - https://github.com/jenkins-zh/jenkins-cli#readme
  - https://jcli.jenkins-zh.cn/
config-file-location:
  unix: ~/.jenkins-cli.yaml
credentials-file-location:
  unix: ~/.jenkins-cli.yaml
history:
  adoption-history:
    - >
      jcli's adoption niche is convenience packaging. The project documentation
      advertises Homebrew, MacPorts, Linux tarballs, Scoop, and Chocolatey-style
      installation paths, which turns Jenkins administration into a normal
      package-manager install instead of a controller-provided jar download.
  package-nerd-significance:
    - >
      This formula matters because it packages a third-party Jenkins client under a name
      that can be confused with Jenkins' built-in CLI. Package users get a native `jcli`
      binary, not the upstream Jenkins `jenkins-cli.jar`, so the history helps
      distinguish the Go client from the automation server's own command interface.
  project-history:
    - >
      A Jenkins project blog post in 2019 explains the motivation: Jenkins already had a
      built-in CLI, but the Java invocation was wordy, required a JRE, and was awkward
      for users expecting a native command. jcli was created as a Go-based CLI that runs
      natively on common desktop and server platforms.
    - >
      The GitHub repository was created in June 2019 and its early release stream began
      with v0.0.5 that same month. The README presents the tool as useful for plugin
      developers, administrators, and regular Jenkins users.
  related-projects:
    - >
      Jenkins' built-in CLI is the direct comparison point and remains distributed by
      Jenkins controllers as jenkins-cli.jar.
    - >
      Configuration as Code is a related Jenkins administration workflow supported by
      jcli commands.
    - >
      The jenkins-zh documentation and plugin repositories form the surrounding project
      family for jcli.
  sources:
    - https://github.com/jenkins-zh/jenkins-cli
    - https://github.com/jenkins-zh/jenkins-cli/releases
    - https://www.jenkins.io/blog/2019/08/30/jenkins-cli/
    - https://www.jenkins.io/doc/book/managing/cli/
  summary:
    - >
      jenkins-cli in Homebrew is jcli, a Go command-line client from the Jenkins Chinese
      community for managing Jenkins servers without using the Java jenkins-cli.jar
      workflow for every command.
  timeline:
    - '2019: the jenkins-zh/jenkins-cli repository was created in June.'
    - '2019: v0.0.5 was published on June 22 as an early GitHub release.'
    - >
      2019: the Jenkins project blog described jcli as a Go-native alternative for
      managing Jenkins from the command line.
  usage:
    - >
      The tool focuses on multiple Jenkins server profiles, plugin listing and
      installation, job search/build/log operations, Configuration as Code support,
      browser opening, restart commands, and proxy-aware connections. Its config file
      stores server URL, username, token, and proxy settings so users can switch between
      Jenkins instances.
related-packages:
  - id: brew:jenkins
    reason: >
      Install Jenkins as the automation server that jcli connects to for job, plugin,
      restart, and configuration administration.
    rel: adjacent_workflow
    sources:
      - https://github.com/jenkins-zh/jenkins-cli
      - https://www.jenkins.io/doc/
category: developer-tools
package-manager:
  brew: jenkins-cli
  macports: jenkins-cli
  nix: jcli
  scoop: main/jcli
package-manager-url: https://formulae.brew.sh/formula/jenkins-cli
license: MIT
tags:
  - ci-cd
  - cli
  - go
  - jenkins
  - jenkins-client
description: CLI for jenkins
executables:
  - jcli
provenance:
  formula: jenkins-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
