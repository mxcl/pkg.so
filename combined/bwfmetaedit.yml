id: brew:bwfmetaedit
display-name: BWF MetaEdit
homepage: https://mediaarea.net/BWFMetaEdit
repo: https://github.com/MediaArea/BWFMetaEdit
docs:
  - https://mediaarea.net/BWFMetaEdit
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      BWF MetaEdit's adoption is concentrated in archives, libraries, and audiovisual
      preservation rather than broad Unix administration. MediaArea distributes binaries
      for Windows, macOS, Debian, Ubuntu, RHEL, CentOS, Fedora, openSUSE, Arch,
      Raspbian, and Flatpak, while the supplied package facts show a Homebrew formula
      for the CLI.
  package-nerd-significance:
    - >
      BWF MetaEdit matters to package nerds because it is a preservation-domain
      command-line tool with GUI siblings, standards references, and cross-platform
      binary distribution. Its formula is niche, but it gives archivists a scriptable
      way to enforce metadata and checksum conventions on audio collections.
  project-history:
    - >
      The official MediaArea page says BWF MetaEdit was initially funded by the Library
      of Congress and FADGI, designed and led by AVPreserve, and developed by MediaArea.
      The project page and README describe support for importing, editing, embedding,
      exporting, validating, checksumming, and reporting Broadcast WAVE metadata.
    - >
      The official Git repository carries both CLI and GUI build instructions. Tags show
      a 1.1.0 release in 2010 and later date-based releases such as 20.05, 24.10, 25.04,
      and 26.01.
  related-projects:
    - >
      MediaInfo, MediaConch, MediaTrace, QCTools, AVI MetaEdit, MOV MetaEdit,
      DVAnalyzer, RAWcooked, and DVRescue are listed alongside BWF MetaEdit in
      MediaArea's project navigation.
    - >
      FADGI and the Library of Congress are important institutional sources for the
      guidelines and original funding context.
  sources:
    - https://github.com/MediaArea/BWFMetaEdit
    - https://mediaarea.net/BWFMetaEdit
    - source_facts.package-manager
  summary:
    - >
      BWF MetaEdit is a MediaArea tool for embedding, validating, exporting, and
      reporting metadata in Broadcast WAVE files. It is closely tied to audio
      preservation workflows and the FADGI Broadcast WAVE Metadata Embedding Guidelines.
  timeline:
    - '2010: v1.1.0 tag appears in the official Git repository.'
    - '2017: v1.3.x tags appear in the official Git repository.'
    - '2020: Date-based v20.05 and v20.08 releases appear.'
    - '2024: v24.01, v24.05, and v24.10 releases appear.'
    - '2026: MediaArea page lists BWF MetaEdit 26.01.'
  usage:
    - >
      Users apply BWF MetaEdit to inspect or repair Broadcast WAVE metadata, export
      technical and descriptive fields as CSV or XML, verify or embed MD5 checksums for
      audio data chunks, and validate files against FADGI, EBU, Microsoft, and
      IBM-related WAVE/BWF expectations.
related-packages:
  - id: cask:mediainfo
    reason: >
      Use MediaInfo alongside BWF MetaEdit to inspect general container, codec, stream,
      and tag details before performing BWF-specific metadata editing or validation.
    rel: adjacent_workflow
    sources:
      - https://mediaarea.net/BWFMetaEdit
      - https://mediaarea.net/en/MediaInfo
  - id: brew:mediaconch
    reason: >
      Use MediaConch when a preservation workflow also needs policy-based conformance
      checking across audiovisual files rather than only Broadcast WAVE metadata
      validation.
    rel: adjacent_workflow
    sources:
      - https://mediaarea.net/BWFMetaEdit
      - https://mediaarea.net/MediaConch
category: media
