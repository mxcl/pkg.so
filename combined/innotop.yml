id: brew:innotop
display-name: innotop
homepage: https://github.com/innotop/innotop/
repo: https://github.com/innotop/innotop
docs:
  - https://github.com/innotop/innotop#readme
config-file-location:
  unix:
    - ~/.innotop/innotop.conf
    - /etc/innotop/innotop.conf
credentials-file-location:
  unix:
    - ~/.innotop/innotop.conf
    - /etc/innotop/innotop.conf
history:
  adoption-history:
    - >
      innotop was packaged by Unix distributions early. Its INSTALL file lists FreeBSD,
      Gentoo, Ubuntu/Debian, and RPM packages via openSUSE Build Service, while Homebrew
      metadata lists additional Fedora and openSUSE packaging. The package persisted
      because database operators wanted a fast terminal view into MySQL and InnoDB
      behavior.
  package-nerd-significance:
    - >
      innotop is a classic ops package: a single Perl program with embedded
      documentation, DBI/DBD::mysql dependencies, and a long compatibility tail across
      MySQL, Percona Server, and MariaDB. Its history captures the era when terminal
      dashboards were the lightest viable database observability stack.
  project-history:
    - >
      The program source records copyright from 2006 by Baron Schwartz and later
      maintainers Kenny Gryp and Frederic Descamps from 2013. The README notes that the
      full project history was imported into GitHub and that the manual is embedded in
      the program as Perl POD.
    - >
      The changelog shows the project maturing rapidly during the MySQL 5 era: adding
      plugin functionality, group-by behavior, richer filtering and sorting, central and
      per-user configuration files, command-line DSN handling, query dashboards,
      Percona/MariaDB user statistics, and later compatibility work for MySQL 8, MySQL
      9, SSL, Group Replication, and changed replication terminology.
  related-projects:
    - >
      Related projects and technologies include MySQL, InnoDB, MariaDB, Percona Server,
      Perl DBI and DBD::mysql, MySQL option files, and the Unix `top` interface
      tradition.
  sources:
    - https://formulae.brew.sh/formula/innotop
    - https://github.com/innotop/innotop
    - https://raw.githubusercontent.com/innotop/innotop/master/Changelog
    - https://raw.githubusercontent.com/innotop/innotop/master/INSTALL
    - https://raw.githubusercontent.com/innotop/innotop/master/README.md
    - https://raw.githubusercontent.com/innotop/innotop/master/innotop
  summary:
    - >
      innotop is a Perl terminal monitor for MySQL, modeled after `top`. The README
      describes it as customizable, plugin-capable, able to monitor many servers at
      once, and able to aggregate across them.
  timeline:
    - '2006: Program source records original copyright by Baron Schwartz.'
    - >
      2007: Version 1.5 adds plugin functionality, group-by behavior, and configuration
      directory changes.
    - >
      2009: Version 1.7 adds central config support and the default
      `~/.innotop/innotop.conf` path.
    - '2010: Version 1.8 adds Percona/MariaDB USER_STATISTICS support and query summaries.'
    - '2018: Version 1.12 adds MySQL 8.0 support.'
    - '2021: Version 1.13 adds SSL support.'
    - '2024: Version 1.15 adds Group Replication and new replication terminology support.'
    - '2026: Version 1.16 reworks query EXPLAIN compatibility for modern MySQL.'
  usage:
    - >
      Users run `innotop` in a terminal to inspect MySQL queries, transactions, locks,
      replication, and server health. Connection details can come from command-line
      DSNs, MySQL option files, prompts, or saved innotop configuration, with
      credentials potentially stored in the same config paths curated for this package.
related-packages:
  - id: brew:percona-toolkit
    reason: >
      Use innotop for a continuously refreshing MySQL dashboard, then Percona Toolkit
      for deeper tasks such as query-digest analysis, replication checks, and online
      schema changes.
    rel: adjacent_workflow
    sources:
      - https://github.com/innotop/innotop
      - https://docs.percona.com/percona-toolkit/
category: data
package-manager:
  brew: innotop
  dnf: innotop
  zypper: innotop
package-manager-url: https://formulae.brew.sh/formula/innotop
license: GPL-2.0-only OR Artistic-1.0-Perl
tags:
  - cli
  - database-monitoring
  - mysql
  - terminal
  - top
description: Top clone for MySQL
executables:
  - innotop
provenance:
  formula: innotop
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
