id: brew:detach
display-name: detach
homepage: https://inglorion.net/software/detach/
repo: null
docs:
  - https://inglorion.net/software/detach
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      detach occupies the old-school Unix packaging niche: tiny source tarball, Makefile
      installation, and availability through package managers for users who want a
      command rather than a shell built-in. Its official documentation emphasizes
      portability across OpenBSD, NetBSD, GNU/Linux, and Mac OS X rather than a large
      plugin ecosystem.
  package-nerd-significance:
    - >
      For package nerds, detach is interesting because it packages one precise
      process-control behavior as a tiny, portable C utility. It sits in the same mental
      drawer as nohup, setsid, daemon helpers, and shell job-control commands, but with
      a deliberately narrow interface.
  project-history:
    - >
      Robbert Haarman's official detach page is dated 2010-12-11 and still presents the
      project as a minimalist command-line tool. The page offers an initial 0.1.0 source
      release and a later 0.2.3 release that added pidfiles, explicit
      stdin/stdout/stderr files, and a foreground mode.
  related-projects:
    - >
      The official documentation directly compares detach with util-linux setsid, shell
      disown built-ins, and POSIX-style nohup.
  sources:
    - https://inglorion.net/software/detach/
  summary:
    - >
      detach is a small Unix-style command for starting another process outside the
      control of the current terminal. Its official page frames it as a portable utility
      that forks, detaches from the terminal, and then executes the requested command.
  timeline:
    - '2010: Official detach page dated 2010-12-11 documents the tool and source releases.'
    - '2010: Initial 0.1.0 release provided the minimal command-running behavior.'
    - '2010: Release 0.2.3 added pidfiles, stream-file options, and foreground execution.'
  usage:
    - >
      The common use case is launching a command so it survives terminal exit without
      depending on shell job control. The official examples compare it with setsid,
      disown, and nohup, and show why a standalone executable can be useful from scripts
      or other programs.
related-packages:
  - id: brew:util-linux
    reason: >
      Choose util-linux's setsid when it is already available and you only need detach's
      original session-creation behavior; the detach author states that setsid does the
      same job as detach 0.1.0.
    rel: alternative
    sources:
      - https://inglorion.net/software/detach/
      - https://github.com/util-linux/util-linux/blob/master/sys-utils/setsid.1.adoc
  - id: brew:daemonize
    reason: >
      Choose daemonize when a process needs fuller daemon setup such as a working
      directory, output files, PID and lock files, or a different user, rather than
      detach's narrower terminal-detachment interface.
    rel: alternative
    sources:
      - https://inglorion.net/software/detach/
      - https://software.clapper.org/daemonize/daemonize.html
  - id: brew:coreutils
    reason: >
      Choose GNU nohup when ignoring SIGHUP with conventional nohup output handling is
      sufficient; choose detach when the process must leave the controlling terminal and
      remain free to use SIGHUP itself.
    rel: alternative
    sources:
      - https://inglorion.net/software/detach/
      - https://www.gnu.org/software/coreutils/manual/html_node/nohup-invocation.html
