id: brew:beakerlib
display-name: BeakerLib
homepage: https://github.com/beakerlib/beakerlib
repo: https://github.com/beakerlib/beakerlib
docs:
  - https://beakerlib.readthedocs.io/en/latest
  - https://beakerlib.readthedocs.io/en/latest/manual.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Fedora and RHEL packaging as the primary distribution path,
      with newer builds available through COPR. The batch package facts show Homebrew
      and Fedora packaging, which is narrower than Beads or bdftopcf but notable because
      the package carries Linux distribution QA practices into local developer
      environments.
    - >
      The beakerlib GitHub organization also hosts many domain-specific shell libraries,
      showing that BeakerLib became more than one script: it is a shared testing
      vocabulary for distribution and system-integration tests.
  package-nerd-significance:
    - >
      BeakerLib is package-nerd significant because it is a packaged testing framework
      for the shell and the operating system, not just for an application language. It
      reflects the needs of distribution QA: tests must install from packages,
      manipulate services, survive real system state, and produce machine-readable logs
      for automation.
    - >
      Its move from Fedora Hosted to GitHub/Read the Docs also marks a common
      infrastructure migration path for older Fedora-era projects after fedorahosted.org
      was retired.
  project-history:
    - >
      The current documentation says the project moved to its new official home after
      fedorahosted.org was shut down. The GitHub repository was created on 2017-03-01
      and the README identifies it as the upstream project for a shell testing library
      with Fedora/RHEL distribution support.
    - >
      BeakerLib's manual documents the long-lived shell API surface: tests source
      /usr/share/beakerlib/beakerlib.sh, start and end journals, divide work into
      phases, run commands, assert conditions, manage services and files, and emit
      journal.txt, journal.xml, and TestResults output.
  related-projects:
    - >
      Beaker is the broader Red Hat-origin automated test system whose ecosystem gives
      BeakerLib its name and context.
    - Fedora and RHEL packaging are the documented distribution channels.
    - >
      The beakerlib GitHub organization hosts companion libraries for areas such as
      firewalld, database, yum, crypto, and distribution testing.
  sources:
    - https://api.github.com/repos/beakerlib/beakerlib
    - https://beakerlib.readthedocs.io/en/latest/
    - https://beakerlib.readthedocs.io/en/latest/manual.html
    - https://github.com/beakerlib
    - https://raw.githubusercontent.com/beakerlib/beakerlib/master/README.md
  summary:
    - >
      BeakerLib is a shell-level integration testing library for writing, running,
      logging, and analyzing integration and black-box tests. It is especially
      associated with Fedora/RHEL-style test automation, where shell tests need
      consistent phases, assertions, journals, and result files.
  timeline:
    - 'Pre-2017: BeakerLib is hosted on fedorahosted.org according to the current docs.'
    - '2017-03-01: beakerlib/beakerlib GitHub repository is created.'
    - >
      2021-11-09: Documentation news lists BeakerLib 1.28 with new OS-detection and
      dependency-checking functions.
    - '2022-10-20: Documentation news lists BeakerLib 1.29.3.'
    - '2026-04-07: GitHub lists beakerlib-1.33.3 as the latest release.'
  usage:
    - >
      A BeakerLib test is usually a shell script that sources beakerlib.sh, opens a
      journal, runs setup/test/cleanup phases, records assertions and command results,
      then closes the journal. The official manual centers on repeatable logging and
      result reporting rather than unit-test style in-process assertions.
    - >
      The library is used for integration and black-box tests where shell commands,
      packages, services, files, sockets, mounts, virtual X, performance metrics, reboot
      handling, and cleanup must be coordinated in a readable script.
related-packages:
  - id: brew:tmt
    reason: >
      Use tmt alongside BeakerLib to describe, discover, provision, and execute
      BeakerLib-style tests through repository-hosted fmf metadata and broader test
      workflows.
    rel: adjacent_workflow
    sources:
      - https://tmt.readthedocs.io/en/stable/overview.html
      - https://tmt.readthedocs.io/en/stable/examples.html
      - https://beakerlib.readthedocs.io/en/latest/manual.html
  - id: brew:bats-core
    reason: >
      Choose bats-core for lightweight TAP-producing tests of shell scripts and Unix
      commands when BeakerLib's system-integration helpers, phases, and XML-style
      journaling are unnecessary.
    rel: alternative
    sources:
      - https://github.com/bats-core/bats-core#readme
      - https://beakerlib.readthedocs.io/en/latest/manual.html
category: developer-tools
package-manager:
  brew: beakerlib
  dnf: beakerlib
package-manager-url: https://formulae.brew.sh/formula/beakerlib
license: GPL-2.0-only
tags:
  - cli
  - integration-testing
  - library
  - shell
  - testing
description: Shell-level integration testing library
executables:
  - beakerlib-deja-summarize
  - beakerlib-journalcmp
  - beakerlib-journalling
  - beakerlib-lsb_release
  - beakerlib-rlMemAvg
  - beakerlib-rlMemPeak
  - beakerlib-testwatcher
provenance:
  formula: beakerlib
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
