id: brew:cracklib
display-name: cracklib
homepage: https://github.com/cracklib/cracklib
repo: https://github.com/cracklib/cracklib
docs:
  - https://github.com/cracklib/cracklib#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CrackLib became package-manager infrastructure rather than an end-user novelty. In
      the input package metadata it appears across Alpine, Homebrew, Fedora-style dnf,
      MacPorts, Nix, Arch pacman, and openSUSE zypper, reflecting its long role as a
      reusable system security component.
  package-nerd-significance:
    - >
      CrackLib matters to package nerds because it is shared security plumbing:
      distributions can package the library, dictionary builder, and utilities once,
      then let login stacks, account tools, and local policy scripts reuse the same
      weak-password checks.
  project-history:
    - >
      The current upstream repository describes the project as the CrackLib library and
      dictionaries, with source code under `src` and scripts plus content for building a
      full-size password dictionary under `words`.
  related-projects:
    - >
      CrackLib is commonly adjacent to PAM and distribution password-policy tooling,
      although the upstream repository itself focuses on the library, dictionaries, and
      helper programs.
  sources:
    - https://github.com/cracklib/cracklib#readme
    - https://github.com/cracklib/cracklib/blob/main/historical-tags-before-cleanup.txt
    - https://github.com/cracklib/cracklib/releases
    - https://formulae.brew.sh/formula/cracklib
  summary:
    - >
      CrackLib is a password-checking library and dictionary toolchain used to reject
      weak passwords before they are accepted by account-management software.
  timeline:
    - >
      2019: The upstream repository recorded tag-mapping problems after a SourceForge
      migration.
    - '2024: The GitHub releases page listed the 2.10.x release line.'
  usage:
    - >
      The package ships command-line helpers such as `cracklib-check`,
      `cracklib-format`, `cracklib-packer`, `cracklib-unpacker`, `cracklib-update`, and
      `create-cracklib-dict`, alongside the library used by password policy
      integrations.
related-packages:
  - id: brew:passwdqc
    reason: >
      Choose passwdqc when you want a configurable password/passphrase policy suite with
      its own PAM module, standalone checking and generation commands, and reusable
      library rather than CrackLib's dictionary-centered checks.
    rel: alternative
    sources:
      - https://github.com/cracklib/cracklib#readme
      - https://www.openwall.com/passwdqc/
category: security
package-manager:
  apk: cracklib
  brew: cracklib
  dnf: cracklib
  macports: cracklib
  nix: cracklib
  pacman: cracklib
  zypper: cracklib
