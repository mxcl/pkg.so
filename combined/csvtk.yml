id: brew:csvtk
display-name: csvtk
homepage: https://bioinf.shenwei.me/csvtk
repo: https://github.com/shenwei356/csvtk
docs:
  - https://bioinf.shenwei.me/csvtk
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents release binaries, Pixi, conda-forge, Homebrew, Go
      install, and Arch AUR installation. Its conda and bioinformatics-facing
      documentation are significant because CSV/TSV table wrangling is common in
      reproducible analysis pipelines where package-manager availability matters.
  package-nerd-significance:
    - >
      csvtk is package-nerd-interesting because it packages a large table-toolbox
      surface into a single Go binary with no runtime dependencies, while still being
      distributed through language, OS, and scientific package channels. It overlaps
      with csvkit and xsv but leans into compressed files, bioinformatics documentation,
      and many built-in subcommands.
  project-history:
    - >
      The public release series begins with v0.1 in April 2016. The project grew from a
      compact CSV/TSV utility into a broad suite with commands for inspection,
      conversion, set operations, editing, transforms, sorting, joins, plots, and shell
      autocompletion.
  related-projects:
    - >
      The README explicitly compares csvtk with csvkit and positions CSV/TSV handling
      beside bioinformatics FASTA/Q tooling, reflecting the author's wider ecosystem of
      command-line bioinformatics utilities.
  sources:
    - https://bioinf.shenwei.me/csvtk
    - https://github.com/shenwei356/csvtk#readme
    - https://github.com/shenwei356/csvtk/blob/master/CHANGELOG.md
    - https://github.com/shenwei356/csvtk/releases
  summary:
    - >
      csvtk is a cross-platform Go toolkit for CSV and TSV processing, originally framed
      for bioinformatics and data-science table workflows. It emphasizes many
      subcommands, compressed input support, field selection by names, pipeline
      integration, and prebuilt binaries.
  timeline:
    - '2016: v0.1 preview release.'
    - '2024: v0.31.0 improved sort and join performance and added mutate3.'
    - '2025: v0.34.0 added plot bar; v0.36.0 added shuf.'
    - '2026: v0.37.0 added LZ4 read/write support; v0.38.0 refined filtering and cut behavior.'
  usage:
    - >
      csvtk is commonly used as a pipeline component for rapid table inspection and
      transformation: selecting or excluding fields by name, converting CSV to TSV,
      JSON, Markdown, reStructuredText, or XLSX, fixing malformed records, joining
      tables, summarizing columns, and plotting simple charts.
related-packages:
  - id: brew:csvkit
    reason: >
      Choose csvkit when you prefer a Python-based suite with established CSV
      conversion, inspection, cleaning, joining, and SQL-loading commands; csvtk's
      official documentation provides a feature-by-feature comparison.
    rel: alternative
    sources:
      - https://bioinf.shenwei.me/csvtk/
      - https://csvkit.readthedocs.io/
  - id: brew:miller
    reason: >
      Choose Miller when the workflow is centered on record-oriented transformations
      across CSV, TSV, and JSON using its sed/awk-like domain-specific language rather
      than csvtk's many focused subcommands.
    rel: alternative
    sources:
      - https://bioinf.shenwei.me/csvtk/
      - https://miller.readthedocs.io/
category: data
