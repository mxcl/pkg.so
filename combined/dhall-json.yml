id: brew:dhall-json
display-name: dhall-json
homepage: https://github.com/dhall-lang/dhall-haskell/tree/master/dhall-json
repo: https://github.com/dhall-lang/dhall-haskell
docs:
  - https://docs.dhall-lang.org/
  - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-json
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official Dhall documentation centers the JSON/YAML workflow in the getting-started
      tutorial and documents Homebrew installation for macOS. The Dhall-in-production
      page lists real users and integrations that generate or manage configuration,
      including Kubernetes and runtime configuration workflows where dhall-to-yaml is
      part of the bridge to existing systems.
  package-nerd-significance:
    - >
      dhall-json is package-manager important because it is the practical converter
      package people install even when they do not need Haskell libraries. It follows
      the Unix-y model of placing a strong configuration language in front of plain JSON
      and YAML consumers, making the executable package more visible than the underlying
      library for many users.
  project-history:
    - >
      The language-independent Dhall README describes Dhall as a maintainable
      configuration language, informally JSON plus functions, types, and imports, with
      termination guarantees from being non-Turing-complete. That same README says the
      easiest way to experiment is to install dhall-to-json or dhall-to-yaml, while the
      dhall-json package README identifies the package as providing both compilers.
  related-projects:
    - >
      dhall-yaml supplies the newer dhall-to-yaml-ng path, while dhall-bash, dhall-toml,
      dhall-nix, and dhall-lsp-server cover other integrations in the same dhall-haskell
      repository.
  sources:
    - https://github.com/dhall-lang/dhall-lang
    - https://docs.dhall-lang.org/tutorials/Getting-started_Generate-JSON-or-YAML.html
    - https://github.com/dhall-lang/dhall-haskell
    - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-json
    - https://docs.dhall-lang.org/discussions/Dhall-in-production.html
    - https://api.github.com/repos/dhall-lang/dhall-haskell/releases?per_page=100
  summary:
    - >
      dhall-json is the standard Dhall-to-JSON and Dhall-to-YAML command package from
      dhall-haskell. For many users it is the front door to Dhall, because it turns
      typed Dhall expressions into formats consumed by tools that know nothing about
      Dhall.
  timeline:
    - >
      2017: dhall-haskell public releases included the multi-package Dhall command-line
      toolchain.
    - >
      2026: Official Dhall tutorials still teach JSON and YAML generation as the
      getting-started path.
  usage:
    - >
      The package exposes dhall-to-json, dhall-to-yaml, and json-to-dhall. Users
      typically author Dhall records and lists, type-check and normalize them, then
      render JSON or YAML for downstream tools; the official examples show records,
      booleans, lists, and null-producing optional values becoming conventional JSON or
      YAML.
related-packages:
  - id: brew:dhall
    reason: >
      Use the core Dhall CLI to format, type-check, normalize, and freeze source
      expressions before rendering them as JSON or YAML.
    rel: adjacent_workflow
    sources:
      - https://github.com/dhall-lang/dhall-haskell
      - https://docs.dhall-lang.org/tutorials/Getting-started_Generate-JSON-or-YAML.html
  - id: brew:dhall-yaml
    reason: >
      Choose dhall-yaml for the newer YAML-focused dhall-to-yaml-ng workflow; dhall-json
      remains the package centered on JSON and its legacy YAML command.
    rel: alternative
    sources:
      - https://docs.dhall-lang.org/howtos/How-to-integrate-Dhall.html
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-yaml
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-json
  - id: brew:dhall-lsp-server
    reason: >
      Use dhall-lsp-server while editing Dhall files that will later be converted to
      JSON or YAML for editor diagnostics and language-aware assistance.
    rel: adjacent_workflow
    sources:
      - https://docs.dhall-lang.org/howtos/Text-editor-configuration.html
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-lsp-server
category: developer-tools
package-manager:
  brew: dhall-json
  dnf: dhall-json
  nix: dhall-json
  pacman: dhall-json
package-manager-url: https://formulae.brew.sh/formula/dhall-json
license: BSD-3-Clause
tags:
  - cli
  - compiler
  - configuration
  - dhall
  - json
  - yaml
description: Dhall to JSON compiler and a Dhall to YAML compiler
executables:
  - dhall-to-json
  - dhall-to-yaml
  - json-to-dhall
provenance:
  formula: dhall-json
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
