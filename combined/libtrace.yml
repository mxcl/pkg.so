id: brew:libtrace
display-name: libtrace
homepage: https://github.com/LibtraceTeam/libtrace
repo: https://github.com/LibtraceTeam/libtrace
docs:
  - https://github.com/LibtraceTeam/libtrace
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libtrace's adoption is strongest in network measurement, packet-trace analysis,
      and research tooling rather than broad desktop use. Its command-line utilities,
      including traceconvert, tracefilter, tracemerge, tracereport, tracesplit,
      tracestats, and tracesummary, made it useful as both a library and a practical
      trace-processing toolkit.
  package-nerd-significance:
    - >
      For packet-analysis package nerds, libtrace is interesting because it is not just
      another pcap wrapper: it comes from a university measurement environment, carries
      a family of trace* command-line tools, and preserves support for specialized
      capture systems alongside common packet formats.
  project-history:
    - >
      The libtrace README states that the code was originally developed by the
      University of Waikato WAND research group and was primarily designed for the
      real-time interface to the Waikato DAG Capture Point software. It later grew
      beyond that original environment to support a range of trace and interface
      formats.
    - >
      The repository records copyright for University of Waikato code through 2022 and
      for later code and documentation contributed by Shane Alcock from 2023 through
      2026. The 4.0 series introduced a parallel packet-processing API for multithreaded
      workloads.
  related-projects:
    - Waikato DAG Capture Point software is the original environment named by the README.
    - >
      libpacketdump, wandio, libwandder, and related LibtraceTeam repositories sit in
      the same packet-trace tooling ecosystem.
    - >
      pcap-oriented tools such as tcpdump and Wireshark are adjacent consumers or
      producers of traffic capture data, though libtrace focuses on programmatic trace
      processing.
  sources:
    - http://www.wand.net.nz/
    - https://github.com/LibtraceTeam/libtrace
    - https://github.com/LibtraceTeam/libtrace/releases
    - https://github.com/LibtraceTeam/libtrace/wiki/ChangeLog
  summary:
    - >
      libtrace is a C library and suite of trace tools for processing live and offline
      network packet captures across multiple trace and interface formats.
  timeline:
    - >
      2007-2022: University of Waikato copyright range shown in the README for code
      through version 4.0.20.
    - '2017: GitHub releases page lists libtrace 4.0.2 as a public 4.0-series release.'
    - >
      2023: README records Shane Alcock copyright for newer code and documentation
      beginning in 2023.
    - '2026: GitHub releases page lists Libtrace 4.0.33 on June 10, 2026.'
  usage:
    - >
      Users employ libtrace to read, filter, convert, replay, summarize, and report on
      traffic captures from offline files or live interfaces. Developers link against
      the library when they need one API over multiple capture formats and, in the 4.0
      line, when they need parallel packet processing.
related-packages:
  - id: brew:wireshark
    reason: >
      Choose Wireshark when interactive inspection and broad protocol dissection matter
      more than embedding a format-independent trace-processing API; its pcap inputs can
      participate in the same capture-file workflow.
    rel: alternative
    sources:
      - https://github.com/LibtraceTeam/libtrace/wiki
      - https://www.wireshark.org/docs/wsug_html_chunked/ChIOOpenSection
  - id: brew:tcpdump
    reason: >
      Choose tcpdump for a compact command-line capture and packet-display workflow; its
      pcap files can feed subsequent libtrace processing and analysis.
    rel: alternative
    sources:
      - https://github.com/LibtraceTeam/libtrace
      - https://www.wireshark.org/docs/wsug_html_chunked/ChIOOpenSection
category: networking
package-manager:
