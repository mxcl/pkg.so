id: brew:movgrab
display-name: Movgrab
homepage: https://github.com/ColumPaget/Movgrab
repo: https://github.com/ColumPaget/Movgrab
docs:
  - https://github.com/ColumPaget/Movgrab/tree/master/Docs
  - https://github.com/ColumPaget/Movgrab#readme
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/movgrab
    - https://github.com/ColumPaget/Movgrab
    - https://github.com/ColumPaget/Movgrab/blob/master/INSTALL
  summary:
    - >
      Movgrab is Colum Paget's C command-line downloader for web video and streaming
      media. The repository README describes it as a downloader for sites such as
      YouTube, BitChute, and Euronews, and also shows a radio-streaming use case where
      Movgrab writes a playlist or stream to stdout for a player such as mpg123. The
      same README credits Movgrab and libUseful to Colum Paget in 2009 and places the
      project under the GPL.
  usage:
    - >
      The tool's practical niche is the older Unix style of media acquisition: a single
      command reads a video-page URL, chooses a downloadable stream, and saves or pipes
      the result. Its INSTALL notes show the expected autotools workflow and build
      switches for HTTPS downloads and large-file support, both important for a video
      downloader. Compared with larger and more actively maintained video downloaders,
      Movgrab is a smaller, C-based utility with limited visible adoption, so its
      history is best treated as a niche downloader from an earlier wave of command-line
      web-video tools.
related-packages:
  - id: brew:yt-dlp
    reason: >
      Choose yt-dlp for a substantially broader, actively documented extractor ecosystem
      and extensive format controls; Movgrab remains a smaller native downloader with an
      older Unix-style interface.
    rel: alternative
    sources:
      - https://github.com/ColumPaget/Movgrab
      - https://github.com/yt-dlp/yt-dlp#readme
  - id: brew:mpg123
    reason: >
      Movgrab's official README demonstrates piping an internet-radio stream directly
      into mpg123 for playback.
    rel: adjacent_workflow
    sources:
      - https://github.com/ColumPaget/Movgrab#readme
      - https://www.mpg123.de/
category: media
package-manager:
  brew: movgrab
package-manager-url: https://formulae.brew.sh/formula/movgrab
license: GPL-3.0-or-later
tags:
