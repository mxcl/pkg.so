id: brew:bee
display-name: Bee
homepage: https://github.com/bluesoft/bee
repo: https://github.com/bluesoft/bee
docs:
  - https://bluesoft.github.io/bee
  - https://github.com/bluesoft/bee#readme
config-file-location:
  unix: bee.properties
credentials-file-location:
  unix: bee.properties
history:
  adoption-history:
    - >
      The supplied package metadata lists Homebrew and Nix packaging. The README also
      calls out Homebrew installation directly, suggesting macOS developer usage was
      part of the intended distribution story.
  package-nerd-significance:
    - >
      Bee is a smaller package-nerd entry: it represents the long-running
      database-migration CLI niche where package managers preserve tools used by
      specific teams and legacy deployment workflows, even when the wider ecosystem has
      larger names.
  project-history:
    - >
      The Bee GitHub repository was created in June 2011. Its README and project site
      describe it plainly as a tool for managing database changes, with documentation
      hosted on GitHub Pages.
    - >
      Release history shows an established 1.x line: older GitHub releases are visible
      from 2013, and current releases continued through 2026.
  related-projects:
    - >
      Related projects live in the database migration and schema-change-management
      category, such as JDBC-based migration tools.
  sources:
    - https://api.github.com/repos/bluesoft/bee
    - https://bluesoft.github.io/bee
    - https://github.com/bluesoft/bee#readme
    - https://github.com/bluesoft/bee/releases
    - source_facts.package-manager
  summary:
    - >
      Bee is a command-line database change manager from Bluesoft, used to manage
      database schema changes through project-local configuration.
  timeline:
    - '2011: GitHub repository created.'
    - '2013: 1.x GitHub releases visible.'
    - '2026: 1.115 release published.'
  usage:
    - >
      Bee is used from the command line to apply and manage database changes, with
      project settings stored in bee.properties.
related-packages:
  - id: brew:flyway
    reason: >
      Choose Flyway for a broadly supported migration-first workflow with versioned and
      repeatable SQL or Java migrations; choose Bee when its project-local schema
      generation, validation, and core-data facilities fit the existing project.
    rel: alternative
    sources:
      - https://bluesoft.github.io/bee/
      - https://documentation.red-gate.com/fd/migrations-271585107.html
category: data
package-manager:
  brew: bee
  nix: bee
package-manager-url: https://formulae.brew.sh/formula/bee
license: MPL-1.1
tags:
  - cli
  - database
  - dbchange
  - jdbc
  - migration
  - schema
description: Tool for managing database changes
executables:
  - bee
provenance:
  formula: bee
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
