id: brew:gerbv
display-name: Gerbv
homepage: https://gerbv.github.io/
repo: https://github.com/gerbv/gerbv
docs:
  - https://gerbv.github.io/
  - https://gerbv.github.io/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gerbv became useful in the open hardware and EDA ecosystem because Gerber and
      Excellon files are common manufacturing handoff formats for printed circuit
      boards. Its availability across Unix-like package managers made it a convenient
      inspection tool for designers and build pipelines.
  package-nerd-significance:
    - >
      For package-manager users, Gerbv is a compact EDA utility that solves a concrete
      manufacturing-file inspection problem without pulling in a full PCB design suite.
      Its library split also matters to distro maintainers because applications can
      depend on libgerbv for Gerber handling.
  project-history:
    - >
      Gerbv was originally developed as part of the gEDA Project, an umbrella effort for
      free electronic-design software. Its README identifies the project as one of the
      utilities affiliated with gEDA and lists early copyright years of 2001 and 2002
      for Stefan Petersen and other original authors.
    - >
      A later GitHub organization describes itself as a friendly maintained fork created
      after SourceForge development stalled with patches accumulating in trackers and
      mailing lists. That fork focuses mainly on bug fixes while preserving
      communication paths with the original gerbv and gEDA mailing lists.
  related-projects:
    - gEDA, libgerbv, Gerber RS-274X, Excellon
  sources:
    - https://api.github.com/repos/gerbv/gerbv
    - https://gerbv.github.io/
    - https://gerbv.github.io/doc/
    - https://github.com/gerbv/gerbv
    - https://raw.githubusercontent.com/gerbv/gerbv/main/README.md
  summary:
    - >
      Gerbv is a free/open-source viewer for Gerber RS-274X PCB artwork files, Excellon
      drill files, and CSV pick-and-place files. It also provides libgerbv, a library
      for parsing, editing, rendering, and exporting Gerber data in other programs.
  timeline:
    - >
      2001-2002: Early Gerbv copyright years are listed for Stefan Petersen and original
      authors.
    - 'gEDA era: Gerbv was developed as one of the gEDA Project utilities.'
    - '2021: The maintained GitHub fork repository was opened.'
  usage:
    - >
      Practitioners use Gerbv to open PCB fabrication outputs, inspect layers, drill
      files, and pick-and-place data, and render or export views for review. Developers
      use libgerbv when they need Gerber parsing, rendering, or export behavior inside
      another application.
related-packages:
  - id: brew:pcb2gcode
    reason: >
      Use pcb2gcode after inspecting Gerber and Excellon outputs in Gerbv when the next
      step is generating isolation-routing, drilling, and board-cutting G-code for CNC
      fabrication.
    rel: adjacent_workflow
    sources:
      - https://gerbv.github.io/
      - https://github.com/pcb2gcode/pcb2gcode#readme
