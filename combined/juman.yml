id: brew:juman
display-name: JUMAN
homepage: https://nlp.ist.i.kyoto-u.ac.jp/index.php?JUMAN
repo: https://github.com/ku-nlp/juman
docs:
  - https://github.com/ku-nlp/juman#readme
  - https://github.com/ku-nlp/juman/tree/master/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      JUMAN's adoption is strongest in Japanese NLP and Kyoto University tooling. It
      sits alongside KNP and Juman++ on the Kyoto lab NLP resources page, and its
      package availability in Homebrew, Debian, MacPorts, and Ubuntu reflects use by
      researchers and developers who need a stable Japanese morphological-analysis
      command.
  package-nerd-significance:
    - >
      JUMAN is a classic example of an academic NLP tool that package managers preserve
      because the command-line binary, dictionary format, and downstream expectations
      matter as much as the code.
    - >
      Its significance is also historical: Juman++ and KNP are easier to understand as
      descendants or companions of the JUMAN/Jumandic ecosystem.
  project-history:
    - >
      Kyoto University's Language Media Processing Lab presents JUMAN as a
      user-extensible morphological analyzer for Japanese and links an English
      translation of the user guide. That guide identifies the JUMAN system version 0.5
      authors as Yuji Matsumoto, Sadao Kurohashi, Yutaka Nyoki, Hitoshi Shinho, and
      Makoto Nagao.
    - >
      The GitHub repository keeps the traditional C distribution shape: a JUMAN library,
      command sources, dictionary conversion tools, connectivity-rule tools, Perl
      module, dictionaries, and manual documents.
  related-projects:
    - >
      JUMAN is closely related to Juman++, KNP, PyKNP, and the broader Kyoto University
      NLP resource family.
    - >
      Juman++ uses the Jumandic ecosystem and is presented by Kyoto University as the
      newer neural-network-based analyzer.
  sources:
    - https://github.com/ku-nlp/juman
    - https://nlp.ist.i.kyoto-u.ac.jp/EN/index.php?JUMAN
    - https://nlp.ist.i.kyoto-u.ac.jp/nl-resource/juman/juman-eng.html
  summary:
    - >
      JUMAN is Kyoto University's user-extensible Japanese morphological analyzer. It
      tokenizes Japanese text and assigns morphological information such as part of
      speech, subpart, conjugation, reading, and dictionary meaning.
  timeline:
    - >
      Version 0.5: The English user's guide documented the JUMAN grammar and dictionary
      system.
    - "Version 7.01: Kyoto University's JUMAN page listed a source download for JUMAN Ver.7.01."
    - '2010s: The ku-nlp GitHub repository made the source layout available through GitHub.'
  usage:
    - >
      Users run the `juman` command over Japanese text and receive morpheme records. The
      older guide explains the grammar and dictionary model, including user
      dictionaries, grammar dictionaries, morpheme dictionaries, connection rules, and
      the `JUMANPATH` search path for dictionaries.
    - >
      JUMAN is commonly used as the morphological-analysis stage before higher-level
      Japanese NLP tools, especially in workflows connected to Kyoto University
      resources.
related-packages:
  - id: brew:jumanpp
    reason: >
      Juman++ is the stronger alternative when you want Kyoto University's newer
      neural-scored morphological analyzer with substantially improved analysis speed,
      while JUMAN remains useful for established legacy pipelines.
    rel: alternative
    sources:
      - https://github.com/ku-nlp/juman
      - https://github.com/ku-nlp/jumanpp
