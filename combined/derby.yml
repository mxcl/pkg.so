id: brew:derby
display-name: Apache Derby
homepage: https://db.apache.org/derby/
repo: https://svn.apache.org/repos/asf/db/derby/code/trunk
docs:
  - https://db.apache.org/derby/docs
config-file-location:
  unix: ${derby.system.home}/derby.properties
credentials-file-location: null
history:
  adoption-history:
    - >
      Derby was adopted in Java and JDBC workflows because it could run embedded in an
      application, while still offering a network server mode when a more familiar
      client/server deployment was needed. Its release history shows steady maintenance
      from the first incubating 10.0 release in 2004 through the 10.17.1.0 release
      announced in November 2023.
  package-nerd-significance:
    - >
      Derby matters in package-manager history as a compact pure-Java SQL engine: one
      install gives both a JDBC library and small administrative tools, making it a
      useful test database, embedded database, and compatibility target for Java
      packaging ecosystems.
  project-history:
    - >
      Derby entered Apache through the Incubator in 2004, when the Apache DB PMC voted
      to sponsor the project. The project graduated to an Apache DB subproject in July
      2005, then continued releasing 10.x versions for nearly two decades before the
      developers voted on 2025-10-10 to retire Derby into a read-only state.
  related-projects:
    - >
      Related Apache DB and Java database projects include Apache Torque, Apache JDO,
      and other JVM-oriented persistence tools; Derby's closest user-facing peers are
      embedded SQL databases and JDBC test databases.
  sources:
    - https://db.apache.org/derby/
    - https://db.apache.org/derby/derby_downloads.html
    - https://db.apache.org/derby/dev/derby_source.html
    - https://db.apache.org/derby/docs
  summary:
    - >
      Apache Derby is an Apache DB relational database implemented entirely in Java. It
      is packaged as an embedded JDBC engine and as a client/server database with the
      Derby Network Server, which made it useful to Java developers who wanted a small
      SQL database without operating a separate database service.
  timeline:
    - '2004: Apache DB PMC voted to sponsor Derby.'
    - '2004: Derby 10.0.2.1 Incubator Release was published.'
    - '2005: Derby graduated to an Apache DB subproject.'
    - '2023: Derby 10.17.1.0 was announced.'
    - '2025: Derby developers voted to retire the project into a read-only state.'
  usage:
    - >
      Package users usually encounter Derby through command-line tools such as ij,
      dblook, sysinfo, and NetworkServerControl, plus scripts for setting embedded,
      client, or server classpaths. Its configuration centers on Derby system
      properties, including the derby.properties file under derby.system.home.
related-packages:
  - id: brew:h2
    reason: >
      Choose H2 for a similarly small pure-Java JDBC database with embedded and server
      modes when you need an actively developed engine, in-memory databases, or a
      browser console after Derby's retirement.
    rel: alternative
    sources:
      - https://db.apache.org/derby/
      - https://h2database.com/
      - https://h2database.com/html/quickstart.html
category: data
package-manager:
  brew: derby
  debian: derby-doc
  macports: derby
  ubuntu: derby-doc
  zypper: sysinfo
package-manager-url: https://formulae.brew.sh/formula/derby
license: Apache-2.0
tags:
  - cli
  - database
  - embedded-database
  - java
  - jvm
  - relational-database
description: Apache Derby is an embedded relational database running on JVM
executables:
  - NetworkServerControl
  - dblook
  - ij
  - setEmbeddedCP
  - setNetworkClientCP
  - setNetworkServerCP
  - startNetworkServer
  - stopNetworkServer
  - sysinfo
provenance:
  formula: derby
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
