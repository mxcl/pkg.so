id: brew:nedit
display-name: NEdit
homepage: https://sourceforge.net/projects/nedit/
repo: https://sourceforge.net/p/nedit/git
docs:
  - https://nedit.sourceforge.io/
  - https://sourceforge.net/projects/nedit
config-file-location:
  unix:
    - $NEDIT_HOME/.nedit
    - ~/.nedit
    - ~/.Xresources
    - ~/.Xdefaults
credentials-file-location: null
history:
  adoption-history:
    - >
      NEdit was adopted by Unix workstation users who wanted a GUI editor without moving
      into Emacs, vi, or a heavyweight IDE. SourceForge user reviews explicitly describe
      long-term use dating back to Solaris and 1990s Linux workflows, and Debian's
      de-facto packaging role mattered enough that upstream treated Debian's CVS-derived
      package as the practical 5.6 baseline.
    - >
      Homebrew's formula page listed the package with X11 and OpenMotif dependencies and
      showed 337 installs over 365 days, 140 over 90 days, and 35 over 30 days when
      checked on 2026-07-01. That small but persistent usage fits a legacy GUI tool kept
      alive by muscle memory, remote X11 habits, and users who prefer its rectangular
      selection, macro, and syntax-highlighting behavior.
  package-nerd-significance:
    - >
      NEdit is significant as living Unix archaeology: it is a packaged survivor of the
      Motif workstation era, still installable through modern package managers. Its
      package metadata also illustrates how long-lived desktop tools depend on distro
      maintainers, compatibility libraries, and small upstream maintenance bursts rather
      than continuous feature development.
  project-history:
    - >
      The NEdit codebase predates its SourceForge era. The project is widely documented
      as originating at Fermilab, with Mark Edel among the original authors, and the
      maintained source tree's README lists many long-time contributors. The SourceForge
      project was registered on 2000-09-07, and the README says NEdit became freely
      distributable under the GPL as of version 5.1 with a Motif/Open Motif linking
      exception.
    - >
      NEdit's later history is mostly maintenance and preservation. SourceForge news for
      2014-12-06 announced the long-delayed 5.6 release after Debian had effectively
      been shipping CVS-derived code for some time. The RaumZeit GitHub mirror
      identifies version 5.7 as January 2017, while Homebrew packaged version 5.8 when
      checked on 2026-07-01.
  related-projects:
    - OpenMotif
    - LessTif
    - XNEdit
    - Debian nedit package
  sources:
    - https://formulae.brew.sh/formula/nedit
    - https://github.com/RaumZeit/nedit
    - https://sourceforge.net/p/nedit/news/2014/12/56-for-real/
    - https://sourceforge.net/projects/nedit/
  summary:
    - >
      NEdit is a Motif/X11 graphical text editor with a long Unix workstation lineage.
      Its package identity is classic and conservative: a fast GUI editor for
      programmers and plain-text users, with syntax highlighting, a macro language, and
      keyboard/mouse behavior familiar to people coming from Macintosh or Windows
      editors.
  timeline:
    - '1990s: NEdit established itself as a Motif/X11 GUI editor for Unix workstations.'
    - '2000-09-07: SourceForge project registered.'
    - >
      2014-12-06: SourceForge announced version 5.6 after Debian had already carried
      similar CVS-derived code.
    - '2017-01: GitHub mirror README identifies NEdit version 5.7.'
    - '2026-07-01: Homebrew formula stable version observed as 5.8.'
  usage:
    - >
      Package users install it when they have X11 support available and want a mature
      GUI editor launched as `nedit`, plus the client helper historically packaged as
      `nc` or `ncl` depending on distribution. It is used for programming, config
      editing, data-file cleanup, and old-school X11 desktop workflows where a fast
      Motif editor is preferable to a terminal editor or full IDE.
    - >
      The practical caveat is that NEdit remains tied to Motif/X11 assumptions. That
      makes it valuable to package nerds as preserved workstation software, but also
      explains why modern forks such as XNEdit focused on Unicode and rendering
      improvements.
related-packages: []
