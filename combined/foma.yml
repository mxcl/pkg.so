id: brew:foma
display-name: foma
homepage: https://github.com/mhulden/foma
repo: https://github.com/mhulden/foma
docs:
  - https://github.com/mhulden/foma#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The Google Code archive advertised pre-built binaries for Windows, Linux, and OS X
      and linked tutorial material from LREC 2010 and FSMNLP 2012, showing use in
      academic finite-state morphology and spelling-correction communities before the
      project moved fully to modern source hosting.
    - >
      The current repository is lean but still maintained as buildable source, with
      CMake instructions and a WebAssembly build path that exposes a browser demo for
      testing foma regular expressions.
  package-nerd-significance:
    - >
      foma matters to package maintainers because it is a compact, mostly C-based
      implementation of a specialized NLP workflow that otherwise often depends on
      proprietary or research-only tooling. Its xfst compatibility, lexc-oriented usage,
      command-line utilities, and C library make it a small but culturally important
      finite-state package.
  project-history:
    - >
      The project was originally hosted on Google Code as `code.google.com/p/foma`,
      where its archive describes it as a finite-state compiler and C library. The
      archived project page records a 2015 Apache 2.0 license change and a 0.9.18
      release, and the current GitHub repository identifies itself as an export from
      that Google Code project.
    - >
      foma deliberately followed the Xerox xfst style: the archived project description
      says its interface is similar to xfst and that many xfst grammars compile without
      changes. This made it useful to linguists and NLP engineers who wanted an open
      implementation of familiar finite-state workflows.
  related-projects:
    - >
      The project explicitly relates itself to Xerox xfst and lexc syntax, and supports
      import and export with Xerox, AT&T, and OpenFST-style tooling.
  sources:
    - https://github.com/mhulden/foma
    - https://raw.githubusercontent.com/mhulden/foma/master/README.md
    - https://storage.googleapis.com/google-code-archive/v2/code.google.com/foma/project.json
  summary:
    - >
      foma is a finite-state compiler, programming language, command-line toolset, and C
      library for constructing finite-state automata and transducers, especially for
      natural language processing tasks such as morphological analysis.
  timeline:
    - '2009: The foma project citation describes `Foma: a finite-state compiler and library`.'
    - '2011: The Google Code archive records creation of the `foma` project.'
    - '2015: The archived project news records foma 0.9.18 and a license change to Apache 2.0.'
    - >
      2020s: The GitHub README documents CMake builds and a WebAssembly demo for
      browser-based regular-expression testing.
  usage:
    - >
      Users run `foma` to compile finite-state descriptions, use `flookup` to apply
      compiled automata with lookup strategies, and link against the C API when
      finite-state operations need to be embedded in other tools.
related-packages:
  - id: brew:openfst
    reason: >
      OpenFst is the stronger alternative when weighted transducers, scalable C++
      algorithms, or probabilistic speech and language models matter, while foma is
      oriented toward Xerox-compatible grammar syntax and unweighted morphology
      workflows.
    rel: alternative
    sources:
      - https://fomafst.github.io/
      - https://github.com/google-research/openfst
      - https://www.openfst.org/doxygen/fst/html/index.html
category: developer-tools
