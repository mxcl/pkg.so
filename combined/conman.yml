id: brew:conman
display-name: ConMan
homepage: https://github.com/dun/conman
repo: https://github.com/dun/conman
docs:
  - https://github.com/dun/conman#readme
config-file-location:
  unix: /etc/conman.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged across traditional Unix distributions and package managers
      in the supplied facts, including Debian, Ubuntu, Fedora/dnf, openSUSE/zypper, Nix,
      and Homebrew. Official release notes also list build and RPM testing across
      CentOS, Debian, Fedora, FreeBSD, NetBSD, OpenBSD, Ubuntu, AlmaLinux, Arch,
      Raspbian, and other systems.
  package-nerd-significance:
    - >
      For package nerds, ConMan is important as old-school systems software with real
      daemon packaging concerns: init/systemd integration, sysconfdir behavior,
      pidfiles, runstatedir, FreeIPMI optional support, tcp-wrappers history, RPM
      verification, and portability across many Unix variants.
  project-history:
    - >
      The official README describes ConMan as a serial console management program with
      symbolic console names, logging, read-only and read-write sessions, shared
      sessions, privilege stealing/sharing, broadcast input, and parallel Expect-script
      execution. Its NEWS file traces active development back to at least the 0.1.8
      release in 2002.
    - >
      ConMan's history reflects classic cluster and lab administration needs: log every
      console, multiplex users, support terminal servers, then add external process
      drivers, Unix-domain sockets, IPMI Serial-over-LAN through FreeIPMI, systemd
      packaging, scalability fixes, and broad Unix portability testing.
  related-projects:
    - >
      Official sources tie ConMan to FreeIPMI, Expect, telnet terminal servers, IPMI
      Serial-over-LAN, Unix-domain sockets, systemd, sysvinit, RPM packaging, and Unix
      console administration.
  sources:
    - https://github.com/dun/conman#readme
    - https://github.com/dun/conman/blob/master/NEWS
    - https://github.com/dun/conman/releases
    - https://github.com/dun/conman/releases/tag/conman-0.2.4
    - https://github.com/dun/conman/releases/tag/conman-0.2.8
    - https://github.com/dun/conman/releases/tag/conman-0.3.1
  summary:
    - >
      ConMan, the Console Manager, is a long-lived Unix console-management daemon and
      client suite for serial consoles, terminal servers, IPMI Serial-over-LAN, external
      processes, and Unix-domain sockets. It is aimed at administrators who need many
      console devices and simultaneous users.
  timeline:
    - '2002: NEWS records conman-0.1.8 with global log and server logfile/syslog directives.'
    - >
      2007: conman-0.2.0 added external-process-driven consoles and scripts for
      Cyclades, IBM BladeCenter, IPMI SOL, and SSH.
    - '2008: conman-0.2.2 added Unix-domain socket consoles and inotify detection.'
    - '2009: conman-0.2.4 added FreeIPMI support.'
    - >
      2016: conman-0.2.8 moved the homepage, changed RPM packaging toward systemd, added
      daemon nofile configuration, and improved scalability.
    - >
      2022: conman-0.3.1 refreshed autotools packaging, added systemd/sysvinit configure
      options, added runstatedir support, and verified RPM source files.
  usage:
    - >
      Typical usage is to run conmand with /etc/conman.conf defining console devices and
      logging behavior, then connect with conman or conmen for interactive, monitoring,
      or broadcast sessions. The package is relevant to serial-console fleets, remote
      management networks, and older hardware rooms where SSH alone is not enough.
related-packages:
  - id: brew:conserver
    reason: >
      Choose Conserver for its established client/server access-control model and shared
      serial-console logging; choose ConMan when FreeIPMI Serial-over-LAN and parallel
      Expect-script execution are important.
    rel: alternative
    sources:
      - https://github.com/dun/conman#readme
      - https://conserver.com/docs/conserver.man.html
  - id: brew:freeipmi
    reason: ConMan directly uses FreeIPMI's libipmiconsole to manage IPMI Serial-over-LAN consoles.
    rel: adjacent_workflow
    sources:
      - https://github.com/dun/conman#readme
      - https://www.gnu.org/software/freeipmi/freeipmi-faq.html
  - id: brew:expect
    reason: >
      ConMan can drive external Expect processes and execute Expect scripts across
      multiple consoles in parallel.
    rel: adjacent_workflow
    sources:
      - https://github.com/dun/conman#readme
      - https://core.tcl-lang.org/expect/home
category: system
package-manager:
  brew: conman
  debian: conman
  dnf: conman
  nix: conman
  ubuntu: conman
  zypper: conman
package-manager-url: https://formulae.brew.sh/formula/conman
license: GPL-3.0-or-later
tags:
  - cli
  - console-management
  - logging
  - serial-console
  - system-administration
  - terminal
description: Serial console management program supporting a large number of devices
executables:
  - conman
  - conmand
  - conmen
provenance:
  formula: conman
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
