id: brew:dwdiff
display-name: dwdiff
homepage: https://os.ghalkes.nl/dwdiff.html
repo: null
docs:
  - https://os.ghalkes.nl/dwdiff.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official download section says several Linux distributions and BSDs shipped
      packages or ports, naming Fedora, FreeBSD, and OpenBSD, with additional Unix
      packaging through Sunfreeware, MacPorts, Homebrew, Slackbuilds.org, Slacky.eu, and
      OpenPKG. The batch input adds Debian, Ubuntu, Nix, MacPorts, and Homebrew entries.
  package-nerd-significance:
    - >
      dwdiff matters because it is a classic small Unix text-processing tool that fills
      the gap between line-oriented diff and heavier document comparison. Its
      compatibility with wdiff plus delimiter controls made it packageable as a drop-in
      word-diff option across many Unix packaging systems.
  project-history:
    - >
      The official copyright notice covers 2006-2018 and 2020, and the official
      distribution directory carries 1.0 release artifacts. Later 2.1.x news entries
      show maintenance releases in 2018 and 2020 for ICU/pkg-config and compiler
      compatibility rather than feature expansion.
  related-projects:
    - >
      The official page explicitly compares dwdiff with wdiff. In the broader CLI
      ecosystem it complements diff, git diff --word-diff, colordiff, and
      document-oriented compare tools.
  sources:
    - https://os.ghalkes.nl/dwdiff.html
    - https://os.ghalkes.nl/dist/
  summary:
    - >
      dwdiff is G. P. Halkes' word-level diff utility. The official page positions it
      against wdiff: mostly command-line compatible, but with user-defined whitespace
      and delimiter handling so punctuation or other single characters can be treated as
      words.
  timeline:
    - >
      2006: Official copyright range begins and 1.0 release artifacts are present in the
      official distribution directory.
    - '2018: Version 2.1.2 updates ICU handling and replaces icu-config with pkg-config.'
    - '2020: Versions 2.1.3 and 2.1.4 fix GCC 10 and C99 compiler build issues.'
  usage:
    - >
      dwdiff compares text at word granularity and prints the new text annotated with
      insertion and deletion markers by default. It is useful when line diffs are too
      coarse, especially prose, documentation, localization, and wrapped text where
      changed words matter more than changed lines.
related-packages:
  - id: brew:wdiff
    reason: >
      Choose GNU wdiff for the established GNU word-difference interface; choose dwdiff
      when configurable whitespace and delimiter characters are important.
    rel: alternative
    sources:
      - https://os.ghalkes.nl/dwdiff.html
      - https://www.gnu.org/software/wdiff/manual/
category: developer-tools
package-manager:
  brew: dwdiff
  debian: dwdiff
  macports: dwdiff
