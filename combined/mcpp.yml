id: brew:mcpp
display-name: mcpp
homepage: https://mcpp.sourceforge.net/
repo: https://sourceforge.net/p/mcpp/code
docs:
  - https://mcpp.sourceforge.net/
  - https://mcpp.sourceforge.net/download.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      mcpp was packaged both as upstream binary archives and by operating-system
      distributions. The official download page documents FreeBSD, Linux RPM and deb,
      Mac OS X, and Windows packages, and separately notes distribution packages for
      Fedora, Debian, Ubuntu, OpenSUSE, Gentoo, Slackware, and MacPorts.
    - >
      Distribution packaging split the executable, shared library, development files,
      and documentation on Fedora and Debian-family systems, which made mcpp useful as a
      reusable compiler-toolchain component rather than only as a standalone command.
  package-nerd-significance:
    - >
      mcpp matters to package nerds because it is a small compiler component that was
      packaged independently of a full compiler. Its history includes classic Unix
      packaging patterns: source tarballs, RPMs, debs, ports, a shared library package,
      development headers, and documentation packages.
    - >
      It is also a useful example of an important package whose official presence is an
      old project homepage and release archive rather than a modern canonical Git
      repository.
  project-history:
    - >
      The project was created to address portability and conformance problems in
      traditional compiler-bundled preprocessors. Its official homepage says mcpp was
      selected for Japan IPA's Exploratory Software Projects in both 2002 and 2003.
    - >
      The public SourceForge-hosted project surface dates from April 2006, and the
      official homepage lists V.2.7.2 from November 2008 as the latest release.
  related-projects:
    - >
      mcpp is related to GCC, Visual C++, C and C++ compiler toolchains, and
      distribution packages such as `mcpp`, `libmcpp`, `libmcpp-dev`, and `mcpp-doc`.
  sources:
    - https://mcpp.sourceforge.net/
    - https://mcpp.sourceforge.net/download.html
  summary:
    - >
      mcpp is a portable C/C++ preprocessor and validation suite by Kiyoshi Matsui. The
      official site describes it as an independent preprocessor that implements C90,
      C99, and C++98 preprocessing behavior, provides diagnostics, and can be built as a
      compiler-specific preprocessor, a compiler-independent command, or a subroutine
      library.
  timeline:
    - '2002: Selected for IPA Exploratory Software Projects.'
    - '2003: Selected again for IPA Exploratory Software Projects.'
    - '2006-04: Project located on SourceForge.'
    - '2008-11: V.2.7.2 released.'
  usage:
    - >
      The command-line program is installed as `mcpp`. The official download page points
      users to the bundled manual and explains that source archives include source code,
      a validation suite, and English and Japanese documentation.
    - >
      Typical package-manager usage is installing a small preprocessor tool or library
      for C/C++ toolchains, conformance testing, macro debugging, or historical build
      compatibility.
related-packages:
  - id: brew:gcc
    reason: >
      Choose GCC when you need a maintained C preprocessor integrated with a complete
      compiler toolchain; choose mcpp for an independent preprocessor with a dedicated
      conformance suite and portability diagnostics.
    rel: alternative
    sources:
      - https://mcpp.sourceforge.net/
      - https://gcc.gnu.org/onlinedocs/cpp/
category: developer-tools
package-manager:
  brew: mcpp
  debian: libmcpp-dev
  macports: mcpp
  nix: mcpp
  pacman: mcpp
  ubuntu: libmcpp-dev
  zypper: libmcpp0
package-manager-url: https://formulae.brew.sh/formula/mcpp
license: BSD-2-Clause
