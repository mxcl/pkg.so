id: brew:microsocks
display-name: MicroSocks
homepage: https://github.com/rofl0r/microsocks
repo: https://github.com/rofl0r/microsocks
docs:
  - https://github.com/rofl0r/microsocks#readme
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/microsocks
    - https://github.com/rofl0r/microsocks
  summary:
    - >
      MicroSocks is a small C SOCKS5 server maintained in rofl0r's GitHub repository.
      Its README presents it as the successor to rocksocks5, rebuilt with different
      priorities: use standard libc where possible, remove artificial limits, favor
      small readable source over extreme binary-size minimization, and support IPv4,
      DNS, and IPv6 through common code paths.
  usage:
    - >
      The project occupies the lightweight proxy-server niche rather than the full
      proxy-suite niche. A typical use is running a SOCKS5 service on a remote host when
      SSH tunneling is not suitable; it can start with no configuration file, listens on
      port 1080 by default, and exposes command-line options for listen address, port,
      username and password, bind address, whitelist, quiet logging, and one-time
      authentication. Its implementation model is deliberately simple: a low-stack
      thread per client and graceful refusal of new connections under resource
      exhaustion. In package managers it appears as a tiny standalone executable for
      users who need a SOCKS5 endpoint without deploying a larger daemon.
related-packages:
  - id: brew:dante
    reason: >
      Dante is a fuller SOCKS server and client suite; choose it instead when you need
      SOCKS4, UDP association, detailed access rules, resource controls, or server
      chaining.
    rel: alternative
    sources:
      - https://github.com/rofl0r/microsocks#readme
      - https://inet.no/dante/
      - https://inet.no/dante/doc/latest/config/server.html
category: networking
package-manager:
  apk: microsocks
  brew: microsocks
  debian: microsocks
  nix: microsocks
  pacman: microsocks
  ubuntu: microsocks
package-manager-url: https://formulae.brew.sh/formula/microsocks
license: MIT
tags:
  - cli
  - lightweight
  - proxy
  - server
  - socks5
description: Tiny, portable SOCKS5 server with very moderate resource usage
executables:
  - microsocks
provenance:
  formula: microsocks
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
