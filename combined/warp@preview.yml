id: cask:warp@preview
display-name: Warp Preview
homepage: https://www.warp.dev/terminal
repo: https://github.com/warpdotdev/warp
docs:
  - https://docs.warp.dev/
  - https://docs.warp.dev/getting-started/quickstart/installation-and-setup
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Warp Preview is available through a separate Homebrew cask and official Preview
      downloads, allowing package users to install it independently from the stable
      application.
    - >
      Official installation documentation offers Preview across supported platforms and
      architectures for users who want early access to experimental features.
  package-nerd-significance:
    - >
      The separate Preview cask gives package-manager users an explicit, independently
      named early-access channel instead of requiring manual replacement of the stable
      build.
    - >
      Preview is useful for testing forthcoming Warp behavior, but its experimental
      nature makes the stable cask more appropriate for users prioritizing
      predictability.
  project-history:
    - >
      Warp Preview developed as Warp's early-access distribution channel for features
      that have not yet reached the stable release.
    - >
      It follows the history of the main Warp client: public beta in 2022, expansion
      into an Agentic Development Environment in 2025, and open-sourcing of the client
      in 2026.
  related-projects:
    - Warp is the stable release channel.
    - Oz and its Preview CLI provide Warp's command-line and cloud-agent runtime.
    - The official `warpdotdev/warp` repository contains the shared client source.
  sources:
    - https://docs.warp.dev/getting-started/quickstart/installation-and-setup
    - https://github.com/warpdotdev/homebrew-warp
    - https://github.com/warpdotdev/warp
    - https://www.warp.dev/blog/reimagining-coding-agentic-development-environment
  summary:
    - >
      Warp Preview is the early-access build of Warp, the Rust-based terminal and
      Agentic Development Environment. It exposes experimental features ahead of the
      stable release through a separately installable application and package channel.
  timeline:
    - '2022: Warp launched its public beta.'
    - '2025: Warp 2.0 repositioned the product as an Agentic Development Environment.'
    - "2026: Warp's client became open source."
    - '2026: Preview remains a separately documented experimental release channel.'
  usage:
    - >
      Developers install Warp Preview to evaluate upcoming terminal, editor, and agent
      features before they enter the stable channel.
    - >
      On macOS, Preview installs as `WarpPreview.app` and can coexist as a distinctly
      named package. Preview builds may be less stable than regular Warp releases.
category: developer-tools
package-manager:
  brew-cask: warp@preview
package-manager-url: https://formulae.brew.sh/cask/warp@preview
tags:
  - coding-agent
  - developer-tools
  - early-access
  - experimental
  - preview-release
  - rust
  - terminal-emulator
description: Rust-based terminal
applications:
  - WarpPreview.app
provenance:
  cask: warp@preview
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
