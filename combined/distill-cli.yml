id: brew:distill-cli
display-name: distill-cli
homepage: https://www.allthingsdistributed.com/2024/06/introducing-distill-cli.html
repo: https://github.com/awslabs/distill-cli
docs:
  - https://github.com/awslabs/distill-cli#readme
config-file-location:
  unix:
    - config.toml
    - ~/.aws/config
credentials-file-location:
  unix: ~/.aws/credentials
history:
  adoption-history:
    - >
      The official launch post positioned the tool as a small, extensible command-line
      utility for builders who wanted to experiment with Rust and AWS generative-AI
      services. Homebrew packaging gave it the familiar install path used by macOS and
      Linux CLI users, but its official source material still describes a young
      proof-of-concept rather than a long-established ecosystem tool.
  package-nerd-significance:
    - >
      For package-history purposes, distill-cli is notable as an example of cloud AI
      services being wrapped in a single-purpose native CLI. Its packaging story is less
      about broad dependency reuse and more about making an AWS demo workflow feel like
      a normal terminal tool.
  project-history:
    - >
      Werner Vogels introduced Distill CLI in June 2024 as a local, Rust-powered
      offshoot of an earlier Distill meeting-summarization proof of concept. The README
      describes it as based on the open-source Amazon Bedrock Audio Summarizer and built
      with the AWS SDK for Rust.
  related-projects:
    - >
      Amazon Bedrock Audio Summarizer is the direct predecessor named by the distill-cli
      README.
    - >
      The AWS CLI supplies the credential and region configuration model that
      distill-cli inherits.
  sources:
    - https://www.allthingsdistributed.com/2024/06/introducing-distill-cli.html
    - https://github.com/awslabs/distill-cli#readme
    - https://api.github.com/repos/awslabs/distill-cli
  summary:
    - >
      distill-cli is an AWS Labs Rust command-line tool for summarizing audio and other
      media with Amazon Transcribe and Amazon Bedrock. It sits in the newer wave of
      AI-assisted personal workflow CLIs rather than the older Unix-tool lineage.
  timeline:
    - '2024: Public source repository created for distill-cli.'
    - '2024: Werner Vogels publishes the introductory Distill CLI article.'
    - >
      2024: README documents local Rust builds, AWS CLI configuration, and Bedrock model
      settings.
  usage:
    - >
      A typical run points distill-cli at an input audio file, uploads media to S3,
      submits transcription through Amazon Transcribe, and summarizes the transcript
      with a Bedrock foundation model. Configuration is split between a local
      config.toml for model and output settings and the standard AWS CLI credential and
      region files.
related-packages:
  - id: brew:awscli
    reason: >
      AWS CLI configures the profiles, region, and shared credentials that Distill CLI
      officially requires to access S3, Transcribe, and Bedrock.
    rel: adjacent_workflow
    sources:
      - https://github.com/awslabs/distill-cli#readme
      - https://docs.aws.amazon.com/cli/latest/userguide/getting-started-quickstart.html
category: media
package-manager:
  brew: distill-cli
package-manager-url: https://formulae.brew.sh/formula/distill-cli
license: Apache-2.0
tags:
  - audio
  - aws
  - cli
  - summarization
  - transcription
description: Use AWS Transcribe and Bedrock to create summaries of your audio recordings
executables:
  - distill-cli
provenance:
  formula: distill-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
