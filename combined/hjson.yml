id: brew:hjson
display-name: Hjson
homepage: https://hjson.github.io/
repo: https://github.com/hjson/hjson-go
docs:
  - https://hjson.github.io/
  - https://hjson.github.io/rfc.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Hjson adoption has been implementation-led rather than standards-body-led. The
      official developer page lists implementations for JavaScript, C#, C++, Go, Java,
      Lua, PHP, Python, Rust, Ruby, and other partial ports, plus tools with native
      support.
    - >
      The input package facts show the Go CLI packaged by Homebrew, Nix, and Scoop. That
      is a modest but useful packaging footprint for developers who want a command-line
      converter without adopting a language-specific library.
  package-nerd-significance:
    - >
      Hjson sits in the long-running package-nerd debate over configuration formats:
      strict JSON is universal but hostile to comments and hand editing; YAML is
      powerful but complex; Hjson offers a smaller relaxed-JSON compromise.
    - >
      The Go CLI matters because it turns the format into a portable command-line
      filter, making Hjson useful in shell scripts, editors, config migrations, and
      package-manager installs without committing to a JavaScript runtime.
  project-history:
    - >
      The Hjson site presents the format as a user interface for JSON rather than a
      replacement for JSON. The stated goal is to make data easier for humans to read
      and edit before converting it back to ordinary JSON for machines.
    - >
      The Hjson Internet-Draft dated May 23, 2016 formalized the format as Human JSON, a
      configuration file format based on JSON whose design goals were readability,
      editability, backward compatibility with JSON, and suitability for human-viewed
      configuration, resource files, and debug data dumps.
    - >
      The Homebrew package points at hjson-go, the Go implementation. Its README says
      the Go implementation is based on hjson-js, documents both library and hjson-cli
      use, and positions the CLI as a converter between JSON and Hjson.
  related-projects:
    - 'hjson-js: the JavaScript implementation that hjson-go names as its base.'
    - 'JSON: the strict data format that Hjson extends for human-editable configuration.'
    - >
      YAML, TOML, JSON5: adjacent human-editable configuration formats often considered
      for similar use cases.
  sources:
    - https://api.github.com/repos/hjson/hjson
    - https://api.github.com/repos/hjson/hjson-go
    - https://hjson.github.io/
    - https://hjson.github.io/download.html
    - https://hjson.github.io/rfc.html
    - https://raw.githubusercontent.com/hjson/hjson-go/master/README.md
    - 'input: source_facts.package-manager'
  summary:
    - >
      Hjson is a human-editable configuration format and related CLI/library ecosystem
      that keeps JSON compatibility while relaxing syntax for comments, unquoted keys,
      optional commas, root-brace omission, and multiline strings.
  timeline:
    - '2014: The hjson/hjson repository was created for the format project.'
    - '2016-05-23: The Hjson Internet-Draft was dated May 23, 2016.'
    - '2016-08-05: The hjson-go repository was created.'
    - '2016-08-08: hjson-go v0.1.0 was published on GitHub releases.'
  usage:
    - >
      The hjson-go CLI reads JSON or Hjson from a file or stdin and emits JSON,
      formatted JSON, or Hjson. Typical package use is converting existing JSON into a
      friendlier editable form, validating Hjson, or embedding Hjson parsing into Go
      programs.
    - >
      The format is intentionally scoped. The Internet-Draft recommends it for data
      primarily viewed or edited by humans and advises against protocol use.
related-packages:
  - id: brew:json5
    reason: >
      Choose JSON5 when JavaScript-aligned ECMAScript syntax is preferable; choose Hjson
      for its more aggressively minimal, quoteless human-editing syntax.
    rel: alternative
    sources:
      - https://hjson.github.io/syntax.html
      - https://json5.org/
  - id: brew:jq
    reason: >
      Convert Hjson to standard JSON with hjson, then use jq for structured filtering,
      transformation, and extraction in shell pipelines.
    rel: adjacent_workflow
    sources:
      - https://github.com/hjson/hjson-go#readme
      - https://jqlang.github.io/jq/manual/
category: developer-tools
package-manager:
