id: brew:itstool
display-name: ITS Tool
homepage: https://itstool.org/
repo: https://github.com/itstool/itstool
docs:
  - https://itstool.org/documentation
  - https://itstool.org/documentation/install.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ITS Tool became a small but durable packaging-system utility because it solves a
      recurring documentation localization problem without requiring each XML project to
      invent its own extractor. Homebrew, Debian, Fedora, Arch, MacPorts, Nix, Alpine,
      Ubuntu, and openSUSE packaging in the input metadata show its role as distribution
      infrastructure rather than a general-purpose end-user application.
  package-nerd-significance:
    - >
      Package maintainers care about ITS Tool because it is glue: it connects W3C ITS
      metadata, XML documentation formats, and gettext catalogs. That makes it one of
      the quiet build-time dependencies that keeps localized Unix documentation
      reproducible across distributions.
  project-history:
    - >
      The project is developed primarily by Shaun McCance and is published as
      GPL-3.0-or-later free software. Version 1.0.0 was tagged in April 2011, and the
      project site presents the tool as a way to make XML documents translatable through
      PO files while applying standard ITS rules plus ITS Tool extensions.
    - >
      The 2.0.0 release in 2013 was a major standards-alignment point: its NEWS file
      lists support for several ITS 2.0 data categories, parameters, DocBook 5 built-in
      rules, and changes that replaced older custom extensions with ITS 2.0 mechanisms.
      Later 2.0.x releases concentrated on Python 3 compatibility, XML/libxml2 fixes,
      macOS file writing fixes, and performance improvements.
  related-projects:
    - >
      ITS Tool sits beside gettext, PO/MO catalog tooling, W3C ITS, DocBook, Mallard,
      and libxml2-based XML processing rather than replacing any of them.
  sources:
    - https://api.github.com/repos/itstool/itstool/tags?per_page=100
    - https://formulae.brew.sh/formula/itstool
    - https://itstool.org/
    - https://itstool.org/documentation/
    - https://raw.githubusercontent.com/itstool/itstool/master/NEWS
  summary:
    - >
      ITS Tool is a command-line localization utility for turning XML documents into
      gettext-style PO workflows. Its niche is the intersection of XML documentation,
      GNU translation tooling, and the W3C Internationalization Tag Set rules that
      decide what text should be extracted or preserved.
  timeline:
    - '2011: Version 1.0.0 tagged.'
    - '2013: Version 2.0.0 added ITS 2.0 support and refreshed built-in XML rules.'
    - '2017: Version 2.0.3 added Python 3 support while retaining Python 2 support.'
    - '2021: Version 2.0.7 tagged with performance improvements for ITS rule handling.'
  usage:
    - >
      The documented workflow is to create POT files from XML and then create translated
      XML from MO files. Package users usually encounter it in documentation build
      chains for XML-heavy formats such as DocBook and Mallard, where PO files let
      translators update individual messages as source documents change.
related-packages:
  - id: brew:gettext
    reason: >
      GNU gettext provides msgmerge, msgfmt, and the PO/MO catalog workflow that ITS
      Tool uses to update translations and produce localized XML.
    rel: adjacent_workflow
    sources:
      - https://itstool.org/documentation/basic-usage.html
      - https://www.gnu.org/software/gettext/manual/gettext.html
category: developer-tools
package-manager:
