id: brew:mkvtomp4
display-name: mkvtomp4
homepage: https://github.com/gavinbeatty/mkvtomp4/
repo: https://github.com/gavinbeatty/mkvtomp4
docs:
  - https://github.com/gavinbeatty/mkvtomp4
  - https://github.com/gavinbeatty/mkvtomp4/blob/main/doc/mkvtomp4.1.txt
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/mkvtomp4
    - https://github.com/gavinbeatty/mkvtomp4
  summary:
    - >
      mkvtomp4 is a small Python-era video conversion wrapper by Gavin Beatty for
      turning H.264 MKV files into MP4 files without re-encoding the video. The README
      frames the original use case as making troublesome MKV files playable on the Sony
      PS3 and similar devices: it rewrites H.264 profile-level information when needed,
      re-encodes audio only when it is not already AAC, and leaves the video stream
      intact.
  usage:
    - >
      That places mkvtomp4 in a different niche from full transcoders. It automates
      container remuxing and compatibility fixes using existing media tools, while
      Homebrew's formula records dependencies on ffmpeg, GPAC, MKVToolNix, and Python.
      Adoption appears modest but real through Homebrew packaging; the repository and
      formula position it as a convenience CLI for playback compatibility rather than a
      broad media library or editor.
related-packages:
  - id: brew:mkvtoolnix
    reason: >
      MKVToolNix provides the Matroska-handling commands explicitly required by
      mkvtomp4's conversion pipeline.
    rel: adjacent_workflow
    sources:
      - https://github.com/gavinbeatty/mkvtomp4#readme
      - https://mkvtoolnix.download/doc/README.md
  - id: brew:gpac
    reason: mkvtomp4 explicitly uses GPAC's MP4Box to construct its MP4 output.
    rel: adjacent_workflow
    sources:
      - https://github.com/gavinbeatty/mkvtomp4#readme
      - https://gpac.io/
  - id: brew:ffmpeg
    reason: >
      FFmpeg is mkvtomp4's documented optional tool for audio encoding and subtitle
      processing.
    rel: adjacent_workflow
    sources:
      - https://github.com/gavinbeatty/mkvtomp4#readme
      - https://ffmpeg.org/documentation.html
category: media
package-manager:
  brew: mkvtomp4
package-manager-url: https://formulae.brew.sh/formula/mkvtomp4
license: MIT
tags:
  - cli
  - h264
  - mkv
  - mp4
  - video-conversion
description: Convert mkv files to mp4
executables:
  - mkvtomp4
  - mkvtomp4.py
provenance:
  formula: mkvtomp4
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
