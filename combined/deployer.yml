id: brew:deployer
display-name: Deployer
homepage: https://deployer.org/
repo: https://github.com/deployphp/deployer
docs:
  - https://deployer.org/docs
config-file-location:
  unix:
    - deploy.php
    - deploy.yaml
credentials-file-location:
  unix:
    - ~/.ssh/config
    - ~/.ssh/id_rsa
history:
  adoption-history:
    - >
      Deployer spread through PHP application teams because it matched the shape of PHP
      projects: a Composer-installable tool, framework recipes, SSH-based hosts, and
      recipes that can be kept near application code. Its Homebrew, MacPorts, Scoop,
      Chocolatey, and Nix packaging made the `dep` binary convenient outside pure
      Composer installs.
  package-nerd-significance:
    - >
      For package nerds, Deployer is a good example of deployment logic packaged as a
      language-native CLI. It sits between Composer, SSH, framework conventions, and
      release directory layouts, showing how packaging culture can turn an operations
      pattern into a reusable command.
  project-history:
    - >
      The official deployphp/deployer repository was created in 2013. Its README
      presents Deployer as a PHP deployment tool with built-in support for popular
      frameworks, automatic server provisioning, zero-downtime deployments, and
      ready-to-use recipes.
    - >
      The versioned documentation shows the modern workflow: install Deployer, run `dep
      init`, and answer prompts to create `deploy.php` or `deploy.yaml` with hosts,
      tasks, and imported recipes.
  related-projects:
    - >
      Related official resources include Deployer recipes, the Deployer GitHub Action,
      and the deployphp/deployer Docker image.
  sources:
    - https://github.com/deployphp/deployer#readme
    - https://deployer.org/docs/8.x/getting-started
    - https://api.github.com/repos/deployphp/deployer
  summary:
    - >
      Deployer is a PHP deployment CLI focused on repeatable application releases,
      provisioning, framework recipes, and zero-downtime deployment patterns. It gives
      PHP projects a programmable deployment file and a `dep` command instead of a pile
      of shell snippets.
  timeline:
    - '2013: Official deployphp/deployer repository created.'
    - '2026: Current documentation centers on Deployer 8.x.'
    - '2026: Getting-started docs document `deploy.php` and `deploy.yaml` recipe generation.'
  usage:
    - >
      A typical project keeps a `deploy.php` or `deploy.yaml` recipe in the repository,
      defines hosts and `deploy_path`, and runs `dep deploy`. The docs recommend keeping
      SSH identity details in `~/.ssh/config`, while the tool manages release
      directories, shared files, current symlinks, rollback-oriented release history,
      and custom tasks.
related-packages:
  - id: brew:composer
    reason: >
      Composer is Deployer's officially documented project-installation workflow,
      allowing teams to pin Deployer with application development dependencies and
      invoke it from vendor/bin.
    rel: adjacent_workflow
    sources:
      - https://deployer.org/docs/8.x/installation
      - https://getcomposer.org/doc/00-intro.md
category: developer-tools
package-manager:
  brew: deployer
  chocolatey: dep
  macports: dep
  nix: deployer
  scoop: main/dep
package-manager-url: https://formulae.brew.sh/formula/deployer
license: MIT
tags:
  - automation
  - cli
  - deployment
  - frameworks
  - php
description: Deployment tool written in PHP with support for popular frameworks
executables:
  - dep
provenance:
  formula: deployer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
