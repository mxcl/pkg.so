id: brew:kuzu
display-name: Kuzu
homepage: https://github.com/kuzudb/kuzu
repo: https://github.com/kuzudb/kuzu
docs:
  - https://kuzudb.github.io/docs
  - https://github.com/kuzudb/kuzu#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kuzu attracted attention as an embeddable graph DBMS for applications, notebooks,
      data science, and graph analytics where running a separate graph server is
      inconvenient. The project shipped client APIs across languages, a CLI, and
      integrations with formats and systems such as Parquet, Arrow, DuckDB, and SQLite.
  package-nerd-significance:
    - >
      Kuzu matters to package nerds because it packages graph database functionality as
      an embeddable library and CLI, making graph queries feel installable like a local
      data tool. The later archive notice and v0.11.3 extension-bundling release also
      make it a case study in how package ecosystems handle project wind-downs and
      extension delivery.
  project-history:
    - >
      Kuzu was initially developed by Kuzu Inc. and the official docs describe it as
      coming out of academic database research by a team focused on graph storage, query
      processing, and scalability. Its core design includes columnar disk storage, CSR
      adjacency and join indices, vectorized and factorized query processing, efficient
      join algorithms, multi-core parallelism, and serializable ACID transactions.
  related-projects:
    - >
      Kuzu is related to Cypher and Neo4j-style graph querying, and it interoperates
      with data tooling such as Parquet, Arrow, DuckDB, SQLite, and language clients for
      Python, Node.js, Java, Rust, Go, Swift, C++, and C.
  sources:
    - https://github.com/kuzudb/kuzu
    - https://github.com/kuzudb/kuzu/releases/tag/v0.11.3
    - https://github.com/kuzudb/kuzu/releases/tag/v0.8.0
    - https://kuzudb.github.io/docs/
    - https://kuzudb.github.io/docs/get-started/
  summary:
    - >
      Kuzu is an embedded property graph database for analytical graph workloads,
      combining a Cypher-facing graph model with an in-process deployment style closer
      to SQLite or DuckDB than to a server database.
  timeline:
    - >
      2025: v0.8.0 added Kuzu-WASM for browser-based graph analytics and a
      full-text-search extension.
    - 'October 10, 2025: The GitHub repository was archived by its owner.'
    - >
      v0.11.3: Bundled the algo, fts, json, and vector extensions so users did not need
      to install those extensions separately.
  usage:
    - >
      Users create a Kuzu database either on disk or in memory, define a structured
      property graph schema, import data from files, and query with Cypher. The docs
      emphasize that embedded use avoids installing or managing an external DBMS server.
related-packages:
  - id: brew:neo4j
    reason: >
      Choose Neo4j when you want a maintained, server-oriented property-graph database
      and Cypher ecosystem; choose Kuzu only for its archived embedded, in-process
      model.
    rel: alternative
    sources:
      - https://github.com/kuzudb/kuzu
      - https://neo4j.com/docs/getting-started/
  - id: brew:duckdb
    reason: >
      Use DuckDB alongside Kuzu for embedded SQL analytics over tabular data; Kuzu's
      official DuckDB extension was designed to attach DuckDB databases and scan their
      tables from graph workflows.
    rel: adjacent_workflow
    sources:
      - https://kuzudb.github.io/docs/extensions/duckdb/
      - https://duckdb.org/docs/stable/
