id: brew:lsusb
display-name: lsusb
homepage: https://github.com/jlhonora/lsusb
repo: https://github.com/jlhonora/lsusb
docs:
  - https://github.com/jlhonora/lsusb#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official GitHub signals show a compact but widely noticed utility: 50 commits,
      about 391 stars, 54 forks, and three releases. The 1.0 release notes say the
      project incorporated outside contributions and included almost every feature from
      Linux usbutils 007, which helps explain why it became the original macOS `lsusb`
      package in Homebrew and other package histories.
  package-nerd-significance:
    - >
      This is the classic example of a package-manager portability shim: a tiny command
      with a Linux name that normalizes muscle memory across macOS and Linux. Package
      nerds care because it demonstrates how Homebrew and taps often filled gaps where
      macOS had native data but lacked the Unix command surface users expected.
  project-history:
    - >
      The project began as a small portability tool for Mac users who wanted the
      familiar Linux `lsusb` command. Its README explains that it uses `system_profiler
      SPUSBDataType`, with `lsusb -v` exposing the unmodified Apple command output, and
      its release history shows early 0.1 and 0.2 releases followed by a 1.0
      'Full-featured version'.
  related-projects:
    - >
      Linux usbutils is the reference implementation whose `lsusb` behavior inspired the
      project.
    - LanikSJ/lsusb is a maintained fork distributed in Homebrew as `lsusb-laniksj`.
    - Apple `system_profiler SPUSBDataType` supplies the underlying USB information on macOS.
  sources:
    - https://github.com/jlhonora/lsusb
    - https://github.com/jlhonora/lsusb/releases
    - source_facts.package-manager
    - source_facts.repo
  summary:
    - >
      jlhonora/lsusb is a Mac OS X shell utility that makes Apple's USB hardware report
      look and feel like Linux's `lsusb` command.
  timeline:
    - '2010s: Version 0.1 is released as a basic working macOS lsusb clone.'
    - '2010s: Version 0.2 adds man-page and script-style improvements from contributors.'
    - >
      2010s: Version 1.0 is released as a full-featured version with broad parity
      against Linux usbutils 007.
  usage:
    - >
      The README documents direct command-line use, manual installation into a PATH
      directory, and Homebrew installation through the original tap. Options include
      verbosity, vendor/product filtering, tree output, version display, and help, with
      the bundled man page recommended for the most accurate usage description.
related-packages:
  - id: brew:procps
    reason: >
      Use procps alongside lsof when you need process-centric status and monitoring to
      contextualize the processes and PIDs associated with open files.
    rel: adjacent_workflow
    sources:
