id: brew:dopewars
display-name: dopewars
homepage: https://dopewars.sourceforge.io
repo: https://github.com/benmwebb/dopewars
docs:
  - https://dopewars.sourceforge.io/docs
  - https://dopewars.sourceforge.io/faq.html
config-file-location:
  unix:
    - /etc/dopewars
    - ~/.dopewars
  windows: '%LOCALAPPDATA%\dopewars\dopewars-config.txt'
credentials-file-location: null
history:
  adoption-history:
    - >
      dopewars is long-lived in Unix packaging culture because it is small,
      text-capable, network-aware, and portable. It appears in Homebrew and several
      Unix-like distribution package sets, and the official site has historically
      distributed tarballs, RPMs, and Windows binaries.
  package-nerd-significance:
    - >
      dopewars is package-nerd significant as a classic small game that survived across
      SourceForge, GitHub, Unix packages, RPMs, and Windows binaries. It is also a good
      specimen of old-school free software game packaging: curses, GLib, optional GUI
      pieces, config files, high-score files, client/server mode, and long compatibility
      windows.
  project-history:
    - >
      The project FAQ says dopewars was originally developed on a RedHat Linux system
      and is loosely based on John E. Dell's 1980s Drug Wars, with closer influence from
      the MS-DOS Dopewars rewrite. The README describes version 1.6.2 as a game about
      making money in New York while managing debt and police risk.
    - >
      The current GitHub repository was created in 2015, but the SourceForge site and
      FAQ preserve the older project identity and documentation. SourceForge file
      metadata shows 1.6.2 release artifacts published in June 2022, while GitHub
      metadata shows maintenance activity continuing into 2026.
  related-projects:
    - >
      Related projects include the original Drug Wars, MS-DOS Dopewars, Dopewars 2000,
      curses/ncurses, GLib, curl, GTK, SDL, SourceForge distribution, and multiplayer
      metaserver tooling.
  sources:
    - https://github.com/benmwebb/dopewars#readme
    - https://dopewars.sourceforge.io/faq.html
    - https://sourceforge.net/projects/dopewars/rss?path=/
    - https://api.github.com/repos/benmwebb/dopewars
    - https://formulae.brew.sh/formula/dopewars
  summary:
    - >
      dopewars is a free software strategy game derived from the older Drug
      Wars/Dopewars family. The modern package includes a Unix-style text client, server
      support for multiplayer games, Windows builds, and optional graphical or SDL
      variants.
  timeline:
    - >
      1980s: John E. Dell's Drug Wars provides the original game lineage, according to
      the dopewars FAQ.
    - >
      1990s/2000s: dopewars develops as a portable Unix and Windows free software
      rewrite hosted around SourceForge.
    - '2015: The current GitHub repository is created.'
    - '2022: SourceForge publishes dopewars 1.6.2 artifacts.'
    - '2026: GitHub repository metadata shows recent maintenance activity.'
  usage:
    - >
      Users run `dopewars` for the standard multiplayer-capable game, `dopewars -a` for
      antique mode closer to the original, `dopewars -s` for a server, or `dopewars -c`
      for a computer player. Configuration is read from `/etc/dopewars` and
      `~/.dopewars` on Unix, with a Windows-friendly configuration filename documented
      in the README.
related-packages: []
category: games
package-manager:
  brew: dopewars
  debian: dopewars
  macports: dopewars
  nix: dopewars
  pacman: dopewars
  ubuntu: dopewars
package-manager-url: https://formulae.brew.sh/formula/dopewars
license: GPL-2.0-or-later
tags:
  - cli
  - game
  - multiplayer
  - simulation
  - strategy
  - unix
description: Free rewrite of a game originally based on "Drug Wars"
executables:
  - dopewars
provenance:
  formula: dopewars
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
