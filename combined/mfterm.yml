id: brew:mfterm
display-name: mfterm
homepage: https://github.com/4ZM/mfterm
repo: https://github.com/4ZM/mfterm
docs:
  - https://github.com/4ZM/mfterm#readme
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/mfterm
    - https://github.com/4ZM/mfterm
    - https://github.com/zhovner/mfdread
    - https://www.kali.org/tools/mfterm/
  summary:
    - >
      mfterm is a small GPL-licensed command-line terminal for working with MIFARE
      Classic 1K and 4K RFID/NFC tags. Its upstream project lives under the 4ZM GitHub
      account and documents a workflow centered on direct tag interaction from a
      terminal, with Homebrew installation for macOS and Linux packaging called out by
      the project.
  usage:
    - >
      Its niche is practical NFC security and card-lab work rather than a broad
      application framework. In package-manager terms it sits near tools such as libnfc
      utilities, mfoc, and dump parsers: mfterm provides an interactive terminal for
      MIFARE Classic tags, while adjacent tools read, recover, parse, or manipulate dump
      files. Kali's package page and Homebrew's formula place it in the security-tooling
      ecosystem rather than the general desktop NFC space.
related-packages:
  - id: brew:libnfc
    reason: >
      Use libnfc with mfterm as the low-level NFC reader stack underlying the
      libnfc-style physical-tag and dump workflow documented by mfterm.
    rel: adjacent_workflow
    sources:
      - https://github.com/4ZM/mfterm
      - https://github.com/nfc-tools/libnfc
category: security
package-manager:
  brew: mfterm
package-manager-url: https://formulae.brew.sh/formula/mfterm
license: GPL-3.0-or-later
tags:
  - cli
  - mifare-classic
  - nfc
  - rfid
  - terminal
description: Terminal for working with Mifare Classic 1-4k Tags
executables:
  - mfterm
provenance:
  formula: mfterm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
