id: brew:makeself
display-name: makeself
homepage: https://makeself.io/
repo: https://github.com/megastep/makeself
docs:
  - https://github.com/megastep/makeself#readme
  - https://makeself.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      makeself stayed useful because it requires little from the target system beyond a
      shell, tar, and a supported compressor. The README lists examples such as Id
      Software game installers and patches, Loki game patches, NVIDIA Linux drivers,
      Google Earth for Linux, VirtualBox Linux installers, and the makeself distribution
      itself.
    - >
      The GitHub repository shows continued maintenance, releases, and a broad
      contributor history. Newer releases added compression options, archive inspection
      flags, checksums, CI-friendly usage, and portability fixes while preserving the
      old package-maintainer promise: ship one executable-ish installer file without a
      native package repository.
  package-nerd-significance:
    - >
      Package nerds care about makeself because it occupies the gray zone between
      tarballs and native packages. It is not a dependency solver or package manager,
      but it is a common vendor distribution format that package maintainers often need
      to unpack, audit, repack, or replace with distro-native recipes.
  project-history:
    - >
      The official README says makeself was written by Stéphane Peter and is maintained
      in portable Bourne-shell style so that both the generator and generated archives
      can run across Unix variants. Its design is deliberately simple: prepend a shell
      stub to a tar archive, extract into a temporary directory or chosen target, run a
      script, and clean up.
    - >
      The project is historically tied to Loki Software's Linux game installers. The
      official site points readers to Loki Setup, notes that Stéphane Peter co-authored
      it, and recommends the `.run` suffix introduced by some Loki-era makeself
      archives. That gave makeself a visible role in the Linux commercial game and
      driver distribution era before distribution-native packages covered every case.
  related-projects:
    - >
      Related tools and formats include Loki Setup, shell archives, tarballs, AppImage,
      InstallAnywhere-style binary installers, and native package formats such as deb,
      rpm, and pacman packages.
  sources:
    - https://api.github.com/repos/megastep/makeself
    - https://github.com/megastep/makeself
    - https://makeself.io/
    - https://raw.githubusercontent.com/megastep/makeself/master/README.md
  summary:
    - >
      makeself is a portable shell-script tool that creates self-extracting compressed
      tar archives for Unix-like systems. The generated file looks like a shell script,
      often using a `.run` or `.sh` suffix, and embeds both an archive and the startup
      command that should run after extraction.
  timeline:
    - >
      1990s-2000s: Loki-style `.run` archives popularize self-extracting shell
      installers for Linux games and applications.
    - '2010: The official GitHub repository is created.'
    - '2025: GitHub lists makeself v2.7.1 as a release.'
    - >
      2026: The official repository remains maintained with thousands of stars and
      hundreds of forks.
  usage:
    - >
      A common invocation is `makeself.sh archive_dir file_name label startup_script
      [script_args]`. Generated archives support options such as `--list`, `--check`,
      `--target`, `--noexec`, `--keep`, and `--tar`, which makes them inspectable and
      scriptable in package and release automation.
related-packages: []
