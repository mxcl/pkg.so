id: brew:mysql
display-name: MySQL
homepage: https://github.com/mysql/mysql-server
repo: https://github.com/mysql/mysql-server
docs:
  - https://dev.mysql.com/doc
  - https://dev.mysql.com/doc/mysql/en
config-file-location:
  unix: ~/.my.cnf
credentials-file-location:
  unix: ~/.my.cnf
history:
  project-history:
    - >
      The system became one of the defining databases of the LAMP stack: MySQL Server
      provides a multithreaded SQL server, client programs and libraries, administrative
      tools, and APIs, and it can be used as a client/server database or embedded
      library. Its ecosystem role was shaped by web deployment, dual licensing, and
      storage-engine evolution, including InnoDB's rise as the transactional backend.
      Oracle's customer pages list users across media, ecommerce, financial services,
      technology, telecom, education, and manufacturing, with named examples such as
      YouTube, GitHub, Uber, Square, BBC, Spotify, Airbus/EADS, Boeing, and the
      University of Toronto.
  sources:
    - https://dev.mysql.com/doc/refman/8.4/en/history.html
    - https://dev.mysql.com/doc/refman/8.4/en/what-is-mysql.html
    - https://formulae.brew.sh/formula/mysql
    - https://planet.mysql.com/entry/?id=23788
    - https://www.mysql.com/customers/
  summary:
    - >
      MySQL is an open-source relational database management system that grew out of
      work by Michael "Monty" Widenius, David Axmark, and Allan Larsson. Oracle's manual
      says the team first intended to use mSQL with its own ISAM routines, then built a
      new SQL interface after finding mSQL too slow or inflexible; the name comes from
      Widenius's daughter, My. MySQL AB was founded in Sweden in 1995, the project
      adopted GPL distribution in 2000, and Sun Microsystems acquired MySQL AB in 2008
      before Oracle acquired Sun.
  usage:
    - >
      In package-manager terms, Homebrew's unversioned `mysql` formula follows the
      active upstream server line and installs the server plus common client and
      administrative programs such as `mysql`, `mysqld`, `mysqldump`, `mysqladmin`, and
      `mysql_secure_installation`. Homebrew also keeps versioned formulae such as
      `mysql@8.4` and `mysql@8.0`, and the main formula notes conflicts with MariaDB and
      Percona Server, reflecting MySQL's long-standing relationship with compatible
      forks and alternative server distributions.
related-packages:
  - id: brew:mariadb
    reason: >
      Choose MariaDB when you want a MySQL-derived server with broad protocol and
      connector compatibility but its own storage engines and feature direction; review
      documented divergence before migrating modern deployments.
    rel: alternative
    sources:
      - >
        https://mariadb.com/docs/release-notes/community-server/about/compatibility-and-differences/mariadb-vs-mysql-compatibility
      - https://dev.mysql.com/doc/refman/8.4/en/what-is-mysql.html
  - id: brew:percona-server
    reason: >
      Choose Percona Server for MySQL when you need a MySQL Community-compatible server
      with Percona's additional observability and enterprise-oriented features.
    rel: alternative
    sources:
      - https://docs.percona.com/percona-for-mysql/
      - https://dev.mysql.com/doc/refman/8.4/en/what-is-mysql.html
  - id: brew:mycli
    reason: >
      Use mycli with a MySQL server when you want an interactive SQL terminal with
      contextual completion, syntax highlighting, and richer history than the standard
      shell.
    rel: adjacent_workflow
    sources:
      - https://www.mycli.net/
      - https://dev.mysql.com/doc/refman/8.4/en/mysql.html
  - id: brew:mydumper
    reason: >
      Use MyDumper alongside MySQL for multithreaded logical backup, restore, and
      migration workflows that are too large for a comfortable serial mysqldump process.
    rel: adjacent_workflow
    sources:
      - https://mydumper.github.io/mydumper/docs/html/
      - https://dev.mysql.com/doc/refman/8.4/en/mysqldump.html
