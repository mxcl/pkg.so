id: brew:blueutil
display-name: blueutil
homepage: https://github.com/toy/blueutil
repo: https://github.com/toy/blueutil
docs:
  - https://github.com/toy/blueutil#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      blueutil became the standard package-manager answer for 'control Bluetooth from a
      shell on macOS.' Its README documents Homebrew and MacPorts installs, and the
      input metadata also records a Nix package, reflecting adoption by both casual Mac
      users and reproducible-environment users.
    - >
      Its role persisted because macOS does not expose all of these Bluetooth controls
      through a stable, script-friendly built-in CLI, so package managers filled the gap
      with a small native utility.
  package-nerd-significance:
    - >
      blueutil is the classic tiny Mac systems package: one binary that unlocks
      automation around a GUI-controlled OS feature. Package nerds care because it has
      survived macOS Bluetooth API changes, packaging across Homebrew/MacPorts/Nix,
      architecture transitions, and years of shell-script dependence.
    - >
      It also illustrates the maintenance burden of packaging native Mac utilities:
      private frameworks, root behavior, TCC/API access failures, output formats for
      scripts, and compatibility notes all live in a very small command-line surface.
  project-history:
    - >
      blueutil was originally written by Frederik Seiffert and later maintained by Ivan
      Kuchin, as recorded in the README copyright section. The GitHub repository dates
      back to 2011, with v1.0.0 tagged in 2012 and a continuing v2.x release line.
    - >
      The tool grew from simple power and discoverability controls into a broader
      Bluetooth scripting interface. The README documents private IOBluetooth framework
      use, root-user safeguards, JSON output formats, device connection operations, wait
      commands, and an experimental system_profiler fallback for some paired-device
      queries.
  related-projects:
    - >
      blueutil-tui is documented by the README as a text user interface built on top of
      blueutil.
    - Homebrew, MacPorts, and Nix are package-manager channels recorded for installation.
    - >
      macOS IOBluetooth and system_profiler are the platform interfaces used or offered
      as alternatives.
  sources:
    - https://github.com/toy/blueutil#readme
    - https://github.com/toy/blueutil/releases
    - source_facts.package-manager
  summary:
    - >
      blueutil is a long-running macOS command-line utility for reading and changing
      Bluetooth state: power, discoverability, paired and connected devices, device
      info, pairing, connection, and output formats for scripts.
  timeline:
    - '2011: GitHub repository created for blueutil.'
    - '2012: v1.0.0 tag published.'
    - '2018: v2.0.0 tag published.'
    - >
      2021: README documents macOS 12 Monterey behavior changes for favorite and recent
      devices.
    - '2025: v2.13.0 tag and README copyright show continued maintenance.'
  usage:
    - >
      Users run blueutil with flags such as --power, --discoverable, --paired,
      --connected, --info, --connect, --disconnect, --pair, and --unpair. Output can be
      human-readable or JSON, making it useful in shell scripts, status bars, automation
      tools, and troubleshooting flows.
    - >
      The README warns that it uses private IOBluetooth preference APIs and documents
      macOS-version quirks such as favorite/recent-device behavior starting with macOS
      12 Monterey.
related-packages:
  - id: brew:bluetoothconnector
    reason: >
      Choose BluetoothConnector when a macOS workflow only needs to connect, disconnect,
      check, or toggle one paired device and may benefit from its included Automator
      shortcut workflow.
    rel: alternative
    sources:
      - https://github.com/toy/blueutil#readme
      - https://github.com/lapfelix/BluetoothConnector#readme
  - id: brew:bluetuith
    reason: >
      Choose bluetuith when an interactive cross-platform terminal manager with adapter
      menus, pairing, media control, and file transfers is preferable to script-oriented
      macOS commands.
    rel: alternative
    sources:
      - https://github.com/toy/blueutil#readme
      - https://github.com/bluetuith-org/bluetuith#readme
category: system
package-manager:
  brew: blueutil
  macports: blueutil
  nix: blueutil
package-manager-url: https://formulae.brew.sh/formula/blueutil
license: MIT
tags:
  - bluetooth
  - cli
  - macos
description: Get/set bluetooth power and discoverable state
executables:
  - blueutil
provenance:
  formula: blueutil
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
