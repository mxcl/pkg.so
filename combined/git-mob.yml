id: brew:git-mob
display-name: Git Mob
homepage: https://github.com/rkotze/git-mob/blob/master/packages/git-mob
repo: https://github.com/rkotze/git-mob
docs:
  - https://github.com/rkotze/git-mob#readme
  - https://github.com/rkotze/git-mob/tree/master/packages/git-mob
config-file-location:
  unix:
    - $GITMOB_COAUTHORS_PATH
    - .git-coauthors
    - ~/.git-coauthors
credentials-file-location: null
history:
  adoption-history:
    - >
      Git Mob follows the adoption of GitHub's `Co-authored-by` commit trailers, which
      make commits visible as co-authored on GitHub. The tool packages that convention
      for teams that pair or mob frequently, reducing the friction of remembering names,
      emails, and trailer formatting.
    - >
      Its distribution is centered on npm and Homebrew, with a related Visual Studio
      Code extension and a reusable core package. That makes it especially relevant to
      JavaScript-heavy teams and collaborative coding shops that switch between terminal
      and editor workflows.
  package-nerd-significance:
    - >
      Git Mob is package-nerd interesting because it turns a social collaboration
      convention into a Git subcommand and a tiny local data file. It also shows how a
      CLI can bridge Git config, commit templates, npm packaging, Homebrew packaging,
      and editor extensions without needing a server.
  project-history:
    - >
      Richard Kotze published the Git Mob repository in February 2018. The repository is
      organized as a workspace, with the Git Mob CLI package and a shared git-mob-core
      package for reusable co-author logic.
    - >
      The changelog shows the CLI growing from a simple co-author helper into a
      TypeScript and Node-based toolchain. The 2.x line integrated git-mob-core for core
      features; 3.0.0 moved to ESM and Node 16; 4.0.0 completed a TypeScript migration
      for main files and removed lower-value edit/delete commands.
  related-projects:
    - >
      Git Mob relates to GitHub's co-author trailer support, the Git Mob VS Code
      extension, git-mob-core, and older pairing tools such as git-duet. It differs from
      general commit-template tools by centering the pair or mob roster.
  sources:
    - https://api.github.com/repos/rkotze/git-mob
    - >
      https://docs.github.com/en/pull-requests/committing-changes-to-your-project/creating-and-editing-commits/creating-a-commit-with-multiple-authors
    - https://formulae.brew.sh/formula/git-mob
    - https://github.com/rkotze/git-mob#readme
    - https://github.com/rkotze/git-mob/blob/master/CHANGELOG.md
    - https://github.com/rkotze/git-mob/tree/master/packages/git-mob
  summary:
    - >
      Git Mob is a command-line tool for adding co-author trailers to Git commits during
      pair programming and mob programming. It keeps a local list of co-authors and
      updates commit-message templates or hook-based flows so commits include the people
      working together.
  timeline:
    - '2018: Public GitHub repository created.'
    - '2023: git-mob 2.5.0 integrated git-mob-core for main CLI features.'
    - '2023: git-mob 3.0.0 moved to ESM and required Node 16.'
    - '2024: git-mob 4.0.0 completed the main TypeScript migration and changed the command set.'
    - '2025: git-mob 4.0.1 fixed exact co-author email filtering.'
  usage:
    - >
      Users configure their primary Git author normally, store teammates in
      `.git-coauthors`, then run commands such as `git mob ad bd` to select co-authors
      by initials. Subsequent commits include `Co-authored-by` trailers; `git solo`
      returns to a solo author flow.
    - >
      The CLI can add co-authors, suggest co-authors from repository history, print the
      active mob, fetch GitHub no-reply author details when enabled, and support
      commit-message hooks for users who commit with `git commit -m`.
related-packages:
  - id: brew:pre-commit
    reason: >
      Git Mob officially supplies an `add-coauthors` pre-commit hook, so pre-commit can
      install and run its commit-message integration reproducibly from
      `.pre-commit-config.yaml`.
    rel: adjacent_workflow
    sources:
      - >
        https://github.com/rkotze/git-mob/tree/master/packages/git-mob#using-pre-commit-to-install
      - https://pre-commit.com/
category: developer-tools
package-manager:
  brew: git-mob
package-manager-url: https://formulae.brew.sh/formula/git-mob
license: MIT
tags:
  - cli
  - co-authors
  - collaboration
  - git
  - mob-programming
  - pair-programming
description: CLI tool for including co-authors in commits
executables:
  - git-add-coauthor
  - git-mob
  - git-mob-print
  - git-solo
  - git-suggest-coauthors
provenance:
  formula: git-mob
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
