id: brew:johnnydep
display-name: Johnnydep
homepage: https://github.com/wimglenn/johnnydep
repo: https://github.com/wimglenn/johnnydep
docs:
  - https://github.com/wimglenn/johnnydep#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Johnnydep's adoption is niche but practical: it is published on PyPI for Python
      users and packaged by Homebrew for command-line installation on macOS and Linux.
      The Homebrew formula describes the same narrow purpose and packages it with
      Python, libyaml, certifi, and uv-related resolver support.
  package-nerd-significance:
    - >
      Johnnydep is a package-nerd tool because it exists to make package metadata
      visible. It is not a general dependency manager; its value is the short feedback
      loop when someone wants to understand why installing one Python distribution pulls
      in a particular stack.
  project-history:
    - >
      The wimglenn/johnnydep repository was created in 2018, and PyPI records the first
      0.1a0 upload on March 22, 2018. The project has stayed focused on one narrow job:
      ask Python packaging metadata and resolvers what a distribution depends on, then
      display that dependency graph in a human-readable form.
  related-projects:
    - >
      Related projects and standards include PyPI, Python core metadata, the Simple
      Repository API, wheel metadata, uv, unearth, pip, and pipdeptree.
  sources:
    - https://api.github.com/repos/wimglenn/johnnydep
    - https://formulae.brew.sh/formula/johnnydep
    - https://github.com/wimglenn/johnnydep
    - https://pypi.org/pypi/johnnydep/json
  summary:
    - >
      Johnnydep is a small Python packaging utility for pretty-printing the dependency
      tree of a Python distribution. Its README demonstrates resolving packages such as
      requests and boto3 into tree output, and it can also emit pinned dependency output
      for resolver-oriented workflows.
  timeline:
    - '2018: The GitHub repository was created.'
    - '2018: Version 0.1a0 was uploaded to PyPI.'
    - '2026: PyPI recorded the 2.1.0 release.'
  usage:
    - >
      Users run johnnydep with a distribution name to inspect immediate and transitive
      dependencies, summaries, and optional pinned output. It fits the debugging space
      between pip metadata, lockfile generation, and tools such as pipdeptree.
related-packages:
  - id: brew:pipdeptree
    reason: >
      Choose pipdeptree to inspect, reverse-query, detect conflicts in, or graph
      packages already installed in an environment; choose Johnnydep to examine a named
      distribution from package metadata before installation.
    rel: alternative
    sources:
      - https://pypi.org/project/johnnydep/
      - https://pipdeptree.readthedocs.io/en/latest/
  - id: brew:pipgrip
    reason: >
      Choose pipgrip when PubGrub-based version solving and a preview of the resolved
      tree are more important than Johnnydep's metadata-oriented, summary-rich display.
    rel: alternative
    sources:
      - https://pypi.org/project/johnnydep/
      - https://github.com/ddelange/pipgrip#readme
