id: cask:vivaldi@snapshot
display-name: Vivaldi Snapshot
homepage: https://vivaldi.com/
repo: null
docs:
  - https://help.vivaldi.com/
config-file-location:
  unix: >
    Snapshot profile folder shown under Profile Path at vivaldi://about; settings are
    primarily in Default/Preferences.
credentials-file-location:
  unix: >
    Snapshot profile folder shown under Profile Path at vivaldi://about, in
    Default/Login Data.
history:
  adoption-history:
    - >
      Vivaldi expanded from a desktop-only browser on Windows, Linux, and macOS to a
      multi-platform product used by millions. Snapshot builds form the public testing
      stage between internal development and Stable, with feedback from Snapshot users
      informing fixes before production releases.
  package-nerd-significance:
    - >
      Vivaldi Snapshot is a distinct, parallel-installable rolling channel rather than
      merely an older or alternate browser package. It appeals to power users who want
      upcoming browser features early and to testers who follow Chromium-driven release
      cycles and Vivaldi's heavily customized interface.
  project-history:
    - >
      Vivaldi's first public technical preview appeared on January 27, 2015, followed by
      a first beta on November 3, 2015 and the Vivaldi 1.0 stable release in April 2016.
      The browser was created as a feature-rich, customizable alternative aimed at power
      users and is built around Chromium with Vivaldi's own interface and services.
  related-projects:
    - >
      Vivaldi uses the Chromium engine but develops its own user interface and
      integrated tools. Snapshot and Stable are official parallel release channels;
      Snapshot builds can run beside Stable on Linux and macOS.
  sources:
    - 'Official 1.0 anniversary: https://vivaldi.com/blog/whos-the-birthday-browser/'
    - 'Official Chromium comparison: https://vivaldi.com/blog/vivaldi-different-from-chrome/'
    - 'Official Snapshot explanation: https://vivaldi.com/blog/snapshot-vs-stable/'
    - >
      Official anniversary history:
      https://vivaldi.com/blog/ten-years-of-making-new-friends-by-building-a-browser-for-you-not-big-tech/
    - 'Official first-beta announcement: https://vivaldi.com/blog/the-first-vivaldi-beta/'
  summary:
    - >
      Vivaldi Snapshot is the public work-in-progress channel of Vivaldi's customizable
      Chromium-based browser, offering features before they reach Stable.
  timeline:
    - '2015-01-27: First Vivaldi technical preview released.'
    - '2015-11-03: First beta released after 50 snapshots and four technical previews.'
    - '2016-04: Vivaldi 1.0 released.'
    - '2017: Vivaldi formally documented Snapshot as its public early-testing channel.'
    - '8.2.4129.3: Version recorded by the supplied Homebrew Cask metadata.'
  usage:
    - >
      Advanced users and developers install Snapshot to test new Vivaldi features and
      submit feedback before Stable releases. Vivaldi warns that Snapshot may contain
      bugs or regressions and that downgrading a Snapshot profile to Stable can corrupt
      it; users on macOS and Linux can keep Snapshot and Stable side by side.
category: networking
package-manager:
  brew-cask: vivaldi@snapshot
package-manager-url: https://formulae.brew.sh/cask/vivaldi@snapshot
tags:
