id: brew:hq
display-name: hq
homepage: https://orf.github.io/html-query/
repo: https://github.com/orf/html-query
docs:
  - https://github.com/orf/html-query#readme
  - https://orf.github.io/html-query
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      hq is packaged through Homebrew and published on crates.io as `html-query`. The
      crates.io metadata records the crate creation in December 2022 and points back to
      the upstream repository lineage, while the README documents installation through
      either `brew install hq` or `cargo install html-query`.
  package-nerd-significance:
    - >
      hq is interesting because it imports the jq mental model into HTML scraping
      without trying to become a full crawler or browser automation framework. For
      package nerds, it belongs to the small-tool lineage where each file format gets a
      composable query command.
    - >
      It also shows a familiar Rust CLI distribution pattern: a crates.io package for
      Cargo users, a GitHub repository with a web demo, and a Homebrew formula for users
      who want a binary package.
  project-history:
    - >
      The project lives in the `orf/html-query` repository as a small Rust workspace
      with crates for the CLI, AST, extractor, and web UI. The README documents a
      selector syntax that looks JSON-shaped but uses CSS selectors as values, then
      emits JSON output.
  related-projects:
    - jq is the direct conceptual comparison used in the hq README.
    - >
      CSS selector engines and Rust HTML parsing crates provide the underlying
      interaction model.
    - htmlq is a related but separate CLI in the broader `jq for HTML` family.
  sources:
    - https://crates.io/crates/html-query
    - https://formulae.brew.sh/formula/hq
    - https://github.com/orf/html-query
    - https://orf.github.io/html-query
  summary:
    - >
      hq is a Rust command-line tool for extracting structured JSON from HTML with CSS
      selectors. Its README summarizes the idea as `jq, but for HTML`.
  timeline:
    - '2022: crates.io records the `html-query` crate creation.'
    - '2023: crates.io records version 1.2.2 of `html-query`.'
    - '1.2.2: Homebrew packages hq from the upstream `html-query-v1.2.2` GitHub archive.'
  usage:
    - >
      Users pass hq a query such as `{posts: .athing | [{title: .titleline > a}]}` to
      select HTML elements and shape the result as JSON. The documented syntax includes
      text extraction, attribute extraction, parent selection, sibling selection, and
      nested arrays or objects.
    - >
      The common use case is quick shell scraping: fetch or pipe HTML, select useful
      pieces with CSS selectors, and hand the resulting JSON to other command-line
      tools.
related-packages:
  - id: brew:htmlq
    reason: >
      Choose htmlq when you want CSS-selected HTML, text, or attributes directly; choose
      hq when you want to construct a nested JSON result from multiple selectors.
    rel: alternative
    sources:
      - https://github.com/orf/html-query
      - https://github.com/mgdm/htmlq
category: developer-tools
package-manager:
  brew: hq
package-manager-url: https://formulae.brew.sh/formula/hq
license: MIT
tags:
  - cli
  - css-selectors
  - html
  - json
  - parser
  - scraping
description: Jq, but for HTML
executables:
  - hq
provenance:
  formula: hq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
