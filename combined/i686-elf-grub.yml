id: brew:i686-elf-grub
display-name: i686-elf-grub
homepage: https://savannah.gnu.org/projects/grub
repo: https://gitlab.freedesktop.org/gnu-grub/grub.git
docs:
  - https://www.gnu.org/software/grub/manual/grub/grub.html
config-file-location:
  unix:
    - /boot/grub/grub.cfg
    - /etc/default/grub
credentials-file-location: null
history:
  adoption-history:
    - >
      GRUB's adoption is tied to Unix-like operating systems needing a portable,
      scriptable bootloader. The manual records that GNU/Linux distributions began using
      GRUB 2 to limited extents around 2007 and that multiple major distributions were
      installing it by default by the end of 2009.
    - >
      The i686-elf-grub formula is a smaller adoption story: Homebrew packages GRUB for
      i686-elf and records build-time dependencies on i686-elf-binutils and
      i686-elf-gcc, making it part of a packaged cross-development chain rather than a
      replacement for the host's bootloader.
  package-nerd-significance:
    - >
      Package nerds care because i686-elf-grub sits at the top of the cross-toolchain
      pyramid: Binutils builds objects, GCC compiles code, and GRUB turns bootloader
      components into images a machine or emulator can start.
    - >
      It is also a rare example of a bootloader packaged as a target-specific
      development tool, separating image construction from the host system's installed
      bootloader.
  project-history:
    - >
      GNU GRUB originated in 1995 when Erich Boleyn was trying to boot GNU Hurd with the
      University of Utah's Mach 4 microkernel. The GRUB manual says Erich Boleyn and
      Brian Ford designed the Multiboot Specification to avoid another incompatible PC
      boot method, and that Boleyn wrote a new bootloader after modifying the FreeBSD
      bootloader became impractical.
    - >
      In 1999, Gordon Matzigkeit and Yoshinori K. Okuji adopted GRUB as an official GNU
      package and opened development through anonymous CVS. Around 2002, Okuji started
      PUPA, a rewrite intended to make GRUB cleaner, safer, more robust, and more
      powerful; PUPA became GRUB 2 and the original line became GRUB Legacy.
    - >
      The GRUB manual describes GNU GRUB as a flexible bootloader for many architectures
      and documents the GRUB 2 shift to grub.cfg, scripting features, UUID-based search,
      modules, additional filesystems, LVM and RAID support, graphical terminals, and
      platforms beyond PC BIOS.
  related-projects:
    - >
      GRUB is closely related to the Multiboot Specification, GNU Hurd, GNU Mach, Linux,
      FreeBSD, NetBSD, OpenBSD, and chain-loaded proprietary kernels.
    - >
      For the Homebrew package, the immediate related projects are i686-elf-binutils and
      i686-elf-gcc.
  sources:
    - https://formulae.brew.sh/formula/i686-elf-grub
    - https://savannah.gnu.org/projects/grub
    - https://www.gnu.org/software/grub/manual/grub/grub.html
    - https://www.gnu.org/software/grub/manual/legacy/History.html
  summary:
    - >
      i686-elf-grub is Homebrew's target-prefixed GNU GRUB package for i686-elf. It
      packages bootloader-building tools such as grub-mkimage and grub-mkrescue for
      users building bootable images outside the host operating system's normal
      bootloader stack.
  timeline:
    - '1995: GRUB originated during work to boot GNU Hurd with GNU Mach.'
    - '1999: GRUB became an official GNU package.'
    - '2002: PUPA work began as the GRUB rewrite that became GRUB 2.'
    - '2005: GRUB Legacy 0.97 was released.'
    - >
      2009: Multiple major GNU/Linux distributions were installing GRUB 2 by default by
      year end.
    - >
      2026: Homebrew packaged i686-elf-grub with i686-elf-binutils and i686-elf-gcc as
      build-time dependencies.
  usage:
    - >
      Users reach for i686-elf-grub when building bootable images, rescue media, or
      hobby operating-system artifacts that need GRUB tools with an i686-elf toolchain.
      The executable list includes image, rescue, standalone, filesystem test,
      script-check, and environment-editing utilities.
    - >
      In this form, GRUB is less about administering a workstation boot menu and more
      about producing boot artifacts from a reproducible target-prefixed toolchain.
related-packages:
  - id: brew:i686-elf-gcc
    reason: >
      Use the matching cross-compiler to build freestanding 32-bit x86 kernels and other
      code that GRUB can place into a boot workflow.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/grub/manual/grub/grub.html
      - https://gcc.gnu.org/install/build.html
  - id: brew:i686-elf-binutils
    reason: >
      Use the matching assembler, linker, and object utilities when producing the
      i686-elf artifacts consumed by the GRUB image-building workflow.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/grub/manual/grub/html_node/Obtaining-and-Building-GRUB.html
      - https://sourceware.org/binutils/
category: system
package-manager:
  brew: i686-elf-grub
