config-file-location:
  macos: ~/Library/Application Support/Google/Chrome Dev
credentials-file-location: null
history:
  adoption-history:
    - >
      Dev became Chrome's fast public development channel, historically receiving builds
      about weekly and giving Google field feedback before code advanced to Beta and
      Stable.
    - >
      Google now positions Dev for developers and IT staff who want a substantially
      earlier view of browser and web-platform changes. Current macOS channel builds use
      separate identities and profiles, making parallel testing practical.
  package-nerd-significance:
    - >
      Dev is the middle ground for browser-channel enthusiasts: closer to active
      development than Beta, but subjected to more testing than Canary. Package managers
      make it simple to retain this distinct rung of the browser release pipeline
      alongside safer installations.
  project-history:
    - >
      Google launched Chrome and the underlying open-source Chromium project in
      September 2008. A Dev channel was already part of the distribution model when
      Chrome 1.0 reached Stable in December 2008.
    - >
      Chrome's release engineering matured into a staged pipeline. Changes surface first
      in Canary, move through Dev and Beta, and reach Stable after progressively broader
      feedback and testing.
  related-projects:
    - Google Chrome Stable
    - Google Chrome Beta
    - Google Chrome Canary
    - Chromium
    - Chrome for Testing
  sources:
    - >
      https://chromereleases.googleblog.com/2008/12/stable-release-google-chrome-is-out-of.html
    - https://chromium.googlesource.com/chromium/src/+/HEAD/docs/user_data_dir.md
    - https://developers.googleblog.com/google-chrome-chromium-and-v8-launch-today/
    - https://support.google.com/chrome/a/answer/9027636
    - https://www.chromium.org/chrome-release-channels/
  summary:
    - >
      Google Chrome Dev is Google's fast-moving developer preview channel, intended to
      expose current browser work earlier than Beta while receiving more testing than
      Canary.
  timeline:
    - '2008: Google launched Chrome and Chromium.'
    - >
      2008: The Chrome release blog documented Dev as a distinct channel when Chrome 1.0
      became Stable.
  usage:
    - >
      Use Dev to test sites, extensions, policies, and applications against browser
      changes well before they reach Stable. Google warns that it remains subject to
      bugs despite receiving testing.
    - >
      The current macOS build has a Dev-specific Application Support directory, keeping
      its browser profile separate from other Chrome channels.
