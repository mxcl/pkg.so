id: brew:faas-cli
display-name: OpenFaaS CLI
homepage: https://www.openfaas.com/
repo: https://github.com/openfaas/faas-cli
docs:
  - https://docs.openfaas.com/cli/install
config-file-location: null
credentials-file-location:
  unix:
    - ~/.openfaas/config.yml
    - .openfaas/config.yml
history:
  adoption-history:
    - >
      OpenFaaS adoption made faas-cli important because nearly every getting-started
      path goes through it. The README shows Homebrew installation, a `faas` alias, and
      commands for creating functions from templates, while the official install docs
      document cross-platform packaging for macOS, Linux, and Windows.
    - >
      The CLI's adoption is tied to the OpenFaaS gateway model: developers log in to a
      gateway, point the CLI at `OPENFAAS_URL` or a gateway flag, then deploy function
      definitions from YAML. That made it a bridge between local source trees, Docker
      registries, and Kubernetes or other OpenFaaS providers.
  package-nerd-significance:
    - >
      For package people, faas-cli is a clean example of a Go-based cloud CLI
      distributed through many channels while keeping a curl installer and release
      binaries as the canonical path. It also carries the familiar package-manager
      tension noted by its README: Homebrew is updated regularly, but may not always be
      the newest minor release.
    - >
      Its command alias matters too. Installing the package gives both `faas-cli` and
      `faas`, which is the sort of executable naming detail that package formulas, shell
      completions, and docs all have to keep aligned.
  project-history:
    - >
      The faas-cli repository was created in April 2017 as the OpenFaaS command-line
      entry point. The project README describes it as the official CLI for OpenFaaS and
      explains the original core workflow: write a handler, pick a language template,
      and let the CLI build a Docker image and deploy the function.
    - >
      As OpenFaaS matured, faas-cli became the stable user-facing tool around a broader
      platform. Its command set grew from the basic new, build, push, deploy, remove,
      and invoke lifecycle into template stores, secrets, registry login, multi-arch
      publishing, and OpenFaaS Pro authentication flows.
    - >
      The CLI also reflects OpenFaaS's packaging strategy. Official installation docs
      support a curl installer, Homebrew, Windows binaries, Chocolatey, Scoop, and
      direct release downloads, so the same tool fits local demos, CI pipelines, and
      workstation use.
  related-projects:
    - OpenFaaS is the serverless platform that faas-cli targets.
    - >
      openfaas/templates provides the default language templates used by `faas-cli new`
      and `faas-cli template pull`.
  sources:
    - https://api.github.com/repos/openfaas/faas-cli
    - https://github.com/openfaas/faas-cli
    - https://github.com/openfaas/faas-cli/blob/master/README.md
    - https://docs.openfaas.com/cli/install
    - https://github.com/openfaas/faas-cli/releases
  summary:
    - >
      faas-cli is the official command-line interface for OpenFaaS, used to create,
      build, push, deploy, invoke, and manage serverless functions.
  timeline:
    - '2017: The faas-cli repository is created as the OpenFaaS CLI.'
    - >
      2020: The CLI includes release entries for list output improvements and
      gateway/provider serialization updates.
    - '2021: Release entries add registry-login and secrets whitespace handling.'
    - >
      2026: The README continues to document core build, deploy, template, secret,
      publish, and Pro auth commands.
  usage:
    - >
      Typical use starts with `faas-cli new` to scaffold a function from a language
      template, then `faas-cli up` as the shorthand for build, push, and deploy.
      Operators use `faas-cli login`, `secret`, `store`, `invoke`, `remove`, and gateway
      flags or environment variables to work with local or remote OpenFaaS
      installations.
    - >
      The CLI is also a packaging surface for templates. Official docs describe pulling
      templates from remote Git repositories and using a template store for official,
      incubator, and community templates, which is why the tool matters beyond simply
      sending API calls to a gateway.
related-packages:
  - id: brew:docker
    reason: >
      faas-cli’s standard build command creates a function image in the local Docker
      library before it is pushed and deployed, so Docker is the direct companion for
      local builds.
    rel: adjacent_workflow
    sources:
      - https://docs.openfaas.com/cli/build/
      - https://docs.openfaas.com/cli/templates/
      - https://docs.docker.com/reference/cli/docker/image/build/
  - id: brew:kubernetes-cli
    reason: >
      kubectl is used alongside faas-cli to inspect or port-forward an OpenFaaS gateway
      and manage the Kubernetes cluster on which OpenFaaS runs.
    rel: adjacent_workflow
    sources:
      - https://github.com/openfaas/faas-netes/blob/master/chart/openfaas/README.md
      - https://kubernetes.io/docs/reference/kubectl/
category: developer-tools
package-manager:
  brew: faas-cli
  chocolatey: faas-cli
  nix: faas-cli
  scoop: main/faas-cli
package-manager-url: https://formulae.brew.sh/formula/faas-cli
license: MIT
tags:
  - cli
  - deployment
  - functions
  - openfaas
  - serverless
description: CLI for templating and/or deploying FaaS functions
executables:
  - faas
  - faas-cli
provenance:
  formula: faas-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
