id: brew:itpp
display-name: IT++
homepage: https://itpp.sourceforge.net/
repo: https://git.code.sf.net/p/itpp/git
docs:
  - https://itpp.sourceforge.net/4.3.1/index.html
  - https://itpp.sourceforge.net/devel/installation.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      IT++ was developed and widely used by researchers in communications, both in
      industry and universities, according to its own documentation. Its adoption
      followed the needs of simulation-heavy research: linear algebra, signal
      processing, coding, modulation, channel models, and statistics in one C++ library.
    - >
      Homebrew, MacPorts, and openSUSE-family packaging kept the library available for
      users who needed old research code or command-line build integration through
      `itpp-config`, even as many newer research workflows moved toward Python, MATLAB,
      or specialized frameworks.
  package-nerd-significance:
    - >
      IT++ is a package-nerd time capsule from the SourceForge scientific-C++ era:
      Doxygen docs, `itpp-config`, optional numerical backends, and a research-domain
      API that predates much of the Python scientific stack's dominance.
    - >
      Its value in a package database is less about daily CLI use and more about
      preserving buildability for papers, simulations, and legacy communications code.
  project-history:
    - >
      The IT++ documentation says the library originated in the former Department of
      Information Theory at Chalmers University of Technology in Gothenburg, Sweden. The
      name reflects that origin: Information Theory plus C++.
    - >
      The project moved into SourceForge-era open-source distribution and released under
      the GNU GPL. SourceForge release files show a long release trail beginning in 2001
      and continuing through the 4.x series, with 4.3.1 published on 2013-07-06.
    - >
      The documentation notes that in 2005, 2006, and 2007 IT++ was developed as part of
      NEWCOM, the European Network of Excellence in Wireless Communications. That places
      the library squarely in academic and industry communications research rather than
      general application development.
  related-projects:
    - >
      BLAS, LAPACK, FFTW, ATLAS, Intel MKL, and AMD ACML are documented acceleration or
      numerical backends.
    - >
      MATLAB, GNU Octave, and SciPy are named by the project as comparable environments
      for its vector and matrix kernel.
    - NEWCOM connects IT++ to European wireless-communications research.
  sources:
    - https://formulae.brew.sh/formula/itpp
    - https://itpp.sourceforge.net/4.3.1/index.html
    - https://itpp.sourceforge.net/devel/installation.html
    - https://sourceforge.net/p/itpp/git/
    - https://sourceforge.net/projects/itpp/
    - https://sourceforge.net/projects/itpp/files/itpp/
  summary:
    - >
      IT++ is a C++ library of mathematical, signal-processing, and communications
      classes and functions. Its strongest identity is as a research-oriented
      communications-simulation library with a vector/matrix kernel that feels familiar
      to MATLAB, GNU Octave, and SciPy users.
  timeline:
    - '2001: SourceForge release files show early IT++ releases.'
    - '2005: IT++ development was part of NEWCOM.'
    - '2006: IT++ development continued under NEWCOM.'
    - '2007: IT++ development continued under NEWCOM.'
    - '2013: IT++ 4.3.1 was published and Doxygen documentation was generated for that release.'
  usage:
    - >
      Developers link C++ programs against IT++ for vector and matrix operations,
      signal-processing routines, and communications-system simulation. The project can
      use BLAS, LAPACK, FFTW, ATLAS, MKL, or ACML for speed and accuracy, while also
      allowing reduced-functionality builds without those libraries.
    - >
      The packaged executable `itpp-config` exists to report compiler and linker flags
      for builds using the installed library.
related-packages: []
category: science
