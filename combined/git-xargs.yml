id: brew:git-xargs
display-name: git-xargs
homepage: https://github.com/gruntwork-io/git-xargs
repo: https://github.com/gruntwork-io/git-xargs
docs:
  - https://github.com/gruntwork-io/git-xargs#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is concentrated in teams that manage many GitHub repositories, especially
      infrastructure and platform groups. Package availability through Homebrew and
      Scoop made it easier to treat the tool as a workstation utility rather than a
      one-off script copied between organizations.
  package-nerd-significance:
    - >
      For package-manager users, git-xargs represents the small but valuable class of
      CLIs that automate repository hygiene at fleet scale. It is less a Git replacement
      than a GitHub operations multiplier.
  project-history:
    - >
      The project appeared as a Go CLI in Gruntwork's open source tooling around 2021,
      with tagged releases beginning at v0.0.1 on April 20, 2021. Its README frames the
      tool around repeated multi-repository jobs such as adding files, renaming
      products, upgrading Terraform modules, or adding CI configuration across many
      repositories.
  related-projects:
    - Git provides the underlying repository operations.
    - >
      GitHub provides the repository hosting and pull-request workflow that git-xargs
      automates.
    - Gruntwork maintains the project as part of its infrastructure-tooling ecosystem.
  sources:
    - https://formulae.brew.sh/formula/git-xargs
    - https://github.com/gruntwork-io/git-xargs
    - https://github.com/gruntwork-io/git-xargs/releases
    - https://raw.githubusercontent.com/gruntwork-io/git-xargs/master/README.md
  summary:
    - >
      git-xargs is a Gruntwork command-line tool for applying one command or script
      across many GitHub repositories. Its niche is organizational repository
      maintenance: cloning targets, running an operation, committing changes, opening
      pull requests, and reporting the outcome.
  timeline:
    - '2021: First tagged releases of git-xargs.'
    - '2021: README examples described organization-wide pull-request generation.'
    - '2021: Homebrew installation documented alongside release binaries and Go installation.'
  usage:
    - >
      Practitioners provide a command or script plus repository selectors, often an
      organization or a file of repositories. git-xargs then performs the repetitive
      GitHub workflow around that command: clone, change, commit, pull request, and
      summarize.
related-packages:
  - id: brew:multi-gitter
    reason: >
      Choose multi-gitter for the same scripted bulk-change and pull-request workflow
      when you also need GitLab, Gitea, or Bitbucket support instead of a GitHub-only
      tool.
    rel: alternative
    sources:
      - https://github.com/gruntwork-io/git-xargs
      - https://github.com/lindell/multi-gitter
category: developer-tools
package-manager:
  brew: git-xargs
  scoop: main/git-xargs
package-manager-url: https://formulae.brew.sh/formula/git-xargs
license: Apache-2.0
tags:
  - automation
  - bulk-operations
  - cli
  - git
  - github
description: CLI for making updates across multiple Github repositories with a single command
executables:
  - git-xargs
provenance:
  formula: git-xargs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
