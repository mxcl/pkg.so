id: brew:kew
display-name: kew
homepage: https://github.com/ravachol/kew
repo: https://github.com/ravachol/kew
docs:
  - https://github.com/ravachol/kew#readme
config-file-location:
  linux:
    - ~/.config/kew/kewrc
    - ~/.config/kew/kewstaterc
  macos:
    - ~/Library/Preferences/kew/kewrc
    - ~/Library/Preferences/kew/kewstaterc
credentials-file-location: null
history:
  adoption-history:
    - >
      kew moved from a niche terminal-audio project into distribution packaging quickly
      enough to appear in Homebrew and Linux distribution package sets. That adoption
      pattern fits terminal music tools: a small upstream repo becomes much easier to
      try once package managers hide the codec and desktop-integration dependencies.
  package-nerd-significance:
    - >
      kew sits in the lineage of terminal music players, but it is notable for combining
      shell-first invocation with visual terminal features that became more practical as
      sixel-capable and GPU-accelerated terminals spread. For packagers, the interesting
      part is dependency stitching across audio codecs, metadata libraries, cover
      rendering, notifications, and OS-specific media controls.
  project-history:
    - >
      The project was developed by ravachol and documented on GitHub as a terminal music
      player. Its README emphasizes auto-generated playlists from artist, album, or song
      words, no telemetry by default, gapless playback, sixel-capable cover art,
      spectrum visualization, MPRIS-style desktop integration, and broad Unix-like
      platform support.
    - >
      Release discussions show a rapid evolution from a small Linux terminal player into
      a broader shell music app. The v3.0 release-candidate discussion called out macOS
      support and dependency changes; later release notes for 4.0 described a redesigned
      audio module, ASCII visualizations, Discord integration, macOS media-key support,
      AIFF support, and Arch Linux packaging.
  related-projects:
    - >
      kew belongs near other terminal music players and local-library tools rather than
      streaming clients. Its README also points packagers toward Repology and downstream
      package repositories as part of the project workflow.
  sources:
    - https://formulae.brew.sh/formula/kew
    - https://github.com/ravachol/kew
    - https://github.com/ravachol/kew/discussions/180
    - https://github.com/ravachol/kew/releases
    - https://manpages.ubuntu.com/manpages/questing/man1/kew.1.html
  summary:
    - >
      kew is a terminal music player centered on local music libraries, fast fuzzy-ish
      command invocation, and privacy-oriented offline playback. Its appeal is
      deliberately old-school: play albums and folders from a shell, but with modern
      terminal luxuries such as covers, visualizers, themes, desktop integration, and
      playlist editing.
  timeline:
    - >
      2024: Public discussion introduced kew to a wider terminal/Linux audience as a
      small local-library music player.
    - >
      2025: v3.0 release-candidate notes documented macOS support and larger dependency
      changes.
    - >
      2026: Homebrew packaged kew as a command-line music player, while the upstream
      README directed active development and issue tracking to Codeberg.
  usage:
    - >
      Users run kew with words from an artist, album, song, directory, or playlist name;
      kew builds a queue from the first matching library location. It is used by people
      who want local-library playback without a heavyweight GUI or recommendation
      service.
related-packages:
  - id: brew:cmus
    reason: >
      Choose cmus when you prefer a mature ncurses player with a highly scriptable Unix
      interface; choose kew for richer terminal artwork, visualizers, mouse interaction,
      and cross-platform desktop integration.
    rel: alternative
    sources:
      - https://kewplayer.com/
      - https://cmus.github.io/
      - https://github.com/cmus/cmus#readme
  - id: brew:mpd
    reason: >
      Choose Music Player Daemon when playback should run as a persistent headless
      service controlled by interchangeable local or remote clients; choose kew for an
      integrated interactive terminal player.
    rel: alternative
    sources:
      - https://kewplayer.com/docs.html
      - https://www.musicpd.org/
      - https://mpd.readthedocs.io/en/stable/user.html
category: media
