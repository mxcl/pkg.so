id: brew:ledit
display-name: Ledit
homepage: https://pauillac.inria.fr/~ddr/ledit/
repo: https://github.com/chetmurthy/ledit
docs:
  - https://github.com/chetmurthy/ledit#readme
config-file-location:
  unix:
    - $LEDITRC
    - ~/.leditrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Ledit stayed in the Unix package ecosystem as a compact tool rather than a large
      application: the input package facts list Homebrew, Debian, MacPorts, Nix, and
      Ubuntu packaging. That footprint reflects the usual adoption path for small
      terminal helpers used by OCaml and command-line users.
  package-nerd-significance:
    - >
      For package maintainers, Ledit is an example of the old but durable
      terminal-helper class: tiny source, native-code language dependencies, man-page
      behavior, and recurring build-system updates to survive language-runtime churn.
  project-history:
    - >
      The project originated at Inria as an OCaml/Camlp4-era utility by Daniel de
      Rauglaudre. Its changelog records open-source licensing in 2001, years of
      compatibility work for Camlp4/Camlp5 and OCaml, and the addition of a user
      `.leditrc` binding file in version 2.00 on 2008-01-18.
    - >
      The GitHub-hosted continuation preserved the Inria codebase and kept it buildable
      for newer OCaml releases, including updates for recent OCaml versions in 2018,
      OCaml 5.0 build work in 2022, and opam/build fixes in 2025.
  related-projects:
    - >
      Ledit sits near other command wrappers and line editors such as `rlwrap`, but its
      implementation and packaging history are tied to OCaml, Camlp5, and Inria's OCaml
      ecosystem.
  sources:
    - https://github.com/chetmurthy/ledit
    - https://pauillac.inria.fr/~ddr/ledit/
    - https://raw.githubusercontent.com/chetmurthy/ledit/master/CHANGES
  summary:
    - >
      Ledit is a small OCaml line editor for wrapping interactive commands with
      Emacs-like control keys, shell-style editing, and command history behavior.
  timeline:
    - '2001: Changelog records the addition of an open-source license.'
    - >
      2008: Version 2.00 added support for a home-directory `.leditrc` or `LEDITRC`
      binding file.
    - >
      2018: Version 2.04 was distributed on the Inria page with updates for newer OCaml
      versions.
    - '2022: Version 2.06 updated the build for OCaml 5.0.0.'
    - '2025: Versions 2.07 and 2.08 shipped build and opam maintenance fixes.'
  usage:
    - >
      Users run `ledit` in front of another interactive command to get line editing,
      history navigation, reverse search, and configurable key bindings without changing
      the wrapped program.
related-packages:
  - id: brew:rlwrap
    reason: >
      rlwrap is the closest alternative for adding editing and persistent history to
      interactive commands, using GNU Readline and offering programmable filters instead
      of Ledit's OCaml implementation.
    rel: alternative
    sources:
      - https://github.com/chetmurthy/ledit#readme
      - https://github.com/hanslub42/rlwrap#readme
category: developer-tools
package-manager:
  brew: ledit
  debian: ledit
  macports: ledit
  nix: ledit
  ubuntu: ledit
package-manager-url: https://formulae.brew.sh/formula/ledit
license: BSD-3-Clause
tags:
  - cli
  - interactive-shell
  - line-editor
  - ocaml
  - terminal
description: Line editor for interactive commands
executables:
  - ledit
provenance:
  formula: ledit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
