id: brew:fairy-stockfish
display-name: Fairy-Stockfish
homepage: https://fairy-stockfish.github.io/
repo: https://github.com/fairy-stockfish/Fairy-Stockfish
docs:
  - https://github.com/fairy-stockfish/Fairy-Stockfish/wiki
  - https://fairy-stockfish.github.io/
  - https://github.com/fairy-stockfish/Fairy-Stockfish#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Fairy-Stockfish is adopted mostly by the chess-variant ecosystem rather than
      ordinary chess users. The README points users to compatible GUIs and online play
      or analysis through pychess, lishogi, and lichess accounts, and describes
      `pyffish` being used by the pychess-variants server backend.
  package-nerd-significance:
    - >
      For package maintainers, Fairy-Stockfish is the variant counterpart to the
      familiar Stockfish package: a command-line engine binary with protocol
      compatibility, GPL licensing, optional neural-network assets, and a user base that
      cares about exact builds and engine strength.
  project-history:
    - >
      The official README describes Fairy-Stockfish as a Stockfish-derived engine
      designed for fairy chess variants and extensibility. Official releases visible
      through GitHub begin with the UEC11 and 10.x generation in 2019, then continue
      through Fairy-Stockfish 11 in 2020 and 13/14 releases in 2021.
    - >
      The project broadened from a chess executable into a variant-engine platform. Its
      README documents UCI, UCCI, USI, UCI-cyclone, and CECP/XBoard support,
      user-defined variant configuration, NNUE network support, Python and JavaScript
      bindings, and WebAssembly ports.
  related-projects:
    - Stockfish, pyffish, ffish.js, fairy-stockfish.wasm, pychess-variants, lishogi, lichess
  sources:
    - https://github.com/fairy-stockfish/Fairy-Stockfish
    - https://raw.githubusercontent.com/fairy-stockfish/Fairy-Stockfish/master/README.md
    - https://github.com/fairy-stockfish/Fairy-Stockfish/wiki
    - https://fairy-stockfish.github.io/
    - https://api.github.com/repos/fairy-stockfish/Fairy-Stockfish/releases?per_page=30
  summary:
    - >
      Fairy-Stockfish is a chess-variant engine derived from Stockfish. It keeps the
      Stockfish search lineage but extends it toward fairy chess, regional chess-like
      games, large boards, user-defined variants, and multiple engine protocols.
  timeline:
    - '2019: Official GitHub releases include UEC11 and Fairy-Stockfish 10.x.'
    - '2020: Fairy-Stockfish 11, 11.1, and 11.2 released.'
    - '2021: Fairy-Stockfish 13, 13.1, 14, and 14.0.1 XQ released.'
  usage:
    - >
      Users run Fairy-Stockfish as an engine under a compatible GUI, connect it to
      online variant platforms, or use its bindings and WebAssembly ports for move
      generation, analysis, and game-rule handling. Its variant list covers regional
      games such as Xiangqi, Shogi, Janggi, Makruk, and many chess variants, plus
      user-defined rules.
related-packages:
  - id: brew:stockfish
    reason: >
      Choose Stockfish for an engine focused on orthodox chess; choose Fairy-Stockfish
      when regional games, fairy-chess rules, larger boards, or configurable variants
      are required.
    rel: alternative
    sources:
      - https://stockfishchess.org/
      - https://fairy-stockfish.github.io/about/
      - https://github.com/fairy-stockfish/Fairy-Stockfish
  - id: brew:xboard
    reason: >
      Fairy-Stockfish officially supports the CECP/XBoard protocol, and its
      documentation provides setup guidance for using XBoard as a graphical front end.
    rel: adjacent_workflow
    sources:
      - https://fairy-stockfish.github.io/gui/
      - https://www.gnu.org/software/xboard/
  - id: brew:fairymax
    reason: >
      Choose Fairy-Max when a very small, text-configurable WinBoard engine is
      preferable; Fairy-Stockfish offers the stronger Stockfish-derived search, more
      protocols, bindings, and NNUE support.
    rel: alternative
    sources:
      - https://fairy-stockfish.github.io/
      - https://home.hccnet.nl/h.g.muller/CVfairy.html
category: games
package-manager:
  brew: fairy-stockfish
  debian: fairy-stockfish
  ubuntu: fairy-stockfish
package-manager-url: https://formulae.brew.sh/formula/fairy-stockfish
license: GPL-3.0-or-later
tags:
  - chess
  - chess-variants
  - cli
  - engine
  - uci
  - xboard
description: Strong open source chess variant engine (with largeboards support)
executables:
  - fairy-stockfish
provenance:
  formula: fairy-stockfish
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
