id: brew:cava
display-name: CAVA
homepage: https://github.com/karlstav/cava
repo: https://github.com/karlstav/cava
docs:
  - https://github.com/karlstav/cava#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/cava/config
    - ~/.config/cava/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents package-manager installs for Arch, Ubuntu/Debian,
      and Homebrew, and the supplied package facts add Alpine, Fedora, MacPorts, Nix,
      Ubuntu, Winget, and openSUSE. That is unusually broad adoption for a terminal
      visual-effect tool.
  package-nerd-significance:
    - >
      CAVA is significant because it turns terminal audio plumbing into visible
      feedback. For maintainers it touches many platform-specific audio stacks while
      remaining a familiar CLI package, which makes it a neat intersection of Unix
      terminals, desktop audio, and cross-platform packaging.
  project-history:
    - >
      The README credits Karl Stavestrand and thanks several early contributors for
      major early-development work. Over time it grew beyond an ALSA-oriented console
      visualizer into a cross-platform project with PipeWire, PulseAudio, ALSA, Sndio,
      OSS, JACK, squeezelite, Core Audio, Windows, ncurses, SDL, raw output, and a
      cavacore library.
  related-projects:
    - >
      Related project surfaces include cavacore for reusable processing and cava2sse for
      exposing raw values as server-sent events. Related system components include
      PipeWire, PulseAudio, ALSA, Sndio, OSS, JACK, Core Audio, ncurses, and SDL2.
  sources:
    - https://api.github.com/repos/karlstav/cava
    - https://github.com/karlstav/cava
    - https://github.com/karlstav/cava#readme
    - https://formulae.brew.sh/api/formula/cava.json
    - https://github.com/karlstav/cava/releases
  summary:
    - >
      CAVA is the Cross-platform Audio Visualizer, a bar spectrum visualizer for
      terminal or desktop SDL output. The README says it works on Linux, FreeBSD, macOS,
      and Windows and is designed to look responsive and aesthetic for music
      visualization rather than scientific analysis.
  timeline:
    - '2026: The README documents Linux, FreeBSD, macOS, and Windows support.'
    - '2026: Homebrew formula packages CAVA 1.0.0 from the official release archive.'
    - >
      2026: Supplied package facts show CAVA available from Homebrew, Debian-family,
      RPM-family, MacPorts, Nix, Arch, Winget, and openSUSE package sets.
  usage:
    - >
      Users run cava to visualize audio input in the terminal, use -p to choose a config
      file, and control sensitivity, bar width, colors, reloads, and quit from the
      keyboard. A default config is created in $XDG_CONFIG_HOME/cava/config or
      ~/.config/cava/config on first launch.
related-packages:
  - id: brew:pipewire
    reason: >
      Use PipeWire as CAVA's capture source on modern Linux systems; CAVA documents
      native PipeWire input and PipeWire provides the underlying audio graph.
    rel: adjacent_workflow
    sources:
      - https://github.com/karlstav/cava#pipewire
      - https://docs.pipewire.org/
  - id: brew:mpd
    reason: >
      Use Music Player Daemon with a FIFO audio output when you want CAVA to visualize
      MPD playback directly through its documented FIFO input method.
    rel: adjacent_workflow
    sources:
      - https://github.com/karlstav/cava#mpd
      - https://mpd.readthedocs.io/en/stable/user.html
category: media
package-manager:
  apk: cava
  brew: cava
  debian: cava
  dnf: cava
  macports: cava
  nix: cava
  pacman: cava
  ubuntu: cava
  winget: karlstav.cava
  zypper: cava
package-manager-url: https://formulae.brew.sh/formula/cava
license: MIT
tags:
  - alsa
  - audio
  - cli
  - spectrum-analyzer
  - terminal
  - visualizer
description: Console-based Audio Visualizer for ALSA
executables:
  - cava
provenance:
  formula: cava
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
