id: brew:immich-cli
display-name: immich-cli
homepage: https://immich.app/docs/features/command-line-interface
repo: https://github.com/immich-app/immich
docs:
  - https://docs.immich.app/features/command-line-interface
config-file-location:
  unix: ~/.config/immich/auth.yml
credentials-file-location:
  unix: ~/.config/immich/auth.yml
history:
  adoption-history:
    - >
      immich-cli adoption follows Immich adoption. Repository metadata shows Immich with
      a very large GitHub audience, and Homebrew formula analytics show the CLI
      receiving thousands of installs over the measured 365-day formula window. The
      input metadata also records Nix packaging.
    - >
      The CLI occupies a pragmatic role in the Immich ecosystem: it is the supported
      tool for bulk upload and scripting, while the official docs point users with
      Google Photos Takeout needs to the community-maintained immich-go tool.
  package-nerd-significance:
    - >
      immich-cli is package-nerd significant because it is a companion CLI for a
      fast-moving self-hosted application, and its packaging spans npm, Docker,
      Homebrew, and Nix. It also demonstrates the common tradeoff that led to immich-go:
      official Node-based CLIs are easy for project maintainers to ship from a
      TypeScript monorepo, while some users prefer static single-binary migration tools.
  project-history:
    - >
      Immich's GitHub repository was created on 2022-02-03 and grew into a high-profile
      self-hosted alternative to cloud photo libraries. The CLI became the official
      automation surface for uploading photos and videos, checking server information,
      and authenticating with API keys outside the web and mobile clients.
    - >
      The @immich/cli package metadata records publication history beginning in 2023.
      Official documentation describes the migration from a legacy npm package named
      immich to the scoped @immich/cli package, plus a Docker invocation path for users
      who do not want to install Node.js locally.
  related-projects:
    - >
      immich-cli is part of the Immich monorepo and depends on the Immich server API.
      The official CLI docs recommend immich-go for Google Photos Takeout import
      workflows, making the two tools related but not equivalent.
  sources:
    - https://docs.immich.app/features/command-line-interface
    - https://formulae.brew.sh/formula/immich-cli
    - https://github.com/immich-app/immich
    - https://www.npmjs.com/package/@immich/cli
  summary:
    - >
      immich-cli is the official command-line interface for Immich, the self-hosted
      photo and video management project. It is distributed from the Immich monorepo as
      the @immich/cli npm package and as an immich-cli container image.
  timeline:
    - '2022-02-03: Immich GitHub repository created.'
    - '2023-11-19: @immich/cli npm package metadata records its package creation date.'
    - '2025-10-01: Immich v2.0.0 stable release published.'
    - >
      2026: Official CLI docs describe @immich/cli installation, Docker usage, auth.yml
      credentials, and upload commands.
  usage:
    - >
      The official docs document login with an Immich server URL and API key, storage of
      credentials in auth.yml under ~/.config/immich by default, upload of files and
      directories, recursive upload, dry runs, album creation, duplicate handling,
      ignore globs, concurrency, JSON output, and environment-variable configuration.
related-packages:
  - id: brew:immich-go
    reason: >
      Choose immich-go for Google Photos Takeout imports or a standalone Go binary
      without Node.js; Immich's official CLI documentation specifically recommends it
      for that migration workflow.
    rel: alternative
    sources:
      - https://docs.immich.app/features/command-line-interface
      - https://github.com/simulot/immich-go
category: media
package-manager:
  brew: immich-cli
  nix: immich-cli
package-manager-url: https://formulae.brew.sh/formula/immich-cli
license: AGPL-3.0-only
tags:
  - backup
  - cli
  - immich
  - photos
  - upload
description: Command-line interface for self-hosted photo manager Immich
executables:
  - immich
provenance:
  formula: immich-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
