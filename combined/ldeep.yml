id: brew:ldeep
display-name: ldeep
homepage: https://github.com/franc-pentest/ldeep
repo: https://github.com/franc-pentest/ldeep
docs:
  - https://github.com/franc-pentest/ldeep#readme
config-file-location:
  unix: /etc/krb5.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The package appears in Homebrew and Nix, suggesting targeted adoption by
      penetration testers who install repeatable security-tool environments rather than
      broad general-purpose developer usage.
  package-nerd-significance:
    - >
      For package maintainers, ldeep is a typical niche security CLI: valuable to a
      specific workflow, mostly documented by its README, and best categorized by
      executable behavior rather than a large release history.
  project-history:
    - >
      The franc-pentest GitHub repository presents ldeep as an LDAP enumeration utility
      and provides the package README as the main documentation surface.
    - >
      The public tag history includes a 1.0.0 tag on an October 2018 commit and later
      1.0.x tags, but the project has a comparatively thin public narrative beyond
      repository metadata, README usage, and package-manager entries.
  related-projects:
    - >
      Related tools are LDAP and Active Directory enumeration utilities used in
      penetration-testing toolchains, including command-line LDAP clients and
      security-focused directory scanners.
  sources:
    - https://formulae.brew.sh/formula/ldeep
    - https://github.com/franc-pentest/ldeep
    - https://github.com/franc-pentest/ldeep/releases/tag/1.0.0
  summary:
    - >
      ldeep is a Python-based LDAP enumeration tool for security testing and Active
      Directory assessment workflows.
  timeline:
    - '2018-10: Public 1.0.0 tag appears in the GitHub repository history.'
    - '2018-2020s: 1.0.x tags continue the package line visible from GitHub tags.'
    - >
      2020s: Homebrew and Nix package entries make the tool installable through common
      reproducible security workstations.
  usage:
    - >
      ldeep is used during LDAP and Active Directory enumeration to collect directory
      information useful in security audits and penetration tests.
related-packages: []
category: security
package-manager:
  brew: ldeep
  nix: ldeep
package-manager-url: https://formulae.brew.sh/formula/ldeep
license: MIT
tags:
  - cli
  - enumeration
  - ldap
  - pentesting
  - security
description: LDAP enumeration utility
executables:
  - ldeep
provenance:
  formula: ldeep
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
