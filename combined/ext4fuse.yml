id: brew:ext4fuse
display-name: ext4fuse
homepage: https://github.com/gerard/ext4fuse
repo: https://github.com/gerard/ext4fuse
docs:
  - https://github.com/gerard/ext4fuse#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists Homebrew, MacPorts, and Nix packages. The
      README itself recommends Homebrew installation for OS X and FreeBSD ports for
      FreeBSD users, showing a package-manager-oriented adoption path from the project's
      own documentation.
  package-nerd-significance:
    - >
      ext4fuse is the kind of small system utility package users install when they need
      one specific cross-filesystem bridge. Its read-only design lowers the risk of
      exposing Linux ext4 volumes on macOS and other FUSE-capable systems.
  project-history:
    - >
      The GitHub repository was created in 2010 and describes ext4fuse as an EXT4
      implementation for FUSE. The README emphasizes read-only access as a deliberate
      safety property and documents tested or expected use on OS X, Linux, FreeBSD, and
      OpenSolaris.
  related-projects:
    - ext4fuse depends on FUSE and pkg-config for builds.
    - >
      The README references osxfuse/fuse4x style FUSE implementations and FreeBSD ports
      packaging.
  sources:
    - https://api.github.com/repos/gerard/ext4fuse
    - https://github.com/gerard/ext4fuse#readme
    - source_facts.package-manager
  summary:
    - >
      ext4fuse is a read-only EXT4 implementation for FUSE, originally motivated by
      reading Linux partitions from OS X while also working on other FUSE
      implementations.
  timeline:
    - '2010: GitHub API reports gerard/ext4fuse repository creation.'
    - '2010s: README documents OS X Homebrew and FreeBSD ports installation paths.'
    - '2020: Recent commits include fixes for sparse-file read handling.'
    - '2021: GitHub API reports the latest repository push in April 2021.'
  usage:
    - >
      The README documents mounting an ext4 partition with 'ext4fuse <device>
      <mountpoint>', compiling with make or gmake, and collecting logs for bug reports
      with the FUSE logfile option.
related-packages:
  - id: brew:libfuse
    reason: >
      Use libfuse as the Linux userspace FUSE interface beneath filesystem
      implementations such as ext4fuse.
    rel: adjacent_workflow
    sources:
      - https://github.com/gerard/ext4fuse#readme
      - https://github.com/libfuse/libfuse
      - https://libfuse.github.io/doxygen/
category: system
package-manager:
  brew: ext4fuse
  macports: ext4fuse
package-manager-url: https://formulae.brew.sh/formula/ext4fuse
license: GPL-2.0-only
tags:
  - cli
  - ext4
  - filesystem
  - fuse
  - macos
  - read-only
description: Read-only implementation of ext4 for FUSE
executables:
  - ext4fuse
provenance:
  formula: ext4fuse
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
