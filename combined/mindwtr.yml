id: cask:mindwtr
display-name: Mindwtr
homepage: https://github.com/dongdongbh/Mindwtr
repo: https://github.com/dongdongbh/Mindwtr
docs:
  - https://docs.mindwtr.app/
config-file-location:
  linux: ~/.config/mindwtr/config.toml
  macos: ~/Library/Application Support/mindwtr/config.toml
  windows: '%APPDATA%/mindwtr/config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Mindwtr is available across Windows, macOS, Linux, iPhone, Android, and the web.
      Its local-first design and optional iCloud, Dropbox, shared-folder, self-hosted,
      and WebDAV synchronization appeal to users who want control over task data.
  package-nerd-significance:
    - >
      Mindwtr combines a consumer GTD application with unusually broad distribution and
      integration surfaces: native desktop and mobile builds, an offline-capable web
      app, package-manager installations, a local REST API, a CLI, and an MCP server.
      Its plain TOML configuration and documented SQLite and JSON data paths make it
      friendly to backup and automation workflows.
  project-history:
    - >
      Mindwtr was created as a free, open-source implementation of the Getting Things
      Done method. Its name abbreviates “mind like water,” describing the GTD goal of
      maintaining a trusted external system rather than remembering tasks mentally.
  related-projects:
    - >
      The project imports data from Todoist, TickTick, DGT GTD, OmniFocus, and Apple
      Reminders, and integrates with Obsidian, calendars, AI providers, and MCP-capable
      assistants.
  sources:
    - https://docs.mindwtr.app/
    - https://docs.mindwtr.app/data-sync/
    - https://github.com/dongdongbh/Mindwtr
    - source_facts.description
  summary:
    - >
      Mindwtr is a free, open-source, local-first task manager implementing the Getting
      Things Done methodology on desktop, mobile, and the web.
  timeline:
    - '2025: Mindwtr became publicly available as an open-source local-first GTD application.'
    - >
      2026: The documentation moved from the GitHub wiki to docs.mindwtr.app as the
      project expanded its desktop, mobile, synchronization, API, CLI, and MCP features.
    - '2026-08: Homebrew Cask input records version 1.2.0.'
  usage:
    - >
      Users capture tasks and ideas, clarify them into projects and next actions, work
      from Focus views, and conduct daily or weekly reviews. Core task data stays in a
      local SQLite database, with optional synchronization and JSON backup mechanisms.
category: productivity
package-manager:
  brew-cask: mindwtr
package-manager-url: https://formulae.brew.sh/cask/mindwtr
tags:
  - cross-platform
  - gtd
  - local-first
  - mcp
  - offline
  - open-source
  - sync
  - task-management
description: Local-first GTD productivity tool
applications:
