id: cask:minmaxcal
display-name: MinMaxCal
homepage: https://mikemcquaid.com/minmaxcal/
repo: https://github.com/MikeMcQuaid/MinMaxCal
docs:
  - https://github.com/MikeMcQuaid/MinMaxCal#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MinMaxCal is primarily maintained for its author's personal use and is described
      as stable and mostly in maintenance mode. It is distributed through the Homebrew
      cask minmaxcal as well as signed and notarized release archives.
  package-nerd-significance:
    - >
      The application is a compact example of a native macOS menu-bar tool built around
      EventKit rather than another calendar account or synchronization service.
    - >
      Its documented workflow treats Homebrew as the updater: releases contain no
      built-in update mechanism, so package-manager upgrades are an intentional part of
      the product design.
  project-history:
    - >
      Mike McQuaid developed MinMaxCal as an open-source macOS response to calendar
      applications that are either easy to overlook or overly dependent on dismissible
      notifications.
    - >
      The project combines a minimal menu-bar countdown with an intentionally maximal
      full-screen alert when an accepted event begins or a reminder becomes due.
  related-projects:
    - Apple Calendar and Reminders provide the local EventKit data read by MinMaxCal.
    - >
      Zoom, Microsoft Teams, Google Meet, Jitsi, and FaceTime links can be opened using
      configured preferred applications.
  sources:
    - https://github.com/MikeMcQuaid/MinMaxCal#readme
    - source_facts.package-manager
    - source_facts.repo
  summary:
    - >
      MinMaxCal is a native macOS menu-bar calendar and reminder application. It
      displays the next item compactly, then can cover every display with a prominent
      actionable alert when the item is due.
  timeline:
    - >
      Current project status: The official README describes the application as stable
      and mostly in maintenance mode.
  usage:
    - >
      Users grant access to macOS calendars and optionally reminders, choose visible
      lists, and configure takeover triggers, sounds, snooze durations, meeting-link
      applications, and menu-bar display behavior.
    - >
      The application reads locally managed EventKit data and requires no separate
      MinMaxCal account. It can start at login and provides Join or Complete actions
      directly from its agenda and takeover view.
related-packages:
  - id: cask:itsycal
    reason: >
      Choose Itsycal for a conventional tiny month calendar with event creation and
      meeting joining; choose MinMaxCal when prominent full-screen due-time alerts are
      the priority.
    rel: alternative
    sources:
      - https://github.com/MikeMcQuaid/MinMaxCal
      - https://www.mowglii.com/itsycal/
