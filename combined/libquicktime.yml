id: brew:libquicktime
display-name: libquicktime
homepage: https://libquicktime.sourceforge.net/
repo: https://sourceforge.net/p/libquicktime/git/ci/master/tree
docs:
  - https://libquicktime.sourceforge.net/
  - https://libquicktime.sourceforge.net/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libquicktime was packaged by Unix distributions because older video applications
      needed a LGPL library for QuickTime containers without bundling every codec. The
      input package-manager metadata lists Homebrew, Debian, Fedora, MacPorts, Ubuntu,
      and openSUSE packages, and the SourceForge file page records the 1.2.4 tarball as
      the downloadable source release.
  package-nerd-significance:
    - >
      libquicktime is a fossil from the pre-FFmpeg-everywhere multimedia stack. It is
      significant because it shows how distributions used modular codec libraries and
      LGPL container code to make proprietary-era media formats usable on free Unix
      desktops.
  project-history:
    - >
      The SourceForge project was registered on 2002-02-08 and its news page records the
      0.9.0 release on 2002-05-21. The README describes libquicktime as based on
      quicktime4linux, but with autoconf, automake, libtool, system codec-library
      detection, dynamically loadable codecs, and source compatibility goals for
      quicktime4linux applications such as Cinelerra and xmovie.
    - >
      The project sits in the early-2000s Linux multimedia lineage, when QuickTime, AVI,
      MP4, and codec support were fragmented across libraries, plugins, and external
      codec packages. Its design reflects that era: split codecs from the core library,
      depend on system JPEG, Ogg Vorbis, libpng, libdv, and similar libraries, and
      expose command-line utilities for transcoding, remuxing, dumping, and stream
      preparation.
  related-projects:
    - >
      libquicktime is directly related to quicktime4linux, Cinelerra, xmovie, FFmpeg
      plugin code, libdv, libpng, libjpeg, and Ogg Vorbis libraries. It also belongs to
      the same historical multimedia packaging neighborhood as other SourceForge-era
      video libraries.
  sources:
    - https://formulae.brew.sh/formula/libquicktime
    - https://libquicktime.sourceforge.net/
    - https://sourceforge.net/p/libquicktime/git/ci/master/tree/
    - https://sourceforge.net/p/libquicktime/news/
    - https://sourceforge.net/projects/libquicktime/
    - https://sourceforge.net/projects/libquicktime/files/
  summary:
    - >
      libquicktime is a C library and tool suite for reading and writing
      QuickTime-family media files on Unix-like systems, descended from the
      quicktime4linux codebase.
  timeline:
    - '2002: SourceForge project registered on 2002-02-08.'
    - '2002: libquicktime 0.9.0 released on 2002-05-21.'
    - '2006: libquicktime 0.9.9 announced with improved codec and file-format support.'
    - '2012: SourceForge file browser listed the libquicktime package tree dated 2012-03-29.'
    - '2024: SourceForge project metadata recorded an activity update on 2024-02-03.'
  usage:
    - >
      Package users typically use libquicktime indirectly through applications or
      directly through tools such as lqt_transcode, lqtremux, qtdump, qtinfo, and
      qtstreamize for inspecting or converting old QuickTime-family media.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg for a broader, actively maintained command-line framework that can
      demux, mux, transcode, and stream QuickTime/MOV and MP4 media.
    rel: alternative
    sources:
      - https://libquicktime.sourceforge.net/introduction.html
      - https://ffmpeg.org/about.html
      - https://ffmpeg.org/ffmpeg-formats.html
category: media
