id: brew:log4c
display-name: log4c
homepage: https://log4c.sourceforge.net/
repo: https://sourceforge.net/p/log4c/log4c
docs:
  - https://log4c.sourceforge.net/
config-file-location:
  unix:
    - ${LOG4C_RCPATH}/log4crc
    - ${HOME}/.log4crc
    - ./log4crc
credentials-file-location: null
history:
  adoption-history:
    - >
      log4c became a package-manager-visible C logging dependency rather than a large
      end-user command. The supplied package metadata records packaging in Homebrew,
      Debian and Ubuntu as liblog4c-dev, Fedora/DNF, MacPorts, and openSUSE/Zypper,
      which is the main adoption signal for a small C library of this vintage.
    - >
      Its official platform list covers several Unix systems, including HP-UX, AIX,
      FreeBSD, Solaris, macOS-era Darwin, and multiple Linux distributions, reflecting
      the portability expectations of C infrastructure libraries.
  package-nerd-significance:
    - >
      log4c is a classic example of the early-2000s log4j pattern spreading into
      native-language package ecosystems. For package maintainers it matters less as a
      flashy CLI and more as a small ABI-bearing C library with autotools metadata,
      distro patches, and reverse dependencies that expect stable headers and linker
      flags.
  project-history:
    - >
      The official documentation describes log4c as a SourceForge-hosted C library that
      stayed close to the log4j API where practical while adapting the design to C. Its
      documentation also credits earlier and parallel C logging work, including Mark
      Mendel's macro-oriented log4c project and Bastiaan Bakker's log4cpp as influences.
    - >
      SourceForge release metadata shows a long 1.0.x line in the 2000s, a 1.2.1 release
      in 2007, and later maintenance releases through 1.2.4 in October 2013. The 1.2.4
      documentation still presents an autotools build and an XML-style log4crc
      configuration file.
  related-projects:
    - 'log4j: the Java logging library whose API and design motivated log4c.'
    - 'log4cpp: the C++ logging project credited by the log4c documentation as an influence.'
  sources:
    - https://log4c.sourceforge.net/
    - https://sourceforge.net/projects/log4c/files/log4c/1.2.4/
    - source_facts.package-manager
  summary:
    - >
      log4c is a C logging framework modeled after Apache log4j, intended to bring
      category-based logging, appenders, layouts, and runtime configuration to C
      programs that need flexible output to files, syslog, or other destinations.
  timeline:
    - '2007: SourceForge metadata lists log4c 1.2.1 artifacts.'
    - '2012: log4c 1.2.2 release artifacts are published on SourceForge.'
    - '2013: log4c 1.2.3 and 1.2.4 release artifacts are published on SourceForge.'
  usage:
    - >
      Programs link against log4c and configure categories, appenders, and layouts with
      a log4crc XML file. The documented search order is `${LOG4C_RCPATH}/log4crc`, then
      `${HOME}/.log4crc`, then `./log4crc`, with environment variables also available
      for root priority and appender selection.
    - >
      Package users mostly encounter log4c through development packages, headers,
      libraries, generated Doxygen documentation, pkg-config or log4c-config metadata,
      and build scripts that need a C logging backend.
related-packages:
  - id: brew:zlog
    reason: >
      Choose zlog when you want a newer pure-C logging library with CMake support,
      thread-safety claims, and a rule-based configuration model; choose log4c for its
      log4j-style category, appender, and layout API.
    rel: alternative
    sources:
      - https://log4c.sourceforge.net/
      - https://github.com/HardySimpson/zlog#readme
  - id: brew:log4cpp
    reason: >
      Choose log4cpp for a C++ class-based implementation of the log4j logging model;
      log4c provides the corresponding framework and API conventions for C programs.
    rel: alternative
    sources:
      - https://log4c.sourceforge.net/
      - https://log4cpp.sourceforge.net/
category: developer-tools
package-manager:
  brew: log4c
  debian: liblog4c-dev
  dnf: log4c
  macports: log4c
  ubuntu: liblog4c-dev
  zypper: liblog4c-devel
package-manager-url: https://formulae.brew.sh/formula/log4c
license: LGPL-2.1-only
tags:
  - c
  - cli
  - library
  - log4j-inspired
  - logging
description: Logging Framework for C
executables:
  - log4c-config
provenance:
  formula: log4c
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
