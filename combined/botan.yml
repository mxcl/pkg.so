id: brew:botan
display-name: Botan
homepage: https://botan.randombit.net/
repo: https://github.com/randombit/botan
docs:
  - https://botan.randombit.net/doxygen
  - https://botan.randombit.net/handbook
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Botan is distributed by major Unix-like package systems, including Homebrew,
      Debian-family distributions, Fedora, Arch, MacPorts, and openSUSE according to the
      package facts and the upstream README's distribution note. Its adoption is less
      about a single dominant CLI and more about being a reusable cryptographic
      substrate for C++ applications that want TLS, X.509, PKCS#11, TPM, password
      hashing, and newer post-quantum primitives without binding themselves to OpenSSL
      APIs.
    - >
      The project also exposes C, Python, and third-party language bindings, which makes
      it useful to packagers who want one audited native cryptography implementation to
      serve multiple language ecosystems.
  package-nerd-significance:
    - >
      Botan is a classic package-nerd library: it is security-sensitive, ABI-sensitive,
      heavily tested, and exposed through many downstream packages. Its release notes
      read like infrastructure maintenance, with CVEs, certificate-path behavior,
      compiler support, optimized CPU code paths, TLS conformance, and algorithm
      additions all mattering to downstream maintainers.
    - >
      It is also notable as a modern C++ crypto stack that deliberately includes
      post-quantum algorithms and side-channel testing in its project goals, making it a
      useful barometer for where general-purpose cryptography libraries are moving.
  project-history:
    - >
      The current public development home is the randombit/botan GitHub repository,
      created in March 2013, while the official documentation describes Botan as a C++
      cryptography library focused on production cryptography. Its handbook frames the
      project around secure distributed systems, constant-time programming, test
      coverage, side-channel analysis, safe defaults, portability to modern systems, and
      post-quantum readiness.
    - >
      Botan 3 became the active release line, with the upstream README documenting
      quarterly Botan3 minor releases. Botan2 reached end of life on 2025-01-01, with
      the final Botan2 release listed as 2.19.5 from 2024-07-08.
  related-projects:
    - >
      OpenSSL is the most common comparison point for everyday command-line crypto and
      TLS tooling.
    - Crypto++ is a related C++ cryptography library in the same packaging space.
    - libsodium is a related security library with a narrower, opinionated API surface.
  sources:
    - https://api.github.com/repos/randombit/botan
    - https://botan.randombit.net/handbook/cli.html
    - https://botan.randombit.net/handbook/goals.html
    - https://botan.randombit.net/news.html
    - https://github.com/randombit/botan
  summary:
    - >
      Botan is a permissively licensed C++ cryptography toolkit with a library-first
      identity and a substantial command-line companion. In package-manager culture it
      occupies the same broad territory as OpenSSL, libsodium, and Crypto++, but with a
      C++ API, modular build controls, Python/C FFI surfaces, and an intentionally broad
      algorithm catalog.
  timeline:
    - '2013: Public GitHub repository created for randombit/botan.'
    - '2024: Botan 2.19.5 released as the final Botan2 series release.'
    - '2025: Botan2 reached end of life on January 1.'
    - '2026: Botan 3.12.0 released with TLS, X.509, performance, and security fixes.'
  usage:
    - >
      The installed `botan` executable exposes many library functions in shell form:
      hashing, HMAC, password hashing, symmetric encryption, public-key operations,
      certificate handling, TLS-related tooling, and other cryptographic utilities. The
      library side is used by applications that need a C++ cryptography API with
      configurable modules and platform certificate-store support.
    - >
      For package users, Botan is commonly installed as a development dependency as well
      as a CLI utility; its package significance comes from headers, libraries, ABI
      concerns, and feature selection as much as from the command-line binary.
related-packages:
  - id: brew:openssl@3
    reason: >
      Choose OpenSSL 3 when compatibility with the dominant C-based TLS and cryptography
      ecosystem is more important than Botan's modern C++ API and modular design.
    rel: alternative
    sources:
      - https://github.com/randombit/botan
      - https://docs.openssl.org/3.6/man1/openssl/
  - id: brew:gnutls
    reason: >
      Choose GnuTLS when the primary requirement is a C API focused on TLS, DTLS,
      certificates, and PKI rather than Botan's broader C++ cryptography interface.
    rel: alternative
    sources:
      - https://github.com/randombit/botan
      - https://gnutls.org/manual/gnutls.html
category: security
package-manager:
  brew: botan
  debian: botan
  dnf: botan
  macports: botan
  pacman: botan
  ubuntu: botan
  zypper: Botan
package-manager-url: https://formulae.brew.sh/formula/botan
license: BSD-2-Clause
tags:
  - c-plus-plus
  - cli
  - cryptography
  - library
  - security
  - tls
  - x509
description: Cryptographic algorithms and formats library in C++
executables:
  - botan
provenance:
  formula: botan
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
