id: brew:erg
display-name: Erg
homepage: https://github.com/erg-lang/erg
repo: https://github.com/erg-lang/erg
docs:
  - https://erg-lang.org/install
  - https://erg-lang.org/the-erg-book
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Erg's adoption is early-stage and developer-experimental. The README points users
      to Cargo, source builds, Nix, a web playground, and multilingual documentation,
      while the supplied input lists Homebrew and Nix package availability.
  package-nerd-significance:
    - >
      Erg is interesting to package nerds as a young language-runtime formula: it mixes
      a Rust compiler, Python runtime requirements, optional language-server pieces, and
      docs/playground expectations. Its package-manager presence is more about
      discoverability for language experimenters than mass production use.
  project-history:
    - >
      The public GitHub repository was created in 2022, with an initial 0.1.1 GitHub
      release shortly afterward. The README states that the repository contains the
      compiler and documentation and lists features such as refinement-style type
      checks, Python API imports, optional language-server builds, and localized
      diagnostics.
  related-projects:
    - Erg is related to Python, Rust, Nix, Cargo, and editor language-server tooling.
  sources:
    - https://github.com/erg-lang/erg
    - https://github.com/erg-lang/erg/releases
    - https://api.github.com/repos/erg-lang/erg
    - https://erg-lang.org/the-erg-book
  summary:
    - >
      Erg is an experimental statically typed programming language implemented in Rust
      and designed to interoperate with Python. The official README presents it as a
      language for Python users who want stronger static guarantees, readable errors,
      and a practical mix of functional and object-oriented programming.
  timeline:
    - '2022: The GitHub repository was created.'
    - '2022: Version 0.1.1 was published on GitHub releases.'
    - '2020s: The README documents Cargo, source, Nix, and optional ELS installation paths.'
  usage:
    - >
      Users run the `erg` compiler or REPL, build it with Cargo or Nix, and can enable
      feature flags such as language-specific diagnostics, the Erg Language Server,
      debug mode, or richer REPL behavior. Its core usage story is trying a
      Python-compatible language with static checks rather than replacing the Python
      runtime outright.
related-packages: []
category: language-runtime
package-manager:
  brew: erg
  nix: erg
package-manager-url: https://formulae.brew.sh/formula/erg
license: Apache-2.0 OR MIT
tags:
  - cli
  - compiler
  - programming-language
  - python-compatible
  - rust
  - statically-typed
description: Statically typed language that can deeply improve the Python ecosystem
executables:
  - erg
provenance:
  formula: erg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
