id: brew:clean
display-name: Nifty Clean
homepage: https://clean.sourceforge.net/
repo: https://sourceforge.net/p/clean/code
docs:
  - https://clean.sourceforge.net/
  - https://sourceforge.net/projects/clean
config-file-location:
  unix: ~/.cleanrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Its packaging in Homebrew and Nix reflects continued interest in tiny maintenance
      commands even when upstream activity is low.
  package-nerd-significance:
    - >
      Clean is the kind of small, public-domain Unix utility package that
      package-manager catalogs preserve: narrow scope, rc-file configuration, no service
      dependency, and useful behavior for shell-driven file housekeeping.
  project-history:
    - >
      The SourceForge project describes Clean as public-domain C software targeting
      Unix/POSIX systems. Its project registration date places it in the early-2000s
      SourceForge era of small single-purpose command-line utilities.
  sources:
    - >
      Official SourceForge project page: description, license, categories, registration
      date, and last update.
    - 'Official project homepage: clean.sourceforge.net.'
  summary:
    - >
      Nifty Clean is a small Unix/POSIX C utility for finding backup-style files using
      regular expressions from a user rc file and deleting them interactively or in
      batch mode.
  timeline:
    - '2003-05-31: SourceForge project registered.'
    - '2016-01-20: SourceForge project page lists the last update.'
  usage:
    - >
      Users define regexes in `~/.cleanrc`, then run the `clean` executable to locate
      and remove matching files, with optional per-file confirmation or batch deletion.
related-packages: []
category: system
package-manager:
  brew: clean
  nix: clean
package-manager-url: https://formulae.brew.sh/formula/clean
license: LicenseRef-Homebrew-public-domain
tags:
  - backup
  - cli
  - delete-files
  - file-cleanup
  - regex
  - unix
description: Search for files matching a regex and delete them
executables:
  - clean
provenance:
  formula: clean
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
