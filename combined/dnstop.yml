id: brew:dnstop
display-name: dnstop
homepage: http://dns.measurement-factory.com/tools/dnstop/index.html
repo: https://github.com/measurement-factory/dnstop
docs:
  - http://dns.measurement-factory.com/tools/dnstop/dnstop.8.html
  - https://github.com/measurement-factory/dnstop
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dnstop spread early through operator communities. The official source page lists
      portability notes for Mac OS X with fink, FreeBSD Ports, NetBSD Packages, Gentoo
      Portage, Debian unstable, EPEL, Linux source builds, and Solaris. The publicity
      page preserves 2002 and 2003 operator feedback from people running it on DNS,
      mail, FreeBSD, and Solaris systems.
  package-nerd-significance:
    - >
      dnstop is the kind of small C network utility that package maintainers like
      because it has a clear job and few moving parts: libpcap plus a terminal UI. Its
      significance is historical as much as practical: it came from root-DNS measurement
      work and became a standard packaged tool for DNS traffic triage.
  project-history:
    - >
      The Measurement Factory publicity page says dnstop was written with research into
      large amounts of bogus traffic received by root DNS servers and was originally
      presented at NANOG26. The project site and README describe the core feature set:
      tables for source and destination addresses, query types, response codes, opcodes,
      and domain levels.
    - >
      The man page is dated March 21, 2008 and names Duane Wessels, Mark Foster, Jose
      Nazario, and other contributors. In 2018, the official source page was updated to
      point to the GitHub repository as the maintained source location while keeping the
      old source directory for tarballs and individual files.
  related-projects:
    - >
      tcpdump and libpcap are the closest technical relatives: dnstop reads live
      captures or pcap savefiles. DNS measurement work at The Measurement Factory is the
      historical context, and DNS-OARC-style operator tooling is the cultural
      neighborhood.
  sources:
    - http://dns.measurement-factory.com/tools/dnstop/index.html
    - http://dns.measurement-factory.com/tools/dnstop/source.html
    - http://dns.measurement-factory.com/tools/dnstop/publicity.html
    - http://dns.measurement-factory.com/tools/dnstop/dnstop.8.html
    - https://github.com/measurement-factory/dnstop
    - https://api.github.com/repos/measurement-factory/dnstop
    - https://formulae.brew.sh/formula/dnstop
  summary:
    - >
      dnstop is a curses-style libpcap tool for watching DNS traffic tables from a live
      interface or packet capture. It is the DNS equivalent of a focused top-like view:
      small, old, and still useful when a resolver or network segment is producing
      strange query traffic.
  timeline:
    - '2002: dnstop presented at NANOG26 according to the official publicity page.'
    - >
      2003: Publicity page records operator adoption feedback after the root-DNS traffic
      research.
    - '2008: dnstop manual page dated March 21, 2008.'
    - '2018: Official source page updated to point to the GitHub repository.'
    - '2026: GitHub repository metadata shows continued maintenance activity.'
  usage:
    - >
      Users run dnstop on a network device or read a tcpdump savefile. It can filter for
      unknown TLD leakage, RFC1918 PTR leakage, REFUSED, SERVFAIL, NXDOMAIN, and other
      DNS patterns, then switch between live tables interactively or print top entries
      from a capture in non-interactive mode.
related-packages:
  - id: brew:wireshark
    reason: >
      Choose Wireshark when you need packet-by-packet DNS dissection, display filters,
      and broader protocol analysis; choose dnstop for a compact terminal view of ranked
      DNS traffic aggregates.
    rel: alternative
    sources:
      - https://dns.measurement-factory.com/tools/dnstop/
      - https://wiki.wireshark.org/DNS
      - https://www.wireshark.org/docs/dfref/d/dns.html
  - id: brew:tcpdump
    reason: >
      tcpdump can capture the traffic first and write a savefile that dnstop later reads
      for DNS-focused aggregation and filtering.
    rel: adjacent_workflow
    sources:
      - https://dns.measurement-factory.com/tools/dnstop/
      - https://www.tcpdump.org/manpages/tcpdump.1.html
category: networking
