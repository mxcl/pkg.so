id: brew:amy
display-name: amy
homepage: https://github.com/vitorpamplona/amethyst
repo: https://github.com/vitorpamplona/amethyst
docs:
  - https://github.com/vitorpamplona/amethyst#readme
  - https://github.com/vitorpamplona/amethyst/blob/main/BUILDING.md
config-file-location: null
credentials-file-location:
  unix: ~/.amethyst
history:
  adoption-history:
    - >
      Amethyst began as an Android Nostr client and expanded to desktop platforms and
      command-line tooling. The project publishes amy release artifacts for macOS,
      Linux, and Windows, and packages the CLI through Homebrew.
  package-nerd-significance:
    - >
      amy is notable as package-manager-facing tooling from a large, multi-platform
      Nostr client rather than a standalone Unix utility. Its JVM packaging,
      bundled-runtime variants, and separation from the Amethyst GUI illustrate the
      practical packaging tradeoffs of Kotlin applications.
  project-history:
    - >
      amy is the command-line client produced by the Amethyst project, an open-source
      Nostr client maintained by Vitor Pamplona and contributors. It shares the
      project's protocol implementation and release infrastructure with its Android and
      desktop clients.
  related-projects:
    - Amethyst desktop and Android clients
    - geode, the Amethyst project's relay command-line program
    - Nostr
  sources:
    - https://github.com/vitorpamplona/amethyst
    - https://github.com/vitorpamplona/amethyst/blob/main/BUILDING.md
    - https://github.com/vitorpamplona/amethyst/blob/main/RELEASE_OPS.md
  summary:
    - >
      amy is Amethyst's command-line Nostr client. It provides terminal-oriented access
      to functionality from the broader Amethyst codebase and is distributed as
      native-platform archives and Linux packages, plus a JVM bundle used by Homebrew.
  timeline:
    - >
      2026: Official build documentation describes amy artifacts for macOS, Linux,
      Windows, and Homebrew.
  usage:
    - >
      Install through Homebrew and run the amy executable for terminal-based Nostr
      operations. The official release process also supplies platform-specific archives
      and Linux packages.
    - >
      The project's documented Unix state directory is ~/.amethyst, which contains
      accounts and keys; it should be treated as sensitive and preserved when changing
      installation channels.
related-packages:
  - id: brew:nak
    reason: >
      Choose nak for Unix-style Nostr event creation, signing, relay queries, and JSON
      pipelines; choose amy for a client built from Amethyst's broader account and
      protocol implementation.
    rel: alternative
    sources:
      - https://github.com/vitorpamplona/amethyst/blob/main/README.md
      - https://github.com/fiatjaf/nak#readme
category: networking
package-manager:
  brew: amy
package-manager-url: https://formulae.brew.sh/formula/amy
license: MIT
tags:
  - cli
  - cross-platform
  - jvm
  - nostr
  - social-networking
description: Nostr client from the Amethyst project
executables:
  - amy
provenance:
  formula: amy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
