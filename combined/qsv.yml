id: brew:qsv
display-name: qsv
homepage: https://qsv.dathere.com/
repo: https://github.com/dathere/qsv
docs:
  - https://github.com/dathere/qsv#readme
  - https://qsv.dathere.com/
config-file-location:
  unix:
    - ./.env
    - <executable-directory>/qsv.env
  windows:
    - .\.env
    - <executable-directory>\qsv.env
credentials-file-location: null
history:
  adoption-history:
    - >
      qsv is available across Homebrew, MacPorts, Nix, Arch Linux, Scoop, and other
      distribution channels. Official binaries support Linux, macOS, and Windows,
      reflecting adoption beyond Rust's source-oriented package ecosystem.
  package-nerd-significance:
    - >
      qsv appeals to package and command-line enthusiasts as a modern Rust treatment of
      the composable CSV-tool tradition: a single executable exposes dozens of focused
      subcommands while adding parallelism, indexing, Polars acceleration, and support
      for datasets larger than memory.
  project-history:
    - >
      qsv began as a command-line toolkit centered on fast CSV manipulation and has
      expanded into a broad tabular-data workbench. The official project now describes
      more than 50 commands and support for Excel, ODS, JSON/JSONL, Arrow, Parquet,
      SQLite, and PostgreSQL workflows in addition to CSV.
  related-projects:
    - Rust provides qsv's implementation platform.
    - Polars powers accelerated operations and broader tabular-format support.
    - The project maintains a separate qsv pro offering and a web playground.
  sources:
    - https://github.com/dathere/qsv
    - https://qsv.dathere.com/
    - source_facts.package-manager
  summary:
    - >
      qsv is datHere's cross-platform Rust command-line toolkit for querying,
      transforming, validating, joining, analyzing, and converting tabular data.
  timeline:
    - 'Early project: qsv established a fast, composable toolkit for CSV processing.'
    - >
      Later development: The command set grew beyond CSV into spreadsheet, JSON, Arrow,
      Parquet, database, geospatial, scripting, and web-service workflows.
    - >
      Current generation: The official site describes 50-plus commands with parallel and
      CPU-accelerated processing.
  usage:
    - >
      Users compose subcommands for tasks such as selecting columns, sorting, joining,
      deduplicating, computing statistics, validating schemas, converting formats, and
      indexing large CSV files. Commands are suitable both for one-off terminal work and
      repeatable data pipelines.
    - >
      The official documentation describes behavior through command options and
      environment variables rather than a single general-purpose configuration file, so
      no canonical config-file path is reported. Some optional commands can use external
      services, but qsv as a package has no universal credentials file.
category: data
package-manager:
  brew: qsv
  macports: qsv
  nix: qsv
  pacman: qsv
  scoop: main/qsv
package-manager-url: https://formulae.brew.sh/formula/qsv
license: MIT OR Unlicense
tags:
  - cli
  - csv
  - data-engineering
  - data-wrangling
  - rust
description: Ultra-fast CSV data-wrangling toolkit
executables:
  - qsv
provenance:
  formula: qsv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
