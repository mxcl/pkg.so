id: brew:elasticmq
display-name: ElasticMQ
homepage: https://softwaremill.com/open-source/
repo: https://github.com/softwaremill/elasticmq
docs:
  - https://github.com/softwaremill/elasticmq#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its documented distribution surfaces include Docker and JVM dependencies through
      Maven and sbt; no adoption counts are established.
  package-nerd-significance:
    - >
      Standalone and embedded operation make the same queue implementation useful in
      local development and automated tests.
  project-history:
    - >
      SoftwareMill maintains ElasticMQ as an actor-based Scala implementation with an
      SQS-compatible interface.
  related-projects:
    - >
      Amazon SQS supplies the compatibility model; Typesafe Config supplies
      configuration handling.
  sources:
    - https://github.com/softwaremill/elasticmq#readme
  summary:
    - >
      ElasticMQ is an open-source message queue used to run SQS-style workflows locally
      or embedded in JVM applications.
  timeline:
    - >
      2026: Official documentation describes optional queue and message persistence
      alongside in-memory operation.
  usage:
    - >
      Point an AWS SDK at its local endpoint. Consumers should tolerate duplicate
      delivery and respect visibility timeouts.
category: cloud-infrastructure
package-manager:
  brew: elasticmq
package-manager-url: https://formulae.brew.sh/formula/elasticmq
license: Apache-2.0
tags:
  - amazon-sqs
  - cli
  - integration-testing
  - jvm
  - local-development
  - message-queue
  - scala
description: In-memory message queue with an Amazon SQS-compatible interface
executables:
  - elasticmq
provenance:
  formula: elasticmq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
