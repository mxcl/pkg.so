id: brew:favirecon
display-name: favirecon
homepage: https://edoardottt.com/
repo: https://github.com/edoardottt/favirecon
docs:
  - https://github.com/edoardottt/favirecon#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, Snap, and go install. Homebrew
      currently tracks the upstream v1.0.3 release archive and also provides a HEAD
      build path.
  package-nerd-significance:
    - >
      favirecon is useful to security-focused package-manager users because it packages
      a bug-bounty reconnaissance technique as a small cross-platform Go CLI with simple
      shell integration.
  project-history:
    - >
      The GitHub repository was created in November 2022. The official README centers
      the tool on a favicon hash database and asks users to open issues when they find
      new or incorrect hash-to-service associations.
  related-projects:
    - >
      The README positions favirecon within infosec and bug-bounty reconnaissance
      workflows that use favicon.ico hash matching.
  sources:
    - https://api.github.com/repos/edoardottt/favirecon
    - https://api.github.com/repos/edoardottt/favirecon/releases
    - https://formulae.brew.sh/api/formula/favirecon.json
    - https://github.com/edoardottt/favirecon#readme
  summary:
    - >
      favirecon is a Go security reconnaissance CLI that uses favicon hashes to help
      identify technologies, WAFs, exposed panels, and known services during target
      recon.
  timeline:
    - '2022: GitHub repository created.'
    - '2023: v0.0.1 published on GitHub Releases.'
    - '2026: v1.0.3 published and tracked by Homebrew.'
  usage:
    - >
      favirecon accepts a single URL, a list of target domains, standard input, or CIDR
      input, and supports concurrency, timeout, rate limiting, proxy, output file,
      verbose, silent, and JSON output flags.
related-packages:
  - id: brew:httpx
    reason: >
      Use httpx first to probe hosts and produce live HTTP URLs, then pipe or save those
      URLs for favicon-based identification with favirecon.
    rel: adjacent_workflow
    sources:
      - https://docs.projectdiscovery.io/opensource/httpx/overview
      - https://github.com/edoardottt/favirecon#readme
category: security
package-manager:
  brew: favirecon
  nix: favirecon
package-manager-url: https://formulae.brew.sh/formula/favirecon
license: MIT
tags:
  - cli
  - favicon
  - favicon-hash
  - go
  - osint
  - reconnaissance
  - security
description: Uses favicon.ico to improve the target recon phase
executables:
  - favirecon
provenance:
  formula: favirecon
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
