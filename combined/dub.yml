id: brew:dub
display-name: DUB
homepage: https://code.dlang.org/getting_started
repo: https://github.com/dlang/dub
docs:
  - https://dub.pm/
  - https://dub.pm/getting-started/install
config-file-location:
  unix:
    - /var/lib/dub/settings.json
    - <dub executable folder>/../etc/dub/settings.json
    - /etc/dub/settings.json
    - $DUB_HOME/settings.json
    - $ROOT_PACKAGE_DIR/dub.settings.json
  windows:
    - '%ProgramData%\dub\settings.json'
    - <dub executable folder>\..\etc\dub\settings.json
    - '%DUB_HOME%\settings.json'
    - '%ROOT_PACKAGE_DIR%\dub.settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      DUB became the normal packaging path for public D libraries because the official
      registry, documentation, and compiler-facing workflow all point through it. The
      README records broad packaging support over time, including Homebrew, MacPorts,
      Chocolatey, Debian/Ubuntu, Arch, Alpine, FreeBSD, and OpenBSD.
    - >
      Its adoption is also tied to IDE and editor integration. The project documentation
      notes VisualD project generation and Mono-D support for dub.json, which helped
      make DUB package metadata double as development-environment metadata.
  package-nerd-significance:
    - >
      For package database work, DUB is a high-signal package because it is both a CLI
      and an ecosystem primitive: the executable is a developer tool, while the project
      also defines package metadata conventions for the D community.
    - >
      It is historically interesting because it sits between older makefile-centric
      compiled-language workflows and newer language-native package managers. DUB made D
      packages discoverable through a central registry while still respecting multiple D
      compilers such as DMD, GDC, and LDC.
  project-history:
    - >
      The project describes itself as a package and build manager for D applications and
      libraries, with a central package registry at code.dlang.org. Its README says DUB
      emerged as a more general replacement for the package manager originally
      associated with vibe.d, then expanded from dependency management into building
      projects and generating IDE project files.
    - >
      DUB's design center was deliberately small: a short dub.json or later package
      file, source in a conventional directory, and automatic dependency downloads
      during builds. That placed it in the same cultural slot as Cargo, npm, or Bundler,
      but tailored to D's compiler ecosystem and common D project layouts.
  related-projects:
    - >
      vibe.d is central to DUB's origin story because DUB's README names it as the
      package manager that DUB generalized beyond.
    - >
      code.dlang.org is the registry side of the DUB ecosystem; VisualD and Mono-D are
      related development tools that consumed DUB package metadata.
  sources:
    - https://github.com/dlang/dub
    - https://dub.pm/
    - https://dub.pm/getting-started/install
    - https://github.com/dlang/dub/releases
  summary:
    - >
      DUB is the package and build manager that gave the D language ecosystem a
      conventional registry-plus-build-tool workflow. It matters because it made
      reusable D libraries installable and buildable through a shared package
      description instead of scattered project-specific build scripts.
  timeline:
    - >
      2010s: DUB emerges from vibe.d's package-manager needs and generalizes into a
      package and build manager for D.
    - '2010s: code.dlang.org becomes the central DUB package registry.'
    - '2017: DUB 1.5 and 1.6 releases appear in the GitHub release history.'
    - >
      2020s: DUB remains the documented D package/build workflow and is packaged by
      mainstream OS package managers.
  usage:
    - >
      D developers use DUB to create packages, resolve dependencies, build executables
      and libraries, run tests, and publish packages to the D package registry. The
      common workflow is intentionally root-directory based: run dub from a package
      directory and let the package file describe dependencies and build settings.
    - >
      DUB also has package-nerd value as an example of a language ecosystem build tool
      that grew out of a framework-specific need, then became the ecosystem-level
      package manager.
related-packages:
  - id: brew:ldc
    reason: >
      LDC is an officially supported D compiler backend that DUB can invoke to build
      packages, making it a practical compiler companion for optimized LLVM-based D
      builds.
    rel: adjacent_workflow
    sources:
      - https://github.com/dlang/dub#readme
      - https://github.com/ldc-developers/ldc#readme
  - id: brew:dfmt
    reason: >
      dfmt complements DUB by formatting D source and documents DUB as a supported way
      to fetch, build, and run the formatter within D projects.
    rel: adjacent_workflow
    sources:
      - https://github.com/dlang-community/dfmt#readme
      - https://dub.pm/
category: developer-tools
package-manager:
  apk: dub
  brew: dub
  debian: dub
  dnf: dub
  macports: dub
  nix: dub
  pacman: dub
  ubuntu: dub
  zypper: dub
package-manager-url: https://formulae.brew.sh/formula/dub
license: MIT
tags:
  - build-tool
  - cli
  - d-language
  - package-manager
description: Build tool for D projects
executables:
  - dub
provenance:
  formula: dub
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
