history:
  adoption-history:
    - >
      The official page announced FreeBSD Ports availability in December 2006 and
      recommended Fink for Mac OS X users. Homebrew and MacPorts later carried the
      package for users who wanted a scriptable hex-grid generator.
  package-nerd-significance:
    - >
      mkhexgrid is package-nerd interesting because it packages a very specific
      tabletop/strategy-game utility as a normal Unix command. It is small,
      source-archived, and useful in scripts that generate assets or print-ready grid
      sheets.
  project-history:
    - >
      The project first released version 0.1.0 on August 6, 2006, with Windows and Linux
      binaries plus source packages. Version 0.1.1 followed on January 10, 2007, fixing
      several bugs and Mac OS X build issues.
  related-projects:
    - >
      mkhexgrid is related to strategy-game map tooling, tabletop hex maps, GD PNG
      generation, SVG, PostScript, FreeBSD Ports, Fink, Homebrew, and MacPorts.
  sources:
    - https://www.nomic.net/~uckelman/mkhexgrid/
    - https://www.nomic.net/~uckelman/mkhexgrid/HISTORY
    - https://www.nomic.net/~uckelman/mkhexgrid/README
    - https://www.nomic.net/~uckelman/mkhexgrid/mkhexgrid.html
  summary:
    - >
      mkhexgrid is a small command-line program by Joel Uckelman for generating
      configurable hexagonal grids, especially grids used for strategy games. The
      official page says it can create PNG, SVG, and PostScript output and can adjust
      line thickness, colors, center marks, coordinate styles, and coordinate placement.
  timeline:
    - '2006-08: mkhexgrid 0.1.0 initial release.'
    - '2006-12: Official news says mkhexgrid was added to FreeBSD Ports.'
    - '2007-01: mkhexgrid 0.1.1 released.'
  usage:
    - >
      mkhexgrid reads grid parameters from a spec file or standard input and writes
      output to a named file or standard output. The reference manual documents options
      for output format, image size, rows, columns, grid color, coordinate format,
      coordinate origin, and center marks.
    - >
      Its practical niche is generating repeatable printable or image-based hex maps
      without opening a graphical map editor.
