id: brew:mihomo
display-name: mihomo
homepage: https://wiki.metacubex.one
repo: https://github.com/MetaCubeX/mihomo
docs:
  - https://wiki.metacubex.one/en
  - https://wiki.metacubex.one/en/config
config-file-location:
  unix:
    - ~/.config/mihomo/config.yaml
    - $XDG_CONFIG_HOME/mihomo/config.yaml
  windows: '%USERPROFILE%\.config\mihomo\config.yaml'
credentials-file-location: null
history:
  project-history:
    - >
      Its operational model comes from the Clash-family proxy configuration style. The
      documentation organizes the system around proxy ports, SOCKS and mixed listeners,
      TUN and redirect modes, proxy providers, proxy groups, rule providers, route
      rules, DNS behavior, and an external controller API. The general configuration
      page shows common runtime controls such as LAN access, authentication for
      HTTP/SOCKS/mixed proxies, rule/global/direct modes, IPv6, process matching, and a
      REST-style external controller on a local address.
  sources:
    - https://formulae.brew.sh/formula/mihomo
    - https://github.com/MetaCubeX/mihomo/releases
    - https://ports.macports.org/port/mihomo/details/
    - https://wiki.metacubex.one/en/
    - https://wiki.metacubex.one/en/config/general/
  summary:
    - >
      mihomo is the MetaCubeX rule-based network tunnel distributed by package managers
      under the description "formerly known as ClashMeta." MacPorts describes it as a Go
      program that supports HTTP, SOCKS, VMess, VLESS, Shadowsocks, Trojan, Hysteria,
      and other protocols, with built-in DNS server functionality including DoH and DoT
      support.
  usage:
    - >
      Package-manager adoption reflects its role as a proxy core rather than a desktop
      client: Homebrew, MacPorts, Nix, Scoop, and winget package the executable, while
      separate dashboards and clients can drive it through configuration files and its
      controller API. In practice it is used as the engine under rule-based proxy setups
      on desktops, servers, and gateways, especially where users need protocol
      diversity, subscription/provider handling, DNS policy, and route selection in one
      daemon.
related-packages:
  - id: brew:sing-box
    reason: >
      Choose sing-box when a JSON-configured universal proxy platform and its SagerNet
      client ecosystem are preferred; choose mihomo for Clash-derived YAML
      configurations, rule providers, proxy groups, and controller-compatible workflows.
    rel: alternative
    sources:
      - https://sing-box.sagernet.org/
      - https://sing-box.sagernet.org/configuration/
      - https://sing-box.sagernet.org/migration/
      - https://wiki.metacubex.one/en/config/
category: networking
package-manager:
  brew: mihomo
  macports: mihomo
  nix: mihomo
  scoop: main/mihomo
  winget: MetaCubeX.Mihomo
  zypper: mihomo
package-manager-url: https://formulae.brew.sh/formula/mihomo
license: GPL-3.0-or-later
tags:
  - cli
  - go
  - networking
  - proxy
  - rule-based
  - tunnel
description: Another rule-based tunnel in Go, formerly known as ClashMeta
executables:
  - mihomo
provenance:
  formula: mihomo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
