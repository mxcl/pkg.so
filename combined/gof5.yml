id: brew:gof5
display-name: gof5
homepage: https://github.com/kayrus/gof5
repo: https://github.com/kayrus/gof5
docs:
  - https://github.com/kayrus/gof5
config-file-location:
  unix: ~/.gof5/config.yaml
credentials-file-location:
  unix: ~/.gof5/cookies.yaml
history:
  adoption-history:
    - >
      The official README directs users to downloadable release binaries. The supplied
      package metadata records distribution through Homebrew and Nix, extending the
      project beyond manual binary installation for Unix-like systems.
  package-nerd-significance:
    - >
      gof5 gives command-line and declarative-system users an open-source alternative
      for an enterprise VPN protocol often reached through vendor clients. Its single Go
      binary, release artifacts, Homebrew and Nix packaging, YAML configuration, and
      integration with WireGuard, pppd, systemd-resolved, and NetworkManager make it
      particularly relevant to users who manage networking from package-managed Unix
      environments.
  project-history:
    - >
      The GitHub repository was created in April 2020 and the first published release,
      v0.0.1, followed in May 2020. Subsequent development added cross-platform builds,
      multiple authentication paths, DNS and routing controls, and configurable tunnel
      drivers.
  related-projects:
    - WireGuard is the default tunnel driver documented by gof5.
    - pppd is an alternative tunnel driver on supported operating systems.
    - systemd-resolved and NetworkManager are supported Linux DNS integration points.
  sources:
    - https://api.github.com/repos/kayrus/gof5
    - https://api.github.com/repos/kayrus/gof5/releases?per_page=100
    - https://github.com/kayrus/gof5#readme
    - source_facts.package-manager
  summary:
    - >
      gof5 is an open-source command-line VPN client for F5 BIG-IP access servers.
      Written in Go, it supports Linux, macOS, FreeBSD, and Windows, with WireGuard as
      its default tunnel driver and pppd as an alternative on supported systems.
  timeline:
    - '2020: GitHub repository created.'
    - '2020: First GitHub release, v0.0.1.'
    - '2025: v0.1.5 published.'
  usage:
    - >
      Users connect by supplying an F5 server and credentials, or by passing a
      browser-obtained session ID for workflows that involve multifactor authentication.
      The client normally needs elevated network privileges, though Linux capabilities
      and PolicyKit configuration can narrow that requirement.
related-packages:
  - id: brew:openconnect
    reason: >
      Choose OpenConnect when you need one client for F5 and several other enterprise
      VPN protocols; choose gof5 for an F5-focused client with documented WireGuard/pppd
      tunnel selection and its own saved-session workflow.
    rel: alternative
    sources:
      - https://github.com/kayrus/gof5#readme
      - https://www.infradead.org/openconnect/
      - https://www.infradead.org/openconnect/protocols.html
category: networking
package-manager:
  brew: gof5
  nix: gof5
package-manager-url: https://formulae.brew.sh/formula/gof5
license: Apache-2.0
tags:
  - cli
  - f5-big-ip
  - go
  - networking
  - vpn
  - wireguard
description: F5 BIG-IP VPN client
executables:
  - gof5
provenance:
  formula: gof5
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
