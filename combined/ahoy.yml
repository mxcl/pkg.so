id: brew:ahoy
display-name: Ahoy
homepage: https://ahoy-cli.github.io/
repo: https://github.com/ahoy-cli/ahoy
docs:
  - https://ahoy-cli.readthedocs.io/en/latest
  - https://github.com/ahoy-cli/ahoy#readme
config-file-location:
  unix: .ahoy.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Ahoy's adoption is strongest in teams that want Makefile-like ergonomics but
      richer command help and project-local behavior. The README's Docker and database
      examples reflect its origin in development-environment workflows, especially
      wrapping docker-compose, shell, database, test, and deployment commands.
    - >
      The supplied package facts list Homebrew, Nix, Scoop, and winget packages, showing
      that Ahoy crossed from a macOS/Linux developer convenience into cross-platform
      package-manager distribution.
  package-nerd-significance:
    - >
      Ahoy sits in the small but beloved category of developer workflow shims: lighter
      than a build system, more discoverable than a pile of shell scripts, and easy to
      package as a single CLI binary. For package maintainers, its value is that the
      runtime surface is simple while the user-facing workflow can standardize a
      repository's command vocabulary.
  project-history:
    - >
      The GitHub repository was created in October 2015, and the earliest listed GitHub
      release is 1.0.0 from the next day. The older Read the Docs site documents the
      original framing: a zero-code, dependency-free way to give projects their own CLI,
      particularly for running interactive commands inside Docker containers.
    - >
      The current README keeps the same core idea while expanding the implementation
      details: commands live in .ahoy.yml, run relative to that file, can be invoked
      from subdirectories, and can import multiple config files. The project later moved
      under the ahoy-cli organization and added newer command-alias, environment-file,
      and completion features.
  related-projects:
    - >
      Ahoy overlaps with Make, npm scripts, just, Task, and docker-compose wrapper
      scripts, but focuses on project-specific command discovery and help.
    - The README points to ahoy-cli/zsh-ahoy for dedicated Zsh completion support.
  sources:
    - https://ahoy-cli.readthedocs.io/en/latest/
    - https://api.github.com/repos/ahoy-cli/ahoy
    - https://api.github.com/repos/ahoy-cli/ahoy/releases?per_page=100
    - https://github.com/ahoy-cli/ahoy#readme
    - source_facts.package-manager
  summary:
    - >
      Ahoy is a project-local task runner that turns commands written in a YAML file
      into a self-documenting CLI. Its purpose is to let each repository expose its own
      small command surface without requiring contributors to learn a bespoke shell
      script layout or install a language-specific task runner.
  timeline:
    - '2015: GitHub repository created and release 1.0.0 published.'
    - '2015: Release 1.1.0 published and documented by the older Read the Docs site.'
    - '2016-2017: Version 2 alpha and beta releases appeared.'
    - '2026: Official repository metadata shows continued activity under ahoy-cli/ahoy.'
  usage:
    - >
      A project adds a .ahoy.yml file declaring commands, descriptions, aliases,
      imports, environment files, and an entrypoint. Running ahoy lists commands and
      per-command help; running ahoy <command> executes the configured shell command
      relative to the config file.
    - >
      Official examples include replacing long docker exec invocations with short
      project commands, initializing an example .ahoy.yml, and using environment files
      for global or command-specific variables.
related-packages: []
category: developer-tools
package-manager:
  brew: ahoy
  nix: ahoy
  scoop: main/ahoy
  winget: Ahoy.Ahoy
package-manager-url: https://formulae.brew.sh/formula/ahoy
license: MIT
tags:
  - automation
  - cli
  - task-runner
  - yaml
description: Creates self documenting CLI programs from commands in YAML files
executables:
  - ahoy
provenance:
  formula: ahoy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
