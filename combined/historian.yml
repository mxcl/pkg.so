id: brew:historian
display-name: historian
homepage: https://github.com/jcsalterego/historian
repo: https://github.com/jcsalterego/historian
docs:
  - https://github.com/jcsalterego/historian#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official adoption evidence is thin. Homebrew and MacPorts package records in the
      batch input indicate that the tool crossed from a personal script-style repository
      into package-manager distribution, but the official README does not describe a
      wider community.
  package-nerd-significance:
    - >
      historian is package-nerd-interesting mainly because it captures the minimal
      SQLite shell-history idea in a tiny package: no daemon, no sync, no terminal UI,
      just import and query. That simplicity makes it a useful contrast with later tools
      such as hiSHtory and Atuin.
  project-history:
    - >
      The repository begins on 2017-04-10 with an initial commit. Tags 0.0.1 and 0.0.2
      followed within days, and the README documents the utility as a command-line
      manager for shell history in a SQLite database.
    - >
      The project is intentionally narrow: dedupe and import Bash history, store it in
      `~/.historian.db`, search it, and optionally run `hist import` from a shell
      profile.
  related-projects:
    - >
      hiSHtory and Atuin are later, larger shell-history tools with contextual search
      and sync.
    - SQLite is the core storage dependency documented by historian.
  sources:
    - Official Git repository tags and commits for timeline dates.
    - Official README for feature scope, install, usage, and database paths.
  summary:
    - >
      historian is a small shell-history utility that imports `~/.bash_history` into
      SQLite and exposes a `hist` command for config, import, search, and log viewing.
      It is a niche predecessor to later shell-history database tools.
  timeline:
    - '2017-04-10: Initial commit.'
    - '2017-04-11: 0.0.1 is tagged.'
    - '2017-04-14: 0.0.2 is tagged.'
    - '2017: README documents import, config, search, and log workflows.'
  usage:
    - >
      A user places the script directory on PATH or aliases `hist`, runs `hist import`,
      and searches with `hist search term` or shorthand `hist /term`. `hist config`
      prints paths for Bash history, the SQLite database, and sqlite3.
related-packages:
  - id: brew:atuin
    reason: >
      Choose Atuin when you need contextual search across several shells, optional
      end-to-end encrypted synchronization, or self-hosted sync instead of historian's
      local Bash-and-SQLite workflow.
    rel: alternative
    sources:
      - https://github.com/jcsalterego/historian#readme
      - https://docs.atuin.sh/latest/
  - id: brew:mcfly
    reason: >
      Choose McFly for an interactive Ctrl-R replacement that ranks commands using
      directory, recency, frequency and exit status while preserving the normal shell
      history file.
    rel: alternative
    sources:
      - https://github.com/jcsalterego/historian#readme
      - https://github.com/cantino/mcfly#readme
  - id: brew:hstr
    reason: >
      Choose HSTR for a Bash or Zsh history TUI with command deletion and bookmarking,
      rather than historian's import-and-query command interface.
    rel: alternative
    sources:
      - https://github.com/jcsalterego/historian#readme
      - https://github.com/dvorka/hstr#readme
category: developer-tools
package-manager:
  brew: historian
  macports: hist
package-manager-url: https://formulae.brew.sh/formula/historian
license: BSD-2-Clause
tags:
  - cli
  - shell-history
  - sqlite
description: Command-line utility for managing shell history in a SQLite database
executables:
  - hist
provenance:
  formula: historian
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
