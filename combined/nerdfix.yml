id: brew:nerdfix
display-name: nerdfix
homepage: https://github.com/loichyan/nerdfix
repo: https://github.com/loichyan/nerdfix
docs:
  - https://github.com/loichyan/nerdfix#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is focused but meaningful among Neovim, terminal UI, statusline, prompt,
      and dotfile maintainers who embedded Nerd Font glyphs before the v3 remap. The
      repo topics include checker, neovim, nerd-fonts, and rust; the av.db source record
      shows Homebrew and Nix packaging. The Homebrew formula API reported stable version
      0.4.2 and 3 install-on-request events in the prior 30 days when checked on
      2026-07-01, so this is a niche repair tool rather than a broadly installed daily
      CLI.
  package-nerd-significance:
    - >
      nerdfix is historically interesting because it captures a rare maintenance problem
      in terminal tooling: Unicode private-use glyphs became an API surface. The package
      exists because an upstream font project made a compatibility-breaking cleanup, and
      downstream terminal packages needed a source-scanning migration tool.
  project-history:
    - >
      The README explains the motivation directly: Nerd Fonts is used by many UI
      projects, but some codepoints conflicted with other fonts, especially CJK fonts.
      Nerd Fonts therefore changed some codepoints; over 2,000 `mdi-*` icons were
      deprecated after v2.3.3 and targeted for removal in v3. nerdfix indexes the
      official cheat sheet so maintainers do not have to inspect every glyph manually.
    - >
      GitHub metadata retrieved on 2026-07-01 showed the repository created on
      2023-03-16, written in Rust, with about 468 stars and 7 forks. GitHub releases
      list v0.1.0 on 2023-03-25 and v0.4.2 on 2024-11-23.
  related-projects:
    - Nerd Fonts
    - Neovim
    - Material Design Icons
    - terminal prompts
    - terminal UI projects
  sources:
    - https://api.github.com/repos/loichyan/nerdfix
    - https://api.github.com/repos/loichyan/nerdfix/releases?per_page=100
    - https://formulae.brew.sh/api/formula/nerdfix.json
    - https://github.com/loichyan/nerdfix
    - https://github.com/loichyan/nerdfix/releases
    - https://github.com/ryanoasis/nerd-fonts/discussions/716
    - https://www.nerdfonts.com/
  summary:
    - >
      nerdfix is a Rust CLI created in March 2023 to find and optionally fix obsolete
      Nerd Font glyphs in source trees. Its purpose is tightly coupled to the Nerd Fonts
      v2.3.3 to v3 migration, where many icon codepoints, especially Material Design
      Icons, moved to avoid conflicts and keep icons in private-use areas.
  timeline:
    - '2023-03-16: GitHub repository created.'
    - '2023-03-25: v0.1.0 initial release.'
    - '2024-11-23: v0.4.2 release, the Homebrew stable version reported on 2026-07-01.'
  usage:
    - >
      Package nerds use nerdfix during migrations: scan project files for obsolete
      glyphs, review candidate replacements, and apply fixes before users upgrade their
      Nerd Fonts installation. It is most useful in repositories that carry icon
      literals in Lua, shell, Vimscript, TOML, documentation, prompts, and terminal UI
      source code.
related-packages: []
category: developer-tools
package-manager:
  brew: nerdfix
  nix: nerdfix
