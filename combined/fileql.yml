id: brew:fileql
display-name: FileQL
homepage: https://github.com/AmrDeveloper/FileQL
repo: https://github.com/AmrDeveloper/FileQL
docs:
  - https://github.com/AmrDeveloper/FileQL#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FileQL is a newer niche developer tool rather than a broad infrastructure
      standard. Its adoption evidence is mainly official packaging/install notes from
      the README, which point to Cargo and winget, plus source_facts package-manager
      data for Homebrew and winget.
    - >
      The project is best understood as part of the GitQL family of experiments:
      applying a familiar SQL-ish query model to developer-local data sources that are
      normally handled with find, awk, ls, or custom scripts.
  package-nerd-significance:
    - >
      FileQL is notable less for scale than for shape: it is a Rust CLI distributed
      through developer package channels, with no daemon, no config, and no credentials.
    - >
      It is also a tidy example of a domain-specific query executable where the package
      name, binary, README examples, and install path are the whole product surface.
  project-history:
    - >
      The FileQL repository was created in February 2024. The README describes it as
      File Query Language and says it lets users run SQL-like queries on local files
      using the GitQL SDK.
    - >
      The first tagged release, 0.1.0, was published in February 2024, followed by a
      short sequence of 0.x releases through 2025.
    - >
      The README documents a `files` table with columns such as path, parent, extension,
      is_dir, is_file, and size, plus SQL-like examples such as SELECT, COUNT, DISTINCT,
      LIKE, and local-file query functions.
  related-projects:
    - >
      FileQL is built around the GitQL SDK and belongs to the broader family of SQL-like
      command-line query tools for developer data.
    - >
      Adjacent tools include GitQL itself, filesystem search tools, and
      JSON/CSV-producing command-line utilities.
  sources:
    - https://github.com/AmrDeveloper/FileQL
    - https://github.com/AmrDeveloper/FileQL/releases/tag/0.1.0
    - https://github.com/AmrDeveloper/FileQL/releases/tag/0.10.0
    - https://raw.githubusercontent.com/AmrDeveloper/FileQL/master/README.md
  summary:
    - >
      FileQL is a small Rust CLI that runs SQL-like queries against local filesystem
      metadata instead of a database, using the GitQL SDK.
    - >
      Its package-manager hook is simple: it gives developers a query-language way to
      inspect files from a shell pipeline or terminal without standing up a database.
  timeline:
    - '2024-02: Repository created and 0.1.0 release published.'
    - '2024-03: 0.2.0 release published.'
    - '2024-08: 0.6.0 and 0.7.0 releases published.'
    - '2024-11: 0.9.0 release published.'
    - '2025-02: 0.10.0 release published.'
  usage:
    - >
      Users run FileQL with paths supplied via file-selection options and a query
      supplied on the command line, optionally enabling pagination or choosing render,
      JSON, or CSV output.
    - >
      Useful queries include enumerating files, grouping by parent directory, counting
      children, filtering by extensions, and emitting machine-readable output for
      further scripting.
    - >
      Because FileQL is read-oriented and local, its workflow is lightweight: install
      the CLI, point it at paths, and use SQL-style expressions where shell globbing or
      ad hoc parsing gets awkward.
related-packages:
  - id: brew:findutils
    reason: >
      Choose GNU findutils for established predicate-and-action filesystem searches and
      direct command execution; choose FileQL when SQL-style projection, grouping, and
      aggregation over file metadata are more convenient.
    rel: alternative
    sources:
      - https://github.com/AmrDeveloper/FileQL
      - https://www.gnu.org/software/findutils/manual/html_mono/find.html
  - id: brew:gql
    reason: >
      GitQL is an adjacent tool from the same SDK family for applying SQL-like queries
      to Git repository data instead of FileQL's filesystem metadata.
    rel: adjacent_workflow
    sources:
      - https://github.com/AmrDeveloper/FileQL
      - https://github.com/AmrDeveloper/GQL
      - https://amrdeveloper.github.io/GQL/
category: developer-tools
package-manager:
  brew: fileql
  winget: amrdeveloper.fileql
package-manager-url: https://formulae.brew.sh/formula/fileql
license: MIT
tags:
  - cli
  - gitql
  - local-files
  - query-tool
  - sql
description: Run SQL-like query on local files instead of database files using the GitQL SDK
executables:
  - fileql
provenance:
  formula: fileql
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
