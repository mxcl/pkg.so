id: brew:evil-helix
display-name: Evil Helix
homepage: https://evil-helix.github.io
repo: https://github.com/usagi-flow/evil-helix
docs:
  - https://github.com/usagi-flow/evil-helix#readme
config-file-location:
  unix:
    - ~/.config/helix/config.toml
    - .helix/config.toml
  windows:
    - '%AppData%\helix\config.toml'
    - .helix\config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project ships GitHub release archives, recommends package-manager installs
      when available, and is packaged as `evil-helix` in Homebrew while still installing
      the familiar `hx` executable.
  package-nerd-significance:
    - >
      The package is interesting because it packages a behavioral fork without asking
      users to learn a new editor binary: package managers can provide a Vim-flavored
      Helix build while preserving upstream layout, configuration, and release rhythm.
  project-history:
    - >
      The README explicitly defines the project as a soft fork: it regularly rebases on
      upstream Helix, isolates changes to reduce conflicts, and treats a hard fork as a
      last resort.
  related-projects:
    - >
      Evil Helix is directly tied to upstream Helix and tracks upstream while carrying
      Vim-keybinding and default-setting changes.
  sources:
    - https://github.com/usagi-flow/evil-helix#readme
    - https://github.com/usagi-flow/evil-helix/releases
    - https://raw.githubusercontent.com/usagi-flow/evil-helix/master/book/src/configuration.md
  summary:
    - >
      Evil Helix is a soft fork of the Helix editor that keeps upstream compatibility
      while adding Vim-style keybindings and opinionated defaults.
  timeline:
    - '2022: Tags begin with Helix-style date releases such as 22.03.'
    - >
      README documents the project as a soft fork with small, regular releases tagged on
      demand.
  usage:
    - >
      Users run Evil Helix like Helix, configure it with Helix TOML configuration paths,
      and can toggle the fork behavior with the `editor.evil` option. The documented
      differences include Vim commands, motions, visual-line mode, modeline support, and
      adjusted defaults.
related-packages:
  - id: brew:helix
    reason: >
      Choose upstream Helix for its native selection-first modal model and release line;
      choose Evil Helix when you want Helix compatibility with built-in Vim-style
      bindings and defaults.
    rel: alternative
    sources:
      - https://github.com/usagi-flow/evil-helix#readme
      - https://helix-editor.com/
      - https://docs.helix-editor.com/
category: developer-tools
package-manager:
  apk: hx
  brew: evil-helix
  debian: hx
  nix: evil-helix
  winget: raskell-io.hx
package-manager-url: https://formulae.brew.sh/formula/evil-helix
license: MPL-2.0
tags:
  - cli
  - helix
  - modal-editor
  - rust
  - text-editor
  - vim-keybindings
description: Soft fork of the helix editor
executables:
  - hx
provenance:
  formula: evil-helix
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
