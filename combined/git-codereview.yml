id: brew:git-codereview
display-name: git-codereview
homepage: https://pkg.go.dev/golang.org/x/review/git-codereview
repo: https://github.com/golang/review
docs:
  - https://pkg.go.dev/golang.org/x/review/git-codereview
config-file-location:
  unix:
    - codereview.cfg
    - .git/config
    - ~/.gitconfig
credentials-file-location:
  unix: ~/.gitcookies
history:
  adoption-history:
    - >
      Its adoption is tightly connected to the Go contribution process. The official Go
      contribution guide instructs contributors to install git-codereview with go
      install, create a Gerrit account, use git codereview change to create or amend
      commits, and use git codereview mail to send changes for review.
  package-nerd-significance:
    - >
      For package records, git-codereview is a specialized but influential example of a
      project-specific workflow tool. It demonstrates how a language project can
      distribute its contribution conventions as a versioned command rather than relying
      only on prose documentation.
  project-history:
    - >
      The tool lives in the golang.org/x/review repository and its source documentation
      carries a 2014 Go Authors copyright notice. It was built around Gerrit's
      single-change review model: local work branches track pending changes, and
      amendments update the same review through a stable Change-Id.
  related-projects:
    - >
      git-codereview is tied to Gerrit, go-review.googlesource.com, and the broader Go
      contribution workflow.
  sources:
    - https://formulae.brew.sh/formula/git-codereview
    - https://github.com/golang/review
    - https://go.dev/doc/contribute
    - https://pkg.go.dev/golang.org/x/review/git-codereview
    - https://raw.githubusercontent.com/golang/review/master/git-codereview/doc.go
  summary:
    - >
      git-codereview is the Go project's Git helper for Gerrit-based code review. It
      packages project-specific contribution rules as Git subcommands, making the Go
      review process reproducible from a local checkout.
  timeline:
    - >
      2014: Source documentation copyright reflects the early Go Authors implementation
      period.
    - >
      Go contribution guide: git-codereview is documented as the supported Gerrit
      submission helper.
  usage:
    - >
      Practitioners use git-codereview to create change branches, install hooks, run
      gofmt on modified files, upload patches to Gerrit, revise reviews by amending
      commits, and submit approved changes. It supports both the common single-commit
      branch workflow and multi-commit stacks when a larger change needs sequencing.
related-packages:
  - id: brew:git
    reason: >
      git-codereview is installed as a Git extension and its change, mail, sync, and
      submit commands operate directly on Git branches, commits, configuration, and
      hooks.
    rel: adjacent_workflow
    sources:
      - https://pkg.go.dev/golang.org/x/review/git-codereview
      - https://git-scm.com/docs
category: developer-tools
package-manager:
  brew: git-codereview
  nix: git-codereview
package-manager-url: https://formulae.brew.sh/formula/git-codereview
license: BSD-3-Clause
tags:
  - cli
  - code-review
  - gerrit
  - git
description: Tool for working with Gerrit code reviews
executables:
  - git-codereview
provenance:
  formula: git-codereview
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
