id: brew:cdlabelgen
display-name: cdlabelgen
homepage: https://www.aczoom.com/tools/cdinsert/
repo: https://github.com/avinash311/cdlabelgen
docs:
  - https://www.aczoom.com/tools/cdinsert
  - https://www.aczoom.com/tools/cdinsert/cdlabelgen.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cdlabelgen reflects a Unix-era desktop workflow: generate printable PostScript
      from shell scripts, listings, or a web form, then preview or print it with
      external tools. Its documentation emphasizes minimum dependencies, needing only
      Perl, and output that can be used by PostScript or PDF-oriented print workflows.
    - >
      The package has remained in Linux and macOS package managers because it solves a
      narrow physical-media problem without needing a graphical design suite.
  package-nerd-significance:
    - >
      cdlabelgen is the kind of small, durable packaging artifact maintainers remember:
      a mostly self-contained Perl tool, tied to PostScript printing, useful long after
      CD burning stopped being fashionable because package managers preserve niche
      workflows.
  project-history:
    - >
      The ACZoom history says Avinash Chopde found cdlabelgen after searching for a good
      CD insert program, credits the original program to B W Fitzpatrick, and then
      created the online web interface plus enhancements to make it usable across
      platforms.
    - >
      The official page records cdlabelgen 4.3.0 in March 2013, source archives for
      4.3.1 beta, and an official GitHub repository for cdlabelgen and cdinsert.
  related-projects:
    - >
      The official page references GTKcdlabel as a GTK+ frontend, barcodegen for barcode
      EPS overlays, and ogonkify for character encoding support in generated PostScript.
  sources:
    - https://api.github.com/repos/avinash311/cdlabelgen
    - https://github.com/avinash311/cdlabelgen
    - https://www.aczoom.com/tools/cdinsert/
    - https://www.aczoom.com/tools/cdinsert
    - https://www.aczoom.com/tools/cdinsert/cdlabelgen.html
    - https://formulae.brew.sh/api/formula/cdlabelgen.json
  summary:
    - >
      cdlabelgen is a Perl and PostScript command-line tool for generating CD/DVD
      jewel-case inserts, envelopes, and labels, with an accompanying web interface
      maintained on ACZoom.
  timeline:
    - 'Pre-2001: B W Fitzpatrick creates the original cdlabelgen.'
    - >
      2001-2013: Avinash Chopde maintains the ACZoom cdinsert/cdlabelgen web interface
      and enhancements.
    - '2012: Man page records cdlabelgen version 4.2.0.'
    - '2013: ACZoom page lists cdlabelgen 4.3.0 and 4.3.1 beta source archives.'
  usage:
    - >
      The man page describes command-line generation of front cards, tray cards, CD
      envelopes, DVD inserts, and printable CD/DVD output. It supports file-based item
      lists, color options, EPS overlays, and PostScript output.
related-packages:
  - id: brew:ghostscript
    reason: >
      Ghostscript complements cdlabelgen by previewing or rendering its PostScript
      output, a workflow explicitly recommended by the cdlabelgen manual.
    rel: adjacent_workflow
    sources:
      - https://www.aczoom.com/tools/cdinsert/cdlabelgen.html
      - https://ghostscript.readthedocs.io/en/latest/index.html
category: productivity
package-manager:
