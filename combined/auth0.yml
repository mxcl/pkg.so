id: brew:auth0
display-name: Auth0 CLI
homepage: https://auth0.github.io/auth0-cli
repo: https://github.com/auth0/auth0-cli
docs:
  - https://auth0.github.io/auth0-cli
  - https://auth0.github.io/auth0-cli/auth0_login.html
  - https://github.com/auth0/auth0-cli#readme
config-file-location:
  unix: ~/.config/auth0/config.json
credentials-file-location:
  unix: ~/.config/auth0/config.json
history:
  adoption-history:
    - >
      Auth0 documents Homebrew as the Linux and macOS install path, Scoop as a Windows
      install path, direct release downloads, and `go install`. Homebrew currently
      packages version 1.32.0 from the official GitHub release tarball.
    - >
      Recent releases show active enterprise-feature maintenance rather than a frozen
      convenience wrapper: 2026 releases added event stream work, quickstart project
      detection, tenant and client features, Terraform generation coverage, and
      agent-aware analytics.
  package-nerd-significance:
    - >
      For package-manager users, Auth0 CLI is notable because it is a vendor-owned SaaS
      control-plane CLI with generated documentation and a fast-moving release train.
      The Homebrew package is not a third-party wrapper; it tracks the official Auth0
      repository.
    - >
      It also shows the usual secrets wrinkle for CLI packaging: the binary is simple to
      install, but real state lives in a per-user config file and, where supported, the
      OS keyring.
  project-history:
    - >
      The upstream repository was created in September 2020 under the Auth0
      organization. Its README frames the tool around developer workflows: testing
      Universal Login, tailing tenant logs, and creating, updating, listing, and
      deleting Auth0 resources from the terminal.
    - >
      The command surface has expanded well beyond login. The generated docs list
      management commands for actions, APIs, apps, custom domains, email, logs,
      organizations, roles, rules, tenants, Universal Login, users, Terraform
      generation, quickstarts, and token exchange.
  related-projects:
    - >
      Related Auth0 surfaces include the Auth0 Management API, Auth0 Terraform
      generation, Auth0 Quickstarts, Auth0 Agent Skills, and the Auth0 dashboard.
  sources:
    - https://api.github.com/repos/auth0/auth0-cli
    - https://auth0.github.io/auth0-cli/
    - https://auth0.github.io/auth0-cli/auth0_login.html
    - https://formulae.brew.sh/api/formula/auth0.json
    - https://github.com/auth0/auth0-cli#readme
    - https://github.com/auth0/auth0-cli/releases
    - https://raw.githubusercontent.com/auth0/auth0-cli/main/internal/config/config.go
    - https://raw.githubusercontent.com/auth0/auth0-cli/main/internal/config/tenant.go
  summary:
    - >
      Auth0 CLI is Auth0's official command-line tool for building, managing, and
      testing Auth0 integrations. It packages Auth0 tenant and Management API workflows
      into a Go CLI distributed through Homebrew, direct release binaries, Scoop, and
      `go install`.
  timeline:
    - '2020: Public repository created under the Auth0 GitHub organization.'
    - '2020s: CLI grows into a broad tenant-management tool with generated command docs.'
    - >
      2026: 1.28 through 1.32 releases add quickstart, event-stream, client, tenant,
      Terraform, and agent-aware analytics features.
  usage:
    - >
      Most use begins with `auth0 login`, either through a device/user flow for personal
      machines or client credentials for CI and private-cloud/non-interactive use. The
      CLI stores tenant configuration under `~/.config/auth0/config.json`; source code
      shows tenant records, default tenant state, client IDs, expiration times, and
      fallback access-token storage in that JSON file, with keyring support for tokens
      and secrets when available.
    - >
      Day-to-day usage is resource management: `auth0 apps`, `auth0 apis`, `auth0
      users`, `auth0 logs tail`, `auth0 test login`, and `auth0 terraform generate` let
      developers script Auth0 setup and inspection without leaving the shell.
related-packages: []
category: developer-tools
package-manager:
  brew: auth0
  scoop: main/auth0
package-manager-url: https://formulae.brew.sh/formula/auth0
license: MIT
tags:
  - auth0
  - cli
  - identity
  - management-api
  - oauth
  - tenant-management
description: Build, manage and test your Auth0 integrations from the command-line
executables:
  - auth0
provenance:
  formula: auth0
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
