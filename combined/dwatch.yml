homepage: https://siag.nu/dwatch/
repo: null
docs:
  - https://siag.nu/dwatch
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption evidence is thin. The official page links a source download and an
      external SUSE RPM, while the batch input lists Homebrew and MacPorts formulae,
      suggesting survival mostly as a niche packaged Unix utility rather than a widely
      discussed monitoring system.
  package-nerd-significance:
    - >
      Dwatch is package-nerd interesting mostly as a fossil of early-2000s Unix service
      babysitting: a tiny cron-friendly daemon watcher from the same ecosystem as Pen
      and Siag Office, before modern supervisors and service managers became the default
      answer.
  project-history:
    - >
      The official changelog records Dwatch's creation on 2001-08-20 to keep Pen,
      another Siag project, running on siag.nu, with release 0.1.0 published at the same
      time. The project page is deliberately old-school Unix: make, make install, a
      sample dwatch.conf, and notes that Linux and Solaris were known to work.
  related-projects:
    - >
      The official page ties Dwatch directly to Pen, using Pen as the example service to
      restart. In package-manager terms it sits near cron, watchdog scripts, service
      supervisors, and small Unix monitoring tools.
  sources:
    - https://siag.nu/dwatch
    - https://siag.nu/dwatch/ChangeLog
    - https://siag.nu/dwatch/dwatch.conf
  summary:
    - >
      Dwatch, short for Daemon Watch, is a small Unix monitoring tool by Ulric Eriksson.
      Its official page says it watches other programs and performs actions from
      conditions in a configuration file, and that it is meant to be run periodically
      from cron.
  timeline:
    - '2001: Dwatch created to keep Pen running on siag.nu; release 0.1.0 published.'
    - '2001: Official page dated August 2001 documents Linux and Solaris support.'
    - '2026: Batch input lists Homebrew and MacPorts packaging.'
  usage:
    - >
      The sample configuration shows directive, argument, and command columns, including
      examples that restart Pen when a process or TCP check is not satisfied. The
      intended workflow is to let cron invoke dwatch regularly, with dwatch deciding
      whether to run recovery commands.
related-packages: []
