id: brew:most
display-name: most
homepage: https://www.jedsoft.org/most/
repo: https://github.com/jedsoft/most
docs:
  - https://www.jedsoft.org/most
config-file-location:
  unix: ~/.mostrc
  windows: most.rc
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/most
    - https://github.com/jedsoft/most
    - https://manpages.debian.org/bullseye/most/pager.1.en.html
    - https://www.jedsoft.org/
    - https://www.jedsoft.org/most/
  summary:
    - >
      Most is John E. Davis's terminal pager, listed by Davis among his open software
      contributions alongside jed, S-Lang, and slrn. It occupies the same Unix
      command-line niche as more and less, but its identity has long been tied to richer
      terminal viewing: the project page describes support for Unix, VMS, MS-DOS, and
      Win32 systems, plus multiple windows and horizontal scrolling.
  usage:
    - >
      The program is used as a read-only file browser for terminal sessions, especially
      when files are too wide or structured for a simple line-by-line pager. Debian's
      manual page highlights several of the features that explain its persistence in
      package managers: independent split windows, optional locked scrolling between
      windows, binary-file display, status-line progress, and modes that can wrap or
      truncate lines independently. In package-manager terms it is a small, old-school
      pager rather than a shell framework or editor, useful to users who want a pager
      with more screen layout control than less without leaving the terminal.
related-packages:
  - id: brew:less
    reason: >
      Choose less for the widely deployed conventional pager experience; choose MOST
      when multiple windows and horizontal scrolling are priorities.
    rel: alternative
    sources:
      - https://www.jedsoft.org/most/
      - https://www.greenwoodsoftware.com/less/index.html
category: developer-tools
package-manager:
  apk: most
  brew: most
  debian: most
  dnf: most
  macports: most
  nix: most
  pacman: most
  ubuntu: most
  zypper: most
package-manager-url: https://formulae.brew.sh/formula/most
license: GPL-2.0-or-later
tags:
  - cli
  - pager
  - terminal
  - text-viewer
description: Powerful paging program
executables:
  - most
provenance:
  formula: most
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
