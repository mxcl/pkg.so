id: brew:bacon-ls
display-name: bacon-ls
homepage: https://github.com/crisidev/bacon-ls
repo: https://github.com/crisidev/bacon-ls
docs:
  - https://github.com/crisidev/bacon-ls#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is concentrated in editor and Rust-tooling circles. The README documents
      VS Code extension distribution through VSCE and Open VSX, Mason.nvim installation,
      manual cargo install, and Nix flakes. Homebrew packaging adds another
      general-purpose install path.
  package-nerd-significance:
    - >
      bacon-ls is notable because it packages a focused LSP surface around diagnostics
      only. For Rust developers with large workspaces, it is a small composable
      alternative to making rust-analyzer do every job, and its packaging across cargo,
      editor registries, Nix, Mason, and Homebrew reflects modern developer-tool
      distribution.
  project-history:
    - >
      The GitHub repository was created in May 2024. Its README frames the project
      around a specific pain point: rust-analyzer diagnostics can be slow on large Rust
      codebases, so bacon-ls exposes LSP diagnostic capabilities backed by Bacon or
      cargo.
    - >
      By 2025-2026 the project had a steady GitHub release train from 0.6.0 to 0.29.0.
      The README documents an important evolution: the cargo backend became available in
      0.23.0 and became the default in 0.26.0, making bacon-ls useful even without a
      separate background bacon process.
  related-projects:
    - >
      The README explicitly relates bacon-ls to Bacon, rust-analyzer, cargo check, cargo
      clippy, the Language Server Protocol, VS Code, Mason.nvim, Neovim, Coc.nvim,
      Helix, Crates.io, and Nix flakes.
  sources:
    - https://api.github.com/repos/crisidev/bacon-ls
    - https://api.github.com/repos/crisidev/bacon-ls/releases
    - https://github.com/crisidev/bacon-ls#readme
  summary:
    - >
      bacon-ls is a Rust language-server companion that publishes diagnostics from Bacon
      or directly from cargo. It is designed to supplement rust-analyzer, not replace
      it.
  timeline:
    - '2024: GitHub repository created for crisidev/bacon-ls.'
    - '2025: 0.6.0 published as the earliest GitHub release listed by the repository.'
    - '2025: 0.23.0 introduced the cargo backend according to the README.'
    - '2025: 0.26.0 made the cargo backend the default according to the README.'
    - '2026: 0.29.0 published in GitHub releases.'
  usage:
    - >
      Users install bacon-ls alongside Rust tooling and configure an editor LSP client.
      It can publish diagnostics on save, open, close, rename, and manual triggers; run
      cargo check or clippy directly; or read Bacon's exported diagnostics file when
      Bacon is already running.
related-packages:
  - id: brew:rust-analyzer
    reason: >
      Run rust-analyzer alongside bacon-ls for completion, navigation, analysis, and
      refactoring, while bacon-ls takes responsibility for compiler diagnostics as
      recommended by its official documentation.
    rel: adjacent_workflow
    sources:
      - https://github.com/crisidev/bacon-ls#readme
      - https://rust-analyzer.github.io/book/
  - id: brew:bacon
    reason: >
      Install Bacon when you prefer bacon-ls's optional Bacon backend, which consumes
      the diagnostic export maintained by Bacon's continuous watch loop.
    rel: adjacent_workflow
    sources:
      - https://github.com/crisidev/bacon-ls#readme
      - https://dystroy.org/bacon/
category: developer-tools
package-manager:
  brew: bacon-ls
package-manager-url: https://formulae.brew.sh/formula/bacon-ls
license: MIT
tags:
  - cli
  - diagnostics
  - language-server
  - rust
description: Rust diagnostic provider based on Bacon
executables:
  - bacon-ls
provenance:
  formula: bacon-ls
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
