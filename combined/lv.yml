id: brew:lv
display-name: lv
homepage: https://salsa.debian.org/debian/lv
repo: https://salsa.debian.org/debian/lv
docs:
  - https://salsa.debian.org/debian/lv#readme
config-file-location:
  unix: ~/.lv
credentials-file-location: null
history:
  adoption-history:
    - >
      lv's adoption is mostly distribution-driven rather than community-site driven. It
      survives in Debian, Ubuntu, Homebrew, MacPorts, Nix, Fedora-family packaging, and
      other Unix package collections because it solves a durable terminal problem:
      viewing and searching multilingual text on older and mixed-encoding systems.
    - >
      The Debian changelog shows ongoing packaging maintenance into 2026, including
      modern compiler compatibility work, even though the upstream feature history is
      much older.
  package-nerd-significance:
    - >
      lv is the kind of old terminal utility package that remains valuable precisely
      because modern stacks still encounter old encodings. For package maintainers it is
      a small C program with a long tail: patches, portability fixes, and distro
      maintenance preserve behavior that newer pagers do not always cover.
  project-history:
    - >
      The upstream README in the Debian source records copyright years beginning in 1996
      and points to NARITA Tomio's original web documentation. The bundled man page
      describes lv as a completely original implementation, not code derived from less,
      grep, or other programs.
    - >
      Release notes show active upstream work through the early 2000s, including
      Debian-related patches and portability fixes. Version 4.51 was released in January
      2004, while later distribution maintenance continued through Debian packaging
      updates.
  related-projects:
    - less is the familiar pager interface that lv intentionally resembles.
    - nkf and tcs are comparable coding-system translation tools mentioned by the lv man page.
    - grep is the model for the `lgrep` mode.
  sources:
    - https://salsa.debian.org/debian/lv/-/raw/master/README
    - https://salsa.debian.org/debian/lv/-/raw/master/debian/changelog
    - https://salsa.debian.org/debian/lv/-/raw/master/lv.1
    - https://salsa.debian.org/debian/lv/-/raw/master/relnote.html
  summary:
    - >
      lv is a multilingual file viewer and grep-like tool originally by NARITA Tomio. It
      looks like a less-style pager but adds character-set conversion, multilingual
      regular expressions, Unicode handling, and the `lgrep` mode.
  timeline:
    - '1996: Copyright start year recorded in the upstream README.'
    - '2003: Debian-related patches incorporated in upstream 4.50 release notes.'
    - '2004: lv 4.51 release notes published.'
    - '2026: Debian changelog records a compiler-compatibility non-maintainer upload.'
  usage:
    - >
      Users run `lv` as a terminal pager and `lgrep` as the grep mode. The man page
      documents options for input, keyboard, output, pathname, and fallback coding
      systems, with examples for ISO-8859, Shift-JIS, EUC, Big5, HZ, UTF-7, and UTF-8.
    - >
      The official man page documents a `.lv` configuration file in the user's home
      directory, an `_lv` file for MSDOS, and the `LV` environment variable.
      Command-line options are read last, so they override file and environment
      settings.
related-packages:
  - id: brew:less
    reason: >
      Choose less for the conventional general-purpose Unix pager; choose lv when
      automatic character-set conversion and multilingual searching are central
      requirements.
    rel: alternative
    sources:
      - https://salsa.debian.org/debian/lv/-/raw/master/lv.1
      - https://www.greenwoodsoftware.com/less/index.html
  - id: brew:nkf
    reason: >
      Use nkf when the main job is noninteractive character-encoding detection or
      conversion rather than lv's interactive viewing and searching.
    rel: alternative
    sources:
      - https://salsa.debian.org/debian/lv/-/raw/master/lv.1
      - https://github.com/nurse/nkf/blob/master/nkf.1
  - id: brew:grep
    reason: >
      Use GNU grep for conventional stream-oriented pattern matching; lv's `lgrep` mode
      is useful when matching must account for multilingual input conversion.
    rel: alternative
    sources:
      - https://salsa.debian.org/debian/lv/-/raw/master/lv.1
      - https://www.gnu.org/software/grep/manual/grep.html
category: developer-tools
package-manager:
  brew: lv
  debian: lv
  dnf: lv
  macports: lv
  nix: lv
  ubuntu: lv
package-manager-url: https://formulae.brew.sh/formula/lv
license: GPL-2.0-or-later
tags:
  - cli
  - file-viewer
  - grep
  - multilingual
  - terminal
description: Powerful multi-lingual file viewer/grep
executables:
  - lgrep
  - lv
provenance:
  formula: lv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
