id: brew:cai
display-name: cai
homepage: https://github.com/ad-si/cai
repo: https://github.com/ad-si/cai
docs:
  - https://github.com/ad-si/cai#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/cai/config.yaml
    - ~/.config/cai/config.yaml
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/cai/secrets.yaml
    - ~/.config/cai/secrets.yaml
history:
  adoption-history:
    - >
      cai belongs to the wave of post-ChatGPT command-line LLM clients. Its official
      README positions it as a user-friendly CLI with providers including Anthropic,
      OpenAI, Google, Groq, Cerebras, DeepSeek, xAI, Ollama, and Llamafile, and it is
      distributed through Cargo and Homebrew.
  package-nerd-significance:
    - >
      cai is a good snapshot of how AI tooling entered package managers: a fast-moving
      Rust CLI that maps commercial and local model providers into Unix-style commands,
      stdin/stdout workflows, and package-manager installation.
  project-history:
    - >
      The public repository was created on 2024-03-28 and the changelog marks 0.1.0 as
      the initial release on the same date. Early releases added provider subcommands,
      proper clap-based argument handling, local Ollama support, stdin prompt input,
      Anthropic support, multi-model prompting through cai all, and markdown syntax
      highlighting.
    - >
      Through 2024 and 2025 cai expanded from a simple prompt CLI into a multi-provider
      terminal assistant, adding JSON output, raw output, OCR, file renaming, changelog
      generation, programming-language context commands, DeepSeek, Cerebras, xAI, Google
      Gemini, image generation, transcription, rewrite, and shell-adjacent helper
      commands.
  related-projects:
    - >
      The official README lists related CLI LLM tools such as AIChat, clai, Ell, Goose,
      llm, smartcat, and tgpt.
    - >
      cai integrates with hosted providers and local runtimes including OpenAI,
      Anthropic, Google Gemini, Groq, Cerebras, DeepSeek, xAI, Ollama, and Llamafile.
  sources:
    - https://api.github.com/repos/ad-si/cai
    - https://github.com/ad-si/cai#readme
    - https://github.com/ad-si/cai/blob/main/changelog.md
  summary:
    - >
      cai is a Rust CLI for running LLM, image, OCR, speech, coding-context, and
      automation prompts from the terminal.
  timeline:
    - '2024: Initial 0.1.0 release.'
    - >
      2024: Provider subcommands, Ollama, Anthropic, multi-model prompts, and JSON/raw
      output added.
    - >
      2025: OCR, file renaming, programming contexts, DeepSeek, Cerebras, xAI, Gemini,
      image generation, and transcription features added.
    - '2026: 0.13.0 adds more commands including photo, say, config, query, edit, and commit.'
  usage:
    - >
      Typical usage is short natural-language prompts, stdin pipelines,
      provider-specific model shortcuts, simultaneous prompting across providers, OCR,
      image generation, shell command generation, database querying, and coding-context
      prompts. The README documents API key setup on first run and support for local LLM
      servers.
related-packages:
  - id: brew:aichat
    reason: >
      Choose AIChat when you want an interactive chat REPL, retrieval-augmented
      generation, tools, agents, and a web interface in addition to multi-provider
      terminal access.
    rel: alternative
    sources:
      - https://github.com/ad-si/cai#related
      - https://github.com/sigoden/aichat#readme
  - id: brew:llm
    reason: >
      Choose LLM when you want a plugin-oriented CLI and Python API with SQLite prompt
      logging, embeddings, templates, and an extensible model ecosystem.
    rel: alternative
    sources:
      - https://github.com/ad-si/cai#related
      - https://llm.datasette.io/
  - id: brew:ollama
    reason: >
      Use Ollama alongside cai to run supported models locally through the Ollama server
      instead of relying exclusively on hosted model APIs.
    rel: adjacent_workflow
    sources:
      - https://github.com/ad-si/cai#readme
      - https://ollama.com/
category: ai
package-manager:
  brew: cai
  nix: cai
package-manager-url: https://formulae.brew.sh/formula/cai
license: ISC
tags:
  - ai
  - anthropic
  - cli
  - llm
  - openai
  - prompting
description: CLI tool for prompting LLMs
executables:
  - cai
provenance:
  formula: cai
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
