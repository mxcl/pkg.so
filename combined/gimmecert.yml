id: brew:gimmecert
display-name: Gimmecert
homepage: https://github.com/azaghal/gimmecert
repo: https://code.majic.rs/gimmecert
docs:
  - https://gimmecert.readthedocs.io/en/stable
config-file-location: null
credentials-file-location:
  unix:
    - .gimmecert/ca/levelN.key.pem
    - .gimmecert/server/NAME.key.pem
    - .gimmecert/client/NAME.key.pem
history:
  adoption-history:
    - >
      The project serves a narrow systems-integration niche rather than a broad
      developer-tool audience. Its own documentation names local experiments,
      development integration, and test or CI/CD deployments as the intended
      environments, and the Homebrew formula gives macOS users a package-manager install
      path.
  package-nerd-significance:
    - >
      Gimmecert is notable as a packaged alternative to hand-written OpenSSL or certtool
      invocations. Its package value is convenience and repeatability: one command
      creates a disposable hierarchy with predictable paths that can be checked by tests
      or local services.
  project-history:
    - >
      The documentation says the tool was created to remove the pain of setting up a CA
      hierarchy and issuing a small number of test certificates. Its first documented
      release implemented per-directory CA initialization plus server and client
      certificate issuance; later releases added CSR handling, renewal, Python-version
      updates, ECDSA key support, and configurable key parameters.
  related-projects:
    - >
      The documentation compares Gimmecert with OpenSSL CLI and GnuTLS certtool, arguing
      that those tools are powerful but tedious for small disposable certificate sets.
  sources:
    - https://formulae.brew.sh/formula/gimmecert
    - https://gimmecert.readthedocs.io/en/stable/
    - https://gimmecert.readthedocs.io/en/stable/about.html
    - https://gimmecert.readthedocs.io/en/stable/releasenotes.html
    - https://gimmecert.readthedocs.io/en/stable/usage.html
  summary:
    - >
      Gimmecert is a Python CLI for creating a local X.509 certificate authority
      hierarchy and issuing throwaway server or client certificates for development,
      testing, and CI/CD environments.
  timeline:
    - >
      0.1.0: First documented release with per-directory CA setup and server/client
      certificate issuance.
    - '0.2.0: Added smaller fixes and test-environment improvements.'
    - '0.4.0: Added ECDSA and configurable private-key generation.'
    - '0.5.0: Added Python 3.9 support and dependency updates.'
  usage:
    - >
      Practitioners run gimmecert init inside a project directory, then issue server or
      client certificates into the .gimmecert tree. The generated PEM files are suited
      to software that requires TLS or mutual-TLS material during tests without
      introducing a long-lived certificate authority.
related-packages:
  - id: brew:mkcert
    reason: >
      Choose mkcert when the main goal is a zero-configuration certificate trusted by
      local browsers and operating-system trust stores; choose Gimmecert for an explicit
      per-project hierarchy with server and client certificates.
    rel: alternative
    sources:
      - https://github.com/FiloSottile/mkcert#readme
      - https://gimmecert.readthedocs.io/en/stable/usage.html
  - id: brew:openssl@3
    reason: >
      Choose OpenSSL when you need direct control over CSRs, CA databases, extensions,
      revocation, and certificate formats; Gimmecert automates the smaller disposable-CA
      workflow.
    rel: alternative
    sources:
      - https://gimmecert.readthedocs.io/en/stable/about.html
      - https://docs.openssl.org/3.6/man1/openssl-req/
      - https://docs.openssl.org/3.6/man1/openssl-ca/
category: security
package-manager:
  brew: gimmecert
package-manager-url: https://formulae.brew.sh/formula/gimmecert
license: GPL-3.0-or-later
tags:
  - certificate-authority
  - certificates
  - cli
  - python
  - x509
description: Quickly issue X.509 server and client certificates using locally-generated CA
executables:
  - gimmecert
provenance:
  formula: gimmecert
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
