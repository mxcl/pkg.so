id: brew:cdpr
display-name: CDPR
homepage: https://www.monkeymental.com/
repo: https://sourceforge.net/p/cdpr/code
docs:
  - https://sourceforge.net/projects/cdpr
  - https://www.monkeymental.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CDPR had the classic small-admin-tool adoption path: tarball releases on
      SourceForge, distro packaging for Unix-like systems, and enough operational
      usefulness to survive in Homebrew, Debian, Ubuntu, MacPorts, and Nix per the
      supplied package-manager metadata.
  package-nerd-significance:
    - >
      CDPR is package-nerd interesting because it is a tiny single-purpose network
      discovery tool that packages cleanly, needs libpcap-style platform support, and
      fills the gap when a host needs CDP visibility without a full network-management
      suite.
  project-history:
    - >
      SourceForge lists the project as registered on 2003-02-11 and describes it as a
      network-monitoring utility for decoding Cisco Discovery Protocol packets. The
      MonkeyMental project page identifies CDPR 2.4 as the packaged release and says the
      tool is known to compile and run on Solaris, Linux, HP-UX, AIX, and Windows with
      pcap.
  related-projects:
    - Cisco Discovery Protocol is the network protocol CDPR decodes.
    - libpcap/pcap-style capture support is used for packet capture on supported systems.
  sources:
    - https://sourceforge.net/p/cdpr/code
    - https://www.monkeymental.com/
    - https://sourceforge.net/projects/cdpr
    - https://formulae.brew.sh/api/formula/cdpr.json
    - https://sourceforge.net/projects/cdpr/files/
  summary:
    - >
      CDPR, the Cisco Discovery Protocol Reporter, is a small C command-line utility for
      decoding CDP packets so a host can report which Cisco switch and port it is
      connected to.
  timeline:
    - '2003: CDPR project registered on SourceForge.'
    - '2010: SourceForge files list cdpr-2.4.tgz in the cdpr file area.'
    - '2013: SourceForge project metadata lists the last update as 2013-02-18.'
  usage:
    - >
      Administrators run cdpr to decode the local network's CDP announcements. In
      verbose mode it can decode the full packet, including VLAN and capability
      information, and MonkeyMental says it can report data back to a server for a
      switch-port database.
related-packages:
  - id: brew:lldpd
    reason: >
      Choose lldpd when you need a resident daemon that can send and receive
      standards-based LLDP as well as CDP and other vendor discovery protocols; choose
      CDPR for a small CDP-focused reporting command.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/cdpr/
      - https://lldpd.github.io/
      - https://lldpd.github.io/usage.html
category: networking
package-manager:
  brew: cdpr
  debian: cdpr
  macports: cdpr
  nix: cdpr
  ubuntu: cdpr
package-manager-url: https://formulae.brew.sh/formula/cdpr
license: GPL-2.0-or-later
tags:
  - c
  - cisco-discovery-protocol
  - cli
  - network-monitoring
  - packet-decoding
description: Cisco Discovery Protocol Reporter
executables:
  - cdpr
provenance:
  formula: cdpr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
