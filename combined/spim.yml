id: brew:spim
display-name: SPIM
homepage: https://spimsimulator.sourceforge.net/
repo: https://sourceforge.net/p/spimsimulator/code/HEAD/tree
docs:
  - https://sourceforge.net/p/spimsimulator/code/HEAD/tree/ChangeLog
  - https://spimsimulator.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SPIM persisted in package collections because it was a compact teaching tool with
      a stable command-line interface. The input facts list Homebrew, Debian, Fedora,
      MacPorts, Ubuntu, and winget packages.
  package-nerd-significance:
    - >
      Package maintainers care about SPIM because it is classic educational
      infrastructure: small, stable, source-available, and useful on lab machines where
      students need the same MIPS simulator from a package manager.
  project-history:
    - >
      The official site says SPIM reads and executes MIPS32 assembly programs, provides
      a simple debugger and minimal operating-system services, and includes source code
      and documentation. Its copyright notice spans 1990 to 2023.
  related-projects:
    - QtSpim
    - xspim
    - PCSpim
    - MIPS32
  sources:
    - https://sourceforge.net/p/spimsimulator/code/HEAD/tree/ChangeLog
    - https://spimsimulator.sourceforge.net/
    - https://spimsimulator.sourceforge.net/older.html
    - input source_facts.package-manager
  summary:
    - >
      SPIM is James Larus's long-running MIPS32 simulator, packaged as a terminal
      simulator and historically accompanied by graphical variants for teaching assembly
      language and computer architecture.
  timeline:
    - "1990: Copyright period begins for James R. Larus's SPIM codebase."
    - 'Pre-7.0: Older SPIM versions implemented the MIPS-I instruction set.'
    - >
      7.0 and later: SPIM moved to the MIPS32 architecture according to the
      older-versions page.
    - '2023: ChangeLog records release 9.1.24 on August 4.'
    - '2023: Official site says SPIM is no longer supported and should retire.'
  usage:
    - >
      The terminal `spim` program is used to run assembly-language programs for the
      simulator, while QtSpim provides a cross-platform GUI. The official site says
      older PCSpim and xspim interfaces remain available but are no longer maintained.
category: science
package-manager:
  brew: spim
  debian: spim
  dnf: spim
  macports: spim
  ubuntu: spim
  winget: JamesLarus.SPIM
package-manager-url: https://formulae.brew.sh/formula/spim
license: BSD-3-Clause
tags:
  - assembly
  - cli
  - education
  - mips
  - simulator
  - sourceforge
description: MIPS32 simulator
executables:
  - spim
provenance:
  formula: spim
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
