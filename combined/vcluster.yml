id: brew:vcluster
display-name: vcluster
homepage: https://www.vcluster.com
repo: https://github.com/loft-sh/vcluster
docs:
  - https://www.vcluster.com/docs
config-file-location:
  unix:
    - vcluster.yaml
    - /etc/vcluster/vcluster.yaml
    - /var/lib/vcluster/config.yaml
credentials-file-location:
  unix:
    - ~/.kube/config
    - /var/lib/vcluster/kubeconfig.yaml
history:
  adoption-history:
    - >
      vcluster's adoption followed platform-engineering and cloud-native multi-tenancy
      needs: development environments, ephemeral CI/CD clusters, internal developer
      platforms, customer environments, and later GPU and AI infrastructure. The GitHub
      README now presents it as production Kubernetes and AI infrastructure for tenant
      clusters, with Kubernetes certification, more than 11,000 GitHub stars, and public
      customer references.
    - >
      The project also expanded from the original shared-host-cluster model into
      multiple isolation profiles. The README and docs describe shared nodes, dedicated
      nodes, private nodes, Docker-based local clusters, and standalone operation,
      reflecting a shift from developer-platform convenience toward production tenant
      isolation.
  package-nerd-significance:
    - >
      vcluster is package-nerd significant because it gives a single CLI the feel of
      `kind` or `minikube` while targeting a harder production problem: many Kubernetes
      tenants sharing or virtualizing infrastructure without copying a full cluster for
      each one.
    - >
      For package managers, it is also a moving cloud-native binary with a fast release
      train and a YAML-centered workflow. Installing `vcluster` gives developers a
      portable local and remote control-plane tool that composes with kubectl, Helm,
      Argo CD, Crossplane, Terraform, and Cluster API-style platform workflows.
  project-history:
    - >
      Loft Labs introduced vcluster as a response to Kubernetes multi-tenancy tradeoffs:
      namespace-only isolation can be too weak for teams that need their own CRDs and
      admin-like control, while one physical cluster per tenant is expensive and
      operationally heavy. A Loft-authored 2022 article describes virtual clusters as a
      model that combines the tenant experience of a dedicated cluster with the cost
      profile of shared infrastructure.
    - >
      A May 12, 2022 Loft Labs announcement says vcluster was first launched in April
      2021 and had grown to more than 3 million downloads and over 1,500 GitHub stars in
      less than a year. The same announcement positions vcluster as a lightweight
      cluster running inside namespaces of underlying Kubernetes clusters and notes CNCF
      conformance certification.
  related-projects:
    - Kubernetes is the substrate and API model that vcluster virtualizes.
    - >
      kubectl, Helm, Terraform, Argo CD, Crossplane, and Cluster API are common
      companion tools in vcluster workflows.
    - >
      kind and minikube are adjacent local-cluster tools, while vcluster's niche is
      tenant clusters and virtual control planes on shared or dedicated infrastructure.
    - >
      Loft Labs' related platform projects and integrations include vCluster Platform,
      vNode, vMetal, Netris integration, and the Docker-based `vind` driver.
  sources:
    - https://api.github.com/repos/loft-sh/vcluster/releases
    - https://github.com/loft-sh/vcluster
    - https://opensource.com/article/22/3/virtual-kubernetes-clusters-new-model-multitenancy
    - >
      https://www.vcluster.com/blog/loft-labs-simplifies-virtual-kubernetes-cluster-management-with-new-open-source-project
    - https://www.vcluster.com/docs/vcluster/0.29.0/introduction/design-principles
    - https://www.vcluster.com/docs/vcluster/introduction/architecture
    - https://www.vcluster.com/docs/vcluster/introduction/what-are-virtual-clusters
  summary:
    - >
      vcluster is Loft Labs' open-source tool for creating virtual, tenant-oriented
      Kubernetes clusters. Instead of giving every team a full physical or cloud
      cluster, vcluster runs an isolated Kubernetes control plane and syncs selected
      resources onto underlying infrastructure.
  timeline:
    - '2021-04: Loft Labs first launches vcluster, according to its 2022 announcement.'
    - >
      2022-03-29: Opensource.com publishes Loft's overview of virtual Kubernetes
      clusters and vcluster's multi-tenancy model.
    - >
      2022-05-12: Loft Labs announces a Cluster API provider for vcluster and reports
      more than 3 million downloads.
    - >
      2026-06: GitHub release data shows v0.35.1 published, while the docs list v0.35 as
      the stable documentation version.
    - >
      2026-07-02: GitHub release data shows v0.36.0-alpha.1, indicating active
      pre-release development after v0.35.
  usage:
    - >
      A common workflow is to run `vcluster create my-vcluster --namespace team-x`,
      connect kubectl to the virtual cluster, and let users install workloads as if they
      had a normal Kubernetes cluster. The virtual cluster can expose its own API
      server, CRDs, RBAC, and namespace view while the host cluster schedules or hosts
      the underlying resources.
    - >
      Configuration is commonly expressed in `vcluster.yaml`, where users choose sync
      behavior, node isolation, service exposure, private nodes, standalone mode, and
      integrations. The design-principles documentation emphasizes low overhead, few
      host-cluster API requests, flexible deployment by CLI/Helm/Terraform, no
      cluster-admin requirement for basic deployment, and single-namespace
      encapsulation.
category: cloud-infrastructure
package-manager:
  brew: vcluster
  nix: vcluster
  scoop: main/vcluster
  winget: loft-sh.vcluster
package-manager-url: https://formulae.brew.sh/formula/vcluster
license: Apache-2.0
tags:
  - cli
  - kubernetes
  - multi-tenancy
  - virtual-clusters
description: Creates fully functional virtual k8s cluster inside host k8s cluster's namespace
executables:
  - vcluster
provenance:
  formula: vcluster
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
