  - https://llvm.org/docs
  - https://llvm.org/doxygen
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LLVM grew from an academic compiler-research project into an umbrella project used
      by commercial products, open-source systems, and research projects. Clang's
      adoption as a production C-family compiler and LLVM's reusable optimizer and
      code-generation libraries established the ecosystem as a major alternative to
      traditional monolithic compiler suites.
    - >
      Distribution packages and versioned formulas let developers install LLVM alongside
      system compilers without replacing them. The llvm@22 formula serves users who need
      the LLVM 22 toolchain generation after the unversioned formula advances.
  package-nerd-significance:
    - >
      LLVM is unusually rich package-manager territory: a single installation supplies
      compilers, optimizers, assemblers, binary utilities, debuggability tools, language
      servers, static-analysis tools, coverage tools, and MLIR utilities. Versioned
      packages matter because compiler behavior, supported targets, ABI expectations,
      and build-system compatibility can change between major releases.
    - >
      LLVM also underpins many adjacent language runtimes and developer tools. Package
      maintainers routinely use its individual utilities as drop-in or cross-platform
      alternatives to GNU and platform-specific tools.
  project-history:
    - >
      LLVM began as a University of Illinois research project aimed at an SSA-based
      compilation strategy supporting both static and dynamic compilation. It evolved
      into a collection of reusable compiler and toolchain technologies rather than a
      traditional virtual machine.
    - >
      The project expanded into an umbrella for LLVM Core, Clang, LLD, libc++, MLIR, and
      other subprojects. The formerly separate repositories were consolidated into the
      unified llvm-project Git repository, simplifying coordinated development and
      release management.
  related-projects:
    - Clang is LLVM's C-family compiler frontend.
    - LLD is the LLVM linker.
    - MLIR supplies reusable multi-level intermediate-representation infrastructure.
    - libc++ and compiler-rt provide runtime and standard-library components.
    - >
      GNU Compiler Collection and GNU Binutils are common alternative or complementary
      toolchains.
  sources:
    - https://github.com/llvm/llvm-project
    - https://llvm.org/
    - https://llvm.org/docs/
    - https://llvm.org/docs/GettingStarted.html
  summary:
    - >
      LLVM 22 is a versioned distribution of the LLVM compiler and toolchain ecosystem.
      It packages LLVM libraries together with Clang, MLIR, binary utilities, analysis
      tools, language-server tooling, and numerous target-independent development
      utilities.
  timeline:
    - '2000: LLVM began as a research project at the University of Illinois.'
    - >
      2003: LLVM's public project documentation and early releases established the
      reusable compiler-infrastructure project.
    - '2019: LLVM subprojects were consolidated into the unified llvm-project Git repository.'
    - >
      2026: The llvm@22 formula preserves the LLVM 22 toolchain generation as an
      explicitly versioned installation.
  usage:
    - >
      Developers use the package to compile C and C++ with Clang, transform or inspect
      LLVM IR, generate machine code, analyze source, format code, provide clangd editor
      integration, inspect binaries, gather coverage, and build compiler-related
      projects.
    - >
      Because Homebrew's LLVM is installed separately from Apple's system toolchain,
      builds commonly select it explicitly through PATH, CC/CXX, or CMake compiler
      settings. Individual llvm-* commands are also useful independently of Clang.
related-packages:
  - id: brew:gcc
    reason: >
      Choose GCC when you need GNU's multi-language compiler suite, including integrated
      Fortran, Ada, D, and Go frontends, instead of the Clang/LLVM-centered toolchain.
    rel: alternative
    sources:
      - https://gcc.gnu.org/onlinedocs/gcc/G_002b_002b-and-GCC.html
      - https://clang.llvm.org/docs/UsersManual.html
  - id: brew:binutils
    reason: >
      Choose GNU Binutils when builds require GNU ld, gas, or the GNU implementations of
      binary utilities for which LLVM supplies compatible replacements.
    rel: alternative
    sources:
      - https://sourceware.org/binutils/
      - https://llvm.org/docs/CommandGuide/
  - id: brew:cmake
    reason: >
      CMake is LLVM's documented build-system frontend and configures which LLVM
      subprojects, targets, runtimes, and build options are enabled.
    rel: adjacent_workflow
    sources:
      - https://releases.llvm.org/22.1.0/docs/GettingStarted.html
      - https://cmake.org/cmake/help/latest/
  - id: brew:ninja
    reason: >
      Ninja executes LLVM build graphs generated by CMake and is a documented
      high-performance backend for LLVM source builds.
    rel: adjacent_workflow
    sources:
      - https://releases.llvm.org/22.1.0/docs/GettingStarted.html
      - https://ninja-build.org/
  - id: brew:lldb
    reason: >
      LLDB complements the compiler toolchain with source-level debugging while directly
      reusing LLVM's disassembler and Clang expression parser.
    rel: adjacent_workflow
    sources:
      - https://lldb.llvm.org/
      - https://lldb.llvm.org/resources/build.html
category: developer-tools
