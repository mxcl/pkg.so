id: brew:fanficfare
display-name: FanFicFare
homepage: https://github.com/JimmXinu/FanFicFare
repo: https://github.com/JimmXinu/FanFicFare
docs:
  - https://github.com/JimmXinu/FanFicFare/wiki
  - https://github.com/JimmXinu/FanFicFare/wiki/INI-File
config-file-location:
  unix:
    - ./personal.ini
    - ~/.fanficfare/personal.ini
    - $XDG_CONFIG_HOME/fanficfare/personal.ini
    - ~/.fanficdownloader/personal.ini
credentials-file-location:
  unix:
    - ./personal.ini
    - ~/.fanficfare/personal.ini
    - $XDG_CONFIG_HOME/fanficfare/personal.ini
    - ~/.fanficdownloader/personal.ini
history:
  adoption-history:
    - >
      The official README describes support for more than 100 story sites and a roughly
      monthly release cadence. The supplied package metadata records distribution
      through Homebrew, Nix, and openSUSE's Zypper in addition to the project's official
      PyPI and calibre-plugin channels.
  package-nerd-significance:
    - >
      FanFicFare is notable as a long-lived, adapter-driven content downloader whose
      package has retained command-line compatibility and legacy configuration lookup
      paths across a project rename. Its combination of PyPI, calibre, and
      operating-system package distribution makes it useful to readers who automate
      e-book libraries.
  project-history:
    - >
      The project is the renamed and relocated successor to FanFictionDownLoader, also
      known as FFDL or fanficdownloader. Its current GitHub repository dates to 2015,
      while compatibility paths and documentation still preserve the earlier name.
    - >
      FanFicFare was distributed in CLI, calibre-plugin, and web-service forms. The
      maintainer shut down the legacy hosted web service in November 2019, leaving the
      locally run CLI and calibre plugin as the maintained delivery models.
  related-projects:
    - >
      FanFictionDownLoader was FanFicFare's earlier project name and remains visible in
      a backward-compatible configuration path.
    - >
      calibre provides the e-book library environment used by FanFicFare's most
      feature-rich plugin edition.
  sources:
    - https://api.github.com/repos/JimmXinu/FanFicFare
    - https://github.com/JimmXinu/FanFicFare#readme
    - https://github.com/JimmXinu/FanFicFare/releases/tag/v4.59.0
    - https://github.com/JimmXinu/FanFicFare/wiki
    - https://github.com/JimmXinu/FanFicFare/wiki/INI-File
    - source_facts.package-manager
  summary:
    - >
      FanFicFare is a Python command-line tool and calibre plugin for downloading
      fanfiction and original stories from supported websites and turning them into
      e-books. It can also update existing EPUB files with newly published chapters.
  timeline:
    - >
      2015: The current FanFicFare GitHub repository was created; official documentation
      describes the project as the renamed successor to FanFictionDownLoader.
    - >
      2019: The legacy hosted web service shut down on November 30; the CLI and calibre
      plugin remained.
    - '2026: FanFicFare 4.59.0 was released on July 1.'
  usage:
    - >
      CLI users pass story URLs to `fanficfare`, choose an output format such as EPUB,
      HTML, MOBI, or text, and customize download, metadata, image, and site behavior
      through layered INI settings. The calibre plugin adds library integration,
      metadata updates, and incremental EPUB updates.
related-packages:
  - id: cask:calibre
    reason: >
      Use calibre alongside FanFicFare when you want its officially supported plugin
      workflow for library management, metadata updates, and incremental story updates.
    rel: adjacent_workflow
    sources:
      - https://github.com/JimmXinu/FanFicFare#readme
      - https://manual.calibre-ebook.com/
category: media
package-manager:
  brew: fanficfare
  nix: fanficfare
  zypper: fanficfare
package-manager-url: https://formulae.brew.sh/formula/fanficfare
license: Apache-2.0
tags:
  - calibre
  - cli
  - downloader
  - ebook
  - epub
  - fanfiction
  - python
description: Download fanfiction and original stories as e-books
executables:
  - fanficfare
provenance:
  formula: fanficfare
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
