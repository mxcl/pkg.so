id: brew:compiledb
display-name: compiledb
homepage: https://github.com/nickdiego/compiledb
repo: https://github.com/nickdiego/compiledb
docs:
  - https://github.com/nickdiego/compiledb#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      PyPI records public compiledb releases starting in 2018. The Homebrew input
      records both Homebrew and Nix packaging, reflecting its role as a small
      command-line bridge between traditional Make projects and Clang-aware editor or
      language-server tooling.
  package-nerd-significance:
    - >
      The package is significant because `compile_commands.json` became a de facto
      interchange file for C and C++ tooling. compiledb gives Make-based projects a
      lightweight way to participate in that ecosystem without migrating their build
      system.
  project-history:
    - >
      The official README says compiledb was written to index Android Open Source
      Project modules after the author found existing tools unsatisfactory. It reworked
      ideas from YCM-Generator and aimed to produce `compile_commands.json` quickly
      without always requiring a clean build, using Make dry-run and keep-going behavior
      to extract compile commands.
  related-projects:
    - >
      compiledb is related to Clang's JSON Compilation Database format, Bear,
      YCM-Generator, cquery, ccls, and editor tooling such as YouCompleteMe.
  sources:
    - https://github.com/nickdiego/compiledb
    - https://raw.githubusercontent.com/nickdiego/compiledb/master/README.md
    - https://pypi.org/pypi/compiledb/json
    - https://clang.llvm.org/docs/JSONCompilationDatabase.html
  summary:
    - >
      compiledb is a Python CLI for generating Clang JSON compilation databases for GNU
      Make-based build systems.
  timeline:
    - '2018: PyPI records the first public compiledb release.'
    - '2025: PyPI and GitHub releases record 0.10.x releases.'
  usage:
    - >
      compiledb can wrap `make`, parse build logs or stdin, and write Clang's
      `compile_commands.json` in arguments-list or command-string form. Its main
      audience is non-CMake projects that still want editor indexing, static analysis,
      or language-server support.
related-packages:
  - id: brew:bear
    reason: >
      Bear is the strongest alternative when compiler calls should be intercepted from
      an actual C or C++ build across Make, Autotools, or custom scripts; compiledb is a
      Python tool focused primarily on Make output and dry runs.
    rel: alternative
    sources:
      - https://github.com/rizsotto/Bear
      - https://github.com/nickdiego/compiledb
category: developer-tools
package-manager:
  brew: compiledb
  nix: compiledb
package-manager-url: https://formulae.brew.sh/formula/compiledb
license: GPL-3.0-or-later
tags:
  - build-tools
  - clang
  - cli
  - compilation-database
  - make
  - python
description: Generate a Clang compilation database for Make-based build systems
executables:
  - compiledb
provenance:
  formula: compiledb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
