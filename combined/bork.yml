id: brew:bork
display-name: bork
homepage: https://bork.sh/
repo: https://github.com/borksh/bork
docs:
  - https://bork.sh/
  - https://bork.sh/manpage.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bork is niche but packaged: the batch input records Homebrew and Nix availability,
      and the official packages page tracks package versions across channels. That
      suggests a tool maintained for small-scale operator and dotfile workflows rather
      than broad enterprise configuration management.
    - >
      Its adoption is strongest where users want declarative host setup without agents,
      services, or a large language runtime.
  package-nerd-significance:
    - >
      bork is interesting because it keeps configuration management inside the shell and
      standard Unix toolbox. It is the opposite of a heavy agent: package it, run a
      script, reconcile state.
    - >
      For package curation, it is a reminder that some useful infrastructure tools are
      intentionally tiny DSLs rather than daemons or platforms.
  project-history:
    - >
      The current borksh repository was created in February 2021, while the public
      project history includes an earlier mattly/bork repository. The official site
      describes bork as a Bash DSL for declarative assertions about system state.
    - >
      bork intentionally targets Bash 3.2 and common Unix utilities such as sed, awk,
      and grep, which makes portability across macOS and Unix-like systems part of the
      design rather than an accident.
  related-projects:
    - >
      Puppet is a conceptual reference point in bork's own tagline about configuration
      management.
    - Bash and common Unix utilities are explicit runtime foundations.
    - >
      The borksh/homebrew-tap repository is related packaging infrastructure maintained
      by the project organization.
  sources:
    - https://api.github.com/repos/borksh/bork
    - https://bork.sh/
    - https://bork.sh/manpage.html
    - https://bork.sh/packages.html
    - https://github.com/borksh/bork
    - source_facts.package-manager
  summary:
    - >
      bork is a Bash-based declarative configuration-management tool whose joke
      expansion, Bash-Operated Reconciling Kludge, accurately signals both its Unix
      minimalism and its Puppet-like reconciliation model.
  timeline:
    - '2021-02: Official GitHub repository metadata shows borksh/bork created.'
    - '2021-02: GitHub release metadata shows v0.11.1 in the public release feed.'
    - '2025: Repository metadata shows continued maintenance activity.'
    - '2026: Package-manager input records Homebrew and Nix packaging.'
  usage:
    - >
      Users write assertions using ok and no functions, declaring desired states such as
      files, directories, packages, or services. bork handlers then decide whether to
      check, install, upgrade, or otherwise reconcile that assertion.
    - >
      The manpage frames bork files as config files in their own right, so there is no
      separate fixed config path; users pass or run the scripts that contain their
      assertions.
related-packages:
  - id: brew:ansible
    reason: >
      Choose Ansible when the same desired-state configuration work must scale from a
      local shell workflow to inventories of remote systems, YAML playbooks, and a broad
      module ecosystem.
    rel: alternative
    sources:
      - https://bork.sh/manpage.html
      - https://docs.ansible.com/projects/ansible/latest/getting_started/introduction.html
category: system
