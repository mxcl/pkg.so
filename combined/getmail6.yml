id: brew:getmail6
display-name: getmail6
homepage: https://getmail6.org/
repo: https://github.com/getmail6/getmail6
docs:
  - https://getmail6.org/documentation.html
  - https://getmail6.org/configuration.html
  - https://getmail6.org/faq.html
  - https://getmail6.org/troubleshooting.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/getmail/getmailrc
    - ~/.config/getmail/getmailrc
    - ~/.getmail/getmailrc
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/getmail/getmailrc
    - ~/.config/getmail/getmailrc
    - ~/.getmail/getmailrc
history:
  adoption-history:
    - >
      getmail6 took over an established role from getmail after Python 2 era packaging
      became harder to sustain. Its appearance in Homebrew, Alpine, Debian, Fedora,
      MacPorts, Nix, and Ubuntu package sets reflects the need for a maintained
      fetchmail alternative in Unix-like mail setups.
  package-nerd-significance:
    - >
      For package users, getmail6 matters because it keeps the conservative getmail
      workflow available on Python 3 systems. The project is intentionally evolutionary:
      compatibility fixes, configuration-path behavior, and mail-provider authentication
      changes carry more weight than new feature breadth.
  project-history:
    - >
      The official documentation describes getmail version 6 as a port of getmail
      version 5 to Python 3 without adding features. The project preserves Charles
      Cazabon's getmail design while carrying the code through Python 3 compatibility,
      XDG configuration behavior, OAuth-related fixes, and mail-server compatibility
      changes.
  related-projects:
    - >
      getmail6 is related to the original getmail project and to fetchmail as the older
      mail retriever it was designed to replace.
  sources:
    - https://api.github.com/repos/getmail6/getmail6
    - https://getmail6.org/configuration.html
    - https://getmail6.org/documentation.html
    - https://github.com/getmail6/getmail6
    - https://raw.githubusercontent.com/getmail6/getmail6/master/docs/CHANGELOG
    - https://raw.githubusercontent.com/getmail6/getmail6/master/docs/configuration.txt
    - https://raw.githubusercontent.com/getmail6/getmail6/master/docs/documentation.txt
  summary:
    - >
      getmail6 is the Python 3 continuation of getmail, an extensible mail retrieval
      system for POP3, IMAP4, SSL-protected mailboxes, filtering, and delivery to local
      mail stores or external delivery agents.
  timeline:
    - '1998: The getmail copyright history begins.'
    - '2019: getmail 5.14 was released by the original line.'
    - '2020: getmail6 version 6.00 made the code compatible with Python 3.'
    - '2020: Version 6.7 added XDG configuration-directory behavior.'
    - '2025: Version 6.19.08 removed Python 2 support code.'
  usage:
    - >
      Practitioners configure one or more retrievers and destinations in `getmailrc`,
      then run `getmail` manually, from cron, or as part of a local mail workflow.
      Common uses include pulling mail from POP3 or IMAP accounts, writing Maildir or
      mboxrd files, invoking an MDA, filtering messages, and using helper commands such
      as `getmail_fetch`, `getmail_maildir`, and `getmail_mbox`.
related-packages:
  - id: brew:fetchmail
    reason: >
      Choose fetchmail when you need its broader legacy protocol support or
      SMTP-forwarding and daemon modes; choose getmail6 for direct Maildir/mbox delivery
      and a Python-based configuration model.
    rel: alternative
    sources:
      - https://getmail6.org/documentation.html
      - https://www.fetchmail.info/
      - https://www.fetchmail.info/fetchmail-features.html
category: networking
package-manager:
  apk: getmail6
  brew: getmail6
  debian: getmail6
  dnf: getmail6
  macports: getmail6
  nix: getmail6
  ubuntu: getmail6
package-manager-url: https://formulae.brew.sh/formula/getmail6
license: GPL-2.0-only
tags:
  - cli
  - email
  - imap
  - mail-retrieval
  - pop3
  - python
  - ssl
description: Extensible mail retrieval system with POP3, IMAP4, SSL support
executables:
  - getmail
  - getmail_fetch
  - getmail_maildir
  - getmail_mbox
provenance:
  formula: getmail6
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
