id: brew:arelo
display-name: arelo
homepage: https://github.com/makiuchi-d/arelo
repo: https://github.com/makiuchi-d/arelo
docs:
  - https://github.com/makiuchi-d/arelo#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages arelo as a formula built from the upstream GitHub tags, and the
      upstream README documents installation through Go, Homebrew, or release binaries.
      The adoption story is therefore mostly package-manager convenience for developers
      who want one binary in PATH rather than a framework-specific watcher.
  package-nerd-significance:
    - >
      arelo matters as a deliberately boring watcher: it is cross-project, does not own
      a TCP port, and avoids project config. For package-manager users, that makes it a
      compact alternative to heavier live-reload stacks when the desired behavior is
      just 'restart this command when these files change.'
  project-history:
    - >
      The GitHub repository was created in April 2020, and the first GitHub release,
      v1.0, was published later that month. The project has stayed intentionally narrow:
      it watches target paths, filters filesystem events, and re-runs an arbitrary
      command rather than becoming a language-specific development server.
  related-projects:
    - >
      The README lists realize, fresh, gin, and go-task as similar projects, positioning
      arelo among Go-era file watchers and task runners while keeping the implementation
      generic enough to run any command-line tool.
  sources:
    - https://api.github.com/repos/makiuchi-d/arelo
    - https://api.github.com/repos/makiuchi-d/arelo/releases
    - https://github.com/makiuchi-d/arelo#readme
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/a/arelo.rb
  summary:
    - >
      arelo is a small Go command-line utility for restarting a command when watched
      files change. Its official README frames it as a simple live-reload tool with
      glob-based matching, safe child-process termination, no config file, and no local
      server requirement.
  timeline:
    - '2020: GitHub repository created.'
    - '2020: v1.0 published as the first GitHub release.'
    - '2025: v1.15.x releases continue the small single-binary watcher line.'
  usage:
    - >
      Typical usage is to run arelo with one or more glob patterns and a command after
      `--`, for example watching Go source and HTML files and restarting `go run .`. The
      README also documents polling mode for environments where filesystem notifications
      are unreliable, such as WSL2.
related-packages:
  - id: brew:reflex
    reason: >
      Choose Reflex when you need regular-expression matching, changed-filename
      substitution, or one configuration file supervising several watch commands; arelo
      favors direct glob-driven invocation.
    rel: alternative
    sources:
      - https://github.com/makiuchi-d/arelo#readme
      - https://github.com/cespare/reflex#readme
  - id: brew:go-air
    reason: >
      Choose Air for a Go-specific live-reload workflow with `.air.toml`, integrated
      build settings, container guidance, and optional browser reload; arelo remains
      language-agnostic and configuration-free.
    rel: alternative
    sources:
      - https://github.com/makiuchi-d/arelo#readme
      - https://github.com/air-verse/air#readme
category: developer-tools
package-manager:
  brew: arelo
package-manager-url: https://formulae.brew.sh/formula/arelo
license: MIT
tags:
  - cli
  - development
  - file-watcher
  - reload
description: Simple auto reload (live reload) utility
executables:
  - arelo
provenance:
  formula: arelo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
