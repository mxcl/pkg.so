id: cask:gitify
display-name: Gitify
homepage: https://github.com/gitify-app/gitify
repo: https://github.com/gitify-app/gitify
docs:
  - https://github.com/gitify-app/gitify#readme
  - https://gitify.io/faq
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gitify is available for macOS, Windows, and Linux and can be installed on macOS
      through Homebrew. Its scope expanded beyond GitHub to GitHub Enterprise, Gitea,
      Forgejo, Codeberg, Bitbucket Cloud, and GitLab.
  package-nerd-significance:
    - >
      Gitify exemplifies the menu-bar and system-tray utilities popular in developer
      package collections: a small desktop client that turns forge activity into a
      persistent native workflow. Its cross-platform Electron distribution and support
      for self-hosted forges make it useful beyond GitHub-only environments.
  project-history:
    - >
      Gitify was created as a free, open-source desktop client for Git-hosting
      notifications. The project is implemented with TypeScript and Electron and has
      evolved from a GitHub-oriented notifier into a multi-forge client.
  related-projects:
    - GitHub
    - GitLab
    - Gitea
    - Forgejo
    - Codeberg
    - Bitbucket Cloud
    - Electron
  sources:
    - 'Official FAQ: https://gitify.io/faq/'
    - 'Official product page: https://gitify.io/'
    - 'Official repository: https://github.com/gitify-app/gitify'
    - source_facts.description
  summary:
    - >
      Gitify is an open-source desktop application that displays Git-forge notifications
      in the operating-system menu bar or system tray.
  timeline:
    - >
      Initial project: Gitify focused on bringing GitHub notifications to the desktop
      menu bar.
    - >
      Later development: Account, filtering, appearance, and native-notification
      controls were added.
    - >
      Current project: Gitify supports multiple cloud and self-hosted Git forges on
      macOS, Windows, and Linux.
  usage:
    - >
      Users authenticate one or more forge accounts, then review and filter
      notifications, mark supported notifications read or done, unsubscribe from
      threads, and open the underlying repository activity. Gitify can also issue native
      notifications, play sounds, and start automatically at login on supported
      platforms.
related-packages: []
