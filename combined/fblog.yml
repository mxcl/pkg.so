id: brew:fblog
display-name: fblog
homepage: https://github.com/brocode/fblog
repo: https://github.com/brocode/fblog
docs:
  - https://github.com/brocode/fblog#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/fblog.toml
    - ~/.config/fblog.toml
  macos: ~/Library/Application Support/fblog.toml
  windows: '%APPDATA%\fblog.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata shows fblog is packaged by Homebrew and Nix, while the
      upstream README also supports installation through Cargo.
  package-nerd-significance:
    - >
      fblog is a compact example of the Rust CLI tooling pattern: single binary,
      structured-data focus, Cargo installability, and downstream packaging in Homebrew
      and Nix.
  project-history:
    - >
      The official GitHub repository was created in 2017. The upstream README presents
      fblog as a small command-line JSON log viewer and documents both Cargo and
      Homebrew installation paths.
  related-projects:
    - >
      Rust and Cargo are the upstream language/runtime and installation ecosystem
      referenced by the README.
  sources:
    - Official GitHub release metadata.
    - Official GitHub repository metadata for brocode/fblog.
    - Official README.
    - input.source_facts.package-manager
  summary:
    - fblog is a Rust command-line JSON log viewer for reading structured logs in a terminal.
  timeline:
    - '2017: Official GitHub repository created.'
    - '2025: Latest GitHub release metadata lists v4.17.0.'
    - '2026: Repository metadata shows recent maintenance activity.'
  usage:
    - >
      Package users install the `fblog` executable and can optionally add a TOML
      configuration file to control display behavior.
related-packages:
  - id: brew:humanlog
    reason: >
      Choose humanlog when you want JSON or logfmt pretty-printing plus a local
      persisted observability database, web exploration, queries, and OpenTelemetry
      traces; choose fblog for a smaller stream-oriented JSON viewer with Lua filters
      and templates.
    rel: alternative
    sources:
      - https://github.com/brocode/fblog#readme
      - https://github.com/humanlogio/humanlog
  - id: brew:lnav
    reason: >
      Choose lnav when you need an interactive terminal navigator that combines many log
      formats and exposes them through SQLite; choose fblog for lightweight JSON-stream
      formatting and filtering in pipelines.
    rel: alternative
    sources:
      - https://github.com/brocode/fblog#readme
      - https://docs.lnav.org/en/latest/intro.html
      - https://docs.lnav.org/en/latest/formats.html
category: developer-tools
package-manager:
  brew: fblog
  macports: fblog
  nix: fblog
package-manager-url: https://formulae.brew.sh/formula/fblog
license: WTFPL
tags:
  - cli
  - json
  - log-viewer
  - logs
  - rust
  - structured-logs
description: Small command-line JSON log viewer
executables:
  - fblog
provenance:
  formula: fblog
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
