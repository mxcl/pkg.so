history:
  adoption-history:
    - >
      ArtCraft is distributed as signed desktop releases for macOS and Windows, with
      source-build instructions for Linux. Its official materials position it for
      artists, designers, and filmmakers and support multiple hosted image, video,
      audio, 3D, and world-generation model families.
  package-nerd-significance:
    - >
      ArtCraft is notable as a Rust-and-TypeScript desktop creative application
      distributed through both upstream releases and a Homebrew cask. Its public
      monorepo also exposes the engineering behind a cross-platform,
      model-provider-aware AI media workstation.
  project-history:
    - >
      ArtCraft was developed by the ArtCraft team as an interactive crafting environment
      intended to give creators more compositional control than prompt-only generation
      tools. The public application combines 2D compositing, 3D scene staging, image
      generation and editing, video generation, and related media workflows.
  related-projects:
    - >
      The project is accompanied by the ArtCraft team's broader family of purpose-built
      creative applications, while its model catalog integrates services for image,
      video, sound, 3D-mesh, and world generation.
  sources:
    - https://getartcraft.com/
    - https://github.com/storytold/artcraft#readme
    - https://github.com/storytold/artcraft/blob/main/ROADMAP.md
  summary:
    - >
      ArtCraft is a desktop IDE for creating AI-assisted images and video through visual
      composition, scene staging, generation, and editing tools.
  timeline:
    - >
      2026: Official project materials describe ArtCraft as a public cross-platform
      creative IDE and publish its source under MIT or Apache-2.0 terms.
  usage:
    - >
      Creators can begin with a prompt, compose scenes using 2D layers or staged 3D
      assets, select an appropriate generation model, and refine or animate the result.
      Provider access is configured through the application, but the official
      user-facing material reviewed here does not document filesystem locations for
      configuration or credentials.
