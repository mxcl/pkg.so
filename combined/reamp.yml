history:
  adoption-history:
    - >
      The developer describes Reamp as a solo, self-funded hobby project. The official
      site currently presents it as beta software and invites feedback to improve
      stability, performance, and usability.
  package-nerd-significance:
    - >
      Reamp carries the Winamp-style modular-window and skin culture into a native macOS
      player. It is aimed at users who keep music locally and value direct file
      playback, editable playlists, visualization, equalization, and metadata control
      over streaming-service features.
  project-history:
    - >
      Reamp was created as a macOS music player inspired by the workflow and appearance
      of classic Winamp. It combines skin support and windowshade-style presentation
      with a searchable library, playlist management, audio visualizers, equalization,
      album art, and an ID3 tag editor.
  related-projects:
    - Classic Winamp is Reamp's explicit interface and workflow inspiration.
  sources:
    - https://re-amp.ru/donate/
    - https://re-amp.ru/en
  summary:
    - >
      Reamp is a native macOS player for local music collections that recreates the feel
      of classic Winamp while providing a media library, playlists, skins, visualizers,
      equalization, and metadata editing.
  timeline:
    - >
      Beta era: The official site presents Reamp as an actively refined beta maintained
      by a solo developer.
  usage:
    - >
      Users point Reamp at local media, browse by artist, album, genre, or year, build
      and save playlists, apply classic skins, adjust a ten-band equalizer, view
      spectrum and oscilloscope displays, and edit track metadata and artwork.
