id: brew:mkp224o
display-name: mkp224o
homepage: https://github.com/cathugger/mkp224o
repo: https://github.com/cathugger/mkp224o
docs:
  - https://github.com/cathugger/mkp224o#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      In practice the user supplies one or more desired prefixes, and mkp224o repeatedly
      generates keys until it finds onion hostnames matching those filters. The README
      documents output directories containing secret and public keys and hostnames for
      discovered services, along with steps for copying the generated key material into
      a Tor hidden-service directory. It also notes base32 constraints on onion names,
      which makes some digits impossible in filters.
  sources:
    - https://api.github.com/repos/cathugger/mkp224o
    - https://formulae.brew.sh/api/formula/mkp224o.json
    - https://github.com/cathugger/mkp224o
    - https://opensource.com/article/19/8/how-create-vanity-tor-onion-address
    - https://raw.githubusercontent.com/cathugger/mkp224o/master/OPTIMISATION.txt
    - https://raw.githubusercontent.com/cathugger/mkp224o/master/README.md
  summary:
    - >
      mkp224o is cathugger's C program for generating vanity Tor onion service v3
      addresses. Its name refers to Tor proposal 224, the proposal that introduced the
      v3 onion service design, and its README describes generation of vanity ed25519
      onion addresses. The repository was created in 2017, is licensed under CC0-1.0,
      and depends on libsodium plus a C99 compiler and make/autoconf build tooling.
  usage:
    - >
      The tool's performance focus is a major part of its identity. Its optimization
      notes describe multiple ed25519 implementations selected at configure time,
      integer and binary-string filter representations, binary search for large filter
      lists, and batch mode for faster generation. Package managers such as Homebrew and
      Nix provide it as a niche security/privacy command-line tool; Homebrew records
      libsodium as its runtime dependency.
related-packages:
  - id: brew:tor
    reason: >
      Use Tor after mkp224o to host an onion service with the generated hostname and
      Ed25519 key directory, following mkp224o's documented torrc workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/cathugger/mkp224o
      - https://spec.torproject.org/rend-spec/index.html
category: security
package-manager:
  brew: mkp224o
  nix: mkp224o
  winget: cathugger.mkp224o
package-manager-url: https://formulae.brew.sh/formula/mkp224o
license: CC0-1.0
tags:
  - anonymity
  - cli
  - ed25519
  - hidden-services
  - onion-service
  - tor
  - vanity-address
description: Vanity address generator for tor onion v3 (ed25519) hidden services
executables:
  - mkp224o
provenance:
  formula: mkp224o
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
