id: brew:cuetools
display-name: cuetools
homepage: https://github.com/svend/cuetools
repo: https://github.com/svend/cuetools
docs:
  - https://github.com/svend/cuetools#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package remains useful to distribution maintainers because it exposes simple
      programs for a durable niche: converting, printing, tagging, and extracting
      breakpoints from CUE and TOC metadata. The supplied package-manager facts show it
      packaged across Homebrew, Debian, Fedora, Arch, Nix, MacPorts, Scoop, Winget, and
      related ecosystems.
  package-nerd-significance:
    - >
      cuetools is package-nerd interesting because it preserves a narrow but important
      command-line layer around CUE sheets, a format that often appears in lossless CD
      images and music archives. It is small, GPL-licensed C tooling with man-page-style
      documentation, making it easy for Unix package managers to ship without desktop
      dependencies.
  project-history:
    - >
      The upstream repository describes cuetools as cue and toc file parsers and
      utilities, with copyright years spanning 2004 through 2013 for Svend Sorensen. Its
      README presents the project as a focused set of command-line programs rather than
      a large audio application.
  related-projects:
    - >
      cdrdao TOC files, CUE sheet tooling, and audio taggers are the closest adjacent
      tools in normal packaging contexts.
  sources:
    - https://github.com/svend/cuetools
  summary:
    - >
      cuetools is a small Unix-style audio metadata toolkit for working with cue sheets
      and cdrdao TOC files.
  timeline:
    - '2004: Copyright period begins in upstream README.'
    - '2013: Later upstream copyright year shown in README.'
    - >
      2026: Still distributed by multiple package managers according to
      source_facts.package-manager.
  usage:
    - >
      Typical usage is in audio-ripping and archival workflows where cue sheets describe
      track layout. The upstream tools include cueconvert for CUE/TOC conversion,
      cuebreakpoints for extracting split points, cueprint for disc and track metadata,
      and cuetag.sh for applying tags.
related-packages: []
category: media
package-manager:
  apk: cuetools
  brew: cuetools
  debian: cuetools
  dnf: cuetools
  macports: cuetools
  nix: cuetools
  pacman: cuetools
  scoop: extras/cuetools
  ubuntu: cuetools
  winget: gchudov.CUETools
package-manager-url: https://formulae.brew.sh/formula/cuetools
license: GPL-2.0-only
tags:
  - audio-metadata
  - cli
  - cue-sheets
  - toc-files
description: Utilities for .cue and .toc files
executables:
  - cuebreakpoints
  - cueconvert
  - cueprint
  - cuetag.sh
provenance:
  formula: cuetools
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
