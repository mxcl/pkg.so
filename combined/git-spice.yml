id: brew:git-spice
display-name: git-spice
homepage: https://abhinav.github.io/git-spice/
repo: https://github.com/abhinav/git-spice
docs:
  - https://abhinav.github.io/git-spice
  - https://abhinav.github.io/git-spice/cli
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
    - ~/.config/git/config
    - /etc/gitconfig
credentials-file-location:
  unix: $XDG_CONFIG_HOME/git-spice/secrets.json
history:
  adoption-history:
    - >
      Adoption belongs to the stacked-PR niche, a workflow popular among engineers who
      split large changes into reviewable layers. The project documents incremental
      adoption, offline-first local state, shorthand commands, and a visible
      user-community section, making it part of the newer wave of Git tools that bring
      Phabricator-style stacked change review to GitHub and GitLab users.
  package-nerd-significance:
    - >
      git-spice matters to package and developer-tool watchers because it is a
      forge-neutral, open-source entry in the stacked-branch space. Its packaging in
      Homebrew and Nix makes a workflow that once depended on hosted services or
      workplace-specific tooling easier to install as a normal CLI.
  project-history:
    - >
      The project repository was created in 2023, with early public code and alpha tags
      appearing in 2024. Its documentation defines stacking as creating branches or
      change requests that build on top of each other so related work can stay small and
      reviewable while preserving dependency order.
    - >
      git-spice grew from local branch navigation and restacking into a forge-aware
      workflow tool. The README and documentation describe support for GitHub, GitLab,
      Bitbucket, Gitea, Forgejo, and Codeberg-style workflows, while the changelog
      records later additions such as fork-based contribution flows, Ubuntu PPA
      packaging, and experimental stack merge commands.
  related-projects:
    - >
      The related practice area is stacked pull requests and merge requests, with
      git-spice positioning itself as a Git-compatible branch manager rather than a
      replacement for Git.
  sources:
    - https://abhinav.github.io/git-spice
    - https://formulae.brew.sh/formula/git-spice
    - https://github.com/abhinav/git-spice
    - https://github.com/abhinav/git-spice/blob/main/CHANGELOG.md
    - https://github.com/abhinav/git-spice/blob/main/README.md
  summary:
    - >
      git-spice is a Git stacking tool that manages dependent branches and submits them
      as pull requests or merge requests across several forge providers.
  timeline:
    - '2023: GitHub repository was created.'
    - '2024: First public code and alpha tags appeared.'
    - >
      2026: Changelog entries documented fork workflows, additional forge support, and
      stack merge experiments.
  usage:
    - >
      Practitioners use git-spice through the git-spice executable or the gs shorthand.
      Typical flows create or track stacked branches, submit one branch or an entire
      stack, sync with trunk, delete merged branches, restack dependent branches after
      base changes, and keep local metadata in Git configuration.
related-packages:
  - id: brew:git-town
    reason: >
      Choose Git Town when you want stacked changes as part of a broader high-level Git
      workflow that also automates branch creation, synchronization, and shipping.
    rel: alternative
    sources:
      - https://www.git-town.com/stacked-changes.html
      - https://abhinav.github.io/git-spice/
  - id: brew:git-machete
    reason: >
      Choose git-machete when you prefer an explicitly maintained branch-layout file and
      its GitHub or GitLab pull-request traversal workflow.
    rel: alternative
    sources:
      - https://git-machete.readthedocs.io/en/stable/
      - https://abhinav.github.io/git-spice/
  - id: brew:gh
    reason: >
      Use GitHub CLI alongside git-spice when you want git-spice to reuse an existing
      authenticated `gh` session through its service-CLI authentication method.
    rel: adjacent_workflow
    sources:
      - https://abhinav.github.io/git-spice/setup/auth/
      - https://cli.github.com/manual/
category: developer-tools
package-manager:
  brew: git-spice
  nix: git-spice
package-manager-url: https://formulae.brew.sh/formula/git-spice
license: GPL-3.0-or-later
tags:
  - cli
  - git
  - github
  - gitlab
  - pull-requests
  - stacked-branches
description: Manage stacked Git branches
executables:
  - git-spice
provenance:
  formula: git-spice
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
