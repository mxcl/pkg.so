id: brew:lastpass-cli
display-name: LastPass CLI
homepage: https://github.com/lastpass/lastpass-cli
repo: https://github.com/lastpass/lastpass-cli
docs:
  - https://github.com/lastpass/lastpass-cli#readme
  - https://lastpass.github.io/lastpass-cli/lpass.1.html
config-file-location:
  unix:
    - $LPASS_HOME/env
    - $XDG_CONFIG_HOME/lpass/env
    - ~/.lpass/env
credentials-file-location:
  unix:
    - $LPASS_HOME/blob
    - $LPASS_HOME/session_token
    - $XDG_DATA_HOME/lpass/blob
    - $XDG_DATA_HOME/lpass/session_token
    - ~/.lpass/blob
    - ~/.lpass/session_token
history:
  adoption-history:
    - >
      Package adoption followed quickly in Unix ecosystems. The README documents
      installation through Arch, Fedora, EPEL, Debian/Ubuntu build dependencies, Gentoo,
      Homebrew, MacPorts, FreeBSD ports, and Cygwin, making `lpass` a common terminal
      bridge for LastPass users on developer workstations and servers.
    - >
      From a package-manager perspective, LastPass CLI is notable because it packages a
      proprietary SaaS password manager workflow as a conventional open-source CLI with
      shell completion, manpages, and data/cache locations that can be managed by Unix
      package systems.
  package-nerd-significance:
    - >
      LastPass CLI matters to package nerds because it is a real-world example of a
      vendor SaaS client being distributed like a normal Unix utility: source on GitHub,
      package recipes across distributions, optional manpage generation, and XDG-style
      data/config support.
    - >
      It also exposed the tension around packaging cloud credentials locally: the
      package is small and scriptable, but its cached blob and session token files are
      security-sensitive runtime state rather than ordinary configuration.
  project-history:
    - >
      LastPass announced the open-sourced command-line application on 2014-10-22, the
      same date recorded as the GitHub repository creation date. The README identifies
      the project as a LastPass.com command-line interface and carries a 2014-2019
      LastPass copyright notice.
    - >
      The project was designed for GNU/Linux, Cygwin, and Mac OS X, with dependencies
      such as OpenSSL or LibreSSL, libcurl, libxml2, and optional clipboard helpers. Its
      manpage-oriented documentation and `make install-doc` target reflect a Unix
      command-line packaging style rather than an app-store distribution model.
  related-projects:
    - >
      Related pieces include the LastPass web service, LastPass browser extensions,
      pinentry, libcurl, libxml2, OpenSSL or LibreSSL, and platform clipboard tools such
      as xclip, xsel, pbcopy, and Cygwin putclip.
  sources:
    - https://api.github.com/repos/lastpass/lastpass-cli
    - https://api.github.com/repos/lastpass/lastpass-cli/releases?per_page=10
    - >
      https://blog.lastpass.com/posts/open-sourced-lastpass-command-line-application-now-available
    - https://github.com/lastpass/lastpass-cli
    - https://raw.githubusercontent.com/lastpass/lastpass-cli/master/README.md
  summary:
    - >
      LastPass CLI is the official open-source command-line client for LastPass vault
      data. It gives terminal users the `lpass` command for listing, showing,
      generating, adding, editing, and syncing secrets without using the browser
      extension or web UI.
  timeline:
    - '2014-10-22: LastPass announced and open-sourced the command-line application.'
    - '2014-10-22: GitHub repository created.'
    - '2019-04-15: v1.3.3 release published.'
    - '2024-11-14: v1.6.1 release published.'
  usage:
    - >
      Typical use starts with `lpass login`, then commands such as `lpass ls`, `lpass
      show`, `lpass generate`, `lpass edit`, and clipboard-oriented password retrieval.
      The documented storage paths include encrypted vault blobs and session tokens, so
      the tool sits directly in the secrets-management path for shell scripts and
      interactive terminal use.
related-packages:
  - id: brew:bitwarden-cli
    reason: >
      Choose Bitwarden CLI for a full-featured cross-platform vault client that supports
      Bitwarden cloud or a self-hosted server and can directly import a LastPass CSV
      export.
    rel: alternative
    sources:
      - https://lastpass.github.io/lastpass-cli/lpass.1.html
      - https://bitwarden.com/help/cli/
  - id: cask:1password-cli
    reason: >
      Choose 1Password CLI when the workflow centers on injecting account-managed
      secrets into commands, environment variables, scripts, and configuration files.
    rel: alternative
    sources:
      - https://lastpass.github.io/lastpass-cli/lpass.1.html
      - https://developer.1password.com/docs/cli/secrets-scripts
  - id: brew:pass-import
    reason: >
      Use pass-import when migrating from LastPass because it explicitly supports
      LastPass CSV data and direct lpass-based import or export workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/lastpass/lastpass-cli
      - https://github.com/roddhjav/pass-import
category: security
package-manager:
  apk: lastpass-cli
  brew: lastpass-cli
  dnf: lastpass-cli
  macports: lastpass-cli
  nix: lastpass-cli
  ubuntu: lastpass-cli
  zypper: lastpass-cli
package-manager-url: https://formulae.brew.sh/formula/lastpass-cli
license: GPL-2.0-or-later WITH openvpn-openssl-exception
tags:
  - cli
  - lastpass
  - password-manager
  - secrets
  - vault
description: LastPass command-line interface tool
executables:
  - lpass
provenance:
  formula: lastpass-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
