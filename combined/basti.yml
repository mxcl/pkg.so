id: brew:basti
display-name: Basti
homepage: https://www.basti.app
repo: https://github.com/basti-app/basti
docs:
  - https://github.com/basti-app/basti/tree/main/docs/reference
  - https://github.com/basti-app/basti#readme
config-file-location:
  unix:
    - ./.basti.yaml
    - ./.basti.yml
    - ./.basti.json
credentials-file-location:
  unix: ~/.aws/credentials
  windows: '%USERPROFILE%\.aws\credentials'
history:
  adoption-history:
    - >
      Basti's adoption niche is teams that want database and cache access in private AWS
      VPCs without a permanently running bastion host, direct inbound SSH, or
      hand-maintained Session Manager setup. The README explicitly targets local
      machines and CI/CD pipelines.
    - >
      The supplied package facts show Homebrew packaging, while the README documents npm
      installation and Homebrew installation. The README's badges also point to npm
      version and total-download signals.
  package-nerd-significance:
    - >
      Basti is package-nerd significant because it packages a common cloud operations
      pattern into a single CLI: ephemeral bastion setup, Session Manager port
      forwarding, local TCP access, and cleanup. The value is not a new protocol, but
      removing recurring glue scripts around AWS infrastructure.
    - >
      Its Homebrew formula matters because cloud operators often install this kind of
      tool beside `aws`, `psql`, `redis-cli`, and IaC CLIs rather than inside an
      application dependency tree.
  project-history:
    - >
      The npm package metadata shows the public `basti` package was created on
      2022-06-13. The GitHub README describes a tool that wraps AWS Session Manager port
      forwarding and automates the bastion EC2 lifecycle needed to reach private network
      resources.
    - >
      The project later added a CDK companion package, `basti-cdk`, and continued
      through 1.x releases. npm metadata shows active releases from 1.5.0 in 2023
      through 1.8.0 on 2026-05-17.
  related-projects:
    - >
      Related official technologies include AWS Systems Manager Session Manager, AWS SDK
      credential resolution, AWS CLI credential files, AWS CDK through the `basti-cdk`
      package, and AWS services such as RDS, Aurora, ElastiCache, EC2, and VPC
      networking.
  sources:
    - https://github.com/basti-app/basti/blob/main/README.md
    - https://github.com/basti-app/basti/blob/main/docs/reference/cli.md
    - https://registry.npmjs.org/basti
    - source_facts.package-manager
  summary:
    - >
      Basti is an AWS-focused CLI for securely reaching private VPC resources such as
      RDS, Aurora, ElastiCache, and custom TCP targets. The README says the name comes
      from bastion host and emphasizes no idle costs, no SSH keys, and IAM-driven
      access.
  timeline:
    - '2022-06-13: npm registry metadata records creation of the `basti` package.'
    - '2023-08-29: npm metadata records version 1.5.0.'
    - '2023-09-12: npm metadata records version 1.6.0.'
    - '2024-09-27: npm metadata records version 1.7.0.'
    - '2026-05-17: npm metadata records version 1.8.0.'
    - >
      2026: Current README documents Homebrew and npm installation, Basti CDK, config
      files, and Session Manager-based access.
  usage:
    - >
      The documented flow is `basti init` once per target to create or reuse the bastion
      resources, then `basti connect` to start a local port-forwarding session. A user
      can then connect to the resource on localhost, for example with `psql -h localhost
      -p 5432`.
    - >
      Basti uses AWS SDK credential resolution and is expected to work when AWS CLI
      credentials work. It supports interactive and automatic modes, config files named
      `.basti.yaml`, `.basti.yml`, or `.basti.json`, AWS profile and region options, and
      custom TCP targets.
related-packages:
  - id: brew:awscli
    reason: >
      Use AWS CLI alongside Basti to establish and verify the AWS profiles, regions, and
      credentials that Basti consumes through the AWS SDK credential chain.
    rel: adjacent_workflow
    sources:
      - https://github.com/basti-app/basti#basic-usage
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
category: cloud-infrastructure
package-manager:
  brew: basti
package-manager-url: https://formulae.brew.sh/formula/basti
license: MIT
tags:
  - aws
  - bastion
  - cli
  - elasticache
  - rds
  - session-manager
  - vpc
description: Securely connect to RDS, Elasticache, and other AWS resources in VPCs
executables:
  - basti
provenance:
  formula: basti
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
