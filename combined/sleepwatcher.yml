id: brew:sleepwatcher
display-name: SleepWatcher
homepage: https://www.bernhard-baehr.de/
repo: null
docs:
  - https://www.bernhard-baehr.de/
config-file-location:
  macos:
    - ~/.sleep
    - ~/.wakeup
    - /etc/rc.sleep
    - /etc/rc.wakeup
    - ~/Library/LaunchAgents/de.bernhard-baehr.sleepwatcher.plist
    - /Library/LaunchDaemons/de.bernhard-baehr.sleepwatcher.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      The author's compatibility notes span early Mac OS X releases through Apple
      silicon, documenting longevity across several Mac platform transitions without
      providing adoption statistics.
  package-nerd-significance:
    - >
      SleepWatcher connects macOS power and activity events to Unix commands, making it
      useful for shell-based workstation automation.
  project-history:
    - >
      Bernhard Baehr distributes SleepWatcher as a macOS command-line daemon with source
      code included. Older distributions remain available for Mac OS X 10.1–10.4.
  related-projects:
    - macOS power management
    - Unix shell scripting
  sources:
    - https://www.bernhard-baehr.de/
  summary:
    - >
      SleepWatcher monitors Mac sleep, wake and user activity and can execute commands
      when those states change.
  timeline:
    - 'Early Mac OS X era: Releases supported Mac OS X 10.1 and 10.2.'
    - >
      Apple silicon era: The author documents Rosetta 2 operation and provides a
      Makefile for native compilation.
  usage:
    - >
      Typical uses include running commands on suspend, resume, prolonged inactivity or
      power-adapter changes. The homepage also documents requesting sleep and querying
      elapsed idle time.
category: system
package-manager:
  brew: sleepwatcher
  macports: sleepwatcher
  nix: sleepwatcher
package-manager-url: https://formulae.brew.sh/formula/sleepwatcher
license: GPL-3.0-or-later
tags:
  - cli
  - daemon
  - idle-monitoring
  - macos
  - sleep
  - wake
description: Monitors sleep, wakeup, and idleness of a Mac
executables:
  - sleepwatcher
provenance:
  formula: sleepwatcher
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
