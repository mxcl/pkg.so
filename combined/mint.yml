id: brew:mint
display-name: Mint
homepage: https://github.com/yonaskolb/Mint
repo: https://github.com/yonaskolb/Mint
docs:
  - https://github.com/yonaskolb/Mint#readme
config-file-location:
  unix: Mintfile
credentials-file-location: null
history:
  project-history:
    - >
      The tool fills a narrow gap in the Swift ecosystem. Homebrew is convenient for
      global installation, but the Mint README points out that formulas must be created
      and maintained and that running specific versions can be awkward. Mint instead
      uses SPM builds, caches builds by package version, permits multiple versions side
      by side, can link one version into ~/.mint/bin, and can run packages without
      linking them globally.
  sources:
    - https://formulae.brew.sh/formula/mint
    - https://github.com/yonaskolb/Mint
  summary:
    - >
      Mint is the yonaskolb/Mint project's package manager for Swift command-line tools
      built with the Swift Package Manager. Its README frames the core workflow as
      installing and running a versioned executable package directly from a GitHub
      shorthand or Git URL, for example running SwiftLint or XcodeGen without
      maintaining a separate Homebrew formula for each tool.
  usage:
    - >
      In project usage, Mintfile is the important adoption pattern: teams can commit a
      list of versioned Swift CLI dependencies and run mint bootstrap or mint run so
      every developer and CI job uses the same tools. The README lists common compatible
      tools such as SwiftLint, SwiftFormat, SwiftGen, Sourcery, Carthage, and XcodeGen,
      showing its role as dependency management for iOS and Swift developer tooling
      rather than as a general-purpose language package manager.
related-packages:
  - id: brew:swiftlint
    reason: >
      Mint officially supports installing and running SwiftLint, allowing a project to
      pin its Swift style checks in Mintfile and use the same linter version locally and
      in CI.
    rel: adjacent_workflow
    sources:
      - https://github.com/yonaskolb/Mint
      - https://github.com/realm/SwiftLint
  - id: brew:swiftformat
    reason: >
      Mint can install and version-pin SwiftFormat so formatting behavior is
      reproducible across developer machines and CI jobs.
    rel: adjacent_workflow
    sources:
      - https://github.com/yonaskolb/Mint
      - https://github.com/nicklockwood/SwiftFormat
  - id: brew:xcodegen
    reason: >
      Mint's official examples use XcodeGen directly, making it a convenient way to pin
      and run the project generator before opening or building an Xcode project.
    rel: adjacent_workflow
    sources:
      - https://github.com/yonaskolb/Mint
      - https://yonaskolb.github.io/XcodeGen/
category: developer-tools
package-manager:
  brew: mint
  macports: mint
  nix: mint
package-manager-url: https://formulae.brew.sh/formula/mint
license: MIT
tags:
  - cli
  - dependency-manager
  - package-manager
  - spm
  - swift
description: Dependency manager that installs and runs Swift command-line tool packages
executables:
  - mint
provenance:
  formula: mint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
