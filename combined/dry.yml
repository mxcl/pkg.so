id: brew:dry
display-name: dry
homepage: https://moncho.github.io/dry/
repo: https://github.com/moncho/dry
docs:
  - https://github.com/moncho/dry#readme
  - https://moncho.github.io/dry
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dry's adoption is mostly among terminal-first Docker users who want an interactive
      dashboard without a web console. Official badges and docs point to GitHub releases
      and Snap packaging, while Homebrew and Nix packaging make it easy to install on
      developer workstations.
  package-nerd-significance:
    - >
      dry is package-nerd interesting because it is a Go-era single binary that wraps a
      large external platform without bundling that platform. The package is small, but
      its usefulness depends entirely on a reachable Docker daemon and on staying
      compatible with Docker's API behavior.
  project-history:
    - >
      The project emerged during the Docker Swarm era as an alternative interface to
      repeated `docker` CLI invocations. Its README emphasizes parity with many official
      Docker CLI commands, local or remote Docker daemon support, monitoring use cases,
      and single-binary installation.
  related-projects:
    - Docker and Docker Swarm are the managed platforms.
    - The official Docker CLI is the behavior reference for many dry commands.
    - Snap, Homebrew, and Nix are common package-distribution neighbors for the single binary.
  sources:
    - https://github.com/moncho/dry
    - https://github.com/moncho/dry/blob/master/README.md
    - https://moncho.github.io/dry
  summary:
    - >
      dry is a terminal UI for managing Docker and Docker Swarm. It packages as a single
      binary and gives operators an ncurses-style way to inspect containers, images,
      networks, volumes, nodes, services, stacks, logs, events, and Docker daemon state.
  timeline:
    - '2010s: dry appears as a terminal application for Docker and Docker Swarm management.'
    - >
      Later: The README documents single-binary installation and command/keybinding
      coverage for containers, images, networks, volumes, and Swarm resources.
    - >
      Packaging era: The project advertises GitHub release workflows and package
      surfaces such as Snap, Homebrew, and Nix.
  usage:
    - >
      Users run `dry` to browse Docker resources, inspect selected objects, tail logs,
      execute into containers, view daemon events, and manage Swarm constructs. Its
      keyboard-driven interface makes it a lightweight local operations tool rather than
      a cluster control plane.
related-packages:
  - id: brew:lazydocker
    reason: >
      Choose lazydocker for a Docker-and-Compose-focused TUI with configurable commands
      and dedicated project/service panels; choose dry when Docker Swarm views and its
      broader Docker-resource workspace are preferable.
    rel: alternative
    sources:
      - https://github.com/moncho/dry#readme
      - https://github.com/jesseduffield/lazydocker#readme
  - id: brew:ctop
    reason: >
      Choose ctop for a compact metrics-first view of Docker and runC containers; choose
      dry when you need broader lifecycle management, Compose projects, networks,
      volumes, or Swarm resources.
    rel: alternative
    sources:
      - https://github.com/moncho/dry#readme
      - https://github.com/bcicen/ctop#readme
