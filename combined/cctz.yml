id: brew:cctz
display-name: CCTZ
homepage: https://github.com/google/cctz
repo: https://github.com/google/cctz
docs:
  - https://github.com/google/cctz#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Bazel as the preferred build system while also supporting
      Make and CMake. The input package facts list Homebrew, Debian/Ubuntu libcctz-dev,
      Fedora/DNF, and Nix packages, showing adoption as a reusable C++ library rather
      than only as an application.
  package-nerd-significance:
    - >
      CCTZ is package-nerd significant because time-zone handling is notoriously
      edge-case heavy, and this library packages a focused C++ solution around IANA data
      before broad standard-library time-zone support was common in deployed toolchains.
  project-history:
    - >
      The official repository was created in 2015. The README says CCTZ contains a
      Civil-Time Library and a Time-Zone Library that cooperate with C++ <chrono>,
      giving programmers tools for date, time, and time-zone work.
    - >
      CCTZ had a v1.0 release in March 2016 and a v2.0 release in April 2016, followed
      by v2.1 in 2017, v2.2 in 2018, v2.3 in 2019, v2.4 in 2024, and v2.5 in 2025.
  related-projects:
    - >
      The README references C++ <chrono>, the IANA time-zone database, Bazel,
      GoogleTest, and CMake.
    - >
      The README also links older ISO C++ proposals for standardizing civil-time and
      time-zone libraries.
  sources:
    - https://api.github.com/repos/google/cctz
    - https://github.com/google/cctz
    - https://github.com/google/cctz#readme
    - https://formulae.brew.sh/api/formula/cctz.json
  summary:
    - >
      CCTZ is Google's C++ date, civil-time, and time-zone library for converting
      between absolute time and human civil time using IANA time-zone data. It is
      packaged both as a library and, in Homebrew, with the time_tool example
      executable.
  timeline:
    - '2015: Official GitHub repository created.'
    - '2016: v1.0 and v2.0 releases published.'
    - '2019: v2.3 release published.'
    - '2024: v2.4 release published.'
    - '2025: v2.5 release published.'
  usage:
    - >
      CCTZ is used by C++ programs that need correct civil-date arithmetic and
      conversion between time zones and absolute time points. The README points users to
      cctz/civil_time.h, cctz/time_zone.h, examples, Bazel, CMake, and system-installed
      IANA zoneinfo data.
related-packages: []
