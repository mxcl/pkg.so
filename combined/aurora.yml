id: brew:aurora
display-name: aurora
homepage: https://xuri.me/aurora/
repo: https://github.com/xuri/aurora
docs:
  - https://github.com/xuri/aurora#readme
  - https://xuri.me/aurora
config-file-location:
  unix:
    - aurora.toml in the directory containing the aurora executable
    - path passed with -c <filename>
  windows:
    - aurora.toml in the directory containing aurora.exe
    - path passed with -c <filename>
credentials-file-location:
  unix:
    - '[auth] section in aurora.toml in the directory containing the aurora executable'
    - '[auth] section in the file passed with -c <filename>'
  windows:
    - '[auth] section in aurora.toml in the directory containing aurora.exe'
    - '[auth] section in the file passed with -c <filename>'
history:
  adoption-history:
    - >
      aurora's adoption surface is binary distribution: the official site emphasizes
      macOS, Linux, and Windows support, single-binary installation, zero dependencies,
      and Homebrew installation. The supplied package-manager facts also show Scoop,
      Ubuntu, and winget entries.
  package-nerd-significance:
    - >
      aurora is a tidy package-manager specimen: one binary, one adjacent TOML config,
      no runtime service stack beyond Beanstalkd and a browser. The interesting
      packaging detail is preserving the executable-relative aurora.toml default while
      also allowing -c for managed config locations.
  project-history:
    - >
      The GitHub repository was created on 2016-10-09, and the release API shows version
      1.0 published the same day. The README says aurora was created as a very simple
      and portable application for working with local or remote Beanstalkd servers,
      using Go so the compiler can produce zero-dependency binaries.
    - >
      The README credits the web UI as originally based on ptrofimov/beanstalk_console
      and the Beanstalkd client on beanstalkd/go-beanstalk. The project therefore sits
      in a pragmatic lineage of small Beanstalkd admin tools, rebuilt as a single Go
      binary with a bundled web UI.
  related-projects:
    - >
      aurora is related to beanstalkd, beanstalkd/go-beanstalk, BurntSushi/toml, and
      ptrofimov/beanstalk_console, which the README credits as the original web UI
      basis.
  sources:
    - https://api.github.com/repos/xuri/aurora
    - https://github.com/xuri/aurora#readme
    - https://raw.githubusercontent.com/xuri/aurora/master/aurora.toml
    - https://raw.githubusercontent.com/xuri/aurora/master/utils.go
    - https://xuri.me/aurora
  summary:
    - >
      aurora is a Go web console for administering beanstalkd queue servers. It packages
      a browser UI and server-side Beanstalkd client into a single cross-platform
      binary, aimed at people who want a lightweight operational console rather than a
      full queue-management platform.
  timeline:
    - '2016: Repository initialized and version 1.0 released.'
    - '2016: Rapid 1.x releases followed through the first months of the project.'
    - >
      2021: Source headers still describe aurora as a Go cross-platform, zero-dependency
      Beanstalkd console.
    - >
      2026: The official site continues to present aurora as a cross-platform Beanstalkd
      admin console.
  usage:
    - >
      Operators run aurora, open the printed local web URL, and manage local or remote
      Beanstalkd servers. The README lists features for viewing tubes,
      ready/delayed/buried jobs, job details, statistics, auto-refresh, moving or
      deleting jobs, pausing tubes, searching job data, and optional basic auth from
      aurora.toml.
related-packages:
  - id: brew:beanstalkd
    reason: >
      Install beanstalkd as the work-queue daemon that aurora is specifically designed
      to monitor and administer through its web console.
    rel: adjacent_workflow
    sources:
      - https://github.com/xuri/aurora#readme
      - https://beanstalkd.github.io/
category: developer-tools
package-manager:
  brew: aurora
  scoop: extras/aurora
  ubuntu: aurora
  winget: Aurora.Aurora
package-manager-url: https://formulae.brew.sh/formula/aurora
license: MIT
tags:
  - admin-console
  - beanstalkd
  - cli
  - go
  - queue
  - web-ui
description: Beanstalkd queue server console
executables:
  - aurora
provenance:
  formula: aurora
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
