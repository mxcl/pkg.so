id: brew:lima
display-name: Lima
homepage: https://lima-vm.io/
repo: https://github.com/lima-vm/lima
docs:
  - https://lima-vm.io/docs
config-file-location:
  unix:
    - ${LIMA_HOME:-$HOME/.lima}/<instance>/lima.yaml
    - ${LIMA_HOME:-$HOME/.lima}/_config/networks.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Lima gained adoption as developers looked for open, scriptable alternatives to
      heavier desktop container products on macOS, especially after Apple Silicon made
      VM architecture and filesystem integration more visible in local development.
      Projects such as Colima and Rancher Desktop used Lima as a building block for
      friendlier container and Kubernetes experiences.
    - >
      Lima joined the Cloud Native Computing Foundation as a Sandbox project in
      September 2022 and was promoted to Incubating in October 2025, reflecting its role
      as shared infrastructure for cloud-native local development.
  package-nerd-significance:
    - >
      Lima is package-nerd significant because it turns a pile of VM details into a
      package-manager-friendly CLI. Its Homebrew formula gives macOS users a
      reproducible way to get Linux containers, port forwarding, file sharing, QEMU or
      native virtualization choices, and YAML-controlled instances without installing a
      full GUI product.
  project-history:
    - >
      The Lima documentation says the project began in May 2021 to promote containerd
      and nerdctl to Mac users. Its first GitHub release, v0.1.0, was published in May
      2021 and demonstrated a minimal workflow of starting a VM with limactl and running
      Linux commands through lima.
    - >
      The project quickly broadened beyond its original containerd focus. Its README
      describes support for other container engines such as Docker, Podman, and
      Kubernetes, non-container workloads, and hosts beyond macOS including Linux and
      NetBSD.
  related-projects:
    - >
      Lima is related to containerd, nerdctl, QEMU, Apple's virtualization stack,
      Docker, Podman, Kubernetes, Colima, and Rancher Desktop. Its positioning is often
      compared to WSL2 because both provide Linux environments with host integration.
  sources:
    - https://github.com/lima-vm/lima
    - https://github.com/lima-vm/lima/issues/119
    - https://github.com/lima-vm/lima/releases/tag/v0.1.0
    - https://lima-vm.io/docs/
    - https://lima-vm.io/docs/talks/
  summary:
    - >
      Lima, short for Linux Machines, is a command-line tool for running Linux virtual
      machines with automatic file sharing and port forwarding. It is best known in the
      macOS developer ecosystem as the low-level VM layer behind container workflows
      that need a real Linux guest.
  timeline:
    - '2021-05: Lima began with the goal of promoting containerd and nerdctl to Mac users.'
    - '2021-05-14: The v0.1.0 release was published as the first public release.'
    - '2022-09: Lima joined CNCF as a Sandbox project.'
    - '2025-10: Lima was promoted to CNCF Incubating.'
  usage:
    - >
      Users create or start named instances with limactl, then run commands inside the
      guest via the lima wrapper or connect container tools to sockets exposed by the
      VM. Templates cover common setups such as containerd, Docker, Podman, Kubernetes,
      and Apptainer.
related-packages:
  - id: brew:colima
    reason: >
      Choose Colima when you want a simpler Docker-, containerd-, or Kubernetes-focused
      interface that uses Lima underneath and supplies opinionated runtime setup.
    rel: adjacent_workflow
    sources:
      - https://github.com/abiosoft/colima#readme
      - https://lima-vm.io/docs/examples/containers/
  - id: brew:nerdctl
    reason: >
      nerdctl provides the Docker-compatible command workflow for Lima's built-in
      containerd environment and can be invoked against containers inside a Lima
      instance.
    rel: adjacent_workflow
    sources:
      - https://lima-vm.io/docs/examples/containers/containerd/
      - https://github.com/containerd/nerdctl#readme
  - id: brew:socket_vmnet
    reason: >
      socket_vmnet adds managed shared or bridged macOS networking when a Lima VM must
      be reachable by IP or communicate through Apple's vmnet.framework.
    rel: adjacent_workflow
    sources:
      - https://lima-vm.io/docs/config/network/vmnet/
      - https://github.com/lima-vm/socket_vmnet#readme
category: system
package-manager:
  apk: lima
  brew: lima
  macports: lima
  nix: lima
  scoop: main/lima
  winget: Lima.Lima
  zypper: lima
package-manager-url: https://formulae.brew.sh/formula/lima
license: Apache-2.0
tags:
  - cli
  - containers
  - linux-vm
  - macos
  - virtual-machines
description: Linux virtual machines
executables:
  - apptainer.lima
  - docker.lima
  - kubectl.lima
  - lima
  - limactl
  - nerdctl.lima
  - podman.lima
provenance:
  formula: lima
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
