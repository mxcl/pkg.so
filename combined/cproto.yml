id: brew:cproto
display-name: cproto
homepage: https://invisible-island.net/cproto/
repo: https://github.com/ThomasDickey/cproto-snapshots
docs:
  - https://invisible-island.net/cproto/cproto.html
  - https://invisible-island.net/cproto/manpage/cproto.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cproto spread through the Unix source-sharing ecosystem before modern package
      managers, with releases posted to comp.sources.unix and comp.sources.misc. The
      official page later cataloged downstream package references for Debian, RPM-based
      systems, SlackBuilds, FreshPorts, NetBSD pkgsrc, AIX, HP-UX, and Repology.
  package-nerd-significance:
    - >
      cproto is a classic small Unix development tool: it predates Git hosting, has
      Usenet-release provenance, uses generated manpage documentation, and remains
      packaged because it solves a narrow C maintenance problem that still appears in
      legacy codebases.
  project-history:
    - >
      The official history says Chin Huang wrote and maintained cproto while at the
      University of Waterloo, with the first public version posted to comp.sources.unix
      in October 1989. Updates followed on comp.sources.misc through the early 1990s.
    - >
      Thomas E. Dickey began working on cproto in June 1993, sending fixes and
      improvements to Huang. His work added lint-library support, GNU configure support,
      regression tests, diagnostics, and ports including VAX/VMS and HP/Apollo.
    - >
      The modern Invisible Island page documents Dickey's continued maintenance,
      occasional fixes, generated documentation, release archives, and an official
      GitHub snapshots repository.
  related-projects:
    - >
      The official history contrasts cproto with protoize and notes cproto's role in
      generating lint libraries.
    - Dickey's page says he currently uses cproto to generate lint libraries for ncurses.
  sources:
    - https://invisible-island.net/cproto/cproto.html
    - https://invisible-island.net/cproto/manpage/cproto.html
    - https://github.com/ThomasDickey/cproto-snapshots
    - https://api.github.com/repos/ThomasDickey/cproto-snapshots
  summary:
    - >
      cproto is a long-lived C source utility for generating function prototypes and
      declarations from C input files. It also supports conversions between old-style
      K&R function definitions and ANSI C style, plus lint-library generation.
  timeline:
    - >
      1989: Chin Huang's first cproto release was posted to comp.sources.unix volume 20,
      issue 39.
    - '1991: cproto 2.0 and 2.2 updates appeared on comp.sources.misc.'
    - '1992: cproto 3.x updates continued on comp.sources.misc.'
    - '1993: Thomas E. Dickey began contributing fixes and improvements.'
    - >
      1994: cproto 4.0 appeared with Dickey's contributions including lint-library work,
      configure support, and additional ports.
    - >
      2016: Thomas Dickey's cproto-snapshots GitHub repository was created for release
      and interim labels.
  usage:
    - >
      The manpage describes cproto as reading C source files or standard input and
      writing generated function prototypes to standard output. It can process K&R or
      ANSI-style definitions, optionally emit variable declarations, convert source
      forms, and generate lint-library source.
related-packages: []
category: developer-tools
package-manager:
  apk: cproto
  brew: cproto
  debian: cproto
  dnf: cproto
  macports: cproto
  nix: cproto
  ubuntu: cproto
package-manager-url: https://formulae.brew.sh/formula/cproto
license: LicenseRef-Homebrew-public-domain
tags:
  - c
  - cli
  - code-generation
  - function-prototypes
description: Generate function prototypes for functions in input files
executables:
  - cproto
provenance:
  formula: cproto
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
