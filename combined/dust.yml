id: brew:dust
display-name: Dust
homepage: https://github.com/bootandy/dust
repo: https://github.com/bootandy/dust
docs:
  - https://github.com/bootandy/dust#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/dust/config.toml
    - ~/.config/dust/config.toml
    - ~/.dust.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README lists many installation channels: Cargo, Homebrew on macOS and
      Linux, Snap, Pacstall, conda-forge, deb-get, x-cmd, Scoop on Windows, and
      downloadable GitHub release binaries. The GitHub API also reports a five-digit
      star count by June 2026, making it one of the more visible Rust rewrites of a
      classic Unix utility.
    - >
      The breadth of packages reflects the tool's appeal: disk-usage inspection is
      universal, and `dust` gives package-manager users a modern default that is quick
      to install on developer machines, servers, and Windows terminals.
  package-nerd-significance:
    - >
      Dust is a canonical example of the 2010s and 2020s Rust CLI wave: a safer, faster,
      more opinionated replacement for a small Unix command, distributed through nearly
      every package ecosystem. It is especially relevant because it competes with both
      ancient coreutils habits and interactive tools like ncdu.
  project-history:
    - >
      The GitHub repository was created in March 2018, and the crates.io package
      followed in April 2018. The project matured into a cross-platform CLI with a 1.0.0
      GitHub release in March 2024 and continued releases through at least 1.2.4 in
      January 2026.
    - >
      Dust's core design choice is to show a terminal-sized hierarchy of the largest
      directories and files without making users pipe `du` through `sort` and `head`. It
      uses colored bars and tree context to show both size and ancestry.
  related-projects:
    - >
      The README lists ncdu, dutree, dua, pdu, dirstat-rs, and traditional `du -d 1 -h |
      sort -h` as alternatives. Dust differentiates itself by choosing a compact,
      automatically prioritized tree view.
  sources:
    - https://github.com/bootandy/dust
    - https://api.github.com/repos/bootandy/dust
    - https://crates.io/crates/du-dust
    - https://api.github.com/repos/bootandy/dust/releases
  summary:
    - >
      Dust, packaged as `dust` and published to crates.io as `du-dust`, is a Rust
      rethinking of the Unix `du` workflow. Its README sums up the project as `du + rust
      = dust`: a more intuitive way to see where disk space is being used.
  timeline:
    - '2018-03-16: GitHub repository created.'
    - '2018-04-18: `du-dust` crate created on crates.io.'
    - '2024-03-25: Dust 1.0.0 released.'
    - '2026-01-08: Dust 1.2.4 released.'
  usage:
    - >
      Common usage is simply `dust` or `dust <dir>`, with flags for output count, depth,
      apparent size, directories-only or files-only views, filesystem boundaries, JSON
      output, and collapsed directories. The README documents config through
      `~/.config/dust/config.toml` or `~/.dust.toml` for persistent defaults.
related-packages:
  - id: brew:ncdu
    reason: >
      Choose ncdu when you want an interactive terminal browser with navigation and
      deletion instead of Dust's immediate non-interactive summary.
    rel: alternative
    sources:
      - https://github.com/bootandy/dust#alternatives
      - https://dev.yorhel.nl/ncdu
  - id: brew:dua-cli
    reason: >
      Choose dua-cli when fast parallel scanning should be paired with an interactive
      terminal mode for exploring and deleting unwanted data.
    rel: alternative
    sources:
      - https://github.com/bootandy/dust#alternatives
      - https://github.com/Byron/dua-cli#readme
  - id: brew:dutree
    reason: >
      Choose dutree for a simpler colored filesystem tree with explicit aggregation,
      depth, and comparison controls.
    rel: alternative
    sources:
      - https://github.com/bootandy/dust#alternatives
      - https://github.com/nachoparker/dutree#readme
category: system
package-manager:
  apk: dust
  brew: dust
  macports: dust
  nix: dust
  pacman: dust
  scoop: main/dust
  winget: bootandy.dust
  zypper: dust
package-manager-url: https://formulae.brew.sh/formula/dust
license: Apache-2.0
tags:
  - cli
  - disk-usage
  - du
  - filesystem
  - rust
description: More intuitive version of du in rust
executables:
  - dust
provenance:
  formula: dust
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
