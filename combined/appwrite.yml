id: brew:appwrite
display-name: Appwrite CLI
homepage: https://appwrite.io
repo: https://github.com/appwrite/sdk-for-cli
docs:
  - https://appwrite.io/docs
  - https://appwrite.io/docs/tooling/command-line/commands
  - https://appwrite.io/docs/tooling/command-line/installation
config-file-location:
  unix: appwrite.config.json
  windows: appwrite.config.json
credentials-file-location:
  unix: ~/.appwrite
  windows: '%USERPROFILE%\.appwrite'
history:
  adoption-history:
    - >
      The CLI is part of Appwrite's official developer workflow: the installation guide
      documents npm, Homebrew, shell installer, PowerShell, and Scoop paths. In
      package-manager culture it is notable because the Homebrew formula installs a
      cloud-platform CLI whose canonical use is project scaffolding and deployment
      rather than local daemon administration.
    - >
      The supplied package metadata records Homebrew packaging for the brew:appwrite
      formula. Appwrite's own docs also name Homebrew as an installation path, so the
      formula is not merely a community convenience; it is one of the documented
      upstream install methods.
  package-nerd-significance:
    - >
      For package nerds, Appwrite CLI is a good example of a SaaS platform shipping a
      first-party CLI through both language-package and OS-package channels. Its formula
      matters because teams can pin the same Appwrite deployment tool in laptop
      bootstrap scripts and CI images without pulling in a Node project dependency tree.
    - >
      The config split introduced in CLI 20.0.0 and later is also
      package-manager-relevant: the CLI's local appwrite.config.json becomes a
      declarative deployment manifest that lives with source code, much like Terraform
      files or Kubernetes manifests.
  project-history:
    - >
      The CLI developed as an official Appwrite SDK surface rather than as a separate
      third-party wrapper. Appwrite's documentation describes it as an application for
      interacting with Appwrite from a terminal, including project/resource management,
      function deployment, and API operations.
    - >
      The modern CLI is distributed from the official appwrite/sdk-for-cli repository
      and is released both as npm package tooling and as standalone binaries. Recent
      releases show active work around Appwrite Cloud, OAuth/device login flows,
      generated command coverage, and deployment commands such as init, pull, push, and
      run.
  related-projects:
    - Appwrite server and Appwrite Cloud are the backend targets for the CLI.
    - >
      The Appwrite Server SDKs are adjacent generated API clients; the CLI exposes
      similar server-side operations from a terminal.
  sources:
    - https://appwrite.io/docs/tooling/command-line/commands
    - https://appwrite.io/docs/tooling/command-line/installation
    - https://github.com/appwrite/sdk-for-cli/releases
    - source_facts.package-manager
  summary:
    - >
      Appwrite CLI is the command-line companion to Appwrite, the backend-as-a-service
      platform. It packages Appwrite account, project, deployment, and Server API
      workflows into an installable terminal tool.
  timeline:
    - >
      2025: Appwrite CLI 20.0.0 and later support multi-file project configuration
      through appwrite.config.json includes.
    - >
      2026: Release 22.x continues active CLI development with OAuth, regional endpoint,
      and deployment workflow changes.
  usage:
    - >
      Typical use starts with appwrite login, then appwrite init project, which creates
      appwrite.config.json for project ID, endpoint, and deployable resources. The CLI
      can then pull or push functions, tables, teams, topics, buckets, and other project
      resources.
    - >
      For automation, the same executable doubles as a Server SDK-like command surface:
      Appwrite documents a command for every Server API endpoint and options for JSON
      output, verbose errors, force mode, and non-interactive operation.
related-packages: []
category: developer-tools
package-manager:
  brew: appwrite
package-manager-url: https://formulae.brew.sh/formula/appwrite
license: BSD-3-Clause
tags:
  - appwrite
  - baas
  - backend
  - cli
  - developer-platform
description: Command-line tool for Appwrite
executables:
  - appwrite
provenance:
  formula: appwrite
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
