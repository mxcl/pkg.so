id: brew:godns
display-name: GoDNS
homepage: https://github.com/TimothyYe/godns
repo: https://github.com/TimothyYe/godns
docs:
  - https://github.com/TimothyYe/godns#readme
  - https://github.com/TimothyYe/godns/blob/master/MULTI_PROVIDER.md
config-file-location:
  unix:
    - ./config.json
    - ./config.yaml
  windows:
    - .\config.json
    - .\config.yaml
credentials-file-location:
  unix:
    - ./config.json
    - ./config.yaml
  windows:
    - .\config.json
    - .\config.yaml
history:
  adoption-history:
    - >
      GoDNS is distributed as release binaries, a Docker image, and a Homebrew formula,
      and it supports machines ranging from desktops and servers to routers and
      Raspberry Pi-class Linux devices.
  package-nerd-significance:
    - >
      For package users, GoDNS packages a traditionally daemon-like DDNS job as a single
      cross-platform Go executable while retaining container and service-oriented
      deployment options.
  project-history:
    - >
      The project describes itself as a Go rewrite of Timothy Ye's earlier open-source
      DynDNS project. It later added a built-in web panel and support for configuring
      multiple DNS providers in one file.
  related-projects:
    - DynDNS
    - DuckDNS
    - Cloudflare DNS
  sources:
    - 'Official GoDNS README: https://github.com/TimothyYe/godns#readme'
    - >
      Official multi-provider guide:
      https://github.com/TimothyYe/godns/blob/master/MULTI_PROVIDER.md
  summary:
    - >
      GoDNS is a self-hosted dynamic DNS client that watches a host's public address and
      updates DNS records through a range of provider APIs.
  usage:
    - >
      Operators copy a sample JSON or YAML configuration, add domains and provider
      credentials, and run godns with the configuration beside the executable or select
      it explicitly with the -c option.
related-packages:
  - id: brew:ddclient
    reason: >
      Choose ddclient for a mature Perl daemon with a dedicated `ddclient.conf` format
      and a particularly broad protocol list; choose GoDNS for a single Go executable
      with JSON/YAML configuration and a built-in web panel.
    rel: alternative
    sources:
      - https://github.com/TimothyYe/godns#readme
      - https://ddclient.net/
      - https://ddclient.net/protocols.html
  - id: brew:inadyn
    reason: >
      Choose Inadyn for a small C daemon commonly embedded in routers and gateways;
      choose GoDNS when multi-provider JSON/YAML configuration, containers, or a web
      interface are more useful.
    rel: alternative
    sources:
      - https://github.com/TimothyYe/godns#readme
      - https://troglobit.com/projects/inadyn/
category: networking
package-manager:
  brew: godns
  nix: godns
package-manager-url: https://formulae.brew.sh/formula/godns
license: Apache-2.0
tags:
  - cli
  - ddns-client
  - dns
  - dynamic-dns
  - multi-provider
  - self-hosted
  - web-panel
description: Dynamic DNS client with multiple providers support
executables:
  - godns
provenance:
  formula: godns
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
