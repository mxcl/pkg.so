id: brew:erlfmt
display-name: erlfmt
homepage: https://github.com/WhatsApp/erlfmt
repo: https://github.com/WhatsApp/erlfmt
docs:
  - https://github.com/WhatsApp/erlfmt#readme
  - https://github.com/WhatsApp/erlfmt/tree/main/doc
config-file-location:
  unix: PROJECT_ROOT/rebar.config
credentials-file-location: null
history:
  adoption-history:
    - >
      erlfmt's main adoption path is as a rebar3 project plugin, adding a rebar3 fmt
      task and CI-friendly --check mode. The README also documents standalone escript
      use and editor integrations.
  package-nerd-significance:
    - >
      For package managers, erlfmt is valuable because it is a deterministic formatter
      with a deliberate stability promise after 1.0. That makes it suitable for CI
      checks and repository-wide formatting without a constantly shifting style
      baseline.
  project-history:
    - >
      The README describes erlfmt as an automated formatter that lets teams focus on
      code behavior rather than formatting debates. The project reached version 1.0.0 on
      June 29, 2021 and states that it is feature complete, with only
      backwards-compatible changes and bug fixes considered without serious review.
  related-projects:
    - erlfmt integrates with rebar3 and requires Erlang/OTP.
    - The README compares erlfmt with rebar3_format, steamroller, and erl_tidy.
  sources:
    - https://raw.githubusercontent.com/WhatsApp/erlfmt/main/README.md
    - https://raw.githubusercontent.com/WhatsApp/erlfmt/main/CHANGELOG.md
    - https://api.github.com/repos/WhatsApp/erlfmt/releases?per_page=10
    - https://formulae.brew.sh/formula/erlfmt
  summary:
    - >
      erlfmt is WhatsApp's opinionated Erlang code formatter, packaged as a CLI and
      rebar3 workflow for teams that want consistent Erlang formatting.
  timeline:
    - '2021-06-29: erlfmt 1.0.0 released.'
    - '2024-09-03: erlfmt 1.5.0 added OTP 27 feature support.'
    - '2025-06-13: erlfmt 1.7.0 added OTP 28 feature support.'
    - '2026-02-23: erlfmt 1.8.0 added more formatter enhancements and fixes.'
  usage:
    - >
      Users add erlfmt to project_plugins in rebar.config, run rebar3 fmt to format a
      project, or run the escript directly against Erlang source globs. Later releases
      kept pace with OTP language changes, including OTP 27 sigils and triple-quoted
      strings and OTP 28 comprehension features.
related-packages:
  - id: brew:rebar3
    reason: >
      Use Rebar3 to load erlfmt as a project plugin, configure it in rebar.config, and
      expose the rebar3 fmt and CI-check workflows documented by erlfmt.
    rel: adjacent_workflow
    sources:
      - https://github.com/WhatsApp/erlfmt#usage
      - https://github.com/erlang/rebar3
  - id: brew:erlang@28
    reason: >
      Use OTP 28 as the runtime for erlfmt when formatting source that uses OTP 28
      generators or nominal types, which erlfmt's official releases explicitly support.
    rel: adjacent_workflow
    sources:
      - https://github.com/WhatsApp/erlfmt/releases
      - https://www.erlang.org/news/180
category: developer-tools
package-manager:
  brew: erlfmt
package-manager-url: https://formulae.brew.sh/formula/erlfmt
license: Apache-2.0
tags:
  - cli
  - code-style
  - erlang
  - formatter
  - rebar3
description: Automated code formatter for Erlang
executables:
  - erlfmt
provenance:
  formula: erlfmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
