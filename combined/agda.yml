id: brew:agda
display-name: Agda
homepage: https://wiki.portal.chalmers.se/agda/
repo: https://github.com/agda/agda
docs:
  - https://agda.readthedocs.io/en/latest
  - https://agda.readthedocs.io/en/latest/tools/package-system.html
  - https://github.com/agda/agda#readme
  - https://wiki.portal.chalmers.se/agda
config-file-location:
  unix:
    - .agda-lib
    - ~/.config/agda/libraries
    - ~/.config/agda/libraries-VERSION
    - ~/.config/agda/defaults
    - ~/.config/agda/defaults-VERSION
    - ~/.agda
  windows:
    - .agda-lib
    - C:\Users\USERNAME\AppData\Roaming\agda\libraries
    - C:\Users\USERNAME\AppData\Roaming\agda\libraries-VERSION
    - C:\Users\USERNAME\AppData\Roaming\agda\defaults
    - C:\Users\USERNAME\AppData\Roaming\agda\defaults-VERSION
credentials-file-location: null
history:
  adoption-history:
    - >
      Agda's adoption has grown through academic type theory, dependently typed
      programming, proof engineering, and formalized mathematics communities. The
      official wiki says the center of development is the Logic and Types group at
      Chalmers and Gothenburg University, while GitHub metadata shows a broad
      open-source contributor base.
    - >
      As a package, Agda is visible across Haskell and OS package ecosystems. The README
      links Hackage and Stackage badges, the official installation docs describe binary
      releases, source builds with cabal and Nix, and a Python installer, and the
      supplied batch facts list Homebrew, Debian, Fedora, Nix, Arch, and Ubuntu.
  package-nerd-significance:
    - >
      Agda is one of those packages where the executable is only half the story: editor
      integration, Unicode input, library metadata, GHC compatibility, data files,
      standard-library versioning, and release notes all affect whether users can
      actually type-check projects.
    - >
      The 2.8.0 release notes are especially package-relevant because they say Agda
      became a self-contained single binary and mention behavior around data files and
      library builds. That kind of upstream packaging change directly affects formulae,
      distro packages, and reproducible development environments.
  project-history:
    - >
      The official history page traces the lineage back to proof assistants based on
      Martin-Lof type theory developed in Gothenburg since 1983, followed by intensional
      dependent type theory systems around 1990 such as ALF. In the mid-1990s,
      prototypes and redesigns explored theory mechanisms, proof editors, and type
      checking with metavariable constraints.
    - >
      The original Agda, now often called Agda 1, was implemented in Haskell by Catarina
      Coquand. In 2004 the Programming Logic Group began collaborating with AIST in
      Japan, and the Agda Implementors Meetings started as biannual meetings alternating
      between Sweden and Japan.
    - >
      Work on the current Agda system began after the 2005 AgdaLight prototype by Ulf
      Norell and Andreas Abel. Ulf Norell's 2007 thesis, 'Towards a practical
      programming language based on dependent type theory', is named by the official
      history page as a main reference for Agda 2.
  related-projects:
    - ALF is the earlier Gothenburg logical framework named in the official history.
    - AgdaLight is the 2005 prototype named as a direct precursor to Agda 2.
    - >
      The Agda standard library is a separately versioned library package used by many
      Agda projects.
    - >
      Rocq, Epigram, Matita, and NuPRL are listed by the official wiki as related
      dependent-type proof assistants.
  sources:
    - https://agda.readthedocs.io/en/latest/getting-started/what-is-agda.html
    - https://agda.readthedocs.io/en/latest/tools/package-system.html
    - https://github.com/agda/agda/releases/tag/v2.8.0
    - https://wiki.portal.chalmers.se/agda
    - https://wiki.portal.chalmers.se/agda/Main/History
    - source_facts.package-manager
  summary:
    - >
      Agda is a dependently typed programming language and interactive theorem prover
      rooted in the Gothenburg tradition of Martin-Lof type theory systems. It is both a
      language-runtime package and a proof-assistant package, with an interactive editor
      workflow and a library system based on .agda-lib files.
  timeline:
    - '1983: Gothenburg work on Martin-Lof type theory proof assistants begins.'
    - '1990: ALF lineage of intensional dependent type theory systems begins around Gothenburg.'
    - '2004: Agda collaboration with AIST begins and Agda Implementors Meetings start.'
    - '2005: AgdaLight prototype work begins, leading toward Agda 2.'
    - '2007: Ulf Norell thesis on a practical dependently typed programming language published.'
    - '2025: Agda 2.8.0 released.'
  usage:
    - >
      Users run agda to type-check files, use agda-mode or another editor integration
      for interactive development, and manage libraries through .agda-lib files plus
      AGDA_DIR/libraries and AGDA_DIR/defaults files. On Unix-like systems AGDA_DIR
      defaults to ~/.config/agda, with fallback behavior for ~/.agda; on Windows it
      defaults under AppData/Roaming/agda.
    - >
      Agda code often depends on the standard library but the official installation page
      notes that the standard library is not necessarily bundled with every Agda
      distribution. The package-system documentation therefore matters to packagers and
      users because it defines how installed libraries become visible to the type
      checker.
related-packages:
  - id: brew:rocq
    reason: >
      Choose Rocq when the primary goal is interactive theorem proving with its
      established tactic-oriented proof environment; Agda more directly combines proofs
      with dependently typed functional programming.
    rel: alternative
    sources:
      - https://agda.readthedocs.io/en/latest/getting-started/what-is-agda.html
      - https://rocq-prover.org/
  - id: brew:idris2
    reason: >
      Choose Idris 2 when seeking a general-purpose dependently typed functional
      language with an emphasis on executable application development, rather than
      Agda's proof-assistant-centered workflow.
    rel: alternative
    sources:
      - https://agda.readthedocs.io/en/latest/getting-started/what-is-agda.html
      - https://idris2.readthedocs.io/en/latest/tutorial/introduction.html
