id: brew:chkbit
display-name: chkbit
homepage: https://laktak.github.io/chkbit/
repo: https://github.com/laktak/chkbit
docs:
  - https://github.com/laktak/chkbit#readme
  - https://laktak.github.io/chkbit
  - https://laktak.github.io/chkbit/usage
config-file-location:
  unix: .chkbitignore
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew and Nix package chkbit. The upstream documentation is intentionally
      package-manager-friendly, with a GitHub repository, Codeberg mirror, install page,
      usage page, and release notes in the README.
  package-nerd-significance:
    - >
      chkbit is interesting to package maintainers because it is a small, modern
      integrity tool in a space often served by scripts, rsync options, or
      filesystem-specific mechanisms. Its recent version line also adds deduplication
      without turning into a full backup suite.
  project-history:
    - >
      The official GitHub history starts in 2019. The README and project site describe
      chkbit as a tool that hashes files, detects corruption, and in newer versions can
      detect duplicates and run deduplication on supported systems.
  related-projects:
    - >
      The README lists GitHub and Codeberg repositories. The usage model overlaps with
      backup verification, checksum catalogs, and deduplication tools, but chkbit
      remains a standalone CLI.
  sources:
    - https://github.com/laktak/chkbit#readme
    - https://laktak.github.io/chkbit/usage/
    - https://formulae.brew.sh/api/formula/chkbit.json
    - https://github.com/laktak/chkbit
  summary:
    - >
      chkbit is a file-integrity checker for detecting data corruption during transfers,
      backups, recovery, and related storage workflows.
  timeline:
    - '2019: First commits in the official chkbit repository.'
    - '2024: v4 and v5 release lines appear in official tags.'
    - >
      2025: v6 line introduces simplified CLI syntax, atom mode, fuse, and deduplication
      work in release notes.
    - '2026: Homebrew tracks stable v6.6.0.'
  usage:
    - >
      Users initialize a directory tree in split mode, storing indexes in each
      directory, or atom mode, storing one index for the tree. They then add or update
      hashes and run chkbit check to verify files, especially before or after backup
      operations.
related-packages:
  - id: brew:rhash
    reason: >
      RHash is a lower-level alternative when you need to calculate or verify many
      standard digest formats and checksum files rather than maintain chkbit's
      directory-tree index.
    rel: alternative
    sources:
      - https://laktak.github.io/chkbit/
      - https://github.com/rhash/RHash
category: system
package-manager:
  brew: chkbit
  nix: chkbit
package-manager-url: https://formulae.brew.sh/formula/chkbit
license: MIT
tags:
  - backup
  - checksums
  - cli
  - data-corruption
  - data-integrity
  - deduplication
description: Check your files for data corruption
executables:
  - chkbit
provenance:
  formula: chkbit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
