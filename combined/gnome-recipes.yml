homepage: https://wiki.gnome.org/Apps/Recipes
repo: https://gitlab.gnome.org/GNOME/recipes
docs:
  - https://wiki.gnome.org/Apps/Recipes
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Recipes was adopted as one of GNOME's application experiments beyond traditional
      office and system utilities. Its distribution through Flatpak, Linux distribution
      packages, and Homebrew made it available to users who wanted a desktop-native
      cookbook rather than a web-only recipe collection.
  package-nerd-significance:
    - >
      For package nerds, GNOME Recipes is notable because it packages structured content
      with a desktop app. It also shows GNOME's mid-2010s Flatpak-era app model: a GTK
      application with community data, translations, Meson builds, and distro packaging
      despite having a non-developer subject matter.
  project-history:
    - >
      Matthias Clasen introduced the app in December 2016 as GNOME Recipes, asking GNOME
      contributors to provide real recipes and photos so the application could ship with
      community-contributed content rather than test data. The project followed GNOME
      application conventions, using GTK, Meson, Flatpak, and GNOME design resources.
    - >
      The repository README describes the app's main objects as recipes, ingredients,
      cuisines, and chefs, and notes that after the 1.0 release the build system
      switched exclusively to Meson. The archived GNOME wiki page documents the app's
      user-facing views and links to stable Flatpak distribution.
  related-projects:
    - >
      GNOME Recipes is related to Gourmet Recipe Manager, GNOME Cookbook community
      content, Flatpak, GTK, Meson, GNOME design resources, and distribution packages
      such as Debian, Arch, openSUSE, and Homebrew formulas.
  sources:
    - https://blogs.gnome.org/mclasen/2016/12/02/gnome-loves-to-cook/
    - https://github.com/GNOME/recipes
    - https://gitlab.gnome.org/GNOME/recipes
    - https://wiki.gnome.org/Apps/Recipes
    - https://wiki.gnome.org/Hackfests/Recipes2018
  summary:
    - >
      GNOME Recipes is a recipe-management and cooking application for the GNOME
      desktop. It organizes recipes, ingredients, cuisines, and chefs, and presents
      browsing, recipe-detail, shopping-list, and cooking views.
  timeline:
    - >
      2016-12: Matthias Clasen announces GNOME Recipes and asks for recipe/photo
      contributions.
    - '2017: Recipes receives wider Linux distribution and Flatpak attention.'
    - >
      2018: A GNOME Recipes hackfest explores ways to extend the cooking app for GNOME
      and Endless OS users.
  usage:
    - >
      Practitioners use GNOME Recipes to browse included recipes, save personal recipes,
      group them by cuisine or occasion, create shopping lists, and follow cooking steps
      at the computer. Contributors used it as a community content project because
      recipe text and photos could be improved independently of the application code.
