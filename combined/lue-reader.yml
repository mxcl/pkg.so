id: brew:lue-reader
display-name: Lue
homepage: https://github.com/superstarryeyes/lue
repo: https://github.com/superstarryeyes/lue
docs:
  - https://github.com/superstarryeyes/lue#readme
  - https://github.com/superstarryeyes/lue/blob/main/VOICES.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lue is a young project, but it had hundreds of GitHub stars by mid-2026 and
      official installation instructions for PyPI, Homebrew, Debian/Ubuntu
      prerequisites, Arch AUR, and Windows via WSL. Homebrew packages it as `lue-reader`
      while the command exposed to users is `lue`.
  package-nerd-significance:
    - >
      Lue is interesting to package maintainers because it combines terminal UI
      behavior, document parsing, audio generation, and optional TTS backends. That mix
      makes system dependencies such as FFmpeg and optional speech tooling part of the
      packaging story, not just Python metadata.
  project-history:
    - >
      The project appeared publicly on GitHub in August 2025. Its README presents Lue as
      a Python terminal reader focused on synchronized listening and reading, with Edge
      TTS as the default online voice backend and Kokoro TTS as an optional
      local/offline path.
  related-projects:
    - The README documents Edge TTS and Kokoro TTS as speech backends.
    - FFmpeg is listed as a core requirement for audio processing.
  sources:
    - https://api.github.com/repos/superstarryeyes/lue
    - https://api.github.com/repos/superstarryeyes/lue/releases
    - https://formulae.brew.sh/formula/lue-reader
    - https://github.com/superstarryeyes/lue
    - https://github.com/superstarryeyes/lue/blob/main/VOICES.md
  summary:
    - >
      Lue is a terminal ebook reader with text-to-speech, supporting formats such as
      EPUB, PDF, DOCX, HTML, RTF, TXT, and Markdown.
  timeline:
    - '2025: Public GitHub repository created.'
    - '2025: v0.1.x releases published, followed by v0.2 and v0.3 releases.'
    - '2025: v0.4.0 published in December.'
    - '2026: Homebrew formula available as `lue-reader`.'
  usage:
    - >
      The quick start tells users to install FFmpeg, install `lue-reader`, run `lue
      --guide`, and open a book path such as `lue path/to/your/book.epub`. The README
      also documents navigation modes, highlighting, TTS voice configuration, and
      customization through files in the installed Python package.
related-packages:
  - id: cask:calibre
    reason: >
      Choose calibre for a graphical library manager, editor, converter, content server,
      and broad device workflow; choose Lue for a focused terminal reader with
      synchronized text-to-speech.
    rel: alternative
    sources:
      - https://github.com/paulilaaso/lue#readme
      - https://calibre-ebook.com/about
  - id: brew:ffmpeg
    reason: >
      Lue documents FFmpeg as a required dependency for audio processing in its
      text-to-speech reading workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/paulilaaso/lue#readme
      - https://ffmpeg.org/about.html
  - id: brew:espeak
    reason: >
      Lue documents eSpeak as an optional dependency supporting its local Kokoro
      text-to-speech setup.
    rel: adjacent_workflow
    sources:
      - https://github.com/paulilaaso/lue#readme
      - https://espeak.sourceforge.net/
category: media
package-manager:
  brew: lue-reader
  nix: lue
package-manager-url: https://formulae.brew.sh/formula/lue-reader
license: GPL-3.0-only
