id: brew:kubie
display-name: kubie
homepage: https://sbstp.ca
repo: https://github.com/kubie-org/kubie
docs:
  - https://github.com/kubie-org/kubie#readme
config-file-location:
  unix: ~/.kube/kubie.yaml
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      kubie is distributed through Rust's crates.io ecosystem and through
      operating-system package managers including Homebrew, MacPorts, Nix, Arch Linux,
      Alpine, and others. That spread suggests adoption by CLI-heavy Kubernetes users
      rather than by a single vendor platform.
  package-nerd-significance:
    - >
      kubie is interesting because it packages a small but safety-relevant workflow:
      preventing accidental cross-cluster context leakage. It represents the Rust CLI
      wave in Kubernetes tooling, where a compact binary replaces shell-function
      conventions common in older kubectl helper tools.
  project-history:
    - >
      The tool grew around a specific Kubernetes operator pain point: switching contexts
      without letting one terminal session accidentally mutate another session's
      kubeconfig state. Its README emphasizes independent shells, recursive context
      sessions, split kubeconfig loading, `kubie exec`, and `kubie lint` rather than a
      large platform or daemon.
  related-projects:
    - >
      kubie is directly related to kubectl, Kubernetes kubeconfig workflows, kubectx,
      kubens, krew-style CLI extensions, and fuzzy-selector tools used in terminal
      Kubernetes operations.
  sources:
    - https://crates.io/crates/kubie
    - https://formulae.brew.sh/formula/kubie
    - https://github.com/ahmetb/kubectx
    - https://github.com/kubie-org/kubie
  summary:
    - >
      kubie is a Rust CLI for Kubernetes context and namespace switching, positioned by
      its README as a more powerful alternative to kubectx, kubens, and shell prompt
      helpers.
  timeline:
    - >
      2020s: kubie is published as a Rust package and documented as an alternative to
      kubectx and kubens.
    - >
      2020s: Package-manager coverage expands beyond Cargo to Homebrew, MacPorts, Nix,
      Arch Linux, and other distributions.
    - >
      2026: The README continues to document session-isolated context switching, split
      kubeconfig loading, and `~/.kube/kubie.yaml` configuration.
  usage:
    - >
      Users run `kubie ctx` and `kubie ns` to select contexts and namespaces, spawn
      isolated shells, execute a command across a chosen context and namespace, or lint
      Kubernetes config files. Its configuration lives at `~/.kube/kubie.yaml` and
      controls shell behavior, kubeconfig include/exclude patterns, prompt behavior, and
      interactive menu settings.
related-packages:
  - id: brew:kubectx
    reason: >
      Choose kubectx and its kubens companion for a simpler context-and-namespace
      switching workflow; choose kubie when you need shell isolation, split kubeconfigs,
      direct command execution, or kubeconfig linting.
    rel: alternative
    sources:
      - https://github.com/kubie-org/kubie
      - https://github.com/ahmetb/kubectx
category: cloud-infrastructure
package-manager:
  apk: kubie
  brew: kubie
  macports: kubie
  nix: kubie
  pacman: kubie
  zypper: kubie
package-manager-url: https://formulae.brew.sh/formula/kubie
license: Zlib
tags:
  - cli
  - context-switching
  - kubectx
  - kubens
  - kubernetes
description: Much more powerful alternative to kubectx and kubens
executables:
  - kubie
provenance:
  formula: kubie
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
