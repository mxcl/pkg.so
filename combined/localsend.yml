id: cask:localsend
display-name: LocalSend
homepage: https://localsend.org/
repo: https://github.com/localsend/localsend
docs:
  - https://github.com/localsend/localsend#readme
  - https://localsend.org/
  - https://localsend.org/download
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LocalSend expanded across Windows, macOS, Linux, Android, and iOS. The official
      site reports more than five million downloads, 70,000 GitHub stars, and over 100
      contributors.
  package-nerd-significance:
    - >
      LocalSend is notable in package-manager circles as a free, open-source,
      cross-platform AirDrop alternative distributed through Homebrew, Flatpak, Snap,
      Nix, AUR, and native release artifacts.
  project-history:
    - >
      The project was created as a local-first alternative to proprietary nearby-sharing
      systems. It uses the local network, requires no account or central server, and
      encrypts transfers over HTTPS.
  related-projects:
    - AirDrop is the proprietary workflow LocalSend explicitly positions itself against.
    - The related localsend/protocol repository documents the LocalSend REST API.
  sources:
    - https://github.com/localsend/localsend
    - https://github.com/localsend/localsend/releases
    - https://localsend.org/
    - https://localsend.org/download
    - source_facts.package-manager
  summary:
    - >
      LocalSend is an open-source application for transferring files and text between
      nearby devices without cloud storage or an Internet connection.
  timeline:
    - '2024: Version 1.15 added text-message history and additional PIN-protection options.'
    - >
      2025: Version 1.17 continued development of network filtering, sharing, and
      platform integrations.
    - '2026 input snapshot: Homebrew Cask packages LocalSend 1.18.0.'
  usage:
    - >
      Install LocalSend on the sending and receiving devices, keep them on the same
      local network, select content, and choose the discovered recipient. No account or
      login is required.
category: networking
package-manager:
  brew-cask: localsend
package-manager-url: https://formulae.brew.sh/cask/localsend
tags:
  - airdrop-alternative
  - cross-platform
  - encrypted
  - file-transfer
  - local-network
  - offline
  - open-source
description: Open-source cross-platform alternative to AirDrop
applications:
  - LocalSend.app
provenance:
  cask: localsend
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
