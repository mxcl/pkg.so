id: brew:kubectl-tree
display-name: kubectl-tree
homepage: https://github.com/ahmetb/kubectl-tree
repo: https://github.com/ahmetb/kubectl-tree
docs:
  - https://github.com/ahmetb/kubectl-tree#readme
config-file-location:
  unix: ~/.kube/config
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      kubectl-tree became one of the more recognizable third-party kubectl plugins
      because object ownership is a common Kubernetes troubleshooting question and the
      tree view is easy to understand in terminal output.
    - >
      The repository metadata observed on 2026-07-01 showed more than 3000 GitHub stars.
      Its package-manager presence in Homebrew, Nix, and zypper complements Krew
      installation and makes it available in repeatable workstation environments.
  package-nerd-significance:
    - >
      kubectl-tree is package-nerd notable because it turns a native Kubernetes metadata
      field into a Unix-friendly visualization. It is small, script-adjacent,
      installable as a kubectl plugin, and expressive enough to become part of many
      operators' ad hoc debugging toolbox.
  project-history:
    - >
      The GitHub repository was created on 2019-12-23 by Ahmet Alp Balkan. Its README
      says the tool explores ownership relationships through Kubernetes
      `ownerReferences` and acknowledges inspiration from knative-inspect, generalized
      beyond a single ecosystem.
    - >
      Later releases added filters for namespaces, selectors, condition types, API
      groups, and resources, reflecting its evolution from a tree visualizer into a
      practical inspection tool for larger clusters.
  related-projects:
    - >
      Related projects include kubectl, Krew, Kubernetes ownerReferences,
      knative-inspect, and kube-lineage. The README contrasts kube-lineage as a similar
      plugin that can understand some logical relationships even without
      ownerReferences.
  sources:
    - https://api.github.com/repos/ahmetb/kubectl-tree
    - https://github.com/ahmetb/kubectl-tree
    - https://github.com/ahmetb/kubectl-tree#readme
    - https://github.com/tohjustin/kube-lineage
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/owners-dependents/
    - https://kubernetes.io/docs/tasks/extend-kubectl/kubectl-plugins/
  summary:
    - >
      kubectl-tree is a kubectl plugin for browsing Kubernetes object ownership as a
      tree. It follows `ownerReferences` between objects, letting users see how
      resources such as Deployments, ReplicaSets, Pods, Knative Services, or other
      controllers relate at runtime.
  timeline:
    - '2019-12-23: GitHub repository created.'
    - '2025-11-15: Release v0.4.6 published.'
    - '2026-03-20: Release v0.5.0 published.'
    - '2026-03-24: Release v0.6.0 published.'
  usage:
    - >
      Users install it as a kubectl plugin and run commands such as `kubectl tree` with
      namespace, selector, API group, and resource filters. The README warns that
      filtering out intermediate owner resources can stop traversal and hide
      descendants, which is a useful operational detail for large clusters.
    - >
      The package is commonly useful when answering why an object exists, what
      controller owns it, or how custom resources fan out into lower-level Kubernetes
      objects.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubectl supplies the cluster context and plugin invocation mechanism used by
      kubectl-tree, making it the required companion for ownership-tree inspection.
    rel: adjacent_workflow
    sources:
      - https://github.com/ahmetb/kubectl-tree#readme
      - https://kubernetes.io/docs/tasks/extend-kubectl/kubectl-plugins/
category: developer-tools
package-manager:
  brew: kubectl-tree
  nix: kubectl-tree
  zypper: kubectl-tree
package-manager-url: https://formulae.brew.sh/formula/kubectl-tree
license: Apache-2.0
tags:
  - cli
  - kubectl
  - kubectl-plugin
  - kubernetes
  - object-hierarchy
  - tree-view
description: Kubectl plugin to browse Kubernetes object hierarchies as a tree
executables:
  - kubectl-tree
provenance:
  formula: kubectl-tree
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
