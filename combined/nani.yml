history:
  adoption-history:
    - >
      Nani is available in modern browsers and as a desktop application for Apple
      Silicon Macs and Windows. The desktop application adds global selected-text,
      proofreading, and screenshot workflows.
    - >
      A free plan lowers the entry barrier, while paid and Team plans add higher limits,
      advanced models, screenshot translation, voice playback, centralized billing, and
      team usage visibility.
  package-nerd-significance:
    - >
      Nani represents a newer class of desktop language utility that combines
      translation, proofreading, explanations, summaries, and reply composition behind
      system-wide shortcuts rather than operating only as a traditional dictionary.
    - >
      Its local translation-history storage and explicit disclosure of the external AI
      services that process requests are useful distinctions for users evaluating
      packaged AI desktop applications.
  project-history:
    - >
      Kioku LLC develops and operates Nani Translate as an AI-assisted translation and
      writing product. The official product surface spans a web application and native
      desktop clients.
    - >
      The product expanded beyond direct translation to include proofreading,
      context-sensitive alternatives, explanations, summaries, multilingual replies,
      image and screenshot translation, and voice playback.
  related-projects:
    - >
      Nani sends translation requests to selected services operated by Google, OpenAI,
      or xAI while retaining translation history on the user's device.
  sources:
    - https://nani.now/en/download
    - https://nani.now/en/help
    - https://nani.now/en/security
  summary:
    - >
      Nani Translate is an AI-assisted translation, proofreading, and multilingual
      writing application operated by Kioku LLC.
  timeline:
    - >
      Current product era: Nani is offered through the web and native macOS and Windows
      applications with free, Pro, and Team usage models.
  usage:
    - >
      Users can enter text directly or use the desktop shortcut to translate or
      proofread selected text in another application.
    - >
      The desktop client stores translation history locally and can translate
      screenshots on eligible plans. Its URL scheme can also start a translation from
      another application or automation tool.
related-packages:
  - id: cask:easydict
    reason: >
      Choose Easydict for an open-source, macOS-only translator with multiple selectable
      providers, local dictionaries, OCR, and user-configured services; choose Nani for
      its simpler hosted AI translation and proofreading experience.
    rel: alternative
    sources:
      - https://nani.now/en/help
      - https://github.com/tisfeng/Easydict/blob/dev/docs/user-docs/en/GUIDE.md
