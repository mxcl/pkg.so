history:
  adoption-history:
    - >
      ForkLift has remained part of the independent Mac-software ecosystem across
      multiple major generations. Its combination of Finder replacement, remote-transfer
      client, folder synchronizer, and power-user utilities has made it useful to
      developers, administrators, and users managing files across local and hosted
      systems.
  package-nerd-significance:
    - >
      ForkLift packages a broad set of traditionally separate command-line and graphical
      workflows—local file management, FTP-family transfers, cloud access,
      synchronization, archive browsing, Git status, remote editing, and terminal
      handoff—into one native dual-pane Mac application.
    - >
      Its Homebrew cask makes a commercial Finder replacement reproducibly installable,
      while saved remote credentials remain protected by the macOS Keychain rather than
      a documented plaintext credentials file.
  project-history:
    - >
      BinaryNights first released ForkLift in 2007 as a Mac file-transfer application
      with multi-threaded transfers. Later generations expanded it into a general
      dual-pane file manager and Finder replacement.
    - >
      ForkLift 4 combines local file operations with SFTP, FTP, WebDAV, Amazon S3,
      Backblaze B2, major cloud-storage services, network filesystems, synchronization,
      workspaces, remote editing, Git awareness, and command-line-tool integration.
  related-projects:
    - >
      ForkLift overlaps with dedicated transfer clients such as Transmit and Cyberduck
      while retaining a broader Finder-replacement role. It can also invoke external
      comparison applications such as Kaleidoscope for selected files.
  sources:
    - https://binarynights.com/
    - https://binarynights.com/manual
    - https://blog.binarynights.com/2018/08/17/best-ftp-clients-compared-speed-test/
  summary:
    - >
      ForkLift is a commercial dual-pane macOS file manager, Finder replacement,
      remote-transfer client, and folder-synchronization tool.
  timeline:
    - '2007: ForkLift first appeared with multi-threaded file-transfer support.'
    - >
      2020s: ForkLift 4 broadened the dual-pane client with modern cloud,
      synchronization, workspace, and remote-editing workflows.
  usage:
    - >
      Users browse and manipulate local or remote files in two panes, connect to server
      and cloud protocols, synchronize directory trees, edit remote files, manage
      archives, and save frequently used connections as favorites.
    - >
      ForkLift can synchronize favorites through iCloud. Remote passwords and refresh
      tokens may be stored in the macOS Keychain; private SSH keys remain at
      user-selected paths. No official fixed configuration-file path was verified.
related-packages:
  - id: cask:transmit
    reason: >
      Choose Transmit when the main requirement is a focused, polished Mac transfer
      client with extensive protocol and cloud documentation; choose ForkLift when local
      Finder replacement and dual-pane file management are equally important.
    rel: alternative
    sources:
      - https://binarynights.com/
      - https://panic.com/transmit/
      - https://help.panic.com/transmit/
  - id: cask:cyberduck
    reason: >
      Choose Cyberduck when you need an open-source, cross-platform browser for servers
      and cloud storage; ForkLift provides a more Mac-specific dual-pane
      Finder-replacement workflow.
    rel: alternative
    sources:
      - https://binarynights.com/
      - https://cyberduck.io/
      - https://docs.cyberduck.io/cyberduck/
  - id: cask:kaleidoscope
    reason: >
      ForkLift can hand selected text or image files to Kaleidoscope for visual
      comparison, making it a documented companion to ForkLift's file-management
      workflow.
    rel: adjacent_workflow
    sources:
      - https://binarynights.com/
      - https://kaleidoscope.app/
