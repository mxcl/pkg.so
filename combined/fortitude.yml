id: brew:fortitude
display-name: Fortitude
homepage: https://fortitude.readthedocs.io/en/stable/
repo: https://github.com/PlasmaFAIR/fortitude
docs:
  - https://fortitude.readthedocs.io/en/latest/linter
  - https://fortitude.readthedocs.io/en/stable
config-file-location:
  unix:
    - fortitude.toml
    - .fortitude.toml
    - fpm.toml
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Fortitude's README names open-source Fortran projects using it, including ADCIRC,
      CP2K, flexi, FTorch, MESA, OpenFMS, and a Met Office Fortran lint workflow. That
      adoption list positions it as a newer but already visible static-analysis tool in
      the scientific Fortran ecosystem.
  package-nerd-significance:
    - >
      Fortitude matters because it brings the Ruff-style fast-linter packaging model to
      Fortran: Rust implementation, Python-distributed command, standalone installers,
      pre-commit hooks, editor support, and CI-friendly output formats. It is a modern
      packaging story applied to a language ecosystem with a long scientific-code tail.
  project-history:
    - >
      The repository was created in January 2024 and the first public release, 0.1.0,
      was published in September 2024. The README states that Fortitude is built upon
      Ruff ideas and code, and developed by PlasmaFAIR to improve sustainability of
      plasma-science research software.
    - >
      From 0.7.0 onward, the README documents standalone installers in addition to PyPI
      and Rust-source installation. The 0.9.0 release was published in May 2026.
  related-projects:
    - >
      Fortitude is explicitly inspired by Ruff and uses parts from Ruff under the MIT
      license. It also relates to tree-sitter, Fortran Package Manager configuration,
      fortitude-pre-commit, and Fortran-lang best-practice material.
  sources:
    - https://api.github.com/repos/PlasmaFAIR/fortitude
    - https://api.github.com/repos/PlasmaFAIR/fortitude/releases?per_page=20
    - https://fortitude.readthedocs.io/en/stable/
    - https://fortitude.readthedocs.io/en/stable/configuration/
    - https://github.com/PlasmaFAIR/fortitude
    - https://raw.githubusercontent.com/PlasmaFAIR/fortitude/main/README.md
  summary:
    - >
      Fortitude is a fast Fortran linter developed by PlasmaFAIR, written in Rust,
      installable through Python packaging, and inspired by Ruff. It combines
      tree-sitter-based parsing, over 100 lint rules, automatic fixes, multiple output
      formats, and editor integration through the Language Server Protocol.
  timeline:
    - '2024: GitHub repository created.'
    - '2024: 0.1.0 initial release published.'
    - '2025: 0.7.0 introduced documented standalone installers.'
    - '2026: 0.9.0 release published.'
  usage:
    - >
      Users typically run fortitude check over a working tree or selected files, choose
      rules with select and ignore options, enable preview rules, request automatic
      fixes with --fix, and inspect rule explanations with fortitude explain.
      Configuration can live in fortitude.toml, .fortitude.toml, fpm.toml under
      extra.fortitude, or pyproject.toml under tool.fortitude.
related-packages:
  - id: brew:fortls
    reason: >
      Use fortls alongside Fortitude in an LSP-capable editor: Fortitude supplies lint
      diagnostics and fixes, while fortls provides Fortran navigation, completion, hover
      information, and symbol features.
    rel: adjacent_workflow
    sources:
      - https://fortitude.readthedocs.io/en/stable/editors/
      - https://fortls.fortran-lang.org/
  - id: brew:fpm
    reason: >
      Fortitude can read its lint settings from the extra.fortitude table in an fpm.toml
      manifest, letting Fortran Package Manager projects keep build metadata and lint
      configuration in the same project file.
    rel: adjacent_workflow
    sources:
      - https://fortitude.readthedocs.io/en/stable/configuration/
      - https://fpm.fortran-lang.org/
category: developer-tools
package-manager:
  brew: fortitude
  nix: fortitude
package-manager-url: https://formulae.brew.sh/formula/fortitude
license: MIT
tags:
  - cli
  - fortran
  - linter
  - ruff-inspired
  - static-analysis
description: Fortran linter
executables:
  - fortitude
provenance:
  formula: fortitude
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
