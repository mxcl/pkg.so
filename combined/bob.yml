id: brew:bob
display-name: Bob
homepage: https://github.com/MordechaiHadad/bob
repo: https://github.com/MordechaiHadad/bob
docs:
  - https://github.com/MordechaiHadad/bob#readme
config-file-location:
  linux:
    - /home/user/.config/bob/config.json
    - /home/user/.config/bob/config.toml
  macos:
    - /Users/user/Library/Application Support/bob/config.json
    - /Users/user/Library/Application Support/bob/config.toml
  windows:
    - C:\Users\user\AppData\Roaming\bob\config.json
    - C:\Users\user\AppData\Roaming\bob\config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Bob's adoption is mostly within Neovim power-user and plugin-development circles,
      where testing multiple Neovim versions is routine. The input package facts list
      Homebrew, Arch/pacman, and Scoop packaging, showing it crossed from cargo-based
      installation into mainstream system package channels.
  package-nerd-significance:
    - >
      Bob is package-nerd interesting because it treats a fast-moving editor as a
      versioned runtime, much like language version managers do for Node, Ruby, or
      Python. It also sits at the intersection of Rust CLI distribution, Neovim nightly
      culture, and cross-platform binary management.
  project-history:
    - >
      The project presents itself as a cross-platform Neovim version manager and
      distributes install scripts, release archives, nightly builds, pacman packaging,
      and a crates.io install path from its official README. Its notices show an
      actively maintained tool that has changed implementation details over time,
      including macOS storage changes in 2022, a proxy executable migration in 2023,
      improved Apple Silicon support in 2024, and OpenSSL build deprecation in 2025.
  related-projects:
    - >
      Related projects include Neovim itself, rustup-style version managers, and
      editor/runtime switchers used by developers who test against nightly and released
      toolchains.
  sources:
    - https://github.com/MordechaiHadad/bob#readme
    - input.source_facts.package-manager
  summary:
    - >
      Bob is a Rust command-line version manager for Neovim, aimed at users who want to
      install, switch, run, and remove stable, nightly, versioned, or commit-specific
      Neovim builds from one tool.
  timeline:
    - >
      2022: Official notice moves Bob's macOS symbolic link and downloads folder away
      from Application Support.
    - '2023: Bob switches to a proxy executable model for running Neovim executables.'
    - >
      2024: Bob adds complete ARM support for recent macOS Neovim binary changes and
      later deprecates nvim-qt support.
    - '2025: OpenSSL builds are deprecated in favor of standard Bob builds.'
  usage:
    - >
      Common usage is `bob install`, `bob use`, and `bob run` for stable, nightly,
      latest, explicit versions, or commit hashes. The tool also supports rollback,
      erase, list, sync, and source builds of Neovim.
related-packages:
  - id: brew:neovim
    reason: >
      Neovim is the editor runtime that Bob downloads, selects, and launches, so it is
      the central companion package in Bob's workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/MordechaiHadad/bob#readme
      - https://neovim.io/
  - id: brew:topgrade
    reason: >
      Topgrade officially detects Bob and can update Bob-managed Neovim installations as
      part of its multi-tool system-upgrade workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/MordechaiHadad/bob#integrations
      - https://github.com/topgrade-rs/topgrade#readme
category: developer-tools
package-manager:
  brew: bob
  pacman: bob
  scoop: main/bob
package-manager-url: https://formulae.brew.sh/formula/bob
license: MIT
tags:
  - cli
  - neovim
  - rust
  - version-manager
description: Version manager for neovim
executables:
  - bob
provenance:
  formula: bob
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
