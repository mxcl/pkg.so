id: brew:distrobox
display-name: distrobox
homepage: https://distrobox.privatedns.org/
repo: https://github.com/89luca89/distrobox
docs:
  - https://distrobox.it/
  - https://github.com/89luca89/distrobox#readme
config-file-location:
  unix: ./distrobox.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Official docs include packaging-status badges and a featured-articles section that
      points to use on Fedora Atomic desktops, SteamOS, Clear Linux, and other host
      distributions. The 2026 Distrobox Next announcement says the project had received
      contributions from more than 200 developers, which marks a substantial community
      for a system CLI.
  package-nerd-significance:
    - >
      distrobox is important to package-manager users because it loosens the bond
      between host distribution and package availability. A user can keep a stable or
      immutable host while installing development stacks from Arch, Fedora, Debian,
      Ubuntu, or another containerized userland.
  project-history:
    - >
      The project was created in late 2021 and released 1.0.0 in December 2021. Its
      documentation describes the original implementation as shell-oriented and based on
      the same broad ideas introduced by containers/toolbox, while keeping host
      integration and wide distribution compatibility as central goals.
  related-projects:
    - containers/toolbox is the closest conceptual predecessor named by the official docs.
    - Podman, Docker, and lilipod are supported container managers used underneath Distrobox.
  sources:
    - https://distrobox.it/
    - https://distrobox.it/usage/distrobox-assemble/
    - https://distrobox.it/posts/announcing_distrobox_next/
    - https://api.github.com/repos/89luca89/distrobox
    - https://api.github.com/repos/89luca89/distrobox/releases?per_page=100
  summary:
    - >
      distrobox is a container-based system utility for running one Linux distribution's
      userland inside another while keeping terminal, home directory, GUI, audio,
      devices, and host integration close at hand. It became especially relevant as
      immutable and image-based Linux desktops made mutable development environments
      more valuable.
  timeline:
    - '2021: GitHub repository created.'
    - '2021: Distrobox 1.0.0 released.'
    - >
      2022: Distrobox appears in talks and articles for immutable-desktop and
      multi-distro workflows.
    - '2026: Distrobox Next release candidates introduce a Go rewrite for the v2 line.'
  usage:
    - >
      Users create and enter named distroboxes with subcommands such as distrobox-create
      and distrobox-enter, export applications back to the host, and use
      distrobox-assemble with a distrobox.ini manifest for batch container creation. The
      tool wraps Podman, Docker, or lilipod rather than being a container runtime
      itself.
related-packages:
  - id: brew:podman
    reason: >
      Podman is a supported container manager underneath Distrobox and is the natural
      companion for daemonless and rootless Linux container workflows.
    rel: adjacent_workflow
    sources:
      - https://distrobox.it/
      - https://podman.io/docs
  - id: brew:docker
    reason: >
      Docker is another officially supported Distrobox backend and is useful when the
      host already uses Docker’s container engine and CLI workflow.
    rel: adjacent_workflow
    sources:
      - https://distrobox.it/
      - https://docs.docker.com/get-started/docker-overview/
category: system
package-manager:
  apk: distrobox
  brew: distrobox
  debian: distrobox
  dnf: distrobox
  nix: distrobox
  pacman: distrobox
  ubuntu: distrobox
  zypper: distrobox
package-manager-url: https://formulae.brew.sh/formula/distrobox
license: GPL-3.0-only
tags:
  - cli
  - containers
  - docker
  - linux-distributions
  - podman
description: Use any Linux distribution inside your terminal
executables:
  - distrobox
  - distrobox-assemble
  - distrobox-create
  - distrobox-enter
  - distrobox-ephemeral
  - distrobox-export
  - distrobox-generate-entry
  - distrobox-host-exec
  - distrobox-init
  - distrobox-list
  - distrobox-rm
  - distrobox-stop
  - distrobox-upgrade
provenance:
  formula: distrobox
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
