id: brew:ktlint
display-name: ktlint
homepage: https://ktlint.github.io/
repo: https://github.com/ktlint/ktlint
docs:
  - https://pinterest.github.io/ktlint/latest
config-file-location:
  unix:
    - .editorconfig
    - ktlint-baseline.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      ktlint gained adoption by combining a CLI jar, Maven/Gradle integrations,
      reporters, custom rule sets, .editorconfig support, and package-manager
      distribution. Its docs emphasize no-configuration defaults, Kotlin coding
      conventions, Android Kotlin Style Guide alignment, and extensibility for
      organizations that need custom checks.
  package-nerd-significance:
    - >
      ktlint is significant because it became the Kotlin ecosystem's canonical packaged
      linter/formatter pair: one executable jar, common default rules, multiple
      reporters, custom rulesets, and enough integration points to make style
      enforcement portable across editors, CI, and package managers.
  project-history:
    - >
      The documentation copyright trail records Stanley Shyiko's original 2016-2019
      authorship and Pinterest's 2019 stewardship. The repository later moved from the
      pinterest namespace to the ktlint organization on GitHub, while the Homebrew
      package still records the historical pinterest/ktlint repository URL.
  related-projects:
    - >
      Related projects include Kotlin coding conventions, Android Kotlin Style Guide,
      gofmt, JavaScript Standard Style, ktfmt, Gradle, Maven, and .editorconfig.
  sources:
    - https://github.com/ktlint/ktlint
    - https://github.com/ktlint/ktlint/releases
    - https://github.com/pinterest/ktlint/tags
    - https://pinterest.github.io/ktlint/latest/
  summary:
    - >
      ktlint is an anti-bikeshedding Kotlin linter with a built-in formatter. Its docs
      describe it as a Kotlin linter in the spirit of JavaScript Standard Style and
      gofmt: low setup, conventional defaults, and automatic formatting when possible.
  timeline:
    - "2016: The docs copyright trail begins Stanley Shyiko's authorship period."
    - '2019: Pinterest stewardship appears in the docs copyright trail.'
    - '2024-12-04: Tag 1.5.0 was published in the GitHub tag history.'
    - '2025-11-14: Release 1.8.0 was published on GitHub.'
  usage:
    - >
      Users run ktlint to scan .kt and .kts files, optionally with --format or -F to
      autocorrect violations. Teams commonly add it to build pipelines, pre-commit
      hooks, editor workflows, or Gradle/Maven tasks, with .editorconfig and baseline
      files used when defaults need project-level adjustment.
related-packages:
  - id: brew:ktfmt
    reason: >
      Choose ktfmt when deterministic, minimally configurable Kotlin formatting is more
      important than ktlint's lint rules, reporters, baselines, and custom-rule
      extension model.
    rel: alternative
    sources:
      - https://github.com/Kotlin/ktfmt#ktfmt-vs-ktlint-vs-intellij
      - https://ktlint.github.io/ktlint/latest/
  - id: brew:detekt
    reason: >
      detekt complements ktlint with broader Kotlin static analysis and officially
      provides a ktlint wrapper so formatting rules can participate in one detekt
      quality gate.
    rel: adjacent_workflow
    sources:
      - https://detekt.dev/extensions.html/
      - https://detekt.dev/docs/rules/ktlint/
      - https://ktlint.github.io/ktlint/latest/
category: developer-tools
package-manager:
  brew: ktlint
  macports: ktlint
  nix: ktlint
  pacman: ktlint
  scoop: main/ktlint
package-manager-url: https://formulae.brew.sh/formula/ktlint
license: MIT
tags:
  - cli
  - formatter
  - kotlin
  - linter
  - static-analysis
description: Anti-bikeshedding Kotlin linter with built-in formatter
executables:
  - ktlint
provenance:
  formula: ktlint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
