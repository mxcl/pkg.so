id: brew:imagemagick-full
display-name: ImageMagick Full
homepage: https://imagemagick.org
repo: https://github.com/ImageMagick/ImageMagick
docs:
  - https://imagemagick.org/
  - https://imagemagick.org/command-line-tools
  - https://imagemagick.org/resources
  - https://imagemagick.org/security-policy
config-file-location:
  unix:
    - $MAGICK_CONFIGURE_PATH
    - $PREFIX/etc/ImageMagick-7
    - $PREFIX/share/ImageMagick-7
    - $XDG_CACHE_HOME/ImageMagick
    - ~/.config/ImageMagick
    - <client path>/etc/ImageMagick
  windows:
    - $MAGICK_CONFIGURE_PATH
    - <windows registry>
    - $PREFIX/config
    - $USERPROFILE/.config/ImageMagick
    - <client path>
credentials-file-location: null
history:
  adoption-history:
    - >
      ImageMagick became a standard Unix packaging fixture because it offers scriptable
      image conversion and manipulation without a GUI. The full Homebrew variant serves
      users who prefer the wider build surface, while the main formula serves the
      default Homebrew path.
  package-nerd-significance:
    - >
      The formula is package-nerd-significant because it shows how a large C imaging
      suite is sliced by package managers: the same upstream project can appear as a
      default build, a fuller build, and a legacy major-version build. That distinction
      matters for reproducibility, delegate availability, and image pipelines that
      depend on specific coders.
  project-history:
    - >
      ImageMagick began at DuPont after John Cristy was asked to display
      computer-generated 24-bit images on hardware limited to 256 colors. The official
      history says Usenet help shaped the early tools, DuPont transferred copyright to
      ImageMagick Studio LLC, and ImageMagick was posted to comp.archives on August 1,
      1990.
    - >
      Through the mid-1990s, ImageMagick grew through user requests, bug reports, and
      contributions, culminating in version 4.2.9. Version 5 followed Bob Friesenhahn's
      push to improve APIs and scripting access, while Magick++ and module loading
      helped make ImageMagick useful beyond one-off command invocations.
    - >
      Version 6 emerged from Anthony Thyssen's work on clearer command-line handling for
      multiple images. Version 7 reworked internals around arbitrary colorspaces,
      arbitrary pixel channels, floating-point channel storage, and reduced rounding
      error.
  related-projects:
    - >
      Related projects include Magick++, Magick.NET, Fred's ImageMagick Scripts, Anthony
      Thyssen's ImageMagick Usage examples, and the ImageMagick 6 legacy branch. The
      Homebrew sibling formulas are imagemagick and imagemagick@6.
  sources:
    - >
      Official ImageMagick history page, ImageMagick README, resources documentation,
      GitHub repository metadata, and Homebrew formula metadata.
  summary:
    - >
      imagemagick-full is the Homebrew formula variant for the ImageMagick 7 toolchain
      with broader format support than the default formula. Its history is therefore the
      ImageMagick history plus a package-manager distinction: a fuller build of the same
      command-line suite for users who want more delegates and capabilities available
      from Homebrew.
  timeline:
    - '1987: John Cristy starts the tool work at DuPont around 24-bit to 8-bit image display.'
    - "1990: ImageMagick is posted to Usenet's comp.archives group."
    - 'Mid-1990s: ImageMagick 4.2.9 represents the early mature public toolset.'
    - >
      Version 5: API work, Magick++, module loading, automatic file identification, and
      tests reshape the project.
    - 'Version 6: Command-line semantics are redesigned around clearer multi-image processing.'
    - >
      Version 7: The design is updated for arbitrary colorspaces, arbitrary channel
      counts, and floating-point pixel channels.
  usage:
    - >
      Users install imagemagick-full when they want ImageMagick's CLI commands and
      libraries with more format/delegate coverage from Homebrew. The upstream docs
      cover command-line tools such as magick, convert, identify, mogrify, montage,
      composite, compare, and stream, and the resources page documents configuration
      search paths and policy files.
related-packages:
  - id: brew:imagemagick
    reason: >
      Choose Homebrew's standard ImageMagick formula when the default delegate set is
      sufficient and the expanded full build is unnecessary.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/imagemagick
      - https://formulae.brew.sh/formula/imagemagick-full
      - https://imagemagick.org/
  - id: brew:graphicsmagick
    reason: >
      Choose GraphicsMagick when stable legacy-compatible interfaces, a smaller
      dependency footprint, and the unified gm command matter more than ImageMagick's
      newer feature set.
    rel: alternative
    sources:
      - https://graphicsmagick.sourceforge.io/FAQ.html
      - https://graphicsmagick.sourceforge.io/GraphicsMagick.html
category: media
