id: brew:fb-client
display-name: fb-client
homepage: https://paste.xinu.at
repo: https://github.com/Bluewind/fb
docs:
  - https://github.com/Bluewind/fb/blob/master/fb.1
config-file-location:
  unix: $XDG_CONFIG_HOME/fb-client/config
credentials-file-location:
  unix: $XDG_CONFIG_HOME/fb-client/apikey
history:
  adoption-history:
    - >
      The input package metadata shows fb-client is distributed through Homebrew and
      Arch/pacman, which fits its role as a small Unix-style upload utility.
  package-nerd-significance:
    - >
      fb-client is notable as a tiny, package-manager-friendly pastebin/upload client:
      it exposes one terminal command, uses XDG-style configuration, and integrates
      naturally into shell pipelines.
  project-history:
    - >
      The official GitHub repository for Bluewind/fb was created in 2016 and hosts the
      shell-script client and its manual page. Its purpose is narrow: upload text or
      files to paste.xinu.at from a terminal.
  related-projects:
    - paste.xinu.at is the hosted service targeted by the client.
  sources:
    - Official GitHub repository metadata for Bluewind/fb.
    - Official fb.1 manual page.
    - input.source_facts.package-manager
  summary:
    - >
      fb-client is the command-line client for paste.xinu.at, packaged as the `fb`
      executable and documented by the upstream `fb.1` manual page.
  timeline:
    - '2016: Official GitHub repository created.'
    - '2026: Repository metadata shows continued maintenance activity.'
  usage:
    - >
      Package users normally install the `fb` executable and configure optional defaults
      and API credentials under `$XDG_CONFIG_HOME/fb-client` as documented in the
      upstream manpage.
related-packages:
  - id: brew:wgetpaste
    reason: >
      Choose wgetpaste when you want a shell paste client that can select among multiple
      paste services; choose fb-client for paste.xinu.at-specific upload, download,
      deletion, multipaste, and API-key workflows.
    rel: alternative
    sources:
      - https://github.com/Bluewind/fb/blob/master/fb.1
      - https://github.com/zlin/wgetpaste/blob/master/wgetpaste
category: productivity
package-manager:
  brew: fb-client
  pacman: fb-client
package-manager-url: https://formulae.brew.sh/formula/fb-client
license: GPL-3.0-only
tags:
  - cli
  - file-sharing
  - pastebin
  - shell
  - upload-client
  - xdg-config
description: Shell-script client for
executables:
  - fb
provenance:
  formula: fb-client
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
