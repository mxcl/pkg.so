id: brew:k2tf
display-name: k2tf
homepage: https://github.com/sl1pm4t/k2tf
repo: https://github.com/sl1pm4t/k2tf
docs:
  - https://github.com/sl1pm4t/k2tf#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      k2tf fits teams that already have Kubernetes manifests but want Terraform-managed
      resources. Its adoption is niche because the need is specific, but package-manager
      presence in Homebrew, MacPorts, Nix, and Scoop shows enough CLI demand to keep it
      distributed.
  package-nerd-significance:
    - >
      k2tf is a small but very package-nerdy bridge tool: it exists because two
      declarative ecosystems, Kubernetes YAML and Terraform HCL, overlap without sharing
      a native file format.
  project-history:
    - >
      The project started publishing releases in February 2019. Its README defines a
      narrow purpose: convert Kubernetes YAML into Terraform configuration rather than
      manage clusters or replace Terraform itself.
  related-projects:
    - >
      k2tf is related to the Terraform Kubernetes provider, Kubernetes manifests, and
      sibling conversion tools such as tfk8s.
  sources:
    - https://github.com/jrhouston/tfk8s
    - https://github.com/sl1pm4t/k2tf
    - https://github.com/sl1pm4t/k2tf/releases/tag/v0.1.0
    - https://github.com/sl1pm4t/k2tf/releases/tag/v0.6.0
    - https://registry.terraform.io/providers/hashicorp/kubernetes/latest/docs
  summary:
    - >
      k2tf is a focused converter that turns Kubernetes API objects written as YAML into
      Terraform HCL suitable for the Terraform Kubernetes provider.
  timeline:
    - '2019: k2tf v0.1.0 was released in February.'
    - >
      2021: v0.6.0 updated the Terraform Kubernetes provider dependency and noted
      Homebrew core migration documentation.
    - '2024: v0.8.0 was published.'
  usage:
    - >
      Users feed Kubernetes YAML files or directories to `k2tf` and receive `.tf` output
      compatible with the Terraform Kubernetes provider. It is most useful during
      migrations from manifest-based workflows to Terraform-managed Kubernetes
      resources.
related-packages:
  - id: brew:tfk8s
    reason: >
      tfk8s is an alternative Kubernetes-YAML-to-Terraform-HCL converter with documented
      stdin, kubectl, Helm, recursive-directory, and map-only workflows.
    rel: alternative
    sources:
      - https://github.com/sl1pm4t/k2tf
      - https://github.com/jrhouston/tfk8s
category: developer-tools
package-manager:
  brew: k2tf
  macports: k2tf
  nix: k2tf
  scoop: main/k2tf
package-manager-url: https://formulae.brew.sh/formula/k2tf
license: MPL-2.0
tags:
  - cli
  - converter
  - hcl
  - kubernetes
  - terraform
  - yaml
description: Kubernetes YAML to Terraform HCL converter
executables:
  - k2tf
provenance:
  formula: k2tf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
