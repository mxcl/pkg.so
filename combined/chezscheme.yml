id: brew:chezscheme
display-name: Chez Scheme
homepage: https://cisco.github.io/ChezScheme/
repo: https://github.com/cisco/ChezScheme
docs:
  - https://cisco.github.io/ChezScheme
  - https://cisco.github.io/ChezScheme/csug10.4
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Chez Scheme has long mattered to Scheme implementers because it is a serious
      optimizing compiler rather than only an interpreter. In package-manager catalogs
      it gives users a high-performance Scheme system through normal install flows.
    - >
      The input package metadata lists Homebrew, Debian/Ubuntu, Nix, Scoop, winget, and
      openSUSE packages. Homebrew reported 1,813 trailing-365-day installs at research
      time.
  package-nerd-significance:
    - >
      Chez Scheme is package-nerd-significant because it brings a historically important
      optimizing Scheme compiler into ordinary OS package managers, where it can be
      installed beside lighter interpreters.
    - >
      Its package also exposes the distinction between language runtimes that are
      research-grade compilers and ones that are small embeddable interpreters, a useful
      axis in Scheme packaging.
  project-history:
    - >
      The official project page describes Chez Scheme as both a programming language and
      an implementation, with supporting tools and documentation. It emphasizes
      compilation by default, on-the-fly compilation from source, whole-program
      compilation, garbage collection, profiling, debugging, and an interactive shell.
    - >
      The Cisco-hosted project page separates current source, current release,
      open-source releases, and legacy releases, reflecting the project's long
      pre-GitHub history and later open-source maintenance.
  related-projects:
    - >
      Petite Chez Scheme is distributed with Chez Scheme and appears as the `petite`
      executable in the package metadata.
    - >
      The official project page connects Chez Scheme documentation with The Scheme
      Programming Language and the Chez Scheme User's Guide.
  sources:
    - https://cisco.github.io/ChezScheme/
    - https://github.com/cisco/ChezScheme#readme
    - https://cisco.github.io/ChezScheme/release_notes/v9.4/release_notes.html
    - https://github.com/cisco/ChezScheme/releases/tag/v10.4.1
    - https://formulae.brew.sh/api/formula/chezscheme.json
  summary:
    - >
      Chez Scheme is a Scheme implementation with an optimizing native-code compiler,
      runtime system, interactive environment, and extensive documentation for
      R6RS-oriented Scheme programming.
  timeline:
    - >
      2017: Chez Scheme 9.4.1 release notes documented supported platforms and changes
      after version 8.4.
    - '2026: Chez Scheme 10.4.1 released, with Homebrew tracking 10.4.1.'
  usage:
    - >
      The Homebrew formula installs `chez`, `petite`, and `scheme-script`, covering the
      full Chez Scheme system, Petite Chez Scheme, and script execution workflows.
    - >
      Users install it as a Scheme compiler/runtime, an interactive environment, or a
      dependency for Scheme research and language implementation work.
related-packages:
  - id: brew:racket
    reason: >
      Choose Racket for its batteries-included language platform and tooling; its
      default Racket CS implementation uses Chez Scheme as its core compiler and
      runtime.
    rel: alternative
    sources:
      - https://racket-lang.org/
      - https://docs.racket-lang.org/reference/implementations.html
  - id: brew:chicken
    reason: >
      Choose CHICKEN when portable Scheme-to-C compilation and its Eggs extension
      ecosystem are more important than Chez Scheme's optimizing native-code compiler.
    rel: alternative
    sources:
      - https://www.call-cc.org/
      - https://cisco.github.io/ChezScheme/
  - id: brew:chibi-scheme
    reason: >
      Choose Chibi-Scheme for a small embeddable R7RS runtime with no external
      dependencies, rather than Chez Scheme's larger optimizing compiler environment.
    rel: alternative
    sources:
      - https://synthcode.com/scheme/chibi/
      - https://cisco.github.io/ChezScheme/
category: language-runtime
package-manager:
  brew: chezscheme
  debian: chezscheme
  nix: chez
  scoop: main/chezscheme
  ubuntu: chezscheme
  winget: Cisco.ChezScheme
  zypper: chezscheme
package-manager-url: https://formulae.brew.sh/formula/chezscheme
license: Apache-2.0
tags:
  - cli
  - compiler
  - programming-language
  - runtime
  - scheme
description: Implementation of the Chez Scheme language
executables:
  - chez
  - petite
  - scheme-script
provenance:
  formula: chezscheme
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
