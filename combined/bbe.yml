id: brew:bbe
display-name: bbe
homepage: https://sourceforge.net/projects/bbe-/
repo: null
docs:
  - https://bbe-.sourceforge.net/
  - https://bbe-.sourceforge.net/bbe.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official news page records Debian acceptance on 2005-11-06. The supplied
      package-manager facts show continuing availability in Homebrew, Debian, MacPorts,
      Nix, Ubuntu, and zypper.
  package-nerd-significance:
    - >
      Package nerds care about bbe because it occupies a tidy old Unix niche: a tiny
      single-purpose filter that brings sed's scripting style to binary streams. Its
      Debian-era adoption and survival in multiple package managers make it a good
      example of small C utilities that remain useful long after active upstream
      development slows.
  project-history:
    - >
      Timo Savinen published the first bbe release, version 0.1.0, on 2005-09-15. The
      official project page describes the tool as developed in a GNU/Linux environment
      and distributed under GPL-2.0-or-later.
    - >
      The 2005-2006 news log shows a compact burst of development: new block commands,
      script-file driven commands, binary operations, performance fixes, and
      documentation installation changes.
  related-projects:
    - >
      Related tools include sed, dd, xxd, hex editors, and other byte-stream filters
      used in Unix binary-processing pipelines.
  sources:
    - https://bbe-.sourceforge.net/
    - https://bbe-.sourceforge.net/bbe.html
    - input:source_facts.package-manager
  summary:
    - >
      bbe is a small sed-like editor for binary files. Instead of line-oriented text
      editing, it applies insert, delete, change, replace, and conversion operations to
      byte blocks in a stream.
  timeline:
    - '2005-09-15: First version 0.1.0.'
    - '2005-11-06: Accepted into Debian unstable and testing.'
    - '2006-11-05: Version 0.2.2 released with command `x` added.'
  usage:
    - >
      bbe is used where a stream editor is convenient but the data is not line-oriented
      text: byte-range editing, block extraction, binary replacements, and scripted
      conversion of structured binary input.
related-packages:
  - id: brew:hexedit
    reason: >
      Choose hexedit for interactive hexadecimal or ASCII inspection and editing; choose
      bbe when the same binary transformation should be scripted, repeated, or placed in
      a pipeline.
    rel: alternative
    sources:
      - https://bbe-.sourceforge.net/bbe.html
      - https://github.com/pixel/hexedit
category: developer-tools
package-manager:
  brew: bbe
  debian: bbe
  macports: bbe
  nix: bbe
  ubuntu: bbe
  zypper: bbe
package-manager-url: https://formulae.brew.sh/formula/bbe
license: GPL-2.0-or-later
tags:
  - binary-editor
  - c
  - cli
  - sed
  - stream-editor
description: Sed-like editor for binary files
executables:
  - bbe
provenance:
  formula: bbe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
