id: brew:kertish-dos
display-name: Kertish-DOS
homepage: https://github.com/freakmaxi/kertish-dos
repo: https://github.com/freakmaxi/kertish-dos
docs:
  - https://github.com/freakmaxi/kertish-dos#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kertish-DOS has modest adoption signals: GitHub API metadata on 2026-07-01
      reported 107 stars and nine forks, and Homebrew metadata listed nine installs in
      the previous 30 days. Homebrew also recorded kertish-dfs as an old formula name.
  package-nerd-significance:
    - >
      The package is notable as a compact, self-contained distributed-storage experiment
      exposed through Homebrew. Its renamed formula history from kertish-dfs to
      kertish-dos is the sort of packaging detail that matters when tracking older
      install names.
  project-history:
    - >
      The freakmaxi/kertish-dos repository was created on GitHub on 2020-01-13. Its
      README describes a storage system for isolated networks and mass file-storage
      requirements, with manager nodes orchestrating clusters, head nodes handling file
      operations, and data nodes storing chunks.
    - >
      The project documentation is explicit that Kertish-DOS does not implement security
      and is intended for publicly isolated networks or as a backend behind front
      services.
  related-projects:
    - >
      MongoDB, Redis DSS, and freakmaxi/locking-center are named setup dependencies in
      the README.
    - Docker images and docker-compose files are documented for local farm setup.
    - krtadm and krtfs are the packaged administration and file-storage CLIs.
  sources:
    - https://api.github.com/repos/freakmaxi/kertish-dos
    - https://api.github.com/repos/freakmaxi/kertish-dos/releases?per_page=10
    - https://formulae.brew.sh/api/formula/kertish-dos.json
    - https://github.com/freakmaxi/kertish-dos
    - https://raw.githubusercontent.com/freakmaxi/kertish-dos/master/README.md
  summary:
    - >
      Kertish-DOS is a Go distributed object-storage platform and CLI suite for building
      a file-storage farm made of manager, head, and data nodes.
  timeline:
    - '2020-01-13: freakmaxi/kertish-dos repository created on GitHub.'
    - '2020-01-15: v20.1.4569 release published.'
    - '2022-03-02: v22.2.0147 release published.'
    - '2026-07-01: Homebrew formula metadata listed kertish-dos and old name kertish-dfs.'
  usage:
    - >
      Operators set up supporting MongoDB, Redis DSS, and Locking-Center services, then
      run manager, head, and data-node components. The packaged CLIs krtadm and krtfs
      are used for cluster administration and file-storage operations.
related-packages: []
category: data
