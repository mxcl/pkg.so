id: brew:hindent
display-name: hindent
homepage: https://github.com/mihaimaruseac/hindent
repo: https://github.com/mihaimaruseac/hindent
docs:
  - https://github.com/mihaimaruseac/hindent#readme
config-file-location:
  unix:
    - ./.hindent.yaml
    - ~/.hindent.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      hindent's adoption is tied to Haskell editor and build workflows. Its README
      documents use in pipeline style, Emacs `hindent-mode`, Vim `formatprg`, a Vim
      plugin, and JetBrains File Watchers. Hackage lists the package under development,
      library, and program tags, which reflects its dual role as code and executable.
    - >
      The package appears in Homebrew, MacPorts, Arch, Ubuntu, Hackage, and Stackage
      contexts, making it familiar to developers who expect language formatters to be
      installable from their OS or language package manager.
  package-nerd-significance:
    - >
      hindent matters to package nerds because it is a classic formatter package: tiny
      surface area, editor-friendly, pipeline-friendly, and available in multiple
      package systems. It represents the era when language communities standardized
      formatting through standalone executables before formatter support was expected
      inside every language server.
    - >
      It is also a useful Haskell packaging specimen because it lives simultaneously on
      Hackage and GitHub, depends on parser libraries, and must follow language
      evolution as GHC syntax grows.
  project-history:
    - >
      The repository history begins on 2014-08-24 with a first commit and rapid
      follow-up commits for printer structure, expression constructors, pattern support,
      declarations, where clauses, and a basic executable. The first visible tag, 1.0,
      followed on 2014-08-30, and the project iterated quickly through 2.x, 3.x, and 4.x
      tags in late 2014.
    - >
      Hackage describes hindent as an extensible Haskell pretty printer, both a library
      and an executable, and points users to the GitHub repository for usage. Over time
      the package continued through 5.x and 6.x releases while tracking parser and
      language-extension needs in the Haskell ecosystem.
  related-projects:
    - >
      Hackage and Stackage are the package registry and curated package-set surfaces
      where many Haskell developers encounter hindent.
    - >
      Editor integrations include the repository's Emacs mode, Vim `formatprg`,
      vim-hindent, and JetBrains File Watchers.
    - >
      Related Haskell formatting tools include stylish-haskell, ormolu, fourmolu, and
      brittany, though hindent's official materials focus on its own formatter and
      editor integrations.
  sources:
    - >
      Hackage package page for package description, versions, maintainer, upload, source
      repo, license, and distribution context.
    - Official Git repository tags and commits for early timeline.
    - Official README for usage, editor integration, and customization.
  summary:
    - >
      hindent is a Haskell pretty-printer and source formatter distributed as both a
      Haskell package and a CLI executable. Its package-manager role is straightforward:
      it gives editors, hooks, and shell pipelines a stable `hindent` command for
      reformatting Haskell source.
  timeline:
    - '2014-08-24: Repository history begins with the first commit.'
    - '2014-08-30: 1.0 is tagged.'
    - '2014-09: 2.x and 3.x releases are tagged during rapid early development.'
    - '2014-11: 4.0 is tagged.'
    - '2026-01-24: Hackage records upload of hindent 6.3.0.'
  usage:
    - >
      The basic usage model is `cat path/to/sourcefile.hs | hindent` or passing
      filenames to the CLI. Options cover line length, indent or tab size, import
      sorting, trailing newline behavior, validation, and GHC language extensions.
    - >
      The README documents project- or home-level `.hindent.yaml` customization with
      indentation, line length, import sorting, line breaks, and extensions. Editor
      integrations use the same CLI, so the package works without a separate daemon or
      language-server dependency.
related-packages:
  - id: brew:ormolu
    reason: >
      Choose Ormolu when you want a GHC-parser-based formatter with a deliberately fixed
      style and minimal configuration; choose hindent when its configurable indentation
      and line-breaking controls better match the project.
    rel: alternative
    sources:
      - https://github.com/mihaimaruseac/hindent#readme
      - https://github.com/tweag/ormolu#readme
      - https://github.com/tweag/ormolu/blob/master/DESIGN.md
  - id: brew:fourmolu
    reason: >
      Choose Fourmolu when you want Ormolu-compatible parsing plus a broader, actively
      documented style-configuration system; choose hindent for its established pipeline
      and editor-filter workflow.
    rel: alternative
    sources:
      - https://github.com/mihaimaruseac/hindent#readme
      - https://fourmolu.github.io/
      - https://fourmolu.github.io/config/
  - id: brew:stylish-haskell
    reason: >
      Choose stylish-haskell when you mainly need targeted cleanup of imports, pragmas,
      records, whitespace, and line endings rather than whole-source pretty printing.
    rel: alternative
    sources:
      - https://github.com/mihaimaruseac/hindent#readme
      - https://github.com/haskell/stylish-haskell#readme
category: developer-tools
