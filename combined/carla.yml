history:
  adoption-history:
    - >
      Carla's adoption follows the Linux audio packaging pattern: it is distributed by
      many system package managers and sits alongside JACK, LV2, LADSPA, DSSI, VST, SF2,
      and SFZ tooling. The input package facts list apk, Homebrew, dnf, Nix, pacman,
      Ubuntu, and zypper packages.
  package-nerd-significance:
    - >
      Carla matters in package catalogs because audio-plugin ecosystems are fragmented
      by format, driver, and operating system. A packaged Carla binary gives users a
      bridge across LADSPA, DSSI, LV2, VST2, VST3, AU, sound-bank formats, JACK
      workflows, and native audio drivers.
  project-history:
    - >
      The public GitHub repository dates to 2013, and the project is maintained as
      falkTX/Carla. The KXStudio page frames Carla as both a user-facing host and an
      embeddable/debuggable tool for plugin workflows, with a goal of being simple to
      use while exposing advanced modular-audio features.
  related-projects:
    - Carla is part of the KXStudio applications family.
    - >
      The KXStudio page says its Patchbay uses the same canvas engine as Catarina,
      Catia, and Claudia.
    - >
      It interoperates with JACK and plugin standards including LV2, LADSPA, DSSI, VST,
      AU, SF2, and SFZ.
  sources:
    - https://api.github.com/repos/falkTX/Carla
    - https://github.com/falkTX/Carla
    - https://kx.studio/Applications:Carla
    - https://formulae.brew.sh/api/formula/carla.json
  summary:
    - >
      Carla is a libre audio plugin host from the KXStudio ecosystem. Official docs
      describe it as a modular host for many audio drivers and plugin formats, with
      Rack, Patchbay, Single-client, and Multi-client processing modes.
  timeline:
    - '2013: Public GitHub repository created.'
    - '2010s: Project documented as a KXStudio application and modular plugin host.'
    - >
      2020s: Package facts show broad availability across Linux distributions, Homebrew,
      and Nix.
  usage:
    - >
      Users run Carla as a standalone host or plugin host, scan plugin folders, add
      plugins, connect them in rack or patchbay modes, and control parameters locally,
      by MIDI CC, or over OSC. The README also notes native drivers such as ALSA,
      DirectSound, CoreAudio, and JACK.
related-packages:
  - id: brew:jack
    reason: >
      Carla documents JACK as its default and preferred audio driver, with JACK-specific
      single-client and multi-client modes for routing plugin audio and MIDI.
    rel: adjacent_workflow
    sources:
      - https://kx.studio/Applications:Carla
      - https://jackaudio.org/
