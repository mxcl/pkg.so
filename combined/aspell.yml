id: brew:aspell
display-name: GNU Aspell
homepage: http://aspell.net/
repo: https://git.savannah.gnu.org/cgit/aspell.git
docs:
  - http://aspell.net/man-html/Introduction.html
  - http://aspell.net/man-html/Specifying-Options.html
  - http://aspell.net/man-html/index.html
  - https://savannah.gnu.org/projects/aspell
config-file-location:
  unix:
    - ~/.aspell.conf
    - /usr/local/etc/aspell.conf
    - /usr/etc/aspell.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The Homebrew input records Aspell across apk, Homebrew, Debian, dnf, MacPorts,
      Nix, pacman, Scoop, Ubuntu, and zypper. That is broad cross-platform packaging for
      a traditional Unix text utility, helped by its GNU status and its use as a backend
      for editors and other applications.
    - >
      Aspell's adoption came from both interactive command-line use and library/backend
      use. The manual's comparison to Ispell and Hunspell positions it as part of the
      lineage of spell-checking engines available to editors, mail clients, and
      text-processing tools.
  package-nerd-significance:
    - >
      Aspell is classic package-manager territory: a small CLI, a library, dictionaries
      and word-list tooling, editor integrations, and a global/personal configuration
      story. It often matters less as a visible app than as the spell-checking engine
      another package expects.
    - >
      Its continued packaging across Unix-like systems and Windows package managers
      makes it a useful compatibility target for scripts and editor setups that predate
      newer spell-checking backends.
  project-history:
    - >
      The official manual identifies Aspell as a spell checker intended to eventually
      replace Ispell. Savannah lists GNU Aspell as official GNU software, names Kevin
      Atkinson as group admin, and records the project registration date as 23 November
      2001.
    - >
      Aspell's project history is also a history of Unix spell-checker interfaces. The
      manual documents command-line use, an Ispell compatibility mode, integration with
      applications such as Emacs, XEmacs, Vim, Pine, and Enchant-based applications,
      plus C API and pipe-based interfaces for programs that embed or drive spell
      checking.
    - >
      The manual copyright range runs from 2000 to 2026 and the generated manual title
      identifies version 0.60.8.2, showing a mature maintenance line rather than a
      rapid-release CLI.
  related-projects:
    - Aspell is directly compared with Ispell and Hunspell in its manual.
    - The manual documents use with Enchant-based applications, Emacs, XEmacs, Vim, and Pine.
  sources:
    - http://aspell.net/man-html/Introduction.html
    - http://aspell.net/man-html/Specifying-Options.html
    - http://aspell.net/man-html/index.html
    - https://savannah.gnu.org/projects/aspell/
    - input.source_facts.package-manager
  summary:
    - >
      GNU Aspell is a GNU spell checker by Kevin Atkinson, designed as a replacement for
      Ispell and usable either as a library or as an independent command-line spell
      checker. Its manual emphasizes better replacement suggestions, UTF-8 document
      checking without special dictionaries, locale awareness, multiple dictionaries,
      and safer handling of personal dictionaries across concurrent processes.
  timeline:
    - >
      2000: Manual copyright range begins, indicating early Aspell documentation and
      development.
    - '2001-11-23: Savannah records GNU Aspell project registration.'
    - >
      0.60 series: Manual documents UTF-8 handling, multiple dictionaries, personal
      dictionary behavior, Ispell compatibility, C API, pipe mode, and application
      integrations.
    - >
      2026: Manual title and copyright range show GNU Aspell 0.60.8.2 documentation
      maintained through 2026.
  usage:
    - >
      Users can run `aspell` directly for spell-checking files, use it as an Ispell
      replacement, call it through a pipe protocol, or link to its C API. Companion
      utilities in the package handle dictionary import, compressed word lists, and
      prezip/preunzip workflows.
    - >
      Configuration can come from command-line options, global and personal
      configuration files, or the `ASPELL_CONF` environment variable. The manual says
      the personal file is normally `.aspell.conf` in `HOME`, while the global file is
      normally `aspell.conf` under an `etc` directory such as `/usr/etc` or
      `/usr/local/etc`.
related-packages:
  - id: brew:enchant
    reason: >
      Use Enchant when applications need one stable spell-checking API while retaining
      Aspell as a selectable backend.
    rel: adjacent_workflow
    sources:
      - https://aspell.net/
      - https://rrthomas.github.io/enchant/
  - id: brew:hunspell
    reason: >
      Choose Hunspell instead when complex morphology, compounding, MySpell
      dictionaries, or compatibility with major browsers and office suites is the
      priority.
    rel: alternative
    sources:
      - https://aspell.net/
      - https://hunspell.github.io/
  - id: brew:ispell
    reason: >
      Choose Ispell for legacy Unix and editor workflows that require the original
      Ispell implementation rather than Aspell's compatible replacement.
    rel: alternative
    sources:
      - https://aspell.net/
      - https://www.cs.hmc.edu/~geoff/ispell.html
category: productivity
package-manager:
  apk: aspell
  brew: aspell
  debian: aspell
  dnf: aspell
  macports: aspell
  nix: aspell
  pacman: aspell
  scoop: main/aspell
  ubuntu: aspell
  zypper: aspell
package-manager-url: https://formulae.brew.sh/formula/aspell
license: LGPL-2.1-only
tags:
  - cli
  - dictionary
  - gnu
  - spell-checker
  - text-processing
description: Spell checker with better logic than ispell
executables:
  - aspell
  - aspell-import
  - precat
  - preunzip
  - prezip
  - prezip-bin
  - pspell-config
  - run-with-aspell
  - word-list-compress
provenance:
  formula: aspell
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
