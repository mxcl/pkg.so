id: brew:gama
display-name: GAMA
homepage: https://github.com/termkit/gama
repo: https://github.com/termkit/gama
docs:
  - https://github.com/termkit/gama#readme
config-file-location:
  unix: ~/.config/gama/config.yaml
credentials-file-location:
  unix: ~/.config/gama/config.yaml
history:
  adoption-history:
    - >
      GAMA's adoption trail is typical of a focused developer CLI: its own release
      artifacts cover Linux, macOS, and Windows, while the input package facts record
      availability in Homebrew, Nix, Winget, and zypper.
  package-nerd-significance:
    - >
      For package maintainers, GAMA is a small example of the post-GitHub-Actions
      tooling wave: instead of wrapping git itself, it wraps the CI control plane and
      ships as a single Go binary suitable for common package managers.
  project-history:
    - >
      The public GitHub repository was created in late 2023 and the first tagged 1.0.0
      release appeared in January 2024. The project documentation presents it as a
      terminal-first companion for GitHub Actions, with configuration through a YAML
      file or a GitHub token environment variable.
    - >
      The 2024 release stream quickly added workflow input handling, workflow history
      browsing, and usability fixes. By the 1.2 series in 2025, the README emphasized
      live refresh mode, Docker execution, and downloadable cross-platform binaries.
  related-projects:
    - GitHub Actions is the service GAMA manages.
    - GitHub CLI can supply an authentication token for GAMA.
    - Termkit is the GitHub organization publishing the project.
  sources:
    - https://api.github.com/repos/termkit/gama
    - https://github.com/termkit/gama
    - https://github.com/termkit/gama/releases
  summary:
    - >
      GAMA, short for GitHub Actions Manager, is a Go-based terminal user interface for
      listing, triggering, monitoring, and managing GitHub Actions workflows from a
      shell.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2024: v1.0.0 released with binary assets.'
    - '2024: v1.1 releases continued workflow and usability work.'
    - '2025: v1.2 releases documented live mode and cross-platform binary downloads.'
  usage:
    - >
      Users provide a GitHub token in ~/.config/gama/config.yaml or through
      GITHUB_TOKEN, then use the TUI to discover dispatchable workflows, inspect
      historical workflow runs, trigger workflows with inputs, and watch live status
      updates.
related-packages:
  - id: brew:gh
    reason: >
      GitHub CLI can generate the `gh auth token` value that GAMA's official README
      documents as an authentication source.
    rel: adjacent_workflow
    sources:
      - https://github.com/termkit/gama#readme
      - https://cli.github.com/manual/gh_auth_token
category: developer-tools
package-manager:
  brew: gama
  nix: gama
  winget: GamaPlatform.Gama
  zypper: gama
package-manager-url: https://formulae.brew.sh/formula/gama
license: GPL-3.0-only
tags:
  - ci-cd
  - cli
  - github-actions
  - go
  - tui
description: Manage your GitHub Actions from Terminal with great UI
executables:
  - gama
provenance:
  formula: gama
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
