id: brew:cargo-about
display-name: cargo-about
homepage: https://github.com/EmbarkStudios/cargo-about
repo: https://github.com/EmbarkStudios/cargo-about
docs:
  - https://embarkstudios.github.io/cargo-about
  - https://github.com/EmbarkStudios/cargo-about#readme
config-file-location:
  unix: <manifest_root>/about.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      cargo-about's adoption follows Rust projects that need repeatable license
      disclosure for dependency-heavy applications. The supplied package-manager facts
      list Homebrew, Nix, and Arch Linux packages, and the upstream README documents
      installation from crates.io and Arch Linux.
    - >
      The project also benefited from Embark's wider open-source Rust toolchain
      presence. Its repository topics include SPDX, license-checking, Cargo plugin, and
      Rust, which describe the niche it occupies among Cargo subcommands.
  package-nerd-significance:
    - >
      cargo-about matters because open-source license obligations are one of the least
      glamorous but most important parts of shipping packaged software. Rust's
      transitive dependency graphs can be large, and cargo-about turns that graph into a
      reproducible artifact for release notes, installers, game bundles, and product
      distributions.
    - >
      For package nerds, its importance is also cultural: it is a Cargo subcommand that
      treats package metadata as operational data, using Cargo manifests and SPDX
      license identifiers to make dependency compliance automatable.
  project-history:
    - >
      Embark Studios created the public cargo-about repository in November 2019 and
      released it as one of its open-source Rust tools. The README states that Embark
      uses and likes the tool internally, while warning that it is not legal advice.
    - >
      The project provides both a command-line Cargo subcommand and an mdBook manual.
      Its normal workflow is to initialize an about.toml and template, then generate a
      license output such as an HTML notice file from dependency metadata.
  related-projects:
    - >
      cargo-about is related to Cargo itself, SPDX license data, crates.io package
      metadata, and docs.rs API documentation.
    - >
      It overlaps culturally with cargo-deny and cargo-audit: all three turn Cargo
      dependency metadata into release or security decisions, but cargo-about focuses on
      license listings rather than vulnerability or policy enforcement.
  sources:
    - https://api.github.com/repos/EmbarkStudios/cargo-about
    - https://embarkstudios.github.io/cargo-about/
    - https://github.com/EmbarkStudios/cargo-about
    - https://raw.githubusercontent.com/EmbarkStudios/cargo-about/main/README.md
    - source_facts.package-manager
  summary:
    - >
      cargo-about is an Embark Studios Cargo plugin for generating license listings for
      the full dependency graph of a Rust crate. It sits at the intersection of Cargo
      metadata, SPDX license data, and release compliance work.
  timeline:
    - '2019: cargo-about repository created on GitHub.'
    - '2019: GitHub releases show an initial 0.0.1 release in November.'
    - >
      2026: Repository metadata shows continued maintenance, Rust implementation, and
      licensing/SPDX topics.
  usage:
    - >
      The documented starting workflow is `cargo about init`, which creates about.toml
      and about.hbs in a Cargo project, followed by `cargo about generate about.hbs` to
      produce license information.
    - >
      The official book documents commands and configuration for generating, clarifying,
      and working around license metadata issues, making cargo-about more of a
      compliance-report generator than a general dependency-audit scanner.
related-packages:
  - id: brew:cargo-deny
    reason: >
      Use cargo-deny alongside cargo-about to enforce allowed licenses, bans, sources,
      and advisories before cargo-about renders the dependency license notices shipped
      with a release.
    rel: adjacent_workflow
    sources:
      - https://github.com/EmbarkStudios/cargo-about
      - https://github.com/EmbarkStudios/cargo-deny
      - https://embarkstudios.github.io/cargo-about/
      - https://embarkstudios.github.io/cargo-deny/
category: developer-tools
package-manager:
  brew: cargo-about
  nix: cargo-about
  pacman: cargo-about
package-manager-url: https://formulae.brew.sh/formula/cargo-about
license: Apache-2.0 OR MIT
tags:
  - cargo-plugin
  - cli
  - dependency-analysis
  - license-compliance
  - licenses
  - rust
description: Cargo plugin to generate list of all licenses for a crate
executables:
  - cargo-about
provenance:
  formula: cargo-about
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
