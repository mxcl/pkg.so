id: brew:cyan
display-name: cyan
homepage: https://github.com/asdfzxcvbn/pyzule-rw
repo: https://github.com/asdfzxcvbn/pyzule-rw
docs:
  - https://github.com/asdfzxcvbn/pyzule-rw#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions focus on pipx or pip from the GitHub archive
      and state support for Linux, macOS, WSL, and jailbroken iOS on x86_64 and
      arm64/aarch64. Its Homebrew packaging makes the tool visible to macOS users who
      want a package-manager install rather than a direct pipx command.
  package-nerd-significance:
    - >
      For package people, cyan is a small modern example of a Python CLI whose upstream
      prefers direct archive installation but is also wrapped by Homebrew and other
      package sets for repeatable local tooling.
  project-history:
    - >
      The README describes pyzule-rw / cyan as a rewrite of pyzule and acknowledges the
      original Azule project. GitHub repository metadata places the project creation in
      April 2024, with public release tags reaching v1.0 in September 2024 and v1.4.x by
      early 2025.
  related-projects:
    - >
      The README credits pyzule, Azule, LIEF, and insert_dylib-related projects as
      ancestors or building blocks.
  sources:
    - https://github.com/asdfzxcvbn/pyzule-rw/blob/main/README.md
    - https://api.github.com/repos/asdfzxcvbn/pyzule-rw
    - https://github.com/asdfzxcvbn/pyzule-rw/releases
    - https://formulae.brew.sh/formula/cyan
  summary:
    - >
      cyan is the CLI entry point for pyzule-rw, an iOS app injector and modifier
      distributed from the pyzule-rw repository.
  timeline:
    - '2024: Repository created and initial work began.'
    - '2024: v1.0 release published.'
    - '2025: v1.4.x releases continued the public release line.'
  usage:
    - >
      cyan is used to modify IPA, TIPA, or app bundles: it can inject debs, dylibs,
      frameworks, bundles, and app extensions, alter app metadata such as name and
      bundle identifier, change icons, add entitlements, and generate shareable .cyan
      files through the bundled cgen command.
related-packages: []
category: developer-tools
package-manager:
  brew: cyan
  macports: cyan
  nix: cyan
package-manager-url: https://formulae.brew.sh/formula/cyan
license: Unlicense
tags:
  - app-injection
  - cli
  - ios
  - ipa
  - mobile
  - python
description: iOS app injector and modifier
executables:
  - cgen
  - cyan
provenance:
  formula: cyan
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
