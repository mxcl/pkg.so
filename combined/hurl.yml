id: brew:hurl
display-name: Hurl
homepage: https://hurl.dev
repo: https://github.com/Orange-OpenSource/hurl
docs:
  - https://hurl.dev/docs/frequently-asked-questions.html
  - https://hurl.dev/docs/hurl-file.html
  - https://hurl.dev/docs/manual.html
config-file-location: null
credentials-file-location:
  unix: ~/.netrc
history:
  adoption-history:
    - >
      The installation documentation and package metadata show distribution through
      Homebrew, MacPorts, Nix, Arch, Scoop, Winget, Alpine, and other channels. The
      changelog thanks outside contributors across releases, which indicates usage
      beyond the original Orange engineering team.
  package-nerd-significance:
    - >
      Hurl matters to package and CLI users because it makes HTTP integration checks
      small, reviewable, and runtime-light. Instead of committing shell scripts around
      curl plus a separate assertion language, teams can commit one text fixture and run
      it locally or in CI.
  project-history:
    - >
      The public GitHub repository was created in August 2020, and the release history
      shows a 1.0.0 tag in December 2020. The project evolved quickly from a plain-text
      HTTP runner into a broader API testing tool with captures, XPath and JSONPath
      assertions, SOAP and GraphQL examples, reports, and formatter/import tooling.
    - >
      Hurl's own README emphasizes that the HTTP engine is powered by libcurl while the
      surrounding CLI and file format are written in Rust. That design gave the tool a
      package-nerd-friendly niche: curl-compatible network behavior wrapped in a
      reproducible test file that can live in a repository.
  related-projects:
    - >
      Hurl is closely related to curl and libcurl, and it overlaps with API-testing
      tools that store requests as text or collections. Its `hurlfmt` executable also
      connects it to the habit of importing, formatting, and reviewing HTTP requests as
      source files.
  sources:
    - >
      Project README, changelog, documentation, GitHub release metadata, and Homebrew
      package metadata were used.
  summary:
    - >
      Hurl is an Orange Open Source command-line tool for running HTTP requests and
      tests from a plain-text file format. It sits between curl-style request execution
      and API test tooling: users can chain requests, capture values, assert headers and
      bodies, and emit CI-friendly reports.
  timeline:
    - '2020: Public GitHub repository created and early 0.99.x releases published.'
    - '2020: 1.0.0 release tag published in December.'
    - '2021: 1.x releases continued the API-testing feature set.'
    - >
      2025: 7.1.0 added items such as secrets-file support and additional authentication
      options.
    - >
      2026: 8.0.0 changed several CLI options and moved JSONPath handling toward RFC
      9535 behavior.
  usage:
    - >
      Hurl files usually describe one or more HTTP exchanges with expected status codes,
      captures, and assertions. The README examples cover HTML, REST/JSON, SOAP,
      GraphQL, performance assertions, hashes, and CI output formats such as JUnit, TAP,
      and HTML.
related-packages:
  - id: brew:curl
    reason: >
      curl is Hurl's underlying HTTP engine and remains the better companion for one-off
      transfers or debugging requests before encoding them as repeatable Hurl tests.
    rel: adjacent_workflow
    sources:
      - https://hurl.dev/
      - https://curl.se/docs/
category: developer-tools
package-manager:
  apk: hurl
  brew: hurl
  macports: hurl
  nix: hurl
  pacman: hurl
  scoop: main/hurl
  winget: Orange-OpenSource.Hurl
  zypper: hurl
package-manager-url: https://formulae.brew.sh/formula/hurl
license: Apache-2.0
tags:
  - api-testing
  - cli
  - curl
  - http
  - plain-text
description: Run and Test HTTP Requests with plain text and curl
executables:
  - hurl
  - hurlfmt
provenance:
  formula: hurl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
