id: brew:abook
display-name: abook
homepage: https://abook.sourceforge.io/
repo: https://sourceforge.net/p/abook/git/ci/master/tree
docs:
  - https://abook.sourceforge.io/
  - https://sourceforge.net/p/abook/git/ci/master/tree/FAQ
  - https://sourceforge.net/p/abook/git/ci/master/tree/README
  - https://sourceforge.net/p/abook/git/ci/master/tree/abook.1
  - https://sourceforge.net/p/abook/git/ci/master/tree/abookrc.5
config-file-location:
  unix:
    - ~/.abook/abookrc
    - $XDG_DATA_HOME/abook/abookrc
credentials-file-location: null
history:
  adoption-history:
    - >
      abook spread as a packaging-friendly Unix utility: the input metadata lists
      packages for Homebrew, Alpine, Debian, Fedora, MacPorts, Nix, Ubuntu, and
      openSUSE. The upstream README also lists successful builds across Linux, Darwin,
      Solaris, FreeBSD, OpenBSD, NetBSD, GNU/Hurd, AIX, HPUX, Irix, and DEC Alpha-era
      systems.
  package-nerd-significance:
    - >
      For package nerds, abook is notable as a compact ncurses-era tool with optional
      readline behavior, many text import/export filters, and a stable command-line
      interface that fits mailcap-style Unix composition. Its continued packaging across
      many distributions reflects the durability of mutt-adjacent tools.
  project-history:
    - >
      The project README identifies abook as an addressbook program with mutt support
      and credits JH, while the manual page credits Jaakko Heinonen as the author. Its
      ChangeLog shows a long 0.x development line with early 0.1.0 pre-releases,
      migration through 0.4.x terminal and import/export work, and later 0.6.x releases
      adding custom fields, vCard improvements, color, mouse support, key remapping,
      iCalendar output, and XDG-related changes.
  related-projects:
    - >
      mutt is the closest companion project in the upstream documentation, since abook
      is designed to answer mutt address queries and ingest mail senders. The README
      also positions abook among Unix contact-file formats by documenting conversion to
      and from LDIF, Pine, vCard, CSV, ELM, and Wanderlust data.
  sources:
    - https://sourceforge.net/p/abook/git/ci/master/tree/ChangeLog
    - https://sourceforge.net/p/abook/git/ci/master/tree/README
    - https://sourceforge.net/p/abook/git/ci/master/tree/abook.1
    - https://sourceforge.net/p/abook/git/ci/master/tree/abookrc.5
    - input source_facts.package-manager
  summary:
    - >
      abook is a terminal address-book program centered on simple local contact storage
      and integration with the mutt mail client. It matters in package-manager culture
      because it is the kind of small ncurses utility Unix users install to make mail
      workflows scriptable without adopting a desktop contacts stack.
  timeline:
    - '0.1.0-pre-release 1: Earliest ChangeLog entry.'
    - >
      0.3.0: New portable file format, FreeBSD build support, mutt send-mail command,
      and multiple e-mail address support.
    - '0.4.9: Added support for the systemwide /etc/abook.conf configuration file.'
    - >
      2002: 2002 ChangeLog entries added getopt parsing, readline support, and storage
      of rcfile and addressbook under the .abook directory.
    - '0.5.5: Added internationalization and several translations.'
    - >
      0.6.1: Added vCard parser improvements, color support, mouse support, and mutt
      groups support.
    - '0.6.2: Upgraded license to GPLv3 and added XDG base-directory compliance.'
  usage:
    - >
      The documented mutt workflow sets query_command to run abook --mutt-query and can
      pipe messages to abook --add-email. The manual also documents conversion between
      abook, LDIF, mutt aliases, Pine, CSV, Palm CSV, vCard, HTML, text, ELM,
      Wanderlust, iCalendar, BSD calendar, and custom formats.
related-packages:
  - id: brew:mutt
    reason: >
      Mutt is abook's explicitly documented companion: it can query abook for recipients
      and pipe message senders into the address book.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/abook/git/ci/master/tree/
      - https://www.mutt.org/doc/manual/
category: productivity
package-manager:
  apk: abook
  brew: abook
  debian: abook
  dnf: abook
  macports: abook
  nix: abook
  ubuntu: abook
  zypper: abook
package-manager-url: https://formulae.brew.sh/formula/abook
license: GPL-3.0-only AND GPL-2.0-or-later AND LGPL-2.0-or-later AND BSD-2-Clause AND BSD-4.3RENO
tags:
  - address-book
  - cli
  - contacts
  - mutt
  - ncurses
  - terminal
description: Address book with mutt support
executables:
  - abook
provenance:
  formula: abook
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
