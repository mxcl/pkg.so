id: brew:garden
display-name: Garden
homepage: https://garden-rs.gitlab.io
repo: https://github.com/garden-rs/garden
docs:
  - https://docs.rs/garden-tools
  - https://garden-rs.gitlab.io/garden
config-file-location:
  unix:
    - ./garden.yaml
    - ./garden/garden.yaml
    - ./etc/garden/garden.yaml
    - ~/.config/garden/garden.yaml
    - ~/etc/garden/garden.yaml
    - /etc/garden/garden.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Garden has been packaged for developers through cargo install, GitHub release
      binaries, Homebrew, Fedora, and related package collections. Its own README links
      both current package-manager entries and a legacy Homebrew tap for older versions.
  package-nerd-significance:
    - >
      Garden is interesting to package-oriented developers because it treats a fleet of
      Git repositories as a configured workspace while staying close to standard Unix
      shells and Git behavior. It competes with heavier repo-management systems by being
      a small Rust CLI with explicit config search paths and static Linux binaries.
  project-history:
    - >
      Garden's official GitHub mirror was created in June 2021, while the README
      identifies GitLab as the canonical project home. The project describes itself as
      stable and feature-complete for its core functionality.
    - >
      The tool grew around YAML configuration and familiar shell syntax, with both a
      garden CLI and a garden-gui interface available from the same project.
  related-projects:
    - >
      Garden is related to Git worktrees, command runners such as make, Garden GUI, the
      garden-tools Rust crate, and Garden seeds, a companion repository of reusable
      Garden templates.
  sources:
    - https://api.github.com/repos/garden-rs/garden
    - https://api.github.com/repos/garden-rs/garden/releases?per_page=100
    - https://garden-rs.gitlab.io/configuration.html
    - https://github.com/garden-rs/garden
    - https://raw.githubusercontent.com/garden-rs/garden/main/README.md
  summary:
    - >
      Garden is a Rust command runner and multi-repository Git configuration tool for
      managing collections of Git worktrees.
  timeline:
    - '2021: Official GitHub mirror created.'
    - '2024: v1.5.0 and later 1.x releases published on GitHub.'
    - '2025: v2.0.0 released.'
    - '2026: v2.6.0 released.'
  usage:
    - >
      Garden is used to bootstrap Git-based multi-repository development environments,
      apply git config and remotes to worktrees, grow new worktrees, and run commands
      across repository collections. Its configuration discovery searches project, user,
      and global garden.yaml paths.
related-packages: []
category: developer-tools
package-manager:
  brew: garden
  dnf: garden
package-manager-url: https://formulae.brew.sh/formula/garden
license: MIT
tags:
  - cli
  - command-runner
  - git
  - multi-repo
  - rust
  - worktree
description: Grow and cultivate collections of Git trees
executables:
  - garden
  - garden-gui
provenance:
  formula: garden
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
