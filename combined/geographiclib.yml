id: brew:geographiclib
display-name: GeographicLib
homepage: https://geographiclib.sourceforge.io/
repo: https://github.com/geographiclib/geographiclib
docs:
  - https://geographiclib.sourceforge.io/
  - https://geographiclib.sourceforge.io/doc/library.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GeographicLib's geodesic routines spread beyond the C++ package into C, Fortran,
      Python, Octave/MATLAB, Java, and JavaScript implementations. The C library is
      incorporated into PROJ and the R geosphere package, and official notes list
      downstream availability in Linux distributions, conda-forge, vcpkg, and Homebrew.
  package-nerd-significance:
    - >
      For package-manager users, GeographicLib is a compact but foundational geodesy
      dependency: it provides command-line tools, data installers, and stable library
      APIs used by mapping, GIS, surveying, navigation, and scientific software. The
      split between code packages and optional datasets makes it a classic packaging
      case where binaries and data files are handled separately.
  project-history:
    - >
      The project began as a C++ library, then grew because its geodesic routines were
      useful enough to port to several other languages. Before version 2.0, those
      implementations lived together in one repository; after version 2.0 they were
      split into a family of repositories, leaving the C++ repository as the broadest
      implementation.
    - >
      The documentation describes GeographicLib as project-hosted on SourceForge, with
      repositories on GitHub and package distributions maintained through SourceForge.
      The C++ repository also documents separate release and development branches, a
      pattern useful to downstream packagers who need stable tagged releases.
  related-projects:
    - >
      Related implementations include GeographicLib-C, GeographicLib-Fortran,
      GeographicLib-Python, GeographicLib-Java, and JavaScript packages. The
      documentation also names PROJ, geosphere, conda-forge, vcpkg, Homebrew, and
      several independent ports or wrappers.
  sources:
    - https://geographiclib.sourceforge.io/
    - https://geographiclib.sourceforge.io/C++/doc/index.html
    - https://geographiclib.sourceforge.io/doc/library.html
    - https://github.com/geographiclib/geographiclib
  summary:
    - >
      GeographicLib is a family of geodesy libraries descended from Charles Karney's C++
      library, which began in 2008. The C++ library provides geodesic and rhumb-line
      calculations, coordinate conversions, gravity and geomagnetic field calculations,
      triaxial-ellipsoid computations, command-line utilities, and high-accuracy
      algorithms intended to return results near round-off error.
  timeline:
    - "2008: Charles Karney's original C++ library began."
    - '2009-2025: The documentation copyright span reflects long-running public maintenance.'
    - '2.0: Language implementations were separated into a family of repositories.'
  usage:
    - >
      Practitioners use GeographicLib when accuracy matters for ellipsoidal geodesics,
      UTM/UPS/MGRS conversion, geocentric and local Cartesian conversion, geoid height
      evaluation, gravity models, magnetic models, polygon perimeter and area, and
      rhumb-line calculations. The package exposes this work through C++ APIs and many
      small utilities such as `GeodSolve`, `GeoConvert`, `GeoidEval`, `Gravity`, and
      `MagneticField`.
related-packages:
  - id: brew:proj
    reason: >
      PROJ complements GeographicLib with general coordinate-reference-system
      transformations and directly incorporates GeographicLib's C geodesic routines.
    rel: adjacent_workflow
    sources:
      - https://geographiclib.sourceforge.io/doc/library.html
      - https://proj.org/en/stable/
category: science
