id: brew:draft
display-name: Draft
homepage: https://github.com/Azure/draft
repo: https://github.com/Azure/draft
docs:
  - https://github.com/Azure/draft/tree/main/docs
  - https://github.com/Azure/draft
  - https://learn.microsoft.com/en-us/azure/aks/draft
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Draft's distribution through Homebrew and Scoop fits its target audience:
      developers setting up local Kubernetes or AKS workflows from a terminal. Microsoft
      Learn documents it as a Draft extension for Azure Kubernetes Service in preview,
      tying the CLI to AKS developer workflows.
  package-nerd-significance:
    - >
      Draft is significant as a package because it packages cloud onboarding knowledge
      into a CLI generator: language detection, Kubernetes manifest shapes,
      Helm/Kustomize choices, GitHub Actions, and AKS policy checks become reproducible
      local artifacts.
  project-history:
    - >
      The current Azure/draft repository was created in November 2021. Its README
      describes Draft as a developer onboarding tool for Kubernetes, replacing a blank
      project directory with generated Dockerfiles, manifests, Helm charts, Kustomize
      configuration, and workflow files.
  related-projects:
    - Azure Kubernetes Service
    - Kubernetes
    - Helm
    - Kustomize
    - GitHub Actions
    - kubectl
  sources:
    - https://github.com/Azure/draft
    - https://raw.githubusercontent.com/Azure/draft/main/README.md
    - https://learn.microsoft.com/en-us/azure/aks/draft
    - https://api.github.com/repos/Azure/draft
    - https://api.github.com/repos/Azure/draft/releases?per_page=8
  summary:
    - >
      Draft is an Azure-maintained command-line tool for generating the first Docker,
      Kubernetes, Helm, Kustomize, and GitHub Actions artifacts needed to get an
      application running on Kubernetes.
  timeline:
    - '2021: Azure/draft was created on GitHub.'
    - >
      2023: Microsoft Learn documentation for the AKS Draft extension carried a June
      2023 document date.
    - >
      2025-2026: the project published frequent v0.17.x releases, indicating continued
      maintenance.
  usage:
    - >
      Users run draft create to generate deployment files, draft generate-workflow to
      create GitHub Actions deployment workflows, draft setup-gh for GitHub OIDC setup
      with Azure, and draft validate to check manifests against AKS deployment
      safeguards.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl to apply and operate the Kubernetes manifests generated by Draft when
      deployment is not delegated to the generated GitHub Actions workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/Azure/draft#readme
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:helm
    reason: >
      Draft can generate a Helm chart as its deployment output, after which Helm manages
      installation, upgrades, and rollback in the cluster.
    rel: adjacent_workflow
    sources:
      - https://github.com/Azure/draft#readme
      - https://helm.sh/docs/intro/using_helm/
  - id: brew:kustomize
    reason: >
      Draft can generate Kustomize configuration, which Kustomize then builds into
      environment-specific Kubernetes manifests.
    rel: adjacent_workflow
    sources:
      - https://github.com/Azure/draft#readme
      - https://kubectl.docs.kubernetes.io/references/kustomize/
category: cloud-infrastructure
package-manager:
  brew: draft
  scoop: main/draft
package-manager-url: https://formulae.brew.sh/formula/draft
license: MIT
tags:
  - azure
  - cli
  - docker
  - helm
  - kubernetes
  - manifests
description: Day 0 tool for getting your app on Kubernetes fast
executables:
  - draft
provenance:
  formula: draft
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
