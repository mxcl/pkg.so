id: cask:nextpad++
display-name: Nextpad++
homepage: https://nextpad.org/
repo: https://github.com/nextpad-plus-plus/nextpad-plus-plus-macos
docs:
  - https://github.com/nextpad-plus-plus/nextpad-plus-plus-macos#readme
  - https://nextpad.org/online-help
  - https://nextpad.org/resources
config-file-location:
  macos: ~/Library/Application Support/Nextpad++
credentials-file-location: null
history:
  adoption-history:
    - >
      Nextpad++ targets Mac users who want the established Notepad++ editing model
      without Wine or another compatibility layer. The project distributes a signed,
      notarized universal macOS application and is also available through Homebrew.
    - >
      Its compatibility story centers on preserving Notepad++ concepts such as Scintilla
      editing, XML configuration, user-defined languages, macros, and a gradually ported
      plugin ecosystem while adopting native macOS menus, shortcuts, dialogs, dark mode,
      and system integration.
  package-nerd-significance:
    - >
      Nextpad++ is notable as a source-level platform port rather than a
      reimplementation or compatibility wrapper. That makes the package interesting to
      users who care about the lineage of Scintilla-based editors and the practical
      portability of a long-running Windows-native codebase.
    - >
      The cask provides a native, notarized application for both Apple Silicon and Intel
      Macs, avoiding the Wine runtime normally associated with running Notepad++ away
      from Windows.
  project-history:
    - >
      Nextpad++ was created by Andrey Letov as a native macOS port of the original
      Notepad++ codebase. The project credits Notepad++ author Don Ho and retains the
      GPL-3.0 license.
    - >
      The port uses C++ and Objective-C++ with native macOS APIs while retaining
      Scintilla and recognizable Notepad++ editing features. Its public 2026 release
      series added broader plugin support, file associations, dockable panels, and
      terminal-oriented editing.
  related-projects:
    - >
      Notepad++ is the upstream Windows editor whose codebase and user experience
      Nextpad++ ports.
    - Scintilla is the editing component used by both Notepad++ and Nextpad++.
  sources:
    - https://github.com/nextpad-plus-plus/nextpad-plus-plus-macos
    - https://github.com/nextpad-plus-plus/nextpad-plus-plus-macos/releases
    - https://nextpad.org/online-help/
    - https://nextpad.org/resources/
  summary:
    - >
      Nextpad++ is an unofficial, GPL-licensed native port of the Notepad++ codebase for
      macOS, retaining its Scintilla editor, plugin model, macros, syntax highlighting,
      and search tools without Wine or emulation.
  timeline:
    - >
      2026: The public release series established a signed native macOS application with
      active feature and plugin development.
    - >
      2026: The project added file associations, expanded its plugin catalog, and
      introduced a terminal-oriented `npp` interface during the 1.1 release line.
  usage:
    - >
      Nextpad++ is used as a lightweight native editor for source code and text, with
      tabbed documents, split views, regular-expression search, macros, themes,
      user-defined languages, and plugins.
    - >
      Official help places macOS configuration beneath `~/Library/Application
      Support/Nextpad++`; this includes editor preferences and plugin-related data. The
      application does not require a credentials file.
related-packages: []
