id: brew:vercel
display-name: Vercel CLI
homepage: https://vercel.com/home
repo: https://github.com/vercel/vercel
docs:
  - https://vercel.com/docs/cli
  - https://vercel.com/docs/cli/global-options
  - https://vercel.com/docs/project-configuration/global-configuration
config-file-location:
  linux: ~/.local/share/com.vercel.cli/config.json
  macos: ~/Library/Application Support/com.vercel.cli/config.json
  windows: '%APPDATA%\Roaming\xdg.data\com.vercel.cli\config.json'
credentials-file-location:
  linux: ~/.local/share/com.vercel.cli/auth.json
  macos: ~/Library/Application Support/com.vercel.cli/auth.json
  windows: '%APPDATA%\Roaming\xdg.data\com.vercel.cli\auth.json'
history:
  adoption-history:
    - >
      The CLI evolved with Vercel's deployment platform: version 24 in 2022 stabilized
      `vercel dev` and moved most CLI code to TypeScript; version 28 added deeper Git
      metadata and project-linking workflows. Later releases added a device-flow login,
      direct API access, agent-oriented historical logs, and local-directory scoping.
  package-nerd-significance:
    - >
      Vercel CLI is a prominent npm-installed cloud CLI whose long-running command
      surface tracks the shift from simple frontend deployment toward a broad
      programmable platform. Package users care about its dual `vercel`/`vc` commands,
      project-local state, cross-platform XDG-derived global state, rapid release
      cadence, and growing native-binary option.
  project-history:
    - >
      The official repository dates to 2016 and grew into a large TypeScript-centered
      monorepo for Vercel's CLI, builders, runtimes, and related packages. The regular
      CLI continues to be distributed as the `vercel` npm package, with separate native
      CLI binaries offered as an explicit alternative.
  related-projects:
    - >
      The repository also contains Vercel builders, runtimes, and platform packages; the
      CLI works closely with Git providers, the Vercel REST API, framework build
      outputs, and the separately distributed `@vercel/vc-native` binaries.
  sources:
    - https://github.com/vercel/vercel
    - https://vercel.com/changelog/introducing-the-vercel-api-cli-command
    - https://vercel.com/changelog/new-vercel-cli-login-flow
    - https://vercel.com/changelog/vercel-cli-v24
    - https://vercel.com/changelog/vercel-cli-v28
    - https://vercel.com/docs/cli
  summary:
    - >
      Vercel CLI is the command-line client for deploying, developing, linking,
      inspecting, and operating projects on Vercel. The `vercel` and `vc` executables
      expose both interactive developer workflows and token-based automation for CI/CD.
  timeline:
    - '2016: Official repository established.'
    - '2022-02-17: Vercel CLI v24 released; `vercel dev` became stable.'
    - '2022-08-12: Vercel CLI v28 released with expanded Git and linking behavior.'
    - '2025-09-12: OAuth 2.0 Device Flow became the CLI login path.'
    - '2026-01-27: `vercel api` added direct authenticated API access.'
    - '2026-02-10: `vercel logs` gained historical, agent-oriented querying.'
  usage:
    - >
      Developers use `vercel` to deploy the current project, `vercel dev` to emulate the
      platform locally, and `vercel link` or `.vercel/project.json` to bind a directory
      to a remote project. Operational commands cover domains, DNS, environment
      variables, logs, deployments, rollbacks, integrations, and authenticated API
      requests.
category: cloud-infrastructure
package-manager:
  brew: vercel
  brew-cask: vercel
  debian: vc-dev
  macports: Vc
  nix: vc
  pacman: vc
  ubuntu: vc-dev
  zypper: Vc-devel
package-manager-url: https://formulae.brew.sh/formula/vercel
license: Apache-2.0
tags:
  - ci-cd
  - cli
  - cloud
  - deployment
  - devops
  - hosting
  - serverless
  - typescript
  - vercel
description: Command-line interface for Vercel
executables:
  - vc
  - vercel
provenance:
  formula: vercel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
