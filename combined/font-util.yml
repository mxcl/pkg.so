id: brew:font-util
display-name: font-util
homepage: https://www.x.org/
repo: https://gitlab.freedesktop.org/xorg/font/util
docs:
  - https://www.x.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      font-util followed X.Org's modular packaging era: the freedesktop tag list
      includes X.Org release tags and later font-util-specific releases. Its audience is
      mostly downstream packagers and maintainers of X.Org font modules rather than
      end-user font designers.
  package-nerd-significance:
    - >
      font-util is a classic infrastructure package: small, rarely visible to users, but
      useful for keeping the old X11 bitmap/font-module world reproducible across source
      builds and operating-system packages.
  project-history:
    - >
      The official README describes font-util as X.Org font package creation and
      installation utilities. It records the primary development repository at
      freedesktop.org GitLab and directs questions to the Xorg mailing list.
    - >
      The package sits in the modular X.Org font stack. Its README documents the
      `--with-fontrootdir` configure option and the fontutil pkg-config file, which
      allows font modules built with fontutil macros to learn a default parent
      directory.
  related-projects:
    - >
      font-util belongs to the X.Org font module family and is related to the broader
      X.Org and freedesktop.org build and release infrastructure.
  sources:
    - https://cgit.freedesktop.org/xorg/font/util/refs/tags
    - https://gitlab.freedesktop.org/xorg/font/util
    - https://gitlab.freedesktop.org/xorg/font/util/-/raw/master/README.md
  summary:
    - >
      font-util is the X.Org utility package for font package creation and installation
      support.
  timeline:
    - >
      2004: freedesktop tag history shows X.Org-era font repository tags before modular
      font-util releases.
    - '2007: The tag list includes early font-util 1.0 and 1.1 releases.'
    - '2020s: The tag list continues through font-util 1.4.x releases.'
  usage:
    - >
      The package supplies command-line helpers such as `bdftruncate` and `ucs2any`,
      plus build-time metadata/macros used when producing and installing X.Org font
      packages.
related-packages:
  - id: brew:mkfontscale
    reason: >
      After font-util's helpers prepare legacy X11 bitmap-font sources, mkfontscale can
      scan the installed font directory and generate the `fonts.scale` and `fonts.dir`
      indexes consumed by the legacy X font system.
    rel: adjacent_workflow
    sources:
      - https://gitlab.freedesktop.org/xorg/font/util/-/blob/master/README.md
      - https://www.x.org/releases/current/doc/man/man1/mkfontscale.1.xhtml
category: media
package-manager:
  apk: font-util
  brew: font-util
  dnf: xorg-x11-font-utils
  nix: font-util
  pacman: xorg-font-util
  zypper: font-util
package-manager-url: https://formulae.brew.sh/formula/font-util
license: MIT
tags:
  - cli
  - fonts
  - xorg
description: 'X.Org: Font package creation/installation utilities'
executables:
  - bdftruncate
  - ucs2any
provenance:
  formula: font-util
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
