history:
  adoption-history:
    - >
      Glyphs is positioned for professional type designers, while the related Glyphs
      Mini product offers a lighter entry point for beginners. Its official learning
      ecosystem includes a detailed handbook, tutorials, videos, scripting material, and
      plug-in development guidance.
  package-nerd-significance:
    - >
      Glyphs sits at the intersection of visual design and programmable tooling:
      designers can automate workflows with Python, write plug-ins, and generate
      sophisticated OpenType fonts. Homebrew Cask makes this proprietary Mac application
      fit cleanly into reproducible workstation setup.
  project-history:
    - >
      Glyphs developed as a macOS-native font-production environment and reached a third
      major generation aimed at creating and releasing font families, variable fonts,
      icon systems, and logos. Its official documentation has expanded into a standalone
      handbook and a large multilingual learning library.
  related-projects:
    - Glyphs Mini is the lighter companion editor intended for beginners.
    - Python scripting and the Glyphs plug-in system extend the core editor.
  sources:
    - https://glyphsapp.com/
    - https://glyphsapp.com/learn
    - https://handbook.glyphsapp.com/
  summary:
    - >
      Glyphs is a proprietary macOS font editor for designing, interpolating, testing,
      and exporting professional typefaces and related vector-based design systems.
  timeline:
    - '2016: An official Glyphs 2 handbook was available for the second-generation application.'
    - >
      2020s: Glyphs 3 became the main professional edition, supported by a dedicated
      online handbook and learning portal.
  usage:
    - >
      Type designers use Glyphs to draw glyph outlines, manage font metadata, spacing
      and kerning, build OpenType features, interpolate families and variable fonts,
      perform hinting, and export fonts. Developers can script the editor and build
      plug-ins.
