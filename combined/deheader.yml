id: brew:deheader
display-name: deheader
homepage: http://www.catb.org/~esr/deheader/
repo: https://gitlab.com/esr/deheader
docs:
  - http://www.catb.org/~esr/deheader
  - https://gitlab.com/esr/deheader
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      deheader is packaged by Homebrew and appears upstream as a named package on the
      official project page. Its low-level C/C++ focus makes it more of a maintainer and
      build-hygiene tool than an end-user application.
  package-nerd-significance:
    - >
      deheader matters to package nerds because header bloat affects compile time,
      portability, and dependency clarity. It is especially relevant when distributions
      and maintainers need source trees to build cleanly across compilers, standard
      libraries, and Unix variants.
  project-history:
    - >
      The official project page describes deheader as a tool for removing unneeded
      includes, improving compilation time on large C++ projects, and exposing hidden
      dependencies and cohesion problems. The README says it is commonly packaged as
      `deheader`.
    - >
      The NEWS file gives a long maintenance record beginning with 0.1 on 2010-12-01.
      Later releases added summary output, portability checks, duplicate include
      detection, Python 2/3 compatibility, Makefile-friendly exit status, GCC
      compatibility updates, and continued documentation and hardening fixes through
      1.12 in 2026.
  related-projects:
    - >
      The project is adjacent to C and C++ compiler toolchains, build systems, and
      static-analysis utilities that reduce unnecessary source dependencies.
  sources:
    - http://www.catb.org/~esr/deheader
    - http://www.catb.org/~esr/deheader/README.adoc
    - http://www.catb.org/~esr/deheader/NEWS.adoc
    - https://gitlab.com/esr/deheader
    - https://formulae.brew.sh/formula/deheader
  summary:
    - >
      deheader is a C and C++ source analysis tool that finds include directives which
      can be removed while the file still compiles.
  timeline:
    - '2010: 0.1 initial release.'
    - '2016: 1.5 adds exit status behavior useful in Makefiles.'
    - '2022: 1.8 changes the shebang to Python 3.'
    - '2026: 1.12 is released.'
  usage:
    - >
      The package is used during source maintenance to test whether headers are actually
      required. Because it verifies removals by compilation, it belongs in the same
      toolbox as static-analysis and build-cleanup utilities rather than pure text
      linters.
related-packages:
  - id: brew:include-what-you-use
    reason: >
      Choose Include What You Use for Clang-based recommendations about both missing and
      superfluous direct includes; deheader instead tests removals through the project's
      configured build.
    rel: alternative
    sources:
      - https://include-what-you-use.org/
      - https://www.catb.org/~esr/deheader/deheader.html
category: developer-tools
