id: brew:aliddns
display-name: aliddns
homepage: https://github.com/OpenIoTHub/aliddns
repo: https://github.com/OpenIoTHub/aliddns
docs:
  - https://github.com/OpenIoTHub/aliddns#readme
config-file-location:
  unix:
    - ./aliddns.yaml
    - /etc/aliddns/aliddns.yaml
    - /root/snap/aliddns/current/aliddns.yaml
credentials-file-location:
  unix:
    - ./aliddns.yaml
    - /etc/aliddns/aliddns.yaml
    - /root/snap/aliddns/current/aliddns.yaml
history:
  adoption-history:
    - >
      The README documents distribution through Homebrew tap, Homebrew core, Snapcraft,
      Scoop, deb/rpm packages, shell installer, manual release binaries, and Docker.
      Official GitHub topics also list brew, deb, rpm, snapcraft, scoop, Docker,
      OpenWrt, Windows, Linux, and macOS.
    - >
      The adoption audience is mostly users in Aliyun/Alibaba Cloud DNS environments who
      need DDNS for residential or changing-IP networks.
  package-nerd-significance:
    - >
      aliddns is a classic package-manager utility: small, single-purpose, and much
      nicer when installed as a service rather than copied around as a one-off script.
    - >
      Its packaging breadth is notable for a niche regional-cloud DDNS client,
      especially because it covers desktop package managers, Linux service packages,
      Snap, Docker, and router-adjacent environments.
  project-history:
    - >
      The public GitHub repository was created in September 2020 under
      OpenIoTHub/aliddns. The official repository description and README present it as
      an Aliyun DDNS service written in Go, with convenient installation and
      background-service operation on Linux and macOS.
    - >
      The project is small and task-focused: configure Alibaba Cloud access credentials,
      domain, subdomain, and update interval, then run it directly or as a packaged
      service.
  related-projects:
    - >
      Related projects include other DDNS clients, Alibaba Cloud DNS automation scripts,
      router DDNS integrations, and OpenIoTHub networking utilities.
  sources:
    - https://api.github.com/repos/OpenIoTHub/aliddns
    - https://github.com/OpenIoTHub/aliddns
    - https://raw.githubusercontent.com/OpenIoTHub/aliddns/master/README.md
    - source_facts.package-manager
  summary:
    - >
      aliddns is a Go dynamic DNS client for Aliyun or Alibaba Cloud DNS. It updates a
      DNS record from a changing public IP address, a common home-lab and small-server
      need.
  timeline:
    - '2020: Public GitHub repository created.'
    - >
      2020s: README documents Homebrew, Snap, Scoop, deb/rpm, Docker, and release-binary
      installation paths.
    - >
      2023: Official GitHub metadata shows the last repository push in October 2023 at
      the time checked.
  usage:
    - >
      The README shows `aliddns -c /path/to/config/file/aliddns.yaml`, plain `aliddns`
      using `./aliddns.yaml`, and `aliddns run -i myid -k mykey -m iothub.cloud -s www
      -c 60`. The `-i` and `-k` values are the Alibaba Cloud access ID and access key.
    - >
      For packaged services, the README lists `/etc/aliddns/aliddns.yaml` for deb/rpm
      installs and `/root/snap/aliddns/current/aliddns.yaml` for Snap. Those config
      files also contain credentials, so they should be treated as secret-bearing files.
related-packages: []
category: networking
package-manager:
  brew: aliddns
package-manager-url: https://formulae.brew.sh/formula/aliddns
license: MIT
tags:
  - alibaba-cloud
  - aliyun
  - cli
  - ddns
  - dns
  - go
description: Aliyun(Alibaba Cloud) ddns for golang
executables:
  - aliddns
provenance:
  formula: aliddns
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
