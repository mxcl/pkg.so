id: brew:hyper-mcp
display-name: hyper-mcp
homepage: https://github.com/hyper-mcp-rs/hyper-mcp
repo: https://github.com/hyper-mcp-rs/hyper-mcp
docs:
  - https://github.com/hyper-mcp-rs/hyper-mcp#readme
  - https://github.com/hyper-mcp-rs/hyper-mcp/blob/main/CREATING_PLUGINS.md
  - https://github.com/hyper-mcp-rs/hyper-mcp/blob/main/RUNTIME_CONFIG.md
config-file-location:
  linux: ~/.config/hyper-mcp/config.json
  macos: ~/Library/Application Support/hyper-mcp/config.json
  windows: '{FOLDERID_RoamingAppData}\hyper-mcp\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      The Homebrew formula places hyper-mcp in the macOS and Linux package-manager path,
      while the README also documents GitHub release binaries, crates.io installation,
      and the project tap maintained by the hyper-mcp-rs organization.
  package-nerd-significance:
    - >
      hyper-mcp is interesting because it packages the MCP server explosion as a
      plugin-runtime problem. Instead of installing a separate native MCP server for
      each tool family, it leans on WebAssembly, Extism, OCI images, and signature
      checks, which makes it feel closer to a package manager for AI tool plugins than a
      single-purpose server.
  project-history:
    - >
      The project appeared in public release metadata in 2025 with a 0.1.x line. Its
      README describes the core idea as an MCP server for Claude Desktop, Cursor, and
      other MCP-compatible apps, where plugins can be written in languages that compile
      to WebAssembly and distributed through container registries.
    - >
      By the 0.8.x release line, the project shipped Linux, macOS, and Windows binaries,
      MCP Bundles for one-click Claude Desktop installation, container images, and
      signed OCI artifacts.
  related-projects:
    - >
      hyper-mcp builds on the Model Context Protocol, Extism, WebAssembly, OCI
      registries, cosign, and sigstore.
  sources:
    - https://api.github.com/repos/hyper-mcp-rs/hyper-mcp/releases?per_page=100
    - https://formulae.brew.sh/formula/hyper-mcp
    - https://github.com/hyper-mcp-rs/hyper-mcp
    - https://github.com/hyper-mcp-rs/hyper-mcp/blob/main/RUNTIME_CONFIG.md
    - https://raw.githubusercontent.com/hyper-mcp-rs/hyper-mcp/main/README.md
  summary:
    - >
      hyper-mcp is a Rust Model Context Protocol server that extends MCP clients with
      WebAssembly plugins, with an emphasis on sandboxing, OCI distribution, and one
      server process that can host many tools.
  timeline:
    - '2025: v0.1.0 published in GitHub release metadata.'
    - '2026: v0.7.x releases shipped Linux and macOS binaries plus container images.'
    - '2026: v0.8.x releases added Windows binaries and MCP Bundles for Claude Desktop.'
  usage:
    - >
      Users create a JSON configuration that lists plugins by URL, commonly `oci://`
      images in a registry, then run `hyper-mcp` over stdio. Runtime configuration can
      constrain host access, memory, network hosts, and signature verification behavior.
related-packages: []
category: ai
package-manager:
  brew: hyper-mcp
package-manager-url: https://formulae.brew.sh/formula/hyper-mcp
license: Apache-2.0
tags:
  - ai
  - cli
  - extism
  - mcp-server
  - plugins
  - rust
  - webassembly
description: MCP server that extends its capabilities through WebAssembly plugins
executables:
  - hyper-mcp
provenance:
  formula: hyper-mcp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
