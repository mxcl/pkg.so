id: brew:mips-linux-gnu-binutils
display-name: mips-linux-gnu-binutils
homepage: https://www.gnu.org/software/binutils/
repo: https://sourceware.org/git/binutils-gdb.git
docs:
  - https://sourceware.org/binutils/docs
  - https://www.gnu.org/software/binutils
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/mips-linux-gnu-binutils
    - https://packages.debian.org/sid/binutils-mips-linux-gnu
    - https://sourceware.org/binutils/docs
    - https://www.debian.org/ports/mips/
    - https://www.gnu.org/software/binutils/
  summary:
    - >
      mips-linux-gnu-binutils is a target-prefixed build of GNU Binutils for cross
      development to the mips-linux-gnu target. GNU Binutils is the GNU Project's
      collection of binary tools, centered on the GNU linker ld and GNU assembler as,
      with companion programs such as ar, nm, objcopy, objdump, readelf, size, strings,
      and strip. The Homebrew formula packages those tools with the mips-linux-gnu
      prefix so they can coexist with the host system's native binutils.
  usage:
    - >
      The package exists for developers building or inspecting binaries for MIPS Linux
      systems from a non-MIPS host. Debian's corresponding package describes the same
      role: it provides the GNU assembler, linker, and binary utilities for the
      mips-linux-gnu target, and is only needed for cross-compilation when that target
      is not the native platform. Within the MIPS ecosystem, the plain mips port is the
      big-endian counterpart to mipsel; Debian's MIPS port documentation separates mips
      and mipsel by binary endianness. Typical use is in embedded Linux, firmware,
      emulator, and legacy-platform work where a developer needs mips-linux-gnu-as,
      mips-linux-gnu-ld, mips-linux-gnu-objdump, or mips-linux-gnu-readelf as part of a
      cross toolchain.
related-packages:
  - id: brew:mipsel-linux-gnu-binutils
    reason: >
      Choose mipsel-linux-gnu-binutils instead when the target is little-endian MIPS
      Linux; this package targets the corresponding big-endian MIPS Linux tuple.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/mipsel-linux-gnu-binutils
      - https://www.gnu.org/software/binutils/
category: developer-tools
package-manager:
  brew: mips-linux-gnu-binutils
package-manager-url: https://formulae.brew.sh/formula/mips-linux-gnu-binutils
license: GPL-3.0-or-later
tags:
  - assembler
  - binutils
  - cli
  - cross-compilation
  - linker
  - mips
description: GNU Binutils for mips-linux-gnu cross development
executables:
  - mips-linux-gnu-addr2line
  - mips-linux-gnu-ar
  - mips-linux-gnu-as
  - mips-linux-gnu-c++filt
  - mips-linux-gnu-elfedit
  - mips-linux-gnu-gprof
  - mips-linux-gnu-ld
  - mips-linux-gnu-ld.bfd
  - mips-linux-gnu-nm
  - mips-linux-gnu-objcopy
  - mips-linux-gnu-objdump
  - mips-linux-gnu-ranlib
  - mips-linux-gnu-readelf
  - mips-linux-gnu-size
  - mips-linux-gnu-strings
  - mips-linux-gnu-strip
provenance:
  formula: mips-linux-gnu-binutils
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
