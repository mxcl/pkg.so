id: brew:feroxbuster
display-name: feroxbuster
homepage: https://epi052.github.io/feroxbuster
repo: https://github.com/epi052/feroxbuster
docs:
  - https://epi052.github.io/feroxbuster
  - https://github.com/epi052/feroxbuster#readme
config-file-location:
  linux: /etc/feroxbuster/ferox-config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      feroxbuster's adoption path follows the Rust security-tool pattern: GitHub
      releases and crates.io for early users, then OS package managers and security
      distributions for everyday use. The README documents Kali, Homebrew, winget,
      Chocolatey, install scripts, and project docs for other platforms; the input
      package metadata also records Nix, Scoop, winget, and zypper packaging.
    - >
      Crates.io metadata records more than 130,000 downloads and the repository README
      displays badges for GitHub and crates.io downloads. Those numbers support a real
      package-manager footprint for a specialized security CLI.
  package-nerd-significance:
    - >
      feroxbuster is significant because it became one of the recognizable Rust
      replacements in the directory-enumeration and content-discovery space. It packages
      as a single CLI but has enough operational surface to matter: config files,
      completions, man pages, update behavior, and multiple binary distribution paths.
    - >
      For maintainers, it is also a good example of security-tool packaging where
      provenance matters. The README explicitly warns about an unrelated impersonating
      domain and lists official download channels, which is unusually relevant package
      metadata for a pentesting tool.
  project-history:
    - >
      The public GitHub repository was created in August 2020, and crates.io records the
      first `feroxbuster` crate release in October 2020. The project reached 1.0.0
      within days of the initial crate publication and continued through a long 2.x line
      with regular releases.
    - >
      The project documentation later moved from a very large README to a GitHub Pages
      documentation site, while the README retained quick-start installation and usage
      examples. The project also added an updater in the 2.x era and documents official
      distribution channels to avoid domain impersonation.
  related-projects:
    - >
      feroxbuster is related to forced-browsing and directory-enumeration tools used in
      web security testing, and it is commonly paired with wordlists, proxies such as
      Burp Suite, and shell pipelines for target and result processing.
  sources:
    - https://github.com/epi052/feroxbuster
    - https://github.com/epi052/feroxbuster/blob/main/README.md
    - https://api.github.com/repos/epi052/feroxbuster
    - https://crates.io/crates/feroxbuster
    - https://formulae.brew.sh/formula/feroxbuster
  summary:
    - >
      feroxbuster is a Rust command-line tool for recursive web content discovery. Its
      README frames it as a forced-browsing tool: it combines brute force with wordlists
      to find unlinked resources, directories, files, and other predictable locations in
      web applications.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2020: First crates.io release and 1.0.0 release published.'
    - '2023: 2.10.x release line appears on crates.io.'
    - '2025: crates.io records the 2.13.1 release.'
  usage:
    - >
      Typical use passes a target URL, wordlist-derived extensions, filters for status
      codes or response sizes, recursion controls, headers, query parameters, proxy
      settings, and output options. The README examples show piping targets through
      standard input, proxying through Burp or SOCKS, passing authorization headers, and
      sending JSON or form bodies.
    - >
      In practice feroxbuster is used during web application testing to enumerate hidden
      or unlinked resources. Package users care about fast installation, shell
      completions, a default config path on security distributions, and reproducible CLI
      behavior across Linux, macOS, and Windows.
related-packages:
  - id: brew:ffuf
    reason: >
      Choose ffuf when you want a general web fuzzer whose wordlist substitution can
      target URL paths, headers, request bodies, or other request positions instead of
      emphasizing recursive directory discovery.
    rel: alternative
    sources:
      - https://github.com/ffuf/ffuf
      - https://epi052.github.io/feroxbuster-docs/overview/
  - id: brew:gobuster
    reason: >
      Choose Gobuster when the job also includes DNS-subdomain or virtual-host
      enumeration alongside directory and file discovery.
    rel: alternative
    sources:
      - https://github.com/OJ/gobuster
      - https://epi052.github.io/feroxbuster-docs/overview/
  - id: cask:burp-suite
    reason: >
      Proxy feroxbuster through Burp Suite when you need to inspect, log, or manually
      replay the HTTP requests generated during discovery.
    rel: adjacent_workflow
    sources:
      - https://epi052.github.io/feroxbuster-docs/configuration/command-line/
      - https://portswigger.net/burp/documentation
category: security
package-manager:
  brew: feroxbuster
  nix: feroxbuster
  scoop: main/feroxbuster
  winget: epi052.feroxbuster
  zypper: feroxbuster
package-manager-url: https://formulae.brew.sh/formula/feroxbuster
license: MIT
tags:
  - cli
  - content-discovery
  - directory-enumeration
  - rust
  - web-security
description: Fast, simple, recursive content discovery tool written in Rust
executables:
  - feroxbuster
provenance:
  formula: feroxbuster
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
