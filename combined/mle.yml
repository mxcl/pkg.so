id: brew:mle
display-name: mle
homepage: https://github.com/adsr/mle
repo: https://github.com/adsr/mle
docs:
  - https://github.com/adsr/mle
config-file-location:
  unix:
    - ~/.mlerc
    - /etc/mlerc
credentials-file-location: null
history:
  sources:
    - https://api.github.com/repos/adsr/mle
    - >
      https://dev.suckless.narkive.com/iZHH4oIM/announce-mle-a-small-terminal-based-text-editor
    - https://formulae.brew.sh/formula/mle
    - https://github.com/adsr/mle
    - https://raw.githubusercontent.com/adsr/mle/master/README.md
  summary:
    - >
      mle is a small terminal text editor written in C, developed in the adsr/mle
      repository, which was created on GitHub on 2014-12-22. A 2017 announcement to the
      suckless development list described it as a small, configurable, extensible and
      scriptable editor with nano- or Emacs-like defaults, optional modes, a roughly
      10k-line codebase, and minimal dependency goals.
  usage:
    - >
      The README's design goals keep mle in the lightweight-terminal-editor niche rather
      than the full Vim or Emacs ecosystem: small and hackable, few build-time and
      run-time dependencies, Lua scripting, shell-command integration, stackable key
      maps, multiple cursors, window splitting, UTF-8 support, syntax highlighting, and
      headless operation. In package-manager terms it is a modest but widely packaged
      console editor, available through systems such as Debian/Ubuntu, Fedora, FreeBSD,
      Alpine, Nix, Homebrew, MacPorts, Cygwin, and others. In practice users open files
      directly with `mle`, customize behavior through `~/.mlerc` or `/etc/mlerc`, and
      lean on existing command-line tools such as grep, fzf, tree, less, perl, and ctags
      for editor extensions.
related-packages:
  - id: brew:micro
    reason: >
      micro is an alternative terminal editor with common keybindings, mouse support,
      and a fuller plugin system, while mle emphasizes a smaller C codebase and
      shell-oriented extensibility.
    rel: alternative
    sources:
      - https://github.com/adsr/mle#readme
      - https://micro-editor.github.io/
  - id: brew:vim
    reason: >
      Vim is the alternative to choose for vi-style modal editing and a mature, highly
      configurable editor environment; mle instead defaults to conventional non-modal
      controls and a smaller compositional design.
    rel: alternative
    sources:
      - https://github.com/adsr/mle#readme
      - https://www.vim.org/about.php
category: developer-tools
package-manager:
  apk: mle
  brew: mle
  debian: mle
  dnf: mle
  macports: mle
  nix: mle
  ubuntu: mle
package-manager-url: https://formulae.brew.sh/formula/mle
license: Apache-2.0
tags:
  - c
  - cli
  - terminal
  - text-editor
description: Flexible terminal-based text editor
executables:
  - mle
provenance:
  formula: mle
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
