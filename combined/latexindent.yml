id: brew:latexindent
display-name: latexindent.pl
homepage: https://latexindentpl.readthedocs.io
repo: https://github.com/cmhughes/latexindent.pl
docs:
  - https://latexindentpl.readthedocs.io/en/latest
config-file-location:
  unix:
    - ~/indentconfig.yaml
    - ~/.indentconfig.yaml
    - localSettings.yaml in the target file directory
    - current working directory
credentials-file-location: null
history:
  adoption-history:
    - >
      latexindent.pl is distributed through CTAN and is included in TeX Live and MiKTeX.
      Homebrew packages it as `latexindent`, and the upstream README documents
      standalone executables for Windows, Ubuntu Linux, and macOS, along with Conda,
      Docker, and pre-commit workflows.
    - >
      Its adoption tracks the rise of formatter expectations in developer tooling: LaTeX
      authors increasingly want editor, CI, and pre-commit formatting support similar to
      language formatters such as gofmt, Black, or Prettier.
  package-nerd-significance:
    - >
      latexindent.pl is package-nerd significant because it brings modern formatter
      ergonomics to TeX source: reproducible layout, YAML configuration, editor
      integration, pre-commit hooks, and CI-friendly command-line behavior.
    - >
      It also has a packaging wrinkle maintainers care about: despite the Homebrew
      formula name `latexindent`, the upstream executable and documentation consistently
      center `latexindent.pl` and its Perl module/settings bundle.
  project-history:
    - >
      The GitHub repository was created on 2012-08-28. CTAN lists Chris Hughes as
      maintainer, and the project README identifies the package as `latexindent.pl`, a
      Perl script to beautify, tidy, format, and indent code within environments,
      commands, headings, and special code blocks.
    - >
      The project evolved from indentation into a broader source-formatting tool. The
      README documents delimiter alignment, line-break modification, text wrapping,
      one-sentence-per-line handling, string and regex replacements, Conda, Docker, and
      pre-commit support.
    - >
      The 2026 V4.0 changelog records a major overhaul of how `latexindent.pl` finds
      code blocks, with user-setting changes and performance and interaction
      improvements. CTAN records version 4.0.2 dated 2026-06-06.
  related-projects:
    - >
      Related projects and platforms include CTAN, TeX Live, MiKTeX, latexindent.pl's
      Read the Docs documentation, pre-commit, Conda, Docker, and editor or CI workflows
      that enforce TeX source formatting.
  sources:
    - https://api.github.com/repos/cmhughes/latexindent.pl
    - https://api.github.com/repos/cmhughes/latexindent.pl/tags?per_page=20
    - https://ctan.org/pkg/latexindent?lang=en
    - https://latexindentpl.readthedocs.io/en/latest/sec-introduction.html
    - >
      https://raw.githubusercontent.com/cmhughes/latexindent.pl/main/documentation/changelog.md
    - https://raw.githubusercontent.com/cmhughes/latexindent.pl/main/readme.md
  summary:
    - >
      latexindent.pl is a Perl formatter for LaTeX, TeX-adjacent, and BibTeX-style
      source files. It adds indentation, aligns delimiters, modifies line breaks, wraps
      text, and supports user customization through YAML settings.
  timeline:
    - '2012-08-28: GitHub repository created.'
    - '2022-01-21: CTAN announcement recorded version 3.15.'
    - '2026-03-15: V4.0 released as a major code-block-detection overhaul.'
    - '2026-06-06: V4.0.2 released.'
    - '2026-06-08: CTAN announced the 4.0.2 update.'
  usage:
    - >
      Users run `latexindent.pl myfile.tex` for a default formatting pass, often with
      `-l` to load YAML settings, `-o` to write a separate output file, or pre-commit
      hooks to format files during Git workflows. The documentation emphasizes testing
      output carefully before overwriting important documents.
related-packages:
  - id: brew:pre-commit
    reason: >
      latexindent.pl provides an official pre-commit hook, allowing repositories to
      apply or check LaTeX formatting automatically during Git workflows and continuous
      integration.
    rel: adjacent_workflow
    sources:
      - https://github.com/cmhughes/latexindent.pl#pre-commit
      - https://pre-commit.com/
  - id: brew:latexdiff
    reason: >
      The latexindent.pl maintainers recommend using latexdiff to verify that a
      formatting pass did not alter document content unexpectedly.
    rel: adjacent_workflow
    sources:
      - https://github.com/cmhughes/latexindent.pl#readme
      - https://www.ctan.org/pkg/latexdiff?lang=en
category: productivity
package-manager:
  brew: latexindent
  scoop: main/latexindent
package-manager-url: https://formulae.brew.sh/formula/latexindent
license: GPL-3.0-or-later
tags:
  - cli
  - formatter
  - indentation
  - latex
  - tex
description: Add indentation to LaTeX files
executables:
  - latexindent
provenance:
  formula: latexindent
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
