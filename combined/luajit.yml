id: brew:luajit
display-name: LuaJIT
homepage: https://luajit.org/luajit.html
repo: https://github.com/LuaJIT/LuaJIT
docs:
  - https://luajit.org/extensions.html
  - https://luajit.org/install.html
  - https://luajit.org/luajit.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official LuaJIT overview says it has been used in games, appliances, network
      and graphics applications, numerical simulations, trading platforms, and other
      specialty applications, and is part of large web, SaaS, networking, set-top-box,
      and embedded deployments.
    - >
      Package-manager adoption is broad: the input metadata lists LuaJIT packages for
      Homebrew, MacPorts, Debian, Ubuntu, Fedora, Alpine, Arch, openSUSE, Nix, Scoop,
      and Winget. That distribution footprint reflects LuaJIT's role as both a developer
      tool and a dependency of packages that want Lua speed or LuaJIT FFI.
  package-nerd-significance:
    - >
      LuaJIT is package-nerd-famous because it sits at the intersection of language
      runtime, C ABI, and distribution policy. The project now uses rolling releases
      from git rather than release tarballs, so downstream packages often package
      snapshots and must track branch policy carefully.
    - >
      It also explains a lot of Lua packaging behavior: LuaRocks modules may distinguish
      Lua versions, LuaJIT, FFI availability, and ABI compatibility. Having LuaJIT as a
      separate package lets distributions provide both stock Lua and the
      high-performance Lua 5.1-compatible runtime.
  project-history:
    - >
      LuaJIT is authored by Mike Pall and has been in continuous development since 2005.
      The official overview describes it as a JIT compiler for Lua that can be embedded
      or used as a standalone language runtime.
    - >
      LuaJIT 2.0 was a major rewrite of the VM, combining an assembler-written
      interpreter with a trace compiler and SSA-based optimizations. The official
      extensions documentation also makes clear why LuaJIT became more than a faster lua
      executable: it adds the FFI library, built-in bit operations, JIT control modules,
      profiler support, and Lua/C API extensions while remaining API and ABI compatible
      with Lua 5.1.
  related-projects:
    - Lua is the upstream language whose 5.1 API and ABI LuaJIT targets.
    - OpenResty maintains its own LuaJIT branch for nginx/OpenResty workloads.
    - >
      LuaRocks packages Lua modules that may run on LuaJIT or depend on LuaJIT-specific
      FFI behavior.
  sources:
    - https://luajit.org/download.html
    - https://luajit.org/extensions.html
    - https://luajit.org/luajit.html
    - https://luajit.org/running.html
    - https://luajit.org/status.html
    - source_facts.package-manager
  summary:
    - >
      LuaJIT is a just-in-time compiler and high-performance Lua 5.1-compatible runtime.
      It became one of the defining alternative Lua runtimes because it combines a fast
      interpreter, trace JIT compiler, FFI, and broad embedding support.
  timeline:
    - '2005: LuaJIT development begins.'
    - '2010s: LuaJIT 2.0 rewrites the VM around a fast interpreter and trace compiler.'
    - >
      2020s: LuaJIT documents rolling releases and recommends following versioned
      branches rather than old tarball-style releases.
    - '2026: Official status page lists v2.1 as the production branch.'
  usage:
    - >
      The normal command-line entry point is luajit on POSIX systems and luajit.exe on
      Windows. It runs Lua chunks, scripts, and interactive sessions, and it supports
      Lua-like CLI options plus LuaJIT-specific bytecode, JIT-control, and optimization
      switches.
    - >
      In package ecosystems, LuaJIT is commonly selected when a project targets Lua 5.1
      semantics but wants faster execution, C interop through FFI, or compatibility with
      ecosystems such as OpenResty and LuaJIT-oriented LuaRocks modules.
related-packages:
  - id: brew:lua
    reason: >
      Choose stock Lua when you want the reference language implementation or newer
      language semantics instead of LuaJIT's performance-oriented Lua 5.1-compatible
      runtime and extensions.
    rel: alternative
    sources:
      - https://luajit.org/luajit.html
      - https://www.lua.org/manual/
  - id: brew:luajit-openresty
    reason: >
      Choose OpenResty's LuaJIT branch when an OpenResty workload requires its
      additional APIs, JIT defaults, fixes, and optimizations while remaining
      synchronized with upstream LuaJIT.
    rel: alternative
    sources:
      - https://github.com/openresty/luajit2#readme
      - https://openresty.org/en/luajit.html
category: language-runtime
