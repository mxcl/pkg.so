id: brew:fourstore
display-name: 4store
homepage: https://4store.github.io
repo: https://github.com/4store/4store
docs:
  - https://github.com/4store/4store#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The strongest official adoption signal is Garlik's own use: 4store was built to
      underpin production Semantic Web applications before being packaged as a
      standalone open source database. In package-manager culture it became a compact
      command-line triplestore option for developers who needed RDF and SPARQL without
      deploying a larger semantic-web stack.
  package-nerd-significance:
    - >
      4store is package-nerd interesting because it is a C-era Unixy semantic-web
      database delivered as many small executables rather than a single monolithic
      service. It exposes the operational vocabulary of RDF stores directly: import,
      query, update, dump, cluster copy, cluster start/stop, and HTTP serving.
    - >
      It also captures a historical moment when RDF/SPARQL infrastructure was commonly
      distributed through native package managers and built against libraries such as
      Raptor and Rasqal.
  project-history:
    - >
      The project was designed by Steve Harris and developed at Garlik to support
      Semantic Web applications. The README says it had already served as Garlik's base
      platform for about three years, including databases of about 15GT and a web
      application used by thousands of people.
    - >
      The public GitHub repository dates to 2009 and uses the 4store name for a suite of
      administrative, backend, import, HTTP, query, dump, restore, and cluster tools.
      Its changelog shows continued maintenance through the 1.1.x line, including SPARQL
      Update, RDF 1.1 bNode skolemisation, clustering/admin changes, HTTP output
      formats, and portability fixes.
  related-projects:
    - Raptor and Rasqal are closely related dependencies for RDF parsing and SPARQL parsing.
    - >
      4store belongs to the same broad RDF triplestore and SPARQL database family as
      other semantic-web storage systems, but its official material emphasizes its own
      command-line and clustered backend tooling.
  sources:
    - https://api.github.com/repos/4store/4store
    - https://github.com/4store/4store
    - https://raw.githubusercontent.com/4store/4store/master/CHANGELOG.md
    - https://raw.githubusercontent.com/4store/4store/master/README.md
  summary:
    - >
      4store is an RDF database and SPARQL-oriented triplestore whose official README
      describes it as efficient, scalable, and stable. It sits in the semantic-web
      database niche rather than the general SQL or document-store lineage.
  timeline:
    - '2009: Public GitHub repository was created.'
    - 'v1.1.3: lib4store allowed C programs to connect to 4store backends directly.'
    - >
      v1.1.5: Added features including non-MDNS administration, RDF 1.1 bNode
      skolemisation, SPARQL Update, and access-control work.
    - 'v1.1.7: README and build documentation were refreshed.'
  usage:
    - >
      A typical workflow creates and manages knowledge bases with tools such as
      4s-backend-setup and 4s-admin, imports RDF with 4s-import, queries with 4s-query
      or the HTTP daemon, and uses dump, restore, backup, and cluster commands for
      operations.
    - >
      The README documents Raptor and Rasqal as RDF/SPARQL prerequisites, and notes
      operational details such as the store directory under /var/lib/4store and
      /etc/4s-cluster for clustered frontends.
related-packages:
  - id: brew:redstore
    reason: >
      RedStore is a lighter RDF triplestore and SPARQL server built on Redland, making
      it a practical alternative when 4store's multi-process and cluster-oriented
      tooling is unnecessary.
    rel: alternative
    sources:
      - https://github.com/4store/4store#readme
      - https://www.aelius.com/njh/redstore/
      - https://github.com/njh/redstore#readme
