id: brew:fastmod
display-name: fastmod
homepage: https://github.com/facebookincubator/fastmod
repo: https://github.com/facebookincubator/fastmod
docs:
  - https://github.com/facebookincubator/fastmod#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      fastmod's adoption is concentrated among programmers doing large codebase
      refactors. It is primarily supported on macOS and Linux, installable with Cargo,
      and packaged by developer-oriented package managers.
  package-nerd-significance:
    - >
      fastmod is notable because it brings the ripgrep ecosystem's ignore and grep
      crates to codemod-style source editing: boring Unix CLI inputs, Rust speed, and
      human-reviewed patch application.
  project-history:
    - >
      The project was created publicly in 2018 as a fast partial replacement for
      Facebook's codemod. Its README is explicit that the design target is interactive
      review followed by applying a regex replacement broadly.
  related-projects:
    - >
      fastmod is directly positioned as a partial replacement for codemod and uses Rust
      regex, ignore, and grep libraries.
  sources:
    - https://github.com/facebookincubator/fastmod
    - https://github.com/facebookincubator/fastmod#readme
    - https://api.github.com/repos/facebookincubator/fastmod/releases
  summary:
    - >
      fastmod is a Rust command-line tool from Facebook Incubator for fast, regex-based,
      interactive find-and-replace across codebases.
  timeline:
    - '2018: The public GitHub repository is created.'
    - '2020: v0.4.0 is released.'
    - '2023: v0.4.4 is released.'
  usage:
    - >
      A typical invocation supplies a regex, replacement text, and files or directories
      to process. fastmod walks directories in parallel, respects ignore rules, shows
      colored diffs, and lets the user accept, reject, or edit changes.
related-packages:
  - id: brew:sad
    reason: >
      Choose sad when you want a diff-first batch replacement pipeline fed by find or
      fd, with optional fzf selection and Git-compatible pagers, instead of fastmod's
      self-contained interactive directory traversal.
    rel: alternative
    sources:
      - https://github.com/facebookincubator/fastmod#readme
      - https://github.com/ms-jpq/sad#readme
  - id: brew:ast-grep
    reason: >
      Choose ast-grep when transformations must understand programming-language syntax
      and match AST structures rather than fastmod's textual Rust regular expressions.
    rel: alternative
    sources:
      - https://github.com/facebookincubator/fastmod#readme
      - https://ast-grep.github.io/guide/pattern-syntax.html
      - https://ast-grep.github.io/guide/rewrite-code.html
category: developer-tools
package-manager:
  brew: fastmod
  macports: fastmod
  nix: fastmod
package-manager-url: https://formulae.brew.sh/formula/fastmod
license: Apache-2.0
tags:
  - cli
  - codemod
  - find-and-replace
  - refactoring
description: Fast, partial replacement for codemod (find/replace tool for programmers)
executables:
  - fastmod
provenance:
  formula: fastmod
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
