id: brew:debianutils
display-name: debianutils
homepage: https://tracker.debian.org/pkg/debianutils
repo: https://salsa.debian.org/debian/debianutils
docs:
  - https://packages.debian.org/source/sid/debianutils
  - https://sources.debian.org/src/debianutils
  - https://tracker.debian.org/pkg/debianutils
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Debian Sources lists debianutils across historic Debian releases from hamm and
      slink through current stable, testing, and unstable suites. The package tracker
      shows the package in Debian's main archive, and Ubuntu tracks it as a source
      package as well, reflecting its role as part of Debian-family base-system plumbing
      rather than a standalone upstream app.
  package-nerd-significance:
    - >
      debianutils matters because it is one of those small base packages that exposes
      Debian policy decisions as executable behavior. Its changelog reads like a compact
      history of Debian packaging maintenance: usrmerge, alternatives, deprecating and
      restoring tools, maintainer-script needs, translations, reproducible-build
      details, and small utilities being kept compatible for decades.
  project-history:
    - >
      The Debian changelog records debianutils 1.1-1 as an initial release on April 18,
      1996 by Guy Maor, with early work around mkboot and run-parts. Over the following
      decades the package absorbed, retired, restored, or moved utilities as Debian
      policy, init conventions, merged-/usr work, shell handling, and package-maintainer
      workflows changed.
  related-projects:
    - >
      Related Debian-family base packages include sensible-utils, dpkg, debhelper,
      sysvinit/cron consumers of run-parts conventions, and alternative implementations
      of individual tools such as GNU which or FreeBSD which.
  sources:
    - https://packages.debian.org/source/sid/debianutils
    - https://sources.debian.org/src/debianutils/
    - https://sources.debian.org/src/debianutils/5.23.2/debian/control/
    - https://sources.debian.org/src/debianutils/5.23.2/run-parts.8/
    - https://sources.debian.org/src/debianutils/5.23.2/ischroot.1/
    - >
      https://metadata.ftp-master.debian.org/changelogs/main/d/debianutils/debianutils_5.23.2_changelog
    - https://tracker.debian.org/pkg/debianutils
  summary:
    - >
      debianutils is a Debian-native source package for small utilities used primarily
      by Debian package installation scripts, while still being directly useful to
      users. Its current control file marks the binary package Essential and lists tools
      such as add-shell, installkernel, ischroot, remove-shell, run-parts, savelog,
      update-shells, and which.
  timeline:
    - '1996: 1.1-1 initial release of debianutils.'
    - '1998: Debian Sources lists 1.9 in the hamm release.'
    - >
      2021: 5.x series changed handling around which, tempfile, update-shells, and
      merged-/usr decisions.
    - '2025: 5.23.x series updated run-parts and installkernel behavior.'
  usage:
    - >
      The package's most package-nerd-famous command is `run-parts`, which executes
      matching scripts in a directory in lexical order and under Debian-specific
      filename rules. `ischroot` reports chroot status by exit code, while the other
      commands handle shell registration, kernel install hooks, log saving, and related
      maintainer-script chores.
related-packages: []
category: system
package-manager:
  apk: run-parts
  brew: debianutils
  debian: debianutils
  macports: debianutils
  nix: debianutils
  pacman: run-parts
  ubuntu: debianutils
  zypper: debianutils
package-manager-url: https://formulae.brew.sh/formula/debianutils
license: GPL-2.0-or-later
tags:
  - cli
  - core-utils
  - debian
  - ischroot
  - run-parts
  - system-utilities
  - tempfile
description: Miscellaneous utilities specific to Debian
executables:
  - ischroot
  - run-parts
  - tempfile
provenance:
  formula: debianutils
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
