id: brew:fallow
display-name: fallow
homepage: https://docs.fallow.tools
repo: https://github.com/fallow-rs/fallow
docs:
  - https://docs.fallow.tools
config-file-location:
  unix:
    - .fallowrc.json
    - .fallowrc.jsonc
    - fallow.toml
    - .fallow.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official adoption signals are still early but visible in the project's own
      distribution choices: npm and Homebrew packaging, `npx fallow` one-off usage,
      `cargo install fallow-cli`, Docker images, and documented workflows for CI and
      agent review loops. The README also states that the project dogfoods its
      JavaScript and TypeScript surfaces in CI.
  package-nerd-significance:
    - >
      Fallow is notable in package-manager culture because it packages repository-scale
      static analysis as a fast local CLI with machine-readable contracts. It sits near
      linters and type checkers but focuses on cross-file system properties, making it
      useful as a pre-review gate for both humans and coding agents.
  project-history:
    - >
      The GitHub repository was created in March 2026, making Fallow a new project
      rather than a long-running ecosystem tool. The README emphasizes static analysis
      as free and open source, with optional runtime intelligence layered on top for
      production execution evidence.
    - >
      The project ships several integration surfaces from the same package family: a
      CLI, LSP server, MCP server, npm wrapper, Node API, Docker image, and versioned
      TypeScript output contracts.
  related-projects:
    - npm distributes the JavaScript-facing package.
    - Cargo distributes the Rust CLI path.
    - MCP and LSP integrations expose Fallow findings to agents and editors.
  sources:
    - https://github.com/fallow-rs/fallow
    - https://raw.githubusercontent.com/fallow-rs/fallow/main/README.md
    - https://raw.githubusercontent.com/fallow-rs/fallow/main/docs/fallow-compliance.md
    - https://docs.fallow.tools
    - https://api.github.com/repos/fallow-rs/fallow
    - https://api.github.com/repos/fallow-rs/fallow/releases?per_page=100
  summary:
    - >
      Fallow is a Rust-native codebase intelligence CLI for JavaScript and TypeScript
      projects. Its official README positions it as deterministic analysis for quality,
      changed-code risk, hotspots, duplication, architecture, dependency hygiene,
      cleanup opportunities, CI, editors, and AI agents.
  timeline:
    - '2026: Repository created.'
    - >
      2026: v2 release stream active with agent, MCP, LSP, Docker, security, and
      typed-output features.
    - '2026: v2.103.0 released.'
  usage:
    - >
      Common commands include `fallow audit` for changed-code review, `fallow health
      --score --hotspots --targets` for project quality and refactor targets, and
      `fallow dead-code` for cleanup findings. JSON output is documented for machine
      consumers.
    - >
      For agent-oriented workflows, Fallow exposes structured JSON, an MCP server, an
      LSP, and inspection commands that answer dependency, risk, duplication, cleanup,
      and evidence questions without asking an AI model to infer them from raw grep
      results.
related-packages:
  - id: brew:jscpd
    reason: >
      Choose jscpd for a focused, language-agnostic copy/paste detector; choose Fallow
      when duplication should be analyzed together with JavaScript/TypeScript
      architecture, complexity, and dead code.
    rel: alternative
    sources:
      - https://fallow.tools/docs/migration/from-jscpd/
      - https://jscpd.dev/
category: developer-tools
package-manager:
  brew: fallow
package-manager-url: https://formulae.brew.sh/formula/fallow
license: MIT
tags:
  - cli
  - code-analysis
  - code-intelligence
  - javascript
  - typescript
description: Codebase intelligence for TypeScript and JavaScript
executables:
  - fallow
provenance:
  formula: fallow
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
