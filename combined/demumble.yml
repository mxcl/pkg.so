id: brew:demumble
display-name: demumble
homepage: https://github.com/nico/demumble
repo: https://github.com/nico/demumble
docs:
  - https://github.com/nico/demumble#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      demumble's adoption is niche but recognizable among developers who read linker
      output, compiler IR, crash logs, or binary symbols across platforms. Homebrew and
      openSUSE packaging reflect that it is useful enough as a standalone CLI even
      though it is not a large framework.
    - >
      The GitHub release feed shows maintenance through v1.3.0 in August 2024, with
      releases spanning several years rather than rapid churn.
  package-nerd-significance:
    - >
      For package nerds, demumble is the kind of tiny diagnostic utility that earns a
      formula because it removes friction from debugging native builds. It is not
      infrastructure, but it makes opaque package failures easier to read.
    - >
      It also illustrates a common package-manager pattern: a small upstream tool with
      prebuilt releases becomes more valuable when installed uniformly through brew or
      distribution packages.
  project-history:
    - >
      The official repository was created in December 2016 and presents demumble as a
      pragmatic answer to day-to-day symbol decoding pain. Its README focuses on small
      but important behavior differences: underscore handling across macOS and Linux,
      stdin filtering that avoids demangling ordinary words, and Windows-style symbol
      support outside Windows.
    - >
      The project has stayed intentionally compact. Its build instructions are just
      CMake plus Ninja, and its release page provides prebuilt x64 binaries for Linux,
      macOS, and Windows.
  related-projects:
    - c++filt is the traditional Unix comparison point for Itanium C++ demangling.
    - undname.exe is the Windows comparison point for Microsoft Visual C++ symbols.
    - >
      LLVM and compiler toolchains generate the kinds of symbols demumble is commonly
      used to inspect.
  sources:
    - https://github.com/nico/demumble
    - https://github.com/nico/demumble#readme
    - https://api.github.com/repos/nico/demumble
    - https://api.github.com/repos/nico/demumble/releases
  summary:
    - >
      demumble is a small cross-platform symbol demangler positioned as a friendlier
      c++filt and undname.exe replacement. It demangles Itanium and Visual Studio C++
      symbols and also handles D, Rust, and Swift symbols.
  timeline:
    - '2016: The demumble repository is created on GitHub.'
    - '2019: The v1.2 release line is published.'
    - '2020: demumble v1.2.2 is released.'
    - '2024: demumble v1.3.0 is released.'
  usage:
    - >
      The simplest use is to pass a mangled symbol and receive a demangled function
      signature. demumble can also run as a filter on standard input, which makes it
      useful in shell pipelines over logs, objdump output, LLVM IR, or compiler
      diagnostics.
    - >
      The README's examples emphasize cross-platform convenience: the same binary can
      demangle Itanium ABI names and Microsoft Visual C++ names, reducing the need to
      remember which platform-specific demangler applies.
related-packages:
  - id: brew:binutils
    reason: >
      Choose GNU Binutils for the traditional c++filt demangler together with a full
      suite of object-file, symbol-table, linker, and disassembly tools.
    rel: alternative
    sources:
      - https://github.com/nico/demumble#readme
      - https://sourceware.org/binutils/docs/binutils/c_002b_002bfilt.html
  - id: brew:llvm
    reason: >
      Choose LLVM when you want llvm-cxxfilt as part of a broader compiler and
      binary-analysis toolchain rather than demumble's small cross-platform executable.
    rel: alternative
    sources:
      - https://github.com/nico/demumble#readme
      - https://llvm.org/docs/CommandGuide/llvm-cxxfilt.html
category: developer-tools
