id: brew:cloudflare-quiche
display-name: quiche
homepage: https://docs.quic.tech/quiche/
repo: https://github.com/cloudflare/quiche
docs:
  - https://docs.quic.tech/quiche
  - https://github.com/cloudflare/quiche#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README names production and ecosystem users: Cloudflare's edge
      network HTTP/3 support, Android DNS-over-HTTP/3, and curl integration for HTTP/3.
      That is unusually strong adoption evidence for a protocol implementation package.
    - >
      Distribution spans crates.io, docs.rs, GitHub releases/source, and Homebrew's
      cloudflare-quiche formula for users who want the bundled command-line tools.
  package-nerd-significance:
    - >
      quiche matters to package nerds because it packages a fast-moving internet
      protocol implementation with both Rust library and CLI surfaces. Versioning can
      affect curl builds, HTTP/3 experiments, and compatibility with BoringSSL and
      platform networking behavior.
    - >
      The Homebrew formula is especially handy for protocol testers who want
      command-line QUIC tools without building the Rust workspace themselves.
  project-history:
    - >
      The cloudflare/quiche repository was created in 2018, and Cloudflare's launch
      material describes it as a Rust implementation of QUIC intended to help deploy and
      experiment with the emerging protocol. The upstream README describes quiche as a
      low-level API for QUIC packet processing and connection state, with the
      application responsible for I/O and timers.
    - >
      The project includes Rust crates and command-line apps such as quiche-client and
      quiche-server. Its docs cover connection configuration, packet processing,
      streams, HTTP/3, pacing, and Android builds.
  related-projects:
    - curl can be built with quiche for HTTP/3 support.
    - Android DNS resolver uses quiche for DNS over HTTP/3 according to the upstream README.
    - IETF QUIC and HTTP/3 specifications define the protocol space quiche implements.
  sources:
    - https://github.com/cloudflare/quiche#readme
    - https://docs.quic.tech/quiche
    - https://blog.cloudflare.com/enjoy-a-slice-of-quic-and-rust/
  summary:
    - >
      quiche is Cloudflare's Rust implementation of QUIC and HTTP/3, packaged in
      Homebrew as cloudflare-quiche with command-line client and server tools. It is
      historically significant because it connects the IETF QUIC/HTTP/3 transition to
      real edge-network deployment, Rust library packaging, and command-line protocol
      experimentation.
  timeline:
    - '2018: cloudflare/quiche GitHub repository metadata was created.'
    - '2019: Cloudflare blog material introduced quiche as a Rust QUIC implementation.'
    - >
      Current README: Upstream documents Cloudflare edge, Android DNS-over-HTTP/3, and
      curl as users or integrations.
  usage:
    - >
      Library users embed quiche to implement QUIC and HTTP/3 behavior, configuring
      protocol parameters, TLS state, flow control, stream limits, and packet
      send/receive loops.
    - >
      CLI users run quiche-client against HTTP/3 endpoints or quiche-server with a
      certificate and key for local testing. The README explicitly frames these tools as
      examples rather than production applications.
related-packages:
  - id: brew:curl
    reason: >
      Choose curl with its documented quiche backend when you need a general-purpose
      HTTP client that can exercise HTTP/3 through quiche instead of the project's
      example-only client.
    rel: adjacent_workflow
    sources:
      - https://github.com/cloudflare/quiche#readme
      - https://github.com/curl/curl/blob/master/docs/HTTP3.md
category: networking
package-manager:
  brew: cloudflare-quiche
package-manager-url: https://formulae.brew.sh/formula/cloudflare-quiche
license: BSD-2-Clause
tags:
  - cli
  - http3
  - networking
  - quic
  - rust
description: Savoury implementation of the QUIC transport protocol and HTTP/3
executables:
  - quiche-client
  - quiche-server
provenance:
  formula: cloudflare-quiche
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
