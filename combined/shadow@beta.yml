history:
  adoption-history:
    - >
      Shadow launched in France with a small team and community in 2016, then expanded
      its cloud-PC service into additional countries and client platforms.
    - >
      Official, Beta, and Alpha client channels allow progressively earlier testing. The
      Beta client is the final testing stage before features and fixes reach the
      recommended Official application.
  package-nerd-significance:
    - >
      Shadow PC separates the local client package from a persistent, remotely hosted
      Windows computer. Installing the cask provides the streaming client rather than
      the applications, games, and mutable data inside the cloud PC.
    - >
      The Beta cask is particularly relevant to early adopters because it packages a
      less-stable test channel whose features are intended to graduate into the
      frequently updated Official client.
  project-history:
    - >
      Shadow was founded in 2015 around the idea of streaming a high-end Windows PC to
      less-powerful local hardware. Its original product launched in France in 2016.
    - >
      The service expanded from a gaming-oriented proposition into a general cloud
      computer for games, creative work, productivity, and development. Shadow is
      chaired by OVHcloud founder Octave Klaba and uses partnerships including OVHcloud
      infrastructure.
  related-projects:
    - >
      The Shadow Beta and Alpha clients are pre-release channels for technology intended
      for the Official Shadow application.
    - >
      Game platforms such as Steam, GOG, Epic, Origin, and Battle.net can be installed
      inside the remote Windows PC, subject to publisher compatibility restrictions.
  sources:
    - https://shadow.tech/us/about-us/
    - https://shadow.tech/us/download/
    - >
      https://support.shadow.tech/hc/en-us/articles/32731845700881-Understanding-Shadow-Official-Beta-and-Alpha-Applications
    - https://support.shadow.tech/hc/en-us/articles/32731846560785-What-is-Shadow-PC
  summary:
    - >
      Shadow PC Beta is the pre-release client for Shadow's subscription cloud-PC
      service, which streams a remotely hosted Windows computer to local devices.
  timeline:
    - '2015: The company behind Shadow was created.'
    - '2016: Shadow officially launched its cloud-PC product in France.'
    - >
      2025: Official support documentation formalized the roles of the Official, Beta,
      and Alpha application channels.
  usage:
    - >
      Subscribers install the local client, sign in after their cloud PC is activated,
      configure streaming and peripheral settings, and launch the remote Windows
      desktop.
    - >
      The Beta application is intended for testing upcoming features and fixes and may
      contain bugs; Shadow recommends the Official channel when stability is the
      priority.
related-packages:
