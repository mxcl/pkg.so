id: brew:bibclean
display-name: bibclean
homepage: https://www.math.utah.edu/~beebe/software/bibclean/bibclean-03.html#HDR.3
repo: null
docs:
  - https://ftp.math.utah.edu/pub/bibclean
  - https://www.math.utah.edu/~beebe/software/bibclean/bibclean-03.html
config-file-location:
  unix:
    - $BIBCLEANINI
    - .bibcleanrc in $PATH
    - .bibcleanrc in $BIBINPUTS
    - <bibliography-file-basename>.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      The input metadata lists packages in Homebrew, Debian, MacPorts, Nix, and Ubuntu.
      Its packaging story follows TeX infrastructure habits: source archives and
      checksums upstream, distro formulas downstream, and command-line users integrating
      it into bibliography cleanup scripts.
  package-nerd-significance:
    - >
      bibclean is package-nerd archaeology in useful form: a specialized text normalizer
      with decades-old Unix documentation, multiple archive formats, checksums, and a
      job that still matters to anyone maintaining large BibTeX corpora. It is small,
      scriptable, and very much of the 'do one thing well' lineage.
  project-history:
    - >
      The official manual describes bibclean as a program that pretty-prints BibTeX
      input, checks brace balance and bibliography-entry syntax, and normalizes files so
      later filters and Emacs BibTeX support can process them predictably. The older
      1.05 manual page is dated 1992, while later official distribution pages list many
      releases through the 3.x series.
    - >
      The project predates today's GitHub-first release culture: the authoritative
      surface is a University of Utah web/FTP distribution with tar, zip, jar, zoo,
      checksum, and signed checksum files. The man page and distribution index document
      a long-running academic Unix tool rather than a modern hosted repository.
  related-projects:
    - >
      Related tools include BibTeX, Scribe bibliography files, Emacs BibTeX support, and
      companion bibliography filters named in the manual such as bibcheck, bibdup,
      bibextract, bibindex, bibjoin, biblook, biborder, bibsort, citefind, and citetags.
  sources:
    - https://ftp.math.utah.edu/pub/bibclean/
    - https://ftp.math.utah.edu/pub/bibclean/bibclean-1.05.html
    - https://www.math.utah.edu/~beebe/software/bibclean/bibclean-03.html
    - https://www.math.utah.edu/~beebe/software/bibclean/bibclean-06.html
    - https://www.math.utah.edu/~beebe/software/bibclean/bibclean.html
    - input.source_facts.package-manager
  summary:
    - >
      bibclean is Nelson H. F. Beebe's BibTeX and Scribe bibliography pretty-printer and
      syntax checker.
  timeline:
    - '1992: Version 1.05 manual page is dated 01 August 1992.'
    - '1998: Version 2.11.4 manual page is dated 09 May 1998.'
    - '2003-2023: The official distribution index records continued updates over two decades.'
    - '2020: The 3.x HTML manual material records version 3.05 dated 18 May 2020.'
    - '2023: The official distribution page lists bibclean 3.07 archives and a May 2023 update.'
  usage:
    - >
      bibclean formats each BibTeX entry into a consistent structure, expands tabs,
      splits long strings, normalizes author/editor names, checks CODEN/ISBN/ISSN
      values, and can use initialization files for options and field/pattern validation
      rules. It searches initialization files through the executable PATH, BIBINPUTS,
      explicit -init-file arguments, and file-specific .ini files.
related-packages:
  - id: brew:bib-tool
    reason: >
      Choose BibTool when bibliography maintenance also requires sorting, merging,
      selection, key generation, or rule-driven rewriting; retain bibclean for focused
      pretty-printing and syntax/value checks.
    rel: alternative
    sources:
      - https://www.math.utah.edu/~beebe/software/bibclean/bibclean-03.html
      - https://www.gerd-neugebauer.de/software/TeX/BibTool/en
  - id: brew:bibtex-tidy
    reason: >
      Choose bibtex-tidy for a modern formatter with browser, JavaScript, Docker, and
      pre-commit workflows; choose bibclean for its mature native checker and
      configurable initialization-pattern system.
    rel: alternative
    sources:
      - https://www.math.utah.edu/~beebe/software/bibclean/bibclean-06.html
      - https://github.com/FlamingTempura/bibtex-tidy#readme
category: productivity
package-manager:
  brew: bibclean
  debian: bibclean
  macports: bibclean
  nix: bibclean
  ubuntu: bibclean
package-manager-url: https://formulae.brew.sh/formula/bibclean
license: GPL-2.0-or-later
tags:
  - bibliography
  - bibtex
  - cli
  - formatter
  - syntax-checker
description: BibTeX bibliography file pretty printer and syntax checker
executables:
  - bibclean
  - bibclean-3.07
  - bibisbn
  - bibisbn-3.07
provenance:
  formula: bibclean
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
