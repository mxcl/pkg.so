id: brew:jackett
display-name: Jackett
homepage: https://github.com/Jackett/Jackett
repo: https://github.com/Jackett/Jackett
docs:
  - https://github.com/Jackett/Jackett/wiki
  - https://github.com/Jackett/Jackett#readme
config-file-location:
  linux: ~/.config/Jackett/
  macos:
    - ~/.config/Jackett/
    - ~/Library/Application Support/Jackett/
  windows: '%ProgramData%\Jackett\'
credentials-file-location: null
history:
  adoption-history:
    - >
      Jackett was adopted in the personal media automation ecosystem because Torznab
      gave applications a common search API while many trackers lacked a shared
      interface. Package metadata lists Homebrew, Alpine, Chocolatey, Nix, Scoop, and
      winget, and the README advertises Docker distribution through linuxserver/jackett,
      matching a self-hosted-service audience.
  package-nerd-significance:
    - >
      Jackett is package-nerd significant because it packages scraper churn as
      infrastructure. It turns hundreds of tracker-specific parsing rules into one
      service, making the real package surface an API contract, a config directory, and
      a rapid release cadence.
  project-history:
    - >
      The Jackett repository was created in 2015. Its README describes the project as a
      bridge between applications such as Sonarr, Radarr, Lidarr, qBittorrent, Mylar3,
      and other tools and a large maintained collection of torrent tracker integrations.
    - >
      Jackett grew around a simple but maintenance-heavy idea: keep tracker scraping and
      translation logic in one repository so client applications do not each need to
      implement every tracker. The README's supported-tracker sections and release feed
      show a project shaped by continual indexer maintenance rather than occasional
      large feature drops.
  related-projects:
    - >
      Related projects and protocols include Sonarr, Radarr, Lidarr, Mylar3,
      qBittorrent, Torznab, TorrentPotato, FlareSolverr, linuxserver/jackett, and
      tracker-specific indexer definitions.
  sources:
    - https://api.github.com/repos/Jackett/Jackett
    - https://api.github.com/repos/Jackett/Jackett/releases?per_page=20
    - https://formulae.brew.sh/formula/jackett
    - https://github.com/Jackett/Jackett
    - https://raw.githubusercontent.com/Jackett/Jackett/master/README.md
  summary:
    - >
      Jackett is a tracker-proxy service that translates requests from media automation
      and search applications into tracker-specific HTTP queries, then returns
      standardized Torznab or TorrentPotato results.
  timeline:
    - '2015: Jackett repository created.'
    - >
      2010s: Jackett became a bridge for Sonarr/Radarr-style media automation clients
      and torrent trackers.
    - '2020s: The project maintained broad OS, Docker, and package-manager distribution.'
    - '2026: The release feed shows frequent 0.24.x service releases.'
  usage:
    - >
      Users run the jackett service, configure tracker indexers, and point clients at
      local API URLs such as /api/v2.0/indexers/.../results/torznab with an API key. The
      README documents recent-upload feeds, searches, aggregate indexers, filters,
      Torznab query syntax, and tracker capability lookups.
related-packages: []
category: networking
package-manager:
  apk: jackett
  brew: jackett
  chocolatey: jackett
  nix: jackett
  scoop: extras/jackett
  winget: Jackett.Jackett
package-manager-url: https://formulae.brew.sh/formula/jackett
license: GPL-2.0-only
tags:
  - api
  - cli
  - indexers
  - proxy
  - torrent
  - torznab
description: API Support for your favorite torrent trackers
executables:
  - jackett
provenance:
  formula: jackett
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
