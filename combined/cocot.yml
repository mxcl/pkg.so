id: brew:cocot
display-name: cocot
homepage: https://vmi.jp/software/cygwin/cocot.html
repo: https://github.com/vmi/cocot
docs:
  - https://github.com/vmi/cocot#readme
  - https://vmi.jp/software/cygwin/cocot.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package appears in Unix package-manager culture as a small compatibility tool
      for terminals that still need Japanese legacy encoding conversion. The input
      records Homebrew, Fedora/dnf, and MacPorts package names.
  package-nerd-significance:
    - >
      cocot is interesting as a compact example of terminal-era encoding glue: small C
      code, iconv-oriented behavior, and long-tail packaging value for workflows that
      modern UTF-8 defaults did not fully erase.
  project-history:
    - >
      The upstream ChangeLog records a first release in 2002, early work around EUC-JP,
      Shift_JIS/CP932, ISO-2022-JP decoding, and later Unicode and East Asian Width
      updates. The project source moved to GitHub in 2009.
  related-projects:
    - >
      iconv and terminal emulators occupy the same problem space for character-set
      conversion and display behavior.
  sources:
    - https://github.com/vmi/cocot
    - https://raw.githubusercontent.com/vmi/cocot/master/ChangeLog
    - https://raw.githubusercontent.com/vmi/cocot/master/NEWS
    - source_facts.package-manager
  summary:
    - >
      cocot is a terminal code-conversion utility whose name expands to COde COnverter
      on Tty. It sits in a terminal workflow to translate character encodings for
      programs and remote sessions.
  timeline:
    - '2002: First release recorded in the upstream ChangeLog.'
    - '2004: Unicode support and patch merging appear in NEWS and ChangeLog.'
    - '2008: East Asian Width table update and --help/--version options appear in NEWS.'
    - '2009: ChangeLog records the source being pushed to github.com/vmi/cocot.'
    - '2017: Build scripts and warning fixes are recorded in the ChangeLog.'
  usage:
    - >
      Users run cocot around tty programs when the process encoding and terminal
      encoding differ, especially in CJK terminal environments.
related-packages:
  - id: brew:luit
    reason: >
      luit is the closest alternative because it performs bidirectional conversion
      between an application's locale encoding and a UTF-8 terminal; its official site
      explicitly identifies cocot as essentially the same concept.
    rel: alternative
    sources:
      - https://invisible-island.net/luit/
      - https://vmi.jp/software/cygwin/cocot.html
category: system
package-manager:
  brew: cocot
  dnf: cocot
  macports: cocot
package-manager-url: https://formulae.brew.sh/formula/cocot
license: BSD-3-Clause
tags:
  - character-encoding
  - cli
  - code-conversion
  - terminal
  - tty
description: Code converter on tty
executables:
  - cocot
provenance:
  formula: cocot
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
