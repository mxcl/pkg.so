id: brew:git-vendor
display-name: git-vendor
homepage: https://brettlangdon.github.io/git-vendor
repo: https://github.com/brettlangdon/git-vendor
docs:
  - https://github.com/brettlangdon/git-vendor#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-vendor spread through source installation, Homebrew, and other package-manager
      formulas. Its adoption niche was teams that wanted vendored source checked into a
      repository without relying on language-specific package managers.
  package-nerd-significance:
    - >
      The tool is significant in package-management history because it captures a
      pre-module and cross-language vendoring pattern: source is copied into the tree,
      but the Git history and vendor metadata preserve where that source came from.
  project-history:
    - >
      Brett Langdon created the git-vendor repository in January 2016. The README
      explains that the tool follows the Go vendoring convention of storing dependencies
      under vendor/ using fully qualified project paths.
    - >
      The project stayed close to git subtree. Later releases refined command behavior,
      including a 2022 release that added a push command through a community
      contribution.
  related-projects:
    - git subtree, Go vendor directories, Homebrew
  sources:
    - https://brettlangdon.github.io/git-vendor
    - https://formulae.brew.sh/formula/git-vendor
    - https://github.com/brettlangdon/git-vendor
    - https://github.com/brettlangdon/git-vendor/releases
    - https://raw.githubusercontent.com/brettlangdon/git-vendor/master/README.md
  summary:
    - >
      git-vendor is a shell Git command that wraps git subtree to add, list, update, and
      share vendored dependencies.
  timeline:
    - '2016: Repository created for a git subtree-based vendoring workflow.'
    - '2021: v1.2.x releases refined update behavior and portability.'
    - '2022: v1.3.0 added a push command.'
  usage:
    - >
      Practitioners use git vendor add to import a repository at a ref, git vendor list
      to inspect recorded source metadata, git vendor update to move a vendored
      dependency forward, and git vendor upstream to share changes back.
related-packages:
  - id: brew:git-subrepo
    reason: >
      Choose git-subrepo when you want embedded source to clone normally for downstream
      users while retaining a dedicated .gitrepo file and explicit pull/push
      synchronization commands.
    rel: alternative
    sources:
      - https://github.com/brettlangdon/git-vendor
      - https://github.com/ingydotnet/git-subrepo
      - https://github.com/ingydotnet/git-subrepo/wiki
category: developer-tools
package-manager:
  brew: git-vendor
  nix: git-vendor
package-manager-url: https://formulae.brew.sh/formula/git-vendor
license: MIT
tags:
  - cli
  - dependency-management
  - git-extension
  - vendoring
description: Command for managing git vendored dependencies
executables:
  - git-vendor
provenance:
  formula: git-vendor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
