id: brew:libversion
display-name: libversion
homepage: https://github.com/repology/libversion
repo: https://github.com/repology/libversion
docs:
  - https://github.com/repology/libversion
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libversion is used by Repology itself, and Repology's updater lists the Python
      libversion module, the C library, and a PostgreSQL libversion extension among its
      dependencies. That makes the library part of the machinery behind
      cross-distribution version tracking rather than a general end-user command.
  package-nerd-significance:
    - >
      Version ordering is one of the oldest package-manager traps. libversion is
      interesting because it treats packaging reality as the problem domain: upstreams
      encode prereleases, patches, and suffixes inconsistently, and repository
      comparison services need deterministic answers.
  project-history:
    - >
      The library was written by Dmitry Marakasov for the Repology ecosystem. Its README
      frames the core problem as comparing versions from different package repositories,
      where strings such as alpha, beta, rc, patch, post, and unusual separators need
      stable ordering rules.
  related-projects:
    - Repology uses libversion for software-version comparison across repositories.
    - >
      py-libversion, libversion-rs, golibversion, ruby-libversion, and other bindings or
      compatible implementations extend the same comparison model.
  sources:
    - https://github.com/repology/libversion
    - https://github.com/repology/repology-updater
    - https://raw.githubusercontent.com/repology/libversion/master/README.md
    - https://raw.githubusercontent.com/repology/repology-updater/master/README.md
  summary:
    - >
      libversion is Repology's C library for comparing messy software version strings,
      including prerelease markers, suffixes, separators, and package-repository
      conventions that simple lexical comparison gets wrong.
  timeline:
    - '1.0.0: First tagged major release line in the public repository.'
    - '2.0.0: Later tagged major release line in the public repository.'
    - '3.0.0: Later tagged major release line in the public repository.'
  usage:
    - >
      The library exposes C comparison functions, installs pkg-config and CMake
      integration files, and includes command-line utilities such as version_compare and
      version_sort for package-maintainer scripts or quick checks.
related-packages: []
category: developer-tools
package-manager:
  brew: libversion
  nix: libversion
  zypper: libversion
package-manager-url: https://formulae.brew.sh/formula/libversion
license: MIT
tags:
  - cli
  - library
  - version-comparison
  - version-sorting
description: Advanced version string comparison library
executables:
  - version_compare
  - version_sort
provenance:
  formula: libversion
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
