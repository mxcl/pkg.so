id: brew:monolith
display-name: Monolith
homepage: https://github.com/Y2Z/monolith
repo: https://github.com/Y2Z/monolith
docs:
  - https://github.com/Y2Z/monolith#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool appeared in developer and archiving circles by 2019, including a Show HN
      discussion where users compared it with MHTML, PDF archiving, and
      browser-extension approaches such as SingleFile. That discussion captures its
      practical tradeoff: it favors a static, portable HTML artifact that can be
      searched, copied, and archived, while browser-driven tools may be better for pages
      that require extensive JavaScript execution before capture.
  sources:
    - https://crates.io/crates/monolith
    - https://github.com/Y2Z/monolith
    - https://github.com/rhysd/monolith-of-web
    - https://news.ycombinator.com/item?id=20774322
  summary:
    - >
      Monolith is a Rust CLI and library for saving a web page as a single
      self-contained HTML document. The project README presents it as an alternative to
      the browser "Save page as" workflow: instead of writing an HTML file plus a
      directory of assets, Monolith embeds CSS, images, and JavaScript into one HTML5
      file for storage or sharing.
  usage:
    - >
      Monolith's ecosystem role stayed small and focused. It is distributed through
      Rust's crates.io ecosystem and package managers such as Homebrew, and it was
      important enough to be compiled into WebAssembly for the separate Monolith of Web
      Chrome extension. Users reach for it in scripts, personal archival workflows,
      data-hoarding setups, or reproducible captures where one file is easier to manage
      than a browser-generated folder tree.
related-packages:
  - id: brew:wget
    reason: >
      Choose GNU Wget for recursive site mirroring and directory-based offline copies;
      Monolith's own comparison emphasizes that it instead embeds one page's assets into
      a single portable document.
    rel: alternative
    sources:
      - https://github.com/Y2Z/monolith
      - https://www.gnu.org/software/wget/manual/wget.html
category: productivity
package-manager:
  apk: monolith
  brew: monolith
  macports: monolith
  nix: monolith
  pacman: monolith
  scoop: main/monolith
  winget: Y2Z.Monolith
package-manager-url: https://formulae.brew.sh/formula/monolith
license: CC0-1.0
tags:
  - cli
  - html
  - offline-reading
  - rust
  - web-archiving
description: CLI tool for saving complete web pages as a single HTML file
executables:
  - monolith
provenance:
  formula: monolith
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
