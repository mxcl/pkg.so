id: cask:osaurus
display-name: Osaurus
homepage: https://osaurus.ai/
repo: https://github.com/osaurus-ai/osaurus
docs:
  - https://docs.osaurus.ai/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Osaurus is distributed as a downloadable macOS disk image and Homebrew cask and
      requires Apple Silicon. Its compatibility endpoints allow software written for
      OpenAI, Anthropic, Ollama, and MCP interfaces to use local Osaurus services with
      limited integration changes.
  package-nerd-significance:
    - >
      Osaurus is notable as a native Swift alternative to Electron-based AI desktop
      tools and as an Apple-Silicon-focused local inference and agent runtime. For
      package and runtime enthusiasts, it combines MLX model serving, several compatible
      APIs, a command-line interface, MCP interoperability, and a versioned native
      plugin ABI in one installable application.
  project-history:
    - >
      Osaurus began as an MLX-based local LLM server for macOS and developed into a
      broader native AI harness providing agents, persistent memory, tools, local and
      cloud model routing, identity, automation, plugins, and compatible API servers.
      The project is developed in public under the MIT license.
  related-projects:
    - >
      Osaurus uses Apple’s MLX ecosystem for optimized local inference and supports
      Apple Foundation Models on compatible systems. It interoperates with OpenAI-,
      Anthropic-, Ollama-, and MCP-compatible clients and can connect to hosted
      providers when users opt in.
  sources:
    - https://docs.osaurus.ai/
    - https://github.com/osaurus-ai/osaurus
    - 'source_facts.version: 0.22.18'
  summary:
    - >
      Osaurus is an open-source native macOS AI harness and local model server. It
      combines MLX inference with agents, persistent memory, tools, plugins, automation,
      MCP support, and OpenAI-, Anthropic-, and Ollama-compatible APIs.
  timeline:
    - >
      2026: Official documentation describes Osaurus as a native AI harness extending
      beyond its local model-server role.
    - '2026: The supplied Homebrew cask record identifies version 0.22.18.'
  usage:
    - >
      Users install the app, create an agent, and choose a local Apple-Silicon model,
      Apple Foundation Model, or an optional cloud provider. Osaurus can be used through
      its native chat interface, command-line server, compatible HTTP APIs, MCP bridge,
      or plugin system. Official onboarding states that ordinary use requires no
      configuration files; cloud secrets and cryptographic identity are managed by the
      application rather than through a documented credentials file.
