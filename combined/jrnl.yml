id: brew:jrnl
display-name: jrnl
homepage: https://jrnl.sh/en/stable/
repo: https://github.com/jrnl-org/jrnl
docs:
  - https://jrnl.sh/en/stable
config-file-location:
  unix:
    - ~/.config/jrnl/jrnl.yaml
    - $XDG_CONFIG_HOME/jrnl/jrnl.yaml
  windows: '%USERPROFILE%\.config\jrnl\jrnl.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      jrnl has unusually broad distribution for a personal productivity CLI. The input
      batch records Homebrew, Fedora, MacPorts, Nix, Arch, and openSUSE packaging, while
      PyPI is the Python registry source. Homebrew analytics for the formula showed
      1,482 installs over the 365-day window reported by the formula API on 2026-07-01.
  package-nerd-significance:
    - >
      jrnl is a classic example of a Unix-style personal data tool: the core data
      remains readable text, while the CLI adds indexing, parsing, encryption, search,
      and export. Its longevity since 2012 and packaging across Python and OS package
      managers make it more culturally established than most small note-taking CLIs.
  project-history:
    - >
      The README copyright header identifies jrnl contributors from 2012 through 2023,
      and PyPI records a jrnl 0.3.0 upload on 2012-05-24. The project later moved under
      the jrnl-org GitHub organization, with maintainers and contributors called out in
      the README and funding routed through Open Collective.
  related-projects:
    - >
      jrnl is related to plain-text journaling, todo.txt-style personal data workflows,
      editor-driven note taking, encrypted local journals, and Python packaging through
      PyPI and pipx.
  sources:
    - https://formulae.brew.sh/api/formula/jrnl.json
    - https://github.com/jrnl-org/jrnl
    - https://github.com/jrnl-org/jrnl/blob/develop/CHANGELOG.md
    - https://jrnl.sh/en/stable
    - https://opencollective.com/jrnl
    - https://pypi.org/project/jrnl/
  summary:
    - >
      jrnl is a long-running command-line journal and note-taking application. It
      emphasizes natural-language entry, plain-text storage, search, tagging, multiple
      journals, and optional AES encryption.
  timeline:
    - '2012: PyPI recorded jrnl 0.3.0 on 2012-05-24.'
    - '2013: PyPI recorded jrnl 1.0.0 on 2013-03-04.'
    - >
      2023: The changelog recorded jrnl 4.0 on 2023-05-20 with breaking changes around
      Python support and encryption internals.
    - >
      2024: The changelog recorded jrnl 4.2 on 2024-11-17, including a calendar heatmap
      display format and Python 3.13 support.
    - >
      2026: The changelog recorded jrnl 4.3 on 2026-02-24 with Python 3.14 support and
      project build modernization.
  usage:
    - >
      A jrnl entry can be written directly on the command line with natural-language
      dates such as 'yesterday', or composed interactively or through an external
      editor. The project site emphasizes human-friendly input, future-proof plain-text
      journals, AES encryption, syncing with external tools, multiple journals, and
      exports such as JSON.
related-packages: []
category: productivity
package-manager:
  brew: jrnl
  dnf: jrnl
  macports: jrnl
  nix: jrnl
  pacman: jrnl
  zypper: jrnl
package-manager-url: https://formulae.brew.sh/formula/jrnl
license: GPL-3.0-only
tags:
  - cli
  - encryption
  - journal
  - notes
  - productivity
description: Command-line note taker
executables:
  - jrnl
provenance:
  formula: jrnl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
