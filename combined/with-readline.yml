id: brew:with-readline
display-name: with-readline
homepage: https://www.greenend.org.uk/rjk/sw/withreadline.html
repo: https://github.com/ewxrjk/with-readline
docs:
  - https://www.greenend.org.uk/rjk/sw/withreadline.html
config-file-location:
  unix: ~/.inputrc
credentials-file-location: null
history:
  project-history:
    - >
      The project dates back to at least 2005 according to its copyright notice, with
      later source releases and a GitHub mirror created in 2013. It is intentionally
      narrow software: a compatibility wrapper for terminal programs rather than a
      shell, terminal emulator, or application framework.
  sources:
    - https://api.github.com/repos/ewxrjk/with-readline
    - https://github.com/ewxrjk/with-readline
    - https://www.greenend.org.uk/rjk/sw/withreadline.html
  summary:
    - >
      with-readline is a small Unix utility by Richard Kettlewell that wraps arbitrary
      terminal programs with GNU Readline editing. Its homepage describes the original
      use case plainly: improve programs that do not themselves link Readline, such as
      adding line editing and history to an sftp session.
  usage:
    - >
      The package is useful in the old Unix tradition of wrapping one program with
      another to add interactive behavior. Its niche is strongest for simple
      command-line clients that read from a pseudo-terminal but lack editing
      conveniences; the project documentation notes testing on Linux and Mac OS X and
      possible portability to other Unix platforms.
category: developer-tools
package-manager:
  brew: with-readline
package-manager-url: https://formulae.brew.sh/formula/with-readline
license: GPL-2.0-or-later
tags:
  - cli
  - line-editing
  - readline
  - terminal
  - unix
description: Allow GNU Readline to be used with arbitrary programs
executables:
  - with-readline
provenance:
  formula: with-readline
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
