id: brew:kcat
display-name: kcat
homepage: https://github.com/edenhill/kcat
repo: https://github.com/edenhill/kcat
docs:
  - https://github.com/edenhill/kcat#readme
config-file-location:
  unix:
    - ~/.config/kcat.conf
    - ~/.config/kafkacat.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      kcat became widely packaged because it fills a common operational gap for Kafka
      clusters: quick CLI inspection and data movement. The batch input records packages
      across Homebrew, Debian, Ubuntu, Fedora, Alpine, MacPorts, and Nix, and the README
      documents package-manager installs and a Docker image.
  package-nerd-significance:
    - >
      kcat matters to package people because it is the small, scriptable Kafka tool that
      often gets installed beside kubectl, jq, and other operations CLIs. Its rename
      also created a packaging transition from kafkacat to kcat while retaining
      backward-compatible config paths for a period.
  project-history:
    - >
      Magnus Edenhill created the project in 2014 around librdkafka, giving Kafka
      operators a small native command-line client instead of requiring JVM tooling for
      quick production, consumption, metadata inspection, and scripting tasks.
    - >
      The project kept the kafkacat name through the 1.6 series and then renamed to kcat
      in the 1.7.0 release in August 2021 to follow Apache Software Foundation trademark
      policy. The changelog says the rename did not otherwise change the program.
  related-projects:
    - >
      kcat is built on librdkafka and can integrate with Confluent Schema Registry
      through Avro deserialization support.
  sources:
    - https://github.com/edenhill/kcat
    - https://github.com/edenhill/kcat/blob/master/CHANGELOG.md
    - https://github.com/edenhill/kcat/releases
    - https://github.com/edenhill/librdkafka
  summary:
    - >
      kcat is the Apache Kafka command-line producer and consumer formerly known as
      kafkacat. Its README describes it as a generic non-JVM client and a netcat-like
      tool for Kafka.
  timeline:
    - '2014-03-30: GitHub repository created.'
    - '2014-04-07: 1.0.0 release published.'
    - '2020-07-21: 1.6.0 added transactional producer support.'
    - '2021-08-23: 1.7.0 renamed kafkacat to kcat.'
    - '2024: 1.8.0 changelog entry documents mock cluster mode.'
  usage:
    - >
      Common usage includes producing messages from stdin or files, consuming topics and
      partitions to stdout, listing cluster metadata with -L, joining balanced consumer
      groups with -G, printing JSON envelopes, using Confluent Schema Registry for Avro
      decoding, and passing librdkafka configuration with -X or config files.
related-packages:
  - id: brew:kaf
    reason: >
      Choose Kaf when you want a kubectl-inspired interactive administration CLI with
      cluster profiles and first-class topic, node, and consumer-group inspection in
      addition to producing and consuming.
    rel: alternative
    sources:
      - https://github.com/edenhill/kcat#readme
      - https://github.com/birdayz/kaf
  - id: brew:kafkactl
    reason: >
      Choose kafkactl when Kafka administration is the priority: it adds contexts plus
      create, alter, delete, ACL, broker, user, and consumer-group management beyond
      kcat's lightweight data-transfer and inspection focus.
    rel: alternative
    sources:
      - https://github.com/edenhill/kcat#readme
      - https://deviceinsight.github.io/kafkactl/
category: data
package-manager:
  apk: kcat
  brew: kcat
  debian: kcat
  dnf: kcat
  macports: kcat
  nix: kcat
  ubuntu: kcat
package-manager-url: https://formulae.brew.sh/formula/kcat
license: BSD-2-Clause
tags:
  - cli
  - consumer
  - kafka
  - messaging
  - non-jvm
  - producer
description: Generic command-line non-JVM Apache Kafka producer and consumer
executables:
  - kcat
provenance:
  formula: kcat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
