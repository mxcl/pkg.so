id: brew:bedtools
display-name: bedtools
homepage: https://github.com/arq5x/bedtools2
repo: https://github.com/arq5x/bedtools2
docs:
  - https://bedtools.readthedocs.io/en/latest
  - https://github.com/arq5x/bedtools2#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied metadata shows bedtools packaged across Homebrew, Debian, Ubuntu,
      MacPorts, Nix, and other distribution indexes, reflecting broad adoption as a
      default genomics CLI dependency.
    - >
      bedtools adoption is also visible in downstream tooling: the README asks users to
      cite pybedtools separately, and the docs emphasize combining bedtools operations
      with Unix pipes for more sophisticated analyses.
  package-nerd-significance:
    - >
      bedtools is package-nerd significant because it is a canonical scientific Unix
      package: a suite of many small executables, stable command names, text formats,
      manpage-like docs, and enormous downstream workflow dependence.
    - >
      It also demonstrates the tension package managers handle for research software:
      upstream users expect old command aliases such as intersectBed and newer unified
      bedtools subcommands, while distributions need reproducible builds for C++
      genomics tooling that is commonly used in pipelines and papers.
    - >
      In the bioinformatics package graph, bedtools is not just an application; it is
      infrastructure. Other tools, workflow examples, papers, and wrappers often assume
      it exists on PATH.
  project-history:
    - >
      Aaron Quinlan first created bedtools in spring 2009 to answer genomics questions
      that were too slow or awkward with existing web tools and locally installed
      UCSC/Kent utilities. The official overview says the initial public version
      appeared in spring 2009 and originally supported only 6-column BED files.
    - >
      The project was described in the 2010 Bioinformatics paper 'BEDTools: a flexible
      suite of utilities for comparing genomic features.' The toolkit later expanded
      beyond BED to support BAM alignments, GFF, blocked BED, and VCF, while keeping the
      command-line pipeline model.
    - >
      The modern bedtools2 GitHub repository was created in December 2013. The README
      describes bedtools as the 'swiss army knife for genome arithmetic' and says it is
      maintained by the Quinlan Laboratory at the University of Virginia.
  related-projects:
    - >
      BEDOPS is a close peer focused on sorted-data performance, Starch compression, and
      scalable interval operations.
    - >
      pybedtools wraps bedtools functionality for Python users and has its own
      Bioinformatics citation.
    - >
      UCSC Genome Browser, Galaxy, and Kent source utilities are named in the official
      overview as predecessor tools that shaped bedtools' motivation.
  sources:
    - https://api.github.com/repos/arq5x/bedtools2
    - https://bedtools.readthedocs.io/en/latest/content/overview.html
    - https://github.com/arq5x/bedtools2#readme
    - https://github.com/arq5x/bedtools2/releases
    - source_facts.package-manager
  summary:
    - >
      bedtools is one of the standard command-line toolkits for genome arithmetic:
      set-theory style operations over BED, BAM, GFF/GTF, VCF, and related genomic
      interval data.
  timeline:
    - '2009: Initial public version released in spring 2009.'
    - '2010: BEDTools paper published in Bioinformatics.'
    - '2013: bedtools2 GitHub repository created.'
    - '2021: v2.30.0 release published.'
    - '2023: v2.31.1 release published.'
  usage:
    - >
      Common bedtools workflows include intersecting intervals, merging nearby features,
      computing coverage, extracting FASTA sequence, shuffling or randomizing intervals,
      generating genome coverage, mapping summaries over overlaps, and converting
      between BAM, BED, FASTQ, and other formats.
    - >
      The toolkit is designed for shell composition. The official overview highlights
      stdin support so users can stream multiple commands together and control exactly
      how overlap results are reported.
related-packages:
  - id: brew:bedops
    reason: >
      Choose BEDOPS when sorted-input scalability, its bedops/bedmap toolset, or
      Starch-oriented workflows are preferable; bedtools offers a broader familiar suite
      spanning BED, BAM, GFF, and VCF operations.
    rel: alternative
    sources:
      - https://bedtools.readthedocs.io/en/stable/
      - https://bedops.readthedocs.io/en/latest/
category: science
