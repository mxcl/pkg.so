id: brew:mypy
display-name: mypy
homepage: https://www.mypy-lang.org/
repo: https://github.com/python/mypy
docs:
  - https://mypy.readthedocs.io/
  - https://mypy-lang.org/
config-file-location:
  unix:
    - mypy.ini
    - .mypy.ini
    - pyproject.toml
    - setup.cfg
    - $XDG_CONFIG_HOME/mypy/config
    - ~/.config/mypy/config
    - ~/.mypy.ini
credentials-file-location: null
history:
  project-history:
    - >
      The technical turning point was the standardization of Python type hints. PEP 484
      defines the syntax and goals for type annotations in Python, explicitly naming
      offline type checkers such as mypy as a primary use case while keeping Python
      dynamically typed and type hints optional. The mypy blog described the first PEP
      484 draft as heavily inspired by mypy, and later mypy versions implemented the PEP
      484 annotation model used in Python codebases, editors, and CI systems.
  sources:
    - https://dropbox.tech/application/our-journey-to-type-checking-4-million-lines-of-python
    - https://formulae.brew.sh/formula/mypy
    - https://github.com/python/mypy
    - https://mypy-lang.blogspot.com/2015/01/mypy-and-pep-484-type-hinting-draft.html
    - https://mypy-lang.org/
    - https://mypy-lang.org/about.html
    - https://mypy.readthedocs.io/
    - https://peps.python.org/pep-0484/
  summary:
    - >
      mypy is an optional static type checker for Python. Jukka Lehtosalo began work on
      it in 2012 while at the University of Cambridge Computer Laboratory as a PhD
      student, borrowing ideas from his earlier Alore language and from gradual typing
      research. The project grew from an experiment in adding an optional static type
      system to Python-like code into the best-known standalone checker for ordinary
      Python programs.
  usage:
    - >
      Dropbox became a major adoption story and development home for mypy. A Dropbox
      engineering writeup describes its gradual migration to static checking across
      millions of lines of Python, calling mypy likely the most popular standalone
      Python type checker and noting that the core team was employed by Dropbox. In
      day-to-day use, developers add annotations in source files or stubs, run the
      `mypy` command to find type errors without executing the program, use `dmypy` for
      daemonized checks, and use helpers such as `stubgen`, `stubtest`, and `mypyc` for
      typing ecosystem work. Package managers ship it as a developer tool for Python
      projects that want static analysis without changing Python's runtime model.
related-packages:
  - id: brew:pyright
    reason: >
      Choose Pyright for a high-performance, standards-based checker with a first-party
      language-server and VS Code lineage; choose mypy for its mature Python-native CLI,
      plugin ecosystem, and stub tooling.
    rel: alternative
    sources:
      - https://github.com/microsoft/pyright/blob/main/README.md
      - https://mypy.readthedocs.io/en/stable/
  - id: brew:pyrefly
    reason: >
      Choose Pyrefly when very fast checking and an integrated language server are
      priorities, especially when migrating with its mypy-aware initialization tools;
      choose mypy for its longer-established standalone workflow.
    rel: alternative
    sources:
      - https://github.com/facebook/pyrefly
      - https://mypy.readthedocs.io/en/stable/
