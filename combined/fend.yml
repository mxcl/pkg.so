id: brew:fend
display-name: fend
homepage: https://printfn.github.io/fend
repo: https://github.com/printfn/fend
docs:
  - https://printfn.github.io/fend/manual
  - https://github.com/printfn/fend#readme
  - https://printfn.github.io/fend
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/fend/config.toml
    - ~/.config/fend/config.toml
  macos: ~/.config/fend/config.toml
  windows: '%USERPROFILE%\.config\fend\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents package-manager installation through Homebrew,
      MacPorts, AUR, AOSC OS, Void Linux xbps, Nix, Cargo, Windows Package Manager,
      Chocolatey, Scoop, and Pkgx, alongside manual binaries from GitHub releases.
    - >
      fend also appears beyond the CLI: the README lists the web interface, npm
      WebAssembly packages, a Telegram bot, and projects using fend such as MicroPad,
      Fendesk, metasearch2, FendApp, and Asleh.
  package-nerd-significance:
    - >
      fend is the sort of package nerds like because it replaces a pile of ad hoc shell,
      Python, bc, units, and browser-tab calculations with one small executable that
      understands dimensions and keeps exact arithmetic where possible.
    - >
      It also shows a modern packaging pattern for Rust tools: a single core used by
      CLI, web, Wasm, bot, and package-manager distributions, with release notes that
      track both mathematical correctness and platform packaging details.
  project-history:
    - >
      The GitHub release history starts with v0.1.0 on 2020-08-31. Early releases built
      up the calculator core, REPL behavior, history handling, terminal color,
      configuration support, and unit operations.
    - >
      By 2022, fend had added automatic currency exchange-rate downloads and file input.
      Later releases expanded into custom units, decimal separator options, roman
      numerals, number-to-words conversion, scripting-oriented print functions, web UI
      improvements, and more reliable exchange-rate sourcing.
    - >
      The 1.x series remains active. The changelog lists v1.5.8 on 2026-01-24, with
      fixes and improvements around TLS defaults, the interactive clear command,
      significant-figure rounding, pi precision, currency conversions, Turkish lira
      aliases, variable serialization, and performance.
  related-projects:
    - GNU units and Qalculate are adjacent unit-aware calculator tools.
    - bc, dc, and shell arithmetic cover narrower command-line calculator niches.
    - >
      fend-wasm and the fend web interface reuse the same project in browser and
      JavaScript-package contexts.
  sources:
    - https://github.com/printfn/fend
    - https://raw.githubusercontent.com/printfn/fend/main/README.md
    - https://printfn.github.io/fend/documentation/
    - https://raw.githubusercontent.com/printfn/fend/main/CHANGELOG.md
    - https://github.com/printfn/fend/releases
  summary:
    - >
      fend is an arbitrary-precision, unit-aware calculator available as a CLI, web app,
      Rust crate family, WebAssembly package, and packaged desktop/server-side tool.
  timeline:
    - '2020: v0.1.0 released on 2020-08-31.'
    - '2021: CLI config file support added.'
    - '2022: Up-to-date currency exchange-rate support added.'
    - '2023: Custom units in ~/.config/fend/config.toml added.'
    - >
      2024: Web UI rewrite, roman numerals, number-to-words, and locale-oriented decimal
      separator support land across 1.4.x releases.
    - '2026: v1.5.8 released on 2026-01-24.'
  usage:
    - >
      fend is used as a REPL or one-shot calculator for exact arithmetic, complex
      numbers, units, base conversion, dice notation, variables, trigonometric
      functions, strings, custom units, currency conversion, and small scripts.
    - >
      The manual documents a CLI configuration file at OS-specific paths, with options
      for colors, history length, prompt text, internet access, exchange-rate source,
      decimal separator style, custom units, and related behavior. It also stores
      command history under the user's state directory by default.
related-packages:
  - id: brew:libqalculate
    reason: >
      Choose libqalculate's `qalc` when you need broader symbolic algebra, plotting
      integration, and customizable functions; fend offers a smaller exact, unit-aware
      calculator workflow.
    rel: alternative
    sources:
      - https://printfn.github.io/fend/documentation/
      - https://qalculate.github.io/manual/index.html
  - id: brew:bc
    reason: >
      GNU bc is a narrower POSIX-style arbitrary-precision language suited to scripts,
      while fend adds units, conversions, complex numbers, and a richer interactive
      syntax.
    rel: alternative
    sources:
      - https://github.com/printfn/fend#readme
      - https://www.gnu.org/software/bc/manual/html_mono/bc.html
category: productivity
package-manager:
  brew: fend
  macports: fend
  nix: fend
  scoop: main/fend
  winget: printfn.fend
package-manager-url: https://formulae.brew.sh/formula/fend
license: MIT
tags:
  - arbitrary-precision
  - calculator
  - cli
  - rust
  - units
description: Arbitrary-precision unit-aware calculator
executables:
  - fend
provenance:
  formula: fend
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
