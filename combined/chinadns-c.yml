id: brew:chinadns-c
display-name: ChinaDNS-C
homepage: https://github.com/shadowsocks/ChinaDNS
repo: https://github.com/shadowsocks/ChinaDNS
docs:
  - https://github.com/shadowsocks/ChinaDNS#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream documented Linux/Unix builds, OpenWrt packaging, Tomato-router
      cross-compilation, and a Windows Python executable, which made the tool relevant
      beyond a single desktop formula. Homebrew packages the C port as chinadns-c and
      tracks the 1.3.2 release tarball.
  package-nerd-significance:
    - >
      For package people, chinadns-c is a compact example of network-circumvention
      software moving from router firmware workflows into general-purpose package
      managers, with Homebrew preserving a once-active C utility from the Shadowsocks
      orbit.
  project-history:
    - >
      The upstream repository started in 2014 and its README describes a DNS design that
      queries local resolvers for Chinese domains and foreign resolvers for foreign
      domains, using a relatively stable Chinese IP range file instead of fast-changing
      domain lists. The project is closely tied to the Shadowsocks-era anti-censorship
      tooling ecosystem and explicitly points users toward VPN software such as
      ShadowVPN for IP blocking.
  related-projects:
    - >
      The README names ShadowVPN as companion VPN software and dnsmasq as the
      recommended local DNS front end on OpenWrt. chnroute.txt generation is based on
      APNIC delegated address data.
  sources:
    - https://github.com/shadowsocks/ChinaDNS#readme
    - https://formulae.brew.sh/api/formula/chinadns-c.json
    - https://github.com/shadowsocks/ChinaDNS
  summary:
    - >
      ChinaDNS-C is the packaged C implementation of ChinaDNS, a small DNS forwarder
      built for networks affected by DNS poisoning and CDN split-horizon behavior.
  timeline:
    - '2014: First commits in the official ChinaDNS repository.'
    - '2014: 1.0.0 tag appears shortly after the initial import.'
    - >
      2015: README copyright and later 1.3.x tags show the mature C release line
      packaged by Homebrew.
    - '2026: Homebrew still exposes chinadns-c as a bottled formula at stable version 1.3.2.'
  usage:
    - >
      Typical use is running chinadns as a local UDP DNS server, often with dnsmasq on
      routers, with a chnroute.txt file generated from APNIC delegated address data and
      options such as DNS compression pointer mutation.
related-packages:
  - id: brew:dnsmasq
    reason: >
      ChinaDNS's official OpenWrt instructions strongly recommend using it as an
      upstream for dnsmasq, which adds local caching, TCP DNS handling, and the
      LAN-facing DNS service.
    rel: adjacent_workflow
    sources:
      - https://github.com/shadowsocks/ChinaDNS
      - https://thekelleys.org.uk/dnsmasq/doc.html
category: networking
package-manager:
  brew: chinadns-c
package-manager-url: https://formulae.brew.sh/formula/chinadns-c
license: GPL-3.0-or-later
tags:
  - c
  - cli
  - dns
  - dns-forwarder
  - dns-poisoning
  - networking
description: 'Port of ChinaDNS to C: fix irregularities with DNS in China'
executables:
  - chinadns
provenance:
  formula: chinadns-c
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
