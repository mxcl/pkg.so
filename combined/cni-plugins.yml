id: brew:cni-plugins
display-name: CNI plugins
homepage: https://www.cni.dev
repo: https://github.com/containernetworking/plugins
docs:
  - https://www.cni.dev/docs/spec
  - https://github.com/containernetworking/plugins#readme
  - https://www.cni.dev/plugins/current
config-file-location:
  linux: /etc/cni/net.d
credentials-file-location: null
history:
  adoption-history:
    - >
      CNI grew with the cloud-native container ecosystem because it gave runtimes a
      simple, vendor-neutral networking interface. CNCF's security self-assessment names
      Kubernetes, Mesos, CloudFoundry, CRI-O, and others as users, and this batch input
      records packaging across Homebrew, Nix, Arch, Scoop, openSUSE, Alpine, and other
      distributions.
  package-nerd-significance:
    - >
      Package nerds care because cni-plugins is infrastructure glue: tiny binaries with
      stable names that container runtimes expect to find on disk. Packaging it
      correctly matters more than its user interface, because the package quietly
      determines whether local Kubernetes, CRI-O, containerd, and lab container setups
      can create networks.
  project-history:
    - >
      CNI originated at CoreOS as part of rkt and became a CNCF-hosted project in 2017.
      The CNI specification defines the runtime-to-plugin interface, while the separate
      containernetworking/plugins repository maintains practical plugins such as bridge,
      loopback, macvlan, ptp, host-local, static, dhcp, portmap, bandwidth, tuning,
      firewall, and others.
  related-projects:
    - containernetworking/cni contains the specification, Go libraries, and cnitool.
    - >
      Kubernetes, CRI-O, containerd integrations, Calico, Cilium, Flannel, Weave, and
      other network projects sit around the CNI plugin ecosystem.
  sources:
    - https://www.cni.dev/
    - https://www.cni.dev/docs/
    - https://www.cni.dev/docs/spec/
    - https://github.com/containernetworking/plugins#readme
    - https://www.cncf.io/blog/2017/05/23/cncf-hosts-container-networking-interface-cni/
    - https://tag-security.cncf.io/community/assessments/projects/cni/self-assessment/
  summary:
    - >
      cni-plugins is the reference plugin collection for CNI, the Container Network
      Interface used by container runtimes and orchestrators to attach Linux and Windows
      containers to networks.
  timeline:
    - '2015: CNI spec v0.1.0 appears as the initial specification tag.'
    - '2017: CNCF announced hosting for Container Networking Interface.'
    - >
      2019: CNI maintainers presented introduction and deep-dive sessions at
      KubeCon/CloudNativeCon.
    - '2020: Spec v1.0.0 removed non-list configurations.'
    - '2024: cni-plugins 1.x releases continued reference-plugin maintenance.'
  usage:
    - >
      Administrators and runtimes place CNI network configuration on disk, commonly
      under /etc/cni/net.d on Linux, and invoke plugin binaries with CNI environment
      variables and JSON configuration. The plugin set supplies common
      interface-creating, IPAM, and meta plugins used directly or chained together.
related-packages:
  - id: brew:containerd
    reason: >
      containerd's official installation and CRI documentation explicitly use the CNI
      plugin binaries to provide container networking.
    rel: adjacent_workflow
    sources:
      - https://github.com/containerd/containerd/blob/main/docs/getting-started.md
      - https://containerd.io/docs/2.1/cri/config/
      - https://github.com/containernetworking/plugins#readme
category: networking
package-manager:
  apk: cni-plugins
  brew: cni-plugins
  debian: vlan
  dnf: dhcp-client
  macports: dhcp
  nix: cni-plugins
  pacman: cni-plugins
  scoop: main/cni-plugins
  ubuntu: vlan
  zypper: cni-plugins
package-manager-url: https://formulae.brew.sh/formula/cni-plugins
license: Apache-2.0
tags:
  - cli
  - cni
  - containers
  - kubernetes
  - networking
  - plugins
description: Container Network Interface plugins
executables:
  - bandwidth
  - dhcp
  - dummy
  - firewall
  - host-device
  - host-local
  - ipvlan
  - loopback
  - macvlan
  - portmap
  - ptp
  - sbr
  - static
  - tap
  - tuning
  - vlan
  - vrf
provenance:
  formula: cni-plugins
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
