history:
  adoption-history:
    - >
      Suite grew from a desktop-and-web hardware-wallet interface into Trezor's central
      application family, with desktop, browser, Android, and iOS experiences. Trezor
      recommends the installed desktop application for everyday use while retaining the
      web application for environments where installation is impractical.
    - >
      It is the default management surface for Trezor devices, while remaining
      interoperable with supported third-party wallets. Its public monorepo, signed
      releases, and reproducible verification guidance make the distribution channel
      especially important to security-conscious users.
  package-nerd-significance:
    - >
      Wallet software is unusually sensitive to package provenance. Trezor Suite is
      therefore notable for its open-source monorepo, signed downloadable builds,
      official verification instructions, and hardware-backed transaction confirmation.
      Package users should distinguish the authentic Suite binary from similarly named
      wallet software and should never enter wallet-backup words into the desktop or web
      app.
  project-history:
    - >
      Trezor began developing Suite as a unified replacement for a more fragmented
      collection of wallet interfaces and supporting components. The official repository
      records a public beta milestone in 2020.
    - >
      Suite subsequently became the official desktop and web interface for Trezor
      hardware wallets. The monorepo also encompasses Trezor Connect and Suite Mobile,
      reflecting the project's expansion from a desktop wallet manager into a
      multi-platform application ecosystem.
  related-projects:
    - Trezor hardware wallets
    - Trezor Connect
    - Trezor Suite Mobile
    - Trezor Bridge
    - Blockbook
  sources:
    - https://docs.trezor.io/trezor-suite/
    - https://github.com/trezor/trezor-suite
    - https://github.com/trezor/trezor-suite/milestones?state=closed
    - https://trezor.io/guides/trezor-suite
    - https://trezor.io/trezor-suite
  summary:
    - >
      Trezor Suite is Trezor's open-source application for initializing and managing
      Trezor hardware wallets, viewing portfolios, and sending, receiving, buying,
      selling, swapping, and staking supported assets.
  timeline:
    - '2020: The official repository tracked a public beta release milestone.'
    - >
      2021–present: Suite became Trezor's primary wallet-management interface and
      expanded across desktop, web, and mobile platforms.
  usage:
    - >
      Users connect a Trezor device, unlock it with its PIN, manage cryptocurrency
      accounts, review addresses and transactions, and confirm sensitive operations on
      the hardware wallet. Suite also supports portfolio viewing, account labeling, Tor
      routing, custom backends, firmware management, and a browser-based interface.
    - >
      Private keys remain protected by the hardware wallet; cryptocurrency itself
      remains on its blockchain. Wallet-backup words should be entered only on the
      Trezor device, never into Suite or a browser.
