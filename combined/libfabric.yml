id: brew:libfabric
display-name: libfabric
homepage: https://ofiwg.github.io/libfabric/
repo: https://github.com/ofiwg/libfabric
docs:
  - https://ofiwg.github.io/libfabric
  - https://ofiwg.github.io/libfabric/main/man
  - https://ofiwg.github.io/libfabric/main/man/fabric.7.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Open MPI documentation treats OFI and libfabric as interchangeable in practice and
      lists provider-backed networks such as AWS EFA, Cisco usNIC, Cray uGNI, Omni-Path,
      and HPE Slingshot. That made the package a common dependency on HPC systems and
      cloud HPC images.
    - >
      Homebrew, Debian, Fedora, Arch, Nix, Ubuntu, and SUSE-family packages ship
      libfabric or libfabric-bin tooling such as fi_info, fi_pingpong, and fi_strerror
      for discovering providers and testing fabric paths.
  package-nerd-significance:
    - >
      libfabric is package-nerd significant because it is the dependency that lets one
      MPI build speak many fast networks. It hides vendor transport churn behind
      provider packages while still preserving enough detail for HPC performance tuning.
  project-history:
    - >
      The OFI Working Group, a subgroup of the OpenFabrics Alliance, develops libfabric
      as an open framework for fabric communication services. The project's release
      notes identify version 1.0.0 on May 3, 2015 as the initial public release, with
      PSM, sockets, usNIC, and verbs providers.
    - >
      The project evolved from a 1.x provider framework into a 2.x series while
      retaining the same role: giving MPI, SHMEM, PGAS runtimes, and distributed systems
      software a common user-space API across InfiniBand, Ethernet/RDMA,
      provider-specific HPC networks, and cloud fabrics.
  related-projects:
    - >
      Related projects include Open MPI's OFI MTL/BTL support, fabtests, OpenFabrics
      Alliance work, AWS EFA, Cisco usNIC, HPE Slingshot, Omni-Path, InfiniBand verbs,
      and HPC communication runtimes.
  sources:
    - https://docs.open-mpi.org/en/v5.0.6/tuning-apps/networking/ofi.html
    - https://ofiwg.github.io/libfabric/
    - https://raw.githubusercontent.com/ofiwg/libfabric/main/NEWS.md
    - https://raw.githubusercontent.com/ofiwg/libfabric/main/README.md
    - https://www.openfabrics.org/openfabrics-interfaces/
    - >
      https://www.openfabrics.org/the-openfabrics-alliance-announces-the-release-of-libfabric-v2-0-0/
  summary:
    - >
      libfabric, also called OpenFabrics Interfaces, is a low-level communications
      library for high-performance parallel and distributed applications. It abstracts
      high-bandwidth, low-latency fabrics behind provider implementations while exposing
      APIs tuned for HPC middleware.
  timeline:
    - >
      2015-05-03: libfabric 1.0.0 initial public release with PSM, sockets, usNIC, and
      verbs providers.
    - '2020-08: OpenFabrics mailing list announced libfabric 1.11.0 and fabtests.'
    - '2024-12: OpenFabrics announced libfabric 2.0.0.'
    - >
      2026-06-22: libfabric 2.6.0 release notes record continued provider and core
      development.
  usage:
    - >
      Users install libfabric directly for fi_info and fabtests, or indirectly through
      MPI and communication runtimes. Developers use its man pages and provider model to
      choose endpoint types, completion queues, address vectors, memory registration
      behavior, and transport-specific capabilities.
related-packages:
  - id: brew:open-mpi
    reason: >
      Use Open MPI with libfabric for MPI communication over supported OFI fabrics; Open
      MPI documents dedicated OFI MTL and BTL components and their provider
      requirements.
    rel: adjacent_workflow
    sources:
      - https://docs.open-mpi.org/en/main/tuning-apps/networking/ofi.html
      - https://ofiwg.github.io/libfabric/
category: networking
