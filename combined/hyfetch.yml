id: brew:hyfetch
display-name: HyFetch
homepage: https://github.com/hykilpikonna/hyfetch
repo: https://github.com/hykilpikonna/hyfetch
docs:
  - https://github.com/hykilpikonna/hyfetch/tree/master/docs
  - https://github.com/hykilpikonna/hyfetch#readme
config-file-location:
  unix: ~/.config/hyfetch.json
credentials-file-location: null
history:
  adoption-history:
    - >
      HyFetch moved from Python packaging into system package managers. The README
      documents PyPI, pipx, uv, Cargo, Arch, Fedora, Nix, Guix, Slackware, Homebrew,
      openSUSE, Gentoo, Debian, and Ubuntu installation paths, while the Homebrew
      formula gives it a standard `brew install hyfetch` entry point.
  package-nerd-significance:
    - >
      HyFetch matters to package nerds because it is both a culture-aware fork and a
      practical continuation point for a beloved terminal toy. It tracks distro art,
      package-manager quirks, terminal color behavior, and backend compatibility, which
      are exactly the kinds of small portability details that make fetch tools fun and
      annoying to maintain.
  project-history:
    - >
      The project began as a Python package around the familiar neofetch workflow: run a
      command, display system facts, and render distribution art in terminal colors. Its
      README positions the project both as pride-themed HyFetch and as an maintained
      neofetch-derived implementation after the upstream neofetch repository was
      archived.
    - >
      The release history shows a long 1.x line with distro-logo, flag, packaging, and
      shell-integration work. The 1.99.0 release marked the end of the Python-first line
      and the transition toward Rust and fastfetch-oriented backends; the 2.0.1 release
      described the Rust rewrite and added backends such as macchina.
  related-projects:
    - >
      HyFetch is directly related to neofetch and neowofetch, and its backend story
      connects it to fastfetch and macchina.
  sources:
    - https://api.github.com/repos/hykilpikonna/hyfetch/releases?per_page=100
    - https://formulae.brew.sh/formula/hyfetch
    - https://github.com/hykilpikonna/hyfetch
    - https://raw.githubusercontent.com/hykilpikonna/hyfetch/master/README.md
  summary:
    - >
      HyFetch is a terminal system-information tool descended from the neofetch
      ecosystem, adding LGBTQ+ pride-flag color schemes while keeping a path for users
      who want an updated neofetch-style command through neowofetch.
  timeline:
    - '2022: 1.0.x releases published on GitHub.'
    - >
      2023: 1.4.11 notes documented Debian, openSUSE, Homebrew, Gentoo, and lure.sh
      packaging work.
    - '2024: 1.99.0 marked the final Python-first release line and the transition toward Rust.'
    - '2025: 2.0.1 introduced the Rust rewrite.'
    - '2026: 2.1.0 expanded distro logos, pride presets, and backend behavior.'
  usage:
    - >
      The first-run experience asks users to select a color system and flag preset, then
      stores preferences in `~/.config/hyfetch.json`. Users can run `hyfetch` for
      pride-themed output or `neowofetch` when they want the neofetch-style output
      without pride colors.
related-packages:
  - id: brew:fastfetch
    reason: >
      HyFetch can use Fastfetch as its information-gathering backend, pairing HyFetch's
      pride-themed presentation with Fastfetch's maintained, performance-oriented system
      detection.
    rel: adjacent_workflow
    sources:
      - https://github.com/hykilpikonna/hyfetch
      - https://github.com/fastfetch-cli/fastfetch
category: system
package-manager:
  apk: hyfetch
  brew: hyfetch
  debian: hyfetch
  dnf: hyfetch
  macports: hyfetch
  nix: hyfetch
  pacman: hyfetch
  ubuntu: hyfetch
  zypper: hyfetch
package-manager-url: https://formulae.brew.sh/formula/hyfetch
license: MIT
tags:
  - cli
  - neofetch
  - pride-flags
  - rust
  - system-information
  - terminal
description: Fast, highly customisable system info script with LGBTQ+ pride flags
executables:
  - hyfetch
  - hyfetch.rs
  - hyfetch.v1
  - neowofetch
provenance:
  formula: hyfetch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
