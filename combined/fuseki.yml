id: brew:fuseki
display-name: Apache Jena Fuseki
homepage: https://jena.apache.org/documentation/fuseki2/
repo: https://github.com/apache/jena
docs:
  - https://jena.apache.org/documentation
  - https://jena.apache.org/documentation/fuseki2/index.html
config-file-location:
  unix:
    - $FUSEKI_BASE/config.ttl
    - $FUSEKI_BASE/configuration/
credentials-file-location:
  unix: $FUSEKI_BASE/shiro.ini
history:
  adoption-history:
    - >
      Jena's own history page says the project has been extensively used in a wide
      variety of Semantic Web applications and demonstrators. Fuseki is the
      deployment-oriented piece of that stack, giving RDF and SPARQL users a server
      rather than only Java APIs and command-line tools.
    - >
      Its adoption follows standards adoption: Fuseki exposes W3C SPARQL 1.1 protocols
      and Graph Store HTTP RDF Update, so it became a package for running
      standards-compliant RDF endpoints in development, research, and production
      Semantic Web systems.
  package-nerd-significance:
    - >
      Fuseki matters to package people because it is the installable server boundary for
      Jena: a Java Semantic Web framework becomes a service with ports, config
      directories, security files, persistent stores, and command-line launchers. It is
      also a good example of an Apache project where a language library, server
      distribution, Maven artifacts, and OS packages all describe the same upstream.
  project-history:
    - >
      Jena began at HP Labs in Bristol in 2000 as an open-source Java framework for
      Semantic Web applications. Apache's Jena history page says HP reduced direct
      development support in 2009, the project applied to enter the Apache Software
      Foundation in November 2010, and Jena graduated as an Apache top-level project in
      April 2012.
    - >
      Fuseki grew as the server-facing distribution within Jena: the Fuseki
      documentation presents it as the SPARQL server integrated with TDB for robust
      transactional persistent storage and with Jena text query. The Jena downloads page
      packages Apache Jena and Apache Jena Fuseki as the two binary distributions for
      the most commonly used portions of the system.
  related-projects:
    - >
      Fuseki is part of Apache Jena and is closely related to Jena ARQ, TDB/TDB2, RDF
      Connection, Jena text query, and GeoSPARQL modules.
    - >
      Its security documentation depends on Apache Shiro, and its network role is
      defined by W3C SPARQL and RDF graph-store protocols.
  sources:
    - https://github.com/apache/jena
    - https://jena.apache.org/about_jena/about.html
    - https://jena.apache.org/documentation/fuseki2/fuseki-configuration.html
    - https://jena.apache.org/documentation/fuseki2/fuseki-security.html
    - https://jena.apache.org/documentation/fuseki2/index.html
    - https://jena.apache.org/download/index.cgi
  summary:
    - >
      Apache Jena Fuseki is the SPARQL server component of Apache Jena. The official
      Fuseki documentation describes it as a server that can run standalone or embedded
      and provides SPARQL 1.1 query, update, and graph-store protocols.
  timeline:
    - '2000: Jena development starts at HP Labs in Bristol.'
    - '2009: HP refocuses development activity away from direct Jena support.'
    - '2010: Jena is adopted into the Apache Software Foundation incubator.'
    - '2012: Jena graduates as an Apache top-level project.'
    - >
      Current docs: Fuseki is documented as the Jena SPARQL server with TDB integration
      and Shiro-based webapp security.
  usage:
    - >
      Fuseki can be run as a standalone server, as a service, as a web application, in a
      plain mode, or embedded in another application. Configuration can come from
      `$FUSEKI_BASE/configuration/`, the system database, `$FUSEKI_BASE/config.ttl`, or
      command-line and programmatic setup depending on the Fuseki mode.
    - >
      Security for the Fuseki2 web application uses Apache Shiro, controlled by
      `$FUSEKI_BASE/shiro.ini`. The documentation notes that if the file is absent the
      server initializes with a default configuration that can be replaced or edited.
related-packages:
  - id: brew:jena
    reason: >
      Install Apache Jena alongside Fuseki when you also need the RDF APIs, ARQ SPARQL
      engine, TDB tools, and command-line utilities used to prepare or inspect data
      served by Fuseki.
    rel: adjacent_workflow
    sources:
      - https://jena.apache.org/download/
      - https://jena.apache.org/
category: data
package-manager:
  brew: fuseki
package-manager-url: https://formulae.brew.sh/formula/fuseki
license: Apache-2.0
tags:
  - cli
  - jena
  - rdf
  - semantic-web
  - server
  - sparql
description: SPARQL server
executables:
  - fuseki-backup
  - fuseki-plain
  - fuseki-server
provenance:
  formula: fuseki
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
