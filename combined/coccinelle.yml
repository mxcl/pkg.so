  brew: coccinelle
  debian: coccinelle
  dnf: coccinelle
  macports: coccinelle
  nix: coccinelle
  ubuntu: coccinelle
  zypper: coccinelle
package-manager-url: https://formulae.brew.sh/formula/coccinelle
license: GPL-2.0-only
tags:
