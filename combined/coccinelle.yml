id: brew:coccinelle
display-name: Coccinelle
homepage: https://coccinelle.gitlabpages.inria.fr/website/
repo: https://gitlab.inria.fr/coccinelle/coccinelle
docs:
  - https://coccinelle.gitlabpages.inria.fr/website/docs/index.html
  - https://coccinelle.gitlabpages.inria.fr/website/documentation.html
  - https://coccinelle.gitlabpages.inria.fr/website
config-file-location:
  unix:
    - ~/.cocciconfig
    - ./.cocciconfig
    - <dir passed with --dir>/.cocciconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      Coccinelle's strongest adoption signal is Linux itself. The upstream Linux
      documentation has a dedicated Coccinelle page, describes the `make coccicheck`
      target, and says the semantic patches in the kernel require Coccinelle 1.0.0-rc11
      or newer.
    - >
      The Linux documentation also lists distribution availability through Debian,
      Fedora, Ubuntu, OpenSUSE, Arch Linux, Gentoo, NetBSD, and FreeBSD, while the input
      adds Homebrew, MacPorts, Nix, apk, dnf, and zypper.
  package-nerd-significance:
    - >
      Coccinelle is one of the more historically interesting developer-tool packages
      because it turns program transformation research into a packaged Unix CLI used by
      real infrastructure projects.
    - >
      For package maintainers, it is a cross-distribution systems-code tool with an
      OCaml heritage, a Linux-kernel integration point, and a command (`spatch`) whose
      usefulness depends on both the executable and a corpus of semantic patches.
  project-history:
    - >
      The official INRIA site describes Coccinelle as a tool originally targeted at
      collateral evolutions in Linux: source-code updates required when library APIs
      change. It broadened from that origin into finding and fixing bugs in systems
      code.
    - >
      The project has long had a research and systems-programming identity. The official
      site links papers, workshops, Linux impact pages, and SmPL grammar documentation,
      while the current GitLab project is hosted under INRIA.
  related-projects:
    - Linux kernel `coccicheck` is the most visible related integration.
    - SmPL is the project-specific semantic patch language.
    - >
      The Rust-for-Linux Coccinelle-for-Rust work is linked from the official site as a
      related direction.
  sources:
    - https://coccinelle.gitlabpages.inria.fr/website/
    - https://coccinelle.gitlabpages.inria.fr/website/docs/index.html
    - https://coccinelle.gitlabpages.inria.fr/website/docs/main_grammar015.html
    - https://coccinelle.gitlabpages.inria.fr/website/impact_linux.html
    - >
      https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/Documentation/dev-tools/coccinelle.rst
    - >
      https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/scripts/coccicheck
  summary:
    - >
      Coccinelle is a program matching and transformation engine for C code, centered on
      SmPL, the Semantic Patch Language. In package-manager culture it is best known as
      the `spatch` tool used for large C tree transformations, especially in Linux
      kernel development.
  timeline:
    - '2005: Official site HTML carries an early creation marker.'
    - '2009: Official site lists the first Coccinelle Users Day.'
    - >
      2010: Linux kernel Coccinelle documentation and coccicheck script carry 2010
      copyright notices.
    - '2010: Official site links Coccinelle at the 2010 kernel summit.'
    - '2020: Current INRIA GitLab project created.'
    - '2021: SmPL grammar documentation lists version 1.1.0 and date June 21, 2021.'
  usage:
    - >
      The main executable is `spatch`. Users write semantic patches in SmPL and run them
      over a file, directory, or source tree to report matches or propose
      transformations.
    - >
      In the Linux kernel workflow, `make coccicheck MODE=report` reports matches and
      `MODE=patch` proposes fixes. The kernel script wires Coccinelle into the build
      tree through `scripts/coccicheck` and `scripts/coccinelle`.
    - >
      Coccinelle supports `.cocciconfig` files in the user's home directory, the current
      directory, and the directory passed with `--dir`, letting users set preferred
      `spatch` options.
related-packages: []
category: developer-tools
