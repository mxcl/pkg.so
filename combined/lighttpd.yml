  apk: lighttpd
  brew: lighttpd
  debian: lighttpd
  dnf: lighttpd
  macports: lighttpd
  nix: lighttpd
  pacman: lighttpd
  scoop: extras/lighttpd
  ubuntu: lighttpd
  zypper: lighttpd
package-manager-url: https://formulae.brew.sh/formula/lighttpd
license: BSD-3-Clause
