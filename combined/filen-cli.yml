id: brew:filen-cli
display-name: Filen CLI
homepage: https://filen.io
repo: https://github.com/FilenCloudDienste/filen-cli
docs:
  - https://docs.filen.io/docs/cli
  - https://docs.filen.io/docs/cli/access-filen-drive
  - https://docs.filen.io/docs/cli/authenticating
config-file-location: null
credentials-file-location:
  unix:
    - ./.filen-cli-credentials
    - ./.filen-cli-auth-config
history:
  adoption-history:
    - >
      Filen CLI's adoption is tied to Filen users who need automation beyond the desktop
      and web apps: headless servers, scripted sync jobs, container deployments, and
      protocol gateways.
    - >
      Its distribution channels include official GitHub release binaries, a Linux/macOS
      install script, Docker images, npm, Homebrew, Nix, and winget, giving it a
      package-manager footprint beyond the Filen app itself.
    - >
      The sunset notice makes the package historically transitional: useful and
      packaged, but expected to give way to the Rust CLI once that rewrite becomes the
      maintained path.
  package-nerd-significance:
    - >
      Filen CLI is interesting to package maintainers because it packages a
      cloud-storage service client as a cross-platform CLI with release binaries, npm
      distribution, Docker images, and native package-manager entries.
    - >
      It also shows a common lifecycle wrinkle: the packaged implementation can be
      official and useful while upstream already signals the next implementation line,
      in this case a Rust rewrite.
  project-history:
    - >
      The public Filen CLI repository was created in 2024 for Windows, macOS, and Linux.
      Its README describes a toolset for interacting with Filen Drive in stateless or
      interactive mode, syncing locations, mounting a network drive, and running WebDAV
      or S3 mirror servers.
    - >
      The first public GitHub release, v0.0.1, was published in May 2024. Subsequent
      0.0.x releases through 2024 iterated quickly on the CLI distribution.
    - >
      The README now warns that this CLI is being sunset so the team can focus on a Rust
      rewrite in the filen-rs repository, citing startup performance, download size, and
      simpler future development as the reasons.
  related-projects:
    - >
      Filen CLI belongs to the Filen encrypted storage ecosystem and is related to Filen
      Drive, Filen desktop/mobile clients, WebDAV/S3 gateway workflows, Docker images,
      and the filen-rs Rust rewrite.
    - >
      It occupies a similar operational niche to cloud-storage CLIs such as rclone, but
      its scope is official access to Filen-specific encrypted storage.
  sources:
    - https://github.com/FilenCloudDienste/filen-cli
    - https://github.com/FilenCloudDienste/filen-cli/releases
    - https://github.com/FilenCloudDienste/filen-rs/tree/main/filen-cli
    - https://docs.filen.io/docs/cli
    - https://docs.filen.io/docs/cli/authenticating
    - https://docs.filen.io/docs/cli/access-filen-drive
  summary:
    - >
      Filen CLI is the command-line companion for Filen's end-to-end encrypted cloud
      storage service, covering drive access, sync, WebDAV, S3 mirroring, and headless
      workflows.
    - >
      For package users, it is the bridge between a consumer-facing encrypted storage
      service and scriptable Unix-style automation.
  timeline:
    - '2024-04: Public filen-cli repository created.'
    - '2024-05: v0.0.1 GitHub release published.'
    - '2024-11: v0.0.20 tag committed in the early release line.'
    - >
      2025: Repository activity continues while README points users toward v0.0.36 as a
      supported CLI release.
    - '2025: README announces sunsetting of this CLI in favor of a Rust rewrite under filen-rs.'
  usage:
    - >
      Typical usage starts with authentication, producing local credential/auth files,
      then running commands for sync, drive access, WebDAV, S3, or update management.
    - >
      Because Filen is encrypted cloud storage, the CLI is especially useful where users
      want private storage in automated jobs without using a graphical client.
    - >
      The package exposes a `filen` executable, and the README points users to built-in
      help with `filen --help <cmd or topic>` plus official hosted CLI documentation.
related-packages: []
category: cloud-infrastructure
package-manager:
  brew: filen-cli
  nix: filen-cli
  winget: FilenCloud.Filen-cli
package-manager-url: https://formulae.brew.sh/formula/filen-cli
license: AGPL-3.0-or-later
tags:
  - cli
  - cloud-storage
  - encrypted-storage
  - s3
  - sync
  - webdav
description: Interface with Filen, an end-to-end encrypted cloud storage service
executables:
  - filen
provenance:
  formula: filen-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
