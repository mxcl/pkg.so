id: brew:gcc@14
display-name: GCC 14
homepage: https://gcc.gnu.org/
repo: https://gcc.gnu.org/git/gcc.git
docs:
  - https://gcc.gnu.org/install
  - https://gcc.gnu.org/onlinedocs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GCC became widely adopted because it was both the GNU system compiler and an
      openly developed, portable optimizing compiler. The current mission statement
      emphasizes support for many platforms, many architectures, open mailing lists, and
      participation by individuals and companies.
    - >
      The GCC 14 package represents package-manager demand for a stable major compiler
      series rather than only the newest compiler. Official release branches and tags
      make these major lines easy for distributors and users to pin, audit, and rebuild.
  package-nerd-significance:
    - >
      Versioned GCC packages matter because compilers are infrastructure, not leaf
      applications. A build may need a particular major GCC for language support,
      libstdc++ behavior, Fortran ABI expectations, sanitizer behavior, or target
      support, while another project on the same machine needs a different line.
    - >
      The official Git repository page documents release branches and release tags,
      which is exactly the provenance package maintainers need when mapping formula
      names such as gcc@12 or gcc@15 to upstream source history.
  project-history:
    - >
      GCC began as the GNU C Compiler. The GCC project history records the first beta
      release on March 22, 1987, by Richard Stallman, originally for the GNU operating
      system and initially centered on C.
    - >
      During the 1990s, GCC grew beyond C into a multi-language compiler suite. The
      official GCC 2.95 page notes that the name changed from GNU C Compiler to GNU
      Compiler Collection because the compiler supported several languages beyond C.
    - >
      A major governance and development milestone was the EGCS fork in 1997, created to
      merge active GCC development work from several communities. GCC and EGCS were
      reunified in April 1999, and GCC 2.95 was the first release after that
      reunification.
  related-projects:
    - EGCS is the historically important GCC fork that was later reunified with GCC.
    - >
      Related components within the GCC distribution include libstdc++, GFortran,
      GOMP/libgomp, GCC Go, GDC, GM2, and newer front ends documented on the official
      GCC site.
    - >
      GCC is part of the wider GNU toolchain ecosystem and is commonly used with
      source-control, build, and generated-file tooling such as Git, Autoconf, Bison,
      Automake, Xgettext, and Gperf, all mentioned in GCC source-tree documentation.
  sources:
    - https://gcc.gnu.org/
    - https://gcc.gnu.org/gcc-14/changes.html
    - https://gcc.gnu.org/gccmission.html
    - https://gcc.gnu.org/git.html
    - https://gcc.gnu.org/releases.html
    - https://gcc.gnu.org/wiki/History
  summary:
    - >
      GCC 14 is a versioned Homebrew package for the GCC 14 release series of the GNU
      Compiler Collection. It provides the GNU Project compiler suite under
      major-version-suffixed command names so it can coexist with other GCC lines and
      platform compilers.
    - >
      GCC itself is one of the central free-software toolchains: the official project
      describes it as the GNU Compiler Collection, with front ends for C, C++,
      Objective-C, Fortran, Ada, Go, D, Modula-2, COBOL, Rust, and Algol 68, plus
      runtime libraries such as libstdc++.
  timeline:
    - '1987: First GCC beta release as the GNU C Compiler'
    - '1997: EGCS fork announced as an experimental GCC development project'
    - '1999: GCC and EGCS reunified; GCC 2.95 released after reunification'
    - '2024: GCC 14.1 released on May 7'
    - '2026: GCC 14.4 released on June 26'
  usage:
    - >
      As packaged here, GCC 14 exposes version-suffixed compiler tools such as gcc-14,
      g++-14, cpp-14, gcov-14, and gfortran-14, depending on the platform package. This
      lets users select the intended compiler line explicitly in build scripts.
    - >
      Official GCC installation documentation covers downloading sources, configuring,
      building, testing, and final installation, while the online manuals document
      compiler invocation, language front ends, runtime libraries, and toolchain
      options.
    - >
      The GCC 14 change notes emphasize hardening and runtime behavior changes,
      including -fhardened, hardened control-flow redundancy, host PIE/bind-now
      configure options, and improved OpenMP/OpenACC offload support.
related-packages:
  - id: brew:llvm
    reason: >
      Choose LLVM/Clang for a production C-family compiler with a modular tooling
      architecture and substantial GCC command-line compatibility; GCC 14 remains
      preferable when GNU-specific extensions, its other language front ends, or its
      runtime ecosystem are required.
    rel: alternative
    sources:
      - https://clang.llvm.org/
      - https://clang.llvm.org/docs/UsersManual.html
      - https://gcc.gnu.org/
  - id: brew:binutils
    reason: >
      GNU Binutils supplies assemblers, linkers, archivers, and other target tools that
      GCC documents as part of native and cross-compiler construction workflows.
    rel: adjacent_workflow
    sources:
      - https://gcc.gnu.org/install/download.html
      - https://gcc.gnu.org/install/build.html
      - https://www.gnu.org/software/binutils/binutils.html
