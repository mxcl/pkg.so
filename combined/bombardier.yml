id: brew:bombardier
display-name: bombardier
homepage: https://github.com/codesenberg/bombardier
repo: https://github.com/codesenberg/bombardier
docs:
  - https://github.com/codesenberg/bombardier#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bombardier spread primarily through developer package managers rather than a large
      framework ecosystem. The input package metadata lists Homebrew, Debian, Ubuntu,
      Fedora, MacPorts, Nix, and Scoop coverage, which is typical for a practical CLI
      used by operators and backend developers on multiple platforms.
  package-nerd-significance:
    - >
      For package nerds, bombardier is a good example of the Go single-binary CLI wave:
      small upstream, easy cross-platform packaging, and valuable enough to appear in
      many package indexes. Its fasthttp versus net/http switch also captures the
      classic benchmark-tool tension between maximum throughput and protocol fidelity.
  project-history:
    - >
      The public repository history starts in May 2016 with an initial HTTP benchmarking
      implementation. Early tags moved quickly through v0.x releases in 2016, and the
      project later reached v1.x as a stable single-purpose benchmark utility.
    - >
      The README documents a notable v1.1-era change: users could choose the net/http
      client in addition to fasthttp, trading some raw performance for HTTP/2 support
      and more standard HTTP behavior. The v2.0 series appeared in 2025 after the
      project had already become a small but established package-manager staple.
  related-projects:
    - fasthttp is a central implementation dependency called out by the README.
    - >
      Go's net/http client is the alternative client path documented for HTTP/2 and
      standards-sensitive tests.
    - Comparable HTTP benchmark CLIs include ApacheBench, wrk, and hey.
  sources:
    - https://github.com/codesenberg/bombardier#readme
    - https://github.com/codesenberg/bombardier/releases
    - source_facts.package-manager
  summary:
    - >
      bombardier is a Go-based HTTP(S) benchmarking command-line tool, positioned as a
      compact load generator for quick web-service performance checks. Its README
      emphasizes fasthttp as the default client for speed, with later support for Go's
      net/http client when HTTP/2 or stricter RFC behavior is needed.
  timeline:
    - '2016-05-29: Initial public commits for the HTTP benchmarking tool.'
    - '2016-05-29: v0.1 tag appears in the Git repository.'
    - '2016-10-26: v0.5 tag appears after several early 2016 releases.'
    - '2020-10-15: v1.2.5 tag shows continued maintenance after the initial release period.'
    - '2025-02-23: v2.0 and v2.0.1 tags appear.'
    - '2025-03-04: v2.0.2 tag appears.'
  usage:
    - >
      The usual workflow is to run bombardier with a connection count, request count or
      duration, and URL, then inspect request rate, latency distribution, HTTP status
      counts, errors, and throughput. It fills the same quick-check niche as tools such
      as ab, wrk, and hey.
related-packages:
  - id: brew:oha
    reason: >
      Choose oha when you want the same HTTP load-generation workflow with a live
      terminal UI, HTTP/3 support, coordinated-omission correction, or per-request CSV
      output.
    rel: alternative
    sources:
      - https://github.com/codesenberg/bombardier#readme
      - https://github.com/hatoo/oha#readme
category: networking
