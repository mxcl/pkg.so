id: brew:container-compose
display-name: Container-Compose
homepage: https://github.com/mcrich23/container-compose
repo: https://github.com/Mcrich23/container-compose
docs:
  - https://github.com/Mcrich23/container-compose#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official sources do not publish an adopter list. The README positions Homebrew as
      the recommended installation path, suggesting its main distribution story is
      convenience for macOS users experimenting with Apple Container and Compose files.
  package-nerd-significance:
    - >
      The package is notable because it sits at a boundary between established Docker
      Compose file conventions and Apple's newer container stack. In package-manager
      terms, it turns a new platform-specific runtime into something approachable with
      existing Compose project layouts.
  project-history:
    - >
      The project describes itself as limited Docker Compose support for Apple Container
      rather than a wrapper around Docker or Docker Compose. Official releases began
      with 0.1.0 in June 2025 and reached 1.0.0 in June 2026.
  related-projects:
    - >
      Container-Compose is explicitly related to Apple Container and to Docker Compose
      file workflows, while its README states it is not a Docker or Docker Compose
      wrapper.
  sources:
    - https://github.com/Mcrich23/container-compose#readme
    - https://github.com/Mcrich23/Container-Compose/releases/tag/0.1.0
    - https://github.com/Mcrich23/Container-Compose/releases/tag/1.0.0
  summary:
    - >
      Container-Compose is a Swift CLI that maps familiar Docker Compose-style workflows
      onto Apple's `container` tool. Its history is short and closely follows the
      appearance of Apple Container in the macOS container-tooling ecosystem.
  timeline:
    - '2025: 0.1.0 release published.'
    - '2026: 1.0.0 release published.'
  usage:
    - >
      The CLI reads `docker-compose.yml`-style files, supports `.env` input, and starts
      multi-service applications through Apple Container. This makes it a compatibility
      bridge for developers carrying Compose habits into Apple's native container
      runtime.
category: cloud-infrastructure
package-manager:
  brew: container-compose
  macports: container-compose
package-manager-url: https://formulae.brew.sh/formula/container-compose
license: Apache-2.0
tags:
  - apple-container
  - cli
  - containers
  - docker-compose
  - swift
description: Manage Apple Container with Docker Compose files
executables:
  - container-compose
provenance:
  formula: container-compose
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
