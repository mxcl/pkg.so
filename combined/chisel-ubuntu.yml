id: brew:chisel-ubuntu
display-name: Chisel
homepage: https://github.com/canonical/chisel
repo: https://github.com/canonical/chisel
docs:
  - https://documentation.ubuntu.com/chisel/latest
config-file-location:
  unix:
    - <chisel-release>/chisel.yaml
    - <chisel-release>/slices/<package-name>.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Chisel is part of the Ubuntu family and is used alongside the centrally maintained
      chisel-releases definitions. Canonical documents it as a tool for creating smaller
      and less exposed container and system images; Ubuntu Core 26 also adopted a
      Chisel-based image composition system.
  package-nerd-significance:
    - >
      Chisel applies package-manager metadata at file-level granularity: instead of
      installing an entire Debian package, users select predefined package slices. This
      is significant for minimal containers and immutable systems because it retains
      Ubuntu archive provenance while sharply reducing filesystem contents.
  project-history:
    - >
      Canonical developed Chisel to extract selected files from Ubuntu Debian packages
      into purpose-built root filesystems. The tool pairs with the chisel-releases
      repository, whose Ubuntu-release branches contain `chisel.yaml` archive
      definitions and per-package slice definition files.
  related-projects:
    - Ubuntu archives
    - chisel-releases
    - Rockcraft
    - Ubuntu Core
  sources:
    - https://documentation.ubuntu.com/chisel/latest/
    - https://documentation.ubuntu.com/chisel/latest/reference/chisel-releases/
    - https://documentation.ubuntu.com/core/uc26/
    - https://github.com/canonical/chisel/releases
  summary:
    - >
      Chisel is Canonical's command-line tool for building minimal Ubuntu root
      filesystems by installing only selected slices of Debian packages.
  timeline:
    - >
      v1.0.0: Introduced a compressed manifest recording installed slices and added the
      `info` command.
    - 'v1.4.0: Introduced the v3 release format and architecture-specific essentials.'
    - '2026: Ubuntu Core 26 adopted Chisel-based image composition.'
  usage:
    - >
      Use `chisel cut` with an Ubuntu release, destination root, and one or more
      package-slice names. By default Chisel consults the official chisel-releases
      repository; a local or custom release definition may be supplied when maintaining
      private slice sets.
related-packages:
  - id: brew:rockcraft
    reason: >
      Rockcraft directly consumes Chisel package slices through `stage-packages`, making
      it the documented companion for turning sliced Ubuntu content into minimal OCI
      images.
    rel: adjacent_workflow
    sources:
      - https://documentation.ubuntu.com/rockcraft/latest/explanation/chisel/
      - https://documentation.ubuntu.com/rockcraft/latest/how-to/chiseling/install-slice/
category: developer-tools
package-manager:
  brew: chisel-ubuntu
  nix: chisel
  scoop: main/chisel
  winget: Snesnopic.Chisel
package-manager-url: https://formulae.brew.sh/formula/chisel-ubuntu
license: AGPL-3.0-only
tags:
  - cli
  - containers
  - debian-packages
  - minimal-rootfs
  - package-slices
  - supply-chain
  - ubuntu
description: Carve and cut Debian packages into slices
executables:
  - chisel
provenance:
  formula: chisel-ubuntu
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
