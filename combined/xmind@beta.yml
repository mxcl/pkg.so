id: cask:xmind@beta
display-name: Xmind Beta
homepage: https://www.xmind.net/
repo: null
docs:
  - https://xmind.com/help
  - https://xmind.com/user-guide
  - https://xmind.com/user-guide/intro-new
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Xmind's official history describes a long-running cross-platform product that
      gained mainstream recognition, including a 2013 mind-mapping popularity award and
      an Apple App of the Day distinction.
    - >
      The beta cask gives macOS package users access to prerelease builds of the same
      commercial product family while retaining Homebrew's managed installation
      workflow.
  package-nerd-significance:
    - >
      Xmind is a prominent example of a polished proprietary graphical productivity
      application distributed through Homebrew Cask. Its beta package is useful to users
      who want reproducible installation of the prerelease channel rather than manually
      managing vendor downloads.
    - >
      The project's evolution from an open-source edition to a commercial cross-platform
      application illustrates how package catalogs can preserve convenient installation
      even when the contemporary desktop client has no public source repository.
  project-history:
    - >
      Xmind dates its founding to 2006 and says it introduced an open-source edition in
      2008. The product later expanded beyond conventional mind maps into outlining,
      presentations, collaboration, project-oriented features, and AI-assisted
      workflows.
    - >
      A 2022 brand update changed the styling from XMind to Xmind and described an
      effort to make mind mapping more approachable. The current product supports
      desktop and mobile platforms.
  related-projects:
    - XMind 8 is maintained as a legacy product line.
    - Xmind AI capabilities were incorporated into the broader Xmind product experience.
  sources:
    - https://xmind.com/about
    - https://xmind.com/blog/xmind-branding-upgrade
    - https://xmind.com/blog/xmind-ui-design-now-is-open-source
    - https://xmind.com/user-guide/intro-new
  summary:
    - >
      Xmind Beta is the prerelease channel of Xmind, a commercial cross-platform
      application for mind mapping, brainstorming, outlining, presentation, and
      structured planning.
  timeline:
    - '2006: Xmind was founded.'
    - '2008: Xmind introduced an open-source edition.'
    - '2013: Xmind received a prominent mind-mapping popularity award.'
    - '2022: The company introduced the Xmind brand styling.'
    - '2024: Xmind and Xmind AI were presented as one product experience.'
  usage:
    - >
      Users create mind maps from multiple structures, organize ideas in an outliner,
      brainstorm, plan projects, and present maps through Pitch Mode. The beta package
      is intended for early access to changes and may be less stable than the production
      channel.
related-packages:
  - id: cask:freeplane
    reason: >
      Choose Freeplane for a free, open-source, scriptable mind-mapping application with
      local .mm files; choose Xmind Beta for early access to Xmind's polished commercial
      workflow.
    rel: alternative
    sources:
