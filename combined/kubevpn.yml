id: brew:kubevpn
display-name: KubeVPN
homepage: https://www.kubevpn.dev
repo: https://github.com/kubenetworks/kubevpn
docs:
  - https://kubevpn.dev/docs
config-file-location: null
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      KubeVPN is packaged for Homebrew, Scoop, Nix, Snap, GitHub Releases, and Krew.
      That packaging footprint is the main visible adoption signal: it targets
      developers who want cluster-network access without hand-configuring VPN routes,
      port-forward chains, or ad hoc proxy scripts.
  package-nerd-significance:
    - >
      For package collectors, KubeVPN sits in the family of Kubernetes inner-loop tools
      alongside Telepresence-style interceptors and krew plugins. Its packaging across
      Homebrew and Krew is notable because it treats a cluster networking workflow as a
      single developer CLI rather than as a collection of kubectl port-forward sessions.
  project-history:
    - >
      The project is developed under the kubenetworks organization and is written as a
      Go command-line tool. Its documentation frames the tool around a cloud-native
      development loop: connect to the Kubernetes network, resolve services and pods
      from the local machine, and optionally intercept service traffic so local code can
      participate in a cluster-like environment.
  related-projects:
    - >
      KubeVPN is related to Kubernetes, kubectl, Krew, service-mesh traffic interception
      tools, and local-cluster development tools such as Telepresence.
  sources:
    - https://artifacthub.io/packages/krew/kubevpn/kubevpn
    - https://github.com/kubenetworks/kubevpn
    - https://github.com/kubenetworks/kubevpn/releases
    - https://kubevpn.dev/docs/quickstart/
  summary:
    - >
      KubeVPN is a Kubernetes-focused local-development CLI that connects a developer
      machine to a cluster network and routes traffic between local processes and
      in-cluster services.
  timeline:
    - >
      2020s: KubeVPN appears as a kubenetworks Go CLI for Kubernetes local development
      and service-network access.
    - >
      2020s: The project documents installs through Homebrew, Snap, Scoop, Krew, and
      GitHub release archives.
    - >
      2025: GitHub release pages show automated v2.x binary releases for macOS, Linux,
      and Windows.
  usage:
    - >
      Typical usage starts with `kubevpn connect`, which deploys cluster-side
      traffic-manager resources, configures routes and DNS on the developer machine, and
      lets local tools access services through Kubernetes names or service IPs. The
      README and quickstart also describe inbound interception and running a pod
      workload locally with cluster-like network, volume, and environment behavior.
related-packages:
  - id: brew:helm
    reason: >
      Helm can preinstall and manage KubeVPN's in-cluster traffic-manager chart, while
      the KubeVPN CLI handles developer connections and traffic interception.
    rel: adjacent_workflow
    sources:
      - https://kubevpn.dev/docs/quickstart/
      - https://helm.sh/docs/
category: cloud-infrastructure
package-manager:
  brew: kubevpn
  nix: kubevpn
  scoop: extras/kubevpn
package-manager-url: https://formulae.brew.sh/formula/kubevpn
license: MIT
tags:
  - cli
  - development-environment
  - kubernetes
  - networking
  - service-proxy
description: Offers a Cloud-Native Dev Environment that connects to your K8s cluster network
executables:
  - kubevpn
provenance:
  formula: kubevpn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
