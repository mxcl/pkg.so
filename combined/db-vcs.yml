id: brew:db-vcs
display-name: db-vcs
homepage: https://github.com/infostreams/db
repo: https://github.com/infostreams/db
docs:
  - https://github.com/infostreams/db#readme
config-file-location:
  unix: <project-root>/.db/config
credentials-file-location:
  unix: <project-root>/.db/config
history:
  adoption-history:
    - >
      The upstream README documents Homebrew as the macOS installation path and direct
      cloning for Linux and other systems. That pattern points to a niche developer-tool
      audience: people who want a lightweight snapshot workflow around migrations and
      environment refreshes rather than a full migration framework.
  package-nerd-significance:
    - >
      The package is notable as a Unixy database helper: it wraps mysqldump-style
      operations in a project repository model, leaves credentials in a predictable
      ignored file, and exposes everything as simple subcommands. It appeals to package
      users who prefer shell tools and visible files over a service-backed database
      workflow.
  project-history:
    - >
      The GitHub repository was created in April 2019 and the README frames the tool as
      MySQL-only for now, with extension points for other database systems left as a
      possibility. Its first public tags, 1.0 and 1.1, are visible in the official
      repository tag list.
  related-projects:
    - >
      db-vcs overlaps with database migration and dump tools, but its README positions
      it around snapshots, restores, imports, exports, and repository-style history
      rather than schema-only migration management.
  sources:
    - https://github.com/infostreams/db
    - https://raw.githubusercontent.com/infostreams/db/master/readme.md
    - https://api.github.com/repos/infostreams/db
  summary:
    - >
      db-vcs is a small command-line tool for saving, restoring, and archiving MySQL
      database snapshots in a project-local repository. It treats database dumps as
      artifacts that can be named, loaded, exported, and inspected from the shell.
  timeline:
    - '2019: Official GitHub repository was created.'
    - '2019: Tag 1.0 appears in the official repository.'
    - '2019: Tag 1.1 appears in the official repository.'
  usage:
    - >
      A typical db-vcs workflow starts with db init, which creates a .db repository in
      the project root and records connection details. Users then run commands such as
      db save, db load, db export, db import, db structure, and db log to move database
      dumps through development, staging, and local recovery scenarios.
related-packages:
  - id: brew:dbmate
    reason: >
      Use Dbmate alongside db-vcs to apply versioned SQL schema migrations while
      retaining db-vcs snapshots for restoring data if a migration goes wrong.
    rel: adjacent_workflow
    sources:
      - https://github.com/infostreams/db#readme
      - https://github.com/amacneil/dbmate#readme
category: developer-tools
package-manager:
  apk: db
  brew: db-vcs
  nix: db
  pacman: db
  zypper: libdb-4_8
package-manager-url: https://formulae.brew.sh/formula/db-vcs
license: MIT
tags:
  - cli
  - database
  - mysql
  - schema-management
  - version-control
description: Version control for MySQL databases
executables:
  - db
provenance:
  formula: db-vcs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
