id: brew:clpbar
display-name: Command Line Progress Bar
homepage: https://clpbar.sourceforge.net/
repo: null
docs:
  - https://clpbar.sourceforge.net/
  - https://sourceforge.net/projects/clpbar
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official SourceForge project records the project as a Linux/BSD command-line
      tool registered in 2003 and last updated in 2012.
    - >
      The input package facts show continued package-manager availability through
      Homebrew and MacPorts.
  package-nerd-significance:
    - >
      clpbar is package-manager preservation of a focused SourceForge-era Unix utility:
      tiny, pipeline-friendly, and useful without changing the producer or consumer
      commands.
  project-history:
    - >
      The official homepage describes Bar as a stream-copying program that reports
      transfer amount, throughput, transfer time, estimated remaining time, percentage
      complete, and a progress bar on stderr.
    - >
      The same homepage says the tool was originally written to estimate large network
      transfers, usually in SSH and tar pipelines.
  related-projects:
    - >
      The official homepage documents clpbar itself and links to SourceForge downloads
      and Doxygen output; no official source-control repository page was found.
  sources:
    - https://clpbar.sourceforge.net/
    - https://sourceforge.net/projects/clpbar
    - source_facts.package-manager
  summary:
    - >
      Command Line Progress Bar, packaged as clpbar, is a small C command-line utility
      by Michael Peek for showing progress while copying a data stream.
  timeline:
    - '2003: SourceForge project registered.'
    - '2012: SourceForge project page lists the last update as September 14, 2012.'
  usage:
    - >
      Users insert clpbar into Unix pipelines so stdin is forwarded to stdout while
      progress information is emitted to stderr.
related-packages:
  - id: brew:pv
    reason: >
      Choose pv for the same pipeline-progress task when you also need maintained flow
      controls, process monitoring, multiple coordinated displays, or extensive output
      formatting.
    rel: alternative
    sources:
      - https://www.ivarch.com/programs/pv.shtml
      - https://www.ivarch.com/programs/quickref/pv.shtml
      - https://clpbar.sourceforge.net/
category: developer-tools
package-manager:
  brew: clpbar
  macports: clpbar
package-manager-url: https://formulae.brew.sh/formula/clpbar
license: GPL-2.0-or-later
tags:
  - c
  - cli
  - data-transfer
  - progress-bar
  - terminal
  - unix-pipeline
description: Command-line progress bar
executables:
  - clpbar
provenance:
  formula: clpbar
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
