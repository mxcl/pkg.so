homepage: https://www.j3e.de/linux/convmv/
repo: null
docs:
  - https://www.j3e.de/linux/convmv/man
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      convmv became a standard sysadmin package because it solves a narrow migration
      problem common to old Unix and network filesystems: moving filenames from legacy
      8-bit encodings, Samba-era client code pages, or filesystem-specific Unicode forms
      into UTF-8-oriented environments.
  package-nerd-significance:
    - >
      For package managers, convmv is a classic small Unix utility: no daemon, no
      credentials, no config file, portable Perl implementation, and usefulness that
      spans Linux, macOS, Samba, Netatalk, Dovecot, and mounted filesystems.
  project-history:
    - >
      The official project directory exposes a long-running tarball history, with early
      0.3 and 1.x archives visible in the index and newer 2.x releases continuing
      through 2.06 in 2025. The man page explains the tool around Unix filename
      encoding, normalization, and filesystem interoperability rather than application
      data conversion.
  related-projects:
    - >
      The man page discusses interoperability with filesystem and service ecosystems
      including HFS+, APFS, NFSv4, FAT/VFAT/NTFS, Samba, Netatalk, and Dovecot.
  sources:
    - https://www.j3e.de/linux/convmv/
    - https://www.j3e.de/linux/convmv/man/
    - https://formulae.brew.sh/formula/convmv
  summary:
    - >
      convmv is a Perl command-line utility for converting filenames from one character
      encoding to another without changing file contents.
  timeline:
    - '2006-11-23: Official archive index lists convmv 0.3 and 1.0-era tarballs.'
    - '2015-05-16: Official archive index lists convmv 2.0.'
    - '2018-03-26: Official archive index lists convmv 2.05.'
    - '2025-02-27: Official archive index lists convmv 2.06 and refreshed man-page directory.'
  usage:
    - >
      Typical use specifies source and target encodings with `-f` and `-t`, optionally
      recurses with `-r`, and only performs real renames when `--notest` is supplied.
      The default dry-run behavior is part of why distributions can ship it as a safer
      filesystem repair tool.
