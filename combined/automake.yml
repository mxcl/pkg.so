id: brew:automake
display-name: GNU Automake
homepage: https://www.gnu.org/software/automake/
repo: https://git.savannah.gnu.org/cgit/automake.git
docs:
  - https://www.gnu.org/software/automake/manual/automake.html
config-file-location:
  unix:
    - Makefile.am
    - configure.ac
credentials-file-location: null
history:
  adoption-history:
    - >
      Automake's adoption is tied to the spread of Autotools as the default build
      machinery for GNU packages and many non-GNU Unix projects. The batch input lists
      Automake in Homebrew, Debian/Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix, and
      openSUSE, reflecting how standard it is in development environments.
    - >
      For package managers, Automake is both a direct package and a build dependency.
      Formulae and distro recipes often need specific automake/aclocal versions when
      regenerating build files, especially for projects that ship old Autotools
      metadata.
  package-nerd-significance:
    - >
      Automake is historically important because it standardized a huge amount of
      portable Unix build behavior into generated makefiles. Package nerds care because
      Autotools failures often reduce to Automake version expectations, missing m4
      macros, stale generated files, or distribution tarball rules.
    - >
      It is also a compatibility artifact: even projects migrating to Meson, CMake, or
      language-native build systems may carry old Automake releases in package histories
      and bootstrap scripts.
  project-history:
    - >
      Automake was written to reduce the burden of maintaining large, portable
      Makefile.in templates by hand. Its official manual history credits the early
      project to Tom Tromey and describes Automake as part of the GNU build system
      alongside Autoconf and Libtool.
    - >
      The Automake manual frames the package around Makefile.am files, configure.ac, GNU
      Coding Standards conventions, and generated Makefile.in output. Over time it
      absorbed a large catalog of conventions for recursive builds, installed programs,
      libraries, tests, distribution tarballs, Texinfo, gettext, and portability checks.
    - >
      Because Automake generates files consumed by configure and make, it became a
      maintainer-side tool in many projects: release tarballs often include generated
      Makefile.in files so end users do not need Automake, while developers building
      from VCS do.
  related-projects:
    - >
      GNU Autoconf generates configure scripts that pair with Automake-generated
      Makefile.in files.
    - GNU Libtool handles portable library-building concerns commonly used with Automake.
    - >
      autoreconf orchestrates regeneration of Autotools files and often invokes aclocal
      and automake.
  sources:
    - https://git.savannah.gnu.org/cgit/automake.git
    - https://www.gnu.org/software/automake/
    - https://www.gnu.org/software/automake/manual/automake.html
    - source_facts.package-manager
  summary:
    - >
      GNU Automake is one of the core GNU Autotools. It generates portable, GNU
      Standards-oriented Makefile.in files from maintainer-written Makefile.am input,
      sitting between Autoconf's configure scripts and make's build execution.
  timeline:
    - >
      1990s: Automake emerges in the GNU build-system ecosystem to generate Makefile.in
      files from Makefile.am.
    - >
      2000s: Automake becomes a normal dependency for maintainers building GNU and Unix
      projects from source control.
    - '2020s: Automake remains packaged broadly as part of standard developer-tool stacks.'
  usage:
    - >
      Maintainers write Makefile.am files and a configure.ac script, run aclocal and
      automake as part of the autoreconf/bootstrap flow, and ship or build from
      generated Makefile.in files. Users normally encounter automake indirectly through
      autoreconf, ./configure, and make.
    - >
      The official curation correctly treats Makefile.am and configure.ac as the
      package's relevant configuration/build-input files; Automake has no credentials
      file.
related-packages:
  - id: brew:autoconf
    reason: >
      Automake assumes an Autoconf-based project and shares configure.ac with Autoconf,
      so maintainers normally use both when regenerating an Autotools build system.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/automake/manual/html_node/Introduction.html
      - https://www.gnu.org/software/automake/manual/html_node/Creating-amhello.html
  - id: brew:libtool
    reason: >
      Use GNU Libtool alongside Automake when the project needs portable shared-library
      targets and linking rules integrated into Makefile.am.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/libtool/manual/libtool.html
      - https://www.gnu.org/software/libtool/manual/html_node/Using-Automake.html
category: developer-tools
package-manager:
  apk: automake
  brew: automake
  debian: automake
  dnf: automake
  macports: automake
  nix: automake
  pacman: automake
  ubuntu: automake
  zypper: automake
package-manager-url: https://formulae.brew.sh/formula/automake
license: GPL-2.0-or-later
tags:
  - autotools
  - build-system
  - cli
  - gnu
  - makefile-generator
description: Tool for generating GNU Standards-compliant Makefiles
executables:
  - aclocal
  - aclocal-1.18
  - automake
  - automake-1.18
provenance:
  formula: automake
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
