id: brew:cline
display-name: Cline
homepage: https://cline.bot
repo: https://github.com/cline/cline
docs:
  - https://docs.cline.bot/cli/cli-reference
  - https://docs.cline.bot/cline-overview
  - https://docs.cline.bot/getting-started/config
  - https://docs.cline.bot/usage/cli-overview
config-file-location:
  unix:
    - ~/.cline/
    - ~/.cline/data/settings/providers.json
    - ~/.cline/data/settings/global-settings.json
    - ~/.cline/data/settings/cline_mcp_settings.json
    - .cline/
    - .clineignore
credentials-file-location:
  unix: ~/.cline/data/settings/providers.json
history:
  adoption-history:
    - >
      Cline's adoption path differs from older Unix tools: it grew through editor
      marketplaces, npm, community channels, and then Homebrew for the CLI. The official
      README links the VS Code Marketplace, JetBrains Marketplace, npm installation for
      the CLI and SDK, Discord, Reddit, and documentation, while the batch input lists
      Homebrew as the package-manager distribution for this formula.
  package-nerd-significance:
    - >
      Cline is package-nerd significant because it shows an AI coding agent becoming a
      normal command-line package rather than only an editor extension. Its CLI
      packaging brings credentials, provider selection, MCP servers, plugins, schedules,
      and headless automation into shell workflows where package managers can install
      and update the agent like other developer tools.
  project-history:
    - >
      The GitHub repository was created in 2024 and the changelog records an initial
      0.0.6 release followed by rapid VS Code extension iteration. Version 2.0 renamed
      the project to Cline and described it as an assistant that can use the CLI and
      editor; later releases added browser/computer-use style capabilities,
      model-provider breadth, MCP support, and shared agent infrastructure.
  related-projects:
    - >
      Officially related surfaces include the Cline CLI, VS Code extension, JetBrains
      plugin, Cline SDK, Cline Kanban, and Cline plugins. Functionally, it belongs to
      the same package-manager category as terminal coding agents, editor AI assistants,
      MCP clients, and OpenAI-compatible provider tooling.
  sources:
    - https://github.com/cline/cline#readme
    - https://github.com/cline/cline/blob/main/apps/cli/README.md
    - https://github.com/cline/cline/blob/main/CHANGELOG.md
    - https://github.com/cline/cline/blob/main/apps/cli/CHANGELOG.md
    - https://docs.cline.bot/
  summary:
    - >
      Cline is an open source AI coding agent for IDE and terminal workflows. The
      official repository describes Cline as a coding agent in the IDE and terminal and
      organizes the project around a shared SDK, CLI, VS Code extension, JetBrains
      plugin, Kanban surface, and documentation.
  timeline:
    - '2024: cline/cline GitHub repository created and changelog records initial 0.0.6 release.'
    - >
      2024: Version 2.0 changelog announces the Cline rename and CLI/editor assistant
      positioning.
    - >
      2026: CLI 3.0.x changelog shows active terminal-agent releases, plugin/MCP work,
      Cline Hub, connectors, and provider updates.
    - >
      2026: Version 4.0.0 changelog describes migration to a shared SDK-backed VS Code
      extension runtime.
  usage:
    - >
      The CLI can run interactively, in one-shot mode, as JSON output, yolo/headless
      mode, or background hub mode. Official docs and README examples cover editing code
      across a project, running shell commands, Plan/Act mode, checkpoints, MCP servers,
      providers such as Anthropic, OpenAI, Gemini, OpenRouter, Bedrock, Vertex, and
      OpenAI-compatible APIs, plus scheduled and connector-driven agents.
related-packages: []
category: ai
package-manager:
  brew: cline
package-manager-url: https://formulae.brew.sh/formula/cline
license: Apache-2.0
tags:
  - ai
  - cli
  - coding-agent
  - ide-extension
  - sdk
description: AI-powered coding agent for complex work
executables:
  - cline
provenance:
  formula: cline
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
