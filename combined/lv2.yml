id: brew:lv2
display-name: LV2
homepage: https://lv2plug.in/
repo: https://gitlab.com/lv2/lv2
docs:
  - https://lv2plug.in/
  - https://lv2plug.in/pages/developing.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LV2 adoption is strongest in Linux and free-software audio. The official projects
      page lists plugins, synths, effects, meters, hosts, and developer tools, including
      Ardour, Audacity, Carla, Jalv, Qtractor, REAPER, and Lilv-related tooling.
    - >
      Package-manager adoption follows from the standard's role as infrastructure:
      distributions package LV2 headers and bundles so hosts and plugins can build
      against a shared specification. Homebrew packages it for macOS users who build or
      run LV2-capable audio software.
  package-nerd-significance:
    - >
      LV2 matters to package maintainers because it is a specification package that
      other packages compile against and discover at runtime. The package is small, but
      its installed headers, metadata bundles, validator, and search paths define
      whether large audio stacks interoperate.
  project-history:
    - >
      The current LV2 source README carries copyright years beginning in 2010 for David
      Robillard and describes LV2 as a plugin standard with an extensible C API and
      self-contained bundle directories. The public GitLab repository was created in
      January 2019 and now serves as the official source repository linked from
      lv2plug.in.
    - >
      The official site explains LV2 as a small core interface with extensions for
      advanced behavior. Its 'Why LV2?' page frames the design around a
      platform-agnostic free-software specification, expressive metadata, optional
      compatibility features, embeddable UIs, state, presets, logging, non-realtime
      worker methods, and extensibility.
  related-projects:
    - Lilv is the standard LV2 host library recommended by the official developing guide.
    - Jalv is a real-time JACK host used as a reference-style example.
    - >
      Ardour, Audacity, Carla, Qtractor, REAPER, and Zrythm are listed as LV2-capable
      hosts or projects.
  sources:
    - https://gitlab.com/api/v4/projects/lv2%2Flv2
    - https://gitlab.com/api/v4/projects/lv2%2Flv2/releases?per_page=5
    - https://gitlab.com/lv2/lv2
    - https://gitlab.com/lv2/lv2/-/raw/main/README.md
    - https://lv2plug.in/
    - https://lv2plug.in/pages/developing.html
    - https://lv2plug.in/pages/filesystem-hierarchy-standard.html
    - https://lv2plug.in/pages/projects.html
    - https://lv2plug.in/pages/why-lv2.html
  summary:
    - >
      LV2 is an extensible, open audio plugin standard. The project distributes C
      headers, Turtle metadata, specification bundles, documentation-generation tools,
      tests, and example plugins used by audio hosts and plugin developers.
  timeline:
    - '2010: Copyright start year recorded in the current LV2 README.'
    - '2014: v1.10.0 tag present in the official GitLab repository.'
    - '2019: Official GitLab project created.'
    - '2022: LV2 1.18.10 release published and shown on the specification site.'
  usage:
    - >
      Plugin authors use the LV2 headers, example plugins, and generated programming
      documentation as templates. Host authors commonly use Lilv, which the LV2
      documentation names as the standard library for plugin discovery, inspection, and
      instantiation.
    - >
      LV2 data is installed as bundles, commonly directories ending in `.lv2`. The
      filesystem hierarchy document defines default bundle locations such as
      `$HOME/.lv2` and `$PREFIX/lib/lv2` on Unix, macOS Audio Plug-Ins/LV2 directories,
      and `%APPDATA%/LV2` or `%COMMONPROGRAMFILES%/LV2` on Windows, discovered through
      `LV2_PATH`.
related-packages:
  - id: brew:lilv
    reason: >
      Lilv is the standard library recommended by LV2 for host applications that need to
      discover, inspect, instantiate, and manage LV2 plugins.
    rel: adjacent_workflow
    sources:
      - https://lv2plug.in/pages/developing.html
      - https://drobilla.net/docs/lilv/
category: media
package-manager:
  apk: lv2
  brew: lv2
  debian: lv2-dev
  dnf: lv2
  macports: lv2
  nix: lv2
  pacman: lv2
  ubuntu: lv2-dev
  zypper: lv2
package-manager-url: https://formulae.brew.sh/formula/lv2
license: 0BSD OR ISC
tags:
  - audio
  - c-api
  - cli
  - lv2
  - plugin-standard
  - specification
description: Portable plugin standard for audio systems
executables:
  - lv2_validate
provenance:
  formula: lv2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
