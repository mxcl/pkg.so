id: brew:cryptol
display-name: Cryptol
homepage: https://galoisinc.github.io/cryptol/master/RefMan.html
repo: https://github.com/GaloisInc/cryptol
docs:
  - https://galoisinc.github.io/cryptol/master/RefMan.html
config-file-location:
  unix: cryproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Cryptol is distributed through official GitHub release binaries for macOS, Linux,
      and Windows, and the README explicitly documents Homebrew installation for macOS.
      The supplied package metadata also lists Arch and Ubuntu packages, reflecting a
      tool that is niche but important enough for language, formal-methods, and
      cryptography users to want through normal package channels.
  package-nerd-significance:
    - >
      Cryptol is interesting to packagers because it bundles a language runtime,
      documentation, examples, and solver expectations into a CLI package. Its README
      notes that Homebrew installs the appropriate Z3 version automatically, which is
      the kind of dependency detail that determines whether a formal-methods package
      works out of the box.
  project-history:
    - >
      The official README says Cryptol was designed by Galois for the NSA Laboratory for
      Advanced Cybersecurity Research as a public standard for specifying cryptographic
      algorithms. The current repository represents Cryptol version 3 and carries Galois
      copyright notices beginning in 2013, with the public GitHub repository created in
      2014.
  related-projects:
    - >
      Cryptol is closely related to Galois's SAW tools and to the cryptol-specs
      repository of example specifications. Its everyday operation also depends on SMT
      solvers such as Z3.
  sources:
    - https://github.com/GaloisInc/cryptol
    - https://galoisinc.github.io/cryptol/master/RefMan.html
    - https://api.github.com/repos/GaloisInc/cryptol
  summary:
    - >
      Cryptol is a domain-specific language and toolchain for specifying and checking
      cryptographic algorithms. It is packaged as a developer tool because its main
      value is an executable specification language, REPL-like interpreter, and
      solver-backed verification workflow rather than a conventional application.
  timeline:
    - '2013: The version 3 codebase carries Galois copyright notices beginning in this year.'
    - '2014: The official GitHub repository was created.'
    - '2026: The hosted reference manual shows active 3.x documentation and master-branch docs.'
  usage:
    - >
      Users write executable specifications of cryptographic algorithms in Cryptol, then
      use the interpreter's :check command for randomized testing and :prove or :sat
      commands through SMT solvers such as Z3. The README also points users toward
      examples, the standard library, and the related SAW tooling for checking
      implementations against specifications.
related-packages:
  - id: brew:z3
    reason: >
      Z3 is Cryptol's documented default SMT solver for type constraints and the `:sat`
      and `:prove` commands, and Homebrew installs the compatible solver alongside
      Cryptol.
    rel: adjacent_workflow
    sources:
      - https://github.com/GaloisInc/cryptol
      - https://github.com/Z3Prover/z3
category: developer-tools
package-manager:
  brew: cryptol
  pacman: cryptol
  ubuntu: cryptol
package-manager-url: https://formulae.brew.sh/formula/cryptol
license: BSD-3-Clause
tags:
  - cli
  - cryptography
  - dsl
  - formal-methods
  - programming-language
  - verification
description: Domain-specific language for specifying cryptographic algorithms
executables:
  - check-exercises
  - cryptol
  - cryptol-html
provenance:
  formula: cryptol
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
