id: brew:kubectx
display-name: kubectx
homepage: https://github.com/ahmetb/kubectx
repo: https://github.com/ahmetb/kubectx
docs:
  - https://github.com/ahmetb/kubectx#readme
config-file-location:
  unix: ~/.kube/config
credentials-file-location: null
history:
  adoption-history:
    - >
      kubectx spread through multiple packaging ecosystems because it is useful on every
      workstation that touches more than one Kubernetes cluster. The official README
      documents installation through Homebrew, MacPorts, apt, pacman, Chocolatey, Scoop,
      winget, and Krew, which reflects cross-platform adoption by both Kubernetes
      operators and developers.
    - >
      Its inclusion as Krew plugins named ctx and ns gave it a Kubernetes-native
      installation path, while Homebrew and Linux distribution packages made it familiar
      to package-manager users outside the Kubernetes plugin index.
  package-nerd-significance:
    - >
      kubectx is a package-nerd staple because it is tiny, scriptable, and heavily
      repackaged: one upstream repository feeds native OS package managers, Windows
      package managers, and Krew. It is also a good example of a CLI whose adoption
      comes from reducing command friction rather than adding a new control plane.
  project-history:
    - >
      The public GitHub repository was created on March 30, 2017, and the v0.1 release
      was published on April 25, 2017. The original project was shell-oriented; later
      releases added a Go implementation while retaining the simple command names and
      shell-completion focused workflow.
    - >
      The README describes the package as 'Power tools for kubectl' and positions
      kubectx for faster cluster/context changes and kubens for namespace changes. That
      pairing made the project fit naturally beside kubectl rather than replacing it.
  related-projects:
    - kubens is shipped from the same repository and handles namespace switching.
    - Krew distributes kubectx and kubens as kubectl plugins named ctx and ns.
    - fzf is an optional dependency for interactive context and namespace selection.
    - >
      kube-ps1 and oh-my-posh are prompt tools the README recommends for displaying
      Kubernetes context.
  sources:
    - https://api.github.com/repos/ahmetb/kubectx
    - https://formulae.brew.sh/formula/kubectx
    - https://github.com/ahmetb/kubectx
    - https://github.com/ahmetb/kubectx/releases
  summary:
    - >
      kubectx is a small Kubernetes command-line companion that packages two everyday
      workflow shortcuts: switching kubeconfig contexts with kubectx and switching
      namespaces with kubens. It became a widely installed kubectl-adjacent utility
      because it solves a repetitive operator problem without introducing a larger
      cluster-management framework.
  timeline:
    - '2017-03-30: Public GitHub repository created'
    - '2017-04-25: v0.1 release published'
    - >
      2021-07-06: v0.9.4 release published after the project had become a common kubectl
      companion
    - '2026-03-27: v0.11.0 release published'
  usage:
    - >
      kubectx reads the user's kubeconfig contexts and switches the active context,
      including a shortcut for returning to the previous context. kubens similarly
      updates the namespace on the active context. Optional fzf integration adds
      interactive selection for long cluster and namespace lists.
    - >
      The tool is commonly paired with shell completions and prompt helpers such as
      kube-ps1 or oh-my-posh so operators can both switch context quickly and see the
      selected cluster or namespace before running kubectl commands.
related-packages:
  - id: brew:krew
    reason: >
      Choose Krew to install and update kubectx and kubens as the kubectl plugins `ctx`
      and `ns`, as documented by kubectx itself.
    rel: adjacent_workflow
    sources:
      - https://github.com/ahmetb/kubectx#installation
      - https://krew.sigs.k8s.io/docs/user-guide/quickstart/
  - id: brew:fzf
    reason: >
      Install fzf alongside kubectx to enable the project's documented interactive fuzzy
      selector for contexts and namespaces.
    rel: adjacent_workflow
    sources:
      - https://github.com/ahmetb/kubectx#interactive-mode
      - https://junegunn.github.io/fzf/
category: developer-tools
package-manager:
  apk: kubectx
  brew: kubectx
  chocolatey: kubectx
  debian: kubectx
  macports: kubectx
  nix: kubectx
  pacman: kubectx
  scoop: main/kubectx
  ubuntu: kubectx
  winget: ahmetb.kubectx
  zypper: kubectx
package-manager-url: https://formulae.brew.sh/formula/kubectx
license: Apache-2.0
tags:
  - cli
  - context-switching
  - kubeconfig
  - kubectl
  - kubernetes
  - namespace-switching
description: Tool that can switch between kubectl contexts easily and create aliases
executables:
  - kubectl-ctx
  - kubectl-ns
  - kubectx
  - kubens
provenance:
  formula: kubectx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
