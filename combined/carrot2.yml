id: brew:carrot2
display-name: Carrot2
homepage: https://search.carrot2.org/
repo: https://github.com/carrot2/carrot2
docs:
  - https://github.com/carrot2/carrot2/wiki
  - https://carrot2.github.io/release/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Carrot2 is primarily a library and distribution rather than a single-purpose CLI.
      The README documents binary releases on GitHub, a bundled HTTP/JSON Document
      Clustering Server for non-Java integration, and integration paths through Apache
      Solr and Elasticsearch plugins.
  package-nerd-significance:
    - >
      Carrot2 is interesting in package-manager history because it packages a
      research-flavored information-retrieval component as a usable distribution: a Java
      library, local server, documentation bundle, and integrations for search stacks.
  project-history:
    - >
      The public GitHub repository was created in 2011 under the carrot2 organization.
      Official documentation for the latest release is published at carrot2.github.io,
      and the current latest-docs redirect points to the 4.8.6 documentation tree.
  related-projects:
    - The README names Apache Solr and Elasticsearch integrations.
    - The distribution includes the DCS service for integration from non-Java languages.
  sources:
    - https://api.github.com/repos/carrot2/carrot2
    - https://github.com/carrot2/carrot2
    - https://search.carrot2.org/
    - https://github.com/carrot2/carrot2/wiki
    - https://carrot2.github.io/release/latest
    - https://formulae.brew.sh/api/formula/carrot2.json
  summary:
    - >
      Carrot2 is a Java text-clustering library and distribution. Its README says it
      discovers groups of related documents and labels them with short key terms or
      phrases, commonly from search result titles and snippets.
  timeline:
    - '2011: Public GitHub repository created.'
    - '2020s: Latest-release documentation is served from carrot2.github.io.'
    - '2020s: README documents GitHub binary releases and the DCS HTTP/JSON service.'
  usage:
    - >
      Developers use Carrot2 to cluster text or search results, either through Java
      APIs, release-bundled API documentation, the DCS HTTP/JSON service, or
      search-platform integrations. The Homebrew package exposes a carrot2 executable
      for the packaged distribution.
related-packages:
  - id: brew:solr
    reason: >
      Carrot2 officially documents a Solr plugin that clusters and labels result sets
      retrieved through Apache Solr.
    rel: adjacent_workflow
    sources:
      - https://github.com/carrot2/carrot2#readme
      - https://solr.apache.org/
category: data
package-manager:
  brew: carrot2
package-manager-url: https://formulae.brew.sh/formula/carrot2
license: Apache-2.0
tags:
  - cli
  - clustering
  - java
  - library
  - rest-api
  - search
  - text-mining
description: Search results clustering engine
executables:
  - carrot2
provenance:
  formula: carrot2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
