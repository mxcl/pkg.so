id: brew:linecast
display-name: linecast
homepage: https://github.com/ashuttl/linecast
repo: https://github.com/ashuttl/linecast
docs:
  - https://github.com/ashuttl/linecast#readme
config-file-location:
  unix: ~/.config/linecast/config.json
  windows: '%USERPROFILE%/.config/linecast/config.json'
credentials-file-location: null
history: null
related-packages:
  - id: brew:wthrr
    reason: >
      wthrr is a narrower terminal-weather alternative focused on current, forecast, and
      historical weather with a configurable Rust TUI; choose it when linecast's maps,
      tides, and astronomy views are unnecessary.
    rel: alternative
    sources:
      - https://github.com/ashuttl/linecast#readme
      - https://github.com/ttytm/wthrr-the-weathercrab#readme
  - id: brew:wego
    reason: >
      wego is a forecast-focused alternative with selectable weather backends and ASCII,
      emoji, Markdown, and JSON frontends, making it better suited to backend choice and
      composable shell output.
    rel: alternative
    sources:
      - https://github.com/ashuttl/linecast#readme
      - https://github.com/schachmat/wego#readme
category: science
package-manager:
  brew: linecast
package-manager-url: https://formulae.brew.sh/formula/linecast
license: MIT
tags:
  - astronomy
  - cli
  - maps
  - moon
  - sunrise
  - terminal
  - tides
  - weather
description: Weather, tides, the sun, the moon, and maps, drawn for the terminal
executables:
  - linecast
provenance:
  formula: linecast
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
