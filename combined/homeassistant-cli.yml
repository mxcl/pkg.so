id: brew:homeassistant-cli
display-name: Home Assistant CLI
homepage: https://github.com/home-assistant-ecosystem/home-assistant-cli
repo: https://github.com/home-assistant-ecosystem/home-assistant-cli
docs:
  - https://github.com/home-assistant-ecosystem/home-assistant-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Home Assistant CLI adoption is tied to Home Assistant's power-user culture: people
      who automate homes often also automate their automation system. The official
      README lists installation through pip, Fedora/EPEL packages, Homebrew, NixOS, and
      Docker, which reflects use across workstations, development shells, and
      containers.
    - >
      The Home Assistant community thread around the announcement shows the
      package-manager angle clearly: by August 2019, users were discussing Homebrew
      version lag and release automation for the formula. That is a small but telling
      sign that hass-cli was expected to behave like a normal developer CLI, not just a
      Python library.
  package-nerd-significance:
    - >
      Home Assistant CLI is package-nerd significant because it is the shell bridge into
      a popular self-hosted automation platform. It converts a web-and-API product into
      something scriptable with environment variables, completions, JSON/YAML output,
      and package-manager installs.
    - >
      It also illustrates the messier side of Python CLI packaging: pip releases, distro
      packages, Homebrew formula updates, Docker wrappers, and Home Assistant's own
      supervisor CLI world overlap. For a package maintainer, the interesting parts are
      dependency freshness, token handling, and keeping the CLI aligned with evolving
      Home Assistant APIs.
  project-history:
    - >
      The project was initially started by Fabian Affolter and then developed further by
      Max Rydahl Andersen, according to the official Home Assistant announcement. That
      announcement framed hass-cli as a missing command-line layer for Home Assistant
      users who wanted auto-completion, scripting, and direct access without replacing
      the browser UI.
    - >
      Early PyPI metadata shows a 0.0.2 release in November 2018. The official
      announcement describes the 0.4 era as a cleanup point where commands became more
      logical and explicit, table output became the default for many operations, and
      common Home Assistant operations were exposed as CLI subcommands. Later README
      examples show broader coverage, including state, device, area, event, service,
      config, integration, template, and Home Assistant Operating System related
      commands.
  related-projects:
    - >
      Home Assistant is the parent platform and API target. The separate
      home-assistant/cli project is related but different: it provides the ha command
      for Home Assistant Supervisor interaction. Home Assistant Operating System, the
      Supervisor API proxy add-on, and the Home Assistant developer docs are adjacent
      because hass-cli can work with supervisor-related commands when configured.
  sources:
    - >
      https://community.home-assistant.io/t/introducing-home-assistant-cli-aka-hass-cli/97113
      - official community discussion for packaging and Homebrew release-lag context.
    - >
      https://github.com/home-assistant-ecosystem/home-assistant-cli - official README
      for setup, commands, installation channels, and environment variables.
    - >
      https://pypi.org/project/homeassistant-cli/0.0.2/ - PyPI release metadata and
      early project description.
    - >
      https://www.home-assistant.io/blog/2019/02/04/introducing-home-assistant-cli/ -
      official Home Assistant announcement for origin, motivation, and 0.4-era behavior.
  summary:
    - >
      Home Assistant CLI, invoked as hass-cli, is a Python command-line client for
      working with local or remote Home Assistant instances. It wraps Home Assistant
      APIs in a shell-friendly interface for listing states, calling services, rendering
      templates, querying history, using completions, and scripting common smart-home
      tasks.
  timeline:
    - '2018: PyPI records homeassistant-cli 0.0.2.'
    - >
      2019: Home Assistant announcement introduced hass-cli to the wider Home Assistant
      audience around the 0.4 era.
    - >
      2019: Homebrew packaging lag and formula automation were discussed in the official
      community thread.
    - '2020: PyPI records the 0.9.0 line.'
    - '2022: PyPI records 0.9.6.'
    - '2026: PyPI records 1.0.0.'
  usage:
    - >
      A typical setup exports HASS_SERVER and HASS_TOKEN after generating a long-lived
      Home Assistant token. The README also documents HASS_SUPERVISOR_TOKEN for
      supervisor access, HASS_PASSWORD for older password-based access, client
      certificate support, and shell completion for bash, zsh, and fish.
    - >
      Common commands include hass-cli state list, state get, state history, service
      list, service call, config release, event watch, device list, area create or
      assign, raw API calls, and template rendering. The CLI can emit table, JSON, YAML,
      NDJSON, and other table formats, which is why it fits shell pipelines and scripts.
