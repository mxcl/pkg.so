id: brew:dotnet@8
display-name: .NET 8
homepage: https://dotnet.microsoft.com/
repo: https://github.com/dotnet/dotnet
docs:
  - https://learn.microsoft.com/en-us/dotnet
  - https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-8/overview
config-file-location:
  unix: <working-directory-or-ancestor>/global.json
  windows: <working-directory-or-ancestor>/global.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned packaging reflects .NET's support policy in package-manager form.
      Keeping dotnet@8 installable alongside newer SDKs lets maintainers reproduce
      builds, keep LTS applications on their target framework, and avoid surprise
      major-version movement on developer machines.
  package-nerd-significance:
    - >
      dotnet@8 is a support-lifecycle package: its value is not a different executable
      name but a pinned major SDK/runtime family. That makes it important for
      reproducible build environments and for package catalogs that model multiple
      supported versions of the same runtime.
  project-history:
    - >
      Microsoft's release metadata lists .NET 8.0 as released on November 14, 2023, with
      LTS servicing through November 10, 2026. The release became the stable baseline
      for organizations moving from .NET 6 or .NET 7 while wanting a longer support
      period.
  related-projects:
    - .NET
    - ASP.NET Core 8
    - Entity Framework Core 8
    - C# 12
    - NuGet
  sources:
    - https://github.com/dotnet/core/blob/main/release-notes/8.0/README.md
    - https://github.com/dotnet/core/blob/main/releases.md
    - https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-8/overview
    - https://formulae.brew.sh/formula/dotnet@8
  summary:
    - >
      .NET 8 is the November 2023 Long Term Support release of modern .NET. As a
      Homebrew versioned formula, dotnet@8 is useful for developers and CI systems that
      need to stay on the .NET 8 support window instead of tracking newer SDK lines.
  timeline:
    - '2023: .NET 8.0 Preview 1 appeared in February.'
    - '2023: .NET 8.0 was released on November 14 as an LTS release.'
    - '2026: Microsoft lists November 10, 2026 as the end of support for .NET 8.'
  usage:
    - >
      Developers install dotnet@8 to build, test, run, and publish applications
      targeting net8.0, ASP.NET Core 8, EF Core 8, and related SDK workloads. The CLI
      behavior is the standard `dotnet` workflow, with SDK selection typically
      controlled by project target frameworks or global.json.
related-packages:
  - id: brew:dotnet
    reason: >
      Choose the unversioned formula when the project can follow Homebrew's current .NET
      SDK line instead of remaining on .NET 8.
    rel: alternative
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/tools/global-json
      - https://github.com/dotnet/core/blob/main/releases.md
  - id: brew:dotnet@9
    reason: >
      Choose .NET 9 when the application specifically targets that newer Standard Term
      Support generation rather than the .NET 8 LTS APIs and toolchain.
    rel: alternative
    sources:
      - https://github.com/dotnet/core/blob/main/release-notes/8.0/README.md
      - https://github.com/dotnet/core/blob/main/release-notes/9.0/README.md
  - id: brew:nuget
    reason: >
      Use the standalone NuGet client for dedicated package publication and repository
      operations around dependencies consumed by .NET 8 projects.
    rel: adjacent_workflow
    sources:
      - https://learn.microsoft.com/en-us/nuget/what-is-nuget
      - https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet
category: language-runtime
package-manager:
  brew: dotnet@8
  chocolatey: dotnet
  ubuntu: aspnetcore-runtime-8.0
package-manager-url: https://formulae.brew.sh/formula/dotnet@8
license: MIT
tags:
  - cli
  - csharp
  - dotnet
  - runtime
  - sdk
description: .NET Core
executables:
  - dotnet
provenance:
  formula: dotnet@8
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
