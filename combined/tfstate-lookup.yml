id: brew:tfstate-lookup
display-name: tfstate-lookup
homepage: https://github.com/fujiwara/tfstate-lookup
repo: https://github.com/fujiwara/tfstate-lookup
docs:
  - https://github.com/fujiwara/tfstate-lookup#readme
config-file-location: null
credentials-file-location:
  unix: ~/.config/gcloud/application_default_credentials.json
  windows: '%APPDATA%\gcloud\application_default_credentials.json'
history:
  adoption-history:
    - >
      The README documents installation through a Homebrew tap and binary releases. The
      input metadata records a Homebrew package for the tool.
  package-nerd-significance:
    - >
      tfstate-lookup belongs to the practical Terraform toolbox: small enough for
      Homebrew, useful in scripts, and focused on the awkward gap between Terraform
      state internals and day-to-day shell queries.
  project-history:
    - >
      The project centers on state inspection rather than configuration editing. The
      README documents lookup by resource address, dumping all resources, interactive
      selection, and integration with the `jid` JSON incremental digger.
  related-projects:
    - >
      The README links jid for interactive JSON digging and documents Terraform Cloud,
      S3, GCS, and AzureRM state backends.
  sources:
    - https://github.com/fujiwara/tfstate-lookup README
    - https://github.com/fujiwara/tfstate-lookup/releases
    - source_facts.package-manager
  summary:
    - >
      tfstate-lookup is a command-line and Go-library tool for querying Terraform state.
      Its README describes looking up resource attributes from local or remote tfstate
      files.
  timeline:
    - '2025-04-19: The GitHub releases page lists tfstate-lookup v1.6.0.'
    - '2026-05-17: The GitHub releases page lists tfstate-lookup v1.12.1.'
    - '2026: The input metadata records tfstate-lookup as a Homebrew package.'
  usage:
    - >
      Typical use is to query a state file with commands like `tfstate-lookup
      aws_vpc.main.id` or to point `-s` at a local file or URL. The README lists
      supported state URL schemes including local file, HTTP(S), S3, GCS, AzureRM, and
      Terraform Cloud or Enterprise remote state.
    - >
      For package users, the value is a quick shell-native way to inspect state outputs
      and resource attributes without writing jq filters against the whole state JSON.
category: developer-tools
package-manager:
  brew: tfstate-lookup
package-manager-url: https://formulae.brew.sh/formula/tfstate-lookup
license: MPL-2.0
tags:
  - cli
  - infrastructure-as-code
  - state-inspection
  - terraform
  - tfstate
description: Lookup resource attributes in tfstate
executables:
  - tfstate-lookup
provenance:
  formula: tfstate-lookup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
