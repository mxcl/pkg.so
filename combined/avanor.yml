id: brew:avanor
display-name: Avanor
homepage: https://avanor.sourceforge.net/
repo: https://sourceforge.net/p/avanor/code
docs:
  - https://avanor.sourceforge.net/manual/index.html
  - https://avanor.sourceforge.net/
  - https://sourceforge.net/projects/avanor
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Avanor's packaging footprint appears narrow. The input only records a Homebrew
      package, and the upstream download path points to SourceForge project files rather
      than a broad modern release system. Its adoption is best understood as
      preservation of a small open-source roguelike in package-manager form.
  package-nerd-significance:
    - >
      For package nerds, Avanor is interesting as a preserved ncurses-era roguelike with
      a SourceForge SVN repository and an old upstream website. It is the kind of
      formula that keeps niche terminal games installable long after their original
      community infrastructure has gone quiet.
  project-history:
    - >
      The Avanor website credits Vadim Gaidukevich and carries early-2000s project
      styling and news. Its news archive records releases through 0.5.x, an
      open-sourcing announcement in July 2003, and a later development build after a
      long break in 2005.
    - >
      The SourceForge project page describes Avanor as a feature-rich fantasy roguelike
      with an interactive world, while the official manual covers the expected roguelike
      topics: quick start, keyboard layout, basic knowledge, magic, skills, equipment,
      tactics, test modes, and credits.
  related-projects:
    - "ADOM: upstream describes Avanor's UI as ADOM-like."
    - 'SourceForge SVN: official code hosting for the project.'
    - 'ncurses-style terminal roguelikes: the broader packaging niche Avanor belongs to.'
  sources:
    - https://avanor.sourceforge.net/
    - https://avanor.sourceforge.net/manual/index.html
    - https://sourceforge.net/p/avanor/code/
    - https://sourceforge.net/projects/avanor
    - source_facts.package-manager
  summary:
    - >
      Avanor is a terminal roguelike RPG, described by its official site as a
      quick-growing roguelike with an easy ADOM-like user interface. It is a small
      SourceForge-era game package rather than a large active engine project.
  timeline:
    - '2002: Official news mentions console-output source samples for Win32.'
    - '2003: Avanor 0.5.3, 0.5.6, and 0.5.7 releases noted on the official site.'
    - '2003: Official site says Avanor was open sourced in July.'
    - '2005: Development version released after an almost two-year break.'
    - >
      2006: Official site returned after downtime and announced that 0.6.0 would be
      available soon.
  usage:
    - >
      Users run the `avanor` terminal executable and play through keyboard-driven
      roguelike controls. The manual documents game mechanics rather than system
      configuration, so there is no official config or credential file to report.
related-packages: []
