history:
  adoption-history:
    - >
      GROMACS earned adoption through speed, a broad biomolecular feature set, and a
      command-line workflow that fits clusters and batch systems. The official About
      page highlights simulations ranging from hundreds to millions of particles,
      biochemical systems such as proteins, lipids, and nucleic acids, and
      non-biological uses such as polymers and fluid dynamics.
    - >
      The citation trail on the official manual reflects scientific adoption: the
      project asks users to cite a sequence of GROMACS papers from the 1990s through the
      2010s, and notes that future development depends on academic research grants. That
      positions the package as both software infrastructure and an academic research
      artifact.
    - >
      Package-manager adoption is broad because GROMACS is useful even outside a custom
      HPC module tree. Homebrew, Debian, Fedora/DNF, MacPorts, Nix, Ubuntu, and openSUSE
      packaging make local testing, tutorials, and smaller CPU/GPU runs possible without
      a site-specific cluster build.
  package-nerd-significance:
    - >
      GROMACS is a classic scientific packaging stress test. Maintainers must care about
      compilers, SIMD, MPI, GPU backends, optional libraries, floating-point behavior,
      and executable naming, while users care that `gmx` behaves consistently with the
      manual version they are following.
    - >
      It also matters culturally because it brings HPC-grade science into mainstream
      package managers. Installing `brew:gromacs` or `apt install gromacs` turns a
      historically cluster-centric molecular-dynamics suite into something that can be
      inspected, scripted, and taught from ordinary developer machines.
    - >
      The package is an example of why formula metadata is useful beyond developer
      tools: it links executable names, licenses, repositories, documentation, and
      cross-manager availability for software whose real audience spans chemists,
      biophysicists, systems administrators, and performance engineers.
  project-history:
    - >
      The GROMACS manual records the project's early institutional home as the
      Department of Biophysical Chemistry at the University of Groningen from 1991
      through 2000. The GROMACS literature describes the software as originating from a
      parallel hardware project and being written in ANSI C with a strong focus on
      parallel execution and inner-loop performance.
    - >
      From 2001 onward, the manual credits GROMACS development teams at the Royal
      Institute of Technology and Uppsala University in Sweden. The project moved from a
      Groningen-lab code into an international scientific software project maintained by
      contributors across universities and research centers.
    - >
      The project documentation emphasizes that GROMACS is a proper name rather than an
      acronym, while older sources and papers preserve the historical Groningen Machine
      for Chemical Simulations expansion. The package changed from a collection of
      specialized simulation programs into a documented suite with release notes, user
      guides, reference manuals, developer documentation, and a public GitLab workflow.
    - >
      Licensing is another important part of the evolution. The official documentation
      identifies GROMACS as free software under LGPL 2.1 or later, a significant detail
      for scientific users who need to run, modify, redistribute, and audit simulation
      software.
  related-projects:
    - >
      Historically related software includes GROMOS, from the same broader Groningen
      molecular-simulation tradition, and other molecular-dynamics packages such as
      AMBER, CHARMM, NAMD, LAMMPS, and OpenMM.
    - >
      Operationally related tools include MPI implementations, GPU compute stacks,
      PLUMED, VMD, trajectory-analysis tools, force-field collections, and Python
      interfaces such as gmxapi.
  sources:
    - https://gitlab.com/gromacs/gromacs
    - https://manual.gromacs.org/2026.3/reference-manual/index.html
    - https://manual.gromacs.org/2026.3/reference-manual/preface.html
    - https://manual.gromacs.org/2026.3/user-guide/cmdline.html
    - https://pubmed.ncbi.nlm.nih.gov/16211538/
    - https://www.gromacs.org/about.html
    - https://www.rug.nl/research/molecular-dynamics/?lang=en
  summary:
    - >
      GROMACS is a free molecular-dynamics simulation suite used for computational
      chemistry, biomolecular simulation, and high-performance trajectory analysis.
    - >
      Its package-manager importance comes from an unusual combination: a serious
      scientific codebase, a single `gmx` command-line front end, MPI/GPU/HPC build
      concerns, and broad availability across Unix-like package ecosystems.
  timeline:
    - >
      1991: GROMACS development period begins at the Department of Biophysical
      Chemistry, University of Groningen.
    - >
      1993: Early GROMACS work appears in the project's citation lineage through the
      Bekker et al. paper.
    - '1995: The Berendsen et al. paper enters the official GROMACS citation lineage.'
    - >
      2001: The manual's copyright line shifts to GROMACS development teams at the Royal
      Institute of Technology and Uppsala University.
    - >
      2005: The `GROMACS: fast, flexible, and free` paper describes the suite's
      Groningen origin and performance orientation.
    - >
      2008: The official citation lineage includes GROMACS 4 algorithm work for
      efficient, load-balanced, scalable molecular simulation.
    - >
      2013: The official citation lineage includes work describing later-generation
      GROMACS capabilities and development.
    - >
      2015: The official citation lineage includes papers on heterogeneous
      parallelization and high-throughput molecular simulations.
    - >
      2020s: The project documents public GitLab-based source, issue, and contribution
      workflows.
  usage:
    - >
      A typical GROMACS workflow prepares molecular topology and coordinates, uses `gmx
      grompp` to assemble a run input file, runs simulations with `gmx mdrun`, and
      analyzes trajectories with many `gmx` subcommands. The manual's command-line
      reference lists a large tool surface under the `gmx` entry point.
    - >
      The official documentation stresses command-line options, clear text topologies
      and parameter files, consistency checking, hardware-independent run input and
      trajectory files, parallel execution through MPI or Thread-MPI, and CPU/GPU load
      balancing. These traits explain why the package fits both teaching laptops and
      production scientific computing environments.
    - >
      For users, GROMACS is less a single command than a reproducible simulation
      environment: force fields, `.mdp` run parameters, topology files, trajectory
      files, analysis commands, and manual versions all matter together.
related-packages:
  - id: brew:lammps
    reason: >
      Choose LAMMPS for an extensible molecular-dynamics workflow centered on materials,
      soft matter, and general particle models; choose GROMACS when its biomolecular
      preparation, force-field, and analysis ecosystem is the better fit.
    rel: alternative
    sources:
      - https://www.gromacs.org/about.html
      - https://docs.lammps.org/
      - https://www.lammps.org/history.html
