id: brew:cargo-zigbuild
display-name: cargo-zigbuild
homepage: https://github.com/rust-cross/cargo-zigbuild
repo: https://github.com/rust-cross/cargo-zigbuild
docs:
  - https://docs.rs/cargo-zigbuild
  - https://github.com/rust-cross/cargo-zigbuild#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub records the repository as created in February 2022, and crates.io records
      the first release the same day. The input package facts list Alpine, Homebrew,
      Nix, and Arch packages, and the README also advertises PyPI and Docker
      distribution.
  package-nerd-significance:
    - >
      cargo-zigbuild is significant for package builders because it packages a practical
      Rust cross-compilation workflow around Zig's linker and libc tooling, reducing the
      need for bespoke target toolchains.
  project-history:
    - >
      The official README describes cargo-zigbuild as using Zig as linker for easier
      Rust cross compilation, with cargo, pip, and container installation paths.
  related-projects:
    - >
      The README links Zig, ziglang's PyPI package, Docker images, rustup targets,
      bindgen, and upstream Zig cross-compilation issues.
  sources:
    - https://api.github.com/repos/rust-cross/cargo-zigbuild
    - https://github.com/rust-cross/cargo-zigbuild
    - https://docs.rs/cargo-zigbuild
    - https://github.com/rust-cross/cargo-zigbuild#readme
    - https://crates.io/api/v1/crates/cargo-zigbuild
    - https://formulae.brew.sh/api/formula/cargo-zigbuild.json
  summary:
    - >
      cargo-zigbuild is a Cargo subcommand that compiles Rust projects using Zig as the
      linker to simplify cross compilation.
  timeline:
    - '2022: GitHub repository created and first crates.io release recorded.'
    - '2026: crates.io records max_version 0.23.0.'
  usage:
    - >
      The README documents installing Zig, adding Rust targets with rustup, running
      `cargo zigbuild --target ...`, setting environment variables for Zig/Python/cache
      paths, targeting glibc versions, and building macOS universal2 binaries.
related-packages:
  - id: brew:zig
    reason: >
      Zig supplies the compiler driver and linker that cargo-zigbuild invokes, so it is
      the required companion tool for the standard Cargo installation workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/rust-cross/cargo-zigbuild#readme
      - https://ziglang.org/documentation/master/
category: developer-tools
package-manager:
  apk: cargo-zigbuild
  brew: cargo-zigbuild
  nix: cargo-zigbuild
  pacman: cargo-zigbuild
package-manager-url: https://formulae.brew.sh/formula/cargo-zigbuild
license: MIT
tags:
  - cargo
  - cli
  - cross-compilation
  - rust
  - zig
description: Compile Cargo project with zig as linker
executables:
  - cargo-zigbuild
provenance:
  formula: cargo-zigbuild
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
