id: brew:jet
display-name: Jet
homepage: https://github.com/go-jet/jet
repo: https://github.com/go-jet/jet
docs:
  - https://github.com/go-jet/jet/wiki
  - https://github.com/go-jet/jet#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Jet fits a Go community preference for explicit SQL and compile-time feedback. It
      occupies a middle position between handwritten `database/sql` calls, ORMs, and
      SQL-code generators: users still write query structure in Go, but the table,
      column, enum, and model types are generated from the database.
    - >
      Homebrew, MacPorts, and Nix metadata in the input show adoption as a developer
      command as well as a Go library dependency. The formula packages the `jet`
      generator executable, which is the visible tool most package-manager users
      install.
  package-nerd-significance:
    - >
      Jet is package-nerd notable because the command name is tiny and generic, but the
      package represents a very specific Go database philosophy: generate just enough
      schema-aware code to make SQL construction typed while avoiding a full ORM
      identity map.
  project-history:
    - >
      The go-jet/jet repository was created in 2019 and reached a 1.0 GitHub release the
      same year. The 2.x line also began in 2019, establishing the module path used by
      the documented `go install github.com/go-jet/jet/v2/cmd/jet` workflow.
    - >
      The project evolved as a generator plus runtime library. Release history and
      documentation show continuing additions around SQL dialect features, result
      mapping, and database support, with PostgreSQL, MySQL, SQLite, CockroachDB, and
      MariaDB represented across the README and wiki.
  related-projects:
    - >
      Jet is closely related to Go's `database/sql` package, PostgreSQL, MySQL, SQLite,
      CockroachDB, and MariaDB. It also sits in the same problem space as sqlc and Go
      ORMs, but its README distinguishes it from ORMs.
  sources:
    - https://api.github.com/repos/go-jet/jet
    - https://formulae.brew.sh/formula/jet
    - https://github.com/go-jet/jet
    - https://github.com/go-jet/jet/releases
    - https://github.com/go-jet/jet/wiki
    - https://github.com/go-jet/jet/wiki/Generator
  summary:
    - >
      Jet is a Go database access toolkit built around code generation, type-safe SQL
      builders, and automatic query result mapping. Its README is explicit that Jet is
      not an ORM; the package instead generates Go types from database metadata so
      queries can be written as Go code that resembles SQL.
  timeline:
    - '2019: Public GitHub repository created for go-jet/jet.'
    - '2019: v1.0.0 and v2.0.0 releases published on GitHub.'
    - '2020: v2.4.0 release published on GitHub.'
    - '2025: v2.13.0 release published with additional SQL-builder features.'
  usage:
    - >
      The documented workflow is to install the generator, point it at a running
      database or SQLite file, and choose an output path such as `./.gen`. Jet then
      generates SQL builder and model packages, after which application code imports
      those packages and builds typed SELECT, INSERT, UPDATE, DELETE, LOCK, and WITH
      statements.
related-packages:
  - id: brew:sqlc
    reason: >
      Choose sqlc when handwritten SQL should remain the source of truth and the tool
      should generate typed methods from those queries; choose Jet when queries should
      be composed through a generated, type-safe Go builder.
    rel: alternative
    sources:
      - https://github.com/go-jet/jet/wiki
      - https://docs.sqlc.dev/
      - https://docs.sqlc.dev/en/latest/howto/generate.html
  - id: brew:sqlboiler
    reason: >
      Choose SQLBoiler when you want a database-first generated ORM with relationships,
      hooks, eager loading, and model lifecycle helpers; Jet intentionally remains a SQL
      builder and result mapper rather than an ORM.
    rel: alternative
    sources:
      - https://github.com/go-jet/jet/wiki
      - https://github.com/aarondl/sqlboiler#readme
category: developer-tools
