id: brew:eot-utils
display-name: eot-utils
homepage: https://www.w3.org/Tools/eot-utils/
repo: null
docs:
  - https://www.w3.org/Tools/eot-utils
  - https://www.w3.org/Tools/eot-utils/README
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      eot-utils remained a specialist package because EOT itself was mainly relevant to
      older Microsoft web-font workflows. Its adoption is therefore visible less through
      a broad application ecosystem and more through distribution packaging: Homebrew,
      Debian/Ubuntu, Fedora/DNF, and MacPorts have carried the command-line tools for
      users who still need to inspect or generate EOT files.
  package-nerd-significance:
    - >
      For package nerds, eot-utils is a fossil from the web-font transition: a tiny pair
      of Unix-style tools around a format tied to legacy Internet Explorer behavior and
      the early standardization battles around downloadable fonts.
  project-history:
    - >
      The W3C tool directory dates the source files to 2010 with later updates to the
      ChangeLog and README. Its README points to the 2008 Embedded OpenType W3C
      Submission, where Microsoft submitted the EOT format so web pages could link
      downloadable OpenType fonts through CSS `@font-face`.
    - >
      The utilities were built around the browser and web-font constraints of that
      period: `mkeot` respects TrueType embedding bits, the bundled FontForge script
      converts OpenType to TrueType-flavored fonts, and the README documents Internet
      Explorer limitations around root strings and font naming.
  related-projects:
    - >
      eot-utils relates to OpenType, TrueType, FontForge conversion scripts, CSS
      `@font-face`, and legacy browser font-embedding workflows.
  sources:
    - https://www.w3.org/Tools/eot-utils/
    - https://www.w3.org/Tools/eot-utils/README
    - https://www.w3.org/submissions/2008/01/
  summary:
    - >
      eot-utils is W3C's small source distribution for working with Embedded OpenType
      fonts. It contains `mkeot`, which creates EOT files from OpenType or TrueType
      fonts and URL root strings, and `eotinfo`, which displays EOT header information.
  timeline:
    - '2008-03-18: Microsoft submitted the Embedded OpenType format request to W3C.'
    - '2010: W3C eot-utils source files in the tool directory were timestamped.'
    - '2012: W3C tool directory shows ChangeLog and source updates.'
    - '2019: W3C tool directory shows README and tarball timestamps.'
  usage:
    - >
      `mkeot` is used to generate an EOT file from a font plus zero or more root
      strings, while `eotinfo` prints a human-readable view of an EOT header. The source
      distribution follows a traditional autotools build path with `configure`, `make`,
      and `make install`, or `bootstrap.sh` when working from individual source files.
related-packages:
  - id: brew:fontforge
    reason: >
      Use FontForge before eot-utils when an OpenType font must be converted to TrueType
      outlines; the official eot-utils distribution includes a FontForge script
      specifically for that preparation step.
    rel: adjacent_workflow
    sources:
      - https://www.w3.org/Tools/eot-utils/README
      - https://fontforge.org/docs/index.html
category: media
