id: brew:claude-cmd
display-name: claude-cmd
homepage: https://github.com/kiliczsh/claude-cmd
repo: https://github.com/kiliczsh/claude-cmd
docs:
  - https://claudecmd.com/
  - https://github.com/kiliczsh/claude-cmd#readme
config-file-location:
  unix:
    - ~/.claude/settings.json
    - ./.claude/settings.json
    - ./.claude/settings.local.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is distributed through npm as `claude-cmd`; the npm registry metadata
      records five published versions and published version 1.1.1. Homebrew also
      packages the npm tarball as formula `claude-cmd`, giving macOS and Linux users a
      package-manager install path alongside npm.
    - >
      The source trail is narrow: official sources document npm and Homebrew
      distribution, but there is not enough primary evidence to claim broad adoption
      outside the Claude Code power-user niche.
  package-nerd-significance:
    - >
      For package-manager people, claude-cmd is interesting as a dotfile-era tool recast
      for AI coding agents: it packages prompts, slash commands, MCP references, and
      project instruction files into something discoverable and installable from a CLI.
    - >
      Its Homebrew formula wraps an npm tarball, a common pattern for JavaScript CLIs
      that want to be available to users who think in `brew install` rather than `npm
      install -g`.
  project-history:
    - >
      The npm package was first published in July 2025, shortly after Claude Code
      created a market for reusable slash commands, CLAUDE.md files, and .claude project
      configuration. The project keeps the shape of a classic single-purpose developer
      CLI: install it globally, run `claude-cmd`, and use menus or subcommands to
      search, install, and manage Claude Code command assets.
    - >
      The official README emphasizes command discovery, CLAUDE.md generation, local and
      remote command repositories, security profiles, and MCP integration. That makes
      the project part of the first wave of community tools that treated Claude Code
      configuration as packageable developer infrastructure rather than one-off
      dotfiles.
  related-projects:
    - Claude Code is the host tool whose commands and settings claude-cmd manages.
    - >
      Model Context Protocol servers are part of the configuration surface the README
      says claude-cmd can manage.
    - >
      Claude Code Templates is a related community catalog for agents, commands, hooks,
      MCPs, and settings.
  sources:
    - https://github.com/kiliczsh/claude-cmd
    - https://registry.npmjs.org/claude-cmd
    - https://formulae.brew.sh/api/formula/claude-cmd.json
    - https://code.claude.com/docs/en/settings.md
  summary:
    - >
      claude-cmd is a small npm-distributed command manager for Claude Code users. Its
      official README positions it as a lightweight CLI for managing custom commands,
      Claude configuration files, security profiles, and MCP server settings.
  timeline:
    - '2025-07: npm registry records the first `claude-cmd` publication.'
    - '2025-07: npm registry records published version 1.1.1 after five published versions.'
    - '2026: Homebrew formula `claude-cmd` packages version 1.1.1 from the npm registry.'
  usage:
    - >
      Typical use is interactive: run `claude-cmd` to browse command-management menus.
      The README also documents direct subcommands for listing installed commands,
      searching local or remote command repositories, installing a command, and showing
      version help.
    - >
      The tool writes into Claude Code's normal configuration area, including
      `~/.claude/settings.json` and project `.claude/settings.json` or
      `.claude/settings.local.json`, so it complements rather than replaces Claude
      Code's own settings model.
related-packages:
  - id: cask:claude-code
    reason: >
      Claude Code is the required host whose command files, CLAUDE.md instructions,
      settings, permissions, and MCP integrations claude-cmd manages.
    rel: adjacent_workflow
    sources:
      - https://github.com/kiliczsh/claude-cmd#readme
      - https://code.claude.com/docs/en/settings
  - id: brew:claude-code-templates
    reason: >
      Choose Claude Code Templates when you want a broader catalog covering agents,
      hooks, skills, settings, and MCP integrations in addition to reusable commands.
    rel: alternative
    sources:
      - https://github.com/kiliczsh/claude-cmd#readme
      - https://github.com/davila7/claude-code-templates#readme
      - https://docs.aitmpl.com/
category: ai
package-manager:
  brew: claude-cmd
package-manager-url: https://formulae.brew.sh/formula/claude-cmd
license: MIT
tags:
  - ai
  - claude-code
  - cli
  - commands
  - developer-workflow
description: Claude Code Commands Manager
executables:
  - claude-cmd
provenance:
  formula: claude-cmd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
