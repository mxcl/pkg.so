id: brew:croc
display-name: croc
homepage: https://github.com/schollz/croc
repo: https://github.com/schollz/croc
docs:
  - https://github.com/schollz/croc#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official install section documents Homebrew and MacPorts on macOS, Scoop,
      Chocolatey, and Winget on Windows, Nix and NixOS, pacman on Arch, dnf on Fedora,
      portage on Gentoo, Termux, FreeBSD pkg, conda-forge, Docker, and Go source builds.
      That breadth made croc a common package-index entry for secure peer-to-peer-ish
      file transfer even though the protocol uses relays.
  package-nerd-significance:
    - >
      croc is interesting to package maintainers because it is a network CLI where
      usability depends heavily on reproducible, cross-platform binary distribution. The
      same project appears in many package ecosystems, and its runtime behavior is
      intentionally simple enough to be useful from ephemeral shells, developer
      machines, and constrained environments.
  project-history:
    - >
      The project began in 2017 and later standardized around a Go module and release
      binaries. Its README describes the core promise as allowing any two computers to
      transfer data through a relay while preserving end-to-end encryption using PAKE.
    - >
      Over time the feature set grew beyond one-shot file sending: multiple files,
      interrupted-transfer resume, IPv6-first behavior with IPv4 fallback, proxy
      support, text transfer, pipes, QR codes, Docker usage, and platform-specific
      install paths are all part of the official documentation.
  related-projects:
    - >
      PAKE is the cryptographic primitive used to derive the transfer secret from the
      code phrase.
    - >
      Package ecosystems including Homebrew, MacPorts, Scoop, Chocolatey, Winget, Nix,
      pacman, dnf, portage, FreeBSD pkg, Termux, and conda-forge distribute or document
      croc installation.
  sources:
    - https://github.com/schollz/croc#readme
    - https://github.com/schollz/croc/releases/tag/v8.0.13
  summary:
    - >
      croc is a cross-platform CLI for simple, encrypted file and folder transfer
      between two computers. It combines a relay, password-authenticated key agreement,
      resumable transfers, and package-manager-friendly binaries into a tool aimed at
      replacing ad hoc local servers, port forwarding, or manual cloud handoffs.
  timeline:
    - '2017: Repository created.'
    - '2020: v8 release line published on GitHub releases.'
    - >
      2020s: Official installation instructions expanded across macOS, Windows, Linux
      distributions, BSD, Termux, Conda, Docker, and Go.
  usage:
    - >
      A sender runs croc send with files or folders and receives a code phrase; the
      recipient runs croc with that phrase. The phrase establishes the PAKE-derived
      shared secret used for end-to-end encryption, while the relay helps two machines
      connect without a local server or port forwarding.
related-packages:
  - id: brew:magic-wormhole
    reason: >
      Choose Magic Wormhole for its established Python library and documented protocol
      ecosystem; choose croc for a single Go binary with multiple-file transfer,
      resumable transfers, and IPv6-first relay-assisted operation.
    rel: alternative
    sources:
      - https://github.com/schollz/croc#readme
      - https://magic-wormhole.readthedocs.io/en/latest/
category: networking
