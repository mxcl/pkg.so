id: brew:benerator
display-name: rapiddweller Benerator
homepage: https://rapiddweller.github.io/homebrew-benerator/
repo: https://github.com/rapiddweller/rapiddweller-benerator-ce
docs:
  - https://docs.benerator.de/latest
  - https://docs.benerator.de/latest/quick_tour_through_the_descriptor_file_format.html
config-file-location:
  unix:
    - benerator.xml
    - '*.ben.xml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Benerator's adoption history spans older SourceForge-era databene users, the
      rapiddweller fork, Maven/Java distribution, and a later Homebrew formula. Its
      official README distinguishes existing Benerator CE users from new projects, which
      are directed toward rapiddweller's DATAMIMIC platform.
    - >
      The project remains relevant for legacy CI/test-data workflows: the README says
      Benerator CE keeps working and receives bug fixes, security updates, dependency
      and CI maintenance, but no new features.
  package-nerd-significance:
    - >
      Benerator is significant because it is a long-lived Java test-data generator with
      visible project lineage: databene to rapiddweller, SourceForge to GitLab to
      GitHub, then maintenance-mode CE alongside a successor platform.
    - >
      For package managers, it is a useful example of packaging enterprise-adjacent Java
      tooling for local CLI use, including descriptor files, database drivers, scripting
      engines, and security-driven dependency maintenance.
  project-history:
    - >
      The current rapiddweller community repository was created in January 2021 as a
      hard fork and adoption of the older databene-benerator project. The official
      changelog states that 1.0.0 adopted rapiddweller-benerator-ce, updated and tidied
      the project, and made no logical changes since databene-benerator 0.9.8 by Volker
      Bergmann.
    - >
      The 1.1.0 release moved the repository to GitHub and replaced Oracle Nashorn with
      GraalVM scripting. Version 2.0.0 added major performance and documentation
      improvements, while 3.0.0 redesigned parsing, error reporting, execution modes,
      and platform/domain support. The README now marks Benerator CE as maintenance mode
      and points new projects to DATAMIMIC.
  related-projects:
    - databene-benerator is the predecessor project named in the official changelog.
    - DATAMIMIC is rapiddweller's successor platform recommended for new projects.
    - GraalVM is used for scripting after Nashorn removal.
    - >
      Jenkins, GitLab CI, databases, Kafka, and XML/file outputs are part of the
      documented integration surface.
  sources:
    - https://docs.benerator.de/latest/
    - https://github.com/rapiddweller/rapiddweller-benerator-ce
    - https://github.com/rapiddweller/rapiddweller-benerator-ce/blob/development/CHANGELOG.md
    - https://github.com/rapiddweller/rapiddweller-benerator-ce/releases
    - source_facts.package-manager-url
    - source_facts.repo
  summary:
    - >
      rapiddweller Benerator is a model-driven test-data generation and anonymization
      tool. It generates realistic, valid, high-volume test data from XML descriptor
      files and integrations with databases, files, XML, and messaging systems.
  timeline:
    - 'Before 2021: databene-benerator 0.9.8 existed as the predecessor project.'
    - '2021: rapiddweller-benerator-ce 1.0.0 adopted and forked the databene project.'
    - '2021: 1.1.0 moved the repository to GitHub and added GraalVM scripting.'
    - '2021: 2.0.0 improved engine performance and documentation.'
    - '2022: 3.0.0 introduced major parsing, error-reporting, and execution-mode changes.'
    - '2024: 3.2.0 introduced a Homebrew formula and additional dataset improvements.'
    - >
      2026: 3.3.0 shipped maintenance and hardening work while the README directed new
      projects to DATAMIMIC.
  usage:
    - >
      Users describe generation jobs in `benerator.xml` or `*.ben.xml` descriptor files,
      then run the `benerator` command to generate or anonymize datasets. The official
      documentation emphasizes descriptor-driven setup and extension.
    - >
      Typical use cases include generating valid database test data, anonymizing
      production-like data for tests and demos, creating large interconnected datasets,
      and integrating with CI tools such as Jenkins and GitLab CI.
related-packages:
  - id: brew:faker
    reason: >
      Choose Faker for lightweight locale-aware fake values from Python, pytest, or a
      simple CLI; choose Benerator when you need XML-modeled, interconnected
      database/file generation or production-data anonymization.
    rel: alternative
    sources:
      - https://faker.readthedocs.io/en/master/
      - https://faker.readthedocs.io/en/master/cli.html
      - https://docs.benerator.de/latest/introduction_to_benerator.html
      - https://docs.benerator.de/latest/quick_tour_through_the_descriptor_file_format.html
category: developer-tools
package-manager:
  brew: benerator
package-manager-url: https://formulae.brew.sh/formula/benerator
license: Apache-2.0
tags:
  - cli
  - data-anonymization
  - data-generation
  - test-data
description: Tool for realistic test data generation
executables:
  - benerator
provenance:
  formula: benerator
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
