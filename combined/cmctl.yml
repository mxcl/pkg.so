id: brew:cmctl
display-name: cmctl
homepage: https://cert-manager.io
repo: https://github.com/cert-manager/cmctl
docs:
  - https://cert-manager.io/docs/cli/cmctl
  - https://cert-manager.io/docs/reference/cmctl
config-file-location:
  unix:
    - ~/.kube/config
    - files specified by KUBECONFIG
    - '--kubeconfig'
  windows:
    - ~/.kube/config
    - files specified by KUBECONFIG
    - '--kubeconfig'
credentials-file-location:
  unix:
    - ~/.kube/config
    - files specified by KUBECONFIG
    - '--kubeconfig'
  windows:
    - ~/.kube/config
    - files specified by KUBECONFIG
    - '--kubeconfig'
history:
  adoption-history:
    - >
      cmctl follows cert-manager into Kubernetes operator workflows: it can inspect
      certificates, approve or deny CertificateRequests, check cert-manager health, and
      assist with installation, upgrade, and uninstall tasks. The official README
      documents Homebrew, Go install, manual release binaries, shell completion, and
      distributed third-party packages.
  package-nerd-significance:
    - >
      cmctl matters to package nerds because it is a Kubernetes ecosystem CLI with
      multiple distribution channels: Homebrew on macOS/Linux, Go install, GitHub
      release binaries, shell completions, and distro packages. Its separate v2
      versioning is a packaging boundary: the CLI can now release independently of the
      controller it manages.
  project-history:
    - >
      The official README states that before v2, cmctl lived in the cert-manager
      repository and was versioned together with cert-manager. Starting with v2, cmctl
      is versioned separately in its own repository.
    - >
      The standalone GitHub repository was created in January 2024 and its release
      stream begins with v2.0.0 prereleases and v2.0.0 in March 2024.
  related-projects:
    - >
      cmctl is directly related to cert-manager and Kubernetes. The README also
      documents an alternate installation name, `kubectl-cert_manager`, for use as a
      kubectl plugin-style command.
  sources:
    - https://github.com/cert-manager/cmctl#readme
    - https://cert-manager.io/docs/reference/cmctl/
    - https://api.github.com/repos/cert-manager/cmctl
    - https://api.github.com/repos/cert-manager/cmctl/releases
  summary:
    - >
      cmctl is the command-line companion for cert-manager, focused on managing
      cert-manager resources inside Kubernetes clusters.
  timeline:
    - '2024-01: Standalone cmctl repository created.'
    - '2024-03: v2.0.0 released, establishing the separately versioned CLI line.'
    - '2024-06: v2.1.0 released.'
    - '2025: v2.2.0 and later releases continue the standalone series.'
  usage:
    - >
      Official docs describe `cmctl` as a tool for managing cert-manager resources
      inside a cluster. Typical usage is operational rather than general-purpose:
      checking API health, inspecting Certificate and CertificateRequest objects,
      approving or denying requests, and using experimental `cmctl x` subcommands around
      cert-manager installation and lifecycle tasks.
related-packages: []
category: cloud-infrastructure
package-manager:
  apk: cmctl
  brew: cmctl
  macports: cmctl
  nix: cmctl
  pacman: cmctl
  scoop: main/cmctl
  zypper: cmctl
package-manager-url: https://formulae.brew.sh/formula/cmctl
license: Apache-2.0
tags:
  - cert-manager
  - certificates
  - cli
  - cluster-management
  - kubernetes
  - tls
description: Command-line tool to manage cert-manager
executables:
  - cmctl
provenance:
  formula: cmctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
