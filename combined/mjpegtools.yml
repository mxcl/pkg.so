id: brew:mjpegtools
display-name: MJPEG Tools
homepage: https://mjpeg.sourceforge.io/
repo: https://svn.code.sf.net/p/mjpeg/Code/trunk/mjpeg_play
docs:
  - https://mjpeg.sourceforge.io/
  - https://mjpeg.sourceforge.io/files/mjpeg-howto.pdf
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/mjpegtools
    - https://linux.die.net/man/1/mjpegtools
    - https://mjpeg.sourceforge.io/
    - https://sourceforge.net/projects/mjpeg/
  summary:
    - >
      MJPEG Tools is a suite of Linux audio and video utilities for Motion JPEG and MPEG
      workflows. The project site describes the tools as programs for video recording
      and playback, simple cut-and-paste editing, and MPEG compression of audio and
      video under Linux; SourceForge gives the same broad scope and notes support for
      MJPEG capture hardware and Video4Linux2 devices.
  usage:
    - >
      The package reflects an older Unix-media-toolkit style: many focused commands,
      filters, and conversion utilities rather than one monolithic editor. Executables
      such as `jpeg2yuv`, `mpeg2enc`, `mp2enc`, `mplex`, `lav2mpeg`, `lavtrans`, and the
      `y4m*` tools support pipelines around MJPEG, YUV4MPEG, and MPEG encoding. In
      package managers it survives as a specialized media toolbox, packaged by Homebrew
      and several Linux distributions for workflows that need these legacy formats or
      command-line video processing pieces.
related-packages:
  - id: brew:ffmpeg
    reason: >
      FFmpeg is the stronger general-purpose alternative for modern recording,
      conversion, filtering, encoding, and multiplexing across many codecs and
      containers; MJPEG Tools remains useful for its specialized lav and YUV4MPEG
      pipeline utilities.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/mjpeg/
      - https://ffmpeg.org/about.html
      - https://ffmpeg.org/documentation.html
category: media
