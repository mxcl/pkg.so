id: brew:bandwhich
display-name: bandwhich
homepage: https://github.com/imsnif/bandwhich
repo: https://github.com/imsnif/bandwhich
docs:
  - https://github.com/imsnif/bandwhich#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bandwhich moved beyond Cargo-only installation into OS package managers. The
      official INSTALL.md documents Arch, Exherbo, Nix/NixOS, Void, Fedora COPR,
      Homebrew, MacPorts, FreeBSD, and Cargo installation paths; the supplied package
      facts additionally list Homebrew, Alpine, MacPorts, Nix, Arch, and Scoop.
  package-nerd-significance:
    - >
      bandwhich is package-nerd-interesting because it packages a privileged network
      sniffer as a single Rust CLI with platform-specific permission notes. Downstream
      maintainers have to care about capabilities, packet-capture dependencies,
      manpages/completions, and binary release targets.
    - >
      It is also a good example of Rust CLI adoption in system administration: a modern
      replacement-style tool entering classic Unix package channels while still
      retaining Cargo as an installation fallback.
  project-history:
    - >
      The official repository history begins in September 2019. The README describes a
      packet-sniffing tool that cross-references captured traffic with process
      information from /proc on Linux, lsof on macOS, and WinAPI on Windows.
    - >
      The changelog shows fast early iteration through 2020, including raw output, UI
      changes, Windows support, DNS controls, and cross-platform fixes. The current
      README says the project is in passive maintenance: critical issues are addressed,
      but new features are not actively developed without more maintainers.
  related-projects:
    - >
      bandwhich is related to iftop, nethogs, tcpdump-style packet capture tools, and
      Rust terminal UI utilities. Its package-manager peer group is small privileged
      network-monitoring CLIs.
  sources:
    - https://github.com/imsnif/bandwhich
    - https://github.com/imsnif/bandwhich/blob/main/CHANGELOG.md
    - https://github.com/imsnif/bandwhich/blob/main/INSTALL.md
    - https://github.com/imsnif/bandwhich/blob/main/README.md
    - https://github.com/imsnif/bandwhich/commit/ef4adfa50447028330867ad40a9e261c16a94a1f
    - input.source_facts.package-manager
  summary:
    - >
      bandwhich is a Rust terminal utility for showing current network utilization by
      process, connection, and remote host. It fills the same everyday-admin niche as
      tools like iftop and nethogs, but with a modern cross-platform Rust implementation
      and a terminal UI.
  timeline:
    - '2019: Public Git history begins with the initial commit.'
    - '2019: 0.3.0 is tagged as an early public release.'
    - '2020: 0.18.0 adds Windows build and run support.'
    - '2020: 0.20.0 adds an option to specify a DNS server.'
    - '2024: 0.23.x releases update packaging, CI, and platform support.'
    - '2020s: README marks the project as passively maintained.'
  usage:
    - >
      bandwhich generally needs elevated capture permissions. The README documents Linux
      setcap and sudo workflows, Windows npcap requirements, interface selection, raw
      output, reverse-DNS controls, DNS display, and logging options.
    - >
      Its core use is answering a simple operational question from a terminal: which
      local process and remote endpoint are currently using bandwidth.
related-packages:
  - id: brew:nethogs
    reason: >
      Choose NetHogs for a mature Linux-first view grouped primarily by process; choose
      bandwhich for a cross-platform Rust TUI that also exposes connections and remote
      addresses.
    rel: alternative
    sources:
      - https://github.com/imsnif/bandwhich
      - https://github.com/raboof/nethogs
  - id: brew:iftop
    reason: >
      Choose iftop when host-pair traffic on one interface is the main concern;
      bandwhich adds explicit local-process attribution and separate process,
      connection, and address views.
    rel: alternative
    sources:
      - https://github.com/imsnif/bandwhich
      - https://pdw.ex-parrot.com/iftop/
category: networking
package-manager:
  apk: bandwhich
  brew: bandwhich
  macports: bandwhich
  nix: bandwhich
  pacman: bandwhich
  scoop: main/bandwhich
package-manager-url: https://formulae.brew.sh/formula/bandwhich
license: MIT
tags:
  - bandwidth
  - cli
  - networking
  - terminal
description: Terminal bandwidth utilization tool
executables:
  - bandwhich
provenance:
  formula: bandwhich
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
