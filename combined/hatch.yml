id: brew:hatch
display-name: Hatch
homepage: https://hatch.pypa.io/latest/
repo: https://github.com/pypa/hatch
docs:
  - https://hatch.pypa.io/latest
config-file-location:
  macos: ~/Library/Application Support/hatch/config.toml
  unix:
    - $XDG_CONFIG_HOME/hatch/config.toml
    - ~/.config/hatch/config.toml
  windows: '%USERPROFILE%\AppData\Local\hatch\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Hatch adoption came from Python projects that wanted a single
      pyproject.toml-native workflow for building, testing, versioning, environment
      scripts, and publishing. Its README presents standardized builds, reproducible
      builds by default, environment management, Python management, test execution,
      static analysis, script running, publishing, version management, and project
      generation as first-class features.
    - >
      The build documentation emphasizes that Hatch complies with modern Python
      packaging specifications and that other tools can consume projects using Hatch as
      a build backend. This is central to adoption: projects can use Hatchling while
      still interoperating with pip, tox, cibuildwheel, PyPI, and other packaging tools.
    - >
      Package-manager adoption reflects that dual role. Homebrew and other OS package
      managers distribute the hatch CLI, while Python packaging itself consumes
      Hatchling through build-system requirements in pyproject.toml.
  package-nerd-significance:
    - >
      Hatch is significant because it bundles several trends in Python packaging:
      pyproject.toml configuration, backend/front-end separation, reproducible builds,
      environment automation, plugin hooks, and standards-based metadata. It is not just
      a build backend and not just a virtualenv wrapper.
    - >
      For package nerds, Hatchling's small build-backend role is as important as the
      hatch CLI. A project can depend on Hatchling for wheel and sdist creation while
      developers use Hatch for environments, scripts, tests, versions, and publishing.
    - >
      The changelog also tracks the moving Python packaging target: Python version
      support drops, metadata version updates, SBOM support, dependency groups, UV
      integration, lockfiles, PyPI telemetry user agents, and workspace concepts all
      appear as the ecosystem evolves.
  project-history:
    - >
      The Hatch history page records version 1.0.0 on 2022-04-28 as the first stable
      release of Hatch v1 and a complete rewrite. The adjacent Hatchling history records
      0.24.0 on the same date as the initial public release of the Hatchling build
      system, establishing the split between the user-facing Hatch CLI and the build
      backend.
    - >
      The 1.1.0 history entry says project metadata was updated to reflect adoption by
      PyPA and production stability. That matters historically because PyPA ownership
      placed Hatch among the packaging tools documented and maintained in the Python
      packaging ecosystem rather than as only an individual project.
    - >
      Later history entries show Hatch broadening from packaging and environments into
      batteries-included project operations: publishing confirmation and index plugins,
      virtual-environment storage and plugin APIs, automatic Python distribution
      downloads, test commands, static analysis defaults, standalone binaries through
      PyApp, UV support, dependency groups, workspaces, and PEP 751 lockfile commands.
  related-projects:
    - Hatchling is Hatch's build backend and is declared by projects through pyproject.toml.
    - PyPA is the Python Packaging Authority organization under which Hatch is maintained.
    - >
      PyPI, pip, tox, cibuildwheel, virtualenv, UV, Ruff, PyApp, and Python packaging
      standards are recurring integration points in Hatch documentation and history.
  sources:
    - https://formulae.brew.sh/formula/hatch
    - https://github.com/pypa/hatch
    - https://hatch.pypa.io/
    - https://hatch.pypa.io/1.12/history/hatchling/
    - https://hatch.pypa.io/1.16/build/
    - https://hatch.pypa.io/1.16/why/
    - https://hatch.pypa.io/dev/history/hatch/
  summary:
    - >
      Hatch is a modern, extensible Python project manager under the PyPA organization.
      It packages project creation, build backend integration, environment management,
      testing, static analysis, versioning, publishing, Python distribution management,
      and script running behind one CLI.
    - >
      Its history is tied to Python's move toward pyproject.toml-centered packaging.
      Hatch and Hatchling give package authors a standards-compliant build backend plus
      a workflow tool, making it a notable entry in the post-setup.py packaging era.
  timeline:
    - >
      2022-04-28: Hatch 1.0.0 shipped as the first stable v1 release and complete
      rewrite; Hatchling 0.24.0 shipped as the initial public build-system release.
    - >
      2022-05-12: Hatch 1.1.0 updated project metadata to reflect PyPA adoption and
      production stability.
    - >
      2023: Hatch added and refined publishing, virtual environment behavior, build
      backend flexibility, automatic Python downloads, and plugin interfaces.
    - >
      2024: Hatch added a test command, UV support for virtual environments, official
      GitHub Action support, and Python distribution source controls.
    - >
      2025: Hatch 1.16.0 added workspace support inspired by Cargo Workspaces and
      dependency group support.
    - >
      2026: Hatch 1.17.0 added check commands, PEP 751 lockfile generation, dependency
      lock/sync commands, and pluggable dependency lockers.
  usage:
    - >
      Typical CLI workflows include hatch new, hatch build, hatch publish, hatch
      version, hatch run, hatch env commands, hatch test, and Hatch-managed Python or
      environment operations. Configuration lives in user config files plus
      pyproject.toml or hatch.toml project tables.
    - >
      As a build backend, Hatchling is declared in pyproject.toml with
      build-system.requires and build-backend. As a workflow manager, Hatch creates and
      runs named environments, executes scripts, builds distributions, and coordinates
      publishing without forcing all projects to abandon other tools in the packaging
      ecosystem.
related-packages:
  - id: brew:tox
    reason: >
      Choose tox when the primary requirement is declarative multi-environment package
      testing rather than Hatch's broader build, versioning, Python-management, and
      publishing workflow.
    rel: alternative
    sources:
      - https://hatch.pypa.io/latest/why/
      - https://tox.wiki/en/latest/
  - id: brew:nox
    reason: >
      Choose Nox when test and automation sessions should be programmed directly in
      Python instead of managed through Hatch's environment configuration.
    rel: alternative
    sources:
      - https://hatch.pypa.io/latest/why/
      - https://nox.thea.codes/
category: developer-tools
package-manager:
  apk: hatch
  brew: hatch
  dnf: hatch
  macports: hatch
  nix: hatch
  scoop: main/hatch
  winget: PyPA.Hatch
package-manager-url: https://formulae.brew.sh/formula/hatch
license: MIT
tags:
  - build-system
  - cli
  - packaging
  - project-management
  - python
  - virtual-environments
description: Modern, extensible Python project management
executables:
  - hatch
provenance:
  formula: hatch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
