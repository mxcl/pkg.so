id: brew:khard
display-name: khard
homepage: https://khard.readthedocs.io/en/latest/
repo: https://github.com/lucc/khard
docs:
  - https://khard.readthedocs.io/en/latest
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/khard/khard.conf
    - ~/.config/khard/khard.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      khard grew in the same terminal PIM ecosystem as khal and vdirsyncer. Its README
      says it is packaged for multiple distributions and published on PyPI, and the
      batch metadata records packages for Alpine, Homebrew, Debian, Fedora, Nix, Arch,
      and Ubuntu.
    - >
      The project was started by Eric Scheibler and later maintained by lucc, with
      multiple contributors over the years. That maintainer transition and the long
      changelog show a small but durable utility rather than a one-off script.
  package-nerd-significance:
    - >
      khard is significant as a packageable bridge between standards-based contact data
      and shell workflows. It turns vCard/CardDAV address books into files and CLI
      subcommands that can be composed with editors, mail clients, synchronizers, and
      dotfile-managed configuration.
  project-history:
    - >
      The upstream changelog records khard 0.1.0 on September 18, 2014 as the initial
      release. Early releases added a new project structure, Twinkle integration, alot
      support, nickname and web/contact fields, mutt-oriented email workflows,
      XDG_CONFIG_HOME support, YAML contact templates, and safer writes.
    - >
      khard 0.11.0 on July 17, 2016 made the project Python 3 compatible and improved
      vCard 3.0 and 4.0 support. Later releases added generated documentation and man
      pages, stricter config validation, query syntax, pyproject-based packaging, and in
      version 0.18.0 on December 10, 2022 moved the project home on GitHub from the
      original scheibler namespace to lucc.
  related-projects:
    - >
      vdirsyncer is the common synchronization companion. khal is the related console
      calendar program, while mutt, alot, and Twinkle are explicitly documented
      integration targets.
  sources:
    - https://formulae.brew.sh/formula/khard
    - https://github.com/lucc/khard
    - https://khard.readthedocs.io/en/latest
    - https://raw.githubusercontent.com/lucc/khard/main/CHANGES
    - https://raw.githubusercontent.com/lucc/khard/main/README.md
  summary:
    - >
      khard is a Unix-console address book for local vCard files. It reads, creates,
      modifies, and removes contacts, and is designed to cooperate with mail clients,
      text editors, vdir synchronizers, and VOIP clients.
  timeline:
    - '2014-09-18: khard 0.1.0 initial release.'
    - '2015-09-05: khard 0.5.0 added merge support and XDG_CONFIG_HOME support.'
    - >
      2016-07-17: khard 0.11.0 made the project Python 3 compatible and enhanced vCard
      3.0 and 4.0 support.
    - '2020-04-04: khard 0.16.0 expanded documentation and built docs on Read the Docs.'
    - '2022-12-10: khard 0.18.0 moved the project home on GitHub from scheibler to lucc.'
    - >
      2026-06-15: khard 0.21.0 removed Python 3.9 support and fixed config
      skip_unparsable handling.
  usage:
    - >
      Users keep vCard files in local address-book directories, often synchronized from
      CardDAV by vdirsyncer, then use khard to list, search, show, edit, create, remove,
      and query contacts. It is commonly wired into mail-client address completion,
      especially mutt-style workflows.
related-packages:
  - id: brew:vdirsyncer
    reason: >
      Pair vdirsyncer with khard to synchronize khard's local vCard directories with
      CardDAV servers; khard's official documentation identifies a vdir synchronizer as
      a primary companion.
    rel: adjacent_workflow
    sources:
      - https://khard.readthedocs.io/en/latest/
      - https://vdirsyncer.pimutils.org/en/stable/tutorial.html
  - id: brew:mutt
    reason: >
      Mutt can use khard as its external address book for recipient completion and can
      pipe senders into khard, following khard's documented integration recipe.
    rel: adjacent_workflow
    sources:
      - https://khard.readthedocs.io/en/latest/examples/mutt.html
      - https://www.mutt.org/doc/manual/
category: productivity
package-manager:
  apk: khard
  brew: khard
  debian: khard
  dnf: khard
  nix: khard
  pacman: khard
  ubuntu: khard
package-manager-url: https://formulae.brew.sh/formula/khard
license: GPL-3.0-only
tags:
  - address-book
  - carddav
  - cli
  - contacts
  - vcard
description: Console carddav client
executables:
  - khard
provenance:
  formula: khard
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
