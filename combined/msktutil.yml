id: brew:msktutil
display-name: msktutil
homepage: https://github.com/msktutil/msktutil
repo: https://github.com/msktutil/msktutil
docs:
  - https://github.com/msktutil/msktutil#readme
config-file-location: null
credentials-file-location:
  unix: /etc/krb5.keytab
history:
  project-history:
    - >
      The project's own early-history note identifies Dan Perry as the original author,
      Brian Elliott Finley as the person who Debianized it in March 2006, Doug Engbert
      as a 2009 contributor, and James Knight's 2010 import of the Debian package as the
      point where history and contributions began being tracked in Git. The README lists
      Mark Proehl, Michael Osipov, and Daniel Kobras as maintainers.
  sources:
    - https://formulae.brew.sh/formula/msktutil
    - https://github.com/msktutil/msktutil
    - https://manpages.ubuntu.com/manpages/focal/man1/msktutil.1.html
    - https://packages.debian.org/bookworm/net/msktutil
  summary:
    - >
      msktutil is a Unix/Linux utility for interoperability with Microsoft Active
      Directory Kerberos environments. Its README says it creates user or computer
      accounts in Active Directory, creates system and service keytabs, adds and removes
      principals, and changes account passwords. Ubuntu's man page describes the same
      role: creating AD accounts, adding service principals, and creating local keytab
      files so Kerberized services can use Active Directory as their Kerberos
      infrastructure.
  usage:
    - >
      In practice, msktutil is used by administrators who need non-Windows hosts or
      services to participate in an AD realm without manually constructing keytabs and
      service principals. Its package-manager niche is narrow but important: it
      complements broader AD-join tools by focusing on keytab lifecycle and Kerberos
      principal management for services.
related-packages:
  - id: brew:krb5
    reason: >
      MIT Kerberos provides the client libraries and keytab-based authentication
      machinery that msktutil requires when managing Active Directory principals and
      credentials.
    rel: adjacent_workflow
    sources:
      - https://github.com/msktutil/msktutil/blob/master/msktutil.1.in
      - https://web.mit.edu/kerberos/krb5-latest/doc/basic/keytab_def.html
  - id: brew:samba
    reason: >
      Samba's `net` commands are a broader alternative for Active Directory joining and
      keytab management, while msktutil offers focused keytab handling and an explicit
      Samba-secret interoperability mode.
    rel: alternative
    sources:
      - https://github.com/msktutil/msktutil/blob/master/msktutil.1.in
      - https://www.samba.org/
category: security
package-manager:
  brew: msktutil
  debian: msktutil
  dnf: msktutil
  ubuntu: msktutil
package-manager-url: https://formulae.brew.sh/formula/msktutil
license: GPL-2.0-or-later
tags:
  - active-directory
