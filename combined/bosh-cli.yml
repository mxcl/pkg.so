id: brew:bosh-cli
display-name: BOSH CLI
homepage: https://bosh.io/docs/cli-v2/
repo: https://github.com/cloudfoundry/bosh-cli
docs:
  - https://bosh.io/docs
  - https://bosh.io/docs/cli-global-flags
  - https://bosh.io/docs/cli-v2
  - https://bosh.io/docs/cli-v2-install
config-file-location:
  unix: ~/.bosh/config
credentials-file-location: null
history:
  adoption-history:
    - >
      BOSH CLI adoption follows BOSH itself: Cloud Foundry operators use it to deploy
      directors, upload releases and stemcells, inspect deployments, run errands, and
      apply manifest changes. Cloud Foundry deployment documentation explicitly says
      Cloud Foundry leverages BOSH for deployment, lifecycle management, and
      distributed-systems monitoring.
    - >
      The batch input records Homebrew and Nix packaging, reflecting its role as an
      operator workstation tool rather than an end-user application.
  package-nerd-significance:
    - >
      BOSH CLI is significant because it is one of the classic Cloud Foundry operator
      tools: small as a package, but connected to a deep ecosystem of releases,
      stemcells, directors, CPIs, and cloud deployments.
    - >
      The v1-to-v2 transition is package-history relevant because it moved the operator
      CLI from a Ruby gem era to a Go binary era, changing installation and packaging
      expectations.
  project-history:
    - >
      BOSH began as Cloud Foundry infrastructure tooling, combining release packaging,
      stemcells, deployment manifests, VM lifecycle management, monitoring, recovery,
      and rolling updates. The BOSH site presents it as a project for managing both
      small and large-scale cloud software.
    - >
      The Homebrew package is specifically the Go-based BOSH CLI v2 line. Its repository
      was created in 2016, and BOSH documentation distinguishes it from the older
      Ruby-based CLI v1, noting that v2 is stateless and uses hyphenated single
      commands.
  related-projects:
    - cloudfoundry/bosh is the wider BOSH release and director project that the CLI operates.
    - bosh-deployment provides manifests and operations files for deploying BOSH directors.
    - >
      Cloud Foundry cf-deployment is a major downstream deployment workflow that relies
      on BOSH.
  sources:
    - https://api.github.com/repos/cloudfoundry/bosh-cli
    - https://bosh.io/
    - https://bosh.io/docs/cli-v2-diff/
    - https://bosh.io/docs/cli-v2-install/
    - https://bosh.io/docs/cli-v2/
    - https://docs.cloudfoundry.org/deploying/index.html
    - https://github.com/cloudfoundry/bosh-cli
    - source_facts.package-manager
  summary:
    - >
      BOSH CLI is the command-line interface for Cloud Foundry BOSH, the release
      engineering, deployment, and lifecycle-management system used to operate large
      distributed software across clouds.
  timeline:
    - '2016-08: Official GitHub repository metadata shows cloudfoundry/bosh-cli created.'
    - '2018: GitHub release metadata shows v5.0.1 in the public release feed.'
    - >
      2026: Repository metadata and package-manager input show ongoing maintenance and
      Homebrew/Nix distribution.
  usage:
    - >
      Operators use the CLI to target BOSH environments, log in, interpolate variables,
      upload releases and stemcells, deploy manifests, inspect VMs, run tasks, and
      manage BOSH releases. The CLI docs are organized around those operational
      commands.
    - >
      The CLI stores its local configuration under ~/.bosh/config, but v2 expects more
      state to be supplied explicitly through environments, aliases, flags, and manifest
      files compared with the old Ruby CLI workflow.
related-packages:
  - id: brew:cloudfoundry-cli
    reason: >
      Use Cloud Foundry CLI to push and manage applications on a Cloud Foundry
      foundation that operators deploy and maintain with BOSH CLI.
    rel: adjacent_workflow
    sources:
      - https://docs.cloudfoundry.org/deploying/
      - https://docs.cloudfoundry.org/cf-cli/
category: cloud-infrastructure
package-manager:
  brew: bosh-cli
  nix: bosh-cli
package-manager-url: https://formulae.brew.sh/formula/bosh-cli
license: Apache-2.0
tags:
  - bosh
  - cli
  - cloud-foundry
  - deployment
  - infrastructure
description: Cloud Foundry BOSH CLI v2
executables:
  - bosh-cli
provenance:
  formula: bosh-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
