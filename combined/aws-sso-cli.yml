id: brew:aws-sso-cli
display-name: AWS SSO CLI
homepage: https://synfinatic.github.io/aws-sso-cli/
repo: https://github.com/synfinatic/aws-sso-cli
docs:
  - https://github.com/synfinatic/aws-sso-cli#readme
  - https://synfinatic.github.io/aws-sso-cli
  - https://synfinatic.github.io/aws-sso-cli/latest/config
config-file-location:
  unix:
    - ~/.config/aws-sso/config.yaml
    - ~/.aws-sso/config.yaml
    - ~/.aws/config
credentials-file-location:
  unix:
    - ~/.aws/sso/cache/botocore-client-id-<region>.json
    - ~/.aws/sso/cache/<random>.json
    - ~/.aws/cli/cache/<random>.json
    - ~/.aws/credentials
history:
  adoption-history:
    - >
      Homebrew carries `aws-sso-cli` in homebrew-core, and the project documentation
      names Homebrew as a first-class installation path. Its GitHub repository metadata
      showed hundreds of stars and forks in June 2026, and Homebrew analytics showed
      hundreds of 30-day installs, indicating use beyond a single organization without
      making it a default AWS tool.
    - >
      Adoption has tracked the AWS IAM Identity Center transition: the README explicitly
      notes that AWS SSO was renamed IAM Identity Center, while the underlying config
      fields and APIs still use SSO terminology. That made the package useful during the
      long period when project names, AWS docs, and API names did not all say the same
      thing.
  package-nerd-significance:
    - >
      For package maintainers, AWS SSO CLI is an example of a post-AWS-CLI-v2 helper
      that did not just wrap `aws sso login`; it packaged a more opinionated identity
      workflow as one cross-platform Go binary. The Homebrew formula tracks upstream
      release tags, while upstream also publishes binary, RPM, and DEB artifacts.
  project-history:
    - >
      The public repository was created in May 2021 and early GitHub releases began with
      v1.0.0 in July 2021. It arrived after AWS CLI v2 added native SSO support, but
      focused on organizations with many accounts and many IAM roles, where plain AWS
      CLI profiles can become cumbersome.
    - >
      The project evolved around two package-nerd concerns: a single static Go binary
      with official release artifacts, and a configuration model that could coexist with
      standard AWS CLI profile files. The documentation notes a move to XDG-style state
      under `~/.config/aws-sso` in v1.17.0 while keeping `~/.aws-sso` compatibility.
  related-projects:
    - >
      The README compares AWS SSO CLI to `aws-vault`, noting overlap in secure
      credential handling but a stronger focus on IAM Identity Center instead of
      long-term API keys.
    - >
      `aws-sso-util` and `aws2-wrap` solve adjacent AWS SSO workflow gaps, especially
      profile generation, credential_process integration, or tools that lagged native
      SSO support.
  sources:
    - https://formulae.brew.sh/api/formula/aws-sso-cli.json
    - https://github.com/synfinatic/aws-sso-cli
    - https://raw.githubusercontent.com/synfinatic/aws-sso-cli/main/README.md
    - https://raw.githubusercontent.com/synfinatic/aws-sso-cli/main/docs/config.md
  summary:
    - >
      AWS SSO CLI is a Go command-line tool for AWS IAM Identity Center users who want a
      more ergonomic and more security-focused alternative to the stock AWS CLI SSO
      workflow. The project describes itself as a secure replacement for the `aws
      configure sso` wizard, with role selection, interactive search, profile
      generation, browser console helpers, and encrypted token storage.
  timeline:
    - '2021-05: Public GitHub repository created.'
    - '2021-07: v1.0.0 prerelease published on GitHub.'
    - '2021-10: v1.2.0 published as a non-prerelease GitHub release.'
    - '2026-06: v2.3.1 published; Homebrew stable version tracked v2.3.1.'
  usage:
    - >
      Typical use is `aws-sso` for guided setup, `aws-sso exec` or shell helpers to
      export short-lived STS credentials, and generated entries in `~/.aws/config` for
      tools that already understand AWS named profiles. The README emphasizes encrypted
      storage for AWS SSO client secrets, access tokens, and CLI cache credentials.
    - >
      The tool is most relevant for developers who switch across many AWS accounts and
      roles, especially when the AWS web console and CLI both need fast profile
      switching.
related-packages:
  - id: brew:aws-sso-util
    reason: >
      Choose aws-sso-util when profile population, credential-process compatibility, SDK
      support, and Identity Center administration are the priority; AWS SSO CLI
      emphasizes interactive role selection, protected tokens, and console sessions.
    rel: alternative
    sources:
      - https://github.com/synfinatic/aws-sso-cli#readme
      - https://github.com/61418/aws-sso-util#readme
      - https://github.com/61418/aws-sso-util/blob/master/docs/configure.md
  - id: brew:aws-vault
    reason: >
      Choose AWS Vault when secure storage and temporary sessions for static IAM keys or
      varied credential sources are central; AWS SSO CLI is specifically optimized for
      IAM Identity Center users.
    rel: alternative
    sources:
      - https://github.com/synfinatic/aws-sso-cli#readme
      - https://github.com/ByteNess/aws-vault#readme
  - id: brew:awscli
    reason: >
      Choose AWS CLI's native SSO commands for the vendor-supported baseline workflow;
      AWS SSO CLI adds richer multi-account role discovery, profile management, and
      browser-session features.
    rel: alternative
    sources:
      - https://github.com/synfinatic/aws-sso-cli#readme
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sso.html
      - https://github.com/aws/aws-cli
category: cloud-infrastructure
