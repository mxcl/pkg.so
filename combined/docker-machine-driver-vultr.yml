id: brew:docker-machine-driver-vultr
display-name: Docker Machine Vultr Driver
homepage: https://github.com/vultr/docker-machine-driver-vultr
repo: https://github.com/vultr/docker-machine-driver-vultr
docs:
  - https://github.com/vultr/docker-machine-driver-vultr#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is mainly visible through its role as an official Vultr-maintained driver
      and its Homebrew formula. The README's Rancher Machine emphasis reflects the
      broader migration away from upstream Docker Machine while preserving the
      provider-driver interface for users who still need automatic Vultr node creation.
  package-nerd-significance:
    - >
      For package people, this is a clean specimen of cloud-specific Docker Machine
      driver packaging: a provider API wrapped as a small CLI plugin, distributed
      separately from the core tool, and useful only when the matching provider and
      orchestration workflow are in play.
  project-history:
    - >
      The Vultr README describes the package as a driver for both docker-machine and
      Rancher Node Driver use. It now points users toward rancher-machine, noting that
      docker-machine is maintained there under that successor workflow, while still
      documenting the older driver binary installation model.
  related-projects:
    - >
      Related projects include Docker Machine, Rancher Machine, Rancher Node Driver
      workflows, Vultr's API, and other Docker Machine cloud drivers.
  sources:
    - https://github.com/vultr/docker-machine-driver-vultr#readme
    - https://github.com/rancher/machine
    - https://gitlab.com/gitlab-org/ci-cd/docker-machine
  summary:
    - >
      Docker Machine Vultr Driver is a provider plugin that lets docker-machine, and
      later Rancher Machine workflows, create Docker-capable hosts on Vultr. It is a
      narrow but historically useful package from the period when docker-machine drivers
      were the standard way to turn cloud VMs into Docker hosts from a laptop or CI
      system.
  timeline:
    - 'Docker Machine era: The driver implements the external cloud-provider plugin model.'
    - 'Rancher Machine era: The README recommends rancher-machine for successor workflows.'
    - >
      Vultr APIv4 era: The documented workflow uses Vultr APIv4 personal API keys and
      provider-specific options.
  usage:
    - >
      Users install docker-machine or rancher-machine, place docker-machine-driver-vultr
      on PATH, provide a Vultr API key, and run a create command with the vultr driver.
      The documented options expose Vultr-specific server type, region, plan, OS, SSH
      key, networking, backups, firewall, tag, and startup-data controls.
related-packages:
  - id: brew:rancher-machine
    reason: >
      Upstream recommends Rancher Machine as the maintained host application for using
      this driver in Rancher-oriented provisioning workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/vultr/docker-machine-driver-vultr#readme
      - https://github.com/rancher/machine#readme
  - id: brew:docker-machine
    reason: >
      The driver remains compatible with Docker Machine, which discovers it on PATH and
      delegates Vultr host creation to it.
    rel: adjacent_workflow
    sources:
      - https://github.com/vultr/docker-machine-driver-vultr#readme
      - https://gitlab.com/gitlab-org/ci-cd/docker-machine/-/raw/main/README.md
