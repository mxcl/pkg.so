id: brew:cppp
display-name: cppp
homepage: https://www.muppetlabs.com/~breadbox/software/cppp.html
repo: https://git.sr.ht/~breadbox/cppp
docs:
  - https://www.muppetlabs.com/~breadbox/software/cppp.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project has a small distribution footprint, with the official page linking
      both a release tarball and the SourceHut repository.
  package-nerd-significance:
    - >
      cppp is package-nerd interesting because it fills a narrow gap between doing no
      preprocessing and running the full C preprocessor, preserving source shape while
      pruning known feature branches.
  project-history:
    - >
      The official page describes cppp as a focused tool for applying selected #ifdef,
      indeterminate preprocessor logic in place.
  related-projects:
    - >
      cppp is related to the C preprocessor, but it intentionally performs only partial
      conditional evaluation instead of full macro preprocessing.
  sources:
    - https://www.muppetlabs.com/~breadbox/software/cppp.html
    - https://git.sr.ht/~breadbox/cppp
  summary:
    - >
      cppp is a partial C preprocessor: it applies only the subset of conditional
      preprocessing decisions requested by the user.
  timeline:
    - 'Current release page: The official homepage links cppp-2.9.tar.gz.'
    - 'Current source hosting: The official homepage links the SourceHut repository.'
  usage:
    - >
      Users run cppp with macro symbols defined or undefined on the command line. The
      tool removes or simplifies conditional-inclusion blocks only when those symbols
      determine the result.
related-packages:
  - id: brew:unifdef
    reason: >
      Choose unifdef for its established BSD-style filtering of C preprocessor
      conditionals and its unifdefall workflow; cppp provides a separate, narrowly
      targeted partial-preprocessing implementation.
    rel: alternative
    sources:
      - https://www.muppetlabs.com/~breadbox/software/cppp.html
      - https://dotat.at/prog/unifdef/unifdef.txt
category: developer-tools
package-manager:
  brew: cppp
package-manager-url: https://formulae.brew.sh/formula/cppp
license: GPL-2.0-or-later
tags:
  - c
  - cli
  - preprocessor
  - source-transformation
description: Partial Preprocessor for C
executables:
  - cppp
provenance:
  formula: cppp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
