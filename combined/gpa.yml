id: brew:gpa
display-name: GPA
homepage: https://www.gnupg.org/related_software/gpa/
repo: https://dev.gnupg.org/source/gpa.git
docs:
  - https://www.gnupg.org/software/gpa/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GPA followed the evolution of GnuPG itself: releases in the 0.9 series added
      support for GnuPG 2.1 era features such as ECC, keyserver operations, and TOFU
      information, while later 0.10 and 0.11 releases improved diagnostics, Web Key
      Directory lookup behavior, and GTK 3 support.
  package-nerd-significance:
    - >
      Package maintainers care about GPA because it sits at the intersection of GUI
      toolkit churn, GnuPG/GPGME ABI compatibility, and desktop security UX. It is
      optional software in the GnuPG download family, but it depends on the same trust,
      keyring, and protocol stack that distributions already package for command-line
      GnuPG.
  project-history:
    - >
      The GPA repository history was initialized from CVS in February 2000, and the
      repository records early 2000 work on UI design, GPAPA integration, and version
      0.1.0. The README credits early copyright ownership to G-N-U GmbH, Miguel Coca,
      and g10 Code GmbH, and notes use of fragments from JNLIB, GPGME, and WinPT.
    - >
      GnuPG project pages describe GPA as a graphical user interface for GnuPG using
      GTK+. Werner Koch described it on the GnuPG users list in 2010 as the first GUI
      frontend for GPG, which matches its place in the GnuPG desktop tooling family.
  related-projects:
    - GnuPG provides the cryptographic backend and command-line tools.
    - GPGME is the library layer GPA uses to access GnuPG functionality.
    - >
      Pinentry, Scute, and other GnuPG frontends and tools occupy adjacent roles in the
      GnuPG software family.
  sources:
    - https://dev.gnupg.org/source/gpa.git
    - https://git.gnupg.org/cgi-bin/gitweb.cgi?p=gpa.git
    - https://lists.gnupg.org/pipermail/gnupg-users/2010-January.txt
    - https://www.gnupg.org/download/
    - https://www.gnupg.org/software/gpa/index.html
  summary:
    - >
      GPA, the GNU Privacy Assistant, is a GTK graphical frontend for GnuPG. It provides
      key management plus encryption, decryption, signing, and signature verification
      for users who prefer a desktop interface over direct `gpg` command-line use.
  timeline:
    - >
      2000: CVS-derived repository history begins and version 0.1.0 appears in the
      commit history.
    - >
      2010: Werner Koch describes GPA as the first GUI frontend for GPG on the GnuPG
      users list.
    - '2014: GPA 0.9.5 adds ECC awareness and UI-server startup behavior.'
    - '2016: GPA 0.9.10 adds basic TOFU information and several key-management fixes.'
    - >
      2018: GPA 0.10.0 adds diagnostic details, Web Key Directory lookup behavior, and
      key-manager improvements.
    - '2024: GPA 0.11.0 ports the application to GTK 3.'
    - '2026: GPA 0.11.1 fixes GPGME 2.x build compatibility and a marshaling crash.'
  usage:
    - >
      GPA is used for OpenPGP and S/MIME-oriented desktop workflows: managing private
      and public keys, encrypting and decrypting files, signing data, verifying
      signatures, and calling into GnuPG through GPGME rather than reimplementing
      cryptography.
related-packages:
  - id: brew:gnupg
    reason: >
      GnuPG is GPA's cryptographic and key-management backend, so install or use it
      directly when command-line automation is preferable to GPA's GTK interface.
    rel: adjacent_workflow
    sources:
      - https://gnupg.org/software/gpa/
      - https://gnupg.org/documentation/manuals/gnupg/
  - id: brew:gpgme
    reason: >
      GPGME provides the supported high-level application API to GnuPG and is the
      integration layer relevant to GPA compatibility and development.
    rel: adjacent_workflow
    sources:
      - https://gnupg.org/software/gpa/
      - https://gnupg.org/software/gpgme/index.html
category: security
package-manager:
  brew: gpa
  nix: gpa
  ubuntu: gpa
  zypper: gpa
package-manager-url: https://formulae.brew.sh/formula/gpa
license: GPL-3.0-or-later
