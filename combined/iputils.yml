id: brew:iputils
display-name: iputils
homepage: https://github.com/iputils/iputils
repo: https://github.com/iputils/iputils
docs:
  - https://github.com/iputils/iputils#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      iputils is widely packaged because ping and its sibling tools are expected on
      Linux systems, rescue environments, containers, CI images, and network
      troubleshooting hosts. The Homebrew formula and the distribution package names in
      the source facts reflect how the same upstream is split differently by downstream
      package managers.
    - >
      The package also carries portability expectations across Linux libc
      implementations. Its README explicitly lists glibc, uClibc-ng, and musl support,
      which matters for Alpine, embedded systems, and container-focused distributions.
  package-nerd-significance:
    - >
      iputils is package-nerd important because it turns 'ping' from a generic command
      expectation into a concrete upstream with release history, removed-program policy,
      libc support, and distribution-specific splits.
    - >
      It is also a reminder that base utilities are not static: even tiny networking
      commands accumulate kernel compatibility, privilege-model, translation, and
      test-environment concerns.
  project-history:
    - >
      The iputils README traces the project to Alexey Kuznetsov's 1999 releases, with a
      first downloadable release dated 1999-04-16 and later maintenance by Hideaki
      Yoshifuji from 2006 through 2015. The repository keeps that history visible in a
      dedicated History section rather than treating the tools as anonymous base-system
      commands.
    - >
      The suite has been pruned over time. The README records removed tools such as
      ninfod, rarpd, rdisc, tftpd, and traceroute6, with replacements noted where
      appropriate. That pruning left the package focused on the small Linux network
      diagnostics that still fit its purpose.
  related-projects:
    - >
      iputils overlaps historically with Linux iproute tooling, traceroute, mtr,
      tftp-hpa, dnsmasq, libc implementations, and the Linux kernel networking test
      surface.
  sources:
    - https://formulae.brew.sh/formula/iputils
    - https://github.com/iputils/iputils
    - https://github.com/iputils/iputils#readme
  summary:
    - >
      iputils is a compact Linux networking utility suite built around everyday
      diagnostic tools such as ping, arping, tracepath, and clockdiff. It packages the
      command-line instruments administrators reach for before heavier packet capture or
      routing-analysis tools.
  timeline:
    - "1999: Alexey Kuznetsov's iputils release line begins."
    - '1999: First downloadable release listed as iputils-ss990417.'
    - "2006: Hideaki Yoshifuji's release line begins."
    - '2015: Yoshifuji release line reaches s20151218.'
    - '2021: Several obsolete tools are listed with their last release before removal.'
  usage:
    - >
      Users invoke iputils tools for reachability checks, round-trip timing, path MTU
      discovery, simple route-path inspection, ARP probing, and clock-difference checks.
      The package deliberately stays close to the network stack and avoids becoming a
      broad monitoring framework.
    - >
      Development guidance in the README asks bug reporters to document kernel and
      distribution details and suggests network namespaces for tests, which reflects the
      package's tight coupling to Linux kernel behavior.
related-packages:
  - id: brew:mtr
    reason: >
      Choose mtr when ping or tracepath needs to become a continuous per-hop latency and
      loss view; iputils itself identifies mtr as a replacement in the retired
      traceroute6 workflow.
    rel: alternative
    sources:
      - https://github.com/iputils/iputils#history
      - https://github.com/traviscross/mtr
category: networking
package-manager:
  apk: iputils
  brew: iputils
  debian: iputils-arping
  dnf: iputils
  nix: iputils
  pacman: iputils
  ubuntu: iputils-arping
  winget: WhoElse.Ping
  zypper: iputils
package-manager-url: https://formulae.brew.sh/formula/iputils
license: GPL-2.0-or-later AND BSD-3-Clause
tags:
  - cli
  - diagnostics
  - linux
  - networking
  - ping
  - tracepath
description: Set of small useful utilities for Linux networking
executables:
  - clockdiff
  - ping
  - tracepath
provenance:
  formula: iputils
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
