id: brew:libdca
display-name: libdca
homepage: https://www.videolan.org/developers/libdca.html
repo: https://code.videolan.org/videolan/libdca
docs:
  - https://www.videolan.org/developers/libdca.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libdca's adoption came through DVD and media-player ecosystems that needed DTS
      Coherent Acoustics decoding. VideoLAN documents the standard's use in DVD, DTS
      audio CD, and radio broadcasting, and the library naturally fit VLC and other
      package-manager multimedia dependency sets.
  package-nerd-significance:
    - >
      libdca is a compact codec-library package with a naming story, standards tie-in,
      GPL licensing, VideoLAN ownership, and command-line tools. It is the sort of
      package that reveals how codec support historically entered Unix distributions as
      small libraries around bigger media players.
  project-history:
    - >
      VideoLAN's project page says the code was written by Gildas Bazin, based on
      a52dec, and released under the GPL. The repository README preserves the older
      libdts naming, describes goals of portability, reusability, precision, and speed,
      and notes that VLC was the primary project using it in the early README text.
    - >
      The NEWS file records dcadec 0.0.1 on 8 February 2004 as the first public release,
      followed by libdca/libdts releases through 0.0.7. Version 0.0.3 in April 2007
      changed the library name to libdca from libdts, and later 2018 and 2020 releases
      were mostly build-system and maintenance fixes.
  related-projects:
    - >
      a52dec is the direct codebase ancestor named by VideoLAN. VLC media player is the
      early user named by upstream, and DTS Coherent Acoustics / ETSI TS 102 114 is the
      codec standard behind the package.
  sources:
    - https://code.videolan.org/api/v4/projects/videolan%2Flibdca/repository/tags?per_page=20
    - https://code.videolan.org/videolan/libdca
    - https://code.videolan.org/videolan/libdca/-/raw/master/AUTHORS
    - https://code.videolan.org/videolan/libdca/-/raw/master/NEWS
    - https://code.videolan.org/videolan/libdca/-/raw/master/README
    - https://www.videolan.org/developers/libdca.html
  summary:
    - >
      libdca is VideoLAN's free C library for decoding DTS Coherent Acoustics streams.
      It began as libdts/dcadec, was based on a52dec, and became a small but
      recognizable codec package in Unix multimedia stacks.
  timeline:
    - >
      2004: dcadec 0.0.1 was released as the first public release of libdca, then known
      as libdts.
    - '2004: libdca 0.0.2 added high-frequency vector-quantization support and packaging work.'
    - '2007: libdca 0.0.3 changed the library name from libdts to libdca.'
    - '2007: libdca 0.0.5 fixed a header typo after shared-library and build-system fixes.'
    - '2018: libdca 0.0.6 shipped mostly build-system bug fixes.'
    - '2020: libdca 0.0.7 shipped build-system fixes and a potential out-of-bound access fix.'
  usage:
    - >
      The library is linked by media software for DTS/DCA decoding, while dcadec acts as
      a test and proof-of-concept decoder. The README documents decoding raw DTS
      Coherent Acoustics streams and multiplexed MPEG program streams, plus output
      options for downmixing, performance testing, and conformance testing.
related-packages:
  - id: cask:vlc
    reason: >
      VLC was libdca's principal early consumer and provides an end-user media player
      around the library's DTS decoding capability.
    rel: adjacent_workflow
    sources:
      - https://code.videolan.org/videolan/libdca/-/raw/master/README
      - https://www.videolan.org/vlc/
category: media
