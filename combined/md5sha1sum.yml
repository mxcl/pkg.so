id: brew:md5sha1sum
display-name: md5sha1sum
homepage: http://microbrew.org/tools/md5sha1sum/
repo: null
docs:
  - http://microbrew.org/tools/md5sha1sum
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager metadata shows Homebrew and MacPorts packaging
      md5sha1sum. Its adoption appears narrow but useful on macOS-oriented package
      managers, where GNU-compatible checksum command names were historically less
      universal than on GNU/Linux.
    - >
      Because only the official Microbrew page and package-manager metadata are
      available here, broader adoption claims should be kept modest.
  package-nerd-significance:
    - >
      md5sha1sum is a package-nerd artifact from the era when Unix variants differed
      sharply in which GNU-style checksum tools were present by default. Its purpose was
      not novelty but portability: providing the familiar hash commands in a tiny
      OpenSSL-backed package.
    - >
      The package is also a reminder that package managers preserve small compatibility
      utilities long after the surrounding platform defaults have changed.
  project-history:
    - >
      The official Microbrew page lists releases from 0.9.0 on 2004-07-31 through 0.9.5
      on 2006-12-06. It presents the package as a lightweight portability utility for
      Linux, Solaris 7 through 10, and Mac OS X, with OpenSSL 0.9.6 or newer as its only
      listed dependency.
    - >
      The project is distributed from the official homepage as source tarballs rather
      than through an official source-control repository. That matches its early-2000s
      package style: a small tarball, README, INSTALL, ChangeLog, and checksums on a
      simple project page.
  related-projects:
    - >
      The official page positions md5sha1sum as an alternative to GNU textutils hash
      utilities.
    - OpenSSL is listed as the package dependency.
  sources:
    - http://microbrew.org/tools/md5sha1sum
    - http://microbrew.org/tools/md5sha1sum/ChangeLog
    - http://microbrew.org/tools/md5sha1sum/INSTALL
    - http://microbrew.org/tools/md5sha1sum/README
    - source_facts.package-manager
  summary:
    - >
      md5sha1sum is a small Microbrew toolset providing md5sum, sha1sum, and
      ripemd160sum replacements. The official page says the tools were intended as
      compact drop-in replacements for GNU textutils hash utilities, especially for
      systems such as Solaris where installing all of textutils was excessive.
  timeline:
    - '2004-07-31: md5sha1sum 0.9.0 released.'
    - '2004-08-03: md5sha1sum 0.9.2 released.'
    - '2006-12-05: md5sha1sum 0.9.4 released.'
    - '2006-12-06: md5sha1sum 0.9.5 released and listed as latest on the official page.'
  usage:
    - >
      The official page describes the tools as drop-in replacements for md5sum, sha1sum,
      and ripemd160sum. In practice the package is for shell scripts and users that want
      familiar checksum commands without installing the larger GNU textutils/coreutils
      set.
    - >
      Homebrew's recorded executable for this formula is `ripemd160sum`, while the
      upstream page documents the full md5sum, sha1sum, and ripemd160sum toolset.
related-packages:
  - id: brew:coreutils
    reason: >
      GNU Coreutils is the broad, actively documented replacement for standard checksum
      scripts, supplying `md5sum`, `sha1sum`, SHA-2 utilities, and the multi-algorithm
      `cksum` interface.
    rel: alternative
    sources:
      - http://microbrew.org/tools/md5sha1sum
      - https://www.gnu.org/software/coreutils/manual/coreutils.html
  - id: brew:rhash
    reason: >
      RHash is preferable when RIPEMD-160 must be combined with recursive directory
      processing, multi-digest output, or hash-file verification.
    rel: alternative
    sources:
      - http://microbrew.org/tools/md5sha1sum
      - https://rhash.sourceforge.io/
      - https://rhash.sourceforge.io/manpage.php
  - id: brew:md5deep
    reason: >
      md5deep/hashdeep is the alternative for recursive file-set hashing, known-hash
      matching, and forensic audits rather than simple drop-in checksum commands.
    rel: alternative
    sources:
      - http://microbrew.org/tools/md5sha1sum
      - https://github.com/jessek/hashdeep/blob/master/README.md
category: security
package-manager:
  brew: md5sha1sum
  macports: md5sha1sum
package-manager-url: https://formulae.brew.sh/formula/md5sha1sum
license: GPL-2.0-or-later
tags:
  - checksums
  - cli
  - hashing
  - md5
  - sha1
description: Hash utilities
executables:
  - ripemd160sum
provenance:
  formula: md5sha1sum
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
