id: brew:actions-languageserver
display-name: GitHub Actions Language Server
homepage: https://github.com/actions/languageservices/tree/main/languageserver
repo: https://github.com/actions/languageservices
docs:
  - https://github.com/actions/languageservices/tree/main/languageserver#readme
config-file-location:
  unix: ~/.config/nvim/lsp/actionsls.lua
credentials-file-location: null
history:
  adoption-history:
    - >
      The package sits in the editor-tooling path for GitHub Actions authors: it can be
      embedded by VS Code-style clients, run from web workers, or configured in editors
      such as Neovim.
  package-nerd-significance:
    - >
      It matters to package nerds because it turns GitHub Actions workflow validation
      into a reusable npm and Homebrew CLI rather than a feature locked inside a single
      editor extension.
  project-history:
    - >
      GitHub created the actions/languageservices repository in January 2023 for
      workflow and expression language services. The language server package exposes
      those services over LSP and can run as the actions-languageserver CLI using stdio.
  related-projects:
    - >
      The README names actions-languageservice, vscode-languageserver-node, the Language
      Server Protocol, and the browser playground as related pieces.
  sources:
    - GitHub repository and releases API for repository and release chronology.
    - Official languageserver README for purpose and usage.
  summary:
    - >
      actions-languageserver is GitHub's standalone Language Server Protocol host for
      the actions-languageservice package, providing editor diagnostics and completions
      for GitHub Actions workflow YAML.
  timeline:
    - '2023: actions/languageservices repository created by GitHub.'
    - '2023: v0.2.0 release published.'
    - '2026: v0.3.58 release published, showing ongoing maintenance.'
  usage:
    - >
      Users install @actions/languageserver, often globally, then run
      actions-languageserver --stdio. Advanced clients may pass initialization options
      including repository context, log level, experimental features, and an optional
      GitHub session token.
related-packages:
  - id: brew:actionlint
    reason: >
      Use the language server for live workflow completion and diagnostics inside an
      editor, then run actionlint as a standalone local or CI check with deeper
      expression, reusable-workflow, script, and security analysis.
    rel: adjacent_workflow
    sources:
      - https://github.com/actions/languageservices/tree/main/languageserver#readme
      - https://github.com/rhysd/actionlint#readme
category: developer-tools
package-manager:
  brew: actions-languageserver
package-manager-url: https://formulae.brew.sh/formula/actions-languageserver
license: MIT
tags:
  - cli
  - developer-tools
  - editor-integration
  - github-actions
  - language-server
  - lsp
  - yaml
description: Language server for GitHub Actions YAML files
executables:
  - actions-languageserver
provenance:
  formula: actions-languageserver
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
