id: brew:garmintools
display-name: garmintools
homepage: https://code.google.com/archive/p/garmintools/
repo: https://code.google.com/archive/p/garmintools/source
docs:
  - https://code.google.com/archive/p/garmintools
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project reflects the mid-2000s Linux hardware-support pattern: vendor devices,
      documented USB protocols, libusb, and command-line tools built by users to recover
      data workflows missing from official desktop software. Later package availability
      in Homebrew, Fedora, and Nix kept the old toolchain installable.
  package-nerd-significance:
    - >
      garmintools is a classic package-manager preservation case: a small C/libusb
      utility for specific physical hardware, born before modern fitness-device sync
      ecosystems, still useful enough to carry in source-based and binary package
      collections.
  project-history:
    - >
      The official source archive says implementation began on 30 December 2006. Dave
      Bailey wrote the software for his Garmin Forerunner 305 after finding that
      gpsbabel did not expose the Forerunner run and lap data workflows he wanted from
      the command line.
    - >
      The 0.10 source archive includes utilities such as garmin_get_info,
      garmin_save_runs, garmin_dump, garmin_gmap, garmin_gchart, and garmin_gpx, plus a
      libusb-based C API in src/garmin.h.
  related-projects:
    - >
      garmintools is related to Garmin Forerunner devices, libusb, the Garmin protocol
      SDK, gpsbabel, and Linux kernel Garmin USB support.
  sources:
    - https://code.google.com/archive/p/garmintools
    - https://code.google.com/archive/p/garmintools/source
    - >
      https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/garmintools/garmintools-0.10.tar.gz
  summary:
    - >
      garmintools is a C utility suite for Linux users communicating with Garmin
      Forerunner GPS devices over USB.
  timeline:
    - '2006: Initial implementation began on 30 December.'
    - '2007: README dated 22 February documented Forerunner 205/305 USB workflows.'
    - '2008: 0.06 added man pages and 0.08 added garmin_gchart and garmin_gpx.'
    - '2009: 0.10 renamed the library to libgarmintools.'
  usage:
    - >
      garmintools can get device information, save Forerunner runs into .gmn files, dump
      .gmn contents, produce Google Maps encoded polyline output, and export GPX data.
      The README warns users that the Linux garmin_gps kernel module conflicts with the
      userspace tool.
related-packages:
  - id: brew:gpsbabel
    reason: >
      Choose GPSBabel for broader, cross-platform conversion and transfer of Garmin
      waypoints, tracks, and routes; garmintools is narrower and preserves
      Forerunner-specific run and lap workflows.
    rel: alternative
    sources:
      - https://www.gpsbabel.org/
      - https://www.gpsbabel.org/htmldoc-development/fmt_garmin.html
      - https://code.google.com/archive/p/garmintools
category: system
