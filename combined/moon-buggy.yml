    - https://packages.fedoraproject.org/pkgs/moon-buggy/moon-buggy/
    - https://www.seehuhn.de/programs/moon-buggy/
  summary:
    - >
      Moon Buggy is a small ASCII terminal game by Jochen Voss. The author's project
      page describes it as a character-graphics game in which the player drives a car
      across the moon's surface and jumps over craters. The same page places it in the
      lineage of the 1982 arcade game Moon Patrol and a 1983 Commodore 64 clone, while
      identifying Voss as the author of the later ASCII version.
  usage:
    - >
      The Unix packaging history is modest but durable: the Ubuntu manpage records
      copyright 2004 and credits Jochen Voss as the implementer, while the project page
      links to Debian packages, Slackware packages, a fan page, and a GNU Brave GNU
      World mention. As a Homebrew package it lives in the same nostalgic terminal-games
      niche as other ncurses or text-mode diversions: easy to build, easy to run over
      SSH or in a minimal terminal, and more culturally interesting than technically
      large.
