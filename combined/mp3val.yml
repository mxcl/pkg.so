config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      Its niche is integrity checking rather than audio decoding. MP3 decoders often
      tolerate stream damage and hide errors from users, so MP3val checks whether a file
      can be split into MPEG frames, reports suspicious conditions, and can rebuild
      files for many fixable problems. The command-line interface supports ordinary
      validation, log output, recursive or wildcard-driven batch work depending on shell
      support, stdin pipe mode for frontends, and a repair flag that creates backup
      files unless told otherwise.
  sources:
    - https://formulae.brew.sh/formula/mp3val
    - https://mp3val.sourceforge.net/
    - https://mp3val.sourceforge.net/docs/manual.html
    - https://sourceforge.net/projects/mp3val/
  summary:
    - >
      MP3val is a free MPEG audio validation and repair program by Alexey Kuznetsov and
      Eugen Tikhonov. The project documentation presents it as a small, high-speed
      checker primarily designed for MPEG-1 Layer III files, with support for other MPEG
      versions and layers plus common metadata blocks such as ID3v1, ID3v2, and APEv2.
  usage:
    - >
      MP3val has survived in package managers because it solves a very specific archival
      problem: finding truncated, incompletely downloaded, or structurally damaged MP3
      files in large music libraries without transcoding them.
