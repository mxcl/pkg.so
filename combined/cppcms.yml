id: brew:cppcms
display-name: CppCMS
homepage: http://cppcms.com/wikipp/en/page/main
repo: https://github.com/artyom-beilis/cppcms
docs:
  - https://cppcms.com/wikipp/en/page/cppcms_1x
  - https://cppcms.com/wikipp/en/page/main
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CppCMS occupies a smaller niche than web frameworks in scripting languages, but it
      has been packaged for source-based and Unix-like package ecosystems where C++
      developers expect native libraries and command-line helper tools.
  package-nerd-significance:
    - >
      For package maintainers, CppCMS is notable as a compiled C++ web framework with
      its own template compiler and runtime utilities, rather than a single library-only
      dependency. Upstream also notes that version 1.2 and later use the MIT license.
  project-history:
    - >
      The project grew around server-side C++ web development, with upstream positioning
      it for rapid web application development, high-load services, and both web sites
      and web services.
  related-projects:
    - >
      Upstream compares CppCMS with frameworks such as Django and Java Servlets to
      explain its different emphasis on high-load C++ services.
  sources:
    - https://github.com/artyom-beilis/cppcms#readme
    - https://cppcms.com/wikipp/en/page/cppcms_1x
    - https://cppcms.com/wikipp/en/page/main
  summary:
    - >
      CppCMS is a free high-performance C++ web development framework, explicitly
      described by its upstream README as a framework rather than a content-management
      system.
  timeline:
    - >
      Version 1.2: Upstream README notes availability under the MIT license starting
      with this version.
    - 'Current documentation: Upstream maintains CppCMS 1.x documentation on cppcms.com.'
  usage:
    - >
      The Homebrew package exposes helper executables such as cppcms_run, cppcms_scale,
      cppcms_tmpl_cc, cppcms_make_key, and cppcms_config_find_param, reflecting its use
      as both a runtime framework and a template/build-time toolchain.
related-packages: []
category: developer-tools
package-manager:
  brew: cppcms
  nix: cppcms
package-manager-url: https://formulae.brew.sh/formula/cppcms
license: MIT
tags:
  - c-plus-plus
  - cli
  - high-performance
  - server-side
  - web-framework
  - web-services
description: Free High Performance Web Development Framework
executables:
  - cppcms_config_find_param
  - cppcms_make_key
  - cppcms_run
  - cppcms_scale
  - cppcms_tmpl_cc
provenance:
  formula: cppcms
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
