id: brew:macosvpn
display-name: macosvpn
homepage: https://github.com/halo/macosvpn
repo: https://github.com/halo/macosvpn
docs:
  - https://github.com/halo/macosvpn#readme
config-file-location:
  macos: /Library/Preferences/SystemConfiguration/preferences.plist
credentials-file-location:
  macos: /Library/Keychains/System.keychain
history:
  adoption-history:
    - >
      macosvpn is distributed through Homebrew according to both the README and the
      batch input, and the README also points users to compiled GitHub release binaries.
      Repository metadata captured during this run showed several hundred GitHub stars
      and dozens of forks, indicating durable adoption among Mac administrators and
      automation users.
  package-nerd-significance:
    - >
      macosvpn is significant because VPN profiles are often part of fleet setup, CI
      test machines, and repeatable laptop provisioning, but macOS historically made
      this hard to automate with plain shell tools. A Homebrew-installable CLI gives
      package nerds a way to put VPN setup next to the rest of a bootstrap script.
  project-history:
    - >
      The official repository was created in July 2014. The README's own history section
      says the implementation began from research into Apple's networking discussions
      and practical examples for manipulating VPN configuration, shared secrets, traffic
      routing, and System Keychain entries.
    - >
      The project packages that undocumented macOS VPN configuration knowledge into a
      CLI with create and delete commands. Its README emphasizes that administrator
      privileges are required because VPN passwords are stored in the System Keychain,
      and it explicitly chooses sudo over a separate HelperTool.
  related-projects:
    - >
      The README mentions Apple's SystemConfiguration preferences, the System Keychain,
      sudo, Xcode builds, and related helper libraries Moderator and PrettyColors.
  sources:
    - https://api.github.com/repos/halo/macosvpn
    - https://api.github.com/repos/halo/macosvpn/releases
    - https://github.com/halo/macosvpn
    - https://github.com/halo/macosvpn#readme
    - source_facts.package-manager
  summary:
    - >
      macosvpn is a Swift command-line tool for creating and deleting macOS VPN network
      services programmatically. The README documents support for L2TP over IPSec and
      Cisco IPSec configurations.
  timeline:
    - '2014: Official GitHub repository created.'
    - '2017: 0.3.x releases covered macOS High Sierra.'
    - '2019: 1.0.0 release published for macOS Catalina.'
    - '2022: 2.0.0 Ventura release published.'
  usage:
    - >
      Typical usage is `sudo macosvpn create --l2tp <name> --endpoint <host> --username
      <user> --password <password> --sharedsecret <secret>` or the Cisco IPSec variant.
      The README also documents flags such as `--force`, `--split`, disconnect behavior
      options, repeated arguments for creating multiple VPNs, and `macosvpn delete` for
      removing one or more services.
related-packages: []
category: networking
package-manager:
  brew: macosvpn
package-manager-url: https://formulae.brew.sh/formula/macosvpn
license: MIT
tags:
  - cli
  - macos
  - networking
  - vpn
description: Create Mac OS VPNs programmatically
executables:
  - macosvpn
provenance:
  formula: macosvpn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
