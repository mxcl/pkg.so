id: cask:alpcanaydin/tusk/tusk
display-name: Tusk
homepage: https://github.com/alpcanaydin/tusk
repo: https://github.com/alpcanaydin/tusk
docs:
  - https://github.com/alpcanaydin/tusk#readme
config-file-location:
  linux:
    - $XDG_DATA_HOME/tusk/
    - ~/.local/share/tusk/
  macos: ~/Library/Application Support/tusk/
  windows: '%APPDATA%\tusk\'
credentials-file-location:
  linux:
    - Linux Secret Service provider, such as GNOME Keyring
    - a compatible KWallet service
  macos: macOS Keychain
  windows: Windows Credential Manager
history:
  adoption-history:
    - >
      Tusk is distributed from its official releases for macOS, Windows, and Linux and
      through a third-party Homebrew tap maintained by its developer. Its import support
      for TablePlus profiles and Docker Compose files lowers the cost of adopting it
      alongside an existing database workflow.
  package-nerd-significance:
    - >
      Tusk belongs to the newer generation of native, open-source database clients that
      avoid Electron. Its Rust and GPUI interface, broad database-driver set,
      operating-system credential stores, bundled SQL language tooling, and restrained
      AI design make it an interesting alternative to established proprietary and
      Java-based database workbenches.
  project-history:
    - >
      Tusk was created as a fast, native, keyboard-driven database client using Rust and
      GPUI, the GPU-accelerated interface framework associated with Zed. The project
      expanded its stated platform scope from macOS to macOS, Windows, and Linux while
      retaining one interface for relational databases, warehouses, key-value stores,
      and document databases.
    - >
      The project added an AI assistant over the Agent Client Protocol and a built-in
      MCP server. The assistant can inspect the active schema and draft or explain SQL,
      but the application deliberately leaves query execution to the user.
  related-projects:
    - >
      Tusk bundles or integrates postgres-language-server and sqls for editor
      diagnostics and completion. Its agent interface can use Claude, Codex, Gemini CLI,
      or another Agent Client Protocol implementation, while the built-in MCP server
      exposes the open database connection to that agent.
  sources:
    - https://github.com/alpcanaydin/tusk#readme
    - https://github.com/alpcanaydin/tusk/tree/main/docs
  summary:
    - >
      Tusk is a free, open-source, cross-platform database client with a native
      GPU-rendered interface, keyboard-oriented workflow, support for numerous SQL and
      non-SQL systems, and a review-before-execution AI assistant.
  timeline:
    - >
      2026: The public project documented macOS, Windows, and Linux distribution
      together with Homebrew installation on macOS.
  usage:
    - >
      Users organize saved connections, connect directly or through SSH and TLS, browse
      and edit data, manage table structure, run SQL with completion and diagnostics,
      inspect query history, and import or export common formats. Connection profiles
      and settings live in the documented Tusk data directory, while passwords and SSH
      passphrases are stored by the operating system's credential service.
related-packages:
  - id: cask:tableplus
    reason: >
      Choose TablePlus for an established proprietary native database client with
      dedicated product documentation; choose Tusk for an open-source Rust client with
      built-in MCP and review-before-run agent assistance, including migration of
      existing TablePlus connections.
    rel: alternative
    sources:
      - https://github.com/alpcanaydin/tusk#readme
      - https://tableplus.com/
      - https://docs.tableplus.com/
category: developer-tools
package-manager:
  brew-cask: alpcanaydin/tusk/tusk
package-manager-url: https://github.com/alpcanaydin/homebrew-tusk/blob/HEAD/Casks/tusk.rb
tags:
  - ai-assistant
  - cross-platform
  - database-administration
  - database-client
  - mcp
  - mongodb
  - mysql
  - native-app
  - postgresql
  - query-editor
  - redis
  - sql
  - sqlite
  - ssh-tunneling
description: Fast, native, keyboard-driven database client
applications:
  - Tusk.app
provenance:
  provider: cask
  source: https://github.com/alpcanaydin/homebrew-tusk/blob/HEAD/Casks/tusk.rb
  tap: alpcanaydin/tusk
