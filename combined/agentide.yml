  - coding-agents
  - developer-workflow
  - git-worktrees
  - ide
  - macos
  - swiftui
description: IDE for agent-based development
applications:
  - AgentIDE.app
provenance:
  cask: agentide
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
