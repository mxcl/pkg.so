id: cask:agentide
display-name: AgentIDE
homepage: https://mikemcquaid.com/agentide/
repo: https://github.com/MikeMcQuaid/AgentIDE
docs:
  - https://github.com/MikeMcQuaid/AgentIDE/tree/main/docs
  - https://github.com/MikeMcQuaid/AgentIDE#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AgentIDE is distributed as a native macOS application and through a Homebrew cask.
      Its scope is deliberately personal and local: one developer, one Mac, with no
      hosted or multi-user service.
  package-nerd-significance:
    - >
      AgentIDE packages an emerging agentic-development workflow into a desktop
      application: isolated users, parallel Git worktrees, persistent sessions,
      pull-request review, and CI monitoring. It is notable for composing command-line
      tools such as Codex or Claude Code, gh, herdr, and sandvault rather than bundling
      its own model service.
  project-history:
    - >
      Mike McQuaid created AgentIDE to consolidate an agent/worktree manager, Git
      interface, editor, and terminal into one native SwiftUI application. The design
      grew from his sandbox-and-worktree approach to safely running coding agents
      unattended.
  related-projects:
    - >
      AgentIDE is built around sandvault for isolation, herdr for persistent agent
      sessions, Git worktrees for task separation, and the GitHub gh CLI for
      pull-request operations. It can run Codex CLI or Claude Code as the coding agent.
  sources:
    - https://github.com/MikeMcQuaid/AgentIDE#readme
    - https://github.com/MikeMcQuaid/AgentIDE/tree/main/docs
  summary:
    - >
      AgentIDE is a native macOS IDE for starting, supervising, reviewing, and shipping
      work performed by sandboxed AI coding agents in parallel Git worktrees.
  timeline:
    - >
      2026: AgentIDE entered Homebrew cask distribution and documented its integrated
      agent-to-pull-request workflow.
  usage:
    - >
      A developer starts work from a prompt, GitHub issue, or pull request; AgentIDE
      creates a branch and worktree, runs the chosen agent in a non-admin sandbox, and
      keeps the conversation available for later resumption. The same application
      supports diff review, selective commits, pushes, pull requests, CI monitoring, and
      merge cleanup.
related-packages:
  - id: brew:sandvault
    reason: >
      SandVault provides the isolated non-administrator macOS user and shared workspace
      in which AgentIDE runs coding agents away from personal files and credentials.
    rel: adjacent_workflow
    sources:
      - https://github.com/MikeMcQuaid/AgentIDE#readme
      - https://github.com/webcoyote/sandvault#readme
  - id: brew:herdr
    reason: >
      Herdr owns AgentIDE's persistent agent terminal sessions, allowing work to
      continue and conversations to remain resumable when the application closes or
      updates.
    rel: adjacent_workflow
    sources:
      - https://github.com/MikeMcQuaid/AgentIDE#readme
      - https://herdr.dev/
      - https://herdr.dev/docs
  - id: brew:gh
    reason: >
      AgentIDE uses GitHub CLI for authenticated pull-request, review, and CI workflows
      while keeping the developer's GitHub credentials outside the agent sandbox.
    rel: adjacent_workflow
    sources:
      - https://github.com/MikeMcQuaid/AgentIDE#readme
      - https://cli.github.com/
      - https://cli.github.com/manual/gh
category: developer-tools
package-manager:
  brew-cask: agentide
package-manager-url: https://formulae.brew.sh/cask/agentide
tags:
  - ai-agents
