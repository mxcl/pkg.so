  apk: newt
  brew: newt
  debian: libnewt-dev
  dnf: newt
  nix: newt
  ubuntu: libnewt-dev
  zypper: libnewt0_52
package-manager-url: https://formulae.brew.sh/formula/newt
license: LGPL-2.0-or-later
tags:
  - cli
  - library
  - terminal-ui
  - text-mode
  - whiptail
  - widgets
description: Library for color text mode, widget based user interfaces
executables:
  - whiptail
provenance:
  formula: newt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
