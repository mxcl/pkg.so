id: brew:aalib
display-name: AA-lib
homepage: https://aa-project.sourceforge.net/aalib/
repo: https://sourceforge.net/p/aa-project/code
docs:
  - https://aa-project.sourceforge.net/aalib
  - https://aa-project.sourceforge.net/aalib/aalib_toc.html
  - https://aa-project.sourceforge.net/tune
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The AA-Project homepage lists software known to support AA output, including
      ttyquake, SDL, GIMP, and XaoS-era projects. Its appeal was not merely rendering
      still images, but making graphical demos, viewers, games, and effects run in text
      environments.
  package-nerd-significance:
    - >
      AA-lib is a classic package-manager curiosity: small, portable, visibly weird, and
      useful as both a library and a demo source. Its bundled commands such as aafire
      and aatest made it memorable on Unix systems because installing it immediately
      produced terminal graphics.
  project-history:
    - >
      The AA-Project documentation says Jan Hubicka started the project after
      experiments with old Hercules monochrome displays and an ASCII rendering approach
      for images and fractals. The manual frames AA-lib as a graphics-library API whose
      main difference is that it renders to ASCII art.
    - >
      The official manual pages were generated from aalib.texinfo in 1997 and 1998,
      placing AA-lib squarely in the late-1990s Unix demo, terminal, and
      low-end-hardware graphics culture.
  related-projects:
    - >
      Related AA-Project software includes BB, Aview, AAvga, AA3D, and XaoS; the
      homepage also lists external software with AA output support.
  sources:
    - https://aa-project.sourceforge.net/
    - https://aa-project.sourceforge.net/aalib/
    - https://aa-project.sourceforge.net/aalib/aalib_9.html
    - https://aa-project.sourceforge.net/aalib/aalib_toc.html
    - https://sourceforge.net/p/aa-project/code/
  summary:
    - >
      AA-lib is a portable ASCII-art graphics library that renders graphics into
      text-mode output instead of relying on a graphical display.
  timeline:
    - '1997: aalib.texinfo-generated documentation appears for the ASCII-art library.'
    - '1998: AA-lib manual pages are regenerated and published on the AA-Project site.'
    - '2000s: AA-Project moves from its original home to SourceForge.'
    - >
      2026: SourceForge still exposes the AA-Project CVS/code area as the project source
      surface.
  usage:
    - >
      Programs link against AA-lib or use its bundled tools to initialize a text-mode
      display, parse AA-specific command-line options, tune rendering parameters, and
      draw images as ASCII. The manual documents the AAOPTS environment variable for
      setting options across AA-lib programs.
related-packages:
  - id: brew:aview
    reason: >
      Aview is an AA-lib-based image browser that turns PNM images and, through its
      asciiview wrapper, other image formats into interactive terminal ASCII art.
    rel: adjacent_workflow
    sources:
      - https://aa-project.sourceforge.net/aview/
      - https://aa-project.sourceforge.net/aalib/
category: media
