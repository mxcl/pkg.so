id: brew:cmake-language-server
display-name: cmake-language-server
homepage: https://github.com/regen100/cmake-language-server
repo: https://github.com/regen100/cmake-language-server
docs:
  - https://github.com/regen100/cmake-language-server#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation with pip and tested Neovim client setups for
      coc.nvim and vim-lsp. The batch input also lists Homebrew, MacPorts, and Nix
      package names, indicating package-manager distribution beyond Python packaging.
  package-nerd-significance:
    - >
      Its significance is mostly practical: it packages CMake editor intelligence as a
      standalone LSP binary that package managers can expose consistently. That matters
      for users wiring Neovim, coc.nvim, vim-lsp, or other LSP clients without vendoring
      editor-specific plugins.
  project-history:
    - >
      The GitHub repository was created in November 2019 and the PyPI metadata points
      back to the same repository. The project has remained small and focused, with
      GitHub releases visible from v0.1.7 in 2023 through v0.1.11 in February 2025.
  related-projects:
    - >
      The project depends conceptually on CMake, the CMake file API, LSP clients, and
      cmake-format. The README specifically names coc.nvim and vim-lsp as tested Neovim
      clients.
  sources:
    - https://github.com/regen100/cmake-language-server#readme
    - https://api.github.com/repos/regen100/cmake-language-server
    - https://api.github.com/repos/regen100/cmake-language-server/releases
    - https://pypi.org/pypi/cmake-language-server/json
  summary:
    - >
      cmake-language-server is a Python language server for CMake files. Its own README
      calls it an alpha-stage CMake LSP implementation with completion, hover
      documentation, and formatting support through cmake-format.
  timeline:
    - '2019: GitHub repository created and first PyPI distribution published.'
    - '2023: v0.1.7 appears in GitHub releases.'
    - '2025: v0.1.11 is published as the latest GitHub release checked.'
  usage:
    - >
      Editors run the cmake-language-server executable as an LSP server for CMake
      filetypes. The README's configuration examples pass a buildDirectory
      initialization option; the server uses CMake's file API under
      <buildDirectory>/.cmake/api after the user has configured a build tree with cmake.
related-packages:
  - id: brew:cmake
    reason: >
      CMake is required to configure the build tree and file-API data that
      cmake-language-server uses for cached variables and project-aware editor results.
    rel: adjacent_workflow
    sources:
      - https://github.com/regen100/cmake-language-server#readme
      - https://cmake.org/cmake/help/latest/manual/cmake-file-api.7.html
  - id: brew:neocmakelsp
    reason: >
      neocmakelsp is an alternative standalone CMake language server; choose it when its
      Rust implementation, dedicated configuration files, or broader documented language
      features better fit the editor setup.
    rel: alternative
    sources:
      - https://github.com/regen100/cmake-language-server#readme
      - https://neocmakelsp.github.io/docs
category: developer-tools
package-manager:
  brew: cmake-language-server
  macports: cmake-language-server
  nix: cmake-language-server
package-manager-url: https://formulae.brew.sh/formula/cmake-language-server
license: MIT
tags:
  - cli
  - cmake
  - editor-tools
  - language-server
  - lsp
  - python
description: Language Server for CMake
executables:
  - cmake-language-server
provenance:
  formula: cmake-language-server
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
