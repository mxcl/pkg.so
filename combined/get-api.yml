id: cask:get-api
display-name: GetAPI
homepage: https://getapi.io/
repo: https://github.com/Get-API-App/Issue-Tracker
docs:
  - https://getapi.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GetAPI is distributed as a native macOS application by TablePlus Inc. Its official
      site emphasizes a focused Mac-native experience rather than a browser-based or
      cross-platform client.
  package-nerd-significance:
    - >
      GetAPI occupies the lightweight end of the graphical API-client ecosystem. For
      package-manager users, it offers a native alternative to larger HTTP-development
      suites while retaining Postman import compatibility.
  project-history:
    - >
      GetAPI was created by TablePlus Inc. as a deliberately simple native HTTP client
      for macOS. The official site provides product downloads, pricing and licensing
      information, while a public GitHub project is used for issue tracking and release
      notes rather than published application source.
  related-projects:
    - GetAPI can import requests from Postman.
    - The application is made by TablePlus Inc., also known for its native database client.
  sources:
    - https://getapi.com/
    - https://github.com/Get-API-App/Issue-Tracker/issues
    - https://github.com/Get-API-App/Issue-Tracker/releases
  summary:
    - >
      GetAPI is a native macOS client for composing HTTP requests and inspecting
      responses. It is positioned as a deliberately simple REST and HTTP development
      tool.
  timeline:
    - >
      2024: The official site identified TablePlus Inc. as GetAPI’s maker and linked its
      public issue tracker and release notes.
  usage:
    - >
      Developers can import from Postman, construct HTTP requests, send them, and
      inspect returned responses in a native Mac interface.
category: developer-tools
package-manager:
  brew-cask: get-api
package-manager-url: https://formulae.brew.sh/cask/get-api
tags:
  - api-testing
