id: brew:kahip
display-name: KaHIP
homepage: https://algo2.iti.kit.edu/documents/kahip/index.html
repo: https://github.com/KaHIP/KaHIP
docs:
  - https://github.com/KaHIP/KaHIP/tree/master/manual
  - https://algo2.iti.kit.edu/documents/kahip/index.html
  - https://github.com/KaHIP/KaHIP#readme
config-file-location:
  unix: ~/.kagent/config.yaml
  windows: '%USERPROFILE%\.kagent\config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as source, command-line tools, libraries, Python
      bindings, and package-manager builds. Its README emphasizes use cases in
      scientific computing and systems work, including mesh partitioning, social and web
      graphs, sparse-matrix ordering, distributed partitioning with ParHIP, and process
      mapping for parallel applications.
  package-nerd-significance:
    - >
      KaHIP is the kind of package that exposes research-grade algorithm engineering as
      installable Unix tooling: many specialized executables, reproducible graph file
      formats, and a long release train turning academic partitioning methods into
      scripts that fit HPC and data-processing pipelines.
  project-history:
    - >
      KaHIP came out of the Karlsruhe graph-partitioning research line associated with
      Peter Sanders and Christian Schulz. The 2013 arXiv user guide describes the
      framework and its interfaces, and the v3.00 line covered multilevel partitioning,
      memetic algorithms, distributed and shared-memory parallel algorithms, node
      separators, node ordering, edge partitioning, and ILP-based improvement.
  related-projects:
    - >
      Related tools and methods include METIS, ParMETIS, Scotch/PT-Scotch, KaFFPa,
      KaFFPaE, KaBaPE, ParHIP, and KaHyPar for hypergraph partitioning.
  sources:
    - https://algo2.iti.kit.edu/documents/kahip/index.html
    - https://api.github.com/repos/KaHIP/KaHIP/releases?per_page=100
    - https://arxiv.org/abs/1311.1714
    - https://github.com/KaHIP
    - https://github.com/KaHIP/KaHIP
  summary:
    - >
      KaHIP, Karlsruhe High Quality Partitioning, is a family of graph-partitioning and
      graph-decomposition programs used for balanced graph cuts, separators, ordering,
      edge partitioning, process mapping, and related algorithm-engineering tasks.
  timeline:
    - '2013-11-07: KaHIP v3.00 user guide first submitted to arXiv.'
    - '2019-03-07: GitHub release v2.10 published.'
    - '2020-08-03: GitHub release v3.00 published.'
    - '2025-11-03: Release v3.21 added pip-oriented KaFFPa use.'
    - '2026-03-13: Release v3.25 published.'
  usage:
    - >
      Users commonly feed KaHIP graphs in METIS-style formats, check them with
      graphchecker, partition with kaffpa or kaffpaE, run distributed partitioning with
      parhip, evaluate cuts, compute node separators, or call the library and Python
      interface from larger workflows.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl to inspect and verify the Kubernetes workloads and resources created
      by kagent, as shown in the official installation procedure.
    rel: adjacent_workflow
