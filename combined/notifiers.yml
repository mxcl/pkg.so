id: brew:notifiers
display-name: notifiers
homepage: https://notifiers.readthedocs.io/
repo: https://github.com/notifiers/notifiers
docs:
  - https://notifiers.readthedocs.io/en/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is primarily Python-library adoption rather than Homebrew adoption. The
      README advertises PyPI, Docker, Read the Docs, and a Pepy downloads badge, while
      Homebrew's formula JSON reported 299 installs over the 365-day window. That
      suggests Homebrew is a convenience install path, not the main distribution
      channel.
  package-nerd-significance:
    - >
      notifiers matters as glue: it trades deep provider-specific features for a stable,
      script-friendly facade over many notification APIs. For package people, it is also
      a reminder that the same project can be packaged as a Python library, a CLI, a
      Docker image, and a Homebrew formula.
  project-history:
    - >
      The PyPI release history starts with 0.1 uploaded on 2017-08-03. Repository tag
      history shows the same early 0.x period, a v1.0.0 tag on 2018-08-07, a 1.2.0 tag
      on 2019-07-25, and later 1.3.x work. PyPI metadata for the checked package showed
      1.3.6 uploaded on 2025-05-17.
    - >
      The project appears in source metadata as liiight/notifiers and in the package
      input as github.com/notifiers/notifiers; the PyPI project URLs point at
      github.com/liiight/notifiers. The Homebrew formula packages the Python
      distribution as a command named notifiers.
  related-projects:
    - >
      requests, jsonschema, click, Python logging, Pushover, Slack, Telegram, Twilio,
      PagerDuty.
  sources:
    - https://formulae.brew.sh/api/formula/notifiers.json
    - https://github.com/liiight/notifiers
    - https://notifiers.readthedocs.io/en/latest/
    - https://pypi.org/project/notifiers/
    - https://pypi.org/pypi/notifiers/json
  summary:
    - >
      notifiers is a Python library and CLI that provides a unified interface for
      sending notifications through many third-party providers. It is aimed at
      developers who want notifications in scripts, applications, or logging without
      writing separate integrations for every provider.
  timeline:
    - '2017-08-03: notifiers 0.1 uploaded to PyPI.'
    - '2018-08-07: repository tag v1.0.0.'
    - '2019-07-25: repository tag 1.2.0.'
    - '2025-05-17: PyPI release 1.3.6, matching the Homebrew stable version checked here.'
  usage:
    - >
      The core Python usage is get_notifier('pushover') or notify('pushover', ...),
      returning a provider-specific NotificationResponse through a common API. The CLI
      exposes provider commands such as notifiers pushover notify, and the logging
      integration lets users attach a NotificationHandler to Python's standard logging
      module so errors can trigger notifications.
    - >
      Supported providers listed by the README include Pushover, SimplePush, Slack,
      Gmail, SMTP email, Telegram, Gitter, Pushbullet, Join, Zulip, Twilio, PagerDuty,
      Mailgun, StatusPage.io, iCloud, VictorOps/Splunk On-Call, and Notify.
category: developer-tools
package-manager:
  brew: notifiers
package-manager-url: https://formulae.brew.sh/formula/notifiers
license: MIT
tags:
  - cli
  - integrations
  - notification-service
  - notifications
  - python
description: Easy way to send notifications
executables:
  - notifiers
provenance:
  formula: notifiers
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
