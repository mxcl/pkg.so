id: brew:behaviortree.cpp
display-name: BehaviorTree.CPP
homepage: https://www.behaviortree.dev/
repo: https://github.com/BehaviorTree/BehaviorTree.CPP
docs:
  - https://www.behaviortree.dev/docs/intro
  - https://behaviortree.github.io/BehaviorTree.CPP
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      BehaviorTree.CPP's adoption is strongly tied to robotics workflows: the README
      names robotics as its main use case, documents ROS 2/colcon support, and points to
      Groot2 for graphical editing. It also documents Conan, CMake, pixi/Conda, and
      vcpkg installation paths.
    - >
      GitHub release history shows a steady line from 2.x releases in 2018 through 3.x,
      the 4.1 release preparing for Groot2 in 2023, and 4.9.0 in 2026. The repository
      metadata showed more than 4,000 stars and 800 forks when checked during
      enrichment, indicating broad use beyond a niche single-project dependency.
  package-nerd-significance:
    - >
      BehaviorTree.CPP matters to package nerds because it packages robotics
      behavior-tree infrastructure as ordinary C++ tooling across Homebrew, vcpkg,
      Conan, ROS 2 builds, and source builds. That makes a research-and-robotics pattern
      consumable through mainstream developer dependency managers.
    - >
      It is also a good example of a C++ library where the command-line package is
      useful mostly as build and metadata tooling around a larger embedded runtime.
  project-history:
    - >
      The official repository was created on GitHub in October 2018, while the
      repository license credits earlier behavior-tree work from 2014-2018 before the
      current Davide Faconti-led project period. Public GitHub releases begin with a 2.0
      beta in October 2018.
    - >
      The README describes the library as flexible, easy to use, reactive, and fast,
      with XML-defined trees loaded at runtime, asynchronous actions as first-class
      citizens, plugins, dataflow between nodes, and logging/profiling infrastructure.
  related-projects:
    - Groot2 is the related graphical editor documented by the project.
    - btcpp_sample is the official sample repository referenced for application use.
    - ROS 2, vcpkg, Conan, and CMake are documented integration and packaging paths.
  sources:
    - https://behaviortree.github.io/BehaviorTree.CPP/
    - https://github.com/BehaviorTree/BehaviorTree.CPP
    - https://github.com/BehaviorTree/BehaviorTree.CPP/releases
    - https://www.behaviortree.dev/
    - source_facts.repo
  summary:
    - >
      BehaviorTree.CPP is a C++17 behavior-tree framework used mainly in robotics, but
      also suitable for game AI and finite-state-machine replacement. The Homebrew
      package exposes its command-line utilities for node models and plugin manifests.
  timeline:
    - '2014-2018: Earlier behavior-tree code lineage credited in the repository license.'
    - '2018: GitHub repository created and 2.0 beta released.'
    - '2020: 3.3.0 release published.'
    - '2022: 3.7.0 release published.'
    - '2023: 4.1.0 release prepared the project for Groot2.'
    - '2026: 4.9.0 release published.'
  usage:
    - >
      Developers embed the C++ library into applications that need reactive task
      execution. Behavior trees are commonly defined in XML, with custom tree nodes
      linked statically or loaded as plugins at runtime.
    - >
      The packaged command-line tools support ecosystem workflows such as generating
      node model information and plugin manifests rather than serving as a standalone
      end-user application.
related-packages: []
category: developer-tools
