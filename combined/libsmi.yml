id: brew:libsmi
display-name: libsmi
homepage: https://www.ibr.cs.tu-bs.de/projects/libsmi/
repo: https://gitlab.ibr.cs.tu-bs.de/nm/libsmi
docs:
  - https://www.ibr.cs.tu-bs.de/projects/libsmi
  - https://www.ibr.cs.tu-bs.de/projects/libsmi/library.html
  - https://www.ibr.cs.tu-bs.de/projects/libsmi/tools.html
config-file-location:
  unix:
    - ${prefix}/etc/smi.conf
    - ~/.smirc
credentials-file-location: null
history:
  adoption-history:
    - >
      libsmi was adopted by network-management and packet-analysis tools that needed a
      parser and model for MIB data rather than hand-written text parsing. The official
      tools page names GxSNMP, tcpdump, and a DMH Software MIB compiler as examples of
      projects that used libsmi.
    - >
      The download page says libsmi had packages for Debian, RedHat, Mandrake, and SuSE,
      and the Homebrew input records broader packaging across Alpine, Debian, Fedora,
      MacPorts, Nix, Ubuntu, and zypper ecosystems.
  package-nerd-significance:
    - >
      libsmi is beloved by the sort of package nerd who debugs SNMP by reading MIBs: it
      turns standards-track network-management text into parseable structures and small
      Unix tools. It also packages a snapshot-style archive of IETF and IANA modules,
      making it part parser and part standards museum.
    - >
      Its aging release cadence and 2021 move from Subversion-era source management to a
      public GitLab repository make it a good example of mature infrastructure software
      whose value persists long after the original research push.
  project-history:
    - >
      The libsmi README says the project began in 1999 as part of Frank Strauss's
      master's thesis at the Technical University of Braunschweig, supervised and
      initiated by Juergen Schoenwaelder. The package grew into a library, tools, test
      patterns, documentation, and bundled IETF and IANA MIB and PIB module collections.
    - >
      The official project page describes a two-layer architecture: upper layers expose
      an API and common internal data structures to applications, while lower drivers
      access persistent MIB and PIB repositories. It supports SMIv1/v2 MIB module files,
      SPPI PIB module files, and an early SMIng driver.
  related-projects:
    - >
      Related standards and tools include SNMP, SMIv1/v2, SPPI, IETF and IANA MIB/PIB
      modules, tcpdump, GxSNMP, Net-SNMP-adjacent workflows, and RFC authoring or review
      pipelines that need MIB extraction and validation.
  sources:
    - https://gitlab.ibr.cs.tu-bs.de/nm/libsmi
    - https://www.ibr.cs.tu-bs.de/projects/libsmi/
    - https://www.ibr.cs.tu-bs.de/projects/libsmi/ANNOUNCE.html?lang=de
    - https://www.ibr.cs.tu-bs.de/projects/libsmi/ChangeLog.html?lang=de
    - https://www.ibr.cs.tu-bs.de/projects/libsmi/README.html?lang=de
    - https://www.ibr.cs.tu-bs.de/projects/libsmi/download.html
    - https://www.ibr.cs.tu-bs.de/projects/libsmi/library.html
    - https://www.ibr.cs.tu-bs.de/projects/libsmi/tools.html
  summary:
    - >
      libsmi is a C library and tool suite for reading, validating, converting,
      comparing, and querying SMI MIB and SPPI PIB modules used in SNMP and
      network-management tooling.
  timeline:
    - >
      1999: The libsmi README says the project began as Frank Strauss's master's thesis
      at TU Braunschweig.
    - >
      2002-06-21: The libsmi 0.4 announcement described the library, tools, SPPI parser
      additions, and bundled standard MIB modules.
    - '2008-04-18: The ChangeLog records the libsmi 0.4.8 release.'
    - >
      2021-01: The download page says the code was moved from Subversion to a public
      GitLab repository without updates.
    - '2021-01-15: The public GitLab project page records the repository creation date.'
  usage:
    - >
      The library gives applications a programmer-friendly API for MIB and PIB module
      information. The bundled commands cover common maintainer workflows: `smilint`
      checks modules, `smidump` converts and dumps formats, `smidiff` compares
      revisions, `smiquery` asks for individual objects, `smixlate` translates
      identifiers, and `smistrip` extracts modules from RFCs and drafts.
    - >
      Users can configure behavior with global and user-level configuration files and
      with the SMIPATH environment variable for module search paths.
related-packages:
  - id: brew:tcpdump
    reason: >
      tcpdump can use libsmi to resolve SNMP object identifiers and named values while
      inspecting packets, pairing packet capture with readable MIB-aware output.
    rel: adjacent_workflow
    sources:
      - https://www.ibr.cs.tu-bs.de/projects/libsmi/tools.html
      - https://www.tcpdump.org/manpages/tcpdump.1.html
category: networking
