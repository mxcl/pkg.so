id: brew:mycli
display-name: mycli
homepage: https://www.mycli.net/
repo: https://github.com/dbcli/mycli
docs:
  - https://www.mycli.net/docs
config-file-location:
  unix:
    - ~/.myclirc
    - ~/.config/mycli/myclirc
credentials-file-location:
  unix:
    - ~/.myclirc
    - ~/.config/mycli/myclirc
history:
  project-history:
    - >
      The project README defines mycli as a MySQL command-line client with
      auto-completion and syntax highlighting, compatible with MySQL, MariaDB, Percona,
      TiDB, and Apache Doris. Its practical appeal is in interactive database work:
      context-sensitive completion for SQL keywords and schema objects, Pygments-based
      highlighting, multiline queries, favorite queries, query timing, formatted table
      output, SSL support, keyring-backed password storage, and a ~/.myclirc
      configuration file.
  sources:
    - https://amjith.com/blog/kickstarter-mysql-cli/
    - https://github.com/dbcli/mycli
    - https://raw.githubusercontent.com/dbcli/mycli/main/README.md
    - https://www.dbcli.com/about/
    - https://www.kickstarter.com/projects/1839007321/mysql-cli
    - https://www.mycli.net/
  summary:
    - >
      mycli is a modern terminal client for MySQL-family databases created in the dbcli
      ecosystem. Amjith Ramanujam introduced the project in 2015 as mysql-cli, a MySQL
      counterpart to pgcli, and funded the initial work through a Kickstarter campaign.
      The DBCLI project later grouped mycli with related command-line database clients
      such as pgcli and mssql-cli.
  usage:
    - >
      mycli's adoption is visible both in its GitHub footprint and its packaging spread:
      it is installable through pip, Homebrew, Debian/Ubuntu, Fedora, and other
      distribution channels. Its package-manager niche is the friendlier drop-in
      terminal client for developers and DBAs who still want a shell workflow but prefer
      completion and display ergonomics closer to newer REPLs.
related-packages:
  - id: brew:mysql-client
    reason: >
      Choose the official MySQL client when you need Oracle's standard mysql shell and
      its accompanying administrative, dump, import, and binary-log utilities; choose
      mycli for a richer interactive REPL.
    rel: alternative
    sources:
      - https://www.mycli.net/
      - https://dev.mysql.com/doc/refman/en/programs-client.html
      - https://dev.mysql.com/doc/refman/en/mysql.html
  - id: brew:pgcli
    reason: >
      Choose pgcli when the target database is PostgreSQL; it is mycli's DBCLI sibling
      and provides the same broad emphasis on completion, highlighting, and a pleasant
      terminal REPL for PostgreSQL workflows.
    rel: alternative
    sources:
      - https://www.dbcli.com/about/
      - https://www.mycli.net/
      - https://www.pgcli.com/
category: data
package-manager:
  apk: mycli
  brew: mycli
  debian: mycli
  dnf: mycli
  macports: mycli
  nix: mycli
  ubuntu: mycli
package-manager-url: https://formulae.brew.sh/formula/mycli
license: BSD-3-Clause
tags:
  - autocomplete
  - cli
  - database-client
  - mariadb
  - mysql
  - percona
  - syntax-highlighting
description: CLI for MySQL with auto-completion and syntax highlighting
executables:
  - mycli
provenance:
  formula: mycli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
