id: brew:gowall
display-name: Gowall
homepage: https://achno.github.io/gowall-docs/
repo: https://github.com/Achno/gowall
docs:
  - https://achno.github.io/gowall-docs
config-file-location:
  unix: ~/.config/gowall/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Its package-manager footprint is mostly desktop and theming oriented: the README
      documents Homebrew, Arch AUR, Fedora COPR, NixOS, and Void Linux installation
      paths, and the Homebrew formula packages the CLI as `gowall`.
  package-nerd-significance:
    - >
      Gowall is notable as a small example of the modern desktop-theming package
      ecosystem: a Go CLI, hosted on GitHub, packaged quickly across Homebrew and Linux
      community channels, and connected to projects such as tinted-theming for
      Base16/Base24 palette workflows.
  project-history:
    - >
      The public repository history begins in July 2024. The README describes the
      original focus as converting an image, especially a wallpaper, to a selected color
      scheme or palette, and then broadening into a general image-processing command
      line tool.
  related-projects:
    - tinted-gowall connects Gowall to the tinted-theming Base16/Base24 ecosystem.
    - >
      pywal is a related wallpaper-color extraction tool referenced by Gowall's
      palette-extraction feature.
  sources:
    - https://achno.github.io/gowall-docs
    - https://github.com/Achno/gowall
    - https://github.com/Achno/gowall/releases
    - https://raw.githubusercontent.com/Achno/gowall/main/README.md
  summary:
    - >
      Gowall is a Go-based image and wallpaper processing CLI centered on converting
      wallpaper palettes into named color schemes, with later features extending into
      compression, OCR, upscaling, format conversion, effects, and terminal image
      preview.
  timeline:
    - '2024: Public repository history begins with the initial commit.'
    - '2024: v0.1.0 tag appears shortly after early wallpaper and theme work.'
    - '2025: v0.2.0 tag appears in the repository history.'
    - '2026: v0.2.4 tag appears in the repository history.'
  usage:
    - >
      Users run `gowall` to recolor wallpapers or icons for theme families such as
      Catppuccin, Dracula, Gruvbox, Nord, Solarized, and Tokyo Night, and can list
      built-in plus user-created themes from `~/.config/gowall/config.yml`.
related-packages: []
category: media
package-manager:
  brew: gowall
  nix: gowall
package-manager-url: https://formulae.brew.sh/formula/gowall
license: MIT
tags:
  - cli
  - color-palette
  - image-processing
  - themes
  - wallpapers
description: Tool to convert a Wallpaper's color scheme / palette
executables:
  - gowall
provenance:
  formula: gowall
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
