id: brew:ggshield
display-name: ggshield
homepage: https://www.gitguardian.com
repo: https://github.com/GitGuardian/ggshield
docs:
  - https://docs.gitguardian.com/ggshield-docs/getting-started
  - https://docs.gitguardian.com/ggshield-docs/home
  - https://docs.gitguardian.com/ggshield-docs/reference/overview
config-file-location:
  unix:
    - ~/.gitguardian.yaml
    - ./.gitguardian.yaml
  windows:
    - '%USERPROFILE%\.gitguardian.yaml'
    - .\.gitguardian.yaml
credentials-file-location:
  unix: ~/.gitguardian.yaml
  windows: '%USERPROFILE%\.gitguardian.yaml'
history:
  adoption-history:
    - >
      The tool gained adoption through several security workflows rather than one single
      editor or platform: local scans, pre-commit and pre-push hooks, CI/CD jobs, GitHub
      Actions, GitLab, Jenkins, Docker-image scans, package scans, and packaged
      distribution through PyPI, Homebrew, Chocolatey, Cloudsmith packages, and
      standalone installers.
  package-nerd-significance:
    - >
      For package ecosystems, ggshield is notable because it packages a SaaS-backed
      security control as a normal developer CLI: it can be installed by a package
      manager, run in a hook, and produce exit codes that fit standard CI pipelines.
  project-history:
    - >
      GitGuardian opened the ggshield repository in April 2020 and published the early
      1.0.x release line soon afterward. The project is built as the local and CI-facing
      companion to GitGuardian's secret-detection service, using the GitGuardian public
      API through the py-gitguardian client.
  related-projects:
    - >
      ggshield is closely tied to GitGuardian's public API and py-gitguardian client,
      and it overlaps operationally with pre-commit, CI/CD systems, and
      repository-hosting security workflows.
  sources:
    - https://api.github.com/repos/GitGuardian/ggshield
    - https://api.github.com/repos/GitGuardian/ggshield/releases
    - https://docs.gitguardian.com/ggshield-docs/getting-started
    - https://docs.gitguardian.com/ggshield-docs/integrations/overview
    - https://formulae.brew.sh/formula/ggshield
    - https://github.com/GitGuardian/ggshield
    - https://pypi.org/project/ggshield/
    - https://raw.githubusercontent.com/GitGuardian/ggshield/main/README.md
  summary:
    - >
      ggshield is GitGuardian's open-source command-line scanner for detecting hardcoded
      secrets and sensitive data before they reach source-control history or CI
      artifacts.
  timeline:
    - '2020: The GitGuardian ggshield repository was created.'
    - '2020: The 1.0.x release line appeared in the GitHub release feed.'
    - '2026: The release feed showed the 1.52 series.'
  usage:
    - >
      Practitioners authenticate with `ggshield auth login` or an API key, then scan
      paths, repositories, staged changes, Docker images, package artifacts, or CI
      workspaces. Teams commonly install it as a pre-commit, pre-push, or pre-receive
      hook so leaked credentials are blocked before they enter shared repositories.
related-packages:
  - id: brew:gitleaks
    reason: >
      Choose Gitleaks for its standalone SAST workflow, TOML rule model, and official
      GitHub Action; choose ggshield for GitGuardian API-backed detection and
      platform-aligned policy.
    rel: alternative
    sources:
      - https://github.com/GitGuardian/ggshield
      - https://github.com/gitleaks/gitleaks
      - https://docs.gitguardian.com/ggshield-docs/configuration
  - id: brew:trufflehog
    reason: >
      Choose TruffleHog when verified-secret detection across Git and other
      infrastructure sources is central; choose ggshield for GitGuardian-integrated
      developer and CI guardrails.
    rel: alternative
    sources:
      - https://github.com/GitGuardian/ggshield
      - https://github.com/trufflesecurity/trufflehog
  - id: brew:detect-secrets
    reason: >
      Choose detect-secrets when an auditable repository baseline is needed to accept
      existing findings while blocking new ones; choose ggshield for API-backed scanning
      and GitGuardian policy integration.
    rel: alternative
    sources:
      - https://github.com/GitGuardian/ggshield
      - https://github.com/Yelp/detect-secrets
  - id: brew:pre-commit
    reason: >
      Use pre-commit to install and orchestrate ggshield as a repository-defined hook
      alongside other checks; GitGuardian officially documents this integration.
    rel: adjacent_workflow
    sources:
      - https://docs.gitguardian.com/ggshield-docs/integrations/overview
      - https://pre-commit.com/
category: security
package-manager:
  brew: ggshield
  nix: ggshield
package-manager-url: https://formulae.brew.sh/formula/ggshield
license: MIT
tags:
  - cli
  - devsecops
  - git-hooks
  - secrets-scanning
  - security
description: Scanner for secrets and sensitive data in code
executables:
  - ggshield
provenance:
  formula: ggshield
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
