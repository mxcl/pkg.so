id: brew:mosml
display-name: Moscow ML
homepage: https://mosml.org/
repo: https://github.com/kfl/mosml
docs:
  - https://mosml.org/
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The Moscow ML manual describes version 2.10 as implementing SML as revised in the
      1997 Definition, including the SML Modules language, some extensions, much of the
      SML Basis Library, separate compilation, and generation of standalone executables.
      The manual also highlights the Moscow ML Modules language, with features such as
      higher-order functors and other extensions while preserving compatibility goals
      for SML programs.
  sources:
    - https://formulae.brew.sh/formula/mosml
    - https://github.com/kfl/mosml
    - https://mosml.org/
    - https://mosml.org/manual.pdf
  summary:
    - >
      Moscow ML is a lightweight implementation of Standard ML. Its project history
      credits Sergei Romanenko at the Keldysh Institute of Applied Mathematics, Claudio
      Russo, Niels Kokholm, Ken Friis Larsen, and Peter Sestoft, and notes that it uses
      the runtime system and many ideas from Xavier Leroy and Damien Doligez's Caml
      Light implementation.
  usage:
    - >
      Its adoption niche is language education, research, and maintenance of older SML
      code that benefits from a small interactive system and bytecode compiler. In
      Homebrew and other package managers, mosml provides the classic Moscow ML
      toolchain rather than a general-purpose modern ML ecosystem.
related-packages:
  - id: brew:smlnj
    reason: >
      SML/NJ is an alternative Standard ML environment with an optimizing compiler and
      extensive interactive tooling; Moscow ML is attractive when a smaller
      Caml-Light-derived runtime and quick startup are preferred.
    rel: alternative
    sources:
      - https://www.smlnj.org/
      - https://mosml.org/
  - id: brew:mlton
    reason: >
      MLton is an alternative whole-program optimizing Standard ML compiler aimed at
      performant standalone executables, whereas Moscow ML emphasizes lightweight
      interactive and bytecode-based use.
    rel: alternative
    sources:
      - http://mlton.org/
      - https://mosml.org/
category: language-runtime
package-manager:
  brew: mosml
  macports: mosml
  nix: mosml
package-manager-url: https://formulae.brew.sh/formula/mosml
license: GPL-2.0-or-later
