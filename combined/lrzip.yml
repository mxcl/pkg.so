id: brew:lrzip
display-name: lrzip
homepage: https://github.com/ckolivas/lrzip
repo: https://github.com/ckolivas/lrzip
docs:
  - https://github.com/ckolivas/lrzip#readme
config-file-location:
  unix:
    - ./lrzip.conf
    - ~/.lrzip/lrzip.conf
    - /etc/lrzip/lrzip.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager facts show wide packaging across Homebrew, Debian,
      Ubuntu, MacPorts, Nix, Arch, Alpine, and openSUSE. That breadth reflects its role
      as a specialist compressor: not the default archive format for every user, but
      common enough to be kept available in Unix package collections.
    - >
      GitHub metadata reports hundreds of stars and dozens of forks, and the README
      points users to official GitHub releases for stable packaged tarballs.
  package-nerd-significance:
    - >
      lrzip is a package-manager favorite for compression enthusiasts because it exposes
      a very different tradeoff curve from gzip, xz, or zstd: it spends memory and CPU
      to find long-range redundancy in large inputs. That makes it useful in archival
      experiments, benchmark discussions, and old-school Unix compression collections.
  project-history:
    - >
      The official README says lrzip excels on large files, usually above 10-50 MB, and
      uses an extended rzip-style long-distance redundancy reduction pass before
      applying back-end compressors such as LZMA, LZO, bzip2, gzip, LZ4, or ZPAQ.
    - >
      Con Kolivas' repository was created on GitHub in March 2010. The README authorship
      notes also record earlier documentation by Peter Hyman in January 2009, a GitHub
      Markdown rewrite by Haneef Mubarak in September 2013, and a README update by Con
      Kolivas in February 2021.
    - >
      The project is a continuation of the rzip idea for systems with more memory and
      larger files. Its README emphasizes that lrzip tries to use available RAM
      aggressively to gain compression benefit, which is both its distinctive feature
      and the reason it is most useful on large modern machines.
  related-projects:
    - >
      lrzip is directly related to rzip, and its README names LZO, LZMA, gzip, bzip2,
      LZ4, ZPAQ, and tar-wrapper workflows as part of its compression ecosystem.
  sources:
    - https://api.github.com/repos/ckolivas/lrzip
    - https://github.com/ckolivas/lrzip
    - https://raw.githubusercontent.com/ckolivas/lrzip/master/README.md
    - source_facts.package-manager
  summary:
    - >
      lrzip, short for Long Range ZIP or LZMA RZIP, is a compression utility aimed at
      high compression ratios on large files.
  timeline:
    - '2009: Official README notes documentation by Peter Hyman.'
    - '2010: GitHub repository created for ckolivas/lrzip.'
    - '2013: README mostly rewritten and converted to GitHub Markdown.'
    - '2021: README updated by Con Kolivas.'
    - '2022: GitHub releases list version 0.651.'
    - >
      2026: Supplied package-manager facts list packaging across major Unix-like
      distributions.
  usage:
    - >
      lrzip compresses a single file to `.lrz`; directory workflows typically go through
      `tar` or the included `lrztar` and `lrzuntar` wrappers. The README documents modes
      for LZMA, ZPAQ, LZO, and gzip-like semantics via the `lrz` wrapper.
    - >
      The tool has no documented persistent config or credentials. Tuning is by CLI
      options such as compression backend, level, thread count, and memory/window
      behavior.
related-packages:
  - id: brew:rzip
    reason: >
      Choose rzip for the simpler original long-range compressor with a fixed bzip2
      second stage; lrzip extends that design with scalable memory handling, multiple
      back ends, streaming, and wrapper commands.
    rel: alternative
    sources:
      - https://rzip.samba.org/
      - https://github.com/ckolivas/lrzip#readme
  - id: brew:xz
    reason: >
      Choose XZ Utils when standardized .xz interoperability, liblzma embedding, and
      gzip-like Unix tooling matter more than lrzip's specialized long-distance
      redundancy pass.
    rel: alternative
    sources:
      - https://tukaani.org/xz/
      - https://github.com/ckolivas/lrzip#readme
  - id: brew:zstd
    reason: >
      Choose Zstandard when high throughput and fast decompression are the main
      priorities; choose lrzip when large inputs contain distant repetition and maximum
      ratio can justify greater memory and CPU use.
    rel: alternative
    sources:
      - https://github.com/facebook/zstd#readme
      - https://github.com/ckolivas/lrzip#readme
category: system
package-manager:
  apk: lrzip
  brew: lrzip
  debian: lrzip
  macports: lrzip
  nix: lrzip
  pacman: lrzip
  ubuntu: lrzip
  zypper: lrzip
package-manager-url: https://formulae.brew.sh/formula/lrzip
license: GPL-2.0-or-later
tags:
  - archiving
  - cli
  - compression
  - large-files
description: Compression program with a very high compression ratio
executables:
  - lrunzip
  - lrzcat
  - lrzip
  - lrztar
  - lrzuntar
provenance:
  formula: lrzip
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
