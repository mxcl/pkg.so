id: brew:codequery
display-name: CodeQuery
homepage: https://ruben2020.github.io/codequery/
repo: https://github.com/ruben2020/codequery
docs:
  - https://github.com/ruben2020/codequery#readme
  - https://ruben2020.github.io/codequery
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CodeQuery spread through classic package-manager channels rather than a SaaS
      ecosystem: the README documents Debian and Ubuntu installation through apt, macOS
      installation through Homebrew, and Windows binaries through SourceForge.
  package-nerd-significance:
    - >
      CodeQuery matters to package nerds as a packaged survivor of the
      pre-language-server source-navigation era. It connects long-lived Unix indexing
      tools, SQLite, GUI browsing, and distro packaging in a way that makes large legacy
      codebases searchable without adopting a full IDE.
  project-history:
    - >
      The GitHub repository dates to 2013 and the README presents CodeQuery as a
      cross-platform GUI plus command-line database tooling. It was built around
      existing source-navigation traditions: cscope, Exuberant ctags, Universal Ctags,
      pycscope, and starscope.
  related-projects:
    - >
      Related projects include cscope, Exuberant ctags, Universal Ctags, pycscope,
      starscope, vim-codequery, codequery4vscode, GNU cflow, CodeViz, and tags2uml.
  sources:
    - https://github.com/ruben2020/codequery
    - https://ruben2020.github.io/codequery
    - https://formulae.brew.sh/api/formula/codequery.json
  summary:
    - >
      CodeQuery is a source-code indexing, browsing, and search tool that combines
      cscope-style call information with ctags-style symbol information and stores the
      result in a SQLite-backed database.
  timeline:
    - '2013: GitHub repository created.'
    - '2010s: README documents Debian, Ubuntu, Homebrew, and SourceForge distribution paths.'
    - '2025: Repository remains active according to GitHub metadata gathered during research.'
    - '2026: Homebrew formula distributes CodeQuery 1.0.1.'
  usage:
    - >
      A typical workflow uses cscope and ctags data, processes it with cqmakedb into a
      CodeQuery database, then browses or queries it with the codequery GUI or searches
      with cqsearch. The tool supports symbols, call relationships, inheritance
      relationships, file lookup, grep-style search, and graph exports.
related-packages:
  - id: brew:cscope
    reason: >
      cscope generates call and cross-reference data that CodeQuery's cqmakedb consumes
      when building its searchable database.
    rel: adjacent_workflow
    sources:
      - https://github.com/ruben2020/codequery
      - https://cscope.sourceforge.net/
  - id: brew:universal-ctags
    reason: >
      Universal Ctags generates symbol data for CodeQuery and is documented by CodeQuery
      as a drop-in replacement for Exuberant Ctags.
    rel: adjacent_workflow
    sources:
      - https://github.com/ruben2020/codequery
      - https://ctags.io/
category: developer-tools
package-manager:
  brew: codequery
  debian: codequery
  ubuntu: codequery
package-manager-url: https://formulae.brew.sh/formula/codequery
license: MPL-2.0
tags:
  - cli
  - code-search
  - cscope
  - ctags
  - gui
  - source-code-indexing
description: Code-understanding, code-browsing or code-search tool
executables:
  - codequery
  - cqmakedb
  - cqsearch
provenance:
  formula: codequery
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
