id: brew:kubectl-klock
display-name: kubectl-klock
homepage: https://github.com/applejag/kubectl-klock
repo: https://github.com/applejag/kubectl-klock
docs:
  - https://github.com/applejag/kubectl-klock#readme
config-file-location:
  unix:
    - ~/.kube/config
    - ~/.kube/color.yaml
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      Upstream documents installation through Krew, Snap, Scoop, Nix, pre-built GitHub
      releases, and `go install`, which places it in the normal package-manager and
      kubectl-plugin distribution path rather than only as a one-off binary.
  package-nerd-significance:
    - >
      kubectl-klock is interesting to package maintainers because it is a small kubectl
      plugin distributed through several ecosystems at once: Krew for Kubernetes users,
      Go module installation for developers, and general-purpose package managers for
      shell users.
  project-history:
    - >
      The official GitHub repository was created in 2022 and its README carries 2023
      project copyright notices. The project is maintained as a kubectl plugin with
      Cobra-based CLI plumbing and Kubernetes client-go dependencies.
  related-projects:
    - >
      Related projects include kubectl, Krew, kubecolor, and kubectx, all referenced
      directly or indirectly by the upstream README.
  sources:
    - https://api.github.com/repos/applejag/kubectl-klock
    - https://api.github.com/repos/applejag/kubectl-klock/releases
    - https://github.com/applejag/kubectl-klock
    - https://github.com/applejag/kubectl-klock#readme
  summary:
    - >
      kubectl-klock is a Go-based kubectl plugin that presents Kubernetes watch output
      in a more readable, continuously updated terminal view. Its upstream README
      describes it as similar in spirit to running `watch kubectl get pods`, but using
      Kubernetes watch streaming instead of polling.
  timeline:
    - '2022-09-01: Official GitHub repository was created.'
    - '2023: README copyright notices identify Kalle Fagerberg and project documentation.'
    - '2025-07-21: GitHub releases list v0.8.2.'
    - '2026-05-28: GitHub releases list v0.9.1.'
  usage:
    - >
      Users run `kubectl klock <resource> [name(s)] [flags]` to watch pods, deployments,
      statefulsets, nodes, and other Kubernetes resources. The README documents filters,
      label selectors, all-namespace mode, hotkeys, environment-variable-backed flags,
      and an option to restart the watch when kubeconfig changes.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl's native `get --watch` for an unembellished stream; kubectl-klock
      provides a continuously redrawn table, filtering, hotkeys, and other readability
      features.
    rel: alternative
    sources:
      - https://github.com/applejag/kubectl-klock#readme
      - https://kubernetes.io/docs/reference/kubectl/kubectl/
  - id: brew:kubecolor
    reason: >
      kubectl-klock uses kubecolor's coloring logic, environment variables, presets, and
      `~/.kube/color.yaml`, so kubecolor documentation is the companion workflow for
      customizing its display.
    rel: adjacent_workflow
    sources:
      - https://github.com/applejag/kubectl-klock#readme
      - https://kubecolor.github.io/customizing/themes/
  - id: brew:kubectx
    reason: >
      kubectx switches kubectl contexts, and klock's documented `--watch-kubeconfig`
      mode restarts its watch when tools such as kubectx modify kubeconfig.
    rel: adjacent_workflow
    sources:
      - https://github.com/applejag/kubectl-klock#readme
      - https://github.com/ahmetb/kubectx
category: cloud-infrastructure
package-manager:
  brew: kubectl-klock
  nix: kubectl-klock
  zypper: kubectl-klock
package-manager-url: https://formulae.brew.sh/formula/kubectl-klock
license: GPL-3.0-or-later AND CC0-1.0
tags:
  - cli
  - go
  - kubectl-plugin
  - kubernetes
  - terminal
  - watch
description: Kubectl plugin to render watch output in a more readable fashion
executables:
  - kubectl-klock
  - kubectl_complete-klock
provenance:
  formula: kubectl-klock
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
