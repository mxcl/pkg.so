id: brew:cdrdao
display-name: Cdrdao
homepage: https://cdrdao.sourceforge.net/
repo: https://github.com/cdrdao/cdrdao
docs:
  - https://cdrdao.sourceforge.net/
  - https://github.com/cdrdao/cdrdao#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Cdrdao became a standard Unix optical-media utility because DAO solved problems
      track-at-once recording could not, especially live audio discs, custom pregaps,
      CD-TEXT, and exact copying. The supplied package-manager metadata lists it in
      Alpine, Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      Cdrdao matters to package maintainers because it is one of the old optical-disc
      tools where hardware interfaces, kernel permissions, CD standards, and distro
      patches all meet. Its 2023 removal of the old bundled scsilib snapshot in favor of
      native interfaces is exactly the kind of maintenance detail distro people watch.
  project-history:
    - >
      The cdrdao.lsm file records version 1.0 entering distribution on 1998-08-03,
      authored and maintained by Andreas Mueller, for Linux CD recording in disc-at-once
      mode. The official homepage later presented cdrdao as a SourceForge-hosted project
      for audio and data CD-R/CD-RW recording.
    - >
      The modern GitHub README keeps the same core model but documents newer native
      device interfaces, CD-TEXT behavior, simulation mode, and bug reporting through
      GitHub. The ChangeLog shows releases continuing through 1.2.6 in 2025.
  related-projects:
    - gcdmaster is the graphical companion included in the cdrdao tree.
    - >
      cdrtools/scsilib is historically related through older SCSI-interface code noted
      in cdrdao release notes.
  sources:
    - https://api.github.com/repos/cdrdao/cdrdao
    - https://github.com/cdrdao/cdrdao
    - https://cdrdao.sourceforge.net/
    - https://github.com/cdrdao/cdrdao#readme
    - https://formulae.brew.sh/api/formula/cdrdao.json
    - https://raw.githubusercontent.com/cdrdao/cdrdao/master/ChangeLog
    - https://raw.githubusercontent.com/cdrdao/cdrdao/master/cdrdao.lsm
  summary:
    - >
      Cdrdao is a command-line CD recording tool focused on Disk-At-Once writing, where
      a whole disc layout is described by a textual TOC file and written with precise
      control over pregaps, subchannel data, CD-TEXT, and copying.
  timeline:
    - '1998: cdrdao 1.0 entered distribution, according to cdrdao.lsm.'
    - '2001: Official homepage revision metadata shows the SourceForge-era project page active.'
    - >
      2009: cdrdao 1.2.3 added native interfaces for IRIX, Mac OS X, and NetBSD and
      reworked Linux SG support.
    - >
      2023: cdrdao 1.2.5 removed the old bundled scsilib snapshot and included macOS
      fixes upstreamed from Homebrew.
    - >
      2025: cdrdao 1.2.6 release notes list CD-TEXT, Windows native interface, crash,
      and BSD fixes.
  usage:
    - >
      Typical usage centers on commands such as cdrdao write, simulate, copy, read-toc,
      and show-toc. Users describe the disc in a TOC file, run simulation when testing a
      writer, and use helper tools such as cue2toc, toc2cue, toc2cddb, and toc2mp3.
related-packages:
  - id: brew:cdrtools
    reason: >
      Choose cdrtools for a broader suite that creates ISO filesystems and records CD,
      DVD, and Blu-ray media; choose Cdrdao when precise TOC-driven disc-at-once CD
      layouts are the central requirement.
    rel: alternative
    sources:
      - https://github.com/cdrdao/cdrdao#readme
      - https://cdrtools.sourceforge.net/private/cdrecord.html
      - https://cdrtools.sourceforge.net/private/man
