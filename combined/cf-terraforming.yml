id: brew:cf-terraforming
display-name: cf-terraforming
homepage: https://github.com/cloudflare/cf-terraforming
repo: https://github.com/cloudflare/cf-terraforming
docs:
  - https://developers.cloudflare.com/terraform/advanced-topics/import-cloudflare-resources
  - https://github.com/cloudflare/cf-terraforming#readme
config-file-location:
  unix: ~/.cf-terraforming.yaml
credentials-file-location:
  unix: ~/.cf-terraforming.yaml
history:
  adoption-history:
    - >
      The official Cloudflare docs tell macOS users to install it through the
      cloudflare/cloudflare Homebrew tap and other users to download a GitHub release.
      The supplied package facts also list Homebrew and Nix packaging.
  package-nerd-significance:
    - >
      The package is significant because it bridges click-managed SaaS infrastructure
      and declarative IaC. For packagers, it is a vendor-owned Go CLI with real
      operational demand: it helps users migrate state into Terraform instead of
      manually writing large Cloudflare configurations.
  project-history:
    - >
      Cloudflare's public repository was created in 2018. The README links Cloudflare's
      announcement of its HashiCorp partnership and cf-terraforming bootstrap workflow,
      and the 2026 Homebrew formula packages v0.27.0.
  related-projects:
    - >
      The README and Cloudflare docs tie cf-terraforming to the Terraform Cloudflare
      provider, the Cloudflare API, terraform-exec, Terraform state import, and CDKTF
      conversion workflows.
  sources:
    - https://api.github.com/repos/cloudflare/cf-terraforming
    - https://github.com/cloudflare/cf-terraforming
    - https://developers.cloudflare.com/terraform/advanced-topics/import-cloudflare-resources
    - https://github.com/cloudflare/cf-terraforming#readme
    - https://formulae.brew.sh/api/formula/cf-terraforming.json
  summary:
    - >
      cf-terraforming is Cloudflare's CLI for turning existing Cloudflare resources into
      Terraform configuration and import commands. The README explains that it uses
      Cloudflare account credentials to retrieve configuration through the Cloudflare
      API and convert it for the Terraform Cloudflare provider.
  timeline:
    - '2018: Public GitHub repository created.'
    - '2025: v0.23.x and v0.24.0 releases published.'
    - '2026: v0.25.0, v0.26.0, and v0.27.0 releases published.'
  usage:
    - >
      cf-terraforming is aimed at existing Cloudflare customers who want to start
      managing already-created resources with Terraform. It can generate HCL for
      supported Cloudflare resource types and emit Terraform import commands or
      Terraform 1.5+ import blocks, using account or zone identifiers and API token or
      API key authentication.
related-packages:
  - id: brew:opentofu
    reason: >
      Use OpenTofu when you want an open-source Terraform-compatible executable for the
      generated configuration; cf-terraforming officially supports selecting a
      compatible binary with `--terraform-binary-path`.
    rel: adjacent_workflow
    sources:
      - https://github.com/cloudflare/cf-terraforming
      - https://opentofu.org/docs/
category: cloud-infrastructure
package-manager:
  brew: cf-terraforming
  nix: cf-terraforming
package-manager-url: https://formulae.brew.sh/formula/cf-terraforming
license: MPL-2.0
tags:
  - cli
  - cloudflare
  - import
  - infrastructure-as-code
  - migration
  - terraform
description: CLI to facilitate terraforming your existing Cloudflare resources
executables:
  - cf-terraforming
provenance:
  formula: cf-terraforming
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
