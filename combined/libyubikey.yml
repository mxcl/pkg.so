id: brew:libyubikey
display-name: libyubikey
homepage: https://yubico.github.io/yubico-c/
repo: https://github.com/Yubico/yubico-c
docs:
  - https://yubico.github.io/yubico-c
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libyubikey belongs to the pre-FIDO YubiKey software stack, when OTP validation and
      provisioning were central to deploying hardware authentication. As Yubico and
      Google moved U2F into the FIDO Alliance in 2013 and browsers and services adopted
      FIDO U2F from 2014 onward, libyubikey remained relevant for legacy OTP
      integrations and tooling rather than newer WebAuthn flows.
    - >
      Yubico announced end-of-life for yubico-c on February 19, 2025, with end-of-life
      scheduled for February 19, 2026. That makes the package historically important as
      part of the original YubiKey OTP era, even where newer Yubico libraries cover PIV,
      FIDO, OATH, or platform-specific use cases.
  package-nerd-significance:
    - >
      For package nerds, libyubikey is a tiny security package with a lot of context
      packed into it: custom alphabets, AES-backed OTP fields, hardware-token history,
      man pages, Autotools, and a clear line from early two-factor authentication to
      later FIDO/WebAuthn ecosystems.
  project-history:
    - >
      Yubico was founded in Stockholm in 2007 and launched YubiKey 1.0 in 2008 as a
      driverless one-touch OTP authenticator that identifies as a keyboard. yubico-c
      followed as the low-level C software development kit for the YubiKey
      authentication device.
    - >
      The yubico-c repository describes the command-line tools that expose the library
      concepts: modhex converts between modhex, hex, and binary forms; ykparse decrypts
      and parses one OTP with the corresponding AES key; ykgenerate constructs and
      encrypts one OTP from key and internal token data.
  related-projects:
    - >
      yubico-c is the upstream source package for libyubikey. Related Yubico projects
      include higher-level YubiKey management and protocol libraries, while U2F, FIDO2,
      and WebAuthn represent the standards track that superseded many OTP-first
      deployments.
  sources:
    - https://developers.yubico.com/yubico-c/
    - https://github.com/Yubico/yubico-c
    - https://www.yubico.com/why-yubico/yubico-innovation-history/
  summary:
    - >
      libyubikey is the C library inside Yubico yubico-c for low-level YubiKey
      one-time-password work: modhex conversion, OTP parsing, and OTP generation around
      the original Yubico authentication model.
  timeline:
    - '2007: Yubico was founded in Stockholm and developed a YubiKey 1.0 prototype.'
    - '2008: YubiKey 1.0 was launched.'
    - '2010: Yubico added OATH one-time-password support to the YubiKey product line.'
    - '2013: Yubico and Google contributed U2F technical specifications to the FIDO Alliance.'
    - '2025-02-19: Yubico announced end-of-life for yubico-c.'
    - '2026-02-19: Yubico scheduled yubico-c to reach end-of-life.'
  usage:
    - >
      Packagers expose libyubikey as a small C library plus tools for modhex and YubiKey
      OTP token work. It is most useful for test vectors, provisioning scripts,
      compatibility tooling, and software that needs to parse or generate Yubico OTP
      values without pulling in higher-level device-management stacks.
related-packages:
  - id: brew:ykpers
    reason: >
      Use YubiKey Personalization to program and inspect legacy OTP slots on physical
      YubiKeys, then use libyubikey for the corresponding low-level modhex and OTP data
      handling.
    rel: adjacent_workflow
    sources:
      - https://developers.yubico.com/yubico-c/
      - https://developers.yubico.com/yubikey-personalization/
  - id: brew:ykman
    reason: >
      Choose YubiKey Manager for current device administration across OTP, FIDO, PIV,
      OATH, and OpenPGP; libyubikey remains the narrower library for legacy Yubico OTP
      encoding and parsing.
    rel: alternative
    sources:
      - https://developers.yubico.com/yubico-c/
      - https://developers.yubico.com/yubikey-manager/
      - https://developers.yubico.com/yubikey-manager/Config_Reference.html
  - id: brew:libfido2
    reason: >
      Choose libfido2 when implementing modern FIDO U2F or FIDO2 authentication over USB
      or NFC instead of the legacy Yubico OTP workflow handled by libyubikey.
    rel: alternative
    sources:
      - https://developers.yubico.com/yubico-c/
      - https://developers.yubico.com/libfido2/
category: security
