id: brew:fastnetmon
display-name: FastNetMon
homepage: https://github.com/pavel-odintsov/fastnetmon/
repo: https://github.com/pavel-odintsov/fastnetmon
docs:
  - https://fastnetmon.com/docs
  - https://github.com/pavel-odintsov/fastnetmon#readme
config-file-location:
  unix: /etc/fastnetmon.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      FastNetMon is aimed at network operators, hosting providers, and other teams that
      need fast traffic anomaly detection close to routers or mirrors. Its official
      support surfaces include a mailing list, Slack, IRC, Telegram, and Discord, which
      is a strong signal of an operator community around the tool.
    - >
      The README points to Linux installation instructions, macOS installation through
      Homebrew, and a FreeBSD port, while its Repology badge tracks distribution
      packaging. The Community Edition release stream continued through the 1.2.x
      series, including 1.2.8 in 2024 and 1.2.9 in 2026.
  package-nerd-significance:
    - >
      FastNetMon is interesting to package maintainers because it is a real network
      daemon with a CLI client surface, fast-path packet capture integrations,
      BGP/router integrations, telemetry options, and a long-lived open/commercial
      split. Packaging it is less about installing one binary and more about preserving
      operational defaults.
  project-history:
    - >
      The public FastNetMon repository dates to 2013 and the official documentation site
      has carried Community Edition documentation since 2016. The README now presents
      the open Community Edition alongside FastNetMon Advanced, a commercial edition
      from FastNetMon LTD.
    - >
      Technically, the project grew around packet and flow ingestion rather than
      web-service monitoring: the README lists NetFlow v5/v9, IPFIX, sFlow v5, PCAP,
      AF_PACKET, AF_XDP, Netmap, and older PF_RING support. That breadth explains why
      the package has daemon, client, API-client, capture-backend, and
      router-integration concerns.
  related-projects:
    - >
      FastNetMon commonly integrates with ExaBGP or GoBGP for BGP announcements and with
      systems such as Prometheus, Kafka, ClickHouse, InfluxDB, Graphite, Redis,
      MongoDB-compatible stores, and router vendors documented by the project.
  sources:
    - https://github.com/pavel-odintsov/fastnetmon
    - https://github.com/pavel-odintsov/fastnetmon#readme
    - https://fastnetmon.com/docs
    - https://raw.githubusercontent.com/pavel-odintsov/fastnetmon/master/src/fastnetmon.conf
    - https://api.github.com/repos/pavel-odintsov/fastnetmon/releases
  summary:
    - >
      FastNetMon is a high-performance DDoS detection sensor for networks that ingest
      NetFlow, IPFIX, sFlow, AF_PACKET/SPAN, and other capture sources. It detects hosts
      with abnormal traffic volumes and can notify operators, run scripts, or trigger
      BGP-based mitigation.
  timeline:
    - '2013: The public GitHub repository is created.'
    - '2016: The official Community Edition documentation page is published.'
    - '2022: FastNetMon Community 1.2.2 is released.'
    - '2024: FastNetMon Community 1.2.8 is released.'
    - '2026: FastNetMon Community 1.2.9 is released.'
  usage:
    - >
      FastNetMon is configured as a sensor for local networks and thresholds. It watches
      packets, bytes, or flows per second, compares them with configured limits, and
      then executes configured actions such as notifications, callback scripts, ExaBGP
      or GoBGP announcements, and metric export.
    - >
      The default Unix-style configuration path is /etc/fastnetmon.conf, with related
      network-list paths such as /etc/networks_list and /etc/networks_whitelist shown in
      the distributed sample configuration. It has no documented user credential file
      for the package itself.
related-packages:
  - id: brew:wireshark
    reason: >
      Use Wireshark to inspect and filter the pcap attack captures that FastNetMon can
      collect for detailed post-detection traffic analysis.
    rel: adjacent_workflow
    sources:
      - >
        https://fastnetmon.com/wp-content/uploads/2023/07/fastnetmon_community_book_20_jul_2023.pdf
      - https://www.wireshark.org/docs/wsug_html_chunked/
  - id: brew:tcpdump
    reason: >
      Use tcpdump for terminal-based reading, filtering, and summarizing of FastNetMon's
      pcap attack captures on servers where a graphical analyzer is impractical.
    rel: adjacent_workflow
    sources:
      - >
        https://fastnetmon.com/wp-content/uploads/2023/07/fastnetmon_community_book_20_jul_2023.pdf
      - https://www.tcpdump.org/manpages/tcpdump.1.html
category: networking
package-manager:
  brew: fastnetmon
  debian: fastnetmon
  dnf: fastnetmon
  ubuntu: fastnetmon
package-manager-url: https://formulae.brew.sh/formula/fastnetmon
license: GPL-2.0-only
tags:
  - cli
  - ddos
  - ipfix
  - netflow
  - network-monitoring
  - sflow
description: DDoS detection tool with sFlow, Netflow, IPFIX and port mirror support
executables:
  - fastnetmon
  - fastnetmon_api_client
  - fastnetmon_client
provenance:
  formula: fastnetmon
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
