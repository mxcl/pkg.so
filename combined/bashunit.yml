id: brew:bashunit
display-name: bashunit
homepage: https://bashunit.typeddevs.com
repo: https://github.com/TypedDevs/bashunit
docs:
  - https://bashunit.com/
  - https://bashunit.com/configuration
config-file-location:
  unix:
    - ./.env
    - ./.bashunitrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as a project-local installer from bashunit.com, an npm
      package, a Homebrew formula, and package-manager entries in MacPorts and Nix
      according to the supplied package facts. The docs site metadata identifies the
      current public site as bashunit.com and lists v0.40.0 on 2026-06-16.
    - >
      bashunit's adoption story is tied to shell-heavy repositories wanting tests
      without moving logic into another language. The README explicitly frames it as a
      fast, simple way to test Bash scripts and includes a one-file quickstart.
  package-nerd-significance:
    - >
      bashunit matters to package nerds because it is part of the small ecosystem that
      tests shell as shell. It keeps the runtime requirement low, uses Bash 3.0+ for
      broad compatibility, and packages itself for project-local use, npm, Homebrew,
      MacPorts, and Nix.
    - >
      Its changelog is also an example of a modern CLI project optimizing for CI
      ergonomics: pinned GitHub Actions, checksum verification, inline annotations,
      coverage formats, and failure output tuned for automated logs.
  project-history:
    - >
      The project began publicly with version 0.1.0 on 2023-09-04, according to its
      official CHANGELOG. It developed rapidly through 2023 and 2024, adding
      documentation, examples, new assertions, configuration, snapshots, data providers,
      output formats, and CI-oriented reporting.
    - >
      By late 2025 and 2026, bashunit had expanded beyond basic assertions into
      coverage, profiling, watch mode, parallel execution improvements, TAP/JUnit/GitHub
      Actions reporting, checksum-verified installer behavior, and an official composite
      GitHub Action.
  related-projects:
    - >
      The project includes its own installer, npm distribution, docs site, and official
      GitHub Action. It is adjacent to other shell test runners, but the official
      sources emphasize bashunit's own Bash 3.0+ compatibility and CI/reporting
      features.
  sources:
    - https://bashunit.com/
    - https://github.com/TypedDevs/bashunit/blob/main/CHANGELOG.md
    - https://github.com/TypedDevs/bashunit/blob/main/README.md
    - source_facts.package-manager
  summary:
    - >
      bashunit is a modern Bash testing framework by TypedDevs. Its README describes it
      as a lightweight, fast framework for Bash 3.0+ with assertions, spies, mocks, data
      providers, snapshots, and other developer-experience features.
  timeline:
    - '2023-09-04: Version 0.1.0 appears in the official CHANGELOG.'
    - '2023-10-15: Version 0.9.0 adds early blog/docs-era features.'
    - '2024-07-14: Version 0.14.0 continues the pre-1.0 feature cadence.'
    - '2025-12-19: Version 0.31.0 adds code coverage tracking.'
    - >
      2026-02-15: Version 0.33.0 lowers the minimum Bash version to 3.0 and improves
      parallel execution.
    - '2026-06-07: Version 0.38.0 adds the official `TypedDevs/bashunit` GitHub Action.'
    - '2026-06-16: Version 0.40.0 adds per-test timeouts and moves URLs to bashunit.com.'
  usage:
    - >
      The README quickstart installs the runner into a project with `curl -s
      https://bashunit.com/install.sh | bash`, writes test functions in shell files
      under `tests/`, and runs them with `./lib/bashunit tests/`.
    - >
      The official docs describe configuration through `.env` and, since 0.37.0,
      `.bashunitrc`. Recent releases add workflow-friendly features such as JUnit, TAP,
      GitHub Actions annotations, coverage reports, test timeouts, and a composite
      GitHub Action.
related-packages:
  - id: brew:bats-core
    reason: >
      Choose bats-core when you prefer the established TAP-compliant Bats syntax and its
      community-maintained ecosystem for testing Bash programs.
    rel: alternative
    sources:
      - https://github.com/TypedDevs/bashunit
      - https://github.com/bats-core/bats-core
      - https://bats-core.readthedocs.io/en/stable/
  - id: brew:shellspec
    reason: >
      Choose ShellSpec when BDD-style specifications and testing across Bash, dash, ksh,
      zsh, and other POSIX shells matter more than bashunit's Bash-focused API.
    rel: alternative
    sources:
      - https://github.com/TypedDevs/bashunit
      - https://shellspec.info/
      - https://github.com/shellspec/shellspec
category: developer-tools
package-manager:
  brew: bashunit
  macports: bashunit
  nix: bashunit
package-manager-url: https://formulae.brew.sh/formula/bashunit
license: MIT
tags:
  - bash
  - cli
  - testing
  - unit-testing
description: Simple testing library for bash scripts
executables:
  - bashunit
provenance:
  formula: bashunit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
