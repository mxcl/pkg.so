id: brew:wasm-tools
display-name: wasm-tools
homepage: https://github.com/bytecodealliance/wasm-tools
repo: https://github.com/bytecodealliance/wasm-tools
docs:
  - https://github.com/bytecodealliance/wasm-tools#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      wasm-tools grew in importance as WebAssembly moved beyond single core modules. The
      official component-model documentation describes components as an architecture for
      interoperable WebAssembly libraries, applications, and environments, and
      wasm-tools now includes component-focused commands for extracting WIT, embedding
      component type metadata, creating components, unbundling components, and
      converting WIT between text, JSON, and binary encodings.
    - >
      The package is heavily used as infrastructure rather than as an end-user
      application. Its subcommands map to the daily chores of Wasm toolchain work:
      validate a module, round-trip text and binary formats, strip or inspect sections,
      demangle symbols, generate test cases, shrink reducer inputs, or examine component
      interfaces.
  package-nerd-significance:
    - >
      wasm-tools is the package-manager-friendly face of a large slice of the Rust
      WebAssembly infrastructure stack. Installing one binary gives maintainers access
      to tools that otherwise live as separate crates or test utilities, making it the
      Wasm equivalent of a Swiss-army debug and transform tool for modules and
      components.
  project-history:
    - >
      The public repository was created on May 19, 2020, after the Bytecode Alliance had
      formed around WebAssembly and WASI tooling. It gathered a family of Rust crates
      and CLI subcommands for operations that package authors, runtime developers, and
      standards implementers repeatedly need when inspecting or transforming Wasm
      artifacts.
    - >
      The README describes the CLI as useful for debugging WebAssembly modules and
      components, with subcommands that also correspond to programmatic Rust crates such
      as `wasmparser`, `wat`, `wast`, `wasmprinter`, `wasm-smith`, `wasm-mutate`,
      `wasm-shrink`, `wit-component`, and `wasm-metadata`.
  related-projects:
    - >
      Related projects include Wasmtime, wasm-component-ld, wit-bindgen,
      cargo-component, the WebAssembly Component Model, and lower-level crates such as
      wasmparser, wat, wast, wasmprinter, wasm-smith, wasm-mutate, wasm-shrink, and
      wit-component.
  sources:
    - https://api.github.com/repos/bytecodealliance/wasm-tools
    - https://bytecodealliance.org/projects
    - https://component-model.bytecodealliance.org/
    - https://docs.rs/wasm-tools/latest/wasm_tools/
    - https://github.com/bytecodealliance/wasm-tools
  summary:
    - >
      wasm-tools is the Bytecode Alliance's Rust-based command-line toolbox and library
      collection for low-level manipulation of WebAssembly modules and components. It
      bundles validators, parsers, printers, metadata tools, fuzzing and mutation tools,
      debugging helpers, and component-model subcommands behind one `wasm-tools` binary.
  timeline:
    - '2020-05-19: Public GitHub repository created.'
    - >
      2020s: Tool grows into a multi-crate CLI covering validation, parsing, printing,
      fuzzing, mutation, shrinking, metadata, and component-model tasks.
    - '2026-06-12: GitHub releases show v1.252.0 as the latest release at research time.'
  usage:
    - >
      Typical command-line usage is pipeline-friendly. The README shows examples such as
      parsing WAT to Wasm, printing Wasm back to text, validating modules, demangling
      and stripping custom sections, and using `wasm-tools component wit` or `wasm-tools
      component new` for component-model workflows.
    - >
      The CLI conventions matter for package users: subcommands read from stdin when no
      file is given, write to stdout unless `--output` is supplied, can emit text format
      with `--wat` where applicable, and share standard help, verbosity, and color
      behavior. That makes it useful in scripts, CI, fuzzing harnesses, and reproducible
      packaging pipelines.
category: developer-tools
package-manager:
  apk: wasm-tools
  brew: wasm-tools
  macports: wasm-tools
  nix: wasm-tools
  pacman: wasm-tools
package-manager-url: https://formulae.brew.sh/formula/wasm-tools
license: (Apache-2.0 WITH LLVM-exception) OR Apache-2.0 OR MIT
tags:
  - bytecode-alliance
  - cli
  - rust
  - toolchain
  - webassembly
description: Low level tooling for WebAssembly in Rust
executables:
  - wasm-tools
provenance:
  formula: wasm-tools
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
