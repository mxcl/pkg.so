config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Deark's homepage publishes source downloads and Windows binaries, while the
      repository and package-manager metadata make it available to Unix-like users
      through package systems such as Homebrew, MacPorts, and Nix. Its adoption is less
      about a network effect and more about being a compact specialist tool for
      file-format archaeology.
  package-nerd-significance:
    - >
      Deark is the sort of utility package that earns its keep when a user finds a
      strange old asset in a source tree, disk image, or archive. Its value is breadth,
      conservative dependencies, and a preservation-minded approach to formats that are
      too obscure for everyday desktop apps.
  project-history:
    - >
      Jason Summers' README credits Deark as written by Jason Summers over 2014-2026,
      and the GitHub repository metadata records public creation in April 2014. The
      project's own technical notes explain that it grew from many one-off file-format
      decoders into one place for rescuing data from under-served formats and preserving
      knowledge about file structures.
  related-projects:
    - >
      Deark overlaps with format-specific extractors, archive tools, image converters,
      and digital-preservation utilities. The related deark-extras repository contains
      ancillary files for Deark development.
  sources:
    - https://entropymine.com/deark
    - https://github.com/jsummers/deark/blob/master/readme.md
    - https://github.com/jsummers/deark/blob/master/technical.md
    - https://api.github.com/repos/jsummers/deark
  summary:
    - >
      Deark is a portable C command-line utility for decoding, converting, inspecting,
      and extracting data from older or uncommon file formats. It is especially visible
      in package collections because it covers a large spread of legacy graphics,
      archive, font, executable, metadata, and document formats without trying to become
      a general archive manager.
  timeline:
    - '2014: GitHub repository created for Deark.'
    - >
      2016: README copyright line begins the current Deark copyright span and notes
      later MIT-style licensing from the 1.4.x series.
    - '2026: 1.7.3 listed on the official homepage as the current download.'
  usage:
    - >
      Typical use is to point `deark` at a file and let it autodetect a module, or
      select a module explicitly when the format is ambiguous. The README recommends ZIP
      output for archive-like formats so member filenames and paths can be retained, and
      the technical documentation emphasizes the `-d` inspection mode for learning about
      file contents and metadata.
related-packages:
  - id: brew:unar
    reason: >
      Choose unar when the task is conventional multi-format archive extraction; choose
      Deark when you also need legacy-format decoding, conversion, or forensic-style
      metadata inspection.
    rel: alternative
    sources:
      - https://entropymine.com/deark/
      - https://theunarchiver.com/command-line
category: media
