id: brew:cutadapt
display-name: Cutadapt
homepage: https://cutadapt.readthedocs.io
repo: https://github.com/marcelm/cutadapt
docs:
  - https://cutadapt.readthedocs.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Cutadapt became part of the standard sequencing-preprocessing toolbox because it
      solves a common, format-heavy cleanup problem with a scriptable CLI. The official
      README links to PyPI, source code, documentation, and a Galaxy platform wrapper,
      and its badges point to Python packaging and Bioconda distribution.
  package-nerd-significance:
    - >
      Cutadapt is package-manager significant because it bridges Python packaging,
      bioinformatics channels, and Unix CLI workflows. It is both a Python package and a
      command-line executable, with stable documentation, a citation, and a long
      changelog that makes downstream packaging and reproducibility work tractable.
  project-history:
    - >
      The project documentation says Cutadapt development began at TU Dortmund
      University in Prof. Sven Rahmann's group and is now developed within NBIS, the
      National Bioinformatics Infrastructure Sweden. The documentation copyright begins
      in 2010, and the changelog records early public releases starting with v0.1 in
      September 2010.
  related-projects:
    - >
      The official README links Cutadapt to PyPI, Bioconda packaging, Galaxy's tools-iuc
      wrapper, and its Read the Docs documentation.
  sources:
    - https://cutadapt.readthedocs.io/
    - https://cutadapt.readthedocs.io/en/stable/changes.html
    - https://raw.githubusercontent.com/marcelm/cutadapt/main/README.rst
    - https://api.github.com/repos/marcelm/cutadapt
  summary:
    - >
      Cutadapt is a bioinformatics command-line tool for finding and removing adapter
      sequences, primers, poly-A tails, and other unwanted sequence from high-throughput
      sequencing reads. Its documentation presents trimming as a routine cleanup step
      for small-RNA, amplicon, and other sequencing workflows.
  timeline:
    - '2010: v0.1 appears in the official changelog.'
    - '2011: v1.0 released, according to the changelog.'
    - '2012: Public GitHub repository created.'
    - '2019: v2.0 released with documented backward-incompatible changes.'
    - >
      2024: v5.0 released with demultiplexing behavior changes and performance-related
      defaults.
    - '2025: v5.2 documented in the stable changelog.'
  usage:
    - >
      The tool is normally used in pipelines before alignment or downstream analysis:
      users provide FASTQ/FASTA reads and adapter or primer patterns, then ask Cutadapt
      to trim, filter, modify, demultiplex, and report results. Its changelog shows
      long-running attention to paired-end reads, JSON reports, demultiplexing,
      compression speed, Python version support, and reproducible output.
related-packages:
  - id: brew:fastp
    reason: >
      Choose fastp for an all-in-one short-read workflow that combines automatic adapter
      trimming with quality filtering and HTML/JSON QC reports; choose Cutadapt for its
      flexible error-tolerant adapter and primer matching model.
    rel: alternative
    sources:
      - https://cutadapt.readthedocs.io/en/stable/guide.html
      - https://github.com/OpenGene/fastp
category: science
