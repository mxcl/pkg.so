id: brew:sqlx-cli
display-name: sqlx-cli
homepage: https://github.com/transact-rs/sqlx
repo: https://github.com/transact-rs/sqlx
docs:
  - https://github.com/transact-rs/sqlx#readme
  - https://github.com/transact-rs/sqlx/tree/main/sqlx-cli#readme
config-file-location:
  unix: .env
  windows: .env
credentials-file-location:
  unix: .env
history:
  adoption-history:
    - >
      The supplied package-manager facts show sqlx-cli distributed as sqlx-cli or
      cargo-sqlx through Homebrew, Alpine, Nix, and Arch. That packaging matters because
      Rust users often need the executable in CI images and developer shells even when
      the application itself depends on SQLx as a library.
  package-nerd-significance:
    - >
      Package nerds care about sqlx-cli because it bridges Rust's compile-time SQL
      checking with ordinary package-manager workflows. It is a CLI that must stay
      version-compatible with a Rust library, database drivers, TLS choices, and CI
      environments.
  project-history:
    - >
      The SQLx repository's official README describes SQLx as an async, pure-Rust SQL
      crate with optional compile-time checked queries and support for PostgreSQL,
      MySQL, MariaDB, and SQLite. The sqlx-cli README describes the CLI as SQLx's
      associated command-line utility for managing databases, migrations, and offline
      mode for query macros.
    - >
      Official repository metadata places the SQLx project in public GitHub development
      from late 2019. The CLI became important because SQLx's compile-time query
      checking creates a developer workflow need: capture query metadata with cargo sqlx
      prepare so projects can build without a live development database.
  related-projects:
    - >
      sqlx-cli is tightly coupled to SQLx query macros, Rust's cargo workflow, and
      database backends including PostgreSQL, MySQL/MariaDB, and SQLite.
  sources:
    - https://docs.rs/crate/sqlx-cli/latest
    - https://github.com/launchbadge/sqlx/issues/170
    - https://github.com/transact-rs/sqlx
    - https://github.com/transact-rs/sqlx/tree/main/sqlx-cli#readme
    - source_facts.package-manager
  summary:
    - >
      sqlx-cli is the command-line companion to SQLx, the Rust SQL toolkit, used for
      database management, migrations, and offline query metadata generation.
  timeline:
    - '2019: Official repository metadata reports SQLx public repository creation.'
    - >
      2020: Public issue history shows early CLI design work around cargo-sqlx and
      migration commands.
    - >
      2021: The sqlx-cli README documents reversible migrations using timestamped
      up/down SQL files.
    - >
      2023: Changelog notes offline query metadata moving toward one file per query
      invocation.
    - >
      2026: Latest crate/docs metadata continues to describe sqlx-cli as SQLx's
      command-line utility.
  usage:
    - >
      The official sqlx-cli README documents cargo install options by database backend
      and TLS stack, DATABASE_URL via command-line option, environment, or .env file,
      database create/drop commands, migration creation and execution, reversible
      migrations, cargo sqlx prepare, the .sqlx metadata directory, and prepare --check
      for CI.
category: developer-tools
package-manager:
  apk: cargo-sqlx
  brew: sqlx-cli
  nix: sqlx-cli
  pacman: sqlx-cli
package-manager-url: https://formulae.brew.sh/formula/sqlx-cli
license: Apache-2.0 OR MIT
tags:
  - cli
  - database
  - mysql
  - postgresql
  - rust
  - sql
  - sqlite
description: Command-line utility for SQLx, the Rust SQL toolkit
executables:
  - cargo-sqlx
  - sqlx
provenance:
  formula: sqlx-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
