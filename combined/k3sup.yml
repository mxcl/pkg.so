id: brew:k3sup
display-name: k3sup
homepage: https://k3sup.dev
repo: https://github.com/alexellis/k3sup
docs:
  - https://github.com/alexellis/k3sup#readme
  - https://k3sup.dev
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      k3sup became popular in homelab, edge, Raspberry Pi, and small-cloud Kubernetes
      examples because it matched k3s's promise: make a usable cluster with ordinary
      Linux hosts and SSH access.
    - >
      The creator's tutorials and community posts helped make k3sup part of the k3s
      tooling vocabulary even though it remains an independent project rather than a k3s
      subcommand.
  package-nerd-significance:
    - >
      k3sup is the kind of tiny infrastructure binary package managers are good at
      distributing: no service, no local state database, just a CLI that turns a fiddly
      bootstrap procedure into a repeatable command.
  project-history:
    - >
      k3sup appeared in August 2019 during the early wave of enthusiasm around Rancher's
      k3s. The initial release established a small Go binary that could install k3s over
      SSH and return kubectl access without requiring users to memorize the full server,
      token, and kubeconfig dance.
    - >
      Early releases quickly added cluster-joining support, Windows binaries, version
      pinning, and ergonomics for multi-node k3s clusters. The project kept the
      deliberately small surface: install a server, join agents, fetch kubeconfig, and
      smooth out the SSH workflow.
  related-projects:
    - >
      k3sup is built around k3s and SSH. It overlaps conceptually with k0sctl, kubeadm
      automation scripts, and other small cluster-bootstrap CLIs.
  sources:
    - https://blog.alexellis.io/create-a-3-node-k3s-cluster-with-k3sup-digitalocean/
    - https://github.com/alexellis/k3sup
    - https://github.com/alexellis/k3sup/releases/tag/0.1.0
    - https://github.com/alexellis/k3sup/releases/tag/0.2.0
    - https://github.com/alexellis/k3sup/releases/tag/0.3.0
    - https://k3sup.dev
  summary:
    - >
      k3sup is Alex Ellis's lightweight SSH-based installer for getting from a machine
      or VM to a usable k3s kubeconfig quickly.
  timeline:
    - '2019: k3sup 0.1.0 was released in August as an initial working release.'
    - '2019: 0.2.0 added the `join` command for forming a complete cluster.'
    - '2019: 0.2.2 added Windows binary support.'
    - '2019: 0.3.0 added k3s version pinning.'
    - >
      2020: The project was widely documented for bare-metal and highly available k3s
      workflows.
  usage:
    - >
      A typical workflow runs `k3sup install` against the first host, then `k3sup join`
      for additional agents or servers. The tool handles SSH, remote installation, token
      handling, and kubeconfig retrieval so users can move directly to kubectl.
related-packages:
  - id: brew:k0sctl
    reason: >
      Choose k0sctl when you want declarative YAML-based lifecycle management for k0s;
      k3sup offers a smaller imperative SSH bootstrap workflow for k3s.
    rel: alternative
    sources:
      - https://github.com/alexellis/k3sup
      - https://docs.k0sproject.io/stable/k0sctl-install/
  - id: brew:kubernetes-cli
    reason: >
      k3sup retrieves and rewrites kubeconfig specifically so the local kubectl client
      can manage the newly installed k3s cluster.
    rel: adjacent_workflow
    sources:
      - https://github.com/alexellis/k3sup#readme
      - https://kubernetes.io/docs/reference/kubectl/
category: cloud-infrastructure
package-manager:
  apk: k3sup
  brew: k3sup
  macports: k3sup
  nix: k3sup
  scoop: main/k3sup
  zypper: k3sup
package-manager-url: https://formulae.brew.sh/formula/k3sup
license: MIT
tags:
  - bootstrap
  - cli
  - k3s
  - kubernetes
  - ssh
description: Utility to create k3s clusters on any local or remote VM
executables:
  - k3sup
provenance:
  formula: k3sup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
