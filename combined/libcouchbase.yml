id: brew:libcouchbase
display-name: libcouchbase
homepage: https://docs.couchbase.com/c-sdk/current/hello-world/start-using-sdk.html
repo: https://github.com/couchbase/libcouchbase
docs:
  - https://docs.couchbase.com/c-sdk/current/hello-world/start-using-sdk.html
  - https://docs.couchbase.com/sdk-api/couchbase-c-client/intro_sec.html
config-file-location:
  unix: ~/.cbcrc
credentials-file-location:
  unix: ~/.cbcrc
history:
  adoption-history:
    - >
      Adoption came from two directions: direct C applications using Couchbase, and
      language SDKs or extensions that used the C client underneath. Couchbase's package
      documentation lists apt and yum repositories, Homebrew installation, Windows
      archives, and source builds, which made the library a normal dependency in both
      server deployments and developer workstations.
  package-nerd-significance:
    - >
      libcouchbase is interesting to package nerds because it is not just a leaf CLI: it
      is a database client ABI, a tool bundle, and historically a foundation for
      higher-level Couchbase SDKs. Packaging it correctly means caring about TLS,
      event-loop backends, server compatibility, and command-line tools in one formula.
  project-history:
    - >
      The Couchbase repository describes libcouchbase as the C client library for
      Couchbase, responsible for connecting to a cluster and executing data operations.
      Its README also shows the library's long-standing cross-platform shape: Linux, OS
      X/macOS, and Windows support, with asynchronous integrations for libuv, libev,
      libevent, select, and Windows IOCP.
    - >
      Couchbase documentation treats libcouchbase as both the C SDK and as
      infrastructure for other SDKs. The getting-started guide states that older
      versions of the Node.js, PHP, and Python SDKs used libcouchbase to communicate
      with Couchbase Server.
  related-projects:
    - >
      Related projects include Couchbase Server, the Couchbase Node.js, Python, and PHP
      SDKs, libcouchbase's `cbc` tools, libevent, libev, libuv, OpenSSL, and
      CouchbaseMock for tests.
  sources:
    - https://docs.couchbase.com/c-sdk/current/hello-world/start-using-sdk.html
    - https://docs.couchbase.com/c-sdk/current/project-docs/sdk-release-notes.html
    - https://formulae.brew.sh/formula/libcouchbase
    - https://github.com/couchbase/libcouchbase
  summary:
    - >
      libcouchbase is the Couchbase C SDK and low-level C client library. It speaks
      Couchbase cluster protocols, provides synchronous and asynchronous APIs, and ships
      the `cbc` command family for administration, diagnostics, data access, and
      benchmarking.
  timeline:
    - >
      2014-11-27: Repository contributor list noted as last updated on this date in the
      README.
    - '2020-04-08: Couchbase C SDK 3.0.1 released as the second release of the 3.0 series.'
    - >
      2020-06-08: Couchbase release notes mention Homebrew behavior changing from the
      2.10 series to the 3.0 series.
    - >
      2020s: Couchbase maintained 3.x release notes and package repositories for Debian,
      Ubuntu, Enterprise Linux, Amazon Linux, Windows, and source archives.
  usage:
    - >
      Developers link against the C SDK for key-value, query, management, and cluster
      operations, while operators and package users often meet libcouchbase through the
      `cbc-*` tools. The official docs point to `cbc` and `cbc-pillowfight` as examples,
      and Homebrew exposes a large set of `cbc-` utilities.
related-packages: []
category: data
