history:
  package-nerd-significance:
    - >
      For package collections, wikibase-cli is notable less as a standalone data store
      than as a small automation surface over a knowledge-graph stack. Its `wb` and `wd`
      executables make Wikibase operations feel like ordinary shell commands, which is
      useful for data-cleaning, bot, and reconciliation workflows.
  project-history:
    - >
      The tool was primarily developed around Wikidata, then generalized so the same
      command-line workflow could target arbitrary Wikibase instances. That transition
      mirrors the wider Wikibase ecosystem: Wikidata is the largest public deployment,
      while institutional and private Wikibase installations need the same read, edit,
      and scripting primitives.
  related-projects:
    - >
      wikibase-cli sits on top of wikibase-edit and wikibase-sdk and targets Wikidata as
      well as other Wikibase deployments.
  sources:
    - https://codeberg.org/maxlath/wikibase-cli
    - https://github.com/maxlath/wikibase-cli/blob/main/README.md
    - https://www.wikidata.org/wiki/Wikidata:Tools/WikibaseJS-cli
  summary:
    - >
      wikibase-cli is a command-line interface for Wikidata and other Wikibase
      installations. Its own README describes it as a CLI layer over the JavaScript
      wikibase-edit and wikibase-sdk modules, with extra terminal-oriented commands and
      a batch mechanism intended for large edit runs.
  usage:
    - >
      In practice, wikibase-cli is used as a terminal alternative to browser-based
      editing and as a scripting tool for repeated or bulk edits. The Wikidata tools
      page describes it as based on wikibase-edit and usable from scripts to run many
      edits, which is the niche where package users are most likely to meet it.
category: data
