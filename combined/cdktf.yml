id: brew:cdktf
display-name: CDK for Terraform
homepage: https://github.com/hashicorp/terraform-cdk
repo: https://github.com/hashicorp/terraform-cdk
docs:
  - https://developer.hashicorp.com/terraform/cdktf
  - https://developer.hashicorp.com/terraform/cdktf/create-and-deploy/configuration-file
config-file-location:
  unix: ./cdktf.json
credentials-file-location: null
history:
  adoption-history:
    - >
      CDKTF appealed to Terraform users who wanted loops, classes, libraries, testing
      patterns, and IDE type support from languages such as TypeScript, Python, Java,
      C#, and Go, while still targeting Terraform providers and state-oriented
      workflows.
    - >
      Its adoption is clearest in the Terraform ecosystem rather than as a replacement
      for Terraform language itself: teams use it when generated bindings and
      programming-language abstractions justify the additional build step.
  package-nerd-significance:
    - >
      CDKTF is a package-manager crossroads: a Homebrew CLI formula wraps a
      Node-distributed tool that generates bindings for Terraform providers, so
      versioning touches npm packaging, Terraform provider constraints, generated code,
      and HashiCorp's Terraform release cadence.
  project-history:
    - >
      HashiCorp introduced CDK for Terraform as an experimental bridge between Terraform
      and the construct-based CDK programming model. The official docs now present it as
      a Terraform workflow with its own CLI, project configuration file, generated
      provider bindings, and language support.
    - >
      The official repository is hashicorp/terraform-cdk, while the packaged CLI command
      is cdktf. The 2026 Homebrew formula packages cdktf 0.21.0.
  related-projects:
    - >
      CDKTF is related to Terraform CLI, Terraform providers and modules, AWS CDK,
      constructs, and cdk8s through the shared CDK/construct programming model.
  sources:
    - https://api.github.com/repos/hashicorp/terraform-cdk
    - https://github.com/hashicorp/terraform-cdk
    - https://developer.hashicorp.com/terraform/cdktf
    - https://developer.hashicorp.com/terraform/cdktf/create-and-deploy/configuration-file
    - https://formulae.brew.sh/api/formula/cdktf.json
  summary:
    - >
      CDK for Terraform, commonly packaged as cdktf, lets users define Terraform
      infrastructure with familiar programming languages and then synthesize Terraform
      configuration.
  timeline:
    - '2020: HashiCorp announces CDK for Terraform 0.1.'
    - >
      2020s: CDKTF grows language guides, provider/module generation, and a dedicated
      Terraform docs section.
    - '2026: Homebrew formula packages cdktf 0.21.0.'
  usage:
    - >
      A CDKTF project uses cdktf.json to declare the language, app command, providers,
      modules, and CLI behavior. Developers run commands such as cdktf get, synth, diff,
      and deploy around generated Terraform artifacts.
related-packages:
  - id: brew:pulumi
    reason: >
      Pulumi is an alternative general-purpose-language infrastructure-as-code system
      with official comparison and migration guidance specifically for CDKTF users.
    rel: alternative
    sources:
      - https://www.pulumi.com/docs/iac/comparisons/cdktf/
      - https://www.pulumi.com/docs/iac/adopting-pulumi/migrating-to-pulumi/from-terraform/
category: cloud-infrastructure
package-manager:
  brew: cdktf
package-manager-url: https://formulae.brew.sh/formula/cdktf
license: MPL-2.0
tags:
  - cdktf
  - cli
  - go
  - infrastructure-as-code
  - java
  - python
  - terraform
  - typescript
description: Cloud Development Kit for Terraform
executables:
  - cdktf
provenance:
  formula: cdktf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
