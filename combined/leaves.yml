id: brew:leaves
display-name: leaves
homepage: https://github.com/patonw/leaves
repo: https://github.com/patonw/leaves
docs:
  - https://github.com/patonw/leaves#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/leaves/setings.toml
    - ~/.config/leaves/setings.toml (when XDG_CONFIG_HOME is unset)
  macos: ~/Library/Application Support/leaves/setings.toml
  windows: '%APPDATA%\leaves\setings.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      leaves has niche cross-platform adoption among terminal users and is distributed
      through Homebrew and Nix. Its text-mode interface makes disk visualization usable
      on remote systems where graphical analyzers are unavailable.
  package-nerd-significance:
    - >
      leaves brings the treemap model associated with graphical tools such as WinDirStat
      and QDirStat to terminal-focused package collections. Its Rust implementation and
      remote-shell suitability make it a distinctive alternative to traditional du-style
      summaries and interactive directory lists.
  project-history:
    - >
      leaves was created as a text-mode disk-usage visualization utility. Its official
      documentation describes a hierarchical rectangle display whose areas approximate
      file and directory sizes, with runtime depth controls, directory focusing, and an
      x-ray view grouped by file type.
  related-projects:
    - WinDirStat
    - QDirStat
    - ncdu
    - du
    - dust
  sources:
    - https://github.com/patonw/leaves
    - source_facts.package-manager
  summary:
    - >
      Leaves is a terminal disk-usage analyzer that renders files and directories as
      nested rectangles sized approximately by their disk usage.
  timeline:
    - '2020s: leaves became available as a Rust-based terminal disk-usage visualizer.'
    - '2020s: Homebrew and Nix added package-manager distribution.'
  usage:
    - >
      Users run leaves with a directory to scan, or without one to inspect the current
      directory. It normally respects hidden-file and ignore rules, supports glob
      refinements, and provides interactive navigation, depth adjustment, and file-type
      x-ray views.
related-packages:
  - id: brew:diskonaut
    reason: >
      Choose diskonaut for another interactive terminal treemap that emphasizes
      navigating and deleting content during a single cleanup session.
    rel: alternative
    sources:
      - https://github.com/patonw/leaves#readme
      - https://github.com/imsnif/diskonaut#readme
  - id: brew:ncdu
    reason: >
      Choose ncdu for a mature directory-list browser with in-session deletion and scan
      export/import instead of leaves' nested-rectangle visualization.
    rel: alternative
    sources:
      - https://github.com/patonw/leaves#readme
      - https://dev.yorhel.nl/ncdu
      - https://dev.yorhel.nl/ncdu/man/2_0
  - id: brew:dust
    reason: >
      Choose Dust when an immediate noninteractive hierarchy of the largest entries is
      preferable to leaves' navigable full-screen TUI.
    rel: alternative
    sources:
      - https://github.com/patonw/leaves#readme
      - https://github.com/bootandy/dust#readme
category: system
package-manager:
  brew: leaves
  nix: leaves
package-manager-url: https://formulae.brew.sh/formula/leaves
license: MPL-2.0
tags:
  - cli
  - disk-usage
  - filesystem
  - treemap
  - tui
  - visualization
description: Text-mode disk usage visualization utility
executables:
  - leaves
provenance:
  formula: leaves
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
