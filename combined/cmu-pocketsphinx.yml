id: brew:cmu-pocketsphinx
display-name: PocketSphinx
homepage: https://cmusphinx.github.io/
repo: https://github.com/cmusphinx/pocketsphinx
docs:
  - https://pocketsphinx.readthedocs.io/en/latest
  - https://cmusphinx.github.io/doc/pocketsphinx
  - https://github.com/cmusphinx/pocketsphinx#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      PocketSphinx's adoption came from being usable offline and on constrained systems
      long before cloud speech APIs were routine. The input package facts show packaging
      across Homebrew, Debian/Ubuntu GStreamer integration, Fedora, MacPorts, Nix,
      Scoop, and openSUSE, while the official Python docs document `pip install
      pocketsphinx`.
  package-nerd-significance:
    - >
      PocketSphinx is package-nerd significant because it packages a historically
      important offline speech recognizer across C, CLI, Python, audio I/O, models, and
      GStreamer-style integration. Its modern 5.x line also removed SphinxBase as a
      separate dependency, simplifying one of the classic packaging pain points.
  project-history:
    - >
      The official README describes PocketSphinx as one of Carnegie Mellon University's
      open source large-vocabulary, speaker-independent continuous speech recognition
      engines. It also explains that the underlying algorithms and models are old but
      remain useful because they are compact and efficient.
    - >
      The README traces lineage to Sphinx-II and older CMU systems released as free
      software, and credits David Huggins-Daines with creating PocketSphinx by adding
      speed and memory optimizations, fixed-point computation, JSGF support,
      portability, and a more coherent API.
  related-projects:
    - >
      PocketSphinx is part of the CMU Sphinx family and is related to Sphinx-II, older
      CMU speech-recognition systems, GStreamer packaging, Read the Docs Python
      bindings, and audio tools such as sox and PortAudio.
  sources:
    - https://github.com/cmusphinx/pocketsphinx#readme
    - https://pocketsphinx.readthedocs.io/en/latest/
    - https://api.github.com/repos/cmusphinx/pocketsphinx
    - https://api.github.com/repos/cmusphinx/pocketsphinx/releases
  summary:
    - >
      PocketSphinx is a compact open source speech recognizer from the CMU Sphinx
      family, distributed as a C library, command-line tools, and Python package.
  timeline:
    - '2014-04: Current GitHub repository created.'
    - '2022-10: v5.0.0 release published.'
    - '2023-12: v5.0.3 release published.'
    - '2025-01: v5.0.4 release published.'
    - '2026-06: v5.1.1 release published.'
  usage:
    - >
      The official README documents a `pocketsphinx` command that reads mono 16-bit PCM
      audio from standard input or files and outputs recognition results, along with
      subcommands for live recognition, single-utterance recognition, alignment,
      configuration, and sox integration. The Read the Docs site documents Python usage
      with `LiveSpeech`.
related-packages:
  - id: brew:cmuclmtk
    reason: >
      CMUCLMTK builds ARPA n-gram language models from text corpora for use in CMUSphinx
      recognition workflows, making it a practical model-preparation companion to
      PocketSphinx.
    rel: adjacent_workflow
    sources:
      - https://cmusphinx.github.io/wiki/tutoriallm/
      - https://www.cs.cmu.edu/~dorcas/toolkit_documentation.html
      - https://github.com/cmusphinx/pocketsphinx#readme
  - id: brew:openai-whisper
    reason: >
      OpenAI Whisper is an alternative offline speech-transcription system to choose for
      multilingual neural transcription, while PocketSphinx emphasizes a compact
      configurable decoder and grammar-based recognition.
    rel: alternative
    sources:
      - https://github.com/openai/whisper#readme
      - https://github.com/cmusphinx/pocketsphinx#readme
category: ai
package-manager:
  brew: cmu-pocketsphinx
  debian: gstreamer1.0-pocketsphinx
  dnf: pocketsphinx
  macports: pocketsphinx
  nix: pocketsphinx
  scoop: extras/pocketsphinx
  ubuntu: gstreamer1.0-pocketsphinx
  zypper: gstreamer-plugin-pocketsphinx
package-manager-url: https://formulae.brew.sh/formula/cmu-pocketsphinx
license: BSD-2-Clause
tags:
  - ai
  - audio
  - cli
  - cmusphinx
  - offline-recognition
  - speech-recognition
  - voice
description: Lightweight speech recognition engine for mobile devices
executables:
  - pocketsphinx
  - pocketsphinx_batch
  - pocketsphinx_jsgf2fsg
  - pocketsphinx_lm_convert
  - pocketsphinx_lm_eval
  - pocketsphinx_mdef_convert
  - pocketsphinx_pitch
provenance:
  formula: cmu-pocketsphinx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
