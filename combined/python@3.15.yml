id: brew:python@3.15
display-name: Python 3.15
homepage: https://www.python.org/
repo: https://github.com/python/cpython
docs:
  - https://docs.python.org/3.15
  - https://docs.python.org/3.15/library
  - https://docs.python.org/3.15/using
  - https://docs.python.org/3.15/whatsnew/3.15.html
config-file-location:
  unix: ${PYTHONSTARTUP}
  windows: '%PYTHONSTARTUP%'
credentials-file-location: null
history:
  adoption-history:
    - >
      Python grew from a scripting language into a widely deployed general-purpose
      language, with major communities in education, automation, web services,
      scientific computing, data analysis, and machine learning.
    - >
      Operating-system package managers commonly distribute Python alongside Python's
      own pip and virtual-environment tooling. Versioned formulas such as python@3.15
      allow applications and development environments to retain a specific interpreter
      branch while an unversioned system package moves forward.
  package-nerd-significance:
    - >
      Python sits at the boundary between system package management and a very large
      language-package ecosystem. Interpreter ABI changes, native extensions, binary
      wheels, virtual environments, and pip's relationship with externally managed
      installations make each new CPython branch consequential for maintainers.
    - >
      Python 3.15 is an important compatibility target for package authors and
      build-system maintainers because it introduces language, standard-library,
      startup, C API, and build changes while beginning a new five-year upstream support
      lifecycle.
  project-history:
    - >
      Guido van Rossum began Python at CWI in December 1989 as a successor influenced by
      ABC and aimed at Unix and C users. The first public releases appeared in 1991.
    - >
      Python 2.0 arrived in 2000, followed by the deliberately incompatible Python 3.0
      line in 2008. The ecosystem's long transition to Python 3 concluded after Python 2
      reached end of life in 2020.
    - >
      Development of Python 3.15 began in May 2025 under the annual feature-release
      cadence. CPython 3.15.0 was released on October 9, 2026, with two years of regular
      bug-fix support planned before a source-only security-maintenance period.
  related-projects:
    - 'CPython: the reference Python implementation packaged by this formula.'
    - "pip and PyPI: Python's default package installer and principal public package index."
    - 'venv: the standard-library mechanism for isolated Python environments.'
    - 'PyPy: an alternative Python implementation with a tracing JIT compiler.'
  sources:
    - https://docs.python.org/3.15/license.html
    - https://docs.python.org/3.15/whatsnew/3.15.html
    - https://github.com/python/cpython/releases/tag/v3.15.0
    - https://peps.python.org/pep-0602/
    - https://peps.python.org/pep-0790/
    - https://www.python.org/doc/essays/foreword/
  summary:
    - >
      Python is an interpreted, high-level, general-purpose programming language. The
      python@3.15 formula provides the CPython 3.15 runtime as a versioned package.
  timeline:
    - '1989: Guido van Rossum begins work on Python at CWI.'
    - '1991: The first public Python releases appear.'
    - '2000: Python 2.0 is released.'
    - '2008: Python 3.0 starts the modern language line.'
    - '2020: Python 2 reaches end of life.'
    - '2025-05-07: Development of Python 3.15 begins.'
    - '2026-10-09: CPython 3.15.0 is released.'
  usage:
    - >
      Users run Python interactively, execute scripts and modules, create isolated
      environments with venv, and install third-party distributions with pip. A
      versioned Homebrew formula is useful when software requires the 3.15 interpreter
      branch rather than Homebrew's current default Python.
    - >
      PYTHONSTARTUP may point to an optional user-selected file whose Python commands
      run before the first interactive prompt. Python does not prescribe a fixed
      filesystem path for that file.
category: language-runtime
package-manager:
  apk: pyc
  brew: python@3.15
  chocolatey: python3
  debian: python3
  dnf: python3
  nix: python3
  pacman: python
  scoop: main/python
  ubuntu: python3
  winget: Python.Python.3.14
  zypper: python313
package-manager-match:
  scoop: fallback
package-manager-url: https://formulae.brew.sh/formula/python@3.15
license: Python-2.0
tags:
  - cli
  - cpython
  - interpreter
  - programming-language
  - python
  - runtime
description: Interpreted, interactive, object-oriented programming language
executables:
  - idle3
  - idle3.15
  - pip3
  - pip3.15
  - pydoc3
  - pydoc3.15
  - python3
  - python3-config
  - python3.15
  - python3.15-config
provenance:
  formula: python@3.15
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
