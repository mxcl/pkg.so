id: brew:cadical
display-name: CaDiCaL
homepage: https://fmv.jku.at/cadical/
repo: https://github.com/arminbiere/cadical
docs:
  - https://fmv.jku.at/cadical
  - https://github.com/arminbiere/cadical#readme
  - https://github.com/arminbiere/cadical/blob/master/BUILD.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Within the SAT community, CaDiCaL's adoption is tied to solver competitions and
      formal-methods tooling. The FMV page notes first place in the SAT track of SAT
      Race 2019 and second overall, and the Homebrew input shows packaging in Homebrew,
      Debian, Fedora, Nix, Ubuntu, and related Linux distributions.
  package-nerd-significance:
    - >
      CaDiCaL is significant because SAT solvers are tiny-looking packages with deep
      performance consequences. A package update can affect formal verification, theorem
      proving, fuzzing, dependency solving, and academic benchmark results, so
      maintainers care about exact versions, compiler flags, proof support, and
      reproducibility.
  project-history:
    - >
      The official FMV page presents CaDiCaL as a simplified satisfiability solver and
      records competition-oriented releases for SAT Competition 2017, SAT Competition
      2018, SAT Race 2019, and SAT Competition 2020. The GitHub README explains that
      CaDiCaL aimed to be cleaner than prior solvers such as Lingeling while remaining
      fast.
    - >
      CaDiCaL became a research and engineering platform as well as a solver binary. The
      README points to a C++ API header, test documentation, NEWS beginning with release
      1.5.1, and a CaDiCaL 2.0 tool paper published at CAV 2024.
  related-projects:
    - >
      Related solvers and libraries include Lingeling, Kissat, MiniSAT-family solvers,
      IPASIR-compatible SAT integrations, and competition benchmark suites from SAT Race
      and SAT Competition.
  sources:
    - https://fmv.jku.at/cadical/
    - https://github.com/arminbiere/cadical#readme
    - https://raw.githubusercontent.com/arminbiere/cadical/master/README.md
    - source_facts.package-manager
  summary:
    - >
      CaDiCaL is Armin Biere's clean, efficient CDCL SAT solver, packaged as both a
      command-line solver and libcadical.a. Its project goal is to stay understandable
      and easy to modify while remaining competitive with state-of-the-art solvers.
  timeline:
    - '2017: CaDiCaL source is submitted to SAT Competition 2017.'
    - '2018: A SAT Competition 2018 version is published.'
    - '2019: CaDiCaL wins first place in the SAT track of SAT Race 2019 and second overall.'
    - '2020: FMV publishes the SAT Competition 2020 source archive.'
    - '2024: CaDiCaL 2.0 tool paper appears at CAV 2024.'
    - '2025: GitHub releases list CaDiCaL 3.0.0.'
  usage:
    - >
      The command-line interface accepts DIMACS CNF input and an optional proof output
      path as cadical [ dimacs [ proof ] ]. Developers can also link against
      libcadical.a through the C++ API for embedding SAT solving in verification,
      synthesis, model checking, and solver research tools.
related-packages:
  - id: brew:kissat
    reason: >
      Kissat is a non-incremental C reimplementation of CaDiCaL designed for a more
      condensed solver core, making it a strong alternative for standalone SAT
      workloads.
    rel: alternative
    sources:
      - https://github.com/arminbiere/cadical
      - https://github.com/arminbiere/kissat
      - https://fmv.jku.at/kissat/
