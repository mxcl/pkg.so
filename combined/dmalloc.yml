id: brew:dmalloc
display-name: Dmalloc
homepage: https://dmalloc.com/
repo: https://github.com/j256/dmalloc
docs:
  - https://dmalloc.com/docs/dmalloc.html
  - https://dmalloc.com/docs/dmalloc.pdf
  - https://dmalloc.com/docs/getting-started
config-file-location:
  unix: ~/.dmallocrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Dmalloc's official documentation lists successful use across a wide range of Unix
      and non-Unix systems, including AIX, the BSDs, GNU/Hurd, HP-UX, IRIX, Linux,
      macOS, NeXT, OSF/DUX, SCO, Solaris, Ultrix, UnixWare, Windows, and Unicos on a
      Cray T3E.
  package-nerd-significance:
    - >
      Dmalloc is historically interesting because it predates many modern sanitizers yet
      remains a compact, portable package-manager answer for C heap debugging. Its shell
      integration, runtime token model, and static-library workflow make it feel like
      classic Unix debugging infrastructure.
  project-history:
    - >
      The manual carries copyright years from 1992 to 2020 and identifies version 5.6.5
      as a December 2020 release. Its feature set reflects a long-lived C debugging
      niche: leak tracking, fence-post write detection, file and line reporting,
      statistics logging, and threaded-program support.
  related-projects:
    - >
      Dmalloc sits in the same practical debugging space as allocator wrappers, leak
      checkers, and compiler/runtime sanitizers, but its official documentation focuses
      on replacing the standard allocation routines directly.
  sources:
    - https://dmalloc.com/
    - https://dmalloc.com/docs/dmalloc.html
    - https://github.com/j256/dmalloc
  summary:
    - >
      Dmalloc is Gray Watson's debug memory allocation library, designed as a drop-in
      replacement for malloc, realloc, calloc, free, and related routines while adding
      runtime-configurable memory debugging.
  timeline:
    - '1992: Earliest copyright year in the official manual.'
    - '2020-12: Dmalloc manual identifies version 5.6.5.'
  usage:
    - >
      Typical use links the dmalloc library into a C or C++ program, optionally includes
      dmalloc.h for file and line reporting, and uses the dmalloc utility plus the
      DMALLOC_OPTIONS environment variable to enable checks such as leak logging, heap
      verification, and abort-on-error behavior.
related-packages:
  - id: brew:valgrind
    reason: >
      Choose Valgrind Memcheck when you want broad invalid-access, uninitialized-value,
      bad-free, and leak detection by running an existing native binary under
      instrumentation rather than linking a replacement allocator.
    rel: alternative
    sources:
      - https://dmalloc.com/
      - https://valgrind.org/info/tools.html
      - https://valgrind.org/docs/manual/mc-manual.html
category: developer-tools
package-manager:
  brew: dmalloc
  debian: libdmalloc-dev
  macports: dmalloc
  nix: dmalloc
  ubuntu: libdmalloc-dev
package-manager-url: https://formulae.brew.sh/formula/dmalloc
license: ISC
tags:
  - c
  - cli
  - debugging
  - library
  - malloc
  - memory-debugging
  - memory-leak-detection
description: Debug versions of system memory management routines
executables:
  - dmalloc
provenance:
  formula: dmalloc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
