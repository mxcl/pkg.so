config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CafeOBJ's adoption is specialized: it lives in the formal specification and
      verification community rather than mainstream application development. Packaging
      in Homebrew and Ubuntu makes it easier for researchers, students, and toolchain
      curators to install the interpreter without manually building a Lisp system.
  package-nerd-significance:
    - >
      CafeOBJ matters to package-history nerds because it is one of the long-tail
      formal-methods languages that package managers preserve alongside mainstream
      compilers. Its Homebrew formula keeps a Common Lisp-based research language
      installable on modern developer machines.
  project-history:
    - >
      The official interpreter README identifies CafeOBJ as a new-generation algebraic
      specification and programming language and as a direct successor of OBJ. It
      inherits OBJ features such as mixfix syntax, subtyping, module composition,
      parameterized modules, views, and module expressions, while adding rewriting
      logic, hidden algebra, and combinations of those paradigms.
    - >
      The open interpreter source is maintained in Common Lisp and can be built with
      Allegro CL, SBCL, or CLISP. The GitHub repository was created in 2017, while the
      README for version 1.6.0 is dated 2020-01-20 and the repository carries later
      1.6.x tags.
  related-projects:
    - OBJ is the direct predecessor named by the official CafeOBJ README.
    - >
      CafeOBJ sits near other algebraic specification and rewriting-logic tools, but its
      official documentation frames its own lineage through OBJ, rewriting logic, hidden
      algebra, and proof scores.
  sources:
    - https://api.github.com/repos/CafeOBJ/cafeobj
    - https://api.github.com/repos/CafeOBJ/cafeobj/tags
    - https://cafeobj.org/files/manual.pdf
    - https://cafeobj.org/intro/en/index.html
    - https://github.com/CafeOBJ/cafeobj#readme
  summary:
    - >
      CafeOBJ is an algebraic specification and programming language used in
      formal-methods work, theorem-style verification, and executable specifications.
  timeline:
    - '2017: Public CafeOBJ interpreter repository created on GitHub.'
    - '2020: README marks CafeOBJ interpreter version 1.6.0 dated 2020-01-20.'
    - '2020s: 1.6.x tags continue the interpreter line.'
    - 'Present: Homebrew and Ubuntu package the interpreter for easier installation.'
  usage:
    - >
      Users write formal specifications, load them into the CafeOBJ processor, reduce
      terms, inspect modules, and construct proof scores. The official introductory
      material walks beginners from describing specifications to verification using
      simple natural-number examples.
