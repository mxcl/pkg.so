id: brew:tuios
display-name: TUIOS
homepage: https://tuios.dev/
repo: https://github.com/Gaurav-Gosain/tuios
docs:
  - https://github.com/Gaurav-Gosain/tuios/tree/main/docs
  - https://tuios.gaurav.zip/
config-file-location:
  unix:
    - ~/.config/tuios/config.toml
    - $XDG_CONFIG_HOME/tuios/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions include Homebrew for macOS and Linux, AUR, Nix,
      Go install, Docker, a shell installer, and GitHub releases with prebuilt binaries.
      The README also displays a Terminal Trove Tool of the Week badge, pointing to
      discovery through terminal-tool communities rather than only through language
      package registries.
    - >
      The input package facts record Homebrew, apk, and Nix packaging, which fits the
      tool's niche: developers who curate terminal environments and want their
      multiplexer available through the same package managers as shells, prompts,
      editors, and terminal emulators.
  package-nerd-significance:
    - >
      TUIOS is significant to package nerds as a high-churn terminal workspace tool that
      bundles ideas from tmux, vim, i3-style tiling, Kitty, Ghostty, WezTerm, and the
      Charm Go ecosystem. Its package-manager spread makes it easy to test alongside
      established multiplexers without replacing a user's whole terminal stack.
  project-history:
    - >
      The project belongs to the post-tmux wave of terminal UX tools that treat the
      terminal as a graphical workspace rather than only a pane splitter. Official
      documentation emphasizes event-driven rendering, Bubble Tea v2, Lipgloss v2, Kitty
      graphics support, sixel support, scrollback browsing, daemon sessions, and layout
      templates.
    - >
      The README's v0.7.0 section describes a notable architecture overhaul: PTY output
      signals rendering instead of a fixed-rate ticker, graphics are batched with the
      render cycle, and image IDs are reused to reduce flicker. That history shows the
      project evolving from a multiplexer into a terminal protocol and rendering
      experiment.
  related-projects:
    - >
      tmux is the closest operational comparison for sessions, panes, prefix keys, and
      detach/reattach workflows.
    - vim and i3-style BSP tiling influence the modal window-management model.
    - >
      Bubble Tea, Lipgloss, Kitty, Ghostty, and WezTerm are named by the README as
      ecosystem influences or supported terminal protocol surfaces.
  sources:
    - >
      https://github.com/Gaurav-Gosain/tuios README: positioning, architecture,
      features, v0.7.0 notes, installation methods.
    - >
      https://github.com/Gaurav-Gosain/tuios/blob/main/docs/CONFIGURATION.md: XDG TOML
      configuration path and commands.
    - 'input source_facts.package-manager: Homebrew, apk, and Nix package coverage.'
  summary:
    - >
      TUIOS is a modern terminal multiplexer and terminal window manager written in Go.
      Its README frames it as a "Terminal UI Operating System" built on the Charm
      terminal stack, combining tmux-like persistence, vim-like modal control, BSP
      tiling, graphics passthrough, command palettes, and automation in one terminal
      application.
  timeline:
    - >
      v0.7.0 README section: Documents architecture and performance work around
      event-driven rendering and graphics passthrough.
    - >
      Current README: Documents Homebrew, AUR, Nix, Go install, Docker, install script,
      and GitHub release distribution.
    - 'Current configuration guide: Documents XDG-style TOML configuration.'
  usage:
    - >
      Users launch `tuios`, create panes and workspaces, switch between
      window-management and terminal modes, open a command palette, use a Ctrl-B-style
      prefix, save and load layouts, run persistent daemon sessions, and automate
      terminal workflows through tape scripting.
    - >
      The configuration guide documents TOML configuration at
      `~/.config/tuios/config.toml` or `$XDG_CONFIG_HOME/tuios/config.toml`, including
      custom keybindings, appearance settings, and commands to find, edit, list, and
      reset configuration.
category: productivity
package-manager:
  apk: tuios
  brew: tuios
  nix: tuios
package-manager-url: https://formulae.brew.sh/formula/tuios
license: MIT
tags:
  - automation
  - cli
  - terminal-multiplexer
  - terminal-window-manager
  - tui
description: Terminal UI OS (Terminal Multiplexer)
executables:
  - tuios
provenance:
  formula: tuios
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
