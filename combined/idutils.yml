id: brew:idutils
display-name: GNU idutils
homepage: https://www.gnu.org/software/idutils/
repo: https://git.savannah.gnu.org/cgit/idutils.git
docs:
  - https://www.gnu.org/software/idutils/manual
  - https://www.gnu.org/software/idutils
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      idutils belongs to the older Unix developer-tool ecosystem alongside ctags, etags,
      grep, find, and early source browsers. Its adoption came from users who wanted a
      reusable token index before interactive IDE indexing became common.
    - >
      Package metadata shows it remains available through Homebrew, MacPorts, Nix, and
      openSUSE-style package names. That longevity matters: the tool has outlived many
      editor-specific indexing systems because it is small, scriptable, and independent
      of any single editor.
  package-nerd-significance:
    - >
      GNU idutils is interesting because it packages source-code navigation as plain
      Unix data plumbing. The ID database is a compact artifact that can be regenerated,
      moved, queried, and scripted without a language server or project model.
    - >
      It also preserves a pre-web-search, pre-IDE philosophy of code search: build a
      specialized local index once, then answer many small questions quickly from shell
      commands.
  project-history:
    - >
      The mkid program predates GNU idutils. The historical notes preserved in the
      idutils source tree say Greg McGary posted mkid to comp.sources.unix in September
      1987; Tom Horsley later led maintenance and released mkid2 in March 1991; McGary
      resumed maintenance until 2000.
    - >
      GNU idutils generalized that idea into a suite: mkid for database creation, lid
      for token queries, fid for tokens in files, fnid for file-name lookup, xtokid for
      scanner testing, and historical specializations of lid. The GNU manual presents
      the tools as useful for large software projects and large text collections.
    - >
      GNU release archives show packaged id-utils 3.2 in 1996, a 4.0 release in 2005,
      4.x releases through 2012, and a Savannah git repository for the maintained
      source.
  related-projects:
    - >
      ctags, etags, grep, find, and later code-search tools such as GNU Global occupy
      adjacent code-navigation territory.
    - The mkid lineage is the direct ancestor inside the idutils package history.
  sources:
    - https://formulae.brew.sh/formula/idutils
    - https://ftp.gnu.org/gnu/idutils/
    - https://git.savannah.gnu.org/cgit/idutils.git
    - https://github.com/jimblandy/idutils
    - https://www.gnu.org/software/idutils/manual/idutils.html
  summary:
    - >
      GNU idutils is a family of command-line tools for building and querying an ID
      database: a token index over a set of files. The manual describes the database as
      containing file names, tokens, and a sparse matrix connecting tokens to the files
      where they appear.
    - >
      The package sits in the lineage of pre-LSP code navigation: mkid builds the index,
      lid and related tools query it, and developers get fast answers about identifiers,
      includes, strings, and file names across large source trees.
  timeline:
    - '1987-09: mkid is posted to comp.sources.unix.'
    - '1991-03: mkid2 is released to comp.sources.unix.'
    - '1996-08-12: id-utils 3.2 appears in GNU FTP archives.'
    - '2005-12-23: id-utils 4.0 appears in GNU FTP archives.'
    - '2010-06-17: idutils 4.5 appears in GNU FTP archives.'
    - '2012-02-03: idutils 4.6 appears in GNU FTP archives.'
  usage:
    - >
      A typical workflow is to run mkid over a source tree and then query the resulting
      database with lid or related commands. The manual's examples include finding files
      that reference a header, searching memos for a project token, and invoking an
      editor on files containing a function or variable.
    - >
      Although ID originally stood for identifier, the manual is explicit that idutils
      indexes more than identifiers: it also treats numeric constants and some string
      contents as searchable tokens.
related-packages:
  - id: brew:global
    reason: >
      Choose GNU GLOBAL for definition-and-reference databases, editor integrations,
      broader parser options, and generated hypertext; choose idutils for lightweight
      token indexing over source code or general text collections.
    rel: alternative
    sources:
      - https://www.gnu.org/software/idutils/
      - https://www.gnu.org/software/global/
  - id: brew:cscope
    reason: >
      Choose cscope for an interactive, C-focused browser with caller and callee
      queries; choose idutils for language-scanner-based token lookup and shell-oriented
      database queries.
    rel: alternative
    sources:
      - https://www.gnu.org/software/idutils/manual/idutils.html
      - https://cscope.sourceforge.net/
      - https://cscope.sourceforge.net/cscope_man_page.html
category: developer-tools
