id: brew:libbs2b
display-name: libbs2b
homepage: https://bs2b.sourceforge.net/
repo: https://sourceforge.net/p/bs2b/code
docs:
  - https://bs2b.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libbs2b remained a niche audio package, but it reached the usual Unix packaging
      channels because it solves a concrete need for media players, audio filters, and
      headphone listeners who want crossfeed without a large DSP stack.
  package-nerd-significance:
    - >
      For package nerds, libbs2b is the kind of tiny, single-purpose DSP library that
      explains why Unix package indexes are interesting: it packages a specific
      psychoacoustic trick as reusable plumbing.
  project-history:
    - >
      The project grew out of headphone crossfeed practice rather than a new codec or
      container format. Its site ties the implementation to Benjamin Bauer's
      stereophonic-to-binaural work and later analog crossfeed circuits by Linkwitz, Chu
      Moy, Jan Meier, John Conover, and HeadRoom, then implements comparable behavior
      with simple recursive digital filters instead of FFT convolution.
    - >
      SourceForge file records show public libbs2b release artifacts in 2006 and a 3.x
      line in 2009. The project stayed narrowly focused: a library plus command-line
      utilities for applying the filter to streams or files.
  related-projects:
    - >
      Related audio ideas include analog headphone crossfeed circuits by Bauer,
      Linkwitz, Chu Moy, Meier, Conover, and HeadRoom, which the project cites as design
      background.
  sources:
    - https://bs2b.sourceforge.net/
    - https://formulae.brew.sh/formula/libbs2b
    - https://sourceforge.net/projects/bs2b/rss?path=/libbs2b
  summary:
    - >
      libbs2b is a small audio DSP library and tool set for applying Bauer
      stereophonic-to-binaural crossfeed to stereo material, mainly for headphone
      listening.
  timeline:
    - '2006: SourceForge file feed lists libbs2b 2.1.0 Windows binary artifacts.'
    - '2009: SourceForge file feed lists libbs2b 3.0.0 and 3.1.0 source release artifacts.'
    - '2009: SourceForge file feed lists ChangeLog.txt for the libbs2b file area.'
  usage:
    - >
      Package users normally encounter it through the bs2bconvert and bs2bstream tools
      or as a linkable library embedded by audio applications. Its practical value is
      applying crossfeed presets that reduce extreme stereo separation during headphone
      playback.
related-packages:
  - id: brew:ffmpeg
    reason: >
      FFmpeg provides a documented bs2b audio filter compiled against libbs2b, allowing
      crossfeed to be applied inside broader transcoding and filtering pipelines.
    rel: adjacent_workflow
    sources:
      - https://ffmpeg.org/ffmpeg-filters.html
      - https://bs2b.sourceforge.net/
category: media
