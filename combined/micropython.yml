id: brew:micropython
display-name: MicroPython
homepage: https://www.micropython.org/
repo: https://github.com/micropython/micropython
docs:
  - https://docs.micropython.org/
  - https://www.micropython.org/
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project became important because it moved Python-style interactive development
      onto devices that previously required C, Arduino-style sketches, or vendor SDKs.
      Users write scripts, interact with a REPL, and access low-level hardware modules
      for pins, buses, timers, filesystems, and networking. The `mpy-cross` executable
      in the package compiles MicroPython bytecode for deployment, while the
      `micropython` executable provides the Unix-hosted runtime useful for testing and
      scripting.
  sources:
    - https://docs.micropython.org/
    - https://formulae.brew.sh/formula/micropython
    - https://github.com/micropython/micropython
    - >
      https://hackaday.com/2013/11/27/interview-with-damien-george-creator-of-the-micro-python-project/
    - https://micropython.org/resources/micropython-ChangeLog.txt
    - https://pyfound.blogspot.com/2016/03/genuinely-nice-chap-damien-george.html
  summary:
    - >
      MicroPython is Damien George's compact implementation of Python 3 for
      microcontrollers and constrained systems. George began the project in 2013 and
      funded it through a Kickstarter campaign for both the language runtime and the
      PyBoard reference board. Contemporary coverage described a from-scratch
      implementation with a parser, compiler, virtual machine, runtime system, garbage
      collector, and support for 32-bit ARM microcontrollers; the Python Software
      Foundation later noted that the campaign raised nearly GBP 100,000 and shipped
      MicroPython with the PyBoard.
  usage:
    - >
      MicroPython's ecosystem role widened as ports appeared for boards and chips such
      as STM32, ESP8266, ESP32, RP2040, Unix, Windows, Zephyr, and others. The BBC
      micro:bit effort and Adafruit's later CircuitPython fork helped spread the
      programming model into education and maker communities. In package-manager terms,
      MicroPython sits between a language runtime, embedded toolchain, and board
      firmware ecosystem.
related-packages:
  - id: brew:mpremote
    reason: >
      mpremote is the official host-side companion for connecting to MicroPython devices
      and installing packages over USB or UART.
    rel: adjacent_workflow
    sources:
      - https://docs.micropython.org/en/latest/reference/packages.html
      - https://docs.micropython.org/en/latest/reference/mpremote.html
category: language-runtime
