id: brew:feh
display-name: feh
homepage: https://feh.finalrewind.org/
repo: https://git.finalrewind.org/feh
docs:
  - https://feh.finalrewind.org/
  - https://man.finalrewind.org/1/feh
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/feh/themes
    - $XDG_CONFIG_HOME/feh/keys
    - $XDG_CONFIG_HOME/feh/buttons
    - ~/.config/feh/themes
    - ~/.config/feh/keys
    - ~/.config/feh/buttons
    - /etc/feh/themes
    - /etc/feh/keys
    - /etc/feh/buttons
credentials-file-location: null
history:
  adoption-history:
    - >
      The official homepage notes packaging across multiple Unix and Unix-like systems,
      including Arch Linux, Debian, FreeBSD, OpenBSD, and Ubuntu. Homebrew, MacPorts,
      Nix, Fedora, openSUSE, Alpine, and other package collections also carry it in the
      supplied package-manager metadata, which matches feh's long role as a standard
      small image viewer for lightweight X11 environments.
  package-nerd-significance:
    - >
      feh matters to package-manager culture because it is the classic small-tool answer
      to image viewing on X11: scriptable, dependency-light, easy to build, and
      comfortable in shell pipelines and window-manager configs.
    - >
      It also illustrates a maintenance style package maintainers like: conservative
      release notes, clear compile-time feature flags, signed tarballs, a man page, and
      a project homepage that documents downstream packaging without turning the tool
      into a platform.
  project-history:
    - >
      The project has been maintained for many years as a small, focused image viewer
      built around imlib2 and X11 rather than a desktop photo-management stack. The
      public release archive documents continuous 1.x, 2.x, and 3.x releases from at
      least 2010 through 2026, with release notes focused on practical viewer behavior,
      build portability, security hardening, and window-manager edge cases.
    - >
      feh 2.0 was released in 2011 according to the project changelog, and the 3.x line
      is still active: the official archive lists feh 3.12.2 on 2026-05-07. Recent
      releases continue the same pattern, including fixes for Xwayland focus behavior,
      reproducible manual builds, filelist parsing, rendering bugs, and safer shell
      format specifiers for actions and info commands.
  related-projects:
    - imlib2 is the image-loading/rendering library underlying feh's supported image formats.
    - >
      ImageMagick can be used by feh for optional conversion of otherwise unsupported
      file types.
    - >
      xwallpaper, hsetroot, and display from ImageMagick occupy adjacent shell-driven
      image and wallpaper workflows, but feh remains popular because it combines
      viewing, listing, slideshow, and wallpaper duties.
  sources:
    - https://feh.finalrewind.org/
    - https://man.finalrewind.org/1/feh
    - https://feh.finalrewind.org/archive/
    - https://raw.githubusercontent.com/derf/feh/master/ChangeLog
  summary:
    - >
      feh is a lightweight X11 image viewer and cataloguer aimed at command-line users.
      Its official manual and homepage emphasize a Unix-style workflow: run it from a
      shell, feed it files, directories, URLs, or filelists, and control it through
      options, key bindings, mouse bindings, stdin, and signals.
  timeline:
    - >
      2010: Official archive shows active 1.x releases, including feh 1.3.5 and later
      1.x versions.
    - '2011: feh 2.0 released.'
    - '2019: feh 3.0 released.'
    - '2026: feh 3.12.2 released on 2026-05-07.'
  usage:
    - >
      Common usage centers on fast image viewing from the shell, slideshows over
      directories, thumbnail and index generation, listing image metadata, opening URLs
      when libcurl support is enabled, and setting X11 backgrounds. The manual also
      documents custom shell actions, filelists, captions, EXIF display, configurable
      keys/buttons, and cache behavior.
    - >
      Its wallpaper-setting mode is one reason package users keep it installed even when
      they use another image viewer interactively: window-manager and dotfile setups can
      call feh from startup scripts to set backgrounds without pulling in a desktop
      environment.
related-packages:
  - id: brew:imagemagick
    reason: >
      Use ImageMagick alongside feh to convert SVG, XCF, OTF, and other formats that feh
      cannot load directly when conversion support is enabled.
    rel: adjacent_workflow
    sources:
      - https://man.finalrewind.org/1/feh/
      - https://imagemagick.org/
  - id: brew:chafa
    reason: >
      Choose Chafa when images must be rendered inside a terminal using graphics
      protocols or ANSI/Unicode art; choose feh for native X11 windows and wallpaper
      management.
    rel: alternative
    sources:
      - https://feh.finalrewind.org/
      - https://github.com/hpjansson/chafa
category: media
package-manager:
  apk: feh
  brew: feh
  debian: feh
  dnf: feh
  macports: feh
  nix: feh
  pacman: feh
  ubuntu: feh
  zypper: feh
package-manager-url: https://formulae.brew.sh/formula/feh
license: MIT-feh
tags:
  - cli
  - image-viewer
  - slideshow
  - wallpaper
  - x11
description: X11 image viewer
executables:
  - feh
provenance:
  formula: feh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
