id: brew:csshx
display-name: csshX
homepage: https://github.com/brockgr/csshx
repo: https://github.com/brockgr/csshx
docs:
  - https://github.com/brockgr/csshx#readme
config-file-location:
  macos:
    - /etc/csshrc
    - ~/.csshrc
    - /etc/clusters
credentials-file-location: null
history:
  adoption-history:
    - >
      The README describes csshX as a command-line script requiring no special
      installation beyond placing it on PATH, tested on Mac OS X 10.5 through 10.7 with
      the default Perl installation. That made it easy for Mac administrators to package
      as a single executable around the system terminal and ssh.
  package-nerd-significance:
    - >
      csshX is package-significant as a small, platform-specific admin tool: a single
      Perl executable, no bundled runtime dependency beyond system Perl, and behavior
      tied to Terminal.app rather than portable terminal emulators.
  project-history:
    - >
      The upstream README and script identify csshX as a Mac OS X Terminal.app cluster
      SSH tool, copyright 2011 by Gavin Brock. Its README predates the GitHub-centered
      packaging era, pointing users to a Google Code project page for releases and to
      self-contained manual documentation via csshX --man.
  related-projects:
    - >
      csshX is related to ClusterSSH-style tools, SSH fan-out helpers, and other
      terminal multiplexing utilities used by administrators to run commands across
      groups of hosts.
  sources:
    - https://github.com/brockgr/csshx/blob/master/README.txt
    - https://github.com/brockgr/csshx/blob/master/csshX
    - https://github.com/brockgr/csshx/releases/tag/0.73
  summary:
    - >
      csshX is a Perl cluster-SSH helper for macOS Terminal.app that opens and
      coordinates SSH sessions across multiple hosts.
  timeline:
    - '2011: Upstream script and README carry copyright for Gavin Brock.'
    - '2011 era: README documents testing on Mac OS X 10.5, 10.6, and 10.7.'
    - '0.73: GitHub repository tags the 0.73 release.'
  usage:
    - >
      csshX reads host clusters from /etc/clusters and loads settings from /etc/csshrc
      and ~/.csshrc, while command-line options add hosts, alternate config files,
      screen placement, ssh arguments, session limits, sorting, and interleaving
      behavior.
related-packages: []
category: developer-tools
package-manager:
  brew: csshx
  macports: csshX
package-manager-url: https://formulae.brew.sh/formula/csshx
license: Artistic-1.0-Perl OR GPL-1.0-or-later
tags:
  - cli
  - cluster-ssh
  - macos
  - ssh
  - terminal-app
description: Cluster ssh tool for Terminal.app
executables:
  - csshX
provenance:
  formula: csshx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
