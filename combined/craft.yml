history:
  adoption-history:
    - >
      Craft expanded from its Apple-platform roots to web, Windows, Android, and
      visionOS experiences. The company cites recognition including the 2021 Mac App of
      the Year award, while its continuing release program has added tasks, calendars,
      collections, AI assistance, and collaboration features.
  package-nerd-significance:
    - >
      The Homebrew cask provides a reproducible installation route for a polished
      proprietary macOS document application. Craft is notable among note-taking
      packages for its native-first design, block-based document model, offline
      capabilities, and expansion into cross-platform collaboration and AI-assisted
      work.
  project-history:
    - >
      Craft was founded by Bálint Orosz and developed as a design-focused document
      editor. It established itself on Apple platforms before expanding its workspace
      model across additional desktop, mobile, web, and spatial-computing platforms.
    - >
      Its core content model organizes information as blocks, nested pages, top-level
      documents, folders, and spaces. Later releases broadened the application into task
      management, calendar workflows, databases, and AI assistance.
  related-projects:
    - >
      Craft officially provides migration guidance for Notion, Obsidian, and Evernote,
      placing it in the modern collaborative notes and personal-knowledge-management
      ecosystem.
  sources:
    - https://support.craft.do/
    - https://support.craft.do/en/introduction
    - https://support.craft.do/en/introduction/documents
    - https://www.craft.do/blog
  summary:
    - >
      Craft is a native-oriented document editor, note-taking application, and
      collaborative workspace built around blocks, nested pages, documents, and spaces.
  timeline:
    - "2021: Craft received Apple's Mac App of the Year award."
    - '2024: Craft documented development of a native Apple Vision Pro application.'
    - >
      2026: Craft continued expanding tasks, calendars, AI assistance, collections,
      Windows support, and agent-oriented features.
  usage:
    - >
      Users create structured documents from blocks and nested pages, organize them into
      folders and spaces, collaborate in real time, manage tasks and daily notes, and
      publish or share finished work.
