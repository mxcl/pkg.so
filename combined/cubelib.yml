id: brew:cubelib
display-name: CubeLib
homepage: https://scalasca.org/software/cube-4.x/download.html
repo: https://gitlab.jsc.fz-juelich.de/perftools/cubelib
docs:
  - https://apps.fz-juelich.de/scalasca/releases/cube/4.9/docs/derived/html/reference.html
  - >
    https://apps.fz-juelich.de/scalasca/releases/cube/4.9/docs/tools-guide/html/userguide.html
  - https://www.scalasca.org/software/cube-4.x/documentation.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Cube 4.x is documented for files produced by Score-P and Scalasca 2.x, while
      retaining backward compatibility with Cube 3.x data. That placement makes CubeLib
      part of the common tooling stack around European HPC performance measurement and
      analysis.
  package-nerd-significance:
    - >
      The Homebrew cubelib formula exposes a large set of specialized HPC command-line
      tools from the Cube suite. It is package-manager-significant because upstream
      distributes Cube as separate component tarballs rather than a single
      monorepo-style source-control project.
  project-history:
    - >
      The Scalasca project describes Cube 4.x as a generic tool for displaying a
      multidimensional performance space with metric, call-path, and system-resource
      dimensions. The download page states that since Cube 4.4 the software has been
      split into CubeW, CubeLib, CubeGUI, and jCubeR packages.
  related-projects:
    - Scalasca, Score-P, CubeGUI, CubeW, jCubeR, TAU performance tools.
  sources:
    - https://www.scalasca.org/software/cube-4.x/download.html
    - https://www.scalasca.org/software/cube-4.x/documentation.html
    - >
      https://apps.fz-juelich.de/scalasca/releases/cube/4.9/docs/tools-guide/html/userguide.html
    - https://apps.fz-juelich.de/scalasca/releases/cube/4.9/docs/derived/html/reference.html
  summary:
    - >
      CubeLib is the C++ library component of Cube 4.x, the Scalasca/Score-P performance
      report explorer and data-format tooling used in high-performance-computing
      performance analysis.
  timeline:
    - '1998: Copyright range on the current Cube 4.x page begins for Forschungszentrum Juelich.'
    - '2012: Cube 4.x paper listed from PARA 2010 proceedings on the official Scalasca page.'
    - 'Cube 4.4: Upstream split Cube into CubeW, CubeLib, CubeGUI, and jCubeR packages.'
    - >
      2025: CubeLib 4.9.x documentation and packages are current on the official
      Scalasca release site.
  usage:
    - >
      CubeLib underlies command-line tools for manipulating and inspecting Cube
      performance reports, including operations such as diff, merge, mean, call-tree
      conversion, metrics derivation, and report dumping.
related-packages:
  - id: brew:otf2
    reason: >
      Use OTF2 alongside CubeLib when a Score-P workflow needs event traces as well as
      Cube profile reports; OTF2 supplies the trace-format library and inspection
      utilities.
    rel: adjacent_workflow
    sources:
      - https://www.vi-hps.org/projects/score-p/documentation/documentation.html
      - https://www.scalasca.org/software/cube-4.x/download.html
category: science
package-manager:
  brew: cubelib
package-manager-url: https://formulae.brew.sh/formula/cubelib
license: BSD-3-Clause
tags:
  - cli
  - command-line-tools
  - cube
  - hpc
  - performance-analysis
  - scalasca
  - score-p
description: Performance report explorer for Scalasca and Score-P
executables:
  - cube3to4
  - cube4to3
  - cube_calltree
  - cube_canonize
  - cube_clean
  - cube_cmp
  - cube_commoncalltree
  - cube_cut
  - cube_derive
  - cube_diff
  - cube_dump
  - cube_exclusify
  - cube_inclusify
  - cube_info
  - cube_is_empty
  - cube_mean
  - cube_merge
  - cube_nodeview
  - cube_part
  - cube_pop_metrics
  - cube_rank
  - cube_regioninfo
  - cube_remap2
  - cube_sanity
  - cube_server
  - cube_stat
  - cube_test
  - cube_topoassist
  - cubelib-config
  - tau2cube
provenance:
  formula: cubelib
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
