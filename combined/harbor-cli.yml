id: brew:harbor-cli
display-name: Harbor CLI
homepage: https://github.com/goharbor/harbor-cli
repo: https://github.com/goharbor/harbor-cli
docs:
  - https://github.com/goharbor/harbor-cli#readme
  - https://goharbor.io/cli-docs
config-file-location:
  unix:
    - $HARBOR_CLI_CONFIG
    - $XDG_CONFIG_HOME/harbor-cli/config.yaml
    - ~/.config/harbor-cli/config.yaml
credentials-file-location:
  unix:
    - $HARBOR_CLI_CONFIG
    - $XDG_CONFIG_HOME/harbor-cli/config.yaml
    - ~/.config/harbor-cli/config.yaml
history:
  adoption-history:
    - >
      Harbor's adoption came from enterprise and cloud-native needs around private
      registries, Kubernetes, Docker image distribution, vulnerability scanning,
      signing, replication, and policy enforcement. CNCF graduation gave the broader
      project a clear governance and ecosystem signal.
    - >
      Harbor CLI adoption follows the automation need: once registry operations are part
      of CI/CD and platform engineering workflows, a package-manager-installable
      `harbor` command is easier to script than a browser session.
  package-nerd-significance:
    - >
      Harbor CLI is package-nerd relevant because it brings a cloud service
      administration surface into local package managers. A small CLI package becomes
      the reproducible interface between laptops, CI runners, and Harbor registries.
    - >
      The package also carries the usual Go CLI concerns: static binaries, shell
      completion, config paths, credential handling, release artifacts, and
      platform-specific bottles or packages.
  project-history:
    - >
      CNCF's Harbor project journey report says Daniel Jiang made Harbor's first commit
      on 2016-02-01, Harbor joined CNCF on 2018-07-31, and it reached graduated status
      on 2020-06-23. The Harbor homepage describes the project as an open source
      registry that secures artifacts with policies, role-based access control,
      scanning, and signing.
    - >
      The Harbor CLI repository history begins in April 2023. Its README defines the CLI
      as an alternative to the Harbor WebUI and as a tool for scripting common
      repeatable Harbor tasks from a workstation or pipeline.
  related-projects:
    - >
      Related projects include Harbor, Docker Distribution, Kubernetes, Helm,
      Notary-style signing workflows, vulnerability scanners, OCI artifacts, and CNCF
      cloud-native tooling.
    - >
      The CLI is also adjacent to API automation and CI/CD systems that need
      non-interactive registry administration.
  sources:
    - https://github.com/goharbor/harbor-cli
    - https://goharbor.io/
    - https://goharbor.io/cli-docs/
    - https://www.cncf.io/reports/harbor-project-journey-report/
  summary:
    - >
      Harbor CLI is the command-line companion for Harbor, the CNCF graduated registry
      used to secure and manage container images and other artifacts. The CLI's history
      is best understood as part of Harbor's move from a registry server with a web UI
      and APIs into scriptable cloud-native operations.
  timeline:
    - '2016-02-01: CNCF reports the first Harbor commit.'
    - '2018-07-31: Harbor joins CNCF.'
    - '2020-06-23: Harbor reaches CNCF graduated status.'
    - '2023-04-23: Harbor CLI repository history begins with an initial commit.'
    - '2024-10-29: Official git tag history includes v0.0.1-era release pipeline work.'
  usage:
    - >
      The CLI manages Harbor resources such as projects, repositories, artifacts,
      labels, tags, quotas, webhooks, robot accounts, users, registries, replication,
      scanners, schedules, health, and CLI config.
    - >
      It stores configuration and login-related material under the Harbor CLI config
      location, with environment variables available for containerized or scripted use.
related-packages:
  - id: brew:docker
    reason: >
      Docker is the standard adjacent client for logging into Harbor and pushing or
      pulling the container images that Harbor stores and governs.
    rel: adjacent_workflow
    sources:
      - https://goharbor.io/docs/main/administration/configure-authentication/oidc-auth/
      - https://docs.docker.com/reference/cli/docker/
  - id: brew:oras
    reason: >
      ORAS complements Harbor CLI by pushing, pulling, and managing arbitrary OCI
      artifacts stored in Harbor repositories.
    rel: adjacent_workflow
    sources:
      - https://goharbor.io/blog/harbor-as-universal-oci-hub/
      - https://oras.land/docs/commands/oras_pull/
  - id: brew:helm
    reason: >
      Helm works with Harbor's OCI registry to package, push, pull, and install Helm
      charts while Harbor CLI administers the surrounding projects and repositories.
    rel: adjacent_workflow
    sources:
      - https://goharbor.io/docs/edge/working-with-projects/working-with-oci/
      - https://helm.sh/docs/topics/registries/
  - id: brew:cosign
    reason: >
      Cosign signs OCI artifacts and uploads their signatures to Harbor, where Harbor
      associates and governs the signatures alongside the source artifacts.
    rel: adjacent_workflow
    sources:
      - https://goharbor.io/docs/main/working-with-projects/working-with-images/sign-images/
      - https://docs.sigstore.dev/cosign/
category: cloud-infrastructure
package-manager:
  brew: harbor-cli
  nix: harbor-cli
  winget: GoHarbor.Harbor
  zypper: harbor-cli
package-manager-url: https://formulae.brew.sh/formula/harbor-cli
license: Apache-2.0
tags:
  - cli
  - cncf
  - container-registry
  - go
  - harbor
description: CLI for Harbor container registry
executables:
  - harbor
provenance:
  formula: harbor-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
