id: brew:fabric-installer
display-name: Fabric Installer
homepage: https://fabricmc.net/
repo: https://github.com/FabricMC/fabric-installer
docs:
  - https://docs.fabricmc.net/players/installing-fabric
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption follows Fabric's adoption among Minecraft mod users. The official
      docs present OS-specific install guides for Windows, macOS, and Linux and make
      clear that the guide targets the official Minecraft Launcher, leaving third-party
      launchers to their own documentation.
  package-nerd-significance:
    - >
      Fabric Installer is package-nerd interesting because it is an installer packaged
      as a package: the formula does not install the mod loader directly, it installs
      the official tool that writes launcher configuration. That distinction matters for
      Minecraft tooling, where launchers, loaders, APIs, and mods are separate moving
      parts.
  project-history:
    - >
      Fabric Installer is a small companion project in the FabricMC ecosystem. The
      repository README describes it simply as an installer for Fabric, while the
      official player documentation uses it as the path for installing Fabric with the
      official Minecraft Launcher.
    - >
      The installer exists because Fabric itself is an ecosystem rather than one
      package: users need Java, the Fabric Loader, the Fabric API for many mods, and
      launcher profiles that select the right Minecraft and loader versions. The
      installer packages that setup step into a desktop or command-line tool.
  related-projects:
    - Fabric Loader is the runtime loaded by Minecraft.
    - Fabric API is the common mod API used by many Fabric mods.
    - Fabric Loom is the Gradle tooling used by mod developers.
  sources:
    - https://api.github.com/repos/FabricMC/fabric-installer
    - https://github.com/FabricMC/fabric-installer
    - https://github.com/FabricMC/fabric-installer/blob/master/README.md
    - https://docs.fabricmc.net/players/installing-fabric
    - https://fabricmc.net/
  summary:
    - >
      Fabric Installer is the official installer used to add the Fabric mod loader
      profile to Minecraft launchers.
  timeline:
    - '2019: The Fabric Installer repository is created.'
    - >
      2026: Official Fabric docs continue to document the installer for Windows, macOS,
      and Linux player setup.
  usage:
    - >
      Players use Fabric Installer to create or update a launcher profile for a chosen
      Minecraft version and Fabric Loader version. In package-manager contexts, it is
      useful as a reproducible way to launch the same installer without manually
      downloading a jar from the website.
related-packages: []
category: games
package-manager:
  brew: fabric-installer
  nix: fabric-installer
  winget: FabricMC.FabricInstaller
package-manager-url: https://formulae.brew.sh/formula/fabric-installer
license: Apache-2.0
tags:
  - cli
  - fabric
  - installer
  - java
  - minecraft
  - modding
description: Installer for Fabric for the vanilla launcher
executables:
  - fabric-installer
provenance:
  formula: fabric-installer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
