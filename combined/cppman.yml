id: brew:cppman
display-name: cppman
homepage: https://github.com/aitjcize/cppman
repo: https://github.com/aitjcize/cppman
docs:
  - https://github.com/aitjcize/cppman#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/cppman/cppman.cfg
    - ~/.config/cppman/cppman.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream documents installation through PyPI, Arch Linux AUR, Debian and Ubuntu,
      Homebrew, and MacPorts, showing broad package-manager adoption for a small
      documentation utility.
  package-nerd-significance:
    - >
      cppman appeals to package users because it turns web-first C++ references into
      local terminal documentation, a familiar Unix packaging pattern for developers who
      want offline or shell-native lookup.
  project-history:
    - >
      The upstream README notes that the project was renamed from manpages-cpp to cppman
      on September 19, 2012. It presents cppman as a command-line interface for C++
      reference pages with a man-like workflow.
  related-projects:
    - >
      The tool depends on cplusplus.com and cppreference.com as content backends and is
      conceptually related to the system man command.
  sources:
    - https://github.com/aitjcize/cppman#readme
    - https://pypi.org/project/cppman/
  summary:
    - >
      cppman provides C++ manual pages for Unix-like systems, sourcing reference
      material from cplusplus.com and cppreference.com.
  timeline:
    - '2012-09-19: manpages-cpp was renamed to cppman.'
    - >
      Current packaging: Upstream README documents PyPI, AUR, Debian/Ubuntu, Homebrew,
      and MacPorts installation paths.
  usage:
    - >
      cppman supports cplusplus.com and cppreference.com backends, syntax highlighting,
      hyperlink navigation in vim pager mode, and an option to expose cached pages to
      the system man command.
related-packages: []
category: developer-tools
package-manager:
  brew: cppman
  debian: cppman
  macports: cppman
  nix: cppman
  ubuntu: cppman
package-manager-url: https://formulae.brew.sh/formula/cppman
license: GPL-3.0-or-later
tags:
  - c-plus-plus
  - cli
  - documentation
  - manual-pages
  - reference
description: C++ manual pages from cplusplus.com and cppreference.com
executables:
  - cppman
provenance:
  formula: cppman
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
