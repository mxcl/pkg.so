id: brew:gerrit-tools
display-name: gerrit-tools
homepage: https://github.com/indirect/gerrit-tools
repo: https://github.com/indirect/gerrit-tools
docs:
  - https://github.com/indirect/gerrit-tools#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project appears to have served a small Gerrit-using developer audience rather
      than a broad tool ecosystem. Its value was in codifying a workflow around Gerrit
      changesets at a time when teams often carried local helper scripts for review
      operations.
  package-nerd-significance:
    - >
      For package-manager users, gerrit-tools is interesting as a tiny workflow package:
      it wraps project-specific Gerrit review habits into installable scripts, useful
      for developers who still encounter older Gerrit review flows.
  project-history:
    - >
      The GitHub repository was opened in January 2010 and its README presents the
      project as scripts that make Gerrit-based code review easier. The scripts reflect
      early Gerrit workflows, including a cherry-pick helper, a setup helper for
      repositories cloned from GitHub, and a `git review` wrapper.
  related-projects:
    - Gerrit Code Review, Git
  sources:
    - https://api.github.com/repos/indirect/gerrit-tools
    - https://github.com/indirect/gerrit-tools
    - https://raw.githubusercontent.com/indirect/gerrit-tools/master/README.md
  summary:
    - >
      gerrit-tools is a small collection of command-line scripts for developers working
      with Gerrit Code Review. Its scope is narrow: help developers set up a Gerrit
      remote, fetch changes for review, push changes, approve changes, and reset their
      review workflow.
  timeline:
    - '2010: The gerrit-tools repository was opened on GitHub.'
    - >
      2010s: The README documents scripts for Gerrit cherry-picking, remote setup,
      review, approval, and reset workflows.
    - >
      2020: Official GitHub metadata shows the repository still receiving
      maintenance-era activity.
  usage:
    - >
      Practitioners use `gerrit-setup` to convert a GitHub-origin clone to use Gerrit as
      the origin, and `git review` to push a changeset, review another changeset by
      number, approve after tests, or reset local review state. The README also suggests
      aliasing the review command for faster use.
related-packages:
  - id: brew:git
    reason: >
      Git is the underlying version-control tool manipulated by gerrit-tools when it
      changes remotes, fetches review patches, and pushes Gerrit changesets.
    rel: adjacent_workflow
    sources:
      - https://github.com/indirect/gerrit-tools#readme
      - https://git-scm.com/docs
category: developer-tools
package-manager:
  brew: gerrit-tools
package-manager-url: https://formulae.brew.sh/formula/gerrit-tools
license: Apache-2.0
tags:
  - automation
  - cli
  - code-review
  - gerrit
  - git
  - workflow
description: Tools to ease Gerrit code review
executables:
  - gerrit-setup
provenance:
  formula: gerrit-tools
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
