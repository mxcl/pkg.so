id: brew:git-mediate
display-name: git-mediate
homepage: https://github.com/Peaker/git-mediate
repo: https://github.com/Peaker/git-mediate
docs:
  - https://github.com/Peaker/git-mediate#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-mediate is a niche but well-sourced conflict-resolution utility. Its README
      lists installation through Homebrew, Debian packages, Arch's AUR, Haskell Stack,
      and source builds, while the changelog notes its Debian unstable entry in July
      2023.
  package-nerd-significance:
    - >
      git-mediate is package-nerd interesting because it embraces Git's existing
      conflict-marker formats instead of inventing a new merge UI. It is small,
      scriptable, and distributed through both Haskell and operating-system package
      channels.
  project-history:
    - >
      Eyal Lotem began the project in December 2014 under the name
      resolve-trivial-conflicts. The changelog records early work on conflict display,
      terminal color handling, modify/delete conflicts, add/add conflicts, and diff2
      output.
    - >
      In December 2016 the project was renamed to git-mediate, reached version 1.0, and
      received its first Hackage release. Later releases added Windows compatibility
      fixes, a `--merge-file` option, line-ending handling, nested-conflict parsing
      fixes, zdiff3 awareness, and editor improvements.
  related-projects:
    - >
      git-mediate relates to Git's merge conflict styles, especially diff3 and zdiff3.
      It complements visual merge tools and Git rerere by helping after a user has made
      a conflict simple enough to resolve mechanically.
  sources:
    - https://api.github.com/repos/Peaker/git-mediate
    - https://formulae.brew.sh/formula/git-mediate
    - https://github.com/Peaker/git-mediate#readme
    - https://github.com/Peaker/git-mediate/blob/master/ChangeLog.md
    - https://hackage.haskell.org/package/git-mediate
  summary:
    - >
      git-mediate is a Haskell Git helper for resolving merge conflicts that have become
      mechanically trivial. It is built around Git's diff3 and zdiff3 conflict styles,
      where the base version is visible alongside both sides of a conflict.
  timeline:
    - '2014: Development started as resolve-trivial-conflicts.'
    - '2014: v0.2 added remaining-conflict display.'
    - '2016: Renamed to git-mediate and released on Hackage.'
    - '2023: Debian unstable packaging appeared.'
    - '2024: v1.1.0 added split-marker and line-added-around options.'
  usage:
    - >
      Practitioners first configure Git to use diff3 or zdiff3 conflict style, then
      manually make simple changes across the conflict sections. Running `git-mediate`
      detects conflicts where one side can be selected or where markers have been
      removed, resolves what it can, and runs `git add` for files with all conflicts
      resolved.
    - >
      The `-d` flag displays conflict diffs from the base, and `-e` opens an editor for
      conflicted files that cannot be resolved automatically. This makes the tool useful
      during manual conflict cleanup rather than as a full merge driver replacement.
related-packages:
  - id: brew:git
    reason: >
      Git generates the diff3 or zdiff3 conflict markers that git-mediate simplifies and
      provides rerere when resolved conflicts should be reused later.
    rel: adjacent_workflow
    sources:
      - https://github.com/Peaker/git-mediate
      - https://git-scm.com/docs/git-merge
      - https://git-scm.com/docs/git-rerere
category: developer-tools
