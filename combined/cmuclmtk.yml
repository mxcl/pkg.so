id: brew:cmuclmtk
display-name: CMUCLMTK
homepage: https://cmusphinx.sourceforge.net/
repo: https://svn.code.sf.net/p/cmusphinx/code/trunk/cmuclmtk
docs:
  - https://cmusphinx.github.io/wiki/cmuclmtkdevelopment
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The 1997 paper reported use in more than 40 academic, government, and industrial
      laboratories in more than 12 countries. In package-manager culture it survives as
      a niche speech/NLP utility: this batch input records Homebrew, MacPorts, and
      openSUSE/zypper package names.
  package-nerd-significance:
    - >
      Package nerds care because it is a fossilized but useful research-toolchain
      package: old speech-recognition infrastructure, many tiny command-line filters,
      and CMUSphinx lineage preserved in modern package managers long after the research
      ecosystem moved toward newer language-modeling tools.
  project-history:
    - >
      Roni Rosenfeld released version 1 of the CMU Statistical Language Modeling Toolkit
      in 1994, and Philip Clarkson and Rosenfeld published the CMU-Cambridge toolkit
      paper in 1997 describing version 2. CMUSphinx later kept the toolkit in its
      Subversion tree, with CMUSphinx documentation noting that no official toolkit
      release had appeared since the Cambridge release and that a planned CMUSphinx
      release would effectively be version 2.1.
  related-projects:
    - >
      CMUSphinx and PocketSphinx are the speech-recognition projects around which this
      toolkit is distributed.
    - >
      SRILM is a later, widely cited language-modeling toolkit in the same n-gram
      research-tooling family.
  sources:
    - https://www.cs.cmu.edu/~dorcas/toolkit_documentation.html
    - https://www.isca-archive.org/eurospeech_1997/clarkson97_eurospeech.html
    - https://cmusphinx.github.io/wiki/cmuclmtkdevelopment
  summary:
    - >
      CMUCLMTK is the CMU-Cambridge statistical language modeling toolkit as carried in
      the CMUSphinx tree: a set of Unix-style tools for building word-frequency lists,
      vocabularies, n-gram counts, and backoff bigram/trigram language models for
      speech-recognition workflows.
  timeline:
    - '1994: Version 1 of the CMU SLM Toolkit was released.'
    - '1997: Clarkson and Rosenfeld published the CMU-Cambridge toolkit paper for version 2.'
    - >
      CMUSphinx era: The toolkit was maintained under the CMUSphinx Subversion tree with
      planned version 2.1 work.
  usage:
    - >
      Typical use is a pipeline of small commands such as text2wfreq, wfreq2vocab,
      text2idngram, idngram2lm, evallm, lm_combine, and lm_interpolate to turn text
      corpora into n-gram language models and evaluate or combine them.
related-packages:
  - id: brew:cmu-pocketsphinx
    reason: >
      PocketSphinx can use the ARPA n-gram language models that CMUCLMTK builds from
      normalized text, completing the model-training-to-recognition workflow documented
      by CMUSphinx.
    rel: adjacent_workflow
    sources:
      - https://cmusphinx.github.io/wiki/tutoriallm/
      - https://www.cs.cmu.edu/~dorcas/toolkit_documentation.html
      - https://github.com/cmusphinx/pocketsphinx#readme
category: ai
package-manager:
  brew: cmuclmtk
  macports: cmuclmtk
  zypper: cmuclmtk
package-manager-url: https://formulae.brew.sh/formula/cmuclmtk
license: BSD-2-Clause
tags:
  - ai
  - cli
  - cmusphinx
  - language-modeling
  - ngram
  - speech-recognition
  - toolkit
description: Language model tools (from CMU Sphinx)
executables:
  - evallm
  - idngram2lm
  - idngram2stats
  - lm_combine
  - lm_interpolate
  - mergeidngram
  - ngram2mgram
  - text2idngram
  - text2wfreq
  - text2wngram
  - wfreq2vocab
  - wngram2idngram
provenance:
  formula: cmuclmtk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
