id: brew:akku
display-name: Akku.scm
homepage: https://akkuscm.org/
repo: https://gitlab.com/akkuscm/akku
docs:
  - https://akkuscm.org/docs/manpage.html
  - https://akkuscm.org/
  - https://gitlab.com/akkuscm/akku/wikis/home
config-file-location:
  unix:
    - Akku.manifest
    - Akku.lock
    - .akkuignore
    - ~/.local/share/akku/keys.d/
    - ~/.local/share/akku/index.db
    - ~/.cache/akku
credentials-file-location: null
history:
  adoption-history:
    - >
      Akku serves a niche but real Scheme packaging audience. The README documents
      support for GNU/Linux, macOS, FreeBSD, Cygwin, OpenBSD, and MSYS2, and lists many
      Scheme implementations whose load paths can be populated from an Akku project.
    - >
      Release notes show the project expanding beyond a basic R6RS manager: v0.5.0 began
      mirroring R7RS libraries from Snow, v1.0.0 moved release builds to autotools for
      portability, and v1.1.0 added features aimed at system package managers such as
      dpkg and rpm.
  package-nerd-significance:
    - >
      Akku is package-nerd catnip because it applies familiar package-manager machinery
      to Scheme, a language family with many implementations and historically fragmented
      library paths.
    - >
      The lockfile, signed index keys, local cache, R7RS-to-R6RS translation, and
      system-package-manager features make it more than a downloader. It is an attempt
      to bridge language packages, implementation compatibility, and OS packaging.
  project-history:
    - >
      The GitLab project metadata dates the public repository to June 2018, while the
      release stream documented by GitLab includes earlier tagged releases and the 1.0
      series in 2019. The manpage credits Akku's dependency solver lineage to Andreas
      Rottmann's dorodango, an earlier R6RS package manager whose solver was ported from
      aptitude.
    - >
      Akku's early design centered on making portable Scheme code behave more like
      modern language-package ecosystems: projects declare direct dependencies in
      `Akku.manifest`, lock exact transitive dependency sources in `Akku.lock`, and
      activate an `.akku/env` shell where installed libraries and programs are placed on
      the right paths.
  related-projects:
    - "dorodango: earlier R6RS package manager that supplied Akku's dependency solver lineage."
    - 'aptitude: Debian package manager whose solver is part of that lineage.'
    - 'Snow: R7RS library source mirrored by Akku beginning with the v0.5.0 release.'
  sources:
    - https://akkuscm.org/docs/manpage.html
    - https://gitlab.com/akkuscm/akku
    - https://gitlab.com/akkuscm/akku/-/raw/master/NEWS.md
    - https://gitlab.com/akkuscm/akku/-/raw/master/README.md
    - https://gitlab.com/api/v4/projects/akkuscm%2Fakku
    - https://gitlab.com/api/v4/projects/akkuscm%2Fakku/releases
  summary:
    - >
      Akku.scm is a project-based package manager for R6RS and R7RS Scheme. It gives
      Scheme projects a manifest, a lockfile, a local dependency environment, package
      publishing, and an index of portable Scheme libraries.
  timeline:
    - '2018: Public GitLab project metadata records the Akku repository.'
    - '2018: v0.3.0 appears in the GitLab release list.'
    - '2019: v0.5.0 begins mirroring R7RS libraries from Snow.'
    - '2019: v1.0.0 introduces autotools-based release builds.'
    - '2021: v1.1.0 adds features for system package manager workflows.'
  usage:
    - >
      Typical use is `akku init`, `akku list`, `akku install <pkg>`, then `.akku/env` to
      run in an environment where Scheme libraries and programs from the project are
      visible. Existing projects can add `Akku.manifest` and `Akku.lock` without
      starting from a template.
    - >
      For publishing, Akku can scan packages, solve dependencies, verify signed package
      index data, and create package metadata. The manpage recommends committing both
      the manifest and lockfile for repeatable development.
related-packages:
  - id: brew:chezscheme
    reason: >
      Choose Chez Scheme as a high-performance R6RS runtime for Akku projects; Akku
      itself can run on Chez Scheme and installs libraries into its load path.
    rel: adjacent_workflow
    sources:
      - https://gitlab.com/akkuscm/akku/-/raw/master/README.md
      - https://cisco.github.io/ChezScheme/
  - id: brew:guile
    reason: >
      GNU Guile can run Akku and consume its installed R6RS libraries, making it a
      practical runtime for Akku-managed projects that also need Guile's GNU ecosystem
      integration.
    rel: adjacent_workflow
    sources:
      - https://gitlab.com/akkuscm/akku/-/raw/master/README.md
      - https://www.gnu.org/software/guile/
category: developer-tools
package-manager:
  brew: akku
package-manager-url: https://formulae.brew.sh/formula/akku
license: GPL-3.0-or-later
