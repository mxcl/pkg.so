id: brew:cargo-insta
display-name: Cargo Insta
homepage: https://insta.rs
repo: https://github.com/mitsuhiko/insta
docs:
  - https://insta.rs/docs
  - https://insta.rs/docs/cli
  - https://insta.rs/docs/settings
config-file-location:
  unix:
    - $CARGO_WORKSPACE/.config/insta.yaml
    - $CARGO_WORKSPACE/insta.yaml
    - $CARGO_WORKSPACE/.insta.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Insta became a familiar Rust testing tool for projects that need readable diffs
      for large structured outputs, CLI output, serializers, generated code, and UI-like
      text fixtures.
    - >
      cargo-insta's adoption follows from the review workflow: once snapshots are part
      of tests, maintainers need a convenient way to inspect pending changes, accept
      intended updates, reject regressions, and run checks in CI.
  package-nerd-significance:
    - >
      cargo-insta is package-nerd significant because it packages a whole testing
      workflow, not just an assertion macro. The CLI, file formats, review commands,
      settings, and editor extension together make snapshot testing feel native to Rust
      package maintenance.
    - >
      It also reflects a broader trend in developer tooling: tests increasingly produce
      reviewable artifacts, and package-manager subcommands become the interface for
      accepting those artifacts into the repository.
  project-history:
    - >
      The Insta repository was created in January 2019, and the cargo-insta crate was
      first published that same month. The project combines a Rust testing library, a
      Cargo subcommand, website documentation, and editor support.
    - >
      The README positions snapshot tests as approval-style tests that compare complex
      or frequently changing values against stored reference snapshots. It also notes
      that inline snapshots are handled through the companion cargo-insta tool.
    - >
      The changelog documents both insta and cargo-insta together, showing the CLI
      evolving with snapshot review, nextest integration, non-interactive review modes,
      diff tooling, pending snapshot handling, and CI behavior.
  related-projects:
    - insta is the Rust snapshot testing library that cargo-insta supports.
    - >
      similar and similar-asserts are related diffing projects by the same author,
      mentioned in the Insta README.
    - >
      cargo-nextest is integrated into cargo-insta test workflows according to the
      changelog and CLI options.
  sources:
    - https://api.github.com/repos/mitsuhiko/insta
    - https://crates.io/crates/cargo-insta
    - https://github.com/mitsuhiko/insta#readme
    - https://github.com/mitsuhiko/insta/blob/master/CHANGELOG.md
    - https://insta.rs/docs/cli/
    - https://insta.rs/docs/settings/
  summary:
    - >
      Cargo Insta is the command-line companion to Insta, Armin Ronacher's snapshot
      testing library for Rust. It helps developers review, accept, reject, and update
      snapshot changes from Cargo workflows.
    - >
      The CLI is not required for every snapshot test, but the official docs say it is
      required for inline snapshots and useful for snapshot review.
  timeline:
    - '2019-01-13: Insta GitHub repository created.'
    - '2019-01-18: cargo-insta 0.2.0 first published to crates.io.'
    - >
      2020s: Project adds inline snapshots, review tooling, settings, VS Code support,
      and nextest-aware workflows.
    - >
      2026: cargo-insta 1.48.0 changelog includes CI behavior, snapshot filtering, and
      review workflow fixes; crate exceeds 1.4 million downloads.
  usage:
    - >
      The official CLI docs describe `cargo insta review`, `accept`, `reject`,
      `pending-snapshots`, and `test`. The common loop is to run tests, inspect
      generated pending snapshots, and then accept or reject changes.
    - >
      Configuration is workspace-local through `insta.yaml`; the docs say cargo-insta
      loads this config from the workspace to influence behavior, with settings
      documented on the official site.
related-packages:
  - id: brew:cargo-nextest
    reason: >
      Cargo Insta officially supports nextest as the runner for snapshot test execution;
      choose it when the project wants nextest's faster, configurable Rust test workflow
      before reviewing snapshots with Cargo Insta.
    rel: adjacent_workflow
    sources:
      - https://insta.rs/docs/cli/
      - https://insta.rs/docs/settings/
      - https://nexte.st/docs/
category: developer-tools
package-manager:
  apk: cargo-insta
  brew: cargo-insta
  dnf: cargo-insta
  nix: cargo-insta
  pacman: cargo-insta
package-manager-url: https://formulae.brew.sh/formula/cargo-insta
license: Apache-2.0
tags:
  - cargo
  - cli
  - rust
  - snapshot-testing
  - testing
description: Snapshot testing CLI for Rust
executables:
  - cargo-insta
provenance:
  formula: cargo-insta
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
