id: brew:icon
display-name: Icon
homepage: https://www2.cs.arizona.edu/icon/
repo: https://github.com/gtownsend/icon
docs:
  - https://www2.cs.arizona.edu/icon
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Icon never became a mainstream systems language, but it earned a lasting niche
      among language designers, text-processing users, and people studying generators,
      coroutines, and goal-directed evaluation. The official FAQ describes it as useful
      for software tools, text processing, research, experiments, one-shot programs, and
      complex applications.
    - >
      Its documentation culture is unusually rich for an older language package:
      public-domain books, implementation notes, release documentation, a program
      library, newsletters, and web-hosted historical material remain available through
      the Arizona site.
    - >
      Package-manager adoption keeps Icon buildable from a shell without requiring users
      to fetch archived university distribution files manually. Homebrew builds the Unix
      implementation and installs the icon, icont, and iconx commands.
  package-nerd-significance:
    - >
      Icon is package-nerd catnip because it is both an installable Unix command and a
      preserved programming-language artifact. A tiny formula gives access to a language
      with a direct lineage from SNOBOL and a documented influence on later generator
      and coroutine thinking.
    - >
      It is also a reminder that package repositories are cultural archives. Installing
      brew install icon is not only installing a compiler/interpreter; it is keeping an
      older research language executable on newer Unix-like systems.
  project-history:
    - >
      Icon was first released in 1979 as a successor to SNOBOL4. The Arizona Icon site
      places it in a lineage of high-level languages for strings and structures: SNOBOL
      at Bell Telephone Laboratories, SNOBOL4, then later University of Arizona
      languages supported in part by the National Science Foundation.
    - >
      The Icon Project was supported by the University of Arizona Department of Computer
      Science. Its implementations were built by faculty, staff, students, and outside
      volunteers, with Gregg Townsend maintaining the Unix implementation and website
      after the language entered maintenance mode.
    - >
      The language continued to evolve for roughly two decades after its first release.
      The official site says formal development has been frozen, but the Unix
      implementation remains in use and is maintained when necessary.
  related-projects:
    - >
      Related projects and predecessors include SNOBOL, SNOBOL4, SL5, the Icon Program
      Library, Jcon, the native Windows implementation, and Unicon, an object-oriented
      language based on Icon.
  sources:
    - >
      Homebrew formula metadata documents the packaged Unix commands and source archive
      used for installation.
    - >
      The Icon FAQ documents the language's features, use cases, project organization,
      lineage, maintenance mode, and relationship to Unicon.
    - >
      The University of Arizona Icon site provides the language origin, release year,
      maintenance status, documentation set, and implementation notes.
  summary:
    - >
      Icon is a high-level general-purpose programming language from the University of
      Arizona tradition, known for string scanning, goal-directed evaluation,
      generators, backtracking, automatic storage management, and a compact command-line
      implementation.
  timeline:
    - 'Early 1960s: SNOBOL is developed at Bell Telephone Laboratories.'
    - '1979: Icon is first released as a modern successor to SNOBOL4.'
    - '1986: The Implementation of the Icon Programming Language is published.'
    - >
      1993: Ralph and Madge Griswold publish a History of the Icon Programming Language
      for HOPL-II.
    - '1996: The Icon Programming Language, third edition, is published.'
    - '1998: Graphics Programming in Icon is published.'
    - '2022: The official FAQ records Icon as maintained in maintenance mode.'
  usage:
    - >
      The Homebrew package exposes the command-line pieces of the Unix implementation:
      icon, icont, and iconx. Users write Icon programs with external editors and run
      them from a command shell rather than through an IDE.
    - >
      The official FAQ frames the language around high-level string and data-structure
      work, programmer productivity, sets, tables, lists, records, arbitrary-precision
      integers, co-expressions, graphics facilities, and a program library with
      contributed examples.
related-packages:
  - id: brew:snobol4
    reason: >
      CSNOBOL4 is the historically direct alternative for classic pattern-driven string
      processing, while Icon adds structured data, generators, and goal-directed
      evaluation as its successor.
    rel: alternative
    sources:
      - https://www2.cs.arizona.edu/icon/
      - https://www2.cs.arizona.edu/icon/uguide/faq.htm
      - https://www.regressive.org/snobol4/
