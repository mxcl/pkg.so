id: cask:glean
display-name: Glean for Desktop
homepage: https://www.glean.com/glean-for-desktop
repo: null
docs:
  - https://docs.glean.com/
  - https://docs.glean.com/get-started/golive/deploy-apps
  - https://docs.glean.com/user-guide/apps/chat-first-experience
config-file-location:
  macos: ~/Library/Preferences/com.glean.desktop.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Glean expanded from permission-aware enterprise search into a broader Work AI
      platform incorporating conversational assistance, agents, meeting support, and
      workflow automation. Its desktop application is one of several access surfaces
      alongside the web app, browser extensions, mobile apps, and integrations.
    - >
      Glean's deployment guidance recommends organization-managed rollout of its
      applications and browser extension to reduce access friction and encourage
      habitual use across a workforce.
  package-nerd-significance:
    - >
      The Homebrew cask makes the proprietary desktop client easier to deploy
      consistently on managed Macs. The package is notable as a native access layer for
      a cloud service whose usefulness depends on an organization's configured identity,
      permissions, and enterprise-data connectors.
  project-history:
    - >
      Glean was founded in 2018 by former Google search engineers and other industry
      veterans to make fragmented workplace information searchable through a
      permission-aware enterprise index.
    - >
      The product subsequently developed into an enterprise AI assistant and Work AI
      platform. Glean for Desktop brings its search, chat, meeting notes, screenshot
      context, and agents into a native desktop workflow.
  related-projects:
    - Glean web application.
    - Glean browser extensions.
    - Glean mobile applications.
    - Glean developer APIs and SDKs.
  sources:
    - 'Desktop deployment guide: https://docs.glean.com/get-started/golive/deploy-apps'
    - 'Glean About page: https://www.glean.com/about'
    - 'Glean documentation: https://docs.glean.com/'
    - 'Glean for Desktop: https://www.glean.com/glean-for-desktop'
    - 'Official Glean history article: https://www.glean.com/blog/ai-coworker-for-enterprises'
  summary:
    - >
      Glean for Desktop is the native desktop client for Glean's enterprise-search and
      Work AI service. It gives employees quick access to permission-aware workplace
      search, AI chat, agents, meeting notes, and contextual assistance.
  timeline:
    - '2018: Glean was founded to build permission-aware enterprise search.'
    - >
      2020s: Glean broadened its product from enterprise search into an AI assistant and
      Work AI platform.
    - >
      2026: The desktop product is positioned as an AI coworker with quick chat, meeting
      notes, screenshot context, and agent access.
  usage:
    - >
      Users sign in through an organization-provisioned Glean workspace and invoke
      search or chat from the desktop application, commonly through a configurable
      global keyboard shortcut. Administrators can deploy the macOS application to
      managed devices.
    - >
      The desktop client can capture meeting notes, provide a floating Quick Chat
      window, accept screenshots as context, and invoke Glean search, assistant, or
      agent capabilities without switching to a browser.
category: productivity
