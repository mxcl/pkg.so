id: brew:sapling
display-name: Sapling
homepage: https://sapling-scm.com
repo: https://github.com/meta/sapling
docs:
  - https://sapling-scm.com/docs/commands/config
  - https://sapling-scm.com/docs/introduction
  - https://sapling-scm.com/docs/introduction/getting-started
config-file-location:
  linux:
    - ~/.config/sapling/sapling.conf
    - $XDG_CONFIG_HOME/sapling/sapling.conf
  macos: ~/Library/Preferences/sapling/sapling.conf
  windows: '%APPDATA%\sapling\sapling.conf'
credentials-file-location: null
history:
  - >
    Sapling is Meta's source-control client for large repositories. Meta's launch
    article says the company spent ten years building it before open-sourcing the client
    in 2022, and the Sapling docs describe the original motivation as making Meta's
    monorepo scale under engineering growth that public source-control systems could not
    handle at that size.
  - >
    The project began as an extension or variant of Mercurial, then diverged into a
    separate system with new storage formats, wire protocols, algorithms, and behaviors.
    Its own documentation still explains the lineage by comparing Sapling with both Git
    and Mercurial: it remains distributed and commit-graph based, but it avoids named
    local branches as the main unit of work, has no staging area, fetches some data on
    demand, records commit mutation history, and treats stacked-commit editing as a
    first-class workflow.
  - >
    Sapling's ecosystem role is unusual: it is both an internal-scale SCM system and a
    Git-compatible client for public hosting workflows. Meta describes it as used for
    its large monorepo, while the open client can clone and interact with Git
    repositories and GitHub. The companion ReviewStack demo shows the intended workflow
    bias: engineers work in stacks of commits, submit each commit for review, and use a
    UI designed to make overlapping pull requests easier to inspect.
  - >
    Practitioners use the `sl` command as a Git-adjacent daily driver: clone, commit,
    amend, rebase, navigate a smartlog, repair mistakes with explicit undo commands, and
    submit GitHub pull requests from a stack. Packaging reflects that hybrid position.
    Homebrew ships `sapling` as a source-control client with dependencies such as
    Python, Rust, Node, OpenSSL, libssh2, and GitHub CLI support, while the executable
    name `sl` can conflict with the older novelty `sl` package in several package
    ecosystems.
category: developer-tools
package-manager:
  apk: sl
  brew: sapling
  debian: sl
  dnf: sl
  macports: sl
  nix: sapling
  pacman: sl
  scoop: main/sapling
  ubuntu: sl
  winget: ScaryRawr.SL
  zypper: sl
package-manager-url: https://formulae.brew.sh/formula/sapling
license: GPL-2.0-or-later
tags:
  - cli
  - git
  - mercurial
  - scm
  - source-control
  - version-control
description: Source control client
executables:
  - sl
provenance:
  formula: sapling
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
