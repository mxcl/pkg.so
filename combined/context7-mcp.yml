id: brew:context7-mcp
display-name: Context7 MCP
homepage: https://context7.com
repo: https://github.com/upstash/context7
docs:
  - https://context7.com/docs
  - https://github.com/upstash/context7#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Context7 grew with the MCP and AI-editor packaging wave. Official docs and the
      README document setup paths for MCP clients, CLI-plus-skill workflows, and
      multiple editor integrations, while package metadata shows distribution through
      npm and the input package facts record Homebrew and Nix packaging.
  package-nerd-significance:
    - >
      The formula is notable because it packages an MCP server, not a traditional
      standalone Unix tool. It reflects a newer class of developer-tool packages whose
      main job is to bridge local editors and remote documentation indexes.
  project-history:
    - >
      The public Context7 repository was created in March 2025 and describes itself as
      the source for the MCP server, while noting that supporting backend, parsing, and
      crawling components are private. The `@upstash/context7-mcp` npm package followed
      in April 2025; a separate `ctx7` CLI package appeared in January 2026.
  related-projects:
    - >
      The README lists related official packages including `ctx7`,
      `@upstash/context7-sdk`, and Context7 tools for the Vercel AI SDK.
  sources:
    - https://context7.com/docs
    - https://github.com/upstash/context7
    - https://www.npmjs.com/package/@upstash/context7-mcp
    - https://www.npmjs.com/package/ctx7
    - https://github.com/upstash/context7/releases/tag/%40upstash/context7-mcp%403.2.2
    - https://formulae.brew.sh/formula/context7-mcp
  summary:
    - >
      Context7 MCP is Upstash's Model Context Protocol server for giving AI coding
      agents current, version-specific library documentation at prompt time.
  timeline:
    - '2025-03-26: Public Context7 repository created.'
    - '2025-04-08: `@upstash/context7-mcp` npm package created.'
    - '2026-01-21: `ctx7` npm CLI package created.'
    - '2026-06-22: `@upstash/context7-mcp@3.2.2` release published.'
  usage:
    - >
      Users either register `https://mcp.context7.com/mcp` with an MCP client or run
      `npx ctx7 setup` to install a CLI/skill workflow. The README recommends an API key
      for higher rate limits but does not document a fixed local credential file for the
      Homebrew package.
related-packages:
  - id: brew:ctx7
    reason: >
      Choose ctx7 when you want to query Context7 directly from a terminal or
      automatically configure either an MCP or CLI-plus-skill integration for an AI
      agent.
    rel: alternative
    sources:
      - https://context7.com/docs/clients/cli
      - https://github.com/upstash/context7
category: ai
package-manager:
