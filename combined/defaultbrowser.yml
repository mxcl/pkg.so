id: brew:defaultbrowser
display-name: defaultbrowser
homepage: https://github.com/kerma/defaultbrowser
repo: https://github.com/kerma/defaultbrowser
docs:
  - https://github.com/kerma/defaultbrowser#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      defaultbrowser is packaged by Homebrew, which fits its audience: Mac users and
      automation scripts that need a terminal-friendly way to change a desktop
      preference normally managed through system settings.
  package-nerd-significance:
    - >
      defaultbrowser is a classic package-manager utility because it wraps a platform
      preference in one tiny CLI. It is useful in dotfiles, setup scripts, and
      fleet/bootstrap workflows where opening a GUI preferences pane would be the wrong
      interface.
  project-history:
    - >
      The README presents defaultbrowser as a macOS X tool built around the macOS Launch
      Services API. Its scope is intentionally narrow: run without arguments to list
      browser handlers and run with a browser identifier to set the default.
    - >
      The repository has tagged commits for v1.0 in 2017 and 1.1 in 2018, matching the
      tool's stable, low-churn nature.
  related-projects:
    - >
      The README points to the macOS Launch Services API as the underlying platform
      facility and to a separate bash-completion project for shell integration.
  sources:
    - https://github.com/kerma/defaultbrowser
    - https://github.com/kerma/defaultbrowser/commit/8d77a3caf7ac52226608fa30a8ce02549782465d
    - https://github.com/kerma/defaultbrowser/commit/dba87e7d8764ea24502d27da7a4c80c3475b4f25
    - https://formulae.brew.sh/formula/defaultbrowser
  summary:
    - >
      defaultbrowser is a small macOS command-line utility for listing and changing the
      system default web browser, specifically the HTTP handler.
  timeline:
    - '2017: v1.0 tagged commit.'
    - '2018: 1.1 tagged commit.'
    - '2026: Homebrew continues to publish the formula.'
  usage:
    - >
      The common usage is direct and scriptable: `defaultbrowser` shows available HTTP
      handlers and the current default, while commands such as `defaultbrowser chrome`
      set the default browser.
related-packages:
  - id: cask:finicky
    reason: >
      Choose Finicky when URLs must be routed or rewritten by programmable rules and
      browser profiles; choose defaultbrowser for the smaller task of listing or
      changing the single macOS default browser from a script.
    rel: alternative
    sources:
      - https://github.com/kerma/defaultbrowser
      - https://github.com/johnste/finicky
      - https://github.com/johnste/finicky/wiki/Configuration-(v4)
category: system
package-manager:
  brew: defaultbrowser
  macports: defaultbrowser
  nix: defaultbrowser
package-manager-url: https://formulae.brew.sh/formula/defaultbrowser
license: MIT
tags:
  - browser
  - cli
  - default-apps
  - launch-services
  - macos
description: Command-line tool for getting & setting the default browser
executables:
  - defaultbrowser
provenance:
  formula: defaultbrowser
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
