id: brew:beautysh
display-name: beautysh
homepage: https://github.com/lovesegfault/beautysh
repo: https://github.com/lovesegfault/beautysh
docs:
  - https://github.com/lovesegfault/beautysh#readme
config-file-location:
  unix:
    - pyproject.toml
    - .editorconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      beautysh is distributed through Python packaging and Nix according to its README,
      and through Homebrew and Nix according to the supplied package metadata.
  package-nerd-significance:
    - >
      beautysh is a small packaging-friendly formatter: one command, local config files,
      and enough caution around Bash edge cases to be useful in editor, CI, or
      pre-commit style workflows.
  project-history:
    - >
      The README frames beautysh around the difficulty of formatting Bash safely because
      shell syntax is ambiguous and keywords can also appear as variable names. The
      project chooses a pragmatic formatter rather than trying to reimplement the Bash
      interpreter.
    - >
      The official repository was created in 2016, and the GitHub releases show
      continued maintenance from early Python-package releases through 2025 and 2026
      releases.
  related-projects:
    - >
      Bash is the language being formatted. EditorConfig is related because beautysh
      reads indentation settings from .editorconfig, and PyPI/Nix are documented
      installation routes.
  sources:
    - https://github.com/lovesegfault/beautysh#readme
    - https://github.com/lovesegfault/beautysh/releases
    - input.json source_facts.package-manager
  summary:
    - >
      beautysh is a Bash beautifier and formatter that can rewrite shell scripts from
      the command line or through its Python API.
  timeline:
    - '2016: The official GitHub repository for beautysh was created.'
    - '2018: The GitHub releases include a 3.11 release named for relicensing to MIT.'
    - '2019: The GitHub releases show 5.x releases.'
    - '2025-2026: The GitHub releases show active 6.x maintenance.'
  usage:
    - >
      Users run beautysh over one or more shell files, optionally with flags for
      indentation, backup behavior, check mode, function style, and variable style. The
      README warns that it overwrites submitted files, so backups matter.
    - >
      Configuration is documented through command-line arguments first, then a
      [tool.beautysh] section in pyproject.toml, then EditorConfig settings in
      .editorconfig.
related-packages:
  - id: brew:shfmt
    reason: >
      Choose shfmt when you want a parser-based formatter supporting POSIX shell, Bash,
      mksh, Bats, and Zsh, rather than beautysh's Bash-focused beautification and style
      controls.
    rel: alternative
    sources:
      - https://github.com/lovesegfault/beautysh#readme
      - https://github.com/mvdan/sh
      - https://github.com/mvdan/sh/blob/master/cmd/shfmt/shfmt.1.scd
  - id: brew:shellcheck
    reason: >
      Run ShellCheck alongside beautysh when you need static bug and portability
      diagnostics in addition to formatting.
    rel: adjacent_workflow
    sources:
      - https://github.com/lovesegfault/beautysh#readme
      - https://www.shellcheck.net/
category: developer-tools
package-manager:
  brew: beautysh
  nix: beautysh
package-manager-url: https://formulae.brew.sh/formula/beautysh
license: MIT
tags:
  - bash
  - beautifier
  - cli
  - formatter
  - shell
description: Bash beautifier
executables:
  - beautysh
provenance:
  formula: beautysh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
