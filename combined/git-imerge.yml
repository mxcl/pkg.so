id: brew:git-imerge
display-name: git-imerge
homepage: https://github.com/mhagger/git-imerge
repo: https://github.com/mhagger/git-imerge
docs:
  - https://github.com/mhagger/git-imerge#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-imerge became a well-known specialist tool among advanced Git users because it
      addressed a real pain point in long-running branches: merge conflicts that are too
      large to understand at once. Its GitHub repository has thousands of stars and its
      packaging spans Homebrew, Debian, Fedora, Nix, and Ubuntu, indicating durable
      interest beyond a single distribution.
  package-nerd-significance:
    - >
      The package is notable because it is not a wrapper around a single Git porcelain
      command; it stores its own operation graph in Git's object database and refs. That
      makes it especially interesting to people who study Git internals, conflict
      resolution, and packaging of Git subcommands.
  project-history:
    - >
      Michael Haggerty's repository was created in May 2013, the same period in which
      the README points users to a GitMerge 2013 presentation and a practical
      introduction article. The project framed incremental merging as a way to reduce
      conflict pain by identifying exactly which commits from two branches conflict.
  related-projects:
    - >
      git-imerge builds on Git's merge, rebase, rerere, refs, and object storage. It is
      related in spirit to conflict-reuse and history-preserving workflows rather than
      to ordinary visual merge tools.
  sources:
    - https://api.github.com/repos/mhagger/git-imerge/releases
    - https://github.com/mhagger/git-imerge
    - https://raw.githubusercontent.com/mhagger/git-imerge/master/README.md
  summary:
    - >
      git-imerge is a Git extension for incremental merge, rebase, revert, and drop
      operations. It breaks large conflict sets into smaller pairwise conflicts and
      records progress inside Git refs so work can be paused, tested, shared, and
      resumed.
  timeline:
    - '2013: GitHub repository created and GitMerge 2013 presentation referenced by the README.'
    - '2016: Release v1.0.0 published.'
    - '2018: Release v1.1.0 published.'
    - '2020: Release v1.2.0 published.'
  usage:
    - >
      Practitioners use commands such as `git-imerge merge BRANCH`, `git-imerge rebase
      BRANCH`, and `git-imerge continue` as analogues to Git's native merge and rebase
      workflows. During an operation, git-imerge records state under `refs/imerge/NAME`,
      can show a diagram of progress, and can simplify the final result into a merge,
      rebase, history-preserving rebase, or fuller intermediate history.
related-packages: []
