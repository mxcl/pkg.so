homepage: https://gambitscheme.org/
repo: https://github.com/gambit/gambit
docs:
  - https://gambitscheme.org/4.9.7/manual
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gambit has been adopted most visibly in the Scheme and
      programming-language-research communities, where it is valued for performance,
      portability, threads, continuations, and its use as a platform for compiler
      research. The project maintains a mailing list, Gitter chat, GitHub issues, and a
      GitHub wiki for users and contributors.
    - >
      The input package facts show Gambit Scheme packaged by Homebrew, while the
      executable list reflects its role as both an installed language runtime and a
      compiler toolchain, with gsi/gsc scripts and target-specific build helpers.
  package-nerd-significance:
    - >
      Gambit is significant to package and language-runtime enthusiasts because it is
      both an old Scheme implementation and a portable compiler toolchain. It
      demonstrates the classic Lisp-family distribution problem: a runtime, compiler,
      generated C code, headers, libraries, and multiple installed versions that
      packages must place coherently on Unix, macOS, and Windows.
  project-history:
    - >
      The official site describes Gambit as first released in 1988 and as integrating
      decades of programming language research. Its manual documents conformance to the
      R4RS, R5RS, R7RS, and IEEE Scheme standards, with most of the implementation
      written in Scheme and compiled to portable C.
    - >
      Gambit's release archive spans the 1990s through the 2020s, including 1.x, 2.x,
      3.0, and the long-running 4.x series. The project moved public development to
      GitHub, where the README directs users to build gsi and gsc from source and points
      to the official website for releases and documentation.
  related-projects:
    - >
      Scheme standards R4RS, R5RS, R7RS, and IEEE Scheme define much of the language
      surface Gambit implements.
    - SRFI libraries are documented in the project README as part of the provided ecosystem.
    - >
      Termite Scheme and Gambit JavaScript/Python interop research appear in the
      official research record.
  sources:
    - https://gambitscheme.org/
    - https://gambitscheme.org/4.9.7/manual/
    - https://gambitscheme.org/community/
    - https://gambitscheme.org/dev/
    - https://gambitscheme.org/releases/
    - https://gambitscheme.org/research/
    - https://github.com/gambit/gambit
  summary:
    - >
      Gambit Scheme is a long-running implementation of Scheme that combines an
      interactive interpreter, gsi, with a compiler, gsc, able to translate Scheme
      programs to portable C and JavaScript.
  timeline:
    - '1988: First public release, according to the official homepage.'
    - '1990s: 1.x, 2.x, and 3.0 releases listed in the official release archive.'
    - '2000s: Gambit 4.x became the main release line.'
    - '2012: GitHub repository created.'
    - '2025: Manual generated for Gambit v4.9.7.'
    - '2026: Official homepage still describes active use and development.'
  usage:
    - >
      Users run gsi for interactive development and scripting, and gsc to compile Scheme
      programs. The manual documents installation layouts, runtime options, debugging,
      modules, threads, foreign interfaces, and generated-code portability through C and
      JavaScript targets.
related-packages:
  - id: brew:gerbil-scheme
    reason: >
      Gerbil adds an opinionated systems-programming dialect, macro system, modules, and
      standard library directly on top of the Gambit runtime and compiler.
    rel: adjacent_workflow
    sources:
      - https://github.com/mighty-gerbils/gerbil#readme
      - https://gambitscheme.org/4.9.7/manual/
  - id: brew:chezscheme
    reason: >
      Choose Chez Scheme for an R6RS-oriented implementation that compiles to optimized
      machine code by default, rather than Gambit's portability-oriented C and
      JavaScript targets.
    rel: alternative
    sources:
      - https://cisco.github.io/ChezScheme/
      - https://gambitscheme.org/4.9.7/manual/
  - id: brew:guile
    reason: >
      Choose GNU Guile when the main requirement is an embeddable GNU extension language
      with a large Unix-oriented module ecosystem, rather than Gambit's portable
      compiler-focused environment.
    rel: alternative
    sources:
      - https://www.gnu.org/software/guile/
      - https://gambitscheme.org/4.9.7/manual/
