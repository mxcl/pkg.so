id: brew:adb-enhanced
display-name: adb-enhanced
homepage: >
  https://ashishb.net/tech/introducing-adb-enhanced-a-swiss-army-knife-for-android-development/
repo: https://github.com/ashishb/adb-enhanced
docs:
  - https://ashishb.net/programming/adb-enhanced
  - https://github.com/ashishb/adb-enhanced#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      adb-enhanced is distributed as a Python package and through Homebrew. The README
      includes install tests for pip and Homebrew, and the supplied package-manager
      facts list Homebrew and Fedora packaging.
  package-nerd-significance:
    - >
      The package is useful for developers who want repeatable Android device state
      changes without remembering long `adb shell` sequences. For maintainers, the main
      packaging concerns are Python 3 support, installing the `adbe` entry point, and
      documenting the underlying ADB dependency.
  project-history:
    - >
      The GitHub repository was created in January 2017. The author blog post, published
      in June 2018, explains that repeated Android testing flows first became notes and
      shell scripts, then became the open source tool `adb-enhanced`.
    - >
      The README positions the tool as a wrapper around `adb`, not a replacement, with
      commands for device state, permissions, app data, screenshots, screen recording,
      app inspection, and filesystem operations.
  related-projects:
    - >
      adb-enhanced wraps Android Debug Bridge and relates to Android SDK platform-tools,
      Android emulator/device testing, and earlier inspiration from `android-scripts`.
  sources:
    - https://api.github.com/repos/ashishb/adb-enhanced
    - https://ashishb.net/programming/adb-enhanced/
    - https://github.com/ashishb/adb-enhanced#readme
  summary:
    - >
      adb-enhanced is a Python command-line wrapper around Android Debug Bridge that
      automates common Android development and testing scenarios.
  timeline:
    - '2017: GitHub repository `ashishb/adb-enhanced` was created.'
    - '2018: Author published the release/introductory blog post for adb-enhanced.'
    - '2018: README documented the Python 3 migration timeline and Python 2 deprecation plan.'
    - '2020: README states Python 2 no longer worked with the current master branch.'
  usage:
    - >
      Users invoke the `adbe` executable to toggle Android device states such as doze,
      battery saver, mobile data, wireless debugging, runtime permissions, app lifecycle
      commands, screenshots, and screen recording.
related-packages:
  - id: cask:android-platform-tools
    reason: >
      Android SDK Platform-Tools is the required companion workflow because it supplies
      the `adb` command that adb-enhanced wraps with higher-level testing operations.
    rel: adjacent_workflow
    sources:
      - https://github.com/ashishb/adb-enhanced#readme
      - https://developer.android.com/tools/releases/platform-tools
category: developer-tools
package-manager:
  brew: adb-enhanced
  dnf: adb-enhanced
package-manager-url: https://formulae.brew.sh/formula/adb-enhanced
license: Apache-2.0
tags:
  - adb
  - android
  - cli
  - developer-tools
  - python
  - testing
description: Swiss-army knife for Android testing and development
executables:
  - adbe
provenance:
  formula: adb-enhanced
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
