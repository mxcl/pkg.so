id: brew:libsolv
display-name: libsolv
homepage: https://github.com/openSUSE/libsolv
repo: https://github.com/openSUSE/libsolv
docs:
  - https://github.com/openSUSE/libsolv#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libsolv began inside the openSUSE/libzypp/YaST world, but its format readers made
      it useful beyond RPM repositories. The GitHub README lists support for rpm/rpm5,
      deb, Arch Linux, Haiku, and apk packages, plus repository formats such as rpmmd,
      susetags, Mandriva/Mageia synthesis, Arch repositories, and apk indexes.
  package-nerd-significance:
    - >
      libsolv is one of the clearest examples of SAT solving escaping theory and
      becoming normal package-manager plumbing. It is interesting to package nerds
      because it exposes dependency conflicts, weak dependencies, repository storage,
      and multi-format metadata as inspectable artifacts rather than opaque
      package-manager behavior.
  project-history:
    - >
      The libsolv history page says the project started in May 2007 when the zypp team
      considered database-backed installation speedups. Michael Schroeder instead
      pursued compact dictionary storage for package strings and relations, creating the
      solv repository format.
    - >
      During SUSE Hack Week at the end of June 2007, Schroeder adapted ideas from
      MiniSAT for package dependency solving. By October 2007 the solver was being
      integrated into libzypp, and in January 2008 the new solver became the default for
      libzypp.
  related-projects:
    - libzypp and YaST were the original integration points.
    - MiniSAT influenced the solver design described in the project history.
    - >
      RPM, Debian package metadata, Arch repositories, and apk indexes are related
      ecosystems supported by libsolv readers.
  sources:
    - https://api.github.com/repos/openSUSE/libsolv/tags?per_page=100
    - https://en.opensuse.org/openSUSE:Libzypp_satsolver
    - https://github.com/openSUSE/libsolv
    - https://manpages.ubuntu.com/manpages/noble/man3/libsolv-history.3.html
  summary:
    - >
      libsolv is openSUSE's package dependency solver and repository metadata library
      built around a SAT-solving model. It matters to package-manager culture because it
      turned dependency resolution into a reusable library with compact repository
      storage, solver introspection, and support for multiple package formats.
  timeline:
    - '2007-05: Project work began after zypp installation-speed discussions.'
    - '2007-06: SUSE Hack Week produced the first SAT-based solver results.'
    - '2007-10: Integration into libzypp started.'
    - '2008-01: The SAT solver became the default libzypp solver.'
    - >
      2014-07-08: GitHub tag 0.6.4 points to a version-bump commit in the
      openSUSE/libsolv repository.
  usage:
    - >
      The package ships a library plus many conversion and inspection tools such as
      rpmdb2solv, repomdxml2solv, archrepo2solv, deb2solv, dumpsolv, mergesolv,
      installcheck, and testsolv. Packagers use it to transform repository metadata into
      solv files and to test dependency closure or upgrade behavior.
related-packages: []
