id: brew:binaryen
display-name: Binaryen
homepage: https://webassembly.org/
repo: https://github.com/WebAssembly/binaryen
docs:
  - https://github.com/WebAssembly/binaryen#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Binaryen became a common toolchain component rather than just a standalone
      compiler. The official README lists Emscripten, wasm-pack, J2CL/J2Wasm,
      Kotlin/Wasm, Dart/Flutter Wasm, and wasm_of_ocaml as toolchains that run Binaryen
      components, typically `wasm-opt`; it also lists AssemblyScript, wasm2js, Asterius,
      and Grain as compilers or compiler-related projects using Binaryen as a library.
  package-nerd-significance:
    - >
      Binaryen is package-nerd important because it is the small executable bundle that
      turns WebAssembly from a browser format into a normal Unix build artifact:
      optimize it, disassemble it, reduce it, merge it, split it, fuzz it, and ship it
      from CI. It sits in the same practical layer for Wasm that binutils, LLVM tools,
      and minifiers occupy for older ecosystems.
  project-history:
    - >
      The official repository was created on 2015-10-29, during WebAssembly's early
      standardization era. Binaryen's README describes it as a C++ compiler and
      toolchain infrastructure library with an IR designed to be easy, fast, and
      effective for WebAssembly optimization and code generation.
  related-projects:
    - >
      Related projects include WebAssembly, Emscripten, WABT, LLVM, wasm-pack,
      AssemblyScript, wasm2js, Kotlin/Wasm, Dart/Flutter Wasm, Grain, and Asterius.
  sources:
    - GitHub repository and release metadata from api.github.com.
    - Official GitHub README.
    - Packaged executable and package-manager facts from source_facts.
  summary:
    - >
      Binaryen is the WebAssembly community's optimizer and compiler/toolchain
      infrastructure library, best known to package users through commands such as
      `wasm-opt`, `wasm-as`, `wasm-dis`, and `wasm2js`.
  timeline:
    - '2015-10-29: GitHub repository created under the WebAssembly organization.'
    - '2018-07-23: Early GitHub release archive includes 1.38.9.'
    - '2018-10-11: GitHub release archive includes 1.38.13.'
    - '2026: Repository metadata shows active maintenance.'
  usage:
    - >
      Package users most often install Binaryen for `wasm-opt` to shrink or speed up
      `.wasm` artifacts, for `wasm-as` and `wasm-dis` to move between text-like and
      binary representations, for `wasm-merge`, `wasm-split`, and `wasm-reduce` in
      build/debug loops, and for `wasm2js` when a JavaScript fallback is needed.
related-packages:
  - id: brew:emscripten
    reason: >
      Choose Emscripten for the complete C/C++-to-WebAssembly toolchain; its documented
      pipeline uses Binaryen for optimization and WebAssembly-specific post-processing.
    rel: adjacent_workflow
    sources:
      - https://github.com/WebAssembly/binaryen#readme
      - https://emscripten.org/docs/optimizing/Optimizing-Code.html
  - id: brew:wasm-pack
    reason: >
      Use wasm-pack to build and package Rust-generated WebAssembly; Binaryen's official
      README identifies wasm-pack as a toolchain that invokes Binaryen, typically
      `wasm-opt`.
    rel: adjacent_workflow
    sources:
      - https://github.com/WebAssembly/binaryen#readme
      - https://wasm-bindgen.github.io/wasm-pack/
category: developer-tools
package-manager:
