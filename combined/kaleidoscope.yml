history:
  adoption-history:
    - >
      Kaleidoscope became established among Mac developers as a polished visual diff
      client with integrations for Git and other version-control systems. Version 2
      reached the Mac App Store in January 2013.
    - >
      The app changed ownership at the end of 2020. Its new team resumed active
      development, initially targeting developers and improving performance, Xcode
      integration, and source-control workflows.
  package-nerd-significance:
    - >
      Kaleidoscope represents the commercial, Mac-native end of the diff-tool spectrum:
      it complements command-line version control with carefully designed text, image,
      folder, and Git-history views.
    - >
      Its Homebrew cask gives terminal-oriented Mac users a reproducible installation
      route even though the application itself is proprietary and distributed as a
      signed app bundle.
  project-history:
    - >
      Made by Sofa originally developed Kaleidoscope. After Facebook acquired that
      company in 2011, Black Pixel continued the product and delivered version 2 in
      2013. The product was acquired again in 2020 by the team that later formed
      Leitmotif GmbH.
    - >
      Later major releases moved beyond the separately licensed v2 and v3 editions to
      the current subscription product.
  related-projects:
    - >
      Git, Subversion, Mercurial, Xcode, and the ksdiff command-line client are
      documented integration points.
  sources:
    - https://blog.kaleidoscope.app/2021/10/12/acquiring-a-product/
    - https://blog.kaleidoscope.app/2022/03/11/app-bundles/
    - https://kaleidoscope.app/help
    - https://kaleidoscope.app/help/docs/command-line-tool
    - https://kaleidoscope.app/help/docs/integration
  summary:
    - >
      Kaleidoscope is a proprietary macOS application for comparing and merging text,
      images, and folders, with dedicated Git and developer-tool integrations.
  timeline:
    - >
      2011: Made by Sofa was acquired by Facebook, after which Black Pixel continued
      Kaleidoscope.
    - '2013: Kaleidoscope 2 launched and entered the Mac App Store.'
    - '2020: A new independent team acquired Kaleidoscope.'
    - '2021: Kaleidoscope 3 restored major-version development.'
    - '2023: The product moved toward subscription licensing with Kaleidoscope 4.'
  usage:
    - >
      Users open files or folders in the graphical application, invoke comparisons from
      other Mac apps, or install the bundled ksdiff client for shell scripts and
      version-control workflows.
    - >
      The official integration window configures ksdiff and integrations with Git,
      Subversion, Mercurial, Xcode, VS Code, JetBrains IDEs, and other tools.
