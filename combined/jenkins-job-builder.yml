id: brew:jenkins-job-builder
display-name: Jenkins Job Builder
homepage: https://docs.openstack.org/infra/jenkins-job-builder/
repo: https://opendev.org/jjb/jenkins-job-builder
docs:
  - https://jenkins-job-builder.readthedocs.io/en/latest
config-file-location:
  unix:
    - ~/.config/jenkins_jobs/jenkins_jobs.ini
    - <script directory>/jenkins_jobs.ini
    - /etc/jenkins_jobs/jenkins_jobs.ini
credentials-file-location:
  unix:
    - ~/.config/jenkins_jobs/jenkins_jobs.ini
    - <script directory>/jenkins_jobs.ini
    - /etc/jenkins_jobs/jenkins_jobs.ini
history:
  adoption-history:
    - >
      JJB became useful to infrastructure teams that wanted Jenkins jobs reviewed like
      code. Instead of treating the Jenkins web UI as the source of truth, teams could
      keep job definitions in Git, generate XML, test definitions locally, and upload
      changes through a repeatable CLI.
  package-nerd-significance:
    - >
      JJB is a classic infrastructure-as-code package from the pre-Pipeline era of
      Jenkins administration. It matters to package nerds because it bridges
      human-editable job declarations, generated Jenkins XML, and distro-friendly Python
      packaging, preserving a workflow that predates many newer Jenkins configuration
      systems.
  project-history:
    - >
      The project is documented with a 2012-2026 maintainer copyright range and has long
      been associated with the OpenStack/OpenDev infrastructure ecosystem. The OpenDev
      repository presents it as tools for making Jenkins jobs from templates and records
      the OpenDev migration patch in 2019.
    - >
      The README says Jenkins Job Builder takes human-readable YAML or JSON descriptions
      of Jenkins jobs, uses them to configure Jenkins, and includes a flexible template
      system for creating many similar jobs.
  related-projects:
    - Jenkins is the target automation server whose jobs and views JJB configures.
    - >
      OpenDev and the former OpenStack infrastructure tooling are historically connected
      to JJB's repository and review workflow.
    - >
      python-jenkins and PyYAML are related implementation dependencies named by the
      README for non-setup.py installation.
  sources:
    - https://jenkins-job-builder.readthedocs.io/en/stable/
    - https://jenkins-job-builder.readthedocs.io/en/stable/definition.html
    - https://jenkins-job-builder.readthedocs.io/en/stable/execution.html
    - https://opendev.org/jjb/jenkins-job-builder
  summary:
    - >
      Jenkins Job Builder is a Python tool that converts YAML or JSON job definitions
      into Jenkins job configuration. Its package-manager role is to put the
      `jenkins-jobs` executable on a developer or CI administration machine so Jenkins
      jobs can be generated and updated from version-controlled text.
  timeline:
    - '2012: early project files and licensing history appear in the repository.'
    - '2014: sample and reference-test material appears in the repository history.'
    - '2019: the project migrated into the OpenDev namespace.'
    - '2024: Read the Docs configuration was added to the repository.'
  usage:
    - >
      The documentation describes YAML or JSON job definition files, directories of
      definitions, job templates, projects, macros, and defaults. The execution docs
      show `jenkins-jobs test` for generating XML locally and `jenkins-jobs update` for
      uploading job and view definitions to a configured Jenkins server.
related-packages:
  - id: brew:jenkins-lts
    reason: >
      Install Jenkins LTS as the conservatively updated server whose jobs and views
      Jenkins Job Builder can generate and upload.
    rel: adjacent_workflow
    sources:
      - https://jenkins-job-builder.readthedocs.io/en/stable/execution.html
      - https://www.jenkins.io/download/lts/
category: developer-tools
package-manager:
  brew: jenkins-job-builder
  debian: jenkins-job-builder
  nix: jenkins-job-builder
  ubuntu: jenkins-job-builder
package-manager-url: https://formulae.brew.sh/formula/jenkins-job-builder
license: Apache-2.0
tags:
  - automation
  - ci-cd
  - cli
  - jenkins
  - python
  - yaml
description: Configure Jenkins jobs with YAML files stored in Git
executables:
  - jenkins-jobs
provenance:
  formula: jenkins-job-builder
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
