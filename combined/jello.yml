id: brew:jello
display-name: jello
homepage: https://github.com/kellyjonbrazil/jello
repo: https://github.com/kellyjonbrazil/jello
docs:
  - https://github.com/kellyjonbrazil/jello#readme
config-file-location:
  unix: ~/.jelloconf.py
  windows: '%APPDATA%/.jelloconf.py'
credentials-file-location: null
history:
  adoption-history:
    - >
      jello spread through Python and OS package channels. The README documents
      installation through pip, OS repositories, Windows MSI packages, GitHub release
      binaries, and Homebrew, while the batch input records packages in Homebrew,
      Debian, Fedora, MacPorts, Nix, and Ubuntu.
  package-nerd-significance:
    - >
      jello is package-nerd significant because it belongs to the post-jq wave of
      structured-text CLI tools: it keeps Unix pipes and JSON filters, but chooses the
      host language many operators already know. It pairs naturally with jc, which turns
      command output into JSON, and jtbl, which turns JSON back into terminal tables.
  project-history:
    - >
      Kelly Brazil introduced jello in March 2020 as part of a set of structured-data
      command-line tools that also included jc and jtbl. In the author blog post, Brazil
      explains that jq is useful but that Python list and dictionary syntax can be
      easier for deeply nested structures.
    - >
      The project changelog records an initial release on March 24, 2020 and version
      1.0.0 on April 1, 2020. Subsequent releases added raw output, line output, custom
      initialization, schema output, color controls, Windows fixes, dot notation, file
      input, query files, and raw-string ingestion.
  related-projects:
    - >
      Related projects include jq, the comparison point in the README and blog post; jc
      and jtbl, Brazil's adjacent structured-data CLI tools; and Jello Explorer, also
      called jellex, which the README lists as a TUI built on jello.
  sources:
    - https://blog.kellybrazil.com/2020/03/25/jello-the-jq-alternative-for-pythonistas/
    - https://formulae.brew.sh/formula/jello
    - https://github.com/kellyjonbrazil/jello
    - https://github.com/kellyjonbrazil/jello#readme
    - https://github.com/kellyjonbrazil/jello/blob/master/CHANGELOG
  summary:
    - >
      jello is a command-line JSON and JSON Lines filter that uses Python expressions
      instead of jq's filter language. The README describes it as similar to jq, but
      with standard Python dict and list syntax.
  timeline:
    - '2020: Initial release 0.1.5 was recorded on March 24.'
    - '2020: Author blog post introduced jello as a Python-syntax jq alternative on March 25.'
    - '2020: Version 1.0.0 removed the need to assign the result to r.'
    - '2021: Version 1.3.0 added dot notation and larger-data performance improvements.'
    - '2023: Version 1.6.0 added direct JSON or JSON Lines file input and query files.'
    - >
      2025: Version 1.6.1 added raw-string ingestion and richer runtime/query error
      information.
  usage:
    - >
      Users pipe JSON or JSON Lines into jello, where the parsed data is available as
      the underscore object. Queries can be Python expressions, comprehensions, loops,
      or code loaded from a query file, and output can be JSON, JSON Lines,
      bash-array-friendly lines, or a grep-able schema.
related-packages:
  - id: brew:jq
    reason: >
      Choose jq for its purpose-built, portable JSON query language; choose jello when
      Python dictionary, list, and comprehension syntax is more familiar or directly
      useful.
    rel: alternative
    sources:
      - https://github.com/kellyjonbrazil/jello#readme
      - https://jqlang.github.io/jq/manual/
  - id: brew:jc
    reason: >
      Use jc before jello to convert ordinary command output into JSON that jello can
      filter with Python expressions.
    rel: adjacent_workflow
    sources:
      - https://github.com/kellyjonbrazil/jc#readme
      - https://github.com/kellyjonbrazil/jello#readme
  - id: brew:jtbl
    reason: >
      Pipe jello's filtered JSON or JSON Lines into jtbl when the result should be
      rendered as a terminal, CSV, HTML, or Markdown table.
    rel: adjacent_workflow
    sources:
      - https://github.com/kellyjonbrazil/jtbl#readme
      - https://github.com/kellyjonbrazil/jello#readme
category: developer-tools
package-manager:
  brew: jello
  debian: jello
  dnf: jello
  macports: jello
  nix: jello
  ubuntu: jello
package-manager-url: https://formulae.brew.sh/formula/jello
license: MIT
tags:
  - cli
  - jq-alternative
  - json
  - json-lines
  - python
description: Filter JSON and JSON Lines data with Python syntax
executables:
  - jello
provenance:
  formula: jello
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
