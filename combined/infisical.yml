id: brew:infisical
display-name: Infisical CLI
homepage: https://infisical.com/docs/cli/overview
repo: https://github.com/Infisical/cli
docs:
  - https://infisical.com/docs/cli/overview
  - https://infisical.com/docs/cli/usage
config-file-location:
  unix:
    - <project>/.infisical.yaml
    - <project>/.infisical.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Infisical distributes the CLI through several channels: Homebrew, Scoop, winget,
      npm, Linux package repositories, Arch User Repository, and GitHub release
      binaries. The Linux repository migration from Cloudsmith to
      artifacts-cli.infisical.com shows that the CLI became important enough to warrant
      dedicated artifact hosting.
  package-nerd-significance:
    - >
      Infisical CLI is a modern DevSecOps package: it exists so secrets-management
      workflows can be scripted, pinned, installed by package managers, and used in CI
      containers without a browser UI. For package maintainers, the important part is
      not only the binary but also the artifact-hosting, version-pinning, and
      environment-variable contract around it.
  project-history:
    - >
      Infisical's main open-source project frames the platform around making security
      tooling more accessible to developer teams. The separate CLI repository presents
      infisical as the official command-line tool for injecting secrets into
      applications and managing Infisical infrastructure.
    - >
      The CLI grew around developer workflow needs: local login, project initialization,
      .infisical.json project settings, environment-variable injection through infisical
      run, machine-identity authentication, export to dotenv/YAML formats, and support
      for Infisical Cloud or self-hosted domains.
  related-projects:
    - >
      The Infisical platform repository is the server and product counterpart. HashiCorp
      Vault is a related secrets-management category reference named in Infisical
      repository topics. npm, Homebrew, Scoop, winget, AUR, and Linux package
      repositories are part of the CLI distribution story.
  sources:
    - https://github.com/Infisical/cli
    - https://github.com/Infisical/infisical
    - https://infisical.com/docs/cli/overview
    - https://infisical.com/docs/cli/usage
  summary:
    - >
      Infisical CLI is the command-line interface for Infisical, an open-source security
      infrastructure platform for secrets, certificates, and privileged access
      management. The CLI focuses on secret retrieval, injection into processes, export,
      authentication, and automation.
  timeline:
    - >
      2022: Infisical platform repository created as an open-source secrets-management
      project.
    - >
      2024: Infisical CLI package-manager distribution appears across Homebrew, npm,
      winget, and other channels.
    - >
      2025: CLI docs describe v0.4.0 behavior for choosing Infisical Cloud regions or
      self-hosted instances during login.
    - >
      2026: CLI Linux package repository migration scheduled from Cloudsmith to
      artifacts-cli.infisical.com.
  usage:
    - >
      Users install the CLI, run infisical login, initialize a project, and use
      infisical run to inject environment variables into local development, CI/CD,
      staging, or production commands. Non-interactive workflows can authenticate with
      machine identity credentials and pass an access token through INFISICAL_TOKEN.
    - >
      The CLI also covers secret export and secret scanning. The usage docs warn that
      terminal history can retain commands that set secrets, which is a small but
      important operational detail for a secrets-management CLI.
related-packages:
  - id: brew:sops
    reason: >
      Choose SOPS when encrypted YAML, JSON, dotenv, or binary files should live in
      version control; choose Infisical CLI when applications should retrieve or inject
      secrets from a centralized Infisical service.
    rel: alternative
    sources:
      - https://getsops.io/docs/
      - https://infisical.com/docs/cli/usage
category: security
package-manager:
  brew: infisical
  macports: infisical
  nix: infisical
  winget: infisical.infisical
package-manager-url: https://formulae.brew.sh/formula/infisical
license: MIT
tags:
  - cli
  - devops
  - environment-variables
  - secret-injection
  - secrets-management
  - security
description: CLI for Infisical
executables:
  - infisical
provenance:
  formula: infisical
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
