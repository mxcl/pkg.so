id: brew:genometools
display-name: GenomeTools
homepage: https://genometools.org/
repo: https://github.com/genometools/genometools
docs:
  - https://genometools.org/documentation.html
  - https://genometools.org/manuals.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GenomeTools gained significance through bioinformatics publications and through
      its packaging as a reusable command-line suite rather than a single-purpose
      script. Its official site points to manuals, manpage-style tool documentation, a C
      API, Lua-based gtscript documentation, and a GFF3 validator, which made it useful
      both for end users and developers building genome-annotation workflows.
  package-nerd-significance:
    - >
      GenomeTools is a good example of scientific software that package managers
      preserve because reproducible research workflows depend on exact command-line
      behavior, compiled C libraries, and long-lived manual pages.
  project-history:
    - >
      The project archive shows public source tarballs beginning with the 0.6.x series
      in 2007 and a 1.0.0 release later that year. The official overview describes the
      system as a collection of bioinformatics tools combined into one binary and based
      on libgenometools, with development credited to Gordon Gremme, Sascha Steinbiss,
      Stefan Kurtz, and contributors at the University of Hamburg's Genome Informatics
      group.
    - >
      The 2013 GenomeTools publication framed the project as a comprehensive software
      library for efficient processing of structured genome annotations. Around that
      core, the official site lists separately published components such as LTRharvest,
      Tallymer, AnnotationSketch, LTRdigest, GtEncseq, Readjoiner, and related tools
      built on the same library.
  related-projects:
    - >
      Related GenomeTools components and adjacent projects include libgenometools, gt,
      AnnotationSketch, LTRharvest, LTRdigest, Tallymer, GtEncseq, Readjoiner,
      GenomeThreader, and GFF3 validation tooling.
  sources:
    - https://formulae.brew.sh/formula/genometools
    - https://genometools.org/
    - https://genometools.org/documentation.html
    - https://genometools.org/manuals.html
    - https://genometools.org/pub/
    - https://github.com/genometools/genometools
  summary:
    - >
      GenomeTools is an open source genome informatics system centered on a single gt
      command and the libgenometools C library. It collects command-line tools, APIs,
      and published bioinformatics components for structured genome annotations,
      sequence analysis, annotation visualization, and related workflows.
  timeline:
    - '2007: the project archive listed the 0.6.x series and 1.0.0 tarballs.'
    - >
      2008: the official site listed published GenomeTools components including
      LTRharvest and Tallymer.
    - >
      2013: the GenomeTools software-library paper appeared in IEEE/ACM Transactions on
      Computational Biology and Bioinformatics.
    - '2021: the project archive listed the 1.6.2 tarball.'
  usage:
    - >
      Practitioners use GenomeTools for tasks such as validating and processing GFF3,
      drawing genome annotations, finding LTR retrotransposons, counting or indexing
      sequence features, assembling reads, and scripting analyses around the gt command.
      Developers can use libgenometools and the documented C API when command-line
      composition is not enough.
related-packages: []
