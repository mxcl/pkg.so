id: brew:ipmiutil
display-name: ipmiutil
homepage: https://ipmiutil.sourceforge.net/
repo: https://github.com/arcress0/ipmiutil
docs:
  - https://ipmiutil.sourceforge.net/docs/UserGuide
  - https://github.com/arcress0/ipmiutil#readme
