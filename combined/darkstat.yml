id: brew:darkstat
display-name: darkstat
homepage: https://unix4lyfe.org/darkstat/
repo: https://github.com/emikulic/darkstat
docs:
  - https://unix4lyfe.org/darkstat
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official page lists packaging and port references across FreeBSD Ports,
      OpenBSD ports, pkgsrc, Gentoo, SUSE, Debian, OpenWRT, SlackBuilds, Ubuntu, and
      firewall-oriented distributions. It also documents portability reports for AIX,
      BSDs, Linux distributions, Mac OS X, and Solaris.
  package-nerd-significance:
    - >
      darkstat is a classic sysadmin package: small enough for routers and old Unix
      systems, visual enough to be useful from a browser, and old enough to show how
      libpcap-based monitoring tools were packaged across many ports trees.
  project-history:
    - >
      Emil Mikulic's official darkstat page describes a small, portable, single-threaded
      network statistics gatherer with an embedded web server. The ChangeLog records
      darkstat 2 ending at v2.6 in 2003, followed by a near-complete v3 rewrite and
      first public darkstat 3 release in June 2006.
  related-projects:
    - >
      The official page lists ntop and vnstat as similar tools and connects darkstat to
      libpcap-based Unix traffic monitoring.
  sources:
    - https://unix4lyfe.org/darkstat
    - https://github.com/emikulic/darkstat
    - https://github.com/emikulic/darkstat/blob/master/ChangeLog
    - https://github.com/emikulic/darkstat/releases
  summary:
    - >
      darkstat is a network traffic analyzer that captures packets, accumulates traffic
      statistics, and serves reports over HTTP.
  timeline:
    - "2001: The official page's copyright span begins."
    - '2003: darkstat 2 ended at v2.6.'
    - '2006: darkstat 3 had its first public release after a near-complete rewrite.'
    - '2011: IPv6 support was added.'
    - '2022: Prometheus metrics export was added.'
    - '2025: v3.0.722 was published on GitHub.'
  usage:
    - >
      The quickstart is intentionally Unix-like: configure, make, then run darkstat -i
      eth0. The tool sniffs an interface, tracks host and port statistics, draws traffic
      graphs, and exposes the reports through its own HTTP interface.
related-packages:
  - id: brew:vnstat
    reason: >
      Choose vnStat for low-overhead, long-term interface totals read from kernel
      counters instead of darkstat's packet capture and per-host web reports.
    rel: alternative
    sources:
      - https://unix4lyfe.org/darkstat/
      - https://humdi.net/vnstat/
      - https://humdi.net/vnstat/man/vnstat.html
category: networking
package-manager:
  apk: darkstat
  brew: darkstat
  debian: darkstat
  dnf: darkstat
  macports: darkstat
  nix: darkstat
  pacman: darkstat
  ubuntu: darkstat
package-manager-url: https://formulae.brew.sh/formula/darkstat
license: GPL-2.0-only AND ISC AND BSD-2-Clause AND BSD-3-Clause
tags:
  - cli
  - monitoring
  - network-traffic
  - traffic-analysis
description: Network traffic analyzer
executables:
  - darkstat
provenance:
  formula: darkstat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
