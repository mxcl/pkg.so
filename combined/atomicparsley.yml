id: brew:atomicparsley
display-name: AtomicParsley
homepage: https://github.com/wez/atomicparsley
repo: https://github.com/wez/atomicparsley
docs:
  - https://github.com/wez/atomicparsley#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AtomicParsley became one of the standard low-level MP4 tagging tools in
      package-manager culture because it exposed iTunes-era atoms directly from a
      scriptable command line. The input package facts show packaging across Homebrew,
      Debian, Ubuntu, Fedora, Alpine, Arch, MacPorts, Nix, Scoop, and winget, which is
      typical of a durable utility depended on by larger media workflows rather than a
      flashy end-user app.
    - >
      Its cross-platform release artifacts and Homebrew install instructions in the
      README reinforce that it is consumed both as a standalone binary and as a building
      block inside scripts. The README warns that Homebrew may lag the latest repository
      release, a small but familiar detail for package maintainers tracking upstream
      tags.
  package-nerd-significance:
    - >
      AtomicParsley is package-nerd interesting because it is an old media utility whose
      active lineage moved through legacy forge infrastructure, a Mercurial-era
      Bitbucket fork, and finally GitHub. It is also a good example of a small CLI with
      a long tail: the binary is tiny, the interface is stable, and downstream packagers
      keep it around because other tools and scripts expect it.
    - >
      The package also illustrates the maintenance reality of aging media tools.
      Upstream accepts easy-to-review fixes and has CI for major platforms, but the
      maintainer's own note is candid that complex behavior needs tests because he no
      longer uses the tool day to day.
  project-history:
    - >
      The maintained GitHub repository describes AtomicParsley as a lightweight
      command-line program for reading, parsing, and setting metadata in MPEG-4 files,
      especially iTunes-style metadata. The current maintainer notes that he made fixes
      to the original SourceForge project in 2009 and became the de facto fork as a
      result.
    - >
      The same maintenance note explains the modern repository shape: the maintainer had
      not personally used the tool for years, but kept it alive in a loose guiding role.
      In 2020, Bitbucket's shutdown of Mercurial hosting forced a migration, after which
      the GitHub repository gained renewed activity and multi-platform GitHub Actions
      builds.
  related-projects:
    - >
      Adjacent tools include MP4Box, FFmpeg, ExifTool, and media managers that call
      dedicated taggers as part of post-processing. AtomicParsley is narrower than those
      projects, focused on MPEG-4 atoms and iTunes-style metadata rather than general
      media conversion or broad metadata extraction.
  sources:
    - Official GitHub README maintenance note and usage help.
    - Official GitHub releases API.
    - input source_facts.package-manager.
  summary:
    - >
      AtomicParsley is a command-line MPEG-4 metadata editor best known for reading,
      inspecting, and writing iTunes-style tags in MP4-family media files. It sits in
      the media-tooling niche occupied by small single-purpose CLIs: it is not a
      transcoder, but a metadata surgery tool used after ripping, downloading,
      podcasting, or encoding workflows.
  timeline:
    - >
      2009: Wez Furlong made fixes to the original SourceForge project and his fork
      became the de facto maintained AtomicParsley line.
    - >
      2020: The repository moved after Bitbucket ended Mercurial hosting, producing
      renewed GitHub activity.
    - '2020: GitHub release 20200701.154658.b0d6223 published.'
    - '2022: GitHub release 20221229.172126.d813aa6 published.'
    - '2024: GitHub release 20240608.083822.1ed9031 published.'
  usage:
    - >
      Typical use is direct metadata inspection and mutation: printing an atom tree,
      printing text tags, extracting artwork, setting artist/title/album fields, adding
      cover art, marking podcast fields, and deleting individual tags or artwork. The
      README's quick help also documents less common MPEG-4 metadata areas such as
      reverse-DNS forms, 3GPP assets, ISO copyright notices, UUID tags, and ID3-on-MP4
      support.
    - >
      Package users usually reach for AtomicParsley when a media pipeline already has an
      MP4 and needs metadata adjusted without re-encoding. That makes the tool useful in
      shell scripts and post-processing hooks where a GUI tagger would be too manual.
related-packages:
  - id: brew:exiftool
    reason: >
      Choose ExifTool when you need one metadata reader/writer spanning MP4/MOV and many
      other file types; choose AtomicParsley for a narrower interface centered on MPEG-4
      and iTunes atoms.
    rel: alternative
    sources:
      - https://github.com/wez/atomicparsley
      - https://exiftool.org/exiftool_pod2.html
      - https://exiftool.org/TagNames.pdf
  - id: brew:ffmpeg
    reason: >
      FFmpeg can encode, remux, and copy media metadata before AtomicParsley applies
      MP4-specific iTunes-style tagging in the same media-processing workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/wez/atomicparsley
      - https://www.ffmpeg.org/ffmpeg.html
      - https://www.ffmpeg.org/ffmpeg-formats.html
category: media
