id: brew:mupdf-tools
display-name: MuPDF tools
homepage: https://mupdf.com/
repo: https://github.com/ArtifexSoftware/mupdf
docs:
  - https://mupdf.readthedocs.io/en/latest
  - https://mupdf.readthedocs.io/en/latest/tools/index.html
  - https://mupdf.com/docs
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The practical role of the package is batch document work. mutool draw renders
      pages to image, vector, or text outputs; mutool convert handles friendlier
      document conversion; mutool show exposes PDF internals; and the broader mutool
      suite covers inspection, extraction, merging, and rewriting workflows. That makes
      mupdf-tools a small, scriptable alternative to heavier PDF applications in build
      systems, document pipelines, packaging tests, and forensic inspection tasks.
  sources:
    - https://formulae.brew.sh/formula/mupdf-tools
    - https://github.com/ArtifexSoftware/mupdf
    - https://manpages.debian.org/testing/mupdf-tools/mutool.1.en.html
    - https://mupdf.readthedocs.io/en/1.27.1/guide/what-is-mupdf.html
    - https://mupdf.readthedocs.io/en/latest/tools/mutool.html
    - https://packages.debian.org/sid/mupdf-tools
  summary:
    - >
      mupdf-tools is the command-line packaging of MuPDF, Artifex Software's compact
      document-rendering framework. The tools package exists because many users need
      MuPDF's renderer and PDF/XPS/EPUB manipulation utilities without installing the
      graphical viewers. Debian describes the package as command-line tools using the
      MuPDF library, centered on mutool for cleaning, extracting, inspecting, and
      rendering documents.
  usage:
    - >
      Its history tracks MuPDF itself: a C library and toolkit developed by Artifex for
      fast, small-footprint rendering of PDF, XPS, and e-book formats. The
      package-manager niche is the Unix-style split between a reusable engine/viewer
      package and a CLI utilities package, similar to how distributions separate
      libraries, viewers, and tools for Poppler or Ghostscript-related workflows.
related-packages:
  - id: brew:qpdf
    reason: >
      Choose qpdf for focused, content-preserving PDF structural transformations and
      lightweight library integration; choose MuPDF tools when rendering, conversion,
      text extraction, or support for non-PDF document formats is needed.
    rel: alternative
    sources:
      - https://mupdf.readthedocs.io/en/latest/tools/mutool.html
      - https://qpdf.readthedocs.io/en/latest/overview.html
  - id: brew:ghostscript
    reason: >
      Choose Ghostscript for PostScript interpretation and print-oriented conversion
      pipelines; choose MuPDF tools for lightweight PDF, XPS, e-book, image, and
      document-inspection workflows.
    rel: alternative
    sources:
      - https://mupdf.readthedocs.io/en/latest/guide/what-is-mupdf.html
      - https://ghostscript.readthedocs.io/en/latest/Readme.html
category: media
package-manager:
  apk: mupdf-tools
  brew: mupdf-tools
  debian: mupdf-tools
  pacman: mupdf-tools
  ubuntu: mupdf-tools
  winget: ArtifexSoftware.mutool
package-manager-url: https://formulae.brew.sh/formula/mupdf-tools
