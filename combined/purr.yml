id: brew:purr
display-name: purr
homepage: https://github.com/google/purr
repo: https://github.com/google/purr
docs:
  - https://github.com/google/purr/tree/main/docs
  - https://github.com/google/purr#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Homebrew installation and manual installation of the
      script.
  package-nerd-significance:
    - >
      purr combines existing shell tools into an interactive Android debugging
      interface, illustrating the reuse of fuzzy finding for specialized terminal
      workflows.
  project-history:
    - >
      Published under Google's GitHub organization, purr addresses the repetitive
      filtering and unformatted output involved in inspecting logcat with shell
      commands.
  related-projects:
    - fzf, zsh, Perl, and Android Debug Bridge are documented dependencies.
  sources:
    - https://github.com/google/purr#readme
  summary:
    - purr is a zsh-based interactive viewer for Android logcat output.
  timeline:
    - 'Undated: Official documentation describes support for Ubuntu Linux and macOS.'
  usage:
    - >
      Developers select an attached device, filter logs, inspect surrounding context,
      and search ADB shell output. Configuration is exposed through command-line options
      and environment variables.
category: developer-tools
package-manager:
  brew: purr
package-manager-url: https://formulae.brew.sh/formula/purr
license: Apache-2.0
tags:
  - adb
  - android
  - cli
  - fzf
  - logcat
  - logging
  - tui
  - zsh
description: Versatile zsh CLI tool for viewing and searching through Android logcat output
executables:
  - purr
provenance:
  formula: purr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
