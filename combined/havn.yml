id: brew:havn
display-name: havn
homepage: https://github.com/mrjackwills/havn
repo: https://github.com/mrjackwills/havn
docs:
  - https://github.com/mrjackwills/havn#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      havn is distributed through Cargo, prebuilt GitHub release archives, Docker Hub,
      GitHub Container Registry, Arch Linux repositories, x-cmd, and Homebrew package
      metadata. That gives a small Rust CLI several installation paths without turning
      it into a larger framework.
    - >
      Its adoption is likely among users who want a quick TCP port scan with sane
      defaults, concurrent scanning, IPv4/IPv6 selection, configurable ranges, retries,
      timeouts, Docker support, and a small binary footprint.
  package-nerd-significance:
    - >
      havn is package-nerd relevant as a small Rust network utility that ships through
      several channels: cargo install for Rust users, prebuilt release archives for
      direct installs, containers for isolated runs, and OS package managers for
      system-managed installs.
    - >
      Its changelog is intentionally granular, recording maintenance items such as
      dependency updates, Rust lint changes, release-script updates, and CI workflow
      changes. That is useful to package maintainers because build tooling and Rust
      edition changes can affect downstream packaging even when CLI behavior barely
      changes.
  project-history:
    - >
      The project history is compact and well documented in its changelog. Version 0.1.0
      on 2023-05-18 is listed as the initial commit. Subsequent 0.1.x releases refined
      documentation, CLI argument descriptions, spinner/color behavior, tests, and
      maintenance automation.
    - >
      By 2025, the changelog shows feature work such as a Rust 2024 edition update and
      verbose mode. The 0.3.x line continued performance and release-workflow
      adjustments while retaining the small single-purpose scope of a fast configurable
      scanner.
  related-projects:
    - Tokio provides the asynchronous Rust runtime used by havn.
    - Cargo and crates.io are the native Rust packaging path for havn.
    - >
      Docker Hub, GitHub Container Registry, Arch Linux packaging, Homebrew, and x-cmd
      are documented distribution channels.
  sources:
    - https://crates.io/crates/havn
    - https://formulae.brew.sh/formula/havn
    - https://github.com/mrjackwills/havn
    - https://github.com/mrjackwills/havn/releases
    - https://raw.githubusercontent.com/mrjackwills/havn/main/CHANGELOG.md
  summary:
    - >
      havn is a lightweight Rust port scanner with configurable defaults. The README
      describes it as a self-contained TCP scanning application using Tokio
      multithreading, with Docker and multi-platform binary distribution.
  timeline:
    - '2023-05-18: v0.1.0 initial commit.'
    - '2023-07-30: v0.1.3 added monochrome mode.'
    - '2024: 0.1.x releases continued documentation, dependency, and workflow maintenance.'
    - '2025-02-24: v0.2.0 updated the project to Rust 2024 edition.'
    - '2025-08-12: v0.3.0 added verbose mode.'
    - '2026: 0.3.x releases continued dependency, workflow, linting, and container-build fixes.'
  usage:
    - >
      Typical use is direct CLI scanning: run havn with a host or address, optionally
      select all ports or a range, set concurrency, timeout, retry count, monochrome
      output, IPv6 mode, or verbose output.
    - >
      The README examples cover scanning github.com with defaults, scanning localhost
      across all ports with custom concurrency and timeout, scanning specific host/port
      ranges, and scanning one port with retries.
related-packages:
  - id: brew:nmap
    reason: >
      Choose Nmap when you need UDP and multiple TCP scan techniques, service and OS
      detection, or the Nmap Scripting Engine rather than havn's focused concurrent TCP
      connect scans.
    rel: alternative
    sources:
      - https://github.com/mrjackwills/havn
      - https://nmap.org/book/port-scanning.html
      - https://nmap.org/book/man-version-detection.html
      - https://nmap.org/book/nse.html
  - id: brew:rustscan
    reason: >
      Choose RustScan when fast port discovery must feed directly into Nmap or custom
      scripts; choose havn for a smaller standalone scanner with straightforward
      timeout, retry, and range controls.
    rel: alternative
    sources:
      - https://github.com/mrjackwills/havn
      - https://github.com/bee-san/RustScan
category: networking
package-manager:
  apk: havn
  brew: havn
  nix: havn
  pacman: havn
package-manager-url: https://formulae.brew.sh/formula/havn
license: MIT
tags:
  - cli
  - network-scanner
  - port-scanner
  - rust
  - security
description: Fast configurable port scanner with reasonable defaults
executables:
  - havn
provenance:
  formula: havn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
