id: brew:jerryscript
display-name: JerryScript
homepage: https://jerryscript.net
repo: https://github.com/jerryscript-project/jerryscript
docs:
  - https://github.com/jerryscript-project/jerryscript#readme
  - https://jerryscript.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      JerryScript gained ecosystem legitimacy by becoming an OpenJS Foundation hosted
      project. The OpenJS project listing describes it as a fully featured JavaScript
      engine for IoT devices, and the JerryScript site links it with IoT.js, a related
      JavaScript platform for IoT applications.
    - >
      Package-manager adoption through Homebrew and Nix gives developers a
      straightforward way to build and experiment with the `jerry` command-line engine
      on workstations, even though the project's natural deployment target is embedded
      firmware and constrained devices.
  package-nerd-significance:
    - >
      JerryScript is interesting to package people because it is not another desktop
      JavaScript runtime. It packages a tiny embeddable engine whose constraints are
      closer to firmware than Node.js, making it a useful test case for how package
      managers expose embedded-runtime tooling to general-purpose developer machines.
  project-history:
    - >
      The public GitHub repository dates to 2015. The project presented itself early as
      a JavaScript engine for devices with less than 64 KB of RAM and less than 200 KB
      of flash, targeting a niche that mainstream browser and server JavaScript engines
      did not fit.
    - >
      JerryScript reached a 1.0 GitHub release in 2016 and continued through the 2.x and
      3.x release lines. Later release notes show the project expanding beyond its
      original ECMAScript 5.1 baseline, while still tracking footprint and conformance
      as central engineering constraints.
  related-projects:
    - >
      JerryScript is related to IoT.js through the project site's Powering IoT.js link
      and to the OpenJS Foundation project family through OpenJS hosting.
  sources:
    - https://api.github.com/repos/jerryscript-project/jerryscript
    - https://github.com/jerryscript-project/jerryscript
    - https://github.com/jerryscript-project/jerryscript/releases
    - https://jerryscript.net/
    - https://openjsf.org/projects
  summary:
    - >
      JerryScript is a lightweight JavaScript engine for constrained Internet of Things
      devices. The project site and README emphasize microcontroller-class memory
      budgets, C99 portability, on-device compilation and execution, bytecode snapshots,
      and an embeddable C API.
  timeline:
    - '2015: Public GitHub repository created for jerryscript-project/jerryscript.'
    - '2016: JerryScript 1.0 released on GitHub.'
    - '2019: JerryScript 2.0 released on GitHub.'
    - '2024: JerryScript 3.0.0 release notes report broader ECMAScript feature coverage.'
  usage:
    - >
      The repository documents a simple source build with `python tools/build.py`,
      producing the `jerry` executable. Library users embed the engine through its C
      API, while the snapshot mechanism allows JavaScript source to be precompiled to
      bytecode before deployment.
related-packages:
  - id: brew:quickjs
    reason: >
      Choose QuickJS for a small embeddable engine with broader current ECMAScript
      coverage and a compiler that can turn JavaScript into standalone executables;
      JerryScript focuses more explicitly on microcontroller-class memory constraints.
    rel: alternative
    sources:
      - https://jerryscript.net/
      - https://bellard.org/quickjs/
      - https://bellard.org/quickjs/quickjs.html
  - id: brew:duktape
    reason: >
      Choose Duktape when an easily vendored C/C++ engine with an ES5-oriented
      compatibility baseline and compact portable integration is preferable to
      JerryScript's IoT-focused snapshot workflow.
    rel: alternative
    sources:
      - https://jerryscript.net/
      - https://duktape.org/
      - https://duktape.org/guide.html
category: language-runtime
package-manager:
  brew: jerryscript
  nix: jerryscript
package-manager-url: https://formulae.brew.sh/formula/jerryscript
license: Apache-2.0
