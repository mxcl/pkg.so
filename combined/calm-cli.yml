id: brew:calm-cli
display-name: CALM CLI
homepage: https://github.com/finos/architecture-as-code/tree/main/cli
repo: https://github.com/finos/architecture-as-code
docs:
  - https://github.com/finos/architecture-as-code/blob/main/cli/README.md
config-file-location:
  unix: ~/.calm.json
credentials-file-location: null
history:
  adoption-history:
    - >
      CALM grew inside the FINOS Architecture as Code community, with the project README
      noting that it was developed as part of the FINOS DevOps Automation Special
      Interest Group before becoming a top-level project. The monorepo layout encourages
      official tooling, schemas, widgets, hub services, and plugins to be developed
      together.
    - >
      The CLI is distributed through npm as @finos/calm-cli and through Homebrew as
      calm-cli, making the specification usable from ordinary developer terminals rather
      than only from documentation or web tools.
  package-nerd-significance:
    - >
      For package-manager people, calm-cli is an example of architecture governance
      moving into the same installable CLI layer as linters, schema validators, and doc
      generators. It packages a finance-industry open-source specification into a
      command that can run in local shells and CI.
    - >
      Its significance is less about raw install count and more about the emerging
      pattern: architecture diagrams and standards are becoming versioned artifacts with
      validators, generators, and package-manager distribution.
  project-history:
    - >
      The Architecture as Code repository was created under FINOS in November 2023 and
      contains the CALM specification plus official projects that use it. The repository
      README describes Architecture as Code as an effort to manage software architecture
      through a human- and machine-readable, version-controlled codebase.
    - >
      The CALM CLI is one of the monorepo projects. Its README describes commands for
      generating architecture documents from CALM patterns, validating architectures
      against patterns, comparing documents, generating documentation, rendering
      templates, and initializing AI assistance for CALM work.
  related-projects:
    - >
      The CALM specification, CALM Hub, CALM Hub UI, CALM Server, CALM AI, CALM widgets,
      CALM Guard, CALM Studio, and the CALM VS Code plugin are listed as related
      projects in the same FINOS monorepo.
    - >
      The broader comparison set is schema-driven developer tooling: JSON Schema
      validators, OpenAPI-style contract tools, ADR tooling, and documentation
      generators.
  sources:
    - https://api.github.com/repos/finos/architecture-as-code
    - https://api.github.com/repos/finos/architecture-as-code/releases
    - https://calm.finos.org/
    - https://github.com/finos/architecture-as-code
    - https://github.com/finos/architecture-as-code/blob/main/cli/README.md
    - input.json source_facts.package-manager
  summary:
    - >
      CALM CLI is the command-line interface for FINOS's Common Architecture Language
      Model, an Architecture as Code specification for defining, validating, comparing,
      templating, and documenting software architectures in a machine-readable form.
  timeline:
    - '2023: FINOS architecture-as-code repository is created on GitHub.'
    - >
      2024: Repository license and copyright identify the project as a FINOS Apache-2.0
      project.
    - >
      2025: CALM branding and documentation appear in the official repository and
      documentation site.
    - '2026: CLI v1.47.1 is published through the official GitHub releases feed.'
  usage:
    - >
      Typical use starts with installing the CLI, then running calm generate to create
      an architecture from a pattern, calm validate to check an architecture against a
      pattern, calm diff to compare CALM documents, and calm docify or calm template to
      turn CALM models into generated documentation or files.
    - >
      The CLI reads profile-level configuration from ~/.calm.json, with environment
      variables and command-line flags able to override settings such as remote host
      allowlists, authentication plugin paths, and CalmHub URLs.
related-packages: []
category: developer-tools
package-manager:
  brew: calm-cli
package-manager-url: https://formulae.brew.sh/formula/calm-cli
license: Apache-2.0
tags:
  - architecture-as-code
  - calm
  - cli
  - finos
  - schema-validation
description: CLI allows you to interact with the Common Architecture Language Model (CALM)
executables:
  - calm
provenance:
  formula: calm-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
