id: brew:gauge
display-name: Gauge
homepage: https://gauge.org
repo: https://github.com/getgauge/gauge
docs:
  - https://docs.gauge.org/
config-file-location:
  unix:
    - ~/.gauge/config/gauge.properties
    - <project_root>/env/default/default.properties
    - <project_root>/env/default/<language>.properties
    - <project_root>/manifest.json
  windows:
    - '%APPDATA%\gauge\config\gauge.properties'
    - <project_root>\env\default\default.properties
    - <project_root>\env\default\<language>.properties
    - <project_root>\manifest.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Gauge gained adoption among teams that wanted acceptance tests without
      Cucumber-style BDD ceremony. The official site and docs emphasize cross-platform
      use, CI/CD integration, language runners, IDE support, reports, and plugins. The
      README notes that official sponsorship ended in 2021 and that the project moved
      toward community-driven maintenance.
  package-nerd-significance:
    - >
      Gauge is package-manager interesting because the core CLI is only the entry point:
      useful installations often combine the main binary with language runners, reports,
      and IDE plugins. It is a good example of a Go command-line tool distributed as a
      package while delegating much of its runtime behavior to a plugin ecosystem.
  project-history:
    - >
      Gauge was built at ThoughtWorks to reduce the design overhead and maintenance
      burden of functional and acceptance test suites. The official project post
      introducing Gauge 1.0 describes a move from verbose test code toward reusable,
      refactorable steps written in business-readable text.
  related-projects:
    - >
      Gauge is closely related to its official language runners, report plugins, IDE
      plugins, and Taiko, which the Gauge site presents as a companion for browser
      automation.
  sources:
    - https://docs.gauge.org/
    - https://docs.gauge.org/overview.html
    - https://gauge.org/
    - https://gauge.org/2018/05/15/why-we-built-gauge/
    - https://gauge.org/plugins/
    - https://github.com/getgauge/gauge
  summary:
    - >
      Gauge is an open-source test automation framework for writing acceptance tests as
      executable documentation. Its central idea is to keep specifications readable in
      Markdown while binding steps to code in common programming languages.
  timeline:
    - '2014: The official Gauge repository was created.'
    - '2018: Gauge 1.0 was presented in the official project blog.'
    - >
      2021: Official sponsorship ended, and the README described a shift to
      community-driven maintenance.
    - >
      2020s: Gauge continues to document Markdown specifications, plugins, language
      runners, and editor integrations.
  usage:
    - >
      Typical use begins with `gauge init` for a language such as JavaScript, Java,
      Python, Ruby, or C#, followed by Markdown specifications under a project and
      `gauge run` to execute them. Gauge supports reusable steps, concepts, data-driven
      tests, plugins, reports, and language-server based editor features.
related-packages:
  - id: brew:cucumber-ruby
    reason: >
      Choose Cucumber-Ruby when a Ruby project needs Gherkin and a
      collaboration-centered BDD workflow; choose Gauge for Markdown specifications and
      test automation without prescribed Given/When/Then syntax.
    rel: alternative
    sources:
      - https://gauge.org/2018/05/15/why-we-built-gauge/
      - https://cucumber.io/docs/
      - https://cucumber.io/docs/installation/ruby
category: developer-tools
package-manager:
  brew: gauge
  chocolatey: gauge
  nix: gauge
  scoop: main/gauge
  winget: Gauge.Gauge
package-manager-url: https://formulae.brew.sh/formula/gauge
license: Apache-2.0
tags:
  - bdd
  - cli
  - executable-documentation
  - test-automation
description: Test automation tool that supports executable documentation
executables:
  - gauge
provenance:
  formula: gauge
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
