id: brew:fierce
display-name: fierce
homepage: https://github.com/mschwager/fierce
repo: https://github.com/mschwager/fierce
docs:
  - https://github.com/mschwager/fierce#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      fierce belongs to the pre-exploitation reconnaissance layer of security tooling.
      Its README explicitly frames it as a precursor to tools such as nmap, unicornscan,
      Nessus, and Nikto, because those scanners are more useful once likely IP space and
      hostnames are known.
    - >
      The supplied package metadata shows fierce packaged beyond Homebrew, including
      Debian, Ubuntu, and Nix. That distribution footprint fits a small CLI security
      utility that penetration testers and defenders can install quickly on Unix-like
      systems.
  package-nerd-significance:
    - >
      For package nerds, fierce is a recognizable example of a security tool whose
      cultural value is larger than its code size: it wraps a focused reconnaissance
      workflow into a single installable command and carries lineage from the older
      ha.ckers.org-era Perl security-tool ecosystem into Python 3 packaging.
  project-history:
    - >
      The modern fierce repository describes the project as a Python 3 conversion of the
      original fierce tool by RSnake and others at ha.ckers.org. The repository keeps
      the older Perl script under scripts/fierce.pl, where the banner identifies Fierce
      v0.9.9 beta dated March 24, 2007 and credits RSnake with threading and additions
      by IceShaman.
    - >
      The Python rewrite kept the core reconnaissance idea but modernized the packaging
      and runtime around Python tooling. The README presents pip installation, direct
      source checkout, Poetry development setup, pytest testing, flake8 linting, and
      coverage commands.
  related-projects:
    - >
      The project documentation positions fierce before tools such as nmap, unicornscan,
      Nessus, and Nikto in a reconnaissance workflow. Its operating domain also overlaps
      with DNS zone-transfer testing and subdomain discovery tools.
  sources:
    - https://github.com/mschwager/fierce#readme
    - https://github.com/mschwager/fierce/blob/master/scripts/fierce.pl
  summary:
    - >
      fierce is a DNS reconnaissance command-line tool used to locate non-contiguous IP
      space and hostnames for a target domain before deeper scanning.
  timeline:
    - '2007: The preserved Perl script identifies Fierce v0.9.9 beta dated March 24, 2007.'
    - >
      Python 3 era: The maintained repository describes itself as a Python 3 conversion
      to simplify and modernize the codebase.
    - >
      Packaging note: The README documents pip installation and standard Python
      development commands.
  usage:
    - >
      The README examples center on DNS lookups rather than exploitation. Typical use
      starts with a domain and a subdomain list, then optionally traverses nearby IPs,
      restricts nearby lookups to selected domains, attempts HTTP connections on
      discovered names, widens searches across a /24, checks zone-transfer exposure,
      redirects output to a file, or scans an internal address range against a chosen
      DNS server.
    - >
      The original description, preserved in the README, is careful about scope: fierce
      is meant to identify likely targets inside and outside a corporate network through
      DNS, not to indiscriminately scan the internet or exploit hosts.
related-packages:
  - id: brew:nmap
    reason: >
      Run Fierce first to discover likely hostnames and address ranges, then use Nmap to
      scan the resulting targets for ports and services.
    rel: adjacent_workflow
    sources:
      - https://github.com/mschwager/fierce#readme
      - https://nmap.org/book/man.html
category: security
