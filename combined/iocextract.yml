id: brew:iocextract
display-name: iocextract
homepage: https://inquest.readthedocs.io/projects/iocextract/en/latest/
repo: https://github.com/InQuest/iocextract
docs:
  - https://inquest.readthedocs.io/projects/iocextract/en/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The docs list InQuest and PacketTotal as users and point analysts who need
      automation beyond extraction toward InQuest's ThreatIngestor. The Homebrew and Nix
      packaging in the input facts show the tool leaving Python-only workflows and
      becoming available as a command-line package.
  package-nerd-significance:
    - >
      The package is significant because it encodes a practical security convention:
      dangerous observables are often intentionally mangled before publication. A
      package manager shipping iocextract gives shell pipelines and incident-response
      scripts a reusable way to reverse that convention without every analyst copying
      fragile regexes.
  project-history:
    - >
      The project documentation frames iocextract around a specific analyst problem:
      simple regular expressions miss indicators that have been defanged to avoid
      accidental clicks or live requests. iocextract combines custom regexes and
      post-processing so those strings can be detected and optionally refanged.
    - >
      The GitHub release history shows continuing feature and bug-fix releases,
      including work around URL/IP extraction and CLI input sources. The documentation
      links the repository, PyPI package, issue tracker, and changelog, which is typical
      of a Python security utility distributed both as a library and as an executable
      command.
  related-projects:
    - >
      ThreatIngestor is the InQuest project suggested for automated IOC extraction,
      enrichment, and export workflows.
    - >
      Cacador, ioc-extractor, and Cyobstract are listed by the docs as similar IOC
      extraction projects.
    - plyara is called out for users working with YARA rules.
  sources:
    - https://formulae.brew.sh/formula/iocextract
    - https://github.com/InQuest/iocextract
    - https://github.com/InQuest/iocextract/releases
    - https://inquest.readthedocs.io/projects/iocextract/en/latest/
    - https://pypi.org/project/iocextract/
  summary:
    - >
      iocextract is an InQuest Python library and CLI for extracting indicators of
      compromise from text, including deliberately defanged URLs, IP addresses, email
      addresses, hashes, and YARA rules. It sits in the security-automation niche where
      analysts need to turn threat reports, tweets, notes, and pasted text into
      machine-readable observables.
  timeline:
    - '2018: Public PyPI releases establish iocextract as an installable Python IOC extractor.'
    - >
      2019-2023: InQuest-hosted documentation presents the library, CLI, related
      projects, and users.
    - >
      2023: v1.16.x releases add CLI extraction from remote data sources and fix URL/IP
      extraction behavior.
    - >
      Package-manager era: Homebrew and Nix provide package installs for the
      `iocextract` executable.
  usage:
    - >
      iocextract can be used as a Python iterator-based library or as the `iocextract`
      command. The CLI reads from standard input or files, extracts selected IOC
      classes, supports custom regex files, and can refang supported URLs, emails, and
      IPv4 addresses when an analyst wants normalized output.
related-packages: []
category: security
package-manager:
  brew: iocextract
  nix: iocextract
package-manager-url: https://formulae.brew.sh/formula/iocextract
license: GPL-2.0-only
tags:
  - cli
  - defang
  - ioc
  - security
  - threat-intelligence
description: Defanged indicator of compromise extractor
executables:
  - iocextract
provenance:
  formula: iocextract
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
