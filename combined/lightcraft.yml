id: cask:lightcraft
display-name: LightCraft
homepage: https://getartcraft.com/apps/lightcraft
repo: https://github.com/storytold/lightcraft
docs:
  - https://getartcraft.com/apps/lightcraft
  - https://github.com/storytold/lightcraft#readme
config-file-location:
  linux: '$XDG_CONFIG_HOME/lightcraft/ (default: ~/.config/lightcraft/)'
  macos: ~/Library/Application Support/LightCraft/
  windows: '%APPDATA%\LightCraft\'
credentials-file-location: null
history:
  adoption-history:
    - >
      LightCraft is distributed for macOS, Windows, and Linux, with a browser build,
      native packages, and a headless CLI. The supplied package metadata records its
      availability through the Homebrew cask `lightcraft`.
  package-nerd-significance:
    - >
      LightCraft is notable for packaging a broad photographic workflow—raw decoding,
      cataloguing, nondestructive development, masking, metadata, GPU rendering, CLI
      automation, and an MCP interface—inside a native Rust workspace. Its local-only
      model also avoids account, cloud, telemetry, and subscription dependencies.
  project-history:
    - >
      LightCraft was created by the ArtCraft team as an open-source, clean-room
      photo-library manager and raw developer written in Rust. The project implements
      its own raw support and a scene-referred, wide-gamut, 32-bit floating-point
      development pipeline while leaving original photographs untouched.
  related-projects:
    - >
      LightCraft is part of ArtCraft's Crafting Apps family with PhotoCraft,
      VectorCraft, FilmCraft, PdfCraft, EffectCraft, and DesignCraft. It occupies the
      photo-catalogue and raw-development role in that suite.
  sources:
    - 'Official Crafting Apps overview: https://getartcraft.com/apps'
    - 'Official product page: https://getartcraft.com/apps/lightcraft'
    - 'Official releases: https://github.com/storytold/lightcraft/releases'
    - 'Official repository and README: https://github.com/storytold/lightcraft'
    - 'Package provenance: source_facts.package-manager and source_facts.provenance'
  summary:
    - >
      LightCraft is an open-source photo library and nondestructive raw-image developer
      built in Rust. It combines cataloguing, fielded search, raw decoding, tonal and
      color adjustments, masks, presets, and local export without requiring a cloud
      account.
  timeline:
    - '2026-10-02: The official GitHub release history records LightCraft v0.1.0.'
    - >
      2026-10: Official distribution covered native desktop packages, a command-line
      renderer, and a WebAssembly build.
  usage:
    - >
      Users can manage a persistent photo library, import folders, rate and organize
      photographs, apply nondestructive adjustments and masks, and export developed
      images. The application also exposes a CLI, JSON control channel, and MCP server
      for batch processing and agent-driven workflows.
category: media
package-manager:
  brew-cask: lightcraft
package-manager-url: https://formulae.brew.sh/cask/lightcraft
tags:
  - desktop-app
  - gpu-accelerated
  - local-first
  - non-destructive-editing
  - open-source
  - photo-editor
  - photo-management
  - raw-developer
  - rust
description: Photo library manager and raw image developer
applications:
  - LightCraft.app
provenance:
  cask: lightcraft
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
