id: brew:tmate
display-name: tmate
homepage: https://tmate.io/
repo: https://github.com/tmate-io/tmate
docs:
  - https://github.com/tmate-io/tmate#readme
  - https://tmate.io/
config-file-location:
  unix: ~/.tmate.conf
credentials-file-location:
  unix: ~/.tmate.conf
history:
  adoption-history:
    - >
      tmate has unusually broad package-manager reach for a terminal collaboration tool.
      The supplied source facts list packages for Homebrew, Debian, Ubuntu, Fedora/DNF,
      Arch/pacman, Alpine, openSUSE/zypper, MacPorts, and Nix.
    - >
      That adoption pattern fits its niche: tmate is most useful when it can be
      installed quickly on whatever Unix-like system is in front of the user, often
      during debugging, pairing, support, or remote access work.
  package-nerd-significance:
    - >
      tmate is significant because it turned a common terminal workflow into a
      packageable collaboration primitive. For package-manager users, it is the
      difference between preparing accounts, keys, VPNs, or screen-sharing software and
      installing one CLI that speaks the terminal-native language they already use.
    - >
      Its availability across many package ecosystems also made it a common building
      block for remote support and development workflows where the host system may be
      macOS, Linux, a container, or a CI-like shell.
  project-history:
    - >
      tmate took the terminal multiplexer model familiar to tmux users and added a
      remote-pairing workflow. That made the project legible to command-line developers
      immediately: it kept the tmux mental model while changing the distribution problem
      from 'how do I SSH into this machine?' to 'how do I share this live session?'.
    - >
      The main repository has accumulated thousands of commits and the GitHub project
      page reports more than six thousand stars. Its official release page lists a small
      set of packaged releases, with tmate 2.4.0 shown as the latest release in November
      2019.
    - >
      The tmate organization also publishes server-side components such as
      tmate-ssh-server, tmate-master, tmate-websocket, and tmate-kube. That split
      reflects the project's two-sided nature: a client CLI for users and infrastructure
      pieces for hosted or self-hosted terminal sharing.
  related-projects:
    - >
      tmux is the upstream-style terminal multiplexer lineage named directly by the
      tmate README.
    - >
      tmate-ssh-server, tmate-master, tmate-websocket, and tmate-kube are official
      tmate-io repositories for the service and self-hosting side of the ecosystem.
  sources:
    - https://github.com/tmate-io
    - https://github.com/tmate-io/tmate#readme
    - https://github.com/tmate-io/tmate/releases
    - input.source_facts.package-manager
  summary:
    - >
      tmate is an instant terminal-sharing tool built from tmux. Its official README
      describes it as a fork of tmux that provides an instant pairing solution.
  timeline:
    - '2019: GitHub releases list tmate 2.4.0 as the latest release, dated November 16, 2019.'
    - '2026: The GitHub project page reports about 6.1k stars and hundreds of forks.'
    - >
      2026: The batch source facts list tmate packages across Homebrew, major Linux
      distributions, MacPorts, and Nix.
  usage:
    - >
      In day-to-day package-nerd use, tmate is installed as a small terminal command and
      launched when a session needs to be shared. Because it is rooted in tmux, users
      get a familiar pane/session environment while collaborators connect through the
      tmate service or self-hosted tmate infrastructure.
    - >
      Its practical role overlaps remote pairing, live troubleshooting, and ephemeral
      access. The package matters less as a long-running daemon and more as a tool users
      can install from the local package manager when they need a secure shared terminal
      immediately.
category: developer-tools
package-manager:
  apk: tmate
  brew: tmate
  debian: tmate
  dnf: tmate
  macports: tmate
  nix: tmate
  pacman: tmate
  ubuntu: tmate
  zypper: tmate
package-manager-url: https://formulae.brew.sh/formula/tmate
license: ISC
tags:
  - cli
  - collaboration
  - remote-pairing
  - ssh
  - terminal-sharing
  - tmux
description: Instant terminal sharing
executables:
  - tmate
provenance:
  formula: tmate
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
