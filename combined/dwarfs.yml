id: brew:dwarfs
display-name: DwarFS
homepage: https://github.com/mhx/dwarfs
repo: https://github.com/mhx/dwarfs
docs:
  - https://github.com/mhx/dwarfs#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DwarFS adoption is strongest among users with highly redundant trees: many
      software builds, versioned runtimes, large asset collections, backups, and
      archives where mountable access matters. The README includes package-maintainer
      notes, release-download badges, a Homebrew installs badge, a Repology packaging
      badge, related projects, and notable users.
    - >
      The input metadata lists Homebrew, Nix, and zypper packages. That package-manager
      footprint is important because DwarFS is a native filesystem/archive tool with
      FUSE and compression-library concerns; reproducible distribution builds make it
      easier to deploy than ad hoc source builds.
  package-nerd-significance:
    - >
      DwarFS is package-nerd significant because it is a modern alternative in a class
      usually dominated by SquashFS, tarballs, zip files, and container/image formats.
      It is especially interesting when the package is not just a compressor but a
      filesystem image format plus FUSE driver plus inspection/extraction tools.
    - >
      It also illustrates why package managers matter for systems tools: users need
      compatible FUSE support, compression libraries, platform-specific builds, and
      command-line utilities installed together.
  project-history:
    - >
      Marcus Holland-Moritz writes in the README that he started working on DwarFS in
      2013 because several hundred Perl installations were consuming about 30 GB, and
      existing compressed filesystems either did not compress well enough or were too
      slow and unstable for his use case.
    - >
      The public GitHub repository was created in November 2020, and GitHub release
      metadata records release-0.1.0 the same month. By 2026, the project had grown into
      a multi-platform filesystem with mkdwarfs for image creation, dwarfs for mounting,
      dwarfsextract for extraction, and dwarfsck for inspection and checksums.
    - >
      The README is unusually benchmark-heavy: it compares DwarFS with tar/gzip, 7-Zip,
      SquashFS, lrzip, zpaq, wimlib, Cromfs, EROFS, and fuse-archive across redundant
      Perl installations, CI artifacts, game audio assets, and other datasets.
  related-projects:
    - >
      The README compares DwarFS with SquashFS, Cromfs, EROFS, lrzip, zpaq, zpaqfranz,
      wimlib, fuse-archive, tar/gzip, and 7-Zip.
    - >
      Related runtime/package-image projects named by the README include PELF and
      uruntime, which mention DwarFS support.
  sources:
    - https://github.com/mhx/dwarfs#readme
    - https://github.com/mhx/dwarfs/blob/main/doc/mkdwarfs.md
    - https://api.github.com/repos/mhx/dwarfs
    - https://api.github.com/repos/mhx/dwarfs/releases
  summary:
    - >
      DwarFS is a high-compression read-only filesystem for Linux, FreeBSD, macOS, and
      Windows. Its README frames it as a mountable archive optimized for fast random
      reads and strong space savings on redundant data.
  timeline:
    - '2013: Work on DwarFS begins, according to the README history section.'
    - '2020: The public GitHub repository is created and release-0.1.0 is published.'
    - '2026: GitHub release metadata records v0.15.3.'
  usage:
    - >
      The basic workflow is mkdwarfs -i /path/to/input/dir -o image.dwarfs, then dwarfs
      image.dwarfs /path/to/mountpoint to mount it. Users can extract with dwarfsextract
      and inspect or checksum images with dwarfsck.
    - >
      DwarFS is read-only when mounted, so it is used more like a compressed, mountable
      artifact store than a writable filesystem. Its tuning knobs cover compression
      level, block size, categorization, worker counts, memory limits, duplicate segment
      search, and related compression-performance tradeoffs.
related-packages:
  - id: brew:squashfs
    reason: >
      Choose SquashFS for the established Linux compressed read-only filesystem
      ecosystem; choose DwarFS when cross-file similarity and deduplication can
      materially improve compression, accepting a newer format and tooling stack.
    rel: alternative
    sources:
      - https://github.com/mhx/dwarfs#comparison-with-squashfs
      - https://github.com/plougher/squashfs-tools
category: system
package-manager:
  brew: dwarfs
  nix: dwarfs
  zypper: dwarfs
package-manager-url: https://formulae.brew.sh/formula/dwarfs
license: GPL-3.0-or-later
tags:
  - cli
  - compression
  - deduplication
  - filesystem
  - fuse
  - read-only
description: Fast high compression read-only file system for Linux, Windows, and macOS
executables:
  - dwarfsck
  - dwarfsextract
  - mkdwarfs
provenance:
  formula: dwarfs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
