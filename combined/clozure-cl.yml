id: brew:clozure-cl
display-name: Clozure CL
homepage: https://ccl.clozure.com
repo: https://github.com/Clozure/ccl
docs:
  - https://ccl.clozure.com/docs
  - https://ccl.clozure.com/docs/static/ccl.html
  - https://github.com/Clozure/ccl#readme
config-file-location:
  unix:
    - ~/ccl-init.lisp
    - ~/.ccl-init.lisp
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site describes Clozure CL as available across macOS, Linux, FreeBSD,
      illumos, and Windows, which made it a portable Common Lisp for users who wanted
      native threads, fast compilation, a compacting generational garbage collector, and
      a foreign-function interface.
    - >
      For package managers, Clozure CL matters as a long-lived Lisp runtime that exposes
      a simple `ccl64` executable while carrying decades of Mac Lisp lineage into
      Unix-style packaging.
  package-nerd-significance:
    - >
      Clozure CL is unusually interesting to package maintainers because it is
      self-hosting, historically tied to Macintosh Lisp, and packaged as a full language
      runtime rather than a small utility.
    - >
      Its init-file behavior and architecture-specific binaries are the sort of details
      that make Lisp implementations visible in Homebrew and other Unix packaging
      ecosystems.
  project-history:
    - >
      The official history traces CCL back to Coral Software's 1984 work on Coral Common
      Lisp for the Macintosh. CCL 1.0 shipped in 1987 for the Macintosh Plus, then the
      line passed through Macintosh Allegro Common Lisp and Apple's Macintosh Common
      Lisp.
    - >
      Apple transferred MCL to Digitool in 1994 during the PowerPC transition, and
      Digitool released a PowerPC version around 1995. A JPL effort later licensed MCL
      source for PowerPC robotics and flight-system work; Gary Byers ported the compiler
      and runtime to VxWorks and LinuxPPC in 1998.
    - >
      Digitool agreed in 2001 to open source the JPL work, creating OpenMCL. In 2007,
      OpenMCL was renamed Clozure CL to avoid confusion with the newly open sourced
      original MCL code.
  related-projects:
    - >
      Coral Common Lisp, Macintosh Allegro Common Lisp, Macintosh Common Lisp, and
      OpenMCL are direct predecessors in the official history.
    - CCLDoc is the documentation format/project referenced by the official Clozure CL site.
  sources:
    - https://ccl.clozure.com/history.html
    - https://ccl.clozure.com/
    - https://github.com/Clozure/ccl#readme
    - https://github.com/Clozure/ccl/releases
  summary:
    - >
      Clozure CL is a free Common Lisp implementation with roots in Macintosh Common
      Lisp and OpenMCL.
  timeline:
    - '1984: Coral Software began Coral Common Lisp for the Macintosh.'
    - '1987: CCL 1.0 was released for a 1 MB Macintosh Plus.'
    - '1988: Coral was acquired by Apple, and the Lisp became Macintosh Common Lisp.'
    - '1994: Apple transferred MCL to Digitool.'
    - '1998: A JPL-backed port of the MCL compiler and runtime reached VxWorks and LinuxPPC.'
    - '2001: Digitool agreed to open source the JPL work, creating OpenMCL.'
    - '2007: OpenMCL was renamed Clozure CL.'
    - '2017: GitHub releases include Clozure CL 1.11.'
  usage:
    - >
      Users run `ccl64` for the Clozure CL listener/compiler and can build CCL from
      source using an already-working CCL, because the implementation is written in
      itself.
    - >
      The project documents user support through the ccl-devel mailing list, IRC, GitHub
      issues, and release downloads from GitHub.
category: language-runtime
package-manager:
  brew: clozure-cl
package-manager-url: https://formulae.brew.sh/formula/clozure-cl
license: Apache-2.0
tags:
  - cli
  - common-lisp
  - compiler
  - implementation
  - programming-language
  - runtime
description: Common Lisp implementation with a long history
executables:
  - ccl64
provenance:
  formula: clozure-cl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
