id: brew:bazarr
display-name: Bazarr
homepage: https://www.bazarr.media
repo: https://github.com/morpheus65535/bazarr
docs:
  - https://wiki.bazarr.media/
config-file-location:
  unix:
    - /config
    - data directory inside bazarr root directory
  windows: '%programdata%\Bazarr'
credentials-file-location:
  unix:
    - /config/config/config.yaml
    - <Bazarr data directory>/config/config.yaml
  windows: '%ProgramData%\Bazarr\config\config.yaml'
history:
  adoption-history:
    - >
      Bazarr's adoption follows Sonarr and Radarr users rather than general-purpose CLI
      users. Its README lists support for Windows, Linux, macOS, Raspberry Pi, many
      subtitle languages, many subtitle providers, and a UI based on Sonarr.
    - >
      The repository page showed about 4.1k stars, 361 forks, and 178 releases at
      enrichment time, with v1.5.6 listed as the latest release on February 26, 2026.
      Input metadata lists Homebrew, Nix, and winget packages.
  package-nerd-significance:
    - >
      Bazarr is a useful package-history example because it is nominally a
      media-management app but is packaged by CLI-oriented managers such as Homebrew and
      winget for users who run personal media automation stacks on servers, NAS boxes,
      and desktops.
    - >
      Its significance comes from filling a precise gap in the *arr ecosystem: Sonarr
      and Radarr know what media exists, while Bazarr specializes in subtitles and
      provider integration.
  project-history:
    - >
      The upstream README defines Bazarr by its place in the *arr media stack: it does
      not scan disks to discover series or movies, but instead acts on items indexed in
      Sonarr and Radarr.
    - >
      The project homepage and wiki frame Bazarr as an automated subtitle manager with
      automatic search, manual search, subtitle upgrade, and user guides for
      installation and configuration.
  related-projects:
    - Sonarr and Radarr are Bazarr's primary companion services.
    - The broader Servarr/*arr ecosystem is related through media-library automation.
    - >
      Subtitle providers such as OpenSubtitles, Podnapisi, Addic7ed, and many regional
      sources are part of Bazarr's operational ecosystem.
  sources:
    - https://github.com/morpheus65535/bazarr
    - https://github.com/morpheus65535/bazarr/releases
    - https://wiki.bazarr.media/Getting-Started/Setup-Guide/
    - https://www.bazarr.media/
    - source_facts.package-manager
  summary:
    - >
      Bazarr is a companion application for Sonarr and Radarr that manages subtitle
      discovery, download, upgrade, and history for TV and movie libraries already
      indexed by those tools.
  timeline:
    - '2021: Bazarr wiki copyright footer indicates the current MkDocs-based documentation era.'
    - '2026: Repository page lists v1.5.6 as latest release on February 26.'
    - '2026: June beta releases continue adding subtitle provider and synchronization changes.'
  usage:
    - >
      Bazarr is used after Sonarr and Radarr are already configured. Users connect
      Bazarr to those services, map paths when the services see media through different
      filesystem paths, define subtitle language preferences, and let it search,
      download, upgrade, and record subtitle activity.
    - >
      The project supports automatic and manual subtitle searches, existing-library
      scans for internal and external subtitles, provider-specific configuration, and
      subtitle synchronization workflows.
related-packages:
  - id: cask:plex-media-server
    reason: >
      Choose Plex Media Server to catalog and stream the media whose subtitles Bazarr
      manages; Bazarr documents an integration for refreshing Plex libraries after
      subtitle changes.
    rel: adjacent_workflow
    sources:
      - https://wiki.bazarr.media/Additional-Configuration/Plex/
      - https://support.plex.tv/articles/200288286-what-is-plex/
category: media
package-manager:
  brew: bazarr
  nix: bazarr
  winget: Morpheus.Bazarr
package-manager-url: https://formulae.brew.sh/formula/bazarr
license: GPL-3.0-or-later
tags:
  - cli
  - media-management
  - radarr
  - sonarr
  - subtitles
description: Companion to Sonarr and Radarr for managing and downloading subtitles
executables:
  - bazarr
provenance:
  formula: bazarr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
