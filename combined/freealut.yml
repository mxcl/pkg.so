id: brew:freealut
display-name: freealut
homepage: https://github.com/vancegroup/freealut
repo: https://github.com/vancegroup/freealut
docs:
  - https://github.com/vancegroup/freealut#readme
  - https://github.com/vancegroup/freealut/tree/master/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      freealut remained useful because OpenAL examples and small applications needed a
      portable ALUT implementation after old platform-specific OpenAL/ALUT coupling
      became obsolete. The input package metadata shows it packaged across many systems,
      including Alpine, Homebrew, Debian/Ubuntu, Fedora, MacPorts, Nix, Arch, and
      openSUSE.
  package-nerd-significance:
    - >
      freealut is package-nerd significant because it is a compatibility library whose
      value is mostly historical and build-system practical: it preserves the separated
      ALUT API, ships the free implementation that distributions can package, and keeps
      old OpenAL tutorials and demos buildable on modern systems.
  project-history:
    - >
      The ALUT reference manual states that in August 2005 ALUT was an undocumented
      semi-portable set of functions mixed into the OpenAL distribution, and that the
      cleanup effort separated it into its own library with a new 1.0.0 line. The
      release history in the manual lists versions 1.0.0 through 1.1.0 between August
      2005 and April 2006.
    - >
      The current GitHub repository began as a git-svn mirror created by Rylie Pavlik to
      browse history and clean up the build system. Its README says the repository
      eventually became the de-facto upstream after the original disappeared, with an
      updated CMake build and minor build-related fixes, but also describes the project
      as essentially complete and mostly unmaintained.
  related-projects:
    - >
      Related projects include OpenAL itself, the original ALUT API, CMake, legacy
      autotools and Visual Studio build files, and applications or demos that use ALUT
      for portable OpenAL startup and sample loading.
  sources:
    - https://api.github.com/repos/vancegroup/freealut
    - https://github.com/vancegroup/freealut
    - https://github.com/vancegroup/freealut/blob/master/AUTHORS
    - https://github.com/vancegroup/freealut/blob/master/ChangeLog
    - https://github.com/vancegroup/freealut/blob/master/doc/alut.html
  summary:
    - >
      freealut is a free implementation of the OpenAL Utility Toolkit, the helper
      library commonly used to initialize OpenAL examples and load simple audio data.
      Its modern GitHub README presents the repository as a lightly updated continuation
      of an older upstream that disappeared.
  timeline:
    - '2005: ALUT cleanup documented as a separate library effort.'
    - '2005: ALUT 1.0.0 reference-manual release listed for August 14.'
    - '2005: freealut 1.0.0 tag recorded in ChangeLog in December.'
    - '2006: freealut 1.0.1 released in February.'
    - '2006: freealut 1.1.0 released in June.'
    - '2011: GitHub repository created from git-svn mirror lineage.'
    - >
      2024: README updated to describe de-facto upstream status and mostly unmaintained
      project state.
  usage:
    - >
      Application authors include AL/alut.h, link against OpenAL and ALUT, and use ALUT
      helpers for initialization, shutdown, sleeping, version checking, and loading
      sound sample data. The README now recommends CMake for modern builds while keeping
      deprecated autotools and Visual Studio instructions for older workflows.
related-packages:
  - id: brew:openal-soft
    reason: >
      Use OpenAL Soft as the OpenAL implementation beneath freealut; freealut's official
      build documentation requires OpenAL, while OpenAL Soft provides the cross-platform
      core audio API that ALUT supplements.
    rel: adjacent_workflow
    sources:
      - https://github.com/vancegroup/freealut#readme
      - https://github.com/kcat/openal-soft
      - https://openal-soft.org/
category: media
