id: brew:dnote
display-name: Dnote
homepage: https://www.getdnote.com
repo: https://github.com/dnote/dnote
docs:
  - https://www.getdnote.com/
config-file-location:
  unix: $XDG_CONFIG_HOME/dnote/dnoterc
credentials-file-location: null
history:
  adoption-history:
    - >
      Dnote appeals to users who want note capture to live next to shell history,
      editors, and command snippets rather than in a heavy graphical notebook. Its
      cross-platform binary distribution and Homebrew install path make it a natural fit
      for developer workstations.
  package-nerd-significance:
    - >
      Dnote is interesting to package people because it turns personal knowledge
      management into a small CLI plus one SQLite file. That keeps the deployment story
      close to other beloved terminal tools: one binary, local data, optional network
      service.
  project-history:
    - >
      The official site and README describe Dnote as free and open source since 2017.
      The project has evolved around a single-binary CLI, local SQLite storage, and an
      optional server with REST API access for syncing notes between devices.
  related-projects:
    - Dnote server provides optional synchronization and API access.
    - >
      Other terminal note tools such as nb occupy the same command-line
      knowledge-management space.
  sources:
    - https://www.getdnote.com/
    - https://www.getdnote.com/docs/server/
    - https://github.com/dnote/dnote
    - https://github.com/dnote/dnote/releases
  summary:
    - >
      Dnote is a command-line notebook for capturing and searching technical notes from
      the terminal. It stores notes locally in SQLite and can optionally sync through a
      self-hosted server.
  timeline:
    - '2017: Dnote begins as a free and open-source command-line notebook.'
    - '2025: Server v3.0.0 moves self-hosting to SQLite and a single-binary setup.'
    - >
      2026: The official site presents Dnote as a terminal-first notebook with
      self-hosted sync.
  usage:
    - >
      The README's core loop is add, view, find, and sync: add a note to a book, view
      notes in that book, full-text search past notes, and sync when a server is
      configured. The server documentation covers self-hosting for users who want
      multi-device access without relying on a third-party service.
related-packages:
  - id: brew:nb
    reason: >
      Choose nb when you prefer plain-text notes, Git-based versioning and
      synchronization, bookmarking, and extensive shell integrations; choose Dnote for a
      smaller SQLite-backed notebook with an optional dedicated sync server.
    rel: alternative
    sources:
      - https://github.com/dnote/dnote
      - https://github.com/xwmx/nb
category: productivity
package-manager:
  apk: dnote
  brew: dnote
  nix: dnote
package-manager-url: https://formulae.brew.sh/formula/dnote
license: Apache-2.0
tags:
  - cli
  - knowledge-management
  - notebook
  - notes
description: Simple command-line notebook
executables:
  - dnote
provenance:
  formula: dnote
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
