id: brew:basex
display-name: BaseX
homepage: https://basex.org
repo: https://github.com/BaseXdb/basex
docs:
  - https://docs.basex.org/main/Main_Page
config-file-location:
  unix:
    - $BASEX_HOME/.basex
    - $BASEX_HOME/.basexgui
credentials-file-location:
  unix: $DBPATH/users.xml
history:
  adoption-history:
    - >
      BaseX's adoption is strongest in XML-heavy environments: digital humanities,
      publishing, standards work, data transformation, and teams with large XML, HTML,
      JSON, CSV, or binary corpora that benefit from XQuery. The batch input shows
      packaging across Homebrew, Debian, Ubuntu, MacPorts, and Nix, which is a broad
      footprint for a specialist XML database.
    - >
      The official docs also point users to mailing lists, Stack Overflow, and GitHub
      issues, showing the classic mature open source support surface: packaged binaries
      for users, documentation for XQuery/database work, and public project channels for
      bug reports and discussions.
  package-nerd-significance:
    - >
      BaseX matters to package nerds because XML database tooling is a niche with a long
      memory. A small, BSD-licensed, Java-based XML database that ships useful CLIs, a
      GUI, and server modes fills a different slot than general SQL databases, document
      stores, or one-off XML command-line filters.
    - >
      It is also a good example of why package managers keep specialist academic-origin
      tools alive: the user base may be smaller than for mainstream databases, but
      repeatable installation matters when a workflow depends on XQuery conformance,
      local XML collections, and command-line automation.
  project-history:
    - >
      The official BaseX site describes the project as a high-performance XML database
      engine and XQuery processor with W3C Update and Full Text support. The official
      about page says BaseX started as a university research project whose development
      has been accompanied by publications, conference articles, and academic theses.
    - >
      The project later became a maintained open source product around a broader XML
      framework. Its documentation describes the current BaseX 12 release, the GUI,
      client/server architecture, RESTXQ web application support, storage internals, and
      developer APIs, while the README points to GitHub as the official source-code
      location.
  related-projects:
    - >
      Related tools and standards include XQuery, XPath, W3C Update, W3C Full Text,
      RESTXQ, XML database systems, and general XML processing tools. In package-manager
      ecosystems, BaseX sits near Saxon, eXist-db, XMLStarlet, and libxml2-based
      command-line XML utilities.
  sources:
    - >
      Official README lists console, server, client, and GUI entry points and links
      GitHub source.
    - Official about page says BaseX started as a university research project.
    - >
      Official docs describe BaseX 12, XQuery, GUI, client/server architecture, RESTXQ,
      storage, and developer APIs.
    - >
      Official homepage describes BaseX as a high-performance XML database engine and
      XQuery processor.
    - >
      input.source_facts.package-manager lists Homebrew, Debian, Ubuntu, MacPorts, and
      Nix packaging.
  summary:
    - >
      BaseX is a lightweight XML database engine and XQuery processor. In
      package-manager terms, it is the compact Java XML stack you install when you want
      a local command-line XQuery processor, an XML database server, a GUI, and
      HTTP/REST tooling without deploying a larger enterprise XML platform.
  timeline:
    - >
      2000s: BaseX begins as a university research project, according to the official
      about page.
    - >
      2010s: BaseX grows into an open source XML database with CLI, GUI, client/server,
      and HTTP interfaces.
    - '2025: Official documentation describes BaseX 12 as the current release line.'
    - '2026: The official site lists BaseX 12.4 as a current download.'
  usage:
    - >
      Users run BaseX as a console XQuery processor, a server, a command-line client, a
      GUI application, or an HTTP service. The README lists `BaseX`, `BaseXServer`,
      `BaseXClient`, and `BaseXGUI` entry points, and the batch input maps those roles
      to Homebrew executables such as `basex`, `basexserver`, `basexclient`, `basexgui`,
      and `basexhttp`.
    - >
      Common package-manager usage is installing BaseX to evaluate XQuery locally, run a
      lightweight XML database server, develop RESTXQ applications, or inspect XML
      collections through the GUI. Configuration is exposed through BaseX home files
      such as `.basex` and `.basexgui`.
related-packages: []
category: data
package-manager:
  brew: basex
  debian: basex
  macports: basex
  nix: basex
  ubuntu: basex
package-manager-url: https://formulae.brew.sh/formula/basex
license: BSD-3-Clause
tags:
  - cli
  - database
  - xml
  - xpath
  - xquery
description: Light-weight XML database and XPath/XQuery processor
executables:
  - basex
  - basexclient
  - basexgui
  - basexhttp
  - basexhttpstop
  - basexserver
  - basexserverstop
provenance:
  formula: basex
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
