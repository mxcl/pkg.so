id: brew:docker-buildx
display-name: Docker Buildx
homepage: https://docs.docker.com/buildx/working-with-buildx/
repo: https://github.com/docker/buildx
docs:
  - https://docs.docker.com/build
  - https://docs.docker.com/reference/cli/docker/buildx
config-file-location:
  unix: buildkitd.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Buildx moved from an advanced plugin into ordinary Docker build practice. The
      README states that Docker Desktop includes Buildx on Windows and macOS, and that
      Docker Engine package repositories provide Docker Buildx packages for Linux. The
      batch input shows broad downstream packaging across Homebrew, Debian, Fedora-style
      distributions, Nix, Arch, Scoop, Ubuntu, winget, and zypper.
  package-nerd-significance:
    - >
      Buildx is one of the most important Docker-adjacent packages because it made
      BuildKit's advanced build graph usable from the Docker CLI. For package nerds, it
      also illustrates the modern Docker CLI-plugin model: a separate executable named
      docker-buildx can be installed by a package manager and discovered by Docker as a
      subcommand.
  project-history:
    - >
      Buildx grew out of Docker's shift from the classic image builder toward BuildKit.
      Rather than replacing docker build with a separate tool, Buildx kept a familiar
      command-line shape while exposing BuildKit features such as named builders, remote
      drivers, multi-platform output, cache controls, Bake files, and registry image
      tools.
  related-projects:
    - >
      Buildx is tightly related to BuildKit, Docker Engine, Docker Desktop, Docker
      Compose builds, Docker Bake, and registry image tooling such as imagetools.
  sources:
    - https://github.com/docker/buildx#readme
    - https://docs.docker.com/build/
    - https://docs.docker.com/reference/cli/docker/buildx/
    - https://formulae.brew.sh/formula/docker-buildx
  summary:
    - >
      Docker Buildx is the Docker CLI plugin that exposes extended Docker Build
      capabilities backed by BuildKit. The upstream README highlights builder instances,
      multi-node and multi-platform builds, Compose build support, Bake, and Docker or
      Kubernetes drivers.
  timeline:
    - '2019: Docker Engine 19.03 is the minimum Docker version named by the Buildx README.'
    - '2020: Buildx 0.6-era examples appear in the README for building Buildx itself.'
    - >
      2026: Docker docs list Buildx as the Docker Build command surface for extended
      BuildKit capabilities, and the batch input lists wide package-manager
      distribution.
  usage:
    - >
      Typical use starts with docker buildx build for BuildKit-backed builds, then
      expands to docker buildx create and use for builder instances, docker buildx bake
      for higher-level build definitions, docker buildx imagetools for registry image
      inspection and manipulation, and docker buildx prune or du for build cache
      maintenance. It is especially common in CI pipelines that publish
      multi-architecture container images.
related-packages:
  - id: brew:docker-compose
    reason: >
      Use Docker Compose with Buildx when service build definitions in a Compose file
      should also drive BuildKit builds through Bake.
    rel: adjacent_workflow
    sources:
      - https://docs.docker.com/build/bake/compose-file/
      - https://docs.docker.com/compose/
  - id: brew:docker-language-server
    reason: >
      Use Docker Language Server while authoring Dockerfiles, Compose files, and Bake
      files; its Dockerfile linting features explicitly rely on Buildx and BuildKit.
    rel: adjacent_workflow
    sources:
      - https://github.com/docker/docker-language-server#readme
      - https://github.com/docker/buildx#readme
category: developer-tools
package-manager:
  brew: docker-buildx
  debian: docker-buildx
  dnf: docker-buildx
  nix: docker-buildx
  pacman: docker-buildx
  scoop: main/docker-buildx
  ubuntu: docker-buildx
  winget: Docker.Buildx
  zypper: docker-buildx
package-manager-url: https://formulae.brew.sh/formula/docker-buildx
license: Apache-2.0
tags:
  - buildkit
  - builds
  - cli
  - cli-plugin
  - containers
  - docker
description: Docker CLI plugin for extended build capabilities with BuildKit
executables:
  - docker-buildx
provenance:
  formula: docker-buildx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
