id: brew:markdown-oxide
display-name: markdown-oxide
homepage: https://oxide.md
repo: https://github.com/Feel-ix-343/markdown-oxide
docs:
  - https://github.com/Feel-ix-343/markdown-oxide#readme
  - https://oxide.md
config-file-location:
  unix:
    - ~/.config/moxide/settings.toml
    - .moxide.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      markdown-oxide adopted quickly for a young editor tool, with the official GitHub
      repository showing thousands of stars by 2026. The README documents installation
      through Arch Linux, Mason.nvim, Nix, Alpine, openSUSE, Conda, Cargo, winget, and
      Homebrew, matching the supplied package facts that show broad package-manager
      coverage.
  package-nerd-significance:
    - >
      markdown-oxide is notable because it packages a note-taking workflow as an
      editor-neutral LSP server instead of a full app. That makes it attractive to
      package managers and editor plugin ecosystems: one binary can serve Neovim, VS
      Code, Helix, Zed, and other LSP clients.
  project-history:
    - >
      The project was created on GitHub in 2023. Its documentation describes
      markdown-oxide as an unbundled PKM system: it deliberately leaves text editing to
      editors such as Neovim, VS Code, Helix, and Zed, and focuses on
      knowledge-management behavior through LSP features.
    - >
      The feature set grew around Markdown note graphs: wikilink and Markdown-link
      completions, backlinks, unresolved-link completions and code actions, hover
      previews, daily-note commands, tags, workspace symbols, callout completions,
      footnotes, and rename support for linked notes.
  related-projects:
    - The docs explicitly position markdown-oxide as compatible with and inspired by Obsidian.
    - >
      It belongs to the wider LSP ecosystem used by editors such as Neovim, VS Code,
      Helix, Zed, and Kakoune.
  sources:
    - https://api.github.com/repos/Feel-ix-343/markdown-oxide
    - https://github.com/Feel-ix-343/markdown-oxide
    - https://github.com/Feel-ix-343/markdown-oxide/tree/main/docs/Markdown%20Oxide%20Docs
    - https://oxide.md
  summary:
    - >
      markdown-oxide is a Personal Knowledge Management language server for Markdown
      notes, designed to bring Obsidian-like note-linking workflows into editors that
      speak the Language Server Protocol.
  timeline:
    - '2023: GitHub repository created.'
    - >
      2026: Official README lists package-manager installs across Linux, macOS, Windows,
      and editor package flows.
    - '2026: Repository metadata shows thousands of stars and active development.'
  usage:
    - >
      Users install the markdown-oxide binary and configure their editor's LSP client to
      start it for Markdown files. In Neovim 0.11 and newer, the docs recommend native
      LSP configuration with root markers such as .git, .obsidian, and .moxide.toml.
    - >
      Configuration is optional and can live in a global settings.toml under
      ~/.config/moxide or in a project .moxide.toml. The documented options tune
      daily-note formats, heading completions, unresolved-link diagnostics, semantic
      tokens, code-block reference handling, Obsidian imports, link-extension behavior,
      hover, inlay hints, and excluded folders.
related-packages:
  - id: brew:marksman
    reason: >
      Choose Marksman when you want a general Markdown language server centered on
      link-aware code assistance and project editing rather than Markdown-Oxide's
      Obsidian-compatible PKM, daily-note, tag, and backlink workflow.
    rel: alternative
    sources:
      - https://oxide.md/
      - https://github.com/artempyanykh/marksman
      - https://github.com/artempyanykh/marksman/blob/main/docs/features.md
category: developer-tools
package-manager:
  apk: markdown-oxide
  brew: markdown-oxide
  nix: markdown-oxide
  pacman: markdown-oxide
  scoop: main/markdown-oxide
  winget: FelixZeller.markdown-oxide
  zypper: markdown-oxide
package-manager-url: https://formulae.brew.sh/formula/markdown-oxide
license: Apache-2.0
tags:
  - cli
  - editor-tooling
  - knowledge-management
  - lsp
  - markdown
  - notes
description: Personal Knowledge Management System for the LSP
executables:
  - markdown-oxide
provenance:
  formula: markdown-oxide
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
