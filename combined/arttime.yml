id: brew:arttime
display-name: arttime
homepage: https://github.com/poetaman/arttime
repo: https://github.com/poetaman/arttime
docs:
  - https://github.com/poetaman/arttime/wiki
  - https://github.com/poetaman/arttime#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents simple, manual, package-manager, and Docker installation
      paths. Homebrew appears in the provided package-manager facts, while the README's
      packaging section invites distribution maintainers to package arttime and points
      to release artifacts such as Debian packages.
    - >
      GitHub repository metadata reported over one thousand stars at research time. The
      README also includes a stargazer-location image and calls for artists, reflecting
      adoption as both a utility and a text-art collection.
  package-nerd-significance:
    - >
      arttime is a package-nerd curiosity because it packages a highly interactive
      terminal UI as mostly shell, with a strong bias toward zero or minimal
      dependencies on Unix-like systems. It also treats terminal art as first-class
      package content rather than decoration.
    - >
      For Homebrew users, it is the kind of niche CLI that benefits from package-manager
      installability: a user can install it, get the `arttime` and `artprint` commands,
      and avoid chasing manual shell setup.
  project-history:
    - >
      The GitHub repository was created in May 2022, and the first GitHub release,
      v1.0.0, was published on May 23, 2022. The README presents arttime as both a
      productivity tool and a platform for curated ASCII, ANSI, PETSCII, and Unicode
      text art.
    - >
      Release titles show the project growing quickly through 2022 and 2023: multiple
      timers and pattern-based time management arrived early, a universal Unix installer
      followed, v2.0.0 added history, completion, expressive timers, storyboards, and
      key-feeding support, and v2.1.0 added Windows WSL notification and sound support.
  related-projects:
    - >
      The README acknowledges classic text artists, ascii-image-converter, and aewan as
      related influences or tools.
  sources:
    - https://api.github.com/repos/poetaman/arttime
    - https://api.github.com/repos/poetaman/arttime/releases
    - https://github.com/poetaman/arttime
    - https://raw.githubusercontent.com/poetaman/arttime/main/README.md
    - source_facts.package-manager
  summary:
    - >
      arttime is a terminal clock, timer, time manager, and text-art viewer. It is
      intentionally small in the Unix sense: a shell-based interactive program that can
      be controlled from the keyboard, files, pipes, strings, or other processes.
  timeline:
    - '2022: Repository created and v1.0.0 released.'
    - '2022: v1.5.0 added multiple goals and pattern-based time management.'
    - '2023: v2.0.0 added history, completion, expressive timers, storyboards, and key feeding.'
    - '2025: v2.4.0 release focused on smoother operation across more systems.'
  usage:
    - >
      Users run `arttime` for a clock, timer, alarm, or repeating time-management
      pattern. The tool can associate timers with art, colors, and messages, show
      progress bars, switch time zones interactively, and store prompt history.
    - >
      A companion `artprint` script is installed for consistent art and message display
      from other shell workflows. The README highlights use with pipes and feeder
      programs for dynamic information such as system metrics, weather, and market
      feeds.
related-packages:
  - id: brew:fzf
    reason: >
      Install fzf to enable arttime's documented optional fuzzy interface for selecting
      text art interactively from its collection.
    rel: adjacent_workflow
    sources:
      - https://github.com/poetaman/arttime#readme
      - https://github.com/junegunn/fzf#readme
category: productivity
package-manager:
  brew: arttime
package-manager-url: https://formulae.brew.sh/formula/arttime
license: GPL-3.0-only
tags:
  - ascii-art
  - cli
  - clock
  - terminal
  - text-art
  - time-management
  - timer
description: Clock, timer, time manager and ASCII+ text-art viewer for the terminal
executables:
  - artprint
  - arttime
provenance:
  formula: arttime
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
