id: brew:libtecla
display-name: Not completed
homepage: https://sites.astro.caltech.edu/~mcs/tecla/
repo: null
docs:
  - https://sites.astro.caltech.edu/~mcs/tecla
  - https://sites.astro.caltech.edu/~mcs/tecla/libtecla.html
  - https://sites.astro.caltech.edu/~mcs/tecla/tecla.html
config-file-location:
  unix: ~/.teclarc
credentials-file-location: null
history:
  adoption-history:
    - >
      libtecla's adoption has been modest but durable. It appears in Homebrew, Debian,
      Ubuntu, and Arch-family packaging in the input metadata, mostly for C programs
      that want readline-like behavior under a permissive license and with a small
      dependency footprint.
  package-nerd-significance:
    - >
      libtecla sits in the same mental shelf as readline and libedit, but as a smaller
      permissively licensed option. Package maintainers care because it offers
      command-line ergonomics without making every consumer inherit readline's licensing
      and dependency choices.
    - >
      Its significance is niche: valuable for terminal-native Unix software, not a broad
      application platform.
  project-history:
    - >
      The official release notes identify version 1.1j as the initial public release on
      freshmeat.org. The libtecla man page names Martin Shepherd as author and explains
      the name: in Spanish, tecla means a keyboard key, fitting a library centered on
      keyboard input.
    - >
      The project evolved through practical terminal features rather than a large
      ecosystem. Version 1.2 added path lookup and completion, 1.2.3 introduced an
      autoconf configure script, 1.3.0 added optional vi editing mode, 1.4.0 expanded
      history, configuration, signals, and the enhance program, and 1.5.0 added
      non-blocking I/O and event-loop integration.
  related-projects:
    - >
      GNU readline and BSD libedit are the closest related command-line editing
      libraries. tcsh, vi, and emacs provide the interaction styles that libtecla
      imitates or supports.
  sources:
    - https://sites.astro.caltech.edu/~mcs/tecla/
    - https://sites.astro.caltech.edu/~mcs/tecla/enhance.html
    - https://sites.astro.caltech.edu/~mcs/tecla/libtecla.html
    - https://sites.astro.caltech.edu/~mcs/tecla/release.html
    - https://sites.astro.caltech.edu/~mcs/tecla/tecla.html
  summary:
    - >
      libtecla is Martin Shepherd's interactive command-line input library for Unix-like
      programs. It provides tcsh-like editing, command history, tab completion, filename
      expansion, and the enhance wrapper for adding line editing to third-party
      programs.
  timeline:
    - '1.1j: Initial public release on freshmeat.org.'
    - '1.2: Adds lookup and completion of filenames in Unix-style paths.'
    - >
      1.2.3: Adds an autoconf configure script and shared-library support on several
      Unix systems.
    - '1.3.0: Adds optional vi command-line editing mode.'
    - >
      1.4.0: Adds history save/load, richer configuration, signal handling, 8-bit clean
      input, and the enhance program.
    - '1.5.0: Adds non-blocking I/O and event-loop support.'
    - >
      2014: The upstream page lists version 1.6.3 and is signed by Martin Shepherd on
      November 9, 2014.
  usage:
    - >
      Programs link with libtecla and call its interactive line-input API to get
      emacs-like default bindings, optional vi mode, command history, tab completion,
      filename expansion, and per-user customization through ~/.teclarc.
    - >
      The enhance utility is the package's user-visible trick: it can add command-line
      editing to some third-party interactive programs without those programs being
      linked against libtecla.
related-packages:
  - id: brew:rlwrap
    reason: >
      Choose rlwrap when the goal is specifically to add Readline editing and persistent
      history to an unmodified interactive command, rather than embedding libtecla's C
      API in an application.
    rel: alternative
    sources:
      - https://sites.astro.caltech.edu/~mcs/tecla/enhance.html
      - https://github.com/hanslub42/rlwrap#readme
category: other
