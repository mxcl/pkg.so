id: cask:tableplus
display-name: TablePlus
homepage: https://tableplus.com/
repo: null
docs:
  - https://docs.tableplus.com/
  - https://docs.tableplus.com/getting-started
config-file-location:
  macos: ~/Library/Preferences/com.tinyapp.TablePlus.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2018, the developers reported a word-of-mouth community spanning developers,
      database administrators, analysts, data scientists, students, and teachers.
      TablePlus subsequently expanded beyond macOS to Windows, Linux, and iOS.
  package-nerd-significance:
    - >
      TablePlus represents the polished native-GUI branch of database tooling: fast
      startup, platform-native interfaces, broad driver coverage, and frequent releases.
      It is often considered alongside open-source and web-based SQL clients when
      choosing a desktop database workbench.
  project-history:
    - >
      TablePlus was created after its developers found existing relational-database
      clients either slow, dated, or restricted to too few database engines. The first
      macOS version was released in 2017 and emphasized native performance, a modern
      interface, and multi-database support.
    - >
      A public Windows release followed in September 2018. The product later added Linux
      and iOS editions while retaining separate native clients.
  related-projects:
    - 'pgAdmin: PostgreSQL-focused administration client mentioned by the TablePlus creators.'
    - 'Sequel Pro: macOS MySQL client cited as an influence and point of comparison.'
    - >
      TablePlus platform issue repositories: official public trackers for the otherwise
      proprietary clients.
  sources:
    - >
      Official Windows release article:
      https://tableplus.com/blog/2018/09/a-native-database-management-tool-for-windows.html
    - >
      Official adoption retrospective:
      https://tableplus.com/blog/2018/10/how-to-build-a-product-people-love.html
    - 'Official documentation: https://docs.tableplus.com/'
    - >
      Official origin article:
      https://tableplus.com/blog/2017/12/modern-native-tool-for-relational-database.html
  summary:
    - >
      TablePlus is a proprietary native graphical client for querying and administering
      relational and selected non-relational databases across desktop and mobile
      platforms.
  timeline:
    - '2017: The first TablePlus version was released for macOS.'
    - '2018: TablePlus was described as production-ready after growing through word of mouth.'
    - '2018: The native Windows edition was publicly released.'
    - '2019: TablePlus expanded to iOS.'
  usage:
    - >
      Users create direct database connections, browse schemas and data, edit rows with
      changes held for review, run SQL in the query editor, and import or export data.
      On macOS, saved database usernames and passwords are stored in Keychain rather
      than a documented credentials file.
