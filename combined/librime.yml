id: brew:librime
display-name: librime
homepage: https://rime.im
repo: https://github.com/rime/librime
docs:
  - https://github.com/rime/librime#readme
  - https://rime.im/
config-file-location:
  linux:
    - ~/.config/ibus/rime
    - ~/.config/fcitx/rime
    - ~/.local/share/fcitx5/rime/
  macos: ~/Library/Rime
  windows: '%APPDATA%\Rime'
credentials-file-location: null
history:
  adoption-history:
    - >
      librime's adoption comes from users who want a portable, deeply configurable
      Chinese input method rather than separate platform-specific engines. The same core
      can support Linux desktops through IBus or Fcitx, macOS through Squirrel, and
      Windows through Weasel, while user dictionaries and schemas remain part of the
      broader RIME ecosystem.
    - >
      For package managers, the library is the reusable dependency underneath desktop
      IME packages and command-line maintenance tools. That makes it visible not just to
      end users choosing an input method, but also to packagers dealing with
      dictionaries, OpenCC, YAML schemas, and desktop integration paths.
  package-nerd-significance:
    - >
      librime is package-nerd significant because it splits an input method into a
      reusable engine, platform adapters, schemas, dictionaries, and recipe management.
      That architecture makes it unusually hackable for language input: the package is
      not just an app, but the core of a configurable typing system.
  project-history:
    - >
      The RIME project presents librime as the core library and lists surrounding
      projects such as plum for configuration recipes, ibus-rime for Linux/IBus, Weasel
      for Windows, and Squirrel for macOS. The librime README describes the engine as
      cross-platform C++ code built on open source technologies and designed around
      customizable schemas.
    - >
      Release history visible on GitHub shows active 1.x maintenance from at least 2018
      onward, including 1.3.2 on November 12, 2018, 1.5.x releases in June 2019, 1.7.x
      releases in early 2021, and 1.13.1 released on February 16, 2026.
  related-projects:
    - >
      Related projects include RIME, plum, ibus-rime, fcitx-rime, fcitx5-rime, Squirrel,
      Weasel, OpenCC, YAML schema collections, and RIME dictionaries.
  sources:
    - https://github.com/rime/librime
    - https://github.com/rime/librime/releases/tag/1.10.0
    - https://github.com/rime/librime/releases/tag/1.13.1
    - https://github.com/rime/librime/releases/tag/1.5.0
    - https://rime.im/
    - https://rime.im/code/
    - https://rime.im/docs/
  summary:
    - >
      librime is the core C++ library for RIME, the Rime Input Method Engine. It
      provides a modular, extensible Chinese input-method engine with YAML-based
      schemas, support for shape-based and phonetic input, Traditional Chinese output,
      OpenCC-based Simplified Chinese conversion, and wrappers for platform input-method
      front ends.
  timeline:
    - '2018-11-12: librime 1.3.2 released.'
    - '2019-06-06: librime 1.5.0 released.'
    - '2021-01-17: librime 1.7.0 released.'
    - '2024-02-10: librime 1.10.0 released.'
    - '2026-02-16: librime 1.13.1 released.'
  usage:
    - >
      Packaged users normally configure RIME by editing schema and dictionary files in
      the platform-specific Rime user directory, then triggering deployment through the
      platform front end or tools such as rime_deployer and rime_dict_manager.
      Developers use librime when building or packaging an input-method front end.
related-packages: []
category: productivity
package-manager:
  apk: librime
  brew: librime
  debian: librime-bin
  dnf: librime
  macports: librime
  nix: librime
  pacman: librime
  ubuntu: librime-bin
  zypper: librime-devel
package-manager-url: https://formulae.brew.sh/formula/librime
license: BSD-3-Clause
