repo: https://github.com/pixelb/dvd-vr
docs:
  - https://www.pixelbeat.org/docs/DVD-VR
  - https://www.pixelbeat.org/programs/dvd-vr
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dvd-vr never became a broad multimedia platform; it remained a niche rescue and
      extraction tool. Its adoption is visible through packaging in Homebrew and Nix,
      which is exactly the kind of package-manager preservation niche where a tiny
      utility remains valuable long after the consumer devices fade.
  package-nerd-significance:
    - >
      dvd-vr is significant because it captures reverse-engineered knowledge about a
      consumer-recording format that sits outside the usual DVD-Video path. For package
      maintainers, keeping it buildable is a low-cost way to preserve access to old
      camcorder and recorder media.
  project-history:
    - >
      The official Pixelbeat page says the open source program was created in February
      2007 by reverse engineering DVD-VR format discs. Its NEWS file records version 0.1
      on 2007-02-16 as the initial release, followed by a series of portability,
      metadata, encoding, label, and extraction fixes through version 0.9.7 on
      2010-08-24.
    - >
      The early changelog shows the project being shaped by real discs from multiple
      users: Mac OS X, Cygwin, Japanese labels, LG recorder quirks, CPRM detection, and
      partially encrypted programs all appear as concrete compatibility fixes.
  related-projects:
    - >
      dvd-vr sits near tools such as dvdbackup, libdvdread, VLC, FFmpeg, and other
      DVD/VOB utilities, but its focus is the DVD-VR recording format rather than
      standard DVD-Video titles.
  sources:
    - https://www.pixelbeat.org/programs/dvd-vr
    - https://www.pixelbeat.org/programs/dvd-vr/NEWS.html
    - https://www.pixelbeat.org/docs/DVD-VR
    - https://github.com/pixelb/dvd-vr
  summary:
    - >
      dvd-vr is a small Pixelbeat command-line utility for identifying and optionally
      copying recordings from DVD-VR discs, the format used by some DVD recorders and
      camcorders. It exists because DVD-VR discs are not the same thing as ordinary
      DVD-Video discs, so generic ripping or file-copying tools often miss the recording
      metadata and program boundaries users care about.
  timeline:
    - '2007-02-16: Version 0.1 initial release.'
    - >
      2007-11-14: Version 0.4 added program selection, better unknown-resolution
      reporting, label extraction, and timestamp-based filenames.
    - >
      2008-11-04: Version 0.8 added a make install target, man page, stdout writing, and
      long options.
    - >
      2010-08-24: Version 0.9.7 added detection of partially encrypted programs and MPEG
      stream fixes.
  usage:
    - >
      Users point `dvd-vr` at the DVD_RTAV/VR_MANGR.IFO file or a mounted DVD-VR disc.
      The tool reports disc format details and can copy individual programs to VOB
      files, preserving useful labels or timestamps where the recorder wrote them.
