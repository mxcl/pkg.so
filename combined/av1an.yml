id: brew:av1an
display-name: Av1an
homepage: https://github.com/rust-av/Av1an
repo: https://github.com/rust-av/Av1an
docs:
  - https://github.com/rust-av/Av1an#readme
  - https://rust-av.github.io/Av1an
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Av1an gained traction among video-encoding enthusiasts because it wrapped a stack
      that otherwise required careful manual scripting: FFmpeg, VapourSynth, metric
      tools such as VMAF, and separate executable encoders. The official README points
      to package-manager installation, Cargo, Docker images, Windows release binaries,
      and nightly builds.
    - >
      The input records packages in Homebrew, MacPorts, Nix, and Arch, matching the
      project's audience: users comfortable with command-line video pipelines who want a
      reproducible binary rather than a pile of ad hoc shell scripts.
  package-nerd-significance:
    - >
      Av1an is package-nerd significant because it exposes the messy boundary between
      video codec libraries, encoder executables, metrics tools, FFmpeg, VapourSynth
      plugins, and Rust distribution. Packaging it is not just shipping one binary;
      users expect the binary to find a working media toolchain.
  project-history:
    - >
      The GitHub project dates from 2020, in the period when AV1 encoders such as
      aomenc, rav1e, and SVT-AV1 were powerful but slow enough that CPU utilization and
      chunking strategy mattered. Av1an's README describes its purpose as increasing
      encoding speed and improving CPU utilization by running multiple encoder processes
      in parallel.
    - >
      The project later moved under the rust-av organization and developed a broader
      documentation site. Its feature set grew beyond simple parallelism into
      target-quality mode, VMAF plotting, resume support, VapourSynth script support,
      Docker images, and multiple encoder backends.
  related-projects:
    - 'aomenc, SVT-AV1, and rav1e: AV1 encoders supported by Av1an.'
    - 'vpxenc, x264, and x265: non-AV1 encoder backends supported by Av1an.'
    - 'FFmpeg and VapourSynth: required or common parts of Av1an workflows.'
    - 'Netflix VMAF: quality metric used by Av1an target-quality workflows.'
  sources:
    - https://github.com/rust-av/Av1an
    - https://raw.githubusercontent.com/rust-av/Av1an/master/README.md
    - https://rust-av.github.io/Av1an
    - source_facts.package-manager
  summary:
    - >
      Av1an is a Rust command-line video encoding framework built around parallel
      chunked encoding and quality-driven workflows. Although its name foregrounds AV1,
      the official README documents support for AV1, VP8/VP9, H.264/AVC, and H.265/HEVC
      encoders.
  timeline:
    - '2020: GitHub repository created for Av1an.'
    - >
      2020s: Rust implementation and documentation site developed under the rust-av
      organization.
    - >
      2020s: README documents Cargo, package-manager, Docker, Windows release, and
      nightly installation paths.
    - >
      2020s: Target Quality, VMAF plotting, VapourSynth support, and multi-encoder
      support become core documented features.
  usage:
    - >
      The simplest usage is `av1an -i input.mkv -o output.mkv`; more advanced usage
      passes encoder parameters, worker counts, audio settings, logs, target quality,
      and VapourSynth inputs. Av1an requires FFmpeg and at least one supported
      executable encoder, not merely an encoder library package.
    - >
      Its practical role is orchestration: split or index input, run multiple encode
      jobs, measure quality when requested, and assemble output. That makes it
      attractive on high-core-count machines where a single encoder instance would leave
      CPU resources unused.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Av1an relies on FFmpeg for media probing and processing around its parallel chunk
      pipeline, so FFmpeg is foundational to a working Av1an toolchain.
    rel: adjacent_workflow
    sources:
      - https://github.com/rust-av/Av1an/blob/master/README.md
      - https://ffmpeg.org/documentation.html
  - id: brew:svt-av1
    reason: >
      SVT-AV1 supplies the SvtAv1EncApp executable that Av1an officially supports for
      parallel AV1 encoding on CPU-heavy workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/rust-av/Av1an/blob/master/README.md
      - https://gitlab.com/AOMediaCodec/SVT-AV1
  - id: brew:aom
    reason: >
      AOMedia's aomenc is an officially supported Av1an backend for users who want the
      reference AV1 encoder and its native controls.
    rel: adjacent_workflow
    sources:
      - https://github.com/rust-av/Av1an/blob/master/README.md
      - https://aomedia.googlesource.com/aom/
  - id: brew:rav1e
    reason: >
      rav1e is an officially supported executable AV1 backend and offers a Rust/Xiph
      encoder choice within Av1an's parallel orchestration workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/rust-av/Av1an/blob/master/README.md
      - https://github.com/xiph/rav1e
  - id: brew:vapoursynth
    reason: >
      VapourSynth can provide scripted filtering and frame serving as Av1an's input
      before frames are distributed to encoder workers.
    rel: adjacent_workflow
    sources:
      - https://github.com/rust-av/Av1an/blob/master/README.md
      - https://www.vapoursynth.com/doc/
category: media
package-manager:
  brew: av1an
  macports: av1an
  nix: av1an
  pacman: av1an
package-manager-url: https://formulae.brew.sh/formula/av1an
license: GPL-3.0-only
tags:
  - av1
  - cli
  - encoding
  - video
description: Cross-platform command-line encoding framework
executables:
  - av1an
provenance:
  formula: av1an
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
