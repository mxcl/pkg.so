id: brew:ipmitool
display-name: IPMItool
homepage: https://codeberg.org/IPMITool/ipmitool
repo: https://codeberg.org/IPMITool/ipmitool
docs:
  - https://codeberg.org/IPMITool/ipmitool
  - https://codeberg.org/IPMITool/ipmitool/src/branch/master/doc/ipmitool.1.in
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      IPMItool became a standard server-administration package because it exposed BMC
      management through a plain CLI instead of a vendor-specific console. That made it
      attractive to system administrators, data-center operators, and BMC developers who
      wanted something simple and scriptable.
    - >
      The Codeberg tags show a long imported release history, including 1.8.0 in 2005,
      multiple 1.8.x releases through the 2000s and 2010s, and 1.8.19 in 2022.
  package-nerd-significance:
    - >
      IPMItool is a classic sysadmin package: old, small, dangerous if misused, and
      indispensable when a remote server needs power cycling or sensor inspection
      without a working operating system.
    - >
      It also represents a packaging pattern common in infrastructure tooling: a
      vendor-neutral command wraps a hardware management standard, which keeps it useful
      across many server vendors and Linux distributions.
  project-history:
    - >
      The README attributes IPMItool to Duncan Laurie and explains that he wrote it
      while at Sun Microsystems, after Sun began working on x86 servers with Intel
      boards and IPMIv1.5 BMCs. The original motivation was remote chassis power control
      for lab systems, and the project grew into a general-purpose tool that others
      found useful.
    - >
      The project was released under a BSD license and later moved from SourceForge to
      Codeberg. SourceForge now marks the project obsolete and points users to the
      Codeberg repository.
  related-projects:
    - OpenIPMI provides the Linux kernel interface commonly used for local IPMI access.
    - IPMI-over-LAN and RMCP/RMCP+ are the network protocols used for remote BMC access.
    - Vendor server-management tools overlap with IPMItool but are usually less portable.
  sources:
    - https://codeberg.org/IPMITool/ipmitool
    - https://codeberg.org/api/v1/repos/IPMITool/ipmitool/tags
    - https://sourceforge.net/projects/ipmitool/
  summary:
    - >
      IPMItool is a command-line utility for managing systems that implement the
      Intelligent Platform Management Interface, giving administrators scriptable access
      to BMC sensors, event logs, inventory, LAN settings, and chassis power control.
  timeline:
    - >
      Sun Microsystems era: Duncan Laurie wrote IPMItool after working with x86 servers
      containing IPMIv1.5 BMCs.
    - '2005: IPMITOOL_1_8_0 tag appears in the imported Codeberg history.'
    - '2013: CVS-to-git imported tags appear in the Codeberg history.'
    - '2022: IPMITOOL_1_8_19 tag appears in the Codeberg history.'
    - '2025: README states Linux is the only platform covered by automated checks.'
  usage:
    - >
      Common uses include reading sensor data records, printing sensor values,
      displaying the system event log, printing FRU inventory, configuring BMC LAN
      parameters, issuing raw IPMI commands, and remotely controlling chassis power.
    - >
      The tool can work through local kernel interfaces such as OpenIPMI on Linux or
      through IPMI-over-LAN using RMCP/RMCP+ over UDP port 623, depending on hardware
      and configuration.
related-packages:
  - id: brew:freeipmi
    reason: >
      Choose GNU FreeIPMI when you need a broader collection of specialized commands,
      libraries, monitoring daemons, discovery, or cluster-oriented IPMI workflows
      instead of IPMItool's compact general-purpose interface.
    rel: alternative
    sources:
      - https://codeberg.org/IPMITool/ipmitool
      - https://www.gnu.org/software/freeipmi/
      - https://www.gnu.org/software/freeipmi/documentation.html
  - id: brew:ipmiutil
    reason: >
      Choose ipmiutil when native Windows operation, driverless Linux access, automatic
      OEM sensor interpretation, or its task-specific utility suite is more important
      than IPMItool's widely familiar single command.
    rel: alternative
    sources:
      - https://codeberg.org/IPMITool/ipmitool
      - https://github.com/arcress0/ipmiutil
      - https://github.com/arcress0/ipmiutil/blob/master/doc/UserGuide
