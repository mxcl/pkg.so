id: brew:jot
display-name: Jot
homepage: https://github.com/shashwatah/jot
repo: https://github.com/shashwatah/jot
docs:
  - https://github.com/shashwatah/jot#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Jot's adoption evidence is modest but concrete: the README documents Cargo
      installation as jt because the jot crate name was unavailable, and the input
      metadata records Homebrew, MacPorts, and Nix packages. Its appeal is strongest for
      users who want Obsidian-style vault organization from a shell rather than a
      desktop application.
  package-nerd-significance:
    - >
      Jot is package-nerd relevant as a compact example of the Markdown-vault idea
      reduced to a CLI. It is not a large personal-knowledge-management platform; its
      significance is that it packages a few common Obsidian-style filesystem
      conventions into a small Rust command.
  project-history:
    - >
      The shashwatah/jot repository was created in July 2022, and the first GitHub
      release, v0.1.0, was published in September 2022. The README frames the project
      around Obsidian-compatible storage ideas: Markdown files for notes and local
      folders for vaults and subfolders.
  related-projects:
    - >
      Jot is explicitly inspired by Obsidian's local Markdown vault model. It also
      belongs near terminal note tools, Markdown editors, and shell workflows that
      combine notes with Vim, Neovim, VS Code, or other external editors.
  sources:
    - https://crates.io/crates/jt
    - https://formulae.brew.sh/formula/jot
    - https://github.com/shashwatah/jot
    - https://github.com/shashwatah/jot/releases
    - https://raw.githubusercontent.com/shashwatah/jot/main/README.md
  summary:
    - >
      Jot is a small terminal note manager that describes itself as a feature-stripped
      version of Obsidian for rapid note management. It stores notes as Markdown files
      in local folders and exposes a jt command for vault, note, folder, movement,
      listing, and configuration operations.
  timeline:
    - '2022-07: The shashwatah/jot repository was created on GitHub.'
    - '2022-09: v0.1.0 was published.'
    - '2022-09: v0.1.1 changed terse commands into full-word commands with two-letter aliases.'
    - '2023-04: v0.1.2 added opdir and config-opening behavior and fixed path/listing issues.'
  usage:
    - >
      The documented workflow starts by creating a vault with jt vault, entering it with
      jt enter, creating notes and folders with jt note and jt folder, opening notes in
      a configured editor, and moving or listing local Markdown items. Configuration is
      intentionally small, centered on editor and conflict behavior.
related-packages:
  - id: brew:nb
    reason: >
      Choose nb when you want a broader terminal knowledge base with tagging, search,
      Git-backed synchronization, bookmarks, encryption, and multiple text formats
      instead of Jot's deliberately small Markdown-vault workflow.
    rel: alternative
    sources:
      - https://github.com/shashwatah/jot#readme
      - https://xwmx.github.io/nb/
category: productivity
package-manager:
  brew: jot
  macports: jot
  nix: jot
package-manager-url: https://formulae.brew.sh/formula/jot
license: MIT
tags:
  - cli
  - markdown
  - notes
  - obsidian-compatible
  - terminal
description: Rapid note management for the terminal
executables:
  - jt
provenance:
  formula: jot
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
