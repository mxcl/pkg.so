id: brew:clamav
display-name: ClamAV
homepage: https://www.clamav.net/
repo: https://github.com/Cisco-Talos/clamav
docs:
  - https://docs.clamav.net/
config-file-location:
  linux:
    - /etc/clamav/freshclam.conf
    - /etc/clamav/clamd.conf
  macos:
    - /usr/local/etc/clamav/freshclam.conf
    - /usr/local/etc/clamav/clamd.conf
    - /opt/local/etc/freshclam.conf
    - /opt/local/etc/clamd.conf
  unix:
    - /usr/local/etc/freshclam.conf
    - /usr/local/etc/clamd.conf
    - /usr/local/etc/clamav-milter.conf
  windows:
    - HKEY_LOCAL_MACHINE/Software/ClamAV/ConfDir
    - C:\Program Files\ClamAV
    - C:\ClamAV
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager data shows ClamAV packaged across Alpine, Debian,
      Ubuntu, Fedora/DNF, Arch, openSUSE, Nix, MacPorts, Homebrew, Chocolatey, Scoop,
      winget, and zypper. That breadth reflects its role as the default open source
      antivirus engine available through OS and language-adjacent package ecosystems.
  package-nerd-significance:
    - >
      ClamAV is significant because it is both an end-user CLI package and
      infrastructure plumbing. Package maintainers care about its daemon, database
      update cadence, bundled signature tooling, optional components, distro-specific
      config paths, and the difference between upstream official packages and
      third-party binary packages.
  project-history:
    - >
      The current official repository is maintained under Cisco Talos. The README points
      to docs.clamav.net, the bundled NEWS file, source builds, package-manager
      installation, Docker images, and official installers for Linux, macOS, and
      Windows.
  related-projects:
    - >
      Related components include libclamav, clamd, clamdscan, freshclam, sigtool,
      clamav-milter, the ClamAV documentation repository, official Docker images, and
      signature database infrastructure.
  sources:
    - https://github.com/Cisco-Talos/clamav
    - https://raw.githubusercontent.com/Cisco-Talos/clamav/main/README.md
    - https://raw.githubusercontent.com/Cisco-Talos/clamav/main/NEWS.md
    - https://api.github.com/repos/Cisco-Talos/clamav/releases
    - https://raw.githubusercontent.com/Cisco-Talos/clamav/main/etc/clamd.conf.sample
    - https://raw.githubusercontent.com/Cisco-Talos/clamav/main/etc/freshclam.conf.sample
  summary:
    - >
      ClamAV is a long-running open source antivirus engine and command-line toolkit for
      detecting trojans, viruses, malware, and other threats. In package-manager terms,
      it is the classic installable antivirus stack: clamscan for one-shot scans, clamd
      for daemonized scanning, freshclam for signature updates, and supporting tools for
      signatures and configuration.
  timeline:
    - '2012: Cisco-Talos/clamav GitHub repository created.'
    - >
      2021: v0.104 line introduced official Debian/RPM packages, macOS PKG installers,
      and updated Windows packaging according to the README.
    - '2022: ClamAV 1.0.0 released.'
    - '2025: ClamAV 1.0.9 release published on the 1.0 LTS line.'
    - '2026: Main branch NEWS documents ongoing 1.5 and 1.6 development.'
  usage:
    - >
      Users typically install the engine and signature tools, update databases with
      freshclam, scan files with clamscan or clamdscan, and run clamd for service-style
      scanning. The official sample configurations document clamd.conf and
      freshclam.conf options such as database directories, logging, official signature
      handling, and CVD certificate directories.
related-packages: []
category: security
package-manager:
  apk: clamav
  brew: clamav
  chocolatey: clamav
  debian: clamav
  dnf: clamav
  macports: clamav
  nix: clamav
  pacman: clamav
  scoop: extras/clamav
  ubuntu: clamav
  winget: Cisco.ClamAV
  zypper: clamav
package-manager-url: https://formulae.brew.sh/formula/clamav
license: GPL-2.0-or-later
tags:
  - antivirus
  - cli
  - daemon
  - malware-detection
  - security
  - signatures
description: Anti-virus software
executables:
  - clamav-config
  - clambc
  - clamconf
  - clamd
  - clamdscan
  - clamdtop
  - clamonacc
  - clamscan
  - clamsubmit
  - freshclam
  - sigtool
provenance:
  formula: clamav
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
