id: brew:scamper
display-name: scamper
homepage: https://www.caida.org/catalog/software/scamper/
repo: null
docs:
  - https://www.caida.org/catalog/software/scamper
  - https://www.caida.org/catalog/software/scamper/man/scamper.1.pdf
config-file-location:
  unix: User-selected path passed to -g
  windows: User-selected path passed to -g
credentials-file-location:
  unix:
    - User-selected certificate path passed to -O client-certfile=<file>
    - User-selected private-key path passed to -O client-privfile=<file>
  windows:
    - User-selected certificate path passed to -O client-certfile=<file>
    - User-selected private-key path passed to -O client-privfile=<file>
history:
  adoption-history:
    - >
      The first documented use was a 2004 comparison of IPv4 and IPv6 paths. By 2008,
      volunteers in 53 cities used scamper to collect data for CAIDA's IPv6 AS-core
      visualization.
    - >
      scamper became the prober deployed in CAIDA's Macroscopic Topology Project and has
      been distributed through BSD ports, Debian and Ubuntu, Homebrew, MacPorts, NetBSD
      pkgsrc, openSUSE, and an Ubuntu PPA.
  package-nerd-significance:
    - >
      scamper is more than an enhanced traceroute: it is a reusable active-measurement
      engine with a stable native warts format, numerous companion analysis tools,
      control APIs, and bindings. This makes it valuable both as a Unix diagnostic
      package and as research infrastructure.
  project-history:
    - >
      Matthew Luckie developed scamper as a scalable and extensible active
      Internet-measurement system. Initial development received WIDE Project funding in
      association with CAIDA for the twelve months ending April 2005.
    - >
      Its architecture was designed to interleave parallel measurements while limiting
      intrusive probing. Over time it accumulated IPv4 and IPv6 ping and traceroute
      methods, alias-resolution techniques, MDA traceroute, DNS, HTTP, UDP, OWAMP, and
      TCP-behavior tests.
    - >
      The architecture and early operational experience were documented in a paper
      presented at the 2010 Internet Measurement Conference. Development and snapshot
      releases have continued under CAIDA.
  related-projects:
    - skitter, identified by CAIDA as scamper's predecessor.
    - CAIDA's Macroscopic Topology Project and Archipelago measurement infrastructure.
    - MIDAR, for which scamper supplies measurement primitives.
  sources:
    - https://www.caida.org/catalog/software/scamper/
    - https://www.caida.org/catalog/software/scamper/architect/
    - https://www.caida.org/catalog/software/scamper/scamper.pdf
  summary:
    - >
      scamper is a portable active network-measurement utility and framework developed
      by Matthew Luckie. It performs parallel IPv4 and IPv6 probing and supports
      experiments ranging from ordinary ping and traceroute to topology,
      alias-resolution, DNS, HTTP, and transport-protocol measurements.
  timeline:
    - '2004: First documented use compared forward paths for IPv4 and IPv6 destinations.'
    - '2005: Initial WIDE Project and CAIDA funding period concluded.'
    - '2008: Volunteers in 53 cities collected IPv6 topology data with scamper.'
    - '2010: The scamper architecture paper appeared at the Internet Measurement Conference.'
    - '2026: CAIDA continued publishing current source snapshots.'
  usage:
    - >
      Operators can supply measurement tasks from command lines, files, or a control
      socket and collect results in scamper's metadata-rich warts format. Researchers
      commonly automate a running process through driver programs, the Python module, or
      the libscamperctrl and libscamperfile C APIs.
category: networking
package-manager:
