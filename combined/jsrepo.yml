id: brew:jsrepo
display-name: jsrepo
homepage: https://jsrepo.dev/
repo: https://github.com/jsrepojs/jsrepo
docs:
  - https://www.jsrepo.dev/docs
config-file-location:
  unix: jsrepo.config.ts
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026 the project had a Homebrew formula and a release stream in the
      jsrepojs/jsrepo repository. The official GitHub organization also presents related
      projects such as jsrepo.com and registry-kit, indicating that the CLI grew
      alongside hosted and registry-building infrastructure.
  package-nerd-significance:
    - >
      jsrepo is package-nerd significant because it blurs the line between package
      manager and code distribution system. Instead of installing compiled or bundled
      dependencies, it helps registries copy source into a project, track updates, and
      preserve consumer ownership of the code.
  project-history:
    - >
      The jsrepo repository was created on GitHub on 2024-09-07, with an initial commit
      the same day. The README describes jsrepo as a registry toolchain for distributing
      code in any language anywhere with one CLI, while the documentation frames the
      project as a response to the growth of reusable source registries after shadcn/ui
      popularized source-owned component distribution.
    - >
      The public documentation describes both sides of the workflow: registry owners can
      build and verify registries without writing their own CLI or hosting layer, while
      consumers can add, update, and authenticate to items from multiple registries. The
      website also shows `jsrepo.config.ts` as the configuration file produced during
      initialization.
  related-projects:
    - >
      The official docs explicitly discuss shadcn/ui as an influence. Related jsrepojs
      projects include jsrepo.com and registry-kit, and the tool also touches private
      registries, provider adapters, transforms, and LLM-friendly registry
      documentation.
  sources:
    - https://api.github.com/repos/jsrepojs/jsrepo
    - https://formulae.brew.sh/formula/jsrepo
    - https://github.com/jsrepojs
    - https://github.com/jsrepojs/jsrepo
    - https://github.com/jsrepojs/jsrepo/commit/74b2af0010342b9986609e2b75a184053ff26bae
    - https://github.com/jsrepojs/jsrepo/releases/tag/jsrepo%403.8.0
    - https://www.jsrepo.dev/
    - https://www.jsrepo.dev/docs
  summary:
    - >
      jsrepo is a modern registry toolchain for distributing source code through
      registries and consuming it with a CLI. It belongs to the post-shadcn/ui wave of
      tools that treat reusable components and code snippets as source a project can own
      rather than opaque package artifacts.
  timeline:
    - '2024-09-07: GitHub repository creation and initial commit.'
    - '2026-06-12: jsrepo@3.8.0 release published.'
    - '2026-06-12: GitHub repository metadata records a push on this date.'
  usage:
    - >
      A user typically runs `npx jsrepo init` or the packaged `jsrepo` binary to
      configure a project, then uses registry commands to add or update items. Registry
      authors define items in `jsrepo.config.ts`, build registries, and can use provider
      adapters and transforms documented by the project.
related-packages:
  - id: brew:shadcn
    reason: >
      Choose shadcn for its React-focused open-code component system; choose jsrepo for
      a language-agnostic registry toolchain that can also consume and emit
      shadcn-compatible registries.
    rel: alternative
    sources:
      - https://www.jsrepo.dev/docs
      - https://www.jsrepo.dev/
      - https://ui.shadcn.com/docs/cli
      - https://ui.shadcn.com/docs/registry
category: developer-tools
package-manager:
  brew: jsrepo
package-manager-url: https://formulae.brew.sh/formula/jsrepo
license: MIT
tags:
  - cli
  - code-distribution
  - components
  - registry
  - toolchain
description: Build and distribute your code
executables:
  - jsrepo
provenance:
  formula: jsrepo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
