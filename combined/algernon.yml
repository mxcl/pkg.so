id: brew:algernon
display-name: Algernon
homepage: https://algernon.roboticoverlords.org
repo: https://github.com/xyproto/algernon
docs:
  - https://algernon.roboticoverlords.org
  - https://github.com/xyproto/algernon#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Algernon is packaged beyond Homebrew, with the README linking to Repology
      packaging status and the input facts listing Homebrew, Arch, Scoop, and WinGet
      package names. The GitHub repository had thousands of stars and over a hundred
      forks in the official GitHub API metadata checked for this batch, which is
      meaningful adoption for a niche web-server tool.
    - >
      The project also publishes release artifacts and Docker images, which matters for
      a server tool because users often want either a package-manager install for local
      use or a container for deployment experiments.
  package-nerd-significance:
    - >
      Algernon is a good example of the Go single-binary packaging style applied to web
      serving. It competes less with nginx or Caddy as infrastructure and more with ad
      hoc local servers, static-site preview tools, and small internal web apps where
      eliminating runtime dependencies is attractive.
    - >
      Its formula is interesting because it packages a broad web runtime surface behind
      one executable, so distribution maintainers are shipping a surprisingly capable
      server without a language runtime dependency chain.
  project-history:
    - >
      The public GitHub repository was created in March 2015 under xyproto/algernon. Its
      official README describes a web server with built-in support for HTTP/2,
      HTTP/3/QUIC, Lua, Teal, Markdown, Pongo2, Amber, Sass/SCSS, JSX/TypeScript,
      databases, plugins, users, and permissions.
    - >
      The project grew around the idea that common web-serving and lightweight
      application tasks should not require a stack of background converters or service
      components. The README emphasizes that it is a small self-contained executable,
      with Go providing the portability base and embedded interpreters and renderers
      providing the dynamic behavior.
  related-projects:
    - >
      Related tools include Caddy and nginx for web serving, Python's simple HTTP server
      for local file serving, and Lua-enabled web stacks for scriptable request
      handling.
  sources:
    - https://api.github.com/repos/xyproto/algernon
    - https://github.com/xyproto/algernon
    - https://raw.githubusercontent.com/xyproto/algernon/main/README.md
    - https://raw.githubusercontent.com/xyproto/algernon/main/TUTORIAL.md
    - source_facts.package-manager
  summary:
    - >
      Algernon is a self-contained Go web server and application server aimed at serving
      Markdown, Lua, templates, and modern web assets with little setup. In
      package-manager terms it sits in the small-binary web-server lane: install one
      executable, point it at a directory or script, and get a batteries-included local
      or production-ish server.
  timeline:
    - '2015: Public GitHub repository created.'
    - >
      2010s-2020s: Project expands from Lua, Markdown, and template serving into a
      broader Go web application server.
    - '2026: Official repository metadata still shows active pushes and releases.'
  usage:
    - >
      Typical use is to install the binary, run `algernon` against a directory or Lua
      script, and let special filenames such as `index.lua`, `index.md`, template files,
      or JSX/TSX files determine how content is served. The tutorial shows the smallest
      loop as writing a Lua handler and running `algernon hello.lua`.
    - >
      Package users care about the low-friction behavior: Markdown preview, Lua-backed
      endpoints, local development with auto-refresh, HTTP/2 and QUIC support, and
      database fallback behavior are all available from the same installed command.
related-packages:
  - id: brew:caddy
    reason: >
      Choose Caddy when automatic certificate management and a conventional production
      web-server or reverse-proxy configuration are more important than Algernon's
      embedded Lua and content-processing runtime.
    rel: alternative
    sources:
      - https://github.com/xyproto/algernon
      - https://caddyserver.com/docs/
      - https://caddyserver.com/docs/quick-starts/https
  - id: brew:redis
    reason: >
      Algernon officially supports Redis as its recommended external database backend,
      making Redis a practical companion for applications that should not use Algernon's
      built-in Bolt fallback.
    rel: adjacent_workflow
    sources:
      - https://github.com/xyproto/algernon#readme
      - https://redis.io/docs/latest/
category: networking
package-manager:
  brew: algernon
  pacman: algernon
  scoop: main/algernon
  winget: xyproto.algernon
package-manager-url: https://formulae.brew.sh/formula/algernon
license: BSD-3-Clause
tags:
  - cli
  - go
  - http2
  - http3
  - lua
  - markdown
  - web-server
description: Pure Go web server with Lua, Markdown, HTTP/2 and template support
executables:
  - algernon
  - mdview
provenance:
  formula: algernon
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
