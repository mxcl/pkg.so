id: brew:euler-py
display-name: EulerPy
homepage: https://github.com/iKevinY/EulerPy
repo: https://github.com/iKevinY/EulerPy
docs:
  - https://github.com/iKevinY/EulerPy#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation from PyPI with pip and from Homebrew on
      OS X. The input package facts also list Homebrew, Debian, Ubuntu, and Scoop
      package names.
  package-nerd-significance:
    - >
      EulerPy is a compact example of a Python CLI distributed through both Python
      packaging and OS package managers, with a console-script entry point named `euler`
      and behavior centered on local working-directory conventions rather than global
      configuration.
  project-history:
    - >
      The official repository was created on June 27, 2014, and the project changelog
      lists v1.0.0 as the initial release on the same date. Later releases added Python
      3 support, more bundled problem data, flexible verification, file-prefix handling,
      and Python 3.8 support.
  related-projects:
    - Project Euler
    - Local Euler
    - Click
    - PyPI
    - Homebrew
  sources:
    - GitHub API for iKevinY/EulerPy repository metadata.
    - Official EulerPy CHANGES.rst.
    - Official EulerPy README.rst.
    - Official EulerPy setup.py.
    - source_facts.package-manager
  summary:
    - >
      EulerPy is a Python command-line helper for Project Euler practice, focused on
      generating problem files and verifying solution output.
  timeline:
    - '2014: Initial v1.0.0 release.'
    - '2014: v1.1.0 added --verify-all and skipped-file naming.'
    - '2016: v1.3.0 added file prefixes and a --version flag.'
    - '2019: v1.4.0 added Python 3.8 support.'
  usage:
    - >
      EulerPy is run from a directory of Project Euler solution files. It can generate
      numbered Python templates with problem text, preview problems, verify current or
      selected solutions, skip problems, and run verification over all detected problem
      files.
related-packages: []
category: developer-tools
package-manager:
  brew: euler-py
  debian: euler
  scoop: extras/euler
  ubuntu: euler
package-manager-url: https://formulae.brew.sh/formula/euler-py
license: MIT
tags:
  - cli
  - click
  - problem-solving
  - programming-practice
  - project-euler
  - python
description: Project Euler command-line tool written in Python
executables:
  - euler
provenance:
  formula: euler-py
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
