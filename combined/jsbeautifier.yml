id: brew:jsbeautifier
display-name: js-beautify
homepage: https://beautifier.io
repo: https://github.com/beautifier/js-beautify
docs:
  - https://beautifier.io/
  - https://github.com/beautifier/js-beautify#readme
config-file-location:
  unix: .jsbeautifyrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The separate Homebrew formula exists because package consumers have historically
      encountered the same tool through multiple ecosystems: npm's js-beautify package,
      PyPI's jsbeautifier package, the beautifier.io web app, and OS package managers.
  package-nerd-significance:
    - >
      This package is interesting less as a separate codebase than as a packaging
      identity split: js-beautify and jsbeautifier point to the same formatter lineage
      while exposing different language-package ecosystems and release artifacts.
  project-history:
    - >
      Upstream history is shared with beautifier/js-beautify: the GitHub project began
      in 2008 as a JavaScript beautifier and grew into a formatter for JavaScript, CSS,
      HTML, and related syntaxes. The Python package exposes that project to
      Python-oriented packaging and scripting workflows under the jsbeautifier name.
  related-projects:
    - >
      Related projects include npm js-beautify, beautifier.io, Prettier, ESLint
      formatting workflows, and editor integrations that invoke JS Beautifier.
  sources:
    - https://beautifier.io/
    - https://formulae.brew.sh/formula/js-beautify
    - https://formulae.brew.sh/formula/jsbeautifier
    - https://github.com/beautifier/js-beautify
    - https://pypi.org/project/jsbeautifier/
    - https://pypi.org/pypi/jsbeautifier/json
  summary:
    - >
      The Homebrew jsbeautifier formula packages the Python-distributed side of the JS
      Beautifier project, using the jsbeautifier source distribution from PyPI rather
      than the npm js-beautify tarball.
  timeline:
    - '2008: Upstream js-beautify repository created.'
    - '2012: npm js-beautify package history began.'
    - >
      2026: PyPI jsbeautifier 2.0.1 source distribution was used by the Homebrew
      jsbeautifier formula.
  usage:
    - >
      Users install jsbeautifier when they want the beautifier from Python packaging or
      a package-manager formula that tracks the PyPI distribution while still using the
      familiar .jsbeautifyrc configuration conventions.
related-packages:
  - id: brew:prettier
    reason: >
      Choose Prettier when you want an opinionated formatter that enforces a consistent
      style across JavaScript, CSS, HTML, JSON, Markdown, YAML, and other supported
      languages; choose JS Beautifier when configurable beautification or partial
      JavaScript deobfuscation is the priority.
    rel: alternative
    sources:
      - https://github.com/beautifier/js-beautify#readme
      - https://prettier.io/docs/
category: developer-tools
package-manager:
  brew: jsbeautifier
  debian: jsbeautifier
  nix: jsbeautifier
  ubuntu: jsbeautifier
package-manager-url: https://formulae.brew.sh/formula/jsbeautifier
license: MIT
tags:
  - beautifier
  - cli
  - formatter
  - javascript
  - source-code
description: JavaScript unobfuscator and beautifier
executables:
  - js-beautify
provenance:
  formula: jsbeautifier
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
