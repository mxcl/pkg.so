id: brew:btop
display-name: btop
homepage: https://github.com/aristocratos/btop
repo: https://github.com/aristocratos/btop
docs:
  - https://github.com/aristocratos/btop#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/btop/btop.conf
    - ~/.config/btop/btop.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      btop became broadly packaged across Unix and Windows-oriented ecosystems. The
      README includes a Repology packaging badge and the input records packages for
      Alpine, Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Scoop, Ubuntu, winget, and
      zypper.
    - >
      Its adoption benefited from continuity with bashtop and bpytop themes and user
      expectations, while the C++ rewrite made it more suitable as a fast, native
      package-manager install than the earlier Bash and Python monitors.
  package-nerd-significance:
    - >
      btop is one of the canonical modern terminal-monitor packages: visually rich,
      cross-platform, actively packaged, and descended from a trilogy of Bash, Python,
      and C++ implementations by the same author. For package nerds it is a neat case
      study in rewriting a beloved script utility into a native package without losing
      the UI culture around themes and terminal ergonomics.
  project-history:
    - >
      btop began in May 2021 and reached v1.0.0 in September 2021, when the README
      announced the Linux version as complete. The project explicitly replaced the shell
      and Python implementations with a C++ version that could gather system information
      directly.
    - >
      The project quickly expanded beyond Linux: macOS support landed with v1.1.0 in
      November 2021, FreeBSD support with v1.2.0 in January 2022, OpenBSD and Linux GPU
      monitoring with v1.3.0 in January 2024, and NetBSD plus Intel GPU support with
      v1.4.0 in September 2024.
  related-projects:
    - bashtop is the original Bash resource monitor in the lineage.
    - bpytop is the Python port and continuation of bashtop.
    - btop4win is a Windows-focused related release linked from the btop README.
    - Repology is linked by the README to show packaging status across distributions.
  sources:
    - >
      Local git history from https://github.com/aristocratos/btop shows first commit in
      2021 and tags v1.0.0, v1.1.0, v1.2.0, v1.3.0, and v1.4.0.
    - >
      Official README describes btop as the C++ version and continuation of bashtop and
      bpytop: https://raw.githubusercontent.com/aristocratos/btop/main/README.md
    - >
      Official README news records v1.0.0 Linux completion, macOS, FreeBSD, GPU/OpenBSD,
      and NetBSD/Intel GPU milestones:
      https://raw.githubusercontent.com/aristocratos/btop/main/README.md
    - >
      Official bashtop and bpytop READMEs document the Bash and Python predecessor
      lineage: https://github.com/aristocratos/bashtop and
      https://github.com/aristocratos/bpytop
    - Package-manager adoption from source_facts.package-manager.
  summary:
    - >
      btop is a C++ terminal resource monitor and the continuation of aristocratos'
      earlier bashtop and bpytop monitors. It presents CPU, memory, disk, network,
      process, and GPU information in an interactive terminal UI.
  timeline:
    - '2021: Repository starts and v1.0.0 marks the complete Linux release.'
    - '2021: v1.1.0 adds macOS support.'
    - '2022: v1.2.0 adds FreeBSD support.'
    - '2024: v1.3.0 adds Linux GPU monitoring and OpenBSD support.'
    - '2024: v1.4.0 adds Intel GPU support and NetBSD support.'
  usage:
    - >
      Users run btop as an interactive terminal monitor to inspect resource graphs,
      per-process activity, disks, network interfaces, and supported GPU telemetry. It
      stores settings in btop.conf under the XDG config path or ~/.config/btop and can
      reuse btop++/bpytop/bashtop-style themes.
related-packages:
  - id: brew:bpytop
    reason: >
      Choose bpytop for the closely related Python implementation and predecessor
      interface when Python portability or compatibility with an existing bpytop setup
      matters more than btop's native C++ implementation.
    rel: alternative
    sources:
      - https://github.com/aristocratos/btop
      - https://github.com/aristocratos/bpytop
  - id: brew:htop
    reason: >
      Choose htop when the primary task is a mature, process-centric interactive viewer
      rather than btop's broader graph-oriented resource dashboard.
    rel: alternative
    sources:
      - https://github.com/aristocratos/btop#description
      - https://htop.dev/
category: system
package-manager:
  apk: btop
  brew: btop
  debian: btop
  dnf: btop
  macports: btop
  nix: btop
  pacman: btop
  scoop: main/btop
  ubuntu: btop
  winget: aristocratos.btop4win
  zypper: btop
package-manager-url: https://formulae.brew.sh/formula/btop
license: Apache-2.0
tags:
  - cli
  - process-monitor
  - resource-monitor
  - terminal-ui
description: Resource monitor. C++ version and continuation of bashtop and bpytop
executables:
  - btop
provenance:
  formula: btop
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
