id: brew:imessage-ruby
display-name: imessage-ruby
homepage: https://github.com/linjunpop/imessage
repo: https://github.com/linjunpop/imessage
docs:
  - https://github.com/linjunpop/imessage#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears modest and Mac-specific, which matches the tool's dependency on
      Message.app. The README documents installation as either a Homebrew package or a
      Ruby gem, and RubyGems records tens of thousands of total downloads across the
      gem's lifetime.
    - >
      The changelog shows a small maintenance burst in 2015, then later packaging fixes
      in 2022, including Homebrew installation behavior and gem builds without git
      installed.
  package-nerd-significance:
    - >
      imessage-ruby is interesting as a tiny wrapper around a proprietary desktop
      capability. It is the sort of package that exists because a platform has a useful
      local automation hook and users want it in cron jobs, shell scripts, or quick
      developer workflows.
    - >
      Its Homebrew formula is arguably as important as the gem: brew gives Mac users a
      one-command install path for a tool whose usefulness is inherently tied to macOS.
  project-history:
    - >
      The GitHub repository was created in November 2013, and the RubyGems API records
      version 0.0.1 on the same day. The changelog describes the initial implementation
      as sending iMessage, followed by attachment support in 0.1.0 and standalone
      execution support in 0.2.0.
    - >
      The project presents itself as the imessage gem, while Homebrew packages it as
      imessage-ruby to avoid ambiguity with Apple's service name and to make the
      executable installable through brew.
  related-projects:
    - Message.app on macOS is the platform application the tool automates.
    - >
      RubyGems distributes the imessage gem, while Homebrew distributes the
      imessage-ruby formula.
    - >
      Other Mac messaging automation projects, including Python and Rust iMessage
      tooling, occupy adjacent but usually broader reverse-engineering or API-wrapper
      territory.
  sources:
    - https://formulae.brew.sh/api/formula/imessage-ruby.json
    - https://github.com/linjunpop/imessage
    - https://raw.githubusercontent.com/linjunpop/imessage/master/CHANGELOG.md
    - https://raw.githubusercontent.com/linjunpop/imessage/master/README.md
    - https://rubygems.org/api/v1/gems/imessage.json
    - https://rubygems.org/api/v1/versions/imessage.json
  summary:
    - >
      imessage-ruby is a small Ruby command-line tool and gem for sending text and
      attachments through macOS Message.app. Its scope is intentionally narrow: expose
      Apple's desktop messaging app to shell commands.
  timeline:
    - '2013: Version 0.0.1 is published on RubyGems and implements sending iMessage.'
    - '2014: Version 0.0.2 keeps Ruby 1.9 compatibility.'
    - >
      2015: Version 0.1.0 adds attachment sending; 0.2.0 makes standalone execution
      possible; 0.3.x improves errors and Homebrew installation behavior.
    - '2022: Version 0.4.0 fixes gem builds without git installed.'
  usage:
    - >
      The CLI accepts text, an optional attachment, and comma-separated contacts. A
      typical invocation sends a message body to an email address or phone contact and
      optionally includes a file attachment.
    - >
      Because it drives Message.app on macOS, it belongs to local automation and
      developer convenience scripts rather than cross-platform messaging infrastructure.
related-packages: []
category: developer-tools
package-manager:
  brew: imessage-ruby
package-manager-url: https://formulae.brew.sh/formula/imessage-ruby
license: MIT
tags:
  - cli
  - imessage
  - macos
  - messaging
  - ruby
description: Command-line tool to send text and attachment in Message.app
executables:
  - imessage
provenance:
  formula: imessage-ruby
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
