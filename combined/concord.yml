id: brew:concord
display-name: Concord
homepage: https://github.com/chojs23/concord
repo: https://github.com/chojs23/concord
docs:
  - https://github.com/chojs23/concord#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/concord/config.toml
    - $XDG_CONFIG_HOME/concord/keymap.toml
    - ~/.config/concord/config.toml
    - ~/.config/concord/keymap.toml
credentials-file-location:
  unix:
    - $XDG_STATE_HOME/concord/credentials.toml
    - ~/.local/state/concord/credentials.toml
history:
  adoption-history:
    - >
      Because Concord is young, official sources show distribution breadth more clearly
      than long-term adoption: it ships via Homebrew and Nix, offers an npm wrapper
      around release binaries, and supports cargo-dist installers.
  package-nerd-significance:
    - >
      For package catalogs, Concord is notable as a fast-moving Rust TUI with
      multi-channel distribution and native dependency concerns such as Opus and
      platform audio support.
  project-history:
    - >
      The official repository was created in May 2026 and began publishing frequent
      GitHub releases soon after. The README documents installation through Homebrew,
      npm, Cargo, Nix, GitHub release installers, and source builds.
  sources:
    - https://github.com/chojs23/concord
    - https://github.com/chojs23/concord#readme
    - https://github.com/chojs23/concord/releases
  summary:
    - >
      Concord is a Rust terminal user interface client for Discord built with ratatui,
      packaged for users who want a Discord client in a terminal rather than a browser
      or desktop GUI.
  timeline:
    - '2026: Official GitHub repository created.'
    - >
      2026: Frequent v2.x GitHub releases published with Homebrew, npm, Cargo, Nix, and
      installer paths documented.
  usage:
    - >
      Concord supports token, email/password, and QR-code login flows, stores app
      options and key bindings in TOML files under the config directory, and prefers
      system keychain storage for tokens with a plaintext state-directory fallback.
related-packages:
  - id: cask:discord
    reason: >
      Choose Discord's official desktop client when you prefer a supported graphical
      client and want to avoid the account and terms-of-service risks that Concord
      documents for unofficial clients.
    rel: alternative
    sources:
      - https://github.com/chojs23/concord#readme
      - https://discord.com/download
category: productivity
package-manager:
  brew: concord
  nix: concord
package-manager-url: https://formulae.brew.sh/formula/concord
license: GPL-3.0-only
tags:
  - cli
  - discord
  - messaging
  - rust
  - terminal-client
  - tui
description: Terminal user interface client for Discord
executables:
  - concord
provenance:
  formula: concord
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
