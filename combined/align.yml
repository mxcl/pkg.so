id: brew:align
display-name: align
homepage: https://kinzler.com/me/align/
repo: null
docs:
  - https://kinzler.com/me/align
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package-manager facts show align remains packaged by Homebrew and Nix,
      but the official project page does not document wider adoption beyond its Unix
      filter audience.
  package-nerd-significance:
    - >
      align is the kind of small, durable command-line filter package managers preserve
      because it composes with pipes and solves a narrow formatting job without a larger
      table-processing dependency.
  project-history:
    - >
      The official page dates align to the 2000-2001 copyright period and the bundled
      width tool to 1993-2001. The page itself is dated December 2001 and advertises
      align 1.7.5 as a downloadable tarball rather than a public source-control
      repository.
    - >
      The implementation is presented as installable Perl scripts: users can put align
      and width directly on PATH or use the supplied Makefile.
  related-projects:
    - 'width: bundled companion utility for measuring printable line width.'
  sources:
    - 'Official align homepage: https://kinzler.com/me/align'
    - source_facts.package-manager
  summary:
    - >
      align is a small Unix-style text filter by Stephen B. Kinzler for vertically
      aligning columns in separated text, distributed with the companion width utility.
  timeline:
    - '1993: width companion utility copyright period begins.'
    - '2000-2001: align copyright period.'
    - '2001: Official page dated December 2001 advertises align 1.7.5.'
  usage:
    - >
      Typical use is in pipelines over logs or tables. With whitespace-separated
      columns, align can infer separators and print aligned output; options can control
      input separators, output joiners, and left, right, center, numeric, or zero-padded
      numeric alignment. The companion width utility reports line widths and longest
      lines.
related-packages: []
