id: brew:argo
display-name: Argo Workflows
homepage: https://argoproj.io
repo: https://github.com/argoproj/argo-workflows
docs:
  - https://argo-workflows.readthedocs.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Argo Workflows' own README calls it the most popular workflow execution engine for
      Kubernetes and says about 200+ organizations officially use it. The official
      USERS.md list includes large technology, finance, cloud, media, and AI/data
      companies, and the Argo repository points each subproject to its adopter list. Its
      use cases page and README emphasize machine-learning pipelines, data and batch
      processing, infrastructure automation, CI/CD, and other Kubernetes jobs.
    - >
      The ecosystem around it is broad: the README names Argo Events, Hera, Katib,
      Kedro, Kubeflow Pipelines, Netflix Metaflow, Seldon, SQLFlow, and others as
      projects that use or rely on Argo Workflows. That adoption pattern made the CLI
      useful not only for direct workflow authors, but also for platform teams building
      higher-level ML, data, and batch-compute systems on Kubernetes.
  package-nerd-significance:
    - >
      Argo Workflows is significant because it turned Kubernetes CRDs into a mainstream
      packaging and operations surface for workflow engines. A package install gives you
      a local `argo` binary, but the real artifact is a contract with cluster-side CRDs,
      controllers, Helm charts, and YAML manifests, making it a canonical example of
      cloud-native CLI packaging.
    - >
      For package maintainers, it also illustrates a common modern split: the Homebrew
      formula builds one CLI executable, while the upstream project simultaneously
      publishes controller images, manifests, docs, examples, SDKs, and a larger
      CNCF-governed ecosystem.
  project-history:
    - >
      The argo-workflows GitHub repository was created in August 2017. Over time it
      became one of the four main Argo subprojects alongside Argo CD, Argo Events, and
      Argo Rollouts. Its README describes the broader Argo project as a collection of
      tools for getting work done with Kubernetes and identifies Argo Workflows as the
      container-native workflow engine.
    - >
      The project matured from a Kubernetes workflow controller into a CNCF graduated
      project with documented governance, maintainers, community meetings, release
      branches, client libraries, and security process. Official releases now span both
      the 3.x maintenance line and the 4.x line, with Homebrew packaging the `argo`
      binary from argoproj/argo-workflows tags.
  related-projects:
    - >
      The official Argo project groups Argo Workflows with Argo CD, Argo Events, and
      Argo Rollouts. The README also points to client libraries including Go, Java, Hera
      for Python, and Juno for TypeScript.
  sources:
    - https://api.github.com/repos/argoproj/argo-workflows
    - https://api.github.com/repos/argoproj/argo-workflows/releases
    - https://github.com/argoproj/argo-workflows#readme
    - https://github.com/argoproj/argo-workflows/blob/main/USERS.md
    - https://github.com/argoproj/argoproj#readme
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/a/argo.rb
  summary:
    - >
      Argo Workflows is the Argo project's Kubernetes-native workflow engine. The
      project implements workflows as Kubernetes custom resources, models work as
      container steps or DAG tasks, and ships the `argo` CLI for submitting, linting,
      watching, and managing workflow objects.
  timeline:
    - '2017: argo-workflows GitHub repository created.'
    - '2020: Argo Workflows user survey summary published by the Argo project.'
    - '2021: Argo Workflows user survey results published by the Argo project.'
    - >
      2022: v3.3.6 is the earliest GitHub release visible through the releases API
      snapshot used for this enrichment.
    - '2023: Argo Workflows and Events user survey results published.'
    - '2026: v4.0.x and v3.7.x release lines are both active in GitHub releases.'
  usage:
    - >
      Users define Workflows or CronWorkflows as Kubernetes YAML and use the `argo` CLI
      to lint, submit, list, watch, retry, resubmit, suspend, resume, terminate, and
      inspect them. The workflow controller then schedules each step as a container,
      supports artifacts and parameters, handles DAG or step sequencing, and integrates
      with Kubernetes-native scheduling, service accounts, volumes, and secrets.
    - >
      The Homebrew formula builds the CLI from source and tests `argo version` plus
      `argo lint --kubeconfig`, reflecting the package-manager view of Argo as a local
      Kubernetes client tool. In actual clusters, the CLI is paired with the controller,
      CRDs, optional UI/server, archives, metrics, and SSO features documented by the
      project.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Argo Workflows requires a Kubernetes cluster, and its official quick start uses
      kubectl to install the controller and CRDs before workflows are submitted with
      `argo`.
    rel: adjacent_workflow
    sources:
      - https://argo-workflows.readthedocs.io/en/latest/quick-start/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:helm
    reason: >
      The official installation guide supports a Helm chart for deploying the
      cluster-side Argo Workflows components that the packaged `argo` client manages.
    rel: adjacent_workflow
    sources:
      - https://argo-workflows.readthedocs.io/en/latest/installation/
      - https://helm.sh/docs/
  - id: brew:kustomize
    reason: >
      Argo Workflows officially documents Kustomize overlays for adapting its release
      manifests, making Kustomize useful when installation changes should remain
      declarative patches.
    rel: adjacent_workflow
    sources:
      - https://argo-workflows.readthedocs.io/en/latest/installation/
      - https://kubectl.docs.kubernetes.io/guides/introduction/kustomize/
category: cloud-infrastructure
