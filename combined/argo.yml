  brew: argo
  scoop: main/argo
package-manager-url: https://formulae.brew.sh/formula/argo
license: Apache-2.0
tags:
  - ci-cd
  - cli
  - containers
  - kubernetes
  - workflows
description: Get stuff done with container-native workflows for Kubernetes
executables:
  - argo
provenance:
  formula: argo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
