history:
  adoption-history:
    - >
      GenOffice is distributed for macOS, Windows, and Linux and exposes the same
      document engines through its graphical applications, the `genoffice` command, an
      agent skill, and an MCP server. Official instructions target interoperability with
      several coding-agent clients rather than limiting automation to the desktop UI.
  package-nerd-significance:
    - >
      GenOffice packages a graphical office suite, headless document tooling, an agent
      skill, and MCP integration together. This is significant for package users because
      installed desktop software also becomes a local automation backend capable of
      producing native Office files rather than intermediary Markdown or screenshots.
  project-history:
    - >
      GenOffice was developed as an open-source, local-first office workspace
      encompassing word-processing, spreadsheet, presentation, PDF, HTML, and Markdown
      editors. The project emphasizes native document formats and preserving untouched
      portions of Office files.
    - >
      The project expanded the same document engines into the `genoffice` CLI and agent
      integrations, allowing document inspection, conversion, creation, structured
      editing, rendering, and validation without opening the graphical application.
  related-projects:
    - >
      GenOffice integrates with skills-aware coding agents and generic MCP clients.
      Documents remain compatible with conventional Office applications because its
      workflows target native DOCX, XLSX, and PPTX files.
  sources:
    - https://genoffice.ai/
    - https://github.com/genspark-ai/genoffice#readme
    - https://github.com/genspark-ai/genoffice/blob/main/packages/cli/README.md
    - https://github.com/genspark-ai/genoffice/blob/main/skills/genoffice/SKILL.md
  summary:
    - >
      GenOffice is an open-source office suite with editors for DOCX, XLSX, PPTX, PDF,
      HTML, and Markdown, a built-in AI assistant, and local CLI and MCP automation.
  timeline:
    - >
      2026: Official project materials document a unified six-editor desktop suite
      together with its `genoffice` CLI, agent skill, and MCP workflows.
  usage:
    - >
      Users can open and edit Office documents and PDFs in the desktop applications or
      use the bundled CLI for inspection, conversion, creation, structured edits,
      rendering, and validation. Local document operations remain on the machine;
      optional AI, search, image, and media features use the provider configured in
      Settings.
