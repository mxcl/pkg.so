id: brew:fpp
display-name: PathPicker
homepage: https://facebook.github.io/PathPicker/
repo: https://github.com/facebook/PathPicker
docs:
  - https://facebook.github.io/PathPicker
  - https://github.com/facebook/PathPicker#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README presents Homebrew as the easiest macOS installation path with brew
      install fpp, describes Debian packaging steps, links an Arch AUR package, and
      documents manual installation by symlinking the fpp script into /usr/local/bin. It
      also notes supported shells including Bash, Zsh, csh, fish, and rc, and links a
      tmux-fpp add-on.
  package-nerd-significance:
    - >
      PathPicker is a neat Unix-package example because it does not replace git, grep,
      find, or editors; it adds an interactive file-selection layer to existing
      pipelines. Its value is the small fpp command and its shell integration, making it
      memorable among terminal UI tools packaged by Homebrew and Linux distributions.
  project-history:
    - >
      PathPicker was published by Facebook with a GitHub Pages site and repository
      documentation. The project combines a shell entry point with small Python modules:
      it parses noisy input with regular expressions, shows a curses selector UI, then
      emits commands for the shell wrapper to execute.
    - >
      The GitHub release history starts in 2015, with frequent early releases through
      0.6.x and 0.7.x, community bug-fix releases in 2019, and a 2022 release. The
      official site credits Facebook / Peter Cottle in its metadata.
  related-projects:
    - >
      The README names tmux-fpp as an add-on and shows PathPicker as a companion to git,
      Mercurial, grep, find, arc, shell pipelines, and the user's editor.
  sources:
    - https://api.github.com/repos/facebook/PathPicker/releases?per_page=20
    - https://facebook.github.io/PathPicker/
    - https://raw.githubusercontent.com/facebook/PathPicker/master/README.md
  summary:
    - >
      Facebook PathPicker is a command-line tool, installed as fpp, that parses piped
      terminal output for file paths and presents an interactive selector. The official
      README frames it as a solution to the common shell problem of selecting files from
      command output.
  timeline:
    - '2015: Public GitHub releases began with the 0.5.x series.'
    - '2015: Version 0.6.0 was published as a larger update.'
    - '2015: Version 0.7.0 added stability and AllInput mode.'
    - '2017: Version 0.7.2 was published.'
    - '2019: Version 0.9.2 switched to Python 3 by default.'
    - '2022: Version 0.9.5 was published as a later maintenance release.'
  usage:
    - >
      PathPicker is typically inserted at the end of a pipeline, for example git status
      | fpp, git grep | fpp, grep -r | fpp, git diff --stat | fpp, find output | fpp, or
      arc inlines | fpp. Selected files can be opened in $EDITOR or passed into an
      arbitrary command with the selected paths appended or substituted through the $F
      token.
related-packages:
  - id: brew:fzf
    reason: >
      Choose fzf when you need a general-purpose fuzzy selector for arbitrary
      standard-input lines or filesystem entries rather than PathPicker's specialized
      extraction and command handling for file paths embedded in noisy output.
    rel: alternative
    sources:
      - https://github.com/facebook/PathPicker#readme
      - https://github.com/junegunn/fzf#readme
category: developer-tools
package-manager:
  apk: fpp
  brew: fpp
  macports: fpp
  nix: fpp
package-manager-url: https://formulae.brew.sh/formula/fpp
license: MIT
tags:
  - cli
  - developer-tool
  - file-picker
  - pipes
  - terminal-ui
description: CLI program that accepts piped input and presents files for selection
executables:
  - fpp
provenance:
  formula: fpp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
