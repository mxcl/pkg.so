id: brew:kubevious
display-name: Kubevious CLI
homepage: https://kubevious.io
repo: https://github.com/kubevious/cli
docs:
  - https://kubevious.io/docs
  - https://github.com/kubevious/cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI has a smaller footprint than KubeVela or kubespy, but it is distributed
      through Homebrew, npm, precompiled binaries, Docker, and GitHub Actions
      Marketplace. Its repository release list shows many 1.0.x releases, which suggests
      maintenance around Kubernetes schema and rule details.
  package-nerd-significance:
    - >
      Kubevious CLI is package-nerd significant as a validation binary that can sit in
      pre-commit hooks, CI, and package-manager install paths. It overlaps with kubeval,
      kubeconform, conftest, Polaris, and kube-score, but its README emphasizes
      application-centric, cross-manifest validation inherited from the Kubevious
      dashboard.
  project-history:
    - >
      The Kubevious CLI README says the CLI was created from lessons learned in the
      Kubevious Dashboard project and from the evolution of its rules framework. That
      origin explains its emphasis on cross-manifest validation rather than checking one
      YAML file at a time.
  related-projects:
    - >
      Related projects include Kubevious Dashboard, Kubernetes Dashboard, kubeval,
      kubeconform, conftest, Polaris, kube-score, Helm, and Kustomize. The CLI is
      closest to policy and manifest validation tools, but with Kubevious-specific
      app-centric correlation.
  sources:
    - https://formulae.brew.sh/formula/kubevious
    - https://github.com/kubevious/cli
    - https://github.com/kubevious/cli/releases
    - https://github.com/marketplace/actions/kubevious-cli
    - https://kubevious.io/
    - https://kubevious.io/docs
  summary:
    - >
      Kubevious CLI is a Kubernetes manifest assurance and validation tool. It packages
      the Kubevious rules-and-dashboard lineage into a command suitable for local YAML
      checks, GitOps validation, CI/CD pipelines, and live-cluster troubleshooting.
  timeline:
    - >
      2020: Public Kubevious dashboard material described an application-centric
      Kubernetes validation and visualization project.
    - >
      2023: Kubevious CLI mirror/package metadata described the CLI as the newer
      standalone validation tool based on the dashboard foundation.
    - >
      2025: The GitHub release list showed the v1.0.6x series with fixes and rule/schema
      changes.
  usage:
    - >
      Users run kubevious guard or lint against files, directories, URLs, stdin, Helm
      charts, Kustomize output, and live-cluster manifests. The tool is meant to catch
      typos, schema errors, conflicts, inconsistencies, compliance issues, and
      best-practice violations before changes reach a cluster.
related-packages:
  - id: brew:kubeconform
    reason: >
      Choose Kubeconform for fast local or CI validation against Kubernetes and
      custom-resource schemas when you do not need Kubevious's cross-manifest rules and
      application correlation.
    rel: alternative
    sources:
      - https://github.com/kubevious/cli
      - https://github.com/yannh/kubeconform
  - id: brew:kube-score
    reason: >
      Choose kube-score when the main goal is static recommendations for Kubernetes
      reliability and security rather than Kubevious's broader schema, consistency, and
      application-aware validation.
    rel: alternative
    sources:
      - https://github.com/kubevious/cli
      - https://github.com/zegl/kube-score
  - id: brew:conftest
    reason: >
      Choose Conftest when you need to author organization-specific configuration
      policies in Rego instead of using Kubevious's built-in Kubernetes rules framework.
    rel: alternative
    sources:
      - https://github.com/kubevious/cli
      - https://www.conftest.dev/
category: cloud-infrastructure
package-manager:
  brew: kubevious
package-manager-url: https://formulae.brew.sh/formula/kubevious
license: Apache-2.0
tags:
  - cli
  - compliance
  - kubernetes
  - misconfiguration-detection
  - policy-validation
description: Detects and prevents Kubernetes misconfigurations and violations
executables:
  - kubevious
provenance:
  formula: kubevious
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
