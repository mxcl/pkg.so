id: brew:ly
display-name: python-ly
homepage: https://github.com/frescobaldi/python-ly
repo: https://github.com/frescobaldi/python-ly
docs:
  - https://python-ly.readthedocs.io/
  - https://github.com/frescobaldi/python-ly#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      python-ly has adoption through its role in Frescobaldi and through packaging as
      the `ly` CLI in multiple package managers. The batch metadata lists Alpine,
      Homebrew, Fedora/DNF, Nix, and Arch packages, giving it a broader footprint than a
      one-project helper library would normally have.
  package-nerd-significance:
    - >
      For package nerds, `ly` is a good example of a domain-specific CLI that ships from
      a Python library but matters in desktop publishing and music-engraving workflows.
      It connects command-line pipelines, Python APIs, Frescobaldi, and GNU LilyPond's
      plain-text score format.
  project-history:
    - >
      The project is written by the Frescobaldi developers, with Wilbert Berendsen named
      as the main author, and is used extensively by the Frescobaldi music-notation
      editor. Its Git history starts in December 2010 with tokenizer and highlighter
      work, while the public tag history includes v0.7 in January 2015 and later v0.9.x
      releases.
    - >
      The documentation was built with Sphinx and published on Read the Docs. It
      describes both the `ly` command and the `ly` Python module, which includes lexers,
      document/token structures, pitch and indentation helpers, LilyPond data
      extraction, and related tooling for music-notation processing.
  related-projects:
    - Frescobaldi uses python-ly extensively.
    - >
      GNU LilyPond is the plain-text music typesetter whose document format python-ly
      parses and manipulates.
  sources:
    - https://github.com/frescobaldi/python-ly
    - https://python-ly.readthedocs.io/
    - https://raw.githubusercontent.com/frescobaldi/python-ly/master/README.rst
    - https://raw.githubusercontent.com/frescobaldi/python-ly/master/doc/index.rst
    - source_facts.package-manager
  summary:
    - >
      python-ly is a Python library and command-line tool for parsing, manipulating,
      formatting, and creating documents in LilyPond notation format. The packaged
      executable is named `ly`.
  timeline:
    - '2010: Public Git history begins with tokenizer/highlighter work.'
    - '2015: Sphinx documentation is initialized and early v0.7-v0.9 tags are published.'
    - '2020: v0.9.6 and v0.9.7 are tagged after a long-running 0.9 series.'
    - '2026: v0.9.10 appears in the official tag history.'
  usage:
    - >
      The README documents `ly` for reformatting or reindenting LilyPond files,
      transposing music, translating pitch names, converting LilyPond to syntax-colored
      HTML, and experimentally converting LilyPond to MusicXML. A representative use is
      `ly "indent; transpose c d" -o output.ly file.ly`.
related-packages:
  - id: cask:frescobaldi
    reason: >
      Frescobaldi is the graphical LilyPond editing environment that officially uses
      python-ly extensively, making it the strongest companion for users who want an
      integrated score-editing workflow.
    rel: adjacent_workflow
    sources:
      - https://python-ly.readthedocs.io/en/latest/
      - https://frescobaldi.org/
  - id: brew:lilypond
    reason: >
      LilyPond engraves the `.ly` score sources that python-ly parses and transforms, so
      the two tools naturally form an edit-transform-typeset workflow.
    rel: adjacent_workflow
    sources:
      - https://python-ly.readthedocs.io/en/latest/
      - https://lilypond.org/
category: media
package-manager:
  apk: ly
  brew: ly
  dnf: ly
  nix: ly
  pacman: ly
package-manager-url: https://formulae.brew.sh/formula/ly
license: GPL-2.0-or-later
tags:
  - cli
  - document-processing
  - lilypond
  - music-notation
  - python
description: Parse, manipulate or create documents in LilyPond format
executables:
  - ly
  - ly-server
provenance:
  formula: ly
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
