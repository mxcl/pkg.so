id: brew:gdk-pixbuf
display-name: gdk-pixbuf
homepage: https://gtk.org
repo: https://gitlab.gnome.org/GNOME/gdk-pixbuf
docs:
  - https://docs.gtk.org/gdk-pixbuf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README states that GTK uses gdk-pixbuf for loading graphical assets, which
      made it part of the common GNOME and GTK runtime stack.
    - >
      The current README also warns that gdk-pixbuf should be used for trusted UI assets
      rather than arbitrary images and points users toward Glycin for sandboxed image
      loading.
  package-nerd-significance:
    - >
      gdk-pixbuf is package-nerd significant because it is a small-looking library that
      affects desktop image loading, GTK applications, thumbnailing, loader cache
      generation, optional codecs, and security posture around image parsers.
    - >
      Its loader-module model means packagers care about post-install loader queries,
      installed module locations, and which image formats are enabled.
  project-history:
    - >
      The official API reference describes GdkPixbuf 2.0 as an image loading library
      authored by the GTK Development Team, with source hosted in GNOME GitLab.
    - >
      The upstream README says gdk-pixbuf loads image data in formats such as PNG, JPEG,
      TIFF, TGA, and GIF, stores it as linear buffers in memory, and allows additional
      loader modules in well-known locations.
  related-projects:
    - >
      gdk-pixbuf is closely related to GTK, GLib/GObject, GNOME, and the Glycin
      sandboxed image-loading framework.
    - >
      It also intersects with image codec libraries such as libpng, libjpeg, and
      libtiff, which the README lists as optional build requirements depending on
      enabled format support.
  sources:
    - https://docs.gtk.org/gdk-pixbuf/
    - https://gitlab.gnome.org/GNOME/gdk-pixbuf
    - https://gitlab.gnome.org/GNOME/gdk-pixbuf/-/raw/master/NEWS
    - https://gitlab.gnome.org/GNOME/gdk-pixbuf/-/raw/master/README.md
  summary:
    - >
      gdk-pixbuf is the GNOME/GTK image-loading library for loading image data into
      pixel buffers that can be scaled, composited, modified, saved, or rendered.
  timeline:
    - 'GdkPixbuf 2.0: The current API namespace is documented as the 2.0 image loading library.'
    - >
      2025: Development NEWS entries add a Glycin loader and recommend relying on Glycin
      for sandboxed Linux image loading.
    - >
      2026: The API reference reports library version 2.44.6, while NEWS includes 2.44.7
      changes.
  usage:
    - >
      Developers use the library through the gdk-pixbuf/gdk-pixbuf.h C headers and the
      gdk-pixbuf-2.0 pkg-config file; package users also get CLI tools such as
      gdk-pixbuf-query-loaders and gdk-pixbuf-thumbnailer.
    - >
      Recent NEWS entries show a shift toward Glycin integration, optional thumbnailing,
      and deprecation of some older animation and XPM-related APIs.
related-packages:
  - id: brew:gtk4
    reason: >
      Use GdkPixbuf alongside GTK when an application needs to decode or manipulate
      pixel buffers before presenting image content in a GTK interface.
    rel: adjacent_workflow
    sources:
      - https://docs.gtk.org/gdk-pixbuf/
      - https://docs.gtk.org/gtk4/
category: media
package-manager:
  apk: gdk-pixbuf
  brew: gdk-pixbuf
  debian: gdk-pixbuf-tests
  nix: gdk-pixbuf
  ubuntu: gdk-pixbuf-tests
  zypper: gdk-pixbuf-devel
package-manager-url: https://formulae.brew.sh/formula/gdk-pixbuf
license: LGPL-2.1-or-later
tags:
  - c-library
  - cli
  - gnome
  - gtk
  - image-loading
  - pixel-buffer
description: Toolkit for image loading and pixel buffer manipulation
executables:
  - gdk-pixbuf-csource
  - gdk-pixbuf-pixdata
  - gdk-pixbuf-query-loaders
  - gdk-pixbuf-thumbnailer
provenance:
  formula: gdk-pixbuf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
