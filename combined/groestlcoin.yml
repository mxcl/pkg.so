id: brew:groestlcoin
display-name: Groestlcoin Core
homepage: https://www.groestlcoin.org/groestlcoin-core-wallet/
repo: https://github.com/Groestlcoin/groestlcoin
docs:
  - https://github.com/Groestlcoin/groestlcoin/tree/master/doc
  - https://www.groestlcoin.org/groestlcoin-core-wallet
config-file-location:
  linux: ~/.groestlcoin/groestlcoin.conf
  macos: ~/Library/Application Support/Groestlcoin/groestlcoin.conf
  windows: '%LOCALAPPDATA%\Groestlcoin\groestlcoin.conf'
credentials-file-location:
  linux:
    - ~/.groestlcoin/wallets/wallet.dat
    - ~/.groestlcoin/.cookie
  macos:
    - ~/Library/Application Support/Groestlcoin/wallets/wallet.dat
    - ~/Library/Application Support/Groestlcoin/.cookie
  windows:
    - '%LOCALAPPDATA%\Groestlcoin\wallets\wallet.dat'
    - '%LOCALAPPDATA%\Groestlcoin\.cookie'
history:
  adoption-history:
    - >
      Adoption has been package-driven in the same way as many long-running Bitcoin
      forks: users install Core to run a validating node, use the bundled CLI tools, and
      hold wallet data locally. Homebrew and Nix packaging make the multi-binary Core
      suite easier to install on developer workstations.
    - >
      The official roadmap shows a broad surrounding ecosystem rather than one Core
      binary alone: Electrum-GRS, Android wallets, GRSPay, c-lightning/Core Lightning
      ports, explorers, BlueWallet-derived clients, hardware-wallet integrations, and
      payment tooling.
  package-nerd-significance:
    - >
      Groestlcoin Core is a good package-nerd specimen because it is both a
      cryptocurrency daemon and a bundle of small administrative tools. Formula
      maintainers have to package a network service, RPC client, transaction tools,
      wallet tooling, and platform-specific data paths together.
    - >
      Its long roadmap also shows the maintenance burden of Bitcoin-derived coins that
      keep pace with upstream Bitcoin Core while maintaining separate branding,
      parameters, wallets, and Lightning/payment integrations.
  project-history:
    - >
      Groestlcoin's official GitHub organization describes the project as launched on
      March 22, 2014 with a focus on technological advancement. The Core repository is
      the integration and staging tree for the network's reference implementation.
    - >
      The project differentiated itself through rapid wallet and infrastructure work
      around a Bitcoin-derived core. Its official roadmap records early releases of
      desktop, Android, Electrum-derived, web, multisig, and tipping tools, followed by
      SegWit, Lightning, GRSPay, hardware-wallet, explorer, and payment-infrastructure
      work.
    - >
      Groestlcoin's own release writing emphasizes first-mover claims around SegWit and
      Taproot transactions on mainnet. Those claims are part of the project's identity
      and explain why the Core package tracks Bitcoin Core-era protocol features closely
      while carrying Groestlcoin-specific patches.
  related-projects:
    - Bitcoin Core is the architectural ancestor of Groestlcoin Core.
    - Electrum-GRS is a related lightweight wallet.
    - GRSPay is Groestlcoin's payment-server ecosystem project.
    - Core Lightning/c-lightning ports are part of Groestlcoin's Lightning tooling.
    - Groestlcoin mobile and hardware-wallet integrations are tracked in the official roadmap.
  sources:
    - https://github.com/Groestlcoin/groestlcoin
    - https://github.com/groestlcoin
    - https://www.groestlcoin.org/22nd-december-2021-release/
    - https://www.groestlcoin.org/development-progress/
    - https://www.groestlcoin.org/roadmap/
  summary:
    - >
      Groestlcoin Core is the full-node and wallet package for Groestlcoin, a
      peer-to-peer cryptocurrency launched on March 22, 2014. It follows the Bitcoin
      Core style of packaging: daemon, CLI, transaction utility, wallet utility, and
      local data directory.
  timeline:
    - '2014-03-22: Groestlcoin launched.'
    - '2014-06-22: Groestlcoin 2.1.0.6 release appeared on the official roadmap.'
    - >
      2015: The roadmap recorded Electrum-GRS, wallet32, MultiGroestl, mobile, multisig,
      and Armory-related work.
    - '2017-01-17: Groestlcoin Core v2.13.3 appeared on the roadmap during the SegWit era.'
    - >
      2018: The roadmap recorded GRSPay, Trezor One support, Electrum-GRS updates, and
      multiple wallet integrations.
    - >
      2021-06 and 2021-12: Official release writing recorded Taproot activation and
      transaction milestones on mainnet.
    - >
      2022-2024: The roadmap recorded Core releases 23.0.0 through 28.0.0 and continued
      Lightning/payment tooling updates.
  usage:
    - >
      The package provides `groestlcoind` for the node daemon, `groestlcoin-cli` for RPC
      control, `groestlcoin-wallet` for wallet operations, and transaction utilities
      such as `groestlcoin-tx` and `groestlcoin-util`.
    - >
      Operationally, it behaves like a Bitcoin Core-family package: the config file
      controls node and RPC behavior, `.cookie` is used for local RPC authentication,
      and `wallet.dat` or wallet files under the wallets directory contain sensitive
      wallet state.
related-packages:
  - id: cask:grs-bluewallet
    reason: >
      GRS BlueWallet is an official non-custodial thin-wallet alternative for users who
      want a graphical Groestlcoin wallet without operating the complete Groestlcoin
      Core node suite.
    rel: alternative
    sources:
      - https://www.groestlcoin.org/groestlcoin-core-wallet/
      - https://www.groestlcoin.org/grs-bluewallet/
      - https://github.com/Groestlcoin/BlueWallet
category: networking
package-manager:
  brew: groestlcoin
  nix: groestlcoin
package-manager-url: https://formulae.brew.sh/formula/groestlcoin
license: MIT
tags:
  - blockchain
  - cli
