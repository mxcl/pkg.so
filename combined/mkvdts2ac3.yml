id: brew:mkvdts2ac3
display-name: mkvdts2ac3
homepage: https://github.com/JakeWharton/mkvdts2ac3
repo: https://github.com/JakeWharton/mkvdts2ac3
docs:
  - https://github.com/JakeWharton/mkvdts2ac3
config-file-location:
  unix: ~/.mkvdts2ac3.rc
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/mkvdts2ac3
    - https://github.com/JakeWharton/mkvdts2ac3/blob/master/CHANGELOG.md
    - https://github.com/JakeWharton/mkvdts2ac3/blob/master/README.md
  summary:
    - >
      mkvdts2ac3 is a shell-script utility by Jake Wharton, with later work involving
      Chris Hoekstra, for a narrow home-media compatibility task: converting DTS audio
      inside Matroska files to AC3. The README says it depends on MKVToolNix for
      Matroska operations and ffmpeg for audio conversion, and its default behavior is
      to find the first DTS track in an MKV, convert it to AC3, and append it.
  usage:
    - >
      The changelog places much of the project's visible development in 2009-2011,
      including Jake Wharton and Chris Hoekstra version lines, a merged 1.5.0 line, new
      options for creating a new file, choosing the first audio track, forcing
      conversion, keeping tracks external, and user-loadable defaults in
      ~/.mkvdts2ac3.rc. Its package-manager niche is therefore not general video
      conversion, but a wrapper around mkvtoolnix and ffmpeg for devices or playback
      chains that accept AC3 more readily than DTS.
related-packages:
  - id: brew:mkvtoolnix
    reason: >
      MKVToolNix supplies the Matroska inspection, extraction, and remuxing commands
      used by mkvdts2ac3.
    rel: adjacent_workflow
    sources:
      - https://github.com/JakeWharton/mkvdts2ac3#readme
      - https://mkvtoolnix.download/doc/README.md
  - id: brew:ffmpeg
    reason: FFmpeg performs the documented DTS-to-AC-3 encoding stage in mkvdts2ac3's workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/JakeWharton/mkvdts2ac3#readme
      - https://ffmpeg.org/documentation.html
category: media
package-manager:
  brew: mkvdts2ac3
package-manager-url: https://formulae.brew.sh/formula/mkvdts2ac3
license: Apache-2.0
tags:
  - ac3
  - audio-conversion
  - cli
  - dts
  - matroska
description: Convert DTS audio to AC3 within a matroska file
executables:
  - mkvdts2ac3
provenance:
  formula: mkvdts2ac3
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
