id: brew:trdsql
display-name: trdsql
homepage: https://noborus.github.io/trdsql/
repo: https://github.com/noborus/trdsql
docs:
  - https://github.com/noborus/trdsql#readme
config-file-location:
  unix: ${HOME}/.config/trdsql/config.json
  windows: '%APPDATA%\trdsql\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      trdsql's adoption comes from the command-line data niche: users who have CSV,
      JSON, YAML, logs, or mixed tabular files but want real SQL operations without
      first creating a database schema. The official README documents binary downloads
      for Linux, Windows, and macOS, Docker usage, Go source builds, Homebrew, MacPorts,
      and FreeBSD packages.
    - >
      The batch input records broader package-manager coverage, including Homebrew,
      MacPorts, Nix, and Scoop. That package spread matches the tool's cross-platform
      promise: a single CLI for shell users who want SQL-shaped inspection and
      conversion across operating systems.
  package-nerd-significance:
    - >
      For package nerds, trdsql sits in the same toolbox as `jq`, `xsv`, `mlr`, `q`, and
      `textql`, but it occupies the SQL-first corner. It is attractive when a user
      already thinks in SELECT, JOIN, GROUP BY, and database engine behavior but wants
      package-manager installation and shell-pipeline ergonomics.
    - >
      The tool also shows the modern CLI packaging pattern: Go binary releases, Docker
      image, Homebrew and MacPorts formulas, Scoop availability, FreeBSD package notes,
      and source builds all coexist in the official installation docs.
  project-history:
    - >
      Noboru Saito developed trdsql as a practical bridge between shell data files and
      relational query engines. The official documentation explains its internal
      processing as option and SQL interpretation, importing file names from SQL
      commands into a database, executing SQL, and exporting the result in a requested
      output format.
    - >
      The project evolved from a text-query utility into a broader data conversion and
      analysis tool. The README documents direct SQL queries, file conversion mode,
      multiple input formats, multiple output formats, NULL handling, query files,
      compressed input and output, table-name shortcuts, joins, and selectable SQLite,
      PostgreSQL, or MySQL engines.
    - >
      The author's release-history pages show a maturing project. Version 0.13.0, posted
      November 12, 2023, introduced a shorter `-t` table-name syntax useful for simple
      format conversion and addressed macOS arm64 binary builds. Version 1.0.0, posted
      April 8, 2024, was marked stable by the author and followed improvements such as
      multiple SQL execution added in v0.20.0.
  related-projects:
    - The README explicitly compares trdsql with `q` and `textql`.
    - >
      Related database engines include SQLite, PostgreSQL, and MySQL, which trdsql can
      use as execution backends.
    - >
      Related shell data tools include `jq` for JSON selection and other table/file
      processors used in pipelines.
  sources:
    - 'Batch input field: source_facts.package-manager'
    - 'Official README: https://github.com/noborus/trdsql#readme'
    - 'Official docs site: https://noborus.github.io/trdsql/'
    - 'Official internals page: https://noborus.github.io/trdsql/11_summary/index.html'
    - >
      Official v0.13.0 release-history page:
      https://noborus.github.io/trdsql_history/trdsql_0130/index.html
    - >
      Official v1.0.0 release-history page:
      https://noborus.github.io/trdsql_history/trdsql_1000/index.html
  summary:
    - >
      trdsql is a Go command-line tool for executing SQL over tabular text and
      semi-structured files including CSV, LTSV, JSON, YAML, and TBLN. The official
      README positions it near tools such as `q` and `textql`, but emphasizes that
      trdsql can use PostgreSQL or MySQL syntax as well as SQLite.
  timeline:
    - >
      2023: v0.13.0 release notes document `-t` table-name shorthand, macOS arm64 binary
      fixes, and build-environment changes.
    - >
      2024: Official documentation site publishes trdsql overview, internals,
      configuration, SQL-engine, and format-conversion pages.
    - >
      2024: v1.0.0 release notes state that the author considered trdsql stable enough
      for a 1.0.0 release.
  usage:
    - >
      In day-to-day use, trdsql runs SQL directly against files, reads from standard
      input, converts between formats with output flags, handles CSV headers and
      delimiters, parses JSON with jq expressions, and emits CSV, TSV, JSON, JSON Lines,
      LTSV, YAML, Markdown, ASCII tables, raw output, and other formats.
    - >
      Its docs emphasize the tradeoff behind its power: trdsql imports data into an
      RDBMS before executing SQL, so it is not a streaming one-line-at-a-time filter. In
      exchange, users get real SQL semantics, joins, aggregation, window functions,
      configurable database engines, and format conversion in one package.
category: developer-tools
package-manager:
  brew: trdsql
  macports: trdsql
  nix: trdsql
  scoop: main/trdsql
package-manager-url: https://formulae.brew.sh/formula/trdsql
license: MIT
tags:
  - cli
  - csv
  - json
  - sql
  - yaml
description: CLI tool that can execute SQL queries on CSV, LTSV, JSON, YAML and TBLN
executables:
  - trdsql
provenance:
  formula: trdsql
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
