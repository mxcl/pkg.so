id: brew:cassowary
display-name: Cassowary
homepage: https://github.com/rogerwelin/cassowary
repo: https://github.com/rogerwelin/cassowary
docs:
  - https://github.com/rogerwelin/cassowary/blob/master/docs/LIBRARY.md
  - https://github.com/rogerwelin/cassowary#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is niche and developer-tool focused. The README documents installation
      through GitHub releases, Homebrew on macOS, Docker, Arch/Manjaro AUR, Nix/NixOS,
      and RPM-building support, and it advertises an Awesome Go mention.
    - Homebrew analytics show 119 installs in the last 365 days in the formula API.
  package-nerd-significance:
    - >
      Cassowary is package-nerd interesting as a compact Go alternative to older HTTP
      benchmark tools: it offers one static-ish cross-platform binary, modern metrics
      outputs, and package-manager distribution without a service runtime.
  project-history:
    - >
      The official README emphasizes a single binary, Go implementation, and importable
      module design. The project packages both a CLI and a library surface, with release
      binaries and a documented Go module path.
  related-projects:
    - The README names k6, ab, and httpstat as inspirations.
    - Prometheus Pushgateway and AWS CloudWatch are documented metrics export targets.
  sources:
    - https://api.github.com/repos/rogerwelin/cassowary
    - https://github.com/rogerwelin/cassowary
    - https://github.com/rogerwelin/cassowary/blob/master/docs/LIBRARY.md
    - https://github.com/rogerwelin/cassowary#readme
    - https://formulae.brew.sh/api/formula/cassowary.json
  summary:
    - >
      Cassowary is a Go HTTP/S load-testing CLI for developers, testers, and sysadmins.
      Its README positions it as a cross-platform tool inspired by k6, ab, and httpstat.
  timeline:
    - 'v0.10.0 and earlier: File slurp mode used its own command, according to the README note.'
    - '2026: Homebrew formula packages v0.19.0 from the official GitHub release archive.'
  usage:
    - >
      Typical use is `cassowary run` with a URL, concurrency, and request count. The
      README documents standard load tests, file slurp mode, JSON/CSV metrics export,
      Prometheus Pushgateway export, CloudWatch metrics, histograms, boxplots, POST
      data, durations, custom headers, x509 authentication, and distributed load
      testing.
related-packages:
  - id: brew:k6
    reason: >
      Choose k6 when you need JavaScript or TypeScript scenarios, thresholds, reusable
      test logic, or browser-level testing instead of Cassowary's more direct
      command-line HTTP workload model.
    rel: alternative
    sources:
      - https://github.com/rogerwelin/cassowary
      - https://grafana.com/docs/k6/latest/get-started/write-your-first-test/
      - https://grafana.com/docs/k6/latest/testing-guides/load-testing-websites/
  - id: brew:hey
    reason: >
      Choose hey for a smaller URL-oriented load generator with request count,
      concurrency, duration, rate limiting, and HTTP/2 controls when Cassowary's plots
      and monitoring exports are unnecessary.
    rel: alternative
    sources:
      - https://github.com/rogerwelin/cassowary
      - https://github.com/rakyll/hey
category: developer-tools
package-manager:
  brew: cassowary
  nix: cassowary
package-manager-url: https://formulae.brew.sh/formula/cassowary
license: MIT
tags:
  - cli
  - go
  - http
  - load-testing
  - metrics
  - performance
description: Modern cross-platform HTTP load-testing tool written in Go
executables:
  - cassowary
provenance:
  formula: cassowary
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
