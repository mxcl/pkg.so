id: brew:gotun
display-name: gotun
homepage: https://github.com/Sesame2/gotun
repo: https://github.com/Sesame2/gotun
docs:
  - https://github.com/Sesame2/gotun#readme
  - https://pkg.go.dev/github.com/Sesame2/gotun
config-file-location:
  unix: rules.yaml
credentials-file-location:
  unix: ~/.ssh/id_rsa
history:
  adoption-history:
    - >
      gotun is distributed through release binaries, `go install`, Homebrew, and source
      builds. Homebrew packages version 0.8.1 in homebrew/core, and the README also
      links Go Reference documentation via pkg.go.dev.
  package-nerd-significance:
    - >
      gotun fits the packaging niche of small Go networking binaries: one executable,
      cross-platform release artifacts, Homebrew distribution, and behavior that
      composes with existing SSH infrastructure instead of requiring a remote daemon.
  project-history:
    - >
      The official README describes gotun as a cross-platform forward proxy that
      requires only SSH on the remote host. Its feature set includes HTTP and HTTPS
      proxying, SOCKS5, jump hosts, system proxy integration, rule-based routing, shell
      completion, and TUN mode for TCP application proxying.
  related-projects:
    - >
      gotun is related to OpenSSH port forwarding, SOCKS proxies, Clash-style rule
      files, SSH jump hosts, and TUN/TAP-style tunneling tools.
  sources:
    - https://formulae.brew.sh/formula/gotun
    - https://github.com/Sesame2/gotun#readme
    - https://pkg.go.dev/github.com/Sesame2/gotun
  summary:
    - >
      gotun is a Go command-line HTTP-over-SSH proxy that uses a remote SSH host as the
      egress point for HTTP and HTTPS traffic.
  timeline:
    - '0.8.1: Homebrew packages gotun as the current stable release.'
    - >
      README era: SOCKS5, rule-based routing, jump hosts, and TUN mode are documented
      upstream.
  usage:
    - >
      Users run `gotun user@example.com` to start a local proxy, add `-p` or `-i` for
      SSH port and identity file selection, use `-J` for jump hosts, and pass `--rules`
      to load a Clash-style YAML rules file. The README recommends SSH key
      authentication and warns against passing passwords directly on the command line.
related-packages:
  - id: brew:sshuttle
    reason: >
      Choose sshuttle when transparent subnet and DNS forwarding over SSH is the primary
      goal; choose gotun for a local HTTP/SOCKS proxy, Clash-style routing rules, or its
      optional TCP-oriented TUN mode.
    rel: alternative
    sources:
      - https://github.com/Sesame2/gotun#readme
      - https://sshuttle.readthedocs.io/en/stable/overview.html
      - https://sshuttle.readthedocs.io/en/stable/usage.html
  - id: brew:openssh
    reason: >
      OpenSSH supplies the remote SSH service and general-purpose forwarding tools that
      underpin the same bastion-host workflow, while gotun adds a single HTTP/SOCKS
      proxy endpoint and rule-based routing.
    rel: adjacent_workflow
    sources:
      - https://github.com/Sesame2/gotun#readme
      - https://www.openssh.com/manual.html
category: networking
package-manager:
  brew: gotun
package-manager-url: https://formulae.brew.sh/formula/gotun
license: MIT
tags:
  - cli
  - http-proxy
  - proxy
  - socks5
  - ssh
  - tunneling
description: Lightweight HTTP proxy over SSH
executables:
  - gotun
provenance:
  formula: gotun
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
