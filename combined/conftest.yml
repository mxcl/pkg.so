id: brew:conftest
display-name: Conftest
homepage: https://www.conftest.dev/
repo: https://github.com/open-policy-agent/conftest
docs:
  - https://www.conftest.dev/
config-file-location:
  unix: ./conftest.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Conftest's adoption tracks the rise of policy-as-code in infrastructure delivery:
      it lets teams test configs locally, in CI, and through pre-commit before tools
      such as Kubernetes, Terraform, or deployment platforms consume them.
      Package-manager availability in Homebrew, Nix, Scoop, and zypper reflects that it
      is treated as a portable developer and CI binary.
  package-nerd-significance:
    - >
      For package curators, Conftest is notable because it packages OPA's policy engine
      into a focused CLI for files rather than services. It turns Rego from a runtime
      authorization language into a general-purpose config linting and testing binary
      that can sit cleanly in CI images and developer package sets.
  project-history:
    - >
      The README and documentation describe Conftest as a utility for writing tests
      against structured configuration data and explicitly ground its policy language in
      Open Policy Agent's Rego. The project lives under the open-policy-agent GitHub
      organization and documents discussion in the OPA Slack #opa-conftest channel.
    - >
      The documentation evolved from Kubernetes examples into a broader parser and
      policy-testing tool. It supports many formats including CUE, Dockerfile, HCL/HCL2,
      INI, JSON, Jsonnet, nginx, TOML, XML, YAML, CycloneDX, SPDX, and others, making it
      useful for policy-as-code checks across infrastructure repositories.
  related-projects:
    - >
      Official sources tie Conftest to Open Policy Agent, Rego, Kubernetes, Tekton,
      Terraform, Serverless, Dockerfile, HCL, Jsonnet, CUE, and pre-commit-style
      workflows.
  sources:
    - https://github.com/open-policy-agent/conftest#readme
    - https://www.conftest.dev/
    - https://www.conftest.dev/install/
    - https://github.com/open-policy-agent/conftest/releases
    - https://github.com/open-policy-agent/conftest/releases/tag/v0.68.0
    - https://github.com/open-policy-agent/conftest/releases/tag/v0.68.1
    - https://github.com/open-policy-agent/conftest/releases/tag/v0.68.2
  summary:
    - >
      Conftest is an Open Policy Agent project for testing structured configuration data
      with Rego policies. It is commonly used to check Kubernetes manifests, Terraform,
      Tekton, Serverless configuration, and other machine-readable config before
      deployment.
  timeline:
    - >
      2025: release notes show ongoing OPA dependency updates and parser maintenance in
      the v0.62 line.
    - '2026: v0.68.0 added an nginx parser and moved to OPA 1.15.1.'
    - '2026: v0.68.1 adjusted push behavior to use Rego v1 by default.'
    - '2026: v0.68.2 updated the embedded OPA dependency to 1.15.2.'
  usage:
    - >
      Typical usage is to place Rego files under a policy directory and run conftest
      test against one or more config files. The tool evaluates deny, violation, and
      warn rules in the main namespace by default, but supports namespace flags, stdin,
      metadata, unit tests with conftest verify, and parser builtins for policy tests.
related-packages:
  - id: brew:opa
    reason: >
      Choose the full Open Policy Agent CLI when you need general policy evaluation,
      testing, bundle building, or server operation beyond Conftest's file-focused
      checks.
    rel: alternative
    sources:
      - https://www.conftest.dev/
      - https://www.openpolicyagent.org/docs
  - id: brew:regal
    reason: >
      Use Regal alongside Conftest to lint, format, debug, and provide editor feedback
      for the Rego policies that Conftest evaluates.
    rel: adjacent_workflow
    sources:
      - https://www.conftest.dev/
      - https://www.openpolicyagent.org/projects/regal
category: developer-tools
package-manager:
  brew: conftest
  nix: conftest
  scoop: main/conftest
  zypper: conftest
package-manager-url: https://formulae.brew.sh/formula/conftest
license: Apache-2.0
tags:
  - cli
  - configuration
  - open-policy-agent
  - policy-as-code
  - rego
  - testing
description: Test your configuration files using Open Policy Agent
executables:
  - conftest
provenance:
  formula: conftest
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
