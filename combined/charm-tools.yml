id: brew:charm-tools
display-name: Juju Charm Tools
homepage: https://github.com/juju/charm-tools
repo: https://github.com/juju/charm-tools
docs:
  - https://charm-tools.readthedocs.io/en/latest
  - https://charm-tools.readthedocs.io/en/latest/commands.html
  - https://github.com/juju/charm-tools#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README points users to the Snap package named `charm` for stable
      releases and notes PyPI availability for Python dependency use. The supplied
      package facts show Homebrew also packaged charm-tools for macOS users.
  package-nerd-significance:
    - >
      charm-tools is package-nerd interesting because it predates the newer
      Charmcraft-centered workflow and shows Juju charm authoring distributed across
      Snap, PyPI, and Homebrew with both a combined `charm` interface and split command
      executables.
  project-history:
    - >
      Canonical's Juju ecosystem uses charms as operational packages for deploying and
      managing applications. The charm-tools README describes this project as tools that
      make writing Juju charms easier, with commands for the charm authoring lifecycle.
  related-projects:
    - Juju is the orchestration system whose charms this tool helps author and maintain.
    - >
      charmstore-client provides the Charm Store client commands used for charm store
      interactions.
    - Charmcraft is the newer Canonical charm authoring tool in the same ecosystem.
  sources:
    - https://github.com/juju/charm-tools#readme
    - https://charm-tools.readthedocs.io/en/latest
    - https://charm-tools.readthedocs.io/en/latest/commands.html
    - https://formulae.brew.sh/formula/charm-tools
  summary:
    - >
      Juju Charm Tools is a collection of command-line tools for creating, building,
      validating, and publishing Juju charms.
  timeline:
    - '2013: juju/charm-tools public GitHub repository created.'
    - >
      2021: Read the Docs build metadata shows charm-tools documentation generated from
      the GitHub docs tree.
    - '2023: GitHub releases include v3.0.x and v2.8.x maintenance lines.'
    - '2024: v2.8.9 release published.'
  usage:
    - >
      The README highlights `charm create`, `charm build`, `charm proof`, `charm login`,
      `charm push`, `charm release`, and `charm show`; the Homebrew facts expose split
      executables such as `charm-build`, `charm-create`, and `charm-proof`.
related-packages:
  - id: brew:charmcraft
    reason: >
      Choose Charmcraft for the current supported workflow: it initializes and packs
      modern charm projects and publishes them directly to Charmhub.
    rel: alternative
    sources:
      - https://charm-tools.readthedocs.io/en/latest/
      - https://github.com/canonical/charmcraft
      - https://documentation.ubuntu.com/charmcraft/stable/howto/manage-charms/
  - id: brew:charm
    reason: >
      The legacy `charm` store client complements Charm Tools by pushing, releasing,
      downloading, and administering the charm artifacts produced by its authoring
      commands.
    rel: adjacent_workflow
    sources:
      - https://charm-tools.readthedocs.io/en/latest/
      - https://github.com/juju/charmstore-client
  - id: brew:juju
    reason: >
      Use Juju to deploy and operate the charm artifacts created and validated with
      Charm Tools.
    rel: adjacent_workflow
    sources:
      - https://charm-tools.readthedocs.io/en/latest/
      - https://documentation.ubuntu.com/juju/latest/reference/index.html
category: developer-tools
package-manager:
  brew: charm-tools
package-manager-url: https://formulae.brew.sh/formula/charm-tools
license: GPL-3.0-only
tags:
  - charm-authoring
  - charms
  - cli
  - cloud-operations
  - juju
description: Tools for authoring and maintaining juju charms
executables:
  - charm-build
  - charm-create
  - charm-help
  - charm-layers
  - charm-proof
  - charm-pull-source
  - charm-version
provenance:
  formula: charm-tools
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
