id: brew:chart-releaser
display-name: Chart Releaser
homepage: https://github.com/helm/chart-releaser/
repo: https://github.com/helm/chart-releaser
docs:
  - https://github.com/helm/chart-releaser#readme
config-file-location:
  unix: ~/.cr.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Chart Releaser was adopted mainly through GitHub-hosted Helm chart repositories
      and CI pipelines. The README documents binary releases, the `helm/tap` Homebrew
      installation path, a Docker image on Quay for CI, and use through
      `helm/chart-releaser-action`.
  package-nerd-significance:
    - >
      Chart Releaser is important because it made a low-infrastructure Helm distribution
      pattern common: a normal GitHub repository can publish chart tarballs and an index
      without running a separate chart repository service. It is a small packaging
      bridge between Helm chart metadata, GitHub Releases, GitHub Pages, and CI.
  project-history:
    - >
      The Helm organization created the chart-releaser repository in August 2018. Public
      release metadata shows the 0.x series in early 2019, a 1.0.0 beta tag before the
      stable 1.x line, and a current 1.8.1 release in June 2025.
  related-projects:
    - Helm is the Kubernetes package manager whose chart artifacts Chart Releaser publishes.
    - helm/chart-releaser-action wraps the CLI for GitHub Actions workflows.
    - GitHub Releases and GitHub Pages are the distribution surfaces targeted by the tool.
  sources:
    - https://github.com/helm/chart-releaser
    - https://api.github.com/repos/helm/chart-releaser
    - https://api.github.com/repos/helm/chart-releaser/releases
  summary:
    - >
      Chart Releaser is a Helm project CLI that turns a GitHub repository into a Helm
      chart repository by attaching packaged charts to GitHub Releases and generating an
      `index.yaml` suitable for GitHub Pages.
  timeline:
    - '2018-08: Helm chart-releaser repository created.'
    - '2019-02: Early public 0.x GitHub releases are available.'
    - '2025-06: Latest upstream GitHub release metadata lists v1.8.1.'
  usage:
    - >
      Common use is `cr package`, `cr upload`, and `cr index`: package charts, upload
      `.tgz` artifacts to GitHub Releases, then build or push the chart repository
      index. The README documents `$HOME/.cr.yaml`, `CR_` environment variables, and
      command-line flags with CLI-over-env-over-config precedence.
related-packages:
  - id: brew:chart-testing
    reason: >
      Use Chart Testing to lint and install-test changed Helm charts in CI before Chart
      Releaser packages and publishes them.
    rel: adjacent_workflow
    sources:
      - https://github.com/helm/chart-testing
      - https://github.com/helm/chart-releaser
  - id: brew:helm
    reason: >
      Helm supplies the chart format and core packaging workflow that Chart Releaser
      publishes through GitHub Releases and Pages.
    rel: adjacent_workflow
    sources:
      - https://helm.sh/docs/topics/charts/
      - https://github.com/helm/chart-releaser#readme
category: developer-tools
package-manager:
  brew: chart-releaser
package-manager-url: https://formulae.brew.sh/formula/chart-releaser
license: Apache-2.0
tags:
  - charts
  - cli
  - github-pages
  - helm
  - kubernetes
  - releases
description: Hosting Helm Charts via GitHub Pages and Releases
executables:
  - cr
provenance:
  formula: chart-releaser
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
