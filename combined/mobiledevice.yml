id: brew:mobiledevice
display-name: mobiledevice
homepage: https://github.com/imkira/mobiledevice
repo: https://github.com/imkira/mobiledevice
docs:
  - https://github.com/imkira/mobiledevice#readme
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://api.github.com/repos/imkira/mobiledevice
    - https://formulae.brew.sh/formula/mobiledevice
    - https://github.com/imkira/mobiledevice
  summary:
    - >
      mobiledevice is a macOS command-line utility by imkira for interacting with
      Apple's private Mobile Device framework. The repository was created in 2012 and
      describes the tool as a way to automate device tasks such as installing and
      uninstalling apps on an iPhone or iPad without manually using Xcode or iTunes,
      while still requiring a Mac, USB-connected device, and the normal iOS development
      setup for app installation.
  usage:
    - >
      The project belongs to a small reverse-engineering-adjacent tooling niche around
      Apple's private device-management framework. It is not a general iOS deployment
      platform; it exposes focused commands for developers who need scriptable access to
      connected devices. Homebrew packages it as `mobiledevice`, which makes the
      otherwise source-built utility easier to install on macOS.
related-packages:
  - id: brew:libimobiledevice
    reason: >
      Choose libimobiledevice for a broader, cross-platform set of iPhone and iPad
      communication tools that does not require Apple's proprietary libraries; choose
      mobiledevice for its focused wrapper around Apple's private framework on macOS.
    rel: alternative
    sources:
      - https://github.com/imkira/mobiledevice#readme
      - https://www.libimobiledevice.org/
      - https://github.com/libimobiledevice/libimobiledevice#readme
category: developer-tools
