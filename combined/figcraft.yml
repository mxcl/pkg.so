config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FigCraft is distributed for macOS, Windows, Linux, FreeBSD, and the web, with the
      macOS application also available through Homebrew Cask. Its offline, account-free
      model targets designers who want local files and an inspectable implementation.
    - >
      The project also serves automation-oriented users through a CLI, JSON control
      channel, and MCP server backed by the same command system as the graphical
      application.
  package-nerd-significance:
    - >
      FigCraft is unusual among design applications because its editor, document engine,
      renderer, collaboration server, command-line tools, and agent interface are
      developed openly in Rust and packaged across desktop and web targets. Plain local
      .figcraft archives and the absence of a required account distinguish it from
      cloud-first design tools.
  project-history:
    - >
      FigCraft was developed as an open-source, clean-room reimplementation of familiar
      collaborative interface-design workflows. The project deliberately avoids
      proprietary implementation material while building its own native document model,
      renderer, vector engine, prototyping system, and collaboration protocol.
    - >
      During its public alpha period, development expanded from core frames, auto
      layout, components, and vectors into variables, prototypes, developer handoff,
      live sessions, plugins, server hosting, localization, and agent-driven editing.
  related-projects:
    - ArtCraft is the wider creative-app project that distributes FigCraft.
    - craft-fonts supplies open fonts used by FigCraft.
    - figcraft-server provides self-hosted live collaboration and published team files.
  sources:
    - https://getartcraft.com/apps/figcraft
    - https://github.com/storytold/figcraft
    - https://github.com/storytold/figcraft/blob/main/ROADMAP.md
  summary:
    - >
      FigCraft is an open-source interface-design and prototyping application
      implemented in Rust, with native offline editing, local document files,
      collaboration, developer handoff, and agent-control interfaces.
  timeline:
    - >
      2026: The public project was under active alpha development with desktop, web,
      collaboration, plugin, and automation surfaces.
  usage:
    - >
      Designers create interfaces from frames, auto layout, components, styles,
      variables, vector networks, and prototype interactions, then export graphics or
      inspect generated implementation code.
    - >
      Local .figcraft archives work without an account or network connection. Teams can
      optionally start live sessions or host figcraft-server, while scripts and agents
      can use figcraft-cli, the JSON control protocol, or MCP.
related-packages:
  - id: cask:sketch
    reason: >
      Choose Sketch for a mature commercial Mac-centered product-design platform with
      established Workspace collaboration; choose FigCraft for open-source,
      cross-platform, offline-first design with local files and agent interfaces.
