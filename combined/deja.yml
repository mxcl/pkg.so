id: brew:deja
display-name: deja
homepage: https://github.com/Giammarco-Ferranti/deja
repo: https://github.com/Giammarco-Ferranti/deja
docs:
  - https://github.com/Giammarco-Ferranti/deja#readme
config-file-location:
  unix:
    - ~/.local/share/deja/config
    - ~/.zshrc (integration and environment-variable customization)
credentials-file-location: null
history:
  adoption-history:
    - >
      The project supports installation through its Homebrew tap or curl installer and
      documents integration with plain zsh, Oh My Zsh, and zinit. Its release automation
      publishes binaries and updates the Homebrew tap after successful tests.
  package-nerd-significance:
    - >
      deja belongs to the lineage of shell-history enhancement tools but uses a resident
      Go daemon and local SQLite data rather than a purely shell-script implementation.
      It is positioned as a predictive alternative to zsh-autosuggestions.
  project-history:
    - >
      deja was created as a local-only predictive autosuggestion tool for zsh. Its
      design combines fuzzy matching, command frecency, directory affinity, and
      command-sequence prediction, while keeping learned history on the user's machine.
  related-projects:
    - zsh
    - zsh-autosuggestions
    - Oh My Zsh
    - zinit
  sources:
    - https://github.com/Giammarco-Ferranti/deja#readme
  summary:
    - >
      deja is a zsh ghost-text autosuggestion system backed by a lightweight Go daemon
      and a local SQLite command-history database.
  timeline:
    - The official sources do not provide a reliable dated origin timeline.
  usage:
    - >
      After importing existing zsh history and loading the generated integration from
      .zshrc, users accept, cycle, dismiss, or tune inline suggestions with key bindings
      and environment variables. The daemon starts automatically, and commands excluded
      from zsh history are also excluded from deja's learning path.
related-packages: []
category: productivity
package-manager:
  brew: deja
  nix: deja
package-manager-url: https://formulae.brew.sh/formula/deja
license: MIT
tags:
  - autosuggestions
  - cli
  - command-history
  - productivity
  - shell
  - sqlite
  - zsh
description: Predictive ghost-text autosuggestions for zsh
executables:
  - deja
provenance:
  formula: deja
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
