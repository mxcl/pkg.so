id: brew:exempi
display-name: Exempi
homepage: https://libopenraw.freedesktop.org/exempi/
repo: https://gitlab.freedesktop.org/libopenraw/exempi
docs:
  - https://libopenraw.freedesktop.org/exempi
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Exempi is mostly adopted as infrastructure. Desktop, image, and metadata tools use
      it when they need XMP parsing without embedding Adobe's C++ SDK directly, and the
      project points users to distribution packages for binary installation.
  package-nerd-significance:
    - >
      Exempi matters to package maintainers because it turns a vendor-origin metadata
      SDK into a conventional Unix library with stable ABI expectations, distro-friendly
      licensing, and language bindings such as the separate Rust crates.
  project-history:
    - >
      Exempi started before Adobe's XMP SDK was publicly available as an independent
      implementation of XMP. Its 2.x line was later based on the Adobe XMP SDK and kept
      a BSD-style license to preserve compatibility with upstream XMP SDK code sharing.
    - >
      The project reshaped the SDK for open-source desktop packaging: a stable C API and
      ABI, automake-based builds, broader Unix and architecture support, WebP support,
      tests, and no contributor license agreement. The exempi command-line tool appeared
      as a work in progress beginning with the 2.2.0 series.
  related-projects:
    - >
      Exempi is related to Adobe XMP SDK, libopenraw, XMP metadata tooling, and the
      exempi2 Rust binding ecosystem.
  sources:
    - https://libopenraw.freedesktop.org/exempi/
    - https://gitlab.freedesktop.org/libopenraw/exempi
  summary:
    - >
      Exempi is a C-oriented implementation of Adobe's XMP metadata stack for Unix-like
      systems, with a library API and a small command-line utility.
  timeline:
    - '0.5.x: Exempi existed as an implementation before the XMP SDK was available.'
    - '2.2.0: The exempi command-line tool began appearing in the 2.x series.'
    - '2.4.0: Rust crate use became documented for Exempi 2.4.0 and later.'
    - '2.6.6: The project page lists 2.6.6 as the current 2.x release.'
  usage:
    - >
      The library is the main surface: applications use its C API to read and write XMP
      metadata. The bundled exempi executable gives package users a command-line way to
      inspect or manipulate XMP packets.
related-packages:
  - id: brew:exiv2
    reason: >
      Choose Exiv2 when you need a cross-platform CLI and C++ library that handles Exif
      and IPTC as well as XMP; choose Exempi for a focused XMP implementation with a
      stable C ABI.
    rel: alternative
    sources:
      - https://libopenraw.freedesktop.org/exempi/
      - https://exiv2.org/
category: media
package-manager:
  apk: exempi
  brew: exempi
  debian: exempi
  dnf: exempi
  macports: exempi
  nix: exempi
  pacman: exempi
  ubuntu: exempi
  zypper: exempi-tools
package-manager-url: https://formulae.brew.sh/formula/exempi
license: BSD-3-Clause
tags:
  - c-api
  - cli
  - image-metadata
  - library
  - metadata
  - xmp
description: Library to parse XMP metadata
executables:
  - exempi
provenance:
  formula: exempi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
