id: brew:lsdvd
display-name: lsdvd
homepage: https://sourceforge.net/projects/lsdvd/
repo: https://git.code.sf.net/p/lsdvd/git
docs:
  - https://sourceforge.net/p/lsdvd/git/ci/master/tree/README
  - https://sourceforge.net/projects/lsdvd
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      lsdvd became a useful packaging target because it exposes DVD structure without a
      GUI and can feed other scripts. The supplied package facts list it in Homebrew,
      Debian, Ubuntu, Fedora/DNF, Alpine, Arch, openSUSE/Zypper, MacPorts, and Nix,
      which is broad adoption for a narrow media-inspection utility.
  package-nerd-significance:
    - >
      For package maintainers, lsdvd is a classic Unix-style media helper: small C
      source, GPL-2.0 licensing, libdvdread/libxml dependencies, and a stable CLI niche.
      It matters less as a flashy application than as one of the plumbing commands that
      made optical-media workflows scriptable.
  project-history:
    - >
      The project was registered on SourceForge on 2005-03-13 and has long lived in the
      ecosystem around libdvdread and command-line DVD tooling. The current SourceForge
      Git tree identifies Steve Dibb and Petter Reinholdtsen among project maintainers
      and shows a modernized Autotools-based source layout.
    - >
      The historical SourceForge file area preserves early releases such as 0.10, 0.15,
      and 0.16, with a 0.17 tarball published in 2014. The current Git tree shows later
      development continuing through the 0.21 release marker in 2025, including README
      updates, XML output changes, JSON output, and test-suite work.
  related-projects:
    - >
      Related tools include libdvdread, which lsdvd uses to inspect DVD metadata, and
      command-line DVD/transcoding tools that consume title and stream information.
  sources:
    - https://sourceforge.net/p/lsdvd/git/ci/master/tree/
    - https://sourceforge.net/projects/lsdvd/
    - https://sourceforge.net/projects/lsdvd/files/lsdvd/
    - source_facts.package-manager
  summary:
    - >
      lsdvd is a small console utility for reading DVD-Video metadata and printing it in
      machine- or human-readable forms. Its official SourceForge summary describes it as
      a DVD content inspector that reports video tracks, audio tracks, subtitles, and
      related title information.
  timeline:
    - '2005: Project registered on SourceForge.'
    - '2006: SourceForge file area shows the 0.16 release folder.'
    - >
      2014: SourceForge files show 0.10, 0.15, 0.16, and 0.17 tarballs published or
      republished.
    - '2025: Git tree marks the 0.21 release and shows continued maintenance.'
  usage:
    - >
      The README says lsdvd reads information from a DVD and can output human-readable,
      JSON, Perl, Python, Ruby, and XML formats. Typical package-manager usage is
      installing the binary and running it against a mounted or inserted DVD, or calling
      it from scripts that need title, track, subtitle, and language metadata before
      ripping, transcoding, or cataloging.
related-packages:
  - id: brew:dvdbackup
    reason: >
      Use lsdvd to inspect a disc's titles and streams, then dvdbackup when the next
      step is copying the full DVD, a title set, selected titles, or chapters.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/lsdvd/git/ci/master/tree/README
      - https://dvdbackup.sourceforge.net/usage.html
category: media
