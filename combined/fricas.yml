config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FriCAS adoption is rooted in the long-running Axiom/Scratchpad user base rather
      than a single modern launch. The current official site provides the homepage,
      GitHub repository, mailing list, API documentation, book, examples, installation
      guide, and citation information, indicating a research and mathematical-computing
      community workflow.
    - >
      The project continues to publish releases from the GitHub repository, with visible
      release tags in the 1.3 series from 2021 through 2026.
  package-nerd-significance:
    - >
      FriCAS is package-nerd significant because it is a living descendant of a major
      historical computer algebra system, with roots before most modern package
      ecosystems. Packaging it means preserving a large Lisp/SPAD mathematical
      environment whose source history crosses IBM research, commercial Axiom,
      open-source Axiom, and later forks.
    - >
      It is also a useful contrast to newer CAS packages: instead of a small CLI
      wrapper, it carries a deep algebra library, language runtime assumptions,
      documentation corpus, and compatibility concerns from decades of
      symbolic-computation work.
  project-history:
    - >
      The official FriCAS history traces the system to IBM laboratories around 1965,
      when J. Griesmer began work on a computer algebra system. The project was named
      Scratchpad in 1970, and a new Scratchpad II architecture began in 1976. Around
      1982, the SPAD language took shape in a form close to the current one.
    - >
      In 1992 IBM sold the system to NAG, which renamed it Axiom and marketed it. NAG
      later stopped development, withdrew Axiom from the market in 2001, and released
      the sources under an open source license. Tim Daly received the sources in 2002
      and started the open-source Axiom project.
    - >
      FriCAS was created in 2007 when Waldek Hebisch forked Axiom after a disagreement
      about development strategy. The official history records that FriCAS then made
      several releases with incremental improvements, while Axiom and OpenAxiom
      continued as related branches of the same lineage.
  related-projects:
    - Closely related projects include Scratchpad, Scratchpad II, Axiom, and OpenAxiom.
    - >
      Related technical surfaces include the SPAD language, Codemist Common Lisp in the
      Axiom history, the FriCAS book, generated API documentation, and the FriCAS
      mailing list.
  sources:
    - https://fricas.github.io/api/index.html
    - https://fricas.github.io/history.html
    - https://fricas.github.io/index.html
    - https://github.com/fricas/fricas/releases
  summary:
    - >
      FriCAS is an advanced computer algebra system and a 2007 fork of Axiom. It
      continues the Scratchpad/Axiom line of symbolic mathematics systems, pairing a
      large mathematical library with the SPAD language and interactive command-line
      use.
  timeline:
    - '1965: IBM work begins on a computer algebra system that becomes the Scratchpad line.'
    - '1970: The project is named Scratchpad.'
    - '1976: Scratchpad II begins with a new architecture.'
    - '1982: The SPAD language takes shape close to its current form.'
    - '1992: IBM sells the system to NAG, which renames it Axiom.'
    - >
      2001: Axiom is withdrawn from the market and released publicly under an open
      source license.
    - "2002: Tim Daly starts the open-source Axiom project from NAG's sources."
    - '2007: Waldek Hebisch forks Axiom to create FriCAS.'
    - '2021-2026: FriCAS publishes 1.3.x releases from the GitHub project.'
  usage:
    - >
      The package exposes command-line entry points such as `fricas` and `efricas`.
      Users run interactive algebra sessions, use FriCAS domains and packages, write or
      inspect SPAD code, consult the FriCAS book, and use the generated API
      documentation for mathematical functionality.
related-packages:
  - id: brew:maxima
    reason: >
      Maxima is an alternative interactive computer algebra system with extensive
      symbolic-mathematics documentation; choose it for its Macsyma-derived language and
      ecosystem, or FriCAS for the Axiom/SPAD type-and-domain architecture.
    rel: alternative
    sources:
      - https://fricas.github.io/faq.html
      - https://maxima.sourceforge.io/documentation.html
category: science
