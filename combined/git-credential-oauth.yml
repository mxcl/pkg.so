id: brew:git-credential-oauth
display-name: git-credential-oauth
homepage: https://github.com/hickford/git-credential-oauth
repo: https://github.com/hickford/git-credential-oauth
docs:
  - https://github.com/hickford/git-credential-oauth#readme
config-file-location:
  unix: ~/.gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      The README emphasizes packaging as a design goal: binaries are available from
      upstream releases, Linux distributions package it, Homebrew and MacPorts cover
      macOS installs, winget covers Windows, and Go users can install from the module
      path.
    - >
      Its adoption niche is clearest on Linux, where the README contrasts it with Git
      Credential Manager's broader feature set and heavier .NET packaging footprint. The
      helper is deliberately narrow: it generates credentials and composes with storage
      helpers such as cache, osxkeychain, wincred, or libsecret.
  package-nerd-significance:
    - >
      git-credential-oauth matters in package-manager culture because it is a small
      credential-generating helper with a simple Go build, cross-platform binaries, and
      distribution packages. It gives Unix users a lightweight alternative to large
      credential managers while still fitting Git's helper chain.
    - >
      It also shows a post-password Git authentication pattern: package a helper that
      can mint host tokens, then rely on Git's existing storage helpers to persist them.
  project-history:
    - >
      The upstream repository began in October 2022 and tagged v0.0.1 the next day with
      GoReleaser packaging. Early 2022 and 2023 releases added support for more forges,
      custom host configuration, custom OAuth authorization and token URLs, and
      platform-specific browser opening.
    - >
      The project later grew around Git's evolving credential protocol. In 2023 it added
      token refresh support, and Git's own credential documentation later listed
      git-credential-oauth as a popular OAuth helper alongside Git Credential Manager.
  related-projects:
    - Git Credential Manager is the broader credential-manager project compared in the README.
    - >
      git-credential-cache, git-credential-libsecret, git-credential-osxkeychain, and
      git-credential-wincred are common storage helpers used before git-credential-oauth
      in Git's helper list.
    - git-credential-azure is a related Hickford helper for Azure Repos authentication.
  sources:
    - >
      https://git-scm.com/docs/gitcredentials documents Git's helper chain and names
      git-credential-oauth as a popular OAuth helper.
    - >
      https://github.com/hickford/git-credential-oauth documents the motivation,
      supported hosts, installation, configuration, comparison with Git Credential
      Manager, and design philosophy.
    - >
      https://github.com/hickford/git-credential-oauth/releases documents tagged release
      progression.
  summary:
    - >
      git-credential-oauth is a Go-based Git credential helper that obtains Git host
      credentials through browser-based OAuth or OAuth device flow. It targets HTTPS Git
      workflows where passwords, personal access tokens, or SSH setup are awkward for
      users or hard for distributions to package cleanly.
  timeline:
    - '2022: The repository begins and v0.0.1 is tagged with GoReleaser packaging.'
    - '2023: v0.2.0 adds custom host configuration.'
    - '2023: v0.7.0 adds token refresh support.'
    - '2024: v0.13.x adds OAuth device-flow configuration keys.'
    - '2025: v0.16.0 adds dark-mode support for the authentication page.'
    - '2026: v0.17.x adds Forgejo recognition and device-flow configuration fixes.'
  usage:
    - >
      A typical setup runs `git credential-oauth configure` or adds `helper = oauth`
      after a storage helper in `~/.gitconfig`. Git then asks storage helpers first and
      falls through to the OAuth helper only when it needs a fresh credential.
    - >
      Users authenticate to hosts such as GitHub, GitLab, Bitbucket, Gerrit, Gitea,
      Forgejo, or googlesource by browser flow. On systems without a browser, the README
      documents `oauth -device` for OAuth device flow where supported.
related-packages:
  - id: brew:git-credential-libsecret
    reason: >
      On Linux desktops, configure libsecret before git-credential-oauth so Git can
      retrieve securely stored credentials before starting a new OAuth flow.
    rel: adjacent_workflow
    sources:
      - https://github.com/hickford/git-credential-oauth#how-it-works
      - https://git-scm.com/docs/gitcredentials
category: security
package-manager:
  apk: git-credential-oauth
  brew: git-credential-oauth
  debian: git-credential-oauth
  dnf: git-credential-oauth
  macports: git-credential-oauth
  nix: git-credential-oauth
  pacman: git-credential-oauth
  scoop: main/git-credential-oauth
  ubuntu: git-credential-oauth
  winget: hickford.git-credential-oauth
  zypper: git-credential-oauth
package-manager-url: https://formulae.brew.sh/formula/git-credential-oauth
license: Apache-2.0
tags:
  - cli
  - credentials
  - git
  - oauth
  - security
description: Git credential helper that authenticates in browser using OAuth
executables:
  - git-credential-oauth
provenance:
  formula: git-credential-oauth
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
