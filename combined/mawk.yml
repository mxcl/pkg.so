id: brew:mawk
display-name: mawk
homepage: https://invisible-island.net/mawk/
repo: https://github.com/ThomasDickey/mawk-snapshots
docs:
  - https://invisible-island.net/mawk
  - https://invisible-island.net/mawk/manpage/mawk.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      mawk's adoption has been strongest in Unix-like packaging culture. The official
      page lists package links for AIX, Arch, DragonFly BSD, Fedora, Fink, FreeBSD,
      Gentoo, Haiku, Homebrew, HPUX, MacPorts, Mageia, and others, and the input
      confirms distribution through common Linux and macOS package managers.
  package-nerd-significance:
    - >
      mawk matters because AWK is one of the classic packaging and build-script
      workhorses. It gives packagers a small, fast AWK implementation whose behavior
      must be tracked carefully against POSIX awk, BWK awk, and GNU awk.
  project-history:
    - >
      The current official mawk page says Mike Brennan wrote mawk, that it had no
      maintainer for a time, and that Thomas E. Dickey adopted it in 2009 by starting
      with Debian package fixes and unresolved reports. The official changelog preserves
      the older 1.3 series history and shows the long maintenance gap being bridged by
      Debian patches and later upstream work.
    - >
      The manpage frames mawk as a 'new awk' implementation of the AWK language defined
      by Aho, Kernighan, and Weinberger, with POSIX draft compatibility and a small set
      of implementation extensions.
  related-projects:
    - awk, BWK awk, GNU awk, POSIX awk, Debian mawk package
  sources:
    - https://invisible-island.net/mawk/
    - https://invisible-island.net/mawk/CHANGES.html
    - https://invisible-island.net/mawk/manpage/mawk.html
    - source_facts.package-manager-url
  summary:
    - >
      mawk is a compact AWK interpreter used for fast pattern scanning, text processing,
      and shell scripting.
  timeline:
    - '1996: mawk 1.3 and 1.3.2 releases appear in the official changelog.'
    - '2008: Debian patches are incorporated into the later upstream maintenance history.'
    - '2009: Thomas E. Dickey adopts mawk maintenance.'
    - >
      2010: 1.3.4 maintenance snapshots begin after the original 1.3.3 plus Debian
      patches baseline.
    - '2026: Official changelog still records active maintenance.'
  usage:
    - >
      Users invoke `mawk` like other AWK implementations: short programs can be passed
      on the command line, longer programs via `-f`, and input comes from files or
      standard input. Its `-W` options expose mawk-specific behavior such as dump,
      interactive mode, POSIX mode, traditional mode, and version output.
related-packages:
  - id: brew:gawk
    reason: >
      Choose GNU Awk when you need GNU-specific facilities such as networking,
      profiling, debugging, or C/C++ extensions; choose mawk for a smaller AWK
      implementation centered on traditional text-processing workflows.
    rel: alternative
    sources:
      - https://www.invisible-island.net/mawk/manpage/mawk.html
      - https://www.gnu.org/software/gawk/manual/gawk.html
  - id: brew:goawk
    reason: >
      Choose GoAWK when you need an embeddable Go implementation or native CSV and TSV
      handling; mawk is the established C implementation with a long Unix packaging
      history.
    rel: alternative
    sources:
      - https://www.invisible-island.net/mawk/mawk.html
      - https://github.com/benhoyt/goawk
category: language-runtime
package-manager:
  apk: mawk
  brew: mawk
  debian: mawk
  dnf: mawk
  macports: mawk
  nix: mawk
  ubuntu: mawk
  zypper: mawk
package-manager-url: https://formulae.brew.sh/formula/mawk
license: GPL-2.0-only
tags:
  - awk
  - cli
  - interpreter
  - scripting
  - text-processing
description: Interpreter for the AWK Programming Language
executables:
  - mawk
provenance:
  formula: mawk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
