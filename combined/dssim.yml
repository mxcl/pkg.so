id: brew:dssim
display-name: dssim
homepage: https://kornel.ski/dssim
repo: https://github.com/kornelski/dssim
docs:
  - https://github.com/kornelski/dssim#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dssim is used by image codec and optimization developers who need a perceptual
      comparison metric rather than byte equality or plain RGB error. The README
      explicitly discusses comparing codecs either at equal file size or equal DSSIM
      score.
    - >
      The tool is packaged by Homebrew, Alpine, openSUSE/zypper, and Windows winget; its
      README also mentions Homebrew and Ubuntu Snap availability. Homebrew analytics
      showed 187 installs over the preceding 365 days during this batch.
  package-nerd-significance:
    - >
      dssim is package-nerd significant because it packages an image-quality metric as
      both a CLI and reusable native/WASM library. It sits in the practical space
      between academic SSIM papers and real package-manager workflows for codec
      benchmarking, regression tests, and image optimization.
  project-history:
    - >
      The README frames dssim as an improved SSIM-derived metric for practical
      image-compression comparison: multi-scale comparison, linear-light RGB scaling,
      Lab color space, alpha support, color profiles, multicore execution, and
      C/Rust/WASM library use.
    - >
      The release history shows an early 1.x Rust API era in 2015 and 2016, followed by
      a major Rust rewrite in 2.8.0 on 2017-11-10. That rewrite emphasized safer code,
      full-resolution chroma comparison, linear-light premultiplied-alpha scaling, and
      acknowledged PNG-only/color-profile limitations at the time. Later 3.x releases
      improved packaging, WASM compatibility, and performance.
  related-projects:
    - SSIM is the underlying perceptual-similarity algorithm family linked from the README.
    - TID2013 is the image-quality dataset used in the README's accuracy table.
    - docs.rs hosts the Rust library documentation linked from the README.
    - >
      Image codec and compression benchmarking tools are natural neighbors because the
      README focuses on fair image-compression comparison.
  sources:
    - https://github.com/kornelski/dssim#readme
    - https://github.com/kornelski/dssim/releases/tag/1.2.0
    - https://github.com/kornelski/dssim/releases/tag/1.3.2
    - https://github.com/kornelski/dssim/releases/tag/2.8.0
    - https://github.com/kornelski/dssim/releases/tag/3.2.3
    - https://github.com/kornelski/dssim/releases/tag/3.4.0
    - https://formulae.brew.sh/formula/dssim
  summary:
    - >
      dssim is Kornel Lesinski's image dissimilarity tool and library based on a variant
      of SSIM, returning a perceptual difference score for PNG and JPEG images.
  timeline:
    - '2015-12-05: 1.2.0 introduced Rust API compatibility and improved sRGB gamma precision.'
    - >
      2016-05-09: 1.3.x releases were published with precision, stdin, gamma, and
      PNG-handling fixes.
    - '2017-11-10: 2.8.0 was published as a major Rust rewrite.'
    - '2022-09-18: 3.2.3 was published with WASM compatibility and performance improvements.'
    - >
      2025-03-05: 3.4.0 was published with another performance improvement and is the
      Homebrew stable version recorded for this batch.
  usage:
    - >
      Typical usage is `dssim original.png modified.png`, optionally comparing many
      modified images against one original or writing a visual difference image with
      `-o`. The README warns users to quote the dssim version because the score scale
      has changed between versions.
related-packages:
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick when perceptual comparison is one step in a broader
      image-processing workflow; its compare command supports configurable SSIM and
      DSSIM metrics alongside many other operations.
    rel: alternative
    sources:
      - https://github.com/kornelski/dssim#readme
      - https://imagemagick.org/compare/
      - https://imagemagick.org/command-line-options/
category: media
package-manager:
  apk: dssim
  brew: dssim
  winget: Kornelski.DSSIM
  zypper: dssim
package-manager-url: https://formulae.brew.sh/formula/dssim
license: AGPL-3.0-or-later
tags:
  - cli
  - image-comparison
  - image-similarity
  - perceptual-metrics
  - rust
  - ssim
description: RGBA Structural Similarity Rust implementation
executables:
  - dssim
provenance:
  formula: dssim
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
