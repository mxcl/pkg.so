id: brew:gnu-time
display-name: GNU Time
homepage: https://www.gnu.org/software/time/
repo: https://git.savannah.gnu.org/cgit/time.git
docs:
  - https://www.gnu.org/software/time/manual
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Package managers keep GNU Time available even on systems that already ship a shell
      or system time command, because the GNU implementation exposes a broader and more
      scriptable set of resource fields. In CLI culture it became the portable answer
      for benchmark logs that need more than wall-clock seconds.
  package-nerd-significance:
    - >
      The package matters because it is small, predictable, and separate from shell
      syntax. That makes it useful in packaging recipes, benchmark harnesses, and CI
      scripts where the same command line should work outside a particular interactive
      shell.
  project-history:
    - >
      The GNU manual carries copyright years beginning in 1991, and the GNU FTP archive
      records the 1.7 release in 1996, followed by later releases in the 1.x series. The
      program evolved around a compact Unix interface, adding GNU-style format strings,
      verbose output, output redirection, append mode, and POSIX-compatible output for
      scripts that need a stable three-line real/user/sys report.
    - >
      GNU Time sits beside shell builtins named time, rather than replacing them
      everywhere. The manual explicitly notes how to run the external command when a
      shell reserves the word, preserving the GNU tool as a separately packaged utility
      for users who need its richer resource accounting.
  related-projects:
    - >
      Related tools include shell time keywords and builtins, POSIX time output, BSD
      getrusage-based accounting, and benchmark wrappers that consume command resource
      statistics.
  sources:
    - https://formulae.brew.sh/formula/gnu-time
    - https://ftp.gnu.org/gnu/time/
    - https://www.gnu.org/software/time/manual/time.html
  summary:
    - >
      GNU Time is the GNU Project implementation of the Unix time utility: it runs a
      command and reports resource use after the command exits. Its long-lived niche is
      not timing clocks in the abstract, but producing repeatable command-line
      measurements of elapsed time, CPU time, memory, page faults, I/O, context
      switches, and exit status.
  timeline:
    - '1991: GNU Time manual copyright begins.'
    - '1996: GNU FTP archive lists time 1.7.'
    - '2017: GNU FTP archive lists time 1.8 after a long quiet interval.'
    - '2026: GNU FTP archive lists time 1.10.'
  usage:
    - >
      Practitioners use GNU Time by prefixing a command, selecting an output format with
      -f or TIME, writing measurements with -o, appending with -a, or asking for verbose
      resource reports with -v. Common uses include timing compilers, test suites, data
      pipelines, and one-off shell commands while keeping the measured program
      unchanged.
related-packages:
  - id: brew:hyperfine
    reason: >
      Choose hyperfine for repeated statistical command benchmarks and comparisons;
      choose GNU Time for a single run's detailed CPU, memory, I/O, and process-resource
      report.
    rel: alternative
    sources:
      - https://github.com/sharkdp/hyperfine
      - https://www.gnu.org/software/time/manual/time.html
category: system
package-manager:
  apk: time
  brew: gnu-time
  debian: time
  dnf: time
  nix: time
  pacman: time
  scoop: main/time
  ubuntu: time
  zypper: time
package-manager-url: https://formulae.brew.sh/formula/gnu-time
license: GPL-3.0-or-later
tags:
  - benchmarking
  - cli
  - gnu
  - resource-usage
  - time
description: GNU implementation of time utility
executables:
  - time
provenance:
  formula: gnu-time
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
