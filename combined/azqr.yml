id: brew:azqr
display-name: Azure Quick Review
homepage: https://azure.github.io/azqr/
repo: https://github.com/Azure/azqr
docs:
  - https://azure.github.io/azqr/docs/usage
  - https://azure.github.io/azqr
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents install paths for Linux and Azure Cloud Shell via
      install script, Windows via WinGet or PowerShell, and macOS via Homebrew. The
      batch input also lists Homebrew and WinGet packages, matching the tool's audience
      of Azure operators who may run scans from local workstations, Cloud Shell, or
      automation hosts.
  package-nerd-significance:
    - >
      Azqr matters to package nerds because it packages a changing Azure best-practices
      review into one binary with a stable command surface. That is easier to distribute
      and pin than a pile of ARG snippets, spreadsheets, and portal instructions.
    - >
      Its output format also explains its package shape: operators want a local
      executable that can run against many subscriptions and produce shareable
      artifacts, so Homebrew and WinGet distribution are not decorative, they are part
      of the workflow.
  project-history:
    - >
      The Azure/azqr repository was created in October 2022. The official README
      describes Azure Quick Review as a CLI for analyzing Azure resources against Azure
      best practices and recommendations, with the goal of giving users a comprehensive
      overview of non-compliant configurations and improvement areas.
    - >
      The project connects its recommendation model to Azure Resource Graph queries from
      the Azure Proactive Resiliency Library v2 and the Azure Orphaned Resources
      project, plus Azure Resource Manager rules built with the Azure Go SDK. That makes
      azqr a curated assessment engine rather than only a wrapper around one Azure API.
    - >
      The release stream reached v1.0.0 in April 2024, and the GitHub releases API shows
      v3.x releases and previews in 2026, indicating continued development of the
      assessment corpus and reporting workflow.
  related-projects:
    - >
      The README explicitly ties Azure Quick Review recommendations to Azure Proactive
      Resiliency Library v2, Azure Orphaned Resources, Azure Resource Graph, Azure
      Resource Manager, Azure Advisor, Microsoft Defender for Cloud, and Azure Policy.
  sources:
    - >
      GitHub releases API lists v1.0.0 on 2024-04-17, v3.0.0 on 2026-02-16, and v3.2
      preview releases in 2026.
    - 'GitHub repository metadata: created_at 2022-10-17.'
    - >
      Official README documents purpose, recommendation sources, output workbooks,
      install methods, and quick start.
    - input.source_facts.package-manager lists Homebrew and WinGet packaging.
  summary:
    - >
      Azure Quick Review, packaged as `azqr`, is an Azure assessment CLI that scans
      subscriptions for best-practice, resiliency, security, inventory, and governance
      findings and emits reports, commonly Excel workbooks. It sits in the practical
      space between Azure Advisor, scripted Azure Resource Graph queries, and
      consultant-style cloud review checklists.
  timeline:
    - '2022: Azure/azqr repository created.'
    - '2024: v1.0.0 release published.'
    - '2026: v3.0.0 release published.'
    - '2026: v3.2.0 preview release series active.'
  usage:
    - >
      The quick start is operationally direct: authenticate with Azure CLI, run `azqr
      scan`, and open the generated report with `azqr show`. The README says scan output
      defaults to an Excel file with recommendation, impacted-resource, resource-type,
      inventory, and out-of-scope sheets, with optional CSV generation and optional
      stages for Advisor, Defender, Policy, Arc SQL, and Costs.
related-packages:
  - id: brew:azure-dev
    reason: >
      Azure Developer CLI is a documented local credential source for azqr, so
      developers already authenticated with `azd` can run assessments without
      introducing a separate azqr credential store.
    rel: adjacent_workflow
    sources:
      - https://azure.github.io/azqr/docs/usage/
      - https://learn.microsoft.com/en-us/azure/developer/azure-developer-cli/
category: cloud-infrastructure
package-manager:
