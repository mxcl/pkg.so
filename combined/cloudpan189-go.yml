id: brew:cloudpan189-go
display-name: cloudpan189-go
homepage: https://github.com/tickstep/cloudpan189-go
repo: https://github.com/tickstep/cloudpan189-go
docs:
  - https://github.com/tickstep/cloudpan189-go/blob/master/docs/manual.md
  - https://github.com/tickstep/cloudpan189-go#readme
config-file-location:
  unix: $CLOUD189_CONFIG_DIR
credentials-file-location:
  unix: $CLOUD189_CONFIG_DIR
history:
  adoption-history:
    - >
      The README documents direct release downloads plus apt, yum, Homebrew, and winget
      installation paths, and the input record confirms Homebrew and winget package
      identities.
  package-nerd-significance:
    - >
      The package is notable as a cloud-storage CLI with cross-platform binary packaging
      and multiple system package-manager routes, including Linux repositories, Homebrew
      on macOS, and winget on Windows.
  project-history:
    - >
      The official README describes a Go CLI for Tianyi Cloud Disk and notes the project
      is no longer maintained; GitHub marks the repository archived and read-only.
  related-projects:
    - >
      The project targets China Telecom's Cloud189/Tianyi Cloud Disk service rather than
      a separate open-source ecosystem.
  sources:
    - >
      https://github.com/tickstep/cloudpan189-go#readme documents the CLI,
      package-manager installs, CLOUD189_CONFIG_DIR, login behavior, and archived
      maintenance status.
    - >
      https://github.com/tickstep/cloudpan189-go/blob/master/docs/manual.md documents
      command usage and config commands.
    - source_facts.package-manager lists Homebrew and winget package names.
  summary:
    - >
      cloudpan189-go is a Go command-line client for Tianyi Cloud Disk, exposing
      Linux-shell-like file operations for Cloud189 storage.
  timeline:
    - >
      2023: The README examples show active cloud-drive command workflows and
      package-manager install instructions.
    - >
      2026: GitHub marks the repository archived on March 2, 2026, and the README states
      the project is no longer maintained.
  usage:
    - >
      Users run the interactive CLI or commands for login, listing, upload, download,
      sharing, backup, import, export, and configuration; login stores account data in
      the configuration directory for later automatic login.
related-packages: []
category: productivity
package-manager:
  brew: cloudpan189-go
  winget: tickstep.cloudpan189-go
package-manager-url: https://formulae.brew.sh/formula/cloudpan189-go
license: Apache-2.0
tags:
  - backup
  - cli
  - cloud-storage
  - cloud189
  - file-transfer
  - go
description: Command-line client tool for Cloud189 web disk
executables:
  - cloudpan189-go
provenance:
  formula: cloudpan189-go
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
