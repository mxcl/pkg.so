id: brew:matterbridge
display-name: matterbridge
homepage: https://github.com/42wim/matterbridge
repo: https://github.com/42wim/matterbridge
docs:
  - https://github.com/42wim/matterbridge/wiki/How-to-create-your-config
  - https://github.com/42wim/matterbridge#readme
config-file-location:
  unix: matterbridge.toml
credentials-file-location:
  unix: matterbridge.toml
history:
  adoption-history:
    - >
      matterbridge became popular in open-source community operations because projects
      often had users spread across legacy IRC, newer chat systems, and team chat
      products. The README's public development/chat links span Discord, Gitter, IRC,
      Keybase, Matrix, Mattermost, Rocket.Chat, Slack, Telegram, Twitch, XMPP, and
      Zulip.
    - >
      The batch input records matterbridge in Homebrew, Alpine, Fedora, MacPorts, Nix,
      Arch, and Scoop. That cross-platform packaging matches a daemon-style utility that
      users install on servers, small VPS hosts, or personal machines to keep chat
      communities connected.
  package-nerd-significance:
    - >
      matterbridge is significant because it packages social interoperability as an
      installable Unix service. For maintainers, it is also a dependency and policy
      puzzle: many network clients, fast-moving chat APIs, optional protocol support,
      and build tags all meet in one command-line daemon.
    - >
      It is one of the practical tools that helped communities migrate gradually instead
      of forcing one chat platform choice. That made it valuable in package managers
      even for users who only needed a single bridge pair.
  project-history:
    - >
      The README describes matterbridge as a simple chat bridge with the slogan 'Letting
      people be where they want to be.' It explicitly notes that Mattermost is not
      required, despite the name, and documents a broad native protocol list plus a
      basic API for third-party bridges.
    - >
      By the v1.26.0 release line, the changelog shows protocol-specific maintenance
      across IRC, Matrix, Mattermost, Mumble, Telegram, Slack, WhatsApp, and other
      bridges. The project also carries operational packaging surfaces such as binaries,
      Docker guidance, systemd/OpenRC examples, and a sample TOML configuration.
  related-projects:
    - >
      The README lists related projects and API users such as MatterLink, MatterCraft,
      MatterBukkit, pyCord, Mattereddit, fbridge, matterbabble, Vintage Story bridge,
      ServUO-matterbridge, ts-matterbridge, beerchat, and a Mattermost plugin.
  sources:
    - https://github.com/42wim/matterbridge
    - https://github.com/42wim/matterbridge/releases/tag/v1.26.0
    - https://raw.githubusercontent.com/42wim/matterbridge/master/README.md
    - https://raw.githubusercontent.com/42wim/matterbridge/master/changelog.md
    - source_facts.package-manager
  summary:
    - >
      matterbridge is a Go chat bridge that relays messages between many chat protocols
      so communities can remain split across Discord, IRC, Matrix, Mattermost, Slack,
      Telegram, XMPP, Zulip, and other networks while still sharing a conversation.
  timeline:
    - '2017: Git tag history includes the v1.x release era for matterbridge.'
    - '2023: GitHub release v1.26.0 is published.'
    - >
      2020s: README-documented native bridge list includes Discord, IRC, Matrix,
      Mattermost, Slack, Telegram, WhatsApp, XMPP, Zulip, and more.
  usage:
    - >
      A typical setup is a `matterbridge.toml` file with account sections for protocols
      and one or more gateway sections that map channels between them. The README
      examples show IRC-to-Mattermost and Slack-to-Discord bridges, with credentials
      such as passwords and tokens stored in the same TOML file.
    - >
      Users usually run a downloaded binary, distro package, container, or
      built-from-source binary. Build tags allow excluding heavy bridges or enabling
      WhatsApp multidevice support, and the README notes that some WhatsApp support
      cannot be distributed as official binaries because of GPL-licensed dependencies.
related-packages: []
category: networking
package-manager:
  apk: matterbridge
  brew: matterbridge
  dnf: matterbridge
  macports: matterbridge
  nix: matterbridge
  pacman: matterbridge
  scoop: extras/matterbridge
package-manager-url: https://formulae.brew.sh/formula/matterbridge
license: Apache-2.0
tags:
  - chat-bridge
  - cli
  - discord
  - irc
  - mattermost
  - protocol-bridge
  - slack
description: Protocol bridge for multiple chat platforms
executables:
  - matterbridge
provenance:
  formula: matterbridge
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
