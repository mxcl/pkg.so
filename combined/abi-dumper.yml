id: brew:abi-dumper
display-name: ABI Dumper
homepage: https://github.com/lvc/abi-dumper
repo: https://github.com/lvc/abi-dumper
docs:
  - https://github.com/lvc/abi-dumper#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ABI Dumper has been packaged broadly in Linux and Unix-like package managers. The
      input package-manager facts list Alpine, Homebrew, Debian, Fedora, Nix, Arch,
      Ubuntu, and openSUSE, reflecting its use by distribution maintainers and library
      developers who care about ABI stability.
  package-nerd-significance:
    - >
      ABI Dumper is package-nerd significant because ABI breakage is a central
      maintenance problem for binary distributions. It gives packagers and upstream
      library maintainers a reproducible artifact for compatibility checks rather than
      relying only on source-level API review.
  project-history:
    - >
      The official README identifies Andrey Ponomarenko as the developer and describes
      ABI Dumper as part of the ABI tracking workflow around ABI Compliance Checker. The
      GitHub repository was created in 2013 and its tag history runs from 0.95 through
      1.4.
  related-projects:
    - >
      Related projects include ABI Compliance Checker, vtable-dumper, universal-ctags,
      elfutils, GNU binutils, and C/C++ shared-library packaging workflows.
  sources:
    - >
      Official README, GitHub repository metadata, GitHub tag metadata, and
      source_facts.package-manager.
  summary:
    - >
      ABI Dumper is a developer tool that extracts ABI information from ELF objects with
      DWARF debug data. Its output is intended for ABI Compliance Checker, allowing
      maintainers to compare C/C++ library or kernel-module ABI changes across builds.
  timeline:
    - '2013: GitHub repository created.'
    - '2013: Earliest current GitHub tag is 0.95.'
    - '2010s: The tool becomes part of the ABI Compliance Checker ecosystem.'
    - '2025: GitHub repository metadata shows continued activity.'
    - 'Current: Latest listed GitHub tag is 1.4.'
  usage:
    - >
      Users compile objects with debug information, run abi-dumper on a shared library
      or kernel module to produce an ABI dump, and then compare old and new dumps with
      abi-compliance-checker. The README documents dependencies on Perl, elfutils, GNU
      binutils, universal ctags, vtable-dumper, ABI Compliance Checker, and GCC C++.
related-packages: []
category: developer-tools
package-manager:
  apk: abi-dumper
  brew: abi-dumper
  debian: abi-dumper
  dnf: abi-dumper
  nix: abi-dumper
  pacman: abi-dumper
  ubuntu: abi-dumper
  zypper: abi-dumper
package-manager-url: https://formulae.brew.sh/formula/abi-dumper
license: LGPL-2.1-or-later
