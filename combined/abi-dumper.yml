  - abi
  - binary-analysis
  - c
  - cli
  - cpp
  - dwarf
  - elf
description: Dump ABI of an ELF object containing DWARF debug info
executables:
  - abi-dumper
provenance:
  formula: abi-dumper
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
