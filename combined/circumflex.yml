id: brew:circumflex
display-name: circumflex
homepage: https://github.com/bensadeh/circumflex
repo: https://github.com/bensadeh/circumflex
docs:
  - https://github.com/bensadeh/circumflex#readme
config-file-location:
  unix: ~/.config/circumflex/theme.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew, Nix, AUR, Go install, and source-run installation
      paths. Homebrew's formula builds the Go binary as clx and installs manpages plus
      shell completions for bash, zsh, and fish.
    - >
      Homebrew analytics show moderate ongoing use for a terminal news reader, and the
      GitHub repository has visible interest for a focused TUI utility.
  package-nerd-significance:
    - >
      circumflex is a polished example of the modern Go TUI package: a single binary
      with manpage and shell-completion artifacts, Homebrew/Nix/AUR/Go install routes,
      XDG-style config/cache paths, and local JSON state files.
  project-history:
    - >
      The official repository was created in July 2020. The README describes a read-only
      Hacker News client that brings stories, comments, and article reader mode into a
      terminal interface.
    - >
      The project has continued regular tagged releases through 4.4, which Homebrew
      packages from the official GitHub tag.
  related-projects:
    - Hacker News is the content source and user workflow that circumflex wraps.
    - Homebrew, Nix, AUR, and Go install are the distribution paths named by the README.
    - The clx binary is the installed command-line entry point for circumflex.
  sources:
    - https://github.com/bensadeh/circumflex#readme
    - https://api.github.com/repos/bensadeh/circumflex
    - https://api.github.com/repos/bensadeh/circumflex/releases
    - https://formulae.brew.sh/api/formula/circumflex.json
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/master/Formula/c/circumflex.rb
  summary:
    - >
      circumflex is a Go terminal user interface for browsing Hacker News through the
      clx binary, with article reader mode, comment navigation, favorites, read history,
      themes, and vim-style keybindings.
  timeline:
    - '2020-07-28: GitHub repository created.'
    - '2020s: README documents Homebrew, Nix, AUR, Go install, and source install paths.'
    - '2026-06-27: 4.4 release published and used by Homebrew as the stable formula version.'
    - '2026: Homebrew bottles circumflex for macOS and Linux.'
  usage:
    - >
      Users run clx to browse Hacker News categories such as top, best, new, ask, show,
      and favorites; open comments; read linked articles in reader mode; mark or track
      read stories; and store favorites locally. The README states that circumflex is
      read-only and does not support logging in, voting, or commenting.
related-packages: []
category: productivity
package-manager:
  brew: circumflex
  nix: circumflex
package-manager-url: https://formulae.brew.sh/formula/circumflex
license: MIT
tags:
  - cli
  - hacker-news
  - news-reader
  - terminal
  - tui
description: Hacker News in your terminal
executables:
  - clx
provenance:
  formula: circumflex
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
