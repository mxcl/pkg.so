id: brew:gitmux
display-name: gitmux
homepage: https://github.com/arl/gitmux
repo: https://github.com/arl/gitmux
docs:
  - https://github.com/arl/gitmux#readme
config-file-location:
  unix: ~/.gitmux.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      gitmux spread through terminal-tooling channels rather than through a large
      framework ecosystem. Its README documents binary releases, Homebrew installation
      for macOS and Linux, Arch User Repository packages, and Go source installation,
      which matches its position as a practical status-line utility.
  package-nerd-significance:
    - >
      For package maintainers, gitmux is a typical compact CLI package: a single
      executable, no service integration, and behavior that can be verified by running
      it inside a Git checkout. It matters mainly to users who keep Git context visible
      inside long-running tmux sessions.
  project-history:
    - >
      The GitHub repository was created in October 2019, and an early v0.2.0 release was
      published the same day. The README presents gitmux as an install-and-forget tmux
      companion with shell-agnostic behavior and a YAML configuration file for colors,
      symbols, and layout.
  related-projects:
    - >
      tmux provides the status bar integration point, while Git supplies the repository
      state that gitmux summarizes.
  sources:
    - https://api.github.com/repos/arl/gitmux
    - https://api.github.com/repos/arl/gitmux/releases
    - https://github.com/arl/gitmux
    - https://raw.githubusercontent.com/arl/gitmux/master/README.md
  summary:
    - >
      gitmux is a small Go command-line tool that renders Git working-tree state for the
      tmux status bar. Its role is deliberately narrow: it turns branch, divergence,
      staged, modified, untracked, stash, and cleanliness information into tmux format
      strings.
  timeline:
    - '2019: Repository created on GitHub.'
    - '2019: v0.2.0 release published.'
    - >
      2020s: README-documented install paths include Homebrew, AUR, binary releases, and
      Go source installation.
  usage:
    - >
      Practitioners add a `gitmux` invocation to `status-right` in `.tmux.conf`, usually
      passing tmux's pane path so the status bar follows the active working directory.
      Users generate a default YAML file with `gitmux -printcfg`, save it as
      `~/.gitmux.conf`, and pass it with `-cfg` when they want customized symbols or
      colors.
related-packages:
  - id: brew:tmux
    reason: >
      tmux is gitmux's documented host: gitmux is invoked from status-left or
      status-right to render Git state for the active pane's working directory.
    rel: adjacent_workflow
    sources:
      - https://github.com/arl/gitmux#readme
      - https://github.com/tmux/tmux
category: developer-tools
package-manager:
  brew: gitmux
  nix: gitmux
package-manager-url: https://formulae.brew.sh/formula/gitmux
license: MIT
tags:
  - cli
  - git
  - status-bar
  - terminal
  - tmux
description: Git status in tmux status bar
executables:
  - gitmux
provenance:
  formula: gitmux
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
