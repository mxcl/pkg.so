id: brew:eatmemory
display-name: eatmemory
homepage: https://github.com/julman99/eatmemory
repo: https://github.com/julman99/eatmemory
docs:
  - https://github.com/julman99/eatmemory#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input metadata records packaging in Homebrew, MacPorts, and Alpine. The
      upstream README also documents Homebrew installation and an official Docker image,
      which fits the tool's common use in local, container, and CI memory-limit tests.
  package-nerd-significance:
    - >
      eatmemory is a good example of the Unix packaging sweet spot: a tiny C tool with
      no runtime dependencies, obvious behavior, and measurable operational value. It
      overlaps with stress-ng but intentionally keeps the interface narrow.
  project-history:
    - >
      The public repository was created in August 2012. The README frames the tool as a
      one-job C99 binary that allocates, verifies, holds, and frees resident committed
      memory.
    - >
      Recent releases show the project being modernized rather than expanded into a
      suite. Version 1.0.0 added broader platform work, CI organization, and release
      binaries; version 1.1.0 followed in May 2026 with packaged binaries for multiple
      Linux, macOS, and Windows architectures.
  related-projects:
    - >
      stress-ng is the comparison tool named by the README. The README also documents
      Docker Hub image usage for container memory testing.
  sources:
    - https://github.com/julman99/eatmemory
    - https://github.com/julman99/eatmemory/releases/tag/v1.0.0
    - https://github.com/julman99/eatmemory/releases/tag/v1.1.0
  summary:
    - >
      eatmemory is a tiny command-line utility that allocates and holds a requested
      amount of RAM. Its significance is practical: it gives operators and developers a
      simple, packageable way to create memory pressure without installing a large
      stress-testing suite.
  timeline:
    - '2012: Public repository created.'
    - '2015: v0.1.4 release published.'
    - '2023: v0.1.9 added timed exit and improved argument parsing.'
    - '2026: v1.0.0 and v1.1.0 releases added modern release binaries and platform support.'
  usage:
    - >
      Users run commands such as `eatmemory 1G` or percentage-based allocations to test
      swap, container memory limits, Kubernetes eviction behavior, alerts, degradation
      under pressure, autoscaling, and noisy-neighbor scenarios.
related-packages:
  - id: brew:stress-ng
    reason: >
      Choose stress-ng when memory pressure is only one part of a broader, configurable
      CPU, I/O, virtual-memory, or kernel stress workload; eatmemory is the simpler
      single-purpose option.
    rel: alternative
    sources:
      - https://github.com/julman99/eatmemory
      - https://github.com/ColinIanKing/stress-ng
category: system
package-manager:
  apk: eatmemory
  brew: eatmemory
  macports: eatmemory
package-manager-url: https://formulae.brew.sh/formula/eatmemory
license: MIT
tags:
  - cli
  - diagnostics
  - memory
  - stress-testing
  - testing
description: Simple program to allocate memory from the command-line
executables:
  - eatmemory
provenance:
  formula: eatmemory
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
