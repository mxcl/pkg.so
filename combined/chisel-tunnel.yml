id: brew:chisel-tunnel
display-name: Chisel
homepage: https://github.com/jpillora/chisel
repo: https://github.com/jpillora/chisel
docs:
  - https://github.com/jpillora/chisel#readme
config-file-location: null
credentials-file-location:
  unix:
    - <path supplied with --authfile> (users.json)
    - <path supplied with --keyfile> (PEM SSH private key)
    - <path supplied with --tls-key> (PEM TLS private key)
history:
  adoption-history:
    - >
      The upstream install section points users to GitHub releases, a one-line install
      script, Docker images, Fedora packages, and go install. The input package facts
      also show distribution through Homebrew as chisel-tunnel, Nix as chisel, Scoop,
      and WinGet, reflecting cross-platform command-line adoption.
  package-nerd-significance:
    - >
      Chisel is a package-manager favorite because it compresses a lot of tunnel
      behavior into one static-ish Go executable. It is also a good example of the
      naming compromises package managers make: Homebrew uses chisel-tunnel while other
      ecosystems often package the upstream name chisel.
  project-history:
    - >
      The official repository begins in 2015 and the README presents Chisel as a
      client/server executable for passing through firewalls or exposing a secure
      endpoint into a network. Its feature list grew around encrypted SSH transport,
      reverse port forwarding, SOCKS5 support, proxy traversal, stdio transport for SSH
      ProxyCommand, and server-side reverse proxy behavior.
  related-projects:
    - >
      The README explicitly compares its transport building blocks with Go net/http,
      crypto/ssh, SOCKS5, HTTP CONNECT proxies, Docker distribution, and Fedora
      community packaging.
  sources:
    - https://github.com/jpillora/chisel#readme
    - https://formulae.brew.sh/api/formula/chisel-tunnel.json
    - https://github.com/jpillora/chisel
  summary:
    - >
      Chisel is a Go single-binary TCP/UDP tunneling tool that transports traffic over
      HTTP and secures the connection using SSH.
  timeline:
    - '2015: First public commits and 1.0.x tags in the official repository.'
    - '2015: README documents GitHub release binaries and go install from source.'
    - '2026: Homebrew tracks stable v1.11.7 for the chisel-tunnel formula.'
  usage:
    - >
      Users run chisel server on a reachable HTTP endpoint and chisel client from the
      restricted side to create local, remote, or reverse tunnels. The README documents
      common firewall traversal, SOCKS5, HTTP CONNECT proxy, authentication, TLS, and
      client auto-reconnect use cases.
related-packages: []
category: networking
package-manager:
  brew: chisel-tunnel
  nix: chisel
  scoop: main/chisel
  winget: Snesnopic.Chisel
package-manager-url: https://formulae.brew.sh/formula/chisel-tunnel
license: MIT
tags:
  - cli
  - go
  - http
  - port-forwarding
  - proxy
  - ssh
  - tcp
  - tunnel
  - udp
description: Fast TCP/UDP tunnel over HTTP
executables:
  - chisel
provenance:
  formula: chisel-tunnel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
