id: brew:jiratui
display-name: JiraTUI
homepage: https://jiratui.sh/
repo: https://github.com/whyisdifficult/jiratui
docs:
  - https://jiratui.readthedocs.io/en/latest
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/jiratui/config.yaml
    - ~/.config/jiratui/config.yaml
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/jiratui/config.yaml
    - ~/.config/jiratui/config.yaml
history:
  adoption-history:
    - >
      JiraTUI's public history is short, but it already uses several packaging channels
      familiar to Python CLI users: PyPI, uv tool installation, pip, pipx, AUR,
      Homebrew, and Nix. Its README also documents Linux, macOS, and Windows support,
      which helps the TUI reach developers across common terminal environments.
  package-nerd-significance:
    - >
      JiraTUI represents the newer Textual/Rich generation of Python TUIs: more
      application-like than a plain CLI, but still installed and launched like a normal
      package-manager tool. It is interesting beside `jira-cli` because both target Jira
      from the terminal, yet JiraTUI leans into a full-screen interface rather than a
      GitHub-CLI-style command tree.
  project-history:
    - >
      The project had its first public release in September 2025. Its README frames it
      as a TUI for interacting with Jira directly from the shell, with both an
      interactive `jiratui ui` application and command groups for issues, comments,
      users, themes, configuration, and version information.
    - >
      Version 1.0.0 followed quickly after the first 0.x releases and moved
      configuration to the XDG file layout while dropping the old `JIRA_TUI_ENV_FILE`
      configuration path. Later releases added API v2 support, work-item editing
      improvements, navigation features, and history-oriented UI conveniences.
  related-projects:
    - >
      JiraTUI is directly related to Textual, Rich, Atlassian Jira REST APIs, and
      terminal applications such as Posting, Lazygit, and Harlequin, which the README
      credits as inspirations. It also overlaps in purpose with `jira-cli`.
  sources:
    - https://api.github.com/repos/whyisdifficult/jiratui/releases/tags/v1.0.0
    - https://api.github.com/repos/whyisdifficult/jiratui/releases/tags/v1.9.0
    - https://api.github.com/repos/whyisdifficult/jiratui/releases?per_page=100
    - https://github.com/whyisdifficult/jiratui
    - https://jiratui.readthedocs.io/
    - https://pypi.org/pypi/jiratui/json
  summary:
    - >
      JiraTUI is a Python terminal user interface and CLI for Atlassian Jira. It is
      built with Textual and Rich, supports Jira Cloud REST API v3 and v2, and stores
      Jira credentials and settings in an XDG-style YAML configuration file.
  timeline:
    - '2025: v0.1.0 was published as the first JiraTUI release.'
    - >
      2025: v1.0.0 introduced the XDG configuration layout and removed
      `JIRA_TUI_ENV_FILE` support.
    - '2025: v1.1.0 added Jira Cloud REST API v2 support alongside API v3.'
    - '2026: v1.8.0 and v1.8.1 continued the 1.x release line.'
    - >
      2026: v1.9.0 added parent-key autocomplete, a Go-To screen, keybinding-hint
      configuration, and a view of work-item history.
  usage:
    - >
      Users configure `jira_api_username`, `jira_api_token`, and `jira_api_base_url` in
      `config.yaml`, optionally select cloud or on-premise behavior, and run `jiratui
      ui` for the full TUI. The CLI side supports searching, updating, and deleting work
      items, managing comments, searching users and groups, listing themes, and printing
      the configuration file location.
related-packages:
  - id: brew:jira-cli
    reason: >
      Choose JiraCLI when POSIX-style command composition, JQL, interactive issue lists,
      and JSON or CSV output are more important than a full-screen Textual application.
    rel: alternative
    sources:
      - https://jiratui.readthedocs.io/en/latest/
      - https://github.com/ankitpokhrel/jira-cli
category: productivity
package-manager:
  brew: jiratui
  nix: jiratui
package-manager-url: https://formulae.brew.sh/formula/jiratui
license: MIT
tags:
  - cli
  - issue-tracking
  - jira
  - terminal
  - tui
description: Textual User Interface for interacting with Atlassian Jira from your shell
executables:
  - jiratui
provenance:
  formula: jiratui
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
