config-file-location:
  unix: config/server.properties
credentials-file-location: null
history:
  adoption-history:
    - >
      Kafka's adoption followed from its original LinkedIn use case: durable,
      high-throughput movement of event data between many producers and consumers. Its
      Apache governance and Java/Scala ecosystem helped it become a common foundation
      for streaming analytics, log aggregation, change-data capture, event-driven
      services, and data pipelines.
    - >
      Package-manager adoption reflects two overlapping audiences. Developers install
      Kafka locally to run brokers and command scripts for development, while operators
      use the same scripts to inspect and administer clusters. Homebrew, Scoop, Pacman,
      and other package entries expose Kafka as a developer workstation dependency as
      much as a server component.
  package-nerd-significance:
    - >
      Apache Kafka is significant in package databases because one formula exposes an
      entire infrastructure platform plus dozens of command shims. It is a good stress
      test for package metadata: executable lists are long, config files are
      distribution-relative, and the package name refers to a server, protocol
      ecosystem, and CLI family at once.
    - >
      It is also historically important because many later packages in this batch exist
      to make Kafka easier to operate: kaf and kafkactl provide friendlier CLIs, while
      cloud-specific plugins exist because managed Kafka-compatible services introduced
      authentication and provider-specific edge cases.
  project-history:
    - >
      LinkedIn announced Kafka publicly on June 16, 2011 as a distributed
      publish-subscribe messaging system, open sourced under the Apache 2.0 license and
      submitted to the Apache Incubator. The announcement described Kafka as a system
      for high-throughput event data and noted that a paper had appeared at NetDB 2011.
    - >
      The Apache GitHub repository was created in August 2011. Kafka graduated from the
      Apache Incubator on October 23, 2012, and Apache project records identify the
      Kafka committee as established in November 2012.
    - >
      Over time Kafka expanded beyond a broker and client protocol into a broader
      event-streaming platform. Kafka Connect, Kafka Streams, MirrorMaker, security
      features, storage tooling, metadata tooling, and the Kafka Improvement Proposal
      process all became part of the operational and governance surface around the
      package.
  related-projects:
    - >
      Kafka's close project family includes Kafka Connect, Kafka Streams, MirrorMaker,
      Schema Registry implementations, kcat, kaf, kafkactl, Apache Flink, Apache Pulsar,
      and managed Kafka-compatible services such as Amazon MSK, Confluent Cloud, and
      Azure Event Hubs for Kafka clients.
  sources:
    - https://api.github.com/repos/apache/kafka
    - >
      https://engineering.linkedin.com/27/project-kafka-distributed-publish-subscribe-messaging-system-reaches-v06
    - https://formulae.brew.sh/formula/kafka
    - https://github.com/apache/kafka
    - https://incubator.apache.org/projects/kafka.html
    - https://kafka.apache.org/documentation/
    - https://kafka.apache.org/quickstart
    - https://projects.apache.org/committee.html?kafka=
  summary:
    - >
      Apache Kafka is a distributed event-streaming platform that began at LinkedIn and
      became a major Apache Software Foundation data project. It is both a server
      platform and a package that installs a large family of command-line tools for
      brokers, topics, consumers, producers, Connect, Streams, storage, metadata, and
      operations.
  timeline:
    - >
      2011-06-16: LinkedIn announced Kafka as an open-source distributed
      publish-subscribe messaging system.
    - '2011-08: Apache Kafka GitHub repository created.'
    - '2012-10-23: Kafka graduated from the Apache Incubator.'
    - '2012-11: Apache Kafka committee established.'
    - >
      2015 onward: Kafka's ecosystem expanded around Streams, Connect, managed services,
      and Kafka Improvement Proposals.
  usage:
    - >
      The Homebrew package installs many command-line entry points, including
      kafka-topics, kafka-console-producer, kafka-console-consumer,
      kafka-consumer-groups, kafka-configs, kafka-server-start, kafka-storage, and Kafka
      Connect scripts. That makes it both a runnable local broker distribution and a CLI
      toolbox.
    - >
      Kafka is used when systems need durable ordered logs, consumer groups, replayable
      event streams, and integration points between services and data systems. The
      official documentation and quickstart center the core loop: start a broker, create
      topics, write events, read events, and build producers, consumers, Streams, or
      Connect workloads.
related-packages:
  - id: brew:kafkactl
    reason: >
      kafkactl provides a context-oriented CLI for administering Kafka topics, consumer
      groups, ACLs, schemas, brokers, and users without relying solely on Kafka's
      bundled scripts.
    rel: adjacent_workflow
    sources:
      - https://github.com/deviceinsight/kafkactl
      - https://kafka.apache.org/documentation/
  - id: brew:kaf
    reason: >
      Kaf provides a compact kubectl-inspired client for inspecting Kafka clusters and
      working with topics, records, and consumer-group offsets.
    rel: adjacent_workflow
    sources:
      - https://github.com/birdayz/kaf
      - https://kafka.apache.org/documentation/
  - id: brew:kcat
    reason: >
      kcat is a lightweight non-JVM producer, consumer, and metadata inspector suited to
      piping records into and out of Kafka from shell workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/edenhill/kcat
      - https://kafka.apache.org/documentation/
  - id: brew:burrow
    reason: >
      Burrow monitors Kafka consumer-group offsets and evaluates consumer lag health,
      adding a focused operational monitoring layer around Kafka.
    rel: adjacent_workflow
    sources:
      - https://github.com/linkedin/Burrow
      - https://kafka.apache.org/documentation/
  - id: brew:apache-flink
    reason: >
      Apache Flink has an official Kafka connector for reading and writing Kafka topics,
      including checkpoint-backed delivery guarantees for stream-processing jobs.
    rel: adjacent_workflow
    sources:
      - https://nightlies.apache.org/flink/flink-docs-stable/docs/connectors/table/kafka/
      - https://kafka.apache.org/documentation/
  - id: brew:apache-pulsar
    reason: >
      Apache Pulsar is an alternative distributed messaging and streaming platform;
      choose it when its separated broker-and-storage architecture, multi-tenancy, and
      Pulsar-native features better fit the deployment.
    rel: alternative
    sources:
      - https://pulsar.apache.org/docs/
      - https://kafka.apache.org/documentation/
category: data
