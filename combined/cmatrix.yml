id: brew:cmatrix
display-name: CMatrix
homepage: https://github.com/abishekvashok/cmatrix/
repo: https://github.com/abishekvashok/cmatrix
docs:
  - https://github.com/abishekvashok/cmatrix#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CMatrix became a stock package-manager novelty because it has almost no conceptual
      setup, is instantly recognizable in demos, and works as a harmless terminal
      animation. The input package facts list it across Homebrew, Debian, Ubuntu,
      Fedora/dnf, Arch/pacman, Alpine/apk, MacPorts, Nix, and openSUSE/zypper.
  package-nerd-significance:
    - >
      For package nerds, CMatrix is the archetypal terminal toy: tiny, visual, easy to
      package, and useful as a smoke test for curses, terminal color, and font behavior.
      It is not infrastructure, but it is culturally durable in Unix package sets
      because it demonstrates that package managers carry fun as well as work.
  project-history:
    - >
      The current upstream README credits Chris Allegretta with writing cmatrix and
      later handing maintenance to the present GitHub project. The README describes the
      program as based on the Matrix website screensaver and inspired by the 1999 film's
      visual style.
    - >
      The GitHub repository was created in 2013 and preserves the old Unix terminal-tool
      form: build with autotools or CMake, install the binary, and run `cmatrix` for the
      effect.
  related-projects:
    - >
      The README explicitly relates CMatrix to the Matrix website screensaver and
      credits jwz's `xmatrix` module for XScreenSaver as an influence in its contributor
      notes.
  sources:
    - https://github.com/abishekvashok/cmatrix#readme
    - https://api.github.com/repos/abishekvashok/cmatrix
    - https://api.github.com/repos/abishekvashok/cmatrix/releases
  summary:
    - >
      CMatrix is a terminal animation that recreates the falling-code look associated
      with The Matrix. Its appeal is deliberately simple: it is a small ncurses-style
      command that turns a terminal into a screensaver-like visual toy.
  timeline:
    - '2013: Current GitHub repository created.'
    - '2017: GitHub release 1.2 published as a stable release.'
    - '2019: GitHub release v2.0 published.'
    - '2024: Current repository still receives maintenance activity.'
  usage:
    - >
      The README documents simple invocation as `cmatrix`, with options such as update
      speed and color. It also documents movie-like presets such as `cmatrix -lba`,
      which is the kind of one-command payoff that made it common in screenshots, shell
      demos, and terminal customization posts.
related-packages:
  - id: brew:pipes-sh
    reason: >
      Choose pipes.sh for a lightweight Bash-based terminal screensaver that draws
      configurable animated pipe paths instead of Matrix-style falling characters.
    rel: alternative
    sources:
      - https://github.com/pipeseroni/pipes.sh#readme
  - id: brew:asciiquarium
    reason: >
      Choose ASCIIQuarium when an animated aquarium scene is preferred over CMatrix's
      falling-code effect; it is a Perl/Curses terminal animation with simple pause and
      redraw controls.
    rel: alternative
    sources:
      - https://robobunny.com/projects/asciiquarium/html/?page=2
