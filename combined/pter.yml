id: brew:pter
display-name: pter
homepage: https://vonshednob.cc/pter/
repo: https://codeberg.org/pter/pter
docs:
  - https://vonshednob.cc/pter
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/pter/pter.conf
    - ~/.config/pter/pter.conf
    - ~/.config/pter/searches.txt
    - ~/.config/pter/templates.txt
    - ~/.config/pter/auto_templates.conf
credentials-file-location: null
history:
  adoption-history:
    - The official Todo.txt website lists pter among compatible task-management applications.
  package-nerd-significance:
    - >
      pter combines terminal and optional Qt interfaces around interoperable plain-text
      task files. Its installation guidance recommends pipx and provides an optional Qt
      dependency extra.
  project-history:
    - >
      The maintainer's published release history records releases from June 2020,
      including a 1.0 release later that month. Development is hosted on Codeberg.
  related-projects:
    - Todo.txt supplies the task-file format; qpter is the package's Qt graphical interface.
  sources:
    - https://pypi.org/project/pter/
    - https://todotxt.org/
  summary:
    - pter manages todo.txt files through terminal and graphical interfaces.
  timeline:
    - '2020: Published release history begins; version 1.0 follows in June.'
  usage:
    - >
      Launch pter with a todo.txt path, or use qpter for the graphical interface. Tasks
      can be searched by project, context and completion state; additional features
      include recurring tasks, templates and time tracking.
category: productivity
package-manager:
  brew: pter
package-manager-url: https://formulae.brew.sh/formula/pter
license: MIT
tags:
  - cli
  - gui
  - task-management
  - todo-txt
description: Your console and graphical UI to manage your todo.txt file(s)
executables:
  - pter
  - qpter
provenance:
  formula: pter
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
