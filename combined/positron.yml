id: cask:positron
display-name: Positron
homepage: https://positron.posit.co/
repo: https://github.com/posit-dev/positron
docs:
  - https://positron.posit.co/
  - https://positron.posit.co/guide-r.html
  - https://positron.posit.co/migrate-rstudio-settings-and-extensions.html
  - https://positron.posit.co/troubleshooting.html
config-file-location:
  linux: ~/.config/Positron/User/settings.json
  macos: ~/Library/Application Support/Positron/User/settings.json
  windows: '%APPDATA%\Positron\User\settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Positron has been adopted primarily by R and Python data scientists seeking an
      environment that combines Code OSS extensibility with integrated consoles, plots,
      data exploration, and reproducible publishing.
    - >
      Monthly release builds and packages for macOS, Windows, Debian-based Linux, and
      Red Hat-based Linux have made it available through both direct installers and
      system package ecosystems. Its migration guidance explicitly targets existing
      RStudio users.
  package-nerd-significance:
    - >
      Positron is notable to package enthusiasts as Posit's attempt to build a polyglot
      successor alongside the established RStudio ecosystem while reusing the Code OSS
      extension model.
    - >
      Its packaging combines desktop installers, signed macOS releases, DEB and RPM
      artifacts, and a Homebrew cask. The source is publicly developed but uses the
      Elastic License 2.0 rather than an OSI-approved open-source license.
  project-history:
    - >
      Posit PBC developed Positron as a next-generation data science IDE built on Code
      OSS. It integrates first-class R and Python support with tools for consoles,
      plots, variables, data exploration, notebooks, and reproducible authoring.
    - >
      The project evolved through public prereleases and monthly versioned builds,
      adding increasingly integrated data-science workflows and optional AI assistance
      while retaining compatibility with many VS Code concepts and extensions.
  related-projects:
    - >
      Positron is built on Code OSS and inherits many VS Code commands, settings,
      source-control features, and extension concepts.
    - >
      It sits alongside Posit's RStudio IDE, Quarto publishing system, and related R and
      Python tooling. Official migration documentation helps RStudio users translate
      their settings and workflows.
  sources:
    - https://github.com/posit-dev/positron
    - https://positron.posit.co/
    - https://positron.posit.co/guide-r.html
    - https://positron.posit.co/migrate-rstudio-settings-and-extensions.html
    - https://positron.posit.co/troubleshooting.html
  summary:
    - >
      Positron is a cross-platform, extensible data-science IDE from Posit PBC. Built on
      Code OSS, it provides integrated workflows for R, Python, data exploration,
      notebooks, and reproducible authoring.
  timeline:
    - '2024: Positron became publicly available as a next-generation data-science IDE.'
    - >
      2026: Monthly releases continued expanding notebook, package-management, and
      optional AI-assisted workflows.
  usage:
    - >
      Users commonly work with R or Python projects, execute code in integrated
      sessions, inspect variables and data frames, create plots, author Quarto
      documents, and manage source control from one desktop environment.
    - >
      Settings can be changed through the Settings UI or the user and workspace
      `settings.json` files. The official troubleshooting guide identifies Positron's
      platform state directories; the listed file paths follow Positron's documented
      Code OSS settings layout within those directories.
category: developer-tools
package-manager:
  brew-cask: positron
package-manager-url: https://formulae.brew.sh/cask/positron
tags:
  - code-oss
  - data-exploration
  - data-science
  - ide
  - macos
  - notebooks
  - python
  - quarto
  - r
description: Data science IDE
applications:
  - Positron.app
provenance:
  cask: positron
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
