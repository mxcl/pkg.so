id: brew:mftrace
display-name: mftrace
homepage: https://lilypond.org/mftrace/
repo: http://repo.or.cz/w/mftrace.git
docs:
  - https://lilypond.org/download/source/mftrace
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool's importance is narrow but durable: it bridges METAFONT-era bitmap fonts
      and scalable font formats used by PostScript, PDF, and TrueType workflows. Its
      manual describes the reason for the conversion in package-nerd terms: scalable
      fonts render across printer resolutions and let Ghostscript generate better PDFs
      than bitmap-only inputs.
  sources:
    - https://ctan.org/pkg/mftrace?lang=en
    - https://formulae.brew.sh/formula/mftrace
    - https://github.com/hanwen/mftrace
    - https://github.com/hanwen/mftrace/blob/master/mftrace.1
    - https://lilypond.org/mftrace/
  summary:
    - >
      mftrace grew out of the TeX and METAFONT font toolchain as a Python wrapper for
      converting TeX bitmap fonts into scalable outlines. The LilyPond-hosted manual
      describes it as tracing a TeX bitmap font into PFA, PFB, or TTF output, and notes
      that versions before 1.0.5 were named pktrace. The project documentation and man
      page identify Han-Wen Nienhuys as the author.
  usage:
    - >
      In use, mftrace delegates the heavy lifting to font and tracing utilities such as
      METAFONT, potrace or autotrace, t1asm, and FontForge-like tooling. That makes it a
      glue package for TeX distributions, music engraving and document publishing
      systems, and maintainers converting old METAFONT designs into formats expected by
      modern font consumers. Its packaging across Homebrew, Debian, Fedora, MacPorts,
      Nix, Ubuntu, and openSUSE reflects that it is infrastructure for a specialized
      publishing niche rather than an end-user font editor.
related-packages:
  - id: brew:fontforge
    reason: >
      Choose FontForge when you need an interactive or scriptable font editor; mftrace's
      own manual says FontForge can duplicate bitmap tracing and also performs mftrace's
      simplification, hinting, and additional-format generation.
    rel: alternative
    sources:
      - https://github.com/hanwen/mftrace#readme
      - https://fontforge.org/en-US/documentation/
  - id: brew:potrace
    reason: >
      Potrace is mftrace's recommended tracing backend and is the documented faster
      choice for converting the intermediate bitmap glyphs into outlines.
    rel: adjacent_workflow
    sources:
      - https://github.com/hanwen/mftrace#readme
      - https://potrace.sourceforge.net/
  - id: brew:autotrace
    reason: >
      AutoTrace is the officially supported alternative tracing backend for mftrace when
      Potrace is unsuitable for a particular font workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/hanwen/mftrace#readme
      - https://github.com/autotrace/autotrace
category: media
