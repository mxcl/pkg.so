id: brew:coturn
display-name: coturn
homepage: https://github.com/coturn/coturn
repo: https://github.com/coturn/coturn
docs:
  - https://github.com/coturn/coturn/wiki
  - https://github.com/coturn/coturn#readme
config-file-location:
  unix:
    - turnserver.conf
    - etc/turnserver.conf
    - ../etc/turnserver.conf
    - /etc/turnserver.conf
    - /usr/local/etc/turnserver.conf
credentials-file-location:
  unix:
    - /var/db/turndb
    - /var/lib/turn/turndb
    - turnserver.conf
history:
  adoption-history:
    - >
      coturn became a default choice in many self-hosted and distro-packaged WebRTC
      stacks because TURN is required when direct peer-to-peer connectivity fails. The
      README explicitly calls out Linux distribution packages and Docker images, and
      package metadata shows it available across Homebrew, Debian/Ubuntu, Fedora-style,
      Arch, Alpine, Nix, and zypper ecosystems.
  package-nerd-significance:
    - >
      coturn is package-significant because it sits at the boundary between library
      packaging and operations packaging: distros must ship binaries, service files,
      example configs, database paths, TLS/OpenSSL integration, and upgrade-safe
      defaults for a daemon that often fronts production media traffic.
  project-history:
    - >
      The coturn/coturn repository was created in July 2015 and the README describes the
      project as a free open-source implementation of TURN and STUN server
      functionality. Its source tree includes server, administration, utility, database,
      Docker, and documentation components, reflecting a long-lived service package
      rather than a single-purpose command.
  related-projects:
    - >
      STUN, TURN, ICE, WebRTC, VoIP servers, libevent, OpenSSL, Redis, PostgreSQL,
      MySQL/MariaDB, SQLite.
  sources:
    - https://github.com/coturn/coturn
    - https://github.com/coturn/coturn/wiki
    - https://api.github.com/repos/coturn/coturn
    - https://api.github.com/repos/coturn/coturn/releases?per_page=100
  summary:
    - >
      coturn is a widely packaged open-source STUN/TURN server used for NAT traversal in
      VoIP, WebRTC, and other real-time communication systems. It is infrastructure
      software: once installed, it is usually run as a network service rather than as an
      interactive CLI.
  timeline:
    - '2015: coturn/coturn repository created.'
    - '2017: GitHub releases were being published from the repository.'
    - '2020: Wiki pages documented configuration, downloads, and command references.'
    - '2026: Project remained active with new releases.'
  usage:
    - >
      Common use is to install the package, configure `turnserver.conf`, run
      `turnserver`, and manage users or credentials with `turnadmin` and the configured
      backend database. The project supports UDP, TCP, TLS, DTLS, several user database
      backends, monitoring integrations, and a management interface.
related-packages: []
category: networking
package-manager:
  apk: coturn
  brew: coturn
  debian: coturn
  dnf: coturn
  nix: coturn
  pacman: coturn
  ubuntu: coturn
  zypper: coturn
package-manager-url: https://formulae.brew.sh/formula/coturn
license: BSD-3-Clause
tags:
  - cli
  - nat-traversal
  - server
  - stun
  - turn
  - webrtc
description: Free open source implementation of TURN and STUN Server
executables:
  - turnadmin
  - turnserver
  - turnutils_natdiscovery
  - turnutils_oauth
  - turnutils_peer
  - turnutils_stunclient
  - turnutils_uclient
provenance:
  formula: coturn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
