id: brew:gdal
display-name: GDAL
homepage: https://gdal.org/en/stable/
repo: https://github.com/OSGeo/gdal
docs:
  - https://gdal.org/en/stable
config-file-location:
  unix:
    - $GDAL_CONFIG_FILE
    - $PREFIX/etc/gdal/gdalrc
    - ~/.gdal/gdalrc
  windows:
    - '%GDAL_CONFIG_FILE%'
    - '%USERPROFILE%/.gdal/gdalrc'
credentials-file-location:
  unix:
    - $GDAL_CONFIG_FILE
    - $PREFIX/etc/gdal/gdalrc
    - ~/.gdal/gdalrc
  windows:
    - '%GDAL_CONFIG_FILE%'
    - '%USERPROFILE%/.gdal/gdalrc'
history:
  adoption-history:
    - >
      GDAL became a foundation package in open source GIS and geospatial data processing
      because it hides many raster and vector file-format differences behind shared APIs
      and utilities.
    - >
      The upstream list of software using GDAL includes desktop GIS, web mapping
      servers, scientific tools, spatial databases, Python libraries, and remote-sensing
      applications such as QGIS, GRASS GIS, MapServer, PostGIS raster components,
      Rasterio, Fiona, GeoDjango, and NASA-related tooling.
  package-nerd-significance:
    - >
      GDAL matters to package managers because it is both an end-user CLI suite and a
      low-level dependency for a large geospatial stack. Packaging it correctly often
      means coordinating native libraries, format drivers, PROJ integration, Python
      bindings, and downstream ABI expectations.
    - >
      RFC 78 shows the packaging pressure around Python utilities: GDAL 3.3 implemented
      a gdal-utils package path so users could upgrade Python utility modules without
      necessarily upgrading the compiled bindings.
  project-history:
    - >
      The GDAL FAQ says Frank Warmerdam started work on the GDAL/OGR library in late
      1998. The project later became an Open Source Geospatial Foundation project and
      presents common raster and vector data models to applications while also shipping
      many command-line utilities.
    - >
      OGR began as a separate vector I/O library inspired by OpenGIS Simple Features.
      The GDAL documentation states that GDAL and OGR were integrated together with the
      GDAL 2.0 release.
    - >
      GDAL development has moved through several infrastructure eras. RFC 71 records the
      2018 decision to move the source tree and new issue tracking from OSGeo-hosted
      Subversion and Trac to GitHub while preserving full source history.
  related-projects:
    - OGR is the vector-data component that was historically separate and is now part of GDAL.
    - >
      Related geospatial projects using or surrounding GDAL include PROJ, QGIS, GRASS
      GIS, MapServer, PostGIS, Rasterio, Fiona, and DuckDB Spatial.
  sources:
    - https://gdal.org/en/stable/about.html
    - https://gdal.org/en/stable/development/rfc/rfc46_gdal_ogr_unification.html
    - https://gdal.org/en/stable/development/rfc/rfc71_github_migration.html
    - https://gdal.org/en/stable/development/rfc/rfc78_gdal_utils_package.html
    - https://gdal.org/en/stable/faq.html
    - https://gdal.org/en/stable/programs/index.html
    - https://gdal.org/en/stable/software_using_gdal.html
  summary:
    - >
      GDAL, the Geospatial Data Abstraction Library, is a long-running open source
      library and command-line toolkit for reading, writing, translating, and processing
      raster and vector geospatial data formats.
  timeline:
    - '1998: Frank Warmerdam starts work on the GDAL/OGR library.'
    - 'GDAL 2.0: GDAL and OGR are integrated into one project.'
    - '2018: RFC 71 proposes and adopts migration of source development to GitHub.'
    - '2021: RFC 78 records the adopted gdal-utils package plan for GDAL 3.3.'
    - '2025: GDAL documents command-line interface modernization for the new gdal front-end.'
    - '2026: GDAL documentation references the 3.13.1 release.'
  usage:
    - >
      Package users commonly install GDAL for command-line tools such as gdalinfo,
      gdal_translate, gdalwarp, ogrinfo, and ogr2ogr, as well as for the C/C++ library
      and language bindings used by higher-level geospatial software.
    - >
      Starting with GDAL 3.11, the project documents a new single gdal command with
      subcommands as a provisional alternative interface alongside the traditional
      utilities.
related-packages:
  - id: brew:proj
    reason: >
      Install PROJ alongside GDAL for coordinate-reference-system definitions and
      transformations; current GDAL builds require PROJ and use its database for
      geospatial coordinate operations.
    rel: adjacent_workflow
    sources:
      - https://gdal.org/en/stable/development/rfc/rfc98_build_requirements_gdal_3_9.html
      - https://proj.org/en/stable/
  - id: brew:rasterio
    reason: >
      Choose Rasterio when you want a focused Pythonic interface for raster workflows
      while retaining GDAL as the underlying format and I/O engine.
    rel: adjacent_workflow
    sources:
      - https://rasterio.readthedocs.io/en/stable/intro.html
      - https://gdal.org/en/stable/software_using_gdal.html
  - id: brew:fiona
    reason: >
      Choose Fiona for a focused Python interface to OGR-supported vector data formats
      while using GDAL/OGR underneath.
    rel: adjacent_workflow
    sources:
      - https://fiona.readthedocs.io/en/stable/README.html
      - https://gdal.org/en/stable/software_using_gdal.html
