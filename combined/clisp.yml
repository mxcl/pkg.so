id: brew:clisp
display-name: GNU CLISP
homepage: https://clisp.sourceforge.io/
repo: https://gitlab.com/gnu-clisp/clisp
docs:
  - https://clisp.sourceforge.io/impnotes.html
  - https://clisp.sourceforge.io/impnotes/clisp.html
  - https://www.gnu.org/software/clisp
config-file-location:
  unix:
    - ~/.clisprc.lisp
    - ~/.clisprc.fas
credentials-file-location: null
history:
  adoption-history:
    - >
      CLISP's own homepage lists official distribution through SourceForge and GNU FTP,
      plus packages or ports for Debian, Fedora, openSUSE, Gentoo, Arch, Ubuntu,
      FreeBSD, pkgsrc, OpenBSD, Fink, MacPorts, Homebrew, Cygwin, and Solaris CSW. The
      batch input also records package-manager coverage across Alpine, Homebrew, Debian,
      Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE.
    - >
      By the late 2000s CLISP had settled into the role of a widely packaged, portable
      Common Lisp runtime rather than the highest-performance implementation. Its long
      availability in Unix package managers made it a familiar command-line Lisp for
      scripts, teaching, and portability testing.
  package-nerd-significance:
    - >
      CLISP is package-nerd notable because it is one of the old, portable Common Lisp
      implementations that distributions carried for decades. It exercises hard
      packaging surfaces: generated memory images, optional modules, readline, FFI,
      libffcall, architecture portability, and Lisp startup files.
    - >
      Its later unreleased 2.50 notes explicitly discuss distribution concerns such as
      memory-image compatibility options, which is exactly the kind of
      runtime/package-manager boundary that maintainers care about.
  project-history:
    - >
      CLISP began in Germany in 1987 with Bruno Haible and Michael Stoll; its own
      implementation notes describe the first version as an Atari ST system written in
      68000 assembly language and Common Lisp. Bruno Haible remained the original
      long-time maintainer, and Sam Steingold became a co-maintainer in 1998.
    - >
      The project became a portable GPL implementation in the early 1990s, with release
      2.1 shipping source for Atari ST, Amiga, DOS, OS/2, and Unix systems. Its official
      notes trace a long sequence of 2.x releases that added CLOS, modules, Unicode
      work, FFI improvements, POSIX interfaces, GNU build-system alignment, and
      experimental thread support.
  related-projects:
    - >
      Related Common Lisp implementations include SBCL, CMUCL, ECL, GNU CL, and Clozure
      CL. Related CLISP-adjacent tools include SLIME and ILISP for editor integration,
      GNU libffcall for FFI support, and the Common Lisp HyperSpec as the language
      reference.
  sources:
    - https://clisp.sourceforge.io/
    - https://clisp.sourceforge.io/impnotes.html
    - https://clisp.sourceforge.io/impnotes/clisp.html
    - https://gitlab.com/gnu-clisp/clisp
  summary:
    - >
      GNU CLISP is an ANSI Common Lisp implementation that provides an interpreter,
      compiler, debugger, command-line REPL, bytecode compilation, scripting support,
      and a broad set of implementation extensions.
  timeline:
    - '1987: CLISP project starts with Bruno Haible and Michael Stoll.'
    - '1992: Release 2.0 announced for Linux binaries.'
    - '1993: Release 2.1 becomes the first portable GPL source release.'
    - '1998: Sam Steingold becomes co-maintainer.'
    - '2007: Release 2.43 aligns the build process with GNU standards.'
    - >
      2010: Version 2.49 is released and documented as the current stable release on the
      official homepage.
    - '2018: The official GitLab project is created for GNU CLISP source and wiki.'
  usage:
    - >
      Users run `clisp` interactively as a Common Lisp REPL, compile Lisp files to
      portable bytecode with `-c`, execute expressions with `-x`, or use Lisp files as
      scripts. The manual documents `~/.clisprc.lisp` and `~/.clisprc.fas` as startup rc
      files and `-norc` to suppress them.
    - >
      The companion `clisp-link` executable is used for linking modules, while CLISP
      itself is often used with Emacs, SLIME, ILISP, and shell-style scripting
      workflows.
related-packages:
  - id: brew:sbcl
    reason: >
      Choose SBCL when native-code performance and its optimizing compiler are more
      important than CLISP's bytecode-oriented portability and lightweight scripting
      workflow.
    rel: alternative
    sources:
      - https://clisp.sourceforge.io/
      - https://www.sbcl.org/
      - https://www.sbcl.org/history.html
category: language-runtime
package-manager:
  apk: clisp
  brew: clisp
  debian: clisp
  dnf: clisp
  macports: clisp
  nix: clisp
  pacman: clisp
  ubuntu: clisp
  zypper: clisp
package-manager-url: https://formulae.brew.sh/formula/clisp
license: GPL-2.0-or-later
tags:
  - cli
  - common-lisp
  - compiler
  - gnu
  - interpreter
  - lisp
description: GNU CLISP, a Common Lisp implementation
executables:
  - clisp
  - clisp-link
provenance:
  formula: clisp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
