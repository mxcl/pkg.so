id: brew:cppunit
display-name: CppUnit
homepage: https://wiki.freedesktop.org/www/Software/cppunit/
repo: https://cgit.freedesktop.org/libreoffice/cppunit
docs:
  - https://people.freedesktop.org/~mmohrhard/cppunit
  - https://wiki.freedesktop.org/www/Software/cppunit
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CppUnit became a conventional packaged dependency for C and C++ projects that
      wanted xUnit-style tests without bundling a framework. Its source distribution and
      release tarballs are exposed from the freedesktop.org/LibreOffice infrastructure,
      and the package is distributed by Homebrew and major Unix-like package managers in
      the input package metadata.
  package-nerd-significance:
    - >
      CppUnit matters to package maintainers because it is both a library and a test
      dependency: downstream builds often need the headers and library for test suites,
      while the installed package may also expose utilities such as DllPlugInTester.
  project-history:
    - >
      The official Doxygen documentation traces CppUnit to Michael Feathers' first C++
      port of JUnit, followed by Jerome Lacoste's Unix/Solaris port. The CppUnit project
      combined and extended those earlier efforts rather than starting as an isolated
      implementation.
    - >
      The freedesktop.org project page describes the current project as a continuation
      of the original CppUnit project and hosts source access, release tarballs, and
      contribution instructions under the LibreOffice/freedesktop infrastructure.
  related-projects:
    - JUnit supplied the model for CppUnit's xUnit-style testing approach.
    - >
      LibreOffice/freedesktop.org provide the current project hosting and release
      infrastructure.
  sources:
    - https://people.freedesktop.org/~mmohrhard/cppunit/
    - https://wiki.freedesktop.org/www/Software/cppunit/
    - https://formulae.brew.sh/formula/cppunit
  summary:
    - >
      CppUnit is a C++ unit-testing framework modeled on JUnit. Its official
      documentation describes it as the C++ port of JUnit and points users to
      cookbook-style examples and generated API documentation.
  timeline:
    - 'Early project: Michael Feathers produced the first C++ port of JUnit.'
    - 'Early project: Jerome Lacoste provided a Unix/Solaris port.'
    - >
      Freedesktop era: the project continued under freedesktop.org with
      LibreOffice-associated source hosting and release tarballs.
  usage:
    - >
      The framework is used to define C++ unit tests, run them through command-line or
      GUI-oriented runners, and emit XML test output for automated test systems.
related-packages: []
