id: brew:gupnp
display-name: GUPnP
homepage: https://gitlab.gnome.org/GNOME/gupnp
repo: https://gitlab.gnome.org/GNOME/gupnp
docs:
  - https://gnome.pages.gitlab.gnome.org/gupnp/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GUPnP is packaged across Homebrew, Alpine, Debian/Ubuntu GIR packages, Fedora,
      MacPorts, Nix, Arch, and openSUSE because it is a shared library used by GNOME and
      media/networking applications rather than a single end-user program.
    - >
      Its adoption is coupled to GSSDP, GUPnP AV, GUPnP DLNA, and GUPnP Tools.
      Distributions often split runtime libraries, introspection bindings,
      documentation, and tool packages so applications and developers can depend on the
      minimum needed pieces.
  package-nerd-significance:
    - >
      GUPnP matters to package maintainers because it is a classic shared-library stack
      with ABI/API versioning, GIR bindings, documentation, and companion tools. A small
      version bump can affect media sharing, device discovery, and GNOME networking
      tools across a distribution.
    - >
      It is also a case study in replacing a lower-level C networking library with a
      GLib-native abstraction that fits desktop event loops and language bindings.
  project-history:
    - >
      The README says GUPnP was born from frustration with libupnp and its threading
      model. GUPnP chose a single-threaded asynchronous design integrated with the GLib
      main loop, aiming to provide libupnp's feature set while hiding much of the UPnP
      protocol machinery behind object-oriented APIs.
    - >
      The framework is built from GSSDP for SSDP discovery and announcement plus GUPnP
      for the UPnP protocol layers. It intentionally leaves higher-level standardized
      resources, such as MediaServer helpers, to companion libraries including GUPnP AV
      and related projects.
    - >
      GNOME release and Git history show GUPnP as a long-lived networking library: the
      repository has a gupnp-0.10 tag from May 2008, the GNOME archive contains 0.x
      tarball lines, 1.0.0 was published in September 2016, and the 1.6 branch moved the
      stack through libsoup3-era maintenance.
  related-projects:
    - GSSDP provides SSDP discovery and announcement using GObject.
    - GUPnP AV provides helper objects for UPnP A/V profiles.
    - GUPnP DLNA provides DLNA-oriented helpers around media metadata and profiles.
    - GUPnP Tools packages utilities and sample control points for testing GUPnP networks.
    - >
      libsoup provides HTTP handling, and GLib/GObject provide the object system and
      main loop.
  sources:
    - https://download.gnome.org/sources/gupnp/
    - https://download.gnome.org/sources/gupnp/1.0/
    - https://gitlab.gnome.org/GNOME/gupnp
    - https://gitlab.gnome.org/GNOME/gupnp/-/raw/master/NEWS
    - https://gitlab.gnome.org/GNOME/gupnp/-/raw/master/README.md
    - https://gnome.pages.gitlab.gnome.org/gupnp/docs/
    - https://gnome.pages.gitlab.gnome.org/gupnp/docs/client-tutorial.html
    - https://gnome.pages.gitlab.gnome.org/gupnp/docs/server-tutorial.html
  summary:
    - >
      GUPnP is GNOME's GObject-based framework for creating UPnP devices and control
      points. It wraps resource discovery, device description, control, eventing,
      presentation, and HTTP integration behind GLib-friendly C APIs.
  timeline:
    - '2008: gupnp-0.10 tag appears in the GNOME repository.'
    - '2011: GNOME release archive hosts 0.x GUPnP tarball directories.'
    - '2016: GUPnP 1.0.0 appears in the GNOME release archive.'
    - '2022: 1.6.0 NEWS records a stable re-release of the 1.5.4 development line.'
    - >
      2024: 1.6-series NEWS records fixes around IPv6 handling, NetworkManager contexts,
      introspection, and libsoup/libxml compatibility.
    - '2026: 1.6-series NEWS records GSSDP requirement and IPv6 host-header validation fixes.'
  usage:
    - >
      Developers use GUPnP to implement devices and control points that discover UPnP
      services, fetch device descriptions, invoke service actions, subscribe to events,
      and expose devices on the network. The official documentation includes both client
      and server tutorials.
    - >
      The Homebrew formula exposes `gupnp-binding-tool-1.6`, but the package's main
      value is library and introspection support for applications using the GUPnP API.
related-packages:
  - id: brew:gupnp-tools
    reason: >
      Install GUPnP Tools alongside the library when you need ready-made control points,
      discovery probes, event inspection, uploads, and sample devices for testing a
      GUPnP network.
    rel: adjacent_workflow
    sources:
      - https://gnome.pages.gitlab.gnome.org/gupnp/docs/
      - https://gitlab.gnome.org/GNOME/gupnp-tools#readme
category: networking
package-manager:
  apk: gupnp
  brew: gupnp
  debian: gir1.2-gupnp-1.6
  dnf: gupnp
  macports: gupnp
  pacman: gupnp
  ubuntu: gir1.2-gupnp-1.6
  zypper: gupnp-doc
