id: cask:lab421/tap/forel
display-name: Forel
homepage: https://github.com/lab421/forel
repo: https://github.com/lab421/forel
docs:
  - https://forel-app.github.io/
  - https://github.com/lab421/forel#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Forel is distributed as a signed and notarized macOS application and through
      Homebrew. Universal releases support both Apple Silicon and Intel Macs.
    - >
      The project presents itself as an open-source, on-device alternative to Hazel for
      an established macOS folder-automation workflow.
  package-nerd-significance:
    - >
      Forel brings a package-managed, open-source option to a macOS automation niche
      dominated by proprietary utilities. Its native rule engine, FSEvents watcher,
      SQLite persistence, scripts, Shortcuts support, and local-only processing are
      particularly relevant to Mac automation enthusiasts.
  project-history:
    - >
      Forel began its public release series in June 2026. After initial Tauri-based
      alphas, the application was rewritten in SwiftUI and AppKit with a Swift core,
      SQLite persistence, and an FSEvents-based watcher.
    - >
      Version 1.0.0 marked the transition from beta to stable status. Subsequent
      releases added OCR, native media-library imports, archive extraction,
      notifications, universal binaries, and reliability improvements.
  related-projects:
    - >
      Hazel is the proprietary macOS folder-automation utility that Forel identifies as
      its principal alternative.
    - >
      Forel can invoke macOS Shortcuts and custom scripts and can work with Finder tags
      and the Photos, Music, and TV libraries.
  sources:
    - https://forel-app.github.io/
    - https://github.com/lab421/forel#readme
    - https://github.com/lab421/forel/blob/main/CHANGELOG.md
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Forel is an open-source macOS application that watches folders and applies
      user-defined conditions and actions to matching files. Processing and rule history
      remain on the Mac.
  timeline:
    - '2026-06-15: Forel published its first tagged alpha release.'
    - '2026-06-17: The active application was rewritten as a native Swift application.'
    - '2026-06-21: Version 1.0.0 marked the transition out of beta.'
    - >
      2026-07: Signed, notarized, universal releases broadened conventional macOS
      distribution.
  usage:
    - >
      Users select watched folders, define ordered conditions based on properties such
      as names, extensions, sizes, dates, tags, labels, or contents, and attach actions
      such as move, copy, rename, tag, trash, script, or Shortcut execution.
    - >
      Rules can run automatically or on demand. Dry Run previews changes, while activity
      history records completed work and supports undo where the action is reversible.
related-packages:
  - id: cask:hazel
    reason: >
      Choose Hazel for the established commercial Mac automation product; choose Forel
      when open source, on-device operation, and a free tier are more important.
    rel: alternative
    sources:
      - https://forel-app.github.io/
      - https://www.noodlesoft.com/manual/hazel/hazel-overview/
