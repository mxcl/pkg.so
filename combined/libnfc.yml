id: brew:libnfc
display-name: libnfc
homepage: https://github.com/nfc-tools/libnfc
repo: https://github.com/nfc-tools/libnfc
docs:
  - https://github.com/nfc-tools/libnfc#readme
  - https://nfc-tools.github.io/projects/libnfc
config-file-location:
  unix:
    - /etc/nfc/libnfc.conf
    - /etc/nfc/devices.d/*.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      libnfc became a familiar dependency for desktop and embedded NFC experimentation
      because it supports inexpensive PN53x-class hardware, PC/SC readers, MIFARE
      Classic, FeliCa, ISO/IEC 14443 A/B, Jewel/Topaz, and peer-to-peer data exchange
      modes.
  package-nerd-significance:
    - >
      Package maintainers care about libnfc because it is where hardware access,
      udev/devd rules, USB libraries, PC/SC integration, and optional drivers all meet.
      It is also a hub for the nfc-tools ecosystem, with nearby projects such as
      libfreefare, libllcp, libndef, mfcuk, mfoc, and pam_nfc.
  project-history:
    - >
      The README identifies libnfc as a Free/Libre Near Field Communication library and
      credits early historical contributors including Roel Verdult in 2009, Romuald
      Conty from 2009-2015, Romain Tartiere from 2010-2012, Philippe Teuwen from
      2010-2013, and Ludovic Rousseau from 2012-2013.
    - >
      The project moved its official development center to GitHub after older web and
      forum sites disappeared. The nfc-tools project page describes broad
      operating-system support across GNU/Linux, Mac OS X, Windows, and POSIX-style
      builds.
  related-projects:
    - >
      Related nfc-tools projects include libfreefare, libllcp, libndef, mfcuk, mfoc,
      nfc-eventd, nfcutils, and pam_nfc.
    - >
      Hardware and protocol dependencies named by the project include libusb, pcsc-lite,
      PN53x devices, PC/SC readers, MIFARE Classic, and FeliCa.
  sources:
    - https://github.com/nfc-tools/libnfc
    - https://github.com/nfc-tools/libnfc/blob/master/ChangeLog
    - https://nfc-tools.github.io/projects/libnfc/
  summary:
    - >
      libnfc is the nfc-tools C library for user-space access to NFC devices. It targets
      low-level reader and tag work rather than a single application workflow, exposing
      reader, initiator, and target features through a portable API and companion
      command-line tools.
  timeline:
    - >
      2009: README copyright notes identify Roel Verdult and Romuald Conty among the
      early libnfc contributors.
    - >
      2015: The nfc-tools project page identified GitHub as the code host and listed
      related nfc-tools projects.
    - >
      2020-05-21: libnfc 1.7.2 was released, with the changelog warning it was
      incompatible with 1.7.1.
    - >
      2020-05-22: libnfc 1.8.0 restored enum ordering compatibility and bumped the
      library version to 6.0.0.
  usage:
    - >
      The package ships many small diagnostic and manipulation tools, including
      nfc-list, nfc-poll, nfc-scan-device, nfc-mfclassic, nfc-mfultralight, and pn53x
      utilities. Official configuration examples use /etc/nfc/libnfc.conf and per-device
      files under /etc/nfc/devices.d when built with sysconfdir=/etc.
related-packages:
  - id: brew:libfreefare
    reason: >
      Use libfreefare above libnfc when an application needs a higher-level C API for
      MIFARE and other supported RFID card operations rather than raw reader access.
    rel: adjacent_workflow
    sources:
      - https://nfc-tools.github.io/
      - https://github.com/nfc-tools/libfreefare
  - id: brew:pcsc-lite
    reason: >
      Use pcsc-lite alongside libnfc when accessing compatible readers through libnfc's
      PC/SC driver instead of a direct USB driver.
    rel: adjacent_workflow
    sources:
      - https://github.com/nfc-tools/libnfc/blob/master/README.md
      - https://pcsclite.apdu.fr/
category: networking
package-manager:
  apk: libnfc
  brew: libnfc
  debian: libnfc-bin
  dnf: libnfc
  macports: libnfc
  nix: libnfc
  pacman: libnfc
  ubuntu: libnfc-bin
  zypper: libnfc-devel
package-manager-url: https://formulae.brew.sh/formula/libnfc
license: LGPL-3.0-or-later
