id: brew:libxo
display-name: libxo
homepage: https://juniper.github.io/libxo/libxo-manual.html
repo: https://github.com/Juniper/libxo
docs:
  - https://juniper.github.io/libxo/libxo-manual.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FreeBSD's adoption gave libxo a practical audience: base utilities could keep
      human-readable output while adding JSON, XML, or HTML modes for scripts and
      automation. The package is also available outside FreeBSD for projects that want
      the same structured-output model.
  package-nerd-significance:
    - >
      libxo matters because it is a concrete answer to the long-running Unix problem of
      parsing human text with fragile awk and sed pipelines. It represents the
      package-manager-adjacent push toward structured CLI output without abandoning
      traditional command output.
  project-history:
    - >
      The project README explains the central idea: applications call xo_emit with field
      descriptors, and the selected output style is chosen at runtime. GitHub tag
      metadata places the 0.1.0 tag at a commit dated 2014-07-30.
    - >
      The FreeBSD manual page records Phil Shafer as author and says the library was
      added in FreeBSD 11.0. That adoption moved libxo from a standalone library into
      the base-system conversation about machine-readable command output.
  related-projects:
    - >
      FreeBSD base utilities are the most visible related ecosystem. jq and other
      JSON-processing tools are common downstream companions when libxo-enabled commands
      emit JSON.
  sources:
    - >
      https://api.github.com/repos/Juniper/libxo/commits/a9a27bd4587282e27e108b1d4f3f4cbf2b67ba57
    - https://github.com/Juniper/libxo
    - https://juniper.github.io/libxo/libxo-manual.html
    - https://man.freebsd.org/cgi/man.cgi?query=libxo&sektion=3&manpath=FreeBSD+Ports+14.2
    - https://raw.githubusercontent.com/Juniper/libxo/develop/README.md
  summary:
    - >
      libxo is a C library from Juniper for emitting traditional text, XML, JSON, and
      HTML from one set of output calls. It is best known in package culture through
      FreeBSD's structured-output work.
  timeline:
    - '2014: The 0.1.0 GitHub tag points to a commit dated 2014-07-30.'
    - '2014: The FreeBSD Ports manual page date for libxo(3) is 2014-12-08.'
    - '2016: FreeBSD 11.0 included libxo according to the FreeBSD manual page.'
    - >
      2020s: libxo remains packaged for Homebrew, FreeBSD ports, and multiple Unix-like
      distributions.
  usage:
    - >
      Users generally encounter libxo through commands that accept a libxo output mode
      or through the xo utility family. Developers use the library when they want one
      formatting path to serve terminal text and structured data consumers.
related-packages: []
