id: brew:git-sizer
display-name: git-sizer
homepage: https://github.com/github/git-sizer
repo: https://github.com/github/git-sizer
docs:
  - https://github.com/github/git-sizer#readme
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
    - ~/.config/git/config
    - /etc/gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      git-sizer has stronger ecosystem reach than most small Git extensions because it
      comes from the GitHub organization and is packaged across Homebrew, Chocolatey,
      Debian, Ubuntu, Arch, MacPorts, Nix, Scoop, and winget. That spread reflects its
      role as an operations tool for maintainers, enterprise source-control teams, and
      migration projects rather than a daily porcelain command for every developer.
  package-nerd-significance:
    - >
      Package maintainers care about git-sizer because source archives, fetch times,
      build farms, mirrors, and monorepo migrations all suffer when repository topology
      gets pathological. It gives a repeatable vocabulary for discussing repository
      health without requiring a custom Git forensics script.
  project-history:
    - >
      The GitHub repository began in early 2018 and published v1.0.0 in March 2018. The
      README presents the tool as a practical diagnostic for repositories that have
      outgrown Git's comfortable operating range, with checks for large object sets,
      huge blobs, many references, deep histories, giant trees, long paths, and unusual
      tag or merge structures.
    - >
      The project evolved as a Go utility that shells out to Git and reports both
      human-readable tables and machine-readable JSON. Later releases continued to
      refine the metric set and output behavior while keeping the core purpose stable:
      make repository bloat visible before it turns into slow clones, fetches, repacks,
      garbage collection, and history traversal.
  related-projects:
    - >
      The README points users toward Git LFS and git-annex for large assets and toward
      Git's own maintenance commands when interpreting the cost of repository size.
  sources:
    - https://formulae.brew.sh/formula/git-sizer
    - https://github.com/github/git-sizer
    - https://github.com/github/git-sizer/blob/master/README.md
    - https://github.com/github/git-sizer/releases
  summary:
    - >
      git-sizer is a GitHub-authored command-line analyzer that measures repository size
      and shape, then flags characteristics that make Git operations slow, expensive, or
      inconvenient.
  timeline:
    - '2018: GitHub repository and initial implementation appeared.'
    - '2018: v1.0.0 release published.'
    - '2021: v1.4.0 and v1.5.0 releases expanded the maintained release line.'
  usage:
    - >
      Practitioners run git-sizer inside a full, non-shallow clone to get concern-ranked
      metrics, often using --verbose for a complete inventory or --json for automation.
      The output points maintainers toward remedies such as removing generated files,
      moving binary assets to Git LFS or git-annex, pruning excess refs, splitting
      subprojects, or reshaping directories.
related-packages:
  - id: brew:git-filter-repo
    reason: >
      Use git-filter-repo after git-sizer identifies unwanted or oversized historical
      content that must be removed or transformed through a repository rewrite.
    rel: adjacent_workflow
    sources:
      - https://github.com/github/git-sizer#readme
      - https://github.com/newren/git-filter-repo#readme
  - id: brew:git-lfs
    reason: >
      Use Git LFS to keep future large binary content outside ordinary Git object
      storage when git-sizer reveals blob-driven repository growth.
    rel: adjacent_workflow
    sources:
      - https://github.com/github/git-sizer#readme
      - https://git-lfs.com/
  - id: brew:git-annex
    reason: >
      Use git-annex for large assets whose content should be distributed among multiple
      stores while Git continues tracking filenames and availability metadata.
    rel: adjacent_workflow
    sources:
      - https://github.com/github/git-sizer#readme
      - https://git-annex.branchable.com/
category: developer-tools
package-manager:
  apk: git-sizer
  brew: git-sizer
  debian: git-sizer
  macports: git-sizer
  nix: git-sizer
  pacman: git-sizer
  scoop: main/git-sizer
  ubuntu: git-sizer
  winget: GitHub.git-sizer
package-manager-url: https://formulae.brew.sh/formula/git-sizer
license: MIT
tags:
  - cli
  - git
  - metrics
  - repository-analysis
description: Compute various size metrics for a Git repository
executables:
  - git-sizer
provenance:
  formula: git-sizer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
