id: brew:disktype
display-name: disktype
homepage: https://disktype.sourceforge.net/
repo: https://sourceforge.net/p/disktype/disktype
docs:
  - https://disktype.sourceforge.net/
  - https://disktype.sourceforge.net/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project page explicitly invited distribution packagers and noted Debian, Fink,
      and OpenCSW packaging. Later package-manager records in the input show continued
      availability through Homebrew, Debian, Fedora, MacPorts, and Ubuntu, which fits
      its role as a small storage-forensics helper rather than a frequently changing
      application.
  package-nerd-significance:
    - >
      For package nerds, disktype is a fossil from the SourceForge-era Unix utility
      ecosystem: a tiny C program, versioned tarballs, CVS-era project hosting, and
      enough utility to remain packaged long after its most active release period.
  project-history:
    - >
      The upstream SourceForge site presents disktype as a self-contained C program
      intended to compile on modern Unix-like systems without special libraries in the
      common case. The project distributed numbered source tarballs on SourceForge, with
      the public file feed showing releases from version 1 in February 2003 through
      version 9 in June 2006.
  related-projects:
    - >
      Related tools include `file` for general magic-based identification,
      filesystem-specific inspection tools, and recovery-oriented utilities such as the
      gpart-style tools linked from the upstream site.
  sources:
    - https://disktype.sourceforge.net/
    - https://disktype.sourceforge.net/doc/
    - https://sourceforge.net/projects/disktype/rss?path=/disktype
    - https://sourceforge.net/p/disktype/disktype/
    - https://formulae.brew.sh/formula/disktype
  summary:
    - >
      disktype is an older C utility for identifying the content format of a disk or
      disk image by checking signatures for filesystems, partition tables, boot code,
      archives, compression formats, and disk image formats. It belongs to the toolbox
      tradition of small Unix inspection commands that answer one storage question
      clearly.
  timeline:
    - '2003-02: version 1 source tarball published'
    - '2003-2006: official documentation copyright range'
    - '2006-06: version 9 source tarball published'
  usage:
    - >
      disktype is used when a user has a block device, image file, or recovered blob and
      wants a fast guess at the structures inside it. The official documentation
      emphasizes both command usage and background notes on recognized formats, making
      it useful as a practical detector and a reference for interpreting output.
related-packages:
  - id: brew:file-formula
    reason: >
      Choose file when the main task is broad magic-number identification of ordinary
      files and MIME-like content rather than disktype's deeper focus on disks,
      partition tables, boot code, and filesystem images.
    rel: alternative
    sources:
      - https://disktype.sourceforge.net/
      - https://github.com/file/file
category: system
package-manager:
  brew: disktype
  debian: disktype
  dnf: disktype
  macports: disktype
  ubuntu: disktype
package-manager-url: https://formulae.brew.sh/formula/disktype
license: MIT
tags:
  - cli
  - disk-image
  - filesystem
  - format-detection
  - storage
  - unix
description: Detect content format of a disk or disk image
executables:
  - disktype
provenance:
  formula: disktype
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
