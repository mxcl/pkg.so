id: brew:librist
display-name: librist
homepage: https://code.videolan.org/rist/
repo: https://code.videolan.org/rist/librist
docs:
  - https://code.videolan.org/rist/librist
  - https://code.videolan.org/rist/librist/-/wikis/LibRIST%20Documentation
  - https://code.videolan.org/rist/librist/-/wikis/pages
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      RIST adoption is tied to broadcast and live-video transport needs: interoperable
      ARQ over UDP, packet-loss recovery, jitter removal, link bonding, encryption,
      tunnelling, and multi-vendor testing. The RIST Forum describes commercial
      deployments and VSF activity-group development, while librist gives implementers a
      permissively licensed codebase to embed in products and open source tools.
    - >
      Package-manager adoption matters because RIST tooling often lives inside media
      pipelines rather than desktop apps. Installing librist provides command-line
      endpoints and a development library that can be used by encoders, relays,
      VLC-related builds, monitoring stacks, and broadcast automation.
  package-nerd-significance:
    - >
      librist is package-nerd significant because it packages a broadcast-networking
      standard as small Unix-style tools and a reusable C library. It is especially
      interesting to media packagers because it is permissively licensed unlike many
      VideoLAN projects, has no external runtime dependencies beyond core OS libraries,
      and sits near VLC, FFmpeg/GStreamer-style media stacks, and VSF interoperability
      work.
  project-history:
    - >
      The VideoLAN project metadata records the librist repository as created on
      September 19, 2019 and describes it as a library for adding the RIST protocol to
      applications. The README states that the code is written to comply with VSF
      TR-06-1, TR-06-2, and TR-06-3, and that the canonical repository URL is the
      VideoLAN GitLab project.
    - >
      The RIST Forum announced public availability of libRIST 2.1.2 on March 24, 2020,
      describing it as a library plus sample calling programs implementing the RIST
      protocol and supporting Simple Profile and the then-forthcoming Main Profile.
      Later VideoLAN release metadata shows the 0.2.x line adding tools such as
      risttunnel and udp2udp, YAML configuration support, Prometheus metrics, TUN
      forwarding, and Advanced Profile work.
  related-projects:
    - >
      Related projects include the RIST Forum, Video Services Forum TR-06
      specifications, VLC, SRT, RTP/UDP media transport, SMPTE 2022 workflows, GStreamer
      RIST support, and Wireshark protocol analysis.
  sources:
    - https://code.videolan.org/api/v4/projects/rist%2Flibrist
    - https://code.videolan.org/api/v4/projects/rist%2Flibrist/releases?per_page=100
    - >
      https://code.videolan.org/api/v4/projects/rist%2Flibrist/repository/files/README.md/raw?ref=master
    - https://code.videolan.org/api/v4/projects/rist%2Flibrist/repository/tags?per_page=20
    - https://code.videolan.org/rist/librist
    - >
      https://www.rist.tv/news/2020/3/24/the-rist-forum-and-sipradius-make-rist-publicly-available
    - https://www.rist.tv/why-rist
  summary:
    - >
      librist is a C library and CLI tool set for Reliable Internet Stream Transport,
      the VSF TR-06 family of specifications for low-latency reliable media over
      unmanaged networks. Its package role is to make RIST available as a reusable
      library plus practical send, receive, relay, tunnel, and password-helper commands.
  timeline:
    - '2019-09-19: VideoLAN GitLab project created.'
    - '2020-03-24: RIST Forum and SipRadius announced public availability of libRIST 2.1.2.'
    - '2024-11-15: v0.2.11 tag created in the VideoLAN repository.'
    - >
      2026-04-18: v0.2.12 release added risttunnel, udp2udp, YAML configuration, TUN
      support, and related tooling.
    - >
      2026-05-31: v0.2.17 release added Advanced Profile support and multicast/transport
      improvements.
    - '2026-06-22: v0.2.18 release added Advanced/Main interoperability and related fixes.'
  usage:
    - >
      The README lists ristsender, ristreceiver, rist2rist, udp2udp, risttunnel,
      ristsrppasswd, and a Prometheus exporter. Typical use is sending, receiving,
      relaying, or tunnelling UDP media streams with RIST recovery and optional security
      features.
related-packages:
  - id: brew:ffmpeg
    reason: >
      FFmpeg's documented `rist` network protocol is implemented through librist, so the
      two packages form a direct workflow for encoding, muxing, sending, and receiving
      RIST media streams.
    rel: adjacent_workflow
    sources:
      - https://ffmpeg.org/ffmpeg-protocols.html
      - https://ffmpeg.org/doxygen/trunk/librist_8c.html
category: networking
