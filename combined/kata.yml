id: brew:kata
display-name: kata
homepage: https://katatracker.com
repo: https://github.com/kenn-io/kata
docs:
  - https://www.katatracker.com/
  - https://www.katatracker.com/reference/cli
  - https://www.katatracker.com/reference/configuration
config-file-location:
  unix:
    - <workspace>/.kata.toml
    - <workspace>/.kata.local.toml
    - ~/.kata/config.toml
  windows:
    - <workspace>/.kata.toml
    - <workspace>/.kata.local.toml
    - '%USERPROFILE%\.kata\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      kata is distributed as a single Go binary through Homebrew, release archives, Go
      installation, and Linux DEB and RPM packages. Its local-first design targets
      individual developers and coding agents, while optional remote-daemon,
      GitHub-sync, PostgreSQL, and federation facilities extend it to shared workflows.
    - >
      The project remained explicitly pre-1.0 during its early releases. Upstream states
      that releases preserve backward compatibility beginning with version 0.14.0.
  package-nerd-significance:
    - >
      kata is notable for treating agent work as durable local package-managed state
      rather than chat context or repository-resident task files. A small, secret-free
      workspace binding is committed, while the SQLite ledger stays under the user's
      kata data directory.
    - >
      Its design occupies an emerging niche between conventional issue trackers and
      agent orchestration: predictable JSON and agent-oriented output, idempotent
      creation, claims, evidence-bearing closes, and an MCP server are exposed from one
      local binary.
  project-history:
    - >
      Kenn Software developed kata as a local-first issue tracker for coding agents and
      the humans supervising them. The daemon owns a SQLite event ledger, while CLI,
      terminal UI, browser UI, hooks, and integrations operate on the same data.
    - >
      Versioned changelog entries begin at 0.5.0; earlier development is recorded as a
      retrospective weekly project history. Later releases added remote daemons,
      federation, PostgreSQL, GitHub synchronization, semantic search, browser
      supervision, embedding as a Go service, and native MCP support.
  related-projects:
    - GitHub Issues
    - Linear
    - Jira
    - ClickUp
    - Beads
    - git-bug
    - Model Context Protocol
  sources:
    - https://github.com/kenn-io/kata
    - https://www.katatracker.com/
    - https://www.katatracker.com/changelog/
    - https://www.katatracker.com/reference/configuration/
  summary:
    - >
      kata is a local-first issue tracker and task ledger designed for coding agents and
      human supervisors, with CLI, terminal, browser, daemon, and federation workflows.
  timeline:
    - '2026: Early project history was recorded as weekly development entries.'
    - '2026: Versioned releases began with 0.5.0.'
    - '2026-08: The 0.14 release line established the documented backward-compatibility policy.'
  usage:
    - >
      A typical workflow initializes a workspace with `kata init`, creates and lists
      issues from the CLI, claims work, and closes verified work with a message and
      evidence. Humans can supervise the same ledger through `kata tui` or `kata ui`.
    - >
      By default kata auto-starts a local daemon and stores its SQLite database under
      `KATA_HOME`, which defaults to `~/.kata`. Teams can instead configure remote
      daemons, PostgreSQL, GitHub sync, or federation.
related-packages:
  - id: brew:beads
    reason: >
      Beads solves the same agent-oriented durable-task-ledger problem but keeps project
      state in a Dolt database with native branching and push/pull, whereas kata uses a
      user-local daemon and SQLite with only a small repository binding.
    rel: alternative
    sources:
      - https://www.katatracker.com/guide/migrating-from-beads/
      - https://gastownhall.github.io/beads/
category: developer-tools
package-manager:
  brew: kata
package-manager-url: https://formulae.brew.sh/formula/kata
license: MIT
tags:
  - agents
  - cli
  - federation
  - go
  - issue-tracker
  - local-first
  - mcp
  - sqlite
  - terminal-ui
  - tui
description: Local-first, federated issue tracker for humans and coding agents
executables:
  - kata
provenance:
  formula: kata
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
