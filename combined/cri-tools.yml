id: brew:cri-tools
display-name: cri-tools
homepage: https://github.com/kubernetes-sigs/cri-tools
repo: https://github.com/kubernetes-sigs/cri-tools
docs:
  - https://github.com/kubernetes-sigs/cri-tools/blob/master/docs/crictl.md
  - https://github.com/kubernetes-sigs/cri-tools/blob/master/docs/critest.md
  - https://github.com/kubernetes-sigs/cri-tools#readme
config-file-location:
  unix: /etc/crictl.yaml
  windows: '%USERPROFILE%\.crictl\crictl.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      crictl and critest became general-availability tools in the v1.11 era according to
      their official docs. The project is maintained under kubernetes-sigs and points
      users to Kubernetes SIG Node community channels, which made it part of the normal
      Kubernetes runtime-development workflow rather than a third-party diagnostic
      utility.
  package-nerd-significance:
    - >
      For package maintainers, cri-tools matters because it is version-skew sensitive:
      the official README recommends matching the cri-tools and Kubernetes minor
      versions. It is also a canonical example of a Kubernetes-adjacent package where
      the CLI binary is operationally useful but its version policy follows a larger
      platform's release cadence.
  project-history:
    - >
      The project grew around Kubernetes' Container Runtime Interface, the gRPC plugin
      interface that lets kubelet work with different container runtimes without
      recompiling cluster components. Its README describes the scope narrowly: debugging
      and validation tools for kubelet CRI, not a user-facing container runtime or a
      replacement orchestration layer.
    - >
      The compatibility matrix ties cri-tools minor versions to Kubernetes minor
      versions, with v0.1 aligned to Kubernetes 1.7 and later 1.x releases tracking
      Kubernetes release branches. That version coupling is central to how distributions
      package it, because CRI features can diverge between Kubernetes and cri-tools
      minor versions.
  related-projects:
    - Kubernetes kubelet and cri-api define the runtime interface that cri-tools exercises.
    - containerd, CRI-O, and cri-dockerd are common CRI-compatible runtimes used with crictl.
  sources:
    - https://github.com/kubernetes-sigs/cri-tools#readme
    - https://github.com/kubernetes-sigs/cri-tools/blob/master/docs/crictl.md
    - https://github.com/kubernetes-sigs/cri-tools/blob/master/docs/validation.md
    - https://kubernetes.io/docs/concepts/containers/cri/
    - https://github.com/kubernetes-sigs/cri-tools/releases/tag/v0.1
  summary:
    - >
      cri-tools is the Kubernetes SIG Node companion project for Container Runtime
      Interface debugging and conformance tooling. It packages crictl for direct CRI
      interaction and critest for validation tests, making it useful to runtime
      implementers, cluster operators, and distribution maintainers who need a tool
      outside the kubelet itself.
  timeline:
    - '2017: v0.1 release published for the Kubernetes 1.7 compatibility line.'
    - '2018: crictl and CRI validation testing documented as GA since v1.11.0.'
    - >
      2020s: Project continues to follow Kubernetes minor release lines and ships crictl
      and critest archives from GitHub releases.
  usage:
    - >
      crictl is used to inspect, pull, run, stop, and debug containers and pod sandboxes
      through CRI-compatible runtimes such as containerd, CRI-O, and cri-dockerd.
      critest is used to verify that a runtime's CRI server implementation conforms to
      Kubernetes expectations without running full Kubernetes end-to-end tests.
related-packages:
  - id: brew:containerd
    reason: >
      Use containerd with cri-tools when operating or debugging Kubernetes workloads:
      containerd supplies the CRI runtime endpoint that crictl inspects and exercises.
    rel: adjacent_workflow
    sources:
      - https://github.com/kubernetes-sigs/cri-tools/blob/master/docs/crictl.md
      - https://github.com/containerd/containerd/blob/main/docs/getting-started.md
category: developer-tools
package-manager:
  apk: cri-tools
  brew: cri-tools
  dnf: cri-tools
  nix: cri-tools
  pacman: crictl
  zypper: cri-tools
package-manager-url: https://formulae.brew.sh/formula/cri-tools
license: Apache-2.0
tags:
  - cli
  - container-runtime-interface
  - containers
  - kubernetes
description: CLI and validation tools for Kubelet Container Runtime Interface (CRI)
executables:
  - crictl
  - critest
provenance:
  formula: cri-tools
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
