id: brew:depsguard
display-name: DepsGuard
homepage: https://depsguard.com
repo: https://github.com/arnica/depsguard
docs:
  - https://depsguard.com/
  - https://github.com/arnica/depsguard#readme
config-file-location:
  linux:
    - ~/.npmrc
    - ~/.config/pnpm/rc
    - ~/.config/pnpm/config.yaml
    - ~/.yarnrc.yml
    - $XDG_CONFIG_HOME/.bunfig.toml
    - ~/.config/uv/uv.toml
    - ~/.config/pip/pip.conf
    - ~/.config/pypoetry/config.toml
  macos:
    - ~/.npmrc
    - ~/Library/Preferences/pnpm/rc
    - ~/Library/Preferences/pnpm/config.yaml
    - ~/.yarnrc.yml
    - ~/.bunfig.toml
    - ~/.config/uv/uv.toml
    - ~/Library/Application Support/pip/pip.conf
    - ~/Library/Application Support/pypoetry/config.toml
  windows:
    - '%LOCALAPPDATA%\pnpm\config\rc'
    - '%LOCALAPPDATA%\pnpm\config\config.yaml'
    - '%APPDATA%\uv\uv.toml'
    - '%APPDATA%\pip\pip.ini'
    - '%APPDATA%\pypoetry\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Because DepsGuard is new, its official adoption record is still mostly packaging
      and distribution: prebuilt GitHub release binaries, Homebrew core, APT setup,
      crates.io, WinGet, and Scoop. That packaging breadth suggests the tool is meant
      for developer workstations as much as CI hardening checks.
  package-nerd-significance:
    - >
      For package nerds, DepsGuard is notable because it packages a cross-ecosystem
      security checklist into one binary. Its config table is a snapshot of how many
      different package managers have grown similar but incompatible concepts for
      cooldowns, script blocking, trust policy, and registry hardening.
  project-history:
    - >
      The official arnica/depsguard repository was created in 2026. The README presents
      DepsGuard as a single static Rust binary with no third-party Rust crate
      dependencies, built to scan npm, pnpm, yarn, bun, uv, pip, poetry, aube, Renovate,
      and Dependabot configs.
    - >
      The project website and README emphasize interactive scanning and fixing:
      DepsGuard reads known config locations, compares settings to recommended
      supply-chain defaults, previews diffs, writes backups, and can restore changes.
  related-projects:
    - >
      Related configuration surfaces include npm, pnpm, Yarn, Bun, uv, pip, Poetry,
      aube, Renovate, and Dependabot.
  sources:
    - https://depsguard.com/
    - https://github.com/arnica/depsguard#readme
    - https://api.github.com/repos/arnica/depsguard
  summary:
    - >
      DepsGuard is a young supply-chain hardening CLI that scans package-manager and
      dependency-bot configuration files for safer defaults. It focuses on release
      cooldowns, install-script risk, provenance-related settings, and other
      package-manager knobs that reduce exposure to dependency confusion and malicious
      fresh releases.
  timeline:
    - '2026: Official arnica/depsguard repository created.'
    - >
      2026: README documents Homebrew core, APT, crates.io, WinGet, and Scoop
      installation channels.
    - >
      2026: Website describes DepsGuard as a one-command scanner and fixer for
      package-manager security settings.
  usage:
    - >
      Users can run `depsguard` for an interactive TUI, `depsguard scan` for read-only
      reporting, or `depsguard restore` to roll back from backups. The tool searches
      user-level and repo-level package-manager configuration files, including
      `.github/dependabot.yml` and Renovate files, and only edits files after user
      approval.
related-packages:
  - id: brew:renovate
    reason: >
      Use Renovate to automate dependency-update pull requests, then let DepsGuard
      inspect its repository configuration for a minimum release-age policy that delays
      newly published versions.
    rel: adjacent_workflow
    sources:
      - https://depsguard.com/
      - https://docs.renovatebot.com/configuration-options/
      - https://docs.renovatebot.com/self-hosted-configuration/
  - id: brew:grype
    reason: >
      Run Grype to find known vulnerabilities in installed packages, filesystems,
      images, or SBOMs while DepsGuard separately reduces exposure to freshly published
      malicious releases before installation.
    rel: adjacent_workflow
    sources:
      - https://depsguard.com/
      - https://github.com/anchore/grype#readme
category: security
package-manager:
  brew: depsguard
  winget: Arnica.DepsGuard
package-manager-url: https://formulae.brew.sh/formula/depsguard
license: MIT
tags:
  - cli
  - dependency-security
  - hardening
  - package-manager
  - supply-chain-security
description: Harden package manager configs against supply chain attacks
executables:
  - depsguard
provenance:
  formula: depsguard
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
