id: brew:actions-up
display-name: Actions Up
homepage: https://github.com/azat-io/actions-up
repo: https://github.com/azat-io/actions-up
docs:
  - https://github.com/azat-io/actions-up#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README supports quick npx use, global npm installation, per-project dev
      dependency installation, and Homebrew installation, which puts it in the common
      JavaScript CLI plus package-manager distribution pattern.
  package-nerd-significance:
    - >
      It is notable in package-manager culture because it overlaps dependency-update
      bots while staying local and interactive: users can inspect updates, pin SHAs, and
      generate CI reports without adopting a hosted bot workflow.
  project-history:
    - >
      The project was created in August 2025 and released v0.1.0 the same day. Its
      README positions the tool around secure and reproducible CI by replacing mutable
      action tags with exact commit SHAs unless the user chooses to preserve tag-style
      references.
  related-projects:
    - The README compares Actions Up with Dependabot, Renovate, and pinact.
  sources:
    - GitHub repository and releases API for creation and release chronology.
    - Official README for project positioning, usage, install paths, and related tools.
  summary:
    - >
      Actions Up is an interactive CLI for finding newer GitHub Actions references in
      workflow and composite-action YAML, then updating them with SHA pinning by
      default.
  timeline:
    - '2025: Repository created.'
    - '2025: v0.1.0 release published.'
    - '2026: v1.15.0 release published on June 29.'
  usage:
    - >
      Actions Up scans .github/workflows, .github/actions, root action.yml/action.yaml
      files, and reusable workflow calls. Users can run interactive mode, --yes
      auto-update mode, --dry-run, --json report mode, recursive scans, custom
      directories, update modes, exclusions, and CI checks.
related-packages:
  - id: brew:pinact
    reason: >
      Choose pinact for a policy-oriented CLI that pins or validates Actions and
      reusable workflows non-interactively; choose Actions Up when interactive selection
      and explicit major-update warnings are preferable.
    rel: alternative
    sources:
      - https://github.com/azat-io/actions-up#why-actions-up
      - https://github.com/suzuki-shunsuke/pinact#readme
  - id: brew:renovate
    reason: >
      Choose Renovate when GitHub Actions updates should arrive automatically as
      configurable pull requests across repositories; Actions Up is better suited to
      local, explicitly reviewed CLI updates.
    rel: alternative
    sources:
      - https://github.com/azat-io/actions-up#why-actions-up
      - https://docs.renovatebot.com/modules/manager/github-actions/
category: developer-tools
package-manager:
  brew: actions-up
package-manager-url: https://formulae.brew.sh/formula/actions-up
license: MIT
tags:
  - ci
  - cli
  - dependency-updates
  - github-actions
  - security
  - sha-pinning
  - yaml
description: Tool to update GitHub Actions to latest versions with SHA pinning
executables:
  - actions-up
provenance:
  formula: actions-up
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
