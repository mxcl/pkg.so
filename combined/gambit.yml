history:
  adoption-history:
    - >
      Gambit has an academic adoption path: it is cited as a package for game-theoretic
      computation, appears in game-theory research, and exposes standard formats for
      storing and communicating games with external tools.
    - >
      The current documentation presents three user-facing surfaces: a Python API for
      programmatic use, a GUI for constructing and inspecting games, and command-line
      tools for scripting and integration. The input package facts show it packaged in
      Homebrew, Alpine, and Nix.
  package-nerd-significance:
    - >
      Gambit matters to package maintainers because it combines a scientific C++
      codebase, a GUI, a Python API, and many small CLI tools under one package name. It
      is the sort of domain package where executable naming, Python bindings, and
      long-lived academic release history all matter.
  project-history:
    - >
      The official history traces Gambit to game-analysis programs written by Richard
      McKelvey at Caltech in the mid-1980s. It began in BASIC, moved to C and the
      Borland Graphics Interface around 1990, and was publicly distributed as version
      0.13 in 1991 and 1992.
    - >
      Between 1994 and 1996, Gambit became a fuller package under National Science
      Foundation support, with Andrew McLennan involved and Theodore Turocy joining as
      principal developer. The project was rewritten in C++, became cross-platform, and
      used wxWidgets for its graphical interface.
    - >
      Later development added and reorganized interfaces around command-line tools, a
      graphical application, and PyGambit, the Python API. The project records Google
      Summer of Code participation in 2011 and 2012, support for Game Theory Explorer,
      Action Graph Games contributions, and current core support from the Alan Turing
      Institute since 2023.
  related-projects:
    - PyGambit provides the Python API.
    - >
      Game Theory Explorer is a related browser-based game construction and solving tool
      supported by Gambit development.
    - GTDraw is linked from the official project site as a related tool.
    - wxWidgets was used for Gambit's cross-platform graphical interface.
  sources:
    - https://gambitproject.readthedocs.io/en/stable/
    - https://gambitproject.readthedocs.io/en/stable/tools.html
    - https://github.com/gambitproject/gambit/releases
    - https://www.gambit-project.org/
    - https://www.gambit-project.org/history/
  summary:
    - >
      Gambit is an open-source package for computation in game theory, covering
      construction, analysis, storage, and equilibrium computation for finite
      non-cooperative games in extensive or strategic form.
  timeline:
    - 'Mid-1980s: Origins in game-analysis programs at Caltech.'
    - '1991: Public distribution as version 0.13 began.'
    - '1994: Version 0.94 released.'
    - '1999: Version 0.96 released.'
    - '2002: Version 0.97 released; Turocy became project lead.'
    - '2011: GitHub repository created and Google Summer of Code participation began.'
    - '2023: Rahul Savani joined as co-lead and Alan Turing Institute core support began.'
    - '2026: Version 16.6.0 released on GitHub.'
  usage:
    - >
      Users model games in extensive or strategic form, compute pure and mixed-strategy
      Nash equilibria, fit quantal-response and related models, and exchange games
      through Gambit's file formats. Command-line programs such as gambit-enumpure,
      gambit-enummixed, gambit-lcp, gambit-logit, and gambit-convert support scripted
      workflows.
