id: brew:carapace
display-name: carapace
homepage: https://carapace.sh
repo: https://github.com/carapace-sh/carapace-bin
docs:
  - https://carapace-sh.github.io/carapace-bin
  - https://carapace.sh/
config-file-location:
  unix:
    - ${UserConfigDir}/carapace
    - ${UserConfigDir}/carapace/specs
    - ${UserConfigDir}/carapace/variables/{group}.yaml
    - ${UserConfigDir}/carapace/bridge
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged across multiple operating-system package channels. The
      supplied Homebrew source facts list Homebrew, Alpine, MacPorts, Nix, and winget
      package mappings, while the upstream README includes a Repology packaging badge,
      signaling that distribution packaging is part of the project's public identity.
    - >
      Adoption has been strongest among users who move between shells or who want richer
      completion behavior without writing shell-specific scripts. The upstream README's
      supported-shell list includes both traditional shells and newer interactive
      shells, which is the core adoption story for carapace.
  package-nerd-significance:
    - >
      carapace matters to package nerds because shell completion is often the forgotten
      layer between a package and its users. A package that ships a good binary but poor
      completions feels worse in day-to-day terminal use, and carapace offers a shared
      completion layer that package managers can distribute like any other CLI tool.
    - >
      Its significance also comes from cross-shell normalization. Package repositories
      normally have to care about Bash, Zsh, Fish, PowerShell, and newer shells
      separately; carapace turns that messy edge of packaging into a dedicated,
      versioned tool.
  project-history:
    - >
      The public carapace-bin repository was created on GitHub in April 2020. Its README
      describes the project as a multi-shell completion binary, and the repository
      topics show the project deliberately spans many shell ecosystems rather than being
      tied to a single command-line environment.
    - >
      The project grew around two related surfaces: a collection of completers for
      existing CLI tools and a specification system for adding custom completions. Its
      documentation is published as an mdBook site, and the README points users to
      install and setup pages rather than treating the GitHub README as the only manual.
  related-projects:
    - >
      carapace is related to shell-native completion systems for Bash, Zsh, Fish,
      PowerShell, Nushell, Elvish, Xonsh, Oil, Tcsh, Ion, and Cmd, all of which are
      listed in the upstream README as supported or experimental shells.
    - >
      It is also related to package-manager completion distribution: Homebrew, Alpine,
      MacPorts, Nix, and winget mappings in the supplied source facts show how the same
      completion binary reaches users through several ecosystems.
  sources:
    - https://api.github.com/repos/carapace-sh/carapace-bin
    - https://carapace-sh.github.io/carapace-bin/completers.html
    - https://github.com/carapace-sh/carapace-bin
    - https://raw.githubusercontent.com/carapace-sh/carapace-bin/master/README.md
    - source_facts.package-manager
  summary:
    - >
      carapace is a Go-based multi-shell argument completer distributed as the
      carapace-bin package. It exists in the long tradition of shell completion
      frameworks, but its package-nerd hook is that one completion engine can target
      many shells instead of requiring a separate completion script style for Bash, Zsh,
      Fish, PowerShell, Nushell, Xonsh, Elvish, and others.
  timeline:
    - '2020: carapace-bin repository created on GitHub.'
    - >
      2022: GitHub releases page shows published carapace-bin release tags by at least
      v0.11.0.
    - >
      2026: GitHub repository metadata shows the project still active, with
      shell-completion topics and ongoing updates.
  usage:
    - >
      Users install the carapace binary, enable it for their shell, and then use it to
      provide argument completions for supported commands. The upstream README links to
      the official install and setup documentation, and the official completers page
      documents the list of commands covered by the project.
    - >
      For package maintainers and power users, carapace is also interesting because
      completions can be specified outside a single shell's scripting language, making
      it useful when a command-line tool needs completions across several shell
      communities.
related-packages:
  - id: brew:nushell
    reason: >
      Nushell can use carapace as its external completer; the official carapace setup
      guide provides the exact Nushell initialization and configuration workflow.
    rel: adjacent_workflow
    sources:
      - https://carapace-sh.github.io/carapace-bin/setup.html
      - https://www.nushell.sh/
  - id: brew:fish
    reason: >
      Fish users can source carapace's generated completer at shell startup, and
      carapace can also bridge completions registered in Fish.
    rel: adjacent_workflow
    sources:
      - https://carapace-sh.github.io/carapace-bin/setup.html
      - https://carapace-sh.github.io/carapace-bin/spec/bridge.html
      - https://fishshell.com/
  - id: brew:zsh
    reason: >
      Zsh users can source carapace from .zshrc, while carapace's bridge support can
      reuse commands registered in Zsh's native completion system.
    rel: adjacent_workflow
    sources:
      - https://carapace-sh.github.io/carapace-bin/setup.html
      - https://carapace-sh.github.io/carapace-bin/spec/bridge.html
      - https://www.zsh.org/
category: developer-tools
package-manager:
  apk: carapace
  brew: carapace
  macports: carapace
  nix: carapace
  winget: rsteube.Carapace
package-manager-url: https://formulae.brew.sh/formula/carapace
license: MIT
tags:
  - argument-completion
  - cli
  - developer-tools
  - shell-completion
description: Multi-shell multi-command argument completer
executables:
  - carapace
provenance:
  formula: carapace
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
