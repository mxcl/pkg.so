id: brew:dbx-cli
display-name: DBX CLI
homepage: https://dbxio.com
repo: https://github.com/t8y2/dbx
docs:
  - https://github.com/t8y2/dbx/blob/main/packages/cli/README.md
  - https://github.com/t8y2/dbx#readme
config-file-location:
  linux:
    - $DBX_DATA_DIR/dbx.db
    - ~/.local/share/com.dbx.app/dbx.db
  macos:
    - $DBX_DATA_DIR/dbx.db
    - ~/Library/Application Support/com.dbx.app/dbx.db
  windows:
    - '%DBX_DATA_DIR%\dbx.db'
    - '%APPDATA%\com.dbx.app\dbx.db'
credentials-file-location:
  linux:
    - $DBX_DATA_DIR/dbx.db
    - ~/.local/share/com.dbx.app/dbx.db
  macos:
    - $DBX_DATA_DIR/dbx.db
    - ~/Library/Application Support/com.dbx.app/dbx.db
  windows:
    - '%DBX_DATA_DIR%\dbx.db'
    - '%APPDATA%\com.dbx.app\dbx.db'
history:
  adoption-history:
    - >
      Official installation paths include npm and Homebrew, which places the CLI in
      normal package-manager workflows for developers who want database metadata and
      query output in scripts.
  package-nerd-significance:
    - >
      Package-manager users care because DBX CLI bridges local database connection state
      with shell automation and AI-agent workflows while documenting stable JSON and CSV
      output modes.
  project-history:
    - >
      The CLI lives inside the DBX monorepo, whose README describes DBX as a lightweight
      cross-platform database client and manager with desktop, web, Docker, and
      MCP-oriented workflows.
  related-projects:
    - DBX Desktop, DBX MCP server, database clients such as DBeaver and TablePlus.
  sources:
    - https://github.com/t8y2/dbx#readme
    - https://github.com/t8y2/dbx/blob/main/packages/cli/README.md
  summary:
    - >
      DBX CLI is the command-line companion for DBX, focused on database connections,
      schema inspection, safe SQL queries, and prompt-ready schema context.
  timeline:
    - 'Current: DBX CLI is documented as installable through npm and Homebrew.'
    - 'Current: DBX documents MCP and Codex-oriented database workflows.'
  usage:
    - >
      Typical CLI usage includes listing connections, describing schemas, running
      read-only queries, printing compact context for prompts, and opening DBX desktop
      views.
related-packages:
  - id: cask:dbeaver-community
    reason: >
      Choose DBeaver Community when you prefer a mature graphical schema browser, data
      editor, and SQL workspace; choose DBX CLI when scripts, guarded terminal queries,
      or prompt-ready output are the priority.
    rel: alternative
    sources:
      - https://github.com/t8y2/dbx/blob/main/packages/cli/README.md
      - https://dbeaver.com/docs/dbeaver/
category: data
package-manager:
  brew: dbx-cli
  nix: dbx
  scoop: extras/dbx
  winget: t8y2.DBX
package-manager-url: https://formulae.brew.sh/formula/dbx-cli
license: Apache-2.0
tags:
  - cli
  - database-client
  - dbx
  - mcp
  - query-tool
  - schema-inspection
  - sql
description: Command-line interface for DBX database connections, schema, and safe queries
executables:
  - dbx
provenance:
  formula: dbx-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
