id: brew:beads_viewer
display-name: Beads Viewer
homepage: https://github.com/Dicklesworthstone/beads_viewer
repo: https://github.com/Dicklesworthstone/beads_viewer
docs:
  - https://github.com/Dicklesworthstone/beads_viewer#readme
config-file-location:
  unix:
    - ~/.config/bv/config.yaml
    - .bv/hooks.yaml
    - .bv/workspace.yaml
    - .beads/recipes/*.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Beads Viewer adoption follows Beads adoption: users install it when they want a
      richer terminal workflow or when agents need graph calculations without parsing
      raw JSONL. The README documents Homebrew for macOS/Linux, Scoop for Windows,
      direct release archives, and install scripts.
    - >
      Its agent-facing adoption is explicit: the README warns not to run bare bv in an
      agent context and instead documents --robot-triage, --robot-next, --robot-plan,
      --robot-insights, --robot-history, and related structured-output modes.
  package-nerd-significance:
    - >
      Beads Viewer matters as a package because it is a sidecar rather than the primary
      datastore: it consumes an issue export and supplies terminal UX plus graph
      algorithms. That split mirrors a broader CLI trend where small tools expose both
      human TUI and machine JSON modes.
    - >
      For agent workflows, bv packages graph algorithms as a command-line contract. That
      is useful because LLMs should not have to reconstruct dependency DAGs, PageRank,
      cycle checks, or critical paths from raw JSONL on every turn.
  project-history:
    - >
      The public repository was created on 2025-11-26, shortly after Beads itself
      appeared. The README positions it as a keyboard-driven terminal interface for
      Beads and describes graph-aware features such as PageRank, critical path, cycles,
      kanban, dependency DAG visualization, and robot-mode JSON APIs.
    - >
      The release stream moved quickly from v0.8.2 and v0.9.x on 2025-11-27 through
      v0.10.x in late 2025 and v0.17.x in June 2026. Repository metadata showed 1,596
      stars and 130 forks on 2026-06-30, substantial adoption for a companion tool.
  related-projects:
    - Beads is the issue tracker whose JSONL exports bv reads.
    - Graphviz and Mermaid are output formats mentioned for graph export.
    - >
      MCP Agent Mail is referenced by the README as a separate coordination tool for
      agent-to-agent messaging.
  sources:
    - https://api.github.com/repos/Dicklesworthstone/beads_viewer
    - https://api.github.com/repos/Dicklesworthstone/beads_viewer/releases
    - https://raw.githubusercontent.com/Dicklesworthstone/beads_viewer/main/README.md
  summary:
    - >
      Beads Viewer, invoked as bv, is a terminal UI and robot-mode analyzer for projects
      that use the Beads issue tracker. It turns Beads JSONL exports into browsable
      lists, kanban boards, dependency graphs, graph metrics, and deterministic
      JSON/TOON outputs for agents.
  timeline:
    - '2025-11-26: Dicklesworthstone/beads_viewer repository is created.'
    - '2025-11-27: v0.8.2 and v0.9.x releases are published.'
    - '2025-11-30: v0.10.x releases are published.'
    - '2026-06-09: v0.17.0 is published.'
    - '2026-06-26: v0.17.1 is published.'
  usage:
    - >
      Human users run bv as an interactive TUI over .beads/issues.jsonl or legacy
      .beads/beads.jsonl exports, with views for lists, kanban, insights, history, graph
      navigation, and markdown export.
    - >
      Agent users call robot flags to get deterministic triage, graph metrics, label
      health, dependency flow, plans, histories, diffs, forecasts, alerts, suggestions,
      and graph exports. The README emphasizes stdout-only structured data, stderr
      diagnostics, bounded history analysis, and checking status fields for approximated
      or skipped metrics.
related-packages:
  - id: brew:beads
    reason: >
      Install Beads as the issue tracker and data source that Beads Viewer reads and
      analyzes; the viewer is a companion rather than a standalone issue database.
    rel: adjacent_workflow
    sources:
      - https://github.com/Dicklesworthstone/beads_viewer#readme
      - https://beads.gascity.com/
  - id: brew:graphviz
    reason: >
      Use Graphviz to render DOT dependency graphs exported by Beads Viewer's robot
      graph interface into visual formats such as SVG or PNG.
    rel: adjacent_workflow
    sources:
      - https://github.com/Dicklesworthstone/beads_viewer#readme
      - https://graphviz.org/documentation/
category: developer-tools
package-manager:
  brew: beads_viewer
package-manager-url: https://formulae.brew.sh/formula/beads_viewer
license: MIT
tags:
  - beads
  - cli
  - graph
  - issue-tracker
  - terminal-ui
description: Terminal-based UI for the Beads issue tracker
executables:
  - bv
provenance:
  formula: beads_viewer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
