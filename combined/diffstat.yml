id: brew:diffstat
display-name: diffstat
homepage: https://invisible-island.net/diffstat/
repo: null
docs:
  - https://invisible-island.net/diffstat/diffstat.html
  - https://invisible-island.net/diffstat/manpage/diffstat.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official history says broader attention arrived in early 1996 when developers
      on XFree86 and ncurses mailing lists started using it. It also notes Linux kernel
      patch-process visibility through BitKeeper-era workflows and Git's later built-in
      ability to generate diffstat-style summaries.
  package-nerd-significance:
    - >
      Package maintainers care about diffstat because it is one of the small classic
      tools that made patch exchange readable at scale. The output compresses a patch
      into a reviewable map: which files changed and roughly how much.
  project-history:
    - >
      Thomas E. Dickey's official history says he originally wrote diffstat in 1992,
      alongside rcshist, to trace changes in collections of files. He later found it
      most useful for summarizing source patches.
  related-projects:
    - >
      diffstat depends culturally and practically on diff and patch workflows; Git later
      incorporated diffstat-style output for repository changes.
  sources:
    - https://invisible-island.net/diffstat/diffstat.html
    - https://invisible-island.net/diffstat/CHANGES
  summary:
    - >
      diffstat reads diff output and produces per-file histograms of insertions,
      deletions, and modifications. It is a compact review aid for large patch sets.
  timeline:
    - '1992: Thomas E. Dickey wrote diffstat.'
    - '1996: XFree86 and ncurses developers began using it more visibly.'
    - >
      2002: Linux kernel BitKeeper patch workflow documentation referenced
      diffstat-style summaries.
    - '2026: diffstat 1.69 released with compiler-warning fixes.'
  usage:
    - >
      diffstat sits after `diff` in a pipeline and turns patch text into a
      size-and-shape summary. That makes it useful in email review, release notes,
      package deltas, and quick scans of large changes before reading detailed hunks.
related-packages:
  - id: brew:git
    reason: >
      Choose Git's built-in `--stat` reporting for repository-aware summaries that can
      account for moves and renames; use diffstat when processing standalone diff or
      patch text.
    rel: alternative
    sources:
      - https://invisible-island.net/diffstat/diffstat.html
      - https://git-scm.com/docs/git-diff
  - id: brew:diffutils
    reason: >
      GNU diffutils produces the unified, context, or normal diff output that diffstat
      summarizes into per-file histograms.
    rel: adjacent_workflow
    sources:
      - https://invisible-island.net/diffstat/manpage/diffstat.html
      - https://www.gnu.org/software/diffutils/manual/diffutils.html
  - id: brew:gpatch
    reason: >
      GNU patch consumes the same diff output that diffstat summarizes, letting
      maintainers inspect a patch's scope before applying it.
    rel: adjacent_workflow
    sources:
      - https://invisible-island.net/diffstat/diffstat.html
      - https://www.gnu.org/software/diffutils/manual/html_node/Invoking-patch.html
category: developer-tools
package-manager:
  brew: diffstat
  debian: diffstat
  dnf: diffstat
  macports: diffstat
  nix: diffstat
  pacman: diffstat
  ubuntu: diffstat
  zypper: diffstat
