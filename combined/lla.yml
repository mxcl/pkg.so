id: brew:lla
display-name: lla
homepage: https://github.com/chaqchase/lla
repo: https://github.com/chaqchase/lla
docs:
  - https://lla.chaqchase.com/docs/about/introduction
  - https://lla.chaqchase.com/docs/reference/cli-reference
config-file-location:
  unix: ~/.config/lla/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Cargo, Homebrew, Arch's paru, NetBSD
      pkgin, X-CMD, direct binary downloads, and a shell installer. That spread is
      typical of Rust CLIs that start with cargo install and then acquire native
      package-manager formulae.
    - >
      GitHub release packaging for lla includes checksums and platform artifacts, which
      supports package-manager maintainers and users who prefer pinned binary installs
      over building from source.
  package-nerd-significance:
    - >
      lla belongs to the modern Rust CLI packaging wave: a traditional Unix command is
      reworked with colored output, richer metadata, and a distribution story that spans
      Cargo, Homebrew, Linux packages, and standalone release assets.
    - >
      Its plugin model is the package-nerd hook: instead of being only a prettier ls, it
      treats directory listings as an extensible surface for Git, file operations,
      metadata, themes, and custom fields.
  project-history:
    - >
      The chaqchase/lla repository was created on GitHub in July 2023, with v0.1.0
      published the same day. The README describes lla as a modern, customizable,
      feature-rich, extensible ls replacement.
    - >
      The project grew from basic listing modes into a broader filesystem dashboard:
      long, tree, table, grid, timeline, storage-analysis, directory-jump, search, diff,
      and plugin-backed metadata views are described in the upstream README.
  related-projects:
    - >
      lla is related to other ls replacements and filesystem explorers such as exa/eza,
      lsd, broot, dust, and tree, though its upstream documentation emphasizes its own
      plugin system and Git-aware listing features.
    - >
      Its Rust implementation and package layout put it near other cargo-first
      command-line utilities that later gain Homebrew and distro packaging.
  sources:
    - https://api.github.com/repos/chaqchase/lla
    - https://formulae.brew.sh/formula/lla
    - https://github.com/chaqchase/lla
    - https://github.com/chaqchase/lla/releases/tag/v0.1.0
    - https://github.com/chaqchase/lla/releases/tag/v0.5.7
    - https://lla.chaqchase.com/docs/about/introduction
    - https://lla.chaqchase.com/docs/reference/cli-reference
    - https://raw.githubusercontent.com/chaqchase/lla/main/README.md
  summary:
    - >
      lla is a Rust command-line file-listing tool in the long line of ls replacements.
      Its distinctive angle is combining multiple display modes, Git-aware views,
      configuration, and a plugin system under one executable.
  timeline:
    - '2023: chaqchase/lla repository and v0.1.0 release published on July 31.'
    - >
      2025: v0.5.0 release line introduced during a period of expanded package artifacts
      and plugin assets.
    - >
      2026: v0.5.7 release published with packaged binaries, package files, plugin
      archives, themes, and SHA256 checksums.
  usage:
    - >
      lla is used as an interactive and scriptable replacement for ls, especially by
      users who want rich metadata, Git status, tree views, filtering, and themed output
      without combining several separate filesystem tools.
    - >
      The documented config path is ~/.config/lla/config.toml, and the README shows lla
      init and lla config workflows for creating and inspecting that file.
related-packages:
  - id: brew:eza
    reason: >
      Choose eza for a mature, focused `ls` replacement with rich metadata, Git status,
      hyperlinks, and themes; choose lla when its search, navigation, machine-output,
      and plugin platform are useful.
    rel: alternative
    sources:
      - https://github.com/eza-community/eza#readme
      - https://github.com/chaqchase/lla#readme
  - id: brew:lsd
    reason: >
      Choose lsd for an `ls`-compatible experience centered on colors, icons, tree
      output, and YAML configuration; choose lla for broader navigation, search,
      automation, and plugin workflows.
    rel: alternative
    sources:
      - https://github.com/lsd-rs/lsd#readme
      - https://github.com/chaqchase/lla#readme
category: system
package-manager:
  brew: lla
  nix: lla
package-manager-url: https://formulae.brew.sh/formula/lla
license: MIT
tags:
  - cli
  - file-listing
  - ls-replacement
  - plugins
  - rust
description: High-performance, extensible alternative to ls
executables:
  - lla
provenance:
  formula: lla
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
