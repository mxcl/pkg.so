history:
  adoption-history:
    - >
      Melodics is distributed for Mac and Windows and is also available on iPad and
      iPhone. The official support material describes synchronized lesson progress on
      iPhone and continued keys-and-pads support on desktop and iPad.
  package-nerd-significance:
    - >
      The Homebrew cask gives musicians a reproducible way to install a proprietary,
      hardware-aware practice application that must interoperate with MIDI controllers,
      electronic drums, audio interfaces, and low-latency system audio.
  project-history:
    - >
      Melodics developed as an interactive instrument-practice application for drums,
      MIDI keyboards, and pad controllers. Its official support material documents a
      later expansion from desktop and iPad to a full iPhone learning experience focused
      on drums.
  related-projects:
    - Melodics for iPad
    - Melodics for iPhone
  sources:
    - https://support.melodics.com/en/articles/6777061-get-started-with-melodics
    - >
      https://support.melodics.com/en/articles/6880140-how-to-create-your-melodics-account-and-download-melodics
    - https://support.melodics.com/en/articles/9894344-melodics-for-iphone
  summary:
    - >
      Melodics is an interactive music-learning and practice application for drums,
      keyboards, and pad controllers.
  timeline:
    - >
      2024: Official support documentation introduced the full Melodics learning
      experience for iPhone, initially focused on drums.
    - >
      2020s: Melodics continued supporting desktop and iPad practice for drums, keys,
      and pads.
  usage:
    - >
      Learners connect an electronic drum kit, MIDI keyboard, or pad controller and work
      through guided lessons and songs. Practice mode supports looping, tempo reduction,
      automatic tempo increases, and waiting for the correct note.
