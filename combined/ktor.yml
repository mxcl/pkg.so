id: brew:ktor
display-name: Ktor CLI
homepage: https://github.com/ktorio/ktor-cli
repo: https://github.com/ktorio/ktor-cli
docs:
  - https://github.com/ktorio/ktor-cli#readme
  - https://ktor.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI README documents Homebrew installation for Linux and macOS and WinGet
      installation for Windows. It also points users to the web generator at
      start.ktor.io, making the CLI one of several official project-creation paths
      rather than the only frontend to Ktor scaffolding.
    - >
      The tool is useful for Kotlin developers who want repeatable project generation
      outside IntelliJ IDEA, including shell scripts, teaching material, CI experiments,
      and OpenAPI-driven service skeletons.
  package-nerd-significance:
    - >
      Ktor CLI is package-nerd notable because it packages an official framework
      bootstrapper as a small executable rather than assuming an IDE or browser. It also
      sits at an interesting language boundary: the Ktor framework is Kotlin-first,
      while the CLI repository builds the command-line executable with Go.
  project-history:
    - >
      Ktor itself reached 1.0 on 2018-11-19, when JetBrains described it as a Kotlin
      framework for asynchronous servers and clients in connected systems. The
      standalone ktor-cli repository was created on 2021-12-06, adding a
      package-manager-friendly command-line surface beside the web project generator and
      IntelliJ IDEA workflows.
    - >
      The Ktor framework continued through major releases that shaped the CLI's context:
      Ktor 2.0 was announced on 2022-04-11 after roughly a year of work, and Ktor 3.0
      was announced in October 2024 with Kotlin 2.0 alignment and a move to kotlinx-io.
  related-projects:
    - >
      Ktor CLI is related to the Ktor framework, Kotlin, start.ktor.io, the Ktor
      IntelliJ IDEA plugin, Gradle, OpenAPI tooling, and JetBrains' broader Kotlin
      server-development ecosystem.
  sources:
    - https://api.github.com/repos/ktorio/ktor-cli
    - https://blog.jetbrains.com/kotlin/2018/11/ktor-1-0/
    - https://blog.jetbrains.com/kotlin/2024/10/ktor-3-0/
    - https://blog.jetbrains.com/ktor/2022/04/11/ktor-2-0-released/
    - https://github.com/ktorio/ktor-cli
    - https://ktor.io/docs/server-create-a-new-project.html
    - https://raw.githubusercontent.com/ktorio/ktor-cli/main/README.md
  summary:
    - >
      Ktor CLI is JetBrains' command-line project generator and helper for Ktor, the
      Kotlin framework for asynchronous server and client applications. The CLI creates
      Ktor projects, generates projects from OpenAPI specifications, adds Ktor
      dependencies, and runs Ktor projects in development mode.
  timeline:
    - '2018-11-19: JetBrains announced Ktor 1.0.'
    - '2021-12-06: ktorio/ktor-cli repository created on GitHub.'
    - '2022-04-11: JetBrains announced Ktor 2.0.'
    - '2024-10: JetBrains announced Ktor 3.0 with Kotlin 2.0 and kotlinx-io changes.'
  usage:
    - >
      The `ktor new` command creates a project, `ktor openapi` generates from an OpenAPI
      specification, `ktor add` adds Ktor dependencies to a Gradle project, and `ktor
      dev` runs a project in development mode with rebuilds. The README also documents
      proxy support through the `HTTPS_PROXY` environment variable.
related-packages:
  - id: brew:gradle
    reason: >
      Gradle is the documented build workflow used by Ktor CLI's dependency-addition and
      development-mode commands for generated Kotlin projects.
    rel: adjacent_workflow
    sources:
      - https://github.com/ktorio/ktor-cli#readme
      - https://docs.gradle.org/current/userguide/userguide.html
  - id: brew:kotlin
    reason: >
      Install the Kotlin toolchain when you need direct compiler and runtime commands
      around the Kotlin source projects generated by Ktor CLI.
    rel: adjacent_workflow
    sources:
      - https://ktor.io/docs/server-create-a-new-project.html
      - https://kotlinlang.org/docs/command-line.html
category: developer-tools
package-manager:
  brew: ktor
package-manager-url: https://formulae.brew.sh/formula/ktor
license: Apache-2.0
tags:
  - cli
  - kotlin
  - ktor
  - openapi
  - project-generator
description: Generates Ktor projects through the command-line interface
executables:
