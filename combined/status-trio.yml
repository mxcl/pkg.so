config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Status Trio is distributed through GitHub releases and the main Homebrew cask
      collection. The project provides a multilingual native interface and can run from
      the menu bar, the Dock, or both.
    - >
      The application has expanded from its original three-signal display into a broader
      control surface for audio, networking, battery details, connected devices, and
      launch-at-login behavior while retaining the compact combined icon.
  package-nerd-significance:
    - >
      Status Trio is a focused example of a native macOS menu-bar cask: it replaces
      several separate status items with one configurable renderer and integrates with
      system frameworks instead of embedding a cross-platform runtime.
    - >
      Its open Swift package, local build scripts, Sparkle update path, and Homebrew
      cask make it useful to users who prefer auditable native utilities delivered
      through package management.
  project-history:
    - >
      Status Trio was created by lingyired as an independent macOS adaptation of the
      compact combined-status idea associated with iPhone Duo, substituting volume for
      cellular data and rendering battery, Wi-Fi, and volume in one icon.
    - >
      Later development added Dock placement, richer battery and connection details,
      Bluetooth-device information, audio-device controls, localization,
      accessibility-aware motion, and optional update and telemetry controls.
  related-projects:
    - Apple System Settings, linked for detailed battery and network configuration
    - Sparkle, used for authenticated application updates
  sources:
    - https://github.com/lingyired/status-trio#readme
    - https://github.com/lingyired/status-trio/releases
  summary:
    - >
      Status Trio is a native macOS status utility that combines Wi-Fi, battery, and
      volume into a single configurable icon displayed in the menu bar, Dock, or both.
  timeline:
    - >
      2026: Status Trio was released as an independent native macOS utility with public
      source and Homebrew distribution.
    - >
      2026: The project broadened its panels and controls to cover additional Bluetooth,
      audio, VPN, and battery information.
  usage:
    - >
      Left-click the live menu-bar or Dock icon to open the status popover and
      right-click it for the native application menu.
    - >
      Use Settings to choose menu-bar or Dock placement, icon size and rendering,
      battery details, language, update behavior, and launch-at-login behavior.
    - >
      Location permission is optional and is requested only when the user elects to
      display the current Wi-Fi network name. Other monitored status comes from macOS
      frameworks.
