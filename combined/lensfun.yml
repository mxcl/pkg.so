id: brew:lensfun
display-name: Lensfun
homepage: https://lensfun.github.io/
repo: https://github.com/lensfun/lensfun
docs:
  - https://lensfun.github.io/
config-file-location:
  unix:
    - ~/.local/share/lensfun/*.xml
    - ~/.local/share/lensfun/version_x/*.xml
  windows:
    - '%USERPROFILE%/AppData/Local/lensfun/*.xml'
    - '%USERPROFILE%/AppData/Local/lensfun/version_x/*.xml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Lensfun's adoption is tied to desktop photo and raw-processing software. The
      project documentation describes Lensfun itself as a library and database, with
      actual image correction normally happening through applications that integrate it.
    - >
      Its packaging spread reflects that role: distributions ship both the runtime
      library/database and helper tools so photo applications can use a shared
      correction database instead of maintaining their own lens profiles.
  package-nerd-significance:
    - >
      Lensfun matters to package nerds because it is shared data infrastructure: one
      small package can improve lens correction across many photography applications.
      Its database-updater commands also make the package unusually data-centric for a
      C/C++ media library.
  project-history:
    - >
      The Lensfun project says it was started by Andrew Zabolotny in 2007 to create a
      free and open source database for correcting photographic lens errors. The README
      explains that the database grew from an earlier public PTLens database, with
      permission from the PTLens author, while Lensfun's code was rewritten from scratch
      and the data was converted to a new XML-based format.
    - >
      Project maintenance shifted in 2012, when Torsten Bronger described taking over
      maintenance after fixes and database updates had stalled. The focus after that was
      continuous integration of submitted profiles and regular releases so application
      users could get updated camera and lens data.
  related-projects:
    - PTLens supplied the public database seed that Lensfun converted and extended.
    - >
      Photo applications with Lensfun support are the main consumers of the library and
      database.
  sources:
    - https://github.com/lensfun/lensfun
    - https://lensfun.github.io/news/
    - https://lensfun.github.io/usage/
  summary:
    - >
      Lensfun is a library and open lens-profile database for correcting photographic
      lens defects such as distortion, lateral chromatic aberration, and vignetting.
  timeline:
    - >
      2007: Andrew Zabolotny started Lensfun as a free and open source lens-correction
      database.
    - >
      2012: Torsten Bronger took over maintenance and emphasized integrating submitted
      profiles and releasing updated data.
    - >
      2022: Release 0.3.3 updated the 0.3.x branch with camera and lens data through
      February 22, 2022.
    - >
      2023: Release 0.3.4 updated the 0.3.x branch with camera and lens data through
      July 12, 2023.
  usage:
    - >
      Applications query Lensfun's camera and lens database, then apply correction
      algorithms based on the matched equipment profile. The project also ships tools
      such as lensfun-update-data and lenstool for maintaining or testing the database
      outside a larger photo application.
related-packages:
  - id: cask:rawtherapee
    reason: >
      RawTherapee directly integrates Lensfun for equipment-specific correction,
      providing an end-user raw-photo workflow around Lensfun's library and profile
      database.
    rel: adjacent_workflow
    sources:
      - https://lensfun.github.io/usage/
      - https://rawpedia.rawtherapee.com/Lens/Geometry
  - id: brew:exiv2
    reason: >
      Lensfun's FAQ recommends Exiv2 for inspecting camera and lens metadata when an
      editor selects the wrong profile, making it a practical diagnostic companion.
    rel: adjacent_workflow
    sources:
      - https://lensfun.github.io/faq/
      - https://exiv2.org/
category: media
package-manager:
  apk: lensfun
  brew: lensfun
  debian: liblensfun-bin
  dnf: lensfun
  macports: lensfun
  nix: lensfun
  pacman: lensfun
  ubuntu: liblensfun-bin
  zypper: lensfun-data
package-manager-url: https://formulae.brew.sh/formula/lensfun
license: LGPL-3.0-only AND GPL-3.0-only AND CC-BY-3.0 AND LicenseRef-Homebrew-public-domain
tags:
  - cli
  - image-processing
  - lens-correction
  - photography
description: Remove defects from digital images
executables:
  - g-lensfun-update-data
  - lensfun-add-adapter
  - lensfun-update-data
  - lenstool
provenance:
  formula: lensfun
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
