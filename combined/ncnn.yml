id: brew:ncnn
display-name: ncnn
homepage: https://github.com/Tencent/ncnn
repo: https://github.com/Tencent/ncnn
docs:
  - https://github.com/Tencent/ncnn
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream states that ncnn is used in Tencent applications including QQ, Qzone,
      WeChat, and Pitu. Outside Tencent, its adoption pattern is typical for low-level
      ML infrastructure: package-manager availability, examples for object detection and
      vision models, and use by developers who want a C++ runtime without TensorFlow
      Lite or ONNX Runtime-sized baggage.
  package-nerd-significance:
    - >
      For package maintainers, ncnn is interesting because it is a fast-moving
      C++/Vulkan project that exposes both libraries and many small CLI tools. It is
      also a useful example of a Homebrew formula where the command-line surface is
      mostly build/deployment tooling around a library rather than one end-user command.
  project-history:
    - >
      Tencent presentations describe the ncnn project as dating from 2017, with open
      collaboration and Vulkan acceleration as central design points. That timing put it
      in the wave of mobile inference runtimes that appeared after deep-learning
      deployment moved from server GPUs into phones and edge devices.
  related-projects:
    - PyTorch, ONNX, pnnx, Vulkan, TensorFlow, Caffe, MXNet, Darknet
  sources:
    - https://formulae.brew.sh/formula/ncnn
    - https://github.com/Tencent/ncnn
    - >
      https://www.khronos.org/developers/linkto/ncnn-universal-neural-network-inference-with-vulkan
  summary:
    - >
      ncnn is Tencent's open-source neural-network inference runtime for mobile,
      embedded, desktop, browser, and edge deployment. Its niche is small,
      dependency-light inference: the upstream README emphasizes no third-party runtime
      dependencies, CPU and Vulkan GPU backends, explicit low-memory allocator design,
      and conversion tools such as pnnx for PyTorch and ONNX workflows.
  timeline:
    - '2017: Tencent presentation material describes ncnn as active since 2017.'
    - >
      2020s: README documents pnnx-based PyTorch/ONNX conversion and CPU/Vulkan
      deployment across mobile, desktop, browser, and edge targets.
  usage:
    - >
      Package users usually install ncnn for the converter and optimizer executables as
      much as for the library. A common flow is export from PyTorch through pnnx,
      produce .param and .bin model files, run optimization or int8 tooling, and embed
      the resulting model in a C++ or mobile application using ncnn::Net.
related-packages:
  - id: brew:pytorch
    reason: >
      Use PyTorch to define or train a model, then follow ncnn's recommended pnnx
      workflow to convert that model for lightweight ncnn inference deployment.
    rel: adjacent_workflow
    sources:
      - https://github.com/Tencent/ncnn
      - https://github.com/Tencent/ncnn/wiki/use-ncnn-with-pytorch-or-onnx
      - https://docs.pytorch.org/docs/
