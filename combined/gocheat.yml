id: brew:gocheat
display-name: gocheat
homepage: https://github.com/Achno/gocheat
repo: https://github.com/Achno/gocheat
docs:
  - https://github.com/Achno/gocheat#readme
config-file-location:
  unix: ~/.config/gocheat/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      gocheat is young and lightweight, so its adoption record is correspondingly
      modest. It is packaged for Homebrew as brew:gocheat, appears in the input facts as
      also mapped to Nix, and its README documents Arch AUR installation, source builds,
      and go install.
  package-nerd-significance:
    - >
      The package is a tidy example of the Bubble Tea-era terminal-app trend: a single
      Go binary wraps a personal text database with a polished TUI, then package
      managers distribute it like any other small CLI. Its significance is local
      productivity rather than ecosystem infrastructure.
  project-history:
    - >
      The public repository was created in August 2024. The README explains the
      motivation plainly: the author had many keybinds and aliases to remember and
      wanted a way to look them up in seconds. The first GitHub release, v0.1.0, was
      published on August 25, 2024, followed by v0.1.1 on September 10, 2024.
  related-projects:
    - >
      gocheat is related by workflow to cheat-sheet and command-reference CLIs, but its
      interface is closer to modern Go TUIs built with Bubble Tea-style libraries.
    - >
      It is adjacent to personal knowledge and keybinding helpers rather than team
      documentation systems.
  sources:
    - https://api.github.com/repos/Achno/gocheat
    - https://api.github.com/repos/Achno/gocheat/releases?per_page=10
    - https://formulae.brew.sh/formula/gocheat
    - https://github.com/Achno/gocheat
  summary:
    - >
      gocheat is a terminal UI cheatsheet app for remembering keybindings, hotkeys,
      aliases, and similar short notes. It is a small productivity package built around
      fast lookup, fuzzy filtering, tags, and direct editing from the TUI.
  timeline:
    - '2024-08-21: Public GitHub repository created'
    - '2024-08-25: v0.1.0 initial release published'
    - '2024-09-10: v0.1.1 release published'
    - '2024: README documents AUR, source-build, and go install workflows'
  usage:
    - >
      Users launch the TUI, add entries for keybindings or aliases, filter by text or
      tag, and edit the JSON configuration directly at ~/.config/gocheat/config.json
      when preferred. The README documents keyboard actions for adding, deleting,
      filtering, switching tag mode, showing tags, and exiting.
related-packages:
  - id: brew:cheat
    reason: >
      Choose cheat when you want command-oriented plain-text cheatsheets that are easy
      to author, version, and share rather than a keybinding-focused TUI database.
    rel: alternative
    sources:
      - https://github.com/Achno/gocheat#readme
      - https://github.com/cheat/cheat#readme
  - id: brew:navi
    reason: >
      Choose navi when you want interactive command cheatsheets whose selected snippets
      can be composed and inserted into your shell command line.
    rel: alternative
    sources:
      - https://github.com/Achno/gocheat#readme
      - https://github.com/denisidoro/navi#readme
category: productivity
package-manager:
  brew: gocheat
  nix: gocheat
package-manager-url: https://formulae.brew.sh/formula/gocheat
license: MIT
tags:
  - cheatsheets
  - cli
  - hotkeys
  - keybindings
  - tui
description: TUI Cheatsheet for keybindings, hotkeys and more
executables:
  - gocheat
provenance:
  formula: gocheat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
