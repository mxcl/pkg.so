history:
  adoption-history:
    - >
      The project’s official README describes SoundCraft as pre-alpha and approaching
      its first alpha, so broad production adoption is not yet established. Official
      builds nevertheless target macOS, Windows, Linux, FreeBSD, and browsers, while a
      command-line interface supports headless and scripted workflows.
  package-nerd-significance:
    - >
      SoundCraft is notable as a clean-room, open-source Pro Tools-style workstation
      implemented as a modular Rust workspace. It also treats automation as a
      first-class interface: application actions are addressable through commands, a
      JSON control channel, a CLI, and an MCP server, allowing scripts and AI agents to
      inspect and modify sessions.
  project-history:
    - >
      SoundCraft emerged in 2026 as an ArtCraft project to build an open-source,
      clean-room reimplementation of familiar Avid Pro Tools workflows in pure Rust. Its
      scope includes multitrack audio and MIDI editing, mixing, plugins, sends,
      automation, recording, bouncing, and session management.
    - >
      The project was structured as a workspace of layered Rust crates separating time,
      audio I/O, MIDI, DSP, session modeling, mixing, playback, automation, and the egui
      interface. The official roadmap characterizes the implementation as pre-alpha
      while documenting substantial menu and feature coverage.
  related-projects:
    - >
      SoundCraft is part of the ArtCraft family of clean-room Rust applications. Its
      repository explicitly positions the workflow as compatible with concepts familiar
      to Avid Pro Tools users while stating that it is independent of Avid.
  sources:
    - https://github.com/storytold/soundcraft#readme
    - https://github.com/storytold/soundcraft/blob/main/ROADMAP.md
    - https://github.com/storytold/soundcraft/blob/main/docs/control-protocol.md
    - https://github.com/storytold/soundcraft/blob/main/docs/mcp.md
  summary:
    - >
      SoundCraft is an open-source, cross-platform digital audio workstation and
      clean-room reimplementation of established Pro Tools-style workflows, written in
      Rust. Alongside its graphical interface, it exposes command-line, JSON
      control-channel, and Model Context Protocol automation surfaces.
  timeline:
    - >
      2026: SoundCraft was developed publicly as an ArtCraft clean-room audio
      workstation in Rust.
    - >
      2026: Official documentation described the project as pre-alpha and approaching
      its first alpha.
  usage:
    - >
      Users can record, arrange, edit, mix, automate, and bounce multitrack audio and
      MIDI through the desktop application. Developers and automation users can run the
      engine headlessly, invoke commands through the CLI or local JSON control channel,
      and expose sessions to compatible agents through the bundled MCP server.
