id: brew:quran
display-name: quran
homepage: https://git.hanabi.in/quran-go
repo: https://git.hanabi.in/quran-go
docs:
  - https://git.hanabi.in/quran-go
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Go compilation and Make-based installation, but
      provides no adoption chronology or audience measurements.
  package-nerd-significance:
    - >
      The author explicitly favors Unix simplicity. Its self-hosted Git repository uses
      stagit for browsing and accepts patches by email, illustrating a small-project
      workflow outside the major forge platforms.
  project-history:
    - >
      Created by acagastya, quran is a Go successor to the discontinued quran.py script.
      The public Git log records development in April and May 2022, including
      translation listing, request delays and manual-page installation.
  related-projects:
    - The predecessor quran.py is commemorated by a repository tag.
  sources:
    - '[Official Git log](https://git.hanabi.in/quran-go/)'
    - '[Official README](https://git.hanabi.in/quran-go/file/README.html)'
  summary:
    - >
      quran fetches Qur'an translations and prints selected chapters or verses in the
      terminal.
  timeline:
    - >
      2022-04: Public Git history records verse selection, request delays and
      translation listing.
    - '2022-05: Added the README and manual-page installation support.'
  usage:
    - >
      Use quran 1 for a chapter, quran 1:2 for a verse, or quran 1:3-5 for a range.
      Flags choose a translation, decorate output and control the delay between
      requests.
category: productivity
package-manager:
  brew: quran
package-manager-url: https://formulae.brew.sh/formula/quran
license: AGPL-3.0-only
tags:
  - cli
  - quran
  - religion
  - terminal
  - text-reader
description: Print Qur'an chapters and verses right in the terminal
executables:
  - quran
provenance:
  formula: quran
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
