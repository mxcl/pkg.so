id: brew:dwarf
display-name: dwarf
homepage: https://github.com/elboza/dwarf-ng/
repo: https://github.com/elboza/dwarf-ng
docs:
  - https://github.com/elboza/dwarf-ng#readme
  - https://www.autistici.org/0xFE/src/dwarf-ng/xdwarf.man.html
config-file-location:
  unix:
    - /etc/dwarfrc
    - ~/.dwarfrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption appears small. The input metadata lists Homebrew and MacPorts
      packages, and GitHub metadata shows a niche repository rather than a broad
      ecosystem project. That makes the history useful mainly for distinguishing the
      package from DWARF debug-info tooling with similar names.
  package-nerd-significance:
    - >
      The package is significant mostly as a naming trap and a small binary-analysis
      artifact. In package indexes, brew:dwarf can be mistaken for DWARF debugging
      utilities, but its actual role is closer to a scriptable hex/object editor
      adjacent to readelf, objdump, otool, gdb, ht, elfsh, and elfdump.
  project-history:
    - >
      The dwarf-ng man page is dated 2007-2011 and credits Fernando Iazeolla as founder
      and core developer. The README's usage banner identifies dwarf-ng 0.4.0 with
      copyright years 2007, 2013, and 2017.
    - >
      The project later moved from an older code.google.com homepage reference to
      GitHub; the current GitHub repository was created in May 2013. The README
      describes the tool as a command-line hex editor and object-file manipulator with
      an interactive shell and a command language.
  related-projects:
    - >
      The man page lists readelf, objdump, ht, otool, gdb, elfsh, and elfdump as related
      tools.
    - >
      ELF, PE, Mach-O, and raw binary files are the file formats documented by the
      README and man page.
  sources:
    - https://github.com/elboza/dwarf-ng#readme
    - https://www.autistici.org/0xFE/src/dwarf-ng/xdwarf.man.html
    - https://api.github.com/repos/elboza/dwarf-ng
  summary:
    - >
      dwarf is the command shipped by dwarf-ng, a small object-file manipulation tool
      and hex editor in the spirit of gdb. Despite the name, it is not the
      libdwarf/dwarfdump DWARF-debug-info package; it focuses on reading and editing
      Raw, ELF, PE, and Mach-O files.
  timeline:
    - '2007: The man page copyright range begins, marking the early dwarf-ng era.'
    - '2011: The hosted man page is generated from the dwarf-ng manual.'
    - '2013: The official GitHub repository is created.'
    - '2017: The README usage banner lists dwarf-ng 0.4.0 with 2017 in the copyright range.'
  usage:
    - >
      Users run dwarf against object files to inspect file information, print bytes and
      structured headers, edit blocks, create or remove headers, inject data, and work
      interactively. The man page documents support for ELF, PE, Mach-O, and Mach-O fat
      binaries.
    - >
      The tool reads /etc/dwarfrc and ~/.dwarfrc for settings such as working on a
      temporary copy, verbosity, temporary paths, and colors.
related-packages: []
category: developer-tools
package-manager:
  brew: dwarf
  macports: dwarf
package-manager-url: https://formulae.brew.sh/formula/dwarf
license: GPL-2.0-or-later
tags:
  - binary-analysis
  - cli
  - elf
  - mach-o
  - object-files
  - pe
description: Object file manipulation tool
executables:
  - dwarf
provenance:
  formula: dwarf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
