id: brew:fileicon
display-name: fileicon
homepage: https://github.com/mklement0/fileicon
repo: https://github.com/mklement0/fileicon
docs:
  - https://github.com/mklement0/fileicon#readme
  - https://github.com/mklement0/fileicon/blob/master/doc/fileicon.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew, npm, and manual installation. Its changelog credits
      Homebrew formula availability in late 2019 and later macOS compatibility work for
      Monterey and Ventura-era behavior.
  package-nerd-significance:
    - >
      fileicon is a good example of package managers distributing a narrow macOS
      automation tool that wraps platform-specific metadata behavior behind a scriptable
      CLI, with both Homebrew and npm installation paths documented by the maintainer.
  project-history:
    - >
      fileicon began with an initial v0.1.0 release on August 3, 2015. Its README and
      generated manual explain that it provides a programmatic alternative to using
      Finder for custom icons, storing icon data through macOS filesystem metadata.
  related-projects:
    - >
      The README references Icon Changer as a GUI utility that uses fileicon behind the
      scenes.
  sources:
    - https://api.github.com/repos/mklement0/fileicon
    - https://formulae.brew.sh/api/formula/fileicon.json
    - https://github.com/mklement0/fileicon
    - https://raw.githubusercontent.com/mklement0/fileicon/master/README.md
    - https://raw.githubusercontent.com/mklement0/fileicon/master/doc/fileicon.md
  summary:
    - >
      fileicon is a macOS command-line utility for setting, removing, extracting, and
      testing custom icons on files and folders.
  timeline:
    - '2015: Initial v0.1.0 release.'
    - '2017: v0.2.0 added macOS High Sierra support and changed icon generation internals.'
    - '2019: Homebrew installation became available.'
    - '2022: v0.3.x adjusted for macOS Monterey Python changes and volume icons.'
    - '2026: v0.3.5 released according to the official changelog.'
  usage:
    - >
      The CLI exposes set, rm, get, and test subcommands. Users provide a target file or
      folder and, for set, an image file; the tool creates square icon representations
      and applies macOS custom-icon metadata.
related-packages: []
category: system
package-manager:
  brew: fileicon
package-manager-url: https://formulae.brew.sh/formula/fileicon
license: MIT
tags:
  - cli
  - custom-icons
  - finder
  - macos
  - metadata
description: macOS CLI for managing custom icons for files and folders
executables:
  - fileicon
provenance:
  formula: fileicon
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
