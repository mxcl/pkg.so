id: brew:ascii2binary
display-name: ascii2binary
homepage: https://billposer.org/Software/a2b.html
repo: null
docs:
  - http://billposer.org/Software/ascii2binary_man.html
  - http://billposer.org/Software/binary2ascii_man.html
  - https://billposer.org/Software/a2b.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream downloads section links not only tarballs but also Debian, FreeBSD
      FreshPorts, Open Package, OpenSolaris, SUSE RPM, and Ubuntu package pages. The
      input package facts show current Homebrew, Debian, and Ubuntu package-manager
      coverage.
  package-nerd-significance:
    - >
      This is a classic small Unix filter package: narrow purpose, POSIX C
      implementation, man pages, no credentials, no runtime config, and behavior that
      matters in scripts. Its fine-grained exit codes and locale/type-size options are
      the sort of details downstream users notice when a converter becomes part of test
      fixtures or data pipelines.
  project-history:
    - >
      The official page documents version 2.14 as current, last modified on 2010-08-29.
      Its changelog starts at version 2.0, when support for long and long long integers
      was added, and version 2.1 added the companion `binary2ascii` command.
    - >
      Later 2.x releases focused on practical conversion details: base selection,
      internationalization, endianness reporting, script-friendly exit codes, long
      double support, locale-aware thousands separators, type-size reporting, and
      packaging-oriented header-name cleanup.
  related-projects:
    - >
      strtod, strtoll, and strtoull are the C library conversion functions named in the
      official man page.
    - >
      Downstream package links on the official page include Debian, FreeBSD FreshPorts,
      Open Package, OpenSolaris, SUSE RPMs, and Ubuntu.
  sources:
    - http://billposer.org/Software/Ascii2BinaryChangeLog.html
    - http://billposer.org/Software/ascii2binary_man.html
    - https://billposer.org/Software/a2b.html
  summary:
    - >
      ascii2binary is a pair of C/POSIX command-line programs, `ascii2binary` and
      `binary2ascii`, for converting between textual representations of numbers and raw
      binary values. The upstream page frames them as tools for test data generation,
      binary-file inspection, and glue between text-producing and binary-consuming
      programs.
  timeline:
    - '2007-02: Official ascii2binary man page timestamp.'
    - '2.0: Adds support for long and long long integers.'
    - '2.1: Adds binary2ascii to the package.'
    - '2.3: Programs become fully internationalized with a French translation.'
    - '2.7: Exit codes are redefined for script-friendly error classes.'
    - '2.11: Locale-aware numeric conversion is added.'
    - '2010-08: Official page lists version 2.14 as current and last modified.'
  usage:
    - >
      Users pipe whitespace-separated textual numbers into `ascii2binary` with flags
      selecting base and type, then pipe binary data into `binary2ascii` to inspect or
      reformat it. The official examples show hexadecimal-to-binary conversion,
      binary-to-hex/binary display, floating-point inspection, width and zero-padding
      controls, and locale conversion from German to American English number formatting.
related-packages: []
