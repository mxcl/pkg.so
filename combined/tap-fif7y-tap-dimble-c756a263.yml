config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dimble is distributed as a free, GPL-licensed macOS application and through the
      developer's Homebrew tap. Its narrow focus, lack of account requirement, and
      native implementation place it in the tradition of small Mac power-user utilities.
  package-nerd-significance:
    - >
      Dimble is notable as an open-source menu-bar manager built specifically around the
      menu-bar architecture introduced with macOS 27. Its Homebrew tap provides a
      scriptable installation path for a utility that depends closely on
      operating-system UI behavior.
    - >
      The project documents its use of a private Apple framework and fails softly if
      that interface disappears, an important maintenance consideration for users who
      upgrade macOS early.
  project-history:
    - >
      The project began from work inspired by Ice and its Thaw fork. It was called
      Pelmet through the 0.3.1 series and briefly used the name Pliss during beta before
      adopting the name Dimble.
    - >
      Dimble was then adapted around macOS 27's native menu-bar hiding mechanism, adding
      three visibility sections, layout editing, panel and row presentations, menu-bar
      search, shortcuts, and per-display behavior.
  related-projects:
    - >
      Dimble's official repository identifies Ice and Thaw as technical predecessors and
      describes Bartender as a commercial alternative in the same menu-bar-management
      category.
  sources:
    - https://github.com/fif7y/dimble#readme
    - https://github.com/fif7y/dimble/blob/main/docs/FAQ.md
    - https://github.com/fif7y/dimble/releases
  summary:
    - >
      Dimble is a free, open-source macOS utility for arranging menu-bar items into
      visible, hidden, and always-hidden sections and revealing them through hover,
      clicks, shortcuts, search, or a panel.
  timeline:
    - '2026: The project targeted the rebuilt macOS 27 menu bar.'
    - '2026: The project adopted the Dimble name after earlier Pelmet and Pliss names.'
  usage:
    - >
      Users arrange status items in a visual editor or Command-drag them around the menu
      bar, then reveal hidden groups with configurable pointer actions or global
      shortcuts.
    - >
      Accessibility permission is required to inspect positions and activate hidden
      items; Screen Recording permission is optional and supports custom reveal
      animations. The application requires no account and documents no credential store
      or fixed user-editable configuration file.
related-packages:
  - id: cask:bartender
    reason: >
      Choose Bartender when you want an established commercial menu-bar manager with
      presets, triggers, styling, and automation; Dimble is the free open-source option
      designed around macOS 27's native hiding mechanism.
    rel: alternative
    sources:
      - https://github.com/fif7y/dimble#readme
      - https://www.macbartender.com/
