id: brew:ncdc
display-name: ncdc
homepage: https://dev.yorhel.nl/ncdc
repo: https://g.blicky.net/ncdc.git
docs:
  - https://dev.yorhel.nl/ncdc
config-file-location:
  unix:
    - $NCDC_DIR/db.sqlite3
    - ~/.ncdc/db.sqlite3
credentials-file-location:
  unix:
    - $NCDC_DIR/db.sqlite3
    - $NCDC_DIR/cert/client.key
    - ~/.ncdc/db.sqlite3
    - ~/.ncdc/cert/client.key
history:
  adoption-history:
    - >
      ncdc remained a niche but real package-manager tool. The upstream page links
      packages or ports for Arch/AUR, Debian, Fedora, FreeBSD, Guix, Gentoo, Homebrew,
      OpenSUSE, Ubuntu, Void, and others. The Homebrew formula API response consulted
      for this July 2026 batch reported 20 install-on-request events in 30 days and 280
      in 365 days, which fits a specialized Direct Connect client rather than a broad
      daily utility.
  package-nerd-significance:
    - >
      ncdc matters mainly as a maintained terminal-native Direct Connect client with
      modern-ish protocol coverage. It is not a mainstream network tool, but it is
      exactly the kind of package that keeps old P2P and private hub ecosystems usable
      from headless machines, shells, and minimal Unix desktops.
  project-history:
    - >
      The public release history starts with 1.0 on 2011-09-16, after 0.x releases
      earlier that month. Early releases quickly filled in serious Direct Connect client
      features: TLS in 0.9, multi-source downloading in 1.3, SQLite storage in 1.6, a
      socket/GnuTLS network backend in 1.10, IPv6 in 1.15, segmented downloads in 1.18,
      and later GeoIP/libloc-related updates through 1.25 on 2025-03-04.
  related-projects:
    - Direct Connect, ADC, NMDC, ncurses, GnuTLS, SQLite
  sources:
    - https://dev.yorhel.nl/ncdc
    - https://dev.yorhel.nl/ncdc/changes
    - https://dev.yorhel.nl/ncdc/man
    - https://formulae.brew.sh/api/formula/ncdc.json
  summary:
    - >
      ncdc is Yorhel's terminal Direct Connect client: a C, ncurses, SQLite-backed
      client for ADC and NMDC hubs. Its upstream page describes it as lightweight,
      MIT-licensed, written in C, and in passive maintenance rather than active feature
      development.
  timeline:
    - >
      2011-09-16: ncdc 1.0 released with manual pages and client-to-client TLS support
      on NMDC.
    - '2011-12-07: 1.6 switched storage to SQLite3.'
    - '2012-05-03: 1.10 rewrote the network backend around sockets and made GnuTLS required.'
    - '2013-03-02: 1.15 added IPv6 support.'
    - '2025-03-04: 1.25 added libloc-backed IP-to-country lookup support.'
  usage:
    - >
      Package nerd usage is classic TUI hub work: start `ncdc`, set
      nick/description/connection, share directories, optionally configure active mode,
      then `/open` a saved ADC or NMDC hub. The manual emphasizes slash commands, tab
      completion, persistent hub records, multiple tabs, hub chat, user lists,
      searching, file-list browsing, queued downloads, and bandwidth throttling.
related-packages: []
category: networking
package-manager:
  brew: ncdc
  debian: ncdc
  dnf: ncdc
  macports: ncdc
  nix: ncdc
  ubuntu: ncdc
package-manager-url: https://formulae.brew.sh/formula/ncdc
license: MIT
tags:
  - cli
  - direct-connect
  - file-sharing
  - ncurses
description: NCurses direct connect
executables:
  - ncdc
provenance:
  formula: ncdc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
