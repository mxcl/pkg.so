id: brew:json-table
display-name: json-table
homepage: https://github.com/micha/json-table
repo: https://github.com/micha/json-table
docs:
  - https://github.com/micha/json-table#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      json-table is a niche package, but Homebrew packaging made it easy for macOS users
      to install alongside shell data-processing tools. Its README also documents
      prebuilt Linux binaries and source builds.
  package-nerd-significance:
    - >
      json-table is notable as a post-`jq` minimalist alternative: it accepts JSON as
      structured input but exits JSON-world quickly, producing boring tabular streams
      that compose with older Unix text tools.
  project-history:
    - >
      The README frames `jt` as a deliberately narrow extractor: instead of becoming a
      broad JSON programming language, it provides the operations needed to organize
      nested JSON data into tables. The repository copyright line names Micha Niskin and
      2017, and the tag series begins with 1.0.0.
  related-projects:
    - >
      The README says `jt` is based on ideas from `jshon`. It overlaps with `jq`,
      CSV/TSV conversion tools, and Unix text filters used after JSON has been
      flattened.
  sources:
    - https://formulae.brew.sh/formula/json-table
    - https://github.com/micha/json-table
    - https://github.com/micha/json-table/blob/master/README.md
    - https://github.com/micha/json-table/blob/master/jt.1.html
  summary:
    - >
      json-table provides `jt`, a small shell tool that reads UTF-8 JSON from stdin and
      writes tab-separated values or CSV to stdout. Its purpose is to get data out of
      nested JSON and into formats that classic Unix tools can process.
  timeline:
    - '2017: The project copyright year appears in the upstream README.'
    - '2017: Public tags begin at 1.0.0.'
    - >
      2020: The 4.x tag line appears in the upstream repository, including 4.3.3 used by
      Homebrew packaging.
  usage:
    - >
      Users pipe JSON into `jt`, choose fields with its stack-based language, and then
      feed the resulting TSV or CSV to tools such as `awk`, `cut`, `paste`, `join`,
      `sort`, and `uniq`.
related-packages:
  - id: brew:jshon
    reason: >
      jshon is an alternative for shell scripts that need to parse, create, or modify
      JSON and retain JSON output, whereas json-table specializes in extracting nested
      values into TSV or CSV and explicitly credits jshon's ideas.
    rel: alternative
    sources:
      - https://github.com/micha/json-table#readme
      - https://github.com/keenerd/jshon/blob/master/jshon.1
category: developer-tools
package-manager:
  brew: json-table
  zypper: json-table
package-manager-url: https://formulae.brew.sh/formula/json-table
license: EPL-1.0
tags:
  - cli
  - data-processing
  - json
  - shell
  - table-output
description: Transform nested JSON data into tabular data in the shell
executables:
  - jt
provenance:
  formula: json-table
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
