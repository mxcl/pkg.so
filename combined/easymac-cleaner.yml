history:
  adoption-history:
    - >
      The vendor documents Homebrew Cask installation and upgrades alongside direct
      downloads and a built-in Sparkle updater. No adoption measurements were
      established.
  package-nerd-significance:
    - >
      Its documented features include removing unused architectures from universal
      binaries and cleaning Xcode derived data, alongside ordinary disk cleanup.
  project-history:
    - >
      MartianCat develops EasyMac Cleaner as a native macOS utility. Its public GitHub
      project supplies documentation, screenshots and issue reporting; the reviewed
      repository does not publish application source code.
  related-projects:
    - Homebrew Cask; Sparkle.
  sources:
    - '[Official project README](https://github.com/MartianCatBR/easymac-cleaner#readme).'
  summary:
    - EasyMac Cleaner combines disk cleanup, privacy cleanup and system maintenance.
  timeline:
    - >
      2026: Official documentation describes Homebrew distribution and
      community-submitted cleanup rules.
  usage:
    - >
      Users can locate duplicates and large files, clear caches and browser traces, and
      manage startup items. Cleanup-rule suggestions can be submitted through the app.
