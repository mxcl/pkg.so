id: cask:antigravity-ide
display-name: Google Antigravity IDE
homepage: https://antigravity.google/product/antigravity-ide
repo: null
docs:
  - https://antigravity.google/docs/ide-overview?app=antigravity
  - https://antigravity.google/docs?app=antigravity
config-file-location:
  unix:
    - ~/.gemini/config/mcp_config.json
    - .agents/mcp_config.json
    - ~/.gemini/config/hooks.json
    - .agents/hooks.json
credentials-file-location:
  unix: ~/.gemini/antigravity/mcp_oauth_tokens.json
history:
  adoption-history:
    - >
      Official documentation shows Antigravity expanding beyond its original
      IDE-centered experience into a family of agent surfaces. No dependable public
      installation or active-user totals are supplied for the IDE, so adoption should
      not be quantified.
  package-nerd-significance:
    - >
      Antigravity IDE represents the shift from autocomplete-oriented AI editors toward
      agentic development environments that can operate across an editor, terminal, and
      browser. For package-manager users, the cask supplies a reproducible installation
      route for a rapidly evolving proprietary developer tool.
  project-history:
    - >
      Google introduced Antigravity IDE as an agent-first development environment in
      which agents work across code, terminal sessions, and browser tasks and
      communicate through artifacts.
    - >
      By Antigravity 2.0, Google documented a broader product family—including a
      standalone desktop agent manager, CLI, SDK, and the IDE—while retaining the IDE as
      the direct code-editing surface.
  related-projects:
    - Google Antigravity 2.0
    - Antigravity CLI
    - Antigravity SDK
    - Google Chrome
  sources:
    - https://antigravity.google/docs/home
    - https://antigravity.google/docs/ide-overview?app=antigravity
    - https://antigravity.google/docs/overview?hl=en
    - https://antigravity.google/product/antigravity-ide
  summary:
    - >
      Google Antigravity IDE is Google's agent-first development environment. It
      combines conventional code editing and completion with agents capable of operating
      across the editor, terminal, and browser.
  timeline:
    - >
      2026: Official materials document Antigravity IDE and the broader Antigravity 2.0
      family of desktop, CLI, SDK, and IDE surfaces.
  usage:
    - >
      Developers use the IDE for direct code editing, tab completion, natural-language
      code commands, and autonomous implementation or debugging tasks. Agents can
      produce reviewable artifacts and interact with terminal and browser surfaces.
category: developer-tools
package-manager:
  brew-cask: antigravity-ide
package-manager-url: https://formulae.brew.sh/cask/antigravity-ide
tags:
  - ai
  - browser-automation
  - code-editor
  - coding-agent
  - developer-tools
  - ide
description: AI Coding Agent IDE
applications:
  - Antigravity IDE.app
provenance:
  cask: antigravity-ide
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
