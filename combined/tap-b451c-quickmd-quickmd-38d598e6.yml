id: cask:b451c/quickmd/quickmd
display-name: QuickMD
homepage: https://qmd.app/
repo: https://github.com/b451c/quickmd
docs:
  - https://github.com/b451c/quickmd/tree/main/docs/themes
  - https://github.com/b451c/quickmd#readme
config-file-location:
  macos: ~/Library/Application Support/QuickMD/Themes/
credentials-file-location: null
history: null
related-packages:
  - id: cask:marked-app
    reason: >
      Choose Marked when you need a separate macOS Markdown previewer with deeper
      proofreading, custom-processing, and multi-format publishing features; QuickMD
      emphasizes a lightweight native viewer and in-place source fixes.
    rel: alternative
    sources:
      - https://github.com/b451c/quickmd#readme
      - https://markedapp.com/
  - id: cask:typora
    reason: >
      Choose Typora when you want an integrated distraction-free Markdown editor with
      immediate rendered feedback; QuickMD is primarily a viewer that can hand longer
      edits to another editor.
    rel: alternative
    sources:
      - https://github.com/b451c/quickmd#readme
      - https://typora.io/
category: productivity
package-manager:
  brew-cask: b451c/quickmd/quickmd
package-manager-url: https://github.com/b451c/homebrew-quickmd/blob/HEAD/Casks/quickmd.rb
tags:
  - document-viewer
  - macos
  - markdown
  - mermaid
  - native-app
  - pdf-export
description: Lightning-fast native Markdown viewer
applications:
  - QuickMD.app
provenance:
  provider: cask
  source: https://github.com/b451c/homebrew-quickmd/blob/HEAD/Casks/quickmd.rb
  tap: b451c/quickmd
