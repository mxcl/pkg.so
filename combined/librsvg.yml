id: brew:librsvg
display-name: librsvg
homepage: https://wiki.gnome.org/Projects/LibRsvg
repo: https://gitlab.gnome.org/GNOME/librsvg
docs:
  - https://gnome.pages.gitlab.gnome.org/librsvg
  - https://gnome.pages.gitlab.gnome.org/librsvg/Rsvg-2.0
  - https://gnome.pages.gitlab.gnome.org/librsvg/devel-docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNOME documents librsvg as part of the GNOME platform libraries: Gnome Shell uses
      it for SVG assets such as icons, applications can link to librsvg directly, and a
      gdk-pixbuf loader lets programs load SVG documents through the same path as raster
      image formats.
    - >
      The rsvg-convert executable is documented by the project as a widely used tool
      whose command-line options are kept stable because many scripts and systems depend
      on it.
  package-nerd-significance:
    - >
      librsvg is a classic small-but-foundational package: it pulls together XML
      parsing, CSS/SVG rendering, Cairo output, GNOME ABI stability, Rust internals, and
      a CLI converter. Packagers care about it because SVG rendering regressions can
      show up as broken icons, bad documentation assets, or failed build pipelines far
      from the library itself.
  project-history:
    - >
      The librsvg development guide describes the project as starting around 2001, when
      Eazel needed SVG rendering for Nautilus while SVG itself was still being
      standardized. Early librsvg used libxml2's SAX parser and libart, then moved to
      Cairo and grew into a GObject-based GNOME platform library with a stable C API and
      ABI.
    - >
      In 2016 the project began porting internals to Rust. By early 2021 the
      architecture documentation described the implementation as Rust while keeping the
      public C API and ABI intact, an unusual migration path that let distributions and
      GNOME consumers keep the same package surface while the internals changed
      language.
  related-projects:
    - >
      Related projects include GNOME, Nautilus, Cairo, libxml2, gdk-pixbuf, crates.io,
      and the SVG specification.
  sources:
    - https://gitlab.gnome.org/GNOME/librsvg
    - https://gnome.pages.gitlab.gnome.org/librsvg/Rsvg-2.0/index.html
    - https://gnome.pages.gitlab.gnome.org/librsvg/devel-docs/architecture.html
    - https://gnome.pages.gitlab.gnome.org/librsvg/devel-docs/product.html
  summary:
    - >
      librsvg is GNOME's long-running SVG rendering library and the source of the
      rsvg-convert command-line tool. It matters in package-manager culture because a
      small SVG renderer package often sits underneath icon themes, desktop
      thumbnailers, documentation builds, and scripts that convert SVG assets into
      raster or PDF outputs.
  timeline:
    - '2001: Started around Eazel and Nautilus to render SVG images in GNOME.'
    - '2013: The 2.40.0 tag began a long stable release series.'
    - '2016: Rust porting work began inside the project.'
    - '2017: The 2.41.0 tag opened the Rust-era development series.'
    - >
      2021: Project architecture documentation described the library implementation as
      Rust with the C API and ABI preserved.
    - '2023: Version 2.57.0 made librsvg available as a regular Rust crate on crates.io.'
  usage:
    - >
      Developers use the C API through librsvg-2.0, use GObject Introspection bindings
      from other languages, or invoke rsvg-convert to render SVG documents to other
      formats. Desktop environments also use the gdk-pixbuf SVG loader and thumbnailer
      artifacts produced by the build.
related-packages:
  - id: brew:resvg
    reason: >
      resvg is a portable, all-Rust alternative for static SVG rendering when a small
      self-contained CLI or reproducible cross-platform output is preferable to
      librsvg's GNOME and Cairo integration.
    rel: alternative
    sources:
      - https://github.com/linebender/resvg/blob/main/README.md
      - https://gnome.pages.gitlab.gnome.org/librsvg/Rsvg-2.0/overview.html
  - id: brew:cairo
    reason: >
      librsvg renders SVG documents into Cairo contexts, so Cairo is the documented
      companion API when an application needs to compose SVG output with other vector or
      raster drawing.
    rel: adjacent_workflow
    sources:
      - https://gnome.pages.gitlab.gnome.org/librsvg/Rsvg-2.0/overview.html
      - https://www.cairographics.org/manual/
category: media
package-manager:
  apk: librsvg
  brew: librsvg
  chocolatey: rsvg-convert
  debian: gir1.2-rsvg-2.0
  macports: librsvg
  nix: librsvg
  pacman: librsvg
  ubuntu: gir1.2-rsvg-2.0
  zypper: librsvg-2-2
package-manager-url: https://formulae.brew.sh/formula/librsvg
license: LGPL-2.1-or-later
tags:
  - cairo
  - cli
  - gnome
  - graphics-library
  - rendering
  - svg
description: Library to render SVG files using Cairo
executables:
  - rsvg-convert
provenance:
  formula: librsvg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
