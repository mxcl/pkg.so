id: brew:libsoundio
display-name: libsoundio
homepage: http://libsound.io
repo: https://github.com/andrewrk/libsoundio
docs:
  - http://libsound.io/
  - http://libsound.io/doc-2.0.0
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project attracted packaging across Homebrew, Debian, Fedora, MacPorts, Nix,
      Alpine, and other Unix-like distributions because it offered a thin, MIT-licensed
      C abstraction over the main desktop audio backends.
  package-nerd-significance:
    - >
      libsoundio is a package-nerd library because it exposes the messy cross-platform
      audio boundary as one small C dependency. It is less historically central than
      libsndfile, but it is useful when applications want low-level audio I/O without
      bundling backend-specific code.
  project-history:
    - >
      The GitHub repository describes libsoundio as a C library suitable for real-time
      software such as digital audio workstations and for consumer software such as
      music players. Release-tag commit metadata shows version 1.0.0 on September 3,
      2015 and version 2.0.0 on February 20, 2019.
  related-projects:
    - >
      JACK, PulseAudio, ALSA, CoreAudio, and WASAPI are the backend APIs that libsoundio
      abstracts.
    - >
      Language bindings and wrapper packages use libsoundio as the native layer for
      higher-level ecosystems.
  sources:
    - http://libsound.io/
    - http://libsound.io/doc-2.0.0
    - >
      https://api.github.com/repos/andrewrk/libsoundio/commits/1848add506ce053825da387e13458dda864e689b
    - >
      https://api.github.com/repos/andrewrk/libsoundio/commits/dc4f84339039ac518b6cd1c0e7683e88e25be470
    - https://api.github.com/repos/andrewrk/libsoundio/tags?per_page=100
    - https://github.com/andrewrk/libsoundio
  summary:
    - >
      libsoundio is Andrew Kelley's small C library for cross-platform real-time audio
      input and output. It sits below applications that need a direct, backend-aware
      audio API without committing to JACK, PulseAudio, ALSA, CoreAudio, or WASAPI
      separately.
  timeline:
    - '2015-09-03: Version 1.0.0 release-tag commit.'
    - '2019-02-20: Version 2.0.0 release-tag commit.'
    - >
      2019: The 2.0.0 documentation set became the referenced packaged API documentation
      surface.
  usage:
    - >
      Users link against libsoundio for real-time playback, capture, device enumeration,
      backend selection, channel layouts, and device-change events. The package also
      includes examples and utilities such as sio_list_devices, sio_sine,
      sio_microphone, and sio_record.
related-packages:
  - id: brew:libsndfile
    reason: >
      libsndfile complements libsoundio by reading and writing sampled-audio files while
      libsoundio handles real-time streams from audio devices.
    rel: adjacent_workflow
    sources:
      - https://github.com/andrewrk/libsoundio
      - https://libsndfile.github.io/libsndfile/
category: media
package-manager:
  apk: libsoundio
  brew: libsoundio
  debian: libsoundio-dev
  dnf: libsoundio
  macports: libsoundio
  nix: libsoundio
  ubuntu: libsoundio-dev
  zypper: libsoundio-devel
package-manager-url: https://formulae.brew.sh/formula/libsoundio
license: MIT
