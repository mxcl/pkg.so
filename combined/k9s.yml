id: brew:k9s
display-name: K9s
homepage: https://k9scli.io/
repo: https://github.com/derailed/k9s
docs:
  - https://k9scli.io/
  - https://k9scli.io/topics
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/k9s/config.yaml
    - ~/.config/k9s/config.yaml
  macos: ~/Library/Application Support/k9s/config.yaml
  windows: '%LOCALAPPDATA%\k9s\config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      K9s spread through the normal cross-platform CLI packaging routes. Its official
      install documentation lists Homebrew and MacPorts on macOS, Linuxbrew and Pacman
      on Linux, and Scoop or Chocolatey on Windows, which made it easy to add to
      existing Kubernetes workstations.
    - >
      The project reached a scale visible in repository metadata: tens of thousands of
      GitHub stars and thousands of forks by July 2026. That level of attention is
      unusual for a single-purpose terminal UI and reflects the centrality of Kubernetes
      day-to-day operations.
  package-nerd-significance:
    - >
      K9s is package-nerd catnip because it packages a large Kubernetes workflow into
      one local binary with a memorable name, broad package-manager coverage, and
      obvious daily utility. It is also a marker of the TUI renaissance in
      infrastructure tooling, alongside projects that use terminal layouts as serious
      operational interfaces.
    - >
      Its configuration paths differ across Linux, macOS, and Windows, which makes it a
      useful example for package databases that track real application state rather than
      only executable names.
  project-history:
    - >
      The derailed/k9s repository was created in January 2019. The project describes K9s
      as a Kubernetes CLI for managing clusters in style and says it provides a terminal
      UI that continually watches Kubernetes resources for changes.
    - >
      K9s evolved around the idea that many Kubernetes workflows are repetitive
      inspection loops: list pods, jump to logs, describe resources, edit manifests,
      switch namespaces, and watch status. Its documentation grew into topics for
      installation, configuration, skins, plugins, benchmarks, and operational commands.
  related-projects:
    - >
      K9s sits beside kubectl, kubectx, kubens, Stern, Lens, OpenLens, Helm, and K8sGPT
      in the Kubernetes operator toolbox. Its closest conceptual relatives are terminal
      dashboards and resource browsers rather than deployment or package managers.
  sources:
    - https://api.github.com/repos/derailed/k9s
    - https://github.com/derailed/k9s
    - https://github.com/derailed/k9s/releases
    - https://k9scli.io/
    - https://k9scli.io/topics
    - https://k9scli.io/topics/install/
  summary:
    - >
      K9s is a terminal user interface for Kubernetes that turns cluster navigation,
      inspection, and common operations into a keyboard-driven local app. It became one
      of the recognizable post-kubectl tools for operators who wanted a faster view of
      resources without moving into a full graphical dashboard.
  timeline:
    - '2019-01: Public GitHub repository created.'
    - '2021: The release stream had reached the v0.24 and v0.25 series.'
    - '2026-07-01: Repository metadata showed more than 34,000 stars and more than 2,200 forks.'
  usage:
    - >
      K9s is used as an interactive cluster console. Operators open it against a
      kubeconfig context, watch resource tables update, drill into pods and workloads,
      tail logs, and trigger common commands without repeatedly composing kubectl
      invocations.
    - >
      It complements rather than replaces kubectl: kubectl remains the scriptable
      primitive, while K9s is the fast human interface for scanning, debugging, and
      moving around clusters.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubectl is the scriptable Kubernetes client and kubeconfig-centered foundation to
      keep beside K9s, while K9s provides the interactive terminal view for day-to-day
      exploration.
    rel: adjacent_workflow
    sources:
      - https://github.com/derailed/k9s
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:k8sgpt
    reason: >
      K8sGPT complements K9s resource inspection with automated Kubernetes analyzers and
      optional AI explanations when an operator needs help triaging a cluster problem.
    rel: adjacent_workflow
    sources:
      - https://github.com/derailed/k9s
      - https://github.com/k8sgpt-ai/k8sgpt
category: cloud-infrastructure
package-manager:
  apk: k9s
  brew: k9s
  chocolatey: k9s
  dnf: k9s
  macports: k9s
  nix: k9s
  pacman: k9s
  scoop: main/k9s
  winget: Derailed.k9s
  zypper: k9s
package-manager-url: https://formulae.brew.sh/formula/k9s
license: Apache-2.0
tags:
  - cli
  - cluster-management
  - kubernetes
  - tui
description: Kubernetes CLI To Manage Your Clusters In Style!
executables:
  - k9s
provenance:
  formula: k9s
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
