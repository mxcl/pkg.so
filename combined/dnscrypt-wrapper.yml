id: brew:dnscrypt-wrapper
display-name: dnscrypt-wrapper
homepage: https://cofyc.github.io/dnscrypt-wrapper/
repo: https://github.com/cofyc/dnscrypt-wrapper
docs:
  - https://cofyc.github.io/dnscrypt-wrapper
  - https://github.com/cofyc/dnscrypt-wrapper
config-file-location: null
credentials-file-location:
  unix:
    - ./secret.key
    - ./1.key
    - ./1.cert
history:
  adoption-history:
    - >
      dnscrypt-wrapper reached package-manager visibility in Homebrew, Alpine, and
      Arch-style packaging, but it never had the broad desktop/client adoption of
      dnscrypt-proxy. Its audience is operators who want to publish a DNSCrypt-capable
      resolver rather than users who only want to consume one.
  package-nerd-significance:
    - >
      For package history, dnscrypt-wrapper is interesting because it packages the other
      side of the DNSCrypt protocol. It shows how early encrypted-DNS tooling needed
      both client daemons and server wrappers before encrypted transport was folded into
      larger resolver projects.
  project-history:
    - >
      The project describes itself as a server-side proxy that adds DNSCrypt support to
      name resolvers. Instead of replacing resolvers such as Unbound, BIND, or PowerDNS
      Recursor, it was designed to sit in front of them and handle the DNSCrypt layer.
    - >
      Its documentation and repository identify it with the earlier DNSCrypt server
      ecosystem, including key generation, provider names, and a wrapper process around
      a conventional DNS backend. That makes it a smaller, more specialized counterpart
      to dnscrypt-proxy.
  related-projects:
    - >
      Related projects include dnscrypt-proxy for clients, Unbound, BIND, and PowerDNS
      Recursor as wrapped DNS backends, and dnsdist for DNS load balancing in front of
      resolver fleets.
  sources:
    - https://cofyc.github.io/dnscrypt-wrapper
    - https://github.com/cofyc/dnscrypt-wrapper
    - https://formulae.brew.sh/formula/dnscrypt-wrapper
  summary:
    - >
      dnscrypt-wrapper is the server-side companion to DNSCrypt client tools: it wraps
      an existing recursive or authoritative DNS service so that clients can speak
      DNSCrypt to it.
  timeline:
    - >
      2012-2015: The public project documentation and copyright range cover the early
      DNSCrypt server-wrapper era.
    - >
      2010s: The package becomes available through Homebrew and Linux packaging for
      operators running DNSCrypt-capable resolvers.
  usage:
    - >
      Operators use dnscrypt-wrapper when they already run a DNS resolver and want to
      expose a DNSCrypt endpoint. The package is therefore configured around server
      keys, certificates, provider names, listen addresses, and forwarding to the local
      resolver.
related-packages:
  - id: brew:dnscrypt-proxy
    reason: >
      dnscrypt-proxy is the documented client companion for connecting to and testing a
      DNSCrypt endpoint published by dnscrypt-wrapper.
    rel: adjacent_workflow
    sources:
      - https://cofyc.github.io/dnscrypt-wrapper/
      - https://github.com/DNSCrypt/dnscrypt-proxy
  - id: brew:unbound
    reason: >
      Unbound can provide the recursive resolving backend while dnscrypt-wrapper adds
      the client-facing DNSCrypt transport and certificate layer.
    rel: adjacent_workflow
    sources:
      - https://cofyc.github.io/dnscrypt-wrapper/
      - https://nlnetlabs.nl/projects/unbound/about/
category: networking
package-manager:
  apk: dnscrypt-wrapper
  brew: dnscrypt-wrapper
  pacman: dnscrypt-wrapper
package-manager-url: https://formulae.brew.sh/formula/dnscrypt-wrapper
license: ISC
tags:
  - cli
  - dns
  - dnscrypt
  - proxy
  - server
description: Server-side proxy that adds dnscrypt support to name resolvers
executables:
  - dnscrypt-wrapper
provenance:
  formula: dnscrypt-wrapper
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
