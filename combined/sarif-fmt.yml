id: brew:sarif-fmt
display-name: sarif-fmt
homepage: https://docs.rs/crate/sarif-fmt/latest
repo: https://github.com/psastras/sarif-rs
docs:
  - https://docs.rs/crate/sarif-fmt/latest
  - https://github.com/psastras/sarif-rs#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream documents distribution through Cargo, cargo-binstall, Fedora and Nix;
      these establish packaging channels rather than measured adoption.
  package-nerd-significance:
    - >
      The formatter connects machine-readable analysis reports with terminal
      diagnostics, allowing pipelines to retain SARIF artifacts while displaying
      readable results.
  project-history:
    - >
      sarif-fmt is developed within sarif-rs, a collection of Rust libraries and
      command-line tools for SARIF. Its published crate history includes releases from
      2021.
  related-projects:
    - >
      Companion tools include clippy-sarif and clang-tidy-sarif; serde-sarif supplies
      SARIF data structures.
  sources:
    - https://docs.rs/crate/sarif-fmt/latest
    - https://github.com/psastras/sarif-rs#readme
  summary:
    - sarif-fmt renders SARIF static-analysis findings as readable terminal output.
  timeline:
    - '2021: Published crate releases are recorded on the official crate documentation surface.'
  usage:
    - >
      Pipe SARIF into sarif-fmt, or chain an analyzer through a SARIF converter and then
      the formatter. The documented tee workflow preserves a report while displaying its
      diagnostics.
category: developer-tools
package-manager:
  brew: sarif-fmt
  dnf: sarif-fmt
  nix: sarif-fmt
package-manager-url: https://formulae.brew.sh/formula/sarif-fmt
license: MIT
tags:
  - cli
  - formatter
  - rust
  - sarif
  - static-analysis
description: Pretty print SARIF files to easy human readable output
executables:
  - sarif-fmt
provenance:
  formula: sarif-fmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
