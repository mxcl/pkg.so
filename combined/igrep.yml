id: brew:igrep
display-name: igrep
homepage: https://github.com/konradsz/igrep
repo: https://github.com/konradsz/igrep
docs:
  - https://github.com/konradsz/igrep#readme
config-file-location:
  unix: $RIPGREP_CONFIG_PATH
credentials-file-location: null
history:
  adoption-history:
    - >
      igrep has modest but real package-manager reach for a niche CLI: the README
      documents prebuilt binaries plus Homebrew, Scoop, Arch Linux, Alpine Edge, and
      `cargo install`, while Homebrew and other package records classify it as an
      interactive grep tool.
  package-nerd-significance:
    - >
      igrep is a tidy example of the post-ripgrep CLI pattern: reuse a fast search
      engine as a library, then add just enough terminal UI to make search results
      navigable without becoming a full editor or IDE.
  project-history:
    - >
      The GitHub repository was created in 2020, but public release tags visible through
      GitHub start in 2022. The README keeps the project deliberately focused: a single
      `ig` command, ripgrep-compatible search behavior, editor integration, and
      keybindings for filtering and navigating matches.
  related-projects:
    - >
      igrep is directly related to ripgrep and the Rust `grep` crate. It sits in the
      same package-manager neighborhood as fzf-assisted search workflows, editor
      quickfix lists, and terminal file-search interfaces.
  sources:
    - https://crates.io/crates/grep
    - https://formulae.brew.sh/formula/igrep
    - https://github.com/BurntSushi/ripgrep
    - https://github.com/konradsz/igrep
    - https://github.com/konradsz/igrep/releases
  summary:
    - >
      igrep is a Rust terminal UI around recursive text search: it runs ripgrep's `grep`
      library in the background, lets the user browse matches interactively, and opens
      the selected match in an editor.
  timeline:
    - '2020: GitHub repository created.'
    - '2022: v0.1.2 release tag published.'
    - '2023: v1.0.0 release tag published.'
    - '2024: v1.3.0 release tag published.'
  usage:
    - >
      Users run `ig [OPTIONS] <PATTERN|--type-list> [PATHS]...`; igrep searches
      recursively, respects ripgrep configuration through `RIPGREP_CONFIG_PATH`, and
      chooses an editor from command-line options or editor environment variables.
related-packages:
  - id: brew:ripgrep
    reason: >
      Choose ripgrep for fast, scriptable search output and shell pipelines; choose
      igrep when you want to browse the same style of recursive results interactively
      and open a selected match in an editor.
    rel: alternative
    sources:
      - https://github.com/konradsz/igrep
      - https://github.com/BurntSushi/ripgrep
  - id: brew:fzf
    reason: >
      Choose fzf when you need a general-purpose fuzzy selector that can interactively
      filter output from many commands, rather than igrep's purpose-built grep result
      browser.
    rel: alternative
    sources:
      - https://github.com/konradsz/igrep
      - https://github.com/junegunn/fzf
category: developer-tools
package-manager:
  apk: igrep
  brew: igrep
  macports: igrep
  nix: igrep
  pacman: igrep
  scoop: main/igrep
  winget: BrunoVolpato.ivygrep
  zypper: igrep
package-manager-url: https://formulae.brew.sh/formula/igrep
license: MIT
tags:
  - cli
  - grep
  - interactive
  - ripgrep
  - search
description: Interactive grep
executables:
  - ig
provenance:
  formula: igrep
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
