history:
  adoption-history:
    - >
      NostalgiApp targets macOS users with eXoDOS or other ROM collections, especially
      users seeking a native alternative to Windows-oriented launchers. Its integration
      of bundled and external emulators reduces the manual setup normally associated
      with large retro-game libraries.
  package-nerd-significance:
    - >
      NostalgiApp packages a native SwiftUI front end around a heterogeneous emulation
      stack that includes DOSBox variants, ScummVM, MAME, DREAMM, 86Box, and RetroArch.
      It is a useful example of a macOS cask coordinating independently packaged
      runtimes, large user-supplied data collections, and optional cloud services.
  project-history:
    - >
      NostalgiApp was released as a native macOS launcher for eXo collections and
      general ROM libraries. The first stable release arrived in February 2026, followed
      by rapid additions including bundled emulators, broader eXo support, iCloud
      synchronization, music-library features, storefront integration, and Windows-game
      support.
  related-projects:
    - >
      eXoDOS and other eXo collections provide curated game archives and metadata
      consumed by NostalgiApp.
    - DOSBox, ScummVM, MAME, DREAMM, 86Box, and RetroArch provide emulation backends.
    - >
      LaunchBox, OpenEmu, and EmulationStation are related game-library front ends
      discussed by the official site.
  sources:
    - https://www.nostalgi.app/
    - https://www.nostalgi.app/changelog
    - https://www.nostalgi.app/guide
    - source_facts.package-manager
  summary:
    - >
      NostalgiApp is a native macOS library and launcher for eXoDOS, other eXo
      collections, ROMs, and games handled by multiple emulator backends.
  timeline:
    - '2026-02-20: NostalgiApp 1.0.0 was released.'
    - >
      2026-04-12: The batteries-included update bundled major emulator backends and
      added eXoWin9x support.
    - '2026-04-27: iCloud synchronization was introduced.'
    - '2026-06-15: Version 1.1 added storefront libraries and Windows-game support.'
  usage:
    - >
      Users import or download an eXo collection, import folders of ROMs, or connect
      supported game stores, then browse and launch games from one macOS interface. The
      application can configure supported emulators, download games on demand, track
      play activity, and optionally synchronize selected metadata and save files through
      iCloud.
    - >
      The official guide documents application settings and several supporting-data
      directories but does not identify a user-managed NostalgiApp configuration file.
      License activation and optional service sign-ins are handled in the interface
      rather than through a documented credentials file.
