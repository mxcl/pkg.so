id: brew:chain-bench
display-name: Chain-bench
homepage: https://github.com/aquasecurity/chain-bench
repo: https://github.com/aquasecurity/chain-bench
docs:
  - https://aquasecurity.github.io/chain-bench
  - https://aquasecurity.github.io/chain-bench/getting-started/installation
  - https://aquasecurity.github.io/chain-bench/getting-started/quickstart
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Homebrew, Nix, Docker, GitHub
      releases, and GitHub Actions, with GitLab CI support described as beta. Aqua's
      July 2022 blog also listed GitHub Action, Docker image, executable releases, and
      NixOS package routes, showing the project was designed to be consumed both locally
      and in CI.
  package-nerd-significance:
    - >
      Chain-bench is interesting to package maintainers because it packages a compliance
      benchmark as a CLI, Docker image, GitHub Action, and distro package instead of
      only as a SaaS feature. That makes it part of the post-SolarWinds/log4j
      supply-chain tooling wave where checklists became runnable developer tools.
  project-history:
    - >
      Aqua announced Chain-bench on June 22, 2022 alongside the CIS Software Supply
      Chain Security Guide, describing it as an open-source auditing tool for the new
      CIS guidelines. The official README says Chain-bench scans the software delivery
      lifecycle from code time through deploy time and implements CIS Software Supply
      Chain Benchmark checks.
  related-projects:
    - >
      Chain-bench is related to the CIS Software Supply Chain Security Guide, Aqua
      Vulnerability Database compliance checks, Trivy-family Aqua open-source tooling,
      GitHub Actions, GitLab CI, and SCM platforms such as GitHub and GitLab.
  sources:
    - https://github.com/aquasecurity/chain-bench#readme
    - https://github.com/aquasecurity/chain-bench/tree/main/docs
    - https://www.aquasec.com/news/software-supply-chain-security-guide-cis-aqua-security/
    - https://www.aquasec.com/blog/cis-software-supply-chain-compliance/
  summary:
    - >
      Chain-bench is Aqua Security's open-source CLI for auditing software supply-chain
      posture against the CIS Software Supply Chain Security Guide. Its history is bound
      to the 2022 CIS/Aqua push to make supply-chain controls measurable across source
      code, build pipelines, dependencies, artifacts, and deployment.
  timeline:
    - >
      2022: Aqua and CIS released the Software Supply Chain Security Guide and Aqua
      unveiled Chain-bench.
    - >
      2022: Aqua published a getting-started blog for auditing CIS compliance with
      Chain-bench.
    - >
      2026: The README documents Brew, Nix, Docker, release binaries, GitHub Actions,
      and beta GitLab CI usage.
  usage:
    - >
      Users provide a repository URL and an SCM access token, then run chain-bench scan
      to collect organization, repository, branch protection, member, and pipeline
      settings and report pass/fail results for CIS controls. The README documents
      GitHub and GitLab SCM support, personal access token requirements, Docker usage,
      and CI integration.
related-packages:
  - id: brew:trivy
    reason: >
      Use Trivy alongside Chain-bench to scan repositories, images, filesystems, and
      Kubernetes for vulnerabilities, secrets, misconfigurations, licenses, and SBOM
      data while Chain-bench audits CIS supply-chain controls.
    rel: adjacent_workflow
    sources:
      - https://github.com/aquasecurity/chain-bench#readme
      - https://trivy.dev/
  - id: brew:kube-bench
    reason: >
      Use kube-bench for CIS checks on the deployed Kubernetes environment after
      Chain-bench has audited the software-delivery and source-control supply chain.
    rel: adjacent_workflow
    sources:
      - https://github.com/aquasecurity/chain-bench#readme
      - https://github.com/aquasecurity/kube-bench#readme
category: security
package-manager:
  brew: chain-bench
  nix: chain-bench
package-manager-url: https://formulae.brew.sh/formula/chain-bench
license: Apache-2.0
tags:
  - auditing
  - cis-benchmark
  - cli
  - devsecops
  - security
  - software-supply-chain
  - supply-chain-security
description: Software supply chain auditing tool based on CIS benchmark
executables:
  - chain-bench
provenance:
  formula: chain-bench
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
