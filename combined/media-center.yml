history:
  adoption-history:
    - >
      JRiver says it began developing Media Jukebox in 1998 as MP3 adoption accelerated.
      The successor Media Center developed a long-lived enthusiast community around
      large personal media libraries, high-quality audio playback, metadata management,
      customization, and home-theater use.
    - >
      The product expanded from its Windows roots to macOS and Linux. JRiver continues
      to sell platform-specific and cross-platform licenses while maintaining its
      Interact support and development forum.
  package-nerd-significance:
    - >
      JRiver Media Center is notable for combining a player, database-oriented library
      manager, tag editor, transcoder, media server, device synchronizer, television
      recorder, and home-theater interface in one mature package. It has particular
      appeal to audiophiles, home-theater-PC users, obsessive metadata curators, and
      users with very large local libraries.
    - >
      Its long major-version lineage and unusually broad configuration surface make it
      representative of heavyweight desktop media managers that predate streaming-first
      consumption but remain useful for user-owned collections.
  project-history:
    - >
      JRiver was founded in 1981 and initially produced accounting and connectivity
      software. The company began Media Jukebox in 1998, during the early growth of MP3,
      and evolved it into JRiver Media Center.
    - >
      By Media Center 10 in 2004, the product managed music, photographs, and video and
      incorporated ripping, burning, media serving, device support, and online music
      services. Media Center 11 expanded portable-device and UPnP support, while Media
      Center 13 was announced in 2009. Subsequent releases extended the product to macOS
      and Linux and continued its annual major-version cadence.
  related-projects:
    - JRiver Media Jukebox
    - JRiver Media Network
    - JRiver Interact
    - DLNA and UPnP media devices
  sources:
    - https://jriver.com/30.html
    - https://jriver.com/press.html
    - https://jriver.com/press/2009/press43.html
    - https://jriver.com/press/2009/press45.html
    - https://www.jriver.com/mac.html
    - https://www.jriver.com/overview.html
  summary:
    - >
      JRiver Media Center is a commercial cross-platform media player and library
      manager from JRiver, Inc. It organizes and plays audio, video, images, and
      television while also supporting media serving, device synchronization, tagging,
      transcoding, and home-theater workflows.
  timeline:
    - '1981: JRiver was founded.'
    - '1998: Development of Media Jukebox began as MP3 gained popularity.'
    - '2004: Media Center 10 was promoted as an integrated music, photo, and video manager.'
    - '2005: Media Center 11 added broader portable-device and UPnP support.'
    - '2009: JRiver released Media Center 13.'
    - 'Later: Media Center expanded from Windows to macOS and Linux.'
  usage:
    - >
      On first run, Media Center can import media from local folders into its library.
      Users then browse, tag, search, play, convert, stream, or synchronize the indexed
      collection and can configure specialized audio, video, television, networking, and
      Theater View workflows.
    - >
      Licensing uses a permanent registration code to obtain an install key for the
      matching major version and operating system. The official sources reviewed do not
      document a stable macOS credentials-file path.
