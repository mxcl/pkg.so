id: brew:resterm
display-name: resterm
homepage: https://github.com/unkn0wn-root/resterm
repo: https://github.com/unkn0wn-root/resterm
docs:
  - https://github.com/unkn0wn-root/resterm#readme
config-file-location:
  linux:
    - ~/.config/resterm/bindings.toml
    - ~/.config/resterm/bindings.json
    - ~/.config/resterm/themes/*.toml
  macos:
    - ~/Library/Application Support/resterm/bindings.toml
    - ~/Library/Application Support/resterm/bindings.json
    - ~/Library/Application Support/resterm/themes/*.toml
  windows:
    - '%APPDATA%\resterm\bindings.toml'
    - '%APPDATA%\resterm\bindings.json'
    - '%APPDATA%\resterm\themes\*.toml'
credentials-file-location:
  unix:
    - <environment-search-directory>/resterm.env.json
    - <environment-search-directory>/rest-client.env.json
  windows:
    - <environment-search-directory>\resterm.env.json
    - <environment-search-directory>\rest-client.env.json
history:
  adoption-history:
    - >
      Resterm is distributed through Homebrew, Nix, and Scoop according to
      source_facts.package-manager. The project also publishes cross-platform release
      binaries and supports installation from Go source.
    - >
      The official repository's compatibility documentation and version-matched embedded
      manual indicate an emphasis on stable, distributable v1 workflows.
  package-nerd-significance:
    - >
      Resterm treats plain `.http` files as the durable source format, so requests,
      tests, workflows, and mocks can live in version control without a proprietary
      workspace database.
    - >
      It combines a terminal UI with a headless CI runner and unusually broad protocol
      and infrastructure support, including GraphQL, gRPC, WebSocket, SSE, OpenAPI
      import, SSH tunnels, Kubernetes port-forwards, tracing, and mock servers.
  project-history:
    - >
      Resterm was created as an Apache-2.0-licensed terminal API client built around
      editable `.http` and `.rest` files.
    - >
      The project expanded beyond interactive HTTP requests into scripted workflows,
      mocks, profiling, tracing, streaming transports, OpenAPI import, collections, CI
      output, and a purpose-built RestermScript language.
  related-projects:
    - >
      Resterm is compatible with the broader ecosystem of plain `.http` request files
      and serves workflows commonly handled by curl, graphical API clients, and API test
      runners.
  sources:
    - 'Input package coverage: source_facts.package-manager'
    - 'Official repository and documentation: https://github.com/unkn0wn-root/resterm'
  summary:
    - >
      Resterm is a terminal-based, version-control-friendly API client and automation
      runner for plain request files.
  timeline:
    - 'Initial project: Published as a Go terminal client for plain HTTP request files.'
    - >
      Later development: Added GraphQL, gRPC, WebSocket, SSE, workflows, mocks, tracing,
      OpenAPI import, tunneling, collections, and CI-oriented output.
  usage:
    - >
      Users create or open `.http` or `.rest` files, choose an environment, and send
      requests interactively from the terminal UI. `resterm run` executes the same files
      in scripts and CI with JSON or JUnit results.
    - >
      Workspace variables can be placed in `resterm.env.json`; optional dotenv files can
      be selected with `--env-file`. Global themes and keybindings live in the
      OS-specific configuration directory, which can be overridden with
      `RESTERM_CONFIG_DIR`.
category: developer-tools
package-manager:
  brew: resterm
  nix: resterm
  scoop: main/resterm
package-manager-url: https://formulae.brew.sh/formula/resterm
license: Apache-2.0
tags:
  - cli
  - graphql
  - grpc
  - http
  - rest
description: Terminal client for .http/.rest files with HTTP, GraphQL, and gRPC support
executables:
  - resterm
provenance:
  formula: resterm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
