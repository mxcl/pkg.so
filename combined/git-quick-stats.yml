id: brew:git-quick-stats
display-name: git-quick-stats
homepage: https://git-quick-stats.sh/
repo: https://github.com/git-quick-stats/git-quick-stats
docs:
  - https://git-quick-stats.sh/
  - https://github.com/git-quick-stats/git-quick-stats#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-quick-stats has broader package coverage than many small Git helpers: the
      input records Homebrew, Debian, Ubuntu, Alpine, Nix, and Scoop packaging. The
      README also documents apt installation for Debian Bullseye or Ubuntu Focal and
      later, Homebrew installation on macOS, Windows use through Cygwin or WSL, and
      Docker use.
    - >
      The project sits in the long-lived command-line reporting niche around git log,
      providing a friendlier front end for data that Git can expose but that is tedious
      to assemble by hand.
  package-nerd-significance:
    - >
      For package-index users, git-quick-stats is a classic portable shell utility:
      small dependency surface, installation through many OS package managers, and
      behavior built on standard command-line tools such as git, awk, grep, sort, and
      coreutils.
  project-history:
    - >
      The repository began in January 2017 and published its 1.0.0 tag later that month.
      The project organized around a single command that can run as git-quick-stats or
      git quick-stats, giving users an interactive menu as well as non-interactive
      options.
    - >
      Over time the project added package-manager installation paths, Docker support,
      JSON and CSV output modes, time-window filters, pathspec filtering, author
      filtering, heatmaps, timezone breakdowns, and platform notes for GNU date on macOS
      and FreeBSD.
  related-projects:
    - git itself provides the raw log data consumed by git-quick-stats.
    - >
      GNU coreutils supplies GNU date, which the README calls out as a requirement on
      macOS and FreeBSD.
  sources:
    - https://formulae.brew.sh/formula/git-quick-stats
    - https://git-quick-stats.sh/
    - https://github.com/git-quick-stats/git-quick-stats
    - https://github.com/git-quick-stats/git-quick-stats#readme
  summary:
    - >
      git-quick-stats is a Bash-based Git statistics tool that turns commit history into
      interactive and scripted reports about contributors, branches, commit timing,
      changelogs, and reviewer suggestions.
  timeline:
    - '2017: Repository initialized.'
    - '2017: 1.0.0 tag published.'
    - '2024: 2.x series developed after years of 1.x releases.'
    - '2026: 2.11.0 tag published.'
  usage:
    - >
      Practitioners run it inside a Git repository to open the interactive menu or pass
      flags for reports such as detailed stats, branch stats, contributors, commits per
      author, commits by day, commits by hour, branches by date, changelogs, and new
      contributors since a date or tag.
    - >
      Environment variables let users shape reports without separate config files:
      _GIT_SINCE and _GIT_UNTIL bound the log range, _GIT_PATHSPEC excludes paths,
      _GIT_IGNORE_AUTHORS filters people, and _GIT_MERGE_VIEW changes merge handling.
related-packages: []
category: developer-tools
package-manager:
  apk: git-quick-stats
  brew: git-quick-stats
  debian: git-quick-stats
  nix: git-quick-stats
  scoop: main/git-quick-stats
  ubuntu: git-quick-stats
package-manager-url: https://formulae.brew.sh/formula/git-quick-stats
license: MIT
tags:
  - cli
  - commits
  - contributors
  - git
  - statistics
description: Simple and efficient way to access statistics in git
executables:
  - git-quick-stats
provenance:
  formula: git-quick-stats
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
