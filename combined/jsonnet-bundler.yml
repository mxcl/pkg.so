id: brew:jsonnet-bundler
display-name: jsonnet-bundler
homepage: https://github.com/jsonnet-bundler/jsonnet-bundler
repo: https://github.com/jsonnet-bundler/jsonnet-bundler
docs:
  - https://github.com/jsonnet-bundler/jsonnet-bundler#readme
config-file-location:
  unix: jsonnetfile.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents package installation through Homebrew, Fedora, and Arch Linux
      AUR, which reflects adoption beyond source builds. Within Jsonnet projects, its
      importance comes from standardizing the `jb init` and `jb install` workflow and
      the convention of running Jsonnet with `-J vendor`.
  package-nerd-significance:
    - >
      jsonnet-bundler matters because Jsonnet is often used to manage large
      configuration trees, and reusable Jsonnet libraries need reproducible dependency
      layout. For package nerds, `jb` is the small ecosystem-specific manager that makes
      Jsonnet libraries feel installable instead of copy-pasted.
  project-history:
    - >
      The jsonnet-bundler repository was created on GitHub on 2018-04-24, and its first
      commit the same day was titled "Initial commit". The README states the core
      purpose directly: jsonnet-bundler is a package manager for Jsonnet.
    - >
      The tool evolved around a deliberately simple model: initialize a project, record
      dependencies in `jsonnetfile.json`, fetch transitive dependencies, and vendor
      repository subtrees. Its documented limitations, including whole-repository
      downloads and same-version requirements for diamond dependencies, show a pragmatic
      package manager built for Jsonnet library workflows rather than a general
      dependency solver.
  related-projects:
    - >
      jsonnet-bundler is closely tied to Jsonnet itself and to Jsonnet libraries such as
      kustomize-libsonnet, which the README uses as an install example.
  sources:
    - https://api.github.com/repos/jsonnet-bundler/jsonnet-bundler
    - https://formulae.brew.sh/formula/jsonnet-bundler
    - https://github.com/jsonnet-bundler/jsonnet-bundler
    - >
      https://github.com/jsonnet-bundler/jsonnet-bundler/commit/cb59934d1db4e8f5c2596cfb5f146e680c0ecbb0
    - https://github.com/jsonnet-bundler/jsonnet-bundler/releases/tag/v0.2.0
    - https://github.com/jsonnet-bundler/jsonnet-bundler/releases/tag/v0.4.0
    - https://github.com/jsonnet-bundler/jsonnet-bundler/releases/tag/v0.6.0
  summary:
    - >
      jsonnet-bundler is the Jsonnet ecosystem's dependency manager. Its `jb` command
      gives Jsonnet projects a `jsonnetfile.json` manifest and a vendored dependency
      tree, turning Jsonnet libraries into package-manager-addressable building blocks.
  timeline:
    - '2018-04-24: GitHub repository creation and initial commit.'
    - '2020-01-08: v0.2.0 release published.'
    - '2020-05-15: v0.4.0 release published.'
    - '2024-08-23: v0.6.0 release published.'
  usage:
    - >
      A typical project runs `jb init`, gains a `jsonnetfile.json`, installs a
      dependency from a GitHub repository, imports files from the vendored package, and
      passes `-J vendor` to Jsonnet so imports resolve through the vendor tree.
related-packages:
  - id: brew:jsonnet
    reason: >
      jsonnet-bundler installs libraries for the original Jsonnet interpreter, which
      resolves the vendored sources through its `-J vendor` import path.
    rel: adjacent_workflow
    sources:
      - https://github.com/jsonnet-bundler/jsonnet-bundler
      - https://github.com/google/jsonnet
  - id: brew:go-jsonnet
    reason: >
      go-jsonnet is a production-ready Jsonnet implementation that can evaluate
      libraries installed into a project by jsonnet-bundler.
    rel: adjacent_workflow
    sources:
      - https://github.com/jsonnet-bundler/jsonnet-bundler
      - https://github.com/google/go-jsonnet
  - id: brew:tanka
    reason: >
      Tanka officially recommends jsonnet-bundler for installing and publishing the
      Jsonnet libraries used in its Kubernetes configuration workflow.
    rel: adjacent_workflow
    sources:
      - https://tanka.dev/libraries/install-publish/
      - https://github.com/jsonnet-bundler/jsonnet-bundler
category: developer-tools
package-manager:
  apk: jsonnet-bundler
  brew: jsonnet-bundler
  macports: jsonnet-bundler
  nix: jsonnet-bundler
package-manager-url: https://formulae.brew.sh/formula/jsonnet-bundler
license: Apache-2.0
tags:
  - cli
  - dependency-management
  - jsonnet
  - package-manager
description: Package manager for Jsonnet
executables:
  - jb
provenance:
  formula: jsonnet-bundler
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
