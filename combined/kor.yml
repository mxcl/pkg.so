id: brew:kor
display-name: Kor
homepage: https://github.com/yonahd/kor
repo: https://github.com/yonahd/kor
docs:
  - https://github.com/yonahd/kor#readme
config-file-location: null
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      Kor's adoption signal is mostly Kubernetes-operator packaging rather than a long
      institutional history. The README documents Homebrew, Go install, Docker, Krew,
      and Helm installation paths, which made the tool available in the normal places
      Kubernetes users look for cleanup utilities.
    - >
      GitHub repository metadata observed on 2026-07-01 reported 1,802 stars and 148
      forks, enough to indicate real Kubernetes community interest despite the project's
      relatively recent start.
  package-nerd-significance:
    - >
      Kor is package-nerd interesting because it is a narrow, single-purpose Kubernetes
      hygiene tool that shows how operational chores become installable CLIs.
    - >
      Its distribution across Homebrew, Krew, Helm, Docker, Nix, and zypper is the real
      story: each packaging channel maps to a different operator workflow, from laptop
      audit to in-cluster scheduled scan.
  project-history:
    - >
      The GitHub repository was created on 2023-07-05. The README describes Kor as a
      Kubernetes Orphaned Resources Finder and lists Kubernetes object types such as
      ConfigMaps, Secrets, Services, PVCs, Ingresses, CRDs, PVs, Pods, Jobs,
      ReplicaSets, DaemonSets, StorageClasses, NetworkPolicies, and VolumeAttachments.
    - >
      Release metadata shows early v0.1.x releases in July and August 2023, beginning
      with v0.1.2 on 2023-07-23. The project later added chart-oriented releases and
      documentation for running Kor as a cron job or deployment with Prometheus metrics.
  related-projects:
    - >
      Kor belongs with kubectl plugins, kube-no-trouble, popeye, kube-score,
      kube-linter, and other Kubernetes audit or hygiene tools.
    - >
      KorPro is documented by the project as a cloud platform built on top of Kor for
      organizations that want multi-cloud management, cost analysis, and analytics.
  sources:
    - https://api.github.com/repos/yonahd/kor
    - https://github.com/yonahd/kor
    - https://github.com/yonahd/kor/releases
  summary:
    - >
      Kor is a Kubernetes cleanup CLI focused on finding unused or orphaned resources.
      Its history is short but package-relevant because it packages a common
      cluster-hygiene job as a small Go command, Helm deployment, Docker image, and
      kubectl plugin.
  timeline:
    - '2023-07-05: GitHub repository created.'
    - '2023-07-23: v0.1.2 published in GitHub release metadata.'
    - '2023-08-01: v0.1.6 published in GitHub release metadata.'
    - '2026-07-01: GitHub repository metadata reported 1,802 stars and 148 forks.'
  usage:
    - >
      Users run Kor against a cluster to list resources that appear unused, or deploy it
      in-cluster for scheduled scans and metrics. The README also documents labels for
      ignoring resources or forcing cleanup decisions, which is important because
      Kubernetes cleanup can be risky when ownership is unclear.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Kor is distributed as a kubectl plugin through Krew and uses the same
      kubeconfig-based cluster access, making kubectl its natural companion for
      inspecting or correcting flagged resources.
    rel: adjacent_workflow
    sources:
      - https://github.com/yonahd/kor#readme
      - https://kubernetes.io/docs/reference/kubectl/
category: cloud-infrastructure
package-manager:
  brew: kor
  nix: kor
  zypper: kor
package-manager-url: https://formulae.brew.sh/formula/kor
license: MIT
tags:
  - cleanup
  - cli
  - kubernetes
  - orphaned-resources
description: CLI tool to discover unused Kubernetes resources
executables:
  - kor
provenance:
  formula: kor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
