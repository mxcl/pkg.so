id: brew:mongo-c-driver@1
display-name: MongoDB C Driver
homepage: https://github.com/mongodb/mongo-c-driver
repo: https://github.com/mongodb/mongo-c-driver
docs:
  - https://www.mongodb.com/docs/languages/c/c-driver/current
  - https://github.com/mongodb/mongo-c-driver#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The upstream role is the same as mongo-c-driver generally: libmongoc is the C
      client library for MongoDB, and libbson provides BSON construction, parsing, and
      iteration. MongoDB's v1.x release-note page documents the 1.30 series and other
      maintained 1.x releases, while the combined release notes show 2.0.0 as a breaking
      release that removed deprecated APIs. The practical package-manager distinction is
      therefore not a different project history but a major-version boundary.
  sources:
    - https://formulae.brew.sh/formula/mongo-c-driver@1
    - https://mongoc.org/
    - https://www.mongodb.com/docs/languages/c/c-driver/current/
    - https://www.mongodb.com/docs/languages/c/c-driver/current/reference/release-notes/
    - https://www.mongodb.com/docs/languages/c/c-driver/v1.x/reference/release-notes/
  summary:
    - >
      mongo-c-driver@1 is Homebrew's versioned formula for the 1.x line of MongoDB's
      official C driver. It points at the same upstream mongo-c-driver project as the
      main formula, but Homebrew marks it as a deprecated, keg-only package. That makes
      it a compatibility package for builds that still need the 1.x libmongoc/libbson
      ABI or have not moved to the 2.x formula.
  usage:
    - >
      In use, mongo-c-driver@1 is selected by software with conservative dependency
      constraints, older bindings, or build systems that expect 1.x library names and
      headers. It is much more niche than the main formula: Homebrew's package page
      reports far fewer installs than mongo-c-driver, matching its role as a transition
      and compatibility package rather than the default driver.
related-packages:
  - id: brew:mongo-c-driver
    reason: >
      Migrate to the unversioned formula for the current driver API, newer MongoDB
      feature support, and the preferred path for new C applications.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/mongo-c-driver
      - https://www.mongodb.com/docs/languages/c/c-driver/current/
      - https://www.mongodb.com/docs/drivers/compatibility/?driver-language=c
  - id: brew:mongo-orchestration
    reason: >
      Use Mongo Orchestration to create disposable MongoDB topologies when
      integration-testing legacy applications that still use the 1.x driver.
    rel: adjacent_workflow
    sources:
      - https://github.com/mongodb/mongo-c-driver
      - https://github.com/mongodb-labs/mongo-orchestration
category: developer-tools
package-manager:
  apk: libbson
  brew: mongo-c-driver@1
  debian: libbson-1.0-0t64
  dnf: libbson
  macports: mongo-c-driver
  pacman: mongo-c-driver
  ubuntu: libbson-1.0-0t64
  zypper: bson-devel
package-manager-match:
  apk: fallback
  debian: fallback
  dnf: fallback
  macports: fallback
  pacman: fallback
  ubuntu: fallback
  zypper: fallback
package-manager-url: https://formulae.brew.sh/formula/mongo-c-driver@1
license: Apache-2.0
tags:
  - c
  - cli
  - database-driver
  - libbson
  - libmongoc
  - mongodb
description: C driver for MongoDB
executables:
  - mongoc-stat
provenance:
  formula: mongo-c-driver@1
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
