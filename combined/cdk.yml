id: brew:cdk
display-name: CDK
homepage: https://invisible-island.net/cdk/
repo: https://github.com/ThomasDickey/cdk-snapshots
docs:
  - https://invisible-island.net/cdk
  - https://invisible-island.net/cdk/manpage
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official history notes that CDK had already been built on several Unix
      systems, including Linux, SunOS, Solaris, HP-UX, AIX, and QNX 4. It also records
      ncurses mailing-list discussion from the late 1990s in which CDK was suggested to
      users wanting a higher-level interface than raw ncurses.
    - >
      CDK's distribution history is tied to classic Unix source-package culture:
      comp.sources.unix announcements, QNX-hosted tarballs, ncurses-adjacent
      maintenance, and ports or packages across Unix-like systems.
  package-nerd-significance:
    - >
      For package maintainers, CDK is interesting because it sits between low-level
      ncurses and full-screen TUI applications: it is a small library whose portability,
      ABI, licensing, and configure-script behavior mattered across many Unix packaging
      systems.
  project-history:
    - >
      The project was originally written by Mike Glover in the mid-1990s. Thomas E.
      Dickey's official history identifies CDK 4.6.0, with source files dated January
      20, 1996, as the earliest version he had encountered and notes that Glover
      announced it in comp.sources.unix in January 1996.
    - >
      Dickey became involved after Glover asked in late 1998 about distributing CDK with
      ncurses. Dickey reviewed the 4.9.8 code, reworked build and licensing issues,
      continued cleanup work, and released CDK 5.0 in April 2005.
  related-projects:
    - >
      CDK is closely related to curses and ncurses, and its official page compares its
      role to dialog while emphasizing that CDK is a linkable widget library rather than
      a standalone dialog program.
  sources:
    - https://invisible-island.net/cdk/
    - https://invisible-island.net/cdk
    - https://invisible-island.net/cdk/manpage
    - https://formulae.brew.sh/api/formula/cdk.json
  summary:
    - >
      CDK, the Curses Development Kit, is a C curses widget library for building
      terminal user interfaces. Its official Invisible Island page describes it as a
      library of customizable curses widgets, similar in spirit to dialog but linked
      into applications.
  timeline:
    - '1996: CDK 4.6.0 announced in comp.sources.unix and distributed as source.'
    - '1998: Mike Glover asks Thomas E. Dickey about distributing CDK with ncurses.'
    - '1999: Dickey begins cleanup, configure-script work, and license repair.'
    - '2005: CDK 5.0 released by Dickey.'
  usage:
    - >
      CDK is used when a C program needs form, dialog, menu, scrolling-list, and other
      terminal widgets without building every curses interaction from scratch. The
      Homebrew package exposes cdk5-config for build flags and metadata.
related-packages:
  - id: brew:dialog
    reason: >
      Choose dialog when shell scripts need ready-made curses dialogs as a standalone
      command; choose CDK when C applications need linkable and customizable widget
      objects.
    rel: alternative
    sources:
      - https://invisible-island.net/cdk/
      - https://invisible-island.net/dialog/
  - id: brew:ncurses
    reason: >
      ncurses supplies the lower-level terminal and screen API on which CDK builds its
      higher-level widget library.
    rel: adjacent_workflow
    sources:
      - https://invisible-island.net/cdk/
      - https://invisible-island.net/ncurses/
category: developer-tools
package-manager:
  brew: cdk
  debian: libcdk-java
  dnf: cdk
  nix: cdk
  ubuntu: libcdk-java
  zypper: cdk-devel
package-manager-url: https://formulae.brew.sh/formula/cdk
license: X11-distribute-modifications-variant
tags:
  - c-library
  - cli
  - curses
  - terminal-ui
  - tui
  - widgets
description: Curses development kit provides predefined curses widget for apps
executables:
  - cdk5-config
provenance:
  formula: cdk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
