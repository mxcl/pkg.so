id: brew:opendetex
display-name: OpenDetex
homepage: https://github.com/pkubowicz/opendetex
repo: https://github.com/pkubowicz/opendetex
docs:
  - https://github.com/pkubowicz/opendetex#readme
  - https://github.com/pkubowicz/opendetex/blob/master/detex.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenDetex's adoption is mostly through TeX and Unix packaging channels rather than
      a large application ecosystem. It appears in Homebrew and MacPorts as `opendetex`,
      while manual pages in Linux distributions preserve the authorship chain from
      Trinkle's original program to Kubowicz's maintenance.
  package-nerd-significance:
    - >
      OpenDetex matters because it is a tiny maintenance fork that kept a useful
      academic Unix utility alive after the original author retired it. Its packaging
      story is the familiar one for old document-processing tools: the interface remains
      small, but users value it because it fits cleanly into shell pipelines.
  project-history:
    - >
      Daniel Trinkle's DeTeX originated at Purdue University and was distributed from
      his personal academic page. Trinkle's page points users to OpenDetex as the more
      modern derivative, and CTAN marks the original `detex` package as retired in favor
      of Piotr Kubowicz's OpenDetex.
  related-projects:
    - >
      OpenDetex is directly descended from DeTeX and sits near other TeX-adjacent text
      extraction tools, but it keeps the narrower goal of removing TeX constructs
      instead of converting documents through a full typesetting or markup conversion
      pipeline.
  sources:
    - https://ctan.org/pkg/detex
    - https://formulae.brew.sh/formula/opendetex
    - https://github.com/pkubowicz/opendetex
    - https://github.com/pkubowicz/opendetex/blob/master/README
    - https://man.archlinux.org/man/extra/texlive-bin/detex.1.en
    - https://www.cs.purdue.edu/homes/trinkle/detex/
  summary:
    - >
      OpenDetex is the maintained successor line of DeTeX, a utility that strips TeX and
      LaTeX markup from source documents to produce readable plain text. It preserves
      the old tool's package-nerd charm: a focused lexer-style command-line program with
      decades of TeX workflow inertia behind it.
  timeline:
    - >
      2004: Daniel Trinkle's DeTeX page was last modified and later directed users to
      OpenDetex.
    - OpenDetex was created from DeTeX 2.8 by Piotr Kubowicz, according to the project README.
  usage:
    - >
      Users run the command-line program over TeX or LaTeX sources when they need
      approximate plain text for indexing, spell checking, word counting, or review
      workflows. The tool intentionally removes commands rather than trying to typeset
      or fully understand a TeX document.
related-packages:
  - id: brew:pandoc
    reason: >
      Choose Pandoc when you need to convert LaTeX into another structured document
      format rather than merely strip commands to obtain plain text.
    rel: alternative
    sources:
      - https://github.com/pkubowicz/opendetex
      - https://pandoc.org/MANUAL.html
  - id: brew:latexml
    reason: >
      Choose LaTeXML when TeX structure, mathematics, and cross-references must be
      preserved in XML, HTML, MathML, or EPUB output.
    rel: alternative
    sources:
      - https://github.com/pkubowicz/opendetex
      - https://math.nist.gov/~BMiller/LaTeXML/manual/usage/
category: productivity
