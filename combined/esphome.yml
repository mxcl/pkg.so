id: brew:esphome
display-name: ESPHome
homepage: https://esphome.io/
repo: https://github.com/esphome/esphome
docs:
  - https://developers.esphome.io/
  - https://esphome.io/
config-file-location:
  unix: <config-directory>/*.yaml
credentials-file-location:
  unix: <config-directory>/secrets.yaml
history:
  adoption-history:
    - >
      ESPHome adoption tracks the Home Assistant ecosystem. The 1.7.0 changelog reports
      a sixfold growth in GitHub clones after Home Assistant coverage, and later
      documentation frames the ESPHome Device Builder as an easy Home Assistant app for
      creating, editing, installing, and updating device configurations.
    - >
      By 2023 the project was extending beyond basic sensors and switches into voice
      assistant work for Home Assistant Assist, and its release notes announced a
      dedicated Voice Assistant component. In 2024, Nabu Casa donated ESPHome to the
      Open Home Foundation, aligning it formally with Home Assistant governance while
      keeping day-to-day development supported by Nabu Casa.
  package-nerd-significance:
    - >
      ESPHome is a packaging sweet spot: it turns embedded firmware generation into a
      host-side CLI package, while also pulling together PlatformIO, microcontroller
      SDKs, YAML validation, generated C++ code, OTA updates, and Home Assistant
      discovery into one repeatable workflow.
  project-history:
    - >
      Early ESPHome releases used the esphomelib and esphomeyaml names, and the
      project's own 1.7.0 changelog describes a rapid user increase after a Home
      Assistant blog post. Over time the project consolidated around ESPHome as the
      user-facing tool and documentation site.
    - >
      The core idea stayed unusually package-friendly: users write YAML configuration,
      ESPHome generates firmware, and that firmware is installed directly onto the
      device. The official getting started guide describes the system as having a
      device-side part and a computer-side or builder-side part, which explains why the
      package is both a CLI tool and an ecosystem around device definitions.
  related-projects:
    - >
      Home Assistant is the central integration target; ESPHome also sits alongside
      firmware projects such as Tasmota and Espurna because its documentation includes
      migration guides from both.
  sources:
    - https://github.com/esphome/esphome
    - https://esphome.io/guides/getting_started_hassio/
    - https://esphome.io/changelog/v1.7.0/
    - https://esphome.io/changelog/2023.4.0/
    - https://esphome.io/changelog/2024.6.0/
  summary:
    - >
      ESPHome is a configuration-driven firmware system for turning ESP32, ESP8266,
      BK72xx, RP2040, and related microcontroller boards into Home Assistant-friendly
      smart home devices.
  timeline:
    - '2018: Version 1.7.0 changelog describes esphomelib growth after Home Assistant coverage.'
    - '2023: Voice Assistant component added for Home Assistant Assist workflows.'
    - '2024: Nabu Casa donates ESPHome to the Open Home Foundation.'
  usage:
    - >
      Users normally create one or more YAML files per device, validate and compile them
      with the ESPHome tooling or Device Builder, install the generated firmware over
      USB or serial for first setup, then perform later updates over the air when
      supported by the device configuration.
    - >
      The package matters in day-to-day home automation because hardware declared in the
      YAML configuration, such as sensors, switches, lights, and binary sensors,
      automatically appears in Home Assistant after the device is installed and
      connected.
related-packages:
  - id: brew:esptool
    reason: >
      Use esptool when you need direct serial flashing or low-level inspection of an
      ESPHome-generated firmware image outside ESPHome's normal upload workflow.
    rel: adjacent_workflow
    sources:
      - https://esphome.io/guides/getting_started_command_line/
      - https://docs.espressif.com/projects/esptool/en/latest/esp32/esptool/basic-commands.html
  - id: brew:platformio
    reason: >
      PlatformIO is a useful companion when an ESPHome configuration uses the PlatformIO
      toolchain or when you need to inspect and work with the generated embedded
      project.
    rel: adjacent_workflow
    sources:
      - https://esphome.io/guides/cli/
      - https://developers.esphome.io/architecture/overview/
      - https://docs.platformio.org/en/latest/core/index.html
category: developer-tools
package-manager:
  brew: esphome
  nix: esphome
  pacman: esphome
package-manager-url: https://formulae.brew.sh/formula/esphome
license: MIT
tags:
  - cli
  - esp32
  - esp8266
  - firmware
  - home-automation
  - iot
  - yaml
description: Make creating custom firmwares for ESP32/ESP8266 super easy
executables:
  - esphome
provenance:
  formula: esphome
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
