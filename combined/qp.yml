id: brew:qp
display-name: qp
homepage: https://github.com/f5io/qp
repo: https://github.com/f5io/qp
docs:
  - https://github.com/f5io/qp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records Homebrew distribution. The upstream README
      additionally provides a shell installer; it does not establish broader adoption.
  package-nerd-significance:
    - >
      Compiling with QuickJS produces a standalone command-line program without runtime
      dependencies, pairing JavaScript implementation techniques with Unix pipeline
      usage.
  project-history:
    - >
      The upstream project presents query-pipe as a JSON query tool using SQL-inspired
      syntax and a recursive-descent parser. Its README retains Paybase references in
      installation and build instructions; these alone do not establish a dated
      ownership history.
  related-projects:
    - QuickJS is used to build the executable.
  sources:
    - https://github.com/f5io/qp#readme
    - source_facts.package-manager
  summary:
    - >
      query-pipe, invoked as qp, filters and transforms JSON and newline-delimited JSON
      on the command line.
  timeline:
    - 'Build design: Upstream documents compilation with QuickJS.'
  usage:
    - >
      Pipe JSON into qp and supply a query using select, where, limit, or offset.
      Without arguments, it passes valid JSON through; --syntax displays the query
      guide.
category: data
package-manager:
  brew: qp
package-manager-url: https://formulae.brew.sh/formula/qp
license: MIT
tags:
  - cli
  - data-filtering
  - json
  - ndjson
  - pipeline
  - query-language
description: Command-line (ND)JSON querying
executables:
  - qp
provenance:
  formula: qp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
