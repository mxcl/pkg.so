id: brew:davix
display-name: Davix
homepage: https://github.com/cern-fts/davix
repo: https://github.com/cern-fts/davix
docs:
  - https://davix.web.cern.ch/davix/docs/devel
  - https://davix.web.cern.ch/
  - https://github.com/cern-fts/davix#readme
config-file-location: null
credentials-file-location:
  unix:
    - ~/.netrc
    - ~/.davixrc
history:
  adoption-history:
    - >
      Davix adoption follows high-energy-physics and grid-storage needs: it packages
      HTTP, WebDAV, X.509, VOMS, S3, and Azure-style access behind a shared library and
      Unix-style command-line tools.
  package-nerd-significance:
    - >
      Davix matters to package catalogs because it is the pragmatic glue between
      scientific storage infrastructure and ordinary command-line file operations.
  project-history:
    - >
      The Davix README says the project is developed by CERN IT for CERN grid use while
      keeping the functionality generic. Its official documentation presents the same
      focus on HTTP-based file management and grid-oriented authentication.
  related-projects:
    - >
      Related technologies include WebDAV, HTTP, CERN grid storage, VOMS, X.509 proxies,
      S3-compatible storage, Azure-compatible storage, and ROOT's TDavixFile
      integration.
  sources:
    - https://github.com/cern-fts/davix/blob/devel/README.md
    - https://davix.web.cern.ch/
    - https://davix.web.cern.ch/davix/docs/devel
  summary:
    - >
      Davix is a CERN-developed library and command-line tool suite for managing files
      over HTTP-based protocols such as WebDAV, S3-compatible services, and
      Azure-compatible services.
  timeline:
    - '2010s: Davix is developed at CERN for grid-oriented HTTP file management.'
    - '2016: Official documentation describes Davix 0.7-era usage and installation.'
    - >
      2020s: The GitHub repository remains the official development location, mirrored
      to CERN GitLab for CI.
  usage:
    - >
      Package users typically use tools such as `davix-get`, `davix-put`, `davix-ls`,
      and `davix-rm`, or link against libdavix through file-oriented and POSIX-like
      APIs.
related-packages:
  - id: brew:curl
    reason: >
      Choose curl for general HTTP transfers and manually constructed WebDAV requests;
      choose Davix when you need higher-level remote file operations plus grid
      credentials, VOMS, vector I/O, or CERN-oriented storage support.
    rel: alternative
    sources:
      - https://github.com/cern-fts/davix
      - https://curl.se/docs/faq.html
      - https://curl.se/docs/manpage.html
category: networking
package-manager:
  brew: davix
  debian: davix
  dnf: davix
  macports: davix
  nix: davix
  pacman: davix
  ubuntu: davix
  zypper: davix
package-manager-url: https://formulae.brew.sh/formula/davix
license: LGPL-2.1-or-later
tags:
  - cern
  - cli
  - file-transfer
  - http
  - s3
  - webdav
description: Library and tools for advanced file I/O with HTTP-based protocols
executables:
  - davix-get
  - davix-http
  - davix-ls
  - davix-mkdir
  - davix-mv
  - davix-put
  - davix-rm
provenance:
  formula: davix
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
