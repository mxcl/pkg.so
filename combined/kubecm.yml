id: brew:kubecm
display-name: KubeCM
homepage: https://kubecm.cloud
repo: https://github.com/sunny0826/kubecm
docs:
  - https://github.com/sunny0826/kubecm#readme
  - https://kubecm.cloud
config-file-location:
  unix: ~/.kube/config
credentials-file-location: null
history:
  adoption-history:
    - >
      KubeCM sits in the same everyday-operator niche as kubectx and kubens: tools that
      reduce friction around switching clusters and namespaces. Its documented install
      paths include Homebrew, GitHub release binaries, and Krew as the kc plugin, which
      covers both standalone CLI users and kubectl-plugin users.
  package-nerd-significance:
    - >
      KubeCM is package-nerd-significant as a quality-of-life CLI rather than as
      infrastructure plumbing. It packages a pile of tiny kubeconfig edits into one
      cross-platform binary that can be installed with Homebrew or Krew and carried
      across developer machines.
    - >
      Its popularity reflects a Kubernetes reality: once users touch many clusters, the
      kubeconfig file becomes a database they need tools to query, merge, and prune.
  project-history:
    - >
      The sunny0826/kubecm repository was created on 2019-07-23, and the first GitHub
      release, v0.0.1, was published on 2019-07-25. The README describes the project
      plainly as a way to manage kubeconfig more easily.
    - >
      As the project evolved, its README highlighted context management, kubeconfig
      merging, interactive selection, a Git-backed registry for team distribution,
      multi-platform support, and shell completion.
  related-projects:
    - kubectl is the command-line client whose kubeconfig state KubeCM helps manage.
    - Krew distributes KubeCM as the kc kubectl plugin.
    - >
      kubectx and kubens are adjacent context and namespace switching tools in the same
      operator-workflow space.
  sources:
    - https://api.github.com/repos/sunny0826/kubecm
    - https://api.github.com/repos/sunny0826/kubecm/releases
    - https://formulae.brew.sh/formula/kubecm
    - https://github.com/sunny0826/kubecm
    - https://krew.sigs.k8s.io/plugins/
    - https://kubecm.cloud
  summary:
    - >
      KubeCM is a kubeconfig manager for Kubernetes users who work with multiple
      clusters, namespaces, and context files. It wraps common kubeconfig chores such as
      listing, switching, merging, deleting, and distributing configurations behind an
      interactive CLI.
  timeline:
    - '2019-07-23: GitHub repository created.'
    - '2019-07-25: GitHub release v0.0.1 published.'
    - '2019-07-26: GitHub release v0.0.2 published.'
    - '2026-03-09: GitHub release v0.35.1 published.'
  usage:
    - >
      The tool is centered on ~/.kube/config and related kubeconfig files. Users employ
      it to switch contexts, merge files, clean up entries, and share cluster access
      definitions through the registry feature.
    - >
      Because kubeconfig files may contain sensitive access material, KubeCM is
      operationally adjacent to credentials even though it does not define a separate
      credentials store of its own.
related-packages:
  - id: brew:kubectx
    reason: >
      Choose kubectx for a narrower context-and-namespace switching workflow; choose
      KubeCM when you also need kubeconfig merging, cleanup, importing, or
      registry-based distribution.
    rel: alternative
    sources:
      - https://kubecm.cloud/
      - https://github.com/ahmetb/kubectx/blob/master/README.md
  - id: brew:kubie
    reason: >
      Choose Kubie when isolated per-shell contexts, namespace switching, and split
      kubeconfig discovery matter more than KubeCM's broader file-management and
      registry features.
    rel: alternative
    sources:
      - https://kubecm.cloud/
      - https://github.com/kubie-org/kubie
category: developer-tools
package-manager:
  brew: kubecm
  nix: kubecm
package-manager-url: https://formulae.brew.sh/formula/kubecm
license: Apache-2.0
tags:
  - cli
  - context-management
  - kubeconfig
  - kubectl
  - kubernetes
description: KubeConfig Manager
executables:
  - kubecm
provenance:
  formula: kubecm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
