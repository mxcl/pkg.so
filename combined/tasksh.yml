id: brew:tasksh
display-name: tasksh
homepage: https://github.com/GothenburgBitFactory/taskshell
repo: https://github.com/GothenburgBitFactory/taskshell
docs:
  - https://taskwarrior.org/docs
  - https://gothenburgbitfactory.org/tasksh
config-file-location:
  unix:
    - ~/.taskrc
    - $TASKRC
credentials-file-location: null
history:
  adoption-history:
    - >
      tasksh is packaged as a small companion CLI for Taskwarrior users rather than as a
      general task manager. The input package metadata lists it in multiple Unix package
      ecosystems, including Homebrew, Debian, Ubuntu, Fedora, Alpine, MacPorts, and Nix,
      which reflects its role as a familiar optional shell for Taskwarrior
      installations.
  package-nerd-significance:
    - >
      For package-manager users, tasksh matters because it split a useful but
      historically bundled workflow into a small, independently versioned executable. It
      is the kind of package that shows up beside a larger CLI because experienced users
      want the old interactive behavior without pinning the whole Taskwarrior stack.
  project-history:
    - >
      Gothenburg Bit Factory describes Taskshell as a replacement for the older built-in
      Taskwarrior shell command and the unsupported tasksh program bundled with
      Taskwarrior 2.3.0. The project's own changelog records the start of the standalone
      project on 2014-06-08, followed by the 1.0.0 release in 2014 with libreadline
      support for command editing and history.
    - >
      The project later added review-oriented workflow features and Taskwarrior
      diagnostics in the 1.1.0 series, then continued as a separately released companion
      utility rather than being tied to Taskwarrior's main release cadence.
  related-projects:
    - Taskwarrior is the task database and CLI that tasksh wraps.
    - >
      Gothenburg Bit Factory also publishes related command-line productivity tools such
      as Timewarrior.
  sources:
    - https://api.github.com/repos/GothenburgBitFactory/taskshell/releases
    - https://github.com/GothenburgBitFactory/taskshell/blob/master/ChangeLog
    - https://gothenburgbitfactory.org/tasksh/
    - input.source_facts.package-manager
  summary:
    - >
      tasksh is the standalone Taskwarrior shell, a readline-oriented wrapper for
      repeated Taskwarrior commands.
  timeline:
    - '2014: Project started, according to the upstream ChangeLog.'
    - '2014: 1.0.0 released with libreadline support.'
    - '2016: 1.1.0 added review and diagnostic commands.'
    - >
      2017: 1.2.0 released upstream; GitHub release metadata later republishes the
      release set in 2022.
  usage:
    - >
      Users install tasksh when they want an interactive command loop for Taskwarrior
      with readline conveniences and the project's review command, instead of repeatedly
      invoking the task command from a regular shell.
category: productivity
package-manager:
  apk: tasksh
  brew: tasksh
  debian: tasksh
  dnf: tasksh
  macports: tasksh
  nix: tasksh
  ubuntu: tasksh
package-manager-url: https://formulae.brew.sh/formula/tasksh
license: MIT
tags:
  - cli
  - readline
  - shell
  - tasks
  - taskwarrior
description: Shell wrapper for Taskwarrior commands
executables:
  - tasksh
provenance:
  formula: tasksh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
