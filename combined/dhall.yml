id: brew:dhall
display-name: Dhall
homepage: https://dhall-lang.org/
repo: https://github.com/dhall-lang/dhall-haskell
docs:
  - https://docs.dhall-lang.org/
  - https://dhall-lang.org/
  - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official Dhall documentation frames the language around programmable configuration
      files: reducing repetition while keeping stronger safety properties than
      general-purpose scripting languages. The official production-use page records
      adoption by integrations and companies using Dhall for package sets, server
      configuration, Kubernetes, CI, CloudFormation, and product configuration models.
  package-nerd-significance:
    - >
      Dhall matters to package nerds because it sits at the boundary between programming
      languages and boring config files. It offers imports, functions, types,
      normalization, and hashes while intentionally avoiding unrestricted effects and
      Turing completeness, so package maintainers can ship configuration logic without
      shipping a general scripting environment.
  project-history:
    - >
      The first Hackage dhall 1.0.0 package metadata names Gabriel Gonzalez as author,
      carries 2016 copyright, and describes Dhall as a configuration language guaranteed
      to terminate. The dhall-lang/dhall-haskell repository was created in 2016 and
      remains the official Haskell implementation.
  related-projects:
    - dhall-yaml converts Dhall expressions to and from YAML.
    - dhall-json provides JSON conversion tooling.
    - dhall-lang/dhall-lang hosts the language documentation and specification material.
  sources:
    - https://hackage.haskell.org/package/dhall-1.0.0
    - https://hackage.haskell.org/package/dhall-1.0.0/dhall.cabal
    - https://api.github.com/repos/dhall-lang/dhall-haskell
    - https://api.github.com/repos/dhall-lang/dhall-lang
    - https://docs.dhall-lang.org/discussions/Programmable-configuration-files.html
    - https://docs.dhall-lang.org/discussions/Safety-guarantees.html
    - https://docs.dhall-lang.org/discussions/Dhall-in-production.html
  summary:
    - >
      Dhall is a typed, terminating configuration language with a command-line
      interpreter. Its package-manager identity is unusual: it is a language runtime
      shipped like a CLI utility, most often installed to make large configuration files
      safer, less repetitive, and easier to generate.
  timeline:
    - '2016: dhall 1.0.0 is published on Hackage as a terminating configuration language.'
    - '2016: dhall-lang/dhall-haskell is created as the Haskell implementation repository.'
    - >
      2017: dhall-lang/dhall-lang is created for language documentation and
      specification material.
    - >
      2026: Official documentation continues to organize Dhall around tutorials,
      how-tos, references, and production use.
  usage:
    - >
      The dhall executable parses, type-checks, evaluates, and pretty-prints Dhall
      expressions. In practice users combine it with converters such as dhall-to-json
      and dhall-to-yaml when a target tool still expects JSON or YAML.
related-packages:
  - id: brew:dhall-json
    reason: >
      Use dhall-json to render type-checked Dhall expressions as JSON for applications
      that cannot consume Dhall directly.
    rel: adjacent_workflow
    sources:
      - https://docs.dhall-lang.org/tutorials/Getting-started_Generate-JSON-or-YAML.html
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-json
  - id: brew:dhall-yaml
    reason: >
      Use dhall-yaml when the downstream system expects YAML; the official integration
      guide identifies its dhall-to-yaml-ng executable as the YAML conversion path.
    rel: adjacent_workflow
    sources:
      - https://docs.dhall-lang.org/howtos/How-to-integrate-Dhall.html
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-yaml
  - id: brew:dhall-bash
    reason: >
      Use dhall-bash to marshal checked Dhall values into Bash syntax for shell-based
      configuration workflows.
    rel: adjacent_workflow
    sources:
      - https://docs.dhall-lang.org/howtos/How-to-integrate-Dhall.html
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-bash
  - id: brew:dhall-toml
    reason: >
      Use dhall-toml to bridge Dhall configuration and TOML within the official Haskell
      toolchain.
    rel: adjacent_workflow
    sources:
      - https://github.com/dhall-lang/dhall-haskell
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-toml
  - id: brew:dhall-lsp-server
    reason: >
      Use dhall-lsp-server alongside the interpreter for editor diagnostics, navigation,
      formatting, and other language-aware authoring support.
    rel: adjacent_workflow
    sources:
      - https://docs.dhall-lang.org/howtos/Text-editor-configuration.html
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-lsp-server
category: language-runtime
package-manager:
  brew: dhall
  debian: dhall
  dnf: dhall
  nix: dhall
  pacman: dhall
  scoop: main/dhall
  ubuntu: dhall
package-manager-url: https://formulae.brew.sh/formula/dhall
license: BSD-3-Clause
tags:
  - cli
  - configuration-language
  - dhall
  - functional-language
  - haskell
  - interpreter
description: Interpreter for the Dhall language
executables:
  - dhall
provenance:
  formula: dhall
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
