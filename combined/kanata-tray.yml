id: brew:kanata-tray
display-name: Kanata Tray
homepage: https://github.com/rszyma/kanata-tray
repo: https://github.com/rszyma/kanata-tray
docs:
  - https://github.com/rszyma/kanata-tray#readme
config-file-location:
  linux:
    - ~/.config/kanata-tray/kanata-tray.toml
    - <kanata-tray executable directory>/kanata-tray.toml
    - $KANATA_TRAY_CONFIG_DIR/kanata-tray.toml
  macos:
    - ~/Library/Application Support/kanata-tray/kanata-tray.toml
    - <kanata-tray executable directory>/kanata-tray.toml
    - $KANATA_TRAY_CONFIG_DIR/kanata-tray.toml
  windows:
    - C:\Users\<YourUsername>\AppData\Roaming\kanata-tray\kanata-tray.toml
    - <kanata-tray executable directory>\kanata-tray.toml
    - '%KANATA_TRAY_CONFIG_DIR%\kanata-tray.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is tied directly to Kanata users who want visible runtime state, quick
      profile switching, or a friendlier way to start and stop remapping. Homebrew
      packaging makes the wrapper installable on macOS alongside the `kanata` package.
  package-nerd-significance:
    - >
      Kanata Tray is a small example of a companion GUI-ish package around a lower-level
      CLI daemon. The package is not historically broad, but it matters to desktop
      package catalogs because it turns a powerful keyboard remapper into something a
      normal workstation session can supervise.
  project-history:
    - >
      The repository was created on 2024-02-07 and v0.1.0 was published on 2024-02-09.
      The README describes it as a simple wrapper for Kanata that works on Windows,
      Linux, and macOS.
    - >
      The project exists because Kanata itself is primarily a keyboard-remapping engine
      and CLI. Kanata Tray fills the desktop-control gap, while its README notes that
      Kanata later gained Windows-only native tray-app support and links to a comparison
      issue.
  related-projects:
    - Kanata is the keyboard remapper that Kanata Tray controls.
    - >
      Kanata's Windows-only tray support is adjacent but does not replace Kanata Tray's
      cross-platform wrapper role.
  sources:
    - https://api.github.com/repos/rszyma/kanata-tray
    - https://github.com/jtroo/kanata
    - https://github.com/rszyma/kanata-tray
    - https://github.com/rszyma/kanata-tray/issues/24
    - https://github.com/rszyma/kanata-tray/releases
  summary:
    - >
      Kanata Tray is a desktop tray wrapper for the Kanata keyboard remapper. It gives
      Kanata users start, stop, pause, preset switching, layer icons, hooks, and
      multi-instance control from a tray icon instead of a terminal process.
  timeline:
    - '2024: rszyma/kanata-tray repository created and v0.1.0 released.'
    - '2025: v0.8.0 release added hook-related changes and shutdown fixes.'
    - '2025: README documented Kanata v1.6.0 as the minimum supported Kanata version.'
  usage:
    - >
      Kanata Tray can run without initial configuration and can generate a TOML
      configuration file on first run. Users define presets that point at Kanata
      executables and configuration files, then switch or autorun those presets from the
      tray.
related-packages:
  - id: brew:kanata
    reason: >
      Kanata is the required keyboard-remapping engine that Kanata Tray launches,
      monitors, and controls through its presets and tray actions.
    rel: adjacent_workflow
    sources:
      - https://github.com/rszyma/kanata-tray#readme
      - https://github.com/jtroo/kanata#readme
category: system
package-manager:
  brew: kanata-tray
package-manager-url: https://formulae.brew.sh/formula/kanata-tray
license: GPL-3.0-or-later
tags:
  - cli
  - desktop-utility
  - input
  - kanata
  - keyboard
  - system-tray
description: System tray for kanata keyboard remapper
executables:
  - kanata-tray
provenance:
  formula: kanata-tray
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
