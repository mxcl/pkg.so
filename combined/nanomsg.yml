id: brew:nanomsg
display-name: nanomsg
homepage: https://nanomsg.org/
repo: https://github.com/nanomsg/nanomsg
docs:
  - https://nanomsg.org/documentation.html
  - https://github.com/nanomsg/nanomsg#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nanomsg accumulated a broad binding ecosystem despite later being superseded: the
      upstream documentation lists bindings or implementations for C, C++, Clojure, D,
      Erlang, Fortran, Go, Haskell, Java, JavaScript, Lua, .NET, OCaml, Perl, PHP,
      Python, R, Ruby, Rust, Scheme, Smalltalk, and more.
    - >
      GitHub API data fetched on 2026-07-01 showed 6,285 stars and 1,034 forks,
      reflecting historical mindshare. Homebrew's formula JSON generated on 2026-07-01
      reported only 382 installs over 365 days and 181 installs-on-request over 365
      days, which is consistent with a legacy library that remains packaged but is no
      longer the main recommendation.
  package-nerd-significance:
    - >
      nanomsg matters historically as a clean-room C rethinking of ZeroMQ-style
      scalability protocols and as the ancestor of NNG. Its Homebrew package is less
      about trend adoption and more about preserving buildability for software that
      already chose the nanomsg API or wire protocols.
  project-history:
    - >
      The project grew out of Martin Sustrik's post-ZeroMQ design work. nanomsg's own
      documentation preserves the historical motivation as a comparison with ZeroMQ by
      the original author of both projects: MIT licensing, a POSIX-like C API,
      implementation in C rather than C++, formal protocol/transport APIs, and different
      threading behavior were central design goals.
    - >
      The GitHub repository was created on 2012-10-10. Later, Garrett D'Amore's NNG
      became the successor path: the nanomsg homepage says nanomsg has largely been
      superseded by NNG, and the documentation calls the C reference implementation
      sustaining-mode while describing NNG as the modern reimplementation.
  related-projects:
    - ZeroMQ
    - NNG
    - mangos
  sources:
    - https://api.github.com/repos/nanomsg/nanomsg
    - https://api.github.com/repos/nanomsg/nanomsg/releases?per_page=5
    - https://formulae.brew.sh/api/formula/nanomsg.json
    - https://formulae.brew.sh/formula/nanomsg
    - https://github.com/nanomsg/nanomsg
    - https://nanomsg.org/
    - https://nanomsg.org/documentation-zeromq.html
    - https://nanomsg.org/documentation.html
    - https://nng.nanomsg.org/
    - https://nng.nanomsg.org/RATIONALE.html
  summary:
    - >
      nanomsg is a C socket library for brokerless messaging patterns, described
      upstream as a way to make networking fast, scalable, and easy to use through
      common communication patterns such as pair, bus, request/reply, publish/subscribe,
      pipeline, and survey.
  timeline:
    - '2012-10-10: nanomsg/nanomsg repository created on GitHub.'
    - '2018-04-12: nanomsg homepage update already pointed users toward NNG when possible.'
    - '2025-10-05: nanomsg 1.2.2 bug-fix release published.'
    - >
      2026-07-01: Homebrew formula JSON listed stable version 1.2.2 and 382 installs
      over 365 days.
  usage:
    - >
      Users link against the C library and use its BSD-socket-like API to build
      message-oriented communication without a broker. Typical choices are REQREP for
      service clusters, PUBSUB for fanout, PIPELINE for fan-in/fan-out work
      distribution, BUS for many-to-many messaging, and IPC/TCP/WebSocket transports
      depending on deployment.
    - >
      Package nerds often keep `nanomsg` around for older applications or language
      bindings that still target libnanomsg. New work should usually evaluate `nng`
      first because NNG keeps wire compatibility while adding the maintained API and
      implementation path.
related-packages:
  - id: brew:nng
    reason: >
      Choose NNG for new C development because the nanomsg project identifies it as the
      preferred modern implementation while retaining compatibility guidance for
      existing nanomsg applications.
    rel: alternative
    sources:
      - https://nanomsg.org/
      - https://nng.nanomsg.org/
      - https://github.com/nanomsg/nng
  - id: brew:zeromq
    reason: >
      Choose ZeroMQ when its larger bindings ecosystem and ZMTP-based stack better fit
      the application; nanomsg was a separate C redesign with different API, threading,
      and protocol choices.
    rel: alternative
    sources:
      - https://nanomsg.org/documentation.html
      - https://zeromq.org/
      - https://zguide.zeromq.org/docs
category: networking
package-manager:
  apk: nanomsg
  brew: nanomsg
  debian: libnanomsg-dev
  dnf: nanomsg
  nix: nanomsg
  pacman: nanomsg
  ubuntu: libnanomsg-dev
  zypper: libnanomsg6
