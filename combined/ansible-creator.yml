id: brew:ansible-creator
display-name: ansible-creator
homepage: https://ansible.readthedocs.io/projects/creator/
repo: https://github.com/ansible/ansible-creator
docs:
  - https://ansible.readthedocs.io/projects/creator
  - >
    https://docs.ansible.com/projects/ansible/latest/dev_guide/developing_collections_creating.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ansible documentation now points collection authors toward ansible-creator for
      quickly scaffolding collection projects, including use from the Ansible extension
      in Visual Studio Code. That makes it part of the endorsed content-authoring path
      rather than just a side utility.
    - >
      Its release history uses the newer Ansible devtools calendar-versioned style, with
      frequent 24.x, 25.x, and 26.x releases and coordinated forum announcements
      alongside other developer tooling.
  package-nerd-significance:
    - >
      ansible-creator is interesting because it packages project policy as a CLI. It
      sits in the same ecosystem bucket as linters and editor tooling: not needed to run
      a playbook, but useful for keeping generated content aligned with the current
      Ansible development workflow.
    - >
      For Homebrew and distro users, the standalone formula makes that scaffolding tool
      available without asking every user to install the broader Python devtools bundle
      manually.
  project-history:
    - >
      The tool is developed under the ansible GitHub organization and documented as a
      CLI for scaffolding Ansible content. Its README describes two primary commands,
      `init` for new projects and `add` for resources in existing projects.
    - >
      The project became part of the newer Ansible development tools family, where it is
      commonly installed through the `ansible-dev-tools` package rather than as a
      standalone first stop.
  related-projects:
    - ansible-dev-tools is the recommended installation bundle for ansible-creator.
    - The Ansible VS Code extension can use ansible-creator for content creation workflows.
    - ansible-lint and molecule are adjacent developer tools used after content is scaffolded.
  sources:
    - https://ansible.readthedocs.io/projects/creator/
    - https://ansible.readthedocs.io/projects/creator/installing/
    - >
      https://docs.ansible.com/projects/ansible/latest/dev_guide/developing_collections_creating.html
    - https://forum.ansible.com/t/release-announcement-ansible-creator-v25-4-1/42210
    - https://github.com/ansible/ansible-creator
  summary:
    - >
      ansible-creator is the Ansible project scaffolding CLI for generating Ansible
      content, especially collections, with current recommended layouts and
      development-tool integration.
  timeline:
    - '2024: GitHub releases show ansible-creator in the 24.x calendar-versioned line.'
    - >
      2024: Ansible collection-creation docs describe ansible-creator as the quick
      scaffolding path.
    - >
      2025: Forum release announcements coordinate ansible-creator with Ansible
      developer tools.
    - '2026: v26.x releases continue the frequent devtools cadence.'
  usage:
    - >
      Users run `ansible-creator init` to initialize a new Ansible project and
      `ansible-creator add` to add content to an existing project. Official docs
      recommend installing it via `ansible-dev-tools`, which also brings in related
      tools for creating and testing Ansible content.
    - >
      The package matters most to collection authors and teams standardizing new Ansible
      repositories, because it encodes project skeletons that otherwise tend to drift
      between hand-written repos.
related-packages:
  - id: brew:ansible-lint
    reason: >
      Run ansible-lint after Ansible Creator scaffolds a project to validate the
      generated and subsequently authored playbooks, roles, and collections.
    rel: adjacent_workflow
    sources:
      - https://docs.ansible.com/projects/creator/installing/
      - https://docs.ansible.com/projects/lint/usage/
  - id: brew:ansible-builder
    reason: >
      Ansible Creator can initialize an execution-environment project whose definition
      is then built into a container image by Ansible Builder.
    rel: adjacent_workflow
    sources:
      - https://docs.ansible.com/projects/creator/installing/
      - https://docs.ansible.com/projects/builder/en/stable/
  - id: brew:ansible-language-server
    reason: >
      The Ansible VS Code workflow combines Creator-backed project scaffolding with
      language-server editing, completion, navigation, and validation.
    rel: adjacent_workflow
    sources:
      - https://docs.ansible.com/projects/creator/installing/
      - https://docs.ansible.com/projects/vscode-ansible/als/
  - id: brew:ansible
    reason: >
      Ansible Creator scaffolds collections and playbook projects intended to be
      developed and executed with Ansible.
    rel: adjacent_workflow
    sources:
      - https://docs.ansible.com/projects/creator/installing/
      - https://docs.ansible.com/projects/ansible/latest/index.html
category: developer-tools
package-manager:
  brew: ansible-creator
  pacman: ansible-creator
  zypper: ansible-creator
package-manager-url: https://formulae.brew.sh/formula/ansible-creator
license: Apache-2.0
tags:
  - ansible
  - automation
  - cli
  - collections
  - developer-tools
  - scaffolding
description: CLI tool for scaffolding Ansible Content
executables:
  - ansible-creator
provenance:
  formula: ansible-creator
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
