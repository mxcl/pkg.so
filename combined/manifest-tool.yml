id: brew:manifest-tool
display-name: manifest-tool
homepage: https://github.com/estesp/manifest-tool/
repo: https://github.com/estesp/manifest-tool
docs:
  - https://github.com/estesp/manifest-tool#readme
config-file-location: null
credentials-file-location:
  unix:
    - $DOCKER_CONFIG/config.json
    - ~/.docker/config.json
  windows:
    - '%DOCKER_CONFIG%\config.json'
    - '%USERPROFILE%\.docker\config.json'
history:
  adoption-history:
    - >
      manifest-tool gained relevance during the transition from
      one-image-per-architecture publishing to a single image reference that can resolve
      to architecture-specific images. The README notes that Docker's early `docker
      manifest` command was based on code from manifest-tool through a Docker CLI pull
      request in early 2018.
    - >
      The project distributes release binaries for many architectures and also publishes
      a Docker image, matching the multi-platform audience it serves. By 2026 the
      repository had hundreds of stars and forks, indicating continued use even after
      Docker and other container tools added overlapping functionality.
  package-nerd-significance:
    - >
      For package and container infrastructure maintainers, manifest-tool is
      historically important because it represents the period when multi-arch container
      images were still being assembled with specialized external tooling. It is also a
      useful reference point for the evolution from Docker manifest lists to OCI
      indexes.
  project-history:
    - >
      The public repository was created in March 2016. The README describes
      manifest-tool as one of the first command-line tools capable of assembling Docker
      v2.2 manifest lists, later more commonly known as OCI image indexes.
    - >
      The project's history section says the codebase began as a joint project with
      Harshal Patil from IBM Bangalore and was originally forked from registry client
      code in skopeo, which later became part of the Red Hat container tooling
      ecosystem. The v2 rewrite removed the original skopeo-derived code, while the old
      code remained part of v1 releases.
  related-projects:
    - >
      The README names skopeo as the original registry-client lineage for early
      manifest-tool code.
    - The README points to `mquery` as a related utility for querying public image references.
    - >
      The Docker CLI `docker manifest` command is described by the README as having
      incorporated much of manifest-tool's original functionality.
  sources:
    - https://github.com/docker/cli/pull/138
    - https://github.com/estesp/manifest-tool
    - https://github.com/estesp/manifest-tool#readme
    - https://github.com/estesp/manifest-tool/releases/tag/v2.2.2
    - https://github.com/estesp/mquery
  summary:
    - >
      manifest-tool is a Go command-line utility for inspecting and pushing
      multi-platform container image manifest lists and OCI image indexes. It helped
      make multi-architecture container image publishing practical before those
      workflows were common in mainstream container CLIs.
  timeline:
    - '2016: Public GitHub repository created.'
    - '2016: Docker v2.2 manifest lists were the target format described by the project.'
    - '2018: Docker CLI manifest work drew on manifest-tool code according to the README.'
    - '2025: v2.2.0 release published.'
    - '2026: v2.2.2 release published.'
  usage:
    - >
      Users inspect an image reference with `manifest-tool inspect` to see manifest or
      index entries and platform support. For publishing, `manifest-tool push` can read
      a YAML spec or command-line arguments that list platforms, source image templates,
      target image references, and tags.
    - >
      For pushing to a registry, the README says credentials can be supplied on the
      command line, via credential helper support similar to the Docker client, or
      through an existing Docker client configuration.
related-packages:
  - id: brew:skopeo
    reason: >
      Choose skopeo when you need broader daemonless registry operations—such as
      copying, deleting, or synchronizing images—in addition to inspecting image
      manifests.
    rel: alternative
    sources:
      - https://github.com/estesp/manifest-tool
      - https://github.com/podman-container-tools/skopeo
  - id: brew:docker
    reason: >
      Choose Docker's built-in `docker manifest` workflow when you already use the
      Docker CLI and do not need a separate manifest-only executable.
    rel: alternative
    sources:
      - https://github.com/estesp/manifest-tool
      - https://docs.docker.com/reference/cli/docker/manifest/
  - id: brew:docker-buildx
    reason: >
      Use Docker Buildx to build and publish the architecture-specific images or
      multi-platform output that manifest-tool can subsequently inspect or assemble into
      an index.
    rel: adjacent_workflow
    sources:
      - https://github.com/estesp/manifest-tool
      - https://docs.docker.com/build/building/multi-platform/
category: developer-tools
package-manager:
  apk: manifest-tool
  brew: manifest-tool
  dnf: manifest-tool
  nix: manifest-tool
package-manager-url: https://formulae.brew.sh/formula/manifest-tool
license: Apache-2.0
tags:
  - cli
  - containers
  - docker
  - image-manifests
  - oci
description: Command-line tool to create and query container image manifest list/indexes
executables:
  - manifest-tool
provenance:
  formula: manifest-tool
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
