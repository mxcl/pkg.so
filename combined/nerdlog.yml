id: brew:nerdlog
display-name: Nerdlog
homepage: https://dmitryfrank.com/projects/nerdlog/article
repo: https://github.com/dimonomid/nerdlog
docs:
  - https://dmitryfrank.com/projects/nerdlog/article
  - https://github.com/dimonomid/nerdlog#readme
config-file-location:
  unix: ~/.config/nerdlog/logstreams.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The adoption story is early and mostly source/community driven: GitHub stars,
      Hacker News and Reddit discussion, Homebrew/MacPorts/Alpine packaging, and the
      maintainer's own article and README. The Homebrew formula API reported stable
      version 1.10.0 and 10 install-on-request events in the prior 30 days when checked
      on 2026-07-01, so packaged usage is still small compared with the attention around
      the initial open-source release.
  package-nerd-significance:
    - >
      Nerdlog is a useful package-nerd signal for the 'no server, just SSH and logs'
      school of operations tooling. It complements heavier log stacks by serving small
      fleets, personal infrastructure, and incident debugging where setup time matters
      more than centralized retention.
  project-history:
    - >
      The maintainer frames Nerdlog as loosely inspired by Graylog and Kibana, but
      intentionally avoiding their server-side setup. The README states the primary use
      case: reading system logs from `/var/log/messages`, `/var/log/syslog`, or
      `journalctl` across one or more remote hosts, including large log files around 1GB
      or more. It does remote-side analysis, transfers matching rows plus timeline
      histogram data, compresses most data in transit, and merges results into a single
      TUI.
    - >
      GitHub metadata retrieved on 2026-07-01 showed about 1.5k stars and 39 forks.
      GitHub releases list v1.0.0 on 2025-04-22 and v1.10.0 on 2025-06-09, indicating a
      short but active public release window.
  related-projects:
    - Graylog
    - Kibana
    - Splunk
    - journalctl
    - syslog
    - SSH
    - gawk
  sources:
    - https://api.github.com/repos/dimonomid/nerdlog
    - https://api.github.com/repos/dimonomid/nerdlog/releases?per_page=100
    - https://dmitryfrank.com/projects/nerdlog/article
    - https://formulae.brew.sh/api/formula/nerdlog.json
    - https://github.com/dimonomid/nerdlog
    - https://news.ycombinator.com/item?id=43750765
    - >
      https://www.reddit.com/r/opensource/comments/1kl443p/built_nerdlog_fast_remotefirst_multihost_tui_log/
  summary:
    - >
      Nerdlog is a remote-first terminal log viewer for querying logs across multiple
      machines over SSH without running a central log server. The public repository was
      created on 2025-04-20 and v1.0.0 was released on 2025-04-22, but the README says
      the tool was originally hacked together in 2022 and then cleaned up and open
      sourced in 2025.
  timeline:
    - >
      2022: Maintainer says the first version was hacked together to replace painfully
      slow Splunk setups.
    - '2025-04-20: GitHub repository created.'
    - '2025-04-22: v1.0.0 released.'
    - '2025-06-09: v1.10.0 released.'
  usage:
    - >
      Users run `nerdlog`, define local or SSH logstreams, filter with awk-like
      expressions or regular expressions, and use the timeline histogram to narrow the
      time range. It is aimed at operators who have SSH access to hosts and want
      Graylog/Kibana-like querying for plain system logs without deploying
      Elasticsearch, agents, collectors, or a log database.
related-packages:
  - id: brew:lnav
    reason: >
      lnav is a mature terminal log-file navigator for rich local analysis, while
      Nerdlog is the stronger fit when the defining requirement is SSH-based querying
      and merging across multiple hosts.
    rel: alternative
    sources:
      - https://github.com/dimonomid/nerdlog
      - https://docs.lnav.org/en/latest/
category: developer-tools
package-manager:
  apk: nerdlog
  brew: nerdlog
  macports: nerdlog
  nix: nerdlog
package-manager-url: https://formulae.brew.sh/formula/nerdlog
license: BSD-2-Clause
tags:
  - cli
  - log-viewer
  - logging
  - ssh
  - tui
description: TUI log viewer with timeline histogram and no central server
executables:
  - nerdlog
provenance:
  formula: nerdlog
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
