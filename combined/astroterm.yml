id: brew:astroterm
display-name: astroterm
homepage: https://github.com/da-luce/astroterm
repo: https://github.com/da-luce/astroterm
docs:
  - https://github.com/da-luce/astroterm#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      astroterm moved quickly from source build to distribution packages. Its README
      documents installation through Arch Linux, Fedora, Homebrew, Nix, Guix, and
      prebuilt GitHub release binaries for Unix and Windows. The input package facts
      also show apk, dnf, pacman, zypper, brew, nix, and other ecosystem package names.
    - >
      The package's appeal is obvious in terminal culture: it gives a visual, animated,
      data-backed result from a single command, and package managers can make the
      dependency chain boring enough for casual use.
  package-nerd-significance:
    - >
      astroterm is package-manager candy: small C source, terminal UI, real data,
      prebuilt release assets, and enough distro uptake to be discoverable from normal
      install commands. It is the kind of package that makes a CLI catalog feel alive
      without bringing a service dependency or user account.
    - >
      It also shows a modern path for tiny native tools: GitHub Actions, Meson, distro
      recipes, Repology badges, and release binaries combine to turn a niche terminal
      visualization into something available across Linux, macOS, and Windows.
  project-history:
    - >
      The GitHub repository was created in June 2023 and the README describes astroterm
      as a terminal-based star map written in C. Its first stable GitHub release,
      v1.0.0, was published in January 2025, with release notes calling it the first
      stable release and listing work such as embedded BSC5 data, improved help,
      constellations, and infrastructure improvements.
    - >
      The project is intentionally small and terminal-native. Its build docs use Meson
      and Ninja, ncurses, argtable2, and a downloaded Bright Star Catalog data file;
      later releases added packaging instructions and shell niceties such as bash
      completions.
  related-projects:
    - The Bright Star Catalog data is used as an embedded star data source.
    - ncurses provides the terminal display layer.
    - Meson and Ninja are the documented build tools.
  sources:
    - https://github.com/da-luce/astroterm#readme
    - https://github.com/da-luce/astroterm/blob/main/CONTRIBUTING.md
    - https://github.com/da-luce/astroterm/releases/tag/v1.0.0
    - https://github.com/da-luce/astroterm/releases/tag/v1.2.0
  summary:
    - >
      astroterm is a terminal planetarium: a C program that renders stars, planets,
      constellations, moon phases, grids, and location/time-specific sky views directly
      in a terminal. It is less an astronomy data pipeline and more a delightful
      packaged CLI toy with real astronomical data behind it.
  timeline:
    - '2023-06-16: The GitHub repository was created.'
    - '2025-01-08: v1.0.0 was published as the first stable release.'
    - '2026-04-01: v1.2.0 was published with fixes and packaging/documentation improvements.'
  usage:
    - >
      Users run astroterm directly, often with flags for latitude, longitude, city,
      datetime, magnitude threshold, frames per second, animation speed, color, Unicode,
      Braille, constellation lines, grids, and metadata. The README examples include
      animated, colored constellation views for named cities.
    - >
      There is no official persistent config file documented in the README or
      contributing guide. Runtime behavior is controlled through command-line options,
      and shell completions can be sourced from astroterm --bash-completions.
related-packages:
  - id: cask:stellarium
    reason: >
      Choose Stellarium when you want a full graphical virtual planetarium with
      observation planning, plugins, and telescope control instead of astroterm's
      lightweight terminal rendering.
    rel: alternative
    sources:
      - https://github.com/da-luce/astroterm#readme
      - https://stellarium.org/guide/
      - https://stellarium.org/doc/head/group__telescopeControl.html
category: science
package-manager:
  apk: astroterm
  brew: astroterm
  dnf: astroterm
  nix: astroterm
  pacman: astroterm
  zypper: astroterm
package-manager-url: https://formulae.brew.sh/formula/astroterm
license: MIT
tags:
  - astronomy
  - cli
  - ncurses
  - planetarium
  - star-map
  - terminal
description: Planetarium for your terminal
executables:
  - astroterm
provenance:
  formula: astroterm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
