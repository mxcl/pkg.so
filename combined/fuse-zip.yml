id: brew:fuse-zip
display-name: fuse-zip
homepage: https://bitbucket.org/agalanin/fuse-zip
repo: https://bitbucket.org/agalanin/fuse-zip
docs:
  - https://bitbucket.org/agalanin/fuse-zip
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README lists distribution through Debian, Ubuntu, Fedora, Arch Linux,
      Gentoo, Fink, Homebrew, FreeBSD, and OpenBSD. It also states that fuse-zip was
      used by the Chrome OS zip archive mounter and by vifm, indicating adoption both as
      an end-user tool and as a component in larger file-management workflows.
  package-nerd-significance:
    - >
      fuse-zip is package-nerd-interesting because it turns an archive format into a
      writable POSIX-like filesystem while preserving many Unix metadata details that
      archive tools commonly flatten. It occupies the practical space between
      `zip`/`unzip` commands and desktop virtual-filesystem stacks such as KIO or GNOME
      VFS.
  project-history:
    - >
      Alexander Galanin maintains the project in a public Bitbucket Git repository. The
      README describes fuse-zip as a C++ filesystem based on libzip and lists support
      for read-only and read-write modes, transparent packing and unpacking, ZIP64, Unix
      permissions, timestamps, comments, sparse files, and several ZIP extra fields.
    - >
      The README records feature milestones across the 0.x series: version 0.3.0 added
      support for absolute and parent-relative paths in read-only mode; version 0.4
      added Unix file permissions and owner information; and version 0.7.0 added
      comments, high-precision timestamps, and read/write support for special Unix file
      types.
  related-projects:
    - >
      The README compares fuse-zip with KIO, GNOME VFS, mc vfs, unpackfs, avfs, and
      fuse-j-zip.
    - >
      The project depends conceptually on FUSE and libzip and is related to tools and
      systems that mount archives as filesystems.
  sources:
    - https://bitbucket.org/agalanin/fuse-zip
    - https://bitbucket.org/agalanin/fuse-zip/raw/master/README.md
  summary:
    - >
      fuse-zip is a FUSE filesystem for mounting ZIP and ZIP64 archives as writable
      directory trees. Its official README emphasizes that users can navigate, extract,
      create, and modify ZIP archives from ordinary applications without
      application-specific virtual-filesystem support.
  timeline:
    - >
      0.3.0: Support added for absolute and parent-relative paths in file names in
      read-only mode.
    - '0.4: Unix file permissions and owner information added.'
    - >
      0.7.0: File and archive comments, high-precision timestamps, and special Unix file
      types added.
  usage:
    - >
      The normal usage pattern is to create a mount point, run `fuse-zip archive.zip
      mountpoint`, work with the mounted directory, and unmount it with `fusermount -u`.
      If the ZIP file does not exist, the tool creates it after unmounting.
    - >
      The README warns that added and changed files live in memory until unmount and
      that modified archives are repacked at unmount time, so large archives need enough
      memory and temporary disk space.
related-packages:
  - id: brew:avfs
    reason: >
      Choose AVFS when transparent access to many archive and remote-file formats
      matters more than fuse-zip's focused writable ZIP filesystem.
    rel: alternative
    sources:
      - https://bitbucket.org/agalanin/fuse-zip/raw/master/README.md
      - https://sourceforge.net/projects/avf/
