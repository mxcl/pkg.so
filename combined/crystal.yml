id: brew:crystal
display-name: Crystal
homepage: https://crystal-lang.org/
repo: https://github.com/crystal-lang/crystal
docs:
  - https://crystal-lang.org/api/latest
  - https://crystal-lang.org/reference/latest
config-file-location:
  unix:
    - shard.yml
    - shard.override.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Crystal reached its 1.0 milestone in March 2021 after many years of development,
      thousands of contributions, and more than 450 contributors according to the
      official 1.0 announcement. That release mattered to adoption because it introduced
      a 1.x compatibility promise for language and standard-library behavior, which is
      the kind of stability signal package maintainers and production users wait for.
  package-nerd-significance:
    - >
      Crystal is unusually package-manager-shaped for a language runtime: the official
      install page distinguishes official packages, system packages, and
      community-maintained packages, and says Homebrew is the most popular installation
      method. The same page lists Debian/Ubuntu, Alpine, Arch, Homebrew, Nix, Scoop,
      WinGet, MSYS2, FreeBSD, OpenBSD, and other routes, so downstream packaging is a
      central part of how users receive the language.
  project-history:
    - >
      The official birthday post says Crystal became one year old on September 3, 2013,
      placing the project's start in 2012. The project describes itself as born and
      raised at Manas, with goals that combine Ruby-like syntax, static type checking
      without pervasive annotations, C bindings, compile-time code generation, and
      efficient native code generation through LLVM.
  related-projects:
    - >
      Crystal is distributed with Shards for dependencies, uses LLVM for native code
      generation, and supports C library bindings. Its ecosystem also includes the
      Crystal Forum, play.crystal-lang.org, and community tools such as ICR.
  sources:
    - https://crystal-lang.org/
    - https://github.com/crystal-lang/crystal
    - https://crystal-lang.org/2013/09/04/happy-birthday-crystal/
    - https://crystal-lang.org/2021/03/22/crystal-1.0-what-to-expect/
    - https://crystal-lang.org/install/
  summary:
    - >
      Crystal is a compiled, statically type-checked programming language with
      Ruby-inspired syntax and a native-code toolchain. As a package, it is both a
      compiler/runtime and the delivery point for Shards, the distributed dependency
      manager used by Crystal libraries.
  timeline:
    - >
      2012: The project began, inferred from the official one-year birthday post dated
      September 4, 2013.
    - >
      2013: The official birthday post described Crystal as similar to Ruby but compiled
      to native machine code with LLVM.
    - '2021: Crystal 1.0 was announced with a 1.x compatibility promise.'
    - '2026: The official homepage release notes listed Crystal 1.20.2 on May 15, 2026.'
  usage:
    - >
      Users install the crystal compiler to build command-line tools, services, and
      libraries with Ruby-like syntax and native output. The official homepage
      highlights the standard library, fibers, C bindings, macros, and Shards; the
      reference and API docs are the primary documentation surfaces for everyday
      development.
related-packages:
  - id: brew:crystal-icr
    reason: >
      ICR adds a REPL-like interactive console that repeatedly generates and executes
      Crystal programs, making it useful for experimentation beside the compiler.
    rel: adjacent_workflow
    sources:
      - https://github.com/crystal-community/icr#readme
      - https://crystal-lang.org/reference/latest/
  - id: brew:crystalline
    reason: >
      Crystalline runs beside Crystal-aware editors to provide completion, navigation,
      formatting, and diagnostics using Crystal project metadata and compiler behavior.
    rel: adjacent_workflow
    sources:
      - https://github.com/elbywan/crystalline#readme
      - https://crystal-lang.org/reference/latest/
category: language-runtime
package-manager:
  apk: crystal
  brew: crystal
  debian: crystal
  macports: crystal
  nix: shards
  pacman: crystal
  scoop: main/crystal
  ubuntu: crystal
  winget: CrystalLang.Crystal
package-manager-url: https://formulae.brew.sh/formula/crystal
license: Apache-2.0
tags:
  - cli
  - compiler
  - programming-language
  - ruby-inspired
  - shards
  - static-typing
description: Fast and statically typed, compiled language with Ruby-like syntax
executables:
  - crystal
  - shards
provenance:
  formula: crystal
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
