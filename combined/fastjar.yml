id: brew:fastjar
display-name: fastjar
homepage: https://savannah.nongnu.org/projects/fastjar
repo: https://cvs.savannah.nongnu.org/viewvc/fastjar
docs:
  - https://gcc.gnu.org/onlinedocs/gcc-4.0.4/fastjar
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      fastjar's adoption has been historical and distribution-driven rather than
      community-growth driven. It appears in Unix package managers as a compatibility
      tool for older Java/GNU Classpath and GCC Java workflows, while modern Java
      installations generally provide jar through the JDK.
  package-nerd-significance:
    - >
      Package maintainers care about fastjar mostly as fossil infrastructure: it is a
      reminder of the period when free Java tooling had to replace proprietary pieces
      one command at a time, and it remains packaged because old build graphs sometimes
      still name fastjar explicitly.
  project-history:
    - >
      The Savannah project page records fastjar as a non-GNU project registered on March
      21, 2006, with GPL-2.0-or-later licensing and a CVS source repository. GCC hosted
      a manual titled Guide to GNU jar utilities, documenting fastjar and grepjar as
      command-line utilities.
  related-projects:
    - Sun/Oracle jar is the tool fastjar implements.
    - grepjar is shipped and documented as fastjar's companion utility.
    - >
      GNU Classpath and GCC Java-era packaging are the ecosystem context in which
      fastjar mattered most.
  sources:
    - https://savannah.nongnu.org/projects/fastjar
    - https://gcc.gnu.org/onlinedocs/gcc-4.0.4/fastjar
    - https://formulae.brew.sh/formula/fastjar
  summary:
    - >
      fastjar is a free-software implementation of the Java JAR command, paired with
      grepjar, that survived as a small Unix package because it let GCC/GNU Java-era
      systems create and inspect JAR archives without depending on Sun's proprietary
      toolchain.
  timeline:
    - '2006: fastjar project registered on Savannah.'
    - '2006: GCC 4.0-era online docs published the fastjar and grepjar manual.'
    - "2026: Homebrew still packages fastjar 0.98 as an implementation of Sun's jar tool."
  usage:
    - >
      The GCC manual describes fastjar as the tool to invoke for JAR archive operations
      and grepjar as the companion search utility. In practice it is installed when a
      small, standalone jar-compatible command is needed in old build recipes or minimal
      packaging environments.
related-packages:
  - id: brew:openjdk
    reason: >
      Choose OpenJDK for the current JDK jar tool, including modern modular-JAR support;
      retain fastjar mainly for standalone or historical compatibility workflows.
    rel: alternative
    sources:
      - https://gcc.gnu.org/onlinedocs/gcc-4.1.2/fastjar/Invoking-fastjar.html
      - https://docs.oracle.com/en/java/javase/11/tools/jar.html
      - https://openjdk.org/
category: developer-tools
