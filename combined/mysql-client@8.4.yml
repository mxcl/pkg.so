id: brew:mysql-client@8.4
display-name: MySQL Client 8.4
homepage: https://github.com/mysql/mysql-server
repo: https://github.com/mysql/mysql-server
docs:
  - https://dev.mysql.com/doc/refman/8.4/en
  - https://dev.mysql.com/doc/refman/8.4/en/option-files.html
config-file-location:
  unix:
    - /etc/my.cnf
    - /etc/mysql/my.cnf
    - SYSCONFDIR/my.cnf
    - ~/.my.cnf
  windows:
    - '%WINDIR%\my.ini'
    - '%WINDIR%\my.cnf'
    - C:\my.ini
    - C:\my.cnf
    - '%APPDATA%\MySQL\.mylogin.cnf'
credentials-file-location:
  unix:
    - ~/.my.cnf
    - ~/.mylogin.cnf
  windows: '%APPDATA%\MySQL\.mylogin.cnf'
history:
  project-history:
    - >
      MySQL 8.4 is the LTS successor line for users migrating from the 8.0 series.
      Oracle's versioning announcement explains the split between Innovation releases
      and Long-Term Support releases, with LTS releases receiving the longer support
      policy while Innovation releases carry new feature cadence. Oracle's download page
      identifies MySQL 8.4 as an LTS Generally Available release, and the 8.0 release
      notes direct 8.0 users to MySQL 8.4 LTS or an Innovation release after the 8.0 EOL
      point.
  sources:
    - https://blogs.oracle.com/mysql/mysql-retrospective-the-early-years
    - >
      https://dev.mysql.com/blog-archive/introducing-mysql-innovation-and-long-term-support-lts-versions/
    - https://dev.mysql.com/doc/refman/8.4/en/mysql.html
    - https://dev.mysql.com/doc/refman/9.1/en/programs-client.html
    - https://dev.mysql.com/doc/relnotes/mysql/8.0/en/
    - https://dev.mysql.com/downloads/mysql/8.4.html
    - https://formulae.brew.sh/formula/mysql-client@8.4
    - https://www.oracle.com/corporate/pressrelease/oracle-buys-sun-042009.html
  summary:
    - >
      The `mysql-client@8.4` formula packages the command-line client utilities for
      MySQL 8.4 LTS. It belongs to the same client-tool lineage as the unversioned MySQL
      client package: MySQL began in 1995 with Allan Larsson, David Axmark, and Michael
      "Monty" Widenius, became a fixture of open-source web infrastructure, moved to the
      GPL in the MySQL 3.23 period, passed through Sun's 2008 acquisition of MySQL AB,
      and became an Oracle product after Oracle acquired Sun.
  usage:
    - >
      In practice, `mysql-client@8.4` gives DBAs and developers a pinned 8.4-era CLI
      without installing the server. It includes the familiar operational programs:
      `mysql` for interactive and batch SQL, `mysqladmin` for administrative commands,
      `mysqlcheck` for table maintenance, `mysqldump` and `mysqlimport` for
      export/import workflows, `mysqlshow` for metadata inspection, `mysqlslap` for load
      emulation, and `mysqlbinlog` for binary log work. The versioned package is useful
      on machines that must match an 8.4 LTS estate while leaving Homebrew's unversioned
      formula free to follow its own update path.
related-packages:
  - id: brew:mycli
    reason: >
      Choose mycli for interactive MySQL work when context-sensitive completion, syntax
      highlighting and richer terminal ergonomics matter more than using Oracle's
      reference client.
    rel: alternative
    sources:
      - https://www.mycli.net/docs
      - https://github.com/dbcli/mycli
      - https://formulae.brew.sh/formula/mycli
  - id: brew:mysql
    reason: >
      Install the full MySQL package when this client toolbox must be paired with a
      locally operated MySQL server daemon.
    rel: adjacent_workflow
    sources:
      - https://dev.mysql.com/doc/refman/8.4/en/what-is-mysql.html
      - https://dev.mysql.com/doc/refman/8.4/en/mysql.html
      - https://formulae.brew.sh/formula/mysql
category: data
package-manager:
  apk: mysql
  brew: mysql-client@8.4
  chocolatey: mysql
  debian: libmysql++-dev
  dnf: mysql
  pacman: mariadb
  scoop: main/mysql
  ubuntu: libmysql++-dev
  winget: Oracle.MySQL
  zypper: mariadb
package-manager-url: https://formulae.brew.sh/formula/mysql-client@8.4
license: GPL-2.0-only WITH Universal-FOSS-exception-1.0
tags:
  - cli
  - client
  - database
  - mysql
  - sql
description: Open source relational database management system
executables:
  - comp_err
  - my_print_defaults
  - mysql
  - mysql_config
  - mysql_config_editor
  - mysql_migrate_keyring
  - mysql_secure_installation
  - mysqladmin
  - mysqlbinlog
  - mysqlcheck
  - mysqldump
  - mysqlimport
  - mysqlshow
  - mysqlslap
  - mysqltest
  - perror
provenance:
  formula: mysql-client@8.4
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
