id: brew:dra
display-name: DRA
homepage: https://github.com/devmatteini/dra
repo: https://github.com/devmatteini/dra
docs:
  - https://github.com/devmatteini/dra/tree/main/docs
  - https://github.com/devmatteini/dra
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DRA is packaged for Homebrew, Arch Linux, Scoop, and winget, matching its role as
      a small cross-platform utility for users who often install tools from GitHub
      Releases.
  package-nerd-significance:
    - >
      DRA is package-nerd tooling about packages themselves: it automates the recurring
      problem of finding the right binary asset among inconsistent GitHub Release naming
      schemes.
  project-history:
    - >
      The devmatteini/dra repository was created in December 2021. Its README positions
      the tool as a narrower alternative to the GitHub CLI for release-asset downloads,
      emphasizing public downloads without authentication, asset pattern generation,
      automatic OS and architecture selection, and optional installation of common
      archive and package formats.
  related-projects:
    - GitHub CLI
    - GitHub Releases
    - Homebrew
    - Scoop
    - winget
  sources:
    - https://github.com/devmatteini/dra
    - https://raw.githubusercontent.com/devmatteini/dra/main/README.md
    - https://api.github.com/repos/devmatteini/dra
    - https://api.github.com/repos/devmatteini/dra/releases?per_page=5
  summary:
    - DRA is a Rust command-line tool for downloading release assets from GitHub repositories.
  timeline:
    - '2021: devmatteini/dra was created on GitHub.'
    - >
      2020s: the README documented installation through prebuilt binaries, Homebrew,
      Arch Linux, and source builds.
    - '2026: the project continued publishing 0.10.x releases.'
  usage:
    - >
      Users run dra download against an owner/repository pair, either interactively or
      in automation with automatic or pattern-based asset selection. The tool can also
      be used to update itself by downloading a matching asset from its own releases.
related-packages:
  - id: brew:gh
    reason: >
      Choose GitHub CLI for a broader first-party GitHub workflow—including releases,
      pull requests, issues, and Actions—while DRA is more focused on automatic
      release-asset selection and installation.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/devmatteini/dra/main/README.md
      - https://cli.github.com/manual/gh_release_download
category: developer-tools
package-manager:
  brew: dra
  pacman: dra
  scoop: extras/dra
  winget: CosimoMatteini.DRA
package-manager-url: https://formulae.brew.sh/formula/dra
license: MIT
tags:
  - assets
  - cli
  - download
  - github
  - releases
  - rust
description: Command-line tool to download release assets from GitHub
executables:
  - dra
provenance:
  formula: dra
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
