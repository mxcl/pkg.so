id: brew:alloy-analyzer
display-name: Alloy Analyzer
homepage: https://alloytools.org
repo: https://github.com/AlloyTools/org.alloytools.alloy
docs:
  - https://alloytools.org/documentation.html
  - https://alloytools.org/about.html
  - https://github.com/AlloyTools/org.alloytools.alloy
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official about page points to uses ranging from finding holes in security
      mechanisms to designing telephone switching networks. The documentation and
      download pages present Alloy as a runnable jar and macOS DMG, while Homebrew
      packages it as alloy-analyzer with an alloy executable.
    - >
      Alloy 6 broadened the analyzer's modeling surface by adding native behavioral and
      temporal modeling, moving users away from manually encoding traces in older Alloy
      models.
  package-nerd-significance:
    - >
      Alloy Analyzer is important in package catalogs because it packages a complete
      formal-methods workbench as a command-line-launchable Java artifact. It brings
      SAT-backed modeling, examples, and visualization into a normal developer install
      flow instead of a bespoke academic setup.
    - >
      Its dependency story is also interesting: the distribution is self-contained for
      common use, but its internals include Kodkod/Pardinus and multiple SAT solver
      paths, and Alloy 6's temporal mode can reach out to model checkers like NuSMV or
      nuXmv.
  project-history:
    - >
      The official about page says Alloy was created in the Software Design Group at
      MIT. It describes Alloy as a language for evolving structures and the Analyzer as
      a solver-backed tool that explores models, checks properties, and displays
      structures graphically.
    - >
      Alloy's design draws from the Z specification language, Tarski's relational
      calculus, Linear Temporal Logic with Past, and object-modeling notations such as
      OMT and UML. That background explains why the Analyzer sits between academic
      formal methods and practical software modeling.
    - >
      The current AlloyTools GitHub repository begins in public git history on
      2017-07-19. Its README describes Alloy 6 as a self-contained executable with
      Pardinus/Kodkod, SAT solvers, the standard Alloy library, tutorial examples, and
      Java 17 as the current runtime requirement.
  related-projects:
    - 'Kodkod and Pardinus: model-finding engines included in the Alloy distribution.'
    - >
      SAT4J, MiniSat, Lingeling/Plingeling, and Glucose: SAT solver families referenced
      by the README.
    - 'NuSMV and nuXmv: external model checkers used for Alloy 6 temporal model checking.'
  sources:
    - Git history from https://github.com/AlloyTools/org.alloytools.alloy.git
    - 'Official Alloy 6 page: https://alloytools.org/alloy6.html'
    - 'Official README: https://github.com/AlloyTools/org.alloytools.alloy'
    - 'Official about page: https://alloytools.org/about.html'
    - 'Official documentation: https://alloytools.org/documentation.html'
    - 'Official download page: https://alloytools.org/download.html'
  summary:
    - >
      Alloy Analyzer is the tool for the Alloy modeling language, a relational-logic
      language for describing structures and checking properties by finding examples and
      counterexamples.
  timeline:
    - 'MIT era: Alloy created in the Software Design Group at MIT.'
    - '2017: Current AlloyTools GitHub repository public history begins.'
    - '2019: v5.1.0 tag appears in repository history.'
    - '2021: v6.0.0 tag appears in repository history.'
    - '2024: v6.2.0 tag appears in repository history.'
  usage:
    - >
      Users write Alloy models, run commands or assertions, and inspect generated
      instances or counterexamples in the Analyzer. The official docs describe executing
      the jar directly with java -jar, and the repository notes the same jar can also be
      embedded as an API.
    - >
      Since Alloy 6, temporal model checking can use external tools such as NuSMV or
      nuXmv when available on PATH, alongside the bundled SAT-based analysis stack.
related-packages:
  - id: cask:tla+-toolbox
    reason: >
      TLA+ Toolbox is an alternative formal-modeling environment centered on
      state-transition specifications and the explicit-state TLC checker; choose it
      especially for concurrent or distributed-system algorithms rather than Alloy's
      relational structure exploration.
    rel: alternative
    sources:
      - https://alloytools.org/about.html
      - https://lamport.azurewebsites.net/tla/toolbox.html
      - https://lamport.azurewebsites.net/tla/tools.html
  - id: brew:spin
    reason: >
      Spin is a command-line alternative for verifying asynchronous concurrent processes
      written in Promela; choose it when protocol and process-interleaving analysis fits
      better than Alloy's relational modeling and graphical instances.
    rel: alternative
    sources:
      - https://alloytools.org/about.html
      - https://spinroot.com/spin/whatispin.html
      - https://spinroot.com/spin/Doc/Manual.pdf
category: developer-tools
package-manager:
