id: brew:adaptivecpp
display-name: AdaptiveCpp
homepage: https://adaptivecpp.github.io/
repo: https://github.com/AdaptiveCpp/AdaptiveCpp
docs:
  - https://adaptivecpp.github.io/AdaptiveCpp
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AdaptiveCpp's adoption story is tied to cross-vendor GPU computing. The README
      says it can target Intel, NVIDIA, AMD, Apple, x86, ARM, and other LLVM-supported
      CPUs, and that it is used in production on machines of all scales, including some
      of the most powerful supercomputers.
    - >
      The release history shows the project moving from hipSYCL 0.x releases to
      AdaptiveCpp date-based releases beginning with the 23.10 line.
  package-nerd-significance:
    - >
      AdaptiveCpp is packaging-heavy because it sits at the intersection of LLVM, GPU
      runtimes, vendor toolchains, and C++ build systems. A package needs to expose
      multiple executables while preserving compiler discovery, backend support, and
      environment-variable behavior.
  project-history:
    - >
      The README states that AdaptiveCpp was formerly known as hipSYCL and Open SYCL. It
      presents the project as a modern platform for C++ heterogeneous programming models
      that targets CPUs and GPUs from major vendors.
    - >
      Development is primarily led by Heidelberg University with community
      contributions. The README describes AdaptiveCpp as both a production platform and
      a research project, with publications covering SYCL beyond OpenCL, single-pass
      compilation, standard parallelism offloading, CPU compiler techniques, and
      JIT-time optimization.
  related-projects:
    - >
      Related projects and technologies include SYCL, OpenCL, CUDA, HIP, LLVM, C++
      standard parallelism, oneAPI, and vendor GPU tooling from Intel, NVIDIA, AMD, and
      Apple.
  sources:
    - https://api.github.com/repos/AdaptiveCpp/AdaptiveCpp
    - https://api.github.com/repos/AdaptiveCpp/AdaptiveCpp/releases
    - https://github.com/AdaptiveCpp/AdaptiveCpp#readme
  summary:
    - >
      AdaptiveCpp is an independent, community-driven C++ heterogeneous programming
      platform and compiler for SYCL, C++ standard parallelism, and experimental
      portable CUDA-style programming across CPUs and GPUs.
  timeline:
    - '2018: GitHub repository now known as `AdaptiveCpp/AdaptiveCpp` was created.'
    - '2019: hipSYCL 0.8.0 release was published.'
    - '2020: hipSYCL 0.9.0 release was published and the project cited SYCL beyond OpenCL work.'
    - '2023: AdaptiveCpp 23.10.0 alpha and 23.10.0 releases marked the renamed release line.'
    - '2025: AdaptiveCpp 25.x releases continued the date-based release series.'
  usage:
    - >
      Users compile applications with `acpp` as a compiler-like frontend, select targets
      through command-line arguments or environment variables, and integrate AdaptiveCpp
      into CMake projects through the official usage documentation.
related-packages:
  - id: brew:cmake
    reason: >
      CMake is a practical companion because AdaptiveCpp's official usage documentation
      provides CMake integration for compiling heterogeneous C++ applications with the
      installed toolchain.
    rel: adjacent_workflow
    sources:
      - https://adaptivecpp.github.io/AdaptiveCpp/
      - https://cmake.org/cmake/help/latest/
category: developer-tools
package-manager:
  brew: adaptivecpp
  nix: adaptivecpp
  zypper: adaptivecpp
package-manager-url: https://formulae.brew.sh/formula/adaptivecpp
license: BSD-2-Clause
tags:
  - cli
  - compiler
  - cpp
  - gpu
  - heterogeneous-computing
  - parallel-computing
  - stdpar
  - sycl
description: SYCL and C++ standard parallelism for CPUs and GPUs
executables:
  - acpp
  - acpp-appdb-tool
  - acpp-hcf-tool
  - acpp-info
  - acpp-pcuda-pp
  - syclcc
  - syclcc-clang
provenance:
  formula: adaptivecpp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
