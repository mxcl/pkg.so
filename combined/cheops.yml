id: brew:cheops
display-name: CHEOPS
homepage: https://logological.org/cheops
repo: https://github.com/logological/cheops
docs:
  - https://github.com/logological/cheops#readme
  - https://logological.org/cheops
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is small, but the homepage documents source releases on GitHub and
      nothingisreal.com, openSUSE packages, and third-party Windows builds. The batch
      metadata lists Homebrew and MacPorts packaging.
    - >
      CHEOPS is therefore more of a preserved portable Unix game than a widely adopted
      chess engine ecosystem project.
  package-nerd-significance:
    - >
      CHEOPS is package-nerd significant mainly as a small, old-school Unix game
      package: source tarballs, configure and make, a section 6 man page, GPL licensing,
      and ports-package distribution.
    - >
      It also shows why package managers keep niche software alive: even a four-star
      chess program can remain installable decades after its first release when it
      follows conventional source distribution patterns.
  project-history:
    - >
      The official homepage says CHEOPS was conceived and written by Tristan Miller and
      describes it as a fully functional chess program supporting human-vs-human,
      human-vs-computer, and computer-vs-computer play. It uses a 64-square linear board
      representation, alpha-beta search, and a static evaluation function over material,
      mobility, and motif features.
    - >
      The NEWS file records an initial 1.0 release in November 2003, GNU-style packaging
      with configure script and man page in 1.1, compiler compatibility fixes in 1.2,
      and GPL-3.0 relicensing in 1.3.
  related-projects:
    - GNU Chess, chesstool, and xboard are listed in the CHEOPS man page as related tools.
    - >
      openSUSE packaging and MacPorts/Homebrew formulas are relevant distribution
      relatives for this kind of Unix game.
  sources:
    - https://logological.org/cheops
    - https://github.com/logological/cheops
    - https://files.nothingisreal.com/software/cheops/NEWS
    - https://github.com/logological/cheops/blob/master/doc/cheops.6
  summary:
    - >
      CHEOPS, the CHEss OPponent Simulator, is a small command-line chess program and
      engine by Tristan Miller. It is niche, but official project pages provide enough
      release history to document it as a traditional Unix-style game package.
  timeline:
    - '2003: CHEOPS 1.0 initial release.'
    - >
      2003: CHEOPS 1.1 added GNU-style packaging, configure script, man page, and
      --help/--version.
    - '2015: CHEOPS 1.2 fixed compilation with modern GCC.'
    - '2016: CHEOPS 1.3 released and relicensed under GPL-3.0.'
  usage:
    - >
      Users run cheops in a terminal, choose who controls each side, optionally adjust
      computer-opponent evaluation weights, and enter moves in coordinate notation such
      as g1f3. The man page documents commands for help, resigning, redisplaying the
      board, reversing the board, showing computer thinking, logging, saving, starting a
      new game, and quitting.
    - >
      The package builds with a standard configure script on Unix-like systems, matching
      the expectations of source-based package managers and ports collections.
related-packages:
  - id: brew:gnu-chess
    reason: >
      Choose GNU Chess for a more established command-line chess engine with broader
      chess-interface integration; CHEOPS is a smaller self-contained terminal game.
    rel: alternative
    sources:
      - https://github.com/logological/cheops/blob/master/doc/cheops.6
      - https://www.gnu.org/software/chess/
category: games
package-manager:
  brew: cheops
  macports: cheops
package-manager-url: https://formulae.brew.sh/formula/cheops
license: GPL-3.0-or-later
tags:
  - chess
  - cli
  - engine
  - game
description: CHEss OPponent Simulator
executables:
  - cheops
provenance:
  formula: cheops
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
