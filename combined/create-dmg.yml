id: brew:create-dmg
display-name: create-dmg
homepage: https://github.com/create-dmg/create-dmg
repo: https://github.com/create-dmg/create-dmg
docs:
  - https://github.com/create-dmg/create-dmg#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew installation as the first installation path,
      followed by release downloads and cloning the repository. That distribution style
      made create-dmg convenient for macOS developers who wanted repeatable DMG creation
      in release scripts without maintaining their own AppleScript and hdiutil wrappers.
  package-nerd-significance:
    - >
      For package maintainers, create-dmg matters because DMG layout is a macOS
      distribution detail that is easy to get wrong and awkward to reproduce. The tool
      packages common release-engineering conventions into one script that Homebrew,
      MacPorts, and Nix can expose as a small CLI dependency.
  project-history:
    - >
      The project README credits Andrey Tarantsov as the original creator and says
      Andrew Janke helped substantially with the project in May 2020. The project is
      maintained as a shell script in a public GitHub repository under the create-dmg
      organization.
  related-projects:
    - >
      The README lists node-appdmg and dmgbuild as alternatives for building macOS disk
      images.
  sources:
    - https://github.com/create-dmg/create-dmg#readme
  summary:
    - >
      create-dmg is a macOS command-line packaging helper for producing polished disk
      images from a source folder. It wraps standard macOS disk-image tooling with
      options for Finder window layout, icons, background images, Applications drop
      links, encryption, signing, and notarization.
  timeline:
    - 'Original project: Created by Andrey Tarantsov'
    - '2020-05: README notes substantial help from Andrew Janke'
    - 'README: Documents Homebrew installation and release-download installation'
  usage:
    - >
      The normal workflow is to run create-dmg with an output .dmg name and a source
      folder, then pass options for volume name, icon placement, background art,
      filesystem format, encryption, codesigning, notarization, and related macOS
      packaging details.
related-packages: []
category: developer-tools
package-manager:
  brew: create-dmg
  macports: create-dmg
  nix: create-dmg
package-manager-url: https://formulae.brew.sh/formula/create-dmg
license: MIT
tags:
  - cli
  - dmg
  - macos
  - packaging
  - shell
description: Shell script to build fancy DMGs
executables:
  - create-dmg
provenance:
  formula: create-dmg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
