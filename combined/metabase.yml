history:
  adoption-history:
    - >
      Adoption followed the open source, self-service analytics path. Metabase's own
      retrospective said the project had been launched in 2015 and, after just over
      three years, had 14,000+ GitHub stars, 10 million+ Docker Hub pulls, more than a
      million direct downloads, 140 external contributors, translations into 14
      languages, and users from over 150 countries. A later Metabase event page
      described it as used by 90,000+ companies, with a global open source community and
      product-led growth behind the commercial company.
  project-history:
    - >
      The major technical milestone was making database exploration approachable without
      requiring every user to write SQL. Metabase's documentation defines questions as
      saved analytical units containing a query, result, and visualization; questions
      can be organized into dashboards, collections, links, embeds, exports, and alerts.
      Its visual query builder lets users pick tables, models, metrics, and saved
      questions, while SQL/native queries remain available for more advanced use.
  sources:
    - https://formulae.brew.sh/formula/metabase
    - https://github.com/metabase/metabase
    - https://www.metabase.com/blog/they-grow-up-so-fast
    - https://www.metabase.com/docs/latest/
    - https://www.metabase.com/docs/latest/questions/introduction
    - https://www.metabase.com/docs/latest/questions/query-builder/editor
    - https://www.metabase.com/events/building-in-the-open
  summary:
    - >
      Metabase is an open source business-intelligence and embedded-analytics server
      founded by Sameer Al-Sakran. Metabase material describes the product as beginning
      as a side project and launching publicly in 2015 with a simple pitch: open source
      BI that installs quickly and can be used by people across a company. That origin
      shaped the tool's package identity: it is a server application packaged for
      self-hosting, not a library or desktop-only analytics client.
  usage:
    - >
      In practice, teams run Metabase against operational databases and warehouses to
      let non-specialists ask questions, create charts, maintain dashboards, and embed
      analytics in products. Compared with heavier BI suites, the Homebrew, MacPorts,
      Nix, and Scoop packages make it easy to start a local or small self-hosted server
      for evaluation, internal reporting, or development.
