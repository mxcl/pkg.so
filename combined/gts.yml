history:
  adoption-history:
    - >
      GTS was adopted by scientific and graphics projects that needed robust
      triangulated-surface operations without building a geometry kernel from scratch.
      The official projects page lists users including MyFon, Mesh Viewer, Gerris Flow
      Solver, Divipro, Chips, K-3D, and TriAero.
    - >
      The library also became a durable distribution package: the input metadata records
      packaging across Homebrew, Debian, Ubuntu, Fedora-family, MacPorts, Nix, Arch, and
      openSUSE ecosystems. Its command-line converters and `gts-config` helper made it
      useful both as a library dependency and as a standalone mesh utility package.
  package-nerd-significance:
    - >
      GTS is exactly the kind of library that package maintainers keep around because it
      is small, old, useful, and embedded in other scientific software. It bridges
      desktop-era GLib conventions, robust computational geometry, and Unix filters for
      mesh data, so even users who never write against its C API may depend on it
      through CAD, visualization, or simulation packages.
    - >
      For Homebrew-style package culture, GTS is also notable because it ships many tiny
      executables from one library formula. That makes it useful for quick mesh
      conversions and for testing whether old scientific build systems can still find a
      `gts-config` or pkg-config path.
  project-history:
    - >
      The GTS web site describes the project as free software under the LGPL and as a C
      library using an object-oriented design inspired by GTK+. Its initial goal was to
      give scientists a simple and efficient library for 3D computational surface
      meshes.
    - >
      Early public news on the project site in 2000 announced a web site update,
      examples, and version 0.3.0. The 0.4.0 release in January 2001 reorganized the
      object hierarchy around points, vertices, segments, edges, triangles, faces, and
      surfaces; it also rewrote Delaunay triangulation and improved boolean operations
      and surface coarsening.
    - >
      The 0.5.1, 0.6.0, and 0.7.x series expanded GTS from a geometry library into a
      toolkit with converters, validation tools, boolean operations, isosurface
      extraction, refinement, coarsening, graph operations, and progressive-surface
      support. Version-control history moved from CVS to darcs in the 0.7.4 cycle, and
      the site links the darcs repository as the development source.
  related-projects:
    - >
      The official site links GTS to GLib and GTK+ design conventions, Jonathan
      Shewchuk's robust predicates, pygts Python bindings, Gerris Flow Solver, K-3D,
      TriAero, and other mesh or simulation tools. Its command-line tools also make it
      adjacent to STL processing, Delaunay triangulation utilities, CAD/CAM packages,
      and scientific visualization stacks.
  sources:
    - https://gerris.dalembert.upmc.fr/darcs/gts-stable
    - https://gts.sourceforge.net/
    - https://gts.sourceforge.net/ChangeLog.html
    - https://gts.sourceforge.net/install.html
    - https://gts.sourceforge.net/projects.html
    - https://gts.sourceforge.net/reference/book1.html
  summary:
    - >
      GTS, the GNU Triangulated Surface Library, is a C library for working with
      three-dimensional surfaces represented as interconnected triangles. Its
      package-manager significance comes from a practical mix of computational geometry
      algorithms, mesh file converters, and Unix-style command-line tools such as
      `stl2gts`, `gts2stl`, `delaunay`, `gtscheck`, and `happrox`.
  timeline:
    - '2000-02-29: Project site announces examples and a bibliography section.'
    - >
      2000-07-24: Version 0.3.0 announced with isosurface computation and memoryless
      simplification.
    - >
      2001-01-31: Version 0.4.0 reorganizes the object hierarchy and rewrites Delaunay
      triangulation.
    - >
      2001-11-12: Version 0.5.1 adds `gts-config`, shared/static library builds, graph
      operations, and out-of-core simplification.
    - '2002-06-18: Version 0.6.0 introduces GtsFile error reporting and `gtscheck`.'
    - >
      2002-11-08: Version 0.7.0 rewrites boolean operations with Simulation of
      Simplicity techniques and adds `stl2gts`.
    - '2005-10-17: Version 0.7.4 switches the development tree to darcs.'
    - '2006-03-29: Version 0.7.6 documents Debian snapshot packaging and locale handling fixes.'
  usage:
    - >
      Typical GTS usage is split between C programs linking against the library and
      command-line workflows around mesh conversion and checking. The reference manual
      covers data structures such as heaps, vectors, object classes,
      point/vertex/edge/face/surface types, kd-trees, bounding-box trees, boolean
      operations, simplification, refinement, isosurfaces, Delaunay triangulation,
      differential geometry operators, and graph partitioning.
    - >
      Package users encounter GTS through executable tools that convert STL, DXF, and
      OOGL-like formats, generate Delaunay triangulations, check surface consistency,
      approximate terrain models, and transform meshes. The installation docs describe a
      traditional autotools build and a dependency on GLib.
