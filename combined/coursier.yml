id: brew:coursier
display-name: Coursier
homepage: https://get-coursier.io/
repo: https://github.com/coursier/coursier
docs:
  - https://get-coursier.io/docs/overview
config-file-location: null
credentials-file-location:
  linux: ~/.config/coursier/credentials.properties
  macos: ~/Library/Application Support/Coursier/credentials.properties
history:
  adoption-history:
    - >
      Coursier became infrastructure in the Scala ecosystem rather than only an end-user
      CLI. The official users page lists Scastie, Scalafiddle, Ammonite, Mill, sbt,
      Pants, Scalafmt, Scalafix, Scala Jupyter kernels, and Scala language-server
      tooling as users or integrations.
    - >
      The Coursier docs also record a major packaging milestone: sbt 1.3.x shipped with
      Coursier support enabled by default, reducing the need for the separate
      `sbt-coursier` plugin in most sbt 1.3.x builds.
  package-nerd-significance:
    - >
      Coursier matters to package and build-tool maintainers because it sits at the
      boundary between package managers, Maven/Ivy metadata, launcher generation,
      dependency caches, and Scala build reproducibility. It is both a CLI package and a
      library consumed by other tools.
  project-history:
    - >
      The public repository was created in 2015. The official overview describes
      Coursier as a Maven/Ivy-style dependency resolver and fetcher rewritten from
      scratch in Scala, designed to be fast and embeddable.
    - >
      The README notes that large parts of Coursier development since September 2018
      were funded by the Scala Center.
  related-projects:
    - sbt
    - sbt-coursier
    - Mill
    - Ammonite
    - Scala CLI
    - Scalafmt
    - Scalafix
  sources:
    - https://get-coursier.io/docs/overview
    - https://get-coursier.io/docs/overview-in-the-wild
    - https://get-coursier.io/docs/sbt-coursier
    - https://get-coursier.io/docs/cli-installation
    - https://get-coursier.io/docs/other-credentials
    - https://github.com/coursier/coursier
    - https://api.github.com/repos/coursier/coursier
    - https://github.com/coursier/coursier/releases
  summary:
    - >
      Coursier is a Scala application and artifact manager used to install Scala
      applications, set up Scala development environments, and download and cache JVM
      artifacts.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2018: Scala Center funding noted for large parts of development from September onward.'
    - '2019: sbt 1.3.x line documented as shipping with Coursier support enabled by default.'
    - '2026: v2.1.25 milestone releases continue.'
  usage:
    - >
      As the `cs` command-line tool, Coursier installs Scala applications, launches
      applications, creates standalone launchers, resolves dependencies, fetches
      artifacts, manages Java runtimes, and sets up common Scala tools.
    - >
      For private repositories, credentials can be supplied inline, by environment or
      Java property, or via `credentials.properties` in platform-specific config
      locations.
related-packages:
  - id: brew:sbt
    reason: >
      sbt uses Coursier-backed dependency resolution by default, so sbt provides the
      Scala build workflow while Coursier performs artifact resolution and fetching
      underneath it.
    rel: adjacent_workflow
    sources:
      - https://get-coursier.io/docs/overview-in-the-wild
      - https://get-coursier.io/docs/sbt-coursier
      - https://www.scala-sbt.org/1.x/docs/
  - id: brew:scala-cli
    reason: >
      Coursier's standard setup installs Scala CLI, which then supplies the compile,
      run, test, REPL, and packaging commands for Scala code.
    rel: adjacent_workflow
    sources:
      - https://get-coursier.io/docs/cli-installation
      - https://scala-cli.virtuslab.org/docs/overview/
category: developer-tools
package-manager:
  brew: coursier
  nix: coursier
  scoop: main/coursier
package-manager-url: https://formulae.brew.sh/formula/coursier
license: Apache-2.0
tags:
  - artifact-fetcher
  - cli
  - dependency-manager
  - jvm
  - scala
description: Pure Scala Artifact Fetching
executables:
  - coursier
provenance:
  formula: coursier
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
