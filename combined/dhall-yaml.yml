id: brew:dhall-yaml
display-name: dhall-yaml
homepage: https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-yaml
repo: https://github.com/dhall-lang/dhall-haskell
docs:
  - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-yaml#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dhall-yaml adoption follows Dhall's broader use as a programmable configuration
      format. Official Dhall documentation teaches generation of JSON and YAML, and its
      production-use page lists organizations using dhall-to-yaml in infrastructure and
      application configuration workflows.
  package-nerd-significance:
    - >
      For package nerds, dhall-yaml is the adapter layer that lets Dhall compete with
      hand-written YAML without requiring the target ecosystem to understand Dhall. It
      is small, specialized, and valuable mostly because YAML is everywhere and typed
      configuration is not.
  project-history:
    - >
      The Hackage metadata for dhall-yaml 1.0.0 identifies Gabriel Gonzalez as author,
      gives 2019 copyright, and describes the package as both a library and executable
      tooling for converting between Dhall expressions and YAML. It lives in the
      dhall-lang/dhall-haskell repository alongside the main Dhall implementation.
  related-projects:
    - dhall provides the core language and interpreter.
    - dhall-json provides related JSON conversion tooling in the same ecosystem.
  sources:
    - https://hackage.haskell.org/package/dhall-yaml-1.0.0
    - https://hackage.haskell.org/package/dhall-yaml-1.0.0/dhall-yaml.cabal
    - https://docs.dhall-lang.org/tutorials/Getting-started_Generate-JSON-or-YAML.html
    - https://docs.dhall-lang.org/discussions/Dhall-in-production.html
    - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-yaml
  summary:
    - >
      dhall-yaml is the Dhall ecosystem package for moving between typed Dhall
      expressions and YAML. In package-manager terms it matters because it turns Dhall
      from a configuration language into a practical generator for the YAML files
      expected by Kubernetes, CI systems, and other infrastructure tools.
  timeline:
    - >
      2019: dhall-yaml 1.0.0 appears on Hackage with dhall-to-yaml-ng and yaml-to-dhall
      executables.
    - >
      2026: Official Dhall documentation still presents JSON/YAML generation as a core
      getting-started workflow.
  usage:
    - >
      The package exposes the dhall-to-yaml-ng executable for Dhall-to-YAML conversion
      and yaml-to-dhall for the reverse direction, with library modules for Haskell
      callers. It is usually installed as a companion to Dhall when a downstream system
      still consumes YAML.
related-packages:
  - id: brew:dhall-json
    reason: >
      Choose dhall-json's dhall-to-yaml executable when compatibility with its
      JSON-based conversion path is preferable; dhall-yaml provides the HsYAML-based
      dhall-to-yaml-ng and the reverse yaml-to-dhall tool.
    rel: alternative
    sources:
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-yaml
      - https://hackage.haskell.org/package/dhall-json/docs
  - id: brew:dhall
    reason: >
      Use the core Dhall package alongside dhall-yaml for type checking, normalization,
      formatting, and other direct work on the source expressions.
    rel: adjacent_workflow
    sources:
      - https://github.com/dhall-lang/dhall-haskell
      - https://docs.dhall-lang.org/tutorials/Getting-started_Generate-JSON-or-YAML.html
category: developer-tools
package-manager:
  brew: dhall-yaml
  nix: dhall-yaml
  pacman: dhall-yaml
package-manager-url: https://formulae.brew.sh/formula/dhall-yaml
license: BSD-3-Clause
tags:
  - cli
  - configuration
  - converter
  - dhall
  - serialization
  - yaml
description: Convert between Dhall and YAML
executables:
  - dhall-to-yaml-ng
  - yaml-to-dhall
provenance:
  formula: dhall-yaml
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
