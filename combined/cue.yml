id: brew:cue
display-name: CUE
homepage: https://cuelang.org/
repo: https://github.com/cue-lang/cue
docs:
  - https://cuelang.org/docs
  - https://cuelang.org/docs/reference/spec
  - https://github.com/cue-lang/cue#readme
config-file-location:
  unix:
    - ./cue.mod/module.cue
    - ./cue.mod/local-module.cue
  windows:
    - .\cue.mod\module.cue
    - .\cue.mod\local-module.cue
credentials-file-location:
  linux:
    - $XDG_CONFIG_HOME/cue/logins.json
    - ~/.config/cue/logins.json
  macos: ~/Library/Application Support/cue/logins.json
  windows: '%AppData%\cue\logins.json'
history:
  adoption-history:
    - >
      The project positions CUE for validation, configuration, querying, code
      generation, scripting, and integration with formats such as Go, JSON, YAML, TOML,
      XML, OpenAPI, Protobuf, and JSON Schema. The public cue-lang/cue repository was
      created in 2021, while the repository README carries copyright notices beginning
      in 2018.
  package-nerd-significance:
    - >
      CUE matters to package maintainers because it is both a language implementation
      and a standalone CLI used in build, validation, and configuration pipelines. The
      upstream README explicitly advises downstream packagers to build from git tags so
      cue version metadata is embedded correctly.
  project-history:
    - >
      The CUE documentation traces the language's roots to GCL, Google's configuration
      language for Borg, and to graph unification techniques used for large declarative
      systems. CUE returns to a constraint-based approach where types and values are
      unified in one model.
  related-projects:
    - >
      GCL, Borg, Kubernetes-era configuration systems, Go modules, JSON Schema, OpenAPI,
      Protobuf.
  sources:
    - https://cuelang.org/docs/
    - https://cuelang.org/docs/introduction/
    - https://github.com/cue-lang/cue
    - https://api.github.com/repos/cue-lang/cue
    - https://raw.githubusercontent.com/cue-lang/cue/master/README.md
  summary:
    - >
      CUE is an open-source data validation language, inference engine, and command-line
      tool for schemas, configuration, policy, and data transformation.
  timeline:
    - '2018: CUE repository README copyright period begins.'
    - '2021: Public cue-lang/cue repository created on GitHub.'
    - >
      2020s: Official docs present CUE as a data validation language and inference
      engine rooted in GCL and graph unification.
  usage:
    - >
      The cue command validates data, evaluates CUE files, vets configuration, generates
      or extracts schemas, and acts as the package's main user-facing interface.
      Official installation docs include release binaries, source installs, and
      container images.
related-packages:
  - id: brew:conftest
    reason: >
      Use Conftest alongside CUE when you want Rego policy checks over .cue files or
      other structured configuration before deployment.
    rel: adjacent_workflow
    sources:
      - https://www.conftest.dev/
      - https://www.conftest.dev/options/
      - https://cuelang.org/docs/reference/command/
category: language-runtime
package-manager:
  brew: cue
  macports: cue
  nix: cue
  pacman: cue
  scoop: main/cue
  winget: CueLang.Cue
package-manager-url: https://formulae.brew.sh/formula/cue
license: Apache-2.0
tags:
  - cli
  - configuration
  - data-validation
  - language
  - policy
  - schema
description: Validate and define text-based and dynamic configuration
executables:
  - cue
provenance:
  formula: cue
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
