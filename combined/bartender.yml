history:
  adoption-history:
    - >
      Bartender has been sold across multiple major macOS generations and is described
      by its publisher as an award-winning application used for more than a decade. Its
      niche grew more relevant as menu bars accumulated status items and MacBook
      displays introduced a camera notch.
    - >
      Bartender 6 extends the established hiding and revealing workflow with presets,
      triggers, groups, styling, widgets, and compatibility with recent macOS releases.
  package-nerd-significance:
    - >
      Bartender is a canonical Mac power-user utility: small in scope, deeply integrated
      with the desktop, and commonly installed early on a configured Mac. Its Homebrew
      cask makes commercial menu-bar customization reproducible alongside developer
      tooling.
    - >
      The package is also sensitive to macOS UI and permission changes, so major
      operating-system releases and Bartender compatibility are important to managed
      installations.
  project-history:
    - >
      Bartender was created as a macOS utility for controlling which status items appear
      in the menu bar. The official publisher describes a product history of more than
      ten years.
    - >
      Successive major versions expanded the original hide-and-reveal model. Bartender 6
      was redesigned for current macOS releases and added richer automation, grouping,
      styling, presets, and user-created widgets.
  related-projects:
    - >
      Apple's built-in Control Center and menu-bar settings provide limited native
      management; Bartender adds deeper organization, search, layout, and automation.
  sources:
    - 'Official Bartender product and FAQ page: https://www.macbartender.com/'
    - source_facts.applications
    - source_facts.description
  summary:
    - >
      Bartender is a commercial macOS utility for organizing, hiding, revealing,
      searching, styling, and automating menu-bar items.
  timeline:
    - '2010s: Bartender establishes itself as a macOS menu-bar management utility.'
    - '2020s: Later releases add notch-aware access, search, layout controls, and automation.'
    - >
      2026: Bartender 6 is offered with presets, triggers, groups, styling, and widget
      support.
  usage:
    - >
      Users choose which menu-bar items remain visible, reveal hidden items on demand,
      search for items, adjust spacing and appearance, and automate layouts with presets
      and triggers.
    - >
      No official fixed filesystem location for configuration or license credentials was
      verified. Users should export or transfer settings through documented in-app
      facilities when available rather than manipulating internal files.
