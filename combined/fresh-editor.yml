id: brew:fresh-editor
display-name: Fresh
homepage: https://sinelaw.github.io/fresh/
repo: https://github.com/sinelaw/fresh
docs:
  - https://getfresh.dev/docs
  - https://getfresh.dev/docs/user-guide/getting-started
  - https://github.com/sinelaw/fresh#readme
config-file-location:
  unix:
    - ~/.config/fresh/config.json
    - .fresh/config.json
    - .fresh/session.json
  windows:
    - '%APPDATA%\fresh\config.json'
    - .fresh\config.json
    - .fresh\session.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The README presents Fresh as broadly packaged rather than source-only. It
      documents installation through Homebrew, winget, Arch AUR packages, Debian and
      Ubuntu `.deb` packages, Fedora and RHEL `.rpm` packages, openSUSE, FreeBSD
      ports/pkg, Gentoo GURU, AppImage, Flatpak, npm, cargo-binstall, crates.io, Nix
      flakes, prebuilt binaries, and source builds.
    - >
      That distribution list suggests the project is aimed at users who want a modern
      editor binary available from normal operating-system and language package
      channels, not only Rust developers.
  package-nerd-significance:
    - >
      Fresh is package-nerd interesting because it is a contemporary terminal editor
      that deliberately targets many package channels at once. It is a useful specimen
      of how a Rust CLI application can be shipped through native package managers,
      language registries, self-contained Linux formats, and prebuilt release artifacts
      while keeping the runtime surface to a single `fresh` command.
  project-history:
    - >
      Fresh is developed as a Rust application under the `sinelaw/fresh` repository and
      is documented through an official website and user guide. Official release
      metadata visible during research showed a fast-moving 0.x line in 2026, including
      the 0.3 series in May 2026 and 0.4 releases in June 2026.
  related-projects:
    - >
      Fresh is positioned against familiar graphical editor workflows from editors such
      as VS Code and Sublime Text, while remaining a terminal-first application.
    - >
      Its related packaging surfaces include crates.io, npm, Homebrew, winget, Nix
      flakes, AppImage, Flatpak, and Linux distribution package formats.
  sources:
    - https://getfresh.dev/docs
    - https://github.com/sinelaw/fresh/releases
    - https://raw.githubusercontent.com/sinelaw/fresh/master/README.md
  summary:
    - >
      Fresh is a terminal text editor that presents familiar graphical-editor
      conventions inside a terminal UI. Its official README describes zero-configuration
      startup, standard keybindings, mouse support, menus, a command palette,
      language-server features, multi-cursor editing, themes, plugins, and large-file
      handling.
  timeline:
    - '2026-05: Official releases include Fresh 0.3.x builds.'
    - '2026-06: Official releases include Fresh 0.4.0, 0.4.1, and 0.4.2.'
    - >
      2026: The README documents wide package availability across Homebrew, winget, AUR,
      deb/rpm, AppImage, Flatpak, npm, crates.io, Nix, FreeBSD, and Gentoo.
  usage:
    - >
      The main command is `fresh`, used to open files from the terminal. Typical use is
      interactive editing with familiar shortcuts, command-palette navigation, LSP
      features, search and replace, file explorer workflows, split panes, integrated
      terminal support, themes, and TypeScript plugins.
category: productivity
package-manager:
  brew: fresh-editor
  macports: fresh
  nix: fresh-editor
  scoop: main/fresh
  winget: sinelaw.fresh-editor
  zypper: fresh-editor
package-manager-url: https://formulae.brew.sh/formula/fresh-editor
license: GPL-3.0-or-later
tags:
  - cli
  - ide
  - rust
  - terminal-editor
  - text-editor
description: 'Text editor for your terminal: easy, powerful and fast'
executables:
  - fresh
provenance:
  formula: fresh-editor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
