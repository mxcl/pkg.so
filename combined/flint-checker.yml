id: brew:flint-checker
display-name: Flint
homepage: https://github.com/pengwynn/flint
repo: https://github.com/pengwynn/flint
docs:
  - https://github.com/pengwynn/flint#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Flint's official README documents installation through Go, prebuilt GitHub release
      binaries, and Homebrew as flint-checker. The supplied package metadata also
      records packaging in Homebrew.
    - >
      The tool reflects the GitHub-era convention that repository quality is partly
      social: a project should include contribution, license, bootstrap, and
      test-running paths that new contributors can discover quickly.
  package-nerd-significance:
    - >
      Flint is package-nerd relevant as a tiny lint tool for repository metadata rather
      than source code. It turns informal open-source hygiene expectations into a CLI
      that package maintainers and project owners could run locally.
    - >
      Its Homebrew formula name, flint-checker, also matters because the plain flint
      package name collides with other software in distro ecosystems.
  project-history:
    - >
      The README describes Flint as a tool for helping potential contributors answer
      basic questions about a project: what it does, how it is licensed, how to
      contribute, how to set up development, and how to run tests.
    - >
      The project was maintained by Wynn Netherland and carries a 2014 copyright notice.
      Its GitHub release metadata shows v0.0.3 in January 2014 and v0.0.4 in December
      2014.
  related-projects:
    - >
      The README cites GitHub contributor-guideline behavior, Choose a License, and
      readme-driven development as part of its philosophy.
    - >
      Flint is conceptually related to repository linting and project-health checkers
      rather than language-specific code linters.
  sources:
    - https://api.github.com/repos/pengwynn/flint/releases
    - https://github.com/pengwynn/flint
  summary:
    - >
      Flint is a small Go command-line checker for common sources of contributor
      friction in software projects. It checks for project affordances such as a README,
      contribution guide, license, bootstrap script, and test script.
  timeline:
    - '2014: Project copyright notice appears in the README.'
    - '2014: v0.0.3 was published in January.'
    - '2014: v0.0.4 was published in December.'
    - '2014: README documented Go, prebuilt binary, and Homebrew installation paths.'
  usage:
    - >
      Users run flint from a project root to get warnings and errors about missing
      contributor-facing files. It can also check a remote GitHub repository by
      owner/name without cloning.
    - >
      Command-line options let users skip individual checks and provide a GitHub API
      token through FLINT_TOKEN when checking remote repositories.
related-packages: []
category: developer-tools
package-manager:
  apk: flint
  brew: flint-checker
  debian: libflint-dev
  dnf: flint
  macports: flint
  nix: flint
  pacman: flint
  ubuntu: libflint-dev
  winget: GrafanaLabs.Flint
  zypper: flint-devel
package-manager-url: https://formulae.brew.sh/formula/flint-checker
license: MIT
tags:
  - cli
  - contributor-experience
  - go
  - linting
  - project-health
description: Check your project for common sources of contributor friction
executables:
  - flint
provenance:
  formula: flint-checker
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
