id: brew:clipper
display-name: Clipper
homepage: https://github.com/wincent/clipper
repo: https://github.com/wincent/clipper
docs:
  - https://github.com/wincent/clipper#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/clipper/clipper.json
    - ~/.config/clipper/clipper.json
    - ~/.clipper.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages Clipper for macOS users and the input package facts also
      identify packaging in Alpine, MacPorts, Nix, Debian, and Ubuntu contexts. GitHub
      repository metadata showed hundreds of stars, indicating durable usage in the tmux
      and remote-shell niche.
  package-nerd-significance:
    - >
      Clipper matters to package nerds because it packages a very specific workstation
      integration problem: making tmux, Vim, SSH, pbcopy, xclip, launch agents, systemd
      user services, netcat, and Unix sockets cooperate. It is small, old, and
      practical, exactly the kind of utility that survives in package repositories
      because it solves one annoying terminal workflow.
  project-history:
    - >
      The GitHub repository was created on 2013-02-18. The official README frames
      Clipper as a solution to a long-standing tmux and macOS pasteboard problem:
      processes started by tmux often cannot directly talk to the system clipboard, and
      remote tmux sessions make that harder.
    - >
      Clipper listens on TCP or a Unix domain socket, receives copied text, and writes
      it into the local system clipboard. It can run as a macOS launch agent or Linux
      systemd user service.
  related-projects:
    - >
      The README names reattach-to-user-space / tmux-MacOSX-pasteboard as an earlier
      workaround for macOS pasteboard context problems.
    - The README links to companion Vim integrations nvim-clipper and vim-clipper.
  sources:
    - https://github.com/wincent/clipper#readme
    - https://formulae.brew.sh/api/formula/clipper.json
    - https://github.com/wincent/clipper
  summary:
    - >
      Clipper is a small daemon or macOS launch agent that exposes the local clipboard
      to tmux, Vim, SSH, and other local or remote processes.
  timeline:
    - '2013-02-18: GitHub repository is created.'
    - >
      2010s: README documents tmux versions before and after 2.4, reflecting
      compatibility with older tmux copy-mode APIs.
    - '2026: Homebrew formula tracks stable release 3.0.0 from the official GitHub tag archive.'
  usage:
    - >
      The README shows tmux bindings using `copy-pipe` or `copy-pipe-and-cancel` with
      netcat or socat, Vim mappings that send yanked text to Clipper, shell aliases such
      as `clip="nc localhost 8377"`, and SSH `RemoteForward` rules that carry remote
      clipboard traffic back to the local machine.
related-packages:
  - id: brew:tmux
    reason: >
      Clipper's primary documented workflow sends tmux copy-mode buffers to the local
      clipboard over TCP or a Unix socket, including from remote tmux sessions.
    rel: adjacent_workflow
    sources:
      - https://github.com/wincent/clipper#readme
      - https://github.com/tmux/tmux/wiki/Clipboard
  - id: brew:xclip
    reason: >
      Clipper uses xclip as its documented Linux clipboard-writing backend, while using
      pbcopy by default on macOS.
    rel: adjacent_workflow
    sources:
      - https://github.com/wincent/clipper#readme
      - https://github.com/astrand/xclip#readme
category: productivity
package-manager:
  apk: clipper
  brew: clipper
  debian: libclipper-dev
  macports: clipper
  nix: clipper
  ubuntu: libclipper-dev
package-manager-url: https://formulae.brew.sh/formula/clipper
license: BSD-2-Clause
tags:
  - cli
  - clipboard
  - daemon
  - linux
  - macos
  - ssh
  - tmux
description: Share macOS clipboard with tmux and other local and remote apps
executables:
  - clipper
provenance:
  formula: clipper
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
