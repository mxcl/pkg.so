id: brew:libassuan
display-name: Libassuan
homepage: https://www.gnupg.org/related_software/libassuan/
repo: https://git.gnupg.org/cgi-bin/gitweb.cgi?p=libassuan.git
docs:
  - https://www.gnupg.org/documentation/manuals/assuan
  - https://www.gnupg.org/related_software/libassuan
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Libassuan became part of the broader GnuPG component stack. GnuPG describes the
      protocol as used for IPC between most newer GnuPG components, and release
      announcements also describe it as used by GnuPG, GPGME, and related packages.
  package-nerd-significance:
    - >
      Libassuan is one of those small GnuPG libraries that appear everywhere because key
      management, pinentry, GPGME, and package-signature tooling depend on the GnuPG
      stack. For package maintainers, it matters less as a user-facing tool than as a
      security plumbing layer with ABI and licensing implications.
  project-history:
    - >
      The Assuan manual says the protocol and library were developed for GNU Privacy
      Guard so user interfaces, mail clients, and other encryption front ends could
      communicate with smaller GnuPG server components without being able to corrupt or
      inspect server memory.
    - >
      The GnuPG project page describes Libassuan as a small library implementing the
      Assuan protocol, with both client-side and server-side functions. Development is
      hosted in the GnuPG Git infrastructure.
  related-projects:
    - >
      GnuPG, GPGME, pinentry, libgpg-error, libgcrypt, libksba, and nPth are the closest
      package-stack relatives.
  sources:
    - https://lists.gnupg.org/pipermail/gnupg-announce/2015q3/000374.html
    - https://www.gnupg.org/documentation/manuals/assuan/
    - https://www.gnupg.org/documentation/manuals/assuan/Assuan.html
    - https://www.gnupg.org/documentation/manuals/assuan/Introduction.html
    - https://www.gnupg.org/software/libassuan/index.html
  summary:
    - >
      Libassuan is the GnuPG project's IPC library for the Assuan protocol. It exists so
      GnuPG front ends and helper processes can talk through a small, auditable
      client/server protocol instead of sharing one address space with sensitive
      cryptographic state.
  timeline:
    - '2001: Assuan manual copyright history begins with the Free Software Foundation.'
    - >
      2015: Libassuan 2.3.0 announcement describes it as a generic IPC library used by
      GnuPG and GPGME.
    - '2017: The published Assuan manual edition 2.5.3 is dated 2017-12-07.'
    - '2020: The GnuPG Libassuan project page records a 2020-11-19 page change.'
  usage:
    - >
      Programs use Libassuan to build transaction-oriented IPC over pipes or Unix domain
      sockets. The protocol is mostly text based, supports client/server communication
      with a back channel, descriptor passing for bulk data, and optional
      confidentiality features for parts of a conversation.
related-packages:
  - id: brew:gnupg
    reason: >
      GnuPG is the principal application stack for which Assuan was designed and uses
      the library for communication among specialized cryptographic components.
    rel: adjacent_workflow
    sources:
      - https://www.gnupg.org/software/libassuan/index.html
      - https://www.gnupg.org/software/libraries.html
  - id: brew:gpgme
    reason: >
      GPGME exposes the Assuan protocol so applications can send transactions to the
      GnuPG agent or another Assuan server through its higher-level API.
    rel: adjacent_workflow
    sources:
      - https://www.gnupg.org/documentation/manuals/gpgme/Assuan.html
      - https://www.gnupg.org/documentation/manuals/gpgme/Using-the-Assuan-protocol.html
