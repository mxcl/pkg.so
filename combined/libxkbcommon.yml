id: brew:libxkbcommon
display-name: libxkbcommon
homepage: https://xkbcommon.org/
repo: https://github.com/xkbcommon/libxkbcommon
docs:
  - https://xkbcommon.org/doc/current
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/xkb/
    - ~/.config/xkb/
    - ~/.xkb/
    - $XKB_CONFIG_EXTRA_PATH
    - /etc/xkb/
    - $XKB_CONFIG_ROOT
    - /usr/share/xkeyboard-config-<VERSION>/
    - /usr/share/X11/xkb/
credentials-file-location: null
history:
  adoption-history:
    - >
      libxkbcommon became central to Wayland because compositors, toolkits, and
      applications need to translate key events into characters and actions without
      relying on the X server as the keyboard interpreter. The documentation explicitly
      describes it as the standard keymap handling library on Wayland.
    - >
      It also remained useful to X11 clients through the xkbcommon-x11 module, making it
      a bridge between old XKB data and newer compositor-centered desktop stacks.
  package-nerd-significance:
    - >
      libxkbcommon is a load-bearing desktop plumbing package: boring until it is
      missing, then every keyboard layout, dead key, and Wayland compositor path becomes
      suspect. It is also a rare case where a compatibility library helped define the
      practical boundary between X11 inheritance and Wayland-native behavior.
  project-history:
    - >
      libxkbcommon reworked the classic X Keyboard Extension concepts into a library API
      for clients, toolkits, compositors, and other system components. The project
      documentation says it processes XKB keymaps while omitting some legacy features,
      and the repository credits Dan Nicholson for early work getting xkbcommon started.
    - >
      The 2020-09 libxkbcommon 1.0.0 announcement states that the first commit was on
      2009-01-13 and that the first release with the present API was on 2012-10-24.
      Release notes then show the project moving through the 1.x line with continued
      API, tools, build-system, and keymap-format work.
  related-projects:
    - >
      Related projects include Wayland compositors, Xorg/X11 clients, xkeyboard-config,
      libX11 Compose data, libxcb, xorgproto, and desktop toolkits that process keyboard
      input.
  sources:
    - https://github.com/xkbcommon/libxkbcommon
    - https://lists.freedesktop.org/archives/wayland-devel/2020-September/041596.html
    - https://xkbcommon.org/doc/current/
    - https://xkbcommon.org/doc/current/release-notes.html
  summary:
    - >
      libxkbcommon is the standard Wayland-era keymap handling library for XKB keyboard
      descriptions, keyboard state, Compose/dead keys, and keyboard-layout tooling.
  timeline:
    - '2009-01-13: First xkbcommon commit, according to the 1.0.0 announcement.'
    - '2012-10-24: First release with the present API, according to the 1.0.0 announcement.'
    - "2013-04-01: libxkbcommon 0.3.0 appears in the project's release notes."
    - '2020-09-05: libxkbcommon 1.0.0 released.'
    - >
      2025-08-08: libxkbcommon 1.11.0 introduced XKB_KEYMAP_FORMAT_TEXT_V2 for
      long-standing XKB ecosystem issues.
  usage:
    - >
      Developers use libxkbcommon to compile keymaps, track keyboard state, handle
      Compose sequences, and inspect layouts. Users see it indirectly through desktop
      environments and toolkits, while packagers also ship xkbcli tools such as
      compile-keymap, how-to-type, interactive-wayland, interactive-x11, and list.
related-packages:
  - id: brew:xkbcomp
    reason: >
      Choose xkbcomp for compiling or loading XKB maps directly into an X server;
      libxkbcommon's xkbcli covers many inspection and compilation tasks and is designed
      for Wayland as well as X11.
    rel: alternative
    sources:
      - https://xkbcommon.org/doc/current/faq.html
      - https://xorg.freedesktop.org/archive/X11R7.5/doc/man/man1/xkbcomp.1.html
category: system
package-manager:
  apk: libxkbcommon
  brew: libxkbcommon
  debian: libxkbcommon-dev
  dnf: libxkbcommon
  macports: libxkbcommon
  nix: libxkbcommon
  pacman: libxkbcommon
  ubuntu: libxkbcommon-dev
  zypper: libxkbcommon-devel
package-manager-url: https://formulae.brew.sh/formula/libxkbcommon
license: MIT
tags:
  - cli
  - input
  - keyboard
  - wayland
  - x11
  - xkb
description: Keyboard handling library
executables:
  - xkbcli
provenance:
  formula: libxkbcommon
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
