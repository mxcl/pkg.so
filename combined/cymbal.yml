  - https://github.com/1broseidon/cymbal/blob/main/docs/guide/getting-started.md
  - https://github.com/1broseidon/cymbal/blob/main/docs/index.md
  - https://github.com/1broseidon/cymbal/blob/main/docs/reference/commands.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation instructions support Homebrew on macOS and Linux, a
      community-maintained Arch User Repository package, Windows PowerShell
      installation, Go installation, Docker, and downloadable release binaries. The
      supplied package metadata records the Homebrew formula as `cymbal`.
  package-nerd-significance:
    - >
      cymbal combines tree-sitter parsing with a per-repository SQLite index and exposes
      symbol search, references, call relationships, change-impact analysis, and graph
      output from one CLI. It is particularly relevant to package enthusiasts interested
      in local-first developer tools and command-line interfaces designed for both
      people and coding agents.
  project-history:
    - >
      cymbal was developed as a fast, language-agnostic code navigator. Its documented
      design parses source with tree-sitter, stores extracted symbols, imports, and
      references in SQLite, and incrementally refreshes changed files without requiring
      a daemon.
  related-projects:
    - >
      tree-sitter supplies the parsing model, while SQLite and FTS5 provide the local
      index and search layer. The project can also be embedded as a Go library and
      integrated with agent environments through its hook commands.
  sources:
    - >
      Official documentation index:
      https://github.com/1broseidon/cymbal/blob/main/docs/index.md
    - 'Official releases: https://github.com/1broseidon/cymbal/releases'
    - 'Official repository and README: https://github.com/1broseidon/cymbal'
    - 'Package provenance: source_facts.package-manager and source_facts.provenance'
  summary:
    - >
      cymbal is an open-source, local-first command-line code navigator for exploring
      symbols and relationships across repositories. It targets interactive terminal
      use, editor or bot integrations, and AI-agent code-reading workflows.
  timeline:
    - >
      2026: The official documentation and release history show cymbal under active
      development, with packaged releases and dedicated guides for CLI users,
      integrations, and library consumers.
  usage:
    - >
      Users typically run `cymbal investigate`, `trace`, or `impact` to orient
      themselves around a symbol, with narrower commands for search, source display,
      references, outlines, importers, and diffs. An index is built automatically on
      first query and subsequently refreshed incrementally. Machine-readable JSON and
      graph formats support scripts and agent integrations.
