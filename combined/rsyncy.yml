id: brew:rsyncy
display-name: rsyncy
homepage: https://github.com/laktak/rsyncy
repo: https://github.com/laktak/rsyncy
docs:
  - https://github.com/laktak/rsyncy#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew, Go, binary, and Arch/AUR installation routes. It
      also provides integration instructions for the lf terminal file manager.
  package-nerd-significance:
    - >
      rsyncy illustrates the Unix wrapper pattern: improving visibility around an
      established command while preserving its arguments and transfer implementation.
  project-history:
    - >
      Developed under laktak, rsyncy adds a consolidated progress display to rsync. The
      official README describes a Go implementation alongside a maintained legacy Python
      implementation.
  related-projects:
    - rsync performs transfers; lf can display status through rsyncy-stat.
  sources:
    - https://github.com/laktak/rsyncy#readme
  summary:
    - rsyncy displays transfer progress, throughput, elapsed time, and file counts for rsync.
  timeline:
    - >
      Undated: The project documents a Go implementation and continued maintenance of
      its legacy Python implementation.
  usage:
    - >
      Invoke rsyncy with normal rsync arguments, or pipe suitably configured rsync
      output into it. The wrapper adds progress flags automatically. NO_COLOR disables
      colors. Progress percentages can fall while rsync discovers additional files.
category: system
package-manager:
  brew: rsyncy
  nix: rsyncy
package-manager-url: https://formulae.brew.sh/formula/rsyncy
license: MIT
tags:
  - cli
  - file-transfer
  - progress-bar
  - rsync
  - tui
description: Status/progress bar for rsync
executables:
  - rsyncy
provenance:
  formula: rsyncy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
