history:
  project-history:
    - >
      The application grew around a multi-pane workflow for heavy timeline use: home
      timelines, replies, lists, searches, threads, profiles, and activity views can be
      arranged side by side. The same official feature page emphasizes multi-account
      use, extracted tabs, list handling, thread views, and search tabs, making mikutter
      more of a programmable social-dashboard client than a simple single-feed reader.
  sources:
    - https://formulae.brew.sh/formula/mikutter
    - https://mikutter.hachune.net/
    - https://mikutter.hachune.net/develop
    - https://mikutter.hachune.net/download
    - https://mikutter.hachune.net/function
    - https://reference.mikutter.hachune.net/
  summary:
    - >
      mikutter is a Ruby/GTK social client created by Toshiaki Asai, who is listed on
      the project's development page as toshi_a. Its site dates the project copyright
      span from 2009 to 2024 and publishes a long download archive reaching back to
      0.0.1-era tarballs, which places it among the long-running desktop Twitter clients
      from the pre-X era.
  usage:
    - >
      A notable part of mikutter's niche is its plugin culture. The project maintains a
      separate "Writing mikutter plugin" reference for installing and developing
      plugins, and the development page points plugin authors to those docs. In
      package-manager terms it is a desktop Ruby application distributed through
      Homebrew and Linux distributions rather than a library dependency; users normally
      install the `mikutter` executable and extend it through the app's plugin system.
