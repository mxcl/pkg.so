id: brew:markdownlint-cli2
display-name: markdownlint-cli2
homepage: https://github.com/DavidAnson/markdownlint-cli2
repo: https://github.com/DavidAnson/markdownlint-cli2
docs:
  - https://github.com/DavidAnson/markdownlint-cli2#readme
config-file-location:
  unix:
    - .markdownlint-cli2.jsonc
    - .markdownlint-cli2.yaml
    - .markdownlint-cli2.cjs
    - .markdownlint-cli2.mjs
    - .markdownlint.jsonc
    - .markdownlint.json
    - .markdownlint.yaml
    - .markdownlint.yml
    - .markdownlint.cjs
    - .markdownlint.mjs
    - package.json
    - pyproject.toml
    - file supplied with --config
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026-07-01 the GitHub repository reported 849 stars and 76 forks, and the
      package was available through npm, Homebrew, Nix, and Arch packaging according to
      the supplied package-manager facts. The README also documents a GitHub Action and
      Docker images, reflecting use in repository automation rather than only local
      editing.
  package-nerd-significance:
    - >
      markdownlint-cli2 is a good example of the second-generation CLI pattern around a
      reusable library: the core lint rules live in markdownlint, while the
      package-manager-facing tool optimizes installation, config discovery, CI
      ergonomics, and formatter support.
  project-history:
    - >
      The GitHub repository was created on 2020-07-03, shortly before the npm package
      appeared on 2020-07-04. Its README presents it as a replacement-style companion to
      markdownlint-cli: it is configuration-based, prioritizes speed, and keeps
      compatibility with markdownlint rules while changing the user workflow around
      config files and glob handling.
    - >
      The project sits in the same ecosystem as David Anson's markdownlint library and
      vscode-markdownlint extension. It exposes the markdownlint engine as a standalone
      CLI, an npm package, Docker images, and a pre-commit hook target, which made it
      useful outside editors and CI systems.
  related-projects:
    - markdownlint is the underlying Node.js linting library.
    - >
      vscode-markdownlint and markdownlint-cli2-action are companion tools in the same
      Markdown linting ecosystem.
  sources:
    - https://github.com/DavidAnson/markdownlint-cli2
    - https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/main/README.md
    - https://registry.npmjs.org/markdownlint-cli2
    - source_facts.package-manager
  summary:
    - >
      markdownlint-cli2 is David Anson's newer command-line wrapper around the Node.js
      markdownlint library, intended for fast, configuration-centered linting of
      Markdown and CommonMark files.
  timeline:
    - '2020: GitHub repository created and npm package first published.'
    - >
      2026: Latest npm package observed as 0.23.0; repository metadata showed active
      maintenance on 2026-07-01.
  usage:
    - >
      Typical use is to run markdownlint-cli2 over Markdown globs, often excluding
      generated or dependency directories with ignored glob patterns. The tool discovers
      project config files such as .markdownlint-cli2.jsonc, .markdownlint-cli2.yaml,
      .markdownlint.* variants, package.json, or pyproject.toml, and also accepts an
      explicit --config path.
    - >
      Package maintainers care about it because it is a small but opinionated CLI around
      an established Markdown linter: it standardizes Markdown style checks for
      docs-heavy repositories and is easy to wire into npm scripts, pre-commit, Docker,
      or GitHub Actions.
related-packages:
  - id: brew:markdownlint-cli
    reason: >
      Choose markdownlint-cli when you prefer a traditional, explicit file-and-option
      command interface for the same markdownlint rule engine.
    rel: alternative
    sources:
      - https://github.com/DavidAnson/markdownlint-cli2#overview
      - https://github.com/igorshubovych/markdownlint-cli#usage
  - id: brew:mado
    reason: >
      Choose Mado when you want a Rust-native Markdown linter and can use its documented
      subset of markdownlint rules instead of markdownlint-cli2's full library
      ecosystem.
    rel: alternative
    sources:
      - https://github.com/akiomik/mado#readme
      - https://github.com/DavidAnson/markdownlint-cli2#overview
category: developer-tools
package-manager:
  brew: markdownlint-cli2
  dnf: markdownlint-cli2
  nix: markdownlint-cli2
  pacman: markdownlint-cli2
package-manager-url: https://formulae.brew.sh/formula/markdownlint-cli2
license: MIT
tags:
  - cli
  - commonmark
  - configuration
  - linting
  - markdown
  - style-checker
description: Fast, flexible, config-based cli for linting Markdown/CommonMark files
executables:
  - markdownlint-cli2
provenance:
  formula: markdownlint-cli2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
