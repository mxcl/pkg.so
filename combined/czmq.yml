id: brew:czmq
display-name: CZMQ
homepage: http://czmq.zeromq.org/
repo: https://github.com/zeromq/czmq
docs:
  - http://czmq.zeromq.org/manual:czmq
  - http://czmq.zeromq.org/
  - https://zeromq.org/languages/c
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CZMQ became part of the standard ZeroMQ packaging stack because C applications and
      language bindings could depend on higher-level socket, certificate, actor, and
      system helpers instead of writing directly against libzmq primitives.
  package-nerd-significance:
    - >
      For package nerds, CZMQ is one of the classic split-library cases: libzmq is the
      core, CZMQ is the high-level C convenience layer, and both tend to appear together
      in Unix package repositories for messaging software.
  project-history:
    - >
      The CZMQ repository was created in 2011. Its README says the project grew out of
      concepts developed in the ZeroMQ Guide and aims to wrap the core ZeroMQ API in
      shorter, more readable application semantics.
  related-projects:
    - >
      CZMQ is closely tied to libzmq, the ZeroMQ Guide, ZeroMQ security mechanisms such
      as CURVE, and bindings built on top of the C layer.
  sources:
    - https://github.com/zeromq/czmq
    - https://api.github.com/repos/zeromq/czmq
    - https://github.com/zeromq/czmq/releases/tag/v4.2.1
    - https://zeromq.org/languages/c
  summary:
    - >
      CZMQ is the high-level C binding for ZeroMQ, packaging a friendlier C API, helper
      classes, actors, and command-line utilities around the lower-level libzmq
      messaging library.
  timeline:
    - '2011: CZMQ repository created.'
    - '2016: v4.0.2 release published.'
    - '2021: v4.2.1 release published.'
  usage:
    - >
      Developers use CZMQ as a C library layered on libzmq, commonly through
      package-manager development packages. The README documents building against
      libzmq, package-manager installation paths, zsock, zauth, zcert, zactor, and the
      zmakecert helper for CURVE certificates.
related-packages:
  - id: brew:zeromq
    reason: >
      Use ZeroMQ alongside CZMQ because libzmq is the underlying messaging engine that
      CZMQ wraps and links against.
    rel: adjacent_workflow
    sources:
      - https://github.com/zeromq/czmq/blob/master/README.txt
      - https://github.com/zeromq/libzmq
category: networking
package-manager:
  apk: czmq
  brew: czmq
  debian: libczmq-dev
  dnf: czmq
  macports: czmq
  nix: czmq
  ubuntu: libczmq-dev
  zypper: czmq
package-manager-url: https://formulae.brew.sh/formula/czmq
license: MPL-2.0
tags:
  - binding
  - c
  - cli
  - library
  - messaging
  - networking
  - zeromq
description: High-level C binding for ZeroMQ
executables:
  - zmakecert
provenance:
  formula: czmq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
