id: brew:mp3fs
display-name: mp3fs
homepage: https://khenriks.github.io/mp3fs/
repo: https://github.com/khenriks/mp3fs
docs:
  - https://github.com/khenriks/mp3fs#readme
  - https://khenriks.github.io/mp3fs
  - https://khenriks.github.io/mp3fs/mp3fs.1.html
config-file-location:
  unix: /etc/fstab
credentials-file-location: null
history:
  project-history:
    - >
      The project's role is a neat filesystem trick for lossless music collections. A
      user mounts a source directory and a mountpoint, and applications browsing the
      mountpoint see .mp3 names for the underlying FLAC/Ogg files. Reads initialize
      decoders and encoders, fill an internal per-file buffer, and emit MP3 data without
      requiring the user to keep a second converted library. The README gives examples
      for FUSE mounts and fstab entries, and describes practical uses such as feeding
      hardware or software that only understands MP3.
  sources:
    - https://formulae.brew.sh/formula/mp3fs
    - https://github.com/khenriks/mp3fs
    - https://khenriks.github.io/mp3fs/
    - https://khenriks.github.io/mp3fs/mp3fs.1.html
    - https://raw.githubusercontent.com/khenriks/mp3fs/master/NEWS.md
  summary:
    - >
      mp3fs is a read-only FUSE filesystem that presents FLAC and Ogg Vorbis files as
      MP3 files by transcoding on access. The original author and maintainer was David
      Collett from 2006 to 2008; K. Henriksson became the primary author and maintainer
      afterward. The manual records the same authorship split, with copyright for David
      Collett in 2006-2008 and K. Henriksson afterward.
  usage:
    - >
      Its major milestones track the broadening of that original idea. The news file
      lists an initial 0.01 release in 2006, a 0.30 release that added better
      documentation, bitrate selection, LAME quality settings, and metadata
      improvements, a 0.9 rewrite of the transcoding code around codec classes, and a
      1.0 release that added Ogg Vorbis decoding, VBR MP3 encoding, logging
      improvements, and a more modern C++11 codebase. In package managers it sits at the
      intersection of audio tooling and filesystem integration; Homebrew exposes it as a
      FUSE-dependent formula with FLAC, LAME, libid3tag, and libvorbis in its dependency
      chain.
related-packages:
  - id: brew:rsgain
    reason: >
      Use rsgain before mounting when you want to add ReplayGain metadata to FLAC or Ogg
      libraries that mp3fs can interpret while transcoding them to MP3.
    rel: adjacent_workflow
    sources:
      - https://khenriks.github.io/mp3fs/mp3fs.1.html
      - https://github.com/complexlogic/rsgain
category: system
package-manager:
  brew: mp3fs
  debian: mp3fs
  dnf: mp3fs
  macports: mp3fs
  nix: mp3fs
  ubuntu: mp3fs
package-manager-url: https://formulae.brew.sh/formula/mp3fs
license: GPL-3.0-or-later
tags:
  - audio
  - cli
  - filesystem
  - flac
  - fuse
  - mp3
  - transcoding
description: 'Read-only FUSE file system: transcodes audio formats to MP3'
executables:
  - mp3fs
provenance:
  formula: mp3fs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
