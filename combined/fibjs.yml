id: brew:fibjs
display-name: fibjs
homepage: https://fibjs.org/
repo: https://github.com/fibjs/fibjs
docs:
  - https://fibjs.org/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      fibjs has a narrower package footprint than Node.js-family tools; the package
      facts in this batch show Homebrew as the listed package manager. Its GitHub
      repository nevertheless has a multi-thousand-star audience, suggesting a visible
      but specialized community around its fiber-first runtime model.
  package-nerd-significance:
    - >
      fibjs is interesting to package nerds as an alternative JavaScript runtime with a
      distinct concurrency model rather than as another Node.js package manager
      companion. Packaging it means providing a standalone V8-based runtime for a
      smaller ecosystem.
  project-history:
    - >
      The GitHub repository was created in May 2014. The README describes fibjs as
      JavaScript on Fiber and emphasizes V8, fiber switching, synchronous style, and
      non-blocking I/O as the runtime's core design.
    - >
      The earliest release returned by the GitHub API in this batch run is v0.2.1 from
      August 2016, while another cited release was v0.37.0 from February 2024. The
      repository metadata still showed activity in 2026, but the official README remains
      terse compared with larger JavaScript runtimes.
  related-projects:
    - >
      fibjs is conceptually related to V8-based JavaScript runtimes and to
      fiber/coroutine concurrency models used to present synchronous-looking APIs over
      non-blocking I/O.
  sources:
    - https://github.com/fibjs/fibjs
    - https://api.github.com/repos/fibjs/fibjs
    - https://api.github.com/repos/fibjs/fibjs/releases
    - https://fibjs.org/docs
    - https://github.com/fibjs/fibjs_docs
    - https://formulae.brew.sh/formula/fibjs
  summary:
    - >
      fibjs is a JavaScript runtime built on Chrome's V8 engine with a fiber-based,
      synchronous-style, non-blocking I/O model. It targets server-side JavaScript users
      who want blocking-looking code paths on top of cooperative fibers.
  timeline:
    - '2014: GitHub repository created.'
    - '2016: Earliest GitHub API release in this batch run, v0.2.1, published.'
    - '2024: v0.37.0 published in the GitHub release stream cited for this record.'
    - '2026: Repository metadata showed continued activity.'
  usage:
    - >
      Users run JavaScript with the `fibjs` executable and use the project's
      documentation for the guide, manual, download page, and module reference. The
      README directs users to fibjs.org docs and a separate fibjs_docs repository.
related-packages:
  - id: brew:node
    reason: >
      Choose Node.js for its mainstream asynchronous event-loop ecosystem; choose fibjs
      when fiber-backed synchronous-style server code is the desired concurrency model.
    rel: alternative
    sources:
      - https://fibjs.org/en/docs/guide/sync.md.html
      - https://nodejs.org/en/about
category: language-runtime
