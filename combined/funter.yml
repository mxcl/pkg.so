id: cask:funter
display-name: Funter
homepage: https://nektony.com/products/funter
repo: null
docs:
  - https://nektony.com/funter
  - https://nektony.com/help/funter
config-file-location:
  macos: ~/Library/Preferences/com.nektony.Funter-SIII
credentials-file-location: null
history:
  adoption-history:
    - >
      Funter has been maintained as a free Mac utility through successive macOS
      releases, with Finder integration and menu-bar access keeping its specialized
      hidden-file workflow close to the native desktop.
  package-nerd-significance:
    - >
      Funter packages a collection of familiar Mac troubleshooting operations—showing
      dotfiles, finding application leftovers and caches, inspecting package contents,
      and changing visibility flags—into a graphical tool accessible to users who do not
      want to use Terminal.
    - >
      For package-manager users, the cask provides a reproducible way to install a
      focused system utility whose main value often appears during debugging, cleanup,
      or inspection of otherwise invisible files.
  project-history:
    - >
      Nektony developed Funter as a macOS utility dedicated to hidden files and folders.
      An official July 2016 announcement introduced Funter 2.0 with system-folder and
      package-content search, visibility switching, preview, Finder handoff, and file
      operations.
    - >
      Subsequent development retained the original hidden-file focus while improving
      search, Finder integration, operating-system compatibility, permissions handling,
      localization, and the application interface.
  related-projects:
    - >
      Funter complements Finder by exposing hidden items and adding visibility controls.
      Broader third-party file managers such as ForkLift can also reveal hidden files
      but cover many additional local and remote workflows.
  sources:
    - https://nektony.com/funter
    - https://nektony.com/help/funter
    - >
      https://nektony.com/wp-content/uploads/2020/08/July-2016-Hide-and-view-hidden-files-on-Mac-with-Funter.pdf
  summary:
    - >
      Funter is a free macOS utility for finding hidden files, changing their
      visibility, and operating on them through a menu-bar interface and Finder
      integration.
  timeline:
    - '2016: Nektony announced Funter 2.0 with hidden-file search and Finder integration.'
    - >
      2020s: Continued releases improved search, Finder integration, permissions
      handling, localization, and current-macOS compatibility.
  usage:
    - >
      Users toggle hidden-file visibility from the menu bar, search selected disks or
      folders, inspect package contents, preview results, and copy, move, delete, hide,
      or unhide files.
    - >
      Finder integration adds hide and unhide commands to Finder. Full Disk Access is
      needed when users want Funter to search the entire drive. The official uninstall
      guide identifies the preferences location; Funter has no documented account
      credentials.
related-packages:
  - id: cask:forklift
    reason: >
      Choose ForkLift when hidden-file visibility is needed inside a full dual-pane file
      manager with remote transfers and synchronization; Funter is the smaller free
      utility focused specifically on finding and hiding or revealing files.
    rel: alternative
    sources:
      - https://nektony.com/help/funter
      - https://binarynights.com/
category: system
