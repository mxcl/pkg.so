id: brew:markdownlint-cli
display-name: markdownlint-cli
homepage: https://github.com/igorshubovych/markdownlint-cli
repo: https://github.com/igorshubovych/markdownlint-cli
docs:
  - https://github.com/igorshubovych/markdownlint-cli#readme
config-file-location:
  unix:
    - .markdownlint.jsonc
    - .markdownlint.json
    - .markdownlint.yaml
    - .markdownlint.yml
    - .markdownlintrc
    - .markdownlintignore
    - file supplied with --config
credentials-file-location: null
history:
  adoption-history:
    - >
      markdownlint-cli became part of Markdown quality gates for repositories because it
      fits npm scripts, shell commands, Docker, and pre-commit hooks. The supplied
      package facts show packaging across Homebrew, Chocolatey, Debian/Ubuntu, Nix,
      Arch, and Scoop, which is broad coverage for a documentation linter.
  package-nerd-significance:
    - >
      markdownlint-cli is package-manager-relevant because it turns a JavaScript linting
      library into a predictable cross-platform command. It is one of the standard small
      tools maintainers reach for when Markdown style needs to be enforced alongside
      code linting.
  project-history:
    - >
      The official repository was created in 2016 and positions the project as a CLI
      wrapper around the markdownlint package. Its README documents npm installation,
      Homebrew installation on macOS, Docker/GitHub Packages usage, glob handling,
      automatic fixes, configuration files, exit codes, and pre-commit integration.
    - >
      The CLI evolved as practical automation around Markdown style rules: it can lint
      files, directories, and globs; read from stdin; emit JSON; ignore files; apply
      basic fixes; load custom rules; and override rule enable/disable settings from the
      command line.
  related-projects:
    - The README identifies markdownlint as the underlying API/rules package.
    - The README lists markdownlint-cli2 as an alternate CLI implementation.
  sources:
    - https://api.github.com/repos/igorshubovych/markdownlint-cli
    - https://github.com/DavidAnson/markdownlint
    - https://github.com/igorshubovych/markdownlint-cli
    - source_facts.package-manager
  summary:
    - >
      markdownlint-cli is the command-line interface for David Anson's markdownlint
      rules, packaged as a Node.js CLI named markdownlint.
  timeline:
    - '2016: GitHub repository created.'
    - >
      2016 onward: Tags begin with early 0.x releases and continue through later v0.x
      versions.
    - >
      2026: Supplied package facts show packaging across npm-oriented and OS
      package-manager ecosystems.
  usage:
    - >
      Users typically run markdownlint against Markdown file globs, often quoting globs
      so the CLI rather than the shell expands them. Configuration can be supplied with
      --config or discovered from .markdownlint.jsonc, .markdownlint.json,
      .markdownlint.yaml, .markdownlint.yml, or .markdownlintrc; .markdownlintignore is
      used for exclusions unless --ignore-path points elsewhere.
    - >
      The tool is common in CI because it has documented exit codes and can be added to
      pre-commit with the official repository as the hook source.
related-packages:
  - id: brew:markdownlint-cli2
    reason: >
      Choose markdownlint-cli2 when you want a configuration-centered workflow, ordered
      globs, formatters, and close integration with vscode-markdownlint while retaining
      the markdownlint rule engine.
    rel: alternative
    sources:
      - https://github.com/igorshubovych/markdownlint-cli#related
      - https://github.com/DavidAnson/markdownlint-cli2#overview
  - id: brew:mado
    reason: >
      Choose Mado when a Rust-native executable and its supported subset of
      markdownlint-compatible rules are preferable to the Node.js markdownlint-cli
      implementation.
    rel: alternative
    sources:
      - https://github.com/akiomik/mado#readme
      - https://github.com/igorshubovych/markdownlint-cli#readme
category: developer-tools
package-manager:
  brew: markdownlint-cli
  chocolatey: markdownlint-cli
  debian: markdownlint
  macports: markdownlint-cli
  nix: markdownlint-cli
  pacman: markdownlint-cli
  scoop: extras/.markdownlint
  ubuntu: markdownlint
package-manager-url: https://formulae.brew.sh/formula/markdownlint-cli
license: MIT
tags:
  - cli
  - commonmark
  - linting
  - markdown
  - nodejs
  - style-checker
description: CLI for Node.js style checker and lint tool for Markdown files
executables:
  - markdownlint
provenance:
  formula: markdownlint-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
