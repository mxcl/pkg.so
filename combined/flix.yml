id: brew:flix
display-name: Flix
homepage: https://flix.dev/
repo: https://github.com/flix/flix
docs:
  - https://doc.flix.dev/
config-file-location:
  unix: flix.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Flix's adoption is centered on language experimentation, academic
      programming-language work, and developers interested in mixing typed functional
      programming with embedded Datalog. Official docs emphasize Visual Studio Code
      support that uses the real compiler for diagnostics, navigation, and refactoring.
    - >
      The project is packaged for Homebrew and Nix in the supplied package facts, which
      makes the compiler available through general-purpose developer package managers
      rather than only through source builds.
  package-nerd-significance:
    - >
      Flix is package-nerd interesting because it packages a full language
      implementation with an active, frequent release cadence. It also sits at the
      intersection of compiler distribution, JVM runtime compatibility, editor tooling,
      and package-manager availability.
    - >
      Its official releases show long-running pre-1.0 iteration, which is common for
      research-influenced language projects where the package artifact is also the
      primary vehicle for language design experiments.
  project-history:
    - >
      The Flix documentation describes the language as developed at Aarhus University
      and by open-source contributors, in collaboration with researchers from the
      University of Waterloo, the University of Tubingen, and the University of
      Copenhagen. The public release stream on GitHub includes an October 2016 snapshot
      and a 2017 v0.1 release.
    - >
      Flix is inspired by OCaml and Haskell, with ideas from Rust and Scala. Its
      implementation compiles to JVM bytecode, supports Java interoperability, and
      exposes language features such as a polymorphic type and effect system,
      region-based local mutable memory, effects and handlers, traits, and first-class
      Datalog programming.
  related-projects:
    - The Flix book is the official language documentation.
    - The Visual Studio Code extension is part of the intended developer experience.
    - The JVM and Java ecosystem are explicit interoperability targets for Flix programs.
  sources:
    - https://doc.flix.dev/
    - https://github.com/flix/flix
    - https://github.com/flix/flix/releases
  summary:
    - >
      Flix is a JVM-targeting programming language that combines functional, imperative,
      and logic programming. Its package-manager relevance comes from being a
      research-rooted language implementation distributed as a command-line compiler and
      toolchain.
  timeline:
    - '2016: GitHub releases include an October snapshot.'
    - '2017: Flix v0.1 is published on GitHub Releases.'
    - '2019: The release stream reaches v0.6.0.'
    - '2026: Flix continues frequent pre-1.0 releases, including v0.75.0 during June.'
  usage:
    - >
      Users install the flix command-line tool, write Flix programs, and run or compile
      them on the JVM. The official book presents the language as a full programming
      environment with Java interoperability and a VS Code extension tied directly to
      compiler behavior.
    - >
      Because Flix includes first-class Datalog, it is often interesting to developers
      who want logic-programming style analysis inside a statically typed functional
      language rather than as a separate database or DSL.
related-packages: []
