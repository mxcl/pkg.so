id: brew:ccache
display-name: ccache
homepage: https://ccache.dev/
repo: https://github.com/ccache/ccache
docs:
  - https://ccache.dev/documentation.html
  - https://ccache.dev/manual/4.13.6.html
config-file-location:
  linux:
    - $CCACHE_CONFIGPATH
    - $CCACHE_DIR/ccache.conf
    - <cache_dir>/ccache.conf
    - ~/.ccache/ccache.conf
    - $XDG_CONFIG_HOME/ccache/ccache.conf
    - ~/.config/ccache/ccache.conf
  macos:
    - $CCACHE_CONFIGPATH
    - $CCACHE_DIR/ccache.conf
    - <cache_dir>/ccache.conf
    - ~/.ccache/ccache.conf
    - $XDG_CONFIG_HOME/ccache/ccache.conf
    - ~/Library/Preferences/ccache/ccache.conf
  windows:
    - '%CCACHE_CONFIGPATH%'
    - '%CCACHE_DIR%/ccache.conf'
    - <cache_dir>\ccache.conf
    - '%USERPROFILE%\.ccache\ccache.conf'
    - '%LOCALAPPDATA%\ccache\ccache.conf'
    - '%APPDATA%\ccache\ccache.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site presents ccache as a cross-platform build accelerator supporting
      GCC, Clang, MSVC, and similar compilers on Linux, Windows, macOS, and other
      Unix-like systems. The supplied package facts show broad package-manager
      availability, including Homebrew, Debian, Fedora, Nix, MacPorts, Chocolatey,
      Scoop, winget, Alpine, Arch, Ubuntu, and zypper.
  package-nerd-significance:
    - >
      Few developer packages are as visibly package-manager-adjacent as ccache: it is
      commonly installed globally, inserted ahead of compilers in PATH or build-system
      variables, and tuned through predictable config files and environment variables.
      It is also a useful packaging stress test because it wraps many compilers while
      trying to preserve exact compiler output.
  project-history:
    - >
      The official credits page says ccache was originally written by Andrew Tridgell,
      inspired by Erik Thiele's compilercache shell script, and has been developed and
      maintained by Joel Rosdahl since 2010.
  related-projects:
    - >
      Erik Thiele's compilercache, GCC, Clang, MSVC, distcc-style compiler-wrapper
      workflows, and remote cache/storage helpers.
  sources:
    - https://api.github.com/repos/ccache/ccache
    - https://github.com/ccache/ccache
    - https://ccache.dev/
    - https://ccache.dev/documentation.html
    - https://ccache.dev/manual/4.13.6.html
    - https://formulae.brew.sh/api/formula/ccache.json
  summary:
    - >
      Ccache is a compiler cache that speeds up recompilation by caching prior
      compilations and detecting when the same compilation is being done again.
  timeline:
    - '2010: Official credits identify Joel Rosdahl as maintainer from this year.'
    - '2016-06-06: Official news says source code and bug tracking moved to GitHub.'
    - '2019-04-03: Official news says the website moved to ccache.dev.'
    - '2026-05-04: Official news lists ccache 4.13.6 as released.'
  usage:
    - >
      Ccache is used by developers and build farms to speed repeated clean builds,
      branch builds, and shared compilation servers. The manual documents command modes,
      statistics, automatic cleanup, local and remote storage, cache-specific and
      directory-specific configuration files, environment variables, and direct/depend
      modes.
related-packages:
  - id: brew:sccache
    reason: >
      Choose sccache when you need Rust compilation caching, cloud storage backends, or
      its distributed-compilation features; choose ccache for its established
      C/C++-focused local and remote caching workflow.
    rel: alternative
    sources:
      - https://ccache.dev/manual/latest.html
      - https://github.com/mozilla/sccache#readme
  - id: brew:distcc
    reason: >
      Use distcc with ccache when cache misses should be compiled across networked
      workers; ccache officially documents invoking distcc through `CCACHE_PREFIX` or
      `prefix_command`.
    rel: adjacent_workflow
    sources:
      - https://ccache.dev/manual/latest.html
      - https://github.com/distcc/distcc#readme
  - id: brew:icecream
    reason: >
      Choose Icecream when the primary requirement is scheduler-managed distributed
      compilation across a build network rather than reuse of previously cached compiler
      output.
    rel: alternative
    sources:
      - https://ccache.dev/manual/latest.html
      - https://github.com/icecc/icecream#readme
category: developer-tools
package-manager:
  apk: ccache
  brew: ccache
  chocolatey: ccache
  debian: ccache
  dnf: ccache
  macports: ccache
  nix: ccache
  pacman: ccache
  scoop: main/ccache
  ubuntu: ccache
  winget: Ccache.Ccache
  zypper: ccache
package-manager-url: https://formulae.brew.sh/formula/ccache
license: GPL-3.0-or-later
tags:
  - build-cache
  - c
  - c-plus-plus
  - clang
  - cli
  - compiler-cache
  - gcc
description: Object-file caching compiler wrapper
executables:
  - ccache
provenance:
  formula: ccache
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
