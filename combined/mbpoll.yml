id: brew:mbpoll
display-name: mbpoll
homepage: https://epsilonrt.fr
repo: https://github.com/epsilonrt/mbpoll
docs:
  - https://github.com/epsilonrt/mbpoll#readme
  - https://github.com/epsilonrt/mbpoll/tree/master/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input metadata lists packages for Homebrew, Debian, Ubuntu, Fedora, Nix, and
      openSUSE, showing adoption beyond its original upstream audience. That
      cross-distro availability is typical for plant-floor and lab tools: the program is
      small, scriptable, and useful when hardware needs to be queried from whatever
      Unix-like host is available.
  package-nerd-significance:
    - >
      Package nerds care about mbpoll because it is a concise example of an industrial
      protocol tool that belongs in general-purpose package indexes. It is niche, but
      when a user needs it, installing a known formula or distro package is much faster
      than building field tooling from source on-site.
  project-history:
    - >
      The upstream project is maintained by epsilonRT and describes mbpoll as a
      command-line utility to communicate with Modbus slave devices. The public release
      stream reached v1.0 in 2016 and continued through later 1.x maintenance releases,
      with the README noting that a version 2 rewrite based on libmodbuspp is under
      development.
  related-projects:
    - >
      Related tools and libraries include libmodbus, QModMaster, pymodbus, and other
      Modbus RTU/TCP diagnostic clients.
  sources:
    - https://github.com/epsilonrt/mbpoll
    - https://github.com/epsilonrt/mbpoll/releases
    - https://github.com/epsilonrt/mbpoll/tree/master/doc
    - source_facts.package-manager
  summary:
    - >
      mbpoll is a command-line Modbus master utility for polling Modbus slaves over RTU
      serial links or Modbus TCP. It is a small industrial-automation diagnostic tool
      rather than a framework, which makes it attractive to package managers as a single
      executable operators can install quickly.
  timeline:
    - '2016: mbpoll v1.0 was published on GitHub releases.'
    - '2019: v1.4.11 marked continued 1.x maintenance.'
    - '2023: v1.5 added a newer 1.x release line.'
    - '2026: v1.5.4 was published as a maintenance release.'
  usage:
    - >
      mbpoll is commonly used to read or write Modbus registers from shell scripts,
      terminals, and troubleshooting sessions. It fills the gap between low-level
      serial/TCP connectivity and full SCADA or PLC software by exposing Modbus
      transactions as a CLI.
related-packages: []
category: networking
