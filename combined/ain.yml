id: brew:ain
display-name: Ain
homepage: https://github.com/jonaslu/ain
repo: https://github.com/jonaslu/ain
docs:
  - https://github.com/jonaslu/ain
config-file-location:
  unix: '*.ain'
credentials-file-location:
  unix: .env in the current working directory
history:
  adoption-history:
    - >
      Official installation instructions cover `go install`, Homebrew, Scoop, AUR binary
      packages, and manual downloads from GitHub releases. The input package facts also
      list Homebrew, MacPorts, and Nix packages.
    - >
      Homebrew listed version 1.6.0 as stable and reported 107 installs over 365 days
      when checked, suggesting a small but packaged Unix-tool audience.
  package-nerd-significance:
    - >
      Ain is a classic package-manager-friendly CLI: a single Go executable, no service
      account, no desktop app, and a plain-text file format. Its appeal is to users who
      want API-client ergonomics without leaving the shell or losing composability with
      find, fzf, pipes, curl, wget, and httpie.
  project-history:
    - >
      The public GitHub repository was created in October 2020. The project is written
      in Go and centers on a small `.ain` template format with sections such as Host,
      Query, Headers, Method, Body, Config, Backend, and BackendOptions.
    - >
      Ain's design goal is explicit in the README: enable scripting of input and further
      processing of output through terminal pipes. Rather than building its own HTTP
      stack as the user-facing primitive, it makes curl, wget, or httpie the backend and
      focuses on request organization.
  related-projects:
    - curl, wget, and httpie, used as request backends.
    - Postman, Paw, and Insomnia, named by the README as GUI/API-client alternatives.
    - Shell tools such as find, fzf, and environment-variable based workflows.
  sources:
    - https://formulae.brew.sh/api/formula/ain.json
    - https://github.com/jonaslu/ain
  summary:
    - >
      Ain is a terminal HTTP API client that uses template files to assemble requests
      and then delegates the actual call to curl, wget, or httpie. The README describes
      it as an alternative to Postman, Paw, or Insomnia for users who prefer files,
      folders, scripts, and pipes.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2020s: README documents Go, Homebrew, Scoop, AUR, and binary-release installation paths.'
    - '2026: Homebrew lists 1.6.0 as stable in checked metadata.'
  usage:
    - >
      Users write one or more `.ain` template files, pass them to `ain`, optionally
      provide variables, and receive output from the selected backend. Templates can be
      layered across files and directories, making it useful for API collections that
      still behave like shell files.
    - >
      Ain has no separate credentials store in the official README. Secrets are normally
      represented through template variables, environment variables, `.env`-style
      workflows, scripts, or headers inside user-controlled `.ain` files.
related-packages:
  - id: brew:curl
    reason: >
      curl is Ain's most broadly available request backend, so install it when you want
      Ain templates to execute through curl and remain easy to reproduce as ordinary
      curl commands.
    rel: adjacent_workflow
    sources:
      - https://github.com/jonaslu/ain
      - https://curl.se/docs/
  - id: brew:httpie
    reason: >
      HTTPie is a supported Ain backend that pairs Ain's layered request templates with
      HTTPie's human-friendly terminal HTTP behavior.
    rel: adjacent_workflow
    sources:
      - https://github.com/jonaslu/ain
      - https://httpie.io/docs/cli
  - id: brew:wget
    reason: >
      GNU Wget is a supported Ain backend and is useful when an existing shell
      environment standardizes on Wget for the actual HTTP transfer.
    rel: adjacent_workflow
    sources:
      - https://github.com/jonaslu/ain
      - https://www.gnu.org/software/wget/manual/wget.html
category: developer-tools
package-manager:
  brew: ain
  macports: ain
  nix: ain
package-manager-url: https://formulae.brew.sh/formula/ain
license: MIT
tags:
  - api-client
  - cli
  - curl
  - http
  - terminal
description: HTTP API client for the terminal
executables:
  - ain
provenance:
  formula: ain
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
