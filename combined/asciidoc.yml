id: brew:asciidoc
display-name: AsciiDoc.py
homepage: https://asciidoc-py.github.io/
repo: https://github.com/asciidoc/asciidoc-py3
docs:
  - https://docs.asciidoctor.org/asciidoc/latest
  - https://asciidoc-py.github.io/
  - https://asciidoc-py.github.io/userguide.html
config-file-location:
  unix:
    - ~/.asciidoc/
    - /etc/asciidoc/
    - /usr/local/etc/asciidoc/
    - <document-directory>/asciidoc.conf
    - <document-directory>/<document-name>.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      AsciiDoc.py spread because it made DocBook-oriented publishing possible from plain
      text using `asciidoc` and the `a2x` wrapper. The official homepage shows examples
      for HTML, XHTML, DocBook, EPUB, PDF, slides, websites, and Unix man pages, and the
      install page lists distro packaging in Fedora, Debian/Ubuntu, and Homebrew.
    - >
      Its role changed after Asciidoctor appeared. The official history says Asciidoctor
      became AsciiDoc.py's successor after GitHub disabled AsciiDoc rendering in January
      2013 for security concerns and then re-enabled rendering with Asciidoctor. The
      AsciiDoc.py homepage now recommends using a modern processor unless the
      AsciiDoc.py toolchain is specifically required.
  package-nerd-significance:
    - >
      AsciiDoc.py is historically important because it is the original implementation
      that made AsciiDoc a package-manager staple. It is also a useful case study in
      language/tool split: the `asciidoc` package name preserves the old Python
      processor even as the language specification and modern processing ecosystem moved
      toward Asciidoctor and the Eclipse AsciiDoc Working Group.
  project-history:
    - >
      The official Asciidoctor history records that Stuart Rackham first conceived
      AsciiDoc in 2002 as a shorthand format for DocBook and launched both the language
      and processor as the AsciiDoc.py project. The first public AsciiDoc.py 1.0
      release, SourceForge registration, and first website publication all happened on
      2002-11-25.
    - >
      AsciiDoc.py evolved for roughly a decade as the original processor. The official
      timeline records a move from SourceForge-era hosting through Google Code and then,
      in December 2013, transfer of the source repository to the asciidoc organization
      on GitHub. The AsciiDoc.py homepage describes it as highly configurable, with
      source syntax and backend output markups customizable through configuration files.
    - >
      The later Python package line modernized the old processor. The official changelog
      records Python 3.5+ support in version 9.0.0 in 2020, a 10.0.0 rewrite into a
      proper Python package installable with `pip install asciidoc` in 2021, and version
      10.2.1 in July 2024.
  related-projects:
    - >
      Asciidoctor is the Ruby successor and current reference implementation for the
      AsciiDoc language.
    - >
      a2x is the AsciiDoc.py toolchain wrapper for post-processing DocBook output into
      formats such as PDF and EPUB.
    - The Eclipse AsciiDoc Working Group governs the modern AsciiDoc language direction.
  sources:
    - https://asciidoc-py.github.io/
    - https://asciidoc-py.github.io/CHANGELOG.html
    - https://asciidoc-py.github.io/INSTALL.html
    - https://docs.asciidoctor.org/about/history/
    - https://docs.asciidoctor.org/asciidoc/latest/
  summary:
    - >
      The Homebrew `asciidoc` formula packages AsciiDoc.py, the legacy Python processor
      for the AsciiDoc lightweight markup language. The language began as Stuart
      Rackham's shorthand for DocBook, while the current AsciiDoc.py site now explicitly
      distinguishes the legacy processor from the modern AsciiDoc specification.
  timeline:
    - '2002-11-25: First public release of AsciiDoc.py 1.0 by Stuart Rackham.'
    - >
      2007-10-23: AsciiDoc.py source repository converted to Mercurial and transferred
      to Google Code.
    - >
      2013-12-21: AsciiDoc.py source repository converted to git and transferred to the
      asciidoc GitHub organization.
    - '2020-06-02: AsciiDoc.py 9.0.0 ports the processor to Python 3.5+.'
    - '2021-10-16: AsciiDoc.py 10.0.0 becomes a proper Python package installable from PyPI.'
    - '2024-07-16: AsciiDoc.py 10.2.1 released.'
  usage:
    - >
      Package users install `asciidoc` and `a2x` to translate `.txt` or `.adoc` sources
      into HTML, DocBook, man pages, EPUB, PDF, and related outputs. The user guide
      describes AsciiDoc as lightweight, consisting of scripts plus configuration files,
      with backend plugins and themes extending output generation.
related-packages:
  - id: brew:asciidoctor
    reason: >
      Choose Asciidoctor for the modern AsciiDoc syntax and actively developed
      processor; its official migration guide describes it as a mostly drop-in successor
      while documenting legacy compatibility differences.
    rel: alternative
    sources:
      - https://docs.asciidoctor.org/asciidoctor/latest/migrate/asciidoc-py/
      - https://asciidoc-py.github.io/
category: developer-tools
package-manager:
