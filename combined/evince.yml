id: brew:evince
display-name: Evince
homepage: https://apps.gnome.org/Evince/
repo: https://gitlab.gnome.org/GNOME/evince
docs:
  - https://apps.gnome.org/Evince
  - https://help.gnome.org/users/evince/stable
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Evince's adoption is tied to GNOME distribution packaging: it is maintained in
      GNOME GitLab, translated through GNOME localization infrastructure, documented
      through GNOME Help, and distributed as a desktop app with command-line helpers
      such as `evince`, `evince-previewer`, and `evince-thumbnailer`.
    - >
      Its package-manager footprint is broad because document viewing is a baseline
      desktop function. The Homebrew formula is one of many package-manager entries
      alongside Linux distribution packages and MacPorts-style desktop packaging.
  package-nerd-significance:
    - >
      Evince matters to package nerds because it sits at the junction of GNOME app
      packaging, document backends, MIME integration, thumbnailing, previewing,
      translations, and Flatpak/AppStream metadata. A small formula or distro package
      pulls in a real slice of the desktop stack.
    - >
      Its repository also preserves older tags and backend lineage, including GPDF and
      XPDF-era tags, which helps explain why Evince packages historically touched
      Poppler, PostScript, DjVu, DVI, TIFF, XPS, and archive support rather than only
      PDF viewing.
  project-history:
    - >
      GNOME's repository describes Evince as a document viewer for multiple single-page
      and multi-page formats, including PDF and PostScript, with Poppler as the PDF
      backend and optional libraries for PostScript, DjVu, DVI, comic archives, TIFF,
      and XPS.
    - >
      The AppStream metadata names the app Evince, identifies the Evince Developers as
      maintainers, and describes it as a GNOME desktop document viewer for viewing,
      searching, and annotating documents.
  related-projects:
    - >
      Evince depends on or integrates with Poppler for PDF viewing, Spectre for
      PostScript, DjVuLibre, Kpathsea for DVI, libarchive for comic-book archives,
      libtiff, and libgxps for XPS.
  sources:
    - https://gitlab.gnome.org/GNOME/evince
    - https://gitlab.gnome.org/GNOME/evince/-/raw/main/README.md
    - https://gitlab.gnome.org/GNOME/evince/-/raw/main/NEWS
    - >
      https://gitlab.gnome.org/GNOME/evince/-/raw/main/data/org.gnome.Evince.metainfo.xml.in.in
    - https://help.gnome.org/users/evince/stable
    - https://gitlab.gnome.org/GNOME/evince/-/raw/main/help/C/commandline.page
  summary:
    - >
      Evince is GNOME's long-running document viewer, packaged on Unix-like systems as
      the standard lightweight app for PDF and other document formats.
  timeline:
    - >
      Early history: Repository tags include XPDF and GPDF-era tags before modern Evince
      releases.
    - '2011: GNOME Help command-line page records Evince 3.2-era command-line documentation.'
    - '2021: AppStream metadata records Evince 40.x and GNOME 41-era stable releases.'
    - '2023: AppStream metadata records Evince 44.0 and 45.0 stable releases.'
    - '2024: AppStream metadata records Evince 46.0 and 46.1 stable releases.'
    - >
      2026: AppStream metadata records Evince 49 alpha development releases and NEWS
      lists ongoing GNOME maintenance work.
  usage:
    - >
      Users open documents through the desktop app or by running `evince` from the
      command line with local files, multiple files, web URLs, page labels, fullscreen
      mode, presentation mode, or preview mode.
    - >
      GNOME Help documents workflows around reading, search, printing, annotations,
      forms, supported formats, SyncTeX, and command-line invocation, which makes Evince
      both a graphical app and a scriptable desktop component.
related-packages:
  - id: brew:mupdf
    reason: >
      Choose MuPDF when you want a lightweight cross-platform viewer plus the `mutool`
      conversion and inspection toolkit, rather than a GNOME-integrated desktop reader.
    rel: alternative
    sources:
      - https://help.gnome.org/evince/
      - https://mupdf.readthedocs.io/en/latest/guide/what-is-mupdf.html
  - id: brew:poppler
    reason: >
      Poppler complements Evince by providing the PDF rendering library and command-line
      PDF utilities used beneath desktop document workflows.
    rel: adjacent_workflow
    sources:
      - https://gitlab.gnome.org/GNOME/evince
      - https://poppler.freedesktop.org/
category: productivity
package-manager:
  apk: evince
  brew: evince
  chocolatey: evince
  debian: evince
  dnf: evince
  macports: evince
  nix: evince
  pacman: evince
  ubuntu: evince
  zypper: evince
package-manager-url: https://formulae.brew.sh/formula/evince
license: GPL-2.0-or-later
tags:
  - cli
  - desktop-app
  - document-viewer
  - gnome
  - pdf
description: GNOME document viewer
executables:
  - evince
  - evince-previewer
  - evince-thumbnailer
provenance:
  formula: evince
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
