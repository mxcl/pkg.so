id: brew:clip
display-name: clip
homepage: https://github.com/asmuth/clip
repo: https://github.com/asmuth/clip
docs:
  - https://clip-lang.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub repository metadata recorded the project as created on 2011-09-16 and
      showed more than 5,000 stars and several hundred forks when checked for this
      enrichment run. Homebrew packages the stable 0.7 release from the upstream GitHub
      tag and reported hundreds of on-request installs over the preceding year.
  package-nerd-significance:
    - >
      clip is notable in package indexes because it is a compact Unix-style chart
      renderer with its own declarative language, sitting closer to gnuplot, Graphviz,
      and ggplot-inspired grammar systems than to generic clipboard tools. For Homebrew
      users, the package preserves a command-line visualization niche that is otherwise
      often handled by heavier language runtimes.
  project-history:
    - >
      The official README says the project began in 2011 under the name FnordMetric and
      originally included data storage and transformation facilities. Over time, the
      data-processing parts were removed, leaving the plotting and illustration engine,
      and the project was renamed to clip to avoid stale search results around the older
      name.
    - >
      The current repository presents clip as both an open-source command-line program
      and software library for creating charts and other data-driven illustrations. The
      README points users to clip-lang.org for full documentation, examples, and
      installation notes.
  related-projects:
    - >
      The official README names The Grammar of Graphics and ggplot2 as conceptual
      influences for plot-element structure, and CSS as an influence on syntax and
      styling concepts.
    - >
      The rendering stack relies on freetype and harfbuzz, placing clip in the same
      practical ecosystem as other precise SVG and text-rendering tools.
  sources:
    - https://github.com/asmuth/clip#readme
    - https://clip-lang.org/
    - https://formulae.brew.sh/api/formula/clip.json
    - https://github.com/asmuth/clip
  summary:
    - >
      clip is the command line illustration processor, a C++17 charting and data-driven
      illustration tool that turns text descriptions into SVG output. Its
      package-manager identity is a small but unusually well-starred command-line
      visualization tool rather than a clipboard utility, despite the formula name.
  timeline:
    - '2011: Project starts as FnordMetric according to the official README.'
    - '2011-09-16: GitHub repository is created, according to GitHub repository metadata.'
    - >
      2020: README copyright and repository metadata reflect the modern clip name and
      C++ charting focus.
    - '2026: Homebrew formula tracks stable release 0.7 from the official GitHub tag archive.'
  usage:
    - >
      Users write a .clp-style text description of a plot or diagram and run commands
      such as `clip --export output.svg example.clp`. The README examples emphasize line
      charts, SVG output, C++17 source builds, and dependencies such as cairo, freetype,
      harfbuzz, fmtlib, and cmake.
related-packages:
  - id: brew:gnuplot
    reason: >
      Choose gnuplot when you want a mature interactive, command-driven plotting
      language with broad scientific plotting and output-terminal support; choose clip
      for declarative chart descriptions and illustration-oriented SVG output.
    rel: alternative
    sources:
      - https://clip-lang.org/
      - https://www.gnuplot.info/
      - https://www.gnuplot.info/docs/gnuplot.pdf
category: data
