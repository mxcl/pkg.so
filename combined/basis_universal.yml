config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Khronos KTX-Software officially documents that KTX files can contain Basis
      Universal formats and includes a Basis Universal WebAssembly transcoder for
      JavaScript KTX parsers. That places Basis Universal inside the standard KTX2
      toolchain used by OpenGL, Vulkan, Web, and asset-pipeline tooling.
    - >
      Package-manager adoption follows the CLI and library utility: the supplied facts
      list Homebrew, Alpine, and Arch packages, while the upstream README documents
      native builds on Windows, Ubuntu, macOS, ARM, RISC-V, WebAssembly, and WASI.
  package-nerd-significance:
    - >
      Basis Universal is package-nerd significant because it is both a CLI formula and a
      piece of graphics infrastructure. Packaging it gives asset pipelines access to the
      `basisu` encoder without requiring a full game engine or SDK install.
    - >
      Its significance also comes from codec standardization pressure: the project has
      to track KTX2 headers, supercompression IDs, GPU texture formats, WebAssembly
      constraints, fuzzing, and compatibility with Khronos tooling.
  project-history:
    - >
      The repository marks the reference encoder, transcoder, and specifications as
      copyright 2016-2026 Binomial LLC. Its early public identity centered on ETC1S and
      UASTC as portable intermediate formats: asset pipelines could ship one compressed
      texture and transcode on the target device to formats such as BC, ETC, PVRTC,
      ASTC, ATC, and FXT1.
    - >
      The project matured from a command-line compressor/transcoder into a broader
      texture infrastructure stack: native C/C++ libraries, a `basisu` CLI, WebAssembly
      builds, JavaScript wrappers, WebGL examples, Python support, KTX2 support, HDR
      modes, and detailed codec specifications in the wiki.
  related-projects:
    - >
      Related official projects and standards include Khronos KTX/KTX2, Khronos
      KTX-Software, Binomial's KTX-Software fork, WebAssembly/WASI builds, and GPU
      texture formats such as ETC1S, UASTC, ASTC, BC6H/BC7, PVRTC, ETC2, and DDS.
  sources:
    - https://github.com/BinomialLLC/basis_universal/blob/master/README.md
    - https://github.com/BinomialLLC/basis_universal/wiki/Release-Notes
    - https://github.com/KhronosGroup/KTX-Software/blob/main/README.md
    - source_facts.package-manager
  summary:
    - >
      Basis Universal is Binomial's portable GPU texture supercompression and
      transcoding system. The README describes it as an open source LDR/HDR GPU
      compressed texture interchange system supporting Khronos KTX2 and Binomial's
      `.basis` format, with rapid transcoding to many GPU texture formats.
  timeline:
    - >
      2016: Binomial copyright range begins for the reference encoder, transcoder, and
      specifications.
    - >
      2022-01-28: Version 1.16 release notes describe smaller code size, fewer
      dependencies, OpenCL support, faster ETC1S encoding, and parallel processing.
    - >
      2024-09-10: Version 1.50.0 adds UASTC HDR, EXR/HDR image support, DDS read/write,
      and defaults the command-line tool to KTX2 output.
    - >
      2025-01-21: Version 1.60.0 requires C++17 and adds UASTC HDR 6x6 and GPU Photo
      HDR-related modes.
    - >
      2026-01-19: Version 2.0 adds full ASTC LDR support, XUASTC LDR, WASM/WASI support,
      Python support, and new real-time BC7/ETC1 encoders.
    - >
      2026-02-24: Version 2.1 focuses on KTX-Software compatibility for UASTC HDR 4x4,
      UASTC HDR 6x6 intermediate, and XUASTC LDR formats.
  usage:
    - >
      The `basisu` command-line tool creates, validates, transcodes, and unpacks `.ktx2`
      and `.basis` files. The README documents CMake builds, Visual Studio builds,
      WebAssembly/WASI executables, SSE/OpenCL options, and a `-test` mode for
      exercising encoder and transcoder paths.
    - >
      Developers use Basis Universal to reduce download and distribution size while
      deferring final GPU format choice until runtime. KTX2 plus Basis formats are
      especially important for web and cross-platform engines that must support
      different GPU texture capabilities.
