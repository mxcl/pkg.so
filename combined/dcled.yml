history:
  adoption-history:
    - >
      dcled is niche hardware software rather than an ecosystem project. The official
      page records use for monitoring a game server, Mac OS X compatibility, and a
      related Ruby userland driver by another developer, which is about the right
      adoption scale for a single USB novelty device.
  package-nerd-significance:
    - >
      dcled is the kind of package that makes old Unix package indexes fun: one odd USB
      object, a single-purpose CLI, no daemon, no cloud account, and just enough stream
      behavior to make it composable.
  project-history:
    - >
      The author wrote the first version after finding a hardware developer manual for
      the device. The official page says version 1.0 took roughly a Saturday afternoon,
      and the program was shaped to behave like cat: files go to the display, stdin
      works as a pipe, and a message option handles one-off text.
    - >
      The project then accreted features from real desk and server use. Preamble
      graphics were added because the author missed the beginning of scrolling messages,
      and later releases moved from libhid to direct libusb use and added a tachometer
      mode for gauge-like displays.
  related-projects:
    - >
      The official page links to Lewis Clayton's Ruby userland driver for the same Dream
      Cheeky USB LED Message Board and to an Inland USB LED Badge control project.
  sources:
    - https://www.jeffrika.com/~malakai/dcled/index.html
  summary:
    - >
      dcled is a small userland command-line driver for the Dream Cheeky USB Message
      Board, a scrolling LED gadget whose original software targeted Windows. Its
      official page frames the project as a Linux-style way to stream text to the
      device.
  timeline:
    - >
      Initial version: Written after the author found the Dream Cheeky hardware
      developer manual.
    - '2011: The page records discussion of a related Inland USB LED badge tool.'
    - '2012: dcled 2.1 replaced the libhid layer with direct libusb use.'
    - '2014: dcled 2.2 added tachometer mode and an included cpuload helper.'
  usage:
    - >
      The practical pattern is Unix plumbing: pipe log output or short status messages
      into dcled and let the LED board scroll them. The page's example tails a system
      log through dcled with preamble graphics and echoing enabled so the same text
      appears on both the terminal and the display.
    - >
      Options cover brightness, clock display, preambles, repeated scrolling, font
      selection, speed, test patterns, and a no-device mode, which makes it more
      scriptable than the toy hardware would suggest.
