history:
  adoption-history:
    - >
      The desktop application became part of Germany's official broadband-measurement
      program, giving consumers a regulator-backed method to compare fixed-line service
      with contractual performance. Wired single measurements also contribute to the
      fixed-network map and annual Breitbandmessung reports.
  package-nerd-significance:
    - >
      Festnetz-Check is unusual package-manager software because it packages an official
      regulatory measurement client rather than a general-purpose benchmark. Its output
      can support a formal claim that a fixed-line service materially underperforms its
      contract.
  project-history:
    - >
      The Breitbandmessung desktop application was introduced on 2 May 2018. It was
      developed by zafaco GmbH on behalf of Germany's Bundesnetzagentur and later
      presented as Festnetz-Check within the agency's family of fixed-line measurement
      tools.
  related-projects:
    - >
      The same official service provides a browser measurement for quick checks, a
      formal fixed-line evidentiary procedure within Festnetz-Check, and the separate
      RaVT measurement procedure for statutory minimum-service requirements.
  sources:
    - >
      https://download.breitbandmessung.de/bbm/Beschreibung-Die_Desktop-App_der_Breitbandmessung_aus_Sicht_des_Nutzers.pdf
    - https://download.breitbandmessung.de/bbm/Breitbandmessung_Jahresbericht_2018_2019.pdf
    - https://gis.breitbandmessung.de/festnetz
    - https://gis.breitbandmessung.de/festnetz/geschwindigkeit
  summary:
    - >
      Festnetz-Check is the Bundesnetzagentur's desktop application for measuring the
      download rate, upload rate, and latency of a fixed-line Internet connection and
      for conducting a regulator-defined evidentiary measurement campaign.
  timeline:
    - >
      2018-05-02: The Breitbandmessung desktop application became available for
      fixed-line measurements.
    - >
      2021: Fixed-network portal reporting began relying exclusively on individual
      Festnetz-Check app measurements.
    - '2026: The official service offers Festnetz-Check for Windows, macOS, and Linux.'
  usage:
    - >
      Users can run individual provider- and technology-neutral speed tests or complete
      the prescribed series of measurements used to document contractual
      underperformance. Results remain available on the device as a time-based list, and
      the formal procedure produces a measurement report.
