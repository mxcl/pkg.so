id: brew:dropbear
display-name: Dropbear SSH
homepage: https://matt.ucc.asn.au/dropbear/dropbear.html
repo: https://github.com/mkj/dropbear
docs:
  - https://github.com/mkj/dropbear#readme
  - https://matt.ucc.asn.au/dropbear/dropbear.html
config-file-location: null
credentials-file-location:
  unix:
    - ~/.ssh/authorized_keys
    - ~/.ssh/id_dropbear
    - /etc/dropbear/dropbear_rsa_host_key
    - /etc/dropbear/dropbear_dss_host_key
    - /etc/dropbear/dropbear_ecdsa_host_key
    - /etc/dropbear/dropbear_ed25519_host_key
history:
  adoption-history:
    - >
      Dropbear was adopted heavily by embedded Linux distributions, rescue environments,
      routers, initramfs setups, and minimal systems because it can provide SSH access
      with a much smaller footprint than a full OpenSSH deployment. Its package
      availability across Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, and Nix
      reflects that cross-platform utility.
  package-nerd-significance:
    - >
      Dropbear is package-nerd significant because it embodies the classic small-tools
      tradeoff: enough SSH compatibility for real deployments, intentionally less bulk
      than OpenSSH, and build-time options for constrained systems. It is also one of
      the few packages whose value is obvious both to embedded firmware builders and to
      people maintaining recovery shells on ordinary Unix systems.
  project-history:
    - >
      Dropbear development started in October 2002, with the first public release, 0.28,
      appearing on April 6, 2003. The early changelog shows the project quickly adding
      practical SSH server features such as syslog support, X11 forwarding, agent
      forwarding, local TCP forwarding, OpenSSH key conversion, and Debian packaging
      support during 2003.
    - >
      The project has remained active for decades rather than becoming a frozen embedded
      artifact. Its current changelog includes 2026 releases with security fixes, scp
      hardening, algorithm-query support, forwarding improvements, and behavior changes
      made in response to modern SSH and libc realities.
  related-projects:
    - OpenSSH is the main compatibility reference and the larger alternative implementation.
    - >
      LibTomCrypt and LibTomMath were part of Dropbear's early cryptographic/math
      dependency story.
    - >
      BusyBox-style and embedded Linux systems are common deployment neighbors because
      they share the same small-footprint design pressure.
  sources:
    - https://matt.ucc.asn.au/dropbear/dropbear.html
    - https://matt.ucc.asn.au/dropbear/CHANGES
    - https://github.com/mkj/dropbear
    - https://github.com/mkj/dropbear/blob/master/README.md
  summary:
    - >
      Dropbear is a compact SSH server and client suite for POSIX systems, best known in
      package-manager culture as the SSH implementation people reach for when OpenSSH is
      too large or too operationally heavy. It provides `dropbear` for the server,
      `dbclient` for the client, and key/conversion utilities in a deliberately small
      package.
  timeline:
    - '2002: Development starts in October.'
    - '2003: Dropbear 0.28 is released as the initial public release.'
    - >
      2003: `dropbearconvert`, Debian packaging support, X11 forwarding, agent
      forwarding, and early TCP forwarding appear in subsequent 0.3x releases.
    - >
      2026: Releases 2026.90 and 2026.91 include security, scp, forwarding, and
      compatibility fixes.
  usage:
    - >
      Typical package usage includes running `dropbear` as a lightweight SSH daemon,
      using `dbclient` as a small SSH client, generating host keys with `dropbearkey`,
      and converting keys with `dropbearconvert`. The documented host-key paths and
      OpenSSH-compatible authorized_keys behavior make it especially useful where users
      need interoperable SSH without installing the full OpenSSH stack.
related-packages:
  - id: brew:openssh
    reason: >
      Choose OpenSSH for the broader standard SSH suite and configuration ecosystem;
      choose Dropbear when a substantially smaller embedded-oriented server and client
      are more important.
    rel: alternative
    sources:
      - https://matt.ucc.asn.au/dropbear/dropbear.html
      - https://www.openssh.com/
category: networking
package-manager:
  apk: dropbear
  brew: dropbear
  debian: dropbear
  dnf: dropbear
  nix: dropbear
  pacman: dropbear
  ubuntu: dropbear
package-manager-url: https://formulae.brew.sh/formula/dropbear
license: MIT
tags:
  - cli
  - embedded-linux
  - networking
  - ssh
  - ssh-client
  - ssh-server
description: Small SSH server/client for POSIX-based system
executables:
  - dbclient
  - dropbear
  - dropbearconvert
  - dropbearkey
provenance:
  formula: dropbear
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
