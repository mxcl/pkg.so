id: brew:flowpipe
display-name: Flowpipe
homepage: https://flowpipe.io
repo: https://github.com/turbot/flowpipe
docs:
  - https://flowpipe.io/docs
config-file-location:
  unix:
    - '*.fp'
    - mod.fp
    - $PWD/*.fpc
    - ~/.flowpipe/config/*.fpc
    - $FLOWPIPE_INSTALL_DIR/config/*.fpc
credentials-file-location:
  unix:
    - $PWD/*.fpc
    - ~/.flowpipe/config/*.fpc
    - $FLOWPIPE_INSTALL_DIR/config/*.fpc
history:
  adoption-history:
    - >
      Flowpipe's adoption path is tied to Turbot's broader CLI and mod ecosystem. Its
      README points users to Flowpipe Hub library mods and samples for services such as
      AWS, Azure, GCP, GitHub, Jira, Okta, PagerDuty, SendGrid, Slack, Teams, and
      Zendesk.
    - >
      The README also positions Flowpipe alongside Steampipe and Powerpipe in Turbot
      Pipes, using Steampipe for data access, Powerpipe for visualization, and Flowpipe
      for workflow automation.
  package-nerd-significance:
    - >
      Flowpipe is notable for package metadata because it brings Terraform-like HCL mod
      conventions to command-line workflow automation. It also has a recognizable family
      relationship with Turbot's Steampipe, Powerpipe, hub mods, and connection
      configuration files.
  project-history:
    - >
      Flowpipe was introduced in December 2023 as a cloud scripting engine for
      automation and workflow, with pipelines for DevOps written in HCL. The initial
      release supported pipeline execution, steps such as container, email, function,
      HTTP, query, sleep, transform, and pipeline, schedule and HTTP triggers,
      credential management, and mod composition.
    - >
      The project reached 1.0.0 in October 2024. That release added a connection
      resource for credentials, formal connection and notifier variable types, enum
      validation, defined CLI exit codes, and deprecated earlier credential resources in
      favor of connection resources.
  related-projects:
    - >
      Official sources connect Flowpipe to Flowpipe Hub mods, Turbot Pipes, Steampipe,
      Powerpipe, and the shared Turbot pipe-fittings codebase.
  sources:
    - https://flowpipe.io/docs
    - https://flowpipe.io/docs/build
    - https://flowpipe.io/docs/reference/config-files
    - https://github.com/turbot/flowpipe
    - https://raw.githubusercontent.com/turbot/flowpipe/develop/CHANGELOG.md
    - https://raw.githubusercontent.com/turbot/flowpipe/develop/README.md
  summary:
    - >
      Flowpipe is Turbot's open-source cloud scripting and workflow automation engine
      for defining DevOps pipelines as HCL code.
  timeline:
    - '2023: Flowpipe 0.1.0 introduces the cloud scripting engine and HCL pipeline model.'
    - >
      2024: Flowpipe 0.2.0 adds query triggers, expanded HTTP triggers, database query
      support, and more credential types.
    - >
      2024: Flowpipe 0.3.0 adds human workflow, Slack and email messaging, input steps,
      and Steampipe credential import.
    - '2024: Flowpipe 0.6.0 adds interactive workflows in the terminal via console integration.'
    - >
      2024: Flowpipe 1.0.0 introduces connection resources and deprecates credential
      resources.
    - '2026: Flowpipe 1.2.x continues with security and dependency maintenance releases.'
  usage:
    - >
      Users define pipelines, triggers, variables, locals, and steps in .fp files inside
      a Flowpipe mod. Config resources such as workspaces and connections are HCL files
      ending in .fpc and are loaded from the working directory or mod location and the
      Flowpipe install config directory.
    - >
      A typical package workflow installs the flowpipe CLI, initializes a mod with
      flowpipe mod init, writes pipeline definitions in HCL, installs reusable mods from
      the hub or Git repositories, and runs pipelines from the terminal.
related-packages:
  - id: brew:steampipe
    reason: >
      Use Steampipe alongside Flowpipe to query cloud resources as SQL data and feed
      those results into Flowpipe detection, approval, notification, and remediation
      workflows.
    rel: adjacent_workflow
    sources:
      - https://flowpipe.io/docs/flowpipe-hcl/step/query
      - https://hub.flowpipe.io/mods/turbot/aws_compliance
      - https://steampipe.io/docs
category: developer-tools
package-manager:
  brew: flowpipe
package-manager-url: https://formulae.brew.sh/formula/flowpipe
license: AGPL-3.0-only
tags:
  - cli
  - cloud
  - devops
  - hcl
  - pipelines-as-code
  - workflow-automation
description: Cloud scripting engine
executables:
  - flowpipe
provenance:
  formula: flowpipe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
