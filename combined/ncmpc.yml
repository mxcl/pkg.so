id: brew:ncmpc
display-name: ncmpc
homepage: https://www.musicpd.org/clients/ncmpc/
repo: https://github.com/MusicPlayerDaemon/ncmpc
docs:
  - https://www.musicpd.org/clients/ncmpc
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ncmpc/config
    - ~/.config/ncmpc/config
    - $SYSCONFDIR/ncmpc/config
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/ncmpc/config
    - $SYSCONFDIR/ncmpc/config
history:
  adoption-history:
    - >
      ncmpc is part of the core MPD client landscape rather than a standalone music
      ecosystem. MusicPD's client list names it as a console client and also describes
      ncmpcpp as tailored after ncmpc, showing ncmpc's role as the reference terminal
      client. The Homebrew formula API response consulted for this July 2026 batch
      reported only 9 install-on-request events in 30 days and 243 in 365 days,
      suggesting that macOS Homebrew demand is small even though the package remains
      important to MPD users.
  package-nerd-significance:
    - >
      ncmpc is the conservative MPD TUI: smaller and less flashy than ncmpcpp, but close
      to the MPD project and intentionally resource-light. It is the package you pick
      when you want the terminal client to be predictable, keyboard-first, and aligned
      with MPD protocol changes.
  project-history:
    - >
      The release history in NEWS reaches back to ncmpc 0.10.0 on 2004-04-12, with
      0.10.1 adding user key bindings, a key configuration screen, resize fixes,
      seeking, crossfade toggling, and system-wide config files. The project evolved
      with MPD itself: libmpdclient 2.0 in 0.16, Unix socket and wide-character support
      in 0.12, Meson in 0.28, C++17 in 0.37, C++20 in 0.47, and recent 0.50-0.52
      releases in 2024-2025 focused on UI fixes, newer build requirements, lyrics, and
      libmpdclient compatibility.
  related-projects:
    - Music Player Daemon, libmpdclient, mpc, ncmpcpp
  sources:
    - https://formulae.brew.sh/api/formula/ncmpc.json
    - https://github.com/MusicPlayerDaemon/ncmpc
    - https://raw.githubusercontent.com/MusicPlayerDaemon/ncmpc/v0.52/NEWS
    - https://www.musicpd.org/clients/
    - https://www.musicpd.org/clients/ncmpc/
  summary:
    - >
      ncmpc is the Music Player Daemon project's fully featured ncurses terminal client.
      The official client page emphasizes a keyboard-oriented, consistent interface to
      MPD without wasting resources.
  timeline:
    - '2004-04-12: ncmpc 0.10.0 appears in NEWS.'
    - >
      2008-12-05: 0.12 added Unix socket support, wide characters, LIRC, and
      lyrics/browser improvements.
    - '2009-12-25: 0.16 switched to libmpdclient 2.0.'
    - '2017-09-21: 0.28 switched the build to Meson.'
    - '2025-02-17: 0.52 fixed search, resize, cursor, and status bar issues.'
  usage:
    - >
      ncmpc is used after an MPD server is already running. Users connect from a
      terminal to browse the MPD database, search, manage the queue, edit playlists,
      control audio outputs, view lyrics, and customize key bindings and colors. Its
      value is that music playback lives in MPD while ncmpc can be opened, closed, or
      run remotely as a low-footprint controller.
related-packages:
  - id: brew:ncmpcpp
    reason: >
      Choose ncmpcpp when you want a more feature-heavy MPD terminal interface with tag
      editing, a visualizer, extensive theming, and library-oriented screens.
    rel: alternative
    sources:
      - https://github.com/ncmpcpp/ncmpcpp
      - https://www.musicpd.org/clients/ncmpc/
  - id: brew:mpc
    reason: >
      Use mpc alongside ncmpc for non-interactive MPD control in shell scripts and
      keyboard shortcuts while ncmpc supplies the full-screen interface.
    rel: adjacent_workflow
    sources:
      - https://www.musicpd.org/clients/mpc/
      - https://mpd.readthedocs.io/en/stable/user.html
category: media
package-manager:
  apk: ncmpc
  brew: ncmpc
  debian: ncmpc
  dnf: ncmpc
  macports: ncmpc
  nix: ncmpc
  pacman: ncmpc
  scoop: extras/ncmpc
  ubuntu: ncmpc
package-manager-url: https://formulae.brew.sh/formula/ncmpc
license: GPL-2.0-or-later
tags:
  - cli
  - curses
  - mpd
  - music-player-client
description: Curses Music Player Daemon (MPD) client
executables:
  - ncmpc
provenance:
  formula: ncmpc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
