id: brew:leetup
display-name: leetup
homepage: https://github.com/dragfire/leetup
repo: https://github.com/dragfire/leetup
docs:
  - https://github.com/dragfire/leetup#readme
config-file-location:
  unix: ~/.leetup/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The repository shows over a hundred stars and Homebrew packaging in the README.
      Its audience appears to be editor-and-terminal LeetCode users who want code
      generation and test submission without a browser-centered workflow.
  package-nerd-significance:
    - >
      Leetup is a compact example of the LeetCode CLI pattern in Rust: package-manager
      installation, authenticated web scraping/API use, local config under a dot
      directory, generated code markers, and hooks for reshaping output files into a
      user's preferred project layout.
  project-history:
    - >
      The README documents a terminal workflow centered on `leetup user -c`, `leetup
      pick`, `leetup test`, `leetup submit`, and `leetup list`. It also documents
      `~/.leetup/config.json` for language defaults, code injection, and pick hooks that
      run scripts before or after generated files are created.
    - >
      The release stream visible on GitHub includes v1.1.0 on 2023-01-05, v1.2.0 on
      2023-05-23 with cookie-login support, several September 2023 maintenance releases
      around test input and output printing, and v1.2.5 on 2024-03-24 with
      language-in-config support.
  related-projects:
    - >
      The README credits leetcode-tools/leetcode-cli as inspiration and also points
      Neovim users to leetup.nvim.
  sources:
    - https://github.com/dragfire/leetup
    - https://github.com/dragfire/leetup/releases
  summary:
    - >
      `leetup` is a Rust command-line tool for solving LeetCode problems from a
      terminal, with commands for login, picking problems, testing, submitting, listing,
      and injecting reusable code fragments.
  timeline:
    - '2023-01-05: v1.1.0 was released.'
    - '2023-05-23: v1.2.0 added cookie-login support and improved result printing.'
    - '2023-09-04: v1.2.3 added stdin support for test data.'
    - '2023-09-09: v1.2.4 improved execution-result printing.'
    - '2024-03-24: v1.2.5 release notes mention language-in-config support.'
  usage:
    - >
      Users install with Homebrew, Cargo, or release archives, authenticate by copying
      LeetCode cookie values, pick a problem in a target language, run local tests,
      submit a solution, and optionally configure reusable snippets or project-specific
      file movement hooks.
related-packages:
  - id: brew:leetgo
    reason: >
      leetgo is the broader alternative when contest generation, more generated
      languages, and documented local test harnesses are priorities.
    rel: alternative
    sources:
      - https://github.com/j178/leetgo#readme
      - https://github.com/dragfire/leetup#readme
  - id: brew:leetcode-cli
    reason: >
      leetcode-cli is another Rust alternative with daily challenges, problem filtering,
      statistics, cache management, and shell completions.
    rel: alternative
    sources:
      - https://github.com/clearloop/leetcode-cli#readme
      - https://github.com/dragfire/leetup#readme
category: developer-tools
package-manager:
  brew: leetup
package-manager-url: https://formulae.brew.sh/formula/leetup
license: MIT
tags:
  - cli
  - coding-practice
  - leetcode
description: Command-line tool to solve Leetcode problems
executables:
  - leetup
provenance:
  formula: leetup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
