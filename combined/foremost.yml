id: brew:foremost
display-name: Foremost
homepage: https://foremost.sourceforge.net/
repo: https://sourceforge.net/p/foremost/code
docs:
  - https://foremost.sourceforge.net/
config-file-location:
  unix:
    - ./foremost.conf
    - /etc/foremost.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Foremost's adoption is tied to digital forensics workflows rather than a single
      language ecosystem. The official site advertises use on images from tools such as
      dd, Safeback, and EnCase, and links to DFRWS challenge material and sample carving
      test images.
    - >
      It is packaged broadly across Unix package managers because it is a small C
      command-line tool with a stable forensic niche: file recovery by signatures
      without depending on a full forensic suite.
  package-nerd-significance:
    - >
      Foremost is a classic package-manager utility: small, scriptable, old, and still
      useful because it implements one forensic primitive well.
    - >
      Its configuration-file format is significant for package users because
      distributions can ship a system-wide foremost.conf while investigators can keep
      case-specific signatures beside evidence images.
  project-history:
    - >
      The upstream site says Foremost was originally developed by the United States Air
      Force Office of Special Investigations and the Center for Information Systems
      Security Studies and Research, then opened to the general public.
    - >
      The bundled README credits Special Agents Kris Kendall and Jesse Kornblum of the
      USAF Office of Special Investigations, starting in March 2001, and says the
      project was inspired by CarvThis from the Defense Computer Forensic Lab.
  related-projects:
    - >
      Foremost is related to forensic imaging tools such as dd, Safeback, and EnCase as
      input sources for evidence images.
    - >
      Its README names CarvThis as an inspiration, placing Foremost in the older
      data-carving lineage of command-line forensic recovery tools.
  sources:
    - https://foremost.sourceforge.net/
    - https://foremost.sourceforge.net/foremost.html
    - https://foremost.sourceforge.net/pkg/foremost-1.5.7.tar.gz
    - https://sourceforge.net/projects/foremost/
  summary:
    - >
      Foremost is a console data-carving utility for recovering files from disk images,
      raw drives, and forensic images by matching file headers, footers, and internal
      structures.
  timeline:
    - '1999: CarvThis from the Defense Computer Forensic Lab inspires the project.'
    - '2001: Foremost development starts at the USAF Office of Special Investigations.'
    - >
      2002: The SourceForge project metadata records public project hosting beginning in
      April 2002.
    - '2006: The official site links Foremost material for the DFRWS 2006 challenge.'
    - '2007: The official site links Foremost material for the DFRWS 2007 challenge.'
    - >
      2009: Foremost 1.5.7 is published as the latest upstream source archive on the
      project site.
  usage:
    - >
      Foremost can scan a disk image or drive directly, write recovered files to an
      output directory, and use built-in file-type detectors or a configuration file
      that defines extensions, case sensitivity, maximum size, headers, and optional
      footers.
    - >
      If no configuration file is specified, the manual says Foremost first checks
      foremost.conf in the current directory and then /etc/foremost.conf.
related-packages:
  - id: brew:testdisk
    reason: >
      Choose TestDisk when partition repair or filesystem-aware undelete is needed, or
      use its bundled PhotoRec for a more actively documented signature-based
      file-carving alternative to Foremost.
    rel: alternative
    sources:
      - https://foremost.sourceforge.net/
      - https://www.cgsecurity.org/testdisk_doc/index.html
      - https://www.cgsecurity.org/wiki/PhotoRec
category: security
package-manager:
  brew: foremost
  debian: foremost
  dnf: foremost
  macports: foremost
  nix: foremost
  pacman: foremost
  ubuntu: foremost
package-manager-url: https://formulae.brew.sh/formula/foremost
license: LicenseRef-Homebrew-public-domain
tags:
  - cli
  - data-carving
  - file-recovery
  - forensics
description: Console program to recover files based on their headers and footers
executables:
  - foremost
provenance:
  formula: foremost
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
