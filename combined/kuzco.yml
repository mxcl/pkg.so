id: brew:kuzco
display-name: Kuzco
homepage: https://github.com/RoseSecurity/Kuzco
repo: https://github.com/RoseSecurity/Kuzco
docs:
  - https://github.com/RoseSecurity/Kuzco#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kuzco is an early, niche tool in the wave of AI-assisted infrastructure-as-code
      utilities. The release history shows fast iteration through packaging, prompt
      customization, a TUI, and command-based workflows rather than long-running
      ecosystem adoption.
  package-nerd-significance:
    - >
      Kuzco is notable as a small Homebrew-packaged example of local-LLM tooling being
      inserted into IaC review workflows, next to more established static analyzers such
      as tfsec and tflint-style tools.
  project-history:
    - >
      The project appeared as an infrastructure-analysis tool in the Terraform/OpenTofu
      ecosystem. Its README frames the problem as reviewing generated or minimal IaC
      resources without manually digging through provider documentation, using
      Ollama-backed local LLMs to recommend safer and more efficient settings.
  related-projects:
    - >
      Kuzco is related to Terraform, OpenTofu, Ollama, and static IaC analysis tools
      such as tfsec and tflint.
  sources:
    - https://github.com/RoseSecurity/Kuzco
    - https://github.com/RoseSecurity/Kuzco/releases
  summary:
    - >
      Kuzco is a Go CLI from RoseSecurity for reviewing Terraform and OpenTofu
      resources, comparing them with provider schemas, and asking a local LLM for
      improvement suggestions.
  timeline:
    - 'v0.7.0: Added publishing workflow and customizable prompts.'
    - 'v0.9.0: Added a TUI.'
    - 'v1.0.0: Introduced `fix` and `recommend` command workflows.'
  usage:
    - >
      Users run the CLI against Terraform or OpenTofu configurations. The README
      documents Homebrew, Go, Apt, and source installation, requires Ollama for
      model-backed recommendations, and exposes commands such as `recommend`, `fix`,
      `list`, and `version`.
related-packages:
  - id: brew:ollama
    reason: >
      Kuzco requires Ollama to run the local language models that generate its
      infrastructure recommendations and fixes.
    rel: adjacent_workflow
    sources:
      - https://github.com/RoseSecurity/Kuzco#installation
      - https://docs.ollama.com/
  - id: brew:opentofu
    reason: >
      Use OpenTofu to author and execute the infrastructure configurations that Kuzco's
      `recommend` and `fix` commands are designed to review.
    rel: adjacent_workflow
    sources:
      - https://github.com/RoseSecurity/Kuzco
      - https://opentofu.org/docs/
category: ai
package-manager:
  brew: kuzco
package-manager-url: https://formulae.brew.sh/formula/kuzco
license: Apache-2.0
tags:
  - ai
  - cli
  - infrastructure-as-code
  - opentofu
  - terraform
description: Reviews Terraform and OpenTofu resources and uses AI to suggest improvements
executables:
  - kuzco
provenance:
  formula: kuzco
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
