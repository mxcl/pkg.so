id: brew:ffmate
display-name: FFmate
homepage: https://docs.ffmate.io
repo: https://github.com/welovemedia/ffmate
docs:
  - https://docs.ffmate.io/
  - https://docs.ffmate.io/docs/getting-started
  - https://docs.ffmate.io/docs/tasks
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Source-backed public adoption history is still thin because the project is young.
      The official repository and docs position it for developers integrating
      transcoding into applications and services rather than as a long-established Unix
      multimedia primitive.
  package-nerd-significance:
    - >
      For package users, FFmate matters as a packaged orchestration layer around FFmpeg:
      it is not another codec toolkit, but a daemon/API surface for repeatable media
      pipelines.
  project-history:
    - >
      The public GitHub repository was created in January 2025. Its README describes
      FFmate as an automation layer built on top of FFmpeg, designed both to simplify
      transcoding and to act as an extensible engine for custom media workflows.
  related-projects:
    - FFmpeg is the underlying transcoding engine that FFmate automates.
  sources:
    - https://github.com/welovemedia/ffmate
    - https://api.github.com/repos/welovemedia/ffmate
    - https://docs.ffmate.io/
  summary:
    - >
      FFmate is a newer FFmpeg automation layer aimed at turning one-off command-line
      transcoding into a service-style workflow with a REST API, web UI, webhooks, watch
      folders, presets, queueing, and script hooks.
  timeline:
    - '2025: Public GitHub repository created.'
    - >
      2025-2026: Official documentation and README describe FFmate as an FFmpeg-based
      automation layer with API, UI, queues, watchfolders, presets, webhooks, and script
      hooks.
  usage:
    - >
      The usual workflow is to run FFmate as a server, then submit and manage tasks
      through its REST API, web UI, watchfolder endpoints, webhooks, presets, and
      pre/post-processing scripts while FFmpeg remains the external media engine.
related-packages:
  - id: brew:ffmpeg
    reason: >
      FFmpeg is FFmate's required media-processing engine; install it alongside FFmate
      for native deployments or select its binary with FFmate's ffmpeg flag.
    rel: adjacent_workflow
    sources:
      - https://docs.ffmate.io/docs/getting-started
      - https://ffmpeg.org/documentation.html
category: media
package-manager:
  brew: ffmate
package-manager-url: https://formulae.brew.sh/formula/ffmate
license: AGPL-3.0-only
tags:
  - automation
  - cli
  - ffmpeg
