id: brew:fnlfmt
display-name: fnlfmt
homepage: https://git.sr.ht/~technomancy/fnlfmt
repo: https://git.sr.ht/~technomancy/fnlfmt
docs:
  - https://git.sr.ht/~technomancy/fnlfmt/tree/main/item/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied official package-manager metadata shows fnlfmt packaged by Homebrew,
      Alpine, Nix, and Arch, indicating adoption beyond its upstream SourceHut
      repository among Unix-like developer package collections.
  package-nerd-significance:
    - >
      For package maintainers, fnlfmt is a compact example of language-specific
      formatter packaging for a smaller Lisp-family language. It matters less for broad
      ecosystem reach than for filling the expected formatter slot in Fennel toolchains.
  project-history:
    - >
      The project is maintained by technomancy on SourceHut and is distributed as a
      small formatter in the Fennel/Lisp tooling ecosystem. Official package metadata
      lists LGPL-3.0-or-later licensing and points to the SourceHut repository as the
      homepage.
  related-projects:
    - >
      Fennel is the language ecosystem fnlfmt serves. Homebrew, Alpine, Nix, and Arch
      are listed package-manager distribution channels in the supplied metadata.
  sources:
    - https://formulae.brew.sh/api/formula.json
    - https://formulae.brew.sh/formula/fnlfmt
    - https://git.sr.ht/~technomancy/fnlfmt
    - https://git.sr.ht/~technomancy/fnlfmt/tree/main/item/README.md
  summary:
    - >
      fnlfmt is a command-line formatter for Fennel source code. Its official repository
      describes it as a formatter for Fennel code, and the package metadata exposes a
      single `fnlfmt` executable.
  timeline:
    - >
      Current: Official metadata identifies fnlfmt as a Fennel formatter with a
      SourceHut upstream.
    - 'Current: Package metadata lists Homebrew, Alpine, Nix, and Arch package names.'
  usage:
    - >
      fnlfmt is used as a source formatter for Fennel projects, fitting the common
      package-manager pattern of installing a single CLI and invoking it in editor,
      lint, or formatting workflows.
related-packages:
  - id: brew:fennel
    reason: >
      Fennel is the language that fnlfmt formats, so install it alongside fnlfmt to run
      and develop the source files being normalized.
    rel: adjacent_workflow
    sources:
      - https://git.sr.ht/~technomancy/fnlfmt/tree/main/item/README.md
      - https://fennel-lang.org
category: developer-tools
package-manager:
  apk: fnlfmt
  brew: fnlfmt
  nix: fnlfmt
  pacman: fnlfmt
package-manager-url: https://formulae.brew.sh/formula/fnlfmt
license: LGPL-3.0-or-later
tags:
  - cli
  - fennel
  - formatter
  - lisp
  - source-code
description: Formatter for Fennel code
executables:
  - fnlfmt
provenance:
  formula: fnlfmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
