id: brew:kibi
display-name: Kibi
homepage: https://github.com/ilai-deutel/kibi
repo: https://github.com/ilai-deutel/kibi
docs:
  - https://github.com/ilai-deutel/kibi#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/kibi/config.ini
    - ~/.config/kibi/config.ini
    - $XDG_CONFIG_DIRS/kibi/config.ini
    - /etc/kibi/config.ini
    - /etc/xdg/kibi/config.ini
    - $XDG_DATA_HOME/kibi/syntax.d/<file_name>.ini
    - ~/.local/share/kibi/syntax.d/<file_name>.ini
    - $XDG_DATA_DIRS/kibi/syntax.d/<file_name>.ini
    - /usr/local/share/kibi/syntax.d/<file_name>.ini
    - /usr/share/kibi/syntax.d/<file_name>.ini
  windows:
    - '%APPDATA%\Kibi\config.ini'
    - '%APPDATA%\Kibi\syntax.d\<file_name>.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation with Cargo and packages for AUR, Termux,
      Fedora/CentOS COPR, NetBSD, and Flathub. The Homebrew input record also lists
      packaging in Homebrew, MacPorts, Nix, and Alpine APK.
  package-nerd-significance:
    - >
      Package nerds care about Kibi because it is both useful software and a packaging
      curiosity: a real Rust editor designed around a strict source-size budget, minimal
      dependencies, and broad terminal portability.
  project-history:
    - >
      The repository copyright notice begins in 2020, and GitHub releases show v0.1.1
      published on 2020-02-13. The README says the project is inspired by antirez's
      `kilo`, a compact C text editor, but adds Rust-specific organization and extra
      editor features while preserving the line-count challenge.
  related-projects:
    - >
      Kibi explicitly cites antirez/kilo as inspiration and compares itself with kilo in
      its README.
  sources:
    - https://crates.io/crates/kibi
    - https://github.com/antirez/kilo
    - https://github.com/ilai-deutel/kibi
    - https://github.com/ilai-deutel/kibi/releases
  summary:
    - >
      Kibi is a small Rust terminal text editor constrained to 1024 lines of Rust per
      platform while still offering UTF-8 support, incremental search, syntax
      highlighting, line numbers, and configuration.
  timeline:
    - '2020: v0.1.1 release published on GitHub.'
    - '2021: v0.2.2 release published after the early 0.2.x series.'
    - '2025: v0.3.0 release resumed the release stream.'
    - '2026: v0.3.3 release published on 2026-02-01.'
  usage:
    - >
      Kibi is used as a lightweight terminal editor for opening files or scratch
      buffers, especially when a user wants a tiny, auditable editor with modern
      conveniences rather than a full editor ecosystem.
related-packages:
  - id: brew:micro
    reason: >
      Choose micro when you want a more extensible terminal editor with mouse support,
      splits, multiple cursors, and Lua plugins; choose Kibi when its tiny, deliberately
      constrained implementation is the attraction.
    rel: alternative
    sources:
      - https://github.com/ilai-deutel/kibi#readme
      - https://github.com/micro-editor/micro#readme
  - id: brew:nano
    reason: >
      Choose GNU nano for a mature, broadly familiar modeless editor and established
      nanorc ecosystem; choose Kibi for its modern Rust implementation and strict
      1024-line design challenge.
    rel: alternative
    sources:
      - https://github.com/ilai-deutel/kibi#readme
      - https://www.nano-editor.org/dist/latest/nano.html
category: productivity
package-manager:
  apk: kibi
  brew: kibi
  macports: kibi
  nix: kibi
package-manager-url: https://formulae.brew.sh/formula/kibi
license: Apache-2.0 OR MIT
tags:
  - cli
  - rust
  - syntax-highlighting
  - terminal
  - text-editor
description: Text editor in ≤1024 lines of code, written in Rust
executables:
  - kibi
provenance:
  formula: kibi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
