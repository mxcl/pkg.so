id: brew:checkpwn
display-name: checkpwn
homepage: https://github.com/brycx/checkpwn
repo: https://github.com/brycx/checkpwn
docs:
  - https://github.com/brycx/checkpwn#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/checkpwn/checkpwn.yml
    - ~/.config/checkpwn/checkpwn.yml
  macos: ~/Library/Application Support/checkpwn/checkpwn.yml
  windows: '%APPDATA%\checkpwn\checkpwn.yml'
credentials-file-location:
  linux:
    - $XDG_CONFIG_HOME/checkpwn/checkpwn.yml
    - ~/.config/checkpwn/checkpwn.yml
  macos: ~/Library/Application Support/checkpwn/checkpwn.yml
  windows: '%APPDATA%\checkpwn\checkpwn.yml'
history:
  adoption-history:
    - >
      The README documents installation through Cargo and Homebrew, while the batch
      metadata also lists Nix. This is typical adoption for a focused Rust CLI: cargo
      install first, then package-manager formulas for repeatable workstation setup.
    - >
      Adoption appears niche rather than ecosystem-defining, with modest GitHub star
      counts, but the tool solves a clear packageable task: local HIBP checks without
      writing API glue.
  package-nerd-significance:
    - >
      checkpwn is package-nerd interesting as a compact Rust security CLI with Cargo,
      Homebrew, and Nix distribution. It shows the pattern of wrapping a popular web
      security service in a local command that stores minimal configuration and can be
      scripted.
    - >
      Its config-path behavior also matters to packagers because API keys are user
      state, not package state.
  project-history:
    - >
      The brycx/checkpwn repository was created in May 2018. The README describes
      checkpwn as a tool to check Have I Been Pwned and determine whether passwords need
      changing.
    - >
      The Cargo metadata identifies it as a command-line utility with password,
      security, and HIBP keywords. The project continued to receive releases through
      0.6.0 in March 2026, when it moved to Rust Edition 2024 and updated dependencies.
  related-projects:
    - Have I Been Pwned is the upstream breach-data service that checkpwn queries.
    - checkpwn_lib is the Rust library dependency used by the CLI according to Cargo metadata.
  sources:
    - https://github.com/brycx/checkpwn
    - https://github.com/brycx/checkpwn/releases
    - https://github.com/brycx/checkpwn/blob/master/Cargo.toml
  summary:
    - >
      checkpwn is a Rust CLI for querying Have I Been Pwned account, paste, and
      password-breach data. It is small, but source-backed enough to document as a
      package-manager convenience wrapper around a security API.
  timeline:
    - '2018: brycx/checkpwn repository created.'
    - '2020: 0.5.1 release published.'
    - '2022: 0.5.4 release published.'
    - '2026: 0.6.0 released with Rust Edition 2024.'
  usage:
    - >
      Users register a Have I Been Pwned API key with checkpwn register, which writes
      checkpwn.yml in the user's configuration directory, then use checkpwn acc for
      accounts or lists and checkpwn pass for passwords.
    - >
      For account checks, the README says checkpwn queries both the HIBP paste and
      account databases. Password checking is separated from account checking, matching
      the common operational distinction between exposed accounts and compromised
      password material.
related-packages:
  - id: brew:pwned
    reason: >
      Choose pwned when you want a Node.js HIBP client with a broader command set for
      breaches, domains, data classes, subscriptions, stealer logs, accounts, pastes,
      and passwords.
    rel: alternative
    sources:
      - https://github.com/brycx/checkpwn#readme
      - https://github.com/wKovacs64/pwned#readme
category: security
package-manager:
  brew: checkpwn
  nix: checkpwn
package-manager-url: https://formulae.brew.sh/formula/checkpwn
license: MIT
tags:
  - cli
  - data-breach
  - hibp
  - passwords
  - rust
  - security
description: Check Have I Been Pwned and see if it's time for you to change passwords
executables:
  - checkpwn
provenance:
  formula: checkpwn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
