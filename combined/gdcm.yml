id: brew:gdcm
display-name: GDCM
homepage: https://sourceforge.net/projects/gdcm/
repo: https://github.com/malaterre/GDCM
docs:
  - https://gdcm.sourceforge.net/html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GDCM's adoption is centered on medical-imaging workflows that need portable DICOM
      parsing, conversion, anonymization, de-identification, and network operations
      outside a full clinical application.
    - >
      The SourceForge page lists support for common medical-image transfer syntaxes and
      a VTK bridge, placing GDCM in scientific, imaging, and visualization package
      stacks.
  package-nerd-significance:
    - >
      GDCM is package-nerd significant because DICOM support is hard to package cleanly:
      it combines a native C++ library, command-line tools, language bindings, image
      codecs, medical metadata, and network protocol behavior.
    - >
      For scientific distributions, it is often the pragmatic DICOM brick under
      higher-level imaging and visualization workflows.
  project-history:
    - >
      The official SourceForge project describes Grassroots DiCoM as a C++ library for
      DICOM medical files with bindings for Python, C#, Java, PHP, and Perl.
    - >
      The project README says the official Git repository is hosted on SourceForge and
      describes the GitHub repository as a source mirror. It also emphasizes CMake-based
      builds and nightly testing through the GDCM dashboard.
  related-projects:
    - GDCM is related to the DICOM standard and to VTK through its documented VTK bridge.
    - >
      It overlaps with other medical-imaging and DICOM toolkits, but the official
      sources mainly position it by DICOM transfer syntax support, SCU operations,
      bindings, and command-line applications.
  sources:
    - https://github.com/malaterre/GDCM
    - https://open.cdash.org/index.php?project=GDCM
    - https://raw.githubusercontent.com/malaterre/GDCM/master/README.md
    - https://sourceforge.net/projects/gdcm/
  summary:
    - >
      GDCM, Grassroots DICOM, is a cross-platform C++ implementation and utility suite
      for DICOM medical imaging files.
  timeline:
    - >
      SourceForge era: GDCM is distributed as the Grassroots DICOM project with files,
      mailing lists, tickets, Git, and documentation hosted on SourceForge.
    - >
      Modern source era: The README identifies SourceForge as the official Git
      repository and GitHub as a source-code copy.
    - >
      Current project page: SourceForge lists active project updates and the
      cross-platform DICOM feature set.
  usage:
    - >
      The package ships utilities such as gdcmdump, gdcmconv, gdcminfo, gdcmanon,
      gdcmscanner, gdcmscu, and gdcmxml for inspecting, converting, anonymizing,
      scanning, networking, archiving, and XML-related DICOM work.
    - >
      The official project page lists support for RAW, JPEG, JPEG 2000, JPEG-LS, RLE,
      deflated transfer syntax, SCU operations such as C-ECHO, C-FIND, C-STORE, and
      C-MOVE, and PS 3.15 de-identification and re-identification mechanisms.
related-packages:
  - id: brew:dcmtk
    reason: >
      Choose DCMTK when you want another established C++ DICOM toolkit with an
      especially broad, separately documented collection of DICOM command-line
      applications.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/gdcm/
      - https://support.dcmtk.org/docs/
      - https://support.dcmtk.org/docs/mod_dcmapps.html
  - id: brew:vtk
    reason: >
      Use VTK downstream when GDCM supplies DICOM data to a scientific visualization
      pipeline through GDCM's documented VTK bridge.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/projects/gdcm/
      - https://docs.vtk.org/
category: science
package-manager:
  apk: gdcm
  brew: gdcm
  debian: gdcm-doc
  dnf: gdcm
  macports: gdcm
  nix: gdcm
  pacman: gdcm
  ubuntu: gdcm-doc
  zypper: gdcm
package-manager-url: https://formulae.brew.sh/formula/gdcm
license: BSD-3-Clause
