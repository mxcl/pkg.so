  - gdcmdump
  - gdcmgendir
  - gdcmimg
  - gdcminfo
  - gdcmpap3
  - gdcmraw
  - gdcmscanner
  - gdcmscu
  - gdcmtar
  - gdcmxml
provenance:
  formula: gdcm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
