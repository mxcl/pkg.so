id: brew:claudekit
display-name: claudekit
homepage: https://github.com/carlrannaberg/claudekit
repo: https://github.com/carlrannaberg/claudekit
docs:
  - https://github.com/carlrannaberg/claudekit/tree/main/docs
  - https://github.com/carlrannaberg/claudekit#readme
config-file-location:
  unix:
    - .claude/settings.json
    - .claudekit/config.json
    - .claude/settings.local.json
    - ~/.claude/settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is distributed through npm-style global installation and Homebrew,
      which puts it in the same CLI-tool culture as other developer workflow helpers.
      The official README also surfaces npm version/download badges and notes inclusion
      in an Awesome Claude Code list.
  package-nerd-significance:
    - >
      Package-manager users care because claudekit turns a set of Claude Code
      conventions into a reproducible CLI install: commands, hooks, project/user
      configuration files, and generated prompt assets can be installed and inspected
      like normal developer tooling.
  project-history:
    - >
      The project is organized as an npm-installed command-line toolkit with a GitHub
      documentation tree. Its README presents the project around Claude Code setup, hook
      execution, code review commands, checkpoint commands, and prompt extraction for
      external LLM tools.
  related-projects:
    - >
      The README explicitly positions claudekit alongside Claude Code and codebase-map,
      and it references optional MCP integration with Context7.
  sources:
    - >
      Official GitHub README: describes claudekit as guardrails/workflow automation for
      Claude Code, documents npm installation, setup commands, hooks, and config files.
    - 'Official GitHub docs directory: provides the dedicated documentation surface.'
  summary:
    - >
      claudekit is a Claude Code companion toolkit that packages hooks, slash commands,
      guardrails, checkpoints, and specialist agent prompts for AI-assisted software
      development workflows.
  usage:
    - >
      Typical use starts with installing `claudekit`, running `claudekit setup`, and
      then using Claude Code slash commands and automatic hooks for review, validation,
      file guarding, and checkpoint workflows.
related-packages:
  - id: cask:claude-code
    reason: >
      Claude Code hosts the commands, agents, settings, and lifecycle hooks installed
      and executed by claudekit.
    rel: adjacent_workflow
    sources:
      - https://github.com/carlrannaberg/claudekit#readme
      - https://github.com/anthropics/claude-code#readme
  - id: brew:claude-hooks
    reason: >
      Choose claude-hooks instead when you primarily want a small type-safe scaffold for
      authoring custom hooks rather than claudekit's larger collection of ready-made
      guardrails and workflows.
    rel: alternative
    sources:
      - https://github.com/carlrannaberg/claudekit#readme
      - https://github.com/johnlindquist/claude-hooks#readme
category: ai
package-manager:
  brew: claudekit
package-manager-url: https://formulae.brew.sh/formula/claudekit
license: MIT
tags:
  - ai
  - claude-code
  - cli
  - commands
  - guardrails
  - hooks
  - workflow-automation
description: Intelligent guardrails and workflow automation for Claude Code
executables:
  - claudekit
  - claudekit-hooks
provenance:
  formula: claudekit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
