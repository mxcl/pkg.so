id: brew:kyma-cli
display-name: Kyma CLI
homepage: https://kyma-project.io
repo: https://github.com/kyma-project/cli
docs:
  - https://github.com/kyma-project/cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kyma's adoption is tied to SAP BTP Kyma runtime and to organizations building
      cloud-native extensions around SAP and non-SAP systems. The CLI is a
      package-manager-friendly entry point for developers who want local commands rather
      than only dashboard or raw kubectl workflows.
  package-nerd-significance:
    - >
      Kyma CLI is notable as an enterprise Kubernetes ecosystem binary that packages
      SAP's platform opinions into a developer command. It shows how cloud runtimes
      often grow their own kubectl-adjacent CLIs once custom resources and module
      lifecycles become central.
  project-history:
    - >
      Kyma started in 2017 and reached a 1.0 milestone announced on the Kubernetes blog
      on 2019-05-23, where SAP described donating the project to the open-source
      community. The CLI emerged as the developer tool for managing a Kyma cluster and
      smoothing application workflows on top of Kubernetes.
    - >
      The Kyma project later moved from a monolithic release model to independently
      delivered modules. The Kyma CLI followed that platform shift: the repository
      README warns that the v2 command set is deprecated and points users toward v3
      commands, while the user documentation emphasizes module management and direct
      interaction with Kyma custom resources.
  related-projects:
    - >
      Kyma CLI relates to Kyma, SAP BTP Kyma runtime, Kubernetes, Kyma modules,
      lifecycle-manager, serverless, NATS manager, kubectl, and SAP Cloud SDK workflows.
  sources:
    - https://github.com/kyma-project/cli
    - https://github.com/kyma-project/cli/releases
    - https://kubernetes.io/blog/2019/05/23/kyma-extend-and-build-on-kubernetes-with-ease/
    - https://kyma-project.io/external-content/cli/docs/user/README.html
    - >
      https://learning.sap.com/courses/developing-applications-in-sap-btp-kyma-runtime/describing-kyma-in-relation-to-kubernetes_df359aed-4e40-4ffc-9d9e-058699691bea
    - https://pages.community.sap.com/topics/kyma
  summary:
    - >
      Kyma CLI is the command-line companion for Kyma, SAP's open-source
      Kubernetes-based application runtime. It helps developers manage Kyma modules and
      deploy simple applications with short commands.
  timeline:
    - '2017: SAP Learning material says Project Kyma was started.'
    - >
      2019-05-23: The Kubernetes blog announced Kyma 1.0 and described SAP's donation of
      the project to open source.
    - >
      2026-05-26: The kyma-project/cli releases page showed a 3.5.1 release entry dated
      26 May.
  usage:
    - >
      The CLI is used to inspect Kyma commands, manage modules, and push simple
      applications into a Kyma environment. In package-manager terms it is a focused
      Kubernetes distribution tool: small binary, SAP/Kyma-specific verbs, and a close
      relationship to the platform's module lifecycle.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubectl complements Kyma CLI for applying and inspecting the underlying Kubernetes
      resources, and Kyma's official installation workflow explicitly requires both
      tools.
    rel: adjacent_workflow
    sources:
      - https://kyma-project.io/02-get-started/01-quick-install.html
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:k3d
    reason: >
      k3d creates the local Kubernetes cluster used by Kyma's official standalone
      quick-install workflow before Kyma CLI manages the platform and its modules.
    rel: adjacent_workflow
    sources:
      - https://kyma-project.io/02-get-started/01-quick-install.html
      - https://k3d.io/
category: cloud-infrastructure
package-manager:
  brew: kyma-cli
  chocolatey: kyma-cli
package-manager-url: https://formulae.brew.sh/formula/kyma-cli
license: Apache-2.0
tags:
  - cli
