id: brew:menhir
display-name: Menhir
homepage: http://cristal.inria.fr/~fpottier/menhir
repo: https://gitlab.inria.fr/fpottier/menhir
docs:
  - https://gallium.inria.fr/~fpottier/menhir/manual.html
  - http://cristal.inria.fr/~fpottier/menhir
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project history is unusually well documented in its README. Régis-Gianas
      contributed the early front-end for parsing and transforming .mly grammar files,
      while Pottier contributed the LR(1) construction algorithms, conflict
      explanations, and first OCaml code backend. A table backend using menhirLib
      followed in 2008 with Jane Street Capital funding through the OCaml Summer
      Project. Jacques-Henri Jourdan implemented a Coq-table backend in 2011. Frédéric
      Bour contributed the incremental API, inspection API, attributes, and MenhirSdk
      between 2014 and 2017. The build moved to Dune in 2019, and Émile Trotignon and
      Pottier implemented a new efficient, well-typed code backend around StackLang in
      2021.
  sources:
    - https://gallium.inria.fr/~fpottier/menhir/manual.html
    - https://github.com/LexiFi/menhir
    - https://inbox.ci.dev/caml-list/20051215084616.GC1966%40yquem.inria.fr/
    - https://ocaml.org/p/menhir/20200123
  summary:
    - >
      Menhir is an LR(1) parser generator for OCaml, created in 2005 by François Pottier
      and Yann Régis-Gianas. Its manual presents it as a generator that turns grammar
      specifications plus semantic actions into parsers, based on Knuth's LR(1)
      construction and inspired by yacc, ML-Yacc, and ocamlyacc while adding more modern
      capabilities.
  usage:
    - >
      Menhir's ecosystem role is as the richer successor-style tool for OCaml parser
      generation. OCaml developers feed it .mly grammar files and receive parser
      .ml/.mli output, either as standalone generated code or table-backed parsers
      linked with MenhirLib. The opam package page lists many reverse users, including
      compiler, verification, parsing, and developer-tooling packages, which matches its
      place as infrastructure for OCaml language tooling.
related-packages:
  - id: brew:ocaml
    reason: >
      Choose OCaml's bundled ocamlyacc for a traditional yacc-compatible generator;
      choose Menhir when LR(1) grammars, conflict explanations, parameterized rules, or
      incremental parsing are important.
    rel: alternative
    sources:
      - https://gallium.inria.fr/~fpottier/menhir/
      - https://ocaml.org/manual/5.5/lexyacc.html
