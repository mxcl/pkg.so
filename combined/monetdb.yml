history:
  adoption-history:
    - >
      CWI describes MonetDB as a DBMS for high-performance complex queries over large
      datasets, often with hundreds of columns and millions of rows, and names domains
      such as CRM, telecommunications, healthcare, astronomy, remote sensing, biology,
      and seismology. A 2012 IEEE Data Engineering Bulletin paper summary describes
      MonetDB as an open-source column-store for analytics over large collections of
      data, used in health care, telecommunications, scientific databases, and
      data-management research, with more than 10,000 monthly downloads at that time.
  project-history:
    - >
      Its early industrial path ran through Data Distilleries, a CWI spin-off that used
      early MonetDB implementations in an analytical customer-relationship suite before
      SPSS acquired the company in 2003. MonetDB version 4 moved into the open-source
      domain in 2004, with major additions including SQL:2003 support and APIs for PHP,
      JDBC, Python, Perl, ODBC, and Ruby; an XQuery front end followed in 2005. Later
      phases froze the older MonetDB 4 kernel, pushed the columnar approach deeper into
      MonetDB 5 and SQL layers, and added embedded use from R, Python, Java, and C as an
      SQLite-like analytical engine.
  sources:
    - https://formulae.brew.sh/formula/monetdb
    - >
      https://stratos.seas.harvard.edu/publications/monetdb-two-decades-research-column-oriented-database-architectures
    - >
      https://www.cwi.nl/en/results/software/monetdb-high-performance-query-processing-against-very-large-databases/
    - https://www.monetdb.org/about-us/monetdb-history/
  summary:
    - >
      MonetDB is a long-running open-source column-store relational database rooted in
      database-architecture research at Centrum Wiskunde & Informatica in the
      Netherlands. The MonetDB history page says the team has been pioneering
      column-store technology since 1993, building on earlier CWI database-kernel work
      and a Binary Association Table storage model aimed at analytical and scientific
      data problems.
  usage:
    - >
      As a package-manager entry, MonetDB is not a generic embedded library: Homebrew
      installs server and client tools such as mserver5, monetdbd, monetdb, mclient, and
      msqldump. It fills the niche of an analytical SQL column store for local
      experimentation, research workloads, and systems where a mature open-source
      columnar RDBMS is preferable to a cloud warehouse or row-store database.
related-packages:
  - id: brew:duckdb
    reason: >
      Choose DuckDB when the analytical SQL engine should run embedded inside an
      application with no separate database server.
    rel: alternative
    sources:
      - https://www.monetdb.org/
      - https://duckdb.org/why_duckdb
  - id: cask:clickhouse
    reason: >
      Choose ClickHouse for a column-oriented server focused on real-time OLAP and large
      distributed analytical workloads.
    rel: alternative
    sources:
      - https://www.monetdb.org/
      - https://clickhouse.com/docs/en/intro
      - https://clickhouse.com/resources/engineering/olap-database
