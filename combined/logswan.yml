id: brew:logswan
display-name: Logswan
homepage: https://www.logswan.org
repo: https://github.com/fcambus/logswan
docs:
  - https://www.logswan.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Logswan's adoption is modest but practical: the README lists packages for OpenBSD,
      NetBSD, FreeBSD, Debian, Ubuntu, Void Linux, Gentoo, and Homebrew. The supplied
      package facts also show Homebrew, Debian, and Ubuntu entries.
    - >
      The official GitHub repository shows a long-lived niche project with hundreds of
      stars, a small fork count, and regular releases through the 2.1.x series.
  package-nerd-significance:
    - >
      Logswan is interesting to package maintainers because it is a small,
      security-minded C tool with clear dependencies, sandboxing notes for OpenBSD
      pledge, optional seccomp, and deterministic JSON output. It is the opposite of a
      sprawling analytics stack.
  project-history:
    - >
      Frederic Cambus develops Logswan as intentionally opinionated software. The README
      states design goals of speed, memory efficiency, and simple code, and documents
      deliberate constraints such as Common Log Format support and byte-level reporting
      without rounded units.
    - >
      The official GitHub repository was created in June 2015. The project remains small
      and C-focused, with Jansson and libmaxminddb as key dependencies and JSON output
      as its primary integration surface.
  related-projects:
    - >
      Logswan belongs to the family of web-log analyzers, but its README differentiates
      it by using HyperLogLog counters and by avoiding broad format support.
  sources:
    - https://api.github.com/repos/fcambus/logswan
    - https://github.com/fcambus/logswan#readme
    - https://github.com/fcambus/logswan/releases/tag/2.1.16
    - https://www.logswan.org/
    - source_facts.package-manager
  summary:
    - >
      Logswan is a fast web-log analyzer focused on very large log files, especially API
      logs. It uses probabilistic data structures, including HyperLogLog counters, to
      keep memory use constant while estimating unique visitors.
  timeline:
    - '2015: Official GitHub repository created.'
    - '2021: 2.1.12 release published.'
    - '2025: 2.1.15 release published.'
    - '2026: 2.1.16 release published.'
  usage:
    - >
      The CLI form is `logswan [-ghv] [-d db] logfile`, with `-` accepted for standard
      input. Output goes to standard output as JSON, making it easy to redirect into
      other tools.
    - >
      GeoIP lookups are optional through `-g` and `-d db`. The README documents the
      default GeoIP2 database directory under `${CMAKE_INSTALL_PREFIX}/share/dbip`, but
      this is a data-file lookup rather than a Logswan configuration file.
related-packages:
  - id: brew:goaccess
    reason: >
      Choose GoAccess when you need interactive terminal or browser dashboards and
      broader web-log format support instead of Logswan's constant-memory, JSON-oriented
      analysis.
    rel: alternative
    sources:
      - https://github.com/fcambus/logswan#readme
      - https://goaccess.io/
      - https://goaccess.io/features
category: data
package-manager:
  brew: logswan
  debian: logswan
  ubuntu: logswan
