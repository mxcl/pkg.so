id: brew:logstash
display-name: Logstash
homepage: https://www.elastic.co/products/logstash
repo: https://github.com/elastic/logstash
docs:
  - https://www.elastic.co/docs/reference/logstash
config-file-location:
  unix:
    - '{extract.path}/config/logstash.yml'
    - /etc/logstash/logstash.yml
    - /etc/logstash/pipelines.yml
    - /etc/logstash/conf.d/*.conf
credentials-file-location:
  linux: /etc/logstash/logstash.keystore
  unix: '{path.settings}/logstash.keystore'
history:
  adoption-history:
    - >
      Logstash became widely adopted because it paired naturally with Elasticsearch and
      Kibana for log search and visualization. Elastic's own product pages and stack
      documentation present Logstash as part of the Elastic Stack alongside
      Elasticsearch, Kibana, Beats, and newer Elastic Agent components.
    - >
      A 2014 Elastic press release for Logstash 1.4 described it as one of the most
      popular open-source log-management tools and tied its growth to the ELK stack. In
      package-manager terms, the supplied facts show distribution through Homebrew,
      Chocolatey, Nix, and Scoop, while Elastic also publishes official downloadable
      binaries and Debian/RPM packages.
  package-nerd-significance:
    - >
      Logstash matters to package nerds because it is a heavyweight but scriptable
      bridge between Unix log files and modern search/observability stacks. It brought
      plugin-managed, package-distributed ETL behavior into the everyday log pipeline,
      and its config-file layout is a frequent concern for distro, Docker, and Homebrew
      packaging.
  project-history:
    - >
      The official repository describes Logstash as a tool to transport and process
      logs, events, and other data. Its GitHub repository was created in November 2010,
      and Elastic's current documentation frames it as a real-time data collection
      engine that can unify data from many sources and normalize it for downstream
      analytics and visualization.
    - >
      Elastic documentation emphasizes Logstash's pipeline model: inputs receive events,
      filters parse or enrich them, and outputs send them onward. The project also
      developed a large plugin ecosystem; the upstream README notes more than 200
      plugins and points plugin issues to separate repositories under the
      `logstash-plugins` organization.
  related-projects:
    - >
      Logstash is part of the Elastic Stack with Elasticsearch, Kibana, Beats, and
      Elastic Agent.
    - >
      Logstash plugins are maintained separately under the `logstash-plugins` GitHub
      organization and are published as Ruby gems.
  sources:
    - https://api.github.com/repos/elastic/logstash
    - https://github.com/elastic/logstash#readme
    - >
      https://www.elastic.co/about/press/elasticsearch-releases-logstash-1-4-makes-log-analysis-faster-simpler
    - https://www.elastic.co/docs/get-started/the-stack
    - https://www.elastic.co/docs/reference/logstash
    - https://www.elastic.co/logstash
    - source_facts.package-manager
  summary:
    - >
      Logstash is Elastic's open-source server-side data processing pipeline for
      ingesting, transforming, enriching, and routing events and logs. It is one of the
      classic components of the Elastic Stack and the older ELK stack.
  timeline:
    - '2010: Official GitHub repository created.'
    - >
      2014: Elastic announces Logstash 1.4 and promotes it as a major ELK-stack
      log-management component.
    - >
      2015: Elastic blog describes Logstash Forwarder as started by Logstash creator
      Jordan Sissel and folded into Filebeat.
    - '2026: Logstash 9.x tags are active in the official repository.'
  usage:
    - >
      Users write pipeline configuration files that describe inputs, filters, and
      outputs, commonly placing `.conf` files under `/etc/logstash/conf.d` on Debian and
      RPM installations. Settings such as `logstash.yml`, `pipelines.yml`, and JVM
      options live in the `path.settings` directory.
    - >
      The official docs also document a Logstash keystore for secrets. Sensitive values
      such as Elasticsearch passwords can be stored in the keystore and referenced from
      `logstash.yml` or pipeline configuration as `${KEY}`.
related-packages:
  - id: brew:filebeat
    reason: >
      Use Filebeat on source machines to harvest log files and forward their events to
      Logstash for parsing, enrichment, and routing.
    rel: adjacent_workflow
    sources:
      - https://www.elastic.co/docs/reference/beats/filebeat/logstash-output
      - https://www.elastic.co/docs/reference/logstash/advanced-pipeline
category: data
package-manager:
  brew: logstash
  chocolatey: logstash
  nix: logstash
  scoop: extras/logstash
package-manager-url: https://formulae.brew.sh/formula/logstash
license: Apache-2.0
tags:
  - cli
  - data-pipeline
  - elastic-stack
  - etl
  - events
  - logs
description: Tool for managing events and logs
executables:
  - logstash
  - logstash-plugin
provenance:
  formula: logstash
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
