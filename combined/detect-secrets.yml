id: brew:detect-secrets
display-name: detect-secrets
homepage: https://github.com/Yelp/detect-secrets
repo: https://github.com/Yelp/detect-secrets
docs:
  - https://github.com/Yelp/detect-secrets#readme
config-file-location:
  unix: .secrets.baseline
credentials-file-location: null
history:
  adoption-history:
    - >
      detect-secrets was designed for large repositories where immediately removing
      every old secret-like value may be impractical. The baseline model helped it fit
      pre-commit hooks and CI workflows: teams generate .secrets.baseline, audit it, and
      then use detect-secrets-hook or scans to catch new findings.
  package-nerd-significance:
    - >
      Package nerds care about detect-secrets because it is a practical DevSecOps CLI
      with a persistent config artifact rather than a one-shot grep-like scanner. It
      sits alongside pre-commit, GitHub secret scanning, trufflehog-style tools, and
      policy-driven CI checks.
  project-history:
    - >
      The GitHub repository was created in December 2017, and the README presents the
      tool as enterprise-friendly secret detection. Its changelog shows continued 1.x
      releases through 2024, including new detectors for GitLab, Telegram, PyPI, OpenAI,
      and IP addresses, plus support for newer Python versions.
  related-projects:
    - >
      The project is commonly used with pre-commit-style hooks, CI pipelines, and other
      secret-scanning tools that enforce repository hygiene.
  sources:
    - https://github.com/Yelp/detect-secrets
    - https://github.com/Yelp/detect-secrets/blob/master/README.md
    - https://github.com/Yelp/detect-secrets/blob/master/CHANGELOG.md
    - https://api.github.com/repos/Yelp/detect-secrets
  summary:
    - >
      detect-secrets is Yelp's open-source command-line scanner for finding secrets in
      code and, more importantly, preventing newly introduced secrets from entering a
      repository. Its README describes the baseline workflow as a way to accept existing
      findings while blocking new ones.
  timeline:
    - '2017: GitHub repository created for Yelp/detect-secrets.'
    - '2020: 0.14.x releases continued the pre-1.0 series.'
    - '2022: 1.2.0 added CI and release-pipeline work plus new token detectors.'
    - '2024: 1.5.0 added OS-agnostic baseline support and more modern token detectors.'
  usage:
    - >
      The standard package-manager workflow is to install the CLI, run detect-secrets
      scan into .secrets.baseline, and wire detect-secrets-hook into staged-file or
      tracked-file checks. The README also documents auditing the baseline and tuning
      detectors and filters for local policy.
related-packages:
  - id: brew:gitleaks
    reason: >
      Choose Gitleaks when you want a fast all-in-one scanner for files and Git history
      with TOML-defined detection rules, rather than detect-secrets'
      audited-baseline-centered workflow.
    rel: alternative
    sources:
      - https://github.com/Yelp/detect-secrets/blob/master/README.md
      - https://github.com/gitleaks/gitleaks
  - id: brew:trufflehog
    reason: >
      Choose TruffleHog when credential verification and scanning sources beyond a local
      code repository are more important than maintaining a detect-secrets baseline.
    rel: alternative
    sources:
      - https://github.com/Yelp/detect-secrets/blob/master/README.md
      - https://github.com/trufflesecurity/trufflehog
category: security
package-manager:
  brew: detect-secrets
  nix: detect-secrets
package-manager-url: https://formulae.brew.sh/formula/detect-secrets
license: Apache-2.0
tags:
  - cli
  - devsecops
  - pre-commit
  - secret-scanning
  - security
description: Enterprise friendly way of detecting and preventing secrets in code
executables:
  - detect-secrets
  - detect-secrets-hook
provenance:
  formula: detect-secrets
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
