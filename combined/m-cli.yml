id: brew:m-cli
display-name: m-cli
homepage: https://github.com/rgcr/m-cli
repo: https://github.com/rgcr/m-cli
docs:
  - https://github.com/rgcr/m-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      m-cli has become a recognizable macOS package-manager utility: the repository
      shows thousands of GitHub stars and hundreds of forks, while the input package
      facts list both Homebrew and Nix packaging.
    - >
      Its appeal is strongest among macOS users who prefer scriptable terminal access to
      system settings that are otherwise spread across System Settings, Apple tools, and
      small command-line utilities.
  package-nerd-significance:
    - >
      For package-maintainer audiences, m-cli is an example of a Homebrew-friendly macOS
      wrapper that packages many native system toggles as small shell plugins rather
      than as a daemon or GUI app.
    - >
      The 2.x syntax shift matters because it changed scripting compatibility while
      making completions easier to keep in sync with plugin help output.
  project-history:
    - >
      The public GitHub repository was created in July 2016 and is maintained as a small
      Unix-style command suite. Its README emphasizes macOS-only system control, no
      third-party dependencies, a simple manual install path, and Homebrew installation.
    - >
      The project underwent a notable 2.0 syntax change: the changelog records a move
      from positional plugin subcommands such as `m bluetooth on` to option-based forms
      such as `m bluetooth --enable`, alongside generated shell completions.
  related-projects:
    - Homebrew packages m-cli for macOS users who want the stable packaged command.
    - Nix also packages m-cli according to the supplied package-manager facts.
    - >
      The upstream README points users to related macOS command-line projects such as
      iproute-mac.
  sources:
    - https://api.github.com/repos/rgcr/m-cli
    - https://github.com/rgcr/m-cli
    - https://github.com/rgcr/m-cli/blob/main/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      m-cli is a shell-based macOS command-line utility that describes itself as a Swiss
      Army Knife for macOS in the terminal. It wraps many common system administration
      and preference tasks behind a single `m` command.
  timeline:
    - '2016: Public GitHub repository created'
    - '2026: v2.0.9 released with restart and completion fixes'
    - '2026: GitHub repository metadata shows roughly 9.9k stars and 318 forks'
  usage:
    - >
      Users install it with Homebrew as `brew install m-cli` or manually with the
      upstream install script, then run `m` to list commands or `m <command> --help` for
      command-specific usage.
    - >
      The command set covers macOS areas such as AirDrop, Bluetooth, display, DNS, Dock,
      Finder, firewall, Gatekeeper, network, power, printers, services, users, VPN,
      volume, wallpaper, and Wi-Fi. Some commands need sudo privileges or macOS privacy
      permissions.
related-packages: []
category: system
package-manager:
  brew: m-cli
  nix: m-cli
package-manager-url: https://formulae.brew.sh/formula/m-cli
license: MIT
tags:
  - automation
  - cli
  - macos
  - system-utility
description: Swiss Army Knife for macOS
executables:
  - m
provenance:
  formula: m-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
