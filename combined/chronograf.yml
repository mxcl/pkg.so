id: brew:chronograf
display-name: Chronograf
homepage: https://docs.influxdata.com/chronograf/latest/
repo: https://github.com/influxdata/chronograf
docs:
  - https://docs.influxdata.com/chronograf/v1
config-file-location:
  linux: /etc/default/chronograf
credentials-file-location: null
history:
  adoption-history:
    - >
      InfluxData's documentation describes Chronograf as the TICK stack UI and provides
      official packages for macOS tarballs, Debian packages, and RPM-based systems. The
      supplied package facts also show Homebrew, Scoop, and winget distribution.
  package-nerd-significance:
    - >
      Chronograf matters to package people because it is a packaged web application that
      sits beside CLI daemons in the TICK stack. Its formula/package history reflects
      the era when observability stacks were often installed locally as coordinated OS
      packages rather than only consumed as hosted services.
  project-history:
    - >
      InfluxData opened the Chronograf GitHub repository in 2016. The project is written
      in Go and React and its README positions it as a monitoring and visualization
      interface for InfluxDB, Telegraf, and Kapacitor workflows.
    - >
      Chronograf became the user-facing component of the TICK stack: Telegraf collects
      metrics, InfluxDB stores time-series data, Chronograf provides exploration and
      dashboards, and Kapacitor handles alerting and automation.
  related-projects:
    - >
      Related InfluxData projects include InfluxDB, Telegraf, Kapacitor, Flux, InfluxDB
      Enterprise, and InfluxDB 3.
  sources:
    - https://github.com/influxdata/chronograf#readme
    - https://docs.influxdata.com/chronograf/v1/introduction/installation/
    - https://docs.influxdata.com/chronograf/v1/introduction/getting-started/
    - https://docs.influxdata.com/chronograf/v1/administration/config-options/
    - https://github.com/influxdata/chronograf/blob/master/CHANGELOG.md
    - https://api.github.com/repos/influxdata/chronograf
  summary:
    - >
      Chronograf is InfluxData's open-source web UI for the TICK stack, used to
      visualize InfluxDB data, manage dashboards, inspect infrastructure, and create
      Kapacitor alerting rules.
  timeline:
    - '2016: GitHub repository created.'
    - '2016: v1.1-alpha noted in the changelog.'
    - '2017: 1.3.x releases continued the 1.x line.'
    - >
      2022: v1.10.0 added InfluxDB user, role, database, and proxy-related management
      improvements.
    - '2026: v1.11.x releases continued maintenance and InfluxDB 3 support.'
  usage:
    - >
      Typical use starts the chronograf service, opens localhost:8888, connects to
      InfluxDB, and optionally connects Kapacitor. Chronograf can use canned dashboards
      for Telegraf input plugins, create custom dashboards, explore data, manage users
      and queries, and configure OAuth or TLS.
related-packages:
  - id: brew:influxdb
    reason: >
      InfluxDB is the time-series database Chronograf connects to for querying,
      administration, and visualization.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/chronograf/v1/introduction/installation/
      - https://github.com/influxdata/influxdb
  - id: brew:telegraf
    reason: >
      Telegraf collects the infrastructure metrics that Chronograf visualizes and
      supplies inputs for Chronograf's canned dashboards.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/chronograf/v1/administration/config-options/
      - https://github.com/influxdata/telegraf
  - id: brew:kapacitor
    reason: >
      Kapacitor integrates with Chronograf to provide optional alert-rule,
      alert-history, TICKscript, and task workflows.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/chronograf/v1/introduction/installation/
      - https://docs.influxdata.com/chronograf/v1/guides/
      - https://github.com/influxdata/kapacitor
category: developer-tools
package-manager:
  brew: chronograf
  scoop: main/chronograf
  winget: InfluxData.Chronograf
package-manager-url: https://formulae.brew.sh/formula/chronograf
license: AGPL-3.0-or-later
tags:
  - cli
  - influxdata
  - monitoring
  - tick-stack
  - time-series
  - visualization
description: Open source monitoring and visualization UI for the TICK stack
executables:
  - chronoctl
  - chronograf
provenance:
  formula: chronograf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
