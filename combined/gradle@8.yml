id: brew:gradle@8
display-name: Gradle 8
homepage: https://www.gradle.org/
repo: https://github.com/gradle/gradle
docs:
  - https://docs.gradle.org/8.14.3/dsl
  - https://docs.gradle.org/8.14.3/release-notes.html
  - https://docs.gradle.org/8.14.3/userguide/userguide.html
config-file-location:
  unix:
    - $GRADLE_USER_HOME/gradle.properties
    - ./gradle.properties
    - $GRADLE_HOME/gradle.properties
    - settings.gradle
    - settings.gradle.kts
    - build.gradle
    - build.gradle.kts
credentials-file-location: null
history:
  adoption-history:
    - >
      Gradle 8 adoption is typically mediated by wrapper upgrades and plugin
      compatibility. Teams move to the 8.x line when their Java, Android, Kotlin, and
      plugin stacks can handle the new major-version behavior.
    - >
      A Homebrew `gradle@8` formula gives developers and CI images a stable installed
      command for that major line while allowing the unversioned formula and
      wrapper-managed projects to move independently.
  package-nerd-significance:
    - >
      Gradle 8 is package-manager-significant because it is a major build-tool line with
      compatibility consequences. Build tools sit upstream of dependency resolution,
      code generation, tests, publishing, and CI timing, so a major-version package is
      more than a CLI convenience.
    - >
      The formula gives users a clean way to install the Gradle 8 line for migration
      testing, plugin checks, and reproducible development images without conflating it
      with the unversioned Gradle formula.
  project-history:
    - >
      Gradle 8.0 release notes emphasize configuration-cache behavior, including more
      parallelism on the first build when using configuration cache, expanded
      compatibility for some core plugins, Java toolchain repository changes,
      configurable Gradle user home cache cleanup, and dependency-verification metadata
      improvements.
    - >
      In the project arc, Gradle 8 followed the Gradle 7 focus on Java 16, Apple
      Silicon, dependency verification, and version catalogs. It continued Gradle's
      long-running performance theme by making configuration-time work more reusable and
      parallel-friendly.
  related-projects:
    - Gradle Build Tool is the upstream project.
    - Gradle Wrapper is the usual per-project version pinning mechanism.
    - >
      Configuration Cache, Java Toolchains, Gradle Profiler, Develocity, and Gradle
      Build Scan are related Gradle ecosystem features or tools.
  sources:
    - https://blog.gradle.org/gradles-evolution-a-conversation-with-adam-murdoch
    - https://docs.gradle.org/8.0/release-notes.html
    - https://docs.gradle.org/8.14.3/release-notes.html
    - https://docs.gradle.org/8.14.3/userguide/userguide.html
    - https://docs.gradle.org/current/userguide/gradle_basics.html
    - https://formulae.brew.sh/formula/gradle@8
    - https://github.com/gradle/gradle
    - https://gradle.org/releases/
  summary:
    - >
      Gradle 8 is the Homebrew version-track package for the Gradle 8 major line. It
      represents a compatibility and migration target within the Gradle Build Tool
      project, not a separate upstream codebase.
  timeline:
    - >
      2012: Gradle 1.0 established the project as a major build-tool release with
      rebuilt dependency resolution.
    - >
      2021: Gradle 7.0 documented Java 16 support, Apple Silicon support, and version
      catalogs.
    - >
      2023: Gradle 8.0 documented configuration-cache parallelism and Java toolchain
      repository changes.
    - >
      Gradle 8 line: Homebrew exposes a version-track package for users who need that
      major line.
  usage:
    - >
      Usage remains Gradle's standard task and build-script workflow: `gradle build`,
      wrapper-driven builds, `settings.gradle(.kts)`, `build.gradle(.kts)`, and Gradle
      properties. The package's value is choosing the Gradle 8 runtime line for builds
      and tooling that expect it.
    - >
      The versioned docs in the input point to Gradle 8.14.3 DSL, release notes, and
      user guide pages, which are appropriate for a Gradle 8 package row.
related-packages:
  - id: brew:gradle-profiler
    reason: >
      Gradle Profiler complements Gradle 8 by benchmarking the 8.x line against other
      Gradle versions or measuring migration-related build-performance changes.
    rel: adjacent_workflow
    sources:
      - https://github.com/gradle/gradle-profiler
      - https://docs.gradle.org/8.14.3/userguide/performance.html
  - id: brew:maven
    reason: >
      Choose Maven when its prescriptive POM and lifecycle model better fits the
      project; Gradle's official migration guide documents concrete differences between
      Maven and Gradle.
    rel: alternative
    sources:
      - https://docs.gradle.org/8.14.3/userguide/migrating_from_maven.html
      - https://maven.apache.org/
  - id: brew:ant
    reason: >
      Choose Ant for an established XML target-oriented build, or use Gradle 8's
      documented Ant integration to migrate tasks incrementally.
    rel: alternative
    sources:
      - https://docs.gradle.org/8.14.3/userguide/migrating_from_ant.html
      - https://docs.gradle.org/8.14.3/userguide/ant.html
      - https://ant.apache.org/
category: developer-tools
package-manager:
  apk: gradle
  brew: gradle@8
  chocolatey: gradle
  debian: gradle
  macports: gradle
  nix: gradle_8
  pacman: gradle
  scoop: main/gradle
  ubuntu: gradle
package-manager-url: https://formulae.brew.sh/formula/gradle@8
license: Apache-2.0
tags:
  - build-automation
  - build-tool
  - cli
  - groovy
  - jvm
  - kotlin
description: Open-source build automation tool based on the Groovy and Kotlin DSL
executables:
  - gradle
provenance:
  formula: gradle@8
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
