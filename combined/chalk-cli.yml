id: brew:chalk-cli
display-name: chalk-cli
homepage: https://github.com/chalk/chalk-cli
repo: https://github.com/chalk/chalk-cli
docs:
  - https://github.com/chalk/chalk-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is published on npm as chalk-cli, and the Homebrew input identifies a
      Homebrew formula plus a Nix package mapping. Its adoption mostly follows the
      larger Chalk ecosystem rather than a separate application ecosystem.
  package-nerd-significance:
    - >
      chalk-cli is a small but tidy example of a JavaScript library becoming a
      Unix-style command. It matters to package nerds because it turns a popular Node
      terminal-formatting API into a composable shell filter.
  project-history:
    - >
      The GitHub repository and npm package were created in July 2015. The README
      presents it as terminal string styling for the command line and points users to
      the main chalk package for supported styles.
    - GitHub releases show a v5 line in 2021 and 2023, followed by v6.0.0 in 2025.
  related-projects:
    - >
      chalk/chalk is the API package that chalk-cli wraps and the README links for
      supported styles.
  sources:
    - https://github.com/chalk/chalk-cli#readme
    - https://github.com/chalk/chalk-cli/releases
    - https://api.github.com/repos/chalk/chalk-cli
    - https://registry.npmjs.org/chalk-cli
  summary:
    - >
      chalk-cli is the command-line wrapper for Chalk-style terminal text formatting. It
      lets shell users apply ANSI color and style formatting to arguments or standard
      input without writing a Node.js script.
  timeline:
    - '2015: GitHub repository and npm package created.'
    - '2021: v5.0.0 release published on GitHub.'
    - '2023: v5.0.1 release published.'
    - '2025: v6.0.0 release published.'
  usage:
    - >
      The CLI accepts one or more styles plus a string, or it can read piped input with
      --stdin. It also supports style templates and a demo mode for showing available
      Chalk styles.
related-packages: []
category: developer-tools
package-manager:
  brew: chalk-cli
  nix: chalk
package-manager-url: https://formulae.brew.sh/formula/chalk-cli
license: MIT
tags:
  - ansi-colors
  - cli
  - javascript
  - nodejs
  - terminal
  - text-styling
description: Terminal string styling done right
executables:
  - chalk
provenance:
  formula: chalk-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
