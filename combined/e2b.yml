id: brew:e2b
display-name: E2B
homepage: https://e2b.dev
repo: https://github.com/e2b-dev/e2b
docs:
  - https://e2b.dev/docs
  - https://e2b.dev/docs/cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      E2B has substantial AI-developer adoption signals: the README displays monthly
      download badges for the Python and JavaScript SDKs, links to a cookbook of
      examples with different LLMs and AI frameworks, and GitHub API metadata showed
      12,783 stars and 954 forks on 2026-06-30.
  package-nerd-significance:
    - >
      E2B is package-nerd significant because it packages a new post-LLM primitive:
      disposable, cloud-hosted execution environments for agents. It sits between SDK,
      CLI, code-interpreter package, cookbook, and self-hosted Terraform infrastructure
      rather than being just a single binary.
  project-history:
    - >
      The public GitHub repository was created on 2023-03-04, during the wave of
      developer tooling built around LLM agents and code execution. The README describes
      E2B as infrastructure for starting and controlling isolated sandboxes from
      JavaScript or Python, with a separate Code Interpreter SDK for `runCode` and
      `run_code` workflows.
  related-projects:
    - >
      The README points to the E2B JavaScript SDK, Python SDK, Code Interpreter SDK, E2B
      cookbook, and self-hosted infrastructure repository, tying the CLI to a larger
      sandbox platform.
  sources:
    - https://github.com/e2b-dev/E2B
    - https://raw.githubusercontent.com/e2b-dev/E2B/main/README.md
    - https://api.github.com/repos/e2b-dev/E2B
    - https://e2b.dev/docs
  summary:
    - >
      E2B is open source infrastructure for running AI-generated code in secure cloud
      sandboxes. The Homebrew package exposes the E2B CLI for managing sandboxes and
      templates, while the broader project centers on JavaScript and Python SDKs, code
      interpreter workflows, and self-hostable infrastructure.
  timeline:
    - '2023-03-04: Public GitHub repository created.'
    - >
      2023-2026: Project developed around AI-agent sandboxes, SDKs, a code-interpreter
      package, examples cookbook, and self-hosting infrastructure.
    - >
      2026-06-30: GitHub API showed active repository updates and more than twelve
      thousand stars.
  usage:
    - >
      Typical usage starts by installing the SDK, setting an `E2B_API_KEY`, creating a
      sandbox, and running commands inside it. The CLI package complements that workflow
      by managing E2B sandboxes and templates from a terminal.
related-packages: []
