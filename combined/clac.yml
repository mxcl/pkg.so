id: brew:clac
display-name: Clac
homepage: https://github.com/soveran/clac
repo: https://github.com/soveran/clac
docs:
  - https://github.com/soveran/clac#readme
config-file-location:
  unix:
    - $CLAC_WORDS
    - $XDG_CONFIG_HOME/clac/words
    - ~/.config/clac/words
credentials-file-location: null
history:
  adoption-history:
    - >
      The batch input records Clac in Homebrew, MacPorts, and Nix. The official README
      directs users to GitHub releases and a distribution-packages wiki page, indicating
      upstream expected both direct release installs and package-manager installs.
  package-nerd-significance:
    - >
      Clac is a neat package-manager specimen because it modernizes the tiny terminal
      calculator niche rather than replacing it with a GUI. It is small, self-contained,
      configurable through XDG-style paths, and culturally adjacent to `dc`, Forth, and
      RPN calculator users.
  project-history:
    - >
      The official repository was created in 2017 and its first GitHub release was named
      Initial release. The README explains the project motivation: the author liked
      Forth and other concatenative languages, used `dc` heavily, and wanted a
      calculator UI with an always-visible stack and realtime updates.
  related-projects:
    - >
      The README explicitly relates Clac to `dc`, Forth, stack-based languages,
      concatenative languages, postfix notation, and reverse Polish notation.
  sources:
    - https://github.com/soveran/clac/blob/master/README.md
    - https://api.github.com/repos/soveran/clac
    - https://api.github.com/repos/soveran/clac/releases
  summary:
    - >
      Clac is a command-line, stack-based calculator using postfix notation with the
      stack visible as calculations happen.
  timeline:
    - '2017: Official GitHub repository created.'
    - '2017: Initial release 0.1.0 published.'
    - '2026: Official GitHub repository metadata shows recent activity.'
  usage:
    - >
      Users run `clac` interactively, enter numbers to push them onto the stack, and
      type postfix commands such as arithmetic, logarithm, trigonometry, stack, stash,
      and custom word operations. The README documents a `words` configuration file for
      user-defined operations.
related-packages:
  - id: brew:bc
    reason: >
      Choose GNU bc when you need a standardized, script-oriented arbitrary-precision
      language or its bundled dc postfix calculator instead of Clac's always-visible
      interactive stack.
    rel: alternative
    sources:
      - https://github.com/soveran/clac#readme
      - https://www.gnu.org/software/bc/
      - https://www.gnu.org/software/bc/manual/html_node/bc_toc.html
category: productivity
package-manager:
  brew: clac
  macports: clac
  nix: clac
package-manager-url: https://formulae.brew.sh/formula/clac
license: BSD-2-Clause
tags:
  - calculator
  - cli
  - postfix-notation
  - rpn
  - stack-based
  - terminal
description: Command-line, stack-based calculator with postfix notation
executables:
  - clac
provenance:
  formula: clac
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
