id: brew:clitest
display-name: clitest
homepage: https://github.com/aureliojargas/clitest
repo: https://github.com/aureliojargas/clitest
docs:
  - https://github.com/aureliojargas/clitest#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is intentionally small, but it reached several developer-oriented
      package channels: the batch input records Homebrew, Debian, Fedora, Arch, and
      Ubuntu packages. The README also documents a Docker image and points to funcoeszz
      test files as a larger real-world suite using the clitest format.
  package-nerd-significance:
    - >
      clitest matters to package nerds as a tiny, portable test runner for command-line
      examples. It is the sort of tool that can smoke-test package documentation,
      man-page examples, and shell snippets without bringing in a language-specific test
      framework.
  project-history:
    - >
      clitest was published by Aurelio Jargas as a small single-script command-line
      testing tool. The upstream README frames it as applying the doctest idea to Unix
      command lines: documentation-like shell sessions can become executable tests.
  related-projects:
    - >
      Related projects and concepts include Python doctest, doctest.fish for fish shell
      users, shellspec-style shell testing tools, and command-documentation test suites
      such as funcoeszz's clitest files.
  sources:
    - https://github.com/aureliojargas/clitest#readme
    - https://github.com/aureliojargas/clitest/releases
  summary:
    - >
      clitest is a portable POSIX shell script for testing command-line sessions by
      comparing commands and expected output written in a terminal-like transcript.
  timeline:
    - '2013: GitHub repository created and early 0.1.0 tag committed.'
    - '2023: Version 0.5.0 tag committed.'
    - >
      2023: Upstream README documents direct script installation, Docker use, Markdown
      extraction, and real-world clitest suites.
  usage:
    - >
      Users write a text or Markdown file containing prompts, commands, and expected
      output, then run `clitest FILE` to execute and check those examples. The README
      documents prefix handling for indented Markdown code blocks and inline
      expected-output markers such as `#=>`.
related-packages:
  - id: brew:shellcheck
    reason: >
      Use ShellCheck alongside clitest to statically detect shell-code defects while
      clitest exercises the documented commands and verifies their runtime output;
      clitest upstream uses ShellCheck for its own portability checks.
    rel: adjacent_workflow
    sources:
      - https://github.com/aureliojargas/clitest#readme
      - https://github.com/koalaman/shellcheck#readme
category: developer-tools
package-manager:
  brew: clitest
  debian: clitest
  dnf: clitest
  pacman: clitest
  ubuntu: clitest
package-manager-url: https://formulae.brew.sh/formula/clitest
license: MIT
tags:
  - automation
  - cli
  - shell
  - testing
description: Command-Line Tester
executables:
  - clitest
provenance:
  formula: clitest
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
