id: brew:systemd
display-name: systemd
homepage: https://systemd.io
repo: https://github.com/systemd/systemd
docs:
  - https://systemd.io/
  - https://www.freedesktop.org/software/systemd/man/latest
config-file-location:
  linux:
    - /etc/systemd/system.conf
    - /etc/systemd/system.conf.d/*.conf
    - ~/.config/systemd/user.conf
    - /etc/systemd/user.conf
    - /etc/systemd/user.conf.d/*.conf
credentials-file-location:
  linux:
    - /etc/credstore/
    - /run/credstore/
    - /usr/lib/credstore/
    - /etc/credstore.encrypted/
    - /run/credstore.encrypted/
    - /usr/lib/credstore.encrypted/
    - $CREDENTIALS_DIRECTORY/
history:
  adoption-history:
    - >
      systemd.io links distribution-specific package and bug-tracker resources for Arch,
      Debian, Fedora, Gentoo, Mageia, Ubuntu, and openSUSE, reflecting how distribution
      integration is part of the project surface.
    - >
      The supplied package-manager facts list systemd-related packages across Homebrew,
      Alpine, Debian, Ubuntu, Fedora/dnf, Nix, Arch, and openSUSE, though individual
      distributions may split libraries, NSS modules, busctl, or the full service
      manager into different package names.
  package-nerd-significance:
    - >
      systemd is package-manager significant because it defines a large amount of Linux
      service packaging convention. Packagers care about unit ordering, service
      hardening, socket activation, tmpfiles, user creation, journal behavior, and
      distro policy.
    - >
      It also remains culturally important because it turned service management into a
      shared Linux platform API, so installing even unrelated packages often means
      installing or interacting with systemd units.
  project-history:
    - >
      The official repository describes systemd as the System and Service Manager and
      points to systemd.io and the freedesktop.org manual set for documentation. Its v1
      tag is dated 2010-07-07 and was tagged by Lennart Poettering.
    - >
      The project expanded well beyond an init replacement. The Homebrew source facts
      list commands such as systemctl, journalctl, loginctl, timedatectl,
      systemd-analyze, systemd-run, systemd-nspawn, networkctl, resolvectl, and many
      service-management helpers.
  related-projects:
    - >
      systemd.io documents related APIs and bindings around the journal, sd-bus, socket
      activation, and systemd D-Bus interfaces, showing its role as both a service
      manager and a platform for other packages.
  sources:
    - >
      https://api.github.com/repos/systemd/systemd/git/tags/21466a73743cfbdef66d79248ab2944b91d94ac8
    - https://github.com/systemd/systemd
    - https://systemd.io/
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      systemd is the Linux system and service manager around which many modern
      distribution boot, service, logging, login, network, timer, and unit-management
      workflows are organized.
  timeline:
    - '2010: systemd v1 tag dated 2010-07-07.'
    - >
      2011-2014: systemd.io lists early user and administrator presentations at FOSDEM
      and linux.conf.au.
    - >
      2026: The official GitHub repository lists v261.1 as a current stable release on
      2026-06-26.
  usage:
    - >
      Most users encounter systemd through systemctl for units, journalctl for logs,
      systemd-analyze for boot analysis, timers as cron-like scheduled jobs, and service
      unit files installed by other packages.
    - >
      For CLI culture, systemd changed what it means to package a daemon on Linux: a
      package often ships unit files, tmpfiles rules, sysusers rules, presets, socket
      units, timer units, and journal integration rather than only an init script.
category: system
package-manager:
  apk: busctl
  brew: systemd
  debian: libnss-myhostname
  dnf: systemd
  nix: systemd
  pacman: systemd
  ubuntu: libnss-myhostname
  zypper: libsystemd0
package-manager-url: https://formulae.brew.sh/formula/systemd
license: >
  LGPL-2.1-or-later AND GPL-2.0-or-later AND CC0-1.0 AND LGPL-2.0-or-later AND MIT AND
  MIT-0 AND LicenseRef-Homebrew-public-domain AND (LGPL-2.0-or-later WITH
  Linux-syscall-note) AND (GPL-1.0-or-later WITH Linux-syscall-note) AND
  (GPL-2.0-or-later WITH Linux-syscall-note) AND (GPL-2.0-only WITH Linux-syscall-note)
  AND (BSD-3-Clause OR (GPL-2.0-only WITH Linux-syscall-note)) AND (MIT OR (GPL-2.0-only
  WITH Linux-syscall-note)) AND (MIT OR (GPL-2.0-or-later WITH Linux-syscall-note)) AND
  (GPL-2.0-only OR BSD-2-Clause)
