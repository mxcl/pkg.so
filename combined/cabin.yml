id: brew:cabin
display-name: Cabin
homepage: https://cabinpkg.com
repo: https://github.com/cabinpkg/cabin
docs:
  - https://cabinpkg.com/docs
config-file-location:
  linux:
    - $CABIN_CONFIG_HOME/config.toml
    - $XDG_CONFIG_HOME/cabin/config.toml
    - ~/.config/cabin/config.toml
    - <workspace-root>/.cabin/config.toml
    - <package-root>/.cabin/config.toml
    - $CABIN_CONFIG
  macos:
    - $CABIN_CONFIG_HOME/config.toml
    - ~/Library/Application Support/cabin/config.toml
    - <workspace-root>/.cabin/config.toml
    - <package-root>/.cabin/config.toml
    - $CABIN_CONFIG
  windows:
    - $CABIN_CONFIG_HOME/config.toml
    - '%APPDATA%\cabin\config.toml'
    - <workspace-root>\.cabin\config.toml
    - <package-root>\.cabin\config.toml
    - '%CABIN_CONFIG%'
credentials-file-location:
  unix:
    - $CABIN_CONFIG_HOME/credentials.toml
    - $XDG_CONFIG_HOME/cabin/credentials.toml
    - ~/.config/cabin/credentials.toml
  windows:
    - '%CABIN_CONFIG_HOME%\credentials.toml'
    - '%APPDATA%\cabin\credentials.toml'
history:
  adoption-history:
    - >
      Cabin's public adoption appears early and niche. Its own README carries a pre-1.0
      caution, while Homebrew and Nix packaging show that the CLI has become installable
      through normal developer package channels.
    - >
      The release history shows active 2024-2026 development, with 0.10.1 in September
      2024, 0.13.0 in July 2025, and 0.16.0 in June 2026. Recent releases emphasize
      manifest changes, workspaces, language standards, testing, docs, release
      automation, and distribution packaging.
  package-nerd-significance:
    - >
      For package nerds, Cabin is interesting because it asks what Cargo-like ergonomics
      look like for C and C++ without pretending C/C++ has Rust's compilation model. It
      packages conventions, lockfiles, manifests, workspaces, and registry ideas around
      languages that historically outsourced those choices to build systems and
      distribution maintainers.
    - >
      It is also a compact example of Rust tooling being used to build developer
      infrastructure for non-Rust ecosystems.
  project-history:
    - >
      Cabin's README describes it as an opinionated C/C++ build tool inspired by Cargo,
      but the official docs stress that it is not Cargo-compatible. It borrows Cargo
      vocabulary where it fits and deliberately diverges where C/C++ build semantics
      require separate treatment.
    - >
      The project was initially funded by Japan's MITOU IT Program, according to the
      README sponsorship section, with additional support from Shigeru Urushibara of UL
      Systems. That funding history explains why a niche C/C++ build tool has a fairly
      complete documentation surface despite being pre-1.0.
    - >
      The 2026 documentation covers manifests, configuration discovery, workspaces,
      dependencies, lockfiles, source artifacts, testing, compiler wrappers, registry
      design, and CLI distribution artifacts, indicating a broad attempt to model
      package-manager behavior rather than just invoke a compiler.
  related-projects:
    - Cargo is the explicit interface inspiration, though Cabin is not Cargo-compatible.
    - CMake, Meson, Make, and Ninja are adjacent C/C++ build-system reference points.
    - Rust is relevant because Cabin itself is written in Rust.
  sources:
    - https://cabinpkg.com/docs/
    - https://github.com/cabinpkg/cabin
    - https://github.com/cabinpkg/cabin/releases
    - https://www.ipa.go.jp/en/it-talents/mitou/index.html
    - https://www.ipa.go.jp/jinzai/mitou/it/2018/gaiyou_t-2.html
  summary:
    - >
      Cabin is a pre-1.0, Cargo-inspired package manager and build system for
      conventional C and C++ projects. It is written in Rust and aims to reduce C/C++
      build boilerplate with predictable project structure and declarative metadata.
  timeline:
    - '2018: Cabin was initially funded by the MITOU IT Program.'
    - '2024-09-06: Cabin 0.10.1 was released.'
    - '2025-07-25: Cabin 0.13.0 was released.'
    - '2026-06-01: Cabin 0.14.0 was released.'
    - '2026-06-09: Cabin 0.15.0 was released.'
    - '2026-06-26: Cabin 0.16.0 was released.'
  usage:
    - >
      Users run cabin new or cabin init to scaffold a package, cabin build to build it,
      cabin run to execute it, and cabin metadata, tree, or explain to inspect resolved
      state. A minimal cabin.toml declares package metadata and targets such as
      executables or libraries.
    - >
      Cabin targets mixed C/C++ projects where CC and CXX remain independent, C and C++
      standards stay separate, and the resolved build configuration gets a deterministic
      fingerprint.
related-packages:
  - id: brew:ninja
    reason: >
      Ninja is Cabin's generated low-level build backend, and Cabin explicitly supports
      invoking Ninja directly against its generated build.ninja files for incremental
      rebuilds.
    rel: adjacent_workflow
    sources:
      - https://cabinpkg.com/docs/toolchains/
      - https://ninja-build.org/manual
  - id: brew:ccache
    reason: >
      Configure ccache as Cabin's compiler wrapper when you want repeated C and C++
      builds to reuse cached compilation results; Cabin's official configuration guide
      provides this exact workflow.
    rel: adjacent_workflow
    sources:
      - https://cabinpkg.com/docs/config/
      - https://ccache.dev/documentation.html
category: developer-tools
package-manager:
  brew: cabin
  nix: cabin
package-manager-url: https://formulae.brew.sh/formula/cabin
license: Apache-2.0
tags:
  - build-system
  - cli
  - cpp
  - developer-tools
  - package-manager
description: Package manager and build system for C/C++
executables:
  - cabin
provenance:
  formula: cabin
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
