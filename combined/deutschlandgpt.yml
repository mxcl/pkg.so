history:
  adoption-history:
    - >
      DeutschlandGPT's official history reports that the platform grew to serve more
      than one thousand organizations during 2025–2026 and formed a partnership with
      T-Systems. Native desktop clients extend the same account, conversations,
      projects, custom assistants, and integrations beyond the browser.
  package-nerd-significance:
    - >
      DeutschlandGPT represents a class of regionally operated AI clients whose
      differentiator is deployment jurisdiction, organizational controls, and European
      data governance rather than ownership of a single foundation model.
    - >
      The desktop package wraps a hosted multi-model platform in a conventional native
      client and adds operating-system features such as global quick input, dictation,
      notifications, local file workflows, and coding sessions.
  project-history:
    - >
      DeutschlandGPT grew from Titanom Technologies, founded in 2020 to develop
      AI-assisted educational technology. According to the company's official history,
      demand for GDPR-oriented organizational AI led to the DeutschlandGPT concept in
      2023 and the platform's public launch in 2024.
    - >
      The service subsequently expanded from chat into projects, custom assistants,
      integrations, workflows, an OpenAI-compatible API, and native applications for
      macOS, Windows, and Linux.
  related-projects:
    - >
      The desktop application is a native client for the DeutschlandGPT hosted platform;
      it shares accounts and data with the browser product and complements the service's
      Platform API, workflows, integrations, and mobile clients.
  sources:
    - https://docs.deutschlandgpt.de/
    - https://docs.deutschlandgpt.de/desktop
    - https://www.deutschlandgpt.de/ueber-uns
  summary:
    - >
      DeutschlandGPT is a German-operated generative-AI platform and desktop client for
      individuals, companies, and public-sector organizations. It combines chat across
      multiple models with projects, integrations, workflows, and organization controls.
  timeline:
    - '2020: Titanom Technologies was founded around AI-assisted education.'
    - '2023: Demand for GDPR-oriented organizational AI led to the DeutschlandGPT concept.'
    - '2024: DeutschlandGPT launched as a sovereign AI platform.'
    - >
      2025–2026: The company reported broader organizational adoption, certification,
      and a T-Systems partnership.
  usage:
    - >
      Users sign in through the browser and return to the native client, where they can
      continue chats, work with projects and custom assistants, dictate text, access
      shared folders, and use coding workflows with files, a terminal, and Git.
    - >
      The official desktop documentation says access tokens are stored in the operating
      system's protected credential store—Keychain on macOS, Credential Manager on
      Windows, or Secret Service on Linux—not in a plain credentials file. No stable
      user-editable configuration-file path is documented.
