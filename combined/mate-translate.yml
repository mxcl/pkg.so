history:
  adoption-history:
    - >
      Gikken describes Mate as a cross-platform application for macOS, iOS, and
      browsers, with synchronized translation history and saved phrases. The official
      site reports a large user base, though that marketing claim is not independently
      evaluated here.
  package-nerd-significance:
    - >
      Mate is notable to Mac package users as a menu-bar translation utility distributed
      as a Homebrew cask rather than a command-line translation package. Its appeal is
      OS-level workflow integration and cross-device synchronization.
  project-history:
    - >
      Mate developed as Gikken's integrated translation product spanning desktop,
      mobile, and browser environments. The official material does not provide a
      sufficiently precise release chronology.
  related-projects:
    - Mate browser extensions
    - Mate for iOS
  sources:
    - https://gikken.co/mate-translate/mac
    - https://help.gikken.co/hc/en-us/sections/360003340360-General
    - source_facts.package-manager
  summary:
    - >
      Mate Translate is Gikken's cross-platform translation application. It translates
      selected text and web content, supports 103 languages, and integrates with the
      macOS menu bar and browser workflows.
  timeline:
    - >
      Current product generation: Mate is available for macOS, iOS, and browsers with
      synchronized history and phrasebooks.
  usage:
    - >
      Users invoke Mate from the macOS menu bar or a shortcut to translate text without
      leaving the current application. The product also supports pronunciation,
      phonetics, phrasebooks, browser-page translation, and synchronized translation
      history.
