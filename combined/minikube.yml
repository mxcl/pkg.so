id: brew:minikube
display-name: minikube
homepage: https://minikube.sigs.k8s.io/
repo: https://github.com/kubernetes/minikube
docs:
  - https://minikube.sigs.k8s.io/docs
config-file-location:
  unix: ~/.minikube/config/config.json
credentials-file-location:
  unix:
    - ~/.minikube/profiles/<profile>/client.crt
    - ~/.minikube/profiles/<profile>/client.key
  windows:
    - '%USERPROFILE%\.minikube\profiles\<profile>\client.crt'
    - '%USERPROFILE%\.minikube\profiles\<profile>\client.key'
history:
  project-history:
    - >
      Technically, minikube started from the single-node VM model that made Kubernetes
      approachable before developers had access to cloud clusters. VirtualBox was the
      original and widely documented driver, but the tool expanded into a driver
      framework that can run Kubernetes through VMs, containers, bare metal, or remote
      SSH depending on host OS and user needs. That driver model is one of minikube's
      main differences from narrower tools such as kind: minikube is a general local
      Kubernetes workstation, not only a Kubernetes-in-Docker test cluster.
  sources:
    - https://discuss.kubernetes.io/t/minikube-v1-0-0-has-been-released/5702
    - https://github.com/kubernetes/minikube
    - >
      https://kubernetes.io/blog/2019/03/28/running-kubernetes-locally-on-linux-with-minikube-now-with-kubernetes-1.14-support/
    - https://kubernetes.io/docs/tutorials/kubernetes-basics/create-cluster/cluster-intro/
    - https://minikube.sigs.k8s.io/docs/drivers/
    - https://minikube.sigs.k8s.io/docs/tutorials/setup_minikube_in_github_actions/
  summary:
    - >
      minikube grew inside the Kubernetes project as the standard local-development
      distribution for running Kubernetes on a laptop or workstation. Its core promise
      is a local Kubernetes cluster on macOS, Linux, or Windows, with a CLI that handles
      lifecycle actions such as start, stop, status, and delete. The project reached its
      1.0.0 milestone in March 2019 alongside Kubernetes 1.14 support, with release
      notes emphasizing fast local development and broad support for Kubernetes features
      that fit on a single-machine cluster.
  usage:
    - >
      minikube became a Kubernetes teaching, tutorial, and CI fixture because it gives
      users a real Kubernetes API server with a short feedback loop. Kubernetes
      documentation uses it for cluster-introduction tutorials, the Kubernetes blog
      described it as the most popular community-built local Kubernetes option on Linux,
      and the minikube docs include workflows for GitHub Actions. In practice,
      developers use it to test manifests, Helm charts, ingress, storage, add-ons, and
      application deployments before moving work to shared or production clusters.
related-packages:
  - id: brew:kind
    reason: >
      Choose kind for lightweight Kubernetes clusters whose nodes are containers and
      when testing Kubernetes itself or running CI is the primary goal; minikube offers
      a broader choice of VM, container, and bare-metal drivers.
    rel: alternative
    sources:
      - https://kind.sigs.k8s.io/
      - https://minikube.sigs.k8s.io/docs/drivers/
      - https://kubernetes.io/docs/tasks/tools/
  - id: brew:k3d
    reason: >
      Choose k3d when you specifically want the lightweight k3s distribution running in
      Docker; minikube instead runs upstream Kubernetes with a wider driver and runtime
      matrix.
    rel: alternative
    sources:
      - https://k3d.io/
      - https://minikube.sigs.k8s.io/docs/
  - id: brew:kubernetes-cli
    reason: >
      kubectl is the standard client used to inspect and operate the Kubernetes cluster
      that minikube creates, with minikube automatically producing the required
      kubeconfig context.
    rel: adjacent_workflow
    sources:
      - https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/
      - https://minikube.sigs.k8s.io/docs/commands/
category: developer-tools
package-manager:
  apk: docker-machine-driver-kvm2
  brew: minikube
  chocolatey: Minikube
  macports: minikube
  nix: minikube
  pacman: minikube
  scoop: main/minikube
  winget: Kubernetes.minikube
  zypper: minikube
package-manager-url: https://formulae.brew.sh/formula/minikube
license: Apache-2.0
tags:
  - cli
  - containers
  - kubernetes
  - local-cluster
description: Run a Kubernetes cluster locally
executables:
  - minikube
provenance:
  formula: minikube
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
