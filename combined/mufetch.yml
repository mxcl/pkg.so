id: brew:mufetch
display-name: mufetch
homepage: https://github.com/ashish0kumar/mufetch
repo: https://github.com/ashish0kumar/mufetch
docs:
  - https://github.com/ashish0kumar/mufetch#readme
config-file-location:
  unix: ~/.config/mufetch/config.yaml
credentials-file-location:
  unix: ~/.config/mufetch/config.yaml
history:
  project-history:
    - >
      The tool's role is presentation rather than playback. Its README and Terminal
      Trove listing describe terminal display of album cover art, artist photos, track,
      album, and artist metadata, clickable Spotify links, responsive image sizing, and
      search commands for tracks, albums, and artists. It uses Spotify credentials
      supplied through environment variables or configuration, so its practical use is
      as a terminal dashboard for listeners who want music context without leaving the
      shell.
  sources:
    - https://api.github.com/repos/ashish0kumar/mufetch
    - https://formulae.brew.sh/formula/mufetch
    - https://github.com/ashish0kumar/mufetch
    - https://terminaltrove.com/mufetch/
  summary:
    - >
      mufetch is a small Go command-line tool that applies the neofetch-style terminal
      information layout to music metadata. The GitHub repository by ashish0kumar was
      created in 2025 and describes the project as a "Neofetch-style CLI for music".
  usage:
    - >
      As a package, mufetch occupies a narrow aesthetic CLI niche alongside fetch-style
      tools: it is not a general media player, but a terminal-friendly metadata and
      artwork display for music.
related-packages:
  - id: brew:chafa
    reason: >
      Install Chafa alongside mufetch for the higher-quality terminal artwork renderer
      that mufetch's official setup guide recommends while retaining its built-in
      fallback.
    rel: adjacent_workflow
    sources:
      - https://github.com/ashish0kumar/mufetch#enhanced-image-quality
      - https://hpjansson.org/chafa/
category: media
package-manager:
  brew: mufetch
  nix: mufetch
package-manager-url: https://formulae.brew.sh/formula/mufetch
license: MIT
tags:
  - cli
  - music
  - neofetch
  - terminal
description: Neofetch-style music cli
executables:
  - mufetch
provenance:
  formula: mufetch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
