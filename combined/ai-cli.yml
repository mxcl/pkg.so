id: brew:ai-cli
display-name: ai-cli
homepage: https://ai-cli.dev
repo: https://github.com/vercel-labs/ai-cli
docs:
  - https://ai-cli.dev/docs
  - https://ai-cli.dev/docs/configuration
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ai-cli is distributed through npm and Homebrew and is designed for both
      interactive terminal use and agent automation. Its official documentation
      emphasizes predictable outputs, JSON metadata, pipelines, and access to multiple
      model providers through Vercel AI Gateway.
  package-nerd-significance:
    - >
      The package brings multimodal generation into Unix-style pipelines: text can flow
      through standard output, while generated media can be saved or streamed as binary
      data. Its combination of multi-model execution, machine-readable metadata, and
      terminal previews makes it notable as an agent-oriented command-line package.
  project-history:
    - >
      ai-cli is an open-source Vercel Labs project built with the Vercel AI SDK and AI
      Gateway. It packages text, image, video, speech, transcription, model discovery,
      and multi-model comparison behind one `ai` executable.
  related-projects:
    - Vercel AI SDK supplies the model-facing application toolkit.
    - Vercel AI Gateway provides unified access to supported model providers.
  sources:
    - https://ai-cli.dev/docs
    - https://ai-cli.dev/docs/configuration
    - https://github.com/vercel-labs/ai-cli#readme
  summary:
    - >
      ai-cli is a multimodal generative-AI command-line client maintained by Vercel
      Labs. It generates text, images, video, and audio and supports composable
      stdin/stdout workflows.
  timeline:
    - >
      2026: Official repository and documentation describe a public multimodal CLI
      distributed through npm and Homebrew.
  usage:
    - >
      Users run subcommands such as `ai text`, `ai image`, `ai video`, `ai audio speak`,
      and `ai audio transcribe`. Authentication and defaults are supplied entirely
      through environment variables; the official configuration guide explicitly states
      that there is no config file.
related-packages: []
category: ai
package-manager:
  brew: ai-cli
  winget: 360.NamiAI
package-manager-url: https://formulae.brew.sh/formula/ai-cli
license: Apache-2.0
