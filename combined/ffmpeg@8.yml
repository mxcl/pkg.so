id: brew:ffmpeg@8
display-name: FFmpeg 8
homepage: https://ffmpeg.org/
repo: https://git.ffmpeg.org/ffmpeg.git
docs:
  - https://ffmpeg.org/documentation.html
  - https://ffmpeg.org/ffmpeg.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FFmpeg became a foundational multimedia component used both directly through its
      command-line programs and indirectly through applications built on its libraries.
      The official project describes it as a leading, highly portable multimedia
      framework and notes its role in many multimedia projects.
  package-nerd-significance:
    - >
      FFmpeg is a package-manager staple because one installation exposes a large codec,
      container, filtering, capture, playback, and streaming toolbox. Packaging choices
      matter unusually strongly: optional libraries and build flags determine codec
      support, hardware acceleration, and licensing characteristics.
  project-history:
    - >
      FFmpeg developed as an experimental, developer-driven free-software multimedia
      project. Its distribution combines the ffmpeg, ffplay, and ffprobe programs with
      libraries including libavcodec, libavformat, libavfilter, libavutil, libswscale,
      and libswresample.
    - >
      The project maintains its primary source in Git and operates the FATE
      regression-testing system across numerous operating systems, architectures, and
      build configurations.
  related-projects:
    - >
      The distribution includes ffplay and ffprobe alongside ffmpeg, plus reusable
      libraries such as libavcodec and libavformat.
    - >
      The official download page identifies GitHub's FFmpeg repository as a mirror
      rather than the primary repository.
  sources:
    - https://ffmpeg.org/about.html
    - https://ffmpeg.org/documentation.html
    - https://ffmpeg.org/download.html
  summary:
    - >
      FFmpeg is a portable open-source multimedia framework and command-line toolkit for
      transcoding, playback, inspection, capture, filtering, and streaming.
  timeline:
    - >
      The project established a broad command-line and library ecosystem for multimedia
      processing.
    - Git became the development system for the primary FFmpeg source repository.
  usage:
    - >
      Users commonly invoke ffmpeg for media conversion, filtering, capture, and
      streaming; ffprobe for machine-readable media inspection; and ffplay for
      lightweight playback. Developers also link against the component libraries.
    - >
      The exact formats and acceleration features available can depend on how a package
      was compiled, so users troubleshooting codec support commonly inspect the
      installed build configuration.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose the unversioned formula when you prefer Homebrew's current FFmpeg release
      over a pinned 8.x line.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/ffmpeg
      - https://formulae.brew.sh/formula/ffmpeg@8
  - id: brew:ffmpeg-full
    reason: >
      Choose ffmpeg-full for a broader collection of optional codec and integration
      libraries than the regular formula supplies.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/ffmpeg
  - id: brew:ffms2
    reason: >
      FFMS2 complements FFmpeg with persistent indexing and frame-oriented access for
      Avisynth, VapourSynth, and library consumers.
    rel: adjacent_workflow
    sources:
      - https://github.com/FFMS/ffms2
      - https://github.com/FFMS/ffms2/blob/master/doc/ffms2-api.md
      - https://formulae.brew.sh/formula/ffms2
