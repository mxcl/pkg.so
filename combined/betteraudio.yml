id: cask:betteraudio
display-name: BetterAudio
homepage: https://betteraudio.pro/
repo: https://github.com/rokartur/BetterAudio
docs:
  - https://betteraudio.pro/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      BetterAudio is distributed to macOS users through a Homebrew cask according to the
      supplied package metadata. The project offers core functionality without charge
      and uses an optional support license for additional power-user features.
  package-nerd-significance:
    - >
      It occupies the utility niche between macOS's system-wide volume controls and
      professional audio-routing software, providing package-manager-installable
      per-application controls and equalization.
  project-history:
    - >
      BetterAudio was developed as a macOS menu-bar audio utility focused on finer
      control than the operating system's standard sound interface. Its public project
      materials emphasize per-application volume, muting, equalization, device control,
      and media-key behavior.
  related-projects:
    - macOS Core Audio
    - Raycast
  sources:
    - https://betteraudio.pro/
    - https://github.com/rokartur/BetterAudio
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      BetterAudio is a macOS audio-control application for managing volume,
      equalization, muting, and audio devices on a per-application basis.
  timeline:
    - >
      Current generation: Available as a macOS application with free core features and
      optional licensed power-user functionality.
  usage:
    - >
      BetterAudio runs as a Mac utility and is used to adjust individual applications
      independently, apply equalization, select audio devices, and refine media-key or
      muting behavior.
category: media
