id: brew:mp3check
display-name: mp3check
homepage: https://code.google.com/archive/p/mp3check/
repo: https://code.google.com/archive/p/mp3check/source
docs:
  - https://code.google.com/archive/p/mp3check
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The available package history is sparse. Debian notes that its manpage was written
      for Debian because the original program did not ship one, and the upstream
      homepage points to the archived Google Code project. A Fedora/openSUSE spec for
      version 0.8.7 names Johannes Overmann and Klaus Kettner as authors, while Debian
      packages the same upstream version family in its sound section.
  sources:
    - https://code.google.com/archive/p/mp3check/
    - >
      https://download.copr.fedorainfracloud.org/results/sergiomb/clonezilla/fedora-42-x86_64/07744780-mp3check/mp3check.spec
    - https://formulae.brew.sh/formula/mp3check
    - https://manpages.ubuntu.com/manpages/stonking/man1/mp3check.1.html
    - https://packages.debian.org/sid/mp3check
  summary:
    - >
      mp3check is a command-line validator for MP3 file structure. Debian's manpage
      describes it as a program that checks MP3 files for consistency, prints errors and
      warnings, lists stream attributes, supports MPEG layers 1, 2, and 3 for MPEG 1.0
      and 2.0, and can perform CRC checks for layer 3. Its options cover listing
      headers, compact machine-readable output, anomaly checks, CRC/header checks, and
      cautious repair actions such as cutting junk at the start or end of a file.
  usage:
    - >
      In practice, mp3check belongs to the MP3 archive-maintenance niche: scanning
      collections for truncated, malformed, or inconsistent files before archiving,
      copying, or serving them. It overlaps with tools such as mp3val and other
      validators, but its package-manager footprint keeps it useful for scripted checks
      where a small CLI is easier to automate than a GUI repair tool.
related-packages:
  - id: brew:mp3val
    reason: >
      Choose MP3val when you need the same command-line integrity checking plus
      documented repair of most detected MPEG-audio problems and awareness of common tag
      formats.
    rel: alternative
    sources:
      - https://code.google.com/archive/p/mp3check/
      - https://mp3val.sourceforge.net/
      - https://mp3val.sourceforge.net/docs/manual.html
category: media
package-manager:
  brew: mp3check
  debian: mp3check
  ubuntu: mp3check
package-manager-url: https://formulae.brew.sh/formula/mp3check
license: GPL-2.0-or-later
tags:
  - audio
  - cli
  - consistency-checker
  - mp3
  - validation
description: Tool to check mp3 files for consistency
executables:
  - mp3check
provenance:
  formula: mp3check
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
