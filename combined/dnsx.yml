id: brew:dnsx
display-name: dnsx
homepage: https://github.com/projectdiscovery/dnsx
repo: https://github.com/projectdiscovery/dnsx
docs:
  - https://docs.projectdiscovery.io/opensource/dnsx/overview
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dnsx became part of the common ProjectDiscovery reconnaissance workflow: subdomain
      inputs from one tool can be resolved and filtered through dnsx, then passed onward
      to HTTP probing or vulnerability scanning tools.
    - >
      Packaging in Homebrew, Fedora, Nix, and Kali reflects adoption by both developer
      workstations and security-testing distributions.
  package-nerd-significance:
    - >
      dnsx matters less as a novel DNS protocol implementation and more as a modern
      packaging example: a single static-ish Go CLI designed to be chained with a
      security-tool ecosystem.
    - >
      The package shows how DNS utilities have moved from administrator-only
      troubleshooting toward high-volume reconnaissance and asset inventory workflows.
  project-history:
    - >
      The public release line starts with v1.0.0 in November 2020, and subsequent
      releases kept dnsx in the ProjectDiscovery toolkit alongside tools such as
      subfinder, httpx, naabu, nuclei, and shuffledns.
    - >
      The documentation and README frame dnsx as a retryabledns-based toolkit for
      multiple DNS query types, custom resolvers, brute-force resolution, and wildcard
      handling.
  related-projects:
    - >
      ProjectDiscovery siblings include subfinder for subdomain discovery, httpx for
      HTTP probing, naabu for port scanning, nuclei for template-based scanning, and
      shuffledns for mass DNS resolution with wildcard filtering.
    - dnsx is also related to retryabledns, the Go library it uses for resilient DNS probing.
  sources:
    - https://docs.projectdiscovery.io/opensource/dnsx/overview
    - https://docs.projectdiscovery.io/opensource/dnsx/usage
    - https://docs.projectdiscovery.io/opensource/dnsx/running
    - https://github.com/projectdiscovery/dnsx
    - https://github.com/projectdiscovery/dnsx/releases
    - https://www.kali.org/tools/dnsx/
    - https://formulae.brew.sh/formula/dnsx
  summary:
    - >
      dnsx is ProjectDiscovery's fast DNS query and resolution CLI, built for
      reconnaissance pipelines and bulk probing rather than interactive DNS
      administration.
    - >
      Its history is mainly the history of ProjectDiscovery standardizing bug-bounty and
      attack-surface tooling around composable Go CLIs that stream data through stdin
      and stdout.
  timeline:
    - '2020: dnsx v1.0.0 was released as a ProjectDiscovery DNS toolkit.'
    - >
      2021-2023: v1.0.x and v1.1.x releases broadened the tool while it became a regular
      component of ProjectDiscovery reconnaissance pipelines.
    - '2024: v1.2.0 and later releases continued the Go module and packaging lifecycle.'
    - '2025: v1.2.3 release activity shows the project still being maintained.'
  usage:
    - >
      dnsx is commonly used to resolve lists of domains, query specific DNS record
      types, use custom resolver pools, brute-force names, and remove wildcard DNS noise
      from large candidate sets.
    - Its stdin/stdout design makes it useful in shell pipelines and CI-style scanning jobs.
related-packages:
  - id: brew:subfinder
    reason: >
      Run subfinder first for passive subdomain discovery, then pipe its output into
      dnsx to resolve the candidates and retain active hostnames, exactly as
      ProjectDiscovery's dnsx guide demonstrates.
    rel: adjacent_workflow
    sources:
      - https://docs.projectdiscovery.io/opensource/dnsx/running
      - https://docs.projectdiscovery.io/opensource/subfinder/overview
  - id: brew:shuffledns
    reason: >
      Choose shuffleDNS when the job centers on MassDNS-backed, high-volume active brute
      forcing and wildcard filtering; choose dnsx for broader DNS record querying and
      general-purpose pipeline use.
    rel: alternative
    sources:
      - https://github.com/projectdiscovery/shuffledns
      - https://docs.projectdiscovery.io/opensource/dnsx/running
category: networking
package-manager:
  brew: dnsx
  dnf: dnsx
  nix: dnsx
package-manager-url: https://formulae.brew.sh/formula/dnsx
license: MIT
tags:
  - cli
  - dns
  - dns-query
  - reconnaissance
description: DNS query and resolution tool
executables:
  - dnsx
provenance:
  formula: dnsx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
