id: brew:amp
display-name: Amp
homepage: https://amp.rs
repo: https://github.com/jmacdonald/amp
docs:
  - https://amp.rs/docs
  - https://amp.rs/docs/configuration
  - https://github.com/jmacdonald/amp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Amp's adoption has been niche rather than mass-market: it is a
      package-manager-distributed editor for users interested in Rust command-line
      software and Vim-like interaction without carrying Vim's full compatibility
      surface.
    - >
      The supplied package facts show availability through Homebrew, MacPorts, Nix, and
      zypper, which is the typical adoption path for a small terminal editor: easy
      enough to install from a package manager, but still mostly discovered by users
      looking for lightweight editor experiments.
  package-nerd-significance:
    - >
      Amp is interesting to package nerds as an example of the mid-2010s Rust CLI wave:
      a familiar Unix tool category rebuilt as a single cargo-built binary, then
      surfaced through multiple OS package sets.
    - >
      Its split between the editor and the `scribe` crate is also notable because it
      turns editor infrastructure into reusable Rust components rather than burying all
      of it in one executable.
  project-history:
    - >
      The public GitHub repository was created in February 2015. The project is written
      in Rust and separates substantial editor internals, including data structures,
      syntax highlighting, and workspace management, into the related `scribe` crate.
    - >
      Amp's documentation presents the editor as a terminal-native application with
      modal editing, file finding, system clipboard support, preferences, keymaps, and
      syntax configuration. The latest GitHub release observed for this batch is 0.7.1,
      published in September 2024.
  related-projects:
    - 'Vim and Vi: the editing model Amp explicitly cites as inspiration.'
    - "scribe: Amp's related Rust crate for editor internals."
    - "Rust: the implementation language and ecosystem that shaped Amp's packaging story."
  sources:
    - https://amp.rs/docs
    - https://amp.rs/docs/configuration
    - https://api.github.com/repos/jmacdonald/amp
    - https://api.github.com/repos/jmacdonald/amp/releases/latest
    - https://github.com/jmacdonald/amp
    - https://github.com/jmacdonald/amp#readme
    - source_facts.package-manager
  summary:
    - >
      Amp is a Rust terminal text editor inspired by Vi and Vim. Its README says it aims
      to keep Vim's core interaction model, simplify it, and bundle the essential
      features expected from a modern terminal editor.
  timeline:
    - '2015: GitHub repository created.'
    - '2015 onward: Amp develops as a Rust terminal editor inspired by Vi/Vim.'
    - '2024: Release 0.7.1 published.'
  usage:
    - >
      Users run the `amp` executable in a terminal. The official docs describe
      preferences as a YAML file in a platform-dependent configuration folder and
      recommend using the built-in `preferences::edit` command to open it and reveal its
      path.
    - >
      The practical use case is quick terminal editing with modal commands, file
      navigation, syntax highlighting, and configurable keymaps. It is not presented as
      an IDE; it is a compact editor with enough modern conveniences to stand on its
      own.
related-packages:
  - id: brew:vim
    reason: >
      Choose Vim when broad vi compatibility, extensive scripting, and a mature plug-in
      ecosystem matter more than Amp's deliberately simpler bundled experience.
    rel: alternative
    sources:
      - https://amp.rs/docs/
      - https://www.vim.org/about.php
  - id: brew:tmux
    reason: >
      Amp explicitly recommends tmux for split-pane terminal workflows because split
      panes are intentionally outside Amp's scope.
    rel: adjacent_workflow
    sources:
      - https://amp.rs/docs/
      - https://github.com/tmux/tmux/wiki
  - id: brew:yazi
    reason: >
      Amp's configuration guide documents launching Yazi as an external file manager and
      reading its chooser file to open selected paths as buffers.
    rel: adjacent_workflow
    sources:
      - https://amp.rs/docs/configuration/
      - https://yazi-rs.github.io/docs/quick-start
category: productivity
package-manager:
  brew: amp
  macports: amp
  nix: amp
  zypper: amp
package-manager-url: https://formulae.brew.sh/formula/amp
license: GPL-3.0-or-later
tags:
  - cli
  - rust
  - terminal
  - text-editor
description: Text editor for your terminal
executables:
  - amp
provenance:
  formula: amp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
