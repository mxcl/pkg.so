id: brew:libu2f-server
display-name: libu2f-server
homepage: https://developers.yubico.com/libu2f-server/
repo: https://github.com/Yubico/libu2f-server
docs:
  - https://developers.yubico.com/libu2f-server
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The library belongs to the first wave of open-source U2F building blocks around
      the FIDO U2F 1.0 and 1.2 specifications. It was useful when web services and
      system integrators were adding hardware second-factor support before WebAuthn and
      FIDO2 became the dominant developer-facing APIs.
    - >
      Yubico later moved the U2F libraries into maintenance and end-of-life status.
      Yubico's EOL page lists libu2f-server with a March 16, 2020 announcement date,
      March 16, 2021 end-of-life date, and libfido2 as the recommended alternative.
  package-nerd-significance:
    - >
      libu2f-server is a neat package-history marker for the transition from
      U2F-specific libraries to FIDO2/WebAuthn stacks. It also shows the older split
      between host-side and server-side U2F packages that many distributions carried
      before libfido2 consolidated U2F and FIDO2 support.
  project-history:
    - >
      Yubico built libu2f-server for relying-party applications that needed to generate
      U2F registration and authentication JSON challenges and verify the cryptographic
      responses from U2F devices. Its README pairs it with libu2f-host, the host-side
      library and tool for talking to U2F authenticators.
    - >
      The project followed semantic versioning and shipped a u2f-server
      debugging/testing utility. Its README also documented an important
      attestation-certificate limitation: the library did not validate the full X.509
      attestation chain at registration time.
  related-projects:
    - libu2f-host is the matching host-side Yubico U2F library.
    - libfido2 is Yubico's recommended successor with U2F and FIDO2 support.
    - >
      FIDO2 and WebAuthn are the broader successor standards that subsumed most U2F
      developer workflows.
  sources:
    - https://developers.yubico.com/libu2f-server/
    - >
      https://fidoalliance.org/specs/fido-u2f-v1.0-ps-20141009/fido-u2f-overview-ps-20141009.html
    - https://github.com/Yubico/libu2f-server
    - https://www.yubico.com/support/terms-conditions/yubico-end-of-life-policy/eol-products/
  summary:
    - >
      libu2f-server is Yubico's C implementation of the server-side Universal 2nd Factor
      protocol, providing APIs and a small command-line tool for U2F registration and
      authentication flows.
  timeline:
    - >
      2014: FIDO U2F 1.0 Proposed Standard defined the protocol family libu2f-server
      implemented.
    - '2017: FIDO U2F 1.2 Proposed Standard refined the U2F specifications.'
    - '2020: Yubico announced end-of-life status for libu2f-server on March 16, 2020.'
    - "2021: Yubico's listed end-of-life date for libu2f-server was March 16, 2021."
    - '2026: The GitHub repository was archived on June 3, 2026.'
  usage:
    - >
      Applications used the library to create registration and authentication challenges
      and verify responses. Operators and developers could use the u2f-server command
      with key-handle and public-key files to test registration and authentication flows
      together with libu2f-host.
related-packages:
  - id: brew:libfido2
    reason: >
      Choose libfido2 for maintained U2F/CTAP1 and FIDO2/CTAP2 support; Yubico
      identifies it as the successor to the deprecated U2F-specific libraries.
    rel: alternative
    sources:
      - https://developers.yubico.com/U2F/Standalone_servers/
      - https://developers.yubico.com/libfido2/
      - https://github.com/Yubico/libu2f-server
category: security
