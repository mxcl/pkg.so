id: brew:minify
display-name: Minify
homepage: https://go.tacodewolff.nl/minify
repo: https://github.com/tdewolff/minify
docs:
  - https://github.com/tdewolff/minify#readme
  - https://go.tacodewolff.nl/minify
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project grew from a library into a practical CLI used in build pipelines: the
      command README documents installation from source, Go install, Docker usage,
      recursive and in-place minification, bundling, MIME/extension handling, and
      format-specific options such as CSS precision and HTML comment or tag
      preservation. The public web service at go.tacodewolff.nl/minify exposes the same
      core formats for interactive use.
  sources:
    - >
      https://discourse.gohugo.io/t/about-the-minifier-used-in-hugo-pipes-in-a-totally-unrelated-context/12850
    - https://formulae.brew.sh/formula/minify
    - https://github.com/tdewolff/minify
    - https://github.com/tdewolff/minify/blob/master/cmd/minify/README.md
    - https://go.tacodewolff.nl/minify
    - https://pkg.go.dev/github.com/tdewolff/Minify
  summary:
    - >
      Minify is Taco de Wolff's Go-based minifier library and command-line tool for web
      formats. The GitHub README describes it as a package for HTML5, CSS3, JavaScript,
      JSON, SVG, and XML, with a MIME-type dispatch interface that lets applications add
      their own minifiers or redirect work to external tools.
  usage:
    - >
      Its ecosystem niche is Go-native asset minification. It competes with
      Node-centered tools and single-format minifiers by covering several web asset
      types in one Go module, using streaming high-performance implementations, and
      offering bindings outside Go, including JavaScript and .NET bindings noted by the
      project. Hugo community discussions and issues around Hugo's --minify behavior
      show the library's use inside static-site generation workflows.
related-packages:
  - id: brew:esbuild
    reason: >
      Choose esbuild when the main task is JavaScript, TypeScript, JSX, or CSS
      transformation and dependency bundling as well as minification; choose Minify for
      broader HTML, JSON, SVG, and XML coverage and simple filesystem-oriented
      processing.
    rel: alternative
    sources:
      - https://github.com/tdewolff/minify
      - https://esbuild.github.io/api/
  - id: brew:hugo
    reason: >
      Hugo exposes tdewolff-specific minification settings for HTML, CSS, JavaScript,
      JSON, SVG, and XML, making it a documented higher-level site-building workflow
      around this minifier family.
    rel: adjacent_workflow
    sources:
      - https://gohugo.io/configuration/minify/
      - https://github.com/tdewolff/minify
category: developer-tools
