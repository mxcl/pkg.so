id: brew:bootterm
display-name: BootTerm
homepage: https://github.com/wtarreau/bootterm
repo: https://github.com/wtarreau/bootterm
docs:
  - https://github.com/wtarreau/bootterm#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is mostly among embedded Linux and board bring-up users rather than the
      general terminal-emulator audience. Package-manager metadata in the input shows
      availability through Alpine, Debian, Homebrew, Nix, Scoop, and winget, which is
      broad for a deliberately tiny serial-port utility.
  package-nerd-significance:
    - >
      BootTerm matters to package nerds because it is a focused replacement for heavier
      terminal programs in one specific packaging niche: reproducible board bring-up
      scripts and USB serial workflows. Its single-binary, libc-only style makes it easy
      for distributions to ship and for cross-platform embedded users to trust.
  project-history:
    - >
      The README describes BootTerm as a simple, reliable terminal designed for
      ephemeral serial ports, especially USB-based ports on single-board computers. Its
      feature set grew around automatic port detection, waiting for new or any port,
      non-standard baud rates, break sequences, RTS/DTR toggling, captures, timestamps,
      and a single `bt` binary with no unusual dependencies.
    - >
      The official GitHub tags show v0.1 through v0.5, with release metadata for v0.2 in
      December 2020, v0.3 and v0.4 in early 2021, and v0.5 in April 2024. Release names
      mention macOS support, ttyACM detection, timestamps, CRLF handling, and
      escape-mode refinements.
  related-projects:
    - >
      Related tools include classic serial terminals such as minicom, screen, picocom,
      and tio, plus flashing scripts that need to wait for and identify USB serial
      devices.
  sources:
    - https://github.com/wtarreau/bootterm#readme
    - https://github.com/wtarreau/bootterm/releases/tag/v0.2
    - https://github.com/wtarreau/bootterm/releases/tag/v0.5
    - source_facts.package-manager
  summary:
    - >
      BootTerm is a small serial-terminal CLI focused on the awkward moment when USB
      serial ports appear, disappear, and change names during board boot and flashing.
      It is a niche but polished tool for embedded developers working with SBCs, USB
      UART adapters, and bootloader consoles.
  timeline:
    - '2020: v0.2 release adds refined detection, filtering, and macOS support.'
    - >
      2021: v0.3 and v0.4 releases improve timestamps, ttyACM detection, CRLF, and
      escape handling.
    - '2024: v0.5 published on GitHub.'
  usage:
    - >
      The common workflow is `bt` with no argument to connect to the most recently
      registered serial device, `bt -l` to list candidates, `bt -n` to wait for a newly
      attached USB serial device, and baud or control-pin options for board reset and
      bootloader interactions.
related-packages:
  - id: brew:tio
    reason: >
      Choose tio when you want profiles, automatic reconnect, Lua automation, transfer
      protocols, or socket redirection; choose BootTerm for a smaller tool centered on
      detecting and waiting for ephemeral USB serial ports.
    rel: alternative
    sources:
      - https://github.com/wtarreau/bootterm#readme
      - https://github.com/tio/tio#readme
  - id: brew:picocom
    reason: >
      Choose picocom for a minimal traditional Unix serial terminal with configurable
      external transfer commands; choose BootTerm when automatic USB-device discovery
      and board-reset controls are the priority.
    rel: alternative
    sources:
      - https://github.com/wtarreau/bootterm#readme
      - https://github.com/npat-efault/picocom
category: system
package-manager:
  apk: bootterm
  brew: bootterm
  debian: bootterm
  nix: bootterm
  scoop: extras/bt
  winget: QwerProg.bt
package-manager-url: https://formulae.brew.sh/formula/bootterm
license: MIT
tags:
  - bootloader
  - cli
  - embedded
  - serial-port
  - serial-terminal
description: Simple, reliable and powerful terminal to ease connection to serial ports
executables:
  - bt
provenance:
  formula: bootterm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
