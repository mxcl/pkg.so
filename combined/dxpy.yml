id: brew:dxpy
display-name: dxpy
homepage: https://github.com/dnanexus/dx-toolkit
repo: https://github.com/dnanexus/dx-toolkit
docs:
  - https://dxpy.readthedocs.io/en/latest
  - http://autodoc.dnanexus.com/
  - https://documentation.dnanexus.com/
config-file-location:
  unix: ~/.dnanexus_config/environment.json
credentials-file-location:
  unix: ~/.dnanexus_config/environment.json
history:
  adoption-history:
    - >
      Unlike general-purpose Unix tools, dxpy adoption follows the DNAnexus platform
      itself: researchers and bioinformatics engineers use it to script platform
      objects, projects, files, apps, workflows, jobs, and API calls. The batch input
      exposes this as a Homebrew package with many dx-* executables rather than just a
      Python library.
  package-nerd-significance:
    - >
      dxpy is significant as a packaged scientific-platform SDK: it turns a hosted
      genomics and biomedical analysis platform into reproducible shell and Python
      workflows. For package managers, it is a reminder that many science packages are
      not just libraries but operational CLIs with credentials, cloud objects, and
      platform-specific execution assumptions.
  project-history:
    - >
      The official dx-toolkit git history begins with imported history in 2011 and early
      repository reorganization in March 2012. Official tags show v0.0.1 on 2012-08-09
      and a long continuous release stream through v0.410.0 in June 2026.
  related-projects:
    - >
      dxpy is part of DNAnexus dx-toolkit alongside the dx command family, DNAnexus API
      documentation, platform documentation, app builders, job utilities, Docker
      helpers, and Nextflow-related tooling referenced in recent changelog entries.
  sources:
    - https://dxpy.readthedocs.io/en/latest
    - https://github.com/dnanexus/dx-toolkit
    - https://github.com/dnanexus/dx-toolkit/blob/master/CHANGELOG.md
    - https://documentation.dnanexus.com/
  summary:
    - >
      dxpy is the Python binding layer and command-line toolkit for the DNAnexus
      platform. The official Read the Docs page describes dxpy as Python bindings for
      interacting with the DNAnexus Platform API, both inside the DNAnexus execution
      environment and from external scripts.
  timeline:
    - '2011: Official git history begins with imported repository history.'
    - '2012: v0.0.1 tagged and DNAnexus Python docs carry 2012-2013 copyright.'
    - '2020: v0.300.0 tagged.'
    - '2023: v0.350.0 tagged.'
    - '2025: v0.400.0 tagged.'
    - '2026: v0.410.0 appears in the official changelog and tag list.'
  usage:
    - >
      The official docs organize dxpy around Pythonic bindings, low-level API wrappers,
      object handlers, projects, records, files, genomic tables, applets, apps,
      workflows, jobs, search, app building, utilities, and exceptions. In practice the
      packaged toolkit is used for DNAnexus login/configuration, data movement,
      applet/app development, job utilities, logging, Docker/Nextflow helper workflows,
      and scripted platform automation.
related-packages:
  - id: brew:nextflow
    reason: >
      DNAnexus officially supports importing, building, running, and monitoring Nextflow
      pipelines with dx-toolkit, making Nextflow the pipeline authoring layer and dxpy
      the platform-control layer.
    rel: adjacent_workflow
    sources:
      - >
        https://documentation.dnanexus.com/user/running-apps-and-workflows/running-nextflow-pipelines
      - https://nextflow.io/docs/latest/index.html
category: science
package-manager:
  brew: dxpy
package-manager-url: https://formulae.brew.sh/formula/dxpy
license: Apache-2.0
tags:
  - cli
  - dnanexus
  - genomics
  - python
  - sdk
description: DNAnexus toolkit utilities and platform API bindings for Python
executables:
  - dx-app-wizard
  - dx-build-app
  - dx-build-applet
  - dx-clone-asset
  - dx-docker
  - dx-download-all-inputs
  - dx-fetch-bundled-depends
  - dx-generate-dxapp
  - dx-jobutil-add-output
  - dx-jobutil-dxlink
  - dx-jobutil-get-identity-token
  - dx-jobutil-new-job
  - dx-jobutil-parse-link
  - dx-jobutil-report-error
  - dx-log-stream
  - dx-mount-all-inputs
  - dx-notebook-reconnect
  - dx-print-bash-vars
  - dx-upload-all-outputs
provenance:
  formula: dxpy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
