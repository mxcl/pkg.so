id: brew:harper
display-name: Harper
homepage: https://writewithharper.com
repo: https://github.com/Automattic/harper
docs:
  - https://writewithharper.com/docs/integrations/language-server
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Harper reached users through developer tools rather than only through a standalone
      writing app. Official language-server docs list package-manager and ecosystem
      distribution through Homebrew, Scoop, Arch, Nixpkgs, Cargo, and GitHub release
      binaries. The same docs show editor-oriented adoption through LSP support and
      integrations for Visual Studio Code, Neovim, Helix, Emacs, Zed, Sublime Text,
      Markdown, comments in programming languages, and related writing surfaces.
    - >
      The 1.0.0 release notes framed the milestone around a stable API and noted
      significant pre-1.0 usage across Chrome, Obsidian, VS Code, Neovim, and other
      integrations. That release made Harper more credible as a library and embedded
      grammar-checking component, not only as an end-user binary.
  package-nerd-significance:
    - >
      Harper is a useful package-manager case because it is simultaneously a Rust CLI, a
      language server, and a library ecosystem. A package needs to expose
      developer-facing executables while matching the upstream release cadence and
      keeping integrations compatible with editor/LSP expectations.
    - >
      It also represents a broader packaging trend: privacy-preserving local AI-adjacent
      writing tools that avoid hosted services but still integrate into developer
      editors, docs workflows, and programmable text-processing environments.
  project-history:
    - >
      The repository history begins in October 2023 with experiments around
      highlighting, spelling, capitalization, and a Wagner-Fischer edit-distance
      implementation. By January 2024 the project was tagging early releases and
      packaging separate components such as harper-core and harper-ls.
    - >
      Harper's README explains its design motivation as a response to expensive,
      network-bound, and heavy grammar checkers. The author describes Harper as a
      private tool that runs locally, lints quickly, and avoids sending writing to
      remote services. The project later moved under the Automattic GitHub organization,
      while the public repository retained its Rust workspace structure and
      developer-facing integrations.
  related-projects:
    - LanguageTool and Grammarly are explicit comparison points in Harper's README motivation.
    - harper-ls is the language-server frontend used by editor integrations.
    - harper.js is the WebAssembly/JavaScript-facing package for embedding local linting.
  sources:
    - Official Harper repository README, release notes, and language-server documentation.
    - Upstream git tag history for public release timing.
  summary:
    - >
      Harper is an offline, privacy-oriented English grammar checker for developers and
      technical writers. It began as a Rust-powered grammar and spell-checking engine,
      then grew into a multi-surface project with a language server, CLI, WebAssembly
      package, browser extensions, editor integrations, and an Obsidian integration.
  timeline:
    - '2023-10: Repository history begins with grammar-checking and highlighting experiments.'
    - '2024-01: Early public tags, including v0.2.0, appear for the Rust workspace packages.'
    - >
      2025-11: Version 1.0.0 is released as an API-stability milestone after broad
      editor and extension adoption.
    - >
      2026-04: Version 2.0.0 is released with breaking changes for harper.js binary
      imports and additional smaller improvements.
    - '2026-06: Version 2.6.0 is tagged in the upstream repository.'
  usage:
    - >
      The Homebrew package exposes `harper-cli` and `harper-ls`. In editor workflows,
      `harper-ls` provides Language Server Protocol diagnostics, dictionaries, code
      actions, ignore comments, rule configuration, dialect selection, and support for
      many programming and markup languages.
    - >
      Harper's architecture makes it useful in both interactive and embedded contexts:
      the language server serves editors, the CLI fits scripts and package-manager
      installs, and `harper.js`/WebAssembly supports local linting in web or desktop
      applications.
related-packages:
  - id: brew:languagetool
    reason: >
      Choose LanguageTool when multilingual proofreading is more important than Harper's
      smaller, English-focused, native language-server workflow.
    rel: alternative
    sources:
      - https://github.com/Automattic/harper/blob/master/COMPARISON.md
      - https://dev.languagetool.org/
      - https://github.com/languagetool-org/languagetool
category: developer-tools
package-manager:
  apk: harper
  brew: harper
  nix: harper
  pacman: harper
  scoop: main/harper
  winget: Automattic.harper-ls
package-manager-url: https://formulae.brew.sh/formula/harper
license: Apache-2.0
tags:
  - cli
  - developer-tools
  - grammar-checker
  - language-server
  - rust
  - writing
description: Grammar Checker for Developers
executables:
  - harper-cli
  - harper-ls
provenance:
  formula: harper
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
