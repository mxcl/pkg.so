id: brew:gojq
display-name: gojq
homepage: https://github.com/itchyny/gojq
repo: https://github.com/itchyny/gojq
docs:
  - https://github.com/itchyny/gojq#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gojq's package-manager adoption follows its portability story. The input package
      facts list apk, Homebrew, Debian, dnf, MacPorts, Nix, Ubuntu, and zypper packages,
      which fits a small CLI used across many Unix-like systems.
    - >
      The README advertises installation through Homebrew, mise, Zero Install, go
      install, and Docker images. That broad install surface reflects both command-line
      use and reproducible automation contexts.
  package-nerd-significance:
    - >
      gojq is significant because it ports one of the most package-manager-loved Unix
      data tools into a single Go build. That makes static or cross-platform
      distribution easier than the C jq stack in many environments.
    - >
      It also exposes the tension in compatibility implementations: the README documents
      intentional differences from jq, including map ordering, unsupported flags,
      regex-engine differences, YAML support, and arbitrary-precision integers.
  project-history:
    - >
      The repository began in April 2019 with commits implementing the parser, runner,
      and CLI. The README frames the project as a jq implementation written in Go and
      documents both command usage and library APIs.
    - >
      The release stream moved quickly through 0.x versions in 2019 and 2020, with
      v0.12.0 appearing in December 2020. Subsequent v0.12 patch releases continued the
      long maintenance line.
  related-projects:
    - jq is the original command and language that gojq implements.
    - >
      The Go standard library's encoding/json is relevant because gojq's library API
      expects generic decoded JSON-like Go values.
    - mise and Docker are documented installation surfaces alongside package-manager installs.
  sources:
    - https://github.com/itchyny/gojq
    - https://github.com/itchyny/gojq#readme
    - https://pkg.go.dev/github.com/itchyny/gojq
  summary:
    - >
      gojq is a pure Go implementation of jq, the JSON query language and command-line
      processor. It can run as a command and can also be embedded as a Go library.
    - >
      The project is valuable where jq compatibility is wanted without C-library and
      regex-library build dependencies, or where Go programs want an in-process jq-like
      query engine.
  timeline:
    - '2019: Repository starts with parser, runner, and CLI implementation commits.'
    - '2019: v0.0.1 and v0.1.0 tags appear in April and May.'
    - '2020: v0.12.0 tag appears in December after rapid 0.x development.'
    - '2024: v0.12.17 tag appears in the continuing v0.12 maintenance series.'
  usage:
    - >
      At the command line, gojq reads JSON and applies jq filters such as .foo, .a.b,
      object construction, updates, and pipelines. The README highlights useful
      differences including arbitrary-precision integer calculations, YAML input/output
      options, and detailed error positions.
    - >
      As a library, callers parse a query with gojq.Parse, run it against values decoded
      into []any or map[string]any, and iterate over results. Compile options cover
      module loading, environment loading, variables, custom functions, and input
      iterators.
related-packages:
  - id: brew:jq
    reason: >
      Choose jq for the canonical C implementation and full upstream behavior, or gojq
      for a pure-Go executable and library with YAML support and arbitrary-precision
      integer arithmetic, accepting the documented compatibility differences.
    rel: alternative
    sources:
      - https://github.com/itchyny/gojq#readme
      - https://jqlang.github.io/jq/
      - https://jqlang.github.io/jq/manual/
category: developer-tools
