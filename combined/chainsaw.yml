id: brew:chainsaw
display-name: Chainsaw
homepage: https://github.com/WithSecureLabs/chainsaw
repo: https://github.com/WithSecureLabs/chainsaw
docs:
  - https://github.com/WithSecureLabs/chainsaw/wiki
  - https://github.com/WithSecureLabs/chainsaw/wiki/Usage
  - https://github.com/WithSecureLabs/chainsaw#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Chainsaw is distributed through GitHub releases, Nix, and the Homebrew formula
      named chainsaw. That packaging path matters because the tool is useful as a
      portable first-response binary on analyst workstations and ephemeral response
      systems.
    - >
      GitHub release metadata shows active maintenance from v1.0.0 in 2021 through v2
      releases in 2026.
  package-nerd-significance:
    - >
      Chainsaw is notable in package-manager culture because it packages modern Rust
      DFIR tooling for a workflow that often used heavier SIEM stacks such as Splunk or
      ELK. It also shows the Sigma ecosystem becoming something local CLIs can consume
      directly.
  project-history:
    - >
      WithSecure Countercept created Chainsaw for incident-response cases where endpoint
      telemetry or a SIEM was not available, so analysts needed fast standalone
      processing of Windows artefacts. The public GitHub repository was created in
      August 2021 and v1.0.0 was released later that month.
    - >
      The project evolved from an all-in-one threat-hunting bundle toward a tool that
      expects users to keep Sigma rules and sample event logs separately. The README
      notes that Chainsaw v2 stopped including Sigma Rules and EVTX-Attack-Samples as
      submodules so users could track those projects independently.
  related-projects:
    - SigmaHQ/sigma provides the Sigma detection rules Chainsaw can run.
    - omerbenamram/evtx is the Rust EVTX parser wrapped by Chainsaw.
    - sbousseaden/EVTX-ATTACK-SAMPLES is used in the README example dataset workflow.
  sources:
    - https://github.com/WithSecureLabs/chainsaw#readme
    - https://github.com/WithSecureLabs/chainsaw/releases
    - https://api.github.com/repos/WithSecureLabs/chainsaw
  summary:
    - >
      Chainsaw is a WithSecure Labs command-line tool for rapid Windows forensic triage.
      It searches event logs and other Windows artefacts, applies Sigma and custom
      detection rules, and emits investigator-friendly output formats.
  timeline:
    - '2021: GitHub repository created by WithSecureLabs.'
    - '2021: v1.0.0 published on GitHub releases.'
    - '2023: v2 line documented removal of bundled Sigma and EVTX sample submodules.'
    - '2026: v2.16.0 published on GitHub releases.'
  usage:
    - >
      Typical use is to run chainsaw against Windows event-log collections, optionally
      supplying a Sigma rules directory and a mapping file such as
      mappings/sigma-event-logs-all.yml. The README documents output formats including
      table, CSV, and JSON, plus timeline generation from Shimcache enriched with
      Amcache data.
related-packages: []
category: security
package-manager:
  brew: chainsaw
  nix: chainsaw
  zypper: apache-chainsaw
package-manager-url: https://formulae.brew.sh/formula/chainsaw
