id: brew:binsider
display-name: Binsider
homepage: https://binsider.dev/
repo: https://github.com/orhun/binsider
docs:
  - https://binsider.dev/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Binsider moved quickly into package-manager channels: the supplied package facts
      list Homebrew, Nix, Arch, Scoop, and openSUSE packages, while the official docs
      also document Cargo, Arch, Alpine, binary releases, source builds, Docker images,
      and other installation methods.
  package-nerd-significance:
    - >
      Binsider is notable as a modern TUI wrapper around tasks traditionally split
      across readelf, ldd, strace, ltrace, strings, and hexdump. It is young, but it
      reflects the current packaging taste for interactive terminal tools that make old
      binary formats easier to explore.
  project-history:
    - >
      The orhun/binsider repository was created in August 2023, and the first crates.io
      publication and v0.1.0 release arrived in September 2024. The README describes it
      as a terminal UI for static and dynamic ELF analysis, and the documentation site
      presents quickstart, installation, and usage pages.
    - >
      The release history shows rapid early packaging from 0.1.0 in 2024 through 0.3.2
      in February 2026.
  related-projects:
    - >
      Binsider overlaps with GNU Binutils tools such as readelf, strings, and objdump,
      and with tracing tools such as strace and ltrace. Its focus is ELF binaries rather
      than general object-file coverage.
  sources:
    - GitHub API reports repository creation and release dates.
    - GitHub README documents purpose, features, documentation links, and installation hints.
    - Official documentation quickstart documents command usage and feature areas.
    - crates.io API reports crate publication and latest version.
    - input.source_facts.package-manager lists package-manager availability.
  summary:
    - >
      Binsider is a Rust TUI for analyzing ELF binaries, combining static inspection,
      dynamic tracing, strings, linked-library views, and hexdumps in one terminal
      interface.
  timeline:
    - '2023: GitHub repository is created.'
    - '2024: v0.1.0 and first crates.io release.'
    - '2024: 0.2.0 release and project blog material document early development.'
    - '2026: v0.3.2 release.'
  usage:
    - >
      The quickstart is `binsider <binary>`. The official docs describe general
      analysis, ELF layout inspection, dynamic tracing similar to strace/ltrace
      workflows, string extraction, and a hexdump dashboard.
related-packages:
  - id: brew:binutils
    reason: >
      Choose GNU Binutils when you need scriptable tools such as readelf, objdump, nm,
      strings, and ld rather than Binsider's interactive ELF-focused TUI.
    rel: alternative
    sources:
      - https://binsider.dev/
      - https://sourceware.org/binutils/
category: developer-tools
package-manager:
  brew: binsider
  nix: binsider
  pacman: binsider
  scoop: main/binsider
  zypper: binsider
package-manager-url: https://formulae.brew.sh/formula/binsider
license: Apache-2.0 OR MIT
tags:
  - binary-analysis
  - cli
  - elf
  - hexdump
  - reverse-engineering
  - tui
description: Analyzes ELF binaries
executables:
  - binsider
provenance:
  formula: binsider
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
