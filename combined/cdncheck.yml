id: brew:cdncheck
display-name: cdncheck
homepage: https://projectdiscovery.io
repo: https://github.com/projectdiscovery/cdncheck
docs:
  - https://github.com/projectdiscovery/cdncheck#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption is tied to ProjectDiscovery's security tooling ecosystem, where small
      composable CLIs are used in reconnaissance and asset analysis pipelines. The
      README documents both direct CLI use and library import via
      github.com/projectdiscovery/cdncheck.
  package-nerd-significance:
    - >
      cdncheck is package-nerd-relevant because it packages frequently changing provider
      intelligence into a Go CLI/library with reproducible releases; the package value
      is as much the curated data as the executable.
  project-history:
    - >
      The official repository describes cdncheck as both a command-line utility and a
      helper library. Provider data is maintained in provider.yaml and compiled into
      sources_data.json, making the project a compact data-and-code package for
      infrastructure detection.
  related-projects:
    - >
      cdncheck belongs to the ProjectDiscovery ecosystem of reconnaissance and security
      tools and is commonly adjacent to DNS, HTTP probing, and asset-enrichment
      workflows.
  sources:
    - https://api.github.com/repos/projectdiscovery/cdncheck
    - https://github.com/projectdiscovery/cdncheck
    - https://projectdiscovery.io
    - https://github.com/projectdiscovery/cdncheck#readme
    - https://formulae.brew.sh/api/formula/cdncheck.json
  summary:
    - >
      cdncheck is a ProjectDiscovery tool and Go library for identifying CDN, cloud, and
      WAF technology associated with DNS names or IP addresses.
  timeline:
    - >
      2020: GitHub repository metadata identifies projectdiscovery/cdncheck repository
      creation era.
    - >
      2020s: README documents CDN, cloud, WAF detection, provider generation, CLI flags,
      and library usage.
  usage:
    - >
      Users run cdncheck against IP or DNS input, filter results to CDN, cloud, or WAF
      matches, write plain or JSONL output, and can add providers through the
      repository's provider data workflow.
related-packages: []
