history:
  adoption-history:
    - >
      Tencent reported more than 10 million daily active users within two months of
      launch as remote work and education demand accelerated during the COVID-19
      outbreak. Eight months after launch it had accumulated 100 million users, and by
      the end of 2021 it reported more than 200 million users.
    - >
      Tencent expanded the service internationally as VooV Meeting in March 2020 and
      integrated meeting access with smartphones, computers, Weixin/WeChat Mini
      Programs, WeCom, APIs, and conferencing hardware.
  package-nerd-significance:
    - >
      Tencent Meeting is a prominent example of a regionally dominant conferencing
      client packaged for unattended macOS installation. The Homebrew cask is useful
      where administrators or users want repeatable deployment outside the vendor's
      interactive download flow.
    - >
      Its rapid pandemic-era scaling is notable infrastructure history: Tencent reported
      adding more than one million CPU cores and over 100,000 cloud virtual machines
      within eight days to meet demand.
  project-history:
    - >
      Tencent Cloud released Tencent Meeting in late December 2019 as a cloud
      video-conferencing service. The international edition, VooV Meeting, followed in
      March 2020.
    - >
      The product developed from a simple meeting client into a broader suite
      encompassing cloud meetings, webinars, Rooms, room connectors, enterprise
      services, APIs, recording, transcription, and collaboration integrations.
  related-projects:
    - VooV Meeting
    - WeCom
    - Weixin/WeChat
    - Tencent Cloud
    - Tencent Meeting Rooms
  sources:
    - https://meeting.tencent.com/news/200-million-users.html
    - https://meeting.tencent.com/support-detail-video.html
    - https://www.tencent.com/en-us/articles/2201013.html
    - https://www.tencent.com/en-us/business/tencent-meeting.html
  summary:
    - >
      Tencent Meeting is Tencent Cloud's video-conferencing and collaboration service,
      released in China in December 2019 and offered internationally as VooV Meeting.
  timeline:
    - '2019: Tencent Meeting launched in late December.'
    - '2020: Daily active users exceeded 10 million within two months of launch.'
    - '2020: International edition VooV Meeting launched in March.'
    - '2020: Tencent Meeting surpassed 100 million users within eight months.'
    - '2021: Tencent reported more than 200 million users by year end.'
    - '2026: The supplied Homebrew cask record tracks Tencent Meeting 3.45.2.404.'
  usage:
    - >
      Users host or join audio/video meetings, share screens, record or transcribe
      sessions, run webinars and classes, and connect from desktop, mobile,
      mini-program, room, or hardware-conferencing environments. Enterprise deployments
      use administrative controls, APIs, and integrations with Tencent's collaboration
      ecosystem.
