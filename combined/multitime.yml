id: brew:multitime
display-name: multitime
homepage: https://tratt.net/laurie/src/multitime/
repo: https://github.com/ltratt/multitime
docs:
  - https://tratt.net/laurie/src/multitime
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool is intentionally narrow. It times external commands rather than becoming
      a language-specific profiler, and it includes options for controlling standard
      input and output across runs. Its man page also documents batch files for
      comparing different commands by randomly interleaving executions, which spreads
      machine noise more evenly across alternatives. That makes it a useful command-line
      companion for compiler, shell, and systems experiments where the benchmark is
      already expressible as a command.
  sources:
    - https://formulae.brew.sh/formula/multitime
    - https://github.com/ltratt/multitime
    - https://tratt.net/laurie/src/multitime/
    - https://tratt.net/laurie/src/multitime/multitime.1.html
  summary:
    - >
      multitime is Laurence Tratt's small benchmarking utility that extends Unix `time`
      by running a command repeatedly and reporting summary statistics. Tratt's overview
      starts from a common problem with one-shot timing: caches, background load, CPU
      and I/O scheduling, and user cherry-picking can make a single `time` result
      misleading. multitime answers that with repeated runs and output that includes
      means, standard deviations, minimums, medians, and maximums.
  usage:
    - >
      Its package-manager niche is a lightweight developer and research tool: smaller
      than benchmarking harnesses, more statistically honest than running `time` by hand
      several times, and easy to install through Homebrew, Nix, and Debian/Ubuntu-style
      packages.
related-packages:
  - id: brew:hyperfine
    reason: >
      Choose hyperfine when you need warmups, automatic run counts, outlier detection,
      parameterized comparisons, or machine-readable exports; multitime offers a smaller
      traditional Unix-style timing workflow.
    rel: alternative
    sources:
      - https://tratt.net/laurie/src/multitime/multitime.1.html
      - https://github.com/sharkdp/hyperfine
  - id: brew:gnu-time
    reason: >
      Choose GNU Time for detailed resource accounting from one execution, including
      memory and I/O fields; choose multitime for repeated runs and summary statistics.
    rel: alternative
    sources:
      - https://tratt.net/laurie/src/multitime/multitime.1.html
      - https://www.gnu.org/software/time/manual/time.html
category: developer-tools
