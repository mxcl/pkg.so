id: brew:dupseek
display-name: dupseek
homepage: http://www.beautylabs.net/software/dupseek.html
repo: null
docs:
  - http://www.beautylabs.net/software/dupseek.html
config-file-location:
  unix:
    - ~/.duply/<profile>/conf
    - /etc/duply/<profile>/conf
credentials-file-location:
  unix:
    - ~/.duply/<profile>/conf
    - /etc/duply/<profile>/conf
    - ~/.duply/<profile>/gpgkey.*.asc
    - /etc/duply/<profile>/gpgkey.*.asc
history:
  adoption-history:
    - >
      The official platform notes list reports from Debian GNU/Linux Woody and Sarge,
      Mac OS X 10.2.6, and FreeBSD 4.7. Credits mention a contributed patch for batch
      processing and option parsing, plus outside Mac OS X testing, which suggests
      modest but real user feedback around a personal utility.
  package-nerd-significance:
    - >
      dupseek is a compact example of pre-modern duplicate-file tooling: one Perl
      script, interactive control, sparse reads, and explicit user caution. It is less
      famous than later dedup tools, but it captures a useful design tradeoff from the
      early-2000s Unix utility shelf.
  project-history:
    - >
      The official Beautylabs page dates the public releases to 2003-2005, with version
      1.0 in June 2003 and version 1.3 in September 2005. The tool was distributed as a
      small archive containing development files and the standalone dupseek program.
    - >
      The page contrasts dupseek with the common size-plus-fingerprint method. dupseek
      first groups by file size, then reads and compares small chunks, increasing chunk
      size and dropping files from consideration as soon as they differ. The author
      presents this as especially efficient when many large files share the same size.
  related-projects:
    - >
      The official page compares dupseek's approach with duplicate finders that group by
      file size and then compute a short fingerprint such as an MD5 checksum, but it
      does not name a specific competing tool.
  sources:
    - http://www.beautylabs.net/software/dupseek.html
  summary:
    - >
      dupseek is Antonio Bellezza's small interactive Perl command-line tool for finding
      and removing duplicate files. Its interest is the algorithm and workflow: it
      compares files progressively instead of simply hashing every candidate up front.
  timeline:
    - '2003-06-06: dupseek 1.0 released.'
    - '2003-06-27: dupseek 1.1 released with automatic deletion support.'
    - '2005-03-07: dupseek 1.2 released.'
    - '2005-09-24: dupseek 1.3 released and listed as the latest version on the official page.'
  usage:
    - >
      dupseek is meant for careful cleanup rather than unattended deduplication. It can
      be interrupted with Ctrl-C to show partial results, and the user can inspect
      groups or continue processing. The official warning is blunt because automatic
      deletion support appeared in version 1.1.
    - >
      The notable operational caveat is that directories being checked should not be
      modified while dupseek runs, and older versions had a dangerous
      duplicate-directory bug that was later marked corrected in version 1.3.
