id: brew:daq
display-name: LibDAQ
homepage: https://www.snort.org/
repo: https://github.com/snort3/libdaq
docs:
  - https://docs.snort.org/start/inspection
  - https://github.com/snort3/libdaq
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LibDAQ is packaged separately because Snort users often need to build or install
      it before Snort itself, choose module directories, and line up the correct Snort 2
      or Snort 3 DAQ version on machines where both generations coexist.
  package-nerd-significance:
    - >
      LibDAQ is a package-manager boundary object: it is not the IDS itself, but
      versioning, module paths, kernel/network dependencies, and build options can
      decide whether Snort can capture packets at all.
  project-history:
    - >
      Snort documentation says Snort 2.9 introduced DAQ to replace direct libpcap calls
      with an abstraction layer. The Snort 3 LibDAQ repository continues that idea with
      base modules and wrapper modules that compose into DAQ instances.
  related-projects:
    - >
      LibDAQ is closely tied to Snort 2, Snort 3, libpcap, Linux AF_PACKET, netfilter
      queue, netmap, and other packet acquisition paths used by intrusion detection and
      prevention deployments.
  sources:
    - https://www.snort.org/faq/readme-daq
    - https://docs.snort.org/start/installation
    - https://docs.snort.org/start/inspection
    - https://github.com/snort3/libdaq
    - https://github.com/snort3/libdaq/blob/master/ChangeLog.md
  summary:
    - >
      LibDAQ is Snort's Data Acquisition library, the packet I/O abstraction layer that
      lets Snort and related packet-processing tools talk to pcap files, live
      interfaces, inline packet paths, and platform-specific capture back ends.
  timeline:
    - '2010: Snort 2.9 documentation introduced DAQ as a replacement for direct libpcap calls.'
    - >
      2019: Early Snort 3 LibDAQ issue history shows separate packaging and
      configure/build questions.
    - '2021: LibDAQ 3.0.x changelog entries document Snort 3-era module and API evolution.'
  usage:
    - >
      In practice, users install LibDAQ, point Snort at the module directory when
      needed, list available modules with snort --daq-list, and then run Snort in
      passive, inline, or pcap-readback modes depending on the selected DAQ module.
related-packages:
  - id: brew:snort
    reason: >
      Install Snort with LibDAQ when you need a complete IDS/IPS that consumes LibDAQ
      modules for passive capture, pcap readback, or inline packet processing.
    rel: adjacent_workflow
    sources:
      - https://snort.org/document/readme-daq
      - https://docs.snort.org/start/inspection
      - https://github.com/snort3/libdaq
category: security
package-manager:
  apk: daq
  brew: daq
  dnf: daq
  macports: daq
  ubuntu: libdaq-dev
package-manager-url: https://formulae.brew.sh/formula/daq
license: GPL-2.0-only
tags:
  - c-library
  - cli
  - data-acquisition
  - intrusion-detection
  - intrusion-prevention
  - packet-io
  - snort
description: Network intrusion prevention and detection system
executables:
  - daqtest
  - daqtest-static
provenance:
  formula: daq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
