id: brew:bibtex2html
display-name: BibTeX2HTML
homepage: https://usr.lmf.cnrs.fr/~jcf/bibtex2html/index.en.html
repo: https://github.com/backtracking/bibtex2html
docs:
  - https://usr.lmf.cnrs.fr/~jcf/bibtex2html/doc/manual.html
  - https://github.com/backtracking/bibtex2html#readme
  - https://usr.lmf.cnrs.fr/~jcf/bibtex2html/index.en.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      BibTeX2HTML became useful in the early web era because academics already
      maintained BibTeX files and needed HTML publication pages without manually
      duplicating bibliography data.
    - >
      The official home page points to Debian, FreeBSD, OpenBSD, Windows, macOS, Linux,
      and Solaris distribution artifacts or ports, showing long-lived cross-platform
      packaging beyond the original source release.
  package-nerd-significance:
    - >
      BibTeX2HTML is package-nerd significant as a surviving 1990s Unix-style academic
      publishing tool: an OCaml CLI that bridges BibTeX, BibTeX styles, LaTeX-era
      metadata, and static HTML publication pages.
    - >
      Its history also shows why package managers kept small bibliography converters
      around: they are glue tools for reproducible academic websites, not large
      applications.
  project-history:
    - >
      The official project page credits Jean-Christophe Filliatre and Claude Marche as
      authors and describes BibTeX2HTML as a collection of tools for translating BibTeX
      to HTML.
    - >
      The changelog dates the first public release, version 0.1, to July 1997, followed
      by a rapid sequence of 0.x releases that added multiple bibliographies, online
      documentation, abstract handling, long options, macro translation, and filtering.
    - >
      By version 1.0 in July 1999, BibTeX2HTML had become a practical publication-list
      generator with bib2bib filtering, footer control, citation-file support, macro
      handling, and BibTeX output preservation.
  related-projects:
    - >
      BibTeX is the source bibliography format and external processor that BibTeX2HTML
      builds around.
    - HeVeA is listed by the project as a related LaTeX-to-HTML tool.
    - bib2bib and aux2bib are companion tools distributed with BibTeX2HTML.
  sources:
    - https://github.com/backtracking/bibtex2html/blob/master/CHANGES
    - https://usr.lmf.cnrs.fr/~jcf/bibtex2html/doc/manual.html
    - https://usr.lmf.cnrs.fr/~jcf/bibtex2html/index.en.html
  summary:
    - >
      BibTeX2HTML is an OCaml-written collection of command-line tools for turning
      BibTeX bibliographies into HTML pages and for filtering BibTeX entries.
  timeline:
    - '1997-07-17: Version 0.1 is marked as the first public release.'
    - '1998-11-18: Version 0.7 adds online documentation and long options.'
    - '1999-07-15: Version 1.0 adds fuller bib2bib filtering and publication-page features.'
    - '2008-07-08: Version 1.92 adds a Windows installer and cross-reference expansion.'
    - '2014-07-04: Version 1.98 fixes URL escaping and improves macro translation.'
    - >
      2018-03-23: Version 1.99 updates safety around string use and requires OCaml 4.03
      or newer.
  usage:
    - >
      The manual describes three command-line tools: bibtex2html for translating a .bib
      file into HTML, bib2bib for filtering bibliography entries by criteria, and
      aux2bib for extracting entries referenced by a LaTeX .aux file.
    - >
      Typical users generate publication pages, add links from fields such as url, ps,
      and abstract, sort entries by dates or authors, and use bib2bib to select subsets
      of a bibliography.
related-packages:
  - id: brew:bibtexconv
    reason: >
      Choose BibTeXConv when you need script-defined text, Markdown, YAML, ODT, or IETF
      XML exports and URL checking; choose BibTeX2HTML for BibTeX-style-driven HTML
      publication pages.
    rel: alternative
    sources:
      - https://www.nntb.no/~dreibh/bibtexconv/
      - https://usr.lmf.cnrs.fr/~jcf/bibtex2html/index.en.html
category: productivity
package-manager:
  brew: bibtex2html
  debian: bibtex2html
  macports: bibtex2html
  nix: bibtex2html
  ubuntu: bibtex2html
package-manager-url: https://formulae.brew.sh/formula/bibtex2html
license: GPL-2.0-only
tags:
  - bibliography
  - bibtex
  - cli
  - converter
  - html
description: BibTeX to HTML converter
executables:
  - aux2bib
  - bib2bib
  - bibtex2html
provenance:
  formula: bibtex2html
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
