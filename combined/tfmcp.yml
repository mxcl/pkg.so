id: brew:tfmcp
display-name: tfmcp
homepage: https://github.com/nwiizo/tfmcp
repo: https://github.com/nwiizo/tfmcp
docs:
  - https://github.com/nwiizo/tfmcp
config-file-location:
  macos: ~/Library/Application Support/Claude/claude_desktop_config.json
credentials-file-location:
  unix: $MCP_TLS_KEY_FILE
history:
  adoption-history:
    - >
      The project is newer and narrower than tfenv or tfmigrate, but the official
      repository already shows hundreds of GitHub stars and a Homebrew package in the
      input metadata. Its adoption niche is developers experimenting with AI-assisted
      infrastructure operations while keeping Terraform as the underlying execution
      engine.
    - >
      Because MCP clients are typically configured per desktop or agent runtime,
      packaging tfmcp as a Homebrew formula makes it easier to install reproducibly next
      to Terraform itself.
  package-nerd-significance:
    - >
      tfmcp is significant as an early package-manager-distributed example of AI-native
      infrastructure tooling. It is not a replacement for Terraform; it packages a
      controlled interface layer so agents can inspect and operate Terraform projects.
    - >
      For package catalogs, it marks the moment when MCP servers became installable
      developer tools rather than just application plugins.
  project-history:
    - >
      tfmcp belongs to the post-MCP wave of infrastructure tooling: instead of wrapping
      Terraform for humans only, it exposes Terraform operations to AI assistants
      through MCP. The repository README labels the project as under active development
      while also emphasizing production-ready security controls.
    - >
      The release history shows rapid expansion. v0.1.5 focused on CI/CD reliability and
      security; v0.1.6 added module health analysis and Terraform registry integration;
      v0.1.9 added ten local Terraform tools for feature parity with Terraform CLI
      operations; and v0.2.0 is listed as a release for registry expansion, tool
      filtering, and live docs.
  related-projects:
    - Terraform is the underlying CLI that tfmcp integrates with.
    - Model Context Protocol is the protocol surface tfmcp exposes.
    - Claude Desktop is the README's visible MCP client example.
  sources:
    - https://github.com/nwiizo/tfmcp
    - https://github.com/nwiizo/tfmcp/releases
    - source_facts.package-manager.brew
  summary:
    - >
      tfmcp is a Rust command-line Model Context Protocol server for Terraform. The
      README describes it as a tool that lets LLMs read Terraform configurations,
      analyze plans, apply configurations, manage state, and integrate with Claude
      Desktop.
  timeline:
    - '2025: v0.1.5 release notes focus on CI/CD reliability and security enhancements.'
    - '2025: v0.1.6 introduces module health analysis and Terraform Registry integration.'
    - '2025: v0.1.9 adds ten local Terraform tools and reaches 31 MCP tools.'
    - '2026: Releases page lists v0.2.0 for registry expansion, tool filtering, and live docs.'
  usage:
    - >
      The README describes tfmcp as an MCP server with Terraform integration, module
      health analysis, resource dependency graphs, Terraform Registry lookup, plan and
      state analysis, workspace management, import helpers, `fmt`, `graph`, output
      access, taint/untaint, refresh, provider inspection, audit logging, access
      controls, and Docker support.
    - >
      In practical use, tfmcp sits between an AI assistant and the Terraform CLI: the
      assistant calls MCP tools, and tfmcp performs or analyzes Terraform operations
      with policy and safety controls around them.
category: ai
package-manager:
  brew: tfmcp
package-manager-url: https://formulae.brew.sh/formula/tfmcp
license: MIT
tags:
  - ai
  - cli
  - infrastructure-as-code
  - mcp
  - model-context-protocol
  - terraform
description: Terraform Model Context Protocol (MCP) Tool
executables:
  - tfmcp
provenance:
  formula: tfmcp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
