id: brew:limesuite
display-name: Lime Suite
homepage: https://myriadrf.org/projects/software/lime-suite/
repo: https://github.com/myriadrf/LimeSuite
docs:
  - https://wiki.myriadrf.org/Lime_Suite
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lime Suite became visible to SDR users through distribution packages and through
      the applications it enabled. The project documentation calls out native APIs and
      plugins for SDR stacks such as SoapySDR and GNU Radio, which is why installing the
      package often appears as a prerequisite in radio, lab, and hobbyist workflows
      rather than as an end-user application by itself.
  package-nerd-significance:
    - >
      Lime Suite is a good example of a package whose value is mostly below the visible
      app layer. It packages hardware enablement, command-line diagnostics, shared
      libraries, and plugin hooks in one installable unit, so it sits at the awkward but
      important intersection of drivers, firmware workflows, USB/PCIe devices, and
      scientific tooling.
  project-history:
    - >
      The project grew out of the MyriadRF and LimeSDR ecosystem as the open-source
      driver and tooling suite for LimeSDR boards. Its repository describes Lime Suite
      as software for LMS7002M-based platforms, while its documentation describes
      drivers and tools for LMS7002M RFIC devices and support for LimeSDR boards.
    - >
      The MyriadRF wiki later separated the lineage into Classic Lime Suite and Lime
      Suite NG. That split matters historically because the original package remains the
      familiar dependency for older LimeSDR workflows, while newer boards such as
      LimeSDR-XTRX and LimeSDR-X3 are documented under the NG line.
  related-projects:
    - >
      Related projects include LimeSDR hardware, Lime Suite NG, SoapySDR, GNU Radio, and
      other MyriadRF board support software.
  sources:
    - https://github.com/myriadrf/LimeSuite
    - https://github.com/myriadrf/LimeSuite/blob/master/docs/index.rst
    - https://myriadrf.org/projects/software/lime-suite
    - https://wiki.myriadrf.org/Lime_Suite
  summary:
    - >
      Lime Suite is the classic software layer for Lime Microsystems LMS7002M-based
      software-defined radio hardware, especially the LimeSDR family. In package-manager
      terms it is the thing that makes the hardware usable: user-space libraries, device
      utilities, firmware/FPGA helpers, and integration points for SDR applications.
  timeline:
    - >
      Classic Lime Suite: MyriadRF documented the suite for pre-built packages, source
      builds, hardware tests, and firmware upgrades.
    - >
      Lime Suite NG era: MyriadRF documented newer LimeSDR-XTRX and LimeSDR-X3 hardware
      under Lime Suite NG while still listing older LimeSDR boards for Classic Lime
      Suite.
  usage:
    - >
      Typical packaged usage centers on device discovery, hardware tests, board setup,
      and making LimeSDR devices available to higher-level SDR tools. The Homebrew
      formula exposes utilities such as LimeUtil and LimeQuickTest, matching the
      package's role as a bridge between physical radio hardware and SDR applications.
related-packages:
  - id: brew:soapysdr
    reason: >
      SoapySDR provides the vendor-neutral SDR runtime through which Lime Suite exposes
      LimeSDR hardware to many applications, making it the most direct companion package
      for application interoperability.
    rel: adjacent_workflow
    sources:
      - https://wiki.myriadrf.org/Lime_Suite
      - https://github.com/pothosware/SoapySDR/wiki
  - id: brew:gnuradio
    reason: >
      GNU Radio supplies a graphical and programmable signal-processing environment that
      can consume LimeSDR sources and sinks exposed through Lime Suite integrations.
    rel: adjacent_workflow
    sources:
      - https://wiki.myriadrf.org/Gr-limesdr_Plugin_for_GNURadio
      - https://wiki.gnuradio.org/index.php/Main_Page
category: science
