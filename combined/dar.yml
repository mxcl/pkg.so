id: brew:dar
display-name: DAR
homepage: http://dar.linux.free.fr/doc/index.html
repo: https://github.com/Edrusb/DAR
docs:
  - https://dar.sourceforge.io/doc/from_sources.html
  - https://dar.sourceforge.io/doc/index.html
config-file-location:
  unix:
    - /etc/darrc
    - ~/.darrc
credentials-file-location:
  unix:
    - ~/.netrc
    - ~/.ssh/id_rsa
    - ~/.ssh/id_rsa.pub
history:
  adoption-history:
    - >
      DAR's adoption is visible in its packaging footprint and in the project's own list
      of tools using dar or libdar. The package appeals to Unix backup users who want
      archive slicing, isolated catalogs, strong verification, differential workflows,
      and scriptable command-line operation.
  package-nerd-significance:
    - >
      DAR is interesting packaging terrain because the feature matrix depends on
      optional libraries: compression codecs, libgcrypt and gpgme, librsync, libcurl,
      libssh, filesystem attributes, threading, Python bindings, and documentation
      generators all affect what a distro build can do.
  project-history:
    - >
      DAR documentation frames the tool as a replacement for tar that can use direct
      access on disk media, while also evolving to support tape-like streaming use. Its
      authentication page records signed releases back to April 2002, and its source
      documentation says the project used RCS in 2002, CVS until Q1 2012, then Git.
  related-projects:
    - >
      DAR is related to tar, rsync-style delta workflows through librsync, par2/Parchive
      protection, AVFS, dar-backup tooling, and applications that consume libdar rather
      than shelling out to the dar command.
  sources:
    - https://dar.sourceforge.io/doc/
    - https://dar.sourceforge.io/doc/presentation.html
    - https://dar.sourceforge.io/doc/FAQ.html
    - https://dar.sourceforge.io/doc/authentification.html
    - https://dar.sourceforge.io/doc/from_sources.html
    - https://dar.sourceforge.io/doc/man/dar.html
    - https://dar.sourceforge.io/doc/api_tutorial.html
  summary:
    - >
      DAR, Disk ARchive, is a Unix backup and archiving suite designed as a
      disk-oriented alternative to tar, with slicing, catalogs, differential backups,
      compression, encryption, and libdar for applications.
  timeline:
    - '2002: DAR release signing and early RCS-era source history are documented.'
    - '2012: The project moved from CVS to Git in Q1 2012.'
    - '2017: DAR began cloning its Git repository to GitHub while keeping SourceForge updated.'
    - '2026: Generated Disk ARchive 2.8.x documentation remains published.'
  usage:
    - >
      Users commonly create, list, test, compare, extract, isolate, merge, repair, and
      transform archives with the dar suite, using /etc/darrc or ~/.darrc for defaults
      and options such as remote FTP/SFTP repositories when compiled with the needed
      libraries.
related-packages:
  - id: brew:par2
    reason: >
      Use par2 with DAR to create parity data for archive slices and automatically
      verify or repair damaged slices through DAR's documented par2 target.
    rel: adjacent_workflow
    sources:
      - https://dar.sourceforge.io/doc/usage_notes.html
      - https://dar.sourceforge.io/doc/Features.html
      - https://parchive.github.io/
category: system
package-manager:
  apk: dar
  brew: dar
  debian: dar
  dnf: dar
  macports: dar
  nix: dar
  ubuntu: dar
  zypper: dar
package-manager-url: https://formulae.brew.sh/formula/dar
license: GPL-2.0-or-later
tags:
  - archiver
  - backup
  - cli
  - compression
  - filesystem
  - libdar
description: Backup directory tree and files
executables:
  - dar
  - dar_cp
  - dar_manager
  - dar_slave
  - dar_split
  - dar_xform
provenance:
  formula: dar
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
