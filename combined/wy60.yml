id: brew:wy60
display-name: wy60
homepage: https://code.google.com/archive/p/wy60/
repo: https://code.google.com/archive/p/wy60/source
docs:
  - https://code.google.com/archive/p/wy60
config-file-location:
  unix:
    - ~/.wy60rc
    - ${sysconfdir}/wy60.rc
    - /etc/wy60.rc
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      As a package, wy60 is a preservation and compatibility artifact: tiny, niche, and
      valuable mostly when a site still has software written for a specific family of
      character terminals. It belongs in package repositories because those edge cases
      are exactly where an obscure terminal shim saves a migration.
  project-history:
    - >
      The archived project description and mirrored README describe wy60 as a bridge for
      applications that assume Wyse 60 hardware-terminal escape sequences. It runs
      inside an existing terminal emulator with a working terminfo entry, translates
      between Wyse 60 sequences and the host terminal's escape codes, and launches a
      shell or command inside that emulated environment.
  related-projects:
    - >
      The broader historical context is the Wyse WY-60 hardware terminal and commercial
      Wyse terminal emulators. wy60 is the lightweight Unix-side translator rather than
      a full graphical terminal emulator.
  sources:
    - https://code.google.com/archive/p/wy60/
    - https://code.google.com/archive/p/wy60/wikis/wy60.wiki
    - https://github.com/gutschke/wy60
    - https://terminals-wiki.org/wiki/index.php/Wyse_WY-60
  summary:
    - >
      wy60 is a small curses-based compatibility tool for running legacy software that
      expects Wyse 60 terminal escape sequences. Its historical interest is tied less to
      a public project narrative than to the long tail of business and database
      applications that hard-coded terminal behavior instead of using termcap or
      terminfo.
  usage:
    - >
      The typical use case is preserving old terminal applications when the source
      cannot be changed or when replacing hard-coded Wyse 60 assumptions is impractical.
      The README is explicit that the supported escape-sequence set is limited, but
      intended to be enough for many legacy applications without modification.
category: developer-tools
package-manager:
  brew: wy60
package-manager-url: https://formulae.brew.sh/formula/wy60
license: GPL-2.0-or-later
tags:
  - cli
  - curses
  - terminal-emulator
  - wyse-60
description: Wyse 60 compatible terminal emulator
executables:
  - wy60
provenance:
  formula: wy60
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
