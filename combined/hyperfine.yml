id: brew:hyperfine
display-name: hyperfine
homepage: https://github.com/sharkdp/hyperfine
repo: https://github.com/sharkdp/hyperfine
docs:
  - https://github.com/sharkdp/hyperfine#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      hyperfine became a common package-manager tool for developers benchmarking CLI
      programs, build commands, searches, and small scripts. The input metadata lists
      broad packaging across Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, MacPorts,
      Scoop, winget, Alpine, and openSUSE.
  package-nerd-significance:
    - >
      hyperfine is important because it made respectable microbenchmarking available as
      a single package-manager install. It encodes the small details package maintainers
      and CLI authors care about: shell startup correction, warmups, outlier warnings,
      machine-readable exports, cross-platform behavior, and enough statistics to avoid
      cargo-culting `time` output.
  project-history:
    - >
      The project entered GitHub release metadata in January 2018 and reached 1.0.0 in
      March 2018. Its README establishes the core workflow: pass one or more commands,
      let hyperfine determine a run count, and compare runtimes with statistical
      summaries.
    - >
      Over time, hyperfine grew from a convenient command timer into a reproducible
      benchmarking utility. Release notes added features such as parameter scans, shell
      control, setup and cleanup commands, JSON/CSV/Markdown/AsciiDoc export,
      reference-command comparisons, named outputs, and helper scripts for plotting
      benchmark data.
  related-projects:
    - >
      hyperfine sits alongside shell `time`, GNU time, Criterion-style benchmarking,
      cargo bench, and sharkdp's Rust CLI ecosystem such as fd and bat.
  sources:
    - https://api.github.com/repos/sharkdp/hyperfine/releases?per_page=100
    - https://formulae.brew.sh/formula/hyperfine
    - https://github.com/sharkdp/hyperfine
    - https://raw.githubusercontent.com/sharkdp/hyperfine/master/README.md
  summary:
    - >
      hyperfine is a Rust command-line benchmarking tool for comparing arbitrary shell
      commands with repeated runs, warmups, statistical analysis, outlier detection, and
      export formats.
  timeline:
    - '2018: v0.2.0 and v1.0.0 appeared in GitHub release metadata.'
    - '2021: v1.12.0 expanded JSON output and export behavior.'
    - '2022: v1.13.0 added `--shell=none` for very fast commands.'
    - '2024: v1.19.0 added reference-command comparison and expanded flow controls.'
    - >
      2025: v1.20.0 added reference naming, richer ignored-exit handling, and plotting
      helpers.
  usage:
    - >
      Typical usage is `hyperfine 'command'` or `hyperfine 'cmd1' 'cmd2'`. Users add
      warmup runs for cache effects, preparation commands for cold-cache tests,
      parameter scans for build matrices, `--shell=none` for very fast commands, and
      export flags when results need to be tracked or plotted.
related-packages:
  - id: brew:gnu-time
    reason: >
      Choose GNU Time for one run's detailed CPU, memory, I/O, and process-resource
      report; choose hyperfine for repeated statistical benchmarks and command
      comparisons.
    rel: alternative
    sources:
      - https://github.com/sharkdp/hyperfine/blob/master/doc/hyperfine.1
      - https://www.gnu.org/software/time/manual/time.html
category: developer-tools
package-manager:
  apk: hyperfine
  brew: hyperfine
  debian: hyperfine
  dnf: hyperfine
  macports: hyperfine
  nix: hyperfine
  pacman: hyperfine
  scoop: main/hyperfine
  ubuntu: hyperfine
  winget: sharkdp.hyperfine
  zypper: hyperfine
package-manager-url: https://formulae.brew.sh/formula/hyperfine
license: Apache-2.0 OR MIT
