id: brew:druid
display-name: Apache Druid
homepage: https://druid.apache.org/
repo: https://github.com/apache/druid
docs:
  - https://druid.apache.org/docs/latest
config-file-location:
  unix:
    - conf/druid/_common/common.runtime.properties
    - conf/druid/_common/log4j2.xml
    - conf/druid/broker/runtime.properties
    - conf/druid/coordinator/runtime.properties
    - conf/druid/historical/runtime.properties
    - conf/druid/middleManager/runtime.properties
    - conf/druid/overlord/runtime.properties
credentials-file-location: null
history:
  adoption-history:
    - >
      Druid adoption is tied to workloads that need fast ingest plus interactive
      analytical queries, especially dashboards, operational analytics, and user-facing
      data applications. Its Apache governance, public mailing lists, Slack/community
      pages, official Docker image, and separate Kubernetes operator are signals of an
      ecosystem beyond a single package.
  package-nerd-significance:
    - >
      Druid is significant to package maintainers because it stretches the definition of
      a package: installing it gives local executables, but the software is really a
      cluster with role-specific daemons, config trees, Java runtime requirements, web
      UI, APIs, and external integrations. It is a reminder that data infrastructure
      packages often package orchestration entry points as much as binaries.
  project-history:
    - >
      Druid entered the Apache Incubator on February 28, 2018. During incubation, source
      control moved to ASF Git/GitHub, incubating releases were cut in 2018 and 2019,
      and the project graduated as an Apache top-level project on December 18, 2019.
    - >
      The current Apache Druid repository and website present Druid as a real-time
      analytics database with native ingestion, SQL/native query support, a web console,
      APIs, and deployment paths for local, Docker, and Kubernetes environments.
  related-projects:
    - Apache Druid Operator is maintained separately for Kubernetes deployments.
    - The Druid website source is maintained separately from the main code repository.
    - >
      Druid commonly integrates with streaming and batch ingestion systems and exposes
      HTTP and JDBC query APIs.
  sources:
    - https://incubator.apache.org/projects/druid.html
    - https://druid.apache.org/
    - https://druid.apache.org/docs/latest/
    - https://github.com/apache/druid
    - https://github.com/apache/druid/blob/master/README.md
    - https://github.com/apache/druid-operator
  summary:
    - >
      Apache Druid is a high-performance real-time analytics database aimed at fast
      ingestion, low-latency OLAP queries, operational dashboards, and high-concurrency
      analytical applications. In package-manager terms, the Homebrew formula is less a
      tiny CLI utility and more a local entry point into a distributed data system with
      multiple node-role scripts.
  timeline:
    - '2018-02-28: Druid enters the Apache Incubator.'
    - '2018-07-06: Druid source control moves to ASF Git/GitHub.'
    - '2018-12-12: Druid 0.13.0-incubating is released.'
    - '2019-04-09: Druid 0.14.0-incubating is released.'
    - '2019-12-18: Druid graduates as an Apache top-level project.'
    - >
      Docs era: Apache Druid publishes docs, quickstarts, Docker guidance, and a
      separate Kubernetes operator.
  usage:
    - >
      The Homebrew package exposes scripts for Druid process roles such as broker,
      coordinator, historical, middleManager, overlord, router, and node. Users
      typically start with the quickstart or Docker/Kubernetes deployment paths, then
      configure runtime properties under the documented `conf/druid` layout.
related-packages:
  - id: brew:pinot
    reason: >
      Apache Pinot is an alternative distributed OLAP database with an explicit focus on
      user-facing, very-high-concurrency real-time analytics; evaluate it against Druid
      when that workload emphasis and Pinot's ingestion model better match the
      application.
    rel: alternative
    sources:
      - https://druid.apache.org/
      - https://pinot.apache.org/
      - https://docs.pinot.apache.org/start-here
category: data
package-manager:
  brew: druid
  nix: druid
package-manager-url: https://formulae.brew.sh/formula/druid
license: Apache-2.0
tags:
  - analytics-database
  - cli
  - column-oriented
  - distributed-system
  - olap
  - real-time-analytics
description: High-performance, column-oriented, distributed data store
executables:
  - druid-broker.sh
  - druid-coordinator.sh
  - druid-historical.sh
  - druid-jconsole.sh
  - druid-middleManager.sh
  - druid-node.sh
  - druid-overlord.sh
  - druid-router.sh
provenance:
  formula: druid
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
