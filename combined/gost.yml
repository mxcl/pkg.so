id: brew:gost
display-name: GOST
homepage: https://gost.run/
repo: https://github.com/go-gost/gost
docs:
  - https://gost.run/en
config-file-location:
  unix:
    - ./gost.yml
    - ./gost.json
    - /etc/gost/gost.yml
    - /etc/gost/gost.json
    - ~/gost/gost.yml
    - ~/gost/gost.json
credentials-file-location: null
history:
  adoption-history:
    - >
      GOST is packaged by Homebrew and appears in other package ecosystems in the batch
      input, including Alpine, MacPorts, Nix, Arch, and Ubuntu source packages. Its
      upstream README also documents binary releases, an install script, source builds,
      and Docker usage.
  package-nerd-significance:
    - >
      GOST matters in package indexes because it compresses many proxy and tunneling
      roles into one Go binary with frequent releases and multi-platform assets. It
      overlaps with parts of sshuttle, socat, frp, shadowsocks tooling, and
      reverse-proxy utilities, so clear packaging names and version lines help users
      choose the intended GOST generation.
  project-history:
    - >
      The older v2 documentation presents GOST as a simple security tunnel written in
      Go, covering HTTP(S), SOCKS, Shadowsocks, SNI, TLS, WebSocket, KCP, QUIC, SSH,
      obfs, relay, forward, redirect, and related tunnel patterns. The newer
      go-gost/gost repository and gost.run documentation carry the v3 line.
    - >
      The v3 README shows the project evolving from a single tunnel command into a broad
      network toolbox: multi-port listeners, forwarding chains, TCP/UDP port forwarding,
      reverse proxy and tunnel modes, transparent proxying, DNS resolver/proxy features,
      TUN/TAP and tun2socks, load balancing, routing controls, admission and rate
      limiting, plugins, Prometheus metrics, dynamic configuration, a Web API, GUI, and
      WebUI.
  related-projects:
    - go-gost/core is the core library referenced in v3 release notes.
    - go-gost/x contains extended or experimental features referenced in v3 release notes.
    - go-gost/gostctl and go-gost/gost-ui are GUI and WebUI companions linked from the README.
    - The v2.gost.run documentation is the official legacy documentation surface.
  sources:
    - https://formulae.brew.sh/formula/gost
    - https://github.com/go-gost/gost
    - https://github.com/go-gost/gost/releases.atom
    - https://gost.run/en/
    - https://v2.gost.run/en/
  summary:
    - >
      GOST, short for GO Simple Tunnel, is a Go networking tool for proxying, port
      forwarding, reverse proxying, and tunneling. Its documentation describes three
      main tunnel modes: proxy service, port forwarding, and reverse proxy or intranet
      exposure.
  timeline:
    - '2017: The v2 documentation metadata records an early GOST documentation timestamp.'
    - '2020: The go-gost/gost GitHub repository line is identified by GitHub release metadata.'
    - '2025: v3.2.x releases continue the v3 line with regular changelog entries.'
    - >
      2026: Nightly v3.2.7 builds in the release feed show dependency bumps for
      go-gost/core and go-gost/x.
  usage:
    - >
      Common usage combines listener and connector options to build proxies, forwarding
      chains, reverse tunnels, DNS proxying, transparent proxies, and controlled network
      paths. The configuration-file support matters for repeatable deployments, while
      one-line commands remain useful for temporary tunnel tests.
related-packages: []
category: networking
package-manager:
  apk: gost
  brew: gost
  macports: gost
  nix: gost
  pacman: gost
  ubuntu: golang-github-knqyf263-gost-dev
package-manager-url: https://formulae.brew.sh/formula/gost
license: MIT
tags:
  - cli
  - go
  - http-proxy
  - networking
  - port-forwarding
  - proxy
  - reverse-proxy
  - socks
  - tunnel
description: GO Simple Tunnel - a simple tunnel written in golang
executables:
  - gost
provenance:
  formula: gost
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
