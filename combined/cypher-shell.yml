id: brew:cypher-shell
display-name: Cypher Shell
homepage: https://neo4j.com
repo: https://github.com/neo4j/neo4j
docs:
  - https://neo4j.com/docs/operations-manual/current/cypher-shell
  - https://neo4j.com/docs/operations-manual/current/tools/cypher-shell
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official Neo4j operations documentation presents Cypher Shell as a supported
      administrative and query tool. It can be installed separately from Neo4j and
      connected to a live DBMS, which is why it appears naturally in package managers
      and automation environments.
  package-nerd-significance:
    - >
      Cypher Shell matters to package nerds because it decouples graph-database
      operations from the server install. A Homebrew or distro package can give
      developers a lightweight client for local scripts, CI jobs, and remote Neo4j
      administration.
  project-history:
    - >
      Neo4j kept Cypher Shell in a standalone neo4j/cypher-shell repository for the 1.1
      era; that repository's README says newer versions moved into the main neo4j/neo4j
      repository under community/cypher-shell. The standalone repository is now
      archived, while the active source lives with Neo4j itself.
    - >
      The old README documents a build system that produced runnable scripts, zip
      packages, Debian packages, and RPM packages, which shows Cypher Shell was treated
      early as a separately distributable command-line tool even though it was tightly
      coupled to Neo4j.
  related-projects:
    - Neo4j is the graph database Cypher Shell connects to.
    - Cypher is the query language executed by Cypher Shell.
    - Neo4j Browser is the graphical counterpart for interactive query work.
  sources:
    - https://github.com/neo4j/neo4j
    - https://github.com/neo4j/cypher-shell
    - https://github.com/neo4j/cypher-shell#readme
    - https://neo4j.com/docs/operations-manual/current/cypher-shell/
    - https://api.github.com/repos/neo4j/neo4j
    - https://api.github.com/repos/neo4j/cypher-shell
  summary:
    - >
      Cypher Shell is Neo4j's command-line interface for running Cypher queries and
      administrative commands against a Neo4j database. It is the
      package-manager-friendly way to script graph database sessions without opening
      Neo4j Browser.
  timeline:
    - '2016: neo4j/cypher-shell standalone repository created.'
    - '2018: Standalone repository tag history includes Neo4j 3.3 and 3.4 era tags.'
    - >
      2023: Archived standalone README points users to community/cypher-shell inside
      neo4j/neo4j.
    - >
      2026: Current Neo4j Operations Manual documents Cypher Shell as part of Neo4j DBMS
      tooling.
  usage:
    - >
      Users run cypher-shell interactively, pass a Cypher string, pipe files, or execute
      files containing Cypher statements. The current manual documents connection
      options for address, username, password, database, access mode, logging, output
      format, parameters, transactions, and scripting behavior.
related-packages:
  - id: brew:neo4j
    reason: >
      Install Neo4j when you also need a local graph-database server; Cypher Shell is
      the lightweight client used to query and administer that server locally or
      remotely.
    rel: adjacent_workflow
    sources:
      - https://neo4j.com/docs/operations-manual/current/cypher-shell/
      - https://neo4j.com/docs/operations-manual/current/
category: data
package-manager:
  apk: cypher-shell
  brew: cypher-shell
package-manager-url: https://formulae.brew.sh/formula/cypher-shell
license: GPL-3.0-only
tags:
  - cli
  - cypher
  - database-shell
  - graph-database
  - neo4j
description: Command-line shell where you can execute Cypher against Neo4j
executables:
  - cypher-shell
provenance:
  formula: cypher-shell
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
