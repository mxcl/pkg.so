id: brew:g-ls
display-name: g
homepage: https://equationzhao.github.io/g/
repo: https://github.com/Equationzhao/g
docs:
  - https://equationzhao.github.io/g
  - https://github.com/Equationzhao/g#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/g/g.yaml
    - ~/.config/g/g.yaml
  macos: ~/Library/Application Support/g/g.yaml
  windows: '%AppData%\g\g.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation notes document Arch AUR, Homebrew, a Homebrew tap, MacPorts,
      Scoop, pre-built release artifacts, deb packages, install scripts, and `go
      install`. That spread follows the usual adoption route for Go CLIs: direct binary
      releases, Go module installation, and native package-manager recipes.
  package-nerd-significance:
    - >
      g is interesting in the crowded modern-ls category because it combines
      exa/eza-style visual listing, lsd-style icons, git metadata, multiple
      machine-readable output formats, and shell integration in a single Go binary. For
      package maintainers, the main wrinkle is name collision: the package is `g-ls` in
      Homebrew while the executable is `g`.
  project-history:
    - >
      The repository was created in April 2023, and GitHub Releases show v0.2.1
      published the same day. The README frames g as an enhanced directory lister rather
      than a file manager, adding visual layouts and metadata to the familiar `ls` role.
    - >
      The project continued through frequent 0.x releases; by 2025 it had reached the
      0.30 series, and the visible release feed shows v0.31.2 in 2026. The bundled
      manual documents a broad option surface for display formats, filtering, fuzzy
      indexing, shell initialization, sorting, and metadata columns.
  related-projects:
    - >
      The README says g is highly inspired by exa/eza, lsd, and ls-go. It also describes
      zoxide- and fzf-like fuzzy path matching, placing g near both modern `ls`
      replacements and shell-navigation helpers.
  sources:
    - https://api.github.com/repos/Equationzhao/g
    - https://github.com/Equationzhao/g
    - https://github.com/Equationzhao/g/releases
    - https://raw.githubusercontent.com/Equationzhao/g/master/README.md
    - https://raw.githubusercontent.com/Equationzhao/g/master/docs/man.md
  summary:
    - >
      g is a Go-based, cross-platform `ls` alternative packaged in Homebrew as `g-ls`
      and installed as the `g` executable. The upstream README describes it as
      feature-rich and customizable, with icons, colors, multiple layouts, git status
      integration, fuzzy path matching, and hyperlink support.
  timeline:
    - '2023: GitHub repository created.'
    - '2023: Release v0.2.1 published.'
    - '2025: Release v0.30.0 published.'
    - '2026: Release v0.31.2 published.'
  usage:
    - >
      Users run `g path(s)` as an `ls` replacement and enable options such as icons,
      long format, tree layout, JSON, markdown, CSV, git status, MIME and charset
      display, fuzzy path matching, and shell initialization scripts for Bash, Zsh,
      Fish, PowerShell, and Nushell.
related-packages:
  - id: brew:eza
    reason: >
      Choose eza when you want the faster, maintained exa successor with familiar
      modern-ls layouts and Unix metadata; g's official comparison highlights g instead
      for extra structured formats, MIME, and charset output.
    rel: alternative
    sources:
      - https://github.com/Equationzhao/g#alternatives
      - https://github.com/eza-community/eza#readme
  - id: brew:lsd
    reason: >
      Choose lsd for an ls-compatible, color-and-icon-focused alternative; g's official
      README lists it among the projects that inspired g.
    rel: alternative
    sources:
      - https://github.com/Equationzhao/g#alternatives
      - https://github.com/lsd-rs/lsd#readme
category: system
package-manager:
  apk: g++
  brew: g-ls
  debian: g++
  dnf: gcc-c++
  macports: g-ls
  nix: g-ls
  scoop: main/g
  ubuntu: g++
package-manager-url: https://formulae.brew.sh/formula/g-ls
license: MIT
tags:
  - cli
  - cross-platform
  - file-management
  - go
  - ls
  - terminal
description: Powerful and cross-platform ls
executables:
  - g
provenance:
  formula: g-ls
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
