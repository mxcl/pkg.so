id: cask:mend
display-name: Mend CLI
homepage: https://www.mend.io/
repo: null
docs:
  - https://docs.mend.io/legacy-sca/latest/mend-cli-release-notes
  - https://docs.mend.io/platform/latest/authenticate-your-login-for-the-mend-cli
config-file-location:
  unix: ~/.mend
credentials-file-location: null
history:
  adoption-history:
    - >
      Mend positions the CLI as its automation-oriented interface for
      application-security scans in developer workstations and CI/CD pipelines. Official
      migration guidance recommends it as the successor to workflows built around the
      older Unified Agent.
  package-nerd-significance:
    - >
      The package is notable as a self-updating, vendor-distributed security scanner
      packaged as a Homebrew cask rather than a conventional source-built formula. It
      exposes several scanning engines through one executable and supports
      non-interactive environment-variable authentication for CI.
  project-history:
    - >
      Mend developed the CLI as a unified entry point for software-composition analysis,
      static application-security testing, and related Mend services. Its release notes
      document an actively maintained calendar-versioned product, while migration
      documentation describes consolidation of older Unified Agent workflows into the
      CLI.
  related-projects:
    - Mend Unified Agent is the legacy scanner addressed by the official migration guide.
    - The Mend Platform receives and presents scan results uploaded by the CLI.
  sources:
    - https://docs.mend.io/legacy-sca/latest/mend-cli-release-notes
    - https://docs.mend.io/platform/latest/authenticate-your-login-for-the-mend-cli
    - https://docs.mend.io/wsk/migrating-to-the-mend-cli-from-the-unified-agent
  summary:
    - >
      Mend CLI is Mend.io's command-line application-security scanner. It runs
      dependency, source-code, and other supported security analyses locally or in CI
      and can upload findings to the Mend Platform.
  timeline:
    - '2024: Official documentation describes Mend CLI migration paths from the Unified Agent.'
    - '2026-03: Authentication is unified across Mend scan engines.'
    - '2026-07: The input package record reports release 26.7.1-hf1.'
  usage:
    - >
      Users authenticate interactively with `mend auth login` or supply `MEND_URL`,
      `MEND_EMAIL`, `MEND_USER_KEY`, and, when needed, `MEND_ORGANIZATION` in
      automation. Commands such as `mend dep` run supported scans, while `mend config`
      manages automatic-update and proxy settings.
category: security
package-manager:
  brew-cask: mend
package-manager-url: https://formulae.brew.sh/cask/mend
tags:
  - application-security
