id: brew:gdbgui
display-name: gdbgui
homepage: https://www.gdbgui.com/
repo: https://github.com/cs01/gdbgui
docs:
  - https://www.gdbgui.com/
  - https://www.gdbgui.com/api
  - https://www.gdbgui.com/guides
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project site says gdbgui is used by thousands of developers, including
      engineers at Google and college computer science course instructors, and notes
      appearances in Rust source and C++ Weekly.
    - >
      Its adoption niche is developers who want GDB's debugger engine without living
      entirely inside the GDB command prompt or a full IDE.
  package-nerd-significance:
    - >
      gdbgui is interesting as a package because it packages a debugger frontend as a
      command-line-launched web app: it depends on the system debugger culture of GDB
      while delivering a browser UI through Python packaging and Homebrew-style
      executable installation.
    - >
      It is also a good example of a package that turns an old CLI tool into a local web
      workflow without replacing the underlying debugger.
  project-history:
    - >
      The official site describes gdbgui as a browser-based frontend to the GNU Debugger
      for C, C++, Go, and Rust. It identifies Chad Smith as creator and maintainer and
      lists GitHub and PyPI as distribution channels.
    - >
      The GitHub README points to the same documentation and source repository, making
      the project a Python-distributed CLI/server around a browser UI rather than a
      traditional desktop IDE.
  related-projects:
    - gdbgui is directly related to GDB and gdbserver.
    - >
      It overlaps conceptually with debugger frontends and IDE debuggers, while
      remaining a standalone browser-based frontend.
  sources:
    - https://github.com/cs01/gdbgui
    - https://github.com/cs01/gdbgui/releases
    - https://www.gdbgui.com/
    - https://www.gdbgui.com/guides
  summary:
    - >
      gdbgui is a browser-based frontend to GDB that starts from a terminal command and
      opens a web interface for breakpoints, stack traces, source viewing, and debugger
      control.
  timeline:
    - '2020: Official GitHub releases show the 0.14.x series.'
    - '2021: Official GitHub releases show the 0.15.0 series.'
    - '2025: Official GitHub releases show version 0.15.3.0.'
  usage:
    - >
      Users run gdbgui from the terminal to start the server; the documentation says a
      browser tab opens automatically and can load a binary, set breakpoints, run, step,
      and inspect program state.
    - >
      Because gdbgui is a server, the official guides document remote debugging by
      running gdbgui on a remote machine and connecting from a local browser, along with
      compatibility with gdbserver.
related-packages:
  - id: brew:gdb
    reason: >
      gdbgui requires the GDB debugging engine; install or select an appropriate GDB
      executable locally before using its browser frontend or connecting to gdbserver.
    rel: adjacent_workflow
    sources:
      - https://www.gdbgui.com/
      - https://www.gdbgui.com/guides/
category: developer-tools
