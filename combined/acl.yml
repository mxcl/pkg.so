id: brew:acl
display-name: acl
homepage: https://savannah.nongnu.org/projects/acl/
repo: https://git.savannah.nongnu.org/cgit/acl.git
docs:
  - https://git.savannah.nongnu.org/cgit/acl.git/tree/man
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      acl is widely packaged because it exposes common filesystem administration tools
      rather than an application-specific workflow. The input facts list it in Homebrew,
      Debian, Ubuntu, Fedora/dnf, Alpine, Arch/pacman, Nix, and openSUSE/zypper.
    - >
      Its package history follows the Unix pattern of small core utilities with man
      pages, C library APIs, and distribution integration, especially around
      getfacl/setfacl behavior, symlink handling, restore mode, translations, and
      filesystem semantics.
  package-nerd-significance:
    - >
      acl is package-nerd significant because it is small, old, security-sensitive
      system plumbing. A packaging error can affect backups, restores, permissions, and
      recursive filesystem operations.
    - >
      It is also a classic example of Linux userland split into a library plus
      command-line tools, with man pages carrying much of the public interface contract.
  project-history:
    - >
      The Savannah README identifies acl as the access control list package and points
      to acl(5) for general ACL information. The man pages document getfacl, setfacl,
      chacl, and the ACL library interfaces.
    - >
      The setfacl manual carries 2000 documentation copyright, while the acl(5) manual
      describes POSIX Access Control Lists as finer-grained discretionary access rights
      for files and directories. The official changelog tracks the modern package line
      from early 2.2 releases through later security, portability, and build-system
      work.
  related-projects:
    - >
      Related system components include Linux filesystems, POSIX permission bits,
      extended attributes, libacl, getfacl, setfacl, and chmod.
  sources:
    - https://git.savannah.nongnu.org/cgit/acl.git/plain/doc/CHANGES
    - https://git.savannah.nongnu.org/cgit/acl.git/plain/man/man1/setfacl.1
    - https://git.savannah.nongnu.org/cgit/acl.git/plain/man/man5/acl.5
    - https://git.savannah.nongnu.org/cgit/acl.git/tree/README
    - source_facts.package-manager
  summary:
    - >
      acl is the Linux access control list package, providing commands and library
      support for POSIX-style filesystem ACLs.
  timeline:
    - '2000: setfacl manual documentation copyright begins.'
    - '2002: acl(5) manual documentation copyright begins.'
    - '2003: Official changelog records acl 2.2.5 and related libacl changes.'
    - '2009: acl 2.2.48 fixes recursive symlink and restore behavior.'
    - '2021: acl 2.3.0 modernizes build infrastructure and hardens recursive operations.'
    - '2026: acl 2.4.0 changelog records security and robustness improvements.'
  usage:
    - >
      Typical use is administrative: getfacl prints ACLs, setfacl sets or restores ACLs,
      and chacl changes ACLs on files and directories.
    - >
      Because ACL behavior is tied to filesystem support and Unix permissions, the
      package is usually used by scripts, sysadmins, packaging tests, and tools that
      need reproducible permission metadata.
related-packages:
  - id: brew:attr
    reason: >
      Use attr alongside acl to inspect and modify general filesystem extended
      attributes when a permissions workflow also needs non-ACL metadata.
    rel: adjacent_workflow
    sources:
      - https://savannah.nongnu.org/projects/acl
      - https://savannah.nongnu.org/projects/attr
category: system
package-manager:
  apk: acl
  brew: acl
  debian: acl
  dnf: acl
  nix: acl
  pacman: acl
  ubuntu: acl
  zypper: acl
package-manager-url: https://formulae.brew.sh/formula/acl
license: GPL-2.0-or-later AND LGPL-2.1-or-later
tags:
  - access-control
  - acl
  - cli
  - filesystem
  - posix
description: Commands for manipulating POSIX access control lists
executables:
  - chacl
  - getfacl
  - setfacl
provenance:
  formula: acl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
