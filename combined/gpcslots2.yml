  - https://sourceforge.net/projects/gpcslots2
  - https://sourceforge.net/projects/gpcslots2/files
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears narrow. The official SourceForge page reports the project in the
      Console Games category and shows very low weekly download activity in the browsed
      project metadata, so its package-manager presence is mostly useful for preserving
      availability of a small terminal game.
  package-nerd-significance:
    - >
      For package collectors, gpcslots2 is an example of the long tail that Homebrew and
      SourceForge make installable: a single-purpose console game with little
      configuration surface and a small upstream footprint.
  project-history:
    - >
      The SourceForge project page describes gpcslots2 as a free and open source casino
      text-console game, credited to mikeeusa2 and noekalin. Its file area shows the
      gpcslots2_0-4-5b archive dated 2012-08-26, while the project page lists the same
      registration date.
  related-projects:
    - >
      Related package-manager context includes other terminal and console games,
      especially small casino, dice, and roulette games distributed as scripts or simple
      native executables.
  sources:
    - https://sourceforge.net/p/gpcslots2/code
    - https://sourceforge.net/projects/gpcslots2/
    - https://sourceforge.net/projects/gpcslots2/files/
  summary:
    - >
      gpcslots2 is a small Perl console casino game hosted on SourceForge, packaged for
      Homebrew as a niche text-mode game rather than as a broadly adopted developer or
      system tool.
  timeline:
    - '2012-08-26: SourceForge project registration and gpcslots2_0-4-5b file timestamp.'
    - '2019-04-03: SourceForge file area records a notes entry.'
    - >
      2020-12-17: SourceForge project metadata records a later project update and
      signing entry.
  usage:
    - >
      The official project description lists slot machines, roulette variants, dice
      games, a bank, a stock market, Sic Bo, and casino play. Homebrew exposes it as the
      `gpcslots2` executable.
related-packages: []
