id: brew:mp3splt
display-name: mp3splt
homepage: https://mp3splt.sourceforge.net/mp3splt_page/home.php
repo: https://github.com/mp3splt/mp3splt
docs:
  - https://mp3splt.sourceforge.net/mp3splt_page/documentation.php
  - https://mp3splt.sourceforge.net/mp3splt_page/documentation/libmp3splt_api/index.html
  - https://github.com/mp3splt/mp3splt#readme
config-file-location:
  unix: ~/.mp3splt
credentials-file-location:
  unix: ~/.mp3splt
history:
  project-history:
    - >
      The tool's technical role is lossless segmentation of compressed audio. It can
      split large files into tracks, use splitpoints from CDDB, local XMCD/CDDB files,
      or CUE sheets, detect silence, trim by silence, handle Mp3Wrap and AlbumWrap
      files, preserve or write MP3 ID3 tags, and process Ogg Vorbis comments. libmp3splt
      became the reusable engine behind the CLI and GUI, with API documentation
      describing plugin-oriented splitting support for MP3 via libmad, Ogg Vorbis via
      libvorbis, and FLAC.
  sources:
    - https://formulae.brew.sh/formula/mp3splt
    - https://github.com/mp3splt/mp3splt
    - https://mp3splt.sourceforge.net/mp3splt_page/about.php
    - https://mp3splt.sourceforge.net/mp3splt_page/authors.php
    - https://mp3splt.sourceforge.net/mp3splt_page/documentation/libmp3splt_api/index.html
    - https://mp3splt.sourceforge.net/mp3splt_page/home.php
  summary:
    - >
      mp3splt is the command-line part of the Mp3Splt Project, a suite for splitting
      MP3, Ogg Vorbis, and native FLAC files by time range or splitpoint without
      decoding. The project names Matteo Trotta as author and main maintainer and
      Alexandru Munteanu as maintainer. Its official pages divide the project into
      libmp3splt, the mp3splt CLI, and the mp3splt-gtk graphical frontend.
  usage:
    - >
      The project history includes releases that expanded beyond the original MP3/Ogg
      niche. The homepage lists FLAC support with the 0.9.0 and 2.6 releases in 2013 and
      bit-reservoir handling for gapless playback in 2014 releases. A GitHub mirror
      notes migration from the original SourceForge project in 2020. In package
      managers, mp3splt is the user-facing CLI while libmp3splt is often packaged
      separately as the shared splitting library, which matches the project's own split
      between application, library, and GTK frontend.
related-packages:
  - id: brew:mp3wrap
    reason: >
      Use Mp3Wrap to create a playable indexed MP3 bundle, then use mp3splt's documented
      wrap mode to list or recover the original files.
    rel: adjacent_workflow
    sources:
      - https://mp3wrap.sourceforge.net/man.html
      - https://mp3splt.sourceforge.net/mp3splt_page/documentation/man.html
category: media
package-manager:
  apk: mp3splt
  brew: mp3splt
  debian: libmp3splt
  macports: mp3splt
  ubuntu: libmp3splt
package-manager-url: https://formulae.brew.sh/formula/mp3splt
license: GPL-2.0-or-later
tags:
  - audio-splitting
  - cli
  - flac
  - frame-accurate
  - lossless
  - mp3
  - ogg-vorbis
description: Command-line interface to split MP3 and Ogg Vorbis files
executables:
  - mp3splt
provenance:
  formula: mp3splt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
