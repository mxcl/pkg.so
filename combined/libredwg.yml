id: brew:libredwg
display-name: GNU LibreDWG
homepage: https://www.gnu.org/software/libredwg/
repo: https://git.savannah.gnu.org/git/libredwg.git
docs:
  - https://www.gnu.org/software/libredwg/manual
  - https://www.gnu.org/software/libredwg
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LibreDWG has mattered most to CAD, GIS, and document-conversion users who need
      batchable access to DWG data in free software environments. The manual names
      FreeCAD and GRASS GIS as projects using DWG or specifically LibreDWG, and mentions
      plans around SolveSpace, LibreCAD, FreeCAD, OpenSCAD, and PythonCAD.
    - >
      Its adoption has been cautious because DWG compatibility is a moving target and
      because writing newer DWG versions is harder than reading them. That niche,
      however, is exactly why distributions package it: even partial DWG support is
      valuable when users need automated inspection, conversion, text search, layer
      listing, SVG/PostScript output, DXF, JSON, or GeoJSON workflows.
  package-nerd-significance:
    - >
      LibreDWG is a classic package-nerd package: legally and technically difficult
      format support, a GNU maintenance story, CLI utilities, reverse-engineered
      coverage tables, and bindings/converters that unblock other packages. It is also a
      reminder that data-liberation libraries often ship as humble formulae even when
      their underlying work is years of file-format archaeology.
  project-history:
    - >
      The GNU project page describes LibreDWG as a free replacement for OpenDWG
      libraries and says it is based on LibDWG, originally written by Felipe Castro. The
      manual records the project lineage more specifically: LibreDWG came out of code
      from the QCad Community Edition product from RibbonSoft, and the old libdwg code
      was forked to LibreDWG in 2009.
    - >
      LibreDWG's long-running engineering problem is that DWG is proprietary. The manual
      states that the format had to be reverse-engineered and that, for LibreDWG 0.13.4
      dated March 17, 2026, coverage was approximately 99%, with reading support across
      many DWG revisions and writing support still more constrained for newer formats.
  related-projects:
    - >
      Related projects include LibDWG, QCad Community Edition, FreeCAD, GRASS GIS,
      LibreCAD, SolveSpace, OpenSCAD, PythonCAD, libdxfrw, libopencad, ACadSharp,
      OpenDWG, and the Open Design Alliance ecosystem.
  sources:
    - https://github.com/LibreDWG/libredwg
    - https://www.gnu.org/software/libredwg/
    - https://www.gnu.org/software/libredwg/manual/LibreDWG.html
  summary:
    - >
      GNU LibreDWG is a GPLv3-or-later C library and command-line tool set for reading
      and writing AutoCAD DWG files. Its package-manager value is straightforward: it
      gives free software systems a scriptable DWG decoder/encoder and conversion
      utilities without relying on proprietary OpenDWG/ODA libraries.
  timeline:
    - '2009: The old libdwg code was forked to LibreDWG.'
    - >
      2010-2025: The GNU manual copyright range records continuing FSF documentation
      maintenance.
    - '2026-03-17: GNU LibreDWG manual version 0.13.4 dated.'
    - '2026-03-19: GNU generated manual page last updated.'
  usage:
    - >
      Packaged users usually encounter LibreDWG through tools such as dwgread, dwgwrite,
      dwgrewrite, dwg2dxf, dxf2dwg, dwg2SVG, dwggrep, and dwglayers, or by linking C
      programs against libredwg. The manual explicitly notes that programs should link
      with -lredwg, because the shared object is named libredwg and -llibredwg would
      look for a non-existent liblibredwg.
related-packages:
  - id: cask:freecad
    reason: >
      FreeCAD is a graphical CAD application for working with designs, while LibreDWG
      supplies programmatic DWG decoding and conversion; GNU's manual identifies FreeCAD
      among the relevant LibreDWG consumers.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/libredwg/manual/html_node/Overview.html
      - https://www.freecad.org/features.php
category: media
