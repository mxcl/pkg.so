id: brew:dynaconf
display-name: Dynaconf
homepage: https://www.dynaconf.com/
repo: https://github.com/dynaconf/dynaconf
docs:
  - https://www.dynaconf.com/
  - https://www.dynaconf.com/cli
  - https://www.dynaconf.com/configuration
config-file-location:
  unix:
    - settings.toml
    - .secrets.toml
credentials-file-location:
  unix: .secrets.toml
history:
  adoption-history:
    - >
      Adoption has come mainly from Python application teams that want one settings
      layer across local files, environment variables, framework integrations, and
      secret stores. Its packaging footprint includes PyPI and Homebrew, with the
      Homebrew formula tracking the 3.x line and PyPI showing active releases through
      2026.
  package-nerd-significance:
    - >
      Dynaconf is notable in package-manager culture because it packages a common
      application concern, configuration layering, as both a library and a CLI. It sits
      between framework-native settings systems, dotenv loaders, and secret-store
      clients, making it useful to compare with Pydantic Settings, environs,
      python-decouple, django-environ, and Hydra.
  project-history:
    - >
      Dynaconf's public package history begins in August 2015, when the 0.1.0 release
      was uploaded to PyPI and the GitHub repository was created. The README presents it
      as configuration management for Python, inspired by the 12-factor app approach,
      with support for multiple file formats, environment overlays, validation,
      HashiCorp Vault, Redis, Django, Flask, and a CLI.
    - >
      The project grew into a long-lived Python packaging fixture rather than a one-off
      framework extension. Its documentation and README emphasize generated
      `settings.toml` and `.secrets.toml` files, environment-variable overrides, and a
      `dynaconf` executable for init, list, write, validate, and export workflows.
  related-projects:
    - >
      Related projects include Pydantic Settings, python-dotenv, environs,
      python-decouple, django-environ, Flask configuration, Django settings, HashiCorp
      Vault, Redis, and the Rust-oriented Hydroconf project linked from the Dynaconf
      README.
  sources:
    - https://github.com/dynaconf/dynaconf#readme
    - https://api.github.com/repos/dynaconf/dynaconf
    - https://pypi.org/pypi/dynaconf/json
    - https://www.dynaconf.com/
    - https://formulae.brew.sh/formula/dynaconf
  summary:
    - >
      Dynaconf is a Python configuration-management library and CLI for layered
      settings, environment-variable overrides, validation, and secrets handling across
      plain Python projects and web frameworks.
  timeline:
    - '2015: GitHub repository is created and Dynaconf 0.1.0 appears on PyPI.'
    - >
      2020s: Documentation highlights Django, Flask, Vault, Redis, multiple file
      formats, validation, and CLI workflows.
    - >
      2026: PyPI shows active 3.x releases, while Homebrew packages Dynaconf as a
      CLI-accessible Python tool.
  usage:
    - >
      Typical usage starts with `dynaconf init`, which creates a project settings file
      and optional secrets file, then application code imports a `Dynaconf` settings
      object. Users can override configuration with prefixed environment variables and
      can move secrets to `.secrets.*`, Vault, or Redis.
related-packages:
  - id: brew:redis
    reason: >
      Use Redis with Dynaconf when multiple application instances need a shared external
      settings or secrets store instead of project-local files.
    rel: adjacent_workflow
    sources:
      - https://www.dynaconf.com/
      - https://redis.io/docs/latest/
category: developer-tools
package-manager:
  brew: dynaconf
  dnf: python3-dynaconf
package-manager-url: https://formulae.brew.sh/formula/dynaconf
license: MIT
tags:
  - cli
  - configuration
  - django
  - environment-variables
  - flask
  - python
  - settings
description: Configuration Management for Python
executables:
  - dynaconf
provenance:
  formula: dynaconf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
