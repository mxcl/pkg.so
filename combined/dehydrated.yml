id: brew:dehydrated
display-name: dehydrated
homepage: https://dehydrated.io
repo: https://github.com/dehydrated-io/dehydrated
docs:
  - https://github.com/dehydrated-io/dehydrated/tree/master/docs
  - https://github.com/dehydrated-io/dehydrated/wiki
  - https://github.com/dehydrated-io/dehydrated#readme
config-file-location:
  unix:
    - /etc/dehydrated/config
    - /usr/local/etc/dehydrated/config
    - $PWD/config
    - $SCRIPTDIR/config
credentials-file-location:
  unix: ${BASEDIR}/accounts
history:
  adoption-history:
    - >
      dehydrated became a package-manager-friendly ACME client because it is a single
      script with familiar Unix dependencies. Homebrew packages it, and the upstream
      documentation is built around editable config files, domains.txt, hooks,
      cron-style renewal, and existing web-server integration.
  package-nerd-significance:
    - >
      dehydrated is significant because it shows the Unix-shell version of ACME
      automation: no daemon, no embedded web server, and no large runtime. For packagers
      and sysadmins, that makes it easy to audit, patch, hook into local deployment
      scripts, and run on minimal systems.
  project-history:
    - >
      The README describes dehydrated as a relatively simple bash-compatible client that
      uses OpenSSL for key and certificate handling and common Unix tools such as cURL,
      sed, grep, awk, and mktemp for the rest. It supports ACME v1 and ACME v2,
      including wildcard certificates.
    - >
      The release history starts with v0.1.0 in April 2016, reached v0.5.0 in January
      2018, and continued through v0.7.2 in May 2025. The README notes that the
      repository is officially maintained by ZeroSSL.
  related-projects:
    - >
      dehydrated belongs to the ACME client ecosystem around Let's Encrypt, ZeroSSL,
      OpenSSL, and web-server or DNS-provider hook scripts.
  sources:
    - https://github.com/dehydrated-io/dehydrated
    - https://github.com/dehydrated-io/dehydrated/tree/master/docs
    - https://github.com/dehydrated-io/dehydrated/blob/master/docs/man/dehydrated.1
    - https://github.com/dehydrated-io/dehydrated/blob/master/docs/examples/config
    - https://github.com/dehydrated-io/dehydrated/releases/tag/v0.1.0
    - https://github.com/dehydrated-io/dehydrated/releases/tag/v0.5.0
    - https://github.com/dehydrated-io/dehydrated/releases/tag/v0.7.0
    - https://github.com/dehydrated-io/dehydrated/releases/tag/v0.7.2
    - https://formulae.brew.sh/formula/dehydrated
  summary:
    - >
      dehydrated is a shell-script ACME client for obtaining and renewing TLS
      certificates from ACME certificate authorities such as Let's Encrypt and ZeroSSL.
  timeline:
    - '2016: v0.1.0 is published.'
    - '2018: v0.5.0 is published and the man page records 2015-2018 authorship.'
    - '2020: v0.7.0 is published.'
    - '2025: v0.7.2 is published.'
  usage:
    - >
      Administrators use dehydrated to register an ACME account, list certificate names
      in domains.txt, configure an HTTP, DNS, or TLS-ALPN challenge, and run `dehydrated
      -c` from cron or another scheduler. The man page emphasizes that certificates are
      normally stored under the configured certificate directory and renewed regularly.
related-packages:
  - id: brew:certbot
    reason: >
      Choose Certbot when automated web-server configuration and its official Apache,
      Nginx, or DNS plugin ecosystem are preferable to dehydrated's shell-hook model.
    rel: alternative
    sources:
      - https://eff-certbot.readthedocs.io/en/stable/using.html
      - https://github.com/dehydrated-io/dehydrated#readme
  - id: brew:acme.sh
    reason: >
      Choose acme.sh when you want a shell ACME client with many DNS-provider
      integrations included directly rather than selecting or writing dehydrated hooks.
    rel: alternative
    sources:
      - https://github.com/acmesh-official/acme.sh#readme
      - https://github.com/dehydrated-io/dehydrated/wiki
  - id: brew:lego
    reason: >
      Choose lego when you want a single Go binary, an embeddable Go library, or
      integrated support for a large set of DNS providers.
    rel: alternative
    sources:
      - https://go-acme.github.io/lego/
      - https://github.com/dehydrated-io/dehydrated#readme
category: networking
package-manager:
  apk: dehydrated
  brew: dehydrated
  debian: dehydrated
  dnf: dehydrated
  nix: dehydrated
  pacman: dehydrated
  ubuntu: dehydrated
  zypper: dehydrated
package-manager-url: https://formulae.brew.sh/formula/dehydrated
license: MIT
tags:
  - acme
  - certificates
  - cli
  - letsencrypt
  - shell
  - tls
description: LetsEncrypt/acme client implemented as a shell-script
executables:
  - dehydrated
provenance:
  formula: dehydrated
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
