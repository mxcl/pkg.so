id: brew:gosu
display-name: Gosu
homepage: https://gosu-lang.github.io/
repo: https://github.com/gosu-lang/gosu-lang
docs:
  - https://gosu-lang.github.io/docs.html
  - https://gosu-lang.github.io/grammar.html
  - https://gosu-lang.github.io/quickstart.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gosu has an unusual adoption profile for a package-manager language runtime: it
      has enterprise use through Guidewire, but the open-source distribution also
      appears in developer package managers such as Homebrew, Nix, Alpine, Debian, and
      Ubuntu in the batch input. The official docs also point to Maven and Gradle usage
      where dependencies can be resolved without a local Gosu installation.
  package-nerd-significance:
    - >
      Gosu is significant to package nerds because it sits between enterprise platform
      language and standalone JVM language runtime. It is not as broadly culturally
      visible as Scala, Kotlin, Groovy, or Clojure, but package indexes preserve its
      open-source toolchain and make its command-line distribution discoverable outside
      Guidewire installations.
  project-history:
    - >
      Gosu originated in the Guidewire ecosystem and later became an open-source JVM
      language. Guidewire's developer page describes Gosu as an open-source language
      used in property-and-casualty insurance enterprises, while the gosu-lang project
      pages present the language as a general JVM language rather than only a product
      extension language.
    - >
      The GitHub project and gosu-lang.github.io documentation focus on build, language,
      and learning surfaces: Maven builds, Gosu Lab, the IntelliJ plugin, Gradle/Maven
      starter projects, grammar documentation, and examples. Release feed entries show
      Maven-release-plugin generated tags for the 1.18 line.
  related-projects:
    - >
      Guidewire products are the enterprise environment from which Gosu is documented by
      Guidewire.
    - The Gosu IntelliJ plugin is the official recommended IDE path in the project docs.
    - >
      Manifold is linked from the Gosu site as a Java compiler plugin carrying some
      Gosu-like benefits into Java.
  sources:
    - https://formulae.brew.sh/formula/gosu
    - https://github.com/gosu-lang/gosu-lang
    - https://github.com/gosu-lang/gosu-lang/releases.atom
    - https://gosu-lang.github.io/
    - https://gosu-lang.github.io/docs.html
    - https://gosu-lang.github.io/quickstart.html
    - >
      https://www.guidewire.com/developers/developer-tools-and-guides/gosu-programming-language
  summary:
    - >
      Gosu is a pragmatic statically typed programming language for the JVM. The
      official project pages describe it as designed for Java developers, with Java
      interoperability, type inference, enhancements, structural typing, lambdas,
      null-safety operators, program files, and support for scripting-style use through
      classpath statements and shebangs.
  timeline:
    - >
      2014: The gosu-lang/gosu-lang GitHub repository line is identified by GitHub
      release metadata.
    - '2016: The official site news links Gosu 1.14.16 with Java 8 and Java 11 support.'
    - >
      2026: The GitHub release feed shows 1.18.x tagged releases generated by the Maven
      release plugin.
  usage:
    - >
      Users can experiment through Gosu Lab, install an IntelliJ plugin, run
      command-line examples, or use Maven and Gradle projects that pull Gosu JARs. The
      language is positioned for Java developers who want productivity features while
      retaining JVM type safety and interoperability.
related-packages: []
category: language-runtime
package-manager:
  apk: gosu
  brew: gosu
  debian: gosu
  nix: gosu
  ubuntu: gosu
package-manager-url: https://formulae.brew.sh/formula/gosu
license: Apache-2.0
