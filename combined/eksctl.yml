id: brew:eksctl
display-name: eksctl
homepage: https://eksctl.io
repo: https://github.com/eksctl-io/eksctl
docs:
  - https://eksctl.io/
  - https://eksctl.io/getting-started
config-file-location:
  unix: cluster.yaml
credentials-file-location:
  unix:
    - ~/.eksctl/cache/credentials.yaml
    - ~/.kube/eksctl/clusters
history:
  adoption-history:
    - >
      eksctl became part of the standard EKS workflow because it matched how Kubernetes
      users already worked: command-line first, declarative when needed, and compatible
      with kubectl, AWS IAM authentication, and AWS credentials. AWS documentation now
      describes eksctl as a utility for creating, managing, and operating EKS clusters,
      and the GitHub project publishes frequent official releases.
    - >
      Its adoption is visible in the ecosystem around it: official releases ship
      binaries and container images, the README documents third-party installers such as
      Homebrew, MacPorts, Chocolatey, and Scoop, and the tool is referenced by AWS EKS
      getting-started flows.
  package-nerd-significance:
    - >
      For package-manager users, eksctl is a good example of a cloud CLI that became
      important enough to be distributed everywhere while still being primarily consumed
      as a single static binary. Installing it with Homebrew or another package manager
      gives Kubernetes users a fast path from a shell prompt to a working EKS cluster.
  project-history:
    - >
      The eksctl repository was created in May 2018, shortly after Amazon EKS became a
      practical target for Kubernetes operators. The project positioned itself as a
      simple way to create an EKS cluster in minutes with one command, while using AWS
      CloudFormation underneath for the infrastructure lifecycle.
    - >
      Over time eksctl grew from cluster creation into a broader EKS operations tool:
      node group lifecycle, cluster updates, VPC configuration, IAM integration, add-on
      management, Fargate profiles, GPU and Spot support, and kubeconfig writing all
      became part of the documented feature set.
  related-projects:
    - >
      eksctl sits beside kubectl, aws-iam-authenticator, the AWS CLI, CloudFormation,
      and infrastructure-as-code tools such as Terraform. It is narrower than a general
      IaC system, but deeper on EKS-specific lifecycle commands.
  sources:
    - https://github.com/eksctl-io/eksctl
    - https://raw.githubusercontent.com/eksctl-io/eksctl/main/README.md
    - https://docs.aws.amazon.com/eks/latest/eksctl/what-is-eksctl.html
    - https://api.github.com/repos/eksctl-io/eksctl
    - https://api.github.com/repos/eksctl-io/eksctl/releases
  summary:
    - >
      eksctl is the official command-line tool for Amazon EKS, the managed Kubernetes
      service on AWS. It is written in Go and turns the multi-service work of creating
      and operating EKS clusters into a small set of commands and declarative YAML
      configuration.
  timeline:
    - '2018: GitHub repository created for the EKS CLI.'
    - '2018: eksctl documented as a Go CLI using CloudFormation to create Amazon EKS clusters.'
    - >
      2026: Official releases continue on a roughly monthly cadence, with v0.228.0
      published in June 2026.
  usage:
    - >
      The classic use case is `eksctl create cluster`, which provisions an EKS control
      plane, node groups, networking, IAM resources, and kubeconfig entries with
      sensible defaults. More advanced users provide a YAML cluster config to make
      cluster creation repeatable across teams or CI systems.
    - >
      Operators also use eksctl for day-two tasks: listing and deleting clusters,
      scaling or draining node groups, updating clusters, configuring endpoint access,
      managing add-on policies, and inspecting the CloudFormation stacks that back a
      cluster.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      eksctl writes kubeconfig for the clusters it creates, after which kubectl is the
      standard client for inspecting resources and performing day-to-day Kubernetes
      operations.
    rel: adjacent_workflow
    sources:
      - https://docs.aws.amazon.com/eks/latest/eksctl/creating-and-managing-clusters.html
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:awscli
    reason: >
      AWS documents configuring the AWS CLI and verifying the active identity as
      prerequisites for eksctl, and both tools use the same AWS profile and credential
      environment.
    rel: adjacent_workflow
    sources:
      - https://docs.aws.amazon.com/eks/latest/eksctl/tutorial.html
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
category: cloud-infrastructure
package-manager:
  brew: eksctl
  chocolatey: eksctl
  macports: eksctl
  nix: eksctl
  pacman: eksctl
  scoop: main/eksctl
  winget: eksctl.eksctl
  zypper: eksctl
package-manager-url: https://formulae.brew.sh/formula/eksctl
license: Apache-2.0
tags:
  - aws
  - cli
  - cloudformation
  - clusters
  - eks
  - kubernetes
description: Simple command-line tool for creating clusters on Amazon EKS
executables:
  - eksctl
provenance:
  formula: eksctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
