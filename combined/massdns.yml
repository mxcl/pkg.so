id: brew:massdns
display-name: MassDNS
homepage: https://github.com/blechschmidt/massdns
repo: https://github.com/blechschmidt/massdns
docs:
  - https://github.com/blechschmidt/massdns#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MassDNS has a visible security and DNS-research audience, with several thousand
      GitHub stars and hundreds of forks. The supplied package metadata records
      Homebrew, Fedora, and Nix packages, which makes it accessible from both
      workstation and Linux server environments.
    - >
      Its adoption is closely tied to subdomain enumeration and bulk DNS workflows. The
      README includes scripts for PTR resolution, subdomain brute forcing,
      certificate-transparency-derived names, and direct authoritative-name-server
      enumeration.
  package-nerd-significance:
    - >
      MassDNS matters to package users because it provides a fast, small DNS
      reconnaissance primitive that can be installed without dragging in a large
      framework.
    - >
      For command-line security and network engineers, it is the DNS-side counterpart to
      other high-throughput reconnaissance tools: composable, pipe-friendly, and tuned
      by flags rather than a GUI.
  project-history:
    - >
      The MassDNS repository was created in June 2016. Its README identifies Quirin
      Scheitle and the Technical University of Munich among the contributors and
      describes the tool as capable of more than 350,000 resolutions per second without
      special configuration.
    - >
      Release history is sparse but meaningful. Version 0.3 in 2020 replaced an `ldns`
      dependency with a custom DNS implementation to reduce memory allocations and added
      NDJSON output. Version 1.0.0 in 2021 switched the project to semantic versioning,
      and version 1.1.0 in 2024 added resolver-list tooling, dedicated resolver support,
      SVCB and HTTPS record support, and several community fixes.
  related-projects:
    - >
      MassDNS includes and references subdomain enumeration workflows inspired by or
      compatible with tools such as subbrute.
    - >
      It is commonly used alongside wordlists, certificate transparency sources, and
      local recursive resolvers such as Unbound.
  sources:
    - https://api.github.com/repos/blechschmidt/massdns
    - https://github.com/blechschmidt/massdns
    - https://github.com/blechschmidt/massdns/releases
    - source_facts.package-manager-url
  summary:
    - >
      MassDNS is a high-performance DNS stub resolver for bulk lookups and
      reconnaissance. It targets use cases where users need to resolve millions or
      billions of names and tune resolver, output, retry, and concurrency behavior from
      the command line.
  timeline:
    - '2016: GitHub repository created.'
    - '2020: v0.3 release removes the `ldns` dependency and adds NDJSON output.'
    - '2021: v1.0.0 switches to semantic versioning.'
    - '2024: v1.1.0 release adds resolver tooling and SVCB/HTTPS record support.'
  usage:
    - >
      Typical usage pipes a domain list into `massdns`, chooses a resolver list with
      `-r`, selects a record type with `-t`, and writes output with `-w` or stdout
      redirection. Output modes include simple text, full text, binary, domain-list
      output, and NDJSON.
    - >
      The README emphasizes operational caution: public resolvers may be unreliable or
      generate abuse complaints, and users should adjust concurrency and prefer trusted
      resolvers when authenticity matters.
related-packages:
  - id: brew:unbound
    reason: >
      Run MassDNS against a local Unbound resolver when result authenticity matters;
      MassDNS's official guidance specifically recommends this workflow instead of
      trusting its included public-resolver list.
    rel: adjacent_workflow
    sources:
      - https://github.com/blechschmidt/massdns#result-authenticity
      - https://unbound.docs.nlnetlabs.nl/en/latest/use-cases/home-resolver.html
category: networking
package-manager:
  brew: massdns
  dnf: massdns
  nix: massdns
package-manager-url: https://formulae.brew.sh/formula/massdns
license: GPL-3.0-only
tags:
  - bulk-lookups
  - cli
  - dns
  - reconnaissance
  - resolver
description: High-performance DNS stub resolver
executables:
  - massdns
provenance:
  formula: massdns
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
