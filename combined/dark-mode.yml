id: brew:dark-mode
display-name: dark-mode
homepage: https://github.com/sindresorhus/dark-mode
repo: https://github.com/sindresorhus/dark-mode
docs:
  - https://github.com/sindresorhus/dark-mode
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README presents Homebrew as the primary package-manager install path
      and also points users to the related npm package dark-mode-cli, which made the
      same idea convenient for Node.js-centered environments.
  package-nerd-significance:
    - >
      For package collectors, dark-mode is a good example of a single-purpose desktop
      automation binary: it is small, scriptable, macOS-specific, and useful in shell
      aliases, dotfiles, and appearance-switching workflows.
  project-history:
    - >
      The project sits in the Sindre Sorhus ecosystem of narrowly scoped macOS and
      developer utilities. Its README describes a Swift-built binary for macOS 10.10 or
      later, with manual binary installation alongside package-manager installation.
  related-projects:
    - >
      The README links related official projects including dark-mode-cli,
      node-dark-mode, and alfred-dark-mode.
  sources:
    - https://github.com/sindresorhus/dark-mode
    - https://github.com/sindresorhus/dark-mode/releases
  summary:
    - >
      dark-mode is a small macOS command-line utility for toggling, enabling, disabling,
      and querying the system dark mode state.
  timeline:
    - '2017: 2.x releases were published on GitHub.'
    - '2019: v3.0.0 was published.'
    - '2021: v3.0.2 was published.'
  usage:
    - >
      The command-line interface is intentionally tiny: running dark-mode with no
      subcommand toggles the setting, while on, off, and status provide explicit
      automation-friendly operations.
related-packages: []
category: system
package-manager:
  brew: dark-mode
package-manager-url: https://formulae.brew.sh/formula/dark-mode
license: MIT
tags:
  - cli
  - dark-mode
  - macos
  - swift
description: Control the macOS dark mode from the command-line
executables:
  - dark-mode
provenance:
  formula: dark-mode
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
