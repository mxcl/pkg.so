id: brew:muon
display-name: muon
homepage: https://muon.build
repo: https://git.sr.ht/~lattis/muon
docs:
  - https://muon.build/
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool's role is practical rather than ceremonial compatibility. muon interprets
      `meson.build` files and emits backend build files, with the ordinary workflow of
      `muon setup`, invoking Ninja or its built-in Samurai-derived backend, running
      tests, and installing. It also grew developer-facing subcommands around the Meson
      language: `muon analyze` for static analysis and language-server use, `muon fmt`
      for formatting, and an interactive stepping debugger. The project describes itself
      as close to feature-complete with Meson for C-like languages while leaving some
      less common Meson options, modules, dependency special cases, and non-C-like
      language support outside the main path.
  sources:
    - https://formulae.brew.sh/formula/muon
    - https://github.com/muon-build/muon
    - https://www.freshports.org/devel/muon/
    - https://www.mankier.com/1/muon
  summary:
    - >
      muon is a C99 implementation of the Meson build system with minimal dependencies.
      Its README states the design goal directly: interpret Meson projects, provide
      Meson-adjacent tooling, and compile to a single portable binary for Linux,
      Windows, and macOS. The same README credits the author's earlier idea to
      reimplement Meson in C and says the project was initially inspired by boson, with
      muon's code originally based on boson and later mostly rewritten.
  usage:
    - >
      In package-manager terms, muon sits beside Meson, Ninja, and Samurai as a lean
      build-system implementation for users who want Meson project support with a small
      C binary and fewer runtime dependencies. FreeBSD packaging notes emphasize that
      muon does not aim for bug-for-bug or CLI compatibility with Meson and uses Meson's
      official documentation as its specification, which is why distributions package it
      as `muon`, `muon-meson`, or related names rather than a transparent Meson
      replacement.
related-packages:
  - id: brew:meson
    reason: >
      Choose Meson when you need the reference implementation, broader language support,
      or maximum project compatibility; choose muon for a compact C99 implementation
      with minimal runtime dependencies.
    rel: alternative
    sources:
      - https://github.com/muon-build/muon#readme
      - https://mesonbuild.com/
  - id: brew:ninja
    reason: >
      Ninja is the standard fast backend that can execute build files generated by `muon
      setup` when the embedded `samu` backend is not being used.
    rel: adjacent_workflow
    sources:
      - https://github.com/muon-build/muon#readme
      - https://ninja-build.org/manual
category: developer-tools
package-manager:
  apk: abuild-muon
  brew: muon
  macports: muon
  nix: muon
  zypper: muon
package-manager-url: https://formulae.brew.sh/formula/muon
license: GPL-3.0-only
tags:
  - build-system
  - c99
  - cli
  - developer-tools
  - meson
  - ninja
description: Meson-compatible build system
executables:
  - muon
provenance:
  formula: muon
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
