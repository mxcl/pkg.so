    - /usr/local/etc/rtl_433/rtl_433.conf
credentials-file-location:
  unix:
    - ./rtl_433.conf
    - $XDG_CONFIG_HOME/rtl_433/rtl_433.conf
    - ~/.config/rtl_433/rtl_433.conf
