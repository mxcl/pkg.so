history:
  adoption-history:
    - >
      The project is distributed through Homebrew and numerous Linux, BSD, Nix,
      MacPorts, Windows, and other package ecosystems. Its portable C implementation and
      modest resource requirements also make it suitable for embedded systems.
  package-nerd-significance:
    - >
      rtl_433 is a package-ecosystem bridge between inexpensive SDR hardware and
      home-automation or telemetry stacks. It turns otherwise opaque ISM-band
      transmissions into structured output without requiring a vendor gateway.
  project-history:
    - >
      rtl_433 developed into a generic receiver and decoder despite its name: official
      documentation covers 315, 345, 433.92, 868, and 915 MHz bands. Its decoder
      collection has expanded through ongoing device contributions, while later releases
      added integrations such as MQTT, InfluxDB, TLS, replay, and Home Assistant
      tooling.
  related-projects:
    - >
      RTL-SDR supplies support for common RTL2832-based receivers; SoapySDR broadens
      hardware support. The official wiki catalogs software built around rtl_433.
  sources:
    - https://github.com/merbanan/rtl_433/blob/master/README.md
    - https://github.com/merbanan/rtl_433/releases
    - source_facts.package-manager
  summary:
    - >
      rtl_433 is a portable C command-line receiver and protocol decoder for low-power
      devices operating in common ISM radio bands.
  timeline:
    - >
      2021: Release 21.05 became the last release supporting Autotools and added
      official Windows release builds.
    - >
      2022: Release 22.11 broadened device support and added replay and rtl_tcp-related
      capabilities.
    - '2023: Release 23.11 simplified the default system configuration-directory behavior.'
    - '2025: Release 25.12 expanded device support and MQTT-related integration.'
  usage:
    - >
      Users commonly pair an RTL-SDR or SoapySDR-supported radio with rtl_433 to decode
      weather sensors, utility meters, tire-pressure sensors, remotes, and similar
      devices. Output can be printed locally or forwarded to systems such as MQTT and
      InfluxDB.
category: networking
