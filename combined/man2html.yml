id: brew:man2html
display-name: man2html
homepage: https://savannah.nongnu.org/projects/man2html/
repo: https://savannah.nongnu.org/cvs?group=man2html
docs:
  - https://savannah.nongnu.org/projects/man2html
  - https://www.nongnu.org/man2html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      man2html appears in traditional Unix and Linux packaging because it solves a
      narrow problem with few moving parts: convert formatted manual-page output into
      HTML, optionally behind a CGI interface. Its package-manager role is mostly as a
      compatibility utility rather than a modern documentation platform.
    - >
      Homebrew, Debian, Fedora, Arch, and Ubuntu package names show continuing
      downstream availability even though the upstream history is sparse and old.
  package-nerd-significance:
    - >
      man2html is package-nerd interesting because it preserves an older Unix
      documentation pattern: turn local manual pages into web pages without introducing
      a large documentation stack.
    - >
      Its official sources are thin, so the safe history is short: Earl Hood
      maintenance, a 1997 pre-Savannah release, and migration to Savannah in 2003.
  project-history:
    - >
      The official NonGNU page says man2html was maintained solely by Earl Hood before
      it became a Savannah project in May 2003. The last pre-Savannah public release was
      version 3.0.1 in 1997, which the project continued to make available from CPAN-era
      distribution locations and the Savannah download area.
    - >
      After the Savannah move, the project lived in GNU Savannah's NonGNU infrastructure
      with CVS, mailing-list archives, and project downloads. That makes it a small but
      historically useful bridge between roff manual pages and early web-based
      documentation browsing.
  related-projects:
    - >
      man2html sits beside man-db, mandoc, groff, nroff, and CGI manual-page browsers in
      the Unix documentation ecosystem.
    - >
      Its role overlaps with HTML output modes in newer tools such as mandoc, but its
      design is simpler and older.
  sources:
    - https://savannah.nongnu.org/cvs/?group=man2html
    - https://savannah.nongnu.org/projects/man2html
    - https://www.nongnu.org/man2html/
    - source_facts.package-manager
  summary:
    - >
      man2html is a Perl program that reads formatted nroff text from standard input and
      writes an HTML document to standard output. The official site also documents a CGI
      program for browsing a system's manual pages through a web browser.
  timeline:
    - '1997: Last pre-Savannah public release, version 3.0.1.'
    - '2003: man2html became a Savannah project.'
    - >
      2003: The official NonGNU page records the Savannah, CVS, and mailing-list project
      links.
  usage:
    - >
      The CLI reads formatted nroff from standard input and emits HTML on standard
      output, which makes it naturally scriptable with `man`, `nroff`, or
      documentation-generation jobs. The CGI component is for hypertext navigation over
      installed man pages.
    - >
      Because it works on formatted nroff rather than owning a whole man-page database,
      man2html is often paired with existing manual systems rather than replacing them.
related-packages:
  - id: brew:mandoc
    reason: >
      mandoc is a maintained integrated alternative that parses `mdoc` and `man` source
      directly and emits HTML 5, while man2html converts already formatted nroff text
      and also supplies a CGI browser.
    rel: alternative
    sources:
      - https://www.nongnu.org/man2html/
      - https://mandoc.bsd.lv/
      - https://mandoc.bsd.lv/man/mandoc.1.html
  - id: brew:groff
    reason: >
      GNU groff provides the nroff/roff formatting stage whose text output can be piped
      into man2html for HTML conversion.
    rel: adjacent_workflow
    sources:
      - https://www.nongnu.org/man2html/
      - https://www.gnu.org/software/groff/
      - https://www.gnu.org/software/groff/manual/groff.html
category: system
package-manager:
  brew: man2html
  debian: man2html
  dnf: man2html
  pacman: man2html
  ubuntu: man2html
package-manager-url: https://formulae.brew.sh/formula/man2html
license: GPL-2.0-or-later
tags:
  - cgi
  - cli
  - html-conversion
  - man-pages
  - nroff
  - perl
description: Convert nroff man pages to HTML
executables:
  - man2html
provenance:
  formula: man2html
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
