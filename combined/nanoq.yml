id: brew:nanoq
display-name: Nanoq
homepage: https://github.com/esteinig/nanoq
repo: https://github.com/esteinig/nanoq
docs:
  - https://github.com/esteinig/nanoq
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Nanoq is distributed through Cargo, Conda/Bioconda, precompiled Linux and macOS
      release archives, and a Homebrew formula. Its official benchmarks position it
      alongside established sequencing utilities including NanoFilt, NanoStat, Filtlong,
      seqtk, SeqKit, and rust-bio-tools.
  package-nerd-significance:
    - >
      Nanoq is notable as a small, single-purpose Rust CLI that composes naturally in
      Unix pipelines while being packaged across the Rust, bioinformatics,
      binary-release, and Homebrew ecosystems. Its benchmarked trade-off between full
      quality calculations and an exceptionally fast quality-free mode makes it useful
      when choosing lightweight tools for large sequencing streams.
  project-history:
    - >
      The public repository and first tagged releases appeared in March 2020. The
      project subsequently expanded its filters, reports, compression support, and
      machine-readable output, reaching the 0.8 series in 2021, 0.9.0 in 2022, and
      0.10.0 in 2023. Steinig and Coin described Nanoq in the Journal of Open Source
      Software in 2022.
  related-projects:
    - >
      NanoFilt and NanoStat provide nanopore filtering and statistics workflows used as
      official benchmark comparisons.
    - >
      Filtlong, seqtk, SeqKit, and rust-bio-tools are neighboring read-processing tools
      compared in Nanoq's official benchmarks.
    - Needletail and niffler provide Nanoq's read-processing and compression foundations.
  sources:
    - https://github.com/esteinig/nanoq
    - https://github.com/esteinig/nanoq/releases
    - https://joss.theoj.org/papers/10.21105/joss.02991
    - source_facts.package-manager.brew
  summary:
    - >
      Nanoq is a Rust command-line utility for rapid filtering, trimming, quality
      control, and summary reporting of Oxford Nanopore FASTA/FASTQ reads. It is
      designed to work with files or Unix streams and emphasizes low memory use and high
      throughput.
  timeline:
    - '2020: First public tagged releases.'
    - '2021: The 0.8 release series broadened the mature CLI.'
    - >
      2022: Nanoq was published in the Journal of Open Source Software and version 0.9.0
      was released.
    - '2023: Version 0.10.0 was released.'
  usage:
    - >
      Users pass FASTA or FASTQ reads by file or standard input, apply length or quality
      filters and optional end trimming, and send surviving reads to a file or standard
      output. Statistics can be emitted as compact text, verbose summaries, or JSON; a
      fast mode skips quality-score calculation for greater throughput.
related-packages:
  - id: brew:filtlong
    reason: >
      Choose Filtlong when selecting a target quantity of the best long reads or
      incorporating an external assembly or accurate short reads into scoring; choose
      Nanoq for lightweight length/quality filters and integrated summaries.
    rel: alternative
    sources:
      - https://github.com/esteinig/nanoq#benchmarks
      - https://github.com/rrwick/Filtlong
  - id: brew:seqkit
    reason: >
      Choose SeqKit when the workflow needs a broad, cross-platform FASTA/FASTQ
      manipulation toolkit; choose Nanoq for a smaller command focused on nanopore
      filtering and summary reports.
    rel: alternative
    sources:
      - https://github.com/esteinig/nanoq#benchmarks
      - https://bioinf.shenwei.me/seqkit/
      - https://github.com/shenwei356/seqkit
category: science
