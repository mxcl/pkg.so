id: brew:graphqlviz
display-name: graphqlviz
homepage: https://github.com/sheerun/graphqlviz
repo: https://github.com/sheerun/graphqlviz
docs:
  - https://github.com/sheerun/graphqlviz#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears to be niche and developer-tool focused. Its value comes from
      fitting into the existing Graphviz command-line ecosystem: `graphqlviz` writes
      DOT, and users pipe that into `dot` to produce PNG or other graph formats.
  package-nerd-significance:
    - >
      graphqlviz is package-manager trivia in the good sense: a tiny bridge between
      GraphQL introspection and the decades-old Graphviz rendering toolchain. It is
      useful when a schema diagram is needed quickly and a full GraphQL registry or UI
      is too much.
  project-history:
    - >
      The project is intentionally narrow: its README describes a GraphQL Server CLI
      visualizer adapted from an original web interface. The repository contains a
      compact JavaScript CLI rather than a broader GraphQL platform.
  related-projects:
    - Graphviz supplies the `dot` renderer used for final graph output.
    - >
      GraphQL Inspector and GraphQL Voyager are adjacent schema-understanding tools,
      though graphqlviz is much smaller and DOT-focused.
  sources:
    - https://github.com/sheerun/graphqlviz
    - https://github.com/sheerun/graphqlviz#readme
    - https://github.com/sheerun/graphqlviz/releases
    - https://www.npmjs.com/package/graphqlviz
  summary:
    - >
      graphqlviz is a small GraphQL schema visualizer that renders Graphviz DOT output
      from a GraphQL endpoint, schema JSON file, or schema SDL file.
  timeline:
    - >
      Repository era: graphqlviz was published as a JavaScript CLI around a compact
      GitHub repository with tagged npm releases.
    - >
      Package era: npm and Homebrew packaging made the `graphqlviz` executable available
      outside direct repository checkout.
  usage:
    - >
      Typical usage is `graphqlviz [url] | dot -Tpng -o graph.png`. The CLI can also
      read `schema.json` or `schema.graphql`, pass an Authorization header, print the
      introspection result, and apply theme overrides.
related-packages:
  - id: brew:graphviz
    reason: >
      Graphviz is the documented renderer for graphqlviz output; pipe graphqlviz's DOT
      stream into `dot` to produce PNG or another supported format.
    rel: adjacent_workflow
    sources:
      - https://github.com/sheerun/graphqlviz#readme
      - https://graphviz.org/documentation/
category: developer-tools
package-manager:
  brew: graphqlviz
package-manager-url: https://formulae.brew.sh/formula/graphqlviz
license: MIT
