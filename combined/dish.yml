id: brew:dish
display-name: dish
homepage: https://github.com/thevxn/dish
repo: https://github.com/thevxn/dish
docs:
  - https://blog.vxn.dev/dish-monitoring-service
  - https://github.com/thevxn/dish
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dish is young compared with classic Unix monitoring tools, but its README shows
      package-manager and Go-module adoption paths: go install, Homebrew, manual GitHub
      releases, Docker examples, and a pkg.go.dev module page.
  package-nerd-significance:
    - >
      dish is package-nerd interesting as the minimal end of monitoring: a single CLI,
      JSON input, zero runtime dependencies, and output integrations that avoid running
      a full agent stack.
  project-history:
    - >
      The official README presents dish as a small Go monitoring tool with remote or
      local configuration, concurrent checks, and no dependencies. Its GitHub repository
      was created in 2022 and exposes a command under go.vxn.dev/dish/cmd/dish.
  related-projects:
    - >
      The official README connects dish to Prometheus Pushgateway, Telegram, Discord,
      Docker, and Go module tooling through its supported notification and install
      paths.
  sources:
    - https://github.com/thevxn/dish
    - https://github.com/thevxn/dish/blob/master/README.md
    - https://pkg.go.dev/go.vxn.dev/dish
  summary:
    - >
      dish is a tiny one-shot monitoring service for checking HTTP and ICMP endpoints
      and TCP sockets.
  timeline:
    - '2022: GitHub repository created.'
    - '2020s: README documents Go install, Homebrew, release binaries, Docker, and cron usage.'
  usage:
    - >
      Users run dish with a local JSON file or remote REST JSON API source, then
      optionally send results to a remote API, Telegram, Prometheus Pushgateway,
      webhook, or Discord. Its one-shot design makes it natural for cron jobs and small
      decentralized monitors.
related-packages:
  - id: brew:prometheus
    reason: >
      Use Prometheus alongside dish when dish's one-shot checks should push failure
      metrics through Pushgateway for later scraping and time-series monitoring.
    rel: adjacent_workflow
    sources:
      - https://github.com/thevxn/dish#readme
      - https://prometheus.io/docs/instrumenting/pushing/
category: networking
package-manager:
  brew: dish
  debian: dish
  ubuntu: dish
package-manager-url: https://formulae.brew.sh/formula/dish
license: MIT
tags:
  - cli
  - http
  - monitoring
  - networking
  - tcp
description: Lightweight monitoring service that efficiently checks socket connections
executables:
  - dish
provenance:
  formula: dish
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
