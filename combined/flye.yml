config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Flye became a standard packaged long-read assembler in bioinformatics workflows
      because it targets both PacBio and Oxford Nanopore reads, covers bacterial through
      mammalian-scale assemblies, and advertises Bioconda installation from the official
      README. The input package metadata also records packaging across Homebrew, Debian,
      Ubuntu, and Nix.
  package-nerd-significance:
    - >
      Flye is notable to package maintainers because it combines Python/C++
      bioinformatics code with bundled third-party components such as minimap2 and
      samtools, while remaining a user-facing CLI. It is also a good example of a
      research tool that crossed into routine package-manager distribution because
      long-read sequencing became common laboratory infrastructure.
  project-history:
    - >
      The project grew out of the ABruijn/Flye line of assemblers developed in Pavel
      Pevzner's lab at UCSD. Its official release history shows early releases under the
      ABruijn name in 2016 and 2017, followed by Flye releases from the 2.x series
      onward.
    - >
      Flye's core technical identity is its repeat graph approach. The README describes
      repeat graphs as an alternative to de Bruijn graphs for noisy long-read data,
      using approximate sequence matches and classifying graph edges as unique or
      repetitive to support reconstruction of assemblies.
  related-projects:
    - >
      Related projects named by the official README include metaFlye, HapDup, strainy,
      AGB, Bandage, minimap2, and samtools.
  sources:
    - https://api.github.com/repos/mikolmogorov/Flye/releases?per_page=100
    - https://github.com/mikolmogorov/Flye
    - https://raw.githubusercontent.com/mikolmogorov/Flye/flye/README.md
  summary:
    - >
      Flye is a de novo assembler for long, single-molecule sequencing reads from
      platforms such as PacBio and Oxford Nanopore. It is distributed as a command-line
      bioinformatics package and presents a complete assembly pipeline from raw reads to
      polished contigs, with special support for metagenome assembly through metaFlye.
  timeline:
    - '2016: ABruijn v1.0 was released.'
    - '2018: The 2.3 release line appeared under the Flye name.'
    - '2019: The Flye repeat-graph assembler paper was published in Nature Biotechnology.'
    - '2020: metaFlye for long-read metagenome assembly was published in Nature Methods.'
    - >
      2021: Flye 2.9 added updated high-quality Nanopore and HiFi behavior and other
      assembly improvements.
    - '2025: Flye 2.9.6 was released as a minor fix release.'
  usage:
    - >
      Typical usage is as the `flye` CLI: users provide raw PacBio or ONT reads, select
      the appropriate read mode, and receive polished contigs and graph outputs. The
      README also documents metagenome assembly, benchmark datasets, and downstream
      visualization or phasing tools.
