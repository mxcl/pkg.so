id: brew:mimic
display-name: Mimic
homepage: https://github.com/MycroftAI/mimic1
repo: https://github.com/MycroftAI/mimic1
docs:
  - https://github.com/MycroftAI/mimic1
  - https://github.com/MycroftAI/mimic1#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      A distinctive adoption story is the partnership with VocaliD. Mycroft's
      documentation says Mimic 1 was used as a cross-platform engine for VocaliD
      clients, helping people with speech disorders use custom voices created from
      VocaliD's Human Voicebank. That places Mimic beyond a developer CLI: it was also
      part of accessibility-oriented voice technology.
  project-history:
    - >
      Its role in the Mycroft ecosystem was to provide local speech synthesis for a
      voice assistant and for embedded or low-resource systems. Mycroft's documentation
      emphasizes low latency, a small resource footprint, Linux, Mac OS X, and Windows
      support, and a design that can play audio directly or write RIFF/WAV output. Users
      invoke the `mimic` command with text or a file, choose built-in or external
      voices, and produce spoken output or audio files.
  sources:
    - https://formulae.brew.sh/formula/mimic
    - https://github.com/MycroftAI/mimic1
    - https://mycroft-ai.gitbook.io/docs/mycroft-technologies/mimic-tts/mimic-overview
    - https://mycroftai.github.io/mimic3-presentation/
    - https://packages.fedoraproject.org/pkgs/mimic/mimic/
  summary:
    - >
      Mimic, packaged by Homebrew as `mimic`, is Mycroft AI's first-generation
      text-to-speech engine. The upstream repository describes it as a fast, lightweight
      TTS engine developed by Mycroft AI and VocaliD and based on Carnegie Mellon
      University's Flite, also known as Festival Lite. Mycroft's own docs identify this
      package as Mimic 1, distinguishing it from later Mimic 2 and Mimic 3 systems.
  usage:
    - >
      The project later sat beside newer Mycroft TTS engines. Mimic 3's presentation
      compares the family directly: Mimic 1 is local and Flite-based, Mimic 2 uses
      Tacotron and is not local, and Mimic 3 is local and neural. As a package-manager
      entry, `mimic` remains the lightweight Flite-based C command-line engine, with
      executables for synthesis and supporting voice/regex tools, rather than the neural
      Mimic 3 stack.
related-packages:
  - id: brew:flite
    reason: >
      Choose Flite for the smaller foundational Festival Lite engine; choose Mimic 1
      when you want Mycroft and VocaliD's Flite-derived voices and integrations.
    rel: alternative
    sources:
      - https://mycroft-ai.gitbook.io/docs/mycroft-technologies/mimic-tts/mimic-overview
      - https://github.com/festvox/flite
category: ai
