id: brew:container
display-name: container
homepage: https://apple.github.io/container/documentation/
repo: https://github.com/apple/container
docs:
  - https://apple.github.io/container/documentation
config-file-location:
  macos:
    - ~/.config/container/config.toml
    - <installRoot>/etc/container/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official documentation frames the tool around macOS developers who need Linux
      containers without a shared Linux VM. The project also became
      package-manager-relevant quickly because Homebrew, MacPorts, and Nix package
      records appeared around a first-party Apple runtime rather than a Docker Desktop
      replacement package.
  package-nerd-significance:
    - >
      For package nerds, `container` is significant because it makes Apple's native
      container stack installable and scriptable as a CLI. Its use of OCI images
      preserves interoperability with existing registries, while its macOS-only
      virtualization model creates a distinct packaging target from Linux
      containerd/runc stacks and Docker Desktop-style bundles.
  project-history:
    - >
      Apple published the initial 0.1.0 release in June 2025 and reached 1.0.0 in June
      2026. The README describes the project as active development, with stability
      guarantees limited to patch versions until the 1.0.0 milestone.
  related-projects:
    - >
      `container` uses Apple's Containerization Swift package for low-level container,
      image, and process management. Its technical overview also connects it to OCI
      image standards and macOS platform frameworks.
  sources:
    - https://github.com/apple/container#readme
    - https://github.com/apple/container/blob/main/docs/technical-overview.md
    - https://github.com/apple/container/blob/main/docs/tutorials/start-here.md
    - https://github.com/apple/container/releases/tag/0.1.0
    - https://github.com/apple/container/releases/tag/1.0.0
    - https://apple.github.io/container/documentation
  summary:
    - >
      Apple's `container` is a macOS-focused CLI for creating and running Linux
      containers as lightweight virtual machines. It is written in Swift, optimized for
      Apple silicon, and designed around OCI-compatible images and registries.
  timeline:
    - '2025: 0.1.0 release published.'
    - '2026: 1.0.0 release published.'
    - '2026: Documentation states support targets macOS 26 and Apple silicon.'
  usage:
    - >
      The CLI can start the system service, pull and run OCI images, build images from
      Dockerfiles, push images to registries, and manage containers, images, registries,
      builders, and system components. Its technical overview explains that each
      container runs in its own lightweight VM through Apple's Containerization package
      and macOS frameworks such as Virtualization, vmnet, XPC, launchd, Keychain
      services, and unified logging.
related-packages:
  - id: brew:container-compose
    reason: >
      Container-Compose invokes Apple's container ecosystem to run multiple services
      described by familiar Compose files.
    rel: adjacent_workflow
    sources:
      - https://github.com/Mcrich23/Container-Compose#readme
      - https://github.com/apple/container#readme
  - id: brew:podman
    reason: >
      Choose Podman when you want a mature cross-platform container CLI and Docker-API
      compatibility on macOS, accepting its shared Podman machine model instead of
      Apple's per-container lightweight VMs.
    rel: alternative
    sources:
      - https://podman.io/docs/installation
      - https://docs.podman.io/en/latest/markdown/podman-machine.1.html
      - https://github.com/apple/container#readme
category: cloud-infrastructure
package-manager:
  brew: container
  macports: container
  nix: container
package-manager-url: https://formulae.brew.sh/formula/container
license: Apache-2.0
tags:
  - cli
  - containers
  - macos
  - oci
  - virtualization
description: Create and run Linux containers using lightweight virtual machines
executables:
  - container
  - container-apiserver
provenance:
  formula: container
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
