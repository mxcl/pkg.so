id: brew:moco
display-name: Moco
homepage: https://github.com/dreamhead/moco
repo: https://github.com/dreamhead/moco
docs:
  - https://github.com/dreamhead/moco#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      Its ecosystem role is deliberately practical. Moco can be embedded as a Java API
      in JUnit tests, run as a standalone server, or reached through Maven, Gradle,
      shell, and Scala integrations. The documentation covers HTTP, HTTPS, socket, REST,
      WebSocket, and SSE APIs, which places it in the Java testing niche alongside mock
      HTTP servers and service-virtualization tools rather than full API gateways.
  sources:
    - https://formulae.brew.sh/formula/moco
    - https://github.com/dreamhead/moco
    - https://raw.githubusercontent.com/dreamhead/moco/master/README.md
    - https://raw.githubusercontent.com/dreamhead/moco/master/moco-doc/usage.md
  summary:
    - >
      Moco is a Java stub-server and mocking framework from ZHENG Ye's dreamhead/moco
      project, with copyright dates in the upstream README beginning in 2012. The
      project was built around a small alternative to deploying temporary WAR files or
      embedded application servers for HTTP integration testing: write a JSON response
      description, run the standalone runner, and point tests or clients at the local
      stub endpoint.
  usage:
    - >
      The Homebrew formula exposes the `moco` executable for command-line use, while the
      upstream project also publishes Maven artifacts such as `moco-core` and the
      standalone runner. The 2.0.0 line moved the project to Java 17 or later, marking a
      runtime baseline change for a tool that had long been used in build and
      integration-test workflows.
related-packages:
  - id: brew:wiremock-standalone
    reason: >
      Choose WireMock Standalone when API mocking needs record/playback, dynamic
      response templating, fault injection, or a management API in addition to JSON-file
      stubs.
    rel: alternative
    sources:
      - https://github.com/dreamhead/moco
      - https://wiremock.org/docs/
      - https://wiremock.org/docs/standalone/
  - id: brew:mockserver
    reason: >
      Choose MockServer when the test double also needs proxy recording, chaos behavior,
      or broader protocol support including HTTP/2, HTTP/3, and gRPC.
    rel: alternative
    sources:
      - https://github.com/dreamhead/moco
      - https://www.mock-server.com/
      - https://www.mock-server.com/mock_server/getting_started.html
