id: brew:crispy-doom
display-name: Crispy Doom
homepage: https://github.com/fabiangreffrath/crispy-doom
repo: https://github.com/fabiangreffrath/crispy-doom
docs:
  - https://github.com/fabiangreffrath/crispy-doom/wiki
  - https://github.com/fabiangreffrath/crispy-doom#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official download instructions list Windows release binaries, MacPorts and
      Homebrew on macOS, and Debian/Ubuntu packages from Debian 10 and Ubuntu 19.10
      onward. That distribution footprint is important for a source port because users
      often want the engine packaged separately from commercial or shareware IWAD data.
  package-nerd-significance:
    - >
      Crispy Doom is package-manager friendly because it keeps the engine open source
      and separate from game data, exposes multiple binaries for Doom-engine relatives,
      and documents compatibility boundaries clearly. For retro-gaming packages, those
      boundaries help maintainers set expectations about IWAD ownership, save/demo
      compatibility, and supported mod formats.
  project-history:
    - >
      The project was created by Fabian Greffrath in 2014 and explicitly traces its
      origin to Chocolate Doom. The README says the name refers both to its crisp
      640x400 internal resolution and to its origin, and the legal section marks Crispy
      Doom's additional copyright from 2014 onward.
    - >
      Crispy Doom's design brief is conservative by source-port standards: it aims at
      faithful Doom play, supports limit-removing vanilla maps, and avoids Boom or ZDoom
      map formats while adding optional quality-of-life features. This makes it
      attractive to users who want a packaged executable with enhancements but not a
      fundamentally different engine family.
  related-projects:
    - Chocolate Doom is the upstream fork base and compatibility reference.
    - >
      Doom Retro, MBF, and WinMBF are acknowledged as influences or debugging references
      in the README.
    - >
      Freedoom and the Doom shareware WAD are documented data options for users who do
      not own commercial IWADs.
  sources:
    - https://github.com/fabiangreffrath/crispy-doom#readme
    - https://github.com/fabiangreffrath/crispy-doom/wiki
    - https://github.com/fabiangreffrath/crispy-doom/releases/tag/crispy-doom-5.4
  summary:
    - >
      Crispy Doom is a Doom source port that sits between strict vanilla compatibility
      and modern convenience. It is a friendly fork of Chocolate Doom with higher
      resolution, raised engine limits, and optional gameplay and visual enhancements
      while preserving compatibility goals that matter to demo, savegame, and netplay
      users.
  timeline:
    - '2014: Repository created and project copyright begins.'
    - '2018: Crispy Doom 5.4 release published on GitHub releases.'
    - >
      2019: Debian/Ubuntu-era packaging is reflected in the official install notes for
      Debian 10 and Ubuntu 19.10 or later.
  usage:
    - >
      Users run Crispy Doom to play Doom-family IWADs and compatible PWADs with enhanced
      resolution, widescreen rendering, uncapped framerate, raised static limits, and
      optional features enabled through the Crispness menu, setup tools, or command-line
      parameters.
related-packages:
  - id: brew:chocolate-doom
    reason: >
      Choose Chocolate Doom for stricter reproduction of the original DOS behavior;
      choose Crispy Doom for a Chocolate Doom-derived port with raised limits, higher
      resolution, and optional enhancements.
    rel: alternative
    sources:
      - https://github.com/fabiangreffrath/crispy-doom#readme
      - https://github.com/chocolate-doom/chocolate-doom#readme
category: games
