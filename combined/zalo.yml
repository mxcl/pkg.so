history:
  adoption-history:
    - >
      Zalo quickly established itself in Vietnam after its official December 2012
      launch, reaching the top of Vietnam's App Store ranking within a month. It
      subsequently expanded from consumer communication into workplace group chat,
      business interaction, public-service communication, and disaster information.
    - >
      Official company material describes Zalo as Vietnam's leading messaging platform
      and documents its broad use across generations, government agencies, public
      utilities, businesses, and everyday personal communication.
  package-nerd-significance:
    - >
      Zalo is a regionally dominant proprietary communication platform whose macOS cask
      makes its desktop client manageable alongside other applications through Homebrew.
      It is especially relevant to users working with Vietnamese contacts,
      organizations, and public services.
    - >
      The desktop application emphasizes synchronized phone-and-computer messaging,
      large-file exchange, group work, and locally managed chat data, making its
      on-device storage and cleanup controls important operational details.
  project-history:
    - >
      VNG introduced the first Zalo beta in August 2012 and released the official
      product in December. Its name combines Zing, VNG's earlier service brand, with
      'alo,' a common Vietnamese telephone greeting.
    - >
      Zalo began as a mobile messaging and calling application and expanded to desktop
      and web clients, business and government Official Accounts, file exchange,
      public-service communication, and other services tailored to Vietnam.
  related-projects:
    - >
      Zalo's official ecosystem includes mobile, desktop, and web clients, Zalo Official
      Accounts, Mini Apps, My Documents, and zCloud data-preservation services.
    - >
      ZaloPay is a separate VNG ecosystem product rather than the desktop messenger's
      credential or payment store.
  sources:
    - https://help.zalo.me/huong-dan/chuyen-muc/zalo-cong-viec/zalo-app-va-zalo-pc/
    - https://help.zalo.me/tai-zalo/
    - https://vng.com.vn/news/product/vng-zalo.html
    - https://zalo.me/en/about/
    - https://zalo.me/en/product/zalo/
  summary:
    - >
      Zalo is a Vietnamese messaging and calling platform from VNG with mobile, desktop,
      and web clients. The desktop application supports synchronized chats, group work,
      calls, and file exchange.
  timeline:
    - '2012-08: The first Zalo beta was introduced.'
    - '2012-12: Zalo officially launched.'
    - "2013-01: Zalo reached the top of Vietnam's App Store ranking."
    - '2020: Zalo became an official government communication channel during disasters.'
    - '2021: VNG reported 64 million active Zalo users and extensive daily messaging use.'
  usage:
    - >
      Users sign in to Zalo on a Mac alongside the mobile client to synchronize
      messages, make calls, participate in group chats, and exchange photos, videos,
      files, and folders. The desktop application includes controls for local media,
      cache, remembered accounts, downloads, proxy settings, and an application lock.
