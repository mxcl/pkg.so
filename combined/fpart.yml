id: brew:fpart
display-name: fpart
homepage: https://www.fpart.org/
repo: https://github.com/martymac/fpart
docs:
  - https://github.com/martymac/fpart#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site lists packages for FreeBSD, Debian, Ubuntu, CentOS/Fedora,
      NixOS, Homebrew, and Spack. That package availability matches fpart's niche:
      administrators want it ready from the system package manager when handling large
      file trees or migration jobs.
    - >
      The project is hosted through Martymac.org, GitHub, and SourceForge, reflecting
      the long-running open-source utility pattern of keeping multiple source
      distribution surfaces alive.
  package-nerd-significance:
    - >
      fpart is package-nerd significant because it fills a pragmatic gap between find,
      du, rsync, tar, and shell scripting. It packages a specific sysadmin pattern:
      divide a huge tree into stable bags, then process those bags in parallel.
    - >
      Its appeal is also dependency-minimal: the official docs describe fpsync as mostly
      shell plus common tools, making it a natural fit for ports trees and conservative
      system package collections.
  project-history:
    - >
      The official documentation says fpart was written by Ganael Laplanche, with
      Jean-Baptiste Denis credited for the original idea. The changelog records an
      initial 0.1 release on 2011-11-18, a 1.0.0 release on 2017-11-10, and a 1.7.0
      release on 2025-01-25.
    - >
      fpart is primarily developed on FreeBSD, carries embedded fts(3) code derived from
      FreeBSD for portability, and is tested across FreeBSD, GNU/Linux, Solaris,
      OpenIndiana, NetBSD, and macOS.
  related-projects:
    - fpsync is the closest related project and is distributed with fpart.
    - >
      rsync, cpio, pax, tar, SSH, du, and FreeBSD fts(3) are related tools or code bases
      called out by the official documentation.
  sources:
    - https://api.github.com/repos/martymac/fpart
    - https://github.com/martymac/fpart
    - https://raw.githubusercontent.com/martymac/fpart/master/README.md
    - https://www.fpart.org/
    - https://www.fpart.org/changelog/
  summary:
    - >
      fpart is a filesystem partitioner: it crawls file trees, sorts files, and packs
      them into partitions. Its companion tool fpsync uses those partitions to
      parallelize file-migration work.
  timeline:
    - '2011: 0.1 initial version released.'
    - '2014: Official GitHub repository was created.'
    - '2017: 1.0.0 released.'
    - '2024: 1.6.0 released.'
    - '2025: 1.7.0 released.'
  usage:
    - >
      fpart generates partitions by file count, size, or number of partitions, can
      operate in live mode with hooks, and can consume arbitrary input such as du
      output.
    - >
      fpsync builds on fpart to parallelize rsync, cpio, pax, or tar jobs, use SSH
      clusters for distributed migrations, start transfers while crawling continues, and
      resume or replay transfer runs.
related-packages:
  - id: brew:rsync
    reason: >
      rsync is fpsync's default transfer engine: fpart divides the tree into work units
      and fpsync runs multiple rsync jobs locally or through SSH workers.
    rel: adjacent_workflow
    sources:
      - https://github.com/martymac/fpart/blob/master/docs/www.fpart.org/docs/fpsync.md
      - https://rsync.samba.org/
category: system
package-manager:
  brew: fpart
  debian: fpart
  dnf: fpart
  nix: fpart
  ubuntu: fpart
package-manager-url: https://formulae.brew.sh/formula/fpart
license: BSD-2-Clause
tags:
  - cli
  - file-trees
  - files
  - packing
  - sync
  - system-utility
description: Sorts file trees and packs them into bags
executables:
  - fpart
  - fpsync
provenance:
  formula: fpart
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
