id: brew:bib-tool
display-name: BibTool
homepage: https://www.gerd-neugebauer.de/software/TeX/BibTool/en/
repo: https://github.com/ge-ne/bibtool
docs:
  - https://www.gerd-neugebauer.de/software/TeX/BibTool/bibtool.pdf
  - https://www.gerd-neugebauer.de/software/TeX/BibTool/en
config-file-location:
  unix:
    - $BIBTOOLRSC
    - ~/.bibtoolrsc
    - ./.bibtoolrsc
credentials-file-location: null
history:
  adoption-history:
    - >
      BibTool is distributed through TeX-oriented channels and general OS package
      managers. The README points users to CTAN and notes binary distributions via
      native package managers, while the input metadata lists Homebrew, Debian,
      Fedora/DNF, MacPorts, Nix, Arch, Ubuntu, and openSUSE/Zypper packaging.
  package-nerd-significance:
    - >
      BibTool matters because bibliography cleanup is both mundane and surprisingly
      exacting. Packaging it gives TeX users a scriptable, reproducible way to keep
      large .bib databases consistent without opening a GUI reference manager.
  project-history:
    - >
      The BibTool manual and README frame the project as filling the gap between
      BibTeX's citation/bibliography generation role and the day-to-day management of
      BibTeX files. Its documented functions include pretty-printing, syntax and
      semantic checks, sorting, merging, reference-key generation, .aux-based
      extraction, regex-based selection and rewriting, macro expansion, and statistics.
    - >
      The manual carries copyright years beginning in 1995, while the public GitHub
      history includes a 2007 initial revision and a 2013 repository
      reorganization/cleanup. The changelog records active 2.x maintenance through
      release 2.68 in April 2020.
  related-projects:
    - >
      BibTool is related to BibTeX, LaTeX, CTAN tooling, biblatex-aware workflows, and
      other bibliography-processing utilities. Compared with bibclean, BibTool is
      broader: it is a BibTeX database manipulation engine, not just a pretty-printer
      and syntax checker.
  sources:
    - https://api.github.com/repos/ge-ne/bibtool
    - https://github.com/ge-ne/bibtool#readme
    - https://raw.githubusercontent.com/ge-ne/bibtool/master/Changes.tex
    - https://raw.githubusercontent.com/ge-ne/bibtool/master/doc/bibtool.tex
    - input.source_facts.package-manager
  summary:
    - >
      BibTool is Gerd Neugebauer's C command-line tool for manipulating BibTeX databases
      beyond what BibTeX itself was designed to do.
  timeline:
    - '1995: BibTool manual copyright period begins.'
    - '2007: Public Git history records an initial revision.'
    - '2013: Repository reorganization and cleanup are recorded.'
    - '2016: Releases 2.63 through 2.66 add resource and biblatex-related work.'
    - '2017: Release 2.67 adds parsing/error-handling documentation and behavior.'
    - '2020: Release 2.68 adds checks, .aux extraction improvements, and resource updates.'
  usage:
    - >
      Users run bibtool to normalize, check, sort, merge, rewrite, select, and extract
      entries from .bib files. Configuration is resource-file driven: the manual
      documents $BIBTOOLRSC, the default .bibtoolrsc in the user's home directory, and
      resource search paths.
related-packages:
  - id: brew:bibclean
    reason: >
      Choose bibclean for focused BibTeX pretty-printing and syntax/value checking;
      choose BibTool when you also need selection, merging, sorting, key generation, or
      rule-driven field rewriting.
    rel: alternative
    sources:
      - https://www.gerd-neugebauer.de/software/TeX/BibTool/en
      - https://www.math.utah.edu/~beebe/software/bibclean/bibclean-03.html
  - id: brew:bibtex-tidy
    reason: >
      Choose bibtex-tidy for a modern formatter-oriented workflow with browser,
      JavaScript, Docker, and pre-commit interfaces; choose BibTool for its broader
      native database-manipulation language.
    rel: alternative
    sources:
      - https://www.gerd-neugebauer.de/software/TeX/BibTool/en
      - https://github.com/FlamingTempura/bibtex-tidy#readme
category: productivity
package-manager:
  brew: bib-tool
  debian: bibtool
  dnf: BibTool
  macports: BibTool
  nix: bibtool
  pacman: bibtool
  ubuntu: bibtool
  zypper: bibtool
package-manager-url: https://formulae.brew.sh/formula/bib-tool
license: GPL-2.0-or-later
tags:
  - bibliography
  - bibtex
  - cli
  - latex
description: Manipulates BibTeX databases
executables:
  - bibtool
provenance:
  formula: bib-tool
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
