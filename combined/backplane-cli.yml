id: brew:backplane-cli
display-name: backplane-cli
homepage: https://github.com/openshift/backplane-cli
repo: https://github.com/openshift/backplane-cli
docs:
  - https://github.com/openshift/backplane-cli/blob/main/docs/PS1-setup.md
  - https://github.com/openshift/backplane-cli#readme
config-file-location:
  unix: ~/.config/backplane/config.json
credentials-file-location:
  unix: ~/.config/backplane/config.json
history:
  adoption-history:
    - >
      Adoption is intentionally narrow compared with general cloud CLIs. The project
      lives under the OpenShift organization, integrates with the OpenShift Cluster
      Manager CLI plugin model, and is packaged through Homebrew for operators who need
      repeatable local installation.
  package-nerd-significance:
    - >
      backplane-cli is notable as vendor SRE tooling that still follows normal
      package-manager distribution. It shows the ocm plugin naming pattern in practice:
      the installed binary is ocm-backplane, but users get a subcommand-like ocm
      backplane UX.
  project-history:
    - >
      The OpenShift GitHub repository was created in January 2023, and its releases list
      v0.1.0 in March 2023. The README describes the project as a CLI tool for
      backplane-api, installable from an OpenShift SRE Homebrew tap, downloadable from
      GitHub releases, or buildable from source.
    - >
      The command set grew around managed OpenShift support workflows: cluster
      login/logout, console access, cloud credentials, SSM sessions, privilege
      elevation, script and managed-job execution, health checks, and status reporting.
  related-projects:
    - >
      The README links backplane-api as the service API, openshift-online/ocm-cli as the
      plugin host, and uses oc/kubeconfig conventions for cluster access. PagerDuty and
      JIRA appear in documented credential/configuration flows.
  sources:
    - https://api.github.com/repos/openshift/backplane-cli
    - https://api.github.com/repos/openshift/backplane-cli/releases
    - https://github.com/openshift/backplane-cli#readme
    - https://github.com/openshift/backplane-cli/blob/main/docs/PS1-setup.md
  summary:
    - >
      backplane-cli is an OpenShift operations CLI for interacting with the OpenShift
      Backplane API. It builds the ocm-backplane binary, which acts as an ocm plugin
      invoked as ocm backplane.
  timeline:
    - '2023: GitHub repository created under openshift/backplane-cli.'
    - '2023: v0.1.0 published in GitHub releases.'
    - '2025: v0.6.2 published as the release train continued.'
    - '2026: v0.10.2 published in GitHub releases.'
  usage:
    - >
      Operators use ocm backplane to log into a target cluster, source or export
      kubeconfig data, open the OpenShift console, retrieve temporary cloud-provider
      credentials, run managed jobs, and store configuration in
      ~/.config/backplane/config.json. The README warns that this config can contain
      PagerDuty API keys or JIRA tokens and should have restrictive permissions.
related-packages:
  - id: brew:openshift-cli
    reason: >
      Use OpenShift CLI after backplane-cli establishes a cluster session and
      kubeconfig; `oc` supplies the general cluster inspection and administration
      commands used within that authenticated workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/openshift/backplane-cli#readme
      - >
        https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/cli_tools/openshift-cli-oc
category: cloud-infrastructure
package-manager:
  brew: backplane-cli
package-manager-url: https://formulae.brew.sh/formula/backplane-cli
license: Apache-2.0
tags:
  - api
  - cli
  - openshift
description: CLI for interacting with the OpenShift Backplane API
executables:
  - ocm-backplane
provenance:
  formula: backplane-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
