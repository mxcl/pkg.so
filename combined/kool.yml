id: brew:kool
display-name: Kool
homepage: https://kool.dev
repo: https://github.com/kool-dev/kool
docs:
  - https://kool.dev/docs
  - https://kool.dev/docs/getting-started/how-it-works
  - https://github.com/kool-dev/kool#readme
config-file-location:
  unix:
    - kool.yml
    - kool.cloud.yml
credentials-file-location:
  unix: .env
history:
  adoption-history:
    - >
      Kool targets web developers and teams using containers for local development and
      cloud deployment. Its documentation organizes the project around a CLI, framework
      presets, Docker Compose files, `kool.yml` scripts, and Kool Cloud deployment
      configuration.
  package-nerd-significance:
    - >
      Kool is package-nerd significant as a higher-level wrapper around Docker Compose
      and Kubernetes-era deployment habits. It represents a recurring package-manager
      pattern: installing a small CLI that standardizes project-local container
      workflows across many application stacks.
  project-history:
    - >
      The repository was created on 2020-07-06 and release 1.0.0 was published the same
      day. The README describes Kool as a way to make modern development environments
      lightweight, fast, and reproducible while reducing the Docker learning curve.
  related-projects:
    - >
      Kool is related to Docker, Docker Compose, Kubernetes, Kool Cloud, and framework
      presets for Laravel, Symfony, NestJS, Next.js, Nuxt.js, WordPress, Hugo, and other
      web stacks.
  sources:
    - https://api.github.com/repos/kool-dev/kool
    - https://github.com/kool-dev/kool
    - https://github.com/kool-dev/kool/releases/tag/1.0.0
    - https://kool.dev/docs/getting-started/how-it-works
    - https://raw.githubusercontent.com/kool-dev/kool/master/README.md
  summary:
    - >
      Kool is a container-focused developer-environment CLI for web applications. It
      wraps Docker, Docker Compose, presets, recipes, and deployment-oriented workflows
      behind a single command-line interface.
  timeline:
    - '2020-07-06: GitHub repository created.'
    - '2020-07-06: 1.0.0 release published.'
    - '2020-07-07: 1.0.1 through 1.0.4 releases published.'
  usage:
    - >
      Users start projects with preset-generated configuration, run local containers
      with Kool commands, execute commands inside services, and keep project scripts in
      `kool.yml`. Kool documentation also describes `.env` and `.env.local` loading for
      environment variables.
related-packages: []
category: developer-tools
package-manager:
  brew: kool
  nix: kool
package-manager-url: https://formulae.brew.sh/formula/kool
license: MIT
tags:
  - cli
  - containers
  - development-environment
  - docker
  - kubernetes
  - web-development
description: Web apps development with containers made easy
executables:
  - kool
provenance:
  formula: kool
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
