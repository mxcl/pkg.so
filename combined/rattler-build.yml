id: brew:rattler-build
display-name: rattler-build
homepage: https://rattler.build
repo: https://github.com/prefix-dev/rattler-build
docs:
  - https://rattler-build.prefix.dev/latest
config-file-location:
  unix:
    - /etc/rattler/config.toml
    - /etc/rattler-build/config.toml
    - $XDG_CONFIG_HOME/rattler/config.toml
    - $RATTLER_HOME/config.toml
    - $XDG_CONFIG_HOME/rattler-build/config.toml
    - ~/.rattler-build/config.toml
    - $RATTLER_BUILD_HOME/config.toml
  windows: C:\ProgramData\rattler\config.toml
credentials-file-location:
  unix:
    - ~/.rattler/credentials.json
    - ~/.netrc
    - $RATTLER_AUTH_FILE
    - $NETRC
history:
  adoption-history:
    - >
      Rattler-build has entered multiple distribution ecosystems, including Homebrew,
      Alpine Linux, Nix, Arch-oriented packaging, and conda channels. It is also used
      through CI actions and Python integration APIs in conda package-building
      workflows.
  package-nerd-significance:
    - >
      Rattler-build is important to packaging enthusiasts because it rethinks the
      established conda-build workflow in a compiled Rust tool while advancing the newer
      `recipe.yaml` format. It combines fast dependency solving and package construction
      with cross-platform and cross-architecture build support.
  project-history:
    - >
      Prefix.dev developed rattler-build as a universal conda package builder in the
      broader Rattler ecosystem. It introduced a `recipe.yaml` specification that
      differs from conda-build's traditional `meta.yaml`, while retaining
      compatibility-oriented concepts familiar to conda recipe authors.
    - >
      The project evolved rapidly through frequent releases, gaining recipe generation,
      testing, variants, cross-compilation, package-format support, Python bindings, and
      integrations for conda ecosystem tooling. Later releases added automatic
      tool-specific configuration discovery and experimental structured build steps.
  related-projects:
    - >
      conda-build is the established conda package builder whose recipe model influenced
      rattler-build.
    - >
      Rattler supplies Rust libraries for solving, package formats, environments, and
      other conda ecosystem operations.
    - >
      conda-smithy and conda-forge tooling are downstream integration points for conda
      recipe workflows.
  sources:
    - 'Official documentation: https://rattler-build.prefix.dev/latest/'
    - >
      Official recipe specification:
      https://rattler-build.prefix.dev/latest/reference/recipe_file/
    - 'Official releases: https://github.com/prefix-dev/rattler-build/releases'
    - source_facts.package-manager
  summary:
    - >
      Rattler-build is a Rust-based, cross-platform builder for conda packages. It reads
      declarative recipes, resolves dependencies, runs builds and tests, and produces
      conda package artifacts.
  timeline:
    - >
      Early project: Prefix.dev introduced rattler-build as a fast builder built on the
      Rust Rattler ecosystem.
    - >
      Subsequent development: The project established `recipe.yaml` as its recipe format
      and expanded cross-platform build and test support.
    - >
      2026: Releases added automatic configuration discovery, broader mobile-platform
      support, structured experimental build steps, and deeper conda-tooling
      integration.
  usage:
    - >
      Package maintainers place build metadata in a `recipe.yaml` file and invoke
      commands such as `rattler-build build --recipe recipe.yaml`. Typical workflows
      render recipes, solve build environments, execute build scripts, run tests, and
      publish the resulting conda artifacts.
    - >
      A recipe is project input rather than the application's own configuration file.
      Although newer releases support discovered tool configuration, the reviewed
      official material did not establish sufficiently clear cross-platform default
      paths for this field.
category: developer-tools
package-manager:
  apk: rattler-build
  brew: rattler-build
  nix: rattler-build
  pacman: rattler-build
package-manager-url: https://formulae.brew.sh/formula/rattler-build
license: BSD-3-Clause
tags:
  - cli
  - conda
  - cross-platform
  - package-build
  - packaging
description: Universal conda package builder
executables:
  - patch-apply-gen-test-data
  - rattler-build
provenance:
  formula: rattler-build
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
