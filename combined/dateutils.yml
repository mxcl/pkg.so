id: brew:dateutils
display-name: dateutils
homepage: https://www.fresse.org/dateutils/
repo: https://github.com/hroptatyr/dateutils
docs:
  - https://github.com/hroptatyr/dateutils#readme
  - https://www.fresse.org/dateutils
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official homepage lists native packages across Linux distributions and BSD
      variants, which matches its role as a small system utility rather than an
      application framework.
  package-nerd-significance:
    - >
      dateutils is package-nerd candy because it does one old Unix thing well: it
      extends text pipelines with calendar semantics, especially for financial-data
      workflows where ordinary `date` and `seq` get awkward.
  project-history:
    - >
      The project is maintained by Sebastian Freundt and presents itself as a Unix
      command family for date/time manipulation, with commands that intentionally
      resemble familiar shell tools.
  related-projects:
    - >
      The tools are conceptually adjacent to Unix `date`, `seq`, `grep`, `sort`, and the
      C library `strptime` function.
  sources:
    - https://www.fresse.org/dateutils
    - https://github.com/hroptatyr/dateutils/blob/master/README.md
    - https://github.com/hroptatyr/dateutils/releases
  summary:
    - >
      dateutils is a collection of command-line tools for date and time calculation,
      conversion, filtering, sorting, and comparison.
  timeline:
    - '2010s: dateutils is distributed as a small command-line suite with upstream releases.'
    - '2014: The official homepage lists multiple distro and BSD package entries.'
    - '2020s: The GitHub repository remains the primary upstream source listed by the project.'
  usage:
    - >
      Package users reach for commands such as `dateadd`, `dateconv`, `datediff`,
      `dategrep`, `dateseq`, and `datesort` when shell scripts need calendar-aware
      operations without embedding custom date logic.
related-packages:
  - id: brew:coreutils
    reason: >
      Choose GNU Coreutils when standard `date` parsing, formatting, and arithmetic are
      sufficient; choose dateutils for a dedicated suite covering bulk sequences,
      differences, filtering, sorting, and calendar-aware operations.
    rel: alternative
    sources:
      - https://www.fresse.org/dateutils/
      - https://www.gnu.org/software/coreutils/manual/html_node/date-invocation.html
      - https://www.gnu.org/software/coreutils/manual/html_node/Options-for-date.html
category: developer-tools
package-manager:
  apk: dateutils
  brew: dateutils
  debian: dateutils
  dnf: dateutils
  macports: dateutils
  nix: dateutils
  pacman: dateutils
  ubuntu: dateutils
  zypper: dateutils
package-manager-url: https://formulae.brew.sh/formula/dateutils
license: BSD-3-Clause
tags:
  - calendar
  - cli
  - date-time
  - financial-data
  - unix-tools
description: Tools to manipulate dates with a focus on financial data
executables:
