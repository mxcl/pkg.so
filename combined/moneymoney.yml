history:
  adoption-history:
    - >
      MoneyMoney is tailored to German and European banking, including FinTS/HBCI and
      PSD2-era authentication. The vendor states that it supports more than 6,500
      European banks and publishes both German and English interfaces.
  package-nerd-significance:
    - >
      MoneyMoney is distinctive in macOS package collections because it is a native,
      locally storing banking client built around German banking protocols rather than a
      generic expense ledger or browser-based aggregator. Its AppleScript and Lua
      interfaces also give automation-oriented Mac users controlled integration points.
  project-history:
    - >
      MoneyMoney is a commercial macOS banking and financial-management application from
      MRH applications GmbH. The official site is copyrighted from 2012 and presents the
      application as a locally storing client for bank accounts, transfers, statements,
      budgets, securities, and financial analysis.
  related-projects:
    - >
      The application imports common interchange formats including CSV, QIF, OFX/QFX,
      CAMT, and MT940.
    - >
      Its AppleScript interface supports transaction export and creation of transfers
      and direct debits; a Lua interface supports additional import/export formats and
      service integrations.
  sources:
    - 'Official Help & FAQ: https://moneymoney.app/help/'
    - 'Official product overview: https://moneymoney.app/'
    - 'Official security information: https://moneymoney.app/security/'
  summary:
    - >
      MoneyMoney is a commercial macOS online-banking and personal-finance application
      focused on German and European financial institutions. It stores credentials and
      transaction data in an encrypted local database and supports transfers,
      statements, categorization, budgets, and portfolio views.
  timeline:
    - "2012: Earliest year shown in the vendor's official copyright range for MoneyMoney."
    - >
      2018–2019: MoneyMoney adapted its account-access workflows to the European PSD2
      strong-authentication regime.
    - >
      2026: MRH applications continues to distribute and support MoneyMoney for current
      macOS releases.
  usage:
    - >
      Users add a bank by entering an IBAN or selecting a service, provide the required
      banking credentials, and choose accounts to manage. MoneyMoney downloads balances
      and transactions and can initiate transfers through supported FinTS/HBCI security
      procedures.
    - >
      The application permanently stores retrieved transactions locally. The official
      FAQ recommends opening the database location through Help → Show Database in
      Finder and backing up both the `Database` and `Statements` folders.
