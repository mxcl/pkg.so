id: brew:cariddi
display-name: cariddi
homepage: https://edoardottt.com/
repo: https://github.com/edoardottt/cariddi
docs:
  - https://github.com/edoardottt/cariddi#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions list Homebrew, Snap, Go install, Pacman, NixOS,
      and source builds, while the input package facts also show packaging in Homebrew,
      apk, and Nix. That is the usual adoption shape for modern infosec CLIs: the tool
      lives upstream on GitHub, but package managers make it convenient to drop into bug
      bounty and automation environments.
  package-nerd-significance:
    - >
      For package-manager catalogs, cariddi is a representative Go security CLI: a
      single executable, broad install coverage, and behavior centered on Unix
      pipelines. Its value in a package index is that a reconnaissance workflow can
      depend on the packaged binary instead of a local Go checkout.
  project-history:
    - >
      The public GitHub repository was created in 2021 under edoardottt/cariddi. The
      project presents itself as a small focused CLI rather than a service: install it
      with Go or a package manager, pipe targets into stdin, and compose flags for the
      kind of reconnaissance desired.
  related-projects:
    - >
      Related package-manager neighbors are other bug-bounty and reconnaissance CLIs
      that accept URL lists on stdin and emit findings suitable for pipelines.
    - >
      The README points users to Go for source builds and to shell-oriented package
      managers for installation.
  sources:
    - https://api.github.com/repos/edoardottt/cariddi
    - https://github.com/edoardottt/cariddi
    - https://edoardottt.com/
    - https://github.com/edoardottt/cariddi#readme
    - https://formulae.brew.sh/api/formula/cariddi.json
  summary:
    - >
      cariddi is a Go command-line web crawling and scanning tool for security
      reconnaissance. Its official README describes feeding it URLs or domains, then
      using flags to discover endpoints, secrets, API keys, file extensions, tokens,
      errors, and related web artifacts.
  timeline:
    - '2021: Public GitHub repository created.'
    - >
      2020s: README documents Homebrew, Snap, Go install, Pacman, NixOS, and
      source-build installation paths.
    - '2020s: Package facts show availability through Homebrew, apk, and Nix.'
  usage:
    - >
      cariddi reads targets from stdin or a file and can scan one URL or many. The
      README documents modes for secret hunting, endpoint discovery, extension checks,
      error checks, useful-information extraction, JSON output, proxy use, custom
      headers, custom ignore lists, cache use, timeout control, concurrency, and depth
      limits.
related-packages:
  - id: cask:burp-suite
    reason: >
      cariddi's official README documents routing its requests through Burp Suite so
      users can inspect the crawler's traffic in Burp's web-testing proxy.
    rel: adjacent_workflow
    sources:
      - https://github.com/edoardottt/cariddi#readme
      - https://portswigger.net/burp/documentation/desktop/tools/proxy
category: security
package-manager:
  apk: cariddi
  brew: cariddi
  nix: cariddi
package-manager-url: https://formulae.brew.sh/formula/cariddi
license: GPL-3.0-or-later
tags:
  - cli
  - endpoint-discovery
  - secret-scanning
  - security
  - web-crawler
description: Scan for endpoints, secrets, API keys, file extensions, tokens and more
executables:
  - cariddi
provenance:
  formula: cariddi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
