id: brew:duck
display-name: duck
homepage: https://duck.sh/
repo: https://github.com/iterate-ch/cyberduck
docs:
  - https://docs.duck.sh/cli
  - https://duck.sh/
config-file-location: null
credentials-file-location:
  linux: ~/.duck/
history:
  adoption-history:
    - >
      duck's adoption follows Cyberduck's protocol breadth rather than the popularity
      curve of a standalone Unix transfer tool. Users choose it when they want one
      command-line client that speaks the same storage profiles and cloud protocols as
      Cyberduck and Mountain Duck.
    - >
      Packaging through Homebrew, Chocolatey, Debian/Ubuntu-style repositories, and RPM
      repositories made the CLI available to automation users who do not run the desktop
      application.
  package-nerd-significance:
    - >
      duck is interesting because the package name is short and generic while the
      project identity is really Cyberduck CLI. Package databases should preserve that
      relationship so users do not confuse it with unrelated projects named duck.
    - >
      It also demonstrates a common packaging pattern: a GUI application exposes a CLI
      package with a different formula name, while sharing source code and protocol
      implementations with the main application.
  project-history:
    - >
      Cyberduck began as a macOS file-transfer application and its official changelog
      reaches back to early 2000s releases. The current source repository describes
      Cyberduck as a libre file transfer client for macOS and Windows, with a
      command-line interface for Linux, macOS, and Windows.
    - >
      The duck CLI packages the Cyberduck transfer engine for terminal users. Its
      homepage presents it as Cyberduck for the command line and documents Homebrew,
      Chocolatey, RPM, and DEB installation paths.
  related-projects:
    - >
      Cyberduck is the parent project and desktop client; Mountain Duck is a related
      mount-to-desktop product from the same ecosystem.
    - >
      duck overlaps in use with rclone, lftp, sftp, aws-cli, and provider-specific cloud
      storage CLIs, but its protocol coverage comes from the Cyberduck stack.
  sources:
    - https://github.com/iterate-ch/cyberduck
    - https://duck.sh/
    - https://docs.duck.sh/cli
    - https://cyberduck.io/changelog/
  summary:
    - >
      duck is the command-line interface for Cyberduck, the long-running file-transfer
      client. It gives Cyberduck's multi-protocol transfer stack a scriptable shell
      front end for FTP, SFTP, WebDAV, S3-compatible storage, OpenStack Swift, and other
      cloud-storage backends.
  timeline:
    - '2003: Cyberduck 2.1 appears in the official changelog.'
    - "2015: duck.sh copyright history starts, matching the CLI's public packaging era."
    - >
      2020s: Cyberduck continues shipping desktop releases while duck remains the CLI
      package for Linux, macOS, and Windows.
    - '2026: Cyberduck 9.5.0 appears in the official changelog.'
  usage:
    - >
      The CLI is used for uploads, downloads, remote editing workflows, and copies
      between servers or cloud providers. It is especially relevant for scripted access
      to storage backends that otherwise require provider-specific CLIs.
    - >
      Because the same upstream project also ships GUI Cyberduck and Mountain Duck
      components, duck sits at the command-line edge of a broader file-transfer product
      family.
related-packages:
  - id: brew:rclone
    reason: >
      Choose rclone for rsync-like synchronization, mounting, and automation across a
      particularly broad set of cloud-storage backends; choose duck when Cyberduck
      profiles and its transfer ecosystem are the better fit.
    rel: alternative
    sources:
      - https://docs.duck.sh/cli/
      - https://rclone.org/docs/
  - id: brew:lftp
    reason: >
      Choose lftp for a Unix-oriented transfer shell with mirroring, queues, retries,
      and background jobs when its FTP, HTTP, and SFTP focus is preferable to duck's
      cloud-provider profiles.
    rel: alternative
    sources:
      - https://docs.duck.sh/cli/
      - https://lftp.yar.ru/lftp-man.html
category: networking
package-manager:
  brew: duck
  chocolatey: duck
  debian: duck
  macports: duck
  ubuntu: duck
package-manager-url: https://formulae.brew.sh/formula/duck
license: GPL-3.0-only
tags:
  - cli
  - cloud-storage
  - file-transfer
  - ftp
  - sftp
  - webdav
description: Command-line interface for Cyberduck (a multi-protocol file transfer tool)
executables:
  - duck
provenance:
  formula: duck
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
