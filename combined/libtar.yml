id: brew:libtar
display-name: Not completed
homepage: https://repo.or.cz/libtar.git
repo: https://repo.or.cz/libtar.git
docs:
  - https://repo.or.cz/libtar.git
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libtar's adoption is mostly downstream and infrastructural rather than
      user-facing. The input metadata shows packaging in Homebrew, Fedora, MacPorts,
      Nix, Arch, Ubuntu, and openSUSE families, which matches its niche as a C library
      that other software can link when it needs tar archive operations without invoking
      the tar command.
  package-nerd-significance:
    - >
      libtar is package-nerd glue: a small C dependency that exists so build systems and
      applications do not need to shell out or vendor tar handling. Its repo.or.cz
      maintenance status also illustrates a common packaging reality: useful libraries
      can outlive their original release process because distributions still need a
      canonical source.
  project-history:
    - >
      The package is associated with Mark Roth and the University of Illinois era of
      late-1990s and early-2000s Unix utility code. The repo.or.cz project page
      describes the hosted tree as a maintenance repository for libtar, temporarily run
      by Chris Frey until Mark Roth resumed development.
    - >
      The maintained repository shifted the project from tarball-style upstream releases
      toward tagged source snapshots. The page explicitly says no tarball releases would
      be done from that maintenance repo and directs users to grab tagged sources
      instead.
  related-projects:
    - >
      GNU tar and libarchive occupy adjacent archive-handling territory; libtar is
      narrower, with a C API focused on tar files.
  sources:
    - https://github.com/Parrot-Developers/libtar
    - https://github.com/tklauser/libtar/blob/master/lib/libtar.h
    - https://repo.or.cz/libtar.git
  summary:
    - >
      libtar is a small C library for manipulating POSIX tar archives. Its history is
      thinly documented, but the maintained source page identifies it as a Mark Roth
      project kept alive through a maintenance repository for packagers and downstream
      users.
  timeline:
    - >
      1998-2003: Copyright ranges in downstream source copies identify the original Mark
      Roth and University of Illinois development period.
    - >
      2013: The repo.or.cz maintenance repository records libtar 1.2.20 and a short
      burst of portability and correctness fixes.
    - >
      2013: The maintained repository states that tagged source snapshots, rather than
      new tarball releases from that tree, are the distribution path.
  usage:
    - >
      The library is used by C programs that need to read, write, append, or extract tar
      archives through an API. Its appeal is that it gives applications direct archive
      manipulation while preserving familiar POSIX tar semantics.
related-packages:
  - id: brew:libarchive
    reason: >
      Choose libarchive when an application must handle formats beyond tar—such as cpio,
      ZIP, ISO images, and multiple compression filters—through one streaming C API.
    rel: alternative
    sources:
      - https://repo.or.cz/libtar.git
      - https://www.libarchive.org
      - https://github.com/libarchive/libarchive/wiki
