config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      JACK became standard plumbing for low-latency audio workflows on Linux because it
      let synthesizers, DAWs, effects processors, recorders, and MIDI tools connect as a
      graph rather than each owning the audio device. Its package metadata spans
      Homebrew, Debian/Ubuntu, MacPorts, Arch, Chocolatey, and openSUSE, reflecting
      cross-platform packaging of a historically Unix-centered audio stack.
    - >
      The 2022 JACK1/JACK2 release note is a useful adoption marker: JACK1 was described
      as continuing in maintenance mode while JACK2 carried official FreeBSD support and
      ongoing platform work.
  package-nerd-significance:
    - >
      JACK is significant because it is a package-manager dependency that changes what
      an audio workstation can be. Installing it adds a shared routing substrate used by
      many separate packages, so distribution maintainers care about ABI compatibility,
      realtime permissions, drivers, example tools, and how JACK coexists with ALSA,
      PulseAudio, and PipeWire-era systems.
  project-history:
    - >
      The JACK project site describes JACK as an API plus daemon implementations for
      real-time, low-latency audio and MIDI connections between applications. The
      download page documents the split source repositories for JACK1 and JACK2 and
      gives jack2 as the repository browsed for the JACK2 tree.
    - >
      The GitHub jackaudio/jack2 repository was created in 2012, but JACK as a project
      predates that repository history. In the maintained release stream, JACK2 1.9.x
      releases continued through the 2020s with work on macOS, Windows, FreeBSD, Python
      build compatibility, ARM ringbuffer safety, and separation of example tools.
  related-projects:
    - >
      Related projects include JACK1, JACK2, jack-example-tools, jack2-releases,
      QjackCtl, ALSA, PulseAudio, PipeWire, and JACK-aware audio applications.
  sources:
    - https://api.github.com/repos/jackaudio/jack2/releases?per_page=50
    - https://formulae.brew.sh/formula/jack
    - https://jackaudio.org/
    - https://jackaudio.org/downloads/
    - https://jackaudio.org/news/2022/01/15/jack1-v01260-and-jack2-v1920-releases.html
    - https://jackaudio.org/news/2023/02/03/jack2-v1922-release.html
  summary:
    - >
      JACK Audio Connection Kit is a professional sound server API and daemon family for
      low-latency routing of audio and MIDI between applications. It is one of the
      defining pieces of Linux and Unix-like pro-audio infrastructure.
  timeline:
    - '2000s: JACK became core infrastructure for Unix-like low-latency audio workflows.'
    - '2012: jackaudio/jack1 and jackaudio/jack2 GitHub repositories were created.'
    - '2021: JACK2 1.9.18 and 1.9.19 releases focused on platform and API fixes.'
    - >
      2022: JACK1 0.126.0 and JACK2 1.9.20 releases moved examples and tools toward a
      separate repository and added official FreeBSD support for JACK2.
    - >
      2023: JACK2 1.9.22 removed bundled example clients/tools and fixed Python 3.11+
      build compatibility.
  usage:
    - >
      Users run jackd or compatible session tools to create a low-latency audio server,
      then connect JACK-aware applications through ports. The project site frames the
      common use case as sending one application's audio output to another application,
      splitting it to multiple consumers, and recording the result.
related-packages:
  - id: brew:qjackctl
    reason: >
      QjackCtl is a documented graphical control and routing application for starting,
      configuring, and inspecting a JACK server.
    rel: adjacent_workflow
    sources:
      - https://jackaudio.org/applications/
      - https://qjackctl.sourceforge.io/
  - id: brew:pipewire
    reason: >
      Choose PipeWire on Linux when you want a unified modern media server that can run
      JACK clients through its JACK compatibility library.
    rel: alternative
    sources:
      - https://docs.pipewire.org/page_objects_design.html
      - https://jackaudio.org/
  - id: brew:carla
    reason: >
      Carla is a modular plugin host that can use JACK for routing audio and MIDI among
      hosted LV2, LADSPA, DSSI, and VST plugins.
    rel: adjacent_workflow
    sources:
      - https://kx.studio/Applications:Carla
      - https://jackaudio.org/applications/
category: media
