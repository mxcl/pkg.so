id: brew:creduce
display-name: C-Reduce
homepage: https://github.com/csmith-project/creduce
repo: https://github.com/csmith-project/creduce
docs:
  - https://github.com/csmith-project/creduce#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The installation guide explicitly points users to precompiled packages before
      building from source, naming Ubuntu, Debian, Gentoo, FreeBSD, and macOS through
      Homebrew. That packaging coverage is important because C-Reduce depends on a
      substantial toolchain, including LLVM/Clang and Perl modules.
  package-nerd-significance:
    - >
      For package and compiler maintainers, C-Reduce is significant because it turns
      large failure cases into small, shareable reproducers. Its presence in multiple
      operating-system package collections makes a research-grade reducer available as a
      normal developer tool.
  project-history:
    - >
      The official README describes C-Reduce as a tool for people who discover and
      report bugs in compilers and other C/C++-processing tools. The repository tags
      include PLDI and TOPLAS publication-related tags, reflecting its roots in
      compiler-research tooling as well as its practical use by compiler bug reporters.
  related-projects:
    - >
      C-Reduce is hosted under the csmith-project GitHub organization and is related by
      project lineage to Csmith-style compiler testing workflows.
  sources:
    - https://github.com/csmith-project/creduce#readme
    - https://github.com/csmith-project/creduce/blob/master/INSTALL.md
    - https://embed.cs.utah.edu/creduce/
  summary:
    - >
      C-Reduce is a test-case reducer for C and C++ programs. Given a large program and
      an interestingness test, it repeatedly transforms the input until it preserves the
      property of interest while producing a much smaller reproducer.
  timeline:
    - 'PLDI-era tags: Repository contains publication-related tags such as pldi12-crc'
    - '2.x series: Repository tags show a maintained 2.x release line'
    - >
      Current install guide: Documents packages in Ubuntu, Debian, Gentoo, FreeBSD, and
      Homebrew
  usage:
    - >
      Users pair C-Reduce with a project-specific interestingness test, often one that
      detects a compiler crash, wrong-code result, warning, or other minimized behavior.
      The README also notes that it can work well on languages beyond C/C++, including
      JavaScript and Rust, despite its primary C/C++ focus.
related-packages:
  - id: brew:csmith
    reason: >
      Csmith generates random defined-behavior C programs to expose compiler bugs, after
      which C-Reduce can minimize a failing generated program into a practical bug
      report.
    rel: adjacent_workflow
    sources:
      - https://github.com/csmith-project/csmith#readme
      - https://github.com/csmith-project/creduce#readme
category: developer-tools
package-manager:
  brew: creduce
  debian: creduce
  macports: creduce
  nix: creduce
  ubuntu: creduce
package-manager-url: https://formulae.brew.sh/formula/creduce
license: BSD-3-Clause
tags:
  - c
  - c-plus-plus
  - cli
  - compiler-testing
  - test-case-reduction
description: Reduce a C/C++ program while keeping a property of interest
executables:
  - creduce
provenance:
  formula: creduce
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
