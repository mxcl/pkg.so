id: brew:ghi
display-name: ghi
homepage: https://github.com/drazisil/ghi
repo: https://github.com/drazisil/ghi
docs:
  - https://github.com/drazisil/ghi#readme
config-file-location:
  unix: ~/.gitconfig
  windows: '%USERPROFILE%\.gitconfig'
credentials-file-location:
  unix: ~/.gitconfig
  windows: '%USERPROFILE%\.gitconfig'
history:
  adoption-history:
    - >
      ghi belongs to the older wave of small GitHub command-line tools that predated or
      complemented larger official CLIs. Its package-manager footprint and gem-style
      installation kept it useful for users who wanted direct issue commands inside Git
      repositories.
  package-nerd-significance:
    - >
      For package collectors, ghi is a compact example of Unix-style GitHub automation:
      one executable, git-config-backed settings, and commands that map closely to
      issue-tracker actions.
  project-history:
    - >
      The maintained README states that ghi was originally created by Stephen Celis and
      later maintained by Drazi Crendraven. The drazisil repository was created in 2017
      and published release 1.2.1 in 2022.
  related-projects:
    - >
      The maintained README points back to Stephen Celis's original ghi repository and
      wiki, and relates the tool to GitHub Issues and git config.
  sources:
    - https://api.github.com/repos/drazisil/ghi
    - https://github.com/drazisil/ghi
    - https://github.com/drazisil/ghi/releases/tag/1.2.1
    - https://github.com/stephencelis/ghi
  summary:
    - >
      ghi is a Ruby command-line client for GitHub Issues, built around the idea that
      issue work can happen from a terminal and a user's editor instead of a browser.
  timeline:
    - '2017: The drazisil-maintained repository was created.'
    - '2022: Release 1.2.1 was published from the maintained repository.'
  usage:
    - >
      Practitioners configure a GitHub personal access token with git config --global
      ghi.token, then use commands such as list, show, open, close, edit, comment,
      label, assign, and milestone. Because it reads Git configuration, the same file
      can act as both configuration and credential storage.
related-packages:
  - id: brew:gh
    reason: >
      Choose GitHub CLI for a first-party, actively documented client that covers GitHub
      Issues as well as pull requests, releases, authentication, and other GitHub
      workflows.
    rel: alternative
    sources:
      - https://github.com/drazisil/ghi#readme
      - https://cli.github.com/manual/gh_issue
      - https://docs.github.com/en/github-cli/github-cli/about-github-cli
category: developer-tools
package-manager:
  apk: ghi
  brew: ghi
  nix: ghi
package-manager-url: https://formulae.brew.sh/formula/ghi
license: MIT
tags:
  - cli
  - github
  - issue-tracking
  - issues
  - ruby
description: Work on GitHub issues on the command-line
executables:
  - ghi
provenance:
  formula: ghi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
