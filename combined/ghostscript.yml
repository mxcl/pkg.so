id: brew:ghostscript
display-name: Ghostscript
homepage: https://www.ghostscript.com/
repo: https://github.com/ArtifexSoftware/ghostpdl-downloads
docs:
  - https://ghostscript.readthedocs.io/
  - https://ghostscript.com/documentation/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ghostscript became infrastructure for Unix printing, document conversion,
      prepress, archiving, and server-side PDF workflows. The project website describes
      uses in printers, multifunction devices, raster image processors, document
      management systems, PDF generation tools, and cloud printing.
  package-nerd-significance:
    - >
      Package nerds care about Ghostscript because it is one of the classic pieces of
      document-processing plumbing: a package that quietly enables print filters, TeX
      and publishing toolchains, image conversion, PDF generation, and archival
      pipelines across many operating systems.
  project-history:
    - >
      Ghostscript dates to the late 1980s: the official version history lists
      Ghostscript 1.0 on August 11, 1988, followed by early 1.x releases in 1989. The
      documentation describes the core product as a PostScript interpreter layer paired
      with a graphics library.
    - >
      The project grew from a PostScript interpreter into the Ghostscript/GhostPDL
      family. Official documentation describes GhostPDF, GhostPCL, GhostXPS, and
      GhostPDL as related products sharing the Ghostscript graphics library, while
      Artifex documents a newer C-based PDF interpreter and the commercial Ghostscript
      Enterprise line.
  related-projects:
    - >
      Related Artifex projects and product names include GhostPDF, GhostPCL, GhostXPS,
      GhostPDL, MuPDF, and Ghostscript Enterprise.
  sources:
    - https://ghostscript.readthedocs.io/en/gs10.05.1/Readme.html
    - https://ghostscript.readthedocs.io/en/gs10.05.1/ReleaseDates.html
    - https://ghostscript.readthedocs.io/en/gs10.05.1/Use.html
    - https://github.com/ArtifexSoftware/ghostpdl-downloads
    - https://web.mit.edu/ghostscript/www/History1.htm
    - https://www.ghostscript.com/
  summary:
    - >
      Ghostscript is a long-running interpreter and conversion engine for PostScript and
      PDF files, with related GhostPDL components for other page description languages.
  timeline:
    - '1988: Ghostscript 1.0 released.'
    - '1989: Ghostscript 1.1, 1.2, and 1.3 released.'
    - '2010: Ghostscript 9.00 released.'
    - '2022: Ghostscript 10.00.0 released.'
  usage:
    - >
      Practitioners usually encounter Ghostscript through the `gs` executable or helper
      commands such as `ps2pdf`. Common workflows include rendering PostScript or PDF to
      images, converting PostScript to PDF, selecting output devices, compressing or
      optimizing PDF files, and embedding the engine through an SDK.
related-packages:
  - id: brew:mupdf
    reason: >
      Choose MuPDF when you want a lightweight viewer and toolkit centered on PDF, XPS,
      and e-books; Ghostscript remains the broader PostScript-oriented interpreter and
      print-conversion engine.
    rel: alternative
    sources:
      - https://ghostscript.readthedocs.io/en/latest/Readme.html
      - https://mupdf.readthedocs.io/en/latest/guide/what-is-mupdf.html
      - https://mupdf.readthedocs.io/en/latest/reference/c/fitz/index.html
