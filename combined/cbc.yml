id: brew:cbc
display-name: Cbc
homepage: https://github.com/coin-or/Cbc
repo: https://github.com/coin-or/Cbc
docs:
  - https://coin-or.github.io/Cbc
  - https://github.com/coin-or/Cbc#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Cbc integrations across modeling systems and packages
      including AMPL, GAMS, MiniZinc, PuLP, cvxpy, Google's OR-Tools, JuMP, OpenSolver,
      and others. Package-manager distribution spans Homebrew, Debian/Ubuntu, Fedora,
      Arch, conda, and FreeBSD according to the official README and supplied package
      facts.
  package-nerd-significance:
    - >
      For package maintainers, Cbc is a dependency-heavy scientific solver that brings a
      slice of the COIN-OR optimization stack into a single installable command. It
      matters because many higher-level modeling front ends can delegate open-source
      MILP solving to the packaged `cbc` binary.
  project-history:
    - >
      Cbc is developed under the COIN-OR Foundation. The official README credits John
      Forrest, formerly of IBM Research, and other maintainers, while the project
      metadata describes it as an LP-based branch-and-cut library designed for use with
      CLP and other COIN-OR components.
  related-projects:
    - >
      Cbc is closely related to COIN-OR projects Clp, Cgl, Osi, CoinUtils, coinbrew,
      CyLP, PuLP, and the COIN-OR Optimization Suite.
  sources:
    - https://api.github.com/repos/coin-or/Cbc
    - https://github.com/coin-or/Cbc
    - https://coin-or.github.io/Cbc
    - https://github.com/coin-or/Cbc#readme
    - https://formulae.brew.sh/api/formula/cbc.json
  summary:
    - >
      Cbc, the COIN-OR Branch-and-Cut solver, is an open-source mixed integer linear
      programming solver written in C++ and distributed as both a callable library and a
      standalone executable.
  timeline:
    - '2019: Current GitHub repository created.'
    - '2023: 2.10.10 and 2.10.11 GitHub releases published.'
    - '2024: 2.10.12 GitHub release published.'
    - '2026: 2.10.13 GitHub release published.'
  usage:
    - >
      Cbc is used either through the `cbc` executable or as a library embedded by
      optimization modeling tools. Source builds commonly use COIN-OR's `coinbrew`
      helper, which fetches Cbc and its COIN-OR dependencies.
related-packages:
  - id: brew:highs
    reason: >
      Choose HiGHS for a modern permissively licensed LP and MIP solver with strong
      emphasis on high-performance linear optimization and official Python and Julia
      integrations.
    rel: alternative
    sources:
      - https://github.com/coin-or/Cbc#readme
      - https://ergo-code.github.io/HiGHS/
  - id: brew:scip
    reason: >
      Choose SCIP when you need constraint integer programming, mixed-integer nonlinear
      programming, branch-cut-and-price customization, or exact-solving capabilities
      beyond Cbc's MILP focus.
    rel: alternative
    sources:
      - https://github.com/coin-or/Cbc#readme
      - https://scipopt.org/scip/doc/html/index.php
  - id: brew:glpk
    reason: >
      Choose GLPK when you want a GNU-licensed LP/MIP toolkit that includes the GNU
      MathProg modeling language and a standalone solver workflow.
    rel: alternative
    sources:
      - https://github.com/coin-or/Cbc#readme
      - https://www.gnu.org/software/glpk/
  - id: brew:clp
    reason: >
      Install or use Clp alongside Cbc when you need the COIN-OR linear-programming
      solver that commonly supplies the LP relaxations underlying Cbc's branch-and-cut
      process.
    rel: adjacent_workflow
    sources:
      - https://github.com/coin-or/Cbc#readme
      - https://coin-or.github.io/Clp/
category: science
package-manager:
  brew: cbc
  nix: cbc
package-manager-url: https://formulae.brew.sh/formula/cbc
license: EPL-2.0
tags:
  - cli
  - coin-or
  - linear-programming
  - mixed-integer-programming
  - optimization
  - solver
description: Mixed integer linear programming solver
executables:
  - cbc
provenance:
  formula: cbc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
