id: brew:jhipster
display-name: JHipster
homepage: https://www.jhipster.tech/
repo: https://github.com/jhipster/generator-jhipster
docs:
  - https://www.jhipster.tech/creating-an-app
  - https://www.jhipster.tech/getting-started
  - https://www.jhipster.tech/installation
config-file-location:
  unix: ./.yo-rc.json
credentials-file-location: null
history:
  adoption-history:
    - >
      JHipster adoption is tied to its promise of reducing full-stack setup cost. It
      packages the choices many enterprise Java teams would otherwise assemble manually:
      Spring Boot, security, database options, build tooling, front-end frameworks,
      tests, Docker, and deployment targets.
    - >
      The npm registry records the package from October 2013, while the GitHub
      repository accumulated a large contributor and user community. Homebrew and
      Chocolatey packaging put the generator into developer workstation package flows
      outside npm alone.
  package-nerd-significance:
    - >
      JHipster matters to package people because it is a package that emits
      package-managed projects. Installing one CLI fans out into npm, Maven or Gradle,
      Docker images, Java dependencies, front-end dependencies, and deployment
      manifests.
    - >
      It is also a durable example of the Yeoman-generator era crossing into Spring Boot
      and cloud-native Java. The package stayed relevant by changing the generated stack
      while preserving the one-command generator workflow.
  project-history:
    - >
      The generator-jhipster repository and npm package were created in October 2013.
      Early release notes describe the original shape as Yeoman plus Maven plus Spring
      plus AngularJS in one generator; by the 2.0.0 line in 2015, the public release
      notes described it as Spring Boot plus AngularJS.
    - >
      JHipster 3.0.0 in 2016 was a major expansion point: the official release notes
      introduced generation for complete microservices architectures, including
      microservices, routers, a service registry, monitoring, and distributed-system
      scaffolding. Later lines broadened the front-end choices, with React moving out of
      experimental status in JHipster 5.0.0 in 2018.
    - >
      The project grew from a generator into an ecosystem: the website includes release
      notes, installation and application-creation docs, a module marketplace, JDL
      Studio, sponsorship through OpenCollective, and daily-build repositories that
      continuously exercise generated application combinations.
  related-projects:
    - Yeoman is the generator framework lineage behind early JHipster.
    - >
      Spring Boot is the Java application framework at the center of generated server
      projects.
    - >
      Angular, React, and Vue are front-end options represented across JHipster release
      lines and generated applications.
    - >
      JDL Studio and the JHipster module marketplace are related tools in the JHipster
      ecosystem.
  sources:
    - https://api.github.com/repos/jhipster/generator-jhipster
    - https://github.com/jhipster/generator-jhipster
    - https://registry.npmjs.org/generator-jhipster
    - https://www.jhipster.tech/
    - https://www.jhipster.tech/2014/09/08/jhipster-release-1.1.0.html
    - https://www.jhipster.tech/2015/01/09/jhipster-release-2.0.0.html
    - https://www.jhipster.tech/2016/03/23/jhipster-release-3.0.0.html
    - https://www.jhipster.tech/2018/06/20/jhipster-release-5.0.0.html
    - https://www.jhipster.tech/releases/
  summary:
    - >
      JHipster is a full-stack application generator that began as a Yeoman generator
      joining Java server applications with a JavaScript front end. It became a
      development platform for generating Spring Boot applications, Angular or React
      clients, microservice systems, deployment descriptors, and project configuration.
  timeline:
    - '2013: The generator-jhipster repository and npm package were created.'
    - '2014: Release 1.1.0 described JHipster as Yeoman plus Maven plus Spring plus AngularJS.'
    - '2015: Release 2.0.0 described the stack as Spring Boot plus AngularJS.'
    - '2016: Release 3.0.0 added complete microservices architecture generation.'
    - '2018: Release 5.0.0 moved React support out of experimental status.'
    - '2026: Release 9.0.0 continued the major-version line after the 8.x series.'
  usage:
    - >
      Developers use the `jhipster` command to generate monoliths, gateways,
      microservices, entities, Docker and Kubernetes assets, and application
      configuration. The `.yo-rc.json` file records generator choices for a project.
    - >
      JHipster is also used as a repeatable architecture template: teams can standardize
      a stack, regenerate entities, share JDL definitions, and keep generated
      conventions aligned across services.
related-packages:
  - id: brew:openjdk
    reason: >
      JHipster requires a supported Java installation, so OpenJDK supplies the JDK used
      to run the generator and compile generated Spring Boot applications.
    rel: adjacent_workflow
    sources:
      - https://www.jhipster.tech/installation/
      - https://openjdk.org/install/
  - id: brew:node
    reason: >
      JHipster requires Node.js for the generator and generated front-end toolchain,
      making Node a direct workstation prerequisite.
    rel: adjacent_workflow
    sources:
      - https://www.jhipster.tech/installation/
      - https://nodejs.org/en/download
category: developer-tools
package-manager:
  brew: jhipster
  chocolatey: jhipster
package-manager-url: https://formulae.brew.sh/formula/jhipster
license: Apache-2.0
tags:
  - angular
  - cli
  - code-generator
  - java
  - microservices
  - react
  - spring-boot
description: Generate, develop and deploy Spring Boot + Angular/React applications
executables:
  - jhipster
provenance:
  formula: jhipster
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
