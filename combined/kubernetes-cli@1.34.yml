id: brew:kubernetes-cli@1.34
display-name: kubectl 1.34
homepage: https://kubernetes.io/docs/reference/kubectl/
repo: https://github.com/kubernetes/kubernetes
docs:
  - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig
  - https://kubernetes.io/docs/reference/kubectl
config-file-location:
  unix: ~/.kube/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The 1.34 versioned package is part of the broader packaging need created by
      Kubernetes' regular minor-release cadence and client/server version-skew policy.
      Teams can pin kubectl in developer laptops, CI jobs, and admin containers while
      clusters move through planned upgrade windows.
  package-nerd-significance:
    - >
      For package nerds, kubernetes-cli@1.34 shows why infrastructure CLIs often need
      parallel version tracks. It lets a package manager express upstream's supported
      minor line as an explicit artifact, which is friendlier to reproducible
      cluster-management environments than a single rolling kubectl formula.
  project-history:
    - >
      The underlying project is kubectl, the Kubernetes command-line client. Kubernetes
      v1.34, titled Of Wind & Will, was released on August 27, 2025 with 58
      enhancements: 23 stable, 22 beta, and 13 alpha. The Kubernetes release-history
      page later listed the 1.34 line with patch releases through 1.34.9 and an
      end-of-life date of October 27, 2026.
  related-projects:
    - >
      kubernetes-cli@1.34 is related to kubectl, Kubernetes 1.34 release artifacts,
      kubeconfig, Homebrew versioned formulae, kubeadm, and downstream managed
      Kubernetes upgrade workflows.
  sources:
    - https://kubernetes.io/blog/2025/08/27/kubernetes-v1-34-release/
    - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
    - https://kubernetes.io/docs/reference/kubectl/
    - https://kubernetes.io/releases/
  summary:
    - >
      kubernetes-cli@1.34 is the Homebrew versioned formula for the kubectl client from
      the Kubernetes 1.34 minor line. It gives users an installable kubectl tied to the
      1.34 release series for cluster administration, scripts, and
      compatibility-sensitive automation.
  timeline:
    - '2025-08-27: Kubernetes v1.34 was released.'
    - '2026-06-09: Kubernetes release history listed 1.34.9 as a patch release.'
    - '2026-10-27: Kubernetes release history listed 1.34 end of life.'
  usage:
    - >
      Operationally, kubernetes-cli@1.34 behaves like kubectl: it reads kubeconfig,
      chooses a context, and sends API requests to the selected cluster. The package's
      value is version selection, not a separate command surface.
related-packages:
  - id: brew:krew
    reason: >
      Krew discovers and installs community kubectl plugins that appear as additional
      kubectl subcommands.
    rel: adjacent_workflow
    sources:
      - https://kubernetes.io/docs/tasks/extend-kubectl/kubectl-plugins/
      - https://sigs.k8s.io/krew/
  - id: brew:helm
    reason: >
      Use Helm alongside kubectl when Kubernetes applications should be installed,
      upgraded, and rolled back as versioned charts rather than managed as individual
      manifests.
    rel: adjacent_workflow
    sources:
      - https://helm.sh/docs/intro/introduction/
      - https://helm.sh/docs/intro/quickstart/
category: developer-tools
package-manager:
  apk: kubectl
  brew: kubernetes-cli@1.34
  chocolatey: kubernetes-cli
  debian: kubectl
  macports: kubectl
  nix: kubectl
  pacman: kubectl
  scoop: main/kubectl
  winget: Kubernetes.kubectl
package-manager-match:
  chocolatey: fallback
package-manager-url: https://formulae.brew.sh/formula/kubernetes-cli@1.34
license: Apache-2.0
tags:
  - cli
  - cluster-management
  - kubectl
  - kubernetes
  - versioned
description: Kubernetes command-line interface
executables:
  - kubectl
provenance:
  formula: kubernetes-cli@1.34
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
