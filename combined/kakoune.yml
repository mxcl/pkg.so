id: brew:kakoune
display-name: Kakoune
homepage: https://github.com/mawww/kakoune
repo: https://github.com/mawww/kakoune
docs:
  - https://github.com/mawww/kakoune#readme
  - https://kakoune.org/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/kak/kakrc
    - ~/.config/kak/kakrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Kakoune developed a dedicated terminal-editor community because it explored a
      post-Vim design space without abandoning modal editing, shell integration,
      scripting, and small composable commands. Packaging across Homebrew, Linux
      distributions, MacPorts, Nix, and other systems made it easy for editor
      enthusiasts to try it alongside Vim, Neovim, and Helix.
  package-nerd-significance:
    - >
      Kakoune matters to package nerds because it is one of the canonical alternative
      modal editors: small enough to install as a normal CLI package, opinionated enough
      to influence later editor conversations, and different enough from Vim to justify
      its own ecosystem.
  project-history:
    - >
      Kakoune's README describes it as an experiment for a better code editor and as a
      modal editor that keeps Vim-like keystroke efficiency while changing the editing
      grammar: users select text first and then apply actions. The repository issue
      history shows discussion of versioning in 2014, while GitHub releases began with a
      2018 prerelease.
  related-projects:
    - >
      Related editors and influences include Vi, Vim, Neovim, Helix, Sam, Acme, terminal
      multiplexers, and Kakoune plugin/community packages.
  sources:
    - https://api.github.com/repos/mawww/kakoune/releases?per_page=100
    - https://github.com/mawww/kakoune
    - https://github.com/mawww/kakoune/issues/89
    - https://github.com/mawww/kakoune/releases
    - https://kakoune.org/
  summary:
    - >
      Kakoune is a modal code editor inspired by Vi and Vim, built around a
      selection-first editing model and multiple selections as a central interaction
      primitive.
  timeline:
    - >
      2014-03-17: GitHub issue discussion recorded the absence of official releases at
      that point.
    - '2018-04-09: Kakoune 20180409 prerelease published.'
    - '2019-12-10: Kakoune v2019.12.10 published.'
    - '2026-05-21: Kakoune 2026.05.21 published.'
  usage:
    - >
      Users edit through selections, multiple selections, object selections, commands,
      hooks, and shell filters. Kakoune's client-server architecture lets multiple
      clients attach to one editing session, fitting terminal multiplexers and modern
      terminal panes.
related-packages:
  - id: brew:helix
    reason: >
      Choose Helix for a Kakoune-inspired selection-first editor with built-in
      language-server and Tree-sitter support; choose Kakoune for its smaller,
      shell-oriented client-server design.
    rel: alternative
    sources:
      - https://docs.helix-editor.com/usage.html
      - https://docs.helix-editor.com/languages.html
      - https://github.com/mawww/kakoune#readme
category: developer-tools
package-manager:
  apk: kakoune
  brew: kakoune
  debian: kakoune
  dnf: kakoune
  macports: kakoune
  nix: kakoune
  pacman: kakoune
  ubuntu: kakoune
  zypper: kakoune
package-manager-url: https://formulae.brew.sh/formula/kakoune
license: Unlicense
tags:
  - cli
