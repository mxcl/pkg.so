id: brew:grsync
display-name: Grsync
homepage: https://www.opbyte.it/grsync/
repo: https://sourceforge.net/p/grsync/code/HEAD/tree
docs:
  - https://sourceforge.net/projects/grsync
  - https://www.opbyte.it/grsync
config-file-location:
  unix: ~/.config/grsync/grsync.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Grsync's adoption came from the long-running need for a discoverable desktop
      interface to rsync on Unix-like systems. The project page explicitly tells users
      to check standard package tools first because ready-made packages for Linux
      distributions were made by third parties, and Homebrew, Debian, Fedora-family,
      MacPorts, Nix, Arch, Ubuntu, and openSUSE package facts reflect that
      cross-distribution packaging pattern.
    - >
      The project also accumulated translations and packaging-related fixes over many
      releases, including desktop-file and lintian fixes, which made it suitable for
      graphical software centers and distribution repositories. For package maintainers,
      that history matters because Grsync is a small GUI application whose usefulness
      depends on correctly delegating to the system rsync binary.
  package-nerd-significance:
    - >
      Grsync is a classic package-nerd tool because it wraps a powerful Unix primitive
      rather than replacing it. It illustrates the packaging boundary between a GUI
      convenience layer, a command-line backend supplied by another package, desktop
      integration files, translations, and platform-specific GTK build concerns.
  project-history:
    - >
      The Grsync changelog begins with a 0.1 alpha release and quickly adds the features
      that define the project in package-manager catalogs: saved sessions, translated
      GTK interface strings, progress parsing, rsync option controls, and a batch helper
      named grsync-batch. By the 0.6 series the project had import/export support for
      sessions, optional Windows compatibility behavior, and the batch script installed
      as part of the program.
    - >
      The 1.x line continued as a pragmatic desktop wrapper around rsync rather than a
      replacement for rsync. Later releases added session sets, Unity desktop
      integration, logging improvements, translations, and eventually GTK 3
      compatibility in version 1.3.0. Version 1.3.1 moved the default configuration
      directory from the user home directory to .config and included more desktop-file,
      translation, and GTK modernization work.
  related-projects:
    - rsync is the underlying synchronization engine that Grsync drives.
    - GTK is the desktop UI toolkit used by Grsync.
    - >
      Other desktop backup and synchronization front ends, such as Back In Time and
      luckyBackup, occupy adjacent package-manager territory.
  sources:
    - https://sourceforge.net/p/grsync/code/HEAD/tree
    - https://sourceforge.net/p/grsync/news/feed
    - https://sourceforge.net/projects/grsync/
    - https://www.opbyte.it/grsync/
    - https://www.opbyte.it/grsync/changes.html
  summary:
    - >
      Grsync is a GTK graphical front end for rsync, built to make file synchronization
      and backup workflows available without composing rsync command lines by hand. Its
      own project page frames it as a tool for synchronizing folders, files, removable
      devices, network drives, partitions, and mirrors while still depending on the
      rsync command-line program underneath.
  timeline:
    - '0.1: First alpha release recorded in the project changelog.'
    - '0.1.1: Saved session support added.'
    - '0.6: grsync-batch installed by default for executing saved sessions.'
    - '2011: Version 1.2.0 published with session-set work disabled after testing problems.'
    - '2012: Version 1.2.1 enabled experimental session sets and added Unity support.'
    - '2020: Version 1.3.0 added GTK 3 compatibility.'
    - >
      2023: Version 1.3.1 shipped fixes, translation updates, GTK modernization, and
      default config-directory movement to .config.
  usage:
    - >
      Users run grsync to build and save rsync sessions for local or remote
      synchronization, preview runs, view rsync output, and reuse saved options. The
      companion grsync-batch command lets saved sessions participate in shell, cron, or
      scripted workflows without asking users to reconstruct the full rsync invocation.
related-packages:
  - id: brew:rsync
    reason: >
      Grsync is a graphical front end that executes rsync, so install or use rsync
      directly when scripting, advanced option coverage, or headless operation matters
      more than saved GUI sessions.
    rel: adjacent_workflow
    sources:
      - https://www.opbyte.it/grsync/
      - https://rsync.samba.org/
      - https://rsync.samba.org/ftp/rsync/rsync.html
category: productivity
