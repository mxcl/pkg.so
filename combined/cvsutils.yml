id: brew:cvsutils
display-name: CVS Utilities
homepage: https://www.red-bean.com/cvsutils/
repo: null
docs:
  - https://www.red-bean.com/cvsutils
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CVS Utilities reflects the era when CVS was described by its own project page as
      the de facto version-control system for open source software, even while the page
      advised new projects to consider Subversion. Its adoption was tied to developers
      maintaining CVS trees over both slow and fast network connections, where local
      inspection and cleanup commands saved time.
  package-nerd-significance:
    - >
      The package is interesting because it preserves the tooling culture around CVS
      rather than CVS itself. Its small command-line helpers document the practical
      friction of centralized version control before distributed systems became
      dominant.
  project-history:
    - >
      The official page credits Tom Tromey with the original code and Pavel Roskin with
      later changes. Its current public release line culminates in version 0.2.6,
      released on 2013-05-31.
    - >
      The project grew around CVS's client-server model. CVS keeps full version history
      on the server while the client working directory contains the checked-out files
      and derived build products, so CVS Utilities focused on the local working-copy
      side: finding tracked and untracked files, purging generated files, changing CVS
      administrative metadata, and producing cleaner patches.
  related-projects:
    - CVS Utilities is directly tied to CVS and its working-copy administrative files.
    - >
      The official page mentions Subversion as the recommended alternative for new
      projects at the time the page was written.
  sources:
    - https://www.red-bean.com/cvsutils/
  summary:
    - >
      CVS Utilities is a small collection of mostly Perl scripts for managing CVS
      working directories, especially when a developer wants useful local status,
      cleanup, and patch workflows without contacting the CVS server.
  timeline:
    - '1990s-2000s: CVS working-copy workflows become common in open-source development.'
    - '2013: CVS Utilities 0.2.6 is released on 2013-05-31.'
    - >
      2013: The official project page documents the scripts, closed mailing list, and
      maintainer credits.
  usage:
    - >
      The tools are used inside CVS working directories to inspect local file state,
      erase or move derived files, switch CVS root metadata, discard local changes, run
      CVS commands over discovered files, and create patches with less irrelevant
      backup-file, RCS-path, or ChangeLog noise than a raw cvs diff workflow.
related-packages:
  - id: brew:cvs
    reason: >
      CVS Utilities complements the CVS client by operating on the CVS working
      directories and administrative files that the client creates.
    rel: adjacent_workflow
    sources:
      - https://www.red-bean.com/cvsutils/
      - https://www.nongnu.org/cvs/
  - id: brew:subversion
    reason: >
      Choose Subversion for new centralized version-control projects; the CVS Utilities
      project itself recommends it as the newer alternative to CVS-based workflows.
    rel: alternative
    sources:
      - https://www.red-bean.com/cvsutils/
      - https://subversion.apache.org/features.html
