id: brew:colordiff
display-name: colordiff
homepage: https://www.colordiff.org/
repo: https://github.com/daveewart/colordiff
docs:
  - https://github.com/daveewart/colordiff#readme
  - https://www.colordiff.org/
config-file-location:
  unix:
    - /etc/colordiffrc
    - ~/.colordiffrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream site tells Debian and Ubuntu users to install it from their
      distributions and notes that colordiff is packaged for other Linux, Unix, and BSD
      systems. The supplied package-manager metadata backs that up with entries across
      Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix, and openSUSE.
  package-nerd-significance:
    - >
      colordiff is the archetypal tiny terminal-enhancement package: stable, scriptable,
      dependency-light, and useful before Git's color defaults became universal. Its
      value to package managers is broad portability and a predictable configuration
      surface rather than novelty.
  project-history:
    - >
      The program dates to 2002 and has remained intentionally small: it wraps or
      filters diff-family output, recognizes several diff formats, and applies
      configurable color schemes. Its changelog shows a long maintenance history of
      portability fixes, support for more diff styles, and terminal behavior
      improvements rather than a shift in scope.
  related-projects:
    - >
      colordiff sits beside `diff`, `wdiff`, `debdiff`, CVS/Subversion diff output, and
      Git diff workflows, serving as a colorizing layer rather than a replacement diff
      algorithm.
  sources:
    - https://www.colordiff.org/
    - https://github.com/daveewart/colordiff
    - https://raw.githubusercontent.com/daveewart/colordiff/master/README
    - https://raw.githubusercontent.com/daveewart/colordiff/master/CHANGES
  summary:
    - >
      colordiff is Dave Ewart's Perl wrapper for `diff`, adding ANSI color to
      traditional diff output while preserving the familiar diff command-line workflow.
  timeline:
    - '2002: colordiff copyright history begins.'
    - >
      2000s: Support expanded for context, Subversion, side-by-side, wdiff, p4, and
      debdiff output.
    - '2013: Upstream signing key changed for release tarballs.'
    - '2026: Version 1.0.22 released.'
  usage:
    - >
      Package users commonly run `colordiff file1 file2`, pipe existing `diff -u` output
      through `colordiff`, or alias `diff=colordiff`. The companion `cdiff` helper
      exists for compressed or URL-based diffs.
related-packages:
  - id: brew:git-delta
    reason: >
      Choose git-delta when you want a richer Git and unified-diff pager with syntax
      highlighting, word-level highlighting, navigation, and optional side-by-side views
      rather than colordiff's lighter ANSI wrapper.
    rel: alternative
    sources:
      - https://github.com/dandavison/delta
      - https://www.colordiff.org/colordiff.html
  - id: brew:diff-so-fancy
    reason: >
      Choose diff-so-fancy for a Git-centered presentation layer that emphasizes
      human-readable patch formatting, while colordiff is better suited to preserving
      conventional diff output with added color.
    rel: alternative
    sources:
      - https://github.com/so-fancy/diff-so-fancy
      - https://www.colordiff.org/colordiff.html
  - id: brew:wdiff
    reason: >
      Use GNU wdiff with colordiff when you need word-level comparisons, because
      colordiff officially recognizes and colorizes output produced by wdiff -n.
    rel: adjacent_workflow
    sources:
      - https://www.colordiff.org/colordiff.html
      - https://www.gnu.org/software/wdiff/manual/wdiff.html
category: developer-tools
package-manager:
  apk: colordiff
  brew: colordiff
  debian: colordiff
  dnf: colordiff
  macports: colordiff
  nix: colordiff
  pacman: colordiff
  ubuntu: colordiff
  zypper: colordiff
package-manager-url: https://formulae.brew.sh/formula/colordiff
license: GPL-2.0-or-later
tags:
  - cli
  - color-output
  - diff
  - perl
  - terminal
description: Color-highlighted diff(1) output
executables:
  - cdiff
  - colordiff
provenance:
  formula: colordiff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
