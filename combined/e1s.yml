id: brew:e1s
display-name: E1S
homepage: https://github.com/keidarcy/e1s
repo: https://github.com/keidarcy/e1s
docs:
  - https://github.com/keidarcy/e1s
config-file-location:
  unix:
    - ~/.config/e1s/config.yml
    - ~/.aws/config
credentials-file-location:
  unix: ~/.aws/credentials
history:
  adoption-history:
    - >
      E1S has broader adoption than a one-off ECS helper: the README lists GitHub
      release binaries, Homebrew, Docker images, AWS CloudShell install, `go install`,
      asdf, and mise. GitHub API metadata showed 903 stars and 40 forks on 2026-06-30.
  package-nerd-significance:
    - >
      E1S matters in package-manager catalogs because it fills a narrow operational gap:
      ECS has rich APIs and console screens, but fewer mature terminal dashboards than
      Kubernetes. Its k9s-inspired model makes it recognizable to cloud operators who
      prefer keyboard-driven TUIs.
  project-history:
    - >
      The public repository was created on 2023-06-18. The README describes an
      ECS-focused TUI that uses existing AWS CLI configuration and credentials rather
      than storing secrets itself, and offers terminal workflows for profiles, regions,
      services, tasks, exec, filtering, sorting, and AWS Console jumps.
  related-projects:
    - >
      The README names k9s as an inspiration and documents use with AWS CLI
      configuration, AWS SDK for Go, AWS ECS, Fargate, EC2 launch types, AWS CloudShell,
      and AWS Systems Manager Session Manager for interactive exec and port forwarding.
  sources:
    - https://github.com/keidarcy/e1s
    - https://raw.githubusercontent.com/keidarcy/e1s/master/README.md
    - https://api.github.com/repos/keidarcy/e1s
  summary:
    - >
      E1S is a Go terminal application for browsing and managing AWS ECS resources,
      including Fargate and EC2 launch types. The README explicitly frames it as
      inspired by k9s, carrying the Kubernetes terminal-dashboard idiom into AWS ECS
      operations.
  timeline:
    - '2023-06-18: Public GitHub repository created.'
    - >
      2026: README documents multi-channel distribution through releases, Homebrew,
      Docker, CloudShell, go install, asdf, and mise.
    - '2026-06-22: GitHub API showed a recent repository push.'
  usage:
    - >
      Common use is `e1s` after AWS CLI credentials are configured, optionally selecting
      profile, region, cluster, service, read-only mode, refresh rate, and theme from
      flags or `~/.config/e1s/config.yml`. It reads AWS shared config and credentials
      files and can use AWS SDK for Go to connect to ECS APIs.
related-packages:
  - id: brew:awscli
    reason: >
      AWS CLI is E1S's documented setup companion: it establishes the shared profiles,
      regions, and credentials that E1S reads before connecting to ECS.
    rel: adjacent_workflow
    sources:
      - https://github.com/keidarcy/e1s#readme
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
category: cloud-infrastructure
package-manager:
  brew: e1s
  nix: e1s
package-manager-url: https://formulae.brew.sh/formula/e1s
license: MIT
tags:
  - aws
  - cli
  - cloud
  - ecs
  - fargate
  - terminal
  - tui
description: TUI for managing AWS ECS, inspired by k9s
executables:
  - e1s
provenance:
  formula: e1s
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
