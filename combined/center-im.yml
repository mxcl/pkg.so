id: brew:center-im
display-name: CenterIM 5
homepage: https://github.com/petrpavlu/centerim5
repo: https://github.com/petrpavlu/centerim5
docs:
  - https://github.com/petrpavlu/centerim5#readme
  - https://github.com/petrpavlu/centerim5/blob/master/centerim5.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CenterIM 5 is a niche package-manager item: Homebrew packages the centerim5
      executable for users who still want a terminal multi-protocol IM client, while the
      GitHub repository shows a small public footprint.
  package-nerd-significance:
    - >
      CenterIM 5 is useful to package nerds as a preservation-style Unix terminal
      client: it keeps a libpurple-backed multi-protocol messaging workflow available
      outside graphical Pidgin-style front ends.
  project-history:
    - >
      The official repository describes CenterIM 5 as a terminal IM client for Linux,
      BSD, Solaris, and other Unices. Its repository preserves a traditional Unix
      command-line client shape, with a README, manpage, NEWS file, and source tree
      rather than a hosted documentation site.
  related-projects:
    - libpurple is the communication backend named by the official README.
    - Pidgin and Finch are related libpurple front ends named in the official manpage.
  sources:
    - https://formulae.brew.sh/formula/center-im
    - https://github.com/petrpavlu/centerim5
    - https://github.com/petrpavlu/centerim5#readme
    - https://github.com/petrpavlu/centerim5/blob/master/centerim5.1
  summary:
    - >
      CenterIM 5 is a text-mode instant messaging client for Unix-like systems that uses
      libpurple as its communication backend.
  timeline:
    - '2016: centerim5 manpage dated July 11, 2016.'
    - >
      2018: Public petrpavlu/centerim5 GitHub repository and release history visible on
      GitHub.
  usage:
    - >
      The documented command is centerim5. The official manpage documents options
      including ASCII UI drawing, alternate base directory selection, and starting
      accounts offline.
related-packages:
  - id: brew:pidgin
    reason: >
      Pidgin is the stronger alternative when you want maintained libpurple front
      ends—GTK-based Pidgin or terminal-based Finch—rather than CenterIM 5's distinct
      text interface.
    rel: alternative
    sources:
      - https://github.com/petrpavlu/centerim5#readme
      - https://docs.pidgin.im/
category: networking
package-manager:
  brew: center-im
package-manager-url: https://formulae.brew.sh/formula/center-im
license: GPL-2.0-or-later
tags:
  - chat
  - cli
  - instant-messaging
  - libpurple
  - terminal
  - unix
description: Text-mode multi-protocol instant messaging client
executables:
  - centerim5
provenance:
  formula: center-im
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
