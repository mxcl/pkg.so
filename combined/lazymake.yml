id: brew:lazymake
display-name: lazymake
homepage: https://lazymake.vercel.app/
repo: https://github.com/rshelekhov/lazymake
docs:
  - https://github.com/rshelekhov/lazymake#readme
  - https://lazymake.vercel.app/
config-file-location:
  unix:
    - ~/.lazymake.yaml
    - ./.lazymake.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project published v0.1.0 on 2026-01-03 and v0.4.1 on 2026-03-27. GitHub
      metadata reported 195 stars by 2026-05-11.
  package-nerd-significance:
    - >
      lazymake is notable as a thin TUI layer over the long-lived make workflow: it
      keeps the standard build tool in charge while adding discoverability for projects
      with many targets.
  project-history:
    - >
      The GitHub repository was created on 2025-09-16. Its README positions the tool as
      a way to make large Makefiles searchable and inspectable without changing the
      Makefile itself.
  related-projects:
    - The README credits Bubble Tea, Lipgloss, Chroma, Cobra, LazyGit, and LazyDocker.
  sources:
    - https://api.github.com/repos/rshelekhov/lazymake
    - https://github.com/rshelekhov/lazymake
    - https://github.com/rshelekhov/lazymake/releases
  summary:
    - lazymake is a terminal UI for browsing, inspecting, and running Makefile targets.
  timeline:
    - '2025-09-16: GitHub repository created.'
    - '2026-01-03: Release v0.1.0 published.'
    - '2026-03-27: Release v0.4.1 published.'
  usage:
    - >
      Users run `lazymake` in a directory with a Makefile, or pass a Makefile path, then
      browse targets, preview commands with make -n, inspect variables, and view
      dependency graphs.
related-packages:
  - id: brew:make
    reason: >
      Install GNU Make as the build engine that lazymake can invoke after it parses and
      presents targets from an existing Makefile.
    rel: adjacent_workflow
    sources:
      - https://github.com/rshelekhov/lazymake#readme
      - https://www.gnu.org/software/make/manual/
category: developer-tools
package-manager:
  brew: lazymake
package-manager-url: https://formulae.brew.sh/formula/lazymake
license: MIT
tags:
  - build-tools
  - cli
  - dependency-graph
  - makefile
  - tui
description: Modern TUI for Makefiles
executables:
  - lazymake
provenance:
  formula: lazymake
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
