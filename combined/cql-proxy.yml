id: brew:cql-proxy
display-name: cql-proxy
homepage: https://github.com/datastax/cql-proxy
repo: https://github.com/datastax/cql-proxy
docs:
  - https://github.com/datastax/cql-proxy#readme
config-file-location:
  unix: /path/to/proxy.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      cql-proxy is niche infrastructure glue rather than a general Cassandra client. Its
      packaging matters most for teams with legacy DataStax, community Cassandra, gocql,
      or Rust CQL drivers that cannot speak directly to Astra's secure connection model.
  package-nerd-significance:
    - >
      As a Homebrew formula, cql-proxy turns a cloud-database compatibility sidecar into
      a normal CLI install, useful for local testing and migration work without
      requiring developers to build the proxy from source.
  project-history:
    - >
      The project was published by DataStax as a small Go command-line service. Its
      README describes the tool as a local listener that securely forwards application
      CQL traffic to an appropriate database service, with Astra support as the main use
      case.
  related-projects:
    - >
      cql-proxy sits between Apache Cassandra or DataStax Enterprise applications and
      DataStax Astra DB, complementing native DataStax drivers when older or community
      drivers are in use.
  sources:
    - https://github.com/datastax/cql-proxy#readme
    - https://github.com/datastax/cql-proxy/releases/tag/v0.1.0
    - https://formulae.brew.sh/formula/cql-proxy
  summary:
    - >
      cql-proxy is DataStax's CQL traffic proxy for Cassandra-compatible clients that
      need to reach DataStax Astra DB through a local proxy endpoint.
  timeline:
    - '2022: v0.1.0 GA release was published on GitHub.'
    - '2022: v0.2.0 examples in the README documented Docker-based local use.'
  usage:
    - >
      Operators run the proxy locally, in Docker, or as a Kubernetes sidecar, then point
      an existing Cassandra application at the proxy address. Configuration can be
      supplied as flags, environment variables, or a YAML file.
related-packages:
  - id: brew:cassandra
    reason: >
      Apache Cassandra is an adjacent workflow because cql-proxy can front an existing
      Cassandra application and redirect its CQL traffic to Astra without application
      code changes.
    rel: adjacent_workflow
    sources:
      - https://github.com/datastax/cql-proxy#readme
      - https://cassandra.apache.org/doc/latest/
category: data
package-manager:
  brew: cql-proxy
package-manager-url: https://formulae.brew.sh/formula/cql-proxy
license: Apache-2.0
tags:
  - cassandra
  - cli
  - cql
  - database
  - datastax-astra
  - proxy
description: DataStax cql-proxy enables Cassandra apps to use Astra DB without code changes
executables:
  - cql-proxy
provenance:
  formula: cql-proxy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
