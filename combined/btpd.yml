id: brew:btpd
display-name: BTPD
homepage: https://github.com/btpd/btpd
repo: https://github.com/btpd/btpd
docs:
  - https://github.com/btpd/btpd#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      btpd was adopted by Unix-like package repositories for users who wanted a headless
      BitTorrent client. The input package metadata lists Homebrew, MacPorts, Alpine,
      and Ubuntu packaging, indicating cross-distribution survival despite the project's
      small scope.
    - >
      Its adoption niche overlaps with servers, shells, seedboxes, and users who prefer
      daemonized network tools controllable by scripts.
  package-nerd-significance:
    - >
      btpd is interesting because it packages BitTorrent as a classic Unix service split
      into daemon and client tools. It is also a reminder that package managers preserve
      many small protocol implementations long after attention has moved to larger
      clients.
  project-history:
    - >
      The project describes btpd as a utility for sharing files over the BitTorrent
      network protocol that runs as a daemon without a controlling terminal or GUI. Its
      companion programs include btpd, btcli, and btinfo.
    - >
      The public GitHub repository was created in 2010 and carries release tags v0.13
      through v0.16. Development activity is modest and specialized, matching the
      project's role as a compact daemon rather than a broad BitTorrent suite.
  related-projects:
    - BitTorrent is the peer-to-peer protocol implemented by btpd.
    - btcli is the command-line control utility shipped with btpd.
    - btinfo is the torrent metadata inspection utility shipped with btpd.
  sources:
    - https://api.github.com/repos/btpd/btpd
    - https://api.github.com/repos/btpd/btpd/tags?per_page=10
    - https://github.com/btpd/btpd#readme
    - source_facts.package-manager
  summary:
    - >
      BTPD is a small BitTorrent daemon with command-line control utilities. It
      represents an older Unix style of P2P client: a background daemon, a control
      socket, and small tools rather than an integrated desktop application.
  timeline:
    - '2010: Public GitHub repository for btpd is created.'
    - '2010s: Release tags v0.13 through v0.16 are published.'
    - '2020s: btpd remains packaged in multiple Unix-like package managers.'
  usage:
    - >
      Users start btpd once, add torrents with btcli, inspect them with btcli list or
      stat, set upload/download rates, and shut the daemon down with btcli kill. State
      and logs are stored under $HOME/.btpd by default, with -d or BTPD_HOME available
      to choose another directory.
    - >
      btinfo reads metadata from torrent files. The project has no credential store and
      no general configuration file documented beyond its runtime state directory and
      command-line options.
related-packages:
  - id: brew:transmission-cli
    reason: >
      Choose Transmission CLI for a more actively integrated headless BitTorrent stack
      with RPC and a web interface, while retaining command-line and daemon workflows.
    rel: alternative
    sources:
      - https://github.com/btpd/btpd#what-is-btpd
      - https://transmissionbt.com/
      - https://github.com/transmission/transmission/blob/main/docs/Headless-Usage.md
  - id: brew:rtorrent
    reason: >
      Choose rTorrent when an interactive ncurses client and extensive session
      configuration are preferred over BTPD's separate daemon-and-controller model.
    rel: alternative
    sources:
      - https://github.com/btpd/btpd#the-programs
      - https://github.com/rakshasa/rtorrent
  - id: brew:aria2
    reason: >
      Choose aria2 when BitTorrent must be combined with HTTP, HTTPS, FTP, SFTP,
      Metalink, and JSON-RPC downloads in one lightweight command-line utility.
    rel: alternative
    sources:
      - https://github.com/btpd/btpd#what-is-btpd
      - https://aria2.github.io/
category: networking
package-manager:
  apk: btpd
  brew: btpd
  macports: btpd
  ubuntu: btpd
package-manager-url: https://formulae.brew.sh/formula/btpd
license: BSD-2-Clause
tags:
  - bittorrent
  - cli
  - daemon
  - p2p
description: BitTorrent Protocol Daemon
executables:
  - btinfo
  - btpd
provenance:
  formula: btpd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
