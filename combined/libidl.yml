id: brew:libidl
display-name: libIDL
homepage: https://download.gnome.org/sources/libIDL/0.8/
repo: https://gitlab.gnome.org/Archive/libidl
docs:
  - https://download.gnome.org/sources/libIDL/0.8
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libIDL's adoption followed ORBit and the GNOME CORBA stack rather than a broad
      independent application ecosystem. It remains package-visible because older GNOME,
      CORBA, and IDL-processing software can still require its parser and libIDL-config
      metadata.
  package-nerd-significance:
    - >
      libIDL is a small fossil from the GNOME/CORBA period. For package maintainers, it
      is useful context for why old desktop stacks carried ORBit, GLib,
      yacc/flex-generated parsers, and -config scripts before pkg-config fully won the
      ecosystem.
  project-history:
    - >
      The README in the GNOME 0.8.14 source archive says libIDL was initially written
      for ORBit, the GNOME project's object request broker, while trying to keep the
      parsing functionality reusable and portable.
    - >
      The NEWS file records active development before the 0.8 branch: 0.6.0 in 1999
      overhauled versioning, added libIDL-config and Automake support, added XPIDL
      parsing support, and added Win32 support paths. Version 0.8.0 was marked as a
      stable ABI/API frozen release.
    - >
      The later 0.8.x releases were mostly portability and build maintenance: flex
      compatibility, BSD and Cygwin fixes, Win32 build support, bison 2.4 fixes,
      sparse/gcc warning cleanups, and the 0.8.14 build-system fixes published by GNOME
      in March 2010.
  related-projects:
    - ORBit and ORBit2 are the closest related GNOME CORBA projects.
    - GLib is a runtime dependency and part of the GNOME stack in which libIDL lived.
    - XPIDL and CORBA IDL are related interface-definition dialects or use cases.
  sources:
    - https://download.gnome.org/sources/libIDL/0.8/
    - https://download.gnome.org/sources/libIDL/0.8/libIDL-0.8.14.changes
    - https://download.gnome.org/sources/libIDL/0.8/libIDL-0.8.14.news
    - https://download.gnome.org/sources/libIDL/0.8/libIDL-0.8.14.tar.bz2
    - https://gitlab.gnome.org/Archive/libidl
  summary:
    - >
      libIDL is a legacy GNOME-era C library for parsing CORBA Interface Definition
      Language files and returning trees that other tools can consume.
  timeline:
    - >
      1998: NEWS described the parser as substantially working with the switch to GLib
      underway.
    - >
      1999: 0.6.x releases added versioning, libIDL-config, XPIDL support, and
      portability work.
    - '2002: 0.8.0 was released as the stable ABI/API frozen release.'
    - '2010: 0.8.14 was published with configure/build-system fixes.'
  usage:
    - >
      Its core use is to parse IDL files, run them through a C preprocessor when
      available, report IDL diagnostics, and return syntax and namespace trees for
      generators or analysis tools.
related-packages:
  - id: brew:omniorb
    reason: >
      omniORB is the stronger choice when the goal is compiling CORBA IDL and running a
      complete maintained C++ or Python ORB stack, whereas libIDL is a legacy reusable
      parser library.
    rel: alternative
    sources:
      - https://omniorb.sourceforge.io/docs.html
      - https://omniorb.sourceforge.io/omni43/omniidl.pdf
      - https://gitlab.gnome.org/Archive/libidl/-/blob/master/README
