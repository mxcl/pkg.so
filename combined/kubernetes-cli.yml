id: brew:kubernetes-cli
display-name: kubectl
homepage: https://kubernetes.io/docs/reference/kubectl/
repo: https://github.com/kubernetes/kubernetes
docs:
  - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig
  - https://kubernetes.io/docs/reference/kubectl
config-file-location:
  unix: ~/.kube/config
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      As Kubernetes became the common substrate for cloud-native infrastructure, kubectl
      became one of the most widely installed operations binaries in developer and
      platform-engineering toolchains. Its packaging across Homebrew, Linux
      distributions, Chocolatey, Scoop, winget, Nix, MacPorts, and other systems
      reflects that it is both a developer tool and an infrastructure administration
      tool.
  package-nerd-significance:
    - >
      The kubernetes-cli package is significant because it decouples the local client
      from a full Kubernetes installation. Package managers let users pin or upgrade the
      client, match cluster version-skew policy, and keep scripts using a predictable
      kubectl binary without installing control-plane components.
  project-history:
    - >
      Kubernetes began as an open source Google project in 2014 and reached version 1.0
      on July 21, 2015, alongside Google's announcement that the project would be
      donated to the newly formed Cloud Native Computing Foundation. kubectl evolved
      with the project as the human-facing client for the Kubernetes API.
  related-projects:
    - >
      kubectl is related to the Kubernetes API server, kubeconfig, client-go, kubeadm,
      kustomize, Helm, kubectl plugins, and the broader SIG CLI tooling ecosystem.
  sources:
    - https://kubernetes.io/blog/2024/06/06/10-years-of-kubernetes/
    - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
    - https://kubernetes.io/docs/reference/kubectl/
    - https://kubernetes.io/releases/
  summary:
    - >
      kubectl is the Kubernetes command-line client and the binary packaged by Homebrew
      as kubernetes-cli. It is the standard local interface for sending requests to the
      Kubernetes control plane, reading and writing objects, inspecting resources, and
      driving day-to-day cluster operations.
  timeline:
    - '2014: Kubernetes was released as an open source project.'
    - '2015-07-21: Kubernetes 1.0 was released and the project was donated to the CNCF.'
    - >
      2023-08-15: Kubernetes documented pkgs.k8s.io as community-owned package
      repositories for Kubernetes packages.
    - '2025-04-23: Kubernetes v1.33 was released.'
    - '2025-08-27: Kubernetes v1.34 was released.'
  usage:
    - >
      kubectl reads kubeconfig data to select a cluster, user, namespace, and context,
      then communicates with the API server. Kubernetes documentation says kubectl looks
      for config in $HOME/.kube/config by default, while KUBECONFIG and --kubeconfig
      allow explicit or merged configuration files.
related-packages:
  - id: brew:k9s
    reason: >
      K9s is an interactive terminal UI over Kubernetes resources and is preferable for
      continuous navigation and observation, while kubectl remains the broader
      scriptable command client.
    rel: alternative
    sources:
      - https://k9scli.io/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:helm
    reason: >
      Helm packages and manages Kubernetes applications as chart releases, complementing
      kubectl's lower-level resource inspection and mutation commands.
    rel: adjacent_workflow
    sources:
      - https://helm.sh/docs/intro/introduction/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:kustomize
    reason: >
      Kustomize builds declarative manifest variants and is also integrated into kubectl
      through apply -k, making the standalone package useful when an independent
      Kustomize workflow is preferred.
    rel: adjacent_workflow
    sources:
      - https://kustomize.io/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:krew
    reason: >
      Krew installs and updates external kubectl plugins, extending kubectl with
      independently packaged subcommands.
    rel: adjacent_workflow
    sources:
      - https://krew.sigs.k8s.io/docs/user-guide/setup/install/
      - https://kubernetes.io/docs/tasks/extend-kubectl/kubectl-plugins/
  - id: brew:minikube
    reason: >
      minikube creates a local development Kubernetes cluster and configures kubectl to
      access it, providing a direct create-then-operate workflow.
    rel: adjacent_workflow
    sources:
      - https://minikube.sigs.k8s.io/docs/start/
      - https://minikube.sigs.k8s.io/docs/handbook/kubectl/
  - id: brew:kind
    reason: >
      kind creates container-based local Kubernetes clusters and generates kubeconfig
      data that kubectl uses to inspect and operate those clusters.
    rel: adjacent_workflow
    sources:
      - https://kind.sigs.k8s.io/docs/user/quick-start
      - https://kubernetes.io/docs/reference/kubectl/
category: cloud-infrastructure
package-manager:
  apk: kubectl
  brew: kubernetes-cli
  chocolatey: kubernetes-cli
  debian: kubectl
  macports: kubectl
  nix: kubectl
  pacman: kubectl
  scoop: main/kubectl
  winget: Kubernetes.kubectl
package-manager-url: https://formulae.brew.sh/formula/kubernetes-cli
license: Apache-2.0
tags:
  - cli
  - cloud-infrastructure
  - cluster-management
  - kubectl
  - kubernetes
description: Kubernetes command-line interface
executables:
  - kubectl
provenance:
  formula: kubernetes-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
