id: brew:mpdas
display-name: mpdas
homepage: https://www.50hz.ws/mpdas/
repo: https://github.com/hrkfdn/mpdas
docs:
  - https://www.50hz.ws/mpdas
config-file-location:
  unix:
    - ~/.mpdasrc
    - $PREFIX/mpdasrc
credentials-file-location:
  unix:
    - ~/.mpdasrc
    - $PREFIX/mpdasrc
history:
  project-history:
    - >
      The FreeBSD port history places mpdas in packaging channels by November 2008 and
      describes its original niche clearly: an MPD scrobbler written in C++ that cached
      played songs during downtime or connectivity problems. That made it an alternative
      to mpdscribble for users whose MPD setup needed Last.fm submission, especially
      around protocol compatibility and offline caching.
  sources:
    - https://en.wikipedia.org/wiki/Last.fm
    - https://github.com/hrkfdn/mpdas
    - https://www.freshports.org/audio/mpdas/
  summary:
    - >
      mpdas is a C++ AudioScrobbler client for Music Player Daemon, maintained in Henrik
      Friedrichsen's hrkfdn/mpdas repository. It uses libmpdclient to read song data
      from MPD and libcurl to submit that data to Last.fm, and the README identifies
      support for the 2.0 AudioScrobbler protocol. Its feature set is practical rather
      than broad: now-playing updates, scrobbling, caching, config files, user
      switching, and Last.fm love/unlove integration via MPD client-to-client messages.
  usage:
    - >
      In practice, mpdas is configured with a .mpdasrc-style config containing Last.fm
      and MPD connection details, then run beside MPD so listening history can be
      submitted without involving a desktop music player.
related-packages:
  - id: brew:mpdscribble
    reason: >
      Choose mpdscribble as the MPD project's own low-resource scrobbler when its
      idle-mode and playback-edge-case handling are preferable to mpdas's AudioScrobbler
      2.0 cache and Libre.fm options.
    rel: alternative
    sources:
      - https://github.com/hrkfdn/mpdas
      - https://www.musicpd.org/clients/mpdscribble/
  - id: brew:mpd
    reason: >
      mpdas connects to MPD through libmpdclient and submits the metadata for songs that
      MPD plays.
    rel: adjacent_workflow
    sources:
      - https://github.com/hrkfdn/mpdas
      - https://mpd.readthedocs.io/en/stable/user.html
  - id: brew:mpc
    reason: >
      mpc can send the documented client-to-client love and unlove messages from the
      command line to a running mpdas process.
    rel: adjacent_workflow
    sources:
      - https://github.com/hrkfdn/mpdas
      - https://www.musicpd.org/clients/mpc/
category: media
package-manager:
  brew: mpdas
  debian: mpdas
  dnf: mpdas
  nix: mpdas
  ubuntu: mpdas
package-manager-url: https://formulae.brew.sh/formula/mpdas
license: BSD-3-Clause
tags:
  - audio
  - audioscrobbler
  - cli
  - lastfm
  - mpd
description: C++ client to submit tracks to audioscrobbler
executables:
