id: brew:mercury
display-name: Mercury
homepage: https://mercurylang.org/
repo: https://github.com/Mercury-Language/mercury
docs:
  - https://mercurylang.org/documentation/documentation.html
  - https://mercurylang.org/information/doc-latest/mercury_user_guide/index.html
  - https://www.mercurylang.org/information/doc-latest/reference_manual.pdf
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The compiler became a substantial part of the project identity: it is written in
      Mercury, was bootstrapped from Prolog systems, and compiles Mercury code through C
      as a portable assembler while using GNU C extensions when available for better
      code generation. The user guide exposes a full development toolchain around `mmc`,
      `mmake`, debugging, profiling, generated interface files, and multiple
      target-language grades.
  sources:
    - https://formulae.brew.sh/formula/mercury
    - https://mercurylang.org/about.html
    - https://mercurylang.org/documentation/papers.html
    - https://mercurylang.org/information/doc-latest/mercury_user_guide/index.html
  summary:
    - >
      Mercury is a pure logic programming language that grew out of the University of
      Melbourne logic-programming research community. The Mercury project describes the
      language as Prolog-like in syntax but different in semantics because of its purity
      and its static type, mode, determinism, and module systems. Early papers by Zoltan
      Somogyi, Fergus Henderson, and Thomas Conway documented the implementation in 1994
      and presented Mercury as an efficient purely declarative logic language in 1995.
  usage:
    - >
      In package-manager terms, the Homebrew package is a language runtime and compiler
      suite rather than a small single-command utility. It installs the compiler, build
      tools, debugger, profiler, and support commands used to compile and inspect
      Mercury programs. Its niche is close to Prolog and functional-language systems:
      users pick it when they want logic programming with stronger compile-time
      guarantees, determinism checking, and efficient native-code-oriented compilation.
related-packages:
  - id: brew:swi-prolog
    reason: >
      Choose SWI-Prolog for a mature, interactive Prolog environment; choose Mercury
      when compile-time types, modes, determinism checking, and purity are central
      requirements.
    rel: alternative
    sources:
      - https://www.mercurylang.org/information/doc-latest/mercury_transition_guide/
      - https://www.mercurylang.org/about.html
      - https://www.swi-prolog.org/
