id: brew:buildifier
display-name: Buildifier
homepage: https://github.com/bazelbuild/buildtools
repo: https://github.com/bazelbuild/buildtools
docs:
  - https://github.com/bazelbuild/buildtools/blob/main/buildifier/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Buildifier became common wherever Bazel is used seriously because BUILD and `.bzl`
      files are code-like inputs that benefit from deterministic formatting in review
      and CI. The tool is packaged by Homebrew and Nix according to the input and can
      also be installed with Go or run through Bazel rules.
    - >
      Its adoption is tied directly to Bazel's adoption: monorepos and polyglot builds
      that standardize on Bazel often add Buildifier to presubmit checks so build
      metadata stays consistent.
  package-nerd-significance:
    - >
      Buildifier is significant because it formats package/build metadata rather than
      application source. For Bazel users, BUILD files are the package graph, so a
      stable formatter lowers merge noise and makes automated rewrites safer.
    - >
      It also sits beside Buildozer: Buildifier normalizes and checks files, while
      Buildozer edits them programmatically, together forming a small maintenance
      toolkit for large Bazel workspaces.
  project-history:
    - >
      Buildifier is part of the bazelbuild/buildtools repository, which collects
      developer tools for working with Google's Bazel build tool. The repository also
      includes related tools such as Buildozer and unused_deps.
    - >
      Its role is deliberately analogous to source-code formatters such as clang-format:
      it gives Bazel and Starlark files a standard convention and can also report or fix
      lint warnings.
  related-projects:
    - >
      Bazel is the build system whose BUILD, WORKSPACE, MODULE.bazel, and Starlark files
      Buildifier formats.
    - Buildozer is the companion buildtools utility for command-line edits to Bazel files.
    - unused_deps is another buildtools utility for Java dependency cleanup.
  sources:
    - https://github.com/bazelbuild/buildtools
    - https://github.com/bazelbuild/buildtools/blob/main/buildifier/README.md
    - source_facts.package-manager
  summary:
    - >
      Buildifier is the Bazel ecosystem's standard formatter and linter for BUILD,
      WORKSPACE, MODULE.bazel, `.bzl`, and other Starlark-related files.
  timeline:
    - >
      2010s: Buildifier developed inside the Bazel buildtools repository as Bazel's
      Starlark formatting tool.
    - >
      2020s: buildtools releases continued through major versions and Buildifier gained
      broader linting and JSON diagnostic workflows.
    - >
      2020s: Installation paths included Go module installation, Bazel rules, Homebrew,
      and Nix packages.
  usage:
    - >
      Basic usage is `buildifier path/to/file`; recursive formatting uses `buildifier -r
      path/to/dir`. The README documents file-type detection for BUILD, WORKSPACE,
      `.bzl`, MODULE, and default Starlark files, with `--type` overrides for stdin or
      unusual filenames.
    - >
      The integrated linter runs with `--lint=warn` or `--lint=fix`, and
      machine-readable diagnostics are available with JSON output in check mode.
related-packages:
  - id: brew:bazel
    reason: >
      Buildifier formats and lints the BUILD, WORKSPACE, MODULE.bazel, and `.bzl` files
      that define Bazel builds, making Bazel its primary adjacent workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/bazelbuild/buildtools/blob/main/buildifier/README.md
      - https://bazel.build/
  - id: brew:buildozer
    reason: >
      Buildozer performs structured command-line edits to Bazel build files, after which
      Buildifier can apply canonical formatting and lint checks.
    rel: adjacent_workflow
    sources:
      - https://github.com/bazelbuild/buildtools/blob/main/buildifier/README.md
      - https://github.com/bazelbuild/buildtools/tree/main/buildozer
category: developer-tools
package-manager:
  brew: buildifier
  nix: buildifier
package-manager-url: https://formulae.brew.sh/formula/buildifier
license: Apache-2.0
tags:
  - bazel
  - build-files
  - cli
  - formatter
  - linting
  - starlark
description: Format bazel BUILD files with a standard convention
executables:
  - buildifier
provenance:
  formula: buildifier
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
