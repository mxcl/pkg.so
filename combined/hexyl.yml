id: brew:hexyl
display-name: hexyl
homepage: https://github.com/sharkdp/hexyl
repo: https://github.com/sharkdp/hexyl
docs:
  - https://github.com/sharkdp/hexyl#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents a broad packaging footprint: Ubuntu, Debian, Fedora, Arch,
      Void, Gentoo overlay, Homebrew, MacPorts, BSD package systems, Termux, Nix, Guix,
      cargo, snap, Scoop, and binary release downloads. That unusually wide install
      surface is central to its adoption story.
    - >
      The batch metadata independently lists many package-manager names, including apk,
      brew, Debian/Ubuntu, dnf, MacPorts, Nix, pacman, Scoop, winget, and zypper,
      confirming that hexyl spread well beyond cargo users.
  package-nerd-significance:
    - >
      hexyl is significant to package nerds because it is a modern, Rust-native
      counterpart to classic tools such as xxd and hexdump. It demonstrates how a tiny
      CLI can gain wide distribution when it is easy to build, easy to package, and
      solves an everyday terminal inspection problem with better defaults.
    - >
      It is also a good example of the Rust CLI packaging pipeline: crate publication
      for cargo users, binary release artifacts, distro packages, Homebrew/MacPorts
      ports, and Windows package-manager entries all describing the same small
      executable.
  project-history:
    - >
      The GitHub repository was created in November 2018, and crates.io metadata records
      publication of the hexyl crate the following day. The README describes the core
      idea: terminal hex output colored by byte category, including null bytes,
      printable ASCII, ASCII whitespace, other ASCII, and non-ASCII bytes.
    - >
      The project fits the style of sharkdp's Rust CLI tools: focused scope, polished
      terminal output, cross-platform packaging, and cargo-based installation. Its
      repository metadata, README badges, and dual MIT/Apache-2.0 licensing align it
      with Rust ecosystem norms.
  related-projects:
    - >
      Related tools include xxd, hexdump/od, hexer, bvi, hexhog, and GUI hex editors. In
      the same Rust terminal-tool family, sharkdp projects such as bat and fd are
      relevant comparators for packaging and adoption patterns.
  sources:
    - >
      GitHub README describes byte-class coloring, installation methods, Windows
      terminal notes, cargo installation, environment-variable configuration, and
      licensing.
    - >
      Homebrew formula metadata and the input package-manager map support the
      package-manager adoption summary.
    - crates.io metadata supplies crate publication, repository, and package identity.
  summary:
    - >
      hexyl is a Rust command-line hex viewer for terminals. It distinguishes byte
      classes with color, making binary inspection more readable than a plain hex dump
      while staying in the small-CLI-tool tradition.
  timeline:
    - '2018-11: GitHub repository metadata records creation of sharkdp/hexyl.'
    - '2018-11: crates.io records the hexyl crate.'
    - >
      2019: README packaging notes include Ubuntu 19.10 and Debian Buster as
      distribution package baselines.
    - '2021: README packaging notes include Fedora 35 as a distribution package baseline.'
    - >
      2020s: Package-manager metadata shows expansion across Linux distributions, macOS
      package managers, Windows package managers, BSDs, Termux, Nix, Guix, snap, and
      cargo.
  usage:
    - >
      hexyl is used for inspecting binary files in a terminal when color helps identify
      structure quickly. Unlike an editor, it is primarily a viewer; users reach for it
      when they want readable offsets, byte values, and a character panel without
      opening a full binary editor.
    - >
      Configuration is intentionally light: the README documents environment variables
      for the colors used by each byte category and the offset column. That keeps
      package-manager installs simple while still letting terminal users tune output to
      their color scheme.
related-packages:
  - id: brew:hexhog
    reason: >
      Choose hexhog when inspection must lead directly into inserting, deleting, or
      replacing bytes, since hexyl is a viewer rather than an editor.
    rel: alternative
    sources:
      - https://github.com/sharkdp/hexyl#readme
      - https://github.com/DVDTSB/hexhog#readme
  - id: brew:hexer
    reason: >
      Choose hexer when you need an interactive vi/ex-like binary editor instead of
      hexyl's non-interactive colorized output.
    rel: alternative
    sources:
      - https://github.com/sharkdp/hexyl#readme
      - https://devel.ringlet.net/editors/hexer/
  - id: brew:bvi
    reason: >
      Choose bvi when vi-style terminal editing and a per-user `.bvirc` configuration
      are more important than hexyl's polished read-only display.
    rel: alternative
    sources:
      - https://github.com/sharkdp/hexyl#readme
      - https://bvi.sourceforge.net/man_bvi.html
category: developer-tools
package-manager:
  apk: hexyl
  brew: hexyl
  debian: hexyl
  dnf: hexyl
  macports: hexyl
  nix: hexyl
  pacman: hexyl
  scoop: main/hexyl
  ubuntu: hexyl
  winget: sharkdp.hexyl
  zypper: hexyl
package-manager-url: https://formulae.brew.sh/formula/hexyl
license: Apache-2.0 OR MIT
tags:
  - binary-files
  - cli
  - hex-viewer
  - rust
description: Command-line hex viewer
executables:
  - hexyl
provenance:
  formula: hexyl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
