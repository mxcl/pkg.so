id: brew:chocolate-doom
display-name: Chocolate Doom
homepage: https://www.chocolate-doom.org/
repo: https://github.com/chocolate-doom/chocolate-doom
docs:
  - https://github.com/chocolate-doom/chocolate-doom#readme
  - https://www.chocolate-doom.org/wiki/index.php/Chocolate_Doom
config-file-location:
  unix:
    - SDL_GetPrefPath("", "chocolate-doom")/default.cfg
    - SDL_GetPrefPath("", "chocolate-doom")/chocolate-doom.cfg
  windows:
    - ./default.cfg
    - ./chocolate-doom.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      The official wiki presents Chocolate Doom as an actively developed source port
      with downloads, a user guide, source code, and related forks. The input package
      facts show broad package-manager availability across Homebrew, Alpine, Debian,
      Fedora, Nix, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      Chocolate Doom is important in package-manager culture because it is a
      reference-quality, portability-minded Doom source port: small enough to ship
      widely, strict enough to preserve vanilla behavior, and useful as a baseline for
      forks such as Crispy Doom.
  project-history:
    - >
      The official repository begins in July 2005, and the README says the project
      originally targeted Doom before expanding to include Heretic, Hexen, and Strife.
      Its stated goals are free software, portability, accurate DOS behavior including
      bugs, demo/config/save compatibility, and a retro feel.
  related-projects:
    - >
      The README names Doom, Heretic, Hexen, and Strife support. The official wiki links
      Crispy Doom as a friendly fork that adds extra features.
  sources:
    - https://github.com/chocolate-doom/chocolate-doom#readme
    - https://www.chocolate-doom.org/wiki/index.php/Chocolate_Doom
    - https://formulae.brew.sh/api/formula/chocolate-doom.json
    - https://github.com/chocolate-doom/chocolate-doom
  summary:
    - >
      Chocolate Doom is a Doom source port focused on accurately reproducing the
      original DOS Doom experience on modern systems.
  timeline:
    - '2005: Initial public repository history and chocolate-doom 0.0.1 tags.'
    - '2015: 2.2.0 release line appears in official tags.'
    - '2017: 3.0.0 release arrives after beta tags.'
    - '2024: 3.1.0 release appears in official tags.'
    - '2025: 3.1.1 release appears in official tags and Homebrew tracks 3.1.1.'
  usage:
    - >
      Players use the chocolate-doom family of executables with original IWAD files and
      DOS-compatible configuration. The README documents default.cfg compatibility, the
      separate chocolate-doom.cfg file for extra settings, setup tools, command-line
      options, and -merge for total conversions that expected DOS-era IWAD merging.
related-packages:
  - id: brew:crispy-doom
    reason: >
      Choose Crispy Doom when you want a Chocolate Doom-based port with removed vanilla
      limits, enhanced resolution, and optional conveniences while retaining strong
      compatibility goals.
    rel: alternative
    sources:
      - https://github.com/chocolate-doom/chocolate-doom
      - https://github.com/fabiangreffrath/crispy-doom
category: games
package-manager:
  apk: chocolate-doom
  brew: chocolate-doom
  debian: chocolate-doom
  dnf: chocolate-doom
  nix: chocolate-doom
  ubuntu: chocolate-doom
  zypper: chocolate-doom
package-manager-url: https://formulae.brew.sh/formula/chocolate-doom
license: GPL-2.0-or-later
tags:
  - cli
  - doom
  - game-engine
  - retro-gaming
  - sdl
  - source-port
description: Accurate source port of Doom
executables:
  - chocolate-doom
  - chocolate-doom-setup
  - chocolate-heretic
  - chocolate-heretic-setup
  - chocolate-hexen
  - chocolate-hexen-setup
  - chocolate-server
  - chocolate-strife
  - chocolate-strife-setup
provenance:
  formula: chocolate-doom
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
