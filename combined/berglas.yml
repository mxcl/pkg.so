id: brew:berglas
display-name: Berglas
homepage: https://github.com/GoogleCloudPlatform/berglas
repo: https://github.com/GoogleCloudPlatform/berglas
docs:
  - https://github.com/GoogleCloudPlatform/berglas#readme
config-file-location: null
credentials-file-location:
  unix: ~/.config/gcloud/application_default_credentials.json
  windows: '%APPDATA%\gcloud\application_default_credentials.json'
history:
  adoption-history:
    - >
      Berglas adoption came from teams that needed secret handling around Cloud KMS and
      Cloud Storage, then later interoperability with Secret Manager. It fit CI/CD and
      serverless workflows where environment injection and CLI automation were
      convenient.
    - >
      Homebrew packaging made it easy for macOS operators to bootstrap and inspect
      Google Cloud secret workflows locally while using Application Default Credentials
      from the Cloud SDK.
  package-nerd-significance:
    - >
      Berglas is package-nerd significant as a small Go security CLI with cloud-side
      state. Installing the package gives a local executable, but most real behavior
      depends on enabled Google Cloud services, IAM, KMS keys, buckets, or Secret
      Manager resources.
    - >
      It is also a snapshot of a transitional Google Cloud secrets era: the tool
      supports the older Cloud Storage plus KMS pattern while documenting
      interoperability with Secret Manager.
  project-history:
    - >
      The Berglas repository was created in April 2019, with a v0.1.3 release published
      in June 2019. Its README describes it as both a CLI for encrypting, decrypting,
      and storing data on Google Cloud and a library for injecting secrets into Google
      Cloud runtimes.
    - >
      The project is explicit about its support status: it lives under
      GoogleCloudPlatform but is not an officially supported Google product.
  related-projects:
    - Google Cloud KMS supplies encryption keys for the original storage model.
    - Google Cloud Storage stores encrypted secret blobs in the original model.
    - Google Secret Manager is the related managed service with Berglas interoperability.
  sources:
    - https://github.com/GoogleCloudPlatform/berglas
    - https://github.com/GoogleCloudPlatform/berglas/releases/tag/v0.1.3
  summary:
    - >
      Berglas is a GoogleCloudPlatform command-line tool and Go library for storing and
      retrieving secrets on Google Cloud. It predates some common Secret Manager
      workflows and bridges Cloud KMS, Cloud Storage, and Secret Manager access
      patterns.
  timeline:
    - '2019-04: The GoogleCloudPlatform/berglas repository was created.'
    - '2019-06: Berglas v0.1.3 was published.'
    - >
      2020s: Berglas documentation continued to emphasize Cloud KMS, Cloud Storage,
      Secret Manager interoperability, and ADC-based setup.
  usage:
    - >
      Common commands create secrets, grant access, read secret data, bootstrap buckets
      and KMS keys, and run child processes with secrets populated in the environment.
    - >
      Authentication usually follows Google Cloud Application Default Credentials, which
      is why the package curation points at the gcloud ADC credentials file rather than
      a Berglas-specific credentials file.
related-packages:
  - id: brew:sops
    reason: >
      Choose SOPS when secrets should remain as encrypted structured files in Git across
      several key providers; choose Berglas for Google Cloud-hosted secret storage and
      runtime `berglas://` injection.
    rel: alternative
    sources:
      - https://github.com/GoogleCloudPlatform/berglas
      - https://getsops.io/docs/
category: security
package-manager:
  brew: berglas
  nix: berglas
package-manager-url: https://formulae.brew.sh/formula/berglas
license: Apache-2.0
tags:
  - cli
  - google-cloud
  - kms
  - secret-manager
  - secrets
description: Tool for managing secrets on Google Cloud
executables:
  - berglas
provenance:
  formula: berglas
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
