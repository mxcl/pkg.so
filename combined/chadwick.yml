id: brew:chadwick
display-name: Chadwick
homepage: https://chadwick.readthedocs.io
repo: https://github.com/chadwickbureau/chadwick
docs:
  - https://chadwick.readthedocs.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Chadwick's adoption follows the Retrosheet and baseball research ecosystem: the
      documentation is meant to be read alongside Retrosheet materials, and
      acknowledgments cite support or guidance from Sports Reference, the Society for
      American Baseball Research, XMLTeam, and Retrosheet. The supplied input records
      Homebrew packaging, while the official README notes that Chadwick may also be
      available in package managers and provides Windows binaries through GitHub
      releases.
  package-nerd-significance:
    - >
      For package maintainers and data-tool collectors, Chadwick is a useful example of
      a domain-specific C command-line suite that packages well: stable executables, no
      credentials or service dependency, ReadTheDocs documentation, source releases, and
      value to a narrow but serious research community.
  project-history:
    - >
      The official documentation says Chadwick is written and maintained by Dr. T. L.
      Turocy at the Chadwick Baseball Bureau and is copyrighted 2002-2023. The project
      provides tools such as cwevent, cwgame, cwbox, cwdaily, cwsub, and cwcomment, with
      several utilities replacing or extending earlier DiamondWare programs.
  related-projects:
    - >
      Chadwick is tightly related to Retrosheet and the DiamondWare utilities BEVENT,
      BGAME, and BOX, which its tools replace or extend. It also sits near Sports
      Reference and SABR workflows because those communities depend on structured
      historical baseball data.
  sources:
    - https://chadwick.readthedocs.io/
    - https://github.com/chadwickbureau/chadwick/blob/master/README.md
  summary:
    - >
      Chadwick is a suite of command-line tools for extracting and transforming baseball
      play-by-play and boxscore data in the DiamondWare format used by Retrosheet. Its
      significance is concentrated in the baseball data community rather than
      general-purpose CLI culture.
  timeline:
    - '2002: Official documentation dates the Chadwick copyright period from 2002.'
    - '2023: Official documentation records maintenance and copyright through 2023.'
    - >
      Release metadata: The README identifies 0.10.0 as the documented release and
      directs users to GitHub releases.
  usage:
    - >
      Users run Chadwick tools to turn Retrosheet play-by-play event files and box
      scores into delimited output, field lists, game-level summaries, substitution
      data, comments, and daily statistical totals. It is a data-cleaning and extraction
      toolchain for people who want reproducible command-line access to historical
      baseball game data.
