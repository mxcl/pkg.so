config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libwpd's adoption came through office suites and conversion tools rather than
      end-user branding. The project lists LibreOffice, AbiWord, OpenOffice.org, and
      KOffice among users, and its command-line tools such as wpd2html and wpd2text gave
      packagers a simple way to expose the same parser outside a GUI suite.
    - >
      In the Document Liberation Project framing, libwpd belongs to a family of
      reverse-engineered import libraries that grew around LibreOffice and related FOSS
      office tools, with an explicit goal of freeing user documents from proprietary
      file-format lock-in.
  package-nerd-significance:
    - >
      For package nerds, libwpd is one of the classic examples of a small import-filter
      library that keeps an obsolete proprietary format alive in modern distributions.
      It is also a dependency that explains why office-suite builds often pull in a
      cluster of document-liberation libraries that look obscure until someone hands you
      a decades-old WPD file.
  project-history:
    - >
      The project appeared on SourceForge with libwpd 0.1 published on 2002-11-07, then
      moved quickly through parser releases during 2003 and 2004. Its own site describes
      the library as a callback-based processor for WordPerfect documents, a shape that
      made it usable inside larger document import pipelines rather than only as a
      standalone converter.
    - >
      The 0.9.0 release on 2010-11-16 was described by the project as the result of more
      than five years of development and as a non-backward-compatible line. That release
      added or improved handling for page numbering, embedded images, text boxes,
      password-protected documents, annotations, Unicode mappings, and HTML conversion
      details.
  related-projects:
    - >
      Related projects include writerperfect, libodfgen, librevenge, LibreOffice,
      AbiWord, OpenOffice.org, KOffice, and the broader Document Liberation Project
      family.
  sources:
    - https://libwpd.sourceforge.net/
    - https://libwpd.sourceforge.net/news.html
    - https://sourceforge.net/projects/libwpd/files/libwpd/
    - https://www.documentliberation.org/about/
  summary:
    - >
      libwpd is a C++ library for reading WordPerfect documents, packaged because it
      turns an old proprietary office format into something Unix tools and office suites
      can import.
  timeline:
    - '2002-11-07: libwpd 0.1 published on SourceForge.'
    - '2005-02-24: libwpd 0.8.0 release line appears in the SourceForge file archive.'
    - '2010-11-16: libwpd 0.9.0 released after more than five years of development.'
    - '2014-05-23: libwpd 0.10.0 published in the SourceForge file archive.'
    - >
      2014-04: The Document Liberation Project was created as a home for related
      file-format import libraries.
  usage:
    - >
      On package-managed systems, libwpd is normally installed as a shared library plus
      small inspection or conversion utilities. Users encounter it indirectly when
      LibreOffice or AbiWord opens a WordPerfect file, while maintainers and archivists
      use the CLI tools for batch conversion and regression testing.
related-packages:
  - id: brew:writerperfect
    reason: >
      writerperfect uses libwpd with the librevenge and libodfgen stack to provide
      command-line WordPerfect-to-OpenDocument conversion, making it the practical
      companion for headless batch migration.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/libwpd/wiki/writerperfect/
      - https://libwpd.sourceforge.net/download.html
