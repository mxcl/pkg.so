id: brew:dexter
display-name: Dexter
homepage: https://github.com/ankane/dexter
repo: https://github.com/ankane/dexter
docs:
  - https://github.com/ankane/dexter#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dexter entered the PostgreSQL performance-tool niche as a command-line utility
      that can read pg_stat_statements, live activity, log files, SQL files, and stdin.
      Its README documents installation through RubyGems, Docker, Homebrew, and Linux
      packages.
  package-nerd-significance:
    - >
      The package is notable because it bridges application-level package managers and
      database-server extension packaging: the CLI is easy to install, but useful
      operation also depends on HypoPG being present and enabled on the PostgreSQL
      server.
  project-history:
    - >
      The official tag history starts in 2017, and the changelog shows a steady 0.x
      series focused on safer index suggestions, more input sources, PostgreSQL
      compatibility, Docker and Linux packaging, and support for newer Ruby and
      PostgreSQL versions.
  related-projects:
    - >
      Dexter is tightly related to PostgreSQL, pg_stat_statements, pg_stat_activity,
      server log analysis, pg_query, and the HypoPG extension for hypothetical indexes.
  sources:
    - https://github.com/ankane/dexter#readme
    - https://github.com/ankane/dexter/blob/master/CHANGELOG.md
    - https://github.com/ankane/dexter/tags
  summary:
    - >
      Dexter is an automatic index recommender for PostgreSQL that analyzes query
      sources and proposes indexes using HypoPG before optionally creating them.
  timeline:
    - '2017: v0.1.0 appears in the official tag history.'
    - >
      2017: early releases add pg_stat_statements, psql-style connection options, CSV
      input, multicolumn indexes, and schema support.
    - >
      2023: v0.5.0 adds normalized-query support and changes several input and HypoPG
      safety defaults.
    - >
      2025: v0.6.0 adds Linux packages for Ubuntu 24.04 and Debian 12 while dropping
      older runtime support.
  usage:
    - >
      A typical run points Dexter at a database and a query source, such as `dexter -d
      dbname --pg-stat-statements`. By default it reports candidate indexes; creating
      indexes requires an explicit `--create` flag.
related-packages: []
category: data
