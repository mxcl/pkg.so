id: brew:ipsw
display-name: ipsw
homepage: https://blacktop.github.io/ipsw
repo: https://github.com/blacktop/ipsw
docs:
  - https://blacktop.github.io/ipsw/docs/cli/ipsw
  - https://blacktop.github.io/ipsw/docs/introduction
config-file-location:
  linux:
    - ~/.config/ipsw/config.yaml
    - /etc/ipsw/config.yml
    - /root/snap/ipswd/common/ipsw/config.yml
  macos:
    - ~/.config/ipsw/config.yaml
    - ~/.config/ipsw/config.yml
  windows: $AppData/ipsw/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      ipsw's adoption is strongest in Apple security and reverse-engineering circles
      where users need a single command that understands firmware downloads, restore
      images, kernelcaches, dyld shared caches, Image4 objects, entitlements, crash
      logs, and connected devices.
    - >
      Homebrew packages ipsw as an official formula with macOS and Linux bottles, and
      the input metadata also records MacPorts, Nix, and winget packaging. The upstream
      README also documents a blacktop tap, Snap installation for Linux, and Scoop
      installation for Windows.
  package-nerd-significance:
    - >
      ipsw matters to package nerds because it bundles a large amount of Apple-platform
      reverse-engineering knowledge into a distributable CLI. It turns fast-changing
      proprietary firmware formats into repeatable commands, and its packaging has to
      keep pace with Go modules, large release artifacts, platform bottles, and
      security-research workflows.
  project-history:
    - >
      The project presents itself as an iOS/macOS research Swiss Army knife for security
      researchers, reverse engineers, jailbreak developers, and Apple-platform
      enthusiasts. Its documentation centers on IPSW and OTA analysis, Mach-O parsing,
      dyld shared cache analysis, kernelcache work, device interaction, firmware
      components such as IMG4/iBoot/SEP, App Store Connect integration, and developer
      tooling.
    - >
      The repository history reflects a fast-moving research tool rather than a small
      Unix utility: the GitHub page records thousands of commits and hundreds of
      releases, while release notes in the 3.1.x series show continuing work on
      symbolication, dyld analysis, extract workflows, AppleDB handling, firmware keys,
      and dependency updates.
  related-projects:
    - Apple IPSW and OTA firmware formats are the core data sources.
    - >
      AppleDB, dyld shared caches, Mach-O tooling, Frida, App Store Connect APIs, and
      device-management libraries sit around its workflows.
    - >
      Homebrew, the blacktop tap, Snap, Scoop, MacPorts, Nix, and winget are related
      distribution channels.
  sources:
    - >
      Homebrew formula metadata supplies package-manager availability, formula
      description, and bottle/platform context.
    - The CLI documentation supplies command coverage and configuration details.
    - >
      The GitHub repository and release pages supply implementation context, repository
      scale, release cadence, and recent changelog themes.
    - >
      The official introduction supplies the project positioning, audience,
      capabilities, and use cases.
  summary:
    - >
      ipsw is blacktop's iOS and macOS firmware research CLI, a large Go-based toolkit
      for downloading, parsing, extracting, diffing, and analyzing Apple firmware,
      device artifacts, Mach-O binaries, dyld shared caches, and related
      security-research data.
  timeline:
    - >
      Repository era: blacktop/ipsw develops as a Go CLI and API daemon for Apple
      firmware and device research.
    - >
      3.x era: Documentation describes an expanded framework covering IPSW/OTA, Mach-O,
      dyld, kernel, device, firmware, App Store Connect, and AI-assisted analysis
      commands.
    - >
      June 2026: Release notes in the 3.1.x line include symbolication, dyld, extract,
      AppleDB, and firmware-key updates.
    - >
      2026: Homebrew formula metadata packages ipsw 3.1.700 with macOS and Linux bottle
      support.
  usage:
    - >
      Common workflows include downloading firmware by device identifier, extracting
      kernelcache or DeviceTree artifacts, parsing dyld shared caches, class-dumping
      Objective-C and Swift metadata, symbolication, comparing IPSWs or OTAs,
      interacting with USB-connected iOS devices, and inspecting firmware components
      such as IMG4, iBoot, SEP, and co-processor images.
    - >
      The CLI also grew into a broader research framework: the docs list App Store
      Connect commands, SSH and Frida-related tooling, sandbox and entitlement tools,
      package and BOM inspection, a REST API daemon, and AI-assisted decompilation
      integrations.
related-packages: []
category: security
package-manager:
  apk: ipsw
  brew: ipsw
  macports: ipsw
  nix: ipsw
  winget: blacktop.ipsw
package-manager-url: https://formulae.brew.sh/formula/ipsw
license: MIT
tags:
  - cli
  - firmware
  - ios
  - macos
  - reverse-engineering
  - security-research
description: Research tool for iOS & macOS devices
executables:
  - ipsw
provenance:
  formula: ipsw
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
