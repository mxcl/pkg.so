id: brew:lazysql
display-name: lazysql
homepage: https://github.com/jorgerojas26/lazysql
repo: https://github.com/jorgerojas26/lazysql
docs:
  - https://github.com/jorgerojas26/lazysql#readme
config-file-location:
  linux:
    - ~/.config/lazysql/config.toml
    - $XDG_CONFIG_HOME/lazysql/config.toml
    - .lazysql.toml in a project directory
  macos:
    - ~/Library/Application Support/lazysql/config.toml
    - $XDG_CONFIG_HOME/lazysql/config.toml
    - .lazysql.toml in a project directory
  windows:
    - '%APPDATA%\lazysql\config.toml'
    - .lazysql.toml in a project directory
credentials-file-location:
  linux:
    - ~/.config/lazysql/config.toml
    - $XDG_CONFIG_HOME/lazysql/config.toml
    - .lazysql.toml in a project directory
  macos:
    - ~/Library/Application Support/lazysql/config.toml
    - $XDG_CONFIG_HOME/lazysql/config.toml
    - .lazysql.toml in a project directory
  windows:
    - '%APPDATA%\lazysql\config.toml'
    - .lazysql.toml in a project directory
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, Go, GitHub binary releases,
      and Arch AUR packaging. GitHub metadata reported 4,033 stars by 2026-06-29.
  package-nerd-significance:
    - >
      lazysql is part of the wave of Go terminal applications that translate GUI
      database workflows into package-manager-friendly single binaries, especially
      appealing to users who prefer staying inside a terminal.
  project-history:
    - >
      The GitHub repository was created on 2023-05-29. The README says the author wanted
      a LazyGit-like interface for SQL, did not find one that fit his needs, and built
      lazysql as a first open source and first Go project.
  related-projects:
    - >
      The README names LazyGit as the main inspiration and documents Go and tview as
      implementation technologies.
  sources:
    - https://api.github.com/repos/jorgerojas26/lazysql
    - https://github.com/jorgerojas26/lazysql
    - https://github.com/jorgerojas26/lazysql/releases
  summary:
    - >
      lazysql is a cross-platform Go TUI for managing SQL database connections from the
      terminal.
  timeline:
    - '2023-05-29: GitHub repository created.'
    - '2026-05-25: Release v0.5.1 published.'
    - '2026-06-29: Release v0.5.5 published.'
  usage:
    - >
      lazysql stores connection definitions in TOML config files and supports
      project-local `.lazysql.toml` overrides. Its README shows Postgres connection
      examples, read-only connection mode, an SQL editor, tabs, Vim keybindings, and
      multiple database connections.
related-packages:
  - id: brew:rainfrog
    reason: >
      Choose rainfrog for a Rust database TUI with PostgreSQL, MySQL, and SQLite
      support; choose LazySQL when its connection manager, SQL editor, and project-local
      overrides better fit the workflow.
    rel: alternative
    sources:
      - https://github.com/jorgerojas26/lazysql
      - https://github.com/achristmascarl/rainfrog
  - id: brew:pgcli
    reason: >
      Choose pgcli for a PostgreSQL-specific interactive shell with context-aware
      completion and conventional REPL behavior instead of LazySQL's multi-database
      full-screen TUI.
    rel: alternative
    sources:
      - https://github.com/jorgerojas26/lazysql
      - https://www.pgcli.com/
  - id: brew:mycli
    reason: >
      Choose mycli for a completion-rich MySQL-family command shell; LazySQL is the
      broader choice when visual browsing or one interface for several database engines
      is required.
    rel: alternative
    sources:
      - https://github.com/jorgerojas26/lazysql
      - https://www.mycli.net/
category: data
package-manager:
  brew: lazysql
  macports: lazysql
  nix: lazysql
  scoop: extras/lazysql
package-manager-url: https://formulae.brew.sh/formula/lazysql
license: MIT
tags:
  - cli
  - database
  - go
  - mysql
  - postgresql
  - sql
  - sqlite
  - tui
description: Cross-platform TUI database management tool
executables:
  - lazysql
provenance:
  formula: lazysql
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
