id: brew:cppi
display-name: GNU Cppi
homepage: https://www.gnu.org/software/cppi/
repo: https://git.savannah.gnu.org/git/cppi.git
docs:
  - https://www.gnu.org/software/cppi/manual
  - https://www.gnu.org/software/cppi
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption is typical of compact GNU command-line utilities: it appears in Unix
      package collections as a formatting and lint-adjacent aid for C and C++ source
      trees.
  package-nerd-significance:
    - >
      The package matters to maintainers because it is narrowly scoped, reproducibly
      distributed through GNU release archives, and useful in style or cleanup pipelines
      without pulling in a full C formatter.
  project-history:
    - >
      The package is maintained as a GNU program, with Savannah hosting its project and
      source repository and GNU publishing the user manual and release tarballs.
  related-projects:
    - >
      cppi sits near C formatting and linting tools, but its official scope is
      specifically C preprocessor directive indentation.
  sources:
    - https://www.gnu.org/software/cppi/
    - https://www.gnu.org/software/cppi/manual
    - https://savannah.gnu.org/projects/cppi/
    - https://ftp.gnu.org/gnu/cppi/
  summary:
    - >
      GNU cppi is a small GNU developer tool for indenting C preprocessor directives so
      their nesting is visible.
  timeline:
    - '2010: GNU FTP archive lists cppi 1.14 and 1.15 release tarballs.'
    - '2013: GNU FTP archive lists cppi 1.18 release tarballs.'
  usage:
    - >
      cppi is used from the command line on source files to make
      conditional-preprocessor structure easier to review by aligning directives with
      their nesting level.
related-packages:
  - id: brew:clang-format
    reason: >
      Use clang-format alongside Cppi when the entire C/C++ source file needs
      formatting; Cppi remains useful for its specialized preprocessor-indentation
      checks and check-only exit status.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/cppi/manual/
      - https://clang.llvm.org/docs/ClangFormat.html
category: developer-tools
package-manager:
  brew: cppi
  debian: cppi
  dnf: cppi
  nix: cppi
  zypper: cppi
package-manager-url: https://formulae.brew.sh/formula/cppi
license: GPL-3.0-or-later
tags:
  - c-preprocessor
  - cli
  - formatting
  - gnu
  - linting
description: Indent C preprocessor directives to reflect their nesting
executables:
  - cppi
provenance:
  formula: cppi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
