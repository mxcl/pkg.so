id: brew:librsync
display-name: librsync
homepage: https://librsync.github.io/
repo: https://github.com/librsync/librsync
docs:
  - https://librsync.github.io/
  - https://librsync.github.io/page_formats.html
  - https://librsync.github.io/page_librsync.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README lists Dropbox, rdiff-backup, Duplicity, and others as users.
      That adoption pattern explains librsync's packaging footprint: backup and
      synchronization tools depend on the library behavior while presenting their own
      network, metadata, and policy layers.
  package-nerd-significance:
    - >
      librsync is a good example of a package that is not the famous program named in
      the algorithm. It deliberately does not implement the rsync wire protocol, file
      metadata handling, SSH transport, or directory synchronization; it packages the
      transferable delta primitive that higher-level tools build around.
  project-history:
    - >
      The project README credits Martin Pool and contributors from 1999 onward and says
      librsync was originally written for rproxy, an experiment in delta-compression for
      HTTP. The library exposes the core signature, delta, and patch operations so other
      programs can compute and apply network deltas without embedding the rsync
      protocol.
    - >
      The modern GitHub release series shows 1.0.0 and 2.0.0 releases in 2015, with
      later 2.x releases continuing the library and rdiff tool as a small, reusable
      delta-compression component.
  related-projects:
    - Related projects include rsync, rproxy, rdiff, rdiff-backup, Duplicity, and Dropbox.
  sources:
    - https://api.github.com/repos/librsync/librsync/releases?per_page=100
    - https://github.com/librsync/librsync
    - https://librsync.github.io/
    - https://librsync.github.io/page_librsync.html
  summary:
    - >
      librsync packages the rsync remote-delta idea as a reusable C library and the
      rdiff command-line tool. It is historically tied to efficient file transfer,
      backup, and binary-patch workflows rather than to the rsync network protocol
      itself.
  timeline:
    - '1999: Martin Pool and contributors began the code line credited in the project README.'
    - >
      2015: Version 1.0.0 was published in January and version 2.0.0 was published in
      November.
    - '2017: Version 2.0.1 continued the post-2.0 release series.'
    - '2020: Version 2.3.0 was published in April.'
    - '2023: Version 2.3.4 was published in February.'
  usage:
    - >
      Library users generate a signature of an old file, compute a delta against a new
      file, and apply that delta with the old file to reproduce the new file. The rdiff
      executable exposes the same operations for shell pipelines and package-maintainer
      tests.
related-packages:
  - id: brew:rsync
    reason: >
      Choose rsync when you need a complete local or remote synchronization command with
      transport and metadata handling; librsync supplies only the reusable delta
      algorithm and cannot speak to an rsync server.
    rel: alternative
    sources:
      - https://librsync.github.io/
      - https://rsync.samba.org/documentation.html
  - id: brew:rdiff-backup
    reason: >
      rdiff-backup uses librsync's delta capabilities to maintain a directly browsable
      current mirror plus historical reverse increments, adding retention and
      remote-backup behavior around the library.
    rel: adjacent_workflow
    sources:
      - https://librsync.github.io/
      - https://rdiff-backup.net/
  - id: brew:duplicity
    reason: >
      duplicity is an officially identified librsync user that adds encrypted
      incremental backups and remote-storage backends around the delta engine.
    rel: adjacent_workflow
    sources:
      - https://librsync.github.io/
      - https://duplicity.us/
category: networking
package-manager:
  apk: librsync
  brew: librsync
  debian: librsync-dev
  dnf: librsync
  macports: librsync
  nix: librsync
  pacman: librsync
  ubuntu: librsync-dev
  zypper: librsync-devel
package-manager-url: https://formulae.brew.sh/formula/librsync
license: LGPL-2.1-or-later
tags:
  - cli
  - delta-sync
  - file-transfer
  - rdiff
  - remote-delta
  - rsync
description: Library that implements the rsync remote-delta algorithm
executables:
  - rdiff
provenance:
  formula: librsync
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
