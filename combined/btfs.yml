id: brew:btfs
display-name: BTFS
homepage: https://github.com/johang/btfs
repo: https://github.com/johang/btfs
docs:
  - https://github.com/johang/btfs#readme
  - https://github.com/johang/btfs/blob/master/man/btfs.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      BTFS is packaged unusually widely for a niche FUSE utility. The official README
      includes install commands for Debian/Ubuntu, Arch Linux, Gentoo, Fedora, Fedora
      OSTree, openSUSE, and macOS via Homebrew.
    - >
      The input also records packaging across Homebrew, MacPorts, Nix, Debian, Ubuntu,
      Alpine, Arch, and zypper ecosystems, showing that the tool became a standard
      package-manager object despite its specialized torrent-filesystem use case.
  package-nerd-significance:
    - >
      BTFS is package-nerd candy because it turns BitTorrent into a filesystem
      abstraction: a small CLI package that bridges P2P distribution, FUSE, libtorrent,
      media playback, and ordinary Unix file tools.
  project-history:
    - >
      Johan Gunnarsson's btfs repository starts in July 2015 and tagged v2.0 the next
      day. The project combines libtorrent-rasterbar with FUSE to expose BitTorrent
      content as a normal file tree.
    - >
      The project continued as a small but portable Unix tool and reached v3.0 in May
      2025 with a port to libfuse 3.x, followed by v3.1.
  related-projects:
    - BTFS depends on FUSE or macFUSE to expose torrents as mounted directories.
    - BTFS uses libtorrent-rasterbar for BitTorrent protocol handling.
    - >
      The README names VLC and mplayer as applications that can consume mounted torrent
      files without changes.
  sources:
    - >
      Local git history from https://github.com/johang/btfs shows initial commit and
      v2.0 in 2015, then v3.0 and v3.1 in 2025.
    - >
      Official README describes mounting .torrent files or magnet links as read-only
      directories with on-demand downloads:
      https://raw.githubusercontent.com/johang/btfs/master/README.md
    - >
      Official README documents Debian/Ubuntu, Arch, Gentoo, Fedora, openSUSE,
      macOS/Homebrew, FUSE, libtorrent-rasterbar, and libcurl:
      https://raw.githubusercontent.com/johang/btfs/master/README.md
    - Package-manager adoption from source_facts.package-manager.
  summary:
    - >
      BTFS is a FUSE filesystem that mounts a .torrent file or magnet link as a
      read-only directory. Files are downloaded on demand as applications read them, so
      ordinary tools like ls, cat, cp, VLC, and mplayer can operate on torrent contents
      through the filesystem.
  timeline:
    - '2015: Initial commit and v2.0 tag.'
    - '2025: v3.0 ports btfs to libfuse 3.x.'
    - '2025: v3.1 follows the libfuse 3.x port.'
  usage:
    - >
      A typical session creates a mount directory, mounts a torrent or magnet link with
      btfs, changes into the mounted directory, and opens media or copies files
      normally. The mount is read-only and content is fetched on demand as the kernel
      asks the FUSE filesystem for file data.
related-packages:
  - id: brew:mktorrent
    reason: >
      mktorrent creates the .torrent metainfo files that BTFS can subsequently mount and
      expose as read-only directories.
    rel: adjacent_workflow
    sources:
      - https://github.com/pobrn/mktorrent
      - https://github.com/johang/btfs
category: system
package-manager:
  apk: btfs
  brew: btfs
  debian: btfs
  macports: btfs
  nix: btfs
  pacman: btfs
  ubuntu: btfs
  zypper: btfs
package-manager-url: https://formulae.brew.sh/formula/btfs
license: GPL-3.0-only
tags:
  - bittorrent
  - cli
  - filesystem
  - fuse
description: BitTorrent filesystem based on FUSE
executables:
  - btfs
  - btfsstat
  - btplay
provenance:
  formula: btfs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
