id: brew:cekit
display-name: CEKit
homepage: https://cekit.io
repo: https://github.com/cekit/cekit
docs:
  - https://docs.cekit.io/
config-file-location:
  unix:
    - ~/.cekit/config
    - image.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      CEKit is aimed at build pipelines that need structured image descriptors rather
      than handwritten Dockerfiles. Its documentation includes Red Hat and OSBS-oriented
      features, and the package facts show distribution through Homebrew and Fedora/DNF.
  package-nerd-significance:
    - >
      For package maintainers, CEKit is interesting because it treats container image
      builds as descriptor-driven artifacts with reusable modules and multiple builder
      backends. That makes it closer to a packaging/build-system tool than a simple
      Docker wrapper.
  project-history:
    - >
      The project documentation records an earlier migration from Concreate dotfiles to
      the CEKit layout, moving configuration into the ~/.cekit directory and
      ~/.cekit/config file. The public GitHub repository was created in 2017 and uses
      CEKit as the Container Evolution Kit name.
  related-projects:
    - Concreate is the predecessor configuration layout referenced by CEKit's migration notes.
    - >
      Docker, Podman, Buildah, and OSBS are relevant builder or build-system
      integrations in the CEKit ecosystem.
  sources:
    - https://api.github.com/repos/cekit/cekit
    - https://github.com/cekit/cekit
    - https://cekit.io
    - https://docs.cekit.io/
    - https://formulae.brew.sh/api/formula/cekit.json
  summary:
    - >
      CEKit is a container image creation tool that builds container images from YAML
      image definitions, with an emphasis on modularity, reuse, and image testing.
  timeline:
    - '2017: Public GitHub repository created for cekit/cekit.'
    - >
      2.x docs: CEKit documented migration from Concreate dotfiles to ~/.cekit and
      ~/.cekit/config.
    - >
      4.x docs: CEKit documents image.yaml descriptors, ~/.cekit/config, and container
      image build/test workflows.
  usage:
    - >
      A typical CEKit project starts with an image.yaml image descriptor. Users can also
      keep global options in ~/.cekit/config or pass an alternate config file with
      --config.
related-packages:
  - id: brew:podman
    reason: >
      Podman is a documented CEKit builder backend, so install it alongside CEKit when
      you want CEKit to turn an image descriptor into a non-privileged local
      container-image build.
    rel: adjacent_workflow
    sources:
      - https://docs.cekit.io/en/latest/handbook/building/builder-engines.html
      - https://docs.podman.io/
category: developer-tools
package-manager:
  brew: cekit
package-manager-url: https://formulae.brew.sh/formula/cekit
license: MIT
tags:
  - buildah
  - cli
  - containers
  - docker
  - image-build
  - osbs
  - podman
  - yaml
description: Container Evolution Kit
executables:
  - cekit
  - cekit-cache
provenance:
  formula: cekit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
