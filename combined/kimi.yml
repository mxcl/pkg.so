history:
  adoption-history:
    - >
      Kimi is available through the web and native applications, giving Moonshot AI a
      consumer-facing assistant alongside its developer API platform.
    - >
      The product's adoption strategy emphasizes long-context conversation, web search,
      multimodal reasoning, document handling, deep research, and agent workflows rather
      than a chat-only interface.
  package-nerd-significance:
    - >
      Kimi is notable as the packaged desktop surface of Moonshot AI's assistant
      ecosystem. It reflects the shift from browser-only AI chat toward native clients
      and agent workspaces that can interact with local files and longer-running
      workflows.
  project-history:
    - >
      Moonshot AI developed Kimi as a general AI assistant with web search, long-context
      conversation, multimodal reasoning, and content-creation tools. It subsequently
      expanded into a broader family including General Agent, Agent Swarm, Kimi Code,
      Kimi Claw, and Kimi Work.
    - >
      Official documentation distinguishes the general Kimi assistant from Kimi Work, a
      local desktop agent designed for deeper access to files, browser automation, code
      execution, and scheduled work.
  related-projects:
    - Kimi Work
    - Kimi Code
    - Kimi Claw
    - Kimi Open Platform
    - Moonshot AI K-series models
  sources:
    - 'Official Kimi Work page: https://www.kimi.com/products/kimi-work'
    - 'Official help center: https://www.kimi.com/help'
    - 'Official overview: https://www.kimi.com/help/getting-started/overview'
  summary:
    - >
      Kimi is Moonshot AI's multimodal AI assistant for conversation, web research,
      reasoning, file analysis, content creation, and agent-driven tasks.
  timeline:
    - >
      Current era: Kimi is offered through web and native applications alongside
      Moonshot AI's API and specialized agent products.
    - >
      2026: Official materials describe an expanded ecosystem including Kimi Work, Kimi
      Code, Kimi Claw, and Agent Swarm.
  usage:
    - >
      Users sign in to Kimi to chat, search the web, reason over uploaded documents and
      media, create content, or delegate multi-step work to an agent.
    - >
      The desktop application provides a native access point to the Kimi service.
      Official documentation does not identify a user-editable configuration or
      credentials file.
