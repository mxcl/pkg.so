history:
  adoption-history:
    - >
      The input package metadata shows Homebrew packaging, which is the natural
      distribution channel for a macOS-specific command-line input-method helper.
  package-nerd-significance:
    - >
      The package is useful to developers and multilingual macOS users who want
      Unix-like, scriptable control over input-method state without depending on the
      Linux fcitx runtime.
  project-history:
    - >
      The official GitHub repository was created in 2015 and describes the project as an
      fcitx-remote simulation for handling OS X input methods from the command line.
  related-projects:
    - >
      fcitx and fcitx-remote provide the Linux input-method behavior that this macOS
      tool emulates.
  sources:
    - Official GitHub repository metadata for xcodebuild/fcitx-remote-for-osx.
    - Official README.
    - input.source_facts.package-manager
  summary:
    - >
      fcitx-remote-for-osx is a macOS command-line utility that simulates fcitx-remote
      behavior for switching or querying input methods.
  timeline:
    - '2015: Official GitHub repository created.'
    - '2023: Repository metadata shows later maintenance activity.'
  usage:
    - >
      Users install the `fcitx-remote` and `fcitx-remote-general` executables to control
      macOS input-method state from scripts, shells, or editor integrations.
