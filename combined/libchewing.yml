history:
  adoption-history:
    - >
      Chewing became a common open-source Zhuyin engine because input framework packages
      could bind to libchewing rather than reimplementing conversion behavior. The
      project README lists active integrations for Windows TSF, PIME, IBus, HIME, Fcitx,
      Fcitx5 macOS, and related front ends, plus older integrations such as SCIM, uim,
      OpenVanilla, and xcin.
  package-nerd-significance:
    - >
      libchewing is a good example of why Unix package ecosystems split engines from
      front ends: the same linguistic data and candidate-selection logic can serve IBus,
      Fcitx, Windows, and other shells. For package maintainers, the interesting part is
      not a command-line tool but the stable shared input-method substrate.
  project-history:
    - >
      The project traces its lineage to the original Chewing input method, an XCIN
      module for X Window System input. The libchewing README identifies Lu-chuan Kung
      and Kang-pen Chen as the original developers, with sponsorship from Tsan-sheng Hsu
      at Academia Sinica between 1999 and 2001.
    - >
      After the original Chewing work stopped, Jim Huang and others formed the Chewing
      core team in 2002. The team separated the engine from XCIN coupling and continued
      the project as New Chewing, while the English project name remained Chewing across
      input-method frameworks.
  related-projects:
    - >
      Related projects include XCIN, IBus-Chewing, Fcitx Chewing integrations, Windows
      TSF Chewing, PIME, HIME, and the older bimsphone input method mentioned in the
      libchewing history.
  sources:
    - https://chewing.im/
    - https://formulae.brew.sh/formula/libchewing
    - https://github.com/chewing/libchewing
  summary:
    - >
      libchewing is the reusable engine behind Chewing, a Traditional Chinese
      intelligent phonetic input method for Zhuyin/Bopomofo users. In package-manager
      terms it is the library layer that lets desktop input frameworks share the same
      phrase-selection and conversion logic instead of each framework embedding its own
      engine.
  timeline:
    - '1999-2001: Original Chewing XCIN module developed with Academia Sinica sponsorship.'
    - '2002: Jim Huang and others formed the Chewing core team and extended the original work.'
    - "2026-04-06: GitHub listed libchewing v0.12.0 among the project's releases."
  usage:
    - >
      Users normally encounter libchewing indirectly through an input-method front end,
      while developers and packagers see it as a C/Rust-buildable library plus tools.
      The package exposes `chewing-cli` in Homebrew and is packaged across Linux
      distributions, BSD-derived ports, Nix, MacPorts, and Homebrew.
category: productivity
