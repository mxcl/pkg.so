id: brew:gtop
display-name: gtop
homepage: https://github.com/aksakalli/gtop
repo: https://github.com/aksakalli/gtop
docs:
  - https://github.com/aksakalli/gtop#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gtop's adoption is typical of JavaScript command-line utilities: it starts as an
      npm global tool but is also packaged by Homebrew, Nix, and Arch according to the
      input package facts. The repository badges point to npm, Snap, and Docker
      distribution surfaces.
  package-nerd-significance:
    - >
      gtop is package-nerd interesting as a Node-based replacement for classic native
      top-like tools. It demonstrates the packaging tradeoff of shipping a convenient
      visual TUI with a JavaScript runtime and dependency tree rather than a small C
      binary.
  project-history:
    - >
      The official repository describes gtop as a system monitoring dashboard for the
      terminal and its package metadata describes it as graphic top. The repository
      package metadata exposes the gtop executable, MIT license, Node engine
      requirement, and npm-oriented installation path.
    - >
      The upstream README documents Linux, macOS, and partial Windows support, global
      npm installation, Docker execution with host net and pid namespaces, and keyboard
      sorting of process rows by PID, CPU, or memory. GitHub release metadata on the
      repository page lists a small release set, with v1.1.5 published in August 2023.
  related-projects:
    - Node.js provides the runtime.
    - blessed and blessed-contrib provide terminal UI building blocks.
    - systeminformation provides system metrics.
    - npm, Snap, Docker, Homebrew, Nix, and Arch are relevant distribution channels.
  sources:
    - https://github.com/aksakalli/gtop
    - https://raw.githubusercontent.com/aksakalli/gtop/master/README.md
    - https://raw.githubusercontent.com/aksakalli/gtop/master/package.json
  summary:
    - >
      gtop is a Node.js terminal system-monitoring dashboard. It packages a visual
      top-like TUI around Node dependencies such as blessed, blessed-contrib, and
      systeminformation.
  timeline:
    - >
      Repository metadata: gtop is published as an MIT-licensed Node package with the
      gtop executable.
    - 'README: npm global installation is the primary documented installation method.'
    - >
      README: Docker usage is documented with host net and pid namespace access for host
      metrics.
    - '2023-08-11: The GitHub repository page lists release v1.1.5.'
  usage:
    - >
      Users start the dashboard with the gtop command, quit with q or Ctrl-C, and sort
      the process table with p, c, or m. The README also recommends LANG and TERM
      settings if terminal glyphs render incorrectly.
related-packages:
  - id: brew:btop
    reason: >
      Choose btop for a native C++ resource monitor with process signaling, filtering,
      mouse support, disk and network graphs, and extensive interactive configuration.
    rel: alternative
    sources:
      - https://github.com/aksakalli/gtop#readme
      - https://github.com/aristocratos/btop
  - id: brew:htop
    reason: >
      Choose htop for a focused ncurses process viewer with broad Unix-platform support
      and a native runtime rather than Node.js.
    rel: alternative
    sources:
      - https://github.com/aksakalli/gtop#readme
      - https://htop.dev/
  - id: brew:glances
    reason: >
      Choose Glances when monitoring also needs a web UI, APIs, containers, alerts, or
      export to external metrics systems.
    rel: alternative
    sources:
      - https://github.com/aksakalli/gtop#readme
      - https://nicolargo.github.io/glances/
category: system
