id: cask:understand
display-name: Understand
homepage: https://scitools.com/features
repo: null
docs:
  - https://docs.scitools.com/manuals/pdf/understand.pdf
  - https://scitools.com/features
config-file-location:
  linux: ~/.config/SciTools/Understand.conf
  macos: ~/Library/Preferences/com.scitools.Understand.plist
  windows: '%APPDATA%\SciTools\Understand.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      Understand is used in workflows that require comprehension of large, unfamiliar,
      or long-lived codebases. Its documented support for dependency analysis, metrics,
      architecture exploration, coding-standard checks, and safety-related development
      makes it particularly relevant to maintenance and regulated engineering work.
  package-nerd-significance:
    - >
      Understand is notable in package-manager culture because Homebrew Cask makes a
      proprietary, GUI-centered analysis suite reproducibly installable alongside
      open-source developer tools. Its separate command-line interface also permits
      scripted analysis and CI-oriented reports.
  project-history:
    - >
      Scientific Toolworks develops Understand as a commercial static-analysis and
      code-comprehension environment. The product builds an indexed project database
      from source code and exposes that information through browsers, graphs, metrics,
      searches, reports, CodeCheck, and APIs.
    - >
      Official documentation preserves release and migration material for multiple major
      product generations, reflecting a mature tool whose project format, analysis
      engine, and automation interfaces have evolved over time.
  related-projects:
    - >
      Understand complements IDE navigation, source browsers, linters, dependency
      visualizers, and static-analysis platforms, but focuses on maintaining a queryable
      semantic database for whole-codebase exploration.
  sources:
    - https://docs.scitools.com/
    - https://docs.scitools.com/help/getting-started/quick-start.html
    - https://docs.scitools.com/help/troubleshooting/reset-settings.html
    - source_facts.description
  summary:
    - >
      Understand is Scientific Toolworks' commercial code-comprehension and
      static-analysis environment for navigating, measuring, visualizing, and checking
      software systems.
  timeline:
    - >
      Understand 6.x–8.x: Official documentation records multiple major release and
      migration generations.
    - >
      2026: Official documentation identifies native per-platform settings files and
      documents GUI, command-line, API, architecture, metrics, and CodeCheck workflows.
  usage:
    - >
      Users create a project from source directories or a Git checkout, run analysis to
      construct an Understand database, and then inspect entities, references,
      dependencies, metrics, architecture diagrams, and coding-standard findings.
    - >
      The `und` command-line interface supports project creation, analysis, CodeCheck,
      metrics, and report generation for local automation or CI.
category: developer-tools
package-manager:
  brew-cask: understand
package-manager-url: https://formulae.brew.sh/cask/understand
tags:
  - code-comprehension
  - code-metrics
  - code-visualization
  - dependency-analysis
  - ide
  - static-analysis
description: Code visualization and exploration tool
applications:
  - Understand.app
provenance:
  cask: understand
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
