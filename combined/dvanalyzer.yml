id: brew:dvanalyzer
display-name: DV Analyzer
homepage: https://mediaarea.net/DVAnalyzer
repo: https://github.com/MediaArea/DVAnalyzer
docs:
  - https://mediaarea.net/DVAnalyzer
  - https://mediaarea.net/DVAnalyzer/Download
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DV Analyzer's adoption sits in the same preservation-tool ecosystem as other
      MediaArea projects such as MediaInfo, MediaConch, QCTools, DVRescue, and BWF
      MetaEdit. It is packaged in Homebrew as a command-line tool because preservation
      pipelines often need repeatable batch checks instead of manual playback.
  package-nerd-significance:
    - >
      For package maintainers, DV Analyzer is notable because it preserves a very
      specific media-forensics niche rather than a broad playback or transcoding feature
      set. It is also a small example of the MediaArea pattern: wrap deep
      container/bitstream knowledge in a repeatable CLI that preservation shops can
      compose with other tools.
  project-history:
    - >
      The upstream changelog records a first official 0.9.0 release on 2009-04-27, based
      on MediaInfo 0.7.15 beta, with STA error detection, timestamp and timecode
      reporting, recording date/time detection, gap detection, and start/end flag
      detection. Version 1.0.0 followed days later on 2009-04-30 with better support for
      large QuickTime MOV files and NULL-padded DIFs.
    - >
      During 2009 and 2010 the tool quickly grew from a DV stream inspector into both
      CLI and GUI-oriented software, adding XML output, Final Cut Pro XML output, table
      views, summaries, and lower memory usage for large files. MediaArea's own product
      metadata later listed version 1.4.2 dated 2017-09-26 and described the application
      as a cross-platform multimedia/video tool.
  related-projects:
    - >
      DV Analyzer is part of the broader MediaArea preservation family, alongside
      MediaInfo for general media metadata, MediaConch for conformance checking, QCTools
      for audiovisual quality analysis, and DVRescue for DV tape-rescue workflows.
  sources:
    - https://mediaarea.net/DVAnalyzer
    - https://github.com/MediaArea/DVAnalyzer
    - https://raw.githubusercontent.com/MediaArea/DVAnalyzer/master/History_CLI.txt
  summary:
    - >
      DV Analyzer is a MediaArea utility for inspecting DV streams, especially the kinds
      of DV files created during tape-to-file preservation workflows. Its history is
      less about mass-market video editing and more about digital preservation: it gives
      archivists and media engineers a focused way to validate timecode, recording
      timestamps, DIF structure, and other DV-specific consistency signals.
  timeline:
    - '2009-04-27: First official 0.9.0 release, based on MediaInfo 0.7.15 beta.'
    - '2009-04-30: Version 1.0.0 added large MOV support and improved NULL-padded DIF handling.'
    - >
      2009-09-01: Version 1.3.0 adapted the source for both CLI and GUI use and added
      XML output.
    - '2010-05-02: Version 1.4.0 reduced memory use and fixed PAL timecode math issues.'
    - '2017-09-26: MediaArea product metadata lists DV Analyzer 1.4.2.'
  usage:
    - >
      Users run the `dvanalyzer` executable against DV essence or DV-in-container files
      to generate quality-control reports about timecode continuity, recording
      timestamps, audio/video structure, and other DV-specific errors. It is useful
      after tape capture, before ingest, or while triaging a collection of legacy DV
      recordings.
related-packages:
  - id: cask:qctools
    reason: >
      Choose QCTools for broad audiovisual signal graphs, analytical playback, and
      visual spot-checking; choose DV Analyzer for DV-specific transfer errors, DIF
      structure, and temporal metadata.
    rel: alternative
    sources:
      - https://mediaarea.net/QCTools
      - https://mediaarea.net/QCTools/Getting_Started
      - https://mediaarea.net/DVAnalyzer
  - id: cask:mediainfo
    reason: >
      Use MediaInfo alongside DV Analyzer to inventory general container, codec, stream,
      and tag metadata before applying DV Analyzer's specialized frame-level DV transfer
      checks.
    rel: adjacent_workflow
    sources:
      - https://mediaarea.net/en/MediaInfo
      - https://mediaarea.net/DVAnalyzer
category: media
