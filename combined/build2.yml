id: brew:build2
display-name: build2
homepage: https://build2.org
repo: https://git.build2.org/cgit/build2-toolchain
docs:
  - https://build2.org/bdep/doc/build2-project-manager-manual.xhtml
  - https://build2.org/bpkg/doc/build2-package-manager-manual.xhtml
  - https://build2.org/build2-toolchain/doc/build2-toolchain-intro.xhtml
  - https://build2.org/build2/doc/build2-build-system-manual.xhtml
  - https://build2.org/doc.xhtml
config-file-location:
  unix:
    - build/config.build
    - .build2/
    - .build2/local/
    - ~/.build2/
    - /etc/build2/
credentials-file-location: null
history:
  adoption-history:
    - >
      build2 has remained a specialist C/C++ toolchain rather than a default ecosystem
      standard like CMake, but its own community page says it is used for real
      development and cites customer-facing software such as ODB and XSD. The project
      also maintains cppget.org as its package repository.
    - >
      It is packaged by Homebrew, Nix, Fedora-style `bdep` packages, and Windows winget
      according to the input. Upstream development happens in self-hosted git
      repositories on git.build2.org with GitHub mirrors for collaboration.
  package-nerd-significance:
    - >
      build2 is significant because it is one of the more complete attempts to give C
      and C++ a Cargo-like combined build, package, and project-management workflow
      without hiding the complexity needed by native-code builds.
    - >
      For package managers, it is also recursive in an interesting way: the build2
      toolchain is used for its own development, and the upstream amalgamation
      repository exists specifically to make source builds and binary packaging of the
      whole toolchain practical.
  project-history:
    - >
      The build2 project started in the mid-2010s with documentation copyright dating
      from 2014 and public toolchain tags beginning at 0.1.0. Its stated goal is to
      approximate Rust Cargo's convenience for C and C++ while keeping enough depth for
      complex real-world build requirements.
    - >
      The toolchain is intentionally hierarchical: `b` is the general-purpose build
      system, `bpkg` handles package consumption, and `bdep` handles project
      development. The `build2-toolchain` repository is an amalgamation used to build
      and package those components together.
  related-projects:
    - Cargo is the explicit convenience benchmark named by the build2 homepage.
    - >
      CMake and Autotools are common neighboring C/C++ build-system incumbents, though
      build2 packages build, dependency, and project management together.
    - cppget.org is the build2 package repository referenced by the project community page.
  sources:
    - https://build2.org
    - https://build2.org/build2-toolchain/doc/build2-toolchain-intro.xhtml
    - https://build2.org/community.xhtml
    - https://git.build2.org/cgit/build2-toolchain/plain/README.md
    - source_facts.package-manager
  summary:
    - >
      build2 is a cross-platform, MIT-licensed C/C++ build toolchain made of a build
      system, package manager, project manager, and supporting libraries.
  timeline:
    - '2014: build2 documentation copyright begins, marking the early public project era.'
    - >
      2010s: Public 0.x toolchain tags began with 0.1.0 and evolved through the pre-1.0
      series.
    - '2018: The project pointed users to a CppCon 2018 presentation as a toolchain overview.'
    - >
      2020s: The community page described build2 as in the final stage of pre-1.0
      development and already used in projects such as ODB and XSD.
    - >
      2026: The Toolchain Introduction metadata showed version 0.18 and copyright
      through 2026.
  usage:
    - >
      Users typically create or initialize projects with `bdep`, build with `b`, and
      consume dependencies with `bpkg`. The documented configuration surface includes
      project-local `build/config.build`, `.build2/` state, `.build2/local/`, user-level
      `~/.build2/`, and system-level `/etc/build2/` locations.
    - >
      The toolchain is aimed primarily at C/C++ and mixed-language projects involving C
      or C++, though the project describes a longer-term universal build-toolchain goal.
related-packages:
  - id: brew:cmake
    reason: >
      CMake is the established cross-platform alternative with a broad generator and
      native-build ecosystem; choose build2 when an integrated build, package, and
      project-management model is more important.
    rel: alternative
    sources:
      - https://build2.org/
      - https://cmake.org/about/
  - id: brew:meson
    reason: >
      Meson is an alternative cross-platform build system emphasizing fast builds and
      approachable definitions, while build2 provides its own tightly integrated package
      and project managers.
    rel: alternative
    sources:
      - https://build2.org/
      - https://mesonbuild.com/
category: developer-tools
package-manager:
  brew: build2
  dnf: bdep
  nix: build2
  winget: build2.build2.MSVC
package-manager-url: https://formulae.brew.sh/formula/build2
license: MIT
tags:
  - build-system
  - c
  - c-plus-plus
  - cli
  - package-manager
  - project-manager
description: C/C++ Build Toolchain
executables:
  - b
  - bdep
  - bpkg
  - bx
provenance:
  formula: build2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
