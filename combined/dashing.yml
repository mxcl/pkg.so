id: brew:dashing
display-name: dashing
homepage: https://github.com/technosophos/dashing
repo: https://github.com/technosophos/dashing
docs:
  - https://github.com/technosophos/dashing#readme
config-file-location:
  unix: ./dashing.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Dashing's official README points users first to Homebrew and MacPorts, with
      prebuilt macOS binaries and Go installation as alternatives. That places it in the
      macOS documentation-tooling niche around Dash docsets rather than in a broad
      language-runtime ecosystem.
  package-nerd-significance:
    - >
      For package maintainers, Dashing is useful because it turns arbitrary upstream
      HTML docs into the SQLite-backed docset format used by Dash and related
      offline-documentation workflows.
  project-history:
    - >
      The public GitHub release record starts with version 0.0.1 in July 2015, followed
      by 0.2.0 and 0.3.0 later that year and a maintenance update in 2019 for Go 1.13.
      Its README describes the project as a maintenance-stage tool that maps HTML with
      CSS selectors into a complete Dash docset.
  related-projects:
    - >
      Dash defines the docset format Dashing targets; Homebrew and MacPorts are
      documented installation paths.
  sources:
    - https://github.com/technosophos/dashing#readme
    - https://github.com/technosophos/dashing/releases/tag/0.0.1
    - https://github.com/technosophos/dashing/releases/tag/0.2.0
    - https://github.com/technosophos/dashing/releases/tag/0.4.0
  summary:
    - >
      Dashing is a Go command-line generator for Dash-compatible docsets from existing
      HTML documentation.
  timeline:
    - '2015: Initial 0.0.1 public release.'
    - '2015: 0.2.0 added regular expression support.'
    - '2019: 0.4.0 maintenance release updated the build to Go 1.13.'
  usage:
    - >
      A typical workflow is to run `dashing create` in an HTML documentation directory,
      edit `dashing.json`, and then build a `.docset` bundle for Dash.
related-packages:
  - id: brew:dasht
    reason: >
      Dashing creates Dash-compatible docsets, and dasht provides terminal and
      local-browser commands for installing, managing, and searching those docsets.
    rel: adjacent_workflow
    sources:
      - https://github.com/technosophos/dashing#readme
      - https://sunaku.github.io/dasht/man/man0/README.html
category: developer-tools
package-manager:
  brew: dashing
  macports: dashing
  nix: dashing
package-manager-url: https://formulae.brew.sh/formula/dashing
license: MIT
tags:
  - cli
  - dash-docsets
  - docset
  - documentation-generator
  - html
description: Generate Dash documentation from HTML files
executables:
  - dashing
provenance:
  formula: dashing
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
