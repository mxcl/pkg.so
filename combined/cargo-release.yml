id: brew:cargo-release
display-name: cargo-release
homepage: https://github.com/crate-ci/cargo-release
repo: https://github.com/crate-ci/cargo-release
docs:
  - https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
  - https://github.com/crate-ci/cargo-release#readme
config-file-location:
  linux: ~/.config/cargo-release/release.toml
  macos: ~/Library/Application Support/cargo-release/release.toml
  unix:
    - $CRATE/Cargo.toml ([package.metadata.release])
    - $CRATE/release.toml
    - $WORKSPACE/Cargo.toml ([workspace.metadata.release])
    - $WORKSPACE/release.toml
    - ~/.release.toml
  windows: '%FOLDERID_RoamingAppData%/cargo-release/release.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool has long-running crates.io distribution, with 146 versions reported by
      the crates.io API and v1.1.2 current in 2026. Batch package facts list it in
      Homebrew, Alpine, Nix, and Arch, indicating use outside direct cargo install
      workflows.
  package-nerd-significance:
    - >
      It matters to Rust package maintainers because crate releases are multi-step and
      easy to get subtly wrong; cargo-release centralizes version policy, workspace
      dependency updates, publishing, and git tagging in a reproducible Cargo-native
      workflow.
  project-history:
    - >
      The crate was first published on crates.io in March 2016, the same month the
      GitHub repository was created. Its README frames the tool as an extension of cargo
      publish with release-management defaults, while the reference documents a
      step-based CLI and configuration model.
  related-projects:
    - >
      README lists related release tools including release-pr Action,
      cargo-smart-release, cargo-set-version, cargo-unleash, release-plz, and
      cargo-workspaces.
    - cargo publish and git are prerequisites or delegated tools in the documented workflow.
  sources:
    - https://api.github.com/repos/crate-ci/cargo-release
    - https://github.com/crate-ci/cargo-release
    - https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
    - https://github.com/crate-ci/cargo-release#readme
    - https://crates.io/api/v1/crates/cargo-release
    - https://formulae.brew.sh/api/formula/cargo-release.json
  summary:
    - >
      cargo-release is a Cargo subcommand that wraps common Rust crate release tasks
      such as validation, version bumps, changelog replacements, publishing, tagging,
      and pushing.
  timeline:
    - '2016: First crates.io release and GitHub repository creation.'
    - '2025: v0.25.x releases continued before the 1.x line.'
    - '2026: crates.io and GitHub releases reported v1.1.2 as current.'
  usage:
    - >
      The default mode is a dry run: users run cargo release [level] to preview changes
      and add --execute to perform the release. The reference lists steps for changes,
      version, replace, hook, commit, publish, owner, tag, push, and config.
related-packages: []
category: developer-tools
package-manager:
  apk: cargo-release
  brew: cargo-release
  nix: cargo-release
  pacman: cargo-release
package-manager-url: https://formulae.brew.sh/formula/cargo-release
license: Apache-2.0 OR MIT
tags:
  - cargo
  - cli
  - publishing
  - release-automation
  - release-management
  - rust
  - versioning
description: 'Cargo subcommand release: everything about releasing a rust crate'
executables:
  - cargo-release
provenance:
  formula: cargo-release
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
