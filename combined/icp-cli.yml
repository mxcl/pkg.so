id: brew:icp-cli
display-name: icp-cli
homepage: https://dfinity.github.io/icp-cli/
repo: https://github.com/dfinity/icp-cli
docs:
  - https://github.com/dfinity/icp-cli/blob/main/docs/reference/configuration.md
  - https://github.com/dfinity/icp-cli/tree/main/docs
  - https://cli.internetcomputer.org/
config-file-location:
  unix: icp.yaml
  windows: icp.yaml
credentials-file-location:
  linux: ~/.local/share/icp-cli/identity/keys/<name>.pem
  macos: ~/Library/Application Support/org.dfinity.icp-cli/identity/keys/<name>.pem
  windows: '%APPDATA%\icp-cli\data\identity\keys\<name>.pem'
history:
  adoption-history:
    - >
      The README and installation guide put npm at the center of the quick-start path,
      installing @icp-sdk/icp-cli together with @icp-sdk/ic-wasm. The npm registry
      records @icp-sdk/icp-cli creation on 2026-01-30.
    - >
      Homebrew packaging followed as another supported route for macOS and Linux. The
      first official release announcement explicitly asked users to help the
      repositories reach Homebrew's star threshold, and the formula later packages
      icp-cli with ic-wasm and OpenSSL.
  package-nerd-significance:
    - >
      icp-cli is significant because it represents a blockchain/platform SDK moving from
      an older established command, dfx, toward a new command named icp with modern
      packaging through npm, shell installers, release artifacts, and Homebrew.
    - >
      It is also a useful case study in packaging a Rust-based developer tool that
      depends on a companion WebAssembly optimizer and supports multiple installation
      ecosystems from the beginning.
  project-history:
    - >
      DFINITY announced the public icp-cli repository on 2025-10-31, describing the tool
      as under active development and intended to eventually replace dfx while
      coexisting with it for some time because the tools work differently.
    - >
      The first official release announcement for v0.1.0 appeared on 2026-02-04 after
      beta testing and community feedback. By the v1.0.0 GitHub release on 2026-06-15,
      the project distributed signed release artifacts for macOS, Linux, and Windows.
  related-projects:
    - >
      Related projects include dfx, ic-wasm, icp-cli-recipes, Motoko tooling, Mops, Rust
      canister workflows, Candid tooling, and the wider Internet Computer SDK
      documentation.
  sources:
    - >
      DFINITY forum announcements document repository publication, first official
      release, beta feedback, npm installation, Homebrew motivation, and the dfx
      relationship.
    - >
      The GitHub README and docs describe purpose, installation, dfx migration,
      examples, and documentation structure.
    - >
      npm, GitHub releases, and Homebrew metadata document package publication and
      distribution channels.
  summary:
    - >
      icp-cli is DFINITY's command-line tool for building and deploying applications,
      called canisters, on the Internet Computer.
  timeline:
    - '2025-10-31: DFINITY announces that the icp-cli repository is public.'
    - '2026-01-30: @icp-sdk/icp-cli package is created on npm.'
    - '2026-02-04: icp-cli v0.1.0 is announced as the first official release.'
    - '2026-06-15: GitHub release v1.0.0 publishes multi-platform install artifacts.'
    - '2026: Homebrew formula packages icp-cli with ic-wasm and OpenSSL.'
  usage:
    - >
      icp-cli is used to initialize, build, deploy, and operate Internet Computer
      canisters. Its docs pair the core CLI with ic-wasm for WebAssembly optimization
      and with Motoko or Rust toolchains depending on the project.
    - >
      The configuration surface centers on icp.yaml, matching the curated config-file
      location for both Unix-like systems and Windows.
related-packages:
  - id: brew:ic-wasm
    reason: >
      Install ic-wasm with icp-cli to optimize and annotate Internet Computer canister
      WebAssembly; the official quick start marks it as required.
    rel: adjacent_workflow
    sources:
      - https://github.com/dfinity/icp-cli#quick-start
      - https://github.com/dfinity/ic-wasm#readme
category: developer-tools
package-manager:
  brew: icp-cli
package-manager-url: https://formulae.brew.sh/formula/icp-cli
license: Apache-2.0
tags:
  - canisters
  - cli
  - deployment
  - developer-tools
  - internet-computer
  - webassembly
description: Development tool for building and deploying canisters on ICP
executables:
  - icp
provenance:
  formula: icp-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
