id: brew:ghr
display-name: ghr
homepage: https://github.com/tcnksm/ghr
repo: https://github.com/tcnksm/ghr
docs:
  - https://github.com/tcnksm/ghr#readme
  - https://pkg.go.dev/github.com/tcnksm/ghr
config-file-location:
  unix:
    - <repository>/.git/config
    - ~/.gitconfig
credentials-file-location:
  unix: ~/.gitconfig
history:
  adoption-history:
    - >
      ghr became useful in the era when projects began publishing multi-platform
      binaries as GitHub Release assets. The README's demo centers on cross-compiled Go
      binaries, and the documented Action support shows how the same tool moved into
      CI-based release pipelines.
  package-nerd-significance:
    - >
      Package nerds care about ghr because it is release plumbing: it turns build output
      into a GitHub Release page with assets, which downstream package managers and
      install scripts often consume.
  project-history:
    - >
      The ghr repository was created in July 2014, with an initial v0.1.0 release
      published days later. Its README presents a Go-oriented release workflow: build
      artifacts, tag a release, and use `ghr TAG PATH` to create a GitHub Release and
      upload the files.
    - >
      The tool developed around the practical needs of release automation: reading
      repository information from `.git/config`, accepting `GITHUB_TOKEN`, supporting
      GitHub Enterprise through `GITHUB_API`, replacing or recreating assets, marking
      draft or prerelease releases, and later exposing a GitHub Action wrapper for
      workflow files.
  related-projects:
    - >
      The README compares ghr with aktau/github-release and connects it to GitHub
      Releases, GitHub Enterprise, GitHub Actions, Go cross-compilation, checksums, and
      CI build artifacts.
  sources:
    - https://api.github.com/repos/tcnksm/ghr
    - https://github.com/tcnksm/ghr
    - https://github.com/tcnksm/ghr#readme
    - https://github.com/tcnksm/ghr/releases/tag/v0.1.0
    - https://pkg.go.dev/github.com/tcnksm/ghr
  summary:
    - >
      ghr is a release-engineering CLI for creating GitHub Releases and uploading
      release artifacts in parallel.
  timeline:
    - '2014: GitHub repository created.'
    - '2014: v0.1.0 initial release published.'
    - >
      2021: GitHub automatic release notes support arrived in GitHub, and ghr later
      documented a `-generatenotes` flag.
    - '2020s: README documents a reusable GitHub Action interface.'
  usage:
    - >
      Practitioners use ghr after a build job has produced a directory of archives,
      checksums, installers, or other assets. A typical run supplies a tag and path,
      with optional title, body, commitish, draft, prerelease, replace, delete,
      generated notes, and parallel upload settings.
related-packages:
  - id: brew:github-release
    reason: >
      Choose github-release when you want explicit create, edit, inspect, upload, and
      delete subcommands; ghr offers a simpler tag-and-directory workflow with parallel
      uploads.
    rel: alternative
    sources:
      - https://github.com/tcnksm/ghr#readme
      - https://github.com/github-release/github-release#readme
  - id: brew:gh
    reason: >
      Choose GitHub CLI for a first-party, actively developed interface that manages
      releases alongside authentication and other GitHub workflows.
    rel: alternative
    sources:
      - https://github.com/tcnksm/ghr#readme
      - https://cli.github.com/manual/gh_release
      - https://cli.github.com/manual/gh_release_create
category: developer-tools
package-manager:
  brew: ghr
  nix: ghr
  winget: cataggar.ghr
package-manager-url: https://formulae.brew.sh/formula/ghr
license: MIT
tags:
  - artifact-upload
  - cli
  - github-actions
  - github-releases
  - release-management
description: Upload multiple artifacts to GitHub Release in parallel
executables:
  - ghr
provenance:
  formula: ghr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
