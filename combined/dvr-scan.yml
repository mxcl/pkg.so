id: brew:dvr-scan
display-name: DVR-Scan
homepage: https://www.dvr-scan.com/
repo: https://github.com/Breakthrough/DVR-Scan
docs:
  - https://www.dvr-scan.com/docs
config-file-location:
  linux: ~/.config/DVR-Scan/dvr-scan.cfg
  macos: ~/Library/Preferences/DVR-Scan/dvr-scan.cfg
  windows: C:/Users/%USERNAME%/AppData/Local/DVR-Scan/dvr-scan.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      DVR-Scan's adoption is niche and task-driven: users install it when they need to
      extract useful segments from long camera footage without reviewing the whole file
      manually. The input metadata lists Homebrew and Nix packages, while the official
      site provides cross-platform Windows, Linux, and Mac positioning.
    - >
      Its package-manager value comes from bundling a repeatable computer-vision
      workflow behind a small CLI, so surveillance, dashcam, and archival video jobs can
      be scripted.
  package-nerd-significance:
    - >
      DVR-Scan is package-nerd interesting because it exposes OpenCV-style motion
      detection as an installable end-user command instead of asking users to write a
      computer-vision script. It also demonstrates a common packaging challenge: media
      tools often sit on top of heavy native dependencies such as OpenCV and ffmpeg but
      still need to feel like one simple command.
  project-history:
    - >
      The GitHub repository was created on 31 December 2016, and GitHub release metadata
      records DVR-Scan 1.0 in January 2017. The official site identifies Brandon
      Castellano as the copyright holder and presents DVR-Scan as BSD-licensed software.
    - >
      The project has expanded from a CLI-focused utility into a tool with both the
      dvr-scan command and dvr-scan-app UI. Its documentation now covers region editing,
      motion thresholds, background subtractors, ffmpeg output, OpenCV output, overlays,
      logs, and config-file settings.
  related-projects:
    - OpenCV is related because DVR-Scan uses background subtraction and video processing.
    - ffmpeg is related because DVR-Scan can use it to extract detected motion events.
    - >
      PySceneDetect is adjacent in the author's video-analysis ecosystem and shares the
      general task area of automated video segmentation.
  sources:
    - https://www.dvr-scan.com/
    - https://www.dvr-scan.com/docs
    - https://api.github.com/repos/Breakthrough/DVR-Scan
    - https://api.github.com/repos/Breakthrough/DVR-Scan/releases
  summary:
    - >
      DVR-Scan is a free, open-source command-line and GUI application for finding
      motion events in video files, especially security-camera and DVR footage, and
      saving those events as separate clips.
  timeline:
    - '2016: The official GitHub repository is created.'
    - '2017: GitHub release metadata records DVR-Scan 1.0.'
    - '2026: The official site lists DVR-Scan 1.8.2 in January 2026.'
  usage:
    - >
      Typical CLI usage starts with dvr-scan -i video.mp4 to scan an input and write
      separate motion-event clips. The docs also show region-of-interest scanning,
      bounding boxes around detected motion, ffmpeg extraction, multiple input files,
      and scan-only modes.
    - >
      Most options can be set in dvr-scan.cfg, and the official docs specify the default
      config locations on Windows, Linux, and macOS.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Use FFmpeg alongside DVR-Scan for its documented re-encoding or stream-copy output
      modes, or to concatenate compatible inputs before scanning.
    rel: adjacent_workflow
    sources:
      - https://www.dvr-scan.com/docs/
      - https://ffmpeg.org/documentation.html
category: media
package-manager:
  brew: dvr-scan
  nix: dvr-scan
package-manager-url: https://formulae.brew.sh/formula/dvr-scan
license: BSD-2-Clause
tags:
  - cli
  - motion-detection
  - scene-extraction
  - surveillance
  - video
description: Extract scenes with motion from videos
executables:
  - dvr-scan
  - dvr-scan-app
provenance:
  formula: dvr-scan
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
