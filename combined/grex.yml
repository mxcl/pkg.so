id: brew:grex
display-name: grex
homepage: https://pemistahl.github.io/grex-js/
repo: https://github.com/pemistahl/grex
docs:
  - https://github.com/pemistahl/grex#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      grex reached package-manager users through the Rust ecosystem first, with
      crates.io as the upstream registry path, and through binary/package managers such
      as Homebrew, MacPorts, Scoop, Chocolatey, Huber, Nix, Arch, and openSUSE as
      reflected by the README and batch package facts. Its packaging surface is broad
      because it is a single CLI binary but also a reusable library.
  package-nerd-significance:
    - >
      grex is package-nerd significant because it packages an algorithmic helper for one
      of the most common developer annoyances: turning examples into a regular
      expression. It is also a Rust CLI case study, distributed as source through cargo
      and as prebuilt binaries or package-manager formulas for users who do not want a
      Rust toolchain.
    - >
      Its relationship to regexgen also makes it a small example of ecosystem migration:
      a JavaScript idea revived as a Rust CLI and library, then exposed through
      additional language bindings.
  project-history:
    - >
      The README states that grex began as a Rust port of Devon Govett's JavaScript
      regexgen project after regexgen development had apparently ceased. Peter M.
      Stahl's project kept the regex-generation idea but used Rust's strengths for
      command-line tooling and expanded the feature set beyond the original port.
    - >
      Official GitHub releases show public versioned releases starting with v0.1.0 on
      2019-10-06, followed by v1.0.0 on 2020-02-02. Later releases added and refined
      library, CLI, Unicode, packaging, and binding surfaces, while the README presents
      grex as both a command-line executable and a Rust crate with Python bindings.
  related-projects:
    - regexgen is the JavaScript project that grex began by porting.
    - Rust's regex crate is a stated compatibility target for generated expressions.
    - >
      grex-js is the related JavaScript/WebAssembly demo and library surface linked from
      the repository.
    - >
      crates.io, PyPI, Homebrew, MacPorts, Scoop, Chocolatey, and Huber are distribution
      surfaces named by upstream or batch package facts.
  sources:
    - https://api.github.com/repos/pemistahl/grex/releases?per_page=100
    - https://crates.io/crates/grex
    - https://github.com/pemistahl/grex
    - https://raw.githubusercontent.com/pemistahl/grex/main/README.md
  summary:
    - >
      grex is a Rust command-line tool and library that generates regular expressions
      from user-provided test cases. It belongs to the developer-tooling tradition
      around regex synthesis: not replacing regex knowledge, but giving users a correct
      starting expression that can be inspected and refined.
  timeline:
    - '2019: v0.1.0 published in the official GitHub release feed.'
    - '2020: v1.0.0 published after several 0.x releases.'
    - '2021: v1.2.0 and v1.3.0 releases continued the 1.x line.'
    - '2022: v1.4.0 and v1.4.1 releases appeared.'
    - '2024: v1.4.5 published in the official GitHub release feed.'
    - '2025: v1.4.6 published with release assets for several operating-system and CPU targets.'
  usage:
    - >
      Users pass examples directly on the command line, from a file, or through a Unix
      pipeline. By default grex generates a specific expression that matches the
      supplied test cases; flags can generalize output by converting digits, whitespace,
      word characters, repeated substrings, anchors, groups, escaping, case sensitivity,
      verbosity, and colorized display.
    - >
      The README cautions that generated expressions still need human understanding.
      That caveat is part of the tool's identity: grex is best used to bootstrap or
      audit a regex, not to remove the need to understand the target language and
      engine.
related-packages: []
category: developer-tools
package-manager:
  brew: grex
  macports: grex
  nix: grex
  pacman: grex
  scoop: main/grex
  zypper: grex
package-manager-url: https://formulae.brew.sh/formula/grex
license: Apache-2.0
tags:
  - cli
  - code-generation
  - regex
  - regular-expressions
  - rust
description: Command-line tool for generating regular expressions
executables:
  - grex
provenance:
  formula: grex
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
