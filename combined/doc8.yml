id: brew:doc8
display-name: doc8
homepage: https://github.com/PyCQA/doc8
repo: https://github.com/PyCQA/doc8
docs:
  - https://doc8.readthedocs.io/
config-file-location:
  unix:
    - ./doc8.ini
    - ./.config/doc8.ini
    - ./tox.ini
    - ./pep8.ini
    - ./setup.cfg
    - ./pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption has been strongest in Python projects that already use Sphinx, tox,
      setup.cfg, pyproject.toml, or pre-commit style workflows.
    - >
      The tool is distributed primarily through PyPI, with Homebrew packaging providing
      a convenient CLI install path for macOS and Linux users.
  package-nerd-significance:
    - >
      doc8 is a tidy example of documentation linting becoming a normal part of CI,
      parallel to how flake8, ruff, and other Python linters treat source code.
    - >
      Its PyCQA home matters: it signals that documentation quality tooling belongs in
      the same maintenance culture as code quality tooling.
  project-history:
    - >
      doc8 appeared on PyPI in 2014 and was associated with OpenStack documentation
      tooling before moving into the PyCQA organization in 2019.
    - >
      The project now lives under PyCQA, which fits its role as a Python
      code-quality-adjacent checker for documentation repositories.
  related-projects:
    - >
      Related projects include Sphinx, docutils, reStructuredText linters, pydocstyle,
      rstcheck, and PyCQA's broader family of Python quality tools.
    - OpenStack documentation tooling is part of doc8's historical context.
  sources:
    - https://pypi.org/project/doc8/
    - https://pypi.org/project/doc8/0.3.5/
    - https://github.com/PyCQA/doc8
    - https://github.com/PyCQA/doc8/releases
    - https://wiki.openstack.org/wiki/Infrastructure_Status
    - https://doc8.readthedocs.io/
  summary:
    - >
      doc8 is an opinionated reStructuredText and plain-text documentation style
      checker, historically useful for Sphinx-heavy Python documentation projects.
    - >
      It is a small tool, but it occupies a recognizable niche: applying lint-style
      feedback to docs instead of code.
  timeline:
    - "2014: doc8's early 0.1 and 0.3.x releases appeared on PyPI."
    - >
      2019: OpenStack infrastructure status notes that openstack/doc8 on GitHub was
      transferred to the PyCQA organization.
    - '2022: doc8 1.0.0 marked a stable major release under the PyCQA repository.'
    - >
      2025: doc8 2.0.0 raised the Python baseline and refreshed project metadata and
      build pipelines.
  usage:
    - >
      doc8 checks documentation trees for simple style requirements, supports common
      config files, and can be run from the command line or called programmatically.
    - >
      Projects use it to catch line length, formatting, and reStructuredText issues
      before docs are built or published.
related-packages:
  - id: brew:sphinx-doc
    reason: >
      Use doc8 to lint reStructuredText sources before Sphinx builds them; doc8
      explicitly handles Sphinx-specific false positives and is intended for Sphinx
      documentation projects.
    rel: adjacent_workflow
    sources:
      - https://github.com/PyCQA/doc8
      - https://www.sphinx-doc.org/en/master/
category: developer-tools
package-manager:
  brew: doc8
package-manager-url: https://formulae.brew.sh/formula/doc8
license: Apache-2.0
tags:
  - cli
  - documentation
  - linter
  - restructuredtext
  - rst
  - sphinx
description: Style checker for Sphinx documentation
executables:
  - doc8
provenance:
  formula: doc8
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
