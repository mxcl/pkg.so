id: brew:ncspot
display-name: ncspot
homepage: https://github.com/hrkfdn/ncspot
repo: https://github.com/hrkfdn/ncspot
docs:
  - https://github.com/hrkfdn/ncspot#readme
config-file-location:
  unix: <platform standard configuration directory>/ncspot/config.toml
credentials-file-location:
  unix: <user cache directory>/librespot/credentials.json
history:
  adoption-history:
    - >
      ncspot spread through the Rust and terminal-user ecosystem rather than through
      Spotify itself. The README documents packaging for macOS via Homebrew, Windows via
      Scoop and WinGet, Linux via native packages, Flathub and Snapcraft, and BSD
      systems. The GitHub project also shows thousands of stars, which fits its role as
      a polished terminal-native client for a mainstream music service.
  package-nerd-significance:
    - >
      ncspot is a neat modern example of a TUI app that combines old terminal UI
      conventions with Rust packaging and a reverse-engineered/open Spotify playback
      stack. For package managers it is a single binary, but one that depends on the
      moving Spotify/librespot ecosystem and platform audio backends.
  project-history:
    - >
      The crate history shows ncspot 0.0.0 published on March 4, 2019, followed by 0.1.0
      on November 6, 2019. The project reached 1.0.0 on December 16, 2023 and continued
      with regular 1.x releases through 2026.
  related-projects:
    - librespot, ncurses, ncmpc, MPD clients, Spotify, Rust
  sources:
    - https://docs.rs/crate/ncspot/0.0.0
    - https://flathub.org/en/apps/io.github.hrkfdn.ncspot
    - https://formulae.brew.sh/formula/ncspot
    - https://github.com/hrkfdn/ncspot
  summary:
    - >
      ncspot is a Rust terminal Spotify client built with ncurses and librespot. Its
      upstream README frames it as a simple, resource-friendly alternative to the
      official Spotify client, inspired by ncurses MPD clients such as ncmpc, with a
      special appeal on platforms where Spotify does not ship a native client.
  timeline:
    - 'March 4, 2019: ncspot 0.0.0 appears in the Rust crate/docs release history.'
    - 'November 6, 2019: ncspot 0.1.0 released.'
    - 'December 16, 2023: ncspot 1.0.0 released.'
    - 'May 22, 2026: docs.rs lists ncspot 1.3.4.'
  usage:
    - >
      Users install ncspot to search, browse, queue, and play Spotify tracks from a
      terminal, often with Vim-like keybindings and a small resource footprint. The
      practical gotcha is account support: upstream says ncspot requires Spotify Premium
      because it uses features unavailable to free accounts.
related-packages:
  - id: brew:spotify_player
    reason: >
      Choose spotify-player for a more feature-rich terminal Spotify client with Spotify
      Connect control, daemon and scripting modes, visualization, lyrics, and
      configurable direct streaming.
    rel: alternative
    sources:
      - https://github.com/hrkfdn/ncspot
      - https://github.com/aome510/spotify-player
category: media
package-manager:
  apk: ncspot
  brew: ncspot
  nix: ncspot
  pacman: ncspot
  scoop: main/ncspot
  winget: hrkfdn.ncspot
  zypper: ncspot
package-manager-url: https://formulae.brew.sh/formula/ncspot
license: BSD-2-Clause
tags:
  - cli
  - music
  - ncurses
  - rust
  - spotify
  - terminal-ui
description: Cross-platform ncurses Spotify client written in Rust
executables:
  - ncspot
provenance:
  formula: ncspot
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
