id: brew:abcm2ps
display-name: abcm2ps
homepage: http://moinejf.free.fr
repo: https://chiselapp.com/user/moinejf/repository/abcm2ps
docs:
  - http://moinejf.free.fr/abcm2ps-doc
  - https://chiselapp.com/user/moinejf/repository/abcm2ps/doc/trunk/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      abcm2ps is part of the ABC notation tool ecosystem and is packaged by Homebrew,
      Debian, Fedora, MacPorts, Nix, Ubuntu, and zypper according to the supplied
      package-manager metadata. The official README now marks it end-of-life and points
      users toward abc2svg as its successor.
  package-nerd-significance:
    - >
      abcm2ps is package-nerd significant because it represents a durable niche Unix
      converter: small C source, ABC notation input, PostScript/SVG output, optional
      Pango support, manual-page documentation, and a successor project that affects
      long-term maintenance expectations.
  project-history:
    - >
      The official repository README says abcm2ps was first developed to print Baroque
      organ scores with independent voices played on one or many keyboards and a
      pedal-board, with the m standing for many or multi staves/voices. It later evolved
      to render more music types.
  related-projects:
    - >
      abcm2ps is based on abc2ps and is succeeded by abc2svg. It belongs to the wider
      ABC notation ecosystem documented by abcnotation.com.
  sources:
    - >
      Official author page, documentation index, Chisel README, Chisel timeline/tag
      list, and source_facts.package-manager.
  summary:
    - >
      abcm2ps is a C command-line program that converts ABC music notation into
      PostScript or SVG sheet music. The official README describes it as an extension of
      Michael Methfessel's abc2ps with support for many voices per staff.
  timeline:
    - '2013: Official docs state the feature set is based on ABC draft 2.2 from February 2013.'
    - '2025: Official Chisel timeline shows v8.14.15 through v8.14.17 releases.'
    - '2026: Official Chisel timeline shows v8.14.18 release.'
  usage:
    - >
      Official documentation shows usage as abcm2ps [options] file1 [file1_options]
      file2 [file2_options] ..., producing PostScript by default and SVG through
      documented options. Formatting can be controlled through command-line options,
      format files, and ABC source directives.
related-packages:
  - id: brew:abcmidi
    reason: >
      Use abcMIDI alongside abcm2ps when the same ABC sources also need MIDI playback,
      reverse MIDI conversion, transposition, or MIDI inspection rather than only
      engraved PostScript or SVG output.
    rel: adjacent_workflow
    sources:
      - https://ifdo.ca/~seymour/runabc/
      - https://github.com/sshlien/abcmidi
      - https://chiselapp.com/user/moinejf/repository/abcm2ps/doc/trunk/README.md
