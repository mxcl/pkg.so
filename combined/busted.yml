id: brew:busted
display-name: busted
homepage: https://lunarmodules.github.io/busted/
repo: https://github.com/lunarmodules/busted
docs:
  - https://lunarmodules.github.io/busted
config-file-location:
  unix: .busted
credentials-file-location: null
history:
  adoption-history:
    - >
      busted's adoption comes from being the natural test runner for many LuaRocks
      projects and from easy invocation in CI. The input metadata records Homebrew and
      Arch packaging, while the upstream README documents LuaRocks installation, Docker
      usage, and a GitHub Action for running busted in workflows.
  package-nerd-significance:
    - >
      busted is significant because it helped give Lua projects a conventional,
      packageable test workflow comparable to RSpec, Jasmine, or Mocha in other
      ecosystems. For package maintainers, it is also the test command that turns many
      Lua modules from 'installs successfully' into 'can actually be verified during
      packaging'.
  project-history:
    - >
      The current repository was created in August 2012, and the project documentation
      and license history show its Olivine Labs origin before the repository later lived
      under LunarModules. The README describes a framework focused on easy-to-read
      specs, nested `describe` and `it` blocks, chainable assertions, tags, mocks,
      spies, and support for Lua 5.1+, LuaJIT, and MoonScript.
    - >
      The official docs list version 2.1.1 and present busted as both a command-line
      runner and a library of testing conventions. The rockspec documents its LuaRocks
      packaging, MIT license, CLI installation, and dependencies including luassert,
      say, lua_cliargs, Penlight, dkjson, and related Lua modules.
  related-projects:
    - >
      busted is closely related to Lua, LuaJIT, LuaRocks, luassert, say, lua_cliargs,
      Penlight, MoonScript, luacov, TAP/JUnit output consumers, and spec-style test
      frameworks such as RSpec, Jasmine, and Mocha.
  sources:
    - https://github.com/lunarmodules/busted
    - https://lunarmodules.github.io/busted
    - https://raw.githubusercontent.com/lunarmodules/busted/master/README.md
    - https://raw.githubusercontent.com/lunarmodules/busted/master/busted-scm-1.rockspec
    - source_facts.package-manager
  summary:
    - >
      busted is a Lua unit testing framework with a behavior/spec style, expressive
      assertions, spies, mocks, multiple output formats, and LuaRocks-first
      distribution. It is one of the familiar testing tools in the Lua and LuaJIT
      package ecosystem.
  timeline:
    - '2012: Public repository created; copyright history begins with Olivine Labs.'
    - '2010s: busted became established as a LuaRocks-distributed Lua testing framework.'
    - >
      2020: README copyright range still referenced Olivine Labs before later
      LunarModules stewardship.
    - >
      2026: The LunarModules repository and docs remain active, with Homebrew and Arch
      package metadata present in the input.
  usage:
    - >
      Typical usage is to write Lua specs with `describe` and `it`, use `assert` helpers
      from luassert, optionally add mocks or spies, then run the `busted` CLI over a
      file or test directory. Output handlers include terminal, JSON, TAP, JUnit, and
      other CI-friendly formats.
related-packages:
  - id: brew:luarocks
    reason: >
      LuaRocks is busted's documented installation and development mechanism, installing
      the framework and resolving its Lua dependencies.
    rel: adjacent_workflow
    sources:
      - https://lunarmodules.github.io/busted/#usage
      - https://luarocks.org/docs
category: developer-tools
package-manager:
  brew: busted
  pacman: busted
package-manager-url: https://formulae.brew.sh/formula/busted
license: MIT
tags:
  - assertions
  - cli
  - lua
  - mocks
  - testing
  - unit-testing
description: Elegant Lua unit testing
executables:
  - busted
provenance:
  formula: busted
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
