id: brew:lcov
display-name: LCOV
homepage: https://github.com/linux-test-project/lcov
repo: https://github.com/linux-test-project/lcov
docs:
  - https://github.com/linux-test-project/lcov#readme
  - https://github.com/linux-test-project/lcov/tree/master/man
config-file-location:
  unix:
    - /etc/lcovrc
    - ~/.lcovrc
credentials-file-location: null
history:
  adoption-history:
    - >
      LCOV became a common package in Unix developer toolchains because it gives C and
      C++ projects a simple path from compiler coverage flags to browsable HTML reports.
      It is packaged across Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, MacPorts,
      Chocolatey, Alpine, and openSUSE-style ecosystems.
    - >
      Its adoption also comes from CI and kernel-development workflows: coverage reports
      are easy to publish as artifacts, and LCOV trace files can be merged, filtered,
      and compared across test runs.
  package-nerd-significance:
    - >
      LCOV matters to package nerds because it is one of the standard lingua franca
      formats and toolsets for coverage artifacts. Many packages, CI recipes, and
      dashboards understand LCOV trace files or HTML output even when the project itself
      uses a different compiler or language.
    - >
      It is also a classic example of a packaging-friendly developer tool: script-based,
      manpage documented, configurable via system and user rc files, and useful both in
      local shells and noninteractive build farms.
  project-history:
    - >
      The LCOV README describes the project as a tool for manipulating and displaying
      what parts of a program were covered during tests. It began as a front end around
      GCC `gcov` output and was initially designed to support Linux kernel coverage
      measurements, while also working for ordinary user-space programs.
    - >
      Over time LCOV expanded beyond GCC `gcov` text data. The README lists converters
      and support for coverage sources such as LLVM `llvm-cov`, Python Coverage.py,
      Cobertura-like XML, Perl Devel::Cover, and Jacoco-style workflows, along with
      differential coverage, date binning, owner binning, and spreadsheet/reporting
      support.
  related-projects:
    - >
      Related projects and formats include GCC `gcov`, LLVM `llvm-cov`, Linux Test
      Project, Coverage.py, Cobertura XML, Perl Devel::Cover, Jacoco, gcovr, CI coverage
      artifact publishing, and kernel coverage tooling.
  sources:
    - https://api.github.com/repos/linux-test-project/lcov/releases?per_page=20
    - https://github.com/linux-test-project/lcov
    - https://github.com/linux-test-project/lcov/tree/master/man
    - https://raw.githubusercontent.com/linux-test-project/lcov/master/README.rst
    - https://www.kernel.org/doc/html/v6.0/dev-tools/gcov.html
  summary:
    - >
      LCOV is the Linux Test Project GCOV extension: a suite of Perl-oriented
      command-line tools that collect, transform, merge, filter, and render code
      coverage data, most famously as navigable HTML reports generated by `genhtml`.
  timeline:
    - >
      2000s: LCOV originated in the Linux Test Project as a GCOV extension for kernel
      coverage measurement.
    - '2022-06-03: Version 1.16 release published on GitHub.'
    - '2023-05-25: Version 2.0 release published.'
    - '2024-04-19: Version 2.1 release published.'
    - '2025-01-09: Version 2.3 release published.'
    - '2025-12-21: Version 2.4 release published.'
  usage:
    - >
      Typical usage captures baseline or test coverage with `lcov` or `geninfo`, removes
      unwanted paths, merges trace files, and renders the result with `genhtml`. Related
      utilities convert data from Perl, Python, LLVM, and XML coverage formats into LCOV
      trace data.
related-packages:
  - id: brew:gcovr
    reason: >
      Choose gcovr for a streamlined gcov reporting CLI and numerous CI-oriented output
      formats; its official comparison notes that LCOV is preferable when Linux-kernel
      capture or extensive tracefile merging is required.
    rel: alternative
    sources:
      - https://www.gcovr.com/en/stable/faq.html
      - https://gcovr.com/en/stable/
      - https://github.com/linux-test-project/lcov
  - id: brew:kcov
    reason: >
      Choose kcov when DWARF-based collection without special compilation switches is
      more useful than LCOV's gcov-oriented capture workflow, including coverage for
      compiled programs, Python, and Bash.
    rel: alternative
    sources:
      - https://github.com/SimonKagstrom/kcov
      - https://github.com/linux-test-project/lcov
  - id: brew:codecov-cli
    reason: >
      Use Codecov CLI after LCOV to upload the generated LCOV text report to Codecov for
      hosted processing and presentation.
    rel: adjacent_workflow
    sources:
      - https://docs.codecov.com/docs/codecov-uploader
      - https://docs.codecov.com/v4.6/docs/supported-report-formats
      - https://github.com/linux-test-project/lcov
category: developer-tools
package-manager:
  apk: lcov
  brew: lcov
  chocolatey: lcov
  debian: lcov
  dnf: lcov
  macports: lcov
  nix: lcov
  pacman: lcov
  ubuntu: lcov
  zypper: lcov
