id: brew:chordii
display-name: Chord ii
homepage: https://www.vromans.org/johan/projects/Chordii/
repo: https://sourceforge.net/p/chordii/code
docs:
  - https://www.vromans.org/projects/Chordii/documentation/index.html
  - https://www.vromans.org/projects/Chordii/chordpro/index.html
config-file-location:
  unix: ~/.chordrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The official news page records Fedora approval for Chordii 4.3 in January 2010,
      with inclusion planned for Fedora 13 and updates for Fedora 11 and 12. The
      supplied package-manager facts list Homebrew, Debian, Ubuntu, and MacPorts
      packages.
    - >
      Homebrew currently packages Chordii as a niche formula with stable version 4.5.3b
      and low install counts, consistent with a specialized music-notation utility
      rather than a broad CLI platform.
  package-nerd-significance:
    - >
      Chordii matters to package-history people because it preserves an early plain-text
      music notation ecosystem: a 1991-era Unix tool, alt.sources-era releases,
      licensing cleanup for distro inclusion, and a later handoff to the ChordPro
      project.
    - >
      Its long tail in Homebrew, Debian/Ubuntu, MacPorts, and Fedora history shows how
      small domain-specific command-line tools survive through package managers long
      after their main upstream development has slowed or moved to a successor.
  project-history:
    - >
      The official Chordii site traces the project to the original CHORD program by
      Martin Leclerc and Mario Dorion. It says the chord notation was invented in June
      1991, with original releases recovered from 1992 archives and the last known
      original CHORD 3.6.2 distribution dated July 1995.
    - >
      Johan Vromans and Adam Monsen revived the unmaintained program in 2007 after being
      unable to contact the original authors. The revived project was first called
      Chordie, then renamed Chordii in 2008 to avoid confusion with chordie.com.
    - >
      A major packaging milestone came in December 2009, when the original authors
      agreed to a GPL-only CHORD 3.6.4 release. Chordii 4.3 was then rebased on that
      release, making it officially GPL and suitable for inclusion in distributions.
  related-projects:
    - >
      ChordPro is the successor and related reference ecosystem. The official Chordii
      home page says Chordii has been discontinued and directs users to the ChordPro
      site.
    - >
      The original CHORD program is the direct ancestor, and the ChordPro format page
      describes the format as a simple text notation for lyrics with chords that many
      tools adopted.
  sources:
    - https://www.vromans.org/projects/Chordii/intro.html
    - https://www.vromans.org/projects/Chordii/news.html
    - https://www.vromans.org/projects/Chordii/downloads.html
    - https://www.vromans.org/projects/Chordii/documentation/index.html
    - https://www.vromans.org/projects/Chordii/chordpro/index.html
    - https://sourceforge.net/p/chordii/code
    - https://www.chordpro.org/chordpro/index.html
    - https://formulae.brew.sh/api/formula/chordii.json
  summary:
    - >
      Chordii is a command-line song-sheet and songbook generator for lyrics with
      chords, centered on the Chord/ChordPro text format and PostScript output.
  timeline:
    - '1991: Original CHORD notation and program conceived by Martin Leclerc and Mario Dorion.'
    - >
      1992: Early CHORD 1.0, 1.0PL1, and 1.2 source kits distributed and later recovered
      from archives.
    - '1995: Last known original CHORD 3.6.2 distribution.'
    - '2007: Johan Vromans and Adam Monsen revive the project.'
    - '2008: Project renamed from Chordie to Chordii; 4.2 adds a Windows port.'
    - '2009: Original authors agree to GPL-only CHORD 3.6.4; Chordii 4.3 is rebased on it.'
    - '2010: Chordii 4.3 approved for Fedora inclusion.'
    - '2013: Chordii 4.5 released with stdin/filter usage support.'
    - '2021: Official site says Chordii has been discontinued and points users to ChordPro.'
  usage:
    - >
      Chordii reads lyrics and chord annotations in ChordPro format and emits PostScript
      song sheets with titles, chord names above words, chord diagrams, columns,
      indexes, multiple logical pages, configurable fonts, and songbook support.
    - >
      The 2013 Chordii 4.5 news item added reading input from standard input, explicitly
      making Chordii usable as a filter in toolchains.
related-packages:
  - id: brew:ghostscript
    reason: >
      Use Ghostscript to preview Chordii's PostScript output or convert it to PDF with
      ps2pdf, the workflow recommended by Chordii's official user guide.
    rel: adjacent_workflow
    sources:
      - https://www.vromans.org/projects/Chordii/documentation/chordii-4.5-user_guide.pdf
      - https://ghostscript.readthedocs.io/
category: media
package-manager:
  brew: chordii
  debian: chordii
  macports: chordii
  ubuntu: chordii
package-manager-url: https://formulae.brew.sh/formula/chordii
license: GPL-3.0-or-later
tags:
  - chords
  - cli
  - conversion
  - music
  - notation
  - postscript
  - songbook
description: Text file to music sheet converter
executables:
  - a2crd
  - chordii
provenance:
  formula: chordii
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
