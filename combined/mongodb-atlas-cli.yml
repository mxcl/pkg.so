id: brew:mongodb-atlas-cli
display-name: MongoDB Atlas CLI
homepage: https://www.mongodb.com/docs/atlas/cli/stable/
repo: https://github.com/mongodb/mongodb-atlas-cli
docs:
  - https://www.mongodb.com/docs/atlas/cli/stable
config-file-location:
  macos: ~/Library/Application Support/atlascli/config.toml
  unix:
    - ~/.config/atlascli/config.toml
    - $XDG_CONFIG_HOME/atlascli/config.toml
credentials-file-location:
  macos: ~/Library/Application Support/atlascli/config.toml
  unix:
    - ~/.config/atlascli/config.toml
    - $XDG_CONFIG_HOME/atlascli/config.toml
history:
  project-history:
    - >
      The tool emerged as the Atlas-specific successor to Atlas subcommands that had
      lived under mongocli. MongoDB's own mongocli release notes direct users away from
      mongocli atlas commands and toward the Atlas CLI, while the Atlas CLI changelog
      shows rapid expansion after its 2022-era releases: mongosh integration in Linux
      meta-packages, richer cluster and backup commands, Kubernetes configuration
      export, local deployment support, plugin work, and generated Atlas Administration
      API commands.
  sources:
    - https://formulae.brew.sh/formula/mongodb-atlas-cli
    - https://github.com/mongodb/mongodb-atlas-cli
    - https://www.mongodb.com/docs/atlas/cli/current/
    - https://www.mongodb.com/docs/atlas/cli/current/atlas-cli-changelog/
    - https://www.mongodb.com/docs/mongocli/current/release-notes/
    - https://www.mongodb.com/try/download/shell
  summary:
    - >
      MongoDB Atlas CLI is MongoDB's dedicated command-line client for Atlas. MongoDB
      documents it as a CLI built specifically for MongoDB Atlas, covering database
      deployments, Atlas Search, and common setup flows from the terminal.
  usage:
    - >
      Its practical workflow is operator- and developer-centered. atlas setup can
      authenticate, create a free database, load sample data, add the user's IP address,
      create a database user, and connect through mongosh. Package-manager coverage
      across Homebrew, MacPorts, Nix, Scoop, winget, and Linux packages reflects its
      role as MongoDB's cross-platform automation entry point for Atlas.
related-packages:
  - id: brew:mongosh
    reason: >
      Use mongosh after Atlas CLI provisions a deployment; the official atlas setup
      workflow can connect directly through the MongoDB Shell.
    rel: adjacent_workflow
    sources:
      - https://www.mongodb.com/docs/atlas/cli/current/
      - https://www.mongodb.com/docs/atlas/cli/current/command/atlas-setup/
      - https://www.mongodb.com/docs/mongodb-shell/
  - id: cask:mongodb-compass
    reason: >
      Choose Compass as Atlas CLI's graphical connection target when visual querying and
      schema exploration are preferable to a terminal shell.
    rel: adjacent_workflow
    sources:
      - https://www.mongodb.com/docs/atlas/cli/current/command/atlas-setup/
      - https://www.mongodb.com/docs/compass/
category: developer-tools
package-manager:
  brew: mongodb-atlas-cli
  dnf: atlas
  macports: atlas
  nix: mongodb-atlas-cli
  scoop: main/mongodb-atlas-cli
  ubuntu: libatlas-base-dev
  winget: MongoDB.MongoDBAtlasCLI
package-manager-url: https://formulae.brew.sh/formula/mongodb-atlas-cli
license: Apache-2.0
tags:
  - atlas
  - cli
  - cloud
  - database-management
  - mongodb
description: Atlas CLI enables you to manage your MongoDB Atlas
executables:
  - atlas
provenance:
  formula: mongodb-atlas-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
