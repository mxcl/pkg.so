id: brew:git-big-picture
display-name: git-big-picture
homepage: https://github.com/git-big-picture/git-big-picture
repo: https://github.com/git-big-picture/git-big-picture
docs:
  - https://github.com/git-big-picture/git-big-picture#readme
  - https://github.com/git-big-picture/git-big-picture/blob/main/git-big-picture.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-big-picture occupies a small but recognizable Git-tool niche: it helps
      developers explain topology in repositories where git log --graph is too noisy.
      Packaging in Homebrew, Debian-family systems, Nix, and PyPI made it easy to
      install alongside Graphviz.
  package-nerd-significance:
    - >
      Package maintainers care because the executable is a classic Unix-style Git
      helper: small, scriptable, dependent on Graphviz, installable as git big-picture
      through PATH lookup, and useful for documentation screenshots or release notes.
  project-history:
    - >
      The repository opened in 2011 and developed as a Git history visualizer rather
      than a general Git UI. Its README describes the tool as a filter: it removes
      uninteresting commits from the DAG and renders the remaining relationships with
      Graphviz.
    - >
      The project later gained generated manual-page documentation, PyPI packaging, test
      automation, and examples showing reduced graphs for toy and real repositories. A
      2026 maintainer notice placed the project in maintenance mode, with bug fixes and
      dependency updates accepted but feature expansion paused.
  related-projects:
    - >
      Related tools include Git's log graph output, Graphviz dot, PyPI packaging, and
      Git helper command integration through PATH lookup or aliases.
  sources:
    - https://api.github.com/repos/git-big-picture/git-big-picture
    - https://formulae.brew.sh/formula/git-big-picture
    - https://github.com/git-big-picture/git-big-picture
    - https://github.com/git-big-picture/git-big-picture/blob/main/README.md
    - https://github.com/git-big-picture/git-big-picture/blob/main/git-big-picture.1
  summary:
    - >
      git-big-picture is a Python and Graphviz-based visualization tool that reduces a
      Git repository's commit DAG to the commits and refs that explain the repository's
      branch and tag structure.
  timeline:
    - '2011: Repository created.'
    - '2024: The generated man page documented git-big-picture 1.3.0.'
    - '2026: Maintainer notice marked the project as maintenance mode.'
  usage:
    - >
      Practitioners run git-big-picture against a repository to produce SVG, PNG, PDF,
      Graphviz dot, or viewer output. Options select tags, branches, roots, merges,
      bifurcation commits, commit messages, simplification, history direction, output
      files, and viewers.
related-packages:
  - id: brew:graphviz
    reason: >
      git-big-picture emits Graphviz dot data and uses Graphviz to render its reduced
      Git graph into image and document formats.
    rel: adjacent_workflow
    sources:
      - https://github.com/git-big-picture/git-big-picture
      - https://graphviz.org/documentation/
  - id: brew:git
    reason: >
      Git supplies the commits, branches, tags, and repository topology that
      git-big-picture filters and visualizes.
    rel: adjacent_workflow
    sources:
      - https://github.com/git-big-picture/git-big-picture
      - https://git-scm.com/docs/git-log
category: developer-tools
package-manager:
  brew: git-big-picture
  debian: git-big-picture
  nix: git-big-picture
  ubuntu: git-big-picture
package-manager-url: https://formulae.brew.sh/formula/git-big-picture
license: GPL-3.0-or-later
tags:
  - cli
  - git
  - graphviz
  - python
  - visualization
description: Visualization tool for Git repositories
executables:
  - git-big-picture
provenance:
  formula: git-big-picture
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
