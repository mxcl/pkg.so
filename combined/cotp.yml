id: brew:cotp
display-name: cotp
homepage: https://github.com/replydev/cotp
repo: https://github.com/replydev/cotp
docs:
  - https://github.com/replydev/cotp#readme
config-file-location: null
credentials-file-location:
  unix: ~/.cotp/db.cotp
history:
  adoption-history:
    - >
      The project has remained a smaller security utility rather than a large platform.
      Its README notes distribution in Linux distro repositories and gives Homebrew,
      Cargo, and manual source installation paths, which is typical for Rust
      command-line tools that serve both desktop and shell users.
  package-nerd-significance:
    - >
      For package nerds, cotp is notable because it packages sensitive local credential
      material without depending on a cloud account. The distribution concern is less
      about daemons or services and more about preserving a stable CLI, encryption
      format, clipboard integration, and migration/import behavior.
  project-history:
    - >
      The replydev/cotp repository was created in December 2020 and published its first
      GitHub release later that month. The README says the author created cotp to have
      minimalist, secure, desktop-accessible software for managing two-factor
      authentication codes.
  related-projects:
    - Aegis, andOTP, Authy migration tooling, RFC 6238 TOTP, RFC 4226 HOTP.
  sources:
    - https://github.com/replydev/cotp
    - https://api.github.com/repos/replydev/cotp
    - https://api.github.com/repos/replydev/cotp/releases?per_page=100
  summary:
    - >
      cotp is a command-line TOTP/HOTP authenticator aimed at users who want two-factor
      codes in a terminal-accessible, encrypted local database. Its niche is the
      intersection of password-manager-like local storage and Unix-style CLI workflows.
  timeline:
    - '2020: replydev/cotp repository created and first release published.'
    - >
      2020: README documented encrypted database storage and import/migration from other
      authenticator apps.
    - '2026: Project continued publishing releases.'
  usage:
    - >
      cotp initializes an encrypted database on first run, displays OTP codes in an
      interactive dashboard, can add TOTP and HOTP entries, lists records as JSON,
      imports encrypted Aegis backups, exports its database, and can copy selected codes
      to the clipboard.
related-packages:
  - id: brew:oath-toolkit
    reason: >
      Choose OATH Toolkit when you need stateless HOTP/TOTP generation or validation
      from supplied keys; cotp instead manages many secrets in an encrypted interactive
      vault and imports authenticator backups.
    rel: alternative
    sources:
      - https://github.com/replydev/cotp
      - https://oath-toolkit.codeberg.page/
      - https://oath-toolkit.codeberg.page/oathtool.1.html
category: security
package-manager:
  apk: cotp
  brew: cotp
  debian: cotp
  nix: cotp
  pacman: cotp
package-manager-url: https://formulae.brew.sh/formula/cotp
license: GPL-3.0-only
tags:
  - authenticator
  - cli
  - hotp
  - totp
  - two-factor-authentication
description: TOTP/HOTP authenticator app with import functionality
executables:
  - cotp
provenance:
  formula: cotp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
