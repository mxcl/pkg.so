repo: https://github.com/coin3d/coin
docs:
  - https://github.com/coin3d/coin/wiki
  - https://coin3d.github.io/Coin/html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Coin occupied a practical niche for scientific and engineering visualization
      software that wanted Open Inventor source compatibility on free software
      platforms.
    - >
      The project later became the core of the broader Coin3D family of libraries and
      continued across Linux, Windows/Cygwin, and macOS development environments.
  package-nerd-significance:
    - >
      Coin matters to packagers because it is an ABI-sensitive C++ graphics library. The
      README documents major/minor/micro compatibility rules and notes that Unix shared
      libraries use ABI-versioned libCoin names so different major runtimes can coexist.
  project-history:
    - >
      The official README says Coin began in 1995 as a scene graph rendering library for
      VRML 1.0 scenes, initially based on SGI's Qv parser. After several years of
      VRML-related extensions, the project was redesigned around an Open Inventor-like
      API and named Coin.
    - >
      Coin reached Open Inventor 2.1 compatibility in autumn 2000. Its maintainers
      describe it as an independently developed implementation, not a code-sharing
      derivative of SGI Open Inventor.
  related-projects:
    - >
      The official README positions Coin alongside other Open Inventor implementations
      and notes the wider Coin3D library family built around the core Coin library.
  sources:
    - https://github.com/coin3d/coin
    - https://github.com/coin3d/coin/wiki
    - https://coin3d.github.io/Coin/html
  summary:
    - >
      Coin is the core Coin3D library, an OpenGL-based C++ 3D graphics library
      implementing the Open Inventor 2.1 API.
  timeline:
    - '1995: Project starts as a VRML 1.0 scene graph rendering library.'
    - '1997: Maintainers begin a fundamental redesign toward an Open Inventor-style API.'
    - '2000: Coin reaches Open Inventor 2.1 compatibility.'
    - >
      2007: Maintainers move toward date-based release cycles while preserving ABI-based
      versioning.
    - '2019: Coin 4.0.0 is released with API changes to improve Open Inventor 2.1 conformance.'
  usage:
    - >
      Developers link against Coin as a C++ library for retained-mode scene graphs, Open
      Inventor compatibility, VRML-related formats, and OpenGL rendering. The package
      also installs coin-config for build integration.
