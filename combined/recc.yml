id: brew:recc
display-name: recc
homepage: https://buildgrid.gitlab.io/recc
repo: https://gitlab.com/BuildGrid/buildbox/buildbox
docs:
  - https://buildgrid.gitlab.io/buildbox/buildbox/recc.html
config-file-location:
  unix:
    - ./recc/recc.conf
    - ${RECC_CONFIG_DIRECTORY}/recc.conf
    - ~/.recc/recc.conf
    - ${RECC_CONFIG_PREFIX_DIR}/recc.conf
    - ${INSTALL_DIR}/../etc/recc/recc.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The official documentation says recc is in active development and is used at
      Bloomberg. It is designed to work with Remote Execution services such as BuildGrid
      and workers such as buildbox-worker.
    - >
      The original standalone BuildGrid/recc repository is marked obsolete after recc
      was merged into the unified BuildBox repository.
  package-nerd-significance:
    - >
      recc gives conventional C and C++ compiler invocations access to Remote Execution
      API caching and execution without requiring the build to originate in a system
      such as Bazel. Its evolution from a standalone repository into the BuildBox
      monorepo also reflects consolidation in the Remote Execution API tooling
      ecosystem.
  project-history:
    - >
      recc began as a compiler-wrapper client for the Remote Execution API. The original
      public GitLab project was created in 2018.
    - >
      Development was subsequently consolidated into the BuildBox suite, where recc is
      maintained alongside content-addressable storage, runner, worker, and related
      remote-build components.
  related-projects:
    - BuildBox is the suite that now contains recc.
    - BuildGrid is an example Remote Execution service used with recc.
    - buildbox-worker is an example worker that executes remotely submitted actions.
    - The Remote Execution API defines the caching and execution protocol recc uses.
  sources:
    - 'Official BuildBox repository: https://gitlab.com/BuildGrid/buildbox/buildbox'
    - 'Official obsolete standalone project notice: https://gitlab.com/BuildGrid/recc'
    - 'Official recc documentation: https://buildgrid.gitlab.io/buildbox/buildbox/recc.html'
  summary:
    - >
      recc is a C and C++ compiler-command launcher that uses the Remote Execution APIs
      for build caching and optional remote execution.
  timeline:
    - '2018: The original public BuildGrid/recc project was created.'
    - 'Later: The standalone recc project was retired and merged into BuildBox.'
    - >
      Current BuildBox era: recc is developed as one component of the consolidated
      BuildBox suite.
  usage:
    - >
      recc wraps compilation and link commands. It queries a Remote Execution service
      for a cached result, downloads a hit, or otherwise runs the action locally or
      submits it for remote execution.
    - >
      It is useful where existing compiler-oriented builds need shared caching or remote
      capacity while retaining familiar C/C++ command lines.
category: developer-tools
package-manager:
  brew: recc
package-manager-url: https://formulae.brew.sh/formula/recc
license: Apache-2.0
tags:
  - buildbox
  - c
  - cli
  - compiler-cache
  - cpp
  - remote-execution
description: Remote Execution Caching Compiler
executables:
  - buildbox-casd
  - buildbox-casd-wrap
  - buildbox-run-hosttools
  - casupload-oci
  - recc
  - recc-c++
  - recc-cc
  - recc-server
  - rumbad
provenance:
  formula: recc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
