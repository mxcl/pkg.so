id: cask:local
display-name: Local
homepage: https://localwp.com/
repo: null
docs:
  - https://localwp.com/help-docs
config-file-location:
  linux: ~/.config/Local/
  macos: ~/Library/Application Support/Local/
  windows: '%APPDATA%\Local\'
credentials-file-location: null
history:
  adoption-history:
    - >
      Local's official site reports more than one million downloads. It is closely
      integrated with Flywheel and WP Engine hosting but remains usable as a free local
      WordPress environment without deploying to either provider.
  package-nerd-significance:
    - >
      Local packages a traditionally manual WordPress development stack into a desktop
      application, including web servers, PHP, databases, WP-CLI, mail capture and TLS.
      It is especially useful when reproducible site creation and switching runtime
      versions matter more than hand-maintaining a local LAMP-style stack.
  project-history:
    - >
      The application was originally known as Local by Flywheel and used VirtualBox to
      isolate WordPress sites. The Local team later rebuilt the runtime as Local
      Lightning, replacing the VM-centered architecture with native,
      operating-system-level services. The product is now presented simply as Local
      under WP Engine.
  related-projects:
    - WordPress
    - WP-CLI
    - Flywheel
    - WP Engine
    - PHP
    - MySQL
    - NGINX
    - Apache
  sources:
    - 'Official Local website: https://localwp.com/'
    - 'Official features page: https://localwp.com/features/'
    - >
      Official installation guide:
      https://localwp.com/help-docs/getting-started/installing-local/
    - >
      Official migration guide:
      https://localwp.com/help-docs/advanced/migrating-from-local-by-flywheel-to-local-lightning/
  summary:
    - >
      Local is a free desktop environment for creating, testing and deploying WordPress
      sites on macOS, Windows and Debian-based Linux.
  timeline:
    - '2010s: Distributed as Local by Flywheel using VirtualBox-managed sites'
    - '2019: Local Lightning entered public beta with native services'
    - '2020s: Continued under the Local brand with WP Engine and Flywheel integration'
  usage:
    - >
      Developers create isolated WordPress sites, select PHP and web-server versions,
      inspect logs and configuration, use WP-CLI, test mail and HTTPS, and export or
      clone complete sites. Local Connect can push and pull supported sites to Flywheel
      and WP Engine environments.
category: developer-tools
package-manager:
  brew-cask: local
package-manager-url: https://formulae.brew.sh/cask/local
tags:
  - apache
  - desktop
  - local-development
  - mysql
  - nginx
  - php
  - staging
  - web-development
  - wordpress
  - wp-cli
description: WordPress local development tool by Flywheel
applications:
  - Local.app
provenance:
  cask: local
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
