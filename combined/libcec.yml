id: brew:libcec
display-name: libcec
homepage: https://libcec.pulse-eight.com/
repo: https://github.com/Pulse-Eight/libcec
docs:
  - https://github.com/Pulse-Eight/libcec#readme
  - https://libcec.pulse-eight.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libcec's most visible adoption is in media centers. Pulse-Eight says the library
      is used by popular media-center platforms, and the Kodi wiki documents Kodi's use
      of libCEC to receive TV-remote commands and send CEC messages over HDMI. That made
      libcec a common dependency on HTPC, Raspberry Pi, LibreELEC, OSMC, and Kodi-style
      systems.
    - >
      Distributions package libcec because it is both a hardware enablement library and
      a useful command-line tool provider. The cec-client utility gives shell scripts
      and diagnostics direct access to HDMI-CEC traffic, while GUI media centers use the
      same library for remote-control integration.
  package-nerd-significance:
    - >
      libcec is a neat package because it turns a messy living-room hardware protocol
      into a Unix dependency and CLI. It is also one of the rare Homebrew/Linux packages
      whose value depends on a physical HDMI topology: the same binary can be boring on
      a laptop and essential on an HTPC behind a TV.
  project-history:
    - >
      Pulse-Eight presents libCEC as an abstraction layer for the HDMI CEC bus:
      developers can interact with TVs, receivers, and other HDMI devices without
      implementing vendor-specific handshaking and message quirks themselves. The GitHub
      README says the library supports Pulse-Eight USB-CEC hardware and other
      CEC-capable hardware including Raspberry Pi, Exynos SoCs, NXP TDA995x, and Odroid
      C2.
    - >
      The support documentation describes libcec as the open source library powering all
      Pulse-Eight CEC adapters, including cec-client, CEC-Tray, Standby Monitor,
      EventGhost integration, and third-party media-center applications.
  related-projects:
    - >
      Related projects include Kodi, Plex-style media centers, LibreELEC/OSMC systems,
      Raspberry Pi firmware and CEC support, Pulse-Eight USB-CEC and NUC adapters,
      EventGhost, and HDMI-CEC vendor implementations such as Anynet+, Bravia Sync,
      SimpLink, and VIERA Link.
  sources:
    - https://formulae.brew.sh/formula/libcec
    - https://github.com/Pulse-Eight/libcec
    - https://kodi.wiki/view/CEC
    - https://libcec.pulse-eight.com/
    - >
      https://support.pulse-eight.com/support/solutions/articles/30000053002-what-is-the-pulse-eight-cec-adapter-and-libcec-
  summary:
    - >
      libcec is Pulse-Eight's open source HDMI-CEC communication library. It lets
      computers and media-center applications send and receive Consumer Electronics
      Control messages over HDMI, usually through Pulse-Eight USB or NUC CEC adapters or
      through hardware such as the Raspberry Pi.
  timeline:
    - >
      2010s: Pulse-Eight developed libCEC around USB and internal HDMI-CEC adapters for
      HTPC use.
    - >
      2018: Kodi wiki page for CEC was updated for Kodi v18 and documented libCEC as
      Kodi's CEC layer.
    - '2025-06: Pulse-Eight support documentation listed libcec 7.1.1 as released in June 2025.'
    - '2025-06-23: GitHub release listing shows libcec-7.1.1.'
  usage:
    - >
      Users commonly run cec-client to scan the HDMI-CEC bus, send power/input commands,
      or debug remote-control traffic. Applications link libcec when they need CEC
      support without handling USB adapter protocols, Raspberry Pi CEC interfaces, or
      vendor differences directly.
related-packages:
  - id: cask:kodi
    reason: >
      Kodi directly uses libCEC to accept TV-remote input and control televisions or AV
      receivers over HDMI, making it the strongest documented end-user companion.
    rel: adjacent_workflow
    sources:
      - https://kodi.wiki/view/CEC
      - https://github.com/Pulse-Eight/libcec
category: media
