id: brew:libavif
display-name: libavif
homepage: https://github.com/AOMediaCodec/libavif
repo: https://github.com/AOMediaCodec/libavif
docs:
  - https://github.com/AOMediaCodec/libavif#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libavif became the practical Unix package for AVIF batch conversion because it
      ships simple tools and a small C API. Its README documents package-manager
      installation across Homebrew, MacPorts, Debian-style systems, Red Hat-style
      systems, MSYS2, and Windows via vcpkg or release binaries.
  package-nerd-significance:
    - >
      libavif is the tiny command-line face of a much larger codec ecosystem. Package
      maintainers care about it because optional codec dependencies change feature
      coverage, performance, binary size, and patent-policy comfort while the same
      `avifenc` and `avifdec` commands appear in scripts and image pipelines.
  project-history:
    - >
      The project was created around the AVIF specification, which maps AV1 image
      payloads into an ISO base media file format container. The repository copyright
      text names Joe Drago in 2019, and the codebase grew into an AOMedia-hosted
      implementation with codec back ends for libaom, dav1d, libgav1, rav1e, and
      SVT-AV1.
    - >
      The changelog shows the project moving from fast-moving 0.x releases into a 1.0.0
      release on 2023-08-24, where the maintainers stated the ABI would be more stable
      from that point. Later releases added gain-map work, image-sequence handling,
      stricter parsing, and build/dependency refinements.
  related-projects:
    - >
      AV1 Image File Format, libaom, dav1d, libgav1, rav1e, SVT-AV1, libyuv, libjpeg,
      libpng, and image conversion pipelines are the main adjacent projects.
  sources:
    - https://aomediacodec.github.io/av1-avif/
    - https://github.com/AOMediaCodec/libavif
    - https://raw.githubusercontent.com/AOMediaCodec/libavif/main/CHANGELOG.md
  summary:
    - >
      libavif is AOMedia's portable C implementation of the AV1 Image File Format. It
      provides the library API plus the `avifenc` and `avifdec` command-line tools used
      to encode, decode, inspect, and test AVIF images.
  timeline:
    - '2019: Repository license text records Joe Drago copyright for libavif.'
    - '2020: Version 0.8.0 adds image sequence encoding and related codec-layer refactoring.'
    - '2023: Version 1.0.0 marks a more stable ABI.'
    - '2024: Version 1.1.0 adds experimental gain-map API work.'
    - '2025: Version 1.2.0 installs `avifgainmaputil` and turns on gain-map API support.'
    - '2026: Version 1.4.2 requires C11 for compilation while keeping public headers C99.'
  usage:
    - >
      Users commonly run `avifenc` to convert JPEG, PNG, or Y4M input to AVIF and
      `avifdec` to decode AVIF output back to common image formats. Developers link the
      library when they need AVIF support without embedding the full details of AV1
      codec selection, metadata handling, tiling, alpha, gain maps, and color
      conversion.
related-packages:
  - id: brew:aom
    reason: >
      libaom is libavif's official full encoder-and-decoder back end and is the usual
      choice when both AVIF creation and reading are required.
    rel: adjacent_workflow
    sources:
      - https://github.com/AOMediaCodec/libavif#codec-dependencies
      - https://aomedia.googlesource.com/aom
  - id: brew:dav1d
    reason: >
      dav1d is a decoding-only back end documented by libavif and is useful when the
      workflow prioritizes fast AVIF reading rather than encoding.
    rel: adjacent_workflow
    sources:
      - https://github.com/AOMediaCodec/libavif#codec-dependencies
      - https://code.videolan.org/videolan/dav1d
  - id: brew:rav1e
    reason: >
      rav1e is an encoder back end supported by libavif for AVIF creation when a
      Rust-based AV1 encoder is preferred.
    rel: adjacent_workflow
    sources:
      - https://github.com/AOMediaCodec/libavif#codec-dependencies
      - https://github.com/xiph/rav1e
  - id: brew:svt-av1
    reason: >
      SVT-AV1 is an encoder back end supported by libavif for AVIF workflows that favor
      its scalable, performance-oriented AV1 implementation.
    rel: adjacent_workflow
    sources:
      - https://github.com/AOMediaCodec/libavif#codec-dependencies
      - https://gitlab.com/AOMediaCodec/SVT-AV1
category: media
package-manager:
  apk: libavif
  brew: libavif
  debian: libavif-bin
  dnf: libavif
  macports: libavif
  nix: libavif
  pacman: libavif
  scoop: main/libavif
  ubuntu: libavif-bin
  zypper: avif-tools
package-manager-url: https://formulae.brew.sh/formula/libavif
license: BSD-2-Clause
tags:
  - avif
  - cli
  - decoder
  - encoder
  - image-codec
  - library
description: Library for encoding and decoding .avif files
executables:
  - avifdec
  - avifenc
  - avifgainmaputil
provenance:
  formula: libavif
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
