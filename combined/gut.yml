id: brew:gut
display-name: gut
homepage: https://gut-cli.dev/
repo: https://github.com/julien040/gut
docs:
  - https://gut-cli.dev/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gut spread through developer package-manager channels rather than through a large
      framework ecosystem. Its own installation instructions list Homebrew for macOS,
      Scoop for Windows, apt and yum repositories, AUR packages, and Go installation
      from source, reflecting a tool aimed at terminal users who want package-manager
      setup on several platforms.
    - >
      GitHub repository metadata shows modest but visible interest for a niche Git
      porcelain, with hundreds of stars and a small fork count by 2026. That pattern
      fits a utility whose audience is users experimenting with gentler command names
      and safer defaults rather than teams standardizing a new version-control system.
  package-nerd-significance:
    - >
      For package-manager catalogs, gut is an example of a modern Git UX wrapper that
      packages policy decisions as a CLI: no pushed-history rewrites, no explicit
      staging step for the default path, and guided recovery commands. It matters less
      as a replacement for Git than as a snapshot of how tool authors try to make Git
      less hostile to new users while still delegating storage and transport to git.
  project-history:
    - >
      The public GitHub repository was created on 2022-12-22, and GitHub releases record
      version 0.1.0 on 2023-02-16. The project was written in Go and shipped as a single
      command named gut. Its README says the author built it after finding Git
      frustrating while learning to code, with the goal of letting people use Git
      without the same anxiety around mistakes.
    - >
      The project design emphasizes guardrails around common Git hazards. The README
      says gut will not allow modification of history already pushed to a remote, treats
      the staging area as unnecessary for its basic workflow, blocks unsafe
      detached-HEAD operations until the user chooses a path forward, and relies on Git
      internally.
  related-projects:
    - 'git: gut delegates core version-control behavior to the standard git executable.'
    - >
      Scoop, Homebrew, apt, yum, and AUR: package-manager surfaces documented by the
      project for installation.
    - >
      GitHub, GitLab, and Bitbucket: hosting platforms named in the README for
      pull-request and comparison workflows.
  sources:
    - https://api.github.com/repos/julien040/gut
    - https://api.github.com/repos/julien040/gut/releases?per_page=100
    - https://github.com/julien040/gut
    - https://gut-cli.dev/
  summary:
    - >
      gut is a small Git porcelain that presents Git through simpler, beginner-oriented
      commands and safety rails. Its README frames it as an alternative CLI with
      consistent command names, cloud-hosting integration, and coexistence with the
      standard git executable rather than a replacement for Git itself.
  timeline:
    - '2022-12-22: Public GitHub repository created.'
    - '2023-02-16: Version 0.1.0 published in GitHub releases.'
    - '2023: README documents Homebrew, Scoop, apt, yum, AUR, and Go installation paths.'
    - '2026-06-07: GitHub release 0.3.3 published.'
  usage:
    - >
      Typical use follows Git repository workflows: gut init starts a repository, gut
      save commits tracked changes, gut sync exchanges changes with the upstream remote,
      gut fix helps recover from mistakes, gut revert creates a new commit to undo older
      work, and gut whereami explains the HEAD position. The command set intentionally
      maps high-level user intent onto lower-level Git operations.
    - >
      The README also documents integration conveniences such as opening pull-request or
      comparison pages on hosting platforms, downloading .gitignore and .gitattributes
      templates, and simplifying GitHub authentication.
related-packages:
  - id: brew:git
    reason: >
      Use Git alongside Gut for advanced operations not exposed by the beginner-focused
      porcelain; Gut officially depends on Git and is designed to coexist with its CLI.
    rel: adjacent_workflow
    sources:
      - https://github.com/julien040/gut#readme
      - https://git-scm.com/docs
category: developer-tools
