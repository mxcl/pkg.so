id: brew:cpplint
display-name: cpplint
homepage: https://pypi.org/project/cpplint/
repo: https://github.com/cpplint/cpplint
docs:
  - https://github.com/cpplint/cpplint#readme
  - https://pypi.org/project/cpplint
config-file-location:
  unix: CPPLINT.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is distributed through PyPI for Python-based installation and through
      Unix package managers, making it easy to add to local developer workflows and CI
      jobs.
  package-nerd-significance:
    - >
      cpplint is a good example of a small language-policy tool that package managers
      keep around because many C++ projects want style checking without adopting a full
      compiler analysis stack.
  project-history:
    - >
      The maintained cpplint package identifies itself as a fork of Google's cpplint
      from google/styleguide. Its README says the fork keeps the same core purpose while
      accepting fixes that make the tool usable in wider contexts.
  related-projects:
    - >
      The package is directly related to Google's C++ Style Guide and the
      google/styleguide repository.
  sources:
    - https://github.com/cpplint/cpplint#readme
    - https://pypi.org/project/cpplint/
    - https://github.com/google/styleguide
  summary:
    - >
      cpplint is a command-line static style checker for C and C++ files following
      Google's C++ style guide.
  timeline:
    - 'Original upstream: Google open-sourced the in-house cpplint tool in google/styleguide.'
    - >
      Fork era: The cpplint/cpplint package tracks fixes and packaging-friendly changes
      for wider use.
  usage:
    - >
      Typical usage is cpplint [OPTIONS] files. The fork documents practical additions
      such as Python 3 compatibility, recursive file discovery, exclusion support, JUnit
      XML output, configurable extensions, and repository-root overrides.
related-packages:
  - id: brew:cppcheck
    reason: >
      Pair cpplint's Google-style checks with Cppcheck's defect and undefined-behavior
      analysis to cover correctness concerns beyond source conventions.
    rel: adjacent_workflow
    sources:
      - https://github.com/cpplint/cpplint
      - https://cppcheck.sourceforge.io/
  - id: brew:llvm
    reason: >
      Choose LLVM's clang-tidy when compiler-aware analysis, compilation-database
      support, and automated fixes are needed instead of cpplint's lightweight textual
      style checks.
    rel: alternative
    sources:
      - https://github.com/cpplint/cpplint
      - https://clang.llvm.org/extra/clang-tidy/
category: developer-tools
package-manager:
  apk: cpplint
  brew: cpplint
  debian: cpplint
  nix: cpplint
  ubuntu: cpplint
package-manager-url: https://formulae.brew.sh/formula/cpplint
license: Apache-2.0
tags:
  - c-plus-plus
  - cli
  - google-style
  - linting
  - python
  - style-checker
description: Static code checker for C++
executables:
  - cpplint
provenance:
  formula: cpplint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
