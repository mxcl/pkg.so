id: brew:funcoeszz
display-name: Funções ZZ
homepage: https://funcoeszz.net/
repo: https://github.com/funcoeszz/funcoeszz
docs:
  - https://funcoeszz.net/docs.html
  - https://github.com/funcoeszz/funcoeszz/wiki
config-file-location:
  unix:
    - ~/.bashrc
    - ~/.bash_profile
credentials-file-location: null
history:
  adoption-history:
    - >
      The first public announcement was made on 15 September 2000 after the library grew
      to 22 functions. In October 2001, with about 30 functions, it was packaged in
      Conectiva Linux. The project later gained the funcoeszz.net domain, GitHub
      hosting, contributors and coauthors, official one-file releases, a Docker image,
      and package-manager distribution including Homebrew and Debian-family packages.
  package-nerd-significance:
    - >
      Funções ZZ is package-nerd gold because it is simultaneously a shell library, a
      command collection, a single-file release artifact, and a culturally specific Unix
      toolbox. Its history documents the transition from shared workplace scripts to
      distro packaging, a domain-hosted project site, Google Code/Subversion, GitHub,
      Docker, and modern package-manager formulas.
  project-history:
    - >
      Aurelio Jargas created Funções ZZ on 22 February 2000 while working with Linux at
      Conectiva. The core idea was to turn many small shell scripts into one file of
      Bash functions sharing the zz prefix, so users could source one library and
      discover commands with shell completion.
  related-projects:
    - Conectiva Linux was the first major distribution channel named in the official history.
    - The official Docker image funcoeszz/zz provides containerized execution.
    - >
      The project grew from shell scripting practices around Bash, sed, awk, grep, and
      regular expressions.
  sources:
    - https://funcoeszz.net/
    - https://funcoeszz.net/anuncio-21.1.html
    - https://funcoeszz.net/docs.html
    - https://funcoeszz.net/download/
    - https://funcoeszz.net/hist.html
    - https://github.com/funcoeszz/funcoeszz
    - https://github.com/funcoeszz/funcoeszz/wiki
  summary:
    - >
      Funções ZZ is a Portuguese-language collection of shell mini-applications for
      Unix-like command lines. The official site describes it as a mature Brazilian
      free-software project with around 190 utilities for lookups, calculations,
      conversions, text processing, file tasks, and other daily shell jobs.
  timeline:
    - '2000: Aurelio Jargas creates Funções ZZ on 22 February.'
    - '2000: First public announcement made on 15 September with 22 functions.'
    - '2001: funcoeszz package included in Conectiva Linux.'
    - '2003: Thobias Salazar Trevisan becomes coauthor.'
    - '2005: funcoeszz.net becomes the official domain.'
    - '2008: Project starts a new generation using public version-control workflow.'
    - '2012: Project moves from Google Code SVN to GitHub.'
    - '2013: Itamar Santos de Souza becomes coauthor.'
    - "2021: Version 21.1 released for the project's 21st anniversary."
  usage:
    - >
      Users download the single funcoeszz shell file, test it with Bash, rename it, make
      it executable, and can run zzzz --bashrc to add startup lines to their shell.
      Common examples include currency lookup, lottery results, date utilities, password
      generation, CPF/CNPJ validation, text conversion, and filename cleanup.
related-packages: []
category: productivity
