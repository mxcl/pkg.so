id: brew:kubectl-cnpg
display-name: kubectl-cnpg
homepage: https://cloudnative-pg.io/
repo: https://github.com/cloudnative-pg/cloudnative-pg
docs:
  - https://cloudnative-pg.io/docs/devel/kubectl-plugin
  - https://cloudnative-pg.io/documentation/current/kubectl-plugin
config-file-location:
  unix: ~/.kube/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The plugin's adoption follows CloudNativePG adoption rather than an independent
      CLI culture. The package appears in Homebrew, APK, Nix, and zypper, and the
      official docs name Homebrew and Krew as supported install paths for workstation
      users.
    - >
      The repository metadata observed on 2026-07-01 showed more than 8000 GitHub stars
      for CloudNativePG, which makes kubectl-cnpg a plugin attached to a prominent
      Kubernetes database operator rather than a tiny standalone addon.
  package-nerd-significance:
    - >
      kubectl-cnpg is interesting as a packaged operator companion: the binary is
      distributed across OS package systems even though its value is tied to a
      cluster-side controller. It shows how serious Kubernetes operators often grow
      their own kubectl plugin for operational ergonomics.
  project-history:
    - >
      The CloudNativePG GitHub repository was created on 2022-03-10. The project
      describes CloudNativePG as a platform for managing PostgreSQL databases in
      Kubernetes across the operational lifecycle, and its repository topics include
      `kubectl-plugin`, `operator`, `postgresql`, and high-availability concepts.
    - >
      The kubectl plugin became one of the operator's user-facing control surfaces: the
      official plugin documentation covers installation scripts, Debian and RPM
      packages, AUR, Krew, Homebrew, supported architectures, completion, and command
      usage.
  related-projects:
    - >
      Related projects include Kubernetes, kubectl, Krew, PostgreSQL, and the
      CloudNativePG operator. The package is not a general PostgreSQL client; it is an
      operational frontend for CloudNativePG resources.
  sources:
    - https://api.github.com/repos/cloudnative-pg/cloudnative-pg
    - https://cloudnative-pg.io/docs/devel/kubectl-plugin
    - https://cloudnative-pg.io/documentation/current/kubectl-plugin
    - https://formulae.brew.sh/formula/kubectl-cnpg
    - https://github.com/cloudnative-pg/cloudnative-pg
    - https://krew.sigs.k8s.io/docs/user-guide/setup/install/
  summary:
    - >
      kubectl-cnpg is the kubectl plugin shipped by the CloudNativePG project for
      managing PostgreSQL clusters on Kubernetes. The plugin is part of the main
      CloudNativePG repository rather than a separate utility repository.
  timeline:
    - '2022-03-10: CloudNativePG repository created.'
    - '2025-05-08: CloudNativePG release v1.29.1 published.'
    - >
      2026-06-29: CloudNativePG release v1.30.0 published, with plugin package examples
      in the documentation using v1.30.0 assets.
  usage:
    - >
      After installation, users run commands as `kubectl cnpg COMMAND [ARGS...]`. The
      official documentation emphasizes management tasks such as generating installation
      manifests and interacting with CloudNativePG-managed database clusters.
    - >
      The plugin uses the normal kubectl configuration path through `~/.kube/config`, so
      it fits existing Kubernetes authentication and context workflows rather than
      defining a separate credentials store.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubectl discovers `kubectl-cnpg` as the `kubectl cnpg` plugin and supplies its
      cluster contexts, API connectivity, and authentication.
    rel: adjacent_workflow
    sources:
      - https://cloudnative-pg.io/docs/current/kubectl-plugin/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:krew
    reason: >
      CloudNativePG officially documents Krew for installing and upgrading the plugin as
      `cnpg` within the kubectl plugin ecosystem.
    rel: adjacent_workflow
    sources:
      - https://cloudnative-pg.io/docs/current/kubectl-plugin/
      - https://krew.sigs.k8s.io/
category: developer-tools
package-manager:
  apk: kubectl-cnpg
  brew: kubectl-cnpg
  nix: kubectl-cnpg
  zypper: kubectl-cnpg
package-manager-url: https://formulae.brew.sh/formula/kubectl-cnpg
license: Apache-2.0
tags:
  - cli
  - cloudnativepg
  - database
  - kubectl-plugin
  - kubernetes
  - postgresql
description: CloudNativePG plugin for kubectl
executables:
  - kubectl-cnpg
  - kubectl_complete-cnpg
provenance:
  formula: kubectl-cnpg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
