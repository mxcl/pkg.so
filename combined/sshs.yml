id: brew:sshs
display-name: sshs
homepage: https://github.com/quantumsheep/sshs
repo: https://github.com/quantumsheep/sshs
docs:
  - https://github.com/quantumsheep/sshs#readme
config-file-location:
  unix: ~/.ssh/config
credentials-file-location:
  unix: ~/.ssh/id_rsa
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, Chocolatey, Arch Linux, Alpine
      Linux, NetBSD pkgsrc, Nix flakes, and source builds, while the supplied package
      metadata also records MacPorts, pacman, Nix, Scoop, and Homebrew identifiers. That
      breadth indicates adoption as a small convenience CLI across multiple package
      ecosystems.
  package-nerd-significance:
    - >
      Package nerds care about sshs because it is intentionally boring in the best way:
      it layers a searchable TUI over the de facto OpenSSH config format, so packaging
      it is mostly about delivering a small Rust binary that respects existing user
      dotfiles.
  project-history:
    - >
      The upstream repository's earliest commits are from February 2022 and describe the
      initial implementation of the SSH host selector. The README defines the tool
      narrowly: it reads `~/.ssh/config`, lists hosts in a terminal interface, and
      launches the system `ssh` client rather than replacing OpenSSH.
  related-projects:
    - >
      sshs belongs to the family of SSH connection managers and terminal launchers, but
      it delegates connection semantics to OpenSSH and its `ssh_config` file.
  sources:
    - Git history from https://github.com/quantumsheep/sshs
    - https://github.com/quantumsheep/sshs#readme
    - source_facts.package-manager
  summary:
    - >
      sshs is a Rust terminal user interface for choosing SSH hosts from an existing
      OpenSSH config file.
  timeline:
    - '2022: Initial upstream commits implemented the SSH host selector.'
    - '2022: 1.0.0 and several early 1.x tags were published.'
    - '2024: README documented broad package-manager installation paths.'
    - '2025: 4.7.2 appeared in the upstream tag history.'
  usage:
    - >
      Users install `sshs`, keep their normal OpenSSH configuration, and run the TUI to
      search and connect to configured hosts. The README also documents a `--config`
      option for users who want to point it at another SSH config file.
category: developer-tools
package-manager:
  apk: sshs
  brew: sshs
  macports: sshs
  nix: sshs
  pacman: sshs
  scoop: extras/sshs
package-manager-url: https://formulae.brew.sh/formula/sshs
license: MIT
tags:
  - cli
  - connection-manager
  - ssh
  - terminal
  - tui
description: Graphical command-line client for SSH
executables:
  - sshs
provenance:
  formula: sshs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
