id: brew:arjun
display-name: Arjun
homepage: https://github.com/s0md3v/Arjun
repo: https://github.com/s0md3v/Arjun
docs:
  - https://github.com/s0md3v/Arjun/wiki/Usage
  - https://github.com/s0md3v/Arjun#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show Arjun packaged for Homebrew, Debian, Ubuntu, and
      Nix, which is typical for Python security tooling that becomes useful enough to
      install from OS and developer package managers rather than only from source.
    - >
      Arjun's adoption niche is bug bounty, recon, and API testing workflows where
      hidden or undocumented parameters can change endpoint behavior. Its README credits
      Common Crawl, SecLists, Param Miner, and data-payloads as sources or relatives for
      the parameter wordlists, tying it to the broader web-security wordlist ecosystem.
  package-nerd-significance:
    - >
      Arjun is package-nerdy because it turns a common recon step into a repeatable CLI
      primitive. It is small, Python-packaged, and easy to drop into Homebrew, distro
      packages, Nix shells, or security-tool images.
    - >
      Its value is not a framework or scanner platform; it is the narrow, automatable
      act of parameter discovery. That narrowness is why it fits well beside tools like
      Burp, SecLists, Param Miner, ffuf, httpx, and other recon CLIs.
  project-history:
    - >
      Arjun is maintained in the s0md3v/Arjun GitHub repository and distributed as a
      Python CLI. The official README positions it around practical web testing tasks:
      GET, POST, JSON, and XML request probing; timeout and rate-limit handling; output
      to Burp Suite, text, or JSON; and target import from files, Burp, or raw HTTP
      requests.
    - >
      The project release stream visible from the official GitHub releases shows 1.x
      releases by 2018-2019, a 2.0 beta in 2020, and continued 2.2.x releases through
      2024. The README's installation recommendation is pipx, with pip as a fallback for
      older Python environments.
  related-projects:
    - >
      Related projects and data sources named by the README include SecLists,
      PortSwigger Param Miner, Common Crawl-derived wordlists, Burp Suite, and
      data-payloads.
    - >
      In workflows it commonly sits near HTTP probing, fuzzing, and recon tools rather
      than full vulnerability scanners.
  sources:
    - https://github.com/s0md3v/Arjun/releases
    - https://raw.githubusercontent.com/s0md3v/Arjun/master/README.md
    - input.source_facts.package-manager
  summary:
    - >
      Arjun is an HTTP parameter discovery suite for reconnaissance and
      application-security testing. Its README describes the core job plainly: find
      valid query or body parameters for URL endpoints, using a large built-in
      parameter-name dictionary while trying to keep request counts low.
  timeline:
    - '2018: Official GitHub releases show Arjun 1.1.'
    - '2019: Official releases show 1.2-beta through 1.6.'
    - '2020: Official releases show 2.0-beta.'
    - '2024: Official releases show 2.2.x releases through 2.2.7.'
  usage:
    - >
      The executable is arjun. Users normally point it at one URL or a list of targets,
      choose request methods and headers as needed, and export discovered parameters for
      later manual testing or Burp-centered workflows.
    - >
      The official README does not document a persistent config file or credential
      store. Operationally, options are passed on the command line or through imported
      request/target files.
related-packages:
  - id: brew:ffuf
    reason: >
      Choose ffuf when you need general keyword-based parameter, path, host, or
      request-body fuzzing; choose Arjun when the narrower goal is efficient discovery
      of parameter names from response differences.
    rel: alternative
    sources:
      - https://github.com/s0md3v/Arjun
      - https://github.com/ffuf/ffuf
      - https://github.com/ffuf/ffuf/wiki
category: security
package-manager:
  brew: arjun
  debian: arjun
  nix: arjun
  ubuntu: arjun
package-manager-url: https://formulae.brew.sh/formula/arjun
license: AGPL-3.0-only
tags:
  - api-fuzzer
  - api-testing
  - cli
  - http
  - parameter-discovery
  - recon
description: HTTP parameter discovery suite
executables:
  - arjun
provenance:
  formula: arjun
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
