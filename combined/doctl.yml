id: brew:doctl
display-name: doctl
homepage: https://docs.digitalocean.com/reference/doctl/
repo: https://github.com/digitalocean/doctl
docs:
  - https://docs.digitalocean.com/reference/doctl
  - https://docs.digitalocean.com/reference/doctl/reference
config-file-location:
  macos: ~/Library/Application Support/doctl/config.yaml
  unix:
    - $XDG_CONFIG_HOME/doctl/config.yaml
    - ~/.config/doctl/config.yaml
credentials-file-location:
  macos: ~/Library/Application Support/doctl/config.yaml
  unix:
    - $XDG_CONFIG_HOME/doctl/config.yaml
    - ~/.config/doctl/config.yaml
history:
  adoption-history:
    - >
      doctl has broad package-manager adoption. The official README documents Homebrew
      on macOS, Snap on supported Linux systems, Arch Linux, Fedora, Nix, Docker Hub
      images, GitHub release downloads, and source builds. Homebrew analytics show tens
      of thousands of annual installs, which is high for a provider-specific cloud CLI.
  package-nerd-significance:
    - >
      doctl matters to package nerds because it is a well-maintained example of the
      cloud-provider CLI pattern: a single static Go program, packaged across Homebrew,
      Linux distros, Snap, Windows managers, Docker images, and GitHub releases, with
      API authentication and shell ergonomics as first-class concerns.
  project-history:
    - >
      DigitalOcean created the public GitHub repository in May 2015. The README
      identifies doctl as a CLI for the DigitalOcean API and lists a broad command tree
      covering both early compute primitives and later platform services such as
      Kubernetes, Apps, databases, monitoring, registries, and VPCs.
  related-projects:
    - >
      doctl is tied to the DigitalOcean API and Control Panel. Its README also documents
      integration points with kubectl, Docker registry credentials, shell completion,
      and Docker Hub images.
  sources:
    - https://github.com/digitalocean/doctl
    - https://raw.githubusercontent.com/digitalocean/doctl/main/README.md
    - https://api.github.com/repos/digitalocean/doctl
    - https://github.com/digitalocean/doctl/releases/tag/v1.163.0
    - https://formulae.brew.sh/api/formula/doctl.json
  summary:
    - >
      doctl is DigitalOcean's official command-line interface for the DigitalOcean API.
      It is the package-manager-facing form of DigitalOcean cloud automation: a Go
      binary that exposes account, compute, database, Kubernetes, registry, app, VPC,
      and billing workflows from a terminal.
  timeline:
    - '2015: Public GitHub repository created.'
    - >
      2010s: README documents install routes across Homebrew, Snap, distro packages,
      Docker Hub, and GitHub releases.
    - >
      2026-06: v1.163.0 published with release assets for macOS, Linux, Windows,
      checksums, and source.
  usage:
    - >
      Users authenticate with `doctl auth init`, which stores API tokens and defaults in
      a YAML config file. The CLI is used both interactively and in scripts, often with
      JSON output, shell completion, multiple authentication contexts, and resource
      commands such as droplet listing, domain record creation, registry login, and
      Kubernetes configuration.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl after doctl saves a DigitalOcean Kubernetes kubeconfig; DigitalOcean
      documents the two tools as the standard workflow for connecting to and
      administering a cluster.
    rel: adjacent_workflow
    sources:
      - https://docs.digitalocean.com/products/kubernetes/how-to/connect-to-cluster/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:s3cmd
    reason: >
      Use s3cmd alongside doctl when managing DigitalOcean Spaces objects because doctl
      manages Spaces keys but DigitalOcean directs object uploads, downloads, and bucket
      operations to S3-compatible clients.
    rel: adjacent_workflow
    sources:
      - https://docs.digitalocean.com/reference/doctl/
      - https://docs.digitalocean.com/products/spaces/reference/s3cmd-usage/
category: cloud-infrastructure
package-manager:
  apk: doctl
  brew: doctl
  dnf: doctl
  macports: doctl
  nix: doctl
  pacman: doctl
  scoop: main/doctl
  winget: DigitalOcean.Doctl
package-manager-url: https://formulae.brew.sh/formula/doctl
license: Apache-2.0
tags:
  - api-client
  - cli
  - cloud
  - digitalocean
description: Command-line tool for DigitalOcean
executables:
  - doctl
provenance:
  formula: doctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
