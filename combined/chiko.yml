id: brew:chiko
display-name: Chiko
homepage: https://github.com/felangga/chiko
repo: https://github.com/felangga/chiko
docs:
  - https://github.com/felangga/chiko#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew, go install, source builds, and prebuilt release
      binaries. Homebrew formula metadata lists chiko 0.2.0 with modest install counts,
      indicating niche but packaged CLI adoption.
  package-nerd-significance:
    - >
      Chiko is package-nerd interesting as part of the modern Go single-binary TUI wave:
      it wraps grpcurl-style API testing in an interactive terminal app and ships
      through Homebrew, go install, source builds, and release binaries.
  project-history:
    - >
      The official README describes Chiko as a developer-friendly gRPC terminal
      interface built on grpcurl and tview. It focuses on server reflection, request
      metadata, payload generation, authorization, bookmarks, and importing or exporting
      grpcurl commands.
  related-projects:
    - grpcurl is named by the official README as an underlying gRPC command-line tool.
    - tview is named by the official README as the terminal UI library.
  sources:
    - https://formulae.brew.sh/formula/chiko
    - https://github.com/felangga/chiko#readme
  summary:
    - Chiko is a terminal user interface for testing and browsing gRPC APIs.
  timeline:
    - >
      2026: Official README documents Homebrew, Go install, source, and prebuilt binary
      installation.
    - '2026: Homebrew formula page lists stable chiko 0.2.0.'
  usage:
    - >
      Users run chiko, enter a gRPC server URL, configure authentication if needed,
      browse reflected services, generate a request payload, and send calls from the
      terminal UI.
related-packages:
  - id: brew:grpcurl
    reason: >
      Chiko is built with grpcurl and supports importing or exporting grpcurl commands,
      so grpcurl complements interactive exploration with scriptable command-line RPC
      calls.
    rel: adjacent_workflow
    sources:
      - https://github.com/felangga/chiko
      - https://github.com/fullstorydev/grpcurl
  - id: brew:evans
    reason: >
      Choose Evans when you want both a completion-oriented gRPC REPL and a stateless
      Unix-style CLI; choose Chiko for its full-screen terminal interface, bookmarks,
      and grpcurl interchange.
    rel: alternative
    sources:
      - https://github.com/ktr0731/evans
      - https://github.com/felangga/chiko
category: developer-tools
package-manager:
  brew: chiko
package-manager-url: https://formulae.brew.sh/formula/chiko
license: MIT
tags:
  - api-client
  - cli
  - go
  - grpc
  - grpc-client
  - tui
description: Ultimate Beauty gRPC Client for your Terminal
executables:
  - chiko
provenance:
  formula: chiko
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
