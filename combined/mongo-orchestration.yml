id: brew:mongo-orchestration
display-name: Mongo Orchestration
homepage: https://github.com/mongodb-labs/mongo-orchestration
repo: https://github.com/mongodb-labs/mongo-orchestration
docs:
  - https://github.com/mongodb-labs/mongo-orchestration/wiki
  - https://github.com/mongodb-labs/mongo-orchestration#readme
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/mongo-orchestration
    - https://github.com/mongodb-labs/mongo-orchestration
    - https://github.com/mongodb-labs/mongo-orchestration/wiki
  summary:
    - >
      Mongo Orchestration is a MongoDB Labs/10gen-era testing service for building
      disposable MongoDB topologies on one host. Its README describes it as an HTTP
      server with a REST API for creating and managing MongoDB configurations,
      explicitly aimed at testing MongoDB drivers rather than serving as a general
      database administration product.
  usage:
    - >
      In practice it starts and stops standalone mongod processes, replica sets, sharded
      clusters, shards, mongos routers, and replica-set members, then exposes those
      operations through REST endpoints. The companion mongo-launch executable covers a
      simpler local-server workflow. Its package-manager niche is narrow: Homebrew makes
      the driver-test orchestration daemon easy to install on developer machines, while
      the project itself was also distributed as a Python package via pip.
related-packages:
  - id: brew:mongo-c-driver
    reason: >
      Use the official C driver as the client under test while Mongo Orchestration
      provisions disposable standalone, replica-set, or sharded MongoDB configurations.
    rel: adjacent_workflow
    sources:
      - https://github.com/mongodb-labs/mongo-orchestration
      - https://github.com/mongodb/mongo-c-driver
category: developer-tools
package-manager:
  brew: mongo-orchestration
package-manager-url: https://formulae.brew.sh/formula/mongo-orchestration
license: Apache-2.0
tags:
  - cli
  - mongodb
  - orchestration
  - python
  - rest-api
  - testing
description: REST API to manage MongoDB configurations on a single host
executables:
  - mongo-launch
  - mongo-orchestration
provenance:
  formula: mongo-orchestration
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
