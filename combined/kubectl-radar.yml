id: brew:kubectl-radar
display-name: Radar
homepage: https://radarhq.io
repo: https://github.com/skyhook-io/radar
docs:
  - https://radarhq.io/docs
  - https://radarhq.io/product/mcp
config-file-location:
  unix:
    - ~/.radar/config.json
    - ~/.radar/settings.json
    - ~/.radar/clusters.json
    - ~/.kube/config
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      Radar is distributed as a kubectl plugin and standalone command through Homebrew,
      Krew, direct downloads, and other channels. It can run locally without installing
      cluster-side components or be deployed with Helm for shared access.
    - >
      The project later exposed its correlated Kubernetes view through a built-in MCP
      server, positioning it for use by coding agents as well as human operators.
  package-nerd-significance:
    - >
      Radar packages a browser UI, Kubernetes watchers, observability views, and an MCP
      server into a single Go binary. Its availability as both `kubectl radar` and
      `radar` makes it notable at the intersection of kubectl-plugin culture and local
      developer tooling.
    - >
      It is also an example of a newer package category in which operational tools
      expose structured, RBAC-aware context to AI agents instead of merely wrapping
      shell commands.
  project-history:
    - >
      Radar originated as an internal Skyhook tool for cluster debugging and
      demonstrations. Skyhook subsequently released it as an Apache-2.0 open-source
      project intended to provide a fast, local view of Kubernetes failures, topology,
      events, Helm resources, and GitOps state.
    - >
      The public project emphasizes a single native binary, no required account, no CRDs
      for local operation, and use of the operator's existing Kubernetes identity.
  related-projects:
    - kubectl
    - Krew
    - Kubernetes
    - Helm
    - Argo CD
    - Flux CD
    - Model Context Protocol
  sources:
    - https://github.com/skyhook-io/radar#readme
    - https://radarhq.io/blog/introducing-radar-modern-kubernetes-visibility
    - https://radarhq.io/changelog
    - https://radarhq.io/product/mcp
  summary:
    - >
      Radar is an open-source Kubernetes user interface and kubectl plugin from Skyhook.
      It combines cluster visualization and troubleshooting features with a built-in MCP
      server for AI agents.
  timeline:
    - >
      2026-01-01: Skyhook publicly introduced Radar as an open-source Kubernetes
      visibility tool.
    - '2026-02-17: The official changelog recorded MCP server support for AI-tool integration.'
    - >
      2026-06-17: The changelog recorded expanded MCP configuration and cloud OAuth
      connectivity.
  usage:
    - >
      Operators run `kubectl radar` or `radar` to open a local browser interface against
      the active kubeconfig context. A different kubeconfig can be selected with
      `--kubeconfig`.
    - >
      The UI is used to inspect resources, topology, failures, events, diffs, Helm
      releases, GitOps systems, traffic, certificates, costs, and audit information.
    - >
      Its localhost MCP endpoint can be registered with supported AI clients so agents
      can query correlated cluster state. The server respects the kubeconfig identity's
      Kubernetes RBAC permissions.
related-packages:
  - id: cask:headlamp
    reason: >
      Choose Headlamp when you want an official Kubernetes SIG UI project centered on
      extensibility and plugin-built experiences; choose Radar for integrated
      troubleshooting views and a built-in MCP server.
    rel: alternative
    sources:
      - https://radarhq.io/blog/introducing-radar-modern-kubernetes-visibility
      - https://headlamp.dev/
  - id: cask:freelens
    reason: >
      Choose FreeLens when you prefer a community-maintained, free Kubernetes desktop
      IDE descended from the Lens interface; Radar instead emphasizes a native local
      binary, correlated operational evidence, and MCP.
    rel: alternative
    sources:
      - https://radarhq.io/blog/introducing-radar-modern-kubernetes-visibility
      - https://github.com/freelensapp/freelens
  - id: cask:lens
    reason: >
      Choose Lens for its established desktop Kubernetes IDE and commercial agent
      platform; Radar is the Apache-licensed local-first option with no account required
      for OSS use.
    rel: alternative
    sources:
      - https://radarhq.io/blog/introducing-radar-modern-kubernetes-visibility
      - https://lenshq.io/
category: cloud-infrastructure
package-manager:
  brew: kubectl-radar
package-manager-url: https://formulae.brew.sh/formula/kubectl-radar
license: Apache-2.0
tags:
  - cli
  - cluster-management
  - devops
  - kubectl-plugin
  - kubernetes
  - mcp-server
  - observability
description: Missing open-source Kubernetes UI with a built-in MCP server for AI agents
executables:
  - kubectl-radar
provenance:
  formula: kubectl-radar
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
