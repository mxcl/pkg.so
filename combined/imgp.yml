id: brew:imgp
display-name: imgp
homepage: https://github.com/jarun/imgp
repo: https://github.com/jarun/imgp
docs:
  - https://github.com/jarun/imgp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      imgp spread beyond Homebrew into several Linux and cross-platform package channels
      listed in the input metadata, including Debian, Ubuntu, Fedora, Nix, and openSUSE.
      PyPI metadata lists imgp as a Python package, and the README links packaging
      status plus release packages for multiple distributions.
    - >
      Repository metadata shows roughly 1k GitHub stars, while Homebrew analytics show
      modest but steady formula installs. That footprint is consistent with a practical
      Unix image utility: useful for people who batch-resize photos, screenshots, and
      media folders, but not a general-purpose image-processing framework.
  package-nerd-significance:
    - >
      imgp matters in package-manager culture because it is the kind of compact CLI that
      replaces GUI extensions and ad hoc ImageMagick loops with a single installable
      command. It also reflects the practical packaging appeal of Python-plus-Pillow
      tools: easy to distribute, scriptable, and friendly to desktop and shell
      workflows.
  project-history:
    - >
      The GitHub repository was created on 2016-08-08. Its early releases used the name
      imgd, with v1.0 published on 2016-08-16 and v2.0 on 2016-09-30; later releases
      settled on imgp as the package identity. The README positions imgp as a stronger,
      file-manager-independent replacement for the Nautilus Image Converter extension,
      with speed and desktop portability as central goals.
    - >
      Across the 2.x series, imgp accumulated features typical of serious batch-photo
      tooling: adaptive resizing, rotation, JPEG quality controls, PNG-to-JPEG
      conversion, overwrite and recursive modes, optimization, EXIF erasure, and shell
      completions. The README also documents use with Pillow and optional Pillow-SIMD
      for SIMD acceleration.
  related-projects:
    - >
      The README compares imgp with the Nautilus Image Converter extension and
      ImageMagick's convert utility. It also notes integration from the nnn file manager
      through a script for batch image resizing.
  sources:
    - https://formulae.brew.sh/formula/imgp
    - https://github.com/jarun/imgp
    - https://github.com/jarun/imgp/releases
    - https://pypi.org/project/imgp/
  summary:
    - >
      imgp is a Python command-line batch image resizer and rotator by Arun Prakash
      Jana. The project emphasizes fast bulk processing of JPEG and PNG files, recursive
      directory handling, EXIF-related options, shell completion, and minimal
      dependencies.
  timeline:
    - '2016-08-08: GitHub repository created.'
    - '2016-08-16: v1.0 release published under the imgd release name.'
    - '2016-09-30: v2.0 release published.'
    - '2019-12-21: v2.7 release published and later represented on PyPI.'
    - '2023-09-10: v2.9 release published.'
  usage:
    - >
      The README documents command forms for resizing by resolution, percentage, or
      megapixel target; rotating by degrees; recursive traversal; overwriting or
      suffixing output files; converting PNG to JPEG; and processing the working
      directory when no path is supplied. Operational notes warn about lossy resize and
      rotate operations, overwrite behavior, and repeated processing of generated files.
related-packages:
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick when you need a much broader programmable image-processing
      suite; choose imgp for a focused batch resize-and-rotate interface built around
      Pillow.
    rel: alternative
    sources:
      - https://github.com/jarun/imgp
      - https://imagemagick.org/command-line-processing/
  - id: brew:nnn
    reason: >
      nnn provides a documented file-manager script that invokes imgp for interactive
      batch image resizing from a terminal workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/jarun/imgp
      - https://github.com/jarun/nnn
category: media
package-manager:
  brew: imgp
  debian: imgp
  dnf: imgp
  nix: imgp
  ubuntu: imgp
  zypper: imgp
package-manager-url: https://formulae.brew.sh/formula/imgp
license: GPL-3.0-or-later
tags:
  - batch-processing
  - cli
  - image-resizing
  - image-rotation
  - python
description: High-performance CLI batch image resizer & rotator
executables:
  - imgp
provenance:
  formula: imgp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
