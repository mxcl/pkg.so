id: brew:dialog
display-name: dialog
homepage: https://invisible-island.net/dialog/
repo: null
docs:
  - https://invisible-island.net/dialog
  - https://invisible-island.net/dialog/manpage/dialog.html
config-file-location:
  unix:
    - $DIALOGRC
    - ~/.dialogrc
    - /etc/dialogrc
credentials-file-location: null
history:
  adoption-history:
    - >
      dialog became part of Unix installer and system-script culture because shell
      scripts could ask structured questions without depending on a graphical desktop.
      The official history notes FreeBSD's fork and its use around sysinstall, and the
      project page compares related tools such as whiptail, Xdialog, gdialog, zenity,
      kdialog, and bsddialog.
  package-nerd-significance:
    - >
      dialog matters to package people because it is one of the small tools that makes
      source builds, installers, and distribution scripts feel interactive while still
      being plain shell. Its long compatibility story explains why many packages also
      know about whiptail and other dialog-like front ends.
  project-history:
    - >
      The official history traces dialog to Savio Lam's initial 0.1 release on
      1993-12-17, when the program had inputbox, msgbox, and yesno options. Through 1994
      and 1995, contributors added checklist, menu, textbox, color, shadows, radiolist,
      gauge, mouse support, and related features.
  related-projects:
    - >
      Official related and compatibility discussion covers lxdialog, Xdialog, whiptail,
      gdialog, zenity, kdialog, and bsddialog.
  sources:
    - https://invisible-island.net/dialog/
    - https://invisible-island.net/dialog/dialog.html
    - https://invisible-island.net/dialog/manpage/dialog.html
    - https://invisible-island.net/dialog/CHANGES.html
  summary:
    - >
      dialog is the classic curses-based program for showing message boxes, menus,
      gauges, forms, and other text user-interface widgets from shell scripts.
  timeline:
    - '1993: dialog 0.1 released by Savio Lam.'
    - >
      1994: checklist, menu, color, shadow, radiolist, and gauge-era functionality
      appeared across early releases and forks.
    - '2001: Vincent Stemen sent patches that were folded into ongoing dialog snapshots.'
    - >
      2012: dialog 1.2-era widget coverage and compatibility history were documented on
      the official site.
  usage:
    - >
      The manpage describes dialog as a program that lets scripts present questions or
      display messages using dialog boxes. Common package-manager users install it so
      shell scripts can use widgets such as checklist, menu, gauge, inputbox,
      passwordbox, textbox, and yesno.
related-packages:
  - id: brew:gum
    reason: >
      Choose Gum for modern styled shell prompts, fuzzy selection, spinners, tables, and
      composable stdout workflows; choose dialog for the established curses widget
      interface and compatibility with older installer scripts.
    rel: alternative
    sources:
      - https://invisible-island.net/dialog/manpage/dialog.html
      - https://github.com/charmbracelet/gum
category: developer-tools
package-manager:
  apk: dialog
  brew: dialog
  debian: dialog
  dnf: dialog
  macports: dialog
  nix: dialog
  pacman: dialog
  ubuntu: dialog
  zypper: dialog
package-manager-url: https://formulae.brew.sh/formula/dialog
license: LGPL-2.1-or-later
tags:
  - cli
  - curses
  - dialogs
  - shell-scripting
  - terminal-ui
  - widgets
description: Display user-friendly message boxes from shell scripts
executables:
  - dialog
  - dialog-config
provenance:
  formula: dialog
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
