history:
  adoption-history:
    - >
      iBetterCharge occupies a small Mac utility niche for users who want an iPhone
      battery warning on their desktop. Softorino currently distributes it through the
      company's Universal License collection.
  package-nerd-significance:
    - >
      The application is representative of narrowly focused macOS menu-bar utilities
      packaged as Homebrew casks: it connects a desktop workflow to Apple mobile-device
      status without requiring command-line setup.
  project-history:
    - >
      Softorino developed iBetterCharge as a macOS utility for monitoring an iPhone's
      battery over Wi-Fi and issuing desktop reminders when the device needs charging.
  related-projects:
    - >
      The product is distributed alongside Softorino's other macOS applications under
      its Universal License.
  sources:
    - https://softorino.com/ibettercharge
  summary:
    - >
      iBetterCharge is a proprietary Softorino utility that displays an iPhone's battery
      level on a Mac and sends charging notifications.
  timeline:
    - >
      Current product era: Softorino distributes iBetterCharge for macOS as part of its
      Universal License catalogue.
  usage:
    - >
      Users connect an iPhone and Mac over Wi-Fi, leave iBetterCharge running on the
      Mac, and receive desktop notifications when the phone's battery reaches a level
      that warrants charging.
    - >
      The official product page does not document a standalone configuration file or
      credentials file.
