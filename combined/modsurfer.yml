id: brew:modsurfer
display-name: modsurfer
homepage: https://dylibso.com/products/modsurfer/
repo: https://github.com/dylibso/modsurfer
docs:
  - https://dylibso.com/products/modsurfer
  - https://github.com/dylibso/modsurfer#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The CLI centers on checkfiles: users generate or write a YAML policy describing
      required module properties, then validate a compiled `.wasm` file against
      expectations such as imports, exports, WASI use, function signatures, binary size,
      and cyclomatic-complexity risk. The product page and README also describe GUI and
      service-oriented workflows for searching module metadata, browsing hashes and
      function names, auditing a stack of modules, and triaging issues in WebAssembly
      components.
  sources:
    - https://dylibso.com/blog/hello-world/
    - https://dylibso.com/products/modsurfer/
    - https://formulae.brew.sh/formula/modsurfer
    - https://github.com/dylibso/modsurfer
    - https://raw.githubusercontent.com/dylibso/modsurfer/main/README.md
  summary:
    - >
      Modsurfer is Dylibso's WebAssembly analysis and validation tool, released as part
      of the company's effort to make compiled `.wasm` modules easier to inspect, track,
      and govern. Dylibso introduced a beta version as a "system of record" for
      WebAssembly modules, aimed at teams running Wasm in infrastructure or debugging
      compiled modules that would otherwise be opaque binary artifacts.
  usage:
    - >
      In package-manager terms, the Homebrew formula exposes the `modsurfer` executable
      for local validation and investigation. It belongs to the WebAssembly supply-chain
      and operations niche rather than the compiler/runtime niche: it does not build
      Wasm modules, but helps teams understand and enforce properties of the modules
      they already build or consume.
related-packages: []
category: security
package-manager:
  brew: modsurfer
package-manager-url: https://formulae.brew.sh/formula/modsurfer
license: Apache-2.0
tags:
  - audit
  - binary-analysis
  - cli
  - security
  - wasm
  - webassembly
description: Validate, audit and investigate WebAssembly binaries
executables:
  - modsurfer
provenance:
  formula: modsurfer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
