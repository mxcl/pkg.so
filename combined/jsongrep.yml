id: brew:jsongrep
display-name: jsongrep
homepage: https://github.com/micahkepe/jsongrep
repo: https://github.com/micahkepe/jsongrep
docs:
  - https://github.com/micahkepe/jsongrep#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026 the README documented installation through Homebrew, Winget, Scoop, and
      Cargo, and the input package facts list additional Nix and zypper packaging. That
      is unusually broad distribution for a young structured-data query CLI.
  package-nerd-significance:
    - >
      jsongrep is significant as a modern Rust take on the `grep for structured data`
      idea. Package nerds care because it joins jq, JSONPath, JMESPath, gron, and jql in
      the crowded but still active space of command-line data inspection.
  project-history:
    - >
      Micah Kepe's repository was created on August 8, 2025. The README frames the
      project as a path-query tool rather than a general transformation language: users
      describe sets of paths through a document tree, and the engine finds matches.
    - >
      The changelog shows rapid early iteration in 2026, including version 0.5.0 and
      0.5.1 on February 14, 2026 and version 0.9.0 on April 18, 2026. The 0.9.0 entry
      added an interactive WASM playground and a porcelain output mode.
  related-projects:
    - >
      jsongrep is directly compared with jq in its README and blog. It is also adjacent
      to JSONPath, JMESPath, jql, gron, and Rust structured-data parsers for YAML, TOML,
      CBOR, and MessagePack.
  sources:
    - https://api.github.com/repos/micahkepe/jsongrep
    - https://crates.io/crates/jsongrep
    - https://formulae.brew.sh/formula/jsongrep
    - https://github.com/micahkepe/jsongrep
    - https://github.com/micahkepe/jsongrep/blob/main/CHANGELOG.md
    - https://micahkepe.com/blog/jsongrep/
  summary:
    - >
      jsongrep is a Rust command-line tool and library for querying JSON, YAML, TOML,
      JSONL, CBOR, and MessagePack documents with regular path expressions. Its
      executable is `jg`.
  timeline:
    - '2025-08-08: The GitHub repository was created.'
    - '2026-02-14: The changelog recorded releases 0.5.0 and 0.5.1.'
    - >
      2026-02-28: The author published a technical blog post about jsongrep's query
      model and benchmarks.
    - '2026-04-18: Version 0.9.0 added the WASM playground and porcelain output.'
  usage:
    - >
      The README examples use `jg` to query nested paths, match fixed field names at any
      depth with `-F`, compare common path searches with jq, and pretty-print JSON.
      Kepe's blog explains the model as regular expressions over tree edges rather than
      text characters.
related-packages:
  - id: brew:jq
    reason: >
      Choose jq for general filtering, mapping, and transformation; choose jsongrep for
      declarative path matching, grep-like file traversal, and locating each match
      within a document.
    rel: alternative
    sources:
      - https://github.com/micahkepe/jsongrep#jsongrep-vs-jq
      - https://jqlang.org/
  - id: brew:jql
    reason: >
      Choose jql for a compact selector language that transforms JSON input back into
      JSON; choose jsongrep for regular path expressions and native querying across
      JSON, YAML, TOML, CBOR, and MessagePack.
    rel: alternative
    sources:
      - https://github.com/micahkepe/jsongrep
      - https://github.com/yamafaktory/jql
category: developer-tools
package-manager:
  brew: jsongrep
  nix: jsongrep
  scoop: main/jsongrep
  winget: micahkepe.jsongrep
  zypper: jsongrep
package-manager-url: https://formulae.brew.sh/formula/jsongrep
license: MIT
tags:
  - cli
  - grep
  - json
  - query
  - toml
  - yaml
description: Query tool for JSON, YAML, TOML, and other structured formats
executables:
  - jg
provenance:
  formula: jsongrep
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
