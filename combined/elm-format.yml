id: brew:elm-format
display-name: elm-format
homepage: https://github.com/avh4/elm-format
repo: https://github.com/avh4/elm-format
docs:
  - https://github.com/avh4/elm-format#readme
config-file-location:
  unix:
    - elm.json
    - elm-package.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption was driven less by a standalone ecosystem and more by editor and workflow
      integration. The README documents format-on-save support across Atom, Vim, Emacs,
      Visual Studio Code, Sublime Text, JetBrains IDEs, and other tooling, showing that
      elm-format became part of the everyday editor setup for Elm programmers.
  package-nerd-significance:
    - >
      For package maintainers, elm-format matters because it makes source diffs more
      mechanical and keeps package examples, source files, and contributions visually
      consistent across the Elm ecosystem. It is a small CLI whose importance comes from
      convention: once a formatter is expected, packages that use it are easier to
      review and compare.
  project-history:
    - >
      The project grew around Elm's transition from an experimental FRP language into a
      more conventional frontend language with project files and a stable command-line
      toolchain. Its releases track Elm syntax and project-file eras: the README still
      documents both Elm 0.18's elm-package.json and Elm 0.19's elm.json, and the
      release history includes Elm 0.19 alpha and 0.8.x releases.
  related-projects:
    - >
      elm-format follows the same convention-over-style-debate niche as gofmt, but for
      Elm source files. It is also related to Elm editor plugins and Prettier's Elm
      integration, which use it as part of save-time or pipeline formatting.
  sources:
    - https://github.com/avh4/elm-format#readme
    - https://github.com/avh4/elm-format/releases
  summary:
    - >
      elm-format is the standard formatter used by many Elm projects to normalize source
      layout in the style of gofmt. Its official README presents it as a formatter for
      Elm code based on the Elm style guide, with the practical goal of removing
      formatting debates from code review.
  timeline:
    - '2017: 0.7.0-exp release appears in the GitHub release history.'
    - '2018: 0.8.0 release aligns the formatter with the Elm 0.19 transition.'
    - '2023: 0.8.7 release continues maintenance for the Elm 0.19-era formatter.'
    - '2025: 0.8.8 release is published.'
  usage:
    - >
      The typical usage is direct and project-local: run elm-format on a file or
      directory, optionally with --yes to overwrite, from a directory containing
      elm.json or elm-package.json. The tool is also commonly invoked by editor plugins
      on save and by formatter integrations such as Prettier plugins.
related-packages:
  - id: brew:elm
    reason: >
      elm-format operates on source projects compiled by Elm and uses elm.json or the
      legacy elm-package.json to determine the applicable language era.
    rel: adjacent_workflow
    sources:
      - https://github.com/avh4/elm-format#readme
      - https://guide.elm-lang.org/get_started
category: developer-tools
package-manager:
  brew: elm-format
package-manager-url: https://formulae.brew.sh/formula/elm-format
license: BSD-3-Clause
tags:
  - cli
  - code-formatter
  - developer-tool
  - elm
  - source-formatting
description: Elm source code formatter, inspired by gofmt
executables:
  - elm-format
provenance:
  formula: elm-format
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
