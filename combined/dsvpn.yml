id: brew:dsvpn
display-name: DSVPN
homepage: https://github.com/jedisct1/dsvpn
repo: https://github.com/jedisct1/dsvpn
docs:
  - https://github.com/jedisct1/dsvpn#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DSVPN is distributed through GitHub releases and Homebrew, with other
      package-manager metadata in the input showing availability in Nix and
      openSUSE-style zypper packaging. Homebrew packages release 0.1.5 from the GitHub
      tag.
    - >
      The README records a small ecosystem around it: an iOS client, systemd service
      files, an Ansible role, OpenMPTCProuter support, and a Docker image. Those related
      projects are stronger evidence of practical use than raw package analytics, which
      are modest in Homebrew.
  package-nerd-significance:
    - >
      DSVPN is package-nerd catnip because it is the anti-platform VPN package: a tiny
      command, small source tree, no external dependencies, no daemon ecosystem, and
      enough crypto seriousness to avoid feeling like a toy.
    - >
      It also captures a recurring package-manager need: a tool users can install
      quickly on constrained servers or routers when the usual VPN stack is too much for
      the immediate network problem.
  project-history:
    - >
      The GitHub repository was created in July 2019, and the first public release,
      0.1.0, followed later that month. The README explains the author's motivation:
      needing a VPN that worked where only TCP ports such as 80 or 443 were open, while
      avoiding the setup complexity or protocol tradeoffs of OpenVPN, WireGuard over
      UDP, sshuttle, GloryTun, and related tools.
    - >
      The project is explicit about its ceiling: it solves the author's simple use case,
      promises no guarantees, and does not plan broad feature expansion. That design
      stance is part of its history; DSVPN is intentionally a small readable C codebase
      rather than a general VPN platform.
  related-projects:
    - dsvpn-ios is named by the README as an iOS client.
    - >
      Charm is named by the README as the standalone project for DSVPN's cryptographic
      primitives.
    - >
      WireGuard, GloryTun, VTUN-libsodium, OpenVPN, and sshuttle are named by the README
      as alternatives or comparisons.
  sources:
    - https://github.com/jedisct1/dsvpn
    - https://api.github.com/repos/jedisct1/dsvpn
    - https://api.github.com/repos/jedisct1/dsvpn/releases
    - https://formulae.brew.sh/api/formula/dsvpn.json
  summary:
    - >
      DSVPN is 'Dead Simple VPN', a tiny TCP-based VPN by Frank Denis for the common
      case of connecting a client through an untrusted or restricted network to a server
      and then to the Internet. It is deliberately small, dependency-light, and
      configured by command-line arguments plus a shared key file rather than a fixed
      config directory.
  timeline:
    - '2019-07: The DSVPN GitHub repository is created.'
    - '2019-07: GitHub releases publish 0.1.0.'
    - '2019-08: Releases 0.1.1 through 0.1.3 follow quickly.'
    - '2019-12: Release 0.1.4 is published.'
    - '2025-12: Release 0.1.5 is published and packaged by Homebrew.'
  usage:
    - >
      Usage starts by creating a 32-byte shared secret with `dd`, copying it to both
      ends, then running `dsvpn server` on the server and `dsvpn client` on the client.
      Optional arguments cover port, tunnel interface, tunnel IPs, external IP, and
      gateway IP, with `auto` defaults for the simple path.
    - >
      The README emphasizes no configuration file and no post-configuration; the secret
      key has a user-chosen path, so there is no stable credential-file location for
      metadata purposes.
related-packages:
  - id: brew:wireguard-tools
    reason: >
      Choose WireGuard for a modern UDP-based VPN with its established
      interface-management tooling; choose DSVPN when TCP traversal and a much narrower
      setup are the deciding requirements.
    rel: alternative
    sources:
      - https://github.com/jedisct1/dsvpn#why
      - https://www.wireguard.com/quickstart/
  - id: brew:openvpn
    reason: >
      Choose OpenVPN when its mature, extensively configurable VPN platform is needed;
      DSVPN is aimed at the smaller shared-key TCP-tunnel use case.
    rel: alternative
    sources:
      - https://github.com/jedisct1/dsvpn#why
      - https://openvpn.net/community-resources/
  - id: brew:sshuttle
    reason: >
      Choose sshuttle when SSH access and transparent TCP proxying are sufficient; DSVPN
      additionally carries non-TCP traffic through a full tunnel.
    rel: alternative
    sources:
      - https://github.com/jedisct1/dsvpn#why
      - https://sshuttle.readthedocs.io/
category: networking
package-manager:
  brew: dsvpn
  nix: dsvpn
  zypper: dsvpn
package-manager-url: https://formulae.brew.sh/formula/dsvpn
license: MIT
tags:
  - cli
  - encryption
  - networking
  - tunneling
  - vpn
description: Dead Simple VPN
executables:
  - dsvpn
provenance:
  formula: dsvpn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
