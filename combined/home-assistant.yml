id: cask:home-assistant
display-name: Home Assistant
homepage: https://companion.home-assistant.io/
repo: https://github.com/home-assistant/iOS
docs:
  - https://companion.home-assistant.io/docs/core
  - https://companion.home-assistant.io/docs/macos
  - https://companion.home-assistant.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The Apple companion app grew from an iOS client into a shared iOS and macOS
      codebase. Official documentation now treats macOS as a supported platform across
      features such as app events, sharing, theming, URL handling, notifications,
      sensors, and server control.
  package-nerd-significance:
    - >
      The cask packages a native desktop endpoint for the larger open-source Home
      Assistant ecosystem. It is useful to package-manager users who want desktop
      installation and upgrades without relying solely on the Mac App Store, while
      retaining integration with a self-hosted Home Assistant server.
  project-history:
    - >
      Home Assistant's Apple companion application is developed publicly by the Home
      Assistant project. The macOS application shares the official `home-assistant/iOS`
      repository with the iPhone, iPad, Apple Watch, and related Apple-platform clients.
  related-projects:
    - Home Assistant Core provides the automation server to which the companion app connects.
    - >
      The same official repository produces the Home Assistant clients for Apple's other
      platforms.
  sources:
    - https://companion.home-assistant.io/
    - https://companion.home-assistant.io/docs/core/
    - https://github.com/home-assistant/iOS
  summary:
    - >
      Home Assistant for macOS is the official Apple-platform companion client for
      viewing and controlling Home Assistant servers and exposing Mac state as
      automation sensors.
  timeline:
    - '2017: The official Apple companion-app repository began publishing releases.'
    - >
      2020: The project announced a native macOS companion application through its
      Apple-platform development effort.
    - >
      2026: The application remains actively released from the shared official
      Apple-client repository.
  usage:
    - >
      Users connect the app to one or more Home Assistant servers to access dashboards,
      control entities, receive actionable notifications, and send device sensor state.
      On macOS it also offers desktop-specific facilities such as a customizable toolbar
      and sensors reporting active, network, battery, storage, and display state.
category: productivity
package-manager:
  brew-cask: home-assistant
package-manager-url: https://formulae.brew.sh/cask/home-assistant
tags:
  - home-automation
  - macos
  - notifications
  - self-hosted
  - sensors
  - smart-home
description: Companion app for Home Assistant home automation software
applications:
  - Home Assistant.app
provenance:
  cask: home-assistant
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
