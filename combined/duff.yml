id: brew:duff
display-name: duff
homepage: https://github.com/elmindreda/duff
repo: https://github.com/elmindreda/duff
docs:
  - https://github.com/elmindreda/duff#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      duff became a portable Unix utility rather than a large ecosystem project. The
      README records successful builds across Linux distributions, BSDs, Darwin and Mac
      OS X, NetBSD, SunOS, Cygwin, and Red Hat Enterprise Linux, and package metadata
      shows it still exists in Homebrew, Debian, Fedora, MacPorts, Nix, and Ubuntu.
  package-nerd-significance:
    - >
      duff is interesting as a compact, old-school duplicate finder that survived
      through distro packaging. It belongs to the era before newer Rust and Go disk
      tools, when small C utilities with man pages, autotools, and portable Unix build
      notes were the normal package-manager substrate.
  project-history:
    - >
      The tool began as version 0.1 under the name duplicate, then version 0.2 became
      the first release named duff but was only shared with a few people in early 2005.
      Version 0.3 became the first official release on November 22, 2005 after the
      author found a suitably licensed SHA1 implementation.
    - >
      Version 0.4, released January 13, 2006, was described by the project as the first
      stable everyday-use release. The 0.5 line in 2011 and 2012 restarted development
      with minor features, bug fixes, optimizations, improved default thorough-mode
      output, and message-prefix cleanup.
  related-projects:
    - fdupes and rdfind are adjacent duplicate-file finders in Unix package collections.
    - >
      Modern disk-maintenance tools overlap with duff's cleanup use case, but duff's
      identity remains the narrow duplicate-file finder.
  sources:
    - https://github.com/elmindreda/duff
    - https://github.com/elmindreda/duff#readme
    - https://formulae.brew.sh/formula/duff
  summary:
    - >
      duff is an older Unix command-line duplicate-file finder that compares candidate
      files using SHA-family message digests. Its history is unusually well documented
      in its README, including its pre-release name, early private circulation, first
      official release, and later maintenance releases.
  timeline:
    - '2005: Version 0.2, the first named duff release, circulated privately.'
    - '2005: Version 0.3 became the first official release on November 22.'
    - '2006: Version 0.4 was considered stable enough for everyday use.'
    - '2011: Version 0.5 restarted development with minor features and fixes.'
    - '2012: Version 0.5.2 added optimizations and default behavior changes.'
  usage:
    - >
      The common use is scanning one or more paths for duplicate files, with duff
      grouping duplicate candidates after digest-based comparison. The project ships a
      traditional man page and autotools build, matching the packaging style of
      mid-2000s Unix command-line utilities.
related-packages:
  - id: brew:fdupes
    reason: >
      Choose fdupes when duplicate discovery should include maintained interactive
      deletion, cache support, size filters, and additional safety controls around
      cleanup.
    rel: alternative
    sources:
      - https://github.com/elmindreda/duff
      - https://github.com/adrianlopezroche/fdupes#readme
  - id: brew:rdfind
    reason: >
      Choose rdfind when you want duplicate results to drive explicit deletion or
      replacement with hard links or symbolic links, including deduplication of backup
      trees.
    rel: alternative
    sources:
      - https://github.com/elmindreda/duff
      - https://rdfind.pauldreik.se/rdfind.1.html
category: system
