history:
  adoption-history:
    - >
      Airflow serves users who keep video files locally but want a polished route to
      televisions and streaming receivers without maintaining a media server. Its
      support for both Apple and Google receiver ecosystems gives it a cross-platform
      niche on macOS and Windows.
  package-nerd-significance:
    - >
      Airflow packages device discovery, codec negotiation, subtitle handling, and
      selective hardware-accelerated transcoding into a desktop application. For package
      users, it is a focused alternative to running a general-purpose media server when
      the goal is direct local-network playback.
  project-history:
    - >
      BitCave developed Airflow as a desktop application for streaming local media to
      Apple TV, Chromecast, and compatible televisions. The product grew beyond basic
      playback to include 4K HDR and HEVC handling, multichannel audio, subtitle search
      and OCR, playlists, playback-position tracking, network speed testing, and mobile
      remote-control applications.
  related-projects:
    - Apple TV and AirPlay receivers are supported playback targets.
    - Chromecast and Google Cast televisions are supported playback targets.
    - Airflow Remote is the companion mobile remote-control application.
  sources:
    - 'Official performance guide: https://airflow.app/troubleshooting/performance/'
    - 'Official product site: https://airflow.app/'
    - 'Official troubleshooting documentation: https://airflow.app/troubleshooting/'
  summary:
    - >
      Airflow is BitCave's macOS and Windows application for streaming local media files
      to Apple TV, Chromecast, and compatible AirPlay or Google Cast televisions.
  timeline:
    - >
      2020s: Airflow's official site documented support for 4K HDR HEVC streaming,
      subtitle OCR, multichannel audio, and mobile remote control.
  usage:
    - >
      Users add local media to Airflow, select a receiver on the local network, and
      start playback. Airflow passes compatible streams through directly and transcodes
      incompatible video when needed; its troubleshooting tools address multicast
      discovery, firewalls, VPN interference, and local-network throughput.
