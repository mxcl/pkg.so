id: brew:mdq
display-name: mdq
homepage: https://github.com/yshavit/mdq
repo: https://github.com/yshavit/mdq
docs:
  - https://github.com/yshavit/mdq/wiki
  - https://github.com/yshavit/mdq#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions list Homebrew, Docker Hub, GitHub release
      binaries, workflow build artifacts, and `cargo install --git`; the input
      package-manager facts also show availability through Homebrew, Nix, Scoop, and
      Winget.
    - >
      GitHub repository metadata showed rapid attention for a young Markdown utility,
      with more than a thousand stars and a public wiki, Pages site, and discussions
      enabled by 2026.
  package-nerd-significance:
    - >
      mdq is significant because it treats Markdown as queryable structured data,
      filling a niche between `grep` and full parsers. For package users, the appeal is
      familiar jq-like composition applied to README files, issue bodies, changelogs,
      runbooks, and generated documentation.
  project-history:
    - >
      The public repository was created on 2024-05-25. Its README frames the project
      around a recurring automation problem: GitHub pull requests, issues, and templates
      are Markdown documents, and teams often need structured checks that are less
      brittle than regular expressions.
    - >
      The project publishes both a CLI and a Rust library. The README points library
      users to crates.io and docs.rs, while CLI users can install through Homebrew,
      Docker images, release binaries, or Cargo.
  related-projects:
    - >
      The project explicitly positions itself by analogy to jq, but for Markdown rather
      than JSON.
    - >
      The README links to the mdq playground, wiki tutorial, full user manual, crates.io
      package, and docs.rs library documentation.
  sources:
    - https://api.github.com/repos/yshavit/mdq
    - https://docs.rs/mdq/latest/mdq/
    - https://github.com/yshavit/mdq#readme
    - https://github.com/yshavit/mdq/wiki
    - source_facts.package-manager
  summary:
    - >
      mdq is a Rust command-line and library project that describes itself as `jq for
      Markdown`: it selects Markdown elements using a query language that mirrors
      Markdown syntax.
  timeline:
    - '2024: Public GitHub repository created.'
    - >
      2024: README documented Homebrew, Docker, release binaries, and Cargo installation
      paths.
    - >
      2026: GitHub metadata showed active repository maintenance and broad
      package-manager availability in the input facts.
  usage:
    - >
      mdq reads Markdown from stdin or files and applies filters such as heading
      selectors, list selectors, task-list selectors, link selectors, table selectors,
      front matter selectors, and regex text matches.
    - >
      The README examples show CI and workflow uses: checking that a PR checklist item
      is completed, extracting ticket links from a PR body, and reducing large Markdown
      tables to selected rows or columns.
related-packages: []
category: developer-tools
package-manager:
  brew: mdq
  nix: mdq
  scoop: main/mdq
  winget: Whiteknight.Mdq
package-manager-url: https://formulae.brew.sh/formula/mdq
license: Apache-2.0 OR MIT
tags:
  - cli
  - jq
  - markdown
  - query
  - rust
description: Like jq but for Markdown
executables:
  - mdq
provenance:
  formula: mdq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
