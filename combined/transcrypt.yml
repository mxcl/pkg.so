id: brew:transcrypt
display-name: transcrypt
homepage: https://github.com/elasticdog/transcrypt
repo: https://github.com/elasticdog/transcrypt
docs:
  - https://github.com/elasticdog/transcrypt#readme
config-file-location:
  unix:
    - <repository>/.gitattributes
    - <repository>/.git/config
credentials-file-location:
  unix: <repository>/.git/config
history:
  adoption-history:
    - >
      transcrypt's official installation notes document both manual installation and
      package-manager availability. The project lists Arch Linux, Heroku buildpacks,
      NixOS, OS X via Homebrew, and FreeBSD packages, which points to adoption by
      developers who want repository-local encryption available through standard system
      tooling.
  package-nerd-significance:
    - >
      For package nerds, transcrypt is a compact alternative to heavier
      secret-management systems when the requirement is simply encrypted files in Git.
      Because it is a single script using Bash, Git, and OpenSSL, distribution packages
      mostly provide convenient installation, shell completion, and man-page style
      polish rather than a runtime service.
  project-history:
    - >
      The project was built around Git clean and smudge filters, following the same
      broad model as git-crypt and git-encrypt while emphasizing usability and safety.
      Its README highlights that it is a Bash script, uses OpenSSL symmetric ciphers,
      does not need to remain installed after repository configuration, and adds checks
      to avoid clobbering existing configuration.
    - >
      Official release metadata shows active maintenance from at least the 1.x era in
      2018 through the 2.x line, with v2.3.2 released in 2026.
  related-projects:
    - >
      The README explicitly compares transcrypt with git-crypt and git-encrypt, all of
      which use Git filters to encrypt selected repository contents.
  sources:
    - https://api.github.com/repos/elasticdog/transcrypt/releases
    - https://github.com/elasticdog/transcrypt#readme
    - https://github.com/elasticdog/transcrypt/blob/main/INSTALL.md
  summary:
    - >
      transcrypt is a Bash-based Git encryption helper that configures transparent
      encryption and decryption for selected files in a repository. It is aimed at teams
      that want secrets, private keys, or other sensitive files versioned without
      exposing plaintext in remotes.
  timeline:
    - '2015: The install guide notes that the NixOS derivation was added in October 2015.'
    - '2018: Official GitHub releases include the 1.x series.'
    - '2026: Official GitHub releases list transcrypt v2.3.2.'
  usage:
    - >
      A typical workflow initializes transcrypt inside a Git repository, marks paths in
      `.gitattributes` with the crypt filter, commits encrypted versions of selected
      files, and shares the cipher and password with trusted clones. The README also
      documents listing encrypted files, checking raw committed contents, initializing a
      clone, rekeying, flushing credentials, and uninstalling repository configuration.
category: security
package-manager:
  brew: transcrypt
  nix: transcrypt
package-manager-url: https://formulae.brew.sh/formula/transcrypt
license: MIT
tags:
  - bash
  - cli
  - encryption
  - git
  - openssl
  - secrets
description: Configure transparent encryption of files in a Git repo
executables:
  - transcrypt
provenance:
  formula: transcrypt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
