id: brew:step
display-name: step
homepage: https://smallstep.com
repo: https://github.com/smallstep/cli
docs:
  - https://smallstep.com/docs/step-cli
  - https://smallstep.com/docs/step-cli/the-step-command
  - https://github.com/smallstep/cli#readme
config-file-location:
  unix:
    - $STEPPATH/config/defaults.json
    - $(step path)/config/ca.json
credentials-file-location:
  unix:
    - ~/.step/secrets/
    - $STEPPATH/secrets/
    - $STEPPATH/authorities/<authority>/secrets/
history:
  adoption-history:
    - >
      Smallstep positions step-cli as the command-line interface for its open-source
      certificate toolchain, and its docs show use across standalone crypto operations
      and online CA workflows. Smallstep also states that step and step-ca became the
      most popular open-source certificate management toolchain; treated neutrally, this
      indicates broad visibility in DevOps, homelab, Kubernetes, ACME, and internal-TLS
      communities.
  package-nerd-significance:
    - >
      Package nerds care because step packages a large amount of certificate plumbing
      into one Go binary, avoiding language-specific setup and reducing the friction of
      PKI automation. Its broad package-manager footprint in the input facts, including
      Homebrew, Linux distributions, MacPorts, Nix, and WinGet, makes it a useful
      example of a security CLI that crossed from vendor toolchain into general-purpose
      system packaging.
  project-history:
    - >
      The smallstep/cli GitHub repository was created in July 2018. Smallstep's official
      writing says step and step-ca were first released in 2018, and the README
      describes step as an easy-to-use CLI for building, operating, and automating PKI
      systems and workflows, as well as a client for the step-ca online certificate
      authority.
  related-projects:
    - >
      step is closely paired with step-ca, the Smallstep certificate authority server,
      and shares ecosystem context with ACME clients, Kubernetes cert-manager workflows,
      SSH certificate tooling, and internal TLS automation.
  sources:
    - https://api.github.com/repos/smallstep/cli
    - https://github.com/smallstep/cli
    - https://smallstep.com/blog/announcing-v0.14.2-of-step-and-step-ca/
    - https://smallstep.com/blog/welcome-to-certificate-manager/
    - https://smallstep.com/blog/zero-trust-swiss-army-knife/
    - https://smallstep.com/docs/step-cli
    - https://smallstep.com/docs/step-cli/the-step-command/
    - https://smallstep.com/open-source/
    - input.source_facts.package-manager
  summary:
    - >
      step is Smallstep's command-line tool for certificates, cryptography, and PKI
      workflows. In package-manager culture it is a classic security operator binary:
      one install gives developers and sysadmins commands for X.509, JWT,
      OAuth/OIDC-adjacent tasks, local PKI, and interaction with step-ca.
  timeline:
    - '2018: step and step-ca first released, according to Smallstep.'
    - '2018: Public smallstep/cli GitHub repository created.'
    - '2020: v0.14.2 release added initial Windows support and step ssh subcommands.'
    - '2026: GitHub releases continued through the v0.30 release line.'
  usage:
    - >
      Common usage includes creating and inspecting certificates, bootstrapping trust
      for a CA, checking CA health, issuing and renewing certificates through step-ca,
      formatting keys, and managing contexts. Official docs document
      `$STEPPATH/config/defaults.json` for defaults such as CA URL, fingerprint, and
      root certificate path, and `$(step path)/config/ca.json` for step-ca
      configuration.
category: security
package-manager:
  apk: step
  brew: step
  debian: step
  dnf: step
  macports: step
  nix: step-ca
  pacman: step
  ubuntu: step
  winget: Smallstep.step
  zypper: step
package-manager-url: https://formulae.brew.sh/formula/step
license: Apache-2.0
tags:
  - certificates
  - cli
  - cryptography
  - pki
  - x509
description: Crypto and x509 Swiss-Army-Knife
executables:
  - step
  - step-ca
provenance:
  formula: step
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
