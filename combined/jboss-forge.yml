id: brew:jboss-forge
display-name: JBoss Forge
homepage: https://forge.jboss.org/
repo: https://github.com/forge/core
docs:
  - https://forge.jboss.org/
  - https://forge.jboss.org/document/hands-on-lab
  - https://github.com/forge/core#readme
config-file-location:
  unix: <project>/.forge_settings
credentials-file-location: null
history:
  adoption-history:
    - >
      Forge was distributed as a command-line tool named forge and documented with a
      shell installer for Linux and macOS. It also became part of JBoss Tools workflows,
      where Forge-backed wizards could scaffold Java EE and web projects from inside
      Eclipse-based tooling.
  package-nerd-significance:
    - >
      In package-manager culture, JBoss Forge is a snapshot of the Java scaffolding era:
      a CLI and IDE bridge that tried to make enterprise Java project setup feel more
      like an interactive shell. It is also a reminder that package names can collide
      across ecosystems, since generic names such as forge are used by unrelated
      projects in other distributions.
  project-history:
    - >
      The forge/core GitHub repository was created in 2011 and its tag history starts
      with 1.0.0 Alpha, Beta, and CR milestones before a long 3.x Final series. The
      project grew as a productivity layer around Java EE and JBoss development, with a
      plugin model for add-ons and IDE-facing wizards.
  related-projects:
    - >
      Related projects include JBoss Tools, Red Hat's JBoss ecosystem, Forge add-ons,
      Java EE tooling, Eclipse integrations, and Maven/Sonatype distribution
      infrastructure used by the installer.
  sources:
    - https://forge.jboss.org/
    - https://forge.jboss.org/document/hands-on-lab
    - https://formulae.brew.sh/formula/jboss-forge
    - https://github.com/forge/core
    - https://github.com/forge/core/blob/master/forge-install.sh
  summary:
    - >
      JBoss Forge is a Java developer tool from the JBoss ecosystem for setting up,
      configuring, and extending projects through a command-line shell, IDE
      integrations, and add-ons. The official site identifies it as a JBoss project and
      links the forge/core repository as the source code.
  timeline:
    - '2011: The forge/core repository was created and 1.0.0 milestone tags began.'
    - >
      2014: JBoss Tools documentation described Forge-backed project wizards in Eclipse
      workflows.
    - '2016: The official site used a curl-to-shell installer path for Linux and macOS.'
    - '2018: The 3.9.x Final tag series marked mature Forge Core releases.'
  usage:
    - >
      Users run forge to create or modify Java projects, invoke add-ons, and follow
      guided commands rather than editing every framework file by hand. The official
      install script places Forge under a home-directory installation and updates common
      shell profiles with FORGE_HOME and PATH entries.
related-packages:
  - id: brew:maven
    reason: >
      Use Apache Maven with Forge-created Java projects for the build, dependency, and
      lifecycle workflow referenced by Forge's official getting-started documentation.
    rel: adjacent_workflow
    sources:
      - https://forge.jboss.org/1.x/docs/
      - https://maven.apache.org/guides/
category: developer-tools
package-manager:
  brew: jboss-forge
  dnf: gnome-shell-extension-forge
  pacman: forge
  ubuntu: forge-doc
  zypper: forge
package-manager-url: https://formulae.brew.sh/formula/jboss-forge
license: EPL-1.0
tags:
  - cli
  - ide
  - java
  - project-scaffolding
  - red-hat
  - wizards
description: Tools to help set up and configure a project
executables:
  - forge
provenance:
  formula: jboss-forge
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
