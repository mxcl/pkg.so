id: brew:cppinsights
display-name: C++ Insights
homepage: https://cppinsights.io/
repo: https://github.com/andreasfertig/cppinsights
docs:
  - https://cppinsights.io/
  - https://github.com/andreasfertig/cppinsights#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed both as an online service at cppinsights.io and as a
      buildable command-line tool, which helped it become useful for teaching, talks,
      and local experimentation with compiler transformations.
  package-nerd-significance:
    - >
      For package maintainers, C++ Insights is interesting because it packages a
      Clang-dependent educational tool rather than a conventional compiler. Its build
      can be done inside or outside the LLVM/Clang source tree, and upstream documents
      platform-specific build considerations.
  project-history:
    - >
      Andreas Fertig describes the project as emerging from 2017 work on C++11, C++14,
      and C++17 features such as lambdas, range-based for loops, and structured
      bindings. The tool started with transformations for those features and grew into a
      broader educational compiler-visualization tool.
  related-projects:
    - >
      Upstream explicitly relates the tool to Clang AST dumps and Compiler Explorer,
      while distinguishing C++ Insights by producing transformed C++ source rather than
      assembly or raw AST output.
  sources:
    - https://docs.cppinsights.io/
    - https://cppinsights.io/
    - https://github.com/andreasfertig/cppinsights#readme
  summary:
    - >
      C++ Insights is a Clang-based source-to-source transformation tool that shows C++
      code in a form closer to what the compiler sees.
  timeline:
    - >
      2017: Fertig began the work that led to C++ Insights while exploring newer C++
      language features.
    - '2020s: Upstream documentation continues to track newer C++ standards and Clang behavior.'
  usage:
    - >
      The packaged command is insights. Typical local usage passes a C++ file followed
      by compiler arguments, for example a language standard flag, so the tool can
      perform Clang-backed transformations with the intended compilation context.
related-packages:
  - id: brew:llvm
    reason: >
      LLVM is the practical companion for local C++ Insights builds because upstream
      implements the tool with Clang libraries and requires a Clang installation when
      building outside the Clang source tree.
    rel: adjacent_workflow
    sources:
      - https://docs.cppinsights.io/
      - https://clang.llvm.org/docs/
category: developer-tools
package-manager:
  brew: cppinsights
package-manager-url: https://formulae.brew.sh/formula/cppinsights
license: MIT
tags:
  - c-plus-plus
  - cli
  - code-analysis
  - compiler
  - education
  - source-transformation
description: See your source code with the eyes of a compiler
executables:
  - insights
provenance:
  formula: cppinsights
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
