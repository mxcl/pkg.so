id: brew:agg
display-name: agg
homepage: https://docs.asciinema.org/manual/agg/
repo: https://github.com/asciinema/agg
docs:
  - https://docs.asciinema.org/manual/agg
  - https://docs.asciinema.org/manual/agg/installation
  - https://docs.asciinema.org/manual/agg/usage
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents building and installing with Cargo from the GitHub
      repository, manual source builds, and Docker/Podman image builds. The supplied
      package metadata shows Homebrew, MacPorts, Nix, Scoop, and winget packaging for
      agg; Debian and Ubuntu entries in the supplied facts refer to `libagg-dev`, so
      they should not be treated as upstream asciinema agg adoption without separate
      confirmation.
  package-nerd-significance:
    - >
      agg sits at a fun packaging intersection: terminal recording culture, Rust
      command-line distribution, font rendering, GIF encoding, and documentation
      workflows. It is the package you reach for when a terminal cast needs to become a
      boring old image file that every platform can show.
    - >
      It also demonstrates how ecosystem packages grow around a file format. asciicast
      is the format; asciinema is the recorder/player; agg is the renderer/exporter.
  project-history:
    - >
      The agg repository was created under the asciinema organization in July 2022, and
      v1.0.0, named Hello, World!, was released in August 2022. The README describes it
      as a command-line generator for animated GIF files from terminal session
      recordings.
    - >
      agg belongs to the broader asciinema ecosystem created by Marcin Kulik. Whereas
      asciinema records, streams, and plays terminal sessions, agg focuses on producing
      portable GIF artifacts from asciicast files. Later releases through 2026 continued
      the 1.x line.
  related-projects:
    - >
      asciinema is the terminal session recorder, streamer, and player that produces
      asciicast recordings.
    - asciicast is the recording file format agg consumes.
    - gifski is the GIF encoder library named by the README as the basis for optimized output.
  sources:
    - official GitHub releases API
    - official GitHub repository metadata
    - official asciinema docs
    - source_facts.package-manager with Debian/Ubuntu caveat
    - upstream README
  summary:
    - >
      agg, the asciinema gif generator, is a command-line tool for rendering terminal
      session recordings in asciicast format to animated GIF files.
  timeline:
    - '2022: GitHub repository created.'
    - '2022: v1.0.0 released.'
    - '2023: v1.4.x releases published.'
    - '2024: v1.5.0 released.'
    - '2025: v1.6.0 and v1.7.0 released.'
    - '2026: v1.8.x and v1.9.0 released.'
  usage:
    - >
      agg converts asciicast recordings produced by asciinema into GIF output. The
      README highlights support for asciicast v1, v2, and v3, input from local files,
      stdin, or HTTP(S) URLs, optimized GIF output through gifski, built-in and custom
      themes, font controls, emoji rendering, multiple rendering backends, playback
      speed, idle-time limiting, frame selection, looping, FPS caps, and terminal-size
      overrides.
    - >
      Its usual package-manager value is pragmatic: a user records a terminal session
      with asciinema, then ships a GIF for documentation, READMEs, release notes, issue
      reports, or places where embedded asciinema playback is not available.
related-packages:
  - id: brew:asciinema
    reason: >
      Use asciinema to record terminal sessions as `.cast` files, then pass those
      recordings to agg when a portable animated GIF is needed.
    rel: adjacent_workflow
    sources:
      - https://github.com/asciinema/asciinema#readme
      - https://docs.asciinema.org/manual/agg/usage/
category: media
package-manager:
  brew: agg
  debian: libagg-dev
  macports: agg
  nix: agg
  scoop: main/agg
  ubuntu: libagg-dev
  winget: asciinema.agg
package-manager-url: https://formulae.brew.sh/formula/agg
license: GPL-3.0-or-later
tags:
  - asciinema
  - cli
  - gif
  - terminal-recording
description: Asciicast to GIF converter
executables:
  - agg
provenance:
  formula: agg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
