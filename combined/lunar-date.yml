id: brew:lunar-date
display-name: LunarDate
homepage: https://github.com/yetist/lunar-date
repo: https://github.com/yetist/lunar-date
docs:
  - https://github.com/yetist/lunar-date#readme
  - https://lunar-date.zhcn.cc/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LunarDate is a niche library, but it is packaged beyond Homebrew: the source facts
      list Debian and Ubuntu GObject-introspection packages and an openSUSE
      shared-library package. That footprint reflects its role as a reusable system
      library rather than an end-user app.
    - >
      The official API site documents LunarDate 3.0 with library version 3.2.0, GLib and
      GObject dependencies, headers under `lunar-date/lunar-date.h`, and source links
      back to GitHub. GitHub releases show maintenance continuing through version 3.2.0
      in December 2025.
  package-nerd-significance:
    - >
      LunarDate matters to package maintainers because it is a small cultural-calendar
      library with ABI/API versioning, introspection data, Vala bindings, Meson options,
      Windows cross-build support, and distro package splits. Its history also shows the
      common open-source transition from a desktop-widget-adjacent library to a narrower
      reusable system library.
  project-history:
    - >
      The GitHub repository was created in January 2013, but its NEWS file preserves an
      older liblunar lineage with releases from the 0.x, 1.x, and 2.x series. The
      changelog records the rename from `liblunar`/`lunar-calendar` lineage to
      `lunar-date` in version 2.4.0, separating the date library from the calendar
      application.
    - >
      The 3.0.0 series modernized the project: the API version moved to 3.0, the build
      system moved to Meson, lunar date data was extended to 2100, GLib became the core
      dependency, holiday APIs were revised, obsolete APIs were removed, and a D-Bus
      service plus the `lunar-date` command-line tool were added.
  related-projects:
    - GLib and GObject are the documented runtime dependencies.
    - gi-docgen is used for generated API documentation.
    - The NEWS file links the project historically to liblunar and lunar-calendar.
  sources:
    - https://api.github.com/repos/yetist/lunar-date
    - https://api.github.com/repos/yetist/lunar-date/releases
    - https://formulae.brew.sh/formula/lunar-date
    - https://github.com/yetist/lunar-date
    - https://github.com/yetist/lunar-date/blob/master/NEWS
    - https://lunar-date.zhcn.cc/
  summary:
    - >
      LunarDate is a Chinese lunar calendar date library with a C/GObject API, generated
      API documentation, language bindings, a D-Bus service, and a command-line tool.
  timeline:
    - '2013: Public GitHub repository created.'
    - '2.4.0: Project renamed to `lunar-date` and split from `lunar-calendar`.'
    - '2019: 2.9.x releases move away from autotools toward Meson.'
    - '2021: 3.0.0 releases API 3.0, Meson build, D-Bus service, and `lunar-date` CLI.'
    - '2025: 3.2.0 release adds legal-holiday information and gi-docgen documentation.'
  usage:
    - >
      Developers use LunarDate when they need Chinese lunar calendar calculations from C
      or GObject-introspection-friendly environments. The README shows Meson build
      options for documentation, introspection, Vala API generation, tests, and Windows
      cross-compilation.
    - >
      The command-line surface is packaged as `lunar-date`, while the library surface is
      aimed at applications that need calendar conversion, holidays, solar terms, or
      GLib/GObject integration.
related-packages: []
category: developer-tools
