id: brew:docker-agent
display-name: Docker Agent
homepage: https://docker.github.io/docker-agent/
repo: https://github.com/docker/docker-agent
docs:
  - https://docs.docker.com/ai/cagent
  - https://docker.github.io/docker-agent
config-file-location:
  unix: ./agent.yaml
credentials-file-location:
  unix: ~/.config/cagent/.env
history:
  adoption-history:
    - >
      The README documents three adoption channels: preinstallation in Docker Desktop
      4.63 and later, Homebrew installation, and binary releases from GitHub. That makes
      it unusual among early AI-agent CLIs because Docker is trying to make the agent
      runtime feel like another Docker workflow rather than a separate Python or Node
      stack.
  package-nerd-significance:
    - >
      For package-manager users, Docker Agent is notable because it packages a
      fast-moving AI-agent runtime as a CLI plugin in the Docker ecosystem. Its
      significance is still emerging, but it is a clear example of AI tooling being
      distributed through the same channels as container developer tools.
  project-history:
    - >
      Docker Agent is a recent Docker Engineering project that applies Docker packaging
      habits to AI-agent workflows: declarative configuration, a CLI entry point,
      reusable toolsets, and distribution through registries. Its docs position it
      explicitly as an agent runner rather than a hosted SaaS or code framework.
  related-projects:
    - >
      Docker Agent overlaps with Docker Model Runner, Docker's MCP catalog, general MCP
      servers, local-model runtimes, and AI coding-agent CLIs, but its official framing
      is Docker-native agent configuration and distribution.
  sources:
    - https://github.com/docker/docker-agent#readme
    - https://docker.github.io/docker-agent/
    - https://formulae.brew.sh/formula/docker-agent
  summary:
    - >
      Docker Agent is Docker's open source CLI for defining, running, and sharing AI
      agents from YAML or HCL configuration. The upstream README describes it as a
      docker CLI plugin that can run as docker agent, with multi-agent orchestration,
      MCP toolsets, provider-agnostic model support, RAG, and OCI registry distribution.
  timeline:
    - >
      2026: Upstream docs describe Docker Agent as a Docker tool for running AI agents
      from configuration.
    - >
      2026: The README documents Docker Desktop 4.63+ bundling, Homebrew installation,
      and GitHub binary releases.
    - '2026: The batch input lists Homebrew and winget package-manager entries.'
  usage:
    - >
      Users write an agent.yaml file with model, instructions, and toolsets, then run it
      with docker agent run or docker-agent directly. The docs and README highlight
      coding agents, operations and SRE tasks, multi-agent teams, filesystem and shell
      tools, MCP integrations, local models through Docker Model Runner, and pushing or
      pulling agents through OCI registries.
related-packages:
  - id: brew:docker
    reason: >
      Install Docker alongside Docker Agent when using it as the docker agent CLI plugin
      or when agents need Docker-native container, registry, and local-model workflows.
    rel: adjacent_workflow
    sources:
      - https://docs.docker.com/ai/docker-agent/
      - https://docs.docker.com/reference/cli/docker/
category: ai
package-manager:
  brew: docker-agent
  winget: Docker.Agent
package-manager-url: https://formulae.brew.sh/formula/docker-agent
license: Apache-2.0
tags:
  - ai
  - ai-agents
  - automation
  - cli
  - docker
  - runtime
description: Agent Builder and Runtime by Docker Engineering
executables:
  - docker-agent
provenance:
  formula: docker-agent
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
