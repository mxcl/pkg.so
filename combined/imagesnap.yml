history:
  adoption-history:
    - >
      ImageSnap became a small but recognizable Mac package-manager tool because it does
      one thing Unix users expect to script: take a camera snapshot without opening a
      full camera app. The README names Homebrew and MacPorts as common installation
      paths, and Homebrew analytics show a steady low-thousands yearly install base.
    - >
      Its package adoption is tied to automation scenarios such as quick webcam
      captures, simple time-lapse scripts, hardware checks, and headless-ish Mac
      workflows where AVFoundation access can still be granted through macOS camera
      permissions.
  package-nerd-significance:
    - >
      ImageSnap is package-nerd useful because it exposes an Apple media-framework
      feature as a tiny, scriptable binary. It is the kind of package people install
      once for a build lab, kiosk, CI-adjacent hardware check, or personal automation
      and then forget until they need a camera frame from a shell script.
  project-history:
    - >
      Robert Harder's older iHarder Mac OS X utilities page describes ImageSnap as a
      successor path after Axel Bauer's `isightcapture`, with the goal of adapting
      command-line camera capture to Apple's changing architectures. The GitHub README
      identifies Robert Harder as the original author and documents the tool as
      public-domain software.
    - >
      The project lived for years as an Objective-C utility, then gained a Swift rewrite
      using AVFoundation in the 0.3.0 series. The README notes that the Swift rewrite
      modernized the media stack but raised the macOS requirement to Ventura-era
      systems, while older Objective-C versions remain available from tags and releases.
  related-projects:
    - >
      The historical comparison is Axel Bauer's `isightcapture`, which ImageSnap's
      original project page explicitly mentions. Within package managers, Homebrew and
      MacPorts both carry ImageSnap for macOS camera capture.
  sources:
    - https://formulae.brew.sh/api/formula/imagesnap.json
    - https://github.com/rharder/imagesnap
    - https://github.com/rharder/imagesnap/releases
    - https://iharder.sourceforge.net/macosx/
    - https://raw.githubusercontent.com/rharder/imagesnap/master/README.md
  summary:
    - >
      ImageSnap is a macOS command-line camera capture utility by Robert Harder. It
      saves still images from the built-in iSight or other video devices, making webcam
      snapshots scriptable from the terminal.
  timeline:
    - >
      2010s: iHarder described ImageSnap as a way forward from the older `isightcapture`
      utility.
    - '2017: Version 0.2.6 appeared in GitHub releases.'
    - '2021: The 0.2.x series continued with camera-capture maintenance releases.'
    - '2023: Version 0.2.16 was released before the Swift rewrite line.'
    - '2026: Version 0.3.0 introduced a Swift rewrite using AVFoundation.'
  usage:
    - >
      The `imagesnap` command captures to `snapshot.jpg` by default, accepts a filename
      as the final argument, lists cameras with `-l`, selects a device with `-d`, and
      supports time-lapse captures with `-t` and `-n`. It can write common formats such
      as JPEG, TIFF, PNG, GIF, and BMP based on the output filename extension.
    - >
      The README documents a warmup delay, because real cameras need time after
      activation before a frame is useful. The tool also has to participate in macOS
      camera permission prompts the first time it is used.
