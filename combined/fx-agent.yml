id: brew:fx-agent
display-name: fx
homepage: https://fx.sh
repo: https://github.com/vercel-labs/fx
docs:
  - https://fx.sh/docs
  - https://fx.sh/docs/configure-fx/configuration
  - https://fx.sh/docs/getting-started/authentication
config-file-location:
  unix:
    - ~/.fx/settings.json
    - <workspace>/.fx.json
    - ~/.fx/mcp.json
credentials-file-location:
  linux:
    - ~/.fx/auth.json
    - ~/.fx/api-key
  macos: ~/.fx/auth.json
history:
  adoption-history:
    - >
      fx is distributed as a native command-line application and is packaged across
      multiple ecosystems recorded in the supplied metadata, including Homebrew, Nix,
      MacPorts, Arch, Alpine, openSUSE, and Scoop. Its native binary and experimental
      WebAssembly SDK support both direct terminal use and embedding.
  package-nerd-significance:
    - >
      fx combines the familiar Unix convention of starting work from the current
      directory with a modern coding-agent loop. Package enthusiasts may find its native
      Zig implementation, embeddable WebAssembly core, Agent Client Protocol support,
      MCP integration, skills, and explicit permission model notable.
  project-history:
    - >
      fx was developed by Vercel Labs as a small, open, embeddable coding agent. The
      project is implemented as a native application with an experimental WebAssembly
      SDK for hosts that want to supply their own transport, storage, configuration,
      permissions, and terminal interface.
    - >
      Its documentation describes an expanding agent environment encompassing
      interactive and one-shot operation, project instructions, skills, MCP servers,
      subagents, sandboxing, diagnostics, and editor integration through ACP.
  related-projects:
    - >
      fx can authenticate through Vercel and Vercel AI Gateway. It supports MCP for
      external tools and ACP for editor or client integration.
  sources:
    - https://fx.sh/docs
    - https://fx.sh/docs/configure-fx/configuration
    - https://fx.sh/docs/getting-started/authentication
    - https://github.com/vercel-labs/fx
  summary:
    - >
      fx is an open native coding agent from Vercel Labs that runs interactively in a
      project directory, supports one-shot requests, and can be embedded through native
      or WebAssembly interfaces.
  timeline:
    - >
      2026: Public official documentation describes fx as a native and embeddable coding
      agent with CLI, ACP, MCP, skills, and WebAssembly interfaces.
  usage:
    - >
      Users run `fx login` for Vercel OAuth or `fx setup` for an AI Gateway key, change
      to a project directory, and launch `fx`; the launch directory becomes the primary
      workspace. `fx ask` handles single noninteractive requests.
    - >
      Configuration is layered from command-line and environment overrides through
      `~/.fx/settings.json` and the repository-safe `<workspace>/.fx.json`. Private MCP
      definitions live in `~/.fx/mcp.json`.
related-packages:
  - id: brew:opencode
    reason: >
      Choose OpenCode when you want a coding agent spanning terminal, desktop, and IDE
      interfaces with broad model-provider support; choose fx when its native
      embeddability, ACP interface, and documented WebAssembly SDK are the priority.
    rel: alternative
    sources:
      - https://fx.sh/docs
      - https://opencode.ai/
      - https://docs.opencode.ai/docs/
  - id: brew:aider
    reason: >
      Choose Aider for a Git-centered AI pair-programming workflow with repository maps
      and automatic lint/test integration; choose fx for a broader tool-using agent
      environment with MCP, ACP, skills, and permission modes.
    rel: alternative
    sources:
      - https://fx.sh/docs
      - https://aider.chat/docs/
category: ai
package-manager:
  apk: fx
  brew: fx-agent
  macports: fx
  nix: fx
  pacman: fx
  scoop: main/fx
  zypper: fx
package-manager-url: https://formulae.brew.sh/formula/fx-agent
license: Apache-2.0
tags:
  - acp
  - ai
  - automation
  - cli
  - coding-agent
  - developer-tools
  - mcp
  - native
  - webassembly
  - zig
description: Tiny, open, embeddable, native coding agent
executables:
  - fx
provenance:
  formula: fx-agent
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
