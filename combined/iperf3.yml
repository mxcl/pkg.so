id: brew:iperf3
display-name: iperf3
homepage: https://github.com/esnet/iperf
repo: https://github.com/esnet/iperf
docs:
  - https://github.com/esnet/iperf#readme
  - https://software.es.net/iperf
  - https://software.es.net/iperf/invoking.html
config-file-location:
  unix: User-selected authorized-users configuration file passed with `--authorized-users-path`
credentials-file-location:
  unix:
    - User-selected authorized-users file passed with `--authorized-users-path`
    - User-selected RSA private key passed with `--rsa-private-key-path`
    - User-selected RSA public key passed with `--rsa-public-key-path`
history:
  adoption-history:
    - >
      The README identifies perfSONAR as one of iperf3's primary uses and notes use by
      ESnet, other research and education networks, the broader networking community,
      and commercial products.
    - >
      Package adoption is broad because the tool gives automation-friendly output and a
      stable `iperf3` command without colliding with legacy iperf2 installations.
      Homebrew, Linux distributions, Windows package managers, and other ecosystems ship
      it under the iperf3 name.
  package-nerd-significance:
    - >
      iperf3 matters because it is not just a version bump of `iperf`: it is a parallel
      implementation with its own ABI, CLI behavior, output formats, and release train.
      Package managers preserve that distinction by shipping `iperf` and `iperf3`
      separately.
    - >
      For network engineers, the package is part of the small toolkit used to turn vague
      throughput complaints into repeatable measurements. For maintainers, it is a
      canonical example of a command-line tool whose packaging name encodes
      compatibility.
  project-history:
    - >
      iperf3 was built as a clean rewrite of the original NLANR/DAST iperf. Its README
      says it shares the measurement domain with iperf2 but is not backward compatible,
      which made the separate `iperf3` executable and package name necessary.
    - >
      The project is developed by ESnet/Lawrence Berkeley National Laboratory and
      distributed under a three-clause BSD license. ESnet's download archive shows
      public 3.0.x tarballs in 2014, while the GitHub repository was created in February
      2014.
  related-projects:
    - >
      Iperf 2 remains a separate active project with different features and incompatible
      wire behavior.
    - perfSONAR uses iperf3 as a network measurement component.
    - nuttcp and netperf are related network testing tools referenced by the iperf3 README.
  sources:
    - https://downloads.es.net/pub/iperf/
    - https://github.com/esnet/iperf
    - https://software.es.net/iperf/
  summary:
    - >
      iperf3 is ESnet and Lawrence Berkeley National Laboratory's redesigned iperf
      implementation for active measurement of achievable bandwidth on IP networks,
      adding a smaller code base, library use, SCTP support, zero-copy mode, and JSON
      output.
  timeline:
    - "2014: GitHub repository created for ESnet's iperf3 implementation."
    - '2014: ESnet download archive lists iperf-3.0.x tarballs.'
    - '2023: iperf3 3.16 work added a threaded implementation for parallel streams.'
    - '2026: iperf3 3.21 release appears in the ESnet download archive and GitHub releases.'
  usage:
    - >
      The basic workflow remains the classic iperf model: run a server endpoint, run a
      client against it, select protocol and timing parameters, and read bandwidth,
      loss, and related measurements.
    - >
      The package is especially useful in scripted diagnostics because iperf3 offers
      JSON output, explicit client/server compatibility with other iperf3 builds, and
      documented behavior around supported platforms and known issues.
related-packages:
  - id: brew:iperf
    reason: >
      Choose Iperf 2 when existing peers or scripts require its incompatible protocol,
      or when you need capabilities such as multicast, CSV output, packet-latency
      measurements, or same-socket full-duplex testing.
    rel: alternative
    sources:
      - https://iperf2.sourceforge.io/IperfCompare.html
      - https://software.es.net/iperf/
      - https://sourceforge.net/projects/iperf2/
category: networking
