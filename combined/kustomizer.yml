id: brew:kustomizer
display-name: Kustomizer
homepage: https://kustomizer.dev
repo: https://github.com/stefanprodan/kustomizer
docs:
  - https://kustomizer.dev/
  - https://kustomizer.dev/install
config-file-location:
  unix: ~/.kustomizer/config
credentials-file-location: null
history:
  adoption-history:
    - >
      Kustomizer's adoption story is tied to Kubernetes supply-chain and GitOps
      workflows rather than to a broad plugin ecosystem. The v2.2.0 release explicitly
      added Flux v2-compatible OCI artifacts, and the official Flux guide shows a
      workflow where CI publishes an artifact and Flux pulls and reconciles it inside
      the cluster.
  package-nerd-significance:
    - >
      Kustomizer is notable because it treats Kubernetes configuration like a package
      artifact: content-addressed, signable, encryptable, and transportable through
      standard OCI registry infrastructure. That makes it part of the broader move to
      use OCI registries for more than container images.
  project-history:
    - >
      The project was created by Stefan Prodan as an experimental package manager for
      publishing, fetching, diffing, customizing, validating, applying, and pruning
      Kubernetes resources. Its v2 line centered the tool on packaging Kubernetes
      configs as OCI artifacts, with signing through cosign and encryption through age.
  related-projects:
    - >
      Kustomizer builds on Kubernetes server-side apply and overlaps operationally with
      Flux, kustomize, cosign, age, and OCI-compatible container registries.
  sources:
    - https://github.com/stefanprodan/kustomizer
    - https://github.com/stefanprodan/kustomizer/releases/tag/v2.0.0
    - https://github.com/stefanprodan/kustomizer/releases/tag/v2.2.0
    - https://kustomizer.dev/guides/fluxcd/
  summary:
    - >
      Kustomizer is a Kubernetes configuration package manager built around the idea
      that manifests can be distributed as OCI artifacts in the same registries used for
      container images.
  timeline:
    - >
      v2.0.0: Added OCI artifact distribution, push/pull, cosign verification, age
      encryption, and deployment from artifacts.
    - 'v2.2.0: Added Flux v2-compatible OCI artifacts and an official Flux deployment guide.'
  usage:
    - >
      Users build and push Kubernetes manifests to OCI registries, tag and inspect
      artifacts, and apply those artifacts into clusters. The command reference and Flux
      guide emphasize registries such as GHCR, Docker Hub, ACR, ECR, GCR, Artifactory,
      and self-hosted registries.
related-packages:
  - id: brew:fluxcd
    reason: >
      Publish Kustomizer's Flux-compatible OCI artifacts in CI, then use Flux to pull
      and continuously reconcile them inside the cluster.
    rel: adjacent_workflow
    sources:
      - https://kustomizer.dev/guides/fluxcd/
      - https://fluxcd.io/flux/components/source/ocirepositories/
  - id: brew:kustomize
    reason: >
      Kustomizer consumes Kustomize-compatible overlays and extends that workflow with
      OCI distribution, ordered server-side apply, inventory, and pruning.
    rel: adjacent_workflow
    sources:
      - https://kustomizer.dev/
      - https://github.com/kubernetes-sigs/kustomize
  - id: brew:cosign
    reason: >
      Use cosign with Kustomizer to sign and verify Kubernetes configuration artifacts
      and release checksums as part of an OCI supply-chain workflow.
    rel: adjacent_workflow
    sources:
      - https://kustomizer.dev/
      - https://kustomizer.dev/install/
      - https://docs.sigstore.dev/cosign/verifying/verify/
  - id: brew:age
    reason: >
      Use age keys with Kustomizer when OCI artifacts contain sensitive Kubernetes
      configuration that must be encrypted for specific recipients.
    rel: adjacent_workflow
    sources:
      - https://kustomizer.dev/
      - https://github.com/FiloSottile/age
  - id: brew:kubernetes-cli
    reason: >
      Choose kubectl for direct general-purpose cluster administration; Kustomizer adds
      ordered application, readiness waiting, inventory tracking, and pruning for
      packaged configuration.
    rel: alternative
    sources:
      - https://kustomizer.dev/
      - https://kubernetes.io/docs/reference/kubectl/
category: cloud-infrastructure
package-manager:
  brew: kustomizer
package-manager-url: https://formulae.brew.sh/formula/kustomizer
license: Apache-2.0
tags:
  - cli
  - configuration
  - kubernetes
  - oci-artifacts
  - package-manager
description: Package manager for distributing Kubernetes configuration as OCI artifacts
executables:
  - kustomizer
provenance:
  formula: kustomizer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
