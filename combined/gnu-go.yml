id: brew:gnu-go
display-name: GNU Go
homepage: https://www.gnu.org/software/gnugo/gnugo.html
repo: https://git.savannah.gnu.org/cgit/gnugo.git
docs:
  - https://www.gnu.org/software/gnugo/gnugo_toc.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The GNU Go home page states that GNU Go played thousands of games on NNGS and also
      appeared on LGS, WING, and KGS through volunteer clients. It describes GNU Go as a
      leading non-commercial Go program in tournaments it entered, reflecting its role
      as an accessible engine for both players and Computer Go developers.
    - >
      Its adoption was helped by protocol and client support. The manual documents
      CGoban setup, lists free graphical clients such as Quarry, qGo, ccGo, RubyGo,
      Jago, FreeGoban, Mac GNU Go, and Gogui, and explains that GNU Go 3.0 introduced
      the Go Text Protocol while GMP remained widely used in tournaments.
  package-nerd-significance:
    - >
      GNU Go is package-relevant because it is a classic free software game engine with
      stable command-line behavior and protocol support. It gave Unix-like distributions
      a non-commercial Go opponent, a testable GTP engine, and a documented Computer Go
      codebase long before neural-network Go engines reshaped the field.
  project-history:
    - >
      GNU Go developed in the late 1990s and 2000s as a free software answer to
      proprietary Computer Go programs. Its manual argues that before GNU Go, Go
      programs were commonly distributed only as binaries with secret algorithms, while
      GNU Go made its source and algorithms open for inspection, criticism, and
      improvement.
    - >
      The manual names Daniel Bump, Gunnar Farneback, and Arend Bayer as maintainers for
      GNU Go 3.8, and lists a long chronological authorship chain beginning with Man Li
      and Wayne Iba. It also thanks Stuart Cracraft, Richard Stallman, and Man Lung Li
      for interest in making the program part of GNU.
  related-projects:
    - CGoban and the Go Modem Protocol shaped early GUI and tournament use.
    - Go Text Protocol became an interprocess protocol for Go engines and clients.
    - SGF support connected GNU Go to the standard game-record format used by Go software.
  sources:
    - https://www.gnu.org/software/gnugo/gnugo.html
    - https://www.gnu.org/software/gnugo/gnugo_1.html
    - https://www.gnu.org/software/gnugo/gnugo_17.html
    - https://www.gnu.org/software/gnugo/gnugo_19.html
    - https://www.gnu.org/software/gnugo/gnugo_3.html
  summary:
    - >
      GNU Go is the GNU Project's free software program for playing the game of Go,
      distributed as a command-line engine with documented algorithms, protocol support,
      graphical-client integration, and developer-facing internals.
  timeline:
    - '1999-2008: GNU Go manual copyright span records active FSF-era development.'
    - 'GNU Go 3.0: Go Text Protocol introduced.'
    - '2009: GNU Go 3.8 released and manual generated.'
    - '2019: GNU Go web page update record remained tied to the 3.8 documentation set.'
  usage:
    - >
      Practitioners use `gnugo` directly in ASCII mode, through graphical Go clients, as
      a GTP engine for programs and test harnesses, or as a source base for studying
      Computer Go algorithms. It reads and writes SGF, can load game records, generate
      moves for a side to play, set board size and komi, and expose developer traces for
      understanding move selection.
related-packages:
  - id: brew:cgoban
    reason: >
      CGoban is a documented graphical companion that can launch GNU Go through the Go
      Modem Protocol and provide the board interface while GNU Go selects moves.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/gnugo/gnugo_3.html
      - https://cgoban1.sourceforge.net/
category: games
