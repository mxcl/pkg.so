id: brew:chaiscript
display-name: ChaiScript
homepage: https://chaiscript.com/
repo: https://github.com/ChaiScript/ChaiScript
docs:
  - https://chaiscript.com/docs.html
  - https://github.com/ChaiScript/ChaiScript#readme
  - https://github.com/ChaiScript/ChaiScript/blob/develop/cheatsheet.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ChaiScript is packaged in Homebrew as chaiscript and appears in the input package
      facts for Debian, Ubuntu, MacPorts, and vcpkg-oriented usage. The README
      specifically documents vcpkg installation, which is important for C++ developers
      consuming it as a library dependency.
  package-nerd-significance:
    - >
      ChaiScript is package-nerd interesting because it is a C++-native embeddable
      language distributed across general-purpose package managers and C++ dependency
      managers. It represents the small but persistent category of scripting runtimes
      packaged primarily so native applications can embed them.
  project-history:
    - >
      The public GitHub repository dates to January 2011. The README describes
      ChaiScript as a language designed from the ground up to target C++ and modern C++
      development, with a header-only integration style and type-safe bindings between
      C++ and scripts.
    - >
      GitHub releases show mature 4.x and 5.x releases by 2014, a 6.0.0 release in 2017,
      and 6.1.0 in 2018. The README states that building ChaiScript requires a C++17
      compiler.
  related-projects:
    - The README compares ChaiScript's surface language to ECMAScript-style scripting.
    - >
      vcpkg is an officially documented installation route for consuming ChaiScript from
      C++ projects.
  sources:
    - https://chaiscript.com/docs.html
    - https://github.com/ChaiScript/ChaiScript#readme
    - https://github.com/ChaiScript/ChaiScript/releases
    - https://api.github.com/repos/ChaiScript/ChaiScript
    - https://formulae.brew.sh/formula/chaiscript
  summary:
    - >
      ChaiScript is an embedded scripting language designed for C++ applications. Its
      package identity is closer to a language runtime and embeddable library than to a
      standalone command, though package managers commonly expose a chai executable as
      well.
  timeline:
    - '2011: GitHub repository created.'
    - '2014: 4.x and 5.x releases published on GitHub.'
    - '2017: 6.0.0 release published.'
    - '2018: 6.1.0 release published and used by the Homebrew stable formula.'
    - '2026: Repository metadata still shows the project as unarchived.'
  usage:
    - >
      Typical usage is to add the ChaiScript include directory, include
      chaiscript/chaiscript.hpp, instantiate chaiscript::ChaiScript, then evaluate
      script strings or files. Host applications register C++ functions with the engine
      so scripts can call into native code.
related-packages:
  - id: brew:vcpkg
    reason: >
      ChaiScript's official README documents vcpkg as a supported way to install and
      consume the library in C++ projects.
    rel: adjacent_workflow
    sources:
      - https://github.com/ChaiScript/ChaiScript#installation-using-vcpkg
      - https://learn.microsoft.com/en-us/vcpkg/
category: language-runtime
package-manager:
  brew: chaiscript
  debian: chai
  macports: chai
  ubuntu: chai
package-manager-url: https://formulae.brew.sh/formula/chaiscript
license: BSD-3-Clause
tags:
  - cli
  - cpp
  - embedded-scripting
  - header-only
  - language
  - scripting-language
description: Easy to use embedded scripting language for C++
executables:
  - chai
provenance:
  formula: chaiscript
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
