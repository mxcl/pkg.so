id: brew:gnupg@1.4
display-name: GnuPG 1.4
homepage: https://www.gnupg.org/
repo: https://dev.gnupg.org/source/gnupg
docs:
  - https://www.gnupg.org/documentation/manuals/gnupg
  - https://www.gnupg.org/documentation/manuals/gnupg/GPG-Configuration.html
config-file-location:
  unix:
    - ~/.gnupg/gpg.conf
    - ~/.gnupg/common.conf
credentials-file-location:
  unix: ~/.gnupg/secring.gpg
history:
  adoption-history:
    - >
      The versioned package role is compatibility. It exists for scripts, archives,
      tests and users that need the 1.4 behavior, the gpg1 command family, or legacy
      OpenPGP material without replacing the newer gnupg formula.
  package-nerd-significance:
    - >
      For package users, gnupg@1.4 is a clean example of a versioned formula preserving
      an old security toolchain without making it the default OpenPGP stack. The
      suffixing of executables makes side-by-side installation practical.
  project-history:
    - >
      GnuPG itself was introduced in 1997 as the GNU project's free OpenPGP
      implementation. The 1.4 branch was born in 2004 and belongs to the older
      single-binary lineage before the more modular GnuPG 2 architecture became the main
      branch for many users.
    - >
      The GnuPG download page describes 1.4 as the old single-binary version, with no
      dependency on the newer GnuPG support libraries or pinentry. It also notes support
      for unsafe PGP-2 keys and the absence of many modern features.
  related-projects:
    - >
      gnupg@1.4 is part of the GnuPG/OpenPGP lineage and is related to gnupg, gpgv,
      PGP-2 compatibility workflows and software-release signature verification.
  sources:
    - https://formulae.brew.sh/formula/gnupg@1.4
    - https://gnupg.org/download/index.html
    - https://www.gnupg.org/
    - https://www.gnupg.org/documentation/manuals/gnupg
  summary:
    - >
      The gnupg@1.4 formula represents the legacy GnuPG 1.4 branch, packaged separately
      so users can install gpg1-style tools alongside newer GnuPG packages.
  timeline:
    - '1997: GnuPG was introduced as Free Software.'
    - '2004: The 1.4 release branch was born.'
    - '2018: The GnuPG download table listed 1.4.23 as the 1.4 source release.'
    - '2020s: Package managers kept versioned or suffixed forms for compatibility workflows.'
  usage:
    - >
      Practitioners use gnupg@1.4 when they deliberately need gpg1, gpgv1 or related
      suffixed executables. Typical use is compatibility work, legacy signature
      verification, old-key handling or controlled testing against the 1.4 command-line
      behavior.
related-packages:
  - id: brew:gnupg
    reason: >
      Choose the main GnuPG package for contemporary OpenPGP work; retain the 1.4
      formula only when legacy PGP 2, archived-key, or gpg1 compatibility is
      specifically required.
    rel: alternative
    sources:
      - https://gnupg.org/download/
      - https://lists.gnupg.org/pipermail/gnupg-users/2018-June/060612.html
      - https://www.gnupg.org/
category: security
package-manager:
  apk: gnupg
  brew: gnupg@1.4
  chocolatey: gnupg
  debian: gnupg
  dnf: gnupg2
  nix: gnupg
  pacman: gnupg
  scoop: main/gnupg
  ubuntu: gnupg
  winget: GnuPG.GnuPG
  zypper: gpg2
package-manager-match:
  apk: fallback
  chocolatey: fallback
  debian: fallback
  dnf: fallback
  nix: fallback
  pacman: fallback
  scoop: fallback
  ubuntu: fallback
  winget: fallback
  zypper: fallback
package-manager-url: https://formulae.brew.sh/formula/gnupg@1.4
license: GPL-3.0-or-later
tags:
  - cli
  - cryptography
  - encryption
  - key-management
  - openpgp
  - signing
description: GNU Privacy Guard (OpenPGP)
executables:
  - gpg-zip1
  - gpg1
  - gpgsplit1
  - gpgv1
provenance:
  formula: gnupg@1.4
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
