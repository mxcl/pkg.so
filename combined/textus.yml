id: cask:textus
display-name: Textus
homepage: https://textus.catvinci.com/
repo: https://github.com/CatVinci-Studio/Textus
docs:
  - https://github.com/CatVinci-Studio/Textus#readme
  - https://textus.catvinci.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Textus is distributed for macOS, Windows, and Linux, with Homebrew installation
      for macOS and a signed Arch Linux repository in addition to downloadable
      installers.
    - >
      The project publishes its interface and README in multiple languages and keeps
      documents as ordinary Markdown files, making adoption less dependent on a
      proprietary document store.
  package-nerd-significance:
    - >
      Textus belongs to the lineage of live-rendered Markdown editors associated with
      Typora, but adds built-in multi-provider AI writing tools while remaining free and
      MIT-licensed.
    - >
      Its local-first document model and bring-your-own-provider design are notable
      packaging choices: the editor works without an account, API credentials remain on
      the user's computer, and Ollama permits a fully local writing-assistance workflow.
  project-history:
    - >
      CatVinci Studio developed Textus as a cross-platform WYSIWYG Markdown editor with
      inline rendering, source and split modes, mathematical notation, Mermaid diagrams,
      customizable themes, and export to common document formats.
    - >
      The project subsequently integrated an AI writing assistant for continuation,
      proofreading, translation, tone changes, and proposed edits. Rather than binding
      the editor to one service, it supports numerous hosted providers,
      OpenAI-compatible endpoints, and local Ollama models.
  related-projects:
    - Ollama, supported for local AI inference
    - Typora themes, which Textus can use
    - Mermaid, supported for diagrams in Markdown documents
  sources:
    - https://github.com/CatVinci-Studio/Textus#readme
    - https://textus.catvinci.com/
  summary:
    - >
      Textus is a free, open-source, cross-platform WYSIWYG Markdown editor with
      optional AI-assisted writing. It stores documents as plain Markdown and supports
      both hosted model providers and local models.
  timeline:
    - >
      2026: Textus was distributed across macOS, Windows, Linux, Homebrew, and a signed
      Arch Linux repository.
    - >
      2026: The project documented multi-provider AI assistance, local Ollama support,
      multilingual interfaces, and stable or beta update channels.
  usage:
    - >
      Open or create a Markdown document and write in live-rendered, Zen, typewriter,
      split, or source-code modes. Textus supports tables, task lists, footnotes,
      mathematics, Mermaid diagrams, themes, and export formats including PDF, Word, and
      HTML.
    - >
      AI is optional. In Settings, choose a provider and authenticate or paste an API
      key; Textus also accepts OpenAI-compatible endpoints and local Ollama models.
    - >
      Documents remain ordinary files in locations chosen by the user. The project
      states that credentials are kept on the local computer and requests travel
      directly to the selected provider, but it does not document a stable
      credentials-file path.
related-packages:
  - id: cask:typora
    reason: >
      Choose Typora when you want the established commercial live-preview Markdown
      workflow without Textus's built-in multi-provider AI assistant; both work with
      plain Markdown and Typora themes.
    rel: alternative
    sources:
      - https://github.com/CatVinci-Studio/Textus#readme
      - https://typora.io/
      - https://support.typora.io/
  - id: brew:ollama
    reason: >
      Run Ollama alongside Textus to use its documented local-model integration, keeping
      AI writing requests and document content on the local machine.
    rel: adjacent_workflow
    sources:
      - https://github.com/CatVinci-Studio/Textus#readme
      - https://docs.ollama.com/
category: productivity
