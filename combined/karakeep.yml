id: brew:karakeep
display-name: Karakeep
homepage: https://karakeep.app/
repo: https://github.com/karakeep-app/karakeep
docs:
  - https://docs.karakeep.app/
  - https://docs.karakeep.app/command-line
  - https://github.com/karakeep-app/karakeep#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/karakeep/config.json
    - ~/.config/karakeep/config.json
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/karakeep/config.json
    - ~/.config/karakeep/config.json
history:
  adoption-history:
    - >
      Karakeep grew in the self-hosted software community because it combined link
      saving, notes, PDFs, images, browser extensions, mobile apps, REST APIs, and
      local-model-friendly AI features. The January 5, 2025 release announcement for
      Hoarder 0.21.0 described the project reaching 10,000 GitHub stars and receiving
      Hacker News front-page exposure.
  package-nerd-significance:
    - >
      Karakeep is interesting as a package because the installable CLI trails a
      fast-moving self-hosted web app and a project rename. Package maintainers had to
      track not only releases, but also changed GitHub organization names, container
      image names, documentation domains, and the older Hoarder identity still present
      in community memory.
  project-history:
    - >
      The project began publicly as Hoarder and later rebranded to Karakeep. Its
      repository README describes the renamed project as a self-hostable
      bookmark-everything app, and its migration documentation explains the move from
      hoarder-app container images to karakeep-app images.
  related-projects:
    - Hoarder is the former project name and migration source.
    - >
      SingleFile, Ollama, browser extensions, mobile apps, and REST API clients are part
      of the broader capture and automation ecosystem around Karakeep.
    - >
      Omnivore appears in Karakeep release notes as an import source for users moving
      read-it-later data.
  sources:
    - https://docs.karakeep.app/administration/hoarder-to-karakeep-migration/
    - https://github.com/karakeep-app/karakeep
    - https://github.com/karakeep-app/karakeep/discussions/830
    - https://github.com/karakeep-app/karakeep/releases
  summary:
    - >
      Karakeep is the renamed Hoarder project: a self-hosted bookmark, note, and media
      capture app with full-text search, AI-assisted tagging, and an official CLI.
  timeline:
    - '2024: v0.1.0 was published on February 20 under the Hoarder project lineage.'
    - >
      2025: The 0.21.0 announcement on January 5 described Hoarder reaching 10,000
      GitHub stars and Hacker News front-page exposure.
    - >
      2025: Hoarder-to-Karakeep migration documentation instructed users to update
      container image references from ghcr.io/hoarder-app/hoarder to
      ghcr.io/karakeep-app/karakeep.
  usage:
    - >
      Users deploy the server, save links or files through the web UI, browser
      extensions, mobile apps, API clients, or CLI, and use search, lists, tags, OCR,
      RSS imports, and summarization to manage the saved collection. The Homebrew
      package covers the CLI side of that larger self-hosted application.
related-packages:
  - id: brew:ollama
    reason: >
      Karakeep officially supports Ollama as a local model server for automatic tagging,
      summarization, embeddings, and semantic search.
    rel: adjacent_workflow
    sources:
      - https://docs.karakeep.app/configuration/different-ai-providers/
      - https://docs.ollama.com/
category: productivity
package-manager:
  brew: karakeep
  nix: karakeep
package-manager-url: https://formulae.brew.sh/formula/karakeep
license: AGPL-3.0-only
tags:
  - bookmarks
  - cli
  - notes
  - read-it-later
  - self-hosted
description: CLI tool for self-hostable bookmark-everything app karakeep
executables:
  - karakeep
provenance:
  formula: karakeep
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
