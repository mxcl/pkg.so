id: brew:chainhook
display-name: Chainhook
homepage: https://github.com/hirosystems/chainhook
repo: https://github.com/hirosystems/chainhook
docs:
  - https://github.com/hirosystems/chainhook/tree/develop/docs
  - https://github.com/hirosystems/chainhook#readme
config-file-location:
  unix: ./Chainhook.toml
credentials-file-location:
  unix: ./Chainhook.toml
history:
  adoption-history:
    - >
      The README documents Homebrew installation for macOS, Snap for Linux, Winget for
      Windows, GitHub release builds, and source builds with cargo. Hiro later described
      programmatic API access for platform-hosted chainhooks, and 2025-2026 Hiro posts
      describe Chainhook 2.0/v2 testing, beta, and general availability, showing the
      concept moved from local CLI engine into hosted platform infrastructure.
  package-nerd-significance:
    - >
      Chainhook is notable because it packages blockchain indexing as a
      developer-controlled CLI rather than only as a hosted API. For package ecosystems,
      it is also a Rust/Cargo-era tool distributed through Brew, Snap, Winget, source
      builds, and GitHub releases, aimed at developers who need reproducible local and
      CI behavior around on-chain events.
  project-history:
    - >
      The official README describes Chainhook as a transaction indexing engine for
      reliable blockchain data across forks and reorgs, focused on lighter indexes and
      IFTTT-style predicates. Hiro's August 2023 release roundup says Hiro launched
      Chainhook as an open-source engine for efficient indexing and webhook-style
      triggers.
  related-projects:
    - >
      Chainhook is related to the Stacks Blockchain API, Hiro Platform, Clarinet/devnet
      workflows, bitcoind, Ordhook, Ordinals indexing, and Bitcoin/Stacks node
      infrastructure.
  sources:
    - https://github.com/hirosystems/chainhook#readme
    - https://www.hiro.so/blog/release-roundup-august-2023
    - https://www.hiro.so/blog/release-roundup-february-2024
    - https://www.hiro.so/blog/announcing-programmatic-api-access-to-chainhook-and-devnet
    - https://www.hiro.so/blog/release-roundup---september-2025
    - https://www.hiro.so/blog/chainhooks-v2-is-now-generally-available
  summary:
    - >
      Chainhook is Hiro Systems' reorg-aware indexing and event trigger engine for
      Stacks and Bitcoin. It lets developers define predicates for the on-chain events
      they care about and send matching events to files or HTTP endpoints.
  timeline:
    - >
      2023: Hiro launched Chainhook as an open-source engine for efficient indexing and
      webhook-style triggers.
    - '2024: Hiro released Chainhook v1.3.0 with Prometheus metrics support.'
    - '2025: Hiro reported Chainhook 2.0 alpha testing and later limited-access beta.'
    - >
      2026: Hiro announced Chainhooks v2 generally available and migration away from
      hosted v1.
  usage:
    - >
      Developers create predicate JSON files for Bitcoin or Stacks, scan chain data with
      a local bitcoind or Stacks node, and route matches through actions such as HTTP
      POST or file append. The README covers txid, output, OP_RETURN, Ordinals, Stacks
      asset, event, contract-call, and contract-deployment predicates.
related-packages:
  - id: brew:clarinet
    reason: >
      Use Clarinet to develop and test Stacks smart contracts in a local devnet, then
      use Chainhook predicates to react to the resulting on-chain events; Hiro
      documented Chainhook improvements within the Clarinet workflow.
    rel: adjacent_workflow
    sources:
      - https://www.hiro.so/blog/release-roundup-july-2022
      - https://docs.stacks.co/clarinet
category: developer-tools
package-manager:
  brew: chainhook
  winget: HiroSystems.Chainhook
package-manager-url: https://formulae.brew.sh/formula/chainhook
license: GPL-3.0-only
tags:
  - bitcoin
  - blockchain
  - cli
  - indexing
  - stacks
  - transactions
description: Reorg-aware indexing engine for the Stacks & Bitcoin blockchains
executables:
  - chainhook
provenance:
  formula: chainhook
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
