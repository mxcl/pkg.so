id: brew:abcmidi
display-name: abcMIDI
homepage: https://ifdo.ca/~seymour/runabc/
repo: https://github.com/sshlien/abcmidi
docs:
  - https://abcmidi.sourceforge.io/
  - https://github.com/sshlien/abcmidi#readme
  - https://ifdo.ca/~seymour/runabc/top.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      abcMIDI became part of the abc notation toolchain used by graphical front ends and
      music editors. The README says components of the package are included in numerous
      applications for creating and editing abc files, and the input package-manager
      facts show it packaged across Homebrew, Debian, Fedora, MacPorts, Nix, Arch, and
      Ubuntu.
  package-nerd-significance:
    - >
      abcMIDI is package-nerd interesting because it is a specialist plain-text music
      toolkit with decades of continuity, many small binaries, and a release cadence
      still tied to individual tool versions. It sits at the intersection of old Unix
      filter culture, MIDI, TeX/PostScript-era notation workflows, and modern
      package-manager distribution.
  project-history:
    - >
      The official README says James Allwright created abcMIDI in the early 1990s and
      that Seymour Shlien later took over maintenance. Shlien's project page describes
      abc notation as a plain-text music language introduced by Chris Walshaw in 1993
      and places abcMIDI among the early tools built around that ecosystem.
    - >
      The package grew beyond its original tools as Shlien added programs such as
      abcmatch and midicopy. The current official page names the ifdo.ca site as the
      latest source for abcMIDI and notes that SourceForge is updated less frequently;
      the GitHub repository mirrors this current maintained source.
  related-projects:
    - >
      Related projects include runabc, EasyABC, abcm2ps, abc2svg, abc2ps,
      abcnotation.com, and the ABC Plus project. These projects form the broader abc
      notation editing, rendering, and playback ecosystem referenced by the official
      README and project page.
  sources:
    - >
      Official README, official project page, GitHub repository metadata, and
      source_facts.package-manager.
  summary:
    - >
      abcMIDI is a long-running suite of C command-line tools for working with abc music
      notation and MIDI. Its core programs convert abc text notation to MIDI, transpose
      abc files, derive abc from MIDI, inspect MIDI, and support older
      PostScript-oriented notation workflows.
  timeline:
    - >
      1993: Chris Walshaw introduces abc notation, according to Shlien's official
      project page.
    - >
      Early 1990s: James Allwright creates the abcMIDI package in C, according to the
      official README.
    - >
      2000s: Seymour Shlien takes over support and maintenance, described on the
      official project page as about 20 years before its 2026 update.
    - '2019: The current GitHub repository is created.'
    - '2022: Earliest GitHub tag in the current repository is 2022.02.13.'
    - '2026: The official project page lists abcMIDI 2026.06.24 as the latest stable zip.'
  usage:
    - >
      Package users mostly encounter abcMIDI as small Unix-style filters: abc2midi
      converts abc notation to MIDI, midi2abc works in the reverse direction, abc2abc
      rewrites notation, and the companion tools inspect or copy MIDI data. The official
      README also documents traditional configure/make installation and a newer CMake
      build.
related-packages:
  - id: brew:abcm2ps
    reason: >
      Use abcm2ps with abcMIDI when ABC files need higher-quality PostScript or SVG
      score engraving; abcMIDI's official README identifies abcm2ps as a successor to
      its older yaps rendering path.
    rel: adjacent_workflow
    sources:
      - https://github.com/sshlien/abcmidi
      - https://chiselapp.com/user/moinejf/repository/abcm2ps/doc/trunk/README.md
category: media
package-manager:
  brew: abcmidi
  debian: abcmidi
  dnf: abcMIDI
  macports: abcMIDI
  nix: abcmidi
  pacman: abcmidi
  ubuntu: abcmidi
  winget: Yaps.Yaps
