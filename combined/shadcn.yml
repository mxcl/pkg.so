id: brew:shadcn
display-name: shadcn
homepage: https://ui.shadcn.com
repo: https://github.com/shadcn-ui/ui
docs:
  - https://ui.shadcn.com/docs
  - https://ui.shadcn.com/docs/cli
config-file-location:
  unix: components.json
  windows: components.json
credentials-file-location:
  unix: .env.local
  windows: .env.local
history:
  adoption-history:
    - >
      The CLI became the package-managed entry point for shadcn/ui's copy-and-customize
      workflow. Official changelog milestones include a rewritten CLI in June 2023, the
      `init` workflow in April 2024, CLI 3.0 and MCP support in August 2025, and CLI v4
      in March 2026.
  package-nerd-significance:
    - >
      shadcn is notable because it uses a package-manager-delivered CLI without treating
      the resulting UI as an opaque dependency: it resolves registry items and writes
      editable source into the consumer's project. This source-distribution model made
      `components.json`, registries, and repeatable CLI invocations central to the
      ecosystem.
  project-history:
    - >
      The shadcn-ui/ui repository began in 2023 as an open-code component collection.
      The project subsequently developed a dedicated `shadcn` package for
      initialization, registry resolution, component installation, migrations,
      documentation lookup, and project inspection.
  related-projects:
    - >
      shadcn/ui is closely associated with React, Tailwind CSS, Radix UI, Base UI,
      component registries, and framework templates such as Next.js and Vite.
  sources:
    - https://github.com/shadcn-ui/ui
    - https://ui.shadcn.com/docs/changelog
    - https://ui.shadcn.com/docs/cli
    - https://ui.shadcn.com/docs/components-json
  summary:
    - >
      shadcn is the official command-line tooling for shadcn/ui, an open-code component
      system. Rather than installing a conventional sealed component library, it adds
      customizable component source and supporting dependencies directly to an
      application.
  timeline:
    - '2023: The repository and early component tooling appeared publicly.'
    - 'June 2023: The project announced a new CLI.'
    - 'April 2024: `shadcn init` became an official workflow.'
    - 'August 2025: CLI 3.0 introduced a rewritten registry engine and MCP support.'
    - >
      March 2026: CLI v4 added presets, templates, monorepo improvements, documentation
      lookup, and agent-oriented skills.
  usage:
    - >
      Users run `shadcn init` to configure a project and `shadcn add` to copy registry
      components into it. The optional project-root `components.json` records style,
      framework-related choices, aliases, registry definitions, and destination paths.
category: developer-tools
package-manager:
  brew: shadcn
  nix: shadcn
package-manager-url: https://formulae.brew.sh/formula/shadcn
license: MIT
tags:
  - cli
  - design-system
  - frontend
  - react
  - tailwind-css
  - ui-components
description: CLI for adding components to your project
executables:
  - shadcn
provenance:
  formula: shadcn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
