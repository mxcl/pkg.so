id: brew:pcsc-lite
display-name: pcsc-lite
homepage: https://pcsclite.apdu.fr/
repo: https://salsa.debian.org/rousseau/PCSC
docs:
  - https://pcsclite.apdu.fr/
  - https://pcsclite.apdu.fr/api/group__API.html
  - https://pcsclite.apdu.fr/api/index.html
config-file-location:
  unix: /etc/reader.conf.d/
  windows: linux
credentials-file-location: null
history:
  adoption-history:
    - >
      PC/SC Lite supplies the Windows-compatible SCard programming model on Unix-like
      systems and is packaged as a daemon, runtime library, and development headers by
      major distributions. The supplied metadata records packages in Homebrew, Alpine,
      Debian/Ubuntu, Fedora, and openSUSE.
    - >
      The official project page documents GNU/Linux as the principal supported platform.
      Apple reimplemented PC/SC over CryptoTokenKit on macOS, while Solaris carries a
      fork and BSD support is described as possible but not routinely tested by the
      maintainer.
  package-nerd-significance:
    - >
      PC/SC Lite is a classic plumbing package: most users encounter it indirectly when
      authentication tokens, identity cards, SIM tools, or other smart-card applications
      need a standardized reader service.
    - >
      Its split between pcscd, libpcsclite, reader drivers such as CCID, and client
      applications makes daemon activation and device discovery frequent packaging
      integration points.
  project-history:
    - >
      David Corcoran started the pcsc-lite project in 1999 to provide a portable
      implementation of the PC/SC smart-card API. Ludovic Rousseau has been the main
      author since 2001.
    - >
      The implementation evolved into a client library and server daemon communicating
      over IPC. Its C API emulates the Windows WinSCard interface so applications can
      access readers and cards through a common abstraction.
    - >
      Current development is published through the maintainer's PCSC repositories on
      Debian Salsa and GitHub, and the project now uses Meson as its build system.
  related-projects:
    - >
      libccid provides a widely used USB CCID smart-card reader driver consumed
      alongside pcsc-lite.
    - The PC/SC Workgroup specification defines the cross-vendor smart-card API model.
    - >
      Apple's CryptoTokenKit underlies the contemporary macOS PC/SC compatibility
      implementation.
  sources:
    - 'Official API documentation: https://pcsclite.apdu.fr/api/index.html'
    - 'Official project page: https://pcsclite.apdu.fr/'
    - 'Official source repository: https://salsa.debian.org/rousseau/PCSC'
    - source_facts.package-manager
  summary:
    - >
      PC/SC Lite is Unix smart-card middleware implementing the SCard/WinSCard API
      through the pcscd resource-manager daemon and libpcsclite client library.
  timeline:
    - '1999: David Corcoran started pcsc-lite.'
    - "2001: Ludovic Rousseau became the project's main author."
    - '2018: The current PCSC project was created on Debian Salsa.'
    - 'Current releases: Meson is the documented build system.'
  usage:
    - >
      Applications link libpcsclite and call SCard-compatible functions to discover
      readers, connect to cards, transmit commands, and monitor card state. pcscd
      brokers access to readers and cards.
    - >
      Administrators commonly combine pcsc-lite with a reader driver such as libccid.
      pcsc-spy can trace client API activity for debugging.
    - >
      The official support instructions warn that APDU debug logs can contain a
      smart-card PIN and recommend changing the PIN before producing such logs.
category: security
package-manager:
  apk: pcsc-lite
  brew: pcsc-lite
  debian: libpcsclite-dev
  dnf: pcsc-lite
  ubuntu: libpcsclite-dev
  zypper: libpcsclite1
package-manager-url: https://formulae.brew.sh/formula/pcsc-lite
license: BSD-3-Clause AND BSD-2-Clause AND GPL-3.0-or-later AND ISC
tags:
  - cli
  - daemon
  - middleware
  - pcsc
  - scard-api
  - smart-card
description: Middleware to access a smart card using SCard API
executables:
  - pcsc-spy
  - pcscd
provenance:
  formula: pcsc-lite
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
