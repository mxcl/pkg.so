id: brew:git-get
display-name: git-get
homepage: https://github.com/grdl/git-get
repo: https://github.com/grdl/git-get
docs:
  - https://github.com/grdl/git-get/tree/main/docs
  - https://github.com/grdl/git-get#readme
config-file-location:
  unix: ~/.gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      git-get addresses a common developer workstation habit: keeping many clones under
      a host-and-path directory tree rather than scattered project folders. Homebrew,
      Nix, and Windows package metadata indicate packaging across several developer
      environments, though its adoption remains focused on users who manage many
      repositories locally.
  package-nerd-significance:
    - >
      git-get is package-manager interesting because it turns a personal source-tree
      convention into a portable Git extension. It overlaps with older
      `~/src/host/user/repo` habits while adding packageable binaries, symlinks, and
      cross-platform release artifacts.
  project-history:
    - >
      The project started in 2020 and frames itself as a repository-organization tool
      inspired by the predictability of Go's `go get` path layout. Its README describes
      a single binary that behaves as `git-get` or `git-list` depending on invocation,
      with repository URL parsing, batch clone dumps, multi-platform releases, and
      configuration through flags, environment variables, or Git config.
  related-projects:
    - >
      git-get relates to Go's source path conventions, Git subcommand wrappers, `gh repo
      clone`, and source-tree organizers such as git-grab.
  sources:
    - https://formulae.brew.sh/formula/git-get
    - https://github.com/grdl/git-get
    - https://github.com/grdl/git-get/blob/main/README.md
    - https://github.com/grdl/git-get/releases
  summary:
    - >
      git-get is a Go command-line tool for cloning and organizing Git repositories into
      a predictable directory tree derived from repository URLs. It provides `git get`
      for cloning and `git list` for scanning repository status.
  timeline:
    - '2020: Repository created on GitHub.'
    - '2020: v0.1.0 release began the tagged release line.'
    - '2021: v0.5.0 release continued the early Go implementation.'
    - '2025: v0.6.x releases refreshed packaging and release artifacts.'
  usage:
    - >
      Practitioners run `git get github.com/owner/repo` to clone into a root such as
      `~/repositories/github.com/owner/repo`, then use `git list` to show repository
      status. Dump files let users recreate a local source tree from a list, which makes
      the tool useful for dotfiles-driven workstation setup.
related-packages:
  - id: brew:git-grab
    reason: >
      Choose git-grab when you want a smaller clone-focused Git extension with a `~/src`
      default and clipboard support; choose git-get when repository listing and
      dump-based reconstruction are important.
    rel: alternative
    sources:
      - https://github.com/grdl/git-get#readme
      - https://codeberg.org/wezm/git-grab
      - https://github.com/wezm/git-grab#readme
category: developer-tools
package-manager:
  brew: git-get
  nix: git-get
  winget: grdl.git-get
package-manager-url: https://formulae.brew.sh/formula/git-get
license: MIT
tags:
  - cli
  - clone
  - git
  - go
  - repository-management
description: Better way to clone, organize and manage multiple git repositories
executables:
  - git-list
provenance:
  formula: git-get
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
