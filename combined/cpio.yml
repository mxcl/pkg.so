id: brew:cpio
display-name: GNU cpio
homepage: https://www.gnu.org/software/cpio/
repo: https://git.savannah.gnu.org/git/cpio.git
docs:
  - https://www.gnu.org/software/cpio/manual
  - https://www.gnu.org/software/cpio
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts list GNU cpio across common Unix-like package managers,
      including Debian, Ubuntu, Fedora/dnf, Alpine/apk, Arch/pacman, openSUSE/zypper,
      Nix, MacPorts, Homebrew, and a GnuWin32 package. That breadth matches cpio's role
      as a standard archive utility rather than an application-level tool.
  package-nerd-significance:
    - >
      Package maintainers care about cpio because it is both a user-facing archive
      command and an old archive format that still appears in build systems, initramfs
      tooling, backups, and historical Unix data. GNU cpio's NEWS also matters to
      distributors because it records CVE fixes, reproducibility options, and large-file
      behavior changes.
  project-history:
    - >
      GNU cpio's manual is published by the Free Software Foundation and documents the
      program as a tool for creating and extracting archives or copying directory trees.
      The manual credits Robert Carleton and Sergey Poznyakoff, and the current GNU
      source package includes documentation maintained through the 2.15 release.
    - >
      The GNU package history visible in NEWS shows long-running maintenance around
      archive-format compatibility, large-file support, security fixes, reproducible
      archive options, and portability fixes. Version 2.0 added SVR4 cpio formats and
      traditional/POSIX tar archive support; later releases added sparse handling, GPLv3
      licensing, reproducible archive support, and security fixes.
  related-projects:
    - GNU tar is related through archive-format compatibility.
    - GNU find is commonly paired with cpio to provide file lists.
  sources:
    - https://www.gnu.org/software/cpio/manual/
    - https://ftp.gnu.org/gnu/cpio/cpio-2.15.tar.gz
    - https://ftp.gnu.org/gnu/cpio/
  summary:
    - >
      GNU cpio is the GNU implementation of the classic copy-in/copy-out archiver. It
      copies files between directories and archives, including cpio formats and tar
      formats, and remains a small but important Unix packaging and recovery tool.
  timeline:
    - '1996: GNU FTP archive lists cpio 2.4.2.'
    - '2007: Version 2.9 switched GNU cpio to GPLv3.'
    - '2015: Version 2.12 added --reproducible archive support.'
    - '2019: Version 2.13 fixed CVE-2015-1197, CVE-2016-2037, and CVE-2019-14866.'
    - '2024: Version 2.15 fixed copy-in and --no-absolute-filenames behavior.'
  usage:
    - >
      GNU cpio has three primary modes: copy-out to create archives from file lists,
      copy-in to extract archives, and copy-pass to copy directory trees. The manual
      emphasizes pipelines with find or ls, archive media such as disk files, tapes, and
      pipes, and compatibility with multiple cpio and tar formats.
related-packages:
  - id: brew:gnu-tar
    reason: >
      Choose GNU tar for mainstream tarball, source-distribution, and incremental-backup
      workflows; GNU's own comparison explains format and filesystem-handling
      differences from cpio.
    rel: alternative
    sources:
      - https://www.gnu.org/software/tar/manual/html_section/cpio.html
      - https://www.gnu.org/software/cpio/manual/
  - id: brew:findutils
    reason: >
      GNU findutils is a direct workflow companion because official find documentation
      pipes selected, null-delimited file lists into cpio for safe directory-tree
      copying.
    rel: adjacent_workflow
    sources:
      - >
        https://www.gnu.org/software/findutils/manual/html_node/find_html/Copying-A-Subset-of-Files.html
      - https://www.gnu.org/software/cpio/manual/
category: system
package-manager:
  apk: cpio
  brew: cpio
  debian: cpio
  dnf: cpio
  macports: cpio
  nix: cpio
  pacman: cpio
  ubuntu: cpio
  winget: GnuWin32.Cpio
  zypper: cpio
package-manager-url: https://formulae.brew.sh/formula/cpio
license: GPL-3.0-or-later
tags:
  - archive
  - backup
  - cli
  - gnu
  - tar
description: Copies files into or out of a cpio or tar archive
executables:
  - cpio
provenance:
  formula: cpio
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
