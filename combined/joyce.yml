config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      JOYCE is niche by normal package-manager standards, but valuable in retrocomputing
      because it packages PCW and PcW16 emulation for modern systems. Homebrew packaging
      makes xjoyce and companion disk utilities available to macOS users without
      manually building an older SDL-based emulator stack.
  package-nerd-significance:
    - >
      JOYCE matters to package nerds because it is the sort of emulator that keeps
      historically specific hardware usable from a standard package manager. Its formula
      bundles not just a main emulator but disk and utility commands, which is typical
      of preservation-oriented emulator packages.
  project-history:
    - >
      The official JOYCE page describes an SDL-based emulator for the Amstrad PCW on
      Unix, Windows, and Mac OS X, with possible portability to other SDL-supported
      platforms. The FAQ documents emulation of the Z80 CPU, screen, keyboard, floppy
      controller, Centronics ports, serial interface, built-in PCW printers, mice, light
      pen, beeper, and LocoLink.
    - >
      The update history reaches at least December 2002 with JOYCE v2.0.2 and continues
      through the 2.2 stable series, 2.4 stable series, and 2.5 development series.
      Later entries added or repaired hard-drive emulation, host-directory drive
      support, PcW16 acceleration, joystick support, disk-format support, Mac OS X build
      support, printer output, PCW-Linkit, and PDF/PNG output paths.
  related-projects:
    - >
      JOYCE is paired with ANNE for PcW16 emulation and is related to the Amstrad PCW,
      CP/M, LocoScript, DSK disk-image tooling, LocoLink, PCW public-domain software
      archives, and other PCW emulators and preservation projects.
  sources:
    - https://formulae.brew.sh/formula/joyce
    - https://www.seasip.info/Unix/Joyce/download.html
    - https://www.seasip.info/Unix/Joyce/faq.html
    - https://www.seasip.info/Unix/Joyce/index.html
  summary:
    - >
      JOYCE is John Elliott's Amstrad PCW emulator for Unix, Windows, and macOS. It
      emulates the PCW family and incorporates ANNE for the PcW16, preserving a British
      word-processor/computer line whose original development codename, Joyce, became
      the emulator's name.
  timeline:
    - '2002-12: JOYCE v2.0.2 stable was released.'
    - '2007-12: JOYCE v2.2.0 stable was released.'
    - '2021-12: JOYCE v2.4.0 stable was released.'
    - '2023-05: JOYCE v2.4.2 stable was released with C++17 compilation fixes.'
    - '2026-03: JOYCE v2.5.5 development was released.'
  usage:
    - >
      JOYCE is used to boot and run Amstrad PCW software from disk images, use emulated
      printers and ports, share files through emulated drives, and preserve workflows
      around CP/M, LocoScript, PCW games, and PcW16 software. The FAQ is careful about
      boot disk legality, noting that copyrighted boot disks cannot simply be
      redistributed.
related-packages:
  - id: brew:libdsk
    reason: >
      Use LibDsk alongside JOYCE to inspect, convert, create, or access the .DSK and
      other floppy-image formats used in PCW emulation workflows.
    rel: adjacent_workflow
    sources:
      - https://www.seasip.info/Unix/Joyce/faq.html
      - https://www.seasip.info/Unix/LibDsk/
