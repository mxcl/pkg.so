id: brew:iredis
display-name: IRedis
homepage: https://iredis.xbin.io/
repo: https://github.com/laixintao/iredis
docs:
  - https://github.com/laixintao/iredis#readme
  - https://iredis.xbin.io/
config-file-location:
  unix:
    - /etc/iredisrc
    - ~/.iredisrc
    - ./.iredisrc
credentials-file-location:
  unix:
    - /etc/iredisrc
    - ~/.iredisrc
    - ./.iredisrc
history:
  adoption-history:
    - >
      IRedis moved beyond pip distribution into Homebrew and Linux distribution
      packages, and the project README documents pip, pipx, Homebrew, apt, and
      standalone binary installation paths. A pgcli project post in 2020 announced
      IRedis joining the dbcli organization, which helps explain its design culture:
      database shells with completion, hints, and presentation polish.
  package-nerd-significance:
    - >
      IRedis is interesting to package people because it is not a server or driver but a
      nicer operations shell. Packaging has to track Python support, Redis command
      metadata, optional standalone binary history, and config-file paths, while users
      expect it to feel like a drop-in friendlier `redis-cli`.
  project-history:
    - >
      The first PyPI files for IRedis appeared in August 2019, and the README describes
      the project as a Redis alternative to `redis-cli` with auto-completion, syntax
      highlighting, command validation, and safer behavior around dangerous commands
      such as `KEYS *`. Its documentation emphasizes a Redis-compatible interactive mode
      while adding history-aware completion, command hints, DSN support, cluster
      support, URL connections, pager support, and human-friendly rendering.
    - >
      The changelog shows the project following Redis command evolution closely:
      releases added support for Redis 6 username authentication, Redis 7 command
      coverage, cluster MOVED handling, NAT mapping for cluster deployments, Python
      version changes, and updates to command grammar data.
  related-projects:
    - >
      IRedis is related to Redis, redis-cli, redis-py, prompt-toolkit-style terminal
      interfaces, and the dbcli ecosystem that includes pgcli and mycli.
  sources:
    - https://formulae.brew.sh/formula/iredis
    - https://github.com/laixintao/iredis
    - https://pypi.org/project/iredis/
    - https://raw.githubusercontent.com/laixintao/iredis/master/CHANGELOG.md
    - https://raw.githubusercontent.com/laixintao/iredis/master/README.md
    - https://www.pgcli.com/welcome-iredis.html
  summary:
    - >
      IRedis is an interactive Redis terminal client that adds completion, syntax
      highlighting, validation, hints, and friendlier output around the Redis
      command-line workflow. It belongs to the dbcli-style family of database CLIs that
      make REPL use safer and more ergonomic than a bare protocol client.
  timeline:
    - '2019: First PyPI releases appeared in August.'
    - '2020: The pgcli project welcomed IRedis to the dbcli organization.'
    - '2021: Changelog entries added Redis command support and Python compatibility updates.'
    - '2022: IRedis accepted Redis 6 username auth and added Redis 7-oriented command support.'
    - >
      2024: The project updated Redis command grammar and Python support while
      deprecating standalone PyOxidizer builds after v1.15.2.
    - '2026: IRedis 1.16.1 added Redis Cluster NAT mapping and MOVED redirect handling fixes.'
  usage:
    - >
      Users run `iredis` interactively, connect with Redis host/port flags or Redis
      URLs, store DSNs in `iredisrc`, and issue Redis commands with validation and
      completion. The package can also run one-shot commands, handle TLS URLs, support
      Redis Cluster redirects, and hide passwords during AUTH.
related-packages:
  - id: brew:redis
    reason: >
      Redis is the server and official command-line-tool package that IRedis connects
      to, making it the direct companion for a local Redis development or administration
      workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/laixintao/iredis#readme
      - https://github.com/redis/redis#readme
  - id: cask:redis-insight
    reason: >
      Choose Redis Insight when you prefer an official graphical Redis client with key
      browsing, visualization, profiling, and a command workbench instead of IRedis's
      terminal-centered workflow.
    rel: alternative
    sources:
      - https://github.com/laixintao/iredis#readme
      - https://redis.io/docs/latest/operate/redisinsight/
category: data
package-manager:
  brew: iredis
  debian: iredis
  nix: iredis
  ubuntu: iredis
  zypper: iredis
package-manager-url: https://formulae.brew.sh/formula/iredis
license: BSD-3-Clause
tags:
  - cli
  - database-client
  - python
  - redis
  - terminal
description: Terminal Client for Redis with AutoCompletion and Syntax Highlighting
executables:
  - iredis
provenance:
  formula: iredis
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
