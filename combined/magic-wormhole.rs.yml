id: brew:magic-wormhole.rs
display-name: magic-wormhole.rs
homepage: https://github.com/magic-wormhole/magic-wormhole.rs
repo: https://github.com/magic-wormhole/magic-wormhole.rs
docs:
  - https://docs.rs/magic-wormhole/latest/magic_wormhole
  - https://github.com/magic-wormhole/magic-wormhole.rs#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is smaller than the original Python tool but meaningful in the Rust and
      desktop-file-transfer ecosystem. The official README lists applications using the
      Rust library, including GNOME Warp, an Android client, Wyrmhole, and rvIRC.
    - >
      The package appears in multiple package managers in the supplied Homebrew input,
      including Homebrew, Debian as `wormhole-rs`, Nix, Scoop, apk, and zypper. That
      spread reflects its role as the Rust CLI variant for users who prefer a static-ish
      native toolchain or Rust library integration.
  package-nerd-significance:
    - >
      For package maintainers, magic-wormhole.rs is the native Rust counterpart to a
      well-known Python network utility. That matters in environments where dependency
      closure, startup time, or embedding a library into a Rust application is
      preferable to shipping Python and Twisted dependencies.
    - >
      It is also useful as a compatibility story: the package keeps the Magic Wormhole
      user experience while extending it with features that appeal to command-line and
      desktop client builders.
  project-history:
    - >
      The repository was created in March 2018 under the magic-wormhole GitHub
      organization. Its README identifies it as a Rust port of the Python
      implementation, while also documenting Rust-specific additions such as direct
      connections across NATs and firewalls, clipboard copying, experimental port
      forwarding, multi-recipient sending, and fuzzy code completion.
    - >
      By 2022 the project was publishing 0.x GitHub releases, and its latest releases
      show continued maintenance of both CLI and library APIs. The codebase is almost
      entirely Rust and exposes hosted API documentation through docs.rs.
  related-projects:
    - >
      The original Python Magic Wormhole implementation is the upstream protocol and
      user-experience reference.
    - >
      GNOME Warp, Wormhole File Transfer, Wyrmhole, and rvIRC are listed by the project
      as applications using the Rust library.
  sources:
    - https://docs.rs/magic-wormhole/latest/magic_wormhole/
    - https://github.com/magic-wormhole/magic-wormhole.rs
    - https://github.com/magic-wormhole/magic-wormhole.rs/releases
    - https://magic-wormhole.readthedocs.io/en/latest/
    - source_facts.package-manager
    - source_facts.repo
  summary:
    - >
      magic-wormhole.rs, also known as Rusty Wormhole, is a Rust implementation of the
      Magic Wormhole file-transfer protocol. It provides a `wormhole-rs` CLI and a Rust
      library for the same code-authenticated transfer model as the original Python
      project.
  timeline:
    - '2018: Public GitHub repository created.'
    - '2022: 0.3.0 and subsequent 0.x releases published.'
    - '2023: 0.6.x releases published.'
    - '2026: 0.8.x releases published with API and security maintenance.'
  usage:
    - >
      End users use `wormhole-rs` for Magic Wormhole-style file transfer. Developers use
      the `magic-wormhole` Rust crate when they want to embed the protocol in GUI
      clients, mobile clients, port-forwarding tools, or other Rust applications.
    - >
      The README positions the CLI under `./cli` and points library users to Rust
      documentation, while also linking back to the Magic Wormhole protocol
      specification.
related-packages:
  - id: brew:magic-wormhole
    reason: >
      Choose the original Magic Wormhole for text messages, native directory transfer,
      Tor support, and its established Python API; choose magic-wormhole.rs for a Rust
      library and its direct-connect, clipboard, forwarding, and multi-recipient
      extensions.
    rel: alternative
    sources:
      - >
        https://github.com/magic-wormhole/magic-wormhole.rs#comparison-with-the-python-implementation
      - https://magic-wormhole.readthedocs.io/en/latest/welcome.html
  - id: brew:croc
    reason: >
      Choose croc for resumable multi-file transfers and broad single-binary
      distribution; choose magic-wormhole.rs when Magic Wormhole protocol
      interoperability or an embeddable Rust API is required.
    rel: alternative
    sources:
      - https://github.com/schollz/croc#readme
      - https://github.com/magic-wormhole/magic-wormhole.rs
      - https://docs.rs/magic-wormhole/latest/magic_wormhole/
category: networking
