id: brew:darkhttpd
display-name: darkhttpd
homepage: https://unix4lyfe.org/darkhttpd/
repo: https://github.com/emikulic/darkhttpd
docs:
  - https://github.com/emikulic/darkhttpd
  - https://unix4lyfe.org/darkhttpd
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README and project page highlight portability across FreeBSD, Linux,
      OpenBSD, and Solaris, plus a very small Docker image. GitHub releases show active
      1.x maintenance into the mid-2020s.
  package-nerd-significance:
    - >
      darkhttpd is the sort of utility package people keep installed for throwaway local
      serving, embedded images, rescue shells, and tiny containers: the appeal is that
      the server is boring, static, scriptable, and not tied to a configuration tree.
  project-history:
    - >
      Emil Mikulic's official page describes darkhttpd as a web server for when a server
      is needed in a hurry. The project emphasizes a single binary, no required
      installation files, no inetd dependency, and no configuration file beyond
      specifying the web root.
  related-projects:
    - >
      The README compares darkhttpd culturally with small static servers and notes that
      suckless.org lists it among software that 'sucks less'.
  sources:
    - https://unix4lyfe.org/darkhttpd
    - https://github.com/emikulic/darkhttpd
    - https://github.com/emikulic/darkhttpd/releases
  summary:
    - >
      darkhttpd is a small C static web server designed for quickly serving files
      without CGI, daemon scaffolding, or a separate configuration file.
  timeline:
    - "2003: The official page's copyright span begins."
    - '2021: The official page was published with the current project summary.'
    - '2024: v1.15 and v1.16 were published on GitHub.'
    - '2025: v1.17 was published on GitHub.'
  usage:
    - >
      Users run darkhttpd by pointing it at a document root, then add command-line flags
      for port, bind address, logging, chroot, privilege drop, directory listing
      behavior, pidfiles, redirects, custom headers, and Docker deployment.
related-packages:
  - id: brew:caddy
    reason: >
      Choose Caddy when static-file serving also needs a maintained configuration system
      and automatic HTTPS rather than darkhttpd's minimal command-line-only model.
    rel: alternative
    sources:
      - https://unix4lyfe.org/darkhttpd/
      - https://caddyserver.com/docs/quick-starts/static-files
  - id: brew:nginx
    reason: >
      Choose nginx when the deployment also needs reverse proxying, reloadable
      configuration, or broader HTTP service controls beyond darkhttpd's static-only
      scope.
    rel: alternative
    sources:
      - https://unix4lyfe.org/darkhttpd/
      - https://nginx.org/en/docs/beginners_guide.html
category: networking
package-manager:
  apk: darkhttpd
  brew: darkhttpd
  dnf: darkhttpd
  macports: darkhttpd
  nix: darkhttpd
  pacman: darkhttpd
  zypper: darkhttpd
package-manager-url: https://formulae.brew.sh/formula/darkhttpd
license: ISC
tags:
  - c
  - cgi-free
  - cli
  - http-server
  - static-files
  - webserver
description: Small static webserver without CGI
executables:
  - darkhttpd
provenance:
  formula: darkhttpd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
