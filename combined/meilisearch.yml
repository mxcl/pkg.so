id: brew:meilisearch
display-name: Meilisearch
homepage: https://docs.meilisearch.com/
repo: https://github.com/meilisearch/meilisearch
docs:
  - https://www.meilisearch.com/docs/getting_started/overview
  - https://www.meilisearch.com/docs/llms.txt
config-file-location:
  unix: ./config.toml
  windows: .\config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Meilisearch became one of the more visible packaged search servers in the
      developer-tools ecosystem. The GitHub repository shows tens of thousands of stars
      and thousands of forks, and the supplied package facts list Homebrew, Nix, pacman,
      and Scoop packages.
    - >
      Its adoption is helped by the packaging shape: a Rust binary, Docker images,
      release binaries, and straightforward config via command-line flags, environment
      variables, or a TOML file. That makes it attractive for local development, small
      production services, SaaS search features, and demos where Elasticsearch-style
      operational weight is unwanted.
  package-nerd-significance:
    - >
      Meilisearch matters to package maintainers because it is a modern search daemon
      whose appeal depends on low-friction installation. It sits at the intersection of
      Rust services, developer-local databases, REST APIs, and search infrastructure, so
      package updates carry both binary compatibility and index-format migration
      concerns.
  project-history:
    - >
      Meilisearch grew around a developer-experience pitch: install one binary, send
      documents, and get fast search-as-you-type with sensible defaults instead of
      operating a heavier search cluster. The current README and docs still foreground
      that single-binary REST model, SDKs, typo tolerance, filtering, faceting, sorting,
      synonyms, geosearch, API keys, and multi-tenancy.
    - >
      Version 1.0.0 marked a stabilization milestone. The v1.0.0 release notes describe
      it as the first major release, with emphasis on CLI stability, final breaking CLI
      changes before v2.0.0, language-support improvements, indexing and search-speed
      work, and migration support from older versions via dumps.
    - >
      The project later expanded beyond classic keyword search. Current official docs
      describe fast full-text search, semantic search, hybrid search, conversational
      interfaces, RAG-oriented retrieval, vector embeddings, sharding, replication,
      Meilisearch Cloud, and SDKs for more than ten languages.
  related-projects:
    - "milli: Meilisearch's search/indexing engine referenced in release notes."
    - 'Meilisearch Cloud: the hosted service for Meilisearch.'
    - >
      Official SDKs: JavaScript, Python, PHP, Ruby, Go, Rust, Java, .NET, Swift, and
      Dart clients documented by the project.
  sources:
    - https://github.com/meilisearch/meilisearch
    - https://github.com/meilisearch/meilisearch/releases/tag/v1.0.0
    - https://www.meilisearch.com/docs/getting_started/overview
    - https://www.meilisearch.com/docs/resources/self_hosting/configuration/overview
    - source_facts.package-manager-url
  summary:
    - >
      Meilisearch is an open-source search engine distributed as a single binary with a
      REST API. The official documentation presents it as a fast, typo-tolerant,
      full-text, semantic, and hybrid search engine for websites, apps, documentation,
      internal tools, and AI retrieval workflows.
  timeline:
    - '2023-02-06: Meilisearch v1.0.0 released as the first major release.'
    - >
      2023: v1.0 release notes stabilized CLI behavior and committed to no breaking
      changes before v2.0.0.
    - >
      2026: Current docs describe full-text, semantic, hybrid, and conversational search
      in one API.
  usage:
    - >
      A typical self-hosted Meilisearch setup starts the server, indexes JSON documents,
      and uses the HTTP API or SDKs for search. The docs state that command-line options
      have highest configuration precedence, then environment variables, then the TOML
      config file.
    - >
      By default Meilisearch looks for config.toml in the working directory. The docs
      also document MEILI_CONFIG_FILE_PATH and --config-file-path for overriding that
      location.
related-packages:
  - id: brew:opensearch
    reason: >
      Choose OpenSearch when you need Elasticsearch compatibility, large distributed
      clusters, complex aggregations, log analytics, observability, or deep AWS
      integration; Meilisearch favors simpler application-facing instant search.
    rel: alternative
    sources:
      - https://www.meilisearch.com/docs/resources/comparisons/opensearch
      - https://docs.opensearch.org/
category: data
package-manager:
  brew: meilisearch
  nix: meilisearch
  pacman: meilisearch
  scoop: main/meilisearch
package-manager-url: https://formulae.brew.sh/formula/meilisearch
license: MIT
tags:
  - api
  - cli
  - full-text-search
  - rest-api
  - search
  - typo-tolerant
description: Ultra relevant, instant and typo-tolerant full-text search API
executables:
  - meilisearch
provenance:
  formula: meilisearch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
