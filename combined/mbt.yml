id: brew:mbt
display-name: Cloud MTA Build Tool
homepage: https://sap.github.io/cloud-mta-build-tool
repo: https://github.com/SAP/cloud-mta-build-tool
docs:
  - >
    https://help.sap.com/docs/hana-cloud-database/sap-hana-cloud-sap-hana-database-developer-guide-for-cloud-foundry-multitarget-applications-sap-business-app-studio/cloud-mta-build-tool-mbt
  - https://sap.github.io/cloud-mta-build-tool
config-file-location:
  unix: mta.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream documents several distribution paths: npm global installation, GitHub
      release downloads, and Docker images with preconfigured runtimes. The input
      metadata adds Homebrew, Alpine, Debian/Ubuntu, and Nix package names, showing that
      the CLI escaped SAP-specific install instructions and became a package-manager
      artifact for local developer machines and CI images.
  package-nerd-significance:
    - >
      mbt is interesting to package nerds because it is a vendor-specific cloud build
      CLI distributed like a normal Unix tool. It also has a mixed packaging story: a Go
      executable, npm installation path, Docker images, GitHub releases, and native
      package-manager entries all coexist around the same command.
  project-history:
    - >
      SAP's README describes mbt as a standalone command-line tool for building
      multitarget application archives and running intermediate build steps such as
      descriptor validation, module builds, and deployment descriptor generation. The
      public GitHub release stream starts with v0.0.1 in January 2019, matching its role
      as a purpose-built replacement for older MTA build flows.
    - >
      The tool sits at the boundary between application build systems and SAP cloud
      deployment packaging. Its input format, mta.yaml, comes from the SAP Multi-Target
      Application model, so the CLI is tightly connected to SAP's documentation and
      developer tooling rather than being a generic archive builder.
  related-projects:
    - >
      Related SAP tools and formats include the Multi-Target Application model,
      mta.yaml, mtad.yaml, SAP Cloud Foundry deployment tooling, and SAP Business
      Application Studio.
  sources:
    - https://github.com/SAP/cloud-mta-build-tool
    - https://github.com/SAP/cloud-mta-build-tool/releases
    - https://sap.github.io/cloud-mta-build-tool/
    - https://www.sap.com/documents/2021/09/66d96898-fa7c-0010-bca6-c68f7e60039b.html
    - source_facts.package-manager
  summary:
    - >
      The Cloud MTA Build Tool, installed as mbt, is SAP's command-line builder for
      Multi-Target Application archives. It turns an MTA development descriptor, usually
      mta.yaml, and module artifacts into deployment-ready .mtar archives for SAP Cloud
      Foundry style workflows.
  timeline:
    - '2019: The first public GitHub releases for cloud-mta-build-tool were published.'
    - >
      2020: SAP's README copyright period identifies SAP SE or an SAP affiliate company
      as the steward of the tool.
    - >
      2021: SAP published Multi-Target Application Model v3 documentation used by mbt
      projects.
    - '2026: Homebrew packages the mbt executable for local SAP cloud build workflows.'
  usage:
    - >
      mbt is used in SAP cloud application projects to validate mta.yaml, build modules,
      generate mtad.yaml, and produce .mtar archives. In package-manager culture it is
      mostly installed for CI pipelines and developer workstations that need to
      reproduce SAP Business Application Studio or Cloud Foundry deployment builds
      locally.
related-packages:
  - id: brew:cloudfoundry-cli
    reason: >
      Use mbt to produce the MTAR artifact, then use the Cloud Foundry CLI and its MTA
      deployment workflow to deliver that artifact to a Cloud Foundry target.
    rel: adjacent_workflow
    sources:
      - https://sap.github.io/cloud-mta-build-tool/
      - https://github.com/cloudfoundry/cli
      - https://docs.cloudfoundry.org/cf-cli/
category: cloud-infrastructure
package-manager:
  apk: mbt
  brew: mbt
  debian: libmbt-dev
  nix: mbt
  ubuntu: libmbt-dev
package-manager-url: https://formulae.brew.sh/formula/mbt
license: Apache-2.0
tags:
  - build-tool
  - cli
  - cloud-foundry
  - deployment
  - mta
  - sap
description: Multi-Target Application (MTA) build tool for Cloud Applications
executables:
  - mbt
provenance:
  formula: mbt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
