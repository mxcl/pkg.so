  - >
    https://help.uaudio.com/hc/en-us/articles/5085235532052-UA-Connect-with-Native-UAD-Plug-Ins
config-file-location:
  macos:
    - ~/Library/Application Support/Universal Audio/UA Connect/
    - /Library/PrivilegedHelperTools/com.uaudio.bsd.helper
    - /Library/LaunchDaemons/com.uaudio.bsd.helper.plist
  windows: '%LOCALAPPDATA%\Universal Audio\UA Connect\'
credentials-file-location: null
history:
  adoption-history:
    - >
      UA Connect is the common management application across several Universal Audio
      product families, including native UAD plug-ins, Apollo and UAD-2 software, Apollo
      E Series, Volt interfaces, UAFX pedals, UA microphones, and LUNA.
  package-nerd-significance:
    - >
      UA Connect is a vendor bootstrapper, updater, hardware-registration utility, and
      entitlement manager rather than an audio-production application by itself.
      Installing this one package can lead to downloads of plug-ins, drivers, firmware,
      Console, LUNA, and other product-specific components.
  project-history:
    - >
      Universal Audio developed UA Connect as its centralized desktop application for
      software installation, product registration, firmware updates, and related
      management functions. Its role expanded across native UAD software and multiple
      Universal Audio hardware families.
  related-projects:
    - >
      UA Connect manages or delivers software for UAD plug-ins, UAD Spark, LUNA, Apollo
      and UAD-2 systems, Volt interfaces, UAFX pedals, and UA microphones. Native
      plug-in licensing can involve linked iLok services and PACE License Support.
  sources:
    - https://help.uaudio.com/hc/en-us/articles/13178401374612-Getting-Started-with-UA-Connect
    - >
      https://help.uaudio.com/hc/en-us/articles/35180558198548-FAQ-How-to-Activate-UAD-Plug-ins-and-Apps-on-Your-Computer
    - >
      https://help.uaudio.com/hc/en-us/articles/5085235532052-UA-Connect-with-Native-UAD-Plug-Ins
    - https://www.uaudio.com/pages/download-ua-connect
  summary:
    - >
      UA Connect is Universal Audio's desktop installer and device-management
      application for UA software and hardware products.
  timeline:
    - >
      2025: Universal Audio expanded native UADx and LUNA licensing to local host
      activation on up to three eligible locations.
    - >
      2026: Official guidance describes UA Connect as the shared manager for software
      installation, firmware updates, registration, and authorization across major UA
      product families.
  usage:
    - >
      Users sign in with a Universal Audio account and use UA Connect to register
      supported hardware, install or update software and firmware, redeem bundled
      products, and manage native UAD plug-ins. Native UAD and LUNA workflows may also
      create or link an iLok account. The application runs in the background when needed
      for software activation and updates itself automatically.
