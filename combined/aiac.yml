id: brew:aiac
display-name: AIaC
homepage: https://github.com/gofireflyio/aiac
repo: https://github.com/gofireflyio/aiac
docs:
  - https://github.com/gofireflyio/aiac#readme
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/aiac/aiac.toml
    - ~/.config/aiac/aiac.toml
credentials-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/aiac/aiac.toml
    - ~/.config/aiac/aiac.toml
history:
  adoption-history:
    - >
      AIaC's official install instructions include a Homebrew tap, Docker image, go
      install command, source build, and Arch Linux AUR packages. The supplied package
      facts list Homebrew and Nix packaging, which fits an infrastructure engineer
      audience comfortable installing CLIs through multiple channels.
    - >
      The repository's GitHub metadata shows several thousand stars by the time of this
      enrichment run, suggesting wider interest than a one-off demo. The release history
      shows continued releases through v5.3.0 in October 2024.
  package-nerd-significance:
    - >
      AIaC is a useful package-culture artifact from the LLM CLI boom: not a general
      chat frontend, but a prompt-shaped code generator focused on infrastructure
      formats that package managers already serve to DevOps users.
    - >
      Its configuration model also shows the rapid shift from a single OpenAI-key CLI
      toward pluggable LLM backends, local model support, and provider-specific
      settings.
  project-history:
    - >
      The GitHub repository was created in December 2022 and the first listed release,
      v1.0.0, was published that month. The project appeared during the first wave of
      developer CLIs built around general-purpose LLM APIs, but narrowed the prompt
      domain to infrastructure and cloud operations.
    - >
      The README documents both CLI and library usage, and later versions added a
      backend-oriented configuration model. By the v5 README, AIaC could define multiple
      named backends for OpenAI, Amazon Bedrock, Ollama, Azure OpenAI-style endpoints,
      and related provider settings.
  related-projects:
    - >
      AIaC is related to Terraform, Pulumi, CloudFormation, Kubernetes, CI/CD systems,
      OPA, and cloud-provider CLIs as output targets rather than replacements.
    - The README names OpenAI, Amazon Bedrock, and Ollama as supported LLM provider backends.
  sources:
    - https://api.github.com/repos/gofireflyio/aiac
    - https://api.github.com/repos/gofireflyio/aiac/releases?per_page=100
    - https://github.com/gofireflyio/aiac#readme
    - source_facts.package-manager
  summary:
    - >
      AIaC is Firefly's Artificial Intelligence Infrastructure-as-Code Generator, a Go
      CLI and library that asks LLM providers to generate Terraform, Pulumi,
      CloudFormation, Kubernetes manifests, CI/CD pipelines, policy-as-code, shell
      utilities, and related infrastructure snippets.
  timeline:
    - '2022: GitHub repository created and v1.0.0 released.'
    - '2023: v2 releases shipped in the first half of the year.'
    - '2024: v4 releases shipped, followed by v5.0.0 in June.'
    - '2024: v5.3.0 released in October.'
  usage:
    - >
      Users configure one or more LLM backends in ${XDG_CONFIG_HOME}/aiac/aiac.toml,
      including API keys or profile settings, then run natural-language prompts such as
      requests for Terraform, Kubernetes manifests, GitHub Actions, OPA policies, AWS
      CLI commands, or SQL queries.
    - >
      By default, the CLI prints extracted code and can run interactively, save
      generated code to output files, write Markdown readmes, run quietly for scripts,
      or copy results to the clipboard.
related-packages: []
category: ai
