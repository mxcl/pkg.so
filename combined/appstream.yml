id: brew:appstream
display-name: AppStream
homepage: https://www.freedesktop.org/wiki/Distributions/AppStream/
repo: https://github.com/ximion/appstream
docs:
  - https://www.freedesktop.org/software/appstream/docs
  - https://github.com/ximion/appstream#readme
  - https://www.freedesktop.org/wiki/Distributions/AppStream
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AppStream adoption followed the need for application-centric package metadata in
      Linux distributions. Traditional package metadata tells a package manager what
      files and dependencies exist; AppStream adds names, summaries, screenshots, icons,
      release data, content metadata, firmware and driver component metadata, and a
      normalized view for graphical software catalogs.
    - >
      The project became important to distributions, Flatpak-like ecosystems, upstream
      application authors, and desktop software centers because it gives them a shared
      metadata language rather than one distro-specific app-store format.
    - >
      The README describes AppStream as part of freedesktop.org and lists tools for
      validation, data verification, diagnostics, and catalog composition. That made the
      CLI useful both in distro build infrastructure and in upstream CI checks for
      MetaInfo files.
  package-nerd-significance:
    - >
      AppStream is package metadata with UX consequences. It is why distro repositories
      can feed graphical app stores with screenshots, localized descriptions, component
      IDs, content ratings, release notes, and installable firmware/driver metadata
      without each frontend inventing a private database.
    - >
      For package nerds, the interesting part is that AppStream sits between upstream
      source releases, distro package builds, repository metadata, and desktop UX. A
      broken AppStream ID or invalid MetaInfo file can affect discoverability even when
      the package itself installs correctly.
  project-history:
    - >
      The freedesktop.org project page describes AppStream as a cross-distribution
      effort to standardize software component metadata and provide the foundation for
      software-center applications. It points to the specification, mailing list,
      release tarballs, and the GitHub development repository.
    - >
      The official documentation credits Matthias Klumpp as author and lists Michael
      Vogt, Richard Hughes, and Vincent Untz as contributors. It says the documentation
      covers a C/GLib reference implementation of the full specification and tooling
      such as `appstreamcli`.
    - >
      The upstream NEWS file records AppStream 0.1.0 in October 2012. The freedesktop
      wiki notes an initial AppStream meeting in 2011 in its attic, which places the
      effort in the early Linux software-center era.
  related-projects:
    - >
      appstream-glib is the older GLib helper library and builder toolchain now in
      maintenance mode.
    - >
      appstream-generator is listed by upstream as a distribution metadata generator
      using libappstream-compose internally.
    - >
      DEP-11 is the Debian-derived YAML catalog metadata format described by the
      AppStream specification.
  sources:
    - https://github.com/ximion/appstream#readme
    - https://github.com/ximion/appstream/blob/main/NEWS
    - https://www.freedesktop.org/software/appstream/docs/
    - https://www.freedesktop.org/wiki/Distributions/AppStream/
  summary:
    - >
      AppStream is the freedesktop.org specification, reference implementation, and
      CLI/tooling for distro-agnostic software component metadata. It standardizes
      MetaInfo XML, catalog XML/YAML, validation, metadata composition, and query
      tooling used by Linux software centers and repositories.
  timeline:
    - >
      2011: freedesktop wiki references initial AppStream meeting materials in the
      project attic.
    - '2012: upstream NEWS records AppStream 0.1.0.'
    - '2013: freedesktop wiki page creation date appears in the page metadata.'
    - '2015: NEWS records 0.8.x releases during early distribution adoption.'
    - >
      2026: official documentation identifies AppStream 1.0 documentation published in
      June 2026.
  usage:
    - >
      Upstream projects write MetaInfo XML files for applications, fonts, codecs,
      firmware, drivers, add-ons, and other components. Distributions package or compose
      those files into AppStream catalog metadata in XML or YAML.
    - >
      Maintainers commonly use `appstreamcli validate --pedantic /path/to/metadata.xml`
      to check metadata and `appstreamcli compose` to build catalogs from directory
      trees. Consumers such as software centers query the resulting metadata through
      libappstream.
related-packages:
  - id: brew:appstream-glib
    reason: >
      Choose appstream-glib only for established GLib-based workflows that specifically
      require `appstream-util` or its legacy builder interfaces; its upstream recommends
      AppStream for new development.
    rel: alternative
    sources:
      - https://github.com/hughsie/appstream-glib
      - https://github.com/ximion/appstream
category: system
package-manager:
  apk: appstream
  brew: appstream
  debian: appstream
  dnf: appstream
  macports: appstream
  nix: appstream
  pacman: appstream
  ubuntu: appstream
  zypper: AppStream
package-manager-url: https://formulae.brew.sh/formula/appstream
license: LGPL-2.1-or-later
