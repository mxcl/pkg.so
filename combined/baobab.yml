id: brew:baobab
display-name: Disk Usage Analyzer
homepage: https://apps.gnome.org/Baobab/
repo: https://gitlab.gnome.org/GNOME/baobab
docs:
  - https://apps.gnome.org/Baobab
  - https://help.gnome.org/baobab/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Baobab's adoption is mostly through GNOME distributions and package managers
      rather than a separate command-line community. Its presence in Debian, Ubuntu,
      Fedora, Arch, Nix, MacPorts, Homebrew, and other package sets reflects its role as
      a standard graphical disk-inspection utility.
  package-nerd-significance:
    - >
      For package maintainers, Baobab is a compact example of the modern GNOME app
      stack: Meson build files, Vala sources, localized help, AppStream metadata, and
      frequent translation updates. It also gives non-GNOME package collections a
      user-facing storage tool that complements terminal utilities.
  project-history:
    - >
      The current Baobab repository describes the program as the GNOME Disk Usage
      Analyzer and its DOAP metadata classifies it as a GNOME core application written
      in Vala. The modern standalone source tree has public GNOME release tags beginning
      with the GNOME 3 era, while the package remains tied to the GNOME application
      release cadence.
    - >
      Its release notes show steady adaptation to GNOME platform changes rather than
      large shifts in purpose: recent milestones include libadwaita design work in the
      GNOME 45 cycle, GtkColumnView and AdwDialog work in the GNOME 47 cycle, and
      scanning speed and memory improvements in the GNOME 49 cycle.
  related-projects:
    - >
      Baobab sits beside terminal disk-usage tools such as du and ncdu, and beside other
      GNOME core utilities. Its upstream development, translations, help, issue
      tracking, and release metadata are managed in GNOME infrastructure.
  sources:
    - https://gitlab.gnome.org/GNOME/baobab/-/raw/main/NEWS
    - https://gitlab.gnome.org/GNOME/baobab/-/raw/main/README.md
    - https://gitlab.gnome.org/GNOME/baobab/-/raw/main/baobab.doap
    - https://gitlab.gnome.org/api/v4/projects/GNOME%2Fbaobab/repository/tags?per_page=100
    - source_facts.package-manager
  summary:
    - >
      Baobab is GNOME's graphical Disk Usage Analyzer, packaged on Unix-like systems as
      a small desktop utility for scanning folders, volumes, and mounted devices.
  timeline:
    - >
      2011: Standalone GNOME Baobab release tags appear in the public source repository
      with version 3.3.1.
    - '2012: Baobab follows the GNOME 3.4 and 3.6 stable release cycles.'
    - >
      2023: GNOME 45 release notes record adoption of newer libadwaita widgets and
      design patterns.
    - '2025: GNOME 49 release notes record scanning speed and memory-usage improvements.'
    - '2026: GNOME 50.0 is published with continued UI and translation maintenance.'
  usage:
    - >
      Users launch Baobab to scan local folders, remote folders, volumes, or mounted
      devices and inspect directory sizes as a graphical tree or proportional
      visualization. It is useful when a Unix workstation needs a quick answer to what
      is consuming disk space without dropping into du, ncdu, or filesystem-specific
      tools.
related-packages:
  - id: brew:ncdu
    reason: >
      Choose ncdu for a text-mode disk-usage browser that works well over SSH or without
      a graphical desktop; choose Baobab for GNOME's graphical tree and space
      visualizations.
    rel: alternative
    sources:
      - https://apps.gnome.org/Baobab/
      - https://dev.yorhel.nl/ncdu
category: system
