config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ffsend is packaged for command-line users across several ecosystems, including
      Homebrew, MacPorts, Nix, Scoop, winget, and Alpine Linux according to the package
      facts in this batch. That breadth is larger than the project's niche would suggest
      and reflects the appeal of a small CLI around a browser-originated encrypted
      sharing service.
  package-nerd-significance:
    - >
      For package users, ffsend is mostly interesting as a CLI wrapper around an
      otherwise web-first service model: it turns ephemeral encrypted sharing into a
      scriptable Unix-style command while preserving client-side encryption semantics.
  project-history:
    - >
      The project was created in 2018 and describes itself as a fully featured Firefox
      Send client. Its README emphasizes client-side encryption, expiring download
      limits, optional passwords, directory archiving, QR-code generation, custom Send
      hosts, and script-friendly behavior.
    - >
      The original Mozilla Firefox Send service was discontinued on September 17, 2020,
      which made ffsend more dependent on alternative or self-hosted Send-compatible
      servers. The README explicitly notes that the default Send host is provided by the
      maintainer and that the tool is not affiliated with Mozilla.
  related-projects:
    - ffsend is related to Mozilla Firefox Send and community Send-compatible server forks.
  sources:
    - https://gitlab.com/timvisee/ffsend
    - https://gitlab.com/api/v4/projects/timvisee%2Fffsend
    - https://gitlab.com/api/v4/projects/timvisee%2Fffsend/releases
    - https://support.mozilla.org/en-US/kb/what-happened-firefox-send
    - https://formulae.brew.sh/formula/ffsend
  summary:
    - >
      ffsend is a Rust command-line client for Firefox Send-compatible services. Its
      niche is simple terminal-driven upload, download, inspection, deletion, and
      history management for expiring encrypted file shares.
  timeline:
    - '2018: GitLab project created and first release series published.'
    - >
      2020: Mozilla discontinued Firefox Send, shifting practical ffsend use toward
      maintainer-run or self-hosted Send-compatible services.
  usage:
    - >
      Typical usage is `ffsend upload FILE` to produce a share URL and `ffsend download
      URL` to retrieve it. The project also documents commands for inspecting a remote
      file, changing a password, deleting a share, viewing upload history, using custom
      hosts, and controlling expiry time and download limits.
