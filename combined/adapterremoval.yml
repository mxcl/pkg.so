id: brew:adapterremoval
display-name: AdapterRemoval
homepage: https://github.com/MikkelSchubert/adapterremoval
repo: https://github.com/MikkelSchubert/adapterremoval
docs:
  - https://adapterremoval.readthedocs.io/
  - https://adapterremoval.readthedocs.io/en/latest/manpage.html
  - https://github.com/MikkelSchubert/adapterremoval#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AdapterRemoval became a common sequencing utility because adapter trimming and
      read merging are routine preprocessing steps for high-throughput sequencing FASTQ
      data. Its README notes precompiled binaries for Linux, macOS, and Windows, and the
      supplied input lists Homebrew, Debian, and Ubuntu packages.
  package-nerd-significance:
    - >
      For package maintainers, AdapterRemoval is a good example of a scientific CLI
      where reproducibility, CPU-specific acceleration, compression libraries, and
      manpage/docs installation all matter. Version 3 adds SIMD acceleration and broader
      platform packaging concerns.
  project-history:
    - >
      The README cites the original AdapterRemoval publication by Lindgreen in 2012 and
      the AdapterRemoval v2 paper by Schubert, Lindgreen, and Orlando in 2016. Version 3
      is described as a major revision of version 2 focused on simpler defaults, more
      features, and higher throughput.
    - >
      The GitHub repository was created in 2014 and now publishes the `adapterremoval3`
      command with documentation hosted on Read the Docs.
  related-projects:
    - >
      Related tools and domains include FASTQ preprocessing pipelines, adapter trimming
      utilities, Illumina sequencing workflows, SAM/BAM output handling, and QC report
      generators.
  sources:
    - https://api.github.com/repos/MikkelSchubert/adapterremoval
    - https://api.github.com/repos/MikkelSchubert/adapterremoval/releases
    - https://github.com/MikkelSchubert/adapterremoval#readme
  summary:
    - >
      AdapterRemoval is a bioinformatics command-line tool for trimming adapter
      sequences, trimming low-quality bases, merging overlapping paired-end reads,
      demultiplexing barcoded reads, and producing sequencing QC reports.
  timeline:
    - '2012: Original AdapterRemoval publication appeared in BMC Research Notes.'
    - '2014: GitHub repository `MikkelSchubert/adapterremoval` was created.'
    - >
      2016: AdapterRemoval v2 paper described rapid adapter trimming, identification,
      and read merging.
    - '2022: First AdapterRemoval v3 alpha release was published.'
    - '2026: AdapterRemoval v3.0.0 was published.'
  usage:
    - >
      Users run `adapterremoval3` with input FASTQ files and an output prefix; default
      behavior can automatically detect adapters, trim low-quality bases, filter reads,
      write compressed FASTQ, and generate HTML and JSON reports.
related-packages:
  - id: brew:fastp
    reason: >
      Choose fastp when an all-in-one short-read preprocessor with UMI handling,
      deduplication, output splitting, and extensive before/after QC is preferable to
      AdapterRemoval's sequencing-read trimming, merging, and demultiplexing workflow.
    rel: alternative
    sources:
      - https://github.com/MikkelSchubert/adapterremoval#readme
      - https://github.com/OpenGene/fastp#readme
  - id: brew:cutadapt
    reason: >
      Choose Cutadapt when error-tolerant removal of explicitly modeled adapters,
      primers, poly-A tails, or IUPAC-containing sequences is more important than
      AdapterRemoval's integrated paired-read merging and QC.
    rel: alternative
    sources:
      - https://github.com/MikkelSchubert/adapterremoval#readme
      - https://cutadapt.readthedocs.io/en/stable/
category: science
package-manager:
  brew: adapterremoval
  debian: adapterremoval
  ubuntu: adapterremoval
package-manager-url: https://formulae.brew.sh/formula/adapterremoval
license: GPL-3.0-or-later
tags:
  - adapter-trimming
  - bioinformatics
  - cli
  - fastq
  - read-merging
  - sequencing
description: Rapid adapter trimming, identification, and read merging
executables:
  - adapterremoval3
provenance:
  formula: adapterremoval
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
