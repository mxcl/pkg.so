id: brew:calabash
display-name: XML Calabash
homepage: https://xmlcalabash.com/
repo: https://github.com/ndw/xmlcalabash1
docs:
  - https://www.xmlcalabash.com/archive-1.x/docs
  - https://www.xmlcalabash.com/archive-1.x/docs/reference
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Calabash was adopted in the XML tooling community as a practical command-line
      XProc processor for chaining XSLT, validation, document loading, and other XML
      pipeline steps. Its status page linked test-suite results, reflecting the XProc
      community's emphasis on specification conformance.
    - >
      The 1.x package remained useful for systems built around XProc 1.0 after the W3C
      Recommendation, while later XML Calabash 3.x moved to the newer XProc 3.1
      ecosystem and Codeberg-hosted releases.
  package-nerd-significance:
    - >
      XML Calabash is significant because it packages an XML standards implementation as
      a Unix-style command-line tool. It is the kind of package that only a niche group
      needs, but that group needs it reproducibly in build farms, publishing pipelines,
      and long-lived XML document systems.
    - >
      Its history also marks the split between XProc 1.x compatibility tooling and newer
      XProc 3.x work, which matters when package managers choose old-but-stable
      implementations for legacy workflows.
  project-history:
    - >
      Norm Walsh published the XML Calabash status page on 24 August 2008 as an
      implementation of the then-developing W3C XProc work. The same page records the
      initial 0.9.0a release on 24 August 2008, a 0.9.0 beta release on 28 November
      2008, and a 1.0.0 stable release on 20 January 2012.
    - >
      The archived 1.x documentation says Calabash is built in Java on top of Saxon and
      implements XProc, with command-line use through `com.xmlcalabash.drivers.Main`.
      The current XML Calabash homepage has moved on to XML Calabash 3.x for XProc 3.1,
      while preserving the 1.x docs as an archive.
  related-projects:
    - >
      Related projects and standards include XProc, Saxon, XML Calabash 3.x,
      MorganaXProc, XSLT processors, and DocBook/DITA publishing pipelines. Calabash
      belongs to the broader XML command-line tooling world rather than mainstream
      application development packages.
  sources:
    - https://norman.walsh.name/2008/projects/calabash
    - https://www.xmlcalabash.com/
    - https://www.xmlcalabash.com/archive-1.x/docs/
  summary:
    - >
      XML Calabash is Norm Tovey-Walsh's Java implementation of XProc, the W3C XML
      pipeline language. The Homebrew `calabash` formula tracks the 1.x line, a
      command-line processor for running XML processing pipelines from packages,
      scripts, and Java classpaths.
  timeline:
    - '2008: Project status page and initial 0.9.0a release published on 24 August 2008.'
    - '2008: 0.9.0 beta release published on 28 November 2008.'
    - >
      2010: XProc 1.0 became a W3C Recommendation on 11 May 2010, the version the 1.x
      project targeted.
    - '2012: XML Calabash 1.0.0 stable released on 20 January 2012.'
    - '2013: XML Calabash 1.0.15 listed as available on the archived status page.'
    - >
      2020s: The main XML Calabash site focuses on 3.x, an implementation of XProc 3.1,
      while archiving the 1.x pages.
  usage:
    - >
      Users run Calabash by placing `calabash.jar` and dependencies on the Java
      classpath and invoking `java com.xmlcalabash.drivers.Main` with pipeline options
      and an `.xpl` file. Version 0.9.18 added support for constructing simple linear
      pipelines directly on the command line with repeated step options.
    - >
      The tool is mostly a batch-processing component for XML-heavy build, publishing,
      documentation, and data-conversion workflows rather than a general interactive
      CLI.
related-packages:
  - id: brew:saxon
    reason: >
      Use Saxon alongside XML Calabash because Calabash is built on Saxon and delegates
      XSLT, XPath, XQuery, and some validation-related processing to it.
    rel: adjacent_workflow
    sources:
      - https://www.xmlcalabash.com/archive-1.x/docs/
      - https://github.com/Saxonica/Saxon-HE#readme
category: developer-tools
package-manager:
