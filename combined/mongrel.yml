history:
  adoption-history:
    - >
      VisorCraft positions Mongrel as a cross-platform commercial application for
      developers, database and SQL analysts, system administrators, SREs, and platform
      teams who otherwise use separate database, terminal, file-transfer, container,
      cluster, and API tools.
    - >
      The application is distributed for macOS, Windows, and Linux with a trial and
      commercial licensing. Its broad engine and protocol coverage targets mixed-stack
      operational environments rather than a single database community.
  package-nerd-significance:
    - >
      Mongrel packages an unusually wide operations surface into one desktop
      application: more than 30 database engines, remote terminals, file transfer,
      Docker and Podman, Kubernetes, an API client, optional AI, and MCP tooling.
    - >
      Its use of OS keychains, credential-stripped exports, Git-backed connection
      synchronization, and explicit production-write safeguards is relevant to engineers
      managing repeatable but security-sensitive workstation setups.
  project-history:
    - >
      Mongrel is a commercial database systems workbench developed by VisorCraft. The
      official product describes a Tauri desktop application with a Rust backend that
      connects to existing databases and infrastructure rather than provisioning them.
    - >
      The product grew around cross-tool debugging: a user can move from database
      queries to API requests, remote shells, transferred files, containers, and
      Kubernetes resources without leaving the same workspace.
  related-projects:
    - VisorCraft also maintains MongrelDB, which is one of the databases supported by Mongrel.
    - >
      Mongrel overlaps with dedicated database clients, terminal and file-transfer
      applications, container dashboards, Kubernetes tools, and API clients while
      combining those roles in one workbench.
  sources:
    - 'Official installation guide: https://www.visorcraft.com/installation-guide'
    - 'Official product homepage: https://www.visorcraft.com/'
    - 'Official workbench overview: https://www.visorcraft.com/workbench'
  summary:
    - >
      Mongrel is VisorCraft's cross-platform database and systems workbench, combining
      database clients with terminals, file transfer, container and Kubernetes
      operations, API testing, and optional AI tooling.
  timeline:
    - >
      2026: VisorCraft's official materials describe Mongrel as a commercial
      cross-platform workbench supporting more than 30 database engines and associated
      operations tools.
  usage:
    - >
      Users create connection profiles for databases, remote hosts, storage services,
      containers, clusters, and APIs, then move between querying, inspecting,
      transferring, debugging, and administrative workflows in one application.
    - >
      Passwords, API keys, and other secret values are stored through the operating
      system keychain. Connection synchronization and exported profiles omit
      credentials, while optional production safeguards can gate high-impact writes.
