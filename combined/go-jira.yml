id: brew:go-jira
display-name: go-jira
homepage: https://github.com/go-jira/jira
repo: https://github.com/go-jira/jira
docs:
  - https://github.com/go-jira/jira#readme
config-file-location:
  unix:
    - ~/.jira.d/config.yml
    - .jira.d/config.yml
    - .jira.d/<command>.yml
    - ~/.jira.d/templates/
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool became part of package-manager workflows through Homebrew and other
      package sets named go-jira. Its use case overlaps with teams that keep
      development, review, and triage work in terminals and want Jira issue queries to
      follow the local project directory.
  package-nerd-significance:
    - >
      For package users, go-jira is a classic example of a networked SaaS CLI whose
      value comes from predictable config-file placement, shell completion, and
      scriptable output rather than from a desktop integration.
  project-history:
    - >
      The public repository was created in 2015 under the go-jira organization. Its
      README describes an early focus on a small Jira CLI and later documents features
      such as hierarchical .jira.d configuration, executable dynamic configuration,
      shell completion, custom commands, and authentication changes required by
      Atlassian API and GDPR-era username behavior.
  related-projects:
    - >
      Atlassian Jira provides the service API that go-jira automates. The kingpin Go CLI
      library is referenced by the project for shell completion behavior.
  sources:
    - https://api.github.com/repos/go-jira/jira
    - https://formulae.brew.sh/formula/go-jira
    - https://github.com/go-jira/jira
    - https://github.com/go-jira/jira/releases
  summary:
    - >
      go-jira is a Go command-line client for Atlassian Jira, aimed at users who want
      issue-tracking operations from a shell rather than a browser.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2020: v1.0.x release series published on GitHub.'
    - '2020: README documentation reflected Atlassian API authentication and username changes.'
  usage:
    - >
      Practitioners configure an endpoint in ~/.jira.d/config.yml, authenticate with
      jira login, and then list, create, edit, or query issues. The configuration
      hierarchy lets a repository-local .jira.d directory set a project, templates, or
      custom shell-backed commands so common issue queries can be reused by a team.
related-packages:
  - id: brew:jira-cli
    reason: >
      Choose jira-cli for a more interactive, feature-rich terminal interface with
      boards, sprints, and guided navigation; choose go-jira for its hierarchical
      `.jira.d` configuration, templates, and shell-defined custom commands.
    rel: alternative
    sources:
      - https://github.com/go-jira/jira
      - https://github.com/ankitpokhrel/jira-cli
category: productivity
package-manager:
  brew: go-jira
  nix: go-jira
  scoop: main/jira
package-manager-url: https://formulae.brew.sh/formula/go-jira
license: Apache-2.0
tags:
  - atlassian
  - cli
  - go
  - issue-tracking
  - jira
  - project-management
description: Simple jira command-line client in Go
executables:
  - jira
provenance:
  formula: go-jira
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
