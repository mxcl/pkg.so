id: brew:hawkeye
display-name: HawkEye
homepage: https://github.com/korandoru/hawkeye
repo: https://github.com/korandoru/hawkeye
docs:
  - https://github.com/korandoru/hawkeye#readme
config-file-location:
  unix: ./licenserc.toml
  windows: .\licenserc.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents several distribution paths: a GitHub Action, a Docker image,
      Cargo installation, Arch Linux packaging, and prebuilt release installers.
      Homebrew, Nix, and pacman packaging in the input facts show adoption by
      Unix-oriented package ecosystems beyond the upstream release channel.
  package-nerd-significance:
    - >
      HawkEye matters to package-maintenance workflows because license headers are a
      common release-review nuisance: too small to deserve a bespoke framework, but
      common enough to fail CI and release audits. A single static-feeling CLI with
      GitHub Action support is the useful boring shape for that job.
  project-history:
    - >
      The public GitHub repository was created in January 2023 under the korandoru
      organization. The README describes the project as a simple license header checker
      and formatter, with a project-level licenserc.toml configuration file and commands
      for check, format, and remove workflows.
    - >
      The project presents itself less as a general license scanner and more as a
      formatter for copyright/license header policy. Its native-image and
      prebuilt-binary distribution options fit teams that want fast CI checks without
      provisioning a full language toolchain.
  related-projects:
    - >
      Related tools include license scanners and formatters used in CI, but HawkEye's
      closest practical peers are repository policy tools that enforce source-header
      conventions rather than dependency-license inventories.
  sources:
    - https://api.github.com/repos/korandoru/hawkeye
    - https://github.com/korandoru/hawkeye
    - https://raw.githubusercontent.com/korandoru/hawkeye/main/README.md
  summary:
    - >
      HawkEye is a Rust command-line tool and GitHub Action for checking, formatting,
      and removing license headers in source trees. Its package history is centered on
      supply-chain hygiene: it packages a repetitive repository-maintenance task as a
      local CLI, container image, prebuilt binary, Cargo install, and CI action.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2023: README-documented licenserc.toml workflow uses 2023 as the example inception year.'
    - >
      2020s: Distribution expands across Cargo, prebuilt binaries, Docker, GitHub
      Actions, and downstream package managers.
  usage:
    - >
      Typical use is to add a licenserc.toml file at a repository root, run hawkeye
      check in CI, and use hawkeye format when files need an automatic header fix. The
      same executable can also remove headers, which makes it useful for migrations
      between license-header policies.
related-packages:
  - id: brew:license-eye
    reason: >
      Choose SkyWalking Eyes when the same header-checking workflow must also resolve
      and enforce dependency licenses.
    rel: alternative
    sources:
      - https://github.com/korandoru/hawkeye#readme
      - https://github.com/apache/skywalking-eyes#readme
  - id: brew:addlicense
    reason: >
      Choose addlicense for a narrower add-or-check workflow with an officially
      documented pre-commit hook.
    rel: alternative
    sources:
      - https://github.com/korandoru/hawkeye#readme
      - https://github.com/google/addlicense#readme
      - https://github.com/google/addlicense#running-with-pre-commit
category: developer-tools
package-manager:
  brew: hawkeye
  nix: hawkeye
  pacman: hawkeye
package-manager-url: https://formulae.brew.sh/formula/hawkeye
license: Apache-2.0
tags:
  - cli
  - code-formatting
  - license-checking
  - license-headers
  - native-image
description: Simple license header checker and formatter, in multiple distribution forms
executables:
  - hawkeye
provenance:
  formula: hawkeye
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
