id: brew:daemonlogger
display-name: Daemonlogger
homepage: https://sourceforge.net/projects/daemonlogger/
repo: https://github.com/Cisco-Talos/Daemonlogger
docs:
  - https://sourceforge.net/projects/daemonlogger
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Daemonlogger's adoption has been strongest in packet-capture and
      security-operations environments where pcap output, BPF filters, daemon mode, and
      ring-buffer behavior are enough. Its official README still points users to the
      daemonlogger-users mailing list, reflecting an older SourceForge-era open-source
      support pattern.
  package-nerd-significance:
    - >
      Daemonlogger matters to package nerds because it is a narrow, old-school Unix
      networking utility: one executable, libpcap/libdnet dependencies, pcap files as
      the interchange format, and behavior that fits service managers and shell scripts.
  project-history:
    - >
      The official README credits Martin Roesch as author and records Sourcefire
      copyright from 2006-2013, followed by Cisco copyright from 2013-2021. The current
      official GitHub repository describes itself as the official repository and was
      created under Cisco-Talos in 2015, after Cisco's Sourcefire acquisition era had
      folded the tool into Cisco's security tooling orbit.
  related-projects:
    - >
      Daemonlogger sits near tcpdump, Snort, libpcap, and libdnet in the Unix
      packet-capture ecosystem.
  sources:
    - https://github.com/Cisco-Talos/Daemonlogger
    - https://api.github.com/repos/Cisco-Talos/Daemonlogger
    - https://raw.githubusercontent.com/Cisco-Talos/Daemonlogger/master/README
  summary:
    - >
      Daemonlogger is a small libpcap-based packet logging and soft-tap daemon. Its
      package-manager appeal is straightforward: it gives Unix users a dedicated
      command-line tool for capturing packets to rolling pcap files or forwarding
      captured traffic out another interface without adopting a larger IDS stack.
  timeline:
    - '2006: Sourcefire copyright period for Daemonlogger begins.'
    - '2013: Cisco copyright period begins.'
    - '2015: Official Cisco-Talos GitHub repository is created.'
    - '2021: README lists version 1.2.1 and Cisco copyright through 2021.'
  usage:
    - >
      Users run daemonlogger with switches for interface selection, daemonization, BPF
      filter files, packet-count limits, output paths, ring-buffer pruning, rollover
      size or time, and soft-tap output. The README explicitly frames its BPF filter
      syntax as familiar to tcpdump or Snort users.
related-packages:
  - id: brew:tcpdump
    reason: >
      Use tcpdump to interactively inspect or later read the pcap traffic captured by
      DaemonLogger; both tools use BPF capture expressions, while DaemonLogger
      specializes in unattended rotating logs and soft-tap forwarding.
    rel: adjacent_workflow
    sources:
      - https://github.com/Cisco-Talos/Daemonlogger#readme
      - https://www.tcpdump.org/manpages/tcpdump.1.html
category: networking
package-manager:
  brew: daemonlogger
  debian: daemonlogger
  macports: daemonlogger
  ubuntu: daemonlogger
package-manager-url: https://formulae.brew.sh/formula/daemonlogger
license: GPL-2.0-only
tags:
  - cli
  - network-monitoring
  - packet-capture
  - packet-logging
  - pcap
description: Network packet logger and soft tap daemon
executables:
  - daemonlogger
provenance:
  formula: daemonlogger
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
