id: brew:jflex
display-name: JFlex
homepage: https://jflex.de/
repo: https://github.com/jflex-de/jflex
docs:
  - https://jflex.de/manual.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      JFlex's adoption comes from the durable place of lex-style scanner generators in
      compiler courses, programming language tools, and Java build systems. The manual
      includes sections for porting from JLex and lex/flex and for working with CUP,
      CUP2, BYacc/J, and Jay, which documents its role in the Java parser-generator
      ecosystem.
    - >
      Package metadata in the input shows JFlex packaged by Homebrew, Debian, Fedora,
      MacPorts, Nix, Ubuntu, and related distributions. That breadth reflects a tool old
      enough to be infrastructure: users may encounter it as a command-line utility, a
      Maven plugin, or a build dependency hidden inside language tooling.
  package-nerd-significance:
    - >
      JFlex is package-nerd significant because it preserves a classic Unix
      compiler-tool idea in the Java ecosystem. It is simultaneously a small CLI, a
      Maven-era build component, and a compatibility bridge for JLex and lex/flex users
      who need generated Java scanners with Unicode and deterministic-automata
      performance.
  project-history:
    - >
      JFlex 1.0 was publicly released in May 1998. The project history says it was built
      with Sun's JDK 1.1, JFlex itself through bootstrapping, and the CUP parser
      generator.
    - >
      The project accumulated the usual compiler-tooling milestones over time:
      SourceForge-era releases, Ant integration, CUP and BYacc/J interoperability,
      Unicode work, Maven build changes, and a license change from GPL to BSD in the
      1.5.0 release. JFlex 1.6.1 moved development, wiki, and issue tracking to GitHub
      in 2015.
    - >
      The 1.9.x line continued the post-GitHub release history, with the manual
      identifying version 1.9.1 as a 2023 manual and release pages tying JFlex and the
      JFlex Maven plugin to Maven Central-oriented workflows.
  related-projects:
    - >
      JFlex is directly related to JLex, lex, flex, CUP, CUP2, BYacc/J, Jay, Maven, Ant,
      and Bazel. Its repository also includes JFlex Maven plugin and Unicode plugin
      components.
  sources:
    - https://api.github.com/repos/jflex-de/jflex
    - https://formulae.brew.sh/formula/jflex
    - https://github.com/jflex-de/jflex
    - https://github.com/jflex-de/jflex/releases
    - https://jflex.de/history.html
    - https://jflex.de/manual.html
    - https://www.jflex.de/changelog.html
  summary:
    - >
      JFlex is a lexical analyzer generator for Java, written in Java. The official
      manual describes it as a rewrite of JLex, with no shared code with Vern Paxson's
      C/C++ flex, and the README describes generated lexers as deterministic finite
      automata that form the first front-end step in many compilers.
  timeline:
    - '1998: JFlex 1.0 public release.'
    - '2000: JFlex 1.3 release moved part of the project to SourceForge.'
    - >
      2014: JFlex 1.5.0 changed license from GPL to BSD and changed the build from Ant
      to Maven.
    - '2014: JFlex 1.6.0 added Unicode 7.0 support.'
    - '2015: JFlex 1.6.1 moved development, wiki, and issue tracking to GitHub.'
    - '2023: JFlex 1.9.1 released.'
  usage:
    - >
      A JFlex user writes a `.flex` lexical specification containing regular expressions
      and actions. JFlex generates Java source for a scanner that reads input, matches
      the regular expressions, and emits actions or tokens; projects commonly wire the
      generated scanner into CUP-family parsers or build tools such as Maven, Ant, and
      Bazel.
related-packages:
  - id: brew:flex
    reason: >
      Choose flex when the generated scanner should be C or C++; choose JFlex when it
      should be Java and integrate with Java parser and build tooling.
    rel: alternative
    sources:
      - https://jflex.de/manual.html
      - https://westes.github.io/flex/manual/Introduction.html
  - id: brew:maven
    reason: >
      Maven can run JFlex's official plugin during the build to generate Java scanner
      sources from grammar files automatically.
    rel: adjacent_workflow
    sources:
      - https://jflex.de/manual.html
      - https://maven.apache.org/guides/introduction/introduction-to-plugins.html
category: developer-tools
