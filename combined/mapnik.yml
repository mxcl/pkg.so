id: brew:mapnik
display-name: Mapnik
homepage: https://mapnik.org/
repo: https://github.com/mapnik/mapnik
docs:
  - https://mapnik.org/docs
  - https://github.com/mapnik/mapnik/wiki
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Mapnik became a common dependency in geospatial packaging because it is a library
      and toolkit rather than a single end-user app. The input package metadata lists
      packages in Homebrew, Debian, Ubuntu, Fedora, Arch, MacPorts, Nix, and Alpine,
      reflecting broad distribution across Unix-like systems.
    - >
      Its official homepage advertises direct code examples in Python, Node.js, and C++,
      which explains why package managers often split Mapnik into libraries, development
      headers, data plugins, and CLI utilities. The same native renderer can be embedded
      in applications or invoked through tools like mapnik-render and shapeindex.
  package-nerd-significance:
    - >
      Mapnik is significant because it sits at the uncomfortable but important
      intersection of C++ ABI compatibility, geospatial native dependencies,
      scripting-language bindings, and cartographic output quality. It is the sort of
      package that stresses formula maintenance more than its simple description
      suggests.
    - >
      For package historians, Mapnik also marks the era when open-source web cartography
      moved from server-generated raster maps toward programmable rendering engines
      backed by reusable geospatial libraries.
  project-history:
    - >
      The Mapnik documentation history says Artem Pavlenko started the project in 2005.
      Early project news records show public activity and releases in 2005, including a
      BerliOS development move, early release notes, and continued 0.x releases through
      2006 and 2007.
    - >
      Mapnik grew around the idea that cartographic rendering should be programmable and
      high quality. The official docs emphasize use of established libraries such as
      Boost rather than reinventing common C++ infrastructure, while the homepage
      presents Mapnik as a core geospatial visualization and processing project.
    - >
      By the 4.x era, Mapnik had a long-running release stream: the official site listed
      4.2.0 in December 2025, 4.2.1 in January 2026, and 4.2.2 in March 2026. That
      longevity matters because many renderer packages disappear once their bindings or
      compiler stack age; Mapnik kept moving across several generations of C++, Python,
      and Node packaging.
  related-projects:
    - Boost is cited by Mapnik documentation as an important supporting C++ library.
    - Python and Node.js bindings are first-class user surfaces on the official homepage.
    - >
      Mapnik commonly appears near GDAL, PROJ, PostGIS, and other geospatial packages in
      distribution dependency graphs.
  sources:
    - https://api.github.com/repos/mapnik/mapnik
    - https://api.github.com/repos/mapnik/mapnik/releases?per_page=5
    - https://github.com/mapnik/sphinx-docs/blob/master/about_mapnik.rst
    - https://mapnik.org/
    - https://mapnik.org/news/archive.html
    - source_facts.package-manager
  summary:
    - >
      Mapnik is an open-source C++ toolkit for high-quality map rendering, exposed to
      package users through command-line tools and language bindings for Python,
      Node.js, and C++.
  timeline:
    - >
      2005: Project started by Artem Pavlenko, with early public releases recorded in
      the news archive.
    - '2007: Official news archive includes Debian packages and community/event activity.'
    - '2011: Current GitHub repository created.'
    - '2025: Mapnik 4.2.0 released.'
    - '2026: Mapnik 4.2.2 released.'
  usage:
    - >
      A typical Mapnik workflow defines map styling and data sources, loads a stylesheet
      or constructs the map programmatically, and renders image output. The homepage
      examples show creating a map, loading a style file, zooming to data, and rendering
      to PNG from Python and Node.js.
    - >
      Homebrew exposes practical command-line utilities such as mapnik-render,
      mapnik-index, shapeindex, svg2png, pgsql2sqlite, and geometry_to_wkb. For package
      users, that makes Mapnik useful both as a dependency for larger map stacks and as
      a toolbox for testing styles and geospatial assets.
related-packages:
  - id: brew:mapproxy
    reason: >
      MapProxy can call Mapnik directly from a Mapnik XML mapfile, then cache and
      publish the rendered output through web mapping services.
    rel: adjacent_workflow
    sources:
      - https://mapproxy.github.io/mapproxy/latest/sources.html
      - https://mapnik.org/
  - id: brew:imposm3
    reason: >
      Imposm3 prepares OpenStreetMap data in PostgreSQL/PostGIS databases optimized for
      rendering, which Mapnik can read through its PostGIS input plugin.
    rel: adjacent_workflow
    sources:
      - https://imposm.org/docs/imposm3/latest/
      - https://github.com/mapnik/mapnik/wiki/PostGIS
  - id: brew:postgis
    reason: >
      PostGIS provides the spatial PostgreSQL data source consumed by Mapnik's stable
      PostGIS input plugin.
    rel: adjacent_workflow
    sources:
      - https://github.com/mapnik/mapnik/wiki/PostGIS
      - https://postgis.net/docs/
  - id: brew:mapserver
    reason: >
      Choose MapServer when the primary requirement is a complete web mapping and OGC
      service engine; choose Mapnik when an embeddable cartographic rendering toolkit
      and language APIs are the better fit.
    rel: alternative
    sources:
      - https://mapnik.org/
      - https://mapserver.org/
category: data
