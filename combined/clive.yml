id: brew:clive
display-name: cLive
homepage: https://github.com/koki-develop/clive
repo: https://github.com/koki-develop/clive
docs:
  - https://github.com/koki-develop/clive#readme
config-file-location:
  unix: ./clive.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is young and niche, but it has enough official distribution signals to
      be source-backed: the README documents install paths through the author's Homebrew
      tap, Homebrew core, `go install`, and GitHub releases. The batch input also
      records Homebrew, MacPorts, and Nix package entries.
  package-nerd-significance:
    - >
      cLive is package-nerd interesting as a packaged wrapper around terminal demos and
      reproducible command sequences. Its packaging has to account for Go binaries plus
      the external `ttyd` prerequisite, which is a classic CLI formula dependency
      concern.
  project-history:
    - >
      cLive was created by koki-develop in late 2022. The upstream README presents it as
      a tool for automating terminal operations, with `clive init` generating
      `./clive.yml` and `clive start` launching the browser-driven run.
  related-projects:
    - >
      Related projects include ttyd, terminal recording/demo tools, shell automation
      scripts, and Go CLI distribution workflows.
  sources:
    - https://github.com/koki-develop/clive#readme
    - https://github.com/koki-develop/clive/releases
  summary:
    - >
      cLive is a Go-based CLI that automates terminal operations through a YAML action
      file and a browser-backed terminal session.
  timeline:
    - '2022: GitHub repository created.'
    - '2022: First public release v0.1.0 published.'
    - >
      2022: README documents Homebrew tap, Homebrew, `go install`, and binary release
      installation.
    - >
      2026: v0.12.17 published as the latest observed upstream release during this batch
      research.
  usage:
    - >
      Users install `ttyd`, initialize a `clive.yml` file, define `settings` and
      `actions`, validate the file, and run `clive start`. The action model supports
      typing, key presses, pauses, screenshots, and browser/terminal display settings.
related-packages:
  - id: brew:ttyd
    reason: >
      Install ttyd with cLive because upstream identifies it as the required
      web-terminal component that cLive uses for its automated browser terminal
      sessions.
    rel: adjacent_workflow
    sources:
      - https://github.com/koki-develop/clive#readme
      - https://github.com/tsl0922/ttyd#readme
category: developer-tools
package-manager:
  brew: clive
  macports: clive
  nix: clive
package-manager-url: https://formulae.brew.sh/formula/clive
license: MIT
tags:
  - automation
  - cli
  - terminal
  - ttyd
description: Automates terminal operations
executables:
  - clive
provenance:
  formula: clive
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
