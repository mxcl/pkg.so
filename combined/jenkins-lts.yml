id: brew:jenkins-lts
display-name: Jenkins LTS
homepage: https://www.jenkins.io/
repo: https://github.com/jenkinsci/jenkins
docs:
  - https://www.jenkins.io/doc
  - https://www.jenkins.io/download/lts
config-file-location:
  unix:
    - $JENKINS_HOME/config.xml
    - $JENKINS_HOME/*.xml
    - $JENKINS_HOME/jobs/[JOBNAME]/config.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      The LTS line addresses conservative production users and companies that stabilize
      Jenkins internally. The Jenkins LTS documentation describes a 12-week baseline
      selection cycle, backported bug and security fixes, and three minor releases per
      baseline on four-week cycles.
  package-nerd-significance:
    - >
      The LTS formula is significant because it encodes a release-policy choice in the
      package name. Package managers often expose both fast and conservative upstream
      streams, and Jenkins is a clear example where the same upstream repo yields
      separate installable formulas for different operational risk profiles.
  project-history:
    - >
      Jenkins traces its project lineage to Hudson, started in 2004 by Kohsuke Kawaguchi
      at Sun Microsystems. In January 2011, the Hudson community proposed renaming the
      project to Jenkins after unresolved trademark and governance concerns with Oracle,
      and a community vote approved the rename.
    - >
      The Jenkins project then moved infrastructure and identity to the Jenkins name
      while continuing the automation-server codebase and community. The LTS line was
      established for users who prefer a slower-moving release stream with selected
      backports instead of the faster weekly line.
  related-projects:
    - brew:jenkins packages the same upstream automation server on the regular release line.
    - >
      Jenkins plugins, Pipeline, Remoting, and Configuration as Code are central parts
      of the ecosystem that make the server extensible.
    - Hudson is the predecessor name and historical fork context for Jenkins.
  sources:
    - https://community.jenkins.io/t/lets-thank-kohsuke-the-creator-of-jenkins/168
    - https://github.com/jenkinsci/jenkins
    - https://www.jenkins.io/blog/2011/01/11/hudsons-future/
    - https://www.jenkins.io/blog/2011/01/29/jenkins/
    - https://www.jenkins.io/download/lts/
  summary:
    - >
      Jenkins LTS is the long-term-support packaging track for the Jenkins automation
      server. It packages the same upstream Jenkins project as the regular Jenkins
      formula but follows the project's conservative release-line model.
  timeline:
    - >
      2004: Hudson, the project that became Jenkins, was started by Kohsuke Kawaguchi at
      Sun Microsystems.
    - '2011: the community proposed the Jenkins rename in January.'
    - '2011: the rename vote concluded with Jenkins as the community project name.'
    - >
      2011: Jenkins infrastructure such as domains, groups, and GitHub organization
      names moved toward Jenkins branding.
    - >
      LTS cycle: baselines are selected every 12 weeks and receive three minor releases
      on four-week cycles.
  usage:
    - >
      Homebrew's jenkins-lts formula is for users who want the automation server and CLI
      wrappers tied to the stable line rather than the weekly line. Administrators still
      manage Jenkins through JENKINS_HOME XML configuration, plugins, Pipeline jobs, the
      web UI, and CLI/API tooling.
related-packages:
  - id: brew:jenkins
    reason: >
      Choose the regular Jenkins formula when rapid access to weekly features and fixes
      matters more than the LTS line's slower, backport-focused cadence.
    rel: alternative
    sources:
      - https://www.jenkins.io/download/lts/
      - https://www.jenkins.io/download/weekly/
category: developer-tools
package-manager:
  brew: jenkins-lts
  scoop: main/jenkins-lts
package-manager-url: https://formulae.brew.sh/formula/jenkins-lts
license: MIT
tags:
  - automation-server
  - ci-cd
  - cli
  - devops
  - java
  - jenkins
description: Extendable open source continuous integration server
executables:
  - jenkins-lts
  - jenkins-lts-cli
provenance:
  formula: jenkins-lts
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
