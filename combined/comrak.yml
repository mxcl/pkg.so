id: brew:comrak
display-name: Comrak
homepage: https://comrak.ee
repo: https://github.com/kivikakk/comrak
docs:
  - https://comrak.ee/
  - https://github.com/kivikakk/comrak#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/comrak/config
    - ~/.config/comrak/config
credentials-file-location: null
history:
  adoption-history:
    - >
      crates.io records public Comrak releases starting in 2017. Official installation
      notes cover Cargo, cargo-binstall, several Unix distributions, Homebrew, Nix, and
      Scoop, showing adoption as both a Rust library dependency and a standalone
      formatter/converter CLI.
  package-nerd-significance:
    - >
      Comrak matters to package maintainers because Markdown rendering is part of
      package metadata, README display, docs generation, and changelog tooling. A
      CommonMark/GFM-compatible Rust implementation gives both Rust programs and shell
      workflows a reusable renderer.
  project-history:
    - >
      The project publishes a Rust crate and CLI around standards-oriented Markdown
      parsing. Its README emphasizes compatibility with CommonMark and GitHub Flavored
      Markdown and shows conformance badge counts for both test suites.
  related-projects:
    - >
      Comrak is related to CommonMark, GitHub Flavored Markdown, cmark-gfm, docs.rs,
      crates.io, and Markdown-oriented documentation pipelines.
  sources:
    - https://comrak.ee/
    - https://github.com/kivikakk/comrak
    - https://raw.githubusercontent.com/kivikakk/comrak/main/README.md
    - https://crates.io/api/v1/crates/comrak
    - https://github.com/kivikakk/comrak/releases/tag/0.1.8
  summary:
    - >
      Comrak is a Rust CommonMark and GitHub Flavored Markdown parser and renderer with
      both library and CLI use cases.
  timeline:
    - '2017: crates.io records the first public Comrak release.'
    - '2018: GitHub releases include early 0.1.x builds.'
    - '2026: crates.io records continuing 0.52.x releases.'
  usage:
    - >
      Comrak can parse files or standard input and render HTML, XML, or CommonMark. Its
      CLI supports a config file and options for GFM extensions, HTML safety behavior,
      syntax highlighting, source positions, and in-place formatting.
related-packages:
  - id: brew:cmark-gfm
    reason: >
      cmark-gfm is the closest alternative when a C library or GitHub's own CommonMark
      fork is required; Comrak began by modeling it but now deliberately carries
      independent fixes and extensions in Rust.
    rel: alternative
    sources:
      - https://github.com/github/cmark-gfm
      - https://github.com/kivikakk/comrak#related-projects
category: developer-tools
package-manager:
  apk: comrak
  brew: comrak
  nix: comrak
  scoop: main/comrak
package-manager-url: https://formulae.brew.sh/formula/comrak
license: BSD-2-Clause
tags:
  - cli
  - commonmark
  - github-flavored-markdown
  - markdown
  - parser
  - renderer
  - rust
description: CommonMark + GFM compatible Markdown parser and renderer
executables:
  - comrak
provenance:
  formula: comrak
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
