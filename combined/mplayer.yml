id: brew:mplayer
display-name: MPlayer
homepage: https://mplayerhq.hu/
repo: https://git.mplayerhq.hu/mplayer.git
docs:
  - https://www.mplayerhq.hu/DOCS/HTML/en/MPlayer.html
  - https://www.mplayerhq.hu/DOCS/man/en/mplayer.1.html
config-file-location:
  unix:
    - ~/.mplayer/config
    - ~/.mplayer/input.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      MPlayer's ecosystem role was partly technical and partly cultural. It was a
      keyboard-driven player that could be controlled from scripts, launched by front
      ends, embedded in workflows, or used directly by users who preferred shell control
      over a full media-library application. Its code and workflows also fed later
      projects and wrappers, including mplayer2, mpv, graphical front ends, and
      macOS-specific shells.
  project-history:
    - >
      The project became known for breadth: its manual describes playback of many
      container and codec families, with support for DVDs, VCDs, network streams,
      subtitles, and numerous output drivers. MEncoder, shipped alongside MPlayer,
      reused the same decoding base to encode or transcode MPlayer-readable input into
      other formats, making the package both a playback tool and a scriptable conversion
      tool.
  sources:
    - https://formulae.brew.sh/formula/mplayer
    - https://mplayerhq.hu/MPlayer/DOCS/HTML/en/MPlayer.html
    - https://mplayerhq.hu/design6/interview-arpi.html
    - https://mplayerhq.hu/design6/news.html
    - https://www.mplayerhq.hu/DOCS/man/en/mplayer.1.html
  summary:
    - >
      MPlayer is a Unix-oriented command-line movie player that grew out of the Linux
      media-player scene around 2000. MPlayer project pages credit Arpad Gereoffy, known
      as A'rpi, as the creator; a project news post marking the tenth anniversary says
      the first MPlayer v0.01 release was on November 11, 2000, while an interview with
      A'rpi explains that the project came from frustration with available video players
      and MPEG/VCD playback.
  usage:
    - >
      In package managers, MPlayer remains the classic low-level media player package:
      install it for the mplayer binary, install related builds for mencoder, and use
      configuration files such as ~/.mplayer/config and ~/.mplayer/input.conf for local
      playback behavior. Users choosing it over mpv or VLC usually want legacy
      compatibility, MEncoder, old front-end support, or exact MPlayer command-line
      behavior.
related-packages:
  - id: brew:mpv
    reason: >
      Choose mpv for a modernized MPlayer-descended player with GPU rendering,
      scripting, IPC, and libmpv; choose MPlayer for legacy command behavior, MEncoder,
      or compatibility with older front ends.
    rel: alternative
    sources:
      - https://github.com/mpv-player/mpv/wiki/FAQ
      - https://mpv.io/manual/stable/
      - https://www.mplayerhq.hu/DOCS/HTML/en/MPlayer.html
  - id: cask:vlc
    reason: >
      Choose VLC when you want a cross-platform desktop interface and integrated
      playback, conversion, capture, and streaming; choose MPlayer for a terminal-first
      Unix workflow and MEncoder compatibility.
    rel: alternative
    sources:
      - https://docs.videolan.me/vlc-user/en/lore/vlc/about.html
      - https://docs.videolan.me/vlc-user/en/index.html
      - https://www.mplayerhq.hu/DOCS/HTML/en/MPlayer.html
  - id: brew:mplayershell
    reason: >
      MPlayerShell launches MPlayer as its background playback engine and adds a
      macOS-native window and menu experience while retaining an essentially
      MPlayer-compatible command line.
    rel: adjacent_workflow
    sources:
      - https://github.com/lisamelton/MPlayerShell
      - https://www.mplayerhq.hu/DOCS/HTML/en/MPlayer.html
category: media
package-manager:
  apk: mplayer
  brew: mplayer
  debian: mencoder
  macports: MPlayer
  nix: mplayer
  pacman: mplayer
  scoop: extras/mplayer
  ubuntu: mencoder
