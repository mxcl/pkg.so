history:
  adoption-history:
    - >
      The official download page distributes macOS builds optimized separately for Intel
      and Apple silicon. The supplied package record shows that the macOS application is
      also installed through Homebrew Cask.
  package-nerd-significance:
    - >
      115 Browser is notable as a vendor-integrated Chromium client rather than a
      general-purpose open-source Chromium distribution. Its package combines ordinary
      web browsing with first-party access to 115 storage, transfer, and file-management
      services.
  project-history:
    - >
      115 Technology positions 115 Browser as a Chromium-based desktop client closely
      integrated with its 115 digital-life and cloud-storage services. Official support
      material describes it as combining 115, 115 Management, and browser functions in
      one client.
  related-projects:
    - >
      Related first-party products include 115, 115 Management, the 115 mobile client,
      and 115's cloud-storage and file-management services.
  sources:
    - https://115.com/115115/T496302.html
    - https://115.com/115115/c-1607411270--0-1-0.html
    - https://pc.115.com/
  summary:
    - >
      115 Browser is 115 Technology's Chromium-based desktop web browser and client for
      the company's storage, file-management, and communication services.
  timeline:
    - >
      2021: Official support documentation described the integrated browser and its
      settings workflow.
    - '2024: The official settings and troubleshooting articles received subsequent updates.'
    - >
      Current: The official download page offers distinct macOS builds for Intel and
      Apple silicon.
  usage:
    - >
      Users can browse the web, sign in to a 115 account, manage cloud files, and
      perform batch uploads and downloads. Official settings cover the default browser,
      startup behavior, search engine, shortcuts, transfer destination, speed limits,
      concurrent tasks, language, accessibility, and system options.
