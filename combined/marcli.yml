id: brew:marcli
display-name: marcli
homepage: https://github.com/hectorcorrea/marcli
repo: https://github.com/hectorcorrea/marcli
docs:
  - https://github.com/hectorcorrea/marcli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      marcli's adoption is strongest in the library-technology niche where MARC files
      remain common exchange artifacts. The official README specifically recommends
      Homebrew as the easiest Mac or Linux installation path, and the Homebrew formula
      packages the Go-built cmd/marcli executable.
    - >
      The repository topics and README connect it to code4lib and MARC21-style
      workflows, making it a practical package for cataloging-data automation rather
      than a general data-conversion suite.
  package-nerd-significance:
    - >
      marcli is package-index significant because it packages a niche professional data
      format into a simple CLI. That is exactly the kind of tool Homebrew users reach
      for when a one-off shell pipeline meets an old institutional file format.
  project-history:
    - >
      The marcli GitHub repository was created in July 2017. Its README defines the goal
      narrowly: parse large MARC files in either MARC binary or MARC XML form and
      provide basic functionality to find specific records within a file.
    - >
      The project is intentionally modest, but it continued to receive releases over
      time: GitHub release metadata shows 1.0.1 in 2020, 1.1.0 in 2022, 1.2.0 in May
      2025, and 1.3.x releases in August 2025.
  related-projects:
    - The README links MARC background to the Library of Congress.
    - >
      Other MARC tooling includes library-specific parsers and converters, but marcli's
      official scope is command-line parsing and filtering.
  sources:
    - https://api.github.com/repos/hectorcorrea/marcli
    - https://api.github.com/repos/hectorcorrea/marcli/releases?per_page=5
    - https://formulae.brew.sh/formula/marcli
    - https://github.com/hectorcorrea/marcli
    - source_facts.package-manager
  summary:
    - >
      marcli is a small Go command-line parser for MARC records, focused on reading MARC
      binary and MARC XML files and extracting or converting bibliographic metadata from
      the shell.
  timeline:
    - '2017: Public GitHub repository created.'
    - '2020: 1.0.1 release published.'
    - '2022: 1.1.0 release published.'
    - '2025: 1.3.1 release published.'
  usage:
    - >
      Users run marcli with -file against .mrc or XML data. The README examples show
      printing records, matching records by string, selecting fields, counting records,
      and outputting Mnemonic MARC, MARC XML, MARC JSON, or MARC binary where supported.
    - >
      For package users, the value is a single command that can inspect large library
      catalog exports without writing a parser or opening a heavyweight cataloging
      application.
related-packages:
  - id: brew:yaz
    reason: >
      YAZ's `yaz-marcdump` is a broader MARC conversion alternative that can encode and
      decode ISO 2709 records in several formats, whereas marcli emphasizes simple
      record filtering and field selection.
    rel: alternative
    sources:
      - https://github.com/hectorcorrea/marcli
      - https://software.indexdata.com/yaz/doc/marc.html
      - https://software.indexdata.com/yaz/doc/reference.html
category: data
package-manager:
  brew: marcli
package-manager-url: https://formulae.brew.sh/formula/marcli
license: MIT
tags:
  - cli
  - iso-2709
  - library-cataloging
  - marc
  - metadata
  - parser
description: Parse MARC (ISO 2709) files
executables:
  - marcli
provenance:
  formula: marcli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
