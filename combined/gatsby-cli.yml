id: brew:gatsby-cli
display-name: Gatsby CLI
homepage: https://www.gatsbyjs.com/docs/reference/gatsby-cli/
repo: https://github.com/gatsbyjs/gatsby
docs:
  - https://www.gatsbyjs.com/docs/reference/gatsby-cli
  - https://github.com/gatsbyjs/gatsby/tree/master/packages/gatsby-cli#readme
config-file-location:
  unix:
    - <project_root>/gatsby-config.js
    - <project_root>/gatsby-config.mjs
    - <project_root>/gatsby-config.ts
  windows:
    - <project_root>\gatsby-config.js
    - <project_root>\gatsby-config.mjs
    - <project_root>\gatsby-config.ts
credentials-file-location: null
history:
  adoption-history:
    - >
      The README points users to quickstarts, tutorials, plugins, starters, showcase
      sites, migration guides, release notes, and GitHub Discussions. It also exposes
      npm version and download badges for the main Gatsby package, reflecting Gatsby's
      package-centric ecosystem of starters and plugins.
  package-nerd-significance:
    - >
      Gatsby CLI is significant because it made a large React/static-site ecosystem
      accessible through a single package command, tying together starters, plugins,
      GraphQL data loading, local development servers, and production builds. For
      package managers, it is the small executable facade over a much larger JavaScript
      framework and plugin graph.
  project-history:
    - >
      The Gatsby repository was created in May 2015, with early 0.x releases later that
      year. Gatsby v1 reached beta and stable release milestones in 2017, and the
      project subsequently moved through major framework releases while keeping the CLI
      in the monorepo as one of many npm-published packages.
    - >
      The official README describes Gatsby as a free and open-source React framework
      that combines static-site generation with app-style React behavior. The repository
      notes that it is a Lerna-managed monorepo containing multiple packages, including
      `gatsby-cli`.
  related-projects:
    - >
      Gatsby CLI is part of the Gatsby monorepo and is closely related to Gatsby
      starters, Gatsby plugins, React, GraphQL, Netlify deployment workflows, and the
      wider Gatsby documentation and showcase ecosystem.
  sources:
    - https://github.com/gatsbyjs/gatsby
    - https://github.com/gatsbyjs/gatsby/releases
    - https://www.gatsbyjs.com/docs/reference/config-files/gatsby-config
    - https://www.gatsbyjs.com/docs/reference/gatsby-cli
    - https://www.gatsbyjs.com/docs/reference/release-notes
  summary:
    - >
      Gatsby CLI is the command-line front end for Gatsby, the React-based framework for
      building static, server-rendered, and hybrid websites. It is the
      package-manager-facing entry point for creating, developing, building, serving,
      cleaning, and inspecting Gatsby sites.
  timeline:
    - '2015: Gatsby repository created.'
    - '2015: Early 0.x releases published.'
    - '2017: Gatsby v1 beta and v1 stable releases published.'
    - '2021: Gatsby v3.0.0 and v4.0.0 releases published.'
    - '2022: Gatsby v5.0.0 release published.'
  usage:
    - >
      The CLI can be installed globally with `npm install -g gatsby-cli` or run with
      `npx`. Common commands include `gatsby new`, `gatsby develop`, `gatsby build`,
      `gatsby serve`, `gatsby clean`, `gatsby info`, and `gatsby repl`.
related-packages:
  - id: brew:hugo
    reason: >
      Choose Hugo for a standalone Go-based static-site generator with its own template
      and content system; choose Gatsby when React components, GraphQL data sourcing,
      and the Gatsby plugin ecosystem are central.
    rel: alternative
    sources:
      - https://www.gatsbyjs.com/docs/reference/gatsby-cli/
      - https://gohugo.io/documentation/
category: developer-tools
package-manager:
  brew: gatsby-cli
  nix: gatsby-cli
package-manager-url: https://formulae.brew.sh/formula/gatsby-cli
license: MIT
tags:
  - cli
  - gatsby
  - nodejs
  - react
  - static-site-generator
  - web-development
description: Gatsby command-line interface
executables:
  - gatsby
provenance:
  formula: gatsby-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
