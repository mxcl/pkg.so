id: brew:libxspf
display-name: libxspf
homepage: https://libspiff.sourceforge.net/
repo: https://gitlab.xiph.org/xiph/libxspf
docs:
  - https://libspiff.sourceforge.net/doc/html
  - https://libspiff.sourceforge.net/doc/html/group__xspf__c.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libxspf served the practical side of XSPF adoption: it gave media applications a
      parser, writer, C bindings, examples, and validation-oriented command-line tools
      for XSPF versions 0 and 1. Its releases mostly track ABI, build-system, compiler,
      and documentation polish rather than a broad application platform.
  package-nerd-significance:
    - >
      libxspf is niche, but it is a classic package-manager fossil from the XML
      media-format era: a small C++ library built around Expat, uriparser, pkg-config,
      Doxygen docs, and a named open format from Xiph rather than a player-specific
      playlist file.
  project-history:
    - >
      XSPF was standardized as an open XML playlist format under the Xiph.Org umbrella.
      The specification describes a format intended to avoid every music player
      inventing its own XML playlist vocabulary.
    - >
      The library was first developed as libSpiff and reached 1.0.0 on September 21,
      2008. On February 21, 2009, the 1.1.0 release renamed libSpiff to libxspf, added a
      pkg-config file, and reorganized the Autotools build.
  related-projects:
    - >
      XSPF is the format that libxspf implements. Xiph.Org hosts the project. Expat and
      uriparser are important dependencies in the library history, and libcpptest
      appears in its test-suite history.
  sources:
    - https://gitlab.xiph.org/xiph/libxspf/-/raw/master/ChangeLog
    - https://gitlab.xiph.org/xiph/libxspf/-/raw/master/README
    - https://libspiff.sourceforge.net/doc/html/
    - https://www.xspf.org/spec
  summary:
    - >
      libxspf is a small Xiph.Org C++ library for reading and writing XSPF playlists,
      the XML Shareable Playlist Format pronounced spiff.
  timeline:
    - >
      2005-01: XSPF Version 1 was published by the Playlist Ad-Hoc Group under the
      Xiph.Org XSPF site.
    - '2008-09-21: libSpiff 1.0.0 was released.'
    - '2009-02-21: Version 1.1.0 renamed libSpiff to libxspf.'
    - '2009-03-07: Version 1.2.0 added xspf_parse_memory to the C bindings.'
    - >
      2021-05-29: Version 1.2.1 refreshed build-system compatibility and fixed compiler
      issues.
  usage:
    - >
      The project README presents libxspf as an integration library for applications
      that need to read or write XSPF playlist files. The generated documentation walks
      through reading playlists and receiving playlist and track callbacks, while the
      Homebrew package exposes xspf_check and xspf_strip for validation and cleanup
      workflows.
related-packages: []
category: media
package-manager:
  apk: libxspf
  brew: libxspf
  macports: libxspf
  zypper: libxspf-devel
package-manager-url: https://formulae.brew.sh/formula/libxspf
license: BSD-3-Clause
