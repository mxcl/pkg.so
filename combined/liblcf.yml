config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption followed EasyRPG's portability story. Because EasyRPG targets desktop,
      mobile, console, and browser environments, liblcf is packaged as a reusable
      low-level component rather than only as an internal parser.
    - >
      Package-manager metadata in this batch lists liblcf in Homebrew, Alpine, Fedora,
      and Nix, reflecting its role as a niche but reusable library for RPG Maker
      2000/2003 compatibility work.
  package-nerd-significance:
    - >
      For package maintainers, liblcf is a good example of a small preservation-oriented
      library whose CLI utilities are as important as the library ABI. It packages a
      reverse-engineered game-data format into a normal Unix build artifact, which makes
      RPG Maker preservation workflows scriptable.
  project-history:
    - >
      EasyRPG describes itself as a free, open source project compatible with RPG Maker
      2000/2003 games. liblcf became the shared data layer for that effort: EasyRPG
      Player can interpret RPG Maker games while liblcf handles the game database, map,
      save, and related LCF-format data.
    - >
      The GitHub repository was created on January 25, 2012, and the first GitHub
      release listed by the repository API was 0.2.1 on July 2, 2014. The README
      documents the tool side of the library through LCF2XML, which converts RPG Maker
      2000/2003 files such as LMU, LMT, LDB, and LSD to XML and back, and LCFSTRINGS,
      which extracts strings from those files.
  related-projects:
    - EasyRPG Player uses liblcf as the parser layer for RPG Maker 2000/2003 game data.
    - >
      EasyRPG's broader ecosystem includes EasyRPG Player, EasyRPG Editor, the EasyRPG
      wiki, and the Open RTP asset project.
  sources:
    - https://api.github.com/repos/EasyRPG/liblcf
    - https://api.github.com/repos/EasyRPG/liblcf/releases?per_page=100
    - https://easyrpg.org/
    - https://github.com/EasyRPG/liblcf
    - https://wiki.easyrpg.org/development/compiling/liblcf
  summary:
    - >
      liblcf is the EasyRPG project's C++ library for reading and writing RPG Maker 2000
      and 2003 game data, including LCF files and XML conversions. Its importance is
      less about being a general-purpose game library and more about preserving and
      interoperating with the proprietary data formats used by RPG Maker 2000/2003
      games.
  timeline:
    - '2007: EasyRPG project copyright range begins on the project website.'
    - '2012: EasyRPG/liblcf GitHub repository created.'
    - '2014: liblcf 0.2.1 published as a GitHub release.'
    - '2021: EasyRPG wiki liblcf build page last modified on January 22, 2021.'
    - '2025: liblcf 0.8.1 "Stun" published on April 7, 2025.'
  usage:
    - >
      Developers use liblcf directly as a library or through its command-line tools when
      inspecting, converting, or validating RPG Maker 2000/2003 project data. Its build
      documentation covers Autotools and CMake, with CMake documented as the supported
      route for Windows builds.
related-packages:
  - id: brew:easyrpg-player
    reason: >
      Use EasyRPG Player with liblcf to run RPG Maker 2000/2003 games; official
      maintainer guidance says the Player and parser library should be upgraded
      together.
    rel: adjacent_workflow
    sources:
      - https://github.com/EasyRPG/liblcf#readme
      - https://blog.easyrpg.org/2025/04/easyrpg-player-0-8-1-stun/
