id: brew:git-grab
display-name: git-grab
homepage: https://codeberg.org/wezm/git-grab
repo: https://codeberg.org/wezm/git-grab
docs:
  - https://github.com/wezm/git-grab#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-grab found a small audience among developers who like deterministic
      `~/src/host/path` clone layouts. Its README lists package-manager availability in
      Arch Linux, Homebrew, and Chimera Linux, and the crate page records its
      distribution through the Rust package ecosystem.
  package-nerd-significance:
    - >
      git-grab is a compact example of a packageable personal workflow convention: it
      standardizes where clones land, but delegates actual cloning to Git and keeps the
      command small.
  project-history:
    - >
      The project began in 2021 and released an initial 0.1.1 build shortly after its
      GitHub repository and crates.io package appeared. The README describes it as
      inspired by John Graham-Cumming's `grab`, but narrowed to Git rather than multiple
      version-control systems and designed to let Git itself provide clone progress and
      behavior.
    - >
      The GitHub README later marked the repository as moved to Codeberg. Releases
      through the 4.x line kept the packaged Rust implementation available while the
      canonical project home shifted away from GitHub.
  related-projects:
    - >
      git-grab is related to `grab` by John Graham-Cumming, `git-get`, GitHub CLI
      aliases, and local source-tree conventions used by Go and Rust developers.
  sources:
    - https://codeberg.org/wezm/git-grab
    - https://crates.io/crates/git-grab
    - https://formulae.brew.sh/formula/git-grab
    - https://github.com/wezm/git-grab
    - https://github.com/wezm/git-grab/blob/main/README.md
    - https://github.com/wezm/git-grab/releases
  summary:
    - >
      git-grab is a Rust command-line tool that clones Git repositories into a standard
      source tree organized by domain and path. Its default home is `~/src`, with
      `GRAB_HOME` or `--home` available for users who prefer another root.
  timeline:
    - '2021: Repository and crates.io package appeared.'
    - '2021: 0.1.1 initial release shipped.'
    - '2022: 1.0.0 release marked the first stable line.'
    - '2026: 4.0.x releases preceded the public move notice to Codeberg.'
  usage:
    - >
      Practitioners run `git grab github.com/wezm/git-grab` or pass any URL accepted by
      Git, with optional clipboard and copy-path helpers. Because it installs as
      `git-grab`, Git can invoke it as `git grab`, making it feel like a native Git
      subcommand.
related-packages:
  - id: brew:git-get
    reason: >
      Choose git-get when you also need to scan repository status or export and recreate
      a source tree from a dump; Git Grab stays focused on quick organized cloning.
    rel: alternative
    sources:
      - https://codeberg.org/wezm/git-grab
      - https://github.com/wezm/git-grab#readme
      - https://github.com/grdl/git-get#readme
  - id: brew:gh
    reason: >
      Git Grab's official README documents a `gh grab` alias that uses GitHub CLI to
      turn an owner/repository argument into a `git grab` invocation.
    rel: adjacent_workflow
    sources:
      - https://github.com/wezm/git-grab#with-github-cli
      - https://cli.github.com/manual/gh_alias_set
category: developer-tools
package-manager:
  brew: git-grab
  pacman: git-grab
  winget: wezm.git-grab
package-manager-url: https://formulae.brew.sh/formula/git-grab
license: Apache-2.0 OR MIT
tags:
  - cli
  - clone
  - git
  - repository-management
  - rust
description: Clone a git repository into a standard location organised by domain and path
executables:
  - git-grab
provenance:
  formula: git-grab
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
