id: brew:libgetdata
display-name: GetData
homepage: https://getdata.sourceforge.net/
repo: https://github.com/ketiltrout/getdata
docs:
  - https://getdata.sourceforge.net/dirfile.html
  - https://getdata.sourceforge.net/getdata.html
  - https://getdata.sourceforge.net/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GetData adoption is domain-specific rather than mass-market. The official page
      names cosmological and astrophysical users including ACT, Planck, Spider,
      BOOMERanG, and BLAST, and describes BLAST analysis dirfiles with roughly 10^4
      fields and 10^8 samples each.
    - >
      Package-manager adoption reflects that niche: Homebrew, Debian, and Ubuntu package
      it for scientific users who need the reference implementation and its language
      bindings rather than a general database server.
  package-nerd-significance:
    - >
      GetData is the kind of package that keeps scientific archives reproducible: small,
      old-school C, autotools, man-page standards, and bindings for several analysis
      languages. It matters less for popularity metrics than for preserving access to
      experiment data and legacy analysis pipelines.
    - >
      Its package name is also easy to underestimate. In distro graphs it is not a
      generic downloader; it is a reference implementation for a specialized scientific
      data standard.
  project-history:
    - >
      The GetData project page states that GetData and the Dirfile Standards were
      originally written by C. B. Netterfield and later maintained by D. V. Wiebe. It
      was originally written for the BOOMERanG and BLAST experiments as a data format
      suitable for quick-look and data reduction, and it began as one of the native data
      formats supported by the kst plotting program.
    - >
      As use spread beyond those experiments, GetData became a standalone library. The
      project documents C, C++, Fortran, IDL, MATLAB, Perl, PHP, and Python bindings,
      plus command-line utilities such as checkdirfile and dirfile2ascii.
  related-projects:
    - >
      Dirfile is the file-format standard that GetData implements. kst is historically
      related as the plotting program whose quick-look needs shaped early usage.
      BOOMERanG, BLAST, ACT, Planck, and Spider are named scientific users in the
      project documentation.
  sources:
    - https://formulae.brew.sh/formula/libgetdata
    - https://getdata.sourceforge.net/
    - https://getdata.sourceforge.net/dirfile.html
    - https://getdata.sourceforge.net/getdata.html
    - https://github.com/ketiltrout/getdata
    - https://raw.githubusercontent.com/ketiltrout/getdata/master/NEWS
  summary:
    - >
      GetData is the reference implementation of the Dirfile Standards, a
      filesystem-based, column-oriented format for time-ordered binary data. Its history
      is unusually tied to scientific instrumentation: it grew out of quick-look and
      analysis needs in balloon-borne cosmology experiments, then became a standalone
      library and format reference.
  timeline:
    - >
      2008: Project website copyright range begins and GetData 0.3-era documentation
      marks the legacy API transition.
    - >
      2012: Dirfile Standards Version 9 published, according to the GetData README
      history note.
    - '2015: GetData was registered in the Astrophysics Source Code Library as ascl:1512.02.'
    - '2017: GetData 0.10.0 became the first release to support Dirfile Standards Version 10.'
    - '2021: GetData 0.11.0 was released on 12 November 2021.'
  usage:
    - >
      GetData is used to read and write dirfiles, whose data streams live as binary
      files with ASCII metadata describing raw and derived fields. The format is
      optimized for fast, simple storage and retrieval of time-ordered data, including
      concurrent read/write scenarios.
    - >
      The package is useful when software needs a stable on-disk format for high-volume
      sampled data, plus bindings for analysis environments. The included tools validate
      dirfile metadata and export dirfile contents to ASCII.
related-packages: []
category: data
package-manager:
  brew: libgetdata
  debian: libf95getdata7
  ubuntu: libf95getdata7
package-manager-url: https://formulae.brew.sh/formula/libgetdata
license: LGPL-2.1-or-later
tags:
  - binary-data
