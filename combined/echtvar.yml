id: brew:echtvar
display-name: echtvar
homepage: https://academic.oup.com/nar/advance-article/doi/10.1093/nar/gkac931/6775383
repo: https://github.com/brentp/echtvar
docs:
  - https://academic.oup.com/nar/advance-article/doi/10.1093/nar/gkac931/6775383
  - https://github.com/brentp/echtvar#readme
config-file-location:
  unix: conf.json
credentials-file-location: null
history:
  adoption-history:
    - >
      echtvar's adoption path is a scientific-tool path rather than a broad
      developer-tool path: users can download static binaries and pre-encoded gnomAD
      v3.1.2 resources from GitHub releases, or build the Rust project themselves.
      Homebrew packaging makes it easier to install the executable on developer and
      analysis workstations.
    - >
      The project is niche compared with general bioinformatics standards such as
      htslib, but it fills a practical need for fast annotation/filtering against large
      population datasets.
  package-nerd-significance:
    - >
      echtvar is interesting because it packages a paper-backed bioinformatics data
      structure as a small Rust CLI. Package managers help users get the executable,
      while GitHub releases carry large precomputed domain data that would not belong
      inside a formula.
    - >
      Its dependency story is also typical of modern bioinformatics packaging:
      htslib/rust-htslib for VCF/BCF I/O, compression libraries for speed, and a
      command-line interface meant to slot into pipelines.
  project-history:
    - >
      The public repository was created in November 2021, and the first GitHub release,
      v0.1.0, was published in January 2022. The README describes echtvar as efficiently
      encoding variant allele frequency and other information from huge population
      datasets for rapid annotation at about one million variants per second.
    - >
      The project is backed by a Nucleic Acids Research article and is developed in the
      Jeroen de Ridder lab. Its README explains the core design: chunking the genome,
      encoding variants into compact integers when possible, using zip files, delta
      encoding, integer compression, and lookup tables for selected integer, float, or
      low-cardinality string fields.
  related-projects:
    - The README credits htslib via rust-htslib for reading and writing BCF/VCF.
    - gnomAD is the main example population resource used for pre-encoded echtvar archives.
    - >
      stream-vbyte, bincode, and fasteval are part of the implementation and
      expression-evaluation story described by the README.
  sources:
    - https://github.com/brentp/echtvar
    - https://raw.githubusercontent.com/brentp/echtvar/main/README.md
    - https://github.com/brentp/echtvar/releases
    - https://api.github.com/repos/brentp/echtvar
    - https://academic.oup.com/nar/advance-article/doi/10.1093/nar/gkac931/6775383
  summary:
    - >
      echtvar is a Rust command-line tool for rapid genomic variant annotation and
      filtering. Its package relevance is specialized but clear: it turns large
      population VCF resources into compact searchable archives that can annotate cohort
      VCF/BCF files quickly.
  timeline:
    - '2021: Public echtvar GitHub repository created.'
    - '2022: v0.1.0 initial release published.'
    - '2022: Nucleic Acids Research article page published for echtvar.'
    - '2026: v0.2.4 released, with repository activity continuing.'
  usage:
    - >
      A common workflow is to encode a population VCF once with echtvar encode, then
      reuse the resulting .echtvar.zip archive for many annotation runs with echtvar
      anno. The README shows annotation with multiple -e archive arguments and optional
      filtering expressions such as allele-frequency thresholds.
    - >
      Encode configuration uses JSON5 to select and rename VCF fields, while annotation
      consumes decomposed and normalized VCF/BCF inputs and can stream from stdin.
related-packages:
  - id: brew:bcftools
    reason: >
      Use bcftools norm to split multiallelic records and normalize variants before
      annotation, matching echtvar's documented requirement for decomposed and
      normalized VCF or BCF input.
    rel: adjacent_workflow
    sources:
      - https://github.com/brentp/echtvar
      - https://samtools.github.io/bcftools/bcftools
category: science
