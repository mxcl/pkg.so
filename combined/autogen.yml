id: brew:autogen
display-name: GNU AutoGen
homepage: https://autogen.sourceforge.net/
repo: https://git.savannah.gnu.org/cgit/autogen.git
docs:
  - https://www.gnu.org/software/autogen/manual/autogen.html
  - https://www.gnu.org/software/autogen
config-file-location:
  unix:
    - ~/.autogenrc
    - $PWD/.autogenrc
credentials-file-location: null
history:
  adoption-history:
    - >
      AutoGen is packaged across traditional Unix package managers including Homebrew,
      Debian/Ubuntu, Fedora, Arch, MacPorts, Nix, and openSUSE according to the batch
      input. That breadth signals long-tail adoption in developer-tool stacks even
      though the project is much less visible than the Autotools packages it often sits
      near.
    - >
      Its adoption has mostly been indirect: users encounter it as a dependency or
      maintainer-side generator in source releases, not as a fashionable end-user CLI.
  package-nerd-significance:
    - >
      For package maintainers, AutoGen matters as one of the older GNU-era generator
      utilities that can appear in bootstrap chains. It is the kind of package that
      explains why source builds sometimes need more than a compiler and make: generated
      files may come from project-specific template systems.
  project-history:
    - >
      AutoGen is associated with Bruce Korb and the GNU project; the GNU manual and
      AutoGen pages present it as a general automated text-file generator rather than a
      language-specific compiler tool. The package also includes related commands such
      as AutoOpts tooling, getdefs, columns, and xml2ag, which made it useful in build
      and release workflows beyond a single executable.
    - >
      The project lived in the GNU/Savannah ecosystem and also maintained a
      SourceForge-facing homepage, reflecting a common early-2000s free-software
      distribution pattern: GNU project page, Savannah source control, tarball releases,
      and downstream packaging by Unix distributions.
  related-projects:
    - >
      AutoOpts is distributed with AutoGen and provides option-processing support
      generated from definitions.
    - >
      GNU Autoconf, Automake, and Libtool occupy the neighboring build-bootstrap space
      where generated project files are common.
  sources:
    - https://git.savannah.gnu.org/cgit/autogen.git
    - https://www.gnu.org/software/autogen/
    - https://www.gnu.org/software/autogen/manual/autogen.html
    - source_facts.package-manager
  summary:
    - >
      GNU AutoGen is a GNU code and text generation utility built around definition
      files and templates. Its package identity is very Unixy: a command-line generator
      for maintainers who want repeatable source, option, or configuration files instead
      of hand-editing generated boilerplate.
  timeline:
    - '1990s-2000s: AutoGen develops as a GNU automated text and program generation tool.'
    - >
      2010s: GNU manual and Savannah repository remain the official
      documentation/source-control surfaces.
    - >
      2020s: AutoGen remains packaged in multiple Unix package managers, mostly as a
      maintainer/developer utility.
  usage:
    - >
      AutoGen users write definitions and templates, then run the autogen command to
      emit source or text files. Package users also see the auxiliary tools listed by
      the Homebrew formula, including autoopts-config, columns, getdefs, and xml2ag.
    - >
      It is not a credentials-oriented tool and the official curation does not document
      a single user configuration path.
related-packages: []
category: developer-tools
package-manager:
  brew: autogen
  debian: autogen
  dnf: autogen
  macports: autogen
  nix: autogen
  pacman: autogen
  ubuntu: autogen
  zypper: autogen
package-manager-url: https://formulae.brew.sh/formula/autogen
license: GPL-3.0-or-later
tags:
  - cli
  - code-generation
  - gnu
  - templates
  - text-generation
description: Automated text file generator
executables:
  - autogen
  - autoopts-config
  - columns
  - getdefs
  - xml2ag
provenance:
  formula: autogen
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
