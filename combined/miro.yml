config-file-location:
  macos: ~/Library/Application Support/RealtimeBoard
credentials-file-location: null
history:
  adoption-history:
    - >
      Miro reports adoption by more than 100 million users across 250,000 organizations.
      Its official company history records expansion through global hubs and
      increasingly enterprise-oriented collaboration, product-development, and AI
      workflows.
  package-nerd-significance:
    - >
      The Homebrew cask packages the desktop shell for a major web-first SaaS product.
      The retained RealtimeBoard application-data name is a practical trace of the
      product's pre-2019 identity and is relevant when resetting or troubleshooting
      desktop installations.
  project-history:
    - >
      Andrey Khusid created the first version in 2011 so his design agency could
      communicate ideas with remote clients. The product launched as RealtimeBoard, an
      infinite collaborative canvas, and was renamed Miro in March 2019 as its scope
      expanded beyond literal whiteboarding.
  related-projects:
    - >
      The Miro browser, desktop, tablet, and mobile clients access the same hosted
      collaboration platform.
    - >
      The desktop application historically retains the RealtimeBoard name in some local
      application-data paths.
  sources:
    - 'Official About page: https://miro.com/about/'
    - >
      Official desktop documentation:
      https://help.miro.com/hc/en-us/articles/360017572854-Desktop-app
    - >
      Official rebranding announcement:
      https://miro.com/blog/features/realtimeboard-is-now-miro/
  summary:
    - >
      Miro is a hosted visual collaboration workspace with an infinite canvas for
      whiteboarding, brainstorming, workshops, product design, diagramming, and process
      management. The cask installs its macOS desktop client.
  timeline:
    - '2011: Andrey Khusid created RealtimeBoard for remote design-agency collaboration.'
    - '2017: The company received Series A funding.'
    - '2019: RealtimeBoard was renamed Miro.'
    - '2022: Miro announced a $400 million Series C round and a $17.5 billion valuation.'
    - '2024: Miro introduced the Innovation Workspace positioning.'
    - >
      2025: Miro described itself as an AI Innovation Workspace and reported more than
      100 million users.
  usage:
    - >
      Teams use shared boards for brainstorming, meetings, workshops, product
      development, diagrams, planning, and asynchronous review. The desktop client
      supports the core browser features and provides focused board access on macOS and
      Windows.
