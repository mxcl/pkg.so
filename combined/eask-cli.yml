id: brew:eask-cli
display-name: Eask
homepage: https://emacs-eask.github.io/
repo: https://github.com/emacs-eask/cli
docs:
  - https://emacs-eask.github.io/
  - https://emacs-eask.github.io/Getting-Started/Basic-Usage
  - https://emacs-eask.github.io/Getting-Started/Commands-and-options
config-file-location:
  unix: Eask
credentials-file-location: null
history:
  adoption-history:
    - >
      Eask's adoption is concentrated in the Emacs Lisp package-maintainer community.
      The npm registry records the scoped package `@emacs-eask/cli`, while Homebrew
      packages the same npm artifact as `eask-cli`; the input also records additional
      package-manager availability across MacPorts, Nix, Scoop, winget, and Fedora.
    - >
      The official docs homepage describes Eask as supporting 80-plus commands, which
      explains its appeal for maintainers who want one repeatable CLI for package
      checks, dependency installation, byte compilation, linters, and test runners.
  package-nerd-significance:
    - >
      Eask is package-nerd-interesting because it brings modern CLI packaging
      expectations to a historically editor-native ecosystem. It wraps Emacs Lisp
      package development in a global executable, documented commands, CI-friendly
      behavior, and package-manager distribution.
    - >
      It is also a small example of cross-ecosystem packaging: an Emacs-focused tool
      distributed via npm, then repackaged by Homebrew and other OS package managers.
  project-history:
    - >
      The official GitHub repository was created in March 2022. The README says Eask was
      originally designed as a package development tool for Elisp projects, then
      expanded to support dependency management in Emacs configurations and running
      Elisp programs as a lightweight runtime.
    - >
      Eask positions itself as a successor or alternative to earlier Emacs Lisp build
      tools such as Cask, makem.sh, and Eldev. Its documentation emphasizes a consistent
      sandboxing environment, built-in Emacs commands, testing/linting helpers, and a
      dependency-light executable.
  related-projects:
    - Cask is the older Emacs Lisp project tool Eask explicitly compares itself with.
    - makem.sh and Eldev are related Emacs Lisp build/test tools named by the README.
    - GNU Emacs is the runtime and package ecosystem Eask targets.
  sources:
    - https://github.com/emacs-eask/cli
    - https://emacs-eask.github.io/
    - https://registry.npmjs.org/@emacs-eask%2fcli
    - https://formulae.brew.sh/api/formula/eask-cli.json
  summary:
    - >
      Eask is a CLI and project file format for Emacs Lisp package development,
      dependency management, testing, and script execution. It is distributed as the
      `eask` executable and uses an `Eask` file as the project configuration surface.
  timeline:
    - '2022-03: The official GitHub repository was created.'
    - '2022-09: npm registry records creation of `@emacs-eask/cli`.'
    - '2024-06: GitHub releases show the 0.10.0 line.'
    - '2025-12: GitHub releases show the 0.12.0 line.'
    - '2026-06: GitHub releases show 0.12.10 while Homebrew packages 0.12.9.'
  usage:
    - >
      Typical usage is to place an `Eask` file in an Emacs Lisp project, then run `eask`
      commands for dependency installation, package building, byte compilation, linting,
      and tests. The README notes that the Eask file itself is treated as Emacs Lisp,
      which keeps the configuration familiar to Emacs package authors.
    - >
      Eask can also be used outside package publishing: users can manage dependencies
      for an Emacs configuration or run Elisp programs through the CLI.
related-packages:
  - id: brew:cask
    reason: >
      Cask is the older Emacs Lisp project and dependency tool that Eask identifies as
      its predecessor; choose Cask for established Cask-based projects, while Eask
      offers a broader command set and can convert an existing Cask file.
    rel: alternative
    sources:
      - https://emacs-eask.github.io/
      - https://emacs-eask.github.io/Getting-Started/Commands-and-options/
      - https://github.com/cask/cask
category: developer-tools
package-manager:
  brew: eask-cli
  dnf: eask
  macports: eask-cli
  nix: eask-cli
  scoop: extras/eask-cli
  winget: eask.cli
package-manager-url: https://formulae.brew.sh/formula/eask-cli
license: GPL-3.0-or-later
tags:
  - build-tool
  - cli
  - dependency-management
  - emacs
  - emacs-lisp
  - package-development
  - testing
description: CLI for building, running, testing, and managing your Emacs Lisp dependencies
executables:
  - eask
provenance:
  formula: eask-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
