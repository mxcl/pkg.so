id: brew:dasm
display-name: DASM
homepage: https://dasm-assembler.github.io/
repo: https://github.com/dasm-assembler/dasm
docs:
  - https://dasm-assembler.github.io/
  - https://github.com/dasm-assembler/dasm#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DASM's long life comes from its support for processors and machines that matter to
      8-bit development, including MOS 6502 and 6507 systems, Motorola-family chips,
      Hitachi HD6303, and Fairchild F8. The official downloads include Linux, macOS,
      Windows, and Raspberry Pi OS binaries.
  package-nerd-significance:
    - >
      For package history, DASM is the rare tool where modern package managers carry a
      living utility from late-1980s assembly culture into current retrocomputing and
      homebrew-console build chains.
  project-history:
    - >
      The official DASM site traces the assembler to Matthew Dillon in 1987-1988,
      followed by extensions and several maintainer eras through the 1990s and 2000s.
      The project moved its source and releases to GitHub in 2019.
  related-projects:
    - >
      DASM is commonly associated with 8-bit targets such as Atari 2600, Atari 7800, and
      Fairchild Channel F development.
  sources:
    - https://dasm-assembler.github.io/
    - https://github.com/dasm-assembler/dasm
    - https://github.com/dasm-assembler/dasm/releases/tag/v2.20.17
  summary:
    - >
      DASM is a C macro assembler for 8-bit processors used in retrocomputing, console
      homebrew, and cross-assembly workflows.
  timeline:
    - '1987-1988: Matthew Dillon started DASM.'
    - '1995: Olaf Seibert extended DASM.'
    - '2003-2008: Andrew Davie maintained DASM.'
    - '2008-2015: Peter Frohlich maintained DASM.'
    - '2019: Source code and releases moved to GitHub.'
    - '2026: v2.20.17 was published on GitHub.'
  usage:
    - >
      It is used as a command-line cross-assembler, with included console-specific
      headers and common macros for systems such as the Atari 2600, Atari 7800, and
      Fairchild Channel F.
related-packages:
  - id: brew:cc65
    reason: >
      Choose cc65 for 6502-family projects that need an integrated C compiler, ca65
      macro assembler, linker, libraries, and platform tools rather than DASM's
      multi-processor standalone assembler workflow.
    rel: alternative
    sources:
      - https://dasm-assembler.github.io/
      - https://cc65.github.io/index.html
      - https://cc65.github.io/doc/ca65.html
category: developer-tools
package-manager:
  brew: dasm
  debian: dasm
  nix: dasm
  ubuntu: dasm
package-manager-url: https://formulae.brew.sh/formula/dasm
license: GPL-2.0-or-later
tags:
  - 8-bit
  - assembler
  - cli
  - macro-assembler
  - microprocessors
  - retrocomputing
description: Macro assembler with support for several 8-bit microprocessors
executables:
  - dasm
  - ftohex
provenance:
  formula: dasm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
