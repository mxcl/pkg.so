id: brew:minicom
display-name: minicom
homepage: https://packages.debian.org/sid/minicom
repo: https://salsa.debian.org/minicom-team/minicom
docs:
  - https://salsa.debian.org/minicom-team/minicom
  - https://salsa.debian.org/minicom-team/minicom/-/blob/master/README
config-file-location:
  unix:
    - /etc/minicom/minirc.dfl
    - /etc/minicom/minirc.<configuration>
    - ~/.minirc.dfl
    - ~/.minirc.<configuration>
credentials-file-location: null
history:
  project-history:
    - >
      Its role expanded beyond dial-up modem use into a general serial-console tool. The
      feature set documented by Debian and the man page includes ANSI and VT102 terminal
      emulation, dialing directories with auto-redial, UUCP-style serial-device locks,
      capture-to-file logging, remappable keys, startup scripting, and external
      X/Y/ZMODEM file-transfer helpers. That made it useful both for historical modem
      work and for hardware bring-up, embedded devices, lab equipment, routers, and
      other systems reached through a serial port.
  sources:
    - https://formulae.brew.sh/formula/minicom
    - https://github.com/Distrotech/minicom/blob/master/src/minicom.c
    - https://packages.debian.org/sid/minicom
    - https://salsa.debian.org/minicom-team/minicom
    - https://www.mankier.com/1/minicom
  summary:
    - >
      Minicom is one of the long-running Unix serial-communications programs that
      carried DOS-style modem workflows into text-mode Unix environments. Source headers
      in the codebase identify Miquel van Smoorenburg as the original author for the
      1991-1996 minicom communications package, and Debian describes the program as
      modeled on the MS-DOS Telix interface: a full-screen, menu-driven terminal for
      modems and serial consoles.
  usage:
    - >
      In package-manager terms, minicom occupies the classic ncurses serial-terminal
      niche next to smaller tools such as picocom and multipurpose terminal programs
      such as screen. Its wide distro packaging reflects that niche: it is boring
      infrastructure for people who need a configurable serial console rather than a
      graphical terminal emulator.
related-packages:
  - id: brew:picocom
    reason: >
      Choose picocom for a very small, command-line-driven serial terminal when you do
      not need Minicom's menus, dialing directory, profiles, or built-in scripting
      workflow.
    rel: alternative
    sources:
      - https://github.com/npat-efault/picocom
      - https://manpages.debian.org/trixie/minicom/minicom.1.en.html
  - id: brew:tio
    reason: >
      Choose tio for embedded-device work that benefits from automatic reconnect, device
      discovery, topology IDs, modern logging, configuration profiles, and Lua
      automation.
    rel: alternative
    sources:
      - https://github.com/tio/tio
      - https://manpages.debian.org/trixie/minicom/minicom.1.en.html
  - id: brew:screen
    reason: >
      GNU Screen is a useful alternative when you want a basic serial TTY connection
      inside a detachable multiplexer rather than Minicom's dedicated communications
      interface.
    rel: alternative
    sources:
      - https://www.gnu.org/software/screen/manual/screen.html
      - https://manpages.debian.org/trixie/minicom/minicom.1.en.html
category: networking
package-manager:
  apk: minicom
  brew: minicom
  debian: minicom
  dnf: minicom
  macports: minicom
  nix: minicom
  pacman: minicom
  ubuntu: minicom
  zypper: minicom
package-manager-url: https://formulae.brew.sh/formula/minicom
license: GPL-2.0-or-later
tags:
  - cli
  - communications
  - modem
  - ncurses
  - serial
  - terminal-emulator
description: Menu-driven communications program
executables:
  - ascii-xfr
  - minicom
  - runscript
  - xminicom
provenance:
  formula: minicom
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
