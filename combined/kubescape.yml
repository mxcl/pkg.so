id: brew:kubescape
display-name: Kubescape
homepage: https://kubescape.io
repo: https://github.com/kubescape/kubescape
docs:
  - https://kubescape.io/docs
  - https://kubescape.io/docs/getting-started
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kubescape's packaging shows adoption across developer and CI workflows: official
      docs list Homebrew installation, the project maintains a GitHub Action, and the
      README lists package-manager paths for Homebrew, Krew, Arch, Ubuntu, Nix,
      Chocolatey, and Scoop.
  package-nerd-significance:
    - >
      Kubescape matters to package maintainers because it sits at the intersection of
      Kubernetes CLI tooling, security scanning databases, and policy frameworks. It is
      also an example of a CNCF security project with both a standalone CLI and
      in-cluster components.
  project-history:
    - >
      Kubescape began as a Kubernetes-focused security scanner and expanded into a
      broader platform covering posture management, hardening, runtime security, image
      vulnerability scanning, admission control, and remediation workflows. Its
      repository describes coverage from development through runtime, including
      NSA-CISA, MITRE ATT&CK, and CIS benchmark-oriented checks.
    - >
      The CNCF project page records Kubescape's acceptance into CNCF on December 13,
      2022 and its move to Incubating maturity on January 13, 2025.
  related-projects:
    - >
      Related projects and integrations include Kubernetes, Helm, Krew, Grype,
      Copacetic, Inspektor Gadget, GitHub Actions, and CNCF security/compliance tooling.
  sources:
    - https://github.com/kubescape/kubescape
    - https://github.com/marketplace/actions/kubescape
    - https://kubescape.io/docs
    - https://kubescape.io/docs/install-cli/
    - https://www.cncf.io/projects/kubescape/
  summary:
    - >
      Kubescape is an open source Kubernetes security and compliance platform, created
      by ARMO and hosted as a CNCF project. The CLI scans clusters, Kubernetes YAML,
      Helm charts, repositories, container registries, and images for misconfigurations,
      vulnerabilities, and risk.
  timeline:
    - '2022: Kubescape was accepted to CNCF on December 13.'
    - '2025: Kubescape moved to CNCF Incubating maturity on January 13.'
  usage:
    - >
      The CLI is commonly used to scan a running Kubernetes cluster, scan local manifest
      directories, scan container images, list controls and frameworks, and integrate
      security checks into pull-request or CI pipelines.
related-packages:
  - id: brew:krew
    reason: >
      Krew installs Kubescape as a kubectl plugin, letting users run the scanner as
      kubectl kubescape within their existing cluster-management workflow.
    rel: adjacent_workflow
    sources:
      - https://kubescape.io/docs/install-cli/
      - https://sigs.k8s.io/krew/
category: security
package-manager:
  brew: kubescape
  macports: kubescape
  nix: kubescape
  scoop: main/kubescape
  winget: kubescape.kubescape
  zypper: kubescape
