id: brew:faad2
display-name: FAAD2
homepage: https://freewareadvancedaudio.github.io
repo: https://github.com/FreewareAdvancedAudio/faad2
docs:
  - https://sourceforge.net/projects/faac
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FAAD2 became a familiar low-level dependency for Unix audio stacks because it
      provides a standalone AAC decoder library plus the `faad` frontend. Its adoption
      story is typical of codec packages: quiet, long-lived, and maintained because many
      media workflows need reliable decoding of older and current AAC files.
  package-nerd-significance:
    - >
      FAAD2 matters to package maintainers because it sits at the uncomfortable
      intersection of old multimedia standards, GPL licensing, patent warnings, and
      security hardening. The recent changelog entries around fuzzing and CVE fixes are
      exactly the sort of maintenance that keeps legacy codec packages viable.
  project-history:
    - >
      The project comes from the early-2000s AAC tooling around FAAC/FAAD. Its README
      identifies FAAD2 as an HE, LC, MAIN, and LTP profile MPEG-2 and MPEG-4 AAC decoder
      with SBR support, and the copyright block credits M. Bakker and Nero AG for
      2003-2005 code.
    - >
      Later maintenance has focused less on new user-facing features and more on keeping
      a mature codec implementation buildable and safe. The changelog records DAB+
      support in 2.7, renewed build-system work in the 2.9 and 2.10 series, and a large
      2.11.0 cleanup with CMake, Bazel, CI, fuzzers, OSS-Fuzz integration, and many
      crash or CVE-related decoder fixes.
  related-projects:
    - >
      FAAC is the companion AAC encoder project historically distributed from the same
      SourceForge project area.
    - >
      FAAD2 is commonly compared with other media codec components that provide small
      command-line frontends over reusable C libraries.
  sources:
    - https://github.com/knik0/faad2/blob/master/README
    - https://github.com/knik0/faad2/blob/master/ChangeLog
    - https://github.com/knik0/faad2/blob/master/AUTHORS
    - https://sourceforge.net/projects/faac
  summary:
    - >
      FAAD2 is the Freeware Advanced Audio Decoder, a GPL-licensed AAC decoder with both
      a library and a small command-line frontend.
  timeline:
    - '2003-2005: Core FAAD2 copyright period credited to M. Bakker and Nero AG.'
    - '2009: FAAD2 2.7 adds DAB+ support.'
    - '2019: FAAD2 2.9.0 includes build cleanup and multiple CVE fixes.'
    - '2023: FAAD2 2.11.0 adds CMake, Bazel, CI, fuzzers, and broad decoder hardening.'
    - '2025: FAAD2 2.11.2 adds a BUILD_FAAD_CLI option and additional frontend fixes.'
  usage:
    - >
      Users normally encounter FAAD2 as the `faad` command or as libfaad linked by other
      media software. The source tree explicitly separates the command-line frontend,
      public include files, API docs, and decoder library, which is why distributions
      can package both executable and library use cases.
category: media
