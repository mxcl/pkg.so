id: brew:chicken
display-name: CHICKEN Scheme
homepage: https://www.call-cc.org/
repo: https://code.call-cc.org/git/chicken-core.git
docs:
  - https://wiki.call-cc.org/manual
  - https://wiki.call-cc.org/
config-file-location:
  unix: ~/.csirc
credentials-file-location: null
history:
  adoption-history:
    - >
      CHICKEN's adoption is tied to its practical build story: Scheme code becomes C,
      then a C compiler produces a standalone executable, making it easier to package
      and deploy than many pure interpreter workflows.
    - >
      The input package metadata lists Alpine, Homebrew, Debian/Ubuntu, Fedora,
      MacPorts, Arch, and openSUSE packages. Homebrew reported 28,712 trailing-365-day
      installs at research time.
  package-nerd-significance:
    - >
      CHICKEN is package-nerd-significant because it bridges Lisp/Scheme culture and
      Unix packaging: source goes to C, extensions are distributed as Eggs, and the
      runtime fits normal compiler/package-manager workflows.
    - >
      For package maintainers, CHICKEN's split between core compiler/interpreter tools
      and a large extension ecosystem makes it a classic language-runtime package rather
      than a single app.
  project-history:
    - >
      The official getting-started manual says CHICKEN combines an optimizing compiler
      with a reasonably fast interpreter, generates portable C, supports tail recursion,
      continuations, lightweight threads, and a flexible interface to C libraries.
    - >
      The same manual records that CHICKEN was developed by Felix L. Winkelmann from
      2000 through 2007, and that in early 2008 the community took over responsibility
      for development and maintenance while Winkelmann remained involved.
  related-projects:
    - >
      Eggs are CHICKEN's contributed extension/library ecosystem and are linked directly
      from the official homepage.
    - >
      CHICKEN sits in the Scheme implementation family alongside systems such as Chez
      Scheme and Chibi-Scheme, but its package identity is especially shaped by C output
      and the `csc`/`csi` workflow.
  sources:
    - https://www.call-cc.org/
    - https://wiki.call-cc.org/manual
    - https://wiki.call-cc.org/man/5/Getting%20started
    - https://wiki.call-cc.org/man/5/Using%20the%20interpreter
    - https://formulae.brew.sh/api/formula/chicken.json
  summary:
    - >
      CHICKEN is a Scheme implementation centered on a compiler that translates Scheme
      to portable C, plus an interpreter, extension library ecosystem, manual, wiki, and
      package tooling.
  timeline:
    - '2000: Felix L. Winkelmann began the development period described by the official manual.'
    - '2008: Community maintenance responsibility began, according to the official manual.'
    - '2026: Homebrew tracked CHICKEN 5.4.0 from the official call-cc.org release archive.'
  usage:
    - >
      The official homepage demonstrates both interpreted use with `csi -s
      hello-world.scm` and compiled use with `csc hello-world.scm`, then running the
      resulting executable.
    - >
      The manual documents `$HOME/.csirc` as an initialization file loaded before the
      read-eval-print loop unless disabled, which is the relevant user-level config
      file.
related-packages:
  - id: brew:chezscheme
    reason: >
      Choose Chez Scheme for an optimizing native-code compiler and whole-program
      optimization; choose CHICKEN when portable C output and Eggs are the better fit.
    rel: alternative
    sources:
      - https://cisco.github.io/ChezScheme/
      - https://www.call-cc.org/
  - id: brew:chibi-scheme
    reason: >
      Choose Chibi-Scheme for a compact dependency-free R7RS runtime designed for
      embedding, while CHICKEN better fits Scheme-to-C application builds and its Eggs
      workflow.
    rel: alternative
    sources:
      - https://synthcode.com/scheme/chibi/
      - https://wiki.call-cc.org/man/5/Getting%20started
category: language-runtime
package-manager:
  apk: chicken
  brew: chicken
  debian: chicken-bin
  dnf: chicken
  macports: chicken
  pacman: chicken
  ubuntu: chicken-bin
package-manager-url: https://formulae.brew.sh/formula/chicken
license: BSD-3-Clause
tags:
  - cli
  - compiler
  - interpreter
  - runtime
  - scheme
description: Compiler for the Scheme programming language
executables:
  - chicken
  - chicken-do
  - chicken-install
  - chicken-profile
  - chicken-status
  - chicken-uninstall
  - feathers
provenance:
  formula: chicken
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
