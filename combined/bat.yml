id: brew:bat
display-name: bat
homepage: https://github.com/sharkdp/bat
repo: https://github.com/sharkdp/bat
docs:
  - https://github.com/sharkdp/bat#readme
config-file-location:
  unix: /etc/bat/config
  windows: C:\ProgramData\bat\config
credentials-file-location: null
history:
  adoption-history:
    - >
      bat became one of the canonical modern Rust CLI replacements, helped by packaging
      across Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, Nix, MacPorts, Chocolatey,
      Scoop, winget, and other systems listed in the input metadata and upstream README.
    - >
      The README notes that Ubuntu has carried bat since 20.04 and Debian since
      Bullseye, with older Debian-family releases installing the executable as batcat
      because of a package-name clash. That rename became part of bat's package-manager
      lore.
    - >
      The repository's GitHub page showed roughly 59.5k stars and 43 releases at
      enrichment time, making bat far more than a niche wrapper.
  package-nerd-significance:
    - >
      bat is significant because it helped define the 2010s/2020s style of polished Rust
      command-line utilities: familiar Unix nouns, fast single binaries, colorful
      defaults, Git awareness, good package-manager coverage, and careful degradation in
      pipes.
    - >
      For package nerds, it is also a naming and policy specimen. The Debian/Ubuntu
      batcat period shows how a simple binary name can collide with existing packages,
      forcing downstream-visible aliases and workarounds even for a very popular tool.
    - >
      It matters culturally because many later CLI packages pitch themselves in the same
      grammar: a small classic Unix command, rebuilt with syntax awareness, colors, Git
      context, and modern ergonomics.
  project-history:
    - >
      bat's first GitHub release, v0.1.0, was published on April 22, 2018 as an initial
      release. The project describes itself as a cat(1) clone with syntax highlighting
      and Git integration, and its README states goals of advanced highlighting, Git
      integration, POSIX-cat replacement behavior, and a friendlier command-line
      interface.
    - >
      The tool has stayed in the familiar Unix-filter shape rather than becoming an
      editor. Its README documents both pretty terminal output and fallback behavior for
      non-interactive output, where bat acts as a drop-in cat-style concatenator.
    - >
      By the v0.25.0 release, bat was still adding practical terminal features such as
      squeeze-blank support, ANSI stripping, shell completions, theme behavior, and
      broader syntax handling, showing a mature utility polishing edge cases rather than
      changing identity.
  related-projects:
    - >
      bat-extras builds helper scripts around bat for ripgrep, man pages, diffs, and
      other terminal workflows.
    - delta is called out by bat's README as a related tool for richer git and diff support.
    - >
      fd, fzf, ripgrep, git, less, and tail are common tools bat is documented to
      integrate with.
  sources:
    - https://github.com/sharkdp/bat
    - https://github.com/sharkdp/bat/releases/tag/v0.1.0
    - https://github.com/sharkdp/bat/releases/tag/v0.25.0
    - source_facts.package-manager
  summary:
    - >
      bat is a Rust command-line file viewer that deliberately starts from cat(1) and
      adds syntax highlighting, Git modification markers, automatic paging, line
      numbers, and integration hooks for other terminal tools.
  timeline:
    - '2018: v0.1.0 initial release published on GitHub.'
    - '2020: README documents availability in Ubuntu 20.04 and later.'
    - '2021: README documents availability in Debian 11 Bullseye and later.'
    - >
      2025: v0.25.0 release adds polish such as squeeze-blank, ANSI-stripping, shell
      completions, and theme behavior.
    - '2025: Repository page lists v0.26.1 as the latest release on December 2, 2025.'
  usage:
    - >
      bat is commonly used directly as `bat FILE`, as a pager-backed file viewer, as a
      syntax-colored stdin renderer, as a git-aware diff context viewer, and as a cat
      replacement when invoked in non-interactive pipelines.
    - >
      The README documents integrations with fzf previews, find or fd, ripgrep through
      batgrep, tail -f log viewing, git show, git diff helpers, and clipboard workflows
      where plain output matters.
related-packages:
  - id: brew:bat-extras
    reason: >
      Install bat-extras when you want maintained scripts that embed bat into man-page,
      ripgrep, Git-diff, file-watching, and formatting workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/sharkdp/bat#integration-with-other-tools
      - https://github.com/eth-p/bat-extras
  - id: brew:fzf
    reason: >
      Use fzf with bat's forced-color and line-range options to add syntax-highlighted
      file previews to interactive fuzzy selection.
    rel: adjacent_workflow
    sources:
      - https://github.com/sharkdp/bat#fzf
      - https://github.com/junegunn/fzf#preview-window
  - id: brew:fd
    reason: >
      Use fd's batch execution option to discover files and pass the resulting paths
      directly to bat for highlighted viewing.
    rel: adjacent_workflow
    sources:
      - https://github.com/sharkdp/bat#find-or-fd
      - https://github.com/sharkdp/fd
  - id: brew:ripgrep
    reason: >
      Combine ripgrep with batgrep from bat-extras when you want fast recursive search
      results rendered with bat's syntax highlighting and context.
    rel: adjacent_workflow
    sources:
      - https://github.com/sharkdp/bat#ripgrep
      - https://github.com/BurntSushi/ripgrep
category: developer-tools
package-manager:
  apk: bat
  brew: bat
  chocolatey: Bat
  debian: bat
  dnf: bat
  macports: bat
  nix: bat
  pacman: bat
  scoop: main/bat
  ubuntu: bat
  winget: sharkdp.bat
  zypper: bat
package-manager-url: https://formulae.brew.sh/formula/bat
license: Apache-2.0 OR MIT
tags:
  - cat
  - cli
  - git
  - pager
  - syntax-highlighting
description: Clone of cat(1) with syntax highlighting and Git integration
executables:
  - bat
provenance:
  formula: bat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
