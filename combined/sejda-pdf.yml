history:
  adoption-history:
    - >
      Sejda Desktop broadened the Sejda toolset from browser-based processing to an
      installable cross-platform application for users whose documents could not leave
      their machines or networks. It later became available for macOS, Windows, Linux,
      and supported Chromebook Linux environments.
    - >
      The desktop application is offered with daily free limits and paid plans, while
      enterprise deployment material emphasizes pre-activated volume licensing and
      compatibility with shared Windows environments.
  package-nerd-significance:
    - >
      Sejda PDF Desktop packages a broad web-style PDF toolbox as a local application.
      Its main appeal to privacy-conscious package users is that document processing
      occurs on the computer rather than requiring uploads to Sejda's servers.
  project-history:
    - >
      Sejda originated as a PDF toolset backed by an open-source processing engine and
      exposed through an online service. In January 2016, the project introduced Sejda
      Desktop for on-premises and offline processing of confidential documents.
    - >
      The desktop product retained the web service's task-oriented interface while
      growing into a cross-platform suite for editing, merging, splitting, converting,
      compressing, protecting, OCR-processing, and automating PDF documents.
  related-projects:
    - >
      Sejda Web provides browser-based versions of the PDF tools and processes uploaded
      files on Sejda's servers.
    - Sejda Desktop uses the same task-oriented product family while processing files locally.
    - >
      The official Sejda blog describes the wider product as powered by an open-source
      PDF engine.
  sources:
    - https://www.sejda.com/blog/
    - https://www.sejda.com/blog/tagged/sejda%20desktop
    - https://www.sejda.com/en/desktop
    - https://www.sejda.com/en/help
    - https://www.sejda.com/en/index.html
  summary:
    - >
      Sejda PDF Desktop is the locally installed edition of Sejda's PDF toolkit,
      providing offline document editing, conversion, organization, compression, OCR,
      and security operations.
  timeline:
    - 'January 2016: Sejda introduced Sejda Desktop for on-premises PDF processing.'
    - >
      2017: Sejda's official release notes documented continued expansion of repair,
      watermark, compression, conversion, and signing tools.
    - >
      Cross-platform era: Desktop packages became available for macOS, Windows, and
      major Linux package formats, with Chromebook installation through its Linux
      environment.
  usage:
    - >
      Users open or select local documents, choose a focused task such as edit, merge,
      split, compress, convert, OCR, protect, or watermark, configure the operation, and
      save the resulting file. Desktop processing keeps the document on the local
      computer, unlike Sejda Web's server-based workflow.
