id: brew:mysql-client@9.7
display-name: MySQL Client 9.7
homepage: https://github.com/mysql/mysql-server
repo: https://github.com/mysql/mysql-server
docs:
  - https://dev.mysql.com/doc/refman/9.7/en
  - https://dev.mysql.com/doc/refman/9.7/en/mysql-config-editor.html
  - https://dev.mysql.com/doc/refman/9.7/en/option-files.html
  - https://dev.mysql.com/doc/refman/9.7/en/programs-client.html
config-file-location:
  unix:
    - /etc/my.cnf
    - /etc/mysql/my.cnf
    - SYSCONFDIR/my.cnf
    - ~/.my.cnf
  windows:
    - '%WINDIR%\my.ini'
    - '%WINDIR%\my.cnf'
    - C:\my.ini
    - C:\my.cnf
    - BASEDIR\my.ini
    - BASEDIR\my.cnf
credentials-file-location:
  unix: ~/.mylogin.cnf
  windows: '%APPDATA%\MySQL\.mylogin.cnf'
history:
  adoption-history:
    - >
      MySQL became a foundational relational database of the web era and is packaged
      across major operating-system and language ecosystems. The client-only package is
      useful where administrators, developers, and automation need connectivity and
      maintenance tools without a local server daemon.
  package-nerd-significance:
    - >
      Client/server package separation avoids installing and operating a database daemon
      on machines that only need `mysql`, `mysqldump`, administrative utilities,
      headers, or build metadata. Versioned Homebrew formulae also let users target a
      specific innovation-series client.
  project-history:
    - >
      MySQL was founded in 1995 and developed into a widely deployed open-source
      relational database. It later became part of Sun Microsystems and then Oracle.
      Oracle continues development of the server and its companion client utilities.
  related-projects:
    - >
      MySQL Server is the corresponding database service. MariaDB is a related
      MySQL-compatible database commonly supplied under MySQL-oriented package names by
      some distributions.
  sources:
    - https://dev.mysql.com/doc/refman/9.7/en/
    - https://github.com/mysql/mysql-server
    - https://www.mysql.com/news-and-events/events/mysql-30th/
  summary:
    - >
      This Homebrew formula packages the MySQL 9.7 command-line client and
      administrative toolset without the complete local server installation.
  timeline:
    - '1995: MySQL was founded.'
    - '2008: Sun Microsystems acquired MySQL AB.'
    - "2010: Oracle acquired Sun Microsystems and became MySQL's steward."
    - >
      2026: The versioned 9.7 client formula provides MySQL's innovation-series client
      utilities.
  usage:
    - >
      Common uses include interactive SQL sessions with `mysql`, logical backups with
      `mysqldump`, server administration with `mysqladmin`, imports, checks, binlog
      inspection, and compiling software through `mysql_config`. Connection profiles can
      be stored with `mysql_config_editor`.
related-packages:
  - id: brew:mycli
    reason: >
      Choose mycli for interactive MySQL work when context-sensitive completion, syntax
      highlighting and richer terminal ergonomics matter more than using Oracle's
      reference client.
    rel: alternative
    sources:
      - https://www.mycli.net/docs
      - https://github.com/dbcli/mycli
      - https://formulae.brew.sh/formula/mycli
  - id: brew:mysql
    reason: >
      Install the full MySQL package when this client toolbox must be paired with a
      locally operated MySQL server daemon.
    rel: adjacent_workflow
    sources:
      - https://dev.mysql.com/doc/refman/9.7/en/programs.html
      - https://dev.mysql.com/doc/refman/8.4/en/what-is-mysql.html
      - https://formulae.brew.sh/formula/mysql
category: data
package-manager:
  apk: mysql
  brew: mysql-client@9.7
  chocolatey: mysql
  debian: libmysql++-dev
  dnf: mysql
  pacman: mariadb
  scoop: main/mysql
  ubuntu: libmysql++-dev
  winget: Oracle.MySQL
  zypper: mariadb
package-manager-url: https://formulae.brew.sh/formula/mysql-client@9.7
license: GPL-2.0-only WITH Universal-FOSS-exception-1.0
tags:
  - administration
  - backup
  - cli
  - database-client
  - mysql
  - relational-database
  - sql
description: Open source relational database management system
executables:
  - comp_err
  - my_print_defaults
  - mysql
  - mysql_config
  - mysql_config_editor
  - mysql_migrate_keyring
  - mysql_secure_installation
  - mysqladmin
  - mysqlbinlog
  - mysqlcheck
  - mysqldump
  - mysqlimport
  - mysqlshow
  - mysqlslap
  - mysqltest
  - perror
provenance:
  formula: mysql-client@9.7
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
