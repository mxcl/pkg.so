id: brew:feishu2md
display-name: feishu2md
homepage: https://github.com/Wsine/feishu2md
repo: https://github.com/Wsine/feishu2md
docs:
  - https://github.com/Wsine/feishu2md#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/feishu2md/config.json
    - ~/.config/feishu2md/config.json
  macos: ~/Library/Application Support/feishu2md/config.json
  windows: '%AppData%\feishu2md\config.json'
credentials-file-location:
  linux:
    - $XDG_CONFIG_HOME/feishu2md/config.json
    - ~/.config/feishu2md/config.json
  macos: ~/Library/Application Support/feishu2md/config.json
  windows: '%AppData%\feishu2md\config.json'
history:
  adoption-history:
    - >
      Official distribution is centered on GitHub releases, a Docker image, and the
      Homebrew formula listed in the package-manager metadata. Its adoption is naturally
      niche because it depends on Feishu/Lark Open API credentials and document
      permissions.
  package-nerd-significance:
    - >
      For package maintainers, feishu2md is a small example of a SaaS-export CLI: it
      wraps a vendor API, stores credentials locally, ships cross-platform binaries, and
      gives users a reproducible way to pull cloud documents into plain-text
      repositories.
  project-history:
    - >
      The official README describes the project as a Go implementation for downloading
      Feishu documents as Markdown. It also states that the original author no longer
      uses Feishu documents and that the project has moved to community maintenance,
      with maintainers invited through pull requests.
    - >
      The README documents a split between the current v2 workflow for newer Feishu
      documents and an archived v1 support branch for older document support, with
      v1.4.0 identified as the old-document archive.
  related-projects:
    - The README thanks chyroc/lark and chyroc/lark_docs_md as related Feishu/Lark tooling.
  sources:
    - https://github.com/Wsine/feishu2md
    - https://raw.githubusercontent.com/Wsine/feishu2md/main/README.md
    - https://github.com/Wsine/feishu2md/releases
  summary:
    - >
      feishu2md is a Go command-line and Docker-distributed utility for exporting Feishu
      or Lark documents to Markdown.
  timeline:
    - '2022: v1.0.0 release published on GitHub.'
    - '2024: v2 releases document the transition to the newer Feishu document API.'
    - '2025: v2.4.5 released on 2025-04-08.'
  usage:
    - >
      Users create a Feishu/Lark self-built app, grant document, media, drive, and wiki
      read permissions, then store the App ID and App Secret through the tool's config
      command. The CLI downloads a single document, a folder, or a wiki to Markdown; the
      Docker mode exposes a small web service for pasting document links.
related-packages: []
category: productivity
package-manager:
  brew: feishu2md
package-manager-url: https://formulae.brew.sh/formula/feishu2md
license: MIT
tags:
  - cli
  - document-export
  - feishu
  - lark
  - markdown
description: Convert feishu/larksuite documents to markdown
executables:
  - feishu2md
provenance:
  formula: feishu2md
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
