id: brew:ksh93
display-name: KornShell 93
homepage: https://github.com/ksh93/ksh
repo: https://github.com/ksh93/ksh
docs:
  - https://github.com/ksh93/ksh#readme
config-file-location:
  unix:
    - /etc/profile
    - ~/.profile
    - $ENV
credentials-file-location: null
history:
  adoption-history:
    - >
      KornShell has long been part of commercial and open Unix culture, especially where
      POSIX shell compatibility, stronger scripting features, and historical vendor
      scripts mattered. The 93u+m README notes that Debian and Slackware began packaging
      93u+m as their default ksh93 version in late 2021, marking the community fork's
      transition from preservation project to distro-consumed shell.
  package-nerd-significance:
    - >
      ksh93 is package-nerd significant because it is not just another shell binary: it
      is a maintained survival path for AT&T AST code, legacy KornShell scripts, POSIX
      conformance work, and old Unix assumptions that still surface in modern
      distributions.
  project-history:
    - >
      The ksh93 README republishes the 1993 AT&T description of KSH-93 as the version of
      the KornShell language described in The KornShell Command and Programming
      Language, compatible with Bourne shell scripts and intended to conform to the IEEE
      POSIX shell and utilities standard. That lineage made ksh93 both a production Unix
      shell and a language-runtime package with features beyond traditional sh.
    - >
      The ksh93/ksh project began as a community reboot from AT&T AST sources after an
      attempted 2017-2020 ksh2020 refactoring effort was abandoned. The maintainers
      chose the older stable 93u+ code as the base and backported fixes from ksh2020,
      distribution patches from OpenSUSE, Red Hat, and Solaris, and new community fixes.
  related-projects:
    - >
      Related projects and lineages include the Bourne shell, POSIX sh, KSH-88, AT&T
      AST, ksh2020, bash, and zsh.
  sources:
    - https://github.com/ksh93/ksh
    - https://github.com/ksh93/ksh/releases
    - https://www.kornshell.com/
  summary:
    - >
      KornShell 93 is the KSH-93 line of David Korn's KornShell language, carried
      forward as a Unix shell, scripting language, and POSIX-oriented command
      environment. The Homebrew ksh93 package points at the community 93u+m
      continuation, which is based on AT&T's last stable 93u+ release dated 2012-08-01.
  timeline:
    - >
      1993: AT&T described KSH-93 as the KornShell language release aligned with the
      POSIX shell and utilities standard.
    - >
      2012-08-01: AT&T's stable ksh93u+ release became the base for the later 93u+m
      community reboot.
    - >
      2017-2020: The ksh2020 refactoring attempt tried to revive the unstable 93v- beta
      line and was later abandoned.
    - >
      Late 2021: Debian and Slackware began packaging ksh 93u+m as their default ksh93
      version.
  usage:
    - >
      Users run ksh93 as an interactive shell, as a /bin/sh-compatible scripting engine,
      and through related tools such as rksh and shcomp. It matters most where
      shell-language compatibility, arithmetic and scripting features, or existing ksh
      scripts are more important than using bash or zsh.
related-packages:
  - id: brew:mksh
    reason: >
      mksh is another maintained Korn-shell-family interpreter derived from the pdksh
      lineage; choose it for MirBSD's smaller, actively portable implementation rather
      than strict ksh93 lineage compatibility.
    rel: alternative
    sources:
      - https://github.com/ksh93/ksh
      - https://mbsd.evolvis.org/mksh.htm
  - id: brew:bash
    reason: >
      Bash is a Bourne-family command and scripting shell with broader GNU/Linux default
      deployment; choose ksh93 when KornShell-specific language compatibility is
      required.
    rel: alternative
    sources:
      - https://github.com/ksh93/ksh
      - https://www.gnu.org/software/bash/manual/bash.html
category: language-runtime
package-manager:
  brew: ksh93
  debian: ksh
  dnf: ksh
  macports: ksh93
  nix: ksh
  pacman: ksh
  ubuntu: ksh
  zypper: ksh
package-manager-url: https://formulae.brew.sh/formula/ksh93
license: EPL-2.0
tags:
  - cli
  - command-language
  - scripting
  - shell
  - unix
description: KornShell, ksh93
executables:
  - ksh
  - ksh93
  - rksh
  - rksh93
  - shcomp
provenance:
  formula: ksh93
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
