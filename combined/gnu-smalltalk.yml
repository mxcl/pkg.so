id: brew:gnu-smalltalk
display-name: GNU Smalltalk
homepage: https://www.gnu.org/software/smalltalk/
repo: https://git.savannah.gnu.org/cgit/smalltalk.git
docs:
  - https://www.gnu.org/software/smalltalk/manual/html_node
config-file-location:
  unix:
    - ~/.st/pre.st
    - ~/.st/init.st
    - ~/.st/kernel/
    - ~/.st/packages.xml
    - /usr/local/share/smalltalk/site-pre.st
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Smalltalk gave GNU and Unix users a free Smalltalk system that could be driven
      from text files and shell workflows. Its positioning made it approachable for
      scripting, rapid prototyping, generated documentation, and experiments with
      object-oriented programming outside traditional commercial Smalltalk environments.
  package-nerd-significance:
    - >
      GNU Smalltalk is significant as a language-runtime package because it turns a
      historically GUI-associated language into a Unix-style interpreter and tool suite.
      Its many executables, package tooling, and class-library documentation make it
      feel closer to a developer environment than a single compiler binary.
  project-history:
    - >
      The GNU Smalltalk manual says the implementation closely follows the Smalltalk-80
      language described in the Blue Book by Adele Goldberg and David Robson. Project
      author records credit Steve Byrne for development up to version 1.1.5 and Paolo
      Bonzini for development starting with version 1.6, with later GUI work around BLOX
      and VisualGST.
  related-projects:
    - >
      GNU Smalltalk is related to Smalltalk-80, VisualGST, BLOX, SUnit, and the broader
      family of free Smalltalk systems such as Squeak and Pharo.
  sources:
    - https://github.com/gnu-smalltalk/smalltalk
    - https://raw.githubusercontent.com/gnu-smalltalk/smalltalk/master/AUTHORS
    - https://www.gnu.org/software/smalltalk/
    - https://www.gnu.org/software/smalltalk/manual/html_node/Overview.html
  summary:
    - >
      GNU Smalltalk is the GNU Project's implementation of the Smalltalk-80 language,
      shaped for Unix-like command-line use, scripting, and headless processing rather
      than only an image-centered graphical environment.
  timeline:
    - >
      1988: Source copyright years in GNU Smalltalk files begin around the early
      implementation era.
    - "Version 1.1.5: Author records mark the end of Steve Byrne's initial development period."
    - >
      Version 1.6: Author records credit Paolo Bonzini with development from this
      release line onward.
    - "2017: GNU Smalltalk user's manual was updated for the published manual set."
  usage:
    - >
      Practitioners use gst and companion tools to run Smalltalk source files, explore
      the class library, write scripts, load packages, test code with SUnit, and bridge
      Smalltalk programs with C and other free software libraries. The manual emphasizes
      using Smalltalk's object model for script-like programs as well as larger
      prototypes.
related-packages:
  - id: cask:squeak
    reason: >
      Choose Squeak for a graphical, live Smalltalk environment centered on Morphic and
      interactive development; choose GNU Smalltalk when command-line scripting and
      headless processing are the priority.
    rel: alternative
    sources:
      - https://squeak.org/
      - https://www.gnu.org/software/smalltalk/manual/html_node/Overview.html
category: language-runtime
package-manager:
  brew: gnu-smalltalk
  dnf: gst
  macports: gst
  nix: gnu-smalltalk
package-manager-url: https://formulae.brew.sh/formula/gnu-smalltalk
license: GPL-2.0-or-later
tags:
  - class-library
  - cli
  - interpreter
  - scripting
  - smalltalk
  - virtual-machine
description: Implementation of the Smalltalk language
executables:
  - gst
  - gst-blox
  - gst-browser
  - gst-config
  - gst-convert
  - gst-doc
  - gst-load
  - gst-package
  - gst-profile
  - gst-reload
  - gst-remote
  - gst-sunit
provenance:
  formula: gnu-smalltalk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
