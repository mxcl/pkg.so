id: cask:beyond-compare
display-name: Beyond Compare
homepage: https://www.scootersoftware.com/
repo: null
docs:
  - https://www.scootersoftware.com/kb/vcs_osx
  - https://www.scootersoftware.com/v5help
  - https://www.scootersoftware.com/v5help/where_settings_are_stored.html
config-file-location:
  macos:
    - ~/Library/Application Support/Beyond Compare
    - ~/Library/Application Support/Beyond Compare 5
credentials-file-location:
  macos: /etc/BC5Key.txt
history:
  adoption-history:
    - >
      Scooter Software reports more than one million users worldwide, ranging from
      individual developers to Fortune 500 personnel. The official timeline records its
      300,000th order in 2015, 400,000th in 2017, 500,000th in 2020, and 600,000th in
      2024.
  package-nerd-significance:
    - >
      Beyond Compare is a veteran proprietary alternative to command-line diff and merge
      tools. Package and source-control users value its specialized viewers, persistent
      comparison sessions, directory synchronization, three-way merging, and documented
      integration with Git and other version-control clients.
    - >
      Its longevity across Windows, macOS, and Linux, plus continued technical support
      for every released major version, makes it a notable example of durable commercial
      developer tooling.
  project-history:
    - >
      Beyond Compare 1.0 was released by Scooter Software on June 26, 1996, initially
      through CompuServe. The product began on Windows and evolved from file comparison
      into a multi-platform environment for comparing, merging, and synchronizing files,
      folders, tables, images, archives, and remote data.
    - >
      Major version 2 arrived in 2002, version 3 in 2008, and version 4 in 2014. Version
      4 brought macOS support and later 64-bit support; its macOS implementation
      received an extensive rewrite in 2019. Version 5 launched in 2024 with dark mode,
      text-view word wrapping, and a redesigned Table Compare.
  related-projects:
    - >
      Git, Subversion, Mercurial, Perforce, and numerous graphical version-control
      clients can invoke Beyond Compare as an external diff or merge tool.
    - >
      Scooter Software also publishes integration components such as its Beyond Compare
      extension for Visual Studio Code, but those are separate from the proprietary core
      application.
  sources:
    - https://www.scootersoftware.com/about/ — official company and adoption information.
    - >
      https://www.scootersoftware.com/kb/lifecycle — official major-version release
      dates and support policy.
    - >
      https://www.scootersoftware.com/kb/vcs_osx — official macOS version-control
      integration instructions.
    - https://www.scootersoftware.com/timeline/ — official company and release timeline.
    - https://www.scootersoftware.com/v5help/ — official usage documentation.
  summary:
    - >
      Beyond Compare is Scooter Software's cross-platform graphical utility for
      comparing, merging, and synchronizing files and folders. First released in 1996,
      it has become a widely used commercial companion to source-control, deployment,
      backup, and data-review workflows.
  timeline:
    - '1996-06-26: Beyond Compare 1.0 released on CompuServe.'
    - '2002-05-13: Beyond Compare 2 initially released.'
    - '2008-07-30: Beyond Compare 3 initially released.'
    - '2014-09-01: Beyond Compare 4 initially released.'
    - '2019-10-09: Version 4.3 shipped with an extensive macOS rewrite.'
    - '2024-07-08: Beyond Compare 5 launched.'
  usage:
    - >
      Developers commonly configure Beyond Compare as Git's external `difftool` or
      `mergetool`; the Pro edition supports three-way merging. Other uses include
      reviewing directory trees, synchronizing local or remote folders, validating
      copies, and comparing structured tables or images.
    - >
      Beyond Compare retains named sessions and comparison rules. Settings can be
      exported as a `.bcpkg` package for transfer, backup, or sharing.
category: developer-tools
