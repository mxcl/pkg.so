id: brew:djlint
display-name: djLint
homepage: https://djlint.com
repo: https://github.com/djlint/djLint
docs:
  - https://djlint.com/docs/configuration
  - https://djlint.com/docs/getting-started
config-file-location:
  unix:
    - pyproject.toml
    - djlint.toml
    - .djlint.toml
    - .djlintrc
credentials-file-location: null
history:
  adoption-history:
    - >
      djLint adoption is visible in its packaging spread: the official README documents
      PyPI, Homebrew, npm experimental installation, and pre-commit hooks. That mix fits
      web teams that want the same tool in Python environments, JavaScript-heavy
      repositories, and system package managers.
    - >
      The official release metadata shows continued activity through the mid-2020s,
      including the 1.36 series in 2024 and the 1.39 series in 2026. The project also
      advertises downloads and community links from the README, signaling that it had
      moved beyond a one-off formatter experiment.
  package-nerd-significance:
    - >
      djLint matters to package nerds because it packages a messy cross-template problem
      into one CLI while still fitting Python, npm, Homebrew, and pre-commit ecosystems.
      It also sits next to smaller tools like DjHTML, making the template-formatting
      space unusually visible in package-manager catalogs.
  project-history:
    - >
      The official repository was created in July 2021 and describes djLint as a
      formatter and linter for HTML templates. The README frames the project as a
      response to template files being left out while many programming languages already
      had standard formatters and linters.
    - >
      The project grew around both formatting and linting modes: users can lint, check
      formatting, reformat, run pre-commit hooks, and configure behavior through
      `pyproject.toml`, `djlint.toml`, `.djlint.toml`, or `.djlintrc`. The official docs
      and README also show multilingual documentation and integrations as part of the
      public surface.
  related-projects:
    - >
      Related projects include DjHTML for indentation-only Django and Jinja templates,
      HTMLHint for HTML linting, curlylint for template linting, Black as a
      formatting-culture reference point, and pre-commit for hook-based adoption.
  sources:
    - https://github.com/djlint/djLint
    - https://raw.githubusercontent.com/djlint/djLint/master/README.md
    - https://djlint.com/docs/getting-started/
    - https://djlint.com/docs/configuration/
    - https://api.github.com/repos/djlint/djLint
    - https://api.github.com/repos/djlint/djLint/releases?per_page=12
  summary:
    - >
      djLint is an HTML template linter and formatter for Django, Jinja, Nunjucks, Twig,
      Handlebars, Mustache, Go templates, Angular, and related template syntaxes. It
      fills the gap between generic HTML tooling and framework-aware template code that
      contains tags ordinary HTML formatters do not understand.
  timeline:
    - '2021-07-12: Official GitHub repository created.'
    - '2024-12-24: v1.36.4 release published.'
    - '2026-06-04: v1.37.0 and v1.38.0 releases published.'
    - '2026-06-30: v1.39.6 release published.'
  usage:
    - >
      Typical use is `djlint . --lint`, `djlint . --check`, or `djlint . --reformat`,
      often with an explicit template extension such as `html.j2`. Teams put options in
      project config files and use pre-commit hooks for automatic reformatting and lint
      checks.
related-packages:
  - id: brew:djhtml
    reason: >
      Choose DjHTML when you want conservative indentation-only changes for Django or
      Jinja templates; keep djLint when lint rules, structural formatting, or broader
      template-language support are required.
    rel: alternative
    sources:
      - https://djlint.com/docs/getting-started/
      - https://raw.githubusercontent.com/rtts/djhtml/main/README.md
  - id: brew:pre-commit
    reason: >
      djLint provides profile-specific pre-commit hooks for both linting and
      reformatting templates automatically before changes are committed.
    rel: adjacent_workflow
    sources:
      - https://djlint.com/docs/integrations/
      - https://pre-commit.com/
category: developer-tools
package-manager:
  brew: djlint
  nix: djlint
package-manager-url: https://formulae.brew.sh/formula/djlint
license: GPL-3.0-or-later
tags:
  - cli
  - django
  - formatter
  - handlebars
  - html
  - jinja
  - linter
  - nunjucks
  - templates
description: Lint & Format HTML Templates
executables:
  - djlint
provenance:
  formula: djlint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
