history:
  adoption-history:
    - >
      CleanApp served users of older OS X and macOS releases who wanted an application
      uninstaller and maintenance utility with logging that could identify related
      files. Synium continued to offer legacy downloads for several major generations
      after active development ended.
    - >
      Its usefulness declined as macOS increasingly restricted third-party access to
      protected directories. Synium states that the loss of filesystem access reduced
      functionality with successive macOS updates and that Big Sur marked the practical
      end of the application.
  package-nerd-significance:
    - >
      CleanApp belongs to the older generation of Mac uninstallers that attempted to
      track application activity and remove associated support files rather than merely
      deleting an application bundle. Its discontinuation illustrates how sandboxing,
      sealed system volumes, and tighter filesystem permissions changed what
      system-cleaning utilities could do on macOS.
    - >
      For package collectors, the cask is mainly relevant to legacy systems: Synium's
      archived builds cover several distinct OS X compatibility eras, but the developer
      recommends removing CleanApp on modern macOS.
  project-history:
    - >
      CleanApp was a macOS application-removal and system-maintenance utility from
      Synium Software. Multiple generations were produced for changing OS X releases,
      including CleanApp 3, 4, and 5.
    - >
      Synium discontinued the product after macOS security changes increasingly blocked
      the broad filesystem access on which its maintenance and logging features
      depended. The company identifies macOS Big Sur as the endpoint and does not offer
      a replacement.
  related-projects:
    - >
      macOS Storage Management is Synium's recommended built-in alternative for users of
      current systems.
    - >
      Other Synium applications remain available, but Synium states that there is no
      direct CleanApp replacement.
  sources:
    - >
      Official discontinuation explanation:
      https://www.syniumsoftware.com/en/support-article/why-is-cleanapp-no-longer-running-on-most-recent-macos-versions
    - 'Official legacy downloads: https://www.syniumsoftware.com/downloads'
  summary:
    - >
      CleanApp was Synium Software's macOS uninstaller and maintenance utility. It is
      now discontinued because modern macOS protections prevent the broad read/write
      access its cleanup and logging model required.
  timeline:
    - 'CleanApp 3: Supported OS X 10.4 through 10.6.'
    - 'CleanApp 4: Supported OS X 10.6 through 10.10.'
    - 'CleanApp 5: Supported OS X 10.8 through 10.14.'
    - '2020: macOS Big Sur marked the end of practical compatibility, according to Synium.'
    - 'Later: Synium discontinued sales and recommends removing CleanApp from modern Macs.'
  usage:
    - >
      On compatible legacy Macs, CleanApp was used to uninstall applications and
      identify or remove associated files, aided by an optional activity-logging
      database.
    - >
      Synium advises current macOS users to use the operating system's built-in
      storage-management features instead. The developer's support article mentions a
      logging database under the user's Library/Application Support area but does not
      publish a precise configuration-file or credentials-file path.
