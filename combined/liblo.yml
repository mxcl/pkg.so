id: brew:liblo
display-name: liblo
homepage: https://liblo.sourceforge.net/
repo: https://github.com/radarsat1/liblo
docs:
  - https://liblo.sourceforge.net/docs
  - https://liblo.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      liblo's adoption is tied to OSC itself, a protocol used among computers, sound
      synthesizers, multimedia devices, and interactive control surfaces. Its small C
      API, C++ wrapper, and CLI tools made it easy for Unix audio software and scripting
      workflows to exchange OSC messages.
    - >
      Package-manager metadata in this batch lists liblo across Homebrew, Debian,
      Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE, which matches a library used by
      cross-platform creative-coding and audio stacks.
  package-nerd-significance:
    - >
      liblo is significant because it turns OSC from a multimedia protocol spec into a
      tiny linkable Unix library plus inspectable CLI tools. It is the sort of package
      that quietly enables live-coding, synth control, media installations, and test
      rigs.
  project-history:
    - >
      The liblo homepage says the project was started by Steve Harris and later
      maintained by Stephen Sinclair. Its early release notes describe it as an ANSI C
      implementation intended to make OSC application development easy.
    - >
      Release notes show public releases at least as far back as 0.13 on October 19,
      2004. The 0.25 release on July 18, 2008 added oscsend and oscdump command-line
      tools, broadcast support, multicast support, and message deserialization. The 0.26
      release on March 7, 2009 changed the license to LGPL 2.1 or later after requests
      for use in non-GPL software.
    - >
      The project moved through SourceForge hosting and GitHub development. The homepage
      states that GitHub is preferred for active development, with the SourceForge git
      repository kept synchronized manually and used for web hosting.
  related-projects:
    - Open Sound Control is the protocol liblo implements.
    - >
      The liblo homepage lists related bindings and modules including Net::LibLO,
      pyliblo, and aiolo.
  sources:
    - https://api.github.com/repos/radarsat1/liblo
    - https://github.com/radarsat1/liblo
    - https://liblo.sourceforge.net/
    - https://liblo.sourceforge.net/NEWS.html
    - https://opensoundcontrol.stanford.edu/
  summary:
    - >
      liblo, the Lite OSC library, is a lightweight C implementation of Open Sound
      Control for POSIX systems. It is most relevant to audio, music, media-art, and
      interactive systems that need to send and receive OSC messages over modern network
      transports.
  timeline:
    - '2004: Release 0.13 announced on October 19, 2004.'
    - '2008: Release 0.25 added oscsend and oscdump.'
    - '2009: Release 0.26 changed liblo to LGPL 2.1 or later.'
    - '2013: Release 0.27 added major bundle, multicast, TCP, and Unix-socket improvements.'
    - '2024: Release 0.32 added OSC path validation and CMake improvements.'
    - '2026: Releases 0.35 and 0.36 were published on April 30, 2026.'
  usage:
    - >
      Typical command-line use centers on oscsend for emitting OSC messages and oscdump
      for inspecting received traffic. Library users create OSC addresses, servers,
      messages, bundles, and method handlers through the C API or C++ wrapper.
related-packages:
  - id: cask:supercollider
    reason: >
      Use liblo's OSC tools or API to control and inspect SuperCollider systems, whose
      client and audio server officially communicate through OSC over TCP or UDP.
    rel: adjacent_workflow
    sources:
      - https://liblo.sourceforge.net/docs/
      - https://docs.supercollider.online/Guides/ClientVsServer.html
