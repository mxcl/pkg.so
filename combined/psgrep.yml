id: brew:psgrep
display-name: psgrep
homepage: https://jvz.github.io/psgrep/
repo: https://github.com/jvz/psgrep
docs:
  - https://jvz.github.io/psgrep
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project site documents manual installation and creation of local packages with
      checkinstall. source_facts.package-manager also records Homebrew availability.
  package-nerd-significance:
    - >
      It illustrates the Unix practice of packaging a recurring shell pipeline as a
      small executable with an installer and manual page.
  project-history:
    - >
      Published under the jvz account, psgrep packages the familiar process-listing and
      grep pipeline into a dedicated shell command.
  related-projects:
    - >
      ps and grep provide the underlying workflow; checkinstall is documented as an
      optional packaging tool.
  sources:
    - '[Official project site](https://jvz.github.io/psgrep/)'
    - '[Official repository and releases](https://github.com/jvz/psgrep)'
    - source_facts.package-manager
  summary:
    - psgrep is a shell utility that simplifies searching process listings.
  timeline:
    - '2016: Release 1.0.9 was published on August 5.'
  usage:
    - >
      Use psgrep for the process-search workflow ordinarily expressed as ps aux piped
      into grep. Consult its installed manual for command options.
category: system
package-manager:
  brew: psgrep
package-manager-url: https://formulae.brew.sh/formula/psgrep
license: GPL-3.0-or-later
tags:
  - cli
  - grep
  - processes
  - shell
  - system-utility
description: Shortcut for the 'ps aux | grep' idiom
executables:
  - psgrep
provenance:
  formula: psgrep
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
