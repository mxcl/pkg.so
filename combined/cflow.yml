id: brew:cflow
display-name: GNU cflow
homepage: https://www.gnu.org/software/cflow/
repo: https://git.savannah.gnu.org/cgit/cflow.git
docs:
  - https://www.gnu.org/software/cflow/manual
  - https://www.gnu.org/software/cflow
config-file-location:
  unix:
    - ~/.cflow.d/*.cfo
    - ~/.cflow.d/default.cfo
    - /usr/share/cflow/site-init/*.cfo
    - /usr/share/cflow/site-init/1.8/*.cfo
    - /usr/local/share/cflow/site-init/*.cfo
    - /usr/local/share/cflow/site-init/1.8/*.cfo
    - $CFLOWRC
    - ~/.cflowrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts show cflow packaged in Homebrew, Alpine, Debian/Ubuntu,
      Fedora, MacPorts, Nix, openSUSE, and other Unix-like package ecosystems.
  package-nerd-significance:
    - >
      GNU cflow is a classic small GNU utility: old-school source inspection, text
      output, manual pages, init files, and broad distro packaging without a large
      service footprint.
  project-history:
    - >
      The official GNU project page and manual are the primary documentation surfaces,
      and the official source repository is hosted on GNU Savannah. Reliable official
      narrative history is thin, so this enrichment keeps the history to the GNU
      identity, source hosting, and package-manager role.
  related-projects:
    - >
      GNU cflow sits near other source-reading and static-analysis command-line tools
      rather than compilers or language servers.
  sources:
    - https://git.savannah.gnu.org/cgit/cflow.git
    - https://www.gnu.org/software/cflow/
    - https://www.gnu.org/software/cflow/manual
    - https://www.gnu.org/software/cflow
    - https://formulae.brew.sh/api/formula/cflow.json
  summary:
    - >
      GNU cflow is a GNU command-line developer tool for generating call graphs from C
      source code.
  timeline:
    - 'GNU project: cflow is maintained as GNU software.'
    - 'Savannah era: official source repository hosted on git.savannah.gnu.org.'
    - 'Current packaging: input facts show broad availability across Unix package managers.'
  usage:
    - >
      cflow is used by C programmers and maintainers to inspect function relationships
      and call graphs from source trees, usually as a command-line aid during code
      reading or static analysis.
related-packages: []
category: developer-tools
package-manager:
  apk: cflow
  brew: cflow
  debian: cflow
  dnf: cflow
  macports: cflow
  nix: cflow
  ubuntu: cflow
  zypper: cflow
package-manager-url: https://formulae.brew.sh/formula/cflow
license: GPL-3.0-or-later
tags:
  - c
  - call-graphs
  - cli
  - gnu
  - static-analysis
description: Generate call graphs from C code
executables:
  - cflow
provenance:
  formula: cflow
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
