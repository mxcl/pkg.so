id: brew:jwt-hack
display-name: jwt-hack
homepage: https://github.com/hahwul/jwt-hack
repo: https://github.com/hahwul/jwt-hack
docs:
  - https://github.com/hahwul/jwt-hack
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      jwt-hack's adoption is mainly within offensive-security, bug-bounty, and
      application-security workflows rather than general JWT debugging. Its README
      documents installation through Cargo, Homebrew, Snapcraft, source builds, GHCR,
      and Docker Hub, which makes it portable across local labs, CI jobs, and
      containerized testing environments.
  package-nerd-significance:
    - >
      For package nerds, jwt-hack is the security-tool counterpart to simpler JWT
      viewers: it packages practical JWT attack primitives into a single installable CLI
      and shows the 2020s shift from Go security utilities toward Rust rewrites where
      maintainers care about memory safety and distributable binaries.
  project-history:
    - >
      The maintainer, Hahwul, described creating jwt-hack in October 2020 as a Go tool
      born from a personal need to make JWT security testing more convenient, initially
      centered on cracking JWT signing secrets with wordlists or brute force. GitHub
      release metadata records v1.0.0 on August 31, 2020, which lines up with that early
      public project period.
    - >
      On June 6, 2025, the maintainer announced jwt-hack v2 as a complete Rust rewrite.
      The stated motivations were better stability through Rust's ownership model and
      improved performance; later README material shows the Rust-era tool expanding into
      JWE support, DEFLATE-compressed JWT handling, scan mode, API server mode, Docker
      images, Snapcraft, and MCP server mode.
  related-projects:
    - >
      jwt-hack relates to JWT.io and jwt-cli for inspection and encoding, but it is
      closer in spirit to web-application security tools because it includes cracking,
      payload generation, and vulnerability scanning.
  sources:
    - https://crates.io/crates/jwt-hack
    - https://github.com/hahwul/jwt-hack
    - https://github.com/hahwul/jwt-hack/releases
    - https://www.hahwul.com/blog/2025/jwt-hack-v2/
    - https://www.rfc-editor.org/rfc/rfc7519
  summary:
    - >
      jwt-hack is a JSON Web Token security-testing toolkit for encoding, decoding,
      verifying, cracking weak secrets, generating attack payloads, and scanning tokens
      for common JWT mistakes.
  timeline:
    - '2020-08-31: v1.0.0 GitHub release published.'
    - >
      2020-10: Maintainer describes the original Go tool as created for convenient JWT
      security testing.
    - '2025-06-06: v2.0.0 released and announced as a complete Rust rewrite.'
    - >
      2025-08-29: v2.2.0 release line adds JWE and EdDSA-oriented functionality in the
      Rust era.
    - '2026-06-05: v2.6.0 GitHub release published.'
  usage:
    - >
      Typical use cases include decoding suspicious tokens, generating
      algorithm-confusion or header-based payloads, testing weak HMAC secrets with
      dictionaries or brute force, validating signatures, and running a scan that checks
      for weak secrets, missing claims, `none` algorithm acceptance, algorithm
      confusion, and header injection vectors.
related-packages: []
