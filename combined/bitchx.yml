id: brew:bitchx
display-name: BitchX
homepage: https://bitchx.sourceforge.net/
repo: https://sourceforge.net/p/bitchx/git/ci/master/tree
docs:
  - https://bitchx.sourceforge.net/
  - https://bitchx.sourceforge.net/category/about.html
  - https://bitchx.sourceforge.net/category/development.html
  - https://sourceforge.net/p/bitchx/git/ci/master/tree/BitchX.help
  - https://sourceforge.net/p/bitchx/git/ci/master/tree/README
config-file-location:
  unix:
    - ~/.BitchX/BitchX.sav
    - ~/.bitchxrc
credentials-file-location: null
history:
  adoption-history:
    - >
      BitchX spread through the Unix IRC scene because it bundled scripts, formatting,
      automation, DCC tooling, mass commands, bot-like channel management, and
      ircII-style scripting into a single terminal client.
    - >
      Its package footprint is smaller now than in IRC's peak years, but the batch
      metadata still shows Homebrew and MacPorts packaging. That makes it a preserved
      piece of terminal chat culture rather than a mainstream new-user IRC client.
  package-nerd-significance:
    - >
      BitchX matters to package nerds as a fossil that still builds: a 1990s IRC client
      with a long tail of Unix packaging, legacy config paths, and assumptions from the
      era when terminal IRC clients were programmable social operating systems.
    - >
      It also illustrates how package managers preserve culture. Installing it today is
      not just installing an IRC client; it is installing a branch of the ircII family
      tree with decades of scripts, conventions, and command names baked in.
  project-history:
    - >
      The official BitchX site says the project began as a script by Trench and
      HappyCrappy for the Unix IRC client ircII, and that around Christmas 1994 Colten
      Edwards, known as panasync, patched it directly into the client.
    - >
      Over the years BitchX accumulated its own feature set while also taking ideas from
      EPIC, another ircII offshoot. The 1.2.1 README describes it as originally based on
      ircII and heavily influenced by EPIC, with the 1.2.1 release focused on bug fixes
      and updating the code for a modern environment.
  related-projects:
    - ircII is the original Unix IRC client lineage from which BitchX descends.
    - EPIC is another ircII offshoot whose features influenced BitchX.
    - >
      irssi and WeeChat are later terminal IRC clients that occupy similar power-user
      territory.
    - SourceForge hosts the current BitchX development tree referenced by the project site.
  sources:
    - https://bitchx.sourceforge.net/category/about.html
    - https://bitchx.sourceforge.net/category/development.html
    - https://sourceforge.net/p/bitchx/git/ci/master/tree/BitchX.help
    - https://sourceforge.net/p/bitchx/git/ci/master/tree/README
    - input.json source_facts.package-manager
  summary:
    - >
      BitchX is a text-mode IRC client for Unix-like systems, descended from ircII and
      influenced by EPIC. It is a classic terminal-era IRC power-user client:
      scriptable, heavily configurable, and full of channel-management commands.
  timeline:
    - '1994: BitchX begins as an ircII script and is patched into the client around Christmas.'
    - >
      1990s: BitchX grows into a separate ircII-derived terminal IRC client with
      scripting and channel-management features.
    - '2014: The official site documents BitchX history and features in its About page.'
    - '2015: The official site points development at the SourceForge Git tree.'
    - '2010s: The 1.2.1 release notes focus on bug fixes and modernizing the old codebase.'
  usage:
    - >
      Users run `BitchX` in a terminal to connect to IRC networks, join channels, manage
      users, use DCC/CDCC/XDCC file-offering features, script client behavior, and
      customize display formats.
    - >
      The bundled help file is large and command-centric, covering channel operations,
      user lists, ignore lists, DCC, scripting, windowing, status formats, and many
      aliases. Its audience is clearly power users who live inside a terminal IRC
      session.
related-packages:
  - id: brew:weechat
    reason: >
      WeeChat is the strongest modern alternative for users wanting a lightweight
      terminal IRC client with dynamically loaded plugins, many scripting languages, and
      relay support.
    rel: alternative
    sources:
      - https://bitchx.sourceforge.net/category/about.html
      - https://weechat.org/about/features/
  - id: brew:irssi
    reason: >
      Irssi is an alternative Unix terminal IRC client with a persistent configuration,
      themes, and a mature Perl scripting ecosystem.
    rel: alternative
    sources:
      - https://bitchx.sourceforge.net/category/about.html
      - https://irssi.org/documentation/
category: networking
package-manager:
  brew: bitchx
  macports: bitchx
package-manager-url: https://formulae.brew.sh/formula/bitchx
license: BSD-3-Clause
