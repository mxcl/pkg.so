id: brew:c
display-name: c
homepage: https://github.com/ryanmjacobs/c
repo: https://github.com/ryanmjacobs/c
docs:
  - https://github.com/ryanmjacobs/c#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through source download, AUR, bpkg, and
      Homebrew. Homebrew packaging gives it a low-friction macOS path for the exact use
      case the README highlights: putting a c executable on PATH and using it in
      shebangs or direct commands.
  package-nerd-significance:
    - >
      The package is a classic tiny-CLI package-manager curiosity: one executable,
      almost no ceremony, and enough ergonomics to make C feel like a scripting language
      for quick local utilities.
    - >
      It is also a useful contrast with `tcc -run`: the README explicitly says c is not
      tied to one compiler, making it a compiler-agnostic runner rather than a language
      implementation.
  project-history:
    - >
      The upstream Git history begins on 23 February 2015 with the initial c script and
      shebang support. The README frames the project as a convenience wrapper rather
      than a compiler: it compiles and executes C scripts in one go, and later added a
      cache so repeated runs can avoid unnecessary rebuilds.
  related-projects:
    - 'GCC, Clang, and TCC: compilers that can be selected through CC.'
    - >
      tcc -run: a related one-command C execution workflow that the README distinguishes
      from c.
    - 'bpkg and AUR packages: alternate packaging channels listed by the upstream README.'
  sources:
    - https://github.com/ryanmjacobs/c
    - https://github.com/ryanmjacobs/c#readme
    - source_facts.package-manager
  summary:
    - >
      c is a small shell-script front end for compiling and running C or C++ files in
      one command. Its niche is treating small C programs like scripts while still
      letting the user choose GCC, Clang, TCC, or another compiler through the normal CC
      environment variable.
  timeline:
    - '2015-02-23: Initial c script and shebang support appear in upstream Git history.'
    - '2015-03-06: v0.09 tag appears.'
    - '2020-04-13: v0.12 tag appears.'
    - '2025-10-06: v0.15.0 and v0.15.1 tags appear in upstream Git history.'
  usage:
    - >
      Typical usage is `c hello.c` or a shebang such as `#!/usr/bin/c`. For multi-file
      programs, compiler flags and additional source files are passed in the first
      quoted argument, and runtime arguments follow after that.
    - >
      The tool honors CC, supports cache tuning through C_CACHE_SIZE and C_CACHE_PATH,
      and offers `--clear-cache` for cache cleanup.
related-packages:
  - id: brew:gcc
    reason: >
      Install GCC alongside `c` when you want GNU's compiler toolchain as the backend
      selected through `CC`.
    rel: adjacent_workflow
    sources:
      - https://github.com/ryanmjacobs/c
      - https://gcc.gnu.org/
  - id: brew:llvm
    reason: Install LLVM when you want `c` to delegate compilation to Clang by setting `CC=clang`.
    rel: adjacent_workflow
    sources:
      - https://github.com/ryanmjacobs/c
      - https://clang.llvm.org/
category: developer-tools
package-manager:
  brew: c
package-manager-url: https://formulae.brew.sh/formula/c
license: MIT
tags:
  - c
  - cli
  - compiler
  - developer-tool
  - script-runner
description: Compile and execute C "scripts" in one go
executables:
  - c
provenance:
  formula: c
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
