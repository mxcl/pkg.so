id: brew:git-xet
display-name: Git Xet
homepage: https://github.com/huggingface/xet-core
repo: https://github.com/huggingface/xet-core
docs:
  - https://xethub.com/assets/docs/getting-started/installing-git-xet
  - https://github.com/xetdata/xet-core#readme
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
    - ~/.config/git/config
    - /etc/gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool's adoption is tied to Hugging Face Hub storage. Hugging Face
      documentation describes Xet as replacing Git LFS for Hub storage needs while
      preserving Git-style pointer files and ordinary repository workflows for large
      binary artifacts.
  package-nerd-significance:
    - >
      git-xet matters to package nerds because it packages a storage backend transition
      as a Git extension. Homebrew, Nix, Scoop, and winget entries make an ML storage
      protocol feel like a regular developer-machine dependency.
  project-history:
    - >
      Xet originated in the XetHub storage work later acquired by Hugging Face in August
      2024. The Hugging Face xet-core repository adapted that technology into Rust
      crates, Python bindings, and the git-xet binary, with public git-xet tags
      beginning at git-xet-v0.1.0 in 2025.
  related-projects:
    - xet-core provides the Rust client technology.
    - hf-xet and huggingface_hub provide the Python path into the same storage system.
    - Git LFS remains a compatibility reference point for pointer-file workflows.
  sources:
    - https://github.com/huggingface/xet-core
    - https://huggingface.co/docs/hub/xet/index.md
    - https://huggingface.co/docs/hub/xet/overview.md
    - https://huggingface.co/docs/hub/xet/using-xet-storage.md
    - https://raw.githubusercontent.com/huggingface/xet-core/main/README.md
  summary:
    - >
      Git Xet is the Git extension and Git LFS-compatible command-line entry point for
      Xet storage. It sits at the boundary between ordinary Git workflows and Hugging
      Face's Xet-backed storage for large model and dataset files.
  timeline:
    - '2024: Hugging Face acquired XetHub.'
    - '2025: xet-core published git-xet release tags.'
    - >
      2025: Hugging Face documentation described Git Xet as the Git path into Xet-backed
      Hub storage.
  usage:
    - >
      Practitioners install Git Xet, run git xet install, and then use normal Git add,
      commit, and push flows against Hugging Face repositories. The extension invokes
      the Xet protocol under the hood so only changed chunks of large files need to
      move.
related-packages:
  - id: brew:git-lfs
    reason: >
      Choose Git LFS for general-purpose large-file storage on LFS-capable Git hosts;
      choose Git Xet when working with Hugging Face's Xet-backed storage and chunk-level
      deduplication.
    rel: alternative
    sources:
      - https://huggingface.co/docs/hub/xet/using-xet-storage
      - https://git-lfs.com/
category: developer-tools
package-manager:
  brew: git-xet
  nix: git-xet
  scoop: main/git-xet
  winget: HuggingFace.Git-Xet
package-manager-url: https://formulae.brew.sh/formula/git-xet
license: Apache-2.0
tags:
  - cli
  - git-extension
  - large-files
  - storage
  - version-control
description: Git LFS plugin that uploads and downloads using the Xet protocol
executables:
  - git-xet
provenance:
  formula: git-xet
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
