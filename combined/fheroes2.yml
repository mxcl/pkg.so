id: brew:fheroes2
display-name: fheroes2
homepage: https://ihhub.github.io/fheroes2/
repo: https://github.com/ihhub/fheroes2
docs:
  - https://github.com/ihhub/fheroes2#readme
  - https://ihhub.github.io/fheroes2
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/fheroes2/fheroes2.cfg
    - ~/.var/app/io.github.ihhub.Fheroes2/config/fheroes2/fheroes2.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      fheroes2 is packaged for multiple Unix-like package managers, including Homebrew,
      Debian/Ubuntu, Fedora, MacPorts, Nix, and Alpine according to the package facts in
      this batch. Its package appeal comes from letting users install the engine cleanly
      while supplying original or demo game data separately.
    - >
      The repository metadata shows several thousand GitHub stars and hundreds of forks
      during this batch run, which is substantial for a game recreation project with
      legal separation between engine code and copyrighted assets.
  package-nerd-significance:
    - >
      fheroes2 is package-interesting because it cleanly separates a free engine from
      non-free game assets. That makes it a familiar pattern for distro maintainers of
      classic-game recreations: ship the engine, document asset requirements, and avoid
      bundling copyrighted data.
  project-history:
    - >
      The project README says fheroes2 was initially developed on SourceForge. The
      modern GitHub repository was created in August 2019 and became the center for
      development, releases, documentation, CI, translations, and website work.
    - >
      The project is written from scratch and does not provide the original commercial
      game assets. Its README is explicit that the rights to the original game and
      resources belong to Ubisoft through the former 3DO Company lineage, and it advises
      users to buy the original game or use the free demo resources.
    - >
      The GitHub release stream shows active modern packaging, including a release
      published on June 30, 2026. The README also documents development guides,
      graphical asset contribution, translation work, donations, and community channels,
      which is typical of long-lived open-source game-engine recreations.
  related-projects:
    - >
      fheroes2 belongs to the family of open-source engine recreations for classic
      commercial games, where users combine a free engine with separately obtained
      original data.
  sources:
    - https://github.com/ihhub/fheroes2
    - https://api.github.com/repos/ihhub/fheroes2
    - https://api.github.com/repos/ihhub/fheroes2/releases
    - https://ihhub.github.io/fheroes2
    - https://sourceforge.net/projects/fheroes2/
    - https://formulae.brew.sh/formula/fheroes2
  summary:
    - >
      fheroes2 is an open-source recreation of the Heroes of Might and Magic II engine.
      It aims to reproduce the original game while adding modern fixes and improvements
      such as higher-resolution graphics support, improved AI, gameplay and logic fixes,
      and user-interface improvements.
  timeline:
    - 'Pre-2019: Project initially developed on SourceForge.'
    - '2019: Modern GitHub repository created and early GitHub release artifacts published.'
    - >
      2026: Version 1.1.17 released, with repository metadata showing continuing active
      development.
  usage:
    - >
      Users install the engine, then provide Heroes of Might and Magic II data from an
      original purchase or the free demo. The Homebrew formula exposes `fheroes2` along
      with helper executables for extracting resources and installing demo data.
    - >
      The documented Linux configuration path is
      `$XDG_CONFIG_HOME/fheroes2/fheroes2.cfg`, with a Flatpak-specific path under
      `~/.var/app/io.github.ihhub.Fheroes2/config/fheroes2/fheroes2.cfg`.
related-packages: []
category: games
package-manager:
  apk: fheroes2
  brew: fheroes2
  debian: fheroes2
  dnf: fheroes2
  macports: fheroes2
  nix: fheroes2
  ubuntu: fheroes2
package-manager-url: https://formulae.brew.sh/formula/fheroes2
license: GPL-2.0-or-later
tags:
  - cli
  - game-engine
  - heroes-of-might-and-magic
  - open-source-game
  - reimplementation
  - strategy-game
description: Recreation of the Heroes of Might and Magic II game engine
executables:
