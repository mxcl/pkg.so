id: brew:id3v2
display-name: id3v2
homepage: https://id3v2.sourceforge.net/
repo: https://sourceforge.net/p/id3v2/code
docs:
  - https://id3v2.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      id3v2 became a convenient shell tool for scripts that needed to inspect or alter
      MP3 metadata without a GUI tagger. Distribution packaging kept it available in
      Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE-style
      ecosystems.
    - >
      Its adoption is closely tied to id3lib. The project fills the end-user CLI role
      while id3lib supplies the parsing and writing implementation.
  package-nerd-significance:
    - >
      id3v2 is package-nerd useful because it is tiny, scriptable, and historically
      common enough that old HOWTOs and scripts still mention it. It represents the era
      when Unix audio tagging often meant one-purpose command-line tools layered over
      small C/C++ libraries.
    - >
      The package also illustrates a dependency relationship that maintainers notice: if
      id3lib breaks on a newer compiler or platform, id3v2 is one of the visible reverse
      dependents.
  project-history:
    - >
      The upstream homepage says the author wrote id3v2 because ID3v1 tags were too
      limited and there was not a Linux tool to edit richer ID3v2 tags. The tool was
      based on id3lib examples, with the author's own code around them.
    - >
      The SourceForge project was registered on 2000-03-31. Its project page describes
      add, modify, delete, and convert operations for ID3v2 and ID3v1 tags, and also
      records the project as a Linux-oriented C++ tag editor.
  related-projects:
    - >
      id3lib is the direct implementation dependency. GUI and broader audio taggers such
      as Kid3, EasyTAG, and later TagLib-based tools address overlapping tagging needs
      with wider format support.
    - >
      id3v2 belongs with other CLI metadata tools such as eyeD3 and mp3info, but its
      name and behavior are specifically tied to the ID3v2 tag format.
  sources:
    - https://github.com/myers/id3v2
    - https://id3v2.sourceforge.net/
    - https://raw.githubusercontent.com/myers/id3v2/main/README
    - https://sourceforge.net/projects/id3v2/
  summary:
    - >
      id3v2 is a small command-line editor for ID3v2 tags in MP3 files. It was written
      to fill a Linux command-line gap left by ID3v1-oriented tools, using id3lib
      underneath.
  timeline:
    - '2000-03-31: The SourceForge id3v2 project was registered.'
    - '0.1.10: The README says the code moved under the LGPL at this version.'
    - '0.1.11: The upstream homepage linked the 0.1.11 tarball.'
    - '2013-12-02: SourceForge recorded a project activity update.'
  usage:
    - >
      Users run id3v2 to list, add, modify, remove, or convert MP3 tags. Debian
      describes it as a command-line tool for ID3v2 tags that can also convert or list
      ID3v1 tags, matching the upstream SourceForge description.
    - >
      The tool's utility is strongest in batch tagging, shell pipelines, and old MP3
      collection cleanup. It is not a broad modern media metadata framework; it is a
      narrow tool for a narrow and durable file format niche.
related-packages:
  - id: brew:eye-d3
    reason: >
      Choose eyeD3 for a maintained Python-based CLI with plugins and ID3v2.4 support;
      choose id3v2 for small legacy scripts centered on its established command syntax.
    rel: alternative
    sources:
      - https://id3v2.sourceforge.net/
      - https://eyed3.readthedocs.io/en/latest/
  - id: brew:id3lib
    reason: >
      Install or develop against id3lib when you need the underlying C++ tag API on
      which id3v2 is based instead of only its command-line editor.
    rel: adjacent_workflow
    sources:
      - https://id3v2.sourceforge.net/
      - https://id3lib.sourceforge.net/api/index.html
category: media
