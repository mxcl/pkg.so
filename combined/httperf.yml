id: brew:httperf
display-name: httperf
homepage: https://github.com/httperf/httperf
repo: https://github.com/httperf/httperf
docs:
  - https://github.com/httperf/httperf#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      httperf became part of the older Unix web-performance toolkit alongside
      ApacheBench and other load generators. The batch input records packages for
      Homebrew, Debian, Fedora, MacPorts, Ubuntu, and openSUSE, reflecting its role as a
      packaged benchmarking utility rather than a single-vendor service.
  package-nerd-significance:
    - >
      Package nerds care about httperf because it is a compact example of research
      software that survived as a distro tool: C source, autotools, a manpage-oriented
      CLI, optional SSL, and output that can feed reproducible performance
      investigations.
  project-history:
    - >
      The HP Research Labs paper by David Mosberger and Tai Jin describes httperf as a
      flexible facility for generating HTTP workloads and measuring server performance.
      The maintained source tree presents the same identity: a robust, high-performance
      tool for both micro- and macro-level web benchmarks, with HTTP/1.1 and SSL
      support.
    - >
      The GitHub-hosted tree uses the traditional GNU autotools build flow and documents
      `httperf` plus the companion `idleconn` program. Its README notes that `idleconn`
      stopped being built by default as of httperf 0.9.1, which is a small but useful
      marker of the tool's evolution from research utility into packageable Unix
      software.
  related-projects:
    - >
      Related tools include ApacheBench (`ab`), Siege, wrk, curl-based smoke tests, and
      the bundled `idleconn` companion program.
  sources:
    - https://api.github.com/repos/httperf/httperf
    - https://cs.uwaterloo.ca/~brecht/courses/Perf-Eval-Shared/readings/f18/httperf.pdf
    - https://github.com/httperf/httperf
    - https://raw.githubusercontent.com/httperf/httperf/master/README.md
  summary:
    - >
      httperf is an HTTP load generator and measurement tool associated with HP Research
      Labs. It is aimed at constructing web-server workloads rather than encoding a
      single benchmark recipe.
  timeline:
    - >
      1998: HP Research Labs authors described httperf as a web-server performance
      measurement tool.
    - '2015: The public GitHub repository under the `httperf` organization was created.'
    - '0.9.1: `idleconn` stopped being built by default according to the README.'
  usage:
    - >
      Typical usage is to issue controlled HTTP request streams with options such as
      target server, request count, request rate, timeout, and SSL support. The README
      explicitly warns that a client should usually run only one copy because httperf
      attempts to consume available CPU to generate an accurate workload.
related-packages:
  - id: brew:wrk
    reason: >
      Choose wrk for high-throughput multithreaded HTTP benchmarking with optional Lua
      request and reporting scripts.
    rel: alternative
    sources:
      - https://github.com/httperf/httperf#readme
      - https://github.com/wg/wrk#readme
  - id: brew:siege
    reason: >
      Choose Siege when a URL list, randomized site traversal, and concurrent-user
      simulation better represent the workload than httperf's connection-rate controls.
    rel: alternative
    sources:
      - https://github.com/httperf/httperf#readme
      - https://www.joedog.org/siege
  - id: brew:autocannon
    reason: >
      Choose autocannon for a Node.js-native benchmark tool that also exposes a
      programmatic JavaScript API and HTTP pipelining controls.
    rel: alternative
    sources:
      - https://github.com/httperf/httperf#readme
      - https://github.com/mcollina/autocannon#readme
category: developer-tools
package-manager:
  brew: httperf
  debian: httperf
  dnf: httperf
  macports: httperf
  ubuntu: httperf
  zypper: httperf
package-manager-url: https://formulae.brew.sh/formula/httperf
license: GPL-2.0-or-later
tags:
  - benchmarking
  - cli
  - http
  - load-generator
  - performance-testing
  - web-server
description: Tool for measuring webserver performance
executables:
  - httperf
  - idleconn
provenance:
  formula: httperf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
