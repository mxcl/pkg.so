  apk: neovim
  brew: neovim
  chocolatey: neovim
  debian: neovim
  dnf: neovim
  macports: neovim
  nix: neovim
  pacman: neovim
  scoop: main/neovim
  ubuntu: neovim
  winget: Neovim.Neovim
  zypper: neovim
