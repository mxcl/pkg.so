id: brew:neovim
display-name: Neovim
homepage: https://neovim.io/
repo: https://github.com/neovim/neovim
docs:
  - https://neovim.io/doc
  - https://neovim.io/doc/user
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/nvim/init.vim
    - $XDG_CONFIG_HOME/nvim/init.lua
    - ~/.config/nvim/init.vim
    - ~/.config/nvim/init.lua
  windows:
    - ~/AppData/Local/nvim/init.vim
    - ~/AppData/Local/nvim/init.lua
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026-07-01, GitHub metadata showed about 100,837 stars and 6,942 forks.
      Homebrew analytics listed 41,028 installs in 30 days, 137,631 in 90 days, and
      513,070 in 365 days, far beyond the satellite GUI/helper packages in this batch.
    - >
      Adoption is visible across package managers and operating systems: the README
      points to managed packages in Homebrew, Debian, Ubuntu, Fedora, Arch, Void,
      Gentoo, and more, while the input record also lists Chocolatey, Scoop, winget,
      MacPorts, Nix, apk, pacman, dnf, and zypper package names.
    - >
      The ecosystem role changed over time. Early adopters cared about async jobs,
      remote plugins, terminal integration, and a cleaned-up codebase. Later adopters
      often arrive through Lua-first configuration, built-in LSP, Tree-sitter-driven
      editing, plugin managers, and distributions/configurations that use Neovim as a
      programmable editor platform.
  package-nerd-significance:
    - >
      Neovim is one of the clearest examples of a Unix-y tool becoming a platform
      through stable APIs instead of a single monolithic GUI. In package databases, it
      should be enriched not just as an editor, but as an ecosystem root for Lua
      plugins, LSP workflows, external UIs, headless automation, and Vim-compatible
      terminal editing.
  project-history:
    - >
      The `neovim/neovim` repository was created on 2014-01-31, and the project's wiki
      introduction existed by 2014-03-07. The README describes Neovim as an effort to
      aggressively refactor Vim in order to simplify maintenance, distribute work across
      contributors, enable advanced UIs without core changes, and maximize
      extensibility.
    - >
      Neovim v0.1.0 was tagged on 2015-11-01. Later milestone lines made the fork feel
      less like a cleanup project and more like a modern editor platform: embedded
      terminal support, job control, MessagePack RPC, external UIs, Lua scripting and
      configuration, LSP, Tree-sitter, and a growing package/plugin ecosystem.
  related-projects:
    - Vim
    - Neovide
    - Neovim Qt
    - neovim-remote
    - vscode-neovim
    - Firenvim
    - Tree-sitter
    - LuaJIT
    - libuv
  sources:
    - https://api.github.com/repos/neovim/neovim
    - https://api.github.com/repos/neovim/neovim/releases?per_page=100
    - https://formulae.brew.sh/api/formula/neovim.json
    - https://github.com/neovim/neovim
    - https://github.com/neovim/neovim/wiki/Introduction/_history
    - https://neovim.io/
    - https://neovim.io/doc/user/lua.html
    - https://neovim.io/doc/user/news.html
  summary:
    - >
      Neovim is a Vim fork focused on extensibility, usability, maintainability, and
      embeddable/editor-as-engine architecture. It is the significant package in this
      batch: the other Neovim-related packages exist largely because Neovim exposed
      APIs, RPC, and UI surfaces that support external clients and workflow tools.
  timeline:
    - "{'date': '2014-01-31', 'event': 'The `neovim/neovim` GitHub repository was created.'}"
    - "{'date': '2014-03-07', 'event': 'The Neovim wiki Introduction page was created.'}"
    - "{'date': '2015-11-01', 'event': 'Neovim v0.1.0 was tagged.'}"
    - >
      {'date': '2021-07-02', 'event': 'Neovim v0.5.0 was tagged, a major milestone for
      Lua-era configuration and plugin development.'}
    - "{'date': '2024-05-16', 'event': 'Neovim v0.10.0 was tagged.'}"
    - >
      {'date': '2026-06-10', 'event': 'Neovim v0.12.3 was published as the stable
      release line represented in Homebrew on 2026-07-01.'}
  usage:
    - >
      Users run `nvim` directly in terminals, set it as `$EDITOR`, embed it into GUIs or
      IDEs, run it headless for scripting, or configure it through `init.vim` and
      `init.lua` under the XDG config directory. The project keeps Vim's editing model
      and Vimscript compatibility while exposing newer Lua and API workflows.
    - >
      Package nerds tend to care about Neovim's build and runtime boundaries: it is a
      standalone editor package, a shared dependency for GUI clients such as Neovide and
      Neovim Qt, and a target process for helpers such as `nvr`. Its package freshness
      matters because plugins and external clients often depend on relatively new API
      behavior.
related-packages:
  - id: brew:vim
    reason: >
      Choose Vim for the original, highly portable editor and its Vim9 ecosystem; choose
      Neovim for Lua, built-in LSP, pervasive RPC, and external-UI support.
    rel: alternative
    sources:
      - https://www.vim.org/
      - https://neovim.io/
      - https://neovim.io/doc/user/vim_diff.html
  - id: brew:neovide
    reason: >
      Neovide uses Neovim as its editor engine while adding a cross-platform
      GPU-rendered graphical interface.
    rel: adjacent_workflow
    sources:
      - https://neovide.dev/
      - https://neovide.dev/installation
      - https://neovim.io/
  - id: brew:neovim-qt
    reason: >
      Neovim Qt provides a lightweight Qt GUI over a Neovim process and uses Neovim's
      configuration and runtime model.
    rel: adjacent_workflow
    sources:
      - https://github.com/equalsraf/neovim-qt
      - https://neovim.io/
  - id: brew:neovim-remote
    reason: >
      neovim-remote sends files and commands to existing Neovim processes, complementing
      server and embedded-editor workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/mhinz/neovim-remote
      - https://neovim.io/doc/user/remote.html
category: developer-tools
