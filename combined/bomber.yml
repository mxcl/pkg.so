id: brew:bomber
display-name: bomber
homepage: https://devops-kung-fu.github.io/bomber/
repo: https://github.com/devops-kung-fu/bomber
docs:
  - https://devops-kung-fu.github.io/bomber
  - https://github.com/devops-kung-fu/bomber#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bomber belongs to the post-SBOM-surge security tooling ecosystem. The input
      package metadata lists Homebrew plus Linux distribution packages, MacPorts,
      Pacman, Ubuntu, and zypper, reflecting adoption as a portable security CLI rather
      than a library embedded in applications.
  package-nerd-significance:
    - >
      bomber is package-nerd relevant because it treats package metadata itself as the
      object of security analysis. It sits downstream of SBOM generators such as Syft
      and normalizes vulnerability lookup across package ecosystems and advisory
      providers.
  project-history:
    - >
      The Git repository begins in July 2022, with the first tagged public release
      following in August 2022. The README describes the project as a response to a
      practical SBOM question: after receiving a vendor SBOM for closed-source software,
      users need a fast way to identify component vulnerabilities and license risk.
    - >
      The project evolved through v0.3 and v0.4 releases in 2022 and 2023, then v0.5 in
      2024. Its README labels the project beta while documenting a broad feature set
      around providers, output formats, ignore lists, severity filtering, data
      enrichment, and CI-friendly stdin scanning.
  related-projects:
    - CycloneDX, SPDX, and Syft are documented input SBOM formats.
    - >
      OSV, GitHub Advisory Database, Sonatype OSS Index, and Snyk are documented
      vulnerability providers.
    - >
      Syft is a common companion tool because it can generate an SBOM and pipe it
      directly into bomber.
  sources:
    - https://devops-kung-fu.github.io/bomber
    - https://github.com/devops-kung-fu/bomber#readme
    - https://github.com/devops-kung-fu/bomber/releases
    - source_facts.package-manager
  summary:
    - >
      bomber is a DevSecOps command-line scanner for Software Bill of Materials files.
      It reads CycloneDX, SPDX, and Syft SBOMs and checks listed components against
      vulnerability providers.
  timeline:
    - '2022-07-08: Initial repository commit.'
    - '2022-08-22: v0.1.0 tag and initial public version.'
    - '2022-09-19: v0.3.0 tag appears during rapid early development.'
    - '2023-12-13: v0.4.8 tag appears.'
    - '2024-08-15: v0.5.0 tag appears.'
    - '2024-09-23: v0.5.1 tag appears.'
  usage:
    - >
      Typical use is `bomber scan` against one SBOM file or a directory of SBOMs. The
      README documents OSV as the default no-credential provider, with optional GitHub
      Advisory Database, Sonatype OSS Index, and Snyk providers, plus stdout, HTML,
      JSON, and Markdown output modes.
related-packages:
  - id: brew:syft
    reason: >
      Use Syft immediately before bomber to generate an SBOM from source, a filesystem,
      or a container image and pipe that SBOM directly into bomber's vulnerability scan.
    rel: adjacent_workflow
    sources:
      - https://devops-kung-fu.github.io/bomber/#scanning-sboms-from-stdin
      - https://github.com/anchore/syft#readme
  - id: brew:grype
    reason: >
      Choose Grype when you want a scanner that can examine container images and
      filesystems directly as well as consume existing SBOMs, rather than bomber's
      SBOM-first provider workflow.
    rel: alternative
    sources:
      - https://devops-kung-fu.github.io/bomber/
      - https://github.com/anchore/grype#readme
category: security
package-manager:
  brew: bomber
  debian: bomber
  dnf: bomber
  macports: bomber
  pacman: bomber
  ubuntu: bomber
  winget: KDE.Bomber
  zypper: bomber
package-manager-url: https://formulae.brew.sh/formula/bomber
license: MPL-2.0
tags:
  - cli
  - devsecops
  - sbom
  - security
  - vulnerability-scanner
description: Scans Software Bill of Materials for security vulnerabilities
executables:
  - bomber
provenance:
  formula: bomber
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
