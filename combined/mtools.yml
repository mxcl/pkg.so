id: brew:mtools
display-name: mtools
homepage: https://www.gnu.org/software/mtools/
repo: https://savannah.gnu.org/cvs?group=mtools
docs:
  - https://www.gnu.org/software/mtools/manual/mtools.html
config-file-location:
  unix:
    - SYSCONFDIR/mtools.conf
    - ~/.mtoolsrc
credentials-file-location: null
history:
  project-history:
    - >
      The toolset is organized around DOS-like commands with Unix command-line
      ergonomics: mcopy, mdir, mdel, mformat, mlabel, mattrib, mmd, mren, and many
      related utilities. GNU release notes describe its scope as access to MS-DOS disks
      from GNU and Unix without mounting, changing FAT-specific attributes, formatting
      FAT media, supporting Windows-style long filenames, FAT32, OS/2 XDF disks, 2m
      disks, and disk image files through the -i flag. Debian describes the package
      similarly and lists related filesystem tools, which matches its role as a
      practical bridge for floppy disks, removable FAT media, and disk images.
  sources:
    - https://directory.fsf.org/wiki/Mtools
    - https://github.com/vapier/mtools/blob/main/README
    - https://lists.gnu.org/archive/html/info-gnu/2021-07/msg00006.html
    - https://packages.debian.org/sid/mtools
    - https://www.gnu.org/software/mtools/
  summary:
    - >
      mtools is the long-running GNU collection for accessing MS-DOS/FAT media from
      Unix-like systems without mounting the filesystem. The README history credits
      Emmet P. Gray with the original code through roughly version 2.0.7, notes Viktor
      Dukhovni's major input into version 2.0, and identifies Alain Knaff and David
      Niemi as primary maintainers after 2.0.7. The same README records March 3, 2009 as
      the date mtools became an official GNU package, with Gray supporting that
      transition.
  usage:
    - >
      Its package-manager niche is durability rather than novelty. mtools persists in
      Homebrew, Debian, Fedora, Arch, Nix, MacPorts, and other ecosystems because
      scripts, retro-computing workflows, embedded build systems, virtual-machine image
      preparation, and recovery tasks still need direct manipulation of FAT filesystems
      without a kernel mount step or elevated mount policy.
related-packages:
  - id: brew:dosfstools
    reason: >
      Use dosfstools alongside mtools when a workflow must create, check, repair, or
      label the FAT filesystem before manipulating its files without mounting it.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/mtools/manual/mtools.html
      - https://github.com/dosfstools/dosfstools
category: system
