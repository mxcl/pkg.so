  brew: gupnp-tools
  debian: gupnp-tools
  dnf: gupnp-tools
  macports: gupnp-tools
  nix: gupnp-tools
  pacman: gupnp-tools
  ubuntu: gupnp-tools
  zypper: gupnp-tools
