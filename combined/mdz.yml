id: brew:mdz
display-name: mdz
homepage: https://github.com/LerianStudio/midaz
repo: https://github.com/LerianStudio/midaz
docs:
  - https://docs.lerian.studio/en/midaz/midaz-getting-started
  - https://docs.lerian.studio/en/v2/about-midaz-cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official getting-started guide positions Midaz for local developer evaluation
      on macOS and Linux using Go, Docker, Docker Compose, Make, and Git, then walks
      through a complete ledger workflow. The Homebrew input facts expose the CLI as the
      `mdz` package, giving package-manager users a direct entry point into the
      platform.
  package-nerd-significance:
    - >
      For package history, mdz is notable because it packages a finance-ledger developer
      workflow as a CLI rather than just a server stack. That makes an otherwise
      multi-service accounting platform approachable from Homebrew and shell automation.
  project-history:
    - >
      Midaz is documented as a cloud-native ledger system centered on organizations,
      ledgers, assets, accounts, transactions, and balances. Its README describes a
      modular architecture with onboarding and transaction services, PostgreSQL and
      MongoDB storage, RabbitMQ eventing, OpenAPI documentation, and double-entry
      accounting for complex n:n transactions.
    - >
      The Midaz CLI documentation labels the CLI as under development, but already
      describes single-line commands, interactive mode, help mode, and `mdz configure`
      for client IDs, client secrets, and service URLs. The upstream changelog and
      release page show an active 3.7.x release stream in 2026.
  related-projects:
    - >
      Midaz Core, Midaz Console, Midaz SDK for Go, Midaz SDK for TypeScript, Midaz
      plugins, Lerian MCP.
  sources:
    - https://docs.lerian.studio/en/midaz/midaz-getting-started
    - https://docs.lerian.studio/en/v2/about-midaz-cli
    - https://github.com/LerianStudio/midaz
    - https://github.com/LerianStudio/midaz/releases
    - https://raw.githubusercontent.com/LerianStudio/midaz/develop/CHANGELOG.md
    - https://raw.githubusercontent.com/LerianStudio/midaz/develop/README.md
    - source_facts.package-manager-url
  summary:
    - >
      mdz is the command-line interface for Lerian Midaz, a source-available ledger
      platform for financial infrastructure. The official CLI documentation describes it
      as a tool for interacting with Midaz services and APIs from the shell.
  timeline:
    - >
      2026: Official docs describe Midaz CLI as under development with configure, help,
      single-line, and interactive modes.
    - >
      2026: The official GitHub releases page shows the v3.7.x release stream, including
      v3.7.8 in June.
  usage:
    - >
      The core usage path is to run Midaz locally, create an organization, ledger,
      asset, source and destination accounts, submit a balanced transaction, and verify
      the balance. The CLI usage modes support direct commands, interactive prompting
      for required fields, and `--help` or `-h` on commands and subcommands.
related-packages: []
category: data
