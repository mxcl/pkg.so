config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ITK's adoption grew from medical imaging into microscopy, remote sensing, and
      other scientific image-analysis domains. The Visible Human Project page records
      that its public-domain data sets were released in 1994 and 1995 and were intended
      partly as public-domain data for testing medical imaging algorithms, giving ITK a
      clear data-driven origin.
    - >
      Package-manager adoption spans Homebrew, Fedora, MacPorts, Nix, Arch, and
      openSUSE-family packages, but many users encounter ITK through downstream
      applications, Python wrapping, SimpleITK, 3D Slicer, ITK-SNAP, and research
      software stacks rather than by running a single CLI.
  package-nerd-significance:
    - >
      ITK is package-manager significant because it is a large scientific C++ dependency
      with long compile times, optional wrapping, CMake integration, and downstream
      consumers across research software. Packaging it well saves every downstream
      project from rebuilding a complex imaging stack by hand.
    - >
      It is also historically important as a medical-imaging open-source success: a
      government-funded research toolkit that became infrastructure for later tools
      rather than a single application.
  project-history:
    - >
      ITK began from the U.S. National Library of Medicine's need for open tools to
      analyze 3D data from the Visible Human Project. The archived ITK history says that
      in 1999 the NLM awarded a three-year contract to develop an open-source
      registration and segmentation toolkit, coordinated by Terry Yoo and built by the
      Insight Software Consortium.
    - >
      The original consortium joined commercial and academic groups: GE Research,
      Kitware, MathSoft/Insightful, the University of North Carolina, the University of
      Tennessee/Utah group, and the University of Pennsylvania, with subcontractors from
      Brigham and Women's Hospital, Columbia, the University of Pennsylvania GRASP Lab,
      and the University of Pittsburgh.
    - >
      The toolkit was built in C++ with generic programming and CMake, and it emphasized
      automated testing, iterative development, and language wrapping. Official ITK
      documentation describes it as an open-source toolkit for two-, three-, and
      higher-dimensional scientific image processing, segmentation, and registration.
    - >
      The project continued through major 4.x, 5.x, and 6.x release lines on GitHub. ITK
      5.0.0 was published in 2019, and the ITK site describes the project as using open
      governance and being fiscally sponsored by NumFOCUS.
  related-projects:
    - The Visible Human Project is the data and research context that motivated ITK.
    - >
      CMake, VTK, SimpleITK, ITK-SNAP, 3D Slicer, NumFOCUS, and Kitware are closely
      related in ITK's history and ecosystem.
    - >
      Downstream scientific workflows use ITK alongside Python, image IO libraries,
      visualization toolkits, and domain applications for medical imaging and
      microscopy.
  sources:
    - https://docs.itk.org/projects/doxygen/en/latest/
    - https://formulae.brew.sh/formula/itk
    - https://github.com/InsightSoftwareConsortium/ITK
    - https://github.com/InsightSoftwareConsortium/ITK/releases
    - https://insightsoftwareconsortium.github.io/ITKWikiArchive/Wiki/ITK/About/
    - https://itk.org/
    - https://www.nlm.nih.gov/research/visible/visible_human.html
  summary:
    - >
      ITK, the Insight Toolkit, is an open-source, cross-platform toolkit for scientific
      image processing, segmentation, and registration. It is one of the foundational
      C++ libraries behind medical-imaging and multidimensional image-analysis software.
  timeline:
    - '1994: The Visible Human male data set was publicly released.'
    - '1995: The Visible Human female data set was publicly released.'
    - '1999: NLM awarded the contract that started the Insight Toolkit effort.'
    - '2018: ITK 4.13.0 was published in the GitHub release stream.'
    - '2019: ITK 5.0.0 was published.'
    - '2026: ITK 6.0.0 documentation was generated in the project documentation site.'
  usage:
    - >
      ITK is primarily a development library. Users write C++ or wrapped-language
      programs that compose readers, writers, image types, filters, registration
      methods, segmentation algorithms, and pipeline components.
    - >
      The Homebrew formula exposes itkTestDriver, which reflects ITK's heavy testing
      culture more than a traditional end-user command-line application.
related-packages:
  - id: brew:vtk
    reason: >
      VTK adds visualization to ITK image-analysis workflows, and ITK’s documented glue
      module converts images between the two toolkits without duplicating buffers.
    rel: adjacent_workflow
    sources:
      - https://docs.itk.org/en/release/learn/faq.html
      - https://docs.itk.org/projects/doxygen/en/v4.7.0/classitk_1_1ImageToVTKImageFilter.html
      - https://docs.vtk.org/en/latest/
