id: brew:dory
display-name: Dory
homepage: https://github.com/freedomben/dory
repo: https://github.com/FreedomBen/dory
docs:
  - https://github.com/FreedomBen/dory#readme
config-file-location:
  unix:
    - ~/.dory.yml
    - <project>/.dory.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Dory was adopted through RubyGems and Homebrew, with the README recommending
      Homebrew on macOS and the Ruby gem on Linux. Its adoption niche is local web
      application development where Docker containers need stable, memorable hostnames.
  package-nerd-significance:
    - >
      Dory is package-nerd interesting because it packages a local development
      environment convention, DNS plus reverse proxy for Docker, as a small CLI that
      manages external services. It also reflects the Docker Machine, Dinghy, and Docker
      for Mac era of local container tooling.
  project-history:
    - >
      The public FreedomBen/dory repository was created in March 2016. Its README
      explains that Dory wraps codekitchen/dinghy-http-proxy and makes it usable outside
      Dinghy, especially for teams mixing Docker for Mac and Dinghy workflows.
    - >
      Dory's release history spans early 0.0.x tags through 1.2.0, while the RubyGems
      package page lists the same current version and a substantial historical download
      count. GitHub metadata shows the repository still receiving updates in 2026.
  related-projects:
    - >
      Related projects include Docker, Docker for Mac, Dinghy, dinghy-http-proxy,
      nginx-proxy, dnsmasq, RubyGems, and Homebrew.
  sources:
    - https://github.com/FreedomBen/dory#readme
    - https://api.github.com/repos/FreedomBen/dory
    - https://api.github.com/repos/FreedomBen/dory/tags
    - https://rubygems.org/api/v1/gems/dory.json
    - https://formulae.brew.sh/formula/dory
  summary:
    - >
      Dory is a local development proxy for Docker-based projects. It combines a
      daemonized nginx proxy container, dnsmasq, and local resolver configuration so
      developers can reach containers by local domain names instead of IP addresses and
      ports.
  timeline:
    - '2016: The public GitHub repository is created.'
    - '2016: Early 0.0.x tags appear in the current repository.'
    - '2020s: The package reaches the 1.x series.'
    - '2026: GitHub metadata shows continued repository activity.'
  usage:
    - >
      A common workflow installs Dory, sets `VIRTUAL_HOST` on containers, and runs `dory
      up`. Users can generate `~/.dory.yml` with `dory config-file`, then use commands
      such as `dory down`, `dory restart`, `dory status`, and `dory ip` to manage the
      proxy services.
related-packages:
  - id: brew:docker
    reason: >
      Dory complements Docker by providing local DNS and reverse-proxy routing for
      containers identified through `VIRTUAL_HOST`; install Docker separately to supply
      the container runtime and CLI.
    rel: adjacent_workflow
    sources:
      - https://github.com/FreedomBen/dory#readme
      - https://docs.docker.com/get-started/docker-overview/
category: developer-tools
package-manager:
  brew: dory
package-manager-url: https://formulae.brew.sh/formula/dory
license: MIT
tags:
  - cli
  - development-proxy
  - docker
  - local-development
  - reverse-proxy
description: Development proxy for docker
executables:
  - dory
provenance:
  formula: dory
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
