id: brew:mutt
display-name: Mutt
homepage: http://www.mutt.org/
repo: https://gitlab.com/muttmua/mutt
docs:
  - https://mutt.org/doc/manual
  - https://www.mutt.org/
config-file-location:
  unix:
    - ~/.muttrc
    - ~/.mutt/muttrc
    - $XDG_CONFIG_HOME/mutt/muttrc
credentials-file-location:
  unix:
    - ~/.muttrc
    - ~/.mutt/muttrc
    - $XDG_CONFIG_HOME/mutt/muttrc
history:
  project-history:
    - >
      Mutt established its role by being a keyboard-driven, highly configurable MUA
      rather than a complete groupware client. Its manual emphasizes MIME mail, key
      bindings, macros, threading, pattern matching, hooks, color configuration,
      OpenPGP/GPG, S/MIME, IMAP, POP, and SMTP support. In practice users pair it with
      external editors, local mail stores, MTAs, filters, indexers such as Notmuch, and
      sync tools, which fits the Unix style of composing small programs.
  sources:
    - https://gitlab.com/muttmua/mutt
    - https://lwn.net/Articles/837960/
    - https://www.mutt.org/
    - https://www.mutt.org/doc/manual/
  summary:
    - >
      Mutt is one of the long-running Unix text-mode mail user agents. The project page
      credits Michael Elkins as the original author and says maintenance moved to the
      members of the Mutt development mailing list. LWN's account traces its design to
      Elm, with ideas from Pine and Mush contributing to both the feature set and the
      name.
  usage:
    - >
      The 2.0 release was a notable milestone because it marked a major-version update
      for a tool with roots in the 1990s and brought interface and configuration
      refinements while preserving Mutt's terminal-first model. In package-manager
      terms, Mutt is a baseline text email client: it is packaged broadly across
      Unix-like systems, and NeoMutt exists as a closely related fork or variant that
      collects extra features and patches for users who want a more batteries-included
      branch of the same tradition.
related-packages:
  - id: brew:neomutt
    reason: >
      Choose NeoMutt when you want the Mutt workflow with a maintained collection of
      formerly separate features such as Notmuch, NNTP, sidebar support, and additional
      caching options.
    rel: alternative
    sources:
      - https://www.mutt.org/
      - https://docs.neomutt.org/explanation/history.html
      - https://neomutt.org/feature.html
  - id: brew:aerc
    reason: >
      Choose aerc for a newer terminal mail client with asynchronous IMAP/JMAP support,
      embedded-terminal composition, and explicit Git-and-email workflows; choose Mutt
      for its mature muttrc ecosystem.
    rel: alternative
    sources:
      - https://www.mutt.org/doc/manual/
      - https://aerc-mail.org/
  - id: brew:notmuch
    reason: >
      Use Notmuch alongside Mutt to add a fast local email index with query and tagging
      workflows exposed through the documented notmuch-mutt integration.
    rel: adjacent_workflow
    sources:
      - https://notmuchmail.org/
      - https://notmuchmail.org/notmuch-mutt/
      - https://www.mutt.org/
  - id: brew:gnupg
    reason: >
      Use GnuPG with Mutt for the OpenPGP signing, encryption, verification, and
      key-management workflows documented by both projects.
    rel: adjacent_workflow
    sources:
      - https://www.mutt.org/doc/manual/
      - https://gnupg.org/documentation/index.html
category: productivity
