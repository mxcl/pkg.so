id: brew:genders
display-name: Genders
homepage: https://github.com/chaos/genders
repo: https://github.com/chaos/genders
docs:
  - https://github.com/chaos/genders#readme
config-file-location:
  unix: /etc/genders
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream tutorial says the framework has been useful on clusters ranging from
      two or three workstations to the 11,136 nodes in El Capitan. That statement
      captures its niche: Genders is not a general desktop utility, but it matters in
      HPC shops where a single node-attribute database can drive boot scripts, batch
      queue generation, parallel command targeting, and role-specific service startup.
    - >
      Package-manager adoption across Homebrew, Debian, Fedora/DNF, Ubuntu, MacPorts,
      and SUSE-family systems reflects its long-lived role as a small Unix
      administration primitive rather than a fast-moving end-user application.
  package-nerd-significance:
    - >
      Genders is package-nerd significant because it preserves an older but durable Unix
      cluster-management pattern: a replicated text database plus fast local query
      tools. Its value is not novelty; it is that administrators can carry the same
      simple file format and `nodeattr` command across clusters and distributions.
  project-history:
    - >
      Genders originated at Lawrence Livermore National Laboratory's Livermore Computing
      environment, with tutorial material dated June 19, 2000 and public repository
      history imported in 2001. The package was written around the needs of massively
      parallel processing clusters, where scripts needed to adapt to node roles without
      embedding hard-coded host lists.
    - >
      The software grew from a plain cluster attribute file into a small ecosystem:
      libgenders in C, Perl APIs, `nodeattr`, compatibility scripts, and later C++,
      Java, Python, and other extension work. Its NEWS file records years of practical
      cluster-admin improvements, including hostrange support, query parsing,
      performance work for large clusters, and database compression or expansion
      commands.
  related-projects:
    - >
      Genders is related to LLNL Livermore Computing tools, hostlist/hostrange
      utilities, HPC batch systems, cluster boot scripts, and configuration-management
      systems that consume node role information.
  sources:
    - https://formulae.brew.sh/formula/genders
    - https://github.com/chaos/genders
    - https://raw.githubusercontent.com/chaos/genders/master/NEWS
    - https://raw.githubusercontent.com/chaos/genders/master/README
    - https://raw.githubusercontent.com/chaos/genders/master/TUTORIAL
  summary:
    - >
      Genders is a static cluster configuration database for high-performance computing
      and cluster administration. It stores node names and attributes in a replicated
      plain-text file, then lets tools such as `nodeattr` and libraries such as
      libgenders query those attributes locally.
  timeline:
    - >
      2000-06-19: Original tutorial material documents the concept for LLNL cluster
      configuration management.
    - '2001: Public repository history is imported and early 0.x tags appear.'
    - >
      2003-2004: Tutorial revisions and 1.x package history document broader nodeattr
      and libgenders usage.
    - >
      2010s-2020s: NEWS and tutorial updates document performance work, hostrange
      features, extension cleanup, and large-cluster usage.
  usage:
    - >
      Practitioners edit `/etc/genders` or another genders file to assign attributes
      such as compute, login, management, queue membership, network role, or route data
      to node names and host ranges. They then run `nodeattr` to list matching nodes,
      check whether the local node has an attribute, retrieve values, validate the
      database, or expand and compress host ranges.
    - >
      The classic workflow is to replace brittle script logic with attribute queries: a
      common rc script can ask whether the node has the `login` or `raid` attribute,
      while batch configuration scripts can generate host lists from queue attributes.
related-packages:
  - id: brew:pdsh
    reason: >
      pdsh has an official libgenders module that selects or filters nodes by Genders
      attributes before executing commands across them in parallel.
    rel: adjacent_workflow
    sources:
      - https://github.com/chaos/genders#readme
      - https://github.com/chaos/pdsh#readme
      - https://github.com/chaos/pdsh/blob/master/pdsh.spec
category: system
