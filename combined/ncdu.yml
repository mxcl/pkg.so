id: brew:ncdu
display-name: ncdu
homepage: https://dev.yorhel.nl/ncdu
repo: https://code.blicky.net/yorhel/ncdu
docs:
  - https://dev.yorhel.nl/ncdu
config-file-location:
  unix:
    - /etc/ncdu.conf
    - ~/.config/ncdu/config
credentials-file-location: null
history:
  adoption-history:
    - >
      ncdu is the standout adoption story in this batch. It is packaged across Homebrew,
      Debian, Ubuntu, Fedora, Arch, Alpine, Nix, MacPorts, and other ecosystems, and the
      Homebrew formula API response consulted for this July 2026 batch reported 2,878
      install-on-request events in 30 days and 56,718 in 365 days.
  package-nerd-significance:
    - >
      ncdu is a canonical example of a small Unix tool that beats heavier GUI
      alternatives for a frequent operations problem. It sits next to `du`, `find`, and
      `df`: not replacing them, but turning their disk-usage data into an interactive
      browser that is comfortable over SSH.
  project-history:
    - >
      The 1.x release history reaches a first stable release on 2007-04-06. The project
      matured around practical filesystem inspection: deletion from the UI in 1.1,
      apparent-size/disk-usage toggling and refresh in 1.3, hard-link detection in 1.6,
      export/import workflows in 1.9, extended file information in 1.13, and many
      portability fixes for Linux, macOS, Cygwin, and other Unix-like environments.
    - >
      The project later split into a maintained C 1.x branch and a Zig 2.x branch. The
      2.0 beta line began on 2021-07-22 with features based on ncdu 1.16, lower memory
      use in many scenarios, and improved hard-link counting; 2.0 followed on 2021-12-21
      requiring Zig 0.9. Upstream describes 1.x as an LTS C version that lags on
      features and performance but remains maintained and usable.
  related-projects:
    - du, ncurses, Zig, POSIX filesystems
  sources:
    - https://dev.yorhel.nl/ncdu
    - https://dev.yorhel.nl/ncdu/changes
    - https://dev.yorhel.nl/ncdu/changes2
    - https://formulae.brew.sh/api/formula/ncdu.json
  summary:
    - >
      ncdu, NCurses Disk Usage, is a text-mode disk usage analyzer built for finding
      space hogs where a graphical disk viewer is unavailable or unwanted. Upstream
      explicitly frames it as fast, simple, easy to use, and portable across POSIX-like
      systems.
  timeline:
    - '2007-04-06: ncdu 1.0 first stable release.'
    - '2012-09-27: 1.9 added dump-to-file and load-from-file workflows.'
    - '2018-01-29: 1.13 added extended information mode and experimental color support.'
    - '2021-07-22: 2.0-beta1 announced the Zig branch based on ncdu 1.16.'
    - '2025-03-05: 1.22 and 2.8 landed on the maintained C and Zig lines.'
  usage:
    - >
      The common package-nerd workflow is `ncdu /path` on servers, containers, build
      machines, and full developer laptops, followed by keyboard navigation into large
      directories and cautious deletion from inside the TUI. It is also used
      non-interactively by exporting scans with `-o` and reloading them with `-f`, which
      is useful when collecting filesystem data from a remote or restricted environment
      and inspecting it later.
related-packages:
  - id: brew:gdu
    reason: >
      Choose gdu for parallel SSD-oriented scanning, noninteractive output, database
      storage, or a web UI; it can also import ncdu-compatible JSON scans.
    rel: alternative
    sources:
      - https://dev.yorhel.nl/ncdu
      - https://github.com/dundee/gdu
  - id: brew:dua-cli
    reason: >
      Choose dua-cli when fast parallel traversal and broader aggregate, interactive,
      and cleanup workflows are preferable to ncdu's established ncurses-style browser.
    rel: alternative
    sources:
      - https://dev.yorhel.nl/ncdu
      - https://github.com/Byron/dua-cli
  - id: brew:duc
    reason: >
      Choose duc for repeated analysis of very large filesystems through a persistent
      index and multiple CLI, ncurses, graphical, or web front ends.
    rel: alternative
    sources:
      - https://dev.yorhel.nl/ncdu
      - https://github.com/zevv/duc
  - id: brew:diskonaut
    reason: >
      Choose diskonaut when an interactive terminal treemap is more useful than ncdu's
      conventional directory-list interface.
    rel: alternative
    sources:
      - https://dev.yorhel.nl/ncdu
      - https://github.com/imsnif/diskonaut
category: system
