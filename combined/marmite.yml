id: brew:marmite
display-name: Marmite
homepage: https://rochacbruno.github.io/marmite/
repo: https://github.com/rochacbruno/marmite
docs:
  - https://github.com/rochacbruno/marmite#readme
  - https://rochacbruno.github.io/marmite
config-file-location:
  unix:
    - marmite.yaml
    - file supplied with --config
credentials-file-location: null
history:
  adoption-history:
    - >
      Marmite is younger than the long-running Markdown tools in this batch, but it
      gathered visible early interest: by 2026-07-01 GitHub metadata showed 856 stars
      and 51 forks. The supplied package-manager facts list Homebrew and Nix packages,
      and the README documents Homebrew and Cargo installation paths.
    - >
      Release notes through 2025 and 2026 show the project moving from early static-site
      basics into feeds, themes, IndieWeb/microformats, search, series, shortcodes, and
      other blog-focused features while keeping a simple CLI entry point.
  package-nerd-significance:
    - >
      Marmite's packaging story is simple and attractive: a compiled CLI, Homebrew/Nix
      availability, and Cargo installation. That is exactly the kind of static-site tool
      package managers like because it gives users a self-contained generator with few
      runtime surprises.
  project-history:
    - >
      The Marmite repository was created on 2024-10-14. The README expands the name as
      'Markdown makes sites' and describes the project as a very simple static-site
      generator for bloggers.
    - >
      Its official documentation and example content emphasize low setup: a directory of
      Markdown and media files can become a blog without adopting a rigid folder
      structure. The CLI defaults to marmite.yaml for configuration and accepts --config
      for an alternate file.
  related-projects:
    - >
      Marmite belongs to the static-site-generator family alongside Hugo, Zola, Jekyll,
      and other Markdown-to-site tools.
    - >
      It uses CommonMark/GitHub Flavored Markdown style input and focuses on blog
      publishing workflows.
  sources:
    - https://github.com/rochacbruno/marmite
    - https://marmite.blog/
    - https://raw.githubusercontent.com/rochacbruno/marmite/main/README.md
    - source_facts.repo
  summary:
    - >
      Marmite is a Rust static-site generator for blogs built around the idea that
      Markdown files plus one command should be enough to publish a site.
  timeline:
    - '2024: GitHub repository created.'
    - '2025: 0.2.x releases expanded blog, theme, feed, and publishing features.'
    - '2026: 0.3.x releases continued with binary assets and documentation updates.'
  usage:
    - >
      The core command is marmite INPUT_FOLDER OUTPUT_FOLDER. Users point Marmite at a
      folder of Markdown files and media, optionally provide marmite.yaml or --config,
      and generate a static output directory that can be served by any static host.
    - >
      Package maintainers care about Marmite because it is a single Rust CLI in the
      crowded static-site-generator category, aiming for low-friction blogging rather
      than a large framework or JavaScript build pipeline.
related-packages:
  - id: brew:zola
    reason: >
      Choose Zola when you need a more general structured static-site generator with
      sections, Sass, image processing, multilingual sites, and extensive deployment
      support; Marmite emphasizes low-setup chronological blogging.
    rel: alternative
    sources:
      - https://github.com/rochacbruno/marmite#thats-all
      - https://www.getzola.org/documentation/getting-started/overview/
  - id: brew:cobalt
    reason: >
      Choose Cobalt when you prefer its general static-site workflow, Liquid templates,
      and explicit site structure; Marmite is optimized for turning a loose Markdown
      directory into a blog with minimal setup.
    rel: alternative
    sources:
      - https://github.com/rochacbruno/marmite#thats-all
      - https://cobalt-org.github.io/docs/
category: developer-tools
package-manager:
  brew: marmite
  nix: marmite
  pacman: marmite
package-manager-url: https://formulae.brew.sh/formula/marmite
license: AGPL-3.0-or-later
tags:
  - blog
  - cli
  - markdown
  - static-site-generator
description: Static Site Generator for Blogs using Markdown
executables:
  - marmite
provenance:
  formula: marmite
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
