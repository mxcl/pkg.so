id: brew:mavsdk
display-name: MAVSDK
homepage: https://mavsdk.mavlink.io/main/en/index.html
repo: https://github.com/mavlink/MAVSDK
docs:
  - https://mavsdk.mavlink.io/main/en
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official MAVSDK C++ documentation says the library is used in production
      environments, while still warning that the API continues to evolve. The project is
      most closely associated with PX4 and MAVLink workflows, with ArduPilot
      compatibility added gradually as functionality is tested.
  package-nerd-significance:
    - >
      MAVSDK is package-nerdy because it packages a robotics protocol stack into a
      conventional SDK shape: native library, generated protocol definitions,
      language-specific clients, and a server process that bridges MAVLink to gRPC.
  project-history:
    - >
      The official repository describes MAVSDK as a set of libraries providing a
      high-level API to MAVLink, implemented around a C++ core, plugin libraries, and
      `mavsdk_server` for language clients. Earlier documentation releases tied MAVSDK
      docs to DroneCore releases, showing the project's earlier DroneCore naming before
      the MAVSDK identity settled.
    - >
      The architecture grew around generated language bindings: the repository lists
      MAVSDK-Proto as the common interface definition, plus Python, Swift, Java, Go,
      JavaScript, and Rust client projects at different maturity levels.
  related-projects:
    - >
      MAVLink, PX4, ArduPilot, QGroundControl, MAVSDK-Proto, MAVSDK-Python,
      MAVSDK-Swift, MAVSDK-Java
  sources:
    - https://github.com/mavlink/MAVSDK
    - https://github.com/mavlink/MAVSDK-docs/releases
    - https://mavsdk.mavlink.io/main/en/cpp/guide/general_usage.html
    - https://mavsdk.mavlink.io/main/en/cpp/index.html
    - https://mavsdk.mavlink.io/main/en/cpp/quickstart.html
  summary:
    - >
      MAVSDK is the MAVLink project's high-level SDK for building applications that
      communicate with MAVLink vehicles, especially drones and other aircraft.
  timeline:
    - '2018: DroneCore-era documentation releases v0.3.0, v0.4.0, and v0.5.0.'
    - '2018: Official repository notes MAVSDK-Swift was first released and used in production.'
    - >
      2019: Official repository notes MAVSDK-Python and MAVSDK-Java first public package
      releases.
    - >
      2026: MAVSDK repository presents C++ core, proto definitions, server, and multiple
      language clients under the MAVSDK name.
  usage:
    - >
      Package-manager users typically install MAVSDK to get the C++ library and
      `mavsdk_server`, then connect code to a MAVLink system or simulator. The C++
      quickstart explicitly documents Homebrew installation on macOS and shows the
      common simulator-driven takeoff-and-land workflow.
related-packages:
  - id: cask:qgroundcontrol
    reason: >
      Use QGroundControl alongside MAVSDK when you need a graphical ground station to
      observe and interact with the PX4 vehicle or simulator controlled by an SDK
      application.
    rel: adjacent_workflow
    sources:
      - https://mavsdk.mavlink.io/main/en/cpp/quickstart.html
      - >
        https://docs.qgroundcontrol.com/master/en/qgc-user-guide/getting_started/download_and_install.html
category: developer-tools
