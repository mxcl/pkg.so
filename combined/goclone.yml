id: brew:goclone
display-name: goclone
homepage: https://goclone.dev
repo: https://github.com/goclone-dev/goclone
docs:
  - https://github.com/goclone-dev/goclone#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub repository metadata showed more than two thousand stars and several hundred
      forks by June 2026, which is notable for a single-purpose website cloner. Homebrew
      packages it as formula `goclone`, giving macOS and Linux users a package-manager
      path in addition to upstream Go builds.
    - >
      The adoption footprint is centered on developer and archiving workflows: people
      who want a fast terminal tool to copy a public site for inspection, offline
      browsing, demos, or migration experiments.
  package-nerd-significance:
    - >
      Package nerds care about goclone because it is a compact example of the Go CLI
      distribution loop: a GitHub-hosted binary tool, a project-specific Homebrew tap,
      `go install` support, and later a normal Homebrew formula. It also sits in the
      long lineage of website mirroring tools while using Go's goroutine-friendly
      concurrency model.
  project-history:
    - >
      The public goclone repository was created in March 2020 and published a v1.0.0
      GitHub release the same day. The README describes the project as a utility for
      downloading HTML, CSS, JavaScript, images, and related files from a website into a
      local directory while preserving relative link structure.
    - >
      The project was organized under the goclone-dev GitHub organization and paired
      with an official goclone.dev site. Its installation story started with an upstream
      Homebrew tap and later fit the standard Go CLI pattern of `go install
      github.com/goclone-dev/goclone/cmd/goclone@...` plus Homebrew packaging.
  related-projects:
    - wget and HTTrack are older website mirroring tools in the same general space.
    - Colly is the Go scraping framework referenced by goclone's proxy flag documentation.
    - >
      The goclone-dev/homebrew-goclone repository was the upstream tap used before
      broader Homebrew formula packaging.
  sources:
    - https://api.github.com/repos/goclone-dev/goclone
    - https://api.github.com/repos/goclone-dev/goclone/releases
    - https://formulae.brew.sh/api/formula/goclone.json
    - https://github.com/goclone-dev/goclone
    - https://github.com/goclone-dev/goclone/releases
    - https://goclone.dev/
  summary:
    - >
      goclone is a Go command-line website mirroring tool. It packages the old
      wget-style idea of copying a site locally into a small Go CLI with concurrent
      crawling, local link rewriting, and optional serving or opening of the generated
      copy.
  timeline:
    - '2020-03: GitHub repository created and v1.0.0 released.'
    - '2021-11: v1.2.0 released.'
    - '2023-06: v1.2.1 released.'
    - '2025-08: v1.2.2 released.'
  usage:
    - >
      Typical usage is `goclone <url>`. The README documents flags for preset cookies, a
      custom user agent, proxy settings, automatically opening the result, and serving
      the generated files locally.
    - >
      Because it rewrites links and pulls static assets into a local directory, goclone
      is useful for quick site snapshots. It is not a browser automation tool or a full
      crawler for dynamic application state.
related-packages:
  - id: brew:httrack
    reason: >
      Choose HTTrack for mature recursive mirroring with resume, incremental updates,
      detailed filters, and graphical front ends; choose goclone for a smaller Go CLI
      with convenient local serving.
    rel: alternative
    sources:
      - https://github.com/goclone-dev/goclone
      - https://www.httrack.com/html/index.html
  - id: brew:wget
    reason: >
      Choose GNU Wget when you need a general scripted downloader with recursive
      retrieval, retries, timestamping, and established mirroring controls rather than a
      website-cloning-focused interface.
    rel: alternative
    sources:
      - https://github.com/goclone-dev/goclone
      - https://www.gnu.org/software/wget/manual/wget.html
category: developer-tools
