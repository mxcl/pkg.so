id: brew:gnu-complexity
display-name: GNU Complexity
homepage: https://www.gnu.org/software/complexity/
repo: https://git.savannah.gnu.org/cgit/complexity.git
docs:
  - https://www.gnu.org/software/complexity/manual
config-file-location:
  unix:
    - $(pkgdatadir)/complex.conf
    - ~/.complexityrc
    - $PROJECT_ROOT/complex.conf
    - $PWD/.complexityrc
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Complexity has a narrow adoption footprint compared with larger GNU developer
      tools. Its significance is in the code-review and maintenance niche: it gives C
      maintainers a command-line metric that can point to suspicious functions in
      unfamiliar code, estimate testing or comprehension effort, and produce sorted
      score tables and histograms.
  package-nerd-significance:
    - >
      For package nerds, GNU Complexity is interesting because it embodies a Unix-tool
      approach to maintainability: one command, text output, tunable thresholds, and a
      documented scoring model. It is useful in distributions as a lightweight companion
      to older tools such as `pmccabe` rather than as a large static-analysis framework.
  project-history:
    - >
      The GNU Complexity manual documents version 0.4 as of May 2011 and describes a
      tool by Bruce Korb for analyzing C function complexity. Its rationale is explicit:
      McCabe-style scoring and `pmccabe` are useful for testing effort, but GNU
      Complexity tries to better rank functions that are difficult for humans to
      understand by considering length, nesting, switch bodies, and complicated boolean
      expressions.
  related-projects:
    - `pmccabe` is the comparison point used throughout the GNU Complexity manual.
    - >
      `unifdef` is discussed in the parsing model as a way to handle
      preprocessor-conditional source.
  sources:
    - https://www.gnu.org/software/complexity/
    - https://www.gnu.org/software/complexity/manual/complexity.html
  summary:
    - >
      GNU Complexity is a small GNU static-analysis tool for measuring the complexity of
      C functions, designed as a more human-comprehension-oriented alternative to simple
      McCabe-style path counts.
  timeline:
    - '2011: GNU Complexity web page and manual documented version 0.4.'
    - >
      2011: Manual rationale compared GNU Complexity with `pmccabe` and explained its
      scoring model.
  usage:
    - >
      Practitioners run `complexity` over C source files to report procedure scores,
      line counts, source locations, and optional histograms. The manual's example runs
      the tool against its own source with a low threshold, illustrating use as a quick
      audit tool for ranking functions before refactoring or review.
related-packages:
  - id: brew:pmccabe
    reason: >
      pmccabe is the traditional McCabe-style C/C++ complexity analyzer that GNU
      Complexity's manual compares against; choose it when cyclomatic path counts are
      the desired metric.
    rel: alternative
    sources:
      - https://www.gnu.org/software/complexity/manual/complexity.html
      - https://pmccabe.gitlab.io/pmccabe/pmccabe.html
  - id: brew:unifdef
    reason: >
      GNU Complexity can invoke unifdef through its -u option to remove selected
      conditional-compilation branches before scoring C source.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/complexity/manual/complexity.html
      - https://dotat.at/prog/unifdef/unifdef.txt
category: developer-tools
package-manager:
  brew: gnu-complexity
  debian: complexity
  nix: complexity
  ubuntu: complexity
  zypper: complexity
package-manager-url: https://formulae.brew.sh/formula/gnu-complexity
license: GPL-3.0-or-later
tags:
  - c
  - cli
  - code-metrics
  - complexity-analysis
  - static-analysis
description: Measures complexity of C source
executables:
  - complexity
  - cx-vs-mc
provenance:
  formula: gnu-complexity
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
