id: brew:reg
display-name: reg
homepage: https://github.com/genuinetools/reg
repo: https://github.com/genuinetools/reg
docs:
  - https://github.com/genuinetools/reg#readme
config-file-location: null
credentials-file-location:
  unix: ~/.docker/config.json
history:
  adoption-history:
    - >
      The supplied metadata records reg packages in Alpine Linux, Homebrew, and Nix,
      reflecting distribution across container-oriented and Unix package ecosystems.
  package-nerd-significance:
    - >
      reg packaged several registry-maintenance and inspection workflows into one small
      executable, including repository and tag listing, manifest and layer inspection,
      image deletion, static site generation, and security checks.
  project-history:
    - >
      reg was developed within the genuinetools collection as a Go command-line client
      and repository-listing generator for Docker Registry HTTP API V2 services. Its
      official repository is now archived and read-only.
  related-projects:
    - >
      reg operates against Docker Registry v2 and Docker Distribution-compatible
      services and complements Docker's own command-line tooling.
  sources:
    - https://github.com/genuinetools/reg#readme
    - source_facts.package-manager
  summary:
    - >
      reg is an archived command-line client for inspecting and managing Docker Registry
      v2 repositories, with listing generation and security-check features.
  timeline:
    - Project published in the genuinetools collection.
    - Project packaged by Alpine Linux, Homebrew, and Nix.
    - 'Later: Official repository archived and made read-only.'
  usage:
    - >
      Use `reg` to list registry repositories and tags, inspect manifests and image
      layers, download or delete images, run supported vulnerability checks, or generate
      a static registry listing. Connection and authentication values are supplied
      through command options or environment variables documented by the README.
category: developer-tools
package-manager:
  apk: reg
  brew: reg
  nix: reg
package-manager-url: https://formulae.brew.sh/formula/reg
license: MIT
tags:
  - cli
  - container
  - docker
  - go
  - registry
description: Docker registry v2 command-line client
executables:
  - reg
provenance:
  formula: reg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
