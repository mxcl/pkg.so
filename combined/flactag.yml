id: brew:flactag
display-name: flactag
homepage: https://flactag.sourceforge.net/
repo: https://sourceforge.net/p/flactag/code
docs:
  - https://flactag.sourceforge.net/
config-file-location:
  unix: ~/.flactag
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream documentation focuses on a narrow archival workflow rather than broad
      consumer adoption. It includes mailing-list references and scripts such as
      ripflac, ripdataflac, checkflac, and discid, which points to use by collectors and
      Unix audio archivists maintaining carefully tagged FLAC libraries.
  package-nerd-significance:
    - >
      flactag is interesting because it combines several old-school media packaging
      concerns: FLAC metadata, embedded CUE sheets, MusicBrainz identity, terminal UI
      libraries, CD disc IDs, and safe-ish batch renaming.
    - >
      For package maintainers it is a dependency-heavy but focused CLI, tying together
      libmusicbrainz, libflac++, S-Lang, libneon, unac, libjpeg, and AsciiDoc-era
      documentation.
  project-history:
    - >
      The official site presents flactag as a utility for tagging single-album FLAC
      files with embedded CUE sheets from MusicBrainz. Its version history starts with
      an initial version and then records additions such as MusicBrainz tag storage,
      file renaming, cover-art embedding, multi-file command-line handling, UTF-8 tag
      writing, disc ID reporting, request throttling, CUE generation, and updates for
      newer MusicBrainz libraries.
    - >
      The project belongs to the era of whole-CD FLAC archiving, where a user might rip
      an entire album into one FLAC file, preserve the CUE sheet, and then need the
      resulting file to carry reliable album and track metadata.
  related-projects:
    - FLAC, MusicBrainz, CUE sheets, libmusicbrainz, libflac++, S-Lang, SourceForge.
  sources:
    - https://flactag.sourceforge.net/
    - https://sourceforge.net/p/flactag/code
  summary:
    - >
      flactag is a specialist FLAC tagging utility for single-album FLAC files with
      embedded CUE sheets, using MusicBrainz data to identify and write album metadata.
  timeline:
    - '2000s: Initial version created for MusicBrainz-backed FLAC tagging.'
    - >
      2000s-2010s: Added cover art, batch command-line operation, disc ID reporting,
      UTF-8 tag writing, and file renaming.
    - >
      2010s: Updated for newer MusicBrainz libraries, including libmusicbrainz4 and
      libmusicbrainz5.
  usage:
    - >
      Interactive use processes FLAC files passed as arguments, queries MusicBrainz by
      disc ID, lets the user choose an album, copies tags into the tag window, and
      writes them with the w key. Batch options can check, write, force-write, rename,
      overwrite existing files, override the disc ID, or print MusicBrainz submission
      URLs.
    - >
      The configuration file ~/.flactag controls renaming behavior, including filename
      formats and whether to generate a cuesheet after rename.
related-packages:
  - id: brew:beets
    reason: >
      Choose beets for MusicBrainz-backed tagging and organization of a general
      multi-file music library; choose flactag for its specialized single-file FLAC and
      embedded-CUE workflow.
    rel: alternative
    sources:
      - https://flactag.sourceforge.net/
      - https://beets.readthedocs.io/en/stable/guides/tagger.html
  - id: brew:flac
    reason: >
      FLAC supplies the format and reference command-line tools used to create, inspect,
      and test the files that flactag subsequently identifies and tags.
    rel: adjacent_workflow
    sources:
      - https://flactag.sourceforge.net/
      - https://xiph.org/flac/documentation_tools.html
category: media
package-manager:
  brew: flactag
  debian: flactag
  ubuntu: flactag
package-manager-url: https://formulae.brew.sh/formula/flactag
license: GPL-3.0-or-later
tags:
  - cli
  - cue-sheets
  - flac
  - metadata
  - musicbrainz
  - tagging
description: Tag single album FLAC files with MusicBrainz CUE sheets
executables:
  - checkflac
  - discid
  - flactag
  - ripdataflac
  - ripflac
provenance:
  formula: flactag
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
