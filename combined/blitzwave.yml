repo: https://github.com/oschulz/blitzwave
docs:
  - https://oschulz.github.io/blitzwave
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public package adoption appears modest but real: the input metadata records
      Homebrew and MacPorts packages. That is typical for a compact scientific C++
      library whose user base is more likely to be downstream researchers and build
      systems than a broad CLI audience.
  package-nerd-significance:
    - >
      blitzwave is notable as a survivor of the template-heavy scientific C++ ecosystem
      around Blitz++. Its package-manager value is less about popularity and more about
      keeping older numerical software buildable without vendoring a specialist wavelet
      library.
  project-history:
    - >
      The official README describes blitzwave as a C++ wavelet mini-library that
      supports wavelet decompositions of n-dimensional arrays across numerical data
      types, allows user-defined wavelets, and includes ready-to-use wavelets. GitHub
      metadata dates the repository to 2012, with tags visible for the 0.7 and 0.8
      release line.
    - >
      The README says the library is stable, mathematically correct, and has been used
      in production for several scientific projects known to the author, while noting
      that minor API changes may still occur.
  related-projects:
    - Blitz++ is the array template library blitzwave builds on.
    - WAILI is named in the README as a performance comparison point.
    - Wavelet libraries and scientific C++ build tooling are the main adjacent ecosystem.
  sources:
    - GitHub repository metadata via gh api repos/oschulz/blitzwave
    - https://github.com/oschulz/blitzwave#readme
    - https://oschulz.github.io/blitzwave
    - source_facts.package-manager
  summary:
    - >
      blitzwave is a small C++ wavelet mini-library built on the Blitz++ array template
      library. It sits in the scientific-computing corner of package indexes: niche,
      old-school C++, and useful when a project wants templated n-dimensional wavelet
      decomposition without a large framework.
  timeline:
    - '2012: Official GitHub repository created.'
    - >
      2010s: README documents blitzwave as stable and used in several scientific
      production projects.
    - 'Package era: Homebrew and MacPorts carry blitzwave for Unix-like scientific builds.'
  usage:
    - >
      The package installs `blitzwave-config`, reflecting a library-oriented workflow
      where build scripts query compiler and linker flags. Developers use blitzwave from
      C++ code together with Blitz++ arrays rather than as an end-user command-line
      tool.
related-packages: []
