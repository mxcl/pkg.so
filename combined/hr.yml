id: brew:hr
display-name: hr
homepage: https://github.com/LuRsT/hr
repo: https://github.com/LuRsT/hr
docs:
  - https://github.com/LuRsT/hr/wiki
  - https://github.com/LuRsT/hr#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption footprint is small but package-manager friendly. The input metadata
      records packages for Homebrew, MacPorts, Nix, and Alpine, matching the kind of
      small Unix utility that survives because it is scriptable, dependency-light, and
      easy to vendor.
  package-nerd-significance:
    - >
      hr is package-nerd candy because it is the whole Unix small-tool philosophy
      reduced to a visual separator: no service, no state, no configuration, just a
      command that composes with a shell session.
  project-history:
    - >
      The project presents itself as a minimal terminal helper: a single shell script
      using POSIX shell and tput, installable by copying the script, running make
      install, or installing the Homebrew formula on macOS.
  related-projects:
    - >
      Related tools include shell prompt theming, terminal log separators, and ad hoc
      printf or tput snippets that users often keep in shell profiles.
  sources:
    - https://formulae.brew.sh/formula/hr
    - https://github.com/LuRsT/hr#readme
    - https://github.com/LuRsT/hr/wiki
  summary:
    - >
      hr is a tiny POSIX-shell command that prints horizontal rules across a terminal
      window, usually to visually separate logs, command output, or debugging sessions.
  timeline:
    - '1.0: Public tagged release in the upstream Git repository.'
    - '1.5: Later tagged release in the upstream Git repository.'
    - 'Homebrew formula: Packaged as brew:hr according to input metadata.'
  usage:
    - >
      The README shows hr with no arguments for a default rule, with a custom character
      such as '*', and with multiple arguments to produce stacked ASCII patterns.
related-packages: []
category: system
package-manager:
  apk: hr
  brew: hr
  macports: hr
  nix: hr
package-manager-url: https://formulae.brew.sh/formula/hr
license: MIT
tags:
  - cli
  - horizontal-rule
  - shell
  - terminal
description: for your terminal window
executables:
  - hr
provenance:
  formula: hr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
