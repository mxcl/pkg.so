id: brew:fish-lsp
display-name: fish-lsp
homepage: https://www.fish-lsp.dev
repo: https://github.com/ndonfris/fish-lsp
docs:
  - https://github.com/ndonfris/fish-lsp#readme
  - https://www.fish-lsp.dev/
config-file-location:
  unix: $__fish_config_dir/config.fish
credentials-file-location: null
history:
  adoption-history:
    - >
      fish-lsp is packaged for multiple developer workflows: the official README
      documents npm, yarn, pnpm, Nix, Homebrew, conda, mamba, standalone GitHub release
      binaries, and source builds. It also links client configuration examples and
      nvim-lspconfig integration, which is a strong signal that adoption is
      editor-driven.
  package-nerd-significance:
    - >
      For package nerds, fish-lsp is notable because it turns fish from an interactive
      shell with nice built-ins into a language that participates in the modern
      LSP/editor tooling stack. It also has unusually broad distribution paths for a
      young shell-specific tool.
  project-history:
    - >
      The project was created in 2022 as the fish ecosystem was increasingly used for
      larger personal shell configurations and scripts. Its README positions the server
      as an editor-agnostic way to give fish users a consistent development environment
      rather than depending on each editor's local fish support.
  related-projects:
    - >
      Related projects include fish shell, the Language Server Protocol, editor LSP
      clients, nvim-lspconfig, and fish completion tooling.
  sources:
    - https://github.com/ndonfris/fish-lsp
    - https://github.com/ndonfris/fish-lsp/releases
    - https://www.fish-lsp.dev/
  summary:
    - >
      fish-lsp is a Language Server Protocol implementation for the fish shell language,
      bringing editor features such as completions, hover, goto definition, formatting,
      diagnostics, rename, symbols, semantic tokens, and inlay hints to fish scripts.
  timeline:
    - '2022: GitHub repository created.'
    - '2025: 1.0.x releases established regular packaged releases.'
    - '2026: 1.1.4 published, with releases continuing through GitHub and package managers.'
  usage:
    - >
      A normal setup installs the `fish-lsp` binary, configures an editor language
      client to run `fish-lsp start` for fish files, and optionally installs shell
      completions with `fish-lsp complete > ~/.config/fish/completions/fish-lsp.fish`.
related-packages:
  - id: brew:fish
    reason: >
      fish is the language runtime and configuration environment that fish-lsp parses,
      indexes, and augments inside editors.
    rel: adjacent_workflow
    sources:
      - https://www.fish-lsp.dev/
      - https://fishshell.com/docs/current/
  - id: brew:neovim
    reason: >
      fish-lsp officially documents Neovim client configuration that starts `fish-lsp
      start` for fish buffers.
    rel: adjacent_workflow
    sources:
      - https://github.com/ndonfris/fish-lsp#client-configuration-required
      - https://neovim.io/doc/user/lsp.html
category: developer-tools
package-manager:
  brew: fish-lsp
  nix: fish-lsp
package-manager-url: https://formulae.brew.sh/formula/fish-lsp
license: MIT
tags:
  - cli
  - diagnostics
  - editor-integration
  - fish-shell
  - formatting
  - language-server
  - lsp
description: LSP implementation for the fish shell language
executables:
  - fish-lsp
provenance:
  formula: fish-lsp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
