id: brew:i2p
display-name: I2P
homepage: https://geti2p.net
repo: https://github.com/i2p/i2p.i2p
docs:
  - https://geti2p.net/en/docs
config-file-location:
  linux:
    - ~/.i2p/router.config
    - ~/.i2p/wrapper.config
    - ~/.i2p/i2ptunnel.config
    - /var/lib/i2p/i2p-config/i2ptunnel.config
  macos: ~/Library/Application Support/i2p/router.config
credentials-file-location: null
history:
  adoption-history:
    - >
      I2P's adoption came from privacy-conscious users and developers who wanted an
      application-oriented anonymous network distinct from Tor's exit-to-clearnet model.
      Official docs emphasize interactive services inside the network, including web
      hosting, bulletin boards, search, chat, file sharing, mail, blogs, and content
      syndication.
    - >
      Package managers make I2P easier to deploy as a background router. Homebrew
      exposes eepget and i2prouter, while other ecosystems distribute installers or
      packages for desktop, server, and Android use.
  package-nerd-significance:
    - >
      I2P is package-nerd significant because it packages an entire privacy network as
      local executables and services. A package install is not merely a CLI tool; it
      brings a router, update machinery, bundled apps, Java dependencies, and network
      bootstrap behavior.
    - >
      It also shows how privacy infrastructure has to balance repository mirrors, signed
      installers, platform-specific bundles, and package-manager formulas without
      reducing trust to a single download path.
  project-history:
    - >
      The official I2P overview describes the project as an engineering effort, not an
      academic or commercial research project, and says active development began in
      early 2003. Its architecture centers on routers, destinations, unidirectional
      inbound and outbound tunnels, garlic-encrypted messages, and a distributed network
      database.
    - >
      The i2p.i2p repository is the reference Java implementation. The README points to
      platform installers, documentation, package-building instructions, and I2P's
      separate bug-tracking surfaces. GitHub mirrors and release assets provide a
      conventional source distribution path while I2P's own site remains the user-facing
      download and documentation hub.
    - >
      Over time the project evolved from core anonymizing-router work into a bundled
      application environment with I2PTunnel, I2PSnark, Susimail, address books,
      streaming APIs, plugin/application support, and cross-platform packaging.
  related-projects:
    - >
      Related projects include i2pd, I2PTunnel, I2PSnark, Susimail, I2P-Bote, I2Phex,
      Tor, Freenet, GNUnet, and the I2P specifications maintained by the project.
  sources:
    - https://formulae.brew.sh/formula/i2p
    - https://github.com/i2p/i2p.i2p
    - https://i2p.net/en/docs/overview/intro/
    - https://i2p.net/en/docs/overview/network-database/
  summary:
    - >
      I2P, the Invisible Internet Project, is a Java reference implementation of an
      anonymous overlay network. It provides a private network layer for applications
      such as anonymous web sites, chat, file sharing, mail, and other services that
      communicate through I2P destinations rather than ordinary public IP endpoints.
  timeline:
    - '2003: I2P active development began, according to the official overview.'
    - '2012: The i2p.i2p GitHub repository was created as a public source mirror.'
    - >
      2024: I2P 2.6.0 release notes described reliability work, I2PSnark improvements,
      transport simplification, and peer-selection changes.
    - >
      2026: I2P release assets continued to be published from i2p.net through GitHub
      release tags.
  usage:
    - >
      Users run an I2P router, then connect applications to local services such as HTTP
      proxies, I2PTunnel, or application APIs. The network handles tunnel selection,
      lease sets, router info lookups, and end-to-end encrypted message delivery.
    - >
      Developers use I2P when they want application traffic to stay inside an anonymous
      overlay rather than leave through exit nodes. The Java implementation also serves
      as the reference for specifications and behavior used by related clients.
related-packages:
  - id: brew:i2pd
    reason: >
      Choose i2pd for a stable, fully compatible C++ I2P router suited to servers or
      lower-resource systems; choose Java I2P for the standard full router with its
      broader bundled console, plugin, and application environment.
    rel: alternative
    sources:
      - https://i2p.net/en/docs/overview/alternative-clients/
      - https://github.com/PurpleI2P/i2pd
      - https://github.com/i2p/i2p.i2p
category: networking
package-manager:
  brew: i2p
  chocolatey: i2p
  nix: i2p
  scoop: main/i2p
package-manager-url: https://formulae.brew.sh/formula/i2p
license: LicenseRef-Homebrew-cannot-represent
tags:
  - anonymous-network
  - cli
  - java
  - overlay-network
  - p2p
  - privacy
description: Anonymous overlay network - a network within a network
executables:
  - eepget
  - i2prouter
provenance:
  formula: i2p
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
