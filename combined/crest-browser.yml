history:
  adoption-history:
    - >
      Crest is distributed directly for Apple platforms, with signed macOS releases
      published through GitHub and mobile distribution intended for TestFlight and the
      App Store. It is also packaged as a Homebrew cask, giving Mac users a conventional
      package-manager installation path.
    - >
      The project remains under active development. Its public roadmap, issue tracker,
      help center, and community channels form its early user-feedback and adoption
      infrastructure.
  package-nerd-significance:
    - >
      Crest is notable to browser and packaging enthusiasts as an open-source, native
      Apple-platform browser that treats browsing contexts as strongly separated Spaces.
      Its Mac edition combines Chromium and WebKit while keeping the surrounding
      interface and application architecture in Swift and SwiftUI.
    - >
      Its direct GitHub release pipeline, signed Sparkle appcast, Homebrew packaging,
      public source, and explicit data-portability work make it an unusually inspectable
      desktop-browser distribution.
  project-history:
    - >
      Crest was created as an open-source browser for macOS, iPhone, and iPad using
      SwiftUI and WebKit, organized around isolated Spaces for work, home, research,
      private browsing, and other contexts.
    - >
      The Mac application subsequently added a dual-engine design: Chromium is the
      recommended default for general browsing and extension support, while WebKit
      remains available for platform features such as Reader, translation, content
      blocking, and protected video.
  related-projects:
    - WebKit supplies Crest's Apple-native web-engine option.
    - >
      Crest's Chromium mode is based on ungoogled-chromium and supports Chrome Web Store
      extensions.
    - Sparkle provides the macOS automatic-update mechanism.
  sources:
    - Homebrew adoption is supplied by source_facts.package-manager["brew-cask"].
    - 'Official Field Guide: https://crestbrowser.com/docs/'
    - >
      Official distribution documentation:
      https://github.com/pauljoda/Crest/blob/main/Documentation/Distribution.md
    - 'Official repository README: https://github.com/pauljoda/Crest#readme'
  summary:
    - >
      Crest is an open-source browser for Mac, iPhone, and iPad. Its defining concept is
      the Space: a separated browsing context with its own sessions, website data,
      history, tabs, passwords, permissions, appearance, and synchronization identity.
  timeline:
    - >
      Initial project phase: Crest launched as a native, open-source Apple-platform
      browser centered on isolated Spaces.
    - >
      Later Mac releases: Crest added a dual Chromium/WebKit browsing model and Chrome
      Web Store extension support.
    - >
      Current development: Signed direct releases, automatic updates, public
      documentation, and a public roadmap support ongoing adoption.
  usage:
    - >
      Users organize browsing into Spaces so work, personal, research, and private
      activity do not share the same cookies, history, tabs, credentials, or
      permissions. Private Spaces provide temporary website storage and stay out of
      normal history and synchronization.
    - >
      On Mac, users can select Chromium or WebKit globally or per website. Crest also
      supports browser-data migration, per-Space password management, extensions on
      Chromium pages, and optional iCloud synchronization.
