history:
  adoption-history:
    - >
      Foxglove expanded from local web and desktop visualization to ROS 2 bags, live ROS
      connections, custom extensions, the Foxglove WebSocket protocol, MCAP, shared
      layouts, Linux packaging, and managed robotics data. Its official 2025 account
      stated that more than 10,000 robotics and embodied-AI developers used the
      platform.
  package-nerd-significance:
    - >
      Foxglove became a prominent modern alternative to traditional ROS visualization
      workflows by combining desktop and browser clients, extensible panels, live robot
      connections, and recorded-data playback. Package enthusiasts also track it because
      the open-source Studio 1.x line and current commercial Foxglove product have
      different maintenance and licensing stories.
  project-history:
    - >
      Foxglove launched publicly in May 2021 as a web and desktop application for
      visualizing and debugging robots, drawing on its founders' experience at Cruise.
      The original product strategy separated the open-source Foxglove Studio visualizer
      from the Foxglove Data Platform.
    - >
      In March 2024, Foxglove 2.0 merged visualization and data management into one
      robotics-observability product for web and desktop. Development of the open-source
      Studio edition ended with version 1.87.0 in February 2024, while MCAP and other
      supporting projects remained open source.
  related-projects:
    - >
      Closely related official projects include MCAP, the Foxglove SDK, Foxglove Bridge,
      the Foxglove WebSocket protocol, and the archived Foxglove Studio 1.x codebase.
      The application interoperates with ROS 1, ROS 2, Protobuf, JSON, and robotics log
      formats.
  sources:
    - 'Official 2021 introduction: https://foxglove.dev/blog/introducing-foxglove'
    - >
      Official 2026 Studio comparison:
      https://foxglove.dev/blog/foxglove-vs-foxglove-studio-two-years-on
    - >
      Official Foxglove 2.0 announcement:
      https://foxglove.dev/blog/foxglove-2-0-unifying-robotics-observability
    - 'Official documentation: https://docs.foxglove.dev/'
  summary:
    - >
      Foxglove is a cross-platform robotics visualization, debugging, data-management,
      and observability application for live and recorded multimodal data.
  timeline:
    - '2021: Foxglove launches its web and desktop visualization applications.'
    - >
      2021: Extensions and the Foxglove WebSocket protocol broaden customization and
      non-ROS connectivity.
    - '2022: Foxglove introduces MCAP and publishes a Linux Snap for Foxglove Studio.'
    - >
      2024: Foxglove 2.0 unifies Studio and Data Platform; open-source Studio
      development ends.
    - >
      2026: Foxglove documents more than 50 commercial-product releases since the Studio
      transition.
  usage:
    - >
      Robotics engineers connect the desktop or web app to live systems, open MCAP and
      ROS recordings, arrange reusable layouts of visualization panels, inspect topics
      and message fields, debug sensor and autonomy behavior, and share layouts or
      uploaded data with their teams.
