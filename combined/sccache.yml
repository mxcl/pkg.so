id: brew:sccache
display-name: sccache
homepage: https://github.com/mozilla/sccache
repo: https://github.com/mozilla/sccache
docs:
  - https://github.com/mozilla/sccache/blob/main/docs/Configuration.md
  - https://github.com/mozilla/sccache#readme
config-file-location:
  linux: ~/.config/sccache/config
  macos: ~/Library/Application Support/Mozilla.sccache/config
  windows: '%APPDATA%\Mozilla\sccache\config\config'
credentials-file-location:
  linux: ~/.config/sccache/config
  macos: ~/Library/Application Support/Mozilla.sccache/config
  windows: '%APPDATA%\Mozilla\sccache\config\config'
history:
  adoption-history:
    - >
      sccache is distributed through numerous system and language-oriented package
      channels. The supplied package metadata lists Homebrew, Debian, Ubuntu,
      Fedora/DNF, Arch, Alpine, Nix, Chocolatey, Scoop, Winget, MacPorts, and openSUSE
      packages.
    - >
      Its support for Rust through Cargo's rustc-wrapper setting, alongside major C/C++
      compiler families and CI-oriented remote caches, has made it useful across both
      local development and automated build environments.
  package-nerd-significance:
    - >
      sccache combines the familiar compiler-wrapper workflow associated with ccache
      with Rust support, a client-server design, distributed compilation, and cloud or
      network cache backends. That breadth makes it a notable package for reproducible
      developer-machine and CI build acceleration.
  project-history:
    - >
      The project was developed under Mozilla as a compiler-cache implementation written
      in Rust. It grew beyond local compilation caching to support multiple compiler
      families, distributed compilation, and storage backends such as S3-compatible
      services, Redis, Azure, Google Cloud Storage, GitHub Actions, and local disk.
    - >
      Later releases continued expanding platform and compiler coverage. The official
      0.15.0 release highlighted multi-tier caching and partial C++20 module support,
      while 0.17.0 introduced a new client-side architecture.
  related-projects:
    - 'ccache: The established compiler cache whose invocation style sccache follows.'
    - 'Cargo: Can invoke sccache through build.rustc-wrapper or RUSTC_WRAPPER.'
    - 'Mozilla sccache-action: Official GitHub Action integration for CI caching.'
  sources:
    - https://github.com/mozilla/sccache#readme
    - https://github.com/mozilla/sccache/blob/main/docs/Configuration.md
    - https://github.com/mozilla/sccache/releases
    - source_facts.package-manager
  summary:
    - >
      sccache is a Mozilla-hosted compiler cache used as a compiler wrapper. It stores
      compilation results locally or in remote storage and can also participate in
      distributed compilation.
  timeline:
    - >
      2016: Early public development and releases established sccache as a Rust-based
      compiler cache.
    - '2026: Version 0.15.0 added multi-tier caching and initial C++20 modules support.'
    - '2026: Version 0.17.0 introduced a new client-side architecture.'
  usage:
    - >
      Prefix a supported compiler command with sccache, or configure Cargo with
      build.rustc-wrapper or RUSTC_WRAPPER. A local disk cache is used by default;
      configuration and environment variables select cache sizing, remote storage,
      distributed compilation, and other behavior.
    - >
      The client normally starts a local server automatically. Users can inspect cache
      effectiveness with sccache --show-stats and explicitly start or stop the server
      when integrating it into build or CI workflows.
category: developer-tools
package-manager:
  apk: sccache
  brew: sccache
  chocolatey: sccache
  debian: sccache
  dnf: sccache
  macports: sccache
  nix: sccache
  pacman: sccache
  scoop: main/sccache
  ubuntu: sccache
  winget: Mozilla.sccache
  zypper: sccache
package-manager-url: https://formulae.brew.sh/formula/sccache
license: Apache-2.0
tags:
  - build-cache
  - ccache
  - cli
  - compiler-cache
  - compiler-wrapper
  - developer-tools
description: Used as a compiler wrapper and avoids compilation when possible
executables:
  - sccache
provenance:
  formula: sccache
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
