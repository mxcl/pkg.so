id: brew:baml
display-name: BAML
homepage: https://boundaryml.com/
repo: https://github.com/BoundaryML/baml
docs:
  - https://docs.boundaryml.com/
  - https://docs.boundaryml.com/ref/baml-cli
config-file-location:
  unix: ./baml_src/**/*.baml
credentials-file-location:
  unix: ./.env
history:
  adoption-history:
    - >
      BAML expanded from a type-safe structured-prompting language into a multi-language
      AI application framework. Its generated clients support Python, TypeScript, Ruby,
      Java, C#, Rust, Go, and other environments through OpenAPI.
    - >
      Homebrew distribution places the standalone compiler and CLI in a conventional
      package-manager workflow, while editor integrations and language-specific packages
      serve developers who use it within application projects.
  package-nerd-significance:
    - >
      BAML treats prompts, model clients, schemas, tests, retry policies, and generators
      as version-controlled source files. This makes an otherwise dynamic part of an LLM
      application inspectable and reproducible using familiar compiler and
      package-management practices.
    - >
      Its Rust compiler generating clients for several host languages makes it an
      unusual polyglot developer tool: the packaged CLI is both a language toolchain and
      a code generator.
  project-history:
    - >
      BoundaryML created BAML after beginning to build AI applications in 2022. The
      first public launch described it as a lightweight language for type-safe
      structured prompting with testing, guardrails, and observability.
    - >
      During 2024 and 2025 the project broadened its generated-client and HTTP/OpenAPI
      support, added more editor integrations, and developed schema-aligned parsing for
      reliable structured model output.
  related-projects:
    - >
      BAML occupies territory adjacent to LLM SDKs, prompt-management frameworks, schema
      validators, code generators, and interface-definition languages. Unlike general
      orchestration frameworks, its central abstraction is a typed prompt function
      compiled into host-language clients.
  sources:
    - https://boundaryml.com/blog/announcing-openapi-support
    - https://boundaryml.com/blog/building-a-new-programming-language
    - https://boundaryml.com/blog/typesafe-llm-baml-launch
    - https://boundaryml.com/why-the-f-did-we-make-a-language
    - https://docs.boundaryml.com/changelog/changelog
    - https://github.com/BoundaryML/baml
  summary:
    - >
      BAML, short for Basically a Made-up Language, is an open-source domain-specific
      language and toolchain for defining typed LLM functions. Its compiler generates
      host-language clients with structured output parsing, streaming, testing, retries,
      and model-provider support.
  timeline:
    - '2022: BoundaryML begins building AI applications that lead to BAML.'
    - '2023: BAML receives its first public launch.'
    - '2024: The project documents the engineering of BAML as a new programming language.'
    - '2024: Version 0.55.0 adds BAML-over-HTTP and broad OpenAPI-based language support.'
    - '2025: Version 0.200.0 marks a major toolchain milestone.'
    - '2026: The 0.220 series continues compiler, runtime, and generated-client development.'
  usage:
    - >
      Developers place BAML declarations under baml_src, define typed functions and
      model clients, and run the CLI to generate a baml_client for their application
      language. The same CLI supports testing, development servers, code generation, and
      prompt optimization.
    - >
      Provider secrets are normally supplied through environment variables such as
      OPENAI_API_KEY or ANTHROPIC_API_KEY. The CLI's development and serve workflows
      support dotenv loading from a project-level .env file. BAML server authentication
      can use BAML_PASSWORD.
related-packages: []
category: ai
package-manager:
  brew: baml
  winget: BoundaryML.BAML
package-manager-url: https://formulae.brew.sh/formula/baml
license: Apache-2.0
