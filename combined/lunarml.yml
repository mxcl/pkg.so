id: brew:lunarml
display-name: LunarML
homepage: https://github.com/minoki/LunarML
repo: https://github.com/minoki/LunarML
docs:
  - https://lunarml.readthedocs.io/en/latest
  - https://github.com/minoki/LunarML#readme
config-file-location:
  unix: ./.env
credentials-file-location:
  unix: ./.env
history:
  adoption-history:
    - >
      LunarML remains a specialist language-tooling package rather than a mass-market
      runtime. The supplied package metadata lists Homebrew and Nix packages, and the
      GitHub repository metadata shows a modest but visible audience for an
      SML-to-Lua/JavaScript compiler.
    - >
      Its adoption story is strongest among language implementers and users who want
      Standard ML code to run in ecosystems where Lua or JavaScript is the deployment
      substrate.
  package-nerd-significance:
    - >
      LunarML is interesting to package nerds because it packages a traditionally
      academic language in a portable, script-friendly way. A Homebrew or Nix install
      can turn SML source into Lua or JavaScript output without requiring users to
      assemble a full bespoke compiler toolchain.
    - >
      The package also shows the tension common in language packages: convenient
      precompiled scripts exist for reach, while the upstream docs still steer serious
      users toward the native compiler.
  project-history:
    - >
      The public GitHub repository was created in 2018 under ARATA Mizuki's minoki
      account. The project has since developed as a niche cross-runtime Standard ML
      implementation: the documentation is maintained as Sphinx/Read the Docs material,
      and the README documents prebuilt binaries, Docker usage, and source builds via
      MLton.
    - >
      By the v0.3.0 release line, LunarML packaged the compiler as native binaries as
      well as precompiled Lua and Node.js scripts. The README warns that script-compiled
      LunarML is slower than the native binary, which reflects the project's practical
      packaging concern: making the compiler runnable in several host environments while
      preserving a serious-use native path.
  related-projects:
    - MLton is documented as the build-time Standard ML compiler needed to build LunarML.
    - Lua, LuaJIT, Node.js, and web JavaScript are documented output targets.
    - The ML Basis system is documented as LunarML's multi-file project mechanism.
  sources:
    - https://api.github.com/repos/minoki/LunarML
    - https://api.github.com/repos/minoki/LunarML/releases/latest
    - https://github.com/minoki/LunarML#readme
    - https://lunarml.readthedocs.io/en/latest/
    - source_facts.package-manager
  summary:
    - >
      LunarML is a Standard ML compiler whose distinguishing package-manager pitch is
      that it emits Lua and JavaScript rather than native code. Its upstream README
      describes it as a compiler for the full SML '97 language with signatures,
      functors, a subset of the Basis Library, an ML Basis system for multi-file
      projects, and targets for Lua, LuaJIT, Node.js, and web JavaScript.
  timeline:
    - '2018: GitHub repository created for minoki/LunarML.'
    - >
      2024: Read the Docs documentation copyright year indicates maintained public
      documentation.
    - '2025: v0.3.0 release published with documented prebuilt binary workflows.'
  usage:
    - >
      The core command is `lunarml compile [options] input.(sml|mlb)`. Users choose
      targets such as Lua 5.3+, LuaJIT, Node.js ES modules, or web JavaScript, and can
      produce executable-style programs or modules.
    - >
      The README also documents `check`, `help`, and `version` subcommands, Docker
      invocation, `make install`, and build/test targets for Lua, LuaJIT, and Node.js
      back ends.
related-packages:
  - id: brew:mlton
    reason: >
      MLton is LunarML's documented build-time compiler, so install it when building
      LunarML's faster native executable from source rather than using the precompiled
      Lua, Node.js, or container forms.
    rel: adjacent_workflow
    sources:
      - https://github.com/minoki/LunarML
      - https://github.com/MLton/mlton
category: developer-tools
package-manager:
  brew: lunarml
  nix: lunarml
package-manager-url: https://formulae.brew.sh/formula/lunarml
license: MIT
tags:
  - cli
  - compiler
  - developer-tool
  - javascript
  - lua
  - standard-ml
description: Standard ML compiler that produces Lua/JavaScript
executables:
  - lunarml
provenance:
  formula: lunarml
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
