id: brew:anchor
display-name: Anchor
homepage: https://anchor-lang.com
repo: https://github.com/otter-sec/anchor
docs:
  - https://www.anchor-lang.com/docs
  - https://www.anchor-lang.com/docs/references/anchor-toml
  - https://www.anchor-lang.com/docs/references/cli
config-file-location:
  unix: Anchor.toml
credentials-file-location:
  unix: ~/.config/solana/id.json
history:
  adoption-history:
    - >
      Anchor's adoption tracks Solana application development: it gives Rust program
      authors a higher-level account model, generated IDLs, generated TypeScript and
      Rust client workflows, and a project layout familiar to developers coming from
      contract frameworks in other ecosystems.
    - >
      The README explicitly compares the high-level flow to Ethereum tooling such as
      Solidity, Truffle, and web3.js while noting that Anchor's DSL targets Solana.
      Official package tables show Anchor components published through crates.io and
      npm, while the supplied package facts show the CLI available through Homebrew and
      Nix.
  package-nerd-significance:
    - >
      Anchor is significant because it turns a blockchain program into a packageable
      workspace with a CLI, generated interface files, client packages, and repeatable
      build/test/deploy commands.
    - >
      For package managers, the `anchor` command is only one visible edge of a larger
      toolchain: crates, npm packages, Solana CLI compatibility, AVM, local validator
      behavior, and project config all need to line up.
  project-history:
    - >
      The public repository was created in January 2021 and describes Anchor as a Solana
      program framework. Its README lists the major pieces: a Rust eDSL for Solana
      programs, an IDL specification, a TypeScript package for generated clients, and a
      CLI for workspace management.
    - >
      Anchor grew around the full development lifecycle rather than just macros. The
      docs cover installation, `anchor init`, `anchor build`, `anchor test`, deployment,
      IDL commands, clients, local validators, and `Anchor.toml` workspace
      configuration.
    - >
      The project moved under the Solana Foundation repository namespace while retaining
      official docs at anchor-lang.com. The latest GitHub release observed for this
      batch is v1.1.2, published in June 2026.
  related-projects:
    - 'Solana CLI: required command-line tooling for Solana development.'
    - 'AVM: Anchor Version Manager, recommended by upstream installation docs.'
    - >
      anchor-lang, anchor-spl, and anchor-client: Rust crates published as part of the
      Anchor ecosystem.
    - >
      @anchor-lang/core and @anchor-lang/cli: npm packages listed by upstream for
      TypeScript/client and CLI workflows.
  sources:
    - https://api.github.com/repos/solana-foundation/anchor
    - https://api.github.com/repos/solana-foundation/anchor/releases/latest
    - https://github.com/solana-foundation/anchor
    - https://github.com/solana-foundation/anchor#readme
    - https://www.anchor-lang.com/docs
    - https://www.anchor-lang.com/docs/quickstart/local
    - https://www.anchor-lang.com/docs/references/anchor-toml
    - https://www.anchor-lang.com/docs/references/cli
    - source_facts.package-manager
  summary:
    - >
      Anchor is the Solana Program Framework: a Rust-oriented framework, CLI, IDL
      system, and client-generation toolchain for building Solana programs. The upstream
      README calls it the most popular framework for Solana programs.
  timeline:
    - '2021: Public repository created.'
    - '2021-2020s: Anchor becomes a standard framework for Solana program development.'
    - '2026: Release v1.1.2 published.'
    - >
      Current docs: Anchor CLI, Anchor.toml, TypeScript/Rust clients, testing, and
      deployment are documented at anchor-lang.com.
  usage:
    - >
      Typical usage starts with `anchor init`, then `anchor build`, `anchor test`, and
      `anchor deploy`. The CLI builds workspace programs for Solana's BPF runtime, emits
      IDLs under `target/idl`, runs integration tests, and deploys configured programs.
    - >
      `Anchor.toml` is the central project configuration file. The local-development
      docs show it specifying clusters and a wallet path such as
      `~/.config/solana/id.json`, and the CLI docs say commands are configured from the
      workspace's `Anchor.toml`.
related-packages:
  - id: brew:solana
    reason: >
      The Solana CLI supplies the wallet, cluster configuration, deployment commands,
      and local validator that Anchor workspaces use when building and testing Solana
      programs.
    rel: adjacent_workflow
    sources:
      - https://www.anchor-lang.com/docs/references/anchor-toml
      - https://www.anchor-lang.com/docs/references/cli
      - https://docs.anza.xyz/cli/
category: developer-tools
package-manager:
  brew: anchor
  nix: anchor
package-manager-url: https://formulae.brew.sh/formula/anchor
license: Apache-2.0
tags:
  - blockchain
  - cli
  - framework
  - smart-contracts
  - solana
description: Solana Program Framework
executables:
  - anchor
provenance:
  formula: anchor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
