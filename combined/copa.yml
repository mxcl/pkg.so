id: brew:copa
display-name: Copa
homepage: https://project-copacetic.github.io/copacetic/
repo: https://github.com/project-copacetic/copacetic
docs:
  - https://project-copacetic.github.io/copacetic
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site identifies Copacetic as a CNCF Sandbox project and lists
      ecosystem adoption by Azure Container Registry Continuous Patching, Kubescape,
      Devtron, and Helmper. It also documents featured talks at KubeCon North America
      2024 and OpenSSF SOSS Fusion Conference 2024.
  package-nerd-significance:
    - >
      For package and container maintainers, Copa sits at the boundary between OS
      package updates and container distribution. It is interesting because it turns
      package-manager-level remediation into a post-build image operation, which can
      reduce rebuild churn for downstream image consumers.
  project-history:
    - >
      The official repository was created in January 2023 and released v0.1.0 the next
      day. The project developed around direct vulnerability patching: adding a patch
      layer to existing images based on scanner output rather than forcing users to
      rebuild from source.
  related-projects:
    - >
      Official documentation connects Copa with BuildKit, Trivy, Azure Container
      Registry Continuous Patching, Kubescape, Devtron, and Helmper.
  sources:
    - https://project-copacetic.github.io/copacetic/website/
    - https://github.com/project-copacetic/copacetic
    - https://github.com/project-copacetic/copacetic/releases
    - https://api.github.com/repos/project-copacetic/copacetic
  summary:
    - >
      Copa is the CLI for Project Copacetic, a Go and BuildKit-based tool for patching
      vulnerable container images without doing a full image rebuild.
  timeline:
    - '2023: Official GitHub repository created.'
    - '2023: v0.1.0 released.'
    - '2024: Project featured in KubeCon and OpenSSF talks listed by the official site.'
    - '2026: Official site lists Copacetic as a CNCF Sandbox project.'
  usage:
    - >
      Copa is commonly used in CI/CD and image-maintenance workflows. It consumes
      vulnerability scanning results, has built-in Trivy support, supports third-party
      scanners, and patches images across multiple Linux package-manager families and
      platforms.
related-packages:
  - id: brew:trivy
    reason: >
      Use Trivy to produce the vulnerability findings that Copa supports natively when
      selecting and applying container-image patches.
    rel: adjacent_workflow
    sources:
      - https://project-copacetic.github.io/copacetic/website/introduction
      - https://project-copacetic.github.io/copacetic/website/scanner-plugins
      - https://trivy.dev/latest/docs/
category: security
package-manager:
  brew: copa
package-manager-url: https://formulae.brew.sh/formula/copa
license: Apache-2.0
tags:
  - buildkit
  - cli
  - containers
  - image-patching
  - vulnerability-scanning
description: Tool to directly patch container images given the vulnerability scanning results
executables:
  - copa
provenance:
  formula: copa
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
