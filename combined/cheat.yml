id: brew:cheat
display-name: cheat
homepage: https://github.com/cheat/cheat
repo: https://github.com/cheat/cheat
docs:
  - https://github.com/cheat/cheat#readme
  - https://github.com/cheat/cheat/blob/master/INSTALLING.md
config-file-location:
  unix:
    - ~/.config/cheat/conf.yml
    - path set by CHEAT_CONFIG_PATH
credentials-file-location: null
history:
  adoption-history:
    - >
      cheat grew beyond a single executable into an ecosystem around the
      cheat/cheatsheets repository, which was created in October 2019 for
      community-sourced sheets. The official installation guide lists manual binaries,
      `go install`, and packages for AUR, Homebrew, Docker, Nix, and Snap; the batch
      input also records MacPorts, Fedora, openSUSE, Scoop, and other package-manager
      coverage.
  package-nerd-significance:
    - >
      cheat matters to CLI/package-manager culture because it turns command examples
      into local, editable, packageable data. Its XDG config, generated shell
      completions, community sheet repository, and broad package-manager availability
      make it a familiar small tool in terminal setup lists.
  project-history:
    - >
      The GitHub repository was created in July 2013. The README describes a CLI that
      reads plain-text cheatsheets, supports personal and community cheatpaths, can edit
      sheets, and can search or filter by name, regex, path, and tags.
  related-projects:
    - cheat/cheatsheets provides community-sourced cheatsheets used by the tool.
    - Chroma is used for syntax highlighting according to the README.
    - >
      The project overlaps culturally with man pages, tldr-style pages, and
      shell-completion-driven command reference tools.
  sources:
    - https://github.com/cheat/cheat
    - https://github.com/cheat/cheat/blob/master/INSTALLING.md
    - https://api.github.com/repos/cheat/cheat
    - https://api.github.com/repos/cheat/cheatsheets
  summary:
    - >
      cheat is a command-line cheatsheet viewer and editor for Unix-style command
      reference, designed for commands that administrators use often enough to need
      quick reminders but not often enough to memorize.
  timeline:
    - '2013: GitHub repository created.'
    - '2019: cheat/cheatsheets repository created for community-sourced sheets.'
    - '2019: 3.0.0 release published on GitHub.'
    - '2026: Current installation docs describe 5.0.0 release binaries.'
  usage:
    - >
      Typical use is `cheat tar` or another command name to print examples, `cheat -e`
      to edit or create a sheet, `cheat -l` or `cheat -b` to list sheets, and `cheat -s`
      or `cheat -r -s` to search sheet contents.
related-packages:
  - id: brew:navi
    reason: >
      Choose navi when you want an interactive cheatsheet browser that substitutes
      arguments and can place or execute the selected command; choose cheat for directly
      editable plain-text reference sheets.
    rel: alternative
    sources:
      - https://github.com/cheat/cheat
      - https://github.com/denisidoro/navi
category: developer-tools
package-manager:
  brew: cheat
  dnf: cheat
  macports: cheat
  nix: cheat
  scoop: main/cheat
  zypper: cheat
package-manager-url: https://formulae.brew.sh/formula/cheat
license: MIT
tags:
  - cheatsheets
  - cli
  - documentation
  - go
  - unix
description: Create and view interactive cheat sheets for *nix commands
executables:
  - cheat
provenance:
  formula: cheat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
