id: brew:ipinfo-cli
display-name: IPinfo CLI
homepage: https://ipinfo.io/
repo: https://github.com/ipinfo/cli
docs:
  - https://github.com/ipinfo/cli#readme
  - https://ipinfo.io/developers
config-file-location:
  unix: ~/.config/ipinfo
credentials-file-location:
  unix: ~/.config/ipinfo
history:
  adoption-history:
    - >
      The CLI was packaged for many installation paths from the start: Homebrew, a
      Debian/Ubuntu PPA, one-shot deb and script installers, FreeBSD ports, Arch AUR,
      Scoop, Docker, Go install, and release archives.
    - >
      Its adoption follows the growth of IP intelligence workflows: developers and
      security teams can move from web/API calls to shell pipelines while still using
      the same IPinfo data source and account token.
  package-nerd-significance:
    - >
      This package matters because it turns a SaaS IP intelligence API into a normal
      Unix command with package-manager installs, subcommands, and pipeline-friendly
      utilities.
    - >
      It also creates a naming collision with the older Kyberdigi `ipinfo` formula.
      Homebrew resolves that by naming this formula `ipinfo-cli` while the executable
      remains `ipinfo`.
  project-history:
    - >
      The GitHub repository was created in 2020 and IPinfo announced the official CLI in
      April 2021. The announcement framed it as a way to query nearly all IPinfo APIs
      more efficiently from the terminal, including IP lookups, ASN lookups, summaries,
      maps, grep-like IP extraction, and range listing.
    - >
      The repository README expanded the tool into both the main `ipinfo` command and a
      suite of related binaries such as `grepip`, `matchip`, `prips`, CIDR/range
      converters, `randip`, and `mmdb` tooling.
  related-projects:
    - IPinfo.io provides the API and data products queried by the CLI.
    - >
      grepip, matchip, prips, CIDR/range conversion tools, randip, and mmdb tools are
      shipped as related command-line utilities in the same ecosystem.
    - Kyberdigi ipinfo is unrelated despite the similar package name.
  sources:
    - https://github.com/ipinfo/cli
    - https://github.com/ipinfo/cli/releases
    - https://ipinfo.io/blog/meet-the-official-ipinfo-cli
  summary:
    - >
      IPinfo CLI is the official command-line interface for the IPinfo.io API, combining
      IP and ASN lookups, bulk enrichment, summaries, mapping, CIDR and range tools, and
      standalone helper binaries.
  timeline:
    - '2020: GitHub repository created.'
    - '2021: ipinfo-1.0.0 release and official CLI announcement.'
    - '2021: Early companion binaries such as grepip were released alongside the main command.'
    - '2026: ipinfo-3.3.2 release published on GitHub.'
  usage:
    - >
      Common usage includes one-off IP and ASN lookups, bulk enrichment from files or
      standard input, summarizing up to 1000 IPs, opening maps for IP locations,
      filtering IPs from text, and generating IP lists from CIDR or range input.
    - >
      The config and token data live under `~/.config/ipinfo` on Unix-like systems
      according to the README's Docker persistence example and supplied curation.
related-packages: []
category: networking
package-manager:
  brew: ipinfo-cli
  nix: ipinfo
  scoop: main/ipinfo-cli
  winget: ipinfo.ipinfo
package-manager-url: https://formulae.brew.sh/formula/ipinfo-cli
license: Apache-2.0
tags:
  - api-client
  - cli
  - ip-address
  - ip-geolocation
  - network-intelligence
description: Official CLI for the IPinfo IP Address API
executables:
  - ipinfo
provenance:
  formula: ipinfo-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
