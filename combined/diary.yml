id: brew:diary
display-name: diary
homepage: https://diary.p0c.ch
repo: https://code.in0rdr.ch/diary
docs:
  - https://diary.p0c.ch/man
config-file-location:
  unix: ${XDG_CONFIG_HOME:-~/.config}/diary/diary.cfg
credentials-file-location:
  unix: ${XDG_CONFIG_HOME:-~/.config}/diary/diary.cfg
history:
  adoption-history:
    - >
      The supplied Homebrew facts identify diary as packaged for Homebrew with an MIT
      license and the official homepage at diary.p0c.ch.
  package-nerd-significance:
    - >
      It is package-manager friendly because it is a small terminal utility with
      XDG-style configuration, plain text journal storage, and optional CalDAV
      integration.
  project-history:
    - >
      The official manual documents a terminal journaling workflow driven by a diary
      directory, an optional XDG configuration file, and editor integration.
  related-projects:
    - >
      CalDAV clients, terminal diaries, plain-text journaling tools, calendar
      import/export tools.
  sources:
    - https://diary.p0c.ch/man
    - source_facts.homepage
    - source_facts.package-manager
  summary:
    - >
      diary is a text-based journaling program that stores entries as date-named text
      files and can import, export, and synchronize calendar entries.
  timeline:
    - >
      Current: Official manual documents XDG config, DIARY_DIR storage, .ics
      import/export, and CalDAV sync.
  usage:
    - >
      Users navigate days in the terminal, edit entries with their configured editor,
      import or export .ics files, and optionally sync entries to CalDAV.
related-packages:
  - id: brew:jrnl
    reason: >
      Choose jrnl when you prefer natural-language entry creation, tags, multiple
      journals, and optional AES encryption; diary instead centers on a calendar UI, one
      text file per date, and CalDAV/.ics workflows.
    rel: alternative
    sources:
      - https://diary.p0c.ch/man
      - https://jrnl.sh/en/stable/
category: productivity
package-manager:
  brew: diary
package-manager-url: https://formulae.brew.sh/formula/diary
license: MIT
tags:
  - caldav
  - calendar
  - cli
  - ics
  - journaling
  - terminal
  - text-files
  - xdg
description: Text-based journaling program
executables:
  - diary
provenance:
  formula: diary
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
