id: brew:cig
display-name: cig
homepage: https://github.com/stevenjack/cig
repo: https://github.com/stevenjack/cig
docs:
  - https://github.com/stevenjack/cig#readme
config-file-location:
  unix: ~/.cig.yaml
  windows: ~/Users/Steven Jack/.cig.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Go, Homebrew on macOS, curl-based Linux installation, manual
      binary installation, and a Windows binary. Homebrew continues to package cig, but
      the available package metadata suggests a niche tool rather than broad ecosystem
      adoption.
  package-nerd-significance:
    - >
      cig is a compact example of the mid-2010s Go single-binary CLI pattern: GitHub
      releases, Homebrew installation, cross-platform binaries, and a tiny YAML
      configuration file.
  project-history:
    - >
      The official README describes cig as a command-line app for checking the state of
      Git repositories. It packages the common developer question 'can I go?' into a
      small status aggregator over many local repositories.
  related-projects:
    - >
      Git is the underlying tool being inspected; cig is a status aggregator over local
      Git repositories.
    - Homebrew is the main package-manager distribution surfaced in the input.
  sources:
    - https://formulae.brew.sh/formula/cig
    - https://github.com/stevenjack/cig#readme
  summary:
    - >
      cig, short for Can I go?, is a Go CLI that checks a configured set of Git
      repositories and reports local changes or commits that need pushing.
  timeline:
    - '2015: Official repository and package history center on the v0.1.x Go CLI era.'
    - '2015: README documents Go, Homebrew, Linux, and Windows distribution paths.'
    - '2026: Homebrew still packages cig.'
  usage:
    - >
      Users create a .cig.yaml file in their home directory mapping labels such as work
      or personal to directories containing Git repositories, then run cig to report
      repositories with pending pushes or modified files. The README also documents
      target and string filters.
related-packages:
  - id: brew:git
    reason: >
      Git is the required adjacent tool whose repositories, working-tree changes, and
      outgoing commits cig examines.
    rel: adjacent_workflow
    sources:
      - https://github.com/stevenjack/cig#readme
      - https://git-scm.com/docs/git-status
category: developer-tools
package-manager:
  brew: cig
package-manager-url: https://formulae.brew.sh/formula/cig
license: MIT
tags:
  - cli
  - git
  - repositories
  - status
description: CLI app for checking the state of your git repositories
executables:
  - cig
provenance:
  formula: cig
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
