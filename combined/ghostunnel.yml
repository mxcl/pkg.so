id: brew:ghostunnel
display-name: Ghostunnel
homepage: https://ghostunnel.dev/
repo: https://github.com/ghostunnel/ghostunnel
docs:
  - https://ghostunnel.dev/docs/getting-started
  - https://github.com/ghostunnel/ghostunnel#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ghostunnel's adoption sits in security and operations teams that need a small
      proxy rather than a full service mesh or general reverse proxy. Official materials
      point users to GitHub releases and Docker Hub, and the project documents Linux,
      macOS, Windows, and other Go-supported Unix systems.
  package-nerd-significance:
    - >
      Package nerds care about Ghostunnel because it packages a focused security
      boundary as one executable: install it, provide certificates, and put mTLS in
      front of a service without rewriting the application.
  project-history:
    - >
      The Ghostunnel repository was created in 2015 and its first GitHub release,
      v1.0.0, was published in 2016. Its README frames the project as a simple TLS proxy
      with mutual authentication for securing non-TLS backend applications.
    - >
      The project evolved around two complementary modes: server mode terminates TLS and
      forwards to an insecure backend, while client mode accepts local insecure
      connections and forwards them to a TLS-secured service. Over time the README grew
      to document certificate reloads, ACME, PKCS#11, macOS Keychain, Windows
      Certificate Store, SPIFFE Workload API, Prometheus metrics, systemd and launchd
      socket activation, and Windows service management.
  related-projects:
    - >
      Ghostunnel is adjacent to stunnel, OpenSSL tooling, mkcert, cfssl, SPIFFE, Open
      Policy Agent, systemd, launchd, and Docker-based deployment workflows.
  sources:
    - https://api.github.com/repos/ghostunnel/ghostunnel
    - https://ghostunnel.dev/docs/getting-started
    - https://github.com/ghostunnel/ghostunnel
    - https://github.com/ghostunnel/ghostunnel#readme
    - https://github.com/ghostunnel/ghostunnel/releases/tag/v1.0.0
  summary:
    - >
      Ghostunnel is a Go TLS proxy for placing mutual TLS in front of services that do
      not speak TLS themselves.
  timeline:
    - '2015: GitHub repository created.'
    - '2016: v1.0.0 initial release published.'
    - >
      2020s: Documentation covers OPA policies, SPIFFE identities, hardware-backed keys,
      certificate reloads, metrics, and service-manager deployment.
  usage:
    - >
      Practitioners use Ghostunnel to wrap legacy TCP services with mutual TLS, add
      client-certificate authorization, run local TLS clients for remote services,
      reload short-lived certificates, expose metrics, and deploy the proxy under a
      service manager.
related-packages:
  - id: brew:stunnel
    reason: >
      Choose stunnel for a traditional configuration-file-driven TLS wrapper with broad
      legacy deployment support; choose Ghostunnel when mutual TLS, live identity
      reloads, or policy integrations are central requirements.
    rel: alternative
    sources:
      - https://ghostunnel.dev/docs/
      - https://github.com/ghostunnel/ghostunnel
      - https://www.stunnel.org/manual.html
category: networking
package-manager:
