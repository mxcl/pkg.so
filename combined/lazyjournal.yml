id: brew:lazyjournal
display-name: lazyjournal
homepage: https://github.com/Lifailon/lazyjournal
repo: https://github.com/Lifailon/lazyjournal
docs:
  - https://github.com/Lifailon/lazyjournal/wiki
  - https://github.com/Lifailon/lazyjournal#readme
config-file-location:
  unix:
    - ~/.config/lazyjournal/config.yml
    - config.yml next to the executable
    - config.yml in the current working directory
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026-06-03, GitHub repository metadata reported 1,312 stars, and the README
      listed packaging through Homebrew, conda-forge, Arch AUR, an Ubuntu PPA, Docker
      Hub, and GitHub releases.
  package-nerd-significance:
    - >
      lazyjournal matters to package-manager users because it packages a broad
      log-inspection workflow as a single Go binary while still exposing native Unix
      tools and platform log systems underneath.
  project-history:
    - >
      The GitHub repository was created on 2024-11-12. The README frames lazyjournal as
      part of the 'lazy' terminal UI lineage, explicitly citing LazyDocker and LazyGit
      as inspirations while applying the same keyboard-driven workflow to system and
      container logs.
  related-projects:
    - >
      The README names LazyDocker and LazyGit as inspirations and documents integrations
      with journalctl, auditd, Docker, Podman, Kubernetes, rsyslog, SSH, and optional
      log highlighters such as tailspin and bat.
  sources:
    - https://api.github.com/repos/Lifailon/lazyjournal
    - https://github.com/Lifailon/lazyjournal
    - https://github.com/Lifailon/lazyjournal/releases
  summary:
    - >
      lazyjournal is a Go terminal UI for browsing and filtering logs from journald,
      auditd, local log files, Docker, Podman, Docker Compose, Kubernetes, Windows Event
      Logs, and remote hosts over SSH.
  timeline:
    - '2024-11-12: GitHub repository created.'
    - '2025-12-01: Release 0.8.2 published.'
    - '2026-03-16: Release 0.8.6 published.'
  usage:
    - >
      The tool is used as an interactive log viewer: users run `lazyjournal`, choose a
      source such as journalctl, Docker, Podman, Kubernetes, or files under /var/log,
      and filter output with exact, fuzzy, regex, or date filters.
related-packages:
  - id: brew:tailspin
    reason: >
      Install tailspin to use lazyjournal's documented optional tailspin coloring mode
      for log output.
    rel: adjacent_workflow
    sources:
      - https://github.com/Lifailon/lazyjournal#readme
      - https://github.com/bensadeh/tailspin#readme
  - id: brew:bat
    reason: Install bat to use lazyjournal's documented optional bat-based log-highlighting mode.
    rel: adjacent_workflow
    sources:
      - https://github.com/Lifailon/lazyjournal#readme
      - https://github.com/sharkdp/bat#readme
category: system
package-manager:
  brew: lazyjournal
  nix: lazyjournal
package-manager-url: https://formulae.brew.sh/formula/lazyjournal
license: MIT
tags:
  - cli
  - docker
  - journalctl
  - kubernetes
  - logs
  - podman
  - tui
description: TUI for logs from journalctl, file system, Docker, Podman and Kubernetes pods
executables:
  - lazyjournal
provenance:
  formula: lazyjournal
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
