id: brew:iat
display-name: Iso9660 Analyzer Tool
homepage: https://sourceforge.net/projects/iat.berlios/
repo: null
docs:
  - https://sourceforge.net/projects/iat.berlios
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      iat survived mostly through distribution packaging. Debian carries it in the
      `otherosfs` section, describes support for BIN, MDF, PDI, CDI, NRG, and B5I input
      formats, and publishes source packages; Homebrew also packages version 0.1.7 for
      macOS and Linux users.
  package-nerd-significance:
    - >
      iat is interesting less for active upstream development than for preservation. It
      is a BerliOS-origin utility that remains reachable through SourceForge, Debian,
      Nix, Ubuntu, and Homebrew metadata, showing how small file-format converters
      persist in package ecosystems long after their hosting history changes.
  project-history:
    - >
      The preserved SourceForge project page identifies the BerliOS-era project as
      alpha-status software, registered on 2006-06-01, with a 2014-06-09 project update.
      Its description emphasizes detection of image-file structure rather than a large
      suite of disk-authoring features.
  related-projects:
    - >
      Debian lists similar or adjacent image and filesystem packages such as acetoneiso,
      genisoimage, fuseiso, and libcdio-related packages.
  sources:
    - https://formulae.brew.sh/formula/iat
    - https://packages.debian.org/sid/iat
    - https://sourceforge.net/projects/iat.berlios/
  summary:
    - >
      Iso9660 Analyzer Tool, packaged as `iat`, is a small C command-line utility for
      detecting several CD-ROM image container formats and converting them into ISO-9660
      images.
  timeline:
    - '2006: SourceForge records the project registration date.'
    - '2014: SourceForge records a project update.'
    - '0.1.7: Debian and Homebrew package the same upstream version.'
  usage:
    - >
      The package fits the rescue-and-conversion corner of Unix tooling: users install a
      tiny CLI when they need to turn legacy CD-ROM image formats into a plain ISO-9660
      image that other tools can mount, inspect, or burn.
related-packages:
  - id: brew:bchunk
    reason: >
      bchunk is a narrower alternative when the source is specifically a BIN/CUE image
      and separate ISO, CDR, or WAV tracks are desired.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/iat.berlios/
      - http://he.fi/bchunk/
  - id: brew:xorriso
    reason: >
      After IAT converts a legacy image to ISO-9660, xorriso can inspect, extract,
      modify, or record the resulting ISO filesystem.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/projects/iat.berlios/
      - https://www.gnu.org/software/xorriso/
category: system
package-manager:
  brew: iat
  debian: iat
  nix: iat
  ubuntu: iat
package-manager-url: https://formulae.brew.sh/formula/iat
license: GPL-2.0-or-later
tags:
  - cd-rom
  - cli
  - conversion
  - disk-image
  - iso9660
description: Converts many CD-ROM image formats to ISO9660
executables:
