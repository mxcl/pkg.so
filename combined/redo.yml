id: brew:redo
display-name: redo
homepage: https://redo.rtfd.io/
repo: https://github.com/apenwarr/redo
docs:
  - https://redo.readthedocs.io/en/latest
config-file-location:
  unix:
    - <target-directory>/<target-name>.do
    - <target-directory-or-ancestor>/default.<extension>.do
    - <target-directory-or-ancestor>/default.do
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied metadata records packages in Homebrew, MacPorts, Nix, and the Arch
      ecosystem, demonstrating adoption across several Unix-like package-manager
      communities. The official documentation also catalogs projects that use redo.
  package-nerd-significance:
    - >
      redo attracts build-system enthusiasts because dependencies are discovered by
      executable build scripts rather than maintained in a separate declarative graph.
      Its small conceptual core has inspired multiple independent implementations.
  project-history:
    - >
      Daniel J. Bernstein originally described redo in undated notes about rebuilding
      targets when sources change but did not publish an implementation. Avery Pennarun
      later implemented this redo from scratch from Bernstein's design. The official
      history also identifies Alan Grosskurth's approximately 250-line shell
      implementation and master's research on top-down software rebuilding as an early
      related effort.
  related-projects:
    - >
      redo is positioned as a competitor to Make. Other redo implementations and
      redoconf belong to the surrounding ecosystem documented by the project.
  sources:
    - https://github.com/apenwarr/redo
    - https://redo.readthedocs.io/en/latest/
    - source_facts.package-manager
  summary:
    - >
      redo is Avery Pennarun's implementation of Daniel J. Bernstein's recursive,
      general-purpose build-system design.
  timeline:
    - 'Undated: Daniel J. Bernstein published design notes for redo without accompanying code.'
    - >
      Early implementation period: Alan Grosskurth implemented the design in shell while
      researching top-down rebuilding.
    - 'Later: Avery Pennarun wrote this implementation from scratch.'
    - >
      2026: Homebrew, MacPorts, Nix, and Arch-family packages are recorded in the
      supplied metadata.
  usage:
    - >
      Projects define builds with executable `.do` scripts. `redo` builds targets, while
      commands such as `redo-ifchange`, `redo-ifcreate`, `redo-always`, and `redo-stamp`
      express dynamic dependencies and rebuild behavior.
category: developer-tools
package-manager:
  brew: redo
  macports: redo
  nix: redo
  pacman: redo-python
package-manager-url: https://formulae.brew.sh/formula/redo
license: Apache-2.0
tags:
  - automation
  - build-system
  - cli
  - make-alternative
  - python
description: "Implements djb's redo: an alternative to make"
executables:
  - redo
  - redo-always
  - redo-ifchange
  - redo-ifcreate
  - redo-log
  - redo-ood
  - redo-sources
  - redo-stamp
  - redo-targets
  - redo-unlocked
  - redo-whichdo
provenance:
  formula: redo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
