id: brew:massren
display-name: massren
homepage: https://github.com/laurent22/massren
repo: https://github.com/laurent22/massren
docs:
  - https://github.com/laurent22/massren#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      massren stayed a niche but packageable CLI because it solves a common shell-user
      workflow without becoming a full file manager. The batch input records Homebrew
      and Nix packaging, matching a tool whose main audience is users who already
      install small terminal utilities from package managers.
  package-nerd-significance:
    - >
      For package-manager users, massren is interesting because it composes with the
      editor muscle memory they already have instead of shipping its own rename
      language. It is the kind of small, sharp CLI that remains useful in Homebrew/Nix
      collections even without a large surrounding ecosystem.
  project-history:
    - >
      The project README describes massren as an answer to the awkwardness of
      command-line bulk renamers that require escaping regular expressions or learning a
      custom rename syntax. Its public release history includes a v1.0.1 release in
      2014, and the README copyright range runs from 2013 through 2025.
    - >
      Over time the tool gained the practical safety features expected from a bulk
      renamer: dry-run mode, undo support, checks that the file list did not change
      unexpectedly while being edited, and support for moving files into subdirectories.
  related-projects:
    - >
      massren sits near other bulk rename tools, but its closest conceptual dependency
      is the user's chosen text editor. It also overlaps with shell workflows that use
      `vidir`, `rename`, or scripted `mv` loops.
  sources:
    - https://github.com/laurent22/massren
    - https://github.com/laurent22/massren/releases/tag/v1.0.1
    - https://github.com/laurent22/massren/releases/tag/v1.5.7
    - https://raw.githubusercontent.com/laurent22/massren/master/README.md
    - source_facts.package-manager
  summary:
    - >
      massren is a small command-line bulk rename tool built around a Unix-friendly
      idea: open a generated list of filenames in the user's normal text editor, let the
      user edit the names, then apply the diff as rename operations.
  timeline:
    - "2013: README copyright range begins for Laurent Cozic's massren."
    - '2014: GitHub release v1.0.1 is published.'
    - '2024: GitHub release v1.5.7 is published.'
    - '2025: README copyright range still includes active project maintenance.'
  usage:
    - >
      Typical use is to run `massren` in a directory, edit the generated list in an
      editor such as Vim, Emacs, Sublime Text, or Notepad, save it, and let massren
      rename only the changed lines. The README also documents `--dry-run`, `--undo`,
      and `--config` for selecting the editor and behavior such as trash usage.
related-packages:
  - id: brew:renameutils
    reason: >
      Choose renameutils for the established Unix `qmv`/`qcp` suite and editor-oriented
      move or copy workflows; choose massren for a smaller cross-platform tool with
      integrated undo and safety checks.
    rel: alternative
    sources:
      - https://github.com/laurent22/massren#readme
      - https://www.nongnu.org/renameutils/
  - id: brew:f2
    reason: >
      Choose F2 for expression-driven renames, conflict resolution, metadata variables,
      and structured previews; choose massren when you prefer editing the complete
      filename list in your normal text editor.
    rel: alternative
    sources:
      - https://github.com/laurent22/massren#readme
      - https://f2.freshman.tech/
category: productivity
package-manager:
  brew: massren
  nix: massren
package-manager-url: https://formulae.brew.sh/formula/massren
license: MIT
tags:
