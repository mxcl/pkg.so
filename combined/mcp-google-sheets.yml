id: brew:mcp-google-sheets
display-name: mcp-google-sheets
homepage: https://github.com/xing5/mcp-google-sheets
repo: https://github.com/xing5/mcp-google-sheets
docs:
  - https://github.com/xing5/mcp-google-sheets#readme
config-file-location: null
credentials-file-location:
  unix:
    - credentials.json
    - token.json
    - /path/to/service-account-key.json
  windows:
    - C:\path\to\your\service-account-key.json
    - credentials.json
    - token.json
history:
  adoption-history:
    - >
      The supplied package facts list Homebrew packaging, and the official README
      includes PyPI version/download badges. That puts the project in both Python
      packaging and system package-manager discovery paths.
    - >
      Its adoption story is tied to practical MCP usage: spreadsheets are common
      business data stores, and this server exposes them as MCP tools for AI clients
      without each client needing its own Google Sheets integration.
  package-nerd-significance:
    - >
      mcp-google-sheets is package-nerd significant as a good example of a
      credential-heavy API integration being delivered as a small CLI/server package.
      Its README captures the packaging tension of MCP servers: easy uvx startup, but
      careful environment and secret handling.
  project-history:
    - >
      The GitHub repository was created in March 2025 and published a continuing 0.x
      release series through 2026, including v0.6.3 in May 2026. The README documents
      uvx as the recommended user path and also supports local development with uv and
      Docker/SSE operation.
    - >
      The project is centered on Google Cloud credentials and Sheets/Drive API setup:
      users create or select a GCP project, enable the Google Sheets and Drive APIs, and
      choose service account, OAuth, direct credential injection, or Application Default
      Credentials.
  related-projects:
    - >
      Related projects include other MCP servers for Google services, official Google
      Sheets and Drive APIs, and MCP-compatible clients such as Claude Desktop.
  sources:
    - https://github.com/xing5/mcp-google-sheets
    - https://github.com/xing5/mcp-google-sheets#readme
    - https://github.com/xing5/mcp-google-sheets/releases
    - https://modelcontextprotocol.io/introduction
    - source_facts.package-manager
  summary:
    - >
      mcp-google-sheets is a Python Model Context Protocol server that connects
      MCP-compatible AI clients to Google Drive and Google Sheets. The README presents
      it as an AI assistant gateway for creating, reading, and modifying spreadsheets
      through Google APIs.
  timeline:
    - '2025-03: GitHub repository created.'
    - '2025-05: Early 0.3 and 0.4 releases published.'
    - '2025-12: v0.6.0 published.'
    - '2026-05: v0.6.3 published on GitHub releases.'
  usage:
    - >
      Users typically run uvx mcp-google-sheets@latest after setting credentials and a
      Drive folder ID, then add the command to an MCP client such as Claude Desktop. The
      README documents service account and OAuth credential files, token storage, and
      direct base64 credential injection for container environments.
    - >
      The server exposes tools for listing spreadsheets, reading sheet data, updating
      cells, getting formulas, batch updates, and creating charts. It also documents
      tool filtering to reduce context usage when only a subset of spreadsheet tools is
      needed.
related-packages: []
category: ai
