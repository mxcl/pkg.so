id: brew:kdoctools
display-name: KDocTools
homepage: https://l10n.kde.org/docs/doc-primer/
repo: https://invent.kde.org/frameworks/kdoctools
docs:
  - https://api.kde.org/frameworks/kdoctools/html/index.html
  - https://invent.kde.org/frameworks/kdoctools
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      KDocTools is adopted indirectly by KDE packagers and application maintainers: it
      appears as a framework package in Homebrew and major Unix-like distributions
      because KDE projects use DocBook help files and translated documentation as part
      of their build and release process. Its value is most visible in packaging,
      localization, and reproducible documentation builds rather than in direct
      interactive use.
  package-nerd-significance:
    - >
      KDocTools is a classic dependency iceberg package: small, quiet, and easy to
      overlook, but important to making KDE source releases build complete help systems.
      It also preserves KDE's long-running DocBook documentation culture inside the
      modular KDE Frameworks packaging model.
  project-history:
    - >
      The KDocTools README describes the project as tools for generating documentation
      in various formats from DocBook files and credits Eric Bischoff, Claudiu Costin,
      Frederik Fouvry, David Rugge, and other contributors for the original
      documentation toolchain pieces. KDE's API documentation identifies the maintained
      framework as a KDE Community project, with support across Linux, FreeBSD, Windows,
      and macOS.
    - >
      KDocTools became one of the separately shipped KDE Frameworks modules when KDE
      Frameworks 5.0 was announced on 2014-07-07. That move put the old KDE platform
      library stack into smaller Qt-oriented framework packages, and the 5.0 source list
      explicitly included kdoctools-5.0.0. KDocTools later continued into the Qt 6
      generation as KF6DocTools, with KDE's 2024-02-28 MegaRelease shipping Frameworks 6
      alongside Plasma 6 and Gear 24.02.
  related-projects:
    - >
      KDocTools sits with KDE Frameworks, KDE's DocBook documentation workflow, KApiDox,
      and other KDE build-time infrastructure. It is related to DocBook itself as the
      source markup format and to KDE localization because translated manuals depend on
      this toolchain.
  sources:
    - https://api.kde.org/frameworks/kdoctools/html/index.html
    - https://invent.kde.org/frameworks/kdoctools
    - https://invent.kde.org/frameworks/kdoctools/-/raw/master/README.md
    - https://invent.kde.org/frameworks/kdoctools/-/raw/master/metainfo.yaml
    - https://kde.org/announcements/frameworks/5/5.0.0/
    - https://kde.org/announcements/megarelease/6/
  summary:
    - >
      KDocTools is the KDE Frameworks documentation-generation component for building
      KDE documentation from DocBook sources. Its package-nerd identity is less about an
      end-user command and more about the small but essential build-time tools,
      including meinproc6 and checkXML6, that let KDE applications ship localized help
      and manuals in a consistent format.
  timeline:
    - >
      1996-2025: KDE API documentation credits the KDE documentation corpus across this
      date range.
    - '2014-07-07: KDE Frameworks 5.0 shipped with a standalone kdoctools-5.0.0 source package.'
    - >
      2020-05-16: The KDE Invent project page records the current KDocTools GitLab
      project creation date after KDE infrastructure migration.
    - >
      2024-02-28: KDE MegaRelease 6 shipped Frameworks 6, and KDocTools continued as
      KF6DocTools.
  usage:
    - >
      Typical use is during builds or documentation checks, where KDE projects invoke
      KDocTools components to validate XML and transform DocBook documentation. Users
      usually encounter it as a build dependency for KDE software, while documentation
      maintainers encounter the command-line tools directly.
related-packages:
  - id: brew:docbook-xsl
    reason: >
      DocBook XSL supplies the stylesheet layer used to transform DocBook markup, making
      it a practical companion to KDocTools' KDE documentation-validation and generation
      workflow.
    rel: adjacent_workflow
    sources:
      - https://invent.kde.org/frameworks/kdoctools/-/raw/master/README.md
      - https://docbook.org/stylesheets/
category: developer-tools
