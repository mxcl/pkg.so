id: brew:fjira
display-name: Fjira
homepage: https://github.com/mk-5/fjira
repo: https://github.com/mk-5/fjira
docs:
  - https://github.com/mk-5/fjira#readme
config-file-location:
  unix:
    - ~/.fjira
    - ~/.fjira/fjira.yaml
    - ~/.fjira/colors.yml
credentials-file-location:
  unix:
    - ~/.fjira
    - ~/.fjira/fjira.yaml
history:
  adoption-history:
    - >
      Official installation notes list Homebrew, Snap, Debian packages from GitHub
      releases, AUR, Chocolatey, and source builds, indicating packaging aimed at
      developers who want Jira access without leaving the terminal.
  package-nerd-significance:
    - >
      Fjira is a representative modern Go CLI: a single executable, cross-platform
      packages, shell-first workflow, and a small YAML state directory for service
      credentials.
  project-history:
    - >
      The public GitHub release stream begins in July 2022. The README presents Fjira as
      a fuzzy-finder style Jira interface with direct issue opening, JQL searches,
      comments, status changes, assignee changes, and multi-workspace support.
    - >
      The project later moved from a custom Homebrew tap to Homebrew Core, which is the
      main source-backed adoption signal available in the official README.
  related-projects:
    - Jira, Go, fuzzy-finder terminal interfaces, Homebrew Core, Chocolatey, AUR.
  sources:
    - https://github.com/mk-5/fjira
    - https://api.github.com/repos/mk-5/fjira/releases
  summary:
    - >
      Fjira is a Go command-line and terminal UI client for Jira, centered on fuzzy
      project and issue navigation from a shell.
  timeline:
    - '2022: First public GitHub releases.'
    - '2023: 0.11.x releases published on GitHub.'
    - '2020s: Homebrew distribution moved from a custom tap to Homebrew Core.'
  usage:
    - >
      First run prompts for a Jira API URL and token, then stores workspace data under
      ~/.fjira. Common use is interactive project or issue search, direct issue-key
      opening, saved filter search, and custom JQL execution.
related-packages:
  - id: brew:jira-cli
    reason: >
      Choose jira-cli when you need a more extensive command hierarchy, non-interactive
      automation, and plain, CSV, or raw JSON output in addition to an interactive Jira
      interface.
    rel: alternative
    sources:
      - https://github.com/mk-5/fjira#readme
      - https://github.com/ankitpokhrel/jira-cli#readme
  - id: brew:go-jira
    reason: >
      Choose go-jira when hierarchical per-user and per-project configuration,
      templates, and custom commands matter more than Fjira's fuzzy-finder TUI.
    rel: alternative
    sources:
      - https://github.com/mk-5/fjira#readme
      - https://github.com/go-jira/jira#readme
category: developer-tools
package-manager:
  brew: fjira
package-manager-url: https://formulae.brew.sh/formula/fjira
license: AGPL-3.0-only
tags:
  - cli
  - fuzzy-finder
  - go
  - jira
  - tui
description: Fuzzy-find cli jira interface
executables:
  - fjira
provenance:
  formula: fjira
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
