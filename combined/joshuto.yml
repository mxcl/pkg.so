homepage: https://github.com/kamiyaa/joshuto
repo: https://github.com/kamiyaa/joshuto
docs:
  - https://github.com/kamiyaa/joshuto/tree/main/docs
  - https://github.com/kamiyaa/joshuto#readme
config-file-location:
  unix:
    - $JOSHUTO_CONFIG_HOME/joshuto.toml
    - $JOSHUTO_CONFIG_HOME/keymap.toml
    - $JOSHUTO_CONFIG_HOME/mimetype.toml
    - $JOSHUTO_CONFIG_HOME/theme.toml
    - $JOSHUTO_CONFIG_HOME/icons.toml
    - $XDG_CONFIG_HOME/joshuto/joshuto.toml
    - ~/.config/joshuto/joshuto.toml
    - $XDG_CONFIG_HOME/joshuto/keymap.toml
    - ~/.config/joshuto/keymap.toml
    - $XDG_CONFIG_HOME/joshuto/mimetype.toml
    - ~/.config/joshuto/mimetype.toml
    - $XDG_CONFIG_HOME/joshuto/theme.toml
    - ~/.config/joshuto/theme.toml
    - $XDG_CONFIG_HOME/joshuto/icons.toml
    - ~/.config/joshuto/icons.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Joshuto's packaging footprint grew from Rust/Cargo distribution into Unix
      package-manager entries. The README lists Homebrew for macOS/Linux, MacPorts,
      Arch/AUR and archlinuxcn, Fedora COPR, Gentoo overlays, and Nix usage examples,
      while the input metadata records Homebrew, MacPorts, and Nix package names.
  package-nerd-significance:
    - >
      For package nerds, Joshuto is part of the wave of Rust rewrites and reimaginings
      of classic terminal utilities. It is not just a Rust port of an idea; its async
      file operations, TOML configuration, and package-manager spread make it a useful
      marker of how terminal file managers evolved after ranger, lf, and vifm.
  project-history:
    - >
      The kamiyaa/joshuto repository was created in July 2018. Its README describes
      Joshuto directly as a ranger-like terminal file manager and documents Cargo,
      source, precompiled-binary, package-manager, and Nix-based installation paths.
    - >
      Release metadata shows an early 0.2.0 release in July 2018, followed by a long
      prerelease series through the 0.9.x line. The project later added crates.io
      distribution, with the 0.9.2 release notes calling out that publication.
  related-projects:
    - >
      Joshuto is explicitly related to ranger, and it sits near other terminal file
      managers such as lf, vifm, Midnight Commander, and Yazi. Its optional integrations
      with fzf, zoxide, clipboard helpers, image preview tooling, and devicons tie it
      into the broader modern terminal workflow stack.
  sources:
    - https://crates.io/crates/joshuto
    - https://formulae.brew.sh/formula/joshuto
    - https://github.com/kamiyaa/joshuto
    - https://github.com/kamiyaa/joshuto/releases
    - https://raw.githubusercontent.com/kamiyaa/joshuto/main/README.md
  summary:
    - >
      Joshuto is a ranger-like terminal file manager written in Rust. It carries the
      familiar keyboard-driven, multi-column file-manager style into the Rust
      terminal-tool ecosystem, with features such as tabs, file previews, async file
      operations, custom keymaps, themes, and integration with tools like fzf and
      zoxide.
  timeline:
    - '2018-07: The kamiyaa/joshuto repository was created on GitHub.'
    - '2018-07: Release 0.2.0 was published.'
    - '2020-11: Release 0.9.2 noted crates.io publication.'
    - '2025-05: Release v0.9.9 was published.'
  usage:
    - >
      Joshuto is used as an interactive terminal file manager for browsing, opening,
      renaming, deleting, copying, moving, symlinking, previewing, and bulk-renaming
      files. Its value is strongest for users who already live in shells and modal
      editors and want a ranger-style file browser without leaving the terminal.
related-packages:
  - id: brew:ranger
    reason: >
      Choose Ranger for the established Python-based console file manager and its mature
      plugin and rifle ecosystems; choose Joshuto for a Ranger-like workflow implemented
      as a Rust application with asynchronous file operations.
    rel: alternative
    sources:
      - https://github.com/kamiyaa/joshuto#readme
      - https://ranger.fm/
  - id: brew:fzf
    reason: >
      Joshuto documents fzf as an optional dependency and provides commands that use it
      for fuzzy searching the current directory or jumping to a subdirectory.
    rel: adjacent_workflow
    sources:
      - https://github.com/kamiyaa/joshuto#dependencies
      - >
        https://github.com/kamiyaa/joshuto/blob/main/docs/configuration/keymap.toml.md#integration
      - https://github.com/junegunn/fzf#readme
  - id: brew:zoxide
    reason: >
      Joshuto documents zoxide as an optional dependency and exposes `z` and `zi`
      integration commands for ranked and interactive directory navigation.
    rel: adjacent_workflow
    sources:
      - https://github.com/kamiyaa/joshuto#dependencies
      - >
        https://github.com/kamiyaa/joshuto/blob/main/docs/configuration/keymap.toml.md#integration
      - https://github.com/ajeetdsouza/zoxide#readme
