id: brew:lowdown
display-name: lowdown
homepage: https://kristaps.bsd.lv/lowdown
repo: https://github.com/kristapsdz/lowdown
docs:
  - https://kristaps.bsd.lv/lowdown
  - https://kristaps.bsd.lv/lowdown/lowdown.1.html
  - https://kristaps.bsd.lv/lowdown/lowdown.3.html
  - https://kristaps.bsd.lv/lowdown/lowdown.5.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site advises users to check their system package manager before
      building from source, and the batch input records packaging across Homebrew,
      Alpine, Debian/Ubuntu development packages, Fedora, MacPorts, Nix, Arch, and
      openSUSE. That broad packaging fits lowdown's profile as a small C tool and
      library useful in Unix documentation pipelines.
    - >
      The repository was created on GitHub in 2016. The project site reports version
      3.0.1 and says lowdown has no dependencies, with portability across OpenBSD,
      NetBSD, FreeBSD, Mac OS X, Linux with glibc and musl, Solaris, and Illumos through
      `oconfigure`.
  package-nerd-significance:
    - >
      lowdown is significant to package people because it is a compact, portable
      Markdown engine in C with no runtime dependency chain and many output back ends.
      It sits naturally beside `mandoc`, `groff`, and static-site/documentation tools,
      and its library packages make it useful both as a CLI and as an embeddable
      renderer.
  project-history:
    - >
      The official GitHub README states that lowdown is a fork of hoedown, but that its
      parser and front ends have changed significantly. The official project site
      describes it as a BSD.lv text-processing project and points to the GitHub
      repository for development, while directing stable releases, documentation, and
      general information to kristaps.bsd.lv.
    - >
      A key design point in the official site is that lowdown internally converts
      Markdown to an AST rather than directly formatting output. That architecture
      supports semantic analysis such as the `lowdown-diff` Markdown tree differ, and it
      helps explain why the project grew beyond a simple one-format Markdown renderer.
  related-projects:
    - hoedown is the fork source named by lowdown's README.
    - >
      mandoc, groff, LaTeX, Gemini, and OpenDocument are important output or workflow
      neighbors named in the official docs.
    - oconfigure is the portability/build framework linked from the official site.
  sources:
    - https://api.github.com/repos/kristapsdz/lowdown
    - https://github.com/kristapsdz/lowdown#readme
    - https://kristaps.bsd.lv/lowdown/
    - https://kristaps.bsd.lv/lowdown/lowdown.1.html
    - https://kristaps.bsd.lv/lowdown/lowdown.3.html
    - https://kristaps.bsd.lv/lowdown/lowdown.5.html
    - source_facts.package-manager-url
  summary:
    - >
      lowdown is Kristaps Dzonsons' dependency-free C Markdown translator. It converts
      Markdown into HTML5, roff formats, LaTeX, Gemini text, OpenDocument, and
      ANSI/UTF-8 terminal output, and it also exposes a C library API.
  timeline:
    - '2016: `kristapsdz/lowdown` repository created on GitHub.'
    - '2020s: Version 2.0.0 adopts semantic versioning according to the official site.'
    - >
      2026: Official site reports version 3.0.1 and repository metadata shows active
      maintenance.
  usage:
    - >
      As a CLI, `lowdown` can render Markdown to terminal output for quick review,
      standalone HTML5, roff `ms` or `man` output for PDF/manpage workflows, LaTeX,
      OpenDocument, Gemini text, and more. The site gives examples such as `lowdown -t
      term README.md | less -R`, `lowdown -s -o README.html README.md`, and roff/LaTeX
      pipelines for PDF generation.
    - >
      As a library, `lowdown(3)` exposes the parser and renderers used internally by
      `lowdown(1)` and `lowdown-diff(1)`. The language manual `lowdown(5)` documents
      Markdown features and extensions including autolinks, fenced code, tables,
      footnotes, smart typography, metadata, definition lists, task lists, admonitions,
      and templating.
related-packages:
  - id: brew:cmark
    reason: >
      Choose cmark when conformance to the CommonMark reference implementation is the
      priority; lowdown supports a broader set of Markdown extensions and
      document-oriented output formats.
    rel: alternative
    sources:
      - https://github.com/commonmark/cmark#readme
      - https://kristaps.bsd.lv/lowdown/
  - id: brew:pandoc
    reason: >
      Choose Pandoc for conversion among many markup and word-processing input formats
      and for filter-driven publishing workflows; lowdown is a smaller dependency-free C
      tool centered on Markdown input.
    rel: alternative
    sources:
      - https://pandoc.org/MANUAL.html
      - https://kristaps.bsd.lv/lowdown/
category: developer-tools
package-manager:
  apk: lowdown
  brew: lowdown
  debian: liblowdown-dev
  dnf: lowdown
  macports: lowdown
  nix: lowdown
  pacman: lowdown
  ubuntu: liblowdown-dev
  zypper: liblowdown4
package-manager-url: https://formulae.brew.sh/formula/lowdown
license: ISC
tags:
  - cli
  - document-conversion
  - gemini
  - html
  - latex
  - markdown
  - roff
description: Simple markdown translator
executables:
  - lowdown
  - lowdown-diff
provenance:
  formula: lowdown
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
