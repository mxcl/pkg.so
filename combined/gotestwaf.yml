id: brew:gotestwaf
display-name: GoTestWAF
homepage: https://lab.wallarm.com/test-your-waf-before-hackers/
repo: https://github.com/wallarm/gotestwaf
docs:
  - https://github.com/wallarm/gotestwaf/tree/master/docs
  - https://github.com/wallarm/gotestwaf#readme
config-file-location:
  unix: config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged as a Docker image and a Homebrew formula, which matches
      its evaluation-tool use case: users can run it near the target application or
      security appliance without embedding it into application code.
  package-nerd-significance:
    - >
      For package catalogs, GoTestWAF is a niche but useful security-testing CLI: it
      packages repeatable malicious-request generation as a portable Go binary and
      container, rather than as a SaaS-only scanner.
  project-history:
    - >
      The repository was created in January 2020. The README describes a scanner that
      generates malicious requests by combining payloads, encoders, and request
      placeholders, then records how the evaluated security solution handled those
      requests.
  related-projects:
    - OWASP test categories and API-security scenarios shape the bundled test cases.
    - >
      Wallarm publishes the project and Docker image for WAF and API-security evaluation
      workflows.
  sources:
    - https://formulae.brew.sh/formula/gotestwaf
    - https://github.com/wallarm/gotestwaf
    - https://github.com/wallarm/gotestwaf#readme
    - https://github.com/wallarm/gotestwaf/releases
    - https://github.com/wallarm/gotestwaf/tree/master/docs
  summary:
    - >
      GoTestWAF is Wallarm's Go-based command-line tool for simulating API and
      OWASP-style attacks against web application firewalls, API gateways, IPS products,
      and related application-security controls.
  timeline:
    - '2020: Repository created.'
    - '2022: README badge identifies GoTestWAF with Black Hat Arsenal USA 2022.'
    - '2024: v0.4.19 and v0.5.x releases published through GitHub releases.'
    - '2025: v0.5.8 release fixed HTML report validation.'
  usage:
    - >
      Users point GoTestWAF at an evaluated URL and run built-in test sets such as OWASP
      Top 10 and OWASP API, or supply custom YAML test cases. Reports can be generated
      locally, and releases in 2024 and 2025 emphasize report-format and validation
      work.
related-packages: []
category: security
package-manager:
  brew: gotestwaf
  nix: gotestwaf
package-manager-url: https://formulae.brew.sh/formula/gotestwaf
license: MIT
