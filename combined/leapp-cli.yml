id: brew:leapp-cli
display-name: Leapp CLI
homepage: https://www.leapp.cloud/
repo: https://github.com/Noovolari/leapp
docs:
  - https://docs.leapp.cloud/0.11.1/cli/help
  - https://docs.leapp.cloud/0.11.1/installation/install-leapp
  - https://github.com/Noovolari/leapp#readme
config-file-location:
  unix:
    - ~/.Leapp/Leapp-lock.json
    - ~/.Leapp/Leapp-lock.backup.bin
  windows:
    - C:\Users\<USER>\.Leapp\Leapp-lock.json
    - C:\Users\<USER>\.Leapp\Leapp-lock.backup.bin
credentials-file-location:
  unix: ~/.aws
  windows: C:\Users\<USER>\.aws
history:
  adoption-history:
    - >
      Leapp's website positioned it for developers operating across multiple cloud
      accounts and stated that more than 8000 builders used Leapp every day. In May
      2024, Noovolari announced the end of its company and commercial Leapp Team and Pro
      activity, while saying the open-source Leapp project would continue through a
      transition.
  package-nerd-significance:
    - >
      leapp-cli is notable in package indexes because it packages identity and
      cloud-credential session management as a local developer tool, bridging GUI-based
      cloud access, AWS credential files, AWS credential_process, and command-line
      automation.
  project-history:
    - >
      The Leapp repository describes a cross-platform cloud access app built on Electron
      and focused on cloud credential generation, local encrypted storage, multiple
      access strategies, and automatic short-lived credential rotation. The CLI exposes
      those session and credential workflows to shells and automation.
  related-projects:
    - >
      Related technologies include AWS STS, AWS CLI credential_process, AWS SSO, Azure
      access integrations, Electron, system vault/keychain storage, and Noovolari's
      Leapp desktop app.
  sources:
    - https://blog.leapp.cloud/noovolari-has-officially-come-to-an-end
    - https://docs.leapp.cloud/latest/security/credential-process/
    - https://docs.leapp.cloud/latest/security/credentials-generation/aws/
    - https://formulae.brew.sh/formula/leapp-cli
    - https://github.com/Noovolari/leapp
    - https://github.com/Noovolari/leapp/blob/master/CHANGELOG.md
    - https://www.leapp.cloud/
  summary:
    - >
      Leapp CLI is the command-line companion to Leapp, Noovolari's open-source cloud
      access and credential-management tool for AWS and Azure workflows.
  timeline:
    - '2022: Leapp documentation footer identifies the Noovolari documentation set.'
    - >
      2024-05-13: Noovolari announced the end of the company and commercial Leapp
      Team/Pro activity.
    - >
      2024-06-05: Leapp docs and changelog pages record updates around credential and
      workspace behavior.
  usage:
    - >
      The official security docs describe AWS credential-file and credential-process
      modes. Leapp can generate temporary credentials through STS, rotate them, and
      configure AWS credential_process entries such as credential_process=leapp session
      generate SESSION_ID for tools that use the AWS credential chain.
related-packages:
  - id: cask:leapp
    reason: >
      Install the Leapp desktop application alongside this CLI because the official CLI
      documentation states that the desktop app must be installed and running, and the
      CLI operates on its workspaces and sessions.
    rel: adjacent_workflow
    sources:
      - https://docs.leapp.cloud/latest/cli/
      - https://github.com/Noovolari/leapp#readme
  - id: brew:awscli
    reason: >
      Use AWS CLI with Leapp because Leapp can write standard AWS profiles or supply
      temporary credentials through `credential_process`, which AWS CLI officially
      supports as an external credential source.
    rel: adjacent_workflow
    sources:
      - https://docs.leapp.cloud/latest/security/credential-process/
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sourcing-external.html
  - id: brew:granted
    reason: >
      Choose Granted for an AWS-focused, shell-first role-assumption and browser-console
      workflow; choose Leapp when you want a desktop-managed session model with AWS and
      Azure support plus a companion CLI.
    rel: alternative
    sources:
      - https://docs.granted.dev/getting-started/
      - https://docs.leapp.cloud/latest/cli/
      - https://github.com/Noovolari/leapp#readme
category: security
package-manager:
  brew: leapp-cli
package-manager-url: https://formulae.brew.sh/formula/leapp-cli
license: MPL-2.0
tags:
  - aws
  - azure
  - cli
  - cloud-credentials
  - credential-manager
  - temporary-credentials
description: Cloud credentials manager cli
executables:
  - leapp
provenance:
  formula: leapp-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
