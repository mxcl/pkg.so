id: brew:jsonnet
display-name: Jsonnet
homepage: https://jsonnet.org/
repo: https://github.com/google/jsonnet
docs:
  - https://jsonnet.org/learning
  - https://jsonnet.org/ref/language.html
  - https://jsonnet.org/ref/spec.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Jsonnet's adoption grew around infrastructure and configuration workflows where
      plain JSON was too repetitive but teams still wanted deterministic data
      generation. The official site describes use by many companies and projects, and
      the GitHub README documents packaging through Homebrew, MSYS2, PyPI bindings, and
      vcpkg.
  package-nerd-significance:
    - >
      Jsonnet matters to package nerds because it created a recognizable ecosystem:
      interpreters, bindings, formatters, package-manager formulas, and Jsonnet-specific
      dependency tools such as jsonnet-bundler. It is also a useful reference point in
      debates about JSON-compatible configuration languages versus general-purpose code
      generation.
  project-history:
    - >
      The Jsonnet website says the language began in early 2014 as a Google 20 percent
      project and launched on August 6. The same page explains that its design was
      influenced by internal Google configuration languages and experience configuring
      large systems, while also stating that Jsonnet is not an official Google product.
    - >
      The public google/jsonnet repository's first commit was made on 2014-08-06. A
      Google Open Source Blog post on 2015-04-20 described Jsonnet as a simple but rich
      configuration language that had been quietly released a few months earlier and
      emphasized that valid JSON is also valid Jsonnet.
    - >
      The original implementation lives in the google/jsonnet repository. The README
      points users to the Jsonnet website for documentation and names go-jsonnet, the Go
      implementation, as a faster option for some use cases.
  related-projects:
    - >
      Jsonnet is directly related to go-jsonnet, jsonnet-bundler, Jsonnet language
      bindings, jsonnetfmt, and configuration ecosystems that consume generated JSON or
      YAML.
  sources:
    - https://api.github.com/repos/google/jsonnet
    - https://formulae.brew.sh/formula/jsonnet
    - https://github.com/google/jsonnet
    - https://github.com/google/jsonnet/commit/55002bc60e4679800958828ff1c2da6de7db5007
    - https://github.com/google/jsonnet/releases/tag/v0.22.0
    - https://jsonnet.org/
    - https://jsonnet.org/articles/design.html
    - https://jsonnet.org/learning/getting_started.html
    - https://opensource.googleblog.com/2015/04/jsonnet-more-elegant-language-for.html
  summary:
    - >
      Jsonnet is a data templating language for generating JSON, YAML, INI, and similar
      configuration data. It is one of the better-known examples of a configuration DSL
      that deliberately extends JSON while adding functions, object-oriented
      composition, imports, a standard library, formatting, and a formal specification.
  timeline:
    - '2014: Jsonnet began in early 2014 as a Google 20 percent project.'
    - >
      2014-08-06: Jsonnet launched and the public GitHub repository received its initial
      commit.
    - >
      2015-04-20: Google Open Source Blog introduced Jsonnet as a richer language for
      composing JSON.
    - '2026-03-24: v0.22.0 release published.'
  usage:
    - >
      Users run `jsonnet` on a file or expression to emit JSON, use `jsonnetfmt` to
      reformat source, and use manifests to generate non-JSON output. The language is
      side-effect free and designed for modular configuration data rather than general
      application programming.
related-packages:
  - id: brew:go-jsonnet
    reason: >
      Choose go-jsonnet when you want a production-ready pure-Go implementation or an
      embeddable Go API instead of the original C++ implementation.
    rel: alternative
    sources:
      - https://github.com/google/jsonnet
      - https://github.com/google/go-jsonnet
  - id: brew:jsonnet-bundler
    reason: >
      jsonnet-bundler records and vendors reusable Jsonnet libraries in
      `jsonnetfile.json` for resolution through Jsonnet import paths.
    rel: adjacent_workflow
    sources:
      - https://github.com/jsonnet-bundler/jsonnet-bundler
      - https://jsonnet.org/learning/getting_started.html
  - id: brew:tanka
    reason: >
      Grafana Tanka uses Jsonnet to define Kubernetes resources and adds environment,
      diff, and deployment workflows around the generated configuration.
    rel: adjacent_workflow
    sources:
      - https://tanka.dev/jsonnet/overview/
      - https://jsonnet.org/
category: developer-tools
