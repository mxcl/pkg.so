id: brew:ios-deploy
display-name: ios-deploy
homepage: https://github.com/ios-control/ios-deploy
repo: https://github.com/ios-control/ios-deploy
docs:
  - https://github.com/ios-control/ios-deploy#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ios-deploy became part of the Cordova/PhoneGap-style and CI-friendly iOS
      developer-tool chain because it made device install/debug operations addressable
      from scripts. npm registry metadata shows npm distribution beginning in 2013, and
      Homebrew, MacPorts, and Nix packaging in the input metadata show broader
      package-manager adoption.
  package-nerd-significance:
    - >
      ios-deploy is a package-nerd landmark because it turned a GUI-centered Apple
      workflow into a composable CLI. It became the sort of package CI scripts and
      hybrid-app toolchains could depend on, while also exposing how sensitive these
      packages are to private or shifting Apple device-communication frameworks.
  project-history:
    - >
      The repository dates to 2013 and the package.json names Greg Hughes as author. The
      project historically gave non-Xcode workflows a scriptable bridge to Apple device
      deployment and LLDB debugging, with a binary exposed as ios-deploy for npm and
      package-manager installs.
    - >
      The README records an important later transition: Apple changed the system
      frameworks used for device communication in iOS 17 and supplied command-line tools
      that can largely replace ios-deploy. It also notes that the old 1.x branch was
      archived and that planned 2.x restructuring was abandoned in favor of simpler
      master-branch development.
  related-projects:
    - >
      The README links SDMMobileDevice as a source for error-code handling and points to
      PhoneGap milestones, reflecting the tool's relationship to hybrid mobile
      development. It overlaps functionally with Xcode, LLDB, Apple device tools, and
      higher-level build systems that need command-line deployment.
  sources:
    - https://formulae.brew.sh/formula/ios-deploy
    - https://github.com/ios-control/ios-deploy
    - https://raw.githubusercontent.com/ios-control/ios-deploy/master/README.md
    - https://raw.githubusercontent.com/ios-control/ios-deploy/master/package.json
    - https://registry.npmjs.org/ios-deploy
  summary:
    - >
      ios-deploy is a command-line tool for installing, launching, debugging, and
      inspecting iOS apps on physical devices. The upstream README positions it as a way
      to install and debug apps from the command line, especially for un-jailbroken
      devices before the iOS 17 tooling shift.
  timeline:
    - '2013: GitHub repository created and npm package publication began.'
    - '2013: Version 1.0 tag appears in the Git history.'
    - '2023: Version 1.12.2 tag used by Homebrew as the stable source archive.'
    - >
      2023: iOS 17 changed the underlying Apple frameworks, and the README points users
      toward Apple command-line replacements for many workflows.
  usage:
    - >
      Typical invocations install an app bundle, launch it under LLDB, list connected
      devices, upload and download files from an app container, inspect installed bundle
      IDs, manage provisioning profiles, and emit JSON output for scripts. The README
      requires macOS, Xcode, and a valid iOS development certificate.
related-packages:
  - id: brew:ideviceinstaller
    reason: >
      Choose ideviceinstaller for cross-platform install, upgrade, uninstall, and
      app-enumeration workflows through libimobiledevice; choose ios-deploy on supported
      macOS/iOS combinations when installation must be combined with LLDB debugging and
      app-container operations.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/ios-control/ios-deploy/master/README.md
      - https://raw.githubusercontent.com/libimobiledevice/ideviceinstaller/master/README.md
  - id: brew:lldb
    reason: >
      ios-deploy's debug mode installs the app and launches it in LLDB, making LLDB the
      documented interactive debugger for that workflow.
    rel: adjacent_workflow
    sources:
      - https://raw.githubusercontent.com/ios-control/ios-deploy/master/README.md
      - https://lldb.llvm.org/
category: developer-tools
