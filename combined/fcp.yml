id: brew:fcp
display-name: fcp
homepage: https://github.com/Svetlitski/fcp/
repo: https://github.com/Svetlitski/fcp
docs:
  - https://github.com/Svetlitski/fcp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents installation by cargo, prebuilt GitHub release
      binaries, Homebrew on macOS, Arch Linux through an AUR package, and NixOS stable
      beginning with NixOS 21.11. That adoption is modest but enough to make it visible
      to Unix package users looking for faster bulk copies.
  package-nerd-significance:
    - >
      fcp is a small example of the modern package-manager niche around faster Rust
      rewrites of core Unix-adjacent commands. Its significance is practical rather than
      historical: install it when its benchmarked copy pattern matches your storage,
      keep `cp` for full POSIX option compatibility.
  project-history:
    - >
      The public repository was created in January 2021, and its early v0.1.0 tag
      appeared in June 2021. The README frames the project narrowly: it is not a
      complete `cp` replacement, but a faster implementation for the most common copy
      cases.
  related-projects:
    - fcp positions itself directly against classic Unix `cp(1)` for common copy use cases.
    - >
      Its README links the macOS large-file speedup to copy-on-write behavior exposed by
      the operating system.
  sources:
    - https://github.com/Svetlitski/fcp
    - https://github.com/Svetlitski/fcp/blob/master/README.md
    - https://api.github.com/repos/Svetlitski/fcp
    - https://api.github.com/repos/Svetlitski/fcp/tags?per_page=100
  summary:
    - >
      fcp is a Rust command-line file-copy tool that targets the common Unix `cp`
      workflow but optimizes for parallel directory traversal and SSD-backed copies.
  timeline:
    - '2021: Public repository created.'
    - '2021: v0.1.0 tag published and README benchmark material documented.'
    - '2026: v0.2.2 tag published.'
  usage:
    - >
      The supported command shape mirrors common `cp`: copy one source to a destination
      file, or copy multiple sources into a destination directory. The README notes
      Unix-like operating-system support and warns that the tool is optimized for SSDs,
      with poor performance possible on hard drives.
    - >
      Its performance story is based on parallelizing directory walking and copying
      across CPU cores, plus platform copy-on-write support on macOS through underlying
      system calls.
related-packages:
  - id: brew:coreutils
    reason: >
      Choose GNU Coreutils `cp` when scripts need its mature metadata, recursive-copy,
      linking, backup, or portability options; choose fcp for its narrower parallel-copy
      path on SSD-backed Unix systems.
    rel: alternative
    sources:
      - https://github.com/Svetlitski/fcp
      - https://www.gnu.org/software/coreutils/manual/html_node/cp-invocation.html
category: system
package-manager:
  brew: fcp
  nix: fcp
package-manager-url: https://formulae.brew.sh/formula/fcp
license: BSD-3-Clause
tags:
  - cli
  - copy
  - filesystem
  - rust
  - unix
description: Significantly faster alternative to the classic Unix cp(1) command
executables:
  - fcp
provenance:
  formula: fcp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
