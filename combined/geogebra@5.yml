config-file-location:
  macos: /Library/Preferences/com.apple.java.util.prefs.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      GeoGebra grew into a multilingual community with millions of users in nearly every
      country. Its official site describes it as a leading provider of dynamic
      mathematics software and says its engine powers hundreds of educational websites.
    - >
      In 2021, GeoGebra became part of the BYJU'S family. GeoGebra Classic 5 remains the
      traditional Java-based desktop line alongside newer web-oriented GeoGebra
      applications.
  package-nerd-significance:
    - >
      Classic 5 matters to package users because it preserves GeoGebra's mature desktop
      interface and broad collection of geometry, algebra, spreadsheet, CAS, statistics,
      and 3D tools in a locally installed application.
    - >
      The public GitHub source tree is explicitly a mirror of GeoGebra's private GitLab
      repository. It documents a dedicated desktop build target for Classic 5, but is
      not returned as the canonical repository because mirror repositories are excluded
      by the requested repository policy.
  project-history:
    - >
      GeoGebra developed as a unified dynamic-mathematics environment, combining
      geometry with algebra, graphing, spreadsheets, statistics, calculus, and later
      classroom collaboration.
    - >
      The product expanded beyond its desktop application into a large online resource
      and classroom platform while retaining GeoGebra Classic as its comprehensive
      application.
  related-projects:
    - GeoGebra Classic 6
    - GeoGebra Graphing Calculator
    - GeoGebra Geometry
    - GeoGebra CAS Calculator
    - GeoGebra Classroom
  sources:
    - https://github.com/geogebra/geogebra
    - https://github.com/geogebra/manual
    - https://www.geogebra.org/about
  summary:
    - >
      GeoGebra Classic 5 is the mature desktop edition of GeoGebra's integrated
      dynamic-mathematics environment.
  timeline:
    - >
      Desktop era: GeoGebra established Classic as its comprehensive geometry, algebra,
      graphing, spreadsheet, statistics, calculus, CAS, and 3D application.
    - "2021: GeoGebra became part of the BYJU'S family."
    - >
      Current maintenance: The official source mirror retains a dedicated Classic 5
      desktop build target.
  usage:
    - >
      Students, teachers, and researchers use Classic 5 to construct dynamic geometry,
      graph functions, perform symbolic and numerical calculations, analyze data, and
      create interactive teaching materials.
    - >
      The official source instructions run the desktop edition through the Gradle
      desktop target, reflecting Classic 5's continued importance to developers and
      users who need the full desktop interface.
