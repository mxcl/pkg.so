id: brew:bend
display-name: Bend
homepage: https://bend-lang.com
repo: https://github.com/bendlang/bend
docs:
  - https://bend-lang.org/
  - https://github.com/bendlang/bend/blob/main/guide/GUIDE.md
config-file-location: null
credentials-file-location:
  unix: ~/.bend/bender.json
history:
  adoption-history:
    - >
      Bend first attracted package-manager interest as a high-level language for
      parallel CPU and GPU programs. The supplied Homebrew facts show that it is
      distributed as the `bend` formula; its official installer also targets Linux and
      macOS.
    - >
      The current Bend 2 documentation positions the language for AI-assisted
      development in which project laws and proofs mechanically constrain generated
      code. The project calls Bend young and documents substantial current limitations,
      so its adoption remains experimental rather than mainstream.
  package-nerd-significance:
    - >
      Bend is notable for trying to expose interaction-net-style parallel computation
      without requiring programmers to write threads, locks, or GPU kernels.
    - >
      The Bend 1-to-Bend 2 transition is unusually substantial: the official project
      says Bend 1 programs and HVM do not carry over, while Bend 2 combines dependent
      types, affine values, proof checking, and native or GPU compilation.
  project-history:
    - >
      Bend originated at Higher Order Company as a high-level language over the HVM
      parallel runtime. Its first public generation emphasized writing ordinary-looking
      programs that could exploit interaction-net parallelism on CPUs and GPUs.
    - >
      The current Bend 2 project changed direction toward a strongly typed,
      proof-oriented language. It introduces laws and proof definitions, compiles to
      targets including C, CUDA, Metal, and JavaScript, and explicitly distinguishes
      itself from the incompatible Bend 1 design.
  related-projects:
    - HVM, the interaction-net-based runtime associated with Bend 1.
    - BendTT, the affine dependent type theory described as Bend's core.
    - BendRT, the project's parallel runtime for CPUs and GPUs.
    - Lean, whose proof-oriented type-system ideas are referenced by the Bend guide.
  sources:
    - https://bend-lang.org/
    - https://github.com/bendlang/bend
    - https://github.com/bendlang/bend/blob/main/guide/GUIDE.md
    - source_facts.package-manager
  summary:
    - >
      Bend is an experimental programming language built around fast native execution,
      automatic parallelism, and mechanically checked laws and proofs.
  timeline:
    - '2024: Bend 1 was publicly available as a high-level parallel language built around HVM.'
    - >
      Bend 2: The project moved to an incompatible, proof-oriented design with dependent
      types and CPU/GPU compilation.
  usage:
    - >
      Users write `.bend` source files and run them with the `bend` command. The bundled
      guide is also available through `bend guide`.
    - >
      For proof-constrained projects, the official workflow places invariants in
      `LAWS.bend`, implements proofs in Bend definitions, and checks the proof-bearing
      program before changes are accepted.
    - >
      The project recommends Bend primarily for back-end work on Linux and macOS;
      Windows is not natively supported, although WSL can be used.
related-packages: []
category: language-runtime
package-manager:
  brew: bend
package-manager-url: https://formulae.brew.sh/formula/bend
license: Apache-2.0
tags:
  - cli
  - compiler
  - dependent-types
  - formal-verification
  - gpu
  - parallel-computing
  - programming-language
  - theorem-proving
description: Language that blocks AI mistakes via proof
executables:
  - bend
provenance:
  formula: bend
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
