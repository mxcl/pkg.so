id: brew:meta-package-manager
display-name: Meta Package Manager
homepage: https://kdeldycke.github.io/meta-package-manager/
repo: https://github.com/kdeldycke/meta-package-manager
docs:
  - https://github.com/kdeldycke/meta-package-manager#readme
  - https://kdeldycke.github.io/meta-package-manager
config-file-location:
  macos:
    - pyproject.toml
    - ~/Library/Application Support/mpm/config.toml
  unix:
    - pyproject.toml
    - ~/.config/mpm/config.toml
  windows:
    - pyproject.toml
    - '%APPDATA%\mpm\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      In practice, mpm is a power-user and fleet-maintenance tool: it is useful when a
      workstation has Homebrew, pipx, npm, cargo, and OS packages side by side and the
      user wants one inventory or upgrade command. It sits near tools such as
      PackageKit, Ansible package modules, or platform-specific wrappers, but its niche
      is an interactive and scriptable local CLI rather than a configuration-management
      system.
  project-history:
    - >
      The tool's history is tied less to one platform than to the long-standing problem
      of machines accumulating several package ecosystems at once. Its documentation and
      README show support across macOS, Linux, Windows, BSD-like systems, and managers
      including apt, brew, cargo, dnf, flatpak, gem, npm, pacman, pip, pipx, scoop,
      snap, winget, yarn, zypper, and others, with support varying by operation. Release
      notes and documentation also emphasize backup and restore manifests, release-age
      cooldowns as a supply-chain mitigation, and cross-platform standalone binaries.
  sources:
    - https://formulae.brew.sh/formula/meta-package-manager
    - https://github.com/kdeldycke/meta-package-manager
    - https://github.com/kdeldycke/meta-package-manager/blob/main/readme.md
    - https://github.com/kdeldycke/meta-package-manager/releases
    - https://kdeldycke.github.io/meta-package-manager/install.html
    - https://pypi.org/project/meta-package-manager/5.7.0/
  summary:
    - >
      Meta Package Manager, commonly invoked as mpm, is a unifying command-line wrapper
      around many native package managers. The project is maintained by kdeldycke and
      describes itself as a package-manager analogue to yt-dlp: one CLI that discovers
      package managers on the machine and normalizes common operations such as listing
      installed packages, searching, installing, removing, syncing metadata, upgrading,
      and exporting package inventories.
  usage:
    - >
      Homebrew and Scoop packaging reflect that niche: users install mpm through one
      package manager so it can inspect and orchestrate many others.
related-packages:
  - id: brew:topgrade
    reason: >
      Topgrade is an alternative for users focused on invoking native updaters across
      package managers and other system tools, while mpm additionally normalizes package
      queries and supports inventory, snapshot, restore, and SBOM workflows.
    rel: alternative
    sources:
      - https://mpm.run/
      - https://github.com/topgrade-rs/topgrade
category: system
package-manager:
  brew: meta-package-manager
  macports: meta-package-manager
  scoop: main/meta-package-manager
package-manager-url: https://formulae.brew.sh/formula/meta-package-manager
license: GPL-2.0-or-later
tags:
  - automation
  - cli
  - cross-platform
  - homebrew
  - npm
  - package-manager
  - pip
description: Wrapper around all package managers with a unifying CLI
executables:
  - meta-package-manager
  - mpm
provenance:
  formula: meta-package-manager
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
