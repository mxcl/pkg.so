id: brew:cfn-format
display-name: cfn-format
homepage: https://github.com/aws-cloudformation/rain
repo: https://github.com/aws-cloudformation/rain
docs:
  - https://aws-cloudformation.github.io/rain/rain_fmt.html
  - https://github.com/aws-cloudformation/rain#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages `cfn-format` separately from rain, building the
      `./cmd/cfn-format` target from the rain source repository. This gives package
      users a narrower formatter binary without installing the broader rain workflow CLI
      name.
  package-nerd-significance:
    - >
      cfn-format is package-nerd-interesting because it exposes one subcommand-sized
      slice of a larger CloudFormation workflow tool as its own formula, the kind of
      tiny binary split that helps scripts depend on exactly the formatter they need.
  project-history:
    - >
      The upstream rain repository was created in 2019 and describes rain as a
      development workflow tool for AWS CloudFormation templates and stacks. Its README
      lists consistent formatting of CloudFormation templates as a key feature of `rain
      fmt`, including JSON/YAML conversion and YAML comment preservation.
  related-projects:
    - rain is the upstream project and broader CloudFormation workflow CLI.
    - cfn-flip is the older AWS Labs converter whose CLI usage now points users to `rain fmt`.
  sources:
    - https://api.github.com/repos/aws-cloudformation/rain
    - https://github.com/aws-cloudformation/rain
    - https://aws-cloudformation.github.io/rain/rain_fmt.html
    - https://github.com/aws-cloudformation/rain#readme
    - https://formulae.brew.sh/api/formula/cfn-format.json
  summary:
    - >
      cfn-format is the Homebrew-packaged command built from the AWS CloudFormation rain
      repository's `cmd/cfn-format`, focused on checking and formatting AWS
      CloudFormation templates.
  timeline:
    - '2019: rain GitHub repository metadata records public repository creation.'
    - '2019: GitHub release metadata records rain v0.1.0.'
    - '2026: Homebrew formula builds cfn-format from rain v1.24.4.'
  usage:
    - >
      The Homebrew formula test runs `cfn-format -v test.template` and expects a
      formatted-ok message. The rain README documents the broader formatter behavior
      under `rain fmt`.
related-packages:
  - id: brew:cfn-lint
    reason: >
      Use cfn-lint after formatting to validate the normalized template against
      CloudFormation schemas and best-practice rules.
    rel: adjacent_workflow
    sources:
      - https://aws-cloudformation.github.io/rain/rain_fmt.html
      - https://github.com/aws-cloudformation/cfn-lint#readme
category: cloud-infrastructure
package-manager:
  brew: cfn-format
package-manager-url: https://formulae.brew.sh/formula/cfn-format
license: Apache-2.0
tags:
  - aws
  - cli
  - cloudformation
  - formatter
  - infrastructure-as-code
description: Command-line tool for formatting AWS CloudFormation templates
executables:
  - cfn-format
provenance:
  formula: cfn-format
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
