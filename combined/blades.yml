id: brew:blades
display-name: Blades
homepage: https://www.getblades.org/
repo: https://github.com/grego/blades
docs:
  - https://www.getblades.org/
  - https://www.getblades.org/config.html
config-file-location:
  unix: Blades.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Blades is distributed through crates.io, Homebrew, and MacPorts. Its adoption is
      modest but clear enough for packaging: a small Rust SSG with official docs at
      getblades.org and a package-manager footprint beyond Cargo.
  package-nerd-significance:
    - >
      Blades is interesting to package nerds as part of the Rust static-site-generator
      wave: small native binaries competing with older ecosystems on startup time and
      simple deployment. Its 'one job' positioning contrasts with larger generators that
      bundle watchers, asset pipelines, or language-specific plugin stacks.
  project-history:
    - >
      The repository was created in 2020 and the crate was published on crates.io the
      same year. The README describes Blades as a 'blazing fast dead simple static site
      generator' using zero-copy deserialization and the Ramhorns templating engine.
  related-projects:
    - The README compares Blades' performance with Hugo and links an ssg-bench repository.
    - >
      Blades uses Mustache-style templates and the Ramhorns Rust templating engine, and
      suggests caretaker for watching or auxiliary automation.
  sources:
    - https://crates.io/crates/blades
    - https://github.com/grego/blades#readme
    - https://www.getblades.org/
    - https://www.getblades.org/config.html
    - source_facts.package-manager
  summary:
    - >
      Blades is a Rust static site generator focused on speed, simple configuration, and
      minimal moving parts. It packages as a single CLI for generating HTML from content
      and templates.
  timeline:
    - '2020: Blades repository is created on GitHub.'
    - '2020: Blades crate is published on crates.io.'
    - '2020s: Blades is packaged for Homebrew and MacPorts.'
    - >
      2020s: Official docs at getblades.org document configuration, themes, plugins, and
      content workflows.
  usage:
    - >
      Users run blades init to create a site, then build, all, lazy, colocate, or new to
      generate pages and assets. The project configuration is Blades.toml, and docs
      cover themes, templates, plugins, taxonomies, feeds, sitemaps, and asset
      colocation.
related-packages:
  - id: brew:hugo
    reason: >
      Choose Hugo when you need a mature website framework with a development server,
      asset processing, modules, and a large theme ecosystem rather than Blades'
      deliberately narrower generator scope.
    rel: alternative
    sources:
      - https://github.com/grego/blades#readme
      - https://github.com/grego/ssg-bench
      - https://gohugo.io/documentation/
  - id: brew:zola
    reason: >
      Choose Zola for another single-binary static-site workflow with built-in serving,
      Sass compilation, search-index generation, and Tera templates; the Blades
      maintainer directly compares it in the project's SSG benchmark.
    rel: alternative
    sources:
      - https://github.com/grego/ssg-bench
      - https://www.getzola.org/documentation/getting-started/overview/
      - https://www.getzola.org/documentation/getting-started/cli-usage/
category: developer-tools
package-manager:
  brew: blades
  macports: blades
package-manager-url: https://formulae.brew.sh/formula/blades
license: GPL-3.0-or-later
tags:
  - cli
  - markdown
  - rust
  - static-site-generator
  - templates
description: Blazing fast dead simple static site generator
executables:
  - blades
provenance:
  formula: blades
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
