id: brew:letta-code
display-name: Letta Code
homepage: https://docs.letta.com/letta-code
repo: https://github.com/letta-ai/letta-code
docs:
  - https://docs.letta.com/letta-code
  - https://docs.letta.com/letta-code/cli
  - https://docs.letta.com/letta-code/quickstart
config-file-location:
  unix:
    - ~/.letta/channels/<channel>/channel.json
    - ~/.letta/channels/<channel>/routing.yaml
    - ~/.letta/channels/<channel>/pairing.yaml
credentials-file-location:
  unix: ~/.letta/channels/<channel>/accounts.json
history:
  adoption-history:
    - >
      Letta Code entered package-manager culture quickly for a young AI developer tool:
      this batch records Homebrew and winget package identifiers, while the official
      quickstart documents global npm installation with `npm install -g
      @letta-ai/letta-code` and execution through the `letta` command.
  package-nerd-significance:
    - >
      For package nerds, Letta Code is notable less as a stable old Unix utility and
      more as a fast-moving example of AI tools becoming ordinary CLI packages. Its
      package metadata, npm install path, and Homebrew/winget entries show the
      distribution path for AI coding agents moving into the same channels as shells,
      editors, and build tools.
  project-history:
    - >
      The `letta-ai/letta-code` repository was created on October 25, 2025. Letta's
      product documentation presents the tool as the open-source Letta Agent harness for
      coding agents, desktop agents, personal agents, and more autonomous workflows.
    - >
      Letta's launch material framed Letta Code as a response to stateless coding-agent
      sessions: instead of restarting from scratch, the same agent can learn project
      conventions through commands such as `/init`, `/remember`, and skill creation.
  related-projects:
    - >
      Letta Code is part of the broader Letta/MemGPT lineage around long-term memory for
      agents. It is also positioned beside terminal coding agents such as Claude Code,
      Gemini CLI, and Codex CLI, while using npm, Homebrew, and winget as ordinary
      developer-tool distribution channels.
  sources:
    - https://api.github.com/repos/letta-ai/letta-code
    - https://docs.letta.com/letta-agent
    - https://docs.letta.com/letta-agent/changelog
    - https://docs.letta.com/letta-agent/quickstart
    - https://formulae.brew.sh/formula/letta-code
    - https://github.com/letta-ai/letta-code
    - https://www.letta.com/blog/letta-code/
  summary:
    - >
      Letta Code is a memory-first coding-agent CLI and harness from Letta. Its project
      story belongs to the post-2024 wave of terminal coding agents, with the
      differentiator that agent identity, memory, skills, and conversation history are
      treated as durable state rather than per-session context.
  timeline:
    - '2025: The `letta-ai/letta-code` repository was created on October 25, 2025.'
    - >
      2026: Letta documentation described Letta Agent/Letta Code as an open-source,
      memory-first agent harness with CLI, desktop, and cloud setup paths.
    - '2026: The Letta Code changelog documented active 0.x releases, including 0.27.11.'
  usage:
    - >
      The intended workflow is to start `letta` inside a project, connect model
      providers or coding plans, and let the agent inspect the codebase, retain
      memories, and resume future conversations. The docs also describe headless
      prompts, remote environments, subagents, skills, and memory-management commands.
related-packages:
  - id: cask:claude-code
    reason: >
      Choose Claude Code when you want Anthropic's terminal-native coding agent; Letta's
      official comparison positions it as a session-oriented alternative to Letta Code's
      persistent, model-agnostic agents.
    rel: alternative
    sources:
      - https://www.letta.com/blog/letta-code/
      - https://github.com/anthropics/claude-code
  - id: cask:codex
    reason: >
      Choose Codex as an alternative terminal coding agent when you prefer OpenAI's
      native harness rather than Letta Code's cross-model, memory-first agent model.
    rel: alternative
    sources:
      - https://www.letta.com/blog/letta-code/
      - https://github.com/openai/codex
  - id: brew:gemini-cli
    reason: >
      Choose Gemini CLI when direct Gemini-oriented terminal workflows matter more than
      Letta Code's persistent agent identity and provider-independent harness.
    rel: alternative
    sources:
      - https://www.letta.com/blog/letta-code/
      - https://github.com/google-gemini/gemini-cli
category: ai
package-manager:
  brew: letta-code
  winget: Letta.LettaCode
package-manager-url: https://formulae.brew.sh/formula/letta-code
license: Apache-2.0
tags:
  - ai
  - ai-agent
  - cli
  - coding-agent
  - developer-tools
  - memory
description: Memory-first coding agent
executables:
  - letta
provenance:
  formula: letta-code
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
