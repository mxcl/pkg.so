id: cask:aionui
display-name: AionUi
homepage: https://www.aionui.com/
repo: https://github.com/iOfficeAI/AionUi
docs:
  - https://github.com/iOfficeAI/AionUi/tree/main/docs
  - https://github.com/iOfficeAI/AionUi#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AionUi broadened from a GUI for terminal agents into a cross-platform Cowork
      environment with an embedded agent, integrations for numerous external CLI agents,
      remote access, scheduled work, MCP tools, and coordinated multi-agent sessions.
  package-nerd-significance:
    - >
      Its Homebrew cask makes a rapidly evolving, cross-platform agent desktop available
      through a reproducible macOS installation workflow. It is notable as a graphical
      aggregation layer over otherwise separate AI-agent CLIs.
  project-history:
    - >
      AionUi is developed publicly by iOfficeAI as a free, Apache-licensed desktop
      application. Its official repository records a large, actively developed codebase
      and maintains guides alongside the application source.
  related-projects:
    - >
      The application integrates with tools including Claude Code, Codex, Gemini CLI,
      OpenCode, OpenClaw, and Hermes Agent, while its built-in agent is supplied by the
      associated AionCore/aionrs work.
  sources:
    - 'Official documentation directory: https://github.com/iOfficeAI/AionUi/tree/main/docs'
    - 'Official repository: https://github.com/iOfficeAI/AionUi'
  summary:
    - >
      AionUi is a local-first graphical Cowork platform that combines a built-in AI
      agent with a unified interface for many command-line agents.
  timeline:
    - '2026: Homebrew cask input records AionUi 2.1.52'
    - >
      2026: Official project documentation describes built-in agents, multi-agent teams,
      scheduling, remote access, and more than 20 CLI integrations
  usage:
    - >
      Install the desktop application, enter an API key for a supported provider, and
      select the built-in or detected external agent. Users can operate on local files,
      run parallel sessions, configure MCP servers, schedule tasks, and enable remote
      WebUI or chat-channel access.
category: ai
