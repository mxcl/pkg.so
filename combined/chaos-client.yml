history:
  adoption-history:
    - >
      Adoption is tied to ProjectDiscovery's security-tool ecosystem: users install the
      `chaos` executable with `go install`, Homebrew distributes it as `chaos-client`,
      and Nix packages it as `chaos` according to the supplied package-manager facts.
  package-nerd-significance:
    - >
      For package collectors, chaos-client is a typical modern Go security CLI: a thin
      API client, a single executable, source installs via `go install`, and
      package-manager aliases that differ from the upstream repository name.
  project-history:
    - >
      ProjectDiscovery published chaos-client as a small Go client around its Chaos
      dataset API. The public GitHub repository was created in 2020, and its README
      describes the tool as a client for the Chaos dataset API with both CLI and library
      usage.
  related-projects:
    - ProjectDiscovery's Chaos service provides the dataset/API that this client queries.
    - >
      Other ProjectDiscovery reconnaissance tools such as subfinder and httpx commonly
      appear in the same security automation workflows, though they are separate
      projects.
  sources:
    - https://github.com/projectdiscovery/chaos-client#readme
    - https://docs.projectdiscovery.io/opensource/chaos/overview
    - https://formulae.brew.sh/formula/chaos-client
  summary:
    - >
      Chaos Client is ProjectDiscovery's command-line and Go library client for the
      Chaos DNS dataset API, used to query subdomains for a domain with a
      ProjectDiscovery Cloud API key.
  timeline:
    - '2020: Public GitHub repository created for projectdiscovery/chaos-client.'
    - '2020: Early v0.1.x tags established the Go CLI client line.'
    - >
      2026: Repository metadata still shows active maintenance and the README documents
      ProjectDiscovery Cloud API-key usage.
  usage:
    - >
      The CLI queries a domain for subdomains, can read domain lists, emit JSON, write
      output files, show counts, and use `PDCP_API_KEY` or `-key` for ProjectDiscovery
      Cloud authentication.
related-packages: []
