id: brew:censys
display-name: Censys CLI
homepage: https://github.com/censys/censys-python
repo: https://github.com/censys/censys-python
docs:
  - https://docs.censys.com/docs/search-and-asm-python-cli
  - https://github.com/censys/censys-python#readme
config-file-location:
  unix: ~/.config/censys/censys.cfg
credentials-file-location:
  unix: ~/.config/censys/censys.cfg
history:
  adoption-history:
    - >
      Censys' own documentation positions the data as useful for security operations,
      exposure management, and research access. The package facts show the Python CLI
      distributed through Homebrew as well as Debian and Ubuntu as python3-censys.
  package-nerd-significance:
    - >
      This package is a good example of a security-data CLI whose command name outlived
      an API generation. The official README now warns that legacy Search v1/v2 APIs are
      being deprecated and points users toward the newer Censys Platform SDK and cencli,
      while ASM support in this library continues.
  project-history:
    - >
      Censys began as a University of Michigan research project in 2013 and grew into an
      internet intelligence platform built around internet-wide scanning data. The
      censys-python repository packages that platform access for Python users and
      exposes a CLI named censys.
  related-projects:
    - cencli is the newer Censys Platform CLI documented by Censys.
    - >
      censys-platform is the newer Python SDK named in the official censys-python
      deprecation notice.
  sources:
    - https://api.github.com/repos/censys/censys-python
    - https://github.com/censys/censys-python
    - https://docs.censys.com/docs/search-and-asm-python-cli
    - https://github.com/censys/censys-python#readme
    - https://formulae.brew.sh/api/formula/censys.json
  summary:
    - >
      The Homebrew censys package installs the legacy Censys Python library CLI, a
      command-line interface and API wrapper for Censys Search and ASM data.
  timeline:
    - '2013: Censys started as a University of Michigan research project.'
    - '2017: Public censys-python GitHub repository created.'
    - >
      2026: Official README warns that Censys Search v1/v2 APIs are being deprecated and
      points to the Censys Platform SDK and cencli.
  usage:
    - >
      Users configure Search credentials with censys config or CENSYS_API_ID and
      CENSYS_API_SECRET. The CLI and Python library can search, view, aggregate, and
      work with Censys host and certificate data, while ASM APIs remain supported.
related-packages: []
category: security
package-manager:
  brew: censys
  debian: python3-censys
  ubuntu: python3-censys
package-manager-url: https://formulae.brew.sh/formula/censys
license: Apache-2.0
tags:
  - api-client
  - censys
  - cli
  - internet-scanning
  - security-search
description: Command-line interface for the Censys APIs (censys.io)
executables:
  - censys
provenance:
  formula: censys
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
