id: brew:etl
display-name: ETL
homepage: https://synfig.org
repo: https://github.com/synfig/synfig
docs:
  - https://synfig.readthedocs.io/en/latest
  - https://github.com/synfig/synfig#readme
  - https://wiki.synfig.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list ETL packages across Homebrew, Debian, Ubuntu,
      Fedora/DNF, and Arch/Pacman, indicating that downstream Unix-like distributions
      have treated it as a separately consumable development package.
  package-nerd-significance:
    - >
      ETL matters to package maintainers because it is a small but historically separate
      C++ development component in the Synfig stack, exposed by multiple distributions
      as `etl`, `etl-dev`, or `ETL-devel`.
  project-history:
    - >
      The Homebrew package facts identify `etl` as the Extensible Template Library and
      point to Synfig's official source repository. The current Synfig repository
      describes itself as the official source code repository for Synfig Studio
      animation software, with Synfig available on Windows, Linux, and macOS.
  related-projects:
    - Synfig Studio
    - Synfig Core
    - C++ template libraries
  sources:
    - GitHub API for synfig/synfig repository metadata.
    - Official Synfig ChangeLog.md.
    - Official Synfig README.
    - source_facts.description
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      ETL is packaged as Synfig's Extensible Template Library, a C++ support library
      associated with the Synfig animation stack.
  timeline:
    - '2011: Current official Synfig GitHub repository created.'
    - >
      2020s: Synfig changelog continues to tag ETL-affecting changes alongside core and
      studio changes.
  usage:
    - >
      Package users typically install ETL for its development headers and `ETL-config`
      helper rather than as an end-user application. It is closely tied to building or
      packaging Synfig-related code.
related-packages:
  - id: brew:synfig
    reason: >
      Install Synfig Studio when you want the animation application that directly uses
      ETL alongside synfig-core and synfig-studio.
    rel: adjacent_workflow
    sources:
      - https://github.com/synfig/synfig-docs-dev/blob/master/docs/common/structure.rst
      - https://github.com/synfig/synfig
category: developer-tools
package-manager:
  brew: etl
  debian: etl-dev
  dnf: ETL-devel
  pacman: etl
  ubuntu: etl-dev
package-manager-url: https://formulae.brew.sh/formula/etl
license: GPL-3.0-or-later
tags:
  - animation
  - cli
  - cpp
  - development-library
  - headers
  - synfig
  - template-library
description: Extensible Template Library
executables:
  - ETL-config
provenance:
  formula: etl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
