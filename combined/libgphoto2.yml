id: brew:libgphoto2
display-name: libgphoto2
homepage: http://www.gphoto.org/proj/libgphoto2/
repo: https://github.com/gphoto/libgphoto2
docs:
  - https://gphoto.sourceforge.io/doc/manual
  - https://gphoto.sourceforge.io/doc
  - https://gphoto.sourceforge.io/doc/api
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gPhoto reports support for more than 2700 cameras and media players on its project
      home page, while the generated support table dated 2026-05-30 lists 3013 supported
      cameras and media players for libgphoto2 2.5.34. The project also notes that PTP,
      MTP, and PictBridge devices can work generically without needing a specific model
      entry.
    - >
      The README lists frontends and consumers including gphoto2, digiKam, gThumb,
      Shotwell, Darktable, Entangle, GIMP integration, gphotofs, and gtkam. That mix
      made libgphoto2 a common Linux photography dependency for import, tethering,
      capture, and camera metadata workflows.
  package-nerd-significance:
    - >
      libgphoto2 is hardware-shaped packaging: the package is not just code, it carries
      camlibs, USB/PTP/MTP knowledge, udev-era history, translations, and a continually
      refreshed device table. A simple version bump can mean new camera IDs, changed
      remote-control behavior, or security fixes for parsing data from untrusted USB
      devices.
    - >
      For package managers, it sits at the intersection of media apps, desktop
      environments, USB libraries, and scripting tools. It is also a reminder that old
      cameras and odd vendor protocols remain part of the compatibility surface long
      after the original hardware stopped being fashionable.
  project-history:
    - >
      The gPhoto project framed its mission around free software access to digital
      cameras whose vendors often published only proprietary Windows or Mac tools. The
      libgphoto2 project page describes the library as the core that abstracts
      communication ports and camera protocols, with modular port drivers and camlibs.
    - >
      The libgphoto2 README calls it the successor of the original gphoto program, with
      additional camera drivers and a backend-library design rather than a standalone
      GUI. That split let gphoto2, gtkam, desktop photo tools, and other frontends share
      the same camera-access layer.
  related-projects:
    - >
      gphoto2 is the command-line frontend that exposes libgphoto2 functions for users
      and scripts.
    - >
      gtkam, gphotofs, digiKam, gThumb, Shotwell, Darktable, Entangle, and GIMP
      integrations are examples of applications or frontends using the library.
    - >
      PTP, MTP, and PictBridge are camera/media protocols that shape libgphoto2's driver
      model.
  sources:
    - http://www.gphoto.org/
    - http://www.gphoto.org/proj/libgphoto2/
    - https://github.com/gphoto/libgphoto2
    - https://github.com/gphoto/libgphoto2/blob/master/NEWS
    - https://github.com/gphoto/libgphoto2/blob/master/README.md
    - https://gphoto.sourceforge.io/proj/libgphoto2/support.php
  summary:
    - >
      libgphoto2 is the library core of the gPhoto project, giving Unix-like systems a
      common way to talk to digital cameras, media players, and camera protocols such as
      PTP and MTP. It is the backend that lets command-line tools, desktop applications,
      and tethering workflows use camera hardware without each application carrying its
      own camera-driver stack.
  timeline:
    - '2000: The generated support output credits gphoto2 copyright beginning in 2000.'
    - >
      2015-08-01: The gPhoto project announced migration to GitHub for code hosting and
      issue tracking.
    - >
      2022-01-03: libgphoto2 and gphoto2 2.5.28 were announced with cleanup of obsolete
      OS/2 and hotplug packaging support.
    - >
      2025-07-06: libgphoto2 and gphoto2 2.5.32 were announced with Meson build support,
      runtime-configurable library paths, and many camera IDs.
    - >
      2026-05-30: libgphoto2 2.5.34 was announced and the support page listed 3013
      supported cameras and media players.
  usage:
    - >
      Applications use libgphoto2 to detect cameras, download images, upload to picture
      frames, query configuration, trigger capture, and perform remote control where the
      camera and protocol allow it. The companion gphoto2 CLI exposes much of that power
      for scripts.
    - >
      The library deliberately does not replace USB mass-storage handling; the project
      tells users to let the operating system mount mass-storage cameras. libgphoto2 is
      most valuable for protocol cameras and vendor-specific behavior that a normal
      filesystem mount cannot expose.
related-packages:
  - id: brew:gphoto2
    reason: >
      gphoto2 is the official command-line frontend to libgphoto2, making camera
      transfer, configuration, capture, and automation available from the shell.
    rel: adjacent_workflow
    sources:
      - https://github.com/gphoto/gphoto2
      - https://github.com/gphoto/libgphoto2/blob/master/README.md
category: media
