id: brew:brigade-cli
display-name: Brigade CLI
homepage: https://brigade.sh
repo: https://github.com/brigadecore/brigade
docs:
  - https://docs.brigade.sh/topics/project-developers/brig
config-file-location:
  unix: .brigade/project.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Brigade had meaningful visibility in the Kubernetes ecosystem, with thousands of
      GitHub stars and packaging across Homebrew, Debian/Ubuntu, and Nix according to
      the input package facts. Its adoption was tied to teams experimenting with
      Kubernetes-native automation before GitHub Actions and other hosted CI systems
      became dominant defaults.
    - >
      Current package activity is modest: Homebrew analytics reported low hundreds of
      installs over the prior year at lookup time, consistent with an archived project
      that remains packaged for existing users and historical reproducibility.
  package-nerd-significance:
    - >
      Brigade CLI is significant because it packages the client side of an ambitious
      Kubernetes-native automation system. It is also a useful historical marker: a
      CNCF-era project that reached broad enough distribution for multiple package
      managers, then moved into archived status while retaining docs and install
      artifacts.
  project-history:
    - >
      Brigade's repository was created in October 2017 and early v0.x releases followed
      in November and December 2017. The project described itself as event-driven
      scripting for Kubernetes, abstracting cluster details so users could react to
      events with scripted workflows.
    - >
      The v2 documentation separates Brigade 2 from legacy Brigade 1.x and documents the
      `brig` CLI as the route to supported user interactions: login, project
      initialization, event creation, project management, and log inspection. The README
      also describes an ecosystem of gateways, event sources, metrics, and SDKs.
    - >
      By 2022 Brigade had reached v2.6.0, and the CNCF TOC merged a proposal to archive
      the project in September 2022. The official Brigade docs now carry an
      archived-project banner while preserving the v2 documentation.
  related-projects:
    - >
      Brigade gateways include GitHub, Bitbucket, Docker Hub, CloudEvents, and Slack
      gateway repositories.
    - Brigade event sources include cron and other event-producing components.
    - >
      Brigade SDKs include Go code in the main repository and a JavaScript/TypeScript
      SDK referenced by the README.
    - Kubernetes is the underlying platform Brigade abstracts.
  sources:
    - https://docs.brigade.sh/topics/project-developers/brig/
    - https://formulae.brew.sh/api/formula/brigade-cli.json
    - https://github.com/brigadecore/brigade
    - https://github.com/cncf/toc/pull/915
    - https://raw.githubusercontent.com/brigadecore/brigade/main/README.md
  summary:
    - >
      Brigade CLI, distributed as `brig`, is the command-line client for Brigade, an
      event-driven scripting platform built on Kubernetes. It belongs to the
      Kubernetes-native CI/CD and workflow-automation wave of the late 2010s.
  timeline:
    - '2017: Brigade repository created and early v0.x releases published.'
    - '2022: v2.6.0 released.'
    - '2022: CNCF TOC merged the proposal to archive Brigade.'
    - '2022: Brigade docs updated with archived-project messaging.'
    - '2026: Homebrew stable version still reported as 2.6.0.'
  usage:
    - >
      `brig` is used to log into a Brigade instance, initialize projects, create or
      manage events, inspect projects, and view worker or job logs. Installation docs
      offer Homebrew on macOS and direct binary downloads on Linux and Windows.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl to prepare and inspect the Kubernetes cluster that hosts Brigade; the
      official quickstart requires a Kubernetes cluster and uses kubectl for port
      forwarding and retrieving the initial login secret.
    rel: adjacent_workflow
    sources:
      - https://docs.brigade.sh/intro/quickstart/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:helm
    reason: >
      Use Helm to install and manage Brigade's server-side chart before connecting with
      `brig`, as prescribed by the official quickstart.
    rel: adjacent_workflow
    sources:
      - https://docs.brigade.sh/intro/quickstart/
      - https://helm.sh/docs/
category: developer-tools
package-manager:
  brew: brigade-cli
  debian: brig
  nix: brig
  ubuntu: brig
package-manager-url: https://formulae.brew.sh/formula/brigade-cli
license: Apache-2.0
tags:
  - brigade
  - ci-cd
  - cli
  - kubernetes
  - workflows
description: Brigade command-line interface
executables:
  - brig
provenance:
  formula: brigade-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
