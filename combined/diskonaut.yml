id: brew:diskonaut
display-name: diskonaut
homepage: https://github.com/imsnif/diskonaut
repo: https://github.com/imsnif/diskonaut
docs:
  - https://github.com/imsnif/diskonaut
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents several packaging routes, including Cargo for Linux,
      macOS, and Windows, distribution packages or overlays for Fedora/CentOS, Arch,
      Gentoo, Nix/NixOS, FreeBSD, and Homebrew on macOS. That packaging spread made
      diskonaut recognizable as part of the Rust wave of modern replacements and
      complements for older Unix storage utilities.
  package-nerd-significance:
    - >
      diskonaut matters to package nerds because it is a compact example of how Rust
      terminal applications became normal occupants of system package indexes:
      cross-platform, Cargo-installable, distributed as prebuilt releases, and also
      packaged by traditional Unix-style package managers.
  project-history:
    - >
      The GitHub repository was created in February 2020, with public release tags
      beginning at 0.1.0 in June 2020 and reaching 0.11.0 in September 2020. The README
      describes a tool that can scan a directory while allowing navigation through
      subfolders and deletion of files or folders during the same session.
  related-projects:
    - >
      Related tools include `du` for traditional disk usage summaries, `ncdu` for
      terminal disk usage navigation, and other Rust terminal utilities distributed
      through Cargo and OS package managers.
  sources:
    - https://github.com/imsnif/diskonaut
    - https://api.github.com/repos/imsnif/diskonaut
    - https://github.com/imsnif/diskonaut/releases/tag/0.1.0
    - https://github.com/imsnif/diskonaut/releases/tag/0.11.0
    - https://formulae.brew.sh/formula/diskonaut
  summary:
    - >
      diskonaut is a Rust terminal disk-space navigator that scans a path, builds an
      in-memory view of filesystem metadata, and presents the result as an interactive
      treemap. In package-manager terms it sits between classic `du` output and full
      terminal UI cleanup tools: small enough to install as a single CLI, but visual
      enough to make disk cleanup exploratory.
  timeline:
    - '2020-02: GitHub repository created'
    - '2020-06: 0.1.0 release published'
    - '2020-09: 0.11.0 release published'
  usage:
    - >
      Users typically start `diskonaut` in the directory they want to inspect, or pass a
      path such as a home directory or filesystem root. Its value is in keeping the
      scan, navigation, visual size comparison, and cleanup loop inside one terminal
      program.
related-packages:
  - id: brew:ncdu
    reason: >
      Choose ncdu when a conventional text-mode directory browser, remote-server focus,
      export formats, and mature POSIX packaging are preferable to diskonaut's treemap
      interface.
    rel: alternative
    sources:
      - https://github.com/imsnif/diskonaut#readme
      - https://dev.yorhel.nl/ncdu
  - id: brew:dust
    reason: >
      Choose Dust for a fast noninteractive overview of the largest files and
      directories instead of diskonaut's interactive in-memory navigation and deletion
      session.
    rel: alternative
    sources:
      - https://github.com/imsnif/diskonaut#readme
      - https://github.com/bootandy/dust#readme
category: system
package-manager:
  apk: diskonaut
  brew: diskonaut
  dnf: diskonaut
  macports: diskonaut
  pacman: diskonaut
package-manager-url: https://formulae.brew.sh/formula/diskonaut
license: MIT
tags:
  - cli
  - disk-usage
  - filesystem
  - terminal
  - tui
description: Terminal visual disk space navigator
executables:
  - diskonaut
provenance:
  formula: diskonaut
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
