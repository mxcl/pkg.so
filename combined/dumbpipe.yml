id: brew:dumbpipe
display-name: dumbpipe
homepage: https://dumbpipe.dev
repo: https://github.com/n0-computer/dumbpipe
docs:
  - https://www.dumbpipe.dev/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dumbpipe moved quickly through regular 0.x releases and became available through
      Cargo, GitHub Releases, Homebrew, Nix, and Scoop. Crates.io describes it as a CLI
      for piping data over the network with NAT hole punching, which is the core
      adoption pitch.
  package-nerd-significance:
    - >
      For package nerds, dumbpipe is the friendly executable face of the iroh stack: a
      small CLI that turns modern peer-to-peer transport primitives into shell-pipeline
      workflows. It sits in the same mental space as netcat, ssh port forwarding,
      magic-wormhole-style transfer tools, and localtunnel-style dev sharing, but
      exposes iroh's endpoint-ticket model.
  project-history:
    - >
      The project started in late 2023 in the n0-computer ecosystem as an example of
      using iroh to connect machines with a QUIC connection. Its README explicitly
      positions it as netcat-inspired, but with endpoint IDs instead of IP addresses and
      encrypted connections.
  related-projects:
    - >
      Related projects include iroh, netcat, ffmpeg, ffplay, tty-share, Zellij,
      iroh-blobs, and other peer-to-peer or NAT-traversing file and port forwarding
      tools.
  sources:
    - https://github.com/n0-computer/dumbpipe#readme
    - https://www.dumbpipe.dev/docs
    - https://api.github.com/repos/n0-computer/dumbpipe
    - https://api.github.com/repos/n0-computer/dumbpipe/releases
    - https://crates.io/api/v1/crates/dumbpipe
    - https://formulae.brew.sh/formula/dumbpipe
  summary:
    - >
      dumbpipe is a Rust CLI for making Unix-pipe-like network connections between
      devices using iroh, QUIC, NAT traversal, relays, endpoint identifiers, and TLS.
  timeline:
    - '2023: GitHub repository is created.'
    - '2023: v0.1.0 is published on GitHub Releases and the crate appears on crates.io.'
    - '2026: v0.39.0 is published and packaged as Homebrew stable 0.39.0.'
  usage:
    - >
      The README examples show dumbpipe as a general transport: streaming video with
      ffmpeg and ffplay, sharing terminal sessions with tty-share, forwarding local
      development web servers, forwarding Unix sockets such as Zellij sessions, and
      connecting to custom iroh ALPN protocols.
related-packages:
  - id: brew:netcat
    reason: >
      Choose netcat for direct IP-address and port-based socket work on reachable
      networks; choose dumbpipe when endpoint identity, TLS encryption, NAT traversal,
      and relay fallback are needed.
    rel: alternative
    sources:
      - https://github.com/n0-computer/dumbpipe#readme
      - https://man.openbsd.org/nc
  - id: brew:ffmpeg
    reason: >
      Pipe FFmpeg capture output through dumbpipe and feed the receiving stream to
      ffplay for encrypted peer-to-peer video streaming, as demonstrated by dumbpipe
      upstream.
    rel: adjacent_workflow
    sources:
      - https://github.com/n0-computer/dumbpipe#readme
      - https://ffmpeg.org/ffmpeg.html
  - id: brew:tty-share
    reason: >
      Run tty-share behind dumbpipe's TCP forwarding to add an encrypted peer-to-peer
      transport to collaborative terminal sessions.
    rel: adjacent_workflow
    sources:
      - https://github.com/n0-computer/dumbpipe#readme
      - https://tty-share.com/
  - id: brew:zellij
    reason: >
      Forward a remote Zellij session socket with dumbpipe and attach a local Zellij
      client through the locally recreated Unix socket.
    rel: adjacent_workflow
    sources:
      - https://github.com/n0-computer/dumbpipe#readme
      - https://zellij.dev/documentation/
category: networking
package-manager:
  brew: dumbpipe
  nix: dumbpipe
  scoop: main/dumbpipe
package-manager-url: https://formulae.brew.sh/formula/dumbpipe
license: MIT OR Apache-2.0
tags:
  - cli
  - nat-traversal
  - networking
  - peer-to-peer
  - quic
description: Unix pipes between devices
executables:
  - dumbpipe
provenance:
  formula: dumbpipe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
