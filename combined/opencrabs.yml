id: brew:opencrabs
display-name: OpenCrabs
homepage: https://opencrabs.com
repo: https://github.com/opencrabs/opencrabs
docs:
  - https://github.com/adolfousier/opencrabs#readme
config-file-location:
  unix:
    - ~/.opencrabs/config.toml
    - ~/.opencrabs/commands.toml
    - ~/.opencrabs/tools.toml
    - ~/.config/opencrabs/config.toml
    - ./opencrabs.toml
credentials-file-location:
  unix: ~/.opencrabs/keys.toml
history:
  adoption-history:
    - >
      OpenCrabs is distributed as release binaries, a Cargo package, source code, and
      Homebrew packaging. Its official repository documents Linux, macOS, and Windows
      operation, plus optional always-running daemon services.
    - >
      Adoption is still early-stage, but the project exposes a broad integration surface
      including terminal tools, browser automation, scheduled tasks, provider switching,
      profiles, and messaging channels.
  package-nerd-significance:
    - >
      OpenCrabs is notable as a single Rust binary that packages an agent runtime,
      terminal interface, daemon, provider registry, tools, memory, scheduling, and
      channel integrations. Its profile-aware configuration resembles a conventional
      Unix CLI while supporting a comparatively large application surface.
    - >
      Its explicit separation of non-secret configuration from keys.toml is useful to
      package maintainers and operators because it gives configuration and credentials
      distinct lifecycle and permission expectations.
  project-history:
    - >
      OpenCrabs was developed as an open-source autonomous-agent runtime written
      predominantly in Rust. The project emphasizes self-improvement, self-healing
      behavior, multi-provider operation, and deployment as a terminal UI, CLI, or
      daemon.
    - >
      The repository’s release history and changelog show rapid iteration, with
      configuration, channels, profiles, browser automation, memory, and
      service-management capabilities consolidated into the same executable.
  related-projects:
    - >
      Related technologies include Rust, Cargo, Ratatui, SQLite, Claude Code, GitHub
      Copilot, MCP, the A2A protocol, Chromium CDP, and supported LLM-provider APIs.
  sources:
    - https://github.com/adolfousier/opencrabs
  summary:
    - >
      OpenCrabs is an open-source Rust-based AI agent that runs in a terminal,
      interactive TUI, or background daemon and can use tools, manage files, perform
      research, schedule work, and connect to communication channels.
  timeline:
    - 'Early project: OpenCrabs emerged as a Rust-based autonomous terminal agent.'
    - >
      2026: The official repository shows rapid release activity and expanding profile,
      daemon, channel, browser, and tool support.
  usage:
    - >
      The first-run wizard configures a provider and workspace. Users can run
      interactive sessions, execute slash commands, create isolated profiles, or install
      the daemon as a user service.
    - >
      The default profile uses ~/.opencrabs. Non-secret settings reside in config.toml,
      commands.toml, and tools.toml; API keys and channel tokens reside in keys.toml
      with restrictive file permissions. Named profiles keep isolated copies beneath
      ~/.opencrabs/profiles/<name>/.
category: ai
package-manager:
  brew: opencrabs
package-manager-url: https://formulae.brew.sh/formula/opencrabs
license: MIT
tags:
  - agent-orchestration
  - ai-agent
  - automation
  - autonomous-agent
  - cli
  - daemon
  - llm
  - rust
  - tui
description: Autonomous, self-improving AI agent in a single Rust binary
executables:
  - opencrabs
provenance:
  formula: opencrabs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
