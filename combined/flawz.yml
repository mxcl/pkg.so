id: brew:flawz
display-name: flawz
homepage: https://github.com/orhun/flawz
repo: https://github.com/orhun/flawz
docs:
  - https://github.com/orhun/flawz#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Cargo, Arch Linux official
      repositories, Alpine Edge, Homebrew, Nixpkgs unstable, NetBSD pkgsrc, binary
      releases, and source builds. That unusually broad package-manager list for a young
      Rust TUI reflects quick adoption by distribution packagers interested in CVE
      tooling.
  package-nerd-significance:
    - >
      flawz is package-nerd relevant because it combines several current CLI trends in
      one small package: Rust distribution through crates.io and native package
      managers, terminal UI ergonomics, local SQLite caching, and security metadata
      browsing tied to the NVD feed ecosystem.
  project-history:
    - >
      The upstream GitHub repository was created in 2024. The README presents flawz as a
      terminal UI for browsing security vulnerabilities, using NIST's NVD as the default
      vulnerability database and offering search, listing, theming, and details views in
      the terminal.
    - >
      The release stream began with v0.1.0 in May 2024 and reached v0.4.1 in June 2026,
      according to the official GitHub releases API.
  related-projects:
    - NVD and NIST provide the default vulnerability database used by flawz.
    - >
      crates.io, docs.rs, Cargo, Arch Linux, Alpine, Homebrew, Nixpkgs, NetBSD pkgsrc,
      and SQLite are part of the documented packaging and runtime context.
  sources:
    - https://api.github.com/repos/orhun/flawz
    - https://api.github.com/repos/orhun/flawz/releases?per_page=20
    - https://formulae.brew.sh/formula/flawz
    - https://github.com/orhun/flawz
    - https://raw.githubusercontent.com/orhun/flawz/main/README.md
  summary:
    - >
      flawz is a Rust terminal user interface for browsing CVE security vulnerability
      data. It packages NVD-backed vulnerability search into a local CLI/TUI workflow
      with SQLite storage, theming, offline use, and optional NVD API-key acceleration.
  timeline:
    - '2024: GitHub repository created.'
    - '2024: v0.1.0 released on May 18.'
    - '2024: v0.3.0 released on November 3.'
    - '2026: v0.4.0 and v0.4.1 released on June 13.'
  usage:
    - >
      flawz syncs NVD feeds into a SQLite database, accepts year ranges and recent or
      modified feeds, and can start directly on a query such as an xz CVE search. Users
      can pass an NVD API key with `--api-key` or `NVD_API_KEY` for higher NVD rate
      limits, choose themes, and use offline mode against cached data.
related-packages: []
category: security
