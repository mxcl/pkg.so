id: brew:crossplane
display-name: Crossplane CLI
homepage: https://github.com/crossplane/cli
repo: https://github.com/crossplane/cli
docs:
  - https://docs.crossplane.io/latest/cli
config-file-location:
  unix: ~/.kube/config
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      Crossplane's own adopters file lists organizations using it for internal developer
      platforms, cloud management, and infrastructure provisioning, including Upbound,
      Renault, SAP, NASA Science Cloud, Nike, Elastic, and many others. That public
      adopter list made Crossplane important to package managers because the CLI became
      a local workstation tool for a production Kubernetes control-plane ecosystem.
  package-nerd-significance:
    - >
      Crossplane is significant because it brings cloud infrastructure management into
      Kubernetes APIs and package-like control-plane components. The CLI's packaging
      matters for repeatable platform engineering workflows, especially where teams
      build and distribute Crossplane packages rather than only applying YAML to a
      cluster.
  project-history:
    - >
      Crossplane was created by Upbound as an open source framework for building
      Kubernetes-style control planes. CNCF records Crossplane's project path as
      accepted on June 25, 2020, moved to Incubating on September 14, 2021, and
      Graduated on October 28, 2025.
    - >
      The standalone Crossplane CLI repository describes the tool as a single binary for
      macOS, Linux, and Windows. Its v2-era command set focuses on platform and package
      work: building, installing, updating, and pushing packages; building projects;
      rendering and testing composition functions; and troubleshooting Crossplane
      resources.
  related-projects:
    - >
      The CLI is part of the Crossplane ecosystem alongside the crossplane/crossplane
      core project, Crossplane Packages, Composition Functions, Kubernetes, and the CNCF
      project infrastructure.
  sources:
    - https://www.cncf.io/projects/crossplane/
    - https://www.crossplane.io/
    - https://github.com/crossplane/cli#readme
    - https://docs.crossplane.io/latest/cli/
    - https://github.com/crossplane/crossplane/blob/main/ADOPTERS.md
    - https://github.com/crossplane/cli/releases
    - https://formulae.brew.sh/formula/crossplane
  summary:
    - >
      The Homebrew `crossplane` formula packages the Crossplane CLI, the command-line
      companion to the Crossplane cloud-native control plane framework. The CLI is used
      for Crossplane development and administration rather than as the Crossplane
      controller itself.
  timeline:
    - '2020: Crossplane accepted to CNCF'
    - '2021: Crossplane moved to CNCF Incubating'
    - '2025: Crossplane moved to CNCF Graduated'
    - '2026: Crossplane CLI v2.4.0 release'
  usage:
    - >
      The CLI is installed on a user's computer and most commands are independent of
      direct access to a Crossplane pod. Some commands still depend on local platform
      tools, such as a Docker-compatible container runtime for rendering composition
      functions and building projects.
    - >
      In package-manager terms, the CLI turns Crossplane from only a cluster-side
      controller into a local developer tool: users can install it with Homebrew,
      Winget, Nix, APK, or distribution packages and use it in CI or workstation
      workflows around Crossplane packages.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl alongside Crossplane CLI to apply example resources and inspect the
      Kubernetes objects created by a Crossplane control plane; the official project
      guide explicitly hands the generated context to kubectl.
    rel: adjacent_workflow
    sources:
      - >
        https://docs.crossplane.io/cli/latest/get-started/get-started-with-control-plane-projects/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:helm
    reason: >
      Use Helm to install or upgrade the in-cluster Crossplane controller, then use
      Crossplane CLI for package development, rendering, publishing, and
      troubleshooting.
    rel: adjacent_workflow
    sources:
      - https://docs.crossplane.io/latest/get-started/install/
      - https://docs.crossplane.io/cli/latest/
      - https://helm.sh/docs/
category: cloud-infrastructure
package-manager:
  apk: crossplane
  brew: crossplane
  nix: crossplane
  winget: Crossplane.CrossplaneCli
  zypper: crossplane-cli
package-manager-url: https://formulae.brew.sh/formula/crossplane
license: Apache-2.0
tags:
  - cli
  - cloud-native
  - control-plane
  - crossplane
  - kubernetes
description: Build control planes without needing to write code
executables:
  - crossplane
provenance:
  formula: crossplane
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
