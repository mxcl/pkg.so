id: brew:gostatic
display-name: gostatic
homepage: https://github.com/piranha/gostatic
repo: https://github.com/piranha/gostatic
docs:
  - https://github.com/piranha/gostatic#readme
config-file-location:
  unix: config
credentials-file-location: null
history:
  adoption-history:
    - >
      gostatic is available through Homebrew and Nix in the batch input, and the README
      directs users to GitHub Releases or source builds. That is a small but natural
      footprint for a single-purpose developer tool whose users often install it
      directly in build scripts or personal-site toolchains.
  package-nerd-significance:
    - >
      gostatic is a package-nerd example of the compact static-site-generator niche: no
      runtime service, no database, no Node toolchain requirement, just one binary and a
      config file. It matters less as a mass-market SSG than as a small, auditable tool
      with deterministic local builds.
  project-history:
    - >
      The project fits the early Go-era static-site-generator pattern: compile a
      standalone binary, read a site source tree, transform Markdown and templates, and
      write static output. The README presents its design around dependency tracking and
      re-rendering only changed pages, making rebuild speed a central feature.
    - >
      Release notes in the GitHub feed show incremental maintenance rather than a large
      platform pivot: hot reload changes, template helpers, syntax highlighting,
      Markdown parser changes, and dependency updates.
  related-projects:
    - goldmark is the CommonMark parser named in the README.
    - >
      chroma appears in release notes and README-related documentation as
      syntax-highlighting support.
    - >
      The author's solovyov.net repository is linked from the README as an advanced
      usage example.
  sources:
    - https://formulae.brew.sh/formula/gostatic
    - https://github.com/piranha/gostatic
    - https://github.com/piranha/gostatic/releases.atom
  summary:
    - >
      gostatic is a fast static site generator written in Go. Its README emphasizes a
      single binary, dependency tracking, Markdown support, a Make-like configuration
      format, filters, pagination, an HTTP server and watcher, and automation through
      commands such as gostatic --dump.
  timeline:
    - >
      2021: 2.27 adds the datefilename processor; later 2021 releases add hot reload and
      template/highlighting updates.
    - '2022: 2.33 through 2.35 add template functions and highlighting improvements.'
    - >
      2023: 2.36 release notes mention Markdown attribute parsing and major dependency
      updates.
  usage:
    - >
      A typical user runs gostatic -i to scaffold a site, edits the generated config
      file, writes content under the source directory, and runs gostatic or make targets
      to build or watch the site. The configuration model uses constants and rules
      resembling Makefile syntax, which lets users wire Markdown, templates, tags, and
      external processors into a static build.
related-packages:
  - id: brew:hugo
    reason: >
      Choose Hugo when a static site needs a large documentation and theme ecosystem,
      multilingual content, modules, and an integrated asset pipeline; choose gostatic
      for a smaller explicit rule-driven build.
    rel: alternative
    sources:
      - https://github.com/piranha/gostatic
      - https://gohugo.io/documentation/
      - https://github.com/gohugoio/hugo
  - id: brew:zola
    reason: >
      Choose Zola when you want a Rust single binary with CommonMark, Tera templates,
      Sass, search, image processing, and themes built in; choose gostatic for its
      Make-like processor rules and dependency-driven rebuilds.
    rel: alternative
    sources:
      - https://github.com/piranha/gostatic
      - https://www.getzola.org/documentation/getting-started/overview/
      - https://github.com/getzola/zola
