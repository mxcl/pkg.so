id: brew:gifsicle
display-name: Gifsicle
homepage: https://www.lcdf.org/gifsicle/
repo: https://github.com/kohler/gifsicle
docs:
  - https://www.lcdf.org/gifsicle
  - https://www.lcdf.org/gifsicle/changes.html
  - https://www.lcdf.org/gifsicle/man.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gifsicle became a standard command-line GIF optimizer because it handles details
      simple animation joiners do not: frame extraction, batch edits, logical screen
      handling, disposal methods, transparency, colormap shrinking, and multi-level
      optimization. The official page lists Debian, FreeBSD, NetBSD, Homebrew, MacPorts,
      DOS, and Windows package routes.
  package-nerd-significance:
    - >
      Gifsicle is one of the canonical small C command-line tools in the GIF ecosystem.
      It is portable, scriptable, and exact enough that downstream image pipelines and
      package tests can depend on its visual-equivalence behavior.
  project-history:
    - >
      Gifsicle's official change log records a first public release on June 12, 1997.
      The tool quickly added output naming, cropping, frame selection, colormap
      controls, dithering, optimization, gifview, and gifdiff, turning it from an
      animation assembler into a broad GIF manipulation suite.
    - >
      The project kept evolving with portable source releases, Windows and DOS build
      support, BSD ports, MacPorts, and Homebrew. Later releases added deeper
      optimization heuristics, resizing, gamma-aware color selection, threading and SIMD
      for resizing, lossy optimization, security fixes, and newer color-space work.
  related-projects:
    - >
      The official page compares Gifsicle with Whirlgif, GIFMerge, Giftool, and
      web-based optimizers. It complements GIFLIB by focusing on end-user animation
      editing and optimization rather than a reusable C GIF library.
  sources:
    - https://github.com/kohler/gifsicle
    - https://www.lcdf.org/gifsicle/
    - https://www.lcdf.org/gifsicle/changes.html
    - https://www.lcdf.org/gifsicle/man.html
  summary:
    - >
      Gifsicle is Eddie Kohler's command-line toolkit for creating, editing, inspecting,
      comparing, and optimizing GIF images and animations.
  timeline:
    - '1997: First public release.'
    - '1998: Optimization engine improved and gifdiff added.'
    - '2013: Color selection and dithering improvements added.'
    - '2017: SIMD and thread support for resizing added.'
    - '2019: Lossy optimization option added.'
    - '2025: Version 1.96 released with Oklab and Atkinson dithering support.'
  usage:
    - >
      Practitioners use gifsicle to merge still GIFs into animations, extract frames,
      replace or delete animation frames, interlace files, inspect comments and
      metadata, shrink colormaps, and optimize animations by storing only changed frame
      regions. In build scripts it often appears as the final asset-shrinking step for
      generated GIFs.
related-packages:
  - id: brew:gifski
    reason: >
      Choose gifski when creating a high-quality animation from video or image frames;
      choose Gifsicle for detailed manipulation and optimization of existing GIF
      structures.
    rel: alternative
    sources:
      - https://www.lcdf.org/gifsicle/
      - https://gif.ski/
      - https://github.com/ImageOptim/gifski#readme
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick when the workflow spans many image formats and general
      transformations rather than requiring Gifsicle's GIF-specific frame and
      optimization controls.
    rel: alternative
    sources:
      - https://www.lcdf.org/gifsicle/man.html
      - https://imagemagick.org/command-line-processing/
      - https://imagemagick.org/formats/
  - id: cask:clop
    reason: >
      Clop embeds Gifsicle to provide automatic and interactive GIF optimization through
      a macOS clipboard, Finder, watched-folder, and GUI workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/kohler/gifsicle
      - https://github.com/FuzzyIdeas/Clop#readme
category: media
