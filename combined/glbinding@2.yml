id: brew:glbinding@2
display-name: glbinding
homepage: https://glbinding.org/
repo: https://github.com/cginternals/glbinding
docs:
  - https://glbinding.org/docs.html
  - https://github.com/cginternals/glbinding/wiki
  - https://glbinding.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned formulas like glbinding@2 matter in graphics stacks because downstream
      applications may be tied to a C++ API, CMake package layout, compiler baseline, or
      ABI expectation from a specific major line. The formula therefore serves
      compatibility and reproducibility rather than representing a separate upstream
      project.
  package-nerd-significance:
    - >
      For package nerds, glbinding@2 is a textbook versioned formula: same upstream
      repository, same project identity, but a pinned major branch kept available to
      avoid forcing all dependent graphics software onto the unversioned formula's major
      line at once.
  project-history:
    - >
      The upstream glbinding project began publishing 1.x releases in 2014, followed by
      2.0.0 in 2016 and 2.1.x releases through 2018. The official documentation index
      lists v2.0 and v2.1 documentation branches, which is the source-backed reason a
      package manager can expose a versioned 2.x formula separately from the unversioned
      formula.
  related-projects:
    - >
      OpenGL, Khronos OpenGL Registry, khrbinding-generator, GLEW, GLFW, Qt, GTK, SDL,
      CMake, Homebrew versioned formulas.
  sources:
    - https://api.github.com/repos/cginternals/glbinding/releases?per_page=100
    - https://glbinding.org/
    - https://glbinding.org/docs.html
    - https://raw.githubusercontent.com/cginternals/glbinding/master/README.md
  summary:
    - >
      glbinding@2 is the Homebrew versioned formula for the 2.x generation of glbinding,
      the C++ OpenGL binding generated from Khronos gl.xml. The formula role is to keep
      the older major line installable for projects that have not moved to the later
      glbinding API and build assumptions.
  timeline:
    - '2014: glbinding 1.0.0 is published on GitHub releases.'
    - '2016: glbinding 2.0.0 is published.'
    - '2016-2018: glbinding 2.1.x releases form the later 2.x series.'
    - '2018: glbinding.org lists v2.0 and v2.1 documentation branches.'
  usage:
    - >
      Practitioners install glbinding@2 when they need the 2.x headers, library names,
      tools, and documentation behavior expected by an older OpenGL application or build
      recipe. They still use the upstream pattern: create an OpenGL context with a
      toolkit such as GLFW, GTK, Qt, or SDL, initialize glbinding, and link through the
      package's CMake integration.
related-packages:
  - id: brew:glew
    reason: >
      GLEW is a C/C++ OpenGL extension loader with a traditional single-header API;
      choose it for established GLEW-based code, while glbinding emphasizes generated,
      type-safe C++11 interfaces.
    rel: alternative
    sources:
      - https://glbinding.org/docs/v2.0/
      - https://glew.sourceforge.net/
  - id: brew:cmake
    reason: >
      CMake is glbinding's documented build and downstream package-discovery system,
      providing `find_package` and imported-target integration.
    rel: adjacent_workflow
    sources:
      - https://glbinding.org/
      - https://cmake.org/cmake/help/latest/command/find_package.html
category: developer-tools
package-manager:
