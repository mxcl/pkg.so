id: brew:maki
display-name: Maki
homepage: https://maki.sh
repo: https://github.com/tontinton/maki
docs:
  - https://maki.sh/docs
  - https://maki.sh/docs/configuration
  - https://maki.sh/docs/providers
config-file-location:
  unix:
    - ~/.config/maki/init.lua
    - <project>/.maki/init.lua
    - ~/.config/maki/providers.toml
    - ~/.config/maki/permissions.toml
    - ~/.config/maki/mcp.toml
  windows:
    - '%APPDATA%\maki\init.lua'
    - <project>\.maki\init.lua
    - '%APPDATA%\maki\providers.toml'
    - '%APPDATA%\maki\permissions.toml'
    - '%APPDATA%\maki\mcp.toml'
credentials-file-location:
  unix: ~/.local/state/maki/auth/
  windows: '%APPDATA%\maki\auth\'
history:
  adoption-history:
    - >
      Maki supports interactive terminal use, non-interactive and SDK-style operation,
      and the Agent Client Protocol for editor integrations such as Zed. Its CLI also
      accepts a compatibility surface intended for Claude Code-oriented workflows.
    - >
      The project supports reusable skills, MCP servers, project instruction files, and
      Neovim-style Lua packages, positioning it within the emerging ecosystem of
      extensible terminal coding agents.
  package-nerd-significance:
    - >
      Maki is notable for treating token economy and low runtime overhead as first-class
      engineering goals while exposing much of its behavior through Lua configuration
      and plugins.
    - >
      Its XDG-aware directory layout, headless interface, provider abstraction,
      folder-trust model, and compatibility with common agent instruction and skill
      conventions make it particularly interesting for users who compose developer
      tooling from small, inspectable parts.
  project-history:
    - >
      Maki was created by Tony Solomonik as a native Rust terminal coding agent. The
      project emphasizes fast startup, low memory use, economical context handling, and
      extensibility through a Lua API modeled after Neovim.
    - >
      Official documentation does not provide a dated origin timeline, so its early
      chronology is not asserted here.
  related-projects:
    - Neovim inspires Maki's Lua-oriented plugin and package model.
    - The Agent Client Protocol enables editor integrations.
    - >
      Claude Code conventions inform parts of Maki's compatibility surface, including
      instruction files and SDK flags.
  sources:
    - 'Official CLI reference: https://maki.sh/docs/cli/'
    - 'Official configuration reference: https://maki.sh/docs/configuration/'
    - 'Official documentation: https://maki.sh/docs/'
    - 'Official repository metadata: https://github.com/tontinton/maki'
  summary:
    - >
      Maki is a Rust-based terminal AI coding agent designed for low token use, fast
      interactive operation, and deep Lua extensibility.
  timeline:
    - >
      Current project documentation: Maki is distributed as a Rust TUI with headless,
      SDK, and ACP modes; no authoritative dated origin timeline is published.
  usage:
    - >
      Run maki in a source checkout to start its TUI, or use --print for scripts and CI.
      Users select an LLM provider and model, then let the agent inspect, edit, and run
      project code.
    - >
      Global behavior is configured in init.lua, while trusted repositories can supply a
      project-local .maki directory. Plugins can add tools, commands, keymaps, hooks,
      and provider integrations.
related-packages:
  - id: brew:aider
    reason: >
      Choose Aider for a mature Git-centered AI pair-programming workflow; choose Maki
      when native Rust execution and Neovim-like Lua extensibility are priorities.
    rel: alternative
    sources:
      - https://aider.chat/docs/
      - https://maki.sh/docs/
  - id: cask:zed
    reason: >
      Maki can run an Agent Client Protocol server on standard input/output so Zed can
      provide the editor-side interface for Maki sessions.
    rel: adjacent_workflow
    sources:
      - https://maki.sh/docs/cli/
      - https://zed.dev/docs/ai/external-agents
category: developer-tools
package-manager:
  brew: maki
package-manager-url: https://formulae.brew.sh/formula/maki
license: MIT
tags:
  - agent-client-protocol
  - ai-coding-agent
  - cli
  - lua-plugins
  - mcp
  - rust
  - terminal-ui
description: Efficient AI coding agent extendable by neovim-like Lua plugins
executables:
  - maki
provenance:
  formula: maki
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
