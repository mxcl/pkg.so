history:
  adoption-history:
    - >
      The official product page records an Editors' Choice mention in MacLife's October
      2022 issue and highlights coverage praising the utility as a useful, nostalgic
      alternative to Apple's own mini player.
  package-nerd-significance:
    - >
      Music MiniPlayer is representative of native macOS utilities that preserve a
      discontinued interface idiom while adapting it to a current system application.
      Its universal binary and AppKit implementation appeal to users who value small,
      platform-native desktop tools.
  project-history:
    - >
      Mario Guzman created Music MiniPlayer as a modern macOS recreation of the compact
      iTunes 10 MiniPlayer. The application is implemented natively in Swift and AppKit,
      with much of its interface drawn using Core Graphics and Core Animation.
  related-projects:
    - Apple Music
    - iTunes MiniPlayer
    - Music Widget
    - Music Remote
    - QuickTune
  sources:
    - https://marioaguzman.github.io/music/
    - https://marioaguzman.github.io/musicminiplayer/
  summary:
    - >
      Music MiniPlayer is a native macOS remote for Apple Music whose interface
      recreates the classic iTunes MiniPlayer.
  timeline:
    - "2022: Music MiniPlayer received an Editors' Choice mention in MacLife's October issue."
  usage:
    - >
      The utility provides glanceable track information and playback controls for Apple
      Music, plus playlist selection and a specialized live-streaming display.
    - >
      It requires the macOS Music application, does not require an Apple Music
      subscription, and is not compatible with Spotify.
