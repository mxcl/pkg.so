id: cask:duplicate-file-finder
display-name: Duplicate File Finder
homepage: https://nektony.com/duplicate-finder-free
repo: null
docs:
  - https://nektony.com/duplicate-finder-free
  - https://nektony.com/wp-content/uploads/2023/06/Duplicate_finder_user_guide.pdf
config-file-location:
  macos:
    - ~/Library/Containers/com.nektony.Duplicates-Finder/
    - ~/Library/Containers/com.nektony.Duplicates-Expert/
    - ~/Library/Application Support/com.nektony.Duplicate-File-Finder-SII/
    - ~/Library/Preferences/com.nektony.Duplicate-File-Finder-SII.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Nektony reports more than 10 million downloads for the product and offers both
      free and Pro editions. Its scope grew from basic duplicate removal to
      similar-media detection, Photos and Music library scanning, cloud and
      external-disk scanning, folder comparison, folder merging, removal history, and
      bulk auto-selection.
  package-nerd-significance:
    - >
      The application represents the polished commercial end of the Mac duplicate-finder
      category: a graphical, notarized utility with byte-level matching, media-library
      integration, recoverable removal workflows, and support for very large
      collections.
  project-history:
    - >
      Nektony's company history dates the introduction of Duplicate File Finder to
      November 2015. An advanced edition followed in February 2018, and the vendor's
      continuing release history records major additions and macOS compatibility work
      through version 9 in 2026.
  related-projects:
    - >
      Part of Nektony's Mac-utility portfolio alongside App Cleaner & Uninstaller, Disk
      Space Analyzer, and MacCleaner Pro.
  sources:
    - https://nektony.com/about
    - https://nektony.com/duplicate-finder-free
    - https://nektony.com/duplicate-finder-free/download
    - https://nektony.com/wp-content/uploads/2023/06/Duplicate_finder_user_guide.pdf
  summary:
    - >
      Duplicate File Finder is Nektony's macOS utility for finding and removing
      duplicate files and folders and identifying similar photos and audio.
  timeline:
    - '2015: Nektony introduces Duplicate File Finder.'
    - >
      2018: Nektony releases an advanced version with expanded organization and cleanup
      features.
    - '2023: Version 7 adds folder comparison and expanded similar-media tooling.'
    - '2026: Version 9 introduces a redesigned interface and VoiceOver support.'
  usage:
    - >
      Users select folders, disks, cloud-storage locations, or Photos and Music
      libraries to scan, review byte-identical or similar items, apply automatic
      selection rules, and move unwanted copies to the Trash. Removal history can help
      restore mistakenly removed files.
category: system
