id: brew:gnuradio
display-name: GNU Radio
homepage: https://www.gnuradio.org/
repo: https://github.com/gnuradio/gnuradio
docs:
  - https://wiki.gnuradio.org/index.php/Main_Page
  - https://wiki.gnuradio.org/index.php?title=Tutorials
config-file-location:
  unix:
    - ~/.gnuradio/config.conf
    - <prefix>/etc/gnuradio/conf.d/*.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Radio became significant because it let researchers, radio amateurs, hardware
      vendors, and educators share signal-processing designs as flowgraphs and reusable
      blocks. Its adoption followed the rise of affordable SDR hardware, especially
      USRP-family devices, and it became common in academic labs, wireless prototyping,
      spectrum experiments, satellite work, and security research.
    - >
      The ecosystem around GNU Radio includes conferences, tutorials, out-of-tree
      modules, and companion projects such as CGRAN. That ecosystem matters to package
      maintainers because installing GNU Radio often means delivering a coordinated
      stack of DSP libraries, Python bindings, GUI dependencies, hardware drivers, and
      examples.
  package-nerd-significance:
    - >
      GNU Radio is a package-manager stress test: it spans compiled DSP code, Python
      packaging, Qt GUI pieces, hardware-driver interfaces, and optional acceleration
      libraries. For users, a working package turns a laptop into an SDR lab without
      hand-building the whole scientific stack.
  project-history:
    - >
      GNU Radio grew from early-2000s work to make software radio practical on
      general-purpose computers. Project material describes a framework for building
      software radios out of signal-processing blocks, while community history ties its
      early development to Eric Blossom, John Gilmore, and the first USRP hardware from
      Ettus Research. The project later developed around a Python-driven runtime, C++
      performance blocks, GNU Radio Companion, out-of-tree modules, and hardware
      integrations rather than a single end-user radio application.
    - >
      The project evolved into a foundation for related infrastructure such as VOLK,
      reusable block collections, and community extension modules. Its organizational
      home also matured: the GNU Radio project formed a foundation and later announced a
      new home at the SETI Institute, reflecting its role as community infrastructure
      for radio science, education, and experimentation.
  related-projects:
    - USRP and UHD provide a common hardware path for GNU Radio users.
    - VOLK supplies vector-optimized kernels used by GNU Radio blocks.
    - CGRAN and out-of-tree modules extend the block ecosystem.
  sources:
    - https://github.com/gnuradio/gnuradio
    - https://wiki.gnuradio.org/index.php/Main_Page
    - https://wiki.gnuradio.org/index.php?title=Tutorials
    - https://www.gnuradio.org/
    - https://www.gnuradio.org/blog/2020-09-10-gnu-radio-has-a-new-home/
  summary:
    - >
      GNU Radio is a GNU Project software-defined radio framework that gives
      signal-processing practitioners a reusable runtime, block library, and graphical
      flowgraph environment. In package ecosystems it represents the heavy end of
      scientific tooling: a desktop-adjacent SDR workbench, a Python and C++ development
      platform, and a bridge from commodity computers to radio hardware.
  timeline:
    - >
      2001: Early GNU Radio development began around general-purpose software radio
      experiments.
    - '2004: USRP hardware helped make GNU Radio useful with affordable external RF front ends.'
    - '2011: GNU Radio Conference began as a recurring community venue.'
    - '2020: GNU Radio announced a foundation home at the SETI Institute.'
  usage:
    - >
      Practitioners use GNU Radio to construct flowgraphs that connect sources, filters,
      modulators, demodulators, visualizers, and sinks. A flowgraph may run entirely in
      simulation, process captured IQ files, or talk to SDR hardware through drivers
      such as UHD.
    - >
      Developers use GNU Radio Companion for visual design, Python for orchestration,
      C++ for performance-sensitive blocks, and gr_modtool to build out-of-tree modules.
      The command-line tools in package builds are also used for inspecting installs,
      compiling flowgraphs, plotting samples, and testing radio chains.
related-packages:
  - id: brew:uhd
    reason: >
      Install UHD alongside GNU Radio to use the documented UHD source and sink blocks
      with Ettus Research USRP hardware.
    rel: adjacent_workflow
    sources:
      - https://wiki.gnuradio.org/index.php/Guided_Tutorial_Hardware_Considerations
      - https://files.ettus.com/manual/
  - id: brew:volk
    reason: >
      VOLK provides the vector-optimized kernels used by GNU Radio, and volk_profile can
      tune kernel selection for the local CPU.
    rel: adjacent_workflow
    sources:
      - https://wiki.gnuradio.org/index.php?title=Volk
      - https://www.libvolk.org/
  - id: cask:gqrx
    reason: >
      Gqrx is a ready-made graphical SDR receiver built on GNU Radio's DSP blocks and
      runtime, making it useful when a receiver application is preferable to
      constructing a flowgraph.
    rel: adjacent_workflow
    sources:
      - https://www.gqrx.dk/doc/gqrx-design
      - https://www.gnuradio.org/
  - id: brew:hackrf
    reason: >
      HackRF supplies host tools and libraries for radio hardware that the official
      HackRF documentation lists as directly supported by GNU Radio.
    rel: adjacent_workflow
    sources:
      - https://hackrf.readthedocs.io/en/latest/software_support.html
      - https://www.gnuradio.org/
