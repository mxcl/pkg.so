id: brew:bazel-diff
display-name: bazel-diff
homepage: https://github.com/Tinder/bazel-diff/
repo: https://github.com/Tinder/bazel-diff
docs:
  - https://github.com/Tinder/bazel-diff/tree/master/docs
  - https://github.com/Tinder/bazel-diff#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is strongest among Bazel monorepo users who need deterministic
      affected-target selection for pull-request CI. The Homebrew formula packages it as
      a standalone CLI, making it accessible outside the original Tinder repository.
    - >
      Later README additions describe an experimental HTTP query service and cached hash
      generation, showing a shift from one-shot local comparison toward always-on CI
      infrastructure for large repositories.
  package-nerd-significance:
    - >
      For package-history nerds, bazel-diff is a good example of the post-Bazel
      ecosystem filling operational gaps around monorepo CI rather than replacing Bazel
      itself.
    - >
      It also illustrates why Bazel-adjacent packages often matter more as automation
      primitives than as developer-facing build tools: the interesting artifact is the
      affected-target JSON consumed by CI.
  project-history:
    - >
      The upstream repository begins in September 2020 with a v1.0-era implementation of
      Bazel target diffing. Its README frames the project as an answer to a gap in Bazel
      itself, pointing to the long-running Bazel feature request for native target
      diffing and to a BazelCon talk as design inspiration.
    - >
      The tool's implementation history is tied to very large Bazel graphs: the README
      calls out streamed protobuf query output, avoidance of long command-line query
      lists, support for renamed/deleted/modified files, and testing against projects
      with tens of thousands of targets.
  related-projects:
    - Bazel supplies the query and build graph model that bazel-diff analyzes.
    - >
      Aspect's impacted command is documented by bazel-diff as a Starlark/Aspect CLI way
      to expose a similar impacted-target workflow.
    - >
      Bazelisk is commonly paired with bazel-diff in CI so the Bazel binary used for
      graph hashing matches the workspace's pinned version.
  sources:
    - Upstream git history for https://github.com/Tinder/bazel-diff starts in September 2020.
    - >
      https://github.com/Tinder/bazel-diff#readme documents origins, use cases,
      impacted-target workflow, scale notes, and related Bazel feature request.
    - source_facts.package-manager-url records the Homebrew packaging surface.
  summary:
    - >
      bazel-diff is Tinder's command-line utility for computing the Bazel targets
      affected between two Git revisions, letting CI systems build or test the precise
      changed target set instead of rerunning an entire monorepo.
  timeline:
    - '2020-09: Upstream git history starts with the initial v1.0-era bazel-diff code.'
    - '2020s: Homebrew packages bazel-diff as a standalone CLI for macOS and Linux users.'
    - >
      2020s: README-documented features expand to build graph distance metrics and an
      experimental long-running query service.
  usage:
    - >
      A typical workflow checks out a base revision, generates Bazel graph hashes,
      checks out a final revision, generates hashes again, and runs get-impacted-targets
      to emit the changed target labels as JSON.
    - >
      The tool is used when correctness matters more than approximate file globs: its
      docs explicitly warn that incorrect affected-test selection erodes trust in
      green-to-red CI transitions.
related-packages:
  - id: brew:bazel
    reason: >
      bazel-diff invokes Bazel to query and hash the workspace graph, then emits target
      labels that Bazel can selectively build or test.
    rel: adjacent_workflow
    sources:
      - https://github.com/Tinder/bazel-diff
      - https://bazel.build/query/guide
  - id: brew:bazelisk
    reason: >
      Bazelisk can expose the workspace-pinned Bazel release as the Bazel executable
      used by bazel-diff, keeping local and CI graph calculations on the intended
      version.
    rel: adjacent_workflow
    sources:
      - https://github.com/Tinder/bazel-diff
      - https://github.com/bazelbuild/bazelisk
category: developer-tools
package-manager:
  brew: bazel-diff
package-manager-url: https://formulae.brew.sh/formula/bazel-diff
license: BSD-3-Clause
tags:
  - bazel
  - build-tool
  - cli
  - git
  - test-selection
description: Performs Bazel Target Diffing between two revisions in Git
executables:
  - bazel-diff
provenance:
  formula: bazel-diff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
