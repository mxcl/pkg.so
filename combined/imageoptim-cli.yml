id: brew:imageoptim-cli
display-name: ImageOptim-CLI
homepage: https://jamiemason.github.io/ImageOptim-CLI/
repo: https://github.com/JamieMason/ImageOptim-CLI
docs:
  - https://github.com/JamieMason/ImageOptim-CLI#readme
  - https://jamiemason.github.io/ImageOptim-CLI
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ImageOptim-CLI spread through npm and Homebrew because it filled a practical gap
      for front-end build pipelines on Macs: ImageOptim and related apps had strong
      compression results but were awkward to use unattended. The README also points to
      a companion Grunt plugin, an Alfred workflow, and a tool-comparison page that
      positioned the CLI in the web-performance tooling ecosystem.
    - >
      Homebrew packages the tool as `imageoptim-cli`, while npm remains an upstream
      distribution channel. Homebrew analytics show a small but persistent install base,
      which fits its niche as a Mac-only automation bridge rather than a general
      cross-platform optimizer.
  package-nerd-significance:
    - >
      For package-manager users, ImageOptim-CLI is notable because it packages a
      workflow rather than a codec: the value is coordinating several native Mac apps
      behind one repeatable command. It is also a good example of Homebrew carrying a
      Node-derived binary for a workflow that only makes sense on macOS.
  project-history:
    - >
      Jamie Mason published ImageOptim-CLI to npm in 2013, with the project changelog
      showing the 1.0.0 line on 2013-05-17. The README frames the package as automation
      for ImageOptim, ImageAlpha, and JPEGmini, and explains that the CLI depends on
      those applications rather than bundling them.
    - >
      The project evolved from a JavaScript-era package into a TypeScript and
      AppleScript tool distributed as a self-contained executable. Version 2.0.0 in 2018
      rewrote the core in Node.js, and the 3.x line tightened macOS app detection,
      temporary directory handling, Node runtime support, and JPEGmini compatibility.
  related-projects:
    - >
      ImageOptim-CLI automates ImageOptim, ImageAlpha, and JPEGmini, and its README
      names `grunt-imageoptim` and an Alfred workflow as related projects. It also
      compares itself with optimizer services and tools such as Kraken.io, CodeKit,
      grunt-contrib-imagemin, Smush.it, and TinyPNG.
  sources:
    - https://formulae.brew.sh/api/formula/imageoptim-cli.json
    - https://github.com/JamieMason/ImageOptim-CLI
    - https://raw.githubusercontent.com/JamieMason/ImageOptim-CLI/main/CHANGELOG.md
    - https://raw.githubusercontent.com/JamieMason/ImageOptim-CLI/main/README.md
    - https://registry.npmjs.org/imageoptim-cli
  summary:
    - >
      ImageOptim-CLI is a macOS-focused command-line wrapper around ImageOptim,
      ImageAlpha, and JPEGmini. It exists to make GUI-first image optimizers usable from
      shell scripts, build steps, and package-managed developer environments.
  timeline:
    - '2013: ImageOptim-CLI 1.0.0 published to npm.'
    - '2013: The project was covered as a batch compression tool for optimized web images.'
    - '2018: Version 2.0.0 rewrote the core in Node.js.'
    - '2019: Version 3.0.0 changed missing-app cases from warnings to errors.'
    - '2023: Version 3.1.9 added Node 18 support and dependency updates.'
  usage:
    - >
      The `imageoptim` executable accepts file patterns and flags for enabling
      ImageAlpha or JPEGmini, disabling ImageOptim, controlling stats output, and
      selecting compression settings such as ImageAlpha color count and quality range.
      Its typical use is batch optimization from a terminal or build script.
    - >
      Because JPEGmini automation simulates a GUI user, the README documents macOS
      accessibility permissions for that path. The package therefore sits in the unusual
      intersection of CLI automation, AppleScript, and GUI image applications.
related-packages:
  - id: cask:imageoptim
    reason: >
      Install ImageOptim as the CLI's default optimization engine; the CLI invokes the
      application over matching files and waits for the batch to complete.
    rel: adjacent_workflow
    sources:
      - https://github.com/JamieMason/ImageOptim-CLI
      - https://imageoptim.com/command-line.html
      - https://imageoptim.com/mac
category: media
package-manager:
  brew: imageoptim-cli
package-manager-url: https://formulae.brew.sh/formula/imageoptim-cli
license: MIT
tags:
  - automation
  - build-tool
  - cli
  - image-optimization
  - macos
description: CLI for ImageOptim, ImageAlpha and JPEGmini
executables:
  - imageoptim
provenance:
  formula: imageoptim-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
