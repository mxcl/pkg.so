docs:
  - https://pallini.di.uniroma1.it/
  - https://pallini.di.uniroma1.it/nug29.pdf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nauty is widely embedded in mathematical software and research workflows. The
      official license note says many people use nauty through larger packages such as
      Magma, Sage, or GAP, sometimes without knowing it. Homebrew analytics consulted on
      2026-07-01 listed 867 installs over the preceding 365 days, which is modest for a
      general CLI but meaningful for specialized computational mathematics software.
  package-nerd-significance:
    - >
      For package people, nauty is a classic case where the executable list is the
      product: installing the package gives a graph-processing toolbox, not a single
      app. It is also a dependency hiding under higher-level math systems, so packaging
      it correctly improves reproducibility for many graph enumeration and isomorphism
      workloads.
  project-history:
    - >
      The official site roots nauty's original design in Brendan McKay's 1981 paper
      'Practical Graph Isomorphism'. It lists Traces' original design in Adolfo
      Piperno's work on search-space contraction and cites McKay and Piperno's 2014
      'Practical Graph Isomorphism, II' paper for the current algorithms.
    - >
      The package has accumulated a large utility suite around the core algorithms. The
      official site describes gtools, including `geng` for rapidly generating
      non-isomorphic graphs, plus generators and file-manipulation programs for graph6,
      sparse6, and related compact graph formats.
  related-projects:
    - >
      Magma, Sage, GAP, graph6/sparse6 tooling, Graphviz via `dretodot`, and
      graph-isomorphism research code are closely related.
  sources:
    - https://doi.org/10.1016/j.jsc.2013.09.003
    - https://formulae.brew.sh/formula/nauty
    - https://pallini.di.uniroma1.it/
    - https://pallini.di.uniroma1.it/nug29.pdf
  summary:
    - >
      nauty and Traces are graph isomorphism, automorphism group, and canonical
      labelling tools by Brendan McKay and Adolfo Piperno. They are foundational
      academic software for graph theory and combinatorics, with command-line utilities
      as well as C APIs.
  timeline:
    - "1981: McKay's original 'Practical Graph Isomorphism' paper published."
    - '2008: Traces source files listed with Adolfo Piperno copyright beginning in 2008.'
    - >
      2014: McKay and Piperno's 'Practical Graph Isomorphism, II' published in Journal
      of Symbolic Computation.
    - '2016-02-26: nauty and Traces 2.5 release noted on the official site.'
    - '2026-01-01: Version 2.9.3 released on the official site.'
  usage:
    - >
      Package users run utilities such as `dreadnaut`, `geng`, `labelg`, `shortg`,
      `countg`, and `showg`, or compile programs against the C interfaces. The user
      guide says `dreadnaut` is enough for many one-off computations, while serious use
      usually means writing a program that calls nauty or Traces directly.
related-packages:
  - id: brew:graphviz
    reason: >
      Use Graphviz after nauty when graphs analyzed or generated by nauty need
      visualization; nauty's official `dretodot` utility emits DOT specifically for
      Graphviz rendering.
    rel: adjacent_workflow
    sources:
      - https://pallini.di.uniroma1.it/
      - https://graphviz.org/documentation/
