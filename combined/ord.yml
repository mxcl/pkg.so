id: brew:ord
display-name: ord
homepage: https://ordinals.com/
repo: https://github.com/ordinals/ord
docs:
  - https://docs.ordinals.com/
  - https://github.com/ordinals/ord#readme
config-file-location:
  unix:
    - <CONFIG_PATH>
    - <CONFIG_DIR_PATH>/ord.yaml
    - <DATA_DIR_PATH>/ord.yaml
    - ord.yaml in the default data directory
credentials-file-location:
  linux: ~/.bitcoin/.cookie
  macos: ~/Library/Application Support/Bitcoin/.cookie
  windows: '%APPDATA%\Bitcoin\.cookie'
history:
  adoption-history:
    - >
      ord became the canonical package for people who wanted to run their own Ordinals
      index and inspect Bitcoin-native inscriptions without relying on a hosted
      explorer. The project accumulated thousands of GitHub stars and more than a
      thousand forks, and the README points users to GitHub releases, crates.io,
      Homebrew, Docker builds, and the ordinals.com installer.
    - >
      Adoption followed the broader rise of Bitcoin inscriptions in 2023 and later
      Ordinals-adjacent protocols. The changelog shows continuing protocol work,
      including runes-related indexing and display changes around the 0.18 series in
      2024.
  package-nerd-significance:
    - >
      For package databases, ord is a rare case where a package manager formula tracks
      software that is both a CLI and a de facto protocol implementation. Installing the
      package can mean participating in an indexing convention used by marketplaces,
      wallets, explorers, and independent node operators.
    - >
      The package is also a snapshot of how protocol communities distribute tooling:
      Rust source, crates.io metadata, GitHub releases, Homebrew, Docker, public
      explorer instances, and a project handbook all serve different parts of the user
      base.
  project-history:
    - >
      The GitHub repository for ord was created on 2021-12-12. Its README describes
      Ordinal Theory as a system that assigns serial numbers to satoshis in mining order
      and preserves those numbers across transactions, which turns ordinary sats into
      collectable, trackable units.
    - >
      Casey Rodarmor's January 2023 writing around ord 0.4.0 framed the package as an
      open-source Rust binary developed on GitHub, with an ordinal wallet, inscription
      creation and transfer support, and block explorer instances for mainnet, signet,
      and testnet. That release marked the point where mainnet inscriptions were
      presented as ready for use under the protocol-compatibility rules described by the
      project.
  related-projects:
    - >
      Bitcoin Core is a required counterpart for full-node and wallet functionality; ord
      relies on it for private-key management, signing, blocks, and transactions. The
      Ordinal Theory Handbook, ordinals.com explorer, crates.io package, Homebrew
      formula, and Umbrel Ordinals app are part of the surrounding distribution and
      operator ecosystem.
  sources:
    - https://api.github.com/repos/ordinals/ord
    - https://crates.io/crates/ord
    - https://docs.ordinals.com/
    - https://docs.ordinals.com/guides/wallet.html
    - https://formulae.brew.sh/formula/ord
    - https://github.com/ordinals/ord
    - https://github.com/ordinals/ord/blob/master/CHANGELOG.md
    - https://rodarmor.com/blog/inscribing-mainnet/
  summary:
    - >
      ord is the reference implementation around Bitcoin Ordinal Theory: a Rust
      command-line program that indexes satoshis, serves a block explorer, and provides
      wallet commands for inscriptions and related Ordinals workflows. Its importance
      comes from combining protocol interpretation, wallet operations, and explorer UX
      in one package rather than being only a library or only a web service.
  timeline:
    - '2021-12-12: ordinals/ord repository created on GitHub.'
    - >
      2023-01: ord 0.4.0 was described by Casey Rodarmor as supporting mainnet
      inscription creation, transfer, and exploration.
    - >
      2024-04: the 0.18 series changelog includes runes-related wallet, listing, and
      indexing work.
  usage:
    - >
      Operators use ord beside Bitcoin Core: ord asks Bitcoin Core for blocks and
      transactions, builds its own index, and exposes the resulting view through CLI and
      explorer commands. Wallet users use it for sat control, inscription creation,
      transfers, and related maintenance tasks, while the README warns that Bitcoin Core
      itself is not inscription-aware.
    - >
      The security model is package-nerd-interesting because ord bridges local wallet
      access, blockchain indexing, and web serving. The README explicitly warns that the
      explorer can host untrusted HTML and JavaScript, and that ord wallet use should be
      segregated from wallets holding material cardinal bitcoin balances.
category: networking
package-manager:
  brew: ord
  nix: ord
package-manager-url: https://formulae.brew.sh/formula/ord
license: CC0-1.0
tags:
  - bitcoin
  - block-explorer
  - cli
  - ordinals
  - wallet
description: Index, block explorer, and command-line wallet
executables:
  - ord
provenance:
  formula: ord
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
