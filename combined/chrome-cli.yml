id: brew:chrome-cli
display-name: chrome-cli
homepage: https://github.com/prasmussen/chrome-cli
repo: https://github.com/prasmussen/chrome-cli
docs:
  - https://github.com/prasmussen/chrome-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages chrome-cli and installs companion wrapper commands for Chrome
      Canary, Chromium, Brave, Vivaldi, Edge, and Arc. The supplied package-manager
      facts also list MacPorts.
    - >
      Homebrew's formula API reports stable version 1.11.0 and ongoing installs, while
      the README documents Homebrew as the installation path.
  package-nerd-significance:
    - >
      chrome-cli is significant as a small macOS automation package that exposes Apple
      Events/Scripting Bridge browser control as ordinary shell commands. It is
      especially useful in scripts, launchers, tests, and tab-management workflows where
      a full browser automation framework would be excessive.
  project-history:
    - >
      The GitHub repository was created in February 2014. The README describes
      chrome-cli as a native OS X/macOS binary for controlling Chrome-compatible
      browsers from the command line.
    - >
      The early 1.1.0 tag dates to February 2014, with later releases continuing through
      1.11.0 in September 2025.
  related-projects:
    - >
      Related browser targets include Chrome, Chrome Canary, Chromium, Brave, Vivaldi,
      Edge, and Arc. The README also points to Chromium's AppleScript documentation for
      enabling JavaScript execution through Apple Events.
  sources:
    - https://github.com/prasmussen/chrome-cli#readme
    - https://github.com/prasmussen/chrome-cli/releases
    - https://formulae.brew.sh/api/formula/chrome-cli.json
  summary:
    - >
      chrome-cli is a macOS command-line utility for controlling Google
      Chrome-compatible browsers through Apple's Scripting Bridge.
  timeline:
    - '2014: Repository created and early 1.1.0 tag appears.'
    - '2018: 1.6.0 release line reached.'
    - '2021: 1.7.x releases published.'
    - '2022: 1.8.0 release published.'
    - '2023: 1.9.x releases published.'
    - '2024: 1.10.0 release published.'
    - '2025: 1.11.0 release published; Homebrew stable version reports 1.11.0.'
  usage:
    - >
      The tool lists windows, tabs, and links; opens URLs; activates, closes, reloads,
      resizes, and positions browser windows; prints tab information or source; executes
      JavaScript; and can emit JSON output with `OUTPUT_FORMAT=json`.
    - >
      For JavaScript execution and source viewing, the README documents the Chrome
      setting needed for JavaScript from Apple Events. Browser selection can be changed
      with the `CHROME_BUNDLE_IDENTIFIER` environment variable or the installed wrapper
      scripts.
related-packages: []
category: developer-tools
package-manager:
  brew: chrome-cli
  macports: chrome-cli
package-manager-url: https://formulae.brew.sh/formula/chrome-cli
license: MIT
tags:
  - browser-automation
  - chrome
  - cli
  - macos
description: Control Google Chrome from the command-line
executables:
  - arc-cli
  - brave-cli
  - chrome-canary-cli
  - chrome-cli
  - chromium-cli
  - edge-cli
  - vivaldi-cli
provenance:
  formula: chrome-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
