id: brew:elio
display-name: elio
homepage: https://elio-fm.github.io/
repo: https://github.com/elio-fm/elio
docs:
  - https://elio-fm.github.io/docs
  - https://github.com/elio-fm/elio#readme
config-file-location:
  linux:
    - ~/.config/elio/config.toml
    - $XDG_CONFIG_HOME/elio/config.toml
    - ~/.config/elio/theme.toml
    - $XDG_CONFIG_HOME/elio/theme.toml
  macos:
    - ~/Library/Application Support/elio/config.toml
    - ~/Library/Application Support/elio/theme.toml
  windows:
    - '%APPDATA%\elio\config.toml'
    - '%APPDATA%\elio\theme.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions cover Homebrew, Cargo, Arch Linux AUR, Fedora
      COPR, and Debian/Ubuntu apt packages. Homebrew's formula metadata currently tracks
      the v1.10.0 source archive.
  package-nerd-significance:
    - >
      elio is notable to package users because it combines a modern Rust TUI with broad
      optional preview tooling and multiple official installation routes, including
      Homebrew and Cargo.
  project-history:
    - >
      The official GitHub repository was created in March 2026 and the project reached a
      1.0.0 GitHub release in April 2026. The README presents the project as a
      batteries-included terminal file manager and links users to a dedicated
      documentation site.
  related-projects:
    - >
      The documentation names optional companion tools such as Poppler, FFmpeg, resvg,
      7-Zip, unar, FontForge, zoxide, and supported terminal image protocols.
  sources:
    - 'GitHub releases API: v1.0.0 published 2026-04-10 and v1.10.0 published 2026-06-30'
    - 'GitHub repository API: created_at 2026-03-09, language Rust, topics, and homepage'
    - 'Homebrew formula API: stable version 1.10.0 and official source archive'
    - >
      Official README and docs: feature, installation, workflow, configuration, and
      theming sections
  summary:
    - >
      elio is a Rust terminal file manager focused on rich previews, inline image
      display, keyboard workflows, shell integration, trash support, and customizable
      themes.
  timeline:
    - '2026: GitHub repository created'
    - '2026: v1.0.0 published on GitHub releases'
    - '2026: Homebrew formula tracks v1.10.0'
  usage:
    - >
      Users launch elio from the current directory or pass a file or directory path,
      then use the terminal UI for navigation, file operations, previews, fuzzy search,
      zoxide jumps, and shell integration.
related-packages:
  - id: brew:yazi
    reason: >
      Choose Yazi when you want a Rust terminal file manager centered on non-blocking
      asynchronous I/O and an established plugin-oriented workflow.
    rel: alternative
    sources:
      - https://elio-fm.github.io/
      - https://github.com/sxyazi/yazi
  - id: brew:nnn
    reason: >
      Choose nnn when a tiny, nearly zero-config terminal file manager with
      language-agnostic plugins and very low resource use matters more than elio's
      built-in rich interface.
    rel: alternative
    sources:
      - https://elio-fm.github.io/
      - https://github.com/jarun/nnn
  - id: brew:ranger
    reason: >
      Choose ranger for its mature Python customization model, vi-style workflow,
      configurable preview script, and rule-based rifle file launcher.
    rel: alternative
    sources:
      - https://elio-fm.github.io/
      - https://github.com/ranger/ranger
      - https://github.com/ranger/ranger/blob/master/doc/ranger.pod
category: productivity
package-manager:
  brew: elio
package-manager-url: https://formulae.brew.sh/formula/elio
license: MIT
tags:
  - cli
  - file-manager
  - image-preview
  - rust
  - terminal
  - tui
description: Batteries-included terminal file manager with rich previews
executables:
  - elio
provenance:
  formula: elio
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
