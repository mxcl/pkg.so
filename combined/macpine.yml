id: brew:macpine
display-name: macpine
homepage: https://beringresearch.github.io/macpine/
repo: https://github.com/beringresearch/macpine
docs:
  - https://beringresearch.github.io/macpine
  - https://github.com/beringresearch/macpine#readme
config-file-location:
  macos: ~/.macpine/<instance-name>/config.yaml
credentials-file-location:
  macos: ~/.macpine/<instance-name>/config.yaml
history:
  adoption-history:
    - >
      macpine is distributed through package managers used by Mac developers, including
      Homebrew and MacPorts according to its official README and the supplied package
      facts. GitHub metadata shows a public project with releases, stars, forks, and a
      Go codebase, which points to a small but visible niche around local Linux-on-Mac
      workflows.
  package-nerd-significance:
    - >
      Package maintainers care about macpine because it packages a repeatable Alpine VM
      workflow behind a small CLI rather than asking users to wire together QEMU,
      networking, shared folders, and shell glue themselves. It is especially relevant
      on Apple Silicon, where architecture emulation and lightweight Linux test
      environments are common developer needs.
  project-history:
    - >
      The project is maintained by Bering Research and published from the official
      GitHub repository with generated MkDocs documentation. The README and site
      describe a focused goal: make Alpine Linux VMs easy to spin up on macOS for
      containerization, architecture testing, and software build workflows.
  related-projects:
    - >
      macpine is adjacent to QEMU, Alpine Linux, Docker, Incus, and LXD. Its
      documentation explicitly names containerization technologies as a reason to run
      tiny Alpine VM environments on macOS.
  sources:
    - https://beringresearch.github.io/macpine/
    - https://github.com/beringresearch/macpine
    - source_facts.package-manager
  summary:
    - >
      macpine is a macOS command-line tool for creating and managing lightweight Alpine
      Linux virtual machines. Its official documentation presents it as a way for macOS
      users to run small Linux environments with port forwarding, file sharing, bridged
      networking, and both aarch64 and x86_64 emulation.
  timeline:
    - 'Public repository: Official GitHub repository tracks the project and its release tags.'
    - '2025: GitHub repository page lists v1.1.5 as the latest release on Oct 31, 2025.'
  usage:
    - >
      The installed command is `alpine`. Common workflows include `alpine launch` to
      create a VM, architecture and resource flags for customized instances, `alpine
      ssh` and `alpine exec` to enter or run commands, and `alpine publish` and `alpine
      import` for instance archive sharing.
related-packages:
  - id: brew:lima
    reason: >
      Choose Lima for general-purpose Linux virtual machines with automatic file sharing
      and port forwarding; choose macpine when an Alpine-focused workflow and its
      `alpine` lifecycle commands are preferable.
    rel: alternative
    sources:
      - https://beringresearch.github.io/macpine/
      - https://lima-vm.io/
  - id: brew:colima
    reason: >
      Choose Colima when the main goal is a ready-to-use Docker, containerd, Kubernetes,
      or Incus runtime; macpine is oriented toward directly managed Alpine VM instances.
    rel: alternative
    sources:
      - https://beringresearch.github.io/macpine/
      - https://colima.run/
  - id: brew:qemu
    reason: >
      QEMU is macpine's documented virtualization dependency and is the lower-level
      choice when users need machine or architecture options beyond macpine's
      Alpine-specific abstraction.
    rel: adjacent_workflow
    sources:
      - https://beringresearch.github.io/macpine/install/
      - https://www.qemu.org/
category: cloud-infrastructure
package-manager:
  apk: alpine
  brew: macpine
  debian: alpine
  dnf: alpine
  macports: macpine
  nix: alpine
  ubuntu: alpine
  zypper: alpine
package-manager-url: https://formulae.brew.sh/formula/macpine
license: Apache-2.0
tags:
  - cli
  - linux-vm
  - macos
  - virtualization
description: Lightweight Linux VMs on MacOS
executables:
  - alpine
provenance:
  formula: macpine
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
