id: brew:latino
display-name: Latino
homepage: https://www.lenguajelatino.org/
repo: https://github.com/lenguaje-latino/latino
docs:
  - https://manual.lenguajelatino.org/en/stable
  - https://manual.lenguajelatino.org/es/stable
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Latino's adoption story is educational and community-oriented. Its manual says
      Hispanic users around the world have supported, popularized, and contributed to
      the source code, while Homebrew packaging made the interpreter available to macOS
      and Linux users through a mainstream developer package manager.
  package-nerd-significance:
    - >
      Latino is notable in package catalogs as a non-English-based programming language
      with an explicitly educational mission. It is a reminder that language runtimes
      are not only about performance or industrial adoption; sometimes the packaging
      value is making a culturally specific learning tool installable with the same
      command used for mainstream compilers and interpreters.
  project-history:
    - >
      The official manual describes Latino as starting in 2015 and frames it as a fully
      functional language with Spanish syntax. The GitHub README says the project was
      created from the need to increase basic and advanced computer-science education so
      children, teenagers, and adults could be motivated to build applications in syntax
      closer to their own language.
    - >
      The repository's tagged history includes v1.0 work dated 2017-05-22 and v1.4.4
      work dated 2024-11-09. The project organization also separates related pieces such
      as latino-Core, reflecting an ecosystem around the language rather than a single
      throwaway interpreter.
  related-projects:
    - >
      Related projects and influences include Python, Lua, the lenguaje-latino GitHub
      organization, and latino-Core.
  sources:
    - https://formulae.brew.sh/formula/latino
    - https://github.com/lenguaje-latino
    - https://github.com/lenguaje-latino/latino
    - https://manual.lenguajelatino.org/en/latest/About-Latino.html
    - https://manual.lenguajelatino.org/en/stable
    - https://manual.lenguajelatino.org/es/stable
  summary:
    - >
      Latino is an open-source programming language and interpreter with Spanish syntax.
      It is written in C, influenced by Python and Lua, and aimed at Spanish-speaking
      learners and developers who want programming constructs expressed closer to their
      natural language.
  timeline:
    - '2015: Official manual says Latino started as a Spanish-syntax programming language.'
    - '2017: v1.0 tagged commit dated 2017-05-22.'
    - '2024: v1.4.4 tagged commit dated 2024-11-09.'
  usage:
    - >
      The manual positions Latino for web development on the server side, database
      connectivity, mathematics, and system scripting. In package-manager terms, the
      brew formula primarily installs the latino executable for running programs written
      in the language.
related-packages: []
