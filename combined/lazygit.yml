id: brew:lazygit
display-name: lazygit
homepage: https://github.com/jesseduffield/lazygit/
repo: https://github.com/jesseduffield/lazygit
docs:
  - https://github.com/jesseduffield/lazygit#readme
config-file-location:
  linux:
    - ~/.config/lazygit/config.yml
    - <repo>/.git/lazygit.yml
    - .lazygit.yml in a parent directory
  macos:
    - ~/Library/Application Support/lazygit/config.yml
    - <repo>/.git/lazygit.yml
    - .lazygit.yml in a parent directory
  windows:
    - '%LOCALAPPDATA%\lazygit\config.yml'
    - '%APPDATA%\lazygit\config.yml'
    - <repo>\.git\lazygit.yml
    - .lazygit.yml in a parent directory
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents broad packaging coverage: Homebrew, MacPorts, Scoop, Arch,
      Fedora/RHEL-derived distributions, Solus, Debian/Ubuntu, Gentoo, openSUSE, NixOS,
      FreeBSD, Termux, Conda, Go, Chocolatey, Winget, and manual binaries. GitHub
      repository metadata recorded 79,894 stars on July 1, 2026, and the README included
      a large sponsor list, download badges, and active contributor links.
  package-nerd-significance:
    - >
      lazygit matters because it changed expectations for package-installed Git helpers.
      Instead of another alias collection or shell prompt plugin, it ships as a single
      binary that can be installed from nearly every package ecosystem and used
      immediately in any repository.
  project-history:
    - >
      The public GitHub repository was created on May 19, 2018. Early release artifacts
      include v0.1.4 on August 7, 2018; the project later reached v0.20 in April 2020,
      v0.50.0 in January 2025, and v0.62.2 on June 4, 2026.
  related-projects:
    - >
      Git is the underlying version-control system. lazydocker is Jesse Duffield's
      sibling TUI for Docker workflows, and both projects helped popularize the `lazy*`
      naming pattern for focused terminal interfaces.
  sources:
    - https://api.github.com/repos/jesseduffield/lazygit
    - https://api.github.com/repos/jesseduffield/lazygit/releases
    - https://git-scm.com
    - https://github.com/jesseduffield/lazydocker
    - https://github.com/jesseduffield/lazygit
  summary:
    - >
      lazygit is a widely adopted terminal UI for Git, written in Go by Jesse Duffield.
      It became one of the defining examples of a modern developer TUI: a
      package-manager-friendly binary that wraps a complex command-line tool in a
      discoverable keyboard interface.
  timeline:
    - '2018: Public GitHub repository created'
    - '2018: v0.1.4 release published'
    - '2020: v0.20 release published'
    - '2025: v0.50.0 release published'
    - '2026: v0.62.2 release published'
  usage:
    - >
      lazygit focuses on everyday Git actions that are powerful but awkward at the raw
      CLI: staging individual lines, interactive rebase, cherry-pick, bisect, worktrees,
      commit graph navigation, custom commands, undo and redo through reflog-backed
      operations, and repository-local configuration.
related-packages:
  - id: brew:git
    reason: >
      Install Git as the underlying version-control engine whose repositories and
      commands lazygit operates on.
    rel: adjacent_workflow
    sources:
      - https://github.com/jesseduffield/lazygit#readme
      - https://git-scm.com/docs
  - id: brew:gitui
    reason: >
      Choose GitUI when you want an alternative Rust-based Git TUI focused on fast,
      asynchronous terminal interaction.
    rel: alternative
    sources:
      - https://github.com/jesseduffield/lazygit#alternatives
      - https://github.com/gitui-org/gitui#readme
  - id: brew:tig
    reason: >
      Choose Tig when your priority is a compact text-mode browser for Git history and
      diffs rather than lazygit's broader mutation workflows.
    rel: alternative
    sources:
      - https://github.com/jesseduffield/lazygit#alternatives
      - https://jonas.github.io/tig/
category: developer-tools
package-manager:
  apk: lazygit
  brew: lazygit
  chocolatey: lazygit
  debian: lazygit
  macports: lazygit
  nix: lazygit
  pacman: lazygit
  scoop: extras/lazygit
  winget: JesseDuffield.lazygit
  zypper: lazygit
package-manager-url: https://formulae.brew.sh/formula/lazygit
license: MIT
tags:
  - cli
  - developer-tools
  - git
  - terminal-ui
  - version-control
description: Simple terminal UI for git commands
executables:
  - lazygit
provenance:
  formula: lazygit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
