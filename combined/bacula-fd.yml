id: brew:bacula-fd
display-name: Bacula File Daemon
homepage: https://www.bacula.org/
repo: https://gitlab.bacula.org/bacula-community-edition/bacula-community
docs:
  - https://www.bacula.org/documentation/documentation
  - https://www.bacula.org/15.0.x-manuals/en/main/Customizing_Configuration_F.html
config-file-location:
  unix: bacula-fd.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The Bacula site compares it to simpler tools such as tar and dump and to
      commercial packages such as Legato Networker, ARCserveIT, Arkeia, and
      PerfectBackup+, which places its adoption story in the system-administration world
      of scheduled network backups, tape and disk media, catalogs, and centralized
      restore workflows.
    - >
      The batch metadata shows bacula-fd available through Homebrew, Debian, Ubuntu,
      Fedora-family packaging as bacula-client, Alpine, MacPorts, and Nix. That
      cross-distribution packaging reflects the practical need to install the file
      daemon on many client machines, even when the Director and Storage services live
      elsewhere.
  package-nerd-significance:
    - >
      bacula-fd is a classic packaging split: the package manager exposes one daemon
      from a larger distributed system because users often need the client component
      without installing the full backup server. That makes it important for fleet
      configuration, service management, and reproducible backup-agent deployment.
    - >
      It also represents the older Unix daemon style of operational software:
      configuration files, long-running services, SQL-backed catalogs, and networked
      components rather than a single stateless CLI.
  project-history:
    - >
      Bacula is described by its official site as a set of programs for backup,
      recovery, and verification across networks of different kinds of computers. The
      File service, also called the Client program or File daemon, is installed on the
      machine to be backed up and supplies file attributes and data to the Director
      during backup and restore.
    - >
      The official documentation presents Bacula as a modular client/server backup
      system made of Director, Console, File, Storage, Catalog, and Monitor services.
      That architecture gave Bacula a role similar to commercial network backup suites
      while remaining free software and packageable for Unix-like systems.
    - >
      Bacula's public distribution history is visible through official download links to
      SourceForge and through the Bacula Community Edition GitLab repository. The
      official site continues to publish manuals for the 15.0.x series and release
      artifacts such as 15.0.3 on SourceForge in 2025.
  related-projects:
    - >
      The File daemon is related to Bacula Director, Storage daemon, Console, Catalog,
      and Monitor components.
    - >
      Comparable backup tools and suites mentioned in Bacula's own documentation include
      tar, dump, Legato Networker, ARCserveIT, Arkeia, and PerfectBackup+.
  sources:
    - https://gitlab.bacula.org/bacula-community-edition/bacula-community
    - https://sourceforge.net/projects/bacula/files/bacula/
    - https://www.bacula.org/documentation/documentation/
    - https://www.bacula.org/what-is-bacula/
    - source_facts.package-manager
  summary:
    - >
      Bacula File Daemon is the client-side daemon from the Bacula network backup
      system. In Homebrew it is packaged as bacula-fd, emphasizing the component
      installed on machines being backed up rather than the full Director, Storage
      daemon, catalog, and console stack.
  timeline:
    - >
      2017: Bacula official 'What is Bacula?' page published, describing the modular
      backup system and File daemon role.
    - '2022: Bacula Community Edition GitLab project created.'
    - >
      2025: Bacula 15.0.3 source and documentation artifacts published through the
      official SourceForge download area.
    - '2026: Official manuals page continued to list the 15.0.x documentation series.'
  usage:
    - >
      bacula-fd is configured with bacula-fd.conf and runs as a daemon on each client
      machine. It talks to the Bacula Director, sends file metadata and contents during
      backup jobs, and participates in restoring file attributes and data during
      recovery.
    - >
      Unlike one-shot archive tools, Bacula expects an administrator to define
      resources, jobs, clients, storage, schedules, and catalog settings. The file
      daemon package matters because it is the small install footprint needed on
      protected hosts.
related-packages:
  - id: brew:gnu-tar
    reason: >
      Choose GNU tar for direct archive creation or straightforward full and incremental
      filesystem backups; choose Bacula when centralized scheduling, network clients,
      storage services, and a searchable catalog are required.
    rel: alternative
    sources:
      - https://www.bacula.org/what-is-bacula/
      - https://www.gnu.org/software/tar/manual/tar.html
category: system
package-manager:
  apk: bacula
  brew: bacula-fd
  debian: bacula-fd
  dnf: bacula-client
  macports: bacula
  nix: bacula
  ubuntu: bacula-fd
package-manager-url: https://formulae.brew.sh/formula/bacula-fd
license: AGPL-3.0-only WITH openvpn-openssl-exception
