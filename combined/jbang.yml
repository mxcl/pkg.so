id: brew:jbang
display-name: JBang
homepage: https://jbang.dev/
repo: https://github.com/jbangdev/jbang
docs:
  - https://www.jbang.dev/documentation/guide/latest
config-file-location:
  unix:
    - ~/.jbang/
    - jbang-catalog.json
    - .jbang/jbang-catalog.json
credentials-file-location: null
history:
  adoption-history:
    - >
      JBang spread through Java developer tooling channels rather than through one
      application framework: the official README lists SDKMAN, Homebrew, Chocolatey, and
      Scoop installs, and the FAQ links to talks, articles, podcasts, and
      Quarkus-related presentations. The package metadata in the input also shows
      Homebrew, Chocolatey, Nix, and Scoop coverage.
  package-nerd-significance:
    - >
      JBang is package-nerd significant because it treats Maven Central as a scripting
      package universe. It reduces the gap between one-file scripts and full JVM
      applications, giving Java a workflow closer to Python, shell, or Node command
      snippets while keeping Java libraries, IDEs, and GraalVM in play.
  project-history:
    - >
      The JBang FAQ says Max Rydahl Andersen came to the idea while exploring Java 10
      shebang support and the Kotlin kscript project, asking why the same style could
      not be done with Java. The FAQ says JBang was released in December 2019.
    - >
      The repository README frames JBang as a way to run .java files directly, declare
      Maven dependencies with //DEPS, work with Java, Kotlin, Groovy, JShell, and
      Markdown, open scripts in IDEs, build native binaries with GraalVM, and share
      scripts through GitHub URLs, aliases, and catalogs.
  related-projects:
    - >
      JBang is related to Java 10 single-file source execution, kscript, Maven Central,
      SDKMAN, Chocolatey, Scoop, GraalVM native-image, Quarkus command-line workflows,
      JShell, Groovy, Kotlin, and Java build tools such as Maven and Gradle.
  sources:
    - https://github.com/jbangdev/jbang
    - https://github.com/jbangdev/jbang/releases
    - https://www.jbang.dev/documentation/guide/latest
    - https://www.jbang.dev/documentation/jbang/latest/faq.html
    - source_facts.package-manager
  summary:
    - >
      JBang is a command-line tool for writing, running, editing, sharing, and
      installing source-only Java programs without creating a traditional Maven or
      Gradle project first. It brings shebang-style scripting, dependency directives,
      catalog aliases, and IDE integration to Java.
  timeline:
    - '2019: JBang is released in December, according to the FAQ.'
    - '2021: JBang documentation is built with Antora and published under jbang.dev.'
    - >
      2020s: JBang adds catalog aliases, app installation, IDE integration, multiple
      source languages, and native-image workflows.
    - >
      2026: The repository release notes document a CLI parser migration from picocli to
      Aesh and early-access native binary distribution work.
  usage:
    - >
      A common JBang script starts with a comment-form shebang line, uses directives
      such as //DEPS and //JAVA, and runs with the jbang command. Users can also
      initialize templates, edit generated IDE projects, install commands as apps, run
      remote scripts, manage aliases and catalogs, and export scripts toward richer
      project or native-image forms.
related-packages:
  - id: brew:openjdk
    reason: >
      OpenJDK provides the Java runtime and compiler used for JBang scripts when a
      suitable JDK is already installed instead of letting JBang provision one
      automatically.
    rel: adjacent_workflow
    sources:
      - https://www.jbang.dev/documentation/jbang/latest/index.html
      - https://openjdk.org/
  - id: brew:graalvm
    reason: >
      GraalVM complements JBang when exporting eligible Java scripts as native
      executables with faster startup and no separate JVM launch.
    rel: adjacent_workflow
    sources:
      - https://www.jbang.dev/documentation/jbang/latest/exporting.html
      - https://www.graalvm.org/latest/reference-manual/native-image/
category: developer-tools
package-manager:
  brew: jbang
  chocolatey: jbang
  nix: jbang
  scoop: main/jbang
package-manager-url: https://formulae.brew.sh/formula/jbang
license: MIT
tags:
  - cli
  - developer-tool
  - java
  - scripting
description: Tool to create, edit and run self-contained source-only Java programs
executables:
  - jbang
provenance:
  formula: jbang
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
