id: brew:stlink
display-name: stlink
homepage: https://github.com/stlink-org/stlink
repo: https://github.com/stlink-org/stlink
docs:
  - https://github.com/stlink-org/stlink#readme
config-file-location:
  linux: /lib/udev/rules.d/49-stlinkv2-1.rules
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents package-repository installation for Linux and Unix systems
      and lists Windows binaries on GitHub releases. The input package data shows
      distribution across Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Scoop, Ubuntu,
      and openSUSE-related package managers.
  package-nerd-significance:
    - >
      For package maintainers and embedded developers, stlink is a hardware-adjacent
      package where udev rules, libusb compatibility, OS support, and release packaging
      matter. It turns a common microcontroller workflow into standard package-manager
      install plus shell commands.
  project-history:
    - >
      The official README describes stlink as an open source version of the
      STMicroelectronics STLINK tools and an open source toolset to program and debug
      STM32 devices and boards. The GitHub repository was created in 2011 and continues
      to track support for multiple ST-LINK hardware generations.
  related-projects:
    - STMicroelectronics STM32 boards and ST-LINK adapters are the hardware target.
    - GDB connects through st-util for debugging.
    - >
      Cortex-Debug is named by the README as a Visual Studio Code/VSCodium integration
      for st-util.
  sources:
    - https://api.github.com/repos/stlink-org/stlink
    - https://github.com/stlink-org/stlink#readme
    - https://github.com/stlink-org/stlink/releases
    - source_facts.package-manager
  summary:
    - >
      stlink is an open source command-line toolset for programming and debugging STM32
      microcontrollers through ST-LINK adapters. It is important in package-manager
      culture because it gives Unix-like systems a readily installable path to flash and
      debug common embedded boards.
  timeline:
    - '2011: The stlink-org/stlink GitHub repository was created.'
    - >
      2019: The README marks STLINK/V1 obsolete as of 2019-11-21 while continuing
      support in the toolset.
    - '2020: Release v1.6.1 restored standalone Windows binaries according to the README.'
    - '2024: Release v1.8.0 dropped macOS support according to the README and release notes.'
  usage:
    - >
      The toolset includes st-info for programmer and chip information, st-flash for
      flash manipulation, st-trace for execution logging, st-util as a GDB server, a
      communication library, and an optional GUI. It supports STLINK/V1, V2, V2-1, and
      V3 families, including clones.
category: developer-tools
package-manager:
  apk: stlink
  brew: stlink
  debian: libstlink-dev
  dnf: stlink
  macports: stlink
  nix: stlink
  pacman: stlink
  scoop: main/stlink
  ubuntu: libstlink-dev
  zypper: libstlink1
package-manager-url: https://formulae.brew.sh/formula/stlink
license: BSD-3-Clause
tags:
  - cli
  - debugging
  - embedded
  - firmware-flashing
  - gdb-server
  - st-link
  - stm32
description: STM32 discovery line Linux programmer
executables:
  - st-flash
  - st-info
  - st-trace
  - st-util
provenance:
  formula: stlink
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
