id: brew:mruby
display-name: mruby
homepage: https://mruby.org/
repo: https://github.com/mruby/mruby
docs:
  - https://mruby.org/docs
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The toolchain is deliberately small and embeddable. It provides the mruby
      interpreter, the mirb interactive shell, and mrbc, a compiler that emits mruby
      bytecode and can generate bytecode as a C source file. The GitHub README describes
      linking mruby into C or C++ applications, using the bin tools as examples, and
      customizing builds with mrbgems.
  sources:
    - https://formulae.brew.sh/formula/mruby
    - https://github.com/mruby/mruby
    - https://mruby.org/
    - https://mruby.org/about/
  summary:
    - >
      mruby is a lightweight, embeddable implementation of Ruby associated with Ruby
      creator Yukihiro Matsumoto and the mruby contributors. The official site describes
      it as complying with part of the ISO/IEC 30170 Ruby specification and designed to
      be linked into applications where MRI Ruby is too heavy. The project also
      acknowledges sponsorship by Japan's Ministry of Economy, Trade and Industry
      Regional Innovation Creation R&D Programs.
  usage:
    - >
      mruby's ecosystem role differs from the main Ruby implementation. It targets
      constrained environments, native applications, firmware-like embeddings, and
      products that want Ruby syntax without shipping a full MRI runtime. The release
      history on the official site records 1.0.0 in February 2014 and later 2.x, 3.x,
      and 4.x lines, reflecting a long-running compatibility and maintenance effort.
      Package managers expose the command-line tools and development library for
      developers embedding Ruby behavior or compiling scripts into bytecode.
related-packages:
  - id: brew:ruby
    reason: >
      Choose Ruby for the mainstream general-purpose runtime and ecosystem; choose mruby
      when the interpreter must be embedded in a native application or fit a constrained
      environment.
    rel: alternative
    sources:
      - https://mruby.org/about/
      - https://www.ruby-lang.org/en/about/
category: language-runtime
package-manager:
  apk: mruby
  brew: mruby
  debian: libmruby-dev
  macports: mruby
  nix: mruby
  pacman: mruby
  ubuntu: libmruby-dev
  zypper: libmruby3_4_0
package-manager-url: https://formulae.brew.sh/formula/mruby
license: MIT
tags:
  - cli
  - embedded
  - interpreter
  - language-runtime
  - lightweight
  - ruby
description: Lightweight implementation of the Ruby language
executables:
