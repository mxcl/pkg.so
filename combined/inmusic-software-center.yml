credentials-file-location: null
history:
  adoption-history:
    - >
      inMusic positioned the Software Center as a shared delivery and administration hub
      across its family of music-technology brands. Official workflows cover hardware
      registration, bundled-software redemption, applications, expansions, drivers,
      firmware, and software activation.
  package-nerd-significance:
    - >
      The application centralizes several jobs that were historically split among
      product-registration sites, vendor download pages, standalone installers, and
      license managers. Package-manager users care about keeping the desktop client
      installed while allowing it to manage vendor-controlled payloads and authorization
      state.
  project-history:
    - >
      inMusic developed the Software Center to simplify registration, installation,
      activation, and updating for creative software and supported hardware. AIR Music
      Technology's documentation shows it replacing or supplementing older iLok-oriented
      workflows for newer releases of several products.
  related-projects:
    - >
      AIR Music Technology, Akai Professional, Alesis, M-Audio, HeadRush, MPC software,
      and legacy iLok-authorized products participate in related inMusic registration or
      delivery workflows.
  sources:
    - >
      https://support.airmusictech.com/support/solutions/articles/69000818519-installing-and-activating-your-air-plugins
    - >
      https://support.airmusictech.com/support/solutions/articles/69000873340-air-music-tech-classic-title-2025-updates
    - >
      https://support.airmusictech.com/support/solutions/articles/69000878383-inmusic-software-center%EF%BD%9Cinmusic%E3%83%8F%E3%83%BC%E3%83%89%E3%82%A6%E3%82%A7%E3%82%A2%E3%81%AB%E4%BB%98%E5%B1%9E%E3%81%99%E3%82%8B%E3%82%BD%E3%83%95%E3%83%88%E3%82%A6%E3%82%A7%E3%82%A2%E3%81%AE%E5%BC%95%E3%81%8D%E6%8F%9B%E3%81%88%E6%96%B9%E6%B3%95
    - https://www.airmusictech.com/downloads/
  summary:
    - >
      inMusic Software Center is inMusic's desktop administration application for
      registering supported hardware and downloading, installing, activating, redeeming,
      and updating creative software, drivers, firmware, and expansions.
  timeline:
    - >
      2025: AIR's Classic Title updates adopted inMusic Software Center authorization in
      place of newly issued iLok codes for those releases.
    - >
      2026: Official hardware-redemption guidance documented the Software Center as the
      hub for software, expansions, drivers, and firmware.
  usage:
    - >
      Users sign in with an inMusic Profile, register hardware or add a product, redeem
      bundled entitlements, and install available software from the relevant Software
      Center tabs. The client also exposes update and activation workflows and permits
      selection of a download location.
