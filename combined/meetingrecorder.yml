history:
  adoption-history:
    - >
      The official site describes MeetingRecorder as currently in early release, with a
      free tier and a future Pro tier. Reliable long-term adoption history is not yet
      available.
  package-nerd-significance:
    - >
      The application is a small native menu-bar alternative to bot-based meeting
      recorders. Its package appeal lies in local recording, no mandatory account,
      offline capture, and an explicit user-selected storage folder.
  project-history:
    - >
      MeetingRecorder is an early-release native macOS application focused on capturing
      microphone and system audio without adding a bot to calls. Its official update
      repository publishes signed application release assets and concise release notes.
  related-projects:
    - >
      It is designed to capture calls from Zoom, Microsoft Teams, Google Meet, Slack,
      FaceTime, webinars, and other applications producing Mac system audio.
  sources:
    - https://github.com/emishin/meetingrecorder-updates/releases
    - https://meetingsrecorder.com/
  summary:
    - >
      MeetingRecorder is a native macOS menu-bar application that records microphone and
      system audio locally, then optionally produces transcripts and AI summaries.
  timeline:
    - '2026: The official site characterized MeetingRecorder as an early-release application.'
    - '2026: Version 1.6.3 was published through the official update repository.'
  usage:
    - >
      Users start recording from the menu bar or a call-detection prompt, capture
      microphone and system audio together or separately, and save recordings in a
      chosen local folder. Transcription and summarization are optional; recording
      itself works offline.
