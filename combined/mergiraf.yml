id: brew:mergiraf
display-name: Mergiraf
homepage: https://mergiraf.org
repo: https://codeberg.org/mergiraf/mergiraf
docs:
  - https://mergiraf.org/
  - https://mergiraf.org/installation.html
  - https://mergiraf.org/usage.html
config-file-location:
  unix: ~/.config/git/config
credentials-file-location: null
history:
  project-history:
    - >
      The tool integrates through Git's custom merge-driver mechanism and can also be
      run after a conflict with `mergiraf solve`. Its documentation emphasizes
      conservative behavior: unresolved or suspicious cases keep conflict markers, while
      automatically solved cases can be reviewed with `mergiraf review` and reported
      with `mergiraf report`. It also supports Jujutsu workflows through `jj resolve
      --tool mergiraf`.
  sources:
    - https://antonin.delpeuch.eu/posts/mergiraf-a-syntax-aware-merge-driver-for-git/
    - https://formulae.brew.sh/formula/mergiraf
    - https://mergiraf.org/
    - https://mergiraf.org/installation.html
    - https://mergiraf.org/languages.html
    - https://mergiraf.org/usage.html
  summary:
    - >
      Mergiraf is a syntax-aware merge driver for Git created by Antonin Delpeuch after
      exploring the limitations of line-based merge conflict resolution and earlier
      structured-merge prototypes. The project positions itself as a practical merge
      driver for daily version-control workflows: Git still performs ordinary line-based
      merges where they succeed, while Mergiraf uses syntax trees and language-specific
      knowledge when a line-based conflict can be resolved structurally.
  usage:
    - >
      Mergiraf's ecosystem role is adjacent to tools like Difftastic: it applies tree
      awareness to version-control conflicts rather than only to human-readable diffs.
      Its supported-language list spans common programming languages such as C/C++, Go,
      Java, JavaScript, Python, Rust, TypeScript, and structured formats such as JSON,
      TOML, YAML, XML, `go.mod`, and requirements files. Package managers distribute it
      as a developer-tool CLI that teams can opt into globally or per repository through
      Git attributes.
related-packages:
  - id: brew:difftastic
    reason: >
      Difftastic complements Mergiraf by showing syntax-aware human-readable diffs, and
      Mergiraf's installation guide explicitly recommends using the two together.
    rel: adjacent_workflow
    sources:
      - https://mergiraf.org/installation.html
      - https://difftastic.wilfred.me.uk/
  - id: brew:jj
    reason: >
      Jujutsu users can keep their Git-compatible workflow and invoke Mergiraf directly
      with `jj resolve --tool mergiraf` for syntax-aware conflict resolution.
    rel: adjacent_workflow
    sources:
      - https://mergiraf.org/usage.html
      - https://github.com/jj-vcs/jj#readme
category: developer-tools
package-manager:
  apk: mergiraf
  brew: mergiraf
  macports: mergiraf
  nix: mergiraf
  pacman: mergiraf
  scoop: main/mergiraf
  winget: Mergiraf.Mergiraf
  zypper: mergiraf
package-manager-url: https://formulae.brew.sh/formula/mergiraf
license: GPL-3.0-only
tags:
  - cli
  - git
  - merge-driver
  - rust
  - syntax-aware
description: Syntax-aware git merge driver
executables:
  - mergiraf
provenance:
  formula: mergiraf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
