id: brew:cargo-outdated
display-name: cargo-outdated
homepage: https://github.com/kbknapp/cargo-outdated
repo: https://github.com/kbknapp/cargo-outdated
docs:
  - https://github.com/kbknapp/cargo-outdated#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The crate is distributed through crates.io and has also been packaged by multiple
      operating-system package managers, including Homebrew, Debian, Ubuntu, Alpine,
      Arch, and Nix according to the batch source facts. crates.io metadata lists it
      under development-tools and cargo-plugin categories.
  package-nerd-significance:
    - >
      It is one of the older Rust ecosystem tools for auditing dependency freshness
      without immediately changing the project lockfile, making it useful to maintainers
      who want npm-outdated-style visibility in Cargo workflows.
  project-history:
    - >
      The project was created on GitHub in August 2015 and first published to crates.io
      as version 0.1.1 in November 2015. Its README describes the core approach as
      creating a temporary workspace, running Cargo's built-in cargo update machinery,
      and comparing dependency trees.
  related-projects:
    - Cargo's cargo update command is central to cargo-outdated's implementation.
    - cargo-binstall is documented by the README as a way to install prebuilt versions.
  sources:
    - https://api.github.com/repos/kbknapp/cargo-outdated
    - https://github.com/kbknapp/cargo-outdated
    - https://github.com/kbknapp/cargo-outdated#readme
    - https://crates.io/api/v1/crates/cargo-outdated
    - https://formulae.brew.sh/api/formula/cargo-outdated.json
  summary:
    - >
      cargo-outdated is a Cargo subcommand that reports when Rust project dependencies
      have newer compatible or latest versions available.
  timeline:
    - '2015: GitHub repository created and first crates.io release published.'
    - '2024: v0.15.0 release published on GitHub.'
    - '2026: crates.io reported v0.19.0 as the latest release.'
  usage:
    - >
      Users install it as cargo-outdated and run cargo outdated from a project
      directory. The README documents list and JSON output, workspace checking,
      dependency ignore and exclusion options, manifest-path support, and an exit-code
      option for automation.
related-packages:
  - id: brew:cargo-edit
    reason: >
      Use cargo-outdated to identify stale dependencies, then cargo-edit's `cargo
      upgrade` to update their version requirements in `Cargo.toml`.
    rel: adjacent_workflow
    sources:
      - https://github.com/kbknapp/cargo-outdated#readme
      - https://github.com/killercup/cargo-edit#readme
category: developer-tools
package-manager:
  apk: cargo-outdated
  brew: cargo-outdated
  debian: cargo-outdated
  nix: cargo-outdated
  pacman: cargo-outdated
  ubuntu: cargo-outdated
package-manager-url: https://formulae.brew.sh/formula/cargo-outdated
license: MIT
tags:
  - cargo
  - cli
  - dependencies
  - package-management
  - rust
  - updates
description: Cargo subcommand for displaying when Rust dependencies are out of date
executables:
  - cargo-outdated
provenance:
  formula: cargo-outdated
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
