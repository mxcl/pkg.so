id: brew:luarocks
display-name: LuaRocks
homepage: https://luarocks.org/
repo: https://github.com/luarocks/luarocks
docs:
  - https://luarocks.org/docs
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/luarocks/upload_config.lua
    - ~/.config/luarocks/upload_config.lua
    - ~/.luarocks/upload_config.lua
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/luarocks/upload_config.lua
    - ~/.config/luarocks/upload_config.lua
    - ~/.luarocks/upload_config.lua
history:
  adoption-history:
    - >
      LuaRocks became the default package-distribution culture for much of Lua outside
      application-specific ecosystems. The official site surfaces recent modules,
      labels, weekly download counts, root manifests, custom manifests, mirrors, and
      upload flows, showing that LuaRocks is both a CLI and the central package index.
    - >
      The input metadata shows broad OS package coverage: LuaRocks is available through
      Homebrew, MacPorts, Debian, Ubuntu, Fedora, Alpine, Arch, Nix, Scoop, and
      Chocolatey. That matters because Lua projects often need LuaRocks before they can
      install testing tools, web frameworks, OpenResty libraries, or native-binding
      modules.
  package-nerd-significance:
    - >
      LuaRocks is central package-nerd infrastructure for Lua because it defines the
      names, versions, build metadata, binary/source artifact formats, and repository
      manifests that other tools consume. It is the closest analogue to npm, RubyGems,
      or CPAN for Lua, but with Lua-specific details such as Lua-version-specific trees
      and native module paths.
    - >
      It is also historically important because it works across stock Lua and LuaJIT
      ecosystems. That cross-runtime support, plus package-manager availability on Unix
      and Windows, made it the practical bootstrap path for Lua dependency management.
  project-history:
    - >
      The LuaRocks project describes itself as the package manager for the Lua
      programming language. Its repository README and wiki say it installs modules as
      self-contained packages called rocks and supports local and remote repositories
      plus multiple local rocks trees.
    - >
      LuaRocks' documentation centers on the rockspec: a Lua metadata file that tells
      the tool how to fetch, build, and install a package. This design made LuaRocks
      both a package installer and a lightweight build/publishing convention for Lua
      modules, including modules with native C extensions.
  related-projects:
    - Lua is the language ecosystem LuaRocks packages target.
    - LuaJIT is a common LuaRocks runtime target and package dependency.
    - OpenResty libraries such as lua-resty modules are commonly distributed through LuaRocks.
  sources:
    - https://github.com/luarocks/luarocks
    - https://github.com/luarocks/luarocks/blob/main/docs/config_file_format.md
    - https://github.com/luarocks/luarocks/blob/main/docs/creating_a_rock.md
    - https://github.com/luarocks/luarocks/blob/main/docs/luarocks.md
    - https://luarocks.org/
    - https://luarocks.org/docs
    - source_facts.package-manager
  summary:
    - >
      LuaRocks is the package manager and public package repository system for Lua
      modules. It introduced the rockspec-centered workflow that lets Lua packages
      declare metadata, dependencies, sources, and build rules in Lua.
  timeline:
    - "2000s: LuaRocks emerges as Lua's rockspec-based package manager."
    - >
      2010s: Development and distribution consolidate around the GitHub repository and
      luarocks.org.
    - '2020s: Documentation moves from the GitHub wiki into the repository docs folder.'
    - '2026: GitHub lists LuaRocks 3.13.0 as the latest release, dated Jan 28, 2026.'
  usage:
    - >
      The command-line interface is luarocks. It supports installing, building, packing,
      uploading, searching, showing, removing, testing, and configuring rocks, and can
      operate against selected servers, trees, and dependency modes.
    - >
      Package authors write a rockspec, tag or publish their source, and submit or
      upload the rockspec. LuaRocks can build from source, make from a local checkout,
      pack source or binary rocks, and publish artifacts that users install without
      needing the original source-control tool.
related-packages:
  - id: brew:lua
    reason: >
      LuaRocks installs modules into Lua-version-specific trees for use by the Lua
      interpreter, making stock Lua its foundational runtime companion.
    rel: adjacent_workflow
    sources:
      - https://github.com/luarocks/luarocks#readme
      - https://www.lua.org/manual/
  - id: brew:luajit
    reason: >
      LuaJIT is a common LuaRocks runtime target for Lua 5.1-compatible modules and
      packages that use LuaJIT's FFI.
    rel: adjacent_workflow
    sources:
      - https://github.com/luarocks/luarocks#readme
      - https://luajit.org/extensions.html
  - id: brew:busted
    reason: >
      Busted officially recommends installation through LuaRocks and can run package
      test suites across Lua and LuaJIT runtimes.
    rel: adjacent_workflow
    sources:
      - https://lunarmodules.github.io/busted/
      - https://luarocks.org/docs
  - id: brew:luacheck
    reason: >
      Luacheck is distributed as a rock, so LuaRocks can install the linter alongside a
      project's other Lua development dependencies.
    rel: adjacent_workflow
    sources:
      - https://github.com/lunarmodules/luacheck#installation
      - https://luarocks.org/docs
category: developer-tools
