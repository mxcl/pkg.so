id: brew:neo4j-mcp
display-name: Neo4j MCP
homepage: https://neo4j.com/docs/mcp/current/
repo: https://github.com/neo4j/mcp
docs:
  - https://neo4j.com/docs/mcp/current
  - https://github.com/neo4j/mcp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is early and strongly tied to AI-agent workflows rather than traditional
      database administration. The repository API showed 267 stars and 54 forks on the
      2026-07-01 request. The Homebrew formula API snapshot generated on 2026-07-01
      reported 472 installs over 365 days and 53 installs over 30 days.
  package-nerd-significance:
    - >
      The package is significant less as a standalone CLI and more as a marker that
      graph databases joined the MCP tool ecosystem quickly. Its interesting operational
      detail is permissioning: read-only Cypher can be enabled for safer exploration,
      while write-Cypher is gated by configuration.
  project-history:
    - >
      The package belongs to the post-MCP wave of database tooling. Neo4j's developer
      guide dates Anthropic's introduction of Model Context Protocol to November 2024,
      and the neo4j/mcp GitHub repository was created on 2025-08-20. Its release stream
      had reached v1.5.3 by 2026-06-11.
  related-projects:
    - Neo4j
    - Model Context Protocol
    - Cypher
    - Neo4j Graph Data Science
    - APOC
  sources:
    - https://api.github.com/repos/neo4j/mcp
    - https://api.github.com/repos/neo4j/mcp/releases?per_page=10
    - https://formulae.brew.sh/api/formula/neo4j-mcp.json
    - https://github.com/neo4j/mcp
    - https://neo4j.com/developer/genai-ecosystem/model-context-protocol-mcp/
    - https://neo4j.com/docs/mcp/current/
  summary:
    - >
      Neo4j MCP is Neo4j's official Model Context Protocol server. The project connects
      MCP-compatible AI clients such as Claude, Cursor, and VS Code with a Neo4j
      instance so agents can inspect graph schema, run Cypher, and retrieve or modify
      graph data under the server's configured permissions.
  timeline:
    - >
      2024-11: Model Context Protocol introduced by Anthropic, according to Neo4j's MCP
      developer guide.
    - '2025-08-20: neo4j/mcp repository created.'
    - '2026-06-11: v1.5.3 release published.'
    - '2026-07-01: Homebrew API snapshot listed neo4j-mcp 1.5.3.'
  usage:
    - >
      Package users install neo4j-mcp when they want an MCP host to expose a Neo4j
      database to an assistant. The practical setup is environment-variable driven:
      point the server at a Neo4j URI, username, password, database, optional read-only
      mode, and schema sample sizing, then register it in the client's MCP
      configuration.
related-packages:
  - id: brew:neo4j
    reason: >
      Neo4j MCP requires access to a running Neo4j instance, and the Neo4j package
      supplies a self-managed database for local agent development and testing.
    rel: adjacent_workflow
    sources:
      - https://neo4j.com/docs/mcp/current/
      - https://neo4j.com/docs/operations-manual/current/
  - id: cask:neo4j-desktop
    reason: >
      Neo4j Desktop is a documented local-instance option for Neo4j MCP when a graphical
      environment for creating and managing the backing database is useful.
    rel: adjacent_workflow
    sources:
      - https://neo4j.com/docs/mcp/current/
      - https://neo4j.com/docs/desktop/current/
