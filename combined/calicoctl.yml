id: brew:calicoctl
display-name: calicoctl
homepage: https://www.tigera.io/project-calico/
repo: https://github.com/projectcalico/calico
docs:
  - https://docs.tigera.io/calico/latest/reference/calicoctl/overview
config-file-location:
  unix: /etc/calico/calicoctl.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      calicoctl adoption follows Calico adoption: as Kubernetes and container-network
      policy became operational necessities, administrators needed a packageable CLI to
      inspect and manipulate Calico resources outside higher-level deployment tools. The
      official README's scale claims and 200-plus contributor note indicate the broader
      Calico ecosystem rather than just the CLI.
    - >
      In practice, calicoctl became a common operational package for cluster
      administrators, CI jobs, and incident-response shells because it can create,
      apply, replace, patch, delete, get, validate, convert, and inspect Calico
      resources from files, directories, stdin, or resource names.
  package-nerd-significance:
    - >
      calicoctl is significant because it is a Kubernetes-era infrastructure CLI where
      package versioning is operationally meaningful. Unlike a generic helper binary,
      the CLI is coupled to cluster API expectations and is packaged separately for
      local admin machines, automation runners, and troubleshooting environments.
    - >
      It also represents the packaging shape of cloud-native networking: one source
      project, many cluster components, a standalone CLI, Helm/operator deployment
      paths, and version-sensitive compatibility across distributions.
  project-history:
    - >
      The Calico repository README describes Project Calico as an open-source project
      created and maintained by Tigera, with a large user and contributor community. It
      says Calico is widely adopted for container networking and security, powering
      millions of nodes daily across many countries.
    - >
      The calicoctl documentation defines the tool as a command-line interface for
      managing Calico Open Source network policy, BGP, IP address management, and node
      operations. The repository tag history shows component-specific calicoctl tags in
      the older monorepo era, and the modern docs require the calicoctl version to match
      the Calico cluster version unless the version mismatch override is used.
  related-projects:
    - >
      Related projects include Project Calico, Tigera Operator, Kubernetes
      NetworkPolicy, CNI plugins, Felix, BIRD, Typha, kube-controllers, Cilium, Flannel,
      and other Kubernetes networking and policy tools. calicoctl is the direct admin
      CLI in that ecosystem.
  sources:
    - https://docs.tigera.io/calico/latest/reference/calicoctl/overview
    - https://github.com/projectcalico/calico/blob/master/README.md
    - https://github.com/projectcalico/calico/releases
    - https://github.com/projectcalico/calico/tags
  summary:
    - >
      calicoctl is the command-line management tool for Calico Open Source, the
      Tigera-maintained container networking and network-policy project. It gives
      package-manager users a direct CLI for Calico resources, BGP configuration, IP
      address management, node operations, and policy workflows.
  timeline:
    - >
      2010s: Project Calico emerged as an open-source container networking and policy
      project maintained by Tigera.
    - >
      2010s: calicoctl became the CLI surface for managing Calico resources and
      node/network-policy operations.
    - >
      2021: Calico 3.x release stream continued with frequent GitHub releases and
      component tags.
    - >
      2026: Current Calico docs describe calicoctl as the user-reference CLI for Calico
      Open Source network policy, BGP, IPAM, and node operations.
  usage:
    - >
      Users run `calicoctl` against a Calico datastore or Kubernetes cluster to manage
      network/security policy, endpoint configuration, IP pools, BGP peers, Felix
      configuration, host endpoints, workload endpoints, node state, and IPAM. It
      supports a familiar declarative file flow through `create`, `apply`, `replace`,
      `patch`, and `delete` commands.
    - >
      The docs warn that calicoctl and Calico versions should match, which is especially
      relevant for package managers: installing a newer CLI than the cluster can break
      calls unless `--allow-version-mismatch` is explicitly set.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl for most Calico resource operations when the Calico API server or
      native CRDs are available; retain calicoctl for Calico-specific node, IPAM,
      version, and non-Kubernetes operations.
    rel: alternative
    sources:
      - https://docs.tigera.io/calico/latest/operations/calicoctl/configure/overview
      - https://docs.tigera.io/calico/latest/operations/calicoctl/install
      - https://kubernetes.io/docs/reference/kubectl/
category: networking
package-manager:
  brew: calicoctl
package-manager-url: https://formulae.brew.sh/formula/calicoctl
license: Apache-2.0
tags:
  - calico
  - cli
  - kubernetes
  - network-policy
  - security-policy
description: Calico CLI tool
executables:
  - calicoctl
provenance:
  formula: calicoctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
