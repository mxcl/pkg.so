id: brew:lucky-commit
display-name: lucky-commit
homepage: https://github.com/not-an-aardvark/lucky-commit
repo: https://github.com/not-an-aardvark/lucky-commit
docs:
  - https://github.com/not-an-aardvark/lucky-commit#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool spread as a programmer curiosity rather than infrastructure. Official
      installation notes mention Cargo, Arch Linux, Funtoo, and Homebrew packaging, and
      the repository has roughly two thousand GitHub stars, which is notable for a
      deliberately niche Git-hash novelty.
  package-nerd-significance:
    - >
      For package and Git nerds, lucky-commit is a compact demonstration that commit IDs
      are content-addressed objects but still manipulable by changing semantically inert
      data. Its Homebrew formula gives macOS users an easy way to install a tool that is
      mostly useful for demos, badges, jokes, and understanding Git object hashing.
  project-history:
    - >
      The project was made public on GitHub in February 2016. Its README explains the
      core trick: amend the commit message by appending harmless whitespace, retrying
      messages until Git computes a hash with the requested prefix. The current
      implementation is Rust-based and can use OpenCL for GPU-accelerated searching,
      while older branches preserve earlier Node.js, C, and pure-Rust implementations.
  related-projects:
    - The README points to `every-git-commit-shorthash` as a related project.
    - >
      The project depends conceptually on Git object hashing and, for acceleration,
      OpenCL-capable hardware.
  sources:
    - https://api.github.com/repos/not-an-aardvark/lucky-commit
    - https://formulae.brew.sh/formula/lucky-commit
    - https://github.com/not-an-aardvark/lucky-commit
  summary:
    - >
      lucky-commit is a small Rust command-line tool for rewriting the current Git
      commit so that its object hash begins with a chosen prefix, defaulting to a run of
      zeroes.
  timeline:
    - '2016: Public GitHub repository created.'
    - '2016 onward: Cargo installation documented as the primary upstream installation path.'
    - >
      Later releases: Rust/OpenCL implementation became the maintained branch, with
      older Node.js, C, and pure-Rust branches kept as historical alternatives.
    - >
      Current packaging: Official README documents availability through Arch Linux,
      Funtoo, and Homebrew.
  usage:
    - >
      Users run `lucky_commit` after creating a commit; the command amends the commit
      until the short hash matches a prefix such as `0000000` or a user-supplied pattern
      with wildcard placeholders. The README also documents benchmarking and behavior
      for GPG-signed commits and Git SHA-256 repositories.
related-packages:
  - id: brew:git
    reason: >
      Git is the required version-control engine whose current commit lucky-commit
      amends while searching for a matching object hash.
    rel: adjacent_workflow
    sources:
      - https://raw.githubusercontent.com/not-an-aardvark/lucky-commit/master/README.md
      - https://git-scm.com/docs/git-commit
