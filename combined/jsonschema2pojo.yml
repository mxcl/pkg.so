id: brew:jsonschema2pojo
display-name: jsonschema2pojo
homepage: https://www.jsonschema2pojo.org/
repo: https://github.com/joelittlejohn/jsonschema2pojo
docs:
  - https://www.jsonschema2pojo.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      jsonschema2pojo became a familiar Java ecosystem bridge because it fits Maven and
      Gradle builds as well as ad hoc CLI generation. The README documents `brew install
      jsonschema2pojo`, plugin snippets, project downloads, a mailing list, and
      generated-code examples, making it approachable from package managers and Java
      build tools.
  package-nerd-significance:
    - >
      jsonschema2pojo matters because it packages schema-to-code generation in the style
      Java developers expect: Maven coordinates, Gradle plugin, CLI, downloadable
      releases, and Homebrew formula. It is a concrete example of JSON Schema leaving
      documentation and validation roles to become source-generation input.
  project-history:
    - >
      The repository history reaches back to a 2010-12-10 commit titled "initial import
      of jsonschema2pojo core, cli, maven", showing that the core library, command-line
      interface, and Maven integration were present from the first imported revision.
      The GitHub repository used for development was created on 2013-06-22.
    - >
      The project expanded around multiple ways to consume the generator. The README and
      wiki document Maven plugin usage, command-line usage, Gradle plugin usage, and
      embedded Java API usage. The official website also exposes an interactive
      generator that previews or zips generated POJOs from schemas or example documents.
    - >
      The reference documentation tracks JSON Schema feature support by jsonschema2pojo
      version, with core structural rules such as simple `type`, `properties`, `items`,
      `enum`, `description`, and `format` marked as supported since 0.1.0.
  related-projects:
    - >
      jsonschema2pojo is related to JSON Schema itself, JavaBeans-style POJOs, Jackson,
      Gson, Moshi, JSON-B, Maven, Gradle, and Java code-generation workflows.
  sources:
    - https://api.github.com/repos/joelittlejohn/jsonschema2pojo
    - https://formulae.brew.sh/formula/jsonschema2pojo
    - https://github.com/joelittlejohn/jsonschema2pojo
    - >
      https://github.com/joelittlejohn/jsonschema2pojo/commit/2b2b9cf5bf06fc73e443c54f5bfb163206788931
    - https://github.com/joelittlejohn/jsonschema2pojo/releases/tag/jsonschema2pojo-1.3.3
    - https://github.com/joelittlejohn/jsonschema2pojo/wiki/Getting-Started
    - https://github.com/joelittlejohn/jsonschema2pojo/wiki/Reference
    - https://www.jsonschema2pojo.org/
  summary:
    - >
      jsonschema2pojo generates Java types from JSON Schema or example JSON, with
      optional data-binding annotations for Jackson, Gson, Moshi, and JSON-B. It is both
      an online generator and a build-time/code-generation tool for Java projects.
  timeline:
    - '2010-12-10: Initial imported commit included core, CLI, and Maven modules.'
    - '2012: Official site copyright line covers Joe Littlejohn and the online generator era.'
    - '2013-06-22: GitHub repository created.'
    - '2026-02-08: 1.3.3 release published.'
  usage:
    - >
      Typical use is to point the Maven or Gradle plugin at schema files and generate
      Java sources during the build, run the `jsonschema2pojo` CLI with a source and
      target directory, use the web generator interactively, or embed
      `jsonschema2pojo-core` in Java code through `SchemaMapper`.
related-packages:
  - id: brew:quicktype
    reason: >
      Choose quicktype when you need JSON or JSON Schema models for Java and many other
      target languages; choose jsonschema2pojo for deeper Java build-tool and
      data-binding integration.
    rel: alternative
    sources:
      - https://github.com/joelittlejohn/jsonschema2pojo
      - https://github.com/glideapps/quicktype
category: developer-tools
package-manager:
  brew: jsonschema2pojo
package-manager-url: https://formulae.brew.sh/formula/jsonschema2pojo
license: Apache-2.0
tags:
  - cli
  - code-generator
  - java
  - json
  - json-schema
  - pojo
description: Generates Java types from JSON Schema (or example JSON)
executables:
  - jsonschema2pojo
provenance:
  formula: jsonschema2pojo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
