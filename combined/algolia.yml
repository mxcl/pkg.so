id: brew:algolia
display-name: Algolia CLI
homepage: https://www.algolia.com/doc/tools/cli/get-started
repo: https://github.com/algolia/cli
docs:
  - https://www.algolia.com/doc/tools/cli/get-started
config-file-location:
  unix: ~/.config/algolia/config.toml
credentials-file-location:
  unix: ~/.config/algolia/config.toml
history:
  adoption-history:
    - >
      Adoption follows Algolia's hosted-search user base rather than a stand-alone
      open-source ecosystem. The official docs position the tool for interactive
      commands, scripts, and continuous integration workflows, and the GitHub repository
      topics include Algolia, automation, CLI, command-line, devtool, scripting, and
      search.
    - >
      Because the tool is vendor-maintained, package-manager adoption matters mostly as
      installation convenience. Homebrew packaging makes the CLI available to macOS
      developers who already manage cloud tools through brew.
  package-nerd-significance:
    - >
      Algolia CLI is a clean example of a SaaS control-plane CLI packaged as a native
      binary. It is useful in dotfiles, CI jobs, and migration scripts where browser
      dashboards are too manual.
    - >
      For package maintainers, it is mostly straightforward Go binary distribution, but
      the credential file behavior is important metadata because config and secrets
      share the same TOML profile file.
  project-history:
    - >
      The official GitHub repository was created in January 2022 under algolia/cli. The
      README identifies it as Algolia's official CLI devtool and points users to the
      Algolia documentation for setup and usage.
    - >
      The CLI is written in Go and distributed through multiple channels: npm as
      `@algolia/cli`, Homebrew on macOS, deb/rpm/tarball packages for Linux, Chocolatey
      and zip archives for Windows, and GitHub releases for binaries.
  related-projects:
    - >
      Related tools include Algolia API clients, dashboard workflows, crawler tooling,
      and other vendor CLIs used to script hosted developer services.
  sources:
    - https://api.github.com/repos/algolia/cli
    - https://github.com/algolia/cli
    - https://raw.githubusercontent.com/algolia/cli/main/README.md
    - https://www.algolia.com/doc/tools/cli/authentication.md
    - https://www.algolia.com/doc/tools/cli/get-started.md
  summary:
    - >
      Algolia CLI is Algolia's official command-line tool for managing Algolia resources
      such as indices, records, API keys, synonyms, and application settings. It is a
      vendor CLI in the same family as cloud and SaaS CLIs: a packageable binary that
      turns web dashboard operations into terminal commands and scripts.
  timeline:
    - '2022: Public GitHub repository created.'
    - >
      2022-2026: CLI distributed through npm, Homebrew, Linux packages, Chocolatey, and
      GitHub releases.
    - >
      2026: Official docs describe profiles, automation workflows, and command coverage
      for Algolia resources.
  usage:
    - >
      Users run `algolia` to discover commands, then use subcommands for indices,
      applications, records, synonyms, crawler operations, and other Algolia APIs. The
      official getting-started guide shows credentialed commands using
      `--application-id` and `--api-key`.
    - >
      Authentication can be supplied through environment variables, command-line
      options, OAuth login for application selection, or profiles. The official
      authentication docs state that profiles are stored in plain text in
      `~/.config/algolia/config.toml`, so package users should treat the config file as
      credentials.
related-packages: []
category: developer-tools
package-manager:
  brew: algolia
package-manager-url: https://formulae.brew.sh/formula/algolia
license: MIT
tags:
  - algolia
  - api
  - automation
  - cli
  - search
description: Command-line tool to manage Algolia applications, accounts, and search resources
executables:
  - algolia
provenance:
  formula: algolia
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
