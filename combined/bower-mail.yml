id: brew:bower-mail
display-name: Bower
homepage: https://github.com/wangp/bower
repo: https://github.com/wangp/bower
docs:
  - https://github.com/wangp/bower#readme
  - https://github.com/wangp/bower/blob/master/bower.conf.sample
config-file-location:
  unix:
    - $BOWER_CONFIG
    - $XDG_CONFIG_HOME/bower/bower.conf
    - ~/.config/bower/bower.conf
    - $XDG_CONFIG_DIRS/bower/bower.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The README lists packages in Alpine Linux, AUR, Gentoo, GuixRUS, and Nixpkgs; the
      supplied package facts add Homebrew, Chocolatey, and Arch naming. That is
      respectable coverage for a small terminal mail client, especially one written in
      Mercury.
    - >
      Its adoption is tied to Notmuch users who prefer keyboard-driven, local-index
      email workflows and want a curses interface that can integrate with remote mail
      stores over SSH.
  package-nerd-significance:
    - >
      Bower-mail is package-nerd interesting mostly because it is a small terminal mail
      client in Mercury, packaged across several Unix ecosystems, and because Homebrew
      must disambiguate it as `bower-mail` from the JavaScript package manager `bower`.
  project-history:
    - >
      The public repository was created in December 2011. The README describes Bower as
      a personal but shareable curses frontend for Notmuch, written in Mercury and
      relying on standard Linux utilities, ncurses, gpgme, notmuch, coreutils, and a
      sendmail-compatible mail sender.
    - >
      The project's development history is modest and source-backed history outside the
      repository is thin, so its package history is best treated as a niche Unix mail
      client rather than a broad ecosystem event.
  related-projects:
    - Notmuch is the underlying mail index and search system.
    - >
      alot, mutt, and neomutt are adjacent terminal mail clients for users who prefer
      keyboard-driven email.
    - Mercury is relevant as the implementation language and a packaging dependency.
  sources:
    - https://api.github.com/repos/wangp/bower
    - https://github.com/wangp/bower
    - https://github.com/wangp/bower/blob/master/bower.conf.sample
    - source_facts.package-manager
  summary:
    - >
      Bower is a curses terminal client for the Notmuch email system, unrelated to the
      better-known JavaScript package manager of the same display name.
  timeline:
    - '2011: Public GitHub repository created.'
    - '2010s: Packaged by niche Unix and source-based distributions listed by the README.'
    - '2020s: Continues as a Notmuch curses client with XDG-style configuration.'
  usage:
    - >
      Users run `bower` with optional Notmuch search terms, open index and thread/pager
      views, tag messages, compose mail, reply, manage attachments, and pipe thread IDs
      to commands.
    - >
      Configuration lives in `bower.conf` under XDG locations or a path named by
      `BOWER_CONFIG`; account and sendmail behavior can be configured in the sample
      file.
related-packages:
  - id: brew:notmuch
    reason: >
      Install Notmuch as Bower's underlying mail index, search, tagging, and
      configuration engine; Bower is explicitly designed as its curses frontend.
    rel: adjacent_workflow
    sources:
      - https://github.com/wangp/bower
      - https://notmuchmail.org/
category: productivity
package-manager:
  apk: bower
  brew: bower-mail
  chocolatey: bower
  pacman: bower
package-manager-url: https://formulae.brew.sh/formula/bower-mail
license: GPL-3.0-or-later
tags:
  - cli
  - curses
  - email-client
  - mail
  - notmuch
  - terminal
description: Curses terminal client for the Notmuch email system
executables:
  - bower
provenance:
  formula: bower-mail
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
