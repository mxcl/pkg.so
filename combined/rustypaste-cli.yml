id: brew:rustypaste-cli
display-name: rustypaste-cli
homepage: https://blog.orhun.dev/blazingly-fast-file-sharing
repo: https://github.com/orhun/rustypaste-cli
docs:
  - https://github.com/orhun/rustypaste-cli#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/rustypaste/config.toml
    - ~/.config/rustypaste/config.toml
    - ~/.rustypaste/config.toml
  macos:
    - $XDG_CONFIG_HOME/rustypaste/config.toml
    - ~/.config/rustypaste/config.toml
    - ~/Library/Application Support/rustypaste/config.toml
    - ~/.rustypaste/config.toml
credentials-file-location:
  linux:
    - $XDG_CONFIG_HOME/rustypaste/config.toml
    - ~/.config/rustypaste/config.toml
    - ~/.rustypaste/config.toml
  macos:
    - $XDG_CONFIG_HOME/rustypaste/config.toml
    - ~/.config/rustypaste/config.toml
    - ~/Library/Application Support/rustypaste/config.toml
    - ~/.rustypaste/config.toml
  windows:
    - '%APPDATA%\rustypaste\config.toml'
    - '%USERPROFILE%\.rustypaste\config.toml'
history:
  adoption-history:
    - >
      The client is distributed through Cargo, Homebrew, Alpine, Arch Linux and Nix
      according to the supplied package metadata and official installation instructions.
      Binary releases provide another installation route.
  package-nerd-significance:
    - >
      rustypaste-cli separates the user-facing upload workflow from the rustypaste
      server package. It is a compact example of packaging a protocol-specific client
      independently so users can install rpaste without operating the server or
      maintaining shell wrappers around curl.
  project-history:
    - >
      rustypaste-cli was created as the standalone rpaste command-line client for
      rustypaste. Its documented capabilities include multi-file and standard-input
      uploads, URL shortening, remote uploads, one-shot and protected pastes, expiry
      controls, listing, deletion, and configurable authentication tokens.
  related-projects:
    - rustypaste is the corresponding self-hosted server and protocol target.
  sources:
    - https://github.com/orhun/rustypaste-cli
    - https://github.com/orhun/rustypaste-cli#readme
  summary:
    - >
      rustypaste-cli supplies the rpaste command for interacting with rustypaste servers
      from a terminal.
  timeline:
    - 'Client split: rpaste became available as a standalone client for rustypaste.'
    - >
      Capability growth: The client gained configuration, authentication, listing,
      deletion, protected-paste, expiry and URL-handling features.
    - >
      Packaging expansion: The client became available through Cargo and multiple
      operating-system package collections.
  usage:
    - >
      Users point rpaste at a rustypaste server and upload files or standard input.
      Server addresses and tokens may be supplied by flags or configuration; tokens may
      also be read from user-selected files. The same command can shorten URLs, upload
      remote resources, list or delete server files, and request expiring or one-shot
      links.
category: developer-tools
package-manager:
  apk: rustypaste-cli
  brew: rustypaste-cli
  nix: rustypaste-cli
  pacman: rustypaste-cli
package-manager-url: https://formulae.brew.sh/formula/rustypaste-cli
license: MIT
tags:
  - cli
  - file-upload
  - pastebin-client
  - rust
  - rustypaste
description: CLI tool for rustypaste
executables:
  - rpaste
provenance:
  formula: rustypaste-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
