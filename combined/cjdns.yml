id: brew:cjdns
display-name: cjdns
homepage: https://github.com/cjdelisle/cjdns/
repo: https://github.com/cjdelisle/cjdns
docs:
  - https://github.com/cjdelisle/cjdns#readme
  - https://github.com/cjdelisle/cjdns/tree/master/doc
config-file-location:
  unix: /etc/cjdroute.conf
credentials-file-location:
  unix: /etc/cjdroute.conf
history:
  adoption-history:
    - >
      The batch input records cjdns packages in Homebrew, Alpine, MacPorts, Nix, and
      Arch/pacman. The upstream README includes Linux and macOS build instructions, an
      installer-project option, and localized README translations, all signs of a
      project aimed at technically capable operators across Unix-like systems.
  package-nerd-significance:
    - >
      cjdns is package-nerd significant because it is not just a daemon: it packages a
      whole alternate-networking experiment with crypto identity, TUN/TAP setup, peer
      configuration, and routing assumptions. It stresses distro policy around
      networking privileges, service setup, generated secrets, and fast-moving low-level
      dependencies.
  project-history:
    - >
      The official repository was created in 2011 and describes cjdns as an encrypted
      IPv6 network using public-key cryptography for address allocation and a
      distributed hash table for routing. Its whitepaper frames the project as a
      clean-slate response to Internet routing, security, decentralization, and
      ease-of-configuration problems.
    - >
      The project goals document emphasizes built-in security, auto-configuration,
      decentralization, and scalability for mesh-like networks.
  related-projects:
    - The official README points to cjdns.sh as a pre-built binary installer option.
    - >
      The official whitepaper compares the problem space with IPsec, DNSSEC, LISP, OLSR,
      HSLS, and BATMAN.
  sources:
    - https://github.com/cjdelisle/cjdns/blob/master/README.md
    - https://github.com/cjdelisle/cjdns/blob/master/doc/Whitepaper.md
    - https://github.com/cjdelisle/cjdns/blob/master/doc/projectGoals.md
    - https://api.github.com/repos/cjdelisle/cjdns
  summary:
    - >
      cjdns is an encrypted IPv6 mesh-routing system that derives addresses from public
      keys and uses a distributed hash table for routing. It is packaged as a
      command-line/network daemon stack centered on `cjdroute`.
  timeline:
    - '2011: Official GitHub repository created.'
    - '2011: Early tags include cjdns-0.1, cjdns-0.2, and cjdns-0.3.'
    - '2026: Official GitHub repository metadata shows continuing activity.'
  usage:
    - >
      Users build or install cjdns, generate `/etc/cjdroute.conf` with `cjdroute
      --genconf`, protect that file because it contains node identity material, and run
      the router to join encrypted peer networks.
related-packages: []
category: networking
package-manager:
  apk: cjdns
  brew: cjdns
  macports: cjdns
  nix: cjdns
  pacman: cjdns
package-manager-url: https://formulae.brew.sh/formula/cjdns
license: GPL-3.0-or-later AND GPL-2.0-or-later AND BSD-3-Clause AND MIT
tags:
  - cli
  - cryptographic-addressing
  - dht
  - ipv6
  - mesh-networking
  - routing
description: Advanced mesh routing system with cryptographic addressing
executables:
  - cjdnstool
  - cjdroute
provenance:
  formula: cjdns
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
