id: brew:geoip2fast
display-name: GeoIP2Fast
homepage: https://github.com/rabuchaim/geoip2fast
repo: https://github.com/rabuchaim/geoip2fast
docs:
  - https://github.com/rabuchaim/geoip2fast#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GeoIP2Fast appears to serve a narrower package audience than MaxMind's official
      clients, but it fills a practical niche for Python users who want local
      IP-to-country, city, and ASN lookup without a service call or external database
      server. Homebrew packaging adds a Unix command-line installation path alongside
      Python packaging.
  package-nerd-significance:
    - >
      For package users, GeoIP2Fast is interesting because it trades a larger resident
      data structure for dependency-light local lookups. It is most useful in scripts,
      batch enrichment jobs, log analysis, and small services where avoiding network
      calls and database setup matters more than using MaxMind's official binary
      database reader stack.
  project-history:
    - >
      The authoritative public history is mostly the repository README and changelog
      rather than a separate project history. The repository records a Python
      implementation, a legacy directory, generated GeoIP2Fast data files, and
      command-line tools such as `geoip2fast` and `geoip2dat` for lookup and data
      conversion workflows.
    - >
      Version 1.2.2, documented in June 2024, recorded data-format compatibility
      changes, MaxMind CSV field handling, optional reduced single-file variants,
      self-test and coverage methods, and command-line selection of data files.
  related-projects:
    - >
      GeoIP2Fast depends on MaxMind GeoLite2 CSV data as an upstream data source. Its
      problem space overlaps MaxMind's GeoIP database tools and local GeoIP lookup
      libraries, but its implementation centers on its own compressed data-file format.
  sources:
    - https://formulae.brew.sh/formula/geoip2fast
    - https://github.com/rabuchaim/geoip2fast
  summary:
    - >
      GeoIP2Fast is a small Python GeoIP lookup library and command-line tool built
      around preprocessed `.dat.gz` data files derived from MaxMind GeoLite2 CSV data.
      Its README emphasizes pure-Python operation, no external database or web-service
      dependency, IPv4 and IPv6 support, country, city, ASN, CIDR, and private-network
      results, and very fast in-memory lookups.
  timeline:
    - >
      2024: Version 1.2.2 documented MaxMind GeoLite2 CSV field handling and v1.2
      data-file compatibility changes.
    - >
      2024: The README documented automatic `.dat.gz` downloads, CLI update commands,
      coverage checks, and speed-test options.
  usage:
    - >
      Practitioners use GeoIP2Fast by loading a bundled or generated `.dat.gz` file into
      memory and calling `lookup()` from Python, or by invoking the CLI with one or more
      IP addresses. The project also supports updating data files from release
      artifacts, generating data files from GeoLite2 CSV input, running speed tests,
      checking database coverage, and printing JSON-like lookup results.
related-packages:
  - id: brew:libmaxminddb
    reason: >
      Choose libmaxminddb when you need MaxMind's standard MMDB format and its C library
      or mmdblookup utility; choose GeoIP2Fast for its pure-Python, in-memory custom
      data-file workflow.
    rel: alternative
    sources:
      - https://github.com/rabuchaim/geoip2fast
      - https://github.com/maxmind/libmaxminddb
category: networking
