id: cask:tuna
display-name: Tuna
homepage: https://tunaformac.com/
repo: null
docs:
  - https://tunaformac.com/docs
  - https://tunaformac.com/docs/start-here
config-file-location:
  macos: ~/Library/Application Support/Tuna/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Tuna is distributed as a native macOS application and is also packaged as a
      Homebrew Cask. Its documentation positions it as a replacement or complement for
      Spotlight-style launching and macOS automation tools.
  package-nerd-significance:
    - >
      Tuna belongs to the lineage of keyboard-centric macOS launchers but extends the
      familiar fuzzy-search model with a modal command grammar, local-first dictation,
      scripts, configurable leader-key behavior, and compound subject-action-target
      commands.
  project-history:
    - >
      Tuna was developed by Brainbow, operated by Mikkel Malmberg, as a modern macOS
      launcher. Its command model explicitly borrows from Quicksilver's
      subject-action-optional-target structure.
  related-projects:
    - >
      Quicksilver directly influenced Tuna's command structure. Official documentation
      also discusses interoperability or overlapping workflows with Spotlight, Raycast,
      Karabiner, and Hammerspoon.
  sources:
    - 'Official changelog: https://tunaformac.com/changelog'
    - 'Official documentation: https://tunaformac.com/docs/start-here'
    - 'Official privacy documentation: https://tunaformac.com/docs/privacy-and-local-processing'
    - 'Official terms identifying the publisher: https://tunaformac.com/terms'
  summary:
    - >
      Tuna is a modal macOS application launcher and command system built around
      subjects, actions, and optional targets.
  timeline:
    - '0.89: Version recorded by the supplied Homebrew Cask metadata.'
  usage:
    - >
      Users invoke Fuzzy Mode to launch or browse items, Text Mode for calculations and
      text operations, Talk Mode for local-first dictation, and Combo Mode for
      leader-key workflows. The launcher learns selections, supports aliases and
      scripts, and keeps clipboard, transcript, and query content local by default
      according to its privacy documentation.
category: productivity
