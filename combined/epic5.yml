id: brew:epic5
display-name: EPIC5
homepage: https://www.epicsol.org/
repo: https://git.epicsol.org/epic5.git
docs:
  - http://help.epicsol.org/
  - https://www.epicsol.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      EPIC5 has the adoption pattern of a long-lived terminal IRC tool: it is
      distributed as source by the upstream project and appears as binary packages in
      multiple operating-system package collections. The official getting page notes
      that most operating-system distributions have EPIC4 and EPIC5 packages available.
  package-nerd-significance:
    - >
      For package maintainers, EPIC5 is a preservation piece from the ircII lineage:
      small, source-distributed, terminal-native, scriptable, and still relevant to
      users maintaining old IRC workflows or EPIC script collections.
  project-history:
    - >
      EPIC grew out of ircII culture, where terminal IRC clients were not just chat
      programs but programmable environments. The EPIC site presents EPIC4 and EPIC5 as
      two current generations that are not generally interchangeable, with users
      choosing the branch their scripts require.
    - >
      The EPIC news archive records active EPIC5 releases in the 2010s, including EPIC5
      1.1.8 and 1.1.10 in April 2014 and EPIC5 2.0 on February 13, 2016. The site later
      marked 30 years of EPIC with EPIC4 3.0 and EPIC5 3.0 releases.
  related-projects:
    - EPIC4 is the other maintained EPIC generation and is documented alongside EPIC5.
    - ircII is the original IRC client lineage from which EPIC forked.
  sources:
    - https://www.epicsol.org/
    - https://www.epicsol.org/getting_epic
    - https://www.epicsol.org/epic_news
    - https://git.epicsol.org/epic5.git
  summary:
    - >
      EPIC5 is the current fifth-generation branch of EPIC, the Enhanced Programmable
      IRC-II Client. Its own site describes EPIC as an ircII fork more than 30 years
      old, aimed at old-school IRC users, scripters, and people who want an ircII-like
      client that can be extended heavily through configuration and scripts.
  timeline:
    - "1990s: EPIC begins as an ircII fork, according to the project's 30-year history note."
    - '2014: EPIC5 1.1.8 and 1.1.10 releases are announced.'
    - '2016: EPIC5 2.0 is released.'
    - '2020s: The project marks 30 years with EPIC5 3.0.'
  usage:
    - >
      Users run EPIC5 as a terminal IRC client and often customize it through EPIC
      scripts. The official site links separate material for scripts, scripting,
      installation, and EPIC5 help, reflecting a workflow built around interactive IRC
      use plus local automation.
related-packages:
  - id: brew:ircii
    reason: >
      ircII is the classic client from which EPIC forked; choose it for the original
      IRC/ICB interface, or EPIC5 for EPIC's expanded programmability and script
      ecosystem.
    rel: alternative
    sources:
      - https://www.epicsol.org/
      - http://www.eterna23.net/ircii/
  - id: brew:weechat
    reason: >
      WeeChat is a modern terminal IRC alternative with dynamic plugins, eight scripting
      languages, split views, SASL, and remote interfaces, while EPIC5 favors the
      established ircII-style scripting model.
    rel: alternative
    sources:
      - https://www.epicsol.org/
      - https://weechat.org/about/features/
      - https://weechat.org/doc/
category: networking
