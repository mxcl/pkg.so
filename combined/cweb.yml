id: brew:cweb
display-name: CWEB
homepage: https://cs.stanford.edu/~knuth/cweb.html
repo: https://github.com/ascherer/cweb
docs:
  - https://cs.stanford.edu/~knuth/cweb.html
  - https://github.com/ascherer/cweb#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CWEB has stayed relevant less as a mass-market build tool than as a durable
      literate-programming reference implementation. The current GitHub project
      describes several decades of accumulated experience and treats the repository
      partly as software archaeology for original Levy/Knuth releases.
  package-nerd-significance:
    - >
      For package nerds, CWEB is a bridge between TeX culture and systems programming:
      it packages a historically important programming methodology, a stable pair of
      classic command-line tools, and a living archive of CWEB releases.
  project-history:
    - >
      Knuth's official page explains that WEB originated while he wrote TeX, and that
      Silvio Levy adapted WEB to C in 1987. Knuth and Levy then revised and enhanced
      CWEB, including support for C++, ANSI C, and later Java-oriented use.
  related-projects:
    - >
      CWEB is related to WEB, TeX, CTANGLE, CWEAVE, CTWILL, TeX Live, and other
      literate-programming environments.
  sources:
    - https://cs.stanford.edu/~knuth/cweb.html
    - https://github.com/ascherer/cweb
    - https://raw.githubusercontent.com/ascherer/cweb/master/README.md
    - https://github.com/ascherer/cweb/releases
  summary:
    - >
      CWEB is Donald Knuth and Silvio Levy's literate-programming system for C, C++, and
      Java, pairing TeX documentation with source extraction through cweave and ctangle.
  timeline:
    - '1987: Silvio Levy adapts WEB to C.'
    - '1993: Knuth and Levy publish The CWEB System of Structured Documentation.'
    - '2001: Third printing documents version 3.6 with hypertext extensions.'
    - The ascherer/cweb repository carries release records and archival material.
  usage:
    - >
      CWEB authors write .w files that mix explanation, TeX markup, and program
      fragments. ctangle extracts compilable source, while cweave produces typeset
      documentation for humans.
related-packages:
  - id: brew:noweb
    reason: >
      noweb is a language-independent literate-programming alternative with much simpler
      markup, while CWEB provides C-family-aware formatting and indexing tightly
      integrated with TeX.
    rel: alternative
    sources:
      - https://cs.stanford.edu/~knuth/cweb.html
      - https://github.com/nrnrnr/noweb
  - id: brew:texlive
    reason: >
      TeX Live supplies TeX and pdfTeX engines that can typeset the .tex documentation
      generated by CWEB's CWEAVE command.
    rel: adjacent_workflow
    sources:
      - https://cs.stanford.edu/~knuth/cweb.html
      - https://www.tug.org/texlive/
category: developer-tools
package-manager:
  brew: cweb
package-manager-url: https://formulae.brew.sh/formula/cweb
license: Knuth-CTAN
tags:
  - c
  - c-plus-plus
  - cli
  - documentation
  - java
  - literate-programming
  - tex
description: Literate documentation system for C, C++, and Java
executables:
  - ctangle
  - cweave
provenance:
  formula: cweb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
