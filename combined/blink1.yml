id: brew:blink1
display-name: blink(1)
homepage: https://blink1.thingm.com/
repo: https://github.com/todbot/blink1-tool
docs:
  - https://blink1.thingm.com/blink1-tool
  - https://github.com/todbot/blink1-tool#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      blink(1) was adopted by developers and operations users as a physical notifier for
      builds, alerts, chat status, and ambient monitoring. Package-manager facts list
      Homebrew, Nix, and Scoop, which matches a cross-platform hardware utility used
      from scripts rather than a single desktop app.
  package-nerd-significance:
    - >
      blink(1) is a neat package-manager artifact because installing one CLI turns a USB
      gadget into a Unix endpoint. It bridges shell scripts, CI systems, and physical
      computing without a daemon or cloud service.
    - >
      It is also a tiny example of hardware packaging done right: udev rules,
      static-build concerns, HID backend choices, release binaries, a C library, and a
      CLI all live close together.
  project-history:
    - >
      The upstream README calls the repository the official collection of C/C++
      command-line tools for the blink(1) USB RGB LED. It lists `blink1-tool`,
      `blink1-tiny-server`, `blink1control-tool`, `blink1-lib`, `blink1-mini-tool`, and
      `blink1raw` as current tools.
    - >
      GitHub releases show continued maintenance from the 2.x line through 2026,
      including releases for both `blink1-tool` and `blink1-tiny-server`.
  related-projects:
    - >
      Related projects include Blink1Control, `blink1-tiny-server`, HIDAPI, libusb,
      udev-based Linux device access, and other USB notification-light integrations used
      by build and monitoring systems.
  sources:
    - https://blink1.thingm.com/blink1-tool
    - https://github.com/todbot/blink1-tool#readme
    - https://github.com/todbot/blink1-tool/releases
    - input source_facts.package-manager
  summary:
    - >
      blink(1) is ThingM's USB RGB notification light, and `blink1-tool` is the official
      command-line and C/C++ tooling for controlling it. The Homebrew package represents
      the Unix-friendly side of a physical status indicator: scriptable color, blink,
      pattern, and firmware/device operations.
  timeline:
    - '2018-05-12: v2.0.1 release published on GitHub.'
    - '2022-01-27: v2.3.0 release published on GitHub.'
    - '2025-11-24: v2.4.0 release published on GitHub.'
    - '2026-04-16: v2.5.0 release published for blink1-tool and blink1-tiny-server.'
  usage:
    - >
      `blink1-tool` can list devices, set RGB/HSB colors, blink or flash,
      play/write/read patterns, save startup behavior, query firmware, select device
      IDs, and run quiet or verbose for scripts. Linux users may need udev rules so
      non-root processes can access the USB HID device.
    - >
      The tooling supports macOS, Windows, Linux, FreeBSD, Raspberry Pi OS, BeagleBone,
      OpenWRT/DD-WRT, and other systems with GNU Make and a C compiler, with HIDAPI and
      simpler HIDDATA/libusb-oriented build options.
related-packages:
  - id: brew:hidapi
    reason: >
      HIDAPI is the documented default USB HID backend for building `blink1-tool`,
      making it useful alongside the CLI for custom builds and lower-level blink(1)
      integrations.
    rel: adjacent_workflow
    sources:
      - https://github.com/todbot/blink1-tool#readme
      - https://github.com/libusb/hidapi#readme
category: system
