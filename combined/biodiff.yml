id: brew:biodiff
display-name: biodiff
homepage: https://github.com/8051Enthusiast/biodiff
repo: https://github.com/8051Enthusiast/biodiff
docs:
  - https://github.com/8051Enthusiast/biodiff#readme
config-file-location:
  linux:
    - $BIODIFF_CONFIG_DIR/config.json
    - $XDG_CONFIG_HOME/biodiff/config.json
    - ~/.config/biodiff/config.json
  macos:
    - $BIODIFF_CONFIG_DIR/config.json
    - ~/Library/Application Support/biodiff/config.json
  windows:
    - '%BIODIFF_CONFIG_DIR%\config.json'
    - '%APPDATA%\biodiff\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      biodiff reached a 1.0.0 release in February 2022 and a 1.2.x series in April 2024.
      The input package metadata lists Homebrew, Nix, Arch/pacman, Scoop, Winget, and
      openSUSE/zypper, showing adoption across Unix, Windows package-manager, and
      Rust-adjacent channels.
  package-nerd-significance:
    - >
      biodiff is interesting because it smuggles a bioinformatics idea into
      reverse-engineering tooling. The package name is literal: binary diffing improved
      by sequence alignment.
  project-history:
    - >
      The 8051Enthusiast/biodiff repository was created in May 2021. The README
      describes the tool as a binary diff viewer that displays two files side by side,
      pads missing bytes, and uses alignment algorithms from WFA2 or rust-bio, libraries
      normally associated with DNA sequence alignment.
  related-projects:
    - >
      biodiff is related to WFA2-lib, rust-bio, cursive, hex viewers, binary diff tools,
      and `git difftool` workflows through its `git-biodiff` executable.
  sources:
    - https://github.com/8051Enthusiast/biodiff
    - https://github.com/8051Enthusiast/biodiff/releases
    - https://raw.githubusercontent.com/8051Enthusiast/biodiff/main/README.md
    - source_facts.package-manager
  summary:
    - >
      biodiff is an interactive binary diff viewer that borrows biological
      sequence-alignment algorithms to line up similar regions of two binary files.
  timeline:
    - '2021: Repository created and first v0.1.2 release published.'
    - '2022: v1.0.0 released.'
    - '2023: v1.1.0 released.'
    - '2024: v1.2.1 released.'
  usage:
    - >
      Users run `biodiff file_a file_b` for a terminal hex view, then switch between
      unaligned and aligned views, align regions near the cursor, do global or
      semiglobal alignment for smaller inputs, and optionally print diffs directly with
      `biodiff --print`.
    - >
      The README notes that global alignment has quadratic time and space costs and is
      not a good fit for large files, which is a useful package-level expectation for
      people comparing firmware chunks or binary formats.
related-packages:
  - id: brew:vbindiff
    reason: >
      Choose VBinDiff for a traditional portable visual binary comparison, or biodiff
      when inserted and deleted regions should be lined up using sequence-alignment
      algorithms.
    rel: alternative
    sources:
      - https://github.com/8051Enthusiast/biodiff
      - https://www.cjmweb.net/vbindiff/
category: developer-tools
package-manager:
  brew: biodiff
  nix: biodiff
  pacman: biodiff
  scoop: main/biodiff
  winget: 8051Enthusiast.biodiff
  zypper: biodiff
package-manager-url: https://formulae.brew.sh/formula/biodiff
license: MIT
tags:
  - cli
  - diff
  - hex
  - reverse-engineering
  - terminal
description: Hex diff viewer using alignment algorithms from biology
executables:
  - biodiff
  - git-biodiff
provenance:
  formula: biodiff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
