id: brew:daktilo
display-name: daktilo
homepage: https://daktilo.cli.rs
repo: https://github.com/orhun/daktilo
docs:
  - https://daktilo.cli.rs/
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/daktilo.toml
    - $XDG_CONFIG_HOME/daktilo/daktilo.toml
    - $XDG_CONFIG_HOME/daktilo/config
    - ~/.config/daktilo.toml
    - ~/.config/daktilo/daktilo.toml
    - ~/.config/daktilo/config
  macos:
    - ~/Library/Application Support/daktilo.toml
    - ~/Library/Application Support/daktilo/daktilo.toml
    - ~/Library/Application Support/daktilo/config
  windows:
    - '%APPDATA%\daktilo.toml'
    - '%APPDATA%\daktilo\daktilo.toml'
    - '%APPDATA%\daktilo\config'
credentials-file-location: null
history:
  adoption-history:
    - >
      daktilo spread through channels that suit small Rust CLI utilities: GitHub
      releases, crates.io, Arch Linux, Alpine Edge, MacPorts, Homebrew metadata, and
      source builds. The official README highlights Linux, Windows, and macOS support,
      with macOS requiring terminal accessibility permissions.
  package-nerd-significance:
    - >
      daktilo is a neat package-manager specimen because it combines global keyboard
      hooks, audio playback, Rust distribution, and cross-platform config-dir
      conventions in a tiny novelty CLI. It is the kind of package that makes a system
      package index feel human rather than purely utilitarian.
  project-history:
    - >
      The official repository was created in September 2023, and v0.1.0 was published in
      October 2023. The README explains the name as Turkish for typewriter and presents
      the project as a small CLI that plays typewriter sounds for key presses with
      configurable presets.
  related-projects:
    - The official README lists bucklespring and selectric-mode as similar projects.
  sources:
    - https://daktilo.cli.rs/
    - https://raw.githubusercontent.com/orhun/daktilo/main/README.md
    - https://api.github.com/repos/orhun/daktilo
    - https://github.com/orhun/daktilo/releases/tag/v0.1.0
  summary:
    - >
      daktilo is a playful cross-platform command-line utility that turns keyboard
      events into typewriter-style sounds. Its package-manager identity is closer to
      desktop toy and productivity ambiance than infrastructure: install it, run one
      binary, and your keyboard gets audio feedback.
  timeline:
    - '2023: Official GitHub repository is created.'
    - '2023: v0.1.0 is published.'
    - '2024: v0.6.0 is published.'
    - >
      2024: Official README documents packaged installs via Cargo, Arch Linux, Alpine
      Edge, MacPorts, binary releases, and source builds.
  usage:
    - >
      Users run daktilo directly for the default typewriter effect, choose sound
      presets, list output devices, select a playback device, vary tempo and volume, or
      point the CLI at a TOML config file. The config file can define custom sound
      presets, disabled keys, file lists, strategies, and variation settings.
related-packages: []
category: productivity
package-manager:
  apk: daktilo
  brew: daktilo
  macports: daktilo
  nix: daktilo
  pacman: daktilo
package-manager-url: https://formulae.brew.sh/formula/daktilo
license: Apache-2.0 OR MIT
tags:
  - audio
  - cli
  - keyboard-sounds
  - typewriter
description: Plays typewriter sounds every time you press a key
executables:
  - daktilo
  - daktilo-completions
  - daktilo-mangen
provenance:
  formula: daktilo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
