id: brew:ffms2
display-name: FFMS2
homepage: https://github.com/FFMS/ffms2
repo: https://github.com/FFMS/ffms2
docs:
  - https://github.com/FFMS/ffms2#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package matters most in video scripting and fansubbing-adjacent workflows
      where Avisynth or VapourSynth scripts need reliable opening, indexing, seeking,
      VFR handling, Unicode path handling, and access to FFmpeg's broad demuxer and
      decoder support. Package managers expose the ffmsindex tool and the library/plugin
      pieces so scripts can build repeatable indexes before frame access.
  package-nerd-significance:
    - >
      FFMS2 is a dependency-sensitive media package: it wraps FFmpeg, but its value is
      hiding FFmpeg API complexity from script authors and applications. The changelog's
      repeated compatibility entries explain why packagers care about aligning FFMS2
      releases with the FFmpeg versions in the same repository.
  project-history:
    - >
      The project originated as an Avisynth file-reader plugin named FFmpegSource; its
      README explains that version 1 was only an Avisynth plugin and that FFMS2 grew
      into the reusable library form. Internally it is C++, while the public API is pure
      C, making it linkable from C-compatible applications.
    - >
      FFMS2 has historically tracked FFmpeg and Libav API churn closely. Its changelog
      records support for recent FFmpeg builds, VapourSynth support in the 2.18 era, API
      and index improvements across the 2.x releases, removal of old Libav support in
      2.40, and a 5.x line that raised minimum FFmpeg requirements.
  related-projects:
    - >
      FFmpeg is the decoding and demuxing foundation. Avisynth and VapourSynth are the
      scripting environments where FFMS2's source plugins are most visible.
  sources:
    - https://github.com/FFMS/ffms2/blob/master/README.md
    - https://github.com/FFMS/ffms2/blob/master/doc/ffms2-changelog.md
    - https://github.com/FFMS/ffms2/releases
    - https://formulae.brew.sh/formula/ffms2
  summary:
    - >
      FFMS2, also called FFmpegSource, is a cross-platform wrapper library around FFmpeg
      plus Avisynth and VapourSynth source plugins for frame- and sample-accurate media
      access.
  timeline:
    - '2013: FFMS2 2.18 added VapourSynth support.'
    - '2020: FFMS2 2.40 removed old Libav support and refreshed FFmpeg API usage.'
    - '2024: FFMS2 5.0 fixed FFmpeg 6.1 compatibility and made FFmpeg 6.1 the minimum.'
    - '5.1: FFMS2 raised its minimum requirement to FFmpeg 7.1.'
  usage:
    - >
      End users most visibly use FFMS2 through the Avisynth or VapourSynth source
      plugin, while developers can link the C API. The ffmsindex executable builds index
      files so later frame and audio access can be deterministic instead of relying on
      ad hoc seeking through containers.
related-packages:
  - id: brew:ffmpeg
    reason: >
      FFmpeg provides the demuxers and decoders wrapped by FFMS2, so it is the
      foundational adjacent package for building or understanding an FFMS2 media-access
      stack.
    rel: adjacent_workflow
    sources:
      - https://github.com/FFMS/ffms2/blob/master/doc/ffms2-api.md
      - https://ffmpeg.org/documentation.html
  - id: brew:vapoursynth
    reason: >
      Choose VapourSynth as the Python-based video-processing host in which FFMS2 can
      act as a frame-accurate source plugin.
    rel: adjacent_workflow
    sources:
      - https://github.com/FFMS/ffms2#readme
      - https://www.vapoursynth.com/doc/
category: media
