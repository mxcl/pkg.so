id: brew:kanata
display-name: Kanata
homepage: https://github.com/jtroo/kanata
repo: https://github.com/jtroo/kanata
docs:
  - https://github.com/jtroo/kanata/blob/main/docs/config.adoc
  - https://github.com/jtroo/kanata#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kanata's adoption is driven by people who want programmable-keyboard behavior on
      ordinary laptop or desktop keyboards. The README's Repology badge and batch
      package metadata show distribution through package systems such as Homebrew, Nix,
      and Scoop, while Cargo remains the native Rust installation path.
    - >
      Its cross-platform design distinguishes it from platform-specific remappers and
      from firmware projects that require programmable keyboard hardware. That makes it
      attractive to users who move layouts between operating systems or who want
      home-row mods and layers on built-in laptop keyboards.
  package-nerd-significance:
    - >
      Kanata is package-nerd notable because it packages a hardware-keyboard
      customization culture as cross-platform user-space software. It sits between
      firmware projects such as QMK, Linux input-layer tools, macOS keyboard utilities,
      and Windows interception-driver workflows.
    - >
      It also carries the operational concerns package maintainers care about:
      privileged input access, platform-specific drivers, release assets, sample
      configs, and companion tray wrappers.
  project-history:
    - >
      The GitHub repository was created on 2022-04-18, and v0.1.1 was published on
      2022-04-24. A July 2022 Rust community announcement for v1.0.5 described it as an
      advanced keyboard remapper for Windows and Linux and explicitly compared its use
      case to QMK and KMonad.
    - >
      The README frames the project around keyboard comfort and usability: users can
      apply the idea of Shift-style alternate layers to arbitrary keys, then customize
      those layers for personal workflows. The configuration guide documents the
      S-expression format that defines source keys, aliases, layers, and behavior.
    - >
      By 2026-07-01, Kanata had grown into a mature workstation utility with prebuilt
      release binaries, Cargo installation, platform notes, sample configurations,
      optional TCP server behavior, Interception driver support on Windows, and
      companion tooling such as Kanata Tray.
  related-projects:
    - >
      QMK and KMonad are related keyboard-customization projects referenced in Kanata
      community material.
    - >
      Kanata Tray is a companion tray wrapper for starting, stopping, and switching
      Kanata configurations.
    - >
      The Karabiner driver and Interception driver are platform-adjacent pieces for
      macOS and Windows input interception workflows.
  sources:
    - https://api.github.com/repos/jtroo/kanata
    - https://github.com/jtroo/kanata
    - https://github.com/jtroo/kanata/blob/main/docs/config.adoc
    - https://github.com/jtroo/kanata/releases
    - https://github.com/rszyma/kanata-tray
    - >
      https://www.reddit.com/r/rust/comments/w0zqk4/kanata_v105_an_advanced_keyboard_remapper_for/
  summary:
    - >
      Kanata is a cross-platform software keyboard remapper for Linux, macOS, and
      Windows. It brings firmware-style keyboard features such as layers, tap-hold
      behavior, macros, unicode output, and leader sequences into a user-space program
      configured with Lisp-like S-expressions.
  timeline:
    - '2022: jtroo/kanata repository created and first GitHub releases published.'
    - >
      2022: v1.0.5 announced as an advanced Windows and Linux keyboard remapper in the
      Rust community.
    - >
      2024: Configuration and platform discussions show active use across macOS, Linux,
      and Windows.
    - '2026: v1.11.0 release published on GitHub.'
  usage:
    - >
      Users run `kanata --cfg <configuration-file>` with a `.kbd` configuration. On
      Linux and macOS, extra privileges or platform drivers may be needed because Kanata
      intercepts keyboard input; the README points to platform-specific setup
      discussions and release instructions.
    - >
      Common configurations define base and alternate layers, tap-hold keys, macros,
      unicode actions, and leader sequences. The official configuration guide and sample
      files serve as the main learning path.
related-packages:
  - id: brew:kanata-tray
    reason: >
      Kanata Tray is the documented cross-platform tray wrapper for starting, stopping,
      pausing, and switching configurations for Kanata, which otherwise remains attached
      to its launching terminal by default.
    rel: adjacent_workflow
    sources:
      - https://github.com/jtroo/kanata#usage
      - https://github.com/rszyma/kanata-tray#readme
category: system
