id: brew:cql
display-name: CovenantSQL
homepage: https://covenantsql.io
repo: https://github.com/CovenantSQL/CovenantSQL
docs:
  - https://developers.covenantsql.io/docs/en/cql_intro
  - https://developers.covenantsql.io/docs/en/intro
  - https://github.com/CovenantSQL/CovenantSQL#readme
config-file-location:
  unix:
    - ~/.cql/config.yaml
    - config.yaml
credentials-file-location:
  unix:
    - ~/.cql/private.key
    - private.key
history:
  adoption-history:
    - >
      The project reached package-manager users mainly through its CLI tooling,
      including Homebrew. Its public documentation and release pages point to an
      experimental database platform rather than a mainstream Cassandra or PostgreSQL
      replacement.
  package-nerd-significance:
    - >
      For package maintainers, `cql` is interesting because it packaged a full
      blockchain-database experiment as a single terminal tool, with config, private key
      handling, and database-management subcommands exposed through one executable.
  project-history:
    - >
      The official docs presented CovenantSQL as a decentralized SQL database with
      blockchain features and described the `cql` command-line toolset as the terminal
      interface for accounts, wallet balances, and databases.
  related-projects:
    - >
      The official introduction compared CQL with Amazon QLDB for ledger-style databases
      and with Filecoin/IPFS as a decentralized-storage analogy.
  sources:
    - https://developers.covenantsql.io/docs/en/intro
    - https://developers.covenantsql.io/docs/en/cql_intro
    - https://github.com/CovenantSQL/CovenantSQL/releases
    - https://formulae.brew.sh/formula/cql
  summary:
    - >
      CovenantSQL, packaged as the `cql` command, was an open-source attempt to combine
      SQL database access with blockchain-style decentralization, permissions, and
      immutable query history.
  timeline:
    - '2019: Official English docs described CovenantSQL and the `cql` command-line toolset.'
    - '2020: The GitHub releases page listed v0.6.0 as a rehearsal release.'
  usage:
    - >
      The `cql` tool manages CovenantSQL accounts, wallets, database operations, and
      local servers. Its docs emphasize a private key plus config file workflow, with
      `~/.cql/config.yaml` as the default config path.
related-packages: []
category: data
package-manager:
  brew: cql
package-manager-url: https://formulae.brew.sh/formula/cql
license: Apache-2.0
tags:
  - blockchain
  - cli
  - database
  - dbaas
  - decentralized
  - p2p
  - sql
description: Decentralized SQL database with blockchain features
executables:
  - cql
provenance:
  formula: cql
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
