id: brew:bagel
display-name: Bagel
homepage: https://boostsecurityio.github.io/bagel/
repo: https://github.com/boostsecurityio/bagel
docs:
  - https://boostsecurityio.github.io/bagel
config-file-location:
  unix:
    - ./bagel.yaml
    - ~/.config/bagel/bagel.yaml
  windows: '%APPDATA%\bagel\bagel.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Bagel's public adoption history is short because the repository and releases began
      in 2026. The batch metadata already shows Homebrew, Debian, and Ubuntu packaging,
      which suggests upstream wanted package-manager distribution quickly for
      workstation and CI use.
    - >
      GitHub releases progressed from v0.1.0 in February 2026 to v0.7.1 in June 2026,
      indicating rapid early iteration around probes, detectors, output, and packaging.
  package-nerd-significance:
    - >
      Bagel is significant as an early example of developer-workstation posture scanning
      being packaged like a normal CLI. Instead of requiring an agent rollout, it can be
      installed with Homebrew or OS packages and run locally or in automation.
    - >
      For package maintainers, its interesting boundary is privacy: the package scans
      sensitive locations but promises metadata-only output, making documentation and
      trust signals especially important.
  project-history:
    - >
      The boostsecurityio/bagel GitHub repository was created in February 2026, and its
      first v0.1.0 release followed the next day. The README describes it as a
      cross-platform CLI for macOS, Linux, and Windows that inspects developer machines
      and outputs structured JSON reports.
    - >
      From its first public versions, Bagel documented a privacy-first boundary:
      metadata about paths, permissions, timestamps, key types, and config flags may be
      reported, but secret payloads are not written or exfiltrated. The README also
      positions Bagel as the open-source counterpart or lightweight lead-in to
      BoostSecurity's enterprise Developer Endpoint Protection product.
  related-projects:
    - >
      Bagel is related to BoostSecurity Developer Endpoint Protection, which the README
      describes as the enterprise-grade scale-out product.
    - >
      It is adjacent to secret scanners, SSH and Git hardening tools, cloud credential
      auditors, and developer endpoint inventory agents.
  sources:
    - https://boostsecurityio.github.io/bagel
    - https://github.com/boostsecurityio/bagel
    - https://github.com/boostsecurityio/bagel/releases
    - source_facts.package-manager
  summary:
    - >
      Bagel is a BoostSecurity CLI for inventorying security-relevant metadata on
      developer workstations. It focuses on supply-chain and endpoint posture signals
      such as tool configuration, risky settings, and the locations of secrets without
      collecting secret values.
  timeline:
    - '2026-02: GitHub repository created and v0.1.0 released.'
    - '2026-03: v0.3.0 and v0.5.0 releases published during early iteration.'
    - '2026-06: v0.7.1 released.'
  usage:
    - >
      Typical usage is bagel scan, producing JSON by default or table output for quick
      review. The README documents flags for output path, strict mode, cache rebuilds,
      progress display, verbose logging, config path, and disabling version checks.
    - >
      Bagel checks areas such as Git, SSH, npm, environment variables, shell history,
      cloud credentials, JetBrains IDEs, GitHub CLI, and AI CLI tools. Security teams
      can use --strict as a CI gate when findings are present.
related-packages: []
category: security
package-manager:
  brew: bagel
  debian: bagel
  ubuntu: bagel
package-manager-url: https://formulae.brew.sh/formula/bagel
license: GPL-3.0-or-later
tags:
  - cli
  - secret-detection
  - security
  - supply-chain-security
  - workstation-audit
description: CLI to audit posture and evaluate compromise blast radius
executables:
  - bagel
provenance:
  formula: bagel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
