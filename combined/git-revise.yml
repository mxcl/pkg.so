id: brew:git-revise
display-name: git-revise
homepage: https://github.com/mystor/git-revise
repo: https://github.com/mystor/git-revise
docs:
  - https://git-revise.readthedocs.io/en/latest
  - https://github.com/mystor/git-revise#readme
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
    - ~/.config/git/config
    - /etc/gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      git-revise spread through Python packaging, Homebrew, and distribution packages
      for developers who wanted a faster fixup/split tool without replacing Git itself.
      Its adoption is strongest among users who frequently rewrite local patch series
      before sending them for review.
  package-nerd-significance:
    - >
      The package is notable because it treats Git object manipulation as a focused
      developer-experience problem. It packages an opinionated patch-stack workflow as a
      small subcommand while leaving the repository format and normal Git commands
      unchanged.
  project-history:
    - >
      The project appeared in 2018 under Nika Layzell's authorship and positioned itself
      as an ergonomic alternative to `git rebase` for patch-stack workflows. Its
      documentation emphasizes in-memory merges, preserving index and working-tree
      state, and avoiding unnecessary rebuilds on large codebases.
    - >
      The changelog shows an incremental focus on history-editing ergonomics:
      interactive message editing, improved cut behavior, autosquash configuration,
      support for `git add --patch`, and manpage installation refinements.
  related-projects:
    - >
      Related tools and workflows include `git rebase`, `git commit --fixup`, `git add
      --patch`, patch-stack review flows, and Git object-database libraries.
  sources:
    - https://github.com/mystor/git-revise
    - https://pypi.org/project/git-revise/
    - https://raw.githubusercontent.com/mystor/git-revise/master/CHANGELOG.md
    - https://raw.githubusercontent.com/mystor/git-revise/master/README.md
    - https://raw.githubusercontent.com/mystor/git-revise/master/docs/index.rst
    - https://raw.githubusercontent.com/mystor/git-revise/master/docs/man.rst
  summary:
    - >
      git-revise is a Git subcommand and Python library for updating, splitting, and
      rearranging commits without the heavier working-tree churn of many rebase
      workflows.
  timeline:
    - '2018: GitHub repository created and documentation copyright begins.'
    - '0.4.0: Interactive editing and bulk commit-message editing improved.'
    - '0.5.0: `revise.autoSquash` configuration added.'
    - '0.6.0: `git add --patch` support and manpage installation changes added.'
    - '0.8.0: PyPI release series continued beyond the documented 0.6.0 manual.'
  usage:
    - >
      Practitioners stage changes, run `git revise <target>` to fold those changes into
      an older commit, or use interactive and autosquash modes to edit a stack of
      unpublished commits. It is used beside `git rebase`, not as a full replacement for
      every history-rewriting case.
related-packages:
  - id: brew:git-absorb
    reason: >
      git-absorb automatically maps staged hunks to earlier commits and creates fixup
      commits, while git-revise is preferable when the user wants deliberate splitting,
      rewording, or reordering control.
    rel: alternative
    sources:
      - https://github.com/tummychow/git-absorb
      - https://git-revise.readthedocs.io/en/latest/man.html
  - id: brew:git-branchless
    reason: >
      git-branchless complements git-revise with smart-log, undo, restacking,
      synchronization, and commit-graph navigation around the patch stacks that
      git-revise edits.
    rel: adjacent_workflow
    sources:
      - https://github.com/arxanas/git-branchless/wiki/Related-tools
      - https://github.com/arxanas/git-branchless
      - https://git-revise.readthedocs.io/en/latest/
category: developer-tools
package-manager:
  apk: git-revise
  brew: git-revise
  debian: git-revise
  dnf: git-revise
  nix: git-revise
  pacman: git-revise
  ubuntu: git-revise
package-manager-url: https://formulae.brew.sh/formula/git-revise
license: MIT
tags:
  - cli
  - git
  - history-editing
  - patch-stack
  - rebase
description: Rebase alternative for easy & efficient in-memory rebases and fixups
executables:
  - git-revise
provenance:
  formula: git-revise
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
