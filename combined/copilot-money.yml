history:
  adoption-history:
    - >
      Copilot expanded across iPhone, iPad, Mac, and the web, giving subscribers a
      synchronized view of connected financial accounts. Its onboarding uses imported
      transaction history to suggest categories, budgets, income, and recurring
      payments.
  package-nerd-significance:
    - >
      For package-manager users, Copilot is a notable example of a polished subscription
      service distributed as a native Mac cask even though most of its value depends on
      a hosted account and financial-data integrations rather than local configuration
      files.
  project-history:
    - >
      Copilot Money was founded in 2019 by Andrés Ugarte as a premium personal-finance
      application. Its official materials position it as a unified interface for
      spending, budgets, investments, subscriptions, cash flow, savings, and net worth.
  related-projects:
    - >
      Plaid, Mastercard, MX, and Akoya: aggregation providers that Copilot says it uses
      for supported financial-institution connections.
  sources:
    - https://help.copilot.money/en/articles/10768078-how-do-you-get-my-financial-data
    - https://help.copilot.money/en/articles/11157550-quick-start-guide
    - https://www.copilot.money/faq
  summary:
    - >
      Copilot Money is a subscription personal-finance service that consolidates
      financial accounts and helps users track spending, budgets, investments,
      subscriptions, savings, cash flow, and net worth.
  timeline:
    - '2019: Copilot Money was founded by Andrés Ugarte.'
    - 'Current product: Available in the United States on iPhone, iPad, Mac, and the web.'
  usage:
    - >
      Users create a Copilot account and connect financial institutions during
      onboarding. The service imports available transaction history, proposes categories
      and an initial budget, identifies income and recurring payments, and presents
      ongoing spending, investment, and net-worth views.
