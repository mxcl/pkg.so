id: brew:bar
display-name: bar
homepage: http://www.theiling.de/projects/bar.html
repo: null
docs:
  - http://www.theiling.de/projects/bar.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bar's adoption is narrow but very Unix-shaped: it appears in Homebrew, Debian,
      Ubuntu, and Nix package metadata as a tiny helper for shell scripts rather than as
      a large standalone application.
  package-nerd-significance:
    - >
      bar is interesting because it solves a common packaging-era problem without a
      compiled dependency, curses UI, or modern shell assumptions. It is the sort of
      small, old-school utility that package managers preserve because it remains useful
      in constrained Unix environments.
  project-history:
    - >
      Henrik Theiling's project page frames bar as deliberately minimal shell code that
      needs no compilation and works across sh, ash, ksh, zsh, bash, and related
      Bourne-style shells. The design goal is portability first: when progress display
      cannot be supported safely, the script is intended to fall back toward plain cat
      behavior.
    - >
      The upstream change log records a compact evolution from version 1.0's initial
      release through 1.1 percentage and terminal-width support, 1.2 robustness fixes
      across shells and systems, 1.3 feature additions such as ETA and configurable
      sizing, and 1.4 bug fixes.
  related-projects:
    - >
      bar overlaps with cat, dd, pv, and shell progress-bar snippets, but its upstream
      niche is stricter portability and embeddability in Bourne-shell install scripts.
  sources:
    - http://www.theiling.de/projects/bar.html
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      bar is a small Bourne-shell utility that behaves like cat while showing an ASCII
      progress bar, aimed at portable Unix installation and scripting contexts.
  timeline:
    - 'Version 1.0: Initial beta release.'
    - 'Version 1.1: Adds percentage display and terminal-width detection.'
    - 'Version 1.2: Focuses on robustness across Bourne shells and operating systems.'
    - >
      Version 1.3.1: Adds ETA, quiet mode, size overrides, and script-dumping features
      after a broken 1.3 prerelease.
    - 'Version 1.4: Stable bug-fix release.'
  usage:
    - >
      The typical use is to pipe or copy data while presenting a text progress indicator
      in an install script or other shell workflow. Its upstream page emphasizes
      embedding or reusing the script body in portable installers.
related-packages:
  - id: brew:pv
    reason: >
      Choose pv for richer pipeline monitoring, rate control, file-descriptor watching,
      and configurable displays; choose bar when a minimal, embeddable Bourne-shell
      implementation with no compilation is preferable.
    rel: alternative
    sources:
      - http://www.theiling.de/projects/bar.html
      - https://www.ivarch.com/programs/pv.shtml
      - https://www.ivarch.com/programs/quickref/pv.shtml
