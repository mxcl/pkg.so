history:
  adoption-history:
    - >
      FilePane is sold directly with a trial and is also distributed through Homebrew
      Cask. The vendor supports both Intel and Apple Silicon Macs.
  package-nerd-significance:
    - >
      FilePane represents the macOS tradition of compact workflow utilities that turn
      routine Finder, conversion, and metadata operations into contextual actions.
      Homebrew Cask gives the proprietary desktop application a package-manager
      installation path.
  project-history:
    - >
      MyMixApps developed FilePane as a native macOS drag-and-drop file-management
      utility. The current FilePane 2 interface turns a dragged file, folder, image,
      PDF, text selection, or URL into a type-specific command bar.
    - >
      The version 2 overhaul broadened the application beyond basic file movement with
      configurable action bars, favorite destinations, image and PDF processing,
      metadata removal, media trimming, link capture, sharing, and keyboard-oriented
      operation.
  related-projects:
    - 'Finder: FilePane augments Finder-oriented workflows with contextual actions.'
    - 'PullTube and Shredo: Other macOS utilities from MyMixApps.'
  sources:
    - 'Official FilePane 2 tutorial: https://mymixapps.com/how-filepane-works'
    - 'Official product page: https://mymixapps.com/filepane'
  summary:
    - >
      FilePane is a commercial macOS drag-and-drop utility that presents contextual
      actions for files, folders, images, documents, media, text, and links.
  timeline:
    - >
      FilePane 2: A major overhaul introduced a type-aware command bar and expanded
      media, document, metadata, and link actions.
    - >
      2026: The official site documents FilePane 2 for macOS 13 or later on Intel and
      Apple Silicon.
  usage:
    - >
      Users drag an item to FilePane's drop area and invoke a type-specific action with
      a click or keyboard shortcut. Supported workflows include moving or copying files,
      resizing and converting images, processing PDFs, trimming media, removing
      metadata, exporting text, capturing web pages, sharing, and using favorite
      destination folders.
category: productivity
