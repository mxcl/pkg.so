id: brew:faketty
display-name: faketty
homepage: https://github.com/dtolnay/faketty
repo: https://github.com/dtolnay/faketty
docs:
  - https://github.com/dtolnay/faketty#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      faketty is distributed through Cargo and packaged by Homebrew and Nix according to
      the input metadata. That makes it a small developer-tool package for build logs,
      CI scripts, and command wrappers that need terminal-style output without losing
      stream separation.
  package-nerd-significance:
    - >
      faketty is a concise packaging target because it solves one Unix tooling edge case
      cleanly: preserve terminal behavior for the child process while keeping stdout and
      stderr demultiplexed for logs.
  project-history:
    - >
      The GitHub repository was created in September 2020. Its README frames the tool as
      similar to script(1), but with a key difference: faketty preserves distinct stdout
      and stderr streams instead of merging output through a single pty.
  related-projects:
    - >
      faketty is explicitly related to script(1) and Unix pseudoterminal tooling, but
      exists for the separate-stream logging case that script(1) does not cover.
  sources:
    - https://github.com/dtolnay/faketty
    - https://github.com/dtolnay/faketty#readme
    - https://api.github.com/repos/dtolnay/faketty
    - https://api.github.com/repos/dtolnay/faketty/releases?per_page=5
  summary:
    - >
      faketty is a Rust command wrapper that runs another command inside a
      pseudoterminal even when stdout or stderr are redirected.
  timeline:
    - '2020-09: The GitHub repository is created.'
    - '2026-01: Version 1.0.20 is published on GitHub releases.'
  usage:
    - >
      The documented example wraps a build command such as bazel build while redirecting
      stdout and stderr to separate log files. This keeps programs that detect terminals
      from disabling colors, progress bars, or other tty-dependent behavior.
related-packages: []
category: developer-tools
package-manager:
  brew: faketty
  nix: faketty
package-manager-url: https://formulae.brew.sh/formula/faketty
license: Apache-2.0 OR MIT
tags:
  - cli
  - command-wrapper
  - pty
  - terminal
description: Wrapper to exec a command in a pty, even if redirecting the output
executables:
  - faketty
provenance:
  formula: faketty
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
