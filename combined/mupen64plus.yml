id: brew:mupen64plus
display-name: Mupen64Plus
homepage: https://www.mupen64plus.org/
repo: https://github.com/mupen64plus/mupen64plus-core
docs:
  - https://mupen64plus.org/docs
  - https://www.mupen64plus.org/wiki/index.php/Mupen64Plus
config-file-location:
  linux: ~/.config/mupen64plus/mupen64plus.cfg
credentials-file-location: null
history:
  project-history:
    - >
      Technically, Mupen64Plus is built around a core emulator plus plugins for the
      Nintendo 64's major subsystems: MIPS R4300 CPU emulation, graphics/RDP,
      signal-processor/RSP, audio, and input. The official site highlights multiple CPU
      emulators and dynamic recompilers for x86 and amd64, with OpenGL video plugins
      such as RiceVideo and maintained third-party options. This split lets users trade
      accuracy, speed, and compatibility by swapping video or RSP plugins.
  sources:
    - https://en.wikipedia.org/wiki/Mupen64Plus
    - https://formulae.brew.sh/formula/mupen64plus
    - https://github.com/libretro/mupen64plus-libretro-nx
    - https://github.com/mupen64plus/mupen64plus-core
    - https://m64py.sourceforge.net/
    - https://mupen64plus.org/
    - https://mupen64plus.org/wiki/index.php/ThirdPartyPlugins
    - https://wiki.debian.org/Mupen64Plus
  summary:
    - >
      Mupen64Plus is the maintained, cross-platform continuation of the Mupen64 Nintendo
      64 emulator line. The emulator's public history starts with MUPEN64 releases in
      2001, then moves through names such as Mupen64-64bit and Mupen64-amd64 before the
      Mupen64Plus project consolidated around a portable, plugin-based architecture. A
      major redesign of the plugin API landed around the 1.99 beta series in late 2009,
      moving user-interface concerns out of plugins and into a separate front-end layer
      so the core could serve Linux, macOS, Windows, and other ports more cleanly.
  usage:
    - >
      The package is usually used as a command-line emulator backend, with configuration
      under the user's config directory and graphical front ends layered on top.
      Debian's wiki notes that Mupen64Plus runs from the command line by default and
      points GUI users to front ends such as mupen64plus-qt or M64Py; the wider
      ecosystem also includes Android and libretro-derived ports. In package-manager
      terms it fills the open-source, cross-platform N64 emulator niche next to
      Project64, with stronger emphasis on modular plugins and Unix-friendly packaging.
related-packages:
  - id: cask:retroarch-metal
    reason: >
      Choose RetroArch when you want one graphical frontend for many emulator cores; its
      Mupen64Plus-Next core adds RetroArch features such as remapping, rewind, and
      achievement support.
    rel: alternative
    sources:
      - https://docs.libretro.com/library/mupen64plus/
      - https://www.retroarch.com/
category: games
