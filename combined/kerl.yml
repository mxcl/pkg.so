id: brew:kerl
display-name: kerl
homepage: https://github.com/kerl/kerl
repo: https://github.com/kerl/kerl
docs:
  - https://github.com/kerl/kerl#readme
config-file-location:
  unix: ~/.kerlrc
credentials-file-location: null
history:
  adoption-history:
    - >
      kerl became a durable part of Erlang and Elixir development because it solved the
      practical problem of compiling many OTP versions with different configure options.
      The asdf-erlang plugin explicitly says it relies on kerl for builds and combines
      kerl's compatibility/build scripts with asdf's version-switching UX.
    - >
      On 2026-07-01, GitHub API metadata reported 1,660 stars and 236 forks, and
      Homebrew metadata listed kerl 4.4.0.
  package-nerd-significance:
    - >
      kerl is significant because it is small shell code that encodes years of
      Erlang/OTP build knowledge. It sits between language-runtime packaging and
      developer version management, much like ruby-build or pyenv installers do for
      their ecosystems.
  project-history:
    - >
      The kerl/kerl repository was created on GitHub on 2011-07-05. Its README describes
      a shell-agnostic tool whose direct dependencies are curl and git, excluding the
      system packages needed to compile Erlang/OTP itself.
    - >
      kerl's design centers on separating builds from installations: once a particular
      OTP release is built, the build can be installed quickly into one or more
      destinations and activated per shell session.
  related-projects:
    - Erlang/OTP is the runtime kerl builds and installs.
    - >
      asdf-erlang relies on kerl for Erlang builds while adding asdf's .tool-versions
      workflow.
    - Homebrew packages kerl directly for macOS users.
  sources:
    - https://api.github.com/repos/kerl/kerl
    - https://api.github.com/repos/kerl/kerl/releases?per_page=10
    - https://formulae.brew.sh/api/formula/kerl.json
    - https://github.com/erlang/otp
    - https://github.com/kerl/kerl
    - https://raw.githubusercontent.com/asdf-vm/asdf-erlang/master/README.md
    - https://raw.githubusercontent.com/kerl/kerl/master/README.md
    - https://www.erlang.org/downloads
  summary:
    - >
      kerl is a POSIX-shell tool for building, installing, activating, deploying, and
      managing Erlang/OTP installations from source.
  timeline:
    - '2011-07-05: kerl/kerl repository created on GitHub.'
    - '2023-10-12: 4.0.0 release published.'
    - '2025-06-19: 4.4.0 release published.'
    - '2026-07-01: Homebrew formula metadata listed kerl 4.4.0.'
  usage:
    - >
      Users run kerl list releases, kerl build, kerl install, and shell activation
      scripts to work with specific Erlang/OTP versions. The README also documents
      building from the official Erlang/OTP GitHub tags, official Erlang downloads, or
      arbitrary Git refs and forks.
    - >
      In package-manager workflows, kerl is often the lower-level build engine beneath
      friendlier version managers, especially when macOS, Linux distro, OpenSSL,
      wxWidgets, or documentation-build quirks matter.
related-packages:
  - id: brew:asdf
    reason: >
      Choose asdf when you want project-level .tool-versions switching across multiple
      language ecosystems; its official Erlang plugin uses kerl as the underlying OTP
      build engine.
    rel: alternative
    sources:
      - https://github.com/asdf-vm/asdf-erlang
      - https://asdf-vm.com/guide/getting-started.html
  - id: brew:erlang
    reason: >
      Choose the packaged Erlang/OTP runtime when one system-managed installation is
      sufficient; use kerl when you need custom builds or several independently
      activated OTP installations.
    rel: alternative
    sources:
      - https://github.com/kerl/kerl
      - https://www.erlang.org/docs
category: language-runtime
package-manager:
  brew: kerl
package-manager-url: https://formulae.brew.sh/formula/kerl
license: MIT
tags:
  - build-tool
  - cli
  - erlang
  - otp
  - runtime-installer
  - version-manager
description: Easy building and installing of Erlang/OTP instances
executables:
  - kerl
provenance:
  formula: kerl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
