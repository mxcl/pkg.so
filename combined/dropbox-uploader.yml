id: brew:dropbox-uploader
display-name: Dropbox Uploader
homepage: https://www.andreafabrizi.it/2016/01/01/Dropbox-Uploader/
repo: https://github.com/andreafabrizi/Dropbox-Uploader
docs:
  - https://github.com/andreafabrizi/Dropbox-Uploader/wiki
  - https://github.com/andreafabrizi/Dropbox-Uploader#readme
config-file-location:
  unix: ~/.dropbox_uploader
credentials-file-location:
  unix: ~/.dropbox_uploader
history:
  adoption-history:
    - >
      Dropbox Uploader found a niche with headless machines, NAS boxes, backup scripts,
      Raspberry Pi setups, and cross-platform shells. The official tested-environment
      list includes GNU/Linux, FreeBSD, macOS, Windows/Cygwin, and Raspberry Pi, which
      explains why a Homebrew package remains useful even though the tool is only a
      script.
  package-nerd-significance:
    - >
      For package nerds, Dropbox Uploader is a classic single-script utility: no daemon,
      no GUI, no SDK install, just Bash, cURL, and a config file. It matters because it
      preserves a scriptable Dropbox workflow for environments where official desktop
      sync is the wrong shape.
  project-history:
    - >
      The project grew around a simple Unix idea: use a shell script plus cURL to talk
      to Dropbox from systems where a GUI client is unavailable or inappropriate. Its
      README now documents Dropbox API v2 authentication, a first-run configuration
      wizard, and storage of access configuration in `~/.dropbox_uploader`.
  related-projects:
    - Dropbox itself provides the storage and API surface.
    - cURL is the only required command-line dependency called out by the project.
    - The project's GitHub wiki collects examples and usage tips around the script.
  sources:
    - https://github.com/andreafabrizi/Dropbox-Uploader
    - https://github.com/andreafabrizi/Dropbox-Uploader/blob/master/README.md
    - https://github.com/andreafabrizi/Dropbox-Uploader/wiki
  summary:
    - >
      Dropbox Uploader is a Bash-and-cURL command-line script for uploading,
      downloading, listing, sharing, monitoring, and otherwise managing Dropbox files
      from a shell. Its package-manager appeal is that it turns Dropbox access into one
      portable script rather than a desktop sync client or heavier SDK application.
  timeline:
    - '2010s: Dropbox Uploader becomes a popular shell-script interface to Dropbox.'
    - >
      Later: The project moves to Dropbox API v2 authentication and documents a
      first-run configuration wizard.
    - >
      README era: The README points users to the GitHub wiki for tips and contributed
      examples.
  usage:
    - >
      Common usage is automation-friendly file transfer: upload backups, download
      artifacts, list remote folders, create share links, monitor remote paths for
      changes, and unlink credentials. The first run guides the user through OAuth-style
      setup without storing the Dropbox account password.
related-packages:
  - id: brew:rclone
    reason: >
      Choose rclone when you need Dropbox plus synchronization, mounting, or portability
      across many storage providers; choose Dropbox Uploader for a small Bash-and-cURL
      script dedicated to Dropbox operations.
    rel: alternative
    sources:
      - https://github.com/andreafabrizi/Dropbox-Uploader#readme
      - https://rclone.org/dropbox/
      - https://rclone.org/docs/
category: productivity
package-manager:
  brew: dropbox-uploader
package-manager-url: https://formulae.brew.sh/formula/dropbox-uploader
license: GPL-3.0-or-later
tags:
  - bash
  - cli
  - cloud-storage
  - dropbox
  - file-transfer
description: Bash script for interacting with Dropbox
executables:
  - dropShell.sh
  - dropbox_uploader.sh
provenance:
  formula: dropbox-uploader
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
