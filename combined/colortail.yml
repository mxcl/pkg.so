id: brew:colortail
display-name: Colortail
homepage: https://github.com/joakim666/colortail
repo: https://github.com/joakim666/colortail
docs:
  - https://github.com/joakim666/colortail#readme
config-file-location:
  unix: ~/.colortail/
credentials-file-location: null
history:
  adoption-history:
    - >
      The README credits external patches for multicolored lines, FreeBSD and OpenBSD
      compatibility, Debian packaging, and 64-bit testing. The supplied package-manager
      metadata lists Homebrew, Debian, and Ubuntu, reflecting a small but persistent
      Unix utility footprint.
  package-nerd-significance:
    - >
      Colortail is package-nerd useful because it preserves the mental model of `tail
      -f` while adding configurable color rules. It predates many modern log viewers and
      remains a compact example of log highlighting as a Unix filter-style tool.
  project-history:
    - >
      Joakim Ek's README says the idea came from watching multiple log files in an IRC
      session and wanting unusual lines to stand out quickly. Version 0.1 used a simpler
      wildcard-style configuration, version 0.2 moved to regular expressions, and later
      patch activity led to a C++ rewrite.
  related-projects:
    - >
      Colortail is directly related to `tail`, `regex(7)`, syslog-style log files, and
      terminal color highlighting tools.
  sources:
    - https://github.com/joakim666/colortail
    - https://raw.githubusercontent.com/joakim666/colortail/master/README
  summary:
    - >
      Colortail is a Unix log-watching utility that follows files like `tail` while
      applying colors to lines or line fragments matched by regular expressions.
  timeline:
    - '2000s: Initial versions evolved from wildcard matching to regular-expression matching.'
    - '2009: README for Colortail 0.3.5 carries Joakim Ek copyright notice.'
    - '2009: README credits Debian packaging and portability patches from contributors.'
  usage:
    - >
      Users run `colortail` against one or more log files and pass config files with
      `-k`; a single config can apply globally, or multiple comma-separated configs can
      be mapped to multiple tailed files.
related-packages:
  - id: brew:tailspin
    reason: >
      Choose tailspin for automatic highlighting of common log tokens and built-in pager
      and follow behavior; choose Colortail when you want explicit regular-expression
      color rules per file.
    rel: alternative
    sources:
      - https://github.com/joakim666/colortail#readme
      - https://github.com/bensadeh/tailspin#readme
  - id: brew:grc
    reason: >
      Choose grc when you want a general wrapper that colorizes many commands and
      streams, while Colortail is specialized around following log files.
    rel: alternative
    sources:
      - https://github.com/joakim666/colortail#readme
      - https://github.com/garabik/grc#readme
  - id: brew:lnav
    reason: >
      Choose lnav when interactive navigation, chronological merging, filtering, and
      SQL-backed log analysis matter more than Colortail's lightweight configurable
      highlighting.
    rel: alternative
    sources:
      - https://github.com/joakim666/colortail#readme
      - https://docs.lnav.org/en/latest/
category: system
package-manager:
  brew: colortail
  debian: colortail
  ubuntu: colortail
package-manager-url: https://formulae.brew.sh/formula/colortail
license: GPL-2.0-or-later
tags:
  - cli
  - color-output
  - logs
  - regular-expressions
  - tail
  - terminal
description: Like tail(1), but with various colors for specified output
executables:
  - colortail
provenance:
  formula: colortail
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
