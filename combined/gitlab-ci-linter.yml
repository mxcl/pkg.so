id: brew:gitlab-ci-linter
display-name: gitlab-ci-linter
homepage: https://gitlab.com/orobardet/gitlab-ci-linter
repo: https://gitlab.com/orobardet/gitlab-ci-linter
docs:
  - https://gitlab.com/orobardet/gitlab-ci-linter/-/blob/master/README.md
config-file-location: null
credentials-file-location:
  unix: ~/.netrc
  windows: ~/_netrc
history:
  adoption-history:
    - >
      Adoption appears specialized: the GitLab project metadata collected for this
      enrichment reported 53 stars. Its practical audience is teams that want local or
      pre-commit validation against gitlab.com or a private GitLab instance rather than
      waiting for a failed pipeline.
  package-nerd-significance:
    - >
      For package-manager users, gitlab-ci-linter is a classic sharp-edged CLI: a
      cross-platform binary, a narrow API-backed job, and enough configuration to work
      with self-hosted GitLab. It fills the gap between static YAML syntax checks and a
      real GitLab CI validation request.
  project-history:
    - >
      The GitLab project was created in March 2017. Its README makes the architectural
      boundary explicit: the tool does not implement its own GitLab CI linter, but
      delegates validation to the GitLab API that belongs to the target project.
    - >
      The project adapted to GitLab API evolution after the older `/ci/lint` endpoint
      was deprecated in GitLab 15.7 and removed in GitLab 16.0; the README documents use
      of the `projects/:project_path_or_id/ci/lint` endpoint and project path or project
      ID options.
  related-projects:
    - >
      Related projects and services include GitLab CI, GitLab's CI lint API, the
      `pre-commit` framework, Cloudsmith packages, and Docker-based CLI distribution.
  sources:
    - https://docs.gitlab.com/ee/api/lint.html
    - https://formulae.brew.sh/formula/gitlab-ci-linter
    - https://gitlab.com/api/v4/projects/orobardet%2Fgitlab-ci-linter
    - https://gitlab.com/orobardet/gitlab-ci-linter
    - https://gitlab.com/orobardet/gitlab-ci-linter/-/raw/master/README.md
  summary:
    - >
      gitlab-ci-linter is a small Go command-line tool that validates a local
      `.gitlab-ci.yml` file by calling a GitLab instance's CI lint API. It is designed
      to catch invalid GitLab CI configuration before a developer commits or pushes
      changes.
  timeline:
    - '2017: GitLab project created.'
    - "2017: README documented local `.gitlab-ci.yml` validation through GitLab's lint API."
    - '2022: GitLab 15.7 deprecated the older `/ci/lint` endpoint.'
    - >
      2023: GitLab 16.0 removed the older endpoint, leading the tool's documented flow
      to use the project-scoped lint endpoint.
  usage:
    - >
      Practitioners run `gitlab-ci-linter` from inside a Git repository with a GitLab
      origin and a `.gitlab-ci.yml` file. The README documents installation as a Git
      pre-commit hook, optional use through the `pre-commit` framework, explicit GitLab
      URL and project options, and authentication through a personal access token or
      `.netrc` account field.
related-packages:
  - id: brew:glab
    reason: >
      Choose GitLab's official, broader CLI when you want CI linting together with
      authenticated pipeline, merge-request, issue, and repository workflows.
    rel: alternative
    sources:
      - https://gitlab.com/gitlab-org/cli/-/blob/main/docs/source/ci/lint.md
      - https://gitlab.com/orobardet/gitlab-ci-linter/-/blob/master/README.md
  - id: brew:gitlab-ci-local
    reason: >
      Choose GitLab CI Local when you need to execute jobs with shell or Docker locally
      rather than only submit configuration to GitLab's authoritative lint API.
    rel: alternative
    sources:
      - https://github.com/firecow/gitlab-ci-local
      - https://gitlab.com/orobardet/gitlab-ci-linter/-/blob/master/README.md
category: developer-tools
package-manager:
  brew: gitlab-ci-linter
  nix: gitlab-ci-linter
package-manager-url: https://formulae.brew.sh/formula/gitlab-ci-linter
license: MIT
tags:
  - ci
  - cli
  - gitlab
  - linter
  - yaml
description: Command-line tool to lint GitLab CI YAML files
executables:
  - gitlab-ci-linter
provenance:
  formula: gitlab-ci-linter
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
