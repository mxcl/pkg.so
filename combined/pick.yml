id: brew:pick
display-name: pick
homepage: https://github.com/mptre/pick
repo: https://github.com/mptre/pick
docs:
  - https://github.com/mptre/pick#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents distribution through Debian, Ubuntu, Fedora, several BSD
      package systems, Homebrew, and MacPorts, among others. It identifies availability
      beginning with Debian 9 and Ubuntu 16.04 LTS.
  package-nerd-significance:
    - >
      pick exemplifies Unix pipeline composition: an interactive terminal interface
      consumes standard input and emits the selected value on standard output.
  project-history:
    - >
      The manual credits Calle Erlandsson and Anton Lindqvist and dates the first
      release to August 18, 2014. Development received thoughtbot sponsorship from the
      project’s beginning until September 2016.
  related-projects:
    - The official README links pick.vim for integration with Vim.
  sources:
    - >
      [Official README](https://github.com/mptre/pick#readme): package adoption,
      pipeline examples, and Vim integration.
    - >
      [Official manual](https://github.com/mptre/pick/blob/master/pick.1): authors and
      release history.
  summary:
    - pick is a terminal fuzzy-selection utility for choosing an item from a supplied list.
  timeline:
    - '2014: First release on August 18.'
    - '2016: thoughtbot sponsorship ended in September.'
  usage:
    - >
      Pipe choices into pick and use its output in another command or subshell. Its
      curses interface supports fuzzy searching and keyboard navigation.
category: productivity
package-manager:
  apk: pick
  brew: pick
  debian: pick
  dnf: pick
  macports: pick
  nix: pick
  ubuntu: pick
  winget: aryanbhosale.pick
package-manager-url: https://formulae.brew.sh/formula/pick
license: MIT
tags:
  - cli
  - fuzzy-finder
  - terminal
  - text-selection
  - unix-pipeline
description: Utility to choose one option from a set of choices
executables:
  - pick
provenance:
  formula: pick
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
