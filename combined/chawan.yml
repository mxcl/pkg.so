id: brew:chawan
display-name: Chawan
homepage: https://sr.ht/~bptato/chawan/
repo: https://git.sr.ht/~bptato/chawan
docs:
  - https://chawan.net/doc/cha/cha.html
  - https://chawan.net/doc/cha/config.html
  - https://chawan.net/doc/index.html
config-file-location:
  unix:
    - $CHA_DIR/config.toml
    - ${XDG_CONFIG_HOME:-~/.config}/chawan/config.toml
    - ~/.chawan/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site lists volunteer-maintained stable packages for Alpine Linux,
      Arch Linux, Debian testing, FreeBSD, Gentoo guru, Homebrew, NixOS, Slackware, and
      Void Linux, plus unstable packages through AUR, AppImage, Gentoo live ebuild, and
      Homebrew HEAD. That breadth is unusual for a young terminal browser and makes its
      packaging story part of the project identity.
  package-nerd-significance:
    - >
      Chawan is significant to package nerds because it revives the terminal-browser
      category with modern packaging friction: image protocols, QuickJS, sandboxing,
      Nim, multiple Unix distributions, and headless rendering all need to be expressed
      cleanly in distro formulas. It is also interesting as a modern counterpart to
      older text browsers such as w3m while using newer terminal capabilities.
  project-history:
    - >
      Chawan is developed primarily in Nim and hosted on SourceHut, with Codeberg listed
      as another source mirror. The official news archive begins with the 0.2.0 release
      in June 2025 and shows active 0.3 and 0.4 releases through June 2026.
  related-projects:
    - Chame is Chawan's HTML5 parser subproject.
    - Chagashi is a related pure-Nim character coding library.
    - Monoucha is a related QuickJS binding generator and runtime glue project.
    - w3m and vi are cited by the official site as UI inspirations.
  sources:
    - https://chawan.net/
    - https://chawan.net/news/index.html
    - https://chawan.net/doc/cha/cha.html
    - https://chawan.net/doc/cha/config.html
    - https://git.sr.ht/~bptato/chawan
  summary:
    - >
      Chawan is a Unix-like text-mode web browser and pager that aims to implement
      modern web standards in a self-contained terminal browser, including CSS, optional
      inline images, and optional JavaScript.
  timeline:
    - '2025-06: Official news archive lists Chawan 0.2.0.'
    - '2025-11: Official news archive lists Chawan 0.3.0.'
    - '2026-05: Official news archive lists Chawan 0.4.0.'
    - '2026-06: Official news archive lists Chawan 0.4.3.'
  usage:
    - >
      The `cha` command opens URLs and files, can act as a pager, supports web, SFTP,
      FTP, gopher, gemini, file, finger, and spartan browsing, and can dump rendered
      content when stdout is not a TTY. The config documentation defines the canonical
      `~/.chawan/config.toml` path and XDG/`CHA_DIR` alternatives.
related-packages:
  - id: brew:w3m
    reason: >
      Choose w3m for the established lightweight pager and text-browser workflow; choose
      Chawan for newer CSS, JavaScript, sandboxing, and terminal-image capabilities.
    rel: alternative
    sources:
      - https://chawan.net/
      - https://w3m.sourceforge.net/MANUAL
  - id: brew:felinks
    reason: >
      Choose felinks for the maintained ELinks lineage and a mature character-mode
      browsing interface; choose Chawan for its from-scratch engine and stronger
      modern-web ambitions.
    rel: alternative
    sources:
      - https://chawan.net/
      - https://github.com/rkd77/elinks#readme
  - id: brew:links
    reason: >
      Choose Links when its mature text and graphical modes fit the environment; choose
      Chawan for programmable JavaScript keybindings, modern CSS layout, and Kitty or
      Sixel inline images.
    rel: alternative
    sources:
      - https://chawan.net/
      - https://links.twibright.com/user_en.html
  - id: brew:lynx
    reason: >
      Choose Lynx for a long-established, broadly portable text-only browser; choose
      Chawan when CSS layout, images, optional page JavaScript, and newer protocols are
      required.
    rel: alternative
    sources:
      - https://chawan.net/
      - https://lynx.invisible-island.net/lynx_help/Lynx_users_guide.html
category: networking
package-manager:
  apk: chawan
  brew: chawan
  nix: chawan
  pacman: chawan
  zypper: chawan
package-manager-url: https://formulae.brew.sh/formula/chawan
license: Unlicense
tags:
  - cli
  - css
  - inline-images
  - javascript
  - terminal
  - tui
  - web-browser
description: TUI web browser with CSS, inline image and JavaScript support
executables:
  - cha
  - mancha
provenance:
  formula: chawan
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
