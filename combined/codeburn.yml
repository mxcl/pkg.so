id: brew:codeburn
display-name: CodeBurn
homepage: https://codeburn.app/
repo: https://github.com/getagentseal/codeburn
docs:
  - https://github.com/getagentseal/codeburn#readme
config-file-location:
  unix:
    - ~/.config/codeburn/config.json
    - ~/.config/codeburn/guard.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents `npx codeburn`, global npm installation, Bun/Deno-style
      runners, and `brew install codeburn` on macOS. The input package facts currently
      list Homebrew packaging.
    - >
      Because CodeBurn targets local files created by other AI coding tools, its
      adoption story is tied to the spread of agentic coding CLIs and editors rather
      than to one language ecosystem.
  package-nerd-significance:
    - >
      CodeBurn is notable as packaging infrastructure for the AI-coding era: it treats
      token logs and session files like operational telemetry and ships through
      npm-style runners and Homebrew. For package nerds, the interesting part is how a
      Node CLI, local dashboard, native menubar app, and Homebrew formula package one
      local observability workflow.
  project-history:
    - >
      The GitHub repository was created on 2026-04-13. Its README describes the project
      as a free, open-source, local tool for tracking AI coding token usage and cost
      across Claude Code, Cursor, Codex, Gemini, Grok, and other tools.
    - >
      Early releases moved quickly in April 2026, with the release metadata showing
      v0.7.0 adding `codeburn optimize` and adjacent macOS menubar releases appearing
      the same week.
  related-projects:
    - >
      The README names Claude Code, Cursor, Codex, Gemini, Grok, and LiteLLM in the
      supported-tooling story. The macOS menubar app lives in the same repository under
      `mac/` according to the README.
  sources:
    - https://github.com/getagentseal/codeburn
  summary:
    - >
      CodeBurn is a local-first CLI, TUI, web dashboard, and macOS menubar tool for
      analyzing token usage and cost across AI coding tools. It reads session files
      already written on disk and reports spend by tool, model, task, and project.
  timeline:
    - '2026-04-13: GitHub repository created.'
    - '2026-04-16: v0.7.0 release metadata names `codeburn optimize`.'
    - '2026-04-18 to 2026-04-19: Multiple macOS menubar releases published.'
    - '2026: README documents npm, npx, Bun/Deno-style runners, and Homebrew installation.'
  usage:
    - >
      Users run `npx codeburn` or `codeburn` to open an interactive dashboard, `codeburn
      overview` for reports, `codeburn optimize` for waste findings, `codeburn compare`
      for model comparisons, `codeburn yield` to correlate sessions with git commits,
      and `codeburn web` for a localhost dashboard.
    - >
      The README stresses local operation: no wrapper, proxy, or API keys, with pricing
      sourced from LiteLLM and refreshed daily.
related-packages:
  - id: brew:ccusage
    reason: >
      Choose ccusage for a read-only, report-focused CLI with daily, weekly, monthly,
      and session views across coding agents; choose CodeBurn for broader dashboards,
      optimization findings, quota views, git-aware analysis, and desktop integrations.
    rel: alternative
    sources:
      - https://ccusage.com/guide/
      - https://github.com/getagentseal/codeburn
category: ai
package-manager:
  brew: codeburn
package-manager-url: https://formulae.brew.sh/formula/codeburn
license: MIT
tags:
  - ai
  - ai-coding
  - cli
  - cost-observability
  - token-usage
  - tui
description: See where your AI coding tokens go - by task, tool, model, and project
executables:
  - codeburn
provenance:
  formula: codeburn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
