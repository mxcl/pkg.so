id: brew:bcftools
display-name: bcftools
homepage: https://www.htslib.org/
repo: https://github.com/samtools/bcftools
docs:
  - https://samtools.github.io/bcftools/bcftools.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The 2021 GigaScience paper by the SAMtools/BCFtools authors describes SAMtools and
      BCFtools as widely used programs for processing and analysing high-throughput
      sequencing data, first appearing online 12 years earlier and used in many other
      projects and genomic pipelines.
    - >
      The same paper reports that both SAMtools and BCFtools had been installed more
      than one million times via Bioconda, making bcftools a rare CLI package whose
      package-manager footprint maps directly to scientific infrastructure.
  package-nerd-significance:
    - >
      bcftools is package-nerd significant because it is a dependency-shaped scientific
      standard: small enough to install as a CLI, but central enough that entire
      variant-calling workflows assume it is available and versioned consistently.
    - >
      It is also a good example of package-manager science: Homebrew, Debian, Fedora,
      MacPorts, Nix, Ubuntu, and Bioconda-style environments turn a research-code
      lineage into a reproducible command people can pin in workflows, containers, and
      clusters.
    - >
      The BCF/VCF domain makes versioning matter. File formats, reference assumptions,
      compression/indexing via HTSlib, and pipeline reproducibility all mean bcftools is
      not just a convenience binary; it is part of the scientific record for many
      analyses.
  project-history:
    - >
      BCFtools grew out of the SAMtools ecosystem for high-throughput sequencing data.
      The upstream README says it implements utilities for variant calling, in
      conjunction with SAMtools, and for manipulating VCF and BCF files, with the
      intention of replacing Perl-based tools from vcftools.
    - >
      The Samtools project now presents three related repositories: Samtools for
      SAM/BAM/CRAM, BCFtools for BCF2/VCF/gVCF and variant calling/filtering/summarising
      SNPs and short indels, and HTSlib as the underlying C library.
  related-projects:
    - SAMtools handles SAM/BAM/CRAM operations in the same project family.
    - HTSlib is the C library used internally for high-throughput sequencing formats.
    - >
      vcftools is the older Perl-based toolkit that bcftools was intended to replace for
      many VCF/BCF operations.
    - >
      Bioconda, workflow engines, and containerized genomics environments are major
      adoption channels.
  sources:
    - https://doi.org/10.1093/gigascience/giab008
    - https://github.com/samtools/bcftools
    - https://samtools.github.io/bcftools/bcftools.html
    - https://www.htslib.org/
    - source_facts.package-manager
  summary:
    - >
      bcftools is one of the core command-line toolkits of modern genomics: it reads,
      writes, filters, queries, summarizes, and calls variants in VCF, BCF, and gVCF
      formats.
  timeline:
    - "2009: SAMtools/BCFtools lineage begins, per the 2021 'Twelve years' project history."
    - '2013: Official GitHub bcftools repository created.'
    - "2021: GigaScience publishes 'Twelve years of SAMtools and BCFtools'."
    - >
      2020s: bcftools continues as part of the Samtools/HTSlib ecosystem and remains
      broadly packaged.
  usage:
    - >
      bcftools is used for file-format conversion and manipulation, sorting, querying,
      statistics, variant calling, filtering, and effect analysis. In pipelines it
      commonly appears after alignment and BAM/CRAM processing, where it calls or
      filters variants into VCF/BCF outputs.
    - >
      The executable is usually scripted rather than used as a single monolithic
      command: subcommands such as view, query, filter, stats, mpileup, call, norm,
      annotate, merge, and concat make it a toolkit for repeatable genomics workflows.
related-packages:
  - id: brew:samtools
    reason: >
      Use SAMtools to prepare, inspect, sort, and index SAM/BAM/CRAM alignments before
      BCFtools performs variant calling or downstream VCF/BCF processing.
    rel: adjacent_workflow
    sources:
      - https://samtools.github.io/
      - https://academic.oup.com/gigascience/article/10/2/giab008/6137722
  - id: brew:htslib
    reason: >
      HTSlib is the official low-level C library behind the ecosystem and is the
      appropriate companion when an application needs programmatic access to sequencing
      formats rather than only BCFtools commands.
    rel: adjacent_workflow
    sources:
      - https://www.htslib.org/
      - https://academic.oup.com/gigascience/article/10/2/giab008/6137722
  - id: brew:vcftools
    reason: >
      VCFtools is an alternative suite for VCF analysis, while BCFtools provides
      integrated VCF/BCF manipulation and variant calling and was explicitly developed
      to replace many older Perl-based operations.
    rel: alternative
    sources:
      - https://vcftools.github.io/
      - https://github.com/samtools/bcftools
category: science
