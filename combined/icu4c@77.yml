id: brew:icu4c@77
display-name: ICU4C 77
homepage: https://icu.unicode.org/home
repo: https://github.com/unicode-org/icu
docs:
  - https://unicode-org.github.io/icu
  - https://unicode-org.github.io/icu-docs
  - https://unicode-org.github.io/icu/download/77.html
  - https://unicode-org.github.io/icu/userguide
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The ICU home page identifies ICU as a premier library for software
      internationalization and lists adoption across products from IBM, Google, Apple,
      Microsoft, Adobe, and others. That makes the package unusually important for
      dependency graphs: many users never call ICU directly but rely on it through a
      runtime or platform.
    - >
      Homebrew's icu4c@77 formula packages the 77.1 source release from the Unicode
      GitHub repository. The versioned formula matters because ABI and data changes in
      ICU can affect large dependency trees, so package managers often keep older major
      ICU branches installable during transitions.
  package-nerd-significance:
    - >
      ICU is one of the load-bearing libraries of open-source packaging. A small version
      bump can trigger rebuilds across language runtimes, GUI stacks, browsers, database
      clients, and text-processing tools because Unicode data and binary compatibility
      ripple outward.
    - >
      The @77 suffix is package-manager-significant: it signals a versioned keg used to
      keep a particular ICU ABI/data line available while the unversioned formula can
      move on.
  project-history:
    - >
      ICU began at Taligent. The ICU user guide says the Taligent team later became the
      Unicode group at IBM's Globalization Center of Competency in Cupertino, with input
      from the open-source community worldwide.
    - >
      The early Java internationalization classes from Taligent were incorporated into
      JDK 1.1, then ported to C++ and later partly to C. That history explains ICU's
      paired identity: ICU4J for Java and ICU4C for C/C++ share goals but expose
      language-appropriate APIs.
    - >
      ICU4C developed into the portable C/C++ globalization substrate used by language
      runtimes, browsers, operating systems, databases, and application frameworks that
      need consistent Unicode behavior across platforms.
  related-projects:
    - >
      Related projects include ICU4J, CLDR, Unicode, Java internationalization APIs,
      Android globalization support, Apple platform internationalization, Microsoft
      globalization APIs, HarfBuzz-adjacent text stacks, and language runtimes that link
      ICU for locale-sensitive behavior.
  sources:
    - >
      Homebrew metadata documents the versioned formula, description, source archive,
      executables, and installation packaging.
    - >
      The ICU 77 download page documents release date, CLDR 47 data, 77.1 version
      number, release focus, platform support, and download locations.
    - >
      The ICU user guide documents origins at Taligent, the IBM/Unicode transition, Java
      and C/C++ ports, and ICU4J/ICU4C goals.
  summary:
    - >
      ICU4C 77 is the C/C++ side of International Components for Unicode, the Unicode
      Consortium's mature library family for Unicode, locale, and globalization support.
  timeline:
    - '1990s: Taligent develops the internationalization technology that becomes ICU.'
    - '1997: Taligent Java internationalization classes are incorporated into JDK 1.1.'
    - 'Late 1990s: The technology is ported to C++ and C, forming ICU4C alongside ICU4J.'
    - '2025-03-13: ICU 77.1 is released with CLDR 47 locale data.'
    - >
      2025: Homebrew packages the versioned icu4c@77 formula from the release-77-1
      source archive.
  usage:
    - >
      ICU provides Unicode and globalization services such as conversion, collation,
      normalization, formatting, calendars, time zones, boundary analysis, regular
      expressions, and locale data. ICU4C exposes these services to C and C++ programs
      and ships command-line tools such as uconv, genrb, icupkg, and icuinfo through the
      Homebrew formula.
    - >
      ICU 77 updates ICU locale data to CLDR 47, focuses on bug fixes, segmentation
      conformance, and refinements, and marks the initial 77.1 release date as
      2025-03-13.
related-packages: []
