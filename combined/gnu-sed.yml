id: brew:gnu-sed
display-name: GNU sed
homepage: https://www.gnu.org/software/sed/
repo: https://git.savannah.gnu.org/cgit/sed.git
docs:
  - https://www.gnu.org/software/sed/manual/sed.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      sed is a standard part of shell programming culture, and GNU sed became the
      expected sed on many GNU/Linux systems. Its behavior also matters on macOS and BSD
      systems because developers often install GNU sed through package managers when
      scripts depend on GNU extensions rather than the platform sed.
  package-nerd-significance:
    - >
      GNU sed is a package-ecosystem stress test because tiny semantic differences
      affect thousands of scripts. Options such as -i, -E, -z, --posix, and --sandbox
      are small command-line details that determine whether a script is portable,
      GNU-specific, or safer to run on generated input.
  project-history:
    - >
      GNU sed carries forward the sed model of scripted, line-oriented editing. The GNU
      manual documents it as a stream editor that makes one pass over input,
      distinguishing it from interactive editors while keeping the ed-like idea of
      applying commands to selected text.
    - >
      The GNU sed repository README describes the package as the GNU implementation of
      the Unix stream editor and points users to the GNU website, NEWS file, ChangeLog,
      AUTHORS, and installed Info/man documentation. The manual copyright history begins
      in 1998 and the documented command set grew to include GNU extensions such as
      in-place editing, separate-file processing, sandbox mode, null-data processing,
      and extended regular-expression options.
  related-projects:
    - >
      GNU sed sits beside grep, awk, ed, Perl, and shell as part of the classic Unix
      text-processing toolkit.
  sources:
    - https://formulae.brew.sh/formula/gnu-sed
    - https://git.savannah.gnu.org/cgit/sed.git/plain/NEWS
    - https://git.savannah.gnu.org/cgit/sed.git/plain/README
    - https://www.gnu.org/software/sed/
    - https://www.gnu.org/software/sed/manual/sed.html
  summary:
    - >
      GNU sed is the GNU implementation of sed, the Unix stream editor. It is a
      non-interactive command-line text editor used to transform text from files or
      pipelines.
  timeline:
    - '1998: GNU sed manual copyright history begins.'
    - >
      2018: Version 4.6 notes record output-buffering improvements and clearer command
      diagnostics.
    - '2022: Version 4.9 notes include fixes for very large inputs and Unicode matching.'
    - >
      2026: Version 4.10 notes describe security and correctness fixes in global
      substitution and in-place symlink handling.
  usage:
    - >
      Practitioners use GNU sed for one-liners, build scripts, packaging scripts, log
      processing, generated-file edits, substitutions, deletions, selected printing, and
      in-place changes. Common workflows pass a script directly on the command line,
      load scripts with -f, read standard input in a pipeline, or combine sed with find,
      sort, grep, awk, and shell loops.
related-packages:
  - id: brew:sd
    reason: >
      Choose sd for focused find-and-replace work when simpler common-regex syntax and
      literal replacement are preferable; GNU sed remains the broader stream-editing
      language.
    rel: alternative
    sources:
      - https://github.com/chmln/sd
      - https://www.gnu.org/software/sed/manual/sed.html
category: developer-tools
package-manager:
  apk: sed
  brew: gnu-sed
  chocolatey: sed
  debian: sed
  dnf: sed
  pacman: sed
  scoop: main/sed
  ubuntu: sed
  winget: mbuilov.sed
  zypper: sed
package-manager-url: https://formulae.brew.sh/formula/gnu-sed
license: GPL-3.0-or-later
tags:
  - cli
  - regex
  - stream-editor
  - text-processing
  - unix
description: GNU implementation of the famous stream editor
executables:
  - sed
provenance:
  formula: gnu-sed
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
