id: brew:leetsolv
display-name: LeetSolv
homepage: https://github.com/eannchen/leetsolv
repo: https://github.com/eannchen/leetsolv
docs:
  - https://github.com/eannchen/leetsolv#readme
config-file-location:
  unix: ~/.leetsolv/settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The project has modest but visible adoption for a focused study tool, with GitHub
      stars, forks, Homebrew packaging, and Scoop packaging listed in the input facts
      and README.
  package-nerd-significance:
    - >
      LeetSolv is notable in package-manager catalogs because it is not another LeetCode
      submitter; it packages an offline, zero-dependency Go scheduling tool with atomic
      local writes and a study-oriented data model.
  project-history:
    - >
      The README presents LeetSolv as a deliberate-practice tool for LeetCode and
      HackerRank problems. Its scheduler is described as a customized SM-2 algorithm
      that incorporates familiarity, importance, and reasoning factors, plus
      due-priority scoring and randomized interval behavior.
    - >
      The GitHub releases page shows a short 1.0 release ramp in August 2025, including
      release candidates on 2025-08-21 and 2025-08-22, a v1.0.0 release on 2025-08-24,
      and follow-up fixes on 2025-08-25 and 2025-09-01.
  related-projects:
    - >
      The README explicitly positions the tool against generic Anki-style memorization
      for DSA practice, and references LeetCode, HackerRank, and SuperMemo 2.
  sources:
    - https://github.com/eannchen/leetsolv
    - https://github.com/eannchen/leetsolv/releases
  summary:
    - >
      LeetSolv is a Go CLI for revisiting data-structures-and-algorithms problems with
      spaced repetition rather than simply collecting solved-problem records.
  timeline:
    - '2025-08-21: v1.0.0-rc.1 appeared on the GitHub releases page.'
    - '2025-08-24: v1.0.0 was released.'
    - '2025-09-01: v1.0.3 refined familiarity and memory-prompt documentation.'
    - '2026-01-01: The repository page lists v1.2.0 as a release.'
  usage:
    - >
      Users add DSA problem URLs, run interactive or direct commands such as `leetsolv
      add`, `leetsolv status`, and `leetsolv help`, and rely on the local JSON
      configuration and stored schedule to decide what to review next.
related-packages: []
category: developer-tools
package-manager:
  brew: leetsolv
  nix: leetsolv
  scoop: extras/leetsolv
package-manager-url: https://formulae.brew.sh/formula/leetsolv
license: MIT
tags:
  - cli
  - data-structures-and-algorithms
  - interview-preparation
  - leetcode
  - spaced-repetition
description: CLI tool for DSA problem revision with spaced repetition
executables:
  - leetsolv
provenance:
  formula: leetsolv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
