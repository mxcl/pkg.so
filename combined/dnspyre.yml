id: brew:dnspyre
display-name: dnspyre
homepage: https://tantalor93.github.io/dnspyre/
repo: https://github.com/Tantalor93/dnspyre
docs:
  - https://github.com/Tantalor93/dnspyre#readme
  - https://tantalor93.github.io/dnspyre
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dnspyre's adoption is narrower than dnsperf's but useful for modern resolver
      testing. Its official docs target macOS, Linux, and Windows, and Homebrew
      packaging gives it a convenient package-manager path for operators who want a
      single Go binary.
  package-nerd-significance:
    - >
      dnspyre is package-nerd interesting because it is a compact Go CLI covering the
      protocol sprawl that older DNS benchmark tools did not originally target. For
      Homebrew-style packaging it is also simple: one executable, active tagged
      releases, and no daemon or config file surface.
  project-history:
    - >
      The GitHub repository was created in February 2021, and the README says dnspyre
      was originally forked from Redsift's dnstrace but was largely rewritten and
      enhanced. Its first GitHub release, 1.0.0, was published in May 2021, with v3
      releases continuing into 2026.
    - >
      The README documents the project's expansion from basic DNS load generation into a
      broad benchmark runner: UDP and TCP queries, many DNS record types, concurrency
      controls, duration-limited runs, probability-weighted load, DoT, DoH, DoQ, and
      plotted output.
  related-projects:
    - >
      Redsift dnstrace is the named upstream ancestor. dnsperf is the older DNS
      benchmark peer. The supported transport protocols connect dnspyre to DNS over TLS,
      DNS over HTTPS, and DNS over QUIC tooling.
  sources:
    - https://github.com/Tantalor93/dnspyre#readme
    - https://tantalor93.github.io/dnspyre/
    - https://api.github.com/repos/Tantalor93/dnspyre
    - https://api.github.com/repos/Tantalor93/dnspyre/releases?per_page=100
    - https://formulae.brew.sh/formula/dnspyre
  summary:
    - >
      dnspyre is a Go-based DNS benchmark CLI for stress-testing DNS servers at high
      query rates. It sits in the newer generation of DNS benchmark tools that treat
      modern protocols such as DoT, DoH, and DoQ as normal benchmark targets.
  timeline:
    - '2021: GitHub repository created.'
    - '2021: First GitHub release, 1.0.0, published.'
    - >
      2021: README identifies dnspyre as a fork of Redsift dnstrace that was largely
      rewritten.
    - '2026: v3.11.1 release published.'
  usage:
    - >
      Users point dnspyre at one or more DNS servers, choose query type and protocol,
      set concurrency or duration, and inspect terminal or exported plots. The tool is
      especially relevant when comparing resolver behavior across classic DNS, encrypted
      DNS, and QUIC-based DNS transports.
related-packages:
  - id: brew:dnsperf
    reason: >
      Choose dnsperf for the established DNS-OARC suite and its distinct dnsperf and
      resperf methodologies; choose dnspyre for one CLI spanning UDP, TCP, DoT, DoH, and
      DoQ with built-in visualization.
    rel: alternative
    sources:
      - https://tantalor93.github.io/dnspyre/
      - https://www.dns-oarc.net/tools/dnsperf
category: networking
package-manager:
  brew: dnspyre
package-manager-url: https://formulae.brew.sh/formula/dnspyre
license: MIT
tags:
  - benchmarking
  - cli
  - dns
  - high-qps
  - performance-testing
description: CLI tool for a high QPS DNS benchmark
executables:
  - dnspyre
provenance:
  formula: dnspyre
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
