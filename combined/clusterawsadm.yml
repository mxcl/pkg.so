id: brew:clusterawsadm
display-name: clusterawsadm
homepage: https://cluster-api-aws.sigs.k8s.io/clusterawsadm/clusterawsadm.html
repo: https://github.com/kubernetes-sigs/cluster-api-provider-aws
docs:
  - https://cluster-api-aws.sigs.k8s.io/clusterawsadm/clusterawsadm.html
  - https://cluster-api-aws.sigs.k8s.io/topics/using-clusterawsadm-to-fulfill-prerequisites
config-file-location: null
credentials-file-location:
  unix:
    - ~/.aws/credentials
    - ~/.aws/config
  windows:
    - '%USERPROFILE%\.aws\credentials'
    - '%USERPROFILE%\.aws\config'
history:
  adoption-history:
    - >
      The official CAPA documentation says clusterawsadm binaries are attached to each
      CAPA release and that it can be installed with Homebrew on macOS and Linux.
    - >
      Its adoption is tied to Cluster API Provider AWS operators: users run it before or
      around clusterctl initialization to prepare AWS accounts for declarative
      Kubernetes cluster lifecycle management.
  package-nerd-significance:
    - >
      clusterawsadm is a good package-manager example of a narrowly scoped admin
      companion binary: it is not the core controller, but packagers ship it because
      real CAPA installs need a local CLI for account bootstrapping and release-aligned
      assets.
  project-history:
    - >
      Cluster API Provider AWS is the AWS infrastructure provider for Kubernetes Cluster
      API. Its docs describe CAPA as Kubernetes-native declarative infrastructure for
      AWS and list clusterawsadm as the CLI tool that provides bootstrapping, AMI, EKS,
      and controller helpers.
    - >
      clusterawsadm exists because CAPA needs AWS prerequisites before `clusterctl init
      --infrastructure aws`: the command can print or create IAM policies, roles, and
      instance profiles through CloudFormation and can encode credentials for
      clusterctl.
  related-projects:
    - Cluster API Provider AWS is the parent project that ships clusterawsadm.
    - Cluster API and clusterctl are the core upstream projects in the workflow.
    - >
      kops and kubicorn are named in the CAPA introduction as previous cluster-manager
      projects whose lessons informed Cluster API-style infrastructure.
  sources:
    - https://cluster-api-aws.sigs.k8s.io/introduction
    - https://cluster-api-aws.sigs.k8s.io/clusterawsadm/clusterawsadm.html
    - https://cluster-api-aws.sigs.k8s.io/topics/using-clusterawsadm-to-fulfill-prerequisites
    - https://github.com/kubernetes-sigs/cluster-api-provider-aws/releases
  summary:
    - >
      clusterawsadm is the management utility shipped with Kubernetes Cluster API
      Provider AWS for AWS IAM, AMI, EKS, and controller-administration tasks.
  timeline:
    - '2019: Cluster API Provider AWS GitHub releases include v0.1.x and v0.3.x releases.'
    - '2021: CAPA v1.0.0 was published shortly after Cluster API v1.0.0.'
    - '2022: CAPA v2.0.0 was published.'
    - >
      2026: The generated command reference lists clusterawsadm docs generated by Cobra
      on June 29, 2026.
  usage:
    - >
      Common usage includes `clusterawsadm bootstrap iam create-cloudformation-stack` to
      create IAM prerequisites and `clusterawsadm bootstrap credentials
      encode-as-profile` to provide encoded AWS credentials for `clusterctl init
      --infrastructure aws`.
    - >
      The command reference also exposes AMI, bootstrap, controller, EKS,
      garbage-collection, resource, and version subcommands.
related-packages:
  - id: brew:clusterctl
    reason: >
      clusterctl consumes the AWS prerequisites and encoded credentials prepared by
      clusterawsadm to initialize the Cluster API AWS infrastructure provider.
    rel: adjacent_workflow
    sources:
      - https://cluster-api-aws.sigs.k8s.io/clusterawsadm/clusterawsadm.html
      - https://cluster-api.sigs.k8s.io/clusterctl/overview
  - id: brew:awscli
    reason: >
      The official prerequisite workflow requires the AWS CLI alongside clusterawsadm
      for AWS account and infrastructure operations.
    rel: adjacent_workflow
    sources:
      - https://cluster-api-aws.sigs.k8s.io/topics/using-clusterawsadm-to-fulfill-prerequisites
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.html
  - id: brew:aws-vault
    reason: >
      The CAPA prerequisite guide recommends AWS Vault for storing AWS credentials in
      the operating-system keystore and securely exposing them to the clusterawsadm
      environment.
    rel: adjacent_workflow
    sources:
      - https://cluster-api-aws.sigs.k8s.io/topics/using-clusterawsadm-to-fulfill-prerequisites
      - https://github.com/ByteNess/aws-vault
category: cloud-infrastructure
package-manager:
  brew: clusterawsadm
package-manager-url: https://formulae.brew.sh/formula/clusterawsadm
license: Apache-2.0
tags:
  - aws
  - cli
  - cloudformation
  - cluster-api
  - iam
  - kubernetes
description: Home for bootstrapping, AMI, EKS, and other helpers in Cluster API Provider AWS
executables:
  - clusterawsadm
provenance:
  formula: clusterawsadm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
