id: brew:chopper
display-name: chopper
homepage: https://github.com/wdecoster/chopper
repo: https://github.com/wdecoster/chopper
docs:
  - https://github.com/wdecoster/chopper
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes ready-to-use binaries from GitHub Releases and documents
      installation through Bioconda. The supplied package metadata also records a
      Homebrew formula, making it available in both bioinformatics-focused and
      general-purpose package-manager workflows.
  package-nerd-significance:
    - >
      For package-oriented users, chopper is notable as a small Rust replacement for
      older Python tooling that preserves stream-based composition while offering
      standalone release binaries and Bioconda and Homebrew distribution. Its
      stdin/stdout interface makes it easy to slot into reproducible shell pipelines
      without project-specific configuration.
  project-history:
    - >
      The project's GitHub repository was created in August 2020. Its first published
      GitHub release was v0.1.0 in November 2022, and development has continued through
      later releases that expanded its filtering and trimming strategies.
  related-projects:
    - >
      NanoFilt and NanoLyse are the Python tools whose functionality motivated chopper's
      Rust implementation.
    - >
      pigz is recommended in the official README for overlapping FASTQ compression or
      decompression with chopper's processing.
  sources:
    - https://api.github.com/repos/wdecoster/chopper
    - https://api.github.com/repos/wdecoster/chopper/releases?per_page=100
    - https://github.com/wdecoster/chopper#readme
    - source_facts.package-manager
  summary:
    - >
      chopper is a Rust command-line program for filtering and trimming FASTQ reads from
      long-read sequencing platforms such as Oxford Nanopore and PacBio. It is designed
      as a faster reimplementation of functionality associated with the Python tools
      NanoFilt and NanoLyse.
  timeline:
    - '2020: GitHub repository created.'
    - '2022: First GitHub release, v0.1.0.'
    - '2026: v0.13.0 released with split-window support for low-quality splitting.'
  usage:
    - >
      chopper fits Unix sequencing pipelines by reading FASTQ from standard input and
      writing accepted reads to standard output. Common invocations set minimum quality
      and length thresholds, optionally crop or quality-trim reads, and pipe compressed
      data through gzip or pigz.
related-packages:
  - id: brew:pigz
    reason: >
      Pipe chopper through pigz to overlap FASTQ decompression with filtering and
      parallelize output compression, as recommended by chopper's official performance
      documentation.
    rel: adjacent_workflow
    sources:
      - https://github.com/wdecoster/chopper#readme
      - https://zlib.net/pigz/
category: science
package-manager:
  brew: chopper
package-manager-url: https://formulae.brew.sh/formula/chopper
license: MIT
tags:
  - bioinformatics
  - cli
  - fastq
  - genomics
  - long-read-sequencing
  - rust
description: Filter and trim long-read sequencing data by quality and length
executables:
  - chopper
provenance:
  formula: chopper
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
