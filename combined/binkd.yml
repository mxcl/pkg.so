id: brew:binkd
display-name: binkd
homepage: https://github.com/pgul/binkd
repo: https://github.com/pgul/binkd
docs:
  - https://github.com/pgul/binkd#readme
  - https://github.com/pgul/binkd/blob/master/binkd.8
config-file-location:
  unix: /usr/local/etc/binkd.conf-dist
credentials-file-location: null
history:
  adoption-history:
    - >
      binkd's adoption is niche but durable: the supplied package facts list Homebrew,
      Debian, MacPorts, and Ubuntu packages, showing that it remains packaged for
      operators maintaining Fidonet-style mail systems long after the BBS era.
  package-nerd-significance:
    - >
      binkd is package-nerd archaeology with live users: it packages an FTN mail
      transport that depends on old network conventions, sample configs, spool layouts,
      and daemon behavior rather than the usual modern web-service stack.
  project-history:
    - >
      The README describes binkd as a Fidonet mailer for TCP/IP networks and names
      Dmitry Maloff and other contributors as authors. The GitHub repository is a later
      home for older sources: its `start` tag records that the sources were under CVS
      again in January 2001, and the repository itself was created on GitHub in April
      2015.
    - >
      The manual page, dated June 2012, documents binkd as a program for transferring
      files between two Fidonet systems over TCP/IP, with BSO and ASO outbound formats
      and a required configuration file argument.
  related-projects:
    - >
      The manual names ifmail and BinkleyTerm as related mailers that use Bink-style
      outbound formats. binkd also belongs to the broader Fidonet and FTN tooling
      family.
  sources:
    - GitHub API reports repository and tag commit dates.
    - >
      GitHub README documents purpose, installation, old project locations, authors, and
      documentation links.
    - >
      binkd.8 documents operation, configuration-file use, BSO/ASO relationship, and
      manual date.
    - input.source_facts.package-manager lists package-manager availability.
  summary:
    - >
      binkd is a Fidonet Technology Network mailer that transfers Fido-style mail over
      TCP/IP, preserving a classic bulletin-board-network workflow on Internet
      transport.
  timeline:
    - '2001: Repository tag records binkd sources returning to CVS.'
    - '2012: binkd.8 manual page documents TCP/IP Fidonet transfer behavior.'
    - '2014: binkd 1.0.4 release commit is tagged.'
    - '2015: GitHub repository is created.'
  usage:
    - >
      Operators run binkd with a config file, optionally as a daemon, inetd service,
      client-only poller, or server-only process. The README installation notes tell
      users to edit the sample configuration and preserve the installed binkd.conf-dist
      as a template.
related-packages: []
category: networking
package-manager:
  brew: binkd
  debian: binkd
  macports: binkd
  ubuntu: binkd
package-manager-url: https://formulae.brew.sh/formula/binkd
license: GPL-2.0-or-later
tags:
  - cli
  - fidonet
  - mailer
  - tcp-ip
description: TCP/IP FTN Mailer
executables:
  - binkd
  - binkd-1.0.4
provenance:
  formula: binkd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
