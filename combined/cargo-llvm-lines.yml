id: brew:cargo-llvm-lines
display-name: cargo-llvm-lines
homepage: https://github.com/dtolnay/cargo-llvm-lines
repo: https://github.com/dtolnay/cargo-llvm-lines
docs:
  - https://github.com/dtolnay/cargo-llvm-lines#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is available through Homebrew and Nix according to the input facts,
      and crates.io reported 134,082 downloads when checked on 2026-06-30. Its audience
      is narrower than test runners or build tools, but it is well known among Rust
      developers investigating monomorphization bloat.
  package-nerd-significance:
    - >
      It is a package-nerd tool because it exposes otherwise hidden codegen costs in
      dependency and generic-heavy Rust crates, helping maintainers decide where small
      API or generic changes can reduce compile time and binary size.
  project-history:
    - >
      The crate first appeared on crates.io in November 2017 as version 0.1.0. The
      README credits the idea to eddyb's suggestion for counting monomorphized functions
      while debugging compiler memory use, executable size, and compile time.
  related-projects:
    - >
      Related tooling includes Cargo, rustc/LLVM IR output, and compiler performance
      analysis workflows.
  sources:
    - https://api.github.com/repos/dtolnay/cargo-llvm-lines
    - https://github.com/dtolnay/cargo-llvm-lines
    - https://github.com/dtolnay/cargo-llvm-lines#readme
    - https://crates.io/api/v1/crates/cargo-llvm-lines
    - https://formulae.brew.sh/api/formula/cargo-llvm-lines.json
  summary:
    - >
      cargo-llvm-lines measures the number and size of LLVM IR instantiations for
      generic functions in a Rust program. Its README frames the output as a way to find
      code with the highest leverage for improving compilation metrics.
  timeline:
    - '2017: First crates.io release 0.1.0.'
    - '2026: Crates.io latest version 0.4.46 and Homebrew stable version 0.4.46.'
  usage:
    - >
      Users run cargo llvm-lines to see total LLVM IR lines, number of copies, and
      function names, optionally using -p to inspect a package in a multi-crate project
      or release/LTO settings for a broader view.
related-packages: []
category: developer-tools
package-manager:
  brew: cargo-llvm-lines
  nix: cargo-llvm-lines
package-manager-url: https://formulae.brew.sh/formula/cargo-llvm-lines
license: Apache-2.0 OR MIT
tags:
  - cargo
  - cli
  - code-analysis
  - ir
  - llvm
  - rust
description: Count lines of LLVM IR per generic function
executables:
