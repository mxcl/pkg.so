id: brew:advai-cli
display-name: advai-cli
homepage: https://github.com/Advai-X/advai-cli
repo: https://github.com/Advai-X/advai-cli
docs:
  - https://github.com/Advai-X/advai-cli#readme
config-file-location:
  unix: ~/.advai/skill_platforms.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The project adopted a multi-ecosystem packaging model at launch: PyPI carries the
      Python implementation, the npm package creates a private Python environment and
      installs the matching PyPI version, and Homebrew installs the package in a
      formula-managed virtual environment. Homebrew's official formula listed version
      1.0.9 and reported 36 installs in its first 30-day analytics window as of July
      2026, indicating early rather than mature adoption.
  package-nerd-significance:
    - >
      The package is notable for presenting one CLI through three package-manager
      cultures without maintaining three independent implementations. Its npm artifact
      is a launcher and environment bootstrap around the Python distribution, while
      Homebrew also provisions the Python package into an isolated environment. That
      arrangement makes version alignment, install provenance, and update behavior
      visible parts of the tool's design.
  project-history:
    - >
      The official GitHub repository was created in June 2026. Public Python and npm
      packages followed within days, and the project advanced through several 1.0.x
      releases by early July 2026. The implementation remains deliberately local-first,
      with runtime state under `~/.advai` and a small Python core built around Click and
      aiohttp.
  related-projects:
    - >
      OpenCLI supplies advai-cli's external-CLI discovery, registration, and passthrough
      layer.
    - >
      OpenAI-compatible chat-completions APIs provide the backend interface used by the
      terminal chat UI.
    - >
      Agent hosts such as Codex, Claude Code, Cursor, and Gemini CLI are among the
      platforms to which advai-cli can synchronize installed skills.
  sources:
    - 'Official GitHub releases: https://github.com/Advai-X/advai-cli/releases'
    - 'Official Homebrew formula and analytics: https://formulae.brew.sh/formula/advai-cli'
    - 'Official PyPI project and release history: https://pypi.org/project/advai-cli/'
    - 'Official npm registry metadata: https://registry.npmjs.org/advai-cli'
    - 'Official repository and README: https://github.com/Advai-X/advai-cli'
  summary:
    - >
      advai-cli is a Python-first command-line tool that combines local agent-skill
      management, browser automation, external-CLI integration, local knowledge bases,
      and terminal chat against OpenAI-compatible APIs behind the `advai` command. Its
      maintainers distribute the same implementation through PyPI, npm, and Homebrew.
  timeline:
    - '2026-06-19: Official GitHub repository created.'
    - >
      2026-06-21: First currently listed PyPI releases and the initial npm publication
      appeared.
    - '2026-07-05: Version 1.0.9 was published to PyPI, npm, and GitHub Releases.'
    - >
      2026-07: Homebrew distributed version 1.0.9 as bottled packages for supported
      macOS and Linux systems.
  usage:
    - >
      Typical use begins with `advai info`, then branches into `advai skill` for
      installing and synchronizing skills, `advai browser` for Chrome-extension-backed
      automation, `advai cli` for OpenCLI-backed external commands, `advai kb` for local
      document collections, or `advai tui` for terminal chat. AI access is configured
      through `ADVAI_*` variables, with selected `OPENAI_*` variables accepted as
      fallbacks; the API key is supplied through the environment rather than a
      documented credentials file.
related-packages: []
