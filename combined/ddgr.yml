id: brew:ddgr
display-name: ddgr
homepage: https://github.com/jarun/ddgr
repo: https://github.com/jarun/ddgr
docs:
  - https://github.com/jarun/ddgr#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ddgr spread through package managers because it is a single-purpose CLI with
      minimal dependencies and a recognizable audience: terminal users who want web
      search without opening a full browser first. The README lists package-manager
      installation as the normal path and also notes PyPI, Snap, Termux-style standalone
      use, and shell completions.
  package-nerd-significance:
    - >
      ddgr is package-nerd friendly because it is a small terminal adapter around a web
      service, deliberately avoiding heavyweight browser state while still caring about
      completions, man pages, clipboard helpers, and cross-platform behavior. It also
      captures the tradition of installing tiny CLIs that make web workflows feel native
      to a shell.
  project-history:
    - >
      The README presents ddgr as the DuckDuckGo counterpart to googler, created after
      command-line users asked for a similar utility for privacy-aware DuckDuckGo
      searches. The GitHub repository was created in 2016 and its release series reached
      v1.0 in 2017, with v2.2 published in 2023.
  related-projects:
    - googler is the sibling command-line search tool explicitly referenced by ddgr.
    - DuckDuckGo Bangs are part of ddgr's search workflow.
    - >
      text browsers such as w3m, lynx, links, and elinks are supported through browser
      integration.
  sources:
    - https://github.com/jarun/ddgr
    - https://github.com/jarun/ddgr#readme
    - https://github.com/jarun/ddgr/releases
  summary:
    - >
      ddgr is a Python command-line client for searching DuckDuckGo from the terminal.
      It translates the browser search workflow into a compact terminal UI with result
      paging, bangs, browser integration, proxy support, JSON output, and a
      privacy-aware default posture.
  timeline:
    - '2016: Public GitHub repository created.'
    - '2017: ddgr v1.0 released.'
    - '2020: ddgr v1.9 released.'
    - '2023: ddgr v2.2 released.'
  usage:
    - >
      Typical usage is interactive search at an omniprompt, one-shot searches from
      scripts, DuckDuckGo Bang dispatch, or opening selected results in a text or GUI
      browser. The README also notes that ddgr does not have a config file; users are
      expected to compose it with aliases, environment variables, completions, and
      browser settings.
related-packages:
  - id: brew:w3m
    reason: >
      Set BROWSER=w3m to open ddgr results directly in a supported terminal browser,
      keeping the entire search-and-read workflow inside the terminal.
    rel: adjacent_workflow
    sources:
      - https://github.com/jarun/ddgr#readme
      - https://w3m.sourceforge.net/
  - id: brew:lynx
    reason: >
      Lynx is another text browser explicitly recognized by ddgr, letting selected
      search results open without switching to a graphical browser.
    rel: adjacent_workflow
    sources:
      - https://github.com/jarun/ddgr#readme
      - https://invisible-island.net/lynx/
category: developer-tools
package-manager:
  apk: ddgr
  brew: ddgr
  debian: ddgr
  dnf: ddgr
  nix: ddgr
  pacman: ddgr
  ubuntu: ddgr
  zypper: ddgr
package-manager-url: https://formulae.brew.sh/formula/ddgr
license: GPL-3.0-or-later
tags:
  - cli
  - duckduckgo
  - privacy
  - search
  - terminal
description: DuckDuckGo from the terminal
executables:
  - ddgr
provenance:
  formula: ddgr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
