id: brew:fplll
display-name: fplll
homepage: https://github.com/fplll/fplll
repo: https://github.com/fplll/fplll
docs:
  - https://github.com/fplll/fplll/wiki
  - https://fplll.github.io/fplll
  - https://github.com/fplll/fplll#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents packaged installation routes for Debian and Ubuntu as
      fplll-tools, conda, Homebrew on macOS, and Docker/AWS images. It also notes that
      fplll is included in Sage and that fpylll provides a standalone Python interface,
      which helped the project reach both research users and package-manager users.
  package-nerd-significance:
    - >
      fplll is significant because it packages research-grade lattice algorithms as a
      reusable Unix-style tool and library. For package maintainers it combines native
      C++ code, GMP/MPFR dependencies, optional precision backends, CLI programs, and
      bindings into a package that is important to computational mathematics,
      cryptanalysis, and lattice-based cryptography workflows.
  project-history:
    - >
      The project grew from early fplll 1.x releases into a C++ lattice-reduction
      codebase. The official NEWS file records fplll 2.0 as an improved version of fplll
      1.3, with a wrapper that chose a reliable sequence of heuristic and proved
      variants, a switch from C to C++, and portability work for Sage.
    - >
      Later releases made fplll more useful as both a CLI and a library: fplll 3.0 added
      short vector enumeration and changed the license to LGPL, fplll 4.0 added BKZ
      reduction, and fplll 5.0 moved to C++11, a more open GitHub development model, BKZ
      2.0 features, a Python interface, API documentation, and much broader automated
      testing.
  related-projects:
    - >
      fpylll is the Python interface for fplll; Sage includes fplll for integer matrix
      and lattice functionality; fplll's NEWS also names the fplll strategizer project
      for precomputed BKZ strategies and compares early fplll 2.0 work with Magma and
      NTL LLL implementations.
  sources:
    - https://api.github.com/repos/fplll/fplll/releases?per_page=10
    - https://raw.githubusercontent.com/fplll/fplll/master/CONTRIBUTING.md
    - https://raw.githubusercontent.com/fplll/fplll/master/NEWS
    - https://raw.githubusercontent.com/fplll/fplll/master/README.md
  summary:
    - >
      fplll is a lattice-reduction library and command-line tool centered on
      floating-point orthogonalization and LLL reduction. Its official README describes
      implementations of LLL, BKZ, HKZ, SVP, CVP, lattice generation, and library
      interfaces used in computational number theory and lattice-based cryptography.
  timeline:
    - >
      fplll 2.0: Reworked from fplll 1.3, switched from C to C++, added the wrapper, and
      improved portability for Sage.
    - 'fplll 3.0: Added short lattice vector enumeration and changed from GPL to LGPL.'
    - 'fplll 4.0.0: Added BKZ reduction through the fplll command.'
    - >
      fplll 5.0: Switched to C++11, GitHub-based open development, BKZ 2.0 features,
      fpylll, API documentation, and expanded tests.
    - '2024: Version 5.5.0 was published on GitHub.'
  usage:
    - >
      The installed programs include fplll and latticegen. Typical use chains latticegen
      into fplll, or gives fplll a matrix from standard input or a file and selects
      algorithms such as LLL, BKZ, HKZ, SVP, self-dual BKZ, or CVP with command-line
      options.
related-packages: []
category: science
