id: brew:apngasm
display-name: apngasm
homepage: https://github.com/apngasm/apngasm
repo: https://github.com/apngasm/apngasm
docs:
  - http://apngasm.sourceforge.net/
  - https://github.com/apngasm/apngasm#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README recommends Homebrew for the latest macOS apngasm, GitHub releases for
      Windows, and a Launchpad PPA for GNU/Linux. The supplied package metadata also
      records Homebrew, Debian, Nix, Scoop, and Ubuntu packages, indicating broad
      packaging for a specialized image tool.
    - >
      The SourceForge feed shows prebuilt 2.91 artifacts for Linux, macOS, and Windows
      in 2016, while the GitHub repository shows the later source-control home for the
      next-generation codebase.
  package-nerd-significance:
    - >
      apngasm matters because APNG is a format niche where small command-line utilities
      define the practical toolchain. It gives packagers a native assembler that can be
      scripted, built through CMake, wrapped as a library, and distributed through
      distro repositories.
    - >
      Its evolution from SourceForge binaries and GUI/CLI zips to a GitHub-hosted CMake
      project is a compact example of how older image-format utilities migrated into
      modern package-manager ecosystems.
  project-history:
    - >
      The older SourceForge-hosted APNG Assembler page describes a command-line and GUI
      tool that creates APNG animations from PNG or TGA image sequences. It emphasizes
      inter-frame optimization, palette and color-type optimization, and zlib, 7zip, and
      Zopfli compression options.
    - >
      The current GitHub project was created in July 2013 and calls itself the next
      generation of apngasm. Its README documents a CMake-based cross-platform build,
      CLI and library packaging, Java and Ruby wrappers generated through SWIG, and
      copyright shared as a joint production by Max Stepin and K.K. GenSouSha.
    - >
      Official GitHub releases show the 3.1.x line in 2014 and 2015, followed by a
      3.1.10 release in 2021 for newer build and packaging systems plus small fixes.
  related-projects:
    - >
      The official SourceForge page links apngdis, gif2apng, apng2gif, and apngopt as
      related APNG utilities. The GitHub README also points Ruby users toward the
      rapngasm gem.
  sources:
    - http://apngasm.sourceforge.net/
    - https://api.github.com/repos/apngasm/apngasm
    - https://api.github.com/repos/apngasm/apngasm/releases
    - https://github.com/apngasm/apngasm#readme
    - https://sourceforge.net/projects/apngasm/rss?path=/
    - source_facts.package-manager
  summary:
    - >
      apngasm is an APNG assembler CLI and library for creating, and in the newer GitHub
      version also disassembling, Animated PNG files. It is one of the core APNG-family
      utilities alongside disassemblers and GIF/APNG converters.
  timeline:
    - '2013: Current apngasm/apngasm GitHub repository was created.'
    - '2014: GitHub 3.1.x releases began, including libapngasm updates.'
    - '2016: SourceForge feed records APNG Assembler 2.91 source and platform binary releases.'
    - '2021: GitHub 3.1.10 release updated builds and packaging for newer systems.'
  usage:
    - >
      The SourceForge documentation shows commands such as apngasm output.png
      frame001.png [options] and apngasm output.png frame*.png [options]. Options
      include frame delay, loop count, skipping the first frame, keeping palette or
      color type, compression backend, and iteration counts.
    - >
      The GitHub README is more build- and packaging-oriented, with platform-specific
      dependency lists and package-building instructions rather than a fixed user config
      file.
related-packages:
  - id: brew:apng2gif
    reason: >
      apng2gif converts animations produced or edited with apngasm into GIF fallbacks
      while preserving documented frame timing and loop behavior.
    rel: adjacent_workflow
    sources:
      - https://apngasm.sourceforge.net/
      - https://apng2gif.sourceforge.net/
category: media
package-manager:
  brew: apngasm
  debian: apngasm
  nix: apngasm
  scoop: main/apngasm
  ubuntu: apngasm
package-manager-url: https://formulae.brew.sh/formula/apngasm
license: Zlib
tags:
  - animation
  - apng
  - assembler
  - cli
  - image-processing
  - png
description: Next generation of apngasm, the APNG assembler
executables:
  - apngasm
provenance:
  formula: apngasm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
