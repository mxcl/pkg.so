id: brew:julia
display-name: Julia
homepage: https://julialang.org/
repo: https://github.com/JuliaLang/julia
docs:
  - https://docs.julialang.org/
config-file-location:
  unix: ~/.julia/config/startup.jl
credentials-file-location: null
history:
  adoption-history:
    - >
      Julia adoption grew through scientific computing, optimization, data science,
      differentiable programming, and high-performance numerical packages. JuliaCon
      began as a small 2014 community event and, by the 2016 invitation post, the
      organizers described growth from about 75 attendees in 2014 to about 225 in 2015.
    - >
      The Julia ecosystem is tightly coupled to packages and registries: users install
      the language from system package managers or official binaries, then use Julia's
      built-in package manager for reproducible environments and project-specific
      dependencies.
  package-nerd-significance:
    - >
      Julia is significant to package nerds because it layers a language-native package
      manager on top of OS package managers. The outer package installs the compiler and
      standard tooling, while Julia's registries, manifests, artifacts, and binary
      wrappers manage the fast-moving scientific package ecosystem inside user projects.
  project-history:
    - >
      The Julia founders publicly announced the language on February 14, 2012 in the
      essay 'Why We Created Julia', after roughly two and a half years of work. The
      design goal was explicit: combine the usability of high-level languages with
      performance suitable for numerical and systems-heavy work.
    - >
      Julia 1.0 was released during JuliaCon 2018, with the project describing it as the
      culmination of nearly a decade of work. The 1.0 milestone established the stable
      1.x language line and helped shift Julia from research-language curiosity to
      production-usable scientific platform.
  related-projects:
    - LLVM is central to Julia's compilation strategy.
    - Pkg is Julia's built-in package manager and environment tool.
    - SciML, JuMP, and the broader Julia package registry are major ecosystem pillars.
  sources:
    - https://docs.julialang.org/
    - https://formulae.brew.sh/formula/julia
    - https://github.com/JuliaLang/julia
    - https://julialang.org/blog/2012/02/why-we-created-julia/
    - https://julialang.org/blog/2016/05/juliacon-invitation/
    - https://julialang.org/blog/2018/08/one-point-zero/
    - https://julialang.org/blog/2022/02/10years/
  summary:
    - >
      Julia is a high-performance dynamic programming language built for technical and
      scientific computing without the traditional split between a productive scripting
      language and a separate fast implementation language. Its package-manager
      footprint matters because the `julia` executable is a compiler, REPL, package
      environment manager, and scientific-computing platform in one package.
  timeline:
    - >
      2009: The Julia team began work on the language, according to the 2012 launch
      essay's two-and-a-half-year framing.
    - '2012: Julia was publicly announced on February 14.'
    - '2014: The first JuliaCon was held in Chicago.'
    - '2018: Julia 1.0 was released during JuliaCon 2018.'
    - >
      2022: The Julia community marked ten years since the public announcement with
      adoption stories from users.
  usage:
    - >
      Developers use the packaged `julia` command for the REPL, script execution,
      package management, precompilation, notebooks, and project environments. On
      Unix-like systems, startup customization commonly lives at
      `~/.julia/config/startup.jl`, which makes the package feel both like a runtime and
      a personal computing environment.
related-packages:
  - id: brew:juliaup
    reason: >
      Use Juliaup alongside Julia when you need upstream-managed Julia release channels,
      multiple installed toolchains, per-directory overrides, or automated runtime
      updates.
    rel: adjacent_workflow
    sources:
      - https://github.com/JuliaLang/juliaup
      - https://julialang.org/downloads/
category: language-runtime
