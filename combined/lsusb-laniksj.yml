id: brew:lsusb-laniksj
display-name: lsusb-laniksj
homepage: https://laniksj.github.io/lsusb/
repo: https://github.com/LanikSJ/lsusb
docs:
  - https://github.com/LanikSJ/lsusb#readme
  - https://laniksj.github.io/lsusb
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The fork has modest but active public adoption signals compared with the original:
      GitHub shows about 30 stars, 214 commits, and 11 releases, with the latest release
      listed as 1.1.8 on Jun 7, 2026. The supplied Homebrew facts show it is distributed
      as `brew:lsusb-laniksj`, making it the maintained formula consumers encounter when
      they want this fork through Homebrew.
  package-nerd-significance:
    - >
      For package-history purposes, this fork matters because it is a maintenance fork
      of a small but beloved portability shim. It preserves the command name and option
      shape Mac users expect when switching between Linux and macOS hardware-debugging
      workflows, while avoiding a dependency on Linux's usbutils stack.
  project-history:
    - >
      The project is explicitly marked on GitHub as a fork of jlhonora/lsusb. Its README
      keeps the original goal, namely listing USB devices on Mac OS X/macOS in a way
      familiar to Linux users, and adds a maintained GitHub Pages documentation surface
      plus current Homebrew installation instructions for the `lsusb-laniksj` formula.
  related-projects:
    - jlhonora/lsusb is the upstream repository this project forked from.
    - >
      Linux usbutils provides the canonical `lsusb` command whose output style the macOS
      scripts emulate.
    - >
      Apple `system_profiler SPUSBDataType` is the native macOS data source used by the
      script.
  sources:
    - https://github.com/LanikSJ/lsusb
    - https://github.com/LanikSJ/lsusb/releases
    - https://laniksj.github.io/lsusb/
    - source_facts.package-manager
    - source_facts.repo
  summary:
    - >
      lsusb-laniksj is the Homebrew-packaged fork of LanikSJ's macOS `lsusb`, a shell
      utility that presents USB device information in a Linux-like `lsusb` format while
      relying on Apple's built-in `system_profiler SPUSBDataType` data source.
  timeline:
    - '2010s: Original jlhonora/lsusb establishes a Mac OS X `lsusb` clone.'
    - >
      2020s: LanikSJ maintains a fork with GitHub Pages documentation and Homebrew
      formula instructions.
    - '2026: GitHub lists release 1.1.8 as latest on Jun 7, 2026.'
  usage:
    - >
      Usage mirrors the Linux-oriented mental model: run `lsusb` to list devices, `lsusb
      -v` to show unmodified `system_profiler SPUSBDataType` output, and filters such as
      `-s` or `-d` for bus/device or vendor/product selection. The README also points
      users to the bundled man page for fuller option details.
related-packages:
  - id: brew:cyme
    reason: >
      Choose cyme for a cross-platform USB inspector with structured JSON, richer trees,
      filtering, and hot-plug monitoring; choose lsusb-laniksj for a small macOS script
      closely matching the traditional `lsusb` interface.
    rel: alternative
    sources:
      - https://github.com/tuna-f1sh/cyme#readme
      - https://laniksj.github.io/lsusb/
  - id: brew:usbutils
    reason: >
      Choose usbutils for the canonical host-side `lsusb` toolkit on Linux or BSD;
      choose lsusb-laniksj when the same familiar workflow is needed through macOS
      `system_profiler`.
    rel: alternative
    sources:
      - https://git.kernel.org/pub/scm/linux/kernel/git/gregkh/usbutils.git/plain/README.md
      - https://laniksj.github.io/lsusb/
