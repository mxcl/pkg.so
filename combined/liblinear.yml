id: brew:liblinear
display-name: LIBLINEAR
homepage: https://www.csie.ntu.edu.tw/~cjlin/liblinear/
repo: https://github.com/cjlin1/liblinear
docs:
  - https://github.com/cjlin1/liblinear#readme
  - https://www.csie.ntu.edu.tw/~cjlin/liblinear
  - https://www.csie.ntu.edu.tw/~cjlin/liblinear/FAQ.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LIBLINEAR spread through both command-line use and embedding. Its stable file
      format, simple executables, MATLAB/OCTAVE interface, Python interface, and C API
      made it easy to package and wrap.
    - >
      One visible downstream adoption path is scikit-learn, whose LogisticRegression
      documentation exposes a 'liblinear' solver for L1 and L2 regularization. That made
      the project familiar even to Python users who never invoke the original train and
      predict binaries.
  package-nerd-significance:
    - >
      LIBLINEAR is package-nerd catnip because it is a small, fast C/C++ implementation
      of a heavily cited ML method with stable Unix-style tools. It is the kind of
      dependency that appears behind higher-level language bindings while still
      remaining useful as a direct CLI package.
  project-history:
    - >
      The LIBLINEAR paper was submitted to the Journal of Machine Learning Research in
      May 2008 and published in August 2008 by Rong-En Fan, Kai-Wei Chang, Cho-Jui
      Hsieh, Xiang-Rui Wang, and Chih-Jen Lin. The paper presents LIBLINEAR as an open
      source library for large-scale linear classification with easy command-line tools
      and library calls.
    - >
      LIBLINEAR was designed as a sibling to LIBSVM for cases where a linear model is
      appropriate and kernel methods are too expensive. The README explicitly advises
      beginners with small data sets to consider LIBSVM first, while pointing to
      LIBLINEAR for large data where nonlinear mappings do not materially improve
      performance.
    - >
      The public GitHub mirror was created on May 19, 2014, giving the project a
      familiar source-control home for packagers and downstream wrappers.
  related-projects:
    - >
      LIBSVM is the closest related project and the source of much of the package style,
      data-format familiarity, and user workflow.
    - >
      scikit-learn exposes LIBLINEAR as a solver option in LogisticRegression, carrying
      the implementation into the Python scientific ecosystem.
  sources:
    - https://api.github.com/repos/cjlin1/liblinear
    - https://github.com/cjlin1/liblinear
    - >
      https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
    - https://www.csie.ntu.edu.tw/~cjlin/liblinear/
    - https://www.csie.ntu.edu.tw/~cjlin/papers/liblinear.pdf
    - https://www.jmlr.org/papers/v9/fan08a.html
  summary:
    - >
      LIBLINEAR is a National Taiwan University machine-learning package for large-scale
      regularized linear classification, regression, and outlier detection. It pairs a
      C/C++ library with simple command-line tools such as train and predict, making
      linear SVM and logistic-regression models accessible from scripts and other
      software.
  timeline:
    - '2008: LIBLINEAR paper submitted in May and published in JMLR in August.'
    - '2014: Public GitHub mirror created on May 19, 2014.'
    - '2022: NTU-hosted LIBLINEAR paper PDF marked last modified on March 5, 2022.'
    - '2025: GitHub repository metadata recorded push activity on December 29, 2025.'
  usage:
    - >
      The canonical workflow is to build the package with make, train a model from
      sparse feature data using train, and apply the model with predict. The README
      describes the LIBSVM-style data format, included heart_scale example, solver
      selection, cross validation, and parameter search.
related-packages:
  - id: brew:libsvm
    reason: >
      Choose LIBSVM for smaller datasets or nonlinear kernel models; choose LIBLINEAR
      for efficient linear training on large, high-dimensional sparse data.
    rel: alternative
    sources:
      - https://github.com/cjlin1/liblinear#when-to-use-liblinear-but-not-libsvm
      - https://www.csie.ntu.edu.tw/~cjlin/libsvm/
