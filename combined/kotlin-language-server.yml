id: brew:kotlin-language-server
display-name: Kotlin Language Server
homepage: https://github.com/fwcd/kotlin-language-server
repo: https://github.com/fwcd/kotlin-language-server
docs:
  - https://github.com/fwcd/kotlin-language-server#readme
config-file-location:
  unix:
    - '[project root]/kls-classpath'
    - '[project root]/kls-classpath.sh'
    - ~/.config/kotlin-language-server/classpath
    - ~/.config/kotlin-language-server/classpath.sh
  windows:
    - '[project root]\kls-classpath.bat'
    - '[project root]\kls-classpath.cmd'
    - '%HOMEPATH%\.config\kotlin-language-server\classpath.bat'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project became widely referenced because Kotlin users outside IntelliJ IDEA
      and Android Studio needed LSP support in editors such as VS Code, Atom,
      Vim/Neovim, Emacs, and Helix. Package-manager adoption in Homebrew, MacPorts, Nix,
      and APK reflects that cross-editor audience.
    - >
      GitHub repository metadata observed on 2026-07-01 reported 2,035 stars and 249
      forks, a notable footprint for a language server maintained outside the language
      vendor.
  package-nerd-significance:
    - >
      This package is significant because language servers are exactly the kind of tool
      package managers make useful: one executable can unlock editor integrations across
      many frontends.
    - >
      It also captures a transitional moment in language tooling, where community LSP
      implementations filled gaps until language vendors shipped official servers.
  project-history:
    - >
      The GitHub repository was created on 2018-05-28 and early release metadata shows
      version 0.1.3 on 2018-06-12. The README describes a language server providing
      smart completion, diagnostics, hover, document symbols, definition lookup, and
      signature help for Kotlin in any LSP-capable editor.
    - >
      The README explicitly notes that JetBrains later published an official language
      server and that this community project can be considered deprecated. JetBrains
      documentation describes the official Kotlin Language Server as based on IntelliJ
      IDEA, the IntelliJ IDEA Kotlin plugin, JetBrains AIR, and Fleet.
  related-projects:
    - >
      The project is related to the Language Server Protocol, Kotlin compiler internals,
      editor LSP clients, VS Code Kotlin integrations, and JetBrains' official Kotlin
      Language Server.
    - >
      It also sits near kotlin-debug-adapter and tree-sitter-kotlin, both of which
      appear in the README as companion editor-agnostic Kotlin tooling.
  sources:
    - https://api.github.com/repos/fwcd/kotlin-language-server
    - https://github.com/fwcd/kotlin-language-server
    - https://github.com/fwcd/kotlin-language-server/releases
    - https://kotlinlang.org/docs/kotlin-lsp.html
  summary:
    - >
      fwcd/kotlin-language-server is the long-running community Kotlin implementation of
      the Language Server Protocol. It mattered because it gave editor-agnostic Kotlin
      completion, diagnostics, hover, symbols, and navigation before JetBrains published
      an official Kotlin language server.
  timeline:
    - '2018-05-28: GitHub repository created.'
    - '2018-06-12: 0.1.3 release published in GitHub release metadata.'
    - '2019-08-16: 0.3.0 release published.'
    - '2019-10-25: 0.4.0 release published.'
    - >
      2025: JetBrains documentation published an official Kotlin Language Server page,
      and the community README marked fwcd/kotlin-language-server deprecated in favor of
      it.
  usage:
    - >
      Users install the `kotlin-language-server` executable and configure an LSP client
      in their editor. For classpaths, the README documents automatic Maven or Gradle
      resolution as well as manual scripts such as `[project root]/kls-classpath` or
      config-root `kotlin-language-server/classpath` files.
    - >
      Its practical use was strongest for Kotlin/JVM projects where editor users wanted
      language intelligence without opening the project in IntelliJ IDEA.
related-packages:
  - id: cask:kotlin-lsp
    reason: >
      Choose JetBrains' official Kotlin LSP for current language support and
      IntelliJ-powered features; the fwcd server's own README identifies it as the
      successor and considers this community implementation deprecated.
    rel: alternative
    sources:
      - https://github.com/fwcd/kotlin-language-server#readme
      - https://kotlinlang.org/docs/kotlin-lsp.html
  - id: brew:gradle
    reason: >
      Use Gradle to declare and resolve a Kotlin project's dependencies, which the
      community language server can inspect when constructing its analysis classpath.
    rel: adjacent_workflow
    sources:
      - https://github.com/fwcd/kotlin-language-server#packaging
      - https://docs.gradle.org/current/userguide/dependency_management.html
  - id: brew:maven
    reason: >
      Use Maven for Kotlin/JVM project dependencies when the language server should
      derive its analysis classpath from a Maven build instead of a manual
      `kls-classpath` script.
    rel: adjacent_workflow
    sources:
      - https://github.com/fwcd/kotlin-language-server#packaging
      - https://maven.apache.org/guides/introduction/introduction-to-dependency-mechanism.html
category: developer-tools
package-manager:
  apk: kotlin-language-server
  brew: kotlin-language-server
  macports: kotlin-language-server
  nix: kotlin-language-server
package-manager-url: https://formulae.brew.sh/formula/kotlin-language-server
license: MIT
tags:
  - cli
  - editor-tooling
  - kotlin
  - language-server
  - lsp
description: Intelligent Kotlin support for any editor/IDE using the Language Server Protocol
executables:
  - kotlin-language-server
provenance:
  formula: kotlin-language-server
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
