id: brew:litani
display-name: Litani
homepage: https://awslabs.github.io/aws-build-accumulator/
repo: https://github.com/awslabs/aws-build-accumulator
docs:
  - https://awslabs.github.io/aws-build-accumulator
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is modest and mostly package-manager oriented. GitHub releases
      provide Debian packages and Homebrew installation instructions, and the Homebrew
      formula exposes the `litani` command for macOS users.
  package-nerd-significance:
    - >
      Litani is package-nerd interesting because it is a thin orchestration layer over
      familiar tools: shell commands, Ninja, JSON, and static HTML. Its value is in
      making build execution observable and packageable, not in replacing compilers or
      build file formats.
  project-history:
    - >
      The project is published from the `awslabs/aws-build-accumulator` repository and
      documents itself as a command-line build system rather than a new build language.
      Its workflow starts with `litani init`, adds jobs with dependencies, and runs the
      resulting graph with `litani run-build`.
    - >
      Litani's documentation emphasizes build accumulation: commands can be generated by
      scripts, Makefiles, or other systems, while Litani records return codes, runtimes,
      stdout, stderr, and other metadata in JSON and renders that data into an HTML
      report.
  related-projects:
    - >
      Related projects include Ninja, Make, CMake, Graphviz, Gnuplot, Jinja, and other
      build-reporting or continuous-integration tools.
  sources:
    - https://awslabs.github.io/aws-build-accumulator/
    - https://github.com/awslabs/aws-build-accumulator
    - https://github.com/awslabs/aws-build-accumulator/releases
  summary:
    - >
      Litani is an AWS Labs metabuild tool for accumulating command jobs into a
      dependency graph, running them through Ninja, and producing both a JSON run record
      and an HTML dashboard. It is aimed at builds where job metadata, failure policy,
      and reportability matter as much as command execution.
  timeline:
    - '2023-04-19: Release 1.24.0 provided Homebrew and Ubuntu package installation notes.'
    - '2026-03-02: Release 1.28.0 included Homebrew and Ubuntu package installation notes.'
    - >
      2026-06-12: Release 1.29.0 was published with Homebrew and Ubuntu package
      installation notes.
  usage:
    - >
      Users define jobs, dependencies, and failure behavior from the command line, then
      inspect `litani dump-run` output or the generated dashboard. The tool is most
      useful when an existing build needs reporting, dependency ordering, and durable
      run metadata without rewriting the build in a new DSL.
related-packages:
  - id: brew:ninja
    reason: >
      Litani generates a Ninja build and invokes Ninja to execute its accumulated job
      graph, so Ninja is its documented execution backend.
    rel: adjacent_workflow
    sources:
      - https://awslabs.github.io/aws-build-accumulator/
      - https://ninja-build.org/manual
  - id: brew:cmake
    reason: >
      CMake is a broader cross-platform build-system generator to consider when a
      project needs a declarative project model and multiple native backends rather than
      Litani's command accumulation and reporting workflow.
    rel: alternative
    sources:
      - https://awslabs.github.io/aws-build-accumulator/
      - https://cmake.org/about/
category: developer-tools
package-manager:
  brew: litani
package-manager-url: https://formulae.brew.sh/formula/litani
license: Apache-2.0
tags:
  - build-system
  - ci
  - cli
  - metabuild
  - pipeline
description: Metabuild system
executables:
  - litani
provenance:
  formula: litani
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
