id: brew:gcli
display-name: GCLI
homepage: https://herrhotzenplotz.de/gcli/
repo: https://github.com/herrhotzenplotz/gcli
docs:
  - https://herrhotzenplotz.de/gcli
config-file-location:
  unix: ~/.config/gcli/config
credentials-file-location:
  unix: ~/.config/gcli/config
history:
  adoption-history:
    - >
      The project homepage says GCLI is available in various distributions and asks
      users to submit packages for their preferred operating systems. The README lists
      tested systems across BSDs, Solaris and OmniOS, Debian and Devuan, Gentoo, Fedora,
      Alpine, Haiku, Minix, Darwin, and Windows/MSYS2, which signals a portability-first
      package culture.
  package-nerd-significance:
    - >
      GCLI is interesting because it deliberately avoids the modern pattern of one CLI
      per forge. For package maintainers, the notable traits are the C implementation,
      small dependency set, manual-page documentation, broad Unix portability testing,
      and explicit support for old-school email patch workflows.
  project-history:
    - >
      The public GitHub repository was created in October 2021, while the project
      homepage and README both point to Sourcehut, GitLab, and GitHub development
      surfaces. The project is written as a small, portable C tool with few
      dependencies, manual pages, built-in help, and support for scripted and
      interactive use.
  related-projects:
    - GitHub CLI is named by the README as the single-forge contrast that motivated GCLI.
    - GitLab, Gitea, Forgejo, GitHub, and Bugzilla are supported services.
    - Git and GoT are supported version-control integrations.
  sources:
    - https://api.github.com/repos/herrhotzenplotz/gcli
    - https://github.com/herrhotzenplotz/gcli
    - https://herrhotzenplotz.de/gcli
    - https://herrhotzenplotz.de/gcli/releases/
    - https://raw.githubusercontent.com/herrhotzenplotz/gcli/master/README.md
  summary:
    - >
      GCLI is a portable command-line client for working with multiple software forges
      through one interface. Its README frames the project as an answer to single-forge
      tools: instead of remembering separate commands for GitHub, GitLab, Gitea,
      Forgejo, and Bugzilla, GCLI presents a shared CLI.
  timeline:
    - '2021: GitHub records the public GCLI repository creation.'
    - '2024: The official release archive contains the 1.0 and 2.x release series.'
    - '2026: The release archive lists 2.12.0, and the repository remained active in June 2026.'
  usage:
    - >
      GCLI manages issues, merge requests, continuous integration, releases, and
      milestones from the terminal. It also integrates with Git and GoT, and its
      preferred contribution workflow is mailing-list based, with GitLab and GitHub
      mirrors accepted as alternatives.
related-packages:
  - id: brew:gh
    reason: >
      Choose GitHub CLI when you only work with GitHub and want GitHub's first-party
      command surface, extensions, and direct API support; choose GCLI for a consistent
      interface spanning multiple forge families.
    rel: alternative
    sources:
      - https://github.com/herrhotzenplotz/gcli#why
      - https://cli.github.com/
      - https://cli.github.com/manual/index
  - id: brew:glab
    reason: >
      Choose GLab for GitLab-specific issue, merge-request, and instance features;
      choose GCLI when the same workflow must also cover GitHub, Gitea, Forgejo, or
      Bugzilla.
    rel: alternative
    sources:
      - https://github.com/herrhotzenplotz/gcli#features
      - https://docs.gitlab.com/cli/
      - https://docs.gitlab.com/cli/connection/
category: developer-tools
package-manager:
  apk: gcli
  brew: gcli
  debian: gcli
  macports: gcli
  nix: gcli
  ubuntu: gcli
package-manager-url: https://formulae.brew.sh/formula/gcli
license: BSD-2-Clause
tags:
  - bugzilla
  - cli
  - forgejo
  - git
  - github
  - gitlab
  - version-control
description: Portable Git(hub|lab|tea)/Forgejo/Bugzilla CLI tool
executables:
  - gcli
provenance:
  formula: gcli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
