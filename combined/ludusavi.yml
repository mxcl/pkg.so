id: brew:ludusavi
display-name: Ludusavi
homepage: https://github.com/mtkennerly/ludusavi
repo: https://github.com/mtkennerly/ludusavi
docs:
  - https://github.com/mtkennerly/ludusavi/tree/master/docs
  - https://github.com/mtkennerly/ludusavi
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/ludusavi/config.yaml
    - ~/.config/ludusavi/config.yaml
    - ~/.var/app/com.github.mtkennerly.ludusavi/config/ludusavi/config.yaml
  macos: ~/Library/Application Support/ludusavi/config.yaml
  windows: '%APPDATA%/ludusavi/config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026 the repository had thousands of GitHub stars and regular releases, and
      upstream documentation listed Windows, Linux, and macOS downloads plus Winget,
      Scoop, Flatpak, Cargo, and package-manager distribution. Homebrew, Nix, Scoop, and
      Winget packaging make it easy to install in both desktop and automation-oriented
      environments.
    - >
      Its adoption is tied to Steam Deck and Proton growth: Ludusavi explicitly
      documents Proton saves, works on Steam Deck, and provides command-line behavior
      that fits backup scripts and game-launch wrappers.
  package-nerd-significance:
    - >
      Ludusavi is the kind of package that earns its place in multi-platform package
      indexes because it bridges desktop gaming and reproducible backup culture. Package
      maintainers care about it because it is a Rust desktop app with GUI and CLI
      surfaces, release assets for several operating systems, and data-driven behavior
      that depends on external manifest updates.
  project-history:
    - >
      The project was created on GitHub in June 2020 to solve a practical PC-gaming
      problem: game save files are scattered across launcher folders, user profiles,
      Wine and Proton prefixes, and sometimes the Windows registry. Ludusavi's README
      describes support for backup and restore across Steam, GOG, Epic, Heroic, Lutris,
      and other game libraries, plus Steam screenshots and Steam Deck workflows.
    - >
      Ludusavi separates the application from its game-location knowledge. The README
      states that it uses the Ludusavi Manifest for backup metadata and that the data is
      primarily sourced from PCGamingWiki, asking contributors to improve the wiki so
      those fixes flow back into Ludusavi's data.
  related-projects:
    - Ludusavi Manifest provides the game save metadata consumed by the application.
    - PCGamingWiki is the primary source for the save-location data.
    - A Playnite extension is linked from the README for users of that launcher.
  sources:
    - https://api.github.com/repos/mtkennerly/ludusavi
    - https://api.github.com/repos/mtkennerly/ludusavi/releases
    - https://github.com/mtkennerly/ludusavi
    - https://github.com/mtkennerly/ludusavi/blob/master/docs/help/application-folder.md
    - https://github.com/mtkennerly/ludusavi/blob/master/docs/help/configuration-file.md
    - https://github.com/mtkennerly/ludusavi/tree/master/docs
  summary:
    - >
      Ludusavi is a cross-platform game-save backup and restore tool written in Rust,
      with both a GUI and a scriptable command-line interface.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2020s: Rust GUI and CLI mature around a shared game-save manifest.'
    - '2025: v0.28 and v0.29 releases continue the regular release stream.'
    - >
      2026: v0.31.0 published, with upstream docs still listing broad package-manager
      availability.
  usage:
    - >
      Users can run Ludusavi interactively to preview, back up, and restore detected
      saves, or use the CLI for scheduled backups. Official docs cover backup
      automation, retention, validation, cloud backup, custom games, launch wrapping,
      root directories, and transferring saves between operating systems.
    - >
      The documented application folder stores `config.yaml`, logs, and `manifest.yaml`;
      the docs warn that the manifest is managed by Ludusavi and should not be edited
      manually.
related-packages:
  - id: brew:rclone
    reason: >
      Ludusavi directly integrates with rclone to upload and download save backups
      through configured cloud-storage remotes.
    rel: adjacent_workflow
    sources:
      - https://raw.githubusercontent.com/mtkennerly/ludusavi/master/docs/help/cloud-backup.md
      - https://rclone.org/docs/
category: games
package-manager:
  brew: ludusavi
  nix: ludusavi
  scoop: extras/ludusavi
  winget: mtkennerly.ludusavi
package-manager-url: https://formulae.brew.sh/formula/ludusavi
license: MIT
tags:
  - backup
  - cli
  - cross-platform
  - game-saves
  - gui
  - restore
  - steam
description: Backup tool for PC game saves
executables:
  - ludusavi
provenance:
  formula: ludusavi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
