id: brew:lego
display-name: lego
homepage: https://go-acme.github.io/lego/
repo: https://github.com/go-acme/lego
docs:
  - https://go-acme.github.io/lego
config-file-location:
  unix: ./.lego.yml
  windows: .\.lego.yml
credentials-file-location:
  unix:
    - ./.lego/accounts/<server>/<account>/account.json
    - ./.lego/accounts/<server>/<account>/keys/<account>.key
  windows:
    - .\.lego\accounts\<server>\<account>\account.json
    - .\.lego\accounts\<server>\<account>\keys\<account>.key
history:
  adoption-history:
    - >
      Lego's package-manager adoption is broad because certificate automation needs
      simple deployment on servers, containers, NAS devices, and CI hosts. The Homebrew,
      Debian, Ubuntu, Alpine, Arch, MacPorts, Nix, Scoop, winget, and zypper package
      presence in the input mirrors that role: it is a practical infrastructure binary
      rather than a language-only library.
  package-nerd-significance:
    - >
      Lego is package-nerd significant because it turned the messy edge of ACME
      automation into a portable Go binary with hundreds of provider integrations. It
      also became a library substrate for other Go programs that wanted certificate
      automation without shelling out to Certbot.
  project-history:
    - >
      The project began in 2015, before Let's Encrypt's public beta and before ACME
      became an RFC. A maintainer discussion explains that lego started around the need
      to make HTTPS automatic in a Go web-server project, at a time when Certbot still
      had a different name and ACME client tooling was experimental.
    - >
      Lego evolved into both a command-line client and an embeddable Go library. Its
      docs emphasize support for ACME v2/RFC 8555, multiple ACME servers, HTTP-01,
      DNS-01, TLS-ALPN-01, DNS-PERSIST-01, wildcard and SAN certificates, and a large
      DNS-provider integration matrix.
  related-projects:
    - >
      Related ACME clients include Certbot, acme.sh, dehydrated, Caddy's automatic HTTPS
      stack, Traefik's ACME support, win-acme, and Boulder, the Let's Encrypt CA
      software. Related standards include ACME RFC 8555 and challenge specifications
      such as HTTP-01, DNS-01, and TLS-ALPN-01.
  sources:
    - https://deps.dev/go/github.com%2Fgo-acme%2Flego/v2.7.2%2Bincompatible
    - https://github.com/advisories/GHSA-q82r-2j7m-9rv4
    - https://github.com/go-acme/lego
    - https://github.com/go-acme/lego/discussions/1914
    - https://github.com/go-acme/lego/releases
    - https://go-acme.github.io/lego/
    - https://go-acme.github.io/lego/dns/
    - https://www.rfc-editor.org/rfc/rfc8555
  summary:
    - >
      Lego is an ACME client and Go library for obtaining, renewing, and revoking
      certificates from Let's Encrypt and other ACME certificate authorities.
  timeline:
    - "2015: The project started before Let's Encrypt's public beta."
    - '2015-12-03: Dependency metadata records lego v0.1.0.'
    - '2019-03: RFC 8555 standardized ACME v2.'
    - >
      2024-09-05: The project disclosed GHSA-q82r-2j7m-9rv4 for HTTPS enforcement in
      ACME API use.
    - '2026-05: Official docs listed more than 200 DNS providers.'
  usage:
    - >
      Users commonly call `lego run` or `lego renew` with an email, domains, and a
      challenge method. DNS-01 support is especially important for wildcard certificates
      and machines that cannot expose HTTP challenges; the docs maintain per-provider
      credential and environment-variable pages for that integration surface.
related-packages:
  - id: brew:certbot
    reason: >
      Choose Certbot for a Python-based ACME client with first-party Apache and Nginx
      integration; choose lego for a portable Go binary or an embeddable Go library with
      a particularly broad DNS-provider catalog.
    rel: alternative
    sources:
      - https://certbot.eff.org/docs/
      - https://go-acme.github.io/lego/
  - id: brew:acme.sh
    reason: >
      Choose acme.sh when a shell-only ACME client suits minimal Unix systems or
      appliances; choose lego when a compiled Go binary and Go library API are
      preferable.
    rel: alternative
    sources:
      - https://github.com/acmesh-official/acme.sh
      - https://go-acme.github.io/lego/
  - id: brew:dehydrated
    reason: >
      Choose dehydrated for a small hook-oriented Bash ACME workflow using standard Unix
      tools; choose lego for native multi-platform distribution and built-in
      DNS-provider implementations.
    rel: alternative
    sources:
      - https://github.com/dehydrated-io/dehydrated
      - https://go-acme.github.io/lego/
  - id: brew:caddy
    reason: >
      Caddy is a practical adjacent choice when certificate acquisition and renewal
      should be integrated directly into an automatic-HTTPS web server instead of
      managed as a separate ACME command.
    rel: adjacent_workflow
    sources:
      - https://caddyserver.com/docs/automatic-https
      - https://go-acme.github.io/lego/
  - id: brew:traefik
    reason: >
      Traefik complements the same ACME operations in a provider-driven reverse-proxy
      workflow, especially for Docker and Kubernetes routing.
    rel: adjacent_workflow
    sources:
      - https://doc.traefik.io/traefik/https/acme/
      - https://go-acme.github.io/lego/
category: security
package-manager:
  apk: lego
  brew: lego
  debian: lego
  dnf: lego
  macports: lego
  nix: lego
  pacman: lego
  scoop: main/lego
  ubuntu: lego
  winget: GoACME.lego
  zypper: lego
package-manager-url: https://formulae.brew.sh/formula/lego
license: MIT
tags:
  - acme
  - certificates
  - cli
  - go-library
  - letsencrypt
description: Let's Encrypt client and ACME library
executables:
  - lego
provenance:
  formula: lego
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
