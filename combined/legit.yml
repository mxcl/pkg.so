id: brew:legit
display-name: legit
homepage: https://frostming.github.io/legit/
repo: https://github.com/frostming/legit
docs:
  - https://frostming.github.io/legit
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
    - ~/.config/git/config
credentials-file-location: null
history:
  adoption-history:
    - >
      Legit spread through Python packaging first, with PyPI releases beginning in 2011
      and later system packaging through Homebrew, Debian, Ubuntu, MacPorts, Nix, and
      Scoop. Its appeal peaked in the period when Git workflows were still intimidating
      to many new developers and GUI clients were influencing command-line ergonomics.
  package-nerd-significance:
    - >
      Legit is package-nerd history because it captures a particular moment in Git
      tooling: instead of exposing every Git feature, it offered a tiny vocabulary for a
      common feature-branch workflow. It also sits in the lineage of Kenneth Reitz's
      Python packaging era, where branding, API empathy, and CLI polish were treated as
      part of open-source distribution.
  project-history:
    - >
      Kenneth Reitz created Legit in the early 2010s as part of his broader 'for Humans'
      style of developer tools. The project translated parts of GitHub for Mac's
      opinionated branch workflow back to the command line: auto-stashing during branch
      switches, simple publish/unpublish commands, and a sync operation that handled
      fetch, merge or rebase, push, and unstash.
    - >
      The maintained package identity later centered on Frost Ming's `frostming/legit`
      repository and `frostming.github.io/legit` documentation. PyPI metadata for the
      package lists Kenneth Reitz among maintainers and authorship, while the repository
      topic and README preserve the GitHub-for-Mac inspiration.
  related-projects:
    - >
      Related Git ergonomics tools include GitHub Desktop, GitHub for Mac, hub, gh,
      git-extras, and custom Git aliases. Related Kenneth Reitz projects include
      Requests, Pipenv, Records, Maya, Delegator, and other 'for Humans' tools.
  sources:
    - https://frostming.github.io/legit/
    - https://github.com/frostming/legit
    - https://kennethreitz.org/software/legit
    - https://pypi.org/project/legit/0.1.0/
    - https://pypi.org/pypi/legit/json
  summary:
    - >
      Legit is a small Python CLI that wraps common Git branch workflows in
      human-oriented commands such as `sync`, `switch`, `publish`, and `unpublish`.
  timeline:
    - '2011-06-27: PyPI recorded the 0.0.1 source distribution upload.'
    - '2012-03-25: PyPI recorded the 0.1.0 release page for Legit.'
    - '2019-12-10: GitHub releases listed v1.2.0 for `frostming/legit`.'
    - '2020-03-14: PyPI recorded the 1.2.0.post0 wheel and source uploads.'
  usage:
    - >
      Package users install the `legit` command and run it inside Git repositories. Its
      commands are deliberately narrower than raw Git: switch branches while preserving
      worktree changes, sync a published branch, publish or unpublish branches, and list
      branch publication status.
related-packages:
  - id: brew:git-extras
    reason: >
      Choose git-extras for a large collection of independent Git subcommands, including
      feature, release, branch-cleanup, and repository-inspection tools; choose legit
      for a smaller opinionated publish-and-sync workflow.
    rel: alternative
    sources:
      - https://frostming.github.io/legit/
      - https://github.com/tj/git-extras/blob/main/Commands.md
category: developer-tools
package-manager:
  brew: legit
  debian: legit
  macports: legit
  nix: legit
  scoop: main/legit
  ubuntu: legit
package-manager-url: https://formulae.brew.sh/formula/legit
license: BSD-3-Clause
tags:
  - cli
  - git
  - workflow
description: Command-line interface for Git, optimized for workflow simplicity
executables:
  - legit
provenance:
  formula: legit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
