id: brew:marmot
display-name: Marmot
homepage: https://marmotdata.io
repo: https://github.com/marmotdata/marmot
docs:
  - https://marmotdata.io/docs/introduction
config-file-location:
  unix:
    - config.yaml
    - file supplied with --config
credentials-file-location:
  unix:
    - config.yaml
    - file supplied with --config
history:
  adoption-history:
    - >
      By 2026-07-01 GitHub metadata showed 592 stars and 21 forks. The supplied
      package-manager facts list a Homebrew formula, and the GitHub organization also
      publishes related deployment assets such as charts.
    - >
      The official docs frame adoption around agent-readable context: Marmot stores
      metadata such as schemas, ownership, descriptions, tags, lineage, and statistics,
      while not ingesting table rows, topic messages, or API payloads.
  package-nerd-significance:
    - >
      Marmot matters to package nerds as an example of the 2025-2026 wave of AI-adjacent
      infrastructure being packaged as ordinary CLIs and single binaries. Its MCP server
      makes the data-catalog package part of agent tooling, not just data-platform
      tooling.
  project-history:
    - >
      The Marmot repository was created on 2025-03-12. The README and official docs
      describe it as an open-source data catalog that catalogs tables, topics, queues,
      APIs, dashboards, services, and other assets, then exposes that metadata to humans
      and AI tools.
    - >
      The project is written in Go and positions itself as light infrastructure: a
      single binary backed by PostgreSQL, with a UI, REST API, plugin model, and
      built-in MCP server.
  related-projects:
    - >
      Marmot sits near data catalogs, metadata platforms, lineage tools, and MCP servers
      for AI agents.
    - >
      Its official organization also publishes Helm/chart deployment material for
      Kubernetes use.
  sources:
    - https://github.com/marmotdata/marmot
    - https://marmotdata.io/docs/introduction
    - https://raw.githubusercontent.com/marmotdata/marmot/main/README.md
    - source_facts.repo
  summary:
    - >
      Marmot is a young open-source data catalog and context layer for teams and AI
      agents, focused on metadata discovery rather than storing the underlying data.
  timeline:
    - '2025: GitHub repository created.'
    - >
      2026: v0.8 and v0.10 preview releases appeared with binary assets and
      agent-native/context-layer work.
  usage:
    - >
      Marmot is used by deploying the service, connecting sources through plugins or
      APIs, and browsing or querying cataloged assets through the UI, REST API, or MCP
      server. Its main package-manager relevance is the marmot executable and
      single-binary deployment story.
    - >
      Because it is still young, the package history is thinner than established
      Markdown tools. The official sources are strong on positioning and architecture,
      but public third-party adoption signals remain limited.
related-packages: []
category: ai
package-manager:
  brew: marmot
