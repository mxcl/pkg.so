  - cli
  - data-catalog
  - data-discovery
  - mcp
  - metadata
description: Open-source data catalog exposing metadata to AI agents
executables:
  - marmot
provenance:
  formula: marmot
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
