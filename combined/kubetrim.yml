id: brew:kubetrim
display-name: kubetrim
homepage: https://github.com/alexellis/kubetrim
repo: https://github.com/alexellis/kubetrim
docs:
  - https://github.com/alexellis/kubetrim#readme
config-file-location:
  unix: ~/.local/kubetrim/keep.txt
credentials-file-location:
  unix: ~/.kube/config
  windows: $HOME\.kube\config
history:
  adoption-history:
    - >
      kubetrim is niche but package-manager friendly: the batch input records Homebrew,
      Nix, and zypper packaging, and the README documents arkade and release downloads.
      That footprint is typical for Alex Ellis utilities that solve a recurring operator
      annoyance with a small binary.
  package-nerd-significance:
    - >
      kubetrim matters less as a broad Kubernetes platform and more as a tiny example of
      packageable operational hygiene. It wraps a manual, error-prone kubectl config
      cleanup routine into a single command with conservative behavior when every
      cluster appears unreachable.
  project-history:
    - >
      The project appeared as a compact Go repository with a README centered on one job:
      tidying old and broken cluster and context entries. Its own Q&A compares the tool
      to doing the work manually with kubectl config commands and notes that kubectx
      removes contexts but leaves additional cleanup steps.
  related-projects:
    - >
      Related tools include kubectl config, kubectx, arkade, k3sup, and other small
      Kubernetes operator utilities. kubetrim complements kubectx by cleaning both
      context and cluster entries after connectivity checks.
  sources:
    - https://formulae.brew.sh/formula/kubetrim
    - https://github.com/alexellis/kubetrim
    - https://github.com/alexellis/kubetrim/releases
  summary:
    - >
      kubetrim is a small Alex Ellis utility for pruning stale Kubernetes contexts and
      clusters from a kubeconfig. It is a deliberately narrow CLI: load a kubeconfig,
      test contexts, and write back the entries that still work.
  timeline:
    - '2024: The repository copyright and release series show the tool as an Alex Ellis Go CLI.'
    - >
      2024: v0.0.1 added the keep-file mechanism for unreachable clusters that should
      not be deleted.
    - '2024: v0.0.2 added a timeout when checking cluster contexts.'
  usage:
    - >
      Users run kubetrim against the kubeconfig selected by KUBECONFIG, optionally use
      --write=false for a dry run, and can keep unreachable contexts by listing them in
      ~/.local/kubetrim/keep.txt. The README also suggests cron or shell startup usage
      for people who accumulate short-lived clusters.
related-packages:
  - id: brew:kubectx
    reason: >
      Choose kubectx for explicit interactive context switching or deletion; choose
      kubetrim when you want connectivity-based cleanup of both stale context and
      cluster entries.
    rel: alternative
    sources:
      - https://github.com/alexellis/kubetrim#readme
      - https://github.com/ahmetb/kubectx#readme
category: cloud-infrastructure
package-manager:
  brew: kubetrim
  nix: kubetrim
  zypper: kubetrim
package-manager-url: https://formulae.brew.sh/formula/kubetrim
license: MIT
tags:
  - cleanup
  - cli
  - configuration
  - kubeconfig
  - kubernetes
description: Trim your KUBECONFIG automatically
executables:
  - kubetrim
provenance:
  formula: kubetrim
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
