id: brew:brightness
display-name: brightness
homepage: https://github.com/nriley/brightness
repo: https://github.com/nriley/brightness
docs:
  - https://github.com/nriley/brightness#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      brightness became a durable small utility for macOS automation users. It is
      packaged in Homebrew and MacPorts according to the input package facts, has
      hundreds of GitHub stars, and Homebrew analytics reported several thousand
      installs over the prior year at lookup time.
  package-nerd-significance:
    - >
      brightness is the archetypal tiny macOS system utility package: a single-purpose
      binary that exists because shell scripts and automation tools need access to a
      GUI-era hardware setting. Its significance is not breadth, but longevity across
      changing macOS display internals.
  project-history:
    - >
      The nriley/brightness repository was created in February 2014, with release 1.2
      published in August 2015. The README describes a focused utility for controlling
      all internal and some external displays from the command line.
    - >
      Its maintenance history mirrors macOS display API changes. The README notes that
      documented APIs worked through macOS 10.12.3, then Night Shift in 10.12.4 required
      an undocumented method, and Apple Silicon Macs later required another undocumented
      method.
  related-projects:
    - Homebrew and MacPorts distribute brightness for macOS users.
    - >
      macOS display APIs and IOKit-style display enumeration are the system interfaces
      around which the utility operates.
    - >
      Shell scripts, launch agents, and automation workflows are common consumers of
      this kind of command-line brightness control.
  sources:
    - https://formulae.brew.sh/api/formula/brightness.json
    - https://github.com/nriley/brightness
    - https://raw.githubusercontent.com/nriley/brightness/master/README.md
    - source_facts.package-manager
  summary:
    - >
      brightness is a macOS command-line utility for reading and setting display
      brightness from scripts or the terminal.
  timeline:
    - '2014: Repository created.'
    - '2015: Release 1.2 published.'
    - '2017: README documents the macOS 10.12.4 Night Shift-era API break and workaround.'
    - '2021: Repository history includes Universal 2 build work for Apple Silicon.'
    - '2026: Homebrew stable version reported as 1.2.'
  usage:
    - >
      Users run simple commands such as `brightness 1`, `brightness 0.5`, or `brightness
      -l` to set or list display brightness. The README cautions that displays not
      controllable through macOS Displays settings generally cannot be controlled by the
      tool either.
related-packages:
  - id: brew:ddcctl
    reason: >
      Choose ddcctl for scriptable DDC/CI control of external-monitor brightness,
      contrast, inputs, or volume when the macOS display APIs used by brightness cannot
      control that hardware.
    rel: alternative
    sources:
      - https://github.com/nriley/brightness#readme
      - https://github.com/kfix/ddcctl
  - id: cask:monitorcontrol
    reason: >
      Choose MonitorControl when you want a macOS menu-bar interface and keyboard
      controls for DDC-capable external displays instead of a command-only workflow.
    rel: alternative
    sources:
      - https://github.com/MonitorControl/MonitorControl
      - https://github.com/MonitorControl/MonitorControl/wiki/Monitor-Troubleshooting
category: system
package-manager:
  brew: brightness
  macports: brightness
package-manager-url: https://formulae.brew.sh/formula/brightness
license: BSD-2-Clause
tags:
  - brightness
  - cli
  - display
  - macos
  - system-utility
description: Change macOS display brightness from the command-line
executables:
  - brightness
provenance:
  formula: brightness
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
