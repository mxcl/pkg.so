id: brew:labctl
display-name: labctl
homepage: https://labs.iximiuz.com/playgrounds
repo: https://github.com/iximiuz/labctl
docs:
  - https://github.com/iximiuz/labctl#readme
config-file-location:
  unix: ~/.iximiuz/labctl/config.yaml
credentials-file-location:
  unix:
    - ~/.iximiuz/labctl/config.yaml
    - ~/.ssh/iximiuz_labs_user
history:
  adoption-history:
    - >
      Adoption is mostly iximiuz Labs users who prefer terminal access over a
      browser-only workflow. The README documents both the iximiuz install script and
      Homebrew installation on macOS and Linux, putting labctl into ordinary
      package-manager workflows despite its service-specific nature.
    - >
      The public release page shows frequent 0.1.x releases, including additions for
      playground status, wait behavior, regions, IDE integration, and readiness
      handling.
  package-nerd-significance:
    - >
      labctl is a useful example of a modern package-manager CLI whose main value is not
      local computation but authenticated orchestration of disposable remote
      environments. It turns a hosted learning product into scriptable terminal
      infrastructure.
    - >
      For DevOps learners and authors, that means reproducible playgrounds can be
      launched, connected to, exposed, and torn down with commands rather than browser
      clicks.
  project-history:
    - >
      The labctl repository documents the tool as a way to start remote microVM
      playgrounds from the command line. The README lists Linux, Docker, Kubernetes,
      networking, and other DevOps playground types and describes those environments as
      ephemeral and disposable.
    - >
      As the iximiuz Labs playground model evolved, labctl accumulated commands for
      browser opening, SSH access, IDE integration, public web terminals, HTTP exposure,
      port forwarding, and lifecycle management.
  related-projects:
    - iximiuz Labs playgrounds are the hosted service labctl controls.
    - >
      Firecracker is relevant to the platform architecture because iximiuz Labs
      describes its playground machines as microVMs.
    - >
      VS Code Remote SSH, Cursor, Windsurf, and SSH tooling are adjacent user-facing
      integrations documented by labctl.
  sources:
    - https://github.com/iximiuz/labctl
    - https://github.com/iximiuz/labctl/releases
    - https://labs.iximiuz.com/playgrounds
    - https://newsletter.iximiuz.com/posts/iximiuz-labs-playgrounds-2-0-dive-in
    - https://raw.githubusercontent.com/iximiuz/labctl/main/README.md
  summary:
    - >
      labctl is the command-line client for iximiuz Labs, a hands-on learning platform
      for Linux, containers, Kubernetes, networking, and DevOps playgrounds. It starts,
      lists, stops, destroys, and connects to remote playground environments from a
      local terminal.
    - >
      Its history is tightly coupled to iximiuz Labs rather than to a broad standalone
      ecosystem, so the package history is best understood as the CLI surface of a
      hosted microVM playground service.
  timeline:
    - >
      2020s: iximiuz Labs popularized hands-on Linux, container, Kubernetes, and
      networking playgrounds.
    - >
      2020s: labctl became the command-line access layer for starting and connecting to
      those playgrounds.
    - >
      2025: The Playgrounds 2.0 write-up described labctl as an SSH access path for
      microVM-based playgrounds.
    - >
      2026: v0.1.x releases added region, readiness, IDE, and playground lifecycle
      improvements.
  usage:
    - >
      A typical workflow is `labctl auth login`, followed by `labctl playground start
      docker`, `labctl playground start k3s --open`, or `labctl ssh <playground-id>`.
      The CLI can also expose shell sessions, forward ports, open local IDEs, and
      destroy playgrounds when finished.
    - >
      Credentials and SSH material are stored under the iximiuz labctl configuration and
      SSH paths documented in the package curation, which makes the Homebrew package
      both a CLI and a local session manager for remote training machines.
related-packages: []
category: cloud-infrastructure
package-manager:
  brew: labctl
  nix: labctl
package-manager-url: https://formulae.brew.sh/formula/labctl
license: Apache-2.0
tags:
  - cli
  - devops
  - docker
  - kubernetes
  - playgrounds
description: CLI tool for interacting with iximiuz labs and playgrounds
executables:
  - labctl
provenance:
  formula: labctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
