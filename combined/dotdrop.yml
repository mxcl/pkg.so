id: brew:dotdrop
display-name: dotdrop
homepage: https://github.com/deadc0de6/dotdrop
repo: null
docs:
  - https://dotdrop.readthedocs.io/
config-file-location:
  unix:
    - config.yaml
    - ${XDG_CONFIG_HOME}/dotdrop/config.yaml
    - ~/.config/dotdrop/config.yaml
    - /etc/xdg/dotdrop/config.yaml
    - /etc/dotdrop/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      dotdrop adoption comes from users whose dotfiles outgrow simple symlink farms:
      multiple machines, overlapping file sets, per-host variables, templates,
      import/update workflows, and optional handling for sensitive content.
    - >
      The official README advertises distribution through PyPI, Homebrew, AUR,
      Snapcraft, and Pacstall, while source facts list Homebrew, Debian, and Ubuntu.
  package-nerd-significance:
    - >
      dotdrop is package-nerd significant as the profile-and-template-heavy alternative
      in the dotfiles space. It is more opinionated than a tiny bootstrapper but still
      lives as a CLI around Git, YAML, and predictable files.
    - >
      For packagers, its value is in giving users a maintained command-line tool instead
      of copy-pasted shell glue for multi-host dotfile deployment.
  project-history:
    - >
      The official README frames dotdrop around a specific gap in dotfile tools: many
      can manage files, but fewer can deploy different versions of the same dotfile on
      different hosts. Its model stores dotfiles in Git, keeps metadata in config.yaml,
      and uses profiles to choose which files and variables apply on each machine.
    - >
      GitHub release metadata shows public releases from the v0.10 series in 2018
      through the v1.16 series in 2026, indicating a long-lived Python CLI with
      continued maintenance.
  related-projects:
    - >
      dotdrop is related to other dotfiles managers and bootstrap tools, including
      Dotbot, GNU Stow-style symlink workflows, chezmoi-like multi-host management,
      Git-backed dotfiles repositories, and package channels such as PyPI, Homebrew,
      AUR, and Snapcraft.
  sources:
    - https://github.com/deadc0de6/dotdrop
    - https://dotdrop.readthedocs.io/
    - https://api.github.com/repos/deadc0de6/dotdrop/releases?per_page=100
    - https://formulae.brew.sh/formula/dotdrop
  summary:
    - >
      dotdrop is a dotfile manager for storing dotfiles once and deploying different
      versions or sets across hosts by using profiles, templating, variables, and a
      central config.yaml.
  timeline:
    - '2018: GitHub release metadata shows v0.10.x public releases.'
    - >
      2020s: dotdrop is distributed through PyPI, Homebrew, AUR, Snapcraft, and other
      package channels.
    - '2026: GitHub release metadata shows v1.16.x releases.'
  usage:
    - >
      Users initialize or clone a dotfiles repository, install dotdrop, generate
      config.yaml, import dotfiles, and deploy selected profiles. Commands such as
      import and compare are central to the workflow, with dotpath, profiles, variables,
      templates, actions, and transformations configured in YAML.
    - >
      The tool is especially useful when a home laptop, work desktop, temporary VM, and
      other hosts share many dotfiles but need different deployed subsets or template
      values.
category: developer-tools
package-manager:
  brew: dotdrop
  debian: dotdrop
  ubuntu: dotdrop
package-manager-url: https://formulae.brew.sh/formula/dotdrop
license: GPL-3.0-or-later
tags:
  - cli
  - configuration-management
  - dotfiles
  - profiles
  - templating
description: Save your dotfiles once, deploy them everywhere
executables:
  - dotdrop
provenance:
  formula: dotdrop
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
