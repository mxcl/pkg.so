id: brew:helmsman
display-name: helmsman
homepage: https://github.com/mkubaczyk/helmsman
repo: https://github.com/mkubaczyk/helmsman
docs:
  - https://github.com/mkubaczyk/helmsman#readme
config-file-location:
  unix:
    - ./*.toml
    - ./*.yaml
    - ./*.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Helmsman gained attention in the same era as Helmfile: Kubernetes users had many
      Helm charts to deploy, but wanted a declarative file and a plan step instead of
      shell scripts full of `helm install` commands. Its packaging through Homebrew and
      other distributions reflects use as a local or CI command-line deployment tool.
  package-nerd-significance:
    - >
      Helmsman is part of the Helm wrapper generation that treated Kubernetes releases
      as package sets. For package-minded operators, its desired-state file is the
      manifest of packages, while Helm remains the lower-level package manager.
    - >
      The explicit major-line mapping to Helm 2, Helm 3, and Helm 4 makes it a good
      example of a wrapper whose own packaging has to track another package manager's
      compatibility surface.
  project-history:
    - >
      The `mkubaczyk/helmsman` repository was created in 2017 and early releases
      followed quickly, with a 0.1.0 release in November 2017 and a 1.0.0 release in
      March 2018. The README describes the tool as a way to automate deployment and
      management of Helm charts from version-controlled code.
    - >
      Helmsman uses a desired state file, originally centered on TOML and also accepting
      YAML, to define repositories, namespaces, releases, protection settings, and
      execution order. Its README emphasizes plan/view/apply behavior, idempotency,
      namespace and release protection, priority ordering, and parallel execution.
    - >
      The README records a stewardship change from Praqma, later Eficode, to the
      maintainers of the `mkubaczyk/helmsman` repository. Later documentation
      distinguishes Helmsman major lines by Helm compatibility, with v1.x for Helm 2 and
      v4.x for Helm 3 and Helm 4.
  related-projects:
    - Helm is the chart manager Helmsman orchestrates.
    - kubectl is a runtime prerequisite for binary use.
    - >
      helm-diff is listed by the README as a required plugin for Helmsman versions from
      1.6.0 onward.
  sources:
    - https://api.github.com/repos/mkubaczyk/helmsman
    - https://api.github.com/repos/mkubaczyk/helmsman/releases/tags/v1.0.0
    - https://api.github.com/repos/mkubaczyk/helmsman/releases/tags/v4.0.0
    - https://github.com/mkubaczyk/helmsman
    - https://raw.githubusercontent.com/mkubaczyk/helmsman/master/README.md
  summary:
    - >
      Helmsman is a 'Helm Charts as Code' CLI for managing Helm releases from a
      declarative desired state file. It plans, validates, and applies a set of chart
      releases, using Helm and Kubernetes tooling underneath.
  timeline:
    - '2017: The `mkubaczyk/helmsman` repository was created and 0.1.0 was released.'
    - '2018: Helmsman v1.0.0 was published.'
    - '2025: Helmsman v4.0.0 was published with documentation for Helm 3 and Helm 4 support.'
  usage:
    - >
      Users run `helmsman -f example.toml` to plan, `helmsman --apply -f example.toml`
      to execute, and flags such as `--dry-run`, `--debug`, and `--target` to inspect or
      limit changes. A binary install expects `kubectl`, `helm`, and for many versions
      the `helm-diff` plugin.
    - >
      The tool can run as a binary, as a container in CI, or as a container inside a
      Kubernetes cluster. Its value is strongest where release ordering, namespace
      protection, and repeated idempotent application matter.
related-packages:
  - id: brew:helm@3
    reason: >
      Helm provides the chart and release commands that Helmsman plans and executes from
      its desired-state files.
    rel: adjacent_workflow
    sources:
      - https://github.com/mkubaczyk/helmsman
      - https://helm.sh/docs/
  - id: brew:helmfile
    reason: >
      Choose Helmfile instead when environment layering, release templates, lock files,
      and its Helm-oriented diff/apply workflow are the better fit.
    rel: alternative
    sources:
      - https://github.com/mkubaczyk/helmsman
      - https://helmfile.readthedocs.io/en/stable/
category: cloud-infrastructure
package-manager:
  brew: helmsman
  nix: helmsman
  zypper: helmsman
package-manager-url: https://formulae.brew.sh/formula/helmsman
license: MIT
tags:
  - charts-as-code
  - cli
  - deployment
  - devops
  - helm
  - kubernetes
description: Helm Charts as Code tool
executables:
  - helmsman
provenance:
  formula: helmsman
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
