id: brew:lf
display-name: lf
homepage: https://godoc.org/github.com/gokcehan/lf
repo: https://github.com/gokcehan/lf
docs:
  - https://github.com/gokcehan/lf#readme
  - https://github.com/gokcehan/lf/blob/master/doc.md
  - https://pkg.go.dev/github.com/gokcehan/lf
config-file-location:
  unix:
    - /etc/lf/lfrc
    - ~/.config/lf/lfrc
    - /etc/lf/colors
    - ~/.config/lf/colors
    - /etc/lf/icons
    - ~/.config/lf/icons
  windows:
    - C:\ProgramData\lf\lfrc
    - C:\Users\<user>\AppData\Roaming\lf\lfrc
    - C:\ProgramData\lf\colors
    - C:\Users\<user>\AppData\Roaming\lf\colors
    - C:\ProgramData\lf\icons
    - C:\Users\<user>\AppData\Roaming\lf\icons
credentials-file-location: null
history:
  adoption-history:
    - >
      lf became a staple option in the small but active terminal-file-manager ecosystem.
      The package metadata in this batch lists packages across Alpine, Homebrew, Debian,
      MacPorts, Nix, Arch, Scoop, Ubuntu, winget, and openSUSE, which matches its
      cross-platform design.
  package-nerd-significance:
    - >
      Package nerds care about lf because it is a modern Go-era reinterpretation of
      ranger: fast single-binary distribution, portable packaging, and deliberate
      reliance on external Unix tools for parts of the workflow. It is also a good
      example of a TUI program whose package value is mostly ergonomics and glue, not a
      daemon or library.
  project-history:
    - >
      The `gokcehan/lf` repository was created on August 13, 2016. Its README describes
      a cross-platform terminal file manager with ranger inspiration, fast startup, low
      memory footprint, asynchronous I/O, a server/client architecture, remote commands,
      shell-command extensibility, and configurable keybindings.
    - >
      The official documentation can be read inside the program with `lf -doc`, via the
      `help` command, as a man page, or online in `doc.md`, which reinforces the
      package's culture as a terminal-first application rather than a GUI file browser.
  related-projects:
    - >
      lf is most directly related to ranger, its stated inspiration. It sits beside
      other terminal file managers such as nnn, vifm, yazi, mc, and broot, and it
      depends culturally on shell tools, preview commands, terminal emulators, and
      editor integrations.
  sources:
    - https://api.github.com/repos/gokcehan/lf
    - https://formulae.brew.sh/formula/lf
    - https://github.com/gokcehan/lf
    - https://github.com/gokcehan/lf/blob/master/doc.md
    - https://github.com/gokcehan/lf/releases
  summary:
    - >
      `lf`, short for 'list files', is a terminal file manager written in Go and heavily
      inspired by ranger. It packages the familiar keyboard-driven file-manager workflow
      as a single static binary with shell-extensible commands.
  timeline:
    - '2016: The `gokcehan/lf` repository was created on August 13, 2016.'
    - >
      2016: The project was shared publicly as 'lf: A terminal file manager' in
      command-line communities.
    - >
      2018: Release discussions around r5 show lf already had a user-feedback loop
      around terminal-file-manager behavior.
    - >
      2026: The upstream repository remained active, with Homebrew packaging and
      documented cross-platform installation paths.
  usage:
    - >
      Users launch `lf` in a directory, navigate with keyboard bindings, preview files,
      run shell commands, and use configuration files such as `lfrc`, `colors`, and
      `icons` to tailor behavior. Its design encourages composing with external
      previewers, openers, editors, and shell scripts.
related-packages:
  - id: brew:ranger
    reason: >
      ranger is lf's explicitly stated inspiration; choose it when its Python
      implementation, preview system, and established plugin ecosystem better fit the
      workflow.
    rel: alternative
    sources:
      - https://github.com/gokcehan/lf#readme
      - https://ranger.github.io/
  - id: brew:yazi
    reason: >
      Yazi provides the same keyboard-driven terminal file-management task with a
      Rust-based asynchronous design and built-in image-preview capabilities.
    rel: alternative
    sources:
      - https://github.com/gokcehan/lf#readme
      - https://yazi-rs.github.io/
category: productivity
package-manager:
  apk: lf
  brew: lf
  debian: lf
  macports: lf
  nix: lf
  pacman: lf
  scoop: main/lf
  ubuntu: lf
  winget: LlamaFarm.CLI
  zypper: lf
package-manager-url: https://formulae.brew.sh/formula/lf
license: MIT
tags:
  - cli
  - file-manager
  - go
  - terminal
  - tui
description: Terminal file manager
executables:
  - lf
provenance:
  formula: lf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
