id: brew:chromaprint
display-name: Chromaprint
homepage: https://acoustid.org/chromaprint
repo: https://github.com/acoustid/chromaprint
docs:
  - https://acoustid.org/chromaprint
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Chromaprint is distributed as both a library and tools package across many package
      managers. The supplied package-manager facts list Homebrew, Debian/Ubuntu
      development packages, Fedora/dnf tools, MacPorts, Nix, pacman, Scoop, winget, and
      zypper variants.
    - >
      The upstream README calls out `fpcalc` as used by MusicBrainz Picard and lists
      FFmpeg and GStreamer integrations, showing adoption both in end-user tagging tools
      and media frameworks.
  package-nerd-significance:
    - >
      Chromaprint is significant because it sits at the crossroads of package managers,
      multimedia stacks, and music metadata. It is small enough to be a formula, but
      important enough to appear as a library dependency, a CLI utility, and an
      integration point for FFmpeg, GStreamer, and MusicBrainz Picard workflows.
  project-history:
    - >
      The GitHub repository was created in April 2011. The README says Chromaprint is an
      audio fingerprint library developed for the AcoustID project, with compact
      fingerprints designed for full-file identification, duplicate detection, and
      long-stream monitoring rather than general-purpose fingerprinting.
    - >
      The tag history reaches back to v0.1 in 2010-era code, v1.0 in 2013, and official
      GitHub releases from the v1.4 series through 1.6.0 in August 2025.
  related-projects:
    - >
      AcoustID is the parent project and service. The README also lists MusicBrainz
      Picard usage, FFmpeg and GStreamer integrations, and bindings or reimplementations
      for Python, Rust, Ruby, Perl, JavaScript, Go, C#, Vala, Swift, and other
      languages.
  sources:
    - https://acoustid.org/chromaprint
    - https://github.com/acoustid/chromaprint#readme
    - https://github.com/acoustid/chromaprint/releases
    - https://formulae.brew.sh/api/formula/chromaprint.json
  summary:
    - >
      Chromaprint is the C audio-fingerprint library and `fpcalc` tool developed for
      AcoustID, optimized for identifying near-identical audio files and streams.
  timeline:
    - '2010: Early v0.1 tag appears in project history.'
    - '2011: GitHub repository created under the AcoustID organization.'
    - '2013: v1.0 tag appears.'
    - '2016: v1.4 GitHub release published.'
    - '2020: v1.5.0 release published.'
    - '2021: v1.5.1 release published.'
    - '2025: v1.6.0 release published; Homebrew stable version reports 1.6.0.'
  usage:
    - >
      Builders normally enable the tools with CMake and FFmpeg support, producing the
      shared library plus `fpcalc`. Users and applications calculate audio fingerprints,
      then use AcoustID-style matching or duplicate-detection workflows.
related-packages:
  - id: cask:musicbrainz-picard
    reason: >
      Picard uses the bundled Chromaprint `fpcalc` utility to calculate AcoustID
      fingerprints and apply MusicBrainz metadata to audio files.
    rel: adjacent_workflow
    sources:
      - https://github.com/acoustid/chromaprint/blob/master/README.md
      - https://picard-docs.musicbrainz.org/en/latest/config/options_fingerprinting.html
  - id: brew:beets
    reason: >
      beets combines Chromaprint-generated fingerprints with AcoustID matching in a
      command-line music-library tagging workflow.
    rel: adjacent_workflow
    sources:
      - https://acoustid.org/
      - https://beets.readthedocs.io/en/stable/plugins/chroma.html
  - id: brew:ffmpeg
    reason: >
      FFmpeg decodes and resamples audio for `fpcalc`, is required for the standard tool
      build, and also provides a documented Chromaprint integration.
    rel: adjacent_workflow
    sources:
      - https://acoustid.org/chromaprint
      - https://github.com/acoustid/chromaprint/blob/master/README.md
      - https://ffmpeg.org/ffmpeg-formats.html#chromaprint-1
category: media
package-manager:
  apk: chromaprint
  brew: chromaprint
  debian: libchromaprint-dev
  dnf: chromaprint-tools
  macports: chromaprint
  nix: chromaprint
  pacman: chromaprint
  scoop: main/chromaprint
  ubuntu: libchromaprint-dev
  winget: AcoustID.Chromaprint
  zypper: chromaprint-devel
package-manager-url: https://formulae.brew.sh/formula/chromaprint
license: LGPL-2.1-or-later
tags:
  - acoustid
  - audio
  - cli
  - fingerprinting
  - library
  - music-identification
description: Core component of the AcoustID project (Audio fingerprinting)
executables:
  - fpcalc
provenance:
  formula: chromaprint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
