id: brew:mysql@8.0
display-name: MySQL 8.0
homepage: https://github.com/mysql/mysql-server
repo: https://github.com/mysql/mysql-server
docs:
  - https://dev.mysql.com/doc/refman/8.0/en
  - https://dev.mysql.com/doc/refman/8.0/en/option-files.html
config-file-location:
  unix: ~/.my.cnf
credentials-file-location:
  unix: ~/.my.cnf
history:
  sources:
    - https://dev.mysql.com/doc/refman/8.0/en/mysql-nutshell.html
    - https://dev.mysql.com/doc/refman/8.4/en/mysql-releases.html
    - https://dev.mysql.com/doc/relnotes/mysql/8.0/en/
    - https://formulae.brew.sh/formula/mysql@8.0
  summary:
    - >
      MySQL 8.0 is the long-lived 8.0 series of Oracle's MySQL Server. Its release notes
      trace the series from development milestone 8.0.0 on September 12, 2016, through
      general-availability 8.0.11 on April 19, 2018. The 8.0 reference manual lists
      major technical changes that made the series a substantial upgrade over 5.7,
      including a transactional data dictionary, atomic DDL, automatic upgrade work
      formerly handled by `mysql_upgrade`, roles, `caching_sha2_password` as the
      preferred/default authentication plugin, utf8mb4 as the default character set,
      common table expressions, window functions, JSON enhancements, invisible indexes,
      descending indexes, resource groups, and other optimizer, security, and InnoDB
      work.
  usage:
    - >
      The package-manager role of `mysql@8.0` is preservation: it lets Homebrew users
      install the 8.0 branch separately from the unversioned `mysql` formula and from
      `mysql@8.4`. Homebrew marks the formula deprecated, keg-only, and tied to the
      8.0.46 stable build, which matches Oracle's 8.0 release-notes line that covers
      changes through 8.0.46. It is useful where an application, connector,
      authentication behavior, upgrade path, or production compatibility policy still
      depends on the 8.0 series rather than the 8.4 LTS or newer Innovation/LTS model.
related-packages:
  - id: brew:mysql@8.4
    reason: >
      Choose MySQL 8.4 for the official LTS successor when its longer stable support
      model and application compatibility have been validated.
    rel: alternative
    sources:
      - https://dev.mysql.com/doc/refman/8.4/en/mysql-releases.html
      - https://dev.mysql.com/doc/refman/8.4/en/upgrade-prerequisites.html
  - id: brew:mariadb@11.8
    reason: >
      Choose MariaDB 11.8 when a maintained MySQL-compatible LTS server is acceptable
      and MariaDB-specific behavior has been tested against the application.
    rel: alternative
    sources:
      - https://mariadb.org/11-8-lts-released/
      - >
        https://mariadb.com/docs/release-notes/community-server/about/compatibility-and-differences/mariadb-vs-mysql-compatibility
  - id: brew:mysqltuner
    reason: >
      MySQLTuner can inspect an established MySQL 8.0 workload and turn its
      configuration and status statistics into advisory tuning and security findings.
    rel: adjacent_workflow
    sources:
      - https://github.com/jmrenouard/MySQLTuner-perl
      - https://github.com/jmrenouard/MySQLTuner-perl/blob/master/USAGE.md
category: data
