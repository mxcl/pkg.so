id: brew:monero
display-name: Monero
homepage: https://www.getmonero.org/downloads/#cli
repo: https://github.com/monero-project/monero
docs:
  - https://docs.getmonero.org/
  - https://docs.getmonero.org/interacting/monero-wallet-cli-reference
config-file-location:
  unix:
    - ~/.bitmonero/bitmonero.conf
    - ~/.bitmonero/stagenet/monero-wallet-cli.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The Homebrew formula packages the official CLI stack rather than just a wallet
      wrapper. It installs monerod for running a node, monero-wallet-cli and
      monero-wallet-rpc for wallet operation and automation, plus blockchain import,
      export, pruning, statistics, and multisig-related utilities. In practice the
      package is used by operators who want local node control, command-line wallet
      workflows, RPC integration, mining-related tooling, or reproducible builds from
      source rather than a GUI-only wallet.
  project-history:
    - >
      The technical history centers on making privacy the default behavior of the
      network. The Monero codebase describes the system as a decentralized digital
      currency where users control funds and transaction details are not easily revealed
      on the public ledger. GetMonero's introductory material names stealth addresses,
      ring signatures, and RingCT as the three main techniques that hide recipient,
      sender, and amount information; its Moneropedia entry records RingCT's
      implementation at block 1220516 in January 2017 and its mandatory use after
      September 2017.
  sources:
    - https://formulae.brew.sh/formula/monero
    - https://github.com/monero-project/monero
    - https://www.getmonero.org/get-started/what-is-monero/
    - https://www.getmonero.org/resources/about/
    - https://www.getmonero.org/resources/moneropedia/ringCT.html
  summary:
    - >
      Monero is the reference command-line software for the Monero privacy
      cryptocurrency. The project traces its origin to CryptoNote: GetMonero describes
      an April 2014 launch of the CryptoNote reference code with no premine or
      instamine, followed by a community split from the founder known as
      thankful_for_today and a fork followed by the community and Core Team. The
      currency was initially known as BitMonero, and the official materials emphasize a
      launch model and governance culture distinct from many premined cryptocurrency
      projects.
  usage:
    - >
      Monero's adoption is tied to the broader privacy-coin community: users value
      fungibility, default confidentiality, CPU-oriented mining, and the ability to
      audit or selectively disclose wallet information via keys. That same privacy focus
      has also made the project a frequent subject of exchange, regulatory, and forensic
      discussion, but the package record itself is best understood as the official
      Unix-style toolchain for participating in the Monero network.
related-packages:
  - id: cask:monero-wallet
    reason: >
      Choose the official Monero GUI for a graphical wallet workflow while retaining
      compatibility with Monero's node and wallet ecosystem.
    rel: adjacent_workflow
    sources:
      - https://github.com/monero-project/monero
      - https://github.com/monero-project/monero-gui
      - https://docs.getmonero.org/interacting/overview/
category: security
package-manager:
