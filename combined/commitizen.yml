id: brew:commitizen
display-name: Commitizen
homepage: https://commitizen-tools.github.io/commitizen/
repo: https://github.com/commitizen-tools/commitizen
docs:
  - https://commitizen-tools.github.io/commitizen
config-file-location:
  unix:
    - ./.cz.toml
    - ./cz.toml
    - ./.cz.json
    - ./cz.json
    - ./.cz.yaml
    - ./cz.yaml
    - ./pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Commitizen is distributed as a Python package and documented for installation
      through pipx, uv, pip, conda, Poetry, pdm, and Homebrew. That spread is notable
      because the tool is not only a Python-project helper; it is commonly installed as
      a developer workstation CLI for projects in any language that want commit and
      release rules.
  package-nerd-significance:
    - >
      Commitizen sits at the intersection of source-control hygiene and package release
      mechanics. For package maintainers, it is significant because the same commit
      taxonomy can feed semantic versioning, changelog text, tags, and CI release steps.
  project-history:
    - >
      The project grew around the idea that commit-message conventions can drive release
      work: the CLI guides commit creation, validates commit messages, calculates
      version bumps from commit history, and can update changelogs. The public Python
      package history on PyPI dates back to 2017, placing this implementation in the
      wave of Conventional Commits tooling that moved commit metadata into everyday
      release automation.
  related-projects:
    - >
      Commitizen is closely related to Conventional Commits, Semantic Versioning, Keep a
      Changelog, and pre-commit-style Git hook workflows.
  sources:
    - https://commitizen-tools.github.io/commitizen/
    - https://github.com/commitizen-tools/commitizen
    - https://raw.githubusercontent.com/commitizen-tools/commitizen/master/docs/README.md
    - https://pypi.org/pypi/commitizen/json
  summary:
    - >
      Commitizen is a Python CLI for standardized Git commits and release automation.
      Its official documentation presents it as a tool for Conventional Commits,
      semantic version bumping, and changelog generation.
  timeline:
    - '2017: PyPI records public Commitizen releases.'
    - >
      2020s: Official documentation emphasizes Conventional Commits, semantic
      versioning, changelog generation, and pre-commit integration.
    - '2026: PyPI continues to publish 4.x releases.'
  usage:
    - >
      Typical usage centers on `cz commit` for guided commits, commit-message validation
      through pre-commit-style hooks, and `cz bump` for version and changelog updates.
      Its package-manager value comes from making release conventions executable rather
      than leaving them as prose in CONTRIBUTING files.
related-packages:
  - id: brew:commitlint
    reason: >
      Choose commitlint for focused, Node-oriented commit-message linting with shareable
      npm rule configurations; choose Commitizen when guided authoring, version bumping,
      and changelog generation should be handled by one tool.
    rel: alternative
    sources:
      - https://commitizen-tools.github.io/commitizen/
      - https://commitlint.js.org/
      - https://commitlint.js.org/reference/configuration.html
  - id: brew:pre-commit
    reason: >
      pre-commit can install and run Commitizen's official commit-msg hook, giving
      repositories a reproducible way to enforce Commitizen checks during commits.
    rel: adjacent_workflow
    sources:
      - https://commitizen-tools.github.io/commitizen/tutorials/auto_check/
      - https://pre-commit.com/
category: developer-tools
package-manager:
  brew: commitizen
  macports: commitizen
  nix: commitizen
  winget: shipengqi.commitizen
package-manager-url: https://formulae.brew.sh/formula/commitizen
license: MIT
tags:
  - changelog
  - cli
  - commits
  - conventional-commits
  - git
  - release-management
  - semantic-versioning
description: Defines a standard way of committing rules and communicating it
executables:
  - cz
  - git-cz
provenance:
  formula: commitizen
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
