credentials-file-location: null
history:
  adoption-history:
    - >
      Sentinel became the policy-enforcement layer across HashiCorp's enterprise product
      suite, including Terraform, Vault, Nomad, and Consul. Its adoption is tied
      especially closely to infrastructure-as-code governance and automated compliance
      workflows.
  package-nerd-significance:
    - >
      Sentinel is notable for bringing a purpose-built, embeddable policy language into
      the HashiCorp ecosystem. The standalone simulator lets policy authors format,
      test, and apply policies locally before enforcing them in a hosted or enterprise
      workflow.
  project-history:
    - >
      HashiCorp announced and released Sentinel at HashiConf in September 2017 as its
      policy-as-code framework. The initial design combined a policy-oriented language,
      an embedded runtime, a development simulator, and a plugin SDK.
    - >
      Later Terraform Enterprise work added policy sets and expanded integrations,
      making Sentinel a reusable governance mechanism rather than a collection of
      workspace-specific checks.
  related-projects:
    - HashiCorp Terraform
    - HashiCorp Vault
    - HashiCorp Nomad
    - HashiCorp Consul
    - Open Policy Agent
  sources:
    - https://developer.hashicorp.com/sentinel/docs/configuration
    - https://developer.hashicorp.com/sentinel/docs/intro
    - https://www.hashicorp.com/en/blog/announcing-policy-sets-in-terraform-enterprise
    - https://www.hashicorp.com/en/blog/hashicorp-announcements-hashiconf-2017
  summary:
    - >
      Sentinel is HashiCorp's embeddable policy-as-code language and framework. It is
      used to express and test logic-based guardrails that HashiCorp products can
      enforce during infrastructure and security workflows.
  timeline:
    - '2017: HashiCorp announced and released Sentinel at HashiConf.'
    - '2017: Vault Enterprise and Terraform Enterprise introduced Sentinel integrations.'
    - '2018: Terraform Enterprise added reusable Sentinel policy sets.'
  usage:
    - >
      Authors write policies in Sentinel's language, organize them with HCL or JSON
      configuration, and use the CLI simulator to apply and test them. In integrated
      products, policies commonly approve, warn about, or block infrastructure
      operations according to security, compliance, cost, or operational rules.
category: security
