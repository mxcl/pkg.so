id: brew:mlx-lm
display-name: MLX LM
homepage: https://github.com/ml-explore/mlx-lm
repo: https://github.com/ml-explore/mlx-lm
docs:
  - https://github.com/ml-explore/mlx-lm/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      Its ecosystem role is to make MLX usable for Hugging Face-style LLM work without
      each user wiring model loading, tokenization, generation loops, quantization, and
      fine-tuning scripts by hand. The README highlights Hugging Face Hub integration,
      quantizing and uploading models, low-rank and full fine-tuning with quantized
      models, and distributed inference and fine-tuning through MLX distributed support.
      The MLX examples repository points users from earlier LLM examples to MLX LM as
      the more fully featured package.
  sources:
    - https://developer.apple.com/videos/play/wwdc2025/298/
    - https://formulae.brew.sh/formula/mlx-lm
    - https://github.com/ml-explore/mlx-examples/blob/main/llms/README.md
    - https://github.com/ml-explore/mlx-lm
    - https://huggingface.co/mlx-community
  summary:
    - >
      MLX LM is the language-model layer built on top of Apple's MLX array framework.
      The upstream project describes it as a Python package for generating text and
      fine-tuning large language models on Apple silicon with MLX. It packages common
      local-LLM workflows into command-line tools and Python APIs: generation, chat,
      model conversion, quantization, LoRA and full fine-tuning, benchmarking, prompt
      caching, upload/share flows, and a local server.
  usage:
    - >
      Adoption is tied to the Apple-silicon local-model community. The MLX Community
      organization on Hugging Face hosts ready-to-use model weights for MLX LM and
      related MLX projects, and Apple's WWDC material presents MLX LM as the package for
      running and fine-tuning large language models on Macs. In Homebrew it is a
      convenience package for users who want the MLX LLM command suite installed as
      normal CLI tools rather than only through Python packaging.
related-packages:
  - id: brew:mlx
    reason: >
      Install or use MLX directly when you need the underlying array, neural-network,
      optimizer, and transformation APIs rather than MLX LM's ready-made language-model
      workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/ml-explore/mlx-lm
      - https://ml-explore.github.io/mlx/
