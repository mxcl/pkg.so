id: brew:gpp
display-name: GPP
homepage: https://logological.org/gpp
repo: https://github.com/logological/gpp
docs:
  - https://logological.org/gpp
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package-manager facts list Homebrew, Debian, Fedora, MacPorts, Nix,
      Ubuntu, and openSUSE packages. That spread fits a small C command-line tool that
      is useful in build pipelines and documentation generation without needing a
      runtime service.
    - >
      Homebrew packages it as gpp, Fedora uses the more descriptive
      general-purpose-preprocessor name, and the official README points users to
      binary-package links on the project homepage.
  package-nerd-significance:
    - >
      GPP is a compact example of a Unix filter that earns packaging despite a small
      footprint: it has a single executable, man/HTML documentation, portable source
      releases, and a stable niche that overlaps build systems, documentation, and
      research tooling.
    - >
      Its significance is less about popularity and more about substitutability: package
      users can reach for it when they need a configurable macro processor without
      bringing in a full template engine or language-specific preprocessor.
  project-history:
    - >
      The GitHub repository is the official development location and the project
      homepage links users to online documentation, portable source packages, and
      binary-package references. The repository includes source, documentation,
      Autotools files, license files, and citation metadata.
    - >
      GPP has academic documentation as well as package metadata: its CITATION.cff
      points to a 2020 Journal of Open Source Software article by Tristan Miller and
      Denis Auroux describing it as an extensible, customizable preprocessor for
      software development, document processing, and research workflows.
  related-projects:
    - cpp is the language-specific baseline that GPP explicitly contrasts with.
    - GNU m4 is the heavier general macro processor that GPP positions itself beside.
    - >
      Autotools-style source packages are related operationally because the development
      checkout requires generating the build system before end-user installation steps
      apply.
  sources:
    - https://formulae.brew.sh/formula/gpp
    - https://github.com/logological/gpp
    - https://logological.org/gpp
    - https://raw.githubusercontent.com/logological/gpp/master/CITATION.cff
  summary:
    - >
      GPP is a general-purpose preprocessor with customizable syntax. The project README
      and citation metadata emphasize that it is independent of any one programming
      language, lighter than GNU m4 for many tasks, and includes built-in macro support
      for C/C++, LaTeX, HTML, XHTML, and Prolog files.
  timeline:
    - >
      2020: The project citation metadata records a Journal of Open Source Software
      article for GPP.
    - '2023: GitHub release metadata records GPP 2.28 dated Sep 26, 2023.'
    - '2026: Homebrew metadata packages GPP as version 2.28 with bottles for macOS and Linux.'
  usage:
    - >
      Users invoke gpp to preprocess text with syntax tuned to the target language or
      document format. The README notes that the documentation itself is generated by
      GPP from a gpp.pp input file, making the docs both reference material and a
      working example.
    - >
      The package is most useful when cpp is too language-specific and m4 is heavier
      than needed: templating LaTeX or HTML, defining domain-specific macro syntax, or
      generating source fragments in build systems.
related-packages:
  - id: brew:m4
    reason: >
      Choose GNU M4 when POSIX availability and its established macro language matter
      more than GPP's lighter, customizable syntax.
    rel: alternative
    sources:
      - https://github.com/logological/gpp#readme
      - https://www.gnu.org/software/m4/manual/
category: developer-tools
package-manager:
  brew: gpp
  debian: gpp
  dnf: general-purpose-preprocessor
  macports: gpp
  nix: gpp
  ubuntu: gpp
  zypper: gpp
package-manager-url: https://formulae.brew.sh/formula/gpp
license: LGPL-3.0-only
tags:
  - cli
  - customizable-syntax
  - macros
  - preprocessor
  - text-processing
description: General-purpose preprocessor with customizable syntax
executables:
  - gpp
provenance:
  formula: gpp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
