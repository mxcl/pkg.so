id: cask:devin-cli
display-name: Devin CLI
homepage: https://cli.devin.ai/docs
repo: https://github.com/CognitionAI/devin-cli
docs:
  - https://docs.devin.ai/cli
config-file-location:
  unix:
    - ~/.config/devin/config.json
    - .devin/config.json
    - .devin/config.local.json
  windows: '%APPDATA%\devin\config.json'
credentials-file-location:
  unix: .devin/config.local.json
  windows: '%APPDATA%\devin\config.json'
history:
  adoption-history:
    - >
      The official quickstart explicitly documents macOS installation through Homebrew,
      Windows installers, shell installation on Unix-like systems, and a Desktop-bundled
      path for some enterprise plans. That points to adoption through developer machines
      and terminal workflows rather than a library API.
  package-nerd-significance:
    - >
      Devin CLI matters as a modern example of an AI product becoming a real CLI
      package: it has a binary, config precedence, shell integration, changelogs,
      package-manager update behavior, and local project conventions instead of living
      only as a web application.
  project-history:
    - >
      The current Devin documentation describes the CLI as distinct from the cloud Devin
      product: the CLI runs locally in the user's terminal, works against local files
      and tools, and can hand work to cloud Devin sessions when that workflow is useful.
    - >
      The stable changelog shows rapid evolution through 2026, including the rename from
      Devin for Terminal to Devin CLI, web search, shell integration, MCP improvements,
      subagents, plugins, enterprise controls, and externally managed Homebrew updates.
  related-projects:
    - >
      Related surfaces in the official docs include Devin Cloud, Devin Desktop,
      ACP-aware editors such as Zed and JetBrains IDEs, MCP servers, skills, plugins,
      and AGENTS.md-style rules.
  sources:
    - https://docs.devin.ai/cli
    - https://docs.devin.ai/cli/changelog/stable
    - https://docs.devin.ai/cli/extensibility/configuration
    - https://docs.devin.ai/cli/extensibility/rules
    - https://docs.devin.ai/cli/reference/commands
  summary:
    - >
      Devin CLI is Cognition's local terminal coding agent with Devin Cloud integration.
      For package-history purposes it represents the 2026 wave of AI coding agents being
      distributed as ordinary command-line tools and Homebrew casks.
  timeline:
    - >
      2026-03: The stable changelog begins the visible 2026 CLI release stream with
      2026.3.9-0.
    - '2026-04: Releases added rule, hook, MCP, permission, and terminal workflow improvements.'
    - >
      2026-05: The product name changed from Devin for Terminal to Devin CLI in
      user-facing surfaces and public documentation.
    - '2026-07: Stable releases added plugins and enterprise controls.'
    - >
      2026-08: Stable release 2026.8.18 added subagent model configuration and startup
      MCP registry cache warming.
  usage:
    - >
      Typical use starts inside a project directory with `devin`, or with a one-shot
      prompt using the command separator. The command reference documents session
      resume, print mode, prompt files, model selection, MCP server management, rules,
      skills, sandbox setup, and ACP server mode for editor integrations.
    - >
      The configuration docs make it a package-nerd-friendly tool: user and project JSON
      configs, local overrides, permission allow/deny rules, MCP server definitions,
      hooks, and AGENTS.md rules all fit into familiar dotfile and repository
      conventions.
category: ai
package-manager:
  brew-cask: devin-cli
package-manager-url: https://formulae.brew.sh/cask/devin-cli
tags:
  - ai
  - cli
  - coding-agent
  - developer-productivity
  - devin
description: Coding agent with Devin Cloud integration
executables:
  - devin
provenance:
  cask: devin-cli
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
