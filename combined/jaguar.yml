history:
  adoption-history:
    - >
      The README documents several distribution channels: Homebrew on macOS, winget on
      Windows, an AUR package for Arch Linux, Debian/Ubuntu `.deb` packages from
      releases, and downloadable binaries for Linux, macOS, and Windows. Homebrew API
      data available during this enrichment recorded 354 installs over 365 days, fitting
      a focused embedded-language tool rather than a broad utility.
    - >
      Jaguar's adoption is inseparable from Toit adoption. It gives Toit a fast hardware
      feedback loop, and the Toit device documentation teaches Jaguar early in the ESP32
      setup path.
  package-nerd-significance:
    - >
      Jaguar is package-nerd notable because it turns a language-specific embedded
      workflow into one host executable. The package hides SDK setup, device discovery,
      WiFi deployment, firmware update, and VS Code integration behind the `jag`
      command, which is exactly the kind of niche workflow package managers are good at.
  project-history:
    - >
      The GitHub repository was created in December 2021 and describes Jaguar as live
      reloading for ESP32 development. The README explains that Jaguar runs a small HTTP
      server on the ESP32, receives compiled Toit programs, relocates and installs them
      in flash, stops the old program, and starts the new one from `main`.
    - >
      Jaguar evolved alongside the Toit SDK and VM. The README positions it as a thin
      developer loop around Toit: `jag setup` downloads and configures the SDK, `jag
      flash` installs the Jaguar application, `jag run` sends a program, and `jag watch`
      reloads code as files change.
  related-projects:
    - >
      Jaguar is part of the Toit ecosystem and depends conceptually on the Toit virtual
      machine, the Toit SDK, ESP32 hardware, and editor tooling such as the Toit Visual
      Studio Code extension. It overlaps with embedded live-reload and OTA development
      tools but remains language-specific.
  sources:
    - https://api.github.com/repos/toitlang/jaguar
    - https://api.github.com/repos/toitlang/jaguar/releases?per_page=10
    - https://docs.toit.io/getstarted/device/
    - https://formulae.brew.sh/api/formula/jaguar.json
    - https://github.com/toitlang/jaguar
    - https://raw.githubusercontent.com/toitlang/jaguar/master/README.md
  summary:
    - >
      Jaguar is the Toit project's ESP32 live-reload tool. It packages the `jag` command
      and an on-device Jaguar service so embedded developers can flash, discover,
      update, and run Toit code over WiFi instead of repeating slow serial-flash cycles.
  timeline:
    - '2021: GitHub repository created for Toit live reloading on ESP32.'
    - >
      2021: The README demonstration material and setup flow show Jaguar positioned
      around sub-two-second edit-run cycles.
    - >
      2026: v1.59.0 release notes recorded Debian packaging work and cache separation by
      jag version.
    - >
      2026: v1.67.0 release notes recorded a partition-table flag and SDK-aligned
      release preparation.
  usage:
    - >
      A typical session installs `jag`, runs setup, flashes an ESP32 with WiFi
      credentials, scans the local network, and uses `jag run` or `jag watch` to deploy
      Toit programs. The tool also supports firmware updates and named containers that
      run on device boot.
