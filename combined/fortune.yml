id: brew:fortune
display-name: fortune
homepage: https://www.ibiblio.org/pub/linux/games/amusements/fortune/!INDEX.html
repo: https://github.com/shlomif/fortune-mod
docs:
  - https://github.com/shlomif/fortune-mod#readme
  - https://www.ibiblio.org/pub/linux/games/amusements/fortune/!INDEX.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      fortune-mod became the common `fortune` implementation on Linux distributions. The
      upstream README documents installation via Fedora, Arch, Alpine, Debian-derived
      systems, and source builds, and the supplied package facts show package entries
      across Homebrew, MacPorts, Nix, Alpine, and openSUSE.
  package-nerd-significance:
    - >
      fortune is package-manager folklore: a tiny CLI whose real payload is a corpus of
      text files, traditionally split into normal, offensive, localized, and
      site-specific databases. It is useful to package historians because it connects
      BSD games, Linux distribution patches, data packaging, and terminal culture.
  project-history:
    - >
      The current upstream describes fortune-mod as a maintenance version of the Unix
      `fortune` command. Its README says fortune-mod was originally forked from NetBSD
      fortune and ported to Linux, then later maintained from a Git import of the 1.99.1
      tarball sourced via a Mageia source RPM.
    - >
      The ibiblio Linux archive preserves a 1997 `fortune-mod-9708.tar.gz` package
      described as bug fixes and enhancements to NetBSD fortune, strfile, and unstr. The
      same archive shows surrounding quote collections for different languages and
      desktop uses, capturing the way fortune files spread as data packages as much as
      programs.
  related-projects:
    - >
      The package is related to BSD games, NetBSD fortune, localized fortune
      collections, Shlomi Fish's fortune cookie files, XML-Grammar-Fortune, and
      reimplementations in Perl, Python, Go, and Rust that the upstream README lists as
      alternatives.
  sources:
    - https://api.github.com/repos/shlomif/fortune-mod
    - https://api.github.com/repos/shlomif/fortune-mod/releases
    - https://github.com/shlomif/fortune-mod
    - https://raw.githubusercontent.com/shlomif/fortune-mod/master/CREDITS.asciidoc
    - https://raw.githubusercontent.com/shlomif/fortune-mod/master/README.asciidoc
    - https://www.ibiblio.org/pub/linux/games/amusements/fortune/!INDEX.html
  summary:
    - >
      `fortune` is the Unix fortune-cookie command: a terminal program that prints a
      random quotation from local quote databases. The Homebrew package tracks
      fortune-mod, the Linux-oriented continuation of the older BSD fortune tradition.
  timeline:
    - >
      1979: The original BSD `fortune` program predates modern scripting-language
      reimplementations, according to the upstream README.
    - '1997: ibiblio archived `fortune-mod-9708.tar.gz` for Linux fortune users.'
    - '2016: The current `shlomif/fortune-mod` GitHub repository was created.'
    - >
      2020: The upstream README credited Shlomi Fish with maintaining fortune-mod from
      version 2.0.0 onward.
    - '2026: GitHub Releases listed fortune-mod 3.26.0.'
  usage:
    - >
      The common use is deliberately small: run `fortune` to print a random quote. The
      package also includes tools such as `strfile` and `unstr` for building and
      inspecting the indexed `.dat` files used by fortune databases.
related-packages: []
