id: brew:kapacitor
display-name: Kapacitor
homepage: https://github.com/influxdata/kapacitor
repo: https://github.com/influxdata/kapacitor
docs:
  - https://docs.influxdata.com/kapacitor/v1
  - https://github.com/influxdata/kapacitor#readme
config-file-location:
  unix:
    - /etc/kapacitor/kapacitor.conf
    - $KAPACITOR_CONFIG_PATH
credentials-file-location:
  unix:
    - /etc/kapacitor/kapacitor.conf
    - $KAPACITOR_CONFIG_PATH
history:
  adoption-history:
    - >
      Kapacitor became familiar to operators through the TICK stack: Telegraf collected
      metrics, InfluxDB stored them, Chronograf visualized them, and Kapacitor
      transformed, analyzed, and acted on them. Its presence in Homebrew, Scoop, winget,
      and Nix reflects its use as both a server daemon and an operator CLI in monitoring
      setups.
  package-nerd-significance:
    - >
      Kapacitor is a classic infrastructure package because it ships both a daemon and a
      CLI, keeps its main configuration under /etc, and ties package installation
      directly to service management. For package nerds it marks the era when
      time-series monitoring stacks were installed as composable Unix services before
      hosted observability platforms dominated many workflows.
  project-history:
    - >
      Kapacitor grew out of the InfluxData time-series stack as the action and
      processing layer paired with InfluxDB. InfluxData describes it as the native data
      processing engine for InfluxDB 1.x and an integrated component in the InfluxDB 2.0
      platform, able to process both stream and batch data.
  related-projects:
    - InfluxDB is the database Kapacitor was built to process data from.
    - Telegraf and Chronograf are the other named tools in the TICK stack.
    - >
      Flux and TICKscript are the query/task languages most closely associated with
      Kapacitor's evolution.
  sources:
    - https://docs.influxdata.com/kapacitor/v1/introduction/getting-started/
    - https://docs.influxdata.com/kapacitor/v1/reference/about_the_project/release-notes/
    - https://github.com/influxdata/kapacitor/releases
    - https://www.influxdata.com/time-series-platform/kapacitor/
  summary:
    - >
      Kapacitor is InfluxData's time-series processing and alerting engine, built to
      process stream and batch data from InfluxDB with TICKscript.
  timeline:
    - >
      2016: Kapacitor's v1.0.0-beta1 GitHub milestone closed on July 22 during the 1.0
      stabilization period.
    - >
      2020: Kapacitor 1.6 added Flux task support and moved user authentication and
      authorization into the open source distribution.
    - >
      2025: Kapacitor 1.7.7 release notes deprecated Python 2 user-defined functions
      ahead of the 1.8 line.
  usage:
    - >
      A typical Kapacitor setup runs kapacitord, defines tasks with TICKscript,
      subscribes to InfluxDB data, and routes alerts or computed output through
      handlers. The kapacitor CLI and HTTP API are used to define tasks, manage
      recordings, inspect task state, and administer the daemon.
related-packages:
  - id: brew:influxdb@1
    reason: >
      InfluxDB 1.x is the native time-series database source for Kapacitor stream
      subscriptions and batch queries in the established TICK stack workflow.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/kapacitor/v1/introduction/getting-started/
      - https://docs.influxdata.com/platform/getting-started/
  - id: brew:telegraf
    reason: >
      Telegraf collects system metrics and writes them to InfluxDB before Kapacitor
      processes them in the official getting-started workflow.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/kapacitor/v1/introduction/getting-started/
      - https://docs.influxdata.com/telegraf/v1/
  - id: brew:chronograf
    reason: >
      Chronograf provides a graphical interface for creating and managing Kapacitor
      alert rules, TICKscripts, connections, and event-handler settings.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/chronograf/v1/guides/create-alert-rules/
      - https://docs.influxdata.com/chronograf/v1/guides/configuring-alert-endpoints/
category: data
package-manager:
  brew: kapacitor
  nix: kapacitor
  scoop: main/kapacitor
  winget: InfluxData.Kapacitor
package-manager-url: https://formulae.brew.sh/formula/kapacitor
license: MIT
tags:
  - alerts
  - cli
  - data-processing
  - etl
  - influxdb
  - time-series
description: Open source time series data processor
executables:
  - kapacitor
  - kapacitord
provenance:
  formula: kapacitor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
