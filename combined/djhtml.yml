id: brew:djhtml
display-name: DjHTML
homepage: https://github.com/rtts/djhtml
repo: https://github.com/rtts/djhtml
docs:
  - https://github.com/rtts/djhtml#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption has been strongest in Python web projects that already use pre-commit.
      The README provides a `.pre-commit-config.yaml` example using the official
      repository as the hook source, which lets teams run DjHTML automatically without
      adding a broader HTML formatter to the application runtime.
    - >
      Package-manager interest is modest but durable: the Homebrew package exposes the
      CLI tools for users who prefer system package managers, while the upstream project
      remains a small Python utility with regular 3.x releases.
  package-nerd-significance:
    - >
      DjHTML is package-nerd interesting because it occupies the narrow space between no
      formatter and a full syntax-changing HTML formatter. Its no-dependency Python
      implementation, pre-commit hook, and separate mode commands make it a small,
      easy-to-package tool for template repositories.
  project-history:
    - >
      The official repository was created in May 2021 and describes DjHTML as a
      dependency-free template indenter. Its README positions the tool near formatters
      such as Black while making a narrower promise: fix indentation for already
      well-structured mixed HTML, CSS, JavaScript, Django, and Jinja templates.
    - >
      DjHTML's design is conservative for template-heavy projects because it avoids
      inserting newlines or other non-whitespace characters. The same repository ships
      multiple entry points: `djhtml` for template files, `djcss` for style sections or
      CSS mode, `djjs` for script sections or JavaScript mode, and `djtxt` for
      text-oriented indentation.
  related-projects:
    - >
      Related template-formatting tools include djLint, djangofmt, Black for Python
      style culture, and pre-commit as the hook runner commonly used to apply DjHTML.
  sources:
    - https://github.com/rtts/djhtml
    - https://raw.githubusercontent.com/rtts/djhtml/main/README.md
    - https://api.github.com/repos/rtts/djhtml
    - https://api.github.com/repos/rtts/djhtml/releases?per_page=10
  summary:
    - >
      DjHTML is a pure-Python indenter for Django and Jinja templates, with companion
      commands for CSS, JavaScript, and text-like template files. It intentionally calls
      itself an indenter rather than a formatter: it changes leading whitespace but does
      not restructure markup.
  timeline:
    - '2021-05-08: Official GitHub repository created.'
    - '2023-02: 3.0.x releases appear in official GitHub release metadata.'
    - '2026-03-26: 3.0.11 release published.'
  usage:
    - >
      Users run `djhtml template.html` or `djhtml .` to rewrite indentation, and use
      `--check` in automation when they want a nonzero status if files would change. The
      `fmt:off` and `fmt:on` markers, plus ignored pre/comment blocks, keep generated or
      intentionally odd sections out of the indenter.
related-packages:
  - id: brew:djlint
    reason: >
      Choose djLint when you need template-aware linting and structural reformatting
      across more template languages; choose DjHTML when indentation-only changes are
      the safer requirement.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/rtts/djhtml/main/README.md
      - https://djlint.com/docs/getting-started/
  - id: brew:pre-commit
    reason: >
      DjHTML documents pre-commit hooks for automatically checking or reindenting
      templates as part of each repository's commit workflow.
    rel: adjacent_workflow
    sources:
      - https://raw.githubusercontent.com/rtts/djhtml/main/README.md
      - https://pre-commit.com/
category: developer-tools
package-manager:
  brew: djhtml
  nix: djhtml
package-manager-url: https://formulae.brew.sh/formula/djhtml
license: GPL-3.0-or-later
tags:
