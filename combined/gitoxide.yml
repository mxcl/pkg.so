id: brew:gitoxide
display-name: gitoxide
homepage: https://github.com/GitoxideLabs/gitoxide
repo: https://github.com/GitoxideLabs/gitoxide
docs:
  - https://docs.rs/gitoxide
  - https://github.com/GitoxideLabs/gitoxide#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is significant in the Rust ecosystem because it offers Git
      functionality as native Rust crates. The README describes `gix` as the application
      entry point and treats the `gix` and `ein` binaries as development tools for
      exercising the API in real repositories.
  package-nerd-significance:
    - >
      Package maintainers care about gitoxide because it is both a CLI package and a
      large Rust crate graph. Its README documents multiple build profiles, Homebrew and
      Arch installation, Cargo installation, binary releases, and feature choices such
      as `max-pure` and `lean`, making it a useful case study in packaging Rust
      applications with optional native dependencies.
  project-history:
    - >
      The GitHub repository was created in June 2018. Over time, the project evolved
      from the `gitoxide` command-line package into a workspace centered on the `gix`
      crate, with lower-level crates for Git objects, refs, configuration, transport,
      indexes, ignore rules, worktrees, status, and related plumbing.
  related-projects:
    - >
      gitoxide is related to Git itself, libgit2-style embedding use cases, and Rust
      applications that need repository access through crates rather than subprocess
      calls.
  sources:
    - https://api.github.com/repos/GitoxideLabs/gitoxide
    - https://crates.io/api/v1/crates/gitoxide
    - https://crates.io/api/v1/crates/gix
    - https://formulae.brew.sh/formula/gitoxide
    - https://github.com/GitoxideLabs/gitoxide
    - https://github.com/GitoxideLabs/gitoxide/blob/main/crate-status.md
    - https://raw.githubusercontent.com/GitoxideLabs/gitoxide/main/README.md
  summary:
    - >
      gitoxide is a pure Rust implementation of Git, packaged both as command-line tools
      and as a library-oriented workspace. The project emphasizes correctness,
      performance, and a developer experience that Rust applications can embed without
      shelling out to Git.
  timeline:
    - '2018: Repository created on GitHub.'
    - '2020: `gitoxide` crate published on crates.io.'
    - '2023: `gix` crate published as the library entry point.'
    - >
      2020s: Project distributed through Cargo, binary releases, Homebrew, Arch Linux,
      and other package managers.
  usage:
    - >
      Practitioners use gitoxide in two main ways: Rust developers depend on `gix` and
      its component crates to read and manipulate repositories, while CLI users and
      packagers install `gitoxide` to experiment with the `gix` and `ein` binaries. The
      README warns that the command-line tools may remain unstable, so library use is
      the steadier integration path.
related-packages:
  - id: brew:libgit2
    reason: >
      libgit2 is the established portable C library for embedding Git through C or
      language bindings, while gitoxide provides a native Rust crate architecture;
      gitoxide's documentation explicitly helps users map git2 APIs to gix.
    rel: alternative
    sources:
      - https://github.com/GitoxideLabs/gitoxide#feature-discovery
      - https://docs.rs/gix/
      - https://libgit2.org/
  - id: brew:git
    reason: >
      Git is the stable, full-featured reference command-line tool, whereas gitoxide's
      gix and ein binaries expose its Rust implementation and are explicitly documented
      as potentially unstable for scripts.
    rel: alternative
    sources:
      - https://github.com/GitoxideLabs/gitoxide#readme
      - https://git-scm.com/
category: developer-tools
package-manager:
  apk: gitoxide
  brew: gitoxide
  macports: gitoxide
  nix: gitoxide
  pacman: gitoxide
  scoop: main/gitoxide
  zypper: gitoxide
package-manager-url: https://formulae.brew.sh/formula/gitoxide
license: Apache-2.0
tags:
  - cli
  - git
  - library
  - rust
  - version-control
description: Idiomatic, lean, fast & safe pure Rust implementation of Git
executables:
  - ein
  - gix
provenance:
  formula: gitoxide
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
