id: brew:bcal
display-name: bcal
homepage: https://github.com/jarun/bcal
repo: https://github.com/jarun/bcal
docs:
  - https://github.com/jarun/bcal#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bcal is packaged beyond Homebrew, including Debian, Fedora, Nix, Ubuntu, and
      openSUSE-family package sets in the supplied package-manager facts. Its README
      points users to package-manager installation first and shows Repology packaging
      status.
  package-nerd-significance:
    - >
      bcal is the kind of niche CLI package that saves repeated mental arithmetic for
      storage engineers, filesystem debuggers, firmware people, and anyone reading
      sector offsets in hex.
    - >
      Its significance is not ecosystem scale but fit: it packages a cluster of
      byte-addressing calculations that general calculators rarely make pleasant.
  project-history:
    - >
      The upstream GitHub repository was created in 2016. Its README describes bcal, the
      Byte CALculator, as a REPL and single-shot CLI for storage expressions, SI/IEC
      conversion, byte address calculation, base conversion, and CHS/LBA calculations.
    - >
      The project keeps dependencies modest: standard libc plus GNU Readline or BSD
      Editline, with a no-readline build option that uses its own prompt and
      history-file support.
  related-projects:
    - >
      bc and dc cover general arbitrary-precision calculation but not bcal's
      storage-unit and disk-addressing workflow.
    - >
      disk utilities, hex calculators, and filesystem debugging tools overlap with
      bcal's audience.
  sources:
    - https://github.com/jarun/bcal
    - https://github.com/jarun/bcal#readme
    - source_facts.package-manager
  summary:
    - >
      bcal is a small C command-line calculator aimed at people who think in bytes,
      sectors, addresses, and binary prefixes.
  timeline:
    - '2016: GitHub repository created.'
    - '2018: README-linked asciinema demo published.'
    - '2020s: Packaged in Homebrew and several Linux distributions.'
  usage:
    - >
      Users run bcal as an interactive storage calculator, pass quoted expressions for
      one-shot evaluation, convert between decimal, hexadecimal, binary, SI, and IEC
      units, or calculate disk CHS/LBA values.
    - >
      When built without Readline, its history file is stored under
      $XDG_CONFIG_HOME/bcal/history or $HOME/.config/bcal/history.
related-packages:
  - id: brew:bc
    reason: >
      Choose GNU bc for scriptable arbitrary-precision arithmetic and a programmable
      calculator language; choose bcal when byte units, sectors, binary prefixes, and
      disk addresses are the main task.
    rel: alternative
    sources:
      - https://github.com/jarun/bcal#readme
      - https://www.gnu.org/software/bc/
category: developer-tools
package-manager:
  brew: bcal
  debian: bcal
  dnf: bcal
  nix: bcal
  ubuntu: bcal
  zypper: bcal
package-manager-url: https://formulae.brew.sh/formula/bcal
license: GPL-3.0-or-later
tags:
  - calculator
  - cli
  - conversion
  - storage
description: Storage conversion and expression calculator
executables:
  - bcal
provenance:
  formula: bcal
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
