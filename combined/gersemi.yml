id: brew:gersemi
display-name: gersemi
homepage: https://github.com/BlankSpruce/gersemi
repo: https://github.com/BlankSpruce/gersemi
docs:
  - https://github.com/BlankSpruce/gersemi#readme
config-file-location:
  unix: .gersemirc
credentials-file-location: null
history:
  adoption-history:
    - >
      gersemi fills a practical niche for projects that already enforce code style but
      also want deterministic formatting for CMake files. Package availability through
      Homebrew, Nix, and Windows package metadata reflects use beyond direct PyPI
      installs.
  package-nerd-significance:
    - >
      For package-manager users, gersemi is useful because it brings Black-like
      formatting habits to CMake projects through a single CLI. It is especially handy
      in CI and pre-commit setups where reproducible formatting matters more than
      editor-specific integrations.
  project-history:
    - >
      The gersemi repository was opened in 2020. Its README describes a formatter that
      can be installed from PyPI, run as a command-line tool, configured with
      `.gersemirc`, and integrated into pre-commit through a dedicated hook repository.
  related-projects:
    - CMake, pre-commit, PyPI, gersemi-pre-commit
  sources:
    - https://api.github.com/repos/BlankSpruce/gersemi
    - https://github.com/BlankSpruce/gersemi
    - https://github.com/BlankSpruce/gersemi-pre-commit
    - https://raw.githubusercontent.com/BlankSpruce/gersemi/master/README.md
  summary:
    - >
      gersemi is a Python-based formatter for CMake source files. It targets
      CMakeLists.txt, CMakeLists.txt.in, .cmake, and .cmake.in files, and aims to
      provide a low-configuration formatting style for build-system code.
  timeline:
    - '2020: The gersemi repository was opened on GitHub.'
    - >
      2020s: The README documents PyPI installation, CLI modes, `.gersemirc`, pre-commit
      integration, extensions, cache support, and ignore-file handling.
  usage:
    - >
      Practitioners run gersemi in check, in-place, or diff mode across files or
      directories. The tool discovers common CMake file names, reads formatting
      configuration from `.gersemirc` or command-line flags, supports custom command
      definitions and extensions, and can be used in pre-commit hooks.
related-packages:
  - id: brew:pre-commit
    reason: >
      gersemi officially publishes a pre-commit hook, allowing repositories to enforce
      CMake formatting automatically during commits and in CI.
    rel: adjacent_workflow
    sources:
      - https://github.com/BlankSpruce/gersemi#pre-commit-hook
      - https://pre-commit.com/
category: developer-tools
package-manager:
  brew: gersemi
  nix: gersemi
  winget: BlankSpruce.Gersemi
package-manager-url: https://formulae.brew.sh/formula/gersemi
license: MPL-2.0
tags:
  - cli
  - cmake
  - code-style
  - formatter
  - pre-commit
  - python
description: Formatter to make your CMake code the real treasure
executables:
  - gersemi
provenance:
  formula: gersemi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
