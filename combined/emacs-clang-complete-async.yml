id: brew:emacs-clang-complete-async
display-name: emacs-clang-complete-async
homepage: https://github.com/Golevka/emacs-clang-complete-async
repo: https://github.com/Golevka/emacs-clang-complete-async
docs:
  - https://github.com/Golevka/emacs-clang-complete-async#readme
config-file-location:
  unix:
    - ~/.emacs.d/
    - .emacs
    - .dir-locals.el
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages the project at version 0.5 from the official GitHub tag.
      Official public metadata is otherwise thin, so broader adoption history should be
      treated cautiously.
  package-nerd-significance:
    - >
      The package is relevant to editor and package-manager users as an older Emacs
      completion integration that wrapped libclang before newer language-server
      workflows became dominant.
  project-history:
    - >
      The GitHub repository was created in May 2012. Its README describes a
      client/server design with an Emacs Lisp client and a C server binary named
      clang-complete.
  related-projects:
    - >
      The README references auto-complete and libclang as core dependencies in the
      completion workflow.
  sources:
    - 'GitHub repository API: created_at 2012-05-13, language Emacs Lisp, pushed_at 2017-01-26'
    - 'GitHub tags API: v0.5 tag exists'
    - 'Homebrew formula API: stable version 0.5 and official source archive'
    - >
      Official README: introduction, setup, usage, and relationship to libclang and
      auto-complete
  summary:
    - >
      emacs-clang-complete-async is an Emacs extension that uses libclang and a helper
      binary to provide asynchronous C and C++ code completion.
  timeline:
    - '2012: GitHub repository created'
    - '2017: Repository last pushed according to GitHub API metadata'
    - '2026: Homebrew formula tracks v0.5'
  usage:
    - >
      Users build the clang-complete server with make, copy the Emacs Lisp file and
      binary into ~/.emacs.d, add setup code to .emacs, and optionally configure clang
      flags in .emacs or .dir-locals.el.
related-packages:
  - id: brew:llvm
    reason: >
      LLVM supplies the `llvm-config` and libclang interfaces required to build the
      extension's native completion server.
    rel: adjacent_workflow
    sources:
      - https://github.com/Golevka/emacs-clang-complete-async#readme
      - https://clang.llvm.org/docs/LibClang.html
category: developer-tools
package-manager:
  brew: emacs-clang-complete-async
package-manager-url: https://formulae.brew.sh/formula/emacs-clang-complete-async
license: GPL-3.0-or-later
tags:
  - autocomplete
  - clang
  - cli
  - cpp
  - editor-extension
  - emacs
  - libclang
description: Emacs plugin using libclang to complete C/C++ code
executables:
  - clang-complete
provenance:
  formula: emacs-clang-complete-async
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
