id: brew:aiken
display-name: Aiken
homepage: https://aiken-lang.org/
repo: https://github.com/aiken-lang/aiken
docs:
  - https://aiken-lang.org/
  - https://aiken-lang.org/installation-instructions
  - https://aiken-lang.org/language-tour/modules
config-file-location:
  unix: aiken.toml in project root
credentials-file-location: null
history:
  adoption-history:
    - >
      Aiken is published through multiple developer package channels. The official
      README links to crates.io and npm badges, the npm registry lists
      `@aiken-lang/aiken`, and Homebrew packages the `aiken` formula. The official
      installation page now recommends `aikup` and documents npm, Homebrew, shell,
      PowerShell, and MSI paths.
    - >
      Homebrew listed version 1.1.23 as stable and the npm registry listed 1.1.23 as
      latest when checked. The input package facts also list Nix packaging, showing
      adoption among reproducible-build users.
  package-nerd-significance:
    - >
      Aiken is interesting as a blockchain language package because it spans several
      ecosystems at once: Rust/crates.io for implementation culture, npm and Homebrew
      for user installation, Nix for reproducibility, and its own package registry for
      language libraries.
    - >
      For package maintainers, the important object is not only the `aiken` executable
      but the surrounding developer platform: version manager, LSP, standard library,
      package registry, playground, and `aiken.toml` project convention.
  project-history:
    - >
      The public Aiken repository was created in April 2022. The project is organized
      around a compiler/toolchain, a website, a standard library, a package registry, a
      playground, and `aikup`, a version-management installer for Aiken releases.
    - >
      Aiken's README says the name comes from Howard Aiken, the American physicist and
      computing pioneer. The project presents itself as a developer-friendly Cardano
      smart-contract stack rather than just a compiler binary.
  related-projects:
    - Cardano and Plutus smart-contract tooling.
    - aikup, the official Aiken version manager.
    - Aiken standard library, packages site, and playground.
  sources:
    - https://aiken-lang.org/
    - https://aiken-lang.org/installation-instructions
    - https://aiken-lang.org/language-tour/modules
    - https://formulae.brew.sh/api/formula/aiken.json
    - https://github.com/aiken-lang/aiken
    - https://registry.npmjs.org/@aiken-lang%2faiken
  summary:
    - >
      Aiken is a modern smart-contract language and toolchain for Cardano. The official
      repository describes it as a modern smart contract platform for Cardano, and the
      docs cover installation, language concepts, modules, packages, playground usage,
      and the built-in language server.
  timeline:
    - '2022: Public Aiken GitHub repository created.'
    - '2024: npm package record for `@aiken-lang/aiken` created.'
    - '2026: npm and Homebrew list 1.1.23 as current/latest.'
  usage:
    - >
      Aiken users create Cardano smart-contract projects, write modules, use the
      language server, and build/test contracts through the command-line toolchain. The
      docs identify `aiken.toml` as the project root pattern for language-server
      integration.
    - >
      No credentials file is part of ordinary Aiken operation; it is a
      compiler/toolchain rather than a hosted-service client.
related-packages: []
category: developer-tools
package-manager:
  brew: aiken
  nix: aiken
package-manager-url: https://formulae.brew.sh/formula/aiken
license: Apache-2.0
tags:
  - cardano
  - cli
  - compiler
  - plutus
  - programming-language
  - smart-contracts
description: Modern smart contract platform for Cardano
executables:
  - aiken
provenance:
  formula: aiken
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
