credentials-file-location: null
history:
  adoption-history:
    - >
      The stewardship story mirrors the commercial history around cross-platform .NET.
      Mono was supported by Novell after its Ximian acquisition, then by Xamarin, and
      then by Microsoft after the 2016 Xamarin acquisition. Microsoft's acquisition
      announcement emphasized Xamarin's C# mobile tooling for iOS, Android, and Windows
      and cited more than 1.3 million Xamarin developers and more than 15,000 customers.
      Mono joined the .NET Foundation in 2016, and the Mono homepage says WineHQ took
      over stewardship of the upstream Mono Project in 2024 while Microsoft moved active
      workloads to a modern Mono runtime fork in dotnet/runtime.
  project-history:
    - >
      The first development years were spent making the runtime, JIT, C# compiler, and
      class libraries self-host. Mono's history records milestones such as the runtime
      running Hello World in August 2001, the C# compiler compiling its first program in
      September 2001, compiler self-hosting work in 2002, and Mono 1.0 on June 30, 2004.
      The About page summarizes the architecture as an ECMA C# and Common Language
      Infrastructure implementation with a runtime, JIT, AOT compiler, garbage
      collector, loader, interoperability pieces, and .NET-compatible class libraries.
  sources:
    - >
      https://blogs.microsoft.com/blog/2016/02/24/microsoft-to-acquire-xamarin-and-empower-more-developers-to-build-apps-on-any-device/
    - https://www.mono-project.com/
    - https://www.mono-project.com/archived/mailpostearlystory/
    - https://www.mono-project.com/docs/about-mono/
    - https://www.mono-project.com/docs/about-mono/history/
    - https://www.mono-project.com/docs/about-mono/releases/
  summary:
    - >
      Mono is the long-running open-source implementation of the .NET runtime and
      class-library stack for non-Windows and embedded platforms. The project was
      launched by Ximian in 2001 around Miguel de Icaza's effort to bring the Common
      Language Infrastructure and C# model to Linux; Mono's own early-history note says
      the team planned the July 19, 2001 launch at the O'Reilly conference and shipped
      early metadata, compiler, and class-library pieces.
  usage:
    - >
      In package managers, Mono is both a runtime and a developer toolchain: users
      install it to run .NET Framework-compatible applications outside Windows, compile
      C# code, host libraries that expect the classic Mono stack, or support older
      Xamarin/Unity-era workflows. Its importance is historical as much as practical: it
      proved that .NET could be portable years before cross-platform .NET became
      Microsoft's default story.
related-packages:
  - id: brew:dotnet
    reason: >
      Choose modern .NET for actively maintained cross-platform development; the Mono
      project explicitly recommends that active Mono users and framework maintainers
      migrate to it.
    rel: alternative
    sources:
      - https://www.mono-project.com/
      - https://dotnet.microsoft.com/
category: language-runtime
