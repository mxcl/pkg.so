id: brew:grayskull
display-name: Grayskull
homepage: https://conda.github.io/grayskull/
repo: https://github.com/conda/grayskull
docs:
  - https://github.com/conda/grayskull#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Grayskull's adoption is tied to conda-forge contributor workflows. Instead of
      writing a recipe from scratch, maintainers can generate an initial meta.yaml from
      PyPI, GitHub, or CRAN metadata, then review and adjust it for feedstock
      submission.
    - >
      The conda-forge blog compared Grayskull with conda-build skeleton using pytest as
      an example and emphasized better dependency handling, selectors, compiler
      detection, license information, and generation speed.
  package-nerd-significance:
    - >
      Grayskull is package-nerd machinery in its purest form: it packages the act of
      packaging. Its value is reducing recipe boilerplate while still producing metadata
      that maintainers can inspect.
    - >
      It also marks a shift from conda skeleton's older heuristics toward richer
      metadata extraction, better selectors, and conda-forge-aware recipe style.
  project-history:
    - >
      The official README says Grayskull was created with the intention of eventually
      replacing conda skeleton. The conda-forge blog introduced it in March 2020 as a
      way to generate better Conda recipes for projects available from sources such as
      PyPI, CRAN, Conan, GitHub releases, and repositories.
    - >
      Early public releases moved quickly in February and March 2020, with PyPI
      recording 0.1.x and 0.2.x releases and the conda-forge blog discussing version
      0.2.1. The project later moved under the conda GitHub organization, reinforcing
      its role as conda ecosystem infrastructure.
    - >
      The 2.x and 3.x release lines show ongoing maintenance as Python packaging
      standards, recipe conventions, and conda-forge automation evolved.
  related-projects:
    - >
      conda-build skeleton: the older recipe-generation command Grayskull was designed
      to improve on or replace.
    - >
      conda-forge: Grayskull generates recipes intended to be concise and suitable for
      conda-forge workflows.
    - >
      PyPI, GitHub, CRAN, Conan, and CPAN are source ecosystems discussed by Grayskull
      documentation and roadmap material.
  sources:
    - https://conda-forge.org/blog/2020/03/05/grayskull/
    - https://conda.github.io/grayskull/
    - https://github.com/conda/grayskull
    - https://pypi.org/project/grayskull/
  summary:
    - >
      Grayskull is a conda recipe generator built to produce concise recipes for
      conda-forge. It is a packaging tool for packaging people: a CLI that converts
      upstream package metadata into conda-build recipe structure.
  timeline:
    - '2020-02: PyPI records early 0.1.x releases.'
    - '2020-03: conda-forge publishes an introduction to Grayskull and discusses version 0.2.1.'
    - '2020-06: PyPI records the 0.7.x series.'
    - '2022: PyPI records the 1.x series through 1.8.x.'
    - '2023: PyPI records the 2.0.0 release and continued 2.x releases.'
    - '2026: PyPI records the 3.0.x and 3.1.x release series.'
  usage:
    - >
      The documented CLI is centered on commands such as grayskull pypi package-name,
      optionally with version pins, output directories, and maintainers. The generated
      recipe is a starting point for conda-build or conda-forge feedstock work.
    - >
      The README and documentation state that Grayskull can generate recipes for Python
      packages on PyPI, packages available as GitHub repositories, and R packages on
      CRAN.
related-packages:
  - id: brew:rattler-build
    reason: >
      Generate an initial recipe.yaml with Grayskull, then use rattler-build to render,
      build, test, and publish the resulting Conda package.
    rel: adjacent_workflow
    sources:
      - https://github.com/conda/grayskull#readme
      - https://rattler-build.prefix.dev/latest/
