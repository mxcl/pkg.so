id: brew:sqlc
display-name: sqlc
homepage: https://sqlc.dev/
repo: https://github.com/sqlc-dev/sqlc
docs:
  - https://docs.sqlc.dev/en/stable
  - https://sqlc.dev/
config-file-location:
  unix:
    - sqlc.yaml
    - sqlc.yml
    - sqlc.json
credentials-file-location:
  unix:
    - sqlc.yaml
    - sqlc.yml
    - sqlc.json
  windows:
    - sqlc.yaml
    - sqlc.yml
    - sqlc.json
history:
  adoption-history:
    - >
      sqlc found a niche among developers who wanted to keep SQL as the source of truth
      while avoiding hand-written row scanning and fragile stringly typed database code.
      The input package metadata lists Homebrew, MacPorts, Nix, Arch, and Scoop
      packaging, showing broad CLI distribution across Unix-like and Windows
      package-manager ecosystems.
  package-nerd-significance:
    - >
      Package nerds care about sqlc because it turns SQL into a build-time artifact. It
      fits neatly into reproducible developer environments, CI checks, and
      generated-code workflows without requiring a running ORM runtime.
  project-history:
    - >
      The sqlc repository was created in 2019. Its first public GitHub release, v0.1.0,
      appeared in January 2020, followed by v1.0.0 in February 2020.
    - >
      The project documentation now describes a configuration-driven compiler with
      support for PostgreSQL, MySQL, and SQLite inputs, plus generator plugins for
      languages beyond the original Go target.
  related-projects:
    - >
      The SQLBoiler README lists sqlc as an alternative for users who want type-safe
      SQL-generated code without an ORM model. sqlc's own README lists sqlc-gen-go,
      sqlc-gen-kotlin, sqlc-gen-python, and sqlc-gen-typescript as supported language
      generator projects.
  sources:
    - https://api.github.com/repos/sqlc-dev/sqlc
    - https://api.github.com/repos/sqlc-dev/sqlc/releases
    - https://docs.sqlc.dev/en/stable/reference/config.html
    - https://github.com/sqlc-dev/sqlc#readme
    - input.source_facts.package-manager
  summary:
    - >
      sqlc is a command-line SQL compiler that generates type-safe application code from
      handwritten SQL queries. It began in the Go ecosystem and later expanded its
      generator model beyond Go.
  timeline:
    - '2019: GitHub repository created.'
    - '2020: v0.1.0 released.'
    - '2020: v1.0.0 released.'
    - >
      Current docs: configuration centers on sqlc.(yaml|yml) or sqlc.json and supports
      plugins and multiple language targets.
  usage:
    - >
      A common workflow is to write schema and query SQL files, configure them in
      sqlc.yaml, sqlc.yml, or sqlc.json, and run sqlc to produce typed query methods
      used by application code.
category: developer-tools
package-manager:
  brew: sqlc
  macports: sqlc
  nix: sqlc
  pacman: sqlc
  scoop: main/sqlc
package-manager-url: https://formulae.brew.sh/formula/sqlc
license: MIT
tags:
  - cli
  - code-generation
  - database
  - go
  - sql
  - type-safe
description: Generate type safe Go from SQL
executables:
  - sqlc
provenance:
  formula: sqlc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
