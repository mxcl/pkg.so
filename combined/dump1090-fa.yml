id: brew:dump1090-fa
display-name: dump1090-fa
homepage: https://github.com/flightaware/dump1090
repo: https://github.com/flightaware/dump1090
docs:
  - https://github.com/flightaware/dump1090#readme
config-file-location:
  linux: /etc/default/dump1090-fa
credentials-file-location: null
history:
  adoption-history:
    - >
      dump1090-fa's adoption is tied to FlightAware's PiAware ecosystem. The README says
      it can be used together with PiAware to contribute crowd-sourced flight-tracking
      data to FlightAware, which made the package important to Raspberry Pi ADS-B feeder
      setups as well as SDR experimenters.
    - >
      Outside FlightAware's own Debian/Raspbian packaging, distro and package-manager
      metadata show it in Homebrew, Alpine, Fedora, Nix, and openSUSE. Homebrew packages
      it as a command-line SDR utility with dump1090 and view1090 executables.
  package-nerd-significance:
    - >
      dump1090-fa is a classic niche-but-beloved package: an SDR decoder whose value is
      obvious only if you know ADS-B, Mode S, and the feeder-network ecosystem. For
      package maintainers, it bundles radio hardware support, ncurses-style terminal
      tools, web display assets, and Debian-oriented service assumptions into a Unix
      package.
  project-history:
    - >
      FlightAware's README describes dump1090-fa as the successor to
      dump1090-mutability, maintained by FlightAware. The repository was created in
      2015, during the period when low-cost RTL-SDR receivers made aircraft transponder
      decoding accessible to hobbyists and flight-tracking contributors.
    - >
      The package focuses on practical station operation: receiving messages from a
      directly connected SDR or a network stream, showing decoded aircraft in a terminal
      or browser map, and building as a Debian/Raspbian package while remaining
      buildable on other Unix-like systems.
  related-projects:
    - >
      Related projects include dump1090-mutability, PiAware, rtl-sdr, bladeRF, HackRF,
      LimeSDR, SoapySDR, FlightAware's ADS-B network, and other Mode S and ADS-B
      decoders.
  sources:
    - https://github.com/flightaware/dump1090#readme
    - https://api.github.com/repos/flightaware/dump1090
    - https://formulae.brew.sh/formula/dump1090-fa
  summary:
    - >
      dump1090-fa is FlightAware's maintained ADS-B, Mode S, and Mode 3A/3C demodulator
      and decoder for software-defined radios and network-provided aircraft transponder
      data.
  timeline:
    - '2015: FlightAware creates the dump1090 repository.'
    - "2015: The project is maintained as FlightAware's successor to dump1090-mutability."
    - '2026: Homebrew packages dump1090-fa stable 11.0 from the FlightAware repository.'
  usage:
    - >
      Users run dump1090-fa with an SDR such as an RTL-SDR, or with network input, to
      decode aircraft transponder messages. It can display local aircraft data in a
      terminal, publish a browser map, feed PiAware, or provide decoded data to other
      ADS-B tooling.
related-packages:
  - id: brew:librtlsdr
    reason: >
      Use librtlsdr with an RTL2832U USB receiver to provide the radio-device access
      that dump1090-fa uses for direct 1090 MHz ADS-B reception.
    rel: adjacent_workflow
    sources:
      - https://github.com/flightaware/dump1090#readme
      - https://github.com/steve-m/librtlsdr#readme
category: networking
package-manager:
  apk: dump1090
  brew: dump1090-fa
  dnf: dump1090
  nix: dump1090-fa
  zypper: dump1090-fa
package-manager-url: https://formulae.brew.sh/formula/dump1090-fa
license: GPL-2.0-or-later
