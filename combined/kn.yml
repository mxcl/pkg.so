id: brew:kn
display-name: kn
homepage: https://github.com/knative/client
repo: https://github.com/knative/client
docs:
  - https://github.com/knative/client/tree/main/docs
  - https://knative.dev/docs/client
config-file-location:
  unix: ~/.config/kn/config.yaml
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      The client tracks Knative's own maturation. Knative 1.0 was announced in 2021 with
      over 600 contributors and described Knative as the most widely installed
      serverless layer on Kubernetes. CNCF accepted Knative as an incubating project on
      2022-03-02 and later listed it as graduated on 2025-09-11, which strengthened `kn`
      as the default CLI interface for a vendor-neutral cloud-native project.
  package-nerd-significance:
    - >
      `kn` matters because it packages a complex Kubernetes CRD ecosystem into a small
      Go CLI. For package maintainers, it is part of the broader pattern where
      cloud-native projects ship a narrowly scoped binary that wraps Kubernetes APIs
      while still relying on kubeconfig and shell completion conventions users already
      know.
  project-history:
    - >
      Knative was released by Google in July 2018 as a serverless application layer on
      Kubernetes, with early collaboration from VMware, IBM, Red Hat, and SAP. The `kn`
      client emerged as the developer-facing command surface for that ecosystem; GitHub
      release data shows Knative Client v0.1.0 published on 2019-05-18.
    - >
      The client documentation describes `kn` as an interface for Knative Services and
      Event Sources, including higher-level operations such as autoscaling and traffic
      splitting. The repository README also documents support for Serving resources,
      growing Eventing support, plugin architecture, and use from scripts or Tekton
      tasks.
  related-projects:
    - >
      `kn` is related to Knative Serving, Knative Eventing, Kubernetes, kubectl plugin
      conventions, Tekton, CloudEvents, and distribution-specific serverless platforms
      such as OpenShift Serverless.
  sources:
    - https://api.github.com/repos/knative/client/releases?per_page=100
    - https://github.com/knative/client
    - https://knative.dev/blog/releases/knative-1.0/
    - https://knative.dev/docs/client/
    - https://knative.dev/docs/client/configure-kn/
    - https://knative.dev/docs/client/install-kn/
    - https://www.cncf.io/projects/knative/
  summary:
    - >
      `kn` is the official Knative command-line client, built to let users create and
      manage Knative Serving and Eventing resources without writing Kubernetes YAML by
      hand.
  timeline:
    - >
      2018-07: Google released Knative, later described by Knative 1.0 materials as
      developed with VMware, IBM, Red Hat, and SAP.
    - '2019-05-18: Knative Client v0.1.0 published on GitHub.'
    - '2020-10-07: Knative Client v0.18.0 released with additional Eventing support.'
    - >
      2021: Knative 1.0 announced as a production-readiness milestone with over 600
      contributors.
    - '2022-03-02: CNCF accepted Knative as an incubating project.'
    - '2025-09-11: CNCF project page lists Knative as moving to graduated maturity.'
  usage:
    - >
      Users run `kn` to create services, list and inspect resources, split traffic
      between revisions, work with Eventing sources and triggers, and script Knative
      workflows. Its documented configuration uses `~/.config/kn/config.yaml` on Unix
      systems, while cluster credentials usually come from Kubernetes kubeconfig
      handling such as `~/.kube/config` or `KUBECONFIG`.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Knative documents kubectl as the general Kubernetes client for installing
      components and applying YAML, while kn provides higher-level Knative operations
      and uses the same kubeconfig.
    rel: adjacent_workflow
    sources:
      - https://knative.dev/docs/client/
      - https://kubernetes.io/docs/reference/kubectl/
category: cloud-infrastructure
package-manager:
  brew: kn
  nix: kn
package-manager-url: https://formulae.brew.sh/formula/kn
license: Apache-2.0
tags:
  - cli
  - eventing
  - knative
  - kubernetes
  - serverless
  - serving
description: Command-line interface for managing Knative Serving and Eventing resources
executables:
  - kn
provenance:
  formula: kn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
