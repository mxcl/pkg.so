id: brew:librcsc
display-name: librcsc
homepage: https://github.com/helios-base/librcsc
repo: https://github.com/helios-base/librcsc
docs:
  - https://github.com/helios-base/librcsc/blob/master/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      librcsc's adoption is narrower than general-purpose libraries, but within RoboCup
      Soccer Simulation it is important infrastructure. The GitHub tag history shows
      RoboCup-year snapshots from 2013, 2015, 2016, 2019, 2022, 2023, and 2024,
      suggesting it is maintained around competition cycles.
  package-nerd-significance:
    - >
      librcsc is a niche package, but it is interesting because it packages a
      competition research stack as a reusable C++ library. For package managers, it
      turns RoboCup 2D simulation from a bundle of local academic build scripts into an
      installable dependency.
  project-history:
    - >
      The librcsc README describes it as a basic library for developing simulated soccer
      teams and related tools for the RoboCup Soccer Simulation, with compatibility work
      for rcssserver-18. Its repository belongs to the helios-base organization, tying
      it to the HELIOS sample team ecosystem.
    - >
      A 2013 RoboCup symposium paper on HELIOS Base describes the base as a common
      library, sample team, visual debugger, and formation editor meant to reduce the
      infrastructure burden for multiagent soccer simulation teams. That paper frames
      librcsc's role: provide networking, synchronization, world modeling, and
      simulator-facing support so researchers can focus on team behavior.
  related-projects:
    - >
      librcsc is related to helios-base, soccerwindow2, rcssserver, the RoboCup Soccer
      Simulation 2D league, and the broader RoboCup competition ecosystem.
  sources:
    - https://formulae.brew.sh/formula/librcsc
    - https://github.com/helios-base/helios-base
    - https://github.com/helios-base/librcsc
    - https://github.com/helios-base/librcsc/releases
    - https://github.com/helios-base/librcsc/tags
    - https://rcsoccersim.github.io/
    - >
      https://staff.fnwi.uva.nl/a.visser/activities/robocup/RoboCup2013/Symposium/SpecialTrackPapers/robocupsymposium2013_submission_23.pdf
    - https://www.robocup.org/a_brief_history_of_robocup
    - https://www.robocup.org/leagues/23
  summary:
    - >
      librcsc is the HELIOS base C++ library for building RoboCup Soccer Simulation 2D
      teams and related log, analysis, and support tools.
  timeline:
    - >
      1997: RoboCup held its first official games and conference, including simulation
      roots described by the RoboCup history page.
    - >
      2013: HELIOS Base paper presented the common-library/sample-team/tooling package
      for RoboCup Soccer 2D Simulation.
    - '2013: librcsc repository tags include RoboCup 2013 round snapshots.'
    - '2019: librcsc tags include RoboCup 2019 and RoboCup 2019 final snapshots.'
    - '2023: librcsc release support-v18 added support for rcssserver-18.'
    - '2024: librcsc tag rc2024 recorded a RoboCup-cycle snapshot.'
  usage:
    - >
      Users build librcsc before building HELIOS base or related tools. The package
      includes development helpers and utilities such as librcsc-config, log converters,
      result printers, version converters, and scheduler/table utilities for RoboCup
      soccer-simulation workflows.
related-packages: []
category: games
