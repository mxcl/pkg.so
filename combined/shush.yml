id: brew:shush
display-name: shush
homepage: https://github.com/realestate-com-au/shush
repo: https://github.com/realestate-com-au/shush
docs:
  - https://github.com/realestate-com-au/shush#readme
config-file-location: null
credentials-file-location:
  unix: ~/.aws/credentials
history:
  adoption-history:
    - >
      The official project publishes release binaries, documents installation with go
      install, and provides a direct Unix/Linux installation example. Its exec mode also
      supports container-entrypoint use, broadening it from an interactive encryption
      utility into a deployment-time secret injector.
  package-nerd-significance:
    - >
      shush is representative of small cloud-native security utilities that wrap a
      managed key service in Unix pipes and environment-variable conventions. Its
      command-shim mode is particularly relevant to container and twelve-factor
      deployment workflows.
  project-history:
    - >
      REA Group developed shush as a small AWS KMS encryption and decryption tool. The
      official repository's copyright notice dates from 2019, and the project was
      implemented in Go with downloadable release binaries.
  related-projects:
    - >
      AWS KMS provides the cryptographic service and AWS SDK credential chain. The
      official README also points to ssssh as a Ruby-compatible alternative and shows
      how AWS CLI plus base64 can reproduce the basic decrypt workflow.
  sources:
    - 'Official repository and README: https://github.com/realestate-com-au/shush'
  summary:
    - >
      shush is a Go command-line utility from REA Group for encrypting and decrypting
      small secrets with AWS Key Management Service.
  timeline:
    - '2019: Year in the official repository copyright notice.'
    - '1.5.5: Version used in the official binary-installation and container examples.'
  usage:
    - >
      Pipe plaintext to shush encrypt with a KMS key ID, ARN, or alias, then pipe the
      Base64 ciphertext to shush decrypt. The exec subcommand decrypts KMS_ENCRYPTED_
      environment variables and exposes the plaintext under names without that prefix
      before starting another command.
category: security
package-manager:
  brew: shush
  ubuntu: shush
package-manager-url: https://formulae.brew.sh/formula/shush
license: MIT
tags:
  - aws-kms
  - cli
  - decryption
  - encryption
  - secrets
description: Encrypt and decrypt secrets using the AWS Key Management Service
executables:
  - shush
provenance:
  formula: shush
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
