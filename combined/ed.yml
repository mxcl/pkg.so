id: brew:ed
display-name: GNU ed
homepage: https://www.gnu.org/software/ed/ed.html
repo: https://git.savannah.gnu.org/cgit/ed.git
docs:
  - https://www.gnu.org/software/ed/manual/ed_manual.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ed persists because it is standardized, scriptable, and expected on Unix-like
      systems even though most interactive editing moved to screen editors long ago. Its
      Homebrew, Debian, Ubuntu, Alpine, Arch, Nix, MacPorts, Scoop, and openSUSE
      packaging in the batch input reflects that baseline utility role.
    - >
      GNU ed's adoption is therefore less about visible user enthusiasm and more about
      compatibility: scripts, recovery procedures, minimal systems, teaching material,
      and standards conformance still need a line editor named `ed`.
  package-nerd-significance:
    - >
      ed is package-manager bedrock: a tiny utility that looks obsolete until a
      bootstrap environment, recovery shell, POSIX test, or ancient script expects it.
      Shipping it is a compatibility decision as much as a feature decision.
    - >
      For people who care about Unix history, `ed` is also a living fossil in the best
      sense: the interface in modern packages is still recognizably the line-editor
      model described by POSIX.
  project-history:
    - >
      The POSIX specification defines `ed` as a line-oriented text editor with command
      and input modes. That standardized interface is the historically important part of
      the package: `ed` is a small command language for editing text through standard
      input, not a screen editor.
    - >
      The GNU package supplies the Free Software Foundation's maintained implementation,
      including both `ed` and the restricted variant `red`. GNU FTP release archives
      show the modern GNU release stream at least from ed 1.0 in August 2008 through ed
      1.22.5 in February 2026.
  related-projects:
    - POSIX defines the portable `ed` utility interface.
    - `red` is the restricted editor installed with GNU ed.
    - >
      Screen editors such as vi and Emacs largely displaced ed for daily interactive
      editing, but not for the standardized utility role.
  sources:
    - https://www.gnu.org/software/ed/manual/ed_manual.html
    - https://pubs.opengroup.org/onlinepubs/9699919799.2018edition/utilities/ed.html
    - https://ftp.gnu.org/gnu/ed/
  summary:
    - >
      GNU ed is the GNU implementation of the classic Unix line editor. In
      package-manager terms it is tiny, old-fashioned, standardized, scriptable, and
      still worth shipping because the `ed` utility is part of the Unix/POSIX tool
      vocabulary.
  timeline:
    - '2008-08: GNU FTP archive lists ed 1.0.'
    - '2015-03: GNU FTP archive lists ed 1.11.'
    - '2020-02: GNU FTP archive lists ed 1.16.'
    - '2024-04: GNU FTP archive lists ed 1.20.2.'
    - '2026-02: GNU FTP archive lists ed 1.22.5.'
  usage:
    - >
      POSIX documents `ed [ -p string ] [ -s ] [ file ]`, with commands read from
      standard input. In command mode, input is interpreted as editing commands; in
      input mode, input is inserted as text.
    - >
      GNU ed also ships `red`, a restricted form useful in constrained editing contexts.
      The utility is commonly used non-interactively in scripts or as a
      lowest-common-denominator editor on small systems.
related-packages:
  - id: brew:diffutils
    reason: >
      GNU Diffutils can emit `diff --ed` command scripts that GNU ed applies to
      transform an old file into a new one, providing a documented automated-editing
      workflow.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/diffutils/manual/diffutils.html#ed-Scripts
      - https://www.gnu.org/software/ed/manual/ed_manual.html
category: developer-tools
package-manager:
  apk: ed
  brew: ed
  debian: ed
  dnf: ed
  macports: ed
  nix: ed
  pacman: ed
  scoop: main/red
  ubuntu: ed
  zypper: ed
package-manager-url: https://formulae.brew.sh/formula/ed
license: GPL-3.0-or-later
tags:
  - cli
  - gnu
  - line-editor
  - posix
  - text-editor
  - unix
description: Classic UNIX line editor
executables:
  - ed
  - red
provenance:
  formula: ed
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
