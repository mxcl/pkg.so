history:
  adoption-history:
    - >
      Keet is offered across desktop and mobile platforms without subscriptions or
      advertising. It avoids conventional account registration: no phone number or email
      is required, and identity recovery uses a 24-word seed phrase.
    - >
      The application is positioned as an alternative to centralized messengers for
      users who prioritize direct communication, limited metadata, large peer-to-peer
      file transfers, and resistance to central service outages.
  package-nerd-significance:
    - >
      Keet is of interest as a desktop package built around a peer-to-peer runtime
      rather than the conventional client-and-cloud architecture used by most chat
      applications.
    - >
      Its dependence on Holepunch's open-source Pear Runtime also illustrates a split
      common in commercial applications: the underlying runtime is open and reusable
      while no official source repository for the complete branded application is
      published.
  project-history:
    - >
      Keet was developed by Holepunch, a company backed by Tether, as a peer-to-peer
      messaging application. Official materials identify Pear Runtime as its open-source
      P2P technology stack.
    - >
      The product expanded its direct device-to-device model across text messaging,
      audio and video calls, rooms, multi-device synchronization, and unrestricted-size
      file transfers.
  related-projects:
    - Pear Runtime
    - Holepunch
    - Hypercore
  sources:
    - 'Official Pear documentation linked by Keet: https://docs.pears.com/'
    - 'Official product site: https://keet.io/'
    - 'Official support center: https://support.keet.io/'
  summary:
    - >
      Keet is a privacy-oriented, end-to-end encrypted, peer-to-peer application for
      text chat, calls, rooms, and direct file sharing.
  timeline:
    - '2020s: Holepunch introduced Keet as a peer-to-peer communications application.'
    - >
      2024–2026: The official site documents desktop and mobile availability, rooms,
      calls, multi-device synchronization, and direct file sharing.
  usage:
    - >
      Users create or join peer-to-peer rooms to exchange messages, make audio or video
      calls, and transfer files directly between devices.
    - >
      A 24-word recovery phrase represents the user's identity. Official documentation
      does not identify a credentials file, and the phrase should be backed up through
      the application's supported workflow.
