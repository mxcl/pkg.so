id: cask:masscode
display-name: massCode
homepage: https://masscode.io/
repo: https://github.com/massCodeIO/massCode
docs:
  - https://masscode.io/documentation
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      massCode is available for macOS, Windows, and Linux and has accumulated several
      thousand stars on its official GitHub repository. Its cross-platform Electron
      distribution and Homebrew cask make it accessible both to desktop users and
      developers who prefer package-managed application installs.
    - >
      The project supports importing material from VS Code, Raycast, SnippetsLab, public
      GitHub Gists, Obsidian folders, OpenAPI, Postman, and Bruno, positioning it as a
      local consolidation and migration target rather than a closed snippet silo.
  package-nerd-significance:
    - >
      massCode appeals to package enthusiasts because it combines a polished desktop
      interface with open-source, local-first storage. Current content is stored as
      ordinary Markdown files with frontmatter, making vaults readable, Git-friendly,
      sync-provider-neutral, and resistant to vendor lock-in.
    - >
      Its storage evolution is also noteworthy: version 3 used `db.json`, version 4 used
      SQLite `massCode.db`, and version 5 adopted a Markdown Vault. The official
      documentation provides an explicit staged migration path across those formats.
  project-history:
    - >
      Anton Reshetov began massCode in 2019 as a free and open-source code-snippet
      manager. The application later broadened into a developer workspace while
      retaining snippet organization as a core feature.
    - >
      Later releases added Markdown notes, an HTTP client, natural-language
      calculations, Excalidraw-based drawings, developer utilities, browser clipping,
      and integrations. Version 5 changed primary user storage to a local Markdown
      Vault, replacing the earlier SQLite and JSON database generations.
  related-projects:
    - >
      The official import and integration surfaces connect massCode with VS Code,
      Raycast, SnippetsLab, GitHub Gists, Obsidian, Postman, Bruno, and OpenAPI
      workflows.
  sources:
    - https://github.com/massCodeIO/massCode
    - https://masscode.io/
    - https://masscode.io/documentation/
    - https://masscode.io/documentation/storage.html
  summary:
    - >
      massCode is a free, AGPL-licensed, cross-platform developer workspace created by
      Anton Reshetov. It evolved from a snippet manager into a local-first application
      for snippets, Markdown notes, HTTP requests, calculations, drawings, and developer
      utilities.
  timeline:
    - '2019: Anton Reshetov began the massCode project.'
    - 'Version 3: User data was stored in `db.json`.'
    - 'Version 4: Storage moved to a SQLite `massCode.db` database.'
    - >
      Version 5: massCode adopted a plain-file Markdown Vault and expanded its workspace
      features.
    - '2026: The supplied Homebrew record distributed massCode 5.10.0.'
  usage:
    - >
      Developers use massCode to build searchable snippet libraries organized by
      folders, tags, and fragments; keep technical notes; test saved HTTP requests;
      perform calculations; draw diagrams; and run small encoding, hashing, conversion,
      and generation utilities.
    - >
      Users choose a vault through Settings → Storage. Snippets and notes are stored
      locally as Markdown files, while the official documentation advises keeping
      passwords and tokens out of ordinary vault content and using encrypted HTTP secret
      variables for sensitive environment values.
