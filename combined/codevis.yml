id: brew:codevis
display-name: codevis
homepage: https://github.com/sloganking/codevis
repo: https://github.com/sloganking/codevis
docs:
  - https://github.com/sloganking/codevis#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts list codevis in Homebrew and Nix. That is consistent
      with a small, self-contained developer utility whose main packaging concern is
      exposing the codevis executable.
  package-nerd-significance:
    - >
      codevis matters to package nerds as a compact example of a Rust visualization CLI
      distributed through cargo and system package managers, with no daemon, account, or
      runtime service attached.
  project-history:
    - >
      The official repository presents codevis as a visualization utility rather than a
      language tool or build system. Its public GitHub metadata records the repository
      as created on January 17, 2022.
  related-projects:
    - >
      The README points to the author's related codemov video project and codevis-gui
      graphical interface.
  sources:
    - https://github.com/sloganking/codevis#readme
    - https://api.github.com/repos/sloganking/codevis
  summary:
    - >
      codevis is a Rust CLI that renders source code and UTF-8 text files in a folder
      into a single image, using syntax highlighting where possible.
  timeline:
    - '2022: The official GitHub repository metadata records repository creation on January 17.'
    - 'README: codevis documents cargo installation and directory-to-image CLI usage.'
  usage:
    - >
      The README shows codevis being run with an input directory and optional output
      file, producing a PNG visualization of a repository or directory tree. It also
      points users to --help for the full CLI surface.
related-packages: []
category: developer-tools
package-manager:
  brew: codevis
  nix: codevis
package-manager-url: https://formulae.brew.sh/formula/codevis
license: MIT
tags:
  - cli
  - code-visualization
  - image-generation
  - rust
  - syntax-highlighting
  - visualization
description: Turns your code into one large image
executables:
  - codevis
provenance:
  formula: codevis
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
