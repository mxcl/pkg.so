id: brew:ifstat
display-name: ifstat
homepage: http://gael.roualland.free.fr/ifstat/
repo: https://github.com/matttbe/ifstat
docs:
  - http://gael.roualland.free.fr/ifstat
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ifstat spread through classic Unix packaging channels because it solved a simple
      operational problem with a familiar interface: repeatable interface counters in a
      terminal. The supplied metadata lists Homebrew, Debian, Fedora, MacPorts, and
      Ubuntu package names.
    - >
      Its adoption is also tied to portability. The upstream README lists Linux,
      Solaris, FreeBSD, IRIX, OpenBSD, NetBSD, Darwin, Digital Unix, AIX, HP-UX, and
      Win32 support, which made it useful on mixed Unix estates before Linux-only
      tooling dominated.
  package-nerd-significance:
    - >
      ifstat is the sort of boring CLI package that explains why Unix package
      collections matter: it wraps many incompatible kernel-counter APIs behind one tiny
      command.
    - >
      It also shows an older portability style, where configure checks, optional
      drivers, and per-OS counter backends made one C utility useful across a surprising
      number of operating systems.
  project-history:
    - >
      The release history begins with v0.1 on 2001-12-02, supporting Linux 2.2 and
      /proc. Within days, v0.2 added FreeBSD ifmib, Solaris kstat, interface discovery,
      and man pages.
    - >
      During 2001 and 2002 the tool gained BSD kvm support, ucd-snmp support, Debian and
      RPM packaging support, loopback handling, multiple driver support, timestamping,
      and cleaner internal driver structure.
    - >
      Version 1.0 in 2003 broadened Unix support with IRIX, OpenBSD, BSD route sysctl,
      improved kvm, terminal resizing behavior, total bandwidth reporting, and static
      library support. Version 1.1 in 2004 added Digital Unix, Tru64, AIX, HP-UX, Win32,
      and net-snmp-config integration.
  related-projects:
    - vmstat and iostat are the conceptual models named by upstream.
    - >
      net-snmp, ucd-snmp, wmnet, and OS-specific kernel interfaces such as
      /proc/net/dev, kstat, ifmib, route sysctl, kvm, and GetIfTable are closely related
      to its implementation and use.
  sources:
    - http://gael.roualland.free.fr/ifstat/
    - http://gael.roualland.free.fr/ifstat/HISTORY
    - https://formulae.brew.sh/formula/ifstat
    - https://github.com/matttbe/ifstat
  summary:
    - >
      ifstat is a small network-interface statistics tool by Gael Roualland. Its
      upstream page describes it as doing for network interfaces what vmstat and iostat
      do for other system counters.
    - >
      The tool reports interface activity by reading operating-system counters directly,
      with optional SNMP support for remote hosts, routers, and switches.
  timeline:
    - '2001-12-02: v0.1 initial implementation with Linux /proc support.'
    - '2001-12-04: v0.2 adds FreeBSD ifmib and Solaris kstat support.'
    - '2001-12-24: v0.4 adds SNMP support through ucd-snmp.'
    - '2002-01-17: v0.5 adds packaging support and multiple driver work.'
    - '2003-04-21: v1.0 expands BSD and terminal behavior features.'
    - '2004-01-01: v1.1 adds more Unix and Win32 support.'
  usage:
    - >
      Users run ifstat to watch receive and transmit rates for one or more interfaces.
      The README's usage section reduces the basic workflow to running the command and
      watching statistics update.
    - >
      Administrators can use the build-time driver options to force or disable platform
      backends, and SNMP support lets the same style of output poll remote equipment
      when net-snmp or ucd-snmp is available.
related-packages:
  - id: brew:nload
    reason: >
      Choose nload for an interactive console with separate incoming and outgoing
      graphs; choose ifstat for compact tabular rates, multiple interfaces, or optional
      SNMP polling.
    rel: alternative
    sources:
      - http://gael.roualland.free.fr/ifstat/
      - https://www.roland-riegel.de/nload/
  - id: brew:bmon
    reason: >
      Choose bmon for a curses interface, detailed counters, and programmable output
      modules; choose ifstat for a smaller vmstat-like bandwidth table and its broad
      legacy Unix portability.
    rel: alternative
    sources:
      - http://gael.roualland.free.fr/ifstat/
      - https://github.com/Jafaral/bmon
  - id: brew:iftop
    reason: >
      Choose iftop when host-to-host conversations must be attributed through packet
      capture; choose ifstat when interface-level receive and transmit rates are
      sufficient.
    rel: alternative
    sources:
      - http://gael.roualland.free.fr/ifstat/
      - https://pdw.ex-parrot.com/iftop/
category: networking
