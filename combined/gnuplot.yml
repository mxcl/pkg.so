id: brew:gnuplot
display-name: gnuplot
homepage: http://www.gnuplot.info/
repo: https://git.code.sf.net/p/gnuplot/gnuplot-main
docs:
  - http://www.gnuplot.info/documentation.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/gnuplot/gnuplotrc
    - ~/.gnuplot
credentials-file-location: null
history:
  adoption-history:
    - >
      gnuplot became a fixture in scientific computing because it fit naturally into
      terminals, makefiles, TeX workflows, data-analysis scripts and remote machines.
      The homepage notes non-interactive uses such as web scripting and use as a
      plotting engine by third-party applications including Octave.
  package-nerd-significance:
    - >
      For package users, gnuplot is the classic small plotting engine: scriptable,
      portable, easy to call from shell pipelines and useful on systems where a notebook
      stack or full GUI application would be too much. Its package often sits behind
      other numerical tools as the plotting backend.
  project-history:
    - >
      gnuplot was created in 1986 to help scientists and students visualize mathematical
      functions and data interactively. Its official homepage credits a long development
      history and describes support for Linux, Windows, macOS, OS/2, VMS and other
      platforms.
    - >
      Although its name resembles GNU, gnuplot is not part of the GNU Project. The
      project developed its own license and community around a portable plotting
      language, terminal drivers and output backends.
  related-projects:
    - >
      gnuplot is related by workflow to Octave, TeX and LaTeX document production, Unix
      shell scripting, scientific data files and plotting terminals such as Qt,
      wxWidgets, X11, SVG, PostScript and PDF.
  sources:
    - http://www.gnuplot.info/
    - http://www.gnuplot.info/documentation.html
    - http://www.gnuplot.info/faq/faq.html
    - https://sourceforge.net/p/gnuplot/gnuplot-main/
  summary:
    - >
      gnuplot is a portable command-driven graphing utility for plotting mathematical
      functions and data in interactive sessions, scripts and generated output files.
  timeline:
    - >
      1986: gnuplot was created for interactive visualization of mathematical functions
      and data.
    - '2004: gnuplot 4.0 was released.'
    - '2015: gnuplot 5.0 was released.'
    - '2020: gnuplot 5.4 was released.'
    - '2023: gnuplot 6.0 was released.'
  usage:
    - >
      Practitioners use gnuplot to plot 2D and 3D functions, scatter data, fitted
      curves, surfaces and publication figures. Output can go to interactive terminals
      such as Qt, wxWidgets or X11, or to files such as PostScript, PDF, PNG, GIF, JPEG,
      LaTeX, SVG and HTML5.
related-packages:
  - id: brew:pandoc-plot
    reason: >
      Use pandoc-plot with gnuplot when figures should be generated from gnuplot code
      blocks and embedded automatically in Markdown, LaTeX, or other Pandoc documents.
    rel: adjacent_workflow
    sources:
      - https://laurentrdc.github.io/pandoc-plot/
      - http://www.gnuplot.info/documentation.html
  - id: brew:octave
    reason: >
      GNU Octave can use gnuplot as its external graphics toolkit, which is useful for
      scripted numerical work or output that benefits from gnuplot's terminal support.
    rel: adjacent_workflow
    sources:
      - https://docs.octave.org/octave
      - http://www.gnuplot.info/
category: science
package-manager:
  apk: gnuplot
  brew: gnuplot
  chocolatey: gnuplot
  debian: gnuplot
  dnf: gnuplot
  macports: gnuplot
  nix: gnuplot
  pacman: gnuplot
  scoop: main/gnuplot
  ubuntu: gnuplot
  winget: gnuplot.gnuplot
  zypper: gnuplot
package-manager-url: https://formulae.brew.sh/formula/gnuplot
license: gnuplot
tags:
  - cli
  - data-visualization
  - graphing
  - plotting
  - scientific-computing
description: Command-driven, interactive function plotting
executables:
  - gnuplot
provenance:
  formula: gnuplot
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
