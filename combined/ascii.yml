id: brew:ascii
display-name: ascii
homepage: http://www.catb.org/~esr/ascii/
repo: https://gitlab.com/esr/ascii
docs:
  - http://www.catb.org/~esr/ascii
  - http://www.catb.org/~esr/ascii/ascii.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official resource page states that the code is usually packaged as `ascii` and
      displays Repology package status. The input package facts show the formula is
      available across Homebrew, Debian, Fedora/DNF, MacPorts, Nix, Arch, Ubuntu, and
      openSUSE/Zypper, reflecting the utility's long-lived role as a tiny reference
      program in Unix collections.
  package-nerd-significance:
    - >
      ascii is package-nerd catnip because it is a small, old, useful command that
      survived several hosting eras and kept receiving portability and packaging fixes.
      The changelog explicitly names downstream pressure from Debian and MacPorts, and
      recent changes mention packager hardening flags, making it a clean example of a
      tiny utility shaped by distributions over decades.
  project-history:
    - >
      The official NEWS file records the first release by Eric S. Raymond as version 1.0
      in March 1990. Through the 1990s it accumulated ISO-style code table escapes,
      contributed changes, a splash-screen idea, and option changes; version 3.0 in July
      2000 added HTML/SGML entity names.
    - >
      The modern 3.x line continued as a maintenance-oriented C utility. The NEWS file
      records a 2010 license change to BSD and ANSI C cleanup, 2011 additions from
      Debian, a 2013 Makefile fix from MacPorts, a 2015 project metadata move away from
      Gitorious, 2017 binary table output, 2024 CLI flag handling updates, and 2026
      hardening/packaging work.
  related-projects:
    - >
      Repology tracks packaged versions across distributions, and the official page
      embeds its package-status badge.
    - >
      Downstream package systems named in the input include Homebrew, Debian, Fedora,
      MacPorts, Nix, Arch, Ubuntu, and openSUSE.
  sources:
    - http://www.catb.org/~esr/ascii
    - http://www.catb.org/~esr/ascii/NEWS.adoc
    - http://www.catb.org/~esr/ascii/README.adoc
    - http://www.catb.org/~esr/ascii/ascii.html
  summary:
    - >
      ascii is Eric S. Raymond's compact Unix reference utility for translating among
      ASCII character names, byte values, numeric bases, Teletype mnemonics, ISO/ECMA
      code positions, XML entity names, and slang names. Called without arguments, it
      prints a small ASCII chart.
  timeline:
    - '1990-03: First public release, v1.0, by Eric S. Raymond.'
    - '1995-12: v2.0 adds ISO-style code table escapes.'
    - '2000-07: v3.0 adds HTML/SGML entity names.'
    - '2010-10: v3.10 changes license to BSD and polishes code to ANSI C.'
    - '2013-11: v3.13 adjusts Makefile behavior for MacPorts PREFIX convention.'
    - '2015-04: v3.15 updates project metadata after Gitorious decline.'
    - '2017-07: v3.17 adds binary code-point table output.'
    - '2026-03: v3.32 allows packager hardening flags and radix-forcing options.'
  usage:
    - >
      Package users typically install it for fast terminal lookup: provide a character,
      number, escape, mnemonic, or entity name and ascii prints the corresponding
      representations; run it with no arguments to get a chart. Recent options can force
      output radix with `-d`, `-o`, `-x`, or `-b`.
related-packages: []
category: developer-tools
