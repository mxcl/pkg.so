  brew: ascii
  debian: ascii
  dnf: ascii
  macports: ascii
  nix: ascii
  pacman: ascii
  ubuntu: ascii
  zypper: ascii
package-manager-url: https://formulae.brew.sh/formula/ascii
license: BSD-2-Clause
tags:
  - ascii
  - byte-conversion
  - character-codes
  - cli
  - reference
  - unix
description: List ASCII idiomatic names and octal/decimal code-point forms
executables:
