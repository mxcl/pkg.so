id: brew:action-docs
display-name: Action docs
homepage: https://github.com/npalm/action-docs
repo: https://github.com/npalm/action-docs
docs:
  - https://github.com/npalm/action-docs#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README advertises npm installation, CLI use, README update markers, a
      JavaScript API, and a companion GitHub Action. That adoption path matches the
      GitHub Actions ecosystem: project authors can run the CLI locally, in npm
      workflows, or through automation.
  package-nerd-significance:
    - >
      action-docs matters to package-manager users because it turns GitHub Actions
      metadata into reproducible documentation output, a small automation task that fits
      naturally into npm scripts, Homebrew-installed CLIs, and repository maintenance
      workflows.
  project-history:
    - >
      The repository was created in 2021, and the official releases begin with 1.0.0 in
      March 2021. Its README frames the tool around keeping README sections synchronized
      with GitHub action or workflow definitions.
  related-projects:
    - >
      Related projects include GitHub Actions documentation generators, README updaters,
      markdown automation tools, and npalm/action-docs-action.
  sources:
    - https://api.github.com/repos/npalm/action-docs
    - https://api.github.com/repos/npalm/action-docs/releases
    - https://raw.githubusercontent.com/npalm/action-docs/master/README.md
  summary:
    - >
      action-docs is a Node.js CLI and library that generates and updates Markdown
      documentation for GitHub Actions and workflows from action.yml-style metadata.
  timeline:
    - '2021-02-20: GitHub repository created.'
    - '2021-03-07: 1.0.0 release published.'
    - '2024-02-04: 2.0.0 release published.'
    - '2024-11-10: 2.5.1 release published.'
  usage:
    - >
      Users add action-docs HTML comment markers to Markdown files, then run action-docs
      to print generated docs or action-docs --update-readme to update files in place.
      Options cover source action/workflow files, table-of-contents level, line breaks,
      and custom README targets.
related-packages:
  - id: brew:action-validator
    reason: >
      Use action-validator to check the GitHub Action or workflow YAML that Action docs
      consumes before regenerating its Markdown documentation.
    rel: adjacent_workflow
    sources:
      - https://github.com/npalm/action-docs#readme
      - https://github.com/mpalmer/action-validator#readme
category: developer-tools
package-manager:
  brew: action-docs
package-manager-url: https://formulae.brew.sh/formula/action-docs
license: MIT
tags:
  - cli
  - documentation
  - github-actions
  - markdown
  - nodejs
description: Generate docs for GitHub actions
executables:
  - action-docs
provenance:
  formula: action-docs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
