id: brew:carton
display-name: Carton
homepage: https://metacpan.org/pod/Carton
repo: https://github.com/perl-carton/carton
docs:
  - https://metacpan.org/pod/Carton
  - https://metacpan.org/pod/Carton::Doc::Install
config-file-location:
  unix: ./cpanfile
credentials-file-location: null
history:
  adoption-history:
    - >
      Carton came from the Perl/CPAN application-deployment world, where repeatable
      local dependency installs mattered for web apps and services. Its README tells
      developers to commit cpanfile and cpanfile.snapshot so other machines and
      deployment boxes install the same dependency tree.
  package-nerd-significance:
    - >
      Carton is important package-manager plumbing because it adapts the
      lockfile-and-local-install pattern to CPAN applications. Its README explicitly
      references Bundler, pip, npm, cpanm, cpanfile, and Carmel, making it a useful
      bridge between Perl packaging culture and the broader application
      dependency-manager era.
  project-history:
    - >
      The public GitHub repository was created in 2011 and the README copyright line
      credits Tatsuhiko Miyagawa from 2011 onward. The latest MetaCPAN release metadata
      identifies Carton-v1.0.35, authored by MIYAGAWA and dated May 7, 2022.
  related-projects:
    - >
      The README's SEE ALSO section points to Carmel, cpanm, cpanfile, Bundler, pip,
      npm, perlrocks, and only.
    - >
      Carton is closely tied to CPAN, cpanfile, local::lib-style local installs, and
      Perl application deployment.
  sources:
    - https://api.github.com/repos/perl-carton/carton
    - https://github.com/perl-carton/carton
    - https://metacpan.org/pod/Carton
    - https://metacpan.org/pod/Carton::Doc::Install
    - https://formulae.brew.sh/api/formula/carton.json
  summary:
    - >
      Carton is a Perl application dependency manager, described by its official README
      and MetaCPAN metadata as a Bundler-like tool for Perl. It tracks dependencies
      declared in cpanfile and pins resolved module versions in cpanfile.snapshot.
  timeline:
    - '2011: Public GitHub repository created and copyright begins.'
    - '2022: MetaCPAN release metadata lists Carton-v1.0.35.'
    - >
      2020s: README documents cpanfile, cpanfile.snapshot, local installs, deployment
      mode, and vendored cache workflows.
  usage:
    - >
      A typical workflow declares modules in cpanfile, runs carton install, commits
      cpanfile and cpanfile.snapshot, then runs commands through carton exec or points
      Perl at local/lib/perl5. Deployment mode installs exactly from the snapshot, and
      carton bundle can vendor tarballs into vendor/cache for cached or offline
      installs.
related-packages:
  - id: brew:cpanminus
    reason: >
      Choose cpanminus for direct, minimal CPAN module installation; Carton uses the
      same installer ecosystem but adds an application manifest, snapshot, and
      project-local deployment workflow.
    rel: adjacent_workflow
    sources:
      - https://metacpan.org/pod/Carton
      - https://metacpan.org/pod/App::cpanminus
category: developer-tools
package-manager:
  brew: carton
  debian: carton
  ubuntu: carton
  winget: Unifan.Carton
package-manager-url: https://formulae.brew.sh/formula/carton
license: Artistic-1.0-Perl OR GPL-1.0-or-later
tags:
  - cli
  - cpan
  - cpanfile
  - dependency-manager
  - perl
description: Perl module dependency manager (aka Bundler for Perl)
executables:
  - carton
provenance:
  formula: carton
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
