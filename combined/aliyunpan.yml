id: brew:aliyunpan
display-name: aliyunpan
homepage: https://github.com/tickstep/aliyunpan
repo: https://github.com/tickstep/aliyunpan
docs:
  - https://github.com/tickstep/aliyunpan/blob/master/docs/manual.md
  - https://github.com/tickstep/aliyunpan
config-file-location:
  unix: $ALIYUNPAN_CONFIG_DIR/aliyunpan_config.json
credentials-file-location:
  unix: $ALIYUNPAN_CONFIG_DIR/aliyunpan_config.json
history:
  adoption-history:
    - >
      The README is written for end users running the tool on Windows, macOS, Linux,
      Android, iOS, NAS, embedded devices, and Docker. The input package-manager facts
      additionally show Homebrew, Nix, and winget packaging.
    - >
      Its sync mode gives the tool a NAS and backup niche: official docs describe
      local-to-drive, drive-to-local, and bidirectional backup workflows.
  package-nerd-significance:
    - >
      aliyunpan matters to package nerds as a cloud-storage CLI outside the major
      Western cloud ecosystems: it has cross-platform release artifacts, package-manager
      installs, Docker automation, and a config/credential file that users often need to
      mount or relocate.
  project-history:
    - >
      The public repository begins in git history on 2021-08-04. Its README describes a
      CLI for Alibaba Cloud Drive with JavaScript plugins, sync backup, album batch
      download, multi-user support, and shell-style file commands.
    - >
      The project is distributed as release archives and through several package-manager
      and deployment paths documented by the README, including apt, yum, Homebrew,
      winget, and Docker sync images.
  related-projects:
    - 'Alibaba Cloud Drive: cloud storage service targeted by the client.'
    - 'tickstep/aliyunpan-sync Docker image: documented sync deployment path.'
  sources:
    - Git history from https://github.com/tickstep/aliyunpan.git
    - 'Official README: https://raw.githubusercontent.com/tickstep/aliyunpan/master/README.md'
    - 'Official manual: https://github.com/tickstep/aliyunpan/blob/master/docs/manual.md'
    - source_facts.package-manager
  summary:
    - >
      aliyunpan is a third-party Alibaba Cloud Drive command-line client that presents
      cloud-drive operations through a Linux-shell-like interface.
  timeline:
    - '2021: Public Git history begins.'
    - '2021: v0.0.1 tag appears in repository history.'
    - '2026: v0.4.0 tag appears in repository history.'
  usage:
    - >
      Users can run aliyunpan interactively, log in through a browser authorization
      flow, list directories, upload and download files, switch drives, and run sync
      backup. The README documents ALIYUNPAN_CONFIG_DIR for relocating the configuration
      directory; Docker sync examples mount aliyunpan_config.json as the already
      logged-in credential/config file.
related-packages: []
category: productivity
package-manager:
  brew: aliyunpan
  nix: aliyunpan
  winget: tickstep.aliyunpan
package-manager-url: https://formulae.brew.sh/formula/aliyunpan
license: Apache-2.0
tags:
  - alibaba-cloud-drive
  - aliyun-drive
  - cli
  - cloud-storage
  - sync
description: Command-line client tool for Alibaba aDrive disk
executables:
  - aliyunpan
provenance:
  formula: aliyunpan
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
