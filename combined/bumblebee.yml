id: brew:bumblebee
display-name: Bumblebee
homepage: https://github.com/perplexityai/bumblebee
repo: https://github.com/perplexityai/bumblebee
docs:
  - https://github.com/perplexityai/bumblebee/blob/main/docs/inventory-sources.md
  - https://github.com/perplexityai/bumblebee#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Bumblebee arrived in the context of 2020s supply-chain incidents where responders
      needed quick fleet-wide answers about vulnerable or compromised developer tooling.
      Its early visibility is stronger than most new CLI tools because it comes from
      Perplexity AI and addresses active developer-endpoint inventory needs.
  package-nerd-significance:
    - >
      For package-history work, Bumblebee is significant as a scanner of package-manager
      residue rather than a package manager itself. It catalogs npm, pnpm, Yarn, Bun,
      PyPI, Go, RubyGems, Composer, Homebrew, editor extensions, browser extensions, MCP
      configs, and agent-skill lock files, making it a snapshot of what modern developer
      machines accumulate.
  project-history:
    - >
      The public repository was created in May 2026. Its first tagged public release,
      v0.1.1, was published on May 22, 2026, and v0.1.2 followed in June with additional
      exposure catalog coverage.
    - >
      The README emphasizes a deliberately narrow scope: a single static Go binary,
      read-only scanning, zero non-standard-library dependencies, and no package-manager
      execution. Instead of asking package managers what is installed, Bumblebee parses
      lockfiles, installed metadata, extension manifests, and selected developer-tool
      configuration files.
  related-projects:
    - >
      Related systems include SBOM generators, endpoint detection tools, package-lock
      analyzers, and supply-chain scanners. Bumblebee's README explicitly distinguishes
      its local-state view from SBOMs that describe shipped software and EDR systems
      that describe executed behavior.
  sources:
    - https://github.com/perplexityai/bumblebee
    - https://github.com/perplexityai/bumblebee/blob/main/docs/inventory-sources.md
    - https://github.com/perplexityai/bumblebee/releases
    - https://raw.githubusercontent.com/perplexityai/bumblebee/main/README.md
  summary:
    - >
      Bumblebee is a Perplexity AI endpoint inventory scanner for software supply-chain
      response. It is designed to answer which developer machines show on-disk evidence
      of a named package, extension, or version during an incident.
  timeline:
    - '2026-05: Public GitHub repository created.'
    - '2026-05-22: v0.1.1 published as the initial public release.'
    - '2026-06-18: v0.1.2 added more exposure catalog coverage.'
  usage:
    - >
      Users run `bumblebee scan` with baseline, project, or deep profiles and receive
      NDJSON package and finding records. With an exposure catalog, it can suppress
      ordinary package records and emit only exact package-exposure matches for response
      workflows.
related-packages:
  - id: brew:osv-scanner
    reason: >
      Use OSV-Scanner alongside Bumblebee when project, lockfile, SBOM, or container
      inventories should be matched automatically against the OSV vulnerability database
      rather than only against Bumblebee's operator-supplied exposure catalogs.
    rel: adjacent_workflow
    sources:
      - https://github.com/perplexityai/bumblebee/blob/main/docs/inventory-sources.md
      - https://google.github.io/osv-scanner/
      - https://google.github.io/osv-scanner/usage/
  - id: brew:syft
    reason: >
      Use Syft to generate SBOMs for container images, filesystems, directories, and
      archives, complementing Bumblebee's developer-endpoint view with an inventory of
      built and shipped artifacts.
    rel: adjacent_workflow
    sources:
      - https://github.com/perplexityai/bumblebee#readme
      - https://oss.anchore.com/docs/guides/sbom/
category: security
package-manager:
  brew: bumblebee
  debian: bumblebee
  nix: bumblebee
  pacman: bumblebee
  ubuntu: bumblebee
  zypper: bumblebee
package-manager-url: https://formulae.brew.sh/formula/bumblebee
license: Apache-2.0
tags:
  - cli
  - developer-tools
  - endpoint-scanner
  - inventory
  - metadata-scanning
  - supply-chain-security
description: Read-only developer endpoint scanner for supply-chain exposure
executables:
  - bumblebee
provenance:
  formula: bumblebee
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
