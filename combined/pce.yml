id: brew:pce
display-name: PCE
homepage: http://www.hampa.ch/pce/
repo: http://git.hampa.ch/pce.git
docs:
  - http://www.hampa.ch/pce
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - PCE is distributed as GPL-2.0-only software and packaged in Homebrew as the pce formula.
  package-nerd-significance:
    - >
      PCE appeals to retro-computing package users because one installation provides
      several machine emulators, processor simulators, and disk-image utilities instead
      of focusing on a single platform.
  project-history:
    - >
      PCE is Hampa Hug's personal-computer emulator suite. The supplied executable
      inventory covers IBM-compatible PCs, Macintosh Plus, Regnecentralen RC759, and
      several processor architectures.
  related-projects:
    - The suite includes pce-img and pfdc alongside its machine and processor emulators.
  sources:
    - http://www.hampa.ch/pce
    - source_facts.description
    - source_facts.executables
    - source_facts.license
    - source_facts.package-manager
  summary:
    - PCE is a GPL-licensed multi-system personal-computer emulator suite.
  timeline:
    - PCE became available in Homebrew under the formula name pce.
  usage:
    - >
      Common entry points include pce-ibmpc for IBM PC emulation, pce-macplus for
      Macintosh Plus emulation, pce-img for disk-image operations, and pfdc for
      floppy-disk work. Additional executables simulate several processors and the RC759
      system.
category: games
package-manager:
  brew: pce
package-manager-url: https://formulae.brew.sh/formula/pce
license: GPL-2.0-only
tags:
  - cli
  - emulator
  - ibm-pc
  - macintosh
  - retro-computing
description: PC emulator
executables:
  - pbit
  - pce-ibmpc
  - pce-img
  - pce-macplus
  - pce-rc759
  - pce-sim405
  - pce-sim6502
  - pce-simarm
  - pce-sims32
  - pfdc
provenance:
  formula: pce
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
