id: brew:cornelis
display-name: Cornelis
homepage: https://github.com/agda/cornelis
repo: https://github.com/agda/cornelis
docs:
  - https://github.com/agda/cornelis#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/nvim/init.vim
    - $XDG_CONFIG_HOME/nvim/init.lua
    - ~/.config/nvim/init.vim
    - ~/.config/nvim/init.lua
  windows:
    - ~/AppData/Local/nvim/init.vim
    - ~/AppData/Local/nvim/init.lua
credentials-file-location: null
history:
  adoption-history:
    - >
      Cornelis serves the smaller intersection of Agda users and Neovim users. Its
      adoption significance is mainly editorial and workflow-based: it gives dependently
      typed programming a modal-editor path rather than requiring the traditional
      Emacs-centered Agda workflow.
  package-nerd-significance:
    - >
      Cornelis is interesting to package maintainers because it is both an editor
      integration and a Haskell-built executable. Distribution needs to account for
      Neovim plugin layout, Stack/Haskell build expectations, and compatibility with
      Agda versions.
  project-history:
    - >
      The upstream README still describes Cornelis in relation to Emacs agda-mode and
      documents installation through common Vim and Neovim plugin managers. The current
      repository under the Agda organization was created in 2022, and its README states
      that the repository is currently unmaintained while asking interested maintainers
      to contact the Agda community.
  related-projects:
    - >
      Related projects include Agda, agda-mode for Emacs, nvim-hs.vim, vim-textobj-user,
      and Neovim plugin managers such as vim-plug and lazy.nvim.
  sources:
    - https://github.com/agda/cornelis
    - https://raw.githubusercontent.com/agda/cornelis/master/README.md
    - https://api.github.com/repos/agda/cornelis
    - https://api.github.com/repos/agda/cornelis/tags
  summary:
    - >
      Cornelis is a Neovim interface for Agda, positioning itself as agda-mode for
      Neovim. It is written in Haskell and exposes Agda interactions through Vim
      commands for loading, goals, refinement, case splitting, normalization, and
      navigation.
  timeline:
    - '2022: Current agda/cornelis GitHub repository created.'
    - >
      2026: Repository metadata shows recent activity while the README marks the project
      as unmaintained.
    - 'Present: Tags in the official repository include v2.7.0, v2.7.1, and v2.8.0.'
  usage:
    - >
      Users install Cornelis as a Neovim plugin, build it with Stack, and configure
      Vimscript or Lua variables for behavior such as rewrite mode, Agda input prefix,
      disabling default bindings, and debug logging.
related-packages:
  - id: brew:agda
    reason: >
      Cornelis provides the interactive Neovim interface for Agda, and its release
      guidance explicitly ties Cornelis compatibility to the installed Agda release
      line.
    rel: adjacent_workflow
    sources:
      - https://github.com/agda/cornelis
      - https://agda.readthedocs.io/en/latest/getting-started/what-is-agda.html
  - id: brew:neovim
    reason: >
      Cornelis runs as a Neovim plugin, with its mappings and behavior configured
      through Neovim's user configuration.
    rel: adjacent_workflow
    sources:
      - https://github.com/agda/cornelis
      - https://neovim.io/doc/user/starting.html
category: developer-tools
package-manager:
  brew: cornelis
  nix: cornelis
package-manager-url: https://formulae.brew.sh/formula/cornelis
license: BSD-3-Clause
tags:
  - agda
  - cli
  - editor-plugin
  - haskell
  - neovim
description: Neovim support for Agda
executables:
  - cornelis
provenance:
  formula: cornelis
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
