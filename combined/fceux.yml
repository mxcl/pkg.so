id: brew:fceux
display-name: FCEUX
homepage: https://fceux.com/
repo: https://github.com/TASEmulators/fceux
docs:
  - https://fceux.com/web/documentation.html
  - https://fceux.com/web/help/fceux.html
config-file-location:
  unix:
    - ~/.fceux/fceux.cfg
    - ~/.fceux/cfg.d/*.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      FCEUX became a practical default for users who wanted one emulator that covered
      normal play and specialist workflows. The official site explicitly names general
      players, the ROM-hacking community, and the tool-assisted speedrun community as
      target audiences.
    - >
      Its adoption in package managers reflects that cross-platform utility: the input
      metadata lists packages across Homebrew, Debian, Ubuntu, Arch, Alpine, Nix, and
      winget, while the project itself documents Windows and SDL builds.
  package-nerd-significance:
    - >
      FCEUX packages preserve a historically messy emulator family behind one
      installable name. Instead of choosing among FCE Ultra, rerecording, debugger, or
      mapper forks, users get the merged branch with documentation and release history.
    - >
      For Unix package collections, it is one of the NES emulators that demonstrates why
      emulator packages are not just games: they are also reverse-engineering,
      debugging, TAS, and preservation tools.
  project-history:
    - >
      The lineage starts with FCE, a Nintendo Entertainment System/Famicom emulator by
      Bero, then FCE Ultra, which released Beta 1 at the end of November 1998. FCE Ultra
      later gained Linux and Windows ports, released source in 2000, and relicensed
      under the GNU GPL in 2002.
    - >
      By the mid-2000s, FCE Ultra had split into specialized branches: rerecording
      builds for tool-assisted speedruns, debugger-oriented FCEUXD/FCEUXDSP variants,
      and mapper-focused work from FCEU-mm. FCEUX was created to reunify those branches
      into one maintained emulator.
  related-projects:
    - >
      FCE, FCE Ultra, FCEU rerecording, FCEUXD, FCEUXDSP, FCEUXDSP CE, and FCEU-mm are
      direct ancestors or merged branches.
    - >
      TASVideos is part of the broader community context because FCEUX's movie and
      rerecording features were built for tool-assisted speedrun workflows.
  sources:
    - https://fceux.com/web/home.html
    - https://fceux.com/web/version.html
    - https://fceux.com/web/help/FCEUltraVersionHistory.html
    - https://fceux.com/web/help/WhatsNew200.html
    - https://github.com/TASEmulators/fceux
  summary:
    - >
      FCEUX is an all-in-one NES, Famicom, Famicom Disk System, and Dendy emulator. Its
      own homepage positions it for both casual play and advanced emulator work such as
      debugging, ROM hacking, map making, tool-assisted movies, and Lua scripting.
    - >
      The package is historically important because it consolidated the fragmented FCE
      Ultra family. FCEUX's official history says the project began in 2006 to merge FCE
      Ultra branches, and version 2.0.0 was released on August 2, 2008.
  timeline:
    - '1998: FCE Ultra Beta 1 was released near the end of November.'
    - '2000: FCE Ultra source code 0.40 was released.'
    - '2002: FCE Ultra 0.80 was relicensed under the GNU GPL; FCEUD added debugger features.'
    - '2006: FCEUX began as a merge of FCE Ultra branches.'
    - '2008: FCEUX 2.0.0 was released on August 2.'
    - '2023: FCEUX 2.6.6 was released on August 26.'
  usage:
    - >
      Basic use is opening an NES/Famicom ROM from the File menu or command line. More
      advanced use centers on debugger tools, RAM watch/search, trace logging, hex
      editing, Lua scripting, movie recording, and TAS Editor workflows.
    - >
      FCEUX is also a package nerd's emulator because it bundles a CLI-friendly SDL
      heritage with a GUI and long-lived documentation, so it can serve both desktop
      users and scripted emulator workflows.
related-packages:
  - id: brew:mednafen
    reason: >
      Choose Mednafen when you want a command-line-driven emulator covering NES plus
      many other console families; choose FCEUX for its NES-specific debugging,
      ROM-hacking, Lua, and TAS toolset.
    rel: alternative
    sources:
      - https://fceux.com/web/home.html
      - https://mednafen.github.io/
  - id: brew:nestopia-ue
    reason: >
      Choose Nestopia UE for a focused cross-platform NES emulator with a standalone
      GUI; choose FCEUX when integrated debugging and tool-assisted-movie features are
      more important.
    rel: alternative
    sources:
      - https://fceux.com/web/home.html
      - https://github.com/0ldsk00l/nestopia
category: games
package-manager:
  apk: fceux
  brew: fceux
  debian: fceux
  nix: fceux
  pacman: fceux
  ubuntu: fceux
  winget: FCEUX.FCEUX
package-manager-url: https://formulae.brew.sh/formula/fceux
