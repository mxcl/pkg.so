id: brew:cask
display-name: Cask
homepage: https://cask.readthedocs.io/
repo: https://github.com/cask/cask
docs:
  - https://cask.readthedocs.io/en/latest
config-file-location:
  unix: Cask
credentials-file-location: null
history:
  adoption-history:
    - >
      Cask became part of the Emacs package-author toolchain during the period when
      package.el, MELPA, and CI workflows were becoming common. Its presence in Homebrew
      and MacPorts made it easy for package maintainers to install the same command-line
      tool used in project automation.
    - >
      Homebrew analytics show continued use despite the project's age, with 27,894
      stable installs in the last 365 days in the formula API.
  package-nerd-significance:
    - >
      Cask matters to package nerds because it brought Bundler-style dependency
      declarations and repeatable command execution to Emacs Lisp projects, making Emacs
      packages easier to test and publish from CI and shell scripts.
  project-history:
    - >
      The public repository was created in 2012 and later moved under the cask GitHub
      organization. Official documentation describes Cask as dependency management for
      Emacs and documents a small domain-specific language for package metadata and
      dependencies.
  related-projects:
    - >
      Emacs package.el and MELPA are the broader package ecosystem that Cask projects
      usually target.
    - Homebrew and MacPorts distribute the Cask command-line tool on macOS.
  sources:
    - https://api.github.com/repos/cask/cask
    - https://github.com/cask/cask
    - https://cask.readthedocs.io/
    - https://cask.readthedocs.io/en/latest
    - https://formulae.brew.sh/api/formula/cask.json
  summary:
    - >
      Cask is an Emacs Lisp project-management and dependency tool centered on a
      project-local `Cask` file. It helped Emacs package authors declare dependencies,
      run commands in an isolated package environment, and build packages from the
      command line.
  timeline:
    - '2012: Public GitHub repository created.'
    - '2010s: Cask documented as an Emacs dependency-management CLI with a project-local DSL.'
    - '2026: Homebrew packages v0.9.1 and reports continuing install activity.'
  usage:
    - >
      A project declares dependencies in a file named `Cask`; users then run commands
      such as `cask install`, `cask exec`, `cask emacs`, `cask build`, and `cask
      package`. The DSL reference covers package metadata and dependency declarations.
related-packages:
  - id: brew:emacs
    reason: >
      Cask provisions and tests Emacs Lisp packages inside version-specific GNU Emacs
      environments, so Emacs is the required runtime and the executable selected by its
      `EMACS` or `CASK_EMACS` setting.
    rel: adjacent_workflow
    sources:
      - https://github.com/cask/cask
      - https://cask.readthedocs.io/en/latest/guide/usage.html
      - https://www.gnu.org/software/emacs/
category: developer-tools
package-manager:
  brew: cask
  macports: cask
package-manager-url: https://formulae.brew.sh/formula/cask
license: GPL-3.0-or-later
tags:
  - cli
  - dependency-manager
  - emacs
  - emacs-lisp
  - package-management
description: Emacs dependency management
executables:
  - cask
provenance:
  formula: cask
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
