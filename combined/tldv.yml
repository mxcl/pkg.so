history:
  adoption-history:
    - >
      Founded as remote work rapidly expanded in 2020, tl;dv grew from a meeting
      recorder into a meeting-intelligence service used by sales, customer-success,
      consulting, and other meeting-heavy teams. Its official company history reports
      broad international adoption and support for more than 100 transcription
      languages.
  package-nerd-significance:
    - >
      The Homebrew cask packages the desktop capture component of a primarily
      cloud-backed service. It is notable to package users because installation is
      local, while recordings, transcription, AI notes, integrations, and account policy
      remain service-managed.
  project-history:
    - >
      tl;dv was founded in Aachen, Germany, in 2020 by Raphael Allstadt, Carlo Thissen,
      and Allan Betteral. The founders focused on reducing the follow-up work created by
      meetings.
    - >
      The product evolved beyond recording and transcription into automated summaries,
      cross-meeting analysis, CRM updates, follow-up drafting, and integrations. It
      supports Google Meet, Zoom, Microsoft Teams, and bot-free capture through its
      desktop application.
  related-projects:
    - >
      tl;dv integrates with meeting platforms including Zoom, Google Meet, and Microsoft
      Teams and connects meeting output to CRM and automation systems.
  sources:
    - >
      https://intercom.help/tldv/en/articles/14433922-record-meetings-on-any-platform-with-or-without-a-bot-tl-dv-desktop-app
    - >
      https://intercom.help/tldv/en/articles/8925840-understanding-and-setting-your-preferences
    - https://tldv.io/about-us/
  summary:
    - >
      tl;dv is a commercial AI meeting-intelligence service that records conversations,
      produces transcripts and notes, and turns meeting content into follow-ups, CRM
      updates, and aggregate insights.
  timeline:
    - '2020: tl;dv was founded in Aachen, Germany.'
    - >
      2020 onward: The service expanded across Google Meet, Zoom, and Microsoft Teams
      and added automation and meeting-intelligence features.
  usage:
    - >
      Users connect their calendars and configure which internal or external meetings
      should be recorded automatically, or initiate recordings through the desktop
      application or browser extension. The service then makes recordings, transcripts,
      AI notes, and sharing controls available through the tl;dv application.
    - >
      The desktop application can capture meetings with or without a meeting bot and
      requires operating-system microphone and system-audio permissions. Official
      documentation describes preferences in the application but does not publish a
      supported configuration-file or credentials-file path.
related-packages:
  - id: cask:fathom
    reason: >
      Choose Fathom as an alternative meeting recorder and summarizer when its
      live-meeting workflow for Zoom, Google Meet, and Microsoft Teams fits better;
      unlike tl;dv's documented API import capability, Fathom says it does not analyze
      uploaded calls.
    rel: alternative
    sources:
      - https://help.fathom.video/en/articles/6049729
      - https://intercom.help/tldv/en/articles/11583137-api
