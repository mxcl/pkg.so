id: brew:helix
display-name: Helix
homepage: https://helix-editor.com
repo: https://github.com/helix-editor/helix
docs:
  - https://docs.helix-editor.com/
  - https://docs.helix-editor.com/master
config-file-location:
  unix:
    - ~/.config/helix/config.toml
    - .helix/config.toml
  windows: '%AppData%\helix\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project moved quickly from source builds and GitHub releases into
      operating-system package channels. The supplied package metadata lists Homebrew,
      Chocolatey, Debian, Fedora, MacPorts, Nix, Arch, Scoop, winget, and openSUSE
      packaging, which is broad coverage for a comparatively young terminal editor.
    - >
      Its adoption has been helped by an easy executable name, `hx`, and by official
      documentation that covers installation, configuration, language setup, themes, and
      keymaps in one place.
  package-nerd-significance:
    - >
      Helix is interesting to package nerds because it compresses several editor-era
      trends into one package: Rust terminal UI, Tree-sitter grammars, LSP integration,
      modal editing, and runtime data that must be installed in the right place.
    - >
      It also provides a useful contrast with plugin-heavy editor packaging. A Helix
      package has to get runtime paths and grammar assets right, but it does not require
      bootstrapping a large external plugin manager just to provide language-aware
      editing.
  project-history:
    - >
      The public GitHub repository was created in June 2020. The project developed
      around a Rust codebase split into editor core, terminal UI, LSP, DAP, loader,
      runtime, and query assets, which made the editor feel more like a self-contained
      toolchain than a thin terminal frontend.
    - >
      Helix's editing model comes from Kakoune's selection-first approach, while its
      ecosystem position naturally invites comparison with Neovim. The project made
      built-in LSP and Tree-sitter support part of the editor's baseline rather than
      optional plugin work.
  related-projects:
    - Kakoune supplies the strongest editing-model influence.
    - Neovim is the closest modal-editor ecosystem comparison.
    - >
      Tree-sitter and the Language Server Protocol are core technologies in Helix's
      default feature set.
    - >
      Nix, Homebrew, Chocolatey, Scoop, winget, Debian, Fedora, Arch, MacPorts, and
      openSUSE appear in the supplied package metadata as distribution channels.
  sources:
    - https://api.github.com/repos/helix-editor/helix
    - https://docs.helix-editor.com/
    - https://github.com/helix-editor/helix
    - https://github.com/helix-editor/helix/releases
  summary:
    - >
      Helix is a terminal-first modal editor written in Rust. Its own README frames it
      as a Kakoune- and Neovim-inspired editor with Vim-like modal editing, multiple
      selections, built-in Language Server Protocol support, and Tree-sitter-based
      syntax features.
    - >
      For package-manager users, Helix matters because it is a modern editor packaged as
      a single `hx` command while still shipping a large runtime of grammars, themes,
      language configuration, and editor documentation.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2021: Early public GitHub releases begin with the 0.0.x series.'
    - >
      2021: Helix documentation and installation guidance become part of the official
      project site.
    - '2025: The 25.x release series appears on the official GitHub release page.'
  usage:
    - >
      Users run Helix as `hx` to edit files in a modal terminal interface. Normal
      package-manager installs must provide the binary plus the runtime assets that
      power highlighting, indentation queries, themes, and language definitions.
    - >
      Helix configuration is conventionally stored in `config.toml` under the user
      config directory, with per-project overrides in `.helix/config.toml`; this makes
      it friendly to dotfile managers and repository-local editor policy.
related-packages:
  - id: brew:kakoune
    reason: >
      Choose Kakoune for the selection-first modal model with a deliberately composable,
      external-tool-oriented design; choose Helix for more LSP, Tree-sitter, split, and
      picker functionality built in.
    rel: alternative
    sources:
      - https://helix-editor.com/
      - https://kakoune.org/
  - id: brew:neovim
    reason: >
      Choose Neovim when a large Lua/plugin ecosystem and deep extensibility are
      priorities; choose Helix for stronger integrated defaults and less initial
      configuration.
    rel: alternative
    sources:
      - https://helix-editor.com/
      - https://neovim.io/
category: developer-tools
package-manager:
  apk: helix
  brew: helix
  chocolatey: helix
  debian: hx
  dnf: helix
  macports: helix
  nix: helix
  pacman: helix
  scoop: main/helix
  winget: Helix.Helix
  zypper: helix
package-manager-url: https://formulae.brew.sh/formula/helix
license: MPL-2.0
tags:
  - cli
  - modal-editor
  - rust
  - terminal
  - text-editor
description: Post-modern modal text editor
executables:
  - hx
provenance:
  formula: helix
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
