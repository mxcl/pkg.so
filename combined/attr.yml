id: brew:attr
display-name: attr
homepage: https://savannah.nongnu.org/projects/attr
repo: https://git.savannah.nongnu.org/cgit/attr.git
docs:
  - https://git.savannah.nongnu.org/cgit/attr.git/tree/doc/attr.1
  - https://git.savannah.nongnu.org/cgit/attr.git/tree/doc/getfattr.1
  - https://git.savannah.nongnu.org/cgit/attr.git/tree/doc/setfattr.1
  - https://savannah.nongnu.org/projects/attr
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata shows attr packaged across Homebrew, Debian, Ubuntu,
      Fedora, Arch, Alpine, Nix, and openSUSE-style channels, reflecting its role as a
      small standard systems utility rather than an application framework.
  package-nerd-significance:
    - >
      attr matters to package nerds because it is the user-visible companion to
      filesystem metadata features that otherwise hide behind kernel and libc
      interfaces. Its tiny CLI surface makes it a common dependency in system images and
      test environments.
  project-history:
    - >
      The official Savannah project and git repository maintain the attr userland
      utilities, including `attr`, `getfattr`, and `setfattr`, for working with extended
      attributes on supported filesystems.
  related-projects:
    - >
      Filesystem extended attributes are exposed by Linux filesystems and consumed by
      tools such as backup, security-labeling, and packaging utilities.
    - The Linux ACL tooling is a nearby low-level filesystem metadata package family.
  sources:
    - https://git.savannah.nongnu.org/cgit/attr.git
    - https://savannah.nongnu.org/projects/attr
    - official git tags from https://git.savannah.nongnu.org/git/attr.git
    - source_facts.package-manager
  summary:
    - attr provides command-line tools for manipulating filesystem extended attributes.
  timeline:
    - '2.4.x: Official git refs include late 2.4 series release tags.'
    - '2.5.x: Official git refs include 2.5 series release tags.'
    - '2.6.0: Official git refs include a v2.6.0 release tag.'
  usage:
    - >
      Package users install attr for shell access to extended attribute inspection and
      mutation. The command set is commonly used by administrators, packaging scripts,
      and filesystem tests that need explicit xattr operations.
related-packages:
  - id: brew:acl
    reason: >
      Use acl alongside attr when a filesystem-metadata workflow must inspect or change
      POSIX access-control lists as well as general extended attributes.
    rel: adjacent_workflow
    sources:
      - https://savannah.nongnu.org/projects/attr
      - https://savannah.nongnu.org/projects/acl
category: system
package-manager:
  apk: attr
  brew: attr
  debian: attr
  dnf: attr
  nix: attr
  pacman: attr
  ubuntu: attr
  zypper: attr
package-manager-url: https://formulae.brew.sh/formula/attr
license: GPL-2.0-or-later
tags:
  - cli
  - extended-attributes
  - filesystem
  - system-utilities
  - xattr
description: Manipulate filesystem extended attributes
executables:
  - attr
  - getfattr
  - setfattr
provenance:
  formula: attr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
