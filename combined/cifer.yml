  - classical-ciphers
  - cli
  - code-breaking
  - cryptanalysis
description: Work on automating classical cipher cracking in C
executables:
  - cifer
  - cifer-dict
provenance:
  formula: cifer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
