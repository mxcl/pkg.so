id: brew:cifer
display-name: cifer
homepage: https://code.google.com/p/cifer/
repo: https://code.google.com/archive/p/cifer/source/default/source
docs:
  - https://code.google.com/archive/p/cifer
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages cifer 1.2.0 from the Google Code Archive storage tarball and
      bottles it for macOS and Linux. The Homebrew formula metadata carries a Linux
      linker-order patch and a readline dependency adjustment, showing the package has
      been kept buildable despite the upstream project being archival.
    - >
      Homebrew analytics are very small, with single-digit recent monthly
      install-on-request counts, so cifer is best understood as a niche
      historical/security utility rather than a broadly adopted modern security tool.
  package-nerd-significance:
    - >
      For package maintainers, cifer is interesting because it is an archived Google
      Code-era C program that Homebrew still builds, bottles, patches on Linux, and
      tests by invoking the binary. It is the kind of small historical CLI that survives
      in package managers long after its original hosting platform disappeared.
  project-history:
    - >
      The 1.2.0 source tarball identifies cifer as copyright 2008 by Simrun Basuita and
      Daniel Richman. Its bundled CHANGES file records an initial 1.0.0 release on
      2008-11-29, several maintenance releases in late 2008, and 1.2.0 on 2009-03-10.
    - >
      The project lived on Google Code and is now represented by the Google Code
      Archive, which makes it a preserved example of pre-GitHub open-source Unix CLI
      packaging.
  related-projects:
    - >
      cifer-dict is the companion executable shipped with cifer for creating
      dictionaries used by cifer's dictionary-assisted cracking commands.
    - >
      Homebrew's cifer formula is the active packaging surface that keeps the archived
      source buildable on current macOS and Linux systems.
  sources:
    - >
      https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/cifer/cifer-1.2.0.tar.gz
    - https://code.google.com/archive/p/cifer
    - https://formulae.brew.sh/api/formula/cifer.json
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/master/Formula/c/cifer.rb
  summary:
    - >
      cifer is a small C command-line toolkit for classical cryptanalysis: affine,
      Vigenere, Bacon, rail-fence, columnar transposition, frequency analysis, buffers,
      dictionaries, and scripting-oriented shell commands.
  timeline:
    - '2008: cifer copyright year and authorship recorded in the bundled README.'
    - '2008-11-29: Initial 1.0.0 release recorded in CHANGES.'
    - '2008-12-17: 1.1.0 added libreadline support.'
    - '2009-03-10: 1.2.0 released, later used as the Homebrew stable version.'
    - >
      2016: Google Code Archive became the long-term home for Google Code projects after
      Google Code Project Hosting shutdown.
  usage:
    - >
      The cifer manpage describes an interactive shell with script support. Users load
      ciphertext into buffers, apply filters, run frequency analysis, brute-force or
      solve supported classical ciphers, and use cifer-dict to build dictionaries for
      dictionary-assisted attacks.
related-packages: []
category: security
package-manager:
  brew: cifer
package-manager-url: https://formulae.brew.sh/formula/cifer
license: GPL-3.0-or-later
tags:
