id: brew:models
display-name: models
homepage: https://reyamira.github.io/models/
repo: https://github.com/reyamira/models
docs:
  - https://github.com/arimxyer/models#readme
config-file-location:
  linux: ~/.config/models/config.toml
  macos: ~/Library/Application Support/models/config.toml
  windows: '%APPDATA%\models\config.toml'
credentials-file-location: null
history:
  project-history:
    - >
      The project aggregates data from models.dev, Artificial Analysis, Epoch AI, Arena,
      LLM Stats, a curated agents catalog, and official provider status pages. The
      README describes a tabbed terminal interface plus scriptable commands such as
      listing, searching, showing model records, comparing benchmarks, checking agent
      releases, and inspecting provider status. Distribution spans Homebrew, Cargo, Nix,
      Scoop, AUR, prebuilt GitHub release artifacts, and package formats such as `.deb`
      and `.rpm`.
  sources:
    - https://formulae.brew.sh/formula/models
    - https://github.com/reyamira/models
    - https://raw.githubusercontent.com/reyamira/models/main/README.md
    - https://terminaltrove.com/models/
  summary:
    - >
      models is a Rust TUI and CLI from the reyamira/models project for browsing AI
      model metadata, benchmarks, coding agents, and provider status pages from the
      terminal. Its package-manager niche is unusually direct: instead of being an SDK
      for calling model APIs, it is an operator and developer browsing tool for
      comparing model IDs, prices, context windows, capabilities, benchmark entries,
      agent versions, and provider health without leaving a shell.
  usage:
    - >
      Because the public record is concentrated in the project's own repository and
      package pages, its deeper adoption history is thin. The useful history is its
      positioning: a terminal-native index over a fast-changing AI-provider ecosystem,
      closer to a package-browser or dashboard than to an inference client.
related-packages: []
category: ai
package-manager:
  brew: models
  scoop: extras/models
package-manager-url: https://formulae.brew.sh/formula/models
license: MIT
tags:
  - ai
  - ai-models
  - benchmarks
  - cli
  - coding-agents
  - tui
description: Fast TUI and CLI for browsing AI models, benchmarks, and coding agents
executables:
  - models
provenance:
  formula: models
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
