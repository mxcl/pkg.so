id: brew:bold
display-name: bold
homepage: https://codeberg.org/kubkon/bold
repo: https://codeberg.org/kubkon/bold
docs:
  - https://codeberg.org/kubkon/bold
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bold is a young specialist developer tool. The input package facts show Homebrew
      and Nix packaging, which is the expected adoption path for an experimental linker
      aimed at macOS and Zig-adjacent systems developers.
  package-nerd-significance:
    - >
      bold is interesting to package nerds because linkers are rarely casual
      dependencies; packaging it means exposing an alternate toolchain component that
      must match platform object formats, compiler driver behavior, and system linker
      expectations.
  project-history:
    - >
      The official README says bold used to be emerald, but the broader emerald driver
      effort was split off because of maintainer time constraints. The README positions
      bold as a direct competitor to LLVM lld and Apple's linker, with benchmark
      comparisons against Apple's rewritten linker, classic Apple ld, and lld.
  related-projects:
    - >
      Related projects include Apple ld, Apple's classic ld mode, LLVM lld, Zig, and the
      earlier emerald project.
  sources:
    - https://codeberg.org/api/v1/repos/kubkon/bold
    - https://codeberg.org/kubkon/bold
    - input.source_facts.package-manager
  summary:
    - >
      bold is a Zig-written drop-in replacement for Apple's system linker `ld`, focused
      on Mach-O linking on Apple platforms.
  timeline:
    - '2026: The Codeberg repository metadata records the public bold repository creation.'
    - '2026: The README describes bold as the focused successor to the earlier emerald effort.'
  usage:
    - >
      Typical usage is building with nightly Zig, then passing bold to C or C++
      compilers with `-fuse-ld=bold` for clang or `-B/path/to/bold` for gcc-style
      toolchains.
related-packages:
  - id: brew:lld
    reason: >
      Choose LLVM lld when you need a mature cross-platform linker supporting ELF, COFF,
      Mach-O, and WebAssembly; choose bold for a Zig-based linker specifically targeting
      Apple system-linker compatibility.
    rel: alternative
    sources:
      - https://codeberg.org/kubkon/bold
      - https://lld.llvm.org/
category: developer-tools
package-manager:
  brew: bold
  nix: bold
package-manager-url: https://formulae.brew.sh/formula/bold
license: MIT
tags:
  - apple
  - cli
  - ld
  - linker
  - macho
description: Drop-in replacement for Apple system linker ld
executables:
  - bold
provenance:
  formula: bold
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
