id: brew:keyd
display-name: keyd
homepage: https://github.com/rvaiya/keyd
repo: https://github.com/rvaiya/keyd
docs:
  - https://github.com/rvaiya/keyd/blob/master/docs/keyd.scdoc
  - https://github.com/rvaiya/keyd#readme
config-file-location:
  linux:
    - /etc/keyd/default.conf
    - ~/.config/keyd/app.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      keyd became popular among Linux users who wanted firmware-like keyboard behavior
      without flashing QMK or depending on a single desktop session. Distribution
      packages in Alpine, Debian, Nix, Arch, openSUSE, and Homebrew-style catalogs show
      adoption beyond source builds.
  package-nerd-significance:
    - >
      keyd is interesting to package nerds because it packages a tiny C daemon that
      changes the physical typing environment for the whole machine. It is also a
      practical response to the Wayland transition: remapping below the display server
      avoids the split between X-only and Wayland-only tools.
  project-history:
    - >
      The project, maintained by rvaiya, framed its impetus as a missing Linux-wide
      remapping solution. Its design goals are speed, a simple config format, consistent
      modifier behavior, and a small Unix-style daemon with IPC for scripting and
      application-specific remapping.
    - >
      The v2 documentation notes that the configuration format went through several
      iterations after the first release, making the man page the authoritative guide
      for users migrating from v1. The man page describes keyd as a system-wide daemon
      supporting layers, one-shot modifiers, macros, and custom layouts that persist
      across Wayland, X11, and TTY boundaries.
  related-projects:
    - >
      Related tools include xmodmap, xcape, interception-tools, xremap, KMonad, Kanata,
      and QMK firmware. keyd's distinct niche is system-wide Linux remapping with
      firmware-like layers but no keyboard flashing.
  sources:
    - https://github.com/rvaiya/keyd
    - https://github.com/rvaiya/keyd/blob/master/docs/CHANGELOG.md
    - https://github.com/rvaiya/keyd/blob/master/docs/keyd.scdoc
    - https://github.com/rvaiya/keyd/releases
    - https://man.archlinux.org/man/extra/keyd/keyd.1.en
  summary:
    - >
      keyd is a Linux key-remapping daemon that works below the display-server layer
      using evdev and uinput. It exists because desktop-specific tools such as xmodmap
      and xcape can be brittle across X11, Wayland, terminal VTs, and multiple
      keyboards.
  timeline:
    - '2021: Downstream package history shows early 1.x packaging activity.'
    - >
      2022: v2-era documentation told users migrating from v1 to reread the man page
      after config-format iterations.
    - >
      2024: Distribution bug reports and manuals show keyd being used on modern Linux
      kernels and Wayland desktops.
    - >
      2026: The project remained active enough for new issues and package-manager
      submissions around Homebrew and Linux distributions.
  usage:
    - >
      The common first configuration maps Caps Lock to Escape when tapped and Control
      when held, then reloads the daemon with keyd reload. More advanced users define
      layers, per-keyboard IDs, application mappings, Unicode output, and home-row or
      one-shot modifiers.
related-packages:
  - id: brew:kanata
    reason: >
      Kanata is a cross-platform alternative with layers, tap-hold actions, macros, and
      Unicode support; choose it when the same remapping approach must work on Linux,
      macOS, and Windows rather than only Linux.
    rel: alternative
    sources:
      - https://github.com/rvaiya/keyd
      - https://github.com/jtroo/kanata
category: system
package-manager:
  apk: keyd
  brew: keyd
  debian: keyd
  nix: keyd
  pacman: keyd
  zypper: keyd
package-manager-url: https://formulae.brew.sh/formula/keyd
license: MIT
tags:
  - cli
  - daemon
  - key-remapping
  - keyboard
  - linux
description: Key remapping daemon for Linux
executables:
  - keyd
  - keyd-application-mapper
provenance:
  formula: keyd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
