history:
  sources:
    - https://formulae.brew.sh/formula/mscgen
    - https://www.mcternan.me.uk/mscgen/
  summary:
    - >
      mscgen is Michael McTernan's small Message Sequence Chart renderer and text
      language. The project page says it parses MSC descriptions and produces PNG, SVG,
      EPS, or server-side image-map output, with a syntax inspired by Graphviz DOT but
      simpler because sequence charts do not require general graph layout. It is written
      in ANSI C, uses the GD graphics library for PNG output, and is licensed under
      GPLv2.
  usage:
    - >
      Its adoption came through documentation tooling as much as standalone diagram
      generation. Doxygen 1.5.2 added `\msc` and `\endmsc` support after McTernan
      experimented with custom Doxygen modifications, letting developers embed MSCs
      alongside source-code documentation in a way similar to DOT diagrams. The project
      page also lists packaging for distributions and integrations or extensions for
      AsciiDoc, Sphinx, LaTeX, Org-mode, TWiki, and JIRA. In practice, mscgen fits the
      Unix-documentation niche: keep diagrams as reviewable text, render them in builds
      or docs, and use a smaller tool when Msc-generator's broader GUI and multi-chart
      feature set is unnecessary.
related-packages:
  - id: brew:msc-generator
    reason: >
      Choose Msc-generator as a compatible, actively extended alternative when you need
      richer signalling-chart syntax, Graphviz or block diagrams, GUIs, or Office
      integration.
    rel: alternative
    sources:
      - https://www.mcternan.me.uk/mscgen/
      - https://msc-generator.gitlab.io/msc-generator/
