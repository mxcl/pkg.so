history:
  project-history:
    - >
      Technically, Montage became important because it is not only a monolithic mosaic
      maker. Its tools expose separate steps for image geometry analysis, reprojection,
      background matching, metadata table building, coaddition, and visualization, which
      is why the Homebrew package ships many small commands such as mProject, mDiff,
      mBgModel, mAdd, mImgtbl, mMakeHdr, and mViewer-related utilities. The Caltech
      record emphasizes ANSI C portability across Unix-like desktop, cluster, and
      supercomputer environments; later IPAC publication metadata describes it as a
      scalable C toolkit for FITS mosaics used in astronomy and information-technology
      communities for research, product generation, cyber-infrastructure, and
      visualization workflows.
  sources:
    - https://authors.library.caltech.edu/records/bkehe-cd481
    - https://github.com/Caltech-IPAC/Montage
    - https://montage.ipac.caltech.edu/
    - https://www.ipac.caltech.edu/publication/2017PASP..129e8006B
  summary:
    - >
      Montage is an astronomy image-mosaicking toolkit associated with Caltech/IPAC and
      the NASA/IPAC Infrared Science Archive. A 2008 CaltechAUTHORS record for the
      chapter "Web-based tools-montage: An astronomical image mosaic engine" lists G.
      Bruce Berriman, J. C. Good, A. C. Laity, J. C. Jacob, D. S. Katz, E. Deelman, G.
      Singh, and M.-H. Su among the creators, notes NASA and Caltech funding, and says
      the code is maintained by IRSA. The same record describes the central design
      promise: preserve calibration and astrometric fidelity while producing
      user-specified mosaics in astronomy coordinate systems and projections.
  usage:
    - >
      In practice, Montage sits in the scientific-command-line niche rather than the
      general image-processing niche. Astronomers use it to assemble science-grade FITS
      mosaics from survey or user images while keeping World Coordinate System metadata
      meaningful; workflow systems and archive services can compose its executables into
      larger pipelines. Version 5-era work added visualization features around mViewer,
      HEALPix input, and TOAST organization for WorldWide Telescope-style consumption,
      broadening the toolkit from mosaic generation into reproducible visual data
      products.
