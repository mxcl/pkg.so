id: brew:pay
display-name: pay
homepage: https://pay.sh
repo: https://github.com/solana-foundation/pay
docs:
  - https://github.com/solana-foundation/pay#readme
config-file-location:
  unix: ~/.config/pay/accounts.yml
credentials-file-location:
  unix: ~/.config/pay/accounts.yml
history:
  adoption-history:
    - >
      pay is distributed through Homebrew, npm, and Windows Package Manager, giving the
      client coverage across major desktop command-line package ecosystems.
    - >
      The project integrates with existing tools such as curl, wget, Claude Code, and
      Codex, and also exposes an MCP server for agent-driven paid HTTP requests.
  package-nerd-significance:
    - >
      pay packages an emerging HTTP payment workflow as a composable Unix-style wrapper.
      It is noteworthy because it preserves familiar client commands while adding
      challenge detection, local authorization, payment proof, and request replay.
    - >
      Its design also illustrates a newer packaging pattern: one binary combines a CLI,
      an agent protocol server, a local debugger, and secure-store integrations across
      operating systems.
  project-history:
    - >
      The Solana Foundation developed pay as a client for agentic HTTP payments. The
      current project handles x402 and Machine Payments Protocol challenges and supports
      stablecoin settlement on Solana.
    - >
      The project expanded beyond a simple HTTP wrapper to include account management,
      an MCP server, an API catalog, a payment gateway, sandbox facilities, and a local
      debugging interface.
  related-projects:
    - >
      pay-kit supplies multi-language building blocks for adding stablecoin payment
      behavior to applications.
    - pay-skills is the open catalog of paid APIs consumed by the CLI and agents.
    - x402 and MPP are the supported HTTP payment protocols.
  sources:
    - https://github.com/solana-foundation/pay
    - https://pay.sh/docs
    - https://pay.sh/docs/pay-for-apis/accounts
    - source_facts.package-manager
  summary:
    - >
      pay is a Solana Foundation command-line payment layer that wraps HTTP tools,
      handles supported HTTP 402 challenges, obtains local wallet authorization, and
      retries requests with payment proof.
  timeline:
    - >
      2020s: The Solana Foundation developed the pay command-line project for HTTP-based
      payments.
    - >
      2026: Official documentation describes x402 and MPP support, agent integrations,
      sandbox use, an MCP server, and a public API catalog.
  usage:
    - >
      Users prefix supported clients or agents with `pay`, such as `pay curl`, so a 402
      response can trigger payment preparation, local approval, signing, and an
      authenticated retry.
    - >
      Official guidance recommends sandbox mode for examples, making the smallest useful
      paid request first, checking pricing, and retaining local user authorization for
      real payments.
    - >
      Account metadata resides in `~/.config/pay/accounts.yml`; private keys are kept in
      supported secure stores rather than in that YAML file.
category: networking
package-manager:
  brew: pay
  winget: pay-skill.pay
package-manager-url: https://formulae.brew.sh/formula/pay
license: MIT
tags:
  - cli
  - http-client
  - payments
  - solana
  - x402
description: HTTP client that automatically handles 402 Payment Required
executables:
  - pay
provenance:
  formula: pay
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
