id: brew:pdsh
display-name: pdsh
homepage: https://github.com/chaos/pdsh
repo: https://github.com/chaos/pdsh
docs:
  - https://github.com/chaos/pdsh#readme
config-file-location:
  unix:
    - ~/.dsh/group/<groupname>
    - /etc/dsh/group/<groupname>
    - /etc/netgroup
credentials-file-location: null
history:
  adoption-history:
    - >
      pdsh is packaged across Homebrew, Debian, Ubuntu, Fedora-family systems, openSUSE,
      Alpine, MacPorts, and Nix, reflecting its longstanding role in Unix and HPC
      administration.
  package-nerd-significance:
    - >
      pdsh is a classic cluster-administration package: a small Unix command suite whose
      usefulness comes from pluggable remote-shell and host-selection modules rather
      than a centralized agent.
    - >
      Its packaging exposes optional integrations such as SSH, genders, Slurm, Torque,
      netgroups, and dsh-style groups, making build configuration unusually important to
      package maintainers.
  project-history:
    - >
      pdsh was developed as a multithreaded remote-shell client for executing commands
      concurrently across many hosts. The source carries Lawrence Livermore and
      University of California notices and is now maintained in the official chaos
      GitHub organization.
    - >
      The project expanded beyond rsh through dynamically loadable modules for SSH and
      cluster-specific host-selection systems. Companion commands include pdcp and rpdcp
      for copying files and dshbak for consolidating parallel output.
  related-projects:
    - rsh and SSH provide remote transports used by pdsh modules.
    - >
      Slurm, Torque, genders, netgroups, and dsh groups can supply cluster or
      host-selection context.
  sources:
    - https://github.com/chaos/pdsh
    - https://github.com/chaos/pdsh/blob/master/NEWS
    - https://github.com/chaos/pdsh/blob/master/README.modules
    - source_facts.package-manager
  summary:
    - >
      pdsh is a multithreaded parallel remote-shell suite for running commands and
      copying files across groups of Unix hosts.
  timeline:
    - >
      Early project era: Developed with Lawrence Livermore and University of California
      provenance.
    - >
      Later development: Added a modular architecture spanning remote-shell, scheduler,
      and host-selection integrations.
    - 'Current era: Maintained by the chaos organization on GitHub.'
  usage:
    - >
      Administrators use pdsh to run the same command concurrently on selected hosts,
      pdcp or rpdcp to distribute files, and dshbak to group or format returned output.
    - >
      Targets may be supplied directly or obtained from optional machines-file,
      dsh-group, genders, netgroup, Slurm, or Torque modules.
category: system
package-manager:
  apk: pdsh
  brew: pdsh
  debian: pdsh
  dnf: pdsh
  macports: pdsh
  nix: pdsh
  ubuntu: pdsh
  zypper: pdsh
package-manager-url: https://formulae.brew.sh/formula/pdsh
license: GPL-2.0-or-later
tags:
  - cli
  - cluster-management
  - parallel-shell
  - remote-execution
  - system-administration
description: Efficient rsh-like utility, for using hosts in parallel
executables:
  - dshbak
  - pdcp
  - pdsh
  - rpdcp
provenance:
  formula: pdsh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
