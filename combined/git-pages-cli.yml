id: brew:git-pages-cli
display-name: git-pages-cli
homepage: https://codeberg.org/git-pages/git-pages-cli
repo: https://codeberg.org/git-pages/git-pages-cli
docs:
  - https://git-pages.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-pages-cli grew inside the Forgejo and Codeberg-oriented ecosystem rather than
      the GitHub-centered Git extension ecosystem. The README documents binary releases,
      source installation with Go, container images hosted on Codeberg, package-manager
      availability, and a separate Forgejo Action for CI workflows.
  package-nerd-significance:
    - >
      The package is notable because it packages an open static-site publishing workflow
      around Git forges, DNS-based authorization, Forgejo tokens, and simple
      command-line deployment. It also shows how newer Codeberg projects distribute
      software through releases, containers, Go install paths, Homebrew, and Nix.
  project-history:
    - >
      The broader git-pages server repository was created on Codeberg in 2025, and the
      git-pages-cli repository followed on 2025-11-16. The CLI's release stream began
      soon after, with Codeberg release entries through the 1.x series during 2025 and
      2026.
  related-projects:
    - git-pages
    - Forgejo Actions
    - Codeberg container packages
  sources:
    - https://codeberg.org/git-pages/git-pages
    - https://codeberg.org/git-pages/git-pages-cli
    - https://codeberg.org/git-pages/git-pages-cli/raw/branch/main/README.md
    - https://formulae.brew.sh/formula/git-pages-cli
    - https://git-pages.org/
  summary:
    - >
      git-pages-cli is the command-line publishing client for git-pages, a
      Codeberg-hosted static site server for Git forges. The CLI uploads Git
      repositories or local directories to a git-pages server, manages DNS challenge
      material, and deletes or checks sites.
  timeline:
    - '2025: git-pages server repository was created on Codeberg.'
    - '2025: git-pages-cli repository was created on Codeberg.'
    - '2025: v1.2.1 and v1.3.0 releases appeared during early CLI iteration.'
    - >
      2026: 1.x releases continued with package-manager and container installation paths
      documented.
  usage:
    - >
      Practitioners use the CLI to prove domain control with DNS challenge records,
      upload a public Git repository, upload a local directory, remove a site, run
      authorization-only dry runs, choose a server host when TLS bootstrapping requires
      it, and create time-limited sites when the server allows expiration.
related-packages:
  - id: brew:git-pages
    reason: >
      Install the companion git-pages server when you need to operate the hosting
      endpoint to which git-pages-cli publishes sites.
    rel: adjacent_workflow
    sources:
      - https://git-pages.org/
      - https://git-pages.org/running-a-server/
      - https://codeberg.org/git-pages/git-pages-cli
category: developer-tools
package-manager:
  brew: git-pages-cli
  nix: git-pages-cli
package-manager-url: https://formulae.brew.sh/formula/git-pages-cli
license: 0BSD
tags:
  - cli
  - codeberg
  - forgejo
  - git-pages
  - static-site-deployment
description: Tool for publishing a site to a git-pages server
executables:
  - git-pages-cli
provenance:
  formula: git-pages-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
