id: brew:lunchy-go
display-name: lunchy-go
homepage: https://github.com/sosedoff/lunchy-go
repo: https://github.com/sosedoff/lunchy-go
docs:
  - https://github.com/sosedoff/lunchy-go#readme
config-file-location:
  macos: .lunchy
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata shows Homebrew distribution, while the README
      documents a Homebrew install, binary releases on GitHub, a curl installer, and
      building from source with Go. That positions lunchy-go as a small macOS operations
      convenience package rather than a cross-platform service manager.
  package-nerd-significance:
    - >
      lunchy-go matters to package nerds because many local developer services on macOS
      are represented by launchd plists installed by package managers. A tiny Go wrapper
      gives those plists a memorable service-style interface without requiring a larger
      supervisor.
  project-history:
    - >
      The public repository was created in 2013 by Dan Sosedoff. It recasts Lunchy's
      launch agent workflow as a Go binary named `lunchy`, keeping the same
      developer-facing goal of hiding exact plist filenames and verbose `launchctl`
      syntax behind short commands.
    - >
      The port adds profile support: a project-root `.lunchy` file can list services
      that should be started, stopped, or restarted together when switching between
      projects.
  related-projects:
    - The original Lunchy Ruby gem is the direct upstream inspiration.
    - `launchctl` and launchd are the macOS system facilities lunchy-go wraps.
    - Homebrew plists are a documented usage target for scan and service-management workflows.
  sources:
    - https://api.github.com/repos/sosedoff/lunchy-go
    - https://github.com/sosedoff/lunchy-go#readme
    - source_facts.package-manager
  summary:
    - >
      lunchy-go is a Go port of the original Lunchy idea: a friendlier command-line
      wrapper around macOS `launchctl`. Its README explicitly calls it a port of Mike
      Perham's original Ruby gem, with extra functionality.
  timeline:
    - '2013: sosedoff/lunchy-go repository created.'
    - >
      2013-2015: README license notice attributes the project to Dan Sosedoff during
      this period.
    - '2022: Repository metadata shows later maintenance activity.'
  usage:
    - >
      Users run `lunchy start redis`, `lunchy stop redis`, `lunchy restart redis`, or
      `lunchy status redis` instead of invoking `launchctl` with a full plist path.
      Patterns are substrings matched against launch agent plist filenames.
    - >
      The README also documents installing plists, showing and editing matched plists,
      scanning Homebrew Cellar directories, and using `.lunchy` profiles to manage
      multiple services for a project.
related-packages:
  - id: brew:lunchy
    reason: >
      Choose the original lunchy when you prefer its established Ruby implementation and
      only need the core friendly wrapper around launchctl.
    rel: alternative
    sources:
      - https://github.com/sosedoff/lunchy-go#readme
      - https://github.com/eddiezane/lunchy#readme
category: system
