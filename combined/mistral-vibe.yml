id: brew:mistral-vibe
display-name: Mistral Vibe
homepage: https://github.com/mistralai/mistral-vibe
repo: https://github.com/mistralai/mistral-vibe
docs:
  - https://docs.mistral.ai/getting-started/quickstarts/vibe
  - https://docs.mistral.ai/mistral-vibe/overview
config-file-location:
  unix: ~/.vibe/config.toml
credentials-file-location:
  unix: ~/.vibe/.env
history:
  sources:
    - https://formulae.brew.sh/formula/mistral-vibe
    - https://github.com/mistralai/mistral-vibe
    - https://mistral.ai/news/devstral-2-vibe-cli/
  summary:
    - >
      Mistral Vibe is Mistral AI's open-source command-line coding assistant. Mistral
      introduced it in its Devstral 2 announcement as a CLI agent powered by Devstral,
      released under the Apache 2.0 license, and designed to explore, modify, and
      execute codebase changes from natural-language instructions in a terminal or
      through the Agent Communication Protocol.
  usage:
    - >
      The project repository describes Vibe as a conversational interface over a local
      codebase, with tools for file manipulation, search, version-control awareness, and
      shell command execution. Its package-manager role is the AI coding-agent slot:
      Homebrew exposes the `vibe` and `vibe-acp` executables, while the upstream README
      also documents uv and pip installation paths and notes that Unix environments are
      the supported target.
related-packages: []
category: ai
package-manager:
  brew: mistral-vibe
  nix: mistral-vibe
  winget: Thewh1teagle.vibe
  zypper: mistral-vibe
package-manager-url: https://formulae.brew.sh/formula/mistral-vibe
license: Apache-2.0
tags:
  - ai
  - cli
  - coding-agent
  - developer-tools
  - mistral
description: Minimal CLI coding agent
executables:
  - vibe
  - vibe-acp
provenance:
  formula: mistral-vibe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
