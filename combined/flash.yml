id: brew:flash
display-name: flash
homepage: https://github.com/hypriot/flash
repo: https://github.com/hypriot/flash
docs:
  - https://github.com/hypriot/flash#readme
config-file-location:
  unix:
    - /boot/config.txt
    - /boot/device-init.yaml
    - /boot/user-data
    - /boot/meta-data
credentials-file-location: null
history:
  adoption-history:
    - >
      flash grew with HypriotOS and Raspberry Pi image workflows: the README example
      flashes a Hypriot image release, and later releases added boot configuration
      support. Homebrew packages the tool for macOS users, matching the README's macOS
      and Linux support statement.
  package-nerd-significance:
    - >
      flash is package-nerd significant because it turns a destructive dd-style workflow
      into a portable packaged command with guard rails and conventions for tiny-board
      operating-system images.
  project-history:
    - >
      The repository history starts in March 2015, and the first GitHub release was
      described as the first version on Mac. The README positions the tool as a wrapper
      around the risky SD-card flashing workflow, adding image download, device
      detection, progress display, boot-partition customization, and card ejection.
  related-projects:
    - >
      The README connects flash to HypriotOS image releases, Raspberry Pi boot
      configuration, and cloud-init.
  sources:
    - https://formulae.brew.sh/formula/flash
    - https://github.com/hypriot/flash
    - https://github.com/hypriot/flash/releases
    - https://raw.githubusercontent.com/hypriot/flash/master/README.md
  summary:
    - >
      flash is a shell-based command-line tool from the Hypriot ecosystem for writing SD
      card images. Its README emphasizes Raspberry Pi workflows and optional first-boot
      customization such as hostnames, Wi-Fi settings, cloud-init data, and boot
      partition files.
  timeline:
    - '2015: Initial commit and v0.1.0 first Mac release.'
    - '2015: 0.2.0 release adds config.txt support.'
    - '2018: 2.0.0 release appears in the official release history.'
    - '2021: 2.7.2 release is documented as the install target in the README.'
  usage:
    - >
      Typical use is to run flash with a local or remote image, insert an SD card,
      confirm the target device, and let the tool write and eject the card. Options copy
      cloud-init user-data and meta-data to /boot, copy Raspberry Pi config.txt, copy
      device-init.yaml for older HypriotOS images, set hostnames or Wi-Fi, and force
      automation with an explicit device.
related-packages:
  - id: cask:raspberry-pi-imager
    reason: >
      Choose Raspberry Pi Imager for Raspberry Pi's maintained graphical wizard,
      official OS catalogue, checksum handling, and integrated first-boot customization;
      choose flash for a compact shell-oriented workflow.
    rel: alternative
    sources:
      - https://github.com/hypriot/flash#readme
      - https://www.raspberrypi.com/software/
      - https://www.raspberrypi.com/documentation/computers/getting-started.html
category: system
package-manager:
  brew: flash
  debian: flash
  macports: flash
  ubuntu: flash
  winget: the-sz.FlashBuilder
package-manager-url: https://formulae.brew.sh/formula/flash
license: MIT
tags:
  - cli
  - cloud-init
  - disk-image
  - flashing
  - raspberry-pi
  - sd-card
description: Command-line script to flash SD card images of any kind
executables:
  - flash
provenance:
  formula: flash
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
