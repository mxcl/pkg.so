id: brew:dbus-glib
display-name: D-Bus GLib bindings
homepage: https://wiki.freedesktop.org/www/Software/DBusBindings/
repo: https://gitlab.freedesktop.org/dbus/dbus-glib
docs:
  - https://dbus.freedesktop.org/doc/dbus-glib
  - https://www.freedesktop.org/wiki/Software/DBusBindings
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dbus-glib became legacy infrastructure after GLib 2.26 introduced GDBus in GIO.
      The official reference manual now warns that dbus-glib is deprecated for new code
      and says D-Bus maintainers recommend GDBus instead.
  package-nerd-significance:
    - >
      It is a classic compatibility package: small, unglamorous, and still important
      because old desktop components may depend on the GLib binding even though the
      modern stack has moved on.
  project-history:
    - >
      The package represents the early GLib-facing API for applications that wanted
      D-Bus integration through GObject-style types and proxies. Its reference manual
      documents both the library API and dbus-binding-tool, the C-language GLib binding
      generation utility.
  related-projects:
    - >
      Related D-Bus GLib-era and successor projects include D-Bus, libdbus, GDBus,
      QtDBus, sd-bus, and the wider set of D-Bus language bindings listed by
      freedesktop.org.
  sources:
    - https://dbus.freedesktop.org/doc/dbus-glib/
    - https://www.freedesktop.org/wiki/Software/DBusBindings/
  summary:
    - >
      dbus-glib is the older GLib binding layer for D-Bus, distributed with the
      dbus-binding-tool code generator and documented as the D-Bus GLib bindings
      reference manual.
  timeline:
    - '0.104: Official reference manual documents the dbus-glib API and dbus-binding-tool.'
    - >
      GLib 2.26: GDBus becomes part of GLib's GIO library and supersedes dbus-glib for
      new GLib applications.
  usage:
    - >
      Today the package is mainly installed for older GLib applications or source trees
      that still use dbus-glib APIs or generated bindings. New GLib code is expected to
      use GDBus, while dbus-glib remains useful when building historical desktop
      software.
related-packages:
  - id: brew:glib
    reason: >
      Choose GLib's GDBus API for new GLib applications because the D-Bus maintainers
      explicitly recommend it in place of deprecated dbus-glib.
    rel: alternative
    sources:
      - https://dbus.freedesktop.org/doc/dbus-glib/ch01.html
      - https://docs.gtk.org/gio/class.DBusConnection.html
  - id: brew:dbus
    reason: >
      D-Bus supplies the protocol, reference daemon, and low-level messaging
      infrastructure with which legacy dbus-glib applications communicate.
    rel: adjacent_workflow
    sources:
      - https://dbus.freedesktop.org/doc/dbus-glib/ch01.html
      - https://dbus.freedesktop.org/doc/dbus-daemon.1.html
category: system
package-manager:
  apk: dbus-glib
  brew: dbus-glib
  debian: libdbus-glib-1-2
  dnf: dbus-glib
  macports: dbus-glib
  nix: dbus-glib
  pacman: dbus-glib
  ubuntu: libdbus-glib-1-2
package-manager-url: https://formulae.brew.sh/formula/dbus-glib
license: GPL-2.0-or-later AND (AFL-2.1 OR GPL-2.0-or-later)
tags:
  - bindings
  - cli
  - dbus
  - glib
  - ipc
  - library
description: GLib bindings for the D-Bus message bus system
executables:
  - dbus-binding-tool
provenance:
  formula: dbus-glib
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
