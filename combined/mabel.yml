id: brew:mabel
display-name: mabel
homepage: https://github.com/smmr-software/mabel
repo: https://github.com/smmr-software/mabel
docs:
  - https://github.com/smmr-software/mabel#readme
config-file-location:
  unix: $XDG_CONFIG_HOME/mabel/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Mabel is a niche terminal client rather than a mainstream BitTorrent engine, but
      it has visible package-manager adoption: the supplied facts list Homebrew and
      MacPorts, and the upstream README documents both `go install` and Homebrew
      installation.
    - >
      The repository has hundreds of GitHub stars, which is meaningful for a small TUI
      torrent client aimed at users who prefer keyboard-driven terminal workflows.
  package-nerd-significance:
    - >
      Mabel is package-nerd interesting as a modern Go TUI application that packages a
      BitTorrent engine and terminal UI as a single command with optional desktop
      integration.
    - >
      Its XDG config/state behavior and Homebrew install path make it a cleaner fit for
      package managers than ad hoc terminal torrent scripts.
  project-history:
    - >
      The repository was created in 2021, and the first tagged public release, v0.1.0,
      was published in June 2022. The README says the name comes from the Hebrew word
      for flood or deluge, loosely tied to torrenting.
    - >
      Early releases added pieces expected of a terminal client: encrypted-peer
      requirements, configurable key bindings, kebab-case config keys, HTTP(S)
      `.torrent` support, a desktop file, and a borderless option.
  related-projects:
    - The upstream README credits charmbracelet/bubbletea for terminal UI work.
    - The upstream README credits anacrolix/torrent for BitTorrent functionality.
    - Homebrew and MacPorts package Mabel according to the supplied package-manager facts.
  sources:
    - https://api.github.com/repos/smmr-software/mabel
    - https://github.com/smmr-software/mabel
    - https://github.com/smmr-software/mabel/blob/main/config.go
    - https://github.com/smmr-software/mabel/releases
    - source_facts.package-manager
  summary:
    - >
      Mabel is a terminal BitTorrent client with full and mini TUI modes, built on Go
      terminal-interface and torrent libraries.
  timeline:
    - '2021: Public GitHub repository created'
    - '2022: v0.1.0 initial release'
    - '2022: v0.1.2 added required encrypted-peer support'
    - '2022: v0.1.5 added HTTP(S) `.torrent` support and a desktop file'
    - '2023: v0.1.7 updated dependencies'
  usage:
    - >
      Users run `mabel [OPTIONS] [TORRENT]...`. With no arguments it opens the full TUI;
      with one infohash, magnet link, or `.torrent` file it opens mini mode; with
      multiple torrents it opens the full client with those torrents added.
    - >
      The README documents TOML configuration at `$XDG_CONFIG_HOME/mabel/config.toml`,
      including download directory, port, logging, encryption behavior, theme choices,
      and key remapping.
related-packages:
  - id: brew:aria2
    reason: >
      Choose aria2 when you need a scriptable command-line downloader that handles
      BitTorrent alongside HTTP, FTP, SFTP, and Metalink instead of Mabel's interactive
      TUI.
    rel: alternative
    sources:
      - https://github.com/smmr-software/mabel#readme
      - https://github.com/aria2/aria2/blob/master/doc/manual-src/en/aria2c.rst
  - id: cask:transmission
    reason: >
      Choose Transmission when you prefer a polished native desktop BitTorrent client
      and web interface over Mabel's terminal-focused interaction.
    rel: alternative
    sources:
      - https://github.com/smmr-software/mabel#readme
      - https://transmissionbt.com/
category: networking
package-manager:
  brew: mabel
  macports: mabel
package-manager-url: https://formulae.brew.sh/formula/mabel
license: GPL-3.0-or-later
tags:
  - bittorrent
  - cli
  - networking
  - terminal
  - tui
description: Fancy BitTorrent client for the terminal
executables:
  - mabel
provenance:
  formula: mabel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
