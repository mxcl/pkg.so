config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project has been packaged by Unix-like distributions because system-stat APIs
      vary by operating system. The official site lists tested support across FreeBSD,
      Linux, NetBSD, OpenBSD, Solaris, DragonFly BSD, HP-UX, and AIX.
  package-nerd-significance:
    - >
      libstatgrab is a modest but useful portability layer: the package is less famous
      than modern observability stacks, but it represents the classic Unix packaging
      problem of normalizing non-standard kernel statistics across many systems.
  project-history:
    - >
      The libstatgrab site describes the project as a cross-platform library for
      accessing system statistics and documents the included saidar and statgrab tools.
      GitHub release metadata preserves early release names back to libstatgrab 0.1 on
      February 19, 2003.
  related-projects:
    - saidar and statgrab are bundled command-line tools.
    - >
      MRTG is referenced by the project as an output target for generated monitoring
      configuration.
    - >
      pystatgrab and other language bindings expose the same system-stat library to
      non-C callers.
  sources:
    - https://api.github.com/repos/libstatgrab/libstatgrab/releases?per_page=100
    - https://github.com/libstatgrab/libstatgrab
    - https://libstatgrab.org/
    - https://libstatgrab.org/docs/statgrab.3.html
  summary:
    - >
      libstatgrab is a C library and tool set for cross-platform system statistics. It
      provides a portable interface for CPU, memory, disk, process, network, and I/O
      counters, with companion tools such as saidar and statgrab.
  timeline:
    - '2003-02-19: Release metadata records libstatgrab 0.1.'
    - '2003-08-25: Release metadata records libstatgrab 0.5.'
    - >
      2021-07-27: The project site records libstatgrab 0.92.1 with API and ABI
      compatibility with 0.92.
  usage:
    - >
      Developers use the C API when they want portable system counters, while script
      authors and operators can use statgrab's sysctl-style output or saidar's curses
      display. The package also includes MRTG configuration helpers.
