id: brew:dosbox-staging
display-name: DOSBox Staging
homepage: https://dosbox-staging.github.io/
repo: https://github.com/dosbox-staging/dosbox-staging
docs:
  - https://www.dosbox-staging.org/preview/dev/0.83/manual
  - https://www.dosbox-staging.org/getting-started
config-file-location:
  linux: ~/.config/dosbox/dosbox-staging.conf
  macos: ~/Library/Preferences/DOSBox/dosbox-staging.conf
  windows: C:\Users\%USERNAME%\AppData\Local\DOSBox\dosbox-staging.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption has been driven by retro-computing users who want DOSBox compatibility
      with more active maintenance and cross-platform packaging. The project publishes
      stable builds for Windows, macOS, and Linux on its own website, and Homebrew
      source facts list packages in apk, Homebrew, Fedora, MacPorts, Nix, Scoop, and
      winget.
    - >
      The project also serves migrations from other DOSBox variants: its README directs
      first-time users and people migrating from other DOSBox variants to the
      getting-started guide.
  package-nerd-significance:
    - >
      DOSBox Staging matters to package nerds because it is a soft fork that tries to
      make a beloved emulator easier to ship today. It is less about novelty than about
      maintainable builds, reproducible packaging, and keeping an important retro-gaming
      tool alive on current platforms.
    - >
      The repo's imported SVN, fork, and Vogons patch branches are unusually explicit
      preservation infrastructure, useful for people tracking how DOSBox variants
      evolved and where old community patches came from.
  project-history:
    - >
      The project presents itself as a mostly drop-in replacement for older DOSBox
      versions, with existing configurations expected to keep working while users gain
      newer features. Its README also documents a deliberate preservation role: upstream
      DOSBox SVN commits, abandoned fork code, and community patches from Vogons are
      imported into named branches for reference and maintenance.
    - >
      DOSBox Staging's public release history on GitHub begins with pre-release
      artifacts in late 2019 and a 0.75.0 release in May 2020. Since then the project
      has continued on a regular release cadence while adopting contemporary C++
      development infrastructure such as CMake, vcpkg, CI, static analysis, dynamic
      analysis, clang-format, and unit tests.
  related-projects:
    - >
      DOSBox Staging is related to upstream DOSBox, DOSBox SVN, abandoned DOSBox forks
      imported into its repository, Vogons community patches, and optional ecosystem
      pieces such as dosbox-staging-ext for dynamically loaded dependencies.
  sources:
    - https://github.com/dosbox-staging/dosbox-staging
    - https://www.dosbox-staging.org/about/
    - https://www.dosbox-staging.org/getting-started/
    - https://api.github.com/repos/dosbox-staging/dosbox-staging/releases?per_page=100
    - https://formulae.brew.sh/formula/dosbox-staging
  summary:
    - >
      DOSBox Staging is a modern continuation of DOSBox focused on keeping classic DOS
      games and applications easy to run while updating the codebase, build tooling,
      documentation, audio/video behavior, and release practices.
  timeline:
    - '2019: Public pre-release artifacts appear for version 0.75.0-pre.'
    - '2020: Version 0.75.0 is released on GitHub.'
    - >
      2020s: The project publishes stable builds for Windows, macOS, and Linux and keeps
      development builds for main-branch commits.
    - >
      2026: The project is preparing the 0.83/0.84 generation with release candidates
      and alpha releases.
  usage:
    - >
      Users run dosbox-staging to launch DOS games and applications, mount directories
      or images, and use a DOSBox-style configuration file. Its appeal is compatibility
      with existing DOSBox workflows while shipping modern defaults and maintained
      packages.
    - >
      For packagers and contributors, DOSBox Staging is notable because it treats old
      emulator history as source material while maintaining a conventional modern
      open-source workflow: release builds, development builds, CI, tests, and
      documented dependencies.
related-packages:
  - id: brew:dosbox-x
    reason: >
      Choose DOSBox-X when broad DOS application, Windows 3.x/9x, PC-98, and highly
      configurable hardware emulation matter more than Staging's game-oriented defaults.
    rel: alternative
    sources:
      - https://www.dosbox-staging.org/about/
      - https://dosbox-x.com/about.html
  - id: cask:dosbox
    reason: >
      Choose original DOSBox when compatibility with the upstream emulator and its
      long-established manual and configuration model is the priority.
    rel: alternative
    sources:
      - https://www.dosbox-staging.org/about/
      - https://www.dosbox.com/DOSBoxManual.html
category: games
package-manager:
  apk: dosbox-staging
  brew: dosbox-staging
  dnf: dosbox-staging
  macports: dosbox-staging
  nix: dosbox-staging
  scoop: extras/dosbox-staging
  winget: DOSBoxStaging.DOSBoxStaging
package-manager-url: https://formulae.brew.sh/formula/dosbox-staging
license: GPL-2.0-or-later
tags:
  - cli
  - cross-platform
  - dos
  - emulator
  - games
  - retro-computing
description: Modernized DOSBox soft-fork
executables:
  - dosbox-staging
provenance:
  formula: dosbox-staging
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
