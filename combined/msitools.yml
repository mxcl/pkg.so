id: brew:msitools
display-name: msitools
homepage: https://wiki.gnome.org/msitools
repo: https://gitlab.gnome.org/GNOME/msitools
docs:
  - https://wiki.gnome.org/msitools
  - https://wiki.gnome.org/msitools/HowTo/CreateLibraryWxi
  - https://wiki.gnome.org/msitools/HowTo/CreateMSI
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The package's practical value is cross-platform packaging. Its small tools mirror
      the structure of MSI work: msiinfo inspects packages, msiextract extracts files,
      msidump dumps tables and streams, msidiff compares packages, and msibuild creates
      packages at a lower level. The suite also includes wixl, a WiX-like XML-to-MSI
      builder, and wixl-heat for generating XML fragments from file trees.
  sources:
    - https://formulae.brew.sh/formula/msitools
    - https://gitlab.gnome.org/GNOME/msitools
    - https://packages.debian.org/sid/utils/msitools
    - https://wiki.gnome.org/msitools
  summary:
    - >
      msitools is a GNOME-hosted toolkit for inspecting, extracting, comparing, and
      building Windows Installer MSI files on non-Windows systems. The GNOME wiki
      describes it as a set of programs based on libmsi, a portable library for reading
      and writing MSI files; libmsi itself is described there as a port of a subset of
      Wine's Windows Installer implementation.
  usage:
    - >
      In package-manager terms, msitools occupies the Unix side of Windows installer
      workflows: it lets Linux and macOS build systems examine or produce MSI artifacts
      without installing Microsoft's toolchain. Debian packages it as a Windows
      Installer manipulation tool and exposes related libmsi and wixl packages, matching
      the upstream split between the library and command-line tools.
related-packages:
  - id: brew:osslsigncode
    reason: >
      Use osslsigncode after building an MSI with msitools when the resulting Windows
      installer needs an Authenticode signature.
    rel: adjacent_workflow
    sources:
      - https://wiki.gnome.org/msitools/
      - https://github.com/mtrojnar/osslsigncode
