id: cask:blood-on-the-clocktower-online
display-name: Blood on the Clocktower Online
homepage: https://bloodontheclocktower.com/
repo: https://github.com/ThePandemoniumInstitute/botc-release
docs:
  - >
    https://bloodontheclocktower.com/pages/blood-on-the-clocktower-online-policy-terms-of-use
  - https://github.com/ThePandemoniumInstitute/botc-release#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official game site says online play surged during the coronavirus pandemic.
      The downloadable and browser-based official service subsequently became a
      maintained platform with user moderation rules, accounts, releases, custom
      scripts, and homebrew-character support.
  package-nerd-significance:
    - >
      The Homebrew cask provides a repeatable installation path for the official macOS
      desktop client. The public release repository is also useful to toolmakers because
      it publishes binaries, a script JSON schema, and approved reusable resources, even
      though it is primarily a release and documentation repository rather than the
      application's full source tree.
  project-history:
    - >
      Blood on the Clocktower Online is the official digital platform maintained by The
      Pandemonium Institute for playing the social-deduction game remotely. Official
      policy material documents both browser-based and downloadable forms of the
      service.
  related-projects:
    - >
      The physical Blood on the Clocktower game is the source ruleset and intellectual
      property.
    - The official Script Tool creates custom character lists.
    - >
      The release repository publishes a JSON schema and resources for compatible
      scripts and toolmaking.
  sources:
    - >
      https://bloodontheclocktower.com/pages/blood-on-the-clocktower-online-policy-terms-of-use
    - https://bloodontheclocktower.com/pages/digital-moderation-policy
    - https://bloodontheclocktower.com/pages/script-and-wiki-script
    - https://github.com/ThePandemoniumInstitute/botc-release
  summary:
    - >
      Blood on the Clocktower Online is The Pandemonium Institute's official browser and
      desktop platform for remote play of Blood on the Clocktower.
  timeline:
    - '2020: The official site reported a surge in online play during the coronavirus pandemic.'
    - "2022: The service's official privacy policy was issued."
    - '2023: The official online terms were last modified on 11 January 2023.'
    - '2026: The official release repository continued publishing desktop-client updates.'
  usage:
    - >
      Storytellers and players use the platform to host remote games, communicate during
      play, manage character selections, and use official or custom scripts. The
      official repository documents optional metadata and JSON structures for custom and
      homebrew content.
