id: brew:jp2a
display-name: jp2a
homepage: https://github.com/Talinx/jp2a
repo: https://github.com/Talinx/jp2a
docs:
  - https://github.com/Talinx/jp2a#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      jp2a has the adoption pattern of a long-lived Unix amusement utility: small C
      code, autotools build, libjpeg dependency, optional libcurl and ncurses features,
      and package-manager availability. The batch facts list Homebrew, Debian, Ubuntu,
      MacPorts, Nix, Arch, and openSUSE packages.
  package-nerd-significance:
    - >
      jp2a is a tiny artifact of terminal culture: not infrastructure, but exactly the
      sort of package people install to demonstrate that a shell can still be visual.
      Its longevity also shows how old SourceForge-era utilities survive through forks
      and packaging.
  project-history:
    - >
      Christian Stigen Larsen's original jp2a repository describes the program as a
      simple JPEG to ASCII converter, notes earlier SourceForge hosting, and gives a
      2006-2016 copyright range. The Talinx-maintained repository continues the project
      with packaging-oriented build instructions, Doxygen documentation support, Docker
      usage, and support for JPEG, PNG, and WebP inputs.
    - >
      The maintained release history shows incremental modernization rather than a
      redesign: truecolor and 256-color terminal output in v1.0.9, PNG and HTML Living
      Standard support in v1.1.0, edge shading in v1.2.0, and WebP plus Exif orientation
      handling in v1.3.0.
  related-projects:
    - Letterpress is documented by the maintained README as a graphical interface for jp2a.
    - >
      The original cslarsen/jp2a repository is the historical upstream; the Talinx
      repository is the maintained package source used by Homebrew.
    - jp2a depends on image libraries such as jpeglib or libjpeg-turbo, libpng, and libwebp.
  sources:
    - https://formulae.brew.sh/formula/jp2a
    - https://github.com/Talinx/jp2a
    - https://github.com/Talinx/jp2a#readme
    - https://github.com/Talinx/jp2a/releases
    - https://github.com/cslarsen/jp2a
  summary:
    - >
      jp2a is a JPEG-to-ASCII converter with the durable appeal of a classic terminal
      media toy: give it an image file or URL and it emits text, ANSI color, or
      HTML-style output. Later maintained releases broadened the input surface from JPEG
      to PNG and WebP.
  timeline:
    - '2006: Original copyright range for jp2a begins in the upstream README.'
    - '2016: Original repository README says the project had moved from SourceForge to GitHub.'
    - '2022: v1.0.9 added truecolor and 256-color terminal output.'
    - '2022: v1.1.0 added PNG image support and HTML Living Standard output support.'
    - '2023: v1.2.0 added edge shading.'
    - '2024: v1.3.0 added WebP input and Exif orientation support.'
    - '2025: v1.3.3 appeared in the maintained release line.'
  usage:
    - >
      Users run jp2a on image files or URLs to render ASCII art in terminals, web pages,
      or scripts. The maintained README documents ordinary configure/make builds, Docker
      execution, and optional network-image conversion through libcurl.
related-packages:
  - id: brew:chafa
    reason: >
      Choose Chafa when you need animated images, Sixel/Kitty/iTerm2 graphics, Unicode
      mosaics, broader format handling, or automatic terminal-capability detection;
      choose jp2a for a focused ASCII-conversion workflow.
    rel: alternative
    sources:
      - https://github.com/Talinx/jp2a#readme
      - https://hpjansson.org/chafa/
      - https://hpjansson.org/chafa/man/
category: media
