history:
  adoption-history:
    - >
      Tutti is distributed as a desktop application and through the Homebrew cask
      catalog. Its official project materials distinguish a local open-source edition
      from Tutti · VM, an early-access collaboration service for multiple people,
      devices, and agents.
  package-nerd-significance:
    - >
      Tutti represents the emerging package category of local agent workspaces: it sits
      around existing coding agents rather than replacing them, coordinates tools from
      multiple providers, and lets users reuse existing agent subscriptions. Its
      open-source desktop and local-first positioning make it relevant to users who
      prefer installable orchestration software over a single hosted agent interface.
  project-history:
    - >
      Tutti developed as a shared workspace for coordinating AI agents, applications,
      files, context, and task state. The project subsequently opened its desktop
      implementation under the Apache License 2.0 while retaining Tutti · VM as a
      distinct collaborative offering.
    - >
      The repository has grown into a desktop application backed by a local daemon and
      shared packages for connectors, events, workbench behavior, and device links.
      Official documentation treats the repository code, generated contracts, and
      maintained architecture documents as the sources of truth for implemented
      behavior.
  related-projects:
    - >
      The official README documents support for existing agents including Claude Code,
      Codex, and Hermes. These agents remain independent tools; Tutti provides the
      workspace and handoff layer around them.
  sources:
    - https://github.com/tutti-os/tutti#readme
    - https://github.com/tutti-os/tutti/blob/main/docs/README.md
    - https://github.com/tutti-os/tutti/blob/main/docs/architecture/project-structure.md
    - https://github.com/tutti-os/tutti/releases
    - source_facts.package-manager
  summary:
    - >
      Tutti is an open-source desktop workspace in which people and multiple AI agents
      can share context, files, application outputs, tasks, and running state. It is
      designed to reduce manual handoffs between coding agents and other AI-assisted
      applications.
  timeline:
    - >
      2026: The official project materials describe Tutti as open-source and publish
      maintained desktop release channels for macOS and Windows.
    - >
      2026: The repository documents a local daemon-centered architecture and separate
      local and Tutti · VM collaboration models.
  usage:
    - >
      Users open Tutti as a graphical workspace, connect supported agents using their
      existing subscriptions, and give those agents shared access to project context,
      files, application outputs, and tasks. Typical workflows hand work from one agent
      to another, reference previous conversations or generated assets, and assign
      goal-derived tasks without repeatedly copying context.
    - >
      Tutti · VM extends the model to rooms shared across people and devices. The
      official README notes that only material created inside an invited room is shared
      with its participants.
