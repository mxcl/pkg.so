id: brew:asroute
display-name: asroute
homepage: https://github.com/stevenpack/asroute
repo: https://github.com/stevenpack/asroute
docs:
  - https://github.com/stevenpack/asroute#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents Homebrew installation, and the supplied facts show
      Homebrew packaging. Its adoption history is that of a focused macOS-friendly
      network utility rather than a broad network-analysis suite.
  package-nerd-significance:
    - >
      asroute is package-nerd interesting because it is intentionally tiny: a Rust CLI
      wrapped for Homebrew that turns an existing system tool's verbose output into
      ASN-level path information.
    - >
      It is a good example of Homebrew acting as the main distribution mechanism for a
      focused personal utility.
  project-history:
    - >
      The official README describes asroute as a personal utility made to show the
      companies and networks carrying packets without reading every traceroute hop. It
      uses Team Cymru's Rust crate for ASN-to-AS-name lookup.
  related-projects:
    - >
      The README names Team Cymru's Rust crate for ASN lookup and points to lft as a
      richer related tracing tool.
  sources:
    - https://github.com/stevenpack/asroute#readme
    - source_facts.package-manager
  summary:
    - >
      asroute is a small Rust CLI for parsing traceroute -a output and summarizing the
      autonomous systems traversed by a network path.
  timeline:
    - '2020: GitHub release metadata lists asroute v0.1.0.'
    - >
      Current README: Documents Homebrew installation, traceroute -a piping, Team Cymru
      lookup support, and TODOs such as an internal traceroute mode.
  usage:
    - >
      The documented workflow is piping traceroute -a output into asroute, which emits a
      compact AS-name and country path.
    - >
      The README positions lft as the more feature-rich tool for serious network
      analysis, leaving asroute as a lightweight parser and display command.
related-packages:
  - id: brew:lft
    reason: >
      Choose LFT for feature-rich layer-four path analysis; asroute's author explicitly
      recommends it for serious network analysis while positioning asroute as a
      lightweight traceroute-output parser.
    rel: alternative
    sources:
      - https://github.com/stevenpack/asroute#readme
      - https://pwhois.org/lft/
category: networking
package-manager:
  brew: asroute
package-manager-url: https://formulae.brew.sh/formula/asroute
license: MIT
tags:
  - asn
  - cli
  - network-analysis
  - routing
  - rust
  - traceroute
description: CLI to interpret traceroute -a output to show AS names traversed
executables:
  - asroute
provenance:
  formula: asroute
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
