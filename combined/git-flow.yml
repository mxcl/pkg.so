id: brew:git-flow
display-name: git-flow
homepage: https://github.com/nvie/gitflow
repo: https://github.com/nvie/gitflow
docs:
  - https://github.com/nvie/gitflow#readme
config-file-location:
  unix: <repository>/.git/config
  windows: <repository>/.git/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The model became one of the most recognizable Git workflow patterns of the 2010s.
      Driessen's 2020 reflection says many software teams treated git-flow almost like a
      standard, while also cautioning that continuously delivered web applications often
      benefit from simpler workflows such as GitHub Flow. The original repository's
      README later thanked users for more than fifteen years of adoption and pointed to
      git-flow-next as the maintained successor.
  package-nerd-significance:
    - >
      git-flow is significant in package-manager culture because it turned a blog-post
      workflow into an installable Git extension. Its formulae and distro packages made
      `git flow` a standard command on developer machines, even as later teams debated
      whether the workflow fit CI/CD-heavy projects.
  project-history:
    - >
      Driessen published the branching model on January 5, 2010 and opened the gitflow
      repository later that month. The model organized release-oriented development
      around long-lived master and develop branches plus short-lived feature, release,
      and hotfix branches. The command package encoded that procedure as `git flow
      init`, `git flow feature`, `git flow release`, `git flow hotfix`, and related
      subcommands.
  related-projects:
    - >
      git-flow influenced git-flow-avh, git-flow-completion, Tower's Git-flow
      integration, and git-flow-next.
  sources:
    - https://git-flow.sh/blog/posts/how-git-flow-next-improves-upon-git-flow-avh/
    - https://github.com/bobthecow/git-flow-completion
    - https://github.com/nvie/gitflow
    - https://github.com/nvie/gitflow#readme
    - https://nvie.com/posts/a-successful-git-branching-model/
  summary:
    - >
      git-flow is the original command-line extension package for Vincent Driessen's Git
      branching model, providing high-level commands for feature, release, hotfix, and
      support branches.
  timeline:
    - '2010: Driessen published the successful Git branching model.'
    - '2010: The gitflow repository began and early 0.x releases followed.'
    - >
      2020: Driessen added a reflection warning against dogmatic use for
      continuous-delivery web applications.
    - '2025: The original repository marked git-flow-next as the maintained successor.'
  usage:
    - >
      Practitioners used git-flow to initialize branch naming conventions, start feature
      branches from develop, finish them back into develop, prepare release branches,
      and apply urgent fixes from master through hotfix branches. The CLI wrapped
      ordinary Git branch, merge, tag, publish, and pull operations into named
      release-management steps.
related-packages:
  - id: brew:git-flow-next
    reason: >
      git-flow-next is the original project's officially designated, actively maintained
      successor and preserves compatibility with existing git-flow repositories while
      adding configurable workflows and improved error handling.
    rel: alternative
    sources:
      - https://github.com/nvie/gitflow
      - https://github.com/gittower/git-flow-next
      - https://git-flow.sh/blog/posts/announcing-git-flow-next-1-0/
category: developer-tools
package-manager:
  apk: git-flow
  brew: git-flow
  debian: git-flow
  macports: git-flow
  ubuntu: git-flow
  winget: GitTower.GitFlowNext
package-manager-url: https://formulae.brew.sh/formula/git-flow
license: BSD-2-Clause
tags:
  - branching-model
  - cli
  - git
  - workflow
description: Extensions to follow Vincent Driessen's branching model
executables:
  - git-flow
provenance:
  formula: git-flow
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
