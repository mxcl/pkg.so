history:
  adoption-history:
    - >
      Nifty File Lists is part of publicspace.net's family of native Mac file-management
      tools. The publisher positions it for photographers, lawyers, archivists, IT
      departments, client handoffs, court or archive manifests, media catalogs, and
      spreadsheet-based inventories.
  package-nerd-significance:
    - >
      The application turns filesystem and embedded metadata into durable, interoperable
      outputs rather than locking results into a private catalog. CSV, TSV, JSON,
      Markdown, HTML, text, and PDF outputs make it a useful bridge between
      Finder-oriented workflows, spreadsheets, databases, scripts, audits, and archival
      records.
  project-history:
    - >
      Frank Reiff of publicspace.net released the first public beta of Nifty File Lists
      in January 2020 and the first full release in March 2020. Early releases
      progressively added EXIF, GPS, IPTC, ID3, Finder-tag, Spotlight, JSON, checksum,
      and Apple Silicon support.
    - >
      The product later developed from a general metadata table exporter into a tool for
      defensible file manifests, adding richer column handling, saved column
      arrangements, parent-folder fields, print-ready output, checksums, and PDF
      provenance information.
  related-projects:
    - >
      Nifty File Lists belongs to the same publicspace.net Mac utility family as A
      Better Finder Rename, A Better Finder Attributes, and Big Mean Folder Machine. It
      relies on macOS metadata facilities such as Spotlight and format-specific EXIF,
      IPTC, GPS, and ID3 data.
  sources:
    - https://www.publicspace.net/NiftyFileLists/
    - https://www.publicspace.net/NiftyFileLists/troubleshooting.html
    - https://www.publicspace.net/NiftyFileLists/version.html
  summary:
    - >
      Nifty File Lists is a native macOS utility by Frank Reiff and publicspace.net for
      turning folder contents and file metadata into tables, spreadsheets, printable
      lists, and provenance-bearing manifests.
  timeline:
    - '2020: The first public beta appeared in January.'
    - '2020: The first full release shipped in March.'
    - '2020: JSON export and native Apple Silicon support were added.'
    - '2021: SHA-family checksum columns were added.'
  usage:
    - >
      Add one or more source folders, choose and arrange metadata columns, select an
      output format, preview the results, and save or copy the generated list. Typical
      workflows include Excel-ready inventories, media metadata catalogs,
      client-delivery manifests, archival records, and checksum-backed transfer
      verification.
