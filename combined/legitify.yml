id: brew:legitify
display-name: legitify
homepage: https://legitify.dev/
repo: https://github.com/Legit-Labs/legitify
docs:
  - https://legitify.dev/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project was packaged as a standalone CLI, GitHub Action, Homebrew formula, Nix
      package, and GitHub CLI extension. That mix made it fit both one-off audits from a
      workstation and scheduled checks in CI for organizations managing many
      repositories, members, teams, runners, branch protections, and tokens.
  package-nerd-significance:
    - >
      Legitify is a package-nerd example of application-security posture management
      ideas escaping into a plain CLI. It packages policy checks and remediation hints
      as a tool that can live in local shells, CI jobs, and GitHub Actions, adjacent to
      linters and secret scanners.
  project-history:
    - >
      Legit Security announced Legitify on 2022-10-05 as an open-source GitHub
      configuration scanner for security, DevOps, and developer teams. The repository
      and project site later described the scope as source-code-management posture
      across GitHub and GitLab assets, with built-in policies and remediation-oriented
      output.
  related-projects:
    - >
      Related projects include the `gh-legitify` GitHub CLI extension, the Legitify
      GitHub Action, OpenSSF Scorecard, GitHub Advanced Security configuration checks,
      GitLab security scanners, and policy-as-code tools used for SCM governance.
  sources:
    - https://github.com/Legit-Labs/gh-legitify
    - https://github.com/Legit-Labs/legitify
    - https://github.com/Legit-Labs/legitify/issues
    - https://github.com/marketplace/actions/legitify-analyze
    - https://legitify.dev/
    - https://www.legitsecurity.com/blog/introducing-legitify
    - https://www.legitsecurity.com/legitify
  summary:
    - >
      Legitify is Legit Security's open-source CLI for finding and helping remediate
      security, compliance, and misconfiguration risks across GitHub and GitLab assets.
  timeline:
    - '2022-07-26: The GitHub issue tracker showed early public project activity.'
    - '2022-10-05: Legit Security published the introductory Legitify announcement.'
    - '2023-01-19: Public issues tracked expansion into third-party application policies.'
    - '2023-02-06: Public issues tracked auto-remediation work.'
  usage:
    - >
      Typical usage is to authenticate to GitHub or GitLab, run `legitify analyze`, and
      review policy findings against repositories, organizations, runners, webhooks,
      actions, branch protection, and other SCM resources. Its Homebrew packaging
      matters because security teams can hand developers a familiar install path instead
      of a vendor-only SaaS workflow.
related-packages:
  - id: brew:gh
    reason: >
      GitHub CLI is the documented host for the official `gh-legitify` extension,
      allowing Legitify audits to run as `gh legitify`.
    rel: adjacent_workflow
    sources:
      - https://github.com/Legit-Labs/legitify
      - https://github.com/Legit-Labs/gh-legitify
      - https://cli.github.com/manual/gh_extension
  - id: brew:scorecard
    reason: >
      The official `gh-legitify` extension can run OpenSSF Scorecard during analysis,
      combining Legitify's SCM configuration policies with Scorecard's repository
      security-health checks.
    rel: adjacent_workflow
    sources:
      - https://github.com/Legit-Labs/gh-legitify
      - https://github.com/ossf/scorecard
category: security
package-manager:
  brew: legitify
  nix: legitify
package-manager-url: https://formulae.brew.sh/formula/legitify
license: Apache-2.0
tags:
  - cli
  - github
  - gitlab
  - misconfiguration
  - security
description: Tool to detect/remediate misconfig and security risks of GitHub/GitLab assets
executables:
  - legitify
provenance:
  formula: legitify
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
