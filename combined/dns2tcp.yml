id: brew:dns2tcp
display-name: dns2tcp
homepage: https://packages.debian.org/sid/dns2tcp
repo: https://github.com/alex-sector/dns2tcp
docs:
  - https://github.com/alex-sector/dns2tcp
config-file-location:
  unix:
    - ~/.dns2tcprc
    - ~/.dns2tcpdrc
credentials-file-location:
  unix:
    - ~/.dns2tcprc
    - ~/.dns2tcpdrc
history:
  adoption-history:
    - >
      dns2tcp stayed visible because it solves one very specific network problem with
      small C tools: a client, a server, and simple resource mappings. Distribution
      packaging kept it available for administrators and security testers who need a
      TCP-over-DNS tunnel without a broader VPN stack.
  package-nerd-significance:
    - >
      Package nerds care about dns2tcp because it is a classic small-network-tool
      package: narrow, risky if misunderstood, but valuable in labs and
      incident-response toolboxes because it demonstrates TCP-over-DNS behavior with
      minimal moving parts.
  project-history:
    - >
      The upstream ChangeLog marks version 0.3 as the public release and records later
      fixes for 64-bit architectures, DNS decoding, privilege dropping, client
      authentication, and Windows client support. The README is explicit that DNS
      encapsulation is not encrypted and should be treated as an insecure transport.
  related-projects:
    - >
      iodine is a related DNS-tunneling project focused on IP-over-DNS rather than
      TCP-over-DNS.
    - ssh ProxyCommand workflows are a common adjacent use case for dns2tcpc.
  sources:
    - https://github.com/alex-sector/dns2tcp
    - https://raw.githubusercontent.com/alex-sector/dns2tcp/master/README
    - https://raw.githubusercontent.com/alex-sector/dns2tcp/master/ChangeLog
    - https://packages.debian.org/stable/net/dns2tcp
  summary:
    - >
      dns2tcp is a client/server tool for relaying TCP connections over DNS. It belongs
      to the older family of DNS-tunneling utilities used for constrained networks,
      demonstrations, and security testing rather than general-purpose VPN service.
  timeline:
    - '0.3: Public release.'
    - '0.4: 64-bit architectures start working.'
    - '0.5: Client authentication, Windows client support, and proxy-style use are added.'
    - '0.5.2: OpenSSL includes are removed after earlier library cleanup.'
  usage:
    - >
      The README shows using dns2tcpc to list available remote resources, bind a local
      port to a remote service, or run from ~/.dns2tcprc. Server use centers on
      ~/.dns2tcpdrc, where the operator defines the DNS domain, key, and named resources
      such as ssh or smtp targets.
related-packages:
  - id: brew:iodine
    reason: >
      Choose iodine when you need an IP-level tunnel with a TUN/TAP interface and
      routing support; choose dns2tcp when you only need selected TCP services exposed
      as named tunnel resources without requiring root on the client.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/alex-sector/dns2tcp/master/README
      - https://code.kryo.se/iodine/README.html
category: networking
package-manager:
  brew: dns2tcp
  debian: dns2tcp
  macports: dns2tcp
  nix: dns2tcp
  ubuntu: dns2tcp
package-manager-url: https://formulae.brew.sh/formula/dns2tcp
license: GPL-2.0-or-later
tags:
  - cli
  - dns
  - networking
  - tcp
  - tunnel
description: TCP over DNS tunnel
executables:
  - dns2tcpc
  - dns2tcpd
provenance:
  formula: dns2tcp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
