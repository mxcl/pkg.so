id: brew:conserver
display-name: Conserver
homepage: https://www.conserver.com/
repo: https://github.com/bstansell/conserver
docs:
  - https://conserver.com/docs/conserver.man.html
  - https://conserver.com/
config-file-location:
  unix:
    - /etc/conserver.cf
    - /etc/console.cf
    - ~/.consolerc
credentials-file-location:
  unix: /etc/conserver.passwd
history:
  adoption-history:
    - >
      Conserver's adoption is tied to data-center operations rather than consumer CLI
      fashion. The official site emphasizes reviewing crashes, tracking console changes,
      feeding console logs into monitoring, mentoring during live work, and reaching
      equipment remotely.
    - >
      Input package metadata lists Conserver across Homebrew, apk, Debian/Ubuntu client
      packages, Fedora/dnf, Nix, and other distributions, which fits its role as durable
      sysadmin infrastructure.
  package-nerd-significance:
    - >
      Conserver is package-nerd archaeology that still earns its keep. It packages a
      very specific operational workflow: serial-console multiplexing and logging for
      machines that may be unreachable by SSH or normal network services.
    - >
      Its CHANGES file is also a history of portability work: Solaris, BSD, Linux,
      Cygwin, IPv6, OpenSSL, GSS-API, FreeBSD CI, autoconf updates, and downstream
      packaging fixes appear across decades.
  project-history:
    - >
      The official site defines Conserver as an application that lets multiple users
      watch a serial console at the same time, log traffic, grant one writer at a time,
      and access equipment over the network. The conserver(8) manual describes the
      daemon, console client, logging, access control, authentication, and multi-server
      redirection model.
    - >
      The CHANGES file shows a long pre-GitHub lineage. It notes many poorly tracked
      variations before version 6.05, a public web page by version 6.10 in January 1999,
      GNU configure-based packaging in version 7.0.0 in February 2001, and continued
      maintenance through version 8.3.0 in February 2026.
  related-projects:
    - >
      Terminal servers, serial consoles, IPMI serial-over-LAN, OpenSSL, tcp-wrappers,
      PAM, and GSS-API are adjacent operational technologies documented in the manual
      and CHANGES file.
  sources:
    - https://conserver.com/
    - https://conserver.com/docs/conserver.man.html
    - https://github.com/bstansell/conserver/blob/master/CHANGES
  summary:
    - >
      Conserver is a console-server daemon and client for shared serial-console access,
      logging, and remote operations. It belongs to the older system-administration
      world of terminal servers, crash consoles, out-of-band access, and forensic
      console logs.
  timeline:
    - 'Before 1999: CHANGES records many pre-6.05 variations with limited tracking.'
    - '1999: Version 6.10 notes that the web page was up and running.'
    - '2001: Version 7.0.0 introduces GNU configure-based packaging.'
    - '2018: Version 8.2.2 notes documentation adjustments after the move to GitHub.'
    - '2026: Version 8.3.0 is released with fixes and packaging/build updates.'
  usage:
    - >
      Operators run conserver as a daemon, configure consoles in conserver.cf,
      authenticate through conserver.passwd, and use the console client to attach,
      watch, take write access, replay logs, or coordinate with other users.
    - >
      The manual documents local serial ports, Unix domain sockets, TCP sockets for
      terminal servers, and external programs as console connection types.
related-packages:
  - id: brew:conman
    reason: >
      Choose ConMan when managing especially large console fleets or when built-in
      FreeIPMI Serial-over-LAN and parallel Expect support matter; Conserver emphasizes
      its mature shared-console client/server and access-control model.
    rel: alternative
    sources:
      - https://conserver.com/docs/conserver.man.html
      - https://github.com/dun/conman#readme
category: system
package-manager:
  apk: conserver
  brew: conserver
  debian: conserver-client
  dnf: conserver
  nix: conserver
  ubuntu: conserver-client
  zypper: gnome-console
package-manager-url: https://formulae.brew.sh/formula/conserver
license: BSD-3-Clause
tags:
  - cli
  - console-server
  - logging
  - remote-access
  - serial-console
  - system-administration
description: Allows multiple users to watch a serial console at the same time
executables:
  - conserver
  - console
provenance:
  formula: conserver
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
