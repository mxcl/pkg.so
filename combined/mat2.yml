id: brew:mat2
display-name: mat2
homepage: https://github.com/jvoisin/mat2
repo: https://github.com/jvoisin/mat2
docs:
  - https://github.com/jvoisin/mat2#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      mat2 reached a broader distribution footprint than many single-purpose privacy
      tools because metadata stripping is useful for activists, journalists, packagers,
      and privacy-conscious desktop users. The batch input records packaging across
      Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, and Nix.
    - >
      The README points GUI users to Metadata Cleaner, which uses mat2 underneath. That
      relationship helped mat2 serve both terminal workflows and desktop privacy tooling
      without making the CLI carry a full GUI itself.
  package-nerd-significance:
    - >
      mat2 matters in package collections because it wraps a lot of file-format-specific
      cleanup behavior behind one small CLI. Its optional dependencies such as ExifTool,
      FFmpeg, Poppler, librsvg, and GdkPixbuf also make it a good example of a privacy
      tool whose packaging quality depends on distro integration.
    - >
      For security-minded users, mat2 is a useful counterweight to the default behavior
      of office suites, cameras, and document exporters: it makes metadata review and
      removal scriptable.
  project-history:
    - >
      The README frames mat2 around a privacy threat model in which ordinary files
      disclose author names, companies, camera details, timestamps, and other metadata.
      It explicitly positions the tool as a successor to the first MAT project, thanks
      Google Summer of Code and Tails, and records Julien Voisin's 2018 copyright.
    - >
      The public release stream includes 0.2.0 in July 2018 and later 0.14.x releases.
      The README describes three surfaces: the `libmat2` library, the `mat2`
      command-line tool, and a Dolphin service menu for KDE users.
  related-projects:
    - >
      The README links mat2 to the original MAT project, Metadata Cleaner, mat2-web,
      WordPress integrations, ExifTool, pdf-redact-tools, pdfparanoia, Scrambled Exif,
      and Dangerzone.
  sources:
    - https://github.com/jvoisin/mat2
    - https://github.com/jvoisin/mat2/releases/tag/0.14.0
    - https://github.com/jvoisin/mat2/releases/tag/0.2.0
    - https://raw.githubusercontent.com/jvoisin/mat2/master/README.md
    - source_facts.package-manager
  summary:
    - >
      mat2 is the second-generation Metadata Anonymisation Toolkit: a Python library and
      command-line utility for removing privacy-sensitive metadata from documents,
      images, archives, audio, video, and office files.
  timeline:
    - "2018: README copyright and early releases identify mat2's public project era."
    - '2018: GitHub release 0.2.0 is published.'
    - '2025: GitHub release 0.14.0 is published.'
    - >
      2026: The README-documented format list includes office files, images,
      audio/video, archives, torrents, PDFs, and web formats.
  usage:
    - >
      Typical CLI usage is `mat2 file...`, which writes cleaned copies such as
      `myfile.cleaned.png` rather than modifying originals in place by default. The
      README also documents `--show` to inspect detectable metadata, `--list` for
      supported formats, `--inplace`, dependency checks, archive-member policy, and a
      lightweight mode that trades completeness for less alteration of file content.
    - >
      The README is careful about limits: absence of displayed metadata is not a proof
      that no metadata exists, especially for complex file formats. That makes mat2 a
      practical minimization tool rather than a formal sanitizer.
related-packages:
  - id: brew:exiftool
    reason: >
      ExifTool complements mat2 by providing the metadata backend for formats outside
      mat2's dedicated handlers and is also useful when metadata must be inspected or
      edited rather than removed wholesale.
    rel: adjacent_workflow
    sources:
      - https://github.com/jvoisin/mat2#requirements
      - https://exiftool.org/exiftool_pod.html
category: security
package-manager:
  apk: mat2
  brew: mat2
  debian: mat2
