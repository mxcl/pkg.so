id: brew:animdl
display-name: animdl
homepage: https://github.com/justfoolingaround/animdl
repo: https://github.com/justfoolingaround/animdl
docs:
  - https://github.com/justfoolingaround/animdl#readme
config-file-location:
  unix:
    - ~/.config/animdl/config.yml
    - animdl_config.yml in the working directory
    - path specified by ANIMDL_CONFIG
  windows:
    - '%USERPROFILE%/.animdl/config.yml'
    - animdl_config.yml in the working directory
    - path specified by ANIMDL_CONFIG
credentials-file-location: null
history:
  adoption-history:
    - >
      animdl became visible in package-manager culture through Python packaging and
      Homebrew/Nix formula availability. The GitHub repository's star count and issue
      activity indicate a niche but active CLI audience around anime streaming and
      downloading workflows.
  package-nerd-significance:
    - >
      animdl is package-nerd interesting because it turns a volatile web-scraping and
      streaming workflow into a single CLI that package managers can ship. Its config
      search order, provider churn, player integration, and downloader behavior are the
      parts packagers and CLI users need to track.
  project-history:
    - >
      The official repository describes animdl as a fast anime scraper with commands for
      search, stream, download, grab, and schedule workflows. Its README presents pip
      installation and source installation from the GitHub repository, while the
      Homebrew facts show it is also packaged as a formula.
    - >
      The project is shaped around provider modules and local playback/download tooling
      rather than a hosted service. Official documentation discusses provider
      availability, stream selection, external players such as mpv and VLC, ffmpeg
      handling, and Discord Rich Presence support.
  related-projects:
    - >
      The README names supported external players including mpv, VLC, IINA, Celluloid,
      and ffplay.
    - >
      The README points users to the project's official provider benchmarks for provider
      status.
  sources:
    - https://github.com/justfoolingaround/animdl#readme
    - https://github.com/justfoolingaround/animdl/blob/master/readme.md
    - source_facts.package-manager
  summary:
    - >
      animdl is a Python command-line anime scraper, streamer, downloader, and
      stream-link grabber distributed as a package-manager friendly CLI.
  timeline:
    - >
      Current README: Documents pip/source installation, stream/download/grab commands,
      provider behavior, and configuration lookup paths.
    - >
      Current Homebrew facts: Formula named animdl is present with brew and nix
      package-manager mappings.
  usage:
    - >
      Users run the animdl executable with subcommands such as stream, download, grab,
      search, and schedule. The README documents range selection, automatic
      search-result selection, stream quality filters, provider prefixes, direct
      provider URLs, player selection, and ffmpeg options.
    - >
      Configuration can be supplied through ANIMDL_CONFIG, a local animdl_config.yml, or
      a per-user config.yml path; only the first matching configuration file in priority
      order is used.
related-packages:
  - id: brew:mpv
    reason: >
      animdl officially supports mpv as an external player and can launch retrieved
      streams through it using configurable executable options.
    rel: adjacent_workflow
    sources:
      - https://github.com/justfoolingaround/animdl#readme
      - https://mpv.io/manual/stable/
  - id: brew:ffmpeg
    reason: >
      animdl can invoke FFmpeg for HLS downloading and for merging external subtitles
      into downloaded media.
    rel: adjacent_workflow
    sources:
      - https://github.com/justfoolingaround/animdl#readme
      - https://ffmpeg.org/documentation.html
  - id: cask:vlc
    reason: >
      VLC is one of animdl's officially supported external playback targets and is
      useful when a graphical cross-platform player is preferred.
    rel: adjacent_workflow
    sources:
      - https://github.com/justfoolingaround/animdl#readme
      - https://www.videolan.org/vlc/
category: media
package-manager:
  brew: animdl
package-manager-url: https://formulae.brew.sh/formula/animdl
license: GPL-3.0-only
tags:
  - anime
  - cli
  - downloader
  - python
  - scraper
  - streaming
  - video
description: Anime downloader and streamer
executables:
  - animdl
provenance:
  formula: animdl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
