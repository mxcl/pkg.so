id: brew:hblock
display-name: hBlock
homepage: https://hblock.molinero.dev/
repo: https://github.com/hectorm/hblock
docs:
  - https://github.com/hectorm/hblock#readme
  - https://github.com/hectorm/hblock/blob/master/hblock.1.md
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/hblock/sources.list
    - /etc/hblock/sources.list
    - $XDG_CONFIG_HOME/hblock/allow.list
    - /etc/hblock/allow.list
    - $XDG_CONFIG_HOME/hblock/deny.list
    - /etc/hblock/deny.list
    - $XDG_CONFIG_HOME/hblock/header
    - /etc/hblock/header
    - $XDG_CONFIG_HOME/hblock/footer
    - /etc/hblock/footer
credentials-file-location: null
history:
  adoption-history:
    - >
      The README points users to a package list and mentions various package managers.
      Input facts show hBlock packaged in Homebrew, Nix, and pacman, which fits its
      audience: Unix-like users who want repeatable hosts-file generation rather than a
      browser-specific blocker.
    - >
      The project also publishes nightly generated blocklist outputs on its website and
      documents a systemd timer for regular updates, showing use as both a local command
      and scheduled system maintenance tool.
  package-nerd-significance:
    - >
      hBlock is package-nerd friendly because it is just a shell script with explicit
      files, environment variables, and predictable Unix paths. It demonstrates how a
      tiny package can wrap a volatile external data problem while leaving policy in
      plain text files.
  project-history:
    - >
      The public GitHub repository was created in August 2015 by Hector Molinero
      Fernandez. The README describes hBlock as a POSIX-compliant shell script that
      gathers domains from multiple sources and creates a hosts file, among other
      formats, to prevent systems from connecting to them.
    - >
      The manpage documents the program as hBlock 3.5.1 and exposes its design through
      options: output file, header, footer, sources file, allowlist, denylist,
      redirection address, wrapping, template, comments, lenient matching, regex
      allowlists, subdomain filtering, retries, continuation on download error, and
      parallel downloads.
  related-projects:
    - >
      hMirror is related by upstream maintainer documentation as a way to inspect source
      blocklists behind false positives.
    - >
      Hosts-file blocklists, dnsmasq-style outputs, and systemd timers are related
      operational pieces described by the README and manpage.
  sources:
    - https://api.github.com/repos/hectorm/hblock
    - https://github.com/hectorm/hblock
    - https://raw.githubusercontent.com/hectorm/hblock/master/README.md
    - https://raw.githubusercontent.com/hectorm/hblock/master/hblock.1.md
  summary:
    - >
      hBlock is a POSIX shell hosts-file generator for blocking advertising, tracking,
      and malware domains. It belongs to the long Unix tradition of small
      text-processing security tools: fetch lists, merge/filter them, and write a system
      file or alternate output format.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2020s: hBlock documents versioned manual pages and a 3.x command surface.'
    - '2020s: Homebrew, Nix, and pacman package names appear in input package facts.'
  usage:
    - >
      The default workflow is to run hblock and let it generate a hosts file from
      built-in or configured sources. Users can point it at custom sources.list,
      allow.list, deny.list, header, and footer files under XDG_CONFIG_HOME/hblock or
      /etc/hblock, or print to stdout for integration with other tooling.
    - >
      The README warns that hBlock replaces the system hosts file by default, so careful
      use and backups matter when a machine already has local hosts entries.
related-packages: []
category: security
package-manager:
  brew: hblock
  nix: hblock
  pacman: hblock
package-manager-url: https://formulae.brew.sh/formula/hblock
license: MIT
tags:
  - ad-blocker
  - cli
  - dns
  - hosts-file
  - malware-blocking
  - privacy
  - shell
description: Adblocker that creates a hosts file from multiple sources
executables:
  - hblock
provenance:
  formula: hblock
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
