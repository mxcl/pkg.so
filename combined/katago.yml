config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      KataGo became a common analysis engine in the Go software ecosystem because it
      offered strong play, score estimation, multiple rulesets, variable board sizes,
      and usable command-line integration with GUIs.
    - >
      Package-manager adoption matters here because KataGo is not a single
      self-contained GUI. Users often install the engine through Homebrew or binaries,
      then connect it to tools such as KaTrain, Lizzie-family GUIs, q5Go, Sabaki, or
      other analysis front ends.
  package-nerd-significance:
    - >
      KataGo is a package-nerd classic because it turns a research-grade AI engine into
      something installable, scriptable, and composable with separate model files and
      GUI front ends. The package boundary is unusually visible: executable, backend
      choice, config, neural net, and GTP consumer all have to line up.
  project-history:
    - >
      KataGo was released publicly with the February 2019 paper 'Accelerating Self-Play
      Learning in Go'. The paper and Jane Street announcement emphasized practical
      efficiency: stronger self-play learning with far less compute than AlphaZero-style
      baselines, plus Go-specific targets such as score estimation and ownership
      prediction.
    - >
      The repository describes KataGo as a GTP engine rather than a graphical program.
      Its docs and README grew into a package for engine users, GUI integrators, and
      researchers, covering training history, model files, backends, GTP usage, and
      experiments beyond the original paper.
    - >
      The project continued to incorporate methods documented after the paper, including
      multiple board-size support, search and training refinements, and later
      neural-network architecture work.
  related-projects:
    - >
      KataGo is related to AlphaGo Zero, ELF OpenGo, Leela Zero, GTP-compatible Go GUIs,
      KaTrain, Lizzie-family interfaces, q5Go, Sabaki, and David Wu's earlier GoNN
      research.
  sources:
    - https://arxiv.org/abs/1902.10565
    - https://blog.janestreet.com/accelerating-self-play-learning-in-go/
    - https://formulae.brew.sh/formula/katago
    - https://github.com/lightvector/KataGo
    - https://github.com/lightvector/KataGo/blob/master/docs/KataGoMethods.md
    - >
      https://github.com/lightvector/KataGo/commit/810fadeed694deeb65439febdc9698f6231c21c9.patch
    - >
      https://github.com/lightvector/KataGo/commit/d93629e4dd791b14088bd1b228b7207ca1e0e7d8.patch
    - https://github.com/lightvector/KataGo/tree/master/docs
  summary:
    - >
      KataGo is David J. Wu's open-source Go engine, combining neural-network-guided
      Monte Carlo tree search with self-play training and a GTP command-line interface
      for Go GUIs and analysis tools.
  timeline:
    - '2019-02-26: v1.0 release work updated the README for public releases'
    - "2019-02-27: arXiv submission for 'Accelerating Self-Play Learning in Go'"
    - >
      2019-02-28: Jane Street published the release announcement and linked source code
      and trained nets
    - >
      2023-01-07: v1.12.0 release work landed during a period of neural-network
      architecture changes
  usage:
    - >
      The README documents KataGo as a GTP engine that generally runs behind a GUI or
      analysis program. Homebrew installs config files and neural networks under the
      formula's share directory, and the README shows how to discover those files with
      brew list --verbose.
related-packages:
  - id: cask:sabaki
    reason: >
      Sabaki is a graphical Go board and SGF editor that can launch KataGo through GTP
      for play and engine-assisted analysis.
    rel: adjacent_workflow
    sources:
      - https://github.com/lightvector/KataGo#readme
      - https://github.com/SabakiHQ/Sabaki/blob/master/docs/README.md
  - id: brew:leela-zero
    reason: >
      Leela Zero is an alternative AlphaGo Zero-style neural Go engine focused on
      faithful no-human-knowledge self-play, while KataGo adds score, ownership, rules,
      and broader analysis capabilities.
    rel: alternative
    sources:
      - https://github.com/lightvector/KataGo#readme
      - https://github.com/leela-zero/leela-zero
category: games
