id: brew:invoice
display-name: Invoice
homepage: https://github.com/maaslalani/invoice
repo: https://github.com/maaslalani/invoice
docs:
  - https://github.com/maaslalani/invoice#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Invoice gained package-manager visibility through the Homebrew formula and Nix
      metadata supplied in the input package facts. Its GitHub repository also shows a
      visible small-utility audience, with stars and forks centered around a compact CLI
      rather than a larger invoicing platform.
  package-nerd-significance:
    - >
      Invoice is notable as a clean example of a personal-productivity CLI that does not
      try to become an accounting system. For package maintainers, it is a small Go
      binary with a direct upstream, a short release history, and behavior that is easy
      to smoke-test by generating a PDF.
  project-history:
    - >
      The public repository describes Invoice as a command-line invoice generator and
      documents the core workflow with `invoice generate`. The repository release list
      records an initial release in June 2023, with the README directing users to either
      install from Go source or download release binaries.
  related-projects:
    - >
      Go's module installer is an official installation route via `go install
      github.com/maaslalani/invoice@main`.
    - Homebrew and Nix provide package-manager routes for users who prefer managed binaries.
  sources:
    - https://formulae.brew.sh/formula/invoice
    - https://github.com/maaslalani/invoice
    - https://github.com/maaslalani/invoice/releases
  summary:
    - >
      Invoice is a small Go command-line utility for generating PDF invoices from
      terminal arguments, environment variables, or imported JSON/YAML data. It belongs
      to the modern single-purpose CLI tradition: one binary, examples in the README,
      and binary distribution through GitHub releases and package managers.
  timeline:
    - '2023-06: Public attention and initial GitHub release for the Invoice CLI.'
    - >
      2023: README documents Go installation, release binaries, CLI flags, environment
      variables, and JSON/YAML import.
    - 'Package-manager era: Homebrew and Nix package the `invoice` executable.'
  usage:
    - >
      The primary usage is generating a PDF invoice by supplying sender, recipient, line
      items, quantities, rates, tax, discount, notes, and output path on the command
      line. The README also documents environment variables for repeated values and
      importing JSON/YAML data for repeatable invoice generation.
related-packages:
  - id: brew:pop
    reason: >
      Use Pop after Invoice to send the generated PDF from the terminal; Pop's official
      README documents this exact attachment workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/maaslalani/invoice
      - https://github.com/charmbracelet/pop
category: productivity
package-manager:
  brew: invoice
  nix: invoice
package-manager-url: https://formulae.brew.sh/formula/invoice
license: MIT
tags:
  - cli
  - finance
  - go
  - invoicing
  - pdf
description: Command-line invoice generator
executables:
  - invoice
provenance:
  formula: invoice
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
