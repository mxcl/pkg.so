id: brew:conan@1
display-name: Conan
homepage: https://conan.io
repo: https://github.com/conan-io/conan
docs:
  - https://docs.conan.io/1
config-file-location:
  unix:
    - ~/.conan/conan.conf
    - ~/.conan/profiles/default
credentials-file-location: null
history:
  adoption-history:
    - >
      Conan 1.x carried the project through its first broad adoption phase:
      decentralized remotes, Python recipes, binary package reuse, and integrations with
      CMake, Make, MSBuild, Meson, Artifactory, ConanCenter, and earlier Bintray-era
      repositories.
  package-nerd-significance:
    - >
      The conan@1 package is a classic package-manager compatibility split: it preserves
      an older major CLI with different configuration paths and behavior while the
      unversioned conan package tracks the modern major line.
  project-history:
    - >
      The Conan 1.x documentation is now labeled by the project as legacy and no longer
      recommended for new users, but it remains relevant because many existing recipes,
      CI pipelines, and package-manager formulas depend on 1.x behavior and its classic
      Conan home layout.
  related-projects:
    - >
      Conan 1.x remains tied to ConanCenter, Artifactory, CMake, Meson, MSBuild, and
      package recipes that have not migrated to Conan 2 semantics.
  sources:
    - https://github.com/conan-io/conan
    - https://github.com/conan-io/conan/releases/tag/1.0.0
    - https://github.com/conan-io/conan/releases/tag/2.0.0
    - https://docs.conan.io/1/
    - https://docs.conan.io/1/reference/config_files/conan.conf.html
  summary:
    - >
      Conan 1.x is the legacy major line of Conan, the C and C++ package manager that
      reached 1.0.0 in January 2018 and stayed widely packaged after the Conan 2 line
      was introduced.
  timeline:
    - '2015: Official Conan repository created.'
    - '2018: Conan 1.0.0 released.'
    - '2023: Conan 2.0.0 released, making Conan 1.x the legacy major line.'
  usage:
    - >
      Conan 1.x users typically work with ~/.conan/conan.conf, profiles/default, and
      conanfile.py or conanfile.txt. The separate Homebrew formula exists to keep older
      projects and lock-step CI environments on the legacy client while Conan 2 evolves
      independently.
related-packages:
  - id: brew:conan
    reason: >
      Choose the unversioned Conan formula for the supported Conan 2 client; the project
      marks Conan 1.x as legacy and recommends migration for new work.
    rel: alternative
    sources:
      - https://docs.conan.io/1/
      - https://docs.conan.io/2/
  - id: brew:cmake
    reason: >
      Use CMake alongside Conan 1.x when maintaining an older Conan-driven C or C++
      build that relies on its documented CMake generators and build helpers.
    rel: adjacent_workflow
    sources:
      - https://docs.conan.io/1/integrations/build_system/cmake.html
      - https://cmake.org/cmake/help/latest/
category: developer-tools
package-manager:
  brew: conan@1
  chocolatey: conan
  dnf: conan
  nix: conan
  scoop: main/conan
  winget: JFrog.Conan
  zypper: conan
package-manager-url: https://formulae.brew.sh/formula/conan@1
license: MIT
tags:
  - build-systems
  - c
  - cli
  - cpp
  - dependency-management
  - package-manager
description: Distributed, open source, package manager for C/C++
executables:
  - conan
  - conan_build_info
  - conan_server
provenance:
  formula: conan@1
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
