id: brew:kubectl-explore
display-name: kubectl-explore
homepage: https://github.com/keisku/kubectl-explore
repo: https://github.com/keisku/kubectl-explore
docs:
  - https://github.com/keisku/kubectl-explore#readme
config-file-location:
  unix: ~/.kube/config
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      The plugin has modest but real packaging reach through Krew, Nix, AUR, Homebrew,
      and zypper. Repository metadata observed on 2026-07-01 showed about 600 GitHub
      stars, which fits a focused kubectl helper rather than a broad platform project.
  package-nerd-significance:
    - >
      kubectl-explore matters to package nerds as a classic small CLI that packages a
      single interactive affordance: fuzzy discovery over Kubernetes API fields. It is
      also a good example of how Krew-style kubectl plugins migrate into general-purpose
      package managers.
  project-history:
    - >
      The GitHub repository was created on 2022-01-01. The README focuses on one
      ergonomic gap: `kubectl explain` requires users to know resource names and field
      paths in advance, while kubectl-explore lets them fuzzy-find resources and fields.
  related-projects:
    - >
      kubectl-explore is directly related to `kubectl explain`, Krew, and Kubernetes'
      plugin mechanism. It belongs to the same family as other kubectl UX helpers that
      make cluster discovery faster without adding a controller.
  sources:
    - https://api.github.com/repos/keisku/kubectl-explore
    - https://formulae.brew.sh/formula/kubectl-explore
    - https://github.com/keisku/kubectl-explore
    - https://github.com/keisku/kubectl-explore#readme
    - https://krew.sigs.k8s.io/docs/user-guide/setup/install/
    - https://kubernetes.io/docs/tasks/extend-kubectl/kubectl-plugins/
  summary:
    - >
      kubectl-explore is a kubectl plugin that wraps Kubernetes schema discovery in a
      fuzzy-finder workflow. Its README positions it as a better `kubectl explain` for
      users who do not already know the exact resource or field path they want to
      inspect.
  timeline:
    - '2022-01-01: GitHub repository created.'
    - '2024-12-07: Release v0.11.0 published.'
    - '2025-04-08: Release v0.12.0 published.'
    - '2025-09-03: Release v0.14.0 published.'
    - '2025-11-10: Release v0.14.1 published.'
  usage:
    - >
      Users invoke it as `kubectl explore`, optionally with a resource such as `pod` or
      `sts`, or with a regex-like path filter. The README validates it as a standard
      kubectl plugin by pointing users to Kubernetes' plugin documentation.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Choose kubectl's built-in `explain` command when you already know the exact
      resource or field path; kubectl-explore adds fuzzy discovery for the same
      schema-inspection task.
    rel: alternative
    sources:
      - https://github.com/keisku/kubectl-explore#readme
      - https://kubernetes.io/docs/reference/kubectl/kubectl/
category: developer-tools
package-manager:
  brew: kubectl-explore
  nix: kubectl-explore
  zypper: kubectl-explore
package-manager-url: https://formulae.brew.sh/formula/kubectl-explore
license: MIT
tags:
  - cli
  - fuzzy-finder
  - kubectl
  - kubectl-plugin
  - kubernetes
  - resource-discovery
description: Better kubectl explain with the fuzzy finder
executables:
  - kubectl-explore
provenance:
  formula: kubectl-explore
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
