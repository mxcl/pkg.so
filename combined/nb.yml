id: brew:nb
display-name: nb
homepage: https://xwmx.github.io/nb
repo: https://github.com/xwmx/nb
docs:
  - https://github.com/xwmx/nb#readme
  - https://xwmx.github.io/nb
config-file-location:
  unix: ~/.nbrc
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub API data retrieved on 2026-07-01 showed 8,266 stars and 252 forks. Homebrew
      Formulae data for the same retrieval showed version 7.25.4 and 2,815 installs over
      the prior 365 days. The npm package nb.sh was created on 2020-06-17 and the npm
      downloads API reported 1,450 downloads for 2026-05-30 through 2026-06-28.
    - >
      The package sits in the command-line PKM and plain-text productivity niche: large
      enough to be packaged by common package managers and discussed by terminal-tool
      users, but still most useful to people who already want their notes and bookmarks
      as files rather than SaaS records.
  package-nerd-significance:
    - >
      nb is interesting because it is not a new storage backend. It packages a familiar
      Unix stack into a cohesive notes/bookmarks/archive workflow while keeping the
      escape hatch obvious: the data remains ordinary files under Git.
  project-history:
    - >
      The GitHub repository was created on 2016-01-12. The project presents itself as a
      portable, vendor-independent Unix tool rather than a hosted notes service: data
      lives in plain text formats such as Markdown, Org, LaTeX, and AsciiDoc, and the
      implementation is deliberately packaged as a single portable script with optional
      enhancements.
    - >
      Its design grew around composability with existing command-line habits. The README
      emphasizes use with Vim, Emacs, VS Code, Sublime Text, Helix, micro, terminal
      browsers, GUI browsers, Git, Pandoc, OpenSSL/GPG encryption, and standard Unix
      environments including macOS and Windows via WSL, MSYS, and Cygwin.
  sources:
    - https://api.github.com/repos/xwmx/nb
    - https://api.npmjs.org/downloads/point/last-month/nb.sh
    - https://formulae.brew.sh/api/formula/nb.json
    - https://github.com/xwmx/nb
    - https://raw.githubusercontent.com/xwmx/nb/master/README.md
    - https://registry.npmjs.org/nb.sh
  summary:
    - >
      nb is a shell-script personal knowledge tool: notes, bookmarks, archives, todos,
      wiki-style links, search, encryption, Git-backed version history, and sync wrapped
      in one command-line and local-web interface.
  timeline:
    - '2016-01-12: xwmx/nb repository created on GitHub.'
    - '2020-06-17: nb.sh package created on npm.'
    - '2026-04-28: nb 7.25.4 release published on GitHub.'
    - '2026-07-01: Homebrew Formulae reported stable version 7.25.4.'
  usage:
    - >
      Package nerds use nb as a local-first notebook and bookmark database: add notes
      from the terminal, save URLs as cleaned Markdown, search cached page text with
      regular expressions, tag and pin items, and let Git record revisions and
      synchronize notebooks.
    - >
      A typical setup is intentionally boring: install nb, keep ~/.nbrc for preferences,
      point it at an editor, and optionally add Pandoc, ripgrep/ag/grep, browser
      helpers, GPG/OpenSSL, and remote Git sync as the workflow grows.
related-packages:
  - id: brew:zk
    reason: >
      Choose zk when the main requirement is a Markdown Zettelkasten with indexing,
      templates, links, and editor/LSP integration, rather than nb's broader bookmarking
      and archiving workflow.
    rel: alternative
    sources:
      - https://xwmx.github.io/nb/
      - https://zk-org.github.io/zk/
  - id: brew:jrnl
    reason: >
      Choose jrnl for a focused command-line journal with natural-language entries,
      search, tags, and optional encryption instead of nb's multi-notebook knowledge
      base.
    rel: alternative
    sources:
      - https://xwmx.github.io/nb/
      - https://jrnl.sh/en/stable/
  - id: brew:dnote
    reason: >
      Choose Dnote for a smaller developer-oriented notebook backed by SQLite with an
      optional self-hosted synchronization server.
    rel: alternative
    sources:
      - https://xwmx.github.io/nb/
      - https://www.getdnote.com/
category: productivity
package-manager:
  apk: nb
  brew: nb
  macports: nb
  nix: nb
package-manager-url: https://formulae.brew.sh/formula/nb
license: AGPL-3.0-or-later
tags:
  - archiving
  - bookmarks
  - cli
  - notes
description: Command-line and local web note-taking, bookmarking, and archiving
executables:
  - bookmark
  - nb
provenance:
  formula: nb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
