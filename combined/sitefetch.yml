id: brew:sitefetch
display-name: sitefetch
homepage: https://github.com/egoist/sitefetch
repo: https://github.com/egoist/sitefetch
docs:
  - https://github.com/egoist/sitefetch#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream documents one-off and global installation with npm, pnpm and Bun. The
      supplied source_facts.package-manager additionally records Homebrew packaging.
      These indicate distribution channels; no adoption chronology or usage figures were
      established.
  package-nerd-significance:
    - >
      The tool represents the use of small JavaScript command-line packages to prepare
      website content for language-model workflows.
  project-history:
    - >
      Published by EGOIST under the MIT license, sitefetch provides both a command-line
      interface and a fetchSite API. Its README identifies Mozilla Readability as the
      readable-content extraction component.
  related-projects:
    - 'Mozilla Readability: content extraction. micromatch: pathname-pattern matching.'
  sources:
    - '[Official README](https://github.com/egoist/sitefetch#readme)'
    - source_facts.package-manager
  summary:
    - >
      sitefetch retrieves website pages and combines their readable content into a text
      file intended for AI-model use.
  timeline:
    - No dated historical milestone established from the reviewed official documentation.
  usage:
    - >
      Run sitefetch with a site URL and output filename. Flags control concurrency,
      filter page paths and select content through CSS selectors; developers can also
      call fetchSite from code.
category: ai
package-manager:
  brew: sitefetch
