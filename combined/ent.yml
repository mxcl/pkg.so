id: brew:ent
display-name: ent
homepage: https://www.fourmilab.ch/random/
repo: https://github.com/psm14/ent
docs:
  - https://www.fourmilab.ch/random
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ent is a small but widely repackaged scientific CLI. The input metadata lists it
      in Homebrew, Debian, Ubuntu, MacPorts, and Nix, reflecting its utility as a
      compact randomness and entropy smoke test in Unix-style workflows.
  package-nerd-significance:
    - >
      ent is package-nerd friendly because it is tiny, public-domain in Homebrew
      metadata, scriptable, and easy to compare across systems. It gives quick
      statistical signals without requiring a larger cryptography or statistics suite.
  project-history:
    - >
      The official Fourmilab page describes ent as a pseudorandom number sequence test
      program that reads a file or standard input and reports entropy, optimum
      compression estimate, chi-square distribution, arithmetic mean, Monte Carlo value
      for pi, and serial correlation.
    - >
      The page frames the tool around practical comparisons of generated data, including
      examples contrasting compressed files, Unix `rand()` output, an improved
      generator, and radioactive-decay random data from Fourmilab's HotBits service.
  related-projects:
    - >
      The official page relates ent to Fourmilab HotBits, Unix `rand()`, Park-Miller
      style pseudorandom generators, and statistical references such as Knuth and
      Hamming.
  sources:
    - https://www.fourmilab.ch/random
    - https://formulae.brew.sh/formula/ent
    - https://github.com/psm14/ent
  summary:
    - >
      ent is John Walker's command-line program for applying statistical tests to byte
      streams, mainly to inspect pseudorandom number generators, compression output,
      encrypted data, and other files where information density matters.
  timeline:
    - >
      1990s-2000s: Fourmilab page documents ent as a standalone pseudorandom sequence
      test utility.
    - >
      2010s: Third-party GitHub mirror created for source availability, while Fourmilab
      remains the official documentation source.
    - >
      2020s: Package metadata shows continuing availability in Homebrew and several Unix
      package collections.
  usage:
    - >
      Users run `ent` on a file or pipe data to standard input, optionally using flags
      for byte/bit-oriented output, counts, folding, terse CSV-style output, or stdin
      handling. The program is commonly used to sanity-check random generators,
      compressed data, encrypted data, and test fixtures.
related-packages: []
category: science
