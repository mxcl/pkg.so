id: brew:fastrace
display-name: Fastrace
homepage: https://github.com/davidesantangelo/fastrace
repo: https://github.com/davidesantangelo/fastrace
docs:
  - https://github.com/davidesantangelo/fastrace#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew installation for macOS and Linux and source builds
      with make or gcc. Homebrew currently tracks the upstream v1.0.0 release archive.
  package-nerd-significance:
    - >
      For package-manager users, Fastrace is an example of a classic Unix network
      diagnostic rebuilt as a small native tool with JSON/CSV output and documented
      cross-platform behavior.
  project-history:
    - >
      The GitHub repository was created in March 2025. The official README describes
      IPv4 and IPv6 support, UDP, ICMP Echo, and TCP SYN probe modes, JSON and CSV
      output, metrics, adaptive concurrency, and a zero-dependency libc/raw-socket
      design.
  related-projects:
    - The README directly compares Fastrace with the standard traceroute utility.
  sources:
    - https://api.github.com/repos/davidesantangelo/fastrace
    - https://api.github.com/repos/davidesantangelo/fastrace/releases
    - https://formulae.brew.sh/api/formula/fastrace.json
    - https://github.com/davidesantangelo/fastrace#readme
  summary:
    - >
      Fastrace is a dependency-free traceroute implementation in C, designed for faster
      network path tracing with multiple probe modes and machine-readable output.
  timeline:
    - '2025: GitHub repository created.'
    - '2025: v0.1.0 published on GitHub Releases.'
    - '2026: v1.0.0 published and tracked by Homebrew.'
  usage:
    - >
      Fastrace is run against a target host, commonly with elevated privileges for raw
      networking. The README documents examples for IPv6 tracing, ICMP mode, TCP SYN
      mode, no-DNS output, JSON output, CSV output, and metrics.
related-packages:
  - id: brew:mtr
    reason: >
      Choose mtr for continuous traceroute-plus-ping monitoring with running per-hop
      loss statistics; choose Fastrace for rapid one-shot traces, multiple probe modes,
      and JSON or CSV output.
    rel: alternative
    sources:
      - https://github.com/davidesantangelo/fastrace
      - https://github.com/traviscross/mtr
category: networking
package-manager:
  brew: fastrace
package-manager-url: https://formulae.brew.sh/formula/fastrace
license: BSD-2-Clause
tags:
  - c
  - cli
  - ipv6
  - network-diagnostics
  - raw-sockets
  - traceroute
description: Dependency-free traceroute implementation in pure C
executables:
  - fastrace
provenance:
  formula: fastrace
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
