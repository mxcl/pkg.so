id: brew:container-canary
display-name: container-canary
homepage: https://github.com/NVIDIA/container-canary
repo: https://github.com/NVIDIA/container-canary
docs:
  - https://github.com/NVIDIA/container-canary#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official documentation illustrates the tool with a Kubeflow Notebooks-style
      requirements manifest, but it does not publish a broad adopter list. The safest
      reading is that Container Canary serves teams that need repeatable image
      conformance checks for managed compute or notebook platforms.
  package-nerd-significance:
    - >
      For package managers, Container Canary is a small Go CLI whose value is in making
      container-image policy testable and versioned. It is useful when a package
      ecosystem needs to validate that images contain expected users, ports, services,
      or files before publishing or deploying them.
  project-history:
    - >
      The project presents itself as a tool for recording platform requirements as a
      manifest and validating container images against that manifest. Official releases
      began with v0.1.0 in March 2022, with later 0.x releases continuing through 2025.
  related-projects:
    - >
      The README connects Container Canary concepts to Kubernetes probes and uses
      Kubeflow Notebooks requirements as its main worked example.
  sources:
    - https://github.com/NVIDIA/container-canary#readme
    - https://github.com/NVIDIA/container-canary/releases/tag/v0.1.0
    - https://github.com/NVIDIA/container-canary/releases/tag/v0.5.0
  summary:
    - >
      Container Canary is an NVIDIA container validation CLI for checking image
      requirements against versioned manifests. Its history is tied to CI-oriented
      validation of bring-your-own-container platforms rather than to a broad runtime or
      orchestration layer.
  timeline:
    - '2022: v0.1.0 release published.'
    - '2024: v0.3.0 and v0.4.0 releases published.'
    - '2025: v0.5.0 release published.'
  usage:
    - >
      Users run the `canary` command against a YAML validator file and a target
      container image. The checks borrow concepts from Kubernetes probes, including
      exec, HTTP, and TCP socket tests, so it fits naturally into CI pipelines already
      using container and Kubernetes vocabulary.
related-packages:
  - id: brew:container-structure-test
    reason: >
      Choose Container Structure Tests when validation should focus on command output,
      filesystem contents, image metadata, or licenses rather than Container Canary's
      platform-requirement and live-probe model.
    rel: alternative
    sources:
      - https://github.com/NVIDIA/container-canary#readme
      - https://github.com/GoogleContainerTools/container-structure-test#readme
category: cloud-infrastructure
package-manager:
  brew: container-canary
  dnf: dummy-package-canary
package-manager-url: https://formulae.brew.sh/formula/container-canary
license: Apache-2.0
tags:
  - ci
  - cli
  - containers
  - docker
  - kubernetes
  - testing
  - validation
description: Test and validate container requirements against versioned manifests
executables:
  - canary
provenance:
  formula: container-canary
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
