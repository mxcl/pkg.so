id: brew:kwctl
display-name: kwctl
homepage: https://www.kubewarden.io/
repo: https://github.com/kubewarden/adm-controller
docs:
  - https://docs.kubewarden.io/reference/kwctl-cli
config-file-location:
  linux:
    - ~/.config/kubewarden/sources.yaml
    - ~/.config/kubewarden/verification-config.yml
  macos: ~/Library/Application Support/io.kubewarden.kubewarden/sources.yaml
  windows: $HOME\AppData\Roaming\kubewarden\config\sources.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      kwctl's adoption follows Kubewarden's adoption path rather than a separate
      ecosystem. It appears in Kubewarden tutorials and how-to material as the default
      CLI for testing policies before applying them to Kubernetes clusters and for
      preparing policy artifacts for registries.
  package-nerd-significance:
    - >
      For package collectors, kwctl is a small but telling example of the Kubernetes
      toolchain adopting OCI artifacts and WebAssembly outside normal container images.
      It is the Kubewarden equivalent of a specialized kubectl for policy packages.
  project-history:
    - >
      Kubewarden grew around the idea of using WebAssembly modules as Kubernetes
      admission policies. In June 2021 the project announced kwctl as a new tool for
      both policy authors and cluster administrators, and the December 2021 first-year
      recap described it as an expansion of the Kubewarden toolkit after KubeCon Europe.
    - >
      The CLI became the developer-facing and operator-facing workbench for Kubewarden
      policies: it handles OCI registry distribution, metadata annotation, policy
      inspection, local execution, and scaffolding around the admission-controller
      components that run inside a cluster.
  related-projects:
    - >
      kwctl is part of Kubewarden Admission Controller alongside kubewarden-controller,
      policy-server, audit-scanner, Kubewarden policies, OCI registries, WebAssembly,
      Sigstore, and Kubernetes admission webhooks.
  sources:
    - https://docs.kubewarden.io/reference/kwctl-cli
    - https://github.com/kubewarden/kubewarden-controller
    - https://www.kubewarden.io/blog/2021/06/kwctl-intro-for-kubernetes-administrators/
    - https://www.kubewarden.io/blog/2021/12/first-year-of-kubewarden/
  summary:
    - >
      kwctl is the command-line tool in the Kubewarden admission-controller ecosystem.
      It gives policy authors and Kubernetes administrators a local way to inspect,
      annotate, run, benchmark, pull, push, save, and verify WebAssembly admission
      policies.
  timeline:
    - >
      2021-06-09: Kubewarden announced kwctl as a command-line utility for policy
      authors and Kubernetes administrators.
    - >
      2021-12-15: Kubewarden's first-year recap described kwctl as a toolkit addition
      released shortly after KubeCon Europe.
    - >
      2026-06-22: The 2021 kwctl announcement page carried an update date while
      retaining the original June 2021 publication date.
  usage:
    - >
      The common package-manager use case is installing kwctl beside kubectl, Helm, and
      policy build tools so a policy can be pulled or run locally before a cluster
      admission rule is created. It is also used to annotate WebAssembly modules with
      Kubewarden metadata and push policies as OCI artifacts.
related-packages:
  - id: brew:opa
    reason: >
      Choose Open Policy Agent for a general-purpose Rego policy engine; Kubewarden can
      execute Rego policies compiled to WebAssembly when the same policy work needs
      Kubewarden's Kubernetes admission and OCI workflow.
    rel: alternative
    sources:
      - https://www.kubewarden.io/blog/2021/12/first-year-of-kubewarden/
      - https://www.openpolicyagent.org/docs/kubernetes/primer
  - id: brew:cosign
    reason: >
      Use cosign alongside kwctl when signing and independently verifying OCI policy
      artifacts in the Sigstore supply-chain workflow supported by Kubewarden.
    rel: adjacent_workflow
    sources:
      - https://docs.kubewarden.io/reference/kwctl-cli/
      - https://docs.sigstore.dev/cosign/verifying/verify/
category: cloud-infrastructure
package-manager:
  brew: kwctl
  zypper: kwctl
package-manager-url: https://formulae.brew.sh/formula/kwctl
license: Apache-2.0
tags:
  - cli
  - kubernetes
  - kubewarden
  - policy-engine
  - webassembly
description: CLI tool for the Kubewarden policy engine for Kubernetes
executables:
  - kwctl
provenance:
  formula: kwctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
