id: brew:fizmo
display-name: fizmo
homepage: https://fizmo.spellbreaker.org
repo: https://github.com/chrender/fizmo
docs:
  - https://fizmo.spellbreaker.org/
  - https://github.com/chrender/fizmo#readme
config-file-location:
  unix: ~/.config/fizmo/config
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption is in the interactive-fiction niche: users need a Z-Machine
      interpreter, while developers can reuse libfizmo and display interfaces. The
      Homebrew input records packaging in Homebrew, Debian, MacPorts, and Ubuntu.
  package-nerd-significance:
    - >
      fizmo is interesting to package maintainers because it splits an interpreter core
      from several optional frontends and libraries, so terminal, SDL2, Glk, sound,
      fonts, and Unicode support can affect what a package exposes.
  project-history:
    - >
      The upstream README says fizmo was written by Christoph Ender in 2005-2016. The
      GitHub repository was created in 2012, and the visible GitHub releases cover the
      0.8.x line from 2016 through 2018.
  related-projects:
    - >
      Related projects and formats include the Z-Machine, Infocom story files, the
      Interactive Fiction Archive, Glk, RemGlk, ncurses, SDL2, and iOS-fizmo.
  sources:
    - https://fizmo.spellbreaker.org/
    - https://github.com/chrender/fizmo
    - https://github.com/chrender/fizmo/releases
  summary:
    - >
      fizmo is a plain-C Z-Machine interpreter for running Infocom and other Z-code
      interactive fiction, with multiple frontends for console, ncurses, SDL2, Glk, and
      RemGlk-style use.
  timeline:
    - '2005: Development period begins according to the upstream README.'
    - '2012: GitHub repository created.'
    - '2016: 0.8.0 release work appears in GitHub history.'
    - '2018: 0.8.5 release published.'
  usage:
    - >
      Users run one of the packaged frontends, such as `fizmo-console`,
      `fizmo-ncursesw`, or `fizmo-sdl2`, against Z-code story files. Developers can use
      the interpreter core and interfaces to build their own display or sound frontends.
related-packages:
  - id: brew:inform6
    reason: >
      Use Inform 6 to compile interactive-fiction source into Z-Machine story files,
      then run those files with fizmo.
    rel: adjacent_workflow
    sources:
      - https://fizmo.spellbreaker.org/
      - https://inform-fiction.org/inform6.html
category: games
package-manager:
  brew: fizmo
  debian: fizmo-console
  macports: fizmo
  ubuntu: fizmo-console
package-manager-url: https://formulae.brew.sh/formula/fizmo
license: BSD-3-Clause
tags:
  - c
  - cli
  - interactive-fiction
  - interpreter
  - text-adventure
  - z-machine
description: Z-Machine interpreter
executables:
  - fizmo-console
  - fizmo-ncursesw
  - fizmo-sdl2
provenance:
  formula: fizmo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
