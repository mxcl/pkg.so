id: brew:kalign
display-name: Kalign
homepage: https://github.com/TimoLassmann/kalign
repo: https://github.com/TimoLassmann/kalign
docs:
  - https://github.com/TimoLassmann/kalign#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kalign remained in the bioinformatics toolchain because multiple sequence
      alignment is a routine upstream step for homology, conserved-motif, phylogeny, and
      structure-oriented analyses. Kalign 3, published in Bioinformatics in 2019, was
      presented as a complete rewrite to handle larger protein and nucleotide sequence
      sets, using SIMD-accelerated distance estimation and fast guide-tree construction.
  package-nerd-significance:
    - >
      Kalign is a classic science CLI package: a published algorithm wrapped in a small
      executable, useful in scripts and pipelines, with package-manager availability
      making a cited method reproducible without hand-building a lab-specific binary.
  project-history:
    - >
      Timo Lassmann and Erik Sonnhammer published the original Kalign method in BMC
      Bioinformatics on 2005-12-12. The paper described a Wu-Manber-based progressive
      alignment method intended to improve both speed and accuracy for large
      comparative-genomics workloads.
  related-projects:
    - >
      Related multiple-sequence-alignment tools include ClustalW, MAFFT, MUSCLE,
      T-Coffee, and other progressive or consistency-based MSA programs.
  sources:
    - https://academic.oup.com/bioinformatics/article/36/6/1928/5607735
    - https://api.github.com/repos/TimoLassmann/kalign/releases?per_page=100
    - https://github.com/TimoLassmann/kalign
    - https://link.springer.com/article/10.1186/1471-2105-6-298
  summary:
    - >
      Kalign is a fast multiple-sequence-alignment program for protein, DNA, and RNA
      sequences, distributed as a command-line bioinformatics tool.
  timeline:
    - '2005-12-12: Original Kalign paper published in BMC Bioinformatics.'
    - '2019-10-26: Kalign 3 paper published in Bioinformatics.'
    - '2019-10-28: GitHub release 3.1 published.'
    - '2020-11-06: v3.3 release added multi-threading.'
    - '2026-02-27: Kalign 3.5.1 published.'
  usage:
    - >
      Users run kalign on FASTA-like biological sequence inputs to produce multiple
      alignments. The modern README describes progressive alignment with multi-threading
      support, source builds with CMake, and alternatives such as Zig builds and Python
      packaging.
related-packages:
  - id: brew:mafft
    reason: >
      Choose MAFFT when you need a wider range of explicitly documented strategies for
      small high-accuracy or very large alignments; choose Kalign for a compact
      progressive aligner with simple speed, recall, and accuracy presets.
    rel: alternative
    sources:
      - https://mafft.cbrc.jp/alignment/software/
      - https://mafft.cbrc.jp/alignment/software/manual/manual.html
      - https://github.com/TimoLassmann/kalign#readme
category: science
package-manager:
  brew: kalign
  debian: kalign
  nix: kalign
  ubuntu: kalign
package-manager-url: https://formulae.brew.sh/formula/kalign
license: Apache-2.0
tags:
  - bioinformatics
  - cli
  - dna
  - multiple-sequence-alignment
  - protein
  - rna
  - sequence-analysis
description: Fast multiple sequence alignment program for biological sequences
executables:
  - kalign
provenance:
  formula: kalign
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
