id: brew:inspectrum
display-name: inspectrum
homepage: https://github.com/miek/inspectrum
repo: https://github.com/miek/inspectrum
docs:
  - https://github.com/miek/inspectrum/wiki/Build
  - https://github.com/miek/inspectrum#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README points users to Linux distribution packages, Homebrew, MacPorts,
      radioconda, and conda-forge, which places inspectrum in the cross-platform SDR
      packaging ecosystem rather than only as a source build for radio hobbyists.
    - >
      Homebrew packages inspectrum from its tagged GitHub source archive and reports
      installation activity for the formula, while the input metadata also records
      packages in Debian, Ubuntu, MacPorts, Nix, Arch, and openSUSE-style package
      managers.
  package-nerd-significance:
    - >
      For package maintainers, inspectrum is a compact example of the SDR stack in a
      desktop formula: Qt, FFTW, liquid-dsp, CMake, and a file-format-heavy UI for raw
      binary data. It is more specialized than a generic plotting tool and more
      packageable than a complete GNU Radio workflow.
    - >
      Its importance comes from occupying a small but useful slot between low-level SDR
      capture utilities and larger radio-analysis environments: a single executable that
      can be installed from a package manager and pointed at raw samples.
  project-history:
    - >
      The GitHub repository was created in 2015 under miek/inspectrum, and the first
      tagged release, v0.1, appeared later that year. The README describes a desktop
      tool for analysing captured signals from SDR receivers, with support for very
      large files, spectrogram navigation, amplitude/frequency/phase/IQ plots, cursors,
      symbol extraction, and export of filtered or demodulated data.
    - >
      The release history shows a gradual widening of file-format and analysis support.
      Version 0.2 added extra plots, cursors, symbol extraction, data export, and
      additional SDR sample formats; later releases added support for real-valued
      samples, SigMF files and annotations, Qt 6, and SigMF datasets.
  related-projects:
    - >
      inspectrum sits near GNU Radio, osmocom tools, HackRF, BladeRF, RTL-SDR, SDRAngel,
      liquid-dsp, FFTW, SigMF, radioconda, and conda-forge packaging for radio/DSP
      workflows.
  sources:
    - https://api.github.com/repos/miek/inspectrum
    - https://api.github.com/repos/miek/inspectrum/releases
    - https://formulae.brew.sh/api/formula/inspectrum.json
    - https://github.com/miek/inspectrum
  summary:
    - >
      inspectrum is an offline signal-analysis application for captured radio samples,
      especially software-defined radio recordings. Its package-manager niche is
      practical DSP tooling: a Qt spectrogram viewer that turns raw capture files into
      measurements, symbol extraction, and exportable slices.
  timeline:
    - '2015: GitHub repository created and v0.1 release published.'
    - >
      2017: v0.2 added extra plots, cursors, symbol extraction, data export, and more
      sample formats.
    - '2020: v0.2.3 added real-valued sample support and Qt 5.15 build fixes.'
    - '2023: v0.3.1 added SigMF files and annotations.'
    - '2025: v0.4.0 added Qt 6 and SigMF dataset support.'
  usage:
    - >
      The documented usage is to run inspectrum against a capture file. The README lists
      common SDR sample extensions such as cf32, cs16, cu8, SigMF metadata/data pairs,
      MATLAB-style real samples, and HackRF/BladeRF/RTL-SDR-oriented integer formats.
    - >
      The tool is used after capture rather than during acquisition: users record
      samples with SDR hardware or another program, then inspect timing, symbol rates,
      modulation traces, and extracted regions offline.
related-packages:
  - id: brew:hackrf
    reason: >
      Use HackRF's capture tooling to record complex signed 8-bit samples, then open
      those recordings in inspectrum for offline visualization and measurement.
    rel: adjacent_workflow
    sources:
      - https://github.com/miek/inspectrum#readme
      - https://hackrf.readthedocs.io/en/latest/
  - id: brew:gnuradio
    reason: >
      GNU Radio can create complex floating-point recordings that inspectrum explicitly
      supports, allowing flowgraph-based capture followed by focused offline inspection.
    rel: adjacent_workflow
    sources:
      - https://github.com/miek/inspectrum#readme
      - https://wiki.gnuradio.org/index.php/Main_Page
category: science
