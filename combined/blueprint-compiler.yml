id: brew:blueprint-compiler
display-name: Blueprint Compiler
homepage: https://gnome.pages.gitlab.gnome.org/blueprint-compiler/
repo: https://gitlab.gnome.org/GNOME/blueprint-compiler
docs:
  - https://gnome.pages.gitlab.gnome.org/blueprint-compiler
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Blueprint Compiler is packaged broadly across Linux and Unix-like package managers
      in the input metadata, including Alpine, Debian, Fedora, Nix, Arch, Ubuntu,
      openSUSE, MacPorts, and Homebrew. The README also lists editor support in
      Workbench, GNOME Builder, Kate, Vim, Emacs, Visual Studio Code, Sublime Text, and
      Zed.
    - >
      Within GNOME app development it matters because it gives GTK 4 projects a source
      format that is friendlier to humans while preserving GtkBuilder XML as the
      generated artifact consumed by GTK.
  package-nerd-significance:
    - >
      Blueprint Compiler is significant because it is a language-tooling package for UI
      markup, not just a converter script. It packages a compiler, formatter,
      decompiler, and LSP around GTK's introspection metadata, which is exactly the sort
      of developer-tool dependency that quietly standardizes project layouts.
    - >
      For package maintainers, it is also a useful signal of modern GNOME app stacks:
      GTK 4, libadwaita-era UI definitions, Meson builds, and editor tooling converging
      around a small compiler executable.
  project-history:
    - >
      James Westman created Blueprint in 2021 to make GTK UI definitions easier to read
      and edit than verbose GtkBuilder XML. The README states that Blueprint adds no new
      GTK features; it makes existing GtkBuilder features more accessible and compiles
      into XML as part of an application's build system.
    - >
      The project grew from a compiler into a developer-tooling package with a
      formatter, decompiler, linter work, and a language server. Its NEWS file records
      steady releases from v0.2.0 through v0.20.x with improvements to type handling,
      diagnostics, decompilation, accessibility properties, and editor support.
  related-projects:
    - GtkBuilder XML is the generated target format.
    - GTK 4 and libadwaita are the main UI libraries used with Blueprint.
    - >
      Workbench, GNOME Builder, Kate, Vim, Emacs, Visual Studio Code, Sublime Text, and
      Zed are documented editor surfaces.
  sources:
    - https://gitlab.gnome.org/GNOME/blueprint-compiler
    - https://gitlab.gnome.org/GNOME/blueprint-compiler/-/raw/main/NEWS.md
    - https://gitlab.gnome.org/GNOME/blueprint-compiler/-/raw/main/README.md
    - https://gnome.pages.gitlab.gnome.org/blueprint-compiler
    - source_facts.package-manager
  summary:
    - >
      Blueprint Compiler is GNOME's compiler and language-server tooling for Blueprint,
      a concise markup language that compiles to GtkBuilder XML for GTK 4 user
      interfaces.
  timeline:
    - "2021: Project created under James Westman's copyright notice."
    - '2022: v0.2.0 tag published in the official Git repository.'
    - '2023: v0.8.x releases documented language and XML-output fixes.'
    - >
      2024: v0.12.0 and v0.14.0 added formatter, decompiler, language-server, and
      diagnostics improvements.
    - >
      2026: v0.20.x NEWS records linter work, minify output, libgirepository loading,
      and expanded language-server completions.
  usage:
    - >
      Developers write .blp Blueprint files, import GTK or library namespaces, and run
      blueprint-compiler in a build system to emit GtkBuilder .ui XML. The language
      server and editor integrations support completion, hover information, diagnostics,
      formatting, and navigation.
    - >
      The compiler is especially useful in Meson/GNOME workflows where UI files are
      generated during the build but still reviewed and maintained as readable source.
related-packages:
  - id: brew:gtk4
    reason: >
      GTK 4 is the runtime and widget toolkit targeted by Blueprint; the compiler
      translates Blueprint source into GtkBuilder UI definitions for GTK 4 applications.
    rel: adjacent_workflow
    sources:
      - https://gnome.pages.gitlab.gnome.org/blueprint-compiler/
      - https://docs.gtk.org/gtk4/class.Builder.html
  - id: brew:libadwaita
    reason: >
      Install libadwaita when Blueprint interfaces use the documented `Adw` namespace
      and GNOME's adaptive application widgets.
    rel: adjacent_workflow
    sources:
      - https://gnome.pages.gitlab.gnome.org/blueprint-compiler/reference/document_root.html
      - https://gnome.pages.gitlab.gnome.org/libadwaita/doc/main/
  - id: brew:gnome-builder
    reason: >
      GNOME Builder provides built-in Blueprint language support and a GNOME-focused
      build environment for projects that compile `.blp` files.
    rel: adjacent_workflow
    sources:
      - https://gnome.pages.gitlab.gnome.org/blueprint-compiler/
      - https://builder.readthedocs.io/
category: developer-tools
