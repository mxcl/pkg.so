id: brew:bfs
display-name: bfs
homepage: https://tavianator.com/projects/bfs.html
repo: https://github.com/tavianator/bfs
docs:
  - https://tavianator.com/projects/bfs.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bfs has unusually broad packaging for a small Unix utility. Its README lists
      packages for Alpine, Arch, Debian/Ubuntu, Fedora, Gentoo, Guix, macOS, and other
      systems, and the input separately records Homebrew, MacPorts, Nix, pacman, zypper,
      Debian, Ubuntu, and Alpine packaging.
    - >
      That packaging footprint reflects the niche: bfs is not a replacement for every
      find use, but it is attractive to users who want familiar find syntax with better
      traversal behavior, diagnostics, and cross-platform consistency.
  package-nerd-significance:
    - >
      bfs is notable to package-focused users because it reimagines one of Unix's oldest
      daily-driver commands without throwing away compatibility. That makes it a rare
      modern system utility that can be installed next to the base tool and immediately
      compared on real workflows.
    - >
      Its significance is not just breadth-first search. The interesting packaging story
      is a small, carefully maintained C utility earning broad distro adoption by being
      faster to understand than find, stricter about warning users when expressions are
      probably wrong, and portable enough to ship across Linux and macOS ecosystems.
  project-history:
    - >
      The official repository was created in June 2015. Early tags show a pre-1.0 series
      before the project reached 1.0 in 2017, followed by 2.0 in October 2020, 3.0 in
      July 2023, 4.0 in August 2024, and active 4.1.x maintenance through June 2026.
    - >
      The README documents the core design choice: unlike traditional depth-first find
      traversal, bfs lists shallower paths first. Around that foundation it adds
      compatibility with several find dialects, argument-order leniency, typo
      suggestions, expression warnings, and convenience extensions such as -exclude and
      -nohidden.
  related-projects:
    - >
      Related projects include POSIX find, GNU findutils, BSD find implementations, fd
      for simple name-based search, and locate/plocate for indexed filename search.
  sources:
    - https://api.github.com/repos/tavianator/bfs
    - https://api.github.com/repos/tavianator/bfs/releases
    - https://raw.githubusercontent.com/tavianator/bfs/main/README.md
    - https://raw.githubusercontent.com/tavianator/bfs/main/docs/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      bfs is a C implementation of a breadth-first variant of the Unix find command. It
      aims to remain compatible with POSIX, GNU, BSD, and macOS find behavior while
      adding a friendlier command-line parser, diagnostics, and practical extensions.
  timeline:
    - '2015: Repository created in June.'
    - '2017: 1.0 released.'
    - '2020: 2.0 released in October.'
    - '2023: 3.0 released in July.'
    - '2024: 4.0 released in August.'
    - '2026: 4.1.4 released in June.'
  usage:
    - >
      Users run bfs much like find: searching directory trees by name, type, size,
      metadata, predicates, and actions. Its breadth-first order can surface shallow
      matches earlier, and its parser accepts common argument placements that
      traditional find variants reject.
    - >
      The tool is also useful in scripts when its extensions matter, but its package
      value is strongest for interactive shell use where friendlier errors and faster
      discovery of shallow matches save time.
related-packages:
  - id: brew:findutils
    reason: >
      Choose GNU findutils when scripts require the established GNU find and xargs
      behavior; choose bfs when find-like compatibility plus breadth-first traversal and
      friendlier diagnostics are more valuable.
    rel: alternative
    sources:
      - https://tavianator.com/projects/bfs.html
      - https://www.gnu.org/software/findutils/
      - https://www.gnu.org/software/findutils/manual/html_mono/find.html
  - id: brew:fd
    reason: >
      Choose fd for concise interactive name and path searches with opinionated defaults
      such as hidden-file and ignore handling; choose bfs when the richer find
      expression language and compatibility matter.
    rel: alternative
    sources:
      - https://tavianator.com/projects/bfs.html
      - https://github.com/sharkdp/fd#readme
category: system
