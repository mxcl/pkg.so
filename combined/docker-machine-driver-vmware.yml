id: brew:docker-machine-driver-vmware
display-name: Docker Machine VMware Driver
homepage: https://www.vmware.com/products/personal-desktop-virtualization.html
repo: https://github.com/machine-drivers/docker-machine-driver-vmware
docs:
  - https://github.com/machine-drivers/docker-machine-driver-vmware#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents installation from GitHub releases, Homebrew, and Go source.
      That suggests adoption mostly by macOS and workstation users who still relied on
      Docker Machine's VM-driver model after Docker Desktop and other local-container
      workflows became more common.
  package-nerd-significance:
    - >
      This package is a good example of the Docker Machine driver plugin ecosystem: a
      single binary on PATH extends docker-machine with a provider-specific backend. For
      Homebrew users, it kept an otherwise manual driver install reproducible and
      upgradeable.
  project-history:
    - >
      The README frames the driver as a Docker Machine plugin for creating machines on
      VMware Fusion and Workstation. It explicitly distinguishes itself from Docker
      Machine's built-in vmwarefusion driver: the external vmware driver also supports
      VMware Workstation, while vmwarefusion is limited to VMware Fusion.
  related-projects:
    - >
      Related projects include Docker Machine, boot2docker, VMware Fusion, VMware
      Workstation, and other machine-drivers organization plugins.
  sources:
    - https://github.com/machine-drivers/docker-machine-driver-vmware#readme
    - https://github.com/docker/machine#readme
  summary:
    - >
      Docker Machine VMware Driver is an external docker-machine driver for provisioning
      local Docker hosts on VMware Fusion and VMware Workstation. Its niche is making
      the docker-machine workflow work across both VMware desktop products instead of
      only the built-in vmwarefusion driver.
  timeline:
    - >
      Docker Machine plugin era: The driver follows docker-machine's external driver
      binary model.
    - >
      VMware desktop support: The README documents VMware Workstation 14 and VMware
      Fusion 10 as supported baselines.
    - >
      Package-manager availability: The README documents Homebrew installation for macOS
      users.
  usage:
    - >
      The normal workflow is docker-machine create --driver=vmware default, with options
      for boot2docker images, configdrive cloud-init, CPU count, disk size, memory,
      network type, shared-folder behavior, SSH user/password, and IP wait time. It
      requires VMware Workstation 14 or VMware Fusion 10 or newer as the supported host
      virtualization layer.
related-packages:
  - id: brew:docker-machine
    reason: >
      Docker Machine is the host CLI that discovers this executable and invokes it to
      create VMware-backed Docker hosts.
    rel: adjacent_workflow
    sources:
      - https://github.com/machine-drivers/docker-machine-driver-vmware#readme
      - https://gitlab.com/gitlab-org/ci-cd/docker-machine/-/raw/main/README.md
