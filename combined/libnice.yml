id: brew:libnice
display-name: libnice
homepage: https://wiki.freedesktop.org/nice/
repo: https://gitlab.freedesktop.org/libnice/libnice
docs:
  - https://libnice.freedesktop.org/
  - https://libnice.freedesktop.org/libnice
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libnice became important wherever GNOME/GLib, GStreamer, SIP, XMPP Jingle, and
      WebRTC-style peer-to-peer media needed ICE without embedding a full browser stack.
      The project page states that it has been tested for interoperability with Google's
      WebRTC library and with older Microsoft real-time communication implementations.
  package-nerd-significance:
    - >
      libnice sits at a dense packaging junction: GLib, GStreamer, STUN, TURN, ICE,
      WebRTC interop, and freedesktop hosting. It matters because real-time
      communication stacks can depend on it without directly vendoring browser
      networking code.
  project-history:
    - >
      The project released 0.0.1 in November 2008 and 0.1.0 in January 2011. Its
      documentation frames the library around ICE standards work, first RFC 5245 and
      later RFC 8445, with compatibility paths for older STUN, early ICE drafts, Google
      Talk, and Microsoft variants.
    - >
      Collabora sponsored libnice, and the release tags show long-running maintenance by
      Youness Alaoui and Olivier Crete. The project uses freedesktop.org GitLab as
      upstream and explicitly directs issues and merge requests there rather than to
      mirrors.
  related-projects:
    - >
      Related standards and protocols include RFC 8445 ICE, RFC 5245 ICE, RFC 5389 STUN,
      RFC 5766 TURN, RFC 6544 ICE-TCP, and RFC 8838 trickle ICE.
    - >
      Related software ecosystems named by the project include GLib, GStreamer, SIP,
      XMPP Jingle, WebRTC, Google Talk, Microsoft Lync, and Skype for Business.
  sources:
    - >
      https://gitlab.freedesktop.org/api/v4/projects/libnice%2Flibnice/repository/tags?per_page=100
    - https://libnice.freedesktop.org/
    - https://libnice.freedesktop.org/libnice/
  summary:
    - >
      libnice is the freedesktop.org GLib implementation of Interactive Connectivity
      Establishment, the NAT traversal technique used by real-time communication
      systems. It provides a GLib library, STUN/TURN support, pseudo-TCP support, and
      GStreamer elements.
  timeline:
    - '2008-11-05: GitLab tag metadata records libnice 0.0.1.'
    - '2011-01-20: GitLab tag metadata records libnice 0.1.0.'
    - '2015-04-28: GitLab tag metadata records libnice 0.1.13.'
    - '2020-10-20: GitLab tag metadata records libnice 0.1.18.'
    - '2025-11-27: GitLab tag metadata records libnice 0.1.23.'
  usage:
    - >
      Applications create a NiceAgent, add streams, gather candidates, exchange
      credentials and candidates, and then move data through libnice APIs or through
      nicesrc and nicesink GStreamer elements. The reference manual separates ICE, STUN,
      TURN, and pseudo-TCP APIs.
related-packages:
  - id: brew:gstreamer
    reason: >
      Use GStreamer with libnice when carrying real-time media through ICE: libnice
      officially supplies nicesrc and nicesink elements for insertion into GStreamer
      pipelines.
    rel: adjacent_workflow
    sources:
      - https://libnice.freedesktop.org/
      - https://gstreamer.freedesktop.org/documentation/
  - id: brew:coturn
    reason: >
      Use coturn as the deployed TURN relay service when a libnice NiceAgent needs relay
      candidates because direct peer-to-peer connectivity cannot be established.
    rel: adjacent_workflow
    sources:
      - https://libnice.freedesktop.org/libnice/class.Agent.html
      - https://github.com/coturn/coturn#readme
category: networking
