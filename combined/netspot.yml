history:
  adoption-history:
    - >
      NetSpot's official release history says the product received a Macworld Editors'
      Choice award in 2012. The Windows edition arrived in 2016, followed by Pro and
      Enterprise Windows editions in 2017. Official documentation now covers macOS,
      Windows, Android, and iOS/iPadOS editions.
  package-nerd-significance:
    - >
      NetSpot packages radio-frequency surveying and Wi-Fi discovery into a desktop
      application that is easy to install through a graphical package manager. It is
      notable for serving both casual channel inspection and professional heatmap-based
      site surveys without requiring a separate command-line wireless toolkit.
  project-history:
    - >
      NetSpot began as a Mac-focused Wi-Fi site-survey application and was described by
      its publisher as the first such tool released for Mac. It subsequently expanded to
      Windows and mobile companion editions while retaining Inspector and Survey as its
      central workflows.
  related-projects:
    - >
      NetSpot's mobile editions for Android and iOS/iPadOS complement the desktop survey
      application; the official iOS documentation explicitly recommends using the mobile
      app as a companion to NetSpot for desktop.
  sources:
    - https://www.netspotapp.com/help/
    - https://www.netspotapp.com/help/netspot-for-ios-manual/
    - https://www.netspotapp.com/help/netspot-for-windows-is-released-and-is-free/
    - https://www.netspotapp.com/help/netspot-pro-enterprise-for-windows/
  summary:
    - >
      NetSpot is a cross-platform Wi-Fi analyzer and site-survey product. It combines
      live network inspection with measured or predictive coverage maps and
      troubleshooting visualizations.
  timeline:
    - "2012: NetSpot received a Macworld Editors' Choice award, according to its publisher."
    - '2016: The free Windows edition was released.'
    - '2017: Pro and Enterprise editions became available on Windows.'
  usage:
    - >
      Use Inspector mode for live SSID, signal, noise, channel, and security
      observations. Use Survey mode to record measurements against a floor plan and
      produce coverage heatmaps; Planning mode supports predictive layouts.
