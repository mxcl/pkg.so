id: brew:mpop
display-name: mpop
homepage: https://marlam.de/mpop/
repo: https://git.marlam.de/git/mpop.git
docs:
  - https://marlam.de/mpop/documentation
  - https://marlam.de/mpop/mpop.html
config-file-location:
  unix:
    - ~/.mpoprc
    - $XDG_CONFIG_HOME/mpop/config
credentials-file-location:
  unix: ~/.netrc
history:
  project-history:
    - >
      Its history is mostly a steady hardening of a Unix mail pipeline tool rather than
      a move into a larger mail suite. The 1.4.0 stable series in 2018 discouraged
      OpenSSL in favor of GnuTLS, moved IDN support to libidn2, disabled GNU SASL by
      default, and dropped obsolete systems and weak authentication choices. Later
      releases added OAuth-oriented authentication support: OAUTHBEARER in 2019, XOAUTH2
      in 2020, libtls support in 2020, SCRAM-SHA-256 via GNU SASL in 2021, and a minimal
      mpopd POP3 server in 2021 for mail clients that cannot read local mail stores
      directly.
  sources:
    - https://github.com/marlam/mpop/blob/master/AUTHORS
    - https://marlam.de/mpop/
    - https://marlam.de/mpop/documentation/
    - https://marlam.de/mpop/download/
    - https://marlam.de/mpop/mpop.html
    - https://marlam.de/mpop/news/
  summary:
    - >
      mpop is Martin Lambers' compact POP3 retrieval client, part of the same
      small-mail-utilities lineage as msmtp. The project news says the first public mpop
      release, 0.1.0, was published on 2004-06-08, eleven months after msmtp, and the
      AUTHORS file says much of the code is shared with msmtp. The manual and project
      pages describe the package as a GPL mail retriever that can poll one or more POP3
      mailboxes, skip mail already delivered by tracking UIDLs, filter headers before
      downloading a message, and deliver through an MDA, to maildir, or to mbox.
  usage:
    - >
      mpop's niche is narrower and more scriptable than fetchmail. Its own documentation
      compares it with fetchmail by emphasizing no daemon mode, use from cron, no IMAP
      or multidrop support, faster POP3 command pipelining, direct maildir and mbox
      delivery, and header filtering that can reject junk before a full message
      download. In practice it is used by people who want local control over incoming
      mail with normal Unix tools such as procmail, SpamAssassin, cron, netrc, and local
      mailbox formats rather than a GUI mail client doing retrieval itself.
related-packages:
  - id: brew:fetchmail
    reason: >
      Choose fetchmail when you need features mpop deliberately omits, including IMAP
      retrieval, multidrop mailboxes, or a built-in daemon mode.
    rel: alternative
    sources:
      - https://marlam.de/mpop/documentation/
      - https://www.fetchmail.info/fetchmail-man.html
  - id: brew:msmtp
    reason: >
      Use msmtp as the SMTP delivery component in an mpop workflow when retrieved mail
      must be forwarded through an SMTP server.
    rel: adjacent_workflow
    sources:
      - https://marlam.de/mpop/documentation/
      - https://marlam.de/msmtp/
category: networking
package-manager:
  apk: mpop
  brew: mpop
  debian: mpop
  dnf: mpop
  macports: mpop
  nix: mpop
  pacman: mpop
  ubuntu: mpop
  zypper: mpop
package-manager-url: https://formulae.brew.sh/formula/mpop
license: GPL-3.0-or-later
tags:
  - cli
  - email
  - mail-retrieval
  - maildir
  - mbox
  - pop3
description: POP3 client
executables:
  - mpop
  - mpopd
provenance:
  formula: mpop
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
