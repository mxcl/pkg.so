id: brew:basedpyright
display-name: basedpyright
homepage: https://docs.basedpyright.com
repo: https://github.com/DetachHead/basedpyright
docs:
  - https://docs.basedpyright.com/latest
config-file-location:
  unix:
    - <project-root>/pyrightconfig.json
    - <project-root>/pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      basedpyright is distributed through several developer channels: PyPI, the Visual
      Studio Marketplace, Open VSX, Sublime Text Package Control, Homebrew, and Nix
      according to the README badges and input metadata. That spread reflects its role
      as both a CLI checker and language server.
    - >
      A major adoption hook is that users can install it from PyPI without Node.js,
      while the VS Code extension uses the same version to avoid different diagnostics
      between editor and CLI.
  package-nerd-significance:
    - >
      basedpyright is important in package-manager culture because it repackages a
      Node-centered Python type checker as a Python-installable tool and aligns editor
      and CLI versions. That solves a real packaging pain point for Python projects that
      want type checking without a JavaScript toolchain.
    - >
      It also shows a common modern fork pattern: take a successful corporate-backed
      open-source core, add stricter defaults and features withheld in a closed
      extension, and distribute it through every editor/package channel where Python
      developers already work.
  project-history:
    - >
      The official documentation describes basedpyright as a Pyright fork with
      type-checking improvements, Pylance features, and more. Its documentation site and
      README both point to the GitHub repository and organize the project around
      benefits over upstream Pyright.
    - >
      The release stream tracks upstream Pyright closely. The latest documentation
      canonical URL observed for this batch was v1.39.9, and GitHub release metadata for
      v1.39.9 names the paired Pyright version as 1.1.411.
  related-projects:
    - Pyright is the upstream Microsoft type checker that basedpyright forks.
    - >
      Pylance is Microsoft's closed-source VS Code extension whose features basedpyright
      reimplements for wider editor use.
    - >
      Mypy, Pyre, and pytype are related Python static type checkers, but basedpyright's
      direct lineage is Pyright.
  sources:
    - https://docs.basedpyright.com/latest
    - https://docs.basedpyright.com/latest/benefits-over-pyright/
    - https://github.com/DetachHead/basedpyright#readme
    - https://github.com/DetachHead/basedpyright/releases
    - source_facts.package-manager
  summary:
    - >
      basedpyright is a fork of Microsoft's Pyright type checker and language server for
      Python. It adds stricter defaults, additional diagnostics, PyPI distribution,
      version pinning, and reimplemented Pylance features for editors outside VS Code.
  timeline:
    - >
      2020s: basedpyright forked Pyright to add stricter checks, Pylance-like features,
      and packaging changes.
    - >
      2020s: Documentation organized a Benefits over Pyright section covering baselines,
      better defaults, new diagnostics, and language-server improvements.
    - >
      2026: v1.39.9 was published with Pyright 1.1.411 alignment according to GitHub
      release metadata.
  usage:
    - >
      Users run basedpyright as a command-line type checker or basedpyright-langserver
      as an editor language server. Configuration follows Pyright-style project
      configuration in pyrightconfig.json or pyproject.toml.
    - >
      The docs emphasize stricter defaults, new diagnostic rules, baseline support for
      adopting those rules in existing projects, and Pylance-like language-server
      behavior outside Microsoft's closed-source Pylance extension.
related-packages:
  - id: brew:pyright
    reason: >
      Choose upstream Pyright for Microsoft's original standards-focused checker; choose
      basedpyright for stricter defaults, PyPI-first installation, baselines, and
      additional language-server features.
    rel: alternative
    sources:
      - https://docs.basedpyright.com/latest/
      - https://docs.basedpyright.com/latest/benefits-over-pyright/
      - https://github.com/microsoft/pyright#readme
  - id: brew:mypy
    reason: >
      Choose mypy for its independent checker ecosystem and plugin model; choose
      basedpyright for Pyright-style inference, performance, and language-server
      integration.
    rel: alternative
    sources:
      - https://docs.basedpyright.com/latest/usage/mypy-comparison/
      - https://mypy.readthedocs.io/
category: developer-tools
package-manager:
  brew: basedpyright
  nix: basedpyright
package-manager-url: https://formulae.brew.sh/formula/basedpyright
license: MIT
tags:
  - cli
  - language-server
  - pylance
  - pyright
  - python
  - type-checker
description: Pyright fork with various improvements and built-in pylance features
executables:
  - basedpyright
  - basedpyright-langserver
provenance:
  formula: basedpyright
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
