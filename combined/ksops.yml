id: brew:ksops
display-name: KSOPS
homepage: https://github.com/viaduct-ai/kustomize-sops
repo: https://github.com/viaduct-ai/kustomize-sops
docs:
  - https://github.com/viaduct-ai/kustomize-sops#readme
config-file-location:
  unix: .sops.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      KSOPS is aimed at teams already using kustomize, SOPS, and GitOps workflows rather
      than at general secret storage. Its adoption footprint is therefore narrow but
      practical: it is packaged as a Homebrew formula and documented as an installable
      CLI-style kustomize plugin.
  package-nerd-significance:
    - >
      KSOPS is interesting to package people because it packages a kustomize exec plugin
      as a normal command-line artifact, bridging Kubernetes configuration tooling,
      Git-stored encrypted files, and local package-manager installation.
  project-history:
    - >
      The README says Viaduct built KSOPS after finding no solution compatible with its
      Kubernetes GitOps stack for managing secrets. The project connects kustomize to
      SOPS and documents integration with Argo CD so encrypted manifests can be managed
      like other Kubernetes manifests.
  related-projects:
    - >
      Related projects include kustomize, SOPS, Argo CD, Kubernetes Secrets, and GitOps
      workflows.
  sources:
    - https://github.com/viaduct-ai/kustomize-sops
    - https://github.com/viaduct-ai/kustomize-sops/releases
    - https://github.com/viaduct-ai/kustomize-sops/tags
  summary:
    - >
      KSOPS is a kustomize-SOPS plugin for decrypting SOPS-encrypted Kubernetes
      resources during kustomize builds. It sits in the GitOps secrets-management niche
      where teams want encrypted manifests in Git but plain Kubernetes objects at apply
      time.
  timeline:
    - 'v1.0: The repository has a public v1.0 tag for the early KSOPS release line.'
    - 'v2.x: Later tags track the second major release line of the kustomize-SOPS plugin.'
    - 'v3.x: The repository tags include a third major release line for the plugin.'
  usage:
    - >
      Typical use is to define SOPS creation rules in .sops.yaml, add a KSOPS generator
      to kustomization.yaml, and run kustomize with plugin support so encrypted Secrets
      or ConfigMaps are decrypted during the build.
related-packages:
  - id: brew:sops
    reason: >
      SOPS encrypts the resource files that KSOPS decrypts while Kustomize builds
      Kubernetes manifests.
    rel: adjacent_workflow
    sources:
      - https://github.com/viaduct-ai/kustomize-sops#getting-started-tutorial
      - https://getsops.io/docs/
  - id: brew:kustomize
    reason: >
      Kustomize loads KSOPS as a generator plugin, so it is the manifest-building
      command used to execute the KSOPS workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/viaduct-ai/kustomize-sops#overview
      - https://kubectl.docs.kubernetes.io/references/kustomize/
  - id: brew:argocd
    reason: >
      KSOPS documents an Argo CD integration for decrypting SOPS resources as part of a
      Kubernetes GitOps deployment.
    rel: adjacent_workflow
    sources:
      - https://github.com/viaduct-ai/kustomize-sops#argo-cd-integration-
      - https://argo-cd.readthedocs.io/
category: security
package-manager:
  brew: ksops
package-manager-url: https://formulae.brew.sh/formula/ksops
license: Apache-2.0
tags:
  - cli
  - kubernetes
  - kustomize
  - secrets
  - sops
description: Flexible Kustomize Plugin for SOPS Encrypted Resources
executables:
  - ksops
provenance:
  formula: ksops
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
