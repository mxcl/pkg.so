id: brew:miniserve
display-name: miniserve
homepage: https://github.com/svenstaro/miniserve
repo: https://github.com/svenstaro/miniserve
docs:
  - https://github.com/svenstaro/miniserve#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project grew beyond the classic directory-listing use case into a compact
      file-sharing tool. Its README documents single-file and directory serving, custom
      index files, SPA fallback, password authentication, uploads, directory creation,
      TLS, random routes, QR-code access, archive downloads, README rendering, range
      requests, health checks, and WebDAV support. Under the hood it is a Rust/Actix
      application packaged as a single binary, positioning it near tools such as
      Python's simple HTTP server for convenience but with more built-in sharing
      features.
  sources:
    - https://formulae.brew.sh/formula/miniserve
    - https://github.com/svenstaro/miniserve
    - https://github.com/svenstaro/miniserve/blob/master/Cargo.toml
  summary:
    - >
      miniserve is a Rust command-line static file server from the svenstaro/miniserve
      project, with Cargo metadata naming Sven-Hendrik Haase and Boastful Squirrel as
      authors. Its niche is the fast ad hoc HTTP server: a user points it at a file or
      directory and gets a browsable download page without configuring a full web
      server.
  usage:
    - >
      In package-manager terms, miniserve is a small CLI utility with unusually broad
      distribution for its size: the Homebrew formula ships it as a high-performance
      static file server, and the input record also lists Alpine, MacPorts, Nix, Arch,
      Scoop, and WinGet packages. In practice it is used for temporary LAN sharing,
      quick artifact downloads, lightweight upload endpoints, and local static-site
      previews.
related-packages:
  - id: brew:darkhttpd
    reason: >
      Choose darkhttpd for a smaller C server focused strictly on static files and
      command-line configuration; choose miniserve when uploads, authentication, QR
      codes, archives, SPA routing, or WebDAV are useful.
    rel: alternative
    sources:
      - https://github.com/svenstaro/miniserve#readme
      - https://unix4lyfe.org/darkhttpd/
      - https://github.com/emikulic/darkhttpd
  - id: brew:caddy
    reason: >
      Choose Caddy for a persistent web-server or reverse-proxy deployment with
      automatic HTTPS and reloadable configuration; choose miniserve for immediate,
      temporary file serving from one command.
    rel: alternative
    sources:
      - https://github.com/svenstaro/miniserve#readme
      - https://caddyserver.com/docs/quick-starts/static-files
      - https://caddyserver.com/docs/automatic-https
category: networking
