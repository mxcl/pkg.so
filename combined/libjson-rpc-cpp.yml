id: brew:libjson-rpc-cpp
display-name: libjson-rpc-cpp
homepage: https://github.com/cinemast/libjson-rpc-cpp
repo: https://github.com/cinemast/libjson-rpc-cpp
docs:
  - https://github.com/cinemast/libjson-rpc-cpp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README lists distro and package-manager installation paths for
      Debian, Ubuntu, Fedora, Arch, Gentoo, Homebrew, and Windows. It also records
      historical users or references such as NASA Ames, cpp-ethereum, XBMC examples, and
      Bitcoin-related C++ API tooling.
  package-nerd-significance:
    - >
      It is a classic mid-2010s C++ network library package: CMake, system libraries,
      optional transports, generated stubs, and distro-specific split packages for
      runtime libraries and tools. That makes it useful for understanding how JSON-RPC
      tooling was packaged before newer single-header C++17 libraries became common.
  project-history:
    - >
      The project was public on GitHub by 2013 and developed as a cross-platform
      CMake-based library for Linux and OS X. Its README advertises ready-to-use HTTP
      and TCP client/server connectors, a clean extension-oriented architecture, and
      optional build flags for transport backends and examples.
    - >
      The README also points readers to json-rpc-cxx, a newer C++17 header-only
      implementation by the same author, which frames libjson-rpc-cpp as the older
      compiled-library generation of that author's JSON-RPC work.
  related-projects:
    - >
      Related projects include json-rpc-cxx, jsoncpp, libcurl, GNU libmicrohttpd,
      hiredis, and applications that used JSON-RPC APIs such as cpp-ethereum and
      XBMC/Kodi examples.
  sources:
    - https://formulae.brew.sh/formula/libjson-rpc-cpp
    - https://github.com/cinemast/libjson-rpc-cpp
    - https://github.com/cinemast/libjson-rpc-cpp/tags
  summary:
    - >
      libjson-rpc-cpp is a C++ framework for building JSON-RPC clients and servers, with
      support for JSON-RPC 2.0 and partial support for JSON-RPC 1.0. Its distinctive
      packaging feature is jsonrpcstub, a generator that turns a procedure specification
      into C++, JavaScript, or Python stubs.
  timeline:
    - '2013-02-07: The 0.1 tag points at an early public GitHub commit.'
    - '2016-08-10: v0.7.0 release branch was merged.'
    - >
      2010s: README documents installation through Debian/Ubuntu, Fedora, Arch, Gentoo,
      Homebrew, and Windows packages.
    - >
      Later: The README points users to json-rpc-cxx as a newer C++17 header-only
      implementation.
  usage:
    - >
      Typical use starts with a JSON procedure specification, then jsonrpcstub generates
      abstract server and client classes. Applications implement the generated server
      interface or link the generated client against libjsonrpccpp-common,
      libjsonrpccpp-server, libjsonrpccpp-client, and the selected transport
      dependencies.
related-packages: []
