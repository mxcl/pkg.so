id: brew:codeberg-cli
display-name: Codeberg CLI
homepage: https://codeberg.org/Aviac/codeberg-cli
repo: https://codeberg.org/Aviac/codeberg-cli
docs:
  - https://codeberg.org/Aviac/codeberg-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list distribution through Homebrew, Alpine APK, and Nix,
      showing that the tool escaped its upstream forge and reached common Unix package
      channels. Its official repository also advertised a crates.io package badge,
      consistent with Rust CLI distribution.
    - >
      Release metadata shows a short but multi-year maintenance arc from 2023 releases
      through v0.5.1 in 2025, after which the project was archived.
  package-nerd-significance:
    - >
      The package is interesting mostly as a transition artifact in the Forgejo/Codeberg
      tooling ecosystem: a third-party Rust CLI that filled a gap before users were
      steered toward a more official Forgejo CLI. For package maintainers, its archived
      status matters more than feature depth because downstream packages may need
      replacement or removal planning.
  project-history:
    - >
      The Codeberg repository was created on 2023-01-10. Codeberg's API describes it as
      a CLI tool for Forgejo similar to `gh`, `glab`, and `tea`, and the first public
      release, v0.1.0, was published on 2023-01-29.
    - >
      The README now begins with an archived notice saying the project was discontinued
      because of lack of maintainer time, and recommends `forgejo-contrib/forgejo-cli`
      as a similar, more official tool.
  related-projects:
    - >
      The README explicitly points users to
      https://codeberg.org/forgejo-contrib/forgejo-cli. The Codeberg API description
      also compares the tool to `gh`, `glab`, and `tea`.
  sources:
    - https://codeberg.org/Aviac/codeberg-cli
    - https://codeberg.org/api/v1/repos/Aviac/codeberg-cli
    - https://codeberg.org/api/v1/repos/Aviac/codeberg-cli/releases
  summary:
    - >
      Codeberg CLI was an independent command-line client for Codeberg and Forgejo-style
      forges, published as the `berg` command. Its own repository is now archived and
      directs users toward the better-maintained Forgejo CLI.
  timeline:
    - '2023-01-10: Codeberg repository created.'
    - '2023-01-29: v0.1.0 public release published.'
    - '2024-05-02: v0.4.0 release published.'
    - '2025-09-27: v0.5.1 release published.'
    - '2025: README marks the project archived and recommends Forgejo CLI.'
  usage:
    - >
      The intended use was to provide a forge CLI for Codeberg or Forgejo users,
      analogous to GitHub's `gh`, GitLab's `glab`, and Gitea's `tea`. The Homebrew
      formula exposes the `berg` executable.
related-packages:
  - id: brew:forgejo-cli
    reason: >
      Forgejo CLI is the upstream-recommended successor to the archived Codeberg CLI and
      provides maintained `fj` commands for Forgejo issues, pull requests, repositories,
      teams, and releases.
    rel: alternative
    sources:
      - https://codeberg.org/Aviac/codeberg-cli
      - https://codeberg.org/forgejo-contrib/forgejo-cli
category: developer-tools
package-manager:
  apk: codeberg-cli
  brew: codeberg-cli
  nix: codeberg-cli
package-manager-url: https://formulae.brew.sh/formula/codeberg-cli
license: AGPL-3.0-or-later
tags:
  - cli
  - codeberg
  - forge
  - git
  - version-control
description: CLI for Codeberg
executables:
  - berg
provenance:
  formula: codeberg-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
