id: brew:drone-cli
display-name: Drone CLI
homepage: https://drone.io
repo: https://github.com/harness/drone-cli
docs:
  - https://docs.drone.io/cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Drone CLI adoption tracks Drone adoption in self-hosted and cloud CI environments.
      The official installation docs show package-manager and direct binary installation
      paths, which made it natural to ship through Homebrew and similar package indexes
      for developers who need the same `drone` command locally and in automation.
  package-nerd-significance:
    - >
      For package maintainers, Drone CLI is a good example of a CI ecosystem client that
      is useful only when it stays aligned with its server API. The single `drone`
      executable, broad subcommand tree, and Homebrew formula make it a small but
      important bridge between hosted CI infrastructure and local developer shells.
  project-history:
    - >
      The CLI has historically followed Drone's server-side model: pipelines live with
      source repositories, while the command-line tool handles installation-time and
      day-two operations such as login/configuration, repository administration,
      signing, encryption, logs, and local execution helpers. Its repository now lives
      under Harness, reflecting Drone's later stewardship under the Harness
      organization.
  related-projects:
    - Drone server and Drone runners provide the CI runtime that the CLI administers.
    - The Drone documentation site is the primary command reference for the CLI.
    - >
      Harness is the current upstream organization for the `harness/drone-cli` source
      repository.
  sources:
    - https://github.com/harness/drone-cli
    - https://docs.drone.io/cli/install/
    - https://docs.drone.io/cli/configure/
    - https://docs.drone.io/cli/drone-exec/
    - https://docs.drone.io/cli/repo/drone-repo-ls/
  summary:
    - >
      Drone CLI is the command-line companion to Drone, the container-oriented
      continuous integration system. As a package, its importance is less about being a
      standalone product and more about giving operators, repository admins, and
      automation scripts a stable `drone` executable for talking to Drone servers.
  timeline:
    - >
      2010s: Drone becomes known as a container-native CI/CD system with a separate CLI
      for server interaction.
    - '2020s: Drone CLI source is maintained under the Harness GitHub organization.'
    - >
      Docs era: Official docs present the CLI as the supported command-line interface
      for installing, configuring, and operating Drone.
  usage:
    - >
      The official CLI docs organize usage around installation/configuration and
      subcommands for encryption, local execution, logs, signing, JSONNET conversion,
      users, and repositories. In practice, package users install it to administer Drone
      instances, inspect pipeline state, and script CI server operations.
related-packages: []
category: developer-tools
package-manager:
  apk: drone-cli
  brew: drone-cli
  nix: drone-cli
  pacman: drone-cli
  scoop: main/drone
package-manager-url: https://formulae.brew.sh/formula/drone-cli
license: Apache-2.0
tags:
  - ci-cd
  - cli
  - continuous-integration
  - devops
  - drone
description: Command-line client for the Drone continuous integration server
executables:
