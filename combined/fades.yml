id: brew:fades
display-name: fades
homepage: https://fades.readthedocs.io/
repo: https://github.com/PyAr/fades
docs:
  - https://fades.readthedocs.io/en/latest
  - https://fades.readthedocs.io/en/latest/readme.html
config-file-location:
  unix:
    - /etc/fades/fades.ini
    - $XDG_CONFIG_HOME/fades/fades.ini
    - .fades.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      fades has remained a specialist Python-packaging utility rather than a mainstream
      workflow manager. Its official materials show packaging and distribution across
      PyPI, Read the Docs, Snap/AppVeyor-era CI badges, and Debian/Ubuntu guidance,
      while the Homebrew formula gives macOS command-line users another route to install
      it.
  package-nerd-significance:
    - >
      For package-manager users, fades is an example of a pre-`uv` and
      pre-modern-tooling answer to one-off Python script isolation. It sits between raw
      `virtualenv`, `pip`, and full project tools: a small executable whose point is
      making transient script environments feel automatic.
  project-history:
    - >
      The public project history visible in the official GitHub releases starts with 1.0
      and 2.0 tags and continues through major releases such as v4, v6, v7, v8, and v9.
      The README presents the central design unchanged across that line: fades creates
      or reuses a virtual environment, installs dependencies, then runs the child script
      or opens an interpreter inside that environment.
  related-projects:
    - virtualenv, pip, requirements.txt workflows, pipx, pip-run, uv
  sources:
    - https://github.com/PyAr/fades
    - https://raw.githubusercontent.com/PyAr/fades/master/README.rst
    - https://fades.readthedocs.io/en/latest/readme.html
    - https://api.github.com/repos/PyAr/fades/releases?per_page=50
  summary:
    - >
      fades is a Python command-line tool from the PyAr organization for running scripts
      in automatically created or reused virtual environments. Its niche is small Python
      programs: the authoring model is to invoke a script through fades, mark
      dependencies inline, in requirements files, docstrings, or command-line options,
      and let the tool build the environment before execution.
  timeline:
    - '2015: Official GitHub releases include 1.0 and 2.0-era tags.'
    - '2017: v6 release published.'
    - '2018: v7 release published.'
    - '2019: v8.1 release published.'
    - '2020: v9.0 and v9.0.1 releases published.'
  usage:
    - >
      Typical usage is `fades myscript.py`, often paired with a `#!/usr/bin/env fades`
      shebang. Dependencies can be marked next to imports with `# fades`, supplied with
      `--dependency`, read from requirement files, or listed in a docstring section,
      after which fades chooses or creates the matching virtual environment.
related-packages:
  - id: brew:uv
    reason: >
      Choose uv when you want PEP 723 script execution plus Python installation,
      locking, project, and workspace workflows; fades provides a smaller
      script-centered virtual-environment runner.
    rel: alternative
    sources:
      - https://fades.readthedocs.io/en/latest/readme.html
      - https://docs.astral.sh/uv/guides/scripts/
  - id: brew:pipx
    reason: >
      Choose pipx primarily to install and expose Python command-line applications in
      isolated environments; fades is primarily designed to provision environments for
      scripts and helper commands.
    rel: alternative
    sources:
      - https://fades.readthedocs.io/en/latest/readme.html
      - https://pipx.pypa.io/stable/
category: developer-tools
package-manager:
  brew: fades
  debian: fades
  ubuntu: fades
package-manager-url: https://formulae.brew.sh/formula/fades
license: GPL-3.0-only
tags:
  - cli
  - dependencies
  - python
  - scripts
  - virtualenv
description: Automatically handle virtualenvs for python scripts
executables:
  - fades
provenance:
  formula: fades
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
