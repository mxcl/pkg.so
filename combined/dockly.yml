id: brew:dockly
display-name: Dockly
homepage: https://lirantal.github.io/dockly/
repo: https://github.com/lirantal/dockly
docs:
  - https://github.com/lirantal/dockly#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dockly's README records visibility beyond package-manager listings: it says the
      project was featured or highlighted by Awesome Docker, DevOps Weekly, Terminals
      Are Sexy, Programmer's Weekly, Console.dev, Admin Magazine, and other community
      mentions.
    - >
      The npm registry and Homebrew gave it two distinct install channels. npm metadata
      records 3.24.5, while the Homebrew formula API reported stable 3.24.5, 26 installs
      in the previous 30 days, and 429 installs in the previous year as of June 30,
      2026.
  package-nerd-significance:
    - >
      Dockly is significant as a packaged terminal dashboard: it wraps Docker daemon
      operations in a full-screen TUI while remaining installable as a normal CLI. Its
      history is also a snapshot of the era when Node-based terminal apps made
      infrastructure tools feel interactive without leaving the shell.
  project-history:
    - >
      The GitHub repository was created in October 2016 and the npm package was
      published days later. Dockly belongs to the late-2010s wave of rich terminal
      dashboards built on Node.js terminal UI libraries, offering an interactive
      alternative to repeated `docker ps`, `docker logs`, and container-management
      commands.
    - >
      By 2018, releases were already in the v3.x line, and maintenance continued through
      v3.24.5 in April 2025. The README documents local Docker socket use, remote daemon
      options, container filters, and running Dockly itself inside Docker.
  related-projects:
    - >
      Dockly is adjacent to Docker CLI workflows, Docker daemon API clients, and
      terminal UI projects listed under Awesome Docker's terminal tools.
    - >
      Its README points users to the Awesome Docker terminal section for similar Docker
      terminal-management tools.
  sources:
    - https://github.com/lirantal/dockly#readme
    - https://api.github.com/repos/lirantal/dockly
    - https://registry.npmjs.org/dockly
    - https://github.com/lirantal/dockly/releases/tag/v3.24.5
    - https://formulae.brew.sh/api/formula/dockly.json
  summary:
    - >
      Dockly is Liran Tal's Node.js terminal UI for managing Docker containers,
      services, and images from a local or remote Docker daemon.
  timeline:
    - '2016: GitHub repository created and npm package first published.'
    - '2018: v3.3.x releases published.'
    - '2025: v3.24.5 released on GitHub and npm.'
    - '2026: Homebrew formula API reports stable 3.24.5.'
  usage:
    - >
      Users install it globally with npm or Homebrew and run `dockly`; by default it
      connects to the local Docker Unix socket. Flags support custom socket paths,
      remote hosts, ports, protocols including SSH, and Docker API container filters.
related-packages:
  - id: brew:lazydocker
    reason: >
      Choose lazydocker for a keyboard-driven interface with first-class Docker Compose
      project, service, network, volume, and image workflows; choose Dockly for its
      Node.js TUI and explicit remote-daemon connection flags.
    rel: alternative
    sources:
      - https://github.com/lirantal/dockly#readme
      - https://github.com/jesseduffield/lazydocker#readme
  - id: brew:oxker
    reason: >
      Choose oxker for a Rust TUI centered on live resource data, logs, inspection,
      configurable controls, and container lifecycle actions.
    rel: alternative
    sources:
      - https://github.com/lirantal/dockly#readme
      - https://github.com/mrjackwills/oxker#readme
  - id: brew:ctop
    reason: >
      Choose ctop when the primary need is a compact, top-like real-time view of
      container metrics rather than Dockly's broader management interface.
    rel: alternative
    sources:
      - https://github.com/lirantal/dockly#readme
      - https://github.com/bcicen/ctop#readme
category: developer-tools
package-manager:
  brew: dockly
package-manager-url: https://formulae.brew.sh/formula/dockly
license: MIT
tags:
  - cli
  - container-management
  - containers
  - docker
  - terminal-ui
description: Immersive terminal interface for managing docker containers and services
executables:
  - dockly
provenance:
  formula: dockly
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
