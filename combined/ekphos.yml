id: brew:ekphos
display-name: Ekphos
homepage: https://ekphos.nostacks.xyz/
repo: https://github.com/nostacks/ekphos
docs:
  - https://docs.ekphos.xyz/docs/configuration
  - https://docs.ekphos.xyz/docs/getting-started
  - https://ekphos.xyz
config-file-location:
  unix: ~/.config/ekphos/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official docs document Cargo and Homebrew installation, and the repository
      README also mentions AUR. The input metadata shows Homebrew and apk packaging,
      giving the tool a package-manager path beyond direct Cargo installation.
  package-nerd-significance:
    - >
      Ekphos is notable as a modern Rust terminal productivity app that maps a
      GUI-note-app workflow into a packaged CLI/TUI, making Cargo, Homebrew, and distro
      packaging part of its normal adoption path.
  project-history:
    - >
      The official repository describes Ekphos as a lightweight, fast, terminal-based
      Markdown research tool built with Rust. The official docs cover installation, note
      creation, keybindings, search, graph view, Markdown features, frontmatter, themes,
      and configuration.
    - >
      The project README states that Ekphos is in early development and may have
      breaking changes, while the repository release surface shows active release
      activity.
  related-projects:
    - >
      Obsidian is the workflow reference named in source metadata and the repository
      description.
    - Cargo and Homebrew are documented official installation paths.
  sources:
    - https://docs.ekphos.xyz/docs/configuration
    - https://docs.ekphos.xyz/docs/getting-started
    - https://github.com/hanebox/ekphos
    - source_facts.package-manager
  summary:
    - >
      Ekphos is a Rust-based terminal Markdown research and note-taking tool inspired by
      Obsidian-style workflows.
  timeline:
    - '2026-06-03: Official GitHub repository shows v0.25.10 as the latest release.'
    - '2026 batch: Input metadata shows Homebrew and apk package-manager entries.'
  usage:
    - >
      Users install Ekphos, open a folder or Markdown file, and work with notes in the
      terminal. Configuration is stored in a TOML file under ~/.config/ekphos, with
      options for note directory, theme, sidebar behavior, frontmatter display, update
      checks, and editor settings.
related-packages:
  - id: brew:zk
    reason: >
      Choose zk when you want composable Zettelkasten commands and editor/LSP
      integration around Markdown files instead of Ekphos's integrated full-screen
      terminal interface.
    rel: alternative
    sources:
      - https://docs.ekphos.xyz/docs/getting-started
      - https://zk-org.github.io/zk/
category: productivity
package-manager:
  apk: ekphos
  brew: ekphos
package-manager-url: https://formulae.brew.sh/formula/ekphos
license: MIT
tags:
  - cli
  - markdown
  - notes
  - research
  - rust
  - terminal
  - tui
description: Terminal-based markdown research tool inspired by Obsidian
executables:
  - ekphos
provenance:
  formula: ekphos
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
