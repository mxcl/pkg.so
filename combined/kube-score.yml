id: brew:kube-score
display-name: kube-score
homepage: https://kube-score.com
repo: https://github.com/zegl/kube-score
docs:
  - https://github.com/zegl/kube-score#readme
  - https://kube-score.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents several distribution paths: GitHub release binaries for
      macOS, Linux, and Windows, a Docker image, Homebrew, and Krew as the kubectl score
      plugin. Its website also hosts an online demo backed by the kube-score/web
      repository, giving users a low-friction way to try the checks without installing
      the CLI.
  package-nerd-significance:
    - >
      kube-score matters in package-manager culture because it is a small, composable
      quality gate for Kubernetes manifests. It turns a broad operational checklist into
      a command that can live in a Makefile, pre-commit hook, GitHub Action, or CI job.
    - >
      It also illustrates a common Kubernetes packaging pattern: one Go binary, release
      artifacts for multiple platforms, a Docker image for containerized CI, Homebrew
      for local developer machines, and Krew for kubectl-plugin users.
  project-history:
    - >
      The kube-score repository was created on 2018-09-16, and its first beta release,
      v0.1.0-beta1, was published on 2018-09-26. The README presents it as static code
      analysis for Kubernetes object definitions, with checks for resources, network
      policy coverage, pod disruption budgets, probes, security contexts, and stable
      APIs.
    - >
      Unlike cluster-side policy systems, kube-score kept a developer-tool shape: a
      single CLI that reads manifests, prints human or machine-readable findings, and
      exits with a CI-friendly status code.
  related-projects:
    - Helm and Kustomize are common input producers for kube-score.
    - Krew distributes kube-score as a kubectl plugin named score.
    - kube-score/web provides the browser demo linked from the README.
    - >
      KubeLinter occupies a related manifest-linting space with a stronger
      production-readiness and security-check branding.
  sources:
    - https://api.github.com/repos/zegl/kube-score
    - https://api.github.com/repos/zegl/kube-score/releases
    - https://formulae.brew.sh/formula/kube-score
    - https://github.com/kube-score/web
    - https://github.com/zegl/kube-score
    - https://kube-score.com/
  summary:
    - >
      kube-score is a Kubernetes manifest analysis CLI that scores object definitions
      and recommends reliability and security improvements. It is aimed at the
      pre-deployment stage, where YAML, Helm output, or Kustomize output can still be
      changed cheaply.
  timeline:
    - '2018-09-16: GitHub repository created.'
    - '2018-09-26: First GitHub release, v0.1.0-beta1, published.'
    - '2018-10-08: v0.1.0 published.'
    - '2025-04-28: GitHub release v1.20.0 published.'
  usage:
    - >
      Typical usage pipes rendered Kubernetes resources into kube-score, for example
      from helm template or kustomize build. The tool can also read static YAML files or
      resources exported from a live cluster, then produce recommendations in human,
      JSON, CI, or SARIF-oriented formats.
    - >
      Annotations such as kube-score/ignore and kube-score/enable let users suppress or
      opt into checks on individual objects, which keeps the linter usable in
      repositories where not every workload has the same operational constraints.
related-packages:
  - id: brew:kube-linter
    reason: >
      Choose KubeLinter when you need custom policy checks and direct Helm chart
      analysis; choose kube-score for its concise, opinionated reliability-and-security
      recommendations.
    rel: alternative
    sources:
      - https://github.com/zegl/kube-score
      - https://github.com/stackrox/kube-linter
  - id: brew:kubeconform
    reason: >
      Use Kubeconform to catch schema, field-type, and API-shape errors before
      kube-score evaluates operational reliability and security practices.
    rel: adjacent_workflow
    sources:
      - https://github.com/yannh/kubeconform
      - https://github.com/zegl/kube-score
  - id: brew:helm
    reason: >
      Render a chart with helm template and pipe the resulting manifests into
      kube-score, as demonstrated by kube-score's official usage documentation.
    rel: adjacent_workflow
    sources:
      - https://github.com/zegl/kube-score
      - https://docs.helm.sh/docs/v3/helm/helm_template/
  - id: brew:kustomize
    reason: >
      Pipe kustomize build output into kube-score to analyze the fully customized
      manifests that will be deployed.
    rel: adjacent_workflow
    sources:
      - https://github.com/zegl/kube-score
      - https://kustomize.io/
category: developer-tools
package-manager:
  brew: kube-score
  nix: kube-score
