id: brew:flow
display-name: Flow
homepage: https://flow.org/
repo: https://github.com/facebook/flow
docs:
  - https://flow.org/en/docs
config-file-location:
  unix:
    - .flowconfig
    - src/.flowconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      Flow became closely associated with Facebook and React-era JavaScript projects,
      where static analysis was adopted to make large JavaScript codebases easier to
      maintain. The official docs include React-specific material and a dedicated guide
      for TypeScript users, reflecting Flow's long-running position in the JavaScript
      type-checking ecosystem.
    - >
      In 2023, the Flow team published an official direction statement explaining that
      the project was focusing on Meta's internal use cases and would reduce broad
      open-source engagement, a notable shift in the project's adoption story.
  package-nerd-significance:
    - >
      Flow matters to package maintainers because it is both a CLI and a
      language-extension ecosystem: packages may ship Flow annotations, require
      stripping transforms, pin flow-bin versions, or expose libdefs and parser behavior
      that differ across releases.
    - >
      Its history is also a useful contrast point for TypeScript in package metadata,
      because Flow-heavy projects often leave signals such as .flowconfig, flow-bin dev
      dependencies, and type-stripping build scripts.
  project-history:
    - >
      Facebook announced Flow in November 2014 as a new static type checker for
      JavaScript designed to find errors by analyzing programs without running them. The
      official repository describes Flow as a static typechecker for JavaScript and
      points users to flow.org for documentation.
    - >
      Flow developed around a per-project configuration file, .flowconfig, and an
      npm-oriented setup through flow-bin. Its documentation also covers Babel and
      flow-remove-types for stripping Flow type annotations before publishing or running
      JavaScript.
  related-projects:
    - >
      Official docs and README connect Flow to flow-bin, flow-parser, flow-remove-types,
      Babel, React, and TypeScript migration guidance.
  sources:
    - https://engineering.fb.com/2014/11/18/web/flow-a-new-static-type-checker-for-javascript/
    - https://flow.org/en/docs/
    - https://flow.org/en/docs/config/
    - https://github.com/facebook/flow
    - >
      https://medium.com/flow-type/clarity-on-flows-direction-and-open-source-engagement-9bc9c2f4ff65
  summary:
    - >
      Flow is Meta's static type checker and typed JavaScript dialect, distributed as
      the flow CLI and related npm tooling for checking JavaScript programs before
      runtime.
  timeline:
    - '2014: Facebook announces Flow as a static type checker for JavaScript.'
    - >
      2010s: Flow is used with JavaScript package workflows through flow-bin, Babel, and
      flow-remove-types.
    - >
      2023: The Flow team states a narrowed open-source direction focused on Meta's
      internal usage.
    - >
      2026: Official docs show Flow continuing with releases, .flowconfig reference
      docs, React docs, and TypeScript migration guidance.
  usage:
    - >
      Typical usage is project-local: install flow-bin, add a flow script, run flow init
      to create .flowconfig, and run flow to type-check source files. Flow projects use
      type annotations in JavaScript source and a compiler such as Babel or
      flow-remove-types to remove those annotations for runtime JavaScript.
    - >
      Flow also publishes parser tooling, including flow-parser, for packages that need
      to parse Flow-typed JavaScript directly.
related-packages:
  - id: brew:typescript
    reason: >
      Choose TypeScript when you want a type checker that also emits JavaScript and the
      larger TypeScript tooling ecosystem; choose Flow when its stronger React-specific
      constructs and checker-only model fit the codebase.
    rel: alternative
    sources:
      - https://flow.org/en/docs/flow-vs-typescript/
      - https://www.typescriptlang.org/docs/
category: developer-tools
package-manager:
  brew: flow
  macports: flow
  nix: flow
  scoop: main/flow
  winget: MadrasCheck.flow
package-manager-url: https://formulae.brew.sh/formula/flow
license: MIT
tags:
  - cli
  - developer-tools
  - javascript
  - static-analysis
  - static-type-checker
  - type-system
description: Static type checker for JavaScript
executables:
  - flow
provenance:
  formula: flow
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
