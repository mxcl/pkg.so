id: brew:bat-extras
display-name: bat-extras
homepage: https://github.com/eth-p/bat-extras
repo: https://github.com/eth-p/bat-extras
docs:
  - https://github.com/eth-p/bat-extras#readme
  - https://github.com/eth-p/bat-extras/tree/master/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bat-extras is packaged as a single Homebrew formula and is also listed in the
      input metadata for apk, MacPorts, Nix, pacman, and zypper. The upstream README
      documents Homebrew and MacPorts installation and also supports installing
      individual scripts from the maintainer's tap.
    - >
      The GitHub repository has a modest but real terminal-tool audience, with about
      1.6k stars shown on the project page at enrichment time.
  package-nerd-significance:
    - >
      bat-extras is package-nerd catnip because it shows what happens after a modern
      Unix replacement becomes popular: a small ecosystem of shell adapters appears so
      the replacement can sit inside search, diff, pager, and documentation flows.
    - >
      It is also a good packaging edge case because distributions may rename bat itself;
      bat-extras has build options for alternate executable names so the same scripts
      can work across package-manager naming quirks.
  project-history:
    - >
      The project grew around bat rather than replacing it. Its README presents
      bat-extras as Bash scripts that integrate bat with other command-line tools, and
      lists separate utilities such as batgrep, batman, batpipe, batwatch, batdiff, and
      prettybat.
    - >
      The release packaging is intentionally convenience-oriented. The 2024-08-24 GitHub
      release says it bundles the latest versions of the individual scripts as of that
      commit and still recommends the README installation instructions for the most
      up-to-date versions.
  related-projects:
    - bat is the required center of the suite.
    - >
      ripgrep is used by batgrep, delta can enhance batdiff, and common terminal tools
      such as man, less, git, fzf, and entr define the workflows bat-extras targets.
  sources:
    - https://github.com/eth-p/bat-extras
    - https://github.com/eth-p/bat-extras/releases/tag/v2024.08.24
    - source_facts.package-manager
  summary:
    - >
      bat-extras is a small companion suite for bat: shell scripts that wire bat into
      common terminal workflows such as ripgrep search, man-page reading, git diffs,
      file watching, less preprocessing, and pretty-printing.
  timeline:
    - >
      2024: Release v2024.08.24 bundles bat-modules, batdiff, batgrep, batman, batpipe,
      batwatch, and prettybat from the same commit.
    - >
      2026: Input package metadata lists bat-extras across Homebrew, apk, MacPorts, Nix,
      pacman, and zypper.
  usage:
    - >
      Users install the bundle when they already use bat and want it to become the pager
      or renderer behind adjacent tools: batgrep highlights ripgrep results, batman
      formats man pages through bat, batdiff displays git-oriented diffs, and batwatch
      reprints changing files with bat.
    - >
      The scripts are intentionally glue code. They depend on common CLI tools such as
      ripgrep, delta, entr, fzf, git, and bat itself where a particular script needs
      them.
related-packages:
  - id: brew:bat
    reason: >
      bat is the rendering foundation required by the suite and is the command that
      bat-extras extends into search, manual-page, diff, and paging workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/eth-p/bat-extras
      - https://github.com/sharkdp/bat
  - id: brew:ripgrep
    reason: batgrep runs searches with ripgrep and renders the matching files and lines through bat.
    rel: adjacent_workflow
    sources:
      - https://github.com/eth-p/bat-extras
      - https://github.com/BurntSushi/ripgrep
  - id: brew:git-delta
    reason: batdiff can pass diff output through delta for enhanced terminal presentation.
    rel: adjacent_workflow
    sources:
      - https://github.com/eth-p/bat-extras
      - https://github.com/dandavison/delta
  - id: brew:entr
    reason: batwatch can use entr to rerun its bat-based display when watched files change.
    rel: adjacent_workflow
    sources:
      - https://github.com/eth-p/bat-extras
      - https://github.com/eradman/entr
category: developer-tools
package-manager:
  apk: bat-extras
  brew: bat-extras
  macports: bat-extras
  nix: bat-extras
  pacman: bat-extras
  zypper: bat-extras
package-manager-url: https://formulae.brew.sh/formula/bat-extras
license: MIT
tags:
  - bash
  - bat
  - cli
  - diff
  - man-pages
  - ripgrep
description: Bash scripts that integrate bat with various command-line tools
executables:
  - bat-modules
  - batdiff
  - batgrep
  - batman
  - batpipe
  - batwatch
  - prettybat
provenance:
  formula: bat-extras
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
