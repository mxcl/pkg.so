id: brew:irssi
display-name: Irssi
homepage: https://irssi.org/
repo: https://github.com/irssi/irssi
docs:
  - https://irssi.org/documentation
config-file-location:
  unix: ~/.irssi/config
credentials-file-location: null
history:
  adoption-history:
    - >
      Irssi became one of the standard packaged IRC clients across Unix-like systems
      because it fit server-side chat habits: install a small terminal client, connect
      from a shell host, detach the terminal multiplexer, and keep IRC state alive. The
      Homebrew source facts show it packaged under the same name across Homebrew,
      Debian, Ubuntu, Fedora, Arch, MacPorts, Nix, Alpine, and openSUSE.
    - >
      Its adoption also came from its script ecosystem. The official scripts site and
      scripts repository preserve many small Perl extensions, reinforcing Irssi's role
      as a programmable IRC client rather than only a fixed binary.
  package-nerd-significance:
    - >
      Irssi matters to package nerds because it is a canonical example of a durable
      terminal network client: small enough to ship everywhere, old enough to expose
      portability issues, scriptable enough to attract local customization, and
      security-sensitive enough that distributions track upstream advisories closely.
    - >
      It also represents a packaging pattern common to Unix chat tools: a core C
      program, optional modules, user-managed dot-directory state, and a community
      script shelf that outlives many graphical IRC clients.
  project-history:
    - >
      The Irssi site marks the project as established in 1999, and its NEWS archive
      records Timo Sirainen releasing early 0.3.x builds in January 1999 and 0.7.x
      builds later that year. The manual explains the design pressure behind the
      project: Sirainen wanted an IRC client that was extremely modular and could be
      upgraded without disconnecting from servers.
    - >
      Over time Irssi settled into the Unix terminal niche: a fullscreen text interface,
      a durable configuration file, scripting hooks, themes, and support for running
      inside screen, tmux, or persistent shell accounts. The project kept compatibility
      and security work visible through its NEWS archive, including 0.8-era maintenance,
      1.0.0-era feature stabilization, and later security and protocol updates.
  related-projects:
    - >
      Irssi sits beside terminal and IRC tools such as WeeChat, BitchX, ircII, screen,
      tmux, BitlBee, SILC modules, ICB modules, and Perl-based client scripting.
  sources:
    - >
      The official site documents the project purpose, 1999 establishment marker,
      modules, themes, scripting, proxy support, and documentation surface.
    - The upstream NEWS archive supplies release chronology back to 1999.
    - >
      The upstream manual and script repository document the modular design and script
      culture.
  summary:
    - >
      Irssi is a long-running terminal chat client from the IRC culture of the late
      1990s. Its upstream site describes it as a modular text-mode chat client with IRC
      support built in, a theme system, protocol modules, Perl scripting, proxy support,
      and upgrades oriented around users who live in shells and remote sessions.
  timeline:
    - '1999: Early Irssi 0.3.x releases appear in the upstream NEWS archive.'
    - '1999: The Irssi site presents the project as established in 1999.'
    - >
      2003: The 0.8.9 release appears in the NEWS archive as a security-oriented
      maintenance release.
    - >
      2010: The 0.8.15 release announcement describes feature and bug-fix work after a
      long release gap.
    - '2017: The 1.0.0 line marks a major stable-era milestone for the long-running client.'
  usage:
    - >
      Package users normally run the `irssi` executable, keep configuration in
      `~/.irssi/config`, and customize behavior with `/set`, themes, scripts, windows,
      networks, and autojoin rules. The official documentation centers on startup,
      settings, scripting, themes, and command reference material.
    - >
      Irssi is especially associated with terminal-first IRC workflows: running in a
      multiplexer, using keyboard navigation, logging channels, and extending the client
      with Perl scripts for status bars, notifications, proxies, and channel automation.
related-packages:
  - id: brew:weechat
    reason: >
      Choose WeeChat when you want a terminal IRC client with a broad plugin
      architecture, multiple scripting languages, and an official relay protocol; choose
      Irssi for its established command model and Perl-centered customization ecosystem.
    rel: alternative
    sources:
      - https://irssi.org/
      - https://weechat.org/
      - https://weechat.org/doc/
category: networking
