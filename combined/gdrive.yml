id: brew:gdrive
display-name: gdrive
homepage: https://github.com/glotlabs/gdrive
repo: https://github.com/glotlabs/gdrive
docs:
  - https://github.com/glotlabs/gdrive/tree/main/docs
  - https://github.com/glotlabs/gdrive#readme
config-file-location: null
credentials-file-location:
  unix: ~/.config/gdrive3/
history:
  adoption-history:
    - >
      The predecessor prasmussen/gdrive repository dates to 2013 and became a widely
      starred Google Drive CLI before archival. The glotlabs successor began publishing
      3.x releases in 2023 and appears in Homebrew, MacPorts, Nix, and Scoop according
      to the input package-manager facts.
  package-nerd-significance:
    - >
      For package maintainers, this formula is significant because the old gdrive name
      did not simply disappear: it moved from a popular archived Go CLI to a successor
      project with a new credential directory, OAuth setup, and package-manager
      continuity under the same command-line identity.
  project-history:
    - >
      The glotlabs/gdrive repository was created in late 2022. Its README identifies the
      project as the successor of gdrive2, the archived prasmussen/gdrive repository,
      while noting that the new client initially implemented only the most basic
      functionality.
    - >
      The project kept the familiar gdrive command name but restarted the implementation
      around a new account flow and documentation set. It requires users to create
      Google OAuth client credentials, then run gdrive account add to authorize access
      through a local callback server.
  related-projects:
    - >
      The closest related project is prasmussen/gdrive, called gdrive2 by the successor
      README. gdown and gdrive-downloader cover narrower public-file download workflows,
      while glotlabs/gdrive targets authenticated Drive client operations.
  sources:
    - https://github.com/glotlabs/gdrive
    - https://github.com/glotlabs/gdrive#readme
    - https://github.com/glotlabs/gdrive/releases
    - https://github.com/glotlabs/gdrive/tree/main/docs
    - https://github.com/prasmussen/gdrive
  summary:
    - >
      gdrive is a command-line Google Drive client from glotlabs, written as the
      successor to the older prasmussen/gdrive project and aimed at authenticated Drive
      account operations.
  timeline:
    - '2013: prasmussen/gdrive repository created.'
    - '2022: glotlabs/gdrive successor repository created.'
    - '2023: 3.x release series published.'
    - '2024: v3.9.1 published.'
  usage:
    - >
      Users configure Google API credentials, add an account with gdrive account add,
      and then use the CLI for Google Drive operations. The official README also
      documents exporting and importing account data for remote servers where browser
      access to localhost is awkward.
related-packages:
  - id: brew:rclone
    reason: >
      Choose rclone when you need Google Drive synchronization, service accounts,
      shared-drive handling, or a consistent interface spanning many cloud-storage
      providers.
    rel: alternative
    sources:
      - https://github.com/glotlabs/gdrive#readme
      - https://rclone.org/drive/
      - https://rclone.org/docs/
  - id: brew:gdown
    reason: >
      Choose gdown when the task is primarily downloading public or shared-link Drive
      files and folders without setting up a full Drive API client.
    rel: alternative
    sources:
      - https://github.com/glotlabs/gdrive#readme
      - https://github.com/wkentaro/gdown#readme
  - id: brew:gdrive-downloader
    reason: >
      Choose gdrive-downloader when you prefer a Bash-based download workflow with
      public-file, API-key, and optional OAuth modes rather than a general Drive client.
    rel: alternative
    sources:
      - https://github.com/glotlabs/gdrive#readme
      - https://github.com/Akianonymus/gdrive-downloader#readme
category: productivity
package-manager:
  brew: gdrive
  macports: gdrive
  nix: gdrive
  scoop: main/gdrive
package-manager-url: https://formulae.brew.sh/formula/gdrive
license: MIT
tags:
  - cli
  - cloud-storage
  - file-management
  - google-drive
  - rust
description: Google Drive CLI Client
executables:
  - gdrive
provenance:
  formula: gdrive
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
