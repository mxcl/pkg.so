id: brew:jnv
display-name: jnv
homepage: https://github.com/ynqa/jnv
repo: https://github.com/ynqa/jnv
docs:
  - https://github.com/ynqa/jnv#readme
config-file-location:
  linux: ~/.config/jnv/config.toml
  macos: ~/Library/Application Support/jnv/config.toml
  windows: C:\Users\{Username}\AppData\Roaming\jnv\config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      jnv's adoption path is unusually package-manager-forward for a young CLI: the
      README includes Repology packaging status and first-class install snippets for
      several ecosystems. Homebrew core packaging and other package-manager entries make
      it easy to try as a jq-adjacent interactive viewer.
  package-nerd-significance:
    - >
      jnv is notable for combining the familiar jq query model with a terminal UI and
      bundling jaq so users do not have to provide jq separately. For package nerds, it
      is part of the wave of Rust CLIs that ship cross-platform binaries and land
      quickly in multiple package managers.
  project-history:
    - >
      The GitHub repository was created in March 2024, followed by v0.1.0 on March 19,
      2024. Releases through 2024 and 2025 added packaged binaries for macOS, Linux, and
      Windows, while the README documents package-manager installation routes including
      Homebrew, MacPorts, Nix, conda-forge, and Cargo.
  related-projects:
    - jq supplies the filter language model that jnv exposes interactively.
    - jaq is the Rust jq-compatible evaluator used by jnv.
    - jid and jiq are named by the README as inspirations.
  sources:
    - The GitHub release API supplies the release timeline.
    - The GitHub repository API supplies the repository creation date and project description.
    - >
      The README supplies the feature list, input model, inspirations, and installation
      routes.
  summary:
    - >
      jnv is a Rust terminal tool for navigating JSON with an interactive viewer and
      jq-style filter editor. Its README says it uses jaq for filter evaluation and was
      inspired by jid and jiq, placing it in the family of interactive JSON exploration
      tools rather than one-shot JSON processors.
  timeline:
    - '2024: Repository created and v0.1.0 published in March.'
    - '2024: v0.3.0 published with prebuilt binaries and Homebrew tap instructions.'
    - '2025: v0.5.0 published with binary assets for macOS, Windows, Linux GNU, and Linux musl.'
    - '2026: v0.7.x release artifacts published.'
  usage:
    - >
      Users pipe JSON into jnv or pass a JSON file, edit a jq filter interactively,
      inspect the resulting JSON tree, fold and navigate entries, and optionally write
      the selected result to stdout. The README calls out support for standard JSON and
      multiple JSON structures such as JSON Lines.
related-packages:
  - id: brew:jid
    reason: >
      Choose jid for its incremental drill-down and JMESPath-capable exploration, or jnv
      for a richer JSON tree viewer centered on jq-style filters and an embedded jaq
      evaluator.
    rel: alternative
    sources:
      - https://github.com/ynqa/jnv#readme
      - https://github.com/simeji/jid#readme
  - id: brew:jq
    reason: >
      Choose jq for noninteractive, scriptable JSON transformations and jnv when
      interactively developing and previewing jq-style filters in a terminal UI.
    rel: alternative
    sources:
      - https://github.com/ynqa/jnv#readme
      - https://jqlang.org/
category: developer-tools
package-manager:
  brew: jnv
  macports: jnv
  nix: jnv
  pacman: jnv
  scoop: main/jnv
package-manager-url: https://formulae.brew.sh/formula/jnv
license: MIT
tags:
  - cli
  - interactive
  - jq
  - json
  - rust
description: Interactive JSON filter using jq
executables:
  - jnv
provenance:
  formula: jnv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
