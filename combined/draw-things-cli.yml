id: brew:draw-things-cli
display-name: Draw Things CLI
homepage: https://github.com/drawthingsai/draw-things-community
repo: https://github.com/drawthingsai/draw-things-community
docs:
  - https://github.com/drawthingsai/draw-things-community
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is tied to Draw Things users who want local, scriptable image generation
      outside the GUI. Homebrew installs it from a tagged source archive, while the
      README also documents a tap-based HEAD install for users who want the unreleased
      CLI surface.
  package-nerd-significance:
    - >
      For package maintainers, draw-things-cli is interesting because it turns a
      Mac-first AI image-generation app into a reproducible command-line tool with
      SwiftPM products, Homebrew distribution, model-directory conventions, and a
      related self-hosted gRPC server path for local inference setups.
  project-history:
    - >
      The public repository was created in November 2023 as a community-facing sync of
      code used by the Draw Things app. Its README explains that the app itself is
      managed in a private monorepo, while public-facing code for model implementations,
      samplers, data models, trainer logic, gRPC server support, and the CLI is
      synchronized into the community repository.
  related-projects:
    - >
      Draw Things app is the parent GUI application whose public-facing model and
      trainer code is mirrored into the community repository.
    - >
      gRPCServerCLI is a sibling executable in the same Swift package for self-hosting
      Draw Things server-offload workflows.
    - _MediaGenerationKit is a library product in the same Swift package.
  sources:
    - https://github.com/drawthingsai/draw-things-community
    - https://raw.githubusercontent.com/drawthingsai/draw-things-community/main/README.md
    - https://raw.githubusercontent.com/drawthingsai/draw-things-community/main/Package.swift
    - https://formulae.brew.sh/formula/draw-things-cli
    - https://formulae.brew.sh/api/formula/draw-things-cli.json
  summary:
    - >
      Draw Things CLI is the command-line packaging of Draw Things' local
      image-generation and LoRA-training stack, exposed from the public Draw Things
      community repository rather than from the app's private monorepo.
  timeline:
    - '2023: Public draw-things-community repository created.'
    - '2024: Repository releases begin using date-stamped v1.yyyymmdd tags.'
    - >
      2026: Homebrew stable formula packages draw-things-cli from a tagged
      draw-things-community source archive.
  usage:
    - >
      The CLI is built as a Swift Package Manager executable product named
      draw-things-cli. The README documents help output, a minimal generate command, a
      default macOS model directory shared with the sandboxed Draw Things app, and the
      DRAWTHINGS_MODELS_DIR override.
related-packages:
  - id: cask:draw-things
    reason: >
      Choose the Draw Things app for an interactive canvas and graphical model workflow;
      the CLI is better for shell automation and can reuse the app's macOS model
      directory.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/drawthingsai/draw-things-community/main/README.md
      - https://docs.drawthings.ai/
category: ai
package-manager:
  brew: draw-things-cli
package-manager-url: https://formulae.brew.sh/formula/draw-things-cli
license: GPL-3.0-or-later
tags:
  - ai
  - cli
  - draw-things
  - image-generation
  - local-inference
  - lora-training
description: Local inference and LoRA training CLI for Draw Things
executables:
  - draw-things-cli
provenance:
  formula: draw-things-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
