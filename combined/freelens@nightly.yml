id: cask:freelens@nightly
display-name: Freelens Nightly
homepage: https://freelens.app/
repo: https://github.com/freelensapp/freelens-nightly-builds
docs:
  - https://github.com/freelensapp/freelens/wiki
  - https://freelens.app/
  - https://github.com/freelensapp/freelens#readme
config-file-location:
  unix: ~/.kube/config
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      Freelens is distributed for macOS, Windows, and Linux through native installers
      and several operating-system package ecosystems. Officially documented channels
      include Homebrew, Flatpak, Snap, APT, the Arch User Repository, WinGet, and Scoop.
    - >
      The project maintains an official adopters list and describes use by individuals,
      companies, and organizations. Its extension compatibility also gives former Open
      Lens users a migration path.
  package-nerd-significance:
    - >
      Freelens matters to package enthusiasts because it preserves a fully open
      Kubernetes desktop interface while offering unusually broad packaging coverage.
      The nightly cask provides early access to continuously produced builds separately
      from stable releases.
    - >
      Its bundled `kubectl` and Helm tooling, cross-platform installers, extension
      ecosystem, and compatibility with the conventional kubeconfig path make it fit
      naturally into existing Kubernetes workstations.
  project-history:
    - >
      Freelens was created as a fork of Open Lens, the open-source core formerly
      associated with Lens Desktop. The project began carrying that code forward under a
      community-oriented, MIT-licensed model in 2024.
    - >
      Development subsequently expanded beyond maintaining the fork to include converted
      extensions, regular cross-platform releases, dedicated documentation, and
      community governance. Nightly artifacts are published through the separate
      official `freelens-nightly-builds` repository.
  related-projects:
    - Open Lens is the upstream codebase from which Freelens was forked.
    - Lens Desktop is the broader product lineage associated with Open Lens.
    - >
      Kubernetes, kubectl, and Helm provide the cluster platform and command-line
      tooling integrated by Freelens.
  sources:
    - 'Official main repository: https://github.com/freelensapp/freelens'
    - >
      Official nightly-build repository:
      https://github.com/freelensapp/freelens-nightly-builds
    - 'Official website: https://freelens.app/'
    - 'Official wiki: https://github.com/freelensapp/freelens/wiki'
  summary:
    - >
      Freelens is a free, open-source desktop interface for managing Kubernetes
      clusters. It is a community continuation of Open Lens and runs on macOS, Windows,
      and Linux.
    - >
      The `freelens@nightly` package tracks prerelease artifacts from the project's
      official nightly-build repository rather than the stable release channel.
  timeline:
    - >
      2024: Freelens began as a fork intended to carry forward the open-source Open Lens
      codebase.
    - '2025: The community worked on adapting extensions formerly used with Open Lens.'
    - >
      2026: The project documented growing adoption, expanded its extension ecosystem,
      and continued regular cross-platform releases.
  usage:
    - >
      Users load one or more Kubernetes contexts, inspect workloads and resources,
      access terminals and logs, and perform routine cluster-management tasks through a
      desktop interface.
    - >
      Freelens uses `~/.kube/config` by default. Because kubeconfig commonly contains or
      references cluster authentication material as well as connection settings, the
      same officially documented path is listed for both configuration and credentials.
    - >
      Nightly packages suit users testing recent changes or helping identify
      regressions; stable Freelens builds are preferable where release stability
      matters.
category: developer-tools
package-manager:
  brew-cask: freelens@nightly
package-manager-url: https://formulae.brew.sh/cask/freelens@nightly
tags:
  - cloud-native
  - cluster-management
  - devops
  - kubernetes
  - kubernetes-ide
  - nightly
description: Kubernetes IDE
applications:
  - Freelens.app
provenance:
  cask: freelens@nightly
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
