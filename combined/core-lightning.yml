id: brew:core-lightning
display-name: Core Lightning
homepage: https://github.com/ElementsProject/lightning
repo: https://github.com/ElementsProject/lightning
docs:
  - https://docs.corelightning.org/docs/home
config-file-location:
  unix:
    - ~/.lightning/config
    - ~/.lightning/bitcoin/config
credentials-file-location:
  unix: $LIGHTNINGDIR/hsm_secret
history:
  adoption-history:
    - >
      Core Lightning adoption has been strongest among node operators, protocol
      developers, and businesses that want a scriptable daemon, JSON-RPC interface,
      plugin system, and close tracking of Lightning Network specifications. Its support
      for plugins and multiple API surfaces makes it especially common in custom node
      infrastructure.
  package-nerd-significance:
    - >
      For package maintainers, Core Lightning is more than a CLI: it ships a daemon,
      client tools, helper tools, plugins, manpage-style docs, and sensitive runtime
      state expectations. Packaging has to respect platform support, Bitcoin Core
      integration, database choices, and key material locations.
  project-history:
    - >
      The ElementsProject/lightning repository was created in 2015, during the early
      implementation period for the Lightning Network. The official README describes
      Core Lightning, previously c-lightning, as a lightweight, highly customizable,
      standard-compliant Lightning Network implementation.
    - >
      The project reached production use on Bitcoin mainnet in early 2018 with the
      launch of Blockstream Store. Its documentation later standardized on the Core
      Lightning and CLN names while keeping the same implementation lineage.
  related-projects:
    - >
      Core Lightning is related to Bitcoin Core, the Lightning Network specifications,
      other Lightning implementations such as LND and Eclair, and CLN's plugin and RPC
      ecosystem.
  sources:
    - https://github.com/ElementsProject/lightning
    - https://github.com/ElementsProject/lightning#readme
    - https://github.com/ElementsProject/lightning/releases
    - https://docs.corelightning.org/docs/home
    - https://docs.corelightning.org/docs/configuring-your-node
    - https://docs.corelightning.org/docs/securing-keys
  summary:
    - >
      Core Lightning is a C implementation of the Lightning Network protocol that
      focuses on specification compliance, performance, modularity, and node-operator
      control. It was formerly known as c-lightning and remains one of the main
      Lightning node implementations used by technically inclined Bitcoin operators.
  timeline:
    - '2015: ElementsProject/lightning repository created.'
    - >
      2018: c-lightning/Core Lightning in production use on Bitcoin mainnet with
      Blockstream Store.
    - >
      2020s: Documentation and README use the Core Lightning and CLN names for the
      former c-lightning project.
    - '2026: v26.06.x releases show continued active upstream maintenance.'
  usage:
    - >
      A normal installation runs lightningd alongside a synchronized bitcoind node, then
      controls it with lightning-cli, JSON-RPC, plugins, or newer API surfaces.
      Configuration is conventionally stored under ~/.lightning, with network-specific
      config directories, and the hsm_secret file is the critical wallet-secret
      material.
related-packages:
  - id: brew:bitcoin
    reason: >
      Core Lightning requires a synchronized Bitcoin Core `bitcoind` backend for
      blockchain data and transaction relay, making Bitcoin Core the standard adjacent
      node package.
    rel: adjacent_workflow
    sources:
      - https://github.com/ElementsProject/lightning#readme
      - https://docs.corelightning.org/docs/installation
      - https://bitcoincore.org/
category: networking
package-manager:
  brew: core-lightning
package-manager-url: https://formulae.brew.sh/formula/core-lightning
license: MIT
tags:
  - bitcoin
  - cli
  - lightning-network
  - node
  - payments
description: Lightning Network implementation focusing on spec compliance and performance
executables:
  - lightning-cli
  - lightning-hsmtool
  - lightningd
  - reckless
provenance:
  formula: core-lightning
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
