id: brew:digitemp
display-name: DigiTemp
homepage: https://www.digitemp.com/
repo: https://github.com/bcl/digitemp
docs:
  - https://github.com/bcl/digitemp#readme
  - https://github.com/bcl/digitemp/blob/master/digitemp.1
config-file-location:
  unix: ./.digitemprc
credentials-file-location: null
history:
  adoption-history:
    - >
      DigiTemp's adoption is tied to 1-Wire hobbyist, server-room, and home-monitoring
      setups, especially where temperature readings need to be logged from serial
      adapters or USB 1-Wire interfaces. The official README describes cron-based
      logging, RRD graphing scripts, MySQL logging scripts, and GNU Plot output, which
      explains its durability in system-monitoring packages.
  package-nerd-significance:
    - >
      DigiTemp matters as the sort of practical hardware bridge that package
      repositories preserve for decades: it turns inexpensive 1-Wire sensors into
      scriptable Unix telemetry. Its value is less about a modern interface and more
      about being stable, small, automatable, and useful on old or embedded systems.
  project-history:
    - >
      The README carries a 1996-2018 copyright notice for Brian C. Lane, placing
      DigiTemp among older Unix hardware utilities that predate modern package-manager
      culture but still fit it well: small C program, command-line interface, man page,
      and local configuration file. The GitHub repository was created in 2012 as a
      public source-control home for the maintained code.
  related-projects:
    - >
      DigiTemp is closely related to Dallas/Maxim 1-Wire sensor tooling and to older
      Unix monitoring pipelines that combine cron, log files, RRD, database logging, and
      graph generation.
  sources:
    - https://api.github.com/repos/bcl/digitemp
    - https://github.com/bcl/digitemp#readme
    - https://github.com/bcl/digitemp/blob/master/digitemp.1
  summary:
    - >
      DigiTemp is a long-running command-line program for reading 1-Wire temperature and
      related sensors. The official README identifies it as DigiTemp for Linux and
      documents support for DS18S20, DS18B20, DS1822, DS2438, DS2409, DS2422, and DS2423
      devices.
  timeline:
    - '1996: Copyright history begins for DigiTemp for Linux.'
    - '2012: Public GitHub repository created.'
    - '2018: README copyright range reaches 2018 in version 3.7.2.'
    - '2025: GitHub repository metadata shows continuing source updates.'
  usage:
    - >
      A typical setup initializes `./.digitemprc` with the serial adapter and discovered
      sensor ROMs, then uses commands such as `digitemp -a` to read all sensors or
      `digitemp -a -l/var/log/temperature` from cron. Command-line arguments can
      temporarily override the configuration file.
related-packages:
  - id: brew:rrdtool
    reason: >
      DigiTemp ships scripts for placing sensor readings in Round Robin databases, while
      RRDtool is specifically designed to log and graph time-series data.
    rel: adjacent_workflow
    sources:
      - https://github.com/bcl/digitemp#readme
      - https://oss.oetiker.ch/rrdtool/
  - id: brew:gnuplot
    reason: >
      DigiTemp's official README documents scripts that turn its logged sensor readings
      into graphs with gnuplot.
    rel: adjacent_workflow
    sources:
      - https://github.com/bcl/digitemp#readme
      - http://www.gnuplot.info/
category: system
package-manager:
  brew: digitemp
  debian: digitemp
  dnf: digitemp
  nix: digitemp
  ubuntu: digitemp
package-manager-url: https://formulae.brew.sh/formula/digitemp
license: GPL-2.0-or-later
tags:
  - 1-wire
  - cli
  - hardware
  - monitoring
  - sensors
  - temperature
description: Read temperature sensors in a 1-Wire net
executables:
  - digitemp_DS2490
  - digitemp_DS9097
  - digitemp_DS9097U
provenance:
  formula: digitemp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
