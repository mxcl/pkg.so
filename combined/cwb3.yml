id: brew:cwb3
display-name: IMS Open Corpus Workbench
homepage: https://cwb.sourceforge.io/
repo: https://svn.code.sf.net/p/cwb/code
docs:
  - https://cwb.sourceforge.io/documentation.php
  - https://cwb.sourceforge.io/files/CQP_Manual
  - https://cwb.sourceforge.io/files/CWB_Encoding_Tutorial
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CWB is adopted in corpus-linguistics and language-research settings where large
      annotated corpora need compact indexes, efficient token and annotation search, and
      command-line or backend access for scripts and web interfaces.
  package-nerd-significance:
    - >
      As a package, cwb3 is a dense research-tool bundle: it ships many small
      executables, a domain-specific query language, and long-lived data formats that
      matter to reproducible corpus analysis.
  project-history:
    - >
      The official site says the first official open-source release of the Corpus
      Workbench was version 3.0 and that version 3.5 is the current stable release. The
      SourceForge project was registered on February 18, 2005 and continues to host
      code, files, and project activity.
  related-projects:
    - >
      Related official projects include CQPweb, CWB/Perl, the CQi interface, and the CQP
      query language.
  sources:
    - https://cwb.sourceforge.io/
    - https://cwb.sourceforge.io/documentation.php
    - https://sourceforge.net/projects/cwb/
    - https://sourceforge.net/p/cwb/code/
  summary:
    - >
      The IMS Open Corpus Workbench is an open-source suite for indexing, managing, and
      querying large linguistically annotated text corpora, centered on the CQP query
      processor.
  timeline:
    - '2005: SourceForge project registration.'
    - 'Version 3.0: First official open-source CWB release.'
    - 'Version 3.5: Current stable CWB release on the official site.'
    - '2026: SourceForge project activity remains current.'
  usage:
    - >
      Users encode corpora with CWB command-line tools, query them interactively or
      programmatically with CQP, and use the official manuals for the CQP language,
      corpus encoding, sample corpora, and related tooling.
related-packages: []
category: science
package-manager:
  brew: cwb3
package-manager-url: https://formulae.brew.sh/formula/cwb3
license: GPL-2.0-or-later
