id: brew:gitter-cli
display-name: gitter-cli
homepage: https://github.com/RodrigoEspinosa/gitter-cli
repo: https://github.com/RodrigoEspinosa/gitter-cli
docs:
  - https://github.com/RodrigoEspinosa/gitter-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is modest but source-backed: the project was published to npm,
      later appeared as a Homebrew formula, and attracted enough GitHub interest to be
      preserved as a package-manager install. Its value was tied less to a broad
      ecosystem and more to the convenience of using Gitter without leaving a terminal
      session.
  package-nerd-significance:
    - >
      For package catalogues, gitter-cli is a compact example of a web-service CLI
      distributed through both npm and Homebrew. It shows how package managers picked up
      even small collaboration clients when they made a terminal workflow possible.
  project-history:
    - >
      The public repository was opened in 2015 by Rodrigo Espinosa, and the npm registry
      records the package publication in April 2015. The README presents the tool as a
      console Gitter client installed globally with npm and authenticated with a
      personal access token from Gitter's developer site.
    - >
      The repository's tag history reached the 0.8 series in 2015, and Homebrew packaged
      the same 0.8.5 release line. The project remained narrow in scope: room discovery,
      joining a room, setting an auth token, and sending or reading chat messages from a
      terminal screen.
  related-projects:
    - Gitter developer API and Gitter chat rooms.
    - npm global command-line packages.
    - Homebrew formula packaging for small terminal utilities.
  sources:
    - https://api.github.com/repos/RodrigoEspinosa/gitter-cli
    - https://formulae.brew.sh/formula/gitter-cli
    - https://github.com/RodrigoEspinosa/gitter-cli
    - https://raw.githubusercontent.com/RodrigoEspinosa/gitter-cli/master/README.md
    - https://registry.npmjs.org/gitter-cli
  summary:
    - >
      gitter-cli is a small terminal client for Gitter rooms. It belongs to the
      mid-2010s wave of chat and collaboration tools that exposed web service workflows
      through command-line programs.
  timeline:
    - '2015: GitHub repository opened.'
    - '2015: npm package publication recorded.'
    - '2015: README documented npm global installation and token-based Gitter authorization.'
    - '2015: v0.8.5 tag recorded for the 0.8 release line.'
  usage:
    - >
      Practitioners used gitter-cli by installing the global command, authorizing it
      with a Gitter token, listing rooms, joining a named room, and navigating chat with
      keyboard bindings. The README also documented an ephemeral `--token` option for
      sessions where the token should not be persisted.
related-packages: []
