id: brew:libcmph
display-name: CMPH
homepage: https://cmph.sourceforge.net/
repo: https://sourceforge.net/p/cmph/git
docs:
  - https://cmph.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CMPH has remained a niche but durable package because minimal perfect hashes are a
      specialized data-structure tool. It appears in Homebrew, Debian and Ubuntu
      development packages, MacPorts, Nix, Alpine, and other package collections for
      developers who need static dictionary or key-index construction.
  package-nerd-significance:
    - >
      CMPH is the kind of package that matters disproportionately to systems and search
      developers: it packages academic minimal-perfect-hashing algorithms into a
      reusable C interface and a small CLI. Its appeal is that it turns a static corpus
      into dense one-probe lookup tables without hauling in a database.
  project-history:
    - >
      The CMPH site frames the project around a gap in free software support for minimal
      perfect hashing, distinguishing it from GNU gperf by emphasizing very large key
      sets rather than small generated perfect-hash functions. Its documentation
      collects several algorithms, including CHD, BDZ, BMZ, BRZ, CHM, and FCH.
    - >
      By the 1.x and 2.x news entries, CMPH had grown beyond a single algorithm
      implementation into a practical library with packed-function support,
      memory-mappable output, an external-memory BRZ path for very large sets, and an
      experimental C++ interface for map-like use cases.
  related-projects:
    - >
      Related projects and concepts include GNU gperf, static hash tables, CHD, BDZ,
      BMZ, BRZ, CHM, and FCH minimal-perfect-hashing algorithms.
  sources:
    - https://cmph.sourceforge.net/
    - https://cmph.sourceforge.net/concepts.html
    - https://formulae.brew.sh/formula/libcmph
    - https://sourceforge.net/p/cmph/git
  summary:
    - >
      CMPH is a C library and command-line tool for building minimal perfect hash
      functions. It targets static key sets where compact storage and collision-free
      lookup matter more than insertion or deletion.
  timeline:
    - >
      0.9: CHD and CHD_PH support highlighted for compact internal-memory minimal
      perfect hashes.
    - '1.0: Bugfix-only release before a planned revamp of code and algorithms.'
    - '1.1: CHD_PC bug fix and test reorganization.'
    - '2.0: Warning cleanup and experimental C++ mph_map and mph_index interface.'
  usage:
    - >
      Typical usage is offline construction of a hash function from a fixed key set,
      followed by storage or embedding of the generated function. The official examples
      show the C API creating a minimal perfect hash from an in-memory vector and
      dumping it to a file.
related-packages:
  - id: brew:gperf
    reason: >
      Choose GNU gperf when you want generated C/C++ lookup code for a relatively small
      static keyword set; choose CMPH when compact minimal hashes for very large or
      disk-backed key sets are the priority.
    rel: alternative
    sources:
      - https://cmph.sourceforge.net/
      - https://www.gnu.org/software/gperf/
      - https://www.gnu.org/software/gperf/manual/gperf.html
