id: brew:cups
display-name: CUPS
homepage: https://github.com/OpenPrinting/cups
repo: https://github.com/OpenPrinting/cups
docs:
  - https://www.cups.org/documentation.html
  - https://openprinting.github.io/cups/doc
config-file-location:
  unix:
    - /etc/cups/cupsd.conf
    - /etc/cups/cups-files.conf
    - /etc/cups/client.conf
    - /etc/cups/printers.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      CUPS became distribution infrastructure rather than a niche end-user tool because
      it unified command-line printing, printer administration, filters, backends, and
      IPP support behind a common daemon and client tools. OpenPrinting now carries the
      current upstream version, while Apple maintains a separate repository for the CUPS
      shipped with macOS and iOS.
  package-nerd-significance:
    - >
      CUPS is package-manager significant because it is both a user-visible printing
      subsystem and a service dependency: packaging has to coordinate daemon files,
      config migration, filters, backends, IPP utilities, permissions, and platform
      service managers. It is one of the rare packages where command-line compatibility
      with both System V and Berkeley printing traditions still matters.
  project-history:
    - >
      The OpenPrinting CUPS repository identifies CUPS as a standards-based printing
      system for Linux and other Unix-like operating systems. Its legal notices preserve
      the main stewardship eras: Easy Software Products from 1997 to 2007, Apple from
      2007 to 2020, and OpenPrinting from 2020 onward.
  related-projects:
    - >
      cups-filters supplies additional filters and drivers, while Apple's separate CUPS
      repository tracks the version shipped in macOS and iOS.
  sources:
    - https://github.com/OpenPrinting/cups
    - https://www.cups.org/documentation.html
  summary:
    - >
      CUPS is the standard open source printing stack for Linux and other Unix-like
      systems, exposing IPP printing, legacy lp/lpr command interfaces, a web
      administration interface, and a C API.
  timeline:
    - '1997: Easy Software Products copyright period begins in upstream legal notices.'
    - '2007: Apple copyright period begins in upstream legal notices.'
    - '2020: OpenPrinting copyright period begins in upstream legal notices.'
    - '2026: OpenPrinting repository lists active CUPS 2.4.x releases.'
  usage:
    - >
      Admins use CUPS through configuration files under /etc/cups, the localhost:631 web
      interface, and commands such as lpadmin, lp, lpr, lpstat, and ipptool. Developers
      use the C API and IPP-oriented tooling when integrating print workflows.
related-packages: []
category: system
package-manager:
  apk: cups
  brew: cups
  debian: cups
  dnf: cups
  nix: cups
  pacman: cups
  ubuntu: cups
  zypper: cups
package-manager-url: https://formulae.brew.sh/formula/cups
license: Apache-2.0 WITH LLVM-exception
tags:
  - cli
  - ipp
  - print-server
  - printing
  - system-service
  - unix
description: Common UNIX Printing System
executables:
  - cups-config
  - ippeveprinter
  - ipptool
provenance:
  formula: cups
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
