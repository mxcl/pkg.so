id: brew:cobra-cli
display-name: cobra-cli
homepage: https://cobra.dev
repo: https://github.com/spf13/cobra-cli
docs:
  - https://cobra.dev/docs
  - https://github.com/spf13/cobra-cli#readme
config-file-location:
  unix: ~/.cobra.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      cobra-cli inherits its importance from Cobra's wide use in Go command-line
      projects. The input shows packaging in Homebrew, Debian, Ubuntu, and Nix, while Go
      module distribution is the upstream installation path.
  package-nerd-significance:
    - >
      cobra-cli is a neat example of Go's module-aware binary install story: the package
      manager formula is convenient, but upstream expects `go install` to fetch and
      build the command.
    - >
      It also shows the packaging split common in developer tools: a library
      (`spf13/cobra`) carries most of the ecosystem weight, while a smaller generator
      binary gets packaged separately for repeatable local scaffolding.
  project-history:
    - >
      The standalone `spf13/cobra-cli` repository was created in 2022 and released
      v1.3.0 in March 2022. Its README describes it as Cobra's generator for creating an
      application skeleton and adding commands.
    - >
      The tool reflects a split between the Cobra runtime library and a generator
      binary. The README points users to `go install github.com/spf13/cobra-cli@latest`,
      then exposes only two core operations: `cobra-cli init` and `cobra-cli add`.
  related-projects:
    - Cobra is the underlying Go CLI framework that generated applications use.
    - >
      Viper is the related configuration library that cobra-cli can wire into new
      projects with `--viper`.
  sources:
    - https://github.com/spf13/cobra-cli
    - https://raw.githubusercontent.com/spf13/cobra-cli/main/README.md
    - https://cobra.dev/docs
    - https://proxy.golang.org/github.com/spf13/cobra-cli/@v/list
  summary:
    - >
      cobra-cli is the generator companion for Cobra, the Go library used to build
      command-line applications. It matters less as a standalone framework and more as a
      small scaffolding tool in the Go CLI ecosystem.
  timeline:
    - '2022: `spf13/cobra-cli` repository created.'
    - '2022: v1.3.0 release published.'
    - '2022: Go module proxy lists v1.3.0 for `github.com/spf13/cobra-cli`.'
    - >
      2020s: Packaged by Homebrew, Debian, Ubuntu, and Nix according to the input
      package-manager facts.
  usage:
    - >
      `cobra-cli init` creates a barebones Cobra application inside a Go module.
      `cobra-cli add` adds subcommands under the generated `cmd` structure.
    - >
      The optional `~/.cobra.yaml` file stores repeated generator defaults such as
      author, license, year, and whether to wire in Viper support.
related-packages: []
category: developer-tools
package-manager:
  brew: cobra-cli
  debian: cobra-cli
  nix: cobra-cli
  ubuntu: cobra-cli
package-manager-url: https://formulae.brew.sh/formula/cobra-cli
license: Apache-2.0
tags:
  - cli
  - cobra
  - generator
  - go
description: Tool to generate cobra applications and commands
executables:
  - cobra-cli
provenance:
  formula: cobra-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
