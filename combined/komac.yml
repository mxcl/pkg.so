config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Komac grew around the operational pain of maintaining winget-pkgs manifests. Its
      README positions it against WingetCreate and YamlCreate, emphasizing
      cross-platform operation, deeper installer analysis, release-note retrieval, and
      working without a local winget-pkgs clone.
  package-nerd-significance:
    - >
      Komac matters to package maintainers because it turns Windows package manifest
      work into a reproducible CLI flow, including installer introspection for formats
      such as Inno Setup, NSIS, MSI, Burn, and MSIX.
  project-history:
    - >
      The GitHub repository was created on 2022-11-01 and describes Komac as the
      Community Manifest Creator for WinGet. Public releases began with a nightly
      release on 2023-01-28 and a v1.0.0 release on 2023-02-10.
  related-projects:
    - >
      Komac is related to Microsoft's winget-pkgs repository, WingetCreate, YamlCreate,
      WinGet Releaser, and GitHub Actions that call Komac during release publishing.
  sources:
    - https://api.github.com/repos/russellbanks/Komac
    - https://github.com/russellbanks/Komac
    - https://github.com/russellbanks/Komac/releases/tag/v1.0.0
    - https://raw.githubusercontent.com/russellbanks/Komac/main/README.md
  summary:
    - >
      Komac is a Rust command-line tool for creating, updating, and submitting manifests
      to Microsoft's Windows Package Manager community repository. Its package-nerd
      niche is the automation layer around WinGet packaging: it analyzes installer
      formats, generates manifest data, and can submit pull requests rather than asking
      maintainers to hand-edit YAML.
  timeline:
    - '2022-11-01: GitHub repository created.'
    - '2023-01-28: Nightly release published.'
    - '2023-02-10: v1.0.0 release published.'
  usage:
    - >
      Users run commands such as `komac new`, `komac update`, `komac remove`, and `komac
      sync` to create manifests, add package versions, remove versions, or synchronize a
      fork of winget-pkgs. The README also documents GitHub token setup for submitting
      pull requests to winget-pkgs.
