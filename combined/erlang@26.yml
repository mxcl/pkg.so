id: brew:erlang@26
display-name: Erlang/OTP 26
homepage: https://www.erlang.org/
repo: https://github.com/erlang/otp
docs:
  - https://www.erlang.org/docs/26
  - https://www.erlang.org/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned packaging such as erlang@26 matters because Erlang systems often pin an
      OTP line for compatibility while newer OTP releases continue upstream. The source
      facts list Erlang packages across Homebrew, Chocolatey, MacPorts, Scoop, winget,
      and major Linux package managers.
  package-nerd-significance:
    - >
      For package managers, erlang@26 is a compatibility formula: it keeps an older
      major runtime available after the unversioned erlang formula moves on, which is
      useful for projects that have not yet qualified newer OTP behavior.
  project-history:
    - >
      The Erlang project publishes Erlang/OTP as the official language distribution. OTP
      26.0 was announced on May 16, 2023 as a major release with new features,
      improvements, and a few incompatibilities.
  related-projects:
    - >
      Erlang/OTP shares the upstream erlang/otp repository with the later OTP 27 and OTP
      28 release lines.
    - >
      Tools in this batch such as Erlang LS and erlfmt depend on Erlang/OTP as their
      runtime and ecosystem base.
  sources:
    - https://www.erlang.org/
    - https://www.erlang.org/news/164
    - https://www.erlang.org/news/
    - https://formulae.brew.sh/formula/erlang@26
  summary:
    - >
      Erlang/OTP 26 is the Homebrew-pinned formula for the OTP 26 release line of
      Erlang, the BEAM runtime, standard libraries, and OTP tools used to build
      concurrent soft real-time systems.
  timeline:
    - '2023-05-16: Erlang/OTP 26.0 announced as a new major release.'
    - '2023: OTP 26.1 and OTP 26.2 followed as maintenance patch packages for the OTP 26 line.'
  usage:
    - >
      Users install the formula to get the Erlang shell, compiler, escript, Dialyzer,
      Common Test runner, EPMD, and related OTP command-line tools from the OTP 26 line.
related-packages:
  - id: brew:rebar3
    reason: >
      Use Rebar3 with OTP 26 to create, compile, test, dependency-lock, and release
      Erlang applications; its official compatibility table documents OTP 26 support.
    rel: adjacent_workflow
    sources:
      - https://github.com/erlang/rebar3
      - https://rebar3.org/docs/
  - id: brew:erlfmt
    reason: >
      Use erlfmt to apply deterministic formatting and CI checks to Erlang source built
      on OTP 26; its official README supports OTP 21 or later and a Rebar3 plugin
      workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/WhatsApp/erlfmt
      - https://github.com/WhatsApp/erlfmt#usage
category: language-runtime
package-manager:
  brew: erlang@26
  chocolatey: erlang
  debian: python-typer-doc
  dnf: erlang
  macports: erlang
  nix: typer
  pacman: erlang
  scoop: main/erlang
  ubuntu: python-typer-doc
  winget: Erlang.ErlangOTP
  zypper: erlang
package-manager-match:
  chocolatey: fallback
  dnf: fallback
  macports: fallback
  pacman: fallback
  scoop: fallback
  winget: fallback
  zypper: fallback
package-manager-url: https://formulae.brew.sh/formula/erlang@26
license: Apache-2.0
tags:
  - cli
  - concurrency
  - erlang
  - otp
  - programming-language
  - runtime
description: Programming language for highly scalable real-time systems
executables:
  - ct_run
  - dialyzer
  - epmd
  - erl
  - erlc
  - escript
  - run_erl
  - to_erl
  - typer
provenance:
  formula: erlang@26
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
