id: brew:jsonlint
display-name: JSONLint
homepage: https://github.com/zaach/jsonlint
repo: https://github.com/zaach/jsonlint
docs:
  - https://github.com/zaach/jsonlint#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      JSONLint's durable adoption came from being easy to package and easy to compose in
      Unix-style workflows. The Homebrew formula kept the `jsonlint` executable
      available to macOS users, while the README continued to document npm global
      installation for Node users.
  package-nerd-significance:
    - >
      JSONLint matters as a package-nerd artifact because it shows the small-tool phase
      of JSON tooling before larger Swiss-army commands dominated. It is not a data
      query language; it is the boring validator that fits cleanly in editor hooks, CI
      checks, and shell pipelines.
  project-history:
    - >
      Zachary Carter's jsonlint repository began on GitHub on 2010-03-13 with a first
      commit titled "First". The README describes the project as a pure JavaScript
      version of the jsonlint.com service, with a command-line interface installable
      through npm and a CommonJS module interface.
    - >
      The project kept a compact scope: parsing, validating, optional pretty printing,
      key sorting, in-place writes, and optional JSON Schema validation from the CLI.
      The README's MIT license notice names Zachary Carter and 2012, matching the era
      when Node.js command-line utilities were becoming common Homebrew and npm
      package-manager citizens.
  related-projects:
    - >
      The README explicitly connects the package to jsonlint.com and to editor
      integrations such as Syntastic, sourcebeautify, and ALE. It occupies the
      validation and formatting niche beside broader JSON tools such as jq.
  sources:
    - https://api.github.com/repos/zaach/jsonlint
    - https://formulae.brew.sh/formula/jsonlint
    - https://github.com/zaach/jsonlint
    - https://github.com/zaach/jsonlint/commit/1740851f1fc2edc5c626241e8a737523bcabf8d8
  summary:
    - >
      JSONLint is a JavaScript JSON parser and validator distributed as a small
      command-line tool. In package-manager culture it sits in the older generation of
      single-purpose JSON CLI utilities: install it, pipe a file or stdin through it,
      and get either formatted JSON or a syntax error.
  timeline:
    - '2010-03-13: First public GitHub commit.'
    - '2012: README license notice names Zachary Carter and the MIT license.'
    - '2022-07-12: GitHub repository metadata records a push on this date.'
  usage:
    - >
      Typical usage is `jsonlint file.json` or piping JSON to stdin. Valid input is
      pretty-printed, invalid input reports a syntax error, and options cover
      indentation, compact error display, quiet validation, in-place overwrite, sorted
      keys, and schema validation.
related-packages: []
category: developer-tools
package-manager:
  brew: jsonlint
  debian: jsonlint
  ubuntu: jsonlint
package-manager-url: https://formulae.brew.sh/formula/jsonlint
license: MIT
tags:
  - cli
  - formatter
  - json
  - parser
  - validator
description: JSON parser and validator with a CLI
executables:
  - jsonlint
provenance:
  formula: jsonlint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
