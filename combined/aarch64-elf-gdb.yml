id: brew:aarch64-elf-gdb
display-name: GDB for aarch64-elf
homepage: https://www.gnu.org/software/gdb/
repo: https://sourceware.org/git/binutils-gdb.git
docs:
  - https://www.gnu.org/software/gdb/documentation
  - https://sourceware.org/gdb/current/onlinedocs/gdb.html
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/gdb/gdbearlyinit
    - ~/.config/gdb/gdbearlyinit
    - ~/.gdbearlyinit
    - $XDG_CONFIG_HOME/gdb/gdbinit
    - ~/.config/gdb/gdbinit
    - ~/.gdbinit
    - .gdbinit
  macos:
    - ~/Library/Preferences/gdb/gdbearlyinit
    - ~/.gdbearlyinit
    - ~/Library/Preferences/gdb/gdbinit
    - ~/.gdbinit
    - .gdbinit
credentials-file-location: null
history:
  adoption-history:
    - >
      GDB became the standard debugger companion for GNU compiler and Binutils
      toolchains, and package managers often publish target-prefixed GDB builds for
      embedded or cross-development workflows. Homebrew's formula is one of those
      target-specific packages for aarch64-elf.
    - >
      Official Homebrew analytics show the formula is specialized but actively used,
      matching the narrower audience for cross-debugging compared with host-native
      debugging.
  package-nerd-significance:
    - >
      This package matters because debugger target triples are as important as compiler
      target triples: the wrong GDB can misunderstand registers, ABI details, executable
      formats, or remote target expectations.
    - >
      For package nerds, aarch64-elf-gdb completes the familiar GNU cross-toolchain set:
      Binutils for object manipulation, GCC for compilation, and GDB for debug sessions.
  project-history:
    - >
      The official GDB download page identifies GDB as the GNU Project Debugger and says
      releases go back to the 2.4/2.8 timeframe in 1988. Sourceware hosts the current
      documentation, release schedule, and the combined binutils-gdb.git source
      repository.
    - >
      The Sourceware git summary publishes the official HTTPS repository URL and
      describes the repository as gdb and binutils. The GDB schedule page tracks modern
      release history, including GDB 17.2 in 2026.
  related-projects:
    - >
      GNU Binutils shares the binutils-gdb.git repository and supplies lower-level
      binary utilities used in GNU toolchains.
    - >
      GCC is the compiler commonly paired with GDB for source-level debugging of
      GNU-built programs.
    - >
      The aarch64-elf-binutils and aarch64-elf-gcc Homebrew formulae are target-matched
      companions.
  sources:
    - https://formulae.brew.sh/api/formula/aarch64-elf-gdb.json
    - https://sourceware.org/gdb/download/
    - https://sourceware.org/gdb/schedule/
    - https://sourceware.org/git/?p=binutils-gdb.git;a=summary
  summary:
    - >
      aarch64-elf-gdb is Homebrew's target-prefixed packaging of GDB, the GNU Project
      debugger, for AArch64 ELF cross development. It provides aarch64-elf-gdb and
      related helper executables for debugging target programs rather than host-native
      programs.
  timeline:
    - '1988: The official GDB download page says old releases go back to the 2.4/2.8 timeframe.'
    - '2025: The GDB schedule page lists the GDB 17 branch date as June 21, 2025.'
    - '2026: Sourceware git tags list GDB 17.2 as a release.'
    - >
      2026: Homebrew's aarch64-elf-gdb formula packages GDB 17.2 for aarch64-elf cross
      development.
  usage:
    - >
      Users install aarch64-elf-gdb to debug AArch64 ELF programs, often alongside
      aarch64-elf-gcc and aarch64-elf-binutils. In cross workflows it is commonly used
      with remote targets, simulators, emulators, or debug stubs rather than running the
      target binary directly on the host.
    - >
      GDB reads early and general initialization files at startup. The official manual
      documents different home-directory locations for non-macOS and macOS hosts, plus a
      local .gdbinit loaded from the current working directory.
related-packages:
  - id: brew:aarch64-elf-gcc
    reason: >
      Use the matching cross-compiler to build AArch64 ELF programs and emit the
      source-level debug information consumed by this GDB package.
    rel: adjacent_workflow
    sources:
      - https://formulae.brew.sh/formula/aarch64-elf-gcc
      - https://sourceware.org/gdb/current/onlinedocs/gdb.html
  - id: brew:aarch64-elf-binutils
    reason: >
      Use the target-matched Binutils package to link, inspect, convert, and preserve
      symbols in the AArch64 ELF files opened by GDB.
    rel: adjacent_workflow
    sources:
      - https://formulae.brew.sh/formula/aarch64-elf-binutils
      - https://sourceware.org/binutils/
      - https://sourceware.org/git/?p=binutils-gdb.git;a=summary
category: developer-tools
package-manager:
  brew: aarch64-elf-gdb
package-manager-url: https://formulae.brew.sh/formula/aarch64-elf-gdb
license: GPL-3.0-or-later
tags:
  - aarch64
  - cli
  - cross-debugging
  - debugger
  - gdb
description: GNU debugger for aarch64-elf cross development
executables:
  - aarch64-elf-gdb
  - aarch64-elf-gdb-add-index
  - aarch64-elf-gstack
provenance:
  formula: aarch64-elf-gdb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
