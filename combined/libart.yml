id: brew:libart
display-name: Libart
homepage: https://gitlab.gnome.org/Archive/libart_lgpl
repo: https://gitlab.gnome.org/Archive/libart_lgpl
docs:
  - https://levien.com/libart
  - https://levien.com/libart/vpath.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Libart was adopted by GNOME Canvas, Gill, and other GNOME-era applications that
      needed vector drawing before newer 2D APIs became common. GNOME's source archive
      shows the libart_lgpl 2.3 release line continuing through 2.3.21 on 2010-04-01,
      which is why package managers still carry it mostly for older software
      compatibility.
  package-nerd-significance:
    - >
      Libart is a classic compatibility package: small, old, and mostly invisible until
      some older GNOME, graphics, or document-rendering dependency asks for it. It marks
      the pre-Cairo period of Linux desktop graphics and still shows up in package
      graphs as `libart_lgpl` or `libart`.
  project-history:
    - >
      Libart grew out of the late-1990s GNOME graphics stack, where GNOME needed a
      structured canvas and antialiased vector rendering before Cairo existed. Levien's
      project page says the source lived in GNOME CVS and that he owned the copyright to
      the code base, while GNOME distributed the LGPL-oriented libart_lgpl tarballs for
      use by desktop components.
    - >
      The 2000 Freenix paper on GNOME Canvas documented a section called the Libart
      Imaging Model, showing how paths, sorted vector paths, antialiasing, stroking,
      raster images, and microtile arrays fit into the canvas update and rendering
      pipeline.
  related-projects:
    - >
      GNOME Canvas, Gill, SVG, Java 2D, PostScript, Cairo, and older GNOME graphics
      applications are the main historical neighbors.
  sources:
    - https://download.gnome.org/sources/libart_lgpl/2.3/
    - https://levien.com/libart/
    - https://levien.com/libart/vpath.html
    - >
      https://static.usenix.org/event/usenix2000/freenix/full_papers/quintero/quintero_html/fmq-usenix-2000.html
  summary:
    - >
      Libart is Raph Levien's small, optimized C library for antialiased 2D vector
      graphics. Its upstream page describes it as the rendering engine for GNOME Canvas
      and Gill, with an imaging model close to SVG, Java 2D, and PostScript plus
      antialiasing and alpha compositing.
  timeline:
    - '2000: GNOME Canvas Freenix paper documents the Libart Imaging Model.'
    - '2001: GNOME source archive lists libart_lgpl 2.3.5 tarballs.'
    - '2010: GNOME source archive publishes libart_lgpl 2.3.21.'
  usage:
    - >
      The library is used by C and C++ programs that need low-level vector path
      rendering, Bezier and vector path data structures, alpha compositing, affine
      transforms, and region/microtile calculations. On Unix packages, the small
      `libart2-config` helper exposed compiler and linker flags to dependent builds.
related-packages:
  - id: brew:cairo
    reason: >
      Cairo is the actively developed alternative for cross-platform 2D vector
      rendering, while Libart is chiefly retained for compatibility with older GNOME-era
      software.
    rel: alternative
    sources:
      - https://www.levien.com/libart/
      - https://www.cairographics.org/
category: media
