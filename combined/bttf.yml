id: brew:bttf
display-name: bttf
homepage: https://github.com/BurntSushi/bttf
repo: https://github.com/BurntSushi/bttf
docs:
  - https://github.com/BurntSushi/bttf#readme
  - https://github.com/BurntSushi/bttf/blob/master/GUIDE.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is early and package-manager-oriented. The input metadata lists Homebrew
      and Nix packaging, while the upstream README also publishes precompiled archives
      and a crates.io package.
    - >
      Its likely adopters are shell users, Rust users, log wranglers, and developers who
      need a more careful date/time CLI than basic date(1) pipelines.
  package-nerd-significance:
    - >
      bttf is interesting less for age than for taste: it brings modern Rust datetime
      handling, rich timezone semantics, locale-aware formatting, static binary
      releases, Homebrew, Nix, and crates.io distribution to the humble date CLI
      problem.
    - >
      For package maintainers, the rename from Biff to bttf is a useful bit of
      provenance because early release artifacts and history may still mention the old
      name.
  project-history:
    - >
      The first public release was published in May 2025 under the name Biff. The
      project README notes that it was later renamed to bttf, and the 0.1.4 release
      describes itself as the first release after that rename.
    - >
      The project is built around a structured command model: bttf time, bttf span, and
      bttf tz subcommands cover actions such as formatting, arithmetic, rounding,
      sequencing, sorting, and time-zone lookup.
  related-projects:
    - Jiff is the Rust datetime ecosystem context associated with BurntSushi's date/time work.
    - date(1) and GNU coreutils date are the traditional Unix tools bttf complements.
    - >
      crates.io distributes the Rust package, while Homebrew and Nix package the CLI for
      system users.
  sources:
    - https://api.github.com/repos/BurntSushi/bttf/releases?per_page=20
    - https://github.com/BurntSushi/bttf#readme
    - https://github.com/BurntSushi/bttf/blob/master/GUIDE.md
    - https://github.com/BurntSushi/bttf/releases
    - source_facts.package-manager
  summary:
    - >
      bttf is a Rust command-line tool by BurntSushi for datetime parsing, formatting,
      arithmetic, time zones, durations, sequences, and pipeline-friendly
      transformations. It is young, but it sits in a familiar package niche: small CLIs
      that make date/time work scriptable.
  timeline:
    - '2025: Initial 0.1.0 release published as Biff.'
    - '2026: Project renamed from Biff to bttf.'
    - '2026: bttf 0.1.4 published as the first release after the rename.'
  usage:
    - >
      bttf can print the current time, parse RFC 2822/RFC 3339/RFC 9557/ISO 8601 and
      relative datetimes, add or subtract spans, round durations, generate date
      sequences, convert time zones, and tag pipeline input so transformed timestamps
      can be joined back to original lines.
    - >
      The README documents BTTF_LOCALE as an environment variable affecting locale
      support, but no persistent config or credentials file is documented.
related-packages:
  - id: brew:dateutils
    reason: >
      Choose dateutils for a suite of civil-date-focused Unix commands; choose bttf for
      deeper timezone integration, richer recurrence sequences, and JSON-line tagging.
    rel: alternative
    sources:
      - https://github.com/BurntSushi/bttf/blob/master/COMPARISON.md
      - https://www.fresse.org/dateutils/
category: developer-tools
package-manager:
  brew: bttf
  nix: bttf
  scoop: main/bttf
package-manager-url: https://formulae.brew.sh/formula/bttf
license: Unlicense OR MIT
tags:
  - cli
  - date-parsing
  - datetime
  - formatting
  - time
description: CLI tool for datetime arithmetic, parsing, formatting and more
executables:
  - bttf
provenance:
  formula: bttf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
