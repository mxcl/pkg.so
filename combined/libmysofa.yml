id: brew:libmysofa
display-name: libmysofa
homepage: https://github.com/hoene/libmysofa
repo: https://github.com/hoene/libmysofa
docs:
  - https://github.com/hoene/libmysofa#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libmysofa became infrastructure for software that needs to load standardized
      spatial-audio impulse responses. The upstream README specifically notes that
      FFmpeg builds the library on Windows, while source_facts.package-manager records
      Homebrew distribution.
  package-nerd-significance:
    - >
      The library gives package maintainers a compact bridge between the AES SOFA
      interchange format and applications implementing binaural or spatial audio. Its C
      API and CMake targets make it useful as a reusable dependency rather than only a
      standalone converter.
  project-history:
    - >
      libmysofa was created as a C library for reading HRTFs stored in AES SOFA files
      conforming to AES69-2015. The upstream project attributes the main implementation
      to Christian Hoene and connects it to the 2017 MySofa research work.
  related-projects:
    - >
      The project consumes SOFA files maintained around the SOFA conventions ecosystem
      and is used by multimedia software such as FFmpeg. Its build depends on zlib,
      while its public interface can be consumed through CMake targets.
  sources:
    - https://github.com/hoene/libmysofa#readme
    - https://www.aes.org/e-lib/browse.cfm?elib=18640
  summary:
    - >
      libmysofa is a BSD-licensed C library for loading AES SOFA files and retrieving
      head-related transfer functions for spatial-audio processing.
  timeline:
    - >
      2015: AES69 standardized the SOFA spatially oriented acoustic-data format targeted
      by the library.
    - >
      2017: The authors presented the MySofa design at the 142nd Audio Engineering
      Society Convention.
  usage:
    - >
      Applications open a SOFA dataset at a chosen sample rate, query left and right
      impulse-response filters for source coordinates, and apply those filters to audio.
      The package also installs a mysofa2json utility and exports CMake targets for
      application developers.
related-packages:
  - id: brew:ffmpeg
    reason: >
      FFmpeg's SOFAlizer filter uses libmysofa to load SOFA HRTFs and create binaural
      virtual-loudspeaker output.
    rel: adjacent_workflow
    sources:
      - https://ffmpeg.org/ffmpeg-filters.html
      - https://github.com/hoene/libmysofa#readme
category: media
