id: cask:drawio
display-name: draw.io Desktop
homepage: https://www.diagrams.net/
repo: https://github.com/jgraph/drawio-desktop
docs:
  - https://github.com/jgraph/drawio-desktop#readme
  - https://www.drawio.com/doc
config-file-location:
  macos: ~/Library/Application Support/draw.io
  windows: C:\Users\<USER-NAME>\AppData\Roaming\draw.io
credentials-file-location: null
history:
  adoption-history:
    - >
      draw.io became widely available through a free web editor, an offline desktop
      application, and integrations for platforms such as Confluence and Jira. The
      desktop project publishes installers for macOS, Windows, and Linux and is also
      distributed through operating-system package managers.
  package-nerd-significance:
    - >
      draw.io Desktop is a prominent example of packaging a mature web application as an
      offline Electron desktop program. Package enthusiasts value its cross-platform
      releases, Apache-2.0 licensing, local file workflow, and explicit design goal of
      keeping diagram data off the network.
  project-history:
    - >
      draw.io is a long-running diagram editor whose official documentation traces the
      product family across the web editor, desktop client, and collaboration-platform
      integrations. The desktop application wraps the core draw.io editor in Electron.
    - >
      The desktop repository emphasizes isolation from the Internet: application
      resources are bundled locally, remote JavaScript is blocked, and the only routine
      network operation is the update check, which administrators can disable.
  related-projects:
    - The desktop repository embeds the core jgraph/drawio editor as a submodule.
    - >
      Related official variants include the app.diagrams.net web editor and draw.io
      integrations for Confluence and Jira.
  sources:
    - 'Official desktop releases: https://github.com/jgraph/drawio-desktop/releases'
    - 'Official desktop repository: https://github.com/jgraph/drawio-desktop'
    - 'Official documentation: https://www.drawio.com/doc/'
    - 'Package provenance: source_facts.package-manager'
  summary:
    - draw.io Desktop is the official offline desktop build of the draw.io diagram editor.
  timeline:
    - >
      2005: The official documentation site credits draw.io Ltd's longstanding operation
      beginning in this period.
    - The desktop project established an Electron wrapper around the core draw.io editor.
    - >
      2026: The 30.x desktop release line continued synchronized updates with the
      draw.io core.
  usage:
    - >
      Users create and edit flowcharts, architecture diagrams, network diagrams,
      UML-like models, and other visual documents while storing files locally.
    - >
      Administrators can disable update checks with DRAWIO_DISABLE_UPDATE=true or the
      --disable-update launch option. Local storage and session storage reside in the
      documented application-data directory.
category: productivity
package-manager:
  brew-cask: drawio
package-manager-url: https://formulae.brew.sh/cask/drawio
tags:
  - cross-platform
  - diagram-editor
  - diagramming
  - electron
  - flowchart
  - macos
  - offline
  - visualization
description: Online diagram software
applications:
  - draw.io.app
provenance:
  cask: drawio
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
