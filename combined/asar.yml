id: brew:asar
display-name: Asar
homepage: https://github.com/RPGHacker/asar
repo: https://github.com/RPGHacker/asar
docs:
  - https://rpghacker.github.io/asar/manual
  - https://github.com/RPGHacker/asar#readme
  - https://rpghacker.github.io/asar/changelog
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project publishes GitHub releases and is packaged by several Unix package
      managers in the supplied Homebrew-derived facts, reflecting use beyond manual
      downloads in ROM-hacking workflows.
  package-nerd-significance:
    - >
      Asar matters to package collectors because it is niche but practical: a
      retro-console assembler with official manuals, binary releases, and distro
      packaging despite serving a specialized ROM-hacking audience.
  project-history:
    - >
      The official README says Asar was originally created by Alcaro and modeled after
      byuu's xkas v0.06. The GitHub repository metadata describes the RPGHacker
      repository as the now-official home.
  related-projects:
    - xkas, SNES ROM hacking tools, SMW Central tooling
  sources:
    - https://api.github.com/repos/RPGHacker/asar
    - https://github.com/RPGHacker/asar#readme
    - https://github.com/RPGHacker/asar/blob/master/README.txt
  summary:
    - >
      Asar is an SNES assembler used to apply patches to existing ROM images or create
      new ROM images from scratch.
  timeline:
    - '2017: Official GitHub repository created.'
    - '2018: v1.60 beta 1 appears in GitHub releases.'
    - '2024: v1.91 appears in GitHub releases.'
  usage:
    - >
      Asar supports 65c816, SPC700, and Super FX assembly, can be run as a command-line
      patching tool, and can also be built as a DLL or static library for embedding in
      other tools.
related-packages: []
category: developer-tools
package-manager:
  brew: asar
  macports: asar
  nix: asar
  pacman: asar
  zypper: asar
package-manager-url: https://formulae.brew.sh/formula/asar
license: LGPL-2.0-or-later
tags:
  - 65c816
  - assembler
  - cli
  - rom-hacking
  - snes
description: SNES assembler for applying patches to ROM images or building ROMs
executables:
  - asar
provenance:
  formula: asar
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
