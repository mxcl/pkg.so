id: brew:crytic-compile
display-name: crytic-compile
homepage: https://github.com/crytic/crytic-compile
repo: https://github.com/crytic/crytic-compile
docs:
  - https://crytic-compile.readthedocs.io/en/latest
  - https://github.com/crytic/crytic-compile#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README says the plugin is used in Trail of Bits tools including Slither,
      Echidna, Manticore, and evm-cfg-builder. That places crytic-compile in the
      packaging path for Solidity security-analysis workflows rather than only as a
      standalone CLI.
  package-nerd-significance:
    - >
      For package managers, crytic-compile is a Python security tool whose value depends
      on integration with external build frameworks and Solidity compiler tooling. Its
      distribution via PyPI and Homebrew makes it convenient to install as part of audit
      and fuzzing toolchains.
  project-history:
    - >
      The official README presents crytic-compile as a library for smart contract
      compilation, with support for direct solc compilation and framework-specific
      projects including Foundry, Hardhat, Brownie, Truffle, Waffle, Dapp, Embark,
      Etherlime, Sourcify, and Etherscan-style sources.
  related-projects:
    - >
      The official README names Slither, Echidna, Manticore, and evm-cfg-builder as
      Trail of Bits tools that use crytic-compile.
  sources:
    - https://github.com/crytic/crytic-compile#readme
    - https://github.com/crytic/crytic-compile/wiki/Configuration
    - https://pypi.org/pypi/crytic-compile/json
    - https://formulae.brew.sh/formula/crytic-compile
  summary:
    - >
      crytic-compile is a smart-contract compilation abstraction layer from the Crytic
      ecosystem. It matters to package users because it normalizes many Ethereum project
      build systems behind one CLI and Python library interface.
  timeline:
    - '2019: PyPI release 0.1.0 was uploaded.'
    - '2026: Release 0.4.1 is current in PyPI and Homebrew metadata.'
  usage:
    - >
      The documented CLI workflow is to run crytic-compile at a project root, for
      example beside hardhat.config.js or foundry.toml, and produce
      crytic-export/contracts.json containing AST, ABI, and bytecode data. Advanced
      options are supplied as CLI flags or library arguments, not through a documented
      standalone config file.
related-packages:
  - id: brew:slither-analyzer
    reason: >
      Slither directly uses crytic-compile as its compilation engine to turn framework
      projects into the ASTs required for Solidity and Vyper static analysis.
    rel: adjacent_workflow
    sources:
      - https://github.com/crytic/crytic-compile#readme
      - https://github.com/crytic/slither#readme
  - id: brew:echidna
    reason: >
      Echidna uses crytic-compile to compile Foundry, Hardhat, and Truffle projects
      before running property-based smart-contract fuzzing.
    rel: adjacent_workflow
    sources:
      - https://github.com/crytic/crytic-compile#readme
      - https://github.com/crytic/echidna#readme
category: security
package-manager:
  brew: crytic-compile
package-manager-url: https://formulae.brew.sh/formula/crytic-compile
license: AGPL-3.0-only
tags:
  - build-systems
  - cli
  - ethereum
  - security-analysis
  - smart-contracts
  - solidity
description: Abstraction layer for smart contract build systems
executables:
  - crytic-compile
provenance:
  formula: crytic-compile
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
