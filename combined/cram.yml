id: brew:cram
display-name: Cram
homepage: https://bitheap.org/cram
repo: https://github.com/aiiie/cram
docs:
  - https://bitheap.org/cram
  - https://github.com/aiiie/cram#readme
config-file-location:
  unix: .cramrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The project's NEWS file shows a compact release history from 0.1 in 2010 through
      0.7 in 2016. Over that period it gained interactive update support, regex and glob
      matching, temporary-directory isolation, Python 3 support, `.cramrc`, shell
      selection, and xUnit XML output.
  package-nerd-significance:
    - >
      Cram has lasting package-manager appeal because it tests command-line behavior at
      the packaging boundary. A formula or distro maintainer can exercise installed
      commands exactly as users run them, without importing the application as a
      library.
  project-history:
    - >
      Cram's official site describes tests as snippets of interactive shell sessions:
      commands are run, and their actual output is compared with expected output stored
      in `.t` files.
  related-projects:
    - >
      Cram is conceptually close to shell transcript testing and Mercurial-style `.t`
      tests, but is distributed as its own Python command-line test runner.
  sources:
    - https://bitheap.org/cram
    - https://raw.githubusercontent.com/aiiie/cram/master/NEWS.rst
    - https://github.com/aiiie/cram
    - https://formulae.brew.sh/formula/cram
  summary:
    - >
      Cram is a functional testing framework for command-line applications, built around
      test files that look like annotated interactive shell sessions.
  timeline:
    - '2010: Version 0.1 was released.'
    - >
      2010: Versions 0.3 and 0.4 added environment isolation, interactive updates, regex
      and glob matching.
    - '2013: Version 0.6 added `.cramrc`, shell selection, and Arch Linux package metadata.'
    - '2016: Version 0.7 added debug mode, shell options, and xUnit XML output.'
  usage:
    - >
      Developers use Cram for black-box CLI tests where shell commands and expected
      output are easier to review than imperative test code. It prints unified diffs for
      failures, can write `.err` files, and can interactively merge observed output back
      into tests.
related-packages:
  - id: brew:bats-core
    reason: >
      Choose bats-core when tests should be written as Bash functions with TAP output
      and Bash-native setup or assertion helpers; choose Cram for compact
      language-independent command transcripts.
    rel: alternative
    sources:
      - https://bitheap.org/cram/
      - https://bats-core.readthedocs.io/en/stable/
  - id: brew:shellspec
    reason: >
      Choose ShellSpec for BDD-style unit testing of shell functions across many POSIX
      shells, including mocking and coverage; choose Cram for simpler black-box
      transcript tests of any CLI.
    rel: alternative
    sources:
      - https://bitheap.org/cram/
      - https://github.com/shellspec/shellspec#readme
category: developer-tools
package-manager:
  brew: cram
  debian: python3-cram
  macports: cram
  ubuntu: python3-cram
package-manager-url: https://formulae.brew.sh/formula/cram
license: GPL-2.0-or-later
tags:
  - cli
  - functional-testing
  - python
  - test-framework
description: Functional testing framework for command-line applications
executables:
  - cram
provenance:
  formula: cram
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
