id: brew:cargo-bloat
display-name: cargo-bloat
homepage: https://github.com/RazrFalcon/cargo-bloat
repo: https://github.com/RazrFalcon/cargo-bloat
docs:
  - https://github.com/RazrFalcon/cargo-bloat#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cargo-bloat spread because Rust developers regularly need size explanations for
      CLI tools, embedded-adjacent binaries, WebAssembly-adjacent investigations, and
      release optimization. Crates.io places it in the Cargo plugins category and
      reports more than 360,000 downloads.
    - >
      Its package-manager footprint is broader than a one-off Cargo plugin: the input
      records Homebrew, Alpine, Nix, and Arch packaging. That matters because
      size-analysis tools are often installed globally on developer machines and CI
      images rather than vendored into projects.
  package-nerd-significance:
    - >
      cargo-bloat is a classic package-nerd tool because it turns compiler output into a
      ranked table that directly informs dependency choices. It is one of the Rust
      ecosystem's small, sharp CLI packages that makes invisible package cost visible.
    - >
      Its relationship to Bloaty and twiggy also shows how Rust packaging borrowed from
      general binary-analysis culture while building Cargo-native workflows for Rust
      developers.
  project-history:
    - >
      Yevhenii Reizner's cargo-bloat repository was created in January 2018, and version
      0.1.0 was published to crates.io a few days later. The README describes the
      package as a way to find what takes most of the space in an executable, with
      support for ELF, Mach-O, and PE binaries.
    - >
      The project was explicitly inspired by Google's Bloaty binary size profiler while
      adopting a Rust/Cargo-specific interface. Over later releases it added and kept
      options such as per-crate views, filtering, splitting standard-library crates,
      full function names, wide output, and JSON output.
  related-projects:
    - google/bloaty is cited by the README as an inspiration.
    - rustwasm/twiggy is recommended by the README for WebAssembly size analysis.
    - Cargo's plugin mechanism provides the `cargo bloat` subcommand interface.
  sources:
    - 'GitHub repository API metadata: https://api.github.com/repos/RazrFalcon/cargo-bloat'
    - 'Official README: https://github.com/RazrFalcon/cargo-bloat#readme'
    - Package-manager adoption from source_facts.package-manager.
    - 'crates.io API metadata and versions: https://crates.io/api/v1/crates/cargo-bloat'
  summary:
    - >
      cargo-bloat is a Cargo subcommand for explaining where compiled Rust binary size
      goes. It analyzes release artifacts and reports the largest functions or crates
      contributing to executable text size.
  timeline:
    - '2018-01-07: GitHub repository RazrFalcon/cargo-bloat was created.'
    - '2018-01-11: cargo-bloat 0.1.0 was published on crates.io.'
    - >
      2018-2020: The 0.2 through 0.10 releases iterated quickly on Cargo-plugin
      binary-size reporting.
    - '2022-06-04: Version 0.11.1 was published.'
    - '2024-05-10: Version 0.12.1 was published.'
  usage:
    - >
      The common path is `cargo install cargo-bloat` and then `cargo bloat --release -n
      10` to list the largest functions in the release build. `cargo bloat --release
      --crates` switches the view to crate-level contribution.
    - >
      The README emphasizes that per-crate numbers are estimates, not exact accounting.
      It also notes that WebAssembly is not supported and points users toward twiggy for
      that use case.
related-packages:
  - id: brew:bloaty
    reason: >
      Choose Bloaty for language-independent, multi-dimensional binary-size profiles and
      diffs; choose cargo-bloat for a Cargo-native report attributed directly to Rust
      crates and functions.
    rel: alternative
    sources:
      - https://github.com/RazrFalcon/cargo-bloat#readme
      - https://github.com/google/bloaty/blob/main/doc/using.md
  - id: brew:cargo-binutils
    reason: >
      cargo-binutils complements cargo-bloat with LLVM-backed section totals, symbol
      listings, and disassembly for deeper investigation of the same Rust artifact.
    rel: adjacent_workflow
    sources:
      - https://github.com/RazrFalcon/cargo-bloat#readme
      - https://github.com/rust-embedded/cargo-binutils#readme
category: developer-tools
