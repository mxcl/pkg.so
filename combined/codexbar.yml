id: cask:codexbar
display-name: CodexBar
homepage: https://codexbar.app/
repo: https://github.com/steipete/CodexBar
docs:
  - https://github.com/steipete/CodexBar/blob/main/docs/cli.md
  - https://github.com/steipete/CodexBar/blob/main/docs/configuration.md
  - https://github.com/steipete/CodexBar/blob/main/docs/providers.md
