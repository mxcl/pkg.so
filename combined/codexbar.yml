config-file-location:
  unix: ~/.codexbar/config.json
credentials-file-location:
  unix: ~/.codexbar/config.json
history:
  adoption-history:
    - >
      CodexBar began as a focused macOS utility and quickly added Homebrew installation,
      automatic updates, a bundled CLI, widgets, and support for additional coding
      assistants and API providers. Later releases added Linux CLI builds and
      script-friendly JSON and localhost endpoints.
  package-nerd-significance:
    - >
      CodexBar turns otherwise scattered subscription quotas, reset windows, local token
      logs, and API spend into a packageable Unix-oriented monitoring surface. Package
      enthusiasts value its combination of a native menu-bar app, a CLI, a documented
      JSON configuration file, and automation-friendly output.
  project-history:
    - >
      CodexBar was created in November 2025 as a macOS menu-bar meter for OpenAI Codex
      usage. Early releases added launch-at-login, Sparkle updating, Codex CLI status
      parsing, credits display, and Claude Code support; the project subsequently
      evolved into a multi-provider usage and cost monitor.
  related-projects:
    - OpenAI Codex and Claude Code were the original monitored developer tools.
    - >
      The bundled codexbar CLI exposes much of the application's monitoring data to
      terminals, scripts, and CI.
  sources:
    - https://github.com/steipete/CodexBar
    - https://github.com/steipete/CodexBar/blob/main/CHANGELOG.md
    - https://github.com/steipete/CodexBar/blob/main/docs/cli.md
    - https://github.com/steipete/CodexBar/blob/main/docs/configuration.md
  summary:
    - >
      CodexBar is a native menu-bar application and companion CLI for monitoring usage
      limits, resets, local token costs, service status, and API spending across AI
      coding tools and model providers.
  timeline:
    - >
      2025-11-16: Early public releases added Codex usage parsing, automatic updates,
      and launch-at-login.
    - '2025-11-18: Codex credits and web-session support were added.'
    - '2025-11-21: Claude Code support and a dedicated preferences window arrived.'
    - >
      2026: CodexBar expanded into a multi-provider monitor with richer cost reporting,
      configuration, widgets, and automation interfaces.
  usage:
    - >
      Users enable providers in Settings, then let CodexBar obtain usage from supported
      CLIs, local logs, OAuth sessions, optional browser cookies, or configured API
      keys. The bundled CLI can print text or JSON, validate configuration, clear
      caches, report local costs, and expose localhost-only usage endpoints.
category: developer-tools
