id: brew:jshon
display-name: jshon
homepage: https://github.com/keenerd/jshon
repo: https://github.com/keenerd/jshon
docs:
  - https://github.com/keenerd/jshon/blob/master/jshon.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      jshon reached several Unix package systems, including Homebrew and Linux
      distribution packages, because it solved a common pre-`jq` shell problem: safely
      extracting JSON values without embedding a full scripting language in a pipeline.
  package-nerd-significance:
    - >
      jshon is package-nerd interesting because it belongs to the early 2010s wave of
      tiny JSON-for-shell utilities. Its interface is less famous than `jq`, but it
      captures a design point where JSON manipulation was deliberately shaped to fit
      classic Unix pipelines.
  project-history:
    - >
      The public tag series uses date-stamped versions from 20110215 through 20131105,
      matching the lightweight release style of many small C utilities. The tool's model
      is stack-based: it reads JSON from stdin or a file, performs chained operations,
      and prints JSON or plain-text results.
  related-projects:
    - >
      jshon sits in the same problem space as `jq` for querying JSON and `jo` for
      producing JSON, but its interface emphasizes chained short options and
      shell-native line output.
  sources:
    - https://formulae.brew.sh/formula/jshon
    - https://github.com/keenerd/jshon
    - https://github.com/keenerd/jshon/blob/master/jshon.1
  summary:
    - >
      jshon is a small Unix command-line JSON tool aimed at shell scripts. Its manual
      says it parses, reads, and creates JSON while replacing fragile `grep`/`sed`/`awk`
      parsers and heavier one-line Perl or Python snippets.
  timeline:
    - '2011: Date-stamped public tags begin with 20110215.'
    - '2013: The manual page is dated September 1, 2013.'
    - >
      2013: The 20131105 tag appears as the later date-stamped release used by package
      managers.
  usage:
    - >
      Users typically pipe JSON into `jshon`, chain extraction and conversion flags, and
      combine its line-oriented output with ordinary shell tools. The `-F` and `-I`
      options also support file input and in-place edits for small JSON changes.
related-packages:
  - id: brew:jq
    reason: >
      Choose jq when you need a richer, widely used filter language for querying and
      transforming JSON streams; choose jshon for its compact stack-oriented shell
      interface and in-place file operations.
    rel: alternative
    sources:
      - https://github.com/keenerd/jshon/blob/master/jshon.1
      - https://jqlang.org/manual/
  - id: brew:jo
    reason: >
      Use jo to construct safely quoted JSON from shell arguments, then pass that JSON
      to jshon when the same script needs jshon's key, array, conversion, or editing
      operations.
    rel: adjacent_workflow
    sources:
      - https://github.com/jpmens/jo#readme
      - https://github.com/keenerd/jshon/blob/master/jshon.1
category: developer-tools
package-manager:
  apk: jshon
  brew: jshon
  debian: jshon
  macports: jshon
  nix: jshon
  pacman: jshon
  ubuntu: jshon
  zypper: jshon
package-manager-url: https://formulae.brew.sh/formula/jshon
license: MIT
tags:
  - cli
  - data-processing
  - json
  - parser
  - shell
description: Parse, read, and create JSON from the shell
executables:
  - jshon
provenance:
  formula: jshon
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
