history:
  adoption-history:
    - >
      Unclack is distributed as a small free Mac utility aimed at remote meetings and
      other voice applications. Its software-agnostic approach is documented for
      services such as Zoom, Skype, Webex, and Discord.
    - >
      The official version history shows continued adaptation to macOS audio behavior
      and platform changes, including alternate volume-based muting and later
      modernization for macOS Sequoia.
  package-nerd-significance:
    - >
      Unclack is an example of the single-purpose macOS menu-bar utility: it connects
      global keyboard monitoring to system microphone controls to solve one narrow but
      recognizable remote-work problem.
    - >
      For package users, its notable operational concern is macOS Accessibility
      permission, which is required for global keyboard-event monitoring and cannot be
      silently replaced by ordinary application configuration.
  project-history:
    - >
      A.J. Kueterman created Unclack as a macOS utility that automatically mutes the
      default microphone during typing and restores it afterward.
    - >
      Early releases addressed notarization and macOS compatibility. Later releases
      experimented with volume-based muting to work around microphone and Monterey-era
      system-control behavior, and version 1.3 modernized the application for macOS
      Sequoia and later.
  related-projects:
    - >
      Unclack is designed to work alongside conferencing and voice-chat applications
      such as Zoom, Skype, Webex, and Discord rather than integrating with one specific
      service.
  sources:
    - https://ajkueterman.dev/index.html
    - https://unclack.app/
    - https://unclack.app/faq/
    - https://unclack.app/versions/
  summary:
    - >
      Unclack is a focused macOS menu-bar utility by A.J. Kueterman that automatically
      mutes the default microphone while the user types, reducing mechanical-keyboard
      noise during calls.
  timeline:
    - 'Early releases: Versions 1.0.1 and 1.0.2 addressed macOS notarization.'
    - 'Version 1.1.1: Support was extended to macOS Catalina and later.'
    - 'Version 1.2.0: Volume-based muting became the default approach.'
    - 'Version 1.3.0: The application was modernized for macOS Sequoia and later.'
  usage:
    - >
      After launch, the user grants Unclack Accessibility access so it can observe
      global keyboard activity.
    - >
      Unclack runs in the menu bar, mutes the default microphone while typing, and
      unmutes it when typing stops. It can be paused when simultaneous speech and typing
      are required.
    - >
      Users can enable launch at login and customize the menu-bar and mute indicators.
      Secure Keyboard Entry prevents Unclack from observing keystrokes in protected
      contexts.
