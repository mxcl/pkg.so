id: brew:byteman
display-name: Byteman
homepage: https://byteman.jboss.org/
repo: https://github.com/bytemanproject/byteman
docs:
  - https://byteman.jboss.org/docs.html
  - https://downloads.jboss.org/byteman/4.0.27/byteman-programmers-guide.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Byteman adoption is strongest in the Java middleware and testing world. The
      official docs page lists BMUnit tests or integrations involving WildFly, Narayana,
      Hibernate, Infinispan, HornetQ, JGroups, IronJacamar, Mule, and other JVM
      projects.
    - >
      Packaging in Homebrew, Debian, Ubuntu, and Fedora reflects a niche but durable
      role: it is not a default Java tool, but it is valuable when tests need controlled
      failure, race, or runtime instrumentation scenarios.
  package-nerd-significance:
    - >
      Byteman is notable because it packages JVM bytecode instrumentation as a
      Unix-style command tool. That makes heavy Java-agent machinery installable with
      `brew install byteman` or distro packages instead of manual download-and-unzip
      workflows.
    - >
      For package nerds, it sits in the same practical family as debuggers, tracers, and
      test harnesses: rarely needed by everyone, but exactly the right sharp tool when
      ordinary unit tests cannot reach a runtime behavior.
  project-history:
    - >
      The Byteman README describes the project as a tool for injecting side effects into
      Java programs to trace and test application behavior. Its distribution includes
      command scripts, an agent and rule engine, submit/install clients, sample scripts,
      and programmer documentation.
    - >
      The official JBoss project site frames Byteman as a way to simplify Java tracing,
      monitoring, and testing. Its documentation history includes papers and talks by
      Andrew Dinn and other Red Hat/JBoss community members from 2009 onward, including
      fault-injection and runtime-behavior use cases.
  related-projects:
    - >
      BMUnit is the Byteman-oriented unit-testing integration referenced by the official
      tutorials and project list.
    - ObjectWeb ASM is used by Byteman for bytecode manipulation, according to the README.
    - >
      WildFly, Narayana, Hibernate, Infinispan, HornetQ, and JGroups are listed by the
      official docs as projects using Byteman.
  sources:
    - https://byteman.jboss.org/docs.html
    - https://github.com/bytemanproject/byteman/blob/master/README
  summary:
    - >
      Byteman is a Java agent and command-line toolkit for injecting rules into running
      JVM programs. It is used for tracing, monitoring, testing, and fault injection
      without permanently changing application source code.
  timeline:
    - >
      2009: Official Byteman materials include a Jazoon presentation on bytecode
      manipulation for multi-threaded testing.
    - >
      2011: Byteman appears in AOSD and JUDCon materials about tracing, debugging, and
      testing.
    - '2013: Official docs list JUDCon talks and growing JVM-project usage.'
    - '2020s: Version 4.x documentation remains published through the JBoss Byteman site.'
  usage:
    - >
      Users write Byteman rule scripts, check them with `bmcheck` or `bytemancheck`, run
      Java under the agent with `bmjava`, install the agent into a running JVM with
      `bminstall`, and submit rules with `bmsubmit`.
    - >
      Typical package-manager usage is by developers or QA engineers who need to
      reproduce timing bugs, inject exceptions, trace JVM internals, or test recovery
      paths in Java services.
related-packages: []
category: developer-tools
package-manager:
  brew: byteman
  debian: libbyteman-java
  dnf: byteman
  ubuntu: libbyteman-java
package-manager-url: https://formulae.brew.sh/formula/byteman
license: LGPL-2.1-or-later
tags:
  - bytecode
  - cli
  - fault-injection
  - java
  - jvm-agent
  - monitoring
  - testing
  - tracing
description: Java bytecode manipulation tool for testing, monitoring and tracing
executables:
  - bmcheck
  - bminstall
  - bmjava
  - bmsubmit
  - bytemancheck
provenance:
  formula: byteman
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
