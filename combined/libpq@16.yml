id: brew:libpq@16
display-name: libpq@16
homepage: https://www.postgresql.org/docs/16/libpq.html
repo: https://git.postgresql.org/git/postgresql.git
docs:
  - https://www.postgresql.org/docs/16/app-psql.html
  - https://www.postgresql.org/docs/16/libpq.html
config-file-location:
  unix:
    - psqlrc in the directory reported by pg_config --sysconfdir
    - ~/.psqlrc
    - pg_service.conf in the directory reported by pg_config --sysconfdir
    - ~/.pg_service.conf
  windows:
    - '%APPDATA%\postgresql\psqlrc.conf'
    - '%APPDATA%\postgresql\.pg_service.conf'
credentials-file-location:
  unix: ~/.pgpass
  windows: '%APPDATA%\postgresql\pgpass.conf'
history:
  adoption-history:
    - >
      Versioned libpq formulae are adopted by users who need to align client tooling
      with a supported server major version. PostgreSQL's versioning policy gives each
      major version five years of support from its initial release; for PostgreSQL 16,
      the policy table lists 2023-09-14 as first release and 2028-11-09 as final
      release.
    - >
      Homebrew's `libpq@16` formula page records the package as keg-only and lists a
      deprecation date of 2028-11-09 and disable date of 2029-11-09. That matches the
      package-manager pattern of retaining older client libraries while their upstream
      major line remains operationally important.
  package-nerd-significance:
    - >
      For package nerds, `libpq@16` is a clean example of major-version coexistence. The
      formula lets Homebrew keep a supported but older PostgreSQL client ABI and
      toolchain available without making it the default `libpq` package.
    - >
      The keg-only status is the important operational detail: it lets users opt into a
      versioned client path deliberately, avoiding accidental shadowing while still
      supporting projects that have not moved to a newer PostgreSQL major.
  project-history:
    - >
      The upstream history is PostgreSQL's history: a Berkeley POSTGRES lineage
      beginning in 1986, a Postgres95 SQL transition in 1994, and the PostgreSQL project
      name from 1996. libpq remained the C client API across that evolution, giving
      application code a stable route into the server protocol.
    - >
      PostgreSQL 16 was released on 2023-09-14. The release announcement highlighted
      query parallelism, bulk data loading, logical replication, SQL/JSON additions,
      `pg_stat_io`, access-control improvements, and libpq load-balancing support.
  related-projects:
    - >
      PostgreSQL 16 server, PostgreSQL client utilities, the unversioned Homebrew
      `libpq` formula, `libpq@17`, language bindings that compile against libpq, and
      migration or backup tools that shell out to PostgreSQL client programs are the
      main related pieces.
  sources:
    - https://formulae.brew.sh/formula/libpq@16
    - https://www.postgresql.org/about/news/postgresql-16-released-2715/
    - https://www.postgresql.org/docs/16/app-psql.html
    - https://www.postgresql.org/docs/16/libpq.html
    - https://www.postgresql.org/docs/current/history.html
    - https://www.postgresql.org/support/versioning/
  summary:
    - >
      libpq@16 is Homebrew's PostgreSQL 16 client-library formula: the libpq C API and
      accompanying client tools pinned to the PostgreSQL 16 major line. It exists for
      developers and automation that need PostgreSQL 16-era client behavior, headers, or
      utilities while newer PostgreSQL majors continue to move.
  timeline:
    - '1986: Berkeley POSTGRES implementation began.'
    - '1994: Postgres95 added SQL support and `psql`.'
    - '1996: PostgreSQL became the project name.'
    - '2023-09-14: PostgreSQL 16 was released.'
    - >
      2028-11-09: PostgreSQL's versioning table lists the final release date for
      PostgreSQL 16.
  usage:
    - >
      Typical use is installing `libpq@16` when a build, extension, CI image, migration
      script, or backup workflow expects PostgreSQL 16 client headers or tools. It is
      especially useful when `pg_dump`, `pg_restore`, `psql`, or `pg_config` need to
      come from the 16.x line rather than an unversioned formula.
related-packages:
  - id: brew:postgresql@16
    reason: >
      Install PostgreSQL 16 alongside libpq@16 when the pinned client library and
      utilities need a locally operated server from the same major line.
    rel: adjacent_workflow
    sources:
      - https://www.postgresql.org/docs/16/index.html
      - https://www.postgresql.org/docs/16/libpq.html
category: developer-tools
package-manager:
  apk: libpq
  brew: libpq@16
  chocolatey: psql
  debian: pg-checksums-doc
  dnf: libpq
  nix: pg_checksums
  ubuntu: pg-checksums-doc
package-manager-match:
  apk: fallback
  dnf: fallback
package-manager-url: https://formulae.brew.sh/formula/libpq@16
license: PostgreSQL
tags:
  - c-api
  - cli
  - client-library
  - database
  - postgresql
description: Postgres C API library
executables:
  - clusterdb
  - createdb
  - createuser
  - dropdb
  - dropuser
  - ecpg
  - initdb
  - pg_amcheck
  - pg_archivecleanup
  - pg_basebackup
  - pg_checksums
  - pg_config
  - pg_controldata
  - pg_ctl
  - pg_dump
  - pg_dumpall
  - pg_isready
  - pg_receivewal
  - pg_recvlogical
