id: brew:arduino-cli
display-name: Arduino CLI
homepage: https://arduino.github.io/arduino-cli/latest/
repo: https://github.com/arduino/arduino-cli
docs:
  - https://arduino.github.io/arduino-cli/latest
  - https://arduino.github.io/arduino-cli/latest/configuration
config-file-location:
  linux: ${HOME}/.arduino15/arduino-cli.yaml
  macos: ${HOME}/Library/Arduino15/arduino-cli.yaml
  windows: ${HOME}/AppData/Local/Arduino15/arduino-cli.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Arduino CLI is broadly packaged: the input package facts list Homebrew, Alpine,
      Chocolatey, MacPorts, Nix, Arch, Scoop, and winget. That breadth fits its role as
      the scriptable substrate for Arduino workflows in CI, editors, build systems, and
      headless devices.
    - >
      The tool matters because it decouples Arduino development from the IDE. Package
      users can install one binary, initialize indexes, install cores and libraries,
      compile sketches, upload firmware, and integrate Arduino boards into reproducible
      automation.
  package-nerd-significance:
    - >
      Arduino CLI is important package-manager infrastructure because it turns a huge
      embedded ecosystem into a stable command-line interface that other tools can call.
    - >
      It is also a good example of an official vendor CLI that replaced ad hoc IDE
      automation with a documented binary, config schema, command reference, nightly
      builds, and multi-OS package distribution.
  project-history:
    - >
      The official GitHub repository was created on 2018-08-08. The README describes
      Arduino CLI as an all-in-one command-line solution for Arduino-compatible boards
      and platforms, covering the core tasks that the Arduino IDE historically wrapped
      in a graphical workflow.
    - >
      The project is written in Go and ships versioned user docs, a command reference,
      nightly builds, a gRPC reference, and security policy. Its release stream in the
      official GitHub API shows the 1.x line active through 2026.
  related-projects:
    - >
      The CLI serves the Arduino boards/platforms ecosystem and Arduino-compatible board
      packages.
    - >
      The docs expose command and gRPC interfaces used by editors, CI systems, and other
      developer tools around Arduino.
  sources:
    - https://api.github.com/repos/arduino/arduino-cli
    - https://api.github.com/repos/arduino/arduino-cli/releases
    - https://arduino.github.io/arduino-cli/latest/
    - https://arduino.github.io/arduino-cli/latest/configuration/
    - https://github.com/arduino/arduino-cli
  summary:
    - >
      Arduino CLI is Arduino's official command-line and machine-interface tool for
      board management, library management, sketch builds, board detection, and uploads.
  timeline:
    - '2018-08-08: GitHub repository created.'
    - >
      2021-09-22: Earliest release returned in the current GitHub releases API page for
      this batch, 0.19.1-rc1.
    - '2026-06-05: Latest GitHub release observed for this batch, v1.5.1.'
  usage:
    - >
      Typical commands include `arduino-cli config init`, board and library manager
      operations, `arduino-cli compile`, and `arduino-cli upload`. The README points
      users to installation docs, a getting-started guide, and a full command reference.
    - >
      The default config file is `arduino-cli.yaml`. Official docs say the default data
      directory is `${HOME}/.arduino15` on Linux and other Unix-like systems,
      `${HOME}/Library/Arduino15` on macOS, and `${HOME}/AppData/Local/Arduino15` on
      Windows, so the default config paths follow from those data directories.
related-packages:
  - id: cask:arduino-ide
    reason: >
      Arduino IDE 2 provides the graphical sketch-editing workflow while delegating
      compilation, uploads, and related backend operations to Arduino CLI in daemon
      mode.
    rel: adjacent_workflow
    sources:
      - https://github.com/arduino/arduino-ide#readme
      - https://github.com/arduino/arduino-cli#readme
category: developer-tools
package-manager:
  apk: arduino-cli
  brew: arduino-cli
  chocolatey: arduino-cli
  macports: arduino-cli
  nix: arduino-cli
  pacman: arduino-cli
  scoop: main/arduino-cli
  winget: ArduinoSA.CLI
package-manager-url: https://formulae.brew.sh/formula/arduino-cli
license: GPL-3.0-only
tags:
  - arduino
  - cli
  - embedded
description: Arduino command-line interface
executables:
  - arduino-cli
provenance:
  formula: arduino-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
