id: brew:mantra
display-name: mantra
homepage: https://amolo.com.br
repo: https://github.com/brosck/mantra
docs:
  - https://github.com/brosck/mantra#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as a Go install target, source build, and Homebrew
      formula. Its GitHub topics and README position it for bug bounty, pentest,
      JavaScript, leaked-secret, and web security workflows.
  package-nerd-significance:
    - >
      mantra is part of the small, fast Go CLI ecosystem around web reconnaissance and
      secret scanning, where package-manager availability matters because tools are
      often chained in scripts.
  project-history:
    - >
      The public repository was created in January 2023. Its README describes a tool
      built in Go whose main objective is to inspect web page source and script files
      for strings that are identical or similar to API keys.
  related-projects:
    - >
      The README does not name direct related projects; it fits the broader
      secret-scanning and web reconnaissance tool category.
  sources:
    - https://github.com/brosck/mantra
    - https://github.com/brosck/mantra#readme
    - https://github.com/brosck/mantra/releases/tag/v3.1
  summary:
    - >
      mantra is a Go command-line security tool for finding API-key leaks in JavaScript
      files and HTML pages.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2023: v1.0 release published.'
    - '2024: v2.0 release published.'
    - '2025: v3.1 release published.'
  usage:
    - >
      Users install with `go install github.com/Brosck/mantra@latest` or build from
      source, then run the `mantra` CLI against pages or JavaScript files to identify
      possible exposed API keys.
related-packages: []
category: security
package-manager:
  brew: mantra
  nix: mantra
package-manager-url: https://formulae.brew.sh/formula/mantra
license: GPL-3.0-only
tags:
  - api-keys
  - cli
  - javascript
  - secret-scanning
  - security
description: Tool to hunt down API key leaks in JS files and pages
executables:
  - mantra
provenance:
  formula: mantra
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
