id: brew:attempt-cli
display-name: attempt
homepage: https://github.com/MaxBondABE/attempt
repo: https://github.com/MaxBondABE/attempt
docs:
  - https://github.com/MaxBondABE/attempt#readme
  - https://maxbondabe.github.io/attempt/intro.html
  - https://maxbondabe.github.io/attempt/usage.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Cargo and Homebrew, placing attempt in
      the modern Rust CLI distribution pattern: publish a crate for Rust users and a
      Homebrew formula for macOS package-manager users.
    - >
      Its adoption story is use-case-led rather than ecosystem-led. The manual
      explicitly compares one case to wait-for-it.sh: waiting for services in
      docker-compose-like environments when the user is not restricted to Bash. It also
      targets robust scripts that call temporarily unavailable services.
  package-nerd-significance:
    - >
      attempt is package-nerd interesting because it turns a shell pattern into a
      dedicated binary. Instead of every script growing its own retry loop, timeout
      handling, jitter, and output predicate checks, the package offers a small
      auditable command.
    - >
      It is also a tidy example of a Rust CLI whose package name and binary name differ:
      Homebrew packages attempt-cli, Cargo installs attempt-cli, but users run
      `attempt`.
  project-history:
    - >
      The official README presents attempt as a focused CLI for retrying commands that
      may fail temporarily. The Cargo metadata names the crate attempt-cli, exposes the
      binary as `attempt`, uses the 2021 Rust edition, and describes the project as
      public-domain software under the Unlicense.
    - >
      The public release history is short: GitHub releases show v1.0.1 and v1.1.0 in
      September 2025, followed by v1.1.1 in January 2026. That makes it a relatively
      young tool compared with the older Unix packages in this batch.
  related-projects:
    - >
      Related tools and patterns include wait-for-it.sh, retry loops in shell scripts,
      exponential-backoff libraries, timeout wrappers, and orchestration readiness
      checks in Docker Compose or CI scripts.
  sources:
    - Official Cargo.toml.
    - Official GitHub releases API.
    - Official README.
    - Official mdBook manual intro and usage pages.
  summary:
    - >
      attempt is a small Rust command-line tool for retrying fallible commands with
      delays, retry policies, jitter, timeouts, and backoff strategies.
  timeline:
    - '2025-09: GitHub release v1.0.1 published.'
    - '2025-09: GitHub release v1.1.0 published.'
    - '2026-01: GitHub release v1.1.1 published.'
  usage:
    - >
      The basic invocation is `attempt [BACKOFF] [OPTIONS] [COMMAND]...`. Official
      examples retry database migrations when output contains `server not ready`, use
      exponential backoff, change attempt counts, add jitter, and separate attempt
      arguments from child-command arguments with `--`.
    - >
      The manual explains the mental model: classify failures with retry policy, choose
      a backoff schedule, set a retry limit, and optionally use exponential backoff to
      start aggressively while backing off during persistent outages.
related-packages:
  - id: brew:retry
    reason: >
      Choose retry when shell-pipeline integration and replaying captured stdin and
      stdout are important; choose attempt for explicit output predicates, jitter,
      timeouts, and selectable backoff strategies.
    rel: alternative
    sources:
      - https://github.com/MaxBondABE/attempt
      - https://github.com/minfrin/retry
  - id: brew:wait4x
    reason: >
      Choose Wait4X for protocol-aware service readiness checks across HTTP, TCP, DNS,
      databases, and queues; choose attempt when the retry target is an arbitrary
      command or its output.
    rel: alternative
    sources:
      - https://github.com/MaxBondABE/attempt
      - https://wait4x.dev/
      - https://github.com/wait4x/wait4x
category: developer-tools
package-manager:
  brew: attempt-cli
package-manager-url: https://formulae.brew.sh/formula/attempt-cli
license: Unlicense
tags:
  - backoff
  - cli
  - retry
  - rust
  - scripting
description: CLI for retrying fallible commands
executables:
  - attempt
provenance:
  formula: attempt-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
