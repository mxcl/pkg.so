id: brew:libiscsi
display-name: libiscsi
homepage: https://github.com/sahlberg/libiscsi
repo: https://github.com/sahlberg/libiscsi
docs:
  - https://github.com/sahlberg/libiscsi#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libiscsi is adopted by distributions and storage tools that need user-space iSCSI
      client behavior without depending on kernel initiator workflows. Its README also
      includes patches for making external packages such as SG3-UTILS and MTX
      iSCSI-aware, which points to its role as a library layer for storage utilities.
  package-nerd-significance:
    - >
      For package maintainers, libiscsi is a useful user-space storage protocol toolkit:
      small enough to ship as a library and CLI bundle, but deep enough to exercise
      SCSI/iSCSI edge cases through iscsi-test-cu. It is also a good example of a
      package where command-line URL handling, optional credentials, and protocol
      conformance tests matter more than a visible desktop UI.
  project-history:
    - >
      The iSCSI protocol was standardized in RFC 3720 in 2003 as SCSI over TCP, then
      consolidated in RFC 7143 in April 2014. libiscsi implements the client side of
      that protocol, with an asynchronous core, a synchronous convenience layer, utility
      programs, examples, and an iSCSI conformance test tool.
    - >
      The repository tags show libiscsi 1.1.0 in December 2011 and a long sequence
      through the 1.x series. The README describes the project as a work in progress
      aiming to cover iSCSI session establishment and maintenance plus low-level SCSI
      CDB construction and data-in parsing.
  related-projects:
    - >
      Related projects include the IETF iSCSI RFCs, SCSI standards, SG3-UTILS, MTX, STGT
      test-target workflows, CUnit for conformance testing, and packages that need
      user-space iSCSI access to storage targets.
  sources:
    - https://datatracker.ietf.org/doc/html/rfc3720
    - https://datatracker.ietf.org/doc/html/rfc7143
    - https://github.com/sahlberg/libiscsi
    - https://github.com/sahlberg/libiscsi/tags
    - https://raw.githubusercontent.com/sahlberg/libiscsi/master/README.md
  summary:
    - >
      libiscsi is a client-side C library and utility collection for implementing the
      iSCSI protocol. It packages asynchronous iSCSI and SCSI task handling into a
      reusable library plus command-line tools for target discovery, inspection,
      testing, and data operations.
  timeline:
    - '2003-04: RFC 3720 standardized iSCSI as SCSI over TCP.'
    - '2011-12-24: The repository records libiscsi 1.1.0.'
    - '2014-04: RFC 7143 consolidated the iSCSI protocol specification.'
    - >
      2025-07-15: The repository records libiscsi 1.20.3 with event-loop write and
      bug-fix changes.
  usage:
    - >
      The utilities cover operations such as logging in to targets, enumerating targets
      and devices, inquiry, capacity checks, performance tests, persistent reservations,
      and conformance tests. The README documents iscsi:// and iser:// URL formats, CHAP
      credentials, bidirectional CHAP, IPv6, header digest, and data digest support.
related-packages: []
