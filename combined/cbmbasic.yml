id: brew:cbmbasic
display-name: cbmbasic
homepage: https://github.com/mist64/cbmbasic
repo: https://github.com/mist64/cbmbasic
docs:
  - https://github.com/mist64/cbmbasic#readme
  - https://github.com/mist64/cbmbasic/blob/master/ANSI_Extension.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents testing on Mac OS X, Debian Linux, and Windows NT-era Visual
      Studio toolchains, while supplied package facts show packaging in Homebrew,
      MacPorts, and Nix. Its audience is retro-computing users who want Commodore BASIC
      available as a normal host executable.
  package-nerd-significance:
    - >
      cbmbasic is a small package-manager gem: installing it drops a historically
      recognizable 8-bit BASIC dialect into a modern shell, with no emulator stack. It
      matters less as infrastructure and more as a portable preservation and scripting
      curiosity.
  project-history:
    - >
      The official README describes cbmbasic as a 100% compatible version of Commodore's
      Microsoft BASIC 6502 as found on the Commodore 64, but implemented natively rather
      than by emulating 6502 code. The public GitHub repository was created in 2014.
  related-projects:
    - >
      The README ties cbmbasic directly to Commodore BASIC V2, Microsoft BASIC 6502, the
      Commodore 64, and optional ANSI-style extensions documented in the repository.
  sources:
    - https://api.github.com/repos/mist64/cbmbasic
    - https://github.com/mist64/cbmbasic
    - https://github.com/mist64/cbmbasic#readme
    - https://github.com/mist64/cbmbasic/blob/master/ANSI_Extension.md
    - https://formulae.brew.sh/api/formula/cbmbasic.json
  summary:
    - >
      cbmbasic is a portable native implementation of Commodore BASIC V2, presented as a
      command-line interpreter and Unix scripting language.
  timeline:
    - '2014: Public GitHub repository created.'
    - '2026: Repository metadata showed recent activity and an unarchived project.'
  usage:
    - >
      Users can run cbmbasic interactively, pass an ASCII BASIC file on the command
      line, or add a hashbang line to run BASIC programs as Unix scripts. The README
      also documents a plugin-style extension path for additional statements and
      functions.
related-packages: []
