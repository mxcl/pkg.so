id: brew:hevi
display-name: hevi
homepage: https://codeberg.org/arnauc/hevi
repo: https://codeberg.org/arnauc/hevi
docs:
  - https://codeberg.org/arnauc/hevi
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/hevi/config.ziggy
    - ~/.config/hevi/config.ziggy
  windows: '%APPDATA%/hevi/config.ziggy'
credentials-file-location: null
history:
  adoption-history:
    - >
      hevi's own README points users to packaged builds where available and to Codeberg
      releases or zig build otherwise. The Homebrew formula packages the Codeberg
      release archive, and the input package metadata also records Nix and winget
      package names.
  package-nerd-significance:
    - >
      hevi is interesting to package collectors as a small Zig entrant in the
      long-running hex-viewer space: it keeps the familiar terminal hexdump shape, adds
      parser-aware highlighting for formats such as ELF and PE, and uses XDG/AppData
      configuration rather than only command-line flags.
  project-history:
    - >
      The project describes hevi as a hex viewer written in Zig in an attempt to
      simplify hex viewers. Its release stream on Codeberg shows early 0.x releases in
      2023 and 1.x releases in 2024, while the repository metadata records the Codeberg
      project page as the official source-control home.
  related-projects:
    - >
      The README explicitly compares hevi with xxd and hexdump. Its parser-aware
      highlighting places it near modern hex viewers rather than full-screen hex
      editors.
  sources:
    - https://codeberg.org/api/v1/repos/arnauc/hevi/releases
    - https://codeberg.org/arnauc/hevi
    - https://formulae.brew.sh/formula/hevi
  summary:
    - >
      hevi is a Zig hex viewer that presents itself as a simpler, more colorful
      alternative to tools such as xxd and hexdump.
  timeline:
    - '2023: v0.1.0 release published on the Codeberg release feed.'
    - '2024: v1.0.0 and v1.1.0 releases published on Codeberg.'
    - '2026: Homebrew formula packages the v1.1.0 Codeberg archive.'
  usage:
    - >
      The tool is used as hevi <file> with flags controlling color, offset display,
      ASCII display, skipped repeated lines, raw output, parser selection, and palette
      output. It supports NO_COLOR and a Ziggy config file for defaults and palettes.
related-packages:
  - id: brew:hex
    reason: >
      Choose hx when source-code byte-array output for languages such as Rust, C, Go,
      Python, Java, or Swift is more useful than hevi's parser-aware highlighting.
    rel: alternative
    sources:
      - https://codeberg.org/arnauc/hevi
      - https://github.com/sitkevij/hex#readme
category: developer-tools
package-manager:
  brew: hevi
  nix: hevi
  winget: Arnau478.hevi
package-manager-url: https://formulae.brew.sh/formula/hevi
license: GPL-3.0-or-later
tags:
  - binary
  - cli
  - hex-viewer
  - zig
description: Hex viewer
executables:
  - hevi
provenance:
  formula: hevi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
