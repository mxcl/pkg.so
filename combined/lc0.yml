id: brew:lc0
display-name: lc0
homepage: https://lczero.org/
repo: https://github.com/LeelaChessZero/lc0
docs:
  - https://github.com/LeelaChessZero/lc0#readme
  - https://lczero.org/
  - https://lczero.org/dev/wiki
config-file-location:
  unix: ${executable_dir}/lc0.config
  windows: ${executable_dir}/lc0.config
credentials-file-location: null
history:
  adoption-history:
    - >
      The project became important beyond ordinary package installation because users
      could both run the engine and contribute self-play training games. The README says
      the training server enforces game quality using client and engine versions, and
      the official site separates downloading the engine from downloading a neural
      network.
  package-nerd-significance:
    - >
      lc0 is a rare package-manager-facing chess engine whose useful artifact is not
      just code but a code-plus-weights ecosystem. It also represents a major open
      source response to AlphaZero: a reproducible, community-run neural-network chess
      engine distributed through source, binary releases, and operating-system package
      managers.
  project-history:
    - >
      Leela Chess Zero grew out of the post-AlphaZero wave of open source chess
      experimentation. The official site describes Lc0 as inspired by Google's Alpha
      Zero project, and the GitHub README describes the engine as the executable half of
      the LeelaChessZero project.
  related-projects:
    - >
      The official docs relate lc0 to AlphaZero, the LeelaChessZero training network,
      chess GUIs such as Nibbler, UCI-compatible chess tooling, TCEC competition, and
      backends such as CUDA, ONNX, BLAS, Metal, and SYCL.
  sources:
    - https://api.github.com/repos/LeelaChessZero/lc0
    - https://github.com/LeelaChessZero/lc0
    - https://github.com/LeelaChessZero/lc0/releases
    - https://lczero.org/
    - https://lczero.org/blog/2018/12/alphazero-paper-and-lc0-v0191/
    - https://lczero.org/blog/2019/05/lc0-won-tcec-15/
    - https://lczero.org/blog/2023/01/2022-progress/
    - https://lczero.org/dev/wiki/what-is-lc0/
  summary:
    - >
      lc0 is the Leela Chess Zero engine, an open source UCI-compatible chess engine
      that plays with neural networks from the LeelaChessZero project.
  timeline:
    - '2018-05-30: GitHub lc0 repository created.'
    - '2018-11-19: Official blog announced lc0 v0.19.0.'
    - '2018-12-07: Official blog discussed AlphaZero paper details and lc0 v0.19.1.'
    - '2019-05-28: Official blog announced that Lc0 won TCEC 15.'
    - >
      2023-01-15: Official blog summarized 2022 progress, including contributors, search
      changes, network architecture changes, and new backends.
    - '2025-11-23: Release v0.32.1 published.'
  usage:
    - >
      Users typically run lc0 through a chess GUI or UCI-compatible interface, pairing
      the engine binary with a downloaded network. The README documents CPU and GPU
      backends including BLAS, CUDA, cuDNN, ONNX, Apple's Metal Performance Shaders, and
      experimental SYCL support.
related-packages:
  - id: brew:stockfish
    reason: >
      Choose Stockfish for a mature CPU-oriented UCI engine; choose Lc0 when
      neural-network-guided play and GPU acceleration are central, or use both for
      comparative analysis and engine testing.
    rel: alternative
    sources:
      - https://lczero.org/dev/wiki/testing-guide/
      - https://official-stockfish.github.io/docs/
      - https://lczero.org/dev/wiki/what-is-lc0/
category: games
package-manager:
  brew: lc0
  nix: lc0
package-manager-url: https://formulae.brew.sh/formula/lc0
license: GPL-3.0-or-later
tags:
  - chess
  - chess-engine
  - cli
  - machine-learning
  - neural-network
  - uci
description: Open source neural network based chess engine
executables:
  - lc0
provenance:
  formula: lc0
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
