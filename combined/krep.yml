id: brew:krep
display-name: krep
homepage: https://github.com/davidesantangelo/krep
repo: https://github.com/davidesantangelo/krep
docs:
  - https://github.com/davidesantangelo/krep#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption evidence is thin compared with established search tools. Packaging
      in Homebrew, MacPorts, and Nix shows that it reached multiple package-manager
      ecosystems, but the official materials do not document a large user community or
      institutional deployment history.
  package-nerd-significance:
    - >
      krep is package-nerd interesting mostly as another entry in the modern grep
      replacement lineage: it combines classic POSIX search expectations with
      hardware-aware optimizations and machine-readable output, while staying small
      enough for straightforward source packaging.
  project-history:
    - >
      The GitHub repository was created on 2025-03-08. The README describes krep as an
      optimized string search utility with mmap-based I/O, adaptive algorithms, SIMD
      acceleration, multithreading, recursive traversal controls, JSON Lines output,
      context display, and statistics.
    - >
      The README's name note says krep was inspired by the Icelandic word kreppan and
      was chosen as a short command name for frequent terminal use. Version 3.0 is
      described as the point where the tool moved from a minimal scanner into a more
      practical daily search CLI.
  related-projects:
    - >
      Related tools include grep, ripgrep, The Silver Searcher, and other source-tree
      search utilities. krep's README explicitly compares reproducible benchmarks
      against ripgrep.
  sources:
    - https://formulae.brew.sh/formula/krep
    - https://github.com/davidesantangelo/krep
    - https://github.com/davidesantangelo/krep#readme
    - https://ports.macports.org/port/krep/
    - https://search.nixos.org/packages?query=krep
  summary:
    - >
      krep is a small, performance-oriented text search CLI. Its history is narrow and
      mostly self-documented, but it fits the long package-manager tradition of
      grep-like tools competing on speed, ergonomics, and script-friendly output.
  timeline:
    - '2025-03-08: The krep GitHub repository was created.'
    - >
      2026: The README described version 3.0 as the move from minimal fast scanner to
      daily search CLI.
  usage:
    - >
      krep is used like grep-style search tools: fixed-string or regex searches over
      files, directories, stdin, or literal strings, with recursive filtering,
      .gitignore support, JSON Lines output, quiet checks, file listing, and selectable
      algorithms.
    - >
      For package users, the appeal is a single native CLI binary with performance
      features exposed through familiar command-line flags rather than a service or
      library integration.
related-packages:
  - id: brew:ripgrep
    reason: >
      ripgrep is a mature repository-oriented alternative that recursively searches
      regular expressions and honors ignore files by default; choose it for its broader
      ecosystem and extensive search guide.
    rel: alternative
    sources:
      - https://github.com/davidesantangelo/krep
      - https://github.com/BurntSushi/ripgrep
category: developer-tools
