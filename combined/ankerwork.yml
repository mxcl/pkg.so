history:
  adoption-history:
    - >
      AnkerWork distributes the application for macOS and Windows as a companion to its
      webcams, headsets, speakerphones, and video bars. Official materials do not
      provide application installation or active-user figures.
  package-nerd-significance:
    - >
      The Homebrew cask provides a reproducible macOS installation route for a
      proprietary hardware-control utility that the vendor otherwise distributes from
      its download center. It is representative of casks used to manage peripheral
      settings and firmware outside the operating system's built-in controls.
  project-history:
    - >
      AnkerWork is an official Anker sub-brand focused on equipment for hybrid work. Its
      desktop application serves as the configuration and firmware-management layer for
      supported AnkerWork audio and video devices.
  related-projects:
    - Anker
    - Anker PowerConf
    - AnkerWork VoiceRadar
    - Homebrew Cask
  sources:
    - https://uk.ankerwork.com/pages/about-us
    - https://us.ankerwork.com/pages/download-software
    - https://us.ankerwork.com/pages/voice-radar
    - source_facts.package-manager
  summary:
    - >
      AnkerWork is a proprietary desktop companion application for configuring supported
      AnkerWork webcams, headsets, speakerphones, and video bars and applying device
      firmware updates.
  timeline:
    - >
      2020: Anker's official product history records the creation of the PowerConf
      speakerphone series.
    - >
      2021: AnkerWork's privacy policy was already documenting use of the brand's
      applications and accounts.
    - '2022: AnkerWork documented VoiceRadar 2.0 in its SR500 product line.'
  usage:
    - >
      Users connect a supported AnkerWork device, adjust video or audio behavior,
      inspect device information, and install firmware updates. The vendor also
      documents local image-to-PDF and collage features in the general desktop
      application.
