id: brew:rustypaste
display-name: rustypaste
homepage: https://blog.orhun.dev/blazingly-fast-file-sharing
repo: https://github.com/orhun/rustypaste
docs:
  - https://github.com/orhun/rustypaste#readme
config-file-location:
  unix:
    - config.toml
    - ~/.rustypaste.toml
credentials-file-location:
  unix:
    - .env
    - config.toml
    - $AUTH_TOKENS_FILE
    - $DELETE_TOKENS_FILE
history:
  adoption-history:
    - >
      rustypaste is packaged for Cargo, Homebrew, Alpine, Arch Linux, Nix and
      FreeBSD-oriented workflows, and it publishes binary and container deployment
      options. The project also documents third-party clients and integrations for users
      who want interfaces beyond curl.
  package-nerd-significance:
    - >
      rustypaste is representative of the small, self-contained Rust service favored by
      self-hosters: one binary, filesystem storage, no database, TOML configuration, and
      straightforward container deployment. Its presence in several system and language
      package managers makes it easy to deploy without adopting a large application
      stack.
  project-history:
    - >
      Orhun Parmaksız developed rustypaste as a minimal self-hosted file-upload and
      pastebin server written in Rust. The service grew beyond basic uploads to include
      expiring and one-shot links, URL shortening, protected files, authentication,
      deletion and listing endpoints, MIME controls, and hot-reloadable configuration.
  related-projects:
    - >
      rustypaste-cli is the project's standalone rpaste client. The server README also
      lists community clients and integrations, including ShareX profiles and
      alternative graphical or shell interfaces.
  sources:
    - https://github.com/orhun/rustypaste
    - https://github.com/orhun/rustypaste/blob/master/README.md
  summary:
    - >
      rustypaste is a minimal self-hosted HTTP service for uploading files, publishing
      text, and shortening URLs. It stores data on the filesystem and does not require a
      database.
  timeline:
    - 'Initial design: rustypaste established a single-binary, filesystem-backed paste service.'
    - >
      Feature expansion: The server added expiration, one-shot links, protected files,
      URL shortening, authentication, listing and deletion facilities.
    - >
      Packaging expansion: Distribution grew to include Cargo, system packages, binaries
      and containers.
  usage:
    - >
      Administrators run rustypaste with config.toml and an upload directory, optionally
      enabling authentication with environment variables, token files, or server
      configuration. Clients upload multipart files with curl or compatible tools and
      can request expiration, one-shot access, password protection, remote fetches, URL
      shortening, listing, or deletion.
category: networking
package-manager:
  apk: rustypaste
  brew: rustypaste
  nix: rustypaste
  pacman: rustypaste
package-manager-url: https://formulae.brew.sh/formula/rustypaste
license: MIT
tags:
  - cli
  - file-upload
  - http-server
  - pastebin
  - rust
  - self-hosted
  - url-shortener
description: Minimal file upload/pastebin service
executables:
  - rustypaste
provenance:
  formula: rustypaste
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
