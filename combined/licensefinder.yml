id: brew:licensefinder
display-name: LicenseFinder
homepage: https://github.com/pivotal/LicenseFinder
repo: https://github.com/pivotal/LicenseFinder
docs:
  - https://github.com/pivotal/LicenseFinder#readme
config-file-location:
  unix:
    - config/license_finder.yml
    - doc/dependency_decisions.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      LicenseFinder spread through CLI, RubyGems, Homebrew, Docker, and pre-commit
      workflows. Its Docker image bundles package managers so CI jobs can scan
      mixed-language repositories without installing every ecosystem tool on the host.
  package-nerd-significance:
    - >
      LicenseFinder is important to package people because it exposes the practical mess
      of license metadata: every package manager has different files, commands, and
      metadata conventions, so the tool's value is in its adapters and decision record
      as much as in license detection.
  project-history:
    - >
      The public repository was created on 2011-01-17. The README describes a tool that
      works with package managers to find dependencies, detect licenses, compare them
      with permitted licenses, and produce actionable exception reports.
    - >
      The changelog records a broadening scope over time: support for Ruby, Node,
      Python, Java, Go, CocoaPods, Swift Package Manager, Rust Cargo, PHP Composer,
      Conda, Flutter, and other ecosystems appears across releases. Release 7.0.0 in
      2022 added Ruby 3 support, Flutter scanning, and SPDX identifier reporting.
  related-projects:
    - >
      Related projects include package-manager license commands, SPDX identifiers,
      pre-commit, and license-policy tools such as Licensed.
  sources:
    - https://api.github.com/repos/pivotal/LicenseFinder
    - https://formulae.brew.sh/formula/licensefinder
    - https://github.com/pivotal/LicenseFinder
    - https://raw.githubusercontent.com/pivotal/LicenseFinder/master/CHANGELOG.md
    - https://raw.githubusercontent.com/pivotal/LicenseFinder/master/README.md
  summary:
    - >
      LicenseFinder is Pivotal's long-running Ruby CLI for finding dependency licenses,
      comparing them with approved policies, and reporting unapproved packages. It
      covers many project types by calling their native package managers rather than
      treating license scanning as a single-language problem.
  timeline:
    - '2011-01-17: GitHub repository created.'
    - >
      2021-06-25: v6.14.1 changelog entry includes a command-injection fix for CocoaPods
      projects.
    - '2022-03-04: v7.0.0 adds Ruby 3 support, Flutter scanning, and SPDX identifier reporting.'
    - '2022-11-28: v7.1.0 adds a pre-commit hook.'
    - >
      2024-05-07: v7.2.0 adds Ruby 3.3 support and several package-manager compatibility
      updates.
  usage:
    - >
      Users run license_finder after installing project dependencies. The tool records
      approvals and permitted licenses, exits non-zero for unapproved dependencies, and
      can run in CI to catch new dependency-license work items.
related-packages:
  - id: brew:licensed
    reason: >
      Choose Licensed when you prefer cached per-dependency license records and status
      checks; choose LicenseFinder for its broad native-package-manager adapters and
      auditable approval decision log.
    rel: alternative
    sources:
      - https://github.com/licensee/licensed
      - https://github.com/pivotal/LicenseFinder
  - id: brew:licensee
    reason: >
      Use Licensee alongside LicenseFinder to identify the repository's own license,
      while LicenseFinder discovers and evaluates licenses belonging to dependencies.
    rel: adjacent_workflow
    sources:
      - https://licensee.github.io/licensee/what-we-look-at/
      - https://github.com/pivotal/LicenseFinder
category: developer-tools
package-manager:
  brew: licensefinder
  nix: license_finder
package-manager-url: https://formulae.brew.sh/formula/licensefinder
license: MIT
tags:
  - cli
  - dependencies
  - license-compliance
  - licenses
  - ruby
description: Find licenses for your project's dependencies
executables:
  - license_finder
provenance:
  formula: licensefinder
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
