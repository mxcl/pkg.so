id: brew:mkbrr
display-name: mkbrr
homepage: https://mkbrr.com/introduction
repo: https://github.com/autobrr/mkbrr
docs:
  - https://mkbrr.com/development
  - https://mkbrr.com/installation
  - https://mkbrr.com/introduction
config-file-location:
  unix:
    - ./presets.yaml
    - ~/.config/mkbrr/presets.yaml
    - ~/.mkbrr/presets.yaml
    - batch.yaml
credentials-file-location: null
history:
  project-history:
    - >
      The tool's important milestone is not a new torrent protocol, but a
      private-tracker-aware workflow around torrent creation. mkbrr supports presets,
      YAML batch jobs, include and exclude filters, automatic piece-size calculation,
      private torrents by default, entropy for cross-seeding, tracker-specific limits,
      and season-pack completeness checks. The project documents high hashing throughput
      and parallel batch operation as core differentiators from older torrent-making
      tools.
  sources:
    - https://github.com/autobrr/mkbrr
    - https://mkbrr.com/cli-reference/create
    - https://mkbrr.com/introduction
    - https://whatbox.ca/wiki/mkbrr
  summary:
    - >
      mkbrr is an autobrr-family tool for creating, inspecting, and modifying BitTorrent
      .torrent files. Its documentation brands it as "make-burr" and offers both a CLI
      and a desktop GUI, with a single-binary distribution model aimed at
      automation-friendly deployment.
  usage:
    - >
      Its adoption context is torrent automation and seedbox use: the upstream docs
      focus on tracker compliance and scripted creation, and Whatbox documents
      installing mkbrr into a user bin directory over SSH. In package managers it sits
      beside BitTorrent utilities rather than general networking tools, with Homebrew,
      Alpine, Nix, and winget packages mapping the same CLI to different desktop and
      server environments.
related-packages:
  - id: brew:mktorrent
    reason: >
      Choose mktorrent for a smaller traditional metainfo creator; choose mkbrr for
      presets, batch jobs, tracker-specific validation, inspection, modification, and a
      GUI.
    rel: alternative
    sources:
      - https://github.com/autobrr/mkbrr#readme
      - https://github.com/pobrn/mktorrent
category: networking
package-manager:
  apk: mkbrr
  brew: mkbrr
  nix: mkbrr
  winget: autobrr.mkbrr
package-manager-url: https://formulae.brew.sh/formula/mkbrr
license: GPL-2.0-or-later
tags:
  - bittorrent
  - cli
  - file-metadata
  - go
  - torrent
description: Is a tool to create, modify and inspect torrent files. Fast
executables:
  - mkbrr
provenance:
  formula: mkbrr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
