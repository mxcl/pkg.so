id: brew:mob
display-name: mob
homepage: https://mob.sh
repo: https://github.com/remotemobprogramming/mob
docs:
  - https://mob.sh/
config-file-location:
  unix:
    - ~/.mob
    - ./.mob
credentials-file-location: null
history:
  project-history:
    - >
      The tool's practical workflow is intentionally small: a typist starts a session
      with `mob start`, hands off with `mob next`, and finishes with `mob done`, which
      squashes the temporary WIP branch back into staged changes. Documentation and
      practitioner writeups emphasize remote mob programming, fast typist rotation, and
      integration with timers, with later use cases extending to local mob sessions and
      solo checkpointing.
  sources:
    - https://api.github.com/repos/remotemobprogramming/mob
    - https://formulae.brew.sh/formula/mob
    - https://github.com/remotemobprogramming/mob
    - https://mob.sh/
    - >
      https://www.innoq.com/en/blog/2023/03/typist-wechsel-dich-remote-edition-code-uebergabe-mit-dem-mob-tool/
  summary:
    - >
      mob is a Go command-line tool from the remotemobprogramming project for handing
      source changes between participants in pair or mob programming sessions. Its
      GitHub repository was created in 2018, and the project site describes it as an
      open-source CLI that uses Git to keep the working branch clean while moving
      work-in-progress changes through temporary branches.
  usage:
    - >
      In package-manager terms, mob sits in the collaboration-and-Git niche rather than
      acting as a general Git porcelain. Homebrew packages it as `mob`, and the same
      record family also maps it to Nix and Scoop, reflecting a cross-platform CLI
      audience for teams that prefer local editors and Git-based handoff over a shared
      remote IDE.
related-packages: []
category: developer-tools
package-manager:
  brew: mob
  nix: mob
  scoop: main/mob
package-manager-url: https://formulae.brew.sh/formula/mob
license: MIT
tags:
  - cli
  - collaboration
  - git
  - handover
  - mob-programming
description: Tool for smooth Git handover in mob programming sessions
executables:
  - mob
provenance:
  formula: mob
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
