id: brew:huexpress
display-name: HuExpress
homepage: https://github.com/kallisti5/huexpress
repo: https://github.com/kallisti5/huexpress
docs:
  - https://github.com/kallisti5/huexpress#readme
  - https://github.com/kallisti5/huexpress/tree/master/doc
config-file-location:
  unix:
    - huexpress.ini
    - huexpress.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      HuExpress appears as a niche emulator package rather than a broadly distributed
      developer tool. The batch Homebrew metadata lists Homebrew as the package manager
      entry, and the README names Mac OS X via Homebrew among supported platforms
      alongside Linux, Haiku, and FreeBSD.
  package-nerd-significance:
    - >
      For package nerds, HuExpress is interesting because it preserves a
      console-emulation lineage through package-manager distribution: old PC Engine
      emulator code, SDL/OpenGL portability work, Haiku support, and a Homebrew formula
      for a retro-computing tool that otherwise has a small upstream footprint.
  project-history:
    - >
      The GitHub repository was created in April 2011, and the first HuExpress release
      appeared in December 2013. The 3.0.x changelog shows a practical modernization
      arc: moving to SDL 2.0, adding OpenGL rendering and scaling, adding Haiku support,
      improving HCD archive tooling, removing older DOS Allegro and GTK+ code, and
      cleaning up the inherited emulator codebase.
  related-projects:
    - >
      Related projects include Hu-Go!, Bero's PC Engine emulator work, Hmmx's emulator
      improvements, SDL 2.0, SDL_mixer, libzip, OpenGL, Haiku, and the NEC PC
      Engine/TurboGrafx-16 software ecosystem.
  sources:
    - >
      Official repository README, changelog, GitHub repository and release metadata, and
      Homebrew package metadata supplied in the batch input.
  summary:
    - >
      HuExpress is a multi-platform PC Engine, CoreGrafx, and TurboGrafx-16 emulator.
      Its own README frames it as a fork of the Hu-Go! PC Engine emulator by Zeograd,
      itself based on earlier PC Engine emulator work credited to Bero and additional
      improvements from Hmmx's homepage.
  timeline:
    - '2011: kallisti5/huexpress repository created.'
    - '2013: HuExpress 3.0.1 published as the first HuExpress release.'
    - >
      2014: HuExpress 3.0.2 changelog records SDL 2.0, OpenGL rendering, HCD tooling,
      Haiku support, and code cleanup work.
    - '2017: HuExpress 3.0.4 release published with minor bug fixes and upkeep.'
  usage:
    - >
      Users run `huexpress` with a ROM, ISO, ISQ, ZIP, HCD archive, or backup memory
      file. Configuration is handled through command-line flags and huexpress
      configuration files, with options for CD emulation, fullscreen mode, BIOS
      behavior, ROM encoding, window scaling, and input mappings.
related-packages:
  - id: brew:mednafen
    reason: >
      Choose Mednafen when you want an actively documented multi-system emulator that
      includes PC Engine emulation, rather than HuExpress's dedicated Hu-Go!-derived
      implementation.
    rel: alternative
    sources:
      - https://github.com/kallisti5/huexpress#readme
      - https://mednafen.github.io/documentation/
category: games
package-manager:
  brew: huexpress
package-manager-url: https://formulae.brew.sh/formula/huexpress
license: GPL-2.0-or-later
tags:
  - cli
  - emulator
  - games
  - pc-engine
  - turbografx-16
description: PC Engine emulator
executables:
  - hucrc
  - huexpress
provenance:
  formula: huexpress
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
