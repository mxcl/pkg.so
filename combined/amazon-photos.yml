history:
  adoption-history:
    - >
      Amazon launched Prime Photos for US Prime members with support for iOS, Android,
      Fire devices, Mac, Windows, game consoles, and selected smart TVs. Amazon Photos
      subsequently became a cross-device Prime benefit integrated with products
      including Fire TV, Echo Show, and Alexa.
  package-nerd-significance:
    - >
      The desktop package is the Mac client for a consumer cloud service rather than a
      standalone local photo manager. For package users, its main value is installing a
      background-capable desktop backup and synchronization client without manually
      obtaining Amazon's installer.
  project-history:
    - >
      Amazon introduced Prime Photos in November 2014 as an Amazon Cloud Drive benefit
      offering Prime members unlimited storage for full-resolution photographs. The
      product later adopted the Amazon Photos identity and expanded around automatic
      backup, albums, sharing, search, and memory-discovery features.
  related-projects:
    - >
      Amazon Prime, which includes the service's unlimited full-resolution photo storage
      benefit.
    - Amazon Cloud Drive, the original storage platform associated with Prime Photos.
    - >
      Fire TV, Echo Show, and Alexa, which provide additional ways to display or
      retrieve an Amazon Photos library.
  sources:
    - https://digprjsurvey.amazon.com/csad/help/node/G5HFC9N4ETM8RLWJ
    - >
      https://press.aboutamazon.com/2014/11/amazon-prime-members-can-now-enjoy-free-unlimited-photo-storage-with-prime-photos
    - https://www.aboutamazon.com/news/amazon-prime/how-to-use-amazon-photos-storage
  summary:
    - >
      Amazon Photos is Amazon's cloud photo backup, organization, viewing, and sharing
      service, delivered on macOS through the Amazon Photos desktop application.
  timeline:
    - >
      2014: Amazon introduced Prime Photos as an unlimited photo-storage benefit for US
      Prime members.
    - '2016: Prime Photos expanded to Amazon Prime members in Japan.'
    - >
      2026: Amazon announced a redesigned mobile experience centered on memories and
      natural-language search.
  usage:
    - >
      On a Mac, users sign in with an Amazon account, select folders in the desktop
      application's Backup tab, and configure backup recurrence and included file types.
      Photos can then be accessed and shared through Amazon Photos on supported devices
      and the web.
