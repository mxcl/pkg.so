id: brew:libgfshare
display-name: libgfshare
homepage: https://github.com/kinnison/libgfshare
repo: https://github.com/kinnison/libgfshare
docs:
  - https://github.com/kinnison/libgfshare#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libgfshare stayed niche but useful: package managers expose it for users who want
      a small secret-sharing library and command-line tools without a larger
      key-management suite. Its own README gives rare-use GPG secret keys, such as
      archive-signing keys, as a motivating example.
  package-nerd-significance:
    - >
      For package nerds, libgfshare is the tiny Unix-security-tool version of an
      important cryptographic idea: no service, no database, just a C library and two
      tools. Its significance is mostly in simplicity and auditability rather than broad
      adoption.
  project-history:
    - >
      The upstream README is signed by Daniel Silverstone on 2006-01-15 and describes
      the library as a Shamir Secret Sharing implementation in the Galois Field 2^8. It
      explicitly credits inspiration from Mark D. Wooding's Catacomb library.
    - >
      A 2009-11-18 README note by Simon McVittie documents recovery behavior for earlier
      gfsplit outputs that could produce a share numbered 000, giving the project a
      small but concrete maintenance history.
  related-projects:
    - >
      Shamir secret sharing is the underlying scheme. Mark D. Wooding's Catacomb library
      is named by the upstream README as an inspiration. GnuPG key-handling is a
      documented use case.
  sources:
    - https://formulae.brew.sh/formula/libgfshare
    - https://github.com/kinnison/libgfshare
    - https://raw.githubusercontent.com/kinnison/libgfshare/master/README
  summary:
    - >
      libgfshare is a compact C implementation of Shamir secret sharing over GF(2^8),
      with gfsplit and gfcombine tools for splitting and recombining byte-oriented
      secrets.
  timeline:
    - >
      2006: Daniel Silverstone README note describes the initial library and its GF(2^8)
      Shamir-sharing design.
    - >
      2009: Simon McVittie README note documents recovery from earlier gfsplit
      share-numbering behavior.
    - '2026: GitHub repository metadata listed 80 commits and one tag.'
  usage:
    - >
      The library splits a secret into C shares such that any T shares can recover it.
      The CLI tools make that model usable from shell scripts or operational
      key-handling procedures.
related-packages:
  - id: brew:ssss
    reason: >
      Choose ssss for a standalone Unix command-line implementation with text and
      hexadecimal modes; choose libgfshare when software needs an embeddable C library
      or byte-oriented gfsplit/gfcombine workflow.
    rel: alternative
    sources:
      - http://point-at-infinity.org/ssss/
      - http://point-at-infinity.org/ssss/ssss.1.html
      - https://raw.githubusercontent.com/kinnison/libgfshare/master/README
category: security
package-manager:
  brew: libgfshare
  debian: libgfshare-bin
  macports: libgfshare
  pacman: libgfshare
  ubuntu: libgfshare-bin
package-manager-url: https://formulae.brew.sh/formula/libgfshare
license: MIT
tags:
  - c-library
  - cli
  - cryptography
  - gf256
  - secret-sharing
  - shamir-secret-sharing
description: Library for sharing secrets
executables:
  - gfcombine
  - gfsplit
provenance:
  formula: libgfshare
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
