id: brew:gfold
display-name: gfold
homepage: https://github.com/nickgerace/gfold
repo: https://github.com/nickgerace/gfold
docs:
  - https://github.com/nickgerace/gfold/tree/main/docs
  - https://github.com/nickgerace/gfold
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/gfold.toml
    - $XDG_CONFIG_HOME/gfold/config.toml
    - ~/.config/gfold.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      By the gfold 3 announcement, the project had reached about 1,600 crates.io
      downloads, a lib.rs ranking in command-line utilities, and 90 GitHub stars; the
      gfold 4 announcement noted larger figures soon after. The author credited Arch
      User Repository packaging and the One Hundred Rust Binaries series with increasing
      the user base.
  package-nerd-significance:
    - >
      gfold is notable as a small Rust CLI whose packaging story spans Cargo, Homebrew
      core, Arch, Nix, and prebuilt release artifacts. It also illustrates a common Rust
      CLI evolution: early learning project, public crate, refactor for maintainability,
      then package-manager polish.
  project-history:
    - >
      Nick Gerace described gfold as starting in a private repository during his early
      Rust learning period around 2019, becoming open source in April 2020, and growing
      into a daily-use tool. The 2022 gfold 3 announcement described a domain-oriented
      refactor, while the gfold 4 announcement described a major follow-up focused on
      performance, git2-rs, TOML configuration, and breaking changes.
  related-projects:
    - >
      gfold depends conceptually on Git and technically on the Rust CLI ecosystem,
      including git2-rs, rayon, crates.io, Homebrew, Arch packaging, and Nix.
  sources:
    - https://github.com/nickgerace/gfold
    - https://nickgerace.dev/posts/announcing-gfold3/
    - https://nickgerace.dev/posts/announcing-gfold4/
    - https://raw.githubusercontent.com/nickgerace/gfold/main/CHANGELOG.md
  summary:
    - >
      gfold is a Rust command-line tool for scanning one or more directories and
      reporting useful status about many Git repositories at once. It belongs to the
      class of developer workflow tools built for people who keep source checkouts
      spread across a home, work, or dotfiles tree.
  timeline:
    - '2019: The author began learning Rust and used early gfold privately.'
    - '2020: gfold was open sourced in April.'
    - '2022: gfold 3 introduced a major refactor and a new display approach.'
    - >
      2022: gfold 4 restored git2-rs use, moved config from JSON to TOML, and focused on
      speed.
    - '2025: The project switched from semantic versioning to CalVer starting with 2025.2.1.'
  usage:
    - >
      Practitioners run `gfold` in a directory tree, pass paths explicitly, or configure
      default paths in a TOML file. The tool reads repository metadata without writing
      to the filesystem, supports display modes and color modes, and can be installed
      through Homebrew, Arch Linux, Nix, Cargo, or release binaries.
related-packages:
  - id: brew:git
    reason: >
      Git creates and manages the repositories whose state gfold discovers and
      summarizes across directory trees.
    rel: adjacent_workflow
    sources:
      - https://github.com/nickgerace/gfold
      - https://git-scm.com/doc
  - id: brew:lazygit
    reason: >
      Use gfold to spot repositories needing attention across many directories, then run
      lazygit inside a selected repository to inspect and perform Git operations
      interactively.
    rel: adjacent_workflow
    sources:
      - https://github.com/nickgerace/gfold
      - https://github.com/jesseduffield/lazygit
category: developer-tools
package-manager:
  apk: gfold
  brew: gfold
  macports: gfold
  nix: gfold
  pacman: gfold
package-manager-url: https://formulae.brew.sh/formula/gfold
license: Apache-2.0
tags:
  - cli
  - git
  - repository-management
  - rust
description: Help keep track of your Git repositories, written in Rust
executables:
  - gfold
provenance:
  formula: gfold
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
