id: brew:medusa
display-name: medusa
homepage: https://secure-contracts.com/program-analysis/medusa/docs/src/
repo: https://github.com/crytic/medusa
docs:
  - https://github.com/crytic/medusa/blob/master/docs/src/SUMMARY.md
  - https://secure-contracts.com/program-analysis/medusa/docs/src
config-file-location:
  unix: medusa.json
credentials-file-location: null
history:
  adoption-history:
    - >
      medusa is a specialized package for smart-contract auditors, protocol teams, and
      Solidity developers who need fuzzing in local or CI workflows. Official
      installation docs include Go install, Homebrew, Nix, Docker, source builds, and
      precompiled binaries, which is a strong signal that the project expects
      package-manager and automation use.
    - >
      The package input lists Homebrew, Debian, Fedora, MacPorts, Nix, Pacman, and
      Ubuntu package names, showing that the tool has moved beyond a source-only
      security project into normal developer-tool distribution channels.
  package-nerd-significance:
    - >
      medusa is interesting to package maintainers because it brings smart-contract
      fuzzing into a single Go CLI while still interoperating with common Ethereum
      tooling such as crytic-compile, Slither, Foundry, Hardhat, and go-ethereum. It
      sits in the same toolbox category as Echidna and Slither, but with a distinct
      implementation and parallel fuzzing model.
  project-history:
    - >
      The official repository was created in 2023 and its first GitHub release was
      v0.1.0 in March 2023. The project entered a security tooling space already shaped
      by Crytic tools such as Echidna and Slither, but focused on a Go implementation
      powered by go-ethereum.
    - >
      The documentation grew into a mdBook under Trail of Bits' Building Secure
      Contracts material, with sections for installation, first steps, project
      configuration, CLI commands, fuzzing lifecycle, invariant testing, cheatcodes, and
      an evolving Go API.
  related-projects:
    - >
      medusa is related to Echidna, go-ethereum, crytic-compile, Slither, Foundry,
      Hardhat, and Trail of Bits' Building Secure Contracts documentation.
  sources:
    - https://api.github.com/repos/crytic/medusa
    - https://api.github.com/repos/crytic/medusa/releases
    - https://github.com/crytic/medusa
    - https://raw.githubusercontent.com/crytic/medusa/master/docs/src/cli/init.md
    - >
      https://raw.githubusercontent.com/crytic/medusa/master/docs/src/getting_started/first_steps.md
    - >
      https://raw.githubusercontent.com/crytic/medusa/master/docs/src/getting_started/installation.md
    - https://secure-contracts.com/program-analysis/medusa/docs/src/
  summary:
    - >
      medusa is a cross-platform, go-ethereum-based smart-contract fuzzer from the
      Crytic ecosystem. Its official README describes it as inspired by Echidna and
      designed for parallelized fuzz testing through a CLI or Go API.
  timeline:
    - '2023: Repository is created and v0.1.0 is released.'
    - >
      2023: Documentation describes `medusa init`, `medusa fuzz`, and `medusa.json`
      project configuration workflows.
    - '2026: GitHub repository lists v1.5.1 as the latest release.'
  usage:
    - >
      Users initialize a Solidity project with `medusa init`, which creates
      `medusa.json`, then run campaigns with commands such as `medusa fuzz
      --target-contracts ... --test-limit ...`. Official docs recommend placing target
      contracts and fuzz limits in the project configuration file.
related-packages:
  - id: brew:echidna
    reason: >
      Choose Echidna for Crytic's older and more extensively tested property fuzzer;
      medusa's official FAQ describes medusa as the newer Go/geth-based alternative with
      a native API direction.
    rel: alternative
    sources:
      - https://secure-contracts.com/program-analysis/medusa/docs/src/faq.html
      - https://github.com/crytic/echidna
  - id: brew:crytic-compile
    reason: >
      Use crytic-compile as medusa's compilation layer for Foundry, Hardhat, and other
      supported smart-contract project layouts.
    rel: adjacent_workflow
    sources:
      - https://secure-contracts.com/program-analysis/medusa/docs/src/cli/init.html
      - https://github.com/crytic/crytic-compile
  - id: brew:slither-analyzer
    reason: >
      Install Slither alongside medusa when you want static analysis and the improved
      fuzz-value generation recommended by medusa's installation guide.
    rel: adjacent_workflow
    sources:
      - >
        https://secure-contracts.com/program-analysis/medusa/docs/src/getting_started/installation.html
      - https://github.com/crytic/slither
  - id: brew:foundry
    reason: >
      Use Foundry to build and test the Solidity project, then let medusa consume the
      project through its documented crytic-compile workflow.
    rel: adjacent_workflow
    sources:
      - https://secure-contracts.com/program-analysis/medusa/docs/src/cli/init.html
      - https://getfoundry.sh/
category: security
