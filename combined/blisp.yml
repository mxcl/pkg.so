id: brew:blisp
display-name: BLISP
homepage: https://github.com/pine64/blisp
repo: https://github.com/pine64/blisp
docs:
  - https://github.com/pine64/blisp/wiki/Update-Pinecil-V2
  - https://github.com/pine64/blisp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      BLISP's adoption is tied to PINE64 hardware workflows, especially Pinecil V2
      firmware updates documented in the project's GitHub wiki. The input package
      metadata records packaging in Homebrew, MacPorts, Nix, and Arch/pacman, showing
      that the tool has moved beyond manual downloads into common Unix package channels.
  package-nerd-significance:
    - >
      BLISP matters to package nerds because it is the kind of tiny hardware utility
      that becomes valuable only when packaging makes it boring: a maintained formula
      lets firmware-update docs say `install blisp` instead of asking users to build a
      USB serial flasher from source.
    - >
      It also shows the modern RISC-V microcontroller toolchain pattern: open hardware
      communities need small, cross-platform flashing tools with libserialport-style
      dependencies, reproducible builds, and packaged CLIs.
  project-history:
    - >
      The official repository describes BLISP as a Bouffalo Labs ISP tool and library,
      with supported MCU families including BL60x and BL70x and supported devices
      including Pinecil V2 and Pinecone. GitHub repository metadata dates the public
      repository to 2022, and the release history shows public tagged releases beginning
      with v0.0.2 in January 2023 and continuing through v0.0.5 in August 2025.
    - >
      The README cautions that the library API and CLI arguments are not stable yet,
      which fits BLISP's role as a young hardware-support tool rather than a frozen
      platform API.
  related-projects:
    - PINE64 Pinecil V2 and Pinecone are named supported devices in the README.
    - Bouffalo Labs BL60x and BL70x chip families are named supported targets.
    - libserialport is part of the build/debugging context noted by the README.
  sources:
    - GitHub repository metadata via gh api repos/pine64/blisp
    - https://github.com/pine64/blisp#readme
    - https://github.com/pine64/blisp/releases
    - https://github.com/pine64/blisp/wiki/Update-Pinecil-V2
    - source_facts.package-manager
  summary:
    - >
      BLISP is PINE64's open source in-system-programming tool and library for flashing
      Bouffalo Labs RISC-V microcontrollers and SoCs. In package-manager terms it is a
      small but useful hardware enablement CLI: it turns firmware update instructions
      for BL60x and BL70x-class chips into a repeatable command-line workflow.
  timeline:
    - '2022: Official GitHub repository created for PINE64 BLISP.'
    - >
      2023: Public BLISP releases v0.0.2 and v0.0.3 published in January, followed by
      v0.0.4 in August.
    - >
      2025: BLISP v0.0.5 published with the repository README still presenting Pinecil
      V2 update workflows.
  usage:
    - >
      Users run `blisp write` with a target chip family, optional serial port, reset
      handling, and a firmware image. The README gives BL70x USB flashing examples with
      auto-detected serial ports on Windows and BL60x examples requiring an explicit
      serial device such as `/dev/ttyUSB0`.
related-packages: []
category: developer-tools
