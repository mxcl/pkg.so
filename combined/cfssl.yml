id: brew:cfssl
display-name: CFSSL
homepage: https://cfssl.org/
repo: https://github.com/cloudflare/cfssl
docs:
  - https://cfssl.org/
  - https://github.com/cloudflare/cfssl#readme
  - https://github.com/cloudflare/cfssl/tree/master/doc
config-file-location: null
credentials-file-location:
  unix:
    - ca.pem
    - ca_key.pem
history:
  adoption-history:
    - >
      CFSSL became a durable package because it solves operational PKI tasks that teams
      need outside a browser or a single web server: generating CSRs and keys, signing
      certificates, bundling chains, scanning hosts, and exposing CA operations through
      an API.
    - >
      The package metadata in this batch shows CFSSL packaged across Homebrew, Alpine,
      MacPorts, Nix, Arch, and Scoop. Official installation also supports `go install`
      and prebuilt GitHub release binaries.
  package-nerd-significance:
    - >
      CFSSL is package-nerd significant because it turns PKI operations that are often
      hidden inside bespoke scripts into a set of installable Unix-style commands and a
      documented API server.
    - >
      It is also a classic Go security-tool package: one upstream repository builds
      several related executables, package managers expose the main toolkit, and
      operators can choose between system packages, Homebrew, Scoop, prebuilt release
      binaries, or `go install`.
  project-history:
    - >
      Cloudflare introduced CFSSL in July 2014 as an open-source toolkit for TLS and
      SSL, saying it was used internally for certificate-chain bundling and internal
      certificate-authority infrastructure. The GitHub repository was created the same
      month under Cloudflare's organization.
    - >
      The project is written in Go and ships multiple utilities, including `cfssl`,
      `cfssljson`, `cfssl-bundle`, `cfssl-certinfo`, `cfssl-newkey`, `cfssl-scan`,
      `mkbundle`, and `multirootca`. The documentation covers CLI operation, JSON
      configuration, authentication, an HTTP API, certificate bundling, signing, OCSP,
      and CA serving.
  related-projects:
    - >
      cfssl_trust is referenced by the README as the source for bundle files and
      platform metadata.
    - >
      multirootca is shipped by the same repository as a certificate-authority server
      using multiple signing keys.
    - Go is the implementation language and installation path documented by the project.
  sources:
    - https://api.github.com/repos/cloudflare/cfssl
    - https://github.com/cloudflare/cfssl
    - https://cfssl.org/
    - https://github.com/cloudflare/cfssl#readme
    - https://github.com/cloudflare/cfssl/tree/master/doc
    - https://formulae.brew.sh/api/formula/cfssl.json
    - https://api.github.com/repos/cloudflare/cfssl/releases
  summary:
    - >
      CFSSL is Cloudflare's PKI and TLS toolkit. The official README describes it as
      both a command-line tool and an HTTP API server for signing, verifying, bundling,
      scanning, and serving certificate-authority workflows.
  timeline:
    - >
      2014: Cloudflare introduces CFSSL as an open-source PKI toolkit and creates the
      GitHub repository.
    - '2020: v1.5.0 is published on GitHub releases.'
    - '2021: v1.6.0 and v1.6.1 are published on GitHub releases.'
    - '2024: v1.6.5 is published on GitHub releases.'
    - >
      2026: The README documents Go 1.20+ as the build requirement and continues to
      describe CFSSL as Cloudflare's PKI/TLS toolkit.
  usage:
    - >
      The `cfssl` command supports subcommands such as sign, bundle, genkey, gencert,
      serve, version, selfsign, and print-defaults. The README documents default CA
      credential filenames `ca.pem` and `ca_key.pem` for signing and serving.
    - >
      The configuration file is a JSON dictionary for signing profiles, OCSP,
      authentication, and remote servers, but the docs present it as an argument such as
      `-config config` rather than a fixed path. For that reason, the config-file
      location is null while the default CA credential filenames are recorded.
related-packages:
  - id: brew:step
    reason: >
      Choose Smallstep's step CLI when an integrated certificate-and-cryptography
      command with documented step-ca bootstrapping and online-CA workflows is
      preferable; choose CFSSL for Cloudflare's JSON-configured signing, bundling,
      scanning, and HTTP CA toolkit.
    rel: alternative
    sources:
      - https://github.com/cloudflare/cfssl#readme
      - https://smallstep.com/docs/step-cli
      - https://smallstep.com/docs/step-cli/the-step-command
category: security
package-manager:
  apk: cfssl
  brew: cfssl
  macports: cfssl
  nix: cfssl
  pacman: cfssl
  scoop: extras/cfssl
package-manager-url: https://formulae.brew.sh/formula/cfssl
license: BSD-2-Clause
tags:
  - certificates
  - cli
  - cloudflare
  - cryptography
  - pki
  - tls
description: CloudFlare's PKI toolkit
executables:
  - cfssl
  - cfssl-bundle
  - cfssl-certinfo
  - cfssl-newkey
  - cfssl-scan
  - cfssljson
  - multirootca
provenance:
  formula: cfssl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
