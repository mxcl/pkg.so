id: brew:cargo-hack
display-name: cargo-hack
homepage: https://github.com/taiki-e/cargo-hack
repo: https://github.com/taiki-e/cargo-hack
docs:
  - https://github.com/taiki-e/cargo-hack#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cargo-hack was adopted by Rust crate maintainers who needed confidence that
      optional features, no-default-features builds, and workspace combinations
      continued to compile.
    - >
      Its usage fits CI particularly well because a maintainer can run ordinary Cargo
      subcommands through cargo-hack while expanding the matrix of features or Rust
      versions under test.
  package-nerd-significance:
    - >
      cargo-hack is important to package maintainers because Rust features form part of
      a crate's public compatibility surface. Testing only the default feature set can
      miss broken optional integrations; cargo-hack makes those combinations cheap to
      exercise.
    - >
      It is also a good example of an ecosystem utility that exists because package
      metadata is combinatorial: the hard part is not installing the package, it is
      validating all the shapes users can request from it.
  project-history:
    - >
      The cargo-hack repository was created in October 2019 and version 0.1.0 was
      published to crates.io the next day. The README describes it as a Cargo subcommand
      providing options useful for testing and continuous integration.
    - >
      The project developed around gaps in Cargo's native feature testing ergonomics.
      Its README references several upstream Cargo issues and documents behavior around
      workspaces, features, optional dependencies, package selection, and Rust version
      checks.
  related-projects:
    - >
      The README lists cargo-llvm-cov, cargo-minimal-versions, and cargo-config2 as
      related projects by the same maintainer ecosystem.
    - >
      Cargo itself is the underlying command runner and source of many linked
      feature/workspace issues in the README.
    - >
      cargo-minimal-versions is especially adjacent because both tools help maintainers
      test package compatibility beyond the default build.
  sources:
    - https://api.github.com/repos/taiki-e/cargo-hack
    - https://crates.io/crates/cargo-hack
    - https://github.com/taiki-e/cargo-hack#readme
  summary:
    - >
      cargo-hack is a Cargo subcommand for testing Rust packages across feature
      combinations, workspace selections, and Rust version ranges. It is built for the
      practical pain of continuous integration in feature-heavy crates.
    - >
      Its best-known commands, `--each-feature` and `--feature-powerset`, make Cargo
      feature-matrix testing explicit and scriptable.
  timeline:
    - '2019-10-29: GitHub repository created.'
    - '2019-10-30: cargo-hack 0.1.0 published to crates.io.'
    - >
      2020s: README documents feature powerset, each-feature, optional dependency,
      workspace, and Rust-version testing flows.
    - '2026: Crate has more than 1.6 million crates.io downloads and remains active.'
  usage:
    - >
      Common usage wraps a Cargo command, for example checking every individual feature
      or a feature powerset. The README documents `--each-feature`,
      `--feature-powerset`, feature exclusions, optional dependency handling,
      `--rust-version`, and `--version-range`.
    - >
      The tool also improves or extends behavior around existing Cargo flags such as
      workspace/package selection and manifest paths, keeping it close to Cargo rather
      than inventing a separate build system.
related-packages:
  - id: brew:cargo-llvm-cov
    reason: >
      Pair cargo-llvm-cov with cargo-hack when CI needs both feature-matrix validation
      and LLVM source-based coverage reporting for the exercised Rust tests.
    rel: adjacent_workflow
    sources:
      - https://github.com/taiki-e/cargo-hack#related-projects
      - https://github.com/taiki-e/cargo-llvm-cov#readme
category: developer-tools
