history:
  project-history:
    - >
      The libretro port moved Mr.Boom into the RetroArch core ecosystem and made it
      portable across many targets. The repository lists Android, Linux, macOS, Nintendo
      GameCube, Switch, Wii, Raspberry Pi, PlayStation 2/3/Portable, Windows, Xbox, and
      Xbox 360 among supported RetroArch platforms, with standalone SDL1.2 and SDL2
      builds also available. Gameplay features called out by the sources include
      netplay, AI bots, pushing bombs, remote controls, kangaroo riding, monsters, team
      modes, and up to eight players.
  sources:
    - http://mrboom.mumblecore.org/
    - https://docs.libretro.com/library/mr_boom
    - https://formulae.brew.sh/formula/mrboom
    - https://github.com/Javanaise/mrboom-libretro
  summary:
    - >
      Mr.Boom is an eight-player Bomberman-style game whose package-manager form comes
      from the RetroArch/Libretro and SDL port. The old project site presents the
      DOS/Windows-era game as an IPX-compatible Bomberman clone supporting up to eight
      simultaneous players, while the modern GitHub repository describes the
      libretro/SDL version as converted from DOS assembly using asm2c.
  usage:
    - >
      Its adoption context is retro-gaming packaging rather than application
      infrastructure. Libretro's documentation treats Mr.Boom as a game/scripting-engine
      core: it can be loaded directly without content files, supports save states,
      rewind, netplay, controllers, and RetroPad input mappings. Homebrew and Linux
      distribution packages expose the standalone mrboom executable for users who want
      the game outside RetroArch, while the upstream repository remains centered on the
      libretro core and SDL builds.
related-packages:
  - id: cask:retroarch-metal
    reason: >
      RetroArch is the documented frontend that loads and runs the Mr.Boom libretro
      core, including its controller, save-state, rewind, and netplay features.
    rel: adjacent_workflow
    sources:
      - https://docs.libretro.com/library/mr_boom/
      - https://www.retroarch.com/
