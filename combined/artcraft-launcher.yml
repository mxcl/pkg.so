id: cask:artcraft-launcher
display-name: ArtCraft Launcher
homepage: https://github.com/storytold/craft-launcher
repo: https://github.com/storytold/craft-launcher
docs:
  - https://getartcraft.com/apps
  - https://github.com/storytold/craft-launcher#readme
config-file-location:
  linux: ~/.local/share/ai.storyteller.artcraft-launcher/app.ron
  macos: ~/Library/Application Support/ai.storyteller.artcraft-launcher/app.ron
  windows: '%APPDATA%\ai.storyteller.artcraft-launcher\app.ron'
credentials-file-location: null
history:
  adoption-history:
    - >
      The launcher is distributed for macOS, Windows, Linux, FreeBSD, and the web. Its
      official documentation still labels it early alpha, so broad platform availability
      is established but long-term adoption is not yet demonstrated.
  package-nerd-significance:
    - >
      ArtCraft Launcher packages an entire creative-application suite behind one native
      installer and updater. Its package-management interest lies in selecting
      platform-specific artifacts, verifying published checksums, recognizing existing
      installations, and avoiding replacement of running applications.
  project-history:
    - >
      ArtCraft Launcher was created by the ArtCraft team as the official native launcher
      for the Craft App Suite. The project credits several earlier community launchers
      for ideas involving installation detection, update checks, checksum verification,
      interruption recovery, and desktop integration.
    - >
      The launcher and its web build are written in Rust. The desktop application uses a
      native interface rather than Electron or a web view, while the web build exposes
      the same application catalog without host installation capabilities.
  related-projects:
    - >
      The launcher directly manages the Craft App Suite, including PhotoCraft,
      VectorCraft, FilmCraft, LightCraft, PdfCraft, EffectCraft, DesignCraft, FigCraft,
      WordCraft, SoundCraft, DeckCraft, CADCraft, and GridCraft.
  sources:
    - https://getartcraft.com/apps
    - https://github.com/storytold/craft-launcher#readme
    - >
      https://github.com/storytold/craft-launcher/blob/main/apps/artcraft-launcher/src/settings_file.rs
  summary:
    - >
      ArtCraft Launcher is the official native installer, updater, and application
      launcher for the Craft App Suite of open-source creative tools.
  timeline:
    - '2026: ArtCraft Launcher entered public early-alpha distribution.'
    - >
      2026: The official launcher supported native releases across macOS, Windows,
      Linux, and FreeBSD, plus a catalog-only web build.
  usage:
    - >
      Users select Craft applications in one interface; the launcher chooses the
      appropriate package for the operating system and processor, verifies it against
      the release checksum, installs or updates it, and opens installed applications. It
      can remain in the menu bar or system tray to check for updates.
related-packages:
  - id: cask:photocraft
    reason: >
      ArtCraft Launcher explicitly installs, updates, and opens PhotoCraft, the suite's
      layered image editor.
    rel: adjacent_workflow
    sources:
      - https://github.com/storytold/craft-launcher#readme
      - https://getartcraft.com/apps/photocraft
  - id: cask:pdfcraft
    reason: >
      ArtCraft Launcher explicitly manages PdfCraft, providing a direct installation and
      update path for the suite's PDF workbench.
    rel: adjacent_workflow
    sources:
      - https://github.com/storytold/craft-launcher#readme
      - https://getartcraft.com/apps/pdfcraft
category: productivity
package-manager:
  brew-cask: artcraft-launcher
package-manager-url: https://formulae.brew.sh/cask/artcraft-launcher
tags:
  - application-launcher
  - creative-tools
  - desktop
  - installer
  - native
  - rust
  - software-updater
description: Installer and updater for the Craft App Suite
applications:
  - ArtCraft Launcher.app
provenance:
  cask: artcraft-launcher
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
