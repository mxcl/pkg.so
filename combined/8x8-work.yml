credentials-file-location: null
history:
  adoption-history:
    - >
      The product is deployed by organizations using the 8x8 communications platform. It
      spans desktop, web, and mobile experiences, while administrators can centrally
      manage Work Apps settings through 8x8 Admin Console policies.
  package-nerd-significance:
    - >
      For package users, the cask provides a repeatable way to install and update a
      proprietary communications desktop application. Its importance is operational
      rather than ecosystem-oriented: keeping a frequently released collaboration client
      current across managed Macs.
  project-history:
    - >
      8x8 Work for Desktop evolved from 8x8's Virtual Office desktop application.
      Official documentation now presents it as part of a unified experience across
      desktop, web, and mobile clients.
  related-projects:
    - >
      8x8 Work for Web provides a browser-based counterpart with a shared interface. The
      wider 8x8 Work service includes mobile clients and centrally administered
      communications features.
  sources:
    - https://docs.8x8.com/8x8WebHelp/8x8-work-for-desktop/Content/workd/about-the-app.htm
    - https://docs.8x8.com/8x8WebHelp/8x8-work-for-desktop/Content/workd/about-the-web-app.htm
    - https://docs.8x8.com/8x8WebHelp/8x8-work-for-desktop/Content/workd/previous-releases.htm
  summary:
    - >
      8x8 Work is a proprietary unified-communications application for business calling,
      messaging, meetings, contacts, presence, fax, and related collaboration workflows.
  timeline:
    - 'Earlier era: The desktop client was known as the Virtual Office desktop app.'
    - >
      Current era: 8x8 Work provides coordinated desktop, web, and mobile experiences
      with regularly documented releases.
  usage:
    - >
      Users sign in with an organization's 8x8 account to place and manage calls,
      exchange messages and SMS, join meetings, manage contacts and presence, access
      recordings, and use supported fax features.
category: productivity
