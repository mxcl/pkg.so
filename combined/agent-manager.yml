id: brew:agent-manager
display-name: Agent Manager
homepage: https://agent-manager.dev/
repo: https://github.com/YoanWai/agent-manager
docs:
  - https://agent-manager.dev/docs
  - https://agent-manager.dev/docs/config
config-file-location:
  linux:
    - ~/.config/agent-manager/config.toml
    - $XDG_CONFIG_HOME/agent-manager/config.toml
  macos: ~/Library/Application Support/agent-manager/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project supports installation through Homebrew, an install script, the Arch
      User Repository, mise, Go tooling, and downloadable binaries. Homebrew packaging
      is also recorded in source_facts.package-manager.
  package-nerd-significance:
    - >
      Agent Manager represents the emerging package category of local AI-agent
      orchestration tools. Its use of ordinary tmux sessions is significant because it
      composes established Unix tooling with multiple independently installed
      coding-agent CLIs instead of replacing their runtimes or configuration.
  project-history:
    - >
      Agent Manager was developed as a Go terminal interface over tmux for running
      multiple coding agents side by side. The project expanded beyond session
      monitoring to include grouped projects, quick prompts, conversation revival,
      worktrees, diff review, desktop notifications, and MCP-based communication between
      managed sessions.
    - >
      The v0.37.0 release moved built-in tool commands and status rules into the binary,
      allowing support fixes for agent CLIs to be distributed through ordinary package
      upgrades.
  related-projects:
    - tmux supplies persistent terminal sessions.
    - >
      Claude Code, Codex, OpenCode, Grok, Gemini CLI, Pi, Command Code, and Hermes Agent
      are among the managed coding-agent CLIs.
  sources:
    - https://agent-manager.dev/docs/
    - https://agent-manager.dev/docs/config/
    - https://agent-manager.dev/docs/install/
    - https://github.com/YoanWai/agent-manager/releases
    - source_facts.package-manager
  summary:
    - >
      Agent Manager is a terminal user interface for organizing persistent AI
      coding-agent sessions on a private tmux server. It keeps the underlying agents,
      credentials, subscriptions, and configuration independent while providing a
      unified session list, status detection, prompting, worktrees, and code review.
  timeline:
    - >
      2026: The v0.37.0 release centralized built-in agent definitions and status rules
      in the binary.
  usage:
    - >
      Users start the TUI with `agent-manager`, create sessions associated with tools
      and directories, send prompts without attaching, revive terminated conversations,
      and review file changes from the terminal.
    - >
      Configuration is generated on first run. Agent Manager itself does not define a
      credentials file; each managed CLI continues to use its own authentication and
      configuration.
category: developer-tools
package-manager:
  brew: agent-manager
package-manager-url: https://formulae.brew.sh/formula/agent-manager
license: Apache-2.0
tags:
  - ai-agents
  - cli
  - code-review
  - coding-agents
  - mcp
  - session-management
  - tmux
  - tui
description: Run Claude Code, Codex, OpenCode and other AI coding agents in tmux
executables:
  - agent-manager
provenance:
  formula: agent-manager
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
