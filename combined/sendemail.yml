id: brew:sendemail
display-name: sendEmail
homepage: http://caspian.dotconf.net/menu/Software/SendEmail/
repo: https://github.com/zehm/sendEmail
docs:
  - http://caspian.dotconf.net/menu/Software/SendEmail
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      sendEmail has remained available across several Unix-oriented packaging
      ecosystems, including Homebrew, Debian, Ubuntu, Fedora-family repositories, and
      MacPorts. Its longevity reflects the usefulness of a small, dependency-light SMTP
      sender in scripts and administrative jobs.
  package-nerd-significance:
    - >
      The package is a classic example of a mature single-purpose Perl utility preserved
      by distribution maintainers. Its executable uses the distinctive capitalization
      sendEmail, while package managers commonly publish it under the lowercase name
      sendemail.
  project-history:
    - >
      Brandon Zehm created sendEmail as a lightweight command-line SMTP email client
      written in Perl. The project emphasizes sending mail directly from scripts without
      requiring a full graphical client.
  related-projects:
    - >
      sendmail and mail/mailx occupy adjacent command-line mail niches, but sendEmail is
      an SMTP client rather than the Sendmail mail-transfer agent.
  sources:
    - http://caspian.dotconf.net/menu/Software/SendEmail
    - source_facts.description
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      sendEmail is a lightweight Perl command-line program for sending messages through
      SMTP servers.
  timeline:
    - '2000s: sendEmail emerged as a standalone Perl SMTP-sending utility.'
    - >
      Later adoption: Packaged by major Unix-like package collections, including Debian,
      Ubuntu, Homebrew, MacPorts, and Fedora-family repositories.
  usage:
    - >
      Users invoke sendEmail with command-line options specifying sender, recipients,
      subject, message content, attachments, and an SMTP server. It is commonly used in
      shell scripts, monitoring alerts, cron jobs, and minimal environments where a full
      mail client is unnecessary.
category: networking
package-manager:
  brew: sendemail
  debian: sendemail
  dnf: sendemail
  macports: sendemail
  ubuntu: sendemail
package-manager-url: https://formulae.brew.sh/formula/sendemail
license: GPL-2.0-or-later
tags:
  - cli
  - email
  - mail-client
  - perl
  - smtp
description: Email program for sending SMTP mail
executables:
  - sendEmail
provenance:
  formula: sendemail
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
