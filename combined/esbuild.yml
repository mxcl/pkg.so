id: brew:esbuild
display-name: esbuild
homepage: https://esbuild.github.io/
repo: https://github.com/evanw/esbuild
docs:
  - https://esbuild.github.io/
  - https://esbuild.github.io/api
  - https://esbuild.github.io/getting-started
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package became important in JavaScript tooling because it offered a fast
      native binary through ordinary package-manager workflows. The npm package is the
      primary JavaScript distribution, while Homebrew and multiple Unix package managers
      carry command-line builds for system-level installation.
    - >
      Its adoption pattern differs from older bundlers such as webpack and Rollup: many
      projects use esbuild directly for fast bundling or minification, while others use
      it as an embedded transform/minify engine behind higher-level developer tools.
  package-nerd-significance:
    - >
      esbuild changed expectations for JavaScript package tooling latency. Package nerds
      care because it made native, single-purpose build executables feel normal in
      frontend toolchains, and because its versioned binary distribution model sits at
      the intersection of npm packages, system packages, and reproducible builds.
    - >
      It is also a useful comparison point for later tools: when a new bundler,
      transpiler, or dev server advertises speed, esbuild is one of the baseline
      projects people instinctively measure against.
  project-history:
    - >
      The project is developed in the evanw/esbuild repository and is documented on
      esbuild.github.io. Its public npm release history shows 0.1.0 published in April
      2020, followed by rapid 0.x releases as the tool accumulated bundling,
      minification, TypeScript, JSX, CSS, source-map, watch, serve, and plugin
      capabilities.
    - >
      esbuild's design is deliberately different from traditional JavaScript build
      tools: it ships as native code, exposes CLI, JavaScript, and Go APIs, and
      emphasizes doing parsing, printing, bundling, and minification without a cache.
      The upstream README frames this as a response to existing web build tools being
      much slower than necessary.
  related-projects:
    - >
      Related tools in the same package-manager conversation include webpack, Rollup,
      SWC, Babel, Terser, and Vite. esbuild overlaps with several of them but is
      commonly valued for fast transform, bundle, and minify paths rather than as an
      all-purpose application framework.
  sources:
    - https://github.com/evanw/esbuild
    - https://esbuild.github.io/
    - https://esbuild.github.io/api/
    - https://esbuild.github.io/getting-started/
    - https://github.com/evanw/esbuild/blob/main/CHANGELOG.md
    - https://www.npmjs.com/package/esbuild
    - https://formulae.brew.sh/formula/esbuild
  summary:
    - >
      esbuild is a JavaScript and CSS bundler and minifier whose package identity is
      built around speed: its upstream README describes the project goal as making web
      build tools far faster while still providing a modern, easy-to-use bundler.
  timeline:
    - '2020: esbuild 0.1.0 published to npm.'
    - >
      2020: 0.8.0-era releases show the project already moving quickly through bundler
      and transform features.
    - '2021: 0.14.x releases continue the long-running pre-1.0 cadence.'
    - '2026: 0.28.x releases still ship active fixes and platform/package integrity work.'
  usage:
    - >
      Common use is direct CLI invocation for bundling, minifying, transforming, or
      serving web assets, or calling the JavaScript API from build scripts. The official
      docs also document a Go API, loaders for JavaScript, TypeScript, JSX, CSS, JSON,
      text, and binary assets, and a plugin system for custom resolution and loading.
    - >
      For package-manager users, esbuild is notable because installation has to land the
      correct platform-specific executable. The official getting-started documentation
      discusses npm installation details and additional npm flags, while Homebrew
      exposes a single `esbuild` command for local use.
related-packages:
  - id: brew:rollup
    reason: >
      Choose Rollup as an alternative when its mature plugin ecosystem and
      library-oriented output workflow matter more than esbuild's native-code speed;
      esbuild's official benchmark treats Rollup plus Terser as a directly comparable
      production bundling path.
    rel: alternative
    sources:
      - https://esbuild.github.io/
      - https://rollupjs.org/
category: developer-tools
