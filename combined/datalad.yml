id: brew:datalad
display-name: DataLad
homepage: https://www.datalad.org
repo: https://github.com/datalad/datalad
docs:
  - https://docs.datalad.org/en/stable
  - https://docs.datalad.org/en/stable/generated/man/datalad.html
  - https://handbook.datalad.org/
config-file-location:
  unix:
    - ~/.gitconfig
    - .git/config
    - .datalad/config
credentials-file-location: null
history:
  adoption-history:
    - >
      DataLad adoption is strongest in research-data workflows where datasets,
      provenance, and distributed storage matter. The handbook emphasizes compatibility
      with Git and git-annex, making it attractive to users who already understand
      repository-based collaboration but need large-file logistics.
  package-nerd-significance:
    - >
      DataLad is notable in package-manager catalogs because it packages a research-data
      workflow stack into a Unix-style CLI, bridging Git, git-annex, metadata, and
      reproducibility tooling.
  project-history:
    - >
      The project grew around the idea that scientific datasets could use Git-style
      versioning while delegating large-file content management to git-annex. Its
      technical documentation frames DataLad as a CLI and Python API, with the public
      changelog showing early 0.x releases in 2015 and continuing through 1.x releases.
  related-projects:
    - >
      Git and git-annex are core related projects because DataLad datasets are Git
      repositories and DataLad uses git-annex for file content tracking and transport.
  sources:
    - https://docs.datalad.org/en/stable
    - https://docs.datalad.org/en/stable/changelog.html
    - https://handbook.datalad.org/en/latest/basics/101-180-FAQ.html
  summary:
    - >
      DataLad is a command-line and Python data-management system for datasets that need
      versioning, publication, and retrieval rather than only local storage.
  timeline:
    - '2015: DataLad 0.1 appears in the official changelog.'
    - '2024: DataLad reaches the 1.0 series.'
    - '2026: The official documentation continues to publish 1.x releases.'
  usage:
    - >
      Package users care about the `datalad` command because it can create, clone,
      publish, and retrieve dataset content while leaving the underlying repository
      usable with ordinary Git and git-annex commands.
related-packages:
  - id: brew:git-annex
    reason: >
      git-annex is DataLad's lower-level large-file storage foundation and can be used
      directly for advanced content placement, synchronization, redundancy, and
      special-remote workflows while retaining DataLad dataset compatibility.
    rel: adjacent_workflow
    sources:
      - https://docs.datalad.org/en/stable/related.html
      - https://docs.datalad.org/en/stable/glossary.html
      - https://git-annex.branchable.com/
category: data
package-manager:
  brew: datalad
  debian: datalad
  dnf: python3-datalad
  nix: datalad
package-manager-url: https://formulae.brew.sh/formula/datalad
license: MIT
tags:
  - cli
  - data-distribution
  - data-management
  - git-annex
  - reproducibility
  - scientific-data
description: Data distribution geared toward scientific datasets
executables:
  - datalad
  - git-annex-remote-datalad
  - git-annex-remote-datalad-archives
  - git-annex-remote-ora
  - git-annex-remote-ria
  - git-credential-datalad
provenance:
  formula: datalad
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
