  - fonts
  - terminal
  - text
description: Banner-like program prints strings as ASCII art
executables:
  - chkfont
  - figlet
  - figlist
  - showfigfonts
provenance:
  formula: figlet
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
