id: brew:gcab
display-name: gcab
homepage: https://wiki.gnome.org/msitools
repo: https://gitlab.gnome.org/GNOME/gcab
docs:
  - https://wiki.gnome.org/msitools
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official GitLab tags show gcab releases from early 2013 through the 1.x series,
      with v1.0 tagged in January 2018 and v1.6 tagged in July 2023. That release
      pattern places gcab among the small infrastructure packages that desktop
      distributions carry because higher-level Windows packaging tools depend on them.
  package-nerd-significance:
    - >
      gcab matters to package maintainers because Cabinet files are a Windows packaging
      primitive, while GNOME's msitools stack makes those formats scriptable from Unix
      packaging pipelines. It is a small package, but it sits at the awkward boundary
      between Linux build systems and Windows installer formats.
  project-history:
    - >
      The gcab repository describes GCab as a GObject library to create cabinet files.
      The broader GNOME msitools project describes its tool family as programs for
      inspecting and building Windows Installer files, based on libmsi, which in turn is
      a portable subset of Wine's Windows Installer implementation.
  related-projects:
    - >
      Related official GNOME projects include msitools and libgsf; msitools also
      documents its relationship to Wine's Windows Installer implementation and WiX-like
      tooling.
  sources:
    - https://gitlab.gnome.org/GNOME/gcab
    - https://gitlab.gnome.org/GNOME/gcab/-/raw/master/README.md
    - https://gitlab.gnome.org/GNOME/gcab/-/tags
    - https://gitlab.gnome.org/GNOME/msitools
    - https://gitlab.gnome.org/GNOME/msitools/-/raw/master/README.md
  summary:
    - >
      gcab is a GNOME-hosted command-line tool and GObject library for creating
      Microsoft Cabinet files. In package-manager culture it is usually encountered near
      msitools, libgsf, Wine-derived Windows Installer tooling, and cross-platform
      packaging workflows.
  timeline:
    - '2013: Early gcab 0.x tags published in GNOME GitLab history.'
    - '2018: gcab v1.0 tagged.'
    - '2023: gcab v1.6 tagged.'
  usage:
    - >
      The package provides the gcab command for cabinet archive work and the libgcab
      library interface. It is most relevant where Unix-like build systems need to
      assemble or inspect Windows installer-related artifacts without using native
      Windows tooling.
related-packages:
  - id: brew:msitools
    reason: >
      Use msitools alongside GCab when a workflow must build or inspect complete MSI
      installers rather than only their Cabinet archives.
    rel: adjacent_workflow
    sources:
      - https://wiki.gnome.org/msitools
      - https://gitlab.gnome.org/GNOME/msitools
      - https://gitlab.gnome.org/GNOME/gcab
category: developer-tools
