history:
  adoption-history:
    - >
      Kyoto Tycoon found a niche with users who wanted a Redis-like or memcached-like
      key-value service backed by Kyoto Cabinet's storage engines. Its HTTP protocol
      made non-C++ clients possible without linking to GPL libraries, and its memcached
      protocol plugin broadened compatibility.
  package-nerd-significance:
    - >
      Kyoto Tycoon matters to package nerds because it is the server half of a compact
      DBM stack: install Kyoto Cabinet for embedded storage, install Kyoto Tycoon when
      that storage needs a network protocol. It sits in the historical space between
      classic DBM files and popular daemonized key-value stores.
  project-history:
    - >
      Kyoto Tycoon was developed by FAL Labs in the same 2009-2012 period as Kyoto
      Cabinet. Where Kyoto Cabinet solves embedded DBM storage, Kyoto Tycoon solves the
      multi-process and remote-access problem by putting a server process and client
      library in front of one or more Kyoto Cabinet databases.
    - >
      The official specification explains the motivation plainly: Kyoto Cabinet is fast
      and concurrent inside a process, but users can run into trouble when multiple
      processes share a database or remote processes need access. Kyoto Tycoon is the
      server layer for that use case.
  related-projects:
    - >
      Related projects include Kyoto Cabinet, Tokyo Cabinet, Tokyo Tyrant, Tkrzw-RPC,
      memcached, Redis-like key-value servers, Lua scripting, HTTP APIs, and DBM-backed
      cache/storage services.
  sources:
    - https://blog.cloudflare.com/kyoto-tycoon-secure-replication/
    - https://dbmx.net/kyotocabinet/
    - https://dbmx.net/kyototycoon/
    - https://dbmx.net/kyototycoon/api/
    - https://dbmx.net/kyototycoon/spex.html
  summary:
    - >
      Kyoto Tycoon is the network server companion to Kyoto Cabinet. It exposes Kyoto
      Cabinet databases over HTTP, REST-style methods, TSV-RPC, and an efficient binary
      protocol, with support for expiration, hot backup, update logging, asynchronous
      replication, Lua scripting, and pluggable services.
  timeline:
    - >
      2009-2012: The official Kyoto Tycoon homepage carries FAL Labs copyright dates for
      this development period.
    - '2012-04-06: The official homepage shows this last-update date.'
    - '2012-05-25: The official fundamental specification shows this last-update date.'
    - >
      2014-12-02: Cloudflare described using Kyoto Tycoon to replicate data from
      PostgreSQL to edge data centers.
  usage:
    - >
      The package installs ktserver and remote-management utilities such as ktremotemgr.
      Common uses include cache servers, persistent key-value services, HTTP-accessible
      storage, replicated small databases, and Lua-extended operations close to the
      data.
related-packages:
  - id: brew:kyoto-cabinet
    reason: >
      Kyoto Cabinet is Kyoto Tycoon's embedded storage foundation and is the appropriate
      choice when an application needs local in-process DBM access rather than a network
      server.
    rel: adjacent_workflow
    sources:
      - https://dbmx.net/kyototycoon/
      - https://dbmx.net/kyotocabinet/
  - id: brew:redis
    reason: >
      Choose Redis when the application needs a broader, actively developed set of
      native data structures and server-side operations; Kyoto Tycoon is a simpler Kyoto
      Cabinet-backed cache and byte-oriented storage server.
    rel: alternative
    sources:
      - https://dbmx.net/kyototycoon/
      - https://redis.io/docs/latest/develop/data-types/
  - id: brew:memcached
    reason: >
      Choose Memcached for a deliberately minimal volatile cache; Kyoto Tycoon adds
      persistent Kyoto Cabinet storage, replication, scripting, and an included
      memcached-protocol plugin.
    rel: alternative
    sources:
      - https://dbmx.net/kyototycoon/spex.html
      - https://docs.memcached.org/
