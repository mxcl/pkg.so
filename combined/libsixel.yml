id: brew:libsixel
display-name: libsixel
homepage: https://github.com/saitoha/libsixel
repo: https://github.com/saitoha/libsixel
docs:
  - https://github.com/libsixel/libsixel#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libsixel rode a broader revival of terminal graphics. The README lists use in or
      integration with projects and workflows around gnuplot, Ghostscript, ImageMagick,
      lsix, FFmpeg-SIXEL, SDL experiments, w3m integration, GNU Screen forks, RetroArch,
      and terminal support in xterm, mlterm, iTerm2, WezTerm, and related emulators.
    - >
      The README also lists packaging through FreeBSD ports, pkgsrc, Homebrew, Debian,
      Arch, Gentoo, Ubuntu, NixOS, OpenBSD Ports, Fedora Copr, SlackBuilds, and
      MacPorts, which made it a common optional dependency for software that wants SIXEL
      output.
  package-nerd-significance:
    - >
      libsixel is a package-nerd favorite because it compresses a lot of terminal
      history into one dependency: DEC hardware, escape sequences, image quantization,
      terminal emulator feature flags, and modern CLI image previews all meet in a small
      C library.
    - >
      It also shows how optional media support propagates through package managers. A
      plotting tool, terminal browser, or file manager may grow SIXEL support only when
      a distro or formula enables the right build option and ships libsixel.
  project-history:
    - >
      The project traces back to Hayaki Saito's libsixel work, described as an
      implementation derived from kmiya's sixel encoder. Its README explains SIXEL as a
      Digital Equipment Corporation format for printer and terminal imaging whose data
      is represented as terminal-friendly escape sequences.
    - >
      A community fork under the libsixel GitHub organization continued the project
      after Saito stopped participating publicly in January 2020, according to the fork
      README. That fork collected improvements and security patches, later switching the
      build system to Meson for libsixel 2.0.
  related-projects:
    - >
      Related projects include the original saitoha/libsixel repository, kmiya's sixel
      encoder, mlterm, xterm, iTerm2, gnuplot, ImageMagick, Ghostscript, lsix,
      FFmpeg-SIXEL, and other terminal graphics protocols such as kitty graphics.
  sources:
    - https://github.com/libsixel/libsixel
    - https://github.com/libsixel/libsixel/blob/master/README.md
    - https://github.com/libsixel/libsixel/releases
    - https://github.com/saitoha/libsixel
  summary:
    - >
      libsixel is a C encoder and decoder for DEC SIXEL terminal graphics, plus
      command-line tools such as img2sixel and sixel2png. It matters because it helped
      revive a 1980s terminal image protocol for modern terminals, plots, previews, and
      command-line image workflows.
  timeline:
    - '1980s: DEC introduced SIXEL for printer and terminal imaging.'
    - >
      2020-01: The community fork README records Saito's disappearance from public
      maintenance activity.
    - '2025-01-11: The libsixel organization release page records v1.10.5.'
    - '2025-02-12: The libsixel organization repository was archived as read-only.'
  usage:
    - >
      Users most often meet libsixel through `img2sixel`, which converts images and
      animations into SIXEL escape sequences for display in a compatible terminal, and
      `sixel2png`, which decodes SIXEL back into PNG. Developers can use the C API and
      several language bindings to generate or decode SIXEL programmatically.
    - >
      The practical constraint is terminal support: when the terminal understands SIXEL,
      the output renders inline; when it does not, users see escape data or nothing
      useful.
related-packages:
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick when SIXEL is one format in a much broader image-processing
      workflow; libsixel is the focused option for an embeddable SIXEL codec and
      dedicated conversion tools.
    rel: alternative
    sources:
      - https://github.com/saitoha/libsixel/blob/master/README.md
      - https://imagemagick.org/
category: media
package-manager:
  apk: libsixel
  brew: libsixel
  debian: libsixel-bin
  dnf: libsixel
  macports: libsixel
  nix: libsixel
  pacman: libsixel
  ubuntu: libsixel-bin
  zypper: libsixel-bash-completion
package-manager-url: https://formulae.brew.sh/formula/libsixel
license: MIT
