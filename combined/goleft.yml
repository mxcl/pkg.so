id: brew:goleft
display-name: goleft
homepage: https://github.com/brentp/goleft
repo: https://github.com/brentp/goleft
docs:
  - https://github.com/brentp/goleft/blob/master/indexcov/README.md
  - https://github.com/brentp/goleft#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as a single static binary and is also available through
      bioinformatics package channels, including Bioconda as documented by the project.
      Its release history shows sustained maintenance around BAM, BAI, CRAM, and CRAI
      edge cases, especially in indexcov.
  package-nerd-significance:
    - >
      goleft packages several small genomics workflow utilities into one portable
      executable. indexcov is particularly notable because it derives a rapid
      whole-genome coverage estimate from BAM or CRAM indexes, allowing cohort QC
      without scanning every alignment record.
  project-history:
    - >
      goleft was developed in Go as a collection of coverage and quality-control tools
      for alignment files. Its command set grew to include sampled coverage statistics,
      parallelized depth calculation, matrix generation, index-based coverage
      estimation, balanced region generation, and sample-name extraction.
  related-projects:
    - SAMtools
    - HTSlib
    - Bioconda
    - BAM
    - CRAM
  sources:
    - https://github.com/brentp/goleft#readme
    - https://github.com/brentp/goleft/blob/master/indexcov/README.md
    - https://github.com/brentp/goleft/releases
  summary:
    - >
      goleft is a single-binary collection of genomics utilities for BAM and CRAM
      coverage analysis and quality control, including the widely used indexcov
      subcommand.
  timeline:
    - >
      Early releases established the multi-command Go binary and index-based coverage
      workflow.
    - >
      Later releases expanded and corrected indexcov support for CRAM/CRAI, BAI-only
      input, long reads, sex-chromosome inference, and normalization.
  usage:
    - >
      Run `goleft` to list subcommands and invoke a subcommand such as `covstats`,
      `depth`, `indexcov`, `indexsplit`, or `samplename`. For rapid cohort QC, `goleft
      indexcov --directory output/ *.bam` produces tabular and interactive HTML coverage
      outputs.
related-packages:
  - id: brew:mosdepth
    reason: >
      Choose mosdepth for fast per-base, window, or BED-region BAM/CRAM depth
      calculations; choose goleft indexcov when an index-only, seconds-scale
      whole-genome coverage estimate is sufficient.
    rel: alternative
    sources:
      - https://github.com/brentp/goleft/blob/master/indexcov/README.md
      - https://github.com/brentp/mosdepth#readme
  - id: brew:samtools
    reason: >
      SAMtools complements goleft because goleft's `depth` command parallelizes SAMtools
      over user-defined windows, while SAMtools supplies the underlying general
      alignment-processing commands.
    rel: adjacent_workflow
    sources:
      - https://github.com/brentp/goleft#readme
      - https://www.htslib.org/doc/samtools.html
category: science
package-manager:
  brew: goleft
package-manager-url: https://formulae.brew.sh/formula/goleft
license: MIT
