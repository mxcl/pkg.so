id: brew:mesheryctl
display-name: mesheryctl
homepage: https://meshery.io
repo: https://github.com/meshery/meshery
docs:
  - https://docs.meshery.io/guides/mesheryctl/working-with-mesheryctl
  - https://docs.meshery.io/reference/mesheryctl
config-file-location:
  unix: ~/.meshery/config.yaml
credentials-file-location:
  unix: ~/.meshery/auth.json
history:
  project-history:
    - >
      The CLI occupies the automation and operator-facing side of that platform. Meshery
      documentation describes mesheryctl as both the lifecycle manager for Meshery
      deployments and an alternate client for Meshery Server's REST API, alongside the
      web UI. In practice, users install or start Meshery, run system checks,
      authenticate, and invoke Meshery's application and infrastructure-management
      functions from scripts or terminals rather than from the browser.
  sources:
    - https://docs.meshery.io/guides/mesheryctl/working-with-mesheryctl/
    - https://docs.meshery.io/installation/mesheryctl/
    - https://docs.meshery.io/installation/quick-start/
    - https://formulae.brew.sh/formula/mesheryctl
    - https://github.com/meshery/meshery
    - https://layer5.io/company/news
    - https://www.cncf.io/projects/meshery/
  summary:
    - >
      mesheryctl is the command-line client for Meshery, the open source cloud native
      management plane stewarded by Layer5 and accepted into the CNCF Sandbox on June
      22, 2021. Meshery began in the service-mesh operations niche and grew into a
      broader Kubernetes and cloud-native infrastructure manager, with Meshery itself
      described by the project as a platform for designing, deploying, and operating
      Kubernetes-based infrastructure and applications.
  usage:
    - >
      Its package-manager niche is a Kubernetes/cloud-native admin binary rather than a
      general SDK. Homebrew and zypper packaging make it convenient for workstation and
      CI use, while the upstream source keeps the CLI in the main meshery/meshery
      repository beside the server and UI it controls.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubectl complements mesheryctl by providing direct, low-level inspection and
      control of the Kubernetes clusters on which Meshery deploys and operates
      infrastructure.
    rel: adjacent_workflow
    sources:
      - https://docs.meshery.io/installation/kubernetes/
      - https://kubernetes.io/docs/reference/kubectl/
category: cloud-infrastructure
package-manager:
  brew: mesheryctl
  zypper: mesheryctl
package-manager-url: https://formulae.brew.sh/formula/mesheryctl
license: Apache-2.0
tags:
  - cli
  - cloud-native
  - infrastructure-management
  - kubernetes
  - meshery
  - service-mesh
description: Command-line utility for Meshery, the cloud native management plane
executables:
  - mesheryctl
provenance:
  formula: mesheryctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
