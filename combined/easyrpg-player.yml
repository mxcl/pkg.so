id: brew:easyrpg-player
display-name: EasyRPG Player
homepage: https://easyrpg.org/
repo: https://github.com/EasyRPG/Player
docs:
  - https://easyrpg.org/player/manual
  - https://easyrpg.org/player/guide/webplayer
  - https://wiki.easyrpg.org/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/EasyRPG/Player
    - EasyRPG.ini
    - RPG_RT.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      EasyRPG Player's adoption is tied to the RPG Maker 2000/2003 freeware and fan-game
      community: users run it from a game directory containing RPG_RT.exe-era assets,
      while maintainers package it for desktop, mobile, web, and homebrew-style
      platforms. The input metadata records packages in Homebrew, Nix, APK, and DNF
      ecosystems.
    - >
      The 2015 release notes explicitly mention macOS distribution through Homebrew, and
      current release notes still call out Homebrew platforms when discussing archive
      filename encoding fixes. That gives it an unusually direct relationship with
      package-manager users for a retro-game interpreter.
  package-nerd-significance:
    - >
      EasyRPG Player is a dependency-sensitive package: liblcf must match the Player
      release, and optional audio, font, archive, JSON, and SDL dependencies change the
      feature set. For package maintainers, it is a compact case study in preserving old
      game formats while still tracking modern compiler, CMake, multimedia, and
      platform-port requirements.
    - >
      It also matters because the package is not just for launching games; it is a
      preservation runtime for an ecosystem whose original interpreter was tied to older
      Windows assumptions. Good packaging widens access to old RPG Maker games on
      Unix-like desktops, phones, browsers, and hobbyist systems.
  project-history:
    - >
      The EasyRPG Player GitHub repository was created in January 2012. The project
      website describes the Player as a program for playing RPG Maker 2000 and 2003
      games, with the goal of behaving like the original RPG_RT interpreter.
    - >
      The Player is part of the broader EasyRPG project and uses liblcf to read RPG
      Maker game data. The README points users to the EasyRPG website, wiki
      documentation, CI builds, and the GitHub issue tracker, reflecting a long-running
      preservation and compatibility project rather than a one-off emulator.
    - >
      Release history shows steady compatibility work. The 0.3 release in 2015
      highlighted major RPG Maker feature support, web-player improvements, Android
      work, and compatibility with games such as Yume Nikki-related content. Later
      releases moved the build and dependency stack forward, including CMake
      improvements, liblcf version coupling, FreeType/font work, C++17, SDL3 support,
      and archive handling.
  related-projects:
    - >
      EasyRPG liblcf is the parser library named by the README and release notes. Other
      related surfaces include the EasyRPG wiki, EasyRPG web player, CI builds, RPG
      Maker 2000/2003, and the original RPG_RT runtime compatibility target.
  sources:
    - https://easyrpg.org/player/
    - https://github.com/EasyRPG/Player
    - https://github.com/EasyRPG/Player/releases/tag/0.3
    - https://github.com/EasyRPG/Player/releases/tag/0.3.1
    - https://github.com/EasyRPG/Player/releases/tag/0.8.1
    - https://github.com/EasyRPG/Player/releases/tag/0.8.1.1
  summary:
    - >
      EasyRPG Player is a free, cross-platform interpreter for RPG Maker 2000, RPG Maker
      2003, and EasyRPG games. It is one of the more culturally significant packages in
      this batch because it preserves and reimplements a large body of hobbyist RPG
      Maker games outside the original Windows runtime.
  timeline:
    - '2012: Public EasyRPG Player repository created.'
    - >
      2015: 0.3 release documented major RPG Maker 2000/2003 compatibility improvements
      and web-player work.
    - '2015: 0.3.1 release notes mentioned macOS distribution via Homebrew.'
    - '2021: 0.7.0 release moved maintainers toward newer build systems and dependencies.'
    - '2023: 0.8 release improved fonts, build systems, and platform organization.'
    - >
      2025: 0.8.1 and 0.8.1.1 releases moved toward C++17, SDL3 support, CMake, and
      improved archive handling.
  usage:
    - >
      The README says to run `easyrpg-player` from an RPG Maker 2000 or 2003 game
      project folder. The project website also documents the web player, manuals,
      progress tracking, downloads, and compatibility testing.
related-packages: []
