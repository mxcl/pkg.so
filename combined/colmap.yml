config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      COLMAP became a standard open-source tool in photogrammetry, 3D reconstruction,
      and computer-vision research because it combines mature SfM/MVS algorithms with a
      usable GUI, CLI automation, sample datasets, and reproducible citation targets.
    - >
      Official download notes point to Windows binaries, Linux/Unix/BSD packages through
      Repology, Docker images, Conda packages, PyPI Python bindings, and source builds,
      showing adoption across research and package-manager distribution channels.
  package-nerd-significance:
    - >
      COLMAP is packaging-significant because it combines GUI, CLI, CUDA-sensitive
      computer-vision dependencies, Docker images, Conda packaging, Python bindings, and
      native distribution packages in one scientific software stack.
  project-history:
    - >
      The official README says COLMAP was originally written by Johannes Schoenberger
      with funding from PhD advisors Jan-Michael Frahm and Marc Pollefeys. It builds on
      existing computer-vision work and asks research users to cite its 2016
      Structure-from-Motion and Multi-View Stereo papers.
    - >
      The project has evolved from a reconstruction application into a broader ecosystem
      including official Docker images, Conda packages, and Python bindings through
      PyCOLMAP.
  related-projects:
    - >
      Official README names dependencies and related components including ceres-solver,
      poselib, sift-gpu, vlfeat, PyCOLMAP, and GLOMAP.
  sources:
    - https://colmap.github.io/
    - https://github.com/colmap/colmap
    - https://github.com/colmap/colmap/releases
  summary:
    - >
      COLMAP is a general-purpose Structure-from-Motion and Multi-View Stereo pipeline
      with both graphical and command-line interfaces.
  timeline:
    - >
      2016: COLMAP citation papers for Structure-from-Motion and Multi-View Stereo are
      published.
    - >
      2020s: Official README documents Docker images, Conda packages, PyCOLMAP bindings,
      and distribution packages.
    - '2024: Official README includes GLOMAP citation guidance for the global SfM pipeline.'
  usage:
    - >
      Users reconstruct ordered or unordered image collections through automatic
      reconstruction, GUI workflows, or CLI pipelines. Package users commonly install
      the colmap executable for local photogrammetry jobs, research experiments, or
      scripted reconstruction.
