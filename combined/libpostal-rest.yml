id: brew:libpostal-rest
display-name: libpostal-rest
homepage: https://github.com/johnlonganecker/libpostal-rest
repo: https://github.com/johnlonganecker/libpostal-rest
docs:
  - https://github.com/johnlonganecker/libpostal-rest#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package has a narrow adoption story: it makes libpostal easier to run as a
      service when callers do not want to link directly to C or language bindings. The
      related libpostal project has broader adoption for normalizing and parsing
      international street addresses from open data.
  package-nerd-significance:
    - >
      The package is useful because libpostal itself has a heavy native build and large
      model-data footprint. A REST wrapper turns that local native dependency into a
      network service that other applications can consume with plain HTTP.
  project-history:
    - >
      The repository documents a Go 1.13+ build, HTTP endpoints for parsing, expansion,
      and combined expand-and-parse calls, and environment-variable configuration for
      listen address, logging, and Prometheus metrics. Its go.mod file depends on
      openvenues/gopostal, the Go binding for libpostal.
  related-projects:
    - libpostal is the core C address-normalization and parsing library.
    - gopostal is the Go binding used by libpostal-rest.
    - >
      OpenStreetMap-derived data and libpostal's training pipeline are part of the
      upstream libpostal ecosystem.
  sources:
    - https://github.com/johnlonganecker/libpostal-rest
    - https://github.com/openvenues/libpostal
    - https://raw.githubusercontent.com/johnlonganecker/libpostal-rest/master/README.md
    - https://raw.githubusercontent.com/johnlonganecker/libpostal-rest/master/go.mod
    - https://raw.githubusercontent.com/openvenues/libpostal/master/README.md
  summary:
    - >
      libpostal-rest is a small Go REST service that exposes libpostal address parsing
      and expansion over HTTP. Its history is best understood as a deployment wrapper
      around the larger libpostal geospatial NLP library.
  timeline:
    - '2022-06-17: The GitHub repository lists a public release around this date.'
    - >
      2022: The README documents Prometheus metrics and structured logging configuration
      for the service.
  usage:
    - >
      Operators run `libpostal-rest` as an HTTP service, then send address strings to
      `/parser`, `/expand`, or `/expandparser`. Environment variables configure the bind
      host, port, log format, log level, and optional Prometheus metrics endpoint.
related-packages: []
