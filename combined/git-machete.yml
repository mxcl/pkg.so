id: brew:git-machete
display-name: git-machete
homepage: https://github.com/VirtusLab/git-machete
repo: https://github.com/VirtusLab/git-machete
docs:
  - https://git-machete.readthedocs.io/en/stable
config-file-location:
  unix:
    - .git/machete
    - .git/worktrees/.../machete
    - .git/modules/.../machete
credentials-file-location:
  unix:
    - ~/.github-token
    - ~/.gitlab-token
history:
  adoption-history:
    - >
      git-machete has unusually broad packaging for a workflow-specific Git extension.
      The project's own package matrix lists PyPI, Conda Forge, Homebrew, Alpine, AUR,
      Gentoo, nixpkgs, Scoop, Snap, GitHub Releases, and Read the Docs. The README also
      points to an IntelliJ Platform plugin, giving the workflow both CLI and IDE
      surfaces.
    - >
      This adoption pattern fits teams that review stacked pull requests or maintain
      several dependent topic branches. Instead of asking users to remember the stack in
      their heads, the package makes the branch graph explicit and scriptable.
  package-nerd-significance:
    - >
      git-machete is package-nerd interesting because it turns a social workflow
      problem, the review and maintenance of branch stacks, into a small text file plus
      a Git subcommand. Its broad package matrix also shows the work required for a
      Python CLI to feel native across Linux distributions, macOS, Windows package
      managers, shells, and IDEs.
  project-history:
    - >
      VirtusLab published the project as a public GitHub repository in February 2018.
      The README presents the tool around a bird's-eye view of a repository and a
      `.git/machete` layout file, with commands such as `discover`, `status`, `go`,
      `traverse`, and `advance`.
    - >
      The 3.x release notes show the project expanding from local branch traversal into
      code-hosting workflows. Releases added GitHub and GitLab pull-request or
      merge-request commands, generated PR/MR description sections for branch chains,
      worktree handling, interactive branch selection, shell completions, and an agent
      skill for AI coding tools.
  related-projects:
    - >
      git-machete relates to Git itself, stacked-branch review workflows, GitHub and
      GitLab CLI tooling, and the VirtusLab git-machete IntelliJ plugin. It overlaps
      with rebase helpers, but its defining abstraction is a persistent branch layout.
  sources:
    - https://api.github.com/repos/VirtusLab/git-machete
    - https://git-machete.readthedocs.io/en/stable
    - https://github.com/VirtusLab/git-machete#readme
    - https://github.com/VirtusLab/git-machete/blob/master/PACKAGES.md
    - https://github.com/VirtusLab/git-machete/blob/master/RELEASE_NOTES.md
  summary:
    - >
      git-machete is a Git repository organizer for stacked and multi-branch workflows.
      It records a branch layout, shows the relation between branches, and automates
      repeated rebase, merge, push, pull, and pull-request maintenance tasks across a
      chain of branches.
  timeline:
    - '2018: Public GitHub repository created.'
    - '2023: 3.25.0 added GitLab support and a Scoop package.'
    - '2024: 3.31.0 added GitHub and GitLab PR/MR description update commands.'
    - '2026: 3.38.0 added interactive `git machete go` branch selection.'
    - '2026: 3.41.0 added an agent skill and branch rename command.'
  usage:
    - >
      Practitioners start with `git machete discover` to infer and edit a branch layout,
      then use `git machete status` to inspect whether branches are in sync with their
      parents. `git machete traverse` walks the layout and performs rebases, merges,
      pulls, and pushes as needed.
    - >
      The tool is also used to create or retarget GitHub pull requests and GitLab merge
      requests from the parent branch recorded in `.git/machete`. That makes it useful
      for small, focused pull requests that still depend on each other.
related-packages:
  - id: brew:git
    reason: >
      Git supplies the branches, commits, rebases, merges, remotes, and worktrees that
      git-machete organizes and automates.
    rel: adjacent_workflow
    sources:
      - https://git-machete.readthedocs.io/en/stable/
      - https://github.com/VirtusLab/git-machete
      - https://git-scm.com/docs
category: developer-tools
package-manager:
  apk: git-machete
  brew: git-machete
  nix: git-machete
  scoop: main/git-machete
package-manager-url: https://formulae.brew.sh/formula/git-machete
license: MIT
tags:
  - branch-management
  - cli
  - git
  - git-extension
  - rebase
  - workflow-automation
description: Git repository organizer & rebase workflow automation tool
executables:
  - git-machete
provenance:
  formula: git-machete
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
