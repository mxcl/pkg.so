id: brew:ironclaw
display-name: IronClaw
homepage: https://www.ironclaw.com
repo: https://github.com/nearai/ironclaw
docs:
  - https://github.com/nearai/ironclaw/tree/main/docs
  - https://github.com/nearai/ironclaw#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      IronClaw entered Homebrew with the description 'Security-first personal AI
      assistant with WASM sandbox channels' and also appears in Windows package metadata
      through winget and Scoop in the input package facts. The GitHub repository
      accumulated substantial public stars and forks within months, which is unusual for
      a young CLI package and reflects the broader demand for local agent runtimes with
      stronger isolation claims.
  package-nerd-significance:
    - >
      IronClaw is package-nerd significant because it packages a fast-moving AI agent
      runtime with security-sensitive defaults: credential handling, config seeding,
      sandbox processes, provider plugins, and local state paths all affect how a
      package should be installed and upgraded. It is the sort of modern CLI where
      package metadata has to describe both a tool and a runtime boundary.
  project-history:
    - >
      The public GitHub repository was created on February 3, 2026, and the first GitHub
      release, v0.1.0, was published on February 12, 2026. The README describes IronClaw
      as a secure personal AI assistant and documents a Reborn runtime with a separate
      `ironclaw-reborn` binary, state root, model routing, provider configuration, and
      production storage settings.
    - >
      The project homepage frames IronClaw as a secure, open-source alternative to
      OpenClaw that can run locally or in NEAR AI Cloud encrypted enclaves. The README's
      configuration sections emphasize environment-variable secrets, rejecting inline
      secret-shaped config values, provider selection for OpenAI, Anthropic,
      OpenAI-compatible endpoints, OpenRouter, Ollama, and Codex auth, and
      policy-controlled runtime profiles.
  related-projects:
    - >
      IronClaw is related to OpenClaw, NEAR AI Cloud, local LLM provider tooling such as
      Ollama, and broader AI agent runtimes that use sandboxing and policy controls to
      reduce prompt-injection and secret-exfiltration risk.
  sources:
    - https://api.github.com/repos/nearai/ironclaw
    - https://api.github.com/repos/nearai/ironclaw/releases
    - https://formulae.brew.sh/formula/ironclaw
    - https://github.com/nearai/ironclaw
    - https://raw.githubusercontent.com/nearai/ironclaw/main/README.md
    - https://www.ironclaw.com
  summary:
    - >
      IronClaw is a Rust-based personal AI assistant and agent runtime from NEAR AI,
      packaged as a command-line application with a security-first positioning. Its
      package history is short, but its rapid release stream and Homebrew presence make
      it part of the 2026 wave of agent tools being packaged for local developer
      machines.
  timeline:
    - '2026-02-03: The public GitHub repository was created.'
    - '2026-02-12: The first GitHub release, v0.1.0, was published.'
    - '2026-02-19: The release stream had reached the ironclaw-v0.6.0 tag.'
    - '2026-04: Releases reached the 0.25.x series.'
    - '2026-06: Releases reached the 0.29.x series.'
  usage:
    - >
      Users run IronClaw as a CLI assistant, configure model providers through
      environment variables and generated config files, and use the Reborn runtime for
      interactive sessions, one-shot messages, diagnostics, and local or hosted
      profiles. The package also ships a `sandbox_daemon` executable according to
      Homebrew metadata, matching the project's WASM sandbox-channel positioning.
related-packages:
  - id: cask:openclaw
    reason: >
      Choose OpenClaw when you want the established local-agent gateway and plugin
      ecosystem that IronClaw's official site identifies as the product category it
      offers a security-focused alternative to.
    rel: alternative
    sources:
      - https://www.ironclaw.com
      - https://openclaw.ai/
      - https://docs.openclaw.ai/
category: ai
package-manager:
  brew: ironclaw
  scoop: main/ironclaw
  winget: NearAI.IronClaw
package-manager-url: https://formulae.brew.sh/formula/ironclaw
license: MIT OR Apache-2.0
tags:
  - ai
  - ai-assistant
  - automation
  - cli
  - sandbox
  - security
  - wasm
description: Security-first personal AI assistant with WASM sandbox channels
executables:
  - ironclaw
  - sandbox_daemon
provenance:
  formula: ironclaw
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
