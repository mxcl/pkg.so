id: brew:cobo-cli
display-name: Cobo CLI
homepage: https://github.com/CoboGlobal/cobo-cli
repo: https://github.com/CoboGlobal/cobo-cli
docs:
  - https://github.com/CoboGlobal/cobo-cli#readme
  - https://www.cobo.com/developers/v2/developer-tools/cobo-cli/cli-commands
  - https://www.cobo.com/developers/v2/developer-tools/cobo-cli/key-management
config-file-location:
  unix: ~/.cobo/config.toml
credentials-file-location:
  unix: ~/.cobo/config.toml
history:
  adoption-history:
    - >
      The input package facts show Homebrew packaging, and the official README documents
      both pip and Homebrew installation paths.
  package-nerd-significance:
    - >
      Cobo CLI packages a vendor API workflow as a developer-tool command, including
      local key generation and config storage, which makes it relevant to users who
      prefer API integrations managed from terminals and package managers.
  project-history:
    - >
      The official README presents Cobo CLI as a Python 3.9+ tool installable with pip
      or Homebrew, with commands for applications, authentication, configuration, key
      management, API requests, webhooks, and AI coding-agent skill setup.
  related-projects:
    - >
      The official README links the CLI to Cobo WaaS 2.0 and to supported AI
      coding-agent skills for Claude Code and Cursor.
  sources:
    - https://github.com/CoboGlobal/cobo-cli#readme
    - https://www.cobo.com/developers/v2/developer-tools/cobo-cli/cli-commands
    - https://www.cobo.com/developers/v2/developer-tools/cobo-cli/key-management
    - source_facts.package-manager
  summary:
    - >
      Cobo CLI is Cobo's command-line developer tool for building, testing, and managing
      integrations with Cobo Wallet-as-a-Service 2.0.
  timeline:
    - 'GitHub repository: official project history shows 23 commits at the time of review.'
  usage:
    - >
      Users run cobo commands to manage environments, authentication, config, generated
      API and app key pairs, webhook testing, and WaaS API calls.
related-packages: []
category: developer-tools
package-manager:
  brew: cobo-cli
package-manager-url: https://formulae.brew.sh/formula/cobo-cli
license: MIT
tags:
  - api-client
  - cli
  - cobo
  - cryptocurrency
  - key-management
  - wallet-as-a-service
description: Build, test, and manage your integration with Cobo Wallet-as-a-Service
executables:
  - cobo
provenance:
  formula: cobo-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
