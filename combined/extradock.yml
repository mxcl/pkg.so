id: cask:extradock
display-name: ExtraDock
homepage: https://extradock.app/
repo: https://github.com/AppitStudio/extra-dock-updates
docs:
  - https://extradock.app/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The developer says more than 90 percent of ExtraDock's features originated in user
      requests, reflecting a user-driven evolution around multi-monitor and
      desktop-customization workflows.
  package-nerd-significance:
    - >
      ExtraDock represents the specialized ecosystem of macOS utilities that extend
      behavior Apple does not provide natively. Its availability as a Homebrew cask
      makes the proprietary desktop utility convenient to provision alongside
      command-line packages.
  project-history:
    - >
      ExtraDock was developed by AppitStudio as an independent macOS dock utility.
      ExtraDock 5 was redesigned for macOS 26, while ExtraDock 4 remains available for
      macOS 12 through 15.
  related-projects:
    - >
      AppitStudio also develops DockFlow, which switches the native Dock between
      workflows, and ExtraBar, a customizable menu-bar utility.
  sources:
    - https://extradock.app/
    - https://extradock.app/docs
  summary:
    - >
      ExtraDock is a commercial macOS utility for creating multiple independent docks
      with custom layouts, appearance, behavior, widgets, and display assignments.
  timeline:
    - 'ExtraDock 4: Remains the supported generation for macOS 12 through macOS 15.'
    - >
      ExtraDock 5: Redesigned for macOS 26 with Liquid Glass styling and an expanded
      widget system.
  usage:
    - >
      Users create docks for particular applications, folders, files, displays, or
      Spaces, then configure their position, orientation, auto-hide behavior,
      appearance, and widgets.
    - >
      It is commonly useful on multi-monitor Macs, as a launcher, or as a replacement or
      supplement for the single native macOS Dock.
category: productivity
package-manager:
  brew-cask: extradock
package-manager-url: https://formulae.brew.sh/cask/extradock
tags:
  - application-launcher
  - desktop-customization
  - dock
  - macos
  - multi-monitor
  - productivity
  - widgets
description: Add fully customizable extra docks
applications:
  - ExtraDock.app
provenance:
  cask: extradock
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
