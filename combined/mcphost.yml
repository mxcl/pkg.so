id: brew:mcphost
display-name: MCPHost
homepage: https://github.com/mark3labs/mcphost
repo: https://github.com/mark3labs/mcphost
docs:
  - https://github.com/mark3labs/mcphost#readme
config-file-location:
  unix:
    - ~/.mcphost.yml
    - ~/.mcphost.json
    - ~/.mcp.yml
    - ~/.mcp.json
  windows:
    - '%USERPROFILE%\.mcphost.yml'
    - '%USERPROFILE%\.mcphost.json'
    - '%USERPROFILE%\.mcp.yml'
    - '%USERPROFILE%\.mcp.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      By July 2026, GitHub metadata showed about 1.6k stars and more than 200 forks,
      enough to make it one of the better-known standalone terminal hosts for MCP
      workflows. Its release history on GitHub starts with v0.4.3 in January 2025 and
      reaches v0.34.0 by February 2026.
    - >
      The project's adoption comes from users who want a model-and-tool terminal rather
      than a specific desktop app. The README documents providers such as Anthropic,
      OpenAI, Google, Ollama, and OpenAI-compatible endpoints, which helped it fit mixed
      local and hosted model setups.
  package-nerd-significance:
    - >
      MCPHost is package-nerd interesting because it packages the host side of MCP as a
      single CLI rather than requiring a GUI client. That makes it useful in shell
      scripts, CI jobs, demos, and reproducible examples where a Homebrew or Nix install
      is easier to explain than editor-specific setup.
    - >
      Its backwards-compatible config filenames also show a common early-ecosystem
      pattern: tools stabilized around MCP names while retaining older generic `.mcp`
      files so existing users did not have to rewrite local setups.
  project-history:
    - >
      The project was created publicly on GitHub in December 2024, soon after MCP became
      a common protocol for connecting tools to LLM clients. Its README describes
      MCPHost as a CLI that supports interactive chat, non-interactive prompts,
      YAML-based scripts, configurable MCP servers, hooks, multiple model providers, and
      multiple MCP transports.
    - >
      MCPHost's configuration story evolved around home-directory YAML or JSON files.
      The current README says it prefers `.mcphost.yml` or `.mcphost.json`, while
      retaining `.mcp.yml` and `.mcp.json` for backwards compatibility, which reflects
      the fast-moving naming conventions of early MCP tooling.
  related-projects:
    - >
      MCPHost is related to MCP server packages such as MCP Toolbox for Databases and to
      inspection/interaction tools such as mcptools. It also overlaps with MCP-aware
      coding clients and agent CLIs, but its niche is hosting model conversations and
      MCP servers directly from the terminal.
  sources:
    - https://api.github.com/repos/mark3labs/mcphost
    - https://api.github.com/repos/mark3labs/mcphost/releases
    - https://github.com/mark3labs/mcphost
  summary:
    - >
      MCPHost is a command-line host application that lets large language models use
      external tools through the Model Context Protocol. In package terms it is a local,
      installable MCP client/host: the user configures MCP servers once, chooses a model
      provider, and interacts with tools from a terminal.
  timeline:
    - '2024-12: GitHub repository created.'
    - '2025-01: v0.4.3 release published.'
    - >
      2025: README documents preferred `.mcphost` config files plus backwards-compatible
      `.mcp` config files.
    - '2026-02: v0.34.0 release published.'
  usage:
    - >
      A typical user installs `mcphost`, places MCP server definitions in
      `~/.mcphost.yml` or a compatible JSON/YAML file, and starts an interactive session
      with `mcphost`. The same binary can also run one-shot prompts with `-p`, choose
      models with `--model`, override provider URLs and API keys with flags, or execute
      script files with YAML front matter.
    - >
      For MCP configuration, the README documents local, remote, and builtin server
      types mapped to stdio, streamable HTTP, and in-process transports. It also
      supports environment-variable substitution in config files, which is the
      documented way to keep API keys out of committed configuration.
related-packages:
  - id: brew:mcptools
    reason: >
      MCP Tools provides focused inspection, calling, mocking, and proxying for the
      servers used in MCPHost configurations, which is useful when diagnosing a host
      workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/mark3labs/mcphost#readme
      - https://github.com/f/mcptools#readme
  - id: brew:mcpm
    reason: >
      MCPM can manage, profile, and run MCP servers across clients, complementing
      MCPHost's model-conversation role, although MCPHost itself is archived.
    rel: adjacent_workflow
    sources:
      - https://github.com/mark3labs/mcphost#readme
      - https://mcpm.sh/
category: ai
package-manager:
  brew: mcphost
  zypper: mcphost
package-manager-url: https://formulae.brew.sh/formula/mcphost
license: MIT
tags:
  - ai
  - ai-tools
  - cli
  - go
  - llm
  - mcp
description: CLI host for LLMs to interact with tools via MCP
executables:
  - mcphost
provenance:
  formula: mcphost
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
