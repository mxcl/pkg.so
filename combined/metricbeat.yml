id: brew:metricbeat
display-name: Metricbeat
homepage: https://www.elastic.co/beats/metricbeat
repo: https://github.com/elastic/beats
docs:
  - https://www.elastic.co/docs/reference/beats/metricbeat
  - >
    https://www.elastic.co/docs/reference/beats/metricbeat/metricbeat-installation-configuration
config-file-location:
  linux:
    - /etc/metricbeat/metricbeat.yml
    - /etc/metricbeat/modules.d/*.yml
  unix:
    - '{path.home}/metricbeat.yml'
    - '{path.config}/modules.d/*.yml'
  windows:
    - '{path.home}\metricbeat.yml'
    - '{path.config}\modules.d\*.yml'
credentials-file-location:
  linux: /var/lib/metricbeat/metricbeat.keystore
  unix: '{path.data}/metricbeat.keystore'
  windows: '{path.data}\metricbeat.keystore'
history:
  project-history:
    - >
      Metricbeat entered the Elastic Stack 5.0 line as the successor to Topbeat.
      Elastic's 5.0.0 release material says Metricbeat replaced Topbeat as the primary
      metrics collection tool in the stack, preserving host and process resource
      statistics while adding modules for systems such as Apache, HAProxy, MongoDB,
      MySQL, Nginx, PostgreSQL, Redis, and ZooKeeper. A 5.0 alpha announcement
      introduced it as an extension of Topbeat for server-service metrics.
  sources:
    - https://formulae.brew.sh/formula/metricbeat
    - https://github.com/elastic/beats
    - https://www.elastic.co/beats/
    - https://www.elastic.co/blog/elastic-stack-5-0-0-released
    - https://www.elastic.co/blog/elastic-stack-release-5-0-0-alpha-3
    - https://www.elastic.co/blog/monitoring_container_resource_usage_with_metricbeat
    - https://www.elastic.co/docs/reference/beats/metricbeat
  summary:
    - >
      Metricbeat is one of Elastic's Beats, the lightweight data shippers used with
      Elasticsearch, Logstash, and Kibana. Elastic documentation defines it as a shipper
      installed on servers to collect operating-system and service metrics and send them
      to outputs such as Elasticsearch or Logstash; the Beats platform describes the
      broader family as small agents for moving operational data from many machines.
  usage:
    - >
      In practice, Metricbeat is deployed as an agent on hosts, containers, or service
      nodes, with modules enabling metricsets for specific systems. It can send metrics
      directly to Elasticsearch or through Logstash, Redis, or Kafka, and it is often
      used to populate Elastic observability dashboards and stack monitoring indexes. In
      package-manager terms it is the metrics-focused Beat, adjacent to Filebeat for
      logs, Packetbeat for network data, Heartbeat for uptime, and Auditbeat for
      audit/security events.
related-packages:
  - id: brew:heartbeat
    reason: >
      Use Heartbeat alongside Metricbeat when the same Elastic observability deployment
      needs active HTTP, TCP, or ICMP availability checks in addition to host and
      service metrics.
    rel: adjacent_workflow
    sources:
      - https://www.elastic.co/docs/reference/beats/heartbeat
      - https://www.elastic.co/docs/reference/beats/metricbeat
  - id: brew:filebeat
    reason: >
      Use Filebeat alongside Metricbeat to correlate application and system logs with
      the infrastructure metrics sent to the Elastic Stack.
    rel: adjacent_workflow
    sources:
      - https://www.elastic.co/docs/reference/beats/filebeat
      - https://www.elastic.co/docs/reference/beats/metricbeat
category: system
package-manager:
  brew: metricbeat
  chocolatey: metricbeat
  nix: metricbeat
package-manager-url: https://formulae.brew.sh/formula/metricbeat
license: Apache-2.0
tags:
  - cli
  - elastic-stack
  - metrics
  - monitoring
  - observability
description: Collect metrics from your systems and services
executables:
  - metricbeat
provenance:
  formula: metricbeat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
