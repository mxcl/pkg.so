id: brew:libdv
display-name: libdv
homepage: https://libdv.sourceforge.net/
repo: https://sourceforge.net/p/libdv/code/HEAD/tree
docs:
  - https://libdv.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The homepage states that several projects were using libdv during its pre-1.0
      period. Its adoption followed the early Linux digital-video era, when FireWire
      camcorders were common and free software needed a DV codec separate from capture
      tools and kernel 1394 support.
  package-nerd-significance:
    - >
      libdv is historically important for keeping early consumer digital-video workflows
      buildable on Unix systems. Even where modern video stacks have moved on,
      distributions keep it around because old DV files, old camera workflows, and
      legacy media applications still depend on the codec.
  project-history:
    - >
      The official homepage says libdv was developed by Charles 'Buck' Krasic and Erik
      Walthinsen while both were members of the Systems Software Lab at the Oregon
      Graduate Institute of Science and Technology. It was developed against the IEC
      61834 and SMPTE 314M DV video standards, with sample applications such as `playdv`
      and `encode` included.
    - >
      SourceForge metadata records the project registration on April 6, 2000. The
      SourceForge file history lists frequent 0.x releases from January 2001 through
      November 2004 and a 1.0.0 release on September 25, 2006.
  related-projects:
    - >
      The homepage relates libdv to IEC 61834, SMPTE 314M, Sony DVCAM documentation,
      Digital Video for Linux material, DV Central, and FireWire/i.Link capture tooling.
  sources:
    - https://libdv.sourceforge.net/
    - https://sourceforge.net/projects/libdv/
    - https://sourceforge.net/projects/libdv/files/libdv/
  summary:
    - >
      libdv, also presented as the Quasar DV Codec, is a software codec for DV video,
      the format used by many IEEE 1394/FireWire digital camcorders.
  timeline:
    - '2000: SourceForge project registered.'
    - '2001: 0.2 through 0.9 releases published on SourceForge.'
    - '2002: 0.9.5 and 0.98 releases published.'
    - '2003: Homepage last modified on October 20, 2003.'
    - '2004: 0.100 through 0.104 releases published.'
    - '2006: 1.0.0 release published on SourceForge.'
  usage:
    - >
      libdv focuses on the DV compression format, not camera capture. The homepage
      explicitly points users interested in camcorder capture toward 1394-related
      software and explains that the codec is for decoding and encoding DV streams, with
      standards documents recommended for people working deeply in the code.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg for a broader, actively developed multimedia toolkit with newer DV
      codec functionality; an official libdv developer-list reply states that DV
      development had moved there while libdv entered sustaining mode.
    rel: alternative
    sources:
      - >
        https://sourceforge.net/p/libdv/mailman/libdv-dev/thread/1193651259.6244.12.camel%40rebirth/
      - https://ffmpeg.org/documentation.html
