id: brew:cpm
display-name: cpm
homepage: https://metacpan.org/pod/CPM
repo: https://github.com/skaji/cpm
docs:
  - https://github.com/skaji/cpm#readme
  - https://metacpan.org/pod/cpm
config-file-location:
  unix:
    - ./cpm.yml
    - ./cpanfile
    - ./META.json
    - ./Build.PL
    - ./Makefile.PL
    - ./cpanfile.snapshot
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts list Homebrew and Debian packages, while MetaCPAN is
      the primary Perl distribution channel. The README also points CI users to an
      install-with-cpm GitHub Action, showing adoption around automated dependency
      installation.
  package-nerd-significance:
    - >
      For Perl packagers and CI maintainers, cpm matters because CPAN installation speed
      and dependency graph stability are recurring pain points. Its availability through
      both CPAN and OS package managers makes it useful as a bootstrap and automation
      tool.
  project-history:
    - >
      The GitHub repository was created in June 2015, and MetaCPAN records the first
      App-cpm trial release in August 2015 as an experimental CPAN client. The current
      upstream README describes cpm as a fast CPAN module installer and lists
      self-contained and CPAN-based installation paths.
    - >
      The README describes the v1 design as preparing dependencies first and performing
      final installation separately. That detail is significant for package users
      because cpm is not just a thin downloader; its installation model is meant to make
      larger dependency graphs and parallel work more stable.
  related-projects:
    - >
      App::cpanminus, Menlo, and Carton are listed by upstream as related CPAN
      installation tools.
    - install-with-cpm is listed by upstream for GitHub Actions usage.
  sources:
    - https://api.github.com/repos/skaji/cpm
    - https://raw.githubusercontent.com/skaji/cpm/master/README.md
    - https://fastapi.metacpan.org/v1/release/App-cpm
    - >
      https://fastapi.metacpan.org/v1/release/_search?q=distribution:App-cpm&size=1&sort=date:asc
  summary:
    - >
      cpm is Shoichi Kaji's fast CPAN module installer. It is packaged as the Perl
      distribution App-cpm and focuses on predictable dependency installation for Perl
      projects.
  timeline:
    - '2015: GitHub repository created.'
    - '2015: MetaCPAN records App-cpm 0.100-TRIAL as an experimental CPAN client.'
    - '2026: MetaCPAN records App-cpm v1.1.4.'
  usage:
    - >
      cpm installs requested CPAN distributions and, by default, their runtime
      dependency closure. It is commonly compared with cpanminus, Menlo, and Carton,
      which upstream lists as related tools.
related-packages:
  - id: brew:cpanminus
    reason: >
      Choose cpanminus for a deliberately minimal, zero-configuration CPAN installer;
      choose cpm when dependency-first preparation, parallel work, snapshots, or
      configurable resolvers are important.
    rel: alternative
    sources:
      - https://metacpan.org/pod/App::cpm::Tutorial
      - https://metacpan.org/pod/App::cpanminus
  - id: brew:carton
    reason: >
      Carton complements cpm when an application needs a committed cpanfile.snapshot and
      repeatable project-local deployment workflow rather than installation alone.
    rel: adjacent_workflow
    sources:
      - https://metacpan.org/pod/App::cpm::Tutorial
      - https://metacpan.org/pod/Carton
category: developer-tools
package-manager:
  brew: cpm
  debian: cpm
package-manager-url: https://formulae.brew.sh/formula/cpm
license: Artistic-1.0-Perl OR GPL-1.0-or-later
tags:
  - cli
  - cpan
  - dependencies
  - package-installer
  - perl
description: Fast CPAN module installer
executables:
  - cpm
provenance:
  formula: cpm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
