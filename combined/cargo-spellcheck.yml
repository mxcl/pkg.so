id: brew:cargo-spellcheck
display-name: cargo-spellcheck
homepage: https://github.com/drahnr/cargo-spellcheck
repo: https://github.com/drahnr/cargo-spellcheck
docs:
  - https://docs.rs/crate/cargo-spellcheck/latest
  - https://github.com/drahnr/cargo-spellcheck/blob/master/docs/configuration.md
  - https://github.com/drahnr/cargo-spellcheck#readme
config-file-location:
  linux: /home/alice/.config/cargo_spellcheck/config.toml
  macos: /Users/Alice/Library/Preferences/cargo_spellcheck/config.toml
  unix:
    - Cargo.toml
    - ${CARGO_MANIFEST_DIR}/.config/spellcheck.toml
    - .config/spellcheck.toml
  windows: C:\Users\Alice\AppData\Roaming\cargo_spellcheck\config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub records the repository as created in May 2020, and crates.io records the
      crate as first published the same month. The input package facts list Homebrew,
      Nix, and Arch packages.
  package-nerd-significance:
    - >
      cargo-spellcheck sits in the Rust tooling niche where documentation quality
      becomes a build or review concern, so package maintainers can catch spelling and
      grammar regressions before release.
  project-history:
    - >
      The official README describes cargo-spellcheck as a tool that checks spelling with
      hunspell and grammar with nlprule, with interactive fixing and automation-oriented
      commands.
  related-projects:
    - >
      The README and repository topics identify hunspell, nlprule, and
      LanguageTool-style grammar checking as related components.
  sources:
    - https://api.github.com/repos/drahnr/cargo-spellcheck
    - https://github.com/drahnr/cargo-spellcheck
    - https://docs.rs/crate/cargo-spellcheck/latest
    - https://github.com/drahnr/cargo-spellcheck/blob/master/docs/configuration.md
    - https://github.com/drahnr/cargo-spellcheck#readme
    - https://crates.io/api/v1/crates/cargo-spellcheck
    - https://formulae.brew.sh/api/formula/cargo-spellcheck.json
  summary:
    - >
      cargo-spellcheck is a Cargo subcommand for spell-checking and grammar-checking
      Rust documentation and comments.
  timeline:
    - '2020: GitHub repository created and first crates.io release recorded.'
    - '2026: crates.io records max_version 0.15.7.'
  usage:
    - >
      The README documents `cargo spellcheck check`, `cargo spellcheck fix`, shell
      completions, and CI/CD or commit-hook usage. The configuration page documents
      explicit config via CLI flags or Cargo.toml metadata, plus implicit project and
      per-user config files.
related-packages:
  - id: brew:typos-cli
    reason: >
      Choose typos-cli for fast, source-code-aware checks of known misspellings across
      an entire repository; choose cargo-spellcheck when Rust documentation comments and
      grammar checking are the priority.
    rel: alternative
    sources:
      - https://github.com/crate-ci/typos#readme
      - https://github.com/crate-ci/typos/blob/master/docs/comparison.md
      - https://github.com/drahnr/cargo-spellcheck#readme
  - id: brew:codespell
    reason: >
      Choose codespell for a language-independent scan based on common-misspelling
      dictionaries and broad text-file support; cargo-spellcheck is more specialized for
      Rust documentation and grammar.
    rel: alternative
    sources:
      - https://github.com/codespell-project/codespell#readme
      - https://github.com/drahnr/cargo-spellcheck#readme
category: developer-tools
package-manager:
  brew: cargo-spellcheck
  nix: cargo-spellcheck
  pacman: cargo-spellcheck
package-manager-url: https://formulae.brew.sh/formula/cargo-spellcheck
license: Apache-2.0 OR MIT
tags:
  - cargo-plugin
  - ci
  - cli
  - documentation
  - grammar
  - rust
  - spellcheck
description: Checks rust documentation for spelling and grammar mistakes
executables:
  - cargo-spellcheck
provenance:
  formula: cargo-spellcheck
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
