id: brew:aws-sso-util
display-name: aws-sso-util
homepage: https://github.com/61418/aws-sso-util
repo: https://github.com/61418/aws-sso-util
docs:
  - https://github.com/61418/aws-sso-util/tree/master/docs
  - https://github.com/61418/aws-sso-util#readme
config-file-location:
  unix: ~/.aws/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The project reached PyPI and Homebrew, with Homebrew packaging version 4.33.0 from
      PyPI and reporting modest 30-day formula installs in June 2026. GitHub repository
      metadata showed more than a thousand stars, which is substantial for an AWS SSO
      niche utility.
    - >
      Its adoption niche is administrators and developers who need to generate many AWS
      config profiles, diagnose Identity Center access, or bridge SDKs and tools that
      understand `credential_process` but not every SSO-era config shape.
  package-nerd-significance:
    - >
      For package nerds, `aws-sso-util` is interesting because it is both an end-user
      CLI and a Python library split into CLI and lib release tracks. It also records a
      transitional moment when AWS SSO support was present but uneven across SDKs, CLIs,
      IaC tools, and administrative APIs.
  project-history:
    - >
      The public repository was created in May 2020, during the period when AWS CLI v2
      support for SSO was still maturing. The README says the package superseded
      `aws-sso-credential-process`, preserving that earlier credential_process idea
      while expanding into a broader toolbox.
    - >
      The repository later lived under the `61418` GitHub organization while PyPI and
      Homebrew metadata still expose the older `benkehoe/aws-sso-util` homepage URL.
      GitHub and raw README access redirect to the `61418/aws-sso-util` repository,
      which is the official repository URL returned here.
  related-projects:
    - `aws-sso-credential-process` is the predecessor named by the README.
    - >
      `aws-sso-lib` is the bundled Python library for programmatic Identity Center
      authentication.
  sources:
    - https://formulae.brew.sh/api/formula/aws-sso-util.json
    - https://github.com/61418/aws-sso-util
    - https://pypi.org/pypi/aws-sso-util/json
    - https://raw.githubusercontent.com/61418/aws-sso-util/master/README.md
  summary:
    - >
      `aws-sso-util` is a Python CLI and support library for AWS IAM Identity Center.
      Its README frames the project as a temporary smoothing layer over rough edges in
      AWS SSO, especially configuration, login/logout, SDK support, identifier lookup,
      and CloudFormation administration.
  timeline:
    - '2020-05: Public GitHub repository created.'
    - '2020-11: PyPI shows aws-sso-util 2.10.0 uploaded.'
    - '2022-01: CLI v4.27 and lib v1.10 releases published on GitHub.'
    - '2024-06: CLI v4.33 / aws-sso-util 4.33.0 released.'
  usage:
    - >
      Common commands include `aws-sso-util configure populate` to generate profiles in
      `~/.aws/config`, `aws-sso-util login` to log into Identity Center without binding
      the action to a single account-role profile, and `aws-sso-util credential-process`
      for SDKs that need an external credential provider.
    - >
      The project also includes `aws-sso-lib`, exposing programmatic Identity Center
      login and boto3 session helpers for Python users.
related-packages:
  - id: brew:aws-sso-cli
    reason: >
      Choose AWS SSO CLI when you want an opinionated multi-account role picker with
      encrypted token storage; choose aws-sso-util for Python-based profile generation,
      `credential_process`, SDK helpers, and administrative utilities.
    rel: alternative
    sources:
      - https://github.com/61418/aws-sso-util#readme
      - https://synfinatic.github.io/aws-sso-cli/latest/
  - id: brew:awscli
    reason: >
      AWS CLI v2 is the underlying official AWS client that aws-sso-util recommends
      installing and whose IAM Identity Center profiles aws-sso-util generates and
      extends.
    rel: adjacent_workflow
    sources:
      - https://github.com/61418/aws-sso-util#readme
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sso.html
category: cloud-infrastructure
package-manager:
  brew: aws-sso-util
  nix: aws-sso-util
package-manager-url: https://formulae.brew.sh/formula/aws-sso-util
license: Apache-2.0
tags:
  - aws
  - aws-config
  - cli
  - cloudformation
  - credentials
  - iam-identity-center
  - sso
description: Smooth out the rough edges of AWS SSO (temporarily, until AWS makes it better)
executables:
  - aws-sso-util
provenance:
  formula: aws-sso-util
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
