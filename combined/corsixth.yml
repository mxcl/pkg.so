id: brew:corsixth
display-name: CorsixTH
homepage: https://github.com/CorsixTH/CorsixTH
repo: https://github.com/CorsixTH/CorsixTH
docs:
  - https://github.com/CorsixTH/CorsixTH/wiki
  - https://github.com/CorsixTH/CorsixTH#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/CorsixTH/config.txt
    - ~/.config/CorsixTH/config.txt
    - $XDG_CONFIG_HOME/CorsixTH/hotkeys.txt
    - ~/.config/CorsixTH/hotkeys.txt
  windows:
    - '%APPDATA%\CorsixTH\config.txt'
    - '%APPDATA%\CorsixTH\hotkeys.txt'
credentials-file-location: null
history:
  adoption-history:
    - >
      CorsixTH is distributed through upstream releases, Linux and BSD package
      repositories, Flathub, Snapcraft, Homebrew, MacPorts, and Windows package
      managers. Its adoption follows a common open-source game-engine pattern: package
      the free engine while requiring users to supply legally obtained original assets.
  package-nerd-significance:
    - >
      CorsixTH is significant for packagers because it separates redistributable engine
      code from non-redistributable commercial game assets. Packaging must also account
      for desktop integration, Lua/C++ dependencies, save/config paths, and release
      channels across native packages, Flatpak, Snap, and app bundles.
  project-history:
    - >
      The official GitHub repository was created in 2013 and the README describes the
      project as both a faithful recreation and an extension of the original game. The
      code base mixes Lua and C++, with most game logic in Lua, which has made it
      approachable for community contributors.
  related-projects:
    - >
      Related projects and distribution surfaces include Theme Hospital, SDL-based
      open-source game engines, Flathub, Snapcraft, Homebrew, MacPorts, and
      package-manager builds named corsixth or corsix-th.
  sources:
    - https://github.com/CorsixTH/CorsixTH
    - https://raw.githubusercontent.com/CorsixTH/CorsixTH/master/README.md
    - https://raw.githubusercontent.com/wiki/CorsixTH/CorsixTH/Getting-Started.md
    - https://api.github.com/repos/CorsixTH/CorsixTH
    - https://api.github.com/repos/CorsixTH/CorsixTH/releases
  summary:
    - >
      CorsixTH is an open-source reimplementation of Bullfrog's 1997 business simulation
      game Theme Hospital. It uses the original game data while providing a modern
      engine for Windows, macOS, Linux, and BSD with high-resolution support and
      gameplay improvements.
  timeline:
    - '1997: Theme Hospital, the game CorsixTH reimplements, was released.'
    - '2013: Official GitHub repository created.'
    - '2025: Official releases include the 0.69.x series.'
    - '2026: Official releases list 0.70.0 beta and release-candidate builds.'
  usage:
    - >
      Users install the engine, then point it at a Theme Hospital HOSP directory from an
      original CD, GOG, EA, or the demo. The wiki documents supported operating systems,
      release builds, package-manager installs, data-file setup, and runtime
      configuration.
related-packages: []
category: games
package-manager:
  brew: corsixth
  macports: corsixth
  winget: CorsixTH.CorsixTH
  zypper: CorsixTH
package-manager-url: https://formulae.brew.sh/formula/corsixth
license: MIT
tags:
  - cli
  - cross-platform
  - game-engine
  - lua
  - simulation
  - theme-hospital
description: Open source clone of Theme Hospital
executables:
  - CorsixTH
provenance:
  formula: corsixth
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
