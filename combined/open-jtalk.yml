docs:
  - https://open-jtalk.sourceforge.net/
  - https://open-jtalk.sourceforge.net/readme_hts_voice_nitech_jp_atr503_m001.php
  - https://open-jtalk.sourceforge.net/readme_open_jtalk.php
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records Homebrew, Debian, MacPorts, and Ubuntu
      packages, consistent with adoption as a Unix command-line Japanese speech
      synthesis engine.
  package-nerd-significance:
    - >
      Open JTalk is notable for packaging because a useful installation needs code,
      dictionaries, and voice data with distinct release artifacts and licensing.
  project-history:
    - >
      The official site identifies Open JTalk as a Japanese text-to-speech system
      released under a Modified BSD license. The Open JTalk 1.11 readme says it had been
      developed by the HTS working group and Nagoya Institute of Technology graduate
      students, with copyright covering 2008-2018.
    - >
      The official downloads split the system into source code, compiled dictionaries,
      and HTS voice data, which makes Open JTalk a language-resource stack rather than
      just one executable.
  related-projects:
    - >
      Related components named by the official site include HTS, hts_engine API, MeCab,
      SPTK, NAIST Japanese Dictionary, and HTK.
  sources:
    - https://open-jtalk.sourceforge.net/
    - https://open-jtalk.sourceforge.net/readme_hts_voice_nitech_jp_atr503_m001.php
    - https://open-jtalk.sourceforge.net/readme_open_jtalk.php
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Open JTalk is a Japanese text-to-speech system developed by the HTS working group
      and graduate students at Nagoya Institute of Technology.
  timeline:
    - >
      2008-2018: the Open JTalk 1.11 readme copyright range covers Nagoya Institute of
      Technology development.
    - '2012-12-25: HTS Voice NIT ATR503 M001 version 1.05 was released.'
    - '2018-12-25: Open JTalk 1.11 and dictionary packages were released.'
  usage:
    - >
      Users typically run open_jtalk with a dictionary path, an HTS voice file,
      synthesis options, input text, and an output WAV file. The package also exposes
      hts_engine, reflecting the underlying synthesis runtime.
