id: brew:fcrackzip
display-name: fcrackzip
homepage: https://oldhome.schmorp.de/marc/fcrackzip.html
repo: null
docs:
  - https://oldhome.schmorp.de/marc/fcrackzip.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official page offered source tarballs, a Windows binary built under Cygwin,
      and a mailing list for discussion, support, and development. The supplied
      package-manager metadata shows it later became a small but durable package in
      Homebrew, Debian/Ubuntu, MacPorts, Nix, Arch, and similar repositories.
  package-nerd-significance:
    - >
      fcrackzip is package-nerd-relevant because it is one of the long-lived small
      security tools that persists in Unix package collections long after upstream
      development slows. Its official history captures the late-1990s free-software
      motivation: portable C source, performance close to assembler tools, and
      user-modifiable cracking modes.
  project-history:
    - >
      Marc Lehmann's project page says fcrackzip was written because the ZIP crackers he
      found were slow, limited, lacked brute-force behavior he needed, or did not
      provide source. The author explicitly framed it as a portable, free, fast ZIP
      password cracker rather than only a speed contest.
    - >
      The bundled NEWS text on the official page traces the project from 0.0.1 through
      1.0. Version 0.0.5 is dated August 1998, version 0.3 is dated January 2004, and
      version 1.0 is dated August 2008.
  related-projects:
    - >
      The official page compares fcrackzip with fzc, zipcrack, and other ZIP crackers,
      emphasizing source availability and portability as differentiators.
    - >
      The tool also includes a cpmask method for brute-forcing CP-masked images, a
      feature the author described as unusual among comparable crackers.
  sources:
    - https://oldhome.schmorp.de/marc/fcrackzip.html
    - https://formulae.brew.sh/formula/fcrackzip
  summary:
    - >
      fcrackzip is an older free software ZIP password recovery tool focused on
      brute-force and dictionary attacks against encrypted ZIP files.
  timeline:
    - '1998: 0.0.5 NEWS entry dated August 12.'
    - '2004: Version 0.3 released with compatibility fixes and build-system updates.'
    - '2008: Version 1.0 released with crash fixes and autoconf/automake updates.'
  usage:
    - >
      The manpage reproduced on the official site describes scanning encrypted ZIP files
      and trying to guess the password. Its main modes are brute force with selectable
      character sets and lengths, dictionary mode from a password file, optional unzip
      validation to reduce false positives, and benchmarking or validation modes.
    - >
      It is primarily a recovery and audit utility for legacy ZIP encryption, not a
      general archive manager. Common package-manager use is direct CLI invocation such
      as brute-forcing a known-length password or testing a wordlist against a ZIP
      archive.
related-packages:
  - id: brew:john-jumbo
    reason: >
      Choose John the Ripper Jumbo when ZIP recovery needs word-mangling rules,
      resumable sessions, AES-encrypted ZIP support, or one tool that also handles RAR,
      7z, documents, and many other formats.
    rel: alternative
    sources:
      - https://oldhome.schmorp.de/marc/fcrackzip.html
      - https://www.openwall.com/john/
      - https://www.openwall.com/john/doc/
