id: brew:clinfo
display-name: clinfo
homepage: https://github.com/Oblomov/clinfo
repo: https://github.com/Oblomov/clinfo
docs:
  - https://github.com/Oblomov/clinfo
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The batch input lists clinfo across many package managers and distributions: apk,
      Homebrew, Debian, dnf, Nix, pacman, Ubuntu, and zypper. That breadth matches its
      role as a standard first diagnostic for OpenCL installation problems.
  package-nerd-significance:
    - >
      clinfo is package-nerd significant less because of a dramatic project history and
      more because it is the canonical sanity-check binary for OpenCL packaging.
      Maintainers and users can install it quickly to distinguish broken ICD
      loader/runtime/header packaging from application-level GPU failures.
  project-history:
    - >
      The upstream repository was created in 2013 and has stayed intentionally simple:
      no autotools, CMake, meson, or ninja, just a Makefile and OpenCL
      headers/development files. The README frames that minimal build system as
      appropriate for a simple diagnostic program.
  related-projects:
    - >
      clinfo is tied to the OpenCL ecosystem, including vendor OpenCL implementations,
      ICD loader packages such as ocl-icd, Khronos OpenCL headers, PoCL, and GPU compute
      applications that depend on a working OpenCL stack.
  sources:
    - https://github.com/Oblomov/clinfo#readme
  summary:
    - >
      clinfo is a small command-line diagnostic utility that enumerates OpenCL platforms
      and devices on a system. The official README says it was inspired by AMD's program
      of the same name and is written in pure C.
  timeline:
    - '2013: Oblomov/clinfo GitHub repository created.'
    - >
      2010s-2020s: README documents POSIX, Android via Termux, macOS, and Windows
      build/use notes.
    - >
      2026: Batch input lists clinfo in apk, Homebrew, Debian, dnf, Nix, pacman, Ubuntu,
      and zypper.
  usage:
    - >
      The README describes use cases such as verifying that an OpenCL runtime is set up
      correctly, checking that an OpenCL development environment can build programs, and
      reporting actual device properties. Common options include -l for a compact device
      summary and -a to attempt properties that clinfo would otherwise consider
      unsupported.
related-packages:
  - id: brew:pocl
    reason: >
      Install PoCL to provide a portable OpenCL implementation, then use clinfo to
      confirm that its platform and devices are visible through the OpenCL runtime.
    rel: adjacent_workflow
    sources:
      - https://github.com/Oblomov/clinfo#readme
      - https://portablecl.org/docs/html/
category: system
package-manager:
  apk: clinfo
  brew: clinfo
  debian: clinfo
  dnf: clinfo
  nix: clinfo
  pacman: clinfo
  ubuntu: clinfo
  zypper: clinfo
package-manager-url: https://formulae.brew.sh/formula/clinfo
license: CC0-1.0
tags:
  - cli
  - diagnostics
  - gpu
  - hardware-info
  - opencl
description: Print information about OpenCL platforms and devices
executables:
  - clinfo
provenance:
  formula: clinfo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
