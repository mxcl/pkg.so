id: brew:ghidra
display-name: Ghidra
homepage: https://github.com/NationalSecurityAgency/ghidra
repo: https://github.com/NationalSecurityAgency/ghidra
docs:
  - https://ghidra-sre.org/
  - https://github.com/NationalSecurityAgency/ghidra#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      NSA described the public reaction as overwhelming after release, with hundreds of
      thousands of downloads and millions of website views in the first days. Four years
      later, NSA reported more than one million public downloads, use in college
      curricula, books and videos, operational use by technology and cybersecurity
      companies, and community contributions through GitHub.
  package-nerd-significance:
    - >
      Ghidra became significant to security packagers because a high-end reverse
      engineering suite moved from a government internal tool to a redistributable
      Apache-licensed project. The official release packaging is a multi-platform zip
      rather than a traditional installer, which made package-manager formulas and
      wrappers valuable for users who prefer reproducible installs.
  project-history:
    - >
      NSA publicly released Ghidra at the 2019 RSA Conference after years of research
      and development aimed at difficult software reverse engineering mission problems.
      The project README says it was built to solve scaling and teaming problems on
      complex analysis efforts and to provide a customizable research platform.
  related-projects:
    - >
      The Ghidra source tree includes PyGhidra, GhidraDev, Sleigh, a headless analyzer,
      a server component, and extension APIs for Java and Python users.
  sources:
    - https://github.com/NationalSecurityAgency/ghidra
    - https://github.com/NationalSecurityAgency/ghidra/releases/tag/Ghidra_9.0.1_build
    - https://raw.githubusercontent.com/NationalSecurityAgency/ghidra/master/DevGuide.md
    - >
      https://raw.githubusercontent.com/NationalSecurityAgency/ghidra/master/GhidraDocs/GettingStarted.md
    - >
      https://www.nsa.gov/Press-Room/News-Highlights/Article/Article/1775584/ghidra-the-software-reverse-engineering-tool-youve-been-waiting-for-is-here/
    - >
      https://www.nsa.gov/Press-Room/News-Highlights/Article/Article/3319971/four-years-later-the-impacts-of-ghidras-public-release/
  summary:
    - >
      Ghidra is NSA's open-source software reverse engineering framework, combining
      disassembly, decompilation, graphing, scripting, collaboration, and extension
      development across many processor architectures and executable formats.
  timeline:
    - '2019: NSA released Ghidra to the public at RSA Conference.'
    - '2019: The public GitHub repository and Ghidra 9.0.1 release appeared.'
    - '2023: NSA reported more than one million public downloads across the first four years.'
  usage:
    - >
      Practitioners use Ghidra interactively for reverse engineering compiled code and
      in automated modes for batch analysis. Common workflows include importing
      binaries, disassembling and decompiling functions, using the Sleigh processor
      specification language and P-code model, writing Java or Python scripts, and
      building extensions.
related-packages:
  - id: brew:radare2
    reason: >
      Choose radare2 for a Unix-oriented, command-line-first reverse-engineering
      toolchain with extensive scripting and many small companion programs instead of
      Ghidra's integrated desktop framework.
    rel: alternative
    sources:
      - https://github.com/NationalSecurityAgency/ghidra#readme
      - https://book.rada.re/
  - id: brew:rizin
    reason: >
      Choose Rizin for a command-line reverse-engineering framework centered on shell
      workflows, debugging, binary inspection, and scriptable analysis.
    rel: alternative
    sources:
      - https://github.com/NationalSecurityAgency/ghidra#readme
      - https://book.rizin.re/
category: security
package-manager:
  apk: ghidra
  brew: ghidra
  chocolatey: ghidra
  macports: ghidra
  nix: ghidra
  pacman: ghidra
  scoop: extras/ghidra
package-manager-url: https://formulae.brew.sh/formula/ghidra
license: Apache-2.0
tags:
  - cli
  - decompiler
  - disassembler
  - reverse-engineering
  - security
  - software-analysis
description: Multi-platform software reverse engineering framework
executables:
  - ghidraRun
  - pyghidraRun
provenance:
  formula: ghidra
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
