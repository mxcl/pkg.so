id: brew:freeswitch
display-name: FreeSWITCH
homepage: https://freeswitch.org
repo: https://github.com/signalwire/freeswitch
docs:
  - https://developer.signalwire.com/freeswitch
  - https://developer.signalwire.com/freeswitch/FreeSWITCH-Explained
  - https://github.com/signalwire/freeswitch-docs
config-file-location:
  unix:
    - /etc/freeswitch/freeswitch.xml
    - /usr/local/freeswitch/conf/freeswitch.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      FreeSWITCH adoption follows the broader shift from appliance telephony to software
      PBX, SIP, and RTC infrastructure. Its official documentation is operator-oriented
      and covers configuration, SIP profiles, dialplans, codecs, WebRTC, applications,
      and integration interfaces.
    - >
      The README documents both source builds and packaged installation paths, and
      points users to Debian, Raspberry Pi, and CentOS/RHEL instructions. That makes
      FreeSWITCH a system package as much as a developer package, usually installed as a
      service with a full configuration tree.
  package-nerd-significance:
    - >
      FreeSWITCH is significant because it turns telecom infrastructure into a
      packageable open source stack with many optional modules. It stresses packaging
      systems in ways small CLIs do not: init/service integration, default configs,
      codecs, sound packages, embedded libraries, scripting modules, and ABI-sensitive
      plugins all matter.
    - >
      Its relationship with SignalWire also matters historically: the open source stack
      remains available, while commercial support and hosted services grew around the
      same core developer lineage.
  project-history:
    - >
      The official README describes FreeSWITCH as a move from proprietary telecom
      switches to a software implementation that runs on commodity hardware, from small
      boards to multi-core servers. The source tree identifies SignalWire as the primary
      sponsor, founded by the original FreeSWITCH developers.
    - >
      Official repository history shows long-lived release lines, and the project
      changelog records substantial 1.2-era work across SIP, media, databases,
      WebRTC-related modules, conferencing, event sockets, and packaging scripts.
  related-projects:
    - >
      SignalWire is the primary sponsor and provides hosted services and commercial
      support around FreeSWITCH.
    - >
      mod_signalwire is distributed in the source tree to pair FreeSWITCH with
      SignalWire services.
    - FreeSWITCH Sounds is published separately for sound packages used by installations.
  sources:
    - https://developer.signalwire.com/freeswitch/
    - https://github.com/signalwire/freeswitch
    - https://github.com/signalwire/freeswitch-docs
    - https://lists.freeswitch.org/pipermail/freeswitch-svn/2009-February/009740.html
    - https://raw.githubusercontent.com/signalwire/freeswitch/master/README.md
    - https://raw.githubusercontent.com/signalwire/freeswitch/master/docs/ChangeLog
  summary:
    - >
      FreeSWITCH is an open source software-defined telecom stack and softswitch for
      routing voice, video, messaging, and real-time communications protocols. For
      package users it is both a daemon and a toolkit: the install brings a large module
      ecosystem, fs_cli, media tools, and configuration rooted around freeswitch.xml.
  timeline:
    - >
      2005-2006: Official FreeSWITCH source headers identify the original code period
      and Anthony Minessale as initial developer.
    - 'v1.0.0: Official repository includes a 1.0 release tag.'
    - >
      2012: The 1.2 changelog records packaging, configuration, WebRTC-related, codec,
      event socket, and module expansion work.
    - >
      Current: SignalWire-hosted documentation presents FreeSWITCH as an open source
      Users Manual with commercially supported Enterprise services available.
  usage:
    - >
      Operators use FreeSWITCH to run SIP endpoints, route calls, provide voicemail and
      conferencing, bridge protocols, control calls through fs_cli and event socket
      interfaces, and integrate with hosted or external telecom services.
    - >
      Package consumers need to track module selection, default XML configuration,
      database backends, media codec dependencies, and service layout. The official
      manual emphasizes that paths are relative to the configuration root containing
      freeswitch.xml, commonly /etc/freeswitch or /usr/local/freeswitch/conf.
related-packages:
  - id: brew:sofia-sip
    reason: >
      Use Sofia-SIP when developing or debugging the SIP layer around FreeSWITCH; its
      official site identifies FreeSWITCH as a user and points to the FreeSWITCH-hosted
      maintained library.
    rel: adjacent_workflow
    sources:
      - https://sofia-sip.sourceforge.net/
      - https://github.com/freeswitch/sofia-sip
category: networking
package-manager:
