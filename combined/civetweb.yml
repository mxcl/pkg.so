id: brew:civetweb
display-name: CivetWeb
homepage: https://github.com/civetweb/civetweb
repo: https://github.com/civetweb/civetweb
docs:
  - https://github.com/civetweb/civetweb/blob/master/docs/UserManual.md
  - https://github.com/civetweb/civetweb/tree/master/docs
  - https://civetweb.github.io/civetweb
config-file-location:
  unix: CivetWeb.conf in the executable directory
  windows: CivetWeb.conf in the executable directory
credentials-file-location: null
history:
  adoption-history:
    - >
      CivetWeb is packaged across several Unix-style ecosystems in the batch input,
      including Homebrew, Alpine, Debian, Ubuntu, Nix, and openSUSE/zypper. Its official
      README also points end users to GitHub and SourceForge binaries and source
      releases, while directing contributions and issues to GitHub.
  package-nerd-significance:
    - >
      CivetWeb matters to package maintainers because it preserves the permissively
      licensed branch of a once-common embedded-web-server lineage. It is small enough
      to package as a command and library, broad enough to need TLS and scripting
      dependency decisions, and old enough that downstreams care about ABI, license, and
      security-update continuity.
  project-history:
    - >
      The official README says CivetWeb was forked from the last MIT-licensed version of
      Mongoose in August 2013, after Mongoose moved to a dual GPL/commercial license.
      Release notes for v1.0 describe the initial objective as preserving an
      MIT-licensed Mongoose-derived distribution and renaming the code and documentation
      to CivetWeb.
    - >
      The project subsequently developed independently on GitHub, with release notes
      showing steady maintenance across API, TLS, Lua, WebSocket, HTTP/2 experiments,
      fuzzing, and platform-support work.
  related-projects:
    - Mongoose is the direct ancestor named by the CivetWeb README.
    - >
      The README describes CivetWeb as useful either as an embedded library or as a
      standalone web server, overlapping with other lightweight C HTTP server libraries.
  sources:
    - https://github.com/civetweb/civetweb/blob/master/README.md
    - https://github.com/civetweb/civetweb/blob/master/RELEASE_NOTES.md
    - https://github.com/civetweb/civetweb/blob/master/docs/UserManual.md
  summary:
    - >
      CivetWeb is a small MIT-licensed C/C++ embeddable web server that can also run as
      a standalone server. In package-manager terms it is the long-lived, permissively
      licensed Mongoose fork that gives C applications an HTTP, HTTPS, CGI, Lua,
      WebSocket, and WebDAV-capable server without pulling in a large framework.
  timeline:
    - '2013: CivetWeb forked from the last MIT-licensed Mongoose version.'
    - '2014: GitHub release v1.6 published.'
    - '2021: Release notes show OpenSSL 3.0 and mbed TLS 3 work in v1.16.'
    - '2026: GitHub repository metadata shows continuing activity.'
  usage:
    - >
      Developers embed CivetWeb as a library to add web-server functionality to an
      existing C or C++ program, or run it as a standalone executable on Windows, Unix,
      Linux, and macOS. Its user manual documents command-line startup, optional
      configuration-file use, and many runtime options.
related-packages:
  - id: brew:mongoose
    reason: >
      Choose Mongoose when MQTT, bare-metal targets, or a built-in TCP/IP stack matter;
      choose CivetWeb for an MIT-licensed embeddable or standalone HTTP server descended
      from the earlier Mongoose codebase.
    rel: alternative
    sources:
      - https://github.com/civetweb/civetweb/blob/master/README.md
      - https://mongoose.ws/documentation/
category: networking
package-manager:
  apk: civetweb
  brew: civetweb
  debian: civetweb
  dnf: civetweb
  nix: civetweb
  ubuntu: civetweb
  zypper: civetweb
package-manager-url: https://formulae.brew.sh/formula/civetweb
license: MIT
tags:
  - c
  - c-plus-plus
  - cgi
  - cli
  - embedded
  - http
  - lua
  - ssl
  - web-server
description: C/C++ embeddable web server with optional CGI, SSL and Lua support
executables:
  - civetweb
provenance:
  formula: civetweb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
