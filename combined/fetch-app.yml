id: cask:fetch-app
display-name: Fetch
homepage: https://fetchsoftworks.com/fetch/
repo: null
docs:
  - https://fetchsoftworks.com/fetch/help
config-file-location:
  macos:
    - ~/Library/Preferences/com.fetchsoftworks.Fetch.plist
    - ~/Library/Preferences/com.fetchsoftworks.Fetch.Shortcuts.plist
credentials-file-location:
  macos: macOS Keychain
history:
  adoption-history:
    - >
      Fetch spread beyond Dartmouth as Internet access expanded, becoming a widely
      distributed Macintosh FTP utility. During the early web era, its graphical upload
      workflow made it useful to people publishing websites and transferring media
      without command-line FTP tools.
    - >
      Fetch Softworks reported millions of distributed copies by 2001. Although FTP
      publishing later became less central, the product continued through macOS
      transitions and added secure protocols, including SFTP and FTP over TLS.
  package-nerd-significance:
    - >
      Fetch is a living artifact of classic Macintosh Internet software: its
      dog-and-floppy icon dates from an era when graphical FTP was novel. Its continued
      maintenance across Motorola 68k, PowerPC, Intel, and Apple Silicon systems
      illustrates the unusually long compatibility burden of native Mac software.
    - >
      For package-manager users, the cask turns a historically hand-installed shareware
      application into a declaratively installable client while retaining a native
      Finder-like interface for FTP-era and SSH-based file-transfer workflows.
  project-history:
    - >
      Jim Matthews developed Fetch at Dartmouth College in 1989 to move files between a
      campus population of Macs and heterogeneous central computers. Dartmouth's new
      full-time Internet connection quickly expanded its use to remote Internet
      archives.
    - >
      In 2000 Matthews obtained the rights to Fetch from Dartmouth and formed Fetch
      Softworks. The company announced Fetch 4.0 in January 2001 and continued
      commercial development of the application.
  related-projects:
    - FTP
    - SFTP
    - FTPS
    - SSH
    - Transmit
    - Cyberduck
    - FileZilla
  sources:
    - https://fetchsoftworks.com/fetch/about
    - https://fetchsoftworks.com/fetch/help/Contents/About/AboutFetch.html
    - >
      https://fetchsoftworks.com/fetch/news/fetch-author-launches-fetch-softworks-announces-version-40
    - https://fetchsoftworks.com/fetch/news/thirty-years-of-fetch/comments/3
  summary:
    - >
      Fetch is a long-running graphical file-transfer client for macOS. Originating at
      Dartmouth in 1989, it supports FTP, SFTP, and FTPS and is used for website
      publishing, server file maintenance, synchronization, and general cross-system
      transfer.
  timeline:
    - '1989: Jim Matthews developed and released Fetch at Dartmouth College.'
    - '2000: Matthews acquired the Fetch rights from Dartmouth and established Fetch Softworks.'
    - '2001: Fetch Softworks announced a public test release of Fetch 4.0.'
    - '2019: The project marked thirty years of continued development.'
    - '2023: Fetch 5.8.3 added macOS Ventura support and native Apple Silicon support.'
  usage:
    - >
      Users connect to remote servers with FTP, SFTP, or FTPS; upload and download
      files; edit server-side files; synchronize folders with Mirror; adjust Unix
      permissions; and resume interrupted transfers. Its graphical interface is
      especially associated with web publishing and organizations that still expose
      traditional file-transfer services.
category: networking
