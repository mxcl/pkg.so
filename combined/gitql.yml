id: brew:gitql
display-name: Gitql
homepage: https://github.com/filhodanuvem/gitql
repo: https://github.com/filhodanuvem/gitql
docs:
  - https://github.com/filhodanuvem/gitql#readme
  - https://github.com/filhodanuvem/gitql/blob/main/tables.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gitql attracted attention as an early and approachable example of applying
      database-style querying to Git history. Its package-manager presence in Homebrew,
      Scoop, and winget reflects a developer-tool audience that wants ad hoc repository
      inspection from a shell.
  package-nerd-significance:
    - >
      For package catalogs, Gitql is a compact example of the SQL-for-everything genre
      applied to version-control metadata. It is useful for discovery and one-off
      inspection, while its README explicitly avoids promising a full Git replacement.
  project-history:
    - >
      The repository dates to February 2014, and the README describes Gitql as the
      author's first Go project. The project positions itself as an experiment rather
      than a replacement for `git log`, noting that it was created for exploration and
      inspired by textql.
  related-projects:
    - >
      Gitql is related to Git, textql, and other tools that expose local files or
      developer metadata through SQL-like query interfaces.
  sources:
    - https://api.github.com/repos/filhodanuvem/gitql
    - https://api.github.com/repos/filhodanuvem/gitql/releases
    - https://formulae.brew.sh/formula/gitql
    - https://github.com/filhodanuvem/gitql
    - https://github.com/filhodanuvem/gitql/blob/main/tables.md
    - https://raw.githubusercontent.com/filhodanuvem/gitql/main/README.md
  summary:
    - >
      Gitql is a Go command-line tool that exposes Git repository history through a
      SQL-like query language. It treats commits and related repository data as
      queryable tables, with examples such as selecting commit hashes, authors, dates,
      and messages.
  timeline:
    - '2014: Repository created on GitHub.'
    - '2016: 1.2.1 release published.'
    - '2020s: Packaged for Homebrew, Scoop, and winget.'
  usage:
    - >
      Practitioners run `gitql "your query"` or use the Git subcommand form `git ql
      "your query"` inside a repository. Typical use is read-only filtering, ordering,
      and projection over commit fields, such as listing authors or finding messages
      matching a string.
related-packages:
  - id: brew:gql
    reason: >
      Choose the newer GitQL when you need a substantially broader SQL-like language,
      queries over branches, tags, references, and diffs, or an extensible SDK; choose
      Gitql for its smaller, older read-only commit-query interface.
    rel: alternative
    sources:
      - https://github.com/filhodanuvem/gitql
      - https://github.com/AmrDeveloper/GQL
      - https://amrdeveloper.github.io/GQL/
category: developer-tools
package-manager:
  brew: gitql
  scoop: main/gitql
  winget: amrdeveloper.gitql
package-manager-url: https://formulae.brew.sh/formula/gitql
license: MIT
tags:
  - cli
  - git
  - go
  - query-language
  - sql
description: Git query language
executables:
  - gitql
provenance:
  formula: gitql
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
