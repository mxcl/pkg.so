id: brew:kagent
display-name: kagent
homepage: https://kagent.dev
repo: https://github.com/kagent-dev/kagent
docs:
  - https://kagent.dev/docs
config-file-location:
  unix: ~/.kagent/config.yaml
  windows: '%USERPROFILE%\.kagent\config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      A 2025 project blog post described the first 100 days as reaching CNCF Sandbox
      status, more than 100 contributors, and more than 1,000 GitHub stars. Release
      metadata shows frequent 0.x releases through 2025 and 2026, consistent with a
      fast-moving early-stage cloud-native project.
  package-nerd-significance:
    - >
      For package managers, kagent is part of the 2025-2026 wave of CLIs that package
      LLM-agent infrastructure as normal cloud-native tooling rather than as a
      standalone chat application. The Homebrew formula gives platform engineers a
      familiar entry point into that stack.
  project-history:
    - >
      The project was created at Solo.io in 2025 and documented as a Cloud Native
      Computing Foundation sandbox project. Its design centers on DevOps and
      platform-engineering use cases: agents run close to Kubernetes workloads, use
      cluster-native APIs, and can coordinate multi-step operational tasks.
  related-projects:
    - >
      Related projects and standards include Kubernetes, CNCF, Model Context Protocol
      servers, kgateway, kmcp, and other cloud-native agent frameworks.
  sources:
    - https://api.github.com/repos/kagent-dev/kagent/releases?per_page=100
    - https://kagent.dev/
    - https://kagent.dev/blog/kagent-celebrating-100-days
    - https://kagent.dev/docs/kagent/introduction/what-is-kagent
  summary:
    - >
      kagent is an open-source Kubernetes-native framework for running AI agents as
      cloud-native workloads for operations, troubleshooting, and automation.
  timeline:
    - '2025: kagent created at Solo.io.'
    - '2025: Project accepted as a CNCF Sandbox project.'
    - '2025-06-10: v0.3.13 appears in the public GitHub release feed.'
    - '2026-06-29: v0.10.0-beta1 published.'
  usage:
    - >
      Users install kagent into a Kubernetes environment, define agents and tools,
      connect an LLM provider, and use the framework to automate investigation,
      remediation, and workflow tasks around cluster operations.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl to inspect and verify the Kubernetes workloads and resources created
      by kagent, as shown in the official installation procedure.
    rel: adjacent_workflow
    sources:
      - https://www.kagent.dev/docs/kagent/1.x/setup/installation/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:helm
    reason: >
      Use Helm when you need direct chart-based installation or detailed control of
      kagent deployment values instead of the guided CLI installer.
    rel: adjacent_workflow
    sources:
      - https://www.kagent.dev/docs/kagent/1.x/setup/installation/
      - https://helm.sh/docs/
category: ai
package-manager:
  brew: kagent
package-manager-url: https://formulae.brew.sh/formula/kagent
license: Apache-2.0
tags:
  - ai
  - ai-agents
  - automation
  - cli
  - cloud-native
  - developer-tools
  - kubernetes
  - llm
description: Kubernetes native framework for building AI agents
executables:
  - kagent
provenance:
  formula: kagent
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
