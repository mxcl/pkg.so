id: brew:flatcc
display-name: flatcc
homepage: https://github.com/dvidelabs/flatcc
repo: https://github.com/dvidelabs/flatcc
docs:
  - https://github.com/dvidelabs/flatcc#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      flatcc serves C projects that want FlatBuffers compatibility without pulling in a
      C++ compiler/runtime model. Its README describes CI-tested Ubuntu, macOS, and
      Windows support, user-reported portability, and a no-CMake integration path once
      the generator has produced headers.
  package-nerd-significance:
    - >
      flatcc is package-nerd significant because it is a compatibility-layer package: it
      tracks the FlatBuffers format while optimizing for C-only consumers, small
      binaries, generated headers, and vendorable runtime source files.
  project-history:
    - >
      The official git history starts with an initial public release v0.1.0 on
      2015-11-09. The README explains that flatcc is implemented as a standalone tool
      rather than as an extension of Google's flatc so it can provide a pure portable C
      schema compiler and fail gracefully on abusive input in long-running processes.
  related-projects:
    - >
      The README explicitly relates flatcc to Google FlatBuffers and the flatc compiler,
      while distinguishing flatcc as the FlatBuffers C Compiler.
  sources:
    - https://formulae.brew.sh/formula/flatcc
    - https://github.com/dvidelabs/flatcc
    - https://raw.githubusercontent.com/dvidelabs/flatcc/master/README.md
  summary:
    - >
      flatcc is a FlatBuffers compiler and runtime library written in C for C. Its
      README emphasizes minimal dependencies, generated C headers, a standalone flatcc
      executable, and runtime libraries for building, verifying, parsing, and printing
      FlatBuffers.
  timeline:
    - '2015: Initial public release v0.1.0.'
    - '2016: v0.4.0 tag; README notes big-endian support as of release 0.4.0.'
    - '2022: v0.6.1 tag appears in the official git history.'
  usage:
    - >
      Users build flatcc, run it against .fbs schema files, include generated headers,
      and link only the needed C runtime files. The README contrasts flatcc's runtime
      JSON handling with Google's flatc command-line JSON conversion, presenting the
      tools as complementary.
related-packages:
  - id: brew:flatbuffers
    reason: >
      Choose the upstream FlatBuffers package when you need its multi-language `flatc`
      compiler and runtimes; choose flatcc for a standalone C implementation optimized
      for C consumers.
    rel: alternative
    sources:
      - https://github.com/dvidelabs/flatcc
      - https://github.com/google/flatbuffers
      - https://github.com/google/flatbuffers/blob/master/docs/source/flatc.md
