id: brew:fuego-firestore
display-name: fuego
homepage: https://github.com/sgarciac/fuego
repo: https://github.com/sgarciac/fuego
docs:
  - https://github.com/sgarciac/fuego#readme
  - https://sgarciac.github.io/fuego
config-file-location: null
credentials-file-location:
  unix:
    - '--credentials <service-account-key.json>'
    - $GOOGLE_APPLICATION_CREDENTIALS
history:
  adoption-history:
    - >
      The README documents precompiled binaries for Windows, Linux, and Darwin/macOS, a
      Snap installation path for Linux users, and local Go builds. The Homebrew package
      facts show that the same tool is also packaged as fuego-firestore in Homebrew.
  package-nerd-significance:
    - >
      The package is notable in package indexes because its formula name,
      fuego-firestore, disambiguates it from the unrelated Go-game AI package named
      Fuego. It is also a compact example of a cloud database CLI distributed through
      GitHub releases, Snap, Go builds, and Homebrew.
  project-history:
    - >
      The public official history is sparse and mostly represented by the GitHub
      repository, GitHub Pages documentation, and release artifacts. The README directs
      ordinary users to the stable documentation site while keeping the repository as
      the source and development surface.
  related-projects:
    - Google Cloud Firestore is the database service that fuego operates against.
    - Firebase service accounts provide the key file used for authenticated access.
    - >
      The Firestore emulator is supported through the FIRESTORE_EMULATOR_HOST
      environment variable.
  sources:
    - https://github.com/sgarciac/fuego
    - https://github.com/sgarciac/fuego#readme
    - https://github.com/sgarciac/fuego/releases
    - https://sgarciac.github.io/fuego/
  summary:
    - >
      fuego is a command-line client for Google Cloud Firestore. The official
      documentation focuses on practical Firestore operations: authentication, project
      selection, collection listing, document CRUD, recursive deletion, queries, and
      extended JSON for Firestore-specific types.
  timeline:
    - '2021: Official release page shows public release activity beginning by November 2021.'
    - >
      2021: Documentation examples show Firestore document workflows and service-account
      authentication.
    - '2024: Official release page still shows release activity.'
  usage:
    - >
      fuego is used by developers and operators who want to inspect or modify Firestore
      data from a shell. It authenticates with a Google service account key, can use the
      Firestore emulator through FIRESTORE_EMULATOR_HOST, and accepts JSON input for
      document writes.
related-packages:
  - id: brew:firebase-cli
    reason: >
      Choose the official Firebase CLI when you need broader Firebase project setup,
      deployment, and emulator workflows rather than fuego's focused Firestore document
      and query interface.
    rel: alternative
    sources:
      - https://sgarciac.github.io/fuego/
      - https://firebase.google.com/docs/cli
      - https://github.com/firebase/firebase-tools
category: data
package-manager:
  brew: fuego-firestore
package-manager-url: https://formulae.brew.sh/formula/fuego-firestore
license: GPL-3.0-only
tags:
  - cli
  - database
  - firebase
  - firestore
  - go
  - json
description: Command-line client for the Firestore database
executables:
  - fuego
provenance:
  formula: fuego-firestore
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
