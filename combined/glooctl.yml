id: brew:glooctl
display-name: glooctl
homepage: https://docs.solo.io/gloo-edge/main/reference/cli/glooctl/
repo: https://github.com/solo-io/gloo
docs:
  - https://docs.solo.io/gloo-edge/latest/reference/cli/glooctl
config-file-location:
  unix: ~/.gloo/glooctl-config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption follows the Kubernetes gateway ecosystem: operators install it from
      Homebrew or Nix, use it beside kubectl and Helm, and manage Envoy-backed gateway
      resources through Solo.io's documented Gloo distributions.
  package-nerd-significance:
    - >
      glooctl is a representative cloud-native vendor CLI: a single executable that
      wraps Kubernetes control-plane operations while remaining package-manager
      installable for local admin machines and CI runners.
  project-history:
    - >
      The glooctl binary developed inside the solo-io/gloo repository as the operational
      CLI for Gloo Edge. The repository and documentation describe the broader project
      as an Envoy-powered API gateway that evolved toward Kubernetes-native ingress and
      Gateway API workflows while preserving the Gloo Edge API surface.
  related-projects:
    - >
      glooctl is tied to Gloo Edge, Gloo Gateway, Envoy Proxy, Kubernetes Gateway API,
      and Kubernetes package workflows such as Helm.
  sources:
    - https://docs.solo.io/gloo-edge/main/reference/cli/glooctl/
    - https://formulae.brew.sh/formula/glooctl
    - https://github.com/solo-io/gloo
    - https://raw.githubusercontent.com/solo-io/gloo/main/README.md
  summary:
    - >
      glooctl is the command-line tool for Solo.io's Gloo Edge and Gloo Gateway
      ecosystem, an Envoy-based API gateway for Kubernetes and hybrid application
      routing.
  timeline:
    - '2019: v0.1.0 tag appeared in the solo-io/gloo repository.'
    - >
      2020s: Gloo documentation and repository materials emphasized Envoy, Kubernetes
      Gateway API, and hybrid application routing.
  usage:
    - >
      Practitioners use glooctl for setup, installation, diagnostics, and resource
      inspection in Gloo environments. The CLI reference groups commands around checking
      installations, installing gateway components, inspecting resources, and managing
      local CLI configuration.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl beside glooctl to inspect and manage the Kubernetes cluster on which
      glooctl installs and diagnoses Gloo resources.
    rel: adjacent_workflow
    sources:
      - https://docs.solo.io/gloo-edge/main/reference/cli/glooctl/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:helm
    reason: >
      Use Helm for chart-based Kubernetes release management while glooctl performs
      Gloo-specific installation checks, diagnostics, and resource operations.
    rel: adjacent_workflow
    sources:
      - https://docs.solo.io/gloo-edge/main/reference/cli/glooctl/
      - https://helm.sh/docs/
category: cloud-infrastructure
package-manager:
  brew: glooctl
  nix: glooctl
package-manager-url: https://formulae.brew.sh/formula/glooctl
license: Apache-2.0
tags:
  - api-gateway
  - cli
  - envoy
  - gloo-edge
  - kubernetes
description: Envoy-Powered API Gateway
executables:
  - glooctl
provenance:
  formula: glooctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
