id: brew:freetype
display-name: FreeType
homepage: https://www.freetype.org/
repo: https://gitlab.freedesktop.org/freetype/freetype
docs:
  - https://freetype.org/freetype2/docs/documentation.html
  - https://freetype.org/freetype2/docs/index.html
  - https://freetype.org/freetype2/docs/reference/ft2-index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FreeType 1 influenced OS/2 and TeX tooling through FreeType/2 and ttf2pk,
      according to the official history. FreeType 2's narrower rendering focus made it a
      durable low-level dependency rather than a complete text-layout engine.
    - >
      Its adoption is visible through its role as a tiny, efficient, portable renderer
      used by other software rather than as an end-user program. The README emphasizes
      portability, customization, and high-quality output across most vector and bitmap
      font formats.
  package-nerd-significance:
    - >
      FreeType is one of the archetypal invisible dependencies; upgrading it can affect
      font rendering across a whole system. Package maintainers care about ABI
      stability, optional rendering features, patent-era historical choices around
      hinting, and coordination with HarfBuzz and graphics stacks.
    - >
      Its history also explains an important Unix packaging boundary: FreeType renders
      glyphs, while shaping and layout live elsewhere. That division is why FreeType and
      HarfBuzz so often travel together in dependency graphs.
  project-history:
    - >
      The official history says David Turner created FreeType in 1996 to render TrueType
      fonts, including a TrueType bytecode interpreter. Robert Wilhelm ported it to C in
      1997, Werner Lemberg joined the team, and the Pascal version ended development in
      2000.
    - >
      FreeType 2.0 was released in 2000 after beta releases as a complete modular
      rewrite. It added support for multiple font formats, including PostScript fonts,
      improved gray-level rendering, and glyph image and metrics caching.
    - >
      The project later narrowed its scope around 2004 to creating rasterized glyph
      images, leaving text shaping and layout to higher-level libraries such as ICU and
      HarfBuzz. In 2009 the repository moved from CVS to git, and Werner Lemberg became
      the sole maintainer with outside contributions.
  related-projects:
    - >
      HarfBuzz is the shaping library explicitly referenced by the official history as a
      better layer above FreeType for text shaping.
    - >
      ICU is also named by the official history as a higher-level library for text
      layout concerns.
    - >
      ttf2pk and FreeType/2 are historical FreeType 1 related projects highlighted by
      the official history.
  sources:
    - https://freetype.org/freetype2/docs/documentation.html
    - https://freetype.org/history.html
    - https://gitlab.freedesktop.org/freetype/freetype
    - https://gitlab.freedesktop.org/freetype/freetype/-/raw/master/README
    - https://gitlab.freedesktop.org/freetype/freetype/-/tags/VER-2-0
    - https://gitlab.freedesktop.org/freetype/freetype/-/tags/VER-2-14-3
  summary:
    - >
      FreeType is a portable C library for rendering fonts, especially vector and bitmap
      font formats. It is a foundational graphics dependency: users rarely invoke it
      directly, but desktop stacks, browsers, games, document renderers, and toolkits
      depend on the library to turn fonts into glyph images.
  timeline:
    - '1996: David Turner created FreeType to render TrueType fonts.'
    - '1997: Robert Wilhelm ported FreeType to C and Werner Lemberg joined the team.'
    - '2000: FreeType 2.0 released as a modular rewrite; Pascal version development stopped.'
    - >
      2004: Project scope narrowed to rasterized glyph images, leaving shaping and
      layout to libraries above FreeType.
    - >
      2009: Source repository migrated from CVS to git; Werner Lemberg became the only
      maintainer.
    - >
      2026: FreeType 2.14.3 README identifies the current project as a small, efficient,
      customizable, portable C font rendering library.
  usage:
    - >
      Developers use FreeType through its C API to load font faces, inspect glyph
      metrics, rasterize glyph images, and integrate font rendering into larger graphics
      or document pipelines. The official documentation includes glyph conventions, a
      tutorial, API reference, design notes, and hinting documentation.
    - >
      Packaged FreeType usually exposes headers, libraries, freetype-config for legacy
      build integration, and documentation. It does not have a normal user config file
      or credential store.
related-packages:
  - id: brew:harfbuzz
    reason: >
      Pair HarfBuzz with FreeType when an application needs both complex-text shaping
      and glyph rasterization; HarfBuzz provides a dedicated `hb-ft` integration API for
      this workflow.
    rel: adjacent_workflow
    sources:
      - https://harfbuzz.github.io/integration-freetype.html
      - https://freetype.org/history.html
category: media
