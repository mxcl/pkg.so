id: brew:loki
display-name: Grafana Loki
homepage: https://grafana.com/oss/loki
repo: https://github.com/grafana/loki
docs:
  - https://grafana.com/docs/loki/latest
config-file-location:
  unix:
    - ./config.yaml
    - ./config/config.yaml
    - loki.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Loki's adoption followed cloud-native observability patterns: Prometheus users
      already had label conventions, Grafana dashboards, and a need to correlate metrics
      and logs without paying the storage cost of full-text log indexing.
    - >
      Grafana's official OSS pages and yearly open-source recap describe Loki as a major
      Grafana Labs project, and the repository shows broad adoption with tens of
      thousands of stars, thousands of forks, active releases, and an `ADOPTERS.md`
      process for organizations using Loki.
    - >
      The supplied package facts show package-manager availability through Homebrew,
      Alpine, Debian, Ubuntu, Arch, Nix, and openSUSE-related packaging, with `logcli`
      also packaged separately in some ecosystems.
  package-nerd-significance:
    - >
      For package nerds, Loki is the observability-era package that made 'logs as
      Prometheus-shaped data' a concrete binary and config file. It is large enough to
      need Helm charts, Docker images, agents, and CLI companions, but still keeps a
      recognizable single-service local mode for packaging and testing.
  project-history:
    - >
      Grafana Labs started Loki in 2018 and announced it at KubeCon Seattle. The
      official repository was created in April 2018 and describes the project as 'like
      Prometheus, but for logs.'
    - >
      Loki was designed around labels, compressed unstructured logs, and integration
      with Grafana. The README explains that a Loki-based stack includes the Loki
      service, Grafana for querying and visualization, and a log collection agent;
      current docs identify Grafana Alloy as the forward-looking agent while Promtail is
      considered feature complete.
    - >
      Grafana announced the general availability of Loki 1.0 in November 2019. By the
      3.x series, Loki had grown into one of Grafana Labs' major OSS projects, with
      active documentation for single-binary, simple scalable, and microservices
      deployment modes.
  related-projects:
    - >
      Loki is designed to pair with Grafana for visualization and with Prometheus-style
      labels for correlation with metrics.
    - >
      Promtail was the original log collection agent in many Loki deployments, while
      Grafana Alloy is now the recommended forward-looking collector in the README.
  sources:
    - https://api.github.com/repos/grafana/loki
    - https://github.com/grafana/loki#readme
    - https://grafana.com/blog/grafana-labs-open-source-projects-2022/
    - https://grafana.com/docs/loki/latest/
    - https://grafana.com/docs/loki/latest/configure/
    - https://grafana.com/oss/loki/
    - >
      https://grafana.com/press/2019/11/20/grafana-labs-announces-ga-release-of-loki-like-prometheus-but-for-logs/
    - source_facts.package-manager
  summary:
    - >
      Grafana Loki is a horizontally scalable, highly available, multi-tenant log
      aggregation system inspired by Prometheus. Its core design indexes labels rather
      than full log contents, aiming to make log storage cheaper and easier to operate.
  timeline:
    - '2018: Loki project starts at Grafana Labs and is announced at KubeCon Seattle.'
    - '2019: Grafana Labs announces Loki 1.0 general availability.'
    - '2022: Grafana Labs describes Loki as its second most popular OSS project behind Grafana.'
    - '2026: Loki 3.7.x releases are active in the official GitHub repository.'
  usage:
    - >
      Loki is usually launched with a YAML configuration file, commonly called
      `loki.yaml`, passed through `-config.file`. The official README's source build
      example runs `./cmd/loki/loki -config.file=./cmd/loki/loki-local-config.yaml`, and
      the docs show Docker examples using `/etc/loki/local-config.yaml`.
    - >
      Operators send logs to Loki with agents such as Grafana Alloy, then query them
      from Grafana using LogQL. Loki's distinction is that labels are indexed, while log
      lines remain compressed payloads.
related-packages:
  - id: brew:grafana-alloy
    reason: >
      Use Grafana Alloy as the officially recommended collector to gather, transform,
      and send logs into Loki.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/loki/latest/send-data/alloy/
      - https://grafana.com/docs/alloy/latest/
  - id: brew:grafana
    reason: >
      Use Grafana to add Loki as a data source and explore LogQL results through Logs
      Drilldown, Explore, and persistent dashboards.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/loki/latest/visualize/grafana/
      - https://grafana.com/docs/grafana/latest/datasources/loki/
  - id: brew:logcli
    reason: >
      Use LogCLI to run LogQL queries and scripted administrative analysis directly
      against a Loki server without Grafana's graphical interface.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/loki/latest/query/logcli/
      - https://grafana.com/docs/loki/latest/query/logcli/getting-started/
category: data
package-manager:
  apk: loki
  brew: loki
  debian: loki
  nix: loki
  pacman: loki
  ubuntu: loki
  zypper: logcli
package-manager-url: https://formulae.brew.sh/formula/loki
license: AGPL-3.0-only
tags:
  - cli
  - grafana
  - log-aggregation
  - logql
  - logs
  - observability
  - scalable
description: Horizontally-scalable, highly-available log aggregation system
executables:
  - loki
provenance:
  formula: loki
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
