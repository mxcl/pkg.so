id: brew:fprettify
display-name: fprettify
homepage: https://github.com/fortran-lang/fprettify/
repo: https://github.com/fortran-lang/fprettify
docs:
  - https://github.com/fortran-lang/fprettify#readme
config-file-location:
  unix:
    - ~/.fprettify.rc
    - .fprettify.rc in parent directories of the input file
    - for stdin, .fprettify.rc search starts in the current directory
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions cover pip installation and conda-forge
      installation. The README also documents editor integration, especially Vim
      formatprg usage, and describes integration-test suites against external Fortran
      code bases.
  package-nerd-significance:
    - >
      fprettify is significant because it brings the formatter-as-a-tool pattern to a
      language with long-lived formatting conventions and many legacy codebases. It is
      small, Python-packaged, editor-friendly, and useful in CI or pre-commit workflows
      for Fortran projects that want whitespace-only formatting by default.
  project-history:
    - >
      The official source headers identify Patrick Seewald and the CP2K developers group
      as early copyright holders for the formatter. GitHub redirects the former
      pseewald/fprettify repository to fortran-lang/fprettify, and the current
      repository is maintained under the Fortran-lang organization.
    - >
      The release history begins with v0.1 in August 2016, reaches v0.3 in November
      2016, and continues through v0.3.7 in November 2020. The README records the later
      Python 3 requirement and notes that Python 2.7 support is no longer present.
  related-projects:
    - >
      The README names fypp preprocessor directives as supported input and
      ConfigArgParse as the optional dependency enabling configuration files. Its
      current home under fortran-lang places it near the Fortran Package Manager and
      other modern Fortran tooling.
  sources:
    - https://api.github.com/repos/fortran-lang/fprettify/releases?per_page=20
    - https://github.com/pseewald/fprettify
    - https://raw.githubusercontent.com/fortran-lang/fprettify/master/README.md
    - https://raw.githubusercontent.com/fortran-lang/fprettify/master/fprettify/__init__.py
  summary:
    - >
      fprettify is a Python-based auto-formatter for modern Fortran source code. Its
      official README emphasizes strict whitespace formatting, indentation, continuation
      alignment, comment spacing, and support for modern Fortran beginning with Fortran
      90.
  timeline:
    - '2016: v0.1 was published as the first GitHub release.'
    - '2016: v0.3 was published later the same year.'
    - '2018: v0.3.2 and v0.3.3 were published.'
    - '2019: v0.3.4 and v0.3.5 were published.'
    - '2020: v0.3.6 and v0.3.7 were published.'
  usage:
    - >
      The command formats one or more files in place, can recurse through Fortran source
      trees, can write diffs or stdout instead of editing, and can be silenced for
      editor integration. With ConfigArgParse installed it reads ~/.fprettify.rc plus
      .fprettify.rc files in parent directories of the input file, starting from the
      current directory when reading stdin.
related-packages:
  - id: brew:findent
    reason: >
      Choose findent when working with vintage or fixed-form Fortran or when format
      conversion and label renumbering matter; fprettify focuses on comprehensive
      whitespace formatting for modern Fortran.
    rel: alternative
    sources:
      - https://github.com/fortran-lang/fprettify
      - https://www.ratrabbit.nl/ratrabbit/findent/index.html
  - id: brew:fypp
    reason: >
      Fypp preprocesses parameterized Fortran sources, and fprettify explicitly
      understands Fypp directives so generated-source projects can keep their templates
      consistently formatted.
    rel: adjacent_workflow
    sources:
      - https://github.com/fortran-lang/fprettify
      - https://fypp.readthedocs.io/en/stable/
category: developer-tools
package-manager:
  brew: fprettify
  dnf: fprettify
  nix: fprettify
package-manager-url: https://formulae.brew.sh/formula/fprettify
license: GPL-3.0-or-later
tags:
  - cli
  - formatter
  - fortran
  - python
  - source-code
description: Auto-formatter for modern fortran source code
executables:
  - fprettify
provenance:
  formula: fprettify
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
