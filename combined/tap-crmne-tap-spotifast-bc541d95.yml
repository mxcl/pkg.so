id: cask:crmne/tap/spotifast
display-name: Spotifast
homepage: https://spotifast.rocks
repo: https://github.com/crmne/spotifast
docs:
  - https://spotifast.rocks/
  - https://spotifast.rocks/getting-started
  - https://spotifast.rocks/how-it-connects
  - https://spotifast.rocks/settings-and-files
  - https://spotifast.rocks/using-spotifast
config-file-location:
  linux: ~/.config/spotifast/settings.json
  macos: ~/Library/Application Support/me.paolino.spotifast/settings.json
  windows: '%APPDATA%\paolino\spotifast\config\settings.json'
credentials-file-location:
  linux: 'Secret Service entry: rocks.spotifast.Spotifast'
  macos: 'Keychain entry: rocks.spotifast.Spotifast'
  windows: 'Credential Manager entry: rocks.spotifast.Spotifast'
history:
  adoption-history:
    - >
      The project distributes native builds for Linux, macOS and Windows and documents
      installations through Homebrew, Arch packages, Flatpak, AppImage, Nix and
      standalone downloads. Its releases added protected native credential storage,
      broader packaging and a shared native application framework.
    - >
      Spotifast remains a young independent client. Its documented adoption is best
      characterized by active cross-platform packaging and community contributions
      rather than long-term institutional deployment.
  package-nerd-significance:
    - >
      Spotifast is notable as a lightweight Rust alternative to browser-engine music
      clients. It combines a full desktop library interface with librespot playback,
      Spotify Connect control, command-line link handling, a Winamp-compatible mini
      player and MilkDrop visualizations.
    - >
      Its packaging history also records a complete application rename while preserving
      user profiles and updater compatibility, a migration problem that desktop package
      maintainers frequently encounter.
  project-history:
    - >
      The application began in 2026 under the Fastpotify name. It was developed as a
      native Rust Spotify client using egui and librespot, with local playback, library
      browsing and Connect device control.
    - >
      The project adopted the Spotifast name during the 0.8–0.9 release period.
      Compatibility releases migrated settings, sign-ins, caches, executables and
      package identities before later releases removed the old Fastpotify naming.
  related-projects:
    - librespot supplies Spotifast's Spotify playback and Connect implementation.
    - >
      ZapFast is the author's sibling native application and shares the fastframe Rust
      application foundation.
  sources:
    - https://github.com/crmne/spotifast#readme
    - https://github.com/crmne/spotifast/releases
    - https://spotifast.rocks/
    - https://spotifast.rocks/getting-started/
    - https://spotifast.rocks/settings-and-files/
  summary:
    - >
      Spotifast is an independent, native Rust desktop client for browsing Spotify
      libraries, playing music locally and controlling Spotify Connect devices without
      embedding a browser engine.
  timeline:
    - '2026: The project begins under the Fastpotify name.'
    - >
      2026: Native releases and package-manager installation expand across Linux, macOS
      and Windows.
    - >
      2026: The application is renamed Spotifast, with transitional releases migrating
      profiles and package identities.
  usage:
    - >
      Users sign in through Spotify in a browser and separately approve local playback.
      Browsing and search work with free accounts, while playback through Spotifast
      requires Spotify Premium.
    - >
      Spotifast can remain in the system tray, handle spotify: links, control other
      Connect devices, use media keys and expose a small command-line surface for links
      and session controls.
related-packages:
  - id: cask:spotify
    reason: >
      Choose Spotify's official desktop client when vendor support and full first-party
      behavior matter more than Spotifast's lightweight native interface and open-source
      implementation.
    rel: alternative
    sources:
      - https://spotifast.rocks/what-is-spotifast/
      - https://support.spotify.com/us/article/spotify-on-desktop/
category: media
package-manager:
  brew-cask: crmne/tap/spotifast
package-manager-url: https://github.com/crmne/homebrew-tap/blob/HEAD/Casks/spotifast.rb
tags:
  - desktop
  - librespot
  - music-player
  - native
  - rust
  - spotify
  - spotify-connect
description: Native Spotify client
applications:
  - Spotifast.app
provenance:
  provider: cask
  source: https://github.com/crmne/homebrew-tap/blob/HEAD/Casks/spotifast.rb
  tap: crmne/tap
