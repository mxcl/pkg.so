id: brew:ctemplate
display-name: ctemplate
homepage: https://github.com/olafvdspek/ctemplate
repo: https://github.com/OlafvdSpek/ctemplate
docs:
  - https://github.com/OlafvdSpek/ctemplate#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README positions ctemplate as portable C++ infrastructure, tested across Linux
      distributions, Solaris, FreeBSD, older OS X releases, and Windows Visual C++
      versions. Homebrew and other package-manager metadata keep it available as a
      system C++ library rather than only as vendored source.
  package-nerd-significance:
    - >
      For package maintainers, ctemplate is representative of older Google-era C++
      infrastructure: Autotools, platform portability fixes, generated headers, optional
      thread linkage, and a long-lived ABI-style library package.
  project-history:
    - >
      The initial release was made by Google Inc. in March 2006 as a package
      implementing a simple but powerful template language for C++. Early releases added
      portability work, escaping modes, editor support, and threading/build variants.
    - >
      In the 2.0 release in January 2012, the project changed its official contact,
      rewrote documentation to refer to Ctemplate rather than Google Template, renamed
      Visual Studio files, and updated copyright text to reflect Google's relinquished
      ownership. Later releases under Olaf van der Spek focused on C++11 fixes,
      refactoring, and a Python 3 build-tool update.
  related-projects:
    - >
      The project originated as Google Template/Ctemplate and remains a C++ templating
      library rather than a web framework or general text-preprocessor package.
  sources:
    - https://github.com/OlafvdSpek/ctemplate/blob/master/ChangeLog
    - https://github.com/OlafvdSpek/ctemplate#readme
    - https://formulae.brew.sh/formula/ctemplate
  summary:
    - >
      ctemplate is a C++ template library with companion command-line tools for template
      conversion and generated variable-name headers. Its official changelog traces the
      project from a Google open-source release in 2006 through community-maintained 2.x
      releases.
  timeline:
    - '2006: Initial Google Inc. release.'
    - '2011: 1.0 release after the 0.x series.'
    - >
      2012: 2.0 release renamed project surfaces from Google Template to Ctemplate and
      reflected Google's relinquished ownership.
    - '2020: 2.4 release switched build tooling to Python 3.'
  usage:
    - >
      Users link applications against either the threaded ctemplate library or the
      nothreads variant, and the package installs small helper executables such as
      make_tpl_varnames_h, template-converter, and diff_tpl_auto_escape.
related-packages: []
