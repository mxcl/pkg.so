id: brew:lune
display-name: Lune
homepage: https://lune-org.github.io/docs
repo: https://github.com/lune-org/lune
docs:
  - https://lune-org.github.io/docs
  - https://github.com/lune-org/lune#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lune's official installation documentation identifies Rokit, a Roblox toolchain
      manager, as the preferred installation path, then documents GitHub Releases,
      Scoop, Homebrew, AUR, Nix, Cargo, and binstall paths. The supplied package
      metadata also lists Homebrew, Nix, and winget.
    - >
      This broad packaging surface is part of Lune's adoption story: it serves
      Roblox/Luau developers who want a script runner available through the package
      manager they already use.
  package-nerd-significance:
    - >
      Lune is notable in package history because it packages Luau as a standalone
      language runtime rather than as an engine-embedded scripting language. That gives
      package managers something closer to a `node` or `deno` analogue for Luau scripts.
    - >
      Its official docs explicitly discuss multiple package ecosystems, including
      Homebrew and Nix, which makes it a good example of a modern language runtime
      treating package-manager availability as part of the product.
  project-history:
    - >
      The lune-org/lune repository was created in 2023. The project frames Luau as a
      general scripting environment rather than only an embedded Roblox language, while
      still including Roblox-oriented compatibility such as a familiar task scheduler
      and optional APIs for manipulating Roblox place and model files.
    - >
      The documentation emphasizes a small executable, filesystem/networking/stdio APIs,
      editor-friendly documentation, and a command-line workflow around `lune run` and
      `lune list`.
  related-projects:
    - Luau is the language runtime target.
    - Node.js, Deno, Bun, and Luvit are named by upstream as comparable standalone runtimes.
    - >
      Rokit, Foreman, Aftman, Homebrew, Nix, Scoop, Cargo, and binstall are documented
      installation or toolchain channels.
  sources:
    - https://api.github.com/repos/lune-org/lune
    - https://api.github.com/repos/lune-org/lune/releases/latest
    - https://github.com/lune-org/lune#readme
    - https://lune-org.github.io/docs/
    - https://lune-org.github.io/docs/getting-started/1-installation/
    - https://lune-org.github.io/docs/getting-started/2-command-line-usage/
    - source_facts.package-manager
  summary:
    - >
      Lune is a standalone Luau runtime. Its documentation presents it as a way to write
      and run Luau programs in the style of standalone runtimes such as Node.js, Deno,
      Bun, or Luvit, with asynchronous APIs and a Rust implementation.
  timeline:
    - '2023: lune-org/lune repository created.'
    - '2025: v0.10.4 release published on GitHub.'
    - '2026: Repository metadata shows ongoing maintenance activity.'
  usage:
    - >
      A typical script is run with `lune run script-name`, and the docs say Lune
      searches the current directory, `lune` and `.lune` subdirectories, and
      corresponding home-directory folders for `.luau` or `.lua` scripts.
    - >
      `lune list` enumerates scripts found in `lune` or `.lune` directories, and `lune
      run -` executes a script from standard input, which makes it useful for
      command-line pipelines and local automation.
related-packages:
  - id: brew:luau
    reason: >
      Choose Luau's official CLI for direct language execution plus static analysis and
      linting; choose Lune when you need its broader asynchronous system and
      Roblox-oriented APIs.
    rel: alternative
    sources:
      - https://lune-org.github.io/docs/
      - https://luau.org/getting-started/
category: language-runtime
package-manager:
  brew: lune
  nix: lune
  winget: Lune.Lune
package-manager-url: https://formulae.brew.sh/formula/lune
license: MPL-2.0
tags:
  - async
  - cli
  - luau
  - runtime
  - rust
  - scripting
description: Standalone Luau script runtime
executables:
  - lune
provenance:
  formula: lune
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
