id: brew:dirac
display-name: Dirac
homepage: https://sourceforge.net/projects/dirac/
repo: https://sourceforge.net/p/dirac/code
docs:
  - https://sourceforge.net/projects/dirac
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dirac's adoption footprint is clearest in its SourceForge file tree and historical
      integration patches for projects such as FFmpeg, MPlayer, and transcode. Those
      artifacts show how codec projects of the 2000s often spread through patches,
      filters, command-line encoders and decoders, and downstream multimedia packages
      before settling into older repository maintenance.
  package-nerd-significance:
    - >
      Dirac matters historically as an open video-codec package from the SourceForge
      era, with a visible trail of codec sources, DirectShow components, FFmpeg and
      MPlayer patches, and format-conversion utilities. It is the kind of multimedia
      package that persists in package managers because older media workflows and build
      dependencies may still expect it.
  project-history:
    - >
      The SourceForge project was registered in February 2004 and organized its
      downloads around the Dirac codec, DirectShow filter builds, ffmpeg2dirac sources
      and binaries, old integration patches, and sample video. Its licenses are listed
      as MPL 1.1, GPLv2, and LGPLv2, matching the multi-license style of codec libraries
      and tools from that period.
  related-projects:
    - >
      Official SourceForge file listings include ffmpeg2dirac, a Dirac DirectShow
      filter, old FFmpeg and MPlayer patches, transcode patches, and sample video
      assets.
  sources:
    - https://sourceforge.net/projects/dirac/
    - https://sourceforge.net/projects/dirac/files/
    - https://sourceforge.net/p/dirac/activity/feed
  summary:
    - >
      Dirac is a general-purpose video codec project hosted on SourceForge. The official
      project page describes it as a codec for resolutions from QCIF to HDTV,
      progressive or interlaced, using wavelets, motion compensation, and arithmetic
      coding.
  timeline:
    - '2004: SourceForge project registered.'
    - '2009: SourceForge files list dated Dirac codec and DirectShow filter folders.'
    - '2011: ffmpeg2dirac Windows binary appears in the SourceForge download list.'
    - '2015: SourceForge activity feed records old integration patch file releases.'
    - '2017: SourceForge activity feed shows later bug reports against the project.'
  usage:
    - >
      The Homebrew formula exposes many conversion helpers plus `dirac_encoder`,
      `dirac_decoder`, and `dirac_instrumentation`. In package-manager terms, Dirac is
      used as a codec library and toolset rather than as an application with user-level
      configuration.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Use FFmpeg alongside Dirac to decode, transcode, or inspect broader multimedia
      formats; the official Dirac archive documents FFmpeg integration and the
      `ffmpeg2dirac` transcoding workflow.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/dirac/mailman/dirac-announce/
      - https://sourceforge.net/projects/dirac/files/ffmpeg2dirac-source/
      - https://ffmpeg.org/documentation.html
