id: brew:dotbot
display-name: Dotbot
homepage: https://github.com/anishathalye/dotbot
repo: https://github.com/anishathalye/dotbot
docs:
  - https://github.com/anishathalye/dotbot#readme
config-file-location:
  unix:
    - install.conf.yaml
    - install.conf.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Dotbot spread through personal dotfiles repositories because it fits the common
      bootstrap pattern: clone a dotfiles repo, enter it, and run ./install on a fresh
      machine. The README also notes package availability through Homebrew and Arch
      Linux, while source facts list Homebrew and Nix.
    - >
      A plugin ecosystem grew around the core, including plugins for secrets management,
      package managers, OS/application configuration, and other setup tasks.
  package-nerd-significance:
    - >
      Dotbot is package-nerd significant because it captures the Git-submodule era of
      dotfiles tooling: tiny tool, vendored into the repo, runnable on a fresh system,
      and intentionally not a full manager for the dotfiles themselves.
    - >
      For Homebrew users, packaging Dotbot as a CLI offers the same workflow without
      vendoring, using dotbot -c to point at a configuration file.
  project-history:
    - >
      The README explains the name as a dotfiles bootstrapper and emphasizes a
      deliberately minimal design: self-contained, no external dependencies, no required
      installation, and VCS-agnostic operation. Users can vendor it as a Git submodule
      or subrepo, or install it as a standalone command-line program.
    - >
      Public GitHub release metadata shows active tagged releases through the 2020s,
      including the v1.22-v1.24 series in 2025.
  related-projects:
    - >
      Dotbot is related to dotfiles_template, init-dotfiles, its wiki/tutorial
      ecosystem, and community plugins such as dotbot-age, dotbot-gitcrypt, dotbot-brew,
      dotbot-apt, dotbot-yum, crontab-dotbot, and dotbot-firefox.
  sources:
    - https://github.com/anishathalye/dotbot
    - https://api.github.com/repos/anishathalye/dotbot/releases?per_page=100
    - https://formulae.brew.sh/formula/dotbot
  summary:
    - >
      Dotbot is a lightweight dotfiles bootstrapper that lets a dotfiles repository
      install itself with a small YAML or JSON task list. Its identity is intentionally
      narrow: version control stores the files, and Dotbot links, creates, cleans, and
      runs shell commands.
  timeline:
    - >
      2014: The official README links an Anish Athalye blog post about managing dotfiles
      as background for Dotbot-style organization.
    - '2025: GitHub release metadata shows v1.22.0, v1.23.x, and v1.24.0 releases.'
    - >
      2020s: Dotbot supports both vendored submodule/subrepo workflows and standalone
      CLI installation.
  usage:
    - >
      A typical Dotbot setup keeps install.conf.yaml or install.conf.json in the
      dotfiles repository and runs tasks such as linking files into the home directory,
      creating directories, cleaning broken symlinks, and executing shell commands.
    - >
      The project is useful when users want a small, repeatable bootstrap without
      adopting a full configuration-management system.
related-packages:
  - id: brew:chezmoi
    reason: >
      Choose chezmoi when dotfiles must vary across many machines and you need built-in
      templating, secret-manager integration, encryption, and explicit apply or diff
      workflows.
    rel: alternative
    sources:
      - https://github.com/anishathalye/dotbot
      - https://www.chezmoi.io/what-does-chezmoi-do/
  - id: brew:yadm
    reason: >
      Choose yadm when you want dotfiles to stay directly in $HOME under a Git-like
      command model, with built-in alternates, encryption, hooks, and bootstrap support.
    rel: alternative
    sources:
      - https://github.com/anishathalye/dotbot
      - https://yadm.io/docs/overview
  - id: brew:stow
    reason: >
      Choose GNU Stow for a simpler symlink-farm workflow where directory layout
      supplies the mapping and no YAML bootstrap task list is required.
    rel: alternative
    sources:
      - https://github.com/anishathalye/dotbot
      - https://www.gnu.org/software/stow/manual/stow.html
category: developer-tools
package-manager:
  brew: dotbot
  nix: dotbot
package-manager-url: https://formulae.brew.sh/formula/dotbot
license: MIT
tags:
  - bootstrap
  - cli
  - configuration
  - dotfiles
  - symlinks
description: Tool that bootstraps your dotfiles
executables:
  - dotbot
provenance:
  formula: dotbot
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
