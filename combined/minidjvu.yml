id: brew:minidjvu
display-name: minidjvu
homepage: https://minidjvu.sourceforge.net/
repo: https://sourceforge.net/p/minidjvu/code
docs:
  - https://minidjvu.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      Technically, minidjvu is built around a narrow but practical workflow: encode and
      decode single-page black-and-white DjVu files, read and write PBM, Windows BMP,
      and TIFF through libtiff, and compress multiple pages by exploiting similarities
      between pages. The 0.8 release notes on the homepage mark important maturation
      points: safer pattern matching to avoid bad substitutions, letter averaging in
      multipage mode, bundled or indirect multipage DjVu output, gettext localization,
      and a simpler file-naming scheme.
  sources:
    - https://formulae.brew.sh/formula/minidjvu
    - https://minidjvu.sourceforge.net/
    - https://packages.debian.org/trixie/i386/graphics/minidjvu
    - https://sourceforge.net/projects/minidjvu/
  summary:
    - >
      minidjvu is a small, specialized DjVu utility focused on black-and-white scanned
      pages. The project homepage names Ilya Mezhirov as author and Alexey Kryukov in
      the acknowledgements area, and explains the design as an experiment with the
      bitonal JB2 part of DjVu rather than a complete DjVu implementation.
  usage:
    - >
      Its package-manager niche is scanner and document-archival plumbing rather than
      general image conversion. Debian describes it as a monochrome DjVu multipage
      encoder and single-page encoder/decoder with no color or grayscale support, which
      is exactly the tradeoff that makes it useful for scanned text, line art, and
      compact book-like documents.
related-packages:
  - id: brew:djvulibre
    reason: >
      Choose DjVuLibre when you need the complete DjVu library and broader encoding,
      decoding, conversion, and inspection toolkit instead of minidjvu's experimental
      bitonal-only focus.
    rel: alternative
    sources:
      - https://minidjvu.sourceforge.net/
      - https://djvu.sourceforge.net/doc/index.html
