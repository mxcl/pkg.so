id: brew:counterfeiter
display-name: counterfeiter
homepage: https://github.com/maxbrunsfeld/counterfeiter
repo: https://github.com/maxbrunsfeld/counterfeiter
docs:
  - https://github.com/maxbrunsfeld/counterfeiter#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      counterfeiter's documented workflow follows Go ecosystem conventions: add it as a
      tool dependency, place `go:generate` or `counterfeiter:generate` directives near
      interfaces, and regenerate fakes with `go generate`.
    - >
      The README notes that the project has largely been maintained by the community,
      which fits its role as a small but durable testing utility rather than a
      framework-owned generator.
  package-nerd-significance:
    - >
      For package maintainers, counterfeiter is a good example of a Go CLI whose
      preferred installation changed with Go tooling: Homebrew can ship a binary, but
      the upstream docs now prefer module-pinned tool dependencies for reproducible
      generation.
  project-history:
    - >
      The public repository was created in 2014. Its README frames the project around a
      Go-specific testing problem: fake implementations are useful for unit tests but
      cannot be generated automatically at runtime in Go.
    - >
      The project has continued through a v6 release line, with current documentation
      using Go modules and Go tool dependencies.
  related-projects:
    - go generate
    - Go modules
    - Go tool dependencies
  sources:
    - https://github.com/maxbrunsfeld/counterfeiter
    - https://api.github.com/repos/maxbrunsfeld/counterfeiter
    - https://github.com/maxbrunsfeld/counterfeiter/releases
  summary:
    - >
      counterfeiter is a Go code generator for creating self-contained, type-safe test
      doubles from interfaces.
  timeline:
    - '2014: Public GitHub repository created.'
    - '2024: v6.8.x through v6.11.x releases published.'
    - '2026: v6.12.2 release published.'
  usage:
    - >
      Typical use is to generate fakes for interfaces in the same module or for
      third-party interfaces, then import the generated `foofakes` package in tests to
      inspect call counts, arguments, and stubbed return values.
related-packages:
  - id: brew:mockery
    reason: >
      Choose mockery when a Go project wants centralized YAML configuration, multiple
      mock styles, or custom templates; choose counterfeiter for source-adjacent
      directives and self-contained fakes.
    rel: alternative
    sources:
      - https://github.com/maxbrunsfeld/counterfeiter#readme
      - https://vektra.github.io/mockery/latest/
category: developer-tools
package-manager:
  brew: counterfeiter
package-manager-url: https://formulae.brew.sh/formula/counterfeiter
license: MIT
tags:
  - cli
  - code-generation
  - go
  - test-doubles
  - testing
description: Tool for generating self-contained, type-safe test doubles in go
executables:
  - counterfeiter
provenance:
  formula: counterfeiter
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
