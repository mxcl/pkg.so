id: brew:git-who
display-name: git-who
homepage: https://github.com/sinclairtarget/git-who
repo: https://github.com/sinclairtarget/git-who
docs:
  - https://github.com/sinclairtarget/git-who#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-who has a broader adoption footprint than many small Git helpers in this
      batch. The README documents precompiled binaries, Homebrew, Docker, go install,
      and a Repology packaging badge; the July 2026 enrichment snapshot of GitHub
      metadata listed more than 2,600 stars.
  package-nerd-significance:
    - >
      git-who is significant because it packages a common organizational need, code
      ownership discovery, as a local Git-native command instead of a hosted analytics
      dashboard. It complements git blame by preserving history-level context that line
      blame can obscure.
  project-history:
    - >
      Nathan Smith published git-who in a GitHub repository created in December 2024.
      The README describes the project as a way to answer who is responsible for code at
      the component or subsystem level rather than only at the line level.
    - >
      The project quickly grew into three views: a table of authors, a tree annotated by
      primary contributors, and a histogram of repository activity. Releases in 2025 and
      2026 added signed artifacts, package-manager paths, and options such as NO_COLOR
      support.
  related-projects:
    - git blame, git log, .mailmap, .git-blame-ignore-revs, Repology, Homebrew
  sources:
    - https://formulae.brew.sh/formula/git-who
    - https://github.com/sinclairtarget/git-who
    - https://github.com/sinclairtarget/git-who/releases
    - https://raw.githubusercontent.com/sinclairtarget/git-who/master/README.md
    - https://repology.org/project/git-who/versions
    - https://sinclairtarget.com/blog/2025/03/who-will-maintain-vim-a-demo-of-git-who/
  summary:
    - >
      git-who is a Go command-line tool that extends the idea of git blame from
      individual lines to whole file trees, components, and repository histories.
  timeline:
    - '2024: Repository created.'
    - '2025: v0.2 was labeled the initial release, followed by signed artifacts in v0.3.'
    - '2025: Maintainer demo showed the tool against the Vim repository.'
    - '2026: v1.3 added NO_COLOR support.'
  usage:
    - >
      Practitioners use git who to identify likely code owners, find the dominant author
      of a path, inspect contribution history for a release range, and visualize
      maintainership changes. The tool respects .mailmap and .git-blame-ignore-revs, and
      it caches per-repository data under XDG_CACHE_HOME.
related-packages: []
category: developer-tools
package-manager:
  brew: git-who
  macports: git-who
  nix: git-who
  zypper: git-who
package-manager-url: https://formulae.brew.sh/formula/git-who
license: MIT
tags:
  - blame
  - cli
  - code-ownership
  - git-extension
description: Git blame for file trees
executables:
  - git-who
provenance:
  formula: git-who
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
