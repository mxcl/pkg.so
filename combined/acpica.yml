id: brew:acpica
display-name: ACPICA
homepage: https://github.com/acpica/acpica
repo: https://github.com/acpica/acpica
docs:
  - >
    https://www.intel.com/content/www/us/en/developer/topic-technology/open/acpica/documentation.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ACPICA has an unusually direct path from upstream package to operating-system
      internals. Intel's overview says ACPICA updates for Linux are provided
      periodically in patch form and that the code is converted and integrated into the
      Linux kernel source. The input package-manager facts show the user-space tools
      packaged across Homebrew, Alpine, Chocolatey, DNF, MacPorts, Arch, and openSUSE.
  package-nerd-significance:
    - >
      ACPICA matters to package nerds because it sits at the boundary between firmware
      specifications, kernel enablement, and user-space diagnostics. Packaging it gives
      developers and distro maintainers reproducible tools for inspecting, compiling,
      and debugging ACPI tables without depending on a full kernel tree.
  project-history:
    - >
      Intel's official ACPICA overview describes ACPICA as a reference implementation of
      the Advanced Configuration and Power Interface specification, written in ANSI C
      for portability across 32-bit and 64-bit operating-system environments. The same
      overview says ACPICA contains both kernel-mode and user-mode components.
    - >
      The official download page says ACPICA is maintained in Git, with commits made as
      individual fixes and features are completed, and provides source packages,
      makefiles, utilities, and release logs. The GitHub repository was created in 2011
      and mirrors the source tree with documents, source, tests, and release tags.
  related-projects:
    - >
      Related projects include the ACPI specification, Linux ACPI subsystem work,
      firmware/BIOS development workflows, iASL, acpidump, acpiexec, and ACPI table
      debugging tools.
  sources:
    - >
      Intel overview, download and documentation pages, GitHub repository/release
      metadata, and source_facts.package-manager.
  summary:
    - >
      ACPICA is the ACPI Component Architecture project, an open-source,
      operating-system-independent implementation of the ACPI specification. It includes
      kernel-resident ACPI components and user-space utilities such as iASL, acpidump,
      acpiexec, acpixtract, and related tools.
  timeline:
    - '2011-08-08: GitHub repository created.'
    - '2015-06-16: GitHub tag R061615 appears in the repository tag list.'
    - '2021: Intel overview references ACPICA version 20210331 in documentation text.'
    - '2024-12-12: ACPICA release R2024_12_12 published on GitHub.'
    - '2026-04-08: ACPICA Release version 20260408 published.'
  usage:
    - >
      Package users most often encounter ACPICA through command-line utilities: iASL
      compiles and disassembles ACPI Source Language and AML, acpidump obtains ACPI
      tables, acpixtract extracts tables, and acpiexec helps exercise AML execution. The
      GitHub source tree's compiler help documents iASL options for compiling,
      disassembling, generating listings, and creating table templates.
related-packages: []
category: system
