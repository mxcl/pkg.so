id: brew:calcurse
display-name: calcurse
homepage: https://calcurse.org/
repo: https://git.calcurse.org/calcurse.git
docs:
  - https://calcurse.org/files/manual.html
  - https://calcurse.org/devel
  - https://calcurse.org/files/calcurse-caldav.html
config-file-location:
  unix:
    - ~/.config/calcurse/conf
    - ~/.config/calcurse/keys
    - ~/.calcurse/conf
    - ~/.calcurse/keys
    - ~/.calcurse/caldav/config
credentials-file-location:
  unix: ~/.calcurse/caldav/config
history:
  adoption-history:
    - >
      calcurse became popular among terminal-first users who wanted a lightweight
      alternative to graphical calendar applications and web services. The official site
      explicitly highlights command-line options suitable for scripts, version-control
      hooks for calendar data, and CalDAV synchronization for mobile-device
      interoperability.
    - >
      Its package-manager footprint is broad for a small TUI application, appearing in
      Homebrew and major Linux distributions because it has few conceptual moving parts:
      install the binary, keep data in user config/data directories, and automate around
      text-friendly commands.
  package-nerd-significance:
    - >
      calcurse matters because it is a rare survivor in the terminal organizer category:
      small enough to package everywhere, practical enough to replace a GUI calendar for
      some users, and scriptable enough to participate in Unix workflows.
    - >
      For package nerds, the interesting history is its evolution from a 2005 curses
      calendar into a tool with iCalendar, CalDAV, hooks, vdir-style workflows, and
      distribution packaging without losing the command-line-first model.
  project-history:
    - >
      The official site describes calcurse as a command-line calendar and scheduling
      application for events, appointments, and everyday tasks, with a configurable
      notification system and a curses interface. Its release notes begin with version
      1.0 on 8 October 2005 and continue through modern 4.x releases.
    - >
      Over time calcurse added recurring appointments, internationalization, UTF-8
      support, import/export, user-configurable key bindings, hooks, CalDAV support, and
      command-line filtering/formatting. Version 4.0.0 in 2015 marks a later
      modernization point in the release stream, while 4.8.x releases in the 2020s show
      continued maintenance.
  related-projects:
    - >
      Related tools include remind, khal, vdirsyncer, abook, mutt/neomutt calendar
      workflows, taskwarrior, todoman, pcal, and iCalendar/CalDAV servers. calcurse is
      distinct because it combines an interactive curses UI with useful non-interactive
      commands.
  sources:
    - https://calcurse.org/
    - https://calcurse.org/devel
    - https://calcurse.org/files/calcurse-caldav.html
    - https://calcurse.org/files/changes.html
    - https://calcurse.org/files/manual.html
  summary:
    - >
      calcurse is a curses-based personal organizer for the command line, combining
      calendar, appointments, TODOs, notifications, iCalendar import/export,
      scripting-friendly output, and later CalDAV synchronization. It is a classic Unix
      productivity package: terminal UI first, plain local data, and automation hooks.
  timeline:
    - '2005: calcurse 1.0 released on 8 October 2005.'
    - '2008: calcurse 2.0 released on 2 March 2008.'
    - '2012: calcurse 3.0.0 released on 1 July 2012.'
    - '2015: calcurse 4.0.0 released on 22 February 2015.'
    - '2020: calcurse 4.7.0 released with continued 4.x maintenance.'
    - '2022: calcurse 4.8.0 released.'
    - '2025: calcurse 4.8.2 listed as the current source download on the official site.'
  usage:
    - >
      Users run `calcurse` for the full-screen TUI, `calcurse-caldav` for
      synchronization, and helper tools such as `calcurse-upgrade` or `calcurse-vdir`
      for data migration and vdir workflows. It is often used locally with cron, shell
      scripts, mail notifications, and version control hooks.
    - >
      The package stores user configuration and key bindings in calcurse config files,
      while CalDAV credentials are typically kept in the caldav config file, making the
      credential path relevant for audits and backup tooling.
related-packages:
  - id: brew:khal
    reason: >
      Choose khal for a standards-based vdir/iCalendar calendar designed to pair with an
      external synchronizer; choose calcurse for an integrated curses organizer with
      tasks, notifications, and its own CalDAV helper.
    rel: alternative
    sources:
      - https://calcurse.org/files/manual.html
      - https://calcurse.org/files/calcurse-caldav.html
      - https://khal.readthedocs.io/en/latest/
  - id: brew:vdirsyncer
    reason: >
      Use vdirsyncer to synchronize server calendars into local vdir collections that
      can participate in calcurse's documented `calcurse-vdir` import/export workflow.
    rel: adjacent_workflow
    sources:
      - https://calcurse.org/files/changes.html
      - https://vdirsyncer.pimutils.org/en/stable/
category: productivity
