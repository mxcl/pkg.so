id: brew:chapel
display-name: Chapel
homepage: https://chapel-lang.org/
repo: https://github.com/chapel-lang/chapel
docs:
  - https://chapel-lang.org/docs
  - https://chapel-lang.org/docs/language/spec/language-overview.html
  - https://chapel-lang.org/learn
config-file-location:
  unix:
    - $CHPL_CONFIG/chplconfig
    - $CHPL_CONFIG/.chplconfig
    - ~/chplconfig
    - ~/.chplconfig
    - $CHPL_HOME/chplconfig
    - $CHPL_HOME/.chplconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      Chapel moved from an HPC research language into a routinely released open-source
      language runtime and compiler. The GitHub release stream shows semiannual 1.x
      releases by 2014 and quarterly-style 2.x releases by 2024-2026, while the supplied
      package facts show distribution through Homebrew, Fedora/DNF, and MacPorts.
  package-nerd-significance:
    - >
      Chapel matters to package nerds because it is a full language distribution rather
      than a single utility: compiler, runtime, language server, documentation
      generator, package tooling, and configuration-file discovery all arrive through a
      package-manager install.
  project-history:
    - >
      Chapel was developed as a high-performance parallel programming language,
      historically associated with Cray and now maintained openly under the chapel-lang
      organization. The official README describes a portable language intended for CPUs
      and GPUs from desktops to supercomputers.
  related-projects:
    - Mason is Chapel's package/build tool and is installed with the Homebrew formula.
    - >
      The Chapel project is listed by its README alongside the High Performance Software
      Foundation and Linux Foundation branding.
  sources:
    - https://github.com/chapel-lang/chapel#readme
    - https://chapel-lang.org/docs
    - https://chapel-lang.org/download/
    - https://formulae.brew.sh/formula/chapel
  summary:
    - >
      Chapel is a parallel programming language and compiler toolchain for productive
      computing at scale, designed for laptops, clusters, cloud systems, GPUs, and
      supercomputers.
  timeline:
    - >
      2014: chapel-lang/chapel public GitHub repository created and 1.10.0 GitHub
      release published.
    - '2015: 1.11.0 and 1.12.0 releases continued the regular open release cadence.'
    - '2024: Chapel 2.x release series was underway.'
    - '2026: Chapel 2.9.0 released as the Summer 2026 release.'
  usage:
    - >
      Users compile Chapel programs with `chpl`; the Homebrew package also installs
      developer tools such as `chpldoc`, `chplcheck`, `chpl-language-server`, and Mason,
      Chapel's package/build tool.
related-packages: []
category: language-runtime
package-manager:
  brew: chapel
  dnf: chapel
  macports: chapel
package-manager-url: https://formulae.brew.sh/formula/chapel
license: Apache-2.0
tags:
  - cli
  - compiler
  - distributed-computing
  - gpu
  - hpc
  - parallel-computing
  - programming-language
  - scientific-computing
description: Programming language for productive parallel computing at scale
executables:
  - chpl
  - chpl-language-server
  - chpl-shim
  - chplcheck
  - chpldoc
  - chplrun-udp
  - mason
provenance:
  formula: chapel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
