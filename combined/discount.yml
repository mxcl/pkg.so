id: brew:discount
display-name: Discount
homepage: https://www.pell.portland.or.us/~orc/Code/discount/
repo: https://github.com/Orc/discount
docs:
  - https://www.pell.portland.or.us/~orc/Code/discount
  - https://www.pell.portland.or.us/~orc/Code/discount/api.html
  - https://www.pell.portland.or.us/~orc/Code/discount/program.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Discount became useful to package collections because it offered Markdown as a
      small C library and CLI rather than only as a script. The official site continues
      to ship release tarballs, including the 3.0 series and maintained 2.2 series.
  package-nerd-significance:
    - >
      Package nerds care about Discount because it is a native-code Markdown
      implementation with a stable tarball culture, command-line tooling, and library
      API: exactly the sort of small C dependency that shows up in Unix packaging
      graphs.
  project-history:
    - >
      The official site describes Discount as a C implementation of Markdown, positioned
      against the many scripting-language Markdown implementations of its era. It
      provides a library, command-line programs, examples, and extensions such as
      smartypants-style substitutions and extra list syntax.
  related-projects:
    - >
      The official site roots Discount in John Gruber's Markdown and notes behavior
      related to Smartypants and Markdown Extra-style syntax.
  sources:
    - https://www.pell.portland.or.us/~orc/Code/discount
    - https://www.pell.portland.or.us/~orc/Code/discount/api.html
    - https://www.pell.portland.or.us/~orc/Code/discount/program.html
    - https://github.com/Orc/discount
  summary:
    - >
      Discount is Jessica L. Parsons' C implementation of John Gruber's Markdown markup
      language.
  timeline:
    - '2010: GitHub repository created.'
    - '2025: Command-line documentation generated for the 3.0 series.'
    - '2026: Discount 3.0.1.3 released.'
  usage:
    - >
      The command-line documentation describes a markdown program that reads Markdown
      and writes HTML or a parse-tree outline. The API documentation makes it useful for
      embedding Markdown conversion in C programs, while the command-line tools fit
      scripting and static-site workflows.
related-packages:
  - id: brew:cmark
    reason: >
      Choose cmark when standards-oriented CommonMark parsing is more important than
      Discount's original-Markdown compatibility and extensions; cmark provides a C
      library, AST API, and multi-format CLI.
    rel: alternative
    sources:
      - https://www.pell.portland.or.us/~orc/Code/discount/
      - https://github.com/commonmark/cmark
  - id: brew:lowdown
    reason: >
      Choose lowdown when the workflow needs Markdown rendered to terminal, roff, LaTeX,
      Gemini, or OpenDocument formats in addition to HTML.
    rel: alternative
    sources:
      - https://www.pell.portland.or.us/~orc/Code/discount/
      - https://kristaps.bsd.lv/lowdown/
category: developer-tools
package-manager:
  apk: discount
  brew: discount
  debian: discount
  dnf: discount
  macports: discount
  nix: discount
  pacman: discount
  ubuntu: discount
  zypper: discount
package-manager-url: https://formulae.brew.sh/formula/discount
license: BSD-3-Clause
tags:
  - c
  - cli
  - html
  - library
  - markdown
  - markup
description: C implementation of Markdown
executables:
  - makepage
  - mkd2html
  - theme
provenance:
  formula: discount
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
