id: brew:duktape
display-name: Duktape
homepage: https://duktape.org
repo: https://github.com/svaarala/duktape
docs:
  - https://duktape.org/api.html
  - https://duktape.org/guide.html
  - https://wiki.duktape.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Duktape's own site points to projects using it and to Stack Overflow community
      support, while its package presence spans Homebrew, Debian, Fedora, MacPorts, Nix,
      Arch, Alpine, Ubuntu, and openSUSE-family packaging. Its GitHub repository also
      shows thousands of stars and a long development history, which is notable for a
      small embeddable engine.
    - >
      Adoption tends to come from applications needing scripting, configuration logic,
      plugins, tests, or embedded automation in a C or C++ host. The guide emphasizes
      that Duktape makes few platform assumptions and leaves native bindings under
      application control, which made it attractive for constrained or custom
      environments.
  package-nerd-significance:
    - >
      Duktape is significant because it occupies the small-engine end of the JavaScript
      runtime map. Package maintainers care about it as a portable C library with a
      permissive license, a stable release archive, and a footprint small enough for
      embedded systems.
    - >
      It is also a useful point of comparison against QuickJS, MuJS, JerryScript,
      Espruino, and v7. Those engines all answer the same broad question - how small and
      embeddable can JavaScript be - with different tradeoffs around standards coverage,
      performance, licensing, and host integration.
  project-history:
    - >
      Duktape's public release archive starts in September 2013 with alpha releases
      focused on the public API, portability, and ES5.1 behavior. Version 1.0.0 arrived
      on October 26, 2014 as the stable baseline release.
    - >
      The 1.x series added low-memory improvements, debugger support, typed arrays,
      duk_config.h, module.exports behavior, performance work, suspend/resume support,
      and continued maintenance. These releases established Duktape as a compact
      embeddable runtime rather than a browser engine.
    - >
      Duktape 2.0.0 was released on January 2, 2017 with buffers, ES2015 improvements,
      performance work, and footprint changes. Later 2.x releases added API
      improvements, CBOR support, Unicode and portability updates, and maintenance
      fixes, with 2.7.0 released on February 19, 2022.
    - >
      The upstream GitHub README notes that the master branch is undergoing incompatible
      changes for Duktape 3.x and that Duktape 2.x is tracked on the v2-maintenance
      branch. That split reflects a mature runtime balancing maintenance users with
      future internal changes.
  related-projects:
    - >
      QuickJS, MuJS, JerryScript, Espruino, v7, tiny-js, and quad-wheel are listed by
      Duktape as similar engines for compact or embeddable JavaScript use cases.
    - >
      V8 and SpiderMonkey are larger JavaScript engines that are often unsuitable when
      Duktape's compact single-source embedding model is the requirement.
    - >
      Lua is a frequent embedded-scripting comparison point, and the Duktape guide
      explicitly includes a comparison-to-Lua section.
  sources:
    - https://duktape.org/
    - https://duktape.org/download
    - https://duktape.org/guide
    - https://duktape.org/api
    - https://wiki.duktape.org/projectsusingduktape
    - https://github.com/svaarala/duktape
    - https://formulae.brew.sh/formula/duktape
  summary:
    - >
      Duktape is an embeddable ECMAScript engine for C and C++ programs, designed around
      portability, compact footprint, and simple integration by adding the distributable
      C and header files to an application build. It is one of the better-known small
      JavaScript engines used when V8 or SpiderMonkey are too large or too
      embedding-heavy.
  timeline:
    - '2013: 0.6.0 alpha released with first public API work.'
    - '2014: 1.0.0 released as the stable baseline.'
    - >
      2015: 1.2.0 added debugger and script-timeout support; 1.3.0 added typed arrays
      and duk_config.h.
    - '2016: 1.5.0 added low-memory and debugger improvements; 1.6.0 added suspend/resume.'
    - '2017: 2.0.0 released with buffers, ES2015 improvements, performance, and footprint work.'
    - '2018: 2.3.0 included ES2015 improvements.'
    - '2019: 2.5.0 added CBOR support and other improvements.'
    - '2022: 2.7.0 released as a maintenance-focused 2.x release.'
  usage:
    - >
      Embedding usually means adding duktape.c, duktape.h, and duk_config.h to the host
      build, creating a heap, and using the C API to call ECMAScript from C or expose C
      functions to script code. The command-line duk executable is useful for quick
      testing, but the package's main value is as a library.
    - >
      Duktape implements ES5/E5.1 with selected later semantics and partial
      ES2015/ES2016 features. Its feature set includes typed arrays, Node.js Buffer
      bindings, WHATWG Encoding API bindings, CBOR bindings, a debugger, Unicode
      support, coroutines, bytecode dump/load, finalization, and low-memory
      configuration options.
related-packages:
  - id: brew:quickjs
    reason: >
      Choose QuickJS when a compact embeddable engine with newer ECMAScript coverage and
      the qjsc compiler is more important than Duktape's ES5-oriented compatibility and
      stack API.
    rel: alternative
    sources:
      - https://duktape.org/guide.html
      - https://bellard.org/quickjs/quickjs.html
  - id: brew:mujs
    reason: >
      Choose MuJS for a particularly small ES5 interpreter with a Lua-like C interface
      and a default sandboxed design.
    rel: alternative
    sources:
      - https://duktape.org/guide.html
      - https://mujs.com/introduction.html
  - id: brew:jerryscript
    reason: >
      Choose JerryScript when the target is a severely memory-constrained IoT or
      microcontroller environment and footprint is the primary constraint.
    rel: alternative
    sources:
      - https://duktape.org/guide.html
      - https://jerryscript.net/
category: language-runtime
