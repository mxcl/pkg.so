id: brew:jsonfmt
display-name: jsonfmt
homepage: https://github.com/caarlos0/jsonfmt
repo: https://github.com/caarlos0/jsonfmt
docs:
  - https://github.com/caarlos0/jsonfmt#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is practical and small-scale: Homebrew, Docker, apt/yum repository
      instructions, deb/rpm packages, and manual binaries are documented by the project.
      The intended users are teams that want JSON formatting in CI or pre-commit
      workflows without pulling in a larger JavaScript formatter stack.
  package-nerd-significance:
    - >
      jsonfmt is notable as a minimal native alternative to general-purpose formatters.
      Its charm is that it mostly packages a standard-library behavior into a
      predictable CLI, which is exactly the sort of small tool package managers are good
      at preserving.
  project-history:
    - >
      Carlos Becker introduced jsonfmt in a November 12, 2018 blog post after needing
      consistent JSON formatting for a Chef-heavy project. The post describes rejecting
      heavier or awkward alternatives, then arriving at Go's standard `json.Indent` as
      the simple implementation core.
    - >
      The GitHub repository was created in November 2018 and packages the formatter as a
      small static CLI with release artifacts for several installation paths.
  related-projects:
    - >
      jsonfmt is related to gofmt by naming and workflow, to jq and Prettier as
      alternative JSON formatting options, and to Go's `encoding/json` package through
      its implementation approach.
  sources:
    - https://api.github.com/repos/caarlos0/jsonfmt
    - https://carlosbecker.com/posts/jsonfmt/
    - https://formulae.brew.sh/formula/jsonfmt
    - https://github.com/caarlos0/jsonfmt
    - https://github.com/caarlos0/jsonfmt/releases
  summary:
    - >
      jsonfmt is a Go command-line formatter for JSON files, explicitly modeled as
      `gofmt` for JSON.
  timeline:
    - '2018-11-07: The GitHub repository was created.'
    - '2018-11-12: The author published the `Keeping json files formatted` post.'
    - >
      2018-11-12: The blog documented Homebrew, Snapcraft, Docker, deb/rpm, and manual
      installation routes.
    - '2026-06-02: GitHub repository metadata showed ongoing repository activity.'
  usage:
    - >
      The README documents `jsonfmt` for checking and `jsonfmt -w` for rewriting files.
      Becker's blog describes using `jsonfmt -w` locally and plain `jsonfmt` in CI so
      formatting drift fails the build.
related-packages:
  - id: brew:prettier
    reason: >
      Choose Prettier for consistent formatting across JSON and many source or markup
      languages; choose jsonfmt for a small native, JSON-only gofmt-style checker and
      rewriter.
    rel: alternative
    sources:
      - https://carlosbecker.com/posts/jsonfmt/
      - https://prettier.io/docs/
  - id: brew:jq
    reason: >
      Choose jq when formatting is part of a broader JSON filtering or transformation
      pipeline; choose jsonfmt when you only need repository-wide formatting checks and
      in-place rewrites.
    rel: alternative
    sources:
      - https://carlosbecker.com/posts/jsonfmt/
      - https://jqlang.org/
category: developer-tools
package-manager:
  brew: jsonfmt
  nix: jsonfmt
package-manager-url: https://formulae.brew.sh/formula/jsonfmt
license: MIT
tags:
  - cli
  - formatter
  - gofmt-style
  - json
description: Like gofmt, but for JSON files
executables:
  - jsonfmt
provenance:
  formula: jsonfmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
