id: brew:lunarr
display-name: Lunarr
homepage: https://github.com/lunarr-app/lunarr-go
repo: https://github.com/lunarr-app/lunarr-go
docs:
  - https://github.com/lunarr-app/lunarr-go/blob/main/docs/configuration.md
  - https://github.com/lunarr-app/lunarr-go/blob/main/docs/getting-started.md
  - https://github.com/lunarr-app/lunarr-go/blob/main/docs/libraries.md
  - https://github.com/lunarr-app/lunarr-go#readme
config-file-location:
  unix: ./.env
credentials-file-location:
  unix: <LUNARR_DATA_DIR>/auth-secret
history:
  adoption-history:
    - >
      Lunarr is primarily deployed as a Docker service with persistent application data
      and optional media mounts. The project also documents source-based local
      development and a production Node server workflow.
  package-nerd-significance:
    - >
      For self-hosting enthusiasts, Lunarr is a compact media-server package whose
      runtime state is easy to isolate: configuration comes from environment variables
      or a project .env file, while a single data directory contains the SQLite database
      and playback caches.
  project-history:
    - >
      The official repository was created in 2023 and developed as a headless,
      self-hosted alternative to proprietary media-library servers. The current
      application provides a web interface and keeps persistent state in SQLite.
  related-projects:
    - >
      The project positions itself in the same self-hosted media-server space as Plex,
      Jellyfin, and Emby, and integrates with TMDb, FFmpeg, Chromecast, AirPlay, SFTP,
      and WebDAV.
  sources:
    - https://github.com/lunarr-app/lunarr-go#readme
    - https://github.com/lunarr-app/lunarr-go/blob/main/docs/configuration.md
    - https://github.com/lunarr-app/lunarr-go/blob/main/docs/getting-started.md
  summary:
    - >
      Lunarr is a self-hosted media server for movie and television libraries stored on
      local disks, SFTP, or WebDAV. It combines metadata matching, direct streaming, HLS
      transcoding, user management, and browser-based administration.
  timeline:
    - '2023-04: The official Lunarr repository was created.'
    - >
      2026: Official documentation described Docker deployment, SQLite persistence,
      local/SFTP/WebDAV libraries, and direct or transcoded playback.
  usage:
    - >
      Administrators mount or connect movie and TV libraries, configure TMDb metadata,
      create users and roles, and trigger scans. Playback can use direct streaming or
      on-the-fly HLS transcoding with FFmpeg, including Chromecast and AirPlay targets.
related-packages:
  - id: cask:jellyfin
    reason: >
      Choose Jellyfin for a larger community-developed, fully free-software media-server
      ecosystem with numerous official clients; choose Lunarr for its newer, compact
      movie-and-TV-focused server and local, SFTP, or WebDAV library support.
    rel: alternative
    sources:
      - https://github.com/lunarr-app/lunarr-go
      - https://jellyfin.org/docs/general/about/
  - id: cask:plex-media-server
    reason: >
      Plex Media Server is the proprietary, account-connected alternative that Lunarr
      explicitly positions itself against; choose Plex when its broad commercial client
      ecosystem and remote-access service are more important than Lunarr's open
      self-hosted design.
    rel: alternative
    sources:
      - https://github.com/lunarr-app/lunarr-go
      - https://support.plex.tv/articles/200264746-quick-start-step-by-step-guides/
  - id: brew:ffmpeg
    reason: >
      Lunarr uses FFmpeg for media probing and on-the-fly HLS transcoding, so the FFmpeg
      package is the directly documented media-processing component for non-direct-play
      content.
    rel: adjacent_workflow
    sources:
      - https://github.com/lunarr-app/lunarr-go
      - https://ffmpeg.org/about.html
category: media
package-manager:
  brew: lunarr
package-manager-url: https://formulae.brew.sh/formula/lunarr
license: Apache-2.0
