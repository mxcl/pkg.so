id: brew:circleci
display-name: CircleCI CLI
homepage: https://cli.circleci.com
repo: https://github.com/CircleCI-Public/circleci-cli
docs:
  - https://circleci.com/docs/guides/toolkit/local-cli
  - https://circleci.com/docs/how-to-use-the-circleci-local-cli
config-file-location:
  unix: ~/.circleci/cli.yml
credentials-file-location:
  unix: ~/.circleci/cli.yml
history:
  adoption-history:
    - >
      CircleCI's docs recommend package managers for most installations and document
      Homebrew for macOS, Snap for Linux, Chocolatey for Windows, manual GitHub release
      downloads, and a curl-based installer. The README adds winget and a CircleCI tap
      for preview builds.
    - >
      Homebrew currently packages stable v0.1.38646 from the official Git repository and
      reports thousands of 90-day install-on-request events, reflecting routine
      developer-tool usage among CircleCI users.
  package-nerd-significance:
    - >
      CircleCI CLI is important to package-manager culture because it is the local
      companion binary for a hosted CI/CD platform. Its packaging has to track both
      stable and preview channels, multiple OS package managers, authentication setup,
      and a fast-moving cloud API surface.
  project-history:
    - >
      The CircleCI-Public/circleci-cli repository was created in June 2018. CircleCI's
      installation docs identify it as the newer open-source CLI and include migration
      instructions for users who had the old CLI installed before October 2018.
    - >
      The current main-branch README states that main tracks a preview rewrite and that
      the stable CLI remains separately installable. That same README describes the v1
      preview as a ground-up rewrite with run, deploy, workflow, pipeline, envvar,
      JSON-output, shell-completion, and MCP support.
  related-projects:
    - circleci/local-cli is the old CLI referenced by CircleCI's upgrade instructions.
    - CircleCI orbs and the orb development kit are major workflows exposed through the CLI.
    - FYAML is the configuration packing scheme linked from CircleCI CLI docs.
    - >
      CircleCI's VS Code extension is presented in the docs as another way to validate
      CircleCI configuration.
  sources:
    - https://circleci.com/docs/guides/toolkit/local-cli/
    - https://circleci.com/docs/guides/toolkit/how-to-use-the-circleci-local-cli/
    - https://github.com/CircleCI-Public/circleci-cli#readme
    - https://api.github.com/repos/CircleCI-Public/circleci-cli
    - https://api.github.com/repos/CircleCI-Public/circleci-cli/releases
    - https://formulae.brew.sh/api/formula/circleci.json
  summary:
    - >
      CircleCI CLI is CircleCI's official command-line interface for validating and
      processing configuration, running local jobs, querying CircleCI APIs, managing
      orbs and contexts, and, in newer preview builds, managing runs, workflows,
      deployments, environment variables, and MCP integration.
  timeline:
    - '2018-06-19: CircleCI-Public/circleci-cli repository created.'
    - >
      2018-10: CircleCI docs describe switching users from the pre-October-2018 legacy
      CLI to the newer open-source CLI.
    - '2026: Main branch README documents a preview v1 rewrite.'
    - '2026-06-29: GitHub releases include v1.0 preview builds.'
    - '2026: Homebrew packages stable v0.1.38646.'
  usage:
    - >
      Official docs emphasize validating .circleci/config.yml before pushing, processing
      and packing configs, running local jobs in containers, managing orbs, managing
      contexts, and using an API token generated from CircleCI account settings during
      setup.
related-packages: []
category: developer-tools
package-manager:
  brew: circleci
package-manager-url: https://formulae.brew.sh/formula/circleci
license: MIT
tags:
  - ci-cd
  - circleci
  - cli
  - configuration-validation
  - local-builds
description: Official command-line tool for CircleCI
executables:
  - circleci
provenance:
  formula: circleci
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
