id: brew:json-glib
display-name: JSON-GLib
homepage: https://wiki.gnome.org/Projects/JsonGlib
repo: https://gitlab.gnome.org/GNOME/json-glib
docs:
  - https://gnome.pages.gitlab.gnome.org/json-glib
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Because JSON-GLib is part of the GNOME platform stack, it is packaged broadly
      across Linux distributions and also appears in Homebrew, MacPorts, Nix, and other
      package managers. Its GObject Introspection support made the same JSON library
      available to language bindings, not only to C applications.
  package-nerd-significance:
    - >
      JSON-GLib is the package that tells you a desktop stack has JSON support at the
      platform-library layer. For packagers, it is a small but widely depended-on C
      library with GIR metadata, pkg-config files, command-line tools, and the usual
      GNOME release engineering expectations.
  project-history:
    - >
      JSON-GLib was written by Emmanuele Bassi and is licensed under LGPL-2.1-or-later.
      The project documentation describes a DOM-like API for parsing and generating JSON
      plus GObject serialization and deserialization for GLib applications.
    - >
      Early releases in 2007 established the parser, generator, and GObject
      deserialization work. Version 0.10.0 added more complete GObject and GBoxed
      serialization, insertion-order guarantees, and introspection data. Version 1.0 in
      2014 stabilized the API generation, bumped the GLib dependency, and added
      command-line tools for validation and formatting.
  related-projects:
    - >
      JSON-GLib is closely related to GLib, GObject, GIO, GObject Introspection, GTK,
      and GNOME applications. It occupies a different niche from json-c and Jansson by
      integrating JSON with the GObject type system and GLib data conventions.
  sources:
    - https://gitlab.gnome.org/GNOME/json-glib
    - https://gitlab.gnome.org/GNOME/json-glib/-/blob/master/NEWS
    - https://gitlab.gnome.org/GNOME/json-glib/-/blob/master/README.md
    - https://gnome.pages.gitlab.gnome.org/json-glib
    - https://groups.google.com/g/mailing.gnome.announce/c/JoqnaR9gA7s
    - https://lwn.net/Articles/258532/
    - https://wiki.gnome.org/Projects/JsonGlib
  summary:
    - >
      JSON-GLib is GNOME's GLib/GObject JSON parser and generator library, with small
      command-line tools for formatting and validating JSON. It matters because it made
      JSON feel native inside the C/GObject stack used by GTK and GNOME applications.
  timeline:
    - >
      2007: JSON-GLib 0.4.0 is announced as a GObject-based C library for parsing and
      writing JSON streams.
    - >
      2010: JSON-GLib 0.10.0 adds broader serialization/deserialization support and
      introspection improvements.
    - >
      2011: JSON-GLib 0.12.0 adds JsonBuilder, JsonReader, stream APIs, surrogate-pair
      support, and a GObject-Introspection dependency.
    - '2014: JSON-GLib 1.0 is announced after years of 0.x development.'
    - '2017: JSON-GLib 1.2 adds Meson build support and immutable JSON node support.'
    - >
      2020: JSON-GLib 1.6 moves API reference generation to gi-docgen and adds
      `json-glib-format --output`.
  usage:
    - >
      Developers link against `json-glib-1.0`, include `json-glib/json-glib.h`, and use
      parser, generator, builder, reader, object, array, and node APIs. Packagers also
      ship `json-glib-format` and `json-glib-validate`, which provide quick command-line
      formatting and validation.
related-packages:
  - id: brew:yajl
    reason: >
      YAJL is an alternative C JSON library for applications that favor incremental
      callback-based parsing and a small representation-independent core over
      JSON-GLib's GObject-integrated tree and serialization APIs.
    rel: alternative
    sources:
      - https://gnome.pages.gitlab.gnome.org/json-glib/
      - https://lloyd.github.io/yajl/
category: developer-tools
