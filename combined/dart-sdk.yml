id: brew:dart-sdk
display-name: Dart SDK
homepage: https://dart.dev
repo: https://github.com/dart-lang/sdk
docs:
  - https://dart.dev/guides
  - https://dart.dev/tools/sdk
config-file-location:
  unix:
    - pubspec.yaml
    - pubspec_overrides.yaml
credentials-file-location:
  linux:
    - $XDG_CONFIG_HOME/dart/pub-tokens.json
    - ~/.config/dart/pub-tokens.json
  macos: ~/Library/Application Support/dart/pub-tokens.json
  windows: '%APPDATA%\dart\pub-tokens.json'
history:
  adoption-history:
    - >
      Dart SDK adoption is tied closely to Flutter and to Dart's own package ecosystem.
      As Flutter made Dart a mainstream mobile and cross-platform application language,
      installing a current SDK became a routine prerequisite for CI systems, editors,
      and package build environments.
    - >
      Dart 3 reinforced the SDK's package-manager significance by making sound null
      safety and modern language behavior the baseline for new tooling. Formula and
      package updates can therefore affect language compatibility, analyzer behavior,
      package resolution, and generated artifacts.
  package-nerd-significance:
    - >
      The SDK is important to package nerds because it sits at the boundary between
      runtime, compiler, package manager, and language version. A small SDK version
      change can alter pub resolution, compiler output, analyzer diagnostics, and
      compatibility with generated Flutter or server artifacts.
  project-history:
    - >
      Dart was introduced by Google as a structured language for building client
      applications, and the SDK became the standard way to obtain the VM, analyzer,
      compilers, and core command-line tooling. The SDK's role expanded as Dart grew
      from browser-focused ambitions into the runtime and toolchain behind Flutter and
      server-side Dart workflows.
    - >
      The official SDK documentation frames the package as a bundle of libraries and
      command-line tools, including `dart`, `dart analyze`, `dart compile`, and pub
      package management. That makes the SDK more than a runtime package: it is the
      thing downstream packages use to build, test, publish, and execute Dart code.
  related-projects:
    - >
      The Dart SDK is closely related to Flutter, pub.dev packages, the `pub` package
      manager built into the `dart` command, and the `dartaotruntime` tool used for
      running AOT-compiled snapshots.
  sources:
    - https://dart.dev/tools/sdk
    - https://dart.dev/tools/pub/pubspec
    - https://dart.dev/tools/pub/cmd/pub-token
    - https://dart.dev/resources/dart-3-migration
    - https://news.dartlang.org/2013/11/dart-10-stable-sdk-for-structured-web.html
  summary:
    - >
      The Dart SDK is the main distribution of the Dart programming language: the VM,
      compilers, core libraries, package tooling, and command-line tools installed as
      the `dart` command. In package-manager culture it is both a language runtime and
      the gateway to Dart's build, compile, and package workflows.
  timeline:
    - '2013: Dart 1.0 was announced as a stable SDK release.'
    - '2023: Dart 3 made sound null safety and newer language semantics the stable baseline.'
    - >
      Present: The SDK remains the official distribution for Dart command-line tools,
      compilers, VM, and package workflows.
  usage:
    - >
      Typical usage starts with the `dart` command: creating projects, running programs,
      managing dependencies through pub, analyzing code, testing packages, and compiling
      executables or snapshots. Project configuration normally lives in `pubspec.yaml`,
      with local overrides in `pubspec_overrides.yaml` and pub authentication tokens
      stored in the Dart user configuration area.
related-packages:
  - id: brew:dartaotruntime
    reason: >
      Use dartaotruntime on deployment hosts to execute AOT snapshots produced by the
      Dart SDK's `dart compile aot-snapshot` command.
    rel: adjacent_workflow
    sources:
      - https://dart.dev/tools/dartaotruntime
      - https://dart.dev/tools/dart-compile
      - https://dart.dev/tools/sdk
category: language-runtime
package-manager:
  apk: dart-sdk
  brew: dart-sdk
  chocolatey: dart-sdk
  debian: dart-doc
  macports: dart-sdk
  nix: dart
  pacman: dart
  scoop: main/dart
  ubuntu: dart-doc
  winget: Google.DartSDK
package-manager-url: https://formulae.brew.sh/formula/dart-sdk
license: BSD-3-Clause
tags:
  - cli
  - compiler
  - dart
  - programming-language
  - sdk
  - virtual-machine
description: Dart Language SDK, including the VM, dart2js, core libraries, and more
executables:
  - dart
provenance:
  formula: dart-sdk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
