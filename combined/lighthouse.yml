id: brew:lighthouse
display-name: Lighthouse
homepage: https://lighthouse.sigmaprime.io/
repo: https://github.com/sigp/lighthouse
docs:
  - https://lighthouse.sigmaprime.io/
config-file-location:
  unix: ~/.lighthouse/{network}/validators/validator_definitions.yml
credentials-file-location:
  unix:
    - ~/.lighthouse/{network}/validators/**/voting-keystore.json
    - ~/.lighthouse/{network}/secrets/*
    - ~/.lighthouse/{network}/validators/api-token.txt
history:
  adoption-history:
    - >
      Lighthouse was adopted by Ethereum node operators and solo stakers because it
      packaged a beacon node, validator client, validator-account tooling, Docker
      images, and detailed operator documentation in one client family. Distribution
      through Homebrew and other package managers made it unusually easy for Unix users
      to install a consensus client from the same workflow used for ordinary developer
      tools.
  package-nerd-significance:
    - >
      For package maintainers, Lighthouse is a good example of a blockchain daemon that
      is not just a single executable: releases are tied to protocol upgrades, binary
      distribution matters for validators, and operational correctness depends on
      pairing it with the right execution-layer and networking configuration.
  project-history:
    - >
      The project grew out of the multi-client Ethereum 2.0 effort, where independent
      clients were built in several languages to avoid network-level monoculture.
      Lighthouse's identity has remained tied to Rust, security review, fuzzing, and
      operational documentation for validators.
    - >
      The v1.0.0 release on November 24, 2020 marked the transition to a
      production/stable development phase for genesis staking, with mainnet genesis
      state included in the binary. After Ethereum's proof-of-stake chain became
      operational, Lighthouse continued as one of the major consensus-layer
      implementations alongside clients such as Prysm, Teku, Nimbus, and Lodestar.
  related-projects:
    - >
      Lighthouse is related to the ethereum/consensus-specs repository, the Ethereum
      execution clients it must pair with, and other consensus clients including Prysm,
      Teku, Nimbus, and Lodestar. Sigma Prime also maintains Siren, a user interface for
      Lighthouse beacon-node and validator-client installations.
  sources:
    - https://github.com/sigp/lighthouse
    - https://github.com/sigp/lighthouse/releases/tag/v1.0.0
    - https://github.com/sigp/siren
    - https://lighthouse-book.sigmaprime.io/
    - https://lighthouse-book.sigmaprime.io/help_general.html
  summary:
    - >
      Lighthouse is Sigma Prime's Rust implementation of an Ethereum proof-of-stake
      consensus client. It supplies the beacon-node and validator-client software used
      to participate in Ethereum consensus, following the ethereum/consensus-specs work
      rather than defining a separate chain protocol.
  timeline:
    - >
      2020-11-24: Lighthouse v1.0.0 marked the production/stable phase for Ethereum
      mainnet genesis staking.
    - >
      2022: Ethereum's move to proof of stake made consensus clients such as Lighthouse
      part of the normal full-node stack.
    - >
      2026: Lighthouse documentation described it as an Ethereum consensus client
      implementing the ethereum/consensus-specs repository.
  usage:
    - >
      Typical usage is running a Lighthouse beacon node beside an Ethereum execution
      client, then running a validator client for staking keys when the operator is
      validating. The command-line surface also includes account and validator
      utilities, making the package relevant both to long-running infrastructure and to
      one-off validator administration.
related-packages:
  - id: brew:ethereum
    reason: >
      Geth supplies the execution layer that Lighthouse connects to through the
      authenticated Engine API, so the two packages form a complete proof-of-stake
      Ethereum node.
    rel: adjacent_workflow
    sources:
      - https://geth.ethereum.org/docs/getting-started/consensus-clients
      - https://lighthouse-book.sigmaprime.io/run_a_node.html
  - id: brew:teku
    reason: >
      Teku is a Java-based alternative Ethereum consensus client; choose it instead of
      the Rust-based Lighthouse when Java deployment or the Consensys ecosystem is a
      better operational fit.
    rel: alternative
    sources:
      - https://docs.teku.consensys.io/introduction
      - https://lighthouse.sigmaprime.io/
category: networking
package-manager:
  apk: lighthouse
  brew: lighthouse
  nix: lighthouse
package-manager-url: https://formulae.brew.sh/formula/lighthouse
license: Apache-2.0
tags:
  - blockchain
  - cli
  - consensus-client
  - ethereum
  - rust
description: Rust Ethereum 2.0 Client
executables:
  - lighthouse
provenance:
  formula: lighthouse
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
