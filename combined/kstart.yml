id: brew:kstart
display-name: kstart
homepage: https://www.eyrie.org/~eagle/software/kstart/
repo: https://git.eyrie.org/git/kerberos/kstart.git
docs:
  - https://www.eyrie.org/~eagle/software/kstart
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      kstart's adoption is strongest in Kerberos-heavy Unix environments: servers, cron
      jobs, daemons, batch jobs, and AFS sites where ticket renewal should be handled
      outside the application. The project page links Debian packages and Debian package
      tracking, reflecting its place as a small infrastructure utility rather than an
      end-user application.
  package-nerd-significance:
    - >
      kstart is a classic sysadmin package: small, security-sensitive, low-glamour, and
      essential in the places that need it. Its value is that it makes Kerberos ticket
      lifetime management scriptable and separable from the services that consume those
      tickets.
  project-history:
    - >
      The Eyrie documentation describes k5start as a modified version of kinit that can
      obtain credentials from a keytab, run as a daemon, refresh credentials
      periodically, and optionally obtain AFS tokens. krenew shares much of the role but
      renews an existing renewable ticket cache rather than obtaining new tickets from a
      password or keytab.
  related-projects:
    - >
      Related projects include MIT Kerberos, Heimdal, kinit, AFS aklog, afslog, OpenAFS,
      and Debian Kerberos packaging.
  sources:
    - https://git.eyrie.org/git/kerberos/kstart.git
    - https://packages.debian.org/search?keywords=kstart
    - https://www.eyrie.org/~eagle/software/kstart/
  summary:
    - >
      kstart is Russ Allbery's Kerberos helper package containing k5start and krenew,
      modified kinit-like tools for obtaining, renewing, and maintaining Kerberos ticket
      caches for long-running processes.
  timeline:
    - '2021-08-31: kstart 4.3 was released.'
    - >
      2021-08-31: The project page listed tar.gz and tar.xz release archives plus PGP
      signatures.
    - >
      2021: The documentation described MIT Kerberos and Heimdal as the thoroughly
      tested Kerberos libraries on Debian.
  usage:
    - >
      Administrators use k5start to run a command with keytab-backed credentials and
      keep its ticket cache alive, or to run a daemon that refreshes credentials. Users
      use krenew when a renewable ticket cache exists and a long-running command needs
      renewal without storing a keytab.
related-packages: []
category: security
