history:
  adoption-history:
    - >
      Finbar is distributed as a paid native Mac application and has received regular
      releases since at least 2022. Its official release history records continuing
      adaptation to macOS releases and incremental expansion of search, browsing,
      scripting, and customization features.
  package-nerd-significance:
    - >
      Finbar turns a small piece of macOS interface—the active application's menu
      hierarchy—into a keyboard-driven command palette. Its bundled command-line tool
      and support for user-provided shell scripts and AppleScripts make it useful at the
      boundary between graphical productivity software and desktop automation.
    - >
      For Homebrew users, the cask provides a repeatable installation path for a
      proprietary Mac utility that would otherwise be downloaded directly from its
      developer.
  project-history:
    - >
      Developer Roey Biran created Finbar to improve on macOS's built-in menu search,
      adding fuzzy matching, recent-item ranking, rule-based filtering, keyboard
      navigation, and extensibility while retaining a native AppKit implementation.
    - >
      Later releases added a bundled command-line interface, revised the interface
      around command-palette conventions, introduced hierarchy-preserving outline
      search, and added customizable themes.
  related-projects:
    - 'macOS menu-bar search: The built-in facility that Finbar extends.'
    - 'finbar-cli: The command-line executable bundled inside Finbar.app.'
    - 'Syphon: Another macOS productivity application published by the same developer.'
  sources:
    - 'Official overview: https://www.finbarapp.com/'
    - 'Official release notes: https://www.finbarapp.com/release-notes'
    - 'Official user guide: https://www.finbarapp.com/help'
  summary:
    - >
      Finbar is a native macOS utility that searches and browses the active
      application's menus using fuzzy matching, recent-item ranking, filters, and
      keyboard navigation.
  timeline:
    - '2022-12-05: The official release history records Finbar 1.1.'
    - '2023-03-02: Version 1.3 added the bundled finbar-cli tool.'
    - '2024-01-24: Version 1.13 adopted a more compact command-palette interface.'
    - '2025-05-30: Version 1.16 added hierarchy-preserving outline-mode search.'
    - '2026-05-25: Version 1.21 added built-in and user-created themes.'
  usage:
    - >
      Users invoke Finbar with a global shortcut, type a fuzzy query, and activate a
      matching menu command without navigating the target application's menus with a
      pointer.
    - >
      List mode ranks flattened results by match score, while outline mode preserves the
      menu hierarchy. Rules can hide irrelevant items, and recent selections influence
      the root screen.
    - >
      Finbar can incorporate shell scripts and AppleScripts from its documented
      Application Scripts directory. The bundled finbar-cli exposes selected functions
      to automation tools.
