id: brew:cpu_features
display-name: cpu_features
homepage: https://github.com/google/cpu_features
repo: https://github.com/google/cpu_features
docs:
  - https://github.com/google/cpu_features#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README positions cpu_features as cross-platform infrastructure across Linux,
      macOS, Windows, Android, and several CPU families. It also describes Android
      support and an NDK cpu-features.h compatibility layer, making it relevant to
      projects that need runtime dispatch without depending on platform-specific probes.
  package-nerd-significance:
    - >
      For packagers, cpu_features is a small but foundational library: it helps
      upstreams choose optimized code paths while still shipping generic binaries, and
      it is designed to build with CMake, Bazel, and Zig across many architectures.
  project-history:
    - >
      The official repository was created in 2018. Its README emphasizes portability,
      old-compiler compatibility, sandbox-aware detection strategies, thread safety, no
      allocation, no exceptions, unit tests, and suitability for low-level code such as
      libc-style routines.
  related-projects:
    - The README describes cpu_features as an Android NDK cpu-features.h drop-in replacement.
  sources:
    - https://github.com/google/cpu_features
    - https://raw.githubusercontent.com/google/cpu_features/main/README.md
    - https://api.github.com/repos/google/cpu_features
    - https://github.com/google/cpu_features/releases/tag/v0.11.0
  summary:
    - >
      cpu_features is Google's portable C99 library for detecting CPU instruction-set
      and microarchitecture features at runtime.
  timeline:
    - '2018: The google/cpu_features repository was created.'
    - '2025: v0.10.x releases were published from the official GitHub repository.'
    - '2026: v0.11.0 was published from the official GitHub repository.'
  usage:
    - >
      Users include architecture-specific headers such as cpuinfo_x86.h or
      cpuinfo_arm.h, read feature structures returned by GetX86Info or GetArmInfo, and
      select optimized code paths based on runtime CPU support. The package also builds
      list_cpu_features for inspecting detected features, including JSON output.
related-packages: []
category: system
package-manager:
  brew: cpu_features
  debian: libcpu-features-dev
  nix: cpu_features
  ubuntu: libcpu-features-dev
package-manager-url: https://formulae.brew.sh/formula/cpu_features
license: Apache-2.0
tags:
  - c99
  - cli
  - cpu
  - cpu-features
  - library
  - runtime-detection
description: Cross platform C99 library to get cpu features at runtime
executables:
  - list_cpu_features
provenance:
  formula: cpu_features
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
