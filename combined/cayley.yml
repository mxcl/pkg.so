id: brew:cayley
display-name: Cayley
homepage: https://cayley.io
repo: https://github.com/cayleygraph/cayley
docs:
  - https://cayley.gitbook.io/cayley
  - https://github.com/cayleygraph/cayley#readme
config-file-location:
  unix:
    - '--config/-c path'
    - $CAYLEY_CFG
    - ./cayley.yml
    - ./cayley.json
    - ~/.cayley/cayley.yml
    - ~/.cayley/cayley.json
    - /etc/cayley.yml
    - /etc/cayley.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Cayley's README says it is production-ready and used by various companies for
      production workloads. In package-manager terms it has also been carried by
      Homebrew and Nix, giving Unix users a one-command install path for a standalone
      graph database.
  package-nerd-significance:
    - >
      Cayley is interesting as a self-contained Go graph database package: one formula
      installs a graph server, REPL, query tooling, and multiple storage backends
      without deploying a larger database stack. Its Freebase/Knowledge Graph lineage
      gives it a distinct niche among RDF and linked-data tools.
  project-history:
    - >
      The project describes itself as inspired by the graph database behind Google's
      Knowledge Graph, formerly Freebase. Its public GitHub repository was created in
      2014 and the README frames Cayley around linked data, multiple query languages,
      and application-oriented graph workloads.
  related-projects:
    - >
      Cayley documents query-language connections to Gremlin, GraphQL-style queries, and
      MQL, and supports storage backends including LevelDB, Bolt, MongoDB,
      Elasticsearch, PostgreSQL, MySQL, and SQLite.
  sources:
    - https://api.github.com/repos/cayleygraph/cayley
    - https://github.com/cayleygraph/cayley
    - https://cayley.io
    - https://cayley.gitbook.io/cayley
    - https://github.com/cayleygraph/cayley#readme
    - https://formulae.brew.sh/api/formula/cayley.json
  summary:
    - >
      Cayley is an open-source linked-data graph database and CLI that presents graph
      storage, query, REPL, HTTP server, and visualization workflows in a Go package.
  timeline:
    - '2014: Public GitHub repository created.'
    - '2018: v0.7.5 release published on GitHub.'
    - '2019: v0.7.7 release published on GitHub.'
  usage:
    - >
      Users typically run `cayley http` for the web interface/API, load RDF-like quad
      data, and query it with Gizmo, an MQL-style language for Freebase users, or
      GraphQL-inspired queries. The official configuration docs describe YAML/JSON
      config files plus command-line and environment-variable overrides.
related-packages:
  - id: brew:neo4j
    reason: >
      Choose Neo4j when you want a full server-oriented property-graph platform centered
      on Cypher, administration tooling, official drivers, and a large integration
      ecosystem.
    rel: alternative
    sources:
      - https://github.com/cayleygraph/cayley#readme
      - https://neo4j.com/docs/
  - id: brew:kuzu
    reason: >
      Choose Kuzu when you need an embedded, in-process property-graph database
      optimized for analytical Cypher workloads instead of a standalone linked-data
      server.
    rel: alternative
    sources:
      - https://github.com/cayleygraph/cayley#readme
      - https://kuzudb.github.io/docs/
category: data
package-manager:
  brew: cayley
  nix: cayley
package-manager-url: https://formulae.brew.sh/formula/cayley
license: Apache-2.0
tags:
  - cli
  - go
  - graph-database
  - linked-data
  - query-language
  - rdf
description: Graph database inspired by Freebase and Knowledge Graph
executables:
  - cayley
provenance:
  formula: cayley
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
