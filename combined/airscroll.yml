history:
  adoption-history:
    - >
      AirScroll targets macOS users seeking trackpad-like behavior from third-party
      mice. Its official installation guide documents both direct installation and
      Homebrew Cask installation.
  package-nerd-significance:
    - >
      AirScroll represents the macOS ecosystem of focused menu-bar utilities that modify
      input behavior, packaged through Homebrew Cask for repeatable installation.
  project-history:
    - >
      AirScroll was developed as a native macOS mouse-scrolling utility. Its documented
      evolution added per-application settings, multi-monitor adaptation, adjustable
      smoothness, keyboard shortcuts, and increasingly native settings interfaces.
  related-projects:
    - >
      The official troubleshooting guide identifies LinearMouse, Mac Mouse Fix, Scroll
      Reverser, and Logitech Options as overlapping mouse or scrolling utilities that
      can conflict with AirScroll.
  sources:
    - 'Official changelog: https://airscroll.net/changelog'
    - 'Official homepage: https://airscroll.net/'
    - 'Official installation guide: https://airscroll.net/installation-guide'
  summary:
    - >
      AirScroll is a commercial macOS utility that smooths mouse scrolling while
      allowing acceleration, direction, and per-application behavior to be customized
      independently of trackpad settings.
  timeline:
    - >
      2025-12: Per-application scrolling settings and multi-monitor adaptation were
      documented.
    - '2026-07: Adjustable smoothness and a redesigned native settings interface were added.'
    - '2026-08: Diagnostic reporting was added to simplify support and conflict investigation.'
  usage:
    - >
      Users launch AirScroll, grant macOS Accessibility permission, and adjust global or
      per-application scrolling behavior from its menu-bar settings. The application
      processes mouse scrolling locally and leaves trackpad behavior unchanged.
category: system
