id: brew:ipatool
display-name: ipatool
homepage: https://github.com/majd/ipatool
repo: https://github.com/majd/ipatool
docs:
  - https://github.com/majd/ipatool/wiki
  - https://github.com/majd/ipatool#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ipatool's adoption is unusually high for this batch: the GitHub repository has
      thousands of stars and packaging across Homebrew, MacPorts, Nix, and Scoop in the
      supplied package metadata. The project also ships binaries for several operating
      systems through GitHub releases.
    - >
      Its popularity tracks a real gap in Apple's ecosystem: developers, archivists,
      testers, and power users often need reproducible IPA acquisition for apps their
      Apple ID can access, while Apple's official tooling is tied to graphical or
      platform-specific flows.
  package-nerd-significance:
    - >
      ipatool is package-nerd catnip because it packages a cloudy, account-bound store
      protocol behind a familiar CLI surface. Its value is not just the binary: it
      encodes App Store endpoint behavior, storefront metadata, authentication, and
      download workflows that can break when Apple changes server behavior.
    - >
      The formula's significance is also operational. A one-command install makes
      ipatool usable in scripts, CI experiments, archival workflows, and repeatable
      troubleshooting without asking each user to build a Go project.
  project-history:
    - >
      The project reached a v1.0.0 release in May 2021 as a CLI for searching and
      downloading iOS App Store packages. Its README defines the core workflow around
      App Store authentication, search, purchase/license acquisition, and download
      commands.
    - >
      The 2.x line broadened the tool's practical scope. Release notes show fixes for
      Apple-side authentication changes, support for downloading by app ID, restoration
      of purchase behavior, older-version download support through external version IDs,
      and dynamic auth endpoint handling.
  related-projects:
    - >
      Related workflows include Apple's App Store services, IPA signing and sideloading
      tools, device-management tooling, and package archives. ipatool is distinct from
      patchers such as ipapatch because it obtains app packages rather than modifying
      them.
    - >
      Its package ecosystem spans Homebrew, MacPorts, Nix, and Scoop, which makes it a
      cross-platform CLI rather than a macOS-only helper.
  sources:
    - https://formulae.brew.sh/formula/ipatool
    - https://github.com/majd/ipatool
    - https://github.com/majd/ipatool/releases
    - https://github.com/majd/ipatool/wiki
    - https://github.com/majd/ipatool/wiki/FAQ/bfd186ac64f70d71f9af563279282fa2b58a4ecc
  summary:
    - >
      ipatool is Majd Alfhaily's command-line tool for searching the iOS App Store and
      downloading IPA app packages. It became a prominent package-manager item because
      it exposes App Store package retrieval as scriptable CLI commands instead of a
      GUI-only workflow.
  timeline:
    - '2021-05-22: v1.0.0 marked the initial public release.'
    - '2021-06-08: v1.0.4 added iTunes Store region selection.'
    - '2022-12-08: The GitHub wiki home page was edited with FAQ navigation.'
    - >
      2025-01-21: v2.1.5 added downloading by app ID and fixed authentication affecting
      search and download.
    - '2025-02-10: v2.1.6 fixed the purchase command after Apple-side API changes.'
    - '2025-06-10: v2.2.0 added older-version download support with external version IDs.'
    - >
      2026-02-16: v2.3.0 resolved auth endpoint selection dynamically and added
      resumable incomplete downloads.
  usage:
    - >
      Users authenticate with `ipatool auth`, search App Store listings with `ipatool
      search`, obtain a license with `ipatool purchase`, and download packages with
      `ipatool download`. The README documents text and JSON output modes,
      non-interactive operation, and platform selection for search.
    - >
      The wiki FAQ documents an important limitation for Apple Silicon Mac sideloading:
      Apple stopped serving macOS-compatible sinf data for app packages, so users may
      still retrieve an iOS app package but need other device-side or signing steps for
      some workflows.
related-packages: []
