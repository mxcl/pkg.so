id: brew:gfxutil
display-name: gfxutil
homepage: https://github.com/acidanthera/gfxutil
repo: https://github.com/acidanthera/gfxutil
docs:
  - https://github.com/acidanthera/gfxutil#readme
  - https://github.com/acidanthera/gfxutil/blob/master/gfxutil.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gfxutil became useful in a narrow ecosystem: people editing or translating macOS
      device-property data for bootloaders and EFI configuration. Its Homebrew and
      MacPorts packaging made a formerly forum-distributed utility easier to install on
      developer and hobbyist Macs.
  package-nerd-significance:
    - >
      The package is significant mainly because it preserves a specialized
      Apple-firmware utility in a reproducible source repository and package-manager
      form, rather than leaving it only as a forum attachment or local build.
  project-history:
    - >
      The Acidanthera repository describes gfxutil as a tool by mcmatrix for Device
      Properties commonly found in Apple Mac firmwares, with usage examples and
      changelogs linked to the older netkas.org community forum. The GitHub repository
      was opened in 2018 as an Acidanthera-hosted source tree, but the README points to
      an earlier community lineage outside GitHub.
  related-projects:
    - >
      The README builds against Acidanthera's audk edk2 tree, placing gfxutil near the
      OpenCore and Apple-firmware tooling ecosystem.
  sources:
    - http://forum.netkas.org/index.php?topic=64.0
    - https://api.github.com/repos/acidanthera/gfxutil
    - https://api.github.com/repos/acidanthera/gfxutil/releases
    - https://formulae.brew.sh/formula/gfxutil
    - https://github.com/acidanthera/gfxutil
    - https://raw.githubusercontent.com/acidanthera/gfxutil/master/README.md
  summary:
    - >
      gfxutil is a small macOS command-line utility for working with Apple EFI Device
      Properties data, most often encountered in Hackintosh, bootloader, and
      firmware-adjacent workflows.
  timeline:
    - '2007: The bundled manual page date records an early Darwin-era documentation stub.'
    - '2018: The Acidanthera GitHub repository was created and published release 1.76b.'
    - '2024: Release 1.84b was published from the Acidanthera repository.'
  usage:
    - >
      Practitioners use gfxutil to inspect and convert device paths and property blobs
      when preparing macOS hardware configuration data, especially when matching PCI
      device paths to injected properties.
related-packages: []
category: system
