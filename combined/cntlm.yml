id: brew:cntlm
display-name: Cntlm
homepage: https://cntlm.sourceforge.net/
repo: https://sourceforge.net/p/cntlm/code
docs:
  - https://cntlm.sourceforge.net/
  - https://cntlm.sourceforge.net/cntlm_manual.pdf
config-file-location:
  unix:
    - /etc/cntlm.conf
    - /usr/local/etc/cntlm.conf
  windows: '%PROGRAMFILES%\Cntlm\cntlm.ini'
credentials-file-location:
  unix:
    - /etc/cntlm.conf
    - /usr/local/etc/cntlm.conf
  windows: '%PROGRAMFILES%\Cntlm\cntlm.ini'
history:
  adoption-history:
    - >
      Cntlm was adopted by Unix users working behind NTLM-authenticated corporate
      proxies, especially when command-line package managers, browsers, version-control
      clients, or build tools could use a normal local HTTP proxy but could not
      authenticate to NTLM directly. This batch input records packages in Alpine,
      Homebrew, Debian, Fedora, MacPorts, Nix, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      Cntlm is significant as a pragmatic corporate-network survival package: small,
      old, and often invisible, but essential when bootstrap tools such as package
      managers, Git/SVN, language installers, or build systems need ordinary HTTP proxy
      access through an NTLM-only network.
  project-history:
    - >
      The official SourceForge site presents Cntlm as a cross-platform proxy written in
      plain C with no external dependencies, connection caching, tunneling, SOCKS5 mode,
      and support for parent proxy failover. The project's public news shows active
      0.35-era work in 2007, a larger 0.91 rewrite/testing cycle in 2010, and 0.92.x
      Windows and packaging fixes in 2011-2012.
  related-projects:
    - NTLMAPS is the older Python NTLM proxy that Cntlm documentation compares itself against.
    - >
      Squid, Tinyproxy, WinGate, NetCache, and Microsoft ISA Server appear in Cntlm's
      own compatibility and proxy discussion.
  sources:
    - https://cntlm.sourceforge.net/
    - https://cntlm.sourceforge.net/svn.html
    - https://cntlm.sourceforge.net/cntlm_manual.pdf
  summary:
    - >
      Cntlm is a small C NTLM/NTLM Session Response/NTLMv2 authenticating HTTP proxy
      with TCP/IP tunneling, built to let applications that lack NTLM support work
      behind corporate Microsoft-style proxy infrastructure.
  timeline:
    - >
      2007: Version 0.35 brought FreeBSD support, Debian packaging visibility, and
      built-in SOCKS5 proxy support.
    - >
      2010: 0.91 release candidates tested a major rewrite with standalone proxy
      behavior, WWW authentication support, Windows installer work, and packaging
      targets.
    - '2011: Version 0.92 appeared with bug fixes and feature work after the 0.35.1 stable era.'
    - >
      2012: 0.92.3 and updated manual/WebSVN notes were published while 0.93 testing was
      requested.
  usage:
    - >
      Users configure usernames, domains, parent proxies, and password hashes in
      cntlm.conf or cntlm.ini, then point applications at the local Cntlm listener. The
      official site emphasizes authenticated connection reuse, multiple parent proxies,
      TCP/IP port forwarding, SOCKS5 proxy mode, and running on Unix and Windows.
related-packages: []
category: networking
package-manager:
  apk: cntlm
  brew: cntlm
  debian: cntlm
  dnf: cntlm
  macports: cntlm
  nix: cntlm
  ubuntu: cntlm
  zypper: cntlm
package-manager-url: https://formulae.brew.sh/formula/cntlm
license: GPL-2.0-only
tags:
