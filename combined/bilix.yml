id: brew:bilix
display-name: bilix
homepage: https://github.com/HFrost0/bilix
repo: https://github.com/HFrost0/bilix
docs:
  - https://github.com/HFrost0/bilix#readme
  - https://hfrost0.github.io/bilix/en
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README advertises PyPI installation and also calls out Homebrew for
      macOS users. Its package-manager footprint is smaller than general-purpose
      downloaders because it is centered on Bilibili workflows.
  package-nerd-significance:
    - >
      bilix is a useful example of a media-site downloader becoming a packaged CLI:
      small, Python-native, async-first, and tied to a regional media ecosystem rather
      than a universal protocol.
  project-history:
    - >
      GitHub metadata shows the bilix repository was created on 2022-04-03. The official
      README frames it as a lightweight, high-concurrency downloader with both CLI
      commands and a Python API.
  related-projects:
    - >
      Related tools include yt-dlp and other site-specific downloaders; bilix is
      specifically oriented around Bilibili and Python async usage.
  sources:
    - GitHub repository and release metadata from api.github.com.
    - Official GitHub README.
    - Package adoption from source_facts.package-manager.
  summary:
    - >
      bilix is a Python CLI and library for asynchronous downloads from Bilibili and
      related media sources.
  timeline:
    - '2022-04-03: GitHub repository created.'
    - '2022-04-20: 0.2 release published.'
    - '2022-05-07: 0.4.3 release published.'
  usage:
    - >
      CLI users typically call `bilix v URL` to download a video; Python users can
      import site-specific downloader classes and run asynchronous downloads in their
      own scripts.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Install FFmpeg alongside bilix because bilix's official installation guide
      requires it to merge separately downloaded audio and video streams.
    rel: adjacent_workflow
    sources:
      - https://hfrost0.github.io/bilix/install.html
      - https://ffmpeg.org/documentation.html
category: media
package-manager:
  brew: bilix
package-manager-url: https://formulae.brew.sh/formula/bilix
license: Apache-2.0
tags:
  - audio
  - bilibili
  - cli
  - download
  - python
  - video
description: Lightning-fast asynchronous download tool for bilibili and more
executables:
  - bilix
provenance:
  formula: bilix
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
