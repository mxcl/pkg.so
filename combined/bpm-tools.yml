id: brew:bpm-tools
display-name: bpm-tools
homepage: https://www.pogo.org.uk/~mark/bpm-tools/
repo: https://www.pogo.org.uk/~mark/bpm-tools.git
docs:
  - https://www.pogo.org.uk/~mark/bpm-tools
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears modest and utilitarian: the input package facts list packages in
      Homebrew, Debian, Nix, Ubuntu, and openSUSE/zypper. That distribution spread is
      typical for a small Unix audio tool that remains useful without frequent releases.
    - >
      The official page connects bpm-tools to the xwax Linux DJ community, suggesting
      its early users were command-line-oriented DJs and Linux audio users rather than
      mainstream media-library applications.
  package-nerd-significance:
    - >
      bpm-tools is a good example of the small personal-site Unix package: one focused
      algorithm, a couple of commands, a tarball, and a Git repository that
      distributions can keep alive long after the release cadence slows.
    - >
      For package history, it also ties together Linux DJ culture, xwax, and
      shell-friendly audio metadata workflows in a way larger GUI music tools do not.
  project-history:
    - >
      The official project page says bpm-tools came from experiments in automatically
      calculating and tagging music tempo. The public Git history begins in December
      2011, and the official page lists bpm-tools 0.3 as the most recent release dated
      21 May 2013.
    - >
      The project is distributed from Mark Hills's own site, with an HTTPS Git clone URL
      and GPLv2 licensing. The page explicitly says the code is the best explanation of
      the algorithm, a relatively simple application of autocorrelation by statistical
      sampling.
  related-projects:
    - >
      The official page names xwax as a related Linux DJ project by the same developer
      and points BPM and Linux DJ discussion toward the xwax community.
    - >
      Related package-manager neighbors include audio taggers, command-line decoders, DJ
      tools, and music-information-retrieval utilities.
  sources:
    - https://www.pogo.org.uk/~mark/bpm-tools
    - https://www.pogo.org.uk/~mark/bpm-tools.git
    - source_facts.package-manager
  summary:
    - >
      bpm-tools is a small command-line audio utility by Mark Hills for estimating and
      tagging the tempo of music files in beats per minute. Its official page frames it
      as an experimental but useful autocorrelation-based tool for DJs, xwax users, and
      shell scripting.
  timeline:
    - '2011: Public Git history begins with the initial commit in December.'
    - '2013: bpm-tools 0.3 released on 21 May according to the official page.'
    - '2021: Official page remained maintained enough to carry a December 2021 page date.'
    - >
      Current: Packaged by Homebrew, Debian, Nix, Ubuntu, and zypper according to input
      package facts.
  usage:
    - >
      The package provides commands such as `bpm` and `bpm-tag` for detecting tempo and
      tagging files. Its best fit is batch analysis, DJ preparation, and scripts that
      need tempo metadata without opening a full digital audio workstation.
    - >
      The author cautions that there is no scientific comparison with other algorithms,
      so the package is best understood as a pragmatic command-line estimator rather
      than a definitive music-information-retrieval benchmark.
related-packages:
  - id: brew:aubio
    reason: >
      Choose aubio when you need a maintained audio-analysis library and CLI with beat
      tracking, tempo, onset, pitch, and Python/C APIs; bpm-tools is the narrower choice
      for simple BPM estimation and tagging.
    rel: alternative
    sources:
      - https://www.pogo.org.uk/~mark/bpm-tools/
      - https://github.com/aubio/aubio/blob/master/README.md
      - https://aubio.org/manual/latest/
category: media
