id: brew:mmctl
display-name: mmctl
homepage: https://mattermost.com
repo: https://github.com/mattermost/mattermost
docs:
  - https://docs.mattermost.com/administration-guide/manage/mmctl-command-line-tool.html
config-file-location:
  unix: $XDG_CONFIG_HOME/mmctl/config
credentials-file-location:
  unix: $XDG_CONFIG_HOME/mmctl/config
history:
  project-history:
    - >
      Its history is tied to Mattermost's transition away from the older server-local
      `mattermost` CLI for many administrative actions. Mattermost documentation says
      that from Mattermost v6.0, the majority of the older CLI commands were replaced by
      equivalents in mmctl, while some import, export, server, and database commands
      remained in the `mattermost` CLI. The mmctl documentation also notes that the tool
      was developed to a large extent through community contributions.
  sources:
    - https://docs.mattermost.com/administration-guide/manage/command-line-tools.html
    - https://docs.mattermost.com/administration-guide/manage/mmctl-command-line-tool.html
    - https://formulae.brew.sh/formula/mmctl
    - https://github.com/mattermost/mattermost
    - https://github.com/mattermost/mmctl
  summary:
    - >
      mmctl is Mattermost's administrative command-line client. The Mattermost
      documentation describes it as a CLI for Mattermost servers that is installed
      locally, uses the Mattermost API, and can operate remotely. Authentication can use
      login credentials or an authentication token, which makes it useful for
      administrators who do not have shell access to the Mattermost server host.
  usage:
    - >
      In use, mmctl is a remote administration and automation tool for self-hosted and
      Cloud Mattermost instances. System administrators use it for user, team, channel,
      role, permission, config, auth, export, import, plugin, and other
      server-management operations from scripts or local terminals. The Homebrew package
      makes sense for admins who manage Mattermost from macOS without installing a full
      Mattermost server distribution.
related-packages:
  - id: cask:mattermost
    reason: >
      The Mattermost desktop client connects users to the same Mattermost deployments
      that administrators configure and maintain with mmctl.
    rel: adjacent_workflow
    sources:
      - https://docs.mattermost.com/manage/mmctl-command-line-tool
      - https://docs.mattermost.com/product-overview/desktop
category: system
package-manager:
  brew: mmctl
  nix: mmctl
  pacman: mmctl
package-manager-url: https://formulae.brew.sh/formula/mmctl
license: AGPL-3.0-only AND Apache-2.0
tags:
  - api-client
  - cli
  - collaboration-platform
  - mattermost
  - server-administration
description: Remote CLI tool for Mattermost server
executables:
  - mmctl
provenance:
  formula: mmctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
