history:
  adoption-history:
    - >
      DevKnife launched as a native macOS application distributed through direct
      download, the Mac App Store, and Homebrew. Direct-download and Homebrew
      installations use Sparkle for application updates.
    - >
      Its documentation emphasizes local processing, no telemetry, and a compact native
      application in place of multiple websites, scripts, and separate utilities.
  package-nerd-significance:
    - >
      DevKnife packages many small, frequently needed developer utilities into a single
      native macOS application. It is notable to package users as a local-first
      alternative to browser-based formatters, converters, inspectors, API clients, and
      ad hoc command-line snippets.
  project-history:
    - >
      DevKnife's first documented release arrived on September 1, 2025 with JSON editing
      and querying, encoding and decoding, Whois, network testing, color conversion,
      test-data generation, text comparison, JWT inspection, port scanning, and hashing.
    - >
      Later releases added broader file editing and conversion, Quick Look extensions,
      multi-window state, workspaces, macOS Shortcuts integration, networking tools, and
      additional developer inspectors. The product remained focused on native macOS
      operation and offline handling of user data.
  related-projects:
    - The port-scanner interface uses a locally installed Nmap executable.
    - Website and Homebrew builds use the Sparkle update framework.
    - The Quick Look extension integrates with macOS Finder for developer-file previews.
  sources:
    - https://devknife.app/docs/changelog
    - https://devknife.app/docs/getting-started/installation
    - https://devknife.app/docs/getting-started/introduction
    - https://devknife.app/docs/quick-look
    - https://devknife.app/docs/tools/port-scanner
  summary:
    - >
      DevKnife is a native, local-first macOS application that bundles editors,
      converters, network inspectors, encoders, testing tools, and other everyday
      developer utilities.
  timeline:
    - '2025-09-01: DevKnife 1.0.0 launched with its initial developer-tool collection.'
    - '2026-02-25: Multi-window support and per-window state persistence were added.'
    - '2026-04: CSV editing and expanded Quick Look support arrived.'
    - >
      2026-07-15: Workspaces, macOS Shortcuts integration, and command-line launching
      were added.
    - '2026-08-09: DNS inspection and tool favorites were added.'
  usage:
    - >
      Developers use DevKnife for formatting and querying JSON, converting structured
      data, testing HTTP endpoints and regular expressions, editing developer files,
      decoding JWTs, inspecting DNS and certificates, scanning ports, hashing data, and
      comparing text.
    - >
      The application performs document processing locally. According to its privacy
      documentation, network contact is limited to activities such as trial or license
      activation, update checks, and tools whose function inherently requires network
      access.
