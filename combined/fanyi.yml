id: brew:fanyi
display-name: Fānyì
homepage: https://github.com/afc163/fanyi
repo: https://github.com/afc163/fanyi
docs:
  - https://github.com/afc163/fanyi#readme
config-file-location:
  unix: ~/.config/fanyi/.fanyirc
credentials-file-location:
  unix: ~/.config/fanyi/.fanyirc
history:
  adoption-history:
    - >
      Official project surfaces include npm distribution, Homebrew packaging in the
      input facts, GitHub releases, and README badges for npm version and monthly
      downloads. The repository metadata also shows substantial GitHub interest for a
      small translation CLI.
  package-nerd-significance:
    - >
      Fanyi is package-manager-friendly because it turns a web dictionary and
      translation workflow into a tiny global CLI. Its 2026 LLM and agent-skill
      additions also show how older Node command-line packages are being refreshed for
      AI-agent and model-backed workflows.
  project-history:
    - >
      The repository was created in December 2013, making Fanyi one of the
      longer-running small CLI tools in this batch. Its core workflow remains
      intentionally simple: install globally with npm or bun, then run `fanyi word` or
      `fy word` for dictionary and translation output.
    - >
      In 2026, the v11.0.0 release announcement in the README highlighted a shift toward
      out-of-the-box LLM translation through a built-in free proxy, restored Youdao
      support, streaming semantic coloring, custom OpenAI-compatible LLM configuration,
      and an agent skill.
  related-projects:
    - iciba and Youdao are documented translation sources.
    - OpenAI-compatible chat APIs are supported for custom LLM translation.
    - npm is the primary JavaScript package distribution channel.
  sources:
    - https://github.com/afc163/fanyi
    - https://raw.githubusercontent.com/afc163/fanyi/master/README.md
    - https://api.github.com/repos/afc163/fanyi
    - https://api.github.com/repos/afc163/fanyi/releases?per_page=100
  summary:
    - >
      Fanyi is a Chinese-English command-line translation tool. The README describes it
      as powered by iciba, Youdao, and LLM translation, with the `fanyi` command and
      shorter `fy` alias.
  timeline:
    - '2013: Repository created.'
    - '2020: v4.2.0 released.'
    - '2023: v8.0.0 released.'
    - '2025: v10.0.0 released.'
    - '2026: v11.0.0 released with built-in LLM proxy and agent skill.'
  usage:
    - >
      The normal user flow is `fanyi <word-or-sentence>` or `fy <word-or-sentence>`,
      with support for Chinese and English words, phrases, and sentences. `fanyi list`
      shows lookup history.
    - >
      Configuration lives at `~/.config/fanyi/.fanyirc` and can be managed with `fanyi
      config set`. Users can disable individual sources, turn color off, or set
      `LLM_API_KEY`, `LLM_API_BASE_URL`, and `LLM_MODEL_ID` for custom OpenAI-compatible
      models.
related-packages:
  - id: brew:translate-shell
    reason: >
      Choose Translate Shell when you need many languages, selectable translation
      engines, Unix pipelines, files, or an interactive REPL; choose Fānyì for its
      focused Chinese–English dictionary and LLM workflow.
    rel: alternative
    sources:
      - https://github.com/afc163/fanyi#readme
      - https://www.soimort.org/translate-shell/
category: productivity
package-manager:
  brew: fanyi
