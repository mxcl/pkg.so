id: brew:gdb
display-name: GNU Debugger
homepage: https://www.gnu.org/software/gdb/
repo: https://sourceware.org/git?p=binutils-gdb.git
docs:
  - https://www.gnu.org/software/gdb/documentation
  - https://sourceware.org/gdb/current/onlinedocs/gdb
config-file-location:
  macos:
    - ~/Library/Preferences/gdb/gdbearlyinit
    - ~/.gdbearlyinit
    - ~/Library/Preferences/gdb/gdbinit
    - ~/.gdbinit
    - ./.gdbinit
  unix:
    - $XDG_CONFIG_HOME/gdb/gdbearlyinit
    - ~/.config/gdb/gdbearlyinit
    - ~/.gdbearlyinit
    - $XDG_CONFIG_HOME/gdb/gdbinit
    - ~/.config/gdb/gdbinit
    - ~/.gdbinit
    - ./.gdbinit
credentials-file-location: null
history:
  adoption-history:
    - >
      GDB became the default debugger in many Unix-like development environments because
      it paired a scriptable CLI with broad compiler, architecture, object-file, and
      language support.
    - >
      The manual records Cygnus Solutions sponsoring GDB maintenance and much
      development since 1991, an important phase in professionalizing GNU toolchain
      support for commercial cross-development and embedded targets.
  package-nerd-significance:
    - >
      GDB is a canonical package-manager debugging tool: small at the command line, but
      deeply tied to compiler output, debug symbols, libc behavior, architecture
      support, Python scripting, and remote target workflows.
    - >
      Its initialization-file search path is platform-sensitive, with XDG-style paths on
      non-macOS Unix systems and Library/Preferences paths on macOS, which makes
      packaging and documentation details visible to users.
  project-history:
    - >
      The current GDB manual credits Richard Stallman as the original author and
      describes many later contributors. Its copyright history begins in 1988, placing
      GDB among the early core GNU development tools.
    - >
      The manual's contributor history records early releases through 2.8 under Richard
      Stallman and assistants, later 3.x and 4.x release stewards, and major commercial
      and community contributions for CPU targets, object formats, remote debugging,
      gdbserver, the machine interface, and language support.
    - >
      GDB is maintained in Sourceware's binutils-gdb repository, reflecting its close
      development relationship with GNU Binutils and the broader GNU toolchain.
  related-projects:
    - >
      GDB is developed with GNU Binutils in the binutils-gdb repository and relies on
      BFD for multiple object-file formats.
    - >
      Related tools and interfaces include gdbserver, Readline, GDB/MI, the Debugger
      Adapter Protocol, and frontends such as gdbgui.
  sources:
    - https://sourceware.org/gdb/current/onlinedocs/gdb.html
    - https://sourceware.org/gdb/current/onlinedocs/gdb.html/Contributors.html
    - https://sourceware.org/gdb/current/onlinedocs/gdb.html/Initialization-Files.html
    - https://sourceware.org/gdb/current/onlinedocs/gdb.html/Summary.html
    - https://sourceware.org/gdb/current/onlinedocs/gdb.html/Supported-Languages.html
    - https://sourceware.org/gdb/news/
    - https://sourceware.org/git/?p=binutils-gdb.git
  summary:
    - >
      GDB is the GNU Project's source-level debugger, used from the command line to run
      programs under observation, stop them at controlled points, inspect state, and
      experiment with program execution.
  timeline:
    - '1988: The GDB manual copyright history begins.'
    - '1991: Cygnus Solutions begins sponsoring GDB maintenance and much of its development.'
    - '2025: GDB 17.1 is released according to the official news page.'
    - '2026: GDB 17.2 is released according to the official news page.'
  usage:
    - >
      The manual describes GDB as useful for starting a program, stopping it on
      specified conditions, examining what happened after it stopped, and changing
      program state to continue debugging.
    - >
      GDB supports many languages, including C, C++, D, Go, Objective-C, Fortran, OpenCL
      C, Pascal, Rust, assembly, Modula-2, and Ada. It also includes remote debugging,
      gdbserver, TUI, GDB/MI, Python and Guile extension APIs, and Debugger Adapter
      Protocol support.
related-packages:
  - id: brew:lldb
    reason: >
      Choose LLDB as a source-level debugger built on LLVM and Clang infrastructure,
      especially for Apple-platform or LLVM-centered development; its official
      documentation provides a GDB-to-LLDB command map.
    rel: alternative
    sources:
      - https://lldb.llvm.org/
      - https://lldb.llvm.org/use/map.html
  - id: brew:gdbgui
    reason: >
      Use gdbgui when you want to operate GDB through a browser interface with visual
      breakpoints, stacks, and source navigation.
    rel: adjacent_workflow
    sources:
      - https://www.gdbgui.com/
      - https://github.com/cs01/gdbgui
  - id: brew:valgrind
    reason: >
      Use Valgrind with GDB to stop on dynamic-analysis errors and inspect the running
      program through Valgrind's built-in gdbserver interface.
    rel: adjacent_workflow
    sources:
      - https://valgrind.org/docs/manual/manual-core-adv.html
      - https://sourceware.org/gdb/current/onlinedocs/gdb.html/Connecting.html
category: developer-tools
package-manager:
  apk: gdb
  brew: gdb
  debian: gdb
  dnf: gdb
  macports: gdb
  nix: gdb
  pacman: gdb
  scoop: main/gdb
  ubuntu: gdb
  zypper: gdb
package-manager-url: https://formulae.brew.sh/formula/gdb
license: GPL-3.0-or-later
tags:
  - c
  - c-plus-plus
  - cli
  - debugger
  - gdb
  - gnu
  - source-level-debugging
description: GNU debugger
executables:
