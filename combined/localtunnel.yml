id: brew:localtunnel
display-name: localtunnel
homepage: https://theboroer.github.io/localtunnel-www/
repo: https://github.com/localtunnel/localtunnel
docs:
  - https://github.com/localtunnel/localtunnel#readme
  - https://theboroer.github.io/localtunnel-www
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      localtunnel's adoption came from its extremely low setup cost: install it with npm
      or a system package manager, run `lt --port 8000`, and get a shareable URL. That
      made it especially useful for webhook callbacks, browser testing tools, mobile
      testing, and short-lived demonstrations.
    - >
      The public website credits @defunctzombie as the creator and @TheBoroer as the
      maintainer/operator, reflecting a project that moved from an early Node.js utility
      into a maintained public tunneling service and CLI package.
  package-nerd-significance:
    - >
      localtunnel is a canonical example of the 'one command gives localhost a URL'
      developer package. It competes in the same mental space as ngrok-style tools, but
      remains attractive because the client and server are open source and easy to
      install.
    - >
      For package maintainers, localtunnel is small but sensitive to Node dependency
      health, public service availability, and defaults such as the hosted tunnel
      endpoint.
  project-history:
    - >
      The official README describes localtunnel as a way to expose localhost to the
      world for easy testing and sharing, avoiding DNS changes or deployment just to let
      someone else reach a local service. The project is distributed as a Node package
      and provides the `lt` command.
    - >
      The localtunnel ecosystem is split between the client repository and a server
      repository. The server README explains that the default client connects to the
      `localtunnel.me` service while also allowing users to run their own server and
      point the client at it with `--host`.
  related-projects:
    - >
      localtunnel/server is the official server component for self-hosting compatible
      tunnel infrastructure.
    - >
      ngrok, Cloudflare Tunnel, LocalXpose, and inlets solve similar
      localhost-to-public-networking problems with different hosting and authentication
      models.
  sources:
    - https://github.com/localtunnel/localtunnel
    - https://github.com/localtunnel/server
    - https://theboroer.github.io/localtunnel-www/
  summary:
    - >
      localtunnel is a small Node.js command-line tunnel client for exposing a local
      HTTP service on a public URL. It became a familiar package-manager install for
      webhook testing, demos, browser testing, and sharing localhost without deploying.
  timeline:
    - '2010s: localtunnel emerged as a Node.js localhost tunneling CLI and public service.'
    - >
      2019: localtunnel 2.0.0 modernized the client with HTTPS support, a Promise API,
      and modern JavaScript syntax.
    - '2021: localtunnel 2.0.x maintenance releases updated dependencies.'
    - >
      2025: the public site documents @TheBoroer as maintainer/operator and keeps the
      project linked to GitHub.
  usage:
    - >
      The common workflow is `npm install -g localtunnel` or `npx localtunnel --port
      8000`, followed by keeping the local `lt` process running while requests are
      proxied to the chosen local port.
    - >
      Advanced users can self-host the localtunnel server, configure DNS wildcard
      records, run the server behind a reverse proxy, and pass `--host` to the client.
      The client has no official persistent config or credentials file documented.
related-packages:
  - id: brew:cloudflared
    reason: >
      Choose cloudflared when you want account-free temporary Quick Tunnels or a
      Cloudflare-managed production tunnel; localtunnel instead offers a simple Node
      client with an officially supported self-hosted server.
    rel: alternative
    sources:
      - https://theboroer.github.io/localtunnel-www/
      - https://github.com/localtunnel/server
      - https://developers.cloudflare.com/tunnel/get-started/quick-tunnels/
  - id: brew:bore-cli
    reason: >
      Choose bore when you need a small self-hostable TCP tunnel rather than
      localtunnel's web-service-oriented HTTP/HTTPS workflow.
    rel: alternative
    sources:
      - https://github.com/localtunnel/localtunnel#readme
      - https://github.com/ekzhang/bore#readme
category: networking
package-manager:
  brew: localtunnel
  nix: localtunnel
package-manager-url: https://formulae.brew.sh/formula/localtunnel
license: MIT
tags:
  - cli
  - http
  - localhost
  - testing
  - tunneling
  - webhooks
description: Exposes your localhost to the world for easy testing and sharing
executables:
