id: brew:ioping
display-name: ioping
homepage: https://github.com/koct9i/ioping
repo: https://github.com/koct9i/ioping
docs:
  - https://github.com/koct9i/ioping#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ioping's README explicitly links package entries for Debian, Ubuntu, Fedora, Arch
      Linux, ALT Linux, Gentoo, Nix, FreeBSD, and Homebrew. That spread matches its
      niche: a tiny diagnostic binary that distributions can carry as a low-friction
      storage benchmark and monitoring helper.
  package-nerd-significance:
    - >
      ioping matters in package catalogs because it fills the gap between full benchmark
      suites and ad hoc dd-style checks. Its name and output model make storage latency
      feel like ping, which is exactly the sort of memorable single-purpose Unix tool
      that travels well across distributions.
  project-history:
    - >
      The GitHub README records that the project migrated from Google Code to GitHub.
      Its tags show an early v0.4 line in 2011 and a v1.x line ending at v1.3, while the
      README lists Konstantin Khlebnikov and Kir Kolyshkin as authors.
  related-projects:
    - >
      ioping sits near fio, iostat, vmstat, and other storage-observability tools, but
      its upstream positioning is narrower: quick latency probes in the mental model of
      network ping.
  sources:
    - https://formulae.brew.sh/formula/ioping
    - https://github.com/koct9i/ioping
    - https://raw.githubusercontent.com/koct9i/ioping/master/README.md
  summary:
    - >
      ioping is a small command-line utility for measuring storage I/O latency in a
      ping-like style. The upstream README describes it as showing disk latency the same
      way ping shows network latency.
  timeline:
    - '2011: v0.4 tag appears in the Git history.'
    - >
      2015: GitHub repository metadata places the public GitHub repository in service
      after the Google Code era.
    - '2022: v1.3 tag used by Homebrew as the stable source archive.'
  usage:
    - >
      The typical use is to point ioping at a directory or block device and watch
      latency, IOPS, and throughput summaries. The README examples cover continuous
      latency sampling, disk seek-rate measurement, and sequential-speed measurement.
related-packages:
  - id: brew:fio
    reason: >
      Choose fio when you need reproducible, configurable multi-threaded I/O workloads
      and job files; choose ioping for a quick, interactive view of storage latency and
      simple seek or sequential measurements.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/koct9i/ioping/master/README.md
      - https://fio.readthedocs.io/en/master/fio_doc.html
category: system
package-manager:
  apk: ioping
  brew: ioping
  debian: ioping
