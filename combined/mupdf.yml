id: brew:mupdf
display-name: MuPDF
homepage: https://mupdf.com/
repo: https://github.com/ArtifexSoftware/mupdf
docs:
  - https://mupdf.readthedocs.io/en/latest
  - https://mupdf.readthedocs.io/en/latest/tools/index.html
  - https://mupdf.com/docs
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project became known for speed, small code size, and high-quality anti-aliased
      rendering. Its scope grew from a minimal PDF viewer and renderer into a document
      toolkit with viewers for multiple platforms, command-line tools, and embeddable
      libraries. MuPDF's documented format support includes PDF, XPS/OpenXPS, EPUB,
      MOBI, FB2, comic-book archives, common images, and limited SVG, while its
      toolchain handles rendering, conversion, extraction, inspection, cleaning, and
      scripting.
  sources:
    - https://artifex.com/blog/mupdfjs-with-npm
    - https://en.wikipedia.org/wiki/MuPDF
    - https://formulae.brew.sh/formula/mupdf
    - https://github.com/ArtifexSoftware/mupdf
    - https://mupdf.com/
    - https://mupdf.readthedocs.io/en/1.27.1/guide/what-is-mupdf.html
    - https://mupdf.readthedocs.io/en/latest/tools/mutool.html
    - https://www.sumatrapdfreader.org/docs/Contribute-to-SumatraPDF
  summary:
    - >
      MuPDF is a lightweight open-source document framework developed by Artifex
      Software and written in C for viewing, converting, and manipulating PDF, XPS, and
      e-book documents. Historical accounts trace the project to Tor Andersson's work on
      a PDF renderer in 2002, followed by Artifex's acquisition of the project and the
      development of Fitz, the graphics library that became MuPDF's rendering core. The
      first Fitz-based MuPDF release appeared in 2005, and the GitHub project copyright
      notice covers Artifex's stewardship from 2006 onward.
  usage:
    - >
      MuPDF's ecosystem role sits between desktop viewers, embedded renderers, and
      developer SDKs. SumatraPDF documents MuPDF as the library it uses to parse and
      render PDF files, and Artifex markets MuPDF Core, PyMuPDF, MuPDF.js, and MuPDF.NET
      as related products around the same engine family. In package managers, brew:mupdf
      is the full viewer/toolkit formula, while mupdf-tools-style packages expose only
      the CLI utilities for automation-heavy systems.
related-packages:
  - id: brew:ghostscript
    reason: >
      Choose Ghostscript when PostScript, printer-oriented page-description languages,
      or established print-conversion workflows are central; choose MuPDF for a
      lightweight viewer and embeddable framework centered on PDF, XPS, and e-books.
    rel: alternative
    sources:
      - https://mupdf.readthedocs.io/en/latest/guide/what-is-mupdf.html
      - https://ghostscript.readthedocs.io/en/latest/Readme.html
  - id: brew:qpdf
    reason: >
      Choose qpdf for lightweight, content-preserving PDF structure operations such as
      encryption, linearization, page assembly, and object inspection; choose MuPDF when
      rendering, viewing, text extraction, or conversion is required.
    rel: alternative
    sources:
      - https://mupdf.readthedocs.io/en/latest/tools/mutool.html
      - https://qpdf.readthedocs.io/en/latest/overview.html
category: media
