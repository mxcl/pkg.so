id: brew:monit
display-name: Monit
homepage: https://mmonit.com/monit/
repo: https://bitbucket.org/tildeslash/monit
docs:
  - https://mmonit.com/monit/documentation/monit.html
  - https://mmonit.com/wiki
config-file-location:
  unix:
    - ~/.monitrc
    - /etc/monitrc
    - '@sysconfdir@/monitrc'
    - ./monitrc
credentials-file-location:
  unix:
    - ~/.monitrc
    - /etc/monitrc
    - '@sysconfdir@/monitrc'
    - ./monitrc
history:
  project-history:
    - >
      The package occupies a practical space between init systems, cron, and full
      metrics platforms. Operators write a compact monitrc file, run Monit as a daemon,
      and use it for local recovery loops such as restarting web servers, checking disk
      or memory thresholds, probing HTTP/SMTP/MySQL-like protocols, and exposing status
      through its built-in HTTP(S) interface. M/Monit extends that pattern into a
      central management product that treats Monit as the per-host agent.
  sources:
    - https://bitbucket.org/tildeslash/monit
    - https://blog.x.com/engineering/en_us/a/2010/unicorn-power
    - https://mmonit.com/monit/changes/
    - https://mmonit.com/monit/documentation/monit.html
    - https://www.mmonit.com/
  summary:
    - >
      Monit is a Unix-focused process and service supervision tool maintained under the
      Tildeslash/M/Monit project. Its manual defines the core role plainly: monitor
      processes, programs, files, directories, filesystems, network connections,
      scripts, and system resources, then take actions such as restart, stop, alert, or
      execute a configured command when a check fails.
  usage:
    - >
      Monit gained visibility in early web operations because it handled fleets of
      identical application worker processes well. Twitter's 2010 engineering writeup
      says Twitter had relied on Monit for automatic recovery and monitoring of Mongrel
      workers, then kept Monit supervising the Unicorn master process while adding a
      more specialized process-tree watcher. Later release notes show the project
      continuing to track operational needs such as container PID 1 behavior, stronger
      checksum support, protocol checks, HTTP interface hardening, and platform-specific
      process accounting.
related-packages:
  - id: brew:s6
    reason: >
      Choose s6 when you want a low-level supervision tree with service directories,
      reliable PID tracking, and optional init-system components instead of Monit's
      polling, health-check, and alerting policy engine.
    rel: alternative
    sources:
      - https://mmonit.com/monit/documentation/monit.html
      - https://www.skarnet.org/software/s6/overview.html
category: system
package-manager:
  apk: monit
  brew: monit
  debian: monit
  dnf: monit
  macports: monit
  nix: monit
  pacman: monit
  ubuntu: monit
  winget: fzf404.Monit
package-manager-url: https://formulae.brew.sh/formula/monit
license: AGPL-3.0-or-later
tags:
  - cli
  - monitoring
  - process-supervision
  - service-management
  - system-administration
  - unix
description: Manage and monitor processes, files, directories, and devices
executables:
  - monit
provenance:
  formula: monit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
