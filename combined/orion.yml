id: cask:orion
display-name: Orion Browser
homepage: https://browser.kagi.com/
repo: null
docs:
  - https://help.kagi.com/orion
config-file-location:
  macos: ~/Library/Preferences/com.kagi.kagimacOS.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Kagi distributes Orion for Apple platforms and documents a planned Linux version.
      Its migration tools support importing browser data from Safari, Chrome, Firefox,
      Brave, Edge, Opera, Arc, password managers, and standard files.
  package-nerd-significance:
    - >
      Orion is notable as a WebKit browser outside Apple's Safari product, combining
      native Apple-platform integration with built-in blocking and support for browser
      extensions. It gives package-manager users another privacy-oriented browser that
      can be installed and updated as a conventional macOS application.
  project-history:
    - >
      Kagi developed Orion as a fast, privacy-focused browser based on WebKit. The
      official guide presents ad and tracker blocking as default behavior and documents
      separate profiles, extension support, synchronization, and browser-data migration.
  related-projects:
    - Kagi Search is developed by the same company and is integrated with Orion.
    - Safari supplies the most familiar point of comparison because both browsers use WebKit.
    - Chrome, Firefox, Brave, Edge, Opera, and Arc are supported migration sources.
  sources:
    - 'Official Orion User Guide: https://help.kagi.com/orion/'
    - >
      Official importing documentation:
      https://help.kagi.com/orion/getting-started/importing.html
    - 'Official profiles documentation: https://help.kagi.com/orion/features/profiles.html'
  summary:
    - >
      Orion is Kagi's privacy-oriented WebKit browser for macOS and iOS/iPadOS. It
      blocks advertisements and trackers by default and provides profiles,
      synchronization, browser-data importing, and extension support.
  timeline:
    - 'By 2026: Kagi documents Orion as available for Mac and iOS, with Linux planned.'
  usage:
    - >
      Users install Orion as a Safari alternative, import bookmarks, history, or
      passwords from an existing browser, and optionally divide browsing identities into
      isolated profiles. Each profile has separate settings, passwords, extensions,
      bookmarks, history, sessions, and website data.
category: networking
package-manager:
  brew-cask: orion
package-manager-url: https://formulae.brew.sh/cask/orion
tags:
  - ad-blocking
  - browser
  - macos
  - privacy
  - tracker-blocking
  - webkit
description: WebKit based web browser
applications:
  - Orion.app
provenance:
  cask: orion
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
