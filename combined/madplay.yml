history:
  adoption-history:
    - >
      MAD and madplay became part of the classic Unix audio stack because fixed-point
      decoding was valuable on machines without fast floating-point units and because
      MP3 playback was a common package-manager use case. The official page notes
      third-party ports and packages for Debian, FreeBSD, and NetBSD, and lists many
      third-party applications using or planning to use MAD.
  package-nerd-significance:
    - >
      madplay is historically significant because it packages the front end to libmad, a
      GPL fixed-point MP3 decoder that showed up across many Unix media applications and
      ports. It is a small package, but it represents an older era of audio packaging
      where decoder accuracy, patent-era MP3 support, integer arithmetic, and
      command-line playback all mattered.
  project-history:
    - >
      Underbit distributes MAD as libmad, the madplay command-line front end, and the
      libid3tag ID3 tag library. The project emphasizes 24-bit PCM output, fixed-point
      integer computation, and a new implementation based on ISO/IEC standards rather
      than derivation from the ISO reference source.
  related-projects:
    - >
      madplay is related to libmad, libid3tag, mpg123, mpg321, LAME, GStreamer, MPlayer,
      VideoLAN Client, XMMS MAD plugins, and other Unix audio players and media
      frameworks listed on the official MAD applications page.
  sources:
    - https://www.underbit.com/products/mad
  summary:
    - >
      madplay is the command-line front end distributed with MAD, the MPEG Audio Decoder
      from Underbit Technologies. The official MAD page describes MAD as a high-quality
      MPEG audio decoder implementing MPEG-1, MPEG-2 lower sampling frequency
      extensions, the de facto MPEG 2.5 format, and all three MPEG audio layers
      including MP3.
  timeline:
    - >
      Official distribution: Underbit distributes MAD source via FTP and SourceForge
      mirror rather than an official HTTP source-control repository.
    - >
      Official package history: Underbit documents libmad, madplay, and libid3tag
      together as the MAD software distribution.
    - >
      Third-party packaging: Underbit notes third-party packages for Debian, FreeBSD,
      and NetBSD.
  usage:
    - >
      madplay is used as a simple CLI audio player and decoder for MPEG audio streams,
      especially MP3 files. Package users typically install it when they want a small
      command-line player or a known-good libmad-based decoder for testing and
      scripting.
related-packages:
  - id: brew:mpg123
    reason: >
      Choose mpg123 when you want an actively maintained console player plus reusable
      decoding and audio-output libraries; choose madplay when you specifically need the
      fixed-point libmad stack and its 24-bit PCM output.
    rel: alternative
    sources:
      - https://www.underbit.com/products/mad/
      - https://www.mpg123.de/
