history:
  adoption-history:
    - >
      Geekbench became widely used for cross-platform comparisons because it exposes a
      consistent workload suite on desktop and mobile operating systems. Primate Labs
      states that processor, semiconductor, device, and automotive companies use the
      benchmark in engineering and evaluation workflows.
  package-nerd-significance:
    - >
      Geekbench scores are a recurring reference point in hardware-release discussions,
      architecture comparisons, laptop reviews, and performance-regression
      investigations. Package users value a predictable way to install the benchmark on
      fleets or freshly configured machines, while careful users track the major version
      because scores from different generations are not directly interchangeable.
  project-history:
    - >
      Primate Labs developed Geekbench as a cross-platform system benchmark. Its public
      release history includes Geekbench 2 in 2007 and successive major revisions that
      updated workloads and datasets as computer use changed.
    - >
      Geekbench 6 arrived in 2023 with larger modern datasets, machine-learning-related
      workloads, and a redesigned multi-core model that measures cores cooperating on
      shared tasks. Geekbench 7 followed in 2026 according to the official blog archive.
  related-projects:
    - Geekbench Browser
    - Geekbench AI
    - Geekbench command-line tools
  sources:
    - https://www.geekbench.com/
    - https://www.geekbench.com/blog/2023/02/geekbench-6/
    - https://www.geekbench.com/blog/archive/
    - https://www.geekbench.com/doc/geekbench6-benchmark-internals.pdf
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Geekbench is Primate Labs’ cross-platform benchmark suite for measuring and
      comparing CPU and GPU performance using workloads intended to reflect real-world
      computing tasks.
  timeline:
    - '2007: Primate Labs announced Geekbench 2.'
    - '2019: Geekbench 5 was released.'
    - '2023: Geekbench 6 introduced updated workloads, datasets, and multi-core scaling.'
    - '2026: The official blog archive records the release of Geekbench 7.'
  usage:
    - >
      Users run the CPU or GPU benchmark, upload results to Geekbench Browser, and
      compare devices that used the same Geekbench generation. Personal users,
      reviewers, developers, hardware engineers, and managed test labs use it for
      baseline comparison and regression investigation.
