id: brew:kargo
display-name: Kargo
homepage: https://kargo.io/
repo: https://github.com/akuity/kargo
docs:
  - https://docs.kargo.io/
  - https://github.com/akuity/kargo#readme
config-file-location:
  unix: ~/.config/kargo/config
credentials-file-location:
  unix: ~/.config/kargo/config
history:
  adoption-history:
    - >
      Kargo's adoption story is tied to Argo CD users who wanted
      environment-to-environment promotion without maintaining custom CI scripts for
      every stage. Akuity announced Kargo 1.0 general availability on October 22, 2024,
      and later described use by organizations including Deutsche Telekom, JumpCloud,
      and Cisco ThousandEyes in GitOps promotion workflows.
  package-nerd-significance:
    - >
      Kargo is a newer kind of DevOps package: a Kubernetes controller ecosystem with a
      local CLI, GitOps vocabulary, and tight integration with another major CNCF
      project family. Its package history shows how Homebrew increasingly carries not
      just standalone CLIs, but entry points into controller-based delivery platforms.
  project-history:
    - >
      Kargo was created by Akuity, whose team is closely associated with Argo, to
      address the promotion layer that sits after CI has built artifacts and before or
      alongside Argo CD synchronization. The project models warehouses, freight, stages,
      and promotions so teams can describe how changes move from development through
      production.
  related-projects:
    - Argo CD is the primary GitOps tool Kargo complements.
    - Akuity Platform is the commercial platform around Kargo and Argo CD.
    - >
      CI systems, Git repositories, Helm, Kustomize, and container registries are common
      systems Kargo promotions coordinate with.
  sources:
    - >
      https://akuity.io/blog/announcing-kargo-version-1-0-now-generally-available-on-the-akuity-platform
    - >
      https://akuity.io/blog/what-s-new-in-kargo-v1-3-smarter-gitops-with-conditional-steps-advanced-verification
    - https://docs.kargo.io/
    - https://docs.kargo.io/roadmap
    - https://github.com/akuity/kargo
    - https://kargo.io/
  summary:
    - >
      Kargo is Akuity's GitOps continuous-promotion system for moving Kubernetes
      application changes through staged environments.
  timeline:
    - >
      2024: Akuity described Kargo v0.5 and v0.7 releases as milestones toward general
      availability.
    - >
      2024-10-22: Akuity announced Kargo version 1.0 as generally available on the
      Akuity Platform.
    - '2025: Kargo v1.3 added conditional step execution for promotion workflows.'
  usage:
    - >
      Teams use Kargo to watch for changed artifacts, update Git or rendered manifests,
      coordinate promotion steps, and hand off synchronization to Argo CD. The CLI
      package matters for operators who create and inspect Kargo resources from local
      shells or CI jobs.
related-packages:
  - id: brew:argocd
    reason: >
      Kargo supplies multi-stage promotion and verification above Argo CD, which then
      synchronizes the promoted desired state into Kubernetes clusters.
    rel: adjacent_workflow
    sources:
      - https://docs.kargo.io/
      - >
        https://akuity.io/blog/announcing-kargo-version-1-0-now-generally-available-on-the-akuity-platform
      - https://argo-cd.readthedocs.io/
category: developer-tools
