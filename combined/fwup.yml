id: brew:fwup
display-name: fwup
homepage: https://github.com/fwup-home/fwup
repo: https://github.com/fwup-home/fwup
docs:
  - https://github.com/fwup-home/fwup/tree/main/docs
  - https://github.com/fwup-home/fwup#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      fwup is distributed through release artifacts and several package managers. The
      README names Homebrew for macOS, Linux packages, Chocolatey for Windows, Alpine,
      Buildroot, Yocto via meta-fwup, and version-manager support through asdf-fwup and
      mise.
    - >
      The README points to the Nerves Project as a better-maintained source of examples,
      which reflects fwup's practical role in the Nerves embedded Elixir ecosystem and
      embedded Linux image update workflows.
  package-nerd-significance:
    - >
      fwup matters to package maintainers because it packages firmware update policy,
      payloads, signing, partition manipulation, metadata, progress reporting, and
      failure behavior into one portable artifact format.
    - >
      It is also a useful counterexample to application-level update tools: its domain
      is block devices, boot partitions, sparse writes, and embedded recovery flows,
      where package-manager semantics meet physical storage constraints.
  project-history:
    - >
      The public repository was created in June 2014. GitHub release metadata shows 0.x
      releases in 2015, and the 1.x line continued through the mid-2020s.
    - >
      The README describes a design focused on minimal dependencies, streaming archive
      processing, careful write ordering, verification, and limited scripting so that
      failure modes on embedded targets are easier to reason about.
    - >
      Recent changelog entries show continued work on delta updates, encrypted
      partitions, block cache sizing, U-Boot environment handling, and package
      dependencies for static builds.
  related-projects:
    - asdf-fwup and mise support manage fwup versions with `.tool-versions` files.
    - meta-fwup supports Yocto integration, and Buildroot includes upstream support.
    - The Nerves Project and nerves_system_br are related embedded Linux users and examples.
  sources:
    - https://api.github.com/repos/fwup-home/fwup
    - https://github.com/fwup-home/fwup
    - https://github.com/fwup-home/fwup/releases
    - https://raw.githubusercontent.com/fwup-home/fwup/main/CHANGELOG.md
    - https://raw.githubusercontent.com/fwup-home/fwup/main/README.md
  summary:
    - >
      fwup is an embedded Linux firmware update creator and runner. It packages update
      logic and payloads into standard ZIP-based `.fw` archives and applies them using
      configurable tasks such as full image writes, A/B partition swaps, recovery
      updates, and trial update or failback flows.
  timeline:
    - '2014: Public GitHub repository created.'
    - '2015: Early 0.x releases published.'
    - '2016: README notes Buildroot support included upstream since Buildroot 2016.05.'
    - >
      2024: 1.12.0 adds features such as extended MBR partitions and Raspberry Pi
      tryboot support.
    - '2025: 1.13.x and 1.14.x improve delta updates and metadata handling.'
    - '2026: 1.15.x and 1.16.0 improve encrypted update performance and block-cache sizing.'
  usage:
    - >
      Users create firmware archives with a `fwup.conf` file, apply `.fw` archives to
      devices or image files, generate signing keys, verify or sign archives, and use
      `img2fwup` to convert raw images to `.fw` files.
    - >
      The tool is deliberately not an update distribution service. Upstream
      documentation expects users to deliver `.fw` files through external media, network
      streams, Ansible, or other deployment tooling.
related-packages:
  - id: brew:asdf
    reason: >
      asdf can install and pin fwup through the official asdf-fwup plugin, keeping its
      version in the same committed `.tool-versions` file as other project tools.
    rel: adjacent_workflow
    sources:
      - https://github.com/fwup-home/fwup
      - https://github.com/fwup-home/asdf-fwup
      - https://asdf-vm.com/
  - id: brew:mise
    reason: >
      mise can use the official asdf-fwup plugin and read `.tool-versions`, providing
      automatic project-level activation for the fwup version used by a firmware build.
    rel: adjacent_workflow
    sources:
      - https://github.com/fwup-home/fwup
      - https://github.com/fwup-home/asdf-fwup
      - https://mise.jdx.dev/
category: system
package-manager:
  apk: fwup
  brew: fwup
  macports: fwup
  nix: fwup
  scoop: extras/fwup
package-manager-url: https://formulae.brew.sh/formula/fwup
license: Apache-2.0
tags:
  - cli
  - embedded-linux
  - firmware
  - image-updates
  - software-updates
description: Configurable embedded Linux firmware update creator and runner
executables:
  - fwup
  - img2fwup
provenance:
  formula: fwup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
