id: brew:excalidraw-converter
display-name: excalidraw-converter
homepage: https://github.com/sindrel/excalidraw-converter
repo: https://github.com/sindrel/excalidraw-converter
docs:
  - https://github.com/sindrel/excalidraw-converter#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is niche but visible for documentation workflows. The README documents
      Homebrew installation for macOS, release downloads for other operating systems,
      and compatibility with Gliffy, draw.io, Mermaid, GitHub/GitLab Markdown rendering,
      MkDocs, Docusaurus, and Obsidian Excalidraw exports.
  package-nerd-significance:
    - >
      The package is a small bridge between whiteboard-style drawing and
      documentation-as-code. It is useful to package because it turns a GUI drawing
      artifact into formats that can live in wikis, Markdown, and diagramming tools.
  project-history:
    - >
      The GitHub repository was created on 2021-03-28, and its first release, v0.0.1,
      was published the same day. The README states the motivation plainly: Excalidraw
      is useful for sketching during design, but diagrams often need to be redone for
      documentation, and the tool bridges those tasks.
  related-projects:
    - >
      The README centers the tool around Excalidraw, Gliffy, draw.io, Mermaid, and
      Excalidraw for Obsidian.
  sources:
    - https://github.com/sindrel/excalidraw-converter
    - https://raw.githubusercontent.com/sindrel/excalidraw-converter/master/README.md
    - https://api.github.com/repos/sindrel/excalidraw-converter
    - https://api.github.com/repos/sindrel/excalidraw-converter/releases?per_page=100
  summary:
    - >
      excalidraw-converter is a Go command-line tool for converting Excalidraw diagrams
      into Gliffy-compatible, draw.io-compatible, and Mermaid formats.
  timeline:
    - '2021: Repository created and v0.0.1 released.'
    - '2021 onward: README documents Homebrew installation and binary release downloads.'
    - '2026: GitHub repository metadata shows continued updates.'
  usage:
    - >
      Users run exconv with a subcommand and input file, such as exconv gliffy -i
      my-diagram.excalidraw or exconv mermaid -i my-diagram.excalidraw. Gliffy output
      can be imported into Gliffy or draw.io; Mermaid output can be pasted into
      Markdown-oriented documentation systems.
    - >
      The README documents support for fixed shapes, connected arrows, text, styling,
      and selected Excalidraw constructs, while noting limitations such as Mermaid
      flowchart-only output and incomplete support for some rich Excalidraw elements.
related-packages:
  - id: brew:mermaid-cli
    reason: >
      Use Mermaid CLI after exconv's Mermaid conversion to render the generated
      definition as SVG, PNG, or PDF.
    rel: adjacent_workflow
    sources:
      - https://github.com/sindrel/excalidraw-converter#mermaid
      - https://github.com/mermaid-js/mermaid-cli#readme
  - id: cask:drawio
    reason: >
      Use draw.io to open or edit the Gliffy-compatible files produced by exconv when a
      graphical editor is preferable to Mermaid output.
    rel: adjacent_workflow
    sources:
      - https://github.com/sindrel/excalidraw-converter#compatibility-with-drawio
      - https://www.diagrams.net/
category: productivity
package-manager:
  brew: excalidraw-converter
package-manager-url: https://formulae.brew.sh/formula/excalidraw-converter
license: MIT
tags:
  - cli
  - diagram-conversion
  - drawio
  - excalidraw
  - gliffy
  - mermaid
description: Command-line tool for porting Excalidraw diagrams to Gliffy
executables:
  - excalidraw-converter
  - exconv
provenance:
  formula: excalidraw-converter
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
