id: brew:memcache-top
display-name: memcache-top
homepage: https://code.google.com/archive/p/memcache-top/
repo: https://code.google.com/archive/p/memcache-top/source/default/source
docs:
  - https://code.google.com/archive/p/memcache-top
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project attracted enough package interest to remain available as a Homebrew
      formula. Its Google Code archive records 172 stars and labels around memcached,
      Perl, stats, CLI, and monitoring, which fits its role as a small operations tool
      rather than a standalone service.
  package-nerd-significance:
    - >
      memcache-top is the kind of package that persists because operators like
      single-purpose terminal tools. It predates many modern dashboards and gives
      package collections a tiny dependency-light way to inspect memcached fleets from a
      shell.
  project-history:
    - >
      The archived Google Code project says the author wanted a simple, portable,
      lightweight command-line tool for real-time memcache or memcached stats and could
      not find a comparable tool at the time. The implementation intentionally avoided
      requiring memcached-specific Perl modules and degraded optional behavior when
      noncritical Perl modules were absent.
    - >
      The public Google Code downloads show a fast early release sequence in April 2009,
      from v0.3 through v0.6. Google Code later became an archive, leaving the project
      as a small historical utility rather than an actively developed upstream.
  related-projects:
    - >
      memcache-top is built around memcached's stats protocol and belongs with other
      terminal monitoring tools that mimic the interaction model of `top` for specific
      daemons.
  sources:
    - https://code.google.com/archive/p/memcache-top
    - >
      https://storage.googleapis.com/google-code-archive/v2/code.google.com/memcache-top/downloads-page-1.json
    - >
      https://storage.googleapis.com/google-code-archive/v2/code.google.com/memcache-top/project.json
    - source_facts.package-manager-url
  summary:
    - >
      memcache-top is a Perl command-line monitor for memcached statistics, built to
      show a top-like, periodically refreshing view of one or more memcached instances.
  timeline:
    - '2009-04-22: v0.3 uploaded to Google Code downloads.'
    - '2009-04-28: v0.6 uploaded as the featured Google Code download.'
    - '2016: Google Code archive storage preserves the project source archive.'
  usage:
    - >
      Users pass memcached instances and options such as port, sleep interval, color,
      lifetime stats, byte counters, command counters, cumulative display, and
      thresholds. The output summarizes usage, hit percentage, connections, response
      time, evictions, reads, writes, and optional gets/sets across instances.
related-packages:
  - id: brew:memcached
    reason: >
      Run Memcached as the cache server whose live statistics memcache-top retrieves and
      displays.
    rel: adjacent_workflow
    sources:
      - https://code.google.com/archive/p/memcache-top/
      - https://docs.memcached.org/serverguide/maintenance/
category: developer-tools
package-manager:
