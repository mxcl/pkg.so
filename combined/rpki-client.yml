id: brew:rpki-client
display-name: rpki-client
homepage: https://www.rpki-client.org/
repo: https://github.com/rpki-client/rpki-client-portable
docs:
  - https://man.openbsd.org/rpki-client
  - https://www.rpki-client.org/
config-file-location:
  unix:
    - /etc/rpki/*.tal
    - /etc/rpki/*.constraints
    - /etc/rpki/skiplist
credentials-file-location: null
history:
  adoption-history:
    - >
      rpki-client ships as an OpenBSD base component on the project's six-month release
      cadence. Its portable build framework brought it to FreeBSD, Linux, and macOS, and
      official installation material notes packages for Alpine, Debian, Ubuntu, Fedora,
      FreeBSD, MacPorts, and Homebrew.
  package-nerd-significance:
    - >
      rpki-client packages Internet routing-security machinery as a focused Unix utility
      with conservative parsing and privilege separation inherited from OpenBSD. Network
      operators value its direct production of OpenBGPD and BIRD configuration data,
      while package maintainers care about its portable compatibility layer and
      security-sensitive dependency stack.
  project-history:
    - >
      rpki-client was developed within the OpenBSD Project by Kristaps Dzonsons, Claudio
      Jeker, Job Snijders, Theo de Raadt, Sebastian Benoit, and Theo Buehler. A
      separately maintained portable framework, modeled in part on OpenSSH and LibreSSL
      portability work, adapts the OpenBSD code for other Unix-like systems.
  related-projects:
    - >
      OpenBGPD and BIRD consume its validated routing payloads. The portable framework
      borrows approaches from OpenSSH and LibreSSL and supports OpenSSL or
      LibreSSL-derived cryptographic libraries, libtls, Expat, and zlib.
  sources:
    - 'Official manual: https://man.openbsd.org/rpki-client'
    - 'Official portable repository: https://github.com/rpki-client/rpki-client-portable'
    - 'Official portable-release page: https://www.rpki-client.org/portable.html'
    - 'Official project site: https://www.rpki-client.org/'
  summary:
    - >
      rpki-client is OpenBSD's relying-party validator for the Resource Public Key
      Infrastructure, used to validate RPKI repositories and produce routing-security
      payloads for BGP software.
  timeline:
    - '2019–2020 era: rpki-client emerges as an OpenBSD RPKI validator and portable project.'
    - 'Subsequent OpenBSD releases: It ships as a base-system component on a six-month cadence.'
    - '2020s: Portable releases broaden support to FreeBSD, Linux, and macOS.'
    - '2026: Portable release 9.8 continues validation, compatibility, and security hardening.'
  usage:
    - >
      Operators run rpki-client to synchronize RPKI repositories over RRDP, HTTPS, and
      rsync, validate certificates and signed objects, and emit VRPs, BGPsec router
      keys, and ASPA payloads. Outputs are available for OpenBGPD, BIRD, CSV, JSON, and
      metrics consumers; offline and individual-object inspection modes support
      operations and debugging.
category: networking
package-manager:
  apk: rpki-client
  brew: rpki-client
  debian: rpki-client
  dnf: rpki-client
  macports: rpki-client
  ubuntu: rpki-client
package-manager-url: https://formulae.brew.sh/formula/rpki-client
license: ISC
tags:
  - bgp
  - cli
  - openbsd
  - routing-security
  - rpki
description: OpenBSD portable rpki-client
executables:
  - rpki-client
provenance:
  formula: rpki-client
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
