id: brew:freerdp
display-name: FreeRDP
homepage: https://www.freerdp.com/
repo: https://github.com/FreeRDP/FreeRDP
docs:
  - https://github.com/FreeRDP/FreeRDP/wiki
  - https://github.com/FreeRDP/FreeRDP#readme
  - https://pub.freerdp.com/api
config-file-location:
  unix:
    - ${SYSCONF_DIR}/xfreerdp.json
    - ${SYSCONF_DIR}/certificates.json
credentials-file-location: null
history:
  adoption-history:
    - >
      FreeRDP's adoption is tied to the need for interoperable RDP outside Microsoft's
      own clients. The project's own history calls it the standard client implementation
      where no native Microsoft client is available, and official site posts describe
      downstream use in related remote-desktop projects such as Remmina and Myrtille.
    - >
      Because FreeRDP exposes libfreerdp as well as end-user clients such as xfreerdp
      and sdl-freerdp, it became both an application package and an infrastructure
      library for remote desktop front ends, thin-client systems, and RDP gateways.
  package-nerd-significance:
    - >
      FreeRDP matters to package maintainers because it is a protocol implementation, a
      CLI client set, and a C library stack in one package. It pulls together
      fast-moving security updates, optional multimedia backends, platform-specific
      clients, and the WinPR compatibility layer, so downstream packaging decisions
      affect both desktop users and dependent remote-access software.
    - >
      It is also a useful case study in open implementations of proprietary network
      protocols: packagers care about which RDP extensions are enabled, how TLS and
      smart-card support are built, and which client binaries are shipped.
  project-history:
    - >
      The official project history describes FreeRDP as starting as a fork and later
      becoming a multi-platform implementation with Linux, Windows, macOS, iOS, and
      Android clients. The modern project also includes WinPR, the Windows Portable
      Runtime, which provides Windows API compatibility pieces used by FreeRDP on
      non-Windows systems.
    - >
      The project announced FreeRDP 1.0 in January 2012 and has continued as an actively
      maintained RDP implementation. Current release notes show the 3.x line adding
      client, proxy, gateway, Android, codec, and security work while tracking Microsoft
      protocol extensions.
  related-projects:
    - >
      WinPR is part of the FreeRDP project and supplies portable Windows API
      compatibility for non-Windows platforms.
    - >
      Remmina is an official-site-highlighted multiprotocol remote desktop client that
      supports RDP via libfreerdp.
    - >
      Myrtille is an HTML remote desktop project whose official FreeRDP guest post
      describes resynchronizing its FreeRDP fork with the main repository.
  sources:
    - https://github.com/FreeRDP/FreeRDP
    - https://raw.githubusercontent.com/FreeRDP/FreeRDP/master/ChangeLog
    - https://www.freerdp.com/
    - https://www.freerdp.com/2012/01/16/freerdp-1-0-released
    - https://www.freerdp.com/2019/01/16/hi-freerdp-history
    - https://www.freerdp.com/2019/01/23/hi-remmina
    - https://www.freerdp.com/2020/11/09/hi-myrtille
  summary:
    - >
      FreeRDP is a free implementation of Microsoft's Remote Desktop Protocol,
      distributed as both libraries and client/server command-line programs. In package
      terms it is the portable RDP stack many Unix-like desktops, remote-access tools,
      and automation workflows build around when the native Microsoft client is
      unavailable or unsuitable.
  timeline:
    - '2012: FreeRDP 1.0 released by the project.'
    - >
      2019: Official project history describes FreeRDP as a multi-platform RDP
      implementation and identifies WinPR as part of the project.
    - >
      2025: Official release posts continue the 3.x series with maintenance and
      protocol-facing improvements.
    - >
      2026: 3.27.x release notes document active work on security, gateway behavior,
      Android support, clipboard handling, and Azure/Entra compatibility.
  usage:
    - >
      Typical package usage is direct interactive connection to Windows hosts with
      xfreerdp or SDL-based clients, plus library linking by graphical remote desktop
      applications. The official README points users to the wiki, API documentation,
      release downloads, Microsoft Open Specifications references, and compilation
      instructions.
    - >
      Modern release notes emphasize security fixes, RDP gateway behavior, clipboard and
      device redirection, Android client work, codec support, proxy features, and
      compatibility with Azure and Entra related authentication extensions.
related-packages:
  - id: brew:tigervnc
    reason: >
      Choose TigerVNC when the remote system exposes the VNC/RFB protocol; choose
      FreeRDP for Microsoft RDP features such as Network Level Authentication,
      RemoteApp, and RDP gateway support.
    rel: alternative
    sources:
      - https://tigervnc.org/
      - https://github.com/FreeRDP/FreeRDP#readme
category: networking
