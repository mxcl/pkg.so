id: brew:libbladerf
display-name: libbladeRF
homepage: https://nuand.com/
repo: https://github.com/Nuand/bladeRF
docs:
  - https://nuand.com/libbladeRF-doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libbladeRF is adopted primarily by SDR users who own bladeRF hardware, rather than
      by general networking software. Its package-manager presence matters because
      installing the host tools on macOS or Linux gives users `bladeRF-cli`, firmware
      update commands, and a C API without building the whole hardware support stack by
      hand.
  package-nerd-significance:
    - >
      This is a hardware package wearing a Unix package's clothes. It has shared-library
      ABI concerns, command-line tools, firmware images, FPGA bitstreams, USB access,
      and calibration workflows, so it is exactly the kind of formula where package
      maintainers must respect both software dependencies and physical-device behavior.
  project-history:
    - >
      Nuand built bladeRF as an open source USB 3.0 software-defined radio platform,
      with the project repository carrying the host software, firmware, FPGA sources,
      and utilities needed to program and operate the boards. The README's quick start
      leads users from cloning the repository to installing libbladeRF and running
      `bladeRF-cli` against attached hardware.
    - >
      The release history shows the host library evolving with the hardware. The 2016.06
      release added clock and synchronization features, the 2018.08 line introduced
      libbladeRF v2.0 and bladeRF 2.0 Micro support, and later releases added packet
      mode, Wishbone-related features, 8-bit format mode, and continued FPGA/firmware
      updates.
  related-projects:
    - >
      bladeRF-cli, bladeRF-fsk, bladeRF-wiphy, GNU Radio-style SDR workflows, FPGA
      images, FX3 firmware, MATLAB and Python bindings, and out-of-tree radio cores are
      the closest ecosystem pieces.
  sources:
    - https://github.com/Nuand/bladeRF
    - https://raw.githubusercontent.com/Nuand/bladeRF/master/CHANGELOG
    - https://raw.githubusercontent.com/Nuand/bladeRF/master/README.md
    - https://www.nuand.com/
    - https://www.nuand.com/2025-10-release/
    - https://www.nuand.com/bladerf-fsk-modem-update/
  summary:
    - >
      libbladeRF is the host library and tool suite for Nuand's bladeRF software-defined
      radio hardware. The upstream repository combines host-side C libraries and
      utilities, Cypress FX3 firmware, FPGA HDL, drivers, samples, and supporting
      documentation.
  timeline:
    - >
      2016: Release 2016.06 adds SMB clock control, synchronization trigger support,
      XB-300 support, and related firmware changes.
    - '2018: Release 2018.08 introduces libbladeRF v2.0 and bladeRF 2.0 Micro support.'
    - >
      2020: Release 2020.12 adds packet mode support across libbladeRF, FX3 firmware,
      and FPGA logic.
    - >
      2021: Release 2021.10 adds Wishbone master core support and bladeRF 2.0 micro xA5
      support.
    - '2023: Release 2023.02 adds 8-bit format mode and AD936x overclocking support.'
    - >
      2025: Nuand's 2025.10 release post describes throughput, stability, and streaming
      upgrades for bladeRF 2.0 micro.
  usage:
    - >
      Users run `bladeRF-cli` to probe devices, inspect versions, load FPGA images,
      update firmware, configure RF parameters, and stream samples. Developers use
      libbladeRF as the host API for receive/transmit streaming and device control,
      while the repository also includes MATLAB, Simulink, Python, firmware, and FPGA
      pieces.
related-packages:
  - id: brew:gnuradio
    reason: >
      GNU Radio provides graphical signal-processing flowgraphs, while Nuand documents
      bladeRF source and sink support that uses the bladeRF host stack to communicate
      with the radio.
    rel: adjacent_workflow
    sources:
      - https://github.com/Nuand/gr-bladeRF
      - https://github.com/Nuand/bladeRF/wiki/Getting-Started%3A-Linux
      - https://www.gnuradio.org/
  - id: brew:soapysdr
    reason: >
      SoapySDR provides a vendor-neutral SDR API, and Nuand's official wiki documents a
      bladeRF plugin for using the hardware through that abstraction.
    rel: adjacent_workflow
    sources:
      - https://github.com/Nuand/bladeRF/wiki
      - https://github.com/pothosware/SoapySDR
category: networking
