id: brew:gtranslator
display-name: GNOME Translation Editor
homepage: https://wiki.gnome.org/Design/Apps/Translator
repo: https://gitlab.gnome.org/GNOME/gtranslator
docs:
  - https://gitlab.gnome.org/GNOME/gtranslator
  - https://wiki.gnome.org/Apps/Gtranslator
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gtranslator's adoption is closely tied to GNOME localization rather than
      general-purpose text editing. The design wiki frames the application around clear
      translation workflows, string navigation, fuzzy/untranslated status, comments,
      source-code location, and built-in translation-memory suggestions.
    - >
      The input package facts show broad distro packaging across Alpine, Debian, Fedora,
      Homebrew, Nix, Arch, Ubuntu, and openSUSE. That matches its role as a specialized
      desktop productivity tool that distributions include for translators working with
      gettext PO files.
  package-nerd-significance:
    - >
      gtranslator is package-nerd significant because it packages a workflow that often
      lives between translators, maintainers, and release engineers. It is not only a PO
      text editor: it carries translation memory, profile metadata, plural-form
      handling, comments, status visibility, and GNOME Damned Lies integration.
    - >
      Its history also mirrors GNOME application platform migration. The move through
      GNOME 3 HIG redesign, Damned Lies integration, GNOME 40 versioning, GTK 4,
      libadwaita, and libspell makes it a compact case study in how GNOME desktop
      applications evolve while serving a specialized contributor audience.
  project-history:
    - >
      The GNOME wiki describes the application as formerly known as Gtranslator and as
      an enhanced gettext PO file editor for the GNOME desktop environment. It lists
      features such as opening several PO files in tabs, plural forms support, automatic
      headers update, comments editing, translator profiles, translation memories,
      initial profile and translation-memory assistants, search, quick navigation,
      whitespace highlighting, and message syntax highlighting.
    - >
      The GNOME source archive shows gtranslator tarballs across multiple eras: 1.0 and
      1.1 directories, 2.90 and 2.91 development-era directories, GNOME 3.30 through
      3.38 releases, and later GNOME version-numbered releases. The upstream NEWS file
      records major application shifts, including a 3.30.0 interface redesign for the
      GNOME 3 HIG, initial Damned Lies integration in 3.33.90, an Open from DL button in
      3.36.0, broader DL file handling in 3.38.0, and desktop-app integration with
      l10n.gnome.org in 40.0.
    - >
      In the 45 series, NEWS records the GTK 4 migration and use of libadwaita, along
      with libspell spell checking and a large refactor for the migration. Later NEWS
      entries continue with libadwaita widget updates, async Damned Lies requests, UI
      simplifications, D-Bus activation, browser source-code viewing for translations,
      and PO-file update support from updated POT templates.
  related-projects:
    - gettext and PO files define the document format and translation workflow.
    - >
      GNOME, Damned Lies, and l10n.gnome.org define the upstream localization workflow
      integration.
    - >
      GTK, libadwaita, libspell, and GNOME HIG conventions define the
      application-platform context.
    - >
      Poedit, Lokalize, Virtaal, Qt Linguist, and Transifex appear in the GNOME design
      page as comparison or reference tools.
  sources:
    - https://download.gnome.org/sources/gtranslator/
    - https://download.gnome.org/sources/gtranslator/40/
    - https://download.gnome.org/sources/gtranslator/49/
    - https://gitlab.gnome.org/GNOME/gtranslator/-/raw/master/NEWS
    - https://wiki.gnome.org/Apps/Gtranslator
    - https://wiki.gnome.org/Design/Apps/Translator
  summary:
    - >
      GNOME Translation Editor, formerly Gtranslator, is a gettext PO-file editor for
      the GNOME desktop. It packages a translator-focused GUI around PO files,
      translation memory, plural forms, profiles, comments, message tables, and GNOME
      localization workflow.
  timeline:
    - '2009-2010: GNOME source archive includes 1.1 and 1.9 gtranslator release directories.'
    - >
      2012: The 2.90 and 2.91 release lines include plugin, app-menu, GResource,
      translation-memory, and GTK build work.
    - >
      2018-11-03: Version 3.30.0 records a full interface redesign for the GNOME 3 HIG
      and removal of the plugin system.
    - '2019-08-05: Version 3.33.90 records initial Damned Lies integration.'
    - '2020-03-14: Version 3.36.0 records a new search/replace popover and Open from DL button.'
    - >
      2021-03-23: Version 40.0 records l10n.gnome.org integration for reserving and
      uploading files from the desktop app.
    - '2022-03-30: Version 42.0 records preparation for the GTK 4 migration.'
    - >
      2023-09-21: Version 45.1 records GTK 4 migration, libadwaita use, libspell spell
      checking, and a large refactor.
    - >
      2025-09-13: Version 49.0 records D-Bus activation and a browser action for viewing
      translation source code.
  usage:
    - >
      A translator opens one or more PO files, navigates the message table, edits
      translated strings and comments, handles plural forms, uses search and replace,
      updates headers, and relies on translation memory and profiles to reduce repeated
      work. GNOME workflow features include downloading, reserving, and uploading files
      through l10n.gnome.org integration where configured.
    - >
      For packagers, the application sits at the intersection of gettext, GTK, GNOME
      HIG/libadwaita UI conventions, spell checking, and localization infrastructure. It
      is an end-user GUI, but its data format and workflows are developer-adjacent.
related-packages:
  - id: brew:gettext
    reason: >
      GNU gettext supplies the PO catalog format and command-line extraction, merge,
      compilation, and validation tools used before and after editing translations in
      GNOME Translation Editor.
    rel: adjacent_workflow
    sources:
      - https://wiki.gnome.org/Apps/Gtranslator
      - https://www.gnu.org/software/gettext/manual/gettext.html
category: productivity
