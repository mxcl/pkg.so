id: brew:mcp-atlassian
display-name: MCP Atlassian
homepage: https://github.com/sooperset/mcp-atlassian
repo: https://github.com/sooperset/mcp-atlassian
docs:
  - https://mcp-atlassian.soomiles.com/
  - https://mcp-atlassian.soomiles.com/llms-full.txt
  - https://mcp-atlassian.soomiles.com/llms.txt
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      By July 2026, official GitHub metadata showed thousands of stars and more than a
      thousand forks, unusually high visibility for a narrowly scoped integration
      server. The supplied package facts list Homebrew packaging, while the README also
      advertises PyPI version and download badges.
    - >
      The project is part of the practical MCP server wave: teams want AI assistants to
      search tickets, inspect Confluence pages, and create or update Jira issues without
      bespoke integrations in every client.
  package-nerd-significance:
    - >
      For package managers, mcp-atlassian is significant because it packages a workplace
      integration as a local MCP server rather than as a SaaS connector. The value is in
      making a complex enterprise API surface installable as a command.
  project-history:
    - >
      The repository was created in December 2024, shortly after the Model Context
      Protocol ecosystem began expanding around local tool servers. The project
      publishes dedicated documentation at mcp-atlassian.soomiles.com as well as an
      llms.txt and llms-full.txt documentation surface.
    - >
      The README documents uvx, Docker, pip, and source installation paths, along with
      environment-variable configuration for Jira and Confluence URLs, usernames, API
      tokens, and personal access tokens.
  related-projects:
    - >
      Related projects include other MCP servers for developer and workplace systems,
      plus the broader Model Context Protocol specification documented at
      modelcontextprotocol.io.
  sources:
    - https://github.com/sooperset/mcp-atlassian
    - https://github.com/sooperset/mcp-atlassian#readme
    - https://mcp-atlassian.soomiles.com/
    - https://mcp-atlassian.soomiles.com/docs/authentication
    - https://mcp-atlassian.soomiles.com/docs/configuration
    - https://modelcontextprotocol.io/introduction
    - source_facts.package-manager
  summary:
    - >
      MCP Atlassian is a Model Context Protocol server for Jira and Confluence. Its
      official README describes support for Atlassian Cloud and Server/Data Center
      deployments and presents it as a bridge between MCP-compatible AI clients and
      Atlassian work data.
  timeline:
    - '2024-12: GitHub repository created.'
    - '2025-2026: Dedicated documentation site and llms.txt documentation surfaces maintained.'
    - '2026-04: v0.21.1 published on GitHub releases.'
    - >
      2026-07: Repository metadata showed high star and fork counts for an MCP
      integration server.
  usage:
    - >
      The quick start has users create an Atlassian API token, add an mcp-atlassian
      command to an MCP client configuration, and pass Jira and Confluence connection
      details through environment variables.
    - >
      Documented use cases include searching Jira with JQL, fetching issues, creating
      and updating issues, searching Confluence with CQL, reading pages, creating pages,
      and adding comments.
