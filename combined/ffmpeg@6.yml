id: brew:ffmpeg@6
display-name: FFmpeg 6
homepage: https://ffmpeg.org/
repo: https://git.ffmpeg.org/ffmpeg.git
docs:
  - https://ffmpeg.org/documentation.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Because many applications link against FFmpeg libraries rather than only shelling
      out to the CLI, package managers often preserve older major lines. Homebrew's
      ffmpeg@6 gives dependents and users a 6.x target while the default package can
      track later upstream releases.
  package-nerd-significance:
    - >
      This formula is significant because FFmpeg's library set is both wide and
      fast-moving. A versioned 6.x formula reduces rebuild pressure and lets package
      maintainers stage transitions instead of treating every FFmpeg upgrade as a flag
      day.
  project-history:
    - >
      FFmpeg is a portable multimedia project with command-line tools for converting,
      playing, and probing media, and libraries for codecs, formats, filters, devices,
      scaling, and resampling. The 6.1 branch was cut from master on 2023-10-29;
      Homebrew's ffmpeg@6 formula follows the 6.1.x upstream tarballs, including 6.1.6.
  related-projects:
    - >
      FFmpeg 4, FFmpeg 5, and FFmpeg 7 are adjacent parallel FFmpeg formulae. FFMS2
      follows FFmpeg API changes closely and later made FFmpeg 6.1 its minimum
      requirement.
  sources:
    - https://ffmpeg.org/about.html
    - https://ffmpeg.org/download.html
    - https://ffmpeg.org/documentation.html
    - https://formulae.brew.sh/formula/ffmpeg@6
  summary:
    - >
      FFmpeg 6 in Homebrew tracks the FFmpeg 6.1 release line, preserving a maintained
      6.x multimedia stack next to newer FFmpeg releases.
  timeline:
    - '2023: FFmpeg 6.1 release branch cut from master.'
    - '2026: FFmpeg 6.1.6 released and packaged by Homebrew as ffmpeg@6.'
  usage:
    - >
      ffmpeg@6 is useful for command-line transcoding and probing as well as for builds
      that need FFmpeg 6.x headers and shared libraries, especially where FFmpeg 7 or 8
      changes would be premature.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose the unversioned formula for Homebrew's current FFmpeg line when you no
      longer need the 6.x ABI.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/ffmpeg
      - https://formulae.brew.sh/formula/ffmpeg@6
  - id: brew:ffmpeg-full
    reason: >
      Choose ffmpeg-full when you need a wider selection of optional libraries and
      codecs than the standard formula enables.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/ffmpeg
  - id: brew:ffms2
    reason: >
      FFMS2 wraps FFmpeg for indexed, frame-oriented media access and documented FFmpeg
      6.1 as its minimum dependency for release 5.0.
    rel: adjacent_workflow
    sources:
      - https://github.com/FFMS/ffms2/releases
      - https://formulae.brew.sh/formula/ffms2
category: media
