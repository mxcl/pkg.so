id: brew:ferium
display-name: Ferium
homepage: https://github.com/gorilla-devs/ferium
repo: https://github.com/gorilla-devs/ferium
docs:
  - https://github.com/gorilla-devs/ferium#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/ferium/config.json
    - ~/.config/ferium/config.json
  macos: ~/.config/ferium/config.json
  windows: '%APPDATA%/ferium/config/config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Ferium's README lists installation through Homebrew, winget, Scoop, Nixpkgs, AUR
      packages, Pacstall, Void Linux, Gentoo overlays, crates.io, and GitHub Releases.
      That package spread is unusually broad for a game-adjacent utility and reflects
      demand from users who manage modded Minecraft across desktop and server
      environments.
  package-nerd-significance:
    - >
      Ferium matters to package nerds because it is a Rust CLI that wraps several
      fast-moving content ecosystems and ships across many package managers. Its GUI and
      no-GUI build variants also show the packaging wrinkle of desktop file picker
      support versus server-friendly binaries.
  project-history:
    - >
      The GitHub repository was created in September 2021, and crates.io records Ferium
      releases from January 2022. The project grew around the practical problem of
      keeping Minecraft mod profiles and modpacks current across multiple hosting
      services rather than manually visiting each project page.
  related-projects:
    - >
      Ferium's README points to sibling projects `ferinth` and `furse`, Rust wrappers
      for the Modrinth and CurseForge APIs.
  sources:
    - https://github.com/gorilla-devs/ferium
    - https://github.com/gorilla-devs/ferium/blob/main/README.md
    - https://api.github.com/repos/gorilla-devs/ferium
    - https://crates.io/crates/ferium
    - https://formulae.brew.sh/formula/ferium
  summary:
    - >
      Ferium is a Rust CLI for managing Minecraft mods and modpacks across Modrinth,
      CurseForge, and GitHub Releases. Its README positions it as an automation-friendly
      tool for declaring a set of mods and then downloading or updating compatible
      versions with one command.
  timeline:
    - '2021: Public GitHub repository created.'
    - '2022: First crates.io release recorded for Ferium.'
    - '2024: crates.io records the 4.7.1 release.'
  usage:
    - >
      Users create profiles, configure Minecraft versions and mod loaders, add mods or
      modpacks, and run upgrade commands to fetch compatible files. The documented
      config file stores profiles and modpack state, while optional environment
      variables or flags can provide CurseForge and GitHub tokens.
related-packages:
  - id: brew:pacmc
    reason: >
      pacmc is a command-line alternative organized around package-manager-style mod
      archives, while Ferium emphasizes compatibility-aware profiles and multi-source
      modpack upgrades.
    rel: alternative
    sources:
      - https://github.com/gorilla-devs/ferium#readme
      - https://github.com/jakobkmar/pacmc#readme
  - id: cask:prismlauncher
    reason: >
      Prism Launcher is a graphical alternative that manages isolated Minecraft
      instances and launches the game in addition to installing mods and modpacks.
    rel: alternative
    sources:
      - https://github.com/gorilla-devs/ferium#readme
      - https://prismlauncher.org/wiki/
category: games
package-manager:
  brew: ferium
  macports: ferium
  nix: ferium
  winget: GorillaDevs.Ferium
package-manager-url: https://formulae.brew.sh/formula/ferium
license: MPL-2.0
tags:
  - cli
  - curseforge
  - minecraft
  - modpacks
  - modrinth
  - mods
description: Fast and multi-source CLI program for managing Minecraft mods and modpacks
executables:
  - ferium
provenance:
  formula: ferium
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
