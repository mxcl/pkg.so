id: cask:pen
display-name: pen.dev
homepage: https://pen.dev/
repo: https://github.com/highagency/pen-desktop-releases
docs:
  - https://docs.pen.dev/
  - https://docs.pen.dev/core-concepts/ai-agents
  - https://docs.pen.dev/design-and-code/design-to-code
  - https://docs.pen.dev/getting-started/create-your-first-design
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pen.dev is offered as a standalone desktop application, an IDE experience for VS
      Code and Cursor, and a headless command-line tool.
    - >
      Its MCP integration lets external coding agents such as Codex and Claude Code
      inspect or modify an open design document, while the JSON-based .pen format allows
      designs to live beside source code and be tracked with Git.
  package-nerd-significance:
    - >
      pen.dev treats design documents as repository-friendly structured data and exposes
      the canvas to coding agents, joining interface design, source control, MCP, and
      code generation in one workflow.
    - >
      The availability of desktop, IDE, and headless CLI surfaces makes it relevant to
      developers who want design automation without isolating design artifacts from
      their normal project tooling.
  project-history:
    - >
      pen.dev was developed as an agentic vector-design canvas intended to connect
      visual design directly with software-development environments.
    - >
      The product grew into a multi-surface tool with a desktop editor, IDE integration,
      headless CLI, MCP tools, an open JSON document format, import workflows, reusable
      components, and design-to-code support.
  related-projects:
    - The application can import Figma files and layers.
    - >
      Codex, Claude Code, Cursor, and other compatible clients can connect through MCP
      to operate on the canvas.
  sources:
    - https://docs.pen.dev/
    - https://docs.pen.dev/core-concepts/ai-agents
    - https://docs.pen.dev/design-and-code/design-to-code
    - https://www.pen.dev/
    - https://www.pen.dev/faq
  summary:
    - >
      pen.dev is an agentic vector-design canvas that connects visual editing, AI
      agents, development environments, and code-generation workflows.
  timeline:
    - >
      2026: Official documentation describes pen.dev across desktop, IDE-extension, MCP,
      and headless-CLI workflows.
  usage:
    - >
      Designers can create and refine vector interfaces manually or with agents, import
      existing pages or Figma material, use reusable components, and export images,
      PDFs, HTML, CSS, or Tailwind output.
    - >
      Developers can store JSON-based .pen files alongside code, connect an external
      agent through MCP, and use design-to-code or code-to-design workflows inside the
      same project workspace.
related-packages:
  - id: cask:openpencil
    reason: >
      Choose OpenPencil for an open-source editor and programmable toolkit that reads
      and writes .pen files; choose pen.dev for the first-party canvas, hosted
      workspace, and integrated agent experience.
    rel: alternative
    sources:
      - https://docs.pen.dev/
      - https://openpencil.dev/overview/features
      - https://openpencil.dev/programmable/mcp-server
