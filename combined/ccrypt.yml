id: brew:ccrypt
display-name: ccrypt
homepage: https://ccrypt.sourceforge.net/
repo: null
docs:
  - https://ccrypt.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official download page lists source distributions, binaries for several
      operating systems, Debian packages, Redhat RPMs, Solaris packages, and OS/2
      packages. The input package facts also show Homebrew, Debian, MacPorts, Nix, and
      Ubuntu packaging.
  package-nerd-significance:
    - >
      ccrypt is historically interesting as a small AES-era replacement for older Unix
      crypt workflows. Package maintainers care about it because it is portable C
      software with many CLI entry points, old platform support, and security-sensitive
      defaults around key prompting and in-place file updates.
  project-history:
    - >
      The official site identifies ccrypt as software by Peter Selinger, with copyright
      years 2000-2018. Its documentation emphasizes Unix-style operation on files and
      streams, a gzip-like interface, and aliases for common modes.
    - >
      The project reached release 1.9 in 2009 with portability fixes for systems
      including Mac OS X, Ubuntu, FreeBSD, and Solaris 10. Release 1.10 in 2012 added
      libccrypt.a and ccguess, and release 1.11 in 2018 updated portability, bugs, Emacs
      26 compatibility, and translations.
  related-projects:
    - ps-ccrypt provides Emacs support for encrypted .cpt files.
    - The official site lists GUI and integration tools such as Qccrypt and CCRYPTGUI.
  sources:
    - https://ccrypt.sourceforge.net/
    - https://formulae.brew.sh/api/formula/ccrypt.json
  summary:
    - >
      ccrypt is Peter Selinger's file and stream encryption utility based on the
      Rijndael block cipher, the cipher family selected for AES. It packages encryption,
      decryption, key changes, and terminal-friendly helpers into the ccrypt, ccencrypt,
      ccdecrypt, ccat, and ccguess commands.
  timeline:
    - '2000: Copyright period begins for ccrypt.'
    - '2009: Version 1.9 released with portability fixes for multiple Unix-like systems.'
    - '2012: Version 1.10 released with libccrypt.a and ccguess.'
    - '2018: Version 1.11 released with portability fixes and Emacs 26 compatibility.'
  usage:
    - >
      ccrypt encrypts and decrypts files in place by default, adding or removing the
      .cpt suffix. It can also work as a filter, decrypt directly to stdout with ccat,
      change keys, use key files, recurse over directories, and provide Emacs
      integration through ps-ccrypt.
related-packages:
  - id: brew:age
    reason: >
      Choose age for a modern composable file-encryption format with explicit recipient
      keys, passphrase mode, multiple recipients, and a documented interoperability
      ecosystem.
    rel: alternative
    sources:
      - https://ccrypt.sourceforge.net/
      - https://github.com/FiloSottile/age
  - id: brew:gnupg
    reason: >
      Choose GnuPG when OpenPGP interoperability, digital signatures, public-key
      directories, or extensive key management are required in addition to encryption.
    rel: alternative
    sources:
      - https://ccrypt.sourceforge.net/
      - https://gnupg.org/
