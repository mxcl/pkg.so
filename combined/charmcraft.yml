id: brew:charmcraft
display-name: Charmcraft
homepage: https://charmhub.io
repo: https://github.com/canonical/charmcraft
docs:
  - https://documentation.ubuntu.com/charmcraft/stable
  - https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file
config-file-location:
  unix: ./charmcraft.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Charmcraft adoption follows Juju and Charmhub adoption: developers who build
      charmed operators use it to turn operator source trees into distributable charm
      artifacts. The README says the recommended Linux installation is the Snap package,
      while the input package-manager facts show a Homebrew formula for macOS users.
  package-nerd-significance:
    - >
      Charmcraft matters to package nerds because it is an ecosystem-specific packaging
      frontend: it bridges source trees, declared package metadata, build isolation, and
      a central registry for Juju operators. It is also a Canonical example of packaging
      tooling aligned with Snap distribution and Ubuntu documentation.
  project-history:
    - >
      The upstream GitHub repository was created in April 2020, and its README describes
      Charmcraft as the tool for initializing charm projects, packing charms,
      registering names, uploading revisions, and releasing them through Charmhub.
      GitHub release metadata shows the first public release, 0.1.0, published in May
      2020; current releases are in the 4.x line.
  related-projects:
    - Juju is the orchestration system whose operators are packaged as charms.
    - Charmhub is the publishing and discovery service targeted by Charmcraft commands.
    - >
      Snapcraft is adjacent Canonical packaging tooling; Charmcraft's README recommends
      the Snap package on Linux.
  sources:
    - https://github.com/canonical/charmcraft
    - https://api.github.com/repos/canonical/charmcraft
    - https://api.github.com/repos/canonical/charmcraft/releases
    - https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
  summary:
    - >
      Charmcraft is Canonical's command-line tool for creating, packaging, and
      publishing charms, the operator packages used by Juju. In package-manager terms it
      is the build-and-release client for the Charmhub/Juju ecosystem rather than a
      general-purpose language package manager.
  timeline:
    - '2020-04: Upstream GitHub repository created.'
    - '2020-05: First public GitHub release, 0.1.0.'
    - '2026-06: Upstream GitHub release metadata lists Charmcraft 4.3.0.'
  usage:
    - >
      Typical use starts with `charmcraft init`, then `charmcraft pack` to build,
      `charmcraft register` to reserve a Charmhub name, and `charmcraft upload` to
      publish revisions. The documented `charmcraft.yaml` file declares project metadata
      consumed by Charmcraft.
related-packages:
  - id: brew:charm-tools
    reason: >
      Charm Tools is the legacy alternative for layered charm creation, building, and
      validation; choose Charmcraft for current Charmhub-oriented projects and Charm
      Tools only when maintaining its older workflow.
    rel: alternative
    sources:
      - https://github.com/canonical/charmcraft
      - https://charm-tools.readthedocs.io/en/latest/
  - id: brew:juju
    reason: >
      Charmcraft builds and publishes charm packages, while Juju consumes those packages
      to deploy and manage applications, models, and infrastructure.
    rel: adjacent_workflow
    sources:
      - https://github.com/canonical/charmcraft
      - https://documentation.ubuntu.com/juju/latest/reference/index.html
category: developer-tools
package-manager:
  brew: charmcraft
package-manager-url: https://formulae.brew.sh/formula/charmcraft
license: Apache-2.0
tags:
  - charmhub
  - charms
  - cli
  - juju
  - packaging
  - publishing
description: Tool to build charms and publish them on Charmhub
executables:
  - charmcraft
provenance:
  formula: charmcraft
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
