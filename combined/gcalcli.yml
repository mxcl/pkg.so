id: brew:gcalcli
display-name: gcalcli
homepage: https://github.com/insanum/gcalcli
repo: https://github.com/insanum/gcalcli
docs:
  - https://github.com/insanum/gcalcli#readme
config-file-location:
  unix:
    - ~/.config/gcalcli/config.toml
    - ~/.config/gcalcli/gcalclirc
credentials-file-location:
  linux: ~/.local/share/gcalcli/oauth
history:
  adoption-history:
    - >
      The project README explicitly tells users to check operating-system distribution
      packages, and documents Debian/Ubuntu, Void Linux, Nix, Homebrew, PyPI, pipx, and
      source installation paths. GitHub tags show an active 4.x series, including
      v4.5.1, after a long life as a small personal-productivity CLI.
  package-nerd-significance:
    - >
      gcalcli is a classic Unix productivity package: it wraps a web API in composable
      terminal commands, cron jobs, tmux or Conky status displays, mailcap attachment
      handlers, and shell completion. Its packaging is also a reminder that API-backed
      CLIs often ship with local credential storage and user-managed OAuth client setup.
  project-history:
    - >
      The GitHub repository was created in April 2012 and the current README documents
      gcalcli as a Python application using Google Calendar API v3. Its command set
      covers listing calendars, agenda and calendar views, quick event entry, detailed
      event editing, imports, reminders, and shell completion.
  related-projects:
    - >
      The README ties gcalcli to Google Calendar API v3, Python packaging through PyPI
      and pipx, shell completion through argcomplete, and desktop integrations such as
      cron, tmux, Conky, and notification commands.
  sources:
    - https://api.github.com/repos/insanum/gcalcli
    - https://api.github.com/repos/insanum/gcalcli/tags
    - https://github.com/insanum/gcalcli
    - https://raw.githubusercontent.com/insanum/gcalcli/master/docs/README.md
  summary:
    - >
      gcalcli is a Python command-line interface for Google Calendar. It turns calendar
      viewing, event creation, reminders, ICS/vCal import, and shell integration into
      scriptable terminal workflows.
  timeline:
    - '2012: Public GitHub repository created.'
    - >
      2010s: gcalcli became packaged through operating-system and language package
      managers documented by the project.
    - >
      2020s: 4.x tags continued while the README documented Google Calendar API v3 and
      user-provided OAuth client setup.
  usage:
    - >
      A normal setup authenticates with OAuth2, stores the resulting token in a platform
      data directory, and then uses subcommands such as agenda, calm, calw, quick, add,
      import, and remind. The configuration model includes config.toml in the platform
      config directory, GCALCLI_CONFIG for overrides, and legacy gcalclirc-style flag
      files.
related-packages:
  - id: brew:khal
    reason: >
      Choose khal for a standards-based local iCalendar/vdir workflow, commonly
      synchronized through CalDAV, instead of a client tied directly to Google
      Calendar's API.
    rel: alternative
    sources:
      - https://github.com/insanum/gcalcli
      - https://khal.readthedocs.io/en/latest/
  - id: brew:ical-buddy
    reason: >
      On macOS, choose icalBuddy when the goal is read-oriented scripting against the
      local Calendar database rather than OAuth-backed access to Google Calendar.
    rel: alternative
    sources:
      - https://github.com/insanum/gcalcli
      - https://hasseg.org/icalBuddy/
category: productivity
package-manager:
  brew: gcalcli
  debian: gcalcli
  macports: gcalcli
  nix: gcalcli
  ubuntu: gcalcli
  zypper: gcalcli
package-manager-url: https://formulae.brew.sh/formula/gcalcli
license: MIT
tags:
  - calendar
  - cli
  - google-calendar
  - productivity
  - python
description: Easily access your Google Calendar(s) from a command-line
executables:
  - gcalcli
provenance:
  formula: gcalcli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
