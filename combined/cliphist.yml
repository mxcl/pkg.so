id: brew:cliphist
display-name: cliphist
homepage: https://github.com/sentriz/cliphist
repo: https://github.com/sentriz/cliphist
docs:
  - https://github.com/sentriz/cliphist#readme
config-file-location:
  linux: $XDG_CONFIG_HOME/cliphist/config
credentials-file-location: null
history:
  adoption-history:
    - >
      cliphist has become part of the composable Wayland desktop ecosystem, with
      documented examples for dmenu, fzf, rofi, fuzzel, and wofi. Distribution packages
      and static releases make it usable without adopting a complete desktop
      environment.
  package-nerd-significance:
    - >
      cliphist exemplifies the Unix-pipeline style common in minimalist Wayland setups:
      it stores and decodes history but deliberately delegates selection and clipboard
      transport to independent tools.
  project-history:
    - >
      cliphist was developed as a focused clipboard-history component for Wayland. Its
      design preserves clipboard data byte-for-byte, supports both text and images, and
      intentionally contains no built-in picker.
  related-projects:
    - >
      The documented workflow integrates with wl-clipboard and picker tools including
      dmenu, fzf, rofi, fuzzel, and wofi. Sway and other wlroots-based compositors are
      common hosts.
  sources:
    - https://github.com/sentriz/cliphist#readme
    - https://github.com/sentriz/cliphist/blob/master/CHANGELOG.md
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      cliphist is a multimedia-capable Wayland clipboard-history service designed for
      use in shell pipelines.
  timeline:
    - >
      Initial design: Introduced storage, listing, decoding, deletion, and wiping
      through a small command-line interface.
    - >
      Later releases: Added optional configuration through CLI flags, environment
      variables, or an XDG config file.
    - >
      Current usage: Packaged by Homebrew and integrated into numerous picker- and
      compositor-based Wayland workflows.
  usage:
    - >
      A session typically runs `wl-paste --watch cliphist store`; recall is composed as
      `cliphist list | <picker> | cliphist decode | wl-copy`. Commands also delete
      entries, wipe or compact the database, and accept limits through flags,
      environment variables, or `$XDG_CONFIG_HOME/cliphist/config`.
related-packages:
  - id: brew:fzf
    reason: >
      cliphist officially documents fzf as a terminal picker for selecting a stored
      entry before decoding it back into the Wayland clipboard.
    rel: adjacent_workflow
    sources:
      - https://github.com/sentriz/cliphist#readme
      - https://github.com/junegunn/fzf#readme
  - id: brew:rofi
    reason: >
      cliphist officially provides both rofi dmenu-mode commands and custom-mode helper
      scripts, including image-aware clipboard selection.
    rel: adjacent_workflow
    sources:
      - https://github.com/sentriz/cliphist#readme
      - https://davatorium.github.io/rofi/
category: productivity
package-manager:
  apk: cliphist
  brew: cliphist
  debian: cliphist
  dnf: cliphist
  nix: cliphist
  pacman: cliphist
  ubuntu: cliphist
  zypper: cliphist
package-manager-url: https://formulae.brew.sh/formula/cliphist
license: GPL-3.0-only
tags:
  - cli
  - clipboard
  - clipboard-history
  - multimedia
  - tui
  - unix-pipelines
  - wayland
description: Wayland clipboard manager with support for multimedia
executables:
  - cliphist
provenance:
  formula: cliphist
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
