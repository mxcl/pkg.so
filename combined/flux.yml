id: brew:flux
display-name: Flux
homepage: https://www.influxdata.com/products/flux/
repo: https://github.com/influxdata/flux
docs:
  - https://docs.influxdata.com/flux/v0
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Flux adoption was tied to InfluxDB 1.7, InfluxDB 2.x, Flux tasks, dashboards, and
      the InfluxData documentation ecosystem. Its standard library grew broad support
      for data transformations, InfluxDB-specific operations, SQL, CSV, Prometheus-style
      functions, testing helpers, and notification endpoints.
    - >
      InfluxData's current guidance says existing InfluxDB 1.x and 2.x users can
      continue using Flux, while new InfluxDB 3 work should generally use InfluxQL or
      SQL.
  package-nerd-significance:
    - >
      Flux is notable to package maintainers because it is both a language runtime and a
      database-adjacent tool: packaging it means exposing a CLI, stdlib, parser,
      planner, and runtime outside the InfluxDB server that popularized it.
    - >
      Its maintenance-mode status matters for curation because the package remains
      useful for legacy InfluxDB 1.x/2.x users even though InfluxDB 3 moved toward SQL
      and InfluxQL.
  project-history:
    - >
      InfluxData documents Flux as a language that unifies querying, processing,
      writing, and acting on data in one syntax, with support for time-series databases,
      SQL databases, and CSV data sources.
    - >
      The public Flux repository describes it as part of InfluxDB 1.7 and 2.0 while also
      runnable independently. InfluxData later placed Flux in maintenance mode and did
      not carry native Flux support into InfluxDB 3.
  related-projects:
    - >
      InfluxDB 1.x, InfluxDB 2.x, InfluxDB 3, InfluxQL, SQL, Telegraf, Chronograf, and
      Kapacitor are closely related parts of the InfluxData ecosystem.
    - >
      Prometheus, SQL databases, and CSV sources are important integration targets
      documented in the Flux standard library and query-source docs.
  sources:
    - https://docs.influxdata.com/flux/v0/
    - https://docs.influxdata.com/flux/v0/future-of-flux/
    - https://docs.influxdata.com/flux/v0/release-notes/
    - https://github.com/influxdata/flux
  summary:
    - >
      Flux is InfluxData's open-source functional data scripting language for querying,
      analyzing, and acting on data, especially time-series data in InfluxDB 1.x and
      2.x.
  timeline:
    - '2018: Flux v0.7.x releases were published during early language development.'
    - >
      2018: Flux v0.14.0 changed the flux command into a REPL and organized built-in
      code into Flux packages.
    - '2019: Flux v0.65.0 was published during the pre-1.0 language series.'
    - '2020: InfluxDB 2.0-era adoption made Flux central to many InfluxData 2.x workflows.'
    - >
      2026: InfluxData documentation states that Flux is in maintenance mode and not
      supported in InfluxDB 3.
  usage:
    - >
      Users write Flux scripts to read from buckets, filter and transform tables, join
      streams, aggregate windows, define functions, query external data sources, and
      drive tasks or alerts in InfluxDB-era workflows. The standalone flux command also
      exposes a REPL-style developer workflow in older releases.
related-packages:
  - id: brew:influxdb
    reason: >
      Use InfluxDB with Flux when maintaining 1.x or 2.x time-series query and task
      workflows; new InfluxDB 3 projects should generally follow InfluxData's SQL or
      InfluxQL guidance.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/flux/v0/
      - https://docs.influxdata.com/flux/v0/future-of-flux/
      - https://docs.influxdata.com/influxdb/
category: data
