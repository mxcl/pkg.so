id: brew:eg-examples
display-name: eg
homepage: https://github.com/srsudar/eg
repo: https://github.com/srsudar/eg
docs:
  - https://github.com/srsudar/eg#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/eg/egrc
    - ~/.egrc
credentials-file-location: null
history:
  adoption-history:
    - >
      eg was packaged for both pip and Homebrew, with the Homebrew formula named
      eg-examples to avoid colliding with the separate Expert Guide package named eg.
      The README also documents running from source with a symlink to eg_exec.py.
  package-nerd-significance:
    - >
      eg-examples is a neat package-manager corner case: the upstream command is simply
      eg, but the Homebrew package name is disambiguated because another historical
      terminal tool already owns the eg formula name.
  project-history:
    - >
      The srsudar/eg repository was created in 2015. Its README says the name comes from
      exempli gratia and positions the tool as a way to get examples for commands like
      find and tar without reading a full manual page.
  related-projects:
    - >
      Related projects include man, tldr-style command examples, pager tools such as
      less, and the unrelated davep/eg Expert Guide reader that explains the Homebrew
      naming distinction.
  sources:
    - https://github.com/srsudar/eg
    - https://raw.githubusercontent.com/srsudar/eg/master/README.md
    - https://api.github.com/repos/srsudar/eg
    - https://api.github.com/repos/srsudar/eg/tags?per_page=10
  summary:
    - >
      eg is a command-line examples browser: a companion to man pages that shows short,
      practical examples for common Unix commands.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2015: v1.0.0 tag appears in the upstream tag history.'
    - '2025: Repository still receives updates according to GitHub metadata.'
  usage:
    - >
      Users run eg followed by a program name, such as eg find, or run eg --list to see
      available example topics. Example files live as Markdown in an examples directory,
      and output is normally paged through less while respecting PAGER.
    - >
      The tool supports custom example directories, an XDG config file at
      $XDG_CONFIG_HOME/eg/egrc, a legacy ~/.egrc location, color settings, squeezed
      output, substitutions, and custom pagers.
related-packages:
  - id: brew:cheat
    reason: >
      cheat is an alternative for creating and viewing personal or community command
      cheat sheets, whereas eg emphasizes a bundled corpus of practical examples.
    rel: alternative
    sources:
      - https://github.com/srsudar/eg#readme
      - https://github.com/cheat/cheat#readme
  - id: brew:tlrc
    reason: >
      tlrc is the official tldr client and offers another concise, example-driven
      alternative to reading full manual pages.
    rel: alternative
    sources:
      - https://github.com/srsudar/eg#readme
      - https://tldr.sh/tlrc/
  - id: brew:man-db
    reason: >
      man-db complements eg with full reference manuals; eg's official README explicitly
      describes the shorter examples as a companion to man.
    rel: adjacent_workflow
    sources:
      - https://github.com/srsudar/eg#readme
      - https://man-db.gitlab.io/man-db/
category: developer-tools
package-manager:
  brew: eg-examples
  dnf: eg
package-manager-url: https://formulae.brew.sh/formula/eg-examples
license: MIT
tags:
  - cli
  - developer-productivity
  - documentation
  - examples
  - reference
description: Useful examples at the command-line
executables:
  - eg
provenance:
  formula: eg-examples
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
