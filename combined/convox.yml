id: brew:convox
display-name: Convox
homepage: https://convox.com/
repo: https://github.com/convox/convox
docs:
  - https://docs.convox.com/getting-started/introduction
  - https://docs.convox.com/reference/cli
config-file-location:
  unix: convox.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Convox packaging matters because the CLI is the local control surface for a larger
      cloud platform. Official installation docs publish downloadable binaries for Linux
      and macOS, while the Homebrew formula gives macOS and Linux users a
      package-manager path to the same command.
  package-nerd-significance:
    - >
      Convox is a larger-than-usual CLI package: the executable fronts a PaaS control
      plane, Terraform/Kubernetes-backed racks, releases, secrets, load balancers,
      resources, scheduled jobs, and rollbacks. The package boundary is small, but the
      operational surface behind it is broad.
  project-history:
    - >
      The current open-source repository was created in August 2019 and describes Convox
      as a multicloud PaaS. Official docs frame the product around installing a Rack on
      your own infrastructure and deploying applications through the `convox` command.
  related-projects:
    - >
      Convox is closely tied to Kubernetes, Terraform-backed rack installation,
      cloud-provider integrations, and the example applications hosted under the
      official Convox examples organization.
  sources:
    - https://github.com/convox/convox
    - https://docs.convox.com/getting-started/introduction
    - https://docs.convox.com/reference/cli
    - https://github.com/convox/convox/releases/tag/3.24.9
    - https://formulae.brew.sh/formula/convox
  summary:
    - >
      Convox is an open-source Kubernetes-based Platform as a Service with a CLI for
      installing racks, managing apps, deploying code, and operating cloud
      infrastructure across supported providers.
  timeline:
    - '2019-08-16: Current official GitHub repository created.'
    - '2026-06-03: 3.24.9 release published.'
    - >
      2026: Official docs list AWS, DigitalOcean, Google Cloud, and Microsoft Azure as
      supported clouds.
  usage:
    - >
      A typical workflow is to create a Convox account, install or connect to a Rack on
      AWS, Google Cloud, DigitalOcean, or Microsoft Azure, log in with the CLI, keep
      application topology in `convox.yml`, and run commands such as `convox apps`,
      `convox deploy`, and rack-management commands.
related-packages:
  - id: brew:heroku
    reason: >
      Heroku is an alternative managed PaaS; choose it for the established Heroku app
      and add-on model, while Convox offers a documented migration path to
      Kubernetes-backed infrastructure in your cloud environment.
    rel: alternative
    sources:
      - https://docs.convox.com/migration/heroku
      - https://devcenter.heroku.com/articles/heroku-cli
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl alongside Convox when you need lower-level inspection of a Rack's
      Kubernetes cluster after generating connection data with `convox rack kubeconfig`.
    rel: adjacent_workflow
    sources:
      - https://docs.convox.com/reference/cli/rack
      - https://kubernetes.io/docs/reference/kubectl/
category: cloud-infrastructure
package-manager:
  brew: convox
package-manager-url: https://formulae.brew.sh/formula/convox
license: Apache-2.0
tags:
  - cli
  - cloud
  - deployment
  - kubernetes
  - paas
description: Command-line interface for the Convox PaaS
executables:
  - convox
provenance:
  formula: convox
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
