history:
  adoption-history:
    - >
      Middle is distributed as a direct-download commercial macOS utility with a
      seven-day trial. Its official site supports both Intel and Apple Silicon Macs and
      licenses activation on up to three devices.
  package-nerd-significance:
    - >
      Middle is representative of narrowly focused macOS input-enhancement casks: a
      small proprietary utility that fills a hardware interaction gap rather than
      providing a broad application suite.
  project-history:
    - >
      Middle was developed by Ryan Hanson as a focused way to add configurable
      middle-click behavior to Apple pointing devices. It sits alongside the developer's
      other macOS utilities, including Rectangle, Charmstone, and Multitouch.
  related-projects:
    - Multitouch, from the same developer, offers a broader gesture-customization feature set.
    - Rectangle and Charmstone are other macOS utilities from Ryan Hanson.
  sources:
    - 'Official product page: https://middleclick.app/'
    - source_facts.package-manager
  summary:
    - >
      Middle is a commercial macOS input utility that adds middle-click gestures to
      Apple trackpads and Magic Mouse devices.
  timeline:
    - >
      Current product generation: Supports macOS 10.15 or later on Intel and Apple
      Silicon Macs.
  usage:
    - >
      Users choose a supported trackpad or Magic Mouse gesture and use it to emit a
      conventional middle click. Typical uses include opening browser links in new tabs,
      panning in CAD software, and pasting selected text in Terminal.
    - The official page also supports holding the Function key while clicking with any device.
category: system
