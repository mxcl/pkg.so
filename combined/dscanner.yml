id: brew:dscanner
display-name: D-Scanner
homepage: https://github.com/dlang-community/D-Scanner
repo: https://github.com/dlang-community/D-Scanner
docs:
  - https://github.com/dlang-community/D-Scanner#readme
config-file-location:
  unix: dscanner.ini
  windows: dscanner.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      D-Scanner's adoption is largely within the D ecosystem rather than general-purpose
      developer tooling. Its README notes that many D editors already ship with
      D-Scanner integration, while package entries in Homebrew, Nix, Arch, and DUB make
      it available through both system and language package workflows.
  package-nerd-significance:
    - >
      D-Scanner matters to package maintainers because language tooling often needs to
      be installed outside the language package manager for editor and CI integration.
      It is a small example of how ecosystem-specific linters become system packages
      when they need a stable executable on PATH.
  project-history:
    - >
      The project is maintained under the dlang-community organization and is documented
      as a source-code analysis tool for D. Its README describes native builds with D
      compilers, DUB-based installation, Docker usage, linting, autofix support, custom
      error formats, and GitHub Actions output.
  related-projects:
    - DUB is the D package manager installation path documented by the project.
    - DMD, LDC, and GDC are supported compiler/build targets called out in the README.
    - D editors and GitHub Actions are integration targets for D-Scanner output.
  sources:
    - https://github.com/dlang-community/D-Scanner
    - https://github.com/dlang-community/D-Scanner/blob/master/README.md
    - https://code.dlang.org/packages/dscanner
  summary:
    - >
      D-Scanner is a command-line analysis tool for D source code. It sits in the D
      language tooling layer as a linter, syntax/style checker, import/token helper, and
      machine-readable reporting tool for editors and CI.
  timeline:
    - '2010s: D-Scanner becomes part of the D language community tooling ecosystem.'
    - >
      Later: The README documents DUB, Docker, editor, CI, autofix, and `dscanner.ini`
      workflows.
    - 'Community era: The project is maintained in the `dlang-community` GitHub organization.'
  usage:
    - >
      Typical usage includes `dscanner lint source/` for human-readable diagnostics,
      `dscanner fix source/` for interactive fixes, `--report` or custom formats for
      tool integration, and `dscanner.ini` to enable or disable diagnostics.
related-packages:
  - id: brew:dfmt
    reason: >
      Use dfmt alongside D-Scanner to format D source through EditorConfig while
      D-Scanner handles linting, static analysis, and fixable diagnostics.
    rel: adjacent_workflow
    sources:
      - https://github.com/dlang-community/D-Scanner#readme
      - https://github.com/dlang-community/dfmt#readme
  - id: brew:dub
    reason: >
      DUB complements D-Scanner as the D package and build workflow, and D-Scanner's
      official installation instructions explicitly support fetching and running it
      through DUB.
    rel: adjacent_workflow
    sources:
      - https://github.com/dlang-community/D-Scanner#readme
      - https://dub.pm/
category: developer-tools
package-manager:
  brew: dscanner
  nix: dscanner
  pacman: dscanner
package-manager-url: https://formulae.brew.sh/formula/dscanner
license: BSL-1.0
tags:
  - cli
  - ctags
  - d-language
  - linter
  - static-analysis
  - syntax-checker
description: Analyses e.g. the style and syntax of D code
executables:
  - dscanner
provenance:
  formula: dscanner
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
