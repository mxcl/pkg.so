id: brew:couchdb
display-name: Apache CouchDB
homepage: https://couchdb.apache.org/
repo: https://github.com/apache/couchdb
docs:
  - https://docs.couchdb.org/en/stable
config-file-location:
  macos:
    - Applications/Apache CouchDB.app/Contents/Resources/couchdbx-core/etc
    - /Users/<your-user>/Library/Application Support/CouchDB2/etc/couchdb
    - /Users/<your-user>/Library/Preferences/couchdb2-local.ini
  unix:
    - etc/default.ini
    - etc/default.d/*.ini
    - etc/local.ini
    - etc/local.d/*.ini
credentials-file-location:
  macos:
    - /Users/<your-user>/Library/Application Support/CouchDB2/etc/couchdb
    - /Users/<your-user>/Library/Preferences/couchdb2-local.ini
  unix:
    - etc/local.ini
    - etc/local.d/*.ini
    - /opt/couchdb/etc/local.ini
    - /opt/couchdb/etc/local.d/10-admins.ini
history:
  adoption-history:
    - >
      CouchDB became significant in the NoSQL era because its HTTP API and replication
      model made it usable directly by web, mobile, and synchronization-oriented
      applications. The official site points to user stories centered on replication,
      offline use, and reliability.
    - >
      The Couch Replication Protocol is implemented by multiple projects and products,
      making CouchDB relevant beyond the server package itself.
  package-nerd-significance:
    - >
      For package maintainers, CouchDB is more than a single executable: packaging has
      to account for an Erlang-based service, layered ini configuration, administrator
      bootstrap, local data/state directories, and platform-specific macOS application
      paths.
  project-history:
    - >
      The Apache CouchDB site presents the database as a system for multi-primary
      synchronization, HTTP/JSON access, and reliability from single-node deployments to
      clustered installations.
    - >
      The Apache GitHub repository records the modern source location for the project,
      with the mirror created in 2009 and active development continuing through the 3.x
      series.
  related-projects:
    - Fauxton
    - Couch Replication Protocol
    - PouchDB
    - Erlang/OTP
  sources:
    - https://couchdb.apache.org/
    - https://docs.couchdb.org/en/stable/intro/overview.html
    - https://docs.couchdb.org/en/stable/config/intro.html
    - https://docs.couchdb.org/en/stable/config/auth.html
    - https://github.com/apache/couchdb
    - https://api.github.com/repos/apache/couchdb
  summary:
    - >
      Apache CouchDB is an Apache document database built around JSON documents, an HTTP
      API, replication, and offline-first synchronization patterns.
  timeline:
    - '2009: Apache CouchDB GitHub repository mirror created.'
    - '2026: Apache CouchDB 3.5.2 listed on the official site download callout.'
  usage:
    - >
      Administrators run CouchDB as a database server and interact with it over HTTP,
      through cURL, client libraries, Fauxton, and bundled command-line tools such as
      `couchdb`, `remsh`, and `weatherreport`.
    - >
      Configuration is layered through `default.ini`, `default.d`, `local.ini`, and
      `local.d`, with administrator credentials stored in the `[admins]` section of the
      loaded ini files rather than in the `_users` database.
related-packages: []
category: data
package-manager:
  brew: couchdb
  macports: couchdb
  pacman: couchdb
package-manager-url: https://formulae.brew.sh/formula/couchdb
license: Apache-2.0
tags:
  - cli
  - database
  - document-database
  - http-json-api
  - nosql
  - replication
description: Apache CouchDB database server
executables:
  - couchdb
  - remsh
  - weatherreport
provenance:
  formula: couchdb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
