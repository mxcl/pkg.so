history:
  adoption-history:
    - >
      Deepline is distributed as an npm CLI and through Homebrew in the supplied package
      metadata. Its official quickstart explicitly targets Claude Code, Codex, Cursor,
      Gemini CLI, and other shell-capable agents, reflecting adoption through AI-agent
      development environments rather than a traditional standalone desktop interface.
  package-nerd-significance:
    - >
      For package-oriented users, Deepline is an example of a SaaS-backed CLI built
      primarily for invocation by coding agents. It packages provider discovery,
      authentication, schema normalization, retry and routing behavior behind a stable
      terminal interface instead of requiring users to install and compose many provider
      SDKs.
  project-history:
    - >
      Deepline is operated by Aero AI Labs, Inc.; the project's official
      machine-readable documentation says the company was founded in 2024. Official
      documentation presents the product as an SDK and CLI designed for go-to-market
      agents and production applications.
    - >
      The CLI developed around agent-oriented installation and typed tool execution. The
      official quickstart documents npm installation, setup through a coding-agent
      skill, browser authorization, and commands that execute enrichment tools or
      reusable plays.
  related-projects:
    - >
      The official documentation names Claude Code, Codex, Cursor, and Gemini CLI as
      agent surfaces that can invoke Deepline.
    - >
      Provider integrations such as Apollo, Hunter, People Data Labs, HubSpot,
      Salesforce, and Attio are composed behind Deepline's common CLI and API surface.
  sources:
    - https://deepline.com/docs/api-reference
    - https://deepline.com/docs/features/bring-your-own-keys
    - https://deepline.com/docs/llms.txt
    - https://deepline.com/docs/quickstart
    - source_facts.package-manager
  summary:
    - >
      Deepline is a command-line interface, SDK, and hosted API for go-to-market data
      enrichment and outbound workflow automation. Its defining package-level idea is to
      expose many provider integrations through one agent-callable command surface, with
      waterfall routing and normalized results.
  timeline:
    - >
      2024: Aero AI Labs, Inc., the company behind Deepline, was founded according to
      Deepline's official documentation index.
    - >
      2026: Official documentation describes Deepline as an npm- and
      Homebrew-distributed CLI and SDK for agent-driven GTM workflows.
  usage:
    - >
      Users install and authenticate the CLI, then call typed enrichment tools or ask an
      agent to run a Deepline skill. Common workflows include finding and validating
      work emails, enriching company records, scoring leads, and writing results to CRM
      or sequencing systems.
    - >
      Deepline supports managed credits and bring-your-own-provider keys. Official
      documentation recommends waterfall tools for multi-provider lookup and a small
      pilot run before processing a full file.
