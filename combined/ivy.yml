id: brew:ivy
display-name: Apache Ivy
homepage: https://ant.apache.org/ivy/
repo: https://gitbox.apache.org/repos/asf/ant-ivy.git
docs:
  - https://ant.apache.org/ivy
  - https://ant.apache.org/ivy/history/2.5.3/index.html
config-file-location:
  unix: ivysettings.xml
credentials-file-location:
  unix: ivysettings.xml
history:
  adoption-history:
    - >
      Ivy's adoption came from Java projects that wanted transitive dependency
      resolution without moving the whole build to Maven. Its tight Ant integration let
      build.xml users add dependency resolution, reports, publishing, and retrieval
      while preserving existing Ant build structure.
    - >
      The input package metadata shows Ivy packaged across Homebrew, Debian/Ubuntu,
      Fedora, MacPorts, Nix, and openSUSE. That broad packaging reflects its role as a
      build tool dependency for legacy and maintained Java build systems.
  package-nerd-significance:
    - >
      Ivy matters historically because it represents a flexible, XML-configured answer
      to Java dependency hell during the Ant era. It is also a useful study in
      package-manager interoperability: Ivy files, Maven POMs, resolvers, repositories,
      caches, conflict managers, and generated reports are all explicit pieces of its
      model.
  project-history:
    - >
      Ivy began outside Apache under Jayasoft; the Apache documentation still notes that
      the documentation was migrated from the old Jayasoft web site. The Apache Ivy home
      page records its October 2007 graduation as a subproject of Ant, followed by the
      2.0.0 beta and release-candidate cycle.
    - >
      The 2.0.0 release in January 2009 was the first non-beta Ivy release under Apache.
      The release notes highlight the move from Jayasoft Ivy to Apache Ivy, Java package
      renaming from fr.jayasoft to org.apache, the settings-file terminology change from
      configuration to settings, and a default resolver move toward Maven 2-compatible
      ibiblio repositories.
    - >
      The 2.x line developed Ivy into a long-lived Ant companion. Apache's release
      history lists 2.1.0 in 2009, 2.2.0 in 2010, 2.3.0 in 2013, 2.4.0 in 2014, 2.5.0 in
      2019, and maintenance releases in the 2.5 series.
  related-projects:
    - >
      Related projects include Apache Ant, Apache Maven, IvyDE for Eclipse,
      Maven-compatible repositories, ibiblio/Maven Central-style resolvers, and Java
      build systems that consume artifact metadata.
  sources:
    - https://ant.apache.org/ivy/
    - https://ant.apache.org/ivy/history/2.0.0/release-notes.html
    - https://ant.apache.org/ivy/history/2.5.3/index.html
    - https://ant.apache.org/ivy/history/2.5.3/settings.html
    - https://formulae.brew.sh/formula/ivy
  summary:
    - >
      Apache Ivy is a Java dependency manager associated with Apache Ant. It records,
      tracks, resolves, reports, and retrieves project dependencies while staying
      process-agnostic and configurable rather than imposing a full build lifecycle.
  timeline:
    - '2007: Ivy graduated as a subproject of Apache Ant.'
    - '2009: Apache Ivy 2.0.0 was released as the first non-beta Apache release.'
    - '2010: Apache Ivy 2.2.0 was made available.'
    - '2014: Apache Ivy 2.4.0 was made available.'
    - '2019: Apache Ivy 2.5.0 was made available.'
    - '2024: Apache Ivy 2.5.3 was made available.'
  usage:
    - >
      Ivy projects usually declare dependencies in ivy.xml and customize repositories,
      resolvers, caches, namespaces, credentials, and other behavior through
      ivysettings.xml. It can run as Ant tasks or as a standalone application, with the
      cache and retrieval model separating dependency resolution from local artifact
      layout.
    - >
      Ivy is most often compared with Maven dependency management: it can consume
      Maven-style metadata and repositories, but its package-nerd appeal is that it
      keeps dependency resolution independent from a prescribed project model.
related-packages:
  - id: brew:ant
    reason: >
      Apache Ivy is tightly integrated with Ant and supplies Ant tasks for resolving,
      retrieving, reporting, and publishing dependencies.
    rel: adjacent_workflow
    sources:
      - https://ant.apache.org/ivy/history/2.6.0/index.html
      - https://ant.apache.org/manual/
  - id: brew:maven
    reason: >
      Choose Maven when you want an opinionated project-management and build lifecycle;
      choose Ivy when you primarily need flexible dependency management within Ant or
      another process.
    rel: alternative
    sources:
      - https://ant.apache.org/ivy/m2comparison.html
      - https://maven.apache.org/guides/
category: developer-tools
package-manager:
  brew: ivy
  debian: ivy
  dnf: apache-ivy
  macports: ivy
  nix: ivy
  ubuntu: ivy
  zypper: apache-ivy
package-manager-url: https://formulae.brew.sh/formula/ivy
license: Apache-2.0
tags:
  - apache-ant
  - build-tools
  - cli
  - dependency-management
  - java
  - package-resolution
description: Agile dependency manager
executables:
  - ivy
provenance:
  formula: ivy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
