id: brew:cpdf
display-name: cpdf
homepage: https://github.com/johnwhitington/cpdf-source
repo: https://github.com/johnwhitington/cpdf-source
docs:
  - https://github.com/johnwhitington/cpdf-source#readme
  - https://www.coherentpdf.com/cpdfmanual.pdf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official packaging information in the README includes OPAM installation for the
      OCaml library and notes that cpdf may also be available from package managers. The
      batch source facts list Homebrew, Alpine, Fedora-family, and winget mappings,
      showing distribution beyond the upstream binary channel.
  package-nerd-significance:
    - >
      cpdf is packaging-relevant because it combines a CLI binary, an OCaml library,
      AGPL/commercial licensing choices, OPAM installation, upstream binary releases,
      and downstream OS package entries. That mix affects how packagers choose source
      tags, license metadata, and binary placement.
  project-history:
    - >
      The official source README describes cpdf as both a command-line PDF editing tool
      and an OCaml library. It directs binary users to a separate cpdf-binaries
      repository and tells source users to build tagged versions rather than the
      unstable master branch.
  related-projects:
    - >
      The README names camlpdf as a build prerequisite and lists related C, Python,
      Java, .NET, and JavaScript interfaces, including cpdflib-source, pycpdflib, jcpdf,
      dotnet-libcpdf, and coherentpdf.js.
  sources:
    - https://github.com/johnwhitington/cpdf-source#readme
    - https://www.coherentpdf.com/cpdfmanual.pdf
  summary:
    - >
      cpdf is the Coherent PDF command-line tool for editing PDF files, distributed as
      source under the AGPL with separate commercial licensing available from Coherent
      Graphics.
  timeline:
    - >
      Tagged releases: The README instructs GitHub source users to choose a version tag
      such as v2.9.1.
    - '2023: The README notes PDF/UA support was implemented under NLnet grant 2023-12-031.'
    - >
      2025: The README notes redaction support is being implemented under NLnet grant
      2025-10-235.
    - '2026: The README carries Coherent Graphics Ltd copyright through 2026.'
  usage:
    - >
      cpdf is used as a command-line document-processing tool for PDF manipulation. The
      upstream documentation is a PDF manual, while the source tree also builds OCaml
      library documentation after compilation.
related-packages:
  - id: brew:qpdf
    reason: >
      Choose qpdf when the job centers on structural PDF transformations, inspection,
      repair-oriented QDF/JSON workflows, encryption, or page manipulation rather than
      cpdf's broader document-editing command set.
    rel: alternative
    sources:
      - https://www.coherentpdf.com/cpdfmanual/
      - https://qpdf.readthedocs.io/en/latest/
category: productivity
package-manager:
  apk: cpdf
  brew: cpdf
  dnf: cpdf
  winget: CoherentGraphics.Cpdf
package-manager-url: https://formulae.brew.sh/formula/cpdf
license: AGPL-3.0-only
tags:
  - cli
  - coherent-pdf
  - command-line-tool
  - document-processing
  - pdf
description: PDF Command-line Tools
executables:
  - cpdf
provenance:
  formula: cpdf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
