id: brew:gowsdl
display-name: gowsdl
homepage: https://github.com/hooklift/gowsdl
repo: https://github.com/hooklift/gowsdl
docs:
  - https://github.com/hooklift/gowsdl#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gowsdl occupies a niche in the Go ecosystem for teams that still need to integrate
      with SOAP endpoints. Its README documents binary releases, `go get` or `go
      install`, and Homebrew installation, making it easy to use as a project-local
      generator or a package-manager-installed CLI.
  package-nerd-significance:
    - >
      The package is interesting because it packages an enterprise interoperability
      workflow as a small Go CLI: SOAP and WSDL are legacy-heavy, but Go users can
      install a generator from source, GitHub releases, or Homebrew and check generated
      code into normal Go projects.
  project-history:
    - >
      The repository history starts in December 2013 with early work on CLI wiring, WSDL
      and schema resolution, code generation, and SOAP proxy support. The README states
      the goal as generating idiomatic Go code while supporting Document/Literal wrapped
      services, WSDL 1.1, XML Schema 1.0, SOAP 1.1, and local or external WSDL files.
  related-projects:
    - >
      SOAP 1.1, WSDL 1.1, XML Schema 1.0, and WS-I Document/Literal wrapped service
      conventions are the standards surface that gowsdl targets.
    - The Go toolchain provides the build and install path used by the project.
  sources:
    - https://github.com/hooklift/gowsdl
    - https://github.com/hooklift/gowsdl/releases
    - https://raw.githubusercontent.com/hooklift/gowsdl/master/README.md
  summary:
    - >
      gowsdl is a Go code generator for SOAP services described by WSDL files. It turns
      WSDL 1.1 and XML Schema definitions into Go code and includes a SOAP proxy/client
      layer for the generated types.
  timeline:
    - '2013: Repository history begins with the initial commit.'
    - '2015: v0.1.0 tag appears in the repository history.'
    - >
      2018: v0.3.0 includes README updates and Homebrew installation instructions in its
      release notes.
    - '2021: v0.5.0 tag appears in the repository history.'
  usage:
    - >
      A typical invocation is `gowsdl [options] myservice.wsdl`, with flags for output
      file, generated package name, TLS verification behavior for fetching WSDLs, and
      version output. The README cautions that generated code reflects the source WSDL,
      so duplicated or awkward service definitions can carry through into Go.
related-packages: []
category: developer-tools
package-manager:
  brew: gowsdl
package-manager-url: https://formulae.brew.sh/formula/gowsdl
license: MPL-2.0
tags:
  - cli
  - code-generation
  - go
  - soap
  - wsdl
description: WSDL2Go code generation as well as its SOAP proxy
executables:
  - gowsdl
provenance:
  formula: gowsdl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
