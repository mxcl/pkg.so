id: brew:dagger
display-name: Dagger
homepage: https://dagger.io
repo: https://github.com/dagger/dagger
docs:
  - https://docs.dagger.io/
config-file-location:
  unix: ./dagger.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Dagger's adoption pitch is local-first CI/CD: write automation once, run it on a
      laptop or CI server, and avoid environment drift and CI lock-in. Current official
      docs emphasize a CLI, a Dagger Engine, generated SDKs, reusable modules, tracing,
      and container-runtime-backed execution.
  package-nerd-significance:
    - >
      Dagger is interesting to package nerds because it treats delivery pipelines as
      portable code rather than vendor-specific YAML. Its formula installs a CLI that
      brokers a larger engine, SDK, module, and container ecosystem, making the package
      a doorway into programmable build and release workflows.
  project-history:
    - >
      Dagger's official launch post introduced it on March 30, 2022 as a portable devkit
      for CI/CD pipelines from the creators of Docker. The public repository itself
      dates back to 2019, and the launch post says the project had been developed with
      early adopters before continuing in the open.
  related-projects:
    - >
      The launch post says Dagger is powered by BuildKit; current docs place it
      alongside container runtimes, SDKs, Dagger modules, Dagger Cloud, and
      OpenTelemetry tracing.
  sources:
    - https://dagger.io/blog/public-launch-announcement
    - https://docs.dagger.io/
    - https://docs.dagger.io/reference/configuration/modules
    - https://api.github.com/repos/dagger/dagger
  summary:
    - >
      Dagger is a software-delivery automation platform and CLI. It packages CI/CD
      automation as programmable, container-backed modules and functions that run
      locally, in CI, or in Dagger Cloud.
  timeline:
    - '2019: Public dagger/dagger GitHub repository is created.'
    - '2022: Dagger is publicly introduced as a portable devkit for CI/CD pipelines.'
    - '2022: Official launch post says development will continue in the open.'
    - '2026: Official docs describe Dagger as a platform for automating software delivery.'
  usage:
    - >
      Users invoke the dagger CLI to run functions, modules, checks, toolchains, and CI
      workflows. Current module configuration is centered on dagger-module.toml, while
      workspace commands such as dagger install, dagger config, and dagger settings
      update dagger.toml.
related-packages: []
category: developer-tools
package-manager:
  brew: dagger
  chocolatey: dagger
  macports: dagger
  pacman: dagger
  scoop: main/dagger
  winget: Dagger.Cli
package-manager-url: https://formulae.brew.sh/formula/dagger
license: Apache-2.0
tags:
  - automation
  - ci-cd
  - cli
  - containers
  - software-delivery
description: Portable devkit for CI/CD pipelines
executables:
