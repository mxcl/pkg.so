id: brew:minipro
display-name: minipro
homepage: https://gitlab.com/DavidGriffith/minipro/
repo: https://gitlab.com/DavidGriffith/minipro
docs:
  - https://gitlab.com/DavidGriffith/minipro#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The technical goal is to replace the vendor's Windows-centric programming utility
      with a Unix-friendly tool for Linux, BSD, macOS, and related systems. The upstream
      feature list covers TL866CS, TL866A, TL866II+, T48, and T56 compatibility; more
      than 13,000 supported target devices; ZIF40 and in-system-programming support;
      chip-ID verification; logic IC testing; bitbang support; overcurrent protection;
      and hardware self-tests. Typical use is direct and scriptable: choose a part with
      `-p`, read a ROM or EEPROM to a file, write an image, verify the chip, or run
      hardware checks.
  sources:
    - https://bugs.debian.org/949624
    - https://davidgriffith.gitlab.io/minipro/
    - https://formulae.brew.sh/formula/minipro
    - https://gitlab.com/DavidGriffith/minipro
    - https://www.mankier.com/1/minipro
  summary:
    - >
      minipro is an open-source command-line controller for XGecu MiniPro/TL866-family
      chip programmers. The project was created by Valentin Dudouyt in 2014; development
      later moved to coordination by David Griffith, whose GitLab project is the
      upstream used by package managers.
  usage:
    - >
      Its ecosystem is small but durable because the hardware is common in
      retrocomputing, firmware-repair, BIOS, EEPROM, AVR, PIC, and embedded-electronics
      workflows. Debian's packaging request described it as a utility for TL866 memory
      chip programmers, and Homebrew, MacPorts, Nix, APK, and Fedora-style packaging
      make it available without the vendor GUI.
related-packages:
  - id: brew:avrdude
    reason: >
      Choose AVRDUDE for AVR microcontrollers used with its extensive programmer and
      bootloader ecosystem; choose minipro when the target is handled through an XGecu
      multiprogrammer, especially for EEPROM, BIOS, PIC, or mixed-device work.
    rel: alternative
    sources:
      - https://davidgriffith.gitlab.io/minipro/
      - https://github.com/avrdudes/avrdude#readme
category: developer-tools
