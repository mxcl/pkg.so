docs:
  - https://docs.warp.dev/
  - https://docs.warp.dev/getting-started/quickstart/installation-and-setup
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Warp entered public beta on macOS in April 2022 and subsequently expanded to Linux
      and Windows. By the Warp 2.0 announcement in June 2025, the company reported more
      than half a million active terminal users.
    - >
      Homebrew Cask provides a conventional macOS installation path with `brew install
      --cask warp`, making the application easy to manage alongside other developer
      tools.
  package-nerd-significance:
    - >
      Warp is notable to package users because it combines a native Rust-based terminal
      with IDE-style command editing, structured command blocks, collaboration features,
      and integrated coding agents.
    - >
      Its evolution from a proprietary terminal into an open-source agentic development
      environment—and its separate stable and Preview release channels—makes it an
      unusual example of a desktop developer tool distributed through both native
      installers and package managers.
  project-history:
    - >
      Warp was created under founder and CEO Zach Lloyd as a from-first-principles
      attempt to modernize the terminal. The team publicly introduced the product in
      2021 and launched its macOS beta in April 2022.
    - >
      Warp Drive added shared, executable workflows in June 2023. Warp 2.0, announced in
      June 2025, repositioned the product as an Agentic Development Environment
      combining terminal, code, agents, and shared knowledge.
    - >
      On April 28, 2026, Warp announced that its client had become open source. The
      client source is maintained in the official `warpdotdev/warp` repository under
      AGPL-3.0 and MIT licenses.
  related-projects:
    - Warp Preview is the early-access release channel for experimental Warp features.
    - Warp Drive stores and shares terminal workflows and other team knowledge.
    - >
      Oz is Warp's agent orchestration platform and supplies local, CLI, and cloud-agent
      capabilities.
    - >
      The official `warpdotdev/workflows` and `warpdotdev/themes` repositories provide
      shareable extension content.
  sources:
    - https://docs.warp.dev/getting-started/quickstart/installation-and-setup
    - https://github.com/warpdotdev/warp
    - https://github.com/warpdotdev/warp/discussions/9240
    - https://www.warp.dev/blog/category/product
    - https://www.warp.dev/blog/reimagining-coding-agentic-development-environment
    - https://www.warp.dev/blog/warp-drive-series-b
    - https://www.warp.dev/blog/whos-behind-warp-meet-the-team
  summary:
    - >
      Warp is a cross-platform, Rust-based terminal and agentic development environment
      created to modernize command-line work. It combines terminal emulation, structured
      command output, rich command editing, shared workflows, and integrated
      software-development agents.
  timeline:
    - '2021: Warp publicly described its effort to reinvent the terminal.'
    - 'April 2022: Warp launched its public macOS beta.'
    - 'June 2023: Warp Drive introduced shared terminal workflows.'
    - 'June 2025: Warp 2.0 launched as an Agentic Development Environment.'
    - "April 2026: Warp's client became open source."
  usage:
    - >
      Developers use Warp as an interactive terminal for shells such as zsh, bash, and
      fish, with command history, completion, block-based output, workflows, and an
      editor-like command-entry experience.
    - >
      Warp can be installed as a macOS cask, through supported Linux package formats and
      repositories, or through Windows installers. The application also embeds local
      agents and access to Oz cloud-agent workflows.
