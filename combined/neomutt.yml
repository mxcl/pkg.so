id: brew:neomutt
display-name: NeoMutt
homepage: https://neomutt.org/
repo: https://github.com/neomutt/neomutt
docs:
  - https://docs.neomutt.org/
  - https://neomutt.org/guide
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/neomutt/neomuttrc
    - ~/.config/neomutt/neomuttrc
    - ~/.neomuttrc
    - ~/.neomutt/neomuttrc
    - /etc/neomuttrc
    - /etc/NeoMutt/neomuttrc
credentials-file-location: null
history:
  adoption-history:
    - >
      NeoMutt grew by offering a maintained home for Mutt enhancements that
      distributions and users had been carrying separately. Its official history says
      regular releases and feature stabilization began in 2016, and the features page
      shows many stable features dated in 2016, including Notmuch, NNTP, sidebar, status
      color, progress bar, and trash-folder support.
  package-nerd-significance:
    - >
      NeoMutt is important because it turned the Mutt patch-stack culture into a
      packaged tool with regular releases. On the 2026-05-12 Homebrew API snapshot, the
      formula reported 6,330 installs over 365 days and 696 installs over 30 days, which
      is a healthy signal for a power-user terminal mail client.
  project-history:
    - >
      NeoMutt's own history says Mutt was created by Michael Elkins in 1995 and became a
      favorite among terminal-mail users. NeoMutt formed in the mid-2010s when Richard
      Russon gathered long-standing Mutt patches, fixed and documented them, and made
      the result a 'project of projects' for developers and patch users.
  related-projects:
    - Mutt
    - Notmuch
    - Maildir
    - NNTP
    - GnuPG
    - isync
    - msmtp
  sources:
    - https://api.github.com/repos/neomutt/neomutt
    - https://docs.neomutt.org/explanation/history.html
    - https://formulae.brew.sh/api/formula/neomutt.json
    - https://github.com/neomutt/neomutt/blob/main/README.md
    - https://neomutt.org/2017/06/02/release
    - https://neomutt.org/feature.html
    - https://neomutt.org/feature/notmuch
  summary:
    - >
      NeoMutt is a terminal mail user agent that preserves Mutt's keyboard-driven Unix
      workflow while collecting and maintaining features that had long lived as external
      Mutt patches. Its package value comes from shipping those features together:
      Notmuch, NNTP, sidebar behavior, Lua, LMDB header caching, SMTP/IMAP/POP support,
      and extensive configuration.
  timeline:
    - "1995: Mutt created by Michael Elkins, according to NeoMutt's history page."
    - '2015-12-21: neomutt/neomutt GitHub repository created.'
    - '2016: NeoMutt begins regular releases and stabilizing fork features.'
    - >
      2017-06-02: NeoMutt release notes made sidebar, IMAP, POP, SMTP, compressed, and
      NNTP always built.
    - '2026-05-04: Homebrew formula stable version 20260504.'
  usage:
    - >
      Package nerds use NeoMutt when they want mail in the terminal but do not want to
      assemble a patch stack themselves. Common setups pair it with local Maildir,
      isync/mbsync or OfflineIMAP, msmtp, GnuPG, address books, and Notmuch virtual
      mailboxes. The Homebrew formula's dependencies reflect that style: gpgme, notmuch,
      lmdb, lua, ncurses, pcre2, sqlite, OpenSSL, and related libraries.
related-packages:
  - id: brew:mutt
    reason: >
      Choose Mutt for the more conservative upstream terminal-mail client; NeoMutt keeps
      much of its workflow and configuration while integrating additional formerly
      external patches and features.
    rel: alternative
    sources:
      - https://docs.neomutt.org/howto/mutt-migration.html
      - https://docs.neomutt.org/explanation/history.html
      - https://www.mutt.org/
  - id: brew:notmuch
    reason: >
      Notmuch indexes a local Maildir for fast full-text search and exposes the results
      to NeoMutt as virtual mailboxes.
    rel: adjacent_workflow
    sources:
      - https://docs.neomutt.org/tutorials/notmuch-setup.html
      - https://notmuchmail.org/doc/latest/
  - id: brew:isync
    reason: >
      isync's mbsync executable synchronizes IMAP folders into a local Maildir that
      NeoMutt can read, including workflows that update Notmuch after each sync.
    rel: adjacent_workflow
    sources:
      - https://docs.neomutt.org/tutorials/mbsync-setup.html
      - https://isync.sourceforge.io/mbsync.html
  - id: brew:msmtp
    reason: >
      msmtp can serve as NeoMutt's external sendmail backend, adding independent
      per-account SMTP profiles, logging, and queue-oriented workflows.
    rel: adjacent_workflow
    sources:
      - https://docs.neomutt.org/tutorials/msmtp-setup.html
      - https://marlam.de/msmtp/documentation
category: productivity
package-manager:
  apk: neomutt
  brew: neomutt
  debian: neomutt
  dnf: neomutt
  macports: neomutt
  nix: neomutt
  pacman: neomutt
  ubuntu: neomutt
  zypper: neomutt
package-manager-url: https://formulae.brew.sh/formula/neomutt
license: GPL-2.0-or-later
tags:
  - cli
  - email
  - imap
  - mail-client
  - nntp
  - notmuch
  - smtp
  - terminal
description: E-mail reader with support for Notmuch, NNTP and much more
executables:
  - neomutt
provenance:
  formula: neomutt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
