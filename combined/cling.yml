id: brew:cling
display-name: Cling
homepage: https://root.cern/cling/
repo: https://github.com/root-project/cling
docs:
  - https://root.cern/manual/cling
  - https://root.cern/cling
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Cling's adoption is strongest through ROOT rather than as an isolated package. In
      package-manager culture, standalone formulae such as Homebrew and Nix expose it to
      users who want an interactive C++ REPL without installing or centering an entire
      ROOT workflow.
  package-nerd-significance:
    - >
      Cling is package-nerd significant because it turns a compiled language and a large
      compiler infrastructure into a packaged interactive runtime. It also illustrates
      the maintenance burden of packaging tools that track LLVM and Clang closely, which
      is why distribution recipes matter for users who just want a working C++ REPL.
  project-history:
    - >
      Cling emerged from the ROOT high-energy physics ecosystem as the new interpreter
      for ROOT 6. The official README includes a peer-reviewed CHEP 2012 citation,
      'Cling - The New Interactive Interpreter for ROOT 6', and the ROOT documentation
      presents Cling as ROOT's C++ interpreter.
  related-projects:
    - >
      Cling is directly related to ROOT, Clang, LLVM, and Jupyter. It belongs near other
      interactive language runtimes and C++ exploration tools, but its official lineage
      is ROOT and LLVM/Clang rather than a general scripting-language implementation.
  sources:
    - https://github.com/root-project/cling#readme
    - https://root.cern/cling
    - https://root.cern/manual/cling
    - https://github.com/root-project/cling/blob/master/docs/ReleaseNotes.md
  summary:
    - >
      Cling is an interactive C++ interpreter built on Clang and LLVM. The official
      README describes it as a REPL that reuses Clang diagnostics, supports interactive
      C++ development, and can be used from the command line or as a Jupyter kernel.
  timeline:
    - '2012: CHEP publication describes Cling as the new interactive interpreter for ROOT 6.'
    - >
      2010s: Cling release tags progress from v0.4 through v1.x in the official
      repository tag list.
    - >
      2020s: Official README documents standalone builds, LLVM/Clang integration,
      Jupyter support, and ROOT manual integration.
    - '2026: Batch input lists Homebrew and Nix distribution.'
  usage:
    - >
      The README documents building Cling with the matching root-project LLVM branch,
      running cling with inline C++ snippets or an interactive prompt, using .help, and
      enabling a Jupyter kernel. The ROOT manual covers prompt commands and interactive
      C++ usage inside ROOT.
related-packages:
  - id: brew:root
    reason: >
      Choose ROOT when you want Cling embedded in CERN's full scientific data-analysis
      framework, where it powers the interactive C++ prompt and runtime services.
    rel: adjacent_workflow
    sources:
      - https://root.cern/manual/cling/
      - https://root.cern/cling/cling_in_brief/
  - id: brew:jupyterlab
    reason: >
      Use JupyterLab with Cling's bundled kernel to work with interactive C++ in
      notebook documents instead of only at the terminal REPL.
    rel: adjacent_workflow
    sources:
      - https://github.com/root-project/cling#jupyter
      - https://jupyter.org/
category: language-runtime
package-manager:
  brew: cling
  nix: cling
package-manager-url: https://formulae.brew.sh/formula/cling
license: (LGPL-2.1-only OR NCSA) AND (Apache-2.0 WITH LLVM-exception)
tags:
  - clang
  - cli
  - cpp
  - interpreter
  - llvm
  - repl
description: C++ interpreter
executables:
  - cling
provenance:
  formula: cling
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
