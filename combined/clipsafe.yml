id: brew:clipsafe
display-name: cliPSafe
homepage: https://waxandwane.org/clipsafe.html
repo: https://github.com/rpmohn/clipsafe
docs:
  - https://waxandwane.org/clipsafe.html
config-file-location:
  unix: ~/.passwordsafe/preferences.properties
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears niche. Homebrew packages version 1.1 from the official waxandwane
      tarball and reported only dozens of on-request installs over the preceding year.
      Password Safe's related-projects page lists cliPSafe as the Perl command-line
      interface for PasswordSafe version 3 databases.
  package-nerd-significance:
    - >
      cliPSafe is package-nerd significant mainly as preservation: it keeps a late-2000s
      Perl CLI path into Password Safe v3 databases available in Homebrew. Its narrow
      read-only design, CPAN dependencies, and tiny upstream footprint make it a
      historical utility rather than a broad modern password-manager ecosystem.
  project-history:
    - >
      The official waxandwane page describes cliPSafe as a read-only command-line
      interface to Password Safe databases, written by Ross Palmer Mohn and licensed
      under GPLv2. It says the tool works with Password Safe version 3 databases and
      imports code from Crypt::Pwsafe and Term::Complete with local modifications.
    - >
      The official download section lists version 1.1 as a 2008-12-08 tarball. A GitHub
      repository under rpmohn/clipsafe exists with the same project description, a very
      small commit history, and Perl as the dominant language.
  related-projects:
    - >
      The official page states that Password Safe was originally written by Bruce
      Schneier and is now an open-source SourceForge-hosted project.
    - >
      Password Safe's related-projects page lists cliPSafe alongside other Password Safe
      compatible tools such as opws, pwsafe, Password Gorilla, Crypt::Pwsafe3, and
      Crypt::Pwsafe.
  sources:
    - https://waxandwane.org/clipsafe.html
    - https://github.com/rpmohn/clipsafe
    - https://pwsafe.org/relatedprojects.shtml
    - https://formulae.brew.sh/api/formula/clipsafe.json
  summary:
    - >
      cliPSafe is a Perl command-line interface for reading Password Safe version 3
      databases. It is a small, older security utility preserved through its official
      homepage, a GitHub source repository, and Homebrew.
  timeline:
    - >
      2008: Official page copyright and project text identify Ross Palmer Mohn and GPLv2
      licensing.
    - '2008-12-08: Official page lists cliPSafe 1.1 tarball.'
    - '2022-12-31: Official page footer shows last modified date.'
    - '2026: Homebrew formula tracks stable release 1.1 from waxandwane.org.'
  usage:
    - >
      Users run `clipsafe [-f dbfname] [rxp]`; if a database path is not supplied, the
      tool looks in `~/.passwordsafe/preferences.properties` for the most recently used
      file, then prompts for a path. It prompts for the master password and supports
      commands such as `ls`, `cg`, `show`, `exit`, and `quit`.
related-packages:
  - id: brew:pwsafe
    reason: >
      Choose pwsafe when you need a command-line Password Safe client that can create
      and modify databases, rather than cliPSafe's documented read-only access.
    rel: alternative
    sources:
      - https://waxandwane.org/clipsafe.html
      - https://github.com/nsd20463/pwsafe#readme
      - https://github.com/nsd20463/pwsafe/blob/master/pwsafe.1.in
category: security
package-manager:
  brew: clipsafe
package-manager-url: https://formulae.brew.sh/formula/clipsafe
license: GPL-2.0-or-later
tags:
  - cli
  - password-manager
  - password-safe
  - perl
  - read-only
  - security
description: Command-line interface to Password Safe
executables:
  - clipsafe
provenance:
  formula: clipsafe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
