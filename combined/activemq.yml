id: brew:activemq
display-name: Apache ActiveMQ
homepage: https://activemq.apache.org/
repo: https://github.com/apache/activemq
docs:
  - https://activemq.apache.org/components/classic/documentation
  - https://activemq.apache.org/xml-configuration
config-file-location:
  unix:
    - ${ACTIVEMQ_HOME}/conf/activemq.xml
    - ${ACTIVEMQ_HOME}/conf/jetty.xml
credentials-file-location:
  unix: ${activemq.conf}/credentials.properties
history:
  adoption-history:
    - >
      ActiveMQ became a common package-manager entry because it ships as a runnable
      message broker with an `activemq` command, default configuration files, and broad
      protocol support. The Apache site highlights use from Java, C, C++, C#, Ruby,
      Perl, Python, PHP, and browser-facing APIs.
    - >
      The project continues to publish maintained 5.x and 6.x Classic releases; the
      Apache news feed lists ongoing 5.19.x maintenance and 6.2.x releases in 2026.
  package-nerd-significance:
    - >
      ActiveMQ matters to package maintainers because it is both a daemon-style service
      and a developer integration tool: packages must preserve configuration layout,
      broker scripts, Java runtime assumptions, and web-console credentials behavior.
    - >
      It is also a representative Java server package whose version streams can coexist
      in enterprise environments, making default config paths and upgrade notes more
      important than a simple CLI formula.
  project-history:
    - >
      The ActiveMQ Classic documentation describes a broker configured through XML
      deployment descriptors and notes that version 4.0 adopted XBean-based XML
      configuration. The project has since kept the broker as a standalone server,
      embeddable Java component, and protocol bridge for enterprise integration
      patterns.
    - >
      The Apache project site now distinguishes ActiveMQ Classic from related ActiveMQ
      components, while the Apache GitHub repository is the official source-control
      location for the Classic code line.
  related-projects:
    - >
      ActiveMQ Artemis is a related Apache messaging broker project under the ActiveMQ
      family. ActiveMQ Classic also relates to Apache NMS client libraries and protocol
      peers for STOMP, AMQP, MQTT, and OpenWire.
  sources:
    - https://activemq.apache.org/components/classic/
    - https://activemq.apache.org/news/
    - https://activemq.apache.org/xml-configuration
    - https://api.github.com/repos/apache/activemq
  summary:
    - >
      Apache ActiveMQ is the Apache Software Foundation's long-running open source
      message broker line. The Classic distribution is a Java broker for JMS, Jakarta
      Messaging, and cross-language protocols including OpenWire, STOMP, AMQP, and MQTT.
  timeline:
    - '2006: ActiveMQ 4.0-era documentation adopted XBean XML configuration.'
    - '2009: The Apache GitHub mirror for `apache/activemq` was created.'
    - '2023: ActiveMQ Classic 6.0.0 began the Classic 6.x series.'
    - '2026: Apache published ActiveMQ 5.19.x maintenance and 6.2.x releases.'
  usage:
    - >
      Package users typically install ActiveMQ to run a local or server-side message
      broker, edit `${ACTIVEMQ_HOME}/conf/activemq.xml`, and start the `activemq`
      command. The XML configuration imports `jetty.xml` for the web console and reads
      `${activemq.conf}/credentials.properties` through Spring property placeholders.
related-packages:
  - id: brew:activemq-cpp
    reason: >
      Use ActiveMQ-CPP alongside an ActiveMQ broker when a native C++ application needs
      a CMS-style client using OpenWire or STOMP over TCP or SSL.
    rel: adjacent_workflow
    sources:
      - https://activemq.apache.org/components/cms/documentation
      - https://activemq.apache.org/components/classic/
category: data
package-manager:
  brew: activemq
  chocolatey: ActiveMQ
  debian: activemq
  nix: activemq
  scoop: extras/activemq
  ubuntu: activemq
package-manager-url: https://formulae.brew.sh/formula/activemq
license: Apache-2.0
tags:
  - apache
  - cli
  - jms
  - message-broker
  - messaging
  - server
description: 'Apache ActiveMQ: powerful open source messaging server'
executables:
  - activemq
provenance:
  formula: activemq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
