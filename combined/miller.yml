id: brew:miller
display-name: Miller
homepage: https://github.com/johnkerl/miller
repo: https://github.com/johnkerl/miller
docs:
  - https://github.com/johnkerl/miller
config-file-location:
  unix:
    - ~/.mlrrc
    - ./.mlrrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Miller's package-manager footprint is broad: the README lists installation through
      apt, yum, snap, Homebrew, MacPorts, Chocolatey, WinGet, and Scoop, and the av.db
      record also maps it across APK, Debian, DNF, Nix, Pacman, Ubuntu, and Zypper. It
      is used as a shell-pipeline tool for data cleaning, ETL preparation, log
      processing, statistical summaries, format conversion, and database-query
      post-processing. Its adoption signals include thousands of GitHub stars, many
      contributors, and community documentation and talks aimed at CSV and command-line
      data users.
  project-history:
    - >
      The technical milestone that defines Miller is its key-value record model. Its
      README describes it as being like awk, sed, cut, join, and sort for CSV, TSV,
      JSON, JSON Lines, and positionally indexed data; it can add, drop, sort,
      aggregate, pretty-print, and convert fields while streaming records. The
      documentation explains that Miller's natural data structure is an
      insertion-ordered hash map, which lets it handle heterogenous records and
      format-aware operations such as preserving CSV headers.
  sources:
    - https://formulae.brew.sh/formula/miller
    - https://github.com/johnkerl/miller
    - https://johnkerl.org/miller%2Ccsv%2Cconf%2Cv7/miller%2Ccsv%2Cconf%2Cv7.pdf
    - https://miller.readthedocs.io/en/latest/
    - https://miller.readthedocs.io/en/latest/performance/
  summary:
    - >
      Miller, whose executable is `mlr`, is John Kerl's command-line data-processing
      tool for record-oriented formats. Kerl's csv,conf,v7 slides describe the origin as
      roughly 2015: he wanted a record-aware tool because classic Unix commands such as
      grep, cut, and sort are line-aware and column-index oriented. The project name and
      design reflect that Unix-toolkit lineage, but with fields addressed by name rather
      than by position.
  usage:
    - >
      A major implementation milestone was the Go line, represented by Miller 6. The
      performance documentation notes CSV and record I/O improvements in Miller 6, later
      allocation and garbage-collection reductions, and a portable single-binary Go
      implementation with no runtime dependencies. This made Miller easier to distribute
      as a small CLI while keeping its niche as a data-aware companion to the
      traditional Unix toolkit, jq, xsv, csvtk, q, Nushell, pandas, and SQL databases.
related-packages:
  - id: brew:csvkit
    reason: >
      Choose csvkit when a suite of focused Python commands for conversion, inspection,
      joins, statistics, and SQL-oriented CSV work fits the workflow; choose Miller for
      one streaming multi-format executable with a record-processing DSL.
    rel: alternative
    sources:
      - https://miller.readthedocs.io/en/latest/
      - https://csvkit.readthedocs.io/en/latest/
  - id: brew:jq
    reason: >
      Use jq beside Miller when a pipeline needs jq's dedicated JSON query language,
      while Miller handles CSV, TSV, JSON Lines, and other record-oriented formats
      before or after that JSON stage.
    rel: adjacent_workflow
    sources:
      - https://miller.readthedocs.io/en/latest/file-formats/
      - https://jqlang.org/manual/
category: data
package-manager:
  apk: miller
  brew: miller
  debian: miller
  dnf: miller
  macports: miller
  nix: miller
  pacman: miller
  scoop: main/miller
  ubuntu: miller
  winget: Miller.Miller
  zypper: miller
package-manager-url: https://formulae.brew.sh/formula/miller
license: BSD-2-Clause
