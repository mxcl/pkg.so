history:
  adoption-history:
    - >
      Tencent describes Tencent Video as its flagship online-entertainment platform. In
      2021, Tencent grouped it with Weishi, YingYongBao, Tencent Sports, and WeTV in a
      new Online Video Business Unit intended to share content and technical
      capabilities.
    - >
      Tencent reported that subscriptions exceeded 100 million in 2023, marking its
      development into a large subscription streaming service.
  package-nerd-significance:
    - >
      The Homebrew cask provides reproducible installation of a proprietary,
      region-focused macOS streaming client whose upstream distribution is otherwise
      managed through Tencent's download site.
  project-history:
    - >
      Tencent launched Tencent Video at v.qq.com in March 2011. By its tenth anniversary
      in 2021, Tencent described it as the company's flagship online-entertainment
      platform and reorganized it into the Online Video Business Unit.
  related-projects:
    - WeTV
    - Weishi
    - Tencent Sports
    - QQ
  sources:
    - 'Official product download page: https://v.qq.com/download.html'
    - >
      Tencent Online Video Business Unit announcement:
      https://www.tencent.com/en-us/articles/2201167.html
    - 'Tencent official history: https://www.tencent.com/who-we-are/our-story/'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Tencent Video is Tencent's online video-streaming platform. The qqlive cask
      installs its macOS desktop client, retaining the older QQLive package name.
  timeline:
    - '2011: Tencent launched Tencent Video at v.qq.com.'
    - "2021: Tencent Video became part of Tencent's Online Video Business Unit."
    - '2023: Tencent reported more than 100 million Tencent Video subscriptions.'
  usage:
    - >
      Viewers use the desktop client to browse and stream Tencent's licensed and
      original video catalog. Subscription and account state are service-managed; no
      official standalone credentials file is documented.
