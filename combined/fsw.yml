id: brew:fsw
display-name: fsw
homepage: https://emcrisostomo.github.io/fsw/
repo: https://github.com/emcrisostomo/fsw
docs:
  - https://github.com/emcrisostomo/fsw#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      fsw's adoption history is mostly transitional. The supplied package data shows a
      Homebrew package, but the official README redirected long-term users toward
      fswatch after the merger.
  package-nerd-significance:
    - >
      fsw is historically interesting because it explains how the modern fswatch package
      absorbed a parallel cross-platform watcher effort. For package maintainers, it is
      mainly a predecessor and compatibility waypoint rather than the active upstream.
  project-history:
    - >
      The fsw README says it was written at the end of 2013 to provide both a drop-in
      replacement for Alan Dipert's original fswatch and a common front end for OS X
      FSEvents, BSD kqueue, and Linux inotify.
    - >
      In April 2014, the fsw and fswatch authors agreed to merge the two programs, with
      Enrico Crisostomo taking over fswatch maintenance. The fsw README states that
      development would continue in the main fswatch repository and that fsw would
      likely be frozen.
  related-projects:
    - fswatch is the direct successor project and long-term upstream.
    - >
      fsw relates to the operating-system event APIs it wrapped: FSEvents, kqueue,
      inotify, and stat-based polling.
  sources:
    - https://api.github.com/repos/emcrisostomo/fsw
    - https://emcrisostomo.github.io/fsw
    - https://github.com/emcrisostomo/fsw
    - https://raw.githubusercontent.com/emcrisostomo/fsw/master/README.md
  summary:
    - >
      fsw was Enrico M. Crisostomo's 2013-2014 cross-platform file-change monitor, later
      merged into fswatch.
  timeline:
    - '2009: Alan Dipert wrote the first fswatch implementation for OS X FSEvents.'
    - '2013: Enrico M. Crisostomo wrote fsw as a broader cross-platform front end.'
    - '2014: fsw public repository created.'
    - '2014: fsw and fswatch merged, with future development continuing in fswatch.'
  usage:
    - >
      fsw accepts a list of paths and emits change events when those files or
      directories are modified. Its project page documents four monitors: OS X FSEvents,
      BSD kqueue, Linux inotify, and a portable stat-based polling monitor.
    - >
      The project page recommends release tarballs for normal users and reserves
      repository checkouts for developers with the GNU Build System.
related-packages:
  - id: brew:fswatch
    reason: >
      Choose fswatch for the actively maintained successor into which fsw was merged,
      with broader platform support and current documentation.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/emcrisostomo/fsw/master/README.md
      - https://emcrisostomo.github.io/fswatch/
category: developer-tools
package-manager:
  brew: fsw
package-manager-url: https://formulae.brew.sh/formula/fsw
license: GPL-3.0-or-later
tags:
  - automation
  - cli
  - file-watcher
  - filesystem-events
  - multiple-backends
description: File change monitor with multiple backends
executables:
  - fsw
  - fswatch-run
  - fswatch-run-bash
  - fswatch-run-zsh
provenance:
  formula: fsw
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
