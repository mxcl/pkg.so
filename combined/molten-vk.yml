history:
  adoption-history:
    - >
      In practice MoltenVK is linked into games, emulators, engines, and graphics
      applications that already speak Vulkan and need Apple-platform deployment without
      rewriting their renderer around Metal. Its repository describes a layered Vulkan
      1.4 implementation over Metal for macOS, iOS, tvOS, visionOS, simulators, Mac
      Catalyst, and Apple Silicon, with automatic SPIR-V to Metal Shading Language
      conversion and a standalone MoltenVKShaderConverter tool. Khronos material lists
      users and adjacent projects including Dota 2, Metro Exodus, Final Fantasy XIV,
      DXVK, VKD3D, Google Android Emulator, Dolphin, Autodesk Fusion 360, Google
      Filament, and other engines and games.
  project-history:
    - >
      Its major ecosystem turn came on February 26, 2018, when Khronos announced the
      Vulkan Portability Initiative with Valve, LunarG, and The Brenwill Workshop. That
      announcement released MoltenVK as open source under Khronos stewardship, described
      it as translating the portable Vulkan subset to Metal on macOS and iOS, and tied
      it to the macOS Vulkan SDK work. Valve's Dota 2 port was used as an early
      production example of the value of the stack.
  sources:
    - https://formulae.brew.sh/formula/molten-vk
    - https://github.com/KhronosGroup/MoltenVK
    - https://moltengl.com/press/moltenvk-brings-vulkan-to-ios-and-macos/
    - >
      https://vulkan.org/user/pages/09.events/vulkanised-2024/vulkansied-2024-bill-hollings-brenwill.pdf
    - https://www.khronos.org/news/press/vulkan-applications-enabled-on-apple-platforms
  summary:
    - >
      MoltenVK began at The Brenwill Workshop Ltd. as a commercial portability layer for
      running Vulkan graphics code on Apple's Metal framework. Brenwill announced the
      product in July 2016 for iOS and macOS, with Bill Hollings presenting it around
      SIGGRAPH as a way for game developers to keep Vulkan-style rendering paths while
      targeting Apple platforms.
  usage:
    - >
      As a Homebrew package, molten-vk occupies a developer-tool niche rather than a
      command-heavy CLI niche: it ships the runtime and shader-conversion tooling for
      local Vulkan-on-Apple builds. It sits beside the Vulkan SDK and portability-layer
      ecosystem rather than replacing native Vulkan drivers.
related-packages:
  - id: brew:spirv-cross
    reason: >
      SPIRV-Cross is the shader cross-compiler MoltenVK uses to translate SPIR-V toward
      Metal Shading Language, making its standalone tools useful when inspecting or
      preparing the same shader pipeline.
    rel: adjacent_workflow
    sources:
      - https://www.khronos.org/news/press/vulkan-applications-enabled-on-apple-platforms
      - https://github.com/KhronosGroup/SPIRV-Cross
  - id: brew:vulkan-tools
    reason: >
      Vulkan Tools supplies vulkaninfo and vkcube-style utilities for inspecting and
      smoke-testing the Vulkan environment in which a MoltenVK-backed application runs.
    rel: adjacent_workflow
    sources:
      - https://github.com/KhronosGroup/MoltenVK
      - https://github.com/KhronosGroup/Vulkan-Tools
