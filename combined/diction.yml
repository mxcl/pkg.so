id: brew:diction
display-name: GNU diction
homepage: https://www.gnu.org/software/diction/
repo: https://git.savannah.gnu.org/cgit/diction.git
docs:
  - https://www.gnu.org/software/diction
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU diction's adoption story is modest and package-manager oriented: it keeps a
      small, classic prose-checking command available on systems where the original Unix
      tools are no longer bundled. Its value is strongest for users who like scriptable
      text filters rather than editor-integrated writing assistants.
  package-nerd-significance:
    - >
      The package is a small example of GNU preserving an old Unix userland niche: plain
      text in, diagnostics out, no service, no account, and no project-local
      configuration.
  project-history:
    - >
      The GNU source release describes diction and style as free implementations of
      older standard Unix commands that disappeared from many modern systems after being
      unbundled. Its manual page says the historical diction command came from old Unix
      systems and the AT&T Documenter's Workbench, while GNU diction is a
      reimplementation that can be paired with deroff, dehtml, or detex.
    - >
      The 1.11 release tarball records support for Dutch, GPLv3 licensing, and autoconf
      2.61. The GNU FTP archive shows public GNU releases from 0.7 in 1998 through 1.11
      in 2007.
  related-projects:
    - >
      AT&T DWB diction/style, deroff, dehtml, detex, and fmt are the closest historical
      and pipeline neighbors.
  sources:
    - https://www.gnu.org/software/diction
    - https://git.savannah.gnu.org/cgit/diction.git
    - https://ftp.gnu.org/gnu/diction/
    - https://ftp.gnu.org/gnu/diction/diction-1.11.tar.gz
  summary:
    - >
      GNU diction packages two old Unix-style writing aids, diction and style, as free
      software. The tools scan prose for wordy or commonly misused phrases and report
      surface readability measures from the command line.
  timeline:
    - '1997: GNU diction copyright range begins in the 1.11 manual page.'
    - '1998: diction 0.7 appears in the GNU FTP archive.'
    - '2007: diction 1.11 is released with Dutch support and GPLv3 licensing.'
  usage:
    - >
      diction reads files or standard input and marks sentences containing phrases from
      its language databases; style reports readability and other surface
      characteristics. The manual documents pipelines with deroff for roff documents,
      and similar use with dehtml or detex for HTML and TeX.
related-packages:
  - id: brew:vale
    reason: >
      Choose Vale for configurable, syntax-aware prose linting with reusable style
      rules; choose GNU diction for lightweight phrase warnings and classic readability
      statistics in Unix text pipelines.
    rel: alternative
    sources:
      - https://www.gnu.org/software/diction/
      - https://docs.vale.sh/
category: productivity
