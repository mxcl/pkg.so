id: brew:git-now
display-name: git-now
homepage: https://github.com/iwata/git-now
repo: https://github.com/iwata/git-now
docs:
  - https://github.com/iwata/git-now#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-now had a modest but visible command-line audience: GitHub metadata records
      more public attention than the smallest Git helper scripts in this batch, and the
      README documented Homebrew installation alongside manual and Windows installation
      paths. The tag series in 2011 shows active early packaging around the 0.0 and 0.1
      releases.
  package-nerd-significance:
    - >
      The tool belongs to the class of Git workflow extensions that make local history
      cheaper to create and later reshape. It is notable to package maintainers because
      it bundles shell scripts, shFlags, shell completion support, Homebrew
      instructions, and an msysgit-era Windows installer path.
  project-history:
    - >
      The GitHub repository was created on 2011-08-29. The README links the concept back
      to a 2010 note by sinsoku and original code by Toshiyuki Kawanishi, showing that
      the package grew from a Japanese Git workflow idea into a standalone shell-based
      tool.
  related-projects:
    - gitflow
    - git add
    - Git rebase workflows
  sources:
    - https://formulae.brew.sh/formula/git-now
    - https://github.com/iwata/git-now
    - https://raw.githubusercontent.com/iwata/git-now/master/README.mdown
  summary:
    - >
      git-now is a Git helper for making light, temporary commits whose messages are
      derived from the time and diff. The README credits an earlier git-now idea and
      original code, then presents the Iwata repository as a packaged command-line
      implementation with subcommands for managing those temporary commits.
  timeline:
    - '2010: README credits the original git-now idea.'
    - '2011: Iwata repository was created on GitHub.'
    - '2011: v0.0.4.2, v0.1.0.0, and v0.1.1.0 tags were published during early iteration.'
  usage:
    - >
      Developers use git-now to checkpoint work without crafting a durable commit
      message. The command accepts many git-add style options, creates a temporary
      commit, and provides rebase, push, and grep subcommands for cleaning up or working
      with those generated commits.
related-packages:
  - id: brew:git
    reason: >
      Git's built-in stash also records unfinished work, but it restores a clean working
      tree and keeps the snapshot outside normal branch history, whereas git-now
      deliberately creates temporary commits that can later be rebased or pushed.
    rel: alternative
    sources:
      - https://github.com/iwata/git-now#readme
      - https://git-scm.com/docs/git-stash
category: developer-tools
package-manager:
  brew: git-now
package-manager-url: https://formulae.brew.sh/formula/git-now
license: GPL-2.0-only
tags:
  - cli
  - git
  - git-extension
  - temporary-commits
  - workflow
description: Light, temporary commits for git
executables:
  - git-now
provenance:
  formula: git-now
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
