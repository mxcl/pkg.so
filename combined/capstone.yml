id: brew:capstone
display-name: Capstone
homepage: https://www.capstone-engine.org/
repo: https://github.com/capstone-engine/capstone
docs:
  - https://www.capstone-engine.org/documentation.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Capstone became widely adopted because reverse-engineering tools needed a reusable
      disassembler library rather than every project owning architecture-specific decode
      code. The official site collects testimonials from reverse engineers and tool
      authors calling it a standard or gold standard disassembly engine.
    - >
      The official documentation documents repository installation across Homebrew,
      MacPorts, Debian, Ubuntu, FreeBSD, OpenBSD, NetBSD, and Python packaging. The
      batch package metadata adds Alpine, Fedora, Nix, Arch, Scoop, and openSUSE, which
      reflects broad cross-platform packaging.
  package-nerd-significance:
    - >
      Capstone is package-nerd significant because it is a foundational native library
      with many downstream language bindings. A system package can satisfy C/C++
      consumers, Python users, command-line users, and reverse-engineering tools that
      dynamically link against the same engine.
    - >
      It also illustrates a common packaging headache: a security-oriented C library
      with fast-moving architecture support, multiple major branches, Python wheels,
      bindings outside the main tree, and tools that expect the CLI, headers, and shared
      library to line up.
  project-history:
    - >
      The official README says Capstone was created by Nguyen Anh Quynh and then
      developed and maintained by a small community. Its goal is to be an
      architecture-neutral disassembly engine for binary analysis and reversing in the
      security community.
    - >
      Capstone's official site emphasizes a pure-C core, a simple API, detailed
      instruction decomposition, implicit register semantics, thread safety, embedding
      support for firmware or kernels, and native support across Windows, macOS, iOS,
      Android, Linux, BSD, Solaris, and other Unix-like systems.
    - >
      The project appeared publicly on GitHub in 2013 and was presented in technical
      form at Black Hat USA 2014. By 2026 the official download page listed 6.0.0-Alpha9
      as the current version, while GitHub releases showed active 5.x maintenance and
      6.x alpha development.
  related-projects:
    - >
      Keystone is a related assembler framework from the same authorial ecosystem, often
      paired conceptually with Capstone for assembly and disassembly workflows.
    - >
      Unicorn is a related CPU emulator framework commonly used with Capstone in
      binary-analysis stacks.
    - >
      Rizin and radare2 are reverse-engineering frameworks in Capstone's wider
      ecosystem; Rizin is also shown as a release sponsor on the official site.
    - >
      Language bindings such as capstone-rs, Node-Capstone, LuaCapstone, Capstone.NET,
      and Java bindings are listed by the official download page.
  sources:
    - https://api.github.com/repos/capstone-engine/capstone/releases
    - https://github.com/capstone-engine/capstone
    - https://github.com/capstone-engine/capstone/blob/next/README.md
    - https://www.capstone-engine.org/
    - https://www.capstone-engine.org/documentation.html
    - https://www.capstone-engine.org/download.html
    - input.json source_facts.package-manager
  summary:
    - >
      Capstone is a lightweight, multi-platform, multi-architecture disassembly
      framework used in binary analysis, malware analysis, reverse engineering, and
      security tooling.
  timeline:
    - '2013: capstone-engine/capstone repository is created on GitHub.'
    - >
      2014: Capstone technical details are presented in Black Hat USA slides linked from
      the official site.
    - '2015: Official docs record Capstone availability in several Unix package repositories.'
    - '2025: Capstone 6.0.0 alpha releases begin appearing in the GitHub release feed.'
    - '2026-05-29: Official download page lists Capstone 6.0.0-Alpha9 as the current release.'
  usage:
    - >
      Developers embed Capstone as a library to disassemble bytes for many CPU
      architectures and retrieve instruction details. The Homebrew package also provides
      cstool, a command-line utility for quick disassembly tasks.
    - >
      Capstone is used in reverse-engineering frameworks, malware-analysis tools,
      debuggers, firmware analysis, exploit research, and educational tooling. Bindings
      listed by the official site and README cover many languages, making the C engine
      available beyond C and C++ applications.
related-packages:
  - id: brew:keystone
    reason: >
      Keystone complements Capstone by assembling multi-architecture instruction text
      into machine code, while Capstone performs the reverse disassembly operation.
    rel: adjacent_workflow
    sources:
      - https://www.capstone-engine.org/showcase.html
      - https://github.com/keystone-engine/keystone
  - id: brew:radare2
    reason: >
      Radare2 provides a complete command-line reverse-engineering environment in which
      a disassembly engine such as Capstone participates as one part of a wider analysis
      workflow.
    rel: adjacent_workflow
    sources:
      - https://www.capstone-engine.org/showcase.html
      - https://github.com/radareorg/radare2
category: developer-tools
package-manager:
  apk: capstone
  brew: capstone
  debian: capstone-tool
  dnf: capstone
  macports: capstone
  nix: capstone
  pacman: capstone
  scoop: main/capstone
  ubuntu: capstone-tool
  zypper: capstone
package-manager-url: https://formulae.brew.sh/formula/capstone
license: BSD-3-Clause
