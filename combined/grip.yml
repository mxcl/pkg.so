id: brew:grip
display-name: Grip
homepage: https://github.com/joeyespo/grip
repo: https://github.com/joeyespo/grip
docs:
  - https://github.com/joeyespo/grip#readme
config-file-location:
  unix: ~/.grip/settings.py
credentials-file-location:
  unix: ~/.grip/settings.py
history:
  adoption-history:
    - >
      Grip spread through developer package channels because it had a simple command and
      a familiar problem. Its README documents installation with both `pip install grip`
      and `brew install grip`, and the package also appears in Linux distribution
      metadata.
    - >
      Its adoption niche narrowed as editors, GitHub web previews, and local Markdown
      renderers improved, but the package remained recognizable because it aimed for
      GitHub-compatible rendering rather than generic Markdown preview.
  package-nerd-significance:
    - >
      Grip is a classic small developer-tool package: one executable, a Python web app
      under the hood, and a workflow that made more sense as a CLI than a full desktop
      app.
    - >
      For packagers it is also a reminder that tools built around third-party web APIs
      age with those APIs. The command stays simple, but rendering fidelity and
      authentication behavior depend on GitHub's Markdown service and styles.
  project-history:
    - >
      The official README frames Grip as a command-line server application that uses the
      GitHub Markdown API to render a local README file with GitHub's styling. It was
      designed for README-driven development and for authors who wanted to inspect
      GitHub-flavored Markdown before sending changes upstream.
    - >
      The project later added conveniences that mattered to daily CLI use: browser
      opening, explicit ports and files, exporting rendered HTML, offline rendering
      work, authentication for GitHub API limits, and auto-refresh when files change.
  related-projects:
    - GitHub Markdown API is the rendering service Grip was built around.
    - >
      Python-Markdown is used for the optional offline rendering path described by the
      project.
    - >
      Other Markdown preview tools overlap with Grip, but Grip's package identity is
      GitHub-style local README preview.
  sources:
    - https://github.com/joeyespo/grip
    - https://github.com/joeyespo/grip/blob/master/CHANGES.md
  summary:
    - >
      Grip, short for GitHub Readme Instant Preview, is a Python command-line server for
      previewing Markdown as GitHub renders it. Its history is small but clear: it
      solved the old README loop of commit, push, inspect, and amend by running a local
      preview server.
  timeline:
    - >
      2014: Grip was already serving the GitHub README preview workflow documented by
      early users and package metadata.
    - '2015-11-18: Grip 4.0.0 reworked internals and added file-change refresh behavior.'
    - >
      2015-12-11: Grip 4.1.0 improved authentication prompting and documented
      browser-opening behavior.
    - >
      Later releases: The project documented export, local rendering work, themes, and
      enterprise API URL options in the README.
  usage:
    - >
      The normal workflow is to enter a repository and run `grip`, optionally passing a
      file or port, then open the local server in a browser. Grip can also export a
      rendered README to an HTML file with inline styles and assets.
    - >
      Credentials are optional and only used to raise GitHub API limits or access a
      different GitHub API endpoint. That is why the settings file can be both
      configuration and credential storage.
related-packages:
  - id: brew:glow
    reason: >
      Glow is an offline-oriented terminal Markdown reader and TUI, making it a useful
      alternative when terminal rendering is preferable to Grip's browser server and
      GitHub API fidelity.
    rel: alternative
    sources:
      - https://github.com/joeyespo/grip
      - https://github.com/charmbracelet/glow
category: developer-tools
package-manager:
  apk: grip
  brew: grip
  debian: grip
  dnf: grip
package-manager-url: https://formulae.brew.sh/formula/grip
license: MIT
tags:
  - cli
  - documentation
  - github
  - markdown
  - preview
description: GitHub Markdown previewer
executables:
  - grip
provenance:
  formula: grip
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
