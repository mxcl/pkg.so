id: brew:gnome-papers
display-name: Document Viewer
homepage: https://apps.gnome.org/Papers/
repo: https://gitlab.gnome.org/GNOME/papers
docs:
  - https://help.gnome.org/papers/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Papers' adoption is significant inside GNOME because it represents the document
      viewer moving with the broader platform transition to GTK 4 and libadwaita.
      Distribution packaging under names such as `papers` and `gnome-papers` followed
      that GNOME transition, while package managers kept the command-line helpers for
      previewing and thumbnailing.
  package-nerd-significance:
    - >
      For package nerds, Papers is a useful case study in desktop app succession: a
      GNOME core app keeps compatibility with a long document-viewer history while
      changing toolkit generation, app identity, library names, backends, and package
      naming. That makes it important for downstream transitions from Evince-era
      dependencies.
  project-history:
    - >
      Papers began as a hard fork and rename of Evince during the effort to modernize
      GNOME's core document viewer. Pablo Gomez's GNOME blog post explains that the work
      grew from downstream mobile and sizing patches, GTK 4 porting work, and many merge
      requests around making the viewer adaptive and touch-friendly.
    - >
      The repository preserves extensive Evince history and includes Evince
      news/security files alongside Papers-specific code. Its README describes Papers as
      a document viewer for multiple and single-page formats and points users to GNOME's
      welcome page and Flathub packaging.
  related-projects:
    - >
      Papers is related to Evince, Poppler, DjVuLibre, libarchive comic-book support,
      GTK 4, libadwaita, Nautilus thumbnailing, and GNOME's core application set.
  sources:
    - https://apps.gnome.org/Papers
    - >
      https://blogs.gnome.org/pabloyoyoista/2024/01/26/on-how-to-fork-a-gnome-core-app-without-meaning-to-do-so/
    - https://github.com/GNOME/papers
    - https://gitlab.gnome.org/GNOME/papers
    - https://help.gnome.org/papers/index.html
  summary:
    - >
      Papers is GNOME's document viewer for PDF, DejaVu, TIFF, and comic-book archive
      formats. It continues the GNOME document-viewer lineage associated with Evince
      while moving the application to GTK 4, libadwaita, and a more adaptive interface.
  timeline:
    - >
      2005: Evince enters GNOME as the default document viewer lineage that Papers later
      inherits.
    - '2022: GTK 4 and mobile-oriented work on Evince-related branches accelerates.'
    - '2024-01: Papers is submitted to GNOME Incubation as the renamed Evince fork.'
    - '2025: Papers packages appear broadly under GNOME distribution naming.'
  usage:
    - >
      Practitioners use Papers to read, search, annotate, print, preview, and thumbnail
      documents on GNOME systems. Desktop users mostly launch the graphical app, while
      packagers care about the `papers`, `papers-previewer`, and `papers-thumbnailer`
      executables and the document libraries they expose.
related-packages:
  - id: brew:evince
    reason: >
      Choose Evince for the established GTK 3-era GNOME viewer lineage; choose Papers
      for its GTK 4, libadwaita, adaptive-interface successor.
    rel: alternative
    sources:
      - >
        https://blogs.gnome.org/pabloyoyoista/2024/01/26/on-how-to-fork-a-gnome-core-app-without-meaning-to-do-so/
      - https://gitlab.gnome.org/GNOME/papers/-/tags
      - https://apps.gnome.org/Evince/
  - id: brew:poppler
    reason: >
      Poppler complements Papers by providing the PDF rendering layer underneath
      document viewing and annotation workflows.
    rel: adjacent_workflow
    sources:
      - https://poppler.freedesktop.org/
      - https://planet-gnome-org-c59c6f.pages.gitlab.gnome.org/
category: productivity
