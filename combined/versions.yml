history:
  adoption-history:
    - >
      Versions has remained a commercial, Mac-native Subversion client through several
      ownership changes and major macOS transitions. Its release history documents
      PowerPC retirement, Retina and Notification Center support, successive
      Subversion-library updates, Apple silicon support, and continued maintenance into
      2026.
  package-nerd-significance:
    - >
      Versions represents the polished native-GUI branch of Subversion culture on macOS.
      It is notable for bundling Subversion rather than depending on the system
      installation, integrating credentials with macOS Keychain, and pairing repository
      and working-copy browsers with a revision timeline.
  project-history:
    - >
      Versions began public beta testing in 2008 and reached version 1.0 on November 17,
      2008. The official release history records ownership moving from Sofa to Black
      Pixel, acquisition by Letter Opener GmbH in 2021, and transfer to Leitmotif GmbH
      in 2022 while retaining the development team.
    - >
      Versions 2, released in April 2021, was the application's first major-version
      update. It modernized the interface for contemporary macOS, added Dark Appearance
      and native Apple-silicon support, and incorporated a newer Subversion library.
  related-projects:
    - Apache Subversion is the version-control system embedded and presented by Versions.
    - >
      Kaleidoscope, FileMerge, BBEdit, and other comparison tools can be integrated for
      reviewing changes.
  sources:
    - 'Official product page: https://www.versionsapp.com/'
    - 'Official release notes: https://www.versionsapp.com/releaseNotes'
    - 'Official support page: https://www.versionsapp.com/support'
  summary:
    - >
      Versions is a commercial native macOS client for Apache Subversion. It provides
      repository and working-copy browsers, revision timelines, commit, update,
      checkout, export, revert, locking, property management, and external
      comparison-tool integration.
  timeline:
    - '2008-11-17: Versions 1.0 was released after a public beta.'
    - >
      2011: Official release notes recorded ownership and contact details changing from
      Sofa to Black Pixel.
    - '2021-01-13: Letter Opener GmbH acquired the Versions intellectual property.'
    - >
      2021-04-30: Versions 2.0 delivered the first major-version update and native
      Apple-silicon support.
    - '2022-06-09: Versions became part of Leitmotif GmbH.'
  usage:
    - >
      Users bookmark Subversion repositories or local working copies, inspect revisions
      in the timeline, compare changes, and perform common checkout, update, commit,
      revert, lock, import, and export operations through a Mac interface.
    - >
      The application bundles Subversion and supports HTTP, HTTPS, SVN, SVN-over-SSH,
      and local-file repository URLs. Repository passwords integrate with macOS
      Keychain; the official documentation does not identify a credentials file.
