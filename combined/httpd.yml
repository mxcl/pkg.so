id: brew:httpd
display-name: Apache HTTP Server
homepage: https://httpd.apache.org/
repo: https://svn.apache.org/repos/asf/httpd/httpd/branches/2.4.x
docs:
  - https://httpd.apache.org/docs
  - https://httpd.apache.org/docs/current
config-file-location:
  unix:
    - $HOMEBREW_PREFIX/etc/httpd/httpd.conf
    - $HOMEBREW_PREFIX/etc/httpd/extra/httpd-ssl.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Apache passed NCSA httpd as the top server in the Netcraft Web Server Survey in
      1996, less than a year after the Apache Group formed. Its adoption story is
      closely tied to Unix and Linux packaging: the `httpd` package became both the
      server daemon and a bundle of operational tools used by administrators, module
      developers, and local web developers.
  package-nerd-significance:
    - >
      Package maintainers care about Apache HTTP Server because it sits at the
      intersection of daemon management, module ABI compatibility, TLS libraries,
      configuration layout, and service integration. It is also historically important
      as a package that helped make source-built and distribution-packaged open-source
      infrastructure normal for production web hosting.
  project-history:
    - >
      The project began in February 1995 after development of Rob McCool's NCSA httpd
      had stalled. A small group of webmasters coordinated their accumulated bug fixes
      and enhancements, using NCSA httpd 1.3 as the base for the first public Apache
      server release, 0.6.2, in April 1995.
    - >
      The early server was quickly reworked around Robert Thau's Shambhala architecture,
      which introduced a modular structure, an API for extensibility, pool-based memory
      allocation, and an adaptive preforking process model. Apache 1.0 followed on
      December 1, 1995, and in 1999 the Apache Software Foundation was formed to give
      the project organizational, legal, and financial support.
  related-projects:
    - >
      Apache HTTP Server grew out of NCSA httpd and is closely associated with APR,
      mod_ssl, mod_perl, Tomcat, Traffic Server, and the bundled `ab` benchmarking tool.
  sources:
    - https://httpd.apache.org/ABOUT_APACHE.html
    - https://httpd.apache.org/docs/2.4/programs/ab.html
    - https://svn.apache.org/repos/asf/httpd/httpd/branches/2.4.x/STATUS
  summary:
    - >
      Apache HTTP Server is one of the defining infrastructure packages of the Web: a
      general-purpose HTTP server descended from NCSA httpd, maintained by the Apache
      HTTP Server Project, and distributed with a large suite of command-line
      administration and support tools.
  timeline:
    - '1995: Apache development started around patches to NCSA httpd.'
    - '1995: Apache 0.6.2 was released in April.'
    - '1995: Apache 1.0 was released on December 1.'
    - '1996: Apache passed NCSA httpd in the Netcraft Web Server Survey.'
    - '1999: The Apache Software Foundation was formed.'
    - '2012: The 2.4.x branch began its GA release history with 2.4.1 on February 21.'
  usage:
    - >
      As a package, `httpd` is not only the web server binary. It also ships familiar
      tools such as `apachectl`, `apxs`, `htpasswd`, `htdigest`, `rotatelogs`, and `ab`,
      making the package useful for running a local server, testing configuration,
      building modules, managing password files, rotating logs, and benchmarking request
      throughput.
related-packages:
  - id: brew:nginx
    reason: >
      Choose nginx when an event-driven web server and reverse proxy with a smaller
      configuration model better fits the deployment than Apache's module-oriented
      architecture.
    rel: alternative
    sources:
      - https://httpd.apache.org/
      - https://nginx.org/en/docs/
  - id: brew:caddy
    reason: >
      Choose Caddy when automatic certificate management and a concise Caddyfile are
      more important than Apache's mature module and per-directory configuration
      ecosystem.
    rel: alternative
    sources:
      - https://httpd.apache.org/
      - https://caddyserver.com/docs/
  - id: brew:certbot
    reason: >
      Certbot's Apache integration can obtain certificates and automatically modify
      Apache configuration to enable and renew HTTPS.
    rel: adjacent_workflow
    sources:
      - https://httpd.apache.org/docs/current/ssl/
      - https://certbot.eff.org/instructions?ws=apache&os=pip
category: networking
package-manager:
  brew: httpd
  dnf: httpd
  scoop: main/ab
  zypper: apache2
package-manager-url: https://formulae.brew.sh/formula/httpd
license: Apache-2.0
tags:
  - apache
  - cli
  - http
  - server
  - tls
  - web-server
description: Apache HTTP server
executables:
  - ab
  - apachectl
  - apxs
  - checkgid
  - dbmmanage
  - fcgistarter
  - htcacheclean
  - htdbm
  - htdigest
  - htpasswd
  - httpd
  - httxt2dbm
  - logresolve
  - rotatelogs
  - suexec
provenance:
  formula: httpd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
