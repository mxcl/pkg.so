history:
  adoption-history:
    - >
      Spencer is distributed as a notarized macOS application and as the Homebrew cask
      `spencer`. Its official site positions it for users who regularly move among
      task-specific layouts, Spaces, and display configurations.
  package-nerd-significance:
    - >
      Spencer occupies a distinct niche in the crowded macOS window-management catalog:
      it records and restores freely arranged native windows rather than imposing tiles
      or merely snapping windows to predefined regions.
  project-history:
    - >
      Spencer was created by Kamil Daniel under Pineapple as a commercial macOS
      workspace-layout utility. The official site documents a succession of downloadable
      releases and support for macOS 13 Ventura or later, but does not publish a
      detailed dated project history.
  related-projects:
    - >
      The official comparison distinguishes Spencer from snapping utilities such as
      Rectangle and from virtual-workspace replacements such as FlashSpace and
      AeroSpace. Spencer instead preserves native macOS Spaces and moves already-open
      windows.
  sources:
    - https://macspencer.app/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Spencer is a macOS workspace-layout manager that saves window positions, sizes,
      applications, display arrangements, and Spaces as profiles and restores them
      later.
  timeline:
    - >
      2026: The official site listed Spencer as a notarized macOS application with
      multiple prior releases.
  usage:
    - >
      Users arrange windows and Spaces, save the arrangement as a profile, and restore
      it after switching tasks, reconnecting displays, or restarting. Spencer can launch
      missing applications and hide or minimize applications outside the selected
      profile.
    - >
      It does not restore closed browser tabs, files, or application sessions, and it
      does not act as a window-snapping tool. Stage Manager is not currently supported,
      while fullscreen windows are restored using a simulated fullscreen mode.
related-packages:
  - id: cask:rectangle
    reason: >
      Choose Rectangle when you want open-source keyboard and edge-based window
      snapping; choose Spencer when you need exact layouts restored across native macOS
      Spaces and displays.
    rel: alternative
    sources:
      - https://macspencer.app/
      - https://rectangleapp.com/
      - https://github.com/rxhanson/Rectangle
  - id: cask:flashspace
    reason: >
      FlashSpace replaces native Spaces with fast application-oriented virtual
      workspaces, whereas Spencer preserves native Spaces and restores individual
      open-window positions.
    rel: alternative
    sources:
      - https://macspencer.app/
      - https://github.com/wojciech-kulik/FlashSpace
