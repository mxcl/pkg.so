id: brew:min-lang
display-name: min
homepage: https://min-lang.org
repo: https://github.com/h3rald/min
docs:
  - https://h3rald.com/min/Min_DeveloperGuide.htm
  - https://min-lang.org/
config-file-location:
  unix: ~/.minrc
  windows: '%USERPROFILE%\.minrc'
credentials-file-location: null
history:
  project-history:
    - >
      The language is implemented in Nim. Its parser began as an adaptation of Nim's
      JSON parser, reshaped for a concatenative language with fewer primitive types. The
      language uses postfix notation and a stack model familiar from Forth, Factor, Joy,
      and RPN calculators, while also emphasizing functional style, homoiconicity,
      quotations, dictionaries, and a compact standard library.
  sources:
    - https://github.com/h3rald/min
    - https://h3rald.com/min/Min_DeveloperGuide.htm
    - https://min-lang.org/
    - https://min-lang.org/get-started/
    - https://min-lang.org/mmm/
  summary:
    - >
      min is a small concatenative programming language and shell created and
      implemented by Fabio Cevasco, with named contributors including Peter
      Munch-Ellingsen, Yanis Zafiropulos, and baykus871. The developer guide says the
      source repository was created on November 8, 2014, and that the language was made
      public at the end of July 2017.
  usage:
    - >
      min is used through an interactive shell, inline evaluation, scripts, standard
      input, and a compile command that emits Nim code before invoking the Nim compiler.
      Its ecosystem is intentionally small: syntax support exists for editors, managed
      modules can be installed with the built-in module tooling, and package-manager
      entries mainly serve language hobbyists and developers who want a single-file,
      Nim-embeddable concatenative runtime.
related-packages:
  - id: brew:nim
    reason: >
      Install Nim alongside min when compiling min programs to native executables or
      embedding the min interpreter in a Nim application.
    rel: adjacent_workflow
    sources:
      - https://min-lang.org/get-started/
      - https://h3rald.com/min/Min_DeveloperGuide.htm
      - https://nim-lang.org/documentation.html
category: language-runtime
package-manager:
  brew: min-lang
  nix: min
  scoop: extras/min
  winget: MinBrowser.Min
package-manager-url: https://formulae.brew.sh/formula/min-lang
license: MIT
tags:
  - cli
  - concatenative
  - nim
  - programming-language
  - repl
  - shell
  - stack-based
description: Small but practical concatenative programming language and shell
executables:
  - min
provenance:
  formula: min-lang
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
