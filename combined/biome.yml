id: brew:biome
display-name: Biome
homepage: https://biomejs.dev/
repo: https://github.com/biomejs/biome
docs:
  - https://biomejs.dev/guides/configure-biome
  - https://biomejs.dev/guides/getting-started
  - https://biomejs.dev/reference/configuration
config-file-location:
  linux:
    - biome.json, biome.jsonc, .biome.json,
    - .biome.jsonc in the current working directory
    - parent folders
    - $XDG_CONFIG_HOME/biome
    - ~/.config/biome
  macos:
    - biome.json, biome.jsonc, .biome.json,
    - .biome.jsonc in the current working directory
    - parent folders
    - /Users/$USER/Library/Application Support/biome
  windows:
    - biome.json, biome.jsonc, .biome.json,
    - .biome.jsonc in the current working directory
    - parent folders
    - C:\Users\$USER\AppData\Roaming\biome\config
credentials-file-location: null
history:
  adoption-history:
    - >
      Biome's adoption is visible in several official/project-backed signals: the README
      advertises npm, VS Code Marketplace, Open VSX, Discord, sponsorship, Open
      Collective, and enterprise support surfaces; the GitHub repository has tens of
      thousands of stars; and the input package metadata lists Homebrew, Alpine/apk,
      Nix, Arch/pacman, Scoop, Winget, and openSUSE/zypper.
    - >
      It grew by addressing a common package-manager pain point in web projects:
      replacing formatter, linter, import organization, diagnostics, and editor wiring
      with one fast native binary and one configuration model.
  package-nerd-significance:
    - >
      Biome is package-nerd significant because it is part of the post-Node-script era
      of JavaScript tooling: a single native binary, written in Rust, distributed
      through npm and OS package managers, doing work that historically meant wiring
      together Prettier, ESLint, typescript-eslint, import tools, JSON formatters, and
      editor plugins.
    - >
      It also carries the Rome lineage without requiring users to care about that
      history. For maintainers and package curators, Biome is the rare web tool that
      wants to be both npm-native and distro-friendly: fast executable, clear releases,
      editor extensions, configuration docs, and no requirement that Node.js be present
      for manual installation.
  project-history:
    - >
      Biome's predecessor was Rome, whose GitHub repository was created in 2020 and is
      now archived with the description 'Unified developer tools for JavaScript,
      TypeScript, and the web'. The Biome repository was created in July 2023, and the
      official blog includes an 'Announcing Biome' entry during that transition.
    - >
      Biome shipped its CLI v1.0.0 in August 2023. The official package README describes
      it as the 'Toolchain of the web', with a formatter, linter, CLI, LSP/editor
      integration, WebAssembly playground, and a goal of unifying functions that had
      previously been separate tools.
    - >
      The v2 line arrived in June 2025, followed by frequent 2.x releases. By the v2.5
      blog post in June 2026, the project said Biome had crossed 500 lint rules and
      added features such as plugin code fixes, cross-file linting, watcher mode, and
      new formatter options.
  related-projects:
    - >
      Biome is historically related to Rome and functionally related to Prettier,
      ESLint, typescript-eslint, JSON/CSS/GraphQL formatters, language-server tooling,
      and editor extensions for VS Code, Open VSX-compatible editors, and JetBrains
      IDEs.
    - >
      The project also absorbed GritQL under the Biome organization, using it as a
      plugin language according to the official Biome blog.
  sources:
    - https://biomejs.dev/blog/announcing-biome/
    - https://biomejs.dev/blog/biome-v2-5/
    - https://github.com/biomejs/biome
    - https://github.com/biomejs/biome/releases
    - https://github.com/rome/tools
    - https://raw.githubusercontent.com/biomejs/biome/main/packages/%40biomejs/biome/README.md
    - source_facts.package-manager
  summary:
    - >
      Biome is a fast formatter, linter, CLI, and editor-facing toolchain for web
      projects, descended from the Rome project and positioned as a unified alternative
      to piles of separate JavaScript, TypeScript, JSX, JSON, CSS, and GraphQL tools.
  timeline:
    - '2020: Rome tools repository created.'
    - '2023: biomejs/biome repository created.'
    - '2023: Biome CLI v1.0.0 released.'
    - '2024: Biome v1.5 and v1.6 releases continued the stable CLI line.'
    - '2025: Biome CLI v2.0.0 released.'
    - '2026: Biome v2.5 blog announced more than 500 lint rules.'
  usage:
    - >
      The README documents package usage through `npm install --save-dev --save-exact
      @biomejs/biome`, then commands such as `biome format --write`, `biome lint
      --write`, `biome check --write`, and `biome ci`. It also notes an online
      WebAssembly playground and first-class LSP/editor usage.
    - >
      Biome is commonly used as a project-local development dependency in JavaScript and
      TypeScript repos, but package managers such as Homebrew make the standalone CLI
      convenient for editor integrations, monorepo tooling, and system-level developer
      setups.
related-packages:
  - id: brew:prettier
    reason: >
      Choose Prettier when its broader stable language coverage or community plugin
      ecosystem matters more than Biome's single-binary formatter-and-linter workflow.
    rel: alternative
    sources:
      - https://biomejs.dev/introduction/comparison-with-other-tools/
      - https://prettier.io/docs/
  - id: brew:eslint
    reason: >
      Choose ESLint when a project depends on its mature JavaScript plugin ecosystem or
      type-aware rules that Biome does not provide.
    rel: alternative
    sources:
      - https://biomejs.dev/introduction/comparison-with-other-tools/
      - https://eslint.org/docs/latest/
category: developer-tools
package-manager:
  apk: biome
  brew: biome
  nix: biome
  pacman: biome
  scoop: main/biome
  winget: BiomeJS.Biome
  zypper: biome
package-manager-url: https://formulae.brew.sh/formula/biome
license: Apache-2.0 OR MIT
tags:
  - cli
  - formatter
  - linter
  - web
description: Toolchain of the web
executables:
  - biome
provenance:
  formula: biome
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
