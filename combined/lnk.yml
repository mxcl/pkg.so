id: brew:lnk
display-name: lnk
homepage: https://github.com/yarlson/lnk
repo: https://github.com/yarlson/lnk
docs:
  - https://github.com/yarlson/lnk#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official adoption evidence is still thin because lnk is young and primarily
      distributed through its GitHub repository, GitHub releases, Go install, an install
      script, and Homebrew. The repository metadata shows several hundred stars by
      mid-2026, suggesting interest among users who want a simpler alternative to larger
      dotfile frameworks.
  package-nerd-significance:
    - >
      lnk is package-nerd relevant as a deliberately minimal entrant in the crowded
      dotfiles-manager category. It packages a common shell-script pattern into one
      Homebrew-installable binary while staying close to Git and POSIX symlinks.
  project-history:
    - >
      The yarlson/lnk GitHub repository was created in May 2025. The project presents
      itself as a git-native dotfiles manager with no templates and no separate config
      file, using a default repository location under ~/.config/lnk unless overridden by
      LNK_HOME or XDG_CONFIG_HOME.
  related-projects:
    - Git, GNU Stow, chezmoi, and yadm occupy related dotfiles-management territory.
    - >
      lnk distinguishes itself by using a plain Git repository and symlink restoration
      rather than a template-heavy configuration system.
  sources:
    - https://api.github.com/repos/yarlson/lnk
    - https://github.com/yarlson/lnk
    - source_facts.package-manager
  summary:
    - >
      lnk is a small Go-based dotfiles manager built around Git and symbolic links. Its
      README describes it as intentionally low-ceremony: it moves files into a Git repo,
      symlinks them back, and tracks managed paths in plain text.
  timeline:
    - '2025: The yarlson/lnk repository is created.'
    - '2025: README documents Homebrew, release binaries, and go install as installation paths.'
    - >
      2026: Repository metadata shows continued activity and package-manager
      availability through Homebrew.
  usage:
    - >
      The README's core workflow is init, pull, add, status, diff, push, and
      host-specific adds. Users keep a Git repository of dotfiles, while lnk restores
      files to their original paths as symlinks and can keep host-specific files under
      hostname-based subdirectories.
related-packages:
  - id: brew:chezmoi
    reason: >
      Choose chezmoi when dotfiles need templates, scripts, secret-manager integration,
      and substantial per-machine variation; choose lnk for a smaller Git-and-symlink
      workflow without a separate configuration language.
    rel: alternative
    sources:
      - https://github.com/yarlson/lnk
      - https://www.chezmoi.io/what-does-chezmoi-do/
  - id: brew:yadm
    reason: >
      Choose yadm for a Git-like dotfiles repository with alternates, bootstrapping, and
      encryption; choose lnk when explicit add, pull, doctor, and host-specific symlink
      operations are preferable.
    rel: alternative
    sources:
      - https://github.com/yarlson/lnk
      - https://yadm.io/
  - id: brew:stow
    reason: >
      Choose GNU Stow for general-purpose symlink-farm management organized as packages;
      choose lnk when Git synchronization and dotfile-specific host handling should be
      built into the command.
    rel: alternative
    sources:
      - https://github.com/yarlson/lnk
      - https://www.gnu.org/software/stow/manual/stow.html
category: developer-tools
package-manager:
  brew: lnk
package-manager-url: https://formulae.brew.sh/formula/lnk
license: MIT
tags:
  - cli
  - configuration-management
  - dotfiles
  - git
  - symlinks
description: Git-native dotfiles management that doesn't suck
executables:
  - lnk
provenance:
  formula: lnk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
