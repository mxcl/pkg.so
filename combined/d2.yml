id: brew:d2
display-name: D2
homepage: https://d2lang.com/
repo: https://github.com/d2lang/d2
docs:
  - https://d2lang.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      D2 entered the diagram-as-code ecosystem as another text-to-diagram option
      alongside tools such as Graphviz and Mermaid. Its README emphasizes
      package-manager installation, editor/tooling support, and a list of open-source
      projects that document with D2.
  package-nerd-significance:
    - >
      D2 is package-manager friendly because it ships as a single CLI for docs
      pipelines: install it with a system package manager, keep diagrams as source text,
      and regenerate images in builds or documentation sites.
  project-history:
    - >
      The D2 repository was created in 2022 by Terrastruct. The README presents D2 as a
      language, command-line renderer, and Go library, with official documentation, a
      playground, themes, language tooling, plugins, and export formats.
  related-projects:
    - >
      D2 relates to diagram-as-code tools, Graphviz-style layout engines, ELK, TALA, Go
      documentation pipelines, and editor plugins.
  sources:
    - https://github.com/terrastruct/d2
    - https://api.github.com/repos/terrastruct/d2
    - https://github.com/terrastruct/d2/releases/tag/v0.7.1
    - https://d2lang.com/
  summary:
    - >
      D2 is a modern diagram scripting language and CLI that turns text files into
      diagrams, especially for software architecture and documentation workflows.
  timeline:
    - '2022: D2 repository created.'
    - '2022: Early v0.1.x tags published.'
    - '2025: v0.7.1 release published.'
  usage:
    - >
      The usual workflow is to write a .d2 file and run the d2 CLI to produce SVG, PNG,
      or PDF output. D2 can also be used as a Go library and can swap layout engines
      such as ELK or TALA.
related-packages:
  - id: brew:graphviz
    reason: >
      Choose Graphviz for its mature DOT language and broad family of general
      graph-layout engines; choose D2 when software-documentation ergonomics, watch
      mode, and standalone multi-format exports matter more.
    rel: alternative
    sources:
      - https://d2lang.com/tour/design/
      - https://d2lang.com/tour/faq/
      - https://graphviz.org/documentation/
  - id: brew:mermaid-cli
    reason: >
      Choose mermaid-cli when existing Markdown or web documentation already uses
      Mermaid syntax; D2 is a separate language whose CLI can render PNG without
      Mermaid's headless-browser workflow.
    rel: alternative
    sources:
      - https://d2lang.com/tour/faq/
      - https://d2lang.com/tour/exports/
      - https://mermaid.js.org/config/mermaidCLI
category: developer-tools
package-manager:
  brew: d2
  dnf: d2
  macports: d2
  nix: d2
  pacman: d2
  scoop: main/d2
  winget: Terrastruct.D2
  zypper: d2
package-manager-url: https://formulae.brew.sh/formula/d2
license: MPL-2.0
tags:
  - cli
  - diagram-as-code
  - diagrams
  - scripting-language
  - visualization
description: Modern diagram scripting language that turns text to diagrams
executables:
  - d2
provenance:
  formula: d2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
