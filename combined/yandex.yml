config-file-location:
  macos: ~/Library/Application Support/Yandex/YandexBrowser/
  windows: C:\Users\[username]\AppData\Local\Yandex\YandexBrowser\User Data
credentials-file-location: null
history:
  adoption-history:
    - >
      Yandex initially released the browser in Russia, followed by localized versions
      for Ukraine, Kazakhstan, Belarus, and Turkey. It became a primary desktop entry
      point for Yandex services, account synchronization, translation, search, and
      security features.
    - >
      The browser supports importing data from other major browsers and synchronizing
      bookmarks, passwords, tabs, history, extensions, and settings through Yandex ID,
      reducing migration friction for users already in the Yandex ecosystem.
  package-nerd-significance:
    - >
      Yandex Browser is a major regional Chromium-derived browser distributed outside
      the dominant Chrome, Edge, and Firefox channels. Package users care about it both
      as an alternative browser engine distribution and as an integrated client for
      Yandex's service ecosystem.
    - >
      Its local profile is operationally important: bookmarks, passwords, history,
      extensions, cookies, and many settings live together under the YandexBrowser
      user-data directory, while optional synchronization links those data to a Yandex
      ID.
  project-history:
    - >
      Yandex announced its browser on October 1, 2012, presenting it as a cloud-oriented
      browser that combined Yandex search, navigation, security, and service
      integration.
    - >
      The product evolved into a cross-device browser with account-backed profiles,
      synchronization, a password manager, translation, extension support, ad filtering,
      privacy controls, and Yandex-specific features such as Tableau and Alice
      integration.
  related-projects:
    - Yandex ID provides account authentication and cross-device data synchronization.
    - >
      The browser integrates with Yandex services such as Search, Market, Music, and
      Alice, while supporting browser extensions and data import from Chrome, Firefox,
      Opera, Edge, and Internet Explorer.
  sources:
    - 'Official 2012 launch announcement: https://yandex.com/company/news/2012-2012-10-01'
    - 'Official browser help center: https://browser.yandex.com/help/en'
    - 'Official company history: https://www.yandex.com/company/history'
    - >
      Official profile and synchronization documentation:
      https://browser.yandex.com/help/en/personalization/profile
  summary:
    - >
      Yandex Browser is Yandex's desktop and mobile web browser, launched in 2012. It
      combines general web browsing with Yandex search and services, synchronized
      profiles, translation, password management, security protections, extensions, and
      interface features tailored to Yandex users.
  timeline:
    - '2012: Yandex Browser launched in Russia on October 1.'
    - '2012: Localized releases followed for Ukraine, Kazakhstan, Belarus, and Turkey.'
    - >
      Later development: Yandex added cross-device profile synchronization, an encrypted
      password vault, translation, extension support, and broader privacy and security
      controls.
  usage:
    - >
      Users browse the web, install extensions, organize bookmarks and tab groups,
      translate content, manage passwords and payment data, and optionally synchronize
      their profile through Yandex ID.
    - >
      For backup or migration, Yandex documents copying the complete User Data profile
      directory. Passwords can also be exported separately to an encrypted archive or an
      unencrypted CSV file.
