id: brew:bagels
display-name: Bagels
homepage: https://github.com/EnhancedJax/Bagels
repo: https://github.com/EnhancedJax/Bagels
docs:
  - https://github.com/EnhancedJax/Bagels#readme
config-file-location:
  unix: $XDG_CONFIG_HOME/bagels/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Bagels moved quickly from a GitHub project to packaged CLI: the README lists uv as
      the recommended installer, plus Homebrew, pipx, conda-forge, and X-CMD options.
      The batch metadata also shows Homebrew and Nix packaging.
    - >
      By June 2026, GitHub metadata showed thousands of stars, unusually high for a
      young personal-finance TUI. That suggests broader interest in terminal-native
      productivity apps, even though its formal release history only starts in late
      2024.
  package-nerd-significance:
    - >
      Bagels matters to package nerds because it shows a modern Python app being
      packaged as a real end-user terminal application, not just a library. uv, pipx,
      Homebrew, conda-forge, and Nix all serve different installer cultures for the same
      TUI.
    - >
      It is also a good example of terminal UI packaging pressures: users expect a
      single executable, local data, discoverable config paths, and a modern terminal,
      while maintainers still manage Python versions and application dependencies.
  project-history:
    - >
      The EnhancedJax/Bagels GitHub repository was created in November 2024. Its README
      describes Bagels as a TUI application for tracking and analyzing money flow with
      accounts, categories, splits, transfers, records, recurring transaction templates,
      insights, filters, graphs, budgets, and customizable keybindings.
    - >
      The README explains the motivation as habit-building: the author found it easier
      to track expenses at the end of the day in a fast local terminal workflow. It also
      states that Bagels is built with Textual and was heavily inspired by posting.
  related-projects:
    - Bagels is built with Textual and the README says it was heavily inspired by posting.
    - >
      It is adjacent to terminal productivity and personal-finance tools, especially
      local-first expense trackers and budget managers.
  sources:
    - https://github.com/EnhancedJax/Bagels
    - https://github.com/EnhancedJax/Bagels/releases
    - https://pypi.org/project/bagels/
    - https://textual.textualize.io/
    - source_facts.package-manager
  summary:
    - >
      Bagels is a terminal user interface expense tracker built for local personal
      finance workflows. It is a newer example of the Textual-era Python TUI wave:
      polished terminal software distributed through Python packaging, Homebrew, and
      Nix.
  timeline:
    - '2024-11: GitHub repository created and early 0.1.x releases published.'
    - '2025-04: 0.3.8 released during active feature iteration.'
    - '2025-07: 0.3.12 released.'
    - '2026: Batch package metadata shows Homebrew and Nix availability.'
  usage:
    - >
      The normal command is bagels to start the TUI. The README also documents bagels
      --at to choose a storage location and bagels locate database or bagels locate
      config to find local files.
    - >
      Bagels is used for local tracking rather than bank-synced accounting. Its roadmap
      explicitly lists bank sync as backlog, while existing features emphasize manual
      records, templates, budgets, and insights.
related-packages: []
category: productivity
package-manager:
  brew: bagels
  nix: bagels
package-manager-url: https://formulae.brew.sh/formula/bagels
license: GPL-3.0-or-later
tags:
  - cli
  - expense-tracker
  - finance
  - terminal
  - tui
description: Powerful expense tracker that lives in your terminal
executables:
  - bagels
provenance:
  formula: bagels
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
