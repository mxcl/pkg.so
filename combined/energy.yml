id: brew:energy
display-name: ENERGY
homepage: https://energye.github.io
repo: https://github.com/energye/energy
docs:
  - https://energye.github.io/course/getting-started
  - https://energye.github.io/document
config-file-location:
  unix: PROJECT_ROOT/config/energy_[os].json
  windows: PROJECT_ROOT/config/energy_[os].json
credentials-file-location: null
history:
  adoption-history:
    - >
      Energy is distributed through Homebrew as the `energy` executable and is
      documented through the project site, GitHub README, Go package documentation, and
      related GitHub repositories. The README also links to a Discord community and
      related Energy modules, indicating a small but organized ecosystem around the
      framework.
  package-nerd-significance:
    - >
      Energy is interesting to package maintainers because it packages a desktop app
      framework rather than a single end-user utility. Its value depends on coordinating
      Go modules, native GUI/runtime dependencies, and cross-platform browser back ends.
  project-history:
    - >
      The public GitHub project was created in 2022 and presents Energy 3.0 as a Go
      desktop framework using LCL, CEF, and system webview runtimes. Its README places
      the CLI in a broader toolchain that includes Energy Designer, examples, and
      related runtime modules.
    - >
      The project positions itself between native GUI tooling and Go plus web hybrid
      applications: LCL provides native controls, while WebView and CEF modes allow
      HTML, CSS, and JavaScript front ends to communicate with Go back ends.
  related-projects:
    - >
      Related official projects include Energy Designer, energye/lcl, energye/wv,
      energye/cef, CEF, CEF4Delphi, and WebView4Delphi.
  sources:
    - https://github.com/energye/energy
    - https://raw.githubusercontent.com/energye/energy/main/README.md
    - https://energye.github.io/course/getting-started
    - https://formulae.brew.sh/formula/energy
  summary:
    - >
      Energy is a Go framework and command-line entry point for building cross-platform
      desktop applications around LCL native controls and browser runtimes such as CEF,
      WebView2, WebKitGTK, and WKWebView.
  timeline:
    - '2022: Public GitHub repository created.'
    - >
      2020s: Project documentation describes Energy 3.0 with LCL, CEF, WebView2,
      WebKitGTK, and WKWebView support.
  usage:
    - >
      Package-manager users install the CLI to initialize or work with the Energy
      development environment, then create projects that use LCL native controls, system
      webviews, or CEF-backed windows. The official quick-start examples show Go
      programs creating desktop windows, controls, and webview-backed applications.
related-packages:
  - id: brew:wails
    reason: >
      Choose Wails when you want a Go backend with a modern web frontend rendered by the
      operating system's webview, built-in frontend templates, and generated
      Go-to-JavaScript bindings instead of ENERGY's LCL and optional embedded-CEF stack.
    rel: alternative
    sources:
      - https://energye.github.io/
      - https://wails.io/docs/introduction/
category: developer-tools
package-manager:
  brew: energy
package-manager-url: https://formulae.brew.sh/formula/energy
license: Apache-2.0
tags:
  - cef
  - cli
  - cross-platform
  - desktop-apps
  - go
  - lcl
description: CLI is used to initialize the Energy development environment tools
executables:
  - energy
provenance:
  formula: energy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
