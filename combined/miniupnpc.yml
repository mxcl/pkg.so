id: brew:miniupnpc
display-name: miniupnpc
homepage: http://miniupnp.free.fr/
repo: https://github.com/miniupnp/miniupnp
docs:
  - https://miniupnp.tuxfamily.org/doc
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project grew around practical NAT traversal. MiniUPnPd first targeted OpenBSD
      with pf, later gained portability across BSDs, Solaris, macOS, and Linux firewall
      stacks, while MiniUPnPc remained the portable client component for POSIX, Windows,
      and AmigaOS. NAT-PMP and PCP support were added on the daemon side, while
      libnatpmp handles client-side NAT-PMP. The GitHub repository groups miniupnpc,
      miniupnpd, minissdpd, and experimental async/libevent clients together, reflecting
      a small suite rather than a single binary.
  sources:
    - https://formulae.brew.sh/formula/miniupnpc
    - https://github.com/miniupnp/miniupnp
    - https://miniupnp.tuxfamily.org/
    - https://miniupnp.tuxfamily.org/doc/
  summary:
    - >
      miniupnpc is the client-library side of Thomas Bernard's MiniUPnP project, a
      compact C implementation for UPnP Internet Gateway Device control. The MiniUPnP
      homepage explains that the project was created to provide a free-software
      implementation of the IGD part of UPnP, with MiniUPnPc acting as the control point
      library and MiniUPnPd acting as the gateway daemon. Its design goal was smallness:
      the author explicitly contrasted it with heavier UPnP SDKs and emphasized ANSI C,
      a tiny footprint, and no dependency on external XML parsers or HTTP
      implementations.
  usage:
    - >
      In practice miniupnpc is embedded by applications that need incoming connections
      through consumer NAT routers: peer-to-peer clients, active-mode FTP clients, IRC
      DCC, games, and server-like desktop software. The MiniUPnP site cites Transmission
      as a BitTorrent client using miniupnpc and libnatpmp, and notes XChat patch work
      as an example of application integration. In package managers it appears both as
      command-line tools such as upnpc and as development libraries such as Debian and
      Ubuntu's libminiupnpc-dev, which is why the Homebrew formula describes it as a
      UPnP IGD client library and daemon.
related-packages:
  - id: brew:libnatpmp
    reason: >
      Choose libnatpmp when the gateway exposes NAT-PMP rather than UPnP IGD; both are
      small MiniUPnP-family client libraries used by applications such as Transmission
      to request inbound NAT mappings.
    rel: alternative
    sources:
      - https://github.com/miniupnp/miniupnp#readme
      - https://miniupnp.tuxfamily.org/libnatpmp.html
      - https://github.com/miniupnp/libnatpmp#readme
