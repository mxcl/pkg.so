id: brew:koji
display-name: koji
homepage: https://github.com/cococonscious/koji
repo: https://github.com/cococonscious/koji
docs:
  - https://github.com/cococonscious/koji#readme
config-file-location:
  unix:
    - ./.koji.toml
    - $XDG_CONFIG_HOME/koji/config.toml
    - ~/.config/koji/config.toml
  windows: '%USERPROFILE%\AppData\Roaming\koji\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      koji is aimed at developers and teams that want Conventional Commits without
      composing the structured message manually. Its upstream installation instructions
      cover Cargo and several community-maintained package channels.
    - >
      The ability to run as a prepare-commit-msg hook allows teams to incorporate its
      prompts into an existing Git workflow while still accepting already-conforming
      commit messages.
  package-nerd-significance:
    - >
      koji is representative of the Rust CLI ecosystem's polished, single-purpose
      developer tools. It connects an interactive terminal interface with commit
      conventions used by automated versioning and changelog systems.
  project-history:
    - >
      koji was developed as an interactive Conventional Commits client built on
      cocogitto and inspired by cz-cli. It expanded beyond basic prompting with emoji,
      scope completion, custom commit types, Git-hook operation, shell completions, and
      configurable scope detection.
  related-projects:
    - >
      Upstream identifies cocogitto and cz-cli as direct relatives. Conventional
      Commits, Git hooks, release automation, changelog generators, Husky, and
      pre-commit-style hook runners form its surrounding ecosystem.
  sources:
    - https://github.com/cococonscious/koji
    - https://github.com/cococonscious/koji/releases
  summary:
    - >
      koji is a Rust-based interactive CLI that creates Conventional Commit messages and
      can replace git commit or run from a Git commit-message hook.
  timeline:
    - >
      Initial project: koji established an interactive Conventional Commits workflow
      inspired by cz-cli and built around cocogitto.
    - >
      Later development: Configuration, Git-hook integration, shell completion, custom
      commit types, and automated scope selection broadened the workflow.
  usage:
    - >
      After staging changes, users run koji in place of git commit and answer prompts
      for commit type, scope, summary, breaking changes, and issues. It can
      alternatively run from prepare-commit-msg and can read project-local or per-user
      TOML configuration.
related-packages:
  - id: brew:cocogitto
    reason: >
      Use Cocogitto alongside koji to validate the Conventional Commits that koji
      creates and automate version bumps and changelog generation from that history.
    rel: adjacent_workflow
    sources:
      - https://github.com/cococonscious/koji
      - https://github.com/cocogitto/cocogitto
category: developer-tools
package-manager:
  brew: koji
  dnf: koji
  nix: koji
package-manager-url: https://formulae.brew.sh/formula/koji
license: MIT
tags:
  - cli
  - commit-message
  - conventional-commits
  - developer-tools
  - git
  - rust
description: Interactive CLI for creating conventional commits
executables:
  - koji
provenance:
  formula: koji
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
