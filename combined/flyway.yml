id: brew:flyway
display-name: Redgate Flyway
homepage: https://www.red-gate.com/products/flyway/community/
repo: https://github.com/flyway/flyway
docs:
  - https://documentation.red-gate.com/flyway
config-file-location:
  unix:
    - ./flyway.toml
    - ./flyway.conf
    - ~/flyway.conf
    - <flyway-install-dir>/conf/flyway.conf
credentials-file-location:
  unix: ~/flyway.conf
history:
  adoption-history:
    - >
      Flyway's adoption is tied to the rise of database DevOps: its own documentation
      says it extends DevOps to databases, automates database deployments, and is
      commonly used from the command line in CI/CD systems. The README lists support for
      50-plus DBMS products and many community or third-party integrations, including
      Spring Boot, SBT, Ant, Grails, Play, DropWizard, Grunt, Griffon, and Ninja.
  package-nerd-significance:
    - >
      Flyway matters to package ecosystems because it is both a standalone CLI and a
      Java library/plugin stack. It bridges application release tooling and mutable
      database state, so packaging has to serve local developer installs, CI runners,
      containers, build plugins, and enterprise editions without confusing the
      open-source command-line engine with Redgate's commercial surfaces.
  project-history:
    - >
      The open-source repository identifies Flyway as a Redgate project and carries
      copyright from 2010 through 2026. The README emphasizes a simple, focused
      migration model and lists support across Windows, macOS, Linux, Docker, Java,
      Maven, and Gradle.
    - >
      Redgate documentation presents Flyway as part of a wider product family that
      includes Flyway Command Line, Flyway Desktop, APIs, build-tool integrations, and
      Redgate editions. The GitHub README also notes that Flyway is a registered
      trademark of Boxfuse GmbH owned by Red Gate Software Ltd.
  related-projects:
    - >
      Related official surfaces include Flyway Desktop, Flyway Command Line, Flyway Java
      API, the Maven and Gradle plugins, flyway-community-db-support, and Redgate's
      commercial Flyway editions.
  sources:
    - https://api.github.com/repos/flyway/flyway/releases?per_page=100
    - https://documentation.red-gate.com/fd/release-notes-for-flyway-engine-179732572.html
    - https://documentation.red-gate.com/flyway
    - https://documentation.red-gate.com/flyway/getting-started-with-flyway
    - https://github.com/flyway/flyway
    - https://raw.githubusercontent.com/flyway/flyway/main/README.md
  summary:
    - >
      Redgate Flyway is a database migration and schema versioning tool for
      command-line, API, Maven, Gradle, Docker, and desktop workflows. It applies
      versioned migrations, records them in a schema history table, and is used to bring
      database change management into application-style CI/CD pipelines.
  timeline:
    - "2010: The Flyway open-source repository's copyright period begins."
    - '2021: Redgate Flyway documentation was published in its current documentation space.'
    - >
      2022: Redgate published the Flyway Engine release-notes page in the current
      documentation system.
    - '2024: The GitHub release stream included Flyway 10.x releases.'
    - '2026: Redgate documentation listed Flyway 12.10.0 as a current engine release.'
  usage:
    - >
      The standard workflow is to create ordered SQL, Java, or scripting migrations, run
      Flyway against a database, and let it create or update the `flyway_schema_history`
      table as migrations are applied. It can be used directly through the CLI, embedded
      through the Java API, or driven through Maven and Gradle.
related-packages:
  - id: brew:liquibase
    reason: >
      Choose Liquibase when you want database changesets expressed in SQL, XML, YAML, or
      JSON with explicit rollback workflows; choose Flyway for its migration-file
      conventions and focused schema-history model.
    rel: alternative
    sources:
      - https://documentation.red-gate.com/flyway/getting-started-with-flyway
      - https://docs.liquibase.com/
category: developer-tools
package-manager:
  brew: flyway
  macports: flyway
  nix: flyway
  scoop: main/flyway
package-manager-url: https://formulae.brew.sh/formula/flyway
license: Apache-2.0
tags:
  - ci-cd
  - cli
  - database-migrations
  - devops
  - schema-versioning
  - sql
description: Database version control to control migrations
executables:
  - flyway
provenance:
  formula: flyway
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
