id: brew:bore-cli
display-name: bore
homepage: https://github.com/ekzhang/bore
repo: https://github.com/ekzhang/bore
docs:
  - https://github.com/ekzhang/bore
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bore spread through Rust/Cargo first and then OS packages. Its README documents
      `cargo install bore-cli`, Homebrew core packaging on macOS, AUR packaging, Gentoo
      overlay packaging, binary releases for macOS, Windows, and Linux, and Docker
      images, while the input package metadata also shows Alpine, MacPorts, Nix, and
      pacman availability.
  package-nerd-significance:
    - >
      bore matters to package nerds because it is a small Rust network utility whose
      package name diverges from its binary: Cargo and Homebrew use `bore-cli`, while
      the command is `bore`. It also demonstrates the post-ngrok packaging pattern of
      self-hostable tunnel tools that are simple enough to audit and ship as static
      binaries.
  project-history:
    - >
      The README describes bore as a simple Rust tunnel that bypasses NAT firewalls by
      connecting a local client to a remote server and assigning a public port. It
      emphasizes a no-frills design: one binary can run either the client or server, and
      the protocol uses a control port plus per-connection UUID handoff.
    - >
      The official GitHub releases show rapid early releases in April 2022, beginning
      with v0.2.0, then v0.3.0 and v0.4.0 later the same month. Later releases include
      v0.5.0 in April 2023 and v0.6.0 in June 2025.
  related-projects:
    - >
      The README explicitly compares bore with localtunnel and ngrok. It is also
      adjacent to other self-hostable TCP/HTTP tunnel tools and to Tokio-based Rust
      network services.
  sources:
    - https://github.com/ekzhang/bore#readme
    - https://github.com/ekzhang/bore/releases/tag/v0.2.0
    - https://github.com/ekzhang/bore/releases/tag/v0.6.0
    - source_facts.package-manager
  summary:
    - >
      bore is a Rust TCP-tunnel CLI for exposing a local port through a remote server.
      Its historical identity is intentionally small: a modern, self-hostable
      alternative in the localtunnel/ngrok family that forwards TCP traffic and avoids
      becoming a full remote-access platform.
  timeline:
    - '2022: v0.2.0 published on GitHub.'
    - '2022: v0.3.0, v0.4.0, and v0.4.1 follow in the first release year.'
    - '2023: v0.5.0 published.'
    - '2025: v0.6.0 published.'
  usage:
    - >
      The core workflow is `bore local 8000 --to bore.pub`, which exposes a local
      service through the public bore server on an assigned port. Operators can
      self-host with `bore server`, constrain port ranges, bind control and tunnel
      addresses separately, and optionally require a shared secret for the handshake.
related-packages:
  - id: brew:rathole
    reason: >
      Choose rathole for persistent, declarative client/server reverse-tunnel mappings
      and configurable transports; choose bore for an especially small ad hoc TCP tunnel
      with one client/server binary.
    rel: alternative
    sources:
      - https://github.com/ekzhang/bore#readme
      - https://github.com/rathole-org/rathole#readme
  - id: brew:localtunnel
    reason: >
      Choose localtunnel when the task is sharing a local HTTP service through a public
      URL; choose bore for protocol-agnostic TCP forwarding and a minimal self-hosted
      server.
    rel: alternative
    sources:
      - https://github.com/ekzhang/bore#readme
      - https://github.com/localtunnel/localtunnel#readme
category: networking
package-manager:
  apk: bore
  brew: bore-cli
  macports: bore-cli
  nix: bore-cli
  pacman: bore
package-manager-url: https://formulae.brew.sh/formula/bore-cli
license: MIT
tags:
  - cli
  - networking
  - port-forwarding
  - rust
  - self-hosted
  - tcp-tunnel
description: Modern, simple TCP tunnel in Rust that exposes local ports to a remote server
executables:
  - bore
provenance:
  formula: bore-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
