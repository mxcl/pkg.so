id: brew:grpcui
display-name: grpcui
homepage: https://github.com/fullstorydev/grpcui
repo: https://github.com/fullstorydev/grpcui
docs:
  - https://github.com/fullstorydev/grpcui#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      grpcui adoption tracks the growth of gRPC APIs that are inconvenient to test with
      ordinary HTTP tools. It gives teams a Postman-like workflow for gRPC without
      needing each developer to write a custom client.
    - >
      Because it is packaged as a single CLI that launches a local web UI, it fits
      neatly into Homebrew and similar developer-tool package managers. The package is
      mostly a debugging and exploration tool, not an application runtime.
  package-nerd-significance:
    - >
      grpcui is package-nerd useful because it turns a binary RPC protocol into an
      inspectable local web tool without requiring a whole desktop API client suite.
    - >
      It also shows a common modern CLI pattern: install a small Go binary from a
      package manager, then use it to launch a local browser UI for an otherwise
      hard-to-inspect protocol.
  project-history:
    - >
      The official GitHub repository was created in 2018, and its first listed GitHub
      release was v0.1.0 in January 2019. The README describes grpcui as a browser-based
      tool for gRPC APIs and explicitly positions it as an extension of grpcurl.
    - >
      grpcui builds on the same general gRPC reflection and descriptor-file model as
      grpcurl: it can query server reflection, read proto source files, or load compiled
      protoset files to discover schemas and render forms.
  related-projects:
    - grpcurl is the companion CLI and conceptual base for grpcui.
    - gRPC server reflection enables grpcui to discover schemas from a running server.
    - >
      Protocol Buffers and protoset descriptor files provide the schema data grpcui uses
      to build forms.
  sources:
    - https://github.com/fullstorydev/grpcui
    - https://github.com/fullstorydev/grpcui/releases
    - https://raw.githubusercontent.com/fullstorydev/grpcui/master/README.md
    - https://www.fullstory.com/blog/grpcui-dont-grpc-without-it/
  summary:
    - >
      grpcui is a command-line tool that opens a browser-based UI for exploring and
      invoking gRPC services. It is best understood as the graphical sibling of grpcurl:
      grpcurl is the CLI, grpcui is the interactive web form.
  timeline:
    - '2018: The grpcui GitHub repository was created.'
    - '2019: v0.1.0 was published on GitHub releases.'
    - >
      2019: FullStory described grpcui as a way to explore running gRPC interfaces
      alongside grpcurl.
    - '2020s: The README documents Homebrew installation and Go installation workflows.'
  usage:
    - >
      Users run `grpcui` with connection flags for a gRPC server. The tool prints a
      local URL, starts an HTTP server, and renders service and method selectors plus
      forms for request messages.
    - >
      It supports plaintext and TLS servers, mutual TLS, request metadata, JSON request
      entry, response headers and trailers, and descriptor discovery through reflection,
      proto files, or protosets.
related-packages:
  - id: brew:grpcurl
    reason: >
      grpcurl is the command-line counterpart to grpcui and is better suited to scripts,
      terminal workflows, and interactive bidirectional streams.
    rel: alternative
    sources:
      - https://github.com/fullstorydev/grpcui
      - https://github.com/fullstorydev/grpcurl
  - id: brew:grpc
    reason: >
      grpcui is designed to explore and invoke services implemented with gRPC, using
      server reflection or service descriptors to understand their APIs.
    rel: adjacent_workflow
    sources:
      - https://github.com/fullstorydev/grpcui
      - https://grpc.io/docs/guides/reflection/
  - id: brew:protobuf
    reason: >
      grpcui can read `.proto` sources and compiled descriptor sets produced by `protoc`
      when a server does not expose reflection.
    rel: adjacent_workflow
    sources:
      - https://github.com/fullstorydev/grpcui
      - https://protobuf.dev/overview/
category: developer-tools
package-manager:
  apk: grpcui
  brew: grpcui
  nix: grpcui
package-manager-url: https://formulae.brew.sh/formula/grpcui
license: MIT
tags:
  - api-client
  - cli
  - developer-tool
  - go
  - grpc
  - web-ui
description: Interactive web UI for gRPC, along the lines of postman
executables:
  - grpcui
provenance:
  formula: grpcui
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
