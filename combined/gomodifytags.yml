id: brew:gomodifytags
display-name: gomodifytags
homepage: https://github.com/fatih/gomodifytags
repo: https://github.com/fatih/gomodifytags
docs:
  - https://github.com/fatih/gomodifytags#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub release pages show a 1.x release series, including v1.17.0 in July 2024.
      Homebrew and Nix package metadata in the batch input show the tool being
      distributed outside go install, which is useful for editor plugin dependencies and
      reproducible workstation setup.
    - >
      The GitHub repository metadata showed thousands of stars by June 2026, consistent
      with a mature, editor-adjacent Go utility rather than a large standalone
      application.
  package-nerd-significance:
    - >
      gomodifytags is package-nerd catnip because it turns a language convention, Go
      struct tags, into a stable external executable that editors can share. That keeps
      editor plugins thin and lets package managers ship one implementation of the
      tag-rewriting logic.
  project-history:
    - >
      The repository was created in January 2017 by Fatih Arslan. The README describes a
      focused command that modifies tags in Go structs by file, struct, field, line,
      offset, or all structs, with dry-run output by default and a write flag for
      in-place edits.
    - >
      The tool was designed for editor integration as much as terminal use. The README
      lists vim-go, Atom go-plus, vscode-go, Acme integration, emacs-go-tag, and
      TextMate2 support, which explains why a small CLI became widely known in the Go
      editing ecosystem.
  related-projects:
    - >
      vim-go, vscode-go, go-plus, emacs-go-tag, Acme tooling, and TextMate2 integrations
      are listed by the README as supported editor surfaces.
    - Go's reflect.StructTag convention is the language feature gomodifytags edits around.
  sources:
    - https://api.github.com/repos/fatih/gomodifytags
    - https://formulae.brew.sh/formula/gomodifytags
    - https://github.com/fatih/gomodifytags
    - https://github.com/fatih/gomodifytags/releases
    - https://raw.githubusercontent.com/fatih/gomodifytags/master/README.md
  summary:
    - >
      gomodifytags is a Go developer tool for adding, updating, removing, and formatting
      struct field tags. Its importance is editor workflow: it automates a repetitive Go
      refactoring task that otherwise invites typo-prone manual edits.
  timeline:
    - '2017: GitHub repository created.'
    - '2017: v1.0.0 tag appears in the Git tag list.'
    - >
      2021: GitHub release pages show several 1.x releases, including v1.14.0, v1.15.0,
      and v1.16.0.
    - '2024: GitHub release pages show v1.17.0.'
  usage:
    - >
      Typical usage points gomodifytags at a Go source file and identifies the fields to
      change using -struct, -field, -line, -offset, or -all. Users then add or remove
      tag keys and options such as json, xml, omitempty, validation tags, or custom
      value templates.
    - >
      Because it prints changes unless -w is supplied, the CLI works well as both a
      terminal tool and a backend for editors that preview or apply edits at the cursor.
related-packages: []
category: developer-tools
package-manager:
  brew: gomodifytags
  nix: gomodifytags
