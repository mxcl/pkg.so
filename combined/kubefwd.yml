id: brew:kubefwd
display-name: kubefwd
homepage: https://kubefwd.com
repo: https://github.com/txn2/kubefwd
docs:
  - https://github.com/txn2/kubefwd#readme
  - https://kubefwd.com
config-file-location:
  unix: ~/.kube/config
credentials-file-location: null
history:
  adoption-history:
    - >
      kubefwd was adopted by developers who wanted local code to connect to in-cluster
      dependencies by service name without recreating the cluster environment in Docker
      Compose or rewriting connection strings. Its presence in Homebrew, Nix, Scoop, and
      winget made that workflow easy to install across common developer machines.
    - >
      The official site states that kubefwd has been on the CNCF Landscape since 2018,
      which places it among recognized cloud-native ecosystem tools even though it
      remains a focused local-development utility.
  package-nerd-significance:
    - >
      kubefwd is notable to package nerds because it packages a multi-process network
      trick as a single CLI. It competes culturally with raw kubectl port-forward,
      Telepresence-style intercept tools, and newer local-development proxies, while
      staying smaller and service-forwarding focused.
  project-history:
    - >
      The kubefwd site marks the project as established in 2017, and the public GitHub
      repository was created on August 5, 2018. The README describes it as 'Kube
      Forward' and as a command-line utility that bulk port-forwards Kubernetes services
      to a local workstation.
    - >
      The tool grew beyond simple port-forward orchestration. The documentation
      describes unique 127.x.x.x loopback addresses per service, /etc/hosts integration,
      automatic reconnection, an interactive TUI, REST API support, and MCP integration.
  related-projects:
    - >
      kubectl port-forward is the Kubernetes built-in workflow that kubefwd generalizes
      across many services.
    - >
      Telepresence and mirrord are related local-development tools mentioned by
      kubefwd's comparison documentation.
    - Kubernetes service discovery and kubeconfig access are central to kubefwd's operation.
  sources:
    - https://api.github.com/repos/txn2/kubefwd
    - https://formulae.brew.sh/formula/kubefwd
    - https://github.com/txn2/kubefwd
    - https://github.com/txn2/kubefwd/releases
    - https://kubefwd.com
  summary:
    - >
      kubefwd is a Kubernetes local-development networking tool that bulk-forwards
      services from a cluster to a workstation. Its package history matters because it
      wraps a common but fiddly Kubernetes debugging workflow - many kubectl
      port-forward sessions plus local name resolution - into one installable CLI.
  timeline:
    - '2017: Project site describes kubefwd as established'
    - '2018-08-05: Public GitHub repository created'
    - '2018: Project site says kubefwd joined the CNCF Landscape'
    - '2026-06-20: v1.25.16 release published'
  usage:
    - >
      Users run kubefwd against a namespace or selected services. The tool discovers
      services, assigns loopback IP addresses, updates /etc/hosts, and establishes port
      forwards through the Kubernetes API so names such as api-service, database, or
      redis resolve locally.
    - >
      Because it touches local host networking and /etc/hosts, the README documents sudo
      use for common workflows. That makes packaging important: users need a trusted
      binary from Homebrew, releases, Windows package managers, or Docker rather than ad
      hoc scripts.
related-packages: []
category: networking
package-manager:
  brew: kubefwd
  nix: kubefwd
  scoop: main/kubefwd
  winget: txn2.kubefwd
package-manager-url: https://formulae.brew.sh/formula/kubefwd
license: Apache-2.0
tags:
  - cli
  - kubernetes
  - local-development
  - networking
  - port-forwarding
  - proxy
description: Bulk port forwarding Kubernetes services for local development
executables:
  - kubefwd
provenance:
  formula: kubefwd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
