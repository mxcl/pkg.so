id: brew:http-server
display-name: http-server
homepage: https://github.com/http-party/http-server
repo: https://github.com/http-party/http-server
docs:
  - https://github.com/http-party/http-server#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      http-server's adoption is visible across npm, GitHub, and Homebrew: the official
      README includes npm and Homebrew badges, GitHub displays a large star/fork
      footprint and many dependents, and the input metadata records Homebrew and Nix
      packaging. Its popularity comes from needing no application framework when all a
      developer wants is static files over HTTP.
  package-nerd-significance:
    - >
      For package nerds, http-server is a classic small CLI that became infrastructure
      glue. It sits at the intersection of npm's executable-bin model, frontend local
      development, static-site demos, and Homebrew packaging for JavaScript tools that
      people want outside a single Node project.
  project-history:
    - >
      The GitHub repository was created in June 2011, and npm registry metadata records
      the package beginning the same day with version 0.1.0. The project became one of
      the standard Node-era answers to 'serve this folder over localhost' before npx
      made one-off CLI execution common.
    - >
      The package evolved from a tiny static-file helper into a more featureful local
      server. The README documents installation through npx, global npm, Homebrew,
      dependency installation, and Docker builds, while release metadata shows the
      project reaching the 14.x line in 2021 and 2022.
  related-projects:
    - >
      Related tools include Python's built-in simple HTTP server, serve, live-server,
      Caddy, Vite dev server workflows, and the Rust http-server package. It also uses
      Node and npm conventions for command distribution.
  sources:
    - Official GitHub README/release metadata and npm registry metadata.
  summary:
    - >
      http-server is a Node.js command-line static HTTP server. Its README describes a
      zero-configuration server that is simple enough for testing, local development,
      and learning, but also includes practical options for caching, directory listings,
      proxying, TLS, headers, and authentication.
  timeline:
    - '2011: The http-party/http-server repository was created on GitHub.'
    - '2011: The npm package was created with early 0.1.x versions.'
    - '2017: The GitHub release list includes the 0.10.0 release.'
    - '2021: The project published the 13.x and 14.0.0 release lines.'
    - '2022: The project published the 14.1.x release line.'
  usage:
    - >
      Common use is `npx http-server` or a global `http-server` command pointed at a
      directory. Options cover port and address selection, cache control, gzip and
      Brotli serving, CORS headers, custom headers, SPA-style proxy fallback, TLS
      certificates, basic authentication, robots.txt generation, and MIME overrides.
related-packages:
  - id: brew:serve
    reason: >
      Choose serve when you want the same directory-serving workflow in a standalone Go
      binary with documented health checks and environment-variable configuration.
    rel: alternative
    sources:
      - https://github.com/http-party/http-server#readme
      - https://github.com/syntaqx/serve#readme
  - id: brew:caddy
    reason: >
      Choose Caddy for persistent or public static hosting when automatic HTTPS, a
      durable Caddyfile, and production-oriented web-server administration matter more
      than a temporary zero-config server.
    rel: alternative
    sources:
      - https://github.com/http-party/http-server#readme
      - https://caddyserver.com/docs/quick-starts/static-files
      - https://caddyserver.com/docs/automatic-https
category: developer-tools
package-manager:
  brew: http-server
  nix: http-server
package-manager-url: https://formulae.brew.sh/formula/http-server
license: MIT
tags:
  - cli
  - http-server
  - nodejs
  - static-files
  - static-server
description: Simple zero-configuration command-line HTTP server
executables:
  - http-server
provenance:
  formula: http-server
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
