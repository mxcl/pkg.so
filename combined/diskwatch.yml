id: brew:diskwatch
display-name: DiskWatch
homepage: https://www.netwatchlabs.com/labs/diskwatch
repo: https://github.com/matthart1983/diskwatch
docs:
  - https://github.com/matthart1983/diskwatch#readme
  - https://www.netwatchlabs.com/labs/diskwatch
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DiskWatch is young and has a narrow public adoption record. The supplied package
      metadata shows it packaged for Homebrew and Nix, which is the main current signal
      that Unix package users can install it without building from source.
  package-nerd-significance:
    - >
      For package maintainers, DiskWatch is a small Rust TUI with few platform
      dependencies. It is interesting because it wraps common disk-inspection surfaces
      such as `/proc/diskstats`, inotify, FSEvents, diskutil, system_profiler, and
      optional smartctl into one packaged executable.
  project-history:
    - >
      The official NetWatch Labs page presents DiskWatch as a preview v0.1.1 tool in the
      same watch-family style as NetWatch and SysWatch. Its public GitHub repository
      describes it as a sibling to those tools and implements it as a Rust command-line
      application.
  related-projects:
    - >
      DiskWatch is positioned by its official pages as a sibling to NetWatch and
      SysWatch, and it overlaps operationally with iostat, iotop, smartctl, lsblk, df,
      du, diskutil, and system_profiler.
  sources:
    - https://github.com/matthart1983/diskwatch
    - https://www.netwatchlabs.com/labs/diskwatch
    - source_facts.package-manager
  summary:
    - >
      DiskWatch is a read-only terminal user interface for single-host disk diagnostics
      on macOS and Linux. It presents disk capacity, filesystem, I/O, SMART health,
      hot-file, and anomaly information in one terminal application.
  timeline:
    - '2026: Official homepage lists DiskWatch preview v0.1.1.'
    - '2026: The source metadata lists Homebrew and Nix package-manager names.'
  usage:
    - >
      Users run `diskwatch tui` for the interactive terminal UI or `diskwatch --diag` to
      print collected state and exit. The documented tabs cover overview, devices,
      volumes, filesystems, I/O, SMART data, hot files, and plain-English insights.
related-packages:
  - id: brew:smartmontools
    reason: >
      DiskWatch uses smartctl from smartmontools when available to show full SMART
      attribute tables instead of only basic platform health information.
    rel: adjacent_workflow
    sources:
      - https://www.netwatchlabs.com/labs/diskwatch
      - https://github.com/matthart1983/diskwatch#readme
      - https://www.smartmontools.org/
category: system
package-manager:
