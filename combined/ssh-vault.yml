id: brew:ssh-vault
display-name: ssh-vault
homepage: https://ssh-vault.com/
repo: https://github.com/ssh-vault/ssh-vault
docs:
  - https://github.com/ssh-vault/ssh-vault#readme
  - https://ssh-vault.com/
config-file-location: null
credentials-file-location:
  unix:
    - ~/.ssh/id_rsa
    - ~/.ssh/id_ed25519
history:
  adoption-history:
    - >
      ssh-vault is distributed through Homebrew, Cargo, and Nix. The repository's long
      release history and packaging across both the Rust and system-package ecosystems
      have kept it available as a small Unix-oriented encryption tool.
  package-nerd-significance:
    - >
      ssh-vault applies the familiar SSH-key trust material already present on developer
      machines to file and stream encryption. That makes it a compact bridge between SSH
      tooling, Unix pipelines, Cargo installation, and system package managers.
  project-history:
    - >
      The project began with an initial public commit in September 2016 and had tagged
      the 0.10.0 line by March 2017. Its modern Rust implementation supports vault
      creation, editing, viewing, and public-key fingerprint inspection, and the current
      documentation notes the transition away from legacy PEM-encoded RSA private keys.
  related-projects:
    - >
      The tool consumes SSH public and private key material and documents `ssh-keygen`
      as the migration path for legacy RSA private-key encoding.
  sources:
    - https://github.com/ssh-vault/ssh-vault#readme
    - https://github.com/ssh-vault/ssh-vault/releases
    - https://ssh-vault.com/
    - source_facts.package-manager
  summary:
    - >
      ssh-vault is a Rust command-line utility for creating, viewing, and editing
      encrypted vault data with SSH keys. It lets users reuse an existing SSH identity
      for secret encryption instead of introducing a separate vault-specific credential
      system.
  timeline:
    - '2016: Initial public commit.'
    - '2017: Version 0.10.0 tagged.'
    - '2026: Version 1.3.1 released.'
  usage:
    - >
      Users pipe secret material into `ssh-vault create`, select recipients through SSH
      public identities, and pipe an SSH-VAULT payload into `ssh-vault view` to decrypt
      it. The CLI also offers edit and fingerprint commands.
category: security
package-manager:
  brew: ssh-vault
  nix: ssh-vault
package-manager-url: https://formulae.brew.sh/formula/ssh-vault
license: BSD-3-Clause
tags:
  - cli
  - decryption
  - encryption
  - keys
  - rust
  - ssh
description: Encrypt/decrypt using SSH keys
executables:
  - ssh-vault
provenance:
  formula: ssh-vault
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
