id: brew:near
display-name: NEAR CLI
homepage: https://near.cli.rs
repo: https://github.com/near/near-cli-rs
docs:
  - https://github.com/near/near-cli-rs/blob/main/docs/GUIDE.en.md
  - https://github.com/near/near-cli-rs/blob/main/docs/README.en.md
  - https://near.cli.rs/
config-file-location:
  linux: ${XDG_CONFIG_HOME:-$HOME/.config}/near-cli/config.toml
  macos: ~/Library/Application Support/near-cli/config.toml
  windows: '%APPDATA%\near-cli\config.toml'
credentials-file-location:
  unix: ~/.near-credentials/<network-name>/<account-id>/<public-key>.json
history:
  adoption-history:
    - >
      The official project recommends the Rust CLI for new users. It is distributed as
      platform installers and portable archives, through npm/npx wrappers, Cargo,
      Homebrew, and source builds, with documented non-interactive patterns for CI.
  package-nerd-significance:
    - >
      NEAR CLI illustrates a common ecosystem migration from a runtime-dependent
      JavaScript CLI to a portable Rust binary. Its broad distribution matrix, native
      credential stores, scripting mode, and extension mechanism make it relevant to
      both package maintainers and blockchain automation users.
  project-history:
    - >
      The near-cli-rs repository began in 2021 as a Rust implementation of the NEAR
      command-line experience. It became a complete rewrite of the earlier JavaScript
      near-cli, emphasizing faster startup, no Node.js runtime dependency, interactive
      prompts, and system-keychain integration.
  related-projects:
    - >
      The project replaces the older JavaScript near-cli for new users and complements
      cargo-near for building Rust smart contracts on NEAR.
  sources:
    - https://github.com/near/near-cli-rs#readme
    - https://github.com/near/near-cli-rs/blob/main/docs/README.en.md
    - https://github.com/near/near-cli-rs/releases
    - https://near.cli.rs/
  summary:
    - >
      NEAR CLI is a Rust command-line client for interacting with NEAR Protocol. It
      guides users through account, token, staking, smart-contract, transaction,
      network, and extension operations while also allowing fully specified commands for
      scripts and CI.
  timeline:
    - '2021-03: The near-cli-rs official repository was created.'
    - >
      2026: The project documented near-cli-rs as the recommended CLI for new users and
      continued distributing native installers, archives, npm wrappers, Cargo builds,
      and package-manager builds.
  usage:
    - >
      Running near without a complete command opens an interactive flow. Direct
      subcommands support account management, NEAR and token transfers, staking,
      smart-contract deployment and calls, transaction inspection, and selection among
      mainnet, testnet, and custom network configurations.
related-packages: []
category: developer-tools
package-manager:
  brew: near
package-manager-url: https://formulae.brew.sh/formula/near
license: MIT OR Apache-2.0
tags:
  - blockchain
  - cli
  - near-protocol
  - rust
  - smart-contracts
  - staking
  - tokens
  - web3
description: Human-friendly console utility for interacting with NEAR Protocol
executables:
  - near
provenance:
  formula: near
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
