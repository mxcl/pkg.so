id: brew:dtach
display-name: dtach
homepage: https://dtach.sourceforge.net/
repo: https://github.com/crigler/dtach
docs:
  - https://dtach.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dtach became a quiet packaging staple because it solves a durable Unix problem
      with a tiny dependency footprint. The input package metadata records packages
      across Homebrew, Debian, Ubuntu, Fedora/DNF, Alpine/apk, MacPorts, Nix, and zypper
      ecosystems, and Homebrew still packages the 0.9 SourceForge tarball.
    - >
      Its adoption is not about a fast-moving upstream. It is about stability: terminal
      users, rescue environments, remote shells, and minimal systems can get detach
      semantics without installing the heavier screen or tmux experience.
  package-nerd-significance:
    - >
      dtach is significant because it is the purest version of a beloved package-manager
      category: carve one feature out of a larger tool, keep the code tiny, and let
      users compose it with the rest of Unix. It is the detach feature as a package.
    - >
      It also remains a useful contrast point for screen, tmux, abduco, dvtm, and
      terminal multiplexers generally. Package nerds care because dtach marks the
      boundary between session persistence and full terminal multiplexing.
  project-history:
    - >
      dtach was written by Ned T. Crigler because screen did not fit his needs: he
      wanted detached terminal sessions without multiple terminal support, terminal
      emulation, stream interpretation, or a large codebase. The official README says
      dtach passes the raw output stream through and only processes the detach character
      and suspend key unless those features are disabled.
    - >
      The project's official changelog records an initial SourceForge release in version
      0.3, portability work in 0.4 for FreeBSD, Debian alpha, Debian SPARC, Debian
      PowerPC, and Solaris, redraw and process-group changes in later releases, and
      version 0.9 adding AIX support plus `dtach -N` and `dtach -p` modes.
    - >
      The SourceForge homepage points to the GitHub repository for development, making
      the GitHub URL the official HTTP(S) source-control page while SourceForge remains
      the canonical homepage and release-download surface.
  related-projects:
    - GNU screen is the direct comparison and source of the detach feature dtach emulates.
    - >
      tmux is the modern terminal multiplexer users often compare with dtach, though
      dtach intentionally avoids multiplexing features.
    - abduco and dvtm occupy nearby minimalist terminal-session territory.
  sources:
    - https://dtach.sourceforge.net/
    - https://github.com/crigler/dtach
    - https://raw.githubusercontent.com/crigler/dtach/master/README
    - https://formulae.brew.sh/api/formula/dtach.json
  summary:
    - >
      dtach is a tiny C program that provides the detach-and-reattach part of GNU screen
      without screen's terminal emulator, window management, or broader feature set. It
      is a classic Unix package for people who want one behavior, a Unix-domain socket,
      and almost nothing else.
  timeline:
    - '2004: The README copyright line begins, matching the early dtach era.'
    - 'Version 0.3: The official changelog records the initial SourceForge release.'
    - >
      Version 0.4: Portability work adds FreeBSD, Debian alpha, Debian SPARC, Debian
      PowerPC, and Solaris support.
    - >
      Version 0.9: The release adds AIX support, `dtach -N`, `dtach -p`, signal-state
      preservation, and socket-path fixes.
    - '2016: The README copyright line extends through 2016.'
    - '2026: Homebrew still packages dtach 0.9 from SourceForge.'
  usage:
    - >
      Users create or attach to sessions by naming a Unix-domain socket, for example
      with `dtach -A /tmp/session command`, then detach with the configured detach key
      and later reattach. Separate attachers can choose different detach characters,
      suspend handling, and redraw methods.
    - >
      dtach does not preserve scrollback or screen contents, so it works best with
      programs that can redraw themselves. The official page calls out full-screen
      programs such as emacs and ircII as motivating use cases because dtach avoids
      screen's terminal interpretation layer.
related-packages:
  - id: brew:screen
    reason: >
      Choose GNU Screen when you need terminal emulation, multiple windows, and a
      complete multiplexer; choose dtach for only lightweight detach-and-reattach
      behavior.
    rel: alternative
    sources:
      - https://github.com/crigler/dtach#readme
      - https://www.gnu.org/software/screen/
  - id: brew:tmux
    reason: >
      Choose tmux for managed windows, panes, and richer interactive sessions; dtach is
      preferable when a single persistent program and minimal stream handling are
      enough.
    rel: alternative
    sources:
      - https://github.com/crigler/dtach#readme
      - https://github.com/tmux/tmux/wiki
  - id: brew:abduco
    reason: >
      abduco is another minimal session manager and is useful when its client/server
      session-control model is preferred over dtach's Unix-socket interface.
    rel: alternative
    sources:
      - https://github.com/crigler/dtach#readme
      - https://www.brain-dump.org/projects/abduco/
category: system
