id: brew:beanquery
display-name: beanquery
homepage: https://github.com/beancount/beanquery
repo: https://github.com/beancount/beanquery
docs:
  - https://github.com/beancount/beanquery/tree/master/docs
  - https://github.com/beancount/beanquery#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      beanquery is mainly adopted as part of the Beancount ecosystem. The supplied
      package metadata shows it packaged for Homebrew, Debian as python3-beanquery, and
      Nix.
  package-nerd-significance:
    - >
      beanquery is the small-tool companion to Beancount: it turns ledger data into
      queryable tabular output without requiring users to flatten accounting inventories
      into a general SQL database first.
  project-history:
    - >
      Beancount's query-language documentation describes bean-query as a custom SQL-like
      client created because plain SQLite export was awkward for Beancount's inventory
      and lot-aware accounting model.
    - >
      The current beanquery repository presents it as a standalone, customizable,
      extensible SQL query tool that works on tabular data including Beancount ledgers.
  related-projects:
    - >
      Beancount is the primary related project. The tool also overlaps conceptually with
      SQL shells and Beancount's older SQLite-export experiments.
  sources:
    - https://beancount.github.io/docs/beancount_query_language/
    - https://github.com/beancount/beancount#readme
    - https://github.com/beancount/beanquery#readme
    - input.json source_facts.package-manager
  summary:
    - >
      beanquery is a lightweight SQL-like query tool for tabular data, especially
      Beancount ledger data.
  timeline:
    - >
      2014: Beancount documentation says about 70 percent of the planned query-language
      features were implemented and the first iteration was merged.
    - '2021: The official GitHub repository for beanquery was created as a separate project.'
    - >
      2024: Beancount v3's README describes former v2 tools moving into independent
      GitHub projects, matching beanquery's standalone packaging role.
  usage:
    - >
      The Beancount docs show bean-query running interactively on a ledger file or
      receiving a query directly on the command line, for example to produce balances,
      journals, and custom accounting reports.
related-packages:
  - id: brew:beancount
    reason: >
      Use Beancount to create and validate the ledger data that beanquery exposes
      through its accounting-aware SQL-like interface.
    rel: adjacent_workflow
    sources:
      - https://github.com/beancount/beanquery
      - https://github.com/beancount/beancount
category: data
package-manager:
  brew: beanquery
  debian: python3-beanquery
  nix: beanquery
package-manager-url: https://formulae.brew.sh/formula/beanquery
license: GPL-2.0-only
tags:
  - beancount
  - cli
  - query
  - sql
  - tabular-data
description: Customizable lightweight SQL query tool
executables:
  - bean-query
provenance:
  formula: beanquery
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
