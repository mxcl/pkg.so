id: brew:gifcap
display-name: gifcap
homepage: https://github.com/outlook/gifcap
repo: https://github.com/outlook/gifcap
docs:
  - https://github.com/outlook/gifcap#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption footprint is narrow but practical. Homebrew packaged it for macOS
      users, while the upstream README also documents copying the script onto a PATH on
      other Unix-like systems with adb, ffmpeg, and ffprobe installed.
  package-nerd-significance:
    - >
      gifcap is package-manager-interesting because it wraps a common Android
      development chore in one executable and depends on tools many developers already
      install: adb, ffmpeg, and a shell.
  project-history:
    - >
      The project appeared as an Outlook/Microsoft shell script repository in December
      2016. Its README describes a focused workflow: use Android's device recording path
      together with common Unix video tools to create shareable GIFs from app behavior.
  related-projects:
    - >
      gifcap sits near ffmpeg-based screen-recording wrappers and Android SDK tooling
      rather than general-purpose GIF editors.
  sources:
    - https://formulae.brew.sh/formula/gifcap
    - https://github.com/outlook/gifcap
    - https://raw.githubusercontent.com/outlook/gifcap/master/README.md
  summary:
    - >
      gifcap is a small command-line screen-capture utility for turning recordings from
      a connected Android device into GIF files.
  timeline:
    - '2016: GitHub repository created.'
    - '2017: Tagged 1.0.x releases established the Homebrew-packaged script line.'
  usage:
    - >
      Practitioners use gifcap when debugging Android interactions, demonstrating
      animation polish, or sharing visual defects in chat and issue trackers. The
      command records a physical Android device until interrupted and writes the
      resulting GIF to the requested filename.
related-packages:
  - id: cask:android-platform-tools
    reason: >
      gifcap requires `adb`, which Android SDK Platform-Tools supplies for communicating
      with and recording the connected device.
    rel: adjacent_workflow
    sources:
      - https://github.com/outlook/gifcap#readme
      - https://developer.android.com/tools/adb
  - id: brew:ffmpeg
    reason: >
      gifcap requires FFmpeg and ffprobe to process the Android screen recording into
      its final GIF.
    rel: adjacent_workflow
    sources:
      - https://github.com/outlook/gifcap#readme
      - https://ffmpeg.org/ffmpeg.html
  - id: brew:gifify
    reason: >
      Choose gifify when a screen recording or movie already exists; unlike gifcap, it
      converts a local video instead of recording an attached Android device.
    rel: alternative
    sources:
      - https://github.com/outlook/gifcap#readme
      - https://github.com/jclem/gifify#readme
category: media
package-manager:
  brew: gifcap
package-manager-url: https://formulae.brew.sh/formula/gifcap
license: MIT
tags:
  - android
  - cli
  - gif
  - screen-capture
description: Capture video from an Android device and make a gif
executables:
  - gifcap
provenance:
  formula: gifcap
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
