id: brew:bento
display-name: Bento
homepage: https://warpstreamlabs.github.io/bento/
repo: https://github.com/warpstreamlabs/bento
docs:
  - https://warpstreamlabs.github.io/bento/docs/configuration/about
  - https://warpstreamlabs.github.io/bento
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Bento adoption is tied to users who wanted the Benthos workflow after the upstream
      licensing and branding split. Its package-manager presence lets existing teams
      choose the fork without learning a different pipeline model.
    - >
      WarpStream's stewardship also matters for data-infrastructure users because
      WarpStream itself operates in the Kafka-compatible streaming space, making Bento a
      natural local connector and transformation tool around streaming deployments.
  package-nerd-significance:
    - >
      Bento is package-nerd significant because it is the fork name that makes the
      Benthos licensing and governance split visible in package indexes. The package
      tells you which side of the lineage you are installing.
    - >
      Its relationship to brew:benthos is also useful metadata: both tools share
      concepts and much command-line culture, but Bento intentionally uses a separate
      executable and docs namespace.
  project-history:
    - >
      The Bento GitHub repository was created in May 2024, with an early v0.0.3 release
      candidate published in June 2024. The README keeps the Benthos-style design:
      high-performance resilient stream processing, a single config file, connectors,
      processors, Bloblang mappings, metrics, tracing, and plugin APIs.
    - >
      Bento's short history is therefore mostly a continuity story rather than an
      invention story: it keeps the pre-existing architecture and developer ergonomics
      while establishing a separate namespace, documentation site, container image, and
      Homebrew formula.
  related-projects:
    - Benthos is the original project lineage.
    - >
      Redpanda Connect is the Redpanda-maintained successor/renaming around the same
      stream-processing family.
    - Bloblang remains the mapping-language heritage shared by Bento-style pipelines.
  sources:
    - https://github.com/warpstreamlabs/bento
    - https://github.com/warpstreamlabs/bento/releases/tag/v0.0.3-rc1
    - https://warpstreamlabs.github.io/bento/docs/about
  summary:
    - >
      Bento is WarpStream Labs' fork of the original Benthos project line. Its
      repository description explicitly frames it as a fork of the original project
      before the license was changed, preserving the familiar declarative
      stream-processing workflow under a new package and executable name.
  timeline:
    - '2024-05: The warpstreamlabs/bento repository was created.'
    - '2024-06: Bento v0.0.3-rc1 was published.'
    - >
      2024: The README described Bento as a fork of the original project before the
      license change.
    - '2026: The repository remained active with the Bento package identity.'
  usage:
    - >
      Bento is run with a config file, commonly as `bento -c ./config.yaml`, or as a
      container with a mounted YAML file. It can connect cloud services, Kafka, NATS,
      HTTP, databases, queues, and object stores while applying mappings, filters,
      enrichment, and batching.
    - >
      For package users, Bento is attractive when they want a static local binary, a
      docker image, and a Go plugin surface without depending on the Redpanda Connect
      distribution.
related-packages:
  - id: brew:benthos
    reason: >
      Choose Benthos when you need the Redpanda-maintained MIT core and the project
      lineage that officially directs connector users toward Redpanda Connect.
    rel: alternative
    sources:
      - https://github.com/warpstreamlabs/bento
      - https://github.com/redpanda-data/benthos
category: data
