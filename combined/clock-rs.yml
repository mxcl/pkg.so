id: brew:clock-rs
display-name: clock-rs
homepage: https://github.com/Oughie/clock-rs
repo: https://github.com/Oughie/clock-rs
docs:
  - https://github.com/Oughie/clock-rs#readme
config-file-location:
  linux: ~/.config/clock-rs/conf.toml
  macos: ~/Library/Application Support/clock-rs/conf.toml
  windows: C:\Users\%USERNAME%\AppData\Local\clock-rs\conf.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Cargo, Homebrew, Arch AUR, NetBSD
      pkgsrc, and Nixpkgs, showing adoption across several package-manager ecosystems.
  package-nerd-significance:
    - >
      clock-rs is a good example of a polished Rust CLI moving through multiple
      packaging channels while keeping configuration simple and cross-platform.
  project-history:
    - >
      The official README describes clock-rs as a modern terminal-based Rust clock and a
      new alternative to tty-clock, adding a single configuration file and command-line
      overrides.
  related-projects:
    - The README explicitly calls clock-rs an alternative to tty-clock.
  sources:
    - >
      Official GitHub README: introduction, installation methods, usage, configuration
      paths, and relation to tty-clock.
    - >
      Official GitHub repository metadata: latest release information displayed on the
      repository page.
  summary:
    - >
      clock-rs is a Rust terminal clock with timer and stopwatch modes, TOML
      configuration, shell completions, and package-manager distribution.
  timeline:
    - '2024: README copyright year for the clock-rs project.'
    - >
      2026-05-16: GitHub releases page lists clock-rs v0.2.1 as latest in the opened
      repository metadata.
  usage:
    - >
      Users run `clock-rs` for the default clock, or subcommands such as `timer` and
      `stopwatch`. Settings can live in `conf.toml` and be overridden by command-line
      options.
related-packages:
  - id: brew:tty-clock
    reason: >
      Choose tty-clock for the established ncurses digital-clock experience; clock-rs
      explicitly positions itself as its cross-platform, configurable alternative with
      timer and stopwatch modes.
    rel: alternative
    sources:
      - https://github.com/Oughie/clock-rs#readme
      - https://github.com/xorg62/tty-clock
category: productivity
package-manager:
  brew: clock-rs
  nix: clock-rs
package-manager-url: https://formulae.brew.sh/formula/clock-rs
license: Apache-2.0
tags:
  - cli
  - clock
  - rust
  - terminal
  - timer
  - tui
description: Modern, digital clock that effortlessly runs in your terminal
executables:
  - clock-rs
provenance:
  formula: clock-rs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
