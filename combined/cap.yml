history:
  adoption-history:
    - >
      Cap is distributed as a desktop application and through Homebrew Cask. Its
      official site positions it for teams, builders, and creators, while self-hosting
      and S3-compatible storage broaden its appeal among privacy-conscious technical
      users.
  package-nerd-significance:
    - >
      Cap is notable to package enthusiasts because it combines a polished native
      recorder with inspectable source, Homebrew installation, local recording,
      configurable object storage, and a self-hostable web stack. It occupies the useful
      overlap between desktop media tooling and deployable infrastructure.
  project-history:
    - >
      Cap was developed in public as an open-source alternative to hosted
      screen-recording services such as Loom. The project expanded from recording and
      instant sharing into local timeline editing, screenshots, collaboration,
      analytics, AI-assisted transcripts and summaries, APIs, and self-hosting.
  related-projects:
    - Loom is the proprietary service against which Cap officially positions itself.
    - >
      OBS Studio and Screen Studio address overlapping recording workflows, although Cap
      emphasizes rapid asynchronous sharing and integrated hosting.
  sources:
    - https://cap.so/docs
    - https://cap.so/docs/recording/instant-mode
    - https://cap.so/docs/recording/studio-mode
    - https://github.com/capsoftware/cap
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Cap is an open-source screen recorder, editor, and sharing platform. It supports
      quick cloud-backed recordings through Instant Mode, local editable projects
      through Studio Mode, and deployment with user-controlled storage or a self-hosted
      service.
  timeline:
    - 'Public development: Cap emerged as an open-source Loom alternative.'
    - >
      Later development: Studio editing, team collaboration, AI metadata, APIs,
      webhooks, and self-hosting became part of the official product surface.
    - '2026: The supplied Homebrew Cask record distributes Cap 0.5.9.'
  usage:
    - >
      Users record a display, window, selected region, camera, microphone, or supported
      system audio, then export locally or create a shareable link. Studio Mode is
      suited to edited demonstrations and tutorials; Instant Mode is suited to bug
      reports, asynchronous updates, and quick walkthroughs.
