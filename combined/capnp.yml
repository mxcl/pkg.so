id: brew:capnp
display-name: Cap'n Proto
homepage: https://capnproto.org/
repo: https://github.com/capnproto/capnproto
docs:
  - https://capnproto.org/
  - https://capnproto.org/language.html
  - https://capnproto.org/rpc.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official introduction says Cap'n Proto was built for Sandstorm.io and is
      heavily used in Cloudflare Workers. The 1.0 announcement adds that Cloudflare had
      used it before employing Varda and that Cap'n Proto encoded enormous volumes of
      messages and data in production.
    - >
      Cap'n Proto spread through package managers because it is both a compiler tool and
      a runtime library. The package metadata in this batch shows Homebrew and Scoop
      coverage, while the official site documents C++ plus implementations or bindings
      for other languages.
  package-nerd-significance:
    - >
      Cap'n Proto is a package-nerd landmark because a tiny command-line compiler sits
      at the intersection of ABI concerns, wire formats, generated code, language
      bindings, and RPC semantics. Packaging it correctly means shipping both the capnp
      compiler and the libraries plugins expect.
    - >
      It is also one of the clearest examples of a serialization package becoming
      infrastructure: originally interesting for zero-copy encoding, then important as
      part of Cloudflare Workers and KJ's async C++ ecosystem.
  project-history:
    - >
      Cap'n Proto was announced in 2013 by Kenton Varda, who had been the primary author
      of Protocol Buffers version 2 at Google. The official introduction presents Cap'n
      Proto as an answer to years of experience with Protocol Buffers: a binary format
      that avoids a separate encode/decode step by making the serialized format suitable
      as an in-memory representation.
    - >
      The first official release, v0.1, was published on June 27, 2013. At that point
      the C++ implementation already covered schema files, code generation, file
      descriptor and stream I/O, text-format output, reflection, dynamic schemas,
      code-generator plugins, and Linux/macOS testing, while RPC and non-C++
      implementations were still developing.
    - >
      Over the following decade, Cap'n Proto grew from serialization into a full RPC
      stack and companion C++ toolkit, KJ. The official 1.0 announcement in July 2023
      described Cap'n Proto as production-proven and released 1.0 as a long-term-support
      point before future C++ API work.
  related-projects:
    - >
      Protocol Buffers is the explicit comparison point and personal predecessor for
      Kenton Varda.
    - Sandstorm.io is named by the official introduction as an original target environment.
    - >
      Cloudflare Workers and workerd are named in official Cap'n Proto news as major
      production users and drivers of KJ work.
    - KJ is the C++ toolkit developed with Cap'n Proto.
    - FlatBuffers and SBE are serialization formats compared in Cap'n Proto's official news.
  sources:
    - https://api.github.com/repos/capnproto/capnproto
    - https://capnproto.org/
    - https://capnproto.org/news/2013-04-01-announcing-capn-proto.html
    - https://capnproto.org/news/2013-06-27-capn-proto-beta-release.html
    - https://capnproto.org/news/2021-08-14-capnproto-0.9.html
    - https://capnproto.org/news/2023-07-28-capnproto-1.0.html
  summary:
    - >
      Cap'n Proto is a binary data interchange format, schema language, code generator,
      and capability-based RPC system designed around zero-copy access, fast generated
      code, and object-capability RPC.
  timeline:
    - '2013-03: capnproto/capnproto repository is created on GitHub.'
    - "2013-04-01: Cap'n Proto is announced."
    - '2013-06-27: First official release, v0.1, is published.'
    - "2013-12: Cap'n Proto v0.4 introduces time-traveling RPC."
    - >
      2014: v0.5 adds features including generics, Visual C++, Java, C#, and
      Sandstorm.io-related work.
    - >
      2021: v0.9 announcement says Cloudflare Workers Durable Objects make heavy use of
      Cap'n Proto RPC.
    - "2023-07-28: Cap'n Proto 1.0 is released."
  usage:
    - >
      Users write .capnp schema files, compile them with capnp and language-specific
      plugins such as capnpc-c++, then use generated accessors to build, read, and
      traverse messages without a normal parse step.
    - >
      Beyond local serialization, Cap'n Proto RPC is used for capability-style
      distributed object calls, promise pipelining, and patterns such as streaming
      through temporary RPC objects. It is commonly considered alongside Protocol
      Buffers, FlatBuffers, SBE, Thrift, Ice, and gRPC depending on whether the problem
      is schema encoding, RPC, or both.
related-packages:
  - id: brew:flatbuffers
    reason: >
      Choose FlatBuffers when its broader generated-language ecosystem or table-oriented
      format fits better; Cap'n Proto's official comparison discusses their zero-copy
      designs and feature differences.
    rel: alternative
    sources:
      - https://capnproto.org/news/2014-06-17-capn-proto-flatbuffers-sbe.html
      - https://flatbuffers.dev/
  - id: brew:protobuf
    reason: >
      Choose Protocol Buffers for its larger language ecosystem and conventional compact
      encoding; Cap'n Proto instead emphasizes direct in-memory traversal and built-in
      capability RPC.
    rel: alternative
    sources:
      - https://capnproto.org/
      - https://capnproto.org/news/2014-06-17-capn-proto-flatbuffers-sbe.html
      - https://protobuf.dev/overview/
category: developer-tools
