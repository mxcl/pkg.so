id: brew:gotop
display-name: gotop
homepage: https://github.com/xxxserxxx/gotop
repo: https://github.com/xxxserxxx/gotop
docs:
  - https://github.com/xxxserxxx/gotop#readme
config-file-location:
  unix:
    - ./gotop.conf
    - ~/.config/gotop/gotop.conf
    - /etc/gotop/gotop.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      gotop spread through multiple package channels because it is a visible terminal
      utility rather than a library. The README documents Arch, Gentoo, Nix, Homebrew,
      Scoop, prebuilt binaries, RPM and DEB packages, and source installation.
  package-nerd-significance:
    - >
      gotop is significant in package-manager culture because it is a classic terminal
      eye-candy package: easy to demo, easy to install, and tied to a lineage of top,
      htop, gtop, vtop, ytop, bashtop, and bpytop. Its fork history also shows how
      package ecosystems preserve useful CLIs after an original upstream changes
      direction.
  project-history:
    - >
      The original cjbassi/gotop repository was created in February 2018 and described
      itself as inspired by gtop and vtop. The xxxserxxx/gotop repository was created in
      February 2020 after the original author moved to ytop, a Rust rewrite, and
      deprecated the Go version.
    - >
      The maintained fork's README documents that the fork exists to keep the Go project
      alive while keeping a small focused core and providing extension paths for less
      universal features. Examples called out by the maintainer include NVIDIA sensor
      support and aggregating data from remote gotop instances.
  related-projects:
    - gtop and vtop are the JavaScript terminal monitors that inspired the original project.
    - ytop is the original author's Rust rewrite.
    - >
      top, htop, bashtop, bpytop, atop, iftop, iotop, nmon, ctop, and related tools
      occupy the same terminal-monitoring family.
  sources:
    - https://formulae.brew.sh/formula/gotop
    - https://github.com/cjbassi/gotop
    - https://github.com/cjbassi/ytop
    - https://github.com/xxxserxxx/gotop
    - https://github.com/xxxserxxx/gotop#readme
    - https://github.com/xxxserxxx/gotop/releases
  summary:
    - >
      gotop is a terminal-based graphical activity monitor written in Go. It belongs to
      the family of richer top-like TUIs that trade plain process tables for charts,
      widgets, colors, and keyboard-driven inspection.
  timeline:
    - '2018: Original cjbassi/gotop repository created and 1.0.0 release published.'
    - '2019: cjbassi/ytop repository created as a Rust TUI system monitor.'
    - '2020: xxxserxxx/gotop fork repository created.'
    - '2020: v3.1.0 release published from the maintained fork.'
    - '2020: v4.0.0 and v4.0.1 releases moved the fork through a major version line.'
    - >
      2021: v4.1.x releases added work including Apple silicon builds, translations,
      NVIDIA support, and remote support.
    - >
      2022: v4.2.0 release noted contributor-driven maintenance and required Go 1.16 or
      later for builds.
  usage:
    - >
      Users launch gotop in a terminal to monitor CPU, memory, disks, network,
      processes, batteries, and sensors through a graphical text interface. The README
      points to layouts, color schemes, device filtering, configuration, and
      remote-monitoring documentation for users who want to tune the dashboard.
    - >
      The fork added or folded in features such as layouts, configuration, remote
      metrics, translations, NVIDIA support, SMART/NVME temperature work, and packaged
      release artifacts. Its configuration search paths and layout/color-scheme system
      make it more customizable than a minimal top clone.
related-packages:
  - id: brew:gtop
    reason: >
      Choose gtop for the Node.js terminal dashboard that directly inspired gotop;
      choose gotop when a Go-native binary and its maintained layouts, sensors, and
      remote metrics are preferable.
    rel: alternative
    sources:
      - https://github.com/xxxserxxx/gotop#readme
      - https://github.com/aksakalli/gtop#readme
  - id: brew:btop
    reason: >
      Choose btop for a modern C++ resource dashboard with active cross-platform and
      GPU-monitoring work; choose gotop for its Go implementation and configurable
      widget layouts.
    rel: alternative
    sources:
      - https://github.com/xxxserxxx/gotop#readme
      - https://github.com/aristocratos/btop#readme
  - id: brew:htop
    reason: >
      Choose htop for a mature process-centric viewer and manager; choose gotop when
      graphical resource widgets and time-series charts are the main attraction.
    rel: alternative
    sources:
      - https://github.com/xxxserxxx/gotop#readme
      - https://htop.dev/
category: system
package-manager:
  apk: gotop
  brew: gotop
  macports: gotop
  nix: gotop
  scoop: main/gotop
package-manager-url: https://formulae.brew.sh/formula/gotop
license: BSD-3-Clause
tags:
  - activity-monitor
  - cli
  - monitoring
  - system-monitor
  - terminal
description: Terminal based graphical activity monitor inspired by gtop and vtop
executables:
  - gotop
provenance:
  formula: gotop
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
