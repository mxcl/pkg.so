id: brew:gotz
display-name: gotz
homepage: https://github.com/merschformann/gotz
repo: https://github.com/merschformann/gotz
docs:
  - https://github.com/merschformann/gotz#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/gotz/config.json
    - ~/.config/gotz/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      gotz is distributed through `go install`, release binaries, and Homebrew. Homebrew
      packages version 0.1.15 in homebrew/core and also exposes a HEAD build, while the
      README still documents the upstream tap command as an installation path.
  package-nerd-significance:
    - >
      gotz is representative of small Go terminal utilities that package cleanly as a
      single executable and use XDG-style configuration for repeatable command-line
      workflows.
  project-history:
    - >
      The README describes gotz as a simple CLI timezone information tool created to
      make timezone calculation easier for international teamwork. It supports current
      and arbitrary time display, live mode, configurable timezones, 12-hour format,
      sorting, and terminal styling.
  related-projects:
    - >
      gotz is related to timezone database identifiers, terminal dashboards, and other
      CLI time conversion tools.
  sources:
    - https://formulae.brew.sh/formula/gotz
    - https://github.com/merschformann/gotz#readme
  summary:
    - >
      gotz is a Go-based terminal tool for displaying timezone information and comparing
      times across configured locations.
  timeline:
    - '0.1.15: Homebrew packages gotz as the current stable release.'
    - >
      README era: Go install, release binaries, and Homebrew installation paths are
      documented upstream.
  usage:
    - >
      Users run `gotz` to show current times, pass a time such as `15` or
      `15@Asia/Tokyo` to compare arbitrary times, and configure defaults with flags such
      as `--timezones`, `--hours12`, and `--live`. Persistent configuration is stored
      under `$XDG_CONFIG_HOME/gotz/config.json`, usually `~/.config/gotz/config.json`.
related-packages: []
category: productivity
package-manager:
  brew: gotz
package-manager-url: https://formulae.brew.sh/formula/gotz
license: MIT
tags:
  - cli
  - configuration
  - terminal
  - time
  - timezone
description: Displays timezones in your terminal
executables:
  - gotz
provenance:
  formula: gotz
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
