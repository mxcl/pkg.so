id: brew:dirt
display-name: Dirt
homepage: https://codeberg.org/uzu/dirt
repo: https://codeberg.org/uzu/dirt
docs:
  - https://codeberg.org/uzu/dirt
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents source builds on Linux, macOS, and Windows/Cygwin, with
      Homebrew and MacPorts used for dependencies on macOS. The repository description
      also notes that the classic Dirt lineage was later ported to SuperDirt.
  package-nerd-significance:
    - >
      Dirt is package-nerd interesting because it is a small native audio runtime
      attached to a larger creative-coding ecosystem: packaging it means making
      old-school C audio dependencies line up for live performance use.
  project-history:
    - >
      The official repository describes Dirt as the original classic Dirt sampler,
      implemented in C for TidalCycles and related use. Its README is deliberately
      modest, describing it as a small tool for playing pieces of samples with some
      timing accuracy.
  related-projects:
    - The official repository ties Dirt to TidalCycles and SuperDirt.
  sources:
    - https://codeberg.org/uzu/dirt
    - https://codeberg.org/uzu/dirt/raw/branch/master/README.md
  summary:
    - Dirt is a C sampler for TidalCycles-style live-coding workflows.
  timeline:
    - '2016: README copyright names Alex McLean and contributors.'
    - '2020s: Codeberg repository describes this as classic Dirt, later ported to SuperDirt.'
  usage:
    - >
      Users build Dirt with audio dependencies such as JACK, libsndfile, libsamplerate,
      liblo, and PortAudio, then run the dirt executable alongside a JACK audio server.
      In practice it belongs to the live-coding and sample-playback side of package
      collections.
related-packages: []
category: media
package-manager:
  brew: dirt
  nix: dirt
package-manager-url: https://formulae.brew.sh/formula/dirt
license: GPL-3.0-or-later
tags:
  - audio
  - cli
  - sample-playback
  - sampler
description: Experimental sample playback
executables:
  - dirt
provenance:
  formula: dirt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
