id: brew:ncview
display-name: Ncview
homepage: https://cirrus.ucsd.edu/ncview/
repo: null
docs:
  - https://cirrus.ucsd.edu/ncview
  - https://cirrus.ucsd.edu/~pierce/software/ncview/index.html
  - https://cirrus.ucsd.edu/~pierce/software/ncview/quick_intro.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ncview has persisted because climate, ocean, atmospheric, and HPC users still need
      a fast graphical sanity check for array-oriented scientific files. Debian packages
      it under science, and Homebrew lists binary bottle support for macOS and Linux.
    - >
      On July 1, 2026, Homebrew Formulae listed ncview 2.1.11 with 670 installs in its
      365-day analytics window, which is modest but real usage for an X11 scientific
      utility.
  package-nerd-significance:
    - >
      ncview is a classic small scientific Unix tool: old UI stack, narrow purpose,
      durable because the file format and workflow survived. It is especially useful in
      package indexes because its dependencies signal the netCDF plus X11 visualization
      niche.
  project-history:
    - >
      The distributed README for ncview 1.75 is dated March 20, 1999 and states
      copyright from 1993 through 1999, so the project belongs to the early scientific
      Unix/X11 era around netCDF. The README explicitly frames ncview as a lightweight
      viewer for movies and simple plots, not as a replacement for commercial analysis
      packages.
    - >
      The project remained tied to the netCDF ecosystem: its build instructions require
      the netCDF library and optionally UDUNITS, and the official page says version
      2.1.11 was updated on November 26, 2024.
  related-projects:
    - netCDF
    - UDUNITS
    - X11 Athena Widget Set
    - Panoply
    - NCO
    - CDO
  sources:
    - https://cirrus.ucsd.edu/ncview/
    - https://cirrus.ucsd.edu/~pierce/docs/ncview.README
    - https://formulae.brew.sh/formula/ncview
    - https://packages.debian.org/sid/ncview
  summary:
    - >
      ncview is David W. Pierce's X11 visual browser for netCDF files, aimed at quick
      inspection rather than full analysis. The official page describes it as a way to
      get a push-button look at netCDF data, animate time slices, browse dimensions,
      inspect values, and change colormaps.
  timeline:
    - "{'date': '1993', 'event': 'Earliest copyright year listed in the ncview 1.75 README.'}"
    - "{'date': '1999-03-20', 'event': 'ncview 1.75 README date.'}"
    - "{'date': '2024-11-26', 'event': 'Official page says ncview 2.1.11 was updated.'}"
    - >
      {'date': '2026-07-01', 'event': 'Homebrew Formulae listed stable 2.1.11 and 670
      installs in the 365-day analytics window.'}
  usage:
    - >
      Package nerd usage is simple: install netCDF/X11 dependencies, run `ncview
      file.nc`, then scrub through dimensions or time steps to see whether a model or
      instrument output looks sane before doing heavier analysis in Python, NCO, CDO,
      Panoply, MATLAB, or domain-specific tooling.
    - >
      The official page's notes on missing values, units, long_name, title, add_offset,
      scale_factor, dimensional variables, and UDUNITS support explain why ncview works
      best on netCDF files that follow common metadata conventions.
related-packages:
  - id: brew:nco
    reason: >
      Use NCO to derive fields, subset, regrid, edit metadata, or otherwise transform
      netCDF data, then open the resulting files in Ncview for rapid visual inspection.
    rel: adjacent_workflow
    sources:
      - https://cirrus.ucsd.edu/ncview/
      - https://nco.sourceforge.net/
  - id: brew:cdo
    reason: >
      Use Climate Data Operators to process or analyze climate and forecast netCDF
      datasets with chainable CLI operators, then inspect those datasets visually with
      Ncview.
    rel: adjacent_workflow
    sources:
      - https://cirrus.ucsd.edu/ncview/
      - https://mpim-sw.gitlab-pages.dkrz.de/cdo/
category: science
