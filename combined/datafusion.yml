id: brew:datafusion
display-name: Apache DataFusion
homepage: https://arrow.apache.org/datafusion
repo: https://github.com/apache/datafusion
docs:
  - https://docs.rs/datafusion/latest/datafusion
  - https://datafusion.apache.org/
  - https://datafusion.apache.org/user-guide/cli/index.html
  - https://datafusion.apache.org/user-guide/introduction.html
config-file-location:
  unix: ~/.datafusionrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The official user guide lists active projects using DataFusion, including
      stream-processing engines, SQL query engines, lakehouse tooling, search and
      analytics systems, and language bindings. This makes DataFusion both a library
      dependency and a foundation for newer data systems.
  package-nerd-significance:
    - >
      DataFusion matters to package people because it packages a modern analytical query
      planner and execution engine as Rust crates and a CLI, sitting at the intersection
      of Apache Arrow, SQL engines, and embeddable database components.
  project-history:
    - >
      The official introduction says DataFusion originated as part of Apache Arrow and
      is now presented as Apache DataFusion with its own site, user guide, CLI
      documentation, subprojects, and release documentation. The project provides
      libraries and binaries for building database and analytic systems.
  related-projects:
    - >
      Related official projects include Apache Arrow, DataFusion Python, DataFusion
      Java, DataFusion Comet, and DataFusion Ballista.
  sources:
    - https://datafusion.apache.org/
    - https://datafusion.apache.org/user-guide/introduction.html
    - https://datafusion.apache.org/user-guide/cli/index.html
    - https://github.com/apache/datafusion
    - https://github.com/apache/datafusion/releases/tag/4.0.0
  summary:
    - >
      Apache DataFusion is an extensible Rust query engine built on Apache Arrow for
      SQL, DataFrame, and embedded analytic workloads.
  timeline:
    - >
      2021: The standalone apache/datafusion repository has 4.0.0 tag history after
      DataFusion originated in Apache Arrow.
    - >
      2026: Official documentation lists the 50.x through 55.x release series and
      related DataFusion subprojects.
  usage:
    - >
      Developers embed DataFusion as a Rust query engine, use its SQL and DataFrame
      APIs, or run `datafusion-cli` to query data formats such as CSV and Parquet from a
      command line.
related-packages:
  - id: brew:duckdb
    reason: >
      Choose DuckDB when you want an embeddable analytical database with a persistent
      single-file database and a feature-rich standalone SQL shell; choose DataFusion
      when building a highly extensible Rust query engine or custom data system.
    rel: alternative
    sources:
      - https://datafusion.apache.org/
      - https://datafusion.apache.org/blog/2023/08/05/datafusion_fast_grouping/
      - https://duckdb.org/docs/stable/clients/cli/overview
category: data
package-manager:
  brew: datafusion
  nix: datafusion-cli
package-manager-url: https://formulae.brew.sh/formula/datafusion
license: Apache-2.0
tags:
  - apache-arrow
  - cli
  - dataframe
  - query-engine
  - rust
  - sql
description: Apache Arrow DataFusion and Ballista query engines
executables:
  - datafusion-cli
provenance:
  formula: datafusion
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
