id: brew:ccusage
display-name: ccusage
homepage: https://github.com/ccusage/ccusage
repo: https://github.com/ccusage/ccusage
docs:
  - https://ccusage.com/guide
config-file-location:
  unix:
    - .ccusage/ccusage.json
    - ~/.claude/ccusage.json
    - ~/.config/claude/ccusage.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README highlights direct execution through npx, bunx, pnpm dlx, and
      Nix, plus a Homebrew package in the input facts. Its adoption is tied to the rise
      of agentic coding CLIs that store token and model usage locally.
  package-nerd-significance:
    - >
      ccusage is package-nerd significant as a fast-moving observability tool for local
      AI coding workflows. It turns scattered JSONL and state files from multiple CLIs
      into a packageable, scriptable cost and token accounting surface.
  project-history:
    - >
      The official guide says the original cc stood for Claude Code usage and now also
      fits Codex CLI usage. GitHub metadata shows the repository was created in May
      2025, and the package metadata describes ccusage as analyzing coding-agent CLI
      token usage and costs from local data.
    - >
      The project has moved quickly: official releases show the v20 series in 2026, and
      the docs emphasize all-local, read-only analysis with JSON and table output.
  related-projects:
    - Claude Code and Codex are core data sources described in the official guide.
    - >
      The README also lists OpenCode, Amp, Droid, Codebuff, Hermes Agent, pi-agent,
      Goose, OpenClaw, Kilo, Kimi, Qwen, GitHub Copilot CLI, and Gemini CLI as supported
      sources.
  sources:
    - https://api.github.com/repos/ryoppippi/ccusage
    - https://github.com/ryoppippi/ccusage
    - https://ccusage.com/guide
    - https://formulae.brew.sh/api/formula/ccusage.json
  summary:
    - >
      ccusage is a local CLI for analyzing token usage and estimated costs from
      coding-agent CLIs. It began as Claude Code usage analysis and expanded into
      unified reports for Claude Code, Codex, OpenCode, Amp, Droid, Codebuff, Hermes
      Agent, pi-agent, Goose, OpenClaw, Kilo, Kimi, Qwen, GitHub Copilot CLI, and Gemini
      CLI.
  timeline:
    - '2025: Official GitHub repository created.'
    - '2026: v20 series releases published.'
    - '2026: Official docs describe unified reports across many coding-agent CLI data sources.'
  usage:
    - >
      Users run commands such as ccusage daily, weekly, monthly, session, or
      source-focused commands like ccusage codex daily. Configuration can come from CLI
      flags, a custom config, environment variables, .ccusage/ccusage.json,
      ~/.config/claude/ccusage.json, or ~/.claude/ccusage.json.
related-packages:
  - id: cask:openusage
    reason: >
      Choose OpenUsage when you want Claude, Codex, Cursor, and other subscription
      limits presented in a native macOS menu-bar dashboard instead of primarily as
      terminal reports.
    rel: alternative
    sources:
      - https://www.openusage.ai/
      - https://github.com/robinebers/openusage
      - https://ccusage.com/guide
  - id: cask:codexbar
    reason: >
      Choose CodexBar when macOS menu-bar monitoring of coding-agent limits is more
      important than ccusage's cross-platform, JSON-oriented command-line analysis.
    rel: alternative
    sources:
      - https://codexbar.app/
      - https://ccusage.com/guide/json-output
category: ai
package-manager:
  brew: ccusage
  nix: ccusage
package-manager-url: https://formulae.brew.sh/formula/ccusage
license: MIT
tags:
  - ai
  - analytics
  - claude-code
  - cli
  - developer-tool
  - token-usage
description: CLI tool for analyzing Claude Code usage from local JSONL files
executables:
  - ccusage
  - generate-config-schema
provenance:
  formula: ccusage
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
