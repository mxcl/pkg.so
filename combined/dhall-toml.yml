id: brew:dhall-toml
display-name: dhall-toml
homepage: https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-toml
repo: https://github.com/dhall-lang/dhall-haskell
docs:
  - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-toml#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Compared with dhall-json, the official evidence for broad adoption is thin: the
      supplied package facts list Homebrew packaging only. That matches the package's
      own roadmap language, which presents it as a useful but less complete integration
      in the Dhall converter family.
  package-nerd-significance:
    - >
      dhall-toml is interesting mainly as a packaging signal: once a configuration
      language has a standard command-line compiler, package ecosystems tend to sprout
      format-specific bridge binaries for every configuration format with users. Here
      the bridge is real, but the source-backed history is modest.
  project-history:
    - >
      The dhall-haskell repository lists dhall-toml as one of its maintained packages.
      The package README says it provides a Dhall-to-TOML compiler, shows dhall-to-toml
      output, and includes a roadmap noting minimal dhall-to-toml and minimal
      toml-to-dhall support while schema inference and docs.dhall-lang.org documentation
      remain incomplete.
  related-projects:
    - >
      dhall-json is the mature JSON/YAML sibling; dhall-bash and dhall-lsp-server cover
      shell and editor workflows in the same dhall-haskell repository.
  sources:
    - https://github.com/dhall-lang/dhall-haskell
    - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-toml
    - https://docs.dhall-lang.org/howtos/How-to-integrate-Dhall.html
  summary:
    - >
      dhall-toml is the Dhall converter package for TOML. It occupies the same ecosystem
      slot as dhall-json, but for projects whose downstream tools expect TOML rather
      than JSON or YAML.
  timeline:
    - '2026: dhall-haskell lists dhall-toml among its package set.'
    - >
      2026: The dhall-toml README roadmap marks minimal dhall-to-toml and toml-to-dhall
      work while leaving schema inference and official docs unfinished.
  usage:
    - >
      The documented path is to pipe a Dhall record into dhall-to-toml and receive TOML
      key-value output. The companion toml-to-dhall command exists in the package facts
      and README roadmap, but the official README signals that TOML-to-Dhall schema
      inference is not complete.
related-packages:
  - id: brew:dhall
    reason: >
      Use the core Dhall package alongside dhall-toml to type-check, normalize, format,
      and otherwise work with the Dhall expressions being converted.
    rel: adjacent_workflow
    sources:
      - https://github.com/dhall-lang/dhall-haskell
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-toml
category: developer-tools
package-manager:
  brew: dhall-toml
package-manager-url: https://formulae.brew.sh/formula/dhall-toml
license: BSD-3-Clause
tags:
  - cli
  - configuration
  - converter
  - dhall
  - serialization
  - toml
description: Convert between Dhall and Toml
executables:
  - dhall-to-toml
  - toml-to-dhall
provenance:
  formula: dhall-toml
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
