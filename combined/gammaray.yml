id: brew:gammaray
display-name: GammaRay
homepage: https://www.kdab.com/software-technologies/developer-tools/gammaray/
repo: https://github.com/KDAB/GammaRay
docs:
  - https://docs.kdab.com/gammaray-manual/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GammaRay's adoption follows the Qt ecosystem: it is aimed at developers debugging
      Qt Widgets, Qt Quick, QGraphicsView, model/view, scene graph, state machine,
      translation, resource, and meta-object behavior. The input package facts show it
      packaged across many Linux distributions plus Homebrew and Nix.
  package-nerd-significance:
    - >
      GammaRay is package-nerd interesting because it is a GUI-heavy developer tool that
      must match Qt ABI and version details while also exposing a CLI entry point. It
      sits in the narrow but important class of distribution packages that are not
      libraries themselves, yet are tightly coupled to a large framework.
  project-history:
    - >
      KDAB's official product page and manual describe GammaRay as a Qt-aware debugger
      companion. Rather than operating at instruction level, it uses Qt's QObject
      introspection mechanisms and framework knowledge to visualize runtime state in
      terms familiar to Qt developers.
    - >
      The GitHub repository exposes GammaRay as an open-source project maintained by
      KDAB, with GPL licensing and commercial licensing available. Public GitHub
      releases show the project continuing through the 2.x and 3.x series, including
      GammaRay 3.0 in 2023 and 3.4 in 2026.
  related-projects:
    - Qt is the framework GammaRay introspects.
    - Qt Creator is documented as an integration point.
    - KDAB maintains GammaRay alongside other Qt and C++ developer tools.
  sources:
    - https://docs.kdab.com/gammaray-manual/latest/index.html
    - https://github.com/KDAB/GammaRay
    - https://github.com/KDAB/GammaRay/releases
    - https://www.kdab.com/software-technologies/developer-tools/gammaray/
  summary:
    - >
      GammaRay is KDAB's software introspection tool for Qt applications, designed to
      examine and manipulate application internals at runtime on workstations and
      embedded targets.
  timeline:
    - '2010s: GammaRay developed and released as a KDAB Qt introspection tool.'
    - '2020: v2.11.2 released on GitHub.'
    - '2023: GammaRay 3.0.0 released.'
    - '2024: GammaRay 3.1.0 released.'
    - '2026: GammaRay 3.4.0 released.'
  usage:
    - >
      Users launch or attach GammaRay to a Qt application, either locally or remotely,
      then inspect QObject trees, properties, slots, signals, signal-slot connections,
      scene graphs, layouts, resources, translations, timers, fonts, codecs, and other
      Qt internals. The manual also documents command-line operation, a graphical
      launcher, a client, and Qt Creator integration.
related-packages:
  - id: cask:qt-creator
    reason: >
      Qt Creator can host GammaRay's client and launch, attach to, or connect to
      inspected applications through the documented integration plug-in available with
      Qt Automotive Suite.
    rel: adjacent_workflow
    sources:
      - https://docs.kdab.com/gammaray-manual/latest/gammaray-qtcreator.html
      - https://doc.qt.io/qtcreator/
category: developer-tools
package-manager:
  apk: gammaray
  brew: gammaray
  debian: gammaray
  dnf: gammaray
  nix: gammaray
  pacman: gammaray
  ubuntu: gammaray
  zypper: gammaray-qt6
