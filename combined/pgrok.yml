id: brew:pgrok
display-name: pgrok
homepage: https://github.com/pgrok/pgrok
repo: https://github.com/pgrok/pgrok
docs:
  - https://github.com/pgrok/pgrok#readme
config-file-location:
  linux: ~/.config/pgrok/pgrok.yml
  macos: ~/Library/Application Support/pgrok/pgrok.yml
  windows: '%LOCALAPPDATA%\pgrok\pgrok.yml'
credentials-file-location:
  linux:
    - ~/.config/pgrok/pgrok.yml
    - ~/.pgrok/pgrok.yml
  macos:
    - ~/Library/Application Support/pgrok/pgrok.yml
    - ~/.pgrok/pgrok.yml
  windows: '%LOCALAPPDATA%\pgrok\pgrok.yml'
history:
  adoption-history:
    - >
      pgrok is distributed through Homebrew and Nix according to
      source_facts.package-manager. Its packaging supports straightforward installation
      of a self-hosted tunneling alternative on Unix-like systems.
  package-nerd-significance:
    - >
      pgrok packages the familiar ngrok-style developer tunnel as an open, self-hostable
      client-and-server system built on SSH remote port forwarding. It appeals to users
      who want control of the public endpoint and authentication infrastructure rather
      than dependence on a hosted tunneling vendor.
    - >
      Its combination of HTTP and raw TCP forwarding, multi-tenant operation,
      conventional YAML configuration, and package-manager availability makes it useful
      for development callbacks, demonstrations, and temporary exposure of services
      behind NAT.
  project-history:
    - >
      The pgrok project was created as a self-hosted, multi-tenant reverse-tunnel
      solution described by its maintainers as a "poor man's ngrok." Its design uses SSH
      remote port forwarding and includes both the public server and local client
      components.
  related-projects:
    - >
      pgrok is explicitly positioned as an alternative to ngrok. It builds its tunneling
      model on SSH remote port forwarding rather than inventing an unrelated transport.
  sources:
    - 'Official README: https://github.com/pgrok/pgrok#readme'
    - source_facts.package-manager
  summary:
    - >
      pgrok is a self-hosted HTTP and TCP reverse-tunneling system that exposes local
      services through a remotely deployed server using SSH port forwarding.
  timeline:
    - 'Public project era: Developed on GitHub as a self-hosted ngrok alternative.'
    - 'Package adoption: Distributed through Homebrew and Nix.'
  usage:
    - >
      An operator deploys `pgrokd` on a publicly reachable host and configures DNS and
      authentication. A client initializes `pgrok.yml` with a remote address, local
      forwarding address, and token, then runs `pgrok` or `pgrok http` to establish the
      tunnel.
    - >
      The token is stored as part of the general YAML configuration unless another path
      is selected; the official documentation does not identify a separate credentials
      file.
category: networking
package-manager:
  brew: pgrok
  nix: pgrok
package-manager-url: https://formulae.brew.sh/formula/pgrok
license: MIT
tags:
  - cli
  - http-tunnel
  - ngrok-alternative
  - reverse-tunnel
  - self-hosted
  - tcp-tunnel
  - tunneling
description: Poor man's ngrok, multi-tenant HTTP/TCP reverse tunnel solution
executables:
  - pgrok
provenance:
  formula: pgrok
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
