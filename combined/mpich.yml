id: brew:mpich
display-name: MPICH
homepage: https://www.mpich.org/
repo: https://github.com/pmodels/mpich
docs:
  - https://www.mpich.org/documentation/guides
  - https://www.mpich.org/documentation/manpages
  - https://github.com/pmodels/mpich/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is unusually central to MPICH's story. The project lists derivative or
      partner implementations and collaborators including Intel, HPE Cray, ParTec, Ohio
      State University/MVAPICH, Microsoft, INRIA, and TotalView, and its README says
      MPICH-derived vendor implementations have been deployed on many Top500 HPC
      systems. The ACM recognized MPICH with the 2024 ACM Software System Award, placing
      it among infrastructure projects with lasting impact.
  project-history:
    - >
      MPICH became one of the reference-grade MPI implementations for HPC users and
      implementers. The MPICH2 line began around 2001 to implement additional MPI-2
      features, and the project name returned to MPICH with the 3.0 release in November
      2012. Its README describes the implementation as providing all MPI functions and
      features required by the standard, with support for parallel-computing
      applications and a default build path using the CH4 device, OFI network module,
      and Hydra process management.
  sources:
    - https://formulae.brew.sh/formula/mpich
    - https://github.com/pmodels/mpich/blob/main/README.md
    - https://www.anl.gov/mcs/mpich-a-highperformance-portable-implementation-of-mpi
    - https://www.mpich.org/about/collaborators/
    - https://www.mpich.org/about/overview/
  summary:
    - >
      MPICH is a high-performance, portable implementation of the MPI Message Passing
      Interface standard from Argonne National Laboratory, with roots in the MPI
      standardization process. The project overview says development began in 1992 to
      give the MPI Forum implementation and usability feedback, and that the original
      system used the Chameleon portability layer, giving the name MPICH: MPI over
      CHameleon.
  usage:
    - >
      As a package, MPICH gives developers the compiler wrappers, runtime, libraries,
      and mpiexec launcher needed to build and run MPI programs on workstations,
      clusters, and supercomputing environments. Package-manager users often install it
      as the portable open-source MPI option alongside or instead of Open MPI, vendor
      MPI stacks, or site-provided MPI modules.
related-packages:
  - id: brew:open-mpi
    reason: >
      Choose Open MPI as an alternative production MPI implementation with its own
      modular component ecosystem; choose MPICH when software or cluster tooling expects
      the MPICH implementation or one of its derivative-compatible stacks.
    rel: alternative
    sources:
      - https://www.mpich.org/about/overview/
      - https://docs.open-mpi.org/en/main/history.html
      - https://docs.open-mpi.org/
  - id: brew:hdf5-mpi
    reason: >
      Use hdf5-mpi with an MPI implementation such as MPICH when an application needs
      Parallel HDF5 collective access to shared scientific data files.
    rel: adjacent_workflow
    sources:
      - https://www.mpich.org/about/overview/
      - https://support.hdfgroup.org/documentation/hdf5/latest/_intro_par_h_d_f5.html
category: science
