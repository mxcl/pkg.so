id: brew:diskus
display-name: diskus
homepage: https://github.com/sharkdp/diskus
repo: https://github.com/sharkdp/diskus
docs:
  - https://github.com/sharkdp/diskus
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through release packages, Arch, Void, Homebrew,
      MacPorts, Haiku, NixOS, and Cargo. That mix is typical for sharkdp-style Rust
      CLIs: useful as standalone binaries, but also easy for distribution maintainers to
      carry because the behavior is simple and the upstream packaging story is clear.
  package-nerd-significance:
    - >
      diskus is interesting because it deliberately resists becoming a full disk
      browser. Its package appeal is the opposite of feature accumulation: a fast,
      parallelized `du -sh` replacement that complements richer tools such as `dust`.
  project-history:
    - >
      The GitHub repository was created in November 2018, and release tags started the
      same month. Later releases continued through 2025, showing a small but maintained
      utility rather than a one-off experiment.
  related-projects:
    - >
      The upstream README compares diskus with `du`, `tin-summer`, and `dust`, and uses
      `hyperfine` for benchmark runs.
  sources:
    - https://github.com/sharkdp/diskus
    - https://api.github.com/repos/sharkdp/diskus
    - https://github.com/sharkdp/diskus/releases/tag/v0.3.0
    - https://github.com/sharkdp/diskus/releases/tag/v0.9.0
    - https://formulae.brew.sh/formula/diskus
  summary:
    - >
      diskus is a Rust command-line utility positioned as a minimal, fast alternative to
      `du -sh`. It computes the total size of the current directory and focuses on doing
      that one job quickly, with benchmark comparisons against `du` and other Rust
      disk-usage tools in the upstream README.
  timeline:
    - '2018-11: GitHub repository created'
    - '2018-11: early 0.3.x and 0.5.0 releases published'
    - '2025-12: v0.9.0 release published'
  usage:
    - >
      The usual workflow is simply running `diskus` in a directory to print a
      human-readable total and byte count. The README also documents disk-usage versus
      apparent-size behavior and directory counting semantics so users can reason about
      differences from `du`.
related-packages:
  - id: brew:dust
    reason: >
      Choose Dust when you need a visual hierarchy of the largest files and
      subdirectories; diskus intentionally reports a fast aggregate total instead.
    rel: alternative
    sources:
      - https://github.com/sharkdp/diskus#readme
      - https://github.com/bootandy/dust#readme
  - id: brew:hyperfine
    reason: >
      Use hyperfine to reproduce or extend diskus performance comparisons, since
      diskus's official benchmark commands invoke hyperfine directly.
    rel: adjacent_workflow
    sources:
      - https://github.com/sharkdp/diskus#readme
      - https://github.com/sharkdp/hyperfine
category: system
package-manager:
  apk: diskus
  brew: diskus
  dnf: diskus
  macports: diskus
  nix: diskus
  pacman: diskus
  scoop: extras/diskus
package-manager-url: https://formulae.brew.sh/formula/diskus
license: Apache-2.0 OR MIT
tags:
  - cli
  - disk-usage
  - du
  - filesystem
  - rust
description: Minimal, fast alternative to 'du -sh'
executables:
  - diskus
provenance:
  formula: diskus
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
