id: brew:jsonpp
display-name: jsonpp
homepage: https://jmhodges.github.io/jsonpp/
repo: https://github.com/jmhodges/jsonpp
docs:
  - https://jmhodges.github.io/jsonpp
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      jsonpp's adoption is modest but durable enough for a Homebrew formula and tagged
      GitHub releases. The README documents installation through `go get`, Homebrew, or
      copying a binary into `PATH`.
  package-nerd-significance:
    - >
      jsonpp is package-nerd useful because it is a tiny Go binary that does one common
      terminal job with minimal runtime baggage. It belongs to the family of formatter
      commands people install because they want fast readable output, not a full JSON
      processing language.
  project-history:
    - >
      John Hodges' jsonpp repository began with a 2011-08-22 commit titled "a working
      json pretty printer". The README says jsonpp was created after a friend working
      against large JSON APIs became tired of slow tooling, and that it later proved
      useful for parsing JSON log files.
    - >
      The project stayed narrowly focused on pretty printing. Its README documents a
      file and pipe workflow, an option for formatting previously pretty-printed JSON,
      and an environment variable named `JSONPP_INDENT` for changing indentation.
  related-projects:
    - >
      jsonpp sits near jsonlint, jq, Python's `json.tool`, and other command-line JSON
      formatting tools, but keeps its own role limited to pretty printing.
  sources:
    - https://api.github.com/repos/jmhodges/jsonpp
    - https://formulae.brew.sh/formula/jsonpp
    - https://github.com/jmhodges/jsonpp
    - https://github.com/jmhodges/jsonpp/commit/1564f8fd3a29fca50e735e78aa3298ce1bc9a972
    - https://github.com/jmhodges/jsonpp/releases/tag/1.3.0
    - https://github.com/jmhodges/jsonpp/releases/tag/v1.2.0
  summary:
    - >
      jsonpp is a fast command-line JSON pretty-printer written in Go. It is
      intentionally small: read JSON from a web response or file, format it for humans,
      and exit.
  timeline:
    - '2011-08-22: First public GitHub commit.'
    - '2013-07-03: v1.2.0 release published.'
    - '2016-10-13: v1.3.0 release published.'
  usage:
    - >
      The canonical examples are piping a web service response through `jsonpp`,
      formatting a JSON file from disk, and using `-s` when the input stream is one
      already formatted JSON object.
related-packages:
  - id: brew:jq
    reason: >
      Choose jq when you need to query or transform JSON as well as pretty-print it;
      jsonpp is smaller in scope and dedicated to formatting.
    rel: alternative
    sources:
      - https://github.com/jmhodges/jsonpp
      - https://jqlang.github.io/jq/manual/
  - id: brew:jsonfmt
    reason: >
      Choose jsonfmt for gofmt-style checking and in-place rewriting of JSON files;
      jsonpp is better suited to formatting files or piped output for immediate reading.
    rel: alternative
    sources:
      - https://github.com/jmhodges/jsonpp
      - https://github.com/caarlos0/jsonfmt
  - id: brew:jless
    reason: >
      Choose jless when large JSON or YAML documents need interactive navigation,
      search, and collapsing instead of a formatted stream written to standard output.
    rel: alternative
    sources:
      - https://github.com/jmhodges/jsonpp
      - https://jless.io/user-guide/
category: developer-tools
package-manager:
  brew: jsonpp
package-manager-url: https://formulae.brew.sh/formula/jsonpp
license: MIT
tags:
  - cli
  - formatter
  - json
  - pretty-printer
description: Command-line JSON pretty-printer
executables:
  - jsonpp
provenance:
  formula: jsonpp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
