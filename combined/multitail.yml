id: brew:multitail
display-name: MultiTail
homepage: https://vanheusden.com/multitail/
repo: https://github.com/folkertvanheusden/multitail
docs:
  - https://vanheusden.com/multitail
config-file-location:
  unix:
    - /etc/multitail.conf
    - ~/.multitailrc
credentials-file-location: null
history:
  project-history:
    - >
      The tool's practical history is tied to Unix system administration before
      centralized log dashboards became common. Its feature list grew around live
      incident work: regex filtering, color rules, highlighting, search across windows,
      hiding and merging panes, status lines, scrollback, labels, and example color
      schemes for services such as Apache, Postfix, Squid, Asterisk, Sendmail, Samba,
      Exim, tcpdump, BIND, MySQL logs, and firewall logs. Its project news page shows
      public releases at least as far back as the mid-2000s, with a stable 7.0.0 release
      announced in 2022.
  sources:
    - https://formulae.brew.sh/formula/multitail
    - https://github.com/folkertvanheusden/multitail
    - https://www.vanheusden.com/multitail/
    - https://www.vanheusden.com/multitail/features.html
  summary:
    - >
      MultiTail, by Folkert van Heusden, is a terminal log-monitoring program often
      summarized by its project page as "tail on steroids." It keeps the familiar
      purpose of `tail -f` but uses an ncurses interface to follow one or many files in
      separate terminal panes, merge multiple inputs into one view, monitor
      wildcard-selected log files, and display output from external commands.
  usage:
    - >
      In package managers, MultiTail occupies the small but durable niche between plain
      `tail`, `less`, `watch`, log colorizers, and full observability systems. It is
      packaged across Homebrew, MacPorts, Debian/Ubuntu, Fedora, Alpine, Nix, and
      openSUSE-style ecosystems because it remains useful on servers and SSH sessions
      where a single terminal is the whole interface.
related-packages:
  - id: brew:lnav
    reason: >
      Choose lnav when you need automatic log-format detection, chronological merging,
      structured analysis, and SQL queries; choose MultiTail when split live panes and
      explicitly configured color schemes are the priority.
    rel: alternative
    sources:
      - https://www.vanheusden.com/multitail/features.html
      - https://docs.lnav.org/en/latest/
category: system
package-manager:
  apk: multitail
  brew: multitail
  debian: multitail
  dnf: multitail
  macports: multitail
  nix: multitail
  ubuntu: multitail
  zypper: multitail
package-manager-url: https://formulae.brew.sh/formula/multitail
license: MIT
tags:
  - cli
  - logs
  - monitoring
  - ncurses
  - tail
  - terminal
description: Tail multiple files in one terminal simultaneously
executables:
  - multitail
provenance:
  formula: multitail
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
