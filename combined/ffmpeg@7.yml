id: brew:ffmpeg@7
display-name: FFmpeg 7
homepage: https://ffmpeg.org/
repo: https://git.ffmpeg.org/ffmpeg.git
docs:
  - https://ffmpeg.org/documentation.html
  - https://ffmpeg.org/ffmpeg.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned FFmpeg packaging is common because the project is both a CLI suite and a
      dependency base. Homebrew keeps ffmpeg@7 so users can choose a stable 7.x line
      while newer FFmpeg releases continue to land elsewhere in the package set.
  package-nerd-significance:
    - >
      ffmpeg@7 is the parallel-version bridge between older compatibility formulae and
      newer upstream lines. It gives maintainers a named target for staged migration and
      repeatable builds.
  project-history:
    - >
      FFmpeg ships command-line media tools and reusable libraries for codecs,
      containers, filters, devices, scaling, and resampling. The 7.1 branch was cut from
      master on 2024-09-24; Homebrew's ffmpeg@7 formula follows the 7.1.x source
      tarballs, including 7.1.5.
  related-projects:
    - >
      FFmpeg 4, FFmpeg 5, and FFmpeg 6 are older parallel formulae. FFMS2 5.1 later
      raised its minimum requirement to FFmpeg 7.1, showing how downstream projects
      track these release lines.
  sources:
    - https://ffmpeg.org/about.html
    - https://ffmpeg.org/download.html
    - https://ffmpeg.org/documentation.html
    - https://formulae.brew.sh/formula/ffmpeg@7
  summary:
    - >
      FFmpeg 7 in Homebrew tracks the FFmpeg 7.1 release line, providing a newer but
      still version-pinned multimedia stack for users not ready to follow an unpinned
      default FFmpeg.
  timeline:
    - '2024: FFmpeg 7.1 release branch cut from master.'
    - '2026: FFmpeg 7.1.5 released and packaged by Homebrew as ffmpeg@7.'
  usage:
    - >
      Users install ffmpeg@7 for the ffmpeg, ffprobe, and ffplay tools or for builds
      that need FFmpeg 7.x headers and libraries, especially when a workflow has been
      validated against the 7.1 branch.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose the unversioned formula when you want Homebrew's current FFmpeg line
      instead of retaining the 7.x ABI.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/ffmpeg
      - https://formulae.brew.sh/formula/ffmpeg@7
  - id: brew:ffmpeg-full
    reason: >
      Choose ffmpeg-full when broad optional codec and integration support is more
      important than the standard formula's smaller dependency set.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/ffmpeg
  - id: brew:ffms2
    reason: >
      FFMS2 builds indexed, frame-accurate media-access workflows on FFmpeg's demuxing
      and decoding libraries.
    rel: adjacent_workflow
    sources:
      - https://github.com/FFMS/ffms2
      - https://github.com/FFMS/ffms2/blob/master/doc/ffms2-api.md
      - https://formulae.brew.sh/formula/ffms2
category: media
