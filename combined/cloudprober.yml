id: brew:cloudprober
display-name: Cloudprober
homepage: https://cloudprober.org
repo: https://github.com/cloudprober/cloudprober
docs:
  - https://cloudprober.org/docs
  - https://github.com/cloudprober/cloudprober#readme
config-file-location:
  unix: /etc/cloudprober.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Cloudprober's adoption is strongest among operators who want self-hosted active or
      synthetic monitoring with Prometheus-style metrics and low deployment assumptions.
      Official materials mention production use and the Cloudprober Helm chart documents
      Kubernetes installation through GitHub Container Registry, while Homebrew and Nix
      packaging make the standalone binary convenient on developer and operator
      machines.
  package-nerd-significance:
    - >
      Cloudprober is package-nerd interesting because it is infrastructure software that
      stays useful as a single CLI/server binary: one package can serve laptop
      experiments, Raspberry Pi checks, Kubernetes deployments, and fleet monitoring.
      Its packaging also bridges old-school daemon-style monitoring and modern
      cloud-native distribution, with Homebrew/Nix formulae and an official Helm chart.
  project-history:
    - >
      Google's Open Source Blog described Cloudprober in March 2018 as black-box
      monitoring software that Google had open sourced the previous year. The project
      focused on probing systems and services from the outside and producing metrics
      from those probe results rather than relying only on internal application
      telemetry.
    - >
      Cloudprober's own about page says its original goal was discovering and alerting
      on Cloud Networking availability and performance problems, but that it was
      developed as a generic prober for many kinds of systems and services. The current
      project site carries that lineage forward with the tagline that it is open-source
      active monitoring built at Google and able to run from small devices to large
      fleets.
  related-projects:
    - >
      Cloudprober overlaps with black-box and synthetic monitoring tools, especially
      Prometheus Blackbox Exporter-style checks, hosted uptime services, and Kubernetes
      monitoring stacks. Its official Helm chart is the closest related packaging
      project, while its metrics output is commonly consumed by broader observability
      systems.
  sources:
    - https://cloudprober.org/
    - https://opensource.googleblog.com/2018/03/cloudprober-open-source-black-box.html
    - https://cloudprober.org/docs/about/
    - https://cloudprober.org/docs/overview/probe/
    - https://cloudprober.org/docs/overview/getting-started/
    - https://github.com/cloudprober/helm-charts
    - https://github.com/cloudprober/cloudprober/releases
  summary:
    - >
      Cloudprober is an open-source active monitoring and probing system originally
      built at Google. It runs scheduled probes against services and infrastructure,
      exports metrics, and helps operators detect user-visible failures before customers
      report them.
  timeline:
    - "2017: Google open sourced Cloudprober, according to Google's 2018 announcement."
    - >
      2018: Google Open Source Blog introduced Cloudprober publicly as black-box
      monitoring software.
    - >
      2023: Cloudprober docs described the project's origins in Cloud Networking
      availability and performance monitoring.
    - >
      2026: Cloudprober 0.14.x releases added web UI logging and run-once support across
      probe types.
  usage:
    - >
      Users configure Cloudprober to run HTTP, DNS, ping, TCP, UDP, browser, external,
      and other probes on a schedule, then consume the emitted metrics and alerts in
      their monitoring stack. The getting-started docs also note that running
      cloudprober with no arguments on Linux exposes a built-in sys_metrics probe at a
      local metrics endpoint.
related-packages:
  - id: brew:prometheus
    reason: >
      Configure Prometheus to scrape Cloudprober's default Prometheus-compatible metrics
      endpoint for storage, querying, dashboards, and alert evaluation.
    rel: adjacent_workflow
    sources:
      - https://cloudprober.org/docs/overview/getting-started/
      - https://prometheus.io/docs/introduction/overview/
category: networking
package-manager:
  brew: cloudprober
  nix: cloudprober
package-manager-url: https://formulae.brew.sh/formula/cloudprober
license: Apache-2.0
tags:
  - availability
  - cli
  - infrastructure
  - monitoring
  - network-probing
  - observability
description: Active monitoring software to detect failures before your customers do
executables:
  - cloudprober
provenance:
  formula: cloudprober
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
