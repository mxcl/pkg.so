id: brew:ggc
display-name: ggc
homepage: https://github.com/bmf-san/ggc
repo: https://github.com/bmf-san/ggc
docs:
  - https://github.com/bmf-san/ggc#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ggc/config.yaml
    - ~/.config/ggc/config.yaml
    - ~/.ggcconfig.yaml
  windows: '%APPDATA%\ggc\config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      ggc fits a familiar developer-tools niche: it does not replace Git, but wraps
      common Git actions in memorable verbs and offers a fuzzy finder for composing
      multi-step flows. The README contrasts it with raw git, lazygit, tig, and gitui by
      emphasizing that the same commands work both as one-shot shell commands and as
      interactive workflow steps.
  package-nerd-significance:
    - >
      For package-manager users, ggc is notable as a compact Go CLI distributed through
      Homebrew, Go install, and prebuilt binaries, with generated command documentation
      that keeps its interactive and non-interactive surfaces aligned.
  project-history:
    - >
      The bmf-san/ggc repository was created in June 2025. Its release history records
      v0.0.1 and the v1.0 series in August 2025, followed by later major-version
      releases as the project expanded its command registry, documentation site,
      recipes, configuration, aliases, and keybinding support.
  related-projects:
    - >
      The project positions itself alongside Git, lazygit, tig, and gitui while serving
      a different role: scriptable Git shortcuts plus workflow composition.
  sources:
    - https://api.github.com/repos/bmf-san/ggc
    - https://api.github.com/repos/bmf-san/ggc/releases
    - https://bmf-san.github.io/ggc/
    - https://formulae.brew.sh/formula/ggc
    - https://github.com/bmf-san/ggc
    - https://raw.githubusercontent.com/bmf-san/ggc/main/README.md
  summary:
    - >
      ggc is a Go-based Git helper that combines short, scriptable Git subcommands with
      an interactive searchable workflow builder.
  timeline:
    - '2025: The GitHub repository was created.'
    - '2025: v0.0.1 and v1.0.0 were published.'
    - '2026: v8 releases appeared in the repository release feed.'
  usage:
    - >
      Practitioners run commands such as `ggc status`, `ggc add`, `ggc commit`, and
      branch-management verbs directly, or launch `ggc` without arguments to search
      commands, queue steps, review the workflow, and execute the pipeline.
related-packages:
  - id: brew:git
    reason: >
      Git is the required underlying version-control engine: ggc wraps Git commands and
      explicitly falls back to raw Git for operations outside its shortcut set.
    rel: adjacent_workflow
    sources:
      - https://github.com/bmf-san/ggc
      - https://git-scm.com/docs
  - id: brew:lazygit
    reason: >
      Choose lazygit for an action-oriented full-screen Git TUI; choose ggc when the
      same shortcuts must also work non-interactively in scripts and CI.
    rel: alternative
    sources:
      - https://github.com/bmf-san/ggc
      - https://github.com/jesseduffield/lazygit
  - id: brew:gitui
    reason: >
      Choose GitUI for a fast interactive terminal workbench; choose ggc when searchable
      commands must also compose into reusable command-line workflows.
    rel: alternative
    sources:
      - https://github.com/bmf-san/ggc
      - https://github.com/gitui-org/gitui
  - id: brew:tig
    reason: >
      Choose Tig primarily for ncurses-based browsing of Git history and changes; choose
      ggc for write-oriented shortcuts and multi-step workflow execution.
    rel: alternative
    sources:
      - https://github.com/bmf-san/ggc
      - https://jonas.github.io/tig/
category: developer-tools
package-manager:
  brew: ggc
  macports: ggc
package-manager-url: https://formulae.brew.sh/formula/ggc
license: MIT
tags:
  - cli
  - developer-tools
  - git
  - go
  - terminal-ui
description: Modern Git CLI
executables:
  - ggc
provenance:
  formula: ggc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
