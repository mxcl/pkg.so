id: brew:cargo-mutants
display-name: cargo-mutants
homepage: https://mutants.rs/
repo: https://github.com/sourcefrog/cargo-mutants
docs:
  - https://mutants.rs/
  - https://mutants.rs/config-file.html
config-file-location:
  unix: .cargo/mutants.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The 1.0 release declared the tool useful across many Rust projects after workspace
      support was added. Later releases expanded its fit for real-world Rust development
      through parallel execution, Nextest integration, CI-oriented output, GitHub
      Actions annotations, configuration schemas, and broader platform support.
    - >
      Packaging recorded in source_facts.package-manager spans Homebrew, Debian, Ubuntu,
      and Nix, reflecting adoption beyond installation through Cargo alone.
  package-nerd-significance:
    - >
      cargo-mutants brings mutation testing into Cargo's command namespace and project
      conventions. For package maintainers, it tests whether a suite detects
      deliberately introduced behavioral changes rather than merely reporting line
      coverage, and it produces persistent outcomes that can be inspected locally or in
      CI.
  project-history:
    - >
      cargo-mutants began as a Rust mutation-testing tool that generates small source
      changes, builds each viable mutant, and runs tests to see whether the change is
      caught. Its first releases established scratch builds, outcome logs, timeouts,
      filtering, and Cargo-aware source discovery.
    - >
      Version 1.0 added multi-package workspace handling. Subsequent development added
      concurrent mutant execution, a checked-in `.cargo/mutants.toml` configuration
      file, book-style documentation, Nextest support, CI annotations, schemas,
      sharding, and a growing set of Rust mutation operators.
  related-projects:
    - Cargo provides the command and build/test workflow.
    - Rust is the source language being mutated.
    - Nextest is available as an alternative test runner.
  sources:
    - https://mutants.rs/
    - https://mutants.rs/changelog.html
    - https://mutants.rs/config-file.html
    - https://mutants.rs/how-it-works.html
    - source_facts.package-manager
  summary:
    - >
      cargo-mutants is a mutation-testing tool for Rust. It injects controlled source
      changes and runs the project's tests, classifying mutations as caught, missed,
      timed out, or unviable.
  timeline:
    - '2021: The first release appeared; version 0.1.0 followed on November 30.'
    - >
      2022: Version 1.0 added Rust workspace support; parallel mutation testing and
      project configuration followed later that year.
    - '2023: Most documentation moved to the dedicated mutants.rs book.'
    - '2025: Configuration gained a generated JSON Schema and selectable config-file paths.'
  usage:
    - >
      Developers normally run `cargo mutants` in a Cargo project. The tool first tests
      an unmodified baseline, copies the source into scratch build directories, applies
      mutants individually, and records results under `mutants.out`.
    - >
      Standard options can be stored in `.cargo/mutants.toml`, passed on the command
      line, or supplied through `CARGO_MUTANTS_` environment variables. The documented
      recommendation is to commit a configuration that lets contributors run the default
      command without extra arguments.
related-packages:
  - id: brew:cargo-nextest
    reason: >
      cargo-mutants can delegate each mutation's test run to Nextest with
      `--test-tool=nextest`, which is useful when the suite requires or runs faster
      under Nextest.
    rel: adjacent_workflow
    sources:
      - https://mutants.rs/changelog.html
      - https://nexte.st/docs/integrations/cargo-mutants/
  - id: brew:cargo-llvm-cov
    reason: >
      Use cargo-llvm-cov for execution coverage and cargo-mutants for the complementary
      question of whether tests detect injected behavioral changes.
    rel: adjacent_workflow
    sources:
      - https://nexte.st/docs/integrations/cargo-mutants/
      - https://github.com/taiki-e/cargo-llvm-cov#readme
category: developer-tools
package-manager:
  brew: cargo-mutants
  debian: cargo-mutants
  nix: cargo-mutants
  ubuntu: cargo-mutants
package-manager-url: https://formulae.brew.sh/formula/cargo-mutants
license: MIT
tags:
  - cargo
  - ci
  - cli
  - code-coverage
  - mutation-testing
  - nextest
  - rust
  - test-quality
description: Inject bugs and see if your tests catch them
executables:
  - cargo-mutants
provenance:
  formula: cargo-mutants
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
