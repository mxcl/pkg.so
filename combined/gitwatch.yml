id: brew:gitwatch
display-name: gitwatch
homepage: https://github.com/gitwatch/gitwatch
repo: https://github.com/gitwatch/gitwatch
docs:
  - https://github.com/gitwatch/gitwatch#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gitwatch attracted users who wanted automatic history for files that are not
      normally managed through explicit Git commits. The README names configuration
      files and document files as examples, especially when an application writes
      changes without a clear save or apply workflow.
    - >
      Package metadata in this batch shows Homebrew and Nix packaging, and the README
      documents additional community distribution through AUR and Docker. That is modest
      but real adoption for a niche automation script.
  package-nerd-significance:
    - >
      gitwatch is package-nerd interesting because it is tiny Unix automation rather
      than a platform. It exposes Git as a low-friction append-only history mechanism
      for arbitrary local state.
    - >
      The tool also illustrates the tradeoff that packagers like: one shell script plus
      standard utilities can cover a workflow that would otherwise invite a daemon,
      database, or bespoke sync service.
  project-history:
    - >
      The gitwatch repository was created on GitHub in 2012 and kept the project's scope
      deliberately small. The official README describes it as a Bash script for watching
      a file or folder and committing changes to a Git repository.
    - >
      Over time, the project added packaging and operating-system conveniences around
      that script. The README documents installation from source, bpkg, Arch AUR, NixOS,
      Docker, and user services for SysVInit and systemd, while keeping the central
      behavior as a long-running watch loop.
  related-projects:
    - Git provides the repository and commit machinery used by gitwatch.
    - inotify-tools provides the inotifywait watcher used on Linux.
    - fswatch and GNU coreutils are documented as macOS requirements.
    - systemd, SysVInit, Docker, bpkg, AUR, and NixOS are documented deployment surfaces.
  sources:
    - https://api.github.com/repos/gitwatch/gitwatch
    - https://formulae.brew.sh/formula/gitwatch
    - https://github.com/gitwatch/gitwatch
    - https://raw.githubusercontent.com/gitwatch/gitwatch/master/README.md
  summary:
    - >
      gitwatch is a small shell-script utility that watches a file or directory and
      automatically commits changes to an existing Git repository. Its history is the
      history of a practical automation wrapper: file-system notifications, a short
      delay, git add, git commit, and optional push.
  timeline:
    - '2012: The gitwatch repository is created on GitHub.'
    - '2020: The v0.1 tag appears in the repository tag history.'
    - >
      2021: The README table of contents records active documentation work around
      installation and service usage.
    - '2024: NixOS module instructions are documented for service-style deployments.'
  usage:
    - >
      Practitioners run gitwatch against a file or directory that already belongs to a
      Git repository. On Linux it uses inotifywait; on macOS the README points users to
      fswatch and coreutils through Homebrew.
    - >
      A typical use is personal or small-team backup of frequently edited notes,
      dotfiles, or generated configuration. gitwatch waits briefly after a change to
      avoid racing partial writes, commits the changed file or directory contents, and
      can push to a remote when configured.
related-packages:
  - id: brew:git
    reason: >
      Git provides the repositories, staging, commits, and optional pushes that gitwatch
      automates.
    rel: adjacent_workflow
    sources:
      - https://github.com/gitwatch/gitwatch#requirements
      - https://git-scm.com/docs/git
  - id: brew:inotify-tools
    reason: >
      On Linux, gitwatch invokes inotifywait from inotify-tools to detect changes before
      creating commits.
    rel: adjacent_workflow
    sources:
      - https://github.com/gitwatch/gitwatch#requirements
      - https://github.com/inotify-tools/inotify-tools
  - id: brew:fswatch
    reason: >
      On macOS, gitwatch uses fswatch in place of Linux inotifywait for recursive
      filesystem notifications.
    rel: adjacent_workflow
    sources:
      - https://github.com/gitwatch/gitwatch#notes-for-mac
      - https://emcrisostomo.github.io/fswatch/
category: developer-tools
package-manager:
  brew: gitwatch
  nix: gitwatch
package-manager-url: https://formulae.brew.sh/formula/gitwatch
license: GPL-3.0-or-later
tags:
  - automation
  - backup
  - cli
  - file-watching
  - git
description: Watch a file or folder and automatically commit changes to a git repo easily
executables:
  - gitwatch
provenance:
  formula: gitwatch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
