id: brew:dstack
display-name: dstack
homepage: https://dstack.ai/
repo: https://github.com/dstackai/dstack
docs:
  - https://dstack.ai/docs
config-file-location:
  unix:
    - .dstack.yml
    - ~/.dstack/config.yml
    - ~/.dstack/server/config.yml
credentials-file-location:
  unix:
    - ~/.dstack/config.yml
    - ~/.dstack/server/config.yml
history:
  adoption-history:
    - >
      Distribution is source-backed through PyPI and Homebrew. PyPI metadata records
      hundreds of releases and version 0.20.26 in June 2026, while the Homebrew formula
      uses the same release from the Python source distribution.
    - >
      Homebrew analytics are modest compared with general-purpose infrastructure tools,
      but the formula matters because it gives macOS and Linux users a package-manager
      path into a Python ML orchestration stack without starting from a source checkout.
  package-nerd-significance:
    - >
      dstack is notable as part of the modern wave of ML infrastructure CLIs that
      package cloud, Kubernetes, GPU scheduling, and developer workflow into a single
      local command. It sits in the same package-manager lane as tools that developers
      install before a full platform is available.
    - >
      For package nerds, its interesting wrinkle is the mix of Python packaging,
      Homebrew distribution, server configuration, repo-local YAML definitions, and
      rapidly changing AI accelerator support.
  project-history:
    - >
      The package trail starts on PyPI in September 2021, while the GitHub repository
      was created in January 2022. The project evolved from a reproducible ML workflow
      tool into a broader GPU orchestration system covering development environments,
      training tasks, services, fleets, volumes, and backends.
    - >
      By 2026 the README described dstack as a unified control plane for GPU
      provisioning and orchestration across GPU clouds, Kubernetes, and on-prem
      clusters, with support for NVIDIA, AMD, Google TPU, and Tenstorrent accelerators.
      The docs and README also show the project adapting to agentic workflows through
      dstack skills for tools such as Claude, Codex, and Cursor.
  related-projects:
    - Kubernetes is one of the supported orchestration backends.
    - PyPI is the upstream package distribution channel used by the Homebrew formula.
    - >
      Claude, Codex, and Cursor are named in the README as agent clients that can use
      dstack skills.
  sources:
    - https://github.com/dstackai/dstack
    - https://dstack.ai/docs
    - https://pypi.org/pypi/dstack/json
    - https://formulae.brew.sh/api/formula/dstack.json
  summary:
    - >
      dstack is an open-source control plane and CLI for provisioning and orchestrating
      GPU and AI workloads across cloud providers, Kubernetes, and on-premises machines.
      Its package-manager identity is a Python-distributed ML infrastructure tool that
      gives users a local `dstack` command, a server, and YAML workload definitions.
  timeline:
    - '2021-09: PyPI records the first dstack release artifacts.'
    - '2022-01: The current GitHub repository is created.'
    - '2025-12: dstack 0.20.0 release line emphasizes fleet-first UX and events.'
    - '2026-06: PyPI and Homebrew package dstack 0.20.26.'
  usage:
    - >
      Typical usage starts with installing the CLI or server, running `dstack server`,
      adding a project with a server URL and token, and applying YAML configurations
      from a repository. The official README documents `.dstack.yml` workload files and
      user or server configuration under `~/.dstack`.
    - >
      The package is aimed at teams that want one workflow for development environments,
      batch tasks, training jobs, services, and GPU fleet management across different
      compute backends.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl alongside dstack when operating a Kubernetes backend: dstack schedules
      AI workloads through kubeconfig contexts, while kubectl inspects and administers
      the underlying cluster resources.
    rel: adjacent_workflow
    sources:
      - https://dstack.ai/docs/concepts/backends/
      - https://kubernetes.io/docs/concepts/overview/kubectl/
category: ai
package-manager:
  brew: dstack
package-manager-url: https://formulae.brew.sh/formula/dstack
license: MPL-2.0
tags:
  - ai
  - cli
  - gpu
  - kubernetes
  - machine-learning
  - orchestration
  - training
description: ML workflow orchestration system designed for reproducibility and collaboration
executables:
  - dstack
provenance:
  formula: dstack
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
