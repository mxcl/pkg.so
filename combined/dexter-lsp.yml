id: brew:dexter-lsp
display-name: Dexter
homepage: https://github.com/remoteoss/dexter
repo: https://github.com/remoteoss/dexter
docs:
  - https://github.com/remoteoss/dexter/tree/main/docs
  - https://github.com/remoteoss/dexter#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dexter's README targets editor users directly, documenting setup for VS
      Code/Cursor, Neovim, Zed, Claude Code, Emacs, and Helix. The changelog also
      records Homebrew tap support and a Claude Code plugin/marketplace path during the
      0.6 and 0.7 release series.
  package-nerd-significance:
    - >
      Dexter is interesting to package nerds because it packages a language server as a
      standalone CLI: the same binary must work for editor stdio, explicit indexing, and
      distribution through Homebrew, mise, asdf, and editor integrations.
  project-history:
    - >
      The official changelog shows rapid public development in 2026, with early 0.x
      releases adding the core index, lookup, LSP command, hover, completion,
      references, rename, workspace symbols, formatting, and performance work.
  related-projects:
    - >
      Dexter sits alongside Elixir editor tooling, the Language Server Protocol,
      tree-sitter-based parsing, and formatters driven by project `.formatter.exs`
      files.
  sources:
    - https://github.com/remoteoss/dexter#readme
    - https://github.com/remoteoss/dexter/blob/main/CHANGELOG.md
    - https://github.com/remoteoss/dexter/tags
    - https://github.com/remoteoss/dexter/tree/main/docs
  summary:
    - >
      Dexter is a fast Elixir Language Server Protocol implementation aimed at large
      Elixir codebases, with indexing, navigation, references, rename, hover
      documentation, formatting, and editor integration.
  timeline:
    - '2026: early 0.1.x releases establish the index and lookup workflow.'
    - >
      2026: v0.5.0 adds broad LSP features including references, rename, formatting, and
      workspace symbols.
    - '2026: v0.6.0 adds Homebrew tap support and moves the index database into `.dexter/`.'
    - '2026: v0.7.x adds Claude Code integration and continued editor-facing features.'
  usage:
    - >
      Users run Dexter as `dexter lsp` from an editor or run indexing commands
      explicitly. The tool creates an index database under `.dexter/dexter.db`, which is
      project data rather than a user-editable config file.
related-packages:
  - id: brew:expert
    reason: >
      Choose Expert when you want the official Elixir language server; Dexter instead
      emphasizes fast indexing and navigation for large codebases.
    rel: alternative
    sources:
      - https://github.com/remoteoss/dexter#readme
      - https://expert-lsp.org/docs/installation/
      - https://github.com/expert-lsp/expert
  - id: brew:elixir-ls
    reason: >
      Choose ElixirLS for the established Elixir LSP and debugger ecosystem; Dexter is
      an alternative focused on a standalone high-performance index and CLI.
    rel: alternative
    sources:
      - https://github.com/remoteoss/dexter#readme
      - https://elixir-lsp.github.io/elixir-ls/
category: developer-tools
package-manager:
  brew: dexter-lsp
  nix: dexter
package-manager-url: https://formulae.brew.sh/formula/dexter-lsp
license: MIT
tags:
  - cli
  - code-navigation
  - editor-integration
  - elixir
  - language-server
  - lsp
description: Elixir LSP optimized for large codebases
executables:
  - dexter
provenance:
  formula: dexter-lsp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
