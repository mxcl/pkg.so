id: brew:libfreefare
display-name: libfreefare
homepage: https://github.com/nfc-tools/libfreefare
repo: https://github.com/nfc-tools/libfreefare
docs:
  - https://github.com/nfc-tools/libfreefare#readme
  - https://nfc-tools.github.io/projects/libfreefare
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libfreefare became useful where libnfc users wanted reusable C calls and bundled
      utilities instead of writing card-format details directly against the lower-level
      NFC stack. Its packaging across Homebrew, Debian, Ubuntu, Nix, and openSUSE
      reflects a small but durable audience around NFC labs, access-card tooling, and
      embedded experiments.
  package-nerd-significance:
    - >
      For package maintainers, libfreefare is a good example of a narrow
      hardware-adjacent library whose value comes from keeping protocol-specific card
      operations out of downstream applications. It also exposes the usual packaging
      concerns around libnfc ABI compatibility, OpenSSL linkage, and shipping
      command-line helpers with the library.
  project-history:
    - >
      The project sits in the nfc-tools family and is described by its project page as
      an API for RFID card manipulation on top of libnfc. Its README narrows that role
      to MIFARE card manipulation and lists libnfc, autotools, and OpenSSL as build
      dependencies for Unix-like systems.
    - >
      The public feature matrix documents support for common card families including
      FeliCa Lite, MIFARE Classic, MIFARE DESFire, MIFARE Ultralight, NTAG21x, and
      MIFARE Application Directory specifications. GitHub release metadata records
      libfreefare-0.4.0 on 2015-05-13.
  related-projects:
    - libnfc supplies the lower-level NFC reader interface used by libfreefare.
    - >
      Other nfc-tools projects such as mfoc, mfcuk, libllcp, and nfcutils occupy
      adjacent NFC tooling niches.
  sources:
    - >
      https://api.github.com/repos/nfc-tools/libfreefare/commits/530ccbc19309c8ab2b8160c2b57fefd747321d04
    - https://api.github.com/repos/nfc-tools/libfreefare/releases?per_page=100
    - https://github.com/nfc-tools/libfreefare
    - https://nfc-tools.github.io/projects/libfreefare/
  summary:
    - >
      libfreefare is the nfc-tools library that raises libnfc from raw NFC reader access
      to convenience APIs and command-line tools for MIFARE and related RFID/NFC tags.
  timeline:
    - >
      2013-12-04: The commit tagged libfreefare-0.4.0 updated the project changelog for
      the 0.4.0 release.
    - '2015-05-13: GitHub release metadata records libfreefare-0.4.0.'
    - >
      2015: The nfc-tools project page documents libfreefare as part of the nfc-tools
      project set.
  usage:
    - >
      The package installs a C library plus utilities for formatting, inspecting, and
      reading or writing NDEF data on MIFARE Classic, DESFire, and Ultralight cards. It
      is typically used with NFC readers supported by libnfc.
related-packages:
  - id: brew:libnfc
    reason: >
      libfreefare is explicitly implemented on top of libnfc, so libnfc supplies the
      reader and device-access layer required for libfreefare card workflows.
    rel: adjacent_workflow
    sources:
      - https://nfc-tools.github.io/projects/libfreefare/
      - https://github.com/nfc-tools/libnfc
category: system
package-manager:
  brew: libfreefare
  debian: libfreefare-bin
  nix: libfreefare
  ubuntu: libfreefare-bin
  zypper: libfreefare-devel
package-manager-url: https://formulae.brew.sh/formula/libfreefare
license: LGPL-3.0-or-later
