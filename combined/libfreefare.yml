  - mifare-desfire-format
  - mifare-desfire-info
  - mifare-desfire-read-ndef
  - mifare-desfire-write-ndef
  - mifare-ultralight-info
provenance:
  formula: libfreefare
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
