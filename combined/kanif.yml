id: brew:kanif
display-name: kanif
homepage: https://packages.debian.org/stable/net/kanif
repo: https://gitlab.inria.fr/taktuk/kanif
docs:
  - https://manpages.debian.org/testing/kanif/kanif.1.en.html
  - https://manpages.debian.org/testing/kanif/kanif.conf.5.en.html
  - https://taktuk.gitlabpages.inria.fr/kanif.html
config-file-location:
  unix:
    - ~/.kanif.conf
    - /etc/kanif.conf
    - /etc/c3.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The official TakTuk page credits Lucas Nussbaum for Debian testing and packaging
      help, placing kanif in the Debian packaging ecosystem for Unix cluster
      administrators. The input metadata records Homebrew, Debian, Ubuntu, and Nix
      packages, exposing the same niche tool through general-purpose package managers.
  package-nerd-significance:
    - >
      kanif is package-manager archaeology for pre-Kubernetes cluster operations: a thin
      Unix command suite, C3-style configuration paths, and no resident control plane.
      Its significance is less broad adoption than the way it preserves an HPC and
      lab-cluster administration style in modern package indexes.
  project-history:
    - >
      The official TakTuk project site describes kanif as a tool that combines
      conventions from C3, pdsh, and dsh while relying on TakTuk for adaptive
      large-scale remote execution. Its commands split the classic cluster-admin
      workflow into parallel shell execution, file broadcast, and file gathering.
    - >
      The official GitLab repository and ChangeLog preserve the release line through
      version 1.2.2, with entries for compatibility updates, file-reading fixes,
      sequential execution fixes, output handling, and the initial release.
  related-projects:
    - >
      TakTuk provides the large-scale remote execution engine underneath kanif. C3,
      pdsh, and dsh are the older cluster administration tools whose interface ideas
      kanif intentionally echoes.
  sources:
    - https://gitlab.inria.fr/taktuk/kanif
    - https://gitlab.inria.fr/taktuk/kanif/-/raw/master/ChangeLog
    - https://manpages.debian.org/testing/kanif/kanif.1.en.html
    - https://manpages.debian.org/testing/kanif/kanif.conf.5.en.html
    - https://taktuk.gitlabpages.inria.fr/kanif.html
    - source_facts.package-manager
  summary:
    - >
      kanif is a small cluster administration command suite built as a friendlier
      wrapper around TakTuk for parallel remote execution.
  timeline:
    - '1.0: Official ChangeLog marks the initial release.'
    - '1.1: Official ChangeLog says compatibility with TakTuk 3.3 and the -F option were added.'
    - '1.2: Official ChangeLog says compatibility with TakTuk 3.6 and above was added.'
    - >
      1.2.2: Official ChangeLog lists connection-loss, version-test, missing-file, and
      hostname-gathering fixes.
    - '2022: Debian manpage source metadata records kanif 1.2.2-4 source updated on 2022-07-28.'
  usage:
    - >
      kanif users run `kash` for the same command across nodes, `kaput` to copy files or
      directories to nodes, and `kaget` to gather remote files or directories. The tool
      expects TakTuk, Perl, and passwordless remote login such as SSH keys on the
      cluster nodes.
    - >
      The official man page documents C3-style configuration files searched at
      `$HOME/.kanif.conf`, `/etc/kanif.conf`, and `/etc/c3.conf`, and also allows
      command-line host lists for less static setups.
related-packages:
  - id: brew:taktuk
    reason: >
      TakTuk is the required large-scale remote-execution engine that Kanif wraps with a
      simpler cluster-administration interface.
    rel: adjacent_workflow
    sources:
      - https://taktuk.gitlabpages.inria.fr/kanif.html
      - https://taktuk.gitlabpages.inria.fr/documentation.html
  - id: brew:pdsh
    reason: >
      pdsh is an alternative parallel remote shell whose range, timeout, and
      output-handling conventions Kanif intentionally emulates, while Kanif delegates
      execution to TakTuk.
    rel: alternative
    sources:
      - https://taktuk.gitlabpages.inria.fr/kanif.html
      - https://github.com/chaos/pdsh#readme
category: system
package-manager:
  brew: kanif
  debian: kanif
  nix: kanif
  ubuntu: kanif
package-manager-url: https://formulae.brew.sh/formula/kanif
license: GPL-2.0-or-later
tags:
  - administration
  - cli
  - cluster-management
  - remote-execution
  - ssh
  - taktuk
description: Cluster management and administration tool
executables:
  - kaget
  - kanif
  - kaput
  - kash
provenance:
  formula: kanif
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
