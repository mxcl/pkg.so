id: brew:inspircd
display-name: InspIRCd
homepage: https://www.inspircd.org/
repo: https://github.com/inspircd/inspircd
docs:
  - https://docs.inspircd.org/
  - https://api.inspircd.org/
config-file-location:
  unix: /etc/inspircd
  windows: C:\Program Files\InspIRCd\conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site says InspIRCd is trusted by over 1000 networks and names
      HybridIRC, Snoonet, and Teranova as examples. That makes the package more than a
      library formula: it is infrastructure software used to run public or private IRC
      networks.
    - >
      Distribution is multi-channel. The README points to source builds,
      Debian/RHEL/Ubuntu/Windows packages, Docker images, and distribution packages;
      Homebrew packages the tagged source release for macOS and Unix-like users who want
      the daemon from a package manager.
  package-nerd-significance:
    - >
      InspIRCd matters to package nerds because it combines old Internet daemon
      packaging with modern C++ build, module, TLS, Windows, Docker, and
      service-management concerns. It is the kind of formula where version choice,
      config examples, init/service integration, and security notices matter.
    - >
      It also represents the IRCv3-era continuation of IRC server packaging: a server
      that keeps compatibility with long-standing IRC operations while adding
      capabilities such as WebSocket subprotocol support, richer logging, extended bans,
      SASL-related behavior, and services changes.
  project-history:
    - >
      The official website footer dates InspIRCd copyright back to 2002. The project
      describes itself as created from scratch to be stable, modern, and lightweight,
      with a fully modular design that lets operators choose which server features to
      load.
    - >
      The GitHub repository records the public source tree under the inspircd
      organization, while the README directs operators to tagged v4 releases for server
      deployments. The v4 documentation marks the 4.0.0 release in 2024 and documents
      major changes across cloaking, extended bans, logging, operators, regular
      expressions, services, spam protection, TLS, and module behavior.
  related-projects:
    - >
      InspIRCd is related to IRCd software, IRCv3 specifications, IRC services packages,
      Docker server images, TLS libraries, and other modular IRC server families used by
      network operators.
  sources:
    - https://docs.inspircd.org/4/change-log/
    - https://docs.inspircd.org/4/overview/
    - https://formulae.brew.sh/api/formula/inspircd.json
    - https://github.com/inspircd/inspircd
    - https://www.inspircd.org/
  summary:
    - >
      InspIRCd is a modular C++ IRC daemon and IRCv3 server for Unix-like and Windows
      systems. In package-manager terms, it is a long-running network daemon with a
      broad module surface, documented configuration, packaged releases, and an
      ecosystem around IRC server operations.
  timeline:
    - '2002: Official site copyright begins for InspIRCd contributors.'
    - '2012: GitHub repository created under inspircd/inspircd.'
    - '2024: InspIRCd 4.0.0 released with documented v4 changes and breaking-change guidance.'
    - '2026: v4.11.0 release documented in the v4 change log.'
  usage:
    - >
      The common use is running an IRC server with selected modules, server links,
      operator accounts, TLS, services integration, flood controls, and optional IRCv3
      capabilities. The documentation is organized around installation, configuration,
      commands, channel modes, extended bans, user modes, modules, exemptions, server
      notices, and change logs.
    - >
      The project warns that some distribution packages may carry modifications or lag
      security updates, which is unusually direct packaging guidance and important for
      daemon operators.
related-packages:
  - id: brew:ngircd
    reason: >
      Choose ngIRCd for a smaller, deliberately lightweight IRC server with a lean
      configuration file and a focus on small or private networks.
    rel: alternative
    sources:
      - https://www.inspircd.org/
      - https://ngircd.barton.de/
  - id: brew:ircd-hybrid
    reason: >
      Choose ircd-hybrid when EFnet lineage, its traditional high-performance IRCd
      design, or compatibility with the Hybrid ecosystem matters more than InspIRCd's
      broader module system.
    rel: alternative
    sources:
      - https://www.inspircd.org/
      - https://www.ircd-hybrid.org/
      - https://www.ircd-hybrid.org/history.html
category: networking
package-manager:
  apk: inspircd
  brew: inspircd
  debian: inspircd
  nix: inspircd
  ubuntu: inspircd
package-manager-url: https://formulae.brew.sh/formula/inspircd
license: GPL-2.0-only
tags:
  - c-plus-plus
  - cli
  - daemon
  - irc
  - ircv3
  - modules
  - networking
  - server
description: Modular C++ Internet Relay Chat daemon
executables:
  - inspircd
  - inspircd-testssl
provenance:
  formula: inspircd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
