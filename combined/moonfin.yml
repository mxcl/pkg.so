history:
  adoption-history:
    - >
      Moonfin expanded beyond a single desktop client into a shared Flutter codebase
      serving mobile, tablet, desktop, television, and web platforms. The project also
      maintains platform-specific television clients and a server-side companion plugin.
    - >
      Its support for both Jellyfin and Emby gives users a common client experience
      across two related self-hosted media-server ecosystems.
  package-nerd-significance:
    - >
      Moonfin is a useful example of a cross-platform media client packaged across
      desktop, mobile, smart-TV, and web environments from a largely shared codebase.
    - >
      For self-hosting enthusiasts, it provides an alternative client layer without
      replacing the underlying media server. Its optional Moonbase plugin extends the
      workflow with synchronized preferences and integration-backed features.
  project-history:
    - >
      Moonfin developed as a premium client for Jellyfin-compatible and Emby servers,
      using Flutter for its principal cross-platform client. Its scope grew to include
      playback, Live TV, downloads, casting, media requests, administration, books,
      music, and game-library integrations.
  related-projects:
    - Jellyfin and Emby are the primary media servers to which Moonfin connects.
    - >
      Moonbase is Moonfin's optional server plugin for synchronized settings and
      enhanced integrations.
  sources:
    - https://github.com/Moonfin-Client/Moonfin-Core/releases
    - https://github.com/Moonfin-Client/Moonfin-Core/wiki
    - https://moonfin.io/
  summary:
    - >
      Moonfin is a cross-platform client for streaming and managing media from Jellyfin
      and Emby servers.
  timeline:
    - >
      2.x era: Moonfin consolidated its mobile, desktop, television, and web experience
      around the Moonfin Core codebase.
    - >
      2026: The 2.8 release added Plex sign-in, a desktop mini-player, expanded
      administration, and additional playback features.
  usage:
    - >
      Users add a Jellyfin or Emby server, authenticate with a server account, and
      browse or play its libraries from a native Moonfin client.
    - >
      Common workflows include direct play or transcoded playback, Live TV, casting,
      offline downloads, media requests, and remote control. Some enhanced or
      synchronized features require the optional Moonbase server plugin.
related-packages:
  - id: cask:jellyfin
    reason: >
      Moonfin is a client for Jellyfin servers, so the Jellyfin package supplies the
      self-hosted media library, user accounts, streaming, and transcoding backend that
      Moonfin consumes.
    rel: adjacent_workflow
    sources:
      - https://github.com/Moonfin-Client/Moonfin-Core/wiki
      - https://jellyfin.org/docs/
