  - cli
  - code-quality
  - javascript
  - linter
  - static-analysis
description: AST-based pattern checker for JavaScript
executables:
  - eslint
provenance:
  formula: eslint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
