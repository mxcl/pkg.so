id: brew:eslint
display-name: ESLint
homepage: https://eslint.org
repo: https://github.com/eslint/eslint
docs:
  - https://eslint.org/docs/latest
config-file-location:
  unix:
    - PROJECT_ROOT/eslint.config.js
    - PROJECT_ROOT/eslint.config.mjs
    - PROJECT_ROOT/eslint.config.cjs
    - PROJECT_ROOT/eslint.config.ts
    - PROJECT_ROOT/eslint.config.mts
    - PROJECT_ROOT/eslint.config.cts
credentials-file-location: null
history:
  adoption-history:
    - >
      ESLint became a default dependency in JavaScript projects because it solved both
      style and correctness checks through one package ecosystem. The README links npm
      version and download badges, Open Collective funding, official docs, rules,
      contribution paths, and scheduled releases, reflecting a mature tool maintained as
      public infrastructure.
    - >
      The plugin and shareable-config model drove adoption beyond core JavaScript.
      React, TypeScript, framework, import-order, accessibility, security, and
      formatting-adjacent workflows all built on ESLint's rule API, which made `eslint`
      a central package in Node.js development even when a project used higher-level
      presets.
    - >
      The official release process also shaped adoption: the project publishes scheduled
      releases every two weeks and documents semver policies for rule, CLI, formatter,
      and API changes, which matters because lint rule updates can change build
      outcomes.
  package-nerd-significance:
    - >
      For package nerds, ESLint is a canonical example of a package ecosystem forming
      around a stable extension API: parser packages, plugins, config packages,
      formatter packages, and editor tooling all orbit the core package.
    - >
      It is also one of the clearest examples of why developer-tool packages need
      careful semver. A minor rule behavior change can create new warnings, a major
      config migration can affect nearly every JavaScript project, and the project's own
      semver policy documents those tradeoffs explicitly.
  project-history:
    - >
      ESLint appeared on npm in 2013 and reached 1.0.0 in July 2015. The official 1.0.0
      announcement described that milestone as the first major release after more than
      two years of work and as the stable base for future growth.
    - >
      The project differentiated itself from JSLint and JSHint by using Espree for
      parsing, evaluating code through an AST, and making every rule pluggable. That
      architecture made ESLint attractive both as an end-user CLI and as a library for
      editor integrations, shareable configs, and custom rule packages.
    - >
      Configuration has been one of ESLint's major historical arcs. The original
      eslintrc system accumulated multiple file formats and lookup rules; in 2022 the
      project introduced flat config, centered on `eslint.config.js`, as a simpler
      model. ESLint v9.0.0 made flat config the default and officially deprecated
      eslintrc.
  related-projects:
    - >
      ESLint is historically compared with JSLint and JSHint, and its ecosystem
      intersects with Espree, typescript-eslint, Babel parser integrations,
      eslint-plugin-react, Prettier, editor integrations, and shareable config packages.
  sources:
    - https://github.com/eslint/eslint
    - https://eslint.org/docs/latest
    - https://eslint.org/docs/latest/use/configure/configuration-files
    - https://eslint.org/blog/2015/07/eslint-1.0.0-released/
    - https://eslint.org/blog/2022/08/new-config-system-part-2/
    - https://eslint.org/blog/2024/04/eslint-v9.0.0-released/
    - https://www.npmjs.com/package/eslint
    - https://formulae.brew.sh/formula/eslint
  summary:
    - >
      ESLint is the dominant pluggable linter for ECMAScript and JavaScript projects.
      Its own README defines it as a tool for identifying and reporting patterns in
      JavaScript code, built around AST analysis and a runtime-pluggable rule model.
  timeline:
    - '2013: ESLint first appears on npm.'
    - '2015: ESLint 1.0.0 released as the first major release.'
    - '2022: Flat config introduced publicly as a new configuration system.'
    - '2024: ESLint 9.0.0 makes flat config the default and deprecates eslintrc.'
    - '2026: ESLint 10.x releases continue the scheduled release cadence.'
  usage:
    - >
      Typical package-manager usage starts with `npm init @eslint/config@latest` and
      then `npx eslint yourfile.js`, while Homebrew and OS packages provide an `eslint`
      executable for users who install developer tools outside a project-local npm
      workflow.
    - >
      Current ESLint configuration lives in a project-root flat config file named
      `eslint.config.js`, `eslint.config.mjs`, `eslint.config.cjs`, or a TypeScript
      variant with additional setup. Those files export configuration objects that set
      rules, plugins, language options, ignores, processors, and related linting
      behavior.
    - >
      ESLint is used directly in terminals and CI, indirectly through editor
      integrations, and as an API consumed by other tools. Its significance in
      package-manager culture comes from how often it appears in `devDependencies`,
      lockfiles, shareable configs, monorepo lint scripts, and pre-commit or CI quality
      gates.
related-packages:
  - id: brew:eslint_d
    reason: >
      Use eslint_d as an ESLint-compatible frontend when repeated editor or shell
      invocations need lower startup latency from a persistent background process.
    rel: adjacent_workflow
    sources:
      - https://github.com/mantoni/eslint_d.js#readme
      - https://eslint.org/docs/latest/use/integrations
  - id: brew:prettier
    reason: >
      Use Prettier alongside ESLint for deterministic formatting, with
      eslint-config-prettier disabling stylistic lint rules that would conflict with it.
    rel: adjacent_workflow
    sources:
      - https://prettier.io/docs/integrating-with-linters.html
      - https://prettier.io/docs/comparison.html
  - id: brew:standard
    reason: >
      Choose JavaScript Standard Style when you want an ESLint-based linter and fixer
      with a prescribed rule set and minimal configuration instead of maintaining a
      custom ESLint policy.
    rel: alternative
    sources:
      - https://standardjs.com/
      - https://eslint.org/docs/latest/use/configure/
category: developer-tools
package-manager:
  brew: eslint
  debian: eslint
  nix: eslint
  pacman: eslint
  ubuntu: eslint
package-manager-url: https://formulae.brew.sh/formula/eslint
license: MIT
tags:
