id: brew:burp
display-name: Burp
homepage: https://burp.grke.org/
repo: https://github.com/grke/burp
docs:
  - https://burp.grke.org/docs.html
  - https://burp.grke.org/docs/add-remove.html
  - https://burp.grke.org/docs/burp_ca.html
  - https://burp.grke.org/docs/manpage.html
  - https://burp.grke.org/docs/quickstart.html
  - https://burp.grke.org/docs/server-basics.html
config-file-location:
  linux:
    - /etc/burp/burp.conf
    - /etc/burp/burp-server.conf
    - /etc/burp/clientconfdir
  macos: /usr/local/etc/burp/burp.conf
  windows:
    - '%PROGRAMFILES%\Burp\burp.conf'
    - C:/Program Files/Burp/burp.conf
credentials-file-location:
  linux:
    - /etc/burp/clientconfdir/<client>
    - /etc/burp/ssl_cert-server.key
    - /etc/burp/ssl_cert-client.key
  macos: /usr/local/etc/burp/burp.conf
  windows:
    - '%PROGRAMFILES%\Burp\burp.conf'
    - C:/Program Files/Burp/burp.conf
history:
  adoption-history:
    - >
      Burp's adoption is strongest in distribution and operations contexts: the input
      metadata records packages in apk, Homebrew, Debian, MacPorts, Nix, and Ubuntu. Its
      continued package presence reflects a practical niche for administrators who want
      a self-hosted network backup server with mixed-platform clients rather than a
      purely local archive tool.
  package-nerd-significance:
    - >
      Burp is package-nerd-relevant because it preserves the classic Unix backup-daemon
      shape in an open-source package: config directories, certificate helpers, cron or
      scheduler-driven clients, restore commands, and distro service integration. It is
      a useful contrast with newer backup CLIs that prefer single-user repositories and
      SSH remotes.
  project-history:
    - >
      The upstream changelog shows Burp's early 1.0 series adding backup and restore
      counters, safer restores, Windows fixes, SSL support, checksummed manifests,
      verification, client-side file encryption, scheduling, email notifications, live
      status monitoring, and the `burp_ca` certificate helper during 2011. That history
      makes Burp visibly older than many single-binary backup tools and rooted in the
      traditional network backup-server model.
    - >
      Later Burp development continued through 2.x and 3.x branches with Windows
      tooling, protocol work, OpenSSL updates, systemd integration, sparse-index and
      restore fixes, access controls, and configuration hardening. The official
      quick-start still documents building a server from source, installing config
      files, running the daemon, and deploying Unix, Windows, and Homebrew-based macOS
      clients.
  related-projects:
    - >
      Burp is related to librsync, OpenSSL, zlib, uthash, cron/systemd scheduling, and
      network backup systems such as Bacula, Amanda, Bareos, BackupPC, and rdiff-backup.
  sources:
    - https://burp.grke.org/docs.html
    - https://github.com/grke/burp
    - https://raw.githubusercontent.com/grke/burp/master/CHANGELOG
    - https://raw.githubusercontent.com/grke/burp/master/README
    - source_facts.package-manager
  summary:
    - >
      Burp is a client-server network backup and restore program with Unix, macOS, and
      Windows client support. It is built around scheduled backups, SSL-protected
      client/server communication, restore and verify workflows, compression,
      librsync-style delta transfer, and long-running operational maintenance.
  timeline:
    - >
      2011-03: Burp 1.1.x changelog entries added verification, SSL, client-side
      encryption, scheduling, and email notifications.
    - >
      2011-06: Changelog entries added live status monitoring improvements and the
      burp_ca helper.
    - '2021: Burp 2.5.x became a stable/latest branch with Windows config-permission hardening.'
    - '2022: Burp 3.1.x removed protocol 2 and added OpenSSL 3 support.'
    - '2026-05-30: Burp 3.3.0 released as a new latest version.'
  usage:
    - >
      A Burp deployment usually has a central server using `/etc/burp/burp-server.conf`
      and per-client configuration under `/etc/burp/clientconfdir`, while clients run
      `burp -a b` for backup or poll on a schedule to see whether the server has work
      for them. The Windows installer and macOS Homebrew instructions make it usable
      across heterogeneous fleets.
related-packages:
  - id: brew:borgbackup
    reason: >
      Choose Borg for repository-oriented encrypted deduplicating archives over SSH;
      choose Burp when a central server must schedule and manage named clients across
      Unix, macOS, and Windows.
    rel: alternative
    sources:
      - https://burp.grke.org/docs/quickstart.html
      - https://borgbackup.readthedocs.io/en/stable/
  - id: brew:restic
    reason: >
      Choose restic for a compact secure repository and snapshot CLI; choose Burp when
      server-controlled client scheduling, per-client policies, and fleet monitoring are
      required.
    rel: alternative
    sources:
      - https://burp.grke.org/docs/manpage.html
      - https://restic.readthedocs.io/en/stable/010_introduction.html
category: system
package-manager:
  apk: burp
  brew: burp
  debian: burp
  macports: burp
  nix: burp
  ubuntu: burp
package-manager-url: https://formulae.brew.sh/formula/burp
license: AGPL-3.0-only WITH openvpn-openssl-exception
tags:
