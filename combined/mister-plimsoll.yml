history:
  adoption-history:
    - >
      Mister Plimsoll is distributed free in both a direct-download edition and a Mac
      App Store edition. The editions share the same monitoring and notification
      features except that Messages integration is unavailable in the sandboxed App
      Store build.
  package-nerd-significance:
    - >
      Mister Plimsoll turns disk-capacity policy into a small menu-bar service with
      per-volume thresholds, repeat limits, critical overrides, and automation-friendly
      webhooks. Its explicit treatment of APFS purgeable space and Time Machine usage is
      particularly relevant to macOS storage troubleshooting.
  project-history:
    - >
      Glenn Fleishman introduced Mister Plimsoll as a public beta in April 2026. The
      initial utility polled mounted volumes and warned when configurable thresholds
      were crossed. Version 1.0 followed in May, with later releases adding Notification
      Center delivery, webhooks, native SMTP, per-volume schedules, Time Machine
      context, and a Mac App Store edition.
    - >
      The name refers to the Plimsoll load line used to show the safe loading limit on a
      ship, applied metaphorically to storage volumes that are becoming too full.
  related-projects:
    - >
      The application can send alerts through macOS Notification Center, Messages,
      email, Pushover, or HTTPS webhooks to services such as Slack, Discord, Zapier,
      IFTTT, n8n, and Home Assistant.
    - >
      Its storage reporting distinguishes occupied space from APFS purgeable data and
      identifies Time Machine destinations and snapshot-related usage.
  sources:
    - 'Official changelog: https://misterplimsoll.app/changelog.html'
    - 'Official product page: https://misterplimsoll.app/'
    - 'Official usage guide: https://misterplimsoll.app/how-to-use.html'
  summary:
    - >
      Mister Plimsoll is Glenn Fleishman’s free macOS menu-bar utility for monitoring
      local storage volumes and issuing alerts when their used-space thresholds are
      exceeded.
  timeline:
    - 'April 2026: The first public beta was released.'
    - 'May 10, 2026: Version 1.0 became the first production release.'
    - 'May 16, 2026: Version 1.1 added Notification Center alerts, webhooks, and native SMTP.'
    - 'May 26, 2026: The first Mac App Store edition was released.'
  usage:
    - >
      Users select local volumes, set warning thresholds and daily alert caps, choose a
      checking interval, and optionally define a separate critical threshold. Alerts can
      appear on screen or through Notification Center, email, Messages, Pushover, and
      webhooks. SMTP passwords and Pushover user keys are stored in the macOS Keychain
      rather than a documented credentials file.
