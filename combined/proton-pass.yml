history:
  adoption-history:
    - >
      Proton described Pass as one of the services most frequently requested by its
      community. During 2024, the product expanded from browser and mobile clients to
      standalone applications on every major desktop platform.
  package-nerd-significance:
    - >
      Proton Pass combines conventional password-vault functions with Proton’s
      privacy-oriented identity tools, notably end-to-end encryption of every item field
      and integrated hide-my-email aliases. Its audited, partially open-source client
      ecosystem and cross-platform desktop packaging make it especially relevant to
      security-conscious package users.
  project-history:
    - >
      Proton Pass entered beta for selected Proton community members in April 2023 and
      launched globally on June 28, 2023 as a browser-extension and mobile password and
      identity manager. Proton published client source code and announced an independent
      Cure53 audit in July 2023.
    - >
      A Windows desktop application became generally available in February 2024. Native
      macOS and Linux applications followed on June 6, 2024, completing coverage across
      the major desktop platforms.
  related-projects:
    - Proton Mail
    - Proton VPN
    - Proton Drive
    - SimpleLogin
    - Proton Pass browser extensions
    - Proton Pass mobile apps
    - Proton Pass CLI
  sources:
    - 'Official desktop announcement: https://proton.me/blog/proton-pass-all-devices'
    - 'Official launch announcement: https://proton.me/blog/proton-pass-launch'
    - >
      Official open-source and audit announcement:
      https://proton.me/blog/pass-open-source-security-audit
    - 'Official support center: https://proton.me/support/pass'
  summary:
    - >
      Proton Pass is Proton’s end-to-end encrypted password and identity manager. It
      stores logins, passkeys, cards and secure notes, generates passwords, creates
      hide-my-email aliases, synchronizes vaults across devices and supports secure
      sharing.
  timeline:
    - '2023-04: Proton Pass entered beta'
    - '2023-06-28: Proton Pass launched globally'
    - '2023-07-19: Proton announced published source code and a Cure53 audit'
    - '2024-02: Windows desktop application became generally available'
    - '2024-06-06: macOS and Linux desktop applications launched'
  usage:
    - >
      Users sign in with a Proton Account and organize credentials and other sensitive
      records into encrypted vaults. The desktop client supports creating, editing,
      sharing and viewing item history, cross-device synchronization and offline vault
      access where the user’s plan supports it.
