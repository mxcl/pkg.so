id: brew:litecli
display-name: LiteCLI
homepage: https://litecli.com
repo: https://github.com/dbcli/litecli
docs:
  - https://litecli.com/
config-file-location:
  unix: ~/.config/litecli/config
  windows: ~\AppData\Local\dbcli\litecli\config
credentials-file-location: null
history:
  adoption-history:
    - >
      LiteCLI's adoption follows the dbcli pattern: Python users can install it with
      pip, macOS users can install it with Homebrew, and distro packages make it
      available on common Linux systems. Its appeal is strongest for developers who want
      SQLite exploration without a heavyweight GUI.
  package-nerd-significance:
    - >
      LiteCLI is significant because it packages a quality-of-life database shell as a
      small Python command. It is a good example of a package whose value is interactive
      ergonomics: prompt-toolkit-style completion, highlighting, formatting, and sane
      defaults wrapped around SQLite.
  project-history:
    - >
      LiteCLI was announced on January 3, 2019 by Amjith Ramanujam, the maintainer
      associated with the dbcli tools. The launch post described it as a user-friendly
      SQLite command-line client based on pgcli and mycli.
    - >
      The project matured as a Python CLI distributed through PyPI, Homebrew, and Linux
      package repositories. Its README and documentation focus on practical interactive
      use: opening a database, tabular output, completion, highlighting, and a generated
      configuration file.
  related-projects:
    - >
      Related projects include SQLite, pgcli, mycli, dbcli's shared helper libraries,
      Python prompt-toolkit, and other interactive SQL shells.
  sources:
    - https://github.com/dbcli/litecli
    - https://litecli.com/
    - https://litecli.com/config/
    - https://pypi.org/project/litecli/
    - https://www.pgcli.com/launching-litecli.html
  summary:
    - >
      LiteCLI is a command-line SQLite client from the dbcli family, designed around
      auto-completion, syntax highlighting, and a friendlier interactive SQL prompt. It
      brings the style popularized by pgcli and mycli to SQLite databases.
  timeline:
    - '2018-12-05: PyPI recorded an early 0.0.2 release.'
    - >
      2019-01-03: The LiteCLI launch post introduced the project as a SQLite client
      based on pgcli and mycli.
    - '2019-01-04: PyPI recorded version 1.0.0.'
    - '2026-01-31: PyPI recorded version 1.17.1.'
  usage:
    - >
      Users run `litecli DATABASE` or `litecli :memory:` to open a SQLite session. On
      first launch, LiteCLI creates a configuration file at `~/.config/litecli/config`
      on Unix-like systems and `~\AppData\Local\dbcli\litecli\config` on Windows.
related-packages:
  - id: brew:sqlite
    reason: >
      SQLite's official `sqlite3` shell is the smaller, upstream alternative when direct
      SQL and dot-commands are sufficient and LiteCLI's completion and highlighting are
      unnecessary.
    rel: alternative
    sources:
      - https://litecli.com/usage/
      - https://sqlite.org/cli.html
category: developer-tools
package-manager:
  apk: litecli
  brew: litecli
  debian: litecli
  dnf: litecli
  macports: litecli
  nix: litecli
  ubuntu: litecli
package-manager-url: https://formulae.brew.sh/formula/litecli
license: BSD-3-Clause
tags:
  - autocomplete
  - cli
  - database-client
  - sqlite
  - syntax-highlighting
description: CLI for SQLite Databases with auto-completion and syntax highlighting
executables:
  - litecli
provenance:
  formula: litecli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
