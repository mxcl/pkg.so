id: brew:chezmoi
display-name: chezmoi
homepage: https://chezmoi.io/
repo: https://github.com/twpayne/chezmoi
docs:
  - https://www.chezmoi.io/
  - https://www.chezmoi.io/reference/configuration-file
config-file-location:
  unix: ~/.config/chezmoi/chezmoi.$FORMAT
  windows: '%USERPROFILE%/.config/chezmoi/chezmoi.$FORMAT'
credentials-file-location: null
history:
  adoption-history:
    - >
      chezmoi's adoption follows the modern dotfiles wave: users increasingly keep
      shell, editor, Git, SSH-adjacent, and app configuration in version control while
      needing per-machine templates and secret integration.
    - >
      The input package metadata lists broad distribution through Homebrew, Alpine,
      Chocolatey, Fedora, MacPorts, Nix, Arch, Scoop, winget, and openSUSE. Homebrew
      reported 133,114 trailing-365-day installs at research time.
  package-nerd-significance:
    - >
      chezmoi is one of the notable package-manager-era dotfile tools because it turns a
      personal dotfiles repository into an installable, cross-platform command with
      clear config-file conventions.
    - >
      For package nerds, its attraction is pragmatic: one binary, many package managers,
      Git-friendly state, and enough security/template behavior to replace a pile of ad
      hoc shell scripts.
  project-history:
    - >
      The project is maintained by Tom Payne in the official twpayne/chezmoi repository
      and documents itself as a tool to manage dotfiles across multiple diverse
      machines, securely.
    - >
      The official release history records a 1.0.0 release on 2019-01-13, a 2.0.0
      release on 2021-03-17, and frequent 2.x releases continuing through 2.70.5 on
      2026-06-03.
  related-projects:
    - >
      chezmoi belongs to the dotfile-management family alongside Git-backed
      home-directory managers and package bootstrap scripts, but its official docs
      emphasize secure multi-machine dotfile management rather than a single-host
      symlink farm.
    - >
      It is frequently paired in practice with package managers, Git hosting, shells,
      editors, and password-manager tooling, because those are the systems whose
      configuration users tend to synchronize.
  sources:
    - https://www.chezmoi.io/
    - https://www.chezmoi.io/reference/configuration-file/
    - https://www.chezmoi.io/reference/release-history/
    - https://formulae.brew.sh/api/formula/chezmoi.json
  summary:
    - >
      chezmoi is a dotfile manager for keeping personal configuration synchronized
      across different machines, with explicit support for secure, templated, and
      machine-specific state.
  timeline:
    - '2019: chezmoi 1.0.0 released.'
    - '2021: chezmoi 2.0.0 released.'
    - '2026: chezmoi 2.70.5 released and tracked by Homebrew.'
  usage:
    - >
      The usual package-manager workflow is `brew install chezmoi`, then initialize a
      source state and apply it on each machine. The documented config file lives under
      the XDG config directory, with JSON, JSONC, TOML, or YAML formats.
    - >
      chezmoi is commonly used for repeatable workstation bootstrap, keeping a dotfiles
      repo portable while allowing host-specific templates and secure handling of
      private data.
related-packages:
  - id: brew:yadm
    reason: >
      Choose yadm for a thinner Git-like workflow with dotfile alternates and
      encryption; choose chezmoi for a single executable with richer templates, scripts,
      password-manager integration, and broader private-file controls.
    rel: alternative
    sources:
      - https://www.chezmoi.io/comparison-table/
      - https://yadm.io/docs/overview
category: developer-tools
package-manager:
  apk: chezmoi
  brew: chezmoi
  chocolatey: chezmoi
  dnf: chezmoi
  macports: chezmoi
  nix: chezmoi
  pacman: chezmoi
  scoop: main/chezmoi
  winget: twpayne.chezmoi
  zypper: chezmoi
package-manager-url: https://formulae.brew.sh/formula/chezmoi
license: MIT
tags:
  - cli
  - configuration-management
  - dotfiles
  - security
description: Manage your dotfiles across multiple diverse machines, securely
executables:
  - chezmoi
provenance:
  formula: chezmoi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
