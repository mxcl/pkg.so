id: brew:ncompress
display-name: ncompress
homepage: https://vapier.github.io/ncompress/
repo: https://github.com/vapier/ncompress
docs:
  - https://github.com/vapier/ncompress#readme
  - https://vapier.github.io/ncompress
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project was shaped by LZW patent history: upstream says patent concerns
      effectively halted development after the 1985 LZW patent grant, while later patent
      expiration made the code patent-free worldwide by mid-2004. Mike Frysinger
      restarted maintenance in 2006 to unify distribution patches, moved the repository
      to GitHub in 2015, and began the 5.x series in 2020.
  package-nerd-significance:
    - >
      ncompress is package-nerd archaeology that still matters. It preserves a
      public-domain Unix file format path, keeps old compressed outputs readable, and
      documents a surprisingly tangled history of Usenet releases, BSD import, patent
      chill, downstream patch drift, and later consolidation.
  project-history:
    - >
      The upstream history reconstructs compress from early Usenet-era releases: Spencer
      Thomas released compress 1.4 on net.sources on July 5, 1984, Joseph Orost released
      portable updates including 3.0 and 4.0 in 1985, and compress 4.0 was merged into
      BSD before 4.3BSD. The later ncompress name appears around Peter Jannesen's 4.2.x
      line in 1992, meant to reduce confusion among incompatible unofficial compress 4.x
      forks.
  related-projects:
    - compress, uncompress, gzip, LZW, BSD, historical .Z archives
  sources:
    - https://formulae.brew.sh/formula/ncompress
    - https://github.com/vapier/ncompress
    - https://vapier.github.io/ncompress/
  summary:
    - >
      ncompress packages the old Unix compress utility lineage: a fast, simple LZW
      compressor that produces .Z-style compressed files. Upstream is explicit about the
      tradeoff: compress is not the best compression ratio, but it is fast and
      historically became a de facto Unix standard.
  timeline:
    - 'July 5, 1984: compress 1.4 released on net.sources.'
    - 'January 3, 1985: compress 3.0 changes the compressed output format.'
    - 'August 1, 1985: compress 4.0 released, later becoming the foundation for many forks.'
    - 'September 1985: compress 4.0 merged into BSD before the 4.3BSD release.'
    - 'August-October 1992: ncompress 4.2.3 and 4.2.4 released.'
    - '2004: LZW counterpart patents expire worldwide.'
    - '2006: Mike Frysinger starts the ncompress maintenance project.'
    - '2021: ncompress 5.0 released.'
  usage:
    - >
      Package users install ncompress when they need compatibility with .Z archives or
      old scripts that expect compress, uncompress, zcat-style behavior. It is
      maintenance infrastructure rather than a modern compression recommendation: gzip,
      bzip2, xz, and zstd normally win for new data, while ncompress is for historical
      archives and interoperability.
related-packages:
  - id: brew:gzip
    reason: >
      Choose GNU Gzip for new broadly compatible compressed files; GNU developed it as a
      replacement for compress, and gunzip can still decode traditional compress files.
    rel: alternative
    sources:
      - https://www.gnu.org/software/gzip/
      - https://www.gnu.org/s/gzip/manual/html_node/Overview.html
      - https://vapier.github.io/ncompress/
  - id: brew:pigz
    reason: >
      Choose pigz when you need gzip-compatible output with parallel compression across
      multiple CPU cores rather than historical .Z output.
    rel: alternative
    sources:
      - https://zlib.net/pigz/
      - https://vapier.github.io/ncompress/
category: system
