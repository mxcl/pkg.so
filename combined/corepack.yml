id: brew:corepack
display-name: Corepack
homepage: https://github.com/nodejs/corepack
repo: https://github.com/nodejs/corepack
docs:
  - https://github.com/nodejs/corepack#readme
config-file-location:
  unix: package.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Corepack adoption followed the rise of package-manager pinning in JavaScript
      projects. Instead of relying on whatever yarn or pnpm binary happened to be
      globally installed, a project could declare the package manager in package.json
      and let Corepack fetch or activate a compatible version.
  package-nerd-significance:
    - >
      Corepack is package-nerd infrastructure about package managers themselves. It
      moved version pinning for Yarn and pnpm closer to the Node runtime and made the
      package.json packageManager field operational, which changed how distributions and
      CI images think about globally installed JavaScript package tools.
  project-history:
    - >
      The nodejs/corepack repository was created in 2020. Its README describes Corepack
      as a zero-runtime-dependency Node.js script that lets projects use Yarn, npm, and
      pnpm without installing each package manager globally.
    - >
      Corepack was distributed with Node.js from version 14.19.0 up to, but not
      including, 25.0.0. That bundling made it a notable piece of Node's
      package-management story even for users who never installed the standalone package
      directly.
  related-projects:
    - >
      Corepack is related to Node.js, npm, Yarn, pnpm, the package.json packageManager
      field, and JavaScript CI/runtime distribution images.
  sources:
    - https://github.com/nodejs/corepack
    - https://github.com/nodejs/corepack#readme
    - https://github.com/nodejs/corepack/releases
    - https://nodejs.org/api/corepack.html
    - https://nodejs.org/api/packages.html#packagemanager
  summary:
    - >
      Corepack is a Node.js package-manager shim and version manager that bridges a
      project to the package manager version it declares. It is most associated with
      Yarn and pnpm workflows, where the package.json packageManager field can select
      the expected tool and version.
  timeline:
    - '2020: nodejs/corepack repository created.'
    - >
      2021-2022: Corepack distributed with Node.js 14.19.0 and newer supported Node
      release lines.
    - >
      2026: v0.35.0 released upstream as Node.js no longer bundles Corepack starting
      with the Node 25 line.
  usage:
    - >
      Common usage is to enable Corepack, then run package-manager commands such as yarn
      install or pnpm install in a project. Corepack reads package.json metadata,
      resolves the intended package manager version, and manages cached package-manager
      binaries rather than acting as the dependency installer itself.
related-packages:
  - id: brew:pnpm
    reason: >
      Corepack can pin, obtain, and invoke pnpm for a project, while pnpm performs the
      actual dependency installation with its content-addressed store.
    rel: adjacent_workflow
    sources:
      - https://github.com/nodejs/corepack#readme
      - https://pnpm.io/installation#using-corepack
  - id: brew:yarn
    reason: >
      Corepack supplies project-selected Yarn binaries through its shims, while Yarn
      remains the package manager that resolves and installs the project's dependencies.
    rel: adjacent_workflow
    sources:
      - https://github.com/nodejs/corepack#readme
      - https://yarnpkg.com/corepack
  - id: brew:node
    reason: >
      Corepack runs on Node.js and was historically distributed with Node releases, so
      Node provides the runtime for Corepack-managed JavaScript package-manager
      workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/nodejs/corepack#readme
      - https://nodejs.org/download/release/v25.8.0/docs/api/corepack.html
category: developer-tools
package-manager:
  brew: corepack
  nix: corepack
  pacman: corepack
  zypper: corepack-default
package-manager-url: https://formulae.brew.sh/formula/corepack
license: MIT
tags:
  - cli
  - nodejs
  - npm
  - package-manager
  - pnpm
  - yarn
description: Package acting as bridge between Node projects and their package managers
executables:
  - corepack
provenance:
  formula: corepack
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
