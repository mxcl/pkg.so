id: brew:garble
display-name: garble
homepage: https://github.com/burrowers/garble
repo: https://github.com/burrowers/garble
docs:
  - https://github.com/burrowers/garble#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      garble was adopted by Go users who need to distribute binaries or private source
      while reducing the amount of source-level information left in compiled artifacts.
      Its release stream and packaging in Homebrew and Nix place it in the normal CLI
      toolchain workflow for Go developers.
  package-nerd-significance:
    - >
      garble is notable because it is a language-aware build wrapper rather than a
      post-build binary packer. For package maintainers, it sits at the intersection of
      Go module builds, compiler/linker behavior, reproducibility, cache directories,
      and environment-driven build selection through GOGARBLE.
  project-history:
    - >
      The public GitHub repository was created in December 2019, and its first GitHub
      release, v0.1.0, was published in March 2021. The README frames garble as a tool
      coupled to cmd/go so it can support Go modules and build caching.
  related-projects:
    - >
      garble is tightly related to the Go toolchain, cmd/go, Go modules, and the
      runtime/debug and linker metadata that it removes or transforms during obfuscated
      builds.
  sources:
    - https://api.github.com/repos/burrowers/garble
    - https://api.github.com/repos/burrowers/garble/releases?per_page=100
    - https://github.com/burrowers/garble
    - https://raw.githubusercontent.com/burrowers/garble/master/README.md
  summary:
    - >
      garble is a Go build obfuscator that wraps the Go toolchain to produce
      deterministic, reproducible obfuscated builds.
  timeline:
    - '2019: Public GitHub repository created.'
    - '2021: v0.1.0 released.'
    - '2026: v0.16.0 released, continuing the 0.x release line.'
  usage:
    - >
      The primary commands mirror Go commands, including garble build, garble test, and
      garble run. The tool also supports garble reverse for de-obfuscating text such as
      stack traces when the original source is available.
related-packages: []
category: security
