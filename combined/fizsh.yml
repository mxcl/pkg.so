id: brew:fizsh
display-name: fizsh
homepage: https://github.com/zsh-users/fizsh
repo: https://github.com/zsh-users/fizsh
docs:
  - https://github.com/zsh-users/fizsh#readme
config-file-location:
  unix: ~/.fizsh/.fizshrc
credentials-file-location: null
history:
  adoption-history:
    - >
      fizsh is a niche bridge project for zsh users who wanted some fish-like
      interactive affordances without switching shells. Its README documents source
      installation, unprivileged home-directory installation, SourceForge Debian
      packages, Debian and Ubuntu package installation, and an Arch AUR package.
  package-nerd-significance:
    - >
      fizsh is historically interesting because it packages a shell user-experience
      layer rather than a full shell: it sits on top of zsh while borrowing ideas
      associated with fish, which makes it a small but clear example of
      cross-pollination between Unix shell communities.
  project-history:
    - >
      The current GitHub repository was created in 2011 under zsh-users. Its tags show a
      1.0.0 release in October 2011 and a 1.0.9 tag in August 2017, with earlier 0.0.1
      tags preserved in the repository.
  related-projects:
    - >
      Related projects include zsh, fish shell, zsh-users plugins, shell prompt
      frameworks, and command-history search tools.
  sources:
    - https://github.com/zsh-users/fizsh
    - https://github.com/zsh-users/fizsh/tags
    - http://sourceforge.net/projects/fizsh
  summary:
    - >
      fizsh, the Friendly Interactive ZSHell, is a front end for zsh that adds
      fish-inspired interactive syntax highlighting, history search, and a compact
      informative prompt.
  timeline:
    - '2011: GitHub repository created.'
    - '2011: v1.0.0 tag created.'
    - '2017: v1.0.9 tag created.'
    - '2022: Repository last pushed according to GitHub metadata.'
  usage:
    - >
      After installation, users run `fizsh` instead of invoking zsh directly. The
      wrapper starts an interactive zsh environment with fizsh's highlighting, history
      search, and prompt behavior configured.
related-packages:
  - id: brew:fish
    reason: >
      Choose fish when you want fish's interactive features in a standalone shell rather
      than a compatibility layer running on Zsh.
    rel: alternative
    sources:
      - https://github.com/zsh-users/fizsh#readme
      - https://fishshell.com/docs/current/
  - id: brew:zsh
    reason: >
      fizsh is a front end to Zsh, so Zsh is the underlying shell and the direct choice
      when you want an unmodified, fully configurable Zsh environment.
    rel: adjacent_workflow
    sources:
      - https://github.com/zsh-users/fizsh#readme
      - https://www.zsh.org/
category: developer-tools
package-manager:
  brew: fizsh
  debian: fizsh
  ubuntu: fizsh
package-manager-url: https://formulae.brew.sh/formula/fizsh
license: BSD-3-Clause
tags:
  - cli
  - history-search
  - prompt
  - shell
  - zsh
description: Fish-like front end for ZSH
executables:
  - fizsh
provenance:
  formula: fizsh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
