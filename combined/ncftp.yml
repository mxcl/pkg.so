id: brew:ncftp
display-name: NcFTP
homepage: https://www.ncftp.com/
repo: null
docs:
  - https://www.ncftp.com/
config-file-location:
  unix:
    - ~/.ncftp/prefs
    - ~/.ncftp/firewall
credentials-file-location:
  unix: ~/.ncftp/bookmarks
history:
  adoption-history:
    - >
      NcFTP's adoption comes from longevity and scripting utility more than novelty. It
      ships not just `ncftp`, but also `ncftpget`, `ncftpput`, `ncftpls`, `ncftpbatch`,
      and `ncftpspooler`, which made it attractive for unattended FTP workflows. The
      Homebrew formula API response consulted for this July 2026 batch reported 105
      install-on-request events in 30 days and 2,716 in 365 days.
  package-nerd-significance:
    - >
      NcFTP matters as the pragmatic FTP survivor: useful when old appliances, mirrors,
      mainframes, or vendor dropboxes still speak FTP. It is less about fashionable
      networking and more about reliable edge-case behavior around recursive transfers,
      resume, timestamps, passive-mode fallback, batch queues, and strange server
      implementations.
  project-history:
    - >
      The download page preserves the project's three main eras: 1.x from 1991, 2.x from
      1995, and 3.x from 1998. The 3.0.0 changelog entry on 2000-03-19 marks a major
      modernized line with the Clarified Artistic License, native Win32 support, HTML
      manual pages, shell utilities, transfer logging, firewall configuration support,
      and the v3 preference file.
  related-projects:
    - FTP, RFC 959, LibNcFTP, NcFTPd, lftp, wget
  sources:
    - https://formulae.brew.sh/api/formula/ncftp.json
    - https://www.ncftp.com/download/
    - https://www.ncftp.com/ncftp/
    - https://www.ncftp.com/ncftp/doc/changelog.html
    - https://www.ncftp.com/ncftp/doc/ncftpget.html
    - https://www.ncftp.com/ncftp/doc/ncftpput.html
  summary:
    - >
      NcFTP is one of the older surviving enhanced FTP clients. The official client page
      says it has been in service on Unix systems since 1991 and positions it as a
      popular alternative to `/usr/bin/ftp` with ease-of-use and performance
      improvements.
  timeline:
    - '1991: NcFTP 1.x era began on Unix systems.'
    - '1995: NcFTP 2.x era began.'
    - '1998: NcFTP 3.x era began.'
    - '2000-03-19: 3.0.0 documented the v3 licensing, Win32, utility, and preference changes.'
    - '2025-04-23: 3.3.0 fixed configure-script checks for newer GCC.'
  usage:
    - >
      Interactive use centers on bookmarked FTP sessions, resuming transfers,
      passive-mode handling, logging, and friendlier prompts than the classic FTP
      client. The utility programs are the package-nerd core: `ncftpget` downloads files
      or recursive trees from scripts, `ncftpput` uploads files or directory trees, both
      can use login config files, debug logs, redial counts, passive/PORT selection,
      background batch jobs, and raw FTP commands for awkward servers.
related-packages:
  - id: brew:lftp
    reason: >
      Choose lftp when you need SFTP, FTPS, HTTP-family protocols, queues, or
      bidirectional mirroring; choose NcFTP for its focused traditional-FTP browser and
      dedicated get, put, batch, and spooler tools.
    rel: alternative
    sources:
      - https://www.ncftp.com/ncftp/
      - https://www.ncftp.com/ncftp/doc/faq.html
      - https://lftp.yar.ru/features.html
category: networking
