id: brew:cpuid
display-name: cpuid
homepage: https://github.com/klauspost/cpuid
repo: https://github.com/klauspost/cpuid
docs:
  - https://github.com/klauspost/cpuid#readme
  - https://pkg.go.dev/github.com/klauspost/cpuid/v2
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cpuid fits Go module distribution as a library imported with
      github.com/klauspost/cpuid/v2, while also offering an installable cpuid binary via
      go install, GitHub release binaries, and Homebrew for macOS/Linux users.
  package-nerd-significance:
    - >
      For packagers and Go maintainers, cpuid is notable because it combines a Go module
      API with a packaged diagnostic binary, avoids external C code, and exposes runtime
      feature detection useful to compression, crypto, and other optimized Go libraries.
  project-history:
    - >
      The official GitHub repository was created in 2015. The README describes startup
      CPU detection cached for fast access during a Go program's lifetime, with support
      for x86/x64, ARM/ARM64, and RISC-V.
  related-projects:
    - >
      pkg.go.dev provides generated API documentation for the
      github.com/klauspost/cpuid/v2 Go module.
  sources:
    - https://github.com/klauspost/cpuid
    - https://raw.githubusercontent.com/klauspost/cpuid/master/README.md
    - https://pkg.go.dev/github.com/klauspost/cpuid/v2
    - https://api.github.com/repos/klauspost/cpuid
    - https://github.com/klauspost/cpuid/releases/tag/v2.3.0
  summary:
    - >
      cpuid is a Go package and command-line tool for detecting CPU information and CPU
      feature flags at runtime without cgo.
  timeline:
    - '2015: The klauspost/cpuid repository was created.'
    - '2024: v2.2.8 and v2.2.9 releases were published.'
    - '2025: v2.2.10, v2.2.11, and v2.3.0 releases were published.'
  usage:
    - >
      Go programs use the shared cpuid.CPU value to inspect brand, cores, cache,
      frequency, and feature sets, then call Supports, Has, or HasAll to gate optimized
      code paths. The command-line binary prints CPU details and supports JSON output.
related-packages:
  - id: brew:cpu_features
    reason: >
      Choose cpu_features when the same runtime instruction-set detection is needed from
      a portable C99 library rather than a Go package.
    rel: alternative
    sources:
      - https://github.com/klauspost/cpuid#readme
      - https://github.com/google/cpu_features#readme
category: system
package-manager:
  brew: cpuid
  debian: cpuid
  dnf: cpuid
  macports: cpuid
  nix: cpuid
  ubuntu: cpuid
  zypper: cpuid
package-manager-url: https://formulae.brew.sh/formula/cpuid
license: MIT
tags:
  - cli
  - cpu
  - cpu-features
  - go
  - hardware-detection
  - library
description: CPU feature identification for Go
executables:
  - cpuid
provenance:
  formula: cpuid
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
