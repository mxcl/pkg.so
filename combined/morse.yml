history:
  sources:
    - http://www.catb.org/~esr/morse/
    - https://formulae.brew.sh/formula/morse
    - https://gitlab.com/esr/morse-classic
  summary:
    - >
      morse, packaged from the morse-classic project, is a command-line Morse-code
      trainer and QSO generator associated with Eric S. Raymond's CATB software pages.
      The resource page describes it as a training program for aspiring radio amateurs
      that can generate random tests or simulated QSOs resembling ARRL test material,
      with options for varying the training method.
  usage:
    - >
      The tool's practical use is deliberately old-school Unix: one mode reads text from
      standard input and renders it as Morse-code beeps, while the QSO generator creates
      practice copy material. Its package-manager niche is a compact ham-radio and Morse
      training utility, distributed in Homebrew alongside Debian and Ubuntu packages
      under the plain morse name.
