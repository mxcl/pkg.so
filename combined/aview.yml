id: brew:aview
display-name: Aview
homepage: https://aa-project.sourceforge.net/
repo: https://sourceforge.net/p/aa-project/code-git
docs:
  - https://aa-project.sourceforge.net/aview
  - https://sourceforge.net/p/aa-project/code-git/ci/master/tree/aview/NEWS
  - https://sourceforge.net/p/aa-project/code-git/ci/master/tree/aview/README
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Aview's official page records version 1.2 in 1998 and a 1.3.0 release candidate in
      2001. The batch input shows it still packaged in Homebrew, Debian, and Ubuntu,
      which is typical for compact terminal media tools that remain useful and fun
      despite little upstream churn.
    - >
      Its adoption is bound to aalib and terminal culture: users install it less as a
      modern image viewer and more as a small demonstration that terminals, curses, and
      text-mode displays can still render recognisable graphics.
  package-nerd-significance:
    - >
      Aview is a durable example of late-1990s terminal multimedia: tiny, portable, half
      demo-scene joke and half useful Unix command. It is kept in package managers
      because it exercises aalib, charms terminal users, and still does one unusual
      thing cleanly.
    - >
      The package also demonstrates the Unix habit of composing converters: Aview itself
      prefers simple PNM input, while `asciiview` delegates broader image decoding to
      Netpbm or ImageMagick.
  project-history:
    - >
      Aview grew out of Jan Hubicka's experiments with rendering images as ASCII art on
      old Hercules secondary monitors. The README describes an early attempt to convert
      a Linux users group penguin logo with Netpbm tools, dissatisfaction with the
      result, and a new converter based on font bitmaps.
    - >
      The project became part of the broader AA-Project, whose intentionally playful
      goals included porting important software to AA-lib and making AA-lib available on
      many platforms. Aview packaged that rendering idea into a practical browser for
      PNM images, with companion tools such as `asciiview` and `aaflip`.
  related-projects:
    - AA-lib is the rendering library behind Aview.
    - Netpbm and ImageMagick are used by the Unix `asciiview` script for image conversion.
    - >
      XaoS is mentioned in the README as part of the author's path toward ASCII-art
      Mandelbrot rendering.
  sources:
    - https://aa-project.sourceforge.net/aview/
    - https://sourceforge.net/p/aa-project/code-git/ci/master/tree/aview/NEWS
    - https://sourceforge.net/p/aa-project/code-git/ci/master/tree/aview/README
    - source_facts.package-manager
  summary:
    - >
      Aview is the AA-Project's terminal-oriented ASCII-art image browser and animation
      player. It displays PNM images and FLI/FLC animations through aalib targets such
      as curses, slang, stdio, X11, gpm, Linux console, and DOS video modes.
  timeline:
    - '1997: Official Aview page copyright by Jan Hubicka.'
    - '1998: Version 1.2 released.'
    - '2001: Version 1.3.0 release candidate 1 released.'
    - >
      Post-1.2: NEWS records automake conversion, bug fixes, glibc2 build fixes, and
      stdin support.
  usage:
    - >
      `aview` opens PBM, PGM, PPM, or PNM images directly. On Unix, `asciiview` wraps
      conversion through Netpbm or ImageMagick so users can browse many image formats
      transparently, while `aaflip` plays FLI/FLC animations.
    - >
      The official README highlights contrast, brightness, gamma control, zooming,
      multiple dithering modes, inversion, and output to text-like formats. That makes
      Aview useful both as a viewer and as a way to generate ASCII-art representations.
related-packages:
  - id: brew:aalib
    reason: >
      AA-lib is Aview's documented rendering engine and is useful when developing or
      running other applications that target ASCII-art displays.
    rel: adjacent_workflow
    sources:
      - https://aa-project.sourceforge.net/aview/
      - https://aa-project.sourceforge.net/aalib/
  - id: brew:netpbm
    reason: >
      Netpbm is Aview's preferred documented conversion backend, allowing `asciiview` to
      turn many image formats into the PNM input Aview renders.
    rel: adjacent_workflow
    sources:
      - https://aa-project.sourceforge.net/aview/
      - https://netpbm.sourceforge.net/doc/
  - id: brew:imagemagick
    reason: >
      ImageMagick is Aview's documented alternative conversion backend when images must
      be converted transparently to PNM before terminal display.
    rel: adjacent_workflow
    sources:
      - https://aa-project.sourceforge.net/aview/
      - https://imagemagick.org/command-line-processing.php
category: media
