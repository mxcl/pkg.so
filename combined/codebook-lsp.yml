id: brew:codebook-lsp
display-name: Codebook LSP
homepage: https://github.com/blopker/codebook
repo: https://github.com/blopker/codebook
docs:
  - https://github.com/blopker/codebook#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/codebook/codebook.toml
    - ~/.config/codebook/codebook.toml
    - codebook.toml
    - .codebook.toml
  windows:
    - '%APPDATA%\codebook\codebook.toml'
    - '%APPDATA%\Roaming\codebook\codebook.toml'
    - codebook.toml
    - .codebook.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents manual release downloads, `eget`, Arch Linux `pacman`, Cargo,
      Homebrew, and source builds. The input package facts list Homebrew and pacman,
      which matches the upstream installation section.
    - >
      Editor integration is central to adoption. The README describes Codebook as the
      most popular spell checker for Zed, documents Helix and Neovim setup, and notes
      that a VS Code extension is still a work in progress.
  package-nerd-significance:
    - >
      Codebook LSP is a small but neat example of the LSP ecosystem expanding beyond
      compilers and linters into language-aware writing tools. Package maintainers care
      because editor integrations depend on a native binary being available on PATH,
      making Homebrew, pacman, Cargo, and release archives part of the editor
      experience.
  project-history:
    - >
      The GitHub repository was created on 2025-01-03, and early releases began in
      January 2025. The README states that Codebook was originally developed for the Zed
      editor and exposes a Language Server intended for any editor that supports LSP.
    - >
      The project emphasizes privacy, low annoyance, and efficiency: no remote
      spell-checking calls, only flagging words users can control, and low CPU and
      memory overhead for checking on keystrokes.
  related-projects:
    - >
      The README names Tree-sitter and Spellbook as core building blocks. It also
      relates Codebook to the Zed extension, Helix, Neovim's LSP configuration, and a
      work-in-progress VS Code extension.
  sources:
    - https://github.com/blopker/codebook
  summary:
    - >
      Codebook LSP is a Rust language-server spell checker for code. It combines
      Tree-sitter parsing with Spellbook-style spell checking so editors can flag words
      in comments, strings, and definitions without behaving like a prose grammar
      checker.
  timeline:
    - '2025-01-03: GitHub repository created.'
    - '2025-01-15: Early v0.0.6 release published.'
    - '2025: README documents Zed, Helix, Neovim, and local VS Code integration paths.'
    - '2026: Active v0.3.x releases continue through at least v0.3.41.'
  usage:
    - >
      Users install the `codebook-lsp` binary and configure it in an editor's LSP
      client. In Helix it is launched with `codebook-lsp serve`; Neovim can enable it
      through `nvim-lspconfig`; Zed users generally install the Codebook extension,
      which manages the LSP binary.
    - >
      The language server checks code-aware text such as comments, strings, and
      definitions, splits camelCase and snake_case, and manages dictionaries
      automatically.
related-packages:
  - id: brew:typos-lsp
    reason: >
      Choose typos-lsp for an LSP wrapper around the low-false-positive `typos`
      correction database; choose Codebook for Tree-sitter-aware checking of comments,
      strings, and identifier definitions with managed dictionaries.
    rel: alternative
    sources:
      - https://github.com/tekumara/typos-lsp
      - https://github.com/blopker/codebook
  - id: brew:harper
    reason: >
      Choose Harper when you need offline grammar and style diagnostics as well as
      spelling through an editor language server; Codebook intentionally focuses on
      code-aware spelling rather than prose grammar.
    rel: alternative
    sources:
      - https://writewithharper.com/docs/integrations/language-server
      - https://github.com/blopker/codebook
category: developer-tools
package-manager:
  brew: codebook-lsp
  pacman: codebook-lsp
package-manager-url: https://formulae.brew.sh/formula/codebook-lsp
license: MIT
tags:
  - cli
  - code-quality
  - editor-integration
  - language-server
  - lsp
  - spell-checker
description: Code-aware spell checker language server
executables:
  - codebook-lsp
provenance:
  formula: codebook-lsp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
