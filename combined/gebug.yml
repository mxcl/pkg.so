id: brew:gebug
display-name: Gebug
homepage: https://github.com/moshebe/gebug
repo: https://github.com/moshebe/gebug
docs:
  - https://github.com/moshebe/gebug#readme
config-file-location:
  unix: .gebug/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation instructions support Homebrew on Linux and macOS and `go
      install` on Go-supported platforms. The README also documents an upgrade path from
      v1.x to v2.0, which suggests existing users had generated project configuration
      that needed regeneration.
  package-nerd-significance:
    - >
      For package users, Gebug is interesting as a Go CLI that packages a repeatable
      local container-debugging stack. It turns a set of Docker, Compose, Delve, and
      rebuild conventions into a command users can install through Homebrew or Go
      tooling.
  project-history:
    - >
      The public GitHub repository was created in July 2020. The README presents Gebug
      as a Go application debugging environment for containers, with commands to
      initialize, start, clean, destroy, and manage a web UI for a project.
  related-projects:
    - >
      Gebug is closely related to Go, Docker, Docker Compose, Delve, and hot-reload
      tooling for containerized development.
  sources:
    - https://api.github.com/repos/moshebe/gebug
    - https://github.com/moshebe/gebug
    - https://raw.githubusercontent.com/moshebe/gebug/master/README.md
  summary:
    - >
      Gebug is a command-line developer tool for debugging Dockerized Go applications.
      Its README describes debugger and hot-reload workflows driven by generated
      Dockerfile, Docker Compose, and project configuration files.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2020s: README documents Homebrew and Go installation paths.'
    - >
      2026: README documents v2.0 upgrade notes, including newer Go, runtime image, web
      UI, and Docker image defaults.
  usage:
    - >
      Practitioners run `gebug init` inside a Go application, edit generated files under
      `.gebug` when needed, and run `gebug start` or `gebug ui` to work with hot reload,
      Delve debugging, exposed ports, environment variables, and Docker networking.
related-packages:
  - id: brew:delve
    reason: >
      Delve is the Go debugger enabled by Gebug inside its generated container
      environment, so install or use it directly when you need lower-level debugging
      outside Gebug's orchestration.
    rel: adjacent_workflow
    sources:
      - https://github.com/moshebe/gebug#how-does-it-work
      - https://github.com/go-delve/delve
  - id: brew:docker-compose
    reason: >
      Gebug generates and runs Docker Compose configuration for the application's
      debugging stack, making Docker Compose the underlying tool for inspecting or
      operating those services directly.
    rel: adjacent_workflow
    sources:
      - https://github.com/moshebe/gebug#how-does-it-work
      - https://docs.docker.com/compose/
category: developer-tools
package-manager:
  brew: gebug
package-manager-url: https://formulae.brew.sh/formula/gebug
license: Apache-2.0
tags:
  - cli
  - containers
  - debugging
  - docker
  - go
  - hot-reload
description: Debug Dockerized Go applications better
executables:
  - gebug
provenance:
  formula: gebug
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
