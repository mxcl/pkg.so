id: brew:alluxio
display-name: Alluxio
homepage: https://www.alluxio.io/
repo: https://github.com/Alluxio/alluxio
docs:
  - https://documentation.alluxio.io/os-en
config-file-location:
  unix:
    - ${alluxio.conf.dir}/alluxio-site.properties
    - ${user.home}/.alluxio/alluxio-site.properties
    - /etc/alluxio/alluxio-site.properties
credentials-file-location: null
history:
  adoption-history:
    - >
      Official documentation says Alluxio has attracted more than 1000 contributors from
      over 300 institutions including Alibaba, Baidu, CMU, Google, IBM, Intel, NJU, Red
      Hat, Tencent, UC Berkeley, and Yahoo. It also says the project is deployed in
      production by hundreds of organizations, while the README describes petabyte-scale
      production deployments and a largest deployment exceeding thousands of nodes.
    - >
      Alluxio adoption followed the data-platform pattern of being useful when compute
      and storage are decoupled. Its docs call out use with Apache Spark, Presto,
      Tensorflow, Apache HBase, Apache Hive, and Apache Flink above storage systems such
      as Amazon S3, Google Cloud Storage, OpenStack Swift, HDFS, IBM Cleversafe, EMC
      ECS, Ceph, NFS, Minio, and Alibaba OSS.
  package-nerd-significance:
    - >
      Alluxio is significant to package people because it packages a full distributed
      Java data system behind Unix-style scripts. A Homebrew install can be convenient
      for development and local testing, but production use usually involves clusters,
      Docker, Kubernetes, Hadoop/Spark classpaths, and configuration files.
    - >
      The former Tachyon name, AMPLab origin, and BDAS connection tie Alluxio to the
      same research-to-production wave that shaped Spark-era big data infrastructure.
      Its package metadata has to communicate storage, cache, filesystem, and
      orchestration at once because all of those labels are true in different deployment
      modes.
  project-history:
    - >
      The Alluxio README states that the project was formerly known as Tachyon and
      originated as a UC Berkeley AMPLab research project. It was the data layer of the
      Berkeley Data Analytics Stack, and the README points readers to Haoyuan Li's
      dissertation, Alluxio: A Virtual Distributed File System, for the research
      background.
    - >
      The project later became Alluxio, an Apache-licensed open source system owned by
      the Alluxio Open Source Foundation and managed by an Alluxio Project Management
      Committee. Official docs position it as data orchestration technology for
      analytics and AI, with a memory-first tiered architecture, global namespace, and
      server-side API translation.
  related-projects:
    - >
      Apache Spark, Presto, Tensorflow, Apache HBase, Apache Hive, and Apache Flink are
      documented compute-side integrations.
    - >
      Amazon S3, Google Cloud Storage, OpenStack Swift, HDFS, IBM Cleversafe, EMC ECS,
      Ceph, NFS, Minio, and Alibaba OSS are documented storage-side examples.
    - >
      The Berkeley Data Analytics Stack and UC Berkeley AMPLab are central to Alluxio's
      origin story.
  sources:
    - https://documentation.alluxio.io/os-en/api/posix-api.md
    - https://documentation.alluxio.io/os-en/compute/spark.md
    - https://documentation.alluxio.io/os-en/overview.md
    - https://raw.githubusercontent.com/Alluxio/alluxio/master/README.md
  summary:
    - >
      Alluxio is an open source data orchestration and virtual distributed storage
      system. It sits between compute frameworks and storage systems, presenting a
      unified namespace and APIs while caching data close to analytics and AI workloads.
  timeline:
    - >
      Tachyon era: Project originated at UC Berkeley AMPLab as the data layer of the
      Berkeley Data Analytics Stack.
    - >
      Alluxio rename: The project became Alluxio, described by the README as formerly
      known as Tachyon.
    - >
      Foundation/PMC era: README states the Alluxio Open Source Foundation owns the
      project and the PMC manages operation.
    - >
      Current: Official docs position Alluxio as data orchestration for analytics and AI
      across many compute engines and storage backends.
  usage:
    - >
      Operators deploy an Alluxio master and workers, mount persistent under storage
      into the Alluxio namespace, and point compute jobs at Alluxio through
      HDFS-compatible, S3, FUSE/POSIX, REST, or Java APIs. The Spark guide, for example,
      shows Spark applications reading and writing `alluxio://` paths while Alluxio
      transparently fetches and caches data from under storage.
    - >
      The command-line package includes administrative and cluster scripts such as
      `alluxio`, `alluxio-start.sh`, `alluxio-stop.sh`, `alluxio-masters.sh`, and
      `alluxio-workers.sh`. In package-manager terms this is not just a CLI utility; it
      is a local entry point into a distributed service stack.
related-packages:
  - id: brew:apache-spark
    reason: >
      Use Apache Spark with Alluxio when Spark jobs need an HDFS-compatible data layer
      that transparently caches data from remote storage near executors.
    rel: adjacent_workflow
    sources:
      - https://documentation.alluxio.io/os-en/compute/spark
      - https://spark.apache.org/docs/latest
  - id: brew:hadoop
    reason: >
      Use Apache Hadoop alongside Alluxio for HDFS-backed storage or Hadoop-compatible
      applications that access data through Alluxio's unified namespace and cache.
    rel: adjacent_workflow
    sources:
      - https://documentation.alluxio.io/os-en
      - https://hadoop.apache.org/docs/current
category: data
package-manager:
  brew: alluxio
package-manager-url: https://formulae.brew.sh/formula/alluxio
license: Apache-2.0
