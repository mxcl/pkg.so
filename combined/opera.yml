history:
  adoption-history:
    - >
      Opera expanded from a paid desktop browser into a cross-platform browser family.
      Opera's official 2013 account reported more than 350 million users across its
      products, with Opera Mini becoming especially prominent on constrained mobile
      devices through server-assisted data compression. The desktop product remains
      distributed for major operating systems, including through third-party system
      package managers such as Homebrew.
  package-nerd-significance:
    - >
      Opera is one of the longest-running alternative graphical web browsers. Package
      enthusiasts remember its compact proprietary Presto engine, dense power-user
      feature set, session handling, early full-page zoom, and later migration to
      Chromium. Its history illustrates both independent browser-engine development and
      the modern consolidation around Chromium.
  project-history:
    - >
      Opera originated in April 1994 as a browser research project at the Norwegian
      telecommunications company Telenor, developed by Jon von Tetzchner and Geir
      Ivarsøy. The work became a separate company in 1995, and Opera 2.10 became the
      first public release in December 1996.
    - >
      For many years Opera shipped its own rendering technology, culminating in the
      Presto engine. In 2013 the company announced a transition to WebKit and Chromium
      and released a redesigned Chromium-based desktop browser. Current Opera continues
      that Chromium lineage while adding its own interface, sidebar, privacy, media,
      workspace, and synchronization features.
  related-projects:
    - Chromium and Blink underpin current Opera desktop releases.
    - Opera Mini is the bandwidth-saving mobile relative of the desktop browser.
    - Opera GX is Opera's gaming-oriented browser.
    - >
      Opera's historical Presto engine powered desktop releases through the Opera 12
      generation.
  sources:
    - https://blogs.opera.com/news/2013/08/18-years-of-opera-today-we-opera-2/
    - https://help.opera.com/en/operas-archived-history/
    - https://press.opera.com/2013/02/13/opera-gears-up-at-300-million-users/
    - https://press.opera.com/2013/05/28/discover-the-new-opera/
    - https://www.opera.com/about
  summary:
    - >
      Opera is a long-running Norwegian web browser that evolved from an independent
      1994 research project and proprietary browser engine into a Chromium-based desktop
      browser.
  timeline:
    - '1994-04: Development began as a Telenor research project.'
    - '1995-08: The project became a separate company.'
    - '1996-12: Opera 2.10 became the first public release.'
    - '2005: Opera Mini was introduced for mobile browsing and constrained networks.'
    - '2013: Opera announced and completed the desktop transition toward Chromium.'
    - '2023: Opera One introduced a major redesign of the Chromium-based browser.'
  usage:
    - >
      Opera is used for general web browsing and provides built-in features such as
      workspaces, sidebar applications, Speed Dial, ad blocking, synchronization, and
      privacy controls. Users can inspect the actual local profile and data paths for
      their installation at opera://about/.
