config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Asuka reached Unix-like users through source builds and release archives, then
      through Homebrew and Nix packaging recorded in the supplied package metadata. Its
      adoption is best characterized as niche and protocol-specific rather than broad
      browser adoption.
  package-nerd-significance:
    - >
      Asuka packages a complete alternative-protocol browser as a compact Rust terminal
      binary. It is especially interesting to package enthusiasts because it combines
      SourceHut-native development, ncurses-style interaction, OpenSSL system
      dependencies, and distribution through both Homebrew and Nix.
  project-history:
    - >
      Julien Blanchard developed Asuka on SourceHut during the early growth of the
      Gemini ecosystem. The official history shows active development by 2020,
      contributions from several developers, and releases through 0.8.5 in May 2022.
    - >
      The client remained deliberately small: it renders Gemini text in a terminal UI,
      follows Gemini links, handles prompts and downloads, and stores bookmarks locally.
  related-projects:
    - Gemini is the lightweight application-layer protocol that Asuka browses.
    - Cursive provides Asuka's Rust terminal user interface.
  sources:
    - https://git.sr.ht/~julienxx/asuka/log
    - https://git.sr.ht/~julienxx/asuka/refs
    - https://sr.ht/~julienxx/Asuka
    - source_facts.package-manager
  summary:
    - >
      Asuka is a Rust and ncurses terminal client for browsing the Gemini protocol, with
      keyboard-driven navigation, history, reload, and bookmarks.
  timeline:
    - '2020: Public SourceHut development is underway during the early Gemini-client wave.'
    - '2021: Releases add and refine URL navigation, bookmarks, history, and protocol handling.'
    - '2022: Version 0.8.5 is tagged after dependency updates and binary-size optimization.'
  usage:
    - >
      Users run `asuka`, optionally with a Gemini URL, and navigate with single-key
      commands: `g` opens a URL, `b` goes back, `a` adds a bookmark, `B` shows
      bookmarks, `r` reloads, and `q` quits. The README warns that a UTF-8 locale is
      needed for correct terminal rendering.
