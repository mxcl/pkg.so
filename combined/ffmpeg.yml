id: brew:ffmpeg
display-name: FFmpeg
homepage: https://ffmpeg.org/
repo: https://git.ffmpeg.org/ffmpeg.git
docs:
  - https://ffmpeg.org/documentation.html
config-file-location:
  unix:
    - $FFMPEG_DATADIR/*.ffpreset
    - ~/.ffmpeg/*.ffpreset
    - PREFIX/share/ffmpeg/*.ffpreset
credentials-file-location: null
history:
  adoption-history:
    - >
      FFmpeg's adoption is visible in its official packaging guidance: the project links
      to Debian, Ubuntu, Fedora/RHEL, Windows, and macOS build sources rather than
      shipping one blessed binary for every platform. That mirrors how FFmpeg became a
      package-manager staple rather than only an application downloaded from upstream.
    - >
      The release process is oriented toward distributors and system integrators.
      Upstream documents roughly six-month major releases with point releases for
      important fixes, release signatures, git tags, and branch-specific release notes.
  package-nerd-significance:
    - >
      FFmpeg is a package-manager stress test: it touches codec licensing, optional
      dependencies, hardware acceleration, network protocols, security updates for
      untrusted media parsing, and ABI-sensitive libraries consumed by other
      applications.
    - >
      Its combination of command-line tools and shared libraries means it is both an
      end-user utility and infrastructure for other media software. That dual identity
      is why package maintainers track branch support, dependency choices, and security
      backports closely.
  project-history:
    - >
      The official project describes FFmpeg as a multimedia framework that can decode,
      encode, transcode, mux, demux, stream, filter, and play media across formats from
      old obscure inputs to cutting-edge codecs. Its architecture combines user-facing
      tools with libraries such as libavcodec, libavformat, libavfilter, libavdevice,
      libswscale, and libswresample.
    - >
      FFmpeg's upstream culture is explicitly developer-driven and source-first. The
      download page says FFmpeg provides source code and points users to distributions
      and build providers for compiled packages. It also notes that development branch
      snapshots are often used because the project changes constantly and release
      branches cherry-pick selected fixes.
  related-projects:
    - ffmpeg-full is a Homebrew formula variant with a broader optional dependency set.
    - >
      ffmpeg2theora is an older converter that used FFmpeg decoding to produce Ogg
      Theora/Vorbis outputs.
    - FFmate is a newer automation layer that runs FFmpeg behind a server/API workflow.
  sources:
    - https://ffmpeg.org/about.html
    - https://ffmpeg.org/download.html
    - https://ffmpeg.org/documentation.html
    - https://ffmpeg.org/ffmpeg.html
    - https://formulae.brew.sh/api/formula/ffmpeg.json
  summary:
    - >
      FFmpeg is one of the canonical command-line multimedia packages: a source-first
      upstream project, a set of reusable codec/container/filter libraries, and the
      `ffmpeg`, `ffplay`, and `ffprobe` tools used everywhere from one-line conversions
      to production media pipelines.
  timeline:
    - >
      2011: FFmpeg release signing key date documented by upstream release verification
      instructions.
    - '2015: FFmpeg 2.8 branch cut from master on 2015-09-05, later maintained through 2.8.22.'
    - >
      2024-2026: Upstream release pages show active major/minor release branches and
      point releases for distributors and integrators.
    - '2026: FFmpeg 8.1.2 listed as a stable source release on the official download page.'
  usage:
    - >
      The core command-line pattern is `ffmpeg -i input output`: read one or more
      inputs, select streams, optionally filter or transcode them, and write one or more
      outputs. `ffprobe` is used to inspect streams and metadata, while `ffplay`
      provides a simple player based on FFmpeg libraries.
    - >
      Package users care about the exact build because enabled libraries determine
      available encoders, decoders, filters, devices, and protocols. A stock distro
      build, Homebrew build, static Windows build, and custom source build can all
      behave differently while sharing the same upstream name.
related-packages:
  - id: brew:ffmpeg-full
    reason: >
      Choose ffmpeg-full when a Homebrew workflow needs the additional tools and
      libraries omitted from the regular ffmpeg formula, accepting its larger dependency
      surface.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/ffmpeg
      - https://formulae.brew.sh/formula/ffmpeg-full
  - id: brew:yt-dlp
    reason: >
      yt-dlp uses ffmpeg and ffprobe to merge separate audio/video downloads and perform
      media post-processing.
    rel: adjacent_workflow
    sources:
      - https://github.com/yt-dlp/yt-dlp
      - https://ffmpeg.org/ffmpeg.html
  - id: brew:ffmpegthumbnailer
    reason: >
      ffmpegthumbnailer uses FFmpeg's decoders to extract video frames and turn them
      into lightweight file-manager thumbnails.
    rel: adjacent_workflow
    sources:
      - https://github.com/dirkvdb/ffmpegthumbnailer
      - https://ffmpeg.org/about.html
  - id: brew:ab-av1
    reason: >
      ab-av1 drives FFmpeg, SVT-AV1, and VMAF to select a quality target and perform
      automated AV1 or compatible encoder workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/alexheretic/ab-av1
      - https://ffmpeg.org/ffmpeg.html
