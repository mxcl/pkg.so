id: brew:cargo-shear
display-name: cargo-shear
homepage: https://github.com/Boshen/cargo-shear
repo: https://github.com/Boshen/cargo-shear
docs:
  - https://github.com/Boshen/cargo-shear#readme
config-file-location:
  unix: Cargo.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Despite being newer than the other tools in this batch, crates.io metadata showed
      many releases by 2026 and package facts list Homebrew, Nix, and winget packages.
      The README includes CI examples and machine-readable JSON output for automation.
  package-nerd-significance:
    - >
      It is part of the Rust ecosystem's dependency-hygiene tooling, sitting near
      cargo-udeps and cargo-machete but using rust-analyzer parsing and Cargo metadata
      to find unused dependencies without compiling in the default mode.
  project-history:
    - >
      The GitHub repository was created in March 2024 and the first crates.io release
      appeared the next day. The README describes the tool as feature-complete, with
      ongoing work focused on bug fixes, dependency upgrades, and UI/UX improvements.
  related-projects:
    - README prior art names cargo-udeps, cargo-machete, Cargo, and Clippy.
    - README documents automatic handling for cargo-hakari workspace-hack crates.
  sources:
    - https://api.github.com/repos/Boshen/cargo-shear
    - https://github.com/Boshen/cargo-shear
    - https://github.com/Boshen/cargo-shear#readme
    - https://crates.io/api/v1/crates/cargo-shear
    - https://formulae.brew.sh/api/formula/cargo-shear.json
  summary:
    - >
      cargo-shear is a Rust Cargo subcommand for detecting and optionally fixing unused
      or misplaced dependencies and unlinked source files.
  timeline:
    - '2024: Repository created and first crates.io release published.'
    - '2026: README described the tool as feature-complete.'
    - '2026: crates.io reported v1.13.1 as the latest release.'
  usage:
    - >
      Users run cargo shear to check for issues, cargo shear --fix to remove unused
      dependencies, --deny-warnings for strict CI, --format=json for structured output,
      and --expand with nightly when macro expansion is needed.
related-packages:
  - id: brew:cargo-udeps
    reason: >
      Choose cargo-udeps when you prefer compiler-derived dependency-usage analysis and
      can run nightly Rust; cargo-shear instead normally parses source without compiling
      and supports workspace-aware fixes.
    rel: alternative
    sources:
      - https://github.com/Boshen/cargo-shear#readme
      - https://github.com/est31/cargo-udeps#readme
category: developer-tools
package-manager:
  brew: cargo-shear
  nix: cargo-shear
  winget: Boshen.cargo-shear
package-manager-url: https://formulae.brew.sh/formula/cargo-shear
license: MIT
tags:
  - cargo-plugin
  - cli
  - dependency-analysis
  - rust
  - static-analysis
  - unused-dependencies
description: Detect and remove unused dependencies from Cargo.toml in Rust projects
executables:
  - cargo-shear
provenance:
  formula: cargo-shear
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
