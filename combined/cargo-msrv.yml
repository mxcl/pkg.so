id: brew:cargo-msrv
display-name: cargo-msrv
homepage: https://foresterre.github.io/cargo-msrv
repo: https://github.com/foresterre/cargo-msrv
docs:
  - https://gribnau.dev/cargo-msrv
config-file-location:
  unix: Cargo.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool tracks Rust packaging practice around package.rust-version, added to
      Cargo for Rust 1.56, while retaining package.metadata.msrv for older MSRVs. It is
      packaged by Homebrew, Nix, and Arch according to the input facts, and crates.io
      reported 486,985 downloads when checked on 2026-06-30.
  package-nerd-significance:
    - >
      It matters for package maintainers because MSRV is part of a Rust crate's
      compatibility contract. cargo-msrv turns that contract into a runnable check for
      local development and CI.
  project-history:
    - >
      The crate first appeared on crates.io in October 2019 as version 0.0.0. The
      official README includes a short history saying cargo-msrv was born from the
      desire to find the MSRV for a Rust package, and later added tools such as cargo
      msrv verify.
  related-projects:
    - >
      Related projects and concepts include Cargo manifests, rustup toolchains, Rust
      release metadata, and the Cargo package.rust-version field.
  sources:
    - https://api.github.com/repos/foresterre/cargo-msrv
    - https://github.com/foresterre/cargo-msrv
    - https://gribnau.dev/cargo-msrv
    - https://crates.io/api/v1/crates/cargo-msrv
    - https://formulae.brew.sh/api/formula/cargo-msrv.json
  summary:
    - >
      cargo-msrv helps find, verify, list, show, and set a Rust crate's minimum
      supported Rust version. Its README defines MSRV as the earliest Rust version
      supported by a project and documents rustup-backed compatibility checks.
  timeline:
    - '2019: First crates.io release 0.0.0.'
    - >
      2021: Rust 1.56 made package.rust-version available in Cargo manifests, which
      cargo-msrv's docs recommend for declared MSRV.
    - '2026: Crates.io latest version 0.19.3 and Homebrew stable version 0.19.3.'
  usage:
    - >
      Users run cargo msrv find to search for a compatible Rust version, cargo msrv
      verify to test the declared MSRV, and cargo msrv list or show to inspect
      author-specified MSRV values in Cargo manifests and dependencies.
related-packages:
  - id: brew:cargo-hack
    reason: >
      Use cargo-hack after establishing an MSRV when CI must exercise Cargo commands
      across Rust version ranges or feature combinations.
    rel: adjacent_workflow
    sources:
      - https://gribnau.dev/cargo-msrv/
      - https://github.com/taiki-e/cargo-hack#readme
