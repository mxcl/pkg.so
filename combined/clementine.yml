history:
  adoption-history:
    - >
      Clementine expanded beyond local-library playback into podcasts, internet radio,
      cloud libraries, Subsonic servers, portable-device synchronization, tagging,
      transcoding, and remote control. Its historical release announcements show this
      progression across desktop and connected-music workflows.
    - >
      Its availability on Linux, macOS, and Windows and support for open playlist
      formats made it a familiar package-manager choice for users wanting one
      library-oriented player across operating systems.
  package-nerd-significance:
    - >
      Clementine preserves the fast, library-centered interaction model associated with
      Amarok 1.4 while packaging it as a cross-platform Qt application. That makes it
      part of a recognizable lineage in Linux desktop music software.
    - >
      Its broad service and codec surface illustrates the maintenance burden carried by
      desktop media packages: metadata providers, streaming services, cloud APIs,
      portable devices, codecs, desktop integration, and remote-control protocols all
      evolve independently.
  project-history:
    - >
      Clementine began as a cross-platform music player inspired by Amarok 1.4, with an
      emphasis on fast library search and straightforward playback. The project's public
      release history records its 1.0 release in 2011.
    - >
      Subsequent releases added podcast support, cloud-library integrations, Subsonic
      support, smart and restorable playlists, and compatibility with the Android
      Clementine Remote, growing the project from a local player into a wider
      music-management client.
  related-projects:
    - Amarok 1.4 directly inspired Clementine's interface and library-focused design.
    - >
      MusicBrainz supplies metadata used by Clementine's automatic tag-identification
      workflow.
    - >
      The Clementine Remote Android application provides documented remote control of
      desktop playback.
  sources:
    - https://github.com/clementine-player/Clementine
    - https://github.com/clementine-player/Clementine/blob/master/Changelog
    - https://www.clementine-player.org/
    - https://www.clementine-player.org/about
  summary:
    - >
      Clementine is a cross-platform music player and library organizer inspired by
      Amarok 1.4. It combines local-library search and playback with playlists, tag
      editing, transcoding, podcasts, internet services, cloud libraries,
      portable-device support, and remote control.
  timeline:
    - '2011: Clementine 1.0 is released.'
    - '2012: Podcast support and additional cloud and streaming integrations arrive.'
    - '2013: Subsonic support and restorable starred playlists are added.'
    - '2016: Clementine Remote compatibility and further service integrations are released.'
  usage:
    - >
      Users point Clementine at local music folders to build a searchable library,
      manage playlists, edit tags, fetch metadata and cover art, transcode tracks, and
      copy music to supported portable devices.
    - >
      It can also play internet radio, discover podcasts, access supported remote music
      services, accept command-line or MPRIS controls, and pair with the Clementine
      Remote application.
