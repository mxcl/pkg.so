id: brew:coredns
display-name: CoreDNS
homepage: https://coredns.io/
repo: https://github.com/coredns/coredns
docs:
  - https://coredns.io/manual/toc
config-file-location:
  unix: Corefile
credentials-file-location: null
history:
  adoption-history:
    - >
      CoreDNS adoption accelerated through Kubernetes service discovery. The project's
      Kubernetes plugin and its selection as Kubernetes's default DNS made the coredns
      binary part of ordinary cluster bootstrapping, not just a standalone DNS-server
      choice.
    - >
      Outside Kubernetes, CoreDNS is used as a configurable DNS forwarder, authoritative
      or secondary server, DNS-over-TLS/HTTPS/QUIC endpoint, service-discovery
      component, and plugin platform.
  package-nerd-significance:
    - >
      CoreDNS matters to package history because it is a small single binary that became
      cluster-critical infrastructure. Packaging has to track Go versions, plugin
      availability, Corefile examples, service unit integration, and Kubernetes defaults
      rather than only the upstream executable.
  project-history:
    - >
      The coredns/coredns repository was created in 2016. The official README describes
      CoreDNS as a DNS server and forwarder, written in Go, where each plugin performs a
      DNS function and the server chains those plugins.
    - >
      CoreDNS joined the Cloud Native Computing Foundation ecosystem and graduated in
      January 2019. CNCF described it as a fast-growing DNS server and the official
      default DNS for Kubernetes.
  related-projects:
    - >
      CoreDNS is related to Kubernetes DNS service discovery, SkyDNS-era
      service-discovery patterns, DNS plugins, and cloud-native observability systems
      such as Prometheus.
  sources:
    - https://github.com/coredns/coredns
    - https://github.com/coredns/coredns#readme
    - https://coredns.io/manual/toc
    - https://coredns.io/plugins/
    - https://coredns.io/2017/03/01/coredns-for-kubernetes-service-discovery-take-2/
    - https://www.cncf.io/announcements/2019/01/24/coredns-graduation/
  summary:
    - >
      CoreDNS is a Go DNS server built around a plugin chain. It became significant not
      only as a flexible DNS daemon, but as cloud-native infrastructure: a CNCF
      graduated project and the default DNS service for Kubernetes clusters.
  timeline:
    - '2016: coredns/coredns repository created.'
    - >
      2017: CoreDNS documented Kubernetes service discovery support on the official
      project site.
    - '2019-01-24: CNCF announced CoreDNS graduation.'
    - '2026: v1.14.x releases show continued active upstream maintenance.'
  usage:
    - >
      CoreDNS is configured with a Corefile, where server blocks and plugin directives
      define zones, forwarding, caching, Kubernetes integration, logging, metrics, and
      other DNS behaviors. The plugin model lets distributions choose a compiled-in
      plugin set and lets operators reason about behavior from the Corefile.
related-packages:
  - id: brew:bind
    reason: >
      Choose BIND when you need its mature authoritative and recursive server ecosystem,
      extensive DNSSEC tooling, dynamic updates, or catalog and response-policy zones
      instead of a CoreDNS plugin-chain configuration.
    rel: alternative
    sources:
      - https://coredns.io/manual/toc/
      - https://bind9.readthedocs.io/en/latest/
  - id: brew:unbound
    reason: >
      Choose Unbound for a focused validating, recursive, caching DNS resolver rather
      than CoreDNS's broader plugin-based authoritative and service-discovery roles.
    rel: alternative
    sources:
      - https://coredns.io/manual/toc/
      - https://unbound.docs.nlnetlabs.nl/en/latest/
  - id: brew:dnsmasq
    reason: >
      Choose dnsmasq for a lightweight small-network combination of DNS forwarding,
      caching, and DHCP instead of assembling those behaviors around a CoreDNS
      deployment.
    rel: alternative
    sources:
      - https://coredns.io/manual/toc/
      - https://thekelleys.org.uk/dnsmasq/doc.html
category: networking
package-manager:
  apk: coredns
  brew: coredns
  nix: coredns
  scoop: main/coredns
  zypper: coredns
package-manager-url: https://formulae.brew.sh/formula/coredns
license: Apache-2.0
tags:
  - cli
  - dns
  - go
  - kubernetes
  - plugins
  - server
  - service-discovery
description: DNS server that chains plugins
executables:
  - coredns
provenance:
  formula: coredns
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
