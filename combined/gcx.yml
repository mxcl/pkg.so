id: brew:gcx
display-name: gcx
homepage: https://github.com/grafana/gcx
repo: https://github.com/grafana/gcx
docs:
  - https://grafana.com/docs/grafana/latest/as-code/observability-as-code/grafana-cli/gcx
  - >
    https://grafana.com/docs/grafana/latest/as-code/observability-as-code/grafana-cli/gcx/installation
config-file-location:
  unix:
    - ~/.config/gcx/config.yaml
    - ./.gcx.yaml
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/gcx/config.yaml
    - ~/.config/gcx/config.yaml
    - $XDG_CONFIG_DIRS/gcx/config.yaml
history:
  adoption-history:
    - >
      Grafana's official documentation identifies gcx as the recommended Grafana CLI and
      documents migration from the deprecated grafanactl command. Grafana distributes it
      through release archives, Go's module toolchain, an install script, and the
      official grafana/grafana Homebrew tap.
  package-nerd-significance:
    - >
      gcx is notable as a young vendor CLI that deliberately unifies previously
      fragmented Grafana and Grafana Cloud workflows. Its Go binary, Homebrew
      distribution, structured output, environment-variable authentication,
      multi-context configuration, and explicit AI-agent support reflect contemporary
      CLI packaging and automation practice.
  project-history:
    - >
      Grafana opened the gcx repository in March 2026 and published its earliest
      currently listed GitHub release, v0.2.0, in April 2026. The project entered public
      preview as a successor path for users of the older grafanactl tool.
  related-projects:
    - Grafana is the observability platform gcx manages.
    - >
      grafanactl is the older Grafana CLI that official documentation now describes as
      deprecated.
    - >
      Grafana Assistant supplies agent-oriented investigation capabilities exposed
      through gcx.
  sources:
    - https://github.com/grafana/gcx
    - https://github.com/grafana/gcx/releases
    - https://grafana.com/docs/grafana/latest/as-code/observability-as-code/grafana-cli/gcx/
    - >
      https://grafana.com/docs/grafana/latest/as-code/observability-as-code/grafana-cli/gcx/installation/
  summary:
    - >
      gcx is Grafana Labs' command-line interface for structured access to Grafana
      dashboards, alerts, data sources, telemetry, and Grafana Cloud products. It is
      designed for both interactive terminal work and automation by coding agents.
  timeline:
    - '2026-03: Official GitHub repository created.'
    - '2026-04: v0.2.0 published as the earliest currently listed GitHub release.'
    - >
      2026: Grafana documents gcx as the recommended replacement path for grafanactl and
      marks it public preview.
  usage:
    - >
      Users create named contexts with gcx login, then query metrics, logs, traces,
      dashboards, alert rules, SLOs, and other Grafana resources. JSON and YAML output,
      predictable exit codes, resource pull and push commands, and bundled agent skills
      make the tool suitable for CI, GitOps, and agentic workflows.
related-packages:
  - id: brew:grafana
    reason: >
      Grafana is the server and observability platform that gcx authenticates against
      and manages, making the local Grafana package a direct companion for development,
      resource automation, and testing CLI workflows.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/grafana/latest/as-code/observability-as-code/grafana-cli/gcx/
      - https://grafana.com/docs/grafana/latest/setup-grafana/
category: cloud-infrastructure
package-manager:
  brew: gcx
  nix: gcx
package-manager-url: https://formulae.brew.sh/formula/gcx
license: Apache-2.0
tags:
  - ai-agent
  - automation
  - cli
  - cloud
  - gitops
  - grafana
  - observability
description: CLI for managing Grafana Cloud resources
executables:
  - gcx
provenance:
  formula: gcx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
