history:
  adoption-history:
    - >
      Wondershare describes UniConverter as a video solution used across more than 150
      countries and regions. Over successive releases it expanded from conversion into
      downloading, compression, screen recording, disc handling, editing, subtitle
      processing, and AI-assisted media tools.
  package-nerd-significance:
    - >
      UniConverter represents the commercial all-in-one end of desktop media tooling: a
      single signed application bundles workflows that package-oriented users might
      otherwise assemble from separate converters, downloaders, editors, recorders, and
      disc utilities.
  project-history:
    - >
      UniConverter originated as Wondershare's video-converter product and was formerly
      named Wondershare Video Converter Ultimate. The official version history records
      its later renaming to Wondershare UniConverter.
    - >
      The product developed into an all-in-one media toolkit. Recent major versions
      added Apple Silicon acceleration, high-resolution conversion, speech-to-text, and
      collections of AI video, image, voice, and subtitle tools.
  related-projects:
    - >
      UniConverter is part of Wondershare's creative-software portfolio alongside
      products including Filmora. The relationship is organizational; the products
      remain separate applications.
  sources:
    - https://videoconverter.wondershare.com/guide-mac/
    - https://videoconverter.wondershare.com/guide/brief-introduction.html
    - https://videoconverter.wondershare.com/what-is-new.html
    - https://www.wondershare.com/company/foundersspeech/
  summary:
    - >
      Wondershare UniConverter is a commercial cross-platform media toolkit centered on
      video and audio conversion, with additional downloading, compression, recording,
      editing, disc, subtitle, and AI features.
  timeline:
    - 'Early product history: Wondershare launched its video-converter product.'
    - >
      Later product history: Wondershare Video Converter Ultimate was renamed
      Wondershare UniConverter.
    - >
      2023: Version 15 added Apple Silicon acceleration and 4K, 8K, and HDR conversion
      improvements.
    - '2025: Version 17 introduced a redesigned all-in-one AI media toolkit.'
  usage:
    - >
      Users import media, choose an output format and quality, and convert files
      individually or in batches. Additional modules handle compression, downloading,
      screen recording, DVD workflows, subtitles, metadata, and lightweight editing.
    - >
      The macOS guide exposes application settings through the Wondershare UniConverter
      menu. Wondershare ID login is supported for licensed or account-connected
      functions, but the official documentation does not publish a credentials-file
      pathname.
