id: brew:dnstracer
display-name: dnstracer
homepage: https://www.mavetju.org/unix/dnstracer.php
repo: null
docs:
  - https://www.mavetju.org/unix/dnstracer-man.php
  - https://www.mavetju.org/unix/dnstracer.php
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dnstracer's adoption is mostly as a packaged Unix DNS diagnostic, not as an
      actively branded upstream project. Homebrew and other Unix package managers keep
      it available because it does one old-school job that overlaps with, but is not
      identical to, dig +trace.
  package-nerd-significance:
    - >
      dnstracer is package-nerd significant as a fossil utility that still earns a slot
      in package managers: no service, no config, no credentials, just a compact DNS
      delegation tracer whose behavior is easy to compare across Unix systems.
  project-history:
    - >
      The Mavetju project page explains dnstracer as a tool that determines where a DNS
      server gets information from and follows the chain of DNS servers back to the
      servers that know the data. The page revision marker is from November 2002, and
      the man-page source marker is from January 2002.
    - >
      The manual page, dated July 8, 2004, documents the classic behavior: send
      non-recursive queries, follow authority records, detect lame servers, and stop
      after all name servers are queried. The official 1.9 source tarball was still
      being served by the Mavetju site with a 2008 last-modified timestamp.
  related-projects:
    - >
      dig +trace is the common modern comparison point for DNS delegation tracing.
      traceroute is the conceptual naming relative, but dnstracer traces DNS authority
      paths rather than network hops.
  sources:
    - https://www.mavetju.org/unix/dnstracer.php
    - https://www.mavetju.org/unix/dnstracer-man.php
    - http://www.mavetju.org/download/dnstracer-1.9.tar.gz
    - https://formulae.brew.sh/formula/dnstracer
  summary:
    - >
      dnstracer is a small DNS troubleshooting tool that follows the delegation chain
      for a name back toward authoritative servers. Its history is thinly documented,
      but the official pages show an early-2000s Unix utility aimed at explaining how
      DNS answers are reached.
  timeline:
    - >
      2002: Mavetju dnstracer project and man-page revision markers appear on the
      official pages.
    - '2004: Manual page dated July 8, 2004.'
    - >
      2008: Official dnstracer 1.9 source tarball served with a February 10
      last-modified timestamp.
    - '2026: Homebrew still carries dnstracer as a packaged DNS diagnostic.'
  usage:
    - >
      Users run dnstracer with a domain name and optional query type or starting server.
      It is useful for visualizing referrals, cached answers, authoritative answers,
      missing glue, lame servers, and PTR/SOA/MX tracing paths.
related-packages:
  - id: brew:bind
    reason: >
      BIND's dig +trace is the better-supported alternative for iterative delegation
      tracing and also enables DNSSEC-oriented trace behavior, while dnstracer offers a
      dedicated tree-style authority-chain view and lame-server detection.
    rel: alternative
    sources:
      - https://www.mavetju.org/unix/dnstracer-man.php
      - https://bind9.readthedocs.io/en/stable/manpages.html#dig-dns-lookup-utility
category: networking
