history:
  adoption-history:
    - >
      TranscribeX is distributed directly for macOS and through Homebrew Cask. Its
      official feature set broadened from file transcription and speaker diarization
      into batch workflows, meeting capture, live captions, dictation, calendar
      matching, AI summaries, automatic export, and command-line automation.
  package-nerd-significance:
    - >
      TranscribeX packages modern speech models into a local-first Mac application and
      exposes both CLI and Model Context Protocol automation. It is representative of a
      newer class of desktop AI tools that download models locally while allowing
      optional bring-your-own-provider integrations.
  project-history:
    - >
      The official changelog records public releases by October 2025, when TranscribeX
      already supported speaker diarization and macOS Tahoe. Subsequent 2025 releases
      added batch processing, folder monitoring, local-model integrations, voice
      profiles, and Apple Foundation Models support.
    - >
      During 2026 the application expanded into meeting automation, real-time
      transcription, translation, dictation, calendar integration, and automated
      summaries and exports. CLI and Model Context Protocol support arrived in August
      2026.
  related-projects:
    - OpenAI Whisper
    - WhisperKit
    - NVIDIA Parakeet
    - Qwen ASR
    - Ollama
    - Apple Intelligence
  sources:
    - https://www.transcribex.io/
