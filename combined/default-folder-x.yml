homepage: https://www.stclairsoft.com/DefaultFolderX/
repo: null
docs:
  - https://www.stclairsoft.com/DefaultFolderX/faq.html
  - https://www.stclairsoft.com/DefaultFolderX/guide/EN.pdf
  - https://www.stclairsoft.com/DefaultFolderX/release.html
config-file-location:
  macos:
    - ~/Library/Preferences/com.stclairsoft.DefaultFolderX5.plist
    - ~/Library/Application Support/com.stclairsoft.DefaultFolderX5/
credentials-file-location: null
history:
  adoption-history:
    - >
      Default Folder X has persisted across multiple generations of macOS, with official
      release notes documenting compatibility work for changing file-dialog behavior,
      Intel and Apple silicon Macs, Finder alternatives, cloud-storage services, and
      macOS accessibility and privacy controls.
  package-nerd-significance:
    - >
      It is a representative long-lived commercial Mac utility: Homebrew Cask users can
      automate installation of an application whose value comes from deeply extending a
      standard operating-system workflow.
    - >
      Its documented preference plist and Application Support directory are useful to
      administrators who back up or migrate application state.
  project-history:
    - >
      St. Clair Software developed Default Folder X to augment macOS Open and Save
      dialogs. The application evolved beyond default-folder selection to include
      favorite and recent folders, Finder-window access, metadata previews, shortcuts,
      folder sets, and integrations with other file-management tools.
  related-projects:
    - macOS Finder
    - Path Finder
    - ForkLift
    - Homebrew Cask
  sources:
    - https://www.stclairsoft.com/DefaultFolderX/faq.html
    - https://www.stclairsoft.com/DefaultFolderX/guide/EN.pdf
    - https://www.stclairsoft.com/DefaultFolderX/release.html
    - source_facts.package-manager
  summary:
    - >
      Default Folder X is a commercial macOS file-navigation utility from St. Clair
      Software. It enhances native Open and Save dialogs with faster access to default,
      favorite, recent, and Finder-visible folders.
  timeline:
    - >
      Version 5 era: The product moved its user guide online and expanded modern macOS
      integration.
    - '2020: Version 5.5 added macOS Big Sur support and a universal Intel/Apple-silicon build.'
    - '2023: Version 6 became a paid upgrade for licenses purchased before March 2023.'
    - '2026: Official release information lists the 6.2 series.'
  usage:
    - >
      Users launch Default Folder X alongside ordinary Mac applications, then use its
      controls and shortcuts inside native file dialogs. Common workflows include
      jumping to favorite or recently used folders, assigning application-specific
      default folders, copying paths, previewing files, and opening folders in Finder or
      a terminal.
category: productivity
