id: brew:codespell
display-name: codespell
homepage: https://github.com/codespell-project/codespell
repo: https://github.com/codespell-project/codespell
docs:
  - https://github.com/codespell-project/codespell/wiki
  - https://github.com/codespell-project/codespell#readme
config-file-location:
  unix:
    - pyproject.toml
    - setup.cfg
    - .codespellrc
credentials-file-location: null
history:
  adoption-history:
    - >
      codespell became useful package-manager material because it has a small CLI
      surface, needs no service credentials, and fits easily into automated checks. The
      supplied package facts list it across Homebrew, Debian, Fedora/dnf, MacPorts, Nix,
      Arch/pacman, Ubuntu, and openSUSE/zypper, and the upstream README documents a
      pre-commit hook configuration.
  package-nerd-significance:
    - >
      For packagers and release engineers, codespell is a classic low-friction quality
      gate: it is deterministic, text-oriented, and easy to wire into CI, pre-commit,
      and distro packaging checks without needing network access or secrets.
  project-history:
    - >
      The project traces its original script and library copyright to Lucas De Marchi
      and ProFUSION embedded systems in 2010-2011. Its maintained upstream is the
      codespell-project GitHub repository, which the official README identifies as both
      the GitHub project and repository.
  related-projects:
    - >
      The upstream README documents use with pre-commit and notes dictionaries
      influenced by common-misspelling data, with project-specific dictionary additions
      maintained in the repository.
  sources:
    - https://github.com/codespell-project/codespell#readme
    - https://api.github.com/repos/codespell-project/codespell
  summary:
    - >
      codespell is a Python command-line spell checker for source trees and text files.
      Its niche is deliberately narrow: it looks for known common misspellings rather
      than trying to act as a full dictionary-based spell checker.
  timeline:
    - >
      2010-2011: Original Python script and library copyright dates appear in the
      upstream README.
    - '2011: The official GitHub repository metadata records repository creation on January 28.'
    - >
      README: codespell documents pyproject.toml, setup.cfg, .codespellrc, pre-commit
      usage, and bundled dictionaries derived from common-misspelling lists.
  usage:
    - >
      The CLI is normally run against a working tree or selected paths, with dry-run
      output by default and an optional write mode for applying fixes. Configuration is
      intentionally repository-local: codespell reads pyproject.toml, setup.cfg,
      .codespellrc, or a file passed on the command line.
related-packages:
  - id: brew:pre-commit
    reason: >
      codespell publishes an official pre-commit hook, so pre-commit can enforce the
      repository's spelling policy before commits and in CI.
    rel: adjacent_workflow
    sources:
      - https://github.com/codespell-project/codespell#pre-commit-hook
      - https://pre-commit.com/
category: developer-tools
package-manager:
  brew: codespell
  debian: codespell
  dnf: codespell
  macports: codespell
  nix: codespell
  pacman: codespell
  ubuntu: codespell
  zypper: codespell
package-manager-url: https://formulae.brew.sh/formula/codespell
license: GPL-2.0-only
tags:
  - cli
  - code-quality
  - linting
  - spell-checking
  - text-processing
description: Fix common misspellings in source code and text files
executables:
  - codespell
provenance:
  formula: codespell
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
