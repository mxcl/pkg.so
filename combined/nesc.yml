id: brew:nesc
display-name: nesC
homepage: https://github.com/tinyos/nesc
repo: https://github.com/tinyos/nesc
docs:
  - https://github.com/tinyos/nesc#readme
  - https://github.com/tinyos/nesc/tree/master/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nesC's adoption followed TinyOS adoption in academic and embedded-sensor research.
      It was not a general-purpose C successor; it was a domain-specific language for
      mote applications where static allocation, event callbacks, interrupt-driven
      execution, and compile-time race checks mattered. Its examples and papers connect
      it to TinyDB, Mate, Surge, and other sensor-network applications.
    - >
      In package-manager terms, nesC is a legacy research/runtime tool kept installable
      for people building old TinyOS code or studying sensor-network systems. The av.db
      source record shows Homebrew and MacPorts packaging. The Homebrew formula API
      reported stable version 1.4.0 and 1 install-on-request event in the prior 30 days
      when checked on 2026-07-01.
  package-nerd-significance:
    - >
      nesC is important less because of present install volume and more because it
      records a complete research-era software stack: a language, compiler, operating
      system, component model, and hardware class co-designed for wireless sensor
      networks. It is the opposite of a random CLI; it is a fossil with real lineage.
  project-history:
    - >
      The nesC home page defines it as a C extension designed to embody TinyOS
      structuring concepts and execution model. TinyOS targeted sensor network nodes
      with very limited resources; the nesC page gives examples such as 8 KB of program
      memory and 512 bytes of RAM. The language built programs from wired components
      with provided and used interfaces, bidirectional commands/events, static linking,
      and whole-program compilation.
    - >
      The 2003 PLDI paper by David Gay, Philip Levis, Robert von Behren, Matt Welsh,
      Eric Brewer, and David Culler presented nesC as a systems language for motes: tiny
      low-power nodes running concurrent reactive programs under severe memory and power
      constraints. The paper states that nesC had been used to implement TinyOS and
      significant sensor applications, and that nesC and TinyOS had been adopted by a
      large number of sensor-network research groups. In the introduction it says TinyOS
      was in use by more than 100 research groups worldwide.
    - >
      The GitHub repository appears to be a later master repository: GitHub metadata
      retrieved on 2026-07-01 shows it created on 2012-12-17, archived, written mostly
      in C, with 107 stars and 54 forks. That repository status reflects the post-peak
      maintenance state, not the language's early-2000s research impact.
  related-projects:
    - TinyOS
    - TinyDB
    - Mate
    - Surge
    - wireless sensor networks
    - motes
  sources:
    - https://api.github.com/repos/tinyos/nesc
    - https://csl.stanford.edu/~pal/pubs/nesc-pldi03.pdf
    - https://formulae.brew.sh/api/formula/nesc.json
    - https://github.com/tinyos/nesc
    - https://nescc.sourceforge.net/
  summary:
    - >
      nesC is an extension of C designed for TinyOS and deeply networked embedded
      systems, especially wireless sensor-network motes. It is historically significant
      because it was the programming language that embodied TinyOS's component model,
      event-driven execution, split-phase operations, and whole-program analysis for
      extremely memory-constrained devices.
  timeline:
    - >
      2003: PLDI paper 'The nesC Language: A Holistic Approach to Networked Embedded
      Systems' published.
    - '2012-12-17: tinyos/nesc GitHub repository created as the master repository.'
    - >
      2018-12-16: GitHub metadata showed the repository's last push date when checked on
      2026-07-01.
    - '2026-07-01: Homebrew API reported stable version 1.4.0.'
  usage:
    - >
      Users invoke `nescc` to compile TinyOS/nesC applications, with helper tools such
      as `nescc-mig`, `nescc-ncg`, and `nescc-wiring` for message/interface generation
      and wiring inspection. Practical use is mostly historical TinyOS development,
      reproducing academic sensor-network projects, and maintaining code for mote
      platforms.
