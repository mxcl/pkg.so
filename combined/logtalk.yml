id: brew:logtalk
display-name: Logtalk
homepage: https://logtalk.org/
repo: https://github.com/LogtalkDotOrg/logtalk3
docs:
  - https://logtalk.org/documentation.html
  - https://logtalk.org/handbook/index.html
config-file-location:
  unix:
    - $LOGTALK_STARTUP_DIRECTORY/settings.lgt
    - $LOGTALKUSER/settings.lgt
    - ~/settings.lgt
    - $XDG_CONFIG_HOME/logtalk/settings.lgt
    - ~/.config/logtalk/settings.lgt
  windows:
    - '%USERPROFILE%\settings.lgt'
    - '%APPDATA%\Logtalk\settings.lgt'
credentials-file-location: null
history:
  adoption-history:
    - >
      Logtalk is specialized rather than mainstream, but it has had unusually long
      continuity for a language package. The official site provides installers and
      documentation, and the supplied package facts list availability through Homebrew,
      MacPorts, and Windows Package Manager.
    - >
      Its adoption is tied to the Prolog ecosystem: Logtalk offers a common
      object-oriented and component-oriented layer above multiple backend Prolog
      compilers, so package managers tend to expose many integration scripts such as
      `swilgt`, `gplgt`, `sicstuslgt`, and others.
  package-nerd-significance:
    - >
      Logtalk matters in package history because it is a rare long-running
      logic-language layer whose package surface is mostly integration scripts.
      Maintaining it is less about one binary and more about connecting a portable
      language implementation to many Prolog backends and documentation tools.
  project-history:
    - >
      The Logtalk project began in January 1998. Official Logtalk materials state that
      the first public alpha appeared in July 1998, the first public beta in October
      1998, and the first stable 2.0 release in February 1999.
    - >
      Logtalk's third generation started in 2012, with the first public alpha in August
      2012 and the stable 3.0.0 release in January 2015. The official GitHub repository
      for `logtalk3` was created in August 2012, matching that third-generation
      development line.
    - >
      The upstream README describes Logtalk as a portable trans-compiler that can use
      most modern standards-compliant Prolog systems as backend compilers. Its
      distribution includes documentation, tutorials, libraries, developer tools,
      examples, man pages, and release notes.
  related-projects:
    - >
      Logtalk is designed to run on top of backend Prolog systems, including SWI-Prolog,
      GNU Prolog, SICStus Prolog, XSB, YAP, and others documented by its integration
      scripts.
    - >
      It is related to Prolog module systems, object-oriented Prolog extensions, and
      multi-paradigm logic programming environments.
  sources:
    - https://api.github.com/repos/LogtalkDotOrg/logtalk3
    - https://github.com/LogtalkDotOrg/logtalk3#readme
    - https://logtalk.org/documentation.html
    - https://logtalk.org/handbook/index.html
    - https://logtalk.org/manuals/userman/programming.html
    - source_facts.package-manager
  summary:
    - >
      Logtalk is a declarative object-oriented logic programming language that extends
      Prolog with encapsulation, code reuse, protocols, categories, events, and tooling
      for programming in the large.
  timeline:
    - '1998: Project started in January; first public alpha released in July.'
    - '1999: First stable 2.0 release published in February.'
    - '2012: Third-generation development starts and the `logtalk3` repository is created.'
    - '2015: Logtalk 3.0.0 stable release published.'
    - '2026: Logtalk 3.100.x tags appear in the official repository.'
  usage:
    - >
      Users run Logtalk through backend-specific integration scripts and load `.lgt`
      source files. The manual documents `settings.lgt` files for customizing compiler
      flags and library paths, searched from startup, user, home, and platform config
      directories.
    - >
      The package also ships documentation conversion and testing tools such as
      `lgt2html`, `lgt2md`, `lgt2pdf`, and `logtalk_tester`, making it both a language
      runtime and a developer-tool suite.
related-packages:
  - id: brew:swi-prolog
    reason: >
      Install SWI-Prolog as a supported Logtalk backend and use the `swilgt` integration
      command for a feature-rich interactive Prolog environment.
    rel: adjacent_workflow
    sources:
      - https://logtalk.org/download.html
      - https://logtalk.org/documentation.html
      - https://www.swi-prolog.org/
  - id: brew:gnu-prolog
    reason: >
      Install GNU Prolog as a supported Logtalk backend and use `gplgt` when native-code
      compilation and GNU Prolog's constraint-solving environment suit the application.
    rel: adjacent_workflow
    sources:
      - https://logtalk.org/download.html
      - https://logtalk.org/manuals/userman/programming.html
      - http://www.gprolog.org/
category: language-runtime
package-manager:
  brew: logtalk
  macports: logtalk
  winget: Logtalk.Logtalk
package-manager-url: https://formulae.brew.sh/formula/logtalk
license: Apache-2.0
