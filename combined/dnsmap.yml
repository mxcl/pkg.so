id: brew:dnsmap
display-name: dnsmap
homepage: https://github.com/resurrecting-open-source-projects/dnsmap
repo: https://github.com/resurrecting-open-source-projects/dnsmap
docs:
  - https://github.com/resurrecting-open-source-projects/dnsmap#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dnsmap has stronger package-manager persistence than many small recon tools. It
      appears in Homebrew, Debian and Ubuntu, Fedora/DNF, and Nix, which suggests a long
      tail of security-training, lab, and audit usage even after newer enumeration tools
      appeared.
  package-nerd-significance:
    - >
      dnsmap matters as a preserved recon artifact: package managers keep a small, older
      DNS brute-forcer installable because it is easy to audit, easy to script, and
      still teaches the shape of subdomain-enumeration workflows.
  project-history:
    - >
      The maintained GitHub repository identifies dnsmap as a resurrected open-source
      project and preserves the classic dnsmap and dnsmap-bulk tools. Its README
      describes the utility as a passive DNS network mapper, also known as a subdomains
      brute-forcer.
    - >
      dnsmap predates the wave of Go and Python recon frameworks; its appeal was that it
      was small, scriptable, and close to the Unix style of running a focused tool
      against a domain and capturing the output.
  related-projects:
    - >
      Related tools include dnsgen for candidate generation, massdns and other
      high-speed resolvers for checking large candidate sets, and broader reconnaissance
      frameworks that automate subdomain discovery.
  sources:
    - https://github.com/resurrecting-open-source-projects/dnsmap
    - https://github.com/resurrecting-open-source-projects/dnsmap#readme
    - https://formulae.brew.sh/formula/dnsmap
  summary:
    - >
      dnsmap is a command-line DNS network mapper and subdomain brute-forcer. It is part
      of the older web-application reconnaissance tradition where small C tools
      enumerated likely hostnames from wordlists.
  timeline:
    - '2000s: dnsmap circulates as a compact DNS mapping and subdomain brute-force utility.'
    - >
      2010s: Linux security distributions and general-purpose package managers continue
      carrying dnsmap.
    - >
      2020s: The resurrecting-open-source-projects repository keeps the source available
      for modern packaging.
  usage:
    - >
      Users run dnsmap against a target domain with a wordlist to discover hostnames
      that resolve. dnsmap-bulk extends that workflow to multiple domains, making the
      package useful in older penetration-testing scripts and quick DNS inventory
      passes.
related-packages:
  - id: brew:subfinder
    reason: >
      Subfinder is a passive alternative when the goal is to collect subdomains from
      online sources without dnsmap's active dictionary-based brute forcing.
    rel: alternative
    sources:
      - https://github.com/resurrecting-open-source-projects/dnsmap
      - https://github.com/projectdiscovery/subfinder
  - id: brew:amass
    reason: >
      OWASP Amass is a broader alternative when an assessment needs multi-technique
      asset discovery and attack-surface mapping rather than dnsmap's focused wordlist
      scan.
    rel: alternative
    sources:
      - https://github.com/resurrecting-open-source-projects/dnsmap
      - https://github.com/owasp-amass/amass
category: security
package-manager:
  brew: dnsmap
  debian: dnsmap
  dnf: dnsmap
  nix: dnsmap
  ubuntu: dnsmap
package-manager-url: https://formulae.brew.sh/formula/dnsmap
license: GPL-2.0-or-later AND GPL-3.0-or-later
tags:
  - cli
  - dns
  - network-mapping
  - security-testing
  - subdomain-enumeration
description: Passive DNS network mapper (a.k.a. subdomains bruteforcer)
executables:
  - dnsmap
  - dnsmap-bulk
provenance:
  formula: dnsmap
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
