id: brew:ghc
display-name: Glasgow Haskell Compiler
homepage: https://haskell.org/ghc/
repo: https://gitlab.haskell.org/ghc/ghc
docs:
  - https://downloads.haskell.org/ghc/9.14.1/docs/users_guide
  - https://ghc.gitlab.haskell.org/ghc/doc
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ghc/ghci.conf
    - ~/.ghc/ghci.conf
    - ./.ghci
  windows:
    - '%APPDATA%\ghc\ghci.conf'
    - .\.ghci
credentials-file-location: null
history:
  adoption-history:
    - >
      GHC became the dominant implementation around which the Haskell ecosystem
      organized. The AOSA chapter by Simon Marlow and Simon Peyton Jones described
      hundreds of thousands of downloads, thousands of Hackage packages, undergraduate
      teaching use, and commercial use; the GHC site likewise points users to Hackage
      libraries, Haskell Language Server, Cabal, Stack, and GHCup.
    - >
      The Homebrew `ghc` formula packages the general GHC track for macOS users, while
      separate versioned formulae let projects select older or branch-specific compiler
      lines. That split mirrors the way Haskell projects often pin compiler versions
      because language extensions, boot libraries, and package ABI compatibility can
      matter.
  package-nerd-significance:
    - >
      GHC is package-manager significant because it is both a compiler and a dependency
      root for much of the Haskell toolchain. Installing the formula affects not only
      `ghc`, but also GHCi, boot libraries, package metadata, Haddock, profiling tools,
      and the versioned executable names that allow scripts to target a specific
      compiler.
    - >
      The project also embodies a classic language-runtime packaging problem: the
      compiler is written in Haskell and needs an existing GHC to build, while libraries
      compiled by one branch may need rebuilding for another. Versioned formulae, GHCup
      metadata, and project-level pinning all grew around those realities.
  project-history:
    - >
      GHC began at the University of Glasgow near the beginning of the 1990s as an
      academic research project funded by the UK government. Its stated goals were
      practical as well as academic: make a robust and portable Haskell compiler freely
      available, provide a modular foundation for compiler research, and learn from real
      programs.
    - >
      The compiler evolved into a self-hosted Haskell implementation with three major
      pieces: the compiler, boot libraries, and the runtime system. The runtime system
      became central to GHC's identity because it handles garbage collection,
      scheduling, profiling, exceptions, and the execution machinery linked into
      compiled Haskell programs.
  related-projects:
    - >
      Hackage is the package repository that distributes Haskell libraries built for use
      with GHC and other tooling.
    - GHCup is the Haskell installer that installs GHC along with related tools.
    - >
      Cabal, Stack, Haddock, Happy, Alex, and Haskell Language Server form the
      surrounding toolchain named by GHC's own documentation.
  sources:
    - https://downloads.haskell.org/ghc/9.14.1/docs/users_guide/intro.html
    - https://formulae.brew.sh/formula/ghc
    - https://gitlab.haskell.org/ghc/ghc
    - https://www.aosabook.org/en/v2/ghc.html
    - https://www.haskell.org/ghc/
    - https://www.haskell.org/ghcup/
  summary:
    - >
      The Glasgow Haskell Compiler, usually called GHC, is the reference-grade
      open-source compiler and interactive environment for Haskell. It supplies the
      `ghc` compiler, the GHCi interpreter, package tools such as `ghc-pkg`,
      documentation tooling such as Haddock, and runtime-system support for profiling,
      parallelism, and native-code execution.
  timeline:
    - '1990: Haskell was created as a common lazy functional language for research.'
    - >
      Early 1990s: GHC began as a Glasgow research project with portability,
      performance, and extensibility goals.
    - >
      2007: The GHC user guide documented the even-numbered stable-branch versioning
      policy starting with GHC 6.8.
    - >
      2011: The AOSA chapter described GHC as an industrial-strength compiler used in
      teaching, research, and commercial settings.
    - >
      2025: GHC 9.14.1 release artifacts provided the branch represented by the
      unversioned Homebrew executable names in this batch input.
  usage:
    - >
      Practitioners use `ghc` for batch compilation, `ghci` for interactive development,
      `runghc` or `runhaskell` for scripts, `ghc-pkg` for package database inspection,
      and Haddock for API documentation. The user guide presents GHC as one program that
      can operate as either an interactive interpreter or a batch compiler.
    - >
      Build tools such as Cabal and Stack commonly invoke GHC rather than requiring
      users to call every compiler flag by hand. Advanced users still care about GHC
      flags directly for optimisation, profiling, language extensions, cross-platform
      builds, and debugging package database or linker issues.
related-packages:
  - id: brew:ghcup
    reason: >
      GHC's official homepage recommends GHCup as an installation and version-selection
      route for GHC and its companion Haskell tools.
    rel: adjacent_workflow
    sources:
      - https://ghc.gitlab.haskell.org/homepage/
      - https://www.haskell.org/ghcup/guide/
  - id: brew:cabal-install
    reason: >
      cabal-install resolves dependencies and orchestrates Haskell project builds,
      invoking GHC to compile the selected packages and project targets.
    rel: adjacent_workflow
    sources:
      - https://cabal.readthedocs.io/en/stable/getting-started.html
      - https://ghc.gitlab.haskell.org/homepage/
  - id: brew:haskell-stack
    reason: >
      Stack can install or select GHC and then drive reproducible, snapshot-based
      Haskell project builds with that compiler.
    rel: adjacent_workflow
    sources:
      - https://ghc.gitlab.haskell.org/homepage/
      - https://docs.haskellstack.org/en/stable/topics/stack_work/
