id: brew:dbxml
display-name: Berkeley DB XML
homepage: https://www.oracle.com/database/technologies/related/berkeleydb.html
repo: null
docs:
  - https://docs.oracle.com/cd/E17276_01/html/programmer_reference_xml/index.html
  - https://www.oracle.com/database/technologies/berkeleydb-xml-faq.html
config-file-location:
  unix: <database-home>/DB_CONFIG
credentials-file-location: null
history:
  adoption-history:
    - >
      Berkeley DB XML belongs to the embedded-database tradition rather than the
      client/server database tradition. Oracle's FAQ lists C++, Java, Perl, PHP, Python,
      and Tcl interfaces, so adoption was mostly through applications that linked the
      library or scripted it locally, not through users connecting to a network daemon.
    - >
      The product is also a period marker for the 2000s XML-database wave. It appealed
      to applications with non-tabular, frequently changing, document-shaped data, where
      an XML repository reduced the mismatch between the application model and
      relational tables.
  package-nerd-significance:
    - >
      dbxml is a preserved slice of database packaging history: an embeddable XML
      database installed as libraries plus command-line utilities. It is interesting
      precisely because it is neither a modern document service nor a plain key-value
      store; it packages a whole native-XML data-management worldview into a local Unix
      toolchain.
  project-history:
    - >
      The project grew out of the Berkeley DB family after native XML databases became a
      practical answer to document-centric data. Oracle's Programmer's Reference Guide
      describes Berkeley DB XML as a C++ library built around Berkeley DB storage and
      XML/XQuery components, with documentation for Unix, Windows, language APIs,
      upgrades, and the dbxml command-line shell.
    - >
      Its long manual history is visible in Oracle's upgrade and changelog sections,
      which cover the 1.2 line, the 2.0 through 2.5 series, and 6.0.x releases. The
      product's technical story is not only file storage: it was about storing XML
      documents in containers, indexing nodes and metadata, and running XQuery directly
      against those containers.
  related-projects:
    - >
      Berkeley DB XML is closely tied to Berkeley DB, XQilla, Xerces-C, and the language
      bindings documented by Oracle for C++, Java, Perl, PHP, Python, and Tcl.
  sources:
    - https://docs.oracle.com/cd/E17276_01/html/programmer_reference_xml/index.html
    - https://www.oracle.com/database/technologies/berkeleydb-xml-faq.html
  summary:
    - >
      Berkeley DB XML is Oracle's embeddable XML database product for applications that
      wanted native XML storage, indexing, and XQuery without running a separate
      database server. In package terms it sits at the intersection of Berkeley DB, XML
      databases, and local command-line database tooling.
  timeline:
    - "1.2 era: Oracle's guide records Berkeley DB XML 1.2.0 and 1.2.1 changelog sections."
    - '2.x era: Upgrade notes cover 2.0, 2.1, 2.2, 2.3, 2.4, and 2.5 transitions.'
    - >
      2015: Oracle's Berkeley DB XML Programmer's Reference Guide for library version
      12.1.6.0 is dated July 10, 2015.
    - "6.0 era: Oracle's documentation includes 6.0.17 and 6.0.18 changelog sections."
  usage:
    - >
      Typical use is to create Berkeley DB XML containers, insert XML documents, define
      indexes, and query them with XQuery or XPath-style expressions. The Homebrew
      package exposes the dbxml shell and dump/load utilities, which makes it useful for
      local inspection, export/import, and small reproducible database experiments.
    - >
      The FAQ emphasizes operational concerns familiar to embedded-database users: large
      documents, node storage containers, explicit resource cleanup in Java bindings,
      thread-sharing rules for manager/container/query objects, and careful
      configuration of validation and external access.
related-packages:
  - id: brew:berkeley-db
    reason: >
      Use Berkeley DB alongside Berkeley DB XML when an application needs direct access
      to the embedded key/value and transactional storage layer on which the XML
      database is built.
    rel: adjacent_workflow
    sources:
      - https://docs.oracle.com/cd/E17276_01/html/programmer_reference_xml/intro.html
      - https://www.oracle.com/database/technologies/related/berkeleydb.html
  - id: brew:xqilla
    reason: >
      XQilla is useful for standalone or embedded XQuery and XPath processing because
      Oracle documents it as the query engine used by Berkeley DB XML.
    rel: adjacent_workflow
    sources:
      - https://www.oracle.com/database/technologies/berkeleydb-xml-faq.html
      - https://xqilla.sourceforge.net/
  - id: brew:xerces-c
    reason: >
      Xerces-C++ complements Berkeley DB XML when an application also needs direct XML
      parsing or validation, and Oracle identifies it as the parser beneath XQilla and
      DB XML.
    rel: adjacent_workflow
    sources:
      - https://www.oracle.com/database/technologies/berkeleydb-xml-faq.html
      - https://xerces.apache.org/xerces-c/
category: data
package-manager:
  brew: dbxml
  nix: dbxml
package-manager-url: https://formulae.brew.sh/formula/dbxml
