id: brew:k6
display-name: Grafana k6
homepage: https://k6.io
repo: https://github.com/grafana/k6
docs:
  - https://grafana.com/docs/k6/latest
config-file-location:
  macos: ~/Library/Application Support/k6/config.json
  unix: ~/.config/k6/config.json
credentials-file-location:
  macos: ~/Library/Application Support/k6/config.json
  unix: ~/.config/k6/config.json
history:
  adoption-history:
    - >
      k6 adoption grew from teams wanting scripted, automatable load testing without
      older GUI-heavy workflows. Its JavaScript API, CLI-first design, thresholds, CI
      integrations, and Grafana/Prometheus-friendly metrics made it attractive to
      developers, SREs, QA engineers, and platform teams.
    - >
      After the Grafana acquisition, k6 became part of a broader observability loop:
      generate load with k6, observe behavior in Grafana-backed systems, and use cloud
      or Kubernetes execution when local tests are not enough.
  package-nerd-significance:
    - >
      k6 is significant because it made load testing feel like a normal developer CLI
      dependency: install a binary, commit scripts, run in CI, and export metrics. Its
      Go-plus-JavaScript architecture also makes it an interesting packaging target: a
      single executable with an embedded scripting engine and extension ecosystem.
  project-history:
    - >
      k6 began as an open source load-testing tool from Load Impact, with public
      releases visible from 2017. It combined a Go runtime with JavaScript test scripts,
      aiming to make load tests feel like code that developers could keep with
      application projects.
    - >
      Load Impact rebranded around k6 in 2020, including the GitHub repository move from
      `loadimpact/k6` to `k6io/k6`. Grafana Labs acquired the Stockholm-based k6 company
      in June 2021 and folded the project into Grafana's observability stack.
    - >
      In 2025, Grafana announced k6 1.0 as a general-availability milestone with
      Semantic Versioning, stability guarantees, TypeScript support, native
      extensibility, and a stronger long-term support story.
  related-projects:
    - >
      k6 is related to Grafana, Grafana Cloud k6, Prometheus-style metrics workflows,
      xk6 extensions, the k6 Kubernetes operator, and older load-testing tools such as
      JMeter, Gatling, and Locust.
  sources:
    - https://community.grafana.com/t/k6-v0-31-0-is-out/95803
    - https://github.com/grafana/k6
    - https://github.com/grafana/k6/releases/tag/v0.6.0
    - https://grafana.com/blog/grafana-k6-1-0-release/
    - https://grafana.com/oss/k6/
    - >
      https://grafana.com/press/2021/06/17/grafana-labs-brings-modern-open-source-load-testing-to-observability-with-acquisition-of-k6/
    - https://k6.io/about/
  summary:
    - >
      Grafana k6 is an open source load and performance testing tool written in Go with
      test scripts authored in JavaScript or TypeScript, designed for developer-friendly
      reliability testing from local runs through cloud and CI workflows.
  timeline:
    - '2017: k6 public releases were published under the Load Impact era.'
    - >
      2020: Load Impact rebranded to k6 and moved the GitHub repository to the k6
      organization.
    - '2021: Grafana Labs acquired k6 on June 17.'
    - '2025: Grafana announced k6 1.0 with stability guarantees and Semantic Versioning.'
  usage:
    - >
      Users write test scenarios in JavaScript or TypeScript and run them with `k6 run`,
      often checking thresholds in CI. More advanced setups send metrics to
      observability backends, run distributed tests, use extensions, or execute tests
      through Grafana Cloud k6.
related-packages:
  - id: brew:jmeter
    reason: >
      Apache JMeter is a mature Java-based alternative with GUI-authored `.jmx` test
      plans and CLI load execution, while k6 emphasizes code-first JavaScript or
      TypeScript tests and a single CLI binary.
    rel: alternative
    sources:
      - https://grafana.com/docs/k6/latest/
      - https://jmeter.apache.org/usermanual/get-started.html
      - https://jmeter.apache.org/usermanual/best-practices.html
  - id: brew:grafana
    reason: >
      Grafana is the natural visualization companion for k6 results, and Grafana
      documents dashboards and cloud workflows that correlate load-test output with
      operational telemetry.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/k6/latest/results-output/grafana-dashboards/
      - https://grafana.com/docs/grafana/latest/
  - id: brew:prometheus
    reason: >
      k6 can send real-time test metrics through Prometheus remote write, allowing
      Prometheus-compatible storage and queries to participate in the
      performance-testing workflow.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/k6/latest/results-output/real-time/prometheus-remote-write/
      - https://prometheus.io/docs/specs/prw/remote_write_spec/
category: developer-tools
package-manager:
  brew: k6
  chocolatey: k6
  macports: k6
  nix: k6
  scoop: main/k6
  winget: GrafanaLabs.k6
  zypper: k6
package-manager-url: https://formulae.brew.sh/formula/k6
license: AGPL-3.0-or-later
tags:
