id: brew:mcp-server-chart
display-name: mcp-server-chart
homepage: https://github.com/antvis/mcp-server-chart
repo: https://github.com/antvis/mcp-server-chart
docs:
  - https://github.com/antvis/mcp-server-chart#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as the npm package `@antv/mcp-server-chart` and can be
      launched by AI desktop and IDE clients with `npx`. The README also lists HTTP,
      SSE, marketplace, and platform integrations such as Dify, ModelScope, Glama,
      Smithery, and Aliyun.
    - >
      GitHub metadata showed thousands of stars and hundreds of forks by July 2026,
      giving it one of the stronger adoption signals among domain-specific MCP servers.
      Its attraction is obvious for package users: it turns chart rendering into a
      reusable MCP service rather than requiring every agent workflow to ship charting
      code.
  package-nerd-significance:
    - >
      mcp-server-chart is significant because it packages a substantial visualization
      surface as a single MCP server. That is exactly the sort of domain capability
      package managers are good at distributing: install one command, then let multiple
      clients call it through a stable protocol.
    - >
      For MCP ecosystem watchers, it also shows how established JavaScript visualization
      projects moved into AI-agent tooling by wrapping existing rendering services and
      chart grammars as protocol tools.
  project-history:
    - >
      The repository was created under the AntV organization in April 2025. Its README
      describes a TypeScript MCP server built around AntV visualization capabilities and
      intended for chart generation and data analysis.
    - >
      The documented feature set expanded into a broad catalog of chart tools, including
      area, bar, boxplot, column, map, flow, funnel, histogram, line, pie, radar,
      sankey, scatter, treemap, venn, violin, word cloud, and spreadsheet generation.
      The README also connects the server to AntV's chart-visualization skill and
      private deployment options.
  related-projects:
    - AntV is the upstream visualization project family behind the charting capabilities.
    - >
      antvis/chart-visualization-skills is documented as a companion skill for choosing
      chart types.
    - antvis/GPT-Vis provides related rendering infrastructure for private deployments.
  sources:
    - https://api.github.com/repos/antvis/mcp-server-chart
    - https://api.github.com/repos/antvis/mcp-server-chart/releases
    - https://github.com/antvis/mcp-server-chart
    - https://github.com/antvis/mcp-server-chart#readme
    - source_facts.description
  summary:
    - >
      mcp-server-chart is an AntV-maintained MCP server for chart generation,
      visualization, and lightweight data analysis. It exposes more than two dozen chart
      and diagram tools through MCP.
  timeline:
    - '2025: GitHub repository created under antvis/mcp-server-chart.'
    - '2025: README documents 25-plus chart-generation tools through MCP.'
    - '2025: npm and desktop-client usage documented with `@antv/mcp-server-chart`.'
    - '2026: 0.9.x releases continue and repository metadata shows broad adoption.'
  usage:
    - >
      The common desktop-client configuration uses `npx -y @antv/mcp-server-chart` as a
      stdio MCP server command. The CLI can also run with SSE or Streamable HTTP
      transports, with configurable host, port, and endpoint flags.
    - >
      The README documents environment variables for custom chart-generation services,
      service identifiers for generated-record workflows, and disabling selected tools.
      A private deployment path uses AntV's GPT-Vis-SSR service and a
      `VIS_REQUEST_SERVER` environment variable.
related-packages:
  - id: brew:mcptools
    reason: >
      Use MCP Tools to inspect, call, test, or proxy MCP Server Chart over its
      documented stdio or HTTP transports.
    rel: adjacent_workflow
    sources:
      - https://github.com/antvis/mcp-server-chart#readme
      - https://github.com/f/mcptools#readme
  - id: brew:mcpm
    reason: >
      MCPM can provide the discovery, installation, profile, and client-integration
      layer around this otherwise independently configured MCP server.
    rel: adjacent_workflow
    sources:
      - https://github.com/antvis/mcp-server-chart#readme
      - https://mcpm.sh/
