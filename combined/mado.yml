id: brew:mado
display-name: mado
homepage: https://github.com/akiomik/mado
repo: https://github.com/akiomik/mado
docs:
  - https://github.com/akiomik/mado#readme
config-file-location:
  linux:
    - mado.toml
    - .mado.toml
    - ~/.config/mado/mado.toml
  macos:
    - mado.toml
    - .mado.toml
    - ~/.config/mado/mado.toml
  windows:
    - mado.toml
    - .mado.toml
    - ~\AppData\Roaming\mado\mado.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Mado’s official README documents installation through Homebrew, Nix, Arch Linux,
      Scoop, WinGet, and prebuilt release binaries. It also provides GitHub Actions
      usage, which makes the linter relevant both as a local CLI and a CI check.
  package-nerd-significance:
    - >
      Mado is package-nerd relevant because it is a Rust-native alternative in a space
      long occupied by Ruby and Node markdownlint tools. The official benchmark claims a
      large speed advantage on a documentation-sized corpus, which is exactly the sort
      of difference that matters in monorepos and pre-commit or CI lint loops.
  project-history:
    - >
      The project is developed in the akiomik/mado GitHub repository, with Rust source,
      tests, fuzzing, benchmarks, a GitHub Action, and package definitions. Its release
      tags run from v0.1.0 through v0.3.0, and the repository page lists v0.3.0 as the
      latest release on Apr 11, 2025.
  related-projects:
    - >
      Mado is related to markdownlint, markdownlint-cli, markdownlint-cli2, CommonMark,
      and GitHub Flavored Markdown. Its README positions it as mostly
      markdownlint-rule-compatible while emphasizing Rust performance.
  sources:
    - https://github.com/akiomik/mado
    - https://github.com/akiomik/mado#readme
    - https://raw.githubusercontent.com/akiomik/mado/main/README.md
  summary:
    - >
      Mado is a fast Markdown linter written in Rust. The official README states that it
      is compatible with CommonMark and GitHub Flavored Markdown and supports most
      markdownlint rules.
  timeline:
    - 'Public repository: Official Git tags begin at v0.1.0.'
    - '2025: GitHub repository page lists v0.3.0 as the latest release on Apr 11, 2025.'
    - '2025: README documents package-manager installs and GitHub Actions usage for v0.3.0.'
  usage:
    - >
      The basic workflow is `mado check .` or `mado check path/to/*.md`. Configuration
      can be placed in `mado.toml` or `.mado.toml` in the current directory, with global
      configuration under `~/.config/mado/mado.toml` on Linux and macOS and under the
      Roaming AppData path on Windows.
related-packages:
  - id: brew:markdownlint-cli2
    reason: >
      markdownlint-cli2 is a Node-based, configuration-focused Markdown/CommonMark
      linter using the markdownlint library; choose it for the full markdownlint
      ecosystem and flexible configuration, or Mado for a Rust-native implementation and
      its supported-rule subset.
    rel: alternative
    sources:
      - https://github.com/akiomik/mado#readme
      - https://github.com/DavidAnson/markdownlint-cli2
  - id: brew:markdownlint-cli
    reason: >
      markdownlint-cli provides the established Node command-line interface for
      markdownlint rules, while Mado offers a faster Rust implementation that supports
      most, but not all, of those rules.
    rel: alternative
    sources:
      - https://github.com/akiomik/mado#readme
      - https://github.com/igorshubovych/markdownlint-cli
category: developer-tools
package-manager:
  apk: mado
  brew: mado
  nix: mado
  pacman: mado
package-manager-url: https://formulae.brew.sh/formula/mado
license: Apache-2.0
tags:
  - cli
  - linter
  - markdown
  - rust
description: Fast Markdown linter written in Rust
executables:
  - mado
provenance:
  formula: mado
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
