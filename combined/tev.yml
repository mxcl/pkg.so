id: cask:tev
display-name: tev
homepage: https://github.com/Tom94/tev
repo: https://github.com/Tom94/tev
docs:
  - https://github.com/Tom94/tev#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed for macOS, Windows, and Linux and documents
      installation through Homebrew, AUR, Flatpak, Scoop, WinGet, and Nix.
  package-nerd-significance:
    - >
      tev is useful in rendering, graphics, photography, and visual-effects workflows
      because it handles high-dynamic-range and multilayer images, performs image
      comparisons, and exposes a network protocol that renderers and other tools can use
      to update images live.
  project-history:
    - >
      tev is an open-source, cross-platform image viewer developed around accurate HDR
      display and color management. Its scope grew to include many still-image and raw
      formats, metadata and auxiliary channels, image-analysis tools, command-line
      operation, and remote control over a TCP protocol.
    - >
      The project changed licensing after its 1.30 series: the official README states
      that releases through version 1.30 used the BSD 3-Clause license, while current
      development uses GPLv3.
  related-projects:
    - >
      The official README names pbrt version 4 as an example renderer that can use tev
      as a network-controlled display and documents C++, Python, and Rust protocol
      implementations.
  sources:
    - https://github.com/Tom94/tev
    - https://github.com/Tom94/tev/releases
  summary:
    - >
      tev is a fast cross-platform HDR and EDR image viewer with color management,
      image-comparison tools, broad format support, and renderer integration.
  timeline:
    - 'Through version 1.30: tev releases were available under the BSD 3-Clause license.'
    - 'After version 1.30: the project adopted GPLv3 licensing.'
    - >
      Current generation: tev supports graphical, command-line, and network-controlled
      workflows across macOS, Windows, and Linux.
  usage:
    - >
      Users open or drag in images, select reference images for comparison, inspect
      channels and layers, calculate error metrics, adjust exposure and tone mapping, or
      invoke tev with image paths from the command line. Renderers can create and update
      images through tev's TCP protocol.
category: media
package-manager:
  brew-cask: tev
package-manager-url: https://formulae.brew.sh/cask/tev
tags:
  - color-management
  - cross-platform
  - edr
  - hdr
  - image-comparison
  - image-viewer
  - openexr
description: High dynamic range (HDR) image viewer with accurate color management
applications:
  - tev.app
provenance:
  cask: tev
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
