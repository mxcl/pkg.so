  brew: gensio
  debian: gensio-bin
  dnf: gensio
  macports: gsh
  nix: gensio
  pacman: gensio
  ubuntu: gensio-bin
  zypper: gensio
package-manager-url: https://formulae.brew.sh/formula/gensio
