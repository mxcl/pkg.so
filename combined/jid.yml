id: brew:jid
display-name: jid
homepage: https://github.com/simeji/jid
repo: https://github.com/simeji/jid
docs:
  - https://github.com/simeji/jid#readme
config-file-location:
  linux: ~/.config/jid/config.toml
  macos: ~/Library/Application Support/jid/config.toml
  windows: '%AppData%\jid\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      jid found an audience among developers who spend time inspecting API responses,
      logs, and configuration payloads. Its README documents installation through
      Homebrew, MacPorts, FreeBSD pkg, Scoop, direct binary downloads, and `go install`,
      which made it easy to try across Unix and Windows terminals.
    - >
      It complements jq rather than replacing it: jq is the scripting and transformation
      powerhouse, while jid helps users discover paths and shape queries interactively
      before committing them to a script.
  package-nerd-significance:
    - >
      jid is package-nerd candy because it is a small Go CLI aimed squarely at terminal
      ergonomics. It turns JSON discovery into an interactive package, filling the gap
      between raw pager output and jq scripts.
    - >
      Its distribution pattern is also very Go-era: GitHub releases, Homebrew, Scoop,
      MacPorts, and `go install` all coexist as installation paths for the same
      executable.
  project-history:
    - >
      The simeji/jid repository was created in June 2016 and published a 0.1.0 beta
      release the same month. Its README frames the tool as a simple way to navigate
      JSON interactively with filtering queries like jq, but optimized for discovery
      rather than one-shot transformation.
    - >
      The release series quickly added the features expected in a terminal explorer:
      initial query support, help and version flags, scrolling, query history, key
      bindings, and package-manager installation instructions. Later README updates
      document JMESPath expressions and a TOML configuration file.
  related-projects:
    - jq is the command-line JSON processor jid references as a query-style comparison point.
    - >
      JMESPath is the query language support documented by jid for expressions, pipes,
      wildcards, and functions.
    - >
      Go's module tooling is an installation path through `go install
      github.com/simeji/jid/cmd/jid`.
  sources:
    - https://api.github.com/repos/simeji/jid
    - https://api.github.com/repos/simeji/jid/releases
    - https://formulae.brew.sh/formula/jid
    - https://github.com/simeji/jid
    - https://raw.githubusercontent.com/simeji/jid/master/README.md
  summary:
    - >
      jid, short for Json Incremental Digger, is an interactive terminal tool for
      exploring JSON. It lets users drill into JSON documents with incremental queries,
      suggestions, autocomplete, and JMESPath support.
  timeline:
    - '2016: The repository was created and jid 0.1.0 beta was released.'
    - >
      2016: The 0.6.x and 0.7.x releases added initial query, help, version, and
      scrolling features.
    - '2019: The v0.7.4 release continued the 0.7 series.'
    - >
      2024: README updates documented richer interactive behavior, JMESPath support, and
      configuration.
  usage:
    - >
      Typical usage pipes JSON into `jid`, types a dot-path or JMESPath expression, uses
      tab completion to inspect candidate fields, and exits with the selected result. It
      can also start with an initial query or load JSON from a file.
    - >
      The tool is useful when exploring unfamiliar JSON because it shows matches as the
      query is typed and saves query history for repeated inspection sessions.
related-packages:
  - id: brew:jq
    reason: >
      Use jid to discover a JSON path interactively, then jq to automate
      transformations; jid explicitly provides a query-output mode intended for jq.
    rel: adjacent_workflow
    sources:
      - https://github.com/simeji/jid
      - https://jqlang.github.io/jq/manual/
  - id: brew:fx
    reason: >
      Choose fx as an interactive JSON-viewing alternative when you prefer a navigable
      terminal UI and JavaScript expressions instead of jid's dot-path and JMESPath
      interface.
    rel: alternative
    sources:
      - https://github.com/simeji/jid
      - https://fx.wtf/getting-started
category: developer-tools
package-manager:
  brew: jid
  debian: jid
  dnf: jid
  macports: jid
  nix: jid
  scoop: main/jid
  ubuntu: jid
package-manager-url: https://formulae.brew.sh/formula/jid
license: MIT
tags:
  - cli
  - interactive
  - jmespath
  - json
  - query
description: Json incremental digger
executables:
  - jid
provenance:
  formula: jid
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
