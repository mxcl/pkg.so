id: brew:gtrash
display-name: gtrash
homepage: https://github.com/umlx5h/gtrash
repo: https://github.com/umlx5h/gtrash
docs:
  - https://github.com/umlx5h/gtrash#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gtrash entered package-manager culture as a small modern CLI rather than as a
      long-lived Unix base tool. The official README documents installation paths
      through binary releases, Go install, Nixpkgs, Homebrew, and AUR-style packages;
      the input metadata also records Homebrew and Nix packaging.
  package-nerd-significance:
    - >
      gtrash matters to package users who want a Freedesktop-compatible trash CLI with
      Go-style distribution ergonomics. It overlaps with `gio trash` and `trash-cli`,
      but emphasizes a modern TUI, grouped restoration, static binaries, and rm-like
      flags without inventing a private trash format.
  project-history:
    - >
      The public repository was created in January 2024, with its initial commit dated
      2024-01-06 and a v0.0.1 release published on 2024-01-08. The README presents the
      project as a featureful trash CLI manager that can substitute for common rm habits
      while keeping files recoverable.
    - >
      The design focuses on a single static Go binary with multiple subcommands. The
      core operation moves files into a trash location and records .trashinfo metadata,
      while companion commands list, restore, remove, summarize, and repair trash
      entries.
  related-projects:
    - >
      The README positions gtrash alongside `rm`, `gio trash`, `trash-cli`, and `rip`.
      Its technical foundation is the FreeDesktop.org trash specification, so it is most
      related to tools and desktops that share that on-disk trash layout.
  sources:
    - https://api.github.com/repos/umlx5h/gtrash
    - https://api.github.com/repos/umlx5h/gtrash/releases?per_page=100
    - https://github.com/umlx5h/gtrash
    - https://raw.githubusercontent.com/umlx5h/gtrash/main/README.md
    - https://specifications.freedesktop.org/trash-spec/trashspec-1.0.html
  summary:
    - >
      gtrash is a Go command-line trash manager built as a safer shell-facing
      alternative to permanent removal with rm. Its identity is tied to the
      FreeDesktop.org trash specification: on Linux it writes the same trash metadata
      and files layout used by desktop environments and other compliant CLI tools, while
      also offering a TUI-oriented recovery workflow.
  timeline:
    - '2024-01-06: Public repository initial commit.'
    - '2024-01-08: v0.0.1 release published.'
    - >
      2024: README documents package-manager installation through Go install, Nixpkgs,
      Homebrew, and AUR-style packages.
    - '2025: Repository metadata shows continued maintenance activity into 2025.'
  usage:
    - >
      The everyday use case is replacing direct deletion with `gtrash put`, then using
      `gtrash find`, `gtrash restore`, `gtrash restore-group`, `gtrash summary`, or
      permanent removal options when cleanup is intentional. On Linux, normal trash
      entries live under `$XDG_DATA_HOME/Trash` or `$HOME/.local/share/Trash`, with
      external filesystems handled through `.Trash/$uid` or `.Trash-$uid` locations.
    - >
      The README explicitly warns against blindly aliasing `rm=gtrash put`, because
      sudo, SSH hosts, and partial rm compatibility can surprise users. That caution is
      part of the tool's package-nerd appeal: it is safer than rm, but honest about Unix
      muscle memory.
related-packages:
  - id: brew:trash-cli
    reason: >
      Choose trash-cli for the established Python command suite with separate trash-put,
      trash-list, trash-restore, trash-rm, and age-based trash-empty commands using the
      same FreeDesktop trashcan.
    rel: alternative
    sources:
      - https://github.com/umlx5h/gtrash#readme
      - https://github.com/andreafrancia/trash-cli
  - id: brew:fzf
    reason: >
      Pipe gtrash find output into fzf when you want fuzzy interactive selection beyond
      gtrash's built-in filtering workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/umlx5h/gtrash#readme
      - https://junegunn.github.io/fzf/
