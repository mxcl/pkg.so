id: brew:esbmc
display-name: ESBMC
homepage: https://esbmc.github.io/
repo: https://github.com/esbmc/esbmc
docs:
  - https://esbmc.github.io/docs
  - https://esbmc.github.io/docs/config
  - https://esbmc.github.io/docs/development/building
  - https://esbmc.github.io/docs/setup
  - https://esbmc.github.io/docs/usage
config-file-location:
  unix: ~/.config/esbmc.toml
  windows: '%userprofile%\esbmc.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      ESBMC is used in research, education, software security, embedded and firmware
      verification, smart-contract auditing, and competition settings such as SV-COMP
      and Test-COMP. The official site notes recent industrial and research deployments
      involving Arm Realm Management Monitor verification, Ethereum-related checking,
      Arduino firmware, and ESBMC-AI workflows.
    - >
      For package-manager users, ESBMC appears as the Homebrew formula `esbmc`, with
      bottles for macOS and Linux and build dependencies wired to LLVM, Bitwuzla, Z3,
      Boost, Python, and related solver/compiler libraries.
  package-nerd-significance:
    - >
      ESBMC is interesting to package maintainers because it is not a small
      single-language CLI: Homebrew builds it against compiler infrastructure and solver
      stacks, including LLVM/Clang, Bitwuzla, Z3, Boost, GMP, Python, and yaml-cpp. That
      makes it a useful example of packaging a research-grade formal-methods tool with
      heavy native dependencies.
    - >
      It also matters in CLI/package culture because it turns formal verification into a
      local executable workflow: users install `esbmc`, point it at source files, and
      choose solver and checking options without running a separate service.
  project-history:
    - >
      The project shares ancestry with CBMC and the official repository describes ESBMC
      as a fork of CBMC v2.9 from 2008. It evolved into an SMT-centered bounded model
      checker with Clang/LLVM frontends, multiple SMT solver backends, k-induction,
      concurrency support, and operational models for real-world libraries.
    - >
      The official project material tracks later expansion into Python, Solidity,
      Kotlin/Jimple, CHERI, and Rust-oriented verification work, with selected
      publications covering ESBMC 5.0 in 2018, CHERI and Kotlin work in 2022, and ESBMC
      7.4 in 2024.
  related-projects:
    - >
      CBMC is the direct ancestor identified by the official repository; ESBMC differs
      by emphasizing SMT-based encodings, Clang/LLVM frontends, solver flexibility,
      k-induction, and broader language frontends.
    - >
      Related ESBMC ecosystem projects include ESBMC-Web, the VS Code extension,
      ESBMC-AI, FuSeBMC for test generation, and official integrations around GitHub
      Actions and solver backends.
  sources:
    - https://esbmc.github.io/
    - https://esbmc.github.io/docs/
    - https://esbmc.github.io/docs/config/
    - https://esbmc.github.io/docs/development/building/
    - https://esbmc.github.io/docs/setup/
    - https://esbmc.github.io/docs/usage/
    - https://github.com/esbmc/esbmc
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/master/Formula/e/esbmc.rb
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      ESBMC is the Efficient SMT-Based Context-Bounded Model Checker, a command-line
      formal-verification tool for detecting runtime errors and checking assertions in
      C, C++, CUDA, CHERI, Kotlin, Python, Rust, Solidity, and related programs.
  timeline:
    - '2008: ESBMC forked from CBMC v2.9, according to the official repository README.'
    - >
      2018: ESBMC 5.0 was published as an industrial-strength C model checker in the
      official selected-publications list.
    - >
      2022: Official publications and application notes highlight CHERI, Kotlin/Jimple,
      Solidity, and modern C++ verification work.
    - >
      2024: ESBMC 7.4 was cited by the project as the recommended TACAS competition
      paper for ESBMC 7.4 and later.
    - >
      2025-2026: Official site reports ESBMC-kind SV-COMP ReachSafety placements and
      FuSeBMC/ESBMC Test-COMP overall wins across 2023-2026.
  usage:
    - >
      Typical use is a direct CLI invocation such as `esbmc file.c --floatbv
      --k-induction`, `esbmc file.c --memory-leak-check`, `esbmc file.c --context-bound
      2`, or `esbmc main.py`, producing verification success, verification failure, or
      counterexample output.
    - >
      ESBMC supports TOML configuration through `ESBMC_CONFIG_FILE`; if that environment
      variable is not set, official docs state that it checks `%userprofile%\esbmc.toml`
      on Windows and `~/.config/esbmc.toml` on UNIX.
related-packages:
  - id: brew:cbmc
    reason: >
      Choose CBMC as the closely related alternative when you want the CProver toolchain
      and its C/C++ and Java verification ecosystem; ESBMC originated as a CBMC fork and
      now differs in frontends, algorithms, and solver architecture.
    rel: alternative
    sources:
      - https://github.com/esbmc/esbmc
      - https://www.cprover.org/cbmc/
category: developer-tools
package-manager:
  brew: esbmc
package-manager-url: https://formulae.brew.sh/formula/esbmc
license: Apache-2.0
tags:
