id: brew:pk
display-name: pk
homepage: https://github.com/johnmorrow/pk
repo: https://github.com/johnmorrow/pk
docs:
  - https://amoeba.org/pk
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied source_facts.package-manager records Homebrew availability; the
      README also documents building and installing through Cargo.
  package-nerd-significance:
    - >
      It follows the Unix tradition of small pipeline utilities, offering more delimiter
      handling than simple column selection requires without demanding an awk program.
  project-history:
    - >
      John Morrow developed pk as a field extractor positioned between cut and awk. Its
      copyright notice begins in 2012.
  related-projects:
    - cut and awk are the upstream project's stated comparison points.
  sources:
    - '[Official README](https://github.com/johnmorrow/pk#readme)'
    - source_facts.package-manager
  summary:
    - pk extracts and rearranges fields from text streams.
  timeline:
    - '2012: Beginning of the copyright period recorded by upstream.'
  usage:
    - >
      Pipe command output into pk and select numbered fields or ranges. Options control
      delimiters, quoting, empty fields, and output separators.
category: developer-tools
package-manager:
  brew: pk
package-manager-url: https://formulae.brew.sh/formula/pk
license: Apache-2.0
tags:
  - cli
  - columns
  - field-extraction
  - shell-pipeline
  - text-processing
description: Field extractor command-line utility
executables:
  - pk
provenance:
  formula: pk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
