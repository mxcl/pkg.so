id: brew:cbonsai
display-name: cbonsai
homepage: https://gitlab.com/jallbrit/cbonsai
repo: https://gitlab.com/jallbrit/cbonsai
docs:
  - https://gitlab.com/jallbrit/cbonsai#readme
  - https://gitlab.com/jallbrit/cbonsai/-/blob/master/cbonsai.scd
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README points users to a Repology packaging chart and separately
      calls out Homebrew, MacPorts, Fedora COPR, and Snap availability. The supplied
      package facts also show distro/package-manager entries for apk, Debian, Fedora,
      Nix, Ubuntu, zypper, Homebrew, and MacPorts.
  package-nerd-significance:
    - >
      It is the sort of tiny C/ncurses program package managers like carrying because it
      is self-contained, portable across Unix-like systems, and useful for testing
      terminal colors and ncurses behavior while also being a fun demo package.
  project-history:
    - >
      The official README describes cbonsai as a newer C version of the author's earlier
      bonsai.sh project, which itself ported a JavaScript bonsai tree generator.
  related-projects:
    - bonsai.sh and the JavaScript bonsai generator named by the upstream README.
  sources:
    - https://gitlab.com/jallbrit/cbonsai
    - https://gitlab.com/jallbrit/cbonsai#readme
    - https://gitlab.com/jallbrit/cbonsai/-/blob/master/cbonsai.scd
    - https://formulae.brew.sh/api/formula/cbonsai.json
  summary:
    - >
      cbonsai is a small terminal-art program: a C/ncurses bonsai tree generator with
      static and live growth modes.
  usage:
    - >
      cbonsai is used as a terminal visual toy, screensaver, shell-startup flourish, or
      message display. Its manual documents options for live mode, infinite mode,
      screensaver mode, seed selection, colors, leaves, and saving/loading progress from
      ~/.cache/cbonsai.
related-packages: []
category: toys
package-manager:
  apk: cbonsai
  brew: cbonsai
  debian: cbonsai
  dnf: cbonsai
  macports: cbonsai
  nix: cbonsai
  ubuntu: cbonsai
  zypper: cbonsai
package-manager-url: https://formulae.brew.sh/formula/cbonsai
license: GPL-3.0-or-later
tags:
  - bonsai
  - c
  - cli
  - generator
  - ncurses
  - terminal
description: Console Bonsai is a bonsai tree generator, written in C using ncurses
executables:
  - cbonsai
provenance:
  formula: cbonsai
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
