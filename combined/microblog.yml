history:
  adoption-history:
    - >
      The native Mac client is a free companion to the Micro.blog service and is
      distributed to Homebrew users through the `microblog` cask. It supports
      Micro.blog-hosted sites, multiple accounts, and posting to WordPress or another
      compatible server after configuring its site URL.
  package-nerd-significance:
    - >
      Micro.blog for Mac combines a native social timeline with a blogging client and
      emphasizes portable publishing workflows. Its local Markdown and Blog Archive
      Format exports, scheduled backups, and optional GitHub archiving are especially
      relevant to users concerned with data ownership and migration.
  project-history:
    - >
      Micro.blog maintains the Mac application alongside its hosted blogging and
      social-networking service. The official version history documents expansion from
      core posting and timeline features into bookmarks, highlights, private notes,
      media management, import/export, automated backups, and category-oriented
      publishing.
  related-projects:
    - >
      Can publish to Micro.blog-hosted blogs and externally hosted sites such as
      WordPress. Export workflows support Markdown, WordPress WXR, Blog Archive Format,
      and Day One; the hosted service can also archive a blog to GitHub and the Internet
      Archive.
  sources:
    - https://help.micro.blog/t/exporting-from-micro-blog/557
    - https://help.micro.blog/t/micro-blog-for-mac/45
    - https://help.micro.blog/t/multiple-accounts/31
    - source_facts.package-manager
  summary:
    - >
      Micro.blog for Mac is the native macOS client for the Micro.blog blogging and
      social-networking service, with facilities for composing posts, reading timelines,
      managing media, notes, bookmarks, and exported archives.
  timeline:
    - '2023: Version 3.0 added highlights and bookmark-tag workflows.'
    - '2024: Version 3.1 added private and shareable notes.'
    - '2026: Version 3.9 added automatic weekly Blog Archive Format backups.'
    - '2026: Version 4.0 redesigned the main interface and added category browsing.'
  usage:
    - >
      On first launch, the application authenticates through the user's web browser.
      Users can create posts for Micro.blog-hosted sites, configure an external site
      URL, browse conversations, manage uploads and notes, and switch among multiple
      accounts or blogs.
    - >
      The Mac app can export posts locally as Markdown, WordPress WXR, Blog Archive
      Format, or to Day One. Recent versions can also maintain automatic local `.bar`
      archive backups.
