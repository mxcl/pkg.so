id: brew:ezstream
display-name: ezstream
homepage: https://icecast.org/ezstream/
repo: https://gitlab.xiph.org/xiph/ezstream
docs:
  - https://icecast.org/ezstream
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ezstream's adoption is tied to Icecast deployments rather than general desktop
      media use. It is packaged by Unix-like distributions and Homebrew as a small
      automation component for people who need a scriptable source client instead of a
      full broadcast application.
  package-nerd-significance:
    - >
      ezstream is the kind of package that matters because it glues together other Unix
      media packages: libshout, libxml, TagLib, codecs, encoders, and Icecast. Its value
      is less glamour and more composability.
  project-history:
    - >
      The project is maintained under the Xiph/Icecast umbrella and uses libshout to
      communicate with streaming servers. Its official page describes support for Ogg,
      MP3, WebM, and Matroska streams over HTTP, ICY, and RoarAudio protocols, with
      TagLib used for metadata handling.
    - >
      The 1.0 release was a major configuration and protocol update, adding a new
      configuration file structure, a migration tool for 0.x configurations, modern
      libshout features, WebM and Matroska media formats, ICY and RoarAudio streaming
      protocols, TLS support, and a unit test suite. Version 1.0.2 followed as a
      February 12, 2020 bugfix release.
  related-projects:
    - Icecast is the streaming server ezstream commonly feeds.
    - libshout provides the streaming-server communication layer.
    - TagLib provides media metadata reading and management.
  sources:
    - https://icecast.org/ezstream/
    - https://gitlab.xiph.org/xiph/ezstream
    - https://gitlab.xiph.org/xiph/ezstream/-/raw/master/README.md
    - https://downloads.xiph.org/releases/ezstream/
  summary:
    - >
      ezstream is a command-line source client for sending media streams to Icecast
      servers, designed around file input, standard input, and optional external decoder
      or encoder pipelines.
  timeline:
    - '0.x: Older ezstream releases maintained in the Xiph download archive.'
    - >
      1.0: Major release with new configuration structure, cfgmigrate tool, modern
      libshout support, WebM/Matroska, ICY/RoarAudio, and TLS.
    - '2020: Version 1.0.2 released as a bugfix release.'
  usage:
    - >
      A typical ezstream setup reads a playlist, media file, or standard-input stream,
      optionally runs external tools to decode or encode it, and pushes the resulting
      stream to an Icecast-compatible server. The official README points users to `man
      ezstream` and bundled example configuration files for concrete setups.
    - >
      Because it delegates decoding and encoding to command-line tools, ezstream fits
      unattended streams, scheduled playlists, and server-side broadcast workflows where
      a GUI source client would be awkward.
related-packages:
  - id: brew:icecast
    reason: >
      Icecast is the server-side companion that receives and publishes streams sent by
      ezstream through libshout-compatible source connections.
    rel: adjacent_workflow
    sources:
      - https://icecast.org/ezstream/
      - https://icecast.org/docs/
category: media
