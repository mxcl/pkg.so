id: brew:go
display-name: Go
homepage: https://go.dev/
repo: https://go.googlesource.com/go
docs:
  - https://go.dev/doc
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/go/env
    - ~/.config/go/env
  macos: ~/Library/Application Support/go/env
  windows: '%AppData%\go\env'
credentials-file-location: null
history:
  adoption-history:
    - >
      The Go team described strong early community growth after the 2009 launch,
      including external contributors, mailing-list activity, and adoption both inside
      Google and by outside companies. By the project's tenth anniversary, Go's official
      blog described adoption across cloud infrastructure, naming Docker, Etcd, Istio,
      Kubernetes, Prometheus, and Terraform as examples of core cloud software written
      in Go.
  package-nerd-significance:
    - >
      The brew:go formula is a foundational language-runtime package on macOS and Linux
      because it installs the canonical go command and gofmt formatter used to build Go
      software and many other Homebrew formulas from source.
  project-history:
    - >
      Go was designed at Google beginning in 2007 by Robert Griesemer, Rob Pike, and Ken
      Thompson to improve programming productivity for multicore, networked machines and
      large codebases. The project was launched to the public on 10 November 2009 as an
      open source language focused on simplicity and efficiency.
    - >
      Go 1 was released on 28 March 2012 and established the compatibility promise that
      programs written for Go 1 should continue to compile and run under later Go 1
      releases. That stability turned the experimental public release into a predictable
      platform for application code, libraries, and distribution packaging.
  related-projects:
    - >
      Go's ecosystem includes pkg.go.dev, the standard library, the module proxy and
      checksum database, the x/tools repository, and large cloud-native projects such as
      Kubernetes, Terraform, Prometheus, Docker, Etcd, and Istio.
  sources:
    - https://formulae.brew.sh/formula/go
    - https://go.dev/blog/10years
    - https://go.dev/blog/1year
    - https://go.dev/blog/modules2019
    - https://go.dev/doc/devel/release
    - https://go.dev/doc/modules/gomod-ref
    - https://go.dev/doc/toolchain
    - https://go.googlesource.com/go
  summary:
    - >
      Go is an open source programming language, compiler, standard library, formatter,
      and command-line toolchain distributed through the go and gofmt executables.
  timeline:
    - '2007: Go design work began at Google.'
    - '2009: Go was launched as an open source project.'
    - '2012: Go 1 was released with the long-term compatibility promise.'
    - '2018: Go 1.11 introduced preliminary module support.'
    - '2021: Go 1.16 made module-aware mode the default and added //go:embed.'
    - '2023: Go 1.21 introduced automatic toolchain selection in the go command.'
  usage:
    - >
      Practitioners use the go command to create modules, fetch dependencies, build,
      test, install commands, run programs, and maintain go.mod and go.sum files. A
      module's go.mod file defines the module path, Go version, and dependency
      requirements, while Go commands such as go mod tidy and go get keep those
      requirements consistent.
    - >
      Go's toolchain model made the package more than a compiler binary. The
      distribution includes the go command plus a bundled toolchain made up of the
      standard library, compiler, assembler, and other tools; beginning with Go 1.21,
      the go command can also select or download toolchains according to go and
      toolchain lines in a module or workspace.
related-packages:
  - id: brew:gopls
    reason: >
      Install gopls alongside Go to add official Go-aware completion, navigation,
      diagnostics, analysis, and refactoring to an LSP-compatible editor.
    rel: adjacent_workflow
    sources:
      - https://go.dev/gopls/
      - https://go.dev/cmd/go/
  - id: brew:golangci-lint
    reason: >
      golangci-lint complements the Go compiler and tests by running a configurable
      collection of Go static analyzers locally or in CI.
    rel: adjacent_workflow
    sources:
      - https://golangci-lint.run/
      - https://golangci-lint.run/docs/welcome/quick-start/
      - https://go.dev/cmd/go/
  - id: brew:goreleaser
    reason: >
      GoReleaser uses Go build configuration to turn Go projects into cross-platform
      archives and package-manager release artifacts.
    rel: adjacent_workflow
    sources:
      - https://goreleaser.com/getting-started/
      - https://goreleaser.com/customization/builds/go/
      - https://go.dev/cmd/go/
category: language-runtime
package-manager:
  apk: go
  brew: go
  chocolatey: go
  dnf: golang
  macports: go
  nix: go
  pacman: go
  scoop: main/go
  winget: GoLang.Go
  zypper: go
package-manager-url: https://formulae.brew.sh/formula/go
license: BSD-3-Clause
tags:
  - cli
  - compiler
  - go
  - gofmt
  - programming-language
  - toolchain
description: Open source programming language to build simple/reliable/efficient software
executables:
  - go
  - gofmt
provenance:
  formula: go
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
