id: brew:betterglobekey
display-name: betterglobekey
homepage: https://github.com/Serpentiel/betterglobekey
repo: https://github.com/Serpentiel/betterglobekey
docs:
  - https://github.com/Serpentiel/betterglobekey/blob/main/docs/commands.md
  - https://github.com/Serpentiel/betterglobekey/blob/main/docs/configuration.md
  - https://github.com/Serpentiel/betterglobekey/blob/main/docs/usage.md
  - https://github.com/Serpentiel/betterglobekey/tree/main/docs
config-file-location:
  macos: ~/.betterglobekey.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed as a Homebrew formula and designed specifically for macOS users who
      switch frequently among keyboard layouts or languages.
  package-nerd-significance:
    - >
      It is a focused example of package-manager culture serving a narrow
      operating-system usability problem: a small open-source daemon and CLI can replace
      an awkward built-in interaction without requiring a larger automation suite.
  project-history:
    - >
      The project was created to rework the behavior of the macOS Globe key. Its current
      version supports ordered input-source collections, single- and double-press modes,
      reverse switching, a HUD, live configuration reloads, diagnostic commands, and an
      optional graphical companion.
  related-projects:
    - The optional betterglobekey companion app edits the same configuration graphically.
    - >
      The utility complements macOS keyboard and Accessibility settings rather than
      replacing the operating system's input-source subsystem.
  sources:
    - 'Official README: https://github.com/Serpentiel/betterglobekey'
    - >
      Official configuration reference:
      https://github.com/Serpentiel/betterglobekey/blob/main/docs/configuration.md
    - 'Official documentation: https://github.com/Serpentiel/betterglobekey/tree/main/docs'
  summary:
    - >
      betterglobekey is an open-source macOS utility that changes the Globe key into a
      faster, configurable input-source switcher.
  timeline:
    - 'Initial project: Created to improve macOS Globe-key input switching'
    - >
      Version 2 configuration: Introduced ordered input-source collections with
      automatic migration and backup of the older format
  usage:
    - >
      Users grant macOS Accessibility permission, set the system Globe-key action to No
      Action, and configure input-source collections in YAML. A single press cycles
      within a collection, a double press changes collections, and a modifier can
      reverse direction.
related-packages: []
category: system
package-manager:
  brew: betterglobekey
package-manager-url: https://formulae.brew.sh/formula/betterglobekey
license: MIT
tags:
  - accessibility
  - cli
  - globe-key
  - input-source
  - keyboard
  - macos
  - yaml
description: Reworked Globe key for faster input source switching
executables:
  - betterglobekey
provenance:
  formula: betterglobekey
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
