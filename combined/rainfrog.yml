id: brew:rainfrog
display-name: rainfrog
homepage: https://github.com/achristmascarl/rainfrog
repo: https://github.com/achristmascarl/rainfrog
docs:
  - https://github.com/achristmascarl/rainfrog#readme
config-file-location:
  linux:
    - $RAINFROG_CONFIG/rainfrog_config.toml
    - $XDG_CONFIG_HOME/<project_path>/rainfrog_config.toml
    - ~/.config/<project_path>/rainfrog_config.toml
  macos:
    - $RAINFROG_CONFIG/rainfrog_config.toml
    - ~/Library/Application Support/<project_path>/rainfrog_config.toml
  windows:
    - '%RAINFROG_CONFIG%\rainfrog_config.toml'
    - '%LOCALAPPDATA%\<project_path>\config\rainfrog_config.toml'
credentials-file-location:
  linux:
    - .env (current directory
    - an ancestor)
    - $RAINFROG_CONFIG/rainfrog_config.toml
    - $XDG_CONFIG_HOME/rainfrog/rainfrog_config.toml
    - ~/.config/rainfrog/rainfrog_config.toml
  macos:
    - .env (current directory
    - an ancestor)
    - $RAINFROG_CONFIG/rainfrog_config.toml
    - ~/Library/Application Support/dev.rainfrog.rainfrog/rainfrog_config.toml
  windows:
    - .env (current directory
    - an ancestor)
    - '%RAINFROG_CONFIG%\rainfrog_config.toml'
    - '%LOCALAPPDATA%\rainfrog\rainfrog\config\rainfrog_config.toml'
history:
  adoption-history:
    - >
      rainfrog is available through Homebrew, Nix, Arch Linux packaging, Scoop, Cargo,
      and the project's installation script, giving the young TUI a cross-platform
      package footprint.
  package-nerd-significance:
    - >
      rainfrog applies the modern Rust terminal-UI pattern to relational database work,
      offering a single keyboard-driven interface across PostgreSQL, MySQL, and SQLite.
    - >
      Its configurable keybindings and platform-aware configuration and keychain
      behavior make it especially relevant to terminal-first database users.
  project-history:
    - >
      rainfrog was developed as a lightweight terminal database-management interface
      supporting PostgreSQL, MySQL, and SQLite.
  related-projects:
    - PostgreSQL
    - MySQL
    - SQLite
    - Ratatui
  sources:
    - https://github.com/achristmascarl/rainfrog#readme
    - source_facts.package-manager
  summary:
    - >
      rainfrog is a cross-platform terminal user interface for browsing and querying
      PostgreSQL, MySQL, and SQLite databases.
  timeline:
    - 'Early project: rainfrog established a unified TUI for PostgreSQL, MySQL, and SQLite.'
    - >
      Subsequent adoption: The project became available through multiple Unix-like and
      Windows package channels.
  usage:
    - >
      Users select or describe a database connection, browse database objects, compose
      SQL, inspect results, and use query history and favorites from the terminal.
    - >
      The README documents rainfrog_config.toml for customization. Database passwords
      may optionally be saved in the operating system's keychain; this is not a
      credentials file, so no credentials-file location is reported.
category: data
package-manager:
  brew: rainfrog
  nix: rainfrog
  pacman: rainfrog
  scoop: main/rainfrog
package-manager-url: https://formulae.brew.sh/formula/rainfrog
license: MIT
tags:
  - cli
  - database
  - mysql
  - postgresql
  - sqlite
  - terminal
  - tui
description: Database management TUI for PostgreSQL/MySQL/SQLite
executables:
  - rainfrog
provenance:
  formula: rainfrog
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
