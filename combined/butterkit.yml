history:
  adoption-history:
    - >
      The official site describes use by thousands of developers and positions ButterKit
      as a native, local-first alternative to browser-based screenshot tools. Its
      workflow has expanded beyond screenshot composition to localization, metadata
      management, App Store Connect publishing, and automation.
  package-nerd-significance:
    - >
      ButterKit condenses several release-engineering chores—Simulator capture, device
      framing, localization, metadata editing, and App Store upload—into a native Mac
      application. Integration with Fastlane-style screenshot folders and agent
      automation makes it relevant beyond purely manual design work.
  project-history:
    - >
      ButterKit was created by Zach Spitulski as a self-funded native macOS tool for
      preparing App Store assets. It is built with Swift, AppKit, Metal, and RealityKit
      and emphasizes local processing without requiring a user account.
  related-projects:
    - Xcode Simulator
    - App Store Connect
    - Fastlane
    - OpenAI
  sources:
    - https://butterkit.app/
    - https://butterkit.app/docs/
    - https://butterkit.app/docs/capture/xcode/capturing-from-xcode/
    - https://butterkit.app/docs/getting-started/quickstart/
  summary:
    - >
      ButterKit is a native macOS editor for capturing, designing, localizing, and
      publishing App Store screenshots and metadata.
  timeline:
    - >
      Initial product era: ButterKit launched as a native App Store screenshot-design
      application.
    - >
      Expansion era: The workflow grew to include Xcode Simulator capture, localization,
      metadata management, direct App Store Connect upload, and automation interfaces.
    - >
      2026: Official documentation describes support for all 50 App Store Connect
      localizations and a Metal-powered native editing pipeline.
  usage:
    - >
      Users create a project, import images by drag-and-drop, Xcode Simulator capture,
      or a linked Fastlane folder, place them in device frames, add localized text, and
      export images or upload them to App Store Connect. Captured assets are stored
      inside the saved .butterkit document package.
