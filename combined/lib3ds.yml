id: brew:lib3ds
display-name: lib3ds
homepage: https://code.google.com/archive/p/lib3ds/
repo: https://code.google.com/archive/p/lib3ds/source
docs:
  - https://code.google.com/archive/p/lib3ds
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption pattern is typical of file-format libraries: it appears in Unix
      package managers and older graphics pipelines because .3DS files remained common
      in sample assets, asset catalogs, and legacy conversion workflows long after 3D
      Studio DOS itself was obsolete.
  package-nerd-significance:
    - >
      For package maintainers, lib3ds is interesting less because it changes rapidly and
      more because it is a fossil dependency: a compact LGPL library that keeps old
      binary 3D assets readable on modern systems.
  project-history:
    - >
      The public project was hosted on Google Code and described itself as an overall
      library for managing 3D-Studio Release 3 and 4 .3DS files. The archived source
      tree includes an initial-1.3.0 tag, and the project became effectively a
      preservation-era dependency after Google Code was archived.
  related-projects:
    - >
      Related projects include Autodesk 3D Studio and 3ds Max, applications with .3DS
      import/export filters, and other small 3D asset libraries used by model viewers
      and game tools.
  sources:
    - https://code.google.com/archive/p/lib3ds
    - https://code.google.com/archive/p/lib3ds/source/default/source
    - >
      https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/lib3ds/lib3ds-20080909.zip
  summary:
    - >
      lib3ds is a small C library for reading and writing Autodesk 3D Studio Release 3
      and 4 .3DS files. Its niche is old 3D interchange: it exists to let renderers,
      converters, and import filters handle a once-common binary model format without
      depending on Autodesk's toolkit.
  timeline:
    - >
      2000s: lib3ds was hosted as a Google Code project for managing 3D Studio Release 3
      and 4 .3DS files.
    - '2008: The Google Code archive retained a lib3ds-20080909 source download.'
    - >
      2016: Google Code project hosting was archived, leaving the archived project page
      and source browser as the main upstream record.
  usage:
    - >
      Package users usually encounter lib3ds indirectly through an importer, exporter,
      or conversion utility, with command-line tools such as 3dsdump useful for
      inspecting old .3DS assets.
related-packages:
  - id: brew:assimp
    reason: >
      Choose assimp when you need `.3DS` import within a maintained library that
      supports more than 40 asset formats, export support, mesh post-processing, and a
      conversion CLI; choose lib3ds for a small API focused specifically on legacy 3D
      Studio files.
    rel: alternative
    sources:
      - https://github.com/assimp/assimp
      - https://www.assimp.org/
      - https://code.google.com/archive/p/lib3ds
category: media
