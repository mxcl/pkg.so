id: brew:hexer
display-name: hexer
homepage: https://devel.ringlet.net/editors/hexer/
repo: https://gitlab.com/hexer/hexer
docs:
  - https://hexer.readthedocs.io/en/latest
  - https://devel.ringlet.net/editors/hexer
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Package-manager metadata in the batch lists hexer in Homebrew, Debian, Fedora,
      Arch, and Ubuntu, which fits its niche: a small terminal binary editor that Unix
      package sets can carry without a larger GUI stack.
  package-nerd-significance:
    - >
      For package-maintainer culture, hexer is the sort of old-school utility that fills
      a precise gap beside tools such as xxd, od, bvi, and graphical hex editors: it is
      interactive, terminal-native, and small enough to be present in multiple Unix
      distributions.
  project-history:
    - >
      The project history reflected by the maintained homepage and changelog shows hexer
      as a traditional Unix terminal utility rather than a framework: it is distributed
      as source, documents POSIX-compatible environments as its portability target, and
      keeps its public interface centered on editing buffers displayed as hex dumps.
    - >
      The hosted project moved into a GitLab-centered maintenance model, with a project
      page, ReadTheDocs/MkDocs documentation, tarball downloads from the maintainer
      site, and release notes covering the 1.0.x maintenance series.
  related-projects:
    - >
      Related command-line binary inspection tools include xxd and od for
      dumps/conversion, bvi for vi-like binary editing, and newer color-oriented viewers
      such as hexyl.
  sources:
    - >
      Homebrew formula metadata and the input package-manager map support the
      package-manager adoption notes.
    - Maintainer changelog provides the 1.0.x release timeline.
    - >
      Maintainer homepage describes hexer as a multi-buffer binary editor for Unix-like
      systems with a vi/ex-like interface.
  summary:
    - >
      hexer is a terminal hex editor for Unix-like systems, positioned as a multi-buffer
      binary-file editor whose interface is intentionally close to vi/ex.
  timeline:
    - >
      2015: Public GitLab project metadata records the hexer repository under the hexer
      namespace.
    - '2016: 1.0.2 and 1.0.3 appear in the maintained changelog.'
    - '2018: 1.0.4 and 1.0.5 appear in the maintained changelog.'
    - '2020: 1.0.6 appears in the maintained changelog.'
    - '2025: 1.0.7 appears in the maintained changelog.'
  usage:
    - >
      hexer is used when the user wants direct binary editing in a terminal, especially
      by people already comfortable with vi-like movement and command conventions. Its
      package identity is tied to hex editing, multiple buffers, undo, and a
      curses-style terminal workflow rather than to scripting or file conversion.
related-packages:
  - id: brew:bvi
    reason: >
      Choose bvi for the more explicitly vi-derived editor with Ex scripting and .bvirc
      configuration; choose hexer when multiple buffers and a vi/ex-like interface are
      the priority.
    rel: alternative
    sources:
      - https://devel.ringlet.net/editors/hexer/
      - https://bvi.sourceforge.net/overview.php
      - https://bvi.sourceforge.net/man_bvi.html
  - id: brew:bed
    reason: >
      Choose bed for a newer Go implementation with split windows, large-file support,
      and Vim-inspired undo and redo; choose hexer for a traditional POSIX C editor with
      multiple buffers and vi/ex conventions.
    rel: alternative
    sources:
      - https://devel.ringlet.net/editors/hexer/
      - https://github.com/itchyny/bed#readme
category: developer-tools
package-manager:
  brew: hexer
  debian: hexer
  dnf: hexer
  pacman: hexer
  ubuntu: hexer
package-manager-url: https://formulae.brew.sh/formula/hexer
license: BSD-3-Clause
tags:
  - binary-files
  - cli
  - hex-editor
  - terminal
  - vi-like
description: Hex editor for the terminal with vi-like interface
executables:
  - hexer
provenance:
  formula: hexer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
