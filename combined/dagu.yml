id: brew:dagu
display-name: Dagu
homepage: https://dagu.sh
repo: https://github.com/dagucloud/dagu
docs:
  - https://docs.dagu.sh/
config-file-location:
  unix:
    - ~/.config/dagu/config.yaml
    - ~/.config/dagu/dags/*.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Dagu's adoption story is aimed at small teams and operators moving beyond cron
      without adopting a heavyweight Airflow-style deployment. The official README
      explicitly compares the single-binary Dagu model with traditional orchestrators
      that require multiple services such as a web server, scheduler, workers,
      PostgreSQL, Redis or RabbitMQ, and a Python runtime.
  package-nerd-significance:
    - >
      Dagu matters to package nerds because it compresses a workflow scheduler, web UI,
      local file-backed state, and DAG runner into a single installable tool. It fills
      the package-manager niche between cron-plus-shell-scripts and a full distributed
      orchestration platform.
  project-history:
    - >
      The official repository metadata records the Dagu repository as created in April
      2022. Current official docs describe Dagu as local-first workflow orchestration
      that runs anywhere, with declarative YAML, a single binary, and air-gapped
      readiness.
  related-projects:
    - >
      Official materials position Dagu as an alternative to Airflow and Cron and
      document actions for shell commands, Docker containers, Kubernetes Jobs, SSH,
      HTTP, SQL, and AI-agent harnesses.
  sources:
    - https://docs.dagu.sh/
    - https://raw.githubusercontent.com/dagucloud/dagu/main/README.md
    - https://raw.githubusercontent.com/dagucloud/docs/main/server-admin/configuration.md
    - https://api.github.com/repos/dagucloud/dagu
    - https://github.com/dagucloud/dagu/releases/tag/v1.22.0
  summary:
    - >
      Dagu is a local-first workflow engine with a Web UI and a declarative YAML
      workflow format. It is packaged as a self-contained CLI/server tool for people who
      want scheduled DAGs, retries, logs, approvals, and automation without running a
      database-backed orchestration stack.
  timeline:
    - '2022: Official Dagu GitHub repository is created.'
    - '2025: v1.22.0 release is published in the current official repository.'
    - >
      2026: Official docs present Dagu as local-first orchestration with declarative
      YAML and a single-binary deployment model.
  usage:
    - >
      Users define workflows as YAML DAG files, run them with the dagu CLI, and operate
      the scheduler, executor, and web UI with commands such as dagu start-all. The
      official configuration docs define ~/.config/dagu/config.yaml as the default
      process-level configuration file and document default DAG, log, and data paths.
related-packages: []
category: developer-tools
package-manager:
  brew: dagu
package-manager-url: https://formulae.brew.sh/formula/dagu
license: GPL-3.0-only
tags:
  - cli
  - dag
  - scheduler
  - workflow-engine
  - yaml
description: Lightweight and powerful workflow engine
executables:
  - dagu
provenance:
  formula: dagu
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
