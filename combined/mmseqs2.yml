history:
  project-history:
    - >
      Its major technical milestones followed the growth of public sequence databases.
      The 2018 Nature Communications Linclust paper integrated a linear-time clustering
      workflow into MMseqs2, demonstrating clustering of 1.6 billion metagenomic protein
      fragments in 10 hours on a single server and showing why quadratic or
      near-quadratic approaches such as CD-HIT and UCLUST struggled at that scale. A
      2019 Bioinformatics paper expanded the ecosystem with an MMseqs2 desktop and local
      web-server app for interactive searches through custom protein sequence and
      profile databases, reducing query overhead and exposing MMseqs2 to users outside
      command-line-only workflows.
  sources:
    - https://academic.oup.com/bioinformatics/article/35/16/2856/5280135
    - https://formulae.brew.sh/formula/mmseqs2
    - https://github.com/soedinglab/MMseqs2
    - https://github.com/soedinglab/MMseqs2/wiki
    - https://www.nature.com/articles/nbt.3988
    - https://www.nature.com/articles/s41467-018-04964-5
  summary:
    - >
      MMseqs2, short for Many-against-Many sequence searching, is a bioinformatics suite
      from Martin Steinegger, Johannes Soding, and collaborators for searching and
      clustering very large protein and nucleotide sequence sets. The project README
      describes it as open-source C++ software for Linux, macOS, and Windows via Cygwin,
      built for multicore and multi-server scalability. Its 2017 Nature Biotechnology
      paper introduced MMseqs2 as a sensitive protein sequence search tool for massive
      datasets, and the project documentation frames it as much faster than BLAST while
      preserving high sensitivity at practical search settings.
  usage:
    - >
      In practice, users run the `mmseqs` executable as a suite of modules and
      workflows: creating MMseqs2 databases from FASTA or FASTQ, running `easy-search`
      for sequence search, `easy-cluster` for cascaded clustering, `easy-linclust` for
      larger datasets, converting alignment results, and using GPU-backed search modes
      where available. Its package-manager niche is scientific computing rather than
      general CLI tooling: Homebrew, Debian, Ubuntu, and Nix packages make a
      research-grade sequence analysis engine available to workstation and server users
      without building the full C++ stack by hand.
related-packages:
  - id: brew:diamond
    reason: >
      Choose DIAMOND for a focused, BLAST-compatible protein and translated-DNA aligner;
      choose MMseqs2 when the workflow also needs nucleotide or profile search,
      clustering, or taxonomy modules.
    rel: alternative
    sources:
      - https://github.com/soedinglab/MMseqs2
      - https://bbuchfink.github.io/diamond/
  - id: brew:blast
    reason: >
      Choose NCBI BLAST for the canonical multi-program NCBI search toolkit and
      reference behavior; choose MMseqs2 for highly scalable many-against-many search
      and clustering workflows.
    rel: alternative
    sources:
      - https://github.com/soedinglab/MMseqs2
      - https://www.ncbi.nlm.nih.gov/books/NBK279690/
