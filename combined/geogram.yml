id: brew:geogram
display-name: Geogram
homepage: https://github.com/BrunoLevy/geogram/wiki
repo: https://github.com/BrunoLevy/geogram
docs:
  - https://github.com/BrunoLevy/geogram/wiki
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The Symposium on Geometry Processing recognized Geogram with its 2023 Software
      Award, citing both the library and its role in making research results
      reproducible. The project's own publications page lists downstream projects and
      users in academic, industrial, and scientific settings, including NASA Ames' LAVA
      Voronoi Mesher, AliceVision, PyMesh, OVITO, OpenGeode, R wrappers, and geologic
      meshing tools.
  package-nerd-significance:
    - >
      For package maintainers, Geogram is notable because it packages a research-grade
      geometry-processing codebase with a wide dependency surface and long-running
      upstream release history. It sits in the same practical space as other
      mesh-processing libraries, but its appeal comes from reproducible research
      algorithms and a ready-to-install command-line surface for computational geometry
      experiments.
  project-history:
    - >
      The project traces its roots to sustained geometry-processing work that began
      around 2000 during Levy's postdoctoral work at Stanford. Geogram later gathered
      major software results from the ALICE Inria project, which ran from 2004 to 2018,
      and preserved implementations behind more than 30 research articles in venues such
      as ACM SIGGRAPH, ACM Transactions on Graphics, the Symposium on Geometry
      Processing, and Eurographics.
    - >
      Geogram's evolution was tied to research grants and applied meshing work. The
      project documentation credits ERC GOODSHAPE and VORPALINE grants and Inria
      exploratory actions EXPLORAGRAM and COSMOGRAM with extending the library toward
      large-scale computational physics and optimal transport.
  related-projects:
    - >
      Graphite is an experimental 3D modeler built around Geogram. The Geogram wiki also
      links related wrappers and downstream users such as Julia and Rust bindings,
      AliceVision, PyMesh, OVITO, OpenGeode, and RGeogram.
  sources:
    - https://awards.geometryprocessing.org/
    - https://github.com/BrunoLevy/geogram
    - https://github.com/BrunoLevy/geogram/wiki
    - https://github.com/BrunoLevy/geogram/wiki/Publications
  summary:
    - >
      Geogram is a C++ computational-geometry and geometry-processing library by Bruno
      Levy. Its public documentation presents it as a collection of geometric algorithms
      for surface reconstruction, remeshing, parameterization, Boolean operations, exact
      predicates, Delaunay triangulations, mesh data structures, geometric search,
      spectral mesh processing, and linear solvers.
  timeline:
    - "2000: Development effort began during Bruno Levy's postdoctoral work at Stanford."
    - >
      2004-2018: ALICE Inria project produced many of the research results later
      collected in Geogram.
    - '2023: Geogram received the Symposium on Geometry Processing Software Award.'
  usage:
    - >
      Practitioners use Geogram as a geometry kernel and command-line toolkit for
      meshes, Voronoi and Delaunay computations, robust predicates, reconstruction,
      remeshing, CSG, and geometry-processing research prototypes. Package users also
      encounter companion tools such as `geodump` and `vorpalite` for inspecting
      geometry data and running mesh-oriented workflows.
related-packages:
  - id: brew:cgal
    reason: >
      CGAL is the stronger alternative when genericity and a broader algorithm catalog
      matter, while Geogram's official comparison emphasizes its lower-memory,
      high-performance specialization and lighter dependency model.
    rel: alternative
    sources:
      - https://github.com/BrunoLevy/geogram/wiki/FAQ
      - https://doc.cgal.org/latest/Manual/index.html
category: science
