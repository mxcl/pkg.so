id: brew:binwalk
display-name: Binwalk
homepage: https://github.com/ReFirmLabs/binwalk
repo: https://github.com/ReFirmLabs/binwalk
docs:
  - https://github.com/ReFirmLabs/binwalk/wiki
  - https://github.com/ReFirmLabs/binwalk#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Binwalk moved from a specialist firmware reverse-engineering utility into a
      standard package-manager tool: the input package metadata lists it in Homebrew,
      Debian, Ubuntu, Fedora/dnf, Alpine/apk, Arch/pacman, MacPorts, Nix, and
      openSUSE/zypper. Its GitHub repository also shows large public adoption for a
      firmware tool, with more than fourteen thousand stars and active releases into the
      v3 era.
    - >
      Its adoption tracks the growth of embedded-device security work. As firmware dumps
      became routine artifacts in vulnerability research and supply-chain review, a
      single installable CLI that could scan signatures, carve contents, and graph
      entropy became a default first pass before more manual reverse engineering.
  package-nerd-significance:
    - >
      Binwalk is one of those packages whose name becomes a verb in a niche: before
      opening Ghidra or writing custom unpackers, people 'binwalk it'. That cultural
      position matters in package history because it turned firmware analysis from a
      bespoke lab setup into a command available from mainstream Unix package managers.
    - >
      The v3 Rust rewrite is also package-nerd interesting. It keeps the familiar CLI
      identity while moving the implementation toward a safer, faster compiled toolchain
      and exposing a Rust library surface, which makes it both a classic Unix utility
      and a modern reusable component.
  project-history:
    - >
      The public ReFirmLabs repository records Binwalk as a firmware analysis tool and
      names Craig Heffner as the package author in the current Cargo metadata. The
      repository was created on GitHub in 2013, and its public release line includes the
      v2.0.0 release in July 2014, v2.1.1 in December 2015, and v2.3.x releases through
      2023.
    - >
      Binwalk v3 is a major rewrite of the tool in Rust. The current README describes it
      as an updated Binwalk firmware analysis tool rewritten in Rust for speed and
      accuracy, while retaining the core job of identifying and optionally extracting
      embedded files and data.
  related-projects:
    - >
      The Binwalk package sits beside firmware and binary-analysis tools such as file,
      foremost, squashfs-tools, unsquashfs, sasquatch-style extractors, entropy
      visualizers, and reverse-engineering suites. The v3 Cargo metadata also references
      the delink project as a dependency.
    - >
      Its closest package-manager relationship is with the ecosystem of firmware
      unpacking helpers that users install around it, because Binwalk often identifies
      containers that other tools then extract or inspect.
  sources:
    - https://github.com/ReFirmLabs/binwalk
    - https://github.com/ReFirmLabs/binwalk/releases
    - https://raw.githubusercontent.com/ReFirmLabs/binwalk/master/Cargo.toml
    - https://raw.githubusercontent.com/ReFirmLabs/binwalk/master/README.md
    - source_facts.package-manager
  summary:
    - >
      Binwalk is the firmware-analysis command-line tool package nerds reach for when an
      opaque router, camera, appliance, or IoT image needs to be split into recognizable
      files, compressed streams, bootloaders, file systems, and entropy regions.
  timeline:
    - '2013: ReFirmLabs/binwalk repository created on GitHub.'
    - '2014: Binwalk v2.0.0 released.'
    - '2015: Binwalk v2.1.1 released.'
    - '2021: Binwalk v2.3.0 and v2.3.1 released.'
    - '2023: Binwalk v2.3.4 released.'
    - '2024: Binwalk v3.1.0 released after the Rust rewrite.'
  usage:
    - >
      Typical use starts with running `binwalk firmware.bin` to identify embedded data.
      The README documents optional extraction, support for many file and data
      signatures, entropy analysis for spotting compression or encryption, and
      integration into Rust projects through the library interface.
    - >
      Package users usually care that it is scriptable and easy to install: it fits into
      firmware triage pipelines, CTF workflows, vendor image audits, and quick checks of
      suspicious binary blobs.
related-packages:
  - id: brew:ghidra
    reason: >
      Use Ghidra after Binwalk identifies or extracts executable components when
      firmware triage needs disassembly, decompilation, scripting, or deeper code
      analysis.
    rel: adjacent_workflow
    sources:
      - https://github.com/ReFirmLabs/binwalk
      - https://github.com/NationalSecurityAgency/ghidra
category: security
package-manager:
  apk: binwalk
  brew: binwalk
  debian: binwalk
  dnf: binwalk
  macports: binwalk
  nix: binwalk
  pacman: binwalk
  ubuntu: binwalk
  zypper: binwalk
package-manager-url: https://formulae.brew.sh/formula/binwalk
license: MIT
tags:
  - cli
  - firmware
  - forensics
  - reverse-engineering
description: Searches a binary image for embedded files and executable code
executables:
  - binwalk
provenance:
  formula: binwalk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
