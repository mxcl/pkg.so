id: brew:minigraph
display-name: minigraph
homepage: https://lh3.github.io/minigraph
repo: https://github.com/lh3/minigraph
docs:
  - https://github.com/lh3/minigraph#readme
  - https://lh3.github.io/minigraph
  - https://lh3.github.io/minigraph/minigraph.html
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool sits in the pangenome era of bioinformatics, where multiple high-quality
      assemblies are represented as a graph rather than flattened into one linear
      reference. The 2020 Genome Biology paper by Li, Feng, and Chu introduced the
      design and construction of reference pangenome graphs with minigraph, including a
      graph-based data model and formats intended to preserve coordinates against a
      linear reference. The command-line workflow maps sequences to sequences or graphs,
      emits PAF/GAF-style mappings, builds rGFA graphs from reference and sample
      assemblies, and can feed structural-variation extraction through gfatools.
  sources:
    - https://formulae.brew.sh/formula/minigraph
    - https://github.com/ComparativeGenomicsToolkit/cactus/blob/master/doc/pangenome.md
    - https://github.com/lh3/minigraph
    - https://lh3.github.io/minigraph/
    - https://link.springer.com/article/10.1186/s13059-020-02168-z
    - >
      https://profiles.wustl.edu/en/publications/pangenome-graph-construction-from-genome-alignments-with-minigrap
    - https://pubmed.ncbi.nlm.nih.gov/33066802/
  summary:
    - >
      minigraph is Heng Li's sequence-to-graph mapper and pangenome graph generator. The
      GitHub project describes it as a tool that aligns query sequences against a
      sequence graph and incrementally augments that graph with long divergent
      subsequences; the project documentation also notes that a significant portion of
      the source derives from minimap2, Li's pairwise nucleotide aligner.
  usage:
    - >
      Its adoption history is tied to pangenome-reference research rather than
      general-purpose package use. Later Minigraph-Cactus work used minigraph to
      construct a structural-variation graph from input assemblies before Cactus refined
      it into richer pangenome graph outputs, and that pipeline demonstrated scaling to
      90 human haplotypes from the Human Pangenome Reference Consortium. In package
      managers, minigraph is a specialist bioinformatics CLI for researchers building or
      testing genome graphs, often alongside minimap2, gfatools, vg, Cactus, and
      Bioconda-style scientific software stacks.
related-packages:
  - id: brew:minimap2
    reason: >
      Choose minimap2 for general pairwise alignment of DNA or mRNA against linear
      references, including established presets for long reads, short reads, spliced
      reads, and assemblies; choose minigraph when the target or desired output is a
      sequence graph.
    rel: alternative
    sources:
      - https://github.com/lh3/minigraph
      - https://github.com/lh3/minimap2
