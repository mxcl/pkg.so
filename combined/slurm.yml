id: brew:slurm
display-name: slurm
homepage: https://github.com/mattthias/slurm/wiki/
repo: https://github.com/mattthias/slurm
docs:
  - https://github.com/mattthias/slurm/wiki
  - https://github.com/mattthias/slurm/blob/upstream/README.md
  - https://github.com/mattthias/slurm/blob/upstream/slurm.1
config-file-location:
  unix:
    - ~/.slurm/
    - ${PREFIX}/share/slurm/
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists packages in Alpine, Homebrew, Debian,
      Fedora/dnf, MacPorts, Nix, Ubuntu, and zypper-related metadata. That broad distro
      footprint is typical of compact ncurses tools that system administrators can
      install quickly on many Unix-like systems.
  package-nerd-significance:
    - >
      slurm matters in package-manager culture as a small, portable terminal monitor:
      easy to package, low-dependency, useful over SSH, and old enough to show the
      persistence of ncurses utilities in modern package indexes.
  project-history:
    - >
      The official README says slurm began as a FreeBSD port of Gabriel Montenegro's
      Linux ppp link monitor `pppstatus`. Hendrik Scholz removed the PPP-specific and
      email-checking pieces to make it a generic network load monitor for BSD, Linux,
      HP-UX, and Solaris; the man page records early 2004 documentation history.
  related-projects:
    - >
      slurm is related to pppstatus, curses network monitors, and terminal
      system-observation tools such as iftop, nload, bmon, and vnStat.
  sources:
    - https://api.github.com/repos/mattthias/slurm
    - https://api.github.com/repos/mattthias/slurm/tags
    - https://github.com/mattthias/slurm/blob/upstream/README.md
    - https://github.com/mattthias/slurm/blob/upstream/slurm.1
    - input.source_facts.package-manager
  summary:
    - >
      slurm is a curses-based network load monitor for terminal users. It displays
      real-time traffic statistics and ASCII graphs for a selected network interface.
  timeline:
    - '2004: Man page revision metadata records slurm documentation history.'
    - '2010: Upstream 0.3.3 imported in the official Git history.'
    - '2011: GitHub repository created.'
    - '2024: Man page dated February 4, 2024 in the upstream branch.'
  usage:
    - >
      Typical use is `slurm -i eth0` or another interface name, with keyboard commands
      to switch graph modes, redraw, zero counters, or quit. The man page documents
      combined and split graph views plus interface, delay, and theme options.
category: networking
package-manager:
  apk: slurm
  brew: slurm
  debian: slurm
  dnf: slurm
  macports: slurm
  nix: slurm
  ubuntu: slurm
  zypper: libnss_slurm2
package-manager-url: https://formulae.brew.sh/formula/slurm
license: GPL-2.0-or-later
tags:
  - cli
  - curses
  - network-monitoring
  - terminal
  - traffic-statistics
description: Yet another network load monitor
executables:
  - slurm
provenance:
  formula: slurm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
