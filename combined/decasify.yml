id: brew:decasify
display-name: decasify
homepage: https://github.com/alerque/decasify
repo: https://github.com/alerque/decasify
docs:
  - https://github.com/alerque/decasify#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      decasify is unusual for a small case-conversion tool because it deliberately
      exposes the same functionality through many packaging ecosystems: Homebrew and
      Arch for the CLI, Cargo for Rust, LuaRocks, PyPI, npm, SILE, Typst Universe, and
      editor plugin managers. That spread is documented by the README installation and
      usage sections.
  package-nerd-significance:
    - >
      Package nerds care about decasify less as a huge utility and more as a clean
      example of one text-processing core shipped across several language and editor
      ecosystems. Its packaging matrix is the story: a Rust implementation serving CLI,
      Lua, Python, JavaScript, SILE, Typst, Vim, and Neovim users.
  project-history:
    - >
      The README states that decasify was born from frustration with all-caps titles in
      Markdown sources and the lack of tooling for Turkish prose case conversion. The
      public repository was created in July 2023, and the changelog shows early CLI and
      Lua/Rust work followed by Python, JavaScript/WASM, SILE, Typst, Vim, and Neovim
      integrations.
  related-projects:
    - >
      decasify builds on and references the Rust titlecase crate for Gruber-style
      English title casing, while also consulting language-specific style sources such
      as Turkish Language Institute rules and Spanish style references.
  sources:
    - https://github.com/alerque/decasify#readme
    - https://github.com/alerque/decasify/blob/master/CHANGELOG.md
    - https://api.github.com/repos/alerque/decasify
  summary:
    - >
      decasify is a locale-aware string case conversion project packaged as a CLI, Rust
      crate, Lua rock, Python module, JavaScript/WASM module, editor plugin, SILE
      package, and Typst package. Its most visible purpose is title-casing prose,
      especially where English-only tools fail.
  timeline:
    - '2023: Repository created and 0.1.0 accepted standard input for the CLI.'
    - >
      2024: Python, JavaScript/WASM, SILE, Neovim, and broader API work arrived through
      the 0.5-0.8 series.
    - '2025: Typst packaging and Spanish support appeared in later releases.'
    - >
      2026: 0.11.3 added Neovim preview behavior, CLI help colors, binary-install
      tooling, and Lua 5.5 support.
  usage:
    - >
      CLI usage accepts arguments or standard input and defaults to English title case,
      with flags for locale and style guide. Library users call case-specific functions,
      while editor integrations expose a `:Decasify` command for transforming lines or
      ranges with configurable locale, style guide, and override words.
related-packages:
  - id: brew:titlecase
    reason: >
      Choose titlecase for a small English-oriented command-line filter; choose decasify
      when locale-aware rules, multiple case operations, or library and editor
      integrations are required.
    rel: alternative
    sources:
      - https://github.com/alerque/decasify#readme
      - https://github.com/ap/titlecase
category: developer-tools
package-manager:
  brew: decasify
  nix: decasify
  pacman: decasify
package-manager-url: https://formulae.brew.sh/formula/decasify
license: LGPL-3.0-only
tags:
  - cli
  - javascript
  - localization
  - lua
  - python
  - rust
  - text-processing
  - title-case
description: Utility for casting strings to title-case according to locale-aware style guides
executables:
  - decasify
provenance:
  formula: decasify
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
