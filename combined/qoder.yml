history:
  adoption-history:
    - >
      Qoder expanded from its original IDE into desktop, command-line, mobile, and
      IDE-plugin surfaces. Its official announcements describe a shift from interactive
      AI assistance toward autonomous, task-oriented development with persistent project
      knowledge and agent teams.
  package-nerd-significance:
    - >
      Qoder is notable in desktop package catalogs as a proprietary, rapidly evolving
      agentic development environment rather than a traditional editor or compiler. The
      Homebrew cask packages the macOS application, while Qoder's broader product family
      also includes a CLI and editor integrations.
  project-history:
    - >
      Qoder shipped its first public version in August 2025 as an agentic IDE for
      real-world software projects. Its early features combined code completion and chat
      with repository indexing, persistent memory, a generated Repo Wiki, and Quest mode
      for delegated tasks.
    - >
      In 2026, Qoder 1.0 repositioned the product as an autonomous development desktop
      centered on task execution, agent teams, reusable organizational knowledge, and
      review of completed work. Later official releases broadened Qoder into a
      multi-surface agentic coding platform.
  related-projects:
    - Qoder CLI provides a terminal-oriented interface to Qoder's agent workflow.
    - >
      Qoder's JetBrains plugin brings completion, agentic chat, rules, memory, and MCP
      integration to JetBrains IDEs.
  sources:
    - https://docs.qoder.com/release-notes/qoder
    - https://qoder.com/
    - https://qoder.com/blog/qoder-1.0
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Qoder is an agentic coding platform whose desktop application combines code
      editing, repository awareness, autonomous task execution, reusable knowledge, and
      multi-agent workflows.
  timeline:
    - '2025: Qoder shipped its first public version as an agentic IDE.'
    - '2026: Qoder 1.0 expanded the product into an autonomous development desktop.'
    - '2026: Qoder introduced a broader desktop, mobile, IDE, plugin, and CLI product family.'
  usage:
    - >
      Developers use Qoder for inline completion, codebase-aware questions, delegated
      implementation, testing, debugging, and repository documentation. Users define a
      goal, supervise tool use, and review the resulting changes and artifacts.
    - >
      Settings expose models, permissions, project indexing, memory, extensions, hooks,
      worktrees, security scanning, and agent-team configuration. Authentication and
      external-service credentials should be supplied through Qoder's supported sign-in,
      provider, or environment mechanisms rather than placed in task text.
related-packages:
  - id: cask:zed
    reason: >
      Choose Zed when you want an open-source, native editor with built-in agents,
      configurable model providers, ACP agents, and a review UI instead of Qoder's
      proprietary task-oriented platform.
    rel: alternative
    sources:
      - https://docs.qoder.com/
      - https://zed.dev/docs/ai/agents
      - https://zed.dev/docs/ai/agent-panel
  - id: cask:visual-studio-code
    reason: >
      Choose Visual Studio Code when you want a general-purpose extensible editor that
      can run Copilot, Claude, or Codex agent harnesses alongside its established
      debugging and extension workflows.
    rel: alternative
    sources:
      - https://docs.qoder.com/
      - https://code.visualstudio.com/docs/agents/overview
