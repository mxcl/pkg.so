id: brew:mailcheck
display-name: mailcheck
homepage: https://mailcheck.sourceforge.net/
repo: null
docs:
  - https://mailcheck.sourceforge.net/
config-file-location:
  unix:
    - /etc/mailcheckrc
    - ~/.mailcheckrc
credentials-file-location:
  unix: ~/.netrc
history:
  adoption-history:
    - >
      mailcheck's adoption is traditional distribution packaging rather than a large
      upstream community. The input package-manager facts list Homebrew, Debian, Ubuntu,
      and Nix, and the official homepage links Debian package information.
  package-nerd-significance:
    - >
      mailcheck is package-nerd archaeology in useful form: a tiny C utility from the
      login-shell mail-notification era, still packaged because it has few moving parts
      and interoperates with old mailbox formats and `.netrc` credentials.
  project-history:
    - >
      The upstream manpage says mailcheck was written for Debian GNU/Linux by Jefferson
      E. Noxon, with copyright years spanning 1996, 1997, 1998, and 2001. POP3 and IMAP
      support is credited to Rob Funk.
    - >
      The official 1.91.2 SourceForge release contains a compact C program, manpage,
      sample `mailcheckrc`, and Makefile. Its install target places the command under
      `/usr/bin` and the default config under `/etc`.
  related-projects:
    - >
      The manpage points users to biff, mail, fetchmail, netrc, and ftp as related Unix
      mail and credential tools.
  sources:
    - >
      https://downloads.sourceforge.net/project/mailcheck/mailcheck/1.91.2/mailcheck_1.91.2.tar.gz
    - https://mailcheck.sourceforge.net/
    - source_facts.package-manager
  summary:
    - >
      mailcheck is a small command-line utility for checking multiple mailboxes for new
      mail. The official homepage and upstream manpage document support for mbox,
      Maildir, POP3, and IMAP.
  timeline:
    - '1996: Earliest upstream copyright year in the manpage.'
    - >
      1998: Additional copyright year and mailbox/network support lineage appear in the
      manpage.
    - '2001: Later copyright notice appears in the manpage.'
    - '2007: SourceForge published the mailcheck 1.91.2 release tarball.'
  usage:
    - >
      The manpage recommends invoking `mailcheck` from `/etc/profile` or a user-specific
      login script, with `-l` login mode respecting `~/.hushlogin`. It reads
      `~/.mailcheckrc` first and falls back to `/etc/mailcheckrc` when no user file
      exists.
    - >
      Configuration is line-oriented: local mailbox paths or Maildir directories, plus
      `pop3:` and `imap:` URLs for remote mailboxes. Passwords are not stored in
      `mailcheckrc`; for POP3 and IMAP, the manpage says credentials come from
      `~/.netrc`.
related-packages: []
category: productivity
package-manager:
  brew: mailcheck
  debian: mailcheck
  nix: mailcheck
  ubuntu: mailcheck
package-manager-url: https://formulae.brew.sh/formula/mailcheck
license: GPL-2.0-or-later
tags:
  - cli
  - email
  - imap
  - mailbox
  - maildir
  - pop3
description: Check multiple mailboxes/maildirs for mail
executables:
  - mailcheck
provenance:
  formula: mailcheck
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
