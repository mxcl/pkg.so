id: brew:dovi_convert
display-name: dovi_convert
homepage: https://docs.doviconvert.com
repo: https://github.com/cryptochrome/dovi_convert
docs:
  - https://github.com/cryptochrome/dovi_convert#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dovi_convert's adoption is tied to home-theater and media-server users who
      maintain MKV libraries and want Dolby Vision compatibility on devices such as
      Apple TV, Shield, and Fire TV-class players. Version 7.3.2 added Homebrew
      installation, making the tool easier to install on macOS and Linux.
    - >
      Version 8.0.0 changed the command syntax to `dovi_convert [command] [flags]
      [files]`, merged batch behavior into the `convert` command, and formalized a more
      Unix-like CLI. Version 8.2.0 added backup and restore of the Dolby Vision
      enhancement layer, which made destructive library conversion less risky for users
      trying to save disk space.
  package-nerd-significance:
    - >
      dovi_convert is package-nerd significant because it turns a fragile multi-tool
      media workflow into an installable command. The package is less about one codec
      primitive and more about orchestrating exact versions and behaviors of several
      external binaries.
    - >
      Its Homebrew formula is useful because media-library operators often run these
      workflows from macOS or Linux shells and want dependency detection, repeatable
      upgrades, and a single named command instead of a personal pile of scripts.
  project-history:
    - >
      The public GitHub repository was created in December 2025, but the changelog shows
      a fast-moving tool history around versions 7 and 8. The v7.0.0 release notes
      describe a complete Python rewrite from an original Bash script, replacing shell
      utilities such as jq, bc, curl, sed, awk, and grep with Python and core media-tool
      dependencies.
    - >
      The project exists because many common streaming devices do not support Dolby
      Vision Profile 7 enhancement layers. Its README says the tool analyzes files
      first, converts only what is safe, preserves dynamic metadata, and skips complex
      FEL cases by default unless the user explicitly forces conversion.
  related-projects:
    - dovi_tool is the core Dolby Vision metadata utility used by dovi_convert.
    - >
      FFmpeg, MKVToolNix, and MediaInfo are required media-analysis and
      container-manipulation tools.
    - dovi_scripts is credited by the project as an inspiration and knowledge source.
  sources:
    - https://github.com/cryptochrome/dovi_convert
    - https://docs.doviconvert.com
    - https://raw.githubusercontent.com/cryptochrome/dovi_convert/main/CHANGELOG.md
    - https://api.github.com/repos/cryptochrome/dovi_convert
    - https://api.github.com/repos/cryptochrome/dovi_convert/releases?per_page=5
    - https://formulae.brew.sh/formula/dovi_convert
  summary:
    - >
      dovi_convert is a media-library CLI for converting Dolby Vision Profile 7 MKV
      files to Profile 8.1 for wider playback compatibility. It wraps and coordinates
      tools such as dovi_tool, FFmpeg, MKVToolNix, and MediaInfo while trying to avoid
      unsafe conversions.
  timeline:
    - '2025: Public GitHub repository created.'
    - '2026: v7.0.0 rewrites the tool in Python from the original Bash script.'
    - '2026: v7.3.2 adds Homebrew installation.'
    - '2026: v8.0.0 introduces the new command syntax and unified convert command.'
    - '2026: v8.2.0 adds backup and restore for the enhancement layer.'
  usage:
    - >
      Users run commands such as `dovi_convert scan`, `dovi_convert convert Movie.mkv`,
      or `dovi_convert convert /path/to/media` to inspect and batch-convert MKV files.
      The tool depends on Python 3.8+, FFmpeg, MKVToolNix, MediaInfo, and dovi_tool.
    - >
      The project also ships Docker-oriented workflows with a web terminal, which
      matters for NAS and media-server environments where users may run conversion jobs
      next to their media storage.
related-packages:
  - id: brew:dovi_tool
    reason: >
      dovi_tool is a declared requirement that supplies the Dolby Vision metadata
      operations used by dovi_convert.
    rel: adjacent_workflow
    sources:
      - https://github.com/cryptochrome/dovi_convert
      - https://github.com/quietvoid/dovi_tool
  - id: brew:ffmpeg
    reason: >
      FFmpeg is a declared dovi_convert requirement for the video-stream stages of its
      conversion workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/cryptochrome/dovi_convert
      - https://ffmpeg.org/ffmpeg.html
  - id: brew:mkvtoolnix
    reason: >
      MKVToolNix is a declared requirement for working with the MKV containers processed
      by dovi_convert.
    rel: adjacent_workflow
    sources:
      - https://github.com/cryptochrome/dovi_convert
      - https://mkvtoolnix.download/doc/
  - id: cask:mediainfo
    reason: >
      MediaInfo is a declared requirement used alongside dovi_convert to inspect media
      metadata and validate inputs.
    rel: adjacent_workflow
    sources:
      - https://github.com/cryptochrome/dovi_convert
      - https://mediaarea.net/en/MediaInfo
category: media
