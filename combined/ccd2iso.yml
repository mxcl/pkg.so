history:
  adoption-history:
    - >
      The supplied package facts show ccd2iso packaged across Homebrew, Fedora/dnf,
      MacPorts, Nix, Arch/pacman, and Ubuntu. That breadth reflects the tool's utility
      as a tiny format-conversion helper rather than a large actively branded
      application.
  package-nerd-significance:
    - >
      ccd2iso is package-nerd material because it is the kind of tiny, aging format
      converter distributions keep alive for compatibility. Its value is not novelty; it
      is that a package manager can still install the exact tool needed for an old
      optical-disc image workflow.
  project-history:
    - >
      The SourceForge project metadata lists a creation date of November 11, 2003, with
      Linux, C, GPLv2, command-line UI, and file-systems classifications. The project
      file feed shows early tarball releases in 2003, 2005, and 2006.
  related-projects:
    - >
      The project sits in the same historical tooling area as ISO, CloneCD, and other
      optical-disc image conversion utilities.
  sources:
    - https://ccd2iso.sourceforge.net/
    - https://sourceforge.net/projects/ccd2iso
    - https://sourceforge.net/projects/ccd2iso/files/ccd2iso
    - https://formulae.brew.sh/api/formula/ccd2iso.json
  summary:
    - >
      ccd2iso is a small C command-line utility for converting CloneCD image files into
      ISO images. Its SourceForge project describes it as a CloneCD image to ISO image
      file converter.
  timeline:
    - '2003: SourceForge project created.'
    - '2003: 0.1 tarball appeared in the SourceForge file feed.'
    - '2005: 0.2 tarball appeared in the SourceForge file feed.'
    - '2006: 0.3 tarball appeared in the SourceForge file feed.'
  usage:
    - >
      The practical use case is narrow: converting CloneCD disk-image sets into ISO
      files that Unix-like systems and CD/DVD tooling can handle more directly.
related-packages: []
