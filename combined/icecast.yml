id: brew:icecast
display-name: Icecast
homepage: https://icecast.org/
repo: https://gitlab.xiph.org/xiph/icecast-server
docs:
  - https://icecast.org/docs
config-file-location:
  unix: /usr/local/etc/icecast.xml
  windows: current working directory/icecast.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      Icecast spread because it solved a practical hosting problem: a station or
      broadcaster could run a server, point one or more source clients at mountpoints,
      and publish streams without proprietary broadcast infrastructure. Xiph's public
      directory still centers on Icecast streams, reinforcing its role as infrastructure
      for internet radio discovery.
    - >
      Package-manager adoption is broad because the server is a classic Unix daemon with
      a single XML configuration file and a long-lived operational model. The input
      metadata lists packages across Homebrew, Alpine, Fedora, MacPorts, Nix, Scoop, and
      openSUSE.
  package-nerd-significance:
    - >
      Icecast is package-nerd significant because it is one of the canonical open-source
      internet-radio daemons. Installing it from a package manager turns a
      general-purpose machine into a streaming relay with a familiar service/config file
      shape.
    - >
      It also anchors several nearby packages and concepts: source clients, Xiph codecs,
      public stream directories, and the old but durable vocabulary of mounts,
      listeners, and internet radio servers.
  project-history:
    - >
      Icecast's public news archive shows active releases and community use in early
      1999, including Icecast 1.1.4 and live broadcast notes. It became part of the
      Xiph.Org multimedia stack, aligned with the foundation's goal of open protocols
      and software for internet media.
    - >
      Icecast 2 was a major rewrite for the 2000s streaming world. The 2.0.0
      announcement says it followed years of development and alpha testing and supported
      Ogg Vorbis and MP3 streaming. Later documentation describes Icecast as versatile
      server software for internet radio, private jukeboxes, and other multimedia
      streams.
  related-projects:
    - >
      Xiph.Org projects such as Vorbis, Opus, FLAC, and Theora are part of the same open
      multimedia ecosystem.
    - IceS is the related Xiph source-client project for feeding streams into Icecast.
    - dir.xiph.org is the public Icecast stream directory.
  sources:
    - https://dir.xiph.org/
    - https://formulae.brew.sh/formula/icecast
    - https://gitlab.xiph.org/xiph/icecast-server
    - https://icecast.org/docs/icecast-2.4.1/introduction.html
    - https://icecast.org/faq/
    - https://icecast.org/news/
    - https://icecast.org/news/icecast-release-2_0_0/
  summary:
    - >
      Icecast is Xiph.Org's free streaming media server, historically associated with
      internet radio and open audio formats. The Homebrew formula packages the server
      daemon that receives source-client streams and serves them to listeners over
      network mountpoints.
  timeline:
    - '1999: Icecast news posts document active 1.x releases and broadcasts.'
    - '2004: Icecast 2.0.0 was announced after years of development and alpha testing.'
    - >
      2014: Icecast 2.4.1 documentation describes Ogg Vorbis and MP3 streaming plus Unix
      and Windows support.
    - '2016: The Xiph GitLab project for the server was created.'
    - '2025: GitLab tags include the 2.5.0 release line.'
  usage:
    - >
      Users run `icecast` as a streaming server, configure passwords and mount behavior
      in `icecast.xml`, then connect source clients that publish audio or video streams.
      Icecast creates mountpoints as sources connect, and listeners access those
      mountpoints over HTTP.
    - >
      The FAQ warns users to start from the default config and change only the passwords
      before adding more settings, which fits the server's long history of copy-pasted
      and overgrown configurations.
related-packages:
  - id: brew:liquidsoap
    reason: >
      Liquidsoap's `output.icecast` operator generates, mixes, schedules, encodes, and
      sends a station feed to Icecast, which then relays it to listeners.
    rel: adjacent_workflow
    sources:
      - https://www.liquidsoap.info/doc-dev/icecast
      - https://icecast.org/docs/
  - id: brew:ffmpeg
    reason: >
      FFmpeg documents an Icecast output protocol, allowing captured, remuxed, or
      transcoded media to be published directly to an Icecast mountpoint.
    rel: adjacent_workflow
    sources:
      - https://ffmpeg.org/ffmpeg-protocols.html#Icecast
      - https://icecast.org/docs/
  - id: brew:darkice
    reason: >
      DarkIce records and encodes live audio and can send it to a streaming server,
      providing a focused live source-client workflow for an Icecast deployment.
    rel: adjacent_workflow
    sources:
      - https://github.com/rafael2k/darkice
      - https://www.icecast.org/download/
  - id: brew:libshout
    reason: >
      libshout is Xiph.Org's client library for applications that need to send encoded
      streams to Icecast, complementing the server for custom source-client development.
    rel: adjacent_workflow
    sources:
      - https://icecast.org/docs/libshout/
      - https://gitlab.xiph.org/xiph/icecast-libshout
      - https://icecast.org/download/
category: media
package-manager:
  apk: icecast
  brew: icecast
  dnf: icecast
  macports: icecast
  nix: icecast
  scoop: extras/icecast
  zypper: icecast
package-manager-url: https://formulae.brew.sh/formula/icecast
license: GPL-2.0-only
tags:
