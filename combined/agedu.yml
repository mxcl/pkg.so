id: brew:agedu
display-name: agedu
homepage: https://www.chiark.greenend.org.uk/~sgtatham/agedu/
repo: https://git.tartarus.org/?p=simon%2Fagedu.git
docs:
  - https://www.chiark.greenend.org.uk/~sgtatham/agedu
  - https://www.chiark.greenend.org.uk/~sgtatham/agedu/manpage.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      agedu is packaged beyond its upstream tarball: the supplied package metadata lists
      Homebrew, Debian, Fedora, Nix, and Ubuntu packages. That packaging spread makes
      sense for a portable Unix C utility whose primary competition is the standard `du`
      plus ad hoc shell commands.
    - >
      The upstream page also provides a Windows scan-only helper that emits data
      suitable for loading into agedu on Unix, showing that its adoption niche includes
      mixed environments even though the main program is not a native Windows port.
  package-nerd-significance:
    - >
      agedu is a classic sysadmin package: small, old-school, one binary, local HTML
      output, and designed to answer a question that `du` cannot quite answer. It is
      useful package-manager material because it extends a ubiquitous Unix workflow
      without adding a service or desktop dependency.
    - >
      Its default index file, local-only web server, restrictive index permissions, and
      CGI mode are also very Unix: compose files, text dumps, local HTTP, and
      admin-controlled deployment rather than a centralized storage product.
  project-history:
    - >
      agedu comes from Simon Tatham's long-running Unix utility collection. Its official
      page introduces it as a Unix utility for tracking down wasted disk space,
      motivated by the limitation that ordinary `du` finds large directories but not
      necessarily stale ones.
    - >
      The project page says agedu works for the author and has had a small amount of
      beta testing, and asks for reports from users scanning particularly large data
      sets. The same page points to the current source archive, a Git clone URL, and a
      web browser for the development repository.
  related-projects:
    - du is the standard Unix baseline agedu extends with access-time analysis.
    - >
      ageduscan.exe is the upstream Windows scan-only helper for producing dump files
      loadable by agedu.
  sources:
    - official agedu homepage
    - official agedu manpage
    - source_facts.package-manager
  summary:
    - >
      agedu is Simon Tatham's Unix disk-usage analyzer that combines du-style size
      accounting with last-access times, helping users find large old data that is more
      likely to be safe to delete or archive.
  timeline:
    - "2000s: agedu published on Simon Tatham's site as a Unix disk cleanup utility."
    - >
      2026: Official page last modified and current source archive published as
      agedu-20260410.3622eda.tar.gz.
  usage:
    - >
      A typical run scans a tree with `agedu -s /path`, builds an `agedu.dat` index,
      then serves a local web interface with `agedu -w` or produces text reports with
      `agedu -t`. The man page also documents dump/load modes for moving scan data
      between machines or architectures.
    - >
      The official documentation repeatedly emphasizes that agedu does not prove data is
      unwanted; it highlights promising cleanup targets by coloring or filtering disk
      usage by access age.
related-packages:
  - id: brew:ncdu
    reason: >
      Choose ncdu when you want a fast interactive terminal browser for finding space
      hogs, rather than agedu's access-age analysis and HTML reporting.
    rel: alternative
    sources:
      - https://dev.yorhel.nl/ncdu
      - https://www.chiark.greenend.org.uk/~sgtatham/agedu/
  - id: brew:dua-cli
    reason: >
      Choose dua when parallel scanning and an interactive workflow for marking and
      deleting unwanted files matter more than agedu's last-access-time view.
    rel: alternative
    sources:
      - https://github.com/Byron/dua-cli#readme
      - https://www.chiark.greenend.org.uk/~sgtatham/agedu/
  - id: brew:dust
    reason: >
      Choose dust for an immediate, compact command-line visualization of the largest
      directory trees without first creating agedu's persistent index.
    rel: alternative
    sources:
      - https://github.com/bootandy/dust#readme
      - https://www.chiark.greenend.org.uk/~sgtatham/agedu/manpage.html
category: system
package-manager:
  brew: agedu
  debian: agedu
  dnf: agedu
  nix: agedu
  ubuntu: agedu
package-manager-url: https://formulae.brew.sh/formula/agedu
license: MIT
tags:
  - cli
  - disk-usage
  - filesystem
  - unix
description: Unix utility for tracking down wasted disk space
executables:
  - agedu
provenance:
  formula: agedu
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
