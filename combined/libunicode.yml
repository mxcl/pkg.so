id: brew:libunicode
display-name: libunicode
homepage: https://github.com/contour-terminal/libunicode
repo: https://github.com/contour-terminal/libunicode
docs:
  - https://github.com/contour-terminal/libunicode
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README names Contour Terminal Emulator as a user of the library. That adoption
      path explains the library's emphasis on terminal-relevant Unicode details such as
      grapheme clusters, width, variation selectors, emoji behavior, and text-run
      segmentation.
    - >
      Packaging in Homebrew and other Unix-like package sets gives developers a small
      C++ alternative to larger Unicode stacks when they want terminal- or
      text-processing-oriented Unicode support without adopting ICU's older C/C++ API
      style.
  package-nerd-significance:
    - >
      libunicode is package-nerd significant as a terminal-driven Unicode library: it
      focuses on the messy details that make modern terminal rendering hard, especially
      grapheme clusters, emoji sequences, variation selectors, and wcwidth-like
      behavior.
  project-history:
    - >
      The project describes its goal as painless Unicode support for C++ with simple
      APIs that feel familiar to C++ standard-library users. Its feature set includes
      Unicode Character Database property access, UTF-8 and UTF-32 conversion,
      wcwidth-style width calculation, grapheme segmentation, emoji and script
      segmentation, word segmentation, and a unicode-query command-line tool.
    - >
      The v0.1.0 release on November 3, 2022 called itself an initial release after two
      and a half years and said the project had already been actively used by Contour
      Terminal. Later tags show a steady 0.x progression through v0.9.0 on April 9,
      2026.
  related-projects:
    - Contour Terminal Emulator is the primary named user and sibling project.
    - >
      Terminal Unicode Core is a related Contour specification addressing grapheme
      clusters, variation selectors, and cursor placement.
    - >
      ICU is the larger mature Unicode library that libunicode explicitly contrasts
      itself with in the README.
  sources:
    - https://contour-terminal.org/vt-extensions/unicode-core/
    - https://github.com/contour-terminal/libunicode
    - https://github.com/contour-terminal/libunicode/releases/tag/v0.1.0
    - https://github.com/contour-terminal/libunicode/releases/tag/v0.9.0
    - https://github.com/contour-terminal/libunicode/tags
  summary:
    - >
      libunicode is a modern C++20 Unicode library from the Contour Terminal ecosystem,
      focused on practical Unicode properties, segmentation, width calculation, and
      conversion APIs.
  timeline:
    - '2020: The v0.1.0 release note says the first commit was in May 2020.'
    - '2022: v0.1.0 was released on November 3, 2022 after active use in Contour Terminal.'
    - '2023: v0.3.0 was tagged on March 1, 2023 and v0.4.0 on November 27, 2023.'
    - '2024: v0.6.0 was tagged on September 30, 2024.'
    - >
      2026: v0.9.0 was released on April 9, 2026 with normalization, segmentation, and
      SIMD conversion work.
  usage:
    - >
      Developers can add libunicode as a submodule or CMake dependency and link against
      unicode::unicode. Users can inspect text with the unicode-query CLI, while
      applications use the library for width decisions, segmentation, conversion, and
      Unicode property lookup.
related-packages:
  - id: cask:contour
    reason: >
      Install Contour when you want the terminal emulator whose Unicode rendering
      workflow is the primary documented production use of libunicode.
    rel: adjacent_workflow
    sources:
      - https://github.com/contour-terminal/libunicode
      - https://contour-terminal.org/
  - id: brew:icu4c@79
    reason: >
      Choose ICU4C when you need a mature, broad C/C++ internationalization stack
      covering locale data, formatting, collation, conversion, and Unicode services
      beyond libunicode's focused modern C++ text-processing API.
    rel: alternative
    sources:
      - https://github.com/contour-terminal/libunicode#readme
      - https://unicode-org.github.io/icu/userguide/
      - https://unicode-org.github.io/icu/userguide/icu/services.html
category: developer-tools
