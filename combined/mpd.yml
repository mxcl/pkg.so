id: brew:mpd
display-name: Music Player Daemon
homepage: https://www.musicpd.org/
repo: https://github.com/MusicPlayerDaemon/MPD
docs:
  - https://mpd.readthedocs.io/en/stable
  - https://mpd.readthedocs.io/en/stable/developer.html
  - https://mpd.readthedocs.io/en/stable/user.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/mpd/mpd.conf
    - ~/.config/mpd/mpd.conf
    - /etc/mpd.conf
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/mpd/mpd.conf
    - ~/.config/mpd/mpd.conf
    - /etc/mpd.conf
history:
  adoption-history:
    - >
      Adoption spread beyond hobbyist Unix desktops into commercial audio hardware. The
      MPD project maintains a list of commercial products known to use MPD as a backend
      and frames that adoption through the GPL obligations attached to shipping modified
      GPL components. In package managers, MPD is the central server package that
      related packages orbit around: mpc controls it, mpdscribble and mpdas listen to
      its playback state for scrobbling, and client libraries expose the protocol to
      other programs.
  project-history:
    - >
      MPD's defining technical milestone is its separation of playback from control. The
      daemon runs in the background, maintains a music database and playlist, and lets
      separate clients manipulate playback, browse the database, or automate it over the
      protocol. That model made it attractive for headless machines, remote control,
      hotkey scripts, terminal front ends, web clients, and embedded audio setups. The
      MPD documentation presents mpc as the basic CLI client, while the wider ecosystem
      includes richer terminal, graphical, mobile, and web clients.
  sources:
    - https://en.wikipedia.org/wiki/Music_Player_Daemon
    - https://github.com/MusicPlayerDaemon/MPD
    - https://mpd.readthedocs.io/en/stable/user.html
    - https://raw.githubusercontent.com/MusicPlayerDaemon/MPD/master/AUTHORS
    - https://raw.githubusercontent.com/MusicPlayerDaemon/MPD/master/NEWS
    - https://www.musicpd.org/
    - https://www.musicpd.org/commercial.html
  summary:
    - >
      Music Player Daemon is a free software music server that appeared in 2003 and is
      associated with Max Kellermann and The Music Player Daemon Project. The project
      describes MPD as a flexible, powerful, server-side application for playing music,
      controlled through its network protocol and extended through plugins and libraries
      for many audio formats. The project AUTHORS file credits a broad contributor base
      around the daemon.
  usage:
    - >
      In practice, users configure mpd.conf, point MPD at a music directory or streams,
      choose audio outputs, and control it from clients. Its niche is not an all-in-one
      player interface, but a long-running playback service for people who want the
      player decoupled from the interface.
related-packages:
  - id: brew:mpc
    reason: >
      Use mpc as MPD's minimalist command-line controller for queue, playback, and
      daemon commands.
    rel: adjacent_workflow
    sources:
      - https://www.musicpd.org/clients/mpc/
      - https://mpd.readthedocs.io/en/stable/user.html
  - id: brew:mpdscribble
    reason: >
      Run mpdscribble beside MPD when tracks played by the daemon should be submitted to
      a scrobbling service.
    rel: adjacent_workflow
    sources:
      - https://www.musicpd.org/clients/mpdscribble/
      - https://github.com/MusicPlayerDaemon/mpdscribble
  - id: brew:mpdas
    reason: >
      Run mpdas beside MPD when its AudioScrobbler 2.0 support, offline cache, or
      Libre.fm option better fits the scrobbling workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/hrkfdn/mpdas
category: media
package-manager:
  apk: mpd
  brew: mpd
  chocolatey: mpd
  debian: mpd
  dnf: mpd
  macports: mpd
  nix: mpd
  pacman: mpd
  scoop: main/mpd
  ubuntu: mpd
  zypper: mpd
