id: brew:bltool
display-name: bltool
homepage: https://github.com/ToxicFrog/bltool
repo: https://github.com/ToxicFrog/bltool
docs:
  - https://github.com/ToxicFrog/bltool#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bltool served a niche automation audience: Backloggery users who wanted bulk add,
      delete, filter, and import workflows rather than editing a game list by hand. The
      Homebrew formula made that niche tool easy to install on macOS.
  package-nerd-significance:
    - >
      bltool is interesting mostly as a frozen snapshot of personal-data plumbing around
      2010s game-tracking sites: a Clojure jar packaged for Homebrew, shell pipelines,
      EDN/JSON interchange, and fragile integrations with consumer web services.
  project-history:
    - >
      Ben "ToxicFrog" Kelly released bltool in 2013 as a command-line helper for
      managing a Backloggery game collection. Its release tags run from v0.1.0 in 2013
      through v0.2.4 in 2017, and the README records an explicit unmaintained status
      update.
    - >
      The tool was built with Leiningen and distributed as a Java jar/release zip, with
      Homebrew offered as the macOS package-manager path.
  related-projects:
    - Backloggery is the primary destination service.
    - Steam Community and Xbox Live are optional import sources.
    - Leiningen is the documented build tool for source builds.
  sources:
    - https://github.com/ToxicFrog/bltool#readme
    - https://github.com/ToxicFrog/bltool/releases
    - source_facts.package-manager
  summary:
    - >
      bltool is a Clojure command-line utility for moving game-library data into and out
      of Backloggery, with import paths for Steam and Xbox Live. The project README now
      marks it unmaintained and warns that it has issues with the current Backloggery
      site.
  timeline:
    - >
      2013: v0.1.0 tag published and README copyright names Ben "ToxicFrog" Kelly and
      Google Inc.
    - >
      2014: v0.1.x releases continued with import and format workflows documented in the
      README.
    - '2017: v0.2.4 tag published.'
    - '2021: README updated to say the project is no longer maintained.'
  usage:
    - >
      The command reads from formats such as Backloggery, Steam, Xbox Live, text, EDN,
      and JSON, then writes to Backloggery operations or local files. Backloggery writes
      use command-line username and password options rather than a documented
      credentials file.
    - >
      Examples in the README show Steam-to-text-to-Backloggery imports, duplicate
      filtering, and deletion workflows composed with ordinary shell commands.
related-packages: []
category: productivity
