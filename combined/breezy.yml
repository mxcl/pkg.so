id: brew:breezy
display-name: Breezy
homepage: https://www.breezy-vcs.org/
repo: https://github.com/breezy-team/breezy
docs:
  - https://www.breezy-vcs.org/doc/en
  - https://www.breezy-vcs.org/doc/en/user-reference/authentication-help.html
  - https://www.breezy-vcs.org/doc/en/user-reference/configuration-help.html
config-file-location:
  unix:
    - ~/.config/breezy/breezy.conf
    - ~/.config/breezy/locations.conf
    - .bzr/branch/branch.conf
credentials-file-location:
  unix: ~/.config/breezy/authentication.conf
history:
  adoption-history:
    - >
      The input package facts show unusually broad package-manager coverage for a
      non-Git VCS: Alpine, Homebrew, Chocolatey, Debian, Fedora, MacPorts, Nix, Arch,
      and Ubuntu all carry Breezy or Bazaar-compatible packaging names.
    - >
      Breezy's adoption comes from two overlapping audiences: existing Bazaar users who
      needed maintained tooling, and developers who wanted Bazaar's workflow with Git
      interoperability. Its official docs also link Launchpad support, Bazaar
      mailing-list continuity, and Breezy-specific Matrix support.
  package-nerd-significance:
    - >
      Breezy is significant because it is the maintained package-manager path for
      Bazaar-era version-control workflows. It keeps old branch formats and protocols
      usable while making the tool viable on Python 3.
    - >
      It also matters as a rare bridge VCS package: it is neither simply Git nor simply
      Bazaar. Package maintainers have to account for compatibility executables, Git
      helpers, Python dependencies, and distro naming differences such as brz versus
      bzr.
    - >
      For history-minded users, Breezy shows how package ecosystems preserve tooling
      after a dominant upstream fades. A fork can become the practical continuation when
      distributions, users, and hosted services still depend on old formats.
  project-history:
    - >
      The official README states that Breezy is a friendly fork of Bazaar, whose
      original project was hosted on Launchpad. It explicitly names Python 3 support as
      a key difference from Bazaar's Python 2 codebase.
    - >
      The GitHub repository was created in May 2018, while the official documentation
      footer credits Breezy Developers from 2017-2018. That places the fork in the
      period when many Python projects were moving away from Python 2 and legacy Bazaar
      users still needed a maintained path.
    - >
      Breezy kept the bzr command available while introducing brz, and its input package
      facts list executables for brz, bzr, Git remote helpers, and Bazaar smart-server
      helpers. That continuity is central to its history: it is both a successor and a
      compatibility bridge.
  related-projects:
    - Bazaar is the direct predecessor and compatibility target named by the Breezy README.
    - Git is a supported file format and interoperability target named by the README.
    - >
      Launchpad remains part of Breezy's support and migration story through docs,
      answers, bugs, and historical Bazaar hosting.
  sources:
    - https://api.github.com/repos/breezy-team/breezy
    - https://github.com/breezy-team/breezy
    - https://raw.githubusercontent.com/breezy-team/breezy/master/README.rst
    - https://www.breezy-vcs.org/doc/en
    - https://www.breezy-vcs.org/doc/en/upgrade-guide/index.html
    - source_facts.package-manager
  summary:
    - >
      Breezy, invoked as brz, is a decentralized revision-control system and a friendly
      fork of Bazaar. It preserves Bazaar disk-format and protocol compatibility while
      running on Python 3 and adding native support for both Bazaar and Git file
      formats.
  timeline:
    - '2017: Official documentation credits Breezy Developers beginning in 2017.'
    - '2018-05: The Breezy GitHub repository was created.'
    - '2018: The README identifies Breezy as a Python 3 friendly fork of Bazaar.'
    - >
      2020: Breezy 3.x documentation and release notes became the main user-facing
      documentation set.
    - '2026: Official repository metadata showed active development continuing.'
  usage:
    - >
      The README describes Breezy as supporting both centralized workflows like
      CVS/Subversion and distributed workflows like Git/Mercurial, including checkouts,
      feature branches, and shared working trees.
    - >
      The documentation set includes a user guide, tutorials, quick reference, release
      notes, upgrade guide, user reference, admin guide, migration docs, and plugin
      docs. The upgrade guide covers checking, reconciling, and upgrading branch
      formats, especially for larger communities and Launchpad-hosted branches.
    - >
      Configuration and authentication are documented in Breezy's user reference. The
      curated paths for breezy.conf, locations.conf, branch.conf, and
      authentication.conf match that role as a full VCS with local, per-location,
      per-branch, and credential configuration.
related-packages:
  - id: brew:git
    reason: >
      Choose Git for the dominant Git-native ecosystem; choose Breezy when Bazaar
      compatibility or a single client spanning Bazaar and Git formats is required.
    rel: alternative
    sources:
      - https://github.com/breezy-team/breezy
      - https://git-scm.com/about
  - id: brew:mercurial
    reason: >
      Mercurial is an alternative distributed VCS with an hg-oriented workflow, while
      Breezy additionally preserves Bazaar formats and protocols and directly supports
      Git repositories.
    rel: alternative
    sources:
      - https://github.com/breezy-team/breezy
      - https://www.mercurial-scm.org/
category: developer-tools
package-manager:
  apk: breezy
  brew: breezy
  chocolatey: bzr
  debian: brz
  dnf: breezy
  macports: bzr
  nix: breezy
  pacman: breezy
  ubuntu: brz
package-manager-url: https://formulae.brew.sh/formula/breezy
license: GPL-2.0-or-later
tags:
  - bazaar
  - brz
  - cli
  - distributed-vcs
  - git-support
  - python
  - version-control
description: Version control system implemented in Python with multi-format support
executables:
  - brz
  - bzr
  - bzr-receive-pack
  - bzr-upload-pack
  - git-remote-bzr
provenance:
  formula: breezy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
