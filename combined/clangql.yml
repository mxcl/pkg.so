id: brew:clangql
display-name: ClangQL
homepage: https://amrdeveloper.github.io/ClangQL/
repo: https://github.com/AmrDeveloper/ClangQL
docs:
  - https://amrdeveloper.github.io/ClangQL
  - https://github.com/AmrDeveloper/ClangQL#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents both cargo install clangql and brew install clangql.
      crates.io reported 10,891 total downloads, and Homebrew reported 470 installs over
      the prior 365 days for the formula.
  package-nerd-significance:
    - >
      ClangQL is interesting as a packaging artifact because it combines Rust
      distribution, libclang availability, and Homebrew bottles for a developer tool
      whose runtime behavior depends on the local LLVM/Clang stack.
  project-history:
    - >
      The repository and crates.io package both appeared in April 2024. The README
      presents ClangQL as a way to query C/C++ code instead of database files, with
      examples over functions and globals.
    - >
      The project has had a rapid 0.x release series on crates.io and GitHub tags.
      Homebrew currently packages a tagged GitHub archive as clangql 0.23.0, while
      crates.io metadata lists 0.11.0 as the max crate version.
  related-projects:
    - GitQL is the query-language SDK named in the README as ClangQL's foundation.
    - >
      LLVM/Clang and libclang are required runtime/build dependencies for parsing C and
      C++ code.
  sources:
    - https://github.com/AmrDeveloper/ClangQL#readme
    - https://amrdeveloper.github.io/ClangQL
    - https://api.github.com/repos/AmrDeveloper/ClangQL
    - https://api.github.com/repos/AmrDeveloper/ClangQL/releases
    - https://crates.io/api/v1/crates/clangql
    - https://formulae.brew.sh/api/formula/clangql.json
  summary:
    - >
      ClangQL is a Rust CLI that applies a SQL-like query language to C and C++ code
      through Clang AST data and the GitQL SDK.
  timeline:
    - '2024: GitHub repository and crates.io crate created.'
    - '2024: Early 0.2.0 and 0.3.0 GitHub releases published.'
    - '2025: 0.8.0 through 0.11.0 releases published on GitHub/crates.io.'
    - '2026: Homebrew formula metadata lists 0.23.0 as stable from a GitHub tag.'
  usage:
    - >
      Users pass source files, a script, or an inline query and can request rendered,
      JSON, or CSV output. The examples show SQL-like SELECT, COUNT, DISTINCT, LIKE, and
      matcher predicates over functions and globals.
related-packages:
  - id: brew:gql
    reason: >
      GitQL queries Git repository data and exposes the SDK that ClangQL reuses, so it
      complements ClangQL when the investigation needs both source-code structure and
      repository history.
    rel: adjacent_workflow
    sources:
      - https://github.com/AmrDeveloper/ClangQL#readme
      - https://amrdeveloper.github.io/GQL/
category: developer-tools
package-manager:
  brew: clangql
package-manager-url: https://formulae.brew.sh/formula/clangql
license: MIT
tags:
  - clang
  - cli
  - code-query
  - cpp
  - gitql
  - sql
  - static-analysis
description: Run a SQL like language to perform queries on C/C++ files
executables:
  - clangql
provenance:
  formula: clangql
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
