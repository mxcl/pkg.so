id: brew:erlang@27
display-name: Erlang/OTP 27
homepage: https://www.erlang.org/
repo: https://github.com/erlang/otp
docs:
  - https://www.erlang.org/docs/27
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package-manager facts show Erlang distributed through Homebrew, apk,
      Chocolatey, MacPorts, Scoop, winget, zypper, and other common packaging channels.
      A versioned Homebrew formula lets users keep OTP 27 installed for codebases that
      target that release line.
  package-nerd-significance:
    - >
      OTP 27 is a useful package-manager boundary because it introduced language and
      documentation features that downstream tools and formatters needed to learn, while
      still being old enough for projects to pin deliberately.
  project-history:
    - >
      Erlang/OTP 27.0 was announced on May 15, 2024 as a major Erlang/OTP release.
      Official highlights included the new documentation system based on EEP-59,
      triple-quoted strings, sigils, and build changes around year-2038-safe timestamps.
  related-projects:
    - >
      erlfmt added support for OTP 27 language features such as sigils and triple-quoted
      strings.
    - Erlang LS listed OTP 27 among its supported OTP versions in its README.
  sources:
    - https://www.erlang.org/
    - https://www.erlang.org/news/170
    - https://www.erlang.org/news/
    - https://formulae.brew.sh/formula/erlang@27
    - https://raw.githubusercontent.com/WhatsApp/erlfmt/main/CHANGELOG.md
    - https://raw.githubusercontent.com/erlang-ls/erlang_ls/master/README.md
  summary:
    - >
      Erlang/OTP 27 is the versioned Homebrew package for the OTP 27 major line, giving
      projects a pinned Erlang runtime while the upstream Erlang/OTP project keeps
      releasing newer lines.
  timeline:
    - '2024-05-15: Erlang/OTP 27.0 announced as a new major release.'
    - '2024: OTP 27.1 and OTP 27.2 followed as maintenance patch packages.'
    - '2025: OTP 27.3 continued the OTP 27 maintenance line.'
  usage:
    - >
      Installing erlang@27 provides the normal Erlang/OTP CLI surface for that line:
      erl, erlc, escript, dialyzer, ct_run, epmd, typer, and related runtime utilities.
related-packages:
  - id: brew:rebar3
    reason: >
      Use Rebar3 with OTP 27 to create, compile, test, dependency-lock, and release
      Erlang applications; its official compatibility table documents OTP 27 support.
    rel: adjacent_workflow
    sources:
      - https://github.com/erlang/rebar3
      - https://rebar3.org/docs/
  - id: brew:erlfmt
    reason: >
      Use erlfmt to format OTP 27 source and enforce formatting in CI; its official
      releases specifically added support for OTP 27 sigils, triple-quoted strings, and
      documentation attributes.
    rel: adjacent_workflow
    sources:
      - https://github.com/WhatsApp/erlfmt
      - https://github.com/WhatsApp/erlfmt/releases
category: language-runtime
package-manager:
  apk: erlang27
  brew: erlang@27
  chocolatey: erlang
  debian: python-typer-doc
  dnf: erlang
  macports: erlang
  nix: typer
  pacman: erlang
  scoop: main/erlang
  ubuntu: python-typer-doc
  winget: Erlang.ErlangOTP
  zypper: erlang27
package-manager-match:
  chocolatey: fallback
  dnf: fallback
  macports: fallback
  pacman: fallback
  scoop: fallback
  winget: fallback
package-manager-url: https://formulae.brew.sh/formula/erlang@27
license: Apache-2.0
tags:
  - beam
  - cli
  - concurrency
  - erlang
  - functional-programming
  - otp
  - runtime
description: Programming language for highly scalable real-time systems
executables:
  - ct_run
  - dialyzer
  - epmd
  - erl
  - erlc
  - escript
  - run_erl
  - to_erl
  - typer
provenance:
  formula: erlang@27
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
