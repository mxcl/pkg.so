id: brew:cabal-install
display-name: cabal-install
homepage: https://www.haskell.org/cabal/
repo: https://github.com/haskell/cabal
docs:
  - https://cabal.readthedocs.io/en/stable
  - https://github.com/haskell/cabal#readme
  - https://www.haskell.org/cabal
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/cabal/config
    - ~/.config/cabal/config
    - ~/.cabal/config
  windows: '%APPDATA%/cabal/config'
credentials-file-location: null
history:
  adoption-history:
    - >
      cabal-install became a default expectation in Haskell development because it is
      tightly coupled to Hackage, the central package archive. The official Cabal site
      recommends GHCup as the preferred way to install the cabal executable, while still
      documenting distribution package managers and source/binary downloads.
    - >
      The tool has stayed relevant alongside newer Haskell tooling because it is both a
      package manager and a build driver. Its v2/new-build model, package solver, freeze
      files, project files, and Hackage integration make it an important base layer even
      when users reach it indirectly through other workflows.
  package-nerd-significance:
    - >
      For package nerds, cabal-install is a foundational package manager because it
      helped define the Haskell package metadata culture around .cabal files, Hackage
      uploads, solver-driven dependency plans, and reproducible-ish local project builds
      before many language ecosystems standardized similar workflows.
    - >
      Its distinction between a package description format, a library that understands
      the format, and a CLI that talks to Hackage is historically important. Many later
      package managers blur those roles; Cabal made them explicit and reusable within
      the Haskell ecosystem.
  project-history:
    - >
      The Haskell Cabal project defines the Common Architecture for Building
      Applications and Libraries. The project distinguishes cabal-the-spec,
      cabal-the-library, and cabal-the-tool; the Homebrew cabal-install package is the
      tool that supplies the cabal executable.
    - >
      Cabal's package description format and library became part of the common Haskell
      packaging infrastructure, while cabal-install added the command-line layer for
      interacting with local packages, remote packages, and Hackage. The upstream
      repository now contains Cabal, Cabal-syntax, cabal-install, cabal-install-solver,
      and related components.
    - >
      Hackage records Cabal package releases back to 1.1.6 and cabal-install releases
      back to 0.4.0, with current 3.x releases maintained by the Cabal Development Team.
  related-projects:
    - Cabal is the library and specification side of the same upstream repository.
    - Hackage is the package archive cabal-install targets.
    - GHCup is the recommended installer for GHC and cabal-install on current official pages.
    - Stack is a related Haskell build tool that commonly coexists with Cabal-based packages.
  sources:
    - https://cabal.readthedocs.io/en/stable/
    - https://github.com/haskell/cabal
    - https://github.com/haskell/cabal/tree/master/cabal-install
    - https://hackage.haskell.org/package/Cabal
    - https://hackage.haskell.org/package/cabal-install
    - https://www.haskell.org/cabal/
  summary:
    - >
      cabal-install provides the cabal command-line interface for Cabal and Hackage. It
      is the traditional Haskell package/build tool and remains central to building,
      fetching, configuring, and installing Haskell packages.
  timeline:
    - '2003: Cabal and cabal-install copyright history begins in Hackage metadata.'
    - >
      2007: Hackage lists cabal-install 0.4.0 as the earliest cabal-install version in
      its version history.
    - >
      2012: cabal-install 0.14.x appears in Hackage's version sequence, preceding the
      later 1.x and 2.x eras.
    - "2017: cabal-install 2.0.x appears in Hackage's version sequence."
    - "2019: cabal-install 3.0.x appears in Hackage's version sequence."
    - '2026-01-01: Hackage lists cabal-install 3.16.1.0 as the current release upload.'
  usage:
    - >
      Common commands include cabal init to create package metadata, cabal build to
      build a project, cabal run to run an executable target, cabal test for tests,
      cabal update to refresh the package index, and cabal install cabal-install to
      self-upgrade when appropriate.
    - >
      The tool manages Haskell package source, dependency solving, build plans, local
      project configuration, and interaction with Hackage. It is commonly installed
      alongside GHC, and the upstream README lists GHCup, official downloads, source
      builds, and preview releases as supported ways to obtain cabal-install.
related-packages:
  - id: brew:ghcup
    reason: >
      GHCup is the officially recommended way to install and switch cabal-install
      together with the rest of the Haskell toolchain.
    rel: adjacent_workflow
    sources:
      - https://www.haskell.org/cabal/download.html
      - https://www.haskell.org/ghcup/guide/
  - id: brew:ghc
    reason: >
      cabal-install resolves and orchestrates Haskell project builds, while GHC is the
      compiler it normally drives to compile those projects.
    rel: adjacent_workflow
    sources:
      - https://cabal.readthedocs.io/en/stable/getting-started.html
      - https://www.haskell.org/ghc/
  - id: brew:haskell-stack
    reason: >
      Choose Stack as an alternative Haskell project build tool when you prefer its
      snapshot-centered workflow; official GHCup guidance presents Stack and
      cabal-install as the two common tools for dependency installation and ordered
      compilation.
    rel: alternative
    sources:
      - https://www.haskell.org/ghcup/steps/
      - https://docs.haskellstack.org/
  - id: brew:hpack
    reason: >
      Use hpack when you prefer authoring package.yaml and generating the .cabal package
      description consumed by cabal-install.
    rel: adjacent_workflow
    sources:
      - https://github.com/sol/hpack
      - https://cabal.readthedocs.io/en/stable/cabal-package-description-file.html
category: developer-tools
