id: brew:fltk
display-name: FLTK
homepage: https://www.fltk.org/
repo: https://github.com/fltk/fltk
docs:
  - https://www.fltk.org/documentation.php
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FLTK has been adopted by developers who need a small native GUI toolkit with
      permissive LGPL-with-exception licensing and broad platform reach. The project
      does not provide binary distributions, instead pointing users to source releases
      and operating-system package managers.
    - >
      The toolkit has stayed relevant in package collections because it builds small GUI
      utilities and ships useful developer commands such as fltk-config and FLUID, while
      avoiding heavier desktop-framework dependencies.
  package-nerd-significance:
    - >
      FLTK is package-nerd significant because it is a tiny but long-lived GUI toolkit
      with stable command-line helpers, cross-platform backends, bundled image-library
      considerations, OpenGL integration, and many downstream packages that depend on
      its headers and config script.
    - >
      It also illustrates a common packaging transition: older autotools workflows
      coexisting with, and later yielding to, CMake-only builds.
  project-history:
    - >
      Official FLTK sources say the toolkit was originally developed by Bill Spitzak and
      is now maintained by a small worldwide group of developers. Its README describes
      it as a compact C++ GUI toolkit for Unix/Linux, Windows, and macOS that avoids
      bloat while supporting modern GUI functionality and OpenGL.
    - >
      FLTK's public history reaches back to the late 1990s. The official README lists
      copyright from 1998 onward, and the 1.0 change log records the 1.0 series through
      1.0.11 in May 2001. Later release branches continued through the long-lived 1.1,
      1.3, and 1.4 series.
  related-projects:
    - >
      Official FLTK sources connect the package to FLUID, OpenGL and GLUT emulation,
      CMake, Doxygen-generated documentation, and platform backends for X11, Wayland,
      Windows, and macOS.
  sources:
    - https://github.com/fltk/fltk
    - https://raw.githubusercontent.com/fltk/fltk/master/CHANGES.txt
    - https://raw.githubusercontent.com/fltk/fltk/master/CHANGES_1.0.txt
    - https://raw.githubusercontent.com/fltk/fltk/master/CHANGES_1.4.txt
    - https://raw.githubusercontent.com/fltk/fltk/master/CREDITS.txt
    - https://raw.githubusercontent.com/fltk/fltk/master/README.md
    - https://www.fltk.org/
    - https://www.fltk.org/articles.php?L825=
    - https://www.fltk.org/documentation.php
  summary:
    - >
      FLTK, the Fast Light Tool Kit, is a lightweight cross-platform C++ GUI toolkit for
      Unix/Linux, Windows, and macOS, with OpenGL support and the FLUID interface
      designer.
  timeline:
    - '1998: Official README copyright range begins for FLTK.'
    - '2001: FLTK 1.0.11 closes the early 1.0 change-log range.'
    - '2024: FLTK 1.4.0 is released.'
    - >
      2025: FLTK 1.4.2 is released with bug fixes, platform fixes, Wayland improvements,
      FLUID improvements, and documentation updates.
    - >
      2026: FLTK 1.4.5 is released; 1.5 development prepares a CMake-only,
      C++11-required branch.
  usage:
    - >
      Developers use FLTK as a C++ library for native GUI applications and use FLUID to
      design interfaces and generate code. The fltk-config tool reports compile and link
      flags for downstream builds.
    - >
      Modern FLTK builds use CMake, with source releases and generated documentation
      published by the project. FLTK 1.5 development removes autotools support and
      requires a C++11-capable compiler.
related-packages:
  - id: brew:fltk@1.3
    reason: >
      Choose the versioned 1.3 package when maintaining software tied to FLTK's older
      1.3 API or ABI instead of moving it to the current stable line.
    rel: alternative
    sources:
      - https://www.fltk.org/documentation.php
      - https://www.fltk.org/articles.php?L825=
category: developer-tools
package-manager:
  apk: fltk
  brew: fltk
  debian: fltk-options
  dnf: fltk
  macports: fltk
  nix: fltk
  pacman: fltk
  ubuntu: fluid
  zypper: fltk-devel
package-manager-url: https://formulae.brew.sh/formula/fltk
license: LGPL-2.0-only WITH FLTK-exception
tags:
  - c-plus-plus
  - cli
  - cross-platform
  - gui
  - opengl
  - toolkit
description: Cross-platform C++ GUI toolkit
executables:
  - fltk-config
  - fltk-options
  - fluid
provenance:
  formula: fltk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
