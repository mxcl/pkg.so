id: brew:git-branchless
display-name: git-branchless
homepage: https://github.com/arxanas/git-branchless
repo: https://github.com/arxanas/git-branchless
docs:
  - https://github.com/arxanas/git-branchless/wiki
config-file-location:
  unix: <repository>/.git/branchless
  windows: <repository>/.git/branchless
credentials-file-location: null
history:
  adoption-history:
    - >
      git-branchless became one of the better-known modern Git workflow experiments. The
      project documents package-manager installation, Cargo installation, Git hooks,
      shell alias integration, discussions, Discord, and a user survey, and it
      benchmarks ideas against large repositories such as Linux and Mozilla's gecko-dev.
    - >
      Its related-tools page places it in the same ecosystem as Stacked Git, git-stack,
      git-ps, Jujutsu, Sapling, git-absorb, git-autofixup, and git-revise, making it
      part of the broader move toward stacked-diff and mutable-history workflows.
  package-nerd-significance:
    - >
      For package maintainers, git-branchless is notable because it ships a Rust CLI
      with Git hook integration, Cargo distribution, packages across several ecosystems,
      and commands that intentionally wrap or augment ordinary Git rather than replacing
      the repository format.
  project-history:
    - >
      The repository opened in 2020 and grew around a branchless workflow idea: users
      can commit directly, treat branches as optional labels, and manipulate commit
      graphs without fear of losing work. The README presents the tool as compatible
      with branches while adding undo, smartlog, restack, sync, move, next, prev, and
      interactive switch commands.
    - >
      The design goals describe git-branchless as an incremental improvement path for
      Git users and a test bed for workflows later explored by Jujutsu. Its emphasis is
      practical rather than academic: reduce Git complexity, increase developer
      velocity, and keep commands fast enough for very large repositories.
  related-projects:
    - >
      Related and adjacent tools include Jujutsu, Sapling, Stacked Git, git-stack, Git
      Patch Stack, git-absorb, git-autofixup, git-revise, Git itself, and large monorepo
      workflows.
  sources:
    - https://api.github.com/repos/arxanas/git-branchless
    - https://formulae.brew.sh/formula/git-branchless
    - https://github.com/arxanas/git-branchless
    - https://github.com/arxanas/git-branchless/releases
    - https://github.com/arxanas/git-branchless/wiki
    - https://github.com/arxanas/git-branchless/wiki/Design-goals
    - https://github.com/arxanas/git-branchless/wiki/Installation
    - https://github.com/arxanas/git-branchless/wiki/Related-tools
  summary:
    - >
      git-branchless is a Rust suite of Git workflow tools for undo, smart logs,
      commit-stack manipulation, restacking, syncing, and fast monorepo-scale history
      operations.
  timeline:
    - '2020: Repository created.'
    - '2021: Public 0.x tags began with v0.1.0 and expanded through frequent 0.3 releases.'
    - '2024: v0.10.0 continued the pre-1.0 release line.'
    - '2026: v0.11.1 was published in the same 0.x series.'
  usage:
    - >
      Practitioners install the executable, run git branchless init inside each
      repository, and then use git sl for a smart log, git undo for repository-level
      undo, git restack to repair abandoned descendants, git sync to rebase local
      stacks, and git move to manipulate subtrees of commits without checking them out.
related-packages:
  - id: brew:jj
    reason: >
      Choose Jujutsu for a separate Git-compatible VCS and working-copy model with
      anonymous branches, automatic rebasing, checked-in conflicts, and undo;
      git-branchless instead incrementally augments an ordinary Git working copy.
    rel: alternative
    sources:
      - https://github.com/arxanas/git-branchless/wiki/Related-tools
      - https://docs.jj-vcs.dev/latest/
  - id: brew:stgit
    reason: >
      Choose StGit when you want an explicitly managed stack of named patches alongside
      normal Git work; git-branchless instead encourages manipulating commits directly,
      with branches remaining optional labels.
    rel: alternative
    sources:
      - https://github.com/arxanas/git-branchless/wiki/Related-tools
      - https://stacked-git.github.io/
  - id: brew:git-absorb
    reason: >
      git-absorb complements a branchless commit stack by routing staged fixup changes
      into the earlier commits that introduced the affected lines.
    rel: adjacent_workflow
    sources:
      - https://github.com/arxanas/git-branchless/wiki/Related-tools
      - https://github.com/tummychow/git-absorb
  - id: brew:git-revise
    reason: >
      git-revise complements git-branchless with efficient working-copy-free operations
      for updating, splitting, and rearranging commits.
    rel: adjacent_workflow
    sources:
      - https://github.com/arxanas/git-branchless/wiki/Related-tools
      - https://git-revise.readthedocs.io/en/latest/
category: developer-tools
package-manager:
  apk: git-branchless
  brew: git-branchless
  macports: git-branchless
  nix: git-branchless
  pacman: git-branchless
  scoop: main/git-branchless
package-manager-url: https://formulae.brew.sh/formula/git-branchless
license: Apache-2.0 OR MIT
tags:
  - cli
  - git
  - version-control
  - workflow
description: High-velocity, monorepo-scale workflow for Git
executables:
  - git-branchless
provenance:
  formula: git-branchless
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
