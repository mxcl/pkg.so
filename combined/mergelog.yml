history:
  sources:
    - https://formulae.brew.sh/formula/mergelog
    - https://mergelog.sourceforge.net/
    - https://sourceforge.net/projects/mergelog/
  summary:
    - >
      MergeLog is a small C utility from the early 2000s Unix web-server toolkit era.
      Its SourceForge page describes a narrow operational purpose: merge httpd access
      logs in Common Log Format by date when a site is served by multiple web servers
      behind round-robin DNS. The page identifies Bertrand Demiddelaer and lists
      mergelog 4.5, dated 11 April 2001, as the stable release.
  usage:
    - >
      The package is intentionally specialized. It ships `mergelog` plus `zmergelog` for
      gzipped log files, and its practical role is pre-analysis log consolidation:
      administrators feed it several Apache/httpd log streams and receive one
      chronological stream that downstream log analyzers can consume. Homebrew and
      Ubuntu packaging preserve it as a small legacy sysadmin command rather than a
      general observability platform.
related-packages:
  - id: brew:goaccess
    reason: >
      Use MergeLog to chronologically combine Common Log Format streams from several
      servers, then pipe or pass the result to GoAccess for interactive analysis and
      reporting.
    rel: adjacent_workflow
    sources:
      - https://mergelog.sourceforge.net/
      - https://goaccess.io/man
