id: brew:certsync
display-name: certsync
homepage: https://github.com/zblurx/certsync
repo: https://github.com/zblurx/certsync
docs:
  - https://github.com/zblurx/certsync#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents local installation, PyPI installation, and BlackArch
      packaging, and links a Repology packaging-status badge. The supplied package facts
      also list Homebrew, MacPorts, and Nix packages.
  package-nerd-significance:
    - >
      certsync is package-nerd interesting because it represents the fast path from a
      newly described ADCS tradecraft technique to broad packaging in security
      distributions and general package managers. It is niche, but package presence
      makes lab and assessment reproduction much easier.
  project-history:
    - >
      The upstream GitHub repository was created in January 2023, with the first commit
      on the same day. A 0.1.6 GitHub release followed in March 2024, and the project is
      published as a Python package as well as source.
  related-projects:
    - >
      The README credits Certipy, the UnPAC the hash technique, Certified Pre-Owned,
      Certify, and GOAD as related research or lab projects.
  sources:
    - https://api.github.com/repos/zblurx/certsync
    - https://github.com/zblurx/certsync
    - https://github.com/zblurx/certsync#readme
    - https://formulae.brew.sh/api/formula/certsync.json
  summary:
    - >
      certsync is an Active Directory Certificate Services attack tool for remotely
      dumping NTDS data without DRSUAPI. Its README describes a workflow based on golden
      certificates and UnPAC the hash.
  timeline:
    - '2023: Public GitHub repository and first commit created.'
    - '2024: 0.1.6 release published.'
  usage:
    - >
      certsync collects users, CA information, and CRLs over LDAP, dumps the CA
      certificate and private key or uses a supplied CA PFX, forges certificates, and
      uses PKINIT plus UnPAC to recover hashes. Its options cover password, NTLM hash,
      Kerberos cache, AES key, DNS, LDAP filtering, and OPSEC timing controls.
related-packages: []
category: security
package-manager:
  brew: certsync
  macports: certsync
  nix: certsync
package-manager-url: https://formulae.brew.sh/formula/certsync
license: MIT
tags:
  - active-directory
  - adcs
  - certificates
  - cli
  - kerberos
  - ntds
description: Dump NTDS with golden certificates and UnPAC the hash
executables:
  - certsync
provenance:
  formula: certsync
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
