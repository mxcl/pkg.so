id: brew:golines
display-name: golines
homepage: https://github.com/golangci/golines
repo: https://github.com/golangci/golines
docs:
  - https://github.com/segmentio/golines#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      golines gained a niche among Go developers who wanted automatic line wrapping in
      editors or pre-commit hooks while preserving gofmt-compatible output. The README
      documents vim-go, Visual Studio Code run-on-save, and GoLand file watcher
      integration.
    - >
      The batch input records Homebrew, MacPorts, and Nix packages. That packaging
      profile fits a formatter users expect to install as a standalone command and wire
      into editor save hooks.
  package-nerd-significance:
    - >
      For package nerds, golines is interesting because it packages a policy that Go
      intentionally leaves out of gofmt. It is small, editor-friendly, and controversial
      in the quiet formatter way: valuable for teams with line-length standards,
      unnecessary for teams that accept gofmt's non-wrapping behavior.
    - >
      Its archive notice and golangci fork also make it a useful example of formatter
      lifecycle management: once a developer tool becomes part of save hooks and CI,
      packagers need to care about maintenance status, Go version requirements, and
      successor forks.
  project-history:
    - >
      Segment created golines to automate a style preference common in large Go
      codebases: reducing very long lines without abandoning gofmt. The README links the
      motivation to Go issue 11915 and notes that line-shortening remains
      developer-managed in the standard formatter.
    - >
      The tool evolved with options for maximum line length, tab width, dry-run diffs,
      comment shortening, base formatter selection, generated-file handling,
      method-chain splitting, and struct-tag formatting. Since v0.10.0 it required Go
      1.18 because of generics-related dependencies; v0.13.0 raised the minimum to Go
      1.23.
    - >
      The README records a maintenance turn: by late 2024 the project was in maintenance
      mode, and on 2025-12-19 the Segment repository was archived. The same notice
      points to a golangci-maintained fork that incorporated patches and fixes.
  related-projects:
    - gofmt and goimports are the base formatting tools golines builds around.
    - The Go issue about shortening long lines is part of the stated motivation.
    - >
      The golangci/golines fork is the maintainer-recommended continuation after the
      Segment archive notice.
  sources:
    - https://github.com/golang/go/issues/11915
    - https://github.com/golangci/golines/
    - https://github.com/segmentio/golines
    - https://github.com/segmentio/golines/releases
  summary:
    - >
      golines is a Go formatter that keeps gofmt-style formatting while shortening long
      lines. The maintainer documentation frames it as a companion to gofmt and
      goimports, which deliberately do not solve line wrapping for developers.
  timeline:
    - '2019: `segmentio/golines` repository created for Go line-wrapping formatting.'
    - >
      2020-2024: Releases add formatter behavior and editor integration patterns around
      gofmt/goimports.
    - '2024: README states the project had functionally entered maintenance mode.'
    - '2025: Segment repository archived; README points to a golangci-maintained fork.'
  usage:
    - >
      Users run `golines [paths]`, pass directories or files, or pipe input through
      stdin. By default it writes formatted output to stdout; `-w` edits files in place.
    - >
      The base formatter defaults to goimports when available and falls back to gofmt,
      so golines is usually an additive formatter step rather than a replacement for the
      Go formatting toolchain.
related-packages:
  - id: brew:golangci-lint
    reason: >
      golangci-lint can run golines as a configured formatter, making it the stronger
      choice when line wrapping should be enforced alongside a wider lint-and-format CI
      policy.
    rel: adjacent_workflow
    sources:
      - https://github.com/golangci/golangci-lint/blob/main/CHANGELOG.md
      - https://github.com/golangci/golines#readme
  - id: brew:goimports
    reason: >
      goimports is a practical companion because golines uses it as the preferred base
      formatter when present, adding and removing imports before shortening long lines.
    rel: adjacent_workflow
    sources:
      - https://github.com/golangci/golines#readme
      - https://pkg.go.dev/golang.org/x/tools/cmd/goimports
  - id: brew:gofumpt
    reason: >
      Choose gofumpt when the goal is a stricter, deterministic extension of gofmt
      style; choose golines when explicit maximum-line-length wrapping is the primary
      requirement.
    rel: alternative
    sources:
      - https://github.com/golangci/golines#readme
      - https://github.com/mvdan/gofumpt#readme
category: developer-tools
package-manager:
  brew: golines
  macports: golines
  nix: golines
package-manager-url: https://formulae.brew.sh/formula/golines
license: MIT
tags:
