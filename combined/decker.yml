id: brew:decker
display-name: Decker
homepage: https://beyondloom.com/decker/
repo: https://github.com/JohnEarnest/Decker
docs:
  - https://beyondloom.com/decker
  - https://beyondloom.com/tools/trylil.html
  - https://github.com/JohnEarnest/Decker#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Decker is distributed through its official website, GitHub source, Itch.io binary
      releases for macOS and Windows, and package managers such as Homebrew and Nix. Its
      community footprint includes Itch.io discussion forums and recurring Decker-themed
      game jams.
  package-nerd-significance:
    - >
      Decker is interesting to package people because it combines a GUI authoring tool,
      a browser distribution, a tiny scripting language, and a command-line interpreter
      in one source tree. It also reflects a retrocomputing-inspired software culture
      where constraints, portability, local-first documents, and inspectable file
      formats are part of the product.
  project-history:
    - >
      The public GitHub repository was created in October 2022, and the official
      homepage presents Decker as carrying forward HyperCard's simplicity and classic
      MacOS aesthetic while adding quality-of-life improvements. The README describes
      both Web-Decker, distributed as a single self-contained HTML application, and
      Native-Decker, a C application built with SDL.
  related-projects:
    - >
      Decker is explicitly related to HyperCard and to Lil/Lilt, its built-in scripting
      language and terminal interpreter. Its homepage also positions it near zine tools,
      adventure-game builders, visual notebooks, and small creative programming
      environments.
  sources:
    - https://beyondloom.com/decker
    - https://github.com/JohnEarnest/Decker/blob/main/Readme.md
    - https://api.github.com/repos/JohnEarnest/Decker
    - https://github.com/JohnEarnest/Decker/blob/main/VERSION
  summary:
    - >
      Decker is a HyperCard-inspired multimedia platform for creating and sharing
      interactive documents with sound, images, hypertext, drawing, widgets, and
      scripted behavior. The package includes the native `decker` app and `lilt`, a
      command-line Lil interpreter.
  timeline:
    - '2022: Public GitHub repository created.'
    - '2026: VERSION file reports 1.67 in the main branch.'
    - '2026: Official site advertised Decker Fantasy Camp for July 2026.'
  usage:
    - >
      Users can author decks interactively in the browser or native app, export
      standalone HTML documents, or use Lilt to inspect, manipulate, execute, and
      package decks from scripts. Decker's text-based deck format is intentionally
      friendly to source control, which makes it attractive to users who treat creative
      artifacts like editable project files.
related-packages:
  - id: cask:twine-app
    reason: >
      Choose Twine for a purpose-built nonlinear-story authoring workflow; choose Decker
      when the project also needs freeform cards, drawing, widgets, sound, database-like
      grids, or general-purpose scripting.
    rel: alternative
    sources:
      - https://beyondloom.com/decker/
      - https://twinery.org/
category: productivity
