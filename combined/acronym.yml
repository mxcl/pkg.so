id: brew:acronym
display-name: ACRONYM
homepage: https://github.com/bacook17/acronym
repo: https://github.com/bacook17/acronym
docs:
  - https://github.com/bacook17/acronym#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ACRONYM stayed a small utility rather than a platform feature. Its official README
      documents pip installation, and Homebrew also packages the command, which puts it
      in the familiar single-purpose CLI-tool lane.
  package-nerd-significance:
    - >
      For package collectors, ACRONYM is the kind of playful text-generation utility
      that fits well in Unix-style command catalogs: it has one command, a small problem
      space, and output that can be copied into project naming discussions.
  project-history:
    - >
      The GitHub repository was created in 2018, and the README presents the tool as a
      Python package with both pip installation and source installation via make. The
      README also links to an arXiv paper describing ACRONYM.
  related-projects:
    - >
      Related contexts include command-line naming tools, word-list utilities,
      project-name generators, and lightweight natural-language text-generation scripts.
  sources:
    - https://api.github.com/repos/bacook17/acronym
    - https://raw.githubusercontent.com/bacook17/acronym/master/README.md
  summary:
    - >
      ACRONYM is a Python command-line tool for generating English-ish acronyms from
      long project names or phrases.
  timeline:
    - '2018: GitHub repository created.'
    - '2019: README points to an arXiv paper describing ACRONYM.'
    - '2022: Latest repository push shown by official GitHub repository metadata.'
  usage:
    - >
      The documented use is to run acronym with a quoted phrase, after which the tool
      collects a word corpus, identifies matching acronyms, scores them, and prints
      ranked options. CLI flags control minimum and maximum acronym length, result
      count, output file, and strictness.
related-packages: []
category: productivity
package-manager:
  brew: acronym
package-manager-url: https://formulae.brew.sh/formula/acronym
license: MIT
tags:
  - acronym
  - cli
  - python
  - text-generation
  - wordplay
description: Python-based tool for creating English-ish acronyms from your fancy project
executables:
  - acronym
provenance:
  formula: acronym
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
