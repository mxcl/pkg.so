id: brew:cucumber-ruby
display-name: Cucumber-Ruby
homepage: https://cucumber.io
repo: https://github.com/cucumber/cucumber-ruby
docs:
  - https://cucumber.io/docs/cucumber
  - https://cucumber.io/docs/installation/ruby
  - https://github.com/cucumber/cucumber-ruby#readme
config-file-location:
  unix: ./config/cucumber.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official Cucumber documentation presents Cucumber as a tool for automated
      acceptance tests written in plain language so that non-programmers and programmers
      can read the same test artifacts. The installation docs keep Ruby as one
      implementation among many, but Cucumber-Ruby remains the gem-oriented
      implementation and Rails integration path.
  package-nerd-significance:
    - >
      Cucumber-Ruby is historically important in package-manager indexes because the
      command is named cucumber while distributions may package it as cucumber-ruby to
      disambiguate the Ruby implementation from Cucumber-JS, Cucumber-JVM, and other
      language ports.
  project-history:
    - >
      The cucumber-ruby repository was created in 2008. The current official README
      identifies it as the Ruby implementation of Cucumber and points to sibling
      implementations for JavaScript, Java, and other languages.
  related-projects:
    - Gherkin, Cucumber-JS, Cucumber-JVM, Cucumber-Rails, Bundler, RubyGems.
  sources:
    - https://github.com/cucumber/cucumber-ruby
    - https://api.github.com/repos/cucumber/cucumber-ruby
    - https://raw.githubusercontent.com/cucumber/cucumber-ruby/main/README.md
    - https://cucumber.io/docs/cucumber/
    - https://cucumber.io/docs/installation/ruby
  summary:
    - >
      Cucumber-Ruby is the Ruby implementation of Cucumber, the
      behavior-driven-development test runner for executable specifications written in
      plain-language Gherkin.
  timeline:
    - '2008: Public cucumber/cucumber-ruby repository created.'
    - >
      2010s: Cucumber grows into a multi-language project with official implementations
      beyond Ruby.
    - >
      2020s: Official docs continue to document Ruby gem, Bundler, and Rails
      installation paths.
  usage:
    - >
      Cucumber-Ruby is installed as the cucumber Ruby gem, run through the cucumber
      executable or bundle exec cucumber, and initialized with a features directory
      containing Gherkin feature files, step definitions, and support code.
related-packages:
  - id: brew:gauge
    reason: >
      Choose Gauge when you prefer Markdown specifications and a plugin-based polyglot
      runner; choose Cucumber-Ruby when your executable specifications use Gherkin with
      Ruby step definitions.
    rel: alternative
    sources:
      - https://docs.gauge.org/
      - https://cucumber.io/docs/installation/ruby/
      - https://cucumber.io/docs/cucumber/
category: developer-tools
package-manager:
  brew: cucumber-ruby
  debian: cucumber
  nix: cucumber
  ubuntu: cucumber
package-manager-url: https://formulae.brew.sh/formula/cucumber-ruby
license: MIT
tags:
  - bdd
  - cli
  - cucumber
  - gherkin
  - ruby
  - testing
description: Cucumber for Ruby
executables:
  - cucumber
provenance:
  formula: cucumber-ruby
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
