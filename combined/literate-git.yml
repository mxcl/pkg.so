id: brew:literate-git
display-name: literate-git
homepage: https://github.com/bennorth/literate-git
repo: https://github.com/bennorth/literate-git
docs:
  - https://github.com/bennorth/literate-git#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears small and experimental. The project is distributed as the
      `literategit` Python package and as a Homebrew formula, and its README points to a
      Tamagotchi-style web-app demo rendered from a structured Git history.
  package-nerd-significance:
    - >
      literate-git is package-nerd notable because it packages an unusual Git-history
      presentation idea rather than a mainstream VCS command. It turns commit topology
      into publishable documentation, which makes it adjacent to literate programming,
      tutorial authoring, and repository visualization.
  project-history:
    - >
      The project pairs with `git-dendrify`, another Ben North tool that converts
      between linear and hierarchical Git histories. literate-git renders that hierarchy
      as a document containing parsed commit messages and source diffs, with top-level
      commits presented as sections and sub-commits available for expansion.
    - >
      The README frames the work as an experiment in presenting software development the
      way articles or papers are structured: sections, subsections, and navigable
      explanation instead of one flat stream of commits.
  related-projects:
    - >
      Related projects include Git, git-dendrify, literate-programming systems, static
      HTML documentation tools, and repository-visualization experiments.
  sources:
    - https://github.com/bennorth/git-dendrify
    - https://github.com/bennorth/literate-git
    - https://pypi.org/project/literategit/
    - https://redfrontdoor.org/blog/?p=1287
  summary:
    - >
      literate-git is Ben North's proof-of-concept tool for rendering hierarchical Git
      histories into HTML. It treats a repository's commit graph as material for a
      literate-programming-style narrative, where merge commits can become expandable
      sections.
  timeline:
    - '2020-02-15: PyPI recorded 0.3.1 and 0.3.1rc1 releases of `literategit`.'
    - >
      2021-03-14: The README's demo branch and linked demo identify a Tamagotchi-style
      web-app render dated 2021-03-14.
    - '2024-04-08: PyPI recorded version 0.4.6.'
    - '2026-04-03: PyPI recorded versions 0.5.2 and 0.5.3.'
  usage:
    - >
      The package installs `git literate-render` and `git dump-all-trees`. A typical
      workflow creates or dendrifies a structured branch, renders commit messages and
      diffs to an `index.html` file, and optionally exports source trees for result
      links.
related-packages: []
category: developer-tools
