id: brew:frizbee
display-name: Frizbee
homepage: https://github.com/stacklok/frizbee
repo: https://github.com/stacklok/frizbee
docs:
  - https://github.com/stacklok/frizbee#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Go, Homebrew, and winget, and presents
      Frizbee as both a CLI and a library. It also points to a Frizbee GitHub Action,
      placing the project in the GitHub Actions and container-image hardening workflow
      rather than general-purpose checksum utilities.
  package-nerd-significance:
    - >
      Frizbee is package-nerd significant as a small supply-chain utility focused on a
      common packaging and CI problem: tags are convenient but mutable, while checksums
      and digests are auditable. It sits near Dependabot-style maintenance, GitHub
      Actions pinning, container digest pinning, and policy enforcement in CI.
    - >
      Its value as a packaged CLI is that it can be dropped into local workflows or CI
      jobs without a larger platform, while the library form lets other tools reuse the
      tag-to-checksum logic.
  project-history:
    - >
      Frizbee is maintained in the `stacklok/frizbee` GitHub repository and is written
      in Go. Official release metadata gathered during research showed a young 0.x
      project, with v0.0.x and v0.1.x releases from 2024 onward and v0.1.10 published in
      2026.
  related-projects:
    - >
      Related surfaces include GitHub Actions, the Frizbee GitHub Action, container
      registries, image digest pinning, and Stacklok supply-chain tooling.
    - >
      The CLI's work overlaps with CI policy, tag pinning, reproducible builds, and
      tools that rewrite workflow or manifest files to less mutable references.
  sources:
    - https://github.com/marketplace/actions/frizbee-action
    - https://github.com/stacklok/frizbee/releases
    - https://raw.githubusercontent.com/stacklok/frizbee/main/README.md
  summary:
    - >
      Frizbee is a Stacklok command-line tool and Go library for resolving mutable tags
      to checksums. Its README describes it as a tool that can take a GitHub Actions
      reference or container image tag and return a checksum or digest suitable for more
      reproducible supply-chain references.
  timeline:
    - '2024: Official releases include early v0.0.x and v0.1.x Frizbee builds.'
    - >
      2024: The README documents installation via Go, Homebrew, and winget and usage for
      GitHub Actions and container images.
    - '2026: Official releases include Frizbee v0.1.10.'
  usage:
    - >
      For GitHub Actions, users can point `frizbee actions` at workflow files or a
      single action reference to generate replacements and optionally run in dry-run or
      CI-failing modes. For container images, users can point `frizbee image` at YAML,
      Dockerfile paths, or a single image tag to get a digest-pinned reference.
    - >
      The library API exposes replacers for GitHub Actions and container images, with
      functions for parsing strings, paths, files, and filesystem abstractions.
related-packages:
  - id: brew:pinact
    reason: >
      Choose pinact when the task is specifically to pin, verify, and update GitHub
      Actions or reusable workflows with optional configuration and SARIF output;
      Frizbee additionally handles container-image tags.
    rel: alternative
    sources:
      - https://github.com/stacklok/frizbee
      - https://github.com/suzuki-shunsuke/pinact
  - id: brew:minder
    reason: >
      Use Minder when Frizbee-style pinning needs to participate in continuous,
      policy-driven repository and artifact security with alerting or remediation across
      multiple repositories.
    rel: adjacent_workflow
    sources:
      - https://github.com/marketplace/actions/frizbee-action
      - https://docs.mindersec.dev/
category: security
package-manager:
  brew: frizbee
  winget: stacklok.frizbee
  zypper: frizbee
package-manager-url: https://formulae.brew.sh/formula/frizbee
license: Apache-2.0
tags:
  - checksums
  - cli
  - container-images
  - github-actions
  - supply-chain
  - tag-pinning
description: Throw a tag at and it comes back with a checksum
executables:
  - frizbee
provenance:
  formula: frizbee
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
