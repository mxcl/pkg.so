history:
  adoption-history:
    - >
      Espresso serves Mac web developers who prefer a native graphical editor with
      integrated project navigation, live preview, CSS inspection, remote-file handling,
      and extensibility. Its continued macOS-focused development distinguishes it from
      cross-platform Electron editors and full IDEs.
  package-nerd-significance:
    - >
      The cask provides a proprietary, Mac-native web-development environment with its
      own extension and theme system. Package users maintaining customizations should
      distinguish the application itself from user-installed plug-ins and themes under
      the Espresso Application Support directory.
  project-history:
    - >
      Espresso has evolved through multiple major generations while retaining its focus
      on native macOS web development. Official release records document Espresso 5.5
      supporting macOS Big Sur in 2020 and later releases adding local AI assistance and
      built-in Language Server Protocol support in 2025.
  related-projects:
    - >
      Espresso's extension system supports language plug-ins, CodeSense definitions,
      JavaScript actions, snippets, and CSS-based themes.
  sources:
    - https://espressoapp.com/
    - https://espressoapp.com/blog/
    - https://espressoapp.com/blog/espresso-5.5/
    - https://espressoapp.com/help/
    - https://espressoapp.com/help/extensions/
  summary:
    - >
      Espresso is a native macOS editor for building and maintaining websites, combining
      source editing, projects, previews, remote-file workflows, and an extension
      system.
  timeline:
    - '2020: Espresso 5.5 added compatibility with macOS Big Sur.'
    - >
      2025: Espresso added local LatteAI assistance and built-in Language Server
      Protocol support.
  usage:
    - >
      Developers use Espresso to organize website projects, edit HTML, CSS, and
      JavaScript, preview changes, inspect CSS visually, work with remote files, and
      extend the editor through themes and plug-ins.
