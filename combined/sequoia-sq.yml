id: brew:sequoia-sq
display-name: sequoia-sq
homepage: https://sequoia-pgp.org
repo: https://gitlab.com/sequoia-pgp/sequoia-sq
docs:
  - https://gitlab.com/sequoia-pgp/sequoia-sq/-/blob/main/README.md
  - https://sequoia-pgp.org
config-file-location:
  unix:
    - ~/.config/sequoia/sq/config.toml
    - /etc/crypto-policies/back-ends/sequoia.config
credentials-file-location:
  unix: ~/.local/share/sequoia/keystore/softkeys/
history:
  adoption-history:
    - >
      Sequoia's official documentation states that sq is packaged for most Linux
      distributions. The input also records packages for Homebrew, Alpine, Debian,
      Fedora, MacPorts, Nix, Arch, Scoop, Ubuntu, and openSUSE, reflecting unusually
      broad cross-platform packaging for a newer OpenPGP client.
  package-nerd-significance:
    - >
      sq offers a modern, subcommand-oriented OpenPGP interface with safe defaults,
      extensive help, certificate and secret-key stores, and interoperability with
      existing GnuPG installations. Package enthusiasts care about it both as a
      practical cryptographic CLI and as the principal user-facing application in the
      Rust-based Sequoia ecosystem.
  project-history:
    - >
      Sequoia PGP began as a modular implementation of OpenPGP, separating a low-level
      OpenPGP library from higher-level interfaces. sq became its primary
      general-purpose command-line frontend.
    - >
      The standalone sequoia-sq GitLab project was created in February 2023 and packages
      both the sq command-line tool and a high-level sequoia library.
  related-projects:
    - >
      Related official Sequoia tools include sqv for detached-signature verification and
      Sequoia Chameleon, which supplies gpg-sq and gpgv-sq compatibility frontends. sq
      can also discover certificates in GnuPG keyrings and use secret keys managed by
      gpg-agent.
  sources:
    - 'Official Sequoia repository: https://gitlab.com/sequoia-pgp/sequoia/'
    - 'Official configuration guide: https://book.sequoia-pgp.org/configuration.html'
    - >
      Official projects catalog:
      https://gitlab.com/sequoia-pgp/sequoia-web/-/blob/main/content/projects.md
    - 'Official sq repository: https://gitlab.com/sequoia-pgp/sequoia-sq'
  summary:
    - >
      sq is Sequoia PGP's primary command-line interface for encryption, decryption,
      signatures, OpenPGP key and certificate management, and network-based certificate
      discovery.
  timeline:
    - '2017: The broader Sequoia PGP repository was established.'
    - "2020: Sequoia's core OpenPGP library reached its 1.0 release."
    - '2023: The standalone sequoia-sq GitLab project was created.'
  usage:
    - >
      sq uses a git-style subcommand interface for encrypting and decrypting data,
      creating and verifying signatures, managing keys and certificates, and interacting
      with key servers and Web Key Directory services. Its config subcommand can inspect
      active paths and settings or generate a configuration template.
category: security
package-manager:
  apk: sequoia-sq
  brew: sequoia-sq
  debian: sq
  dnf: sequoia-sq
  macports: sequoia-sq
  nix: sequoia-sq
  pacman: sequoia-sq
  scoop: main/sq
  ubuntu: sq
  zypper: sequoia-sq
package-manager-url: https://formulae.brew.sh/formula/sequoia-sq
license: LGPL-2.0-or-later
tags:
  - cli
  - cryptography
  - openpgp
  - pgp
  - security
description: Sequoia-PGP command-line tool
executables:
  - sq
provenance:
  formula: sequoia-sq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
