history:
  adoption-history:
    - >
      The developer distributes BetterAndBetter directly for Intel and Apple-silicon
      Macs and maintains tutorials, FAQs, mouse-compatibility guidance, and a library of
      example rules and scripts.
  package-nerd-significance:
    - >
      It occupies the macOS power-user niche between gesture customization, input
      remapping, window control, and lightweight automation. Its support for presets,
      shortcuts, and AppleScript makes it useful as a graphical automation layer.
  project-history:
    - >
      BetterAndBetter 2.0 developed into a broad macOS input-customization utility
      covering trackpads, Magic Mouse, conventional multi-button mice, and keyboards.
      Later releases added selectable beginner, normal, and expert rule sets; the
      official documentation identifies those modes as available from version 2.3.5.
  related-projects:
    - >
      Better365 also develops adjacent macOS utilities such as iShot, Better Menubar,
      iRightMouse, and iBar.
  sources:
    - https://www.better365.cn/bab2.html
    - https://www.better365.cn/babpro.html
    - https://www.better365.cn/h-col-106.html
  summary:
    - >
      BetterAndBetter is a proprietary macOS gesture and input-automation utility from
      Better365. It maps trackpad, mouse, and keyboard gestures to built-in actions,
      shortcuts, and user-authored scripts.
  timeline:
    - '2021: Better365 published BetterAndBetter 2.0 mouse-adaptation guidance.'
    - '2023: Version 2.3.5 and later offered beginner, normal, and expert rule modes.'
    - >
      2026: The official download listed the 2.7 series with native Intel and
      Apple-silicon support.
  usage:
    - >
      Users define global or application-specific rules that connect action gestures or
      drawn gestures to presets, scripts, and keyboard shortcuts. The app can also
      smooth mouse-wheel scrolling, extend multi-button and Magic Mouse behavior,
      control windows, and synchronize rules through iCloud.
