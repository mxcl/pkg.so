id: brew:espflash
display-name: espflash
homepage: https://github.com/esp-rs/espflash
repo: https://github.com/esp-rs/espflash
docs:
  - https://github.com/esp-rs/espflash#readme
  - https://github.com/esp-rs/espflash/tree/main/espflash#readme
config-file-location:
  linux:
    - ~/.config/espflash/espflash.toml
    - ~/.config/espflash/espflash_ports.toml
  macos:
    - ~/Library/Application Support/rs.esp.espflash/espflash.toml
    - ~/Library/Application Support/rs.esp.espflash/espflash_ports.toml
  unix:
    - ./espflash.toml
    - ./espflash_ports.toml
  windows:
    - '%APPDATA%\esp\espflash\espflash.toml'
    - '%APPDATA%\esp\espflash\espflash_ports.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption is tied to the Rust embedded Espressif community rather than to
      Espressif's official Python tooling. Homebrew, Nix, Pacman, crates.io, and the
      repository README make it discoverable as a package-manager and Cargo-installable
      flashing tool.
  package-nerd-significance:
    - >
      For package nerds, espflash is interesting because it packages a Rust-native
      alternative around a workflow historically dominated by Python esptool.py, and
      because `cargo-espflash` makes flashing feel like part of the Rust build loop.
  project-history:
    - >
      The project sits in the esp-rs organization and provides both `espflash` and a
      related `cargo-espflash` workflow for Rust-on-Espressif development.
  related-projects:
    - >
      The project explicitly relates itself to esptool.py and ships alongside
      cargo-espflash for Cargo-integrated flashing.
  sources:
    - https://github.com/esp-rs/espflash
    - https://github.com/esp-rs/espflash/tree/main/espflash
  summary:
    - >
      espflash is a Rust ecosystem serial flasher for Espressif devices, described by
      its project as loosely based on esptool.py.
  timeline:
    - '2020s: espflash grows with esp-rs as a Rust-oriented Espressif flashing utility.'
  usage:
    - >
      The command-line tool flashes ELF-format applications, monitors serial output,
      prints board information, erases flash or regions, calculates checksums, and
      generates shell completions for Espressif chips.
related-packages:
  - id: brew:esptool
    reason: >
      Choose Espressif's esptool when you need the vendor-maintained Python utility, its
      scripting API, the broadest feature set, or the earliest support for new Espressif
      chips; choose espflash for a Rust-native workflow.
    rel: alternative
    sources:
      - https://docs.espressif.com/projects/esptool/en/latest/esp32/
      - https://github.com/esp-rs/espflash#readme
category: developer-tools
package-manager:
  brew: espflash
  nix: espflash
  pacman: espflash
package-manager-url: https://formulae.brew.sh/formula/espflash
license: MIT OR Apache-2.0
tags:
  - cli
  - embedded
  - esp32
  - espressif
  - rust
  - serial-flashing
description: Serial flasher utility for Espressif SoCs and modules based on esptool.py
executables:
  - espflash
provenance:
  formula: espflash
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
