  apk: cfitsio
  brew: cfitsio
  debian: fitsverify
  dnf: cfitsio
  macports: cfitsio
  nix: cfitsio
  pacman: cfitsio
  ubuntu: libcfitsio-bin
  winget: kooyoseb.VideoSpeedConversionTool
  zypper: cfitsio
package-manager-url: https://formulae.brew.sh/formula/cfitsio
license: CFITSIO
