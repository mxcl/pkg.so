id: brew:cfitsio
display-name: CFITSIO
homepage: https://heasarc.gsfc.nasa.gov/docs/software/fitsio/fitsio.html
repo: https://github.com/HEASARC/cfitsio
docs:
  - https://heasarc.gsfc.nasa.gov/docs/software/fitsio
  - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/c/c_user/cfitsio.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts show CFITSIO packaged across Homebrew, Alpine,
      Debian/Ubuntu, Fedora, MacPorts, Nix, Arch, and openSUSE ecosystems. That breadth
      matches its role as a shared astronomy data I/O dependency rather than a single
      application.
  package-nerd-significance:
    - >
      CFITSIO is the kind of package that quietly props up a scientific stack: a C ABI,
      headers, shared libraries, Fortran wrappers, and utility binaries that downstream
      astronomy tools expect to find in system package managers.
  project-history:
    - >
      The CFITSIO User's Reference Guide says the package was initially developed by
      HEASARC to convert various high-energy astrophysics data sets into FITS format and
      to analyze data already in FITS format. The guide also documents that the Fortran
      wrappers replaced an older Fortran FITSIO interface.
  related-projects:
    - >
      FTOOLS is called out by the User's Guide as a related package for manipulating and
      analyzing FITS files.
    - CCFITS is the C++ interface associated with CFITSIO support contacts.
  sources:
    - https://api.github.com/repos/HEASARC/cfitsio
    - https://github.com/HEASARC/cfitsio
    - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/fitsio.html
    - https://heasarc.gsfc.nasa.gov/docs/software/fitsio
    - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/c/c_user/cfitsio.html
    - https://formulae.brew.sh/api/formula/cfitsio.json
  summary:
    - >
      CFITSIO is NASA HEASARC's machine-independent C library for reading and writing
      FITS astronomy data files, with Fortran-callable wrappers and command-line
      utilities such as `fitscopy`, `fitsverify`, `fpack`, and `funpack`.
  timeline:
    - >
      Initial development: HEASARC developed CFITSIO for high-energy astrophysics FITS
      conversion and analysis.
    - "CFITSIO 2.0: User's Guide notes plug-in I/O drivers introduced in v2.0."
    - '2023: Official GitHub repository metadata records public repository creation.'
    - '2026: Official release metadata shows CFITSIO 4.6.4.'
  usage:
    - >
      The README documents the standard Unix build flow with `./configure`, `make`,
      `make check`, and `make install`, plus CMake support. The User's Guide documents
      every user-callable routine, while bundled utilities cover copying, verifying,
      compressing, and unpacking FITS files.
related-packages:
  - id: brew:ccfits
    reason: >
      Use CCfits alongside CFITSIO when C++ code benefits from an object-oriented FITS
      API; the official documentation states that CCfits requires and wraps CFITSIO.
    rel: adjacent_workflow
    sources:
      - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/ccfits/
      - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/CCfits-2.6/html/implementation.html
category: science
