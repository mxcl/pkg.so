id: brew:adrs
display-name: adrs
homepage: https://joshrotenberg.com/adrs/
repo: https://github.com/joshrotenberg/adrs
docs:
  - https://github.com/joshrotenberg/adrs#readme
  - https://joshrotenberg.com/adrs
config-file-location:
  unix:
    - ./adrs.toml
    - ./.adr-dir
    - ~/.config/adrs/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, Cargo, Docker, and binary
      releases, placing adrs in the Rust CLI and package-manager ecosystem rather than
      only as a source checkout.
  package-nerd-significance:
    - >
      Package users care because it bridges a long-running shell-script ADR tool culture
      with a packaged Rust binary, while keeping common ADR repository layouts and
      adding docs generation and MCP integration.
  project-history:
    - >
      The GitHub repository was created in March 2021. The project's own ADRs record a
      March 2024 decision to rewrite adr-tools in Rust while keeping feature equivalence
      and compatibility goals.
  related-projects:
    - adr-tools, MADR, JSON-ADR, adrs-core
  sources:
    - https://api.github.com/repos/joshrotenberg/adrs
    - https://github.com/joshrotenberg/adrs#readme
    - https://github.com/joshrotenberg/adrs/blob/main/book/src/configuration.md
    - https://github.com/joshrotenberg/adrs/blob/main/doc/adr/0002-rewrite-it-in-rust.md
  summary:
    - >
      adrs is a Rust command-line tool for creating and managing Architecture Decision
      Records, with compatibility for existing adr-tools repositories and newer ADR
      workflows.
  timeline:
    - '2021: GitHub repository created.'
    - '2024: Project ADR accepts rewriting adr-tools in Rust.'
    - '2024: v0.2.1 appears in GitHub releases.'
    - '2026: v0.8.0 appears in GitHub releases.'
  usage:
    - >
      Users initialize an ADR repository, create decisions, list and search records,
      update status, link ADRs, generate documentation, and export or import JSON-ADR
      data.
related-packages:
  - id: brew:adr-tools
    reason: >
      Choose ADR Tools for the original lightweight shell workflow; choose adrs for a
      cross-platform Rust binary with compatibility plus search, validation, formats,
      import/export, and MCP features.
    rel: alternative
    sources:
      - https://joshrotenberg.com/adrs/
      - https://github.com/npryce/adr-tools#readme
  - id: brew:graphviz
    reason: >
      adrs generate graph emits a Graphviz diagram, which Graphviz can render into an
      image or document artifact.
    rel: adjacent_workflow
    sources:
      - https://joshrotenberg.com/adrs/commands/cheatsheet.html
      - https://graphviz.org/documentation/
  - id: brew:mdbook
    reason: >
      adrs generate book creates mdBook input, after which mdBook can build or serve the
      generated ADR documentation.
    rel: adjacent_workflow
    sources:
      - https://github.com/joshrotenberg/adrs#readme
      - https://rust-lang.github.io/mdBook/
category: developer-tools
package-manager:
  brew: adrs
  nix: adrs
package-manager-url: https://formulae.brew.sh/formula/adrs
license: MIT OR Apache-2.0
tags:
  - adr
  - cli
  - documentation
  - mcp
  - rust
description: Architectural Decision Record tool in Rust
executables:
  - adrs
provenance:
  formula: adrs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
