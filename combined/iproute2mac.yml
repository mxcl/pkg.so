id: brew:iproute2mac
display-name: iproute2mac
homepage: https://github.com/brona/iproute2mac
repo: https://github.com/brona/iproute2mac
docs:
  - https://github.com/brona/iproute2mac#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      iproute2mac found its audience in the macOS admin and developer niche where muscle
      memory from Linux is valuable but macOS networking remains built on ifconfig,
      netstat, route, ndp, arp, and networksetup. The README explicitly sends advanced
      users back to those native tools for deeper work.
    - >
      Distribution through Homebrew is part of the project's identity: the README lists
      Homebrew as the preferred installation path and notes the formula is maintained by
      the project author. It also documents MacPorts and NixOS packaging.
  package-nerd-significance:
    - >
      iproute2mac is interesting because it packages muscle memory. It is a small Python
      wrapper that turns a platform mismatch into a command-line convenience, while
      keeping the boundary visible enough that serious macOS networking work still goes
      through native tools.
  project-history:
    - >
      The project README describes a deliberately limited wrapper for basic macOS
      network utilities, not a complete reimplementation of Linux iproute2. Its goal is
      to make routine macOS network configuration and debugging easier for
      administrators already fluent in Linux-style ip commands.
    - >
      The changelog shows an incremental compatibility project: early 1.0.x releases
      fixed ip address and neighbor handling; v1.1.0 added ip route get source-address
      output and marked acceptance into Homebrew master; v1.3.0 migrated to Python 3;
      v1.5.0 added JSON output and bridge; and v1.7.0 added ss plus brief/oneline output
      options.
  related-projects:
    - Linux iproute2 is the direct inspiration and compatibility target.
    - >
      macOS ifconfig, netstat, ndp, arp, route, and networksetup are the native tools
      beneath or beside the wrapper.
    - MacPorts and NixOS provide alternate package-manager routes alongside Homebrew.
  sources:
    - >
      Homebrew formula metadata supplies package-manager presence, formula description,
      macOS requirement, and adoption signals.
    - >
      The GitHub README supplies project goal, limitations, command coverage,
      installation paths, changelog, and related native macOS tools.
  summary:
    - >
      iproute2mac is a macOS command-line compatibility wrapper that provides ip,
      bridge, and ss commands inspired by Linux iproute2 for administrators who move
      between Linux and macOS.
  timeline:
    - 'v1.0.x: Early releases fix ip addr, ip neigh, help, and versioning behavior.'
    - 'v1.1.0: Project is accepted into Homebrew master and no longer requires a tap.'
    - 'v1.3.0: Codebase migrates to Python 3.'
    - 'v1.5.0: JSON output and bridge command support are added.'
    - 'v1.7.0: ss command and brief/oneline output options are added.'
  usage:
    - >
      The command set covers common inspection and light configuration tasks: ip link,
      ip addr, ip route, ip neigh, bridge link, and ss, with selected support for JSON,
      color, brief, and oneline output. Its value is ergonomic consistency, not total
      kernel feature parity.
    - >
      Because macOS lacks Linux netlink and tc semantics, iproute2mac translates
      familiar syntax onto native macOS tools and data sources. The README warns that
      functionality and output compatibility are limited, which is the right contract
      for a portability shim.
related-packages:
  - id: brew:iproute2
    reason: >
      Choose iproute2 on Linux for the native and substantially broader networking
      suite; choose iproute2mac on macOS when familiar basic ip-style syntax is more
      important than complete compatibility.
    rel: alternative
    sources:
      - https://github.com/brona/iproute2mac#readme
      - https://wiki.linuxfoundation.org/networking/iproute2
category: networking
package-manager:
  apk: bridge
  brew: iproute2mac
  macports: iproute2mac
  nix: iproute2mac
  winget: Geomitron.Bridge
package-manager-url: https://formulae.brew.sh/formula/iproute2mac
license: MIT
tags:
  - cli
  - ip-command
  - linux-compatibility
  - macos
  - networking
  - routing
description: CLI wrapper for basic network utilities on macOS - ip command
executables:
  - bridge
  - ip
  - ss
provenance:
  formula: iproute2mac
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
