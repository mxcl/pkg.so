id: brew:babelfish
display-name: babelfish
homepage: https://github.com/bouk/babelfish
repo: https://github.com/bouk/babelfish
docs:
  - https://github.com/bouk/babelfish#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      babelfish's adoption is niche and shell-specific. The README documents Homebrew
      and Go installation, and the package metadata in this batch shows Homebrew and Nix
      packaging for this Go-based translator.
    - >
      Its practical audience is fish users who need to consume bash-oriented environment
      setup scripts, version-manager hooks, or shell snippets without leaving fish or
      spawning bash repeatedly.
  package-nerd-significance:
    - >
      babelfish is package-nerd interesting in the small-tool sense: it exists to smooth
      over the mismatch between package ecosystems that ship bash activation scripts and
      users who prefer fish.
    - >
      It also shows a common CLI pattern in modern packaging: take a mature parser
      library, here mvdan.cc/sh, and wrap it in a focused translator that solves one
      irritating shell integration problem.
  project-history:
    - >
      The project was created by Bouke Haarsma to avoid relying on fish-foreign-env or
      bass for repeated bash process execution. Instead, babelfish parses shell code
      with mvdan.cc/sh and emits equivalent fish code where possible.
    - >
      The public GitHub releases show a 1.0.0 release in January 2021, a 1.1.0 release
      shortly after, and a 1.2.0 release in June 2023. The README still describes
      limitations, including untranslated variables such as BASH_SOURCE and incomplete
      arithmetic-expression support.
  related-projects:
    - fish is the target shell for generated output.
    - bash is the source shell language babelfish translates from.
    - >
      fish-foreign-env and bass are named by the README as earlier approaches babelfish
      was intended to avoid for performance reasons.
    - mvdan.cc/sh provides the shell parser used by babelfish.
  sources:
    - https://api.github.com/repos/bouk/babelfish/releases
    - https://github.com/bouk/babelfish
    - input.json source_facts.package-manager
  summary:
    - >
      babelfish is a small command-line translator that converts bash shell snippets or
      scripts into fish shell code. Its README frames it as a faster alternative to
      running bash-backed compatibility layers every time fish needs to source shell
      setup code.
  timeline:
    - '2021: babelfish 1.0.0 is released on GitHub.'
    - '2021: babelfish 1.1.0 follows with continued maintenance.'
    - '2023: babelfish 1.2.0 is released on GitHub.'
    - '2026: Package metadata in this batch shows babelfish still present in Homebrew and Nix.'
  usage:
    - >
      Users pipe bash code into babelfish and can then inspect or source the generated
      fish code. The README demonstrates translating a function, exporting
      SSH_AUTH_SOCK, setting local variables, and using a shell hook to source
      bash-oriented setup scripts in fish.
    - >
      Because its translation coverage is incomplete, babelfish is best treated as a
      pragmatic bridge for common shell setup patterns rather than a perfect bash
      interpreter.
related-packages:
  - id: brew:fish
    reason: >
      fish is the shell that executes babelfish's translated output, so install it when
      using babelfish to consume bash-oriented setup scripts in a fish session.
    rel: adjacent_workflow
    sources:
      - https://github.com/bouk/babelfish
      - https://fishshell.com/docs/current/
category: developer-tools
package-manager:
  brew: babelfish
  debian: python3-babelfish
  nix: babelfish
  ubuntu: python3-babelfish
package-manager-url: https://formulae.brew.sh/formula/babelfish
license: MIT
tags:
  - bash
  - cli
  - fish
  - shell
  - translator
description: Translate bash scripts to fish
executables:
  - babelfish
provenance:
  formula: babelfish
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
