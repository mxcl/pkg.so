id: brew:cryptominisat
display-name: CryptoMiniSat
homepage: https://www.msoos.org/cryptominisat5/
repo: https://github.com/msoos/cryptominisat
docs:
  - https://github.com/msoos/cryptominisat#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CryptoMiniSat is distributed as release binaries, source builds, Nix shells,
      Python packages through pycryptosat, and distro packages. The supplied package
      metadata lists Homebrew, Debian, Fedora, Nix, Arch, and Ubuntu, which fits a
      solver used both interactively from the shell and embedded through library
      bindings.
  package-nerd-significance:
    - >
      For packagers, CryptoMiniSat is a good example of research software that became
      routine infrastructure: it exposes a stable executable, a C++ API, Python wheels,
      and static-build options while depending on performance-sensitive native libraries
      such as GMP and zlib. Packaging quality directly affects whether downstream
      scientific tools can treat the solver as a dependable backend.
  project-history:
    - >
      The official homepage identifies CryptoMiniSat 5 as a modern, multi-threaded,
      feature-rich simplifying SAT solver and asks users to cite the project's SAT 2009
      conference paper. The official GitHub repository was created in 2012 and continues
      to publish 5.x releases.
  related-projects:
    - >
      CryptoMiniSat is part of the broader SAT-solver ecosystem and its README and
      homepage reference DIMACS CNF, SAT competition formats, pycryptosat,
      CaDiCaL-related dependencies, and MiniSat-adjacent techniques.
  sources:
    - https://www.msoos.org/cryptominisat5/
    - https://github.com/msoos/cryptominisat
    - https://api.github.com/repos/msoos/cryptominisat
    - https://api.github.com/repos/msoos/cryptominisat/releases
  summary:
    - >
      CryptoMiniSat is an advanced SAT solver with command-line, C++ library, Python, C,
      and Rust-compatible interfaces. It is packaged for scientific and developer-tool
      ecosystems because SAT solvers are infrastructure for verification, optimization,
      cryptanalysis, model counting, and research workflows.
  timeline:
    - '2009: The project asks users to cite its SAT 2009 conference paper.'
    - '2012: The official GitHub repository was created.'
    - '2026: The official GitHub releases page shows active 5.14.x releases.'
  usage:
    - >
      The command-line interface accepts DIMACS CNF input with XOR-clause extensions and
      is invoked as cryptominisat5. The README also documents incremental Python and C++
      usage, including assumptions and repeated solve calls, which are important for
      users embedding the solver in larger verification or search programs.
related-packages:
  - id: brew:cadical
    reason: >
      Choose CaDiCaL for a clean, well-documented general CDCL solver and embeddable C++
      library; choose CryptoMiniSat when native XOR reasoning or its Python interface is
      important.
    rel: alternative
    sources:
      - https://github.com/msoos/cryptominisat#readme
      - https://github.com/arminbiere/cadical#readme
  - id: brew:kissat
    reason: >
      Choose Kissat for a compact, highly optimized non-incremental C solver, while
      CryptoMiniSat is the better fit for incremental solving and XOR-heavy inputs.
    rel: alternative
    sources:
      - https://github.com/msoos/cryptominisat#readme
      - https://github.com/arminbiere/kissat#readme
