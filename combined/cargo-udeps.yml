id: brew:cargo-udeps
display-name: cargo-udeps
homepage: https://github.com/est31/cargo-udeps
repo: https://github.com/est31/cargo-udeps
docs:
  - https://docs.rs/crate/cargo-udeps/latest
  - https://github.com/est31/cargo-udeps#readme
config-file-location:
  unix: Cargo.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub records the repository as created in August 2019, and crates.io records the
      first release shortly after. The README lists Nix/NixOS, Arch Linux, and Homebrew
      packages; the input package facts also list Alpine.
  package-nerd-significance:
    - >
      cargo-udeps is useful to maintainers because unused dependencies affect build
      time, dependency graphs, packaging policy, and audit surface; its README trophy
      case records real projects where unused dependencies were removed.
  project-history:
    - >
      The official README says cargo-udeps finds unused dependencies in Cargo.toml and
      needs Rust nightly to run, while compiling on stable.
  related-projects:
    - >
      The README links deps.rs status and lists downstream projects where cargo-udeps
      found unused dependencies.
  sources:
    - https://api.github.com/repos/est31/cargo-udeps
    - https://github.com/est31/cargo-udeps
    - https://docs.rs/crate/cargo-udeps/latest
    - https://github.com/est31/cargo-udeps#readme
    - https://crates.io/api/v1/crates/cargo-udeps
    - https://formulae.brew.sh/api/formula/cargo-udeps.json
  summary:
    - >
      cargo-udeps is a Cargo subcommand for finding unused dependencies declared in
      Cargo.toml.
  timeline:
    - '2019: GitHub repository created and first crates.io release recorded.'
    - '2026: crates.io records max_version 0.1.61.'
  usage:
    - >
      The README documents `cargo +nightly udeps`, package and workspace Cargo.toml
      metadata for ignore lists, and pre-commit hook usage.
related-packages: []
category: developer-tools
package-manager:
  apk: cargo-udeps
  brew: cargo-udeps
  nix: cargo-udeps
  pacman: cargo-udeps
package-manager-url: https://formulae.brew.sh/formula/cargo-udeps
license: Apache-2.0 OR MIT
tags:
  - cargo
  - cargo-plugin
  - cli
  - dependency-analysis
  - rust
  - unused-dependencies
description: Find unused dependencies in Cargo.toml
executables:
  - cargo-udeps
provenance:
  formula: cargo-udeps
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
