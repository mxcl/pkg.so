id: brew:dezoomify-rs
display-name: dezoomify-rs
homepage: https://dezoomify-rs.ophir.dev
repo: https://github.com/lovasoa/dezoomify-rs
docs:
  - https://dezoomify-rs.ophir.dev/
  - https://github.com/lovasoa/dezoomify-rs#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project serves digital-library, museum, archival, and image-inspection
      workflows where high-resolution material is exposed through a tiled viewer. Its
      README documents direct binary releases and explicitly lists Homebrew installation
      for macOS and Linux.
  package-nerd-significance:
    - >
      For package maintainers, dezoomify-rs is a good example of a Rust CLI whose value
      comes from protocol coverage and binary distribution: it turns web-only tiled
      imagery into local files while avoiding browser memory limits.
  project-history:
    - >
      The official tag history shows public releases beginning in 2019. The README
      positions the project as a native alternative to browser-based dezoomify workflows
      for images too large or too restricted for convenient in-browser downloading.
  related-projects:
    - >
      dezoomify-rs is related to the original web-based dezoomify tool,
      dezoomify-extension, IIIF image APIs, Deep Zoom Image, Zoomify, krpano, and
      image-rs encoders.
  sources:
    - https://dezoomify-rs.ophir.dev/
    - https://github.com/lovasoa/dezoomify-rs#readme
    - https://github.com/lovasoa/dezoomify-rs/wiki
    - https://github.com/lovasoa/dezoomify-rs/tags
  summary:
    - >
      dezoomify-rs is a Rust desktop and command-line downloader for tiled, zoomable
      images. It downloads tiles and stitches them into output images, with support for
      formats such as Zoomify, Deep Zoom, IIIF, krpano, IIPImage, NYPL, generic URL
      patterns, and custom YAML dezoomers.
  timeline:
    - '2019: v0.3.x and v0.4.0 appear in the official tag history.'
    - '2024: the 2.12 and 2.13 releases continue the 2.x series.'
    - '2025: v2.14.0 and v2.15.0 are tagged.'
    - '2026: v2.16.0 is tagged.'
  usage:
    - >
      Users give dezoomify-rs a viewer URL, tile metadata URL, IIIF manifest, or URL
      pattern and choose an output file. Advanced use includes custom HTTP headers,
      retries, tile caching, bulk processing, and IIIF manifest handling.
related-packages: []
category: media
