id: brew:git-pkgs-brief
display-name: brief
homepage: https://github.com/git-pkgs/brief
repo: https://github.com/git-pkgs/brief
docs:
  - https://github.com/git-pkgs/brief#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as a Homebrew formula, a Go-installable command, and
      downloadable release binaries. Its README specifically positions it for AI coding
      agents, new contributors, and CI pipelines.
  package-nerd-significance:
    - >
      brief packages toolchain discovery into a portable binary, replacing
      ecosystem-specific inspection with one deterministic report. Package enthusiasts
      may value its broad knowledge base and its ability to inspect local directories,
      remote Git repositories, and registry package identifiers.
  project-history:
    - >
      brief was developed by the git-pkgs organization as a Go command for detecting a
      project's languages, package managers, tests, linters, formatters, build systems,
      continuous-integration setup, and conventions. It later expanded into
      change-focused reports, missing-tool checks, threat-model and dangerous-function
      reports, metadata enrichment, and LLM-oriented source outlines.
  related-projects:
    - git-pkgs provides related dependency-history analysis.
    - The outline feature uses the git-pkgs/outline project.
    - ecosyste.ms, endoflife.date, and OpenSSF Scorecard supply optional enrichment data.
  sources:
    - https://github.com/git-pkgs/brief#readme
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      brief is a single-binary Go CLI that deterministically detects a software
      project's toolchain, configuration, conventions, and supporting resources.
  timeline:
    - >
      2026: Official documentation describes detection across 54 language ecosystems and
      hundreds of tool definitions.
  usage:
    - >
      Users run `brief .` against a local project, pass another path or Git URL, or use
      identifiers such as `npm:express`. Output is human-readable on a terminal and JSON
      when piped.
    - >
      Additional commands report toolchain changes between Git refs, recommend missing
      tooling, identify stack-relevant threat categories and dangerous functions, enrich
      project metadata, and create compact source outlines for language models.
related-packages:
  - id: brew:git-pkgs
    reason: >
      Pair brief's present-day toolchain inventory with git-pkgs when you need to
      investigate how a repository's dependencies changed across Git history.
    rel: adjacent_workflow
    sources:
      - https://github.com/git-pkgs/brief#readme
      - https://git-pkgs.dev/
category: developer-tools
package-manager:
  brew: git-pkgs-brief
package-manager-url: https://formulae.brew.sh/formula/git-pkgs-brief
license: MIT
tags:
  - cli
  - codebase-inspection
  - developer-tooling
  - project-analysis
  - toolchain-detection
description: Tool that detects and reports a project's toolchain, configuration, and more
executables:
  - brief
provenance:
  formula: git-pkgs-brief
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
