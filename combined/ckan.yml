id: brew:ckan
display-name: CKAN
homepage: https://github.com/KSP-CKAN/CKAN/
repo: https://github.com/KSP-CKAN/CKAN
docs:
  - https://github.com/KSP-CKAN/CKAN/wiki
  - https://github.com/KSP-CKAN/CKAN/wiki/User-guide
  - https://github.com/KSP-CKAN/CKAN#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The batch input records CKAN in Homebrew and Nix. Upstream also publishes GitHub
      releases and a NuGet package badge, while the README points players to the wiki
      user guide and modders to metadata contribution workflows.
  package-nerd-significance:
    - >
      CKAN is package-nerd significant because it transposes classic package-manager
      ideas into a game-mod ecosystem: detached JSON metadata, dependency constraints,
      conflict metadata, validation, indexes, and an authoritative metadata repository.
  project-history:
    - >
      The official README defines CKAN as metadata and tools for finding, installing,
      and managing Kerbal Space Program mods, with dependency and conflict handling. The
      official specification presents it as an RFC for a standardized archive network
      for KSP mods.
    - >
      The GitHub repository was created in 2014, and the release API shows public
      releases from the same year. The README says the project remains under active
      development.
  related-projects:
    - >
      The CKAN specification cites CPAN metadata, Debian Policy, and
      KSP-RealSolarSystem-Bundler as design influences.
    - >
      The README distinguishes KSP-CKAN from the unrelated open-data portal software
      also named CKAN.
  sources:
    - https://github.com/KSP-CKAN/CKAN/blob/master/README.md
    - https://github.com/KSP-CKAN/CKAN/blob/master/Spec.md
    - https://api.github.com/repos/KSP-CKAN/CKAN
    - https://api.github.com/repos/KSP-CKAN/CKAN/releases
  summary:
    - >
      CKAN is the Comprehensive Kerbal Archive Network, a metadata repository and mod
      manager for Kerbal Space Program. In packaging culture it is a game-specific
      package manager inspired by Debian and CPAN ideas.
  timeline:
    - '2014: Official GitHub repository created.'
    - '2014: Early GitHub release v1.3.3 published.'
    - '2014: CKAN specification describes Debian and CPAN as design inspirations.'
    - '2026: Official repository metadata shows continuing activity.'
  usage:
    - >
      Players use CKAN to find, install, update, and manage KSP mods with compatibility,
      dependency, and conflict checks. Mod authors and metadata contributors use the
      CKAN metadata specification and schema to describe mod releases.
related-packages: []
category: games
