id: brew:esbonio
display-name: Esbonio
homepage: https://github.com/swyddfa/esbonio
repo: https://github.com/swyddfa/esbonio
docs:
  - https://docs.esbon.io/
  - https://docs.esbon.io/en/release/usage/getting-started.html
  - https://docs.esbon.io/en/release/usage/reference/configuration.html
config-file-location:
  unix: pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Esbonio is packaged as a Homebrew formula and as editor-facing tooling, especially
      through its VS Code extension and documented integrations for editors such as
      Emacs and Neovim.
    - >
      Its adoption follows Sphinx users who want language-server behavior while editing
      reStructuredText or MyST documentation, rather than treating documentation as
      plain text plus an external build step.
  package-nerd-significance:
    - >
      Esbonio is notable to package-manager users because it turns a documentation build
      system into editor infrastructure: a Homebrew-installed CLI/server can support
      Sphinx projects across editor clients.
    - >
      It sits at the intersection of Python packaging, Sphinx documentation workflows,
      Language Server Protocol clients, and editor extensions.
  project-history:
    - >
      The project is hosted in the official swyddfa/esbonio repository and is organized
      around a Python language server, a VS Code extension, and Sphinx extensions. Its
      documentation describes Esbonio as tooling that reduces friction when writing
      Sphinx content.
    - >
      The 1.0 release in October 2025 changed the server architecture by moving Sphinx
      builds into background processes, adding support for multi-root and multiple
      Sphinx projects in a workspace, and expanding configuration sources beyond
      initialization options.
    - >
      The 2.x releases in 2026 continued the migration with Sphinx 9 support, command
      changes, logging changes, and a dedicated `esbonio sphinx build` command.
  related-projects:
    - Sphinx is the documentation system Esbonio targets.
    - The Language Server Protocol defines the editor integration model.
    - The official repository also includes a VS Code extension and Sphinx extension packages.
  sources:
    - https://docs.esbon.io/
    - https://docs.esbon.io/en/release/about/changelog.html
    - https://docs.esbon.io/en/release/usage/reference/configuration.html
    - https://github.com/swyddfa/esbonio
    - https://github.com/swyddfa/esbonio/discussions/1041
  summary:
    - >
      Esbonio is a language server for Sphinx documentation projects. It provides editor
      features such as references, completions, diagnostics, previews, and extension
      points for documentation tooling.
  timeline:
    - >
      2025-10-28: Esbonio Language Server v1.0.0 released with background Sphinx process
      architecture and expanded configuration.
    - >
      2026-02-19: v1.1.0 introduced `esbonio.sphinx.buildArguments` and documented
      project discovery.
    - >
      2026-04-11: v2.0.0 dropped Sphinx 6 support, changed command behavior, and added
      Sphinx 9 support.
    - '2026-06-28: v2.1.0 added `esbonio sphinx build`.'
  usage:
    - >
      Typical use is to install or launch the Esbonio language server from an editor
      integration and let it run Sphinx builds in the background for completion,
      diagnostics, references, and live preview.
    - >
      Project-specific configuration is documented through `pyproject.toml` under
      `[tool.esbonio.sphinx]`, with settings such as build arguments, configuration
      overrides, Python command, environment, and working directory.
related-packages:
  - id: brew:sphinx-doc
    reason: >
      Install Sphinx alongside Esbonio to build the documentation projects that the
      language server discovers, analyzes, and previews in the editor.
    rel: adjacent_workflow
    sources:
      - https://docs.esbon.io/en/release/
      - https://www.sphinx-doc.org/en/master/
category: developer-tools
package-manager:
  brew: esbonio
package-manager-url: https://formulae.brew.sh/formula/esbonio
license: MIT
tags:
  - cli
  - documentation
  - language-server
  - lsp
  - python
  - sphinx
description: Language server for working with Sphinx projects
executables:
  - esbonio
provenance:
  formula: esbonio
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
