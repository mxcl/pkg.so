id: cask:keycombiner
display-name: KeyCombiner
homepage: https://keycombiner.com/
repo: https://github.com/tkainrad/keycombiner
docs:
  - https://keycombiner.com/collections/keycombiner
  - https://keycombiner.com/desktop
  - https://keycombiner.com/features
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      KeyCombiner expanded its browser-based shortcut-learning service into desktop
      applications for macOS, Linux, and Windows. Homebrew Cask provides package-manager
      installation of the macOS application.
  package-nerd-significance:
    - >
      KeyCombiner combines several power-user traditions—searchable shortcut references,
      personal cheat sheets, flashcard practice, and global desktop lookup—in one
      cross-platform product.
  project-history:
    - >
      KeyCombiner was publicly presented as a keyboard-shortcut learning and lookup
      service by 2020. Its desktop application added global instant lookup,
      active-application awareness, and the ability to practice shortcuts that browsers
      would otherwise intercept.
  related-projects:
    - >
      Cheat-sheet applications, spaced-repetition trainers, command palettes, and
      launcher utilities address overlapping shortcut-discovery and recall workflows.
  sources:
    - https://keycombiner.com/collections/
    - https://keycombiner.com/desktop/
    - https://keycombiner.com/features/
    - source_facts.package-manager
  summary:
    - >
      KeyCombiner is a cross-platform shortcut reference and training application. It
      organizes personal and public shortcut collections, supports practice through
      repetition, and provides instant desktop lookup for the active application.
  timeline:
    - >
      2020: The official site’s copyright history indicates the service was operating by
      this year.
    - '2026: The supplied package metadata records KeyCombiner as a Homebrew Cask application.'
  usage:
    - >
      Users collect shortcuts or text snippets, practice them through the web or desktop
      interface, and invoke a configurable global shortcut to search their collections
      and the shortcuts associated with the active application.
category: productivity
package-manager:
  brew-cask: keycombiner
package-manager-url: https://formulae.brew.sh/cask/keycombiner
tags:
  - cheat-sheet
  - desktop-app
  - keyboard-shortcuts
  - productivity
  - shortcut-lookup
  - spaced-repetition
description: Instant shortcut lookup
applications:
  - KeyCombiner.app
provenance:
  cask: keycombiner
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
