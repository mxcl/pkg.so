id: brew:classads
display-name: ClassAds
homepage: https://research.cs.wisc.edu/htcondor/classad/
repo: https://github.com/htcondor/htcondor
docs:
  - https://htcondor.org/classad/c%2B%2Bdoc
  - https://htcondor.org/classad/c%2B%2Btut.html
  - https://htcondor.org/classad/classad.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The standalone C++ ClassAd distribution has official release history from 0.9.6 in
      October 2004 through 1.0.10 in April 2011. Homebrew packages that standalone
      tarball as classads 1.0.10 and reported 101 installs over the prior 365 days.
  package-nerd-significance:
    - >
      ClassAds is package-nerd interesting because Homebrew preserves a standalone slice
      of HTCondor's scheduler expression language as a small C++ package, separate from
      the much larger HTCondor system.
  project-history:
    - >
      The official ClassAds page describes ClassAds as the lingua franca of HTCondor,
      exchanged by HTCondor processes to describe jobs, workstations, and other
      resources. The same page states that the ClassAd library is also available as a
      standalone package outside HTCondor.
    - >
      HTCondor documentation records a transition from Old ClassAds to New ClassAds: Old
      ClassAds were tied to HTCondor development libraries, New ClassAds added features
      and were designed as a standalone library, and HTCondor switched to the New
      ClassAd library in version 7.5.1.
  related-projects:
    - >
      ClassAds are part of the HTCondor software suite and are also documented in the
      HTCondor manual.
    - >
      The official ClassAds page references Java implementations and ClassAd language
      papers/specifications alongside the C++ library.
  sources:
    - https://htcondor.org/classad/classad.html
    - https://htcondor.org/classad/c%2B%2Bdoc
    - https://htcondor.readthedocs.io/en/latest/classads/classad-mechanism.html
    - https://api.github.com/repos/htcondor/htcondor
    - https://formulae.brew.sh/api/formula/classads.json
  summary:
    - >
      ClassAds are HTCondor's classified advertisement language and matching mechanism
      for describing jobs, machines, submitters, resources, and constraints in
      high-throughput computing systems.
  timeline:
    - '2004: Official standalone C++ library version 0.9.6 released.'
    - '2010: HTCondor 7.5.1 switched to the New ClassAd library.'
    - '2011: Official standalone C++ library version 1.0.10 released.'
    - '2026: Homebrew formula metadata lists classads 1.0.10 as stable.'
  usage:
    - >
      ClassAds are used for matchmaking: a job ClassAd and a machine ClassAd can refer
      to one another while expressions evaluate whether constraints are satisfied. The
      Homebrew package exposes small C++ library utilities such as cxi and
      classad_version.
related-packages: []
category: system
package-manager:
  brew: classads
package-manager-url: https://formulae.brew.sh/formula/classads
license: Apache-2.0
tags:
