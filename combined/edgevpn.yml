id: brew:edgevpn
display-name: EdgeVPN
homepage: https://mudler.github.io/edgevpn
repo: https://github.com/mudler/edgevpn
docs:
  - https://mudler.github.io/edgevpn
config-file-location:
  unix: config.yaml
credentials-file-location:
  unix: config.yaml
history:
  adoption-history:
    - >
      Official adoption evidence is strongest inside related cloud-native projects. The
      README says the Kairos CNCF project uses EdgeVPN as a layer for creating
      decentralized Kubernetes clusters, and that EdgeVPN powers LocalAI's P2P features.
    - >
      Homebrew packaging gives workstation users a simple install path, while the
      upstream README primarily directs users to precompiled static releases and source
      usage.
  package-nerd-significance:
    - >
      EdgeVPN is interesting to package people because it bundles modern p2p networking
      into a single static CLI with very little central infrastructure. It lives in the
      same mental drawer as VPNs, tunnels, reverse proxies, and Kubernetes lab tooling.
    - >
      The project also shows the current package-manager appetite for edge and homelab
      networking tools: install one binary, generate a token, and assemble an overlay
      network without running a coordinator service.
  project-history:
    - >
      The GitHub repository was created in May 2021. The README frames the project as an
      experiment with libp2p and as a more open, less-infrastructure alternative to
      ngrok-style tunneling.
    - >
      By 2026, the project had an active release stream, with GitHub releases including
      v0.35.2 in June 2026. The README describes a broader scope than VPN alone: reverse
      proxying, p2p file transfer, a library interface, and an internal distributed
      ledger.
  related-projects:
    - libp2p is the underlying p2p networking stack credited by the project.
    - Kairos uses EdgeVPN for decentralized Kubernetes cluster networking.
    - LocalAI uses EdgeVPN for P2P features.
    - k3s appears in the README as an example Kubernetes cluster use case.
  sources:
    - https://raw.githubusercontent.com/mudler/edgevpn/master/README.md
    - https://api.github.com/repos/mudler/edgevpn
    - https://api.github.com/repos/mudler/edgevpn/releases
  summary:
    - >
      EdgeVPN is a Go/libp2p tool for creating decentralized private networks, reverse
      proxies, and peer-to-peer file transfers using shared tokens or configuration
      files instead of a central VPN server.
  timeline:
    - '2021-05: GitHub repository created.'
    - '2021: README screenshots and early documentation show dashboard and networking features.'
    - '2026-05: Release stream reaches v0.34.0.'
    - '2026-06: Release v0.35.2 published.'
  usage:
    - >
      Users generate a config file with `edgevpn -g > config.yaml` or an encoded token
      with `edgevpn -g -b`, then share that network definition among peers. The README
      warns that exposing the file or token is equivalent to giving full control of the
      network.
    - >
      Common uses include starting a VPN interface with per-node virtual addresses,
      exposing TCP services through the p2p network, sending files, and embedding
      EdgeVPN as a Go library.
related-packages:
  - id: brew:localai
    reason: >
      LocalAI directly embeds EdgeVPN as a library to create token-protected peer
      networks for federated and distributed inference, making the two packages a
      documented integrated workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/mudler/edgevpn#readme
      - https://localai.io/docs/features/distribute/index.print.html
  - id: brew:tailscale
    reason: >
      Choose Tailscale when identity, access policies, automatic WireGuard key
      management, and a centralized coordination plane are desirable; choose EdgeVPN for
      shared-token, libp2p-based networking without a central server.
    rel: alternative
    sources:
      - https://mudler.github.io/edgevpn/docs/
      - https://mudler.github.io/edgevpn/docs/explanation/security-model/
      - https://tailscale.com/docs/concepts/control-data-planes
      - https://tailscale.com/docs/concepts/tailscale-identity
  - id: brew:wireguard-tools
    reason: >
      Choose WireGuard Tools for a small, manually configured encrypted tunnel using
      explicit peer keys and interfaces; choose EdgeVPN when automatic peer discovery,
      shared-token membership, reverse proxying, or file transfer is needed.
    rel: alternative
    sources:
      - https://mudler.github.io/edgevpn/docs/
      - https://www.wireguard.com/quickstart/
category: networking
package-manager:
  brew: edgevpn
package-manager-url: https://formulae.brew.sh/formula/edgevpn
license: Apache-2.0
tags:
  - cli
  - decentralized
  - mesh
  - networking
  - peer-to-peer
  - vpn
description: Immutable, decentralized, statically built p2p VPN
executables:
  - edgevpn
provenance:
  formula: edgevpn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
