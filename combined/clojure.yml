id: brew:clojure
display-name: Clojure
homepage: https://clojure.org
repo: https://github.com/clojure/brew-install
docs:
  - https://clojure.org/api/api
  - https://clojure.org/guides/getting_started
  - https://clojure.org/reference/clojure_cli
  - https://clojure.org/reference/deps_edn
  - https://clojure.org/reference/reader
config-file-location:
  unix:
    - deps.edn
    - $CLJ_CONFIG/deps.edn
    - $XDG_CONFIG_HOME/clojure/deps.edn
    - ~/.clojure/deps.edn
credentials-file-location:
  unix:
    - ~/.m2/settings.xml
    - ~/.ssh/id_rsa
history:
  adoption-history:
    - >
      Clojure adoption is tied to both JVM library distribution and command-line tools.
      The official downloads page gives Maven and deps.edn coordinates for the language
      artifact, and the Clojure CLI reference describes clj and clojure commands that
      run programs, start REPLs, invoke functions, run tools, and construct classpaths
      from deps.edn sources.
    - >
      The supplied input shows broad package-manager distribution for the CLI package:
      apk, Homebrew, Debian, dnf, MacPorts, Nix, pacman, Ubuntu, and zypper.
  package-nerd-significance:
    - >
      Clojure is package-nerd significant because the language runtime is a Maven
      artifact, the CLI is an OS-packageable tool, and deps.edn makes dependency
      coordinates a plain data file. That split lets the CLI version, the language
      artifact version, and project dependencies be reasoned about separately.
    - >
      For Unix package managers, the brew formula ships the clj and clojure commands,
      while real Clojure programs commonly resolve org.clojure/clojure and libraries
      from Maven repositories. The official CLI docs also make tools executable through
      the same dependency-resolution model.
  project-history:
    - >
      Clojure was created by Rich Hickey as a modern Lisp for an established host
      platform. The official rationale says it embraces the JVM, modernizes Lisp,
      fosters functional programming with immutable persistent data structures, and
      provides concurrency support through software transactional memory and agents.
    - >
      The official releases page lists Clojure 1.0.0 in July 2009 and current stable
      Clojure 1.12.5 in May 2026. The official history page points to Rich Hickey's
      HOPL-IV paper, 'A History of Clojure,' as the project's long-form historical
      record.
  related-projects:
    - >
      Officially related projects include ClojureScript, ClojureCLR, tools.deps, the
      Clojure CLI, and the broader JVM/Maven ecosystem. clojure-lsp and ClojureScript
      build on Clojure's language and tooling conventions.
  sources:
    - https://clojure.org/about/rationale
    - https://clojure.org/about/history
    - https://clojure.org/releases/downloads
    - https://clojure.org/releases/downloads_older
    - https://clojure.org/reference/clojure_cli
    - https://clojure.org/reference/deps_edn
    - https://github.com/clojure/clojure
  summary:
    - >
      Clojure is a dynamic, general-purpose Lisp hosted on the JVM. Its official
      rationale frames it as a pragmatic language design effort for Java-class
      infrastructure, functional programming, persistent immutable data, and built-in
      concurrency support.
  timeline:
    - '2009: Clojure 1.0.0 listed on the official older releases page.'
    - '2010: Clojure 1.1.0 and 1.2.x listed on the official older releases page.'
    - '2017: Clojure 1.9.0 released with official release notes.'
    - '2018: Clojure 1.10.0 released with official release notes.'
    - "2021: HOPL-IV conference talk and Q&A for 'A History of Clojure.'"
    - '2024: Clojure 1.12.0 released with official release notes.'
    - '2026: Clojure 1.12.5 listed as stable release on May 12, 2026.'
  usage:
    - >
      The Clojure CLI is invoked as clojure or clj. Official CLI docs describe using
      deps.edn files to configure dependencies and classpaths, starting a REPL,
      executing functions with -X, running tools with -T, and running main namespaces or
      scripts with -M.
    - >
      The deps.edn reference describes project paths, dependencies, aliases, Maven
      dependencies, Git dependencies, local dependencies, and tool definitions. User
      configuration lives in the Clojure CLI config directory, computed from CLJ_CONFIG,
      XDG_CONFIG_HOME, or ~/.clojure.
related-packages:
  - id: brew:leiningen
    reason: >
      Use Leiningen as an alternative project and build workflow when maintaining
      Clojure projects organized around `project.clj`, including its documented `lein
      repl` development flow.
    rel: alternative
    sources:
      - https://clojure.org/guides/repl/launching_a_basic_repl
      - https://codeberg.org/leiningen/leiningen
  - id: brew:clojurescript
    reason: >
      Use ClojureScript alongside Clojure when the same Lisp-oriented development model
      needs to target JavaScript runtimes and browsers.
    rel: adjacent_workflow
    sources:
      - https://clojurescript.org/
      - https://github.com/clojure/clojurescript
  - id: brew:clojure-lsp
    reason: >
      Add clojure-lsp to provide editors with navigation, diagnostics, completion,
      refactoring, and other language-aware features for Clojure projects.
    rel: adjacent_workflow
    sources:
      - https://clojure-lsp.io/
      - https://clojure.org
  - id: brew:cljfmt
    reason: >
      Use cljfmt in Clojure development and CI workflows to check or normalize source
      formatting consistently.
    rel: adjacent_workflow
    sources:
      - https://github.com/weavejester/cljfmt
      - https://clojure.org
category: language-runtime
package-manager:
  apk: clojure
  brew: clojure
  debian: clojure
  dnf: clojure
  macports: clojure
  nix: clojure
  pacman: clojure
  ubuntu: clojure
  zypper: clojure
package-manager-url: https://formulae.brew.sh/formula/clojure
license: EPL-1.0
tags:
  - cli
  - jvm
  - lisp
  - programming-language
  - repl
description: Dynamic, general-purpose programming language
executables:
  - clj
  - clojure
provenance:
  formula: clojure
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
