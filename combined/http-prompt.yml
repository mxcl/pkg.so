id: brew:http-prompt
display-name: HTTP Prompt
homepage: https://http-prompt.com
repo: https://github.com/httpie/http-prompt
docs:
  - https://docs.http-prompt.com/
  - https://github.com/httpie/http-prompt#readme
  - https://http-prompt.com/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/http-prompt/config.py
    - ~/.config/http-prompt/config.py
  windows:
    - '%LOCALAPPDATA%/http-prompt/config.py'
    - ~/AppData/Local/http-prompt/config.py
credentials-file-location:
  unix:
    - $XDG_DATA_HOME/http-prompt/context.hp
    - ~/.local/share/http-prompt/context.hp
  windows:
    - '%LOCALAPPDATA%/http-prompt/context.hp'
    - ~/AppData/Local/http-prompt/context.hp
history:
  adoption-history:
    - >
      HTTP Prompt gained developer-tool visibility through the HTTPie organization, PyPI
      distribution, Homebrew and MacPorts packaging in the input metadata, and a GitHub
      repository with thousands of stars. Its adoption tracked the 2010s shift toward
      friendlier API CLIs for testing JSON and REST services.
  package-nerd-significance:
    - >
      HTTP Prompt is notable as a mashup package: HTTPie syntax, prompt_toolkit
      interaction, a PEG parser, and pgcli-style usability applied to API testing. For
      package people, it represents the Python CLI era when rich terminal UX became a
      first-class feature rather than a GUI afterthought.
  project-history:
    - >
      PyPI records the first http-prompt release, 0.1.0, in May 2016. The project
      documentation credits HTTPie for the human-friendly HTTP CLI model, prompt_toolkit
      for interactive terminal behavior, Parsimonious for parsing, and pgcli as an
      inspiration.
    - >
      The documentation shows the project maturing quickly during 2016: configuration
      and persistent context appeared in v0.4.0, the persistent-context behavior changed
      in v0.6.0, and OpenAPI/Swagger navigation appeared in v0.10.0.
  related-projects:
    - >
      HTTPie, prompt_toolkit, Parsimonious, and pgcli are directly credited by the
      project. It also sits near curl, wget, Postman-style API testing, and OpenAPI
      tooling.
  sources:
    - Official docs, GitHub README/release metadata, and PyPI package metadata.
  summary:
    - >
      HTTP Prompt is an interactive command-line HTTP and API testing client built on
      HTTPie and prompt_toolkit. It brought shell-style completion, syntax highlighting,
      session context, and OpenAPI-aware navigation to HTTPie-style request
      construction.
  timeline:
    - '2016: Version 0.1.0 was uploaded to PyPI.'
    - '2016: Version 0.4.0 added user configuration and persistent context.'
    - '2016: Version 0.10.0 added OpenAPI/Swagger-aware navigation.'
    - '2018: Version 1.0.0 was published on GitHub releases.'
    - '2021: Version 2.1.0 was published on GitHub releases.'
  usage:
    - >
      Users start an interactive prompt for a host, build up headers, query parameters,
      body fields, and authentication state, then preview or execute HTTP requests. The
      tool can persist session context and use an OpenAPI specification to autocomplete
      endpoint paths and parameters.
related-packages:
  - id: brew:httpie
    reason: >
      Choose HTTPie for direct, non-interactive shell commands and scripts; HTTP Prompt
      builds on HTTPie's request model when an exploratory REPL with completion is more
      useful.
    rel: alternative
    sources:
      - https://docs.http-prompt.com/
      - https://httpie.io/docs/cli
category: developer-tools
package-manager:
  brew: http-prompt
  macports: http-prompt
package-manager-url: https://formulae.brew.sh/formula/http-prompt
license: MIT
tags:
  - api-testing
  - autocomplete
  - cli
  - http-client
  - syntax-highlighting
description: Interactive command-line HTTP client with autocomplete and syntax highlighting
executables:
  - http-prompt
provenance:
  formula: http-prompt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
