id: cask:applite
display-name: Applite
homepage: https://applite.app/
repo: https://github.com/milanvarady/Applite
docs:
  - https://aerolite.dev/applite
  - https://aerolite.dev/applite/troubleshooting
  - https://github.com/milanvarady/Applite#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Applite targets macOS users who want access to Homebrew's application catalog
      without primarily operating through a terminal. It can use an existing Homebrew
      installation, allowing casks already installed there to appear in its interface.
  package-nerd-significance:
    - >
      Applite is part of a recurring package-manager tradition: graphical frontends that
      expose a command-line ecosystem to less technical users. It is particularly
      interesting because it manages Homebrew casks rather than establishing a separate
      application catalog.
  project-history:
    - >
      Applite was created by Milan Varady as a free and open-source macOS interface for
      managing third-party applications through Homebrew. Its official distribution and
      development repository is hosted on GitHub.
  related-projects:
    - Homebrew
    - Homebrew Cask
  sources:
    - 'Official project page: https://aerolite.dev/applite'
    - 'Official repository: https://github.com/milanvarady/Applite'
    - source_facts.source-archive
    - source_facts.version
  summary:
    - >
      Applite is a graphical Homebrew frontend for installing, updating, and
      uninstalling macOS applications.
  timeline:
    - >
      2026: The supplied cask record distributes Applite 1.4.0 from the project's
      official GitHub releases.
  usage:
    - >
      On first launch, users may connect Applite to an existing Homebrew installation or
      let it create a dedicated Homebrew installation. The dedicated installation is
      stored under `~/Library/Application Support/Applite/homebrew`; this is a managed
      Homebrew tree, not a documented Applite configuration file.
category: system
package-manager:
  brew-cask: applite
package-manager-url: https://formulae.brew.sh/cask/applite
tags:
  - app-management
  - gui
  - homebrew
  - homebrew-cask
  - macos
  - package-manager
description: User-friendly GUI app for Homebrew
applications:
  - Applite.app
provenance:
  cask: applite
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
