history:
  adoption-history:
    - >
      Mitti has been developed as a specialist macOS application for live-event and
      audiovisual workflows. Its ongoing changelog shows sustained support for
      professional hardware and protocols including Blackmagic Design output, ATEM
      integration, NDI, Syphon, OSC, MIDI, and timecode.
  package-nerd-significance:
    - >
      Mitti is a representative specialist Homebrew cask: proprietary, Mac-native
      production software distributed as a disk image but installable and updatable
      through the same declarative workflow as command-line media tools. Its hardware
      and protocol integrations make version compatibility particularly important to
      show operators.
  project-history:
    - >
      Imimot developed Mitti as cue-based video and media playback software for live
      events. The official archive documents the older 1.x generation, while Mitti 2.0
      was released in December 2021 with a redesigned generation of the application.
    - >
      Subsequent 2.x releases added browser cues, audio normalization, richer OSC
      control, 10-bit rendering, playback-speed control, subtitle features, and broader
      Blackmagic, NDI, and ATEM integration.
  related-projects:
    - >
      Mitti participates in production ecosystems built around NDI, Syphon, Blackmagic
      Design capture/output hardware, ATEM switchers, MIDI, OSC, and MTC/LTC timecode.
    - >
      Imimot also develops Vezér, a timeline and control application used in audiovisual
      production.
  sources:
    - https://imimot.com/help/mitti
    - https://imimot.com/help/mitti/changelog
    - https://imimot.com/help/mitti/misc
    - https://imimot.com/mitti
  summary:
    - >
      Mitti is a macOS cue-based video and media playback application from Imimot for
      live events, projection, broadcast, and audiovisual performances.
  timeline:
    - '2017: Imimot moved its product documentation into its official website help center.'
    - '2021: Mitti 2.0 received its initial release.'
    - '2022: Mitti 2.2 added browser sources and audio normalization.'
    - '2024: Mitti 2.8 added 10-bit rendering and playback-speed control.'
    - '2026: Mitti 2.8.18 continued the maintained 2.8 release line.'
  usage:
    - >
      Operators assemble media into playlists of cues, route video and audio to screens
      or professional outputs, and trigger playback manually or through external-control
      systems. Projects can be bundled with media and relative paths for movement
      between show computers.
    - >
      Mitti is commonly controlled through keyboard commands, MIDI, OSC, timecode, or
      integrations with production hardware. Backup and synchronization features support
      reliability-sensitive live playback.
