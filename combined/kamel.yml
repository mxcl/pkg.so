id: brew:kamel
display-name: kamel
homepage: https://camel.apache.org/
repo: https://github.com/apache/camel-k
docs:
  - https://camel.apache.org/camel-k/2.10.x/installation/installation.html
  - https://camel.apache.org/camel-k/2.10.x/running/running-cli.html
config-file-location: null
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      Camel K adoption sits inside the Apache Camel community and Kubernetes ecosystem.
      Users who already know Camel routes can run integrations as Kubernetes-native
      resources rather than packaging and operating their own standalone services for
      every integration.
    - >
      The CLI packaging matters because installation instructions and day-to-day
      examples begin with `kamel`: installing the operator, running an integration file,
      and iterating in development mode. Homebrew packaging makes that entry point easy
      to install on developer workstations.
  package-nerd-significance:
    - >
      kamel is a good package-manager example of an operator companion CLI. The
      executable is small, but the thing it controls is distributed infrastructure, so
      version alignment with the operator, release artifacts, and Kubernetes cluster
      behavior matters.
    - >
      It also represents a common packaging pattern for cloud-native tools: a local
      command creates and manages remote resources, while the actual workload runs
      inside the cluster.
  project-history:
    - >
      The Apache Camel K repository was created on 2018-08-31. The README describes
      Camel K as a lightweight integration framework built from Apache Camel, running
      natively on Kubernetes, and designed for serverless and microservice
      architectures.
    - >
      The `kamel` CLI is documented as a utility released beside the Camel K operator.
      Its job is to install Camel K, run integrations from Camel DSL files, and support
      workflows such as development mode where changes are applied to the remote
      integration pod.
    - >
      GitHub releases show nightly artifacts in 2020 and stable 2.x releases by the
      mid-2020s. Apache Camel release and blog material also ties Camel K to the wider
      Camel modernization track around Quarkus, Knative, Kubernetes operators, and
      cloud-native integration.
  related-projects:
    - Apache Camel is the integration framework Camel K builds on.
    - >
      Camel Quarkus, Knative, Kubernetes, and OpenShift are adjacent technologies in the
      Camel K runtime and deployment story.
  sources:
    - https://api.github.com/repos/apache/camel-k
    - https://camel.apache.org/blog/2020/08/camel-quarkus-release-1.0.0/
    - https://camel.apache.org/camel-k/2.10.x/index.html
    - https://camel.apache.org/camel-k/2.10.x/installation/installation.html
    - https://camel.apache.org/camel-k/2.10.x/running/running-cli.html
    - https://github.com/apache/camel-k
    - https://github.com/apache/camel-k/releases
  summary:
    - >
      kamel is the command-line interface for Apache Camel K, the Apache Camel
      subproject that runs Camel integrations natively on Kubernetes. The package is
      important less as a standalone tool and more as the user-facing entry point to a
      Kubernetes operator, custom resources, traits, and Camel runtime management.
  timeline:
    - '2018: apache/camel-k repository created.'
    - '2020: Camel K nightly releases published on GitHub.'
    - >
      2020: Apache Camel Quarkus 1.0 material described Camel K 1.0 as a sibling project
      using Camel Quarkus runtime support.
    - '2026: Camel K 2.10.x documentation documented the `kamel` CLI and release locations.'
  usage:
    - >
      `kamel run` is the core documented workflow: save an integration in a Camel DSL
      file and submit it to a Kubernetes cluster. The operator then transforms the
      Integration custom resource into a Camel application running on the cloud.
    - >
      The CLI is also used for installation and local developer ergonomics; the official
      CLI page points to Apache mirrors and GitHub releases for the `kamel` binary.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubectl establishes and manages the Kubernetes context and kubeconfig that the
      official Camel K documentation says `kamel` reuses when operating on a cluster.
    rel: adjacent_workflow
    sources:
      - https://camel.apache.org/camel-k/2.11.x/running/running-cli.html
      - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
category: developer-tools
package-manager:
  brew: kamel
package-manager-url: https://formulae.brew.sh/formula/kamel
license: Apache-2.0
tags:
  - apache-camel
  - camel-k
  - cli
  - integration
  - kubernetes
description: Apache Camel K CLI
executables:
  - kamel
provenance:
  formula: kamel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
