id: brew:awslogs
display-name: awslogs
homepage: https://github.com/jorgebastida/awslogs
repo: https://github.com/jorgebastida/awslogs
docs:
  - https://github.com/jorgebastida/awslogs#readme
config-file-location: null
credentials-file-location:
  unix: ~/.aws/credentials
history:
  adoption-history:
    - >
      awslogs became popular because it made CloudWatch Logs feel closer to `tail`,
      `grep`, and other local log-reading workflows. Before and alongside newer AWS CLI
      log commands and consoles, it gave operators a direct way to stream and search
      CloudWatch logs from a terminal.
    - >
      Its public repository attention and package-manager availability reflect a narrow
      but durable use case: AWS users wanted log access that fit shell habits.
  package-nerd-significance:
    - >
      awslogs matters to package-manager users as a classic single-purpose cloud CLI:
      small command surface, obvious executable name, and immediate value in
      incident-response shells. It represents the era when many AWS service gaps were
      filled by independent Python CLIs distributed through pip and Homebrew.
    - >
      For package nerds, it is also a useful contrast with AWS CLI: not every AWS task
      wants a giant generated vendor CLI when a focused stream-oriented tool is nicer.
  project-history:
    - >
      The `jorgebastida/awslogs` repository was created in January 2015, shortly after
      CloudWatch Logs became a common AWS logging destination. The README describes it
      as a simple tool for querying groups, streams, and events from Amazon CloudWatch
      Logs, with features such as aggregation across streams, colored output, watching
      logs, and human-friendly relative time filters.
    - >
      The project used Git tags rather than GitHub releases for much of its history.
      Tags show early 0.x releases by 2016 and a 0.15.0 tag in 2024, while the README
      continues to document both pip and Homebrew installation.
  related-projects:
    - AWS CLI can also retrieve CloudWatch Logs through generated service commands.
    - Amazon CloudWatch Logs is the AWS service queried by awslogs.
    - >
      Boto/Boto3 and AWS shared credentials provide the underlying AWS Python ecosystem
      and credential conventions.
  sources:
    - https://api.github.com/repos/jorgebastida/awslogs
    - >
      https://api.github.com/repos/jorgebastida/awslogs/git/tags/0ba94c4dc2640cfa530fe882fc2ac347bf5f2a9f
    - >
      https://api.github.com/repos/jorgebastida/awslogs/git/tags/568570610dbbdd75ffb98349e0af768c7a2d0355
    - https://api.github.com/repos/jorgebastida/awslogs/tags?per_page=100
    - https://github.com/jorgebastida/awslogs
    - https://raw.githubusercontent.com/jorgebastida/awslogs/master/README.rst
  summary:
    - >
      awslogs is a command-line reader for Amazon CloudWatch Logs. It wraps common
      log-group, log-stream, tailing, filtering, and time-window workflows in a small
      CLI aimed at humans using pipes and terminal tools.
  timeline:
    - '2015: Public GitHub repository `jorgebastida/awslogs` created.'
    - '2016: 0.5 tag published.'
    - '2024: 0.15.0 tag published.'
    - '2024: Repository still receives updates.'
  usage:
    - >
      Common usage includes `awslogs groups`, `awslogs streams GROUP`, and `awslogs get
      GROUP STREAM_EXPRESSION`, often with `--start`, `--end`, `--watch`,
      `--filter-pattern`, or `--query`. The README highlights piping output into tools
      such as `grep` for pseudo-realtime monitoring.
    - >
      awslogs can take explicit AWS access keys, but its README recommends using AWS
      CLI-managed credentials when available; with multiple profiles, users pass
      `--profile` or set `AWS_PROFILE`.
related-packages:
  - id: brew:awscli
    reason: >
      Choose AWS CLI when you need the vendor-supported `logs filter-log-events` and
      broader AWS service command set; its configured profiles are also consumed
      directly by awslogs.
    rel: alternative
    sources:
      - https://github.com/jorgebastida/awslogs#readme
      - https://docs.aws.amazon.com/cli/latest/reference/logs/filter-log-events.html
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
  - id: brew:localstack
    reason: >
      awslogs explicitly supports custom endpoints for querying a LocalStack CloudWatch
      Logs environment during local development.
    rel: adjacent_workflow
    sources:
      - https://github.com/jorgebastida/awslogs#readme
      - https://docs.localstack.cloud/user-guide/aws/logs/
category: cloud-infrastructure
package-manager:
  brew: awslogs
  nix: awslogs
package-manager-url: https://formulae.brew.sh/formula/awslogs
license: BSD-3-Clause
tags:
  - aws
  - cli
  - cloudwatch
  - logs
description: Simple command-line tool to read AWS CloudWatch logs
executables:
  - awslogs
provenance:
  formula: awslogs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
