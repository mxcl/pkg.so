id: brew:leveldb
display-name: LevelDB
homepage: https://github.com/google/leveldb/
repo: https://github.com/google/leveldb
docs:
  - https://github.com/google/leveldb
  - https://github.com/google/leveldb/blob/main/doc/index.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Google's 2011 announcement already named early adoption targets and relatives:
      Chrome's IndexedDB implementation was being built on LevelDB, Bigtable tablets
      were a design ancestor, and Riak had added LevelDB support for per-node storage.
      Over time, LevelDB also became a common dependency in language bindings,
      blockchain clients, browser storage, and package-manager indexes.
  package-nerd-significance:
    - >
      Package nerds care about LevelDB because it is one of the canonical small C++
      libraries that quietly sits underneath larger systems. It also produced a family
      tree: RocksDB and many language-specific Level* packages made the LevelDB API and
      storage pattern part of everyday infrastructure.
  project-history:
    - >
      Google announced LevelDB as open source on July 27, 2011 under a BSD-style
      license. The announcement described it as a fast persistent key-value store
      written at Google and designed for use in browsers, operating systems,
      applications, and higher-level storage systems.
    - >
      The upstream repository credits Google Inc. and lists Jeffrey Dean and Sanjay
      Ghemawat as the initial version authors. The README and documentation describe the
      core model that made LevelDB influential: string keys and values, ordered storage
      by key, atomic batch writes, snapshots, forward/backward iteration, and optional
      compression.
  related-projects:
    - >
      LevelDB is related to Bigtable conceptually, to Chrome IndexedDB as an embedded
      storage backend, to Riak through backend adoption, and to RocksDB as a major
      descendant. It also has a broad ecosystem of bindings and ports in Go, Node.js,
      Rust, Python, and other languages.
  sources:
    - https://api.github.com/repos/google/leveldb
    - https://formulae.brew.sh/formula/leveldb
    - https://github.com/google/leveldb
    - https://github.com/google/leveldb/blob/main/AUTHORS
    - https://github.com/google/leveldb/blob/main/doc/index.md
    - https://opensource.googleblog.com/2011/07/leveldb-fast-persistent-key-value-store.html
  summary:
    - >
      LevelDB is Google's embeddable, ordered key-value storage library. It is small
      enough to package as a C++ library but historically important because it made
      log-structured merge-tree storage, Snappy compression, and sorted key iteration
      available as a reusable building block.
  timeline:
    - '2011: Google announced LevelDB as open source on July 27, 2011.'
    - "2011: Google's announcement described Chrome IndexedDB, Bigtable, and Riak connections."
    - '2014: The `google/leveldb` GitHub repository was created on August 27, 2014.'
    - >
      2016: LevelDB 1.19 release notes added APIs such as approximate memory usage and
      ARM64 support.
    - >
      2026: The upstream repository remained the canonical source for the library and
      documentation.
  usage:
    - >
      LevelDB is normally linked into an application rather than run as a server.
      Package managers often ship the library, headers, and small utility programs so
      downstream software can embed fast local key-value storage without adding an
      external database daemon.
related-packages:
  - id: brew:rocksdb
    reason: >
      Choose RocksDB when you need a LevelDB-derived embedded engine tuned for server
      workloads, fast storage, multithreaded compaction, and substantially more
      operational controls.
    rel: alternative
    sources:
      - https://github.com/google/leveldb
      - https://github.com/facebook/rocksdb/wiki/RocksDB-Overview
      - https://github.com/facebook/rocksdb/wiki
category: data
package-manager:
  apk: leveldb
  brew: leveldb
  debian: leveldb-doc
  dnf: leveldb
  macports: leveldb
  nix: leveldb
  pacman: leveldb
  ubuntu: leveldb-doc
  zypper: leveldb
