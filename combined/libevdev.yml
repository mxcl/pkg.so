id: brew:libevdev
display-name: libevdev
homepage: https://www.freedesktop.org/wiki/Software/libevdev/
repo: https://gitlab.freedesktop.org/libevdev/libevdev
docs:
  - https://www.freedesktop.org/software/libevdev/doc/latest
  - https://www.freedesktop.org/wiki/Software/libevdev
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libevdev is part of the Linux input stack, below consumers such as libinput, X.org
      input drivers, compositors, and device-testing tools. Its freedesktop.org home,
      input-tools mailing list, and distribution packaging across Linux systems reflect
      adoption as infrastructure rather than an end-user application.
  package-nerd-significance:
    - >
      For package maintainers, libevdev is a foundational system library: tiny, C-based,
      MIT licensed, Linux-specific, and ABI-sensitive. It is a dependency that makes
      higher-level input stacks less coupled to raw kernel ioctl behavior.
  project-history:
    - >
      The upstream README describes libevdev as a wrapper around evdev devices whose
      goal is to move common evdev handling into a library and eventually wrap all
      direct evdev ioctls. Peter Hutterer's 2013 write-up described the library as a way
      to make /dev/input/eventX handling less error-prone, including buffering and
      recovery from SYN_DROPPED events.
  related-projects:
    - >
      libevdev is closely related to the Linux kernel evdev interface, uinput, libinput,
      xf86-input-evdev, Wayland compositors, and other freedesktop.org input tooling.
  sources:
    - https://github.com/whot/libevdev
    - https://github.com/whot/libevdev/tags
    - https://who-t.blogspot.com/2013/09/libevdev-handling-input-events.html
    - https://www.freedesktop.org/software/libevdev/doc/latest/
    - https://www.freedesktop.org/wiki/Software/libevdev/
  summary:
    - >
      libevdev is the freedesktop.org wrapper library for Linux evdev input devices,
      abstracting kernel ioctls into a type-safe C API.
  timeline:
    - >
      2013: A maintainer article dated September 2013 described libevdev 0.4 and an API
      expected to be stable.
    - '2014: The libevdev-1.0 tag was dated February 18, 2014 on the GitHub mirror.'
    - '2014: The libevdev-1.1 and 1.2 tags were dated March 25 and April 30, 2014.'
    - '2015: The libevdev-1.4 tag was dated March 3, 2015.'
    - '2016: The libevdev-1.5.4 tag was dated August 26, 2016.'
  usage:
    - >
      Applications open a Linux input event device and let libevdev expose events,
      device capabilities, and uinput support through C APIs. The packaged tools
      libevdev-tweak-device, mouse-dpi-tool, and touchpad-edge-detector are small
      examples of the library being used for practical hardware/input inspection.
related-packages: []
category: system
