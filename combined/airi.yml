id: cask:airi
display-name: AIRI
homepage: https://airi.moeru.ai/
repo: https://github.com/moeru-ai/airi
docs:
  - https://airi.moeru.ai/docs/en
  - https://airi.moeru.ai/docs/en/docs/manual/config/common
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AIRI developed from a personal experiment into an open-source,
      community-maintained project. Its releases support desktop package distribution
      and increasingly broad provider, plugin, character-stage, and agent capabilities.
  package-nerd-significance:
    - >
      AIRI is notable to package enthusiasts as a fast-moving, cross-platform
      open-source AI desktop application rather than a conventional command-line
      package. It combines local application packaging with configurable external AI
      providers, Live2D or 3D characters, speech components, plugins, and experimental
      agent integrations.
  project-history:
    - >
      The creator began the precursor project, initially named `ai`, on May 25, 2024 to
      explore building a personal AI agent inspired by AI VTubers. A basic interactive
      version was working by June 2, 2024. After a renewed development effort later that
      year, the organized codebase was published on GitHub as AIRI on December 2, 2024.
  related-projects:
    - Neuro-sama inspired the original experiment.
    - The broader Moeru AI ecosystem supplies related libraries and experiments.
    - AIRI has explored game-playing agents, including Factorio-oriented work.
  sources:
    - 'Official documentation: https://airi.moeru.ai/docs/en/'
    - 'Official origin account: https://airi.moeru.ai/docs/en/blog/DreamLog-0x1/'
    - 'Official releases: https://github.com/moeru-ai/airi/releases'
  summary:
    - >
      AIRI is an open-source AI VTuber and digital-companion application from the
      Project AIRI and Moeru AI community. It provides conversational, speech,
      character-stage, and experimental agent features across desktop and other
      interfaces.
  timeline:
    - '2024-05-25: Work began on the local precursor project named `ai`.'
    - '2024-06-02: The first basic interactive prototype was completed.'
    - '2024-12-02: The reorganized project was published on GitHub as AIRI.'
    - >
      2025: Community development expanded the interface, memory, providers, and agent
      experiments.
    - '2026: Releases expanded plugins, MCP tooling, character stages, and desktop support.'
  usage:
    - >
      Users install AIRI as a desktop application or use supported web and mobile
      surfaces, configure one or more AI providers in Settings, enter provider
      credentials locally, and select models for chat, vision, speech, transcription, or
      artistry modules. Provider credentials and settings are saved in device-local
      settings, but the official manual does not document a filesystem path.
