id: brew:castxml
display-name: CastXML
homepage: https://github.com/CastXML/CastXML
repo: https://github.com/CastXML/CastXML
docs:
  - https://github.com/CastXML/CastXML/blob/master/doc/manual/castxml.1.rst
  - https://github.com/CastXML/CastXML#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show CastXML distributed across Homebrew, Debian,
      Fedora, MacPorts, Nix, Arch, Scoop, Ubuntu, and openSUSE. That breadth matches its
      niche but durable role as infrastructure for C/C++ introspection workflows rather
      than an end-user command.
  package-nerd-significance:
    - >
      CastXML is package-nerd significant because it packages compiler-internal
      structure as a stable CLI artifact. It lets downstream tools depend on a packaged
      executable instead of embedding all of Clang's C++ APIs or reviving GCC-XML.
  project-history:
    - >
      The project is built around LLVM/Clang: its manual says source files are parsed as
      complete translation units by an internal Clang compiler. It also includes a
      --castxml-gccxml mode that emits XML close to GCC-XML, making it important for
      code-generation and binding workflows that previously expected GCC-XML-style
      output.
  related-projects:
    - >
      Related projects and technologies include LLVM/Clang, GCC-XML, CMake, and ITK; the
      README explicitly ties CastXML maintenance to Kitware's support of ITK.
  sources:
    - https://api.github.com/repos/CastXML/CastXML
    - https://github.com/CastXML/CastXML
    - https://github.com/CastXML/CastXML/blob/master/doc/manual/castxml.1.rst
    - https://github.com/CastXML/CastXML#readme
    - https://formulae.brew.sh/api/formula/castxml.json
    - https://github.com/CastXML/CastXML/releases
  summary:
    - >
      CastXML is a developer tool that parses C-family source files and writes a subset
      of the abstract syntax tree as XML. The upstream README describes it as maintained
      by Kitware in support of ITK, the Insight Segmentation and Registration Toolkit.
  timeline:
    - >
      2026: The README lists support for LLVM/Clang releases through 22.1 and git master
      as of 2026-06-10.
    - '2026: Homebrew formula packages v0.7.0 from the official release archive.'
  usage:
    - >
      Typical use is command-line AST extraction: pass source files, Clang options, and
      CastXML options, then request XML output with --castxml-output or
      GCC-XML-compatible output with --castxml-gccxml. The manual also documents
      compiler-target matching with --castxml-cc-* options.
related-packages:
  - id: brew:itk
    reason: >
      CastXML is maintained in support of ITK, whose wrapping pipeline uses CastXML
      binaries to generate language bindings from C++ declarations.
    rel: adjacent_workflow
    sources:
      - https://github.com/CastXML/CastXML
      - >
        https://github.com/InsightSoftwareConsortium/ITK/blob/main/Documentation/docs/releases/4.9.md
category: developer-tools
package-manager:
  brew: castxml
  debian: castxml
  dnf: castxml
  macports: castxml
  nix: castxml
  pacman: castxml
  scoop: main/castxml
  ubuntu: castxml
  zypper: CastXML-devel
package-manager-url: https://formulae.brew.sh/formula/castxml
license: Apache-2.0
tags:
  - ast
  - c
  - c-plus-plus
  - clang
  - cli
  - xml
description: C-family Abstract Syntax Tree XML Output
executables:
  - castxml
provenance:
  formula: castxml
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
