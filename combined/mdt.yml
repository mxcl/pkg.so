id: brew:mdt
display-name: mdt
homepage: https://github.com/basilioss/mdt
repo: https://github.com/basilioss/mdt
docs:
  - https://github.com/basilioss/mdt#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions cover Arch Linux via AUR helpers, macOS via
      Homebrew, manual installation with make, and a direct curl download into a user
      PATH. The input package-manager facts list Homebrew plus Windows package entries
      that appear unrelated to this Unix shell tool, so those are not treated as project
      adoption evidence.
    - >
      GitHub metadata showed a small but visible productivity-tool audience, with
      repository topics including cli, command-line, markdown, POSIX, shell,
      task-manager, todo, and todo-list.
  package-nerd-significance:
    - >
      mdt is package-nerd relevant as a tiny shell-first productivity package: no
      database, no service, no hosted account, just Markdown files and an interactive
      terminal UI built around `gum`.
  project-history:
    - >
      The public GitHub repository was created on 2023-02-23. The project focuses on a
      minimal task-capture and task-checking workflow rather than a large
      project-management model.
    - >
      The README documents a plain Markdown storage style, dependency on a
      POSIX-compliant shell and Charmbracelet's `gum`, and configuration through
      command-line options or environment variables rather than a named config file.
  related-projects:
    - The README says mdt is inspired by Steve Losh's `t`.
    - >
      The README lists Charmbracelet `gum` as a runtime dependency for the interactive
      terminal interface.
  sources:
    - https://api.github.com/repos/basilioss/mdt
    - https://github.com/basilioss/mdt#readme
    - source_facts.package-manager
  summary:
    - >
      mdt is a POSIX-shell command-line todo manager that stores tasks in Markdown. Its
      README describes it as a simple Markdown todo list manager inspired by Steve
      Losh's `t`.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2023: README documented Arch, Homebrew, make, and curl installation paths.'
    - '2026: Repository metadata showed continued visibility for the Markdown todo niche.'
  usage:
    - >
      Users run mdt against a task directory and inbox Markdown file, with options such
      as `--dir`, `--inbox`, `--add-multiple`, `--unite-tasks`, color, prompt, cursor,
      item width, input width, editor, and checkbox prefix.
    - >
      The README examples show aliases for static or date-based inbox files and
      environment variables such as `MDT_MAIN_COLOR` and `MDT_EDITOR` for persistent
      shell customization.
related-packages:
  - id: brew:task
    reason: >
      Choose Taskwarrior when you need a feature-rich task database, filtering,
      recurrence, and reporting instead of mdt's deliberately minimal Markdown-file
      workflow.
    rel: alternative
    sources:
      - https://github.com/basilioss/mdt#readme
      - https://taskwarrior.org/docs
  - id: brew:gum
    reason: >
      Gum is mdt's documented runtime dependency and provides the interactive terminal
      prompts and selectors used by its shell workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/basilioss/mdt#readme
      - https://github.com/charmbracelet/gum#readme
category: productivity
package-manager:
  brew: mdt
  chocolatey: MDT
package-manager-url: https://formulae.brew.sh/formula/mdt
license: GPL-3.0-or-later
tags:
  - cli
  - markdown
  - productivity
  - shell
  - task-manager
  - todo
description: Command-line markdown todo list manager
executables:
  - mdt
provenance:
  formula: mdt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
