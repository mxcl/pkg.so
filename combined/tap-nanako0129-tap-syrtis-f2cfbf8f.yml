      - https://github.com/steipete/CodexBar
      - https://github.com/steipete/CodexBar/blob/main/docs/cli.md
  - id: brew:ccusage
    reason: >
      Choose ccusage when you prefer terminal-based, scriptable local reports over
      Syrtis's persistent macOS menu-bar dashboard.
    rel: alternative
    sources:
      - https://github.com/Nanako0129/syrtis#readme
      - https://ccusage.com/guide
      - https://github.com/ccusage/ccusage
