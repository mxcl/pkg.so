id: brew:macchina
display-name: Macchina
homepage: https://github.com/Macchina-CLI/macchina
repo: https://github.com/Macchina-CLI/macchina
docs:
  - https://github.com/Macchina-CLI/macchina#readme
config-file-location:
  linux:
    - ~/.config/macchina/macchina.toml
    - $XDG_CONFIG_HOME/macchina/macchina.toml
  macos: ~/.config/macchina/macchina.toml
  windows: '%AppData%/macchina/macchina.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Macchina's installation wiki documents packaging across Homebrew, pkgsrc,
      openSUSE, Termux, Scoop, Nix, Guix, Arch Linux, and Cargo. Homebrew analytics
      reported 1,436 installs over 365 days, and crates.io reported more than 150,000
      total downloads.
    - >
      The README credits contributors who helped shape platform support: NetBSD
      packaging and testing, macOS and Windows support, and Android/OpenWrt support.
      That contributor history mirrors the package's adoption path from a Rust CLI to a
      broadly packaged cross-platform fetcher.
  package-nerd-significance:
    - >
      Macchina matters to package nerds as part of the post-neofetch system-fetcher
      wave: small Rust binaries, cross-platform packaging, themeable terminal output,
      and a separate library crate for system data. Its maintenance-mode status is also
      useful metadata for packagers deciding how much churn to expect.
  project-history:
    - >
      The project appeared on crates.io in February 2021 and grew as a Rust entrant in
      the terminal system-fetcher space. The README describes Macchina as basic by
      default and customizable by design, with a separate libmacchina repository
      handling system-information fetching.
    - >
      By the 6.x series, release notes show the project refining readouts, configuration
      behavior, build reliability, and dependency choices. The README later marked
      Macchina as in maintenance mode, accepting bug fixes and documentation
      improvements while stating that it had achieved its intended purpose.
  related-projects:
    - >
      The README points to libmacchina for fetching-related issues. In package-manager
      culture, Macchina is commonly compared with other terminal system fetchers such as
      neofetch-style tools, but its official materials emphasize its own minimal and
      customizable Rust stack.
  sources:
    - https://crates.io/api/v1/crates/macchina
    - https://formulae.brew.sh/api/formula/macchina.json
    - https://github.com/Macchina-CLI/macchina#readme
    - https://github.com/Macchina-CLI/macchina/releases
    - https://github.com/Macchina-CLI/macchina/wiki/Configuration
    - https://github.com/Macchina-CLI/macchina/wiki/Customization
    - https://github.com/Macchina-CLI/macchina/wiki/Installation
    - source_facts.repo
  summary:
    - >
      Macchina is a Rust system-information fetcher focused on speed, minimalism, and
      customization. It displays information such as kernel version, uptime, memory
      usage, and processor load across Linux, macOS, Windows, BSDs, OpenWrt, and
      Android.
  timeline:
    - '2021-02: First crates.io release, 0.1.3.'
    - >
      2022-09: 6.1.x releases fixed config/build issues and added macOS-related
      libmacchina support.
    - '2024-09: 6.2.0 and 6.2.1 added readouts and fixed a ratatui dependency issue.'
    - '2024-11: 6.4.0 reverted a vendoring change and adjusted terminal UI dependencies.'
    - '2026: README described the project as in maintenance mode.'
  usage:
    - >
      Users run `macchina` to print a themed system summary. The configuration wiki
      documents `macchina.toml` locations on Linux/BSD, macOS, and Windows, and the
      customization wiki documents separate TOML theme files plus `macchina
      --list-themes`.
    - >
      The installation wiki documents source builds with Cargo and cross builds for
      Android and OpenWrt, while the README points users to `--doctor` for diagnosing
      fetch failures.
related-packages:
  - id: brew:fastfetch
    reason: >
      Choose fastfetch for an actively maintained, feature-rich fetcher with a larger
      module system and JSONC configuration; choose Macchina for its simpler Rust
      frontend and TOML-based theme model.
    rel: alternative
    sources:
      - https://github.com/Macchina-CLI/macchina#readme
      - https://github.com/fastfetch-cli/fastfetch#readme
      - https://github.com/fastfetch-cli/fastfetch/wiki/Configuration
category: system
package-manager:
  apk: macchina
  brew: macchina
  nix: macchina
  pacman: macchina
  scoop: main/macchina
package-manager-url: https://formulae.brew.sh/formula/macchina
license: MIT
tags:
  - cli
  - fetcher
  - minimalism
  - performance
  - system-information
description: System information fetcher, with an emphasis on performance and minimalism
executables:
  - macchina
provenance:
  formula: macchina
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
