id: brew:i2util
display-name: i2util
homepage: https://github.com/perfsonar/i2util
repo: https://github.com/perfsonar/i2util
docs:
  - https://github.com/perfsonar/i2util#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      i2util's adoption is mostly indirect. The GitHub repository description says it is
      the command-line parsing, error logging, and threading library used by BWCTL,
      OWAMP, and other tools. It appears in package managers because those
      network-measurement packages and their helper commands need a shared utility
      layer.
    - >
      Homebrew exposes aespasswd and pfstore, making the otherwise library-oriented
      package visible as a small CLI package for users working with perfSONAR or
      Internet2 measurement stacks.
  package-nerd-significance:
    - >
      i2util is package-nerd significant precisely because it is glue. It is the sort of
      small, old, C utility library that lets larger measurement tools remain consistent
      about logging, options, randomness, threading, and key handling across Unix-like
      systems.
    - >
      Its history also preserves an older network-research packaging path: CVS-era
      ChangeLogs, autoconf, static libraries, manpages, RPM/package work, and later
      migration into GitHub and Homebrew formulas.
  project-history:
    - >
      The in-tree README says I2util began from utility code distributed with UCAR's
      volsh code and was reused because it was freely distributed. Internet2 then added
      local support for random numbers and hash tables, and the older ChangeLog shows
      the library being split and generalized for OWAMP and BWCTL-related code.
    - >
      The ChangeLog records an import in April 2002, early work on error logging and
      command-line options, hash-table support, random-device handling, and later
      additions such as aespasswd, PBKDF2, HMAC-SHA1, SHA-1 tests, socket/address
      helpers, and standalone installability.
    - >
      The GitHub repository was created in 2015 under the perfSONAR organization and
      uses tags in the v5.x series. The configure script identifies the package as
      I2util and points bug reports to the OWAMP/Internet2 side of the ecosystem.
  related-projects:
    - >
      Related projects include perfSONAR, BWCTL, OWAMP, Internet2's historical
      measurement tools, UCAR volsh, and the perfSONAR unibuild packaging system.
  sources:
    - https://formulae.brew.sh/formula/i2util
    - https://github.com/perfsonar/i2util
    - https://raw.githubusercontent.com/perfsonar/i2util/master/I2util/I2util/ChangeLog
    - https://raw.githubusercontent.com/perfsonar/i2util/master/I2util/I2util/README.md
    - https://raw.githubusercontent.com/perfsonar/i2util/master/I2util/I2util/configure.ac
  summary:
    - >
      i2util is an Internet2 and perfSONAR utility library and tool package. It provides
      common C support code for command-line parsing, error logging, threading, random
      numbers, hash tables, address handling, passphrase/key-file helpers, and the
      aespasswd and pfstore executables.
  timeline:
    - >
      2002: I2util was imported from volsh-derived utility code and began as a reusable
      library.
    - '2003: aespasswd support was added for managing key files.'
    - >
      2007: ChangeLog entries describe making I2util a standalone installable library
      for BWCTL and OWAMP packaging.
    - '2015: The perfSONAR GitHub repository was created.'
    - '2026: Homebrew tracked the v5.2.5 source tag.'
  usage:
    - >
      Developers use i2util as a support library inside measurement tools. Operators
      encounter it through helper commands, especially aespasswd for managing key files
      and pfstore for passphrase storage workflows used by related Internet2 software.
    - >
      The package is not a general-purpose end-user network tool; it is infrastructure
      glue for the perfSONAR and Internet2 family.
related-packages:
  - id: brew:owamp
    reason: >
      Install OWAMP for the one-way and two-way active-measurement workflow that i2util
      was built to support; OWAMP supplies the measurement daemons and clients while
      i2util provides shared utility infrastructure.
    rel: adjacent_workflow
    sources:
      - https://github.com/perfsonar/i2util
      - https://github.com/perfsonar/owamp
category: networking
package-manager:
  apk: i2util
  brew: i2util
  ubuntu: i2util-tools
package-manager-url: https://formulae.brew.sh/formula/i2util
license: Apache-2.0
tags:
  - cli
  - internet2
  - network-measurement
  - perfsonar
description: Internet2 utility tools
executables:
  - aespasswd
  - pfstore
provenance:
  formula: i2util
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
