id: brew:mp3wrap
display-name: Mp3Wrap
homepage: https://mp3wrap.sourceforge.net/
repo: https://sourceforge.net/p/mp3wrap/code
docs:
  - https://mp3wrap.sourceforge.net/faq.html
  - https://mp3wrap.sourceforge.net/man.html
  - https://mp3wrap.sourceforge.net/mp3wrap-format.html
config-file-location:
  linux:
    - ~/.mp3wrap
    - .mp3wrap
credentials-file-location: null
history:
  project-history:
    - >
      The program's format and workflow are tied to mp3splt. A wrapped file is
      conventionally named with an MP3WRAP marker, carries ID3v2 information used by
      split tools, and can be restored into original tracks with mp3splt's wrap mode.
      Mp3Wrap also supports listing the contents of a wrapped file, appending files to
      an existing archive, and embedding non-MP3 side files such as playlists, text
      notes, or cover images.
  sources:
    - https://formulae.brew.sh/formula/mp3wrap
    - https://mp3splt.sourceforge.net/mp3splt_page/about.php
    - https://mp3wrap.sourceforge.net/
    - https://mp3wrap.sourceforge.net/faq.html
    - https://mp3wrap.sourceforge.net/man.html
  summary:
    - >
      Mp3Wrap is a command-line MP3 packing utility written by Matteo Trotta. Its
      homepage describes it as a free, open-source alternative to AlbumWrap: it joins
      two or more MP3 files into one playable MP3 without decoding or re-encoding, while
      preserving enough filename and index information for extraction.
  usage:
    - >
      Its package-manager role is historical but clear: it represents an early-2000s way
      to distribute album-length MP3 bundles as a single download while keeping track
      boundaries recoverable. That use case overlaps with AlbumWrap and archive-based
      distribution habits, but Mp3Wrap remains useful when encountering old MP3WRAP
      albums or creating compatible bundles for mp3splt.
related-packages:
  - id: brew:mp3splt
    reason: >
      mp3splt is Mp3Wrap's officially documented extraction companion, using wrap mode
      to list or restore the indexed original tracks.
    rel: adjacent_workflow
    sources:
      - https://mp3wrap.sourceforge.net/faq.html
      - https://mp3splt.sourceforge.net/mp3splt_page/documentation/man.html
category: media
package-manager:
  brew: mp3wrap
  debian: mp3wrap
  macports: mp3wrap
  ubuntu: mp3wrap
package-manager-url: https://formulae.brew.sh/formula/mp3wrap
license: LGPL-2.0-or-later
tags:
  - albumwrap
  - audio
  - cli
  - mp3
  - wrapping
description: Wrap two or more mp3 files in a single large file
executables:
  - mp3wrap
provenance:
  formula: mp3wrap
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
