id: brew:macchanger
display-name: macchanger
homepage: https://github.com/shilch/macchanger
repo: https://github.com/shilch/macchanger
docs:
  - https://github.com/shilch/macchanger#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README presents Homebrew as the easiest installation route, giving
      the utility a standard package-manager path for macOS users while retaining a
      simple make-based source installation.
  package-nerd-significance:
    - >
      For macOS package users, this is a narrowly scoped native utility that exposes
      MAC-address changes through a familiar Unix-style command rather than a larger
      networking suite.
  project-history:
    - >
      The official GitHub repository began in June 2016 as a macOS-focused MAC address
      changer. Its compact release history runs from v0.1.0 to v0.2.1, with the later
      code updated for macOS Sonoma 14.4 and newer.
  sources:
    - https://github.com/shilch/macchanger#readme
    - https://github.com/shilch/macchanger/commits/master/
    - https://github.com/shilch/macchanger/tags
  summary:
    - >
      macchanger is a small Objective-C command-line utility for spoofing, displaying,
      and restoring a network interface's MAC address on macOS.
  timeline:
    - '2016: The public repository and v0.1.0 release appear.'
    - '2025: v0.2.1 is released after updates for modern macOS releases.'
  usage:
    - >
      Users run macchanger with elevated privileges and a network device. It can assign
      a random address, set a specific address, restore the permanent address, or
      display the current address.
related-packages:
  - id: cask:wifispoof
    reason: >
      Choose WiFiSpoof when you want a graphical macOS app with per-network rules, timed
      randomization, vendor lookup, and history; choose macchanger for a small
      open-source command-line workflow.
    rel: alternative
    sources:
      - https://github.com/shilch/macchanger#readme
      - https://wifispoof.com/
category: networking
package-manager:
  apk: macchanger
  brew: macchanger
  debian: macchanger
  dnf: macchanger
  macports: macchanger
  nix: macchanger
  pacman: macchanger
  ubuntu: macchanger
  zypper: macchanger
package-manager-url: https://formulae.brew.sh/formula/macchanger
license: GPL-2.0-only
tags:
  - cli
  - mac-address
  - macos
  - network-interface
  - privacy
description: Change your mac address, for macOS
executables:
  - macchanger
provenance:
  formula: macchanger
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
