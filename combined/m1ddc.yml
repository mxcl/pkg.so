id: brew:m1ddc
display-name: m1ddc
homepage: https://github.com/waydabber/m1ddc
repo: https://github.com/waydabber/m1ddc
docs:
  - https://github.com/waydabber/m1ddc#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      m1ddc filled a narrow but real gap for early Apple Silicon users: external monitor
      brightness, contrast, volume, input, and PIP/PBP controls were useful from scripts
      even when GUI display tools were heavier than needed.
    - >
      The repository has hundreds of stars and dozens of forks, and the supplied package
      facts show Homebrew, MacPorts, and Nix packaging.
  package-nerd-significance:
    - >
      m1ddc is package-nerd interesting because it is a small native Mac
      hardware-control binary whose value comes from making a platform quirk scriptable
      rather than from broad cross-platform scope.
    - >
      The formula is also a good example of packaging a niche Apple Silicon command-line
      tool before the functionality is fully absorbed into larger display-management
      applications.
  project-history:
    - >
      The project was created in 2021 by the developer behind BetterDisplay-era Mac
      display tools. Its README positions it as a small scriptable utility and points
      users who need a more advanced CLI to BetterDisplay.
    - >
      Upstream releases were explicitly framed around Homebrew distribution. Version
      1.0.0 was the initial Homebrew-oriented release in January 2023; later releases
      added M2 support, community improvements, and enhanced display identification.
  related-projects:
    - >
      BetterDisplay is the upstream-recommended advanced alternative for broader Mac DDC
      control.
    - >
      Homebrew, MacPorts, and Nix package m1ddc according to the supplied
      package-manager facts.
  sources:
    - https://api.github.com/repos/waydabber/m1ddc
    - https://github.com/waydabber/m1ddc
    - https://github.com/waydabber/m1ddc/releases
    - source_facts.package-manager
  summary:
    - >
      m1ddc is a small command-line utility for controlling external displays over
      DDC/CI on Apple Silicon Macs connected through USB-C or DisplayPort Alt Mode.
  timeline:
    - '2021: Public GitHub repository created'
    - '2023: v1.0.0 initial Homebrew distribution release'
    - '2023: v1.1.0 added community improvements and M2 support'
    - '2024: v1.2.0 added enhanced display identification support'
  usage:
    - >
      Users build it with `make` or install it through a package manager, then run
      `m1ddc [options]`. The README documents examples such as setting contrast, reading
      luminance, changing volume, listing displays, and selecting displays by number or
      UUID.
    - >
      The README warns that the tool does not support Intel Macs or the built-in HDMI
      port of M1 and entry-level M2 Macs, so package users need hardware-specific
      expectations.
related-packages:
  - id: cask:betterdisplay
    reason: >
      Choose BetterDisplay for a broader DDC CLI covering more Macs and connection types
      plus display scaling and automation; its official documentation explicitly
      presents direct DDC access as an m1ddc alternative, though it requires the app
      process to run.
    rel: alternative
    sources:
      - https://github.com/waydabber/m1ddc#readme
      - https://github.com/waydabber/BetterDisplay/wiki/Integration-features%2C-CLI
  - id: cask:hammerspoon
    reason: >
      Use Hammerspoon to bind m1ddc commands to keyboard media keys or larger Lua
      automations; the official m1ddc README links a concrete Hammerspoon integration
      example.
    rel: adjacent_workflow
    sources:
      - https://github.com/waydabber/m1ddc#readme
      - https://www.hammerspoon.org/docs/
category: system
package-manager:
  brew: m1ddc
  macports: m1ddc
  nix: m1ddc
package-manager-url: https://formulae.brew.sh/formula/m1ddc
license: MIT
tags:
  - apple-silicon
  - cli
  - ddc-ci
  - display-control
  - macos
description: Control external displays (USB-C/DisplayPort Alt Mode) using DDC/CI on M1 Macs
executables:
  - m1ddc
provenance:
  formula: m1ddc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
