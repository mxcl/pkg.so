id: brew:hyperestraier
display-name: Hyper Estraier
homepage: https://dbmx.net/hyperestraier/
repo: null
docs:
  - https://dbmx.net/hyperestraier
  - https://dbmx.net/hyperestraier/cguide-en.html
  - https://dbmx.net/hyperestraier/intro-en.html
  - https://dbmx.net/hyperestraier/nguide-en.html
  - https://dbmx.net/hyperestraier/pguide-en.html
  - https://dbmx.net/hyperestraier/uguide-en.html
config-file-location:
  unix:
    - $CGI_DIRECTORY/estseek.conf
    - $ESTMASTER_ROOT/_conf
credentials-file-location:
  unix: $ESTMASTER_ROOT/_user
history:
  adoption-history:
    - >
      The project was useful in an era when small sites, mail archives, local file
      servers, and community portals often needed self-hosted search before hosted
      search APIs became routine. Homebrew, Fedora, and MacPorts package metadata keep
      it installable for users maintaining legacy search stacks or old integrations.
  package-nerd-significance:
    - >
      Hyper Estraier is package-nerd archaeology in the best sense: a compact,
      source-distributed Unix search system with many small executables, CGI support, C
      APIs, language bindings, and P2P ambitions. It is a snapshot of how self-hosted
      search was packaged before Lucene-derived stacks dominated most new deployments.
  project-history:
    - >
      The official site carries a 2004-2007 copyright notice and presents Hyper Estraier
      as a full-text search system for communities. It was distributed as source
      packages with manuals for introduction, user operation, programming, node
      operation, crawler use, and P2P operation.
    - >
      Hyper Estraier followed Estraier and QDBM-era search tooling from the same
      authorial ecosystem. Its feature list reflects mid-2000s search-engine concerns:
      N-gram recall, optional morphological analysis, phrase and regular-expression
      search, attribute search, similarity search, repository-independent indexing, and
      multilingual Unicode handling.
  related-projects:
    - >
      Hyper Estraier is related to Estraier, QDBM, Hyper Estraier Encore, local CGI
      search systems, and Japanese Unix full-text-search tooling.
  sources:
    - https://dbmx.net/hyperestraier
    - https://dbmx.net/hyperestraier/nguide-en.html
    - https://dbmx.net/hyperestraier/pguide-en.html
    - https://dbmx.net/hyperestraier/uguide-en.html
    - https://formulae.brew.sh/formula/hyperestraier
    - https://github.com/fumiyas/hyperestraier-encore
  summary:
    - >
      Hyper Estraier is Mikio Hirabayashi's LGPL full-text search system for building
      local, site, and community search indexes, with command-line tools, a crawler,
      APIs, Unicode support, and a documented P2P search architecture.
  timeline:
    - '2004: Hyper Estraier copyright period begins on the official site.'
    - '2007: The official English site lists version 1.4.13 and a March 2007 page update.'
    - '2010: Hyper Estraier Encore forked version 1.4.13 for continued maintenance experiments.'
  usage:
    - >
      The user guide centers on building an index with `estcmd` and searching through
      either command-line administration or the `estsearch.cgi` web interface. The wider
      toolset includes crawler and node-management commands such as `estwaver` and
      `estmaster`.
related-packages: []
category: data
package-manager:
  brew: hyperestraier
  dnf: hyperestraier
  macports: hyperestraier
package-manager-url: https://formulae.brew.sh/formula/hyperestraier
license: LGPL-2.1-or-later
tags:
