id: brew:mklittlefs
display-name: mklittlefs
homepage: https://github.com/earlephilhower/mklittlefs
repo: https://github.com/earlephilhower/mklittlefs
docs:
  - https://github.com/earlephilhower/mklittlefs#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool's ecosystem role comes from Arduino, ESP8266, ESP32, and RP2040 workflows
      where a sketch uses a flash filesystem and a host-side tool must turn a local data
      directory into the binary image uploaded to the board. The README warns that
      LittleFS build-time options such as LFS_NAME_MAX affect image compatibility, so
      mklittlefs and the target firmware need matching settings. Related Arduino upload
      tooling from the same maintainer uses LittleFS filesystems for Arduino-Pico
      RP2040/RP2350, ESP8266, and ESP32 cores, while PlatformIO packages the tool as
      tool-mklittlefs.
  sources:
    - https://api.github.com/repos/earlephilhower/mklittlefs
    - https://formulae.brew.sh/api/formula/mklittlefs.json
    - https://github.com/earlephilhower/arduino-littlefs-upload
    - https://github.com/earlephilhower/mklittlefs
    - https://raw.githubusercontent.com/earlephilhower/mklittlefs/master/README.md
    - https://registry.platformio.org/tools/platformio/tool-mklittlefs
  summary:
    - >
      mklittlefs is earlephilhower's C++ utility for creating, listing, and unpacking
      LittleFS filesystem images for small embedded boards. The repository was created
      in 2018, and the README says the tool builds and unpacks LittleFS images and is
      based on Ivan Grokhotkov's mkspiffs. Its command-line interface accepts create,
      unpack, list, and image-info modes along with filesystem size, page size, block
      size, and debug options.
  usage:
    - >
      Homebrew packages mklittlefs as a standalone executable with no runtime
      dependencies, making it convenient for macOS users building embedded images
      outside an IDE. Compared with mkspiffs, its niche is the LittleFS format rather
      than SPIFFS.
related-packages:
  - id: brew:platformio
    reason: >
      PlatformIO can select LittleFS in `platformio.ini`, build a project's data
      directory into a filesystem image, and upload it with the `uploadfs` target using
      its packaged mklittlefs tooling.
    rel: adjacent_workflow
    sources:
      - https://registry.platformio.org/tools/platformio/tool-mklittlefs
      - https://docs.platformio.org/en/latest/platforms/espressif8266.html
category: developer-tools
package-manager:
  brew: mklittlefs
  nix: mklittlefs
package-manager-url: https://formulae.brew.sh/formula/mklittlefs
