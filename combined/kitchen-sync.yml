id: brew:kitchen-sync
display-name: Kitchen Sync
homepage: https://github.com/willbryant/kitchen_sync
repo: https://github.com/willbryant/kitchen_sync
docs:
  - https://github.com/willbryant/kitchen_sync#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kitchen Sync has a modest but concrete package footprint, with the input facts
      listing Homebrew, Chocolatey, and Nix packaging. That distribution profile fits an
      operations-oriented CLI used by developers and database teams rather than a broad
      framework community.
  package-nerd-significance:
    - >
      Kitchen Sync is interesting as a small systems package because it addresses a dull
      but costly workflow: refreshing large database copies without the time, write
      amplification, and downtime of full dump-and-load cycles.
  project-history:
    - >
      The repository README frames Kitchen Sync around fast logical synchronization for
      developer, test, remote-office, and cross-database copy workflows. It supports
      MySQL-family databases and PostgreSQL, can work over SSH, can synchronize only
      changed data, and can filter sensitive columns as data is copied.
  related-projects:
    - >
      Kitchen Sync is related by use case to database dump/restore tooling, logical
      replication workflows, SSH tunneling, MySQL, MariaDB, Percona Server, and
      PostgreSQL.
  sources:
    - https://api.github.com/repos/willbryant/kitchen_sync/releases?per_page=100
    - https://formulae.brew.sh/formula/kitchen-sync
    - https://github.com/willbryant/kitchen_sync
    - https://github.com/willbryant/kitchen_sync/releases
  summary:
    - >
      Kitchen Sync is a command-line database synchronization tool focused on making or
      updating a unidirectional database copy without dumping and reloading the entire
      source.
  timeline:
    - '2020-03-14: GitHub release candidates 2.0rc1 through 2.0rc3 were published.'
    - '2023-10-29: GitHub release v2.19 was published.'
    - '2023-10-30: GitHub release v2.20 was published.'
    - '2025-04-15: GitHub release v2.21 was published.'
  usage:
    - >
      Users run `ks` with source and target database URLs, optional filters, and worker
      settings to update a target database. The README example shows cross-engine
      synchronization from MySQL to PostgreSQL with a filtering file.
related-packages:
  - id: brew:mysql
    reason: >
      Kitchen Sync directly supports MySQL as a source or target, so the MySQL server
      and client tools form one of its primary documented synchronization workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/willbryant/kitchen_sync#readme
      - https://dev.mysql.com/doc/
  - id: brew:postgresql@18
    reason: >
      Kitchen Sync can synchronize to and from PostgreSQL, including the official
      cross-engine example that copies a MySQL database into PostgreSQL.
    rel: adjacent_workflow
    sources:
      - https://github.com/willbryant/kitchen_sync#readme
      - https://www.postgresql.org/docs/18/
category: data
package-manager:
  brew: kitchen-sync
  chocolatey: KS
  nix: ks
package-manager-url: https://formulae.brew.sh/formula/kitchen-sync
license: MIT
tags:
  - cli
  - database
  - mysql
  - postgresql
  - sync
description: Fast efficiently sync database without dumping & reloading
executables:
