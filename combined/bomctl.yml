id: brew:bomctl
display-name: bomctl
homepage: https://github.com/bomctl/bomctl
repo: https://github.com/bomctl/bomctl
docs:
  - https://github.com/bomctl/bomctl/tree/main/docs/architecture
  - https://github.com/bomctl/bomctl#readme
config-file-location: null
credentials-file-location:
  unix: ~/.netrc
history:
  adoption-history:
    - >
      The project documents installation through a Homebrew tap, container images on
      Docker Hub, and source builds, and the supplied package facts show availability
      through Homebrew, apk, and zypper.
  package-nerd-significance:
    - >
      bomctl is interesting to package and supply-chain users because it treats SBOMs as
      package-like artifacts that can be cached, transformed, pushed, and moved between
      SPDX, CycloneDX, and related ecosystems.
  project-history:
    - >
      The GitHub repository was created in January 2024. The README identifies bomctl as
      an OpenSSF Sandbox project under active development and says it builds on protobom
      for an SBOM-agnostic component graph.
  related-projects:
    - protobom, OpenSSF, SPDX, CycloneDX, GUAC, Sigstore
  sources:
    - https://api.github.com/repos/bomctl/bomctl
    - https://github.com/bomctl/bomctl#readme
    - https://github.com/bomctl/bomctl/tree/main/docs/architecture
  summary:
    - >
      bomctl is experimental, format-agnostic SBOM tooling intended to bridge the gap
      between SBOM generation and SBOM analysis tools.
  timeline:
    - '2024: GitHub repository created.'
    - '2024: v0.1.0-alpha appears in GitHub releases.'
    - '2025: v0.4.3 appears in GitHub releases.'
  usage:
    - >
      Users fetch, import, list, alias, merge, tag, export, and push SBOMs. bomctl
      stores SBOMs in a persistent cache and can fetch over HTTPS, OCI, Git, GitHub, and
      GitLab.
related-packages:
  - id: brew:bom
    reason: >
      Choose Kubernetes bom when the primary job is generating, viewing, and
      transforming SPDX SBOMs from files, directories, archives, images, or Go
      dependencies; choose bomctl for format-neutral caching and multi-document
      workflows.
    rel: alternative
    sources:
      - https://github.com/bomctl/bomctl#similar-projects
      - https://kubernetes-sigs.github.io/bom/
category: security
package-manager:
  apk: bomctl
  brew: bomctl
  zypper: bomctl
package-manager-url: https://formulae.brew.sh/formula/bomctl
license: Apache-2.0
tags:
  - cli
  - cyclonedx
  - openssf
  - sbom
  - spdx
  - supply-chain-security
description: Format-agnostic SBOM tooling for the stages between SBOM generation and analysis
executables:
  - bomctl
provenance:
  formula: bomctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
