id: brew:clang-include-graph
display-name: clang-include-graph
homepage: https://github.com/bkryza/clang-include-graph
repo: https://github.com/bkryza/clang-include-graph
docs:
  - https://github.com/bkryza/clang-include-graph#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages clang-include-graph from GitHub release archives and ships
      bottles for macOS and Linux. Homebrew analytics showed 412 installs over the prior
      365 days for the formula, indicating niche but real command-line distribution.
  package-nerd-significance:
    - >
      For package-manager users it is a compact example of a modern LLVM-dependent C++
      analysis CLI: the formula tracks tagged GitHub tarballs, depends on boost and
      llvm, and exists primarily to make source-tree architecture inspection scriptable.
  project-history:
    - >
      The public GitHub repository was created in 2022 and the first GitHub release was
      tagged as 0.1.1 in July 2022. The README positions the project as a simple
      include-graph analyzer built around LLVM/Clang compilation database inputs.
    - >
      The project stayed narrow by design: its documented feature set is include-tree
      printing, reverse trees, topological order, cycle listing, dependant lookup, and
      graph export rather than a broader static-analysis platform.
  related-projects:
    - >
      The project is closely related to clang-uml, another bkryza Clang-based
      diagramming tool, but clang-include-graph focuses only on include relationships.
    - >
      It also relies on the Clang JSON compilation database convention used by CMake,
      Bear, and other C/C++ build tooling.
  sources:
    - https://github.com/bkryza/clang-include-graph#readme
    - https://api.github.com/repos/bkryza/clang-include-graph
    - https://api.github.com/repos/bkryza/clang-include-graph/releases
    - https://formulae.brew.sh/api/formula/clang-include-graph.json
  summary:
    - >
      clang-include-graph is a small Clang-based command-line tool for inspecting C and
      C++ include relationships and exporting those relationships as textual, JSON,
      Graphviz, GraphML, or PlantUML output.
  timeline:
    - '2022: GitHub repository created.'
    - '2022: Initial GitHub release 0.1.1 published.'
    - '2025: Release 0.2.0 published and packaged by Homebrew as the stable version.'
  usage:
    - >
      The tool expects a compile_commands.json database or compile_flags.txt, then lets
      users select translation units and choose output formats such as JSON, Graphviz,
      GraphML, PlantUML, tree views, cycles, or dependency queries.
related-packages:
  - id: brew:clang-uml
    reason: >
      clang-uml is a broader Clang-based alternative when include diagrams must sit
      alongside generated class, sequence, and package diagrams.
    rel: alternative
    sources:
      - https://github.com/bkryza/clang-include-graph#readme
      - https://clang-uml.github.io/
  - id: brew:cmake
    reason: >
      CMake can generate the `compile_commands.json` database that clang-include-graph
      requires when using Makefile or Ninja generators.
    rel: adjacent_workflow
    sources:
      - https://github.com/bkryza/clang-include-graph#readme
      - https://cmake.org/cmake/help/latest/variable/CMAKE_EXPORT_COMPILE_COMMANDS.html
  - id: brew:bear
    reason: >
      Bear records compiler invocations into `compile_commands.json`, supplying
      clang-include-graph's required input for Make, Autotools, and custom-script builds
      that cannot export it themselves.
    rel: adjacent_workflow
    sources:
      - https://github.com/bkryza/clang-include-graph#readme
      - https://github.com/rizsotto/Bear#readme
  - id: brew:plantuml
    reason: >
      clang-include-graph can emit PlantUML source, which PlantUML can render into
      visual diagram artifacts.
    rel: adjacent_workflow
    sources:
      - https://github.com/bkryza/clang-include-graph#readme
      - https://plantuml.com/starting
category: developer-tools
package-manager:
  brew: clang-include-graph
package-manager-url: https://formulae.brew.sh/formula/clang-include-graph
license: Apache-2.0
tags:
  - clang
  - cli
  - code-analysis
  - cpp
  - graphml
  - graphviz
  - include-graph
  - json
  - plantuml
description: Simple tool for visualizing and analyzing C/C++ project include graph
executables:
  - clang-include-graph
provenance:
  formula: clang-include-graph
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
