id: brew:kin
display-name: Kin
homepage: https://github.com/Serchinastico/Kin
repo: https://github.com/Serchinastico/Kin
docs:
  - https://github.com/Serchinastico/Kin#readme
config-file-location:
  macos: '*.xcodeproj/project.pbxproj'
credentials-file-location: null
history:
  adoption-history:
    - >
      Kin's adoption is narrow but real: the GitHub repository showed about 1.1k stars,
      Homebrew installation is documented in the README, and the package is available as
      a Homebrew formula in this batch.
    - >
      The README also names flycheck-pbxproj as an editor integration, showing that
      Kin's parser work became useful beyond one direct CLI invocation.
  package-nerd-significance:
    - >
      Kin is package-nerd interesting because it turns an opaque Apple project-file
      grammar into a tiny reproducible CLI check. It is not a broad developer platform,
      but it solves one painful file-format failure mode in a scriptable way.
    - >
      The package also shows why Homebrew carries niche tools: if a project.pbxproj
      merge breaks a build, a small parser utility can save more time than a much larger
      IDE plugin.
  project-history:
    - >
      Kin was built as a minimal parser-backed checker rather than a full Xcode project
      editor. The project uses ANTLR 4 to generate the pbxproj parser and keeps a thin
      command-line layer around that grammar.
    - >
      The repository's license block is dated 2023, and GitHub listed 30 releases with
      version 2.1.14 published on 2025-05-08. That points to a maintained niche tool
      rather than a one-off gist.
  related-projects:
    - ANTLR 4 is the parser generator used by Kin.
    - Xcode project.pbxproj files are the target file format.
    - flycheck-pbxproj is the Emacs integration named by the README.
  sources:
    - https://github.com/Serchinastico/Kin
  summary:
    - >
      Kin is a small command-line syntax checker for Xcode project.pbxproj files. Its
      README frames the tool around a familiar iOS/macOS team problem: broken Xcode
      projects after merges.
  timeline:
    - '2023: The repository license block credits Serchinastico.'
    - '2025: GitHub listed Kin 2.1.14 as a release dated 2025-05-08.'
    - '2026: The README documented pipx, easy_install, and Homebrew installation paths.'
  usage:
    - >
      Users run kin from an Xcode project directory and let it auto-detect
      project.pbxproj, or pass a project.pbxproj path explicitly. A successful parse
      prints CORRECT; parse failures return a line and grammar error.
    - >
      It is most useful in pre-commit hooks, CI checks, and merge-conflict recovery for
      teams that store Xcode project files in Git.
related-packages:
  - id: brew:xcodegen
    reason: >
      Use XcodeGen to generate an .xcodeproj from a reviewable YAML or JSON
      specification, then use Kin to syntax-check the generated project.pbxproj when
      validating an Xcode-project pipeline.
    rel: adjacent_workflow
    sources:
      - https://github.com/Serchinastico/Kin
      - https://yonaskolb.github.io/XcodeGen/
category: developer-tools
package-manager:
  brew: kin
package-manager-url: https://formulae.brew.sh/formula/kin
license: Apache-2.0
tags:
  - antlr
  - cli
  - pbxproj
  - syntax-checker
  - xcode
description: Sane PBXProj files
executables:
  - kin
provenance:
  formula: kin
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
