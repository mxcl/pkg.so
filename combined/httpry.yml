id: brew:httpry
display-name: httpry
homepage: https://github.com/jbittel/httpry
repo: https://github.com/jbittel/httpry
docs:
  - https://github.com/jbittel/httpry
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      httpry fits the era when cleartext HTTP packet inspection was a normal operational
      task. The batch input records packages for Homebrew, Alpine, Debian, Fedora, and
      Ubuntu, keeping it available as a small specialist alternative to larger
      packet-analysis suites.
  package-nerd-significance:
    - >
      httpry is notable because it packages the useful middle ground between tcpdump's
      packet stream and Wireshark's full GUI analysis: scriptable HTTP metadata
      extraction with libpcap-era Unix ergonomics.
  project-history:
    - >
      The in-repository documentation identifies httpry as Jason Bittel's HTTP logging
      tool and gives a 2005-2014 copyright range. Git tags show release 0.0.6 tagged in
      October 2005 and release 0.1.8 tagged in June 2014.
    - >
      The documentation emphasizes adaptability: httpry can run live, run as a daemon,
      read pcap files, write parsed packet data, customize output fields, filter HTTP
      methods, and feed included Perl scripts for later log processing.
  related-projects:
    - >
      Related tools include tcpdump, libpcap, ngrep, Wireshark, tshark, and HTTP
      log-processing scripts.
  sources:
    - https://api.github.com/repos/jbittel/httpry
    - https://api.github.com/repos/jbittel/httpry/tags
    - https://github.com/jbittel/httpry
    - https://raw.githubusercontent.com/jbittel/httpry/master/doc/README
    - https://raw.githubusercontent.com/jbittel/httpry/master/httpry.1
  summary:
    - >
      httpry is a lightweight HTTP logging and information retrieval tool built around
      packet capture. It displays or logs parsed HTTP request and response metadata
      rather than doing higher-level analysis itself.
  timeline:
    - '2005: Release tag httpry-0.0.6 was created.'
    - '2011: The public GitHub repository was created.'
    - '2014: Release tag httpry-0.1.8 was created.'
  usage:
    - >
      Typical use is to watch or log HTTP traffic on a network interface, optionally
      with BPF-style filters such as `tcp port 80 or 8080`, or to parse an existing
      capture file. Its rate-statistics mode can display active hosts by HTTP requests
      per second.
related-packages:
  - id: brew:tcpdump
    reason: >
      tcpdump can capture broadly filtered traffic into pcap files that httpry
      subsequently parses for focused HTTP request and response metadata.
    rel: adjacent_workflow
    sources:
      - https://github.com/jbittel/httpry#readme
      - https://www.tcpdump.org/manpages/tcpdump.1.html
  - id: brew:wireshark
    reason: >
      Choose Wireshark when full interactive protocol dissection and packet reassembly
      are needed; choose httpry for lightweight terminal logging of selected HTTP
      fields.
    rel: alternative
    sources:
      - https://github.com/jbittel/httpry#readme
      - https://www.wireshark.org/docs/wsug_html_chunked/ChapterIntroduction.html
category: networking
package-manager:
  apk: httpry
  brew: httpry
  debian: httpry
  dnf: httpry
  ubuntu: httpry
package-manager-url: https://formulae.brew.sh/formula/httpry
license: GPL-2.0-only
tags:
  - cli
  - http
  - libpcap
  - network-monitoring
  - packet-sniffer
  - traffic-logging
description: Packet sniffer for displaying and logging HTTP traffic
executables:
  - httpry
provenance:
  formula: httpry
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
