id: brew:crip
display-name: crip
homepage: https://github.com/Hakky54/certificate-ripper
repo: https://github.com/Hakky54/certificate-ripper
docs:
  - https://github.com/Hakky54/certificate-ripper#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions cover GitHub releases, Homebrew, the
      maintainer's Homebrew tap, and Debian/Ubuntu packaging, with additional community
      packaging for AUR, Nix, Chocolatey, and Scoop. That makes crip notable less for
      ecosystem size than for broad binary packaging of a narrowly scoped certificate
      workflow.
  package-nerd-significance:
    - >
      For package indexes, crip is a compact example of a JVM project distributed as
      native executables as well as a fat JAR, which reduces the usual Java runtime
      friction for a CLI security tool.
  project-history:
    - >
      Certificate Ripper appeared as a Java/GraalVM-oriented CLI project in 2021. The
      official README positions it as a no-OpenSSL certificate extraction tool with
      native executables in releases and support for HTTPS, WebSocket, mail, FTP, and
      database TLS endpoints.
  related-projects:
    - GraalVM Native Image is used by the documented native executable build path.
    - >
      OpenSSL is an implicit comparison point because the README highlights that crip
      does not require it.
  sources:
    - https://github.com/Hakky54/certificate-ripper#readme
    - https://github.com/Hakky54/certificate-ripper/releases/tag/0.0.1
    - https://github.com/Hakky54/certificate-ripper/releases/tag/1.0.0
    - https://github.com/Hakky54/certificate-ripper/releases/tag/2.0.0
  summary:
    - >
      crip is the command-line executable for Certificate Ripper, a small security
      utility for extracting server certificate chains and exporting them in formats
      useful to TLS and Java truststore workflows.
  timeline:
    - '2021: Repository created and first public release 0.0.1 published.'
    - '2021: 1.0.0 release published after early 0.x releases.'
    - '2022: 2.0.0 release line published.'
  usage:
    - >
      Common usage is printing or exporting remote server certificates as human-readable
      output, PEM, DER, JKS, or PKCS12, including bulk extraction from multiple URLs and
      proxy-aware operation.
related-packages:
  - id: brew:openssl@3
    reason: >
      Choose OpenSSL when you need a general-purpose TLS and cryptography toolkit;
      choose Certificate Ripper for focused cross-platform certificate-chain extraction
      and direct PEM, DER, JKS, or PKCS12 export.
    rel: alternative
    sources:
      - https://github.com/Hakky54/certificate-ripper#readme
      - https://docs.openssl.org/3.0/man1/openssl-s_client/
category: security
package-manager:
  brew: crip
  debian: crip
  nix: crip
  scoop: extras/crip
  ubuntu: crip
package-manager-url: https://formulae.brew.sh/formula/crip
license: Apache-2.0
tags:
  - certificates
  - cli
  - security
  - tls
description: Tool to extract server certificates
executables:
  - crip
provenance:
  formula: crip
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
