id: brew:ddcctl
display-name: ddcctl
homepage: https://github.com/kfix/ddcctl
repo: https://github.com/kfix/ddcctl
docs:
  - https://github.com/kfix/ddcctl#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ddcctl found a durable packaging niche because macOS users with external monitors
      often wanted scriptable brightness and input control. The README documents
      Homebrew installation first, followed by release binaries and building from
      source.
  package-nerd-significance:
    - >
      For package nerds, ddcctl is the kind of hardware-adjacent CLI that earns a
      formula because it bridges a small OS capability gap. It is tiny,
      platform-specific, and useful precisely because it makes display controls
      scriptable.
  project-history:
    - >
      The GitHub repository was created in August 2014. Its README says ddcctl.m sprang
      from a TonyMac-x86 forum thread and that DDC.c originated from
      jontaylor/DDC-CI-Tools-for-OS-X before being reworked by others.
  related-projects:
    - DDC-CI-Tools-for-OS-X, ddccontrol, monitorcontrol
  sources:
    - https://github.com/kfix/ddcctl
    - https://github.com/kfix/ddcctl#readme
    - https://github.com/kfix/ddcctl/releases/tag/v0
    - https://github.com/kfix/ddcctl/releases/tag/v1
    - https://api.github.com/repos/kfix/ddcctl
  summary:
    - >
      ddcctl is a macOS command-line utility for sending DDC monitor control commands,
      mainly brightness and contrast, to external displays. The README describes it as a
      personal GPLv3 utility in maintenance mode rather than a broad support forum.
  timeline:
    - '2014: GitHub repository created'
    - '2021: v0 release published'
    - '2022: v1 release published'
  usage:
    - >
      Users run ddcctl from the shell to adjust display controls such as brightness,
      contrast, input source, volume, RGB values, and presets when the monitor firmware
      supports them. The README also points to an example script for controlling two
      monitors from a Mac mini.
related-packages:
  - id: brew:ddcutil
    reason: >
      Choose ddcutil for the same scriptable DDC/CI monitor-control task on Linux;
      unlike macOS-focused ddcctl, it uses Linux I2C devices and also provides
      libddcutil.
    rel: alternative
    sources:
      - https://github.com/kfix/ddcctl#readme
      - https://www.ddcutil.com/
category: system
package-manager:
  brew: ddcctl
  macports: ddcctl
package-manager-url: https://formulae.brew.sh/formula/ddcctl
license: GPL-3.0-only
tags:
  - brightness
  - cli
  - ddc
  - display-control
  - macos
  - monitor
description: DDC monitor controls (brightness) for Mac OSX command-line
executables:
  - ddcctl
provenance:
  formula: ddcctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
