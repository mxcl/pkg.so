id: brew:domain-check
display-name: domain-check
homepage: https://github.com/saidutt46/domain-check
repo: https://github.com/saidutt46/domain-check
docs:
  - https://github.com/saidutt46/domain-check#readme
config-file-location:
  unix:
    - ./domain-check.toml
    - ~/.domain-check.toml
    - ~/.config/domain-check/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README advertises installation through Homebrew, Cargo, and GitHub releases,
      while crates.io shows the CLI crate published shortly after the repository was
      created. By March 2026 the GitHub release stream had reached 1.0.2.
  package-nerd-significance:
    - >
      domain-check is notable as a small modern Rust CLI that packages one engine three
      ways: terminal command, Rust library, and MCP server. That makes it a clean
      example of a package adapting an old internet task, domain availability checking,
      to current automation and AI-agent workflows.
  project-history:
    - >
      The project appeared publicly in April 2025 and describes itself as a universal
      domain exploration engine. Its README emphasizes the combination of CLI, Rust
      library, and MCP server outputs, making it a newer tool shaped by both traditional
      domain search workflows and AI-agent integration.
  related-projects:
    - >
      Related projects and systems include RDAP, WHOIS, IANA TLD bootstrap data,
      crates.io, Homebrew, and MCP clients such as Claude, Codex, Gemini, Cursor, and VS
      Code Copilot as listed by the README.
  sources:
    - https://github.com/saidutt46/domain-check#readme
    - https://api.github.com/repos/saidutt46/domain-check
    - https://api.github.com/repos/saidutt46/domain-check/releases
    - https://crates.io/api/v1/crates/domain-check
    - https://formulae.brew.sh/formula/domain-check
  summary:
    - >
      domain-check is a Rust command-line domain availability checker that combines
      RDAP-first lookups, WHOIS fallback, TLD expansion, pattern generation, JSON/CSV
      output, and an MCP server built on the same engine.
  timeline:
    - '2025: The public GitHub repository and crates.io package are created.'
    - '2026: The project reaches 1.0.0.'
    - '2026: GitHub releases show 1.0.2 published in March.'
  usage:
    - >
      Typical usage checks a single domain, expands a base name across selected TLDs,
      applies startup or other presets, generates candidate names from patterns, or
      emits JSON and CSV for automation. The README also describes noninteractive flags
      for CI-style runs.
related-packages: []
category: networking
package-manager:
  brew: domain-check
  nix: domain-check
package-manager-url: https://formulae.brew.sh/formula/domain-check
license: Apache-2.0
tags:
  - cli
  - dns
  - domain-availability
  - rdap
  - whois
description: CLI tool for checking domain availability using RDAP and WHOIS protocols
executables:
  - domain-check
provenance:
  formula: domain-check
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
