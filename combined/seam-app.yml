history:
  adoption-history:
    - >
      Seam launched with built-in Homebrew cask support, giving Mac package-manager
      users a first-class installation path. Its official release history shows rapid
      iteration after launch across media control, calendars, focus tools,
      transcription, file drop zones, external-display behavior, and coding-agent
      status.
  package-nerd-significance:
    - >
      Seam is a representative modern Mac utility: narrowly integrated with macOS
      hardware and permissions, distributed as a cask, automatically updated, and
      designed to turn otherwise unused notch space into a configurable status and
      control surface.
  project-history:
    - >
      Seam began as a macOS notch utility that replaced or augmented system overlays and
      exposed device, battery, focus, and media information at the top of the screen.
      Its initial public release was documented in February 2026.
    - >
      Subsequent releases broadened it into a collection of lightweight productivity
      tools, adding richer voice transcription, focus music, calendar views, file drop
      zones, multi-display support, a floating island for displays without a notch, and
      status panels for coding agents.
  related-projects:
    - >
      Seam integrates with macOS Calendar, Bluetooth devices, media applications, and
      system Focus modes.
    - >
      Officially documented media integrations include Apple Music, Apple Podcasts,
      Spotify, Tidal, Amazon Music, and compatible browser playback.
    - The developer also publishes Wavenote for Mac.
  sources:
    - https://getseam.app/
    - https://getseam.app/changelog
    - https://getseam.app/faqs
    - https://getseam.app/features
  summary:
    - >
      Seam is a macOS productivity utility that places music controls, calendar
      information, focus tools, voice transcription, system indicators, and other
      glanceable activities in a notch-style surface.
  timeline:
    - >
      February 2026: Seam 1.0.0 was released with system HUDs, device and battery
      indicators, focus status, keyboard shortcuts, automatic updates, and Homebrew
      support.
    - >
      March 2026: The 1.2 series added Flow Music and continued expanding voice,
      calendar, and media features.
    - 'July 2026: Seam added a floating Island mode and expanded multi-display behavior.'
    - >
      August–September 2026: Releases added coding-agent usage panels and continued
      improving local voice transcription.
  usage:
    - >
      Users enable only the modules they need, then interact with Seam from the Mac's
      notch or a floating island. Typical uses include controlling playback, checking
      the next meeting, running a focus session, dictating text locally, monitoring
      devices, and receiving compact system or coding-agent status alerts.
