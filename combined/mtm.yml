id: brew:mtm
display-name: mtm
homepage: https://github.com/deadpixi/mtm
repo: https://github.com/deadpixi/mtm
docs:
  - https://github.com/deadpixi/mtm#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool occupies the minimalist end of the same niche as GNU Screen and tmux. It
      starts virtual terminals inside one terminal, lets the user split the screen
      horizontally or vertically, move focus with a prefix key and arrows, close panes,
      redraw, and scroll. The project avoids requiring a custom terminfo entry by
      advertising a long-established screen-compatible terminal type by default, while
      also shipping optional mtm terminfo entries for users who want them.
  sources:
    - https://fedoramagazine.org/4-cool-terminal-multiplexers/
    - https://formulae.brew.sh/formula/mtm
    - https://github.com/deadpixi/mtm
  summary:
    - >
      mtm, the Micro Terminal Multiplexer, is a deliberately tiny terminal multiplexer
      from the deadpixi/mtm project. Its README frames the project around four
      principles: few commands, broad compatibility through classic ANSI terminal
      emulation, a codebase of about one thousand lines, and a maintenance policy
      centered on bug fixes, translation/accessibility improvements, and keeping the
      program building on supported operating systems.
  usage:
    - >
      Package-manager adoption reflects that niche: mtm is useful in constrained or
      preference-driven environments where a user wants pane splitting without sessions,
      scripting layers, or a large command language. Homebrew, Alpine, MacPorts, and Nix
      package it as a single mtm executable, so it functions mainly as a lightweight
      alternative for users who find larger multiplexers excessive.
related-packages:
  - id: brew:tmux
    reason: >
      Choose tmux when you need detachable sessions, windows, panes, scripting, and
      extensive runtime configuration rather than mtm's deliberately tiny command set.
    rel: alternative
    sources:
      - https://github.com/deadpixi/mtm#readme
      - https://github.com/tmux/tmux
      - https://man.openbsd.org/tmux
  - id: brew:screen
    reason: >
      Choose GNU Screen when you need the classic detach-and-reattach session model and
      broad screenrc customization instead of mtm's pane-focused minimalism.
    rel: alternative
    sources:
      - https://github.com/deadpixi/mtm#readme
      - https://www.gnu.org/software/screen/
      - https://www.gnu.org/software/screen/manual/
category: system
package-manager:
  apk: mtm
  brew: mtm
  macports: mtm
  nix: mtm
package-manager-url: https://formulae.brew.sh/formula/mtm
license: GPL-3.0-or-later
tags:
  - cli
  - multiplexer
  - terminal
  - tui
description: Micro terminal multiplexer
executables:
  - mtm
provenance:
  formula: mtm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
