id: brew:borgmatic
display-name: borgmatic
homepage: https://torsion.org/borgmatic/
repo: https://projects.torsion.org/borgmatic-collective/borgmatic
docs:
  - https://torsion.org/borgmatic
  - https://torsion.org/borgmatic/how-to/set-up-backups
  - https://torsion.org/borgmatic/reference/configuration
config-file-location:
  unix:
    - /etc/borgmatic/config.yaml
    - ~/.config/borgmatic/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      borgmatic is packaged across mainstream Unix package managers, including Homebrew,
      Debian, Ubuntu, Fedora, Arch, openSUSE, Alpine, MacPorts, and Nix according to the
      batch input. Its presence in both Linux distribution repositories and macOS
      package managers reflects a practical role in personal server, workstation, and
      self-hosting backup setups.
    - >
      The project also appears in the Borg hosting ecosystem: borgmatic's README and
      site point users toward providers that explicitly support Borg or borgmatic
      workflows, making it a familiar layer for off-site encrypted backups.
  package-nerd-significance:
    - >
      For package maintainers, borgmatic is a useful example of a Python CLI that
      deliberately avoids bundling its core external engine, Borg, so distro packages
      must express the Borg relationship cleanly instead of hiding it inside the
      wrapper.
    - >
      For CLI users, it sits in the sweet spot between raw Borg commands and a full
      backup appliance: declarative config, Unix-friendly scheduling, and enough hooks
      to integrate with monitoring without requiring a daemon.
  project-history:
    - >
      The project grew as a wrapper and automation layer around BorgBackup. Its own
      documentation now presents borgmatic as the canonical project at torsion.org and
      the source repository as the official development home.
    - >
      borgmatic grew from a small wrapper script into a backup orchestrator with
      configuration validation, repository creation, pruning, checks, database dumps,
      hooks, monitoring integrations, and upgrade-aware command changes. The
      documentation's compatibility notes, such as the move from the older init action
      to repo-create, show an actively maintained tool tracking Borg's evolution.
  related-projects:
    - >
      BorgBackup is the underlying deduplicating, encrypted backup tool that borgmatic
      automates.
    - >
      BorgBase is a related hosting provider named by the borgmatic site as supporting
      Borg and borgmatic workflows.
    - >
      systemd, Docker, Podman, database engines, and monitoring services are adjacent
      integrations documented by borgmatic.
  sources:
    - https://projects.torsion.org/api/v1/repos/borgmatic-collective/borgmatic
    - https://torsion.org/borgmatic/
    - https://torsion.org/borgmatic/how-to/install-borgmatic/
    - https://torsion.org/borgmatic/how-to/set-up-backups/
    - source_facts.package-manager
  summary:
    - >
      borgmatic is configuration-driven backup automation for BorgBackup, turning Borg's
      deduplicating encrypted archive model into repeatable YAML-based backup jobs for
      servers and workstations.
  timeline:
    - >
      2017: Official source repository metadata shows the borgmatic repository created
      on projects.torsion.org.
    - '2023: Official release metadata includes borgmatic 1.8.1, part of the mature 1.x series.'
    - >
      2025: Documentation records the repo-create action replacing the older init action
      in borgmatic 1.9.0.
    - >
      2026: Project metadata and package-manager input show borgmatic maintained as a
      cross-distro backup CLI.
  usage:
    - >
      Typical use starts with a YAML configuration listing source directories,
      repositories, retention, checks, hooks, and optional database backup settings.
      Operators run borgmatic manually, from cron, or from systemd timers to create and
      prune Borg archives without hand-writing long Borg command lines.
    - >
      borgmatic relies on Borg being installed separately, then wraps Borg operations
      such as repository creation, archive creation, pruning, checks, extraction, and
      passphrase handling. Its docs describe both configuration-file passphrases and
      Borg environment variables such as BORG_PASSPHRASE and BORG_PASSCOMMAND.
related-packages:
  - id: brew:borgbackup
    reason: >
      BorgBackup is the storage and archive engine that borgmatic invokes; install and
      understand Borg when configuring repositories, encryption, archive operations, and
      restores through borgmatic.
    rel: adjacent_workflow
    sources:
      - https://torsion.org/borgmatic/
      - https://borgbackup.readthedocs.io/en/stable/
  - id: brew:resticprofile
    reason: >
      Choose resticprofile when you want declarative profiles and scheduling around
      restic; choose borgmatic when the underlying repository and backup engine should
      be Borg.
    rel: alternative
    sources:
      - https://creativeprojects.github.io/resticprofile/
      - https://torsion.org/borgmatic/
  - id: brew:autorestic
    reason: >
      Choose autorestic for a compact YAML wrapper around restic backends and locations;
      choose borgmatic for Borg-specific retention, checks, database dumps, hooks, and
      monitoring integrations.
    rel: alternative
    sources:
      - https://autorestic.vercel.app/
      - https://torsion.org/borgmatic/
category: system
package-manager:
  apk: borgmatic
  brew: borgmatic
  debian: borgmatic
  dnf: borgmatic
  macports: borgmatic
  nix: borgmatic
  pacman: borgmatic
  ubuntu: borgmatic
  zypper: borgmatic
package-manager-url: https://formulae.brew.sh/formula/borgmatic
license: GPL-3.0-or-later
tags:
  - automation
  - backup
  - borgbackup
  - cli
  - configuration
  - monitoring
description: Simple wrapper script for the Borg backup software
executables:
  - borgmatic
  - generate-borgmatic-config
  - validate-borgmatic-config
provenance:
  formula: borgmatic
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
