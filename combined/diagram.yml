id: brew:diagram
display-name: Diagram
homepage: https://github.com/esimov/diagram
repo: https://github.com/esimov/diagram
docs:
  - https://github.com/esimov/diagram#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Diagram is packaged for Homebrew and advertised from its own README with a `brew
      install diagram` path, which puts it in the small family of diagramming tools
      installable as normal Unix command-line utilities rather than desktop drawing
      applications.
  package-nerd-significance:
    - >
      For package collectors, Diagram is interesting because it packages a visual,
      GUI-adjacent workflow as a single CLI: text in, generated image out, with a
      terminal UI available when interactive editing is wanted.
  project-history:
    - >
      The public GitHub repository was created in 2017, matching the README copyright
      year. The README describes Diagram as a full CLI application with an editor,
      preview window, zooming and panning, file management, and direct command-line
      conversion from input text to output PNG.
  related-projects:
    - >
      The README says its ASCII-to-PNG conversion was ported from `shaky.dart`, and
      lists Go UI/graphics dependencies including gocui, gg, and gioui.
  sources:
    - https://github.com/esimov/diagram
    - https://raw.githubusercontent.com/esimov/diagram/master/README.md
    - https://api.github.com/repos/esimov/diagram
    - https://github.com/esimov/diagram/releases/tag/v1.1.0
  summary:
    - >
      Diagram is a Go command-line application for turning ASCII-art sketches into
      hand-drawn PNG diagrams. Its niche is the overlap between terminal diagramming,
      rough sketch aesthetics, and quick documentation assets.
  timeline:
    - '2017: GitHub repository created and README copyright year.'
    - '2025: v1.1.0 release published on GitHub.'
  usage:
    - >
      Package users typically feed an ASCII diagram to `diagram -in sample.txt -out
      sample.png`, optionally disabling preview or selecting a handwriting font. That
      makes it useful for quick README illustrations, sketches, and local documentation
      workflows.
related-packages:
  - id: brew:svgbob
    reason: >
      Choose Svgbob when ASCII diagrams should become scalable SVGs for documentation or
      web use; choose Diagram for a deliberately hand-drawn PNG style and interactive
      editor.
    rel: alternative
    sources:
      - https://github.com/esimov/diagram#readme
      - https://github.com/ivanceras/svgbob
category: developer-tools
package-manager:
  brew: diagram
package-manager-url: https://formulae.brew.sh/formula/diagram
license: MIT
tags:
  - ascii-art
  - cli
  - diagramming
  - hand-drawn
  - image-generation
  - terminal-ui
description: CLI app to convert ASCII arts into hand drawn diagrams
executables:
  - diagram
provenance:
  formula: diagram
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
