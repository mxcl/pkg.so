id: brew:asmfmt
display-name: asmfmt
homepage: https://github.com/klauspost/asmfmt
repo: https://github.com/klauspost/asmfmt
docs:
  - https://github.com/klauspost/asmfmt#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      asmfmt is a niche Go ecosystem tool. It is available through Go install, GitHub
      releases, Homebrew, MacPorts, and Nix according to the input package facts.
      Homebrew analytics are small, reflecting that only developers who touch Go
      assembly files need it.
  package-nerd-significance:
    - >
      asmfmt is package-nerd interesting because it exports the Go ecosystem's formatter
      culture into the much smaller world of Plan 9 style Go assembly. It is a tiny
      binary with a stable output contract, exactly the sort of tool package managers
      like to preserve for reproducible developer workflows.
  project-history:
    - >
      The GitHub repository was created in November 2015, and the first GitHub release,
      v1.0, was published in April 2016. The README's dated update log records many
      early formatting fixes around comments, macros, semicolons, and Go assembler
      syntax.
    - >
      By the README's own status note, asmfmt is stable and its formatting is expected
      to change only for bugs. Later releases in 2018, 2019, 2021, and 2022 focused on
      fixes, module information, and keeping the standalone formatter buildable.
  related-projects:
    - >
      The README positions asmfmt as analogous to gofmt and links Go package
      documentation on pkg.go.dev.
  sources:
    - https://api.github.com/repos/klauspost/asmfmt
    - https://api.github.com/repos/klauspost/asmfmt/releases
    - https://formulae.brew.sh/api/formula/asmfmt.json
    - https://github.com/klauspost/asmfmt#readme
    - source_facts.package-manager
  summary:
    - >
      asmfmt is a formatter for Go assembler files. Its README frames the project
      directly as `gofmt` for assembler code and documents `gofmt`-like flags such as
      `-d`, `-l`, and `-w`.
  timeline:
    - '2015: GitHub repository created and early formatting updates logged.'
    - '2016: v1.0 and v1.1 GitHub releases published.'
    - '2018: v1.2.0 released.'
    - '2021: v1.3.x releases refreshed module and comment handling.'
    - '2022: v1.3.2 released.'
  usage:
    - >
      The tool is run as `asmfmt [flags] [path ...]` and should be pointed only at
      assembler files, because the README warns that non-assembler files cannot be
      positively identified and may be mangled. Editor integration examples include
      GoLand file watchers and Emacs before-save hooks.
related-packages:
  - id: brew:go
    reason: >
      The Go toolchain assembles the Plan 9-style `.s` files that asmfmt formats, so the
      two tools form the normal edit-format-build workflow for Go assembly.
    rel: adjacent_workflow
    sources:
      - https://github.com/klauspost/asmfmt#readme
      - https://go.dev/doc/asm
      - https://go.dev/doc/toolchain
category: developer-tools
package-manager:
  brew: asmfmt
  macports: asmfmt
  nix: asmfmt
package-manager-url: https://formulae.brew.sh/formula/asmfmt
license: MIT
tags:
  - assembly
  - cli
  - formatter
  - go
  - gofmt
description: Go Assembler Formatter
executables:
  - asmfmt
provenance:
  formula: asmfmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
