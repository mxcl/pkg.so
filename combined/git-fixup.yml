id: brew:git-fixup
display-name: git-fixup
homepage: https://github.com/keis/git-fixup
repo: https://github.com/keis/git-fixup
docs:
  - https://github.com/keis/git-fixup#readme
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool occupies a niche around Git autosquash usage rather than serving as a
      general-purpose Git frontend. Its README documents installation through Homebrew,
      Arch packaging, manual installation, and shell completion, which shows the script
      was designed for developer workstations and command-line integration.
  package-nerd-significance:
    - >
      git-fixup is package-nerd useful because it turns a common review-cleanup ritual
      into a tiny Git subcommand without adding a large workflow system. Its value is in
      the Unix-tool shape: a shell script, optional completion, and compatibility with
      external menu tools such as fzf.
  project-history:
    - >
      David Keijser's repository began in June 2013 with the stated purpose of reducing
      the copy-and-paste work in a rebase workflow. The README presents `git fixup
      <ref>` as a convenience wrapper around `git commit --fixup <ref>`, while the
      argument-free form uses Git blame and log data to suggest commits touched by the
      staged lines or files.
  related-projects:
    - >
      git-fixup builds on Git's `commit --fixup`, `commit --squash`, and `rebase
      --autosquash` workflow, and it can be paired with menu tools such as fzf.
  sources:
    - https://github.com/keis/git-fixup
    - https://github.com/keis/git-fixup#readme
    - https://github.com/keis/git-fixup/blob/master/CHANGELOG.md
  summary:
    - >
      git-fixup is a small shell-based Git helper that automates creation of fixup,
      squash, and amend commits for interactive rebase workflows.
  timeline:
    - >
      2013: The repository was created and the first commit described the tool as
      fixup-focused.
    - >
      2015: README imagery and usage examples documented the interactive
      candidate-selection workflow.
    - >
      Later releases: The command gained squash, amend, rebase, menu, and
      shell-completion support.
  usage:
    - >
      Practitioners stage the changes that should amend an older commit, run `git fixup`
      to select or infer a target commit, and then use interactive rebase with
      autosquash to fold the generated fixup or squash commit into place. Configuration
      is provided through Git config keys and environment variables for defaults such as
      base revision, action, menu command, and whether to rebase after committing.
related-packages:
  - id: brew:fzf
    reason: >
      git-fixup officially documents using fzf as its interactive commit-selection menu
      through `fixup.menu` or `GITFIXUPMENU`.
    rel: adjacent_workflow
    sources:
      - https://github.com/keis/git-fixup
      - https://junegunn.github.io/fzf/
  - id: brew:git
    reason: >
      git-fixup creates Git-native fixup, squash, and amend commits and can immediately
      invoke Git's interactive autosquash rebase to fold them into their targets.
    rel: adjacent_workflow
    sources:
      - https://github.com/keis/git-fixup
      - https://git-scm.com/docs/git-rebase
      - https://git-scm.com/docs/git-commit
category: developer-tools
package-manager:
  brew: git-fixup
  nix: git-fixup
package-manager-url: https://formulae.brew.sh/formula/git-fixup
license: ISC
tags:
  - cli
  - fixup
  - git
  - rebase
  - version-control
description: Alias for git commit --fixup
executables:
  - git-fixup
provenance:
  formula: git-fixup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
