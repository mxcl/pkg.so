id: brew:gravity
display-name: Gravity
homepage: https://www.gravity-lang.org/
repo: https://github.com/marcobambini/gravity
docs:
  - https://www.gravity-lang.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gravity's adoption is specialized rather than ecosystem-wide. The official README
      names Creo as a core embedding target and the Untold game engine as another use
      case.
    - >
      In package-manager terms, Gravity appeals to developers who want a lightweight
      scripting language or a studyable bytecode VM without pulling in a large external
      runtime.
  package-nerd-significance:
    - >
      Gravity is interesting to package nerds because it is a compact language runtime
      rather than a mainstream language ecosystem. It packages cleanly as a native
      executable while also serving as embeddable infrastructure.
    - >
      It is also a useful comparison point with Lua, Wren, Squirrel, and other
      application scripting languages: the package is less about global ecosystem
      adoption and more about how easily a host application can carry a scripting VM.
  project-history:
    - >
      The official README says Gravity was developed from scratch for the Creo project
      to provide portable code across iOS and Android. It combines a class-based,
      concurrent scripting model with Swift-like syntax and a small native runtime.
    - >
      The project site presents Gravity as a small high-performance language with no
      external dependencies and a VM intended to add little overhead to an application.
      The GitHub release series records continuing maintenance of the interpreter and
      runtime.
  related-projects:
    - 'Creo: the official README describes Gravity as the core language built into Creo.'
    - 'Untold game engine: the official README names Gravity as its scripting language.'
    - >
      Lua, Wren, and Squirrel are comparable embeddable scripting-language package
      niches, though they are separate projects.
  sources:
    - https://creolabs.com/gravity
    - https://github.com/marcobambini/gravity
    - https://github.com/marcobambini/gravity/releases
    - https://www.gravity-lang.org/
  summary:
    - >
      Gravity is an embeddable, dynamically typed programming language implemented in C.
      It is packaged as a command-line interpreter/runtime but is historically most
      important as a small VM designed to be embedded in applications.
  timeline:
    - "2013: Marco Bambini's site associates Gravity with work beginning in 2013."
    - >
      2018: Public attention around the Gravity site and repository highlighted the
      embeddable VM design.
    - >
      2020: The maintainer opened GitHub Discussions for project questions and community
      discussion.
    - >
      2026: The GitHub release page records 0.9.x maintenance releases with runtime and
      compiler fixes.
  usage:
    - >
      Users can run the Gravity executable for scripts or embed the language in a C/C++
      application. Its documented language model supports procedural, object-oriented,
      functional, data-driven, and prototype-style programming patterns.
    - >
      The lack of external dependencies is part of the intended deployment story:
      package managers can build a small C runtime, while embedders can include the VM
      in an application.
related-packages:
  - id: brew:lua
    reason: >
      Choose Lua when you need a mature, broadly adopted embeddable language and module
      ecosystem; choose Gravity for its Swift-like syntax, class model, and integrated
      multipass compiler.
    rel: alternative
    sources:
      - https://github.com/marcobambini/gravity#readme
      - https://www.lua.org/about.html
  - id: brew:wren-cli
    reason: >
      Choose Wren CLI for Wren's deliberately small class-based language and separate
      OS-facing CLI, while Gravity supplies its own compiler, CLI, bytecode workflow,
      and embedding API in one project.
    rel: alternative
    sources:
      - https://github.com/marcobambini/gravity#readme
      - https://wren.io/
      - https://wren.io/cli/
category: language-runtime
package-manager:
  brew: gravity
  macports: gravity
package-manager-url: https://formulae.brew.sh/formula/gravity
license: MIT
tags:
  - cli
  - embeddable-language
  - interpreter
  - programming-language
  - runtime
description: Embeddable programming language
executables:
  - gravity
provenance:
  formula: gravity
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
