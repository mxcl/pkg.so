id: brew:foundry
display-name: Foundry
homepage: https://github.com/foundry-rs/foundry
repo: https://github.com/foundry-rs/foundry
docs:
  - https://getfoundry.sh/
  - https://getfoundry.sh/config
  - https://getfoundry.sh/introduction/installation
config-file-location:
  unix:
    - foundry.toml
    - ~/.foundry/foundry.toml
credentials-file-location:
  unix: ~/.foundry/keystores
history:
  adoption-history:
    - >
      Foundry became a common smart-contract development package because it moved the
      Ethereum workflow into fast local CLIs: Solidity tests through Forge, forked-chain
      testing through Anvil, RPC and wallet tasks through Cast, and repeatable installs
      through `foundryup`, GitHub Releases, Docker, Homebrew, and source builds.
  package-nerd-significance:
    - >
      Foundry is important in package history because it packaged a complete blockchain
      developer workstation as native CLIs rather than a JavaScript-only toolchain. It
      also made release management and version switching part of the package story
      through `foundryup`, nightly builds, binary attestations, Docker images, and Cargo
      builds.
  project-history:
    - >
      The `foundry-rs/foundry` repository was created in 2021. Its README presents
      Foundry as a fast, portable, modular Ethereum development toolkit and splits the
      suite into Forge, Cast, Anvil, and Chisel.
    - >
      The official docs now organize Foundry around installation with `foundryup`,
      project setup, dependencies, Forge workflows, Cast chain interaction, Anvil local
      node usage, Chisel sessions, and `foundry.toml` configuration.
  related-projects:
    - >
      Foundry is related to Ethereum, Solidity, EVM-compatible chains, GitHub artifact
      attestations, Docker images, Cargo/Rust builds, and the earlier smart-contract
      tooling ecosystem that it complements or replaces in many projects.
  sources:
    - https://api.github.com/repos/foundry-rs/foundry
    - https://api.github.com/repos/foundry-rs/foundry/releases
    - https://api.github.com/repos/foundry-rs/foundry/tags
    - https://getfoundry.sh/
    - https://getfoundry.sh/config/
    - https://getfoundry.sh/forge/
    - https://getfoundry.sh/introduction/installation
    - https://github.com/foundry-rs/foundry
    - https://raw.githubusercontent.com/foundry-rs/foundry/master/README.md
  summary:
    - >
      Foundry is a Rust-written toolkit for Ethereum application development. The
      package ships the `forge`, `cast`, `anvil`, and `chisel` commands for building and
      testing Solidity contracts, interacting with EVM chains, running a local node, and
      using a Solidity REPL.
  timeline:
    - '2021: The public `foundry-rs/foundry` repository was created.'
    - >
      2026: GitHub tags included stable v1.7.x releases and GitHub Releases continued to
      publish nightly builds.
    - >
      2026: The official installation docs described `foundryup` as the installer and
      version manager and listed precompiled binaries, Docker, and source builds as
      alternatives.
  usage:
    - >
      The README's basic workflow is `forge init`, `forge build`, and `forge test`;
      common operational workflows include `cast block-number`, `cast balance`, and
      `anvil --fork-url` for a forked local chain. Configuration is kept in
      `foundry.toml` with profiles and environment-variable overrides.
related-packages:
  - id: brew:slither-analyzer
    reason: >
      Run Slither at a Foundry project root for fast Solidity and Vyper static analysis;
      Slither officially detects Foundry projects and uses their compilation framework
      to analyze contracts with dependencies.
    rel: adjacent_workflow
    sources:
      - https://github.com/crytic/slither
      - https://github.com/foundry-rs/foundry
  - id: brew:echidna
    reason: >
      Use Echidna after or alongside Forge tests for longer property and invariant
      fuzzing campaigns; Echidna officially compiles Foundry projects through
      crytic-compile and supports Foundry-style tests.
    rel: adjacent_workflow
    sources:
      - https://github.com/crytic/echidna
      - https://github.com/foundry-rs/foundry
category: developer-tools
package-manager:
  apk: foundry
  brew: foundry
  dnf: foundry
  nix: foundry
  pacman: foundry
  scoop: main/chisel
  ubuntu: forge-doc
  winget: Microsoft.FoundryLocal
  zypper: foundry
package-manager-url: https://formulae.brew.sh/formula/foundry
license: MIT OR Apache-2.0
tags:
  - cli
  - developer-tools
  - ethereum
  - evm
  - smart-contracts
  - solidity
description: Blazing fast, portable and modular toolkit for Ethereum application development
executables:
  - anvil
  - cast
  - chisel
  - forge
provenance:
  formula: foundry
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
