id: brew:cubejs-cli
display-name: cubejs-cli
homepage: https://cube.dev/
repo: https://github.com/cube-js/cube
docs:
  - https://cube.dev/docs/product/administration/workspace/cli
  - https://cube.dev/docs/product/administration/workspace/cli/reference
config-file-location:
  unix:
    - ./cube.py
    - ./cube.js
  windows:
    - .\cube.py
    - .\cube.js
credentials-file-location: null
history:
  adoption-history:
    - >
      Cube's documented audience has broadened from application and analytics developers
      to data engineers, analysts, business users, embedded analytics teams, and AI
      agents that need governed access to metrics.
  package-nerd-significance:
    - >
      cubejs-cli is notable because the package name preserves the older Cube.js
      branding while the upstream repository and docs now emphasize Cube Core and a
      broader semantic-layer platform. That makes repository and documentation
      normalization especially important for package metadata.
  project-history:
    - >
      The cube-js/cube repository was created in 2018 and now presents Cube Core as an
      open-source semantic layer for analytics. Official Cube documentation describes
      Cube as an analytics platform built on that semantic layer, with Cube Core
      providing shared model definitions, access rules, caching, and APIs.
  related-projects:
    - Cube Core, Cube Cloud, semantic layers, BI tools, embedded analytics, Cube Store.
  sources:
    - https://github.com/cube-js/cube
    - https://api.github.com/repos/cube-js/cube
    - https://cube.dev/docs/product/administration/workspace/cli
    - https://cube.dev/docs/product/administration/workspace/cli/reference
    - https://docs.cube.dev/docs/introduction
  summary:
    - >
      cubejs-cli is the command-line entry point for Cube, the open-source
      semantic-layer project formerly associated with the Cube.js name.
  timeline:
    - '2018: Public cube-js/cube repository created.'
    - >
      2020s: Cube documentation presents Cube Core as the open-source semantic layer
      behind the Cube platform.
    - '2020s: CLI documentation covers workspace administration and command reference.'
  usage:
    - >
      The CLI is used for workspace administration and developer workflows around Cube
      projects. In package-manager terms it is the installable command surface for
      bootstrapping, managing, or operating Cube workspaces from a shell.
related-packages: []
category: data
package-manager:
  brew: cubejs-cli
package-manager-url: https://formulae.brew.sh/formula/cubejs-cli
license: Apache-2.0
tags:
  - analytics
  - cli
  - cube
  - data-modeling
  - nodejs
  - semantic-layer
description: Cube.js command-line interface
executables:
  - cubejs
provenance:
  formula: cubejs-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
