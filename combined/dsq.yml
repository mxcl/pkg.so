id: brew:dsq
display-name: dsq
homepage: https://github.com/multiprocessio/dsq
repo: https://github.com/multiprocessio/dsq
docs:
  - https://github.com/multiprocessio/dsq#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dsq's adoption came from the CLI data-wrangling crowd: people who wanted
      `jq`-adjacent convenience but preferred SQL over local structured files. It
      shipped Homebrew installation instructions in the README and has also appeared in
      MacPorts, Nix, and Arch packages.
    - >
      Homebrew analytics showed 159 installs over the preceding 365 days during this
      batch, consistent with a useful but superseded utility.
  package-nerd-significance:
    - >
      dsq is package-nerd significant because it marks a short transitional moment in
      local data tools: single-binary SQL over arbitrary files before DuckDB became the
      obvious answer for many of the same workflows. Its own README now documents that
      transition by pointing users away from dsq toward stronger analytics engines.
  project-history:
    - >
      The README presents dsq as a CLI companion to DataStation, the Multiprocess Labs
      GUI for querying data files. Its implementation approach is SQLite-centered, which
      made it convenient and portable for mixed local files but eventually less
      attractive than columnar/vectorized analytics engines.
    - >
      The release history moved quickly through 2022: 0.15 added query-file and cache
      flags, 0.16 added an interactive REPL, 0.22 added logfmt support, and v0.23.0
      fixed nested JSON handling. The README later opened with a
      not-under-active-development notice and recommended DuckDB, ClickHouse-local, and
      GlareDB instead.
  related-projects:
    - DataStation is the GUI companion project named by the README.
    - >
      DuckDB, ClickHouse-local, and GlareDB are the README's recommended successors or
      alternatives.
    - >
      SQLite is the underlying style of engine the README contrasts with newer
      columnar/vectorized systems.
    - jq is a common neighboring CLI in local JSON/data-wrangling workflows.
  sources:
    - https://github.com/multiprocessio/dsq#readme
    - https://github.com/multiprocessio/dsq/releases/tag/0.15.0
    - https://github.com/multiprocessio/dsq/releases/tag/0.16.0
    - https://github.com/multiprocessio/dsq/releases/tag/v0.22.0
    - https://github.com/multiprocessio/dsq/releases/tag/v0.23.0
    - https://formulae.brew.sh/formula/dsq
  summary:
    - >
      dsq is a Go command-line tool for running SQL queries over data files such as
      JSON, CSV, Excel, Parquet, TSV, and logs. Upstream now labels it not under active
      development and points users toward DuckDB, ClickHouse-local, and GlareDB-style
      analytics foundations.
  timeline:
    - '2022-04-20: 0.15.0 added query-file and cache support.'
    - '2022-04-26: 0.16.0 added a basic interactive REPL.'
    - '2022-08-26: v0.22.0 added logfmt support.'
    - >
      2022-10-20: v0.23.0 fixed nested JSON query handling and is the Homebrew stable
      version recorded for this batch.
    - >
      Later README state: Upstream marked the project not under active development and
      recommended DuckDB, ClickHouse-local, and GlareDB.
  usage:
    - >
      Typical use is `dsq file.json 'SELECT ... FROM {}'`, piping data with `-s`,
      joining multiple files as numbered tables, pretty-printing results, dumping
      inferred schema, caching imported data, or using the interactive REPL added in the
      0.16 line.
related-packages:
  - id: brew:duckdb
    reason: >
      Choose DuckDB for actively developed, vectorized analytical SQL over local CSV and
      Parquet data; dsq's own README recommends it as a stronger successor.
    rel: alternative
    sources:
      - https://github.com/multiprocessio/dsq#readme
      - https://duckdb.org/docs/stable/data/overview
  - id: cask:clickhouse
    reason: >
      Choose ClickHouse's local mode when performance and ClickHouse SQL matter more
      than dsq's smaller SQLite-based workflow; upstream explicitly recommends
      ClickHouse-local.
    rel: alternative
    sources:
      - https://github.com/multiprocessio/dsq#readme
      - https://clickhouse.com/docs/operations/utilities/clickhouse-local
  - id: brew:octosql
    reason: >
      Choose OctoSQL when a single SQL query must combine local files, streams, and
      database-backed sources through an extensible query engine.
    rel: alternative
    sources:
      - https://github.com/multiprocessio/dsq#readme
      - https://github.com/cube2222/octosql#readme
  - id: brew:csvq
    reason: >
      Choose csvq for a maintained SQL-like CLI focused on CSV, TSV, fixed-width, JSON,
      and JSON Lines data with a smaller format scope.
    rel: alternative
    sources:
      - https://github.com/multiprocessio/dsq#readme
      - https://mithrandie.github.io/csvq
category: data
package-manager:
  brew: dsq
  macports: dsq
  nix: dsq
  pacman: dsq
package-manager-url: https://formulae.brew.sh/formula/dsq
license: Apache-2.0
