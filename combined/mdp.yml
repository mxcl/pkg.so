id: brew:mdp
display-name: mdp
homepage: https://github.com/visit1985/mdp
repo: https://github.com/visit1985/mdp
docs:
  - https://github.com/visit1985/mdp#readme
config-file-location:
  unix: include/config.h
credentials-file-location: null
history:
  adoption-history:
    - >
      mdp is unusually well packaged for a small terminal Markdown tool. The official
      README points to packages or ports for Arch Linux, Cygwin, Debian, FreeBSD,
      Homebrew, MacPorts, Slackware, and Ubuntu; the input package-manager facts also
      list apk, brew, Debian, MacPorts, Nix, pacman, and Ubuntu coverage.
    - >
      GitHub repository metadata reported thousands of stars and hundreds of forks by
      2026, indicating sustained interest among command-line users beyond a single
      package ecosystem.
  package-nerd-significance:
    - >
      mdp matters in package-manager culture because it is the small, Unix-shaped answer
      to presentation software: a C program, an ncurses dependency, a Markdown input
      file, and distro packages. It is the sort of package that turns a terminal into
      the whole presentation stack.
  project-history:
    - >
      The public GitHub repository was created on 2014-09-14 under visit1985/mdp. The
      project presents itself as a terminal-native slide deck tool: users clone the
      repository, build it with make, and run `mdp sample.md` to present a Markdown
      file.
    - >
      The README's configuration section shows the project staying close to its ncurses
      roots: colors, keybindings, and list types are changed in `include/config.h` and
      require recompilation rather than a separate runtime preferences file.
  related-projects:
    - The README references md2pdf/mdtopdf for converting mdp-compatible Markdown into PDF.
    - >
      mdp sits near other terminal Markdown tools such as mdv, but focuses on
      presentations rather than document reading.
  sources:
    - https://api.github.com/repos/visit1985/mdp
    - https://github.com/visit1985/mdp#readme
    - source_facts.package-manager
  summary:
    - >
      mdp is a C/ncurses command-line presentation tool that renders slide decks from
      Markdown directly in a terminal. Its official README describes horizontal rulers
      as slide separators, basic Markdown formatting support, terminal keybindings, and
      a small compile-time configuration surface.
  timeline:
    - '2014: Public GitHub repository created.'
    - '2015: README screenshot asset added for the terminal slide-deck workflow.'
    - >
      2026: GitHub metadata still showed active packaging visibility and ongoing
      repository activity.
  usage:
    - >
      Typical use is to write a Markdown document with slide separators, then run `mdp
      sample.md` in a 256-color terminal. The built-in controls use vi-style keys,
      arrows, paging keys, numeric slide jumps, reload, and quit.
    - >
      The README also documents a PDF conversion workflow via the separate `md2pdf` tool
      for users who want to convert mdp-compatible decks outside the terminal.
related-packages:
  - id: brew:presenterm
    reason: >
      Choose Presenterm for terminal Markdown slides with images, animated GIFs, themes,
      code highlighting, and PDF export; choose mdp for a smaller ncurses-based
      presentation tool.
    rel: alternative
    sources:
      - https://github.com/visit1985/mdp#readme
      - https://mfontanini.github.io/presenterm/
  - id: brew:slides
    reason: >
      Choose Slides when live reload, search, code execution, or command-based
      preprocessing is useful during a terminal presentation.
    rel: alternative
    sources:
      - https://github.com/visit1985/mdp#readme
      - https://maaslalani.com/slides/
  - id: brew:patat
    reason: >
      Choose Patat when Pandoc's Markdown parsing and document ecosystem matter; choose
      mdp for its compact native Markdown dialect and ncurses implementation.
    rel: alternative
    sources:
      - https://github.com/visit1985/mdp#readme
      - https://github.com/jaspervdj/patat#readme
category: productivity
