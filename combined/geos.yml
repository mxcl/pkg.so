id: brew:geos
display-name: GEOS
homepage: https://libgeos.org/
repo: https://github.com/libgeos/geos
docs:
  - https://libgeos.org/doxygen
  - https://libgeos.org/usage
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GEOS became a central dependency in the open-source geospatial stack. The official
      site names PostGIS, QGIS, GDAL, Shapely, and many others as core users, while the
      repository README also names the R `sf` package. That adoption made GEOS the
      shared geometry engine underneath SQL, desktop GIS, Python, R, and data-processing
      workflows.
  package-nerd-significance:
    - >
      For package managers, GEOS is infrastructure: ABI stability of the C API matters
      because many dependent packages dynamically link to it. A GEOS upgrade can affect
      PostGIS, GDAL, QGIS, Shapely, R `sf`, and language bindings, so distributions
      treat it as a foundational geospatial library rather than a leaf package.
  project-history:
    - >
      GEOS began as a direct C++ port of the Java JTS Topology Suite and remains closely
      tied to JTS. The project documentation says most core algorithms are developed in
      JTS and ported to GEOS after completion, while the two projects share testing data
      to distinguish implementation differences from algorithmic behavior.
    - >
      GEOS is governed by a Project Steering Committee and is an OSGeo project. The
      official GitHub repository is the project source tree and includes the C API, C++
      implementation, examples, Doxygen documentation, tools, and packaging metadata.
  related-projects:
    - >
      Related projects include JTS Topology Suite, PostGIS, QGIS, GDAL, Shapely, R `sf`,
      and language bindings that expose GEOS operations outside C and C++.
  sources:
    - https://github.com/libgeos/geos
    - https://libgeos.org/
  summary:
    - >
      GEOS, the Geometry Engine, Open Source, is a C and C++ computational-geometry
      library focused on algorithms used in GIS software. It implements the OGC Simple
      Features geometry model, spatial predicates and operations, spatial indexes, WKT
      and WKB I/O, and C and C++ APIs.
  timeline:
    - 'JTS origin: GEOS started as a direct C++ port of the JTS Topology Suite.'
    - 'OSGeo governance: GEOS became an OSGeo project run by a Project Steering Committee.'
    - >
      2025: The official citation entry described GEOS as an Open Source Geospatial
      Foundation computational geometry library.
  usage:
    - >
      Practitioners use GEOS through stable C API bindings, C++ code, or higher-level
      wrappers to compute intersections, unions, buffers, predicates such as contains
      and intersects, geometry validity, simplification, convex hulls, distances, areas,
      lengths, and spatial-index queries. Package users also get `geos-config` for
      compiler and linker flags and `geosop` as a command-line operator for GEOS
      geometry operations.
related-packages:
  - id: brew:postgis
    reason: >
      Use PostGIS when GEOS-backed geometry processing needs to live inside PostgreSQL
      with spatial storage, indexing, and SQL queries.
    rel: adjacent_workflow
    sources:
      - https://libgeos.org/
      - https://postgis.net/
  - id: brew:gdal
    reason: >
      Use GDAL alongside GEOS for raster and vector format conversion pipelines that
      feed data into geometry-processing workflows.
    rel: adjacent_workflow
    sources:
      - https://libgeos.org/
      - https://gdal.org/en/stable/
category: science
