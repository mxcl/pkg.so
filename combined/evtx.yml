id: brew:evtx
display-name: evtx
homepage: https://github.com/omerbenamram/evtx
repo: https://github.com/omerbenamram/evtx
docs:
  - https://github.com/omerbenamram/evtx#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package has visible adoption in Rust and package-manager communities:
      crates.io reported more than 212,000 total downloads and Homebrew shipped evtx
      0.12.2 with recent install analytics. The repository also links pyevtx-rs as
      Python bindings around the same Rust core.
    - >
      Its niche is forensic and incident-response tooling rather than general-purpose
      logging. The README compares it directly with python-evtx, libevtx, Go EVTX
      parsers, and pyevtx-rs, which reflects its role in a small but
      performance-sensitive parser ecosystem.
  package-nerd-significance:
    - >
      Package maintainers care about evtx because it is a modern, cross-platform
      replacement candidate for older EVTX parsers that were often tied to Python or C
      libraries. It also has the classic package-nerd appeal of a small CLI wrapping a
      fast library with stable machine-readable output.
    - >
      The project is especially useful in Unix pipelines that need to process Windows
      forensic artifacts without a Windows host.
  project-history:
    - >
      The GitHub repository was created on 2019-03-30 and the first GitHub release,
      0.3.0, was published on 2019-05-14. The project positions itself as a
      cross-platform parser for Windows EVTX files, implemented in safe Rust, with XML,
      JSON, and JSON Lines output paths.
    - >
      By the 0.12.x series the README emphasized multithreaded parsing, recovery of
      missing records or chunks, offline WEVT template rendering, WebAssembly-backed
      local viewing, and release binaries for Windows, macOS, and Linux.
  related-projects:
    - pyevtx-rs provides Python bindings for the same Rust core.
    - The README benchmarks against python-evtx, libevtx, Velocidex evtx, and golang-evtx.
  sources:
    - https://github.com/omerbenamram/evtx
    - https://raw.githubusercontent.com/omerbenamram/evtx/master/README.md
    - https://api.github.com/repos/omerbenamram/evtx
    - https://api.github.com/repos/omerbenamram/evtx/releases?per_page=100
    - https://crates.io/api/v1/crates/evtx
    - https://formulae.brew.sh/api/formula/evtx.json
  summary:
    - >
      evtx is a Rust library and command-line utility for parsing the Windows XML Event
      Log format, centered on the evtx_dump tool and also exposed through Rust and
      Python bindings.
  timeline:
    - '2019: Repository created and first GitHub release published.'
    - >
      2026: README benchmarked evtx 0.12.2 and documented PGO-built release binaries for
      Linux and macOS.
    - >
      2026: crates.io reported evtx 0.12.2 as the maximum version with more than 212,000
      total downloads.
  usage:
    - >
      The main CLI, evtx_dump, converts .evtx files to XML, JSON, or JSON Lines, can
      write to files, can read from stdin, and can be combined with tools such as fd,
      xargs, and jq for batch processing.
    - >
      As a library, evtx exposes EvtxParser for iterating over records from Rust code.
      Optional WEVT template-cache support lets users extract templates from provider
      binaries and render records that otherwise fail because of missing template data.
related-packages:
  - id: brew:chainsaw
    reason: >
      Use Chainsaw after or instead of raw dumping when the workflow needs Sigma-based
      threat hunting, searches, and timelines over EVTX and other Windows forensic
      artifacts; Chainsaw officially wraps this evtx parser.
    rel: adjacent_workflow
    sources:
      - https://github.com/omerbenamram/evtx#readme
      - https://github.com/WithSecureOpenSource/chainsaw#readme
category: security
