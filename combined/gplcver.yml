id: brew:gplcver
display-name: GPL Cver
homepage: https://gplcver.sourceforge.net/
repo: https://sourceforge.net/p/gplcver/code/ci/master/tree
docs:
  - https://gplcver.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GPL Cver has a narrow but durable package footprint: the input package-manager
      facts list Homebrew, Debian, MacPorts, and Ubuntu packages. Homebrew describes it
      as 'Pragmatic C Software GPL Cver 2001' and packages version 2.12a.
    - >
      Its adoption is mostly historical and specialist: users who need an open Verilog
      simulator with PLI support can install it from Unix package managers, but it sits
      beside better-known open-source Verilog tools rather than acting as a general
      developer utility.
  package-nerd-significance:
    - >
      GPL Cver is interesting to package maintainers because it preserves a formerly
      commercial-style Verilog simulator in a redistributable GPL form. That makes it a
      useful historical EDA package even when install counts are small.
    - >
      Its package shape is old-school Unix: source tree, docs directory, prebuilt
      makefiles for older Unix-like platforms, and a single simulator executable.
  project-history:
    - >
      The project README states that GPL Cver is a copyrighted Pragmatic C Software work
      distributed under the GNU General Public License, and that it represents an older
      Cver line while a newer commercial Cver was offered by Pragmatic C Software.
    - >
      The SourceForge code tree shows an initial import of cver-2.12a on Apr 27, 2009.
      The same tree contains top-level documentation, PLI sources, tests, Verilog
      sources, and release notes, preserving the package as a source-distributed EDA
      tool.
  related-projects:
    - >
      Icarus Verilog and VeriWell appear as related Verilog simulator projects in
      SourceForge's project context.
    - >
      Verilog-XL is the commercial simulator lineage used as a comparison point in the
      project description.
    - vcddiff ships with GPL Cver as a related utility for comparing Verilog VCD files.
  sources:
    - https://formulae.brew.sh/formula/gplcver
    - https://sourceforge.net/p/gplcver/code/ci/master/tree/
    - https://sourceforge.net/projects/gplcver/
    - https://sourceforge.net/projects/gplcver/files/gplcver/
  summary:
    - >
      GPL Cver is the GPL-distributed edition of Pragmatic C Software's Cver Verilog
      simulator. SourceForge describes it as an interpreted Verilog simulator with a
      feature set and performance similar to Verilog-XL, implementing IEEE 1364-1995
      features, some Verilog-2001 features, and Verilog PLI interfaces.
  timeline:
    - '2001: Homebrew metadata identifies the package as Pragmatic C Software GPL Cver 2001.'
    - >
      2009: SourceForge project registration and cver-2.12a source import occurred in
      April 2009.
    - '2024: SourceForge activity records a maintenance update touching the source tree.'
  usage:
    - >
      Users run the cver executable against Verilog files to simulate designs. The
      upstream README points users to the INSTALL file for source builds and to the doc
      directory for Cver documentation.
    - >
      The release also includes vcddiff, a specialized diff-like utility for Verilog VCD
      waveform files, which makes the package more useful for regression and
      simulation-output comparison workflows.
related-packages:
  - id: brew:icarus-verilog
    reason: >
      Choose Icarus Verilog for a more broadly packaged compiler-and-simulator workflow
      with dedicated modern user, target, and developer documentation.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/gplcver/
      - https://steveicarus.github.io/iverilog/
  - id: brew:verilator
    reason: >
      Choose Verilator when fast compiled Verilog or SystemVerilog models and C++ or
      SystemC testbench integration matter more than GPL Cver's interpreted simulation
      and PLI-oriented workflow.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/gplcver/
      - https://verilator.org/guide/latest/overview.html
category: developer-tools
package-manager:
  brew: gplcver
  debian: gplcver
  macports: gplcver
  ubuntu: gplcver
package-manager-url: https://formulae.brew.sh/formula/gplcver
license: GPL-2.0-or-later
tags:
  - cli
  - eda
  - gpl
  - simulation
  - verilog
description: Pragmatic C Software GPL Cver 2001
executables:
  - cver
provenance:
  formula: gplcver
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
