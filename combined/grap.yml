id: brew:grap
display-name: grap
homepage: https://www.lunabase.org/~faber/Vault/software/grap/
repo: https://github.com/snorerot13/grap
docs:
  - https://github.com/snorerot13/grap/blob/master/README
  - https://www.lunabase.org/~faber/Vault/software/grap
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      grap is niche but durable because it solves a specific documentation problem for
      users who still value text-based, reproducible graph descriptions inside Unix
      typesetting systems. It appears in package managers for people maintaining
      historical troff/groff workflows or converting old documents.
  package-nerd-significance:
    - >
      grap matters to package nerds because it is a preservation-friendly Unix tool:
      tiny, source-buildable, text-oriented, and useful mainly when the rest of a
      document toolchain is installed correctly.
  project-history:
    - >
      The grap language was specified and first implemented by Brian Kernighan and Jon
      Bentley at Bell Labs. Ted Faber's implementation was written because groff did not
      include a free grap implementation, and the repository describes it as an
      implementation of Kernighan and Bentley's language.
    - >
      The project preserves a classic Unix documentation workflow: a small language is
      processed into pic, then included in typeset documents. That lineage places grap
      beside troff preprocessors such as pic, tbl, and eqn.
  related-projects:
    - >
      pic is the immediate output language and troff/groff are the common formatting
      environments.
    - TeX can participate through workflows that consume pic-generated output.
    - The original Bell Labs language is the historical source for Ted Faber's implementation.
  sources:
    - https://dl.acm.org/doi/10.1145/6424.6429
    - https://github.com/snorerot13/grap
    - https://www.lunabase.org/~faber/Vault/software/grap/
  summary:
    - >
      grap is an implementation of the Bell Labs grap language for typesetting graphs in
      troff, groff, TeX, and other document-formatting pipelines that can consume pic
      output.
  timeline:
    - >
      1986: Bentley and Kernighan published GRAP, a language for typesetting graphs, in
      Communications of the ACM.
    - '1998-2009: Ted Faber copyright range shown in the repository README.'
    - '2025-04-16: Lunabase project page listed version 1.49.'
  usage:
    - >
      Users write graph descriptions in grap, run the preprocessor to generate pic, and
      let pic/troff, groff, or TeX-oriented workflows render the graph in a document.
related-packages:
  - id: brew:groff
    reason: >
      Use GNU groff to run grap and pic as part of a complete roff document-rendering
      pipeline.
    rel: adjacent_workflow
    sources:
      - https://www.lunabase.org/~faber/Vault/software/grap/
      - https://www.gnu.org/software/groff/manual/groff.html.node/Preprocessor-Intro.html
category: media
