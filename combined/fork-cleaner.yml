id: brew:fork-cleaner
display-name: fork-cleaner
homepage: https://github.com/caarlos0/fork-cleaner
repo: https://github.com/caarlos0/fork-cleaner
docs:
  - https://github.com/caarlos0/fork-cleaner#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions cover Homebrew, snap, apt, yum, distro
      packages, release binaries, and source builds, indicating that the tool was
      packaged for several CLI distribution channels rather than only as source code.
  package-nerd-significance:
    - >
      fork-cleaner is notable as a purpose-built repository-hygiene CLI: it packages an
      otherwise manual GitHub-account cleanup workflow into a small installable binary,
      with GoReleaser-style binary distribution and multiple package-manager entry
      points.
  project-history:
    - >
      The GitHub repository was created in October 2016 and is maintained under the
      caarlos0 account. The project follows the author's usual Go CLI release style,
      with GitHub releases and binary/package installation paths advertised from the
      README.
  related-projects:
    - >
      The project is related to GitHub account and repository maintenance tools, and its
      README links to GoReleaser as part of its release/distribution setup.
  sources:
    - https://api.github.com/repos/caarlos0/fork-cleaner
    - https://api.github.com/repos/caarlos0/fork-cleaner/releases?per_page=20
    - https://github.com/caarlos0/fork-cleaner
    - https://raw.githubusercontent.com/caarlos0/fork-cleaner/main/README.md
  summary:
    - >
      fork-cleaner is a small Go command-line utility for cleaning old and inactive
      forks from a GitHub account. Its official README frames it as an interactive
      maintenance tool that enumerates forked repositories, checks upstream repository
      state, and lets the user pass a GitHub token with repository deletion permissions.
  timeline:
    - '2016: GitHub repository created.'
    - '2021: 2.0-series releases published.'
    - '2026: 2.4.0 release published.'
  usage:
    - >
      Users create a GitHub personal access token with repository and delete-repository
      scopes, pass it with the --token flag, and let fork-cleaner list forked
      repositories oldest first. A --skip-upstream option exists for accounts with many
      forks or GitHub API rate-limit pressure.
related-packages:
  - id: brew:gh
    reason: >
      Choose GitHub CLI when you want a first-party, general GitHub tool and are willing
      to list forks and delete selected repositories manually instead of using
      fork-cleaner's guided inactive-fork cleanup.
    rel: alternative
    sources:
      - https://cli.github.com/manual/gh_repo_list
      - https://cli.github.com/manual/gh_repo_delete
      - https://github.com/caarlos0/fork-cleaner
category: developer-tools
package-manager:
  brew: fork-cleaner
  macports: fork-cleaner
  nix: fork-cleaner
  winget: caarlos0.fork-cleaner
package-manager-url: https://formulae.brew.sh/formula/fork-cleaner
license: MIT
tags:
  - cli
  - fork-cleanup
  - github
  - repository-maintenance
description: Cleans up old and inactive forks on your GitHub account
executables:
  - fork-cleaner
provenance:
  formula: fork-cleaner
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
