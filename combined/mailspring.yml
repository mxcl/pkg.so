id: cask:mailspring
display-name: Mailspring
homepage: https://getmailspring.com/
repo: https://github.com/Foundry376/Mailspring
docs:
  - https://getmailspring.com/
  - https://github.com/Foundry376/Mailspring#readme
  - https://github.com/Foundry376/Mailspring/blob/master/PLUGIN_SYSTEM_ARCHITECTURE.md
config-file-location:
  linux: ~/.config/Mailspring/
  macos: ~/Library/Application Support/Mailspring/
  windows: '%APPDATA%\Mailspring\'
credentials-file-location: null
history:
  adoption-history:
    - >
      Mailspring inherited a community of users and extension developers from Nylas Mail
      while positioning itself as a faster, leaner replacement. It is distributed for
      macOS, Windows, and Linux, including deb, rpm, and Snap formats.
    - >
      Its cross-platform Electron interface, unified inbox, snoozing, send-later
      support, rules, templates, and optional professional features have made it a
      recognizable open-source desktop-mail alternative.
  package-nerd-significance:
    - >
      Mailspring is notable as a long-lived Electron desktop application that replaced a
      JavaScript mail-sync implementation with a native C/C++ engine to reduce resource
      use. Its plugin and theme architecture, GPL-licensed client code, and broad Linux
      packaging make it especially visible to desktop package maintainers.
  project-history:
    - >
      Mailspring was created by one of the original Nylas Mail authors as a maintained
      successor to that project. It retained the extensible TypeScript, Electron, and
      React interface while replacing Nylas Mail's JavaScript synchronization code with
      a C++ engine based on Mailcore2.
    - >
      The application continued as an open-source cross-platform mail client under
      Foundry 376, combining locally running mail synchronization with optional
      account-based cloud features.
  related-projects:
    - Nylas Mail
    - Mailcore2
    - Electron
    - React
    - Mailspring Plugin Starter
    - Mailspring Theme Starter
  sources:
    - https://getmailspring.com/
    - https://github.com/Foundry376/Mailspring#readme
    - https://github.com/Foundry376/Mailspring/blob/master/PLUGIN_SYSTEM_ARCHITECTURE.md
    - https://github.com/Foundry376/Mailspring/security
  summary:
    - >
      Mailspring is an open-source, cross-platform desktop email client derived from
      Nylas Mail. It combines an Electron and React interface with a locally running
      native synchronization engine.
  timeline:
    - '2017: Mailspring emerged as a new, maintained version of Nylas Mail.'
    - '2018: Version 1.5.0 and later added localization support.'
    - >
      Current era: Maintained as a GPL-licensed client with desktop releases for macOS,
      Windows, and Linux.
  usage:
    - >
      Users connect IMAP/SMTP or supported provider accounts and manage multiple
      mailboxes through a unified desktop interface. Common workflows include snoozing,
      scheduled sending, rules, templates, signatures, and extensibility through plugins
      and themes.
    - >
      Mail credentials are stored in the operating system's secure keychain rather than
      a documented standalone credentials file. Mailspring ID setup can be skipped to
      opt out of its cloud-backed features.
category: productivity
