id: brew:fortio
display-name: Fortio
homepage: https://fortio.org/
repo: https://github.com/fortio/fortio
docs:
  - https://github.com/fortio/fortio/wiki/FAQ
  - https://github.com/fortio/fortio#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Fortio's adoption is tied to cloud-native and microservice testing. Its site notes
      its Istio origin and demo presence, the README links Docker images and binary
      releases for many OS/architecture combinations, and the project advertises use by
      Meshery among other consumers.
  package-nerd-significance:
    - >
      Fortio is significant because it packages repeatable latency testing into a single
      static-friendly Go CLI while also exposing server and library surfaces. It sits at
      the intersection of benchmark tools, service-mesh testing, Docker images,
      package-manager installs, and embeddable Go networking components.
  project-history:
    - >
      Fortio started as Istio's load-testing tool and later graduated in 2018 into its
      own open-source project. The official README says it reached 1.0 in June 2018
      after one year of development and 42 incremental releases.
    - >
      The project has continued as a multi-purpose networking and performance toolkit.
      Official materials describe Fortio not only as the fortio command, but also as a
      set of Go packages such as stats, fhttp, dynamic flags, logging, CLI helpers,
      proxying, and related Fortio-family tools.
  related-projects:
    - >
      Fortio is historically related to Istio and compares in its own FAQ ecosystem with
      load generators such as wrk and HTTP debugging services such as httpbin. Related
      Fortio projects include Fortio Proxy, Fortiotel, dflag, log, cli, scli, smap, and
      multicurl.
  sources:
    - https://api.github.com/repos/fortio/fortio
    - https://api.github.com/repos/fortio/fortio/releases?per_page=15
    - https://fortio.org/
    - https://github.com/fortio/fortio
    - https://raw.githubusercontent.com/fortio/fortio/master/README.md
  summary:
    - >
      Fortio is a Go HTTP and gRPC load-testing tool, server, web UI, and embeddable
      library. It runs at a specified query-per-second rate, records latency histograms,
      computes percentiles, and includes echo, proxy, reporting, and debugging server
      features.
  timeline:
    - '2017: GitHub repository created.'
    - '2018: Fortio graduated from Istio tooling and reached 1.0.'
    - '2025: 1.7x release stream continued with frequent releases.'
    - '2026: 1.75.x releases published.'
  usage:
    - >
      The main fortio command can run HTTP or gRPC load tests, start a server with web
      UI and REST API, perform curl-like single requests, run TCP or UDP echo/proxy
      modes, report saved JSON results, and execute scripts. Typical load-test flags
      include target QPS, connection count, duration or call count, histogram
      resolution, headers, payloads, and JSON output.
related-packages:
  - id: brew:wrk
    reason: >
      Choose wrk for a lean HTTP benchmark focused on generating maximum throughput;
      Fortio's official comparison favors Fortio when fixed QPS, exact call counts,
      latency comparisons, or an integrated test server matter.
    rel: alternative
    sources:
      - https://github.com/fortio/fortio/wiki/FAQ
      - https://github.com/wg/wrk
  - id: brew:ghz
    reason: >
      Choose ghz for dedicated gRPC benchmarking with protobuf definitions, reflection,
      call data, streaming methods, and structured performance-test workflows; Fortio is
      broader across HTTP, gRPC, servers, proxies, and network debugging.
    rel: alternative
    sources:
      - https://ghz.sh/docs/intro.html
      - https://ghz.sh/docs/options
      - https://github.com/fortio/fortio
category: networking
package-manager:
