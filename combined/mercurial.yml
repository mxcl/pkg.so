id: brew:mercurial
display-name: Mercurial
homepage: https://mercurial-scm.org/
repo: https://foss.heptapod.net/mercurial/mercurial-devel
docs:
  - https://www.mercurial-scm.org/
  - https://www.mercurial-scm.org/help/commands
  - https://www.mercurial-scm.org/help/topics/config.html
config-file-location:
  unix:
    - ~/.hgrc
    - $XDG_CONFIG_HOME/hg/hgrc
    - ~/.config/hg/hgrc
credentials-file-location:
  unix:
    - ~/.hgrc
    - $XDG_CONFIG_HOME/hg/hgrc
    - ~/.config/hg/hgrc
history:
  adoption-history:
    - >
      Mercurial's adoption history is strongly tied to large repositories and to teams
      that valued a scriptable CLI with a less sprawling user model than Git. Facebook
      selected Mercurial while replacing a Subversion server plus Git mirror, then
      published work on scaling it for a repository with thousands of weekly commits and
      hundreds of thousands of files. That scaling lineage later connected to Mononoke
      and Sapling: Meta's Sapling README says Sapling's CLI was originally based on
      Mercurial and shares aspects of Mercurial's UI and features, while Mononoke is
      described as a Mercurial source-control server for large monorepos.
  project-history:
    - >
      Technically, Mercurial stores project history as a distributed graph of
      changesets. Like Git, it uses SHA-1-derived changeset identifiers, but it
      emphasizes a comparatively small, coherent command set and a clone model where
      most operations are local. The official Mercurial site positions it as a free
      distributed SCM that handles projects of any size, supports many workflows, and
      can be extended.
  sources:
    - https://aosabook.org/en/v1/mercurial.html
    - https://engineering.fb.com/2014/01/07/core-infra/scaling-mercurial-at-facebook/
    - https://github.com/facebook/sapling
    - https://github.com/facebookarchive/mononoke
    - https://www.mercurial-scm.org/
  summary:
    - >
      Mercurial is a distributed source-control management system invoked mainly through
      the hg command. Matt Mackall, later Olivia Mackall, started it in April 2005 after
      Linux kernel developers lost the free BitKeeper arrangement. The Architecture of
      Open Source Applications describes Mercurial and Git as parallel 2005 responses to
      the need for a scalable distributed VCS capable of handling large kernel-sized
      histories; it also notes Mackall's early goals of simplicity, scalability, and
      efficiency.
  usage:
    - >
      For package managers, Mercurial is a classic cross-platform developer tool rather
      than an application-specific CLI. It appears across Homebrew, Debian, Ubuntu,
      Fedora, Arch, Nix, MacPorts, Windows package managers, and others, with hg as the
      primary executable and chg as a command server client for faster repeated
      commands.
related-packages:
  - id: brew:git
    reason: >
      Choose Git when compatibility with the dominant Git hosting and collaboration
      ecosystem matters most; both tools provide full-history distributed repositories
      and local commits.
    rel: alternative
    sources:
      - https://www.mercurial-scm.org/about
      - https://git-scm.com/about
  - id: brew:jj
    reason: >
      Choose Jujutsu for a newer distributed workflow with Git interoperability and
      automatic working-copy commits; Mercurial's official site lists it among similar
      version-control projects.
    rel: alternative
    sources:
      - https://www.mercurial-scm.org/about
      - https://docs.jj-vcs.dev/latest/
  - id: brew:subversion
    reason: >
      Choose Apache Subversion when a centralized client-server repository is required
      instead of Mercurial's full-history-per-clone distributed architecture.
    rel: alternative
    sources:
      - https://www.mercurial-scm.org/about
      - https://subversion.apache.org/
category: developer-tools
package-manager:
  apk: mercurial
  brew: mercurial
  chocolatey: hg
  debian: mercurial
  dnf: mercurial
  macports: mercurial
  nix: mercurial
  pacman: mercurial
  scoop: main/mercurial
  ubuntu: mercurial
  winget: Mercurial.Mercurial
  zypper: mercurial
package-manager-url: https://formulae.brew.sh/formula/mercurial
license: GPL-2.0-or-later
tags:
  - cli
  - distributed-vcs
  - hg
  - mercurial
  - python
  - scm
  - version-control
description: Scalable distributed version control system
executables:
  - chg
  - hg
provenance:
  formula: mercurial
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
