id: brew:hunk
display-name: hunk
homepage: https://hunk.dev/
repo: https://github.com/modem-dev/hunk
docs:
  - https://github.com/modem-dev/hunk/blob/main/docs/agent-workflows.md
  - https://github.com/modem-dev/hunk#readme
  - https://hunk.dev/
config-file-location:
  unix:
    - ~/.config/hunk/config.toml
    - .hunk/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Hunk's official homepage positions it as a diff viewer for humans and agents, with
      install paths through npm, Homebrew, and Nix.
    - >
      The changelog shows rapid early adoption of package-manager concerns in spring
      2026: Homebrew tap automation, prebuilt Windows support, npm packaging fixes, Nix
      outputs, release benchmarks, and performance work for large reviews.
  package-nerd-significance:
    - >
      hunk is package-nerd significant because it packages a modern terminal review UI
      across npm, Homebrew, and Nix while also publishing prebuilt artifacts and an
      embeddable OpenTUI component.
    - >
      Its focus on agent-authored changesets makes it part of the 2020s shift from plain
      diff pagers toward review tools that can display machine-written context beside
      code.
  project-history:
    - >
      The official GitHub repository was created on 2026-03-17, and its README describes
      Hunk as a review-first terminal diff viewer built on OpenTUI and Pierre diffs.
    - >
      The README documents multi-file review navigation, inline AI and agent
      annotations, split and stacked layouts, watch mode, keyboard and mouse support,
      pager support, Git difftool support, Jujutsu and Sapling integration, and an
      OpenTUI component export.
  related-projects:
    - The README compares Hunk with lumen, difftastic, delta, diff-so-fancy, and GNU diff.
    - >
      The project is built on OpenTUI and Pierre diffs and integrates with Git, Jujutsu,
      and Sapling.
  sources:
    - https://api.github.com/repos/modem-dev/hunk
    - https://api.github.com/repos/modem-dev/hunk/releases?per_page=10
    - https://github.com/modem-dev/hunk
    - https://hunk.dev/
    - https://raw.githubusercontent.com/modem-dev/hunk/main/CHANGELOG.md
    - https://raw.githubusercontent.com/modem-dev/hunk/main/README.md
  summary:
    - >
      hunk is a review-first terminal diff viewer for agent-authored changesets. It sits
      in the developer-tools package niche around Git diffs, terminal UIs, code review,
      and AI-agent review workflows.
  timeline:
    - '2026-03-17: The official GitHub repository was created.'
    - '2026-03-20: The changelog lists the 0.1.0 release.'
    - >
      2026-05-12: Version 0.12.0 added Homebrew tap release automation, Windows support,
      Nix outputs, and npm packaging improvements.
    - '2026-06-19: GitHub releases list v0.16.0.'
  usage:
    - >
      The README documents hunk diff for current repository changes, hunk show for
      commits, hunk patch for patch input, hunk pager for Git pager integration, and
      hunk session commands for live agent review workflows.
    - >
      Preferences can be persisted in ~/.config/hunk/config.toml or .hunk/config.toml,
      including theme, layout mode, VCS override, watch behavior, line numbers,
      wrapping, menu bar, agent notes, and transparent background.
related-packages:
  - id: brew:git-delta
    reason: >
      Choose delta when you primarily need a highly configurable syntax-highlighting Git
      pager rather than hunk's interactive whole-changeset review UI and agent
      annotations.
    rel: alternative
    sources:
      - https://github.com/modem-dev/hunk#readme
      - https://dandavison.github.io/delta/
  - id: brew:difftastic
    reason: >
      Choose Difftastic when syntax-aware structural comparison is more important than
      hunk's interactive multi-file review stream and inline agent context.
    rel: alternative
    sources:
      - https://github.com/modem-dev/hunk#readme
      - https://difftastic.wilfred.me.uk/
  - id: brew:diff-so-fancy
    reason: >
      Choose diff-so-fancy for a lightweight formatter that makes ordinary unified diffs
      easier to read without introducing an interactive review interface.
    rel: alternative
    sources:
      - https://github.com/modem-dev/hunk#readme
      - https://github.com/so-fancy/diff-so-fancy#readme
  - id: brew:git
    reason: >
      Configure hunk as Git's pager or difftool to review `git diff` and `git show`
      output inside its terminal interface.
    rel: adjacent_workflow
    sources:
      - https://github.com/modem-dev/hunk#readme
      - https://git-scm.com/docs
  - id: brew:jj
    reason: >
      Use hunk with Jujutsu repositories when you want hunk's review UI over native `jj`
      revsets and diffs; hunk documents automatic Jujutsu checkout detection and pager
      integration.
    rel: adjacent_workflow
    sources:
      - https://github.com/modem-dev/hunk#readme
      - https://docs.jj-vcs.dev/latest/
  - id: brew:sapling
    reason: >
      Use hunk with Sapling workspaces to review native Sapling revisions and configure
      hunk as the Sapling pager.
    rel: adjacent_workflow
    sources:
      - https://github.com/modem-dev/hunk#readme
      - https://sapling-scm.com/docs/introduction/
category: developer-tools
package-manager:
  brew: hunk
  nix: hunk
  scoop: main/hunk
package-manager-url: https://formulae.brew.sh/formula/hunk
license: MIT
tags:
  - agent-workflows
  - cli
  - code-review
  - diff
  - git
  - terminal
  - tui
description: Review-first terminal diff viewer for agent-authored changesets
executables:
  - hunk
provenance:
  formula: hunk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
