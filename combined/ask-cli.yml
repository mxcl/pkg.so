id: brew:ask-cli
display-name: ASK CLI
homepage: https://developer.amazon.com/en-US/docs/alexa/smapi/ask-cli-intro.html
repo: https://github.com/alexa/ask-cli
docs:
  - https://developer.amazon.com/en-US/docs/alexa/smapi/ask-cli-command-reference.html
  - https://developer.amazon.com/en-US/docs/alexa/smapi/ask-cli-intro.html
  - https://developer.amazon.com/en-US/docs/alexa/smapi/manage-credentials-with-ask-cli.html
  - >
    https://developer.amazon.com/en-US/docs/alexa/smapi/quick-start-alexa-skills-kit-command-line-interface.html
config-file-location:
  unix:
    - ~/.ask/cli_config
    - ask-resources.json
credentials-file-location:
  unix: ~/.ask/cli_config
history:
  adoption-history:
    - >
      ASK CLI's adoption is tied to the Alexa developer ecosystem rather than
      general-purpose command-line culture. It is distributed through npm and Homebrew,
      and the official README points users to npm global installation. Homebrew
      analytics show modest but continuing installs, consistent with a specialized
      vendor SDK tool.
    - >
      Amazon's documentation also made ASK CLI the documented workflow for Alexa-hosted
      skills, AWS Lambda backed skills, and skill package management. That gave the tool
      real operational weight for developers who wanted reproducible Alexa deployments
      instead of only using the web console.
  package-nerd-significance:
    - >
      ASK CLI is a classic vendor CLI package: not glamorous, but important because it
      captures a cloud product's deployment contract in a versioned tool. For package
      nerds it is interesting as a Node-distributed CLI that is also bottled by
      Homebrew, and as an example of a platform SDK where local config, cloud
      credentials, generated project files, and API wrappers all meet.
  project-history:
    - >
      The alexa/ask-cli repository was created in December 2016 under the Alexa GitHub
      organization. Amazon's documentation presents it as the command-line front door
      for Alexa skill development, with commands for configuring credentials, creating
      projects from templates, deploying skill packages and Lambda code, and testing
      deployed skills.
    - >
      The v2 line is the modern shape documented by Amazon: `ask configure` initializes
      Amazon developer and optional AWS credentials; `ask new` creates local skill
      projects; `ask deploy` publishes the skill manifest, interaction model, and
      backend resources; and `ask dialog` simulates conversations against a skill.
  related-projects:
    - >
      The README and docs connect ASK CLI to Alexa Skills Kit, SMAPI, AWS Lambda, AWS
      CloudFormation deployers, Alexa-hosted skills, and ASK SDKs.
  sources:
    - https://api.github.com/repos/alexa/ask-cli
    - https://api.github.com/repos/alexa/ask-cli/releases
    - https://developer.amazon.com/en-US/docs/alexa/smapi/ask-cli-command-reference.html
    - https://developer.amazon.com/en-US/docs/alexa/smapi/ask-cli-intro.html
    - https://developer.amazon.com/en-US/docs/alexa/smapi/manage-credentials-with-ask-cli.html
    - >
      https://developer.amazon.com/en-US/docs/alexa/smapi/quick-start-alexa-skills-kit-command-line-interface.html
    - https://formulae.brew.sh/api/formula/ask-cli.json
    - https://github.com/alexa/ask-cli#readme
  summary:
    - >
      ASK CLI is Amazon's command-line interface for the Alexa Skills Kit. It creates,
      manages, tests, and deploys Alexa skills, wrapping both higher-level project
      workflows and lower-level Skill Management API operations.
  timeline:
    - '2016: alexa/ask-cli repository created.'
    - '2023: v2.30.x releases published through GitHub releases.'
    - >
      2024: v2.30.7 published as the latest GitHub release observed in the official
      repository metadata.
    - '2026: Homebrew API lists stable version 2.30.7.'
  usage:
    - >
      A typical session starts with `ask configure`, which opens a browser login to an
      Amazon developer account and creates the `~/.ask/cli_config` profile file.
      Developers then run `ask new`, edit the generated skill-package, lambda,
      infrastructure, and ask-resources files, and deploy with `ask deploy`.
    - >
      The command reference distinguishes high-level commands such as `new`, `deploy`,
      and `configure` from low-level `smapi` commands that expose more direct control
      over Skill Management API calls.
related-packages:
  - id: brew:awscli
    reason: >
      ASK CLI can associate a profile with the standard AWS configuration, so AWS CLI is
      useful for creating and managing the shared AWS profiles used by AWS-backed Alexa
      skill deployments.
    rel: adjacent_workflow
    sources:
      - https://developer.amazon.com/en-US/docs/alexa/smapi/manage-credentials-with-ask-cli.html
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
category: developer-tools
package-manager:
  brew: ask-cli
package-manager-url: https://formulae.brew.sh/formula/ask-cli
license: Apache-2.0
tags:
  - alexa
  - aws
  - cli
  - deployment
  - developer-tools
  - skills-kit
  - smapi
description: CLI tool for Alexa Skill Kit
executables:
  - ask
provenance:
  formula: ask-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
