id: brew:ansible-language-server
display-name: Ansible Language Server
homepage: https://github.com/ansible/vscode-ansible
repo: https://github.com/ansible/vscode-ansible
docs:
  - https://docs.ansible.com/projects/vscode-ansible/als
  - https://docs.ansible.com/projects/vscode-ansible/configuration
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project follows the wider editor shift toward Language Server Protocol
      support: instead of every editor implementing Ansible-specific YAML behavior
      independently, the server centralizes Ansible semantics and lets multiple editors
      consume them.
    - >
      Homebrew packaging makes the NPM-published language server easy to install as a
      standalone executable for editors such as Neovim or Emacs, where users often wire
      language servers by path.
  package-nerd-significance:
    - >
      This package is a nice example of a GUI-adjacent tool becoming a standalone CLI
      dependency. Although born from editor integration, the language server is valuable
      to package managers because LSP tooling expects real executables discoverable on
      PATH.
    - >
      Its migration into the vscode-ansible repository is also notable: the source tree
      is unified with the main extension, while the language server remains separately
      releasable and packageable.
  project-history:
    - >
      The separate ansible-language-server repository now states that the codebase is
      included in the Ansible VS Code Extension repository. The active source repository
      for the Homebrew formula is therefore ansible/vscode-ansible.
    - >
      The language server is documented as a reusable server rather than only a VS Code
      internals package. Its docs say it is used by the Ansible extension for VS
      Code/Codium, Vim/Neovim integrations, and Emacs LSP clients, and that releases are
      published to npm.
  related-projects:
    - ansible/vscode-ansible contains the active codebase and VS Code extension.
    - ansible-lint supplies linting behavior surfaced by editor integrations.
    - >
      yaml-language-server and editor LSP clients are adjacent pieces in typical Ansible
      editor setups.
  sources:
    - https://docs.ansible.com/projects/vscode-ansible/als/
    - https://github.com/ansible/ansible-language-server
    - https://github.com/ansible/vscode-ansible
    - https://github.com/ansible/vscode-ansible/issues/1134
    - https://www.npmjs.com/package/@ansible/ansible-language-server
  summary:
    - >
      Ansible Language Server is the LSP server used by editor integrations to provide
      Ansible-aware syntax highlighting, validation, linting, completion, documentation
      references, and navigation.
  timeline:
    - '2021: Early 1.x tags appear for the Ansible language-server/editor integration line.'
    - >
      2024: Maintainers decide to merge ansible-language-server back into the
      vscode-ansible repository while keeping separate releases.
    - '2024: The release line moves into calendar-style 24.x versions.'
    - '2026: NPM and Homebrew carry 26.x releases of the standalone language server.'
  usage:
    - >
      In practice, users rarely run the language server directly unless configuring an
      editor. The server is launched by editor clients and uses the local Ansible
      tooling stack to provide validation, linting, completion, and documentation lookup
      for playbooks, roles, and collections.
    - >
      For VS Code users it is bundled into the Red Hat Ansible extension experience; for
      terminal-editor users, the packaged `ansible-language-server` executable is the
      useful artifact.
related-packages:
  - id: brew:ansible-lint
    reason: >
      Ansible Language Server runs ansible-lint in the background to present lint
      findings as editor diagnostics, unless lint support is disabled.
    rel: adjacent_workflow
    sources:
      - https://docs.ansible.com/projects/vscode-ansible/als/
      - https://docs.ansible.com/projects/lint/usage/
  - id: brew:ansible
    reason: >
      The language server requires a local Ansible installation and uses its modules and
      collections to provide Ansible-aware editing features.
    rel: adjacent_workflow
    sources:
      - https://docs.ansible.com/projects/vscode-ansible/als/
      - https://docs.ansible.com/projects/ansible/latest/index.html
  - id: brew:ansible-creator
    reason: >
      In the official VS Code authoring workflow, Ansible Creator scaffolds projects and
      resources that are then edited with language-server completion and validation.
    rel: adjacent_workflow
    sources:
      - https://docs.ansible.com/projects/creator/installing/
      - https://docs.ansible.com/projects/vscode-ansible/
category: developer-tools
package-manager:
  brew: ansible-language-server
  nix: ansible-language-server
package-manager-url: https://formulae.brew.sh/formula/ansible-language-server
license: MIT
tags:
  - ansible
  - cli
  - developer-tools
  - editor
  - language-server
  - lsp
  - npm
  - vscode
description: Language Server for Ansible Files
executables:
  - ansible-language-server
provenance:
  formula: ansible-language-server
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
