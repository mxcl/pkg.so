id: brew:ffind
display-name: friendly-find
homepage: https://github.com/sjl/friendly-find
repo: https://github.com/sjl/friendly-find
docs:
  - https://github.com/sjl/friendly-find
  - https://github.com/sjl/friendly-find#readme
config-file-location:
  unix: .ffignore
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README includes Homebrew installation instructions, and the Homebrew
      formula packages it as ffind with stable version 1.0.1. Its adoption is mainly as
      a niche command-line convenience for users who want friendlier defaults around
      recursive file searches and ignore handling.
  package-nerd-significance:
    - >
      friendly-find is package-manager-shaped: a single CLI with documented Homebrew
      installation, Unix-style ignore files, and behavior inspired by familiar search
      tools such as find and ack.
  project-history:
    - >
      Steve Losh's README describes friendly-find as a prototype and explicitly frames
      ffind to find as ack is to grep. The GitHub repository was created in 2012 and
      remains the official project home supplied by the package metadata.
  related-projects:
    - The README compares ffind with find(1) and ack.
  sources:
    - https://api.github.com/repos/sjl/friendly-find
    - https://formulae.brew.sh/api/formula/ffind.json
    - https://github.com/sjl/friendly-find
    - https://raw.githubusercontent.com/sjl/friendly-find/master/README.markdown
  summary:
    - >
      friendly-find is a Python command-line file finder named ffind, intended as a more
      usable replacement for find(1).
  timeline:
    - '2012: GitHub repository created.'
    - '2016: README copyright notes Steve Losh and contributors.'
    - '2022: GitHub repository last pushed according to GitHub metadata.'
    - '2026: Homebrew formula reports stable version 1.0.1.'
  usage:
    - >
      ffind searches for PATTERN under a root directory, with options for depth, symlink
      following, null-separated output, literal or regular-expression matching, case
      sensitivity, ignore modes, size filters, and file type filters. The README
      documents .ffignore syntax for project-local ignore patterns.
related-packages:
  - id: brew:fd
    reason: >
      Choose fd for a modern, actively developed find alternative with parallel
      traversal, intuitive syntax, and built-in Git ignore handling.
    rel: alternative
    sources:
      - https://github.com/sjl/friendly-find
      - https://github.com/sharkdp/fd
  - id: brew:findutils
    reason: >
      Choose GNU findutils when you need find's full expression language or its
      accompanying xargs and locate utilities rather than ffind's opinionated
      common-case interface.
    rel: alternative
    sources:
      - https://github.com/sjl/friendly-find
      - https://www.gnu.org/software/findutils/manual/html_mono/find.html
category: developer-tools
package-manager:
  brew: ffind
package-manager-url: https://formulae.brew.sh/formula/ffind
license: GPL-3.0-only
tags:
  - cli
  - file-search
  - find
  - ignore-files
  - python
description: Friendlier find
executables:
  - ffind
provenance:
  formula: ffind
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
