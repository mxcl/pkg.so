id: brew:cfn-lint
display-name: cfn-lint
homepage: https://github.com/aws-cloudformation/cfn-lint/
repo: https://github.com/aws-cloudformation/cfn-lint
docs:
  - https://github.com/aws-cloudformation/cfn-lint/tree/main/docs/getting_started
  - https://github.com/aws-cloudformation/cfn-lint#readme
config-file-location:
  unix:
    - .cfnlintrc
    - .cfnlintrc.yaml
    - .cfnlintrc.yml
    - ~/.cfnlintrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation docs include pip, Homebrew, Docker, and editor integrations
      for Atom, Emacs, Vim or Neovim, Sublime, Visual Studio Code, and IntelliJ IDEA.
      The README also links a GitHub Marketplace action and an online demo, showing
      adoption across local development and CI workflows.
    - >
      The package metadata in this batch shows cfn-lint packaged for Homebrew and
      openSUSE, while the official README shows PyPI as the primary distribution
      channel. For CloudFormation users, it became the expected preflight check before
      deploying templates.
  package-nerd-significance:
    - >
      For package nerds, cfn-lint is notable because it packages a fast-moving cloud
      provider schema surface into an installable CLI. The frequent official releases
      that update CloudFormation schemas are the interesting bit: package freshness
      directly affects whether the linter recognizes new AWS resource types and
      properties.
    - >
      It also sits at the intersection of several packaging channels: Python packaging
      for the upstream tool, Homebrew for macOS-heavy infrastructure teams, containers
      for pinned CI runs, and editor plugins for live feedback.
  project-history:
    - >
      The official GitHub repository was created under the aws-cloudformation
      organization in April 2018 and describes the tool as validating CloudFormation
      templates against AWS CloudFormation resource provider schemas and extra checks.
      Its README also documents support for AWS Serverless Application Model templates
      by transforming SAM before linting.
    - >
      The project has accumulated a large rule set, optional graph, JUnit, and SARIF
      output dependencies, editor integrations, a GitHub Action, and frequent
      schema-update releases. That release pattern reflects CloudFormation itself: the
      linter must track AWS service and resource schema changes continuously rather than
      behaving like a static syntax checker.
  related-projects:
    - >
      AWS CloudFormation provides the template language and resource provider schemas
      cfn-lint validates against.
    - >
      AWS Serverless Application Model templates are transformed before linting,
      according to the official README.
    - >
      CloudFormation Guard and CloudFormation Registry are adjacent AWS CloudFormation
      tools referenced by the project's community and options.
  sources:
    - https://api.github.com/repos/aws-cloudformation/cfn-lint
    - https://github.com/aws-cloudformation/cfn-lint
    - https://github.com/aws-cloudformation/cfn-lint/
    - https://github.com/aws-cloudformation/cfn-lint/tree/main/docs/getting_started
    - https://github.com/aws-cloudformation/cfn-lint#readme
    - https://formulae.brew.sh/api/formula/cfn-lint.json
    - https://api.github.com/repos/aws-cloudformation/cfn-lint/releases
    - https://github.com/aws-cloudformation/cfn-lint#configuration
  summary:
    - >
      cfn-lint is the AWS CloudFormation linter for validating JSON and YAML templates
      against CloudFormation resource provider schemas and additional best-practice
      checks. It is a Python command-line tool, but its real job is to keep
      infrastructure-as-code feedback local, scriptable, and close to the editor or CI
      system.
  timeline:
    - '2018: The aws-cloudformation/cfn-lint repository is created on GitHub.'
    - '2026: Official releases continue to publish frequent CloudFormation schema updates.'
    - >
      2026: The README documents Python 3.10 through 3.14 support, optional extras,
      Homebrew installation, Docker usage, editor integrations, and CI outputs.
  usage:
    - >
      Typical use is `cfn-lint template.yaml`, optionally with multiple templates, shell
      globs, regions, output formats, custom rules, ignored checks, or SARIF and JUnit
      outputs for CI. The documented configuration files are `.cfnlintrc`,
      `.cfnlintrc.yaml`, `.cfnlintrc.yml`, and `~/.cfnlintrc`.
    - >
      cfn-lint can update or patch CloudFormation specs, build DOT graphs, validate
      against CloudFormation Registry schemas, and tune exit-code severity. It is best
      understood as a local policy and schema feedback tool for CloudFormation authors,
      not as an AWS deployment client.
related-packages:
  - id: brew:cloudformation-guard
    reason: >
      Add CloudFormation Guard after cfn-lint when templates also need
      organization-specific policy-as-code checks beyond schema and best-practice
      validation.
    rel: adjacent_workflow
    sources:
      - https://github.com/aws-cloudformation/cfn-lint#readme
      - https://docs.aws.amazon.com/cfn-guard/latest/ug/what-is-guard.html
      - https://github.com/aws-cloudformation/aws-cloudformation-templates#readme
category: cloud-infrastructure
package-manager:
  brew: cfn-lint
  zypper: python313-cfn-lint
package-manager-url: https://formulae.brew.sh/formula/cfn-lint
license: MIT-0
tags:
  - aws
  - cli
  - cloudformation
  - infrastructure-as-code
  - linting
description: Validate CloudFormation templates against the CloudFormation spec
executables:
  - cfn-lint
provenance:
  formula: cfn-lint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
