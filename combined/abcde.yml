id: brew:abcde
display-name: abcde
homepage: https://abcde.einval.com
repo: https://git.einval.com/git/abcde.git
docs:
  - https://abcde.einval.com/
  - https://abcde.einval.com/wiki
config-file-location:
  unix:
    - ~/.abcde.conf
    - /etc/abcde.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      abcde became a familiar Unix package because it automated a full CD-to-files
      pipeline around existing encoders and metadata tools rather than replacing them.
      The supplied package-manager metadata lists it across APK, Homebrew, Debian,
      Fedora, MacPorts, Nix, Ubuntu, and zypper.
  package-nerd-significance:
    - >
      abcde is package-nerd material because it is a classic glue program: a shell front
      end that depends on external encoders, CD readers, metadata services, and taggers,
      making distro dependency choices and sensible defaults central to the user
      experience.
  project-history:
    - >
      The official abcde wiki records multiple contributors over the years, including
      Robert Woodcock, Jesus Climent, Colin Tuckley, Steve McIntyre, Andrew Strong, and
      others, with Steve McIntyre listed as current maintainer. The project moved older
      release hosting away from Google Code and names abcde.einval.com/download as the
      canonical download location.
  related-projects:
    - >
      abcde orchestrates CDDB, MusicBrainz, CD-TEXT, audio encoders such as LAME, FLAC,
      Ogg/Vorbis, Opus, and related tagging or replaygain tools.
  sources:
    - >
      Official wiki, official download archive, official gitweb summary, official
      manpage, and source_facts.package-manager.
  summary:
    - >
      abcde, short for A Better CD Encoder, is a long-running shell-based audio CD
      ripping and encoding workflow. Its official wiki describes it as a tool that grabs
      an entire CD, looks up metadata through CDDB or MusicBrainz, encodes to formats
      such as Ogg/Vorbis, MP3, FLAC, AAC, Opus, and others, tags files, and produces
      sensible filenames.
  timeline:
    - '2014: Older 2.4.x and 2.5.x tarballs appear in the official download archive.'
    - '2015: 2.7 release line appears in the official download archive.'
    - '2018: 2.9 release line appears in the official download archive.'
    - '2019: 2.9.3 released as the most recent official tarball listed by the wiki.'
    - '2021: Git repository summary shows later development commits after 2.9.3.'
  usage:
    - >
      Typical use is a single command that performs metadata lookup, reading, optional
      normalization, encoding, tagging, moving, replaygain, playlist generation, and
      cleanup. The manpage documents configuration through /etc/abcde.conf,
      $HOME/.abcde.conf, and an optional extra file passed with -c.
related-packages:
  - id: brew:flac
    reason: >
      Use FLAC with abcde when you want its documented lossless CD-ripping output; abcde
      delegates FLAC encoding to an external encoder.
    rel: adjacent_workflow
    sources:
      - https://abcde.einval.com/wiki/
      - https://xiph.org/flac/
  - id: brew:lame
    reason: >
      Use LAME as abcde's external MP3 encoder when broad lossy-format playback
      compatibility is the priority.
    rel: adjacent_workflow
    sources:
      - https://abcde.einval.com/wiki/
      - https://lame.sourceforge.io/
  - id: brew:opus-tools
    reason: >
      Use opus-tools with abcde to produce the Opus output format supported by the
      ripping workflow.
    rel: adjacent_workflow
    sources:
      - https://abcde.einval.com/wiki/
      - https://opus-codec.org/docs/opus-tools/
  - id: brew:vorbis-tools
    reason: Use vorbis-tools with abcde for its traditional Ogg Vorbis encoding workflow.
    rel: adjacent_workflow
    sources:
      - https://abcde.einval.com/wiki/
      - https://xiph.org/vorbis/
category: media
package-manager:
  apk: abcde
  brew: abcde
  debian: abcde
  dnf: abcde
  macports: abcde
  nix: abcde
  ubuntu: abcde
  zypper: abcde
package-manager-url: https://formulae.brew.sh/formula/abcde
license: GPL-2.0-or-later
tags:
  - audio
  - cd-ripping
  - cli
  - encoding
  - flac
  - mp3
  - musicbrainz
  - ogg
description: Better CD Encoder
executables:
  - abcde
  - abcde-musicbrainz-tool
  - cddb-tool
provenance:
  formula: abcde
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
