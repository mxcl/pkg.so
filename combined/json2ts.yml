id: brew:json2ts
display-name: json-schema-to-typescript
homepage: https://github.com/bcherny/json-schema-to-typescript
repo: https://github.com/bcherny/json-schema-to-typescript
docs:
  - https://github.com/bcherny/json-schema-to-typescript#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The repository had thousands of GitHub stars by 2026 and the npm registry recorded
      more than one hundred published versions. Its adoption came from teams that
      already had JSON Schema contracts and wanted generated `.d.ts` files rather than
      hand-maintained TypeScript interfaces.
  package-nerd-significance:
    - >
      json2ts is package-nerd notable because it is a bridge between schema-first JSON
      tooling and TypeScript's static type ecosystem. It shows how a Node package can
      become a CLI distributed through npm and system package managers when the
      executable is useful outside JavaScript projects.
  project-history:
    - >
      Boris Cherny's repository was created in March 2016, and the npm package metadata
      records the first `0.1.0` publication on March 31, 2016. The project appeared as
      TypeScript was becoming a common way to describe JavaScript APIs while JSON Schema
      remained a common contract format for data validation.
    - >
      The package evolved from a CLI into both a CLI and programmatic API. Its README
      documents `json2ts` usage for stdin, files, directories, globbed schema trees,
      YAML input, and library calls such as `compile` and `compileFromFile`.
  related-projects:
    - >
      The project is related to JSON Schema, TypeScript declaration generation,
      `typescript-json-schema` for the reverse direction, and schema-aware API tooling
      that uses JSON Schema as the source of truth.
  sources:
    - https://formulae.brew.sh/formula/json2ts
    - https://github.com/bcherny/json-schema-to-typescript
    - https://github.com/bcherny/json-schema-to-typescript/blob/master/package.json
    - https://registry.npmjs.org/json-schema-to-typescript
    - https://www.npmjs.com/package/json-schema-to-typescript
  summary:
    - >
      json-schema-to-typescript is a TypeScript and Node.js code-generation tool that
      compiles JSON Schema documents into TypeScript declaration files. The Homebrew
      package is named json2ts after its command-line executable.
  timeline:
    - '2016-03-22: The GitHub repository was created.'
    - '2016-03-31: npm recorded version 0.1.0 for `json-schema-to-typescript`.'
    - '2016-07-22: npm recorded version 1.0.0.'
    - '2025-01-14: npm metadata showed package modification after many published versions.'
  usage:
    - >
      The common package-manager path is to install the Node package or Homebrew
      formula, then run `json2ts` to transform JSON or YAML schemas into TypeScript
      declarations. It can also be embedded in build scripts through the JavaScript API.
related-packages:
  - id: brew:quicktype
    reason: >
      quicktype is the broader alternative when users need TypeScript or other target
      languages, model converters, or type inference from sample JSON; json2ts is more
      narrowly centered on generating TypeScript declarations from JSON Schema.
    rel: alternative
    sources:
      - https://github.com/bcherny/json-schema-to-typescript#readme
      - https://github.com/glideapps/quicktype#readme
category: developer-tools
package-manager:
