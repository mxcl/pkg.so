id: brew:ios-class-guard
display-name: iOS Class Guard
homepage: https://github.com/Polidea/ios-class-guard/
repo: https://github.com/Polidea/ios-class-guard
docs:
  - https://github.com/Polidea/ios-class-guard#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package has a narrower adoption profile than the other tools in this batch.
      Homebrew packages it from the 0.8 tag, while the upstream README itself recommends
      Homebrew as the simple installation path and a HEAD install for development
      snapshots.
  package-nerd-significance:
    - >
      For package catalogs, ios-class-guard is interesting because it packages a fragile
      intersection of reverse-engineering technique, Mach-O parsing, Xcode project
      mutation, CocoaPods integration, and mobile-app release process. It is not a
      general-purpose security layer; it is a snapshot of how Objective-C metadata
      exposure shaped iOS tooling.
  project-history:
    - >
      Polidea's repository was created for an iOS-specific obfuscation workflow built on
      top of the class-dump lineage. The README documents version 0.8, Homebrew
      installation, CocoaPods support, XIB and storyboard rewriting, JSON symbol maps,
      crash-report reversal, and dSYM symbol restoration workflows.
    - >
      The repository notes that it is no longer maintained. That status matters
      historically because the tool belongs to an older Objective-C-heavy iOS security
      era, before Swift and newer Apple build-system conventions changed many
      app-hardening workflows.
  related-projects:
    - >
      The upstream README names class-dump as the base project and links an
      ios-class-guard-example repository for demonstrating obfuscated and non-obfuscated
      app headers. The workflow also intersects with CocoaPods, Xcode precompiled
      headers, crash-reporting tools, and dSYM handling.
  sources:
    - https://formulae.brew.sh/formula/ios-class-guard
    - https://github.com/Polidea/ios-class-guard
    - https://raw.githubusercontent.com/Polidea/ios-class-guard/master/README.md
  summary:
    - >
      iOS Class Guard is a command-line Objective-C obfuscator for Mach-O executables.
      Its README describes it as an extension of class-dump that renames Objective-C
      classes, protocols, properties, methods, and ivars by generating symbol maps used
      during compilation.
  timeline:
    - "2014: GitHub repository created for Polidea's iOS Class Guard project."
    - '2015: Version 0.8 tag used by Homebrew as the stable source archive.'
    - 'After 2015: Repository README marked the project as no longer maintained.'
  usage:
    - >
      The intended workflow is to run the tool against a compiled app, generate a
      symbols header and JSON map, include the generated header during compilation, and
      preserve the JSON map so crash reports and dSYMs can be translated back when
      needed. The README stresses that the result is not a complete security solution,
      only a way to make runtime inspection and code analysis harder.
related-packages: []
category: security
