id: brew:lux
display-name: Lux
homepage: https://github.com/iawia002/lux
repo: https://github.com/iawia002/lux
docs:
  - https://github.com/iawia002/lux#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lux became one of the more visible small video-downloader CLIs in the Go
      ecosystem. Its official GitHub metadata showed roughly 31,000 stars and 3,300
      forks in July 2026, which is unusually broad adoption for a single-purpose
      downloader maintained outside a large foundation.
    - >
      Package-manager adoption followed the usual downloader path: source install with
      `go install`, binary releases on GitHub, and downstream formulas or manifests for
      Homebrew, Scoop, Chocolatey, Arch, Void, Nix, and other systems.
  package-nerd-significance:
    - >
      Lux is package-nerd interesting because it is a modern Go CLI distributed through
      many package managers while still tracking fast-changing video-site extractors.
      That makes it representative of tools where the package version, upstream release
      cadence, and external website compatibility all matter.
  project-history:
    - >
      The public Lux repository was created in February 2018. The project grew around a
      single `lux [OPTIONS] URL [URL...]` workflow that inspects stream formats,
      downloads selected formats, resumes downloads, handles playlists, and can pass
      downloads to aria2.
  related-projects:
    - FFmpeg is used for final file merging.
    - aria2 can be used for downloading through Lux's documented aria2 options.
  sources:
    - https://api.github.com/repos/iawia002/lux
    - https://api.github.com/repos/iawia002/lux/releases?per_page=5
    - https://github.com/iawia002/lux#readme
  summary:
    - >
      Lux is a Go-based command-line video downloader. Its README positions it as a fast
      and simple downloader with package-manager installation paths across Homebrew, Go,
      Arch, Void, Scoop, Chocolatey, and Cask.
  timeline:
    - '2018: Public `iawia002/lux` repository created.'
    - '2023: v0.21.0 and v0.22.0 releases published.'
    - '2024: v0.24.1 release published.'
  usage:
    - >
      The README documents `lux URL` for direct download, `lux -i URL` to list available
      streams without downloading, `lux -f stream URL` to choose a specific stream, and
      `lux -p URL` for playlists. It also documents cookies, proxy options, retries,
      multithreaded downloads, custom referrers, and output naming.
    - >
      FFmpeg is documented as a prerequisite for final media merging rather than for the
      download itself, which is a common packaging detail for media downloaders.
related-packages:
  - id: brew:yt-dlp
    reason: >
      Choose yt-dlp for its broader extractor ecosystem and extensive
      format/post-processing controls; Lux offers a simpler Go-based downloader and
      explicitly lists youtube-dl-family tools as comparable projects.
    rel: alternative
    sources:
      - https://github.com/iawia002/lux#readme
      - https://github.com/yt-dlp/yt-dlp#readme
  - id: brew:you-get
    reason: >
      Choose you-get for a Python-based downloader with strong coverage of both Chinese
      and international media sites; Lux lists it as a similar project and provides a Go
      implementation.
    rel: alternative
    sources:
      - https://github.com/iawia002/lux#readme
      - https://github.com/soimort/you-get#readme
  - id: brew:ffmpeg
    reason: >
      Lux documents FFmpeg as the prerequisite that merges downloaded audio and video
      streams into the final media file.
    rel: adjacent_workflow
    sources:
      - https://github.com/iawia002/lux#readme
      - https://ffmpeg.org/documentation.html
  - id: brew:aria2
    reason: >
      Lux can send transfers to an aria2 RPC server for delegated downloading, with
      multipart merging handled separately.
    rel: adjacent_workflow
    sources:
      - https://github.com/iawia002/lux#readme
      - https://aria2.github.io/manual/en/html/aria2c.html
category: media
package-manager:
  brew: lux
  macports: lux
  nix: lux
  scoop: main/lux
  winget: JackDevey.Lux
  zypper: lux
package-manager-url: https://formulae.brew.sh/formula/lux
license: MIT
tags:
  - cli
  - download-manager
  - go
  - media
  - video-downloader
description: Fast and simple video downloader
executables:
  - lux
provenance:
  formula: lux
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
