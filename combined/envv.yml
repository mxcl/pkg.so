id: brew:envv
display-name: envv
homepage: https://github.com/jakewendt/envv
repo: https://github.com/jakewendt/envv
docs:
  - https://github.com/jakewendt/envv#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      envv never became a broad ecosystem package, but its continued packaging in
      Homebrew keeps a 1990s Unix environment-management tool installable on modern
      developer machines. The README's example is aimed at commercial or site-local
      software that needs PATH entries and home variables set consistently for many user
      shells.
  package-nerd-significance:
    - >
      envv is interesting as a compact survivor from the era when Unix shops had to
      support several interactive shells at once. For package-manager history, it is a
      reminder that environment setup before modules, direnv, and modern shell
      frameworks often meant tiny C tools that printed shell code.
  project-history:
    - >
      The README traces envv back to David F. Skoll of Roaring Penguin Software, with
      version 1.0 dated February 8, 1994. Early releases added zsh recognition, a
      `choose` directive, local variables, stdin directives, and fixes around path
      comparison and environment persistence.
    - >
      The GitHub-hosted copy records a later 2011 license change to MIT and a
      segmentation fault fix, but otherwise presents envv as a deliberately small
      utility: build with `make`, copy the `envv` executable into a system directory,
      and consult the bundled `envv.1` manual page.
  related-projects:
    - >
      envv overlaps conceptually with shell profile snippets, environment modules, and
      later per-directory environment tools, but it solves a narrower problem by
      emitting commands for multiple shells.
  sources:
    - https://github.com/jakewendt/envv
    - https://raw.githubusercontent.com/jakewendt/envv/master/README
  summary:
    - >
      envv is a small C utility for generating shell-specific commands that set
      environment variables and edit colon-separated paths. Its niche is old-school Unix
      software setup: one script can be sourced by users of csh, tcsh, bash, sh, ksh,
      and zsh without hard-coding separate initialization logic for each shell.
  timeline:
    - '1994-02-08: Version 1.0 first released.'
    - '1994-03-22: Version 1.1 added zsh recognition and the `choose` directive.'
    - >
      1994-04-18: Version 1.2 added local variables, command-line options, and stdin
      directives.
    - '1995-07-11: Version 1.6 fixed path comparison behavior.'
    - '2011-07-14: Version 1.7 changed the license to MIT and fixed a segmentation fault.'
  usage:
    - >
      A typical envv setup script evaluates commands such as `envv add PATH
      /usr/local/foobar/bin` and `envv set FOOHOME /usr/local/foobar`. Users source that
      script from their preferred shell, allowing system-wide software moves without
      each user editing `.cshrc`, `.profile`, or similar files by hand.
related-packages:
  - id: brew:direnv
    reason: >
      Choose direnv when variables should load and unload automatically on directory
      changes with explicit `.envrc` authorization; choose envv when one centrally
      maintained setup script must emit compatible commands for several shell families.
    rel: alternative
    sources:
      - https://github.com/jakewendt/envv#readme
      - https://direnv.net/
      - https://direnv.net/docs
category: developer-tools
package-manager:
  brew: envv
package-manager-url: https://formulae.brew.sh/formula/envv
license: MIT
tags:
  - cli
  - configuration
  - environment-variables
  - shell
description: Shell-independent handling of environment variables
executables:
  - envv
provenance:
  formula: envv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
