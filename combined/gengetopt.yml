id: brew:gengetopt
display-name: GNU Gengetopt
homepage: https://www.gnu.org/software/gengetopt/
repo: https://git.savannah.gnu.org/cgit/gengetopt.git
docs:
  - https://www.gnu.org/software/gengetopt
  - https://www.gnu.org/software/gengetopt/gengetopt.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gengetopt's adoption came through the GNU toolchain ecosystem: GNU FTP hosted
      regular tarball releases from the early 2000s through the 2.23 release in 2019,
      and the tool appears in Unix package managers as a code generator for projects
      that want generated C parsers without taking on a larger framework.
  package-nerd-significance:
    - >
      Gengetopt is a classic small GNU build dependency: it is rarely the star of a
      system, but it sits in source-release and distribution workflows where
      reproducible generated C code is easier to audit and package than bespoke argument
      parsers.
  project-history:
    - >
      The Savannah README says Gengetopt was originally written by Roberto Arturo Tena
      Sanchez and later maintained by Tomas Volf. The manual positions it as a tool for
      C and C++ programmers and documents .ggo input files, generated parsers, generated
      help output, configuration-file parsing, multiple parsers, and operation on
      systems without getopt_long.
  related-projects:
    - >
      Related tools and standards include getopt_long, GNU Coding Standards, GNU
      Autoconf, GNU Automake, and Doxygen comments in generated files.
  sources:
    - https://formulae.brew.sh/formula/gengetopt
    - https://ftp.gnu.org/gnu/gengetopt/
    - https://git.savannah.gnu.org/cgit/gengetopt.git/plain/NEWS?h=master
    - https://git.savannah.gnu.org/cgit/gengetopt.git/plain/README?h=master
    - https://www.gnu.org/software/gengetopt/
    - https://www.gnu.org/software/gengetopt/gengetopt.html
  summary:
    - >
      GNU Gengetopt is a GNU programming tool that generates C command-line option
      parsers from declarative option descriptions. Its generated code uses getopt_long
      and fills a struct, saving C and C++ programmers from hand-writing the same option
      parsing, validation, help, and configuration-file plumbing.
  timeline:
    - '2003: GNU FTP listed gengetopt 2.10 tarballs.'
    - '2009: version 2.22.4 switched the project repository from CVS to Git.'
    - >
      2012: version 2.22.6 added versiontext and strict-hidden support while fixing Mac
      OS X compilation.
    - '2019: GNU FTP listed the 2.23 release.'
  usage:
    - >
      Practitioners write a .ggo file describing short and long options, defaults,
      required values, groups, modes, and help text, then run gengetopt to produce C
      source and header files. Autoconf and Automake projects use it when generated
      parser code is preferable to a hand-maintained getopt_long loop.
related-packages: []
category: developer-tools
package-manager:
  apk: gengetopt
  brew: gengetopt
  debian: gengetopt
  dnf: gengetopt
  macports: gengetopt
  nix: gengetopt
  pacman: gengetopt
  ubuntu: gengetopt
  zypper: gengetopt
package-manager-url: https://formulae.brew.sh/formula/gengetopt
license: GPL-3.0-or-later
tags:
  - c
  - cli
  - code-generation
  - getopt
description: Generate C code to parse command-line arguments via getopt_long
executables:
  - gengetopt
provenance:
  formula: gengetopt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
