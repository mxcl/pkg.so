id: brew:mdfried
display-name: mdfried
homepage: https://github.com/benjajaja/mdfried
repo: https://github.com/benjajaja/mdfried
docs:
  - https://github.com/benjajaja/mdfried#readme
config-file-location:
  unix: ~/.config/mdfried/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      mdfried is newer than mdcat and mdless but already has package-manager presence.
      The input facts list Homebrew, MacPorts, Nix, and pacman-family packaging, while
      the README advertises Cargo installation, a Nix flake, release binaries, `.deb`
      files, and Mac and Windows binaries.
    - >
      Crates.io reported the crate's creation in December 2024 and about 15,000 total
      downloads by 2026. Homebrew's formula tracked stable version 0.22.4 with install
      analytics, evidence of early but real CLI-tool adoption.
  package-nerd-significance:
    - >
      mdfried is notable because it pushes terminal Markdown viewing into the modern
      graphics-terminal era. Packaging it involves more than installing a text filter:
      the formula includes chafa and GTK/glib-related dependencies through Homebrew, and
      runtime behavior varies by terminal image protocol.
    - >
      For package nerds, it is also a fast-moving Rust package that crosses Cargo, Nix,
      Homebrew, binary releases, and Debian-style artifacts while still pre-1.0.
  project-history:
    - >
      The GitHub repository was created in December 2024, and the crates.io package was
      first published later that month. The project iterated rapidly through 2025 and
      2026, reaching the 0.22 series by June 2026.
    - >
      The changelog shows the tool expanding from a visual Markdown viewer into a
      featureful terminal document browser: tree-sitter Markdown parsing, link
      navigation, URL and GitHub README opening, syntax highlighting, Mermaid rendering,
      image opening, OSC 8 clickable links, and experimental PDF support all appear in
      the documented 2026 releases.
  related-projects:
    - >
      mdfried overlaps with mdcat and mdless as a terminal Markdown viewer, but it
      emphasizes large rendered headings, rich image support, pager navigation, and
      terminal graphics protocols.
    - >
      Its README references ratatui-image, chafa, arborium, mermaid rendering, Sixel,
      kitty, and iTerm2 protocols as important parts of its ecosystem.
  sources:
    - https://crates.io/crates/mdfried
    - https://formulae.brew.sh/formula/mdfried
    - https://github.com/benjajaja/mdfried#readme
    - https://github.com/benjajaja/mdfried/blob/master/assets/docs/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      mdfried is a Rust terminal Markdown viewer and pager focused on rich terminal
      graphics. Its distinctive feature is rendering Markdown headings as genuinely
      larger text or images when the terminal supports a graphics or text-sizing
      protocol.
  timeline:
    - '2024: GitHub repository and crates.io package appeared in December.'
    - '2026: Version 0.18.0 used tree-sitter/tree-sitter-md for Markdown parsing.'
    - '2026: Version 0.20.1 added URL and GitHub README opening.'
    - '2026: Version 0.21.0 added code syntax highlighting and Mermaid rendering.'
    - '2026: Version 0.22.0 added OSC 8 clickable links.'
  usage:
    - >
      The basic invocation is `mdfried ./path/to.md`. It can also open URLs that serve
      Markdown and `github:owner/repo` targets when a README exists on the default
      branch.
    - >
      On first run, users may choose a font if automatic detection is not enough; the
      selection is written to `~/.config/mdfried/config.toml`. `--setup` repeats font
      setup and `--print-config` prints a fuller configuration example.
related-packages:
  - id: brew:mdcat
    reason: >
      Choose mdcat for stream-oriented rendering, live preview, configurable CommonMark
      output, and easy pipeline use; choose mdfried for a richer interactive pager with
      large headings and graphical presentation.
    rel: alternative
    sources:
      - https://github.com/benjajaja/mdfried#readme
      - https://github.com/BIRSAx2/mdcat#readme
  - id: brew:glow
    reason: >
      Choose Glow for a broadly packaged terminal UI that browses local and remote
      Markdown with Charmbracelet styling; mdfried places more emphasis on large
      headings, images, diagrams, and terminal graphics protocols.
    rel: alternative
    sources:
      - https://github.com/benjajaja/mdfried#readme
      - https://github.com/charmbracelet/glow#readme
  - id: brew:mdless
    reason: >
      Choose mdless for a traditional Ruby-based Markdown pager with custom themes and
      established less-style workflows; mdfried offers a newer graphics-heavy Rust
      interface.
    rel: alternative
    sources:
      - https://github.com/benjajaja/mdfried#readme
      - https://github.com/ttscoff/mdless#readme
category: productivity
package-manager:
  brew: mdfried
  macports: mdfried
  nix: mdfried
  pacman: mdfried
package-manager-url: https://formulae.brew.sh/formula/mdfried
license: GPL-3.0-or-later
tags:
  - cli
  - markdown
  - rust
  - terminal
  - viewer
description: Terminal markdown viewer
executables:
  - mdfried
provenance:
  formula: mdfried
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
