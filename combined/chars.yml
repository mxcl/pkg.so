id: brew:chars
display-name: Cha(rs)
homepage: https://github.com/boinkor-net/chars/
repo: https://github.com/boinkor-net/chars
docs:
  - https://github.com/boinkor-net/chars#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation from source with cargo install and points to
      operating-system packages including Arch Linux AUR, Homebrew, and Chocolatey.
      Homebrew packages version 0.7.0 and reports small but steady install counts.
  package-nerd-significance:
    - >
      Cha(rs) is package-nerd interesting because it turns Unicode database lookup into
      a tiny terminal utility distributed through Rust and OS package managers, filling
      the same quick-reference role that ascii(1) filled for older character sets.
  project-history:
    - >
      The official README presents Cha(rs) as a Rust command-line tool for displaying
      names and codes for ASCII and Unicode characters or code points. It explicitly
      positions the project as inspired by classic ascii(1)-style lookup tools while
      extending the idea to Unicode and control-character edge cases.
  related-projects:
    - ascii(1)-style character lookup tools are named as inspiration in the official README.
    - Rust Cargo is the source and crate installation path documented by the official README.
  sources:
    - https://formulae.brew.sh/api/formula/chars.json
    - https://formulae.brew.sh/formula/chars
    - https://github.com/boinkor-net/chars#readme
  summary:
    - Cha(rs) is a command-line Unicode and ASCII character inspection tool.
  timeline:
    - '2026: Homebrew formula metadata lists chars 0.7.0 and packages Linux and macOS bottles.'
    - >
      2026: Official repository README documents Cargo, Homebrew, AUR, Chocolatey, and
      source install paths.
  usage:
    - >
      Typical usage is running chars with a literal character, a Unicode code point such
      as U+1F63C, or an ambiguous numeric code, then reading the printed encodings,
      width, quote form, and Unicode name.
related-packages:
  - id: brew:ascii
    reason: >
      Choose ascii for a compact, traditional ASCII-only chart and code-name reference;
      Cha(rs) is the better choice when Unicode characters and code points are required.
    rel: alternative
    sources:
      - https://github.com/boinkor-net/chars#readme
      - http://www.catb.org/~esr/ascii/ascii.html
category: developer-tools
package-manager:
  brew: chars
  nix: chars
package-manager-url: https://formulae.brew.sh/formula/chars
license: MIT
tags:
  - characters
  - cli
  - rust
  - terminal
  - text-processing
  - unicode
description: Command-line tool to display information about unicode characters
executables:
  - chars
provenance:
  formula: chars
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
