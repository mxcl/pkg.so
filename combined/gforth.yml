id: brew:gforth
display-name: Gforth
homepage: https://www.gnu.org/software/gforth/
repo: https://git.savannah.gnu.org/git/gforth.git
docs:
  - https://www.complang.tuwien.ac.at/forth/gforth/Docs-html
  - https://www.gnu.org/software/gforth
config-file-location:
  unix: ~/.gforthrc0
credentials-file-location: null
history:
  adoption-history:
    - >
      Gforth became a GNU language runtime with broad platform reach across GNU,
      BSD-like systems, Windows, macOS, Android/Linux, and embedded-control targets. The
      project page connects it to the Forth standard, Forth community resources, the
      Gforth mailing list, and comp.lang.forth.
  package-nerd-significance:
    - >
      Gforth matters to package maintainers because it is both a GNU language
      implementation and a self-hosting-style Forth environment with multiple installed
      executables. It brings a historically important niche language into the same
      package-manager workflows as more common compilers and interpreters.
  project-history:
    - >
      The Gforth manuals carry Free Software Foundation copyright years beginning in
      1995, and the project page names Anton Ertl as project initiator and Bernd Paysan
      as project leader. The stated project goal was to develop a standard model for
      ANSI Forth: conforming to the standard, documenting implementation-dependent
      behavior, gaining broad acceptance, remaining efficient, remaining free, and being
      portable.
  related-projects:
    - >
      Gforth is related to the Forth standard, GNU, Vmgen, Emacs integration, Forth
      community sites, and other Forth systems such as fig-Forth and F83 that informed
      its standard-model goals.
  sources:
    - https://bernd-paysan.de/gforth.html
    - https://drops.dagstuhl.de/entities/artifact/10.4230/artifacts.22514
    - https://gforth.org/
    - https://gforth.org/manual/
    - https://lists.gnu.org/archive/html/info-gnu/2003-11/msg00003.html
  summary:
    - >
      Gforth is the GNU project's Forth implementation, a portable system for ANS Forth
      and Forth 2012 programming. Its history sits at the intersection of
      language-standard reference work, interactive programming, GNU packaging, and
      virtual-machine generation.
  timeline:
    - '1995: Gforth documentation copyright history begins in the FSF manuals.'
    - '2003: Gforth and Vmgen 0.6.2 were announced on GNU mailing lists.'
    - '2008: The 0.7.0 manual described Gforth as a fast, portable ANS Forth implementation.'
    - >
      2018: The online manual line described version 0.7.9 snapshots and Forth tutorial
      material.
    - '2024: A Dagstuhl software artifact entry archived Gforth source from Savannah.'
  usage:
    - >
      Practitioners use Gforth as an interactive Forth environment, a compiler/runtime
      for Forth source, a learning system with a substantial manual and tutorial, and a
      platform for exploring threaded-code implementation techniques. Its tool set
      includes `gforth`, faster and indirect-threaded variants, image-building helpers,
      and `vmgen` for generating efficient interpreters.
related-packages: []
category: language-runtime
package-manager:
  brew: gforth
  dnf: gforth
  macports: gforth
  nix: gforth
  ubuntu: gforth
  winget: GNU.Gforth
package-manager-url: https://formulae.brew.sh/formula/gforth
license: GPL-3.0-or-later
tags:
  - ans-forth
  - cli
  - compiler
  - forth
  - gnu
  - interpreter
  - vmgen
description: Implementation of the ANS Forth language
executables:
  - gforth
  - gforth-0.7.3
  - gforth-fast
  - gforth-fast-0.7.3
  - gforth-itc
  - gforth-itc-0.7.3
  - gforthmi
  - gforthmi-0.7.3
  - vmgen
  - vmgen-0.7.3
provenance:
  formula: gforth
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
