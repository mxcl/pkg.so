id: brew:fancy-cat
display-name: fancy-cat
homepage: https://github.com/freref/fancy-cat
repo: https://github.com/freref/fancy-cat
docs:
  - https://github.com/freref/fancy-cat#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/fancy-cat/config.json
    - ~/.config/fancy-cat/config.json
    - ~/.fancy-cat
credentials-file-location: null
history:
  adoption-history:
    - >
      Official adoption information is modest: the README points to packaging status
      across repositories and the package appears in Homebrew and Nix through the input
      facts. The project is still young and the official sources do not support a broad
      adoption claim.
  package-nerd-significance:
    - >
      fancy-cat is interesting to terminal-tool users because it packages graphical PDF
      reading as a shell-native workflow. It belongs to the recent wave of CLI
      applications that rely on modern terminal image protocols instead of opening a
      separate GUI viewer.
  project-history:
    - >
      The repository was created in November 2024 and is implemented as a Zig project.
      Its README presents the project as a PDF viewer for terminals that can display
      pages through image-capable terminal emulators such as Kitty, Ghostty, and
      WezTerm.
  related-projects:
    - Kitty image protocol support is the key terminal capability.
    - Zig is the implementation and build toolchain.
  sources:
    - https://github.com/freref/fancy-cat
    - https://raw.githubusercontent.com/freref/fancy-cat/master/README.md
    - https://api.github.com/repos/freref/fancy-cat
    - https://api.github.com/repos/freref/fancy-cat/tags?per_page=20
  summary:
    - >
      fancy-cat is a terminal PDF viewer built around the Kitty image protocol. Its
      README describes a modal interface, runtime configuration, key mappings, command
      mode, hot reload, status bar, page navigation, and dark-mode colorization.
  timeline:
    - '2024: Repository created.'
    - '2024: v0.1.0 tag published.'
    - '2026: v0.6.0 tag present.'
  usage:
    - >
      The primary command is `fancy-cat <path-to-pdf> <optional-page-number>`. Once
      running, users navigate through a modal interface similar to Neovim and can enter
      command mode with `:` by default.
    - >
      Configuration is JSON and lives under the XDG config directory when available,
      with fallback and legacy locations documented by the README.
related-packages:
  - id: cask:kitty
    reason: >
      Kitty is a directly compatible terminal host for fancy-cat and defines the
      graphics protocol the PDF viewer uses to render pages.
    rel: adjacent_workflow
    sources:
      - https://github.com/freref/fancy-cat#readme
      - https://sw.kovidgoyal.net/kitty/graphics-protocol/
category: productivity
package-manager:
  brew: fancy-cat
  nix: fancy-cat
package-manager-url: https://formulae.brew.sh/formula/fancy-cat
license: AGPL-3.0-or-later
tags:
  - cli
  - document-viewer
  - kitty-protocol
  - pdf
  - terminal
description: PDF reader for terminal emulators using the Kitty image protocol
executables:
  - fancy-cat
provenance:
  formula: fancy-cat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
