id: brew:swtpm
display-name: swtpm
homepage: https://github.com/stefanberger/swtpm
repo: https://github.com/stefanberger/swtpm
docs:
  - https://github.com/stefanberger/swtpm/wiki
  - https://github.com/stefanberger/swtpm/blob/master/README
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/swtpm_setup.conf
    - ${HOME}/.config/swtpm_setup.conf
    - /etc/swtpm_setup.conf
    - /etc/swtpm-localca.conf
    - /etc/swtpm-localca.options
credentials-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/swtpm-localca.conf
    - ${HOME}/.config/swtpm-localca.conf
    - /etc/swtpm-localca.conf
history:
  adoption-history:
    - >
      The input package facts show swtpm packaged across Homebrew, Alpine, Debian,
      Fedora, Nix, Arch, Ubuntu, and openSUSE. The upstream wiki includes build
      instructions for Ubuntu/Debian, RHEL, openSUSE, Alpine, OpenBSD, Cygwin, and
      macOS, reflecting a project maintained for distribution packaging and
      virtualization integration rather than a single application bundle.
  package-nerd-significance:
    - >
      Package nerds care because swtpm is infrastructure glue: a small C/Shell-heavy
      package that lets VM stacks expose TPM functionality reproducibly. Its packaging
      footprint matters because TPM emulation is only useful when libtpms, QEMU/libvirt
      integration, init scripts, config files, and distro build flags line up.
  project-history:
    - >
      The upstream README credits David Safford and Stefan Berger and describes a
      package that provides TPM emulators with different front-end interfaces to
      libtpms. It also ships tools for using the emulator, creating TPM certificates,
      and simulating TPM manufacturing by creating endorsement-key and platform
      certificates.
  related-projects:
    - >
      Related projects and topics include libtpms, QEMU, libvirt, TPM 1.2/2.0 tooling,
      virtual TPM devices, and distro packaging for virtualization hosts.
  sources:
    - https://github.com/stefanberger/swtpm
    - https://github.com/stefanberger/swtpm/blob/master/README
    - https://github.com/stefanberger/swtpm/wiki
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      swtpm is a libtpms-based software TPM emulator with socket, character-device, and
      Linux CUSE interfaces. It is a command-line and service-oriented building block
      for virtual TPM workflows in QEMU, libvirt, testing, and
      confidential-computing-adjacent development.
  timeline:
    - 'v0.1.0 era: The upstream repository exposes early v0.1.x release tags.'
    - '2025: GitHub lists v0.10.1 as the latest swtpm release on April 30, 2025.'
    - >
      Current packaging: The input package facts list swtpm in Homebrew and major Linux
      package ecosystems.
  usage:
    - >
      Common usage is to run the swtpm emulator as part of a virtual-machine stack,
      control it with swtpm_ioctl, prepare state with swtpm_setup, and use supporting
      tools such as swtpm_cert and swtpm_localca for certificate-related TPM setup. The
      README directs users to per-tool READMEs and the wiki for operational details.
category: security
package-manager:
  apk: swtpm
  brew: swtpm
  debian: swtpm
  dnf: swtpm
  nix: swtpm
  pacman: swtpm
  ubuntu: swtpm
  zypper: swtpm
package-manager-url: https://formulae.brew.sh/formula/swtpm
license: BSD-3-Clause
tags:
  - cli
  - emulator
  - libtpms
  - security
  - tpm
  - virtualization
description: Software TPM Emulator based on libtpms
executables:
  - swtpm
  - swtpm_bios
  - swtpm_cert
  - swtpm_ioctl
  - swtpm_localca
  - swtpm_setup
provenance:
  formula: swtpm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
