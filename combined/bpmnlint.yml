id: brew:bpmnlint
display-name: bpmnlint
homepage: https://github.com/bpmn-io/bpmnlint
repo: https://github.com/bpmn-io/bpmnlint
docs:
  - https://github.com/bpmn-io/bpmnlint/tree/main/docs/rules
  - https://github.com/bpmn-io/bpmnlint#readme
config-file-location:
  unix: .bpmnlintrc
credentials-file-location: null
history:
  adoption-history:
    - >
      bpmnlint's adoption is mostly inside the BPMN and bpmn.io ecosystem. The README
      points to npm installation, custom plugins, visual feedback through
      bpmn-js-bpmnlint, a playground, generated docs images, and bundler integrations.
    - >
      Homebrew packaging gives the CLI a system-package route, but the upstream
      distribution model is clearly npm and Node.js module resolution, especially for
      plugins named `bpmnlint-plugin-*`.
  package-nerd-significance:
    - >
      bpmnlint is notable because it packages a domain-specific modeling discipline as a
      familiar CLI linter. It brings BPMN quality checks into CI and editor workflows
      instead of leaving validation only inside graphical modeling tools.
    - >
      For package collections, it is a niche but useful example of Node-based developer
      tooling escaping npm-only usage and becoming a command installed by system package
      managers.
  project-history:
    - >
      The official repository README presents bpmnlint as a command-line and Node.js
      library for validating BPMN diagrams, configured through `.bpmnlintrc` and rule
      sets such as `bpmnlint:recommended`. The first visible tagged alpha in the
      repository dates to September 2018, followed by v1.0.0 the next day.
    - >
      The changelog shows steady rule and platform evolution: configurable rules,
      browser bundling, custom rule resolution, BPMN DI checks, moddle extensions, Node
      version requirements, and new correctness/recommended rule coverage.
  related-projects:
    - >
      The README names bpmn-js-bpmnlint for visual modeling feedback,
      bpmnlint-playground for trying rules, bpmnlint-plugin-example for plugin authors,
      and bpmn-moddle for BPMN XML parsing.
    - >
      It is part of the broader bpmn.io project family, alongside BPMN modeling, moddle,
      and browser-based BPMN tooling.
  sources:
    - https://github.com/bpmn-io/bpmnlint#readme
    - https://github.com/bpmn-io/bpmnlint/blob/main/CHANGELOG.md
    - https://github.com/bpmn-io/bpmnlint/tree/main/docs/rules
    - source_facts.package-manager
  summary:
    - >
      bpmnlint is the bpmn.io linting tool for validating BPMN diagrams against
      configurable rules. It gives BPMN model files the same sort of repeatable
      command-line checks that source code gets from language linters.
  timeline:
    - '2018: v1.0.0-alpha5 and v1.0.0 tags appear in September.'
    - '2020: 7.8.0 added configurable rules according to the changelog.'
    - '2024: 11.0.0 required Node 20 according to the changelog.'
    - '2026: 11.12.1 tag appears in the official GitHub repository.'
  usage:
    - >
      Typical usage runs `bpmnlint invoice.bpmn` and receives line-item errors and
      warnings for process modeling problems such as missing start or end events,
      unlabeled elements, and sequence-flow issues.
    - >
      Teams configure `.bpmnlintrc` with built-in rulesets, custom rule severities,
      plugins, and optional moddle extensions. The API also allows embedding linting in
      Node.js tools that parse BPMN XML with bpmn-moddle.
related-packages:
  - id: cask:camunda-modeler
    reason: >
      Use Camunda Modeler alongside bpmnlint when you want graphical BPMN editing with
      built-in configurable lint feedback; Camunda also provides an official example for
      adding custom bpmnlint rules.
    rel: adjacent_workflow
    sources:
      - https://docs.camunda.io/docs/components/modeler/desktop-modeler/
      - https://github.com/camunda/camunda-modeler-custom-linter-rules-plugin
      - https://github.com/bpmn-io/bpmnlint#readme
category: developer-tools
package-manager:
  brew: bpmnlint
package-manager-url: https://formulae.brew.sh/formula/bpmnlint
license: MIT
tags:
  - bpmn
  - cli
  - diagrams
  - linting
  - validation
description: Validate BPMN diagrams based on configurable lint rules
executables:
  - bpmnlint
provenance:
  formula: bpmnlint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
