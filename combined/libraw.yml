id: brew:libraw
display-name: LibRaw
homepage: https://www.libraw.org/
repo: https://github.com/LibRaw/LibRaw
docs:
  - https://www.libraw.org/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LibRaw was adopted broadly because camera vendors produce many undocumented or
      semi-documented RAW formats and applications need a maintained decoding layer. Its
      official documentation describes embedding in RAW converters, data analyzers, and
      other programs that use RAW files as input, and its supported-camera list spans
      phone cameras, drones, cinema cameras, DSLRs, and mirrorless systems.
  package-nerd-significance:
    - >
      LibRaw is one of the cleaner examples of turning a famous single-file Unix utility
      into a library package. It matters to maintainers because many graphics
      applications can share one camera-support substrate instead of vendoring dcraw
      snapshots or maintaining format decoders independently.
  project-history:
    - >
      The LibRaw project states that it launched in 2008 based on Dave Coffin's dcraw.c
      utility. Its goals were to convert dcraw into a library usable by other programs,
      remove global-variable style constraints, improve thread safety, import dcraw
      changes, and expand metadata extraction.
    - >
      LibRaw's history is inseparable from dcraw. The project notes that dcraw support
      was reduced to a minimum in 2015 and ceased in 2018; after that, new camera and
      format support was handled by the LibRaw team. The rendering path inherited from
      dcraw remained important, while LibRaw moved contributor demosaic and
      post-processing experiments into separate projects when they became hard to
      maintain in the core library.
  related-projects:
    - >
      LibRaw is related to dcraw, RawDigger, FastRawViewer, RAW converter applications,
      camera-specific RAW formats such as CRW, CR2, NEF, RAF, DNG, MOS, KDC, and DCR,
      and the LibRaw demosaic pack projects.
  sources:
    - https://formulae.brew.sh/formula/libraw
    - https://github.com/LibRaw/LibRaw
    - https://github.com/LibRaw/LibRaw/releases
    - https://www.libraw.org/about
    - https://www.libraw.org/docs
    - https://www.libraw.org/supported-cameras
  summary:
    - >
      LibRaw is a RAW photo decoding library created to turn Dave Coffin's dcraw
      codebase into an embeddable, thread-safer library with expanded metadata and
      camera-format support.
  timeline:
    - "1997: Dave Coffin's dcraw copyright lineage begins, later forming LibRaw's base."
    - '2008: LibRaw project launched from dcraw.c.'
    - '2015: LibRaw records dcraw support being reduced to a minimum.'
    - >
      2018: LibRaw records dcraw support ceasing, with camera-format support handled by
      the LibRaw team thereafter.
    - >
      2026: LibRaw documentation and supported-camera pages described the 0.22 camera
      support generation.
  usage:
    - >
      Homebrew installs the library and sample utilities such as dcraw_emu,
      raw-identify, simple_dcraw, and postprocessing_benchmark. Developers use the API
      when they need to identify cameras, read RAW metadata, unpack sensor data, or feed
      image data to a separate conversion pipeline.
related-packages:
  - id: brew:dcraw
    reason: >
      Choose dcraw when you specifically need the original standalone command-line RAW
      decoder; choose LibRaw when software needs an embeddable, more thread-safe library
      with camera support maintained beyond dcraw's development.
    rel: alternative
    sources:
      - https://www.libraw.org/about
      - https://www.libraw.org/docs
      - https://dechifro.org/dcraw/
category: media
