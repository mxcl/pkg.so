id: brew:nicovideo-dl
display-name: nicovideo-dl
homepage: https://osdn.net/projects/nicovideo-dl/
repo: null
docs:
  - https://osdn.net/projects/nicovideo-dl
config-file-location: null
credentials-file-location:
  unix: ~/.netrc
history:
  adoption-history:
    - >
      The package has very small Homebrew usage: the July 2026 API reports zero installs
      over 30 and 90 days and five installs over 365 days. Homebrew marks the formula
      deprecated on 2025-10-23 because the repository was removed and schedules
      disablement for 2026-10-23.
  package-nerd-significance:
    - >
      nicovideo-dl is significant mainly as a legacy package-manager artifact: a narrow
      video-site downloader whose upstream repository disappeared while the package
      manager continued to carry a patched historical release for users who still had
      scripts depending on it.
  project-history:
    - >
      Homebrew packages version 0.0.20190126 from an OSDN release archive and identifies
      the OSDN project page as the homepage. The formula has been patched by Homebrew
      for newer Python compatibility, which is typical of small site-specific downloader
      scripts after upstream activity slows.
  related-projects:
    - Niconico, OSDN, youtube-dl, yt-dlp
  sources:
    - https://formulae.brew.sh/api/formula/nicovideo-dl.json
    - https://formulae.brew.sh/formula/nicovideo-dl
    - https://osdn.net/projects/nicovideo-dl/
  summary:
    - nicovideo-dl is a command-line program for downloading videos from www.nicovideo.jp.
  timeline:
    - >
      2019-01-26: Homebrew stable version 0.0.20190126 is sourced from OSDN release
      infrastructure.
    - '2025-10-23: Homebrew marks the formula deprecated because the repository was removed.'
    - '2026-07: Homebrew API reports five installs over 365 days.'
    - '2026-10-23: Homebrew formula metadata lists planned disablement.'
  usage:
    - >
      Users run `nicovideo-dl` against one or more Niconico video URLs. The official
      package metadata identifies it as a Python-backed command-line downloader for
      www.nicovideo.jp.
category: media
package-manager:
  brew: nicovideo-dl
package-manager-url: https://formulae.brew.sh/formula/nicovideo-dl
license: MIT
tags:
  - cli
  - niconico
  - nicovideo
  - video-downloader
description: Command-line program to download videos from www.nicovideo.jp
executables:
  - nicovideo-dl
provenance:
  formula: nicovideo-dl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
