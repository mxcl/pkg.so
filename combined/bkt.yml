id: brew:bkt
display-name: bkt
homepage: https://github.com/dimo414/bkt
repo: https://github.com/dimo414/bkt
docs:
  - https://docs.rs/bkt/latest/bkt
  - https://github.com/dimo414/bkt#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bkt is distributed as a Rust crate, GitHub release binary, and Unix package
      through Homebrew, Debian/Ubuntu, Alpine, and Nix according to the supplied package
      facts. The README also tracks package-manager support and links Repology status.
  package-nerd-significance:
    - >
      bkt matters to package nerds because it turns a recurring shell pattern into one
      binary with well-documented cache semantics. It is the kind of low-level CLI that
      quietly improves prompts and scripts without forcing every project to grow its own
      memoization layer.
  project-history:
    - >
      The repository and crates.io package appeared in 2021. The README says bkt is
      pronounced 'bucket', is inspired by bash-cache, and wraps expensive process
      invocations so callers can reuse recent outputs without adding caching logic to
      their own programs.
  related-projects:
    - bkt is directly related to bash-cache, which the README names as inspiration.
    - >
      It complements shell tools such as fzf by caching expensive commands used in
      interactive interfaces.
  sources:
    - https://crates.io/crates/bkt
    - https://docs.rs/bkt/latest/bkt
    - https://github.com/dimo414/bkt#readme
    - source_facts.package-manager
  summary:
    - >
      bkt is a Rust CLI and library for caching subprocess invocations. It is a small
      systems utility for shell prompts, fuzzy finders, polling scripts, and other
      workflows where repeated command output can be reused.
  timeline:
    - '2021: bkt repository and crate are created.'
    - '2021: The README documents bkt as inspired by bash-cache.'
    - >
      2020s: bkt gains package-manager coverage across Homebrew, Debian/Ubuntu, Alpine,
      and Nix.
    - '2020s: GitHub releases provide precompiled binaries starting with 0.5.'
  usage:
    - >
      A typical invocation prefixes a command with bkt and a TTL, such as bkt --ttl=1m
      -- date. bkt caches stdout, stderr, and exit status, with options for stale
      refresh, working-directory and environment-sensitive keys, file modification
      checks, scopes, failure handling, and cache directory selection.
related-packages:
  - id: brew:fzf
    reason: >
      Use bkt around fzf preview commands to cache expensive previews and refresh stale
      entries in the background while navigating results.
    rel: adjacent_workflow
    sources:
      - https://github.com/dimo414/bkt#speeding-up-fzf-and-other-preview-tools
      - https://github.com/dimo414/bkt/discussions/29
      - https://github.com/junegunn/fzf#readme
category: system
