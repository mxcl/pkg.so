id: brew:ghc@9.10
display-name: GHC 9.10
homepage: https://haskell.org/ghc/
repo: https://gitlab.haskell.org/ghc/ghc
docs:
  - https://downloads.haskell.org/ghc/9.10.3/docs/users_guide
  - https://www.haskell.org/ghc
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ghc/ghci.conf
    - ~/.ghc/ghci.conf
    - ./.ghci
  windows:
    - '%APPDATA%\ghc\ghci.conf'
    - .\.ghci
credentials-file-location: null
history:
  adoption-history:
    - >
      GHC became the compiler around which most practical Haskell development, Hackage
      packaging, and teaching material clustered. For package managers, a formula such
      as `ghc@9.10` matters because Haskell projects often pin compiler branches while
      library bounds, language extensions, and generated interfaces catch up.
    - >
      Homebrew presents `ghc@9.10` as a separate installable formula with the same
      Glasgow Haskell Compilation System description as the main formula. That
      version-track packaging gives macOS users a branch-specific compiler without
      replacing every GHC installation path.
  package-nerd-significance:
    - >
      Versioned GHC packages are important because the compiler, boot libraries, package
      database, and generated interface files form one compatibility unit. A
      branch-specific Homebrew formula is a small packaging mechanism for a large
      ecosystem constraint.
  project-history:
    - >
      GHC began at the University of Glasgow near the beginning of the 1990s as an
      academic research project funded by the UK government. Its goals were to make a
      robust and portable Haskell compiler freely available, provide a modular
      foundation for research, and learn from real programs.
    - >
      The GHC 9.10 branch belongs to the long-running stable-branch tradition documented
      by the user guide: even-numbered minor branches are stable, patch releases are
      bug-fix releases, and installing a new patchlevel can require rebuilding code
      compiled against older libraries.
  related-projects:
    - Cabal and Stack commonly drive GHC for project builds.
    - >
      Hackage packages publish compiler-version constraints that make branch-specific
      GHC installations useful.
    - GHCup provides another official Haskell installation path for selecting GHC versions.
  sources:
    - https://downloads.haskell.org/ghc/9.10.3/docs/users_guide/intro.html
    - https://formulae.brew.sh/formula/ghc@9.10
    - https://gitlab.haskell.org/ghc/ghc
    - https://www.aosabook.org/en/v2/ghc.html
    - https://www.haskell.org/ghc/
    - https://www.haskell.org/ghc/download_ghc_9_10_1.html
  summary:
    - >
      The Homebrew `ghc@9.10` formula packages the GHC 9.10 branch of the Glasgow
      Haskell Compiler. It serves projects that need that branch's compiler, GHCi, boot
      libraries, Haddock, and version-suffixed executables rather than the general `ghc`
      formula.
  timeline:
    - 'Early 1990s: GHC began as a Glasgow research project.'
    - >
      2007: The user guide documented GHC's even-numbered stable-branch versioning
      policy starting with GHC 6.8.
    - '2024: GHC 9.10.1 was released as the first listed 9.10 release on the GHC download page.'
    - '2026 batch input: The Homebrew package record listed 9.10.3-suffixed executables.'
  usage:
    - >
      Practitioners install a versioned formula when a Cabal or Stack project expects
      GHC 9.10, when CI must match a project matrix, or when testing a package against a
      specific compiler branch. The executables include both generic names and
      9.10-suffixed names, making scripts able to choose the intended compiler.
    - >
      The underlying workflow remains normal GHC usage: compile with `ghc`, explore code
      in `ghci`, run scripts with `runghc`, inspect package databases with `ghc-pkg`,
      and generate API docs with Haddock.
related-packages:
  - id: brew:ghcup
    reason: >
      GHCup is an official toolchain installer that can install and select specific GHC
      releases, making it useful when a project needs finer version switching than a
      single Homebrew branch formula.
    rel: adjacent_workflow
    sources:
      - https://ghc.gitlab.haskell.org/homepage/
      - https://www.haskell.org/ghcup/guide/
  - id: brew:cabal-install
    reason: >
      cabal-install resolves project dependencies and invokes the selected GHC 9.10
      compiler to build Haskell packages and targets.
    rel: adjacent_workflow
    sources:
      - https://cabal.readthedocs.io/en/stable/getting-started.html
      - https://downloads.haskell.org/ghc/9.10.3/docs/users_guide/
  - id: brew:haskell-stack
    reason: >
      Stack can select a compiler matching a project snapshot and then use that GHC
      installation for reproducible builds, tests, and interactive sessions.
    rel: adjacent_workflow
    sources:
      - https://docs.haskellstack.org/en/stable/topics/stack_work/
      - https://ghc.gitlab.haskell.org/homepage/
category: language-runtime
