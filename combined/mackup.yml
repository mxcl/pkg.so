id: brew:mackup
display-name: Mackup
homepage: https://github.com/lra/mackup
repo: https://github.com/lra/mackup
docs:
  - https://github.com/lra/mackup/blob/master/doc/README.md
  - https://github.com/lra/mackup#readme
config-file-location:
  unix:
    - ~/.mackup.cfg
    - $MACKUP_CONFIG
    - $XDG_CONFIG_HOME/mackup/mackup.cfg
    - ~/.config/mackup/mackup.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Mackup is distributed through Homebrew and pip in its own quickstart, and the
      batch input records additional package-manager presence in DNF, MacPorts, and Nix.
      The repository metadata captured during this run showed more than fifteen thousand
      GitHub stars and hundreds of forks, making it one of the better-known tools in the
      Mac settings-sync niche.
  package-nerd-significance:
    - >
      For package-manager users, Mackup is a bridge between installing software and
      making that software feel configured. It is significant because it turns a messy
      collection of per-application preference paths into a repeatable CLI operation
      that fits bootstrap scripts, Homebrew-driven Mac setup, and dotfile repositories.
  project-history:
    - >
      The official GitHub repository was created in April 2013. Mackup grew out of the
      Mac and Unix dotfile culture of keeping user preferences portable, but it packages
      that workflow around application-specific configuration knowledge rather than
      asking each user to maintain every path by hand.
    - >
      The project originally emphasized linking configuration files into a synced
      storage directory, but the current README documents both copy mode and link mode.
      The README now warns that link mode is unsafe for preferences on macOS Sonoma and
      later, making copy-based backup and restore the preferred path on current macOS
      systems.
  related-projects:
    - >
      Mackup sits near dotfile managers, Homebrew bootstrap scripts, cloud-synced
      configuration folders, and application preference backup tools. Its own docs
      relate it to Dropbox, Google Drive, iCloud, and Git-backed storage.
  sources:
    - https://api.github.com/repos/lra/mackup
    - https://github.com/lra/mackup
    - https://github.com/lra/mackup#readme
    - https://github.com/lra/mackup/blob/master/doc/README.md
    - source_facts.package-manager
  summary:
    - >
      Mackup is a Python command-line tool for backing up, restoring, and synchronizing
      application settings across workstations. Its official README frames the tool
      around repeatable workstation setup: install Mackup, run `mackup backup` on one
      machine, and run `mackup restore` on a new one.
  timeline:
    - '2013: Official GitHub repository created.'
    - '2025: 0.10.x releases published.'
    - >
      2026: 0.11.x releases published, with current documentation emphasizing copy mode
      for modern macOS.
  usage:
    - >
      The common workflow is `mackup backup` to copy supported application settings into
      a Mackup storage directory, then `mackup restore` on another workstation. The CLI
      can scope commands to a single supported application, and `mackup list` reports
      the known application identifiers.
    - >
      Mackup supports storage backends documented as Dropbox, Google Drive, iCloud, and
      a generic filesystem directory. Users customize behavior in `.mackup.cfg`,
      including storage selection and application allow or ignore lists, and can add
      custom application definitions under `~/.mackup/` or the XDG Mackup applications
      directory.
related-packages:
  - id: brew:chezmoi
    reason: >
      Choose chezmoi when you want a cross-platform, Git-oriented dotfile manager with
      templates, machine-specific state, encryption, and password-manager integrations
      instead of Mackup's curated application-settings backup model.
    rel: alternative
    sources:
      - https://github.com/lra/mackup#readme
      - https://www.chezmoi.io/
category: productivity
package-manager:
  brew: mackup
  dnf: mackup
  macports: mackup
  nix: mackup
package-manager-url: https://formulae.brew.sh/formula/mackup
license: GPL-3.0-or-later
tags:
  - backup
  - cli
  - configuration
  - dotfiles
  - macos
  - productivity
  - settings-sync
description: Keep your Mac's application settings in sync
executables:
  - mackup
provenance:
  formula: mackup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
