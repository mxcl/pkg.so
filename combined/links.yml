id: brew:links
display-name: Links
homepage: https://links.twibright.com/
repo: null
docs:
  - https://links.twibright.com/user_en.html
config-file-location:
  unix:
    - ~/.links/links.cfg
    - ~/.links/html.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Links spread through Unix and Unix-like package repositories as a practical
      browser for consoles, SSH sessions, rescue environments, and systems without a
      full desktop browser. Its continued packaging alongside Lynx, ELinks, and w3m
      reflects persistent demand for terminal-first web clients.
  package-nerd-significance:
    - >
      Links is package-nerd significant because one package can serve as a TUI browser,
      a graphical low-resource browser, and a troubleshooting tool. It is a durable
      example of software that remains useful from a bare terminal or recovery shell.
  project-history:
    - >
      The official Twibright Labs about page says Mikulas Patocka started writing Links
      in 1999 as a text-mode browser. In 2000 Martin Pergel, Petr Kulhavy, and Karel
      Kulhavy joined to add graphics and JavaScript capabilities.
    - >
      The official ChangeLog records continued 2.x maintenance, including Links 2.30 in
      July 2024. The official download page publishes source archives rather than
      pointing to a current public source-control repository.
  related-projects:
    - >
      Related projects include Lynx, ELinks, and w3m. The official about page credits
      Lynx for some browser data tables.
  sources:
    - https://links.twibright.com/about.php
    - https://links.twibright.com/download.php
    - https://links.twibright.com/download/
    - https://links.twibright.com/download/ChangeLog
    - https://links.twibright.com/user_en.html
  summary:
    - >
      Links is a web browser that runs in both text and graphics modes. It belongs to
      the classic Unix family of terminal-capable browsers while also supporting
      graphical output modes.
  timeline:
    - '1999: Mikulas Patocka started writing Links as a text-mode browser.'
    - >
      2000: Martin Pergel, Petr Kulhavy, and Karel Kulhavy joined to add graphics and
      JavaScript capabilities.
    - '2005-03-04: Official archive index lists Links 2.0 source archives.'
    - '2008-07-06: Official archive index lists Links 2.1 source archives.'
    - '2024-07-27: Official ChangeLog records Links 2.30.'
  usage:
    - >
      Users run Links for text-mode browsing, graphical framebuffer or X browsing, page
      dumping, and quick documentation access from constrained environments. The
      official user manual documents installation, text and graphics mode operation,
      menus, bookmarks, downloads, cache, and configuration.
related-packages:
  - id: brew:lynx
    reason: >
      Choose Lynx for a deliberately text-only, character-cell browser; choose Links
      when you also want optional graphical rendering while retaining a Lynx-compatible
      terminal interface.
    rel: alternative
    sources:
      - https://links.twibright.com/user_en.html
      - https://links.twibright.com/features.php
      - https://invisible-island.net/lynx/lynx.html
category: networking
package-manager:
  apk: links
  brew: links
  debian: links
  dnf: elinks
  macports: links
  pacman: links
  scoop: main/links
  ubuntu: links
  zypper: links
package-manager-url: https://formulae.brew.sh/formula/links
license: GPL-2.0-or-later WITH cryptsetup-OpenSSL-exception
tags:
  - cli
  - console
  - html
  - terminal
  - text-mode
  - web-browser
description: Lynx-like WWW browser that supports tables, menus, etc.
executables:
  - links
provenance:
  formula: links
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
