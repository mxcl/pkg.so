id: brew:woof
display-name: woof
homepage: https://www.home.unix-ag.org/simon/woof.html
repo: null
docs:
  - https://www.home.unix-ag.org/simon/woof.html
config-file-location:
  unix:
    - /etc/woofrc
    - ~/.woofrc
credentials-file-location: null
history:
  adoption-history:
    - >
      woof spread by solving a problem every Unix user recognizes: getting one file
      across a LAN with the tools already on both machines. Its adoption has been modest
      but persistent because it is memorable, dependency-light, and easy to explain at a
      shell prompt.
    - >
      The design also made it popular in package-manager culture. It is not a general
      web server; it is a tiny single-purpose command whose behavior is close to a shell
      one-liner but friendlier and safer for the specific exchange workflow.
  package-nerd-significance:
    - >
      woof is a neat package because it captures a whole workflow in one command. It
      sits in the same practical mental space as netcat, `python -m http.server`, rsync
      over SSH, and temporary paste/file tools, but it is optimized for the 'give this
      one thing to the person across the room' case.
    - >
      Its age is part of the appeal: the 2007-to-2026 release trail shows that tiny Unix
      utilities can remain useful across Python migrations, hosting moves, and changing
      desktop environments.
  project-history:
    - >
      Simon Budig's project page preserves a dated release list going back to an
      'ancient woof version' from 2007-01-20. That makes woof one of the older and more
      durable examples of the single-command local webserver pattern, predating the
      now-common habit of using `python -m http.server` for quick directory sharing.
    - >
      The dated releases show incremental broadening while staying small: bzip2
      directory archive support and removal of an external tar dependency in 2009-02,
      zip support later that month, upload functionality in 2009-12, and client-mode
      downloading plus Python 2.7 workarounds in 2012-05.
    - >
      The official page records two later stewardship milestones. On 2020-06-24, Budig
      wrote that he had pushed the code to GitHub and added a Python 3 port. On
      2026-01-13, he noted that the code had moved to Codeberg and that new work was
      present there.
  related-projects:
    - >
      The author compares woof with npush/npoll and SAFT/sendfile as earlier or adjacent
      ways to solve small-network file exchange.
    - >
      `python -m http.server` is the common standard-library alternative, while netcat
      and rsync over SSH cover adjacent file-transfer workflows.
  sources:
    - https://codeberg.org/nomis/woof
    - https://github.com/simon-budig/woof
    - https://www.home.unix-ag.org/simon/woof.html
  summary:
    - >
      woof, expanded by its author as Web Offer One File, is a small ad-hoc HTTP file
      server meant for quick file exchange on a local network. The project page frames
      it as a reaction to the common laptop-era problem of wanting to exchange one file
      with someone nearby without setting up a permanent server, file-sharing network,
      daemon, shared account, or password exchange.
    - >
      Its central idea is intentionally simple: run `woof filename`, tell the recipient
      the URL, let them fetch the file with a browser or command-line web client such as
      wget, and then have the server exit after the configured number of downloads.
  timeline:
    - "2007-01-20: The author's download list records an ancient woof version."
    - >
      2009-02-13: Directory serving gains bzip2 support and drops reliance on an
      external tar command.
    - '2009-02-17: Zip support is added.'
    - '2009-12-27: Upload functionality and code cleanup are released.'
    - >
      2012-05-31: Python 2.7 workaround, more verbose URL output, and client-mode
      downloading are released.
    - '2020-06-24: The author pushes the code to GitHub and adds a Python 3 port.'
    - '2026-01-13: The project page says the code moved to Codeberg.'
  usage:
    - >
      The basic usage is `woof file`, after which woof prints a URL that another user
      can open or fetch. The official page documents options for selecting IP address
      and port, setting the download count, serving directories as compressed archives,
      distributing woof itself with `-s`, accepting uploads with `-U`, and acting as a
      client when invoked with a URL.
    - >
      woof also supports persistent defaults in `/etc/woofrc` and `~/.woofrc`, using
      INI-style values for port, count, IP address, and compression method. The local
      user config takes precedence over the system config.
category: networking
package-manager:
  brew: woof
  winget: ondrejsikax.woof
package-manager-url: https://formulae.brew.sh/formula/woof
license: GPL-2.0-or-later
tags:
  - cli
  - file-sharing
  - http
  - single-file
  - webserver
description: Ad-hoc single-file webserver
executables:
  - woof
provenance:
  formula: woof
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
