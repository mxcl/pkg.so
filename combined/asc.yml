id: brew:asc
display-name: asc
homepage: https://asccli.sh
repo: https://github.com/rorkai/App-Store-Connect-CLI
docs:
  - https://asccli.sh
  - https://github.com/rorkai/App-Store-Connect-CLI#readme
config-file-location:
  unix:
    - ~/.asc/config.json
    - ./.asc/config.json
credentials-file-location:
  unix:
    - ~/.asc/config.json
    - ./.asc/config.json
history:
  adoption-history:
    - >
      asc is packaged for Homebrew according to both the README and the input package
      facts. The README also lists Debian, Ubuntu, Fedora/DNF, Nix, and WinGet package
      facts in the input, while the official website advertises integrations for GitHub
      Actions, GitLab CI, Bitrise, and CircleCI.
  package-nerd-significance:
    - >
      For package and release engineers, asc matters because it turns App Store Connect
      operations into reproducible CLI calls with JSON output, a single Go binary, and
      explicit CI/CD ergonomics. It also reflects a 2025-2026-ish tooling pattern: CLIs
      exposing local command discovery and agent skills so automation systems can
      operate them deterministically.
  project-history:
    - >
      The official site metadata gives a 2024 publication date, and the README presents
      a mature CLI with Homebrew install instructions, an install script, CI-friendly
      JSON output, command lifecycle labels, telemetry controls, support channels, and a
      companion skills repository for coding agents.
  related-projects:
    - Apple's App Store Connect API is the service API asc automates.
    - >
      fastlane is the common historical comparison point; asc's official FAQ contrasts
      itself as a single Go binary with no Ruby toolchain.
    - >
      rorkai/app-store-connect-cli-skills is the companion skill pack referenced by the
      README and official site.
  sources:
    - https://asccli.sh
    - https://github.com/rorkai/App-Store-Connect-CLI#readme
    - https://github.com/rorkai/app-store-connect-cli-skills
  summary:
    - >
      asc is a Go command-line tool for automating App Store Connect and Apple Ads
      workflows. Its official site positions it as a single-binary, scriptable
      alternative for TestFlight, release, metadata, signing, analytics, and CI/CD
      tasks.
  timeline:
    - '2024: Official site metadata lists the software datePublished as 2024-01-01.'
    - >
      Current README: Homebrew is the recommended install path and the install script
      covers macOS/Linux.
    - >
      Current README: Config-backed auth is documented for CI, headless shells, and
      keychain-unavailable environments.
    - >
      Current official site: asc is described as covering 76 command groups and 1,216+
      API endpoints.
  usage:
    - >
      The core workflow is `asc auth login` with App Store Connect API keys, followed by
      commands such as `asc apps list`, `asc builds upload`, `asc testflight groups
      list`, `asc publish appstore`, and `asc status --watch`. In CI or headless
      environments, the README documents config-backed auth with `--bypass-keychain` and
      repo-local credentials with `--local --bypass-keychain`.
related-packages:
  - id: brew:asccli
    reason: >
      Choose asc-cli when you prefer a Swift-native App Store Connect client with JSON
      command affordances, a TUI and REST server, and optional private-API workflows.
    rel: alternative
    sources:
      - https://asccli.sh
      - https://github.com/tddworks/asc-cli#readme
  - id: brew:fastlane
    reason: >
      Choose fastlane when you need its mature lane/action ecosystem or one workflow
      spanning both Apple and Google Play releases; choose asc for a self-contained Go
      client focused on Apple services.
    rel: alternative
    sources:
      - https://asccli.sh/#faq
      - https://docs.fastlane.tools/
category: developer-tools
package-manager:
  brew: asc
  debian: asc
  dnf: asc
  nix: asc
  ubuntu: asc
  winget: Rorkai.ASC
package-manager-url: https://formulae.brew.sh/formula/asc
license: MIT
tags:
