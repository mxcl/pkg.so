id: brew:butane
display-name: Butane
homepage: https://coreos.github.io/butane/
repo: https://github.com/coreos/butane
docs:
  - https://coreos.github.io/butane
  - https://coreos.github.io/butane/getting-started
  - https://coreos.github.io/butane/specs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Butane became part of the Fedora CoreOS provisioning ecosystem because Fedora
      CoreOS machines are initialized through Ignition. It is packaged beyond Homebrew
      in Fedora, Nix, MacPorts, Scoop, winget, Alpine, and openSUSE according to the
      supplied package-manager facts, which reflects use by both Linux operators and
      workstation users preparing machine configs.
  package-nerd-significance:
    - >
      Butane is package-nerd interesting because it is not just a format converter: it
      encodes Fedora CoreOS and Ignition schema evolution into a small CLI that
      distributions can ship. Formula and distro maintainers care about its spec-version
      matrix, Go build process, and tight relationship with Ignition releases.
  project-history:
    - >
      The project was originally known as the Fedora CoreOS Config Transpiler, or FCCT,
      and was later renamed Butane. Its README still describes that lineage directly:
      Butane was formerly FCCT and translates human-readable configs into
      machine-readable Ignition configs.
    - >
      Butane tracks versioned config variants and Ignition spec versions. The
      development documentation describes separate versioned base and config packages,
      experimental spec versions, stabilization checklists, and a Fedora RPM-based
      release build process.
  related-projects:
    - Ignition is the machine-readable config format emitted by Butane.
    - >
      Fedora CoreOS is the operating-system project most closely associated with Butane
      configs.
    - >
      Fedora rpms/butane is the packaging repository described by the project
      development docs for released binaries.
  sources:
    - https://coreos.github.io/butane/getting-started
    - https://coreos.github.io/butane/specs
    - https://github.com/coreos/butane
    - https://github.com/coreos/butane/blob/main/docs/development.md
    - source_facts.package-manager
  summary:
    - >
      Butane is the Fedora CoreOS-era configuration transpiler that turns human-readable
      YAML-like Butane Configs into Ignition JSON. It sits in the provisioning path for
      Fedora CoreOS, Flatcar-style immutable host workflows, and other Ignition
      consumers where operators want reviewable source configuration without
      hand-writing low-level Ignition documents.
  timeline:
    - '2019: v0.1.0 tag appears in the official Git repository.'
    - '2020: The project continues under the Butane name after the FCCT era.'
    - '2026: v0.28.0 tag appears in the official Git repository.'
  usage:
    - >
      A typical workflow is to write a Butane config, run the `butane` CLI to validate
      and translate it, and feed the generated Ignition config to a Fedora CoreOS or
      related machine at first boot. The official docs emphasize the getting-started
      guide and per-variant configuration specifications.
related-packages: []
