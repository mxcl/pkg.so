history:
  adoption-history:
    - >
      Official documentation positions the Mac edition for Apple-silicon systems and
      documents gaming-oriented features including keyboard and mouse mappings, gamepad
      input, high frame rates, and multiple simultaneous Android devices.
    - >
      The product also gained a developer-oriented role through its command-line tool,
      ADB connectivity, device-property controls, and network simulation features.
  package-nerd-significance:
    - >
      For package-manager users, MuMuPlayer supplies an Apple-silicon-focused route to
      Android applications and games without maintaining an Android SDK emulator
      manually. Its command-line and ADB facilities also make it relevant to
      mobile-development workflows.
  project-history:
    - >
      MuMuPlayer for Mac emerged as the macOS member of the broader MuMuPlayer emulator
      family. Official guides published in 2024 used the MuMuPlayer Pro name; current
      official documentation calls the product MuMuPlayer for Mac.
  related-projects:
    - MuMuPlayer for Windows
    - Android Debug Bridge (ADB)
    - Google Play Store
  sources:
    - https://www.mumuplayer.com/help/
    - https://www.mumuplayer.com/help/mac/developer-support-function.html
    - https://www.mumuplayer.com/help/mac/multi-instance.html
    - https://www.mumuplayer.com/k1/mac/
  summary:
    - >
      MuMuPlayer for Mac is an Android emulator optimized for Apple-silicon Macs, with a
      strong emphasis on mobile gaming and support for application testing.
  timeline:
    - "2024: Official guides documented MuMuPlayer Pro's developer tools and macOS workflows."
    - '2025: Refreshed official help material adopted the MuMuPlayer for Mac name.'
  usage:
    - >
      Users create virtual Android devices, install applications from Google Play or
      APK-family packages, and control them with keyboard, mouse, trackpad, or gamepad
      input.
    - >
      Developers can connect through ADB or use the bundled command-line tool to inspect
      and control emulator instances.
