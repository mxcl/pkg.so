id: brew:lci
display-name: LCI
homepage: https://www.chatzi.org/lci/
repo: https://github.com/chatziko/lci
docs:
  - https://www.chatzi.org/lci/documentation
  - https://github.com/chatziko/lci#readme
  - https://www.chatzi.org/lci
config-file-location:
  unix:
    - $CMAKE_INSTALL_PREFIX/share/lci/.lcirc
    - ~/.lcirc
    - ./.lcirc
credentials-file-location: null
history:
  adoption-history:
    - >
      LCI is a niche educational and experimental language-runtime package rather than a
      broad application platform. Its Homebrew and Nix packaging makes it convenient for
      functional-programming and programming-language users who want a ready-made
      lambda-calculus interpreter without building from source.
  package-nerd-significance:
    - >
      LCI matters to package nerds as a compact example of a theoretical language tool
      packaged like a normal CLI runtime. It is small, GPL-licensed, and interesting
      mostly because it turns lambda-calculus pedagogy into an executable shell command.
  project-history:
    - >
      The LCI changelog records version 0.5 on 2006-03-13 as the first official release,
      noting that the code had existed before that date and that the release added an
      autotools build, readline support, macOS/Linux/Cygwin build testing, and major
      performance improvements.
    - >
      Version 1.0 on 2021-06-15 was described by the maintainer as the first major
      release after eighteen years. It replaced the custom parser with dparser, moved
      from autotools to CMake, replaced readline with replxx, added tests, and made the
      syntax more consistent between files and the REPL. Version 1.1 on 2024-12-14 added
      WebAssembly support for running LCI in a browser.
  related-projects:
    - >
      Related projects and components include dparser, replxx, Emscripten/WebAssembly,
      lambda-calculus teaching material, Church and Scott encodings, and other small
      lambda-calculus interpreters.
  sources:
    - https://api.github.com/repos/chatziko/lci/releases?per_page=20
    - https://github.com/chatziko/lci
    - https://raw.githubusercontent.com/chatziko/lci/master/ChangeLog.md
    - https://raw.githubusercontent.com/chatziko/lci/master/README.md
    - https://www.chatzi.org/lci
    - https://www.chatzi.org/lci/documentation
  summary:
    - >
      LCI is a small interpreter for the lambda calculus. It packages pure
      lambda-calculus evaluation with conveniences such as aliases, integers encoded in
      lambda terms, recursion, user-defined operators, lists, `let` syntax, multiple
      evaluation strategies, file interpretation, and an interactive REPL.
  timeline:
    - '2006-03-13: v0.5 first official release.'
    - '2008-02-14: v0.6 bugfix release corrected alpha-conversion behavior.'
    - '2021-06-15: v1.0 first major release after eighteen years.'
    - '2024-12-14: v1.1 added WebAssembly browser support and additional numeral encodings.'
  usage:
    - >
      Typical usage is interactive exploration of lambda terms through the `lci` REPL,
      or running `.lci` files that define aliases and evaluate terms. The bundled
      `.lcirc` library supplies common encodings and functions, while the documentation
      presents the interpreter as pure lambda calculus extended with syntax that remains
      encoded in the calculus.
related-packages: []
category: language-runtime
package-manager:
  brew: lci
  nix: lci
package-manager-url: https://formulae.brew.sh/formula/lci
license: GPL-2.0-or-later
tags:
  - cli
  - functional-programming
  - interpreter
  - lambda-calculus
  - programming-language
description: Interpreter for the lambda calculus
executables:
  - lci
provenance:
  formula: lci
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
