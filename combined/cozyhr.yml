id: brew:cozyhr
display-name: cozyhr
homepage: https://github.com/cozystack/cozyhr
repo: https://github.com/cozystack/cozyhr
docs:
  - https://github.com/cozystack/cozyhr#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official distribution evidence is narrow: the README documents Homebrew
      installation for macOS and Linux, and the batch source facts list only a Homebrew
      package-manager mapping. That points to a focused Cozystack ecosystem tool rather
      than a broadly packaged general-purpose CLI.
  package-nerd-significance:
    - >
      The package is notable mainly as a renamed, ecosystem-specific CLI split around
      HelmRelease development. For package databases, the former cozypkg name matters
      because it connects adjacent formula history and avoids treating the two names as
      unrelated tools.
  project-history:
    - >
      The official cozyhr README states that the project was formerly known as cozypkg.
      In its current form it is positioned as a wrapper around Helm and Flux CD, run
      from a local Helm chart directory.
  related-projects:
    - >
      cozyhr is related to Helm, Flux CD, HelmRelease resources, and the broader
      Cozystack project.
  sources:
    - https://github.com/cozystack/cozyhr#readme
  summary:
    - >
      cozyhr is a small Cozystack command-line tool for local development around Helm
      and Flux CD HelmRelease workflows.
  timeline:
    - >
      Renamed from cozypkg: The cozyhr README identifies cozyhr as the current name for
      the former cozypkg project.
    - 'Current distribution: The README documents Homebrew installation on macOS and Linux.'
  usage:
    - >
      cozyhr commands cover applying, deleting, diffing, listing, rendering,
      reconciling, suspending, and resuming HelmReleases. Its working-directory behavior
      is chart-centered, so it fits local iteration on Kubernetes packaging rather than
      cluster-wide platform administration.
related-packages:
  - id: brew:helm
    reason: >
      Use Helm to author, render, package, and directly manage the charts that cozyhr
      expects in its working directory.
    rel: adjacent_workflow
    sources:
      - https://github.com/cozystack/cozyhr#readme
      - https://helm.sh/docs/
  - id: brew:fluxcd
    reason: >
      Use the Flux CLI to administer the GitOps controllers and HelmRelease resources
      that cozyhr reconciles during local development.
    rel: adjacent_workflow
    sources:
      - https://github.com/cozystack/cozyhr#readme
      - https://fluxcd.io/flux/components/helm/helmreleases/
category: cloud-infrastructure
package-manager:
  brew: cozyhr
package-manager-url: https://formulae.brew.sh/formula/cozyhr
license: Apache-2.0
tags:
  - cli
  - fluxcd
  - gitops
  - helm
  - kubernetes
description: Cozy wrapper around Helm and Flux CD for local development
executables:
  - cozyhr
provenance:
  formula: cozyhr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
