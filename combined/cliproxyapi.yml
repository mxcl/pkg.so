id: brew:cliproxyapi
display-name: CLIProxyAPI
homepage: https://github.com/router-for-me/CLIProxyAPI
repo: https://github.com/router-for-me/CLIProxyAPI
docs:
  - https://github.com/router-for-me/CLIProxyAPI/tree/main/docs
  - https://help.router-for.me/
  - https://help.router-for.me/introduction/quick-start
config-file-location:
  macos:
    - $(brew --prefix)/etc/cliproxyapi.conf
    - /opt/homebrew/etc/cliproxyapi.conf
    - /usr/local/etc/cliproxyapi.conf
  unix:
    - config.yaml
    - ~/.cli-proxy-api/config.yaml
credentials-file-location:
  unix: ~/.cli-proxy-api
history:
  adoption-history:
    - >
      CLIProxyAPI had very strong package and GitHub adoption signals for a young
      project: GitHub repository metadata showed tens of thousands of stars and
      thousands of forks, while the Homebrew formula API reported tens of thousands of
      on-request installs over the preceding year and several hundred `--HEAD` installs.
    - >
      The README lists many projects based on or inspired by CLIProxyAPI, including
      vibeproxy, CPA management dashboards, quota inspectors, desktop wrappers, VS Code
      integrations, and sidecar patterns for coding agents.
  package-nerd-significance:
    - >
      CLIProxyAPI is package-nerd significant because it packages a fast-moving
      2025-2026 AI tooling pattern: turning subscription-backed CLI tools into local
      API-compatible endpoints. Its Homebrew formula, Scoop listing, management-center
      ecosystem, and numerous downstream wrappers show how package managers became the
      distribution layer for local AI proxy infrastructure.
  project-history:
    - >
      The GitHub repository was created on 2025-07-01. The official README describes the
      project as a proxy server for CLI models, including support for OpenAI Codex and
      Claude Code via OAuth, streaming and non-streaming responses, function calling,
      multimodal input, and reusable Go SDK docs.
    - >
      The project's docs moved beyond a single README into a help.router-for.me
      documentation site and a repository docs tree covering SDK usage, advanced
      executors and translators, access, watchers, and custom-provider examples.
  related-projects:
    - >
      The official README lists based-on projects such as vibeproxy, CCS, Quotio,
      ProxyPilot, Claude Proxy VSCode, CPA-Manager-Plus, CLIProxyAPI Dashboard,
      ProxyPal, Panopticon, Tunnel Agent, and Universal Chat Provider.
    - >
      The README also lists inspired or port projects such as 9Router, OmniRoute, PPAP,
      and Codex Switch.
  sources:
    - https://github.com/router-for-me/CLIProxyAPI#readme
    - https://github.com/router-for-me/CLIProxyAPI/tree/main/docs
    - https://help.router-for.me/
    - https://formulae.brew.sh/api/formula/cliproxyapi.json
    - https://github.com/router-for-me/CLIProxyAPI
  summary:
    - >
      CLI Proxy API is a Go proxy server that exposes OpenAI-, Gemini-, Claude-, Codex-,
      and Grok-compatible API interfaces backed by local or multi-account CLI
      authentication flows.
  timeline:
    - '2025-07-01: GitHub repository is created.'
    - >
      2025-2026: README documents OAuth support for Codex, Claude Code, Gemini, and
      other CLI-backed providers.
    - >
      2026: Homebrew formula tracks stable release 7.2.45 from the official GitHub tag
      archive.
    - '2026: README lists many downstream projects based on or inspired by CLIProxyAPI.'
  usage:
    - >
      Users run the proxy locally, authenticate CLI-backed providers through OAuth or
      API-key style flows, and point OpenAI-, Gemini-, Claude-, or Codex-compatible
      clients and SDKs at the local service. The README emphasizes multi-account load
      balancing, provider translation, management APIs, and integration with AI coding
      tools.
related-packages:
  - id: cask:codex
    reason: >
      CLIProxyAPI provides an official Codex client configuration that points Codex's
      Responses-compatible model provider at the local proxy endpoint.
    rel: adjacent_workflow
    sources:
      - https://help.router-for.me/agent-client/codex
      - https://developers.openai.com/codex
  - id: cask:claude-code
    reason: >
      CLIProxyAPI provides an official Claude Code configuration using its local base
      URL and API token, allowing Claude Code to consume models routed through the
      proxy.
    rel: adjacent_workflow
    sources:
      - https://help.router-for.me/agent-client/claude-code
      - https://code.claude.com/docs/en/overview
category: ai
package-manager:
  brew: cliproxyapi
  scoop: main/cliproxyapi
package-manager-url: https://formulae.brew.sh/formula/cliproxyapi
license: MIT
tags:
  - ai
  - api-proxy
  - claude
  - cli
  - codex
  - gemini
  - openai-compatible
description: Wrap Gemini CLI, Codex, Claude Code, Qwen Code as an API service
executables:
  - cliproxyapi
provenance:
  formula: cliproxyapi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
