id: brew:btllib
display-name: btllib
homepage: https://github.com/BirolLab/btllib
repo: https://github.com/BirolLab/btllib
docs:
  - https://birollab.github.io/btllib
  - https://github.com/bcgsc/btllib#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README recommends Conda/Bioconda for users, while Homebrew, Debian, and Ubuntu
      packaging in the input show that btllib also entered general system package
      collections. Its JOSS publication in 2022 gave the project a citable software
      record for research use.
    - >
      btllib is less a user-facing CLI than a packaged scientific dependency: package
      managers make its headers, static library, Python wrappers, and helper executables
      available to bioinformatics pipelines.
  package-nerd-significance:
    - >
      btllib matters in package history because it is research infrastructure: a shared
      lab library that crossed from source builds into Bioconda, Homebrew, Debian, and
      Ubuntu, while carrying a formal software citation through JOSS.
  project-history:
    - >
      The public git history starts in July 2019 with licensing, CI, and sequence-code
      commits. By 2020 the project had v1.0.0 tags, and it continued active releases
      through at least v1.7.8 in 2026.
    - >
      The README presents btllib as a C++ library with Python wrappers, Linux and macOS
      support, Meson/Ninja builds, generated wrappers, Doxygen documentation, and
      generated executables installed under the package prefix.
  related-projects:
    - >
      The README credits ntHash, MIBloomFilter, aaHash, cpptoml, and sdsl-lite
      components or dependencies.
    - >
      The README documents SAMtools and compression tools as runtime dependencies for
      particular file formats and workflows.
    - Bioconda is the recommended user installation channel in the README.
  sources:
    - >
      JOSS page records the 2022 paper 'btllib: A C++ library with Python interface for
      efficient genomic sequence processing':
      https://joss.theoj.org/papers/10.21105/joss.04720
    - >
      Local git history from https://github.com/bcgsc/btllib shows first commits in
      2019, v1.0.0 in 2020, and v1.7.8 in 2026.
    - >
      Official README describes btllib as a Bioinformatics Technology Lab common code
      library in C++ with Python wrappers:
      https://raw.githubusercontent.com/bcgsc/btllib/master/README.md
    - >
      Official README documents Conda/Bioconda installation, C++ linking, Python
      wrappers, executables, developer commands, credits, and citation instructions:
      https://raw.githubusercontent.com/bcgsc/btllib/master/README.md
    - Package-manager adoption from source_facts.package-manager.
  summary:
    - >
      btllib is the Bioinformatics Technology Lab common code library, implemented in
      C++ with Python wrappers for genomic sequence processing. It packages reusable
      sequence I/O, hashing, Bloom-filter, and related components used by BTL/Birol Lab
      bioinformatics tools.
  timeline:
    - '2019: Public repository history starts with license, CI, and sequence-code setup.'
    - '2020: v1.0.0 appears in git history.'
    - '2022: JOSS publishes the btllib software paper.'
    - '2026: v1.7.8 appears in git history.'
  usage:
    - >
      Developers link C++ code against libbtllib, include btllib headers, or import the
      generated Python wrappers. Runtime workflows can rely on external tools such as
      SAMtools and compression utilities, and btllib-generated executables are installed
      under the package prefix's bin directory.
related-packages:
  - id: brew:samtools
    reason: >
      Use SAMtools alongside btllib when a sequence-processing workflow needs the SAM,
      BAM, or CRAM support that btllib lists as a runtime dependency.
    rel: adjacent_workflow
    sources:
      - https://github.com/BirolLab/btllib#using-the-library
      - https://www.htslib.org/doc/samtools.html
category: science
package-manager:
  brew: btllib
  debian: btllib-tools
  ubuntu: btllib-tools
package-manager-url: https://formulae.brew.sh/formula/btllib
license: GPL-3.0-or-later
tags:
  - bioinformatics
  - cli
  - cpp
  - library
  - python
  - sequencing
description: Bioinformatics Technology Lab common code library
executables:
  - indexlr
  - mi_bf_generate
  - randseq
provenance:
  formula: btllib
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
