id: brew:darcs
display-name: Darcs
homepage: https://darcs.net/
repo: http://darcs.net/
docs:
  - https://darcs.net/FAQ
  - https://darcs.net/Using
  - https://darcs.net/Using/Commands
config-file-location:
  unix:
    - ~/.darcs/defaults
    - _darcs/prefs/defaults
    - ~/.darcs/author
    - _darcs/prefs/author
credentials-file-location: null
history:
  adoption-history:
    - >
      Darcs has been a durable niche VCS in the Haskell and functional-programming
      world: it remains packaged by major Unix package managers, published on
      Hackage/cabal workflows, and hosted on Darcs Hub, which the project names as
      today's place for Darcs project hosting.
  package-nerd-significance:
    - >
      For package nerds, Darcs is a reminder that version control history is not just
      Git history: it carries its own repository format, hosting culture,
      patch-screening workflow, Haskell toolchain requirements, and config file
      conventions.
  project-history:
    - >
      The Darcs site contrasts Darcs with Git, Mercurial, and Subversion by emphasizing
      changes instead of snapshots. Its documentation and talks center on patch theory,
      commute behavior, and a contributor flow built around screened and reviewed
      repositories.
  related-projects:
    - >
      Darcs is commonly compared with Git, Mercurial, and Subversion, and its ecosystem
      includes Darcs Hub, darcsden, Trac Darcs integrations, Hackage/cabal packaging,
      and the Darcs wiki itself.
  sources:
    - https://darcs.net/
    - https://darcs.net/Talks/DagitThesis
    - https://darcs.net/Development/GettingStarted
    - https://darcs.net/Development/FAQ
    - https://darcs.net/Using/Configuration
    - https://darcs.net/Hosting
    - https://hub.darcs.net/darcs/darcs-screened
  summary:
    - >
      Darcs is a free, open-source distributed version control system written in Haskell
      and known for modeling work as patches rather than repository snapshots.
  timeline:
    - >
      2000s: David Roundy's Darcs and patch-theory work established the project's
      distinctive model.
    - >
      2010s: Darcs Hub and darcsden-style hosting became the main public hosting story
      for Darcs users.
    - >
      2026: The Darcs front page lists Darcs 2.18.5 and cabal, stack, Nix, binary, and
      source install paths.
  usage:
    - >
      Users clone repositories, record patches, inspect authors, send or upload patches
      for review, and tune behavior through repository-local _darcs/prefs files or
      per-user ~/.darcs files.
related-packages:
  - id: brew:git
    reason: >
      Choose Git when broad hosting, editor, and collaboration-tool support matters more
      than Darcs' change-oriented patch model.
    rel: alternative
    sources:
      - https://darcs.net/
      - https://git-scm.com/about
  - id: brew:mercurial
    reason: >
      Choose Mercurial for distributed source control with a conventional changeset
      history and an intentionally approachable command interface.
    rel: alternative
    sources:
      - https://darcs.net/
      - https://www.mercurial-scm.org/
  - id: brew:subversion
    reason: >
      Choose Apache Subversion when a centralized repository and established
      enterprise-style workflow are required instead of distributed patch exchange.
    rel: alternative
    sources:
      - https://darcs.net/
      - https://subversion.apache.org/
category: developer-tools
package-manager:
  apk: darcs
  brew: darcs
  debian: darcs
  dnf: darcs
  macports: darcs
  nix: darcs
  pacman: darcs
package-manager-url: https://formulae.brew.sh/formula/darcs
license: GPL-2.0-or-later
tags:
  - cli
  - distributed-vcs
  - haskell
  - patch-based
  - version-control
description: Distributed version control system that tracks changes, via Haskell
executables:
  - darcs
provenance:
  formula: darcs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
