id: brew:enchive
display-name: Enchive
homepage: https://github.com/skeeto/enchive
repo: https://github.com/skeeto/enchive
docs:
  - https://github.com/skeeto/enchive#readme
  - https://nullprogram.com/man/enchive.1.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/enchive/enchive.pub
    - ~/.config/enchive/enchive.pub
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/enchive/enchive.sec
    - ~/.config/enchive/enchive.sec
history:
  adoption-history:
    - >
      Enchive's README explicitly says it does not need critical mass because it does
      not need to interoperate with other systems or people. Its adoption story is
      therefore narrow by design: it appeals to users who want a copyable, auditable CLI
      for personal encrypted archives rather than a shared standard.
  package-nerd-significance:
    - >
      Enchive is package-nerd interesting because it is deliberately small: one CLI, no
      external dependencies, a documented file format, and a build that can produce a
      standalone C program. It represents the opposite end of the packaging spectrum
      from large crypto suites.
    - >
      The tradeoff is visible in the README: Enchive is not trying to be a universal
      format or social web of keys. It is for users who want a simple local archival
      workflow and are comfortable choosing a niche tool for that job.
  project-history:
    - >
      The public repository dates to 2017, and the project's own documentation frames it
      as intentionally self-contained rather than ecosystem-seeking. It uses public-key
      style archival: a public key can encrypt files on machines that should not hold
      the secret key, while the secret key is needed for extraction.
  related-projects:
    - GnuPG and encrypted filesystems are named by the README as more complex alternatives.
    - >
      Curve25519, ChaCha-family encryption, HMAC-SHA256, and an scrypt-like key
      derivation algorithm are documented implementation pieces.
  sources:
    - https://github.com/skeeto/enchive
    - https://raw.githubusercontent.com/skeeto/enchive/master/README.md
    - https://nullprogram.com/enchive/
    - https://api.github.com/repos/skeeto/enchive
  summary:
    - >
      Enchive is a small personal-file encryption tool for archiving files to yourself.
      Its README positions it as a focused alternative to larger systems such as GnuPG
      or encrypted filesystems, with no external dependencies and portability
      prioritized over performance.
  timeline:
    - '2017: Public GitHub repository created.'
    - '2018: Published manual page generated for Enchive.'
    - '2025: Repository remained updated, according to available GitHub metadata.'
  usage:
    - >
      The documented workflow has three core commands: `keygen`, `archive`, and
      `extract`. By default, `keygen` writes `enchive.pub` and `enchive.sec` under
      `$XDG_CONFIG_HOME/enchive` or `~/.config/enchive`; archiving produces a `.enchive`
      file while leaving the original in place unless deletion is requested.
    - >
      The tool also supports deriving an asymmetric key pair from a passphrase, using an
      scrypt-like memory-hard derivation scheme, and can run a short-lived key agent on
      Unix-like systems to avoid repeated passphrase prompts.
related-packages:
  - id: brew:gnupg
    reason: >
      Choose GnuPG when OpenPGP interoperability, recipient key exchange, signatures,
      and a broad key-management ecosystem matter more than Enchive's compact
      personal-archive workflow and passphrase-derived key pair.
    rel: alternative
    sources:
      - https://github.com/skeeto/enchive#readme
      - https://gnupg.org/documentation/manuals/gnupg/
category: security
package-manager:
  brew: enchive
  nix: enchive
  zypper: enchive
package-manager-url: https://formulae.brew.sh/formula/enchive
license: Unlicense
tags:
  - archive
  - cli
  - curve25519
  - encryption
  - security
description: Encrypted personal archives
executables:
  - enchive
provenance:
  formula: enchive
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
