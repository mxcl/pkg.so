id: brew:asciidoctorj
display-name: AsciidoctorJ
homepage: https://github.com/asciidoctor/asciidoctorj
repo: https://github.com/asciidoctor/asciidoctorj
docs:
  - https://docs.asciidoctor.org/asciidoctorj/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AsciidoctorJ's adoption path is centered on Java build tooling. The README
      documents Maven, Gradle, SBT, and Leiningen dependency examples and says the
      artifacts are published to Maven Central, which made it useful for documentation
      pipelines embedded in JVM projects.
    - >
      Package-manager adoption followed the same developer-tool pattern: the input
      package facts list Homebrew, Chocolatey, MacPorts, Nix, and Scoop packages. That
      spread matters because AsciidoctorJ is often installed as a CLI by documentation
      authors even when the underlying attraction is JVM integration.
  package-nerd-significance:
    - >
      AsciidoctorJ is interesting to package nerds because it packages a Ruby-origin
      documentation processor for the JVM world. It bridges language ecosystems: Ruby
      Asciidoctor behavior, Java dependency management, build plugins, and a
      cross-platform command-line distribution all meet in one package.
  project-history:
    - >
      The project sits inside the Asciidoctor ecosystem as the Java binding layer for
      the Ruby Asciidoctor processor. Its official README describes AsciidoctorJ as the
      official library for running Asciidoctor on the JVM and credits Alex Soto, Dan
      Allen, and Robert Panzer as maintainers/authors on the README header.
    - >
      AsciidoctorJ's early public release line was already formalized by 2014: the
      repository has an annotated `asciidoctorj-1.5.0` tag dated 2014-08-17, and the
      README notes that the Maven artifactId changed to `asciidoctorj` starting in
      1.5.0. The project later kept a long 2.x series and published 3.0.0 in 2024,
      continuing the JVM-facing role while the wider Asciidoctor documentation moved to
      docs.asciidoctor.org.
  related-projects:
    - Asciidoctor is the upstream AsciiDoc processor that AsciidoctorJ runs on the JVM.
    - >
      Asciidoctor Maven and Gradle integrations are documented as build-system paths for
      using AsciidoctorJ.
  sources:
    - >
      https://api.github.com/repos/asciidoctor/asciidoctorj/git/tags/7c13dc87906743b5524a6f7ac6c3c9e23e54ead5
    - https://docs.asciidoctor.org/asciidoctorj/latest
    - https://github.com/asciidoctor/asciidoctorj
    - source_facts.package-manager
  summary:
    - >
      AsciidoctorJ is the official JVM integration for Asciidoctor, letting Java and
      other JVM programs run Asciidoctor and inspect parsed AsciiDoc documents. For
      package users it is both a command-line converter and a Maven Central artifact
      family, making AsciiDoc processing available in Java build systems without
      requiring a separate Ruby toolchain.
  timeline:
    - '2013: GitHub repository created for Java bindings for Asciidoctor.'
    - >
      2014: `asciidoctorj-1.5.0` annotated tag published; README notes the artifactId
      changed to `asciidoctorj` in 1.5.0.
    - '2021: 2.5.0 release published.'
    - '2024: 3.0.0 release published.'
  usage:
    - >
      The CLI use case is converting AsciiDoc files from the shell, for example running
      `asciidoctorj -b pdf README.adoc`. The library use case is declaring
      `org.asciidoctor:asciidoctorj` in a JVM build and invoking Asciidoctor conversion
      or AST inspection from Java or another JVM language.
related-packages:
  - id: brew:asciidoctor
    reason: >
      Choose the native Ruby Asciidoctor package when a JVM or Java API is unnecessary
      and the standard asciidoctor CLI and Ruby extension ecosystem are preferred.
    rel: alternative
    sources:
      - https://docs.asciidoctor.org/asciidoctor/latest/
      - https://docs.asciidoctor.org/asciidoctorj/latest/
category: developer-tools
package-manager:
  brew: asciidoctorj
  chocolatey: asciidoctorj
  macports: asciidoctorj
  nix: asciidoctorj
  scoop: main/asciidoctorj
package-manager-url: https://formulae.brew.sh/formula/asciidoctorj
license: Apache-2.0
tags:
  - asciidoc
  - cli
  - documentation
  - java
  - jvm
description: Java wrapper and bindings for Asciidoctor
executables:
  - asciidoctorj
provenance:
  formula: asciidoctorj
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
