id: brew:lanraragi
display-name: LANraragi
homepage: https://lrr.tvc-16.science
repo: https://github.com/Difegue/LANraragi
docs:
  - https://sugoi.gitbook.io/lanraragi
config-file-location:
  unix: lrr.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      LANraragi's adoption is centered on self-hosters who keep manga/comic libraries on
      NAS, Docker hosts, or local servers. The README advertises Docker pulls, GitHub
      release downloads, Homebrew packaging, a demo site, Discord, GitHub Discussions,
      and hosted translation via Weblate, all of which point to a community-maintained
      media-server project rather than a single-purpose reader.
  package-nerd-significance:
    - >
      For package nerds, LANraragi is one of the more distinctive Homebrew media-server
      formulas: a Perl/Mojolicious and Redis application for a niche archive-library
      workflow. It matters less as a Unix primitive and more as a packaged self-hosted
      app that crosses Docker, NAS, Windows, and CLI service management.
  project-history:
    - >
      The upstream README describes LANraragi as an open-source server for archival of
      comics and manga, running on Mojolicious and Redis. Its feature set grew around
      keeping archives in compressed formats, reading them from a web browser, exposing
      OPDS and client APIs, and importing metadata through plugins.
    - >
      The release history shows a long-running hobbyist/self-hosted project with many
      themed releases. Version 0.7.8 was discussed on 2021-04-07 as a front-end
      improvement release. Version 0.8.7 was announced on 2022-10-14 with Windows
      installation fixes and Docker-related adjustments. Version 0.9.3 was discussed on
      2024-12-28 with new plugins and API additions, and later 0.9.x releases continued
      API-client and downloader fixes.
  related-projects:
    - >
      Related projects include Mojolicious, Redis, Docker, OPDS readers, comic archive
      formats such as CBZ/CBR, and metadata sources consumed by LANraragi plugins.
  sources:
    - https://github.com/Difegue/LANraragi
    - https://github.com/Difegue/LANraragi/discussions/1135
    - https://github.com/Difegue/LANraragi/discussions/445
    - https://github.com/Difegue/LANraragi/discussions/704
    - https://github.com/Difegue/LANraragi/releases
    - https://raw.githubusercontent.com/Difegue/LANraragi/dev/README.md
    - https://sugoi.gitbook.io/lanraragi
  summary:
    - >
      LANraragi is a self-hosted web server for archiving and reading comics and manga,
      built around archive files, Mojolicious, Redis, plugins, and browser-based
      reading.
  timeline:
    - '2021-04-07: Version 0.7.8 discussion described front-end improvements.'
    - >
      2022-10-14: Version 0.8.7 discussion documented Windows install fixes and Docker
      adjustments.
    - '2024-12-28: Version 0.9.3 discussion described new features, plugins, and API work.'
    - '2025-07-25: Version 0.9.21 release notes described an API-client hotfix.'
    - '2025-11-04: Version 0.9.22 release notes described a downloader hotfix.'
  usage:
    - >
      Users point LANraragi at archive files such as zip, rar, 7z, cbz, cbr, PDF, and
      related formats. The server indexes them, serves a browser reader, exposes
      OPDS/API access for external readers, and can use plugins to import tags and
      metadata.
related-packages:
  - id: cask:opencomic
    reason: >
      OpenComic can act as a desktop reading companion for LANraragi because it supports
      OPDS catalogs, while LANraragi exposes an OPDS catalog specifically for external
      readers.
    rel: adjacent_workflow
    sources:
      - https://sugoi.gitbook.io/lanraragi/advanced-usage/external-readers
      - https://www.opencomic.app/docs/guides/features/
category: media
