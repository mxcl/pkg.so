id: brew:gnu-chess
display-name: GNU Chess
homepage: https://www.gnu.org/software/chess/
repo: https://git.savannah.gnu.org/cgit/chess.git
docs:
  - https://www.gnu.org/software/chess/manual/html_node
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/gnuchess/gnuchess.ini
    - ~/.config/gnuchess/gnuchess.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Chess has been widely used as a packaged chess engine because it works from a
      terminal yet also plugs into graphical front ends. The v6 developer notes
      explicitly cite worldwide use as the reason for preserving old interfaces while
      adopting Fruit. The manual describes use as both an interactive text-console
      program and a backend engine for XBoard-compatible front ends, with UCI mode also
      available.
  package-nerd-significance:
    - >
      GNU Chess matters to package culture because it is both a historically
      recognizable GNU game and an engine compatibility artifact. It links the older
      XBoard/Chess Engine Communication Protocol world with the UCI engine world, making
      it useful for testing front ends, packaging chess engine stacks, and keeping a
      free command-line baseline available across Unix-like systems.
  project-history:
    - >
      GNU Chess belongs to the early tradition of free software chess programs and
      retained long-term value because it shipped complete source, a command interface,
      and portable Unix build tooling. The GNU project later renamed its distribution
      file from `chess` to `gnuchess`, reflecting the conventional package and
      executable identity used by distributions.
    - >
      The version 6 line was a major architectural turn. The GNU Chess manual explains
      that the last 5.x release was 5.08 in 2011, after which Fruit 2.1, by Fabien
      Letouzey, became the base for GNU Chess v6 after copyright assignment to the Free
      Software Foundation. GNU Chess 6 kept backward-compatible external interfaces
      while adapting Fruit through a PolyGlot-based protocol adapter.
    - >
      The NEWS file records GNU Chess 6.0.0 as the first official v6 release in April
      2011. Subsequent releases added internationalization, graphical terminal board
      display, UCI mode fixes, XBoard integration files, man-page generation, PGN
      replay, command history, configuration handling, and security fixes.
  related-projects:
    - Fruit 2.1 supplies the engine base for GNU Chess v6.
    - PolyGlot supplies the adapter model used to bridge UCI and XBoard-style communication.
    - >
      XBoard and WinBoard are front ends in the chess ecosystem that shaped GNU Chess
      interface compatibility.
  sources:
    - https://ftp.gnu.org/gnu/chess/README.gnuchess
    - https://git.savannah.gnu.org/cgit/chess.git/plain/NEWS
    - https://git.savannah.gnu.org/cgit/chess.git/plain/README
    - https://www.gnu.org/software/chess/manual/html_node/Background-of-v6.html
    - https://www.gnu.org/software/chess/manual/html_node/Chess-engine-protocol-adapter.html
    - >
      https://www.gnu.org/software/chess/manual/html_node/Guidelines-followed-to-develop-GNU-Chess-v6.html
  summary:
    - >
      GNU Chess is the GNU Project chess program: a command-line chess interface and
      engine that became important both as a playable free software game and as a stable
      backend for chess front ends.
  timeline:
    - '2011: GNU Chess 5.08 ended the 5.x line.'
    - '2011: GNU Chess 6.0.0 released with Fruit 2.1 and PolyGlot-derived adapter architecture.'
    - '2013: GNU Chess 6.1.0 added gettext internationalization and terminal graphic mode.'
    - '2015: GNU Chess 6.2.0 added tighter XBoard integration and a generated man page.'
    - '2021: GNU Chess 6.2.9 fixed CVE-2021-30184 in PGN loading and replay.'
  usage:
    - >
      Practitioners run `gnuchess` directly for terminal play, script it for engine
      experiments, pair it with XBoard or other chess front ends, or invoke UCI mode
      when a UCI-speaking interface is desired. Package users also rely on its book
      files, PGN loading and saving, FEN/EPD workflows, and configuration file behavior
      for repeatable engine sessions.
related-packages:
  - id: brew:stockfish
    reason: >
      Choose Stockfish when maximum orthodox-chess analysis strength and a dedicated UCI
      engine are the priority; choose GNU Chess when terminal play and historical XBoard
      compatibility are useful.
    rel: alternative
    sources:
      - https://www.gnu.org/software/chess/
      - https://stockfishchess.org/
      - https://github.com/official-stockfish/Stockfish#readme
  - id: brew:xboard
    reason: >
      XBoard is GNU Chess’s documented graphical front end and can launch it as a
      backend using the `--xboard` protocol mode.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/chess/manual/html_node/XBoard-chess-engine.html
      - https://www.gnu.org/software/xboard/
      - https://www.gnu.org/software/xboard/manual/xboard.html
category: games
