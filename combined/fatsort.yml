id: brew:fatsort
display-name: FATSort
homepage: https://fatsort.sourceforge.io/
repo: https://sourceforge.net/p/fatsort/code
docs:
  - https://fatsort.sourceforge.io/
  - https://fatsort.sourceforge.io/fatsort.1.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FATSort has remained a packaged Unix utility because its problem still appears on
      embedded devices, car stereos, cameras, and music players that expose FAT media.
      The official homepage notes inclusion in Fedora, Debian, Ubuntu, and Gentoo, which
      is unusually broad distribution for such a specialized filesystem tool.
  package-nerd-significance:
    - >
      For package-manager users, FATSort is the sort of tool that justifies a formula or
      distro package despite a tiny feature surface. It preserves a hardware-era
      workaround in a reproducible command-line form, with enough filesystem checks and
      portability fixes to be safer than one-off scripts.
  project-history:
    - >
      The official homepage says FATSort was originally written for a hardware MP3
      player that did not sort MP3 files automatically, because no suitable utility
      existed at the time. That origin explains both the tool's narrow scope and its
      long maintenance life: it operates directly on filesystem directory structures
      rather than acting as a general file organizer.
    - >
      The changelog shows a steady hardening cycle around filesystem correctness. FAT12
      support appeared with the 1.0 release in 2013, exFAT support arrived in 1.6.0 in
      2019, and later releases focused on endianness, locale, long-filename,
      multi-byte-character, and consistency checks.
  related-projects:
    - >
      FATSort sits beside FAT filesystem utilities rather than replacing them; it is
      concerned with directory-entry ordering, not formatting, checking, or repairing
      whole filesystems.
  sources:
    - https://fatsort.sourceforge.io/
    - https://fatsort.sourceforge.io/fatsort.1.html
    - https://fatsort.sourceforge.io/CHANGES.html
    - https://sourceforge.net/p/fatsort/code
  summary:
    - >
      FATSort is a small C utility for sorting directory entries on FAT12, FAT16, FAT32,
      and exFAT filesystems. Its niche is practical rather than fashionable: it fixes
      the ordering seen by devices that read FAT directories in on-disk order instead of
      presenting their own sorted view.
  timeline:
    - '2009: Changelog shows active 0.9.x maintenance by September 2009.'
    - '2013: FATSort 1.0 adds FAT12 support and stronger filesystem integrity checks.'
    - '2019: FATSort 1.6.0 adds exFAT support.'
    - >
      2025: FATSort 1.7 improves exFAT directory entry handling and string comparison
      performance.
    - '2026: FATSort 1.7.1 ships bug fixes for string termination and version tests.'
  usage:
    - >
      Typical use is direct and low-level: run `fatsort [OPTIONS] DEVICE` against an
      unmounted FAT filesystem or block device, choosing sort order, reverse order,
      random order, modification-time order, locale handling, and directory inclusion or
      exclusion as needed. The man page emphasizes that it sorts the filesystem
      directory structure itself.
related-packages:
  - id: brew:dosfstools
    reason: >
      Use dosfstools' fsck.fat to check or repair FAT media before FATSort changes
      directory ordering, since FATSort's official man page requires a consistent
      filesystem.
    rel: adjacent_workflow
    sources:
      - https://fatsort.sourceforge.io/fatsort.1.html
      - https://github.com/dosfstools/dosfstools
category: system
package-manager:
  brew: fatsort
  debian: fatsort
  dnf: fatsort
  macports: fatsort
  nix: fatsort
  pacman: fatsort
  ubuntu: fatsort
  zypper: fatsort
package-manager-url: https://formulae.brew.sh/formula/fatsort
license: GPL-2.0-or-later
