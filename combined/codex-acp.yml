id: brew:codex-acp
display-name: ACP adapter for Codex
homepage: https://github.com/agentclientprotocol/codex-acp
repo: https://github.com/agentclientprotocol/codex-acp
docs:
  - https://github.com/zed-industries/codex-acp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README says current Zed versions can use the adapter out of the box, while
      other ACP clients can run codex-acp directly or via npm. The supplied package
      facts list Homebrew and Nix distribution.
  package-nerd-significance:
    - >
      For package maintainers, codex-acp is an integration package sitting between a
      fast-moving AI coding CLI and editor-side protocol clients. Its distribution
      significance is less about standalone algorithms and more about making Codex
      installable as a protocol-speaking executable.
  project-history:
    - >
      The Zed Industries README describes the package as an ACP adapter around the Codex
      CLI. It also states that development is moving to agentclientprotocol/codex-acp,
      where implementation and maintenance work is being pooled across teams.
  related-projects:
    - >
      The README links the adapter to OpenAI Codex, the Agent Client Protocol, Zed
      external-agent support, and the newer agentclientprotocol/codex-acp repository.
  sources:
    - https://github.com/zed-industries/codex-acp#readme
  summary:
    - >
      codex-acp is an adapter that exposes OpenAI Codex through the Agent Client
      Protocol for ACP-compatible clients such as Zed.
  timeline:
    - 'README: Development is moving to agentclientprotocol/codex-acp.'
    - >
      README: Zed can use the adapter out of the box, while other ACP clients can run
      codex-acp directly or via npm.
  usage:
    - >
      The adapter is aimed at editor and agent-client integrations rather than general
      shell scripting. The README lists support for context mentions, images, tool calls
      with permission requests, edit review, TODO lists, slash commands, client MCP
      servers, and ChatGPT or API-key authentication methods.
related-packages:
  - id: cask:zed
    reason: >
      Zed installs ACP external agents from its registry and documents Codex threads,
      providing a graphical editor client for the codex-acp server.
    rel: adjacent_workflow
    sources:
      - https://zed.dev/docs/ai/external-agents
      - https://github.com/agentclientprotocol/codex-acp#readme
  - id: cask:codex
    reason: >
      Set `CODEX_PATH` when codex-acp should launch a separately installed Codex CLI
      instead of its bundled dependency.
    rel: adjacent_workflow
    sources:
      - https://github.com/agentclientprotocol/codex-acp#readme
      - https://learn.chatgpt.com/docs/codex/cli
category: ai
package-manager:
  brew: codex-acp
  nix: codex-acp
package-manager-url: https://formulae.brew.sh/formula/codex-acp
license: Apache-2.0
tags:
  - adapter
  - agent-client-protocol
  - ai
  - ai-coding
  - cli
  - codex
  - zed
description: ACP server that exposes Codex CLI functionality for ACP-compatible clients
executables:
  - codex-acp
provenance:
  formula: codex-acp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
