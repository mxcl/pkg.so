id: cask:bwana
display-name: Bwana
homepage: https://www.bruji.com/bwana/
repo: https://bitbucket.org/bruji/bwana
docs:
  - https://www.bruji.com/bwana
  - https://www.bruji.com/bwana/new.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Successive releases broadened browser compatibility beyond Safari, added MANPATH
      discovery and indexing, handled compressed and nonstandard man pages, and
      eventually added 64-bit and macOS Mojave support.
  package-nerd-significance:
    - >
      Bwana turns the traditional Unix `man` corpus into linked, styled HTML while
      retaining the locally installed manuals. It is an unusually Mac-native bridge
      between command-line documentation and graphical web browsing.
  project-history:
    - >
      Bruji released Bwana in 2004 as a lightweight macOS utility for opening Unix
      manual pages in a web browser through the `man:` URL scheme. The source was
      published under the MIT license.
  related-projects:
    - >
      Works with the system's installed Unix manual pages and historically supported
      Safari, Firefox, Camino, iCab, OmniWeb, and WebKit builds.
  sources:
    - https://www.bruji.com/bwana/
    - https://www.bruji.com/bwana/new.html
  summary:
    - >
      Bwana is a macOS man-page reader that renders locally installed Unix manuals as
      readable, interlinked pages in a web browser.
  timeline:
    - '2004: Initial 0.9 and 1.0 releases introduced browser-rendered man pages and an index.'
    - '2006: Version 2.0 improved compressed-page and nonstandard-path handling.'
    - '2009: Version 2.7 updated Firefox integration.'
    - '2018: Version 2.8 added 64-bit and macOS Mojave support.'
  usage:
    - >
      After installation, users enter `man:<command>` in a browser, use `man:` for the
      index, or use `man:index_refresh` to rebuild the index from local manual-page
      sources.
category: developer-tools
package-manager:
  brew-cask: bwana
package-manager-url: https://formulae.brew.sh/cask/bwana
tags:
  - documentation-browser
  - macos
  - man-pages
  - mit-license
  - unix
  - url-scheme
description: Unix manual page reader for web browsers
applications:
  - Bwana.app
provenance:
  cask: bwana
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
