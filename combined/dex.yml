id: brew:dex
display-name: dex
homepage: https://github.com/tihirvon/dex
repo: https://github.com/tihirvon/dex
docs:
  - https://github.com/tihirvon/dex/tree/master/Documentation
  - https://github.com/tihirvon/dex#readme
config-file-location:
  unix:
    - ~/.dex/rc
    - ~/.dex/syntax/*
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts show broad packaging across Homebrew, Nix, Debian, Ubuntu,
      Arch, Alpine, and openSUSE-style package managers.
  package-nerd-significance:
    - >
      It is a compact C-and-ncurses editor with minimal dependencies, making it
      attractive for terminal-first systems and distribution packaging.
  project-history:
    - >
      The README identifies dex as the Dextrous text editor and includes a 2010
      copyright notice for Timo Hirvonen.
  related-projects:
    - ncurses editors, Exuberant Ctags, terminal programmer editors.
  sources:
    - https://github.com/tihirvon/dex#readme
    - https://github.com/tihirvon/dex/tree/master/Documentation
    - source_facts.package-manager
  summary:
    - >
      dex is a small ncurses-based text editor aimed at flexible terminal editing rather
      than becoming a full IDE.
  timeline:
    - '2010: README copyright notice for the Dextrous text editor.'
    - '2015: GitHub shows v1.0 as the latest release dated Apr 28, 2015.'
  usage:
    - >
      dex opens files in a terminal editor, supports customizable colors and bindings,
      ctags navigation, compiler-error parsing, command execution, filtering, filetype
      options, syntax files, and per-user rc files.
related-packages:
  - id: brew:ctags
    reason: >
      dex explicitly supports tag navigation using files generated by Exuberant Ctags,
      making ctags a documented companion for source-code browsing.
    rel: adjacent_workflow
    sources:
      - https://github.com/tihirvon/dex/blob/master/Documentation/dex.txt
      - https://ctags.sourceforge.net/ctags.html
category: developer-tools
package-manager:
  apk: dex
  brew: dex
  debian: dex
  nix: dex
  pacman: dex
  ubuntu: dex
  zypper: dex
package-manager-url: https://formulae.brew.sh/formula/dex
license: GPL-2.0-only
tags:
  - cli
  - ctags
  - editor-tools
  - ncurses
  - programming
  - terminal
  - text-editor
description: Dextrous text editor
executables:
  - dex
provenance:
  formula: dex
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
