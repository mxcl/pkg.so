id: brew:jsawk
display-name: jsawk
homepage: https://github.com/micha/jsawk
repo: https://github.com/micha/jsawk
docs:
  - https://github.com/micha/jsawk#readme
config-file-location:
  unix:
    - /etc/jsawkrc
    - ~/.jsawkrc
credentials-file-location: null
history:
  adoption-history:
    - >
      jsawk remained a compact Unix-style tool rather than a large ecosystem. Homebrew
      packages version 1.4 from the GitHub tag archive, and the repository has enough
      stars and forks to show durable interest among shell users who wanted JSON
      manipulation before jq became the default answer.
  package-nerd-significance:
    - >
      jsawk is a useful historical waypoint in the JSON-on-the-command-line story: it
      shows the pre-jq period when developers tried to extend familiar text filters with
      JavaScript object access instead of adopting a purpose-built JSON query language.
  project-history:
    - >
      The GitHub repository was created in May 2009. Its README frames the tool as awk
      for JSON: input is parsed into arrays and objects, JavaScript expressions filter
      or transform the data, and output returns to stdout for shell pipelines.
  related-projects:
    - >
      Related tools include awk, jq, gron, JSON.sh, fx, jc, and the author's resty
      command-line REST client.
  sources:
    - https://api.github.com/repos/micha/jsawk
    - https://formulae.brew.sh/formula/jsawk
    - https://github.com/micha/jsawk
    - https://github.com/micha/resty
  summary:
    - >
      jsawk is a small command-line filter that applies awk-like pipeline habits to JSON
      data by evaluating JavaScript over objects read from standard input.
  timeline:
    - '2009: GitHub repository created.'
    - '2010s: Homebrew packaged jsawk as a JSON-aware shell filter.'
    - '2026: Homebrew continued to package the 1.4 tag archive.'
  usage:
    - >
      Typical usage is piping REST API JSON into jsawk, selecting or transforming fields
      with JavaScript, and either emitting JSON again or printing custom text for
      another command in the pipeline.
related-packages:
  - id: brew:jq
    reason: >
      Choose jq for a maintained, purpose-built JSON query language with comprehensive
      filtering and transformation features; choose jsawk when expressing the
      transformation as JavaScript is the primary attraction.
    rel: alternative
    sources:
      - https://github.com/micha/jsawk
      - https://jqlang.github.io/jq/
      - https://jqlang.github.io/jq/manual/
  - id: brew:resty
    reason: >
      The jsawk README explicitly demonstrates resty fetching and updating REST
      resources on either side of a jsawk JSON transformation pipeline.
    rel: adjacent_workflow
    sources:
      - https://github.com/micha/jsawk
      - https://github.com/micha/resty
category: developer-tools
package-manager:
  brew: jsawk
package-manager-url: https://formulae.brew.sh/formula/jsawk
license: BSD-3-Clause
tags:
  - awk
  - cli
  - data-processing
  - javascript
  - json
description: Like awk, but for JSON, using JavaScript objects and arrays
executables:
  - jsawk
provenance:
  formula: jsawk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
