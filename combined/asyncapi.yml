id: brew:asyncapi
display-name: AsyncAPI CLI
homepage: https://www.asyncapi.com/tools/cli
repo: https://github.com/asyncapi/cli
docs:
  - https://www.asyncapi.com/docs/tools/cli
  - https://www.asyncapi.com/docs/tools/cli/context
  - https://www.asyncapi.com/docs/tools/cli/usage
config-file-location:
  unix:
    - .asyncapi-cli
    - ~/.asyncapi-cli
credentials-file-location: null
history:
  adoption-history:
    - >
      AsyncAPI CLI is shipped through npm, Homebrew, Docker, macOS pkg files, Windows
      installers, Chocolatey, Debian packages, and other package channels documented by
      the project. The supplied Homebrew and Nix package metadata shows it has crossed
      from the JavaScript ecosystem into system package-manager catalogs.
    - >
      Its adoption follows the growth of AsyncAPI as a specification for event-driven
      and asynchronous APIs: teams that already keep OpenAPI-like documents in
      repositories can add the CLI to CI, local validation, code-generation,
      documentation-preview, and schema-maintenance workflows.
  package-nerd-significance:
    - >
      AsyncAPI CLI is interesting because it is both a Node package and a cross-platform
      native-feeling CLI artifact. Package maintainers have to care about npm global
      installs, generated oclif command docs, shell completion, Docker images, OS
      installers, Homebrew bottles, and the fast-moving AsyncAPI toolchain behind the
      single `asyncapi` executable.
  project-history:
    - >
      The CLI repository began in 2021 with an explicit design phase and grew into an
      oclif-based Node.js command suite. Its README describes it as a CLI for AsyncAPI
      files and points contributors to generated usage docs, architecture docs, and
      command patterns such as `verb + noun` and `namespace + noun + verb`.
    - >
      The 5.x and 6.x lines show the project consolidating around document operations
      and generator integration. Version 6.0.0 removed Postman-to-AsyncAPI conversion
      support because the dependency chain had become unmaintained and difficult to
      support, which is a good example of the CLI being maintained as a practical tool
      rather than only an aggregation point.
  related-projects:
    - >
      Related AsyncAPI projects include the AsyncAPI specification, generator,
      converter-js, Studio/preview tooling, templates, parser tooling, and the broader
      event-driven API documentation ecosystem.
  sources:
    - Official git metadata from https://github.com/asyncapi/cli.git
    - https://github.com/asyncapi/cli#readme
    - https://github.com/asyncapi/cli/blob/master/docs/installation.md
    - https://github.com/asyncapi/cli/blob/master/docs/usage.md
    - https://github.com/asyncapi/cli/releases.atom
  summary:
    - >
      AsyncAPI CLI is the command-line front end for working with AsyncAPI documents:
      validating, bundling, converting, formatting, diffing, generating
      clients/models/templates, launching previews and Studio, and managing document
      contexts. It is the package-manager face of the wider AsyncAPI Initiative.
  timeline:
    - '2021: Initial CLI repository commits and design notes.'
    - '2026: v6.0.0 removed Postman conversion support after dependency-maintenance issues.'
    - '2026: v6.0.2 patched request-body validation behavior.'
  usage:
    - >
      Common package-manager usage is `asyncapi validate`, `asyncapi bundle`, `asyncapi
      diff`, `asyncapi generate`, `asyncapi start preview`, and `asyncapi start studio`.
      The CLI also has context commands for giving short names to AsyncAPI document
      paths and auth commands for resolving protected remote references.
related-packages:
  - id: brew:spectral-cli
    reason: >
      Choose Spectral CLI when the primary task is enforcing reusable custom style-guide
      rules across AsyncAPI, OpenAPI, and other JSON or YAML documents rather than using
      AsyncAPI CLI's broader generation and preview toolchain.
    rel: alternative
    sources:
      - https://www.asyncapi.com/docs/tools/cli/usage
      - https://docs.stoplight.io/docs/spectral/674b27b261c3c-overview
      - https://docs.stoplight.io/docs/spectral/1e63ffd0220f3-async-api-rules
category: developer-tools
package-manager:
  brew: asyncapi
  nix: asyncapi
package-manager-url: https://formulae.brew.sh/formula/asyncapi
license: Apache-2.0
tags:
  - api
  - asyncapi
  - cli
  - code-generation
  - validation
description: All in one CLI for all AsyncAPI tools
executables:
  - asyncapi
provenance:
  formula: asyncapi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
