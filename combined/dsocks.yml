id: brew:dsocks
display-name: dsocks
homepage: https://monkey.org/~dugsong/dsocks/
repo: http://dsocks.googlecode.com/svn/trunk
docs:
  - https://monkey.org/~dugsong/dsocks
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input metadata shows dsocks preserved in Homebrew and MacPorts, fitting the
      long tail of small Unix networking tools that package managers keep installable
      after their original hosting era.
  package-nerd-significance:
    - >
      dsocks is a compact historical proxy wrapper: narrow platform target, old source
      hosting, simple shell-facing UX, and practical value for users who want
      per-command proxying instead of a larger framework.
  project-history:
    - >
      The official page says dsocks implements only enough SOCKS4 and SOCKS5 support to
      use OpenSSH dynamic forwarding or a local Tor SOCKS proxy. Its upstream
      distribution was a tarball plus a Google Code SVN checkout.
  related-projects:
    - OpenSSH is central to the documented dynamic SOCKS forwarding workflow.
    - Tor is central to the documented anonymous SSH and browsing examples.
    - dpkt is linked by the official page for tor-dns-proxy.py.
  sources:
    - https://monkey.org/~dugsong/dsocks
    - source_facts.package-manager
  summary:
    - dsocks is Dug Song's small SOCKS client wrapper for BSD and Mac OS X.
  timeline:
    - 'Google Code era: Official page linked a source tarball and SVN checkout.'
    - '2026 batch: Input metadata shows continued Homebrew and MacPorts packaging.'
  usage:
    - >
      The documented examples wrap scp through an SSH dynamic tunnel, use Tor with a DNS
      proxy to avoid DNS leaks while browsing, and run ssh through Tor with
      dsocks-torify.sh.
related-packages:
  - id: brew:torsocks
    reason: >
      Choose torsocks for a Tor Project-maintained wrapper designed specifically to
      force compatible Unix applications through Tor, with documented leak limitations
      and broader modern packaging.
    rel: alternative
    sources:
      - https://gitlab.torproject.org/tpo/core/torsocks#readme
      - https://www.monkey.org/~dugsong/dsocks/
  - id: brew:openssh
    reason: >
      OpenSSH's dynamic forwarding mode creates the local SOCKS proxy used by dsocks in
      its documented remote-gateway workflow.
    rel: adjacent_workflow
    sources:
      - https://www.monkey.org/~dugsong/dsocks/
      - https://www.openssh.com/manual.html
  - id: brew:tor
    reason: >
      The Tor daemon provides the local SOCKS service used by dsocks' documented
      anonymous SSH and browsing workflows.
    rel: adjacent_workflow
    sources:
      - https://www.monkey.org/~dugsong/dsocks/
      - https://gitlab.torproject.org/tpo/core/tor/-/raw/main/README.md
category: networking
package-manager:
  brew: dsocks
  macports: dsocks
package-manager-url: https://formulae.brew.sh/formula/dsocks
license: BSD-2-Clause
tags:
  - cli
  - dns-proxy
  - macos
  - proxy
  - socks
  - tor
description: SOCKS client wrapper for *BSD/macOS
executables:
  - dsocks.sh
provenance:
  formula: dsocks
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
