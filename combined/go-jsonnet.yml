id: brew:go-jsonnet
display-name: go-jsonnet
homepage: https://jsonnet.org/
repo: https://github.com/google/go-jsonnet
docs:
  - https://jsonnet.org/ref/language.html
  - https://jsonnet.org/ref/stdlib.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Jsonnet gained adoption in configuration-heavy infrastructure work because it lets
      users compute, compose, and reuse structured data. The original C++ Jsonnet
      repository points users toward go-jsonnet as a newer implementation that can be
      much faster in some cases and is recommended in preference to the C++ version.
  package-nerd-significance:
    - >
      For package users, go-jsonnet matters because it turns a configuration language
      into a small, portable Go toolchain with CLI binaries, pre-commit hooks, library
      APIs, and package-manager installs.
  project-history:
    - >
      Jsonnet began at Google in early 2014 as a 20 percent project and was launched on
      August 6 of that year. The go-jsonnet repository followed in 2016 as a pure-Go
      implementation; its README describes it as feature complete and production ready,
      with command-line tools and embeddable Go library support.
  related-projects:
    - >
      google/jsonnet is the original C++ implementation. jsonnet.org hosts the language
      reference and standard-library documentation used by both implementations.
  sources:
    - https://github.com/google/go-jsonnet
    - https://github.com/google/go-jsonnet/releases
    - https://github.com/google/jsonnet
    - https://jsonnet.org/
  summary:
    - >
      go-jsonnet is the Go implementation of Jsonnet, a configuration language for
      producing JSON, YAML, and other structured data.
  timeline:
    - '2014: Jsonnet began as a Google 20 percent project and launched on August 6.'
    - '2016: go-jsonnet public GitHub repository created.'
    - '2020: v0.17.0 release series available from the Go implementation.'
    - '2026: v0.22.0 release published with Go and Python packaging changes.'
  usage:
    - >
      Practitioners use the jsonnet command to evaluate .jsonnet files into JSON, YAML,
      or other outputs, and use jsonnetfmt, jsonnet-lint, and jsonnet-deps around
      repository review and build pipelines. Go programs can embed the VM directly to
      evaluate Jsonnet snippets or files inside larger tools.
related-packages:
  - id: brew:jsonnet
    reason: >
      Choose the original C++ Jsonnet implementation when you need its native toolchain;
      choose go-jsonnet for a pure-Go implementation with an embeddable Go API.
    rel: alternative
    sources:
      - https://github.com/google/jsonnet
      - https://github.com/google/go-jsonnet
  - id: brew:jsonnet-bundler
    reason: >
      jsonnet-bundler installs and vendors Jsonnet libraries that go-jsonnet can resolve
      through its import path.
    rel: adjacent_workflow
    sources:
      - https://github.com/jsonnet-bundler/jsonnet-bundler
      - https://github.com/google/go-jsonnet
  - id: brew:tanka
    reason: >
      Tanka uses Jsonnet as its configuration language, so go-jsonnet skills and
      libraries transfer directly to Tanka-managed Kubernetes configuration.
    rel: adjacent_workflow
    sources:
      - https://tanka.dev/jsonnet/overview/
      - https://github.com/google/go-jsonnet
category: developer-tools
package-manager:
  apk: go-jsonnet
  brew: go-jsonnet
  macports: go-jsonnet
  nix: go-jsonnet
  scoop: main/go-jsonnet
package-manager-url: https://formulae.brew.sh/formula/go-jsonnet
license: Apache-2.0
tags:
  - cli
  - configuration
  - go
  - json
  - jsonnet
  - language-implementation
description: Go implementation of configuration language for defining JSON data
executables:
  - jsonnet-deps
  - jsonnet-lint
provenance:
  formula: go-jsonnet
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
