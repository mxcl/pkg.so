id: brew:le
display-name: LE text editor
homepage: https://github.com/lavv17/le
repo: https://github.com/lavv17/le
docs:
  - https://github.com/lavv17/le#readme
config-file-location:
  unix:
    - ~/.le/syntax
    - <CWD>/.le.syntax
    - ~/.le/keymap
    - ~/.le/keymap-$TERM
    - ~/.le/colors-$TERM
credentials-file-location: null
history:
  adoption-history:
    - >
      LE never became a mainstream editor on the scale of vi, Emacs, nano, or joe, but
      it persisted in Unix package collections because it occupies a useful niche: a
      small terminal editor with Norton Editor-like ergonomics plus block, binary, and
      hex-oriented features.
    - >
      Package availability in Homebrew, Debian, Ubuntu, and MacPorts shows the usual
      long-tail survival path for mature terminal tools: stable enough to keep
      packaging, specialized enough that users seek it by name.
  package-nerd-significance:
    - >
      LE is significant as a survivor from the 1990s Unix editor ecology. It is small,
      C++/ncurses-based, GPL-licensed, and full of features that matter to terminal
      users who edit awkward files: rectangular blocks, binary mode, hex mode, mmap
      editing, and configurable keymaps.
    - >
      For package maintainers, LE is a good example of a stable but actively patched
      classic utility whose changelog is dominated by portability, terminal behavior,
      syntax updates, and correctness fixes rather than product churn.
  project-history:
    - >
      The upstream HISTORY file says Lukyanov started LE in 1993 as first-year
      laboratory work at Yaroslavl State University while using a BESTA Unix machine
      with 8 MB of memory and fourteen terminals. The first version could load, browse,
      insert, delete, and save files.
    - >
      After that first version, the editor was almost completely rewritten in C++.
      Lukyanov published it under the GPL in early 1997 after deciding it had become
      powerful enough to share. The NEWS file marks version 1.2.0 as the first public
      release.
    - >
      LE's development history is a long record of terminal-editor pragmatism:
      regular-expression search, tunable syntax highlighting, rectangular blocks, mmap
      editing for large files and devices, mouse support, multibyte/UTF-8 support, full
      undo/redo, many syntax definitions, ncurses portability fixes, and build fixes for
      Unix-like systems.
  related-projects:
    - >
      Related editor traditions include vi, Emacs, Norton Editor, Turbo C's file
      selector style, ncurses-based terminal editors, and hex/binary editors.
  sources:
    - https://github.com/lavv17/le
    - https://raw.githubusercontent.com/lavv17/le/master/FEATURES
    - https://raw.githubusercontent.com/lavv17/le/master/HISTORY
    - https://raw.githubusercontent.com/lavv17/le/master/NEWS
  summary:
    - >
      LE is Alexander V. Lukyanov's terminal text editor, notable for block operations,
      binary-safe editing, hex mode, mmap-based large-file/device editing, syntax
      highlighting, and configurable keymaps and colors.
  timeline:
    - >
      1993: Alexander V. Lukyanov starts LE as student laboratory work on a BESTA Unix
      machine.
    - 'Early 1997: LE is published under the GPL after a substantial C++ rewrite.'
    - 'Version 1.2.0: NEWS marks the first public release.'
    - '2001: Version 1.9.0 adds bookmark support and syntax improvements.'
    - >
      2004: Version 1.10.0 adds multibyte encoding support; version 1.11.0 adds full
      undo/redo.
    - '2010: Version 1.14.5 changes licensing to GNU GPL v3 because regex.c already used it.'
    - '2015: Version 1.16.0 integrates the default menu and improves keymap implementation.'
    - >
      2021: Version 1.16.8 records macOS build changes, performance optimizations, and
      syntax improvements.
  usage:
    - >
      LE is used as an interactive terminal editor for text files, DOS/Unix line-ending
      files, binary-clean editing, hexadecimal viewing/editing, syntax-highlighted
      source/config editing, rectangular and stream block operations, and cautious mmap
      replace-mode edits of large files or devices.
    - >
      Its configuration model is file-based and terminal-oriented: syntax rules can live
      in package data, ~/.le/syntax, or ./.le.syntax; keymaps and colors can be dumped
      and customized in ~/.le or package data locations.
related-packages:
  - id: brew:bvi
    reason: >
      Choose bvi when vi-style modal commands, Ex scripting, and byte-level logical
      operations are preferable; choose LE when one editor must handle conventional
      text, rectangular blocks, syntax highlighting, and binary or hex data.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/lavv17/le/master/FEATURES
      - https://bvi.sourceforge.net/man_bvi.html
      - https://bvi.sourceforge.net/overview.php
  - id: brew:hexcurse
    reason: >
      Choose Hexcurse for a focused ncurses hex editor with EBCDIC display and
      configurable byte width; choose LE for broader text-editing, block,
      syntax-highlighting, and mmap workflows alongside hex mode.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/lavv17/le/master/FEATURES
      - https://github.com/LonnyGomes/hexcurse#readme
category: productivity
package-manager:
  brew: le
  debian: le
  macports: le
  ubuntu: le
package-manager-url: https://formulae.brew.sh/formula/le
license: GPL-3.0-or-later AND GPL-2.0-or-later
tags:
  - binary-editor
  - cli
  - hex-mode
  - terminal
  - text-editor
description: Text editor with block and binary operations
executables:
  - le
provenance:
  formula: le
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
