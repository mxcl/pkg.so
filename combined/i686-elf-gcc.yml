id: brew:i686-elf-gcc
display-name: i686-elf-gcc
homepage: https://gcc.gnu.org
repo: https://gcc.gnu.org/git/gcc.git
docs:
  - https://gcc.gnu.org/onlinedocs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GCC became central to free software because it was both a compiler and a
      portability layer for the GNU system, GNU/Linux, BSD-derived environments,
      embedded systems, and vendor Unix targets. Cross-target support made it especially
      important for low-level systems work.
    - >
      The i686-elf-gcc formula packages that cross-target tradition for Homebrew.
      Homebrew lists i686-elf-binutils as a dependency, matching the usual order in
      which a target assembler and linker support a target compiler.
  package-nerd-significance:
    - >
      This package is a neat distillation of GCC's cross-compilation culture. The
      formula does not represent a fork of GCC; it represents a configured target, a
      dependency relationship with target Binutils, and a set of prefixed executables
      that are safe to put on a developer workstation.
    - >
      For package nerds, i686-elf-gcc is also a reminder that compiler packages are not
      only language runtimes. They encode ABI, target object format, linker
      expectations, and a naming convention that other build scripts can depend on.
  project-history:
    - >
      GCC began as the GNU C compiler for the GNU operating system. GNU's January 1987
      bulletin described a portable optimizing C compiler that supported the October
      1986 ANSI C draft and was expected for release in the first quarter of 1987.
    - >
      The GCC project page describes GCC as the GNU Compiler Collection, with front ends
      for C, C++, Objective-C, Fortran, Ada, Go, D, Modula-2, COBOL, Rust, and Algol 68,
      plus runtime libraries. It also states that GCC strives to work on native and
      cross targets.
    - >
      A major governance and naming milestone came from the EGCS reunification. GCC's
      2.95 page says GCC 2.95, released July 31, 1999, was the first GCC release after
      the April 1999 GCC/EGCS reunification, and that GCC had expanded from GNU C
      Compiler to GNU Compiler Collection.
  related-projects:
    - GNU Binutils supplies the target assembler and linker used by this cross compiler.
    - >
      GDB, Newlib, libgcc, GRUB, QEMU, and LLVM/Clang are adjacent tools in
      cross-development and freestanding systems work.
  sources:
    - https://formulae.brew.sh/formula/i686-elf-gcc
    - https://gcc.gnu.org/
    - https://gcc.gnu.org/gcc-2.95/
    - https://gcc.gnu.org/onlinedocs/
    - https://gcc.gnu.org/steering.html
    - https://www.gnu.org/bulletins/bull2.txt
  summary:
    - >
      i686-elf-gcc is Homebrew's target-prefixed build of the GNU Compiler Collection
      for i686-elf. It is a package-manager expression of a much older GCC pattern:
      build the compiler for a target that is not the host so kernels, freestanding
      programs, and boot-time code can be produced reproducibly.
  timeline:
    - "1987: GNU's bulletin described the GNU C compiler nearing release."
    - >
      1998: The EGCS steering committee formed to prevent any one group from controlling
      the compiler project.
    - '1999: The FSF appointed the GCC steering committee as official GNU maintainer for GCC.'
    - >
      1999: GCC 2.95 shipped after the GCC/EGCS reunification and used the GNU Compiler
      Collection name.
    - >
      2026: Homebrew packaged i686-elf-gcc with i686-elf-binutils as a dependency for
      i686-elf cross compilation.
  usage:
    - >
      Users install i686-elf-gcc to compile C and C++ into i686-elf objects and binaries
      without targeting macOS or the host Linux ABI. The package ships prefixed drivers
      such as i686-elf-gcc, i686-elf-g++, i686-elf-cpp, and target-prefixed gcc-ar,
      gcc-nm, and gcc-ranlib helpers.
    - >
      In package-manager workflows it is usually paired with i686-elf-binutils and
      sometimes i686-elf-gdb or i686-elf-grub, forming a compact
      operating-system-development toolchain.
related-packages:
  - id: brew:i686-elf-binutils
    reason: >
      Install the matching assembler, linker, archiver, and object utilities that GCC
      needs for an i686-elf cross toolchain.
    rel: adjacent_workflow
    sources:
      - https://gcc.gnu.org/install/build.html
      - https://sourceware.org/binutils/
  - id: brew:i686-elf-grub
    reason: >
      Use GRUB to package and boot a compatible kernel or system image produced with the
      i686-elf compiler toolchain.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/grub/manual/grub/grub.html
      - https://www.gnu.org/software/grub/manual/grub/html_node/Obtaining-and-Building-GRUB.html
category: developer-tools
package-manager:
  brew: i686-elf-gcc
package-manager-url: https://formulae.brew.sh/formula/i686-elf-gcc
license: GPL-3.0-or-later WITH GCC-exception-3.1
