  apk: libgpg-error
  brew: libgpg-error
  debian: gpgrt-tools
  dnf: libgpg-error
  macports: libgpg-error
  nix: libgpg-error
  pacman: libgpg-error
  ubuntu: gpgrt-tools
  zypper: libgpg-error-devel
package-manager-url: https://formulae.brew.sh/formula/libgpg-error
