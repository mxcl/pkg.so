id: brew:geckodriver
display-name: geckodriver
homepage: https://firefox-source-docs.mozilla.org/testing/geckodriver/
repo: https://github.com/mozilla/geckodriver
docs:
  - https://firefox-source-docs.mozilla.org/testing/geckodriver
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The Firefox Source Docs note that Selenium 3 made geckodriver the default
      WebDriver implementation for Firefox. The same usage documentation explains that
      FirefoxDriver was discontinued with Firefox 47 because it did not support Gecko's
      multi-process architecture.
  package-nerd-significance:
    - >
      geckodriver matters to package-manager users because it is the small native
      executable that makes Firefox automation work across Selenium, WebDriver test
      suites, CI jobs, and browser-compatibility tooling.
  project-history:
    - >
      Mozilla's documentation describes geckodriver as a proxy between WebDriver clients
      and Gecko browsers. It exposes the WebDriver HTTP API and translates commands to
      Firefox's remote protocol, making it the browser-specific bridge for automation
      clients.
  related-projects:
    - >
      Firefox, Gecko, Marionette, Selenium, and the W3C WebDriver protocol are the main
      adjacent projects named or linked from Mozilla's geckodriver documentation.
  sources:
    - https://firefox-source-docs.mozilla.org/testing/geckodriver/
    - https://firefox-source-docs.mozilla.org/testing/geckodriver/Usage.html
  summary:
    - >
      geckodriver is Mozilla's WebDriver proxy for controlling Gecko-based browsers such
      as Firefox from W3C WebDriver-compatible clients.
  timeline:
    - 'Firefox 47: FirefoxDriver was discontinued for lack of multi-process Gecko support.'
    - 'Selenium 3: geckodriver became the default WebDriver implementation for Firefox.'
  usage:
    - >
      Package users install the geckodriver binary and make it available on PATH, or
      point Selenium clients at it explicitly. The official usage docs also call out
      container and Snap packaging details, because geckodriver and Firefox need to run
      in compatible filesystem and runtime environments.
related-packages:
  - id: brew:selenium-server
    reason: >
      Use Selenium Server with geckodriver when Firefox sessions must be exposed
      remotely or orchestrated in a Selenium Grid; local clients can launch geckodriver
      directly when that distribution layer is unnecessary.
    rel: adjacent_workflow
    sources:
      - https://firefox-source-docs.mozilla.org/testing/geckodriver/Usage.html
      - https://www.selenium.dev/documentation/grid/
category: developer-tools
package-manager:
  apk: geckodriver
  brew: geckodriver
  macports: geckodriver
  nix: geckodriver
  pacman: geckodriver
  scoop: main/geckodriver
  winget: Mozilla.GeckoDriver
package-manager-url: https://formulae.brew.sh/formula/geckodriver
license: MPL-2.0
tags:
  - browser-automation
  - cli
  - firefox
  - marionette
  - testing
  - webdriver
description: WebDriver Marionette proxy
executables:
  - geckodriver
  - wires
provenance:
  formula: geckodriver
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
