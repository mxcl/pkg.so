id: brew:erlang_ls
display-name: Erlang LS
homepage: https://erlang-ls.github.io/
repo: https://github.com/erlang-ls/erlang_ls
docs:
  - https://erlang-ls.github.io/
  - https://erlang-ls.github.io/configuration
config-file-location:
  linux: /home/USER/.config/erlang_ls/erlang_ls.config
  macos: /Users/USER/Library/Application Support/erlang_ls/erlang_ls.config
  unix: PROJECT_ROOT/erlang_ls.config
  windows: c:/Users/USER/AppData/Local/erlang_ls/erlang_ls.config
credentials-file-location: null
history:
  adoption-history:
    - >
      Erlang LS fit the broader editor shift toward LSP-based tooling: one server
      process could support multiple editor clients. Its README points users to GitHub
      issues and the Erlanger Slack channel for project participation, while the README
      warns that the project is unmaintained and recommends the Erlang Language Platform
      language server instead.
  package-nerd-significance:
    - >
      The Homebrew formula is useful for editor setup because it installs a single
      erlang_ls executable independent of a particular editor plugin. Its unmaintained
      status is important package metadata because new users may prefer ELP while
      existing users may still need erlang_ls for older editor workflows.
  project-history:
    - >
      The project documentation describes Erlang LS as a language server that provides
      Erlang language features such as auto-complete and go-to-definition through the
      Language Server Protocol. The README later documented support for LSP 3.17 and OTP
      24 through OTP 27.
  related-projects:
    - Erlang LS depends on Erlang/OTP and rebar3 for building and operation.
    - >
      The README recommends Erlang Language Platform as the successor language server
      for new users.
  sources:
    - https://erlang-ls.github.io/
    - https://erlang-ls.github.io/configuration/
    - https://raw.githubusercontent.com/erlang-ls/erlang_ls/master/README.md
    - https://api.github.com/repos/erlang-ls/erlang_ls/releases?per_page=10
    - https://formulae.brew.sh/formula/erlang_ls
  summary:
    - >
      Erlang LS is an Erlang language server for editors and IDEs, packaged by Homebrew
      as erlang_ls and implemented as an Erlang server for Microsoft's Language Server
      Protocol.
  timeline:
    - '2024-10-02: Erlang LS 1.0.0 was published on GitHub Releases.'
    - '2024-10-09: Erlang LS 1.1.0 followed as a later GitHub release.'
    - >
      README status note: the project is marked unmaintained and recommends Erlang
      Language Platform.
  usage:
    - >
      Users run the erlang_ls escript from an editor integration, usually over TCP or
      stdio. Project-specific configuration lives in PROJECT_ROOT/erlang_ls.config, and
      global defaults can be stored in the user config directory for Linux, macOS, or
      Windows.
related-packages:
  - id: brew:erlang-language-platform
    reason: >
      Choose Erlang Language Platform for a maintained, incremental Erlang language
      server; its official FAQ states that ELP effectively supersedes Erlang LS.
    rel: alternative
    sources:
      - https://github.com/WhatsApp/erlang-language-platform/blob/main/FAQ.md
      - https://whatsapp.github.io/erlang-language-platform/
  - id: brew:erlang@27
    reason: >
      Use OTP 27 when retaining Erlang LS, because the server's official README lists
      OTP 27 among its supported runtime versions.
    rel: adjacent_workflow
    sources:
      - https://github.com/erlang-ls/erlang_ls
      - https://www.erlang.org/docs/27
category: developer-tools
package-manager:
  apk: erlang-ls
  brew: erlang_ls
package-manager-url: https://formulae.brew.sh/formula/erlang_ls
license: Apache-2.0
tags:
  - cli
  - editor-tools
  - erlang
  - language-server
  - lsp
description: Erlang Language Server
executables:
  - erlang_ls
provenance:
  formula: erlang_ls
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
