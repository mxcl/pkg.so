id: brew:briss
display-name: Briss
homepage: https://briss.sourceforge.net/
repo: https://sourceforge.net/p/briss/code
docs:
  - https://briss.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Briss became one of those package-manager-preserved desktop utilities: not a large
      ecosystem project, but useful enough for Homebrew and Nix to keep packaging it
      years after upstream activity slowed. SourceForge still shows ongoing weekly
      downloads and user reviews, indicating continuing long-tail use.
  package-nerd-significance:
    - >
      For package-history purposes, Briss is a good example of the tiny Java GUI
      utilities that survived because package managers made old but still-useful desktop
      workflows easy to reinstall. It also illustrates the difference between visible
      cropping metadata and destructive redaction, a recurring footnote in PDF tooling.
  project-history:
    - >
      The project was registered on SourceForge in May 2010 by the maintainer account
      laborg and published GPLv3 releases through SourceForge. The official project page
      describes it as a spare-time, cross-platform application for Linux, Windows, and
      Mac OS X, with development and bug tracking hosted on SourceForge.
    - >
      The public release train is compact: SourceForge lists early 0.0.x releases
      beginning in May 2010, followed by 0.0.13 in April 2011 and the 0.9 release in May
      2012. The SourceForge summary records a later project update in May 2013, but the
      release history remains centered on the 2010-2012 period.
  related-projects:
    - >
      Related package-manager neighbors include PDF Arranger for rearranging, splitting,
      and merging PDFs; ScanTailor-style tools for scanned-page cleanup; and lower-level
      PDF toolkits such as pdftk, qpdf, and mutool for scripted PDF manipulation.
  sources:
    - https://briss.sourceforge.net/
    - https://sourceforge.net/projects/briss/
    - https://sourceforge.net/projects/briss/files/
    - source_facts.package-manager
  summary:
    - >
      Briss is a small Java/Swing utility for visually cropping PDF pages, especially
      scans and multi-column documents. Its niche is the simple desktop workflow:
      overlay pages, draw crop rectangles, and export a PDF with adjusted visible page
      regions.
  timeline:
    - '2010-05-04: SourceForge project registered.'
    - '2010-05-10: Earliest listed SourceForge release, 0.0.2.'
    - '2012-05-26: Briss 0.9 release posted on SourceForge.'
    - "2013-05-20: SourceForge records the project's last update."
  usage:
    - >
      Users run Briss when a scanned PDF or two-up document needs manual crop boxes
      rather than automated OCR/layout processing. The interface is graphical, but
      Homebrew exposes it as the `briss` executable so it fits into a Unix package
      collection despite being a desktop app.
related-packages:
  - id: brew:mupdf-tools
    reason: >
      Choose MuPDF tools when PDF cropping or trimming must be automated from scripts;
      `mutool trim` provides command-line page-box and margin controls, whereas Briss
      emphasizes interactive visual selection.
    rel: alternative
    sources:
      - https://briss.sourceforge.net/
      - https://mupdf.readthedocs.io/en/latest/tools/index.html
category: productivity
