id: brew:trealla-prolog
display-name: Trealla Prolog
homepage: https://github.com/trealla-prolog/trealla-prolog
repo: https://github.com/trealla-prolog/trealla-prolog
docs:
  - https://github.com/trealla-prolog/trealla#readme
config-file-location:
  unix: ~/.tplrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents Jupyter use and WebAssembly integration with Go and
      JavaScript. These establish integration routes, not an adoption measurement.
  package-nerd-significance:
    - >
      Its C implementation and Makefile build offer a compact Prolog runtime with
      conventional Unix packaging and optional external dependencies.
  project-history:
    - >
      The README dates the project's current incarnation to March 2020 and acknowledges
      contributions from members of the wider Prolog community.
  related-projects:
    - >
      Trealla uses a modified imath library for unbounded arithmetic and credits other
      Prolog implementations for selected interfaces.
  sources:
    - https://github.com/trealla-prolog/trealla#readme
  summary:
    - Trealla Prolog is an MIT-licensed ISO Prolog interpreter written in C.
  timeline:
    - "2020-03: The project's current incarnation began."
  usage:
    - >
      Run tpl for an interactive REPL, supply source files to load programs, or use -g
      to execute a goal. The runtime also exposes embedding and foreign-function
      interfaces.
category: language-runtime
package-manager:
  brew: trealla-prolog
package-manager-url: https://formulae.brew.sh/formula/trealla-prolog
license: MIT
tags:
  - c
  - cli
  - interpreter
  - iso-prolog
  - logic-programming
  - prolog
  - repl
  - webassembly
description: Compact and efficient ISO Prolog interpreter written in plain old C
executables:
  - tpl
provenance:
  formula: trealla-prolog
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
