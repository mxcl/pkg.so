id: brew:scalaenv
display-name: scalaenv
homepage: https://github.com/scalaenv/scalaenv
repo: https://github.com/scalaenv/scalaenv
docs:
  - https://github.com/scalaenv/scalaenv#readme
config-file-location:
  unix:
    - ~/.zshrc
    - ~/.bash_profile
credentials-file-location: null
history:
  adoption-history:
    - >
      scalaenv follows the environment-manager pattern popularized by rbenv and is
      available through Homebrew. Its official repository records support for Bash, Zsh,
      Fish, Scala 2 releases, Dotty milestones, and Scala 3.
  package-nerd-significance:
    - >
      scalaenv represents the family of lightweight, shell-and-shim-based language
      version managers. It is useful to package enthusiasts who prefer per-shell or
      per-project runtime selection without coupling Scala management to an IDE or build
      tool.
  project-history:
    - >
      scalaenv was publicly released in January 2014 as a Scala environment manager
      modeled on rbenv. Subsequent releases added shell completions, installation
      recipes for successive Scala lines, Fish support, uninstall functionality, and
      support for Dotty and Scala 3.
    - >
      The project distinguishes Scala runtime management from sbt management, directing
      users who need the latter to the related sbtenv project.
  related-projects:
    - rbenv, the model for scalaenv's shim-based interface.
    - sbtenv, recommended by scalaenv for sbt version management.
    - Scala, Dotty, and Scala 3, whose distributions scalaenv installs and selects.
  sources:
    - https://github.com/scalaenv/scalaenv#readme
  summary:
    - >
      scalaenv is a command-line environment manager for installing and selecting Scala
      versions. Its design and shell integration intentionally resemble rbenv.
  timeline:
    - '2014: Version 0.0.1 became the initial public release.'
    - '2017: Dotty support and improved install and uninstall commands arrived.'
    - '2021: Releases added Scala 3.0.0 and contemporary Scala 2 versions.'
    - '2024: Version 0.1.15 refreshed the available version definitions.'
  usage:
    - >
      Users install scalaenv under their home directory or through Homebrew, initialize
      it from their shell profile, install named Scala releases, and use its shims to
      expose the selected Scala toolchain.
category: developer-tools
package-manager:
  brew: scalaenv
package-manager-url: https://formulae.brew.sh/formula/scalaenv
license: MIT
tags:
  - cli
  - developer-tools
  - environment-manager
  - scala
  - version-manager
description: Command-line tool to manage Scala environments
executables:
  - scala-build
  - scalaenv
  - scalaenv-install
  - scalaenv-uninstall
provenance:
  formula: scalaenv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
