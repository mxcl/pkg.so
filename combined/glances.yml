id: brew:glances
display-name: Glances
homepage: https://nicolargo.github.io/glances/
repo: https://github.com/nicolargo/glances
docs:
  - https://glances.readthedocs.io/
  - https://nicolargo.github.io/glances
config-file-location:
  linux:
    - ~/.config/glances/glances.conf
    - /etc/glances/glances.conf
    - /usr/share/doc/glances/glances.conf
  macos:
    - ~/.config/glances/glances.conf
    - ~/Library/Application Support/glances/glances.conf
    - /usr/local/etc/glances/glances.conf
    - /usr/share/doc/glances/glances.conf
  windows: '%APPDATA%\glances\glances.conf'
credentials-file-location:
  linux:
    - ~/.config/glances/<login>.pwd
    - /etc/glances/<login>.pwd
    - /usr/share/doc/glances/<login>.pwd
  macos:
    - ~/.config/glances/<login>.pwd
    - ~/Library/Application Support/glances/<login>.pwd
    - /usr/local/etc/glances/<login>.pwd
    - /usr/share/doc/glances/<login>.pwd
  windows: '%APPDATA%\glances\<login>.pwd'
history:
  adoption-history:
    - >
      Glances spread through Python packaging and operating-system package repositories
      because it gives administrators one command that works across Linux, macOS,
      Windows, BSD-like systems, containers, and remote hosts. Its repository advertises
      PyPI, Docker, contributor, download, and community badges, reflecting use both as
      a local troubleshooting tool and as a lightweight monitoring endpoint.
  package-nerd-significance:
    - >
      For package users, Glances is attractive because a single executable can replace a
      pile of small inspection commands during triage. For maintainers, the package is a
      Python application with optional extras, psutil-based system bindings, shell
      completion support, Docker images, and many OS-level distribution targets.
  project-history:
    - >
      Public development traces back to the early 2010s in the GitHub repository. The
      project grew from a terminal dashboard into a cross-platform monitoring
      application with curses, web, client/server, REST, XML-RPC, stdout, CSV, JSON,
      export, Docker, and Python API use cases.
    - >
      The documentation describes Glances as an open architecture built in Python around
      libraries that gather system information. That architecture let the project add
      plugins and export modules without turning the core command into a single-purpose
      top clone.
  related-projects:
    - psutil, top, htop, Docker, Read the Docs, PyPI.
  sources:
    - >
      https://api.github.com/repos/nicolargo/glances/commits?per_page=1&until=2012-01-01T00:00:00Z
    - https://raw.githubusercontent.com/nicolargo/glances/develop/README.rst
    - https://raw.githubusercontent.com/nicolargo/glances/develop/docs/index.rst
    - https://raw.githubusercontent.com/nicolargo/glances/develop/docs/install.rst
  summary:
    - >
      Glances is a Python system monitor that compresses CPU, memory, disk, network,
      process, sensor, container, and service data into a terminal or web dashboard. It
      is often described as an alternative to top and htop, but its project
      documentation emphasizes remote monitoring, APIs, export modules, and
      plugin-oriented extensibility.
  timeline:
    - >
      2011: Early public GitHub commits show the project already tracking screenshots
      and monitoring UI work.
    - '2018: Documentation examples show stdout CSV output for scripting-oriented monitoring.'
    - >
      2020s: Documentation covers terminal, web, API, export, Docker, and Python-library
      modes.
  usage:
    - >
      Practitioners run glances for an immediate terminal overview, glances -w for a
      browser dashboard and REST API, glances -s and glances -c for client/server
      monitoring, glances --stdout or --stdout-json for scripts, and glances --fetch for
      a quick machine summary. Optional extras enable web and export features, while the
      Python API lets scripts consume the same plugin data.
related-packages:
  - id: brew:htop
    reason: >
      Choose htop for a focused interactive process viewer; choose Glances when you also
      need broader host metrics, remote modes, a Web UI, APIs, or exporters.
    rel: alternative
    sources:
      - https://github.com/nicolargo/glances
      - https://htop.dev/
  - id: brew:btop
    reason: >
      Choose btop for a highly polished resource-monitoring TUI; choose Glances when
      cross-platform server, browser, API, and machine-readable output modes matter.
    rel: alternative
    sources:
      - https://github.com/nicolargo/glances
      - https://github.com/aristocratos/btop
category: system
package-manager:
  apk: glances
  brew: glances
  debian: glances
  dnf: glances
  macports: glances
  nix: glances
  pacman: glances
  ubuntu: glances
  zypper: python313-Glances
package-manager-url: https://formulae.brew.sh/formula/glances
license: LGPL-3.0-or-later
tags:
  - cli
  - cross-platform
  - python
  - system-monitoring
  - top
description: Alternative to top/htop
executables:
  - glances
provenance:
  formula: glances
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
