id: brew:ada-url
display-name: Ada
homepage: https://ada-url.com
repo: https://github.com/ada-url/ada
docs:
  - https://ada-url.github.io/ada
  - https://www.ada-url.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ada gained package-nerd attention because the README says Node.js added Ada as a
      URL parser dependency beginning with Node.js 18 and cites substantial URL parsing
      performance improvements. The same README lists Redpanda, Kong, Telegram, DataDog,
      and Cloudflare Workers as users.
    - >
      The project publishes single-header release assets such as `ada.cpp`, `ada.h`,
      `ada_c.h`, and `singleheader.zip`, which makes it attractive for downstream
      package managers and embedders.
  package-nerd-significance:
    - >
      Ada is significant because URL parsing is security-sensitive,
      performance-sensitive infrastructure that is often embedded into runtimes. Its
      no-dependency C++ implementation and release artifacts simplify packaging compared
      with vendoring a large runtime.
  project-history:
    - >
      The official README describes Ada as a self-contained C++20 URL parser that passes
      the URL specification's test range across Windows, Linux, and macOS, with Unicode
      Technical Standard support and a URLPattern implementation.
    - >
      The GitHub repository was created in December 2022 under the `ada-url`
      organization and has grown into a multi-language ecosystem with team-maintained
      Rust, Go, Python, and Kotlin bindings.
  related-projects:
    - >
      Related projects include the WHATWG URL Standard, web-platform-tests, Node.js, the
      Ada Rust, Go, Python, and Kotlin bindings, and runtime consumers such as
      Cloudflare Workers.
  sources:
    - https://api.github.com/repos/ada-url/ada
    - https://api.github.com/repos/ada-url/ada/releases
    - https://github.com/ada-url/ada#readme
  summary:
    - >
      Ada is a fast, spec-compliant WHATWG URL parser written in modern C++. It ships as
      a library and as the `adaparse` command-line tool in packages such as Homebrew.
  timeline:
    - '2022: GitHub repository `ada-url/ada` was created.'
    - '2023: Node.js 18-era performance material cited Ada as a new URL parser dependency.'
    - >
      2024: The README cites a Software: Practice and Experience article, `Parsing
      Millions of URLs per Second`.
    - '2026: GitHub releases include Ada 3.x single-header assets.'
  usage:
    - >
      Library users parse and normalize URLs through `ada::parse`, use C or C++ APIs,
      and can build with CMake or the amalgamated source files. CLI users can install
      the package and use `adaparse` for URL parsing tasks.
related-packages: []
