id: brew:docker-credential-helper-ecr
display-name: Amazon ECR Docker Credential Helper
homepage: https://github.com/awslabs/amazon-ecr-credential-helper
repo: https://github.com/awslabs/amazon-ecr-credential-helper
docs:
  - https://github.com/awslabs/amazon-ecr-credential-helper#readme
config-file-location:
  linux:
    - /home/<username>/.docker/config.json
    - /root/.docker/config.json
  unix:
    - ~/.docker/config.json
    - ~/.aws/config
  windows:
    - C:\Users\<username>\.docker\config.json
    - C:\Windows\System32\config\systemprofile\.docker\config.json
credentials-file-location:
  unix: ~/.aws/credentials
history:
  adoption-history:
    - >
      The README documents installation paths across Amazon Linux, Debian, Ubuntu, Arch,
      Alpine, macOS Homebrew, MacPorts, Windows releases, mise, and Go source installs.
      That distribution spread reflects its role as a small but standard glue package
      for CI systems, developer laptops, and hosts that pull private ECR images.
  package-nerd-significance:
    - >
      For package maintainers, this package is interesting because it connects three
      packaging worlds: Docker's external credential-helper interface, AWS's credential
      provider chain, and distro or language package managers. A broken helper can make
      otherwise-correct Docker and AWS installs unable to pull private images, so
      version and path details matter.
  project-history:
    - >
      The project is maintained under awslabs and implements Docker's credential-helper
      protocol as docker-credential-ecr-login. Its README describes the helper as a
      bridge between Docker, Amazon ECR, and the normal AWS credential chain, including
      shared credentials files, environment variables, EC2 and ECS roles, assumed roles,
      credential_process, and web identity support.
    - >
      The changelog shows an initial 0.1.0 release in 2018, followed by endpoint and
      credential-chain work: FIPS endpoints in 0.2.0, PrivateLink endpoints in 0.3.0,
      assumed-role chaining and IRSA support in 0.4.0, ECR Public and IMDSv2 support in
      0.5.0, AWS SSO and Apple Silicon support in 0.6.0, and later support for isolated,
      IPv6, and dual-stack ECR endpoint patterns.
  related-projects:
    - >
      The project is directly related to Docker's docker-credential-helpers suite,
      Amazon ECR, the AWS CLI and SDK credential chain, Amazon ECS and EC2 IAM roles,
      and Kubernetes IRSA workflows.
  sources:
    - https://github.com/awslabs/amazon-ecr-credential-helper#readme
    - https://github.com/awslabs/amazon-ecr-credential-helper/blob/main/CHANGELOG.md
    - https://github.com/awslabs/amazon-ecr-credential-helper/releases
    - https://github.com/awslabs/amazon-ecr-credential-helper/tags
  summary:
    - >
      Amazon ECR Docker Credential Helper is the Docker credential helper for Amazon
      Elastic Container Registry. It lets Docker fetch ECR authentication through AWS
      credentials instead of requiring users or automation to run docker login for ECR
      registries.
  timeline:
    - '2018: v0.1.0 tagged as the initial release.'
    - '2019: Debian and Amazon Linux packaging tags appear in the upstream repository.'
    - '2021: v0.5.0 adds ECR Public and IMDSv2 support.'
    - '2021: v0.6.0 adds AWS SSO, EC2 metadata role assumption, and Apple Silicon support.'
    - '2024: v0.8.0 adds C2S endpoint pattern support and experimental Windows ARM binaries.'
    - '2026: v0.12.0 adds dual-stack ECR public endpoint support and SHA256 cache keys.'
  usage:
    - >
      Users place docker-credential-ecr-login on PATH and set Docker's credsStore or
      per-registry credHelpers entry to ecr-login. After that, docker pull and docker
      push against private or public ECR registries use AWS credentials automatically,
      with optional AWS_PROFILE selection and local helper cache controls.
related-packages:
  - id: brew:docker
    reason: >
      Docker is the client that invokes this helper for ECR pull and push authentication
      after ecr-login is configured in Docker's config.json.
    rel: adjacent_workflow
    sources:
      - https://github.com/awslabs/amazon-ecr-credential-helper#configuration
      - https://docs.aws.amazon.com/AmazonECR/latest/userguide/registry_auth.html
  - id: brew:awscli
    reason: >
      Use the AWS CLI alongside the helper when you want both tools to share named
      profiles and the standard AWS credential and configuration files.
    rel: adjacent_workflow
    sources:
      - https://github.com/awslabs/amazon-ecr-credential-helper#aws-credentials
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
category: developer-tools
package-manager:
  apk: docker-credential-ecr-login
  brew: docker-credential-helper-ecr
  macports: docker-credential-helper-ecr
package-manager-url: https://formulae.brew.sh/formula/docker-credential-helper-ecr
license: Apache-2.0
tags:
  - amazon-ecr
  - aws
  - cli
  - containers
  - credentials
  - docker
description: Docker Credential Helper for Amazon ECR
executables:
  - docker-credential-ecr-login
provenance:
  formula: docker-credential-helper-ecr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
