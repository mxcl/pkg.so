id: brew:cliam
display-name: cliam
homepage: https://github.com/securisec/cliam
repo: https://github.com/securisec/cliam
docs:
  - https://github.com/securisec/cliam#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its Homebrew and Nix packaging puts a security assessment binary into common
      workstation package managers, useful for operators who want repeatable installs
      outside a language-specific toolchain.
  package-nerd-significance:
    - >
      The package matters as a compact cloud-security CLI: it maps provider credentials
      to effective permissions without requiring a full security scanner stack.
  project-history:
    - >
      The official README presents cliam as a work-in-progress cloud permissions
      identifier with provider-specific subcommands and both broad enumeration and
      service-group modes.
  related-projects:
    - >
      The README relates cliam to cloud provider IAM and credential systems for AWS,
      GCP, Azure, Firebase, and planned Oracle support.
  sources:
    - >
      Official GitHub README: cloud-agnostic IAM permissions enumeration, provider
      coverage, installation, usage, and credential handling.
  summary:
    - >
      cliam is a multi-cloud IAM permissions enumeration CLI for checking what AWS, GCP,
      Azure, and Firebase credentials can do.
  usage:
    - >
      Users run provider subcommands such as `cliam aws`, `cliam gcp`, or `cliam azure`,
      supplying credentials through provider environment variables, profiles,
      service-account paths, or command-line flags.
related-packages: []
category: security
package-manager:
  brew: cliam
  nix: cliam
package-manager-url: https://formulae.brew.sh/formula/cliam
license: GPL-3.0-or-later
tags:
  - aws
  - azure
  - cli
  - cloud-security
  - gcp
  - iam
  - permissions
description: Cloud agnostic IAM permissions enumerator
executables:
  - cliam
provenance:
  formula: cliam
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
