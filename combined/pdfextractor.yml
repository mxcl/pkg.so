history:
  adoption-history:
    - >
      The official site positions PDFExtractor for both individual Mac or Windows users
      and systems administrators. It is distributed as shareware, with an activation
      code enabling processing beyond the demonstration limit.
  package-nerd-significance:
    - >
      PDFExtractor is a focused extraction utility rather than a general PDF editor. Its
      combination of drag-and-drop batch operation and bundled command-line automation
      makes it relevant to both desktop cask users and scripted document-processing
      workflows.
  project-history:
    - >
      PDFExtractor was developed by Bitgamma as a Mac and Windows utility dedicated to
      extracting embedded material from PDF files. The official site identifies images,
      fonts, text, metadata, and attachments as supported output types.
  related-projects:
    - >
      PDFKey Pro is another Bitgamma PDF utility with a similar desktop,
      batch-processing, command-line, and shareware model.
  sources:
    - https://pdfextractor-app.com/en/
    - https://pdfextractor-app.com/en/support/
  summary:
    - >
      PDFExtractor is a commercial Mac and Windows utility that extracts images, fonts,
      text, metadata, and attachments from PDF documents.
  timeline:
    - >
      2022: PDFExtractor 1.5 was released with the official site continuing to offer Mac
      and Windows editions.
  usage:
    - >
      Users drag individual PDFs, groups of files, or folders onto the Extract control.
      The application creates a separate output directory for each input and can also be
      incorporated into automated workflows through its bundled command-line tools.
      Viewing-password-protected files require the opening password.
