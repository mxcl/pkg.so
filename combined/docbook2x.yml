id: brew:docbook2x
display-name: docbook2X
homepage: https://docbook2x.sourceforge.net/
repo: https://sourceforge.net/p/docbook2x/code
docs:
  - https://docbook2x.sourceforge.net/
  - https://docbook2x.sourceforge.net/latest/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      docbook2X was adopted by Linux and BSD distributions because it generated man and
      Texinfo output in packaging workflows where those formats were first-class
      artifacts.
    - >
      Although dormant upstream, it remains packaged in Homebrew, Debian, Fedora, Arch,
      MacPorts, Nix, Ubuntu, openSUSE, FreeBSD ports, OpenBSD ports, and Guix.
  package-nerd-significance:
    - >
      docbook2X is a good example of a small, stable converter kept alive by
      distribution packaging long after upstream activity quieted.
    - >
      Its continued presence says a lot about Unix documentation culture: man pages and
      info documents are still build outputs worth preserving.
  project-history:
    - >
      The project predates much of today's Markdown-centric documentation tooling and
      targeted the practical problem of turning DocBook refentry content into native
      Unix documentation formats.
    - >
      The preserved SourceForge homepage identifies 0.8.8, released on March 3, 2007,
      and the manual identifies Steve Cheng as author.
    - SourceForge file history shows the 0.8.x line progressing from 2003 through 2007.
  related-projects:
    - >
      Related projects include DocBook XML, DocBook XSL stylesheets, xmlto,
      xsltproc/libxslt, GNU Texinfo, groff, and distribution XML catalog tooling.
    - >
      The Distrotech GitHub mirror is useful as a readable source mirror, but
      SourceForge remains the upstream identity in package metadata.
  sources:
    - https://docbook2x.sourceforge.net/
    - https://docbook2x.sourceforge.net/latest/doc/docbook2X.html
    - https://sourceforge.net/projects/docbook2x/
    - https://sourceforge.net/projects/docbook2x/files/docbook2x/
    - https://sourceforge.net/projects/docbook2x/files/docbook2x/0.8.8/
    - https://packages.debian.org/bookworm/docbook2x
    - https://openports.pl/path/textproc/docbook2x
    - https://github.com/Distrotech/docbook2X
  summary:
    - docbook2X is a focused DocBook converter for traditional Unix man pages and GNU Texinfo.
    - >
      It is effectively mature legacy infrastructure: upstream's last release was 0.8.8
      in March 2007, but distributions still carry it because man-page and info-page
      generation remain useful in source builds.
  timeline:
    - '2003: SourceForge file history shows early 0.8.x releases.'
    - '2004-2006: the 0.8.x series iterated through converter and packaging improvements.'
    - '2007: docbook2X 0.8.8 was released as the documented upstream release.'
    - >
      2010s-2020s: distributions continued carrying patched packages for modern build
      environments.
  usage:
    - >
      The common commands convert DocBook/XML refentry documents into manual pages or
      Texinfo, with lower-level helpers for Man-XML and Texi-XML intermediate formats.
    - >
      The package is most often encountered in build dependencies rather than as a
      user-facing authoring tool.
related-packages:
  - id: brew:xmlto
    reason: >
      Choose xmlto when a DocBook workflow needs outputs such as HTML, PDF, PostScript,
      or plain text in addition to man pages; docbook2X is more narrowly focused on
      man-page and Texinfo generation.
    rel: alternative
    sources:
      - https://docbook2x.sourceforge.net/
      - https://pagure.io/xmlto/
category: developer-tools
package-manager:
  apk: docbook2x
  brew: docbook2x
  debian: docbook2x
  dnf: docbook2X
  macports: docbook2X
  nix: docbook2x
  pacman: docbook2x
  ubuntu: docbook2x
  zypper: docbook2x
package-manager-url: https://formulae.brew.sh/formula/docbook2x
license: MIT AND DocBook-XML
tags:
  - cli
  - converter
  - docbook
  - manpages
  - texinfo
  - xml
description: Convert DocBook to UNIX manpages and GNU TeXinfo
executables:
  - db2x_manxml
  - db2x_texixml
  - db2x_xsltproc
  - docbook2man
  - docbook2texi
  - sgml2xml-isoent
  - utf8trans
provenance:
  formula: docbook2x
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
