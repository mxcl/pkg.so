id: brew:mlc
display-name: Markup Link Checker
homepage: https://github.com/becheran/mlc
repo: https://github.com/becheran/mlc
docs:
  - https://github.com/becheran/mlc
config-file-location:
  unix: ./.mlc.toml
credentials-file-location: null
history:
  sources:
    - https://api.github.com/repos/becheran/mlc
    - https://formulae.brew.sh/formula/mlc
    - https://github.com/becheran/mlc
    - https://raw.githubusercontent.com/becheran/mlc/master/README.md
  summary:
    - >
      Markup Link Checker, packaged as mlc, is a Rust command-line link checker
      developed in the becheran/mlc repository, which was created on GitHub on
      2019-12-28. Its upstream documentation frames the project around a
      documentation-maintenance problem: finding links in Markdown and HTML files, then
      validating both local paths and web URLs.
  usage:
    - >
      The tool's practical niche is CI-friendly markup validation. Its README emphasizes
      GitHub Actions integration, workflow-command annotations for broken links,
      throttling to avoid HTTP 429 responses, offline checking, ignore comments, and
      configuration for selecting files or markup types. That places mlc near tools such
      as markdown-link-check and linkinator, but with a Rust single-binary packaging
      story and explicit support for both Markdown and HTML. Users typically run `mlc`
      at a repository root, against a documentation directory, or inside a CI workflow
      to fail builds when docs rot.
related-packages:
  - id: brew:lychee
    reason: >
      lychee is an alternative Rust link checker to choose when inputs extend beyond
      mlc's Markdown and HTML focus to reStructuredText, arbitrary text, or whole
      websites.
    rel: alternative
    sources:
      - https://github.com/becheran/mlc#readme
      - https://lychee.cli.rs/
      - https://github.com/lycheeverse/lychee#readme
category: developer-tools
package-manager:
  brew: mlc
  nix: mlc
package-manager-url: https://formulae.brew.sh/formula/mlc
license: MIT
tags:
  - ci
  - cli
  - html
  - link-checker
  - markdown
  - markup
description: Check for broken links in markup files
executables:
  - mlc
provenance:
  formula: mlc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
