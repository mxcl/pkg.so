id: brew:cdrtools
display-name: Cdrtools
homepage: https://cdrtools.sourceforge.net/private/cdrecord.html
repo: https://codeberg.org/schilytools/schilytools
docs:
  - https://cdrtools.sourceforge.net/private/cdrecord.html
  - https://cdrtools.sourceforge.net/private/man
config-file-location:
  unix:
    - /etc/default/cdrecord
    - /etc/default/rscsi
credentials-file-location: null
history:
  adoption-history:
    - >
      Cdrtools was one of the canonical Unix CD-writing stacks and became deeply
      entangled with distro policy, Linux SCSI permissions, and the long-running Debian
      fork dispute documented on the official page. The supplied package-manager
      metadata shows packaging in Alpine, Homebrew, MacPorts, Nix, Arch, Scoop, and
      openSUSE.
  package-nerd-significance:
    - >
      Cdrtools is package-nerd core lore: optical hardware support, SCSI pass-through
      APIs, privilege handling, license and fork arguments, and the cdrecord/mkisofs
      command names all shaped how Unix distributions packaged disc-burning software for
      decades.
  project-history:
    - >
      The official cdrtools page says libscg began in June 1986 as a SCSI pass-through
      concept, cdrecord started in December 1995, and cdrecord was first published as
      open source on 1996-02-04. The suite grew into a portable optical-media toolkit
      spanning many Unix-like and non-Unix platforms.
    - >
      After Jorg Schilling's death in 2021, the schilytools maintainers moved the
      broader project from SourceForge to Codeberg. The Codeberg repository describes
      schilytools as a collection of tools written or formerly managed by Schilling, and
      the 2023 announcement says volunteers picked up development to preserve
      portability and compatibility.
  related-projects:
    - >
      cdrkit is the historically important Debian fork referenced by the cdrtools fork
      dispute.
    - >
      schilytools is the broader source tree that now carries cdrtools and related
      Schilling utilities.
  sources:
    - https://codeberg.org/schilytools/schilytools
    - https://cdrtools.sourceforge.net/private/cdrecord.html
    - https://cdrtools.sourceforge.net/private/man
    - https://formulae.brew.sh/api/formula/cdrtools.json
    - https://cdrtools.sourceforge.net/private/man/cdrecord.html
    - https://codeberg.org/schilytools/schilytools/raw/branch/master/AN-2023-09-28
  summary:
    - >
      Cdrtools is Jorg Schilling's portable command-line suite for premastering,
      recording, reading, and inspecting CD, DVD, and Blu-ray media, including cdrecord,
      mkisofs, readcd, cdda2wav, isoinfo, and related tools.
  timeline:
    - '1986: SunOS scg driver and libscg initially written, per the official cdrtools page.'
    - '1995: cdrecord development started in December.'
    - '1996: cdrecord initially published as open source on 1996-02-04.'
    - '2004: Official page identifies May 2004 as the start of the Debian cdrtools fork.'
    - '2021: Jorg Schilling died; volunteers later continued schilytools.'
    - '2023: schilytools announcement describes the move from SourceForge to Codeberg.'
  usage:
    - >
      Users run cdrecord to write media, mkisofs to create ISO-9660/Joliet/HFS images,
      readcd to read or clone media, cdda2wav for audio extraction, and
      isoinfo/isodump/isovfy for ISO inspection. The cdrecord manpage documents
      /etc/default/cdrecord as a configuration file for drive labels.
related-packages:
  - id: brew:cdrdao
    reason: >
      Choose Cdrdao for explicit TOC-based disc-at-once audio or mixed-mode CD layouts;
      choose cdrtools for broader ISO premastering and CD, DVD, and Blu-ray recording
      utilities.
    rel: alternative
    sources:
      - https://cdrdao.sourceforge.net/
      - https://github.com/cdrdao/cdrdao#readme
      - https://cdrtools.sourceforge.net/private/cdrecord.html
      - https://cdrtools.sourceforge.net/private/man
category: media
package-manager:
  apk: isoinfo
  brew: cdrtools
  macports: cdrtools
  nix: cdrtools
  pacman: cdrtools
  scoop: main/cdrtools
  zypper: btcflash
package-manager-url: https://formulae.brew.sh/formula/cdrtools
license: CDDL-1.0
tags:
  - blu-ray
  - cd-burning
  - cli
  - dvd-burning
  - premastering
description: CD/DVD/Blu-ray premastering and recording software
executables:
  - btcflash
  - cdda2mp3
  - cdda2ogg
  - cdda2wav
  - cdrecord
  - devdump
  - isodebug
  - isodump
  - isoinfo
  - isovfy
  - mkhybrid
  - mkisofs
  - readcd
  - rscsi
  - scgcheck
  - scgskeleton
provenance:
  formula: cdrtools
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
