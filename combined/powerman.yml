id: brew:powerman
display-name: powerman
homepage: https://github.com/chaos/powerman
repo: https://github.com/chaos/powerman
docs:
  - https://github.com/chaos/powerman#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Originally intended for data centers and Linux clusters, powerman has also been
      used in embedded management appliances, home automation, and high-availability
      service management.
  package-nerd-significance:
    - >
      It illustrates the Unix cluster-administration tradition of a common control
      interface extended through device scripts and coprocesses.
  project-history:
    - >
      Andrew Uselton originally wrote powerman in 2002 for early Linux clusters at
      Lawrence Livermore National Laboratory.
  related-projects:
    - >
      The official Network UPS Tools build documentation describes a Powerman PDU client
      driver that communicates with the daemon.
  sources:
    - https://github.com/chaos/powerman#readme
    - https://github.com/networkupstools/nut/blob/master/docs/configure.txt
  summary:
    - >
      powerman is Unix/Linux software for controlling switched power distribution units
      remotely and in parallel.
  timeline:
    - '2002: Andrew Uselton wrote powerman for early LLNL Linux clusters.'
  usage:
    - >
      Administrators give equipment unified names and execute power-control actions
      across devices. Device scripts support native serial, telnet, and socket
      communication; coprocesses extend support to protocols including IPMI and Redfish.
category: system
package-manager:
  brew: powerman
  debian: libpowerman0
  ubuntu: libpowerman0
  zypper: libpowerman0
package-manager-url: https://formulae.brew.sh/formula/powerman
license: GPL-2.0-or-later
tags:
  - cli
  - cluster
  - datacenter
  - linux
  - pdu
  - power-management
  - remote-control
description: Control (remotely and in parallel) switched power distribution units
executables:
  - httppower
  - plmpower
  - pm
  - powerman
  - powermand
  - redfishpower
provenance:
  formula: powerman
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
