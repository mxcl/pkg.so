id: brew:kubeconform
display-name: Kubeconform
homepage: https://github.com/yannh/kubeconform
repo: https://github.com/yannh/kubeconform
docs:
  - https://kubeconform.mandragor.org/docs
  - https://kubeconform.mandragor.org/docs/usage
  - https://github.com/yannh/kubeconform#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption has been strongest in CI/CD and GitOps-adjacent workflows where teams
      want to fail manifest changes before applying them to a cluster. The tool's
      package-manager footprint across Homebrew, Linux distributions, Windows package
      managers, and Nix reflects a cross-platform CLI audience rather than a
      cluster-installed controller audience.
    - >
      The repository metadata observed on 2026-07-01 showed more than 3000 GitHub stars,
      making it one of the better-known third-party Kubernetes manifest validators
      outside kubectl itself.
  package-nerd-significance:
    - >
      For package-manager users, Kubeconform is the kind of small Go CLI that fits
      neatly into `brew install`, CI images, pre-commit hooks, and reproducible Nix
      shells. Its significance is not a broad runtime platform but a sharp
      replacement-class tool for a once-common Kubernetes validation gap.
  project-history:
    - >
      The GitHub repository was created on 2020-05-30. The public documentation feed
      dates the overview, installation, usage, CRD support, JSON Schema conversion,
      GitHub Action, and Go-module documentation pages to 2021-07-02, which matches the
      period when the project presented itself as a standalone replacement for common
      Kubeval workflows.
    - >
      Kubeconform kept the Unix-style single-binary validator shape that made Kubeval
      popular in CI, but its distinguishing evolution was schema flexibility: users can
      validate against Kubernetes versions, local or remote schema locations, and
      converted CRD schemas rather than only core Kubernetes resources.
  related-projects:
    - >
      Kubeval is the direct predecessor named by the Kubeconform documentation. The
      kubernetes-json-schema registry is part of the validation ecosystem because
      Kubeconform uses JSON schemas for Kubernetes resources and supports
      schema-location overrides for CRDs.
  sources:
    - https://api.github.com/repos/yannh/kubeconform
    - https://github.com/yannh/kubeconform
    - https://github.com/yannh/kubernetes-json-schema
    - https://kubeconform.mandragor.org/docs/
    - https://kubeconform.mandragor.org/docs/crd-support/
    - https://kubeconform.mandragor.org/docs/usage/
  summary:
    - >
      Kubeconform is a Kubernetes manifest validator that grew out of the Kubeval
      lineage: its own documentation says it is inspired by, contains code from, and is
      designed to stay close to Kubeval while adding higher-throughput validation,
      configurable schema locations, CRD support, offline validation, and a schema
      registry fork for recent Kubernetes versions.
  timeline:
    - '2020-05-30: GitHub repository created.'
    - >
      2021-07-02: Documentation pages published for overview, installation, usage, CRD
      support, JSON Schema conversion, GitHub Action usage, and Go-module usage.
    - '2024-07-30: Release v0.6.7 published.'
    - '2025-05-12: Release v0.7.0 published.'
    - '2026-06-04: Release v0.8.0 published.'
  usage:
    - >
      Typical use is to pass files, directories, or stdin to `kubeconform`, optionally
      choosing output such as text, JSON, JUnit, or TAP and enabling summary output for
      CI logs. For custom resources, users point `-schema-location` at local or HTTP(S)
      JSON schemas, or convert CRDs to JSON Schema with the project-provided conversion
      tooling.
    - >
      The package matters in validation pipelines because it gives maintainers a fast,
      scriptable check for Kubernetes resource structure without needing live cluster
      access.
related-packages:
  - id: brew:kube-linter
    reason: >
      Run Kubeconform for Kubernetes and CRD schema validity, then KubeLinter for
      configurable production-readiness and security checks on the same YAML or Helm
      output.
    rel: adjacent_workflow
    sources:
      - https://kubeconform.mandragor.org/docs/overview/
      - https://docs.kubelinter.io/
  - id: brew:kube-score
    reason: >
      Use kube-score after schema validation when you also want recommendations about
      the reliability and security characteristics of Kubernetes objects.
    rel: adjacent_workflow
    sources:
      - https://kubeconform.mandragor.org/docs/overview/
      - https://kube-score.com/
category: developer-tools
