  - cli
  - git
  - mercurial
  - migration
  - repository-conversion
description: Fast Mercurial to Git converter
executables:
  - hg-fast-export.py
  - hg-fast-export.sh
  - hg-reset.py
  - hg-reset.sh
  - hg2git.py
provenance:
  formula: hg-fast-export
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
