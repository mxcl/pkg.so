id: brew:pgcli
display-name: pgcli
homepage: https://pgcli.com/
repo: https://github.com/dbcli/pgcli
docs:
  - https://www.pgcli.com/docs
  - https://github.com/dbcli/pgcli/blob/main/README.rst
  - https://www.pgcli.com/install
config-file-location:
  unix: ~/.config/pgcli/config
credentials-file-location:
  unix: ~/.pgpass
  windows: '%APPDATA%\postgresql\pgpass.conf'
history:
  adoption-history:
    - >
      pgcli is available through multiple Unix-oriented packaging systems, including
      Homebrew, Debian, Ubuntu, Fedora-family repositories, Arch Linux, Alpine Linux,
      MacPorts, and Nix, making it a broadly packaged alternative PostgreSQL shell.
  package-nerd-significance:
    - >
      pgcli applies modern interactive-shell features—context-aware completion, syntax
      highlighting, multiline editing, persistent history, and configurable output—to
      the traditional PostgreSQL command-line workflow.
  project-history:
    - >
      pgcli is maintained under the dbcli organization, a family of enhanced database
      command-line clients. Its development has continued through a long-running public
      release and changelog history.
  related-projects:
    - >
      pgcli is part of the dbcli ecosystem and is conceptually related to PostgreSQL's
      psql client and dbcli's mycli client for MySQL-compatible databases.
  sources:
    - 'Official changelog: https://github.com/dbcli/pgcli/blob/main/changelog.rst'
    - 'Official homepage: https://www.pgcli.com/'
    - 'Official repository: https://github.com/dbcli/pgcli'
  summary:
    - >
      pgcli is an interactive PostgreSQL command-line client focused on auto-completion,
      syntax highlighting, readable tabular output, and an improved REPL experience.
  timeline:
    - '2010s: pgcli emerged as part of the dbcli family of enhanced database shells.'
    - >
      Present: The project remains publicly developed and packaged across major Unix
      package ecosystems.
  usage:
    - >
      Users invoke pgcli with PostgreSQL connection parameters or a connection URI, then
      work interactively with SQL, slash commands, completion, query history, named
      queries, and configurable key bindings.
category: developer-tools
package-manager:
  apk: pgcli
  brew: pgcli
  debian: pgcli
  dnf: pgcli
  macports: pgcli
  nix: pgcli
  pacman: pgcli
  ubuntu: pgcli
package-manager-url: https://formulae.brew.sh/formula/pgcli
license: BSD-3-Clause
tags:
  - autocomplete
  - cli
  - database-client
  - postgresql
  - syntax-highlighting
description: CLI for Postgres with auto-completion and syntax highlighting
executables:
  - pgcli
provenance:
  formula: pgcli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
