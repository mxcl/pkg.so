id: brew:nave
display-name: nave
homepage: https://github.com/isaacs/nave
repo: https://github.com/isaacs/nave
docs:
  - https://github.com/isaacs/nave/wiki
  - https://github.com/isaacs/nave#readme
config-file-location:
  unix:
    - ~/.naverc
    - $XDG_CONFIG_HOME/.naverc
    - <project
    - ancestor>/.naverc
    - ancestor>/.nvmrc
    - ancestor>/.nave_profile
    - ancestor>/.nave_profile_<environment-or-version>
credentials-file-location: null
history:
  adoption-history:
    - >
      nave had real early-ecosystem visibility, helped by Isaac Schlueter's central role
      in npm and Node tooling, but it became a smaller niche as tools such as nvm, n,
      asdf, fnm, and Volta absorbed most mainstream version-manager usage. Homebrew
      analytics consulted on 2026-07-01 listed 59 installs over the preceding 365 days,
      suggesting maintenance and legacy use rather than broad new adoption.
  package-nerd-significance:
    - >
      nave is package-nerd history from the pre-standardized Node toolchain era: a small
      shell program that treats version management as disposable process state rather
      than a permanent mutation of the user's login shell.
  project-history:
    - >
      The GitHub repository was created on 2010-05-14, placing nave in the early Node.js
      tooling era when developers were still sorting out how to install and switch
      between Node versions. The README emphasizes that nave can be installed as a
      single shell script, symlinked, installed with npm, or run without editing shell
      startup files.
  related-projects:
    - >
      nvm, n, nodeenv, asdf-nodejs, fnm, Volta, npm, and Node.js distribution archives
      are the main related tools.
  sources:
    - https://api.github.com/repos/isaacs/nave
    - https://formulae.brew.sh/formula/nave
    - https://github.com/isaacs/nave
    - https://github.com/isaacs/nave/tags
    - https://stackoverflow.com/questions/3653495/is-there-a-virtual-environment-for-node-js
  summary:
    - >
      nave is Isaac Z. Schlueter's shell-based Node.js version and environment switcher.
      Its signature idea is to put a chosen Node version and its global npm install
      space into a subshell, so leaving the shell exits the environment.
  timeline:
    - '2010-05-14: GitHub repository created.'
    - >
      2010s: nave served as one of the early Node version/environment managers alongside
      nvm and n.
    - >
      2026-01-23: Repository metadata showed new commits pushed in 2026, while Homebrew
      packaged stable version 3.5.6.
  usage:
    - >
      Typical use is `nave use <version>` to enter a subshell, `nave use <name>
      <version>` for a named environment, `nave install <version>` to install a Node
      version, and `nave auto` to find a `.naverc` or `.nvmrc` and enter the configured
      environment. The README documents project-specific profile hooks and environment
      variables such as `NAVE`, `NAVENAME`, and `NAVEVERSION`.
related-packages:
  - id: brew:fnm
    reason: >
      Choose fnm for a fast cross-platform Rust implementation with `.nvmrc`
      compatibility and native Windows support; choose nave for its subshell-based
      virtual-environment model and shell-script transparency.
    rel: alternative
    sources:
      - https://github.com/isaacs/nave#readme
      - https://github.com/Schniz/fnm#readme
  - id: brew:nodeenv
    reason: >
      Choose nodeenv when you want a Node environment isolated in a directory and
      optional integration with Python virtualenv; choose nave when you prefer versioned
      subshells and upward `.naverc` discovery.
    rel: alternative
    sources:
      - https://github.com/isaacs/nave#readme
      - https://github.com/ekalinin/nodeenv#readme
  - id: brew:n
    reason: >
      Choose n for a minimal Unix-oriented manager that switches the active Node
      installation in a common prefix; choose nave when separate named environments or
      subshell isolation are required.
    rel: alternative
    sources:
      - https://github.com/isaacs/nave#readme
      - https://github.com/tj/n#readme
category: developer-tools
package-manager:
  brew: nave
package-manager-url: https://formulae.brew.sh/formula/nave
license: BlueOak-1.0.0
tags:
  - cli
  - nodejs
  - version-manager
  - virtual-environments
description: Virtual environments for Node.js
executables:
  - nave
provenance:
  formula: nave
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
