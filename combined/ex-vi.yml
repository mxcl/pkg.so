id: brew:ex-vi
display-name: ex-vi
homepage: https://ex-vi.sourceforge.net/
repo: https://ex-vi.cvs.sourceforge.net/ex-vi
docs:
  - https://ex-vi.sourceforge.net/
  - https://ex-vi.sourceforge.net/ex.html
  - https://ex-vi.sourceforge.net/vi.html
config-file-location:
  unix: ~/.exrc
credentials-file-location: null
history:
  adoption-history:
    - >
      ex-vi is adopted as a preservation-minded package rather than a modern editor
      platform. Package managers carry it for users who want traditional vi semantics,
      not Vim-style extensions.
    - >
      The official page lists release 050325 as current and points adventurous users to
      a public CVS repository, while warning that CVS may be less tested than release
      archives.
  package-nerd-significance:
    - >
      ex-vi matters to package collectors because it is close to historical Unix vi
      without the larger feature set of clones such as Vim or nvi. It is a compact
      compatibility and heritage package.
    - >
      It is also a useful test case for ports that want a real traditional vi, UTF-8
      support, and old ex behavior without bundling a much larger editor.
  project-history:
    - >
      The project site frames ex-vi as source code for modern Unix systems. It traces vi
      back to Bill Joy's work at UCB starting around 1976, and notes that the old source
      became freely usable after Caldera removed usage restrictions from ancient Unix
      code under a BSD-style license in January 2002.
    - >
      The port deliberately preserves traditional vi's small size, terminal control
      style, and feature set. Its changes focus on modern Unix portability,
      international character-set support including UTF-8, and selected later System V
      or POSIX.2 behavior.
  related-projects:
    - ex is the line editor base shared with vi in this codebase.
    - >
      The project compares itself with vi clones and references the Heirloom Toolchest
      for CVS build components.
  sources:
    - https://ex-vi.sourceforge.net/
    - https://ex-vi.sourceforge.net/vi.html
    - https://ex-vi.sourceforge.net/ex.html
    - http://ex-vi.cvs.sourceforge.net/ex-vi/ex-vi/
  summary:
    - >
      ex-vi, also known as The Traditional Vi, is a modern Unix port of the original
      ex/vi editor line, preserving classic vi behavior while adding portability and
      multibyte character support.
  timeline:
    - '1976: vi development began at UCB, according to the project site.'
    - >
      2002: Caldera removed usage restrictions from ancient Unix code under a BSD-style
      license.
    - '2005: Release 050325 was published as the current release listed by the project page.'
    - "2007: The project page footer records Gunnar Ritter's 2007-11-29 update."
  usage:
    - >
      The vi manual describes vi, view, and vedit as visual-display editors based on ex.
      vi and ex share the same code, with users able to move between ex command mode and
      vi visual mode.
    - >
      The manual documents ~/.exrc as a user configuration file, while the -s script
      mode explicitly disables EXINIT and .exrc processing.
related-packages:
  - id: brew:vim
    reason: >
      Choose Vim when you want vi-compatible editing plus multiple undo, syntax
      highlighting, scripting, plugins, and other features that The Traditional Vi
      intentionally omits.
    rel: alternative
    sources:
      - https://ex-vi.sourceforge.net/
      - https://www.vim.org/about.php
category: developer-tools
package-manager:
  brew: ex-vi
  macports: ex-vi
  pacman: ex-vi-compat
package-manager-url: https://formulae.brew.sh/formula/ex-vi
license: BSD-4-Clause AND BSD-4-Clause-UC
tags:
  - cli
  - terminal
  - text-editor
  - unix
  - utf-8
  - vi
description: UTF8-friendly version of traditional vi
executables:
  - vedit
provenance:
  formula: ex-vi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
