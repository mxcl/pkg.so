id: brew:gnu-shogi
display-name: GNU Shogi
homepage: https://www.gnu.org/software/gnushogi/
repo: https://git.savannah.gnu.org/cgit/gnushogi.git
docs:
  - https://www.gnu.org/software/gnushogi/manual
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Shogi represents the GNU Project's early effort to include freely
      redistributable games as part of a broad Unix-like software environment. Its niche
      adoption centered on users who wanted a terminal or X Window System shogi
      opponent, especially on Unix systems where packaged board-game engines and X11
      frontends were natural distribution units.
  package-nerd-significance:
    - >
      GNU Shogi is package-nerd interesting less for broad deployment than for lineage:
      it is a GNU Chess derivative, an XBoard/XShogi-era Unix game, and a reminder that
      GNU packages include small interactive programs as well as compilers and shell
      utilities.
  project-history:
    - >
      GNU's June 1993 bulletin records GNU Shogi as newly added to the Utilities Tape
      and describes it as a program created by modifying GNU Chess. The same bulletin
      identifies Matthias Mutz and explains the engine/front-end split between GNU Shogi
      and GNU XShogi, with XShogi derived from XBoard.
  related-projects:
    - >
      GNU Shogi is related to GNU Chess, GNU XShogi, XBoard, and other Unix board-game
      engines and frontends.
  sources:
    - https://www.gnu.org/bulletins/bull15.html
    - https://www.gnu.org/software/gnushogi/
    - https://www.gnu.org/software/gnushogi/manual/gnushogi.html
  summary:
    - >
      GNU Shogi is a GNU game engine for shogi, the Japanese chess variant. It plays
      against a human user or against itself and can run with a text interface or
      through older graphical frontends.
  timeline:
    - "1993: GNU's Bulletin listed GNU Shogi among new programs on the Utilities Tape."
    - "1993: GNU's Bulletin described GNU Shogi as derived by modifying GNU Chess."
    - >
      2013: The GNU Shogi homepage was written with Savannah, mailing-list, and frontend
      guidance.
    - '2026: The GNU Shogi homepage listed Yann Dirson as maintainer.'
  usage:
    - >
      Practitioners use gnushogi to play shogi against the engine, test positions, run
      the engine against itself, configure time controls, use opening books, and save or
      restore games. The manual documents curses, raw text, and xshogi-compatible
      display modes.
