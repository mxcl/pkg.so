id: brew:css-crush
display-name: css-crush
homepage: https://the-echoplex.net/csscrush
repo: https://github.com/peteboere/css-crush
docs:
  - https://the-echoplex.net/csscrush
config-file-location:
  unix: ./crushfile.php
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents both Composer installation for PHP projects and npm
      installation for JavaScript workflows, reflecting a package that began as a PHP
      preprocessor but also catered to Node-oriented build pipelines.
  package-nerd-significance:
    - >
      For package collectors, CSS Crush represents the period when CSS preprocessors
      competed on lightweight build integration, automatic prefixing, and language
      extensions before many of those features moved into PostCSS pipelines or native
      CSS.
  project-history:
    - >
      The upstream changelog shows CSS Crush evolving through the early-2010s CSS
      preprocessor wave, adding selector aliasing, vendor aliases, plugins, source maps,
      watch mode, and command-line workflow features before later major releases raised
      PHP requirements and removed older legacy-browser features.
  related-projects:
    - >
      CSS Crush sits in the same historical space as Sass, Less, Stylus, PostCSS-era
      plugins, and other CSS build tools that extended CSS before browser support caught
      up.
  sources:
    - https://github.com/peteboere/css-crush#readme
    - https://github.com/peteboere/css-crush/blob/master/CHANGELOG.md
    - https://the-echoplex.net/csscrush
  summary:
    - >
      CSS Crush is an extensible PHP-based CSS preprocessor and command-line tool for
      vendor prefixing, variables, imports, nesting, functions, mixins, minification,
      plugins, and source maps.
  timeline:
    - '2012: 1.8.0 adds selector aliasing.'
    - >
      2013: 2.0.0 raises the PHP requirement, namespaces library code, and removes
      several legacy IE helpers.
    - '2014: 2.2.0 adds crushfile.php for command-line configuration.'
    - '2019: 3.0.0 raises the PHP requirement to 5.6 and simplifies the plugin API.'
    - '2022: 4.0.0 raises the PHP requirement to 7.'
  usage:
    - >
      CSS Crush can be used as a PHP library, through helper functions that compile
      files or strings, or as a CLI-oriented build tool. The 2014 changelog entry for
      version 2.2.0 added a command-line config file named crushfile.php, which is the
      package's official documented config filename.
related-packages: []
category: developer-tools
package-manager:
  brew: css-crush
package-manager-url: https://formulae.brew.sh/formula/css-crush
license: MIT
tags:
  - cli
  - css
  - php
  - preprocessor
  - web-development
description: Extensible PHP based CSS preprocessor
executables:
  - csscrush
provenance:
  formula: css-crush
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
