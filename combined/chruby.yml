id: brew:chruby
display-name: chruby
homepage: https://github.com/postmodern/chruby
repo: https://github.com/postmodern/chruby
docs:
  - https://github.com/postmodern/chruby#readme
config-file-location:
  unix:
    - ~/.bashrc
    - ~/.zshrc
    - /etc/bashrc
    - /etc/profile.d/chruby.sh
    - ~/.bash_profile
    - ~/.zprofile
    - .ruby-version
    - ~/.ruby-version
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Homebrew installation, source installation, Arch
      AUR, Fedora Copr, FreeBSD ports, and pairing with ruby-install or ruby-build. The
      supplied package facts also show Homebrew, MacPorts, and Nix packaging.
  package-nerd-significance:
    - >
      chruby matters because it is the small-tool answer to heavier Ruby version
      managers. It plays well with package managers because it separates installing Ruby
      builds from selecting one in the shell, which keeps version switching inspectable
      and avoids shim directories.
  project-history:
    - >
      The GitHub repository was created in August 2012 and early tags begin with v0.0.1
      on the same date. The README highlights a deliberately small design: update PATH
      and RubyGems environment variables, support bash and zsh, default to system Ruby,
      and keep the implementation around 100 lines.
    - >
      chruby's README frames its design through anti-features: it does not hook cd by
      default, does not install executable shims, does not regenerate shims after gem
      installation, and does not require Rubies to live in the user's home directory.
  related-projects:
    - >
      Related projects include ruby-install, ruby-build, RVM, rbenv, rbfu, RubyGems,
      Bundler, JRuby, Rubinius, and MagLev.
  sources:
    - https://github.com/postmodern/chruby#readme
    - https://api.github.com/repos/postmodern/chruby
    - https://api.github.com/repos/postmodern/chruby/tags
    - https://api.github.com/repos/postmodern/chruby/releases
  summary:
    - >
      chruby is a minimal shell-based Ruby version switcher that changes the active Ruby
      by updating shell environment variables instead of using shims.
  timeline:
    - '2012: Repository created and v0.0.1 tag published.'
    - '2012: v0.1.x releases established the shell-based switcher.'
    - '2013: v0.3.x line matured around auto-switching and compatibility.'
    - '2023: v0.3.9 released.'
    - '2025: Repository metadata shows continued maintenance activity.'
  usage:
    - >
      Users source chruby.sh from shell startup files and optionally source auto.sh to
      switch versions by reading .ruby-version files in the current or parent
      directories. Non-standard Ruby install directories can be appended to the RUBIES
      shell array.
related-packages:
  - id: brew:ruby-install
    reason: >
      ruby-install is chruby's documented companion for installing CRuby, JRuby,
      TruffleRuby, or mruby before chruby selects the resulting installation.
    rel: adjacent_workflow
    sources:
      - https://github.com/postmodern/chruby#readme
      - https://github.com/postmodern/ruby-install#readme
  - id: brew:rbenv
    reason: >
      rbenv is a documented alternative that selects Ruby through PATH shims and a
      plugin ecosystem; choose chruby when direct shell environment changes and no shims
      are preferred.
    rel: alternative
    sources:
      - https://github.com/postmodern/chruby#readme
      - https://github.com/rbenv/rbenv#readme
  - id: brew:ruby-build
    reason: >
      ruby-build can compile Rubies into directories that chruby detects, and is useful
      when version-specific build definitions are preferred over ruby-install's
      release-discovery approach.
    rel: adjacent_workflow
    sources:
      - https://github.com/postmodern/chruby#readme
      - https://github.com/rbenv/ruby-build#readme
category: developer-tools
package-manager:
  brew: chruby
  macports: chruby
  nix: chruby
package-manager-url: https://formulae.brew.sh/formula/chruby
license: MIT
tags:
  - cli
  - environment
  - ruby
  - shell
  - version-switching
description: Ruby environment tool
executables:
  - chruby-exec
provenance:
  formula: chruby
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
