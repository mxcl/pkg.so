id: brew:forgejo-runner
display-name: Forgejo Runner
homepage: https://code.forgejo.org/forgejo/runner
repo: https://code.forgejo.org/forgejo/runner
docs:
  - https://forgejo.org/docs/latest/admin/actions
  - https://forgejo.org/docs/latest/admin/actions/configuration
  - https://forgejo.org/docs/latest/admin/actions/registration
config-file-location:
  linux: /home/runner/runner-config.yml
credentials-file-location:
  linux: /home/runner/runner-config.yml
history:
  adoption-history:
    - >
      Forgejo documents binary, container, and distribution-package installation routes.
      These establish supported deployment channels without quantifying adoption.
  package-nerd-significance:
    - >
      Its separate installation lets administrators manage workflow execution
      infrastructure independently of the forge server.
  project-history:
    - >
      Forgejo Runner is maintained as the execution service for Forgejo Actions. Forgejo
      schedules workflows, while separately installed runners fetch and execute their
      jobs.
  related-projects:
    - Forgejo; Docker; Podman; LXC.
  sources:
    - https://forgejo.org/docs/latest/admin/actions/
    - https://forgejo.org/docs/latest/admin/actions/configuration/
    - https://forgejo.org/docs/latest/admin/actions/installation/binary/
  summary:
    - >
      Forgejo Runner is the official worker program for Forgejo Actions continuous
      integration.
  timeline:
    - 'Forgejo 1.21: Actions became enabled by default in Forgejo.'
  usage:
    - >
      Register the runner, configure execution labels, and start its daemon with an
      explicit configuration path. Labels select container-based or direct host
      execution.
category: developer-tools
package-manager:
  brew: forgejo-runner
package-manager-url: https://formulae.brew.sh/formula/forgejo-runner
license: GPL-3.0-or-later
tags:
  - automation
  - cli
  - continuous-integration
  - forgejo
  - self-hosted
description: Official Actions runner for Forgejo instances
executables:
  - forgejo-runner
provenance:
  formula: forgejo-runner
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
