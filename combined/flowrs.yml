id: brew:flowrs
display-name: Flowrs
homepage: https://github.com/jvanbuel/flowrs
repo: https://github.com/jvanbuel/flowrs
docs:
  - https://github.com/jvanbuel/flowrs#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/flowrs/config.toml
    - ~/.config/flowrs/config.toml
    - ~/.flowrs
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/flowrs/config.toml
    - ~/.config/flowrs/config.toml
    - ~/.flowrs
history:
  adoption-history:
    - >
      Flowrs targets Airflow users who want terminal-native monitoring rather than a
      browser-only workflow. Its README documents support for managed Airflow services
      including Conveyor, Amazon MWAA, Google Cloud Composer, and Astronomer, as well as
      custom self-hosted Airflow instances.
  package-nerd-significance:
    - >
      Flowrs is package-interesting as part of the modern Rust TUI wave: it combines a
      cargo-published crate, a Homebrew formula, GitHub release installers, XDG config
      behavior, and a Ratatui-based terminal interface for a large orchestration system.
  project-history:
    - >
      The official README describes Flowrs as a TUI for Apache Airflow built with
      Ratatui. Its changelog records a first public release in November 2024 and a
      steady sequence of early 0.1.x releases through 2025.
    - >
      The package is published as the flowrs binary from the flowrs-tui crate, with
      installation paths documented for Homebrew, GitHub release binaries, and cargo
      install.
  related-projects:
    - >
      Official sources connect Flowrs to Apache Airflow, Ratatui, Conveyor, Amazon MWAA,
      Google Cloud Composer, Astronomer, and Catppuccin themes.
  sources:
    - https://github.com/jvanbuel/flowrs
    - https://raw.githubusercontent.com/jvanbuel/flowrs/main/CHANGELOG.md
    - https://raw.githubusercontent.com/jvanbuel/flowrs/main/Cargo.toml
    - https://raw.githubusercontent.com/jvanbuel/flowrs/main/README.md
  summary:
    - >
      Flowrs is a Rust terminal user interface for monitoring, inspecting, and managing
      Apache Airflow DAGs from the command line.
  timeline:
    - '2024: Flowrs 0.1.1 changelog marks the first release.'
    - '2024: Flowrs 0.1.3 changes the Homebrew formula name to flowrs.'
    - '2025: Flowrs 0.1.5 adds browser opening, theme and UI refinements, and config commands.'
    - '2025: Flowrs 0.1.15 refactors around a Conveyor client and tenant switching.'
    - >
      2026: Cargo metadata shows flowrs-tui continuing as a Rust 2021 package with a
      flowrs binary.
  usage:
    - >
      Users can run flowrs config enable -m <service> for managed Airflow services or
      flowrs config add for a custom Airflow instance. The tool writes configuration to
      the XDG config path by default and can authenticate with HTTP Basic Auth or bearer
      tokens.
    - >
      The TUI supports switching between configured Airflow servers, inspecting DAGs and
      task instances, and opening endpoints from the terminal.
related-packages: []
category: developer-tools
package-manager:
  brew: flowrs
package-manager-url: https://formulae.brew.sh/formula/flowrs
license: MIT
tags:
  - apache-airflow
  - cli
  - dag-monitoring
  - terminal
  - tui
  - workflow-orchestration
description: TUI application for Apache Airflow
executables:
  - flowrs
provenance:
  formula: flowrs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
