id: brew:yozefu
display-name: yozefu
homepage: https://maif.github.io/yozefu/
repo: https://github.com/MAIF/yozefu
docs:
  - https://github.com/MAIF/yozefu#readme
config-file-location:
  unix: ~/.config/io.maif.yozefu/config.json
credentials-file-location:
  unix: ~/.config/io.maif.yozefu/config.json
history:
  adoption-history:
    - >
      Public adoption evidence is still thin compared with older Kafka tools. Its
      appearance in Homebrew, crates.io, Arch packaging, and Nix-oriented install
      instructions shows the project moving from a personal/internal productivity tool
      toward package-manager discovery.
  package-nerd-significance:
    - >
      Yozefu is significant as a modern TUI entry in the Kafka tooling space: small,
      terminal-native, Rust-based, and built around exploratory consumption rather than
      full cluster management. It is the kind of package that matters to people who
      prefer k9s-like workflows over web dashboards.
  project-history:
    - >
      The public project is maintained by MAIF and presents itself as an interactive
      terminal user interface for exploring Kafka clusters. Its README positions it
      beside AKHQ, Redpanda Console, and JetBrains Kafka tooling, but with a terminal
      workflow and a command-line headless mode.
    - >
      A March 2025 article by the author says the tool had been developed over the
      previous four months to make Kafka data search more productive from the terminal.
      The design grew around real-time topic consumption, SQL-inspired filtering,
      cross-topic search, and later WebAssembly user-defined filters through Extism.
  related-projects:
    - >
      Related projects include AKHQ, Redpanda Console, JetBrains Kafka plugin, kcat,
      Ratatui, Extism, Apache Kafka, and jq.
  sources:
    - https://github.com/MAIF/yozefu
    - https://maif.github.io/yozefu/
    - https://mcdostone.github.io/articles/why-yozefu/
  summary:
    - >
      Yozefu is a young Rust terminal UI for exploring Kafka cluster data, packaged
      because it gives terminal-first users a focused alternative to browser Kafka
      consoles.
  timeline:
    - >
      2024-11: The author says work began roughly four months before the March 2025 “Why
      Yozefu?” article.
    - '2025-03-13: “Why Yozefu?” explains the motivation for a terminal Kafka explorer.'
    - >
      2025: The README documents Homebrew, cargo, Arch, and Nix install paths plus
      prebuilt release binaries.
  usage:
    - >
      Users run `yozf` against a registered Kafka cluster to browse topics, inspect
      records, filter values, export records, or stream matching results in headless
      mode into other command-line tools such as jq. The README explicitly notes that it
      consumes records only; it is not a Kafka producer or cluster administration
      console.
category: data
package-manager:
  brew: yozefu
package-manager-url: https://formulae.brew.sh/formula/yozefu
license: Apache-2.0
tags:
  - cli
  - data-exploration
  - kafka
  - streaming
  - terminal
  - tui
description: TUI for exploring data in a Kafka cluster
executables:
  - yozf
provenance:
  formula: yozefu
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
