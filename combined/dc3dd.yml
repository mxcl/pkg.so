id: brew:dc3dd
display-name: dc3dd
homepage: https://sourceforge.net/projects/dc3dd/
repo: https://sourceforge.net/p/dc3dd/code/HEAD/tree
docs:
  - https://sourceforge.net/projects/dc3dd
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dc3dd became a package-manager-visible member of the small family of forensic dd
      variants. Its official file feed notes Unix-like support for the current base
      version and a separate Windows/Cygwin line, while the input package facts show
      distribution through Homebrew, Debian, Fedora, MacPorts, Nix, Ubuntu, and
      openSUSE.
  package-nerd-significance:
    - >
      dc3dd matters because it is not a new imaging model; it is a conservative fork of
      a classic Unix primitive with forensic defaults bolted close to the copy loop.
      That makes it attractive to packagers and incident-response toolboxes that value
      scriptability and familiar dd semantics.
  project-history:
    - >
      The project tracks GNU coreutils ancestry through dd while carrying forensic
      changes in its own SourceForge code tree and release archives. The 7.3.1 archive
      ChangeLog records a long run of imaging-specific work from 2008 and 2009, followed
      by later maintenance releases in 2014, 2016, 2023, and the current 7.3.1 release.
  related-projects:
    - >
      GNU dd remains the base utility lineage; dcfldd is a closely related forensic dd
      variant with similar package-manager audiences.
  sources:
    - https://sourceforge.net/projects/dc3dd
    - https://sourceforge.net/projects/dc3dd/rss?path=/
    - https://sourceforge.net/projects/dc3dd/files/dc3dd/7.3.1/dc3dd-7.3.1.zip/download
    - https://sourceforge.net/p/dc3dd/code/HEAD/tree
  summary:
    - >
      dc3dd is a forensic-acquisition-oriented patch of GNU dd. Its official SourceForge
      description emphasizes on-the-fly hashing, split output files, pattern writing, a
      progress meter, and file verification, all aimed at evidence imaging workflows
      rather than general file copying.
  timeline:
    - >
      2008: ChangeLog entries record imaging-focused features such as dynamic error
      recovery, split input verification, Cygwin support, and progress improvements.
    - >
      2009: ChangeLog entries record threaded hashing/I/O, HPA/DCO detection, multiple
      simultaneous outputs, and hash-based verification.
    - '2014: SourceForge file feed lists dc3dd 7.2.641 artifacts.'
    - '2016: SourceForge file feed lists Windows/Cygwin artifacts for dc3dd 7.2.646.'
    - '2023: SourceForge file feed lists dc3dd 7.3.1.'
  usage:
    - >
      Package users reach for dc3dd when they want dd-style acquisition with integrated
      hashes, verification, progress reporting, and output splitting. Those features
      reduce the shell glue otherwise needed around GNU dd in forensic imaging runs.
related-packages:
  - id: brew:dcfldd
    reason: >
      Choose dcfldd as an alternative forensic dd when flexible wiping, multiple
      simultaneous outputs, split output, and native logging or pipelines are central to
      the acquisition workflow.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/dc3dd/
      - https://github.com/resurrecting-open-source-projects/dcfldd#readme
  - id: brew:ddrescue
    reason: >
      Choose GNU ddrescue instead when the source medium is failing and resumable,
      mapfile-driven recovery of readable areas is more important than integrated
      forensic hashing.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/dc3dd/
      - https://www.gnu.org/software/ddrescue/manual/ddrescue_manual.html
  - id: brew:coreutils
    reason: >
      Choose GNU coreutils dd for ordinary low-level copying when dc3dd's acquisition
      hashes, verification, progress, and split-output features are unnecessary.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/dc3dd/
      - https://www.gnu.org/software/coreutils/manual/html_node/dd-invocation.html
category: security
