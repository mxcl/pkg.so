id: brew:espeak
display-name: eSpeak
homepage: https://espeak.sourceforge.net/
repo: https://sourceforge.net/p/espeak/code/HEAD/tree
docs:
  - https://espeak.sourceforge.net/commands.html
  - https://espeak.sourceforge.net/languages.html
  - https://espeak.sourceforge.net/voices.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      eSpeak became a portable Unix and Windows speech synthesis tool, with the project
      documenting command-line, shared library, Windows SAPI5, Android, Mac OS X, and
      Solaris use. Its accessibility-oriented packaging footprint made it a common
      dependency for screen readers, test speech output, and lightweight text-to-speech
      workflows.
  package-nerd-significance:
    - >
      For package maintainers, eSpeak is the classic small, C-based text-to-speech
      utility: old enough to appear across many Unix package sets, small enough to be
      useful in minimal systems, and still distinctive because it trades naturalness for
      portability, speed, and language coverage.
  project-history:
    - >
      The project states that it was originally known as speak and was first written for
      Acorn RISC OS computers starting in 1995. The eSpeak version was an enhancement
      and rewrite that relaxed the original memory and CPU constraints and added more
      languages.
  related-projects:
    - >
      The project can act as a front end for MBROLA diphone voices and includes
      eSpeakEdit for preparing and compiling phoneme data.
  sources:
    - https://espeak.sourceforge.net/
  summary:
    - >
      eSpeak is a compact open source text-to-speech engine and command-line program
      known for formant synthesis, broad language coverage, and small installed size.
  timeline:
    - '1995: Original speak project begins on Acorn RISC OS.'
    - >
      2000s: eSpeak rewrite and SourceForge-hosted releases broaden language and
      platform support.
  usage:
    - >
      The package is commonly used through the `espeak` executable to speak text from a
      file or standard input, write WAV output, inspect phonemes, or provide a compact
      speech backend for accessibility and automation.
related-packages:
  - id: brew:espeak-ng
    reason: >
      Choose eSpeak NG for the actively developed continuation that preserves the eSpeak
      lineage while cleaning up the codebase and extending language support.
    rel: alternative
    sources:
      - https://github.com/espeak-ng/espeak-ng#history
      - https://espeak.sourceforge.net/
category: media
