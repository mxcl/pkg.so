history:
  adoption-history:
    - >
      Nagios Plugins became important because Nagios delegated resource-specific checks
      to plugins, allowing the core scheduler to monitor almost anything that could be
      automated. Official docs list network services, system resources, Unix/Linux,
      Windows and NetWare servers, routers, switches, and community plugins as part of
      the ecosystem. Homebrew reported only 451 installs over 365 days on July 1, 2026,
      but that understates adoption because Nagios deployments usually install plugins
      through Linux distributions, source packages, monitoring appliances, or bundled
      Nagios stacks.
  package-nerd-significance:
    - >
      The package is a foundational example of a stable CLI plugin ABI. The individual
      checks are ordinary executables, but the exit-code and output contract let Nagios,
      Icinga-style systems, wrappers, and custom scripts compose checks written in C,
      shell, Perl, Python, or anything else. For package maintainers, it is also a
      bundle package: installing one formula drops a fleet of `check_*` tools into
      Homebrew's sbin.
  project-history:
    - >
      Nagios traces its origin to Ethan Galstad's 1996 MS-DOS paging tool and the 1999
      open-source NetSaint release. The Nagios history page says plugins that were
      originally distributed with NetSaint were soon spun off as a separate NetSaint
      Plugins project; in 2002 NetSaint was renamed Nagios and NetSaint Plugins
      development moved to the Nagios Plugins project. The current GitHub repository was
      created on January 16, 2014, but the codebase and plugin convention are much
      older.
  related-projects:
    - Nagios Core
    - Nagios XI
    - Nagios Exchange
    - Icinga
    - Monitoring Plugins
    - NRPE
    - NCPA
  sources:
    - https://api.github.com/repos/nagios-plugins/nagios-plugins
    - https://api.github.com/repos/nagios-plugins/nagios-plugins/releases/latest
    - https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/3/en/plugins.html
    - https://formulae.brew.sh/api/formula/nagios-plugins.json
    - https://formulae.brew.sh/formula/nagios-plugins
    - https://github.com/nagios-plugins/nagios-plugins
    - https://nagios-plugins.org/
    - https://nagios-plugins.org/doc/guidelines.html
    - https://nagios-plugins.org/doc/man/index.html
    - https://www.nagios.org/about/history/
  summary:
    - >
      Nagios Plugins is the official plugin collection for the Nagios monitoring
      architecture: checks such as `check_http`, `check_disk`, `check_ping`,
      `check_ssh`, `check_load`, and many more. Its history is tied directly to Nagios
      itself and to the design choice that monitoring checks are external executables
      with standardized output, thresholds, performance data, and return codes.
  timeline:
    - >
      1996: Ethan Galstad creates the early paging/checking tool that becomes Nagios's
      architectural seed.
    - >
      1999: NetSaint is released as open source and the plugin code is soon spun out as
      a separate project.
    - >
      2002: NetSaint is renamed Nagios and NetSaint Plugins development moves to Nagios
      Plugins.
    - '2014-01-16: current GitHub repository created.'
    - '2026-03-31: Nagios Plugins 2.5 released.'
    - '2026-07-01: Homebrew API reported 451 installs over 365 days.'
  usage:
    - >
      Administrators call plugins directly while testing and then wire the same command
      into Nagios service definitions. Each plugin prints a short status line to stdout
      and exits 0 for OK, 1 for Warning, 2 for Critical, or 3 for Unknown. The shared
      options pattern matters in day-to-day use: `-H` for host, `-w` and `-c` for
      thresholds, `-t` for timeout, `-v` for verbosity, and `--help` or `--usage` for
      plugin-specific syntax. Performance data after `|` feeds graphing and long-term
      metrics.
related-packages:
  - id: brew:nagios
    reason: >
      Nagios Core schedules and interprets these plugin commands, making it the primary
      monitoring engine to pair with the collection.
    rel: adjacent_workflow
    sources:
