id: brew:acl2
display-name: ACL2
homepage: https://www.cs.utexas.edu/~moore/acl2/
repo: https://github.com/acl2/acl2
docs:
  - https://acl2.org/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ACL2 adoption is organized around releases, manuals, workshops, mailing lists, and
      community books rather than a single executable alone. The home page emphasizes
      extensive documentation, community books, workshops, publications, and course
      material.
    - >
      Package-manager adoption gives users a way to install a working ACL2 executable
      without manually building a Common Lisp image, while advanced users still rely on
      the official source and book-certification workflow.
  package-nerd-significance:
    - >
      ACL2 is package-nerd significant because it packages a formal-methods environment
      with Common Lisp implementation concerns, a large documentation tree, community
      libraries, and command-line entry points.
    - >
      It also shows how theorem provers differ from ordinary CLIs: reproducibility
      depends on the executable, the versioned logic, and certified books lining up.
  project-history:
    - >
      The ACL2 home page expands ACL2 as A Computational Logic for Applicative Common
      Lisp and describes it as part of the Boyer-Moore family of provers. The same page
      names Matt Kaufmann and J Strother Moore as the project contacts/authors for the
      current release page.
    - >
      The official GitHub README divides the project into the ACL2 System and the ACL2
      Books, with the system maintained by the ACL2 authors and the books maintained by
      the broader ACL2 community.
  related-projects:
    - >
      Related projects and extensions include ACL2(r), ACL2(p), ACL2s, the ACL2
      Community Books, the Boyer-Moore prover family, Common Lisp implementations, and
      the acl2-devel release fork.
  sources:
    - https://acl2.org/doc/
    - https://raw.githubusercontent.com/acl2/acl2/master/README.md
    - https://raw.githubusercontent.com/acl2/acl2/master/doc/home-page.html
    - source_facts.package-manager
  summary:
    - >
      ACL2 is both a logic and programming language for modeling computer systems and a
      theorem prover for proving properties of those models.
  timeline:
    - >
      2005: Authors of the Boyer-Moore family of provers receive the ACM Software System
      Award, as noted on the ACL2 home page.
    - >
      2015: ACL2 Version 7.0 era predates the move of books to the current GitHub
      workflow noted by the home page.
    - >
      2026: ACL2 Version 8.7 home page published with current manual, release links, and
      community-book guidance.
  usage:
    - >
      Users model systems in the ACL2 logic/programming language, submit definitions and
      theorems, and use the prover interactively or through books. The official
      documentation can be browsed on the web, locally, in Emacs ACL2-Doc, or through
      the ACL2 :DOC command.
    - >
      The community books are a major part of day-to-day ACL2 use: they provide lemma
      libraries, utilities, examples, and contributed tools that extend the base prover.
related-packages: []
category: science
package-manager:
  brew: acl2
  debian: acl2
  macports: acl2
  nix: acl2
  ubuntu: acl2
package-manager-url: https://formulae.brew.sh/formula/acl2
license: BSD-3-Clause
tags:
  - cli
  - formal-methods
  - lisp
  - logic
  - theorem-prover
description: Logic and programming language in which you can model computer systems
executables:
  - acl2
  - acl2p
provenance:
  formula: acl2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
