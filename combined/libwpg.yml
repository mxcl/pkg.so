id: brew:libwpg
display-name: libwpg
homepage: https://libwpg.sourceforge.net/
repo: https://sourceforge.net/p/libwpg/code/ci/master/tree
docs:
  - https://libwpg.sourceforge.net/
  - https://sourceforge.net/p/libwpg/wiki/Home
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libwpg was adopted where WPG files needed to cross into open formats. The project
      site lists Inkscape support since version 0.45, AbiWord, OpenOffice.org
      integration work, and Karbon14/KOffice work, while the Document Liberation Project
      later grouped this style of import library with other efforts around LibreOffice
      and open document conversion.
  package-nerd-significance:
    - >
      libwpg matters because it covers a format that is obscure until archival or
      migration work makes it urgent. Its package is the small bridge between legacy
      WordPerfect/Corel graphics and modern SVG or OpenDocument workflows.
  project-history:
    - >
      The project describes itself as a collection of a parsing library and tools for
      WPG, the WordPerfect Graphics format used by Corel software including WordPerfect
      and Presentations. SourceForge's release archive shows libwpg 0.1.0 published on
      2007-08-06, followed by the 0.2 series beginning in 2010 and the 0.3 series
      beginning in 2014.
    - >
      The code repository and project site show the split personality that made libwpg
      useful: a core library for applications, command-line converters such as wpg2svg
      and wpg2raw, and viewer/converter work around Perfectspot.
  related-projects:
    - >
      Related projects include Inkscape, AbiWord, OpenOffice.org, Karbon/KOffice,
      Perfectspot, LibreOffice, librevenge, and the Document Liberation Project
      libraries.
  sources:
    - https://libwpg.sourceforge.net/
    - https://sourceforge.net/p/libwpg/code/ci/master/tree/
    - https://sourceforge.net/projects/libwpg/files/libwpg/
    - https://www.documentliberation.org/about/
  summary:
    - >
      libwpg is a C++ library and tool set for WordPerfect Graphics files, giving
      open-source graphics and office software a parser for Corel-era WPG drawings.
  timeline:
    - '2007-08-06: libwpg 0.1.0 published on SourceForge.'
    - '2010-11-16: libwpg 0.2.0 published on SourceForge.'
    - '2014-05-23: libwpg 0.3.0 published on SourceForge.'
    - >
      2014-04: The Document Liberation Project was created as an independent home for
      related format-liberation work.
    - '2023-04-29: libwpg 0.3.4 published on SourceForge.'
  usage:
    - >
      Most users get libwpg indirectly through an application that imports WPG graphics.
      Packagers expose the converter tools so users can script WPG-to-SVG or diagnostic
      raw output without opening a full office suite.
related-packages:
  - id: brew:writerperfect
    reason: >
      writerperfect uses libwpg to provide the wpg2odg conversion path, complementing
      libwpg's own SVG and parser-oriented utilities with OpenDocument Graphics output.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/libwpd/wiki/writerperfect/
      - https://libwpd.sourceforge.net/download.html
  - id: cask:inkscape
    reason: >
      Inkscape has used libwpg for WPG import, providing an interactive workflow for
      editing imported legacy drawings and exporting them as modern vector graphics.
    rel: adjacent_workflow
    sources:
      - https://libwpg.sourceforge.net/
      - https://inkscape.org/about/
