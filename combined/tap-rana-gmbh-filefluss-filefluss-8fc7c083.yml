id: cask:rana-gmbh/filefluss/filefluss
display-name: FileFluss
homepage: https://github.com/rana-gmbh/filefluss
repo: https://github.com/rana-gmbh/filefluss
docs:
  - https://github.com/rana-gmbh/FileFluss#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FileFluss is distributed through its own Homebrew tap as well as downloadable
      macOS disk images. Its design targets users who want orthodox two-panel file
      management while working across numerous cloud and network-storage services.
  package-nerd-significance:
    - >
      FileFluss brings the dual-pane file-manager tradition to a cloud-heavy macOS
      workflow. Its combination of local files, many cloud providers, SFTP, WebDAV,
      S3-compatible storage, folder comparison, synchronization, and Finder mounts makes
      it unusually broad for a native desktop utility.
  project-history:
    - >
      Rana GmbH created FileFluss as a native macOS dual-panel file manager. During its
      public 1.x series it expanded from local and multi-cloud browsing into offline
      indexing, customizable keyboard layouts, folder comparison and synchronization,
      Finder mounting, and configurable transfer caching.
  related-projects:
    - >
      The official build uses a separate Homebrew tap repository for cask distribution,
      while application releases and source live in the main FileFluss repository.
  sources:
    - https://github.com/rana-gmbh/FileFluss#readme
    - https://github.com/rana-gmbh/FileFluss/releases
  summary:
    - >
      FileFluss is an open-source dual-panel file manager for macOS that treats local
      folders and many cloud or network accounts as peer locations.
  timeline:
    - >
      2026: The public 1.x series added offline search, Finder mounts, configurable
      caching, localization, and broader cloud-provider support.
  usage:
    - >
      Users place independent local folders or cloud accounts in the two panels, then
      copy, move, compare, search, or synchronize between them. Cloud credentials are
      configured under Settings → Cloud Accounts and are stored through the macOS login
      Keychain rather than a documented credentials file.
related-packages:
  - id: cask:forklift
    reason: >
      Choose ForkLift when you want a mature commercial macOS dual-pane manager with
      built-in SFTP, WebDAV, S3, Backblaze, Google Drive, OneDrive, Dropbox, and one- or
      two-way synchronization.
    rel: alternative
    sources:
      - https://github.com/rana-gmbh/FileFluss#readme
      - https://www.binarynights.com/
  - id: cask:mucommander
    reason: >
      Choose muCommander for a cross-platform, open-source dual-pane interface with
      broad network-filesystem and archive support, accepting a Java runtime and a
      smaller cloud-provider set.
    rel: alternative
    sources:
      - https://github.com/rana-gmbh/FileFluss#readme
      - https://www.mucommander.com/
  - id: cask:nimble-commander
    reason: >
      Choose Nimble Commander for a lightweight, keyboard-centric open-source macOS file
      manager focused on local files and FTP, SFTP, and WebDAV rather than FileFluss’s
      extensive cloud-account catalog.
    rel: alternative
    sources:
      - https://github.com/rana-gmbh/FileFluss#readme
      - https://magnumbytes.com/
