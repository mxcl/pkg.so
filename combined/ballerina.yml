id: brew:ballerina
display-name: Ballerina
homepage: https://ballerina.io
repo: https://github.com/ballerina-platform/ballerina-lang
docs:
  - https://ballerina.io/learn
config-file-location:
  unix:
    - ./Ballerina.toml
    - ./Config.toml
    - ./tests/Config.toml
    - ~/.ballerina/Settings.toml
credentials-file-location:
  unix: ~/.ballerina/Settings.toml
history:
  adoption-history:
    - >
      Ballerina adoption is tied to WSO2's integration ecosystem, Ballerina Central, and
      users building services, connectors, data pipelines, and enterprise integration
      patterns. The homepage lists users and case-study links including WSO2, Red Cross
      Elixir, Fat Tuesday, MOSIP, QHAna, RAAPID, Choreo, Tech Venturas, Visualize HR,
      and Avinya Foundation.
    - >
      Package-manager adoption is narrower than mainstream languages but present: the
      input facts list Homebrew and Nix packages. The Homebrew formula API reported
      stable version 2201.13.4 with 24 installs in the previous 30 days as of June 30,
      2026.
  package-nerd-significance:
    - >
      Ballerina is significant because it is not just another JVM-hosted language
      package; it packages a language designed around integration semantics, network
      resources, typed data, and service tooling. For package nerds, it is a full
      toolchain with its own package registry, config conventions, code generators, docs
      tooling, and deployment story exposed through one `bal` executable.
  project-history:
    - >
      The Ballerina homepage describes it as a programming language for the cloud that
      makes it easier to use, combine, and create network services. The same page says
      WSO2 has developed Ballerina since 2016 and that it was first released in February
      2022.
    - >
      The ballerina-platform/ballerina-lang GitHub repository was created on November
      16, 2016. The project positions the language around integration as code, with
      built-in support for network protocols, data formats, connectors, concurrency,
      sequence-diagram-oriented views, and cloud-native deployment.
  related-projects:
    - >
      Ballerina Central is the package and connector ecosystem referenced by the
      official Learn page.
    - >
      Related tooling includes the Ballerina VS Code extension, OpenAPI, GraphQL,
      AsyncAPI, gRPC, health/FHIR/HL7, EDI, WSDL, XSD, persist, scan, profiler, and
      GraalVM executable tooling documented in the Learn section.
  sources:
    - https://api.github.com/repos/ballerina-platform/ballerina-lang
    - https://api.github.com/repos/ballerina-platform/ballerina-lang/releases/latest
    - https://ballerina.io/
    - https://ballerina.io/learn/
    - https://formulae.brew.sh/api/formula/ballerina.json
  summary:
    - >
      Ballerina is an open-source, cloud-native programming language developed by WSO2
      for integration, network services, data handling, and API-oriented applications.
      The Homebrew package installs the `bal` toolchain for building, running, testing,
      formatting, packaging, and publishing Ballerina code.
  timeline:
    - '2016: WSO2 begins developing Ballerina, according to the official homepage.'
    - '2016-11-16: ballerina-platform/ballerina-lang repository created on GitHub.'
    - '2022-02: Official homepage says Ballerina was first released.'
    - '2026-06-04: GitHub latest release endpoint reported ballerina-lang v2201.12.12.'
    - '2026-06-30: Homebrew formula reports stable ballerina 2201.13.4.'
  usage:
    - >
      The `bal` CLI supports project and module workflows around `Ballerina.toml`,
      runtime configuration via `Config.toml`, package management through Ballerina
      Central, tests, documentation generation, OpenAPI/GraphQL/AsyncAPI/gRPC tooling,
      Java interop, observability, container and Kubernetes deployment guidance, and
      GraalVM native executable workflows.
    - >
      Typical use cases include REST, GraphQL, gRPC, Kafka, database, data-processing,
      and integration services where network and data abstractions are part of the
      language and standard ecosystem.
related-packages: []
category: language-runtime
package-manager:
  brew: ballerina
  nix: ballerina
package-manager-url: https://formulae.brew.sh/formula/ballerina
license: Apache-2.0
tags:
  - cli
  - cloud-native
  - compiler
  - integration
  - network-services
  - programming-language
description: Programming Language for Network Distributed Applications
executables:
  - bal
provenance:
  formula: ballerina
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
