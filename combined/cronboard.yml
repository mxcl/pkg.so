id: brew:cronboard
display-name: cronboard
homepage: https://cronboard.dev/
repo: https://github.com/antoniorodr/cronboard
docs:
  - https://github.com/antoniorodr/cronboard#readme
config-file-location:
  unix:
    - ~/.config/cronboard/config.toml
    - ~/.config/cronboard/servers.toml
credentials-file-location:
  unix: ~/.config/cronboard/servers.toml
history:
  adoption-history:
    - >
      Official project materials note selection as Terminal Trove Tool of the Week on
      October 28, 2025, but the project is still presented as a young tool rather than a
      mature cron-management standard.
  package-nerd-significance:
    - >
      For package users, cronboard is notable as a modern Python terminal app wrapping
      classic cron operations, with Homebrew distribution giving macOS and Linuxbrew
      users a simple install path for a task that otherwise depends on local crontab
      editing.
  project-history:
    - >
      The project is published by Antonio Rodriguez and describes itself as under
      development. Its first public Git tag was v0.1.0 in April 2025, followed by a
      sequence of 0.x releases through 2026.
  related-projects:
    - cronboard builds on Textual, python-crontab, Paramiko, and cron-descriptor.
  sources:
    - https://github.com/antoniorodr/cronboard#readme
    - https://cronboard.dev/
    - https://github.com/antoniorodr/cronboard/tags
    - https://formulae.brew.sh/formula/cronboard
  summary:
    - >
      cronboard is a terminal user interface for inspecting and editing cron jobs on
      local machines and remote servers. It fits the small but durable Unix tooling
      niche around cron, adding a Textual-based dashboard to a workflow that is usually
      handled through crontab and shell commands.
  timeline:
    - '2025: v0.1.0 public tag'
    - '2025: Selected as Terminal Trove Tool of the Week'
    - '2026: v0.7.1 release'
  usage:
    - >
      cronboard is used to add, edit, pause, resume, search, and delete cron jobs,
      including jobs on remote hosts over SSH. It also surfaces log checks, path
      autocompletion, special cron expressions, and sudo-based management of another
      user's crontab.
related-packages: []
category: developer-tools
package-manager:
  brew: cronboard
package-manager-url: https://formulae.brew.sh/formula/cronboard
license: Apache-2.0
tags:
  - cli
  - cron
  - dashboard
  - scheduling
  - terminal
description: Terminal-based dashboard for managing cron jobs locally and on servers
executables:
  - cronboard
provenance:
  formula: cronboard
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
