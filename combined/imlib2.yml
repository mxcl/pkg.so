id: brew:imlib2
display-name: Imlib2
homepage: https://sourceforge.net/projects/enlightenment/
repo: https://git.enlightenment.org/old/legacy-imlib2
docs:
  - https://docs.enlightenment.org/api/imlib2/html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Imlib2 is widely packaged because many Unix graphics and desktop tools depend on a
      small C library for image loading and rendering. The input metadata lists packages
      across Alpine, Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and
      openSUSE; Homebrew also publishes a formula for the library.
    - >
      Its adoption is less about direct command-line invocation and more about being a
      shared library under desktop utilities, lightweight viewers, and Enlightenment-era
      software. The README names Eterm, feh, and geist as example consumers.
  package-nerd-significance:
    - >
      Imlib2 is package-nerd significant because it is the old-school Unix graphics
      dependency that keeps showing up in distro dependency trees. It illustrates a
      different kind of package importance: not a fashionable CLI, but a long-lived C
      ABI and loader ecosystem that distributions keep carrying because other software
      still builds on it.
  project-history:
    - >
      Imlib2 predates most modern GitHub-centered package histories. The official
      SourceForge project for Enlightenment was registered in 1999, and the official
      ChangeLog records Imlib2 releases at least back to the 1.2.x line in 2006. The
      repository later lived in the Enlightenment Git service under the legacy-imlib2
      name.
    - >
      The project has remained active as a low-level graphics library rather than an
      end-user image editor. The ChangeLog shows steady maintenance across loader fixes,
      scaling and alpha behavior, security-sensitive parser work, and support for
      formats such as AVIF, HEIF, JPEG XL, QOI, SVG, and Y4M in later releases.
  related-projects:
    - >
      Imlib2 is part of the broader Enlightenment family. Its README names Eterm, feh,
      and geist as examples of software using the library, and its history is connected
      to Imlib 1.x through the rewrite described in the README.
  sources:
    - https://formulae.brew.sh/formula/imlib2
    - https://git.enlightenment.org/old/legacy-imlib2
    - https://git.enlightenment.org/old/legacy-imlib2/src/branch/master/ChangeLog
    - https://git.enlightenment.org/old/legacy-imlib2/src/branch/master/README.in
    - https://sourceforge.net/projects/enlightenment/
  summary:
    - >
      Imlib2 is a C image loading, saving, rendering, and manipulation library from the
      Enlightenment ecosystem. Its own README describes it as a complete rewrite of the
      Imlib 1.x series, with a more modular, simple, and flexible architecture.
  timeline:
    - '1999-11-04: Enlightenment project registered on SourceForge.'
    - '2006-03-18: Imlib2 v1.2.2 recorded in the official ChangeLog.'
    - '2007-05-06: v1.4.0 recorded in the official ChangeLog.'
    - '2020-08-01: v1.7.0 recorded in the official ChangeLog.'
    - '2023-08-17: v1.12.0 recorded in the official ChangeLog.'
    - '2026-01-03: v1.12.6 recorded in the official ChangeLog.'
  usage:
    - >
      Imlib2 is used by C programs to load and save images, render and manipulate pixel
      data, draw polygons, and work with image formats through load/save modules. The
      Homebrew formula exposes helper commands such as imlib2_load, imlib2_view,
      imlib2_conv, and imlib2_grab, but the main value is the library and development
      headers.
related-packages:
  - id: brew:feh
    reason: >
      feh is a lightweight command-oriented image viewer documented among Imlib2's
      consumers, providing an end-user viewing workflow on top of the library.
    rel: adjacent_workflow
    sources:
      - https://git.enlightenment.org/old/legacy-imlib2/src/branch/master/README.in
      - https://feh.finalrewind.org/
category: media
