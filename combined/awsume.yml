id: brew:awsume
display-name: AWSume
homepage: https://awsu.me
repo: https://github.com/trek10inc/awsume
docs:
  - https://awsu.me/
  - https://awsu.me/general/aws-file-configuration.html
  - https://awsu.me/general/config.html
  - https://awsu.me/general/overview.html
config-file-location:
  unix:
    - ~/.awsume/config.yaml
    - ${XDG_CONFIG_HOME}/awsume/config.yaml
    - ~/.aws/config
credentials-file-location:
  unix: ~/.aws/credentials
history:
  adoption-history:
    - >
      AWSume's adoption is mostly among developers and operators managing many AWS
      accounts or roles. That is a common agency, consulting, and platform-team problem:
      the standard AWS shared profile format is flexible, but repeatedly calling STS and
      exporting temporary credentials is tedious.
    - >
      The official docs recommend pipx or pip rather than Homebrew, while the Homebrew
      formula still exists for users who prefer system package managers. That split is
      worth noting: package-manager availability is convenient, but the project itself
      treats Python packaging as the official install path.
  package-nerd-significance:
    - >
      AWSume is important for package nerds because it highlights a packaging wrinkle:
      some command-line tools are not just executables, they must integrate with the
      parent shell. The install is only half the story; aliases, shell wrappers, and
      PATH behavior determine whether it actually works.
    - >
      It also belongs to the larger AWS credential-helper family: focused tools that do
      not replace AWS CLI but make AWS CLI, SDKs, and arbitrary subprocesses easier to
      use safely with temporary credentials.
  project-history:
    - >
      The `trek10inc/awsume` repository was created in March 2016. Its official
      documentation describes AWSume as a utility for retrieving and exporting AWS
      credentials from AWS shared config and credentials files, including profiles that
      require MFA or assume-role calls.
    - >
      By the v4 era, the docs emphasized shell integration: on Unix-like systems AWSume
      needs to be sourced or aliased because a child process cannot update a parent
      shell's environment. The project also grew plugin and extra-feature support,
      including SAML, fuzzy matching, console helpers, auto-refresh, role chaining, and
      credential export back into AWS profile files.
  related-projects:
    - >
      AWS CLI and AWS SDKs consume the environment variables and shared credentials
      AWSume manages.
    - >
      AWS STS AssumeRole and GetSessionToken are the AWS API operations behind many
      AWSume workflows.
    - awsume-console-plugin and other AWSume extras extend the core credential workflow.
  sources:
    - https://api.github.com/repos/trek10inc/awsume
    - https://awsu.me/
    - https://awsu.me/general/aws-file-configuration.html
    - https://awsu.me/general/config.html
    - https://awsu.me/general/overview.html
    - https://awsu.me/general/quickstart.html
    - https://github.com/trek10inc/awsume
  summary:
    - >
      AWSume is a command-line utility for assuming AWS IAM roles and exporting the
      resulting credentials into the user's shell environment. It is built around a
      daily AWS workflow: move between profiles, MFA-backed sessions, and role chains
      without hand-editing environment variables.
  timeline:
    - '2016: Public GitHub repository `trek10inc/awsume` created.'
    - '2019: v4.0.0-era tag/commit appears in the repository history.'
    - '2020: v4.5.0 release commit recorded.'
    - >
      2024: Official docs mention 4.5.x credential_process support and 4.4.x
      role-chaining improvements.
  usage:
    - >
      A normal workflow is `awsume <profile_name>` after shell alias setup. AWSume reads
      `~/.aws/config` and `~/.aws/credentials`, handles MFA or role assumption when
      needed, then sets variables such as `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`,
      `AWS_SESSION_TOKEN`, `AWS_PROFILE`, and region variables.
    - >
      AWSume stores its own configuration at `~/.awsume/config.yaml` by default, or
      `${XDG_CONFIG_HOME}/awsume/config.yaml` when XDG config is set. It also caches
      MFA-authenticated credentials under `~/.awsume/cache/` according to the official
      overview.
related-packages:
  - id: brew:granted
    reason: >
      Choose Granted for an alternative AWS role-assumption workflow with IAM Identity
      Center, encrypted credential caching, and isolated browser-console sessions.
    rel: alternative
    sources:
      - https://awsu.me/general/overview.html
      - https://github.com/fwdcloudsec/granted
      - https://docs.granted.dev/
  - id: brew:aws-vault
    reason: >
      Choose aws-vault when storing long-lived AWS credentials in an operating-system
      secure keystore and generating temporary sessions is the central requirement.
    rel: alternative
    sources:
      - https://awsu.me/general/overview.html
      - https://github.com/99designs/aws-vault#readme
  - id: brew:awscli
    reason: >
      AWSume prepares temporary credentials and profile variables for AWS CLI commands,
      making the two tools a direct shell workflow.
    rel: adjacent_workflow
    sources:
      - https://awsu.me/general/overview.html
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
category: cloud-infrastructure
