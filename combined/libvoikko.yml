history:
  adoption-history:
    - >
      Voikko became important in Finnish Linux and office-document workflows because it
      served OpenOffice and LibreOffice users with native-quality Finnish spell
      checking, hyphenation, and grammar checking. The architecture page also documents
      Enchant integration and tmispell-voikko, giving applications paths to use Voikko
      without speaking its native API directly.
    - >
      By 2019 libvoikko 4.3 added API support for listing analysis attribute values,
      explicitly calling out vectorizers for machine-learning applications. The project
      homepage describes later use in search expansion and improving machine-learning
      accuracy for Finnish texts.
  package-nerd-significance:
    - >
      libvoikko is a classic language-package outlier: it is not merely a dictionary
      file but a native morphology engine with evolving dictionary formats, finite-state
      transducers, office-suite integration, and distro packaging concerns. Its history
      explains why Finnish language support often needs a specialized package rather
      than a generic Hunspell word list.
  project-history:
    - >
      The Voikko architecture page describes a layered project: libvoikko provides
      high-level algorithms, voikko-fi supplies Finnish morphology, libreoffice-voikko
      integrates with LibreOffice, and related plugins connect Voikko to spell-checking
      front ends. The project site says Voikko was originally developed as a spell
      checker for OpenOffice and LibreOffice.
    - >
      Voikko's own VFST transition document dates the first libvoikko 1.0 and
      Suomi-malaga 0.7.1 release to August 2006, supporting Finnish spell checking and
      hyphenation. Grammar checking arrived during 2008 with libvoikko 2.0, and
      dictionary-format changes in 2009 added support for morphological analysis.
    - >
      The project started in late 2005 as Hunspell-fi, but the maintainers moved toward
      Suomi-malaga and later finite-state technology because Finnish compounds, suffix
      chains, memory behavior, and grammar/hyphenation needs exceeded what plain
      Hunspell dictionaries handled comfortably.
  related-projects:
    - >
      Voikko is tied to voikko-fi, Suomi-malaga, libreoffice-voikko, Enchant,
      tmispell-voikko, hfst-ospell, Foma, VFST tooling, Joukahainen vocabulary
      maintenance, and office suites that need Finnish language services.
  sources:
    - https://github.com/voikko/corevoikko
    - https://voikko.puimula.org/
    - https://voikko.puimula.org/architecture.html
    - https://voikko.puimula.org/releases.html
    - https://voikko.puimula.org/vfst-transition.html
  summary:
    - >
      libvoikko is the core library in the Voikko stack, a Finnish-focused suite for
      morphological analysis, spell checking, grammar checking, hyphenation, and related
      linguistic data. It began as office-suite spell-checking infrastructure and grew
      into a reusable language-processing library used by desktop tools, search
      expansion, and machine-learning pipelines that process Finnish text.
  timeline:
    - '2005: The work begins under the Hunspell-fi name.'
    - >
      2006-08: libvoikko 1.0 and Suomi-malaga 0.7.1 are released for Finnish spell
      checking and hyphenation.
    - '2008: libvoikko 2.0 introduces grammar checking.'
    - '2009: libvoikko 2.2 adds dictionary-format changes for morphological analysis.'
    - '2012: The Finnish morphology rewrite in VFST format begins.'
    - >
      2015-12-14: libvoikko 4.0 and voikko-fi 2.0 make Finnish VFST dictionary format
      stable and production-ready.
    - '2018-10-17: libvoikko 4.2 removes Malaga dictionary-format support.'
    - '2019-10-22: libvoikko 4.3 adds APIs useful for machine-learning vectorizers.'
    - >
      2025-05-23: libvoikko 4.3.3 updates the C++ standard to C++17 and includes build
      and memory-leak fixes.
  usage:
    - >
      Homebrew users get command-line tools such as voikkospell, voikkohyphenate,
      voikkogc, and voikkovfstc. Developers use libvoikko through C, Java, Python,
      JavaScript, and other bindings to add Finnish spell checking, hyphenation, grammar
      checking, tokenization, and morphology to applications.
related-packages:
  - id: brew:enchant
    reason: >
      Use Enchant when an application needs one spell-checking API that can select
      Voikko as its Finnish-language provider alongside other backends.
    rel: adjacent_workflow
    sources:
      - https://voikko.puimula.org/architecture.html
      - https://rrthomas.github.io/enchant/
