id: brew:lazyjj
display-name: lazyjj
homepage: https://github.com/Cretezy/lazyjj
repo: https://github.com/Cretezy/lazyjj
docs:
  - https://github.com/Cretezy/lazyjj/tree/main/docs
  - https://github.com/Cretezy/lazyjj#readme
config-file-location:
  linux:
    - ~/.jjconfig.toml
    - $XDG_CONFIG_HOME/jj/config.toml
    - $XDG_CONFIG_HOME/jj/conf.d/*.toml
  macos:
    - ~/.jjconfig.toml
    - $XDG_CONFIG_HOME/jj/config.toml
    - $XDG_CONFIG_HOME/jj/conf.d/*.toml
  windows:
    - '%USERPROFILE%\.jjconfig.toml'
    - '%APPDATA%\jj\config.toml'
    - '%APPDATA%\jj\conf.d\*.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      lazyjj grew with interest in Jujutsu rather than as a standalone source-control
      system. The README documents installation through cargo-binstall, `cargo install`,
      pre-built binaries, Arch Linux, and source builds; Homebrew, Nix, pacman, and
      Winget package metadata in the batch also show it entering package-manager
      channels. GitHub repository metadata recorded 1,150 stars on July 1, 2026.
  package-nerd-significance:
    - >
      lazyjj is significant because Jujutsu deliberately rethinks Git-style workflows,
      and lazyjj packages that newer mental model into a familiar TUI form. It is also a
      Rust/Ratatui counterpart to the Go-based lazygit/lazydocker lineage.
  project-history:
    - >
      The public GitHub repository was created on May 21, 2024, and v0.1.0 was published
      the same day. Releases continued through v0.6.1 on September 10, 2025.
  related-projects:
    - >
      Jujutsu is the underlying VCS and CLI. Ratatui is the Rust terminal-UI library
      used by lazyjj, and lazygit is the cultural comparison point for Git users looking
      for a keyboard-first source-control interface.
  sources:
    - https://api.github.com/repos/Cretezy/lazyjj
    - https://api.github.com/repos/Cretezy/lazyjj/releases
    - https://github.com/Cretezy/lazyjj
    - https://github.com/jj-vcs/jj
    - https://martinvonz.github.io/jj/latest/install-and-setup/
    - https://ratatui.rs
  summary:
    - >
      lazyjj is a Rust and Ratatui terminal UI for Jujutsu, the `jj` version-control
      system. It brings the lazygit style of keyboard navigation to a newer VCS with
      change-based workflows.
  timeline:
    - '2024: Public GitHub repository created'
    - '2024: v0.1.0 release published'
    - '2025: v0.5.0 release published'
    - '2025: v0.6.1 release published'
  usage:
    - >
      The tool runs inside an existing `jj` repository and shells out to the `jj` CLI.
      It provides log, files, bookmarks, command-log, command-box, and configuration
      views for operations such as editing changes, describing changes, abandoning
      changes, setting bookmarks, fetching, pushing, and squashing.
related-packages:
  - id: brew:jj
    reason: >
      Install jj as the underlying Jujutsu command-line system that lazyjj invokes for
      repository operations.
    rel: adjacent_workflow
    sources:
      - https://github.com/Cretezy/lazyjj#setup
      - https://docs.jj-vcs.dev/latest/
  - id: brew:jjui
    reason: >
      Choose Jujutsu UI as an alternative Go-based jj TUI when you prefer its
      revision-tree, operation-log, preview, and Lua configuration workflows.
    rel: alternative
    sources:
      - https://github.com/Cretezy/lazyjj#readme
      - https://github.com/idursun/jjui#readme
category: developer-tools
package-manager:
  brew: lazyjj
  nix: lazyjj
  pacman: lazyjj
  winget: Cretezy.lazyjj
package-manager-url: https://formulae.brew.sh/formula/lazyjj
license: Apache-2.0
tags:
  - cli
  - jj
  - jujutsu
  - rust
  - tui
  - version-control
description: TUI for Jujutsu/jj
executables:
  - lazyjj
provenance:
  formula: lazyjj
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
