id: brew:k3d
display-name: k3d
homepage: https://k3d.io
repo: https://github.com/k3d-io/k3d
docs:
  - https://k3d.io/
  - https://k3d.io/stable
config-file-location: null
credentials-file-location:
  unix:
    - ${KUBECONFIG}
    - ~/.kube/config
    - ~/.k3d/kubeconfig-<cluster-name>.yaml
history:
  adoption-history:
    - >
      k3d became popular with developers who wanted a real Kubernetes API locally
      without a virtual machine-heavy setup. It sits alongside kind and minikube, but
      its k3s base gives it a particularly small and quick profile.
    - >
      The official k3s documentation lists k3d as a way to run k3s in Docker, which
      helped legitimize the tool for local development even though k3d's own README
      notes it is community-driven and not an official Rancher or SUSE product.
  package-nerd-significance:
    - >
      k3d is package-manager candy: one small CLI that summons an entire Kubernetes
      cluster by orchestrating Docker containers. It shows why local-cluster tools
      became standard developer dependencies once Kubernetes moved from production-only
      infrastructure into everyday application development.
  project-history:
    - >
      The k3d project traces its lineage to `zeerorg/k3s-in-docker`, was reimplemented
      in Go by Thorsten Klein, and was later adopted into Rancher before moving under
      the community-led k3d-io organization.
    - >
      Public releases began in April 2019, shortly after k3s itself made lightweight
      Kubernetes a popular target for local and edge experimentation. The v0.3.0 release
      was described as the first release in Rancher space, and the v1.0.0 release
      followed later that month.
    - >
      The project later went through larger rewrites and major-version lines, including
      the v3 and v5 eras, while keeping the same basic promise: create and destroy
      containerized k3s clusters quickly from a single CLI.
  related-projects:
    - >
      k3d is built around k3s and Docker. It is commonly compared with kind and
      minikube, and it belongs to the broader family of local Kubernetes cluster tools.
  sources:
    - https://docs.k3s.io/advanced
    - https://github.com/k3d-io/k3d
    - https://github.com/k3d-io/k3d/discussions/1365
    - https://github.com/k3d-io/k3d/releases/tag/v0.0.1
    - https://github.com/k3d-io/k3d/releases/tag/v0.3.0
    - https://github.com/orgs/k3d-io/packages/container/package/k3d
    - https://k3d.io/
  summary:
    - >
      k3d is a lightweight wrapper for running k3s Kubernetes clusters inside Docker
      containers, aimed at fast local development, testing, and CI workflows.
  timeline:
    - '2019: k3d v0.0.1 was released in April as a k3s-in-Docker helper.'
    - '2019: v0.3.0 was described as the first release in Rancher space.'
    - '2019: v1.0.0 was released later in April.'
    - '2020: v3 releases reflected a major rewrite and expanded cluster-management surface.'
    - '2022: v5.4.0 moved k3d images to GitHub Container Registry.'
  usage:
    - >
      Users commonly run `k3d cluster create` to start a local k3s cluster in Docker,
      then use kubeconfig output with kubectl and other Kubernetes tools. It is often
      used in CI jobs, demos, local operator development, and quick reproduction
      environments.
related-packages:
  - id: brew:kind
    reason: >
      Choose kind when Kubernetes conformance and upstream Kubernetes testing are the
      priority; choose k3d for lightweight local clusters based on k3s.
    rel: alternative
    sources:
      - https://k3d.io/
      - https://kind.sigs.k8s.io/docs/user/quick-start/
  - id: brew:minikube
    reason: >
      Minikube is an alternative local Kubernetes environment with VM and
      container-driver choices plus built-in addons, while k3d specializes in
      containerized k3s clusters.
    rel: alternative
    sources:
      - https://k3d.io/
      - https://minikube.sigs.k8s.io/docs/start/
      - https://minikube.sigs.k8s.io/docs/drivers/
  - id: brew:kubernetes-cli
    reason: >
      k3d writes or updates kubeconfig so kubectl can immediately manage the local
      cluster, making the Kubernetes CLI its standard downstream companion.
    rel: adjacent_workflow
    sources:
      - https://k3d.io/stable/usage/kubeconfig/
      - https://kubernetes.io/docs/reference/kubectl/
category: cloud-infrastructure
package-manager:
  brew: k3d
  chocolatey: k3d
  macports: k3d
  nix: k3d
  scoop: main/k3d
  winget: k3d.k3d
package-manager-url: https://formulae.brew.sh/formula/k3d
license: MIT
tags:
  - cli
  - docker
  - k3s
  - kubernetes
  - local-cluster
description: Little helper to run CNCF's k3s in Docker
executables:
  - k3d
provenance:
  formula: k3d
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
