id: brew:dvdrtools
display-name: dvdrtools
homepage: https://savannah.nongnu.org/projects/dvdrtools/
repo: https://savannah.nongnu.org/cvs?group=dvdrtools
docs:
  - https://savannah.nongnu.org/projects/dvdrtools
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dvdrtools belongs to the early-2000s optical-disc tooling period, when Unix
      package collections carried cdrtools-derived commands for CD and DVD writers. The
      input metadata lists Homebrew and MacPorts packages, reflecting a small but
      persistent packaging footprint for users who still need the dvdrecord command.
  package-nerd-significance:
    - >
      dvdrtools is package-nerd interesting less for active development than for
      lineage. It preserves a narrow fork in the optical-disc stack, where naming,
      licensing, and device-support differences among cdrtools-like projects mattered to
      Unix distributions and ports trees.
  project-history:
    - >
      The project was registered on Savannah on 28 January 2002 as non-GNU software.
      Savannah lists it as production/stable and identifies it as a fork of
      cdrtools/cdrecord with support for writing DVDs.
    - >
      The visible release history is sparse. Savannah's project news records dvdrtools
      0.2.0 in February 2005, with native IDE writing support under Linux 2.6.x called
      out as the primary new feature.
  related-projects:
    - cdrtools and cdrecord are the upstream lineage named by the Savannah project summary.
    - >
      DVD and CD burning tools such as wodim/cdrkit are adjacent package-manager-era
      alternatives in the same general command-line optical-disc space.
  sources:
    - https://savannah.nongnu.org/projects/dvdrtools
    - https://savannah.nongnu.org/news/?group=dvdrtools
  summary:
    - >
      dvdrtools is a small fork of the cdrtools/cdrecord lineage focused on DVD writing
      support. Its Savannah project page describes the package as providing DVD-writing
      support, primarily for data DVDs, with basic video DVD mastering support.
  timeline:
    - '2002: dvdrtools is registered on Savannah.'
    - '2005: dvdrtools 0.2.0 is announced with Linux 2.6 native IDE writing support.'
  usage:
    - >
      The packaged executable is dvdrecord, a command-line tool in the cdrecord
      tradition for writing optical media. Its package-manager significance is mostly
      compatibility: scripts and habits built around cdrtools-style disc-burning
      commands could continue to find a DVD-oriented implementation.
related-packages:
  - id: brew:cdrtools
    reason: >
      Choose cdrtools for the maintained upstream lineage and a broader CD, DVD, and
      Blu-ray premastering and recording toolkit; choose dvdrtools when compatibility
      with its dvdrecord fork is specifically required.
    rel: alternative
    sources:
      - https://savannah.nongnu.org/projects/dvdrtools
      - https://cdrtools.sourceforge.net/private/cdrecord.html
category: media
package-manager:
  brew: dvdrtools
  macports: dvdrtools
