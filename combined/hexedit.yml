id: brew:hexedit
display-name: hexedit
homepage: https://rigaux.org/hexedit.html
repo: https://github.com/pixel/hexedit
docs:
  - https://rigaux.org/hexedit.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      hexedit's adoption comes from being a small, traditional Unix terminal utility
      with a manpage, curses-style interaction, and no service dependencies. The input
      package metadata records packages across Homebrew, Debian, Fedora/dnf, MacPorts,
      Nix, pacman, Ubuntu, zypper, and apk, and the Homebrew formula packages the 1.6
      GitHub tag archive.
  package-nerd-significance:
    - >
      hexedit is a classic package-index resident: old enough to have 1990s portability
      notes, small enough to remain easy to build, and useful enough that many Unix-like
      package managers keep it available. It represents the interactive editor branch of
      hex tooling, complementing dumpers such as hexdump, od, xxd, hx, and hexd.
  project-history:
    - >
      The upstream Changes file starts in July 1998 and records a burst of development
      toward a practical full-screen editor: bold display for modified bytes, selection,
      copy and paste, backward search, saving selected regions, modeline behavior,
      opening additional files, undo behavior, and safer error handling. Version 1.0.0
      was released in September 1998.
    - >
      The project continued with portability and terminal fixes through the 2000s,
      including 64-bit file offsets, Digital UNIX and Solaris build fixes, safer input
      handling, color support, and device-size handling. The GitHub repository, created
      in 2008, became the visible source-control home for later maintenance.
  related-projects:
    - >
      hexedit is related to other interactive terminal hex editors such as Hexcurse and
      to byte dump tools such as hexdump, od, xxd, hx, hexd, and hevi. Its manual notes
      an Emacs-like modeline and key vocabulary, reflecting its terminal-editor
      heritage.
  sources:
    - https://formulae.brew.sh/formula/hexedit
    - https://github.com/pixel/hexedit
    - https://raw.githubusercontent.com/pixel/hexedit/master/Changes
    - https://rigaux.org/hexedit.html
  summary:
    - >
      hexedit is a long-lived terminal hex editor for viewing and modifying files in
      hexadecimal and ASCII.
  timeline:
    - >
      1998-07: Changes file begins; modified-byte display, selection, copy/paste,
      backward search, and install support are added.
    - '1998-09: 1.0.0 release recorded.'
    - '2001: 1.2.1 switches toward 64-bit file offsets and configure cleanup.'
    - >
      2005: 1.2.11 and 1.2.12 add color build support and color display defaults where
      supported.
    - '2008: GitHub repository created.'
    - '2017: 1.4 series adds terminal resizing support and build fixes.'
    - >
      2020: 1.5 fixes long-string search, 32-bit off_t handling, resize handling, and
      copy/paste behavior.
    - >
      2022: 1.6 updates configure behavior, ncurses signal handling, allocation checks,
      leak handling, and empty-file behavior.
  usage:
    - >
      hexedit shows the same file in ASCII and hexadecimal and can edit regular files or
      devices by reading pieces at a time. Its man page documents sector formatting,
      display maximization, explicit line lengths, color output, movement keys, search,
      mark/copy/paste, fill, truncation, save, open, and quit commands.
related-packages:
  - id: brew:hexcurse
    reason: >
      Choose Hexcurse for an ncurses interface with EBCDIC display and configurable byte
      width; choose hexedit for device-aware editing, selection, fill, truncation, and
      an Emacs-influenced key vocabulary.
    rel: alternative
    sources:
      - https://rigaux.org/hexedit.html
      - https://github.com/LonnyGomes/hexcurse#readme
  - id: brew:bvi
    reason: >
      Choose bvi when vi-style modal editing, Ex commands, and .bvirc startup
      configuration are preferable to hexedit's function-key and Emacs-influenced
      controls.
    rel: alternative
    sources:
      - https://rigaux.org/hexedit.html
      - https://bvi.sourceforge.net/overview.php
      - https://bvi.sourceforge.net/man_bvi.html
  - id: brew:ghex
    reason: >
      Choose GHex for a GNOME graphical interface and reusable GTK hex widget; choose
      hexedit for terminal-only operation and direct device access.
    rel: alternative
    sources:
      - https://rigaux.org/hexedit.html
      - https://help.gnome.org/users/ghex/stable/ghex-intro.html
