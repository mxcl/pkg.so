id: brew:git-hound
display-name: git-hound
homepage: https://github.com/ezekg/git-hound
repo: https://github.com/ezekg/git-hound
docs:
  - https://github.com/ezekg/git-hound#readme
config-file-location:
  unix: .githound.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      git-hound fits the mid-2010s rise of local secret-scanning tools, when teams began
      adding pre-commit checks for passwords, database settings, tokens, and
      machine-specific paths. Its adoption stayed niche compared with larger scanners,
      but the repository attracted several hundred stars and was packaged for Homebrew
      and Nix.
  package-nerd-significance:
    - >
      The package is interesting because it exposes Git's plugin naming convention:
      installing `git-hound` makes `git hound` available. It is also a compact example
      of pre-commit security tooling before secret scanning became a standard
      hosted-platform feature.
  project-history:
    - >
      The repository was created in November 2015 as a Go command-line plugin. Its
      README presents Hound as a small Git extension with precompiled release binaries,
      Go installation, and Homebrew installation paths.
  related-projects:
    - >
      git-hound is related to Git hooks, pre-commit frameworks, and secret scanners such
      as git-secrets and truffleHog, all of which try to catch sensitive strings before
      or after they enter Git history.
  sources:
    - https://api.github.com/repos/ezekg/git-hound/releases
    - https://github.com/ezekg/git-hound
    - https://raw.githubusercontent.com/ezekg/git-hound/master/README.md
  summary:
    - >
      git-hound is a Git plugin for preventing sensitive data from entering commits. It
      checks staged diffs against user-provided PCRE regular expressions before commit
      operations proceed.
  timeline:
    - '2015: GitHub repository created for the Go implementation.'
    - '2016: Several 0.5.x releases publish packaged binaries.'
    - '2017: 0.6.x releases continue the pre-1.0 line.'
    - '2020: 1.0.0 release published.'
  usage:
    - >
      Practitioners run `git hound commit` to sniff staged changes before invoking `git
      commit`, or `git hound sniff` to scan a commit, a manual diff, a whole codebase,
      or repository history. The `.githound.yml` file separates warning patterns,
      failure patterns, and skipped filenames.
related-packages:
  - id: brew:git-secrets
    reason: >
      Choose git-secrets when you want installed pre-commit, commit-msg, and
      prepare-commit-msg hooks plus built-in AWS credential registration; Git Hound
      instead applies a small repository-local PCRE rule set through its own commit
      wrapper.
    rel: alternative
    sources:
      - https://github.com/ezekg/git-hound#readme
      - https://github.com/awslabs/git-secrets#readme
  - id: brew:gitleaks
    reason: >
      Choose Gitleaks for maintained built-in detection rules, repository and directory
      scanning, structured reports, CI use, and documented pre-commit integration; Git
      Hound is a narrower regex-driven Git plugin.
    rel: alternative
    sources:
      - https://github.com/ezekg/git-hound#readme
      - https://github.com/gitleaks/gitleaks#readme
category: security
package-manager:
  brew: git-hound
  nix: git-hound
package-manager-url: https://formulae.brew.sh/formula/git-hound
license: MIT
tags:
  - cli
  - git
  - pre-commit
  - secret-scanning
  - security
description: Git plugin that prevents sensitive data from being committed
executables:
  - git-hound
provenance:
  formula: git-hound
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
