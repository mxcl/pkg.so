id: brew:ast-grep
display-name: ast-grep
homepage: https://ast-grep.github.io/
repo: https://github.com/ast-grep/ast-grep
docs:
  - https://ast-grep.github.io/
  - https://ast-grep.github.io/guide/project/project-config.html
  - https://ast-grep.github.io/reference/sgconfig.html
config-file-location:
  unix:
    - ./sgconfig.yml
    - ~/sgconfig.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      ast-grep was packaged early across developer ecosystems rather than through a
      single language channel. The official README lists npm, pip, cargo,
      cargo-binstall, Homebrew, Scoop, mise, MacPorts, Nix shell, and source builds,
      while the supplied package facts add Alpine, Arch, winget, zypper, and Nix
      availability.
    - >
      The tool gained attention because it serves several audiences with one binary:
      maintainers doing codemods for breaking changes, teams enforcing project-specific
      static rules, and security researchers writing structural queries faster than full
      compiler plugins.
  package-nerd-significance:
    - >
      ast-grep is significant because it occupies the middle ground between grep,
      semgrep-style structural search, ESLint-style linting, and codemod frameworks.
      Package maintainers care because it ships as a native Rust CLI but is distributed
      through npm, pip, cargo, Homebrew, and OS package managers, which makes binary
      packaging, completions, and config discovery part of the user experience.
  project-history:
    - >
      The ast-grep repository was created in 2022 and the official docs carry a
      2022-present copyright. The README presents the tool as ast-grep or sg, with a
      core algorithm that searches and rewrites code using tree-sitter-produced ASTs.
    - >
      The project expanded beyond one-off search into project configuration, YAML lint
      rules, transformations, rewriters, custom languages, language injections, editor
      integrations, JavaScript and Python APIs, and a browser playground. The official
      sgconfig documentation positions sgconfig.yml as the root configuration file for
      multi-rule scans, similar in role to tsconfig.json or ESLint configuration.
  related-projects:
    - tree-sitter supplies the parsing foundation for ast-grep's AST matching.
    - ESLint and tsconfig.json are referenced by the docs as familiar configuration analogies.
    - >
      semgrep, codemod tools, ripgrep/grep, and language-specific linters occupy
      adjacent search, rewrite, and policy-enforcement space, though the official
      sources emphasize ast-grep's code-pattern syntax and tree-sitter core.
  sources:
    - https://api.github.com/repos/ast-grep/ast-grep
    - https://ast-grep.github.io/guide/project/project-config.html
    - https://ast-grep.github.io/reference/sgconfig.html
    - https://github.com/ast-grep/ast-grep#readme
    - source_facts.package-manager
  summary:
    - >
      ast-grep is a Rust command-line tool for structural code search, linting, and
      rewriting. It combines a grep-like user experience with tree-sitter-backed
      abstract syntax tree matching, so patterns are written as code snippets rather
      than as only text regular expressions.
  timeline:
    - '2022: ast-grep/ast-grep repository created on GitHub.'
    - '2022-present: Official docs copyright period begins.'
    - >
      2020s: README documents installation via npm, pip, cargo, Homebrew, Scoop, mise,
      MacPorts, Nix shell, and source builds.
    - >
      2026: GitHub metadata showed active development and a large star/fork footprint
      for a developer-tool CLI.
  usage:
    - >
      The simplest usage is a command such as ast-grep --pattern ... --rewrite ...
      --lang ts. Larger projects add sgconfig.yml at the project root, define ruleDirs,
      and run scan; ast-grep discovers sgconfig.yml by walking up from the working
      directory, and can also use a home-directory sgconfig.yml for global
      configuration.
related-packages:
  - id: brew:semgrep
    reason: >
      Choose Semgrep when security-focused rules, deeper semantic analysis, or its
      established rule collection matter more than ast-grep's fast syntactic rewriting
      and embeddable-library model.
    rel: alternative
    sources:
      - https://ast-grep.github.io/advanced/tool-comparison
      - https://semgrep.dev/docs/
  - id: brew:tree-sitter-cli
    reason: >
      Use tree-sitter-cli when developing or testing the parsers and grammars that
      underpin syntax-aware tooling; ast-grep consumes tree-sitter parsers and can
      dynamically load custom languages.
    rel: adjacent_workflow
    sources:
      - https://ast-grep.github.io/advanced/core-concepts.html
      - https://tree-sitter.github.io/tree-sitter/
category: developer-tools
package-manager:
  apk: ast-grep
  brew: ast-grep
  macports: ast-grep
  nix: ast-grep
  pacman: ast-grep
  scoop: main/ast-grep
  winget: ast-grep.ast-grep
  zypper: ast-grep
package-manager-url: https://formulae.brew.sh/formula/ast-grep
license: MIT
tags:
  - ast
  - cli
  - code-search
  - linting
  - multi-language
  - rewriting
description: Code searching, linting, rewriting
executables:
  - ast-grep
  - sg
provenance:
  formula: ast-grep
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
