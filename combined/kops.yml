id: brew:kops
display-name: kOps
homepage: https://kops.sigs.k8s.io/
repo: https://github.com/kubernetes/kops
docs:
  - https://kops.sigs.k8s.io/
config-file-location:
  unix: '{state store}/config'
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      kOps became important because it filled a gap before managed Kubernetes offerings
      covered every common operational need. Its official support matrix grew around
      cloud targets including AWS and GCP, with additional providers such as
      DigitalOcean, Hetzner, OpenStack, and Azure documented at different support
      levels.
    - >
      GitHub repository metadata observed on 2026-07-01 reported 16,632 stars and 4,710
      forks, unusually high for an infrastructure lifecycle CLI. Its presence in
      Homebrew, MacPorts, Nix, and Scoop reflects a user base split across workstation
      operators and automation hosts.
  package-nerd-significance:
    - >
      kOps is a classic Homebrew infrastructure formula: a single statically distributed
      CLI that hides a lot of distributed-systems machinery behind repeatable commands.
    - >
      It also marks an era of Kubernetes packaging before every cloud had a polished
      managed-cluster console. Package indexes that carried kOps made serious Kubernetes
      cluster creation available from a developer laptop with one install command.
  project-history:
    - >
      The kOps repository was created under the Kubernetes GitHub organization on
      2016-06-27, during the period when Kubernetes operators were still building
      practical tooling around cluster creation and upgrades. The README describes kOps
      as `kubectl` for clusters, reflecting its role as a higher-level administrative
      CLI rather than an application deployment tool.
    - >
      Early release metadata shows v1.4.0-alpha.1 on 2016-09-08, with 1.4-era releases
      following in late 2016. The project then tracked Kubernetes minor versions closely
      enough that official docs describe a release cadence tied to Kubernetes releases,
      typically about a month later, after Kubernetes issues from a new version have had
      time to settle.
  related-projects:
    - >
      kOps is closely related to Kubernetes, kubectl, cloud provider CLIs, Terraform and
      CloudFormation workflows, and managed Kubernetes services.
    - >
      Within Kubernetes tooling culture, it sits beside kubeadm, Cluster API, eksctl,
      and cloud-specific cluster provisioning tools.
  sources:
    - https://api.github.com/repos/kubernetes/kops
    - https://api.github.com/repos/kubernetes/kops/releases
    - https://github.com/kubernetes/kops
    - https://kops.sigs.k8s.io/
    - https://kops.sigs.k8s.io/welcome/releases/
  summary:
    - >
      kOps, short for Kubernetes Operations, is one of the long-running Kubernetes
      cluster lifecycle tools. It is best known as a command-line way to create,
      upgrade, and maintain production-grade Kubernetes clusters while also provisioning
      the needed cloud infrastructure.
  timeline:
    - '2016-06-27: GitHub repository created under kubernetes/kops.'
    - '2016-09-08: v1.4.0-alpha.1 appears in GitHub release metadata.'
    - '2016-12-21: v1.4.4 release published.'
    - >
      2026-07-01: GitHub repository metadata reported more than 16,000 stars and more
      than 4,700 forks.
  usage:
    - >
      kOps is commonly used to create cluster specifications, store cluster state,
      provision cloud infrastructure, and perform Kubernetes upgrades. It also writes or
      relies on kubeconfig credentials, so package users tend to pair it with `kubectl`
      and cloud provider credentials.
    - >
      For package-manager users, the value is that installing one CLI gives access to a
      whole cluster lifecycle workflow rather than only a client for an already-existing
      control plane.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kOps creates and exports kubeconfig entries for kubectl, which operators then use
      to manage workloads and resources inside the resulting cluster.
    rel: adjacent_workflow
    sources:
      - https://kops.sigs.k8s.io/getting_started/kubectl/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:eksctl
    reason: >
      Choose eksctl for an Amazon EKS-specific cluster lifecycle, while kOps is suited
      to provisioning Kubernetes and its infrastructure across the cloud providers kOps
      supports.
    rel: alternative
    sources:
      - https://kops.sigs.k8s.io/
      - https://eksctl.io/
category: cloud-infrastructure
package-manager:
  brew: kops
  macports: kops
  nix: kops
  scoop: main/kops
package-manager-url: https://formulae.brew.sh/formula/kops
license: Apache-2.0
tags:
  - cli
  - cloud-infrastructure
  - cluster-management
  - kubernetes
  - operations
description: Production Grade K8s Installation, Upgrades, and Management
executables:
  - kops
provenance:
  formula: kops
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
