id: brew:eg
display-name: eg
homepage: https://github.com/davep/eg
repo: https://github.com/davep/eg
docs:
  - https://github.com/davep/eg#readme
config-file-location:
  unix: ~/.egrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is niche because Norton Guide files are a legacy documentation format.
      Its Homebrew formula keeps a small terminal reader available for users who still
      have old guides or want a Unix-like way to inspect them.
  package-nerd-significance:
    - >
      This eg is package-nerd-significant mostly as preservation tooling. It keeps a
      DOS-era documentation reader pattern available in Unix package managers and also
      creates the naming collision that makes srsudar/eg ship in Homebrew as
      eg-examples.
  project-history:
    - >
      The upstream README describes Expert Guide as a Norton Guide reader developed on
      and for Linux, with possible portability to DOS via DJGPP and other Unix-like
      systems with the S-Lang library. The GitHub repository was created in 2015, but
      the Changes file records much earlier 0.00 through 0.05-era development history.
  related-projects:
    - >
      Related projects include Norton Guide, Expert Help, DJGPP, S-Lang, and the
      unrelated srsudar/eg command-example browser.
  sources:
    - https://github.com/davep/eg
    - https://raw.githubusercontent.com/davep/eg/master/README
    - https://raw.githubusercontent.com/davep/eg/master/Changes
    - https://api.github.com/repos/davep/eg
  summary:
    - eg, short for Expert Guide, is a console Norton Guide reader for GNU/Linux and macOS.
  timeline:
    - 'Pre-2015: Changes file records 0.00 through 0.05 development.'
    - '2015: Public GitHub repository created.'
    - '2015: README footnote records macOS support as of December 2015.'
    - '2017: Repository last pushed according to GitHub metadata.'
  usage:
    - >
      Users build with make, install with make install, and read the included man page
      for basic usage. The README notes that anyone familiar with Norton Guide or Expert
      Help should understand the interface quickly.
    - >
      The Changes file documents features typical of an interactive terminal reader:
      remembered last guide location, menus, search, regular expression search,
      save-to-file, guide directory scanning, config reading from ~/.egrc,
      suspend/resume, and repeated search.
related-packages: []
category: productivity
package-manager:
  brew: eg
  dnf: eg
package-manager-url: https://formulae.brew.sh/formula/eg
license: GPL-2.0-or-later
tags:
  - cli
  - norton-guide
  - reader
  - reference
  - terminal
description: Expert Guide. Norton Guide Reader For GNU/Linux
executables:
  - eg
provenance:
  formula: eg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
