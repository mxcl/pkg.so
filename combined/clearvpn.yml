history:
  adoption-history:
    - >
      ClearVPN launched in free and premium editions across macOS, Windows, Android, and
      iOS. During 2022 MacPaw restored a free tier and offered access to qualifying
      nonprofits, activists, and journalists working on the Russian invasion of Ukraine
      and internet censorship. The service subsequently expanded to iPadOS in 2024 and
      remains free for Ukrainians through Diia authentication.
  package-nerd-significance:
    - >
      ClearVPN is of interest in package catalogs as a commercial, cross-platform VPN
      from the Ukrainian Mac software vendor MacPaw. Its emphasis on goal-oriented
      shortcuts and later one-tap operation distinguishes it from traditional
      server-list-first VPN clients.
  project-history:
    - >
      MacPaw launched ClearVPN on November 17, 2020, presenting DynamicFlow technology
      and task-oriented shortcuts as a simpler approach to selecting VPN routes.
      ClearVPN 2 arrived in March 2023 with a redesigned, more direct connection
      experience; another major interface redesign followed in 2024.
  related-projects:
    - >
      ClearVPN is developed by MacPaw, the company behind CleanMyMac and Setapp. MacPaw
      also operates the Moonlock cybersecurity division.
  sources:
    - 'Official ClearVPN news archive: https://clearvpn.com/blog/category/news/'
    - 'Official iPadOS announcement: https://macpaw.com/news/clearvpn-for-ipad-release'
    - 'Official launch announcement: https://macpaw.com/news/new-vpn-app-clearvpn'
    - 'Official support center: https://support.clearvpn.com/hc/en-us'
    - >
      Official wartime program article:
      https://clearvpn.com/blog/what-is-clearvpn-doing-for-the-ukrainian-victory/
  summary:
    - >
      ClearVPN is a proprietary cross-platform VPN service launched by MacPaw in 2020,
      designed around simple, task-oriented or one-tap private connections.
  timeline:
    - '2020-11: MacPaw launched ClearVPN'
    - >
      2022-05: A free tier returned and access programs for NGOs and journalists were
      announced
    - '2023-03: ClearVPN 2 was released'
    - '2024-03: A redesigned one-button ClearVPN experience was introduced'
    - '2024-08: ClearVPN expanded to iPadOS'
  usage:
    - >
      Users sign in, choose or initiate a private connection, and use ClearVPN for
      encrypted browsing, streaming, remote work, gaming, or access across supported
      networks. Account and subscription details are managed in the app's Settings area
      or through the web profile.
