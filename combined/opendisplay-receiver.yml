history:
  adoption-history:
    - >
      The project distributes separate sender and receiver applications for Mac, plus an
      iOS/iPadOS receiver. The published wire protocol has also enabled unofficial
      receivers and non-Mac senders.
  package-nerd-significance:
    - >
      OpenDisplay provides a free, auditable alternative in a category dominated by
      Apple's hardware-restricted Sidecar and commercial products. Its explicit protocol
      specification is particularly useful to package and interoperability enthusiasts.
  project-history:
    - >
      OpenDisplay began as an open-source effort to turn Apple mobile devices into true
      extended displays for a Mac without requiring a subscription, account, or hardware
      dongle. It later added a dedicated macOS receiver so a spare Mac could serve as
      the display.
  related-projects:
    - >
      OpenDisplay Sender and OpenDisplay Receiver are two applications from the same
      project. The sender captures a virtual display and streams it; the receiver
      presents that stream on the destination Mac.
  sources:
    - https://github.com/peetzweg/opendisplay
    - https://github.com/peetzweg/opendisplay/blob/main/PROTOCOL.md
    - https://opendisplay.app/
  summary:
    - >
      OpenDisplay Receiver turns a Mac into an additional display for another Mac
      running OpenDisplay Sender, using the project's direct USB or local-network
      streaming protocol.
  timeline:
    - >
      2026: The project published a normative specification for its sender-receiver wire
      protocol.
    - '2026: The release line included dedicated support for using a spare Mac as a receiver.'
  usage:
    - >
      Install OpenDisplay Sender on the Mac whose desktop will be extended and
      OpenDisplay Receiver on the spare Mac. Connect over the local network or a direct
      cable, then select the receiver from the sender.
related-packages:
  - id: cask:opendisplay
    reason: >
      OpenDisplay Sender is the required companion on the source Mac; it captures the
      virtual display and streams it to OpenDisplay Receiver.
    rel: adjacent_workflow
    sources:
      - https://opendisplay.app/
      - https://github.com/peetzweg/opendisplay
