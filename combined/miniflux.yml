id: brew:miniflux
display-name: Miniflux
homepage: https://miniflux.app
repo: https://github.com/miniflux/v2
docs:
  - https://miniflux.app/docs
  - https://miniflux.app/docs/api.html
  - https://miniflux.app/docs/installation.html
config-file-location:
  linux: /etc/miniflux.conf
credentials-file-location: null
history:
  project-history:
    - >
      The second-generation Miniflux codebase is written in Go, uses PostgreSQL as its
      database, avoids ORMs and large frameworks, and ships as a statically compiled
      binary. Its documentation and man page show both application-server and
      maintenance workflows: operators configure it with a config file or environment
      variables, run migrations, create admin users, refresh feeds, clean sessions,
      archive entries, export OPML, and monitor health endpoints.
  sources:
    - https://formulae.brew.sh/formula/miniflux
    - https://github.com/miniflux/v2
    - https://miniflux.app/
    - https://miniflux.app/docs/api.html
    - https://miniflux.app/miniflux.1.html
    - https://pkg.go.dev/miniflux.app
  summary:
    - >
      Miniflux is a self-hosted feed reader developed by Frédéric Guillot with
      contributions from its community. The project presents itself as minimalist and
      opinionated: a small web application for RSS and Atom reading that chooses
      readability, keyboard-driven navigation, privacy, and a limited feature set over
      the larger social or magazine-style surfaces common in hosted readers.
  usage:
    - >
      Its adoption niche is the self-hosted RSS community: people who want an
      independent reader after the decline of large centralized feed-reader services,
      but who also want a packaged daemon rather than a PHP or multi-service stack. The
      REST API, OPML import/export, integrations, Docker image, Debian/RPM-style
      packages, and paid hosted instance give it a foot in both personal server
      administration and small hosted-service operation.
related-packages:
  - id: brew:newsboat
    reason: >
      Newsboat can synchronize directly with a Miniflux installation, providing a
      terminal interface while Miniflux remains the server and shared source of
      subscriptions, categories, reading state, and starred entries.
    rel: adjacent_workflow
    sources:
      - https://miniflux.app/docs/apps.html
      - https://www.newsboat.org/releases/2.45/docs/newsboat.html
category: productivity
package-manager:
  apk: miniflux
  brew: miniflux
  debian: miniflux
  macports: miniflux
  nix: miniflux
  pacman: miniflux
  ubuntu: miniflux
package-manager-url: https://formulae.brew.sh/formula/miniflux
license: Apache-2.0
tags:
  - atom
  - cli
  - feed-reader
  - rss
  - self-hosted
  - web-app
description: Minimalist and opinionated feed reader
executables:
  - miniflux
provenance:
  formula: miniflux
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
