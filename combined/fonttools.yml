id: brew:fonttools
display-name: fontTools
homepage: https://github.com/fonttools/fonttools
repo: https://github.com/fonttools/fonttools
docs:
  - https://fonttools.readthedocs.io/en/latest
  - https://github.com/fonttools/fonttools
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      fontTools became a core Python package in font production because it exposes both
      library APIs and command-line tools. The docs list utilities such as `ttx`,
      `pyftsubset`, `pyftmerge`, and the `fonttools` meta-tool, plus modules for
      OpenType Layout, UFO, variable fonts, color fonts, subsetting, feature files, and
      more.
    - >
      The release tags show early `FontTools-1.0` and `FontTools-2.x` names alongside a
      long-running 4.x series. The README documents pip installation and optional
      extras, matching its role as both a developer dependency and a command-line
      package.
  package-nerd-significance:
    - >
      fontTools is package-nerd significant because it is the standard Swiss-army knife
      of Python font engineering. It shows up in build systems, webfont pipelines,
      variable-font workflows, distro QA, and one-off debugging because it can inspect,
      mutate, subset, merge, and serialize complex font formats from scripts.
  project-history:
    - >
      The official developer documentation says fontTools was started by Just van Rossum
      in 1999 and maintained as an open-source project on SourceForge. In 2008, Paul
      Wise began helping with stability maintenance. In 2013, Behdad Esfahbod began a
      friendly fork, reviewing the codebase and adding features and support for new font
      formats.
    - >
      The modern README describes fontTools as a Python library for manipulating fonts
      with support for TrueType, OpenType, AFM, some Type 1 and Mac-specific formats,
      and the TTX tool for XML round-tripping. The current documentation presents it as
      a family of libraries and utilities for font engineering.
  related-projects:
    - >
      fontTools is related to TTX, RoboFog-era font tooling, UFO libraries, OpenType
      Layout tooling, AFDKO feature workflows, variable-font build pipelines, and
      downstream tools that use `fontTools.ttLib`.
  sources:
    - https://fonttools.readthedocs.io/en/latest/
    - https://github.com/fonttools/fonttools
    - https://raw.githubusercontent.com/fonttools/fonttools/main/Doc/source/developer.rst
    - https://raw.githubusercontent.com/fonttools/fonttools/main/README.rst
  summary:
    - >
      fontTools is a Python library and command-line toolkit for manipulating fonts,
      best known for TTX, which converts TrueType and OpenType fonts to and from an XML
      representation.
  timeline:
    - '1999: Just van Rossum started fontTools.'
    - '2008: Paul Wise began helping with stability maintenance.'
    - '2013: Behdad Esfahbod began a friendly fork adding new features and format support.'
    - >
      2020s: The 4.x series continued active releases and broad OpenType, variable-font,
      and subsetting work.
    - >
      2026: The NEWS file records 4.63.0 with support for Apple Color Emoji `bgcl` and
      Incremental Font Transfer tables.
  usage:
    - >
      Users install it with `pip install fonttools`, run `ttx` to dump and rebuild
      OpenType or TrueType fonts as XML, run `pyftsubset` to create smaller web or
      application fonts, and import modules such as `fontTools.ttLib` for programmatic
      font editing.
related-packages:
  - id: brew:fontforge
    reason: >
      Choose FontForge when font creation or conversion benefits from an interactive
      visual editor while retaining command-line utilities and scripting support.
    rel: alternative
    sources:
      - https://fonttools.readthedocs.io/en/stable/
      - https://github.com/fontforge/fontforge
category: developer-tools
