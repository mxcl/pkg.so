id: brew:mdbook
display-name: mdBook
homepage: https://rust-lang.github.io/mdBook/
repo: https://github.com/rust-lang/mdBook
docs:
  - https://rust-lang.github.io/mdBook
config-file-location:
  unix: book.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager metadata shows mdBook in Homebrew, Alpine, Debian,
      MacPorts, Nix, Arch, Scoop, winget, and openSUSE. That broad packaging matches its
      use as a documentation build tool rather than only as a Rust crate.
    - >
      Within package-manager culture, mdBook became familiar because it appears in
      source trees and documentation build pipelines: installing `mdbook` is often
      enough to preview or publish a project's manual locally.
  package-nerd-significance:
    - >
      mdBook matters to package maintainers because it turned documentation into a
      reproducible command-line build artifact. Instead of relying on a hosted wiki or a
      JavaScript-heavy documentation system, projects can build a static manual from
      Markdown with one packaged binary.
    - >
      It is also a visible Rust ecosystem tool: it uses Rust's distribution channels and
      is packaged widely enough that documentation builds can depend on the system
      package manager instead of a project-local install step.
  project-history:
    - >
      The official GitHub repository was created on 2015-07-07. mdBook grew in the Rust
      ecosystem as a documentation-oriented command-line tool: books are initialized
      with `mdbook init`, configured with `book.toml`, organized with `src/SUMMARY.md`,
      and rendered or served with commands such as `mdbook build` and `mdbook serve`.
    - >
      The official user guide is itself an mdBook output, so the documentation doubles
      as a demonstration of the generated site format. The repository has continued
      active releases, with the GitHub releases API showing v0.5.3 published on
      2026-05-19.
  related-projects:
    - >
      The repository description explicitly compares mdBook to GitBook while emphasizing
      that mdBook is implemented in Rust.
    - >
      The official guide links the book format to Markdown content, TOML configuration,
      and static HTML publishing.
  sources:
    - https://api.github.com/repos/rust-lang/mdBook
    - https://api.github.com/repos/rust-lang/mdBook/releases?per_page=15
    - https://github.com/rust-lang/mdBook#readme
    - https://rust-lang.github.io/mdBook
    - source_facts.package-manager
  summary:
    - >
      mdBook is the Rust project's Markdown-based static book generator. The upstream
      README describes it as a utility for creating modern online books from Markdown
      files, and the GitHub repository description summarizes it as like GitBook but
      implemented in Rust.
  timeline:
    - '2015-07-07: Official GitHub repository created.'
    - >
      2010s: mdBook established the `book.toml` plus `src/SUMMARY.md` structure
      documented in the official guide.
    - '2026-05-19: GitHub releases API lists v0.5.3 published.'
  usage:
    - >
      A typical workflow is `mdbook init my-first-book`, edit Markdown files under
      `src`, maintain the chapter tree in `src/SUMMARY.md`, and run `mdbook serve
      --open` for live rebuilding and browser refresh. Publishing uses `mdbook build` to
      generate a `book` directory of static HTML.
    - >
      The book configuration file is `book.toml` at the book root. The official guide
      describes it as TOML and shows a minimal `[book]` table with a title.
related-packages:
  - id: brew:oranda
    reason: >
      oranda is an adjacent publishing tool that can autodetect and render an mdBook
      alongside a project landing page, changelog, funding information, and release
      installers.
    rel: adjacent_workflow
    sources:
      - https://rust-lang.github.io/mdBook/continuous-integration.html
      - https://axodotdev.github.io/oranda/book/configuration/reference.html
category: developer-tools
package-manager:
  apk: mdbook
  brew: mdbook
  debian: librust-mdbook-dev
  dnf: mdbook
  macports: mdbook
  nix: mdbook
  pacman: mdbook
  scoop: main/mdbook
  winget: Rustlang.mdBook
  zypper: mdbook
package-manager-url: https://formulae.brew.sh/formula/mdbook
license: MPL-2.0
tags:
  - cli
  - documentation
  - markdown
  - rust
  - static-site-generator
description: Create modern online books from Markdown files
executables:
  - mdbook
provenance:
  formula: mdbook
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
