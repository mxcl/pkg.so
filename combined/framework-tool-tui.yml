id: brew:framework-tool-tui
display-name: Framework System TUI
homepage: https://github.com/grouzen/framework-tool-tui
repo: https://github.com/grouzen/framework-tool-tui
docs:
  - https://github.com/grouzen/framework-tool-tui/blob/main/docs/ARCHITECTURE.md
  - https://github.com/grouzen/framework-tool-tui#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents distribution through GitHub release binaries, Gentoo
      packages, AUR, archlinuxcn, NixOS packages, Homebrew for Linux, and FreeBSD ports,
      alongside source installation with Cargo. That broad packaging spread is notable
      for a hardware-specific TUI launched only in 2025.
  package-nerd-significance:
    - >
      Framework System TUI is package-nerd interesting because it packages
      vendor-specific laptop controls as a terminal-native Rust app rather than a
      desktop daemon or GUI. It is also a compact example of how a new hardware project
      can spread quickly across source builds, binary releases, Linux distributions,
      Homebrew, Nix, and BSD ports.
  project-history:
    - >
      The GitHub repository was created in August 2025 and the first release, v0.1.0,
      followed the next day with BIOS display, overview information, README updates,
      cleanup, and GitHub Actions CI. The project is built with ratatui and crossterm,
      and its hardware layer uses FrameworkComputer's framework_lib crate.
    - >
      Subsequent early releases added charge-limit control, brightness controls, PD port
      panels, fan speed information, layout and theme work, screenshots, and a GIF demo.
      By 2026 the release notes show work on Windows builds, crates.io publishing,
      official NixOS and Gentoo install instructions, and routine dependency
      maintenance.
  related-projects:
    - >
      The project is related to FrameworkComputer/framework-system and framework_lib for
      hardware access, ratatui and crossterm for terminal UI, and distro packaging
      ecosystems including Gentoo, AUR, archlinuxcn, NixOS, Homebrew, and FreeBSD ports.
  sources:
    - https://api.github.com/repos/grouzen/framework-tool-tui
    - https://github.com/grouzen/framework-tool-tui
    - https://github.com/grouzen/framework-tool-tui/blob/main/docs/ARCHITECTURE.md
    - https://github.com/grouzen/framework-tool-tui/releases
  summary:
    - >
      Framework System TUI is a Rust terminal dashboard for controlling and monitoring
      Framework laptop hardware. It exposes battery and charge controls, privacy
      toggles, keyboard and fingerprint brightness, USB-C PD port information, fan RPM,
      and BIOS/system information through a TUI.
  timeline:
    - '2025: Repository created on August 15.'
    - >
      2025: v0.1.0 released with BIOS display, overview panel, README updates, cleanup,
      and CI.
    - '2025: v0.2.0 added charge limit and brightness controls.'
    - '2025: v0.3.0 added PD port panel and screenshots.'
    - '2025: v0.4.0 added fan speed information.'
    - '2026: v0.7.3 release notes describe Windows availability.'
    - '2026: v0.8.0 added NixOS and official Gentoo installation instructions.'
    - '2026: v0.8.4 released with dependency and release-maintenance updates.'
  usage:
    - >
      The tool is run as framework-tool-tui and needs root privileges to access hardware
      controls. Its architecture polls Framework laptop hardware at intervals, stores a
      snapshot of hardware data, renders panels in a terminal UI, and dispatches
      keyboard actions back to hardware mutation methods.
related-packages: []
