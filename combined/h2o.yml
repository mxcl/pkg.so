id: brew:h2o
display-name: H2O
homepage: https://github.com/h2o/h2o/
repo: https://github.com/h2o/h2o
docs:
  - https://github.com/h2o/h2o#readme
  - https://h2o.examp1e.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      H2O emerged as HTTP/2 moved from draft work into production deployment, so its
      adoption history is tied to operators and developers who wanted a server that
      handled HTTP/2 semantics deeply. The official site emphasizes lower CPU and
      memory-bandwidth use than older HTTP servers and highlights prioritization
      schemes, server push, and 103 Early Hints.
    - >
      Fastly's public author page for Kazuho Oku identifies him as the author of H2O,
      quicly, and picoTLS, linking the server to a broader ecosystem of transport-layer
      and TLS work. Package-manager adoption through Homebrew, MacPorts, Nix, and Ubuntu
      made H2O available to developers experimenting with modern HTTP stacks without
      building from source.
  package-nerd-significance:
    - >
      H2O is significant because it is not just another packaged web server: it captured
      a particular period when HTTP/2 implementers were validating new protocol
      semantics with h2spec, HPACK, prioritization trees, TLS choices, and server push.
      It also connected package ecosystems to related low-level projects such as
      picohttpparser, quicly, and picoTLS.
    - >
      For people who follow formulae and ports, H2O is a useful example of a
      high-performance network daemon whose packaging surface spans daemon deployment,
      local protocol testing, and C library reuse.
  project-history:
    - >
      The H2O repository was created in August 2014. The README credits DeNA, Kazuho
      Oku, Tatsuhiko Kubo, and later contributors including Fastly, and describes H2O as
      an optimized HTTP server with HTTP/1.x, HTTP/2, and experimental HTTP/3 support.
    - >
      H2O 1.0 arrived around the finalization of HTTP/2, and the Changes file records
      early work to support the finalized HTTP/2 version and fix issues reported by
      h2spec. The project subsequently added or refined TLS, OCSP, mruby scripting,
      FastCGI, reverse proxying, HTTP/2 priority behavior, server push, early hints, and
      libh2o APIs.
    - >
      The release history shows a mature 2.x line through 2019, including security fixes
      for HTTP/2 denial-of-service vectors and other parser or logging issues. A 2026
      repository release note records that maintainers had decided in 2019 to stop
      tagging regular versions, steering users toward the master branch instead of a
      backported stable-branch model.
  related-projects:
    - >
      Related projects include h2spec for conformance testing, nghttp2 as another major
      HTTP/2 implementation, picohttpparser as a parser used in the H2O ecosystem,
      quicly for QUIC, picoTLS for TLS, and web servers such as nginx and Apache that
      H2O is often compared with.
  sources:
    - https://formulae.brew.sh/formula/h2o
    - https://github.com/h2o/h2o
    - https://h2o.examp1e.net/
    - https://h2o.examp1e.net/configure.html
    - https://raw.githubusercontent.com/h2o/h2o/master/Changes
    - https://raw.githubusercontent.com/h2o/h2o/master/README.md
    - https://www.fastly.com/blog/author/kazuho-oku
  summary:
    - >
      H2O is an MIT-licensed C HTTP server and library created in the HTTP/2 transition
      era. It became notable among web-server and package-manager users for treating
      HTTP/2 prioritization, server push, TLS behavior, and later HTTP/3/QUIC support as
      core design concerns rather than bolt-on features.
  timeline:
    - '2014: H2O repository created.'
    - '2015: 1.0-era development aligned with finalized HTTP/2 support and h2spec fixes.'
    - '2017: 2.2.0 series added a broad set of server, proxy, mruby, and logging features.'
    - '2018: 2.3.0 beta added HTTP/2, proxy, mruby, TLS, and server-timing work.'
    - '2019: 2.2.6 and 2.3.0-beta2 included fixes for HTTP/2 denial-of-service CVEs.'
    - >
      2026: Release note documented the earlier decision to stop tagging versions and
      use master-branch commits.
  usage:
    - >
      H2O can run as a standalone HTTP server or be used as libh2o. Its documentation
      covers command options, YAML-style configuration, virtual hosts, paths, static
      files, FastCGI, proxying, access logs, compression, mruby, HTTP/2, HTTP/3, and
      operational features such as graceful restart.
    - >
      For CLI/package users, H2O is commonly installed to test or operate a compact web
      server with HTTP/2 and HTTP/3 behavior, to compare prioritization and push
      behavior, or to embed HTTP serving behavior through the library.
related-packages:
  - id: brew:h2spec
    reason: Use h2spec alongside H2O to check a running server for HTTP/2 and HPACK conformance.
    rel: adjacent_workflow
    sources:
      - https://github.com/summerwind/h2spec
      - https://raw.githubusercontent.com/h2o/h2o/master/Changes
  - id: brew:nghttp2
    reason: >
      Choose nghttp2 when you need a general HTTP/2 C library plus dedicated client,
      server, proxy, and load-testing programs rather than H2O's integrated web-server
      focus.
    rel: alternative
    sources:
      - https://h2o.examp1e.net/
      - https://nghttp2.org/documentation/
category: networking
package-manager:
  brew: h2o
  macports: h2o
  nix: h2o
  ubuntu: h2o
package-manager-url: https://formulae.brew.sh/formula/h2o
license: MIT
tags:
  - c
  - cli
  - http
  - http2
  - http3
  - web-server
description: HTTP server with support for HTTP/1.x and HTTP/2
executables:
  - h2o
provenance:
  formula: h2o
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
