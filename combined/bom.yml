id: brew:bom
display-name: bom
homepage: https://kubernetes-sigs.github.io/bom/
repo: https://github.com/kubernetes-sigs/bom
docs:
  - https://kubernetes-sigs.github.io/bom
  - https://kubernetes-sigs.github.io/bom/cli-reference
  - https://kubernetes-sigs.github.io/bom/quick-start
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bom's adoption follows the post-SolarWinds supply-chain tooling wave: SBOMs became
      expected release artifacts, and Kubernetes needed tooling that could fit CI,
      container images, Go dependency analysis, SPDX output, and in-toto provenance
      workflows. The input package facts list Homebrew, Nix, Scoop, and zypper
      packaging.
  package-nerd-significance:
    - >
      bom is package-nerd significant because it is tooling about packages themselves:
      it turns source trees, images, and dependencies into machine-readable supply-chain
      metadata. It sits where package management, compliance, SPDX, Kubernetes release
      engineering, and container provenance meet.
  project-history:
    - >
      The official README says bom was created as part of the effort to create an SBOM
      for the Kubernetes project. It later became a general-purpose CLI that can
      generate SPDX packages from directories, container images, single files, archives,
      and other sources.
    - >
      The project is associated with the Linux Foundation's Automating Compliance
      Tooling Technical Advisory Council, placing it in the supply-chain compliance
      tooling ecosystem rather than only in Kubernetes internals.
  related-projects:
    - >
      Related projects include Kubernetes, SPDX, in-toto, Syft, CycloneDX tooling,
      cosign, and other software supply-chain inventory tools.
  sources:
    - https://github.com/kubernetes-sigs/bom#readme
    - https://kubernetes-sigs.github.io/bom
    - input.source_facts.package-manager
  summary:
    - >
      bom is the Kubernetes SIGs SBOM multitool for creating, viewing, and transforming
      Software Bills of Materials, especially SPDX documents.
  timeline:
    - '2021: bom appears in Kubernetes SIG tooling around the Kubernetes SBOM effort.'
    - >
      2020s: bom grows into a general-purpose SPDX SBOM generator for files,
      directories, archives, container images, and Go dependencies.
    - >
      2020s: The project is incubated under the Linux Foundation Automating Compliance
      Tooling TAC.
  usage:
    - >
      Common usage is `bom generate` against a directory, file list, archive, or image,
      then `bom document` to inspect or query the resulting SPDX document. The README
      also documents license classification, `.gitignore` support, Go dependency
      analysis, and provenance export.
related-packages:
  - id: brew:syft
    reason: >
      Choose Syft when you need broad package-ecosystem discovery and CycloneDX as well
      as SPDX output; choose bom for Kubernetes-originated SPDX generation, document
      queries, validation, and provenance export.
    rel: alternative
    sources:
      - https://github.com/kubernetes-sigs/bom
      - https://github.com/anchore/syft
category: security
package-manager:
  brew: bom
  nix: bom
  scoop: main/bom
  zypper: bom
package-manager-url: https://formulae.brew.sh/formula/bom
license: Apache-2.0
tags:
  - cli
  - kubernetes
  - sbom
  - spdx
  - supply-chain
description: Utility to generate SPDX-compliant Bill of Materials manifests
executables:
  - bom
provenance:
  formula: bom
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
