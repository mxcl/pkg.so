id: brew:caesiumclt
display-name: CaesiumCLT
homepage: https://github.com/Lymphatus/caesium-clt
repo: https://github.com/Lymphatus/caesium-clt
docs:
  - https://github.com/Lymphatus/caesium-clt/blob/main/docs/USAGE.md
  - https://github.com/Lymphatus/caesium-clt#readme
  - https://saerasoft.com/caesiumclt
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CaesiumCLT is distributed through developer and user package channels rather than
      only as release binaries: the official README documents Cargo, Homebrew, and
      Winget installs, and Homebrew carries it as the caesiumclt formula. Its audience
      is the overlap between web/media optimization users and shell users who want
      repeatable compression jobs.
  package-nerd-significance:
    - >
      For package maintainers, CaesiumCLT is notable as a small media CLI that wraps a
      dedicated compression engine while staying easy to ship across Cargo, Homebrew,
      Winget, and GitHub release binaries. It is a useful example of a GUI-adjacent
      application family exposing a clean automation surface for CI image optimization
      and bulk asset cleanup.
  project-history:
    - >
      The public caesium-clt repository dates to 2015 and describes itself as Caesium
      Command Line Tools. The current README presents the tool as a Rust command-line
      compressor built on libcaesium, with lossy, lossless, maximum-size, resize,
      conversion, metadata, recursive, and multithreaded modes.
    - >
      The project changelog records a major migration to Rust in the 0.19 line and a
      1.0.0 release that consolidated multi-format compression, resizing, format
      conversion, dry-run, overwrite policy, and recursive batch behavior. Subsequent
      1.x releases added Homebrew-oriented release automation, GIF support,
      human-readable size limits, minimum-savings logic, faster scanning, and JSON
      output.
  related-projects:
    - >
      libcaesium is the compression engine named by the README as the core library
      behind CaesiumCLT.
    - >
      The broader Caesium family includes SaeraSoft's graphical Caesium image
      compressor, while CaesiumCLT serves the command-line and automation use case.
  sources:
    - https://api.github.com/repos/Lymphatus/caesium-clt
    - https://api.github.com/repos/Lymphatus/caesium-clt/releases
    - https://github.com/Lymphatus/caesium-clt#readme
    - https://github.com/Lymphatus/caesium-clt/blob/main/CHANGELOG.md
    - https://github.com/Lymphatus/caesium-clt/blob/main/docs/USAGE.md
  summary:
    - >
      CaesiumCLT is the command-line member of the Caesium image-compression family,
      packaged for workflows where batch JPEG, PNG, WebP, and GIF optimization belongs
      in scripts rather than a desktop GUI.
  timeline:
    - '2015: Public caesium-clt repository created on GitHub.'
    - '2025: 1.0.0 release documents the core modern feature set.'
    - '2025: 1.1.0 adds GIF support and Homebrew installation notes.'
    - '2026: 1.3.0 release adds fast scanning and minimum-savings behavior.'
  usage:
    - >
      Common use is batch image compression from the shell: quality-based lossy
      compression, lossless optimization, recursive directory processing, conversion to
      WebP or JPEG, max-size targeting, and optional EXIF or timestamp preservation. The
      docs also expose scripting-friendly switches such as dry-run, quiet/verbose
      levels, thread count, and JSON output.
related-packages:
  - id: brew:jpegoptim
    reason: >
      jpegoptim is a focused alternative for JPEG-only pipelines that need lossless
      optimization or controlled lossy recompression without CaesiumCLT's multi-format
      feature set.
    rel: alternative
    sources:
      - https://github.com/Lymphatus/caesium-clt
      - https://github.com/tjko/jpegoptim
  - id: brew:optipng
    reason: >
      OptiPNG is a focused lossless alternative when the workload is specifically PNG
      optimization and preserving pixel data is mandatory.
    rel: alternative
    sources:
      - https://github.com/Lymphatus/caesium-clt
      - https://optipng.sourceforge.net/
  - id: brew:pngquant
    reason: >
      pngquant is a focused alternative for aggressively shrinking PNG files through
      lossy palette quantization with alpha transparency support.
    rel: alternative
    sources:
      - https://github.com/Lymphatus/caesium-clt
      - https://pngquant.org/
category: media
package-manager:
  brew: caesiumclt
  winget: SaeraSoft.CaesiumCLT
package-manager-url: https://formulae.brew.sh/formula/caesiumclt
license: Apache-2.0
tags:
  - cli
  - image-compression
  - image-optimization
  - jpeg
  - lossless-compression
  - lossy-compression
  - png
  - webp
description: Fast and efficient lossy and/or lossless image compression tool
executables:
  - caesiumclt
provenance:
  formula: caesiumclt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
