id: brew:geph4
display-name: Geph4 Client
homepage: https://geph.io/
repo: https://github.com/geph-official/geph4-client
docs:
  - https://github.com/geph-official/geph4-client/wiki
  - https://github.com/geph-official/geph4-client
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Geph4 Client sits in a small but specialized ecosystem of Geph components,
      including the GUI client, bridge infrastructure, the sosistab2 transport, and
      binder services. Its significance comes from packaging censorship-circumvention
      behavior in a scriptable CLI rather than only in a graphical application.
  package-nerd-significance:
    - >
      For package-manager users, geph4-client is useful because it installs the Rust CLI
      entry point without a manual Cargo build. That makes it easier to script Geph
      connections, wire local applications through localhost proxy ports, or test Geph
      behavior outside the GUI.
  project-history:
    - >
      The geph4-client repository was opened in 2020 as the command-line client for the
      fourth-generation Geph system. Its README describes a design built around exit
      servers, bridge servers, the sosistab2 transport, and client-side tunneling for
      proxy and VPN traffic.
  related-projects:
    - gephgui, bridge-phalanx, sosistab2, Mel
  sources:
    - https://api.github.com/repos/geph-official/geph4-client
    - https://github.com/geph-official/geph4-client
    - https://raw.githubusercontent.com/geph-official/geph4-client/master/README.md
  summary:
    - >
      Geph4 Client is the command-line client for Geph, a modular
      censorship-circumvention system designed for national filtering environments. The
      package exposes Geph's proxy, VPN, synchronization, binder, and diagnostic
      operations as a Rust command-line program.
  timeline:
    - '2020: The geph4-client repository was opened on GitHub.'
    - >
      2020s: The README documents bridge-backed exit-server connections, SOCKS5 and HTTP
      local proxies, VPN modes, and GUI support commands.
  usage:
    - >
      Practitioners run `geph4-client connect` with user credentials and an exit server
      to create local SOCKS5 and HTTP proxies, and may enable VPN mode on supported
      platforms. Other subcommands synchronize account and exit-server data, proxy
      binder API calls for the GUI, or export a debug SQLite database.
related-packages:
  - id: brew:tor
    reason: >
      Choose Tor when you want the Tor anonymity network and its bridge-based censorship
      circumvention; choose Geph4 Client for Geph's own exit-and-bridge network and
      local SOCKS5/HTTP proxy workflow.
    rel: alternative
    sources:
      - https://github.com/geph-official/geph4-client#readme
      - https://support.torproject.org/tor-browser/circumvention/
category: networking
