  - biosig2gdf
  - biosig_fhir
  - heka2itx
  - physicalunits
  - rec2bin
  - save2aecg
  - save2gdf
  - save2scp
provenance:
  formula: biosig
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
