id: brew:biosig
display-name: BioSig
homepage: https://biosig.sourceforge.net/
repo: https://sourceforge.net/p/biosig/code
docs:
  - https://biosig.sourceforge.net/documentation.html
  - https://biosig.sourceforge.net/
  - https://biosig.sourceforge.net/projects.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official NEWS file records long-running adoption milestones: prominent
      SourceForge activity in 2006, Windows tools and many supported formats by 2008,
      Debian-related packaging work by 2012, Debian 10 inclusion for
      libbiosig/biosig-tools in 2019, Homebrew support in 2015 and 2018, PyPI
      availability from 2020, and Windows PyPI support in 2024.
    - >
      The input package metadata lists Homebrew, Debian, and Ubuntu package names,
      reflecting its role as a scientific format-conversion and signal-processing
      toolkit that is useful outside its original Matlab/Octave environment.
  package-nerd-significance:
    - >
      BioSig matters to package nerds as a classic SourceForge-era scientific package
      that survived into modern package managers. It carries a large format-support
      surface, C/C++ libraries, Matlab/Octave roots, Python/R bindings, and CLI
      converters across decades of research computing.
  project-history:
    - >
      The SourceForge project metadata records BioSig's project creation date as June
      17, 2000. The official homepage describes BioSig as a GPL software library for
      biomedical signal processing, covering data acquisition, artifact processing,
      quality control, feature extraction, classification, modeling, data visualization,
      and many biosignal domains.
    - >
      BioSig grew as a family of related components: BioSig for Octave and Matlab,
      BioSig for C/C++, rtsBCI, BioProFeed, and BCIx. The projects page describes the
      C/C++ part as a library for reading and writing biosignal data formats and notes
      use in converters such as save2gdf, mexSLOAD, SigViewer, and Python bindings.
  related-projects:
    - >
      BioSig is related to biosig4octmat, biosig4c++, rtsBCI, BioProFeed, BCIx,
      SigViewer, libbiosig, GDF, EDF/BDF-style biosignal formats, EEGLAB, Octave,
      Matlab, Python, and R bindings.
  sources:
    - https://biosig.sourceforge.net/
    - https://biosig.sourceforge.net/NEWS
    - https://biosig.sourceforge.net/documentation.html
    - https://biosig.sourceforge.net/projects.html
    - https://sourceforge.net/rest/p/biosig
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      BioSig is an open source biomedical signal-processing project covering EEG, ECG,
      ECoG, EOG, EMG, respiration, and related biosignal data, with C/C++ command-line
      conversion tools among its installable artifacts.
  timeline:
    - '2000: BioSig SourceForge project created.'
    - '2004: BIOSIG 0.60 and 0.65 releases noted; online help uploaded.'
    - '2005: BioSig4C++, SigViewer, BioProFeed, rtsBCI, and biosig4octmat subprojects noted.'
    - '2006: BioSig for Python started; SourceForge activity and ranking milestones noted.'
    - >
      2012: Debian/Wheezy packaging work noted for libbiosig, biosig4c++ tools,
      mexSLOAD, and biosig4python.
    - '2019: libbiosig/biosig-tools included in Debian 10.'
    - '2020: Homebrew formula availability and PyPI availability noted.'
    - '2024: 64-bit Windows PyPI support noted.'
  usage:
    - >
      Homebrew installs command-line tools such as `save2gdf`, `biosig2gdf`, `rec2bin`,
      `bin2rec`, and related converters. The project documentation points users to
      supported data formats, function references, mailing lists, bug reports, and the
      Git repository.
    - >
      BioSig is most often relevant when a biosignal data file must be read, converted,
      or normalized across EEG/ECG and related research formats, especially around GDF
      and EDF-like workflows.
related-packages:
  - id: brew:octave
    reason: >
      BioSig's official Octave toolbox uses Octave for biomedical signal import,
      processing, feature extraction, and classification on formats handled by the
      BioSig project.
    rel: adjacent_workflow
    sources:
      - https://biosig.sourceforge.net/projects.html
      - https://docs.octave.org/latest/
category: science
package-manager:
  brew: biosig
  debian: biosig-tools
  ubuntu: biosig-tools
package-manager-url: https://formulae.brew.sh/formula/biosig
license: GPL-3.0-or-later
tags:
  - biomedical
