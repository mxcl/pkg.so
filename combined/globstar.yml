id: brew:globstar
display-name: Globstar
homepage: https://globstar.dev
repo: https://github.com/DeepSourceCorp/globstar
docs:
  - https://globstar.dev/
config-file-location:
  unix: ./.globstar/*.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption signals are early and mostly package-manager oriented: the project
      documents a single-binary installer, Homebrew packaging, and CI usage. That
      positions it for teams that want repository-local SAST rules without building a
      full compiler-analysis stack.
  package-nerd-significance:
    - >
      Globstar is notable in CLI packaging because it packages AST-aware checks as a
      small Go binary rather than a language-server plugin or SaaS-only workflow.
  project-history:
    - >
      The project appeared publicly in the DeepSourceCorp GitHub organization in 2025.
      Its README presents Globstar as a way to expose DeepSource's experience with
      static analyzers through a smaller open-source tool built around tree-sitter
      queries, YAML checker definitions, and a Go interface for more complex checks.
  related-projects:
    - >
      Globstar builds on tree-sitter and sits near Semgrep-style custom static-analysis
      workflows, but its documented checker format is centered on repository-local
      Globstar YAML and Go checkers.
  sources:
    - https://formulae.brew.sh/formula/globstar
    - https://github.com/DeepSourceCorp/globstar
    - https://github.com/DeepSourceCorp/globstar/releases
    - https://globstar.dev/
    - https://raw.githubusercontent.com/DeepSourceCorp/globstar/main/README.md
  summary:
    - >
      Globstar is an open-source static-analysis toolkit from DeepSource for writing
      custom code checkers and running them through a portable command-line binary.
  timeline:
    - '2025: v0.0.1 tag appeared in the DeepSourceCorp/globstar repository.'
    - '2025: v0.6.0 was published through GitHub releases.'
  usage:
    - >
      Practitioners define custom checkers under a repository's .globstar directory and
      run globstar check locally or in CI. The documented workflow combines built-in
      checks with project-specific tree-sitter patterns.
related-packages:
  - id: brew:semgrep
    reason: >
      Semgrep is an alternative custom-rule static analyzer with YAML rules plus mature
      data-flow and taint-analysis features, making it a stronger fit when analysis must
      extend beyond Globstar's tree-sitter-oriented checks.
    rel: alternative
    sources:
      - https://globstar.dev/reference/checker-yaml
      - https://semgrep.dev/docs/writing-rules/overview
      - https://semgrep.dev/docs/writing-rules/data-flow/overview
  - id: brew:ast-grep
    reason: >
      ast-grep is an alternative AST-based rule engine that also performs structural
      rewriting and codemods, so it is preferable when findings should include automated
      source transformations.
    rel: alternative
    sources:
      - https://globstar.dev/reference/checker-yaml
      - https://ast-grep.github.io/
      - https://ast-grep.github.io/guide/project/lint-rule
category: developer-tools
package-manager:
  brew: globstar
package-manager-url: https://formulae.brew.sh/formula/globstar
license: MIT
tags:
  - ci
  - cli
  - code-quality
  - sast
  - static-analysis
  - tree-sitter
description: Static analysis toolkit for writing and running code checkers
executables:
  - globstar
provenance:
  formula: globstar
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
