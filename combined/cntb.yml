id: brew:cntb
display-name: cntb
homepage: https://github.com/contabo/cntb
repo: https://github.com/contabo/cntb
docs:
  - https://github.com/contabo/cntb#readme
config-file-location:
  unix: ~/.cntb.yaml
credentials-file-location:
  unix: ~/.cntb.yaml
history:
  adoption-history:
    - >
      The official README documents prebuilt releases for Windows, macOS, and Linux,
      while the input package facts show Homebrew and Nix packaging.
  package-nerd-significance:
    - >
      cntb gives package users a provider-specific cloud CLI that can be installed like
      other Unix tools while still wrapping Contabo's API surface.
  project-history:
    - >
      The official README describes cntb as a CLI for managing Contabo products and
      shows generated API-style commands for images and compute instances.
  related-projects:
    - >
      The official Makefile shows API client generation from
      https://api.contabo.com/api-v1.yaml, tying the CLI to Contabo's public API
      specification.
  sources:
    - https://github.com/contabo/cntb#readme
    - https://github.com/contabo/cntb/blob/main/Makefile
    - source_facts.package-manager
  summary:
    - >
      cntb is Contabo's command-line interface for managing Contabo VPS, VDS, and
      related cloud products.
  timeline:
    - '2026: GitHub releases page lists v1.6 as latest on March 25, 2026.'
  usage:
    - >
      Users configure cntb once with OAuth2 client ID, client secret, API user, and API
      password from the Contabo Customer Control Panel, then run commands such as cntb
      get images.
related-packages: []
category: cloud-infrastructure
package-manager:
  brew: cntb
  nix: cntb
package-manager-url: https://formulae.brew.sh/formula/cntb
license: GPL-3.0-only
tags:
  - cli
  - cloud
  - contabo
  - oauth2
  - vps
description: Contabo Command-Line Interface (CLI)
executables:
  - cntb
provenance:
  formula: cntb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
