id: brew:leakcanary-shark
display-name: Shark CLI
homepage: https://square.github.io/leakcanary/shark/
repo: https://github.com/square/leakcanary
docs:
  - https://github.com/square/leakcanary#readme
  - https://square.github.io/leakcanary/shark
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LeakCanary became a widely recognized Android debugging library, and the GitHub
      repository listed about 29.9k stars in July 2026. Shark CLI's Homebrew package
      matters because it brings the same heap-analysis engine to package-manager users
      working from a desktop shell.
  package-nerd-significance:
    - >
      For package maintainers, leakcanary-shark is a good example of a library-internal
      engine becoming a standalone CLI. It packages Android heap analysis as a
      Unix-style tool while preserving the upstream LeakCanary project's Kotlin
      implementation and release stream.
  project-history:
    - >
      LeakCanary began as Square's Android memory-leak detection library, with the
      official docs and repository carrying a 2015 Square copyright. Shark appears in
      the LeakCanary 2 architecture as the standalone heap-analysis layer beneath
      LeakCanary's Android integration.
    - >
      The Shark documentation describes a layered design: Shark Hprof for HPROF records,
      Shark Graph for object graph navigation, Shark for heap analysis reports, Shark
      Android for Android-specific heuristics, Shark CLI for desktop heap analysis, and
      LeakCanary above those layers for automatic app leak detection.
  related-projects:
    - >
      Related upstream components include LeakCanary, Shark Hprof, Shark Graph, Shark
      Android, Okio, Kotlin, Android Studio heap tooling, and JVM HPROF analyzers.
  sources:
    - https://formulae.brew.sh/formula/leakcanary-shark
    - https://github.com/square/leakcanary
    - https://github.com/square/leakcanary/releases
    - https://square.github.io/leakcanary/
    - https://square.github.io/leakcanary/shark
  summary:
    - >
      Shark CLI is the desktop command-line packaging of Shark, the Kotlin heap analyzer
      that powers LeakCanary 2. It lets Android developers dump, inspect, analyze, and
      sanitize HPROF heap dumps without adding the LeakCanary Android dependency to an
      app.
  timeline:
    - >
      2015: LeakCanary documentation and repository identify Square's Android
      memory-leak project under an Apache-2.0 license.
    - 'LeakCanary 2 era: Shark is documented as the heap analyzer powering LeakCanary 2.'
    - '2026-06-25: GitHub release metadata listed v3.0-alpha-9 for the LeakCanary repository.'
  usage:
    - >
      The CLI can analyze a heap dump, dump the heap of a debuggable Android app
      connected over ADB, run an interactive heap explorer, and strip primitive arrays
      from HPROF files before sharing. The documentation notes that shark-cli works with
      debuggable apps even when the app does not include the leakcanary-android
      dependency.
related-packages:
  - id: cask:memoryanalyzer
    reason: >
      Choose Eclipse Memory Analyzer for a graphical, general-purpose Java heap workflow
      with dominator trees, retained-size analysis, GC-root tracing, and automated
      leak-suspect reports; choose Shark CLI for scriptable Android-aware analysis and
      direct ADB workflows.
    rel: alternative
    sources:
      - https://square.github.io/leakcanary/shark/
      - https://eclipse.dev/mat/
category: developer-tools
