id: brew:difi
display-name: difi
homepage: https://github.com/xguot/difi
repo: https://github.com/xguot/difi
docs:
  - https://github.com/oug-t/difi#readme
config-file-location:
  unix: ~/.config/difi/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official project metadata shows early adoption inside the Git-and-terminal-tool
      niche rather than a long historical footprint. Its package-manager relevance comes
      from offering Homebrew installation for macOS and Linux alongside Go and Arch
      paths, making it easy to try without a custom build.
  package-nerd-significance:
    - >
      For package-history purposes, difi is notable as a modern Bubble Tea style
      terminal UI packaged early for Homebrew. It is a small example of the current wave
      of single-purpose Go CLIs that treat terminal interactivity, editor integration,
      and package-manager distribution as first-class ergonomics.
  project-history:
    - >
      The public GitHub repository was created in January 2026 and quickly centered on a
      single CLI workflow: inspect a branch, commit, or patch, navigate the file tree
      and diff view, and open files in an editor from the terminal. The project is
      distributed through Homebrew, Go install, AUR packages, and GitHub release
      binaries.
  related-projects:
    - >
      The README documents integrations with vim-fugitive and difi.nvim, and notes that
      raw diffs from other version-control tools such as Jujutsu can be piped into difi.
  sources:
    - https://api.github.com/repos/xguot/difi
    - https://github.com/xguot/difi#readme
    - https://api.github.com/repos/xguot/difi/releases?per_page=5
  summary:
    - >
      difi is a Go terminal user interface for reviewing and refining Git diffs before
      pushing changes. Its official README frames it as a focused diff-review tool that
      can run inside a Git repository or consume raw patch data through standard input.
  timeline:
    - '2026: Public GitHub repository created.'
    - '2026: GitHub releases provide prebuilt binaries for Linux, macOS, and Windows.'
    - '2026: README documents Homebrew, Go install, AUR, and manual installation paths.'
  usage:
    - >
      Typical use is to run `difi` in a Git repository, pass a target such as `main` or
      `HEAD~1`, or pipe a generated diff into the command. The README also documents
      Jujutsu and vim-fugitive-oriented workflows, which positions it among developer
      tools that sit between raw `git diff` and full code-review platforms.
related-packages: []
category: developer-tools
package-manager:
  brew: difi
package-manager-url: https://formulae.brew.sh/formula/difi
license: MIT
tags:
  - cli
  - code-review
  - diff
  - git
  - terminal-ui
description: Pixel-perfect terminal diff viewer
executables:
  - difi
provenance:
  formula: difi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
