id: brew:metaproxy
display-name: Metaproxy
homepage: https://www.indexdata.com/resources/software/metaproxy/
repo: https://github.com/indexdata/metaproxy
docs:
  - https://software.indexdata.com/metaproxy/doc
  - https://software.indexdata.com/metaproxy/doc/introduction.html
  - https://software.indexdata.com/metaproxy/doc/reference.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption niche is narrow but durable: libraries, catalogs, and discovery
      systems that need standards-based search interoperability. The Library of Congress
      documents an Index Data MetaProxy deployment as an SRW/SRU/Z39.50 gateway to its
      Folio and Zebra Z39.50 servers, which illustrates the kind of institutional
      infrastructure where the tool appears. Related documentation from the Library of
      Congress also explains why SRU and Z39.50 gateways matter: SRU carries
      Z39.50-style search semantics into web-service form.
  project-history:
    - >
      The technical core is a configurable routing pipeline. The manual describes
      Metaproxy as a standalone program that accepts requests from information-retrieval
      clients using protocols such as ANSI/NISO Z39.50 and SRU, acts as a client to
      back-end servers, and satisfies requests by transforming, multiplexing,
      forwarding, merging, and returning results. Its XML configuration defines routes
      made of filters for operations such as accepting packets, logging, query
      transformation, multiplexing, and SRU-to-Z39.50 translation; additional filters
      can be added as loadable modules.
  sources:
    - https://formulae.brew.sh/formula/metaproxy
    - https://github.com/indexdata/metaproxy
    - https://software.indexdata.com/metaproxy/doc/
    - https://software.indexdata.com/metaproxy/doc/ref-sru_z3950.html
    - https://software.indexdata.com/metaproxy/doc/sru-server.html
    - https://www.indexdata.com/resources/software/metaproxy/
    - https://www.loc.gov/standards/sru/resources/shortTopics.html
    - https://www.loc.gov/z3950/lcserver.html
  summary:
    - >
      Metaproxy is Index Data's Z39.50/SRW/SRU proxy, router, and metasearch server for
      library and information-retrieval systems. The upstream repository identifies it
      as a universal Z39.50/SRU router with Index Data copyright beginning in 2005,
      while the product page describes it as a server that presents a single
      standards-based front end to multiple back-end database servers.
  usage:
    - >
      As a package-manager entry, metaproxy is specialist server software. Homebrew and
      MacPorts make it easier for integrators and library-system developers to install
      the router and its companion metaproxy-config tool on development or small
      deployment machines without building the YAZ-based stack by hand.
related-packages:
  - id: brew:yazpp
    reason: >
      Metaproxy officially depends on YAZ++, whose C++ interfaces provide the YAZ-based
      Z39.50/SRU protocol layer used by the proxy.
    rel: adjacent_workflow
    sources:
      - https://software.indexdata.com/metaproxy/doc/installation.html
      - https://www.indexdata.com/resources/software/yazpp/
      - https://software.indexdata.com/yazpp/doc/introduction.html
