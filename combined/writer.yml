id: cask:writer
display-name: Writer
homepage: https://writer.computer/
repo: https://github.com/joelbqz/writer-computer
docs:
  - https://github.com/joelbqz/writer-computer/tree/master/docs
  - https://github.com/joelbqz/writer-computer#readme
  - https://writer.computer/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Writer is distributed as an open-source desktop application with a signed macOS
      release workflow and is available through Homebrew Cask. Its local-first design
      targets users who want ordinary workspace files rather than a hosted document
      service.
  package-nerd-significance:
    - >
      Writer combines a Rust/Tauri desktop shell with React, CodeMirror, and
      filesystem-backed Markdown. Package users retain direct access to their documents,
      can place workspaces under Git, and can use the optional command-line integration
      without adopting a proprietary storage format.
  project-history:
    - >
      Writer's public 2026 changelog records rapid development of a workspace-oriented
      Markdown editor, including multi-window support, configurable themes, Mermaid
      rendering, file watching, Git-aware workspace behavior, and compact single-file
      windows.
    - >
      The project is released under the GPL and maintains its application, website,
      specifications, and release tooling in one public repository.
  related-projects:
    - >
      Writer uses Tauri for its desktop shell and CodeMirror for editing, while Mermaid
      provides rendered diagrams inside Markdown documents.
    - >
      Its plain-file workspace model interoperates naturally with Git and other tools
      that consume Markdown.
  sources:
    - https://github.com/joelbqz/writer-computer
    - https://github.com/joelbqz/writer-computer/blob/master/CHANGELOG.md
    - https://writer.computer/
  summary:
    - >
      Writer is a lightweight, local-first desktop editor for Markdown files stored in
      user-selected workspaces.
  timeline:
    - >
      2026: The public changelog documents the addition and refinement of workspace,
      multi-window, theming, diagram, and single-file editing features.
  usage:
    - >
      Users open a folder as a workspace, edit Markdown files with rendered formatting
      and Mermaid diagrams, manage files from the sidebar, and keep the underlying
      documents directly on disk. Writer respects workspace .gitignore rules and
      supports opening workspaces or individual files from its command-line integration.
related-packages:
  - id: cask:markedit
    reason: >
      Choose MarkEdit for a more minimalist, native macOS Markdown editor with an
      open-source codebase and a dedicated user wiki.
    rel: alternative
    sources:
      - https://github.com/MarkEdit-app/MarkEdit
      - https://github.com/MarkEdit-app/MarkEdit/wiki
      - https://github.com/joelbqz/writer-computer
  - id: cask:zettlr
    reason: >
      Choose Zettlr when academic citations, long-form publication workflows, and
      cross-platform support matter more than Writer's lightweight workspace focus.
    rel: alternative
    sources:
      - https://www.zettlr.com/
      - https://docs.zettlr.com/en/
      - https://github.com/joelbqz/writer-computer
  - id: cask:typora
    reason: >
      Choose Typora for a polished commercial live-preview editor with broad export
      support; choose Writer when open source and workspace-local files are priorities.
    rel: alternative
    sources:
      - https://typora.io/
      - https://support.typora.io/
      - https://github.com/joelbqz/writer-computer
