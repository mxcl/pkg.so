history:
  adoption-history:
    - >
      OpenFrame Console is distributed as a Homebrew cask and serves as the packaged
      desktop entry point to the broader OpenFrame ecosystem. Its audience is primarily
      managed-service providers and IT technicians rather than general desktop users.
  package-nerd-significance:
    - >
      The package is notable as a desktop shell for an open-source MSP stack that
      combines several traditionally separate tool categories—remote monitoring, device
      access, ticketing, scripts, and AI assistance—behind one interface.
  project-history:
    - >
      Flamingo developed OpenFrame as an open-source, AI-oriented management platform
      for managed-service providers. The frontend repository became the human-facing web
      and desktop layer over OpenFrame services, Fleet MDM, and MeshCentral.
  related-projects:
    - >
      The official architecture integrates OpenFrame backend services, Fleet MDM for
      device policies and queries, and MeshCentral for remote shell, file-management,
      and desktop sessions.
  sources:
    - https://github.com/flamingo-stack/openframe-oss-frontend#readme
    - https://openframe.ai/
  summary:
    - >
      OpenFrame Console is the packaged desktop client for OpenFrame, a unified
      IT-management environment aimed at managed-service providers.
  timeline:
    - >
      OpenFrame’s frontend was established as the primary human-facing application for
      the open-source platform.
  usage:
    - >
      Technicians use the console to manage devices and customers, handle tickets, run
      scripts, inspect audit data, and initiate remote-management sessions. A working
      OpenFrame deployment or tenant is required for its core workflows.
