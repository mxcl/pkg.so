id: brew:dwm
display-name: dwm
homepage: https://dwm.suckless.org/
repo: https://git.suckless.org/dwm
docs:
  - https://dwm.suckless.org/
  - https://dwm.suckless.org/faq
config-file-location:
  unix: config.h
credentials-file-location: null
history:
  adoption-history:
    - >
      dwm's own site says binary packages are somewhat beside the point because users
      are expected to customize source, while also acknowledging that some distributions
      provide packages. The batch input lists apk, Homebrew, Debian, Nix, and Ubuntu,
      showing the tension that makes dwm famous in packaging culture: it is widely
      packaged even though upstream thinks the most authentic install is local source
      customization.
  package-nerd-significance:
    - >
      dwm is one of the canonical minimalist Unix desktop packages. It is tiny,
      patch-oriented, hostile to sprawling configuration layers, and influential far
      beyond its source size. For package nerds it is a touchstone in debates about
      source-as-config, downstream patch stacks, reproducible personal builds, and how
      far a package manager should go when upstream expects users to edit C.
  project-history:
    - >
      The official git refs show dwm 0.1 tagged on 2006-07-14 by Anselm R. Garbe,
      followed by rapid 0.x and 1.x releases in 2006. By the 4.x and 5.x series it had
      settled into the small-C-source, edit-and-rebuild configuration style that became
      central to the suckless identity.
    - >
      The official customisation page explains the distinctive model: dwm is configured
      by editing config.h, a C header included by dwm.c, and config.mk for build/install
      settings. The main page argues that source-code configuration is fast and secure
      because dwm does not process unknown runtime configuration input apart from window
      titles and status text.
  related-projects:
    - >
      The official page places dwm against ion, larswm, and wmii, points users to dmenu,
      and lists related or influenced projects including awesome, dvtm, dwl, i3, qtile,
      scrotwm, xmonad, and several dwm forks or ports.
  sources:
    - https://dwm.suckless.org/
    - https://dwm.suckless.org/customisation/
    - https://git.suckless.org/dwm/refs.html
    - https://git.suckless.org/dwm
  summary:
    - >
      dwm is the suckless dynamic window manager for X. The official page describes
      tiled, monocle, and floating layouts, tag-based window grouping, a small status
      bar, and a design that is intentionally smaller, faster, and simpler than
      predecessors such as ion, larswm, and wmii.
  timeline:
    - '2006: dwm 0.1 tagged in the official git repository.'
    - '2007: 4.x releases continue rapid development of the early design.'
    - '2011: dwm 6.0 tagged.'
    - '2019: dwm 6.2 tagged after a slower mature-release cadence.'
    - '2026: dwm 6.8 released on 2026-01-30; official refs show master activity in March 2026.'
  usage:
    - >
      Users run dwm as an X window manager, arrange clients dynamically across tiled,
      monocle, and floating layouts, tag windows instead of placing them into
      conventional workspaces, and feed status text through the root window name.
      Customization usually means editing config.h, applying patches from the official
      patch collection, rebuilding, and carrying the local diff forward.
related-packages:
  - id: brew:dmenu
    reason: >
      dmenu was originally designed for dwm and provides the optional dynamic menu and
      application-launcher workflow documented by dwm upstream.
    rel: adjacent_workflow
    sources:
      - https://dwm.suckless.org/
      - https://tools.suckless.org/dmenu/
category: productivity
