id: brew:mill
display-name: Mill
homepage: https://mill-build.org/
repo: https://github.com/com-lihaoyi/mill
docs:
  - https://mill-build.org/mill/cli/installation-ide.html
  - https://mill-build.org/mill/index.html
config-file-location:
  unix:
    - build.mill
    - build.mill.yaml
    - .mill-version
    - .config/mill-version
    - ./mill
credentials-file-location: null
history:
  project-history:
    - >
      The tool began in the Scala build-tool world, but its scope widened into a general
      build tool for Java, Scala, Kotlin, and other platforms. The Mill documentation
      positions it against Maven, Gradle, and SBT: smaller declarative build files than
      Maven, object-oriented programmable builds rather than Gradle or SBT-style
      complexity, and faster JVM workflows through caching, parallelism, and a
      long-lived daemon. A 2025 Mill 1.0.0 release post framed that version as a
      breaking release intended to set a stable technical foundation, with build files
      written in Scala 3 and Java, Scala, and Kotlin support highlighted in the
      surrounding release discussion.
  sources:
    - https://formulae.brew.sh/formula/mill
    - https://github.com/com-lihaoyi/mill
    - https://index.scala-lang.org/com-lihaoyi/mill/artifacts/mill-scalaworker/0.1.0
    - https://mill-build.org/blog/13-mill-build-tool-v1-0-0.html
    - https://mill-build.org/mill/cli/installation-ide.html
    - https://mill-build.org/mill/index.html
    - https://users.scala-lang.org/t/mill-your-shiny-new-scala-build-tool/2333
  summary:
    - >
      Mill is a JVM build tool from Li Haoyi's `com-lihaoyi` ecosystem. Li announced the
      0.1.0 release on the Scala Users forum on February 18, 2018, describing it as a
      new Scala build tool that could replace SBT and aimed to be fast, simple, and
      friendly. Scaladex metadata for the 0.1.0 artifacts lists the same release date
      and Li Haoyi as developer.
  usage:
    - >
      In practice, developers use Mill from the `mill` CLI, with project-local bootstrap
      scripts, `build.mill` or `build.mill.yaml` build definitions, dependency
      management, testing, packaging, publishing, and IDE import. Its ecosystem role is
      closest to Maven, Gradle, and SBT, but it appeals especially to Scala and JVM
      teams that want build logic expressed as ordinary Scala-like code with aggressive
      incremental evaluation. The official docs cite real-world use in projects such as
      C3P0, Coursier, Ammonite, SpinalHDL, Chisel, and work at Netflix and Disney
      Streaming.
related-packages:
  - id: brew:gradle
    reason: >
      Choose Gradle when its mature plugin ecosystem, Kotlin or Groovy DSLs, and
      established Android/JVM conventions are decisive; choose Mill for concise
      object-oriented builds and lower command overhead emphasized by Mill's official
      comparison.
    rel: alternative
    sources:
      - https://mill-build.org/mill/index.html
      - https://mill-build.org/mill/1.0.x/comparisons/why-mill.html
      - https://docs.gradle.org/current/userguide/userguide.html
  - id: brew:sbt
    reason: >
      Choose sbt for an established Scala build and plugin ecosystem; choose Mill when
      simpler task definitions, automatic caching, and direct command invocation
      outweigh sbt compatibility, as detailed in Mill's official case study.
    rel: alternative
    sources:
      - https://mill-build.org/mill/1.0.x/comparisons/sbt.html
      - https://www.scala-sbt.org/1.x/docs/
  - id: brew:maven
    reason: >
      Choose Maven for its prescriptive POM and lifecycle model and deeply standardized
      Java ecosystem; choose Mill for shorter programmable builds, caching, and parallel
      execution.
    rel: alternative
    sources:
      - https://mill-build.org/mill/index.html
      - https://mill-build.org/mill/1.0.x/comparisons/why-mill.html
      - https://maven.apache.org/guides/
category: developer-tools
