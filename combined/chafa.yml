id: brew:chafa
display-name: Chafa
homepage: https://hpjansson.org/chafa/
repo: https://github.com/hpjansson/chafa
docs:
  - https://hpjansson.org/chafa
  - https://hpjansson.org/chafa/man
  - https://hpjansson.org/chafa/ref
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Chafa's official download page says packages are available for many Linux
      distributions, Windows, Homebrew, and MacPorts, and lists Arch, Brew, Debian,
      Fedora, FreeBSD, Gentoo, Guix, Kali, MacPorts, OpenBSD, openSUSE, Ubuntu, Scoop,
      and Winget examples. The supplied input also records broad package-manager
      coverage across apk, brew, Debian, dnf, MacPorts, Nix, pacman, Scoop, Ubuntu,
      Winget, and zypper.
  package-nerd-significance:
    - >
      Chafa matters to package nerds because it is a cross-platform terminal-media
      primitive: small enough to ship as a CLI, useful as a library, and visible in
      package ecosystems because terminal applications increasingly want inline image
      previews. Its official development page lists downstream users including Kew,
      Felix, HarfBuzz hb-view, nb, Neofetch, Offpunk, Oyomu, and Neovim plugins.
  project-history:
    - >
      Hans Petter Jansson introduced Chafa on April 24, 2018 as an open-source tool for
      displaying graphics in terminal environments. The project site describes it as a
      command-line utility plus a documented, stable C API; the README says it can
      handle animated GIFs and produce graphics or ANSI/Unicode character art for
      terminals ranging from historical teleprinters to modern emulators.
  related-projects:
    - >
      The introductory Chafa post places it in a lineage with aalib, libcaca, and timg.
      Official pages also point to chafapy, chafa-wasm, HarfBuzz hb-view, Neofetch,
      Offpunk, Telescope media files, and chafa.nvim as related bindings or consumers.
  sources:
    - https://hpjansson.org/chafa/
    - https://hpjansson.org/chafa/download/
    - https://hpjansson.org/chafa/development/
    - https://hpjansson.org/blag/2018/04/24/introducing-chafa/
    - https://hpjansson.org/blag/2020/04/01/chafa-1-4-0-now-with-sixels/
    - https://github.com/hpjansson/chafa/blob/master/README.md
  summary:
    - >
      Chafa is a terminal graphics renderer and C library that converts images and
      animations into ANSI, Unicode, sixel, Kitty, and related terminal graphics
      formats. It moved from a clever ANSI-art utility into a widely packaged
      terminal-media component with bindings and downstream integrations.
  timeline:
    - '2018: Chafa was introduced publicly as an open-source terminal graphics tool.'
    - >
      2020: Chafa 1.4.0 added sixel output, expanding from character-cell mosaics into
      terminal pixel graphics protocols.
    - >
      2021: Chafa 1.8 broadened terminal graphics support, according to the official
      release-post list on the project site.
    - '2024: Chafa 1.14 was announced in the official release-post list.'
    - '2026: The official download page lists Chafa 1.18.2 released on 2026-04-30.'
  usage:
    - >
      Users invoke chafa to render images and animations in terminals, choosing symbol
      sets, color modes, terminal graphics protocols, and output sizing. Developers can
      use libchafa through its C API, and the official site points to Python bindings
      and JavaScript/WebAssembly bindings for embedding the renderer in other tools.
related-packages:
  - id: brew:timg
    reason: >
      Choose timg when the primary task is viewing images or video with terminal-native
      graphics; Chafa additionally emphasizes character-art conversion and an embeddable
      rendering library.
    rel: alternative
    sources:
      - https://hpjansson.org/blag/2018/04/24/introducing-chafa/
      - https://timg.sh/
  - id: brew:libcaca
    reason: >
      Choose libcaca for its established colored text-art library and utilities; Chafa
      is the newer alternative with modern terminal graphics protocols and a stable C
      API.
    rel: alternative
    sources:
      - https://hpjansson.org/blag/2018/04/24/introducing-chafa/
      - https://github.com/cacalabs/libcaca
  - id: brew:aalib
    reason: >
      Choose aalib for portable monochrome ASCII rendering, while Chafa targets Unicode,
      color, animation, and newer terminal graphics capabilities.
    rel: alternative
    sources:
      - https://hpjansson.org/blag/2018/04/24/introducing-chafa/
      - https://aa-project.sourceforge.net/aalib/
  - id: brew:kew
    reason: >
      Kew is an official-site-listed Chafa consumer that uses it to add graphical
      presentation to its terminal music-player workflow.
    rel: adjacent_workflow
    sources:
      - https://hpjansson.org/chafa/development/
      - https://github.com/ravachol/kew
  - id: brew:harfbuzz
    reason: >
      HarfBuzz's hb-view is listed as a Chafa consumer, combining text shaping and font
      rendering with terminal-friendly graphical presentation.
    rel: adjacent_workflow
    sources:
      - https://hpjansson.org/chafa/development/
      - https://github.com/harfbuzz/harfbuzz
category: media
