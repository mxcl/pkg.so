id: brew:magics
display-name: Magics
homepage: https://confluence.ecmwf.int/display/MAGP/Magics
repo: https://github.com/ecmwf/magics
docs:
  - https://confluence.ecmwf.int/display/MAGP/Magics
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Magics adoption is concentrated in meteorology, earth-science, and ECMWF workflows
      rather than general-purpose CLI use. The official documentation ties it to ECMWF's
      ecCodes for GRIB handling and to Metview, while the companion `magics-python`
      repository packages the Python interface.
    - >
      The supplied Homebrew input shows packaged availability in Homebrew and
      Debian/Ubuntu as `libmagics++-data`. ECMWF's page also advertises PyPI, Conda, and
      Docker badges, which fits its scientific-computing distribution model.
  package-nerd-significance:
    - >
      Magics is package-nerd significant because it is a domain-specific native stack
      with scientific data formats, C++ and Fortran code, Python bindings, and data
      assets. It tends to surface in formulae and distro packages as part of the ECMWF
      weather-toolchain cluster with ecCodes and Metview.
    - >
      Its release trail is valuable for maintainers because ABI, CMake, Python, and
      format support changes matter to downstream meteorological software.
  project-history:
    - >
      The official ECMWF page describes Magics as meteorological plotting software
      accessible directly through Python or Fortran interfaces or through Metview. The
      project supports meteorological-specific plot types including contours, wind
      fields, observations, satellite images, symbols, axes, text, and graphs.
    - >
      Its visible release history predates the public GitHub mirror. The ECMWF
      Confluence release list includes Magics 2.x tarballs in 2012, the 2.22 series
      moving installation to CMake in 2015, Magics 3.0.0 becoming Python 3 ready in
      December 2017, and Magics 4.0.0 as a production release in February 2019.
  related-projects:
    - ecCodes handles GRIB data used by Magics.
    - Metview can use Magics for plotting.
    - magics-python provides the Python interface to the Magics plotting package.
  sources:
    - https://confluence.ecmwf.int/display/MAGP/Magics
    - https://github.com/ecmwf/magics
    - https://github.com/ecmwf/magics-python
    - https://github.com/ecmwf/magics/blob/develop/INSTALL
    - source_facts.package-manager
  summary:
    - >
      Magics is ECMWF's meteorological plotting package for visualising weather and
      climate data. It supports GRIB, NetCDF, BUFR, and ODB data and produces map and
      chart output in formats such as PostScript, PDF, PNG, GIF, and SVG.
  timeline:
    - "2012: Magics 2.x source tarballs appear in ECMWF's release list."
    - '2015: Magics 2.22 installation changed to CMake.'
    - '2017: Magics 3.0.0 released as the first Python 3 ready version.'
    - '2019: Magics 4.0.0 production release published.'
    - '2025: Magics 4.16.0 source tarball published on ECMWF Confluence.'
  usage:
    - >
      Users call Magics through Python, Fortran, Metview, or command-line helpers to
      produce meteorological plots from GRIB, BUFR, NetCDF, ODB, and gridded fields. It
      is infrastructure-like plotting software rather than a single-purpose command.
    - >
      Package-manager users usually care that the native Magics libraries and data files
      are present because higher-level ECMWF tools, notebooks, and Python bindings
      depend on them.
related-packages:
  - id: brew:eccodes
    reason: >
      Use ecCodes alongside Magics to decode and encode the GRIB and BUFR meteorological
      messages that Magics consumes for plotting.
    rel: adjacent_workflow
    sources:
      - https://confluence.ecmwf.int/spaces/MAGP/overview
      - https://confluence.ecmwf.int/spaces/ECC/overview
  - id: brew:metview
    reason: >
      Choose Metview when you want an interactive meteorological workstation that uses
      Magics as part of its visualization workflow.
    rel: adjacent_workflow
    sources:
      - https://confluence.ecmwf.int/spaces/MAGP/overview
      - https://metview.readthedocs.io/en/latest/
category: science
package-manager:
  brew: magics
  debian: libmagics++-data
  ubuntu: libmagics++-data
package-manager-url: https://formulae.brew.sh/formula/magics
license: Apache-2.0
tags:
  - cli
  - ecmwf
  - meteorology
  - plotting
  - scientific-data
  - visualization
description: ECMWF's meteorological plotting software
executables:
  - magics
  - magicsCompatibilityChecker
  - magjson
  - magjsonx
  - magml
  - magmlx
  - metgram
  - metgram.sh
  - metgramx
provenance:
  formula: magics
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
