history:
  adoption-history:
    - >
      The project homepage describes Jasmin as the de-facto standard Java assembly
      format, used in compiler classes and cloned or ported multiple times. That
      adoption reflects its niche: a readable interchange and teaching syntax for people
      who need to reason about JVM class files directly.
  package-nerd-significance:
    - >
      For package collectors, Jasmin is a small but historically dense JVM tool: it
      preserves an early Java-era bytecode workflow, predates many modern bytecode
      libraries, and remains useful for compiler courses, verifier tests,
      reverse-engineering experiments, and hand-crafted class-file examples.
  project-history:
    - >
      Jasmin was created by Jon Meyer as a companion tool for the O'Reilly book "Java
      Virtual Machine" by Meyer and Troy Downing. The documentation dated July 1996
      describes version 1.0 and presents the tool as a simple assembler that
      intentionally maps closely to Java class-file conventions rather than acting like
      a macro assembler.
    - >
      The SourceForge project later hosted the continuing open-source code. Version 2
      added JasminXT, defined by Daniel Reynaud, to expose lower-level bytecode control
      such as bytecode version directives, offsets, StackMap support, annotations,
      attributes, and newer JVM access flags.
  related-projects:
    - >
      Jasmin is directly tied to the JVM class-file format and the O'Reilly "Java
      Virtual Machine" book. JasminXT was defined for the tinapoc Java
      reverse-engineering toolkit and extends the original assembler language for
      verifier and virtual-machine test cases.
  sources:
    - https://jasmin.sourceforge.net/
    - https://jasmin.sourceforge.net/guide.html
    - https://jasmin.sourceforge.net/xt.html
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      Jasmin is an assembler for the Java Virtual Machine that turns a textual,
      assembler-like description of a Java class into a binary .class file. Its
      importance comes from being one of the earliest practical ways to write, inspect,
      teach, and generate JVM bytecode outside the Java compiler.
  timeline:
    - "1996: Jonathan Meyer's Jasmin user guide documents version 1.0."
    - >
      2004: The SourceForge homepage identifies Jasmin as continuing as an open-source
      project.
    - '2006: JasminXT documents the version 2.0 language extension for lower-level JVM control.'
    - >
      Jasmin 2.1-2.4: JasminXT gains invokedynamic, StackMapTable, Unicode escapes,
      diagnostics fixes, and dynamic compiler class creation.
  usage:
    - >
      Users write .j files containing class directives, field definitions, method
      bodies, labels, and JVM instructions, then run the jasmin executable or jar to
      emit .class files. The guide emphasizes direct control and compact syntax, while
      noting that Jasmin deliberately does little compile-time validation of referenced
      classes or type descriptors.
