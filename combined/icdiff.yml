id: brew:icdiff
display-name: icdiff
homepage: https://www.jefftk.com/icdiff
repo: https://github.com/jeffkaufman/icdiff
docs:
  - https://www.jefftk.com/icdiff
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through pip, apt, Homebrew, AUR, and Nix, and
      gives integration recipes for Git, Subversion, and Mercurial. The Homebrew package
      also installs `git-icdiff`, making it a convenient drop-in visual diff helper for
      version-control users.
  package-nerd-significance:
    - >
      icdiff is a compact example of package-manager value: a single-purpose terminal UX
      improvement that spreads through many ecosystems because developers repeatedly
      want readable diffs without adopting a full graphical merge tool.
  project-history:
    - >
      Jeff Kaufman's project page frames icdiff as a focused improvement over plain
      terminal `diff`: color and side-by-side layout for cases where similar lines are
      hard to compare. The README says the file is derived from Python's
      `difflib.HtmlDiff`, released under the same Python license.
    - >
      The changelog begins with 1.0.0 as the first release and then records a long line
      of practical terminal and VCS improvements: recursive directory diffs, Unicode and
      fullwidth-character handling, Git integration, Subversion support, configurable
      colors, labels, line numbers, Python 3 cleanup, and process-exit behavior.
  related-projects:
    - >
      Related tools and workflows include Python `difflib`, Unix `diff`, Git difftool,
      Subversion diff commands, Mercurial extdiff, and other terminal visual diff tools.
  sources:
    - https://formulae.brew.sh/formula/icdiff
    - https://github.com/jeffkaufman/icdiff
    - https://raw.githubusercontent.com/jeffkaufman/icdiff/master/ChangeLog
    - https://www.jefftk.com/icdiff
  summary:
    - >
      icdiff is a Python command-line diff viewer that presents side-by-side,
      color-highlighted differences in a terminal. Its goal is not to replace every diff
      workflow, but to make small intra-line changes easier to see.
  timeline:
    - '1.0.0: First release recorded in the changelog.'
    - '1.2.0: Recursive directory diff support added.'
    - '1.5.3: Subversion difftool support added.'
    - '1.9.2: Configurable colors, git configuration, and cleaner errors added.'
    - '2.0.0: Python 2 support dropped and long-line handling improved.'
    - '2.0.10: Terminal width detection regression reverted.'
  usage:
    - >
      The direct command form is `icdiff [options] left_file right_file`. It can also be
      used as `git difftool --extcmd icdiff`, as `git icdiff` through the helper script,
      as an SVN diff command, or as a Mercurial extdiff command.
related-packages:
  - id: brew:git-delta
    reason: >
      Choose delta when you primarily want a syntax-highlighting pager for Git diff,
      blame, and grep output; choose icdiff for a simpler direct two-column comparison
      of arbitrary files.
    rel: alternative
    sources:
      - https://dandavison.github.io/delta/introduction.html
      - https://dandavison.github.io/delta/features.html
      - https://github.com/jeffkaufman/icdiff#readme
  - id: brew:difftastic
    reason: >
      Choose Difftastic when syntax-aware structural comparison should ignore
      formatting-only changes; choose icdiff for language-independent, line-oriented
      side-by-side output.
    rel: alternative
    sources:
      - https://difftastic.wilfred.me.uk/
      - https://github.com/jeffkaufman/icdiff#readme
  - id: brew:git
    reason: >
      icdiff includes a `git-icdiff` helper and documents Git difftool integration,
      letting Git select repository changes while icdiff renders each comparison.
    rel: adjacent_workflow
    sources:
      - https://github.com/jeffkaufman/icdiff#readme
      - https://git-scm.com/docs/git-difftool
category: developer-tools
package-manager:
  apk: icdiff
  brew: icdiff
  debian: icdiff
  macports: icdiff
  nix: icdiff
  ubuntu: icdiff
package-manager-url: https://formulae.brew.sh/formula/icdiff
license: PSF-2.0
tags:
  - cli
  - colorized-output
  - developer-tools
  - diff
  - terminal
description: Improved colored diff
executables:
  - git-icdiff
  - icdiff
provenance:
  formula: icdiff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
