id: brew:elvish
display-name: Elvish
homepage: https://elv.sh/
repo: https://github.com/elves/elvish
docs:
  - https://elv.sh/learn
  - https://elv.sh/ref
config-file-location:
  unix:
    - ~/.config/elvish/rc.elv
    - ~/.config/elvish/lib/*.elv
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption has been strongest among shell users interested in a more structured
      alternative to traditional POSIX-family shells. The official README points to
      packaging status, package/tool lists, and multiple community chat channels, while
      the input package facts show it packaged across Homebrew, Debian, Fedora, Arch,
      Nix, MacPorts, Scoop, winget, and other systems.
  package-nerd-significance:
    - >
      Elvish is interesting in package-manager terms because it is a single shell binary
      with cross-platform packaging but a non-POSIX language model. Installing it from a
      package manager is often the first experiment: users can try a modern shell
      without replacing system sh, then choose whether to adopt its rc.elv and library
      conventions.
  project-history:
    - >
      Elvish has developed as a pre-1.0 shell that accepts breaking changes while
      remaining usable for scripting and interactive work. Its release notes show a
      long-running sequence from older 0.x releases to 0.21.0 in 2024, with the project
      explicitly warning users that compatibility can still change before 1.0.
  related-projects:
    - >
      Elvish belongs to the family of alternative shells such as fish, nushell, and
      xonsh, but its official documentation emphasizes its own typed value model,
      lexical scoping, and interactive shell features rather than POSIX compatibility.
  sources:
    - https://github.com/elves/elvish#readme
    - https://elv.sh/ref/command.html
    - https://elv.sh/ref/language.html
    - https://elv.sh/blog/
    - https://github.com/elves/elvish/releases
  summary:
    - >
      Elvish is a Unix-style interactive shell and scripting language with structured
      values, lexical scoping, and built-in interactive features. The project describes
      itself as both a powerful scripting language and a shell, distributed as a
      statically linked binary for Linux, BSDs, macOS, and Windows.
  timeline:
    - '2021: Elvish 0.17.0 release notes are published.'
    - '2022: Elvish 0.18.0 release notes are published.'
    - '2023: Elvish 0.19.1 release notes are published.'
    - '2024: Elvish 0.20.x and 0.21.0 release notes are published.'
  usage:
    - >
      Elvish is used either as a login-style interactive shell or as a scripting
      language. Users customize interactive startup with rc.elv under the XDG config
      directory, keep libraries under elvish/lib search paths, and write scripts that
      can use Elvish's value channels, maps, functions, exceptions, and pipelines.
related-packages:
  - id: brew:fish
    reason: >
      Choose fish when you want a user-friendly interactive shell with autosuggestions
      and completions while retaining a more conventional string-oriented shell model
      than Elvish's structured values.
    rel: alternative
    sources:
      - https://elv.sh/
      - https://fishshell.com/
  - id: brew:nushell
    reason: >
      Choose Nushell when your primary goal is treating command output as table-shaped
      structured data with pipeline operations designed around records and columns.
    rel: alternative
    sources:
      - https://elv.sh/
      - https://www.nushell.sh/book/
  - id: brew:xonsh
    reason: >
      Choose Xonsh when you want an interactive shell whose language and extension
      ecosystem are based directly on Python rather than Elvish's purpose-built
      language.
    rel: alternative
    sources:
      - https://elv.sh/
      - https://xon.sh/contents.html
category: system
package-manager:
  apk: elvish
  brew: elvish
  debian: elvish
  dnf: elvish
  macports: elvish
  nix: elvish
  pacman: elvish
  scoop: main/elvish
  ubuntu: elvish
  winget: elves.elvish
package-manager-url: https://formulae.brew.sh/formula/elvish
license: BSD-2-Clause
tags:
  - cli
  - interactive-shell
  - scripting-language
  - shell
description: Friendly and expressive shell
executables:
  - elvish
provenance:
  formula: elvish
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
