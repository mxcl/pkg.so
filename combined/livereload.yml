id: brew:livereload
display-name: Python LiveReload
homepage: https://livereload.readthedocs.io/en/latest/
repo: https://github.com/lepture/python-livereload
docs:
  - https://livereload.readthedocs.io/en/stable
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LiveReload as a workflow spread across browser extensions, JavaScript clients,
      Ruby tools, Grunt watchers, and Python tools. The livereload-js project lists
      python-livereload among available servers for the LiveReload protocol.
    - >
      Within Python, adoption centered on developers who wanted live refresh for static
      files, Sphinx docs, Flask, Bottle, and Django without adopting a full JavaScript
      dev-server stack.
  package-nerd-significance:
    - >
      The Homebrew formula is notable because a Python web-development helper is
      packaged as a system command, not just as a PyPI library. It sits in the older
      generation of live-reload tooling before Vite-style JavaScript dev servers became
      the default for many front-end projects.
    - >
      It is also a small example of protocol compatibility mattering in packaging: the
      Python server, livereload.js, browser extensions, and the conventional port 35729
      all have to line up for the developer experience to feel automatic.
  project-history:
    - >
      The python-livereload repository was created on May 3, 2012. Author Hsiaoming Yang
      wrote in 2013 that the first version was released on May 4, 2012, and that the
      project was later reshaped around a simpler server/library model.
    - >
      Version 2.0 changed the tool's direction. The author described it as more of a
      library than an application, with compilers and a standalone command-line tool
      removed at that point so that livereload could focus on serving reload
      notifications and running shell commands supplied by users. The stable
      documentation later shows the command-line utility restored for starting a server
      in a directory.
  related-projects:
    - >
      Related projects include the original LiveReload app, livereload-js, browser
      extensions, guard-livereload, rack-livereload, grunt-contrib-watch, Sphinx, Flask,
      Bottle, and Django.
  sources:
    - https://api.github.com/repos/lepture/python-livereload
    - https://github.com/lepture/python-livereload
    - https://github.com/livereload/livereload-js
    - https://lepture.com/en/2013/new-life-of-livereload
    - https://livereload.readthedocs.io/en/stable/
  summary:
    - >
      Python LiveReload is a Python implementation of the LiveReload development
      workflow: watch local files, serve a development site, and tell the browser to
      refresh when assets change. It brought the LiveReload idea into Python web stacks
      and static documentation workflows.
  timeline:
    - '2012-05-03: The lepture/python-livereload GitHub repository was created.'
    - '2012-05-04: The author identified this as the first Python LiveReload release date.'
    - >
      2013: The documentation copyright and author blog reflect the project's early
      Python 2.x-era documentation and redesign.
    - '2013: Version 2.0 was described by the author as a library-focused redesign.'
    - '2024-12-18: The GitHub repository listed v2.7.1 as a release.'
  usage:
    - >
      The documented CLI starts a server for a watched directory and listens on port
      35729 for LiveReload browser integrations. The Python API exposes Server.watch for
      files, directories, and glob patterns, and can run shell commands such as
      rebuilding CSS or Sphinx documentation before reloading.
    - >
      Framework integrations cover Django management commands and simple WSGI wrapping
      for Flask and Bottle, which made it useful for small Python web projects and
      documentation sites.
related-packages: []
category: developer-tools
