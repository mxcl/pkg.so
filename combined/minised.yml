id: brew:minised
display-name: minised
homepage: https://exactcode.com/opensource/minised/
repo: http://svn.exactcode.de/minised/trunk
docs:
  - https://exactcode.com/opensource/minised
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project was revived for embedded use, especially with dietlibc, after
      ExactCODE found Raymond's implementation handy but buggy and no longer actively
      maintained. ExactCODE continued maintenance with fixes, cleanups, speedups,
      missing features, POSIX-conformance work, and a regression test suite. Its release
      archive shows roots in `sed-1.1` from 1995, `sed-1.3` from 1999, `sed-1.4` from
      2003, minised-branded releases through the 2000s and 2010s, and version 1.16 in
      2021.
  sources:
    - http://svn.exactcode.de/minised/trunk
    - https://exactcode.com/opensource/minised/
    - https://formulae.brew.sh/api/formula/minised.json
    - https://formulae.brew.sh/formula/minised
  summary:
    - >
      minised is ExactCODE's maintained descendant of a small historical sed
      implementation associated with Eric S. Raymond. ExactCODE describes the project as
      a smaller, cheaper, faster sed implementation that Minix used and that GNU once
      used before building its own sed around a larger regular-expression package.
  usage:
    - >
      The package-manager niche is deliberately narrow: a tiny stream editor for systems
      where GNU sed is bigger than needed, plus a historical Unix text-processing
      implementation for people who want a small BSD-licensed `sed` executable. Homebrew
      ships it as `minised` with no runtime dependencies.
related-packages:
  - id: brew:gnu-sed
    reason: >
      Choose GNU sed when scripts require GNU extensions or comprehensive maintained
      documentation; choose minised when a smaller BSD-licensed implementation for
      embedded or minimal systems is the priority.
    rel: alternative
    sources:
      - https://exactcode.com/opensource/minised/
      - https://www.gnu.org/software/sed/
      - https://www.gnu.org/software/sed/manual/sed.html
category: developer-tools
package-manager:
  brew: minised
package-manager-url: https://formulae.brew.sh/formula/minised
license: BSD-3-Clause
tags:
  - cli
  - sed
  - stream-editor
  - text-processing
  - unix
description: Smaller, cheaper, faster SED implementation
executables:
  - minised
provenance:
  formula: minised
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
