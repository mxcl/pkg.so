id: brew:fennel-ls
display-name: fennel-ls
homepage: https://git.sr.ht/~xerool/fennel-ls/
repo: https://git.sr.ht/~xerool/fennel-ls
docs:
  - https://xerool.net/fennel-ls/docs/installation.html
  - https://xerool.net/fennel-ls/docs/manual.html
  - https://git.sr.ht/~xerool/fennel-ls
config-file-location:
  unix: <project-root>/flsproject.fnl
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata shows fennel-ls packaged by Homebrew and Nix,
      reflecting adoption by editor and language-tooling users who want LSP support
      through package managers.
  package-nerd-significance:
    - >
      fennel-ls matters in package-manager culture because it turns a niche Lisp-to-Lua
      language into a standard editor integration target through the Language Server
      Protocol.
  project-history:
    - >
      The official sourcehut repository identifies fennel-ls as a Language Server for
      Fennel and exposes the HTTPS clone URL for the canonical source repository.
  related-projects:
    - Fennel and Lua are the language ecosystems served by fennel-ls.
    - Language Server Protocol clients consume fennel-ls in editors.
  sources:
    - Official fennel-ls installation and manual pages.
    - Official sourcehut repository page for ~xerool/fennel-ls.
    - Official sourcehut tags/log.
    - input.source_facts.package-manager
  summary:
    - fennel-ls is a language server for Fennel, the Lisp dialect that compiles to Lua.
  timeline:
    - '2026: Official sourcehut log shows active commits on the main branch.'
    - '2026: Tags listed by the official repository include the 0.2.x series.'
  usage:
    - >
      Users install the `fennel-ls` executable and configure per-project behavior with
      `flsproject.fnl`, as documented by the official manual and installation pages.
related-packages:
  - id: brew:fennel
    reason: >
      fennel-ls analyzes Fennel source and reports Fennel compiler errors, so the Fennel
      compiler and REPL are its direct language-toolchain companion.
    rel: adjacent_workflow
    sources:
      - https://xerool.net/fennel-ls/docs/manual.html
      - https://fennel-lang.org/
category: developer-tools
package-manager:
  brew: fennel-ls
  nix: fennel-ls
package-manager-url: https://formulae.brew.sh/formula/fennel-ls
license: MIT
tags:
  - cli
  - developer-tools
  - fennel
  - language-server
  - lsp
  - lua
description: Language Server for Fennel
executables:
  - fennel-ls
provenance:
  formula: fennel-ls
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
