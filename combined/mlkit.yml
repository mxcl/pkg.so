id: brew:mlkit
display-name: MLKit
homepage: https://melsman.github.io/mlkit
repo: https://github.com/melsman/mlkit
docs:
  - https://elsman.com/mlkit
  - https://melsman.github.io/mlkit
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The later MLKit project became a compiler toolkit for Standard ML with two main
      compiler paths sharing a frontend and compilation-management scheme: MLKit with
      Regions, with a native x64 backend based on region inference, and SMLtoJs, a
      JavaScript backend for browser-targeted Standard ML. Its documentation says it
      covers all of Standard ML from the 1997 Definition and most of the Standard ML
      Basis Library.
  sources:
    - https://elsman.com/mlkit/papers
    - https://elsman.com/mlkit/pdf/kit.pdf
    - https://formulae.brew.sh/formula/mlkit
    - https://github.com/melsman/mlkit
    - https://groups.google.com/g/comp.compilers/c/my2OjNZxT20
    - https://raw.githubusercontent.com/melsman/mlkit/master/README.md
  summary:
    - >
      MLKit descends from The ML Kit, Version 1, announced by Mads Tofte on 1993-03-12
      and attributed there to Nick Rothwell, David N. Turner, Mads Tofte, and Lars
      Birkedal at Edinburgh and Copenhagen Universities. That early release was
      distributed with about 100 pages of documentation explaining how to build, run,
      read, and modify the Kit, making it both a Standard ML implementation and a
      compiler-hacking vehicle.
  usage:
    - >
      MLKit's distinctive technical role is region-based memory management for ML. The
      project documentation describes compiler-inferred allocation and deallocation
      directives, region profiling, C interoperation, and optional reference-tracing
      garbage collection on top of region inference. In practice it is used both as an
      SML compiler and as a research/development tool for region inference,
      SML-to-JavaScript compilation, bootstrapping, ML Basis files, and compatibility
      work alongside tools such as MLton and smlpkg.
related-packages:
  - id: brew:mlton
    reason: >
      Choose MLton when standalone executable performance and aggressive whole-program
      optimization matter more than MLKit's region-inference focus; both support ML
      Basis files.
    rel: alternative
    sources:
      - https://melsman.github.io/mlkit/
      - https://www.mlton.org/Documentation
  - id: brew:smlnj
    reason: >
      Choose Standard ML of New Jersey for its interactive programming environment and
      extensive bundled SML tools instead of MLKit's region-oriented native compiler.
    rel: alternative
    sources:
      - https://melsman.github.io/mlkit/
      - https://www.smlnj.org/
  - id: brew:polyml
    reason: >
      Choose Poly/ML for an interactive Standard ML implementation and runtime commonly
      used by large symbolic applications, rather than MLKit's region-based toolchain.
    rel: alternative
    sources:
      - https://melsman.github.io/mlkit/
      - https://www.polyml.org/
category: language-runtime
