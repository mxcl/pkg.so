id: brew:autocycler
display-name: Autocycler
homepage: https://github.com/rrwick/Autocycler
repo: https://github.com/rrwick/Autocycler
docs:
  - https://github.com/rrwick/Autocycler/wiki
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Autocycler's adoption path is academic and bioinformatics-oriented: the README
      asks research users to cite the Bioinformatics paper, the wiki provides workflows
      for automated and manually curated assemblies, and the installation docs mention
      Bioconda in addition to pre-built binaries.
    - >
      Its scope is intentionally narrower than general genome assembly: the wiki says it
      aims to produce complete bacterial genome assemblies and requires input assemblies
      that are mostly or ideally all complete.
  package-nerd-significance:
    - >
      Autocycler is notable for packaging a modern Rust bioinformatics executable whose
      usefulness depends on a surrounding toolchain of long-read assemblers. The binary
      itself is standalone, but real-world workflows often rely on conda environments,
      Dockerfiles or pipeline scripts to assemble the full stack.
    - >
      For package databases, it is a good example of a domain-specific CLI where the
      Homebrew formula exposes only one executable while the official docs point to
      Bioconda and custom environments for complete scientific workflows.
  project-history:
    - >
      The GitHub repository was created on 2023-11-10 and the first public GitHub
      release, v0.1.0, was published on 2024-11-11. The README describes Autocycler as
      the successor to Trycycler and says most users should prefer Autocycler over
      Trycycler.
    - >
      In 2025, Wick, Howden and Stinear published the Autocycler paper in
      Bioinformatics, giving the project a formal citation path for research use. By
      2026 the project had reached v0.6.2, published on 2026-04-14.
  related-projects:
    - The README identifies Trycycler as Autocycler's predecessor.
    - >
      The wiki's automated workflow references long-read assemblers including canu,
      flye, metamdbg, miniasm, necat, nextdenovo, plassembler and raven.
  sources:
    - https://api.github.com/repos/rrwick/Autocycler
    - https://api.github.com/repos/rrwick/Autocycler/releases
    - https://doi.org/10.1093/bioinformatics/btaf474
    - https://github.com/rrwick/Autocycler#readme
    - https://github.com/rrwick/Autocycler/wiki
  summary:
    - >
      Autocycler is a Rust command-line tool for generating consensus long-read
      bacterial genome assemblies from multiple alternative assemblies.
  timeline:
    - '2023: GitHub repository created on 2023-11-10.'
    - '2024: v0.1.0 released on 2024-11-11.'
    - '2025: Autocycler paper published in Bioinformatics.'
    - '2026: v0.6.2 released on 2026-04-14.'
  usage:
    - >
      The wiki describes a multi-step workflow: subsample reads, generate several input
      assemblies with supported long-read assemblers, compress assemblies into a unitig
      graph, cluster contigs, trim and resolve clusters, then combine resolved clusters
      into consensus_assembly.fasta.
    - >
      For minimal setup, the very quick start points users at a conda environment and an
      automated Bash pipeline that runs the full process with reads.fastq.gz, thread
      count and parallel job count.
related-packages:
  - id: brew:flye
    reason: >
      Flye can generate long-read input assemblies that Autocycler then combines into a
      consensus bacterial-genome assembly.
    rel: adjacent_workflow
    sources:
      - https://github.com/rrwick/Autocycler/wiki/Generating-input-assemblies
      - https://github.com/mikolmogorov/Flye
category: science
package-manager:
  brew: autocycler
package-manager-url: https://formulae.brew.sh/formula/autocycler
license: GPL-3.0-or-later
tags:
  - assembly
  - bioinformatics
  - cli
  - genome
  - long-read-sequencing
description: Tool for generating consensus long-read assemblies for bacterial genomes
executables:
  - autocycler
provenance:
  formula: autocycler
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
