id: brew:cyme
display-name: cyme
homepage: https://github.com/tuna-f1sh/cyme
repo: https://github.com/tuna-f1sh/cyme
docs:
  - https://github.com/tuna-f1sh/cyme#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/cyme/cyme.json
    - ~/.config/cyme/cyme.json
  macos: ~/Library/Application Support/cyme/cyme.json
  windows: '{FOLDERID_RoamingAppData}/cyme/cyme.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      cyme's README documents installation through Homebrew, Arch Linux, release
      binaries, and cargo. The input package facts also show distribution through
      several package managers, which matches the tool's cross-platform system-utility
      niche.
  package-nerd-significance:
    - >
      cyme is notable as a modern replacement for a classic Unix hardware-inspection
      command. Package maintainers care about that kind of tool because it is small,
      terminal-native, cross-platform, and useful for debugging hardware without pulling
      in a large desktop stack.
  project-history:
    - >
      The official README gives a unusually clear origin story: the author used USB
      listing tools frequently while developing embedded devices and started cyme as a
      quick replacement for a barely working macOS lsusb script and as a Rust refresher
      project.
    - >
      The tool began as a macOS system_profiler parser, then grew a libusb-based
      profiler for full descriptors, and later defaulted to a pure Rust profiler using
      nusb. That progression explains the package's practical shape: a
      compatibility-minded CLI that also wants to be more pleasant than traditional
      lsusb output.
  related-projects:
    - lsusb from usbutils is the compatibility reference point.
    - >
      libusb, nusb, udevrs, and macOS system_profiler are official README-listed
      profiling backends or influences.
  sources:
    - https://github.com/tuna-f1sh/cyme
    - https://github.com/tuna-f1sh/cyme#readme
    - https://docs.rs/cyme/latest/cyme/
    - https://api.github.com/repos/tuna-f1sh/cyme
    - https://api.github.com/repos/tuna-f1sh/cyme/releases?per_page=10
    - https://api.github.com/repos/tuna-f1sh/cyme/tags?per_page=100
  summary:
    - >
      cyme is a Rust CLI for listing USB buses and devices across Linux, macOS, and
      Windows. It positions itself as a modern, cross-platform lsusb-compatible tool
      with richer tree, JSON, filtering, and terminal-display behavior.
  timeline:
    - '2022: tuna-f1sh/cyme repository created on GitHub.'
    - '2022: Early 0.1.x tags appear in the repository tag history.'
    - '2026: cyme 3.0.0 and 3.0.1 releases published, continuing the Rust-native profiler line.'
  usage:
    - >
      Users run cyme to inspect USB topology, export JSON, filter by vendor or class,
      mask serial numbers before sharing dumps, or alias lsusb to cyme --lsusb on
      systems where traditional lsusb is missing or weak. The watch subcommand covers
      hotplug monitoring and live display customization.
related-packages:
  - id: brew:usbutils
    reason: >
      Choose usbutils for the traditional Linux/BSD `lsusb` toolkit; choose cyme when
      cross-platform support, structured JSON, richer trees, or live hotplug monitoring
      is needed.
    rel: alternative
    sources:
      - https://github.com/tuna-f1sh/cyme#readme
      - https://git.kernel.org/pub/scm/linux/kernel/git/gregkh/usbutils.git/plain/README.md
category: system
package-manager:
  apk: cyme
  brew: cyme
  debian: cyme
  nix: cyme
  pacman: cyme
  scoop: main/cyme
  winget: tuna-f1sh.cyme
package-manager-url: https://formulae.brew.sh/formula/cyme
license: GPL-3.0-or-later
tags:
  - cli
  - hardware
  - lsusb
  - rust
  - system-profiler
  - usb
description: List system USB buses and devices
executables:
  - cyme
provenance:
  formula: cyme
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
