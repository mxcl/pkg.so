id: brew:aicommit2
display-name: aicommit2
homepage: https://github.com/tak-bro/aicommit2
repo: https://github.com/tak-bro/aicommit2
docs:
  - https://github.com/tak-bro/aicommit2/blob/main/docs/settings.md
  - https://github.com/tak-bro/aicommit2
config-file-location:
  unix:
    - $AICOMMIT_CONFIG_PATH
    - $XDG_CONFIG_HOME/aicommit2/config.ini
    - ~/.config/aicommit2/config.ini
    - ~/.aicommit2
credentials-file-location:
  unix:
    - $AICOMMIT_CONFIG_PATH
    - $XDG_CONFIG_HOME/aicommit2/config.ini
    - ~/.config/aicommit2/config.ini
    - ~/.aicommit2
history:
  adoption-history:
    - >
      Official install paths include npm, Homebrew, and Nix. The README advertises both
      npm and Homebrew badges, and the Homebrew formula describes it as a reactive CLI
      for Git and Jujutsu commit messages.
    - >
      Homebrew analytics for the formula reported 1,842 installs over 365 days at the
      time checked, while the npm registry showed 155 published versions and latest
      version 2.6.1.
  package-nerd-significance:
    - >
      aicommit2 is part of the post-ChatGPT wave of small, global CLI tools that wrap
      Git workflows with LLM calls. It is interesting beside aicommits because it shows
      a package evolving from single-purpose commit generation into a multi-provider,
      multi-VCS terminal assistant while still installing as one small executable.
  project-history:
    - >
      The project positions itself as a successor-style tool in the AI commit-message
      niche: the README explicitly says AICommits inspired its core functionality and
      architecture. The npm registry records the aicommit2 package as created in July
      2023, while the current GitHub repository record dates the public repository to
      January 2024.
    - >
      Later development emphasized provider breadth, reactive selection among generated
      messages, Jujutsu support, prepare-commit-msg hook usage, diff compression, and
      optional code review. The configuration documentation settled on an XDG-style INI
      file with a legacy dotfile fallback.
  related-projects:
    - aicommits, cited by aicommit2 as inspiration.
    - Git, YADM, and Jujutsu, the version-control systems aicommit2 targets.
    - Ollama and OpenAI-compatible APIs, supported provider families.
  sources:
    - https://formulae.brew.sh/api/formula/aicommit2.json
    - https://github.com/tak-bro/aicommit2
    - https://github.com/tak-bro/aicommit2/blob/main/docs/settings.md
    - https://registry.npmjs.org/aicommit2
  summary:
    - >
      aicommit2 is a Node-based command-line tool for generating commit messages and
      code-review text from version-control diffs. Its upstream README describes support
      for Git, YADM, and Jujutsu, plus cloud and local AI providers including OpenAI,
      Anthropic, Gemini, Mistral, Groq, Ollama, OpenRouter, and other OpenAI-compatible
      services.
  timeline:
    - '2023: npm package record for aicommit2 created.'
    - '2024: Current GitHub repository created.'
    - '2026: Homebrew formula and npm package list version 2.6.1 as stable/latest.'
  usage:
    - >
      Typical use is to stage changes and run `aicommit2`, or use the shorter `aic2`
      alias. Users configure at least one provider through `aicommit2 setup`, `aicommit2
      config set`, environment variables, or a config file.
    - >
      Package-manager users care about the config-path order because the same file can
      hold provider keys and model settings: `$AICOMMIT_CONFIG_PATH`, then XDG config,
      then `~/.aicommit2`.
related-packages:
  - id: brew:aicommits
    reason: >
      Choose aicommits for the simpler Git-focused tool that inspired aicommit2; choose
      aicommit2 for simultaneous provider requests, Jujutsu and YADM support, code
      review, and more extensive integrations.
    rel: alternative
    sources:
      - https://github.com/tak-bro/aicommit2
      - https://github.com/Nutlope/aicommits
  - id: brew:aicommit
    reason: >
      Choose Coder's aicommit for a compact Go executable that follows repository and
      user `COMMITS.md` style guides; choose aicommit2 for its broader provider and VCS
      support.
    rel: alternative
    sources:
      - https://github.com/tak-bro/aicommit2
      - https://github.com/coder/aicommit
  - id: brew:lazygit
    reason: >
      aicommit2 officially installs a LazyGit custom command so users can generate and
      select commit messages without leaving LazyGit's files panel.
    rel: adjacent_workflow
    sources:
      - https://github.com/tak-bro/aicommit2#lazygit
      - https://github.com/jesseduffield/lazygit
category: ai
package-manager:
  brew: aicommit2
package-manager-url: https://formulae.brew.sh/formula/aicommit2
license: MIT
tags:
  - ai
  - cli
  - commit-messages
  - git
  - jujutsu
description: Reactive CLI that generates commit messages for Git and Jujutsu with AI
executables:
  - aic2
  - aicommit2
provenance:
  formula: aicommit2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
