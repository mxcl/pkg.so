id: brew:jjui
display-name: Jujutsu UI
homepage: https://idursun.github.io/jjui/
repo: https://github.com/idursun/jjui
docs:
  - https://github.com/idursun/jjui#readme
  - https://idursun.github.io/jjui
config-file-location:
  unix:
    - ~/.config/jjui/config.toml
    - ~/.config/jjui/config.lua
    - .jjui/config.toml
    - .jjui/config.lua
  windows:
    - '%AppData%/jjui/config.toml'
    - '%AppData%/jjui/config.lua'
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata records `jjui` in Homebrew, MacPorts, Nix, Scoop, and
      Winget, which suggests quick packaging attention from the same audience adopting
      Jujutsu itself. The README also lists AUR packaging and a Nix flake path, showing
      that Unix package-manager users were part of the intended distribution model.
  package-nerd-significance:
    - >
      `jjui` matters as an ecosystem signal around Jujutsu. When a younger VCS attracts
      a dedicated TUI, packaged across several package managers, it shows users are
      building workflow-specific tools rather than treating the core CLI as a curiosity.
  project-history:
    - >
      The GitHub repository was created in September 2024. Its README presents the
      project as a personal-needs-driven TUI by Ibrahim Dursun, with an open invitation
      for feature requests and contributions.
    - >
      The README and generated documentation show the tool tracking Jujutsu's own
      evolution: it depends on a minimum supported `jj` version and exposes
      Jujutsu-native ideas such as revsets, operation logs, evologs, and bookmark
      movement through a Go terminal application.
  related-projects:
    - >
      `jjui` is directly tied to `jj`/Jujutsu. Related terminal tooling includes other
      VCS TUIs, but its command set is specifically organized around Jujutsu concepts
      such as revsets, operation logs, bookmarks, and revision changes.
  sources:
    - >
      Project README, project documentation site, GitHub repository metadata, GitHub
      release metadata, and Homebrew formula metadata.
  summary:
    - >
      Jujutsu UI, packaged as `jjui`, is a terminal user interface for the Jujutsu
      version-control system. It turns common `jj` actions such as revset browsing,
      rebasing, squashing, bookmark movement, operation-log inspection, previews, and
      revision-detail work into keyboard-driven terminal workflows.
  timeline:
    - '2024: The GitHub repository is created.'
    - '2024: Early version tags begin with v0.1.'
    - >
      2025: The README documents Homebrew, Winget, Scoop, AUR, Nix, Go install, source
      builds, and prebuilt release binaries as distribution paths.
    - '2026: The README records compatibility with `jj` v0.36 or newer.'
  usage:
    - >
      `jjui` is used inside a Jujutsu repository to inspect and edit the revision tree
      without memorizing every command-line form. It offers keyboard actions for
      rebasing, squashing, previewing diffs, moving bookmarks, opening the operation
      log, undoing and redoing operations, and jumping through revisions.
    - >
      It complements `jj` rather than replacing it: the README frames it as a UI for
      interacting with Jujutsu, and installation instructions still assume users have or
      use Jujutsu underneath.
related-packages:
  - id: brew:jj
    reason: Install jj as the underlying Jujutsu VCS that jjui invokes for repository operations.
    rel: adjacent_workflow
    sources:
      - https://github.com/idursun/jjui#readme
      - https://docs.jj-vcs.dev/latest/
  - id: brew:lazyjj
    reason: >
      Choose lazyjj as an alternative Jujutsu TUI when you prefer its Rust/Ratatui
      interface and configuration through jj's own config.
    rel: alternative
    sources:
      - https://github.com/idursun/jjui#readme
      - https://github.com/Cretezy/lazyjj/blob/main/README.md
category: developer-tools
package-manager:
  brew: jjui
  macports: jjui
  nix: jjui
  scoop: extras/jjui
  winget: IbrahimDursun.jjui
package-manager-url: https://formulae.brew.sh/formula/jjui
license: MIT
tags:
  - cli
  - go
  - jujutsu
  - terminal
  - tui
  - version-control
description: TUI for interacting with the Jujutsu version control system
executables:
  - jjui
provenance:
  formula: jjui
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
