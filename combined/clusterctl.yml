id: brew:clusterctl
display-name: clusterctl
homepage: https://cluster-api.sigs.k8s.io
repo: https://github.com/kubernetes-sigs/cluster-api
docs:
  - https://cluster-api.sigs.k8s.io/clusterctl/configuration
  - https://cluster-api.sigs.k8s.io/clusterctl/overview
config-file-location:
  unix: $XDG_CONFIG_HOME/cluster-api/clusterctl.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      clusterctl adoption follows Cluster API adoption across infrastructure providers.
      The docs describe default provider repositories sponsored by SIG Cluster Lifecycle
      and a provider contract that lets infrastructure, bootstrap, and control-plane
      providers publish release assets for clusterctl.
    - >
      The input package facts show distribution through Homebrew, Nix, winget, and
      zypper, which matches its role as a cross-platform Kubernetes operations CLI.
  package-nerd-significance:
    - >
      clusterctl matters to package maintainers because it is the small local binary
      that wires a large Kubernetes provider ecosystem together: it discovers releases,
      fetches YAML assets, talks to GitHub or Go proxies, and applies provider contracts
      across platforms.
    - >
      It is also a classic modern infrastructure CLI: a single executable distributed by
      OS package managers while its real work coordinates remote releases, Kubernetes
      manifests, and cluster lifecycle state.
  project-history:
    - >
      The Cluster API project was started by Kubernetes SIG Cluster Lifecycle to provide
      declarative APIs and tooling for provisioning, upgrading, and operating multiple
      Kubernetes clusters.
    - >
      clusterctl became the user-facing CLI for that project. The official docs say it
      handles the lifecycle of a Cluster API management cluster, provides a simple day-1
      experience, fetches provider component YAML, installs providers, and encodes best
      practices for provider management and upgrades.
  related-projects:
    - Cluster API is the parent project for clusterctl.
    - >
      kubeadm is discussed in the official Cluster API introduction as prior SIG Cluster
      Lifecycle tooling that reduced Kubernetes bootstrap complexity.
    - >
      Cluster API providers such as Cluster API Provider AWS implement the provider
      contracts that clusterctl consumes.
  sources:
    - https://cluster-api.sigs.k8s.io/introduction
    - https://cluster-api.sigs.k8s.io/clusterctl/overview
    - https://cluster-api.sigs.k8s.io/clusterctl/configuration
    - https://github.com/kubernetes-sigs/cluster-api/releases
  summary:
    - >
      clusterctl is the command-line tool for bootstrapping and managing Kubernetes
      Cluster API providers and management clusters.
  timeline:
    - '2019: Cluster API GitHub releases include early v0.1.x and v0.3.x releases.'
    - '2021: Cluster API v1.0.0 was published.'
    - '2024: Cluster API v1.7 and v1.8 release candidates were published.'
    - '2026: The Cluster API book documents v1.13 and current clusterctl behavior.'
  usage:
    - >
      Common commands include `clusterctl init` for management-cluster initialization,
      `clusterctl generate cluster` for workload-cluster templates, `clusterctl move`
      for moving Cluster API objects between management clusters, and `clusterctl
      upgrade plan/apply` for provider upgrades.
    - >
      clusterctl uses `$XDG_CONFIG_HOME/cluster-api/clusterctl.yaml` for provider
      repository configuration, variable substitution values, image overrides, and
      options such as log level or version-check behavior.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubectl is the practical companion for inspecting the management and workload
      clusters whose providers and lifecycle objects are initialized by clusterctl.
    rel: adjacent_workflow
    sources:
      - https://cluster-api.sigs.k8s.io/user/quick-start
      - https://kubernetes.io/docs/reference/kubectl/
category: cloud-infrastructure
package-manager:
  brew: clusterctl
  nix: clusterctl
  winget: Kubernetes.clusterctl
  zypper: clusterctl
package-manager-url: https://formulae.brew.sh/formula/clusterctl
license: Apache-2.0
tags:
  - cli
  - cluster-api
  - cluster-management
  - infrastructure
  - kubernetes
description: Home for the Cluster Management API work, a subproject of sig-cluster-lifecycle
executables:
  - clusterctl
provenance:
  formula: clusterctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
