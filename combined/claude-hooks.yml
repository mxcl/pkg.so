id: brew:claude-hooks
display-name: claude-hooks
homepage: https://github.com/johnlindquist/claude-hooks
repo: https://github.com/johnlindquist/claude-hooks
docs:
  - https://code.claude.com/docs/en/hooks
  - https://github.com/johnlindquist/claude-hooks#readme
config-file-location:
  unix: .claude/settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Distribution is source-backed through npm and Homebrew. The npm registry records
      32 versions and published version 2.4.0, while Homebrew packages the same 2.4.0
      release from the npm registry.
    - >
      The evidence supports a niche but clear role: claude-hooks is not a general Claude
      Code replacement; it is a helper for users who are already adopting Claude Code's
      official hook lifecycle and want TypeScript types and scaffolding.
  package-nerd-significance:
    - >
      claude-hooks is package-nerd interesting because it packages a type layer around
      an AI-agent lifecycle API. Instead of every team copying shell scripts and JSON
      snippets, it gives the hook surface a generated project structure and a
      package-manager install path.
    - >
      It also shows how fast companion packages formed around Claude Code's
      configuration files: the package's value is not the hook runtime itself, but the
      typed developer experience around an official extension point.
  project-history:
    - >
      The npm package was first published in July 2025, after Claude Code's hook system
      had become a documented extension point. The project focuses on one friction point
      in that system: turning JSON hook payloads and shell-command handlers into a typed
      TypeScript development environment.
    - >
      The README documents generated files under `.claude/hooks/`, including `index.ts`,
      `lib.ts`, and `session.ts`, plus `.claude/settings.json`. It also requires Node.js
      18+ for the CLI and Bun for running hooks.
  related-projects:
    - Claude Code's official hooks system is the extension point claude-hooks configures.
    - Bun is required by the README for running generated hooks.
    - TypeScript is the language layer used for typed payloads and handlers.
    - >
      claude-cmd and Claude Code Templates are related Claude Code configuration
      companion tools.
  sources:
    - https://github.com/johnlindquist/claude-hooks
    - https://registry.npmjs.org/claude-hooks
    - https://formulae.brew.sh/api/formula/claude-hooks.json
    - https://code.claude.com/docs/en/hooks.md
  summary:
    - >
      claude-hooks is a TypeScript-oriented setup tool for Claude Code hooks. Its
      official README describes it as a CLI that generates `.claude/settings.json` hook
      configuration and typed TypeScript handler files for Claude Code lifecycle events.
  timeline:
    - '2025-07: npm registry records the first `claude-hooks` publication.'
    - '2025-08: npm registry records published version 2.4.0 after 32 published versions.'
    - '2026: Homebrew formula `claude-hooks` packages version 2.4.0 from the npm registry.'
  usage:
    - >
      Users run `npx claude-hooks` or install it globally with npm, then run
      `claude-hooks`. The tool creates Claude Code hook configuration and TypeScript
      handlers that can inspect typed payloads for events such as PreToolUse,
      PostToolUse, Notification, and Stop.
    - >
      The official Claude Code hooks reference documents the underlying event model,
      including command, HTTP, prompt, and MCP hooks, matcher groups, JSON stdin
      payloads, and hook decisions. claude-hooks builds on that official mechanism.
related-packages:
  - id: cask:claude-code
    reason: >
      Claude Code provides the lifecycle events and reads the settings and hook commands
      generated by claude-hooks.
    rel: adjacent_workflow
    sources:
      - https://github.com/johnlindquist/claude-hooks#readme
      - https://code.claude.com/docs/en/hooks
  - id: brew:bun
    reason: The claude-hooks README requires Bun to execute the generated TypeScript hook handlers.
    rel: adjacent_workflow
    sources:
      - https://github.com/johnlindquist/claude-hooks#readme
      - https://bun.com/docs/runtime
  - id: brew:claudekit
    reason: >
      Choose claudekit instead when you want a ready-made collection of guardrail and
      workflow hooks rather than a minimal scaffold for writing your own typed handlers.
    rel: alternative
    sources:
      - https://github.com/johnlindquist/claude-hooks#readme
      - https://github.com/carlrannaberg/claudekit#readme
category: ai
package-manager:
  brew: claude-hooks
package-manager-url: https://formulae.brew.sh/formula/claude-hooks
license: MIT
tags:
  - ai
  - automation
  - claude-code
  - cli
  - hooks
  - typescript
description: Hook system for Claude Code
executables:
  - claude-hooks
provenance:
  formula: claude-hooks
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
