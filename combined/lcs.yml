homepage: https://sourceforge.net/projects/lcsgame/
repo: https://github.com/GregorStocks/lcsgame
docs:
  - https://sourceforge.net/projects/lcsgame
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LCS remained a niche package: culturally tied to Bay 12 Games and Dwarf Fortress
      fandom, technically tied to curses-style console play, and distributed through
      SourceForge rather than a mainstream game store. Homebrew packaging makes the Unix
      continuation easy to install as a terminal game.
  package-nerd-significance:
    - >
      LCS matters to package nerds as a preservation-flavored terminal game package: an
      early-2000s freeware game became GPL source, moved into community maintenance, and
      can still be built and distributed as a small command-line game.
    - >
      It is also a reminder that package managers carry odd cultural artifacts alongside
      compilers and daemons, including games whose main value is historical, satirical,
      or community-driven.
  project-history:
    - >
      Bay 12 Games' official page identifies the original game as `v3.09, Copyright (c)
      2002-6, Tarn Adams`, with Windows downloads posted in December 2002 and Linux
      downloads posted in June 2004. The same page says that starting with v3.05 the
      game was released under the GNU GPL.
    - >
      Bay 12 also points to a player group continuing LCS as an open-source project on
      SourceForge. SourceForge records the `lcsgame` project registration date as
      2007-06-15, and the repository changelog shows Jonathan Stickles and other
      contributors maintaining version 3.11.x work in July 2007.
  related-projects:
    - >
      Related projects and communities include Bay 12 Games, Dwarf Fortress,
      SourceForge-hosted LCS continuations, curses/PDCurses, SDL2 and SDL2_mixer build
      options, and classic terminal roguelike and strategy-game packaging.
  sources:
    - https://sourceforge.net/projects/lcsgame
    - https://sourceforge.net/projects/lcsgame/files/
    - https://svn.code.sf.net/p/lcsgame/code/trunk
    - https://svn.code.sf.net/p/lcsgame/code/trunk/ChangeLog
    - https://svn.code.sf.net/p/lcsgame/code/trunk/README
    - https://www.bay12games.com/lcs/
  summary:
    - >
      Liberal Crime Squad is a satirical, console-based political role-playing and
      strategy game. The Homebrew package installs the open-source continuation as the
      `crimesquad` executable.
  timeline:
    - '2002-12: Bay 12 Games posted the Windows v3.09 download.'
    - '2004-06: Bay 12 Games posted the Linux v3.09 download.'
    - '2004-08: Bay 12 Games page lists v3.09 as last updated in August 2004.'
    - '2007-06-15: SourceForge `lcsgame` project registered.'
    - '2007-07-14: SourceForge changelog records version 3.11.4 branch work.'
    - '2012-09-04: SourceForge files page lists a Windows 4.06 archive release timestamp.'
  usage:
    - >
      Typical use is simply launching `crimesquad` in a terminal. The SourceForge trunk
      includes build files, an `init.txt` configuration file, documentation, art assets,
      and platform-specific notes for Windows and Linux builds.
