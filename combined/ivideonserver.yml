history:
  adoption-history:
    - >
      Ivideon expanded its server software to macOS in 2012 after offering versions in
      its wider cloud-video-surveillance ecosystem. The current product is also
      documented for Windows and selected Linux distributions.
    - >
      Its hybrid storage model supports local archives, cloud archives on eligible
      plans, or both. Configuration backup and restoration through an Ivideon account
      helps move a camera server between computers.
  package-nerd-significance:
    - >
      The cask packages the ingest side of a cloud-assisted surveillance system, not the
      similarly named viewing client: Ivideon Server attaches webcams and third-party IP
      cameras to the Ivideon service and can retain recordings locally.
    - >
      It illustrates a packaging boundary common to device software: the desktop
      application, cloud account, camera protocols, local archive storage, and
      continuously running host all participate in one operational service.
  project-history:
    - >
      Ivideon announced Ivideon Server for Mac OS X on June 22, 2012, citing demand from
      users of its Apple mobile applications.
    - >
      The server evolved into cross-platform software for connecting webcams and IP
      cameras, configuring continuous, scheduled, or detection-based recording, and
      storing archives locally or in Ivideon's cloud.
  related-projects:
    - >
      Ivideon Client is the companion viewer for live feeds and archives from cameras
      connected through Ivideon Server or cameras with built-in Ivideon software.
  sources:
    - https://support.ivideon.com/l_eng/knowledge_base/item/170102
    - https://support.ivideon.com/l_eng/knowledge_base/item/171646
    - https://support.ivideon.com/l_eng/knowledge_base/item/171647
    - https://www.ivideon.com/blog/ivideon-server-for-mac-os-x/
    - https://www.ivideon.com/downloads/
  summary:
    - >
      Ivideon Server connects webcams and IP cameras to the Ivideon video-surveillance
      service and supports local, cloud, or combined video archives.
  timeline:
    - '2012: Ivideon announced the Mac OS X edition of Ivideon Server.'
    - >
      2024: The official downloads history recorded the 3.14 release line with
      multi-disk local archive recording.
  usage:
    - >
      Users install Ivideon Server on a computer that remains powered on, attach
      supported cameras, select recording rules and archive locations, and then view
      live or archived video through Ivideon services or clients.
    - >
      Official support documents a transferable `videoserverd.config` file but does not
      publish a stable macOS filesystem location for it, so no config path is asserted
      here. Account passwords are entered during setup or restoration, but no official
      credential-file location is documented.
