id: brew:lua-language-server
display-name: Lua Language Server
homepage: https://luals.github.io
repo: https://github.com/LuaLS/lua-language-server
docs:
  - https://luals.github.io/wiki
config-file-location:
  unix: .luarc.json
credentials-file-location: null
history:
  adoption-history:
    - >
      LuaLS adoption is visible through editor distribution. The official homepage shows
      Visual Studio Code install counts in the millions and gives install paths for VS
      Code, Neovim, JetBrains, and generic command-line/LSP clients. The supplied
      package-manager facts also show packaging across apk, Homebrew, Chocolatey,
      MacPorts, Nix, pacman, Scoop, winget, and zypper.
    - >
      The package became the default answer for Lua editor support because it speaks LSP
      instead of being bound to one editor. That let package managers distribute the
      same lua-language-server executable for Neovim, VS Code-adjacent setups, terminal
      editors, and custom LSP clients.
  package-nerd-significance:
    - >
      LuaLS matters to package nerds because it is a language-tooling package whose
      value depends on editor integration, binary distribution, and fast updates to
      match new Lua versions. The formula is not just a compiler or interpreter; it is
      the piece that makes Lua feel modern inside editors and CI-adjacent code-quality
      workflows.
  project-history:
    - >
      The project grew out of the VS Code extension historically published as
      sumneko.lua and evolved into the broader LuaLS project. The official LuaLS
      homepage describes it as a language server using the Language Server Protocol to
      make Lua development easier, safer, and faster in many editors, while the
      repository README links the language server to the website, changelog, wiki, issue
      tracker, and discussions.
    - >
      LuaLS is tightly coupled to modern editor workflows rather than to the Lua runtime
      itself. Its feature set tracks practical IDE needs: support for Lua 5.1 through
      Lua 5.5 and LuaJIT, annotations, dynamic type checking, syntax diagnostics,
      workspace libraries, formatting, custom plugins, translations, and generated
      documentation.
  related-projects:
    - Lua is the target language supported by LuaLS.
    - Language Server Protocol is the editor protocol LuaLS implements.
    - >
      Neovim, VS Code, JetBrains IDEs, coc.nvim, and Kakoune are documented client
      environments.
    - >
      EmmyLua is listed by the project as related credit material for annotation-style
      Lua tooling.
  sources:
    - https://luals.github.io/
    - https://luals.github.io/wiki/
    - https://luals.github.io/wiki/configuration/
    - https://raw.githubusercontent.com/LuaLS/lua-language-server/master/README.md
    - https://raw.githubusercontent.com/LuaLS/lua-language-server/master/changelog.md
    - source_facts.package-manager
  summary:
    - >
      Lua Language Server, commonly branded LuaLS, is the Language Server Protocol
      implementation for Lua. It brings editor features such as diagnostics, completion,
      hover, go-to-definition, annotations, formatting, library definitions, and
      documentation generation to Lua projects.
  timeline:
    - '2022: The changelog records the 3.6.x series and removal of telemetry in v3.6.5.'
    - '2026: The official changelog records Lua 5.5-related fixes in the 3.18.x series.'
    - >
      2026: Official homepage reports multi-million Visual Studio Code installs and
      documents installation for VS Code, Neovim, JetBrains, and other LSP clients.
  usage:
    - >
      Users install the lua-language-server executable and point an LSP client at it.
      Configuration can come from an explicit --configpath, a workspace .luarc.json
      file, or settings sent by the LSP client. The official docs recommend .luarc.json
      for configuration shared across clients and show examples for VS Code, Neovim,
      coc.nvim, and Kakoune.
    - >
      Typical package-manager usage is installing the binary into PATH and letting
      editor configuration discover it. Project teams add .luarc.json when they need
      shared runtime version, library paths, diagnostics settings, or hints.
related-packages:
  - id: brew:lua
    reason: >
      Install the mainline Lua runtime alongside LuaLS when developing or running
      standard Lua programs whose runtime version and libraries the server models.
    rel: adjacent_workflow
    sources:
      - https://luals.github.io/wiki/introduction/
      - https://www.lua.org/manual/
  - id: brew:luarocks
    reason: >
      Use LuaRocks with LuaLS projects to install modules, then expose the relevant rock
      tree through LuaLS runtime paths or workspace libraries as shown in the official
      configuration guide.
    rel: adjacent_workflow
    sources:
      - https://luals.github.io/wiki/configuration/
      - https://luarocks.org/docs
category: developer-tools
package-manager:
  apk: lua-language-server
  brew: lua-language-server
  chocolatey: lua-language-server
  macports: lua-language-server
  nix: lua-language-server
  pacman: lua-language-server
  scoop: main/lua-language-server
  winget: LuaLS.lua-language-server
  zypper: lua-language-server
package-manager-url: https://formulae.brew.sh/formula/lua-language-server
license: MIT
