id: brew:libstxxl
display-name: Not completed
homepage: https://stxxl.sourceforge.net/
repo: https://github.com/stxxl/stxxl
docs:
  - https://github.com/stxxl/stxxl#readme
  - https://stxxl.org/
  - https://stxxl.org/tags/master/install_config.html
config-file-location:
  unix:
    - $STXXLCFG
    - ./.stxxl.$HOSTNAME
    - ./.stxxl
    - ~/.stxxl.$HOSTNAME
    - ~/.stxxl
  windows:
    - '%STXXLCFG%'
    - .stxxl.%COMPUTERNAME%.txt
    - .stxxl.txt
    - '%APPDATA%/.stxxl.%COMPUTERNAME%.txt'
    - '%APPDATA%/.stxxl.txt'
credentials-file-location: null
history:
  adoption-history:
    - >
      STXXL's adoption was strongest in algorithm engineering and research settings
      where external-memory sorting, graph algorithms, suffix arrays, and large
      sequential pipelines mattered. The 2005 report notes use in minimum spanning
      trees, connected components, breadth-first search decompositions, suffix arrays,
      and social-network metrics for huge graphs.
  package-nerd-significance:
    - >
      STXXL is package-nerd significant because it packages a research-grade
      external-memory STL as a normal C++ system library. It is a reminder that package
      managers preserve not only mainstream infrastructure but also specialized
      algorithm-engineering tools with unusual runtime configuration requirements.
  project-history:
    - >
      The project README describes STXXL as an implementation of the C++ STL for
      external-memory, out-of-core computation, with high performance as a design
      priority. The Karlsruhe technical report by Roman Dementiev, Lutz Kettner, and
      Peter Sanders was published in 2005 and presents STXXL as a practical
      experimentation library for huge data sets.
    - >
      GitHub tag metadata records an STXXL 0.2 release commit on July 1, 2003, and
      GitHub release metadata records the 1.4.x release line on June 15, 2015.
  related-projects:
    - The C++ Standard Template Library is the API model STXXL extends to external memory.
    - Boost is related through STXXL's Boost Software License.
    - >
      External-memory graph and suffix-array implementations are common downstream
      research uses named in the 2005 report.
  sources:
    - https://api.github.com/repos/stxxl/stxxl/releases?per_page=20
    - https://api.github.com/repos/stxxl/stxxl/tags?per_page=100
    - https://github.com/stxxl/stxxl
    - https://publikationen.bibliothek.kit.edu/1000003517
    - https://stxxl.org/
    - https://stxxl.org/tags/master/install_config.html
  summary:
    - >
      STXXL, packaged in Homebrew as libstxxl, is the Standard Template Library for
      Extra Large Data Sets. It is a C++ external-memory library that mirrors STL-style
      containers and algorithms for data sets that live on disks rather than in RAM.
  timeline:
    - '2003-07-01: GitHub tag metadata records STXXL release 0.2.'
    - '2005: The University of Karlsruhe technical report presented STXXL and its applications.'
    - '2015-06-15: GitHub release metadata records STXXL 1.4.1.'
  usage:
    - >
      Users configure STXXL disk files through STXXLCFG or .stxxl configuration files,
      then build C++ programs against its containers, algorithms, and I/O layers. Its
      package-manager footprint is narrower than general-purpose C++ libraries, but it
      remains useful for reproducible builds of older external-memory research code.
related-packages: []
category: other
package-manager:
  brew: libstxxl
  debian: libstxxl-dev
  ubuntu: libstxxl-dev
package-manager-url: https://formulae.brew.sh/formula/libstxxl
license: BSL-1.0
tags:
  - cli
  - not-completed
description: C++ implementation of STL for extra large data sets
executables:
  - stxxl_tool
provenance:
  formula: libstxxl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
