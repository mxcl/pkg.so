id: brew:firefly
display-name: Hyperledger FireFly CLI
homepage: https://hyperledger-firefly.github.io/firefly/latest/
repo: https://github.com/hyperledger-firefly/cli
docs:
  - https://github.com/hyperledger/firefly-cli#readme
  - https://hyperledger.github.io/firefly/latest
  - https://hyperledger.github.io/firefly/latest/contributors/advanced_cli_usage
  - https://hyperledger.github.io/firefly/latest/overview/key_components/tools
config-file-location:
  unix:
    - ~/.firefly/stacks/<stack_name>/runtime/config/firefly_core_0.yml
    - ~/.firefly/stacks/<stack_name>/docker-compose.override.yml
credentials-file-location:
  unix: test_users
history:
  adoption-history:
    - >
      The CLI's adoption is intentionally developer-local. Official docs tell users to
      install Docker, Docker Compose, and openssl, then install the CLI via release
      binaries, Homebrew, or Go. That makes it a bootstrapper for trying FireFly rather
      than a production runtime by itself.
    - >
      In the FireFly documentation, the CLI appears as one of the main tools next to
      FireFly Sandbox and FireFly Explorer. That position matters: the CLI is the
      shortest path from package installation to a running local network of FireFly
      Supernodes.
  package-nerd-significance:
    - >
      FireFly CLI is package-interesting because it is a Go-distributed executable that
      bootstraps a multi-service blockchain development environment. Installing a small
      CLI gives users a reproducible local stack rather than just another client binary.
    - >
      It also captures a broader packaging pattern in cloud and Web3 tools: the package
      manager installs the orchestrator, and the orchestrator materializes Docker-based
      services, generated configuration, local credentials, UI tools, and protocol
      connectors.
  project-history:
    - >
      The firefly-cli repository was created in May 2021. Its README frames the tool as
      a way to create local FireFly stacks for offline blockchain app development,
      letting developers iterate before setting up production infrastructure.
    - >
      FireFly itself is described by the official core repository as an open-source
      Supernode: a complete stack for enterprises to build and scale secure Web3
      applications. The CLI is one piece of that ecosystem, alongside FireFly Core,
      Explorer, Sandbox, SDKs, blockchain connectors, token connectors, samples, and
      Helm charts.
  related-projects:
    - >
      Hyperledger FireFly Core is the main runtime and orchestration engine that the CLI
      helps run locally.
    - >
      FireFly Explorer and FireFly Sandbox are the companion developer tools surfaced in
      official docs.
    - >
      FireFly transaction manager, signer, EVM, Fabric, Tezos, Cardano, token,
      data-exchange, SDK, samples, and Helm chart repositories are neighboring pieces of
      the FireFly ecosystem.
    - >
      Docker and Docker Compose are required local dependencies for running CLI-managed
      stacks.
  sources:
    - https://github.com/hyperledger/firefly-cli
    - https://raw.githubusercontent.com/hyperledger/firefly-cli/main/README.md
    - https://hyperledger-firefly.github.io/firefly/latest/gettingstarted/firefly_cli/
    - https://hyperledger-firefly.github.io/firefly/latest/overview/key_components/tools/
    - https://github.com/hyperledger/firefly
    - https://raw.githubusercontent.com/hyperledger/firefly/main/README.md
    - https://api.github.com/repos/hyperledger/firefly-cli
  summary:
    - >
      Hyperledger FireFly CLI is the local stack-management tool for Hyperledger
      FireFly, an open-source Web3 application stack. The CLI creates and manages local
      FireFly stacks so developers can build blockchain applications without manually
      assembling Docker, blockchain connectors, FireFly Core, Explorer, Sandbox, and
      supporting services.
  timeline:
    - '2021: firefly-cli repository is created on GitHub.'
    - '2021: Early GitHub releases publish precompiled CLI artifacts.'
    - >
      2020s: Official FireFly docs position the CLI beside Sandbox and Explorer as a
      core developer tool.
    - '2026: Repository metadata shows continued firefly-cli maintenance activity.'
  usage:
    - >
      Users create a stack with `ff init <stack_name>`, start it with `ff start
      <stack_name>`, inspect logs with `ff logs`, stop it with `ff stop`, reset data
      with `ff reset`, remove it with `ff remove`, inspect it with `ff info`, and list
      stacks with `ff ls`.
    - >
      The CLI is used when developers need an offline or local FireFly environment for
      blockchain app work. It hides much of the underlying service wiring while still
      leaving stack configuration and Docker Compose artifacts available for advanced
      customization.
related-packages:
  - id: brew:docker
    reason: >
      Docker is a documented prerequisite and supplies the container runtime and Compose
      workflow used by FireFly CLI-managed local stacks.
    rel: adjacent_workflow
    sources:
      - https://github.com/hyperledger-firefly/cli#prerequisites
      - https://docs.docker.com/compose/
category: cloud-infrastructure
package-manager:
  brew: firefly
  nix: firefly
package-manager-url: https://formulae.brew.sh/formula/firefly
license: Apache-2.0
tags:
  - blockchain
  - cli
  - hyperledger
  - local-development
  - stack-management
  - web3
description: Create and manage the Hyperledger FireFly stack for blockchain interaction
executables:
  - firefly
provenance:
  formula: firefly
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
