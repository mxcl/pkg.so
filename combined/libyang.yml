id: brew:libyang
display-name: libyang
homepage: https://github.com/CESNET/libyang
repo: https://github.com/CESNET/libyang
docs:
  - https://github.com/CESNET/libyang/blob/master/README.md
  - https://netopeer.liberouter.org/doc/libyang/master/html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libyang is a foundational component in CESNET's YANG/NETCONF ecosystem. Its
      official README identifies libnetconf2, Netopeer2, and sysrepo as users, while
      separate C++, Python, and Rust bindings broaden access beyond its native C API.
  package-nerd-significance:
    - >
      Package maintainers encounter libyang as both a shared library and a tool
      provider. Its ABI transitions, generated API documentation, plugin directories,
      pkg-config metadata, and `yanglint` utility make version selection and dependency
      compatibility especially important.
  project-history:
    - >
      CESNET developed libyang as a C parser and toolkit for YANG schemas and
      YANG-modeled data. Successive major versions introduced revised APIs; the official
      documentation includes transition manuals for migrations from 1.x through later
      major releases.
  related-projects:
    - sysrepo
    - Netopeer2
    - libnetconf2
    - YANG
    - NETCONF
  sources:
    - https://github.com/CESNET/libyang
    - https://netopeer.liberouter.org/doc/libyang/master/html/
    - https://netopeer.liberouter.org/doc/libyang/master/html/pages.html
  summary:
    - >
      libyang is CESNET's C library and toolkit for parsing, validating, manipulating,
      and printing YANG schemas and modeled XML or JSON data.
  timeline:
    - '1.x: Established the original public API documented in the legacy manual.'
    - >
      2.0: Introduced a substantially revised API, including generalized input and
      output handlers.
    - '3.x–4.x: Further major API generations received dedicated transition manuals.'
  usage:
    - >
      Developers link applications with `-lyang` or discover it through `libyang.pc`.
      The bundled `yanglint` command validates and converts YANG/YIN schemas and XML or
      JSON instance data; `yangre` supports regular-expression work.
related-packages: []
category: developer-tools
package-manager:
  apk: libyang
  brew: libyang
  debian: libyang-dev
  dnf: libyang
  nix: libyang
  zypper: libyang-devel
package-manager-url: https://formulae.brew.sh/formula/libyang
license: BSD-3-Clause
tags:
  - c-library
  - cli
  - data-modeling
  - json
  - netconf
  - schema-validation
  - xml
  - yang
  - yanglint
description: YANG data modeling language library
executables:
  - yanglint
  - yangre
provenance:
  formula: libyang
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
