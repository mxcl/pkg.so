id: brew:kcgi
display-name: kcgi
homepage: https://kristaps.bsd.lv/kcgi/
repo: https://github.com/kristapsdz/kcgi
docs:
  - https://kristaps.bsd.lv/kcgi
  - https://kristaps.bsd.lv/kcgi/kcgi.3.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation page names system packages for OpenBSD, FreeBSD,
      Homebrew, Arch Linux, and other systems. The batch input also records Alpine,
      Homebrew, and Nix packages, reflecting its niche but durable role in BSD-flavored
      C web stacks.
  package-nerd-significance:
    - >
      kcgi is interesting to package nerds because it preserves a small-C,
      manpage-first, BSD-style approach to web development while still being packaged
      for modern Unix systems. Its release archive is unusually explicit about ABI,
      platform, and security tradeoffs.
  project-history:
    - >
      The public GitHub repository was created in January 2016, while the project site
      serves as the canonical release and documentation surface. kcgi grew around a
      conservative C web-programming model: parse CGI/FastCGI requests, validate inputs,
      produce HTTP output, and keep the untrusted request path small enough to audit.
    - >
      The release archive shows a long 0.x series before 1.0.0 on November 10, 2025.
      Notable evolution includes bearer-token validation in 2021, seccomp maintenance
      changes in 2021, asynchronous FastCGI descriptor support in 2023, CORS header
      support in 2024, and fetch metadata/Priority header support in the 1.0.0 release.
  related-projects:
    - >
      The project site groups kcgi with the BCHS-oriented BSD.lv tools sqlbox and
      openradtool, and its README notes development primarily on OpenBSD.
  sources:
    - https://github.com/kristapsdz/kcgi
    - https://kristaps.bsd.lv/kcgi
    - https://kristaps.bsd.lv/kcgi/archive.html
    - https://kristaps.bsd.lv/kcgi/kcgi.3.html
  summary:
    - >
      kcgi is Kristaps Dzonsons's minimal CGI and FastCGI library for C and C++ web
      applications. Its canonical site emphasizes security, auditability, and use in the
      BCHS stack.
  timeline:
    - '2016-01-20: GitHub repository created.'
    - '2021-05-08: 0.12.5 added bearer-token authorization support.'
    - '2021-09-23: 0.13.0 changed Linux seccomp defaults.'
    - '2023-11-19: 0.13.1 added asynchronous FastCGI descriptor support.'
    - '2025-11-10: 1.0.0 release published.'
    - '2025-11-17: 1.0.1 hot-fix release published.'
  usage:
    - >
      kcgi is used as a C/C++ library rather than primarily as a standalone command. The
      documentation centers on CGI and FastCGI request parsing, HTTP headers and bodies,
      typed input validation, formatted writers for JSON/XML/HTML output, compression,
      authentication helpers, and sandboxing or process separation for untrusted input.
related-packages: []
