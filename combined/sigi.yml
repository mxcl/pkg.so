id: brew:sigi
display-name: sigi
homepage: https://sigi.quest/
repo: https://github.com/so-dang-cool/sigi
docs:
  - https://github.com/sigi-cli/sigi#readme
  - https://sigi-cli.org
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project encourages distribution packaging and offers Cargo installation. The
      supplied package metadata identifies Homebrew and Nix availability, without
      establishing user numbers.
  package-nerd-significance:
    - >
      Sigi applies stack operations to personal organization and supports shell aliases,
      pipelines and machine-readable output.
  project-history:
    - >
      J.R. Hill conceived Sigi as a flexible command-line memory aid, drawing
      inspiration from stacks and the Forth and Factor languages. Its name is a Chamorro
      verb meaning to continue or advance.
  related-projects:
    - >
      Forth and Factor inspired its stack-oriented approach; Redis is suggested upstream
      for larger stack workloads.
  sources:
    - '[Official README](https://github.com/so-dang-cool/sigi#readme): commands and packaging.'
    - '[Official releases](https://github.com/so-dang-cool/sigi/releases): queue support.'
    - '[Original official site](https://sigi-cli.org/): author and design origins.'
    - 'source_facts.package-manager: Homebrew and Nix availability.'
  summary:
    - Sigi is a Rust command-line organizer built around named stacks.
  timeline:
    - '2026: Release notes document enqueue/prepend commands for queue semantics.'
  usage:
    - >
      Create aliases for task or reading stacks, add entries with do or push, and finish
      them with done. Quiet and structured output support scripts. Upstream describes it
      as suitable for small workloads rather than high concurrency.
category: productivity
package-manager:
  brew: sigi
  nix: sigi
package-manager-url: https://formulae.brew.sh/formula/sigi
license: GPL-2.0-only
tags:
  - cli
  - organization
  - productivity
  - terminal
description: Organizing tool for terminal lovers that hate organizing
executables:
  - sigi
provenance:
  formula: sigi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
