history:
  adoption-history:
    - >
      Multitouch is distributed as a commercial macOS utility with a 30-day trial and
      per-user licensing. It supports built-in and external trackpads and Magic Mouse
      hardware on Intel and Apple Silicon Macs.
  package-nerd-significance:
    - >
      Multitouch belongs to a well-established macOS utility niche: extending limited
      system gesture settings without replacing the user's pointing hardware. Its
      combination of gestures, remapping, scripts, and window snapping makes it useful
      to automation-minded desktop users.
  project-history:
    - >
      Multitouch is an independently developed macOS application by Ryan Hanson. The
      public product material focuses on ongoing distribution and support rather than
      providing a dated origin or release history.
  related-projects:
    - >
      The application incorporates Rectangle-style keyboard shortcuts, menu commands,
      and drag-to-snap window-management behavior.
    - >
      Its official community repository is used for issue reports, feature requests,
      discussions, and troubleshooting rather than as the application's source
      repository.
  sources:
    - https://github.com/rxhanson/Multitouch-Community
    - https://multitouch.app/
  summary:
    - >
      Multitouch is a macOS utility for assigning actions to trackpad and Magic Mouse
      gestures, remapping keys and mouse buttons, running scripts, and managing windows.
  timeline:
    - 'Current product era: Multitouch supports macOS on Intel and Apple Silicon.'
    - >
      Current product era: The developer maintains a public GitHub community for support
      and feature requests.
  usage:
    - >
      Users assign selected gestures to browser actions, keystrokes, clicks, scripts,
      window-management commands, or other application actions.
    - >
      Troubleshooting options include restarting gesture handling after wake and
      selectively avoiding a private framework for trackpad input.
