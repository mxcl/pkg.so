id: brew:hydra
display-name: hydra
homepage: https://github.com/vanhauser-thc/thc-hydra
repo: https://github.com/vanhauser-thc/thc-hydra
docs:
  - https://github.com/vanhauser-thc/thc-hydra#readme
  - https://github.com/vanhauser-thc/thc-hydra/blob/master/hydra.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Hydra is widely packaged for security-oriented and general-purpose Unix
      ecosystems. Package metadata lists Homebrew, Debian, Ubuntu, Fedora-family,
      Alpine, Arch, Nix, MacPorts, openSUSE, and other package channels, while Kali
      documents it as a password-attack tool with hydra and xhydra packages.
  package-nerd-significance:
    - >
      Hydra is package-nerd-significant because it is a classic example of a specialist
      security CLI whose value depends on optional protocol libraries and distro build
      choices. The same formula/package name can expose different module coverage
      depending on linked dependencies such as libssh, FreeRDP, PCRE2, database clients,
      and SSL libraries.
  project-history:
    - >
      The upstream README carries a 2001-2023 copyright line for van Hauser / THC,
      credits many modules to David Maciejak, and notes BFG code by Jan Dlabal. It also
      states that Hydra was created because existing login tools did not support
      multiple protocols or parallelized connects.
    - >
      The GitHub repository was created in April 2014, but the README copyright makes
      clear the project predates that hosting era. The changelog shows a long-running
      7.x, 8.x, and 9.x line with continued module work, protocol fixes, output changes,
      dependency updates, and hardening.
  related-projects:
    - >
      Hydra is related to xhydra, pw-inspector, THC security tooling, Kali packaging,
      libssh, FreeRDP, PCRE2, OpenSSL, and the many protocol libraries used to build
      optional modules.
  sources:
    - >
      Project README, changelog, manpage, GitHub release page, Kali tool metadata,
      repository metadata, and Homebrew package metadata were used.
  summary:
    - >
      THC Hydra is a parallelized network login auditing tool. Its README and manpage
      describe it as a fast, flexible login cracker for many protocols, intended for
      legal security research and consulting demonstrations of weak remote
      authentication.
  timeline:
    - '2001: Upstream README copyright begins for van Hauser / THC.'
    - '2014: GitHub repository created for the public development history on GitHub.'
    - >
      2020: 9.0 changelog added memcached and MongoDB modules and changed JSON output
      behavior.
    - '2022: 9.4 changelog switched from PCRE/PCRE3 to PCRE2 for Debian compatibility.'
    - '2023: 9.5 changelog focused on module behavior and HTTP-form fixes.'
    - '2025: 9.6 release notes mention FreeRDP v3, compiler fixes, and protocol/module fixes.'
    - >
      2026: 9.7 and 9.8-dev notes show GTK3 support for xhydra, Mongo v2 support, and
      security hardening work.
  usage:
    - >
      Authorized users supply login and password sources, select a protocol module, tune
      parallel task counts, use SSL or IPv6 options when needed, restore interrupted
      sessions, and write results in text or JSON formats. The manpage and README
      emphasize module-specific options and list many supported services, from FTP, SSH,
      HTTP forms, IMAP, LDAP, SMB, RDP, Redis, MongoDB, and VNC to less common network
      services.
related-packages: []
category: security
package-manager:
  apk: hydra
  brew: hydra
  debian: hydra
  dnf: hydra
  macports: hydra
  nix: hydra
  pacman: hydra
  ubuntu: hydra
  winget: HydraLauncher.Hydra
  zypper: hydra
package-manager-url: https://formulae.brew.sh/formula/hydra
license: AGPL-3.0-only
tags:
  - cli
  - network-login
  - password-auditing
  - penetration-testing
  - protocol-testing
  - security
description: Network logon cracker which supports many services
executables:
