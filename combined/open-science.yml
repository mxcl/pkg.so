id: cask:open-science
display-name: Open Science
homepage: https://aipoch.com/open-science
repo: https://github.com/aipoch/open-science
docs:
  - https://aipoch.com/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AIPOCH distributes desktop builds for macOS, Windows, and Linux and documents
      running from source. The supplied source_facts.package-manager also records
      Homebrew Cask distribution; these distribution channels do not establish adoption
      scale.
  package-nerd-significance:
    - >
      Its packaging combines an Electron desktop application with separately configured
      agent frameworks and optional Python and R runtimes. This makes runtime setup and
      reproducible research environments part of the installation experience.
  project-history:
    - >
      Open Science is an AIPOCH project distributed under Apache-2.0. Its design brings
      scientific agents, executable analysis, connectors, and research artifacts into a
      local desktop workspace.
  related-projects:
    - >
      Python and R provide notebook execution; supported agent frameworks supply
      conversational execution.
  sources:
    - https://aipoch.com/docs/getting-started/installation/
    - https://aipoch.com/open-science
    - source_facts.package-manager
  summary:
    - >
      Open Science is an open-source scientific research workbench that combines
      AI-assisted investigation with code execution and traceable outputs.
  timeline:
    - >
      2026: AIPOCH published installation documentation and desktop releases for the
      research workbench.
  usage:
    - >
      Researchers organize work into projects, connect a model provider, run analyses,
      and inspect reports, notebooks, and provenance records. Model services and remote
      compute may require separate accounts.
category: ai
package-manager:
  brew-cask: open-science
package-manager-url: https://formulae.brew.sh/cask/open-science
tags:
  - ai-agents
  - electron
  - local-first
  - notebooks
  - python
  - r
  - scientific-research
description: AI research workbench with scientific agents and notebooks
applications:
  - Open-Science.app
provenance:
  cask: open-science
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
