id: brew:killport
display-name: killport
homepage: https://github.com/jkfran/killport
repo: https://github.com/jkfran/killport
docs:
  - https://github.com/jkfran/killport#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Cargo, Homebrew, release binaries, and a shell
      installer. The Homebrew input record also lists MacPorts, Nix, and openSUSE
      packaging.
  package-nerd-significance:
    - >
      killport is a package-nerd example of a tiny workflow wrapper: it replaces
      repeated `lsof`, `netstat`, `kill`, and container-runtime commands with one
      installable CLI.
  project-history:
    - >
      The GitHub repository was created in 2023, and v0.1.0 was published on 2023-03-19.
      The README describes a tool that started from the familiar local-development
      problem of freeing a busy port and later included container runtime support,
      dry-run mode, signal selection, shell completions, and cross-platform support.
  related-projects:
    - >
      The README places killport near system tools such as process managers, port
      inspection commands, and container runtimes including Docker, OrbStack, Podman,
      Colima, and OCI-compatible runtimes.
  sources:
    - https://crates.io/crates/killport
    - https://formulae.brew.sh/formula/killport
    - https://github.com/jkfran/killport
    - https://github.com/jkfran/killport/releases
  summary:
    - >
      killport is a Rust command-line tool for killing processes and containers that are
      listening on specified TCP ports.
  timeline:
    - '2023: Repository created and v0.1.0 published.'
    - '2023: v0.9.x releases followed through July and December.'
    - '2024: v1.0.0 release published on 2024-05-20.'
    - '2026: Repository activity continued through the v1.x line.'
  usage:
    - >
      Developers use killport to free ports such as 3000 or 8080 during local
      development, optionally targeting native processes, containers, or auto-detected
      targets.
related-packages:
  - id: brew:portop
    reason: >
      Choose portop when you want a live TUI, process and container context, firewall
      visibility, or scripted `--free` behavior; choose killport for a smaller command
      focused directly on terminating listeners by port.
    rel: alternative
    sources:
      - https://github.com/jkfran/killport#readme
      - https://github.com/padovanl/portop#readme
  - id: cask:portkiller
    reason: >
      Choose PortKiller for a graphical menu-bar or system-tray workflow with watched
      ports and Kubernetes port-forward management; choose killport for terminal scripts
      and lightweight cross-platform automation.
    rel: alternative
    sources:
      - https://github.com/jkfran/killport#readme
      - https://github.com/productdevbook/port-killer#readme
category: system
package-manager:
  brew: killport
  macports: killport
  nix: killport
  zypper: killport
package-manager-url: https://formulae.brew.sh/formula/killport
license: MIT
tags:
  - cli
  - containers
  - networking
  - ports
  - process-management
description: Command-line tool to kill processes listening on a specific port
executables:
  - killport
provenance:
  formula: killport
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
