history:
  project-history:
    - >
      The package's major releases track the growth of genome data. MUMmer 2.1 added
      NUCmer and PROmer and was described by Delcher, Adam Phillippy, Jane Carlton, and
      Salzberg as faster and more memory-efficient for large-scale genome alignment and
      comparison. MUMmer 3.0, described by Stefan Kurtz, Phillippy, Delcher, and
      collaborators in Genome Biology, made the software open source and better suited
      to comparing large genomes. MUMmer4, developed by Guillaume Marcais and Aleksey
      Zimin with the broader MUMmer team, reworked the core from MUMmer3's 32-bit suffix
      tree constraints toward a 48-bit suffix-array approach and added parallel query
      processing; the PLOS Computational Biology paper describes MUMmer and nucmer as
      among the widely used alignment packages in genomics.
  sources:
    - https://academic.oup.com/nar/article/27/11/2369/1258501
    - https://formulae.brew.sh/formula/mummer
    - https://github.com/mummer4/mummer
    - https://journals.plos.org/ploscompbiol/article?id=10.1371%2Fjournal.pcbi.1005944
    - https://mummer4.github.io/
  summary:
    - >
      MUMmer is a bioinformatics sequence-alignment package built around maximal unique
      matches and suffix-based data structures. The first MUMmer paper, "Alignment of
      whole genomes," by Arthur L. Delcher, Simon Kasif, Robert D. Fleischmann, Jeremy
      Peterson, Owen White, and Steven L. Salzberg, described a system for rapidly
      aligning genome-length DNA sequences with suffix trees, demonstrated on bacterial
      strains, Mycoplasma genomes, and syntenic human/mouse sequences. The name refers
      to MUMs, or maximal unique matches, used as anchors for large-scale alignments.
  usage:
    - >
      In practice, researchers use the suite's commands for whole-genome alignment,
      draft assembly comparison, contig-to-contig alignment, variant and SNP inspection,
      dot plots, and translated protein-level comparisons. The package-manager niche is
      scientific command-line software: Homebrew and Debian/Ubuntu packages expose tools
      such as `mummer`, `nucmer`, `promer`, `dnadiff`, `delta-filter`, `show-coords`,
      `show-snps`, and `mummerplot`, making a research-grade genome comparison toolkit
      installable like ordinary Unix utilities.
related-packages:
  - id: brew:minimap2
    reason: >
      Choose minimap2 for versatile long-read, spliced-read, or assembly-to-assembly
      mapping with SAM or PAF output; choose MUMmer for its established whole-genome
      exact-match, delta-file, SNP, and assembly-comparison workflow.
    rel: alternative
    sources:
      - https://mummer4.github.io/
      - https://github.com/mummer4/mummer#readme
      - https://github.com/lh3/minimap2
