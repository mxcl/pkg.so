id: brew:apigeecli
display-name: apigeecli
homepage: https://cloud.google.com/apigee/docs
repo: https://github.com/apigee/apigeecli
docs:
  - https://cloud.google.com/apigee/docs
  - https://cloud.google.com/apigee/docs/reference/apis/apigee/rest
  - https://github.com/apigee/apigeecli/blob/main/docs/apigeecli.md
  - https://github.com/apigee/apigeecli#readme
config-file-location:
  unix: ~/.apigeecli
credentials-file-location:
  unix: ~/.apigeecli
history:
  adoption-history:
    - >
      The README documents binary downloads from GitHub releases, a Linux/Darwin install
      script, a container image on GitHub Container Registry, Docker usage, and Cloud
      Build usage. The batch input shows Homebrew packaging, giving macOS users another
      straightforward installation path.
  package-nerd-significance:
    - >
      apigeecli is significant as the scriptable control-plane surface for Apigee users
      who need reproducible API-management operations outside the web console. Package
      users care about its release cadence, generated Cobra command tree, token-cache
      location, container image, and CI-friendly flags because it often appears in
      deployment and platform administration pipelines.
  project-history:
    - >
      The public apigee/apigeecli repository was created in 2022. The README describes
      it as a tool for Apigee hybrid and managed Apigee, including CRUD-style management
      of Apigee entities and helper flows for service accounts used by hybrid runtime
      operations.
    - >
      GitHub releases show an active release stream beginning with v1.107 in May 2022
      and continuing through the 2.x line. The README documents version 2.x breaking
      flag-name changes and a 2.0.0 change adding --no-warnings for automation-sensitive
      output.
  related-projects:
    - >
      apigeecli is directly tied to Google Cloud Apigee, the Apigee REST APIs, Apigee
      hybrid, gcloud authentication, Google default application credentials, Cloud
      Build, and GHCR container distribution.
  sources:
    - https://api.github.com/repos/apigee/apigeecli
    - https://cloud.google.com/apigee/docs/reference/apis/apigee/rest
    - https://github.com/apigee/apigeecli#readme
    - https://github.com/apigee/apigeecli/blob/main/docs/apigeecli.md
    - https://github.com/apigee/apigeecli/blob/main/docs/apigeecli_preferences.md
    - https://github.com/apigee/apigeecli/blob/main/docs/apigeecli_token_cache.md
  summary:
    - >
      apigeecli is a Go command-line interface for interacting with Apigee APIs across
      Apigee hybrid and Google's managed Apigee offering. It manages Apigee entities
      such as proxies, products, environments, developers, IAM, key stores, shared
      flows, and related control-plane resources.
  timeline:
    - '2022: Public apigee/apigeecli repository created.'
    - '2022: v1.107 through v1.110 releases published during the first public release wave.'
    - '2025: 2.x releases continued with monthly feature and fix updates.'
    - '2026: v2.17.0 published and command docs regenerated on January 5, 2026.'
  usage:
    - >
      apigeecli authenticates with Google OAuth access tokens from gcloud, metadata
      tokens in Google execution environments, Google default application credentials,
      or service account JSON. It can generate and cache access tokens, list or fetch
      organizations, and run broad Apigee management commands.
    - >
      The README says token cache and preferences are written under $HOME/.apigeecli.
      Generated command docs show inherited global options for service-account JSON,
      metadata token, default token, OAuth token, API environment selection, output
      control, and newer-version checks.
related-packages: []
category: developer-tools
package-manager:
  brew: apigeecli
package-manager-url: https://formulae.brew.sh/formula/apigeecli
license: Apache-2.0
tags:
  - api
  - api-management
  - apigee
  - cli
  - google-cloud
description: Apigee management API command-line interface
executables:
  - apigeecli
provenance:
  formula: apigeecli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
