id: brew:elm
display-name: Elm
homepage: https://elm-lang.org
repo: https://github.com/elm/compiler
docs:
  - https://elm-lang.org/docs
  - https://guide.elm-lang.org/
config-file-location:
  unix: elm.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Elm's adoption has been tied to its promise of making frontend programming more
      predictable. The official guide teaches beginners through browser UI examples and
      the Elm Architecture, while the news archive highlights compiler errors, debugger
      work, package management, and conference talks as part of the language's outreach.
    - >
      In package-manager culture, Elm is installed as a single executable and appears in
      Homebrew, Scoop, winget, and other package indexes. That distribution style made
      the compiler easy to pin, replace, and run locally, which mattered for teams
      managing Elm version compatibility across projects.
  package-nerd-significance:
    - >
      Elm is notable to package nerds because the compiler, package manager, package
      registry, and project manifest form a tightly controlled ecosystem. The elm.json
      file captures application and package dependencies, and the compiler's
      version-sensitive behavior makes reproducible installs and exact tool versions
      important.
    - >
      Elm also influenced frontend tooling expectations: friendly diagnostics, a
      standard architecture, and a package workflow with strong semantic constraints
      became part of its identity. Even people who do not use Elm often recognize it as
      a language ecosystem that optimized hard for understandable errors and
      low-runtime-surprise web apps.
  project-history:
    - >
      Elm began as an experimental functional reactive programming language and became a
      practical web UI language over the 0.x series. The official news archive records
      early releases from 0.1 in April 2012, then a steady sequence of language,
      package, debugger, and compiler changes through the 2010s.
    - >
      A major design shift came with Elm 0.17 in 2016, where the project removed signals
      from application code and introduced subscriptions, moving Elm away from explicit
      FRP vocabulary in day-to-day app structure. Elm 0.19 in 2018 later emphasized
      smaller assets and faster builds, and Elm 0.19.1 in 2019 was described by the
      official news page as stable for quite some time.
  related-projects:
    - >
      Elm is closely related to package.elm-lang.org, the official guide, elm-format,
      and editor tooling for Elm source. Conceptually, it sits near functional frontend
      systems and ML-family languages, but its package and compiler workflow is
      intentionally its own ecosystem.
  sources:
    - https://elm-lang.org/news
    - https://guide.elm-lang.org/install/elm.html
    - https://github.com/elm/compiler
    - https://github.com/elm/compiler/releases
    - https://github.com/elm/compiler/blob/master/installers/README.md
  summary:
    - >
      Elm is a functional programming language and compiler toolchain for browser
      applications. Its official materials frame it around reliable webapps, friendly
      compiler messages, small assets, and a command-line workflow centered on elm init,
      elm reactor, elm make, elm install, and elm.json.
  timeline:
    - '2012: Elm 0.1 initial release appears in the official release archive.'
    - >
      2014: Elm 0.14 introduces the package manager, parallel builds, and JSON support
      according to the official news archive.
    - '2016: Elm 0.17 adds subscriptions and removes signals from ordinary application code.'
    - '2018: Elm 0.19 focuses on smaller assets and faster builds.'
    - '2019: Elm 0.19.1 is released and described by the news page as a long-stable release.'
  usage:
    - >
      A normal Elm project starts with elm init, which creates elm.json and a src
      directory. Developers use elm reactor for local exploration, elm make to compile
      Elm source to HTML or JavaScript, and elm install to add packages from
      package.elm-lang.org into elm.json.
    - >
      Elm is most commonly used for browser-based GUI work where a strongly typed,
      functional architecture is valued. The command-line workflow is deliberately
      small: build, run a local reactor, install packages, and ask the compiler for
      detailed error messages.
related-packages:
  - id: brew:elm-format
    reason: >
      Use elm-format alongside the Elm compiler to apply the ecosystem's standard source
      layout to files in an elm.json project.
    rel: adjacent_workflow
    sources:
      - https://guide.elm-lang.org/get_started
      - https://github.com/avh4/elm-format#readme
category: language-runtime
