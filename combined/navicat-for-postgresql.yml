config-file-location:
  macos: ~/Library/Application Support/PremiumSoft CyberTech/Navicat CC/Common/Profiles
credentials-file-location: null
history:
  adoption-history:
    - >
      Navicat for PostgreSQL became part of PremiumSoft's cross-platform family of
      commercial database clients and is distributed for Windows, macOS, and Linux. Its
      continuing release stream tracks PostgreSQL changes and hosted PostgreSQL
      services.
  package-nerd-significance:
    - >
      The Homebrew cask makes a proprietary, GUI-oriented PostgreSQL client reproducibly
      discoverable and installable alongside open-source command-line and desktop
      database tools.
  project-history:
    - >
      PremiumSoft developed Navicat as a family of graphical database administration
      products. This edition specializes that shared interface and tooling for
      PostgreSQL and PostgreSQL-compatible services.
  related-projects:
    - Navicat Premium
    - Navicat for SQL Server
    - Navicat for SQLite
    - PostgreSQL
  sources:
    - https://www.navicat.com/en/products/navicat-for-postgresql
    - https://www.navicat.com/en/products/navicat-for-postgresql-release-note
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Navicat for PostgreSQL is PremiumSoft's proprietary graphical database
      administration and development client for PostgreSQL.
  timeline:
    - >
      2021: Navicat 16 added connection profiles, PostgreSQL extension management, and
      enhanced query tooling.
    - >
      2024: Navicat 17 releases added newer cloud PostgreSQL integrations and expanded
      modeling and BI features.
    - '2026: The 17.3 release line continued across Windows, macOS, and Linux.'
  usage:
    - >
      Common uses include browsing and editing database objects and records, writing
      SQL, modeling schemas, transferring or synchronizing data, managing connections,
      and automating database jobs.
category: developer-tools
