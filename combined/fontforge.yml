id: brew:fontforge
display-name: FontForge
homepage: https://fontforge.github.io
repo: https://github.com/fontforge/fontforge
docs:
  - https://fontforge.org/docs/index.html
config-file-location:
  unix:
    - ~/.FontForge/prefs
    - $sharedir/fontforge/prefs
credentials-file-location: null
history:
  adoption-history:
    - >
      FontForge grew from a personal editor into a community font-engineering tool
      because it handled many formats and exposed both a graphical interface and
      scripting. The official history highlights user requests and conference feedback
      as drivers for features such as SVG fonts, multi-master support,
      internationalization, and scripting.
    - >
      Its modern homepage presents downloads, documentation, development links,
      mailing-list help, and a GitHub organization, reflecting its transition from a
      SourceForge-era desktop application into a long-lived open-source typography
      project.
  package-nerd-significance:
    - >
      FontForge is package-nerd significant because it is both an application and a
      toolbox: distributions package it for desktop font designers, automated font QA,
      format conversion, and build pipelines that need scriptable font manipulation
      without proprietary editors.
  project-history:
    - >
      FontForge began as PfaEdit, written by George Williams after experiments with
      Unicode font work and PostScript font editing. The official history says the first
      web-posted version appeared on November 7, 2000, and that the project moved to
      SourceForge in April 2001.
    - >
      PfaEdit expanded quickly: support for pfb, TrueType, BDF, Type 2/OpenType-in-sfnt,
      CID-keyed fonts, internationalized user interfaces, OpenType GSUB/GPOS features,
      scripting, FreeType-backed debugging, SVG fonts, and Multiple Master support all
      arrived in the early 2000s. In March 2004, after users argued that `PfaEdit` no
      longer described the program, it was renamed FontForge.
    - >
      The current project is community-maintained. The README describes FontForge as
      free software for Windows, Mac OS X, and GNU/Linux, and the documentation
      identifies copyright by George Williams for 2000-2012 and FontForge authors
      thereafter.
  related-projects:
    - >
      FontForge is related to FreeType, SourceForge-era PfaEdit, Design With FontForge,
      UFO workflows, OpenType/TrueType tooling, and the wider open-source type-design
      ecosystem.
  sources:
    - https://fontforge.org/docs/appendices/ff-history.html
    - https://fontforge.org/docs/index.html
    - https://github.com/fontforge/fontforge
    - https://raw.githubusercontent.com/fontforge/fontforge/master/README.md
  summary:
    - >
      FontForge is a free font editor and converter for creating, editing, inspecting,
      and converting outline and bitmap fonts across formats such as OpenType, TrueType,
      UFO, CID-keyed fonts, and Multiple Master fonts.
  timeline:
    - '2000: The first PfaEdit version was posted to the web on November 7.'
    - >
      2001: PfaEdit moved to SourceForge and gained Type 2/OpenType-in-sfnt, CID-keyed
      font, and early internationalization support.
    - '2002: PfaEdit gained a scripting interface.'
    - '2004: PfaEdit was renamed FontForge in March.'
    - >
      2012: Copyright stewardship shifted from George Williams to the broader FontForge
      authors.
    - '2025: The official documentation identifies the 20251009 documentation release.'
  usage:
    - >
      Users launch the FontForge GUI for visual font editing, or use bundled
      command-line utilities such as `fontforge`, `fontlint`, `sfddiff`, `fontimage`,
      and conversion helpers for automated inspection and conversion workflows.
related-packages:
  - id: brew:fonttools
    reason: >
      Choose fontTools when the same font-inspection, conversion, subsetting, or
      modification work is better expressed through Python APIs and focused command-line
      utilities rather than a graphical editor.
    rel: alternative
    sources:
      - https://github.com/fontforge/fontforge
      - https://fonttools.readthedocs.io/en/stable/
category: media
package-manager:
  apk: fontforge
  brew: fontforge
  chocolatey: fontforge
  debian: fontforge
  dnf: fontforge
  macports: fontforge
  nix: fontforge
  pacman: fontforge
  scoop: extras/fontforge
  ubuntu: fontforge
  winget: FontForge.FontForge
  zypper: fontforge
package-manager-url: https://formulae.brew.sh/formula/fontforge
license: GPL-3.0-or-later
tags:
  - cli
  - converter
  - editor
  - fonts
description: Command-line outline and bitmap font editor/converter
executables:
  - acorn2sfd
  - dewoff
  - findtable
  - fontforge
  - fontimage
  - fontlint
  - pcl2ttf
  - pfadecrypt
  - rmligamarks
  - sfddiff
  - showttf
  - stripttc
  - ttf2eps
  - woff
provenance:
  formula: fontforge
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
