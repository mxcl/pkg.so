id: brew:ccat
display-name: ccat
homepage: https://github.com/owenthereal/ccat
repo: https://github.com/owenthereal/ccat
docs:
  - https://github.com/owenthereal/ccat#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew installation on macOS, Arch Linux/AUR installation,
      standalone binaries, and source installation with Go. The supplied package facts
      also show distribution through Homebrew and Scoop.
  package-nerd-significance:
    - >
      ccat matters as an example of the mid-2010s wave of single-purpose Go CLIs shipped
      as static-ish binaries and immediately wrapped by package managers. It is also a
      predecessor-in-spirit to later terminal viewers that made syntax-highlighted
      source display feel routine.
  project-history:
    - >
      The upstream GitHub repository was created in May 2015 and published MIT-licensed
      Go code. The README positions ccat as a native-speed, single-binary alternative to
      syntax highlighters such as Pygments and GNU source-highlight.
  related-projects:
    - >
      The README credits Sourcegraph's syntaxhighlight package and names Pygments and
      GNU source-highlight as alternatives.
  sources:
    - https://api.github.com/repos/owenthereal/ccat
    - https://github.com/owenthereal/ccat
    - https://github.com/owenthereal/ccat#readme
    - https://formulae.brew.sh/api/formula/ccat.json
  summary:
    - >
      ccat is a small Go command-line utility that reimagines cat as a
      syntax-highlighting terminal viewer. Its official README describes it as a
      colorizing cat that works like cat while displaying source files with syntax
      highlighting.
  timeline:
    - '2015: GitHub repository created.'
    - '2015: README documented Homebrew, AUR, standalone binary, and go get installation paths.'
    - '2022: Repository metadata shows later maintenance activity.'
  usage:
    - >
      Typical usage is the cat-like form ccat FILE1 FILE2, reading from standard input,
      producing HTML output, selecting dark-background colors, changing token colors, or
      aliasing cat=ccat for interactive terminal use.
related-packages:
  - id: brew:source-highlight
    reason: >
      Choose GNU Source-highlight when you need a mature configurable highlighter that
      can transform source into multiple output formats rather than a narrowly cat-like
      viewer.
    rel: alternative
    sources:
      - https://github.com/owenthereal/ccat#readme
      - https://www.gnu.org/software/src-highlite/source-highlight.html
  - id: brew:pygments
    reason: >
      Choose Pygments when you need an extensible Python syntax-highlighting library and
      CLI with a broad lexer, formatter, style, and plugin ecosystem.
    rel: alternative
    sources:
      - https://github.com/owenthereal/ccat#readme
      - https://pygments.org/docs/
  - id: brew:bat
    reason: >
      Choose bat for a more feature-rich cat replacement with syntax highlighting,
      Git-aware changes, paging, line numbers, and configurable themes.
    rel: alternative
    sources:
      - https://github.com/owenthereal/ccat#readme
      - https://github.com/sharkdp/bat#readme
category: developer-tools
package-manager:
  brew: ccat
  scoop: main/ccat
package-manager-url: https://formulae.brew.sh/formula/ccat
license: MIT
tags:
  - cat
  - cli
  - go
  - syntax-highlighting
  - terminal
  - viewer
description: Like cat but displays content with syntax highlighting
executables:
  - ccat
provenance:
  formula: ccat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
