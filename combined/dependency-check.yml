id: brew:dependency-check
display-name: OWASP Dependency-Check
homepage: https://owasp.org/www-project-dependency-check/
repo: https://github.com/dependency-check/DependencyCheck
docs:
  - https://github.com/dependency-check/DependencyCheck#readme
  - https://jeremylong.github.io/DependencyCheck
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dependency-Check became a standard OWASP-branded option for teams that wanted
      vulnerability scanning without adopting a commercial SCA platform. Its
      availability as a standalone CLI, Maven plugin, Gradle plugin, Ant task, Jenkins
      plugin, GitHub releases, and Homebrew formula helped it travel through Java shops,
      CI servers, and security baselines.
  package-nerd-significance:
    - >
      Package nerds care about Dependency-Check because it sits at the messy join
      between language package metadata and vulnerability databases. Its CPE matching,
      analyzer requirements, NVD API migration, local data cache, and plugin ecosystem
      are all examples of the hard operational details behind a simple phrase like
      dependency vulnerability scan.
  project-history:
    - >
      The official GitHub repository dates to 2012, and the OWASP project page describes
      Dependency-Check as an SCA tool suite for identifying dependencies and checking
      them against known public vulnerabilities. The project grew from a Java
      command-line scanner into a family of integrations for Maven, Gradle, Ant,
      Jenkins, and other build environments.
    - >
      The README and generated CLI documentation show a project that has adapted to
      changes in vulnerability data distribution. Modern releases use the NVD API,
      recommend an NVD API key for acceptable update speed, and document analyzer
      behavior for ecosystems such as .NET, Go, npm, pnpm, yarn, Ruby, Maven, and
      Gradle.
  related-projects:
    - >
      Related official surfaces include dependency-check-core, dependency-check-cli,
      dependency-check-maven, dependency-check-gradle, dependency-check-ant, and the
      Jenkins plugin.
  sources:
    - https://owasp.org/www-project-dependency-check/
    - https://github.com/dependency-check/DependencyCheck#readme
    - https://dependency-check.github.io/DependencyCheck/dependency-check-cli/
    - https://api.github.com/repos/dependency-check/DependencyCheck
  summary:
    - >
      OWASP Dependency-Check is a long-running software composition analysis tool that
      detects publicly disclosed vulnerabilities in project dependencies. It maps
      dependencies to CPE identifiers and reports related CVE entries, putting
      vulnerability intelligence into command-line, build-tool, and CI workflows.
  timeline:
    - '2012: Official DependencyCheck repository created.'
    - '2012: OWASP Dependency-Check copyright period begins in generated project documentation.'
    - '2024: Version 9.0.0 and later moved from NVD data feeds to the NVD API.'
    - '2026: CLI documentation published for version 12.2.2.'
  usage:
    - >
      The common command-line shape is `dependency-check --project <name> --scan <path>
      --out <dir>`, producing reports that list dependencies, matching CPEs, and CVEs.
      Build integrations usually wire the same engine into verification phases or CI
      jobs, while larger installations may use a shared data directory or centralized
      database to avoid repeatedly downloading vulnerability data.
related-packages:
  - id: brew:grype
    reason: >
      Choose Grype when the primary targets are container images, filesystems, or
      existing SBOMs and you want broad operating-system and language-package coverage
      in a CLI-first scanner.
    rel: alternative
    sources:
      - https://owasp.org/projects/dependency-check
      - https://github.com/anchore/grype/blob/main/README.md
category: security
