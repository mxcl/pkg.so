id: brew:cqlkit
display-name: cqlkit
homepage: https://github.com/tenmax/cqlkit
repo: https://github.com/tenmax/cqlkit
docs:
  - https://github.com/tenmax/cqlkit#readme
config-file-location:
  unix: ~/.cassandra/cqlshrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption profile is modest and task-specific. The official README documents
      direct release downloads, Homebrew installation on macOS, and Docker execution.
  package-nerd-significance:
    - >
      cqlkit is the kind of utility package that matters in data operations because it
      turns a database-specific query path into ordinary shell-friendly JSON and CSV
      streams.
  project-history:
    - >
      The project was created by TenMax around a narrow operational gap: Cassandra's CQL
      shell is useful interactively, but ad hoc export into semi-structured or
      structured formats is awkward.
  related-projects:
    - >
      cqlkit is adjacent to Apache Cassandra's `cqlsh`, but focuses on export workflows
      rather than interactive administration.
  sources:
    - https://github.com/tenmax/cqlkit#readme
    - https://github.com/tenmax/cqlkit/releases
    - https://formulae.brew.sh/formula/cqlkit
  summary:
    - >
      cqlkit is a small Cassandra command-line toolkit for exporting CQL query results
      as JSON or CSV.
  timeline:
    - 'v0.1.0: Early release series added partition-key and token-range query helpers.'
    - >
      v0.3.x: Later releases kept the export-oriented CLI packaged for release downloads
      and Homebrew.
  usage:
    - >
      The package installs `cql2json`, `cql2csv`, `cql2cql`, and `cqlkit`. Users pass a
      query, file, or standard input and can reuse a cqlsh-compatible
      `~/.cassandra/cqlshrc` file for connection settings.
related-packages:
  - id: brew:cassandra
    reason: >
      Apache Cassandra is the database and cqlsh provider that cqlkit queries, and
      cqlkit can reuse Cassandra's cqlshrc connection configuration.
    rel: adjacent_workflow
    sources:
      - https://github.com/tenmax/cqlkit#readme
      - https://cassandra.apache.org/doc/latest/
  - id: brew:jq
    reason: cqlkit's official README recommends jq for processing the JSON produced by cql2json.
    rel: adjacent_workflow
    sources:
      - https://github.com/tenmax/cqlkit#readme
      - https://jqlang.github.io/jq/manual/
  - id: brew:csvkit
    reason: >
      cqlkit's official README recommends csvkit for further command-line processing of
      cql2csv output.
    rel: adjacent_workflow
    sources:
      - https://github.com/tenmax/cqlkit#readme
      - https://csvkit.readthedocs.io/
category: data
package-manager:
  brew: cqlkit
package-manager-url: https://formulae.brew.sh/formula/cqlkit
license: Apache-2.0
tags:
  - cassandra
  - cli
  - cql
  - csv
  - export
  - json
description: CLI tool to export Cassandra query as CSV and JSON format
executables:
  - cql2cql
  - cql2csv
  - cql2json
  - cqlkit
provenance:
  formula: cqlkit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
