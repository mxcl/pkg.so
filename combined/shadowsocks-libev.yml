id: brew:shadowsocks-libev
display-name: shadowsocks-libev
homepage: https://github.com/shadowsocks/shadowsocks-libev
repo: https://github.com/shadowsocks/shadowsocks-libev
docs:
  - https://github.com/shadowsocks/shadowsocks-libev/wiki
  - https://github.com/shadowsocks/shadowsocks-libev#readme
config-file-location:
  unix:
    - /etc/shadowsocks-libev/config.json
    - /usr/local/etc/shadowsocks-libev/config.json
credentials-file-location:
  linux: /etc/shadowsocks-libev/config.json
  unix: /usr/local/etc/shadowsocks-libev/config.json
history:
  adoption-history:
    - >
      The official README documents availability across Debian, Ubuntu, Arch Linux,
      Nix/NixOS, FreeBSD, OpenWrt, macOS, Docker, and Snap, reflecting broad packaging
      for servers, routers, and Unix-like systems. The project is now described as
      bug-fix-only, with future development moved to shadowsocks-rust.
  package-nerd-significance:
    - >
      shadowsocks-libev became a prominent package-manager implementation because its
      C/libev design fit low-resource servers, routers, and embedded devices. It also
      exposes separate Unix-style tools for local proxying, serving, tunneling,
      transparent redirection, NAT setup, and multi-instance management.
  project-history:
    - >
      shadowsocks-libev is a pure-C, libev-based port of Shadowsocks created for low
      memory and resource use. The official project credits the original Shadowsocks
      work by clowwindy and maintenance of this port by madeye and linusyang.
  related-projects:
    - >
      It is a port of the original Shadowsocks project and the direct predecessor, in
      the official organization's implementation line, to shadowsocks-rust. It also
      supports SIP003 plugins and integrates with systemd, iptables, and common Unix
      packaging systems.
  sources:
    - https://github.com/shadowsocks/shadowsocks-libev
    - https://github.com/shadowsocks/shadowsocks-libev/blob/master/Changes
    - https://github.com/shadowsocks/shadowsocks-libev/releases
    - https://github.com/shadowsocks/shadowsocks-libev/wiki
    - https://github.com/shadowsocks/shadowsocks-rust
  summary:
    - >
      shadowsocks-libev is a lightweight secured SOCKS5 proxy implementation written in
      C around libev. It was designed for embedded devices and low-end servers and
      became one of the most widely packaged command-line Shadowsocks implementations.
  timeline:
    - '2013: The official change history records early 1.x releases under the Shadowsocks name.'
    - '2015: The 2.4 series included security and authentication changes.'
    - '2016: The project added `ss-nat` and expanded Debian-oriented packaging and manuals.'
    - '2019: The 3.3 series refined networking behavior and fixed platform issues.'
    - '2020: Version 3.3.4 addressed two CVEs; version 3.3.5 removed the SNI proxy feature.'
    - >
      Later maintenance: The project entered bug-fix-only status and directed future
      development to shadowsocks-rust.
  usage:
    - >
      Operators configure a server or local SOCKS5 client in JSON and run tools such as
      `ss-server`, `ss-local`, `ss-tunnel`, or `ss-redir`. Distribution services
      commonly read `/etc/shadowsocks-libev/config.json`; the `ss-setup` helper can
      create named configurations and systemd template instances.
category: networking
package-manager:
  apk: libshadowsocks-libev
  brew: shadowsocks-libev
  debian: libshadowsocks-libev-dev
  macports: shadowsocks-libev
  nix: shadowsocks-libev
  ubuntu: libshadowsocks-libev-dev
  zypper: libshadowsocks-libev2
package-manager-url: https://formulae.brew.sh/formula/shadowsocks-libev
license: GPL-3.0-or-later
tags:
  - cli
  - encrypted-proxy
  - libev
  - proxy
  - shadowsocks
  - socks5
description: Libev port of shadowsocks
executables:
  - ss-local
  - ss-manager
  - ss-nat
  - ss-redir
  - ss-server
  - ss-setup
  - ss-tunnel
provenance:
  formula: shadowsocks-libev
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
