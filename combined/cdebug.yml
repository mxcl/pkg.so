id: brew:cdebug
display-name: cdebug
homepage: https://iximiuz.com/en/posts/docker-debug-slim-containers/
repo: https://github.com/iximiuz/cdebug
docs:
  - https://github.com/iximiuz/cdebug#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cdebug entered package-manager culture as a modern container-debugging utility
      rather than a classic Unix tool. The Homebrew input records Homebrew and MacPorts
      packaging, and the upstream README documents Homebrew installation for macOS and
      Linux.
  package-nerd-significance:
    - >
      cdebug is notable because it packages a container namespace trick into a single
      statically linked binary. It sits in the practical space between docker exec,
      kubectl debug, nsenter-style debugging, and ad hoc sidecar containers, which makes
      it attractive to operators dealing with minimal images.
  project-history:
    - >
      The upstream README calls cdebug a 'swiss army knife of container debugging' and
      documents commands for exec-style debugging, local port forwarding, and exporting
      or inspecting container filesystems. Its exec workflow is explicitly based on
      ideas from the iximiuz article about debugging slim Docker containers.
    - >
      The GitHub releases begin with v0.0.1 on 2022-11-06 and continue through v0.0.19
      on 2026-01-18, showing an active small-tool release history around container
      debugging workflows.
  related-projects:
    - >
      The upstream README frames cdebug exec as a cross between docker exec and kubectl
      debug, and points to Nixery as a way to build custom debugging images.
  sources:
    - https://api.github.com/repos/iximiuz/cdebug
    - https://github.com/iximiuz/cdebug
    - https://iximiuz.com/en/posts/docker-debug-slim-containers/
    - https://github.com/iximiuz/cdebug#readme
    - https://formulae.brew.sh/api/formula/cdebug.json
    - https://github.com/iximiuz/cdebug/releases
    - https://iximiuz.com/en/posts/docker-debug-slim-containers
  summary:
    - >
      cdebug is a Go-based command-line tool for debugging containers and Kubernetes
      pods, especially slim, scratch, and distroless images that do not include a shell
      or troubleshooting tools.
  timeline:
    - '2022-11-06: v0.0.1 and v0.0.2 published.'
    - '2022-12: v0.0.4 through v0.0.6 published.'
    - '2023: Multiple releases through v0.0.14.'
    - '2024: v0.0.15 through v0.0.18 published.'
    - '2026-01-18: v0.0.19 published.'
  usage:
    - >
      Users run cdebug exec against Docker, containerd, nerdctl, or Kubernetes targets
      to start a temporary debugging sidecar whose tools are available in the target
      container's filesystem view. The README also documents cdebug port-forward for
      exposing unpublished or localhost-only container ports.
related-packages:
  - id: brew:docker-debug
    reason: >
      Choose docker-debug for a Docker-focused implementation of the same
      bring-your-own-toolbox debugging pattern; cdebug's own comparison describes it as
      similar to cdebug exec but without cdebug's chroot technique.
    rel: alternative
    sources:
      - https://github.com/iximiuz/cdebug#similar-tools
      - https://github.com/zeromake/docker-debug
category: developer-tools
package-manager:
  brew: cdebug
  macports: cdebug
package-manager-url: https://formulae.brew.sh/formula/cdebug
license: Apache-2.0
tags:
  - cli
  - containers
  - debugging
  - docker
  - kubernetes
description: Swiss army knife of container debugging
executables:
  - cdebug
provenance:
  formula: cdebug
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
