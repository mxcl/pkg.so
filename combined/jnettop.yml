id: brew:jnettop
display-name: jnettop
homepage: https://sourceforge.net/projects/jnettop/
repo: https://sourceforge.net/p/jnettop/cvs
docs:
  - https://sourceforge.net/projects/jnettop
config-file-location:
  unix: ~/.jnettop
credentials-file-location: null
history:
  adoption-history:
    - >
      jnettop stayed visible through Unix package repositories rather than through a
      large upstream site. Homebrew, Debian-family, Arch, Nix, and other package
      metadata list it as a small network-monitoring utility, which is typical for older
      C tools with stable behavior and little release churn.
  package-nerd-significance:
    - >
      jnettop matters as a compact example of the early-2000s top-for-everything Unix
      tool pattern: minimal UI, libpcap input, curses display, and just enough
      configuration to be useful on border routers and troubleshooting shells.
  project-history:
    - >
      The project was registered on SourceForge in 2002 and released a fast sequence of
      0.x tarballs through 2006. Its README describes the original use case as watching
      outbound-router traffic when a link was saturated, then turning that need into a
      reusable administrator tool.
  related-projects:
    - >
      jnettop belongs beside top-like observability tools and libpcap/tcpdump-based
      packet inspection tools.
    - >
      The README points users to tcpdump documentation for filter syntax and to libpcap
      capabilities for interface discovery.
  sources:
    - >
      SourceForge supplies registration, category, operating-system, language, license,
      and file-release metadata.
    - >
      The 0.13.0 source README supplies the author's motivation, configuration features,
      and usage model.
  summary:
    - >
      jnettop is a curses-style network traffic monitor that presents host and port
      traffic in the spirit of top. SourceForge records the project under network
      monitoring, and the 0.13.0 source README frames it as a tool written after the
      author needed a quick way to inspect router traffic.
  timeline:
    - '2002: SourceForge project registration and 0.2-0.7 release files.'
    - '2003: 0.8.1 and 0.9 release files add to the public archive.'
    - '2004: 0.10 and 0.10.1 release files appear.'
    - '2005: 0.11.0 release files appear.'
    - '2006: 0.12.0 and 0.13.0 source archives appear.'
  usage:
    - >
      Administrators run jnettop on a host or router interface to see traffic streams
      sorted by bandwidth. The 0.13.0 README documents libpcap-style packet filters in
      ~/.jnettop, interface selection, local and remote aggregation, resolver rules, and
      local-network classification.
related-packages:
  - id: brew:iftop
    reason: >
      Choose iftop for a compact interface-centric table of bandwidth between host
      pairs, or jnettop when host-and-port traffic streams and jnettop's aggregation
      controls better match the investigation.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/jnettop/
      - https://pdw.ex-parrot.com/iftop/
category: networking
package-manager:
  brew: jnettop
  debian: jnettop
  nix: jnettop
  pacman: jnettop
  ubuntu: jnettop
package-manager-url: https://formulae.brew.sh/formula/jnettop
license: GPL-2.0-or-later
tags:
  - c
  - cli
  - curses
  - network-monitoring
  - system-administration
  - traffic-monitoring
description: View hosts/ports taking up the most network traffic
executables:
  - jnettop
provenance:
  formula: jnettop
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
