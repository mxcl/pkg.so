id: brew:cargo-generate
display-name: cargo-generate
homepage: https://github.com/cargo-generate/cargo-generate
repo: https://github.com/cargo-generate/cargo-generate
docs:
  - https://cargo-generate.github.io/cargo-generate/index.html
config-file-location:
  unix:
    - $CARGO_HOME/cargo-generate.toml
    - $CARGO_HOME/cargo-generate
credentials-file-location: null
history:
  adoption-history:
    - >
      cargo-generate became common in Rust sub-ecosystems where a useful starter project
      needs more than a bare crate. The official README uses rustwasm's
      wasm-pack-template as its example, reflecting early adoption by
      WebAssembly-oriented Rust workflows.
    - >
      By 2026 it had more than 2 million crates.io downloads and an active changelog,
      indicating sustained use as a project-scaffolding utility rather than a one-off
      template experiment.
  package-nerd-significance:
    - >
      cargo-generate is package-nerd significant because it made template repositories a
      distribution format in the Rust ecosystem. A Git repo could become a reusable
      package-like project skeleton without needing to be published as a crate.
    - >
      It also demonstrates the Cargo subcommand pattern at its most social: package
      managers do not just install programs, they standardize how communities bootstrap
      new projects.
  project-history:
    - >
      The cargo-generate repository and first crates.io release appeared in May 2018.
      The official guide describes the core idea as leveraging a pre-existing git
      repository as a template to get a Rust project started quickly.
    - >
      The project grew into a small templating engine around Git repositories. The guide
      documents Shopify Liquid for templated content, Rhai for hook scripts, regex
      placeholders, and special handling for `.liquid` files.
    - >
      Its documentation also treats template discovery and reuse as first-class
      concepts: the README points users to the GitHub `cargo-generate` topic, while the
      guide supports favorite templates stored in `$CARGO_HOME/cargo-generate.toml` or
      `$CARGO_HOME/cargo-generate`.
  related-projects:
    - rustwasm/wasm-pack-template is the official README's example template.
    - Shopify Liquid, Rhai, and regex are documented building blocks for template expansion.
    - cargo-binstall is mentioned by the README as an alternative installation path.
  sources:
    - https://api.github.com/repos/cargo-generate/cargo-generate
    - https://cargo-generate.github.io/cargo-generate/index.html
    - https://crates.io/crates/cargo-generate
    - https://github.com/cargo-generate/cargo-generate#readme
    - https://github.com/cargo-generate/cargo-generate/blob/main/CHANGELOG.md
    - https://github.com/cargo-generate/cargo-generate/blob/main/guide/src/favorites.md
  summary:
    - >
      cargo-generate is a Cargo subcommand for creating new Rust projects from existing
      git repositories used as templates. Its tagline, repeated in the README and guide,
      is `cargo, make me a project`.
    - >
      The tool filled a gap left by Cargo's built-in `cargo new`: it lets communities
      publish richer starter projects, prompts, placeholders, hooks, and favorites
      without adding template logic to Cargo itself.
  timeline:
    - '2018-05-29: GitHub repository created and initial 0.0.0 crate published to crates.io.'
    - >
      2018: README and guide establish the git-template workflow, with rustwasm's
      wasm-pack-template as an early example.
    - >
      2020s: Guide documents Liquid templating, Rhai hooks, favorite templates, and
      multiple git host shorthands.
    - >
      2026: 0.23.x releases continue with fixes and maintenance; crate exceeds 2 million
      downloads.
  usage:
    - >
      Typical usage is `cargo generate --git https://github.com/owner/template.git` or
      the shorthand `cargo generate owner/template`. The README also documents prefixes
      for GitHub, GitLab, Bitbucket, and SourceHut template locations.
    - >
      Template authors can use Liquid files, Rhai hooks, and placeholders; users can
      define favorite templates in the cargo-generate config file and then invoke them
      by name.
related-packages:
  - id: brew:wasm-pack
    reason: >
      Use wasm-pack after cargo-generate when starting from the documented wasm-pack
      template: cargo-generate creates the Rust/WebAssembly project and wasm-pack
      builds, tests, and packages it.
    rel: adjacent_workflow
    sources:
      - https://cargo-generate.github.io/cargo-generate/library-usage.html
      - https://github.com/rustwasm/wasm-pack-template#readme
      - https://wasm-bindgen.github.io/wasm-pack/
category: developer-tools
package-manager:
  apk: cargo-generate
  brew: cargo-generate
  macports: cargo-generate
  nix: cargo-generate
  pacman: cargo-generate
package-manager-url: https://formulae.brew.sh/formula/cargo-generate
license: Apache-2.0 OR MIT
tags:
  - cargo
  - cli
  - code-generation
  - project-templates
  - rust
  - scaffolding
description: Use pre-existing git repositories as templates
executables:
  - cargo-generate
provenance:
  formula: cargo-generate
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
