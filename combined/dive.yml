id: brew:dive
display-name: dive
homepage: https://github.com/wagoodman/dive
repo: https://github.com/wagoodman/dive
docs:
  - https://github.com/wagoodman/dive#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/dive/*.yaml
    - $XDG_CONFIG_DIRS/dive/*.yaml
    - ~/.config/dive/*.yaml
    - ~/.dive.yaml
    - .dive-ci
credentials-file-location: null
history:
  adoption-history:
    - >
      dive became widely packaged because it solves a common container-image problem
      without requiring a registry service or heavyweight scanner. The official README
      lists installation paths through Homebrew, MacPorts, Arch, Nix, Scoop, winget,
      Chocolatey, Docker images, and direct release packages, which matches its role as
      a small cross-platform CLI/TUI utility.
  package-nerd-significance:
    - >
      For package nerds, dive is notable because it turns opaque container layers back
      into a browsable filesystem history. It sits near Dockerfile linters, image
      scanners, and build-cache tools, but its adoption comes from being easy to install
      locally and immediately useful when a package or image grows unexpectedly.
  project-history:
    - >
      The official GitHub repository was created in May 2018 by wagoodman and describes
      dive as a tool for exploring Docker image contents, layer changes, and ways to
      shrink Docker or OCI images. The README pairs the interactive layer browser with a
      CI mode that bypasses the UI and returns pass/fail results from image-efficiency
      rules.
    - >
      The release train shows the project moving from Docker-centered inspection toward
      broader container-engine support. Official release metadata records v0.9.0 in
      November 2019 with initial Podman support, and later releases continued through
      the 2020s.
  related-projects:
    - >
      Related tools include Docker and Podman for building and loading images, Trivy and
      Grype for vulnerability-focused image inspection, and Hadolint for Dockerfile
      linting before the image is built.
  sources:
    - https://github.com/wagoodman/dive
    - https://raw.githubusercontent.com/wagoodman/dive/master/README.md
    - https://api.github.com/repos/wagoodman/dive
    - https://api.github.com/repos/wagoodman/dive/releases?per_page=10
  summary:
    - >
      dive is a terminal UI for inspecting Docker and OCI image layers, file changes,
      and wasted space. Its sweet spot is the package-builder and container-maintainer
      workflow: after an image build, run `dive` to see which layer added what and
      whether a Dockerfile is leaving avoidable bytes behind.
  timeline:
    - '2018-05-13: Official GitHub repository created.'
    - '2019-11-05: v0.9.0 release published with initial Podman support.'
    - '2021-03-07: v0.10.0 release published.'
    - '2025-03-29: v0.13.1 release published.'
  usage:
    - >
      Users typically run `dive image:tag`, `dive build -t tag .`, or a containerized
      `dive` invocation mounted to the Docker socket. In CI, setting `CI=true` lets
      teams enforce thresholds from a `.dive-ci` file for image efficiency and wasted
      bytes.
related-packages:
  - id: brew:docker
    reason: >
      Use Docker to build or load images, then use dive through its documented
      Docker-engine and Docker-socket workflow to inspect their layers and wasted space.
    rel: adjacent_workflow
    sources:
      - https://github.com/wagoodman/dive#readme
      - https://docs.docker.com/reference/cli/docker/image/build/
  - id: brew:podman
    reason: >
      Choose Podman as the image source when you want dive's layer analysis against a
      daemonless Linux container engine instead of Docker.
    rel: adjacent_workflow
    sources:
      - https://github.com/wagoodman/dive#multiple-image-sources-and-container-engines-supported
      - https://docs.podman.io/en/latest/
category: developer-tools
package-manager:
  apk: dive
  brew: dive
  macports: dive
  nix: dive
  pacman: dive
  scoop: main/dive
  winget: OpenAgentPlatform.Dive
  zypper: dive
package-manager-url: https://formulae.brew.sh/formula/dive
license: MIT
tags:
  - cli
  - docker
  - image-layers
  - inspection
  - oci-images
description: Tool for exploring each layer in a docker image
executables:
  - dive
provenance:
  formula: dive
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
