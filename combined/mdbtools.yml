id: brew:mdbtools
display-name: MDB Tools
homepage: https://github.com/mdbtools/mdbtools/
repo: https://github.com/mdbtools/mdbtools
docs:
  - https://github.com/mdbtools/mdbtools#readme
  - https://github.com/mdbtools/mdbtools/tree/dev/doc
config-file-location:
  linux:
    - /etc/odbcinst.ini
    - ~/.odbcinst.ini
    - /etc/odbc.ini
    - ~/.odbc.ini
  macos:
    - /Library/ODBC/odbcinst.ini
    - ~/Library/ODBC/odbcinst.ini
    - /Library/ODBC/odbc.ini
    - ~/Library/ODBC/odbc.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager metadata shows MDB Tools shipped by Homebrew, Alpine,
      Debian/Ubuntu, Fedora, MacPorts, Nix, and openSUSE. Its adoption is tied to a
      persistent niche: extracting tables, schemas, and queries from Microsoft Access
      files on systems where Access itself is unavailable.
    - >
      The README also documents installation through Debian, Homebrew, and MacPorts,
      confirming that upstream expects users to obtain the suite from package managers
      as well as from source.
  package-nerd-significance:
    - >
      MDB Tools is package-manager significant because it turns a proprietary desktop
      database format into Unix command-line data plumbing. It lets shell scripts, ETL
      jobs, distro packages, and server environments inspect Access databases without
      Microsoft Access.
    - >
      It is also a long-lived reverse-engineering project: the HACKING documentation
      records byte-level Jet file-format knowledge, while the NEWS file shows continuing
      maintenance against malformed inputs, newer Access formats, build systems, and
      ODBC behavior.
  project-history:
    - >
      The official GitHub repository was created on 2010-06-16, but the NEWS file
      preserves older project history through releases such as 0.3 and 0.7.1. The
      project centers on reverse-engineering the Jet3 and Jet4 MDB file formats,
      documented in the upstream HACKING file.
    - >
      MDB Tools 0.9.0 marked a major restart. The NEWS file says the project was under
      new management, moved its canonical home to GitHub, collected years of unapplied
      patches, made GLib optional, added in-memory opening, improved thread safety,
      added `mdb-count` and `mdb-queries`, and moved the former GNOME GUI into the
      separate `gmdb2` project.
    - >
      Later 0.9.x releases emphasized security, fuzzing, Access-version support, ODBC
      fixes, SQL improvements, and documentation updates. Version 1.0.0 stabilized the
      generated `mdbtools.h` approach and kept API and ABI compatibility with the 0.9
      series for most users.
  related-projects:
    - >
      The README says the GNOME MDB viewer/debugger moved to
      https://github.com/mdbtools/gmdb2.
    - MDB Tools integrates with unixODBC or iODBC for ODBC access to MDB files.
  sources:
    - https://api.github.com/repos/mdbtools/mdbtools
    - https://github.com/mdbtools/mdbtools#readme
    - https://github.com/mdbtools/mdbtools/blob/dev/HACKING.md
    - https://github.com/mdbtools/mdbtools/blob/dev/NEWS
    - source_facts.package-manager
  summary:
    - >
      MDB Tools is a suite for reading and extracting data from Microsoft Access MDB
      databases on Unix-like systems. The upstream README describes command-line
      utilities, core libraries, a SQL engine, and an ODBC driver.
  timeline:
    - '2010-06-16: Official GitHub repository created.'
    - >
      0.7.1: NEWS records modernization of autoconf/automake bootstrapping and
      experimental Unicode ODBC support.
    - >
      0.9.0: Project moved to its new GitHub home under new management and absorbed
      years of patches.
    - '0.9.2: Security and bug-fix release prompted by OSS-Fuzz memory-error findings.'
    - '1.0.0: Generated `mdbtools.h` and API/ABI compatibility notes for 0.9-series users.'
  usage:
    - >
      The utility suite includes commands such as `mdb-tables` to list tables,
      `mdb-schema` to print DDL, `mdb-export` to export tables to CSV or SQL, `mdb-json`
      to emit JSON, `mdb-count` for row counts, `mdb-sql` for simple SQL, and
      `mdb-queries` for saved Access queries.
    - >
      Library and integration users can use `libmdb`, `libmdbsql`, and the ODBC driver.
      The README describes ODBC support for unixODBC or iODBC and notes that man pages
      provide usage instructions for each program.
related-packages:
  - id: brew:unixodbc
    reason: >
      unixODBC is the documented driver manager for registering the MDB Tools ODBC
      driver and querying Access files from ODBC clients such as `isql`.
    rel: adjacent_workflow
    sources:
      - https://github.com/mdbtools/mdbtools#readme
      - https://www.unixodbc.org/doc
category: data
package-manager:
  apk: mdbtools
  brew: mdbtools
  debian: libmdb3t64
  dnf: mdbtools
  macports: mdbtools
  nix: mdbtools
  ubuntu: libmdb3t64
  zypper: libmdb3
package-manager-url: https://formulae.brew.sh/formula/mdbtools
license: GPL-2.0-or-later
tags:
  - cli
  - database
  - mdb
  - microsoft-access
  - odbc
description: Tools to facilitate the use of Microsoft Access databases
executables:
