history:
  adoption-history:
    - >
      PHTV is distributed as a signed macOS application, through the developer's
      Homebrew tap, and through the main Homebrew Cask catalog. Sparkle supplies signed
      in-app updates.
    - >
      The project serves Mac users who need Vietnamese input without relying on a cloud
      service. Support for both major Vietnamese input conventions, multiple encodings,
      application-specific rules, macros, and import/export gives it a broader role than
      a minimal keystroke converter.
  package-nerd-significance:
    - >
      PHTV is notable as an open-source, native Swift implementation of a
      language-specific desktop input tool distributed through Homebrew Cask. Input
      utilities sit close to the operating system's event and permission layers, so its
      public source, local processing, explicit privacy policy, signed updates, and
      regression tests are especially relevant to security-conscious package users.
    - >
      The package also illustrates how a focused input method can grow into a menu-bar
      productivity suite while retaining offline core processing.
  project-history:
    - >
      PHTV was created as a modern Vietnamese typing application for macOS. Its native
      engine processes Telex, VNI, and Simple Telex input locally and supports Unicode
      plus legacy Vietnamese encodings.
    - >
      The project expanded beyond core composition with spell checking, macros and
      dynamic text snippets, per-application behavior, configurable switching shortcuts,
      an emoji/GIF/sticker picker, clipboard history, settings backup and restore, and a
      signed automatic-update pipeline.
  related-projects:
    - >
      PHTV supports the Telex and VNI Vietnamese input conventions and includes Simple
      Telex as an additional mode.
    - >
      Sparkle provides its signed automatic-update mechanism, while Homebrew supplies
      command-line installation and removal workflows.
  sources:
    - Homebrew adoption is supplied by source_facts.package-manager["brew-cask"].
    - >
      Official installation guide:
      https://github.com/PhamHungTien/PHTV/blob/main/docs/INSTALL.md
    - 'Official privacy policy: https://phamhungtien.com/PHTV/privacy.html'
    - 'Official releases: https://github.com/PhamHungTien/PHTV/releases'
    - 'Official repository README: https://github.com/PhamHungTien/PHTV#readme'
  summary:
    - >
      PHTV, short for Precision Hybrid Typing Vietnamese, is an open-source native macOS
      Vietnamese input application. It provides offline Telex, VNI, and Simple Telex
      processing together with macros, multiple character encodings, configurable
      shortcuts, and related typing tools.
  timeline:
    - 'Initial project phase: PHTV launched as a native Vietnamese typing utility for macOS.'
    - >
      Later development: The application added macros, spell checking, multiple
      encodings, per-application behavior, settings portability, clipboard history, and
      media-picker features.
    - >
      Current distribution: Signed releases, Sparkle updates, automated release checks,
      and Homebrew installation support the public package.
  usage:
    - >
      After installation, users grant the macOS Accessibility and Input Monitoring
      permissions, select Vietnamese mode from the menu bar, and switch between
      Vietnamese and English with a configurable shortcut. Telex, VNI, Simple Telex, and
      output encoding are selected in Settings.
    - >
      Core keystroke conversion runs locally. Optional network activity is limited to
      disclosed features such as update checks and GIF or sticker searches; the official
      privacy policy states that typed content is not uploaded.
