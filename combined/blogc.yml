id: brew:blogc
display-name: blogc
homepage: https://blogc.rgm.io/
repo: https://github.com/blogc/blogc
docs:
  - https://blogc.rgm.io/
  - https://blogc.rgm.io/man/blogc-make.1.html
  - https://blogc.rgm.io/man/blogc.1.html
  - https://blogc.rgm.io/man/blogcfile.5.html
config-file-location:
  unix:
    - blogcfile
    - file passed to blogc-make -f
credentials-file-location: null
history:
  adoption-history:
    - >
      blogc's adoption has been strongest in Unix package-manager and source-based
      distribution circles rather than in mainstream JavaScript static-site tooling. Its
      own site lists release tarballs plus package routes for Debian/Ubuntu,
      Fedora/RHEL/CentOS COPR, Termux, openSUSE, and Gentoo, and the input metadata also
      records Homebrew, Fedora, Nix, and openSUSE package names.
    - >
      The project ships an example blog repository and documents using blogc with make
      or blogc-make, which made it attractive to users who wanted a static site
      generator with C portability and predictable command-line behavior.
  package-nerd-significance:
    - >
      blogc is package-nerd catnip because it is a C static-site generator that thinks
      like a compiler: libc at runtime, POSIX portability as a stated goal, man pages
      for interfaces, and build integration through make instead of a large language
      runtime.
    - >
      It sits in the small but interesting lineage of minimal static-site tools where
      the packaging story matters: release tarballs, distro repositories, man pages, and
      reproducible command-line invocations are as central as themes or plugins.
  project-history:
    - >
      Rafael G. Martins started blogc as an experiment in a simple blog compiler with
      its own template engine and markup language. The project deliberately avoided
      CMS-style global state: the core blogc command compiles source files and
      templates, while helper programs such as blogc-make, blogc-git-receiver, and
      blogc-runserver cover common publishing workflows.
    - >
      The public release line began with 0.1 beta tags in 2015 and continued through a
      series of 0.x releases. Later releases added build-tool conveniences, pagination
      and listing improvements, table-of-contents generation, signed release artifacts,
      and a Debian/Ubuntu repository announced with 0.20.1.
  related-projects:
    - blogc-example is the official starter repository for new sites.
    - >
      blogc-make is the bundled build tool that turns blogc into a more complete
      blog-building workflow while keeping the compiler separate.
    - >
      The project overlaps conceptually with static-site generators and make-based
      publishing systems, but its own docs emphasize that it is a compiler, not a
      blogging engine.
  sources:
    - https://blogc.rgm.io/
    - https://blogc.rgm.io/man/blogc.1.html
    - https://blogc.rgm.io/man/blogcfile.5.html
    - https://blogc.rgm.io/news/
    - https://github.com/blogc/blogc
    - source_facts.package-manager
  summary:
    - >
      blogc is a small static blog compiler that treats site generation like a
      source-to-output compilation step rather than like a full blogging engine. Its
      official site describes it as stateless, idempotent, make-friendly, and aimed at
      developers who are comfortable wiring command-line tools together.
  timeline:
    - '2015: First 0.1 beta tags appear in the official Git repository.'
    - >
      2015: The blogc site copyright and early release materials identify Rafael G.
      Martins as the author.
    - >
      2019: Version 0.18.0 added blogc-make pagination_tags support and signed release
      artifacts.
    - '2020: Version 0.20.0 added table-of-contents generation for source files.'
    - '2021: Version 0.20.1 announced a Debian/Ubuntu repository and minor fixes.'
  usage:
    - >
      Typical usage passes source files and templates to blogc to emit HTML or feed
      resources, or uses blogc-make with a blogcfile to define site-wide variables,
      content directories, templates, posts, tags, and generated outputs. The compiler
      can be embedded in ordinary make rules because each invocation has no shared
      state.
    - >
      The package installs several executables: blogc for compilation, blogc-make for
      project builds, blogc-runserver for local serving, and blogc-git-receiver for
      git-push publishing workflows.
related-packages:
  - id: brew:hugo
    reason: >
      Choose Hugo when you want a larger website framework with themes, content
      taxonomies, asset processing, and a built-in development server; choose blogc for
      a smaller C compiler that composes directly with make-style workflows.
    rel: alternative
    sources:
      - https://blogc.rgm.io/
      - https://gohugo.io/documentation/
category: developer-tools
package-manager:
  brew: blogc
  dnf: blogc
  nix: blogc
  zypper: blogc
package-manager-url: https://formulae.brew.sh/formula/blogc
license: BSD-3-Clause
tags:
  - blog
  - cli
  - compiler
  - static-site
description: Blog compiler with template engine and markup language
executables:
  - blogc
  - blogc-git-receiver
  - blogc-make
  - blogc-runserver
provenance:
  formula: blogc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
