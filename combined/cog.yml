id: brew:cog
display-name: Cog
homepage: https://cog.run/
repo: https://github.com/replicate/cog
docs:
  - https://cog.run/
config-file-location:
  unix: cog.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Cog is closely tied to Replicate but is documented for deployment to a user's own
      infrastructure as well. The official README lists Homebrew installation on macOS
      through replicate/tap/cog, install scripts, manual release binaries, Docker
      installation, and Windows 11 usage through WSL 2; the supplied package facts also
      list Debian, MacPorts, Nix, and zypper.
  package-nerd-significance:
    - >
      Cog is notable to package maintainers because it packages a complex ML deployment
      stack behind a single executable and declarative YAML file. It turns GPU base
      images, Python dependency pinning, Docker build behavior, typed model inputs, and
      API serving into repeatable package surfaces rather than per-model hand wiring.
  project-history:
    - >
      The official README says Cog was created by Andreas Jansson and Ben Firshman. It
      explains the project as an open-source response to the difficulty of shipping
      research models to production, especially the repeated work around Dockerfiles,
      CUDA versions, model preprocessing and postprocessing, and HTTP servers.
    - >
      The project encodes model environments in cog.yaml and model execution in Python,
      then builds Docker images and serves a generated HTTP inference API. The README
      highlights Docker best practices, CUDA/cuDNN/PyTorch/TensorFlow/Python
      compatibility, OpenAPI schema generation, validation, and a Rust/Axum server.
  related-projects:
    - >
      The README relates Cog to Docker, CUDA/cuDNN, PyTorch, TensorFlow, OpenAPI,
      Replicate deployment, and prior ML-container work at Spotify and companies such as
      Uber.
  sources:
    - https://github.com/replicate/cog#readme
    - https://cog.run/
  summary:
    - >
      Cog is Replicate's open-source CLI for packaging machine-learning models into
      production-ready Docker containers.
  timeline:
    - 'README: Cog documents Andreas Jansson and Ben Firshman as creators.'
    - >
      README: Installation paths include Homebrew, install scripts, manual release
      binaries, Docker images, and WSL 2 for Windows 11.
  usage:
    - >
      The normal package workflow is to define a cog.yaml build environment and a Python
      runner, use cog run for local inference, cog build to produce a Docker image, or
      cog serve to expose the model over HTTP. No credentials file is intrinsic to the
      CLI package itself.
related-packages:
  - id: brew:docker
    reason: >
      Cog requires Docker to build and run its model containers, so install the Docker
      CLI alongside Cog and connect it to a Docker-compatible daemon.
    rel: adjacent_workflow
    sources:
      - https://github.com/replicate/cog
      - https://docs.docker.com/reference/cli/docker/
category: data
package-manager:
  brew: cog
  debian: cog
  macports: cog
  nix: cog
  zypper: cog
package-manager-url: https://formulae.brew.sh/formula/cog
license: Apache-2.0
tags:
  - cli
  - containers
  - docker
  - machine-learning
  - model-deployment
  - openapi
  - python
description: Containers for machine learning
executables:
  - cog
provenance:
  formula: cog
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
