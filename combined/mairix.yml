id: brew:mairix
display-name: mairix
homepage: https://github.com/vandry/mairix
repo: https://github.com/vandry/mairix
docs:
  - https://github.com/vandry/mairix#readme
config-file-location:
  unix: ~/.mairixrc
credentials-file-location:
  unix: ~/.mairixrc
history:
  adoption-history:
    - >
      Upstream positions mairix as a complement to mail readers such as mutt and
      Sylpheed, because searches produce a match folder that normal mail clients can
      open. That workflow made mairix attractive to users who wanted fast local search
      without changing their main terminal mail client.
    - >
      The README notes a mairix-users mailing list available since July 2006, and the
      ACKNOWLEDGEMENTS file lists a broad patch and suggestion history. That is modest,
      but real, evidence of a small long-lived user and contributor community.
  package-nerd-significance:
    - >
      mairix is a classic small Unix mail tool: narrow job, plain text configuration,
      fast incremental indexing, and output designed to compose with existing mail
      clients. It is especially notable for supporting several old mailbox formats
      without insisting on a new mail store.
    - >
      For package maintainers, mairix sits in the same ecosystem as mutt, MH/nmh-style
      folders, Sylpheed, Claws Mail, and Gnus. Its value is less about being a full mail
      app and more about being the search engine you can bolt onto one.
  project-history:
    - >
      The official README identifies Richard P. Curnow as the original author and dates
      the original copyright period to 2002-2004. It also says Kim Vandry has maintained
      the project since 2017, matching the current GitHub repository location.
    - >
      The NEWS file shows mairix growing from a local maildir/MH search tool into a
      broader mail search utility. Version 0.4 added MH folder support, 0.12 added mbox
      indexing and output, 0.17 notes a migration to Git for revision control, and
      version 0.24 added remote IMAP folder support.
  related-projects:
    - mutt is named by the README as a useful companion mail program.
    - Sylpheed is named by the README as a useful companion mail program.
    - >
      Claws Mail, Evolution, Gnus, and xmh appear in the manpage as supported MH-family
      folder variants.
  sources:
    - https://github.com/vandry/mairix
    - https://raw.githubusercontent.com/vandry/mairix/master/ACKNOWLEDGEMENTS
    - https://raw.githubusercontent.com/vandry/mairix/master/NEWS
    - https://raw.githubusercontent.com/vandry/mairix/master/README
    - https://raw.githubusercontent.com/vandry/mairix/master/mairix.1
    - https://raw.githubusercontent.com/vandry/mairix/master/mairixrc.5
  summary:
    - >
      mairix is a command-line indexer and search tool for email collections stored in
      Maildir, MH, MMDF, mbox, and later IMAP-backed folders.
  timeline:
    - '2002-2004: Original Richard P. Curnow copyright period documented in README.'
    - '2006: mairix-users mailing list is documented as available since July 2006.'
    - '2007: NEWS for version 0.17 notes migration to Git revision control.'
    - >
      2017: README says maintenance passed to Kim Vandry; GitHub release 0.24 is dated
      August 13, 2017.
  usage:
    - >
      mairix indexes configured mail folders into a database, then search mode creates a
      match folder containing symlinks or copied messages, depending on the source and
      result folder formats. It can also print raw matches or excerpts for scripts.
    - >
      Configuration lives in $HOME/.mairixrc unless overridden with -f or --rcfile. The
      mairixrc manual documents required base, mfolder, database, and folder directives,
      plus optional IMAP settings including imap_username and imap_password.
related-packages:
  - id: brew:notmuch
    reason: >
      Choose notmuch for tag-oriented global mail search with library and editor
      integrations; choose mairix when its generated result-folder workflow and legacy
      mailbox-format support better fit the mail client.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/vandry/mairix/master/README
      - https://notmuchmail.org/
  - id: brew:mutt
    reason: >
      mairix explicitly produces virtual search folders that Mutt can open, providing
      fast indexing and search alongside Mutt's terminal mail interface.
    rel: adjacent_workflow
    sources:
      - https://raw.githubusercontent.com/vandry/mairix/master/README
      - https://www.mutt.org/doc/manual/
category: productivity
package-manager:
  brew: mairix
  debian: mairix
  dnf: mairix
  macports: mairix
  nix: mairix
  pacman: mairix
  ubuntu: mairix
  zypper: mairix
package-manager-url: https://formulae.brew.sh/formula/mairix
license: GPL-2.0-only
tags:
  - cli
  - email
  - indexing
  - maildir
  - mbox
  - search
description: Email index and search tool
executables:
  - mairix
provenance:
  formula: mairix
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
