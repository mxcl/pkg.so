id: brew:libimobiledevice
display-name: libimobiledevice
homepage: https://www.libimobiledevice.org/
repo: https://github.com/libimobiledevice/libimobiledevice
docs:
  - https://libimobiledevice.org/docs
  - https://libimobiledevice.org/docs/libimobiledevice/latest
  - https://github.com/libimobiledevice/libimobiledevice#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libimobiledevice became a dependency hub for Linux desktop integration,
      package-manager utilities, mobile-device automation, and restore workflows. Its
      own README lists testing on Linux, macOS, Windows, and Android, and the project
      site cites integration by community projects and larger deployments handling more
      than 10,000 devices.
  package-nerd-significance:
    - >
      For package maintainers, libimobiledevice is important because it coordinates a
      small ecosystem of tightly related libraries: libplist for property lists,
      libusbmuxd and usbmuxd for USB multiplexing, libimobiledevice-glue for shared
      helpers, libirecovery for recovery-mode communication, and idevicerestore for
      firmware workflows. Keeping these versions aligned is the package-manager puzzle.
  project-history:
    - >
      The project README says development began in August 2007 with the goal of bringing
      support for Apple mobile devices to the Linux desktop. The project site describes
      the original motivation more pointedly: iTunes was not available for Linux, so
      libiphone was created and later became libimobiledevice to let Linux systems
      communicate with Apple devices.
    - >
      The library grew from device discovery and file access into a wider service layer:
      pairing, AFC filesystem access, backup and restore, diagnostics, screenshots,
      syslog relay, provisioning, debug services, developer disk image mounting, and
      other native device services. The 1.3.0 release was part of a June 15, 2020
      release round that also included usbmuxd, libplist, libirecovery, idevicerestore,
      ifuse, and related projects.
    - >
      Version 1.4.0, released on October 10, 2025, was labeled a development release
      with plans for more frequent releases. Its notes included MbedTLS support, reverse
      proxy work, wireless pairing for Apple TV, iOS 17+ personalized developer disk
      image mounting, new tools, and API additions.
  related-projects:
    - >
      Related projects include libplist, libusbmuxd, usbmuxd, libimobiledevice-glue,
      libirecovery, libtatsu, libideviceactivation, ideviceinstaller, idevicerestore,
      and ifuse. Together they form the open source Apple-device access stack used by
      many Unix-like packages.
  sources:
    - https://github.com/libimobiledevice/libimobiledevice/releases
    - https://libimobiledevice.org/
    - https://libimobiledevice.org/news/2020/06/15/release-galore/
    - https://libimobiledevice.org/news/2025/10/24/docs-updated/
    - https://raw.githubusercontent.com/libimobiledevice/libimobiledevice/master/README.md
  summary:
    - >
      libimobiledevice is the core C library and tool suite for talking to iPhone, iPod
      touch, iPad, Apple TV, and related iOS-family devices using native protocols. It
      is one of the canonical open source answers to using Apple mobile devices from
      Linux and other non-iTunes environments.
  timeline:
    - >
      2007-08: Development began with the goal of supporting Apple mobile devices on the
      Linux desktop.
    - '2015-02-02: libimobiledevice 1.2.0 was published on GitHub releases.'
    - >
      2020-06-15: The project announced a release round including libimobiledevice
      1.3.0, libirecovery 1.0.0, idevicerestore 1.0.0, and related components.
    - >
      2025-10-10: libimobiledevice 1.4.0 was released with MbedTLS support,
      wireless-pairing work, new tools, and API additions.
    - '2025-10-24: Project API documentation was updated for the 1.4.0 release.'
  usage:
    - >
      Users usually meet the package through tools such as idevice_id, ideviceinfo,
      idevicepair, idevicebackup2, ideviceimagemounter, idevicescreenshot,
      idevicesyslog, and afcclient. Developers use the library when they need
      Apple-device protocols without linking to Apple proprietary libraries or requiring
      jailbreaks.
related-packages:
  - id: brew:ifuse
    reason: >
      ifuse uses libimobiledevice for communication and mounts an iOS device's media,
      app documents, or app containers as a local FUSE filesystem.
    rel: adjacent_workflow
    sources:
      - https://github.com/libimobiledevice/ifuse
      - https://github.com/libimobiledevice/ifuse/blob/master/docs/ifuse.1
  - id: brew:ideviceinstaller
    reason: >
      ideviceinstaller complements libimobiledevice's bundled service tools by listing,
      installing, upgrading, and uninstalling applications on connected iOS devices.
    rel: adjacent_workflow
    sources:
      - https://github.com/libimobiledevice/ideviceinstaller
      - https://github.com/libimobiledevice/ideviceinstaller/blob/master/man/ideviceinstaller.1
