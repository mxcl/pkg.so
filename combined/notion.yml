history:
  adoption-history:
    - >
      Notion 2.0's 2018 Product Hunt launch supplied the project's first strong
      traction. Notion reached one million users in 2020 and removed the storage limit
      for personal users that year. Remote and hybrid work, template sharing, and the
      creator economy broadened adoption; the company reported passing 100 million users
      in August 2024.
  package-nerd-significance:
    - >
      Notion is a prominent example of a cloud-first, block-based workspace packaged as
      a native desktop application. It matters in package ecosystems because users
      commonly automate installation of its frequently updated Electron-style client
      while their primary workspace data remains tied to the hosted service. Its public
      API and integration ecosystem also make it a programmable productivity platform
      rather than only a notes application.
  project-history:
    - >
      Notion began in 2013 with a mission inspired by early ideas about augmenting human
      intellect. After several unsuccessful rebuilds, founders Ivan Zhao and Simon Last
      rewrote the product in Japan; Notion 2.0 launched in 2018 and established the
      basis of the modern block-based workspace. The product subsequently expanded from
      documents and databases into team collaboration, integrations, APIs, and
      AI-assisted work.
  related-projects:
    - >
      Notion API: The official developer platform allows integrations to work with
      pages, databases, users, and other workspace objects.
    - >
      Notion AI: AI writing features entered private alpha in 2022 and later expanded
      into workspace Q&A and other assisted workflows.
    - >
      Confluence, Asana, Evernote, and Trello: Notion officially supports importing data
      from these established documentation and productivity tools.
  sources:
    - https://developers.notion.com/
    - https://www.notion.com/blog/100-million-of-you
    - https://www.notion.com/blog/behind-the-scenes-notion-ai
    - https://www.notion.com/help/import-data-into-notion
    - https://www.notion.com/help/notion-for-desktop
  summary:
    - >
      Notion is a hosted, block-based workspace for notes, documents, databases,
      planning, knowledge management, and team collaboration. It is available through
      web, desktop, and mobile clients and supports templates, imports, integrations, an
      official API, and AI-assisted workflows.
  timeline:
    - '2013: Notion was started.'
    - '2018: Notion 2.0 launched on Product Hunt and began gaining traction.'
    - '2020: Notion passed one million users and expanded its free personal offering.'
    - '2022: Notion AI entered private alpha.'
    - '2024: Notion passed 100 million users.'
    - >
      2026: The desktop application continues to receive automatic updates and
      managed-deployment support.
  usage:
    - >
      Individuals use Notion for notes, personal planning, databases, and published
      pages. Teams use shared workspaces for project tracking, documentation, wikis,
      knowledge bases, and collaboration. Desktop users receive a focused multi-tab
      interface, notifications, global command search, automatic updates, and links that
      can open directly in the application.
