id: brew:apibuilder-cli
display-name: apibuilder-cli
homepage: https://www.apibuilder.io
repo: https://github.com/apicollective/apibuilder-cli
docs:
  - https://app.apibuilder.io/generators
  - https://github.com/apicollective/apibuilder-cli#readme
  - https://www.apibuilder.io/
config-file-location:
  unix:
    - ~/.apibuilder/config
    - .apibuilder/config
credentials-file-location:
  unix: ~/.apibuilder/config
history:
  adoption-history:
    - >
      The README documents Homebrew installation on macOS and a shell install path for
      other platforms. The batch input shows Homebrew packaging, which is consistent
      with a developer workflow tool used from local repositories and CI jobs rather
      than as a long-running service.
  package-nerd-significance:
    - >
      apibuilder-cli matters as glue between an API catalog and generated client/server
      code in a local source tree. For package users, the interesting bits are the split
      between global credentials and per-project generator config, and the fact that the
      CLI can be driven from Git hooks or continuous delivery with silent upload and
      clean modes.
  project-history:
    - >
      The public apicollective/apibuilder-cli repository was created in 2015. The README
      describes a CLI centered on the app.apibuilder.io service: public APIs need no
      setup, while private APIs use a generated configuration file containing an API
      token.
    - >
      The broader API Builder site presents the service as tooling for modern APIs,
      including management, sharing, version history, native libraries, and code
      generators. The CLI is the package-manager-facing piece of that ecosystem,
      exposing generator and upload workflows to scripts.
  related-projects:
    - >
      apibuilder-cli is related to the API Builder web service, app.apibuilder.io
      generators, API descriptor formats, and generated clients such as Play, http4s,
      Android, Kotlin, and other generator-backed outputs.
  sources:
    - https://api.github.com/repos/apicollective/apibuilder-cli
    - https://app.apibuilder.io/generators
    - https://github.com/apicollective/apibuilder-cli#readme
    - https://www.apibuilder.io/
    - input source_facts.package-manager
  summary:
    - >
      apibuilder-cli is the command-line interface for API Builder, a platform for
      managing API descriptions and invoking code generators. It lets users list
      organizations and applications, upload API descriptors, generate clients, and
      update local generated code from project configuration.
  timeline:
    - '2015: Public apicollective/apibuilder-cli repository created.'
    - '2010s: README documents Homebrew installation and token-backed private API setup.'
    - '2026: Repository metadata shows continued pushes to the public repository.'
  usage:
    - >
      The CLI can list organizations, applications, and versions; invoke a named
      generator into a target directory; upload an API descriptor with a version; update
      generated code based on .apibuilder/config; clean API Builder versions not tagged
      in the source repository; and check or upgrade the CLI itself.
    - >
      Private API use stores tokens in ~/.apibuilder/config. Project update workflows
      use a YAML .apibuilder/config file in the current repository to specify
      organizations, projects, versions, generators, target paths, file patterns, and
      generator attributes.
related-packages:
  - id: brew:openapi-generator
    reason: >
      Choose OpenAPI Generator when code should be produced locally from OpenAPI 2.0 or
      3.x documents across a broad client and server matrix; API Builder CLI instead
      works through the API Builder catalog and its hosted or self-managed generators.
    rel: alternative
    sources:
      - https://www.apibuilder.io/
      - https://github.com/apicollective/apibuilder-cli#readme
      - https://openapi-generator.tech/
      - https://openapi-generator.tech/docs/usage
category: developer-tools
package-manager:
  brew: apibuilder-cli
package-manager-url: https://formulae.brew.sh/formula/apibuilder-cli
license: MIT
tags:
  - api
  - api-builder
  - cli
  - client-generator
  - code-generation
description: Command-line interface to generate clients for api builder
executables:
  - apibuilder
  - create-config
  - read-config
provenance:
  formula: apibuilder-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
