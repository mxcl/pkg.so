id: brew:i386-elf-gdb
display-name: i386-elf-gdb
homepage: https://www.gnu.org/software/gdb/
repo: https://sourceware.org/git/binutils-gdb.git
docs:
  - https://sourceware.org/gdb/documentation
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/gdb/gdbinit
    - ~/.config/gdb/gdbinit
    - ~/.gdbinit
  macos:
    - ~/Library/Preferences/gdb/gdbinit
    - ~/.gdbinit
credentials-file-location: null
history:
  adoption-history:
    - >
      GDB became one of the standard GNU development tools alongside GCC and Binutils.
      Its adoption spread through Unix-like systems because it could debug native
      programs, remote targets, and simulator targets, and because GNU toolchains made
      source-level debugging part of the normal compile-link-debug loop.
    - >
      The i386-elf-gdb formula is a narrower package-manager artifact: Homebrew labels
      it as the GNU debugger for i386-elf cross development and ships executables such
      as i386-elf-gdb. That target prefix is valuable for cross projects because it
      avoids mixing host debuggers with bare-metal toolchains.
  package-nerd-significance:
    - >
      This is a classic cross-toolchain package: upstream GDB is broad and old, while
      the package name encodes the target ABI. Package nerds care because
      target-prefixed GNU tools make reproducible cross environments possible without
      replacing the host compiler or debugger.
  project-history:
    - >
      GDB came from the early GNU system effort. GNU's January 1987 bulletin described
      GDB as a source-level C debugger written for GNU in 1986, and Richard Stallman's
      1986 KTH lecture described it as a symbolic C debugger influenced by DBX.
    - >
      The Sourceware documentation describes GDB as a debugger for seeing what happens
      inside a running program or at the moment it crashes, with support for stopping
      execution, examining state, and changing program behavior. The GDB news archive
      shows the long public release line, including GDB 4.18 in 1999, the 5.0 release
      cycle in 2000, and later 6.x releases.
  related-projects:
    - GDB shares the Sourceware binutils-gdb repository with GNU Binutils.
    - >
      It is commonly paired with GCC, GNU Binutils, QEMU, simulators, and remote
      debugging stubs in cross-development workflows.
  sources:
    - https://formulae.brew.sh/formula/i386-elf-gdb
    - https://sourceware.org/gdb/documentation/
    - https://www.gnu.org/bulletins/bull2.txt
    - https://www.gnu.org/philosophy/stallman-kth.html
    - https://www.gnu.org/software/gdb/
    - https://www.sourceware.org/gdb/news/
  summary:
    - >
      i386-elf-gdb is Homebrew's target-prefixed build of the GNU Debugger for i386-elf
      cross development. The package matters because it gives bare-metal and
      operating-system developers a debugger whose executable name matches the target
      triple used by their cross compiler and binutils.
  timeline:
    - '1986: GDB entered distribution as a GNU source-level C debugger.'
    - >
      1987: GNU's bulletin listed GDB among GNU software available from the Free
      Software Foundation.
    - '1999: GDB 4.18 release announced in the Sourceware news archive.'
    - '2000: GDB 5.0 released after a public branch and release cycle.'
    - '2026: Homebrew packaged i386-elf-gdb as a GDB build for i386-elf cross development.'
  usage:
    - >
      Typical use is debugging i386-elf binaries produced by a matching cross compiler,
      often through a simulator, emulator, remote stub, or kernel-development workflow.
      The upstream GDB manual's core workflow is unchanged: load a program or symbols,
      run or connect to a target, set breakpoints, inspect registers and variables, and
      step through execution.
    - >
      For package users, the significant detail is the executable prefix. Scripts,
      Makefiles, and OS-development tutorials can call i386-elf-gdb explicitly and stay
      separate from /usr/bin/gdb or an unprefixed Homebrew GDB.
related-packages:
  - id: brew:qemu
    reason: >
      Use QEMU with i386-elf-gdb to emulate an x86 machine and debug guest or bare-metal
      code through QEMU's officially documented GDB remote stub.
    rel: adjacent_workflow
    sources:
      - https://www.qemu.org/docs/master/system/gdb.html
      - https://sourceware.org/gdb/current/onlinedocs/gdb.html/Connecting.html
category: developer-tools
package-manager:
  brew: i386-elf-gdb
package-manager-url: https://formulae.brew.sh/formula/i386-elf-gdb
license: GPL-3.0-or-later
tags:
  - cli
  - cross-development
  - debugger
  - gdb
  - gnu
  - i386-elf
description: GNU debugger for i386-elf cross development
executables:
  - i386-elf-gdb
  - i386-elf-gdb-add-index
  - i386-elf-gstack
provenance:
  formula: i386-elf-gdb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
