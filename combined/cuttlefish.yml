id: brew:cuttlefish
display-name: Cuttlefish
homepage: https://combine-lab.github.io/cuttlefish/
repo: https://github.com/COMBINE-lab/cuttlefish
docs:
  - https://combine-lab.github.io/cuttlefish
  - https://github.com/COMBINE-lab/cuttlefish#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      COMBINE-lab lists Cuttlefish as an active de Bruijn-graph tool. It is also used in
      the lab's wider genomics tooling: official alevin-fry tutorials identify
      Cuttlefish as a dependency in the Piscem indexing stack.
  package-nerd-significance:
    - >
      Cuttlefish is notable to scientific-package users because compacted de Bruijn
      graph construction is a foundational but resource-intensive genomics operation.
      Its emphasis on parallel execution and low memory use makes it useful in
      reproducible command-line pipelines and unusually suitable for installation
      through a general-purpose package manager.
  project-history:
    - >
      Cuttlefish was developed by Jamshed Khan and Rob Patro at COMBINE-lab. The
      original work focused on fast, parallel, low-memory compaction of de Bruijn graphs
      from large genome collections; Cuttlefish 2 extended that work with a scalable
      implementation for references or sequencing reads.
  related-projects:
    - >
      Piscem and piscem-cpp use compacted de Bruijn graph infrastructure in COMBINE-lab
      workflows.
    - Pufferfish and PuffAligner are related COMBINE-lab indexing and alignment projects.
  sources:
    - https://combine-lab.github.io/alevin-fry-tutorials/2023/simpleaf-piscem/
    - https://combine-lab.github.io/cuttlefish/
    - https://combine-lab.github.io/publications/
    - https://combine-lab.github.io/resources/
    - https://github.com/COMBINE-lab/cuttlefish#readme
  summary:
    - >
      Cuttlefish is a C++ command-line bioinformatics tool for constructing compacted de
      Bruijn graphs efficiently from genome references or reads.
  timeline:
    - >
      2021: The original Cuttlefish paper and the Cuttlefish 2 preprint were listed by
      COMBINE-lab.
    - '2026: COMBINE-lab continued to list Cuttlefish as active, with a 2.2.0 release.'
  usage:
    - >
      Users supply reference sequences or reads and run the `cuttlefish` executable to
      construct a compacted de Bruijn graph. The project is aimed at large genomic
      datasets where parallelism and memory efficiency matter.
related-packages: []
category: science
package-manager:
  brew: cuttlefish
package-manager-url: https://formulae.brew.sh/formula/cuttlefish
