id: brew:bindfs
display-name: bindfs
homepage: https://bindfs.org/
repo: https://github.com/mpartel/bindfs
docs:
  - https://bindfs.org/docs/bindfs-help.txt
  - https://bindfs.org/docs/bindfs.1.html
  - https://bindfs.org/
config-file-location:
  unix: /etc/fstab
credentials-file-location: null
history:
  adoption-history:
    - >
      bindfs has a steady Unix package footprint because it solves a practical
      filesystem-admin problem without a large service. The input package facts list
      apk, Homebrew, Debian, Fedora, MacPorts, Nix, Ubuntu, and openSUSE packages, and
      the official downloads page shows a long source-release series from 1.0 through
      1.18.4.
  package-nerd-significance:
    - >
      bindfs is package-nerd useful because it packages a policy layer around ordinary
      directory trees: a tiny mount command can replace ad hoc copies, ACL experiments,
      or custom synchronization scripts when the real need is just a different view of
      the same files.
  project-history:
    - >
      GitHub metadata shows the public repository was created on 2011-07-08. The
      official README describes bindfs as similar to `mount --bind`, but with permission
      rewriting and non-root usability through FUSE.
  related-projects:
    - >
      Related projects and facilities include FUSE/libfuse, fuse-t, MacFUSE, FreeBSD
      fuse4bsd, Linux bind mounts, overlayfs, sshfs, and union filesystems.
  sources:
    - GitHub repository metadata from api.github.com.
    - Official bindfs README/homepage.
    - Official bindfs downloads page.
    - Package adoption from source_facts.package-manager.
  summary:
    - >
      bindfs is a FUSE filesystem that mirrors one directory at another mount point
      while changing ownership, permissions, and creation behavior.
  timeline:
    - '2011-07-08: GitHub repository created.'
    - '2011-2026: Official downloads page records releases from bindfs 1.0 through 1.18.4.'
    - '2026: Repository metadata shows continued maintenance activity.'
  usage:
    - >
      Common uses include making a directory read-only, hiding executable bits, sharing
      a tree with selected users or groups, changing permission bits with chmod-like
      rules, and controlling permissions used for newly created files.
related-packages:
  - id: brew:libfuse
    reason: >
      bindfs is implemented on FUSE, so libfuse supplies the Linux userspace filesystem
      interface it builds and runs against.
    rel: adjacent_workflow
    sources:
      - https://github.com/mpartel/bindfs
      - https://github.com/libfuse/libfuse
category: system
package-manager:
  apk: bindfs
  brew: bindfs
  debian: bindfs
  dnf: bindfs
  macports: bindfs
  nix: bindfs
  ubuntu: bindfs
  zypper: bindfs
package-manager-url: https://formulae.brew.sh/formula/bindfs
license: GPL-2.0-or-later
tags:
  - cli
  - filesystem
  - fuse
  - mount
  - permissions
description: FUSE file system for mounting to another location
executables:
  - bindfs
provenance:
  formula: bindfs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
