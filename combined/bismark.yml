id: brew:bismark
display-name: Bismark
homepage: https://github.com/FelixKrueger/Bismark
repo: https://github.com/FelixKrueger/Bismark
docs:
  - https://felixkrueger.github.io/Bismark
  - https://github.com/FelixKrueger/Bismark
  - https://www.bioinformatics.babraham.ac.uk/projects/bismark
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Bismark became a common package in sequencing pipelines because it combined
      bisulfite read mapping and methylation calling in one CLI workflow and produced
      outputs suitable for downstream genome viewers and reports.
    - >
      The official README documents package-oriented installation paths through
      Bioconda, crates.io, containers, and prebuilt GitHub release binaries, while the
      Homebrew formula in the input records it as a brew package.
  package-nerd-significance:
    - >
      Bismark matters to package maintainers because it wraps a historically
      multi-script bioinformatics workflow with external aligner requirements, and its
      current Rust transition changes packaging expectations from Perl scripts plus
      Samtools to a supported single-suite binary model.
    - >
      It is a useful example of a long-lived scientific CLI where package recipes need
      to track both legacy reproducibility and a new implementation advertised as
      byte-identical on the default path.
  project-history:
    - >
      Bismark was developed by Felix Krueger in the Babraham Bioinformatics group and
      published in Bioinformatics in 2011 as a flexible aligner and methylation caller
      for Bisulfite-Seq applications. The official project page describes it as stable
      GPL software for mapping bisulfite-converted reads and determining cytosine
      methylation states.
    - >
      The project began as a Perl suite around external aligners such as Bowtie2 and
      HISAT2. The current official README states that Bismark is now a supported Rust
      suite, with the original Perl v0.25.x scripts kept as legacy/maintenance-freeze
      code.
  related-projects:
    - >
      Bowtie2, HISAT2, and minimap2 are supported alignment backends in current official
      documentation.
    - >
      SeqMonk is referenced by the official project pages as a genome viewer that can
      import Bismark output.
  sources:
    - https://academic.oup.com/bioinformatics/article/27/11/1571/216956
    - https://felixkrueger.github.io/Bismark/
    - https://github.com/FelixKrueger/Bismark
    - https://www.bioinformatics.babraham.ac.uk/projects/bismark/
    - input.source_facts.package-manager
  summary:
    - >
      Bismark is a command-line bisulfite sequencing mapper and methylation caller for
      high-throughput DNA methylation analysis. It maps bisulfite-treated reads to a
      reference genome and calls cytosine methylation in CpG, CHG, and CHH contexts.
  timeline:
    - '2010: Changelog records Bismark v0.2.x releases.'
    - '2011: Bismark paper published in Bioinformatics.'
    - '2019: Babraham project page records v0.22.x releases.'
    - >
      2026: Official README describes the Rust suite as the supported default and Perl
      v0.25.x as legacy.
  usage:
    - >
      Typical use prepares bisulfite-converted reference indexes, aligns single-end or
      paired-end WGBS/RRBS/PBAT reads, optionally deduplicates alignments, and extracts
      methylation calls and HTML reports.
    - >
      Bismark is used when methylation context matters because its output separates CpG,
      CHG, and CHH methylation calls rather than treating all cytosines identically.
related-packages:
  - id: brew:bowtie2
    reason: >
      Bowtie 2 is Bismark's default short-read alignment backend and can be used for
      both bisulfite-genome index preparation and read alignment.
    rel: adjacent_workflow
    sources:
      - https://felixkrueger.github.io/Bismark/installation/
      - https://bowtie-bio.sourceforge.net/bowtie2/manual.shtml
  - id: brew:minimap2
    reason: >
      Minimap2 is a supported Bismark alignment backend for applicable long-read
      bisulfite sequencing workflows.
    rel: adjacent_workflow
    sources:
      - https://felixkrueger.github.io/Bismark/
      - https://lh3.github.io/minimap2/minimap2.html
category: science
