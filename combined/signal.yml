id: cask:signal
display-name: Signal
homepage: https://signal.org/
repo: https://github.com/signalapp/Signal-Desktop
docs:
  - https://github.com/signalapp/Signal-Desktop#readme
  - https://support.signal.org/
  - https://support.signal.org/hc/en-us/articles/360008216551-Installing-Signal
config-file-location:
  macos: ~/Library/Application Support/Signal/
credentials-file-location:
  macos: ~/Library/Application Support/Signal/
history:
  adoption-history:
    - >
      Signal grew from the TextSecure and RedPhone lineage into a unified mobile and
      desktop service. Its open-source clients, nonprofit stewardship, and emphasis on
      end-to-end encryption made it a prominent choice for privacy-conscious personal
      and organizational communication.
    - >
      Signal Desktop began as an invitation-based Chrome application, entered public
      beta in 2016, and became a standalone Windows, macOS, and Linux application in
      2017.
  package-nerd-significance:
    - >
      Signal Desktop is a notable open-source Electron application whose local account
      state and encrypted message database make profile backup, migration, and package
      upgrades operationally important. The Homebrew cask gives macOS users a repeatable
      installation path for the signed desktop client.
    - >
      The separately installable beta channel is useful to testers because it receives
      changes before production while keeping its data separate from the stable
      application.
  project-history:
    - >
      Open Whisper Systems introduced Signal for encrypted iPhone calling in 2014 and
      subsequently unified TextSecure, RedPhone, and the desktop client under the Signal
      name. Signal Desktop was announced in December 2015 as a linked companion for
      continuing mobile conversations on a computer.
    - >
      In October 2017, Signal replaced the Chrome application with a standalone desktop
      client. The Signal Foundation was established in 2018 as a nonprofit supporting
      open-source privacy technology and secure global communication.
  related-projects:
    - >
      Signal's official Android and iOS clients act as primary devices to which Signal
      Desktop is linked.
    - >
      libsignal supplies cryptographic and protocol components used by Signal clients,
      while the Signal Server provides the service infrastructure.
  sources:
    - https://github.com/signalapp/Signal-Desktop
    - https://signal.org/blog/signal-desktop
    - https://signal.org/blog/signal-foundation/
    - https://signal.org/blog/signal/
    - https://signal.org/blog/standalone-signal-desktop/
  summary:
    - >
      Signal is a free, open-source private messenger providing end-to-end-encrypted
      messages and calls. Signal Desktop links to Signal on Android or iOS and extends
      conversations to macOS, Windows, and Linux.
  timeline:
    - '2014: Signal launched on iPhone as an encrypted calling application.'
    - >
      2015: Signal unified private calling and messaging, and the first Signal Desktop
      beta was announced.
    - '2016: Signal Desktop beta became publicly available.'
    - '2017: The standalone desktop application replaced the Chrome app.'
    - '2018: The nonprofit Signal Foundation was launched.'
  usage:
    - >
      Users link Signal Desktop to Signal on an Android phone or iPhone, then exchange
      encrypted messages, media, and calls from the computer. The desktop application
      stores account state and message history locally in its application-data
      directory.
related-packages:
  - id: cask:telegram
    reason: >
      Choose Telegram for cloud-synchronized chats, channels, bots, and a native
      open-source macOS client; unlike Signal, only Telegram Secret Chats use end-to-end
      encryption.
    rel: alternative
    sources:
      - https://telegram.org/apps
      - https://telegram.org/faq
      - https://support.signal.org/
  - id: cask:whatsapp
    reason: >
      Choose WhatsApp when compatibility with its larger account ecosystem and native
      group calling matters more than Signal's open-source nonprofit model.
    rel: alternative
    sources:
      - https://www.whatsapp.com/download
      - https://faq.whatsapp.com/
      - https://signal.org/
  - id: brew:signal-cli
    reason: >
      Use signal-cli as a linked Signal device when scripts, server notifications,
      JSON-RPC, or D-Bus automation must participate in Signal conversations.
    rel: adjacent_workflow
    sources:
      - https://github.com/AsamK/signal-cli
      - https://github.com/AsamK/signal-cli/wiki
      - https://support.signal.org/hc/en-us/articles/360007320551-Linked-Devices
