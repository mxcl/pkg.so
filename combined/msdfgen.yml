id: brew:msdfgen
display-name: msdfgen
homepage: https://github.com/Chlumsky/msdfgen
repo: https://github.com/Chlumsky/msdfgen
docs:
  - https://github.com/Chlumsky/msdfgen#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README positions msdfgen both as a standalone console program and as a C++
      library. It also points users toward msdf-atlas-gen when generating complete font
      atlases, which reflects its adoption in graphics and text-rendering pipelines
      rather than as an end-user media tool.
  package-nerd-significance:
    - >
      msdfgen matters in packaging because it bridges graphics research and practical
      asset generation: a small CLI plus C++ library, optional image/font/SVG
      dependencies, and current releases that track real-world build-system needs.
  project-history:
    - >
      The official GitHub repository was created in 2016 and the changelog lists version
      1.0 as the initial public release on 2016-04-28. The project later added CMake
      support, expanded SVG and font handling, introduced MTSDF mode, and kept refining
      error correction, geometry preprocessing, and build options.
  related-projects:
    - >
      msdf-atlas-gen is the official companion project recommended by the README for
      generating full font atlases.
  sources:
    - https://github.com/Chlumsky/msdfgen
    - https://github.com/Chlumsky/msdfgen#readme
    - https://raw.githubusercontent.com/Chlumsky/msdfgen/master/CHANGELOG.md
    - source_facts.description
    - source_facts.repo
  summary:
    - >
      msdfgen is a utility and library for generating signed distance fields from vector
      shapes and font glyphs, with its main focus on multi-channel signed distance
      fields for real-time graphics.
  timeline:
    - '2016: Repository created and version 1.0 published.'
    - '2017: CMake build script added.'
    - '2020: MTSDF mode added.'
    - '2023: Standalone executable can be built in a limited dependency-free form.'
    - '2025: Version 1.13 released.'
  usage:
    - >
      Typical package-manager usage is running msdfgen with a mode, input, and options
      to generate SDF, PSDF, MSDF, or MTSDF textures from fonts, SVG files, shape
      descriptions, or standard input. The library API exposes the same core generation
      routines for embedding in renderers and tools.
related-packages:
  - id: brew:msdf-atlas-gen
    reason: >
      Use msdf-atlas-gen after or instead of low-level msdfgen when you need an entire
      font's glyph fields packed into a texture atlas with layout metadata.
    rel: adjacent_workflow
    sources:
      - https://github.com/Chlumsky/msdfgen#readme
      - https://github.com/Chlumsky/msdf-atlas-gen#readme
category: developer-tools
package-manager:
  brew: msdfgen
  macports: msdfgen
package-manager-url: https://formulae.brew.sh/formula/msdfgen
license: MIT
tags:
  - cli
  - font-rendering
  - graphics
  - msdf
  - signed-distance-field
  - texture-generation
description: Multi-channel signed distance field generator
executables:
  - msdfgen
provenance:
  formula: msdfgen
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
