id: brew:config-file-validator
display-name: Config File Validator
homepage: https://boeing.github.io/config-file-validator/
repo: https://github.com/Boeing/config-file-validator
docs:
  - https://boeing.github.io/config-file-validator
config-file-location:
  unix: ./.cfv.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions list Homebrew, Winget, MacPorts, Scoop, Go
      install, and binary releases for macOS, Linux, and Windows. That breadth makes the
      tool unusually package-manager-visible for a validator whose main use is inside
      repositories and CI jobs.
  package-nerd-significance:
    - >
      For package and tooling curators, Config File Validator is notable because it
      treats configuration files themselves as the package surface: it knows common
      filenames through GitHub Linguist data, validates extensionless files, and emits
      outputs that package CI systems can consume directly.
  project-history:
    - >
      The project is maintained as an Apache-2.0 Go command and library. Its README
      describes support for 18 formats, schema validation through JSON Schema, XSD, and
      SchemaStore, and integration surfaces such as GitHub Actions, pre-commit, SARIF,
      JUnit, JSON output, and a Go library API.
    - >
      The 2.x changelog records a shift from simple syntax/format checking into a
      broader configuration-validation platform: schema maps, SchemaStore lookup, SARIF
      output, JSONC, stdin support, exit-code granularity, and project-level .cfv.toml
      configuration.
  related-projects:
    - >
      Official documentation and README connect the tool to JSON Schema, XSD,
      SchemaStore, GitHub Actions, pre-commit, SARIF, GitHub Linguist, and Go.
  sources:
    - https://github.com/Boeing/config-file-validator#readme
    - https://boeing.github.io/config-file-validator
    - https://boeing.github.io/config-file-validator/docs/guides/configuration-file
    - https://boeing.github.io/config-file-validator/docs/reference/known-files
    - https://github.com/Boeing/config-file-validator/blob/main/CHANGELOG.md
    - https://github.com/Boeing/config-file-validator/releases
  summary:
    - >
      Config File Validator is a Boeing-published CLI for validating configuration files
      across many formats. It recursively searches directories, detects formats by
      extension or known filename, and reports syntax, schema, and CI-friendly output.
  timeline:
    - '2025: v1.9.0 added a changelog, JSON formatting checks, and TOON validation.'
    - >
      2026: v2.0.0 added schema validation for JSON, YAML, TOML, and TOON, XML schema
      support, type maps, schema maps, SchemaStore, SARIF, and no-schema mode.
    - >
      2026: v2.2.0 added .cfv.toml discovery, JSONC support, pre-commit support,
      embedded SchemaStore catalog support, and zero-setup remote schema fetching.
    - >
      2026: later 2.x work added a documentation website, GitHub reporter output,
      ignore-file support, and automatic known-file detection from GitHub Linguist.
  usage:
    - >
      Common usage is to run validator against a repository or directory tree,
      optionally constrained by file types, schema maps, ignore files, and reporter
      output. The .cfv.toml file lets projects commit validation defaults instead of
      repeating CLI flags in CI.
related-packages: []
category: developer-tools
package-manager:
  brew: config-file-validator
  macports: config-file-validator
  scoop: main/config-file-validator
  winget: Boeing.config-file-validator
package-manager-url: https://formulae.brew.sh/formula/config-file-validator
license: Apache-2.0
tags:
  - cli
  - configuration
  - json
  - schema-validation
  - toml
  - validation
  - yaml
description: CLI tool to validate different configuration file types
executables:
  - validator
provenance:
  formula: config-file-validator
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
