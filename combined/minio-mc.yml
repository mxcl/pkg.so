id: brew:minio-mc
display-name: MinIO Client
homepage: https://github.com/minio/mc
repo: https://github.com/minio/mc
docs:
  - https://docs.min.io/community/minio-object-store/reference/minio-mc.html
  - https://github.com/minio/mc#readme
config-file-location:
  unix: ~/.mc/config.json
credentials-file-location:
  unix: ~/.mc/config.json
history:
  project-history:
    - >
      The tool's role expanded with MinIO itself: it works with MinIO deployments,
      Amazon S3-compatible services, and local filesystems, and MinIO documentation uses
      it for administrative and data operations. The mc alias model stores named
      endpoints and credentials in ~/.mc/config.json, which lets commands address
      different object stores with short names. Its command set covers routine object
      work, bucket creation, recursive copies, mirroring, lifecycle and encryption
      configuration, retention, legal hold, replication, and server administration.
  sources:
    - https://cloud.ibm.com/docs/cloud-object-storage?topic=cloud-object-storage-minio
    - >
      https://docs.ezmeral.hpe.com/datafabric-customer-managed/80/ReferenceGuide/mc-commands-overview.html
    - https://docs.min.io/aistor/reference/cli/
    - https://github.com/minio/mc
    - >
      https://medium.com/cloud-storage/go-based-alternative-to-amazon-s3-command-line-interface-43ea9fd241fb
  summary:
    - >
      MinIO Client, packaged by Homebrew as minio-mc and installed as mc, is the
      command-line companion to the MinIO object-storage ecosystem. The client was
      introduced as a Go-based command set for Amazon S3-compatible object storage and
      POSIX filesystems, borrowing familiar Unix verbs such as ls, cp, cat, mirror,
      diff, find, and du so object storage could be operated from shell scripts and
      terminals.
  usage:
    - >
      Adoption extends beyond MinIO-only deployments because S3-compatible object
      storage is common infrastructure. IBM Cloud documentation recommends the open
      source MinIO Client for Unix-like commands against IBM Cloud Object Storage, and
      HPE Data Fabric documents mc commands for its object-store workflows. In
      package-manager listings the name minio-mc avoids collision with Midnight
      Commander, whose executable is also mc, while preserving the upstream executable
      name used by MinIO documentation.
related-packages:
  - id: brew:minio
    reason: >
      Pair the client with MinIO Server to run and administer a local or self-hosted
      S3-compatible object store using the official alias-based workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/minio/minio#test-using-minio-client-mc
      - https://github.com/minio/mc#readme
category: cloud-infrastructure
package-manager:
  apk: mc
  brew: minio-mc
  chocolatey: mc
  debian: mc
  dnf: mc
  macports: minio-mc
  nix: mc
  pacman: mc
  scoop: extras/mc
  ubuntu: mc
  winget: GNU.MidnightCommander
  zypper: minio-client
package-manager-url: https://formulae.brew.sh/formula/minio-mc
license: AGPL-3.0-or-later
tags:
  - cli
  - object-storage
  - s3
  - s3-compatible
  - storage-client
description: Replacement for ls, cp and other commands for object storage
executables:
  - mc
provenance:
  formula: minio-mc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
