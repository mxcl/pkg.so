id: brew:buildapp
display-name: Buildapp
homepage: https://www.xach.com/lisp/buildapp/
repo: https://github.com/xach/buildapp
docs:
  - https://github.com/xach/buildapp#readme
  - https://www.xach.com/lisp/buildapp
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Buildapp's adoption is niche but durable in Common Lisp packaging. It appears in
      Homebrew, Debian, and Ubuntu according to the input, reflecting its use as a small
      system tool for turning SBCL or CCL applications into command-line executables.
    - >
      Its homepage examples show the kind of usage that made it handy before
      containerized deployment became common: single-file Lisp utilities, web-related
      command-line tools, and larger saved-image applications.
  package-nerd-significance:
    - >
      Buildapp is interesting because it packages the Lisp saved-image model as a
      Unix-friendly build command. For package maintainers, it turns a Lisp system into
      an executable artifact that can be installed like other CLI tools.
    - >
      It also preserves a specific era of Common Lisp deployment practice, where ASDF
      systems, implementation-specific image saving, and small wrapper tools made Lisp
      programs feel more like conventional command-line software.
  project-history:
    - >
      Buildapp comes from the Common Lisp image-building tradition: instead of compiling
      a small native binary from scratch, it configures a Lisp image, loads code and
      ASDF systems, sets an entry point, and saves an executable. The official page
      compares it to `cl-launch` and hu.dwim.build.
    - >
      The public release tags run through the 1.x series, and the official page lists
      1.5.6 as the latest version released on November 7, 2015.
  related-projects:
    - SBCL and Clozure CL are the Lisp implementations named by the official page.
    - `cl-launch` and hu.dwim.build are similar tools named by the official page.
    - >
      ASDF is part of the documented workflow for loading Lisp systems before saving an
      executable.
  sources:
    - https://github.com/xach/buildapp
    - https://www.xach.com/lisp/buildapp
    - source_facts.package-manager
  summary:
    - >
      Buildapp is a Common Lisp command-line tool by Zach Beane for creating executable
      images with SBCL or Clozure CL.
  timeline:
    - '2000s: Buildapp emerged in the SBCL/CCL Common Lisp deployment ecosystem.'
    - '2010s: Public release tags progressed through the 1.4 and 1.5 series.'
    - '2015: Version 1.5.6 was released on November 7 according to the official homepage.'
  usage:
    - >
      A typical invocation passes `--output`, one or more `--eval`, `--load-system`, or
      ASDF path options, and an `--entry` function. Buildapp then saves a runnable Lisp
      image that starts at that entry point.
    - >
      It has no documented per-user credentials or configuration file location in the
      official docs.
related-packages:
  - id: brew:sbcl
    reason: >
      SBCL is Buildapp's primary documented host and image target, so the two work
      together to load a Common Lisp application and save it as an executable.
    rel: adjacent_workflow
    sources:
      - https://www.xach.com/lisp/buildapp/
      - https://www.sbcl.org/
category: developer-tools
package-manager:
