id: brew:dotslash
display-name: DotSlash
homepage: https://dotslash-cli.com
repo: https://github.com/facebook/dotslash
docs:
  - https://dotslash-cli.com/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DotSlash grew from the internal need to vendor large toolchain binaries without
      bloating repositories or relying on each developer's host environment. Its
      package-manager adoption includes Homebrew, Nix, pacman, and Scoop entries, which
      made the `dotslash` interpreter easier to install across common workstation
      setups.
  package-nerd-significance:
    - >
      DotSlash is package-nerd bait because it sits between vendoring, lockfiles, binary
      caches, and hermetic build tooling. It treats executable resolution as data
      checked into source control, while leaving the large artifacts outside the
      repository and verifying them with content hashes.
  project-history:
    - >
      Meta announced DotSlash publicly on February 6, 2024 as an open-source
      developer-infrastructure tool. The first GitHub release, v0.1.0, was published the
      same day, and subsequent 2024 and 2025 releases iterated on the
      executable-deployment model.
  related-projects:
    - Buck2
    - Bazel
    - Nix
    - Scoop
    - Homebrew
  sources:
    - >
      https://engineering.fb.com/2024/02/06/developer-tools/dotslash-simplified-executable-deployment/
    - https://github.com/facebook/dotslash
    - https://dotslash-cli.com/docs
    - https://api.github.com/repos/facebook/dotslash/releases?per_page=100
  summary:
    - >
      DotSlash is Meta's command-line tool for representing platform-specific
      heavyweight executables as small text files that fetch, verify, and run the
      correct binary on demand. It is aimed at executable deployment inside source
      repositories and reproducible build environments.
  timeline:
    - '2024: Meta announced DotSlash and published v0.1.0 on February 6.'
    - '2024: The project shipped several early releases through v0.4.x.'
    - '2025: v0.5.x releases continued the public release train.'
  usage:
    - >
      Developers create small executable DotSlash files that describe per-platform
      providers, sizes, hashes, archive formats, and paths. On first execution, DotSlash
      downloads and verifies the matching artifact; later executions reuse the cached
      binary.
related-packages:
  - id: brew:gh
    reason: >
      Use GitHub CLI with DotSlash when a DotSlash file must fetch release artifacts
      from private repositories or GitHub Enterprise through the documented `gh release
      download` provider workflow.
    rel: adjacent_workflow
    sources:
      - https://dotslash-cli.com/docs/dotslash-file/
      - https://cli.github.com/manual/gh_release_download
category: developer-tools
package-manager:
  brew: dotslash
  nix: dotslash
  pacman: dotslash
  scoop: main/dotslash
package-manager-url: https://formulae.brew.sh/formula/dotslash
license: Apache-2.0
tags:
  - cli
  - dependencies
  - executable-deployment
  - fetcher
  - verification
description: Simplified executable deployment
executables:
  - dotslash
provenance:
  formula: dotslash
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
