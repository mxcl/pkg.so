id: brew:libcap
display-name: libcap
homepage: https://sites.google.com/site/fullycapable/
repo: https://git.kernel.org/pub/scm/libs/libcap/libcap.git
docs:
  - https://sites.google.com/site/fullycapable
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libcap became baseline Linux security infrastructure because file capabilities and
      process capabilities need user-space tooling. Distribution packages expose its
      command-line tools for administrators and its headers and library for software
      that must drop root while keeping only specific privileges.
  package-nerd-significance:
    - >
      libcap is one of the packages that turns a kernel security feature into everyday
      packaging policy. Without it, downstream maintainers have a harder time replacing
      setuid-root patterns with smaller capability grants.
  project-history:
    - >
      The upstream README describes libcap as a library for getting and setting POSIX.1e
      draft 15 capabilities, with native C/C++ and Go support. The Fully Capable site
      frames Linux capabilities as an alternative to the superuser model of privilege
      under Linux and notes that the Linux implementation is based on the defunct
      POSIX.1e draft.
    - >
      The project grew beyond a C library into a family of privilege-management tools
      and helper code. The README names capsh, getpcaps, setcap, and getcap as example
      programs, while the Fully Capable site documents libpsx for POSIX semantics in
      threaded applications and Go packages for capability manipulation.
  related-projects:
    - >
      Related projects include the Linux kernel capability implementation, libcap-ng,
      libpsx, pam_cap, Go cap and psx packages, and distribution packaging that replaces
      setuid-root usage with file capabilities.
  sources:
    - https://formulae.brew.sh/formula/libcap
    - https://git.kernel.org/pub/scm/libs/libcap/libcap.git
    - https://git.kernel.org/pub/scm/libs/libcap/libcap.git/plain/CHANGELOG
    - https://git.kernel.org/pub/scm/libs/libcap/libcap.git/plain/README
    - https://git.kernel.org/pub/scm/libs/libcap/libcap.git/refs/tags
    - https://sites.google.com/site/fullycapable
  summary:
    - >
      libcap is Andrew G. Morgan's user-space library and utility suite for Linux
      capabilities, including setcap, getcap, getpcaps, capsh, pam_cap, and related
      support libraries.
  timeline:
    - >
      POSIX.1e draft 15: Upstream README identifies this draft as the capabilities model
      libcap targets.
    - '2024-05-18: kernel.org refs list libcap 2.70 tags.'
    - '2024-10-25: kernel.org refs list libcap 2.71 tags.'
    - '2025-03-04: kernel.org refs list libcap 2.75 tags.'
    - '2026-04-05: kernel.org refs list libcap 2.78 tags.'
  usage:
    - >
      Administrators use setcap and getcap to assign and inspect file capabilities,
      getpcaps to inspect processes, and capsh to experiment with capability sets and
      shells. Developers link libcap when applications need direct control over Linux
      capability state.
related-packages:
  - id: brew:libcap-ng
    reason: >
      Choose libcap-ng when a higher-level API for constructing, applying, and auditing
      capability sets is preferable to libcap's traditional low-level interface.
    rel: alternative
    sources:
      - https://people.redhat.com/sgrubb/libcap-ng/
      - https://git.kernel.org/pub/scm/libs/libcap/libcap.git/plain/README
category: security
package-manager:
  apk: libcap
  brew: libcap
  dnf: captree
  nix: libcap
  pacman: libcap
  zypper: libcap-devel
package-manager-url: https://formulae.brew.sh/formula/libcap
license: BSD-3-Clause AND GPL-2.0-or-later
tags:
  - cli
  - library
  - linux
  - permissions
  - posix-capabilities
  - security
description: User-space interfaces to POSIX 1003.1e capabilities
executables:
  - capsh
  - getcap
  - getpcaps
  - setcap
provenance:
  formula: libcap
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
