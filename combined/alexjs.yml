id: brew:alexjs
display-name: alex
homepage: https://alexjs.com
repo: https://github.com/get-alex/alex
docs:
  - https://alexjs.com
  - https://github.com/get-alex/alex#readme
config-file-location:
  unix:
    - .alexrc
    - .alexrc.yml
    - .alexrc.yaml
    - .alexrc.js
    - package.json#alex
    - .alexignore
credentials-file-location: null
history:
  adoption-history:
    - >
      alex's official README lists integrations for Sublime, Gulp, Slack, Ember, Probot,
      GitHub Actions, Vim, browser extensions, Contentful, Figma, and VS Code. The
      official site also lists earlier editor and workflow integrations.
    - >
      The supplied package facts show unusually broad distribution for a Node writing
      tool: Homebrew as `alexjs`, and distro packages as `alex` in apk, Debian, Fedora,
      MacPorts, Nix, Arch, Ubuntu, and openSUSE. That breadth reflects a CLI useful in
      documentation repos, CI checks, and editorial workflows.
  package-nerd-significance:
    - >
      alex is package-nerd significant because it helped make inclusive-language
      checking feel like linting: install a CLI, add a dotfile, wire it into CI, and
      treat prose issues like structured diagnostics.
    - >
      It also shows why package naming matters. The upstream project and executable are
      `alex`, while Homebrew packages it as `alexjs`, likely to avoid name ambiguity in
      a global formula namespace.
  project-history:
    - >
      The official website and README describe alex as a tool that flags
      gender-favoring, polarizing, race-related, ableist, profane, or otherwise unequal
      phrasing and suggests alternatives. It reads plain text, Markdown, MDX, and HTML,
      and exposes both a CLI and JavaScript APIs.
    - >
      The README records preliminary work in 2015, Titus Wormer as author, and an origin
      story crediting a raised problem and Sindre Sorhus's inspiration. The alexjs.com
      page carries a 2015 publication date and presents an online demo, CLI examples,
      and integrations.
    - >
      Technically, alex composes existing natural-language processing packages: the
      README points users to `retext-equality` and `retext-profanities` for the rules
      and uses VFile messages as the API result shape. That places it squarely inside
      the unified/retext package family.
  related-projects:
    - >
      The official README names retext-equality and retext-profanities as rule sources
      and VFile as the diagnostics container.
    - >
      alex sits near prose linters, markdown tooling, and editor/CI lint integrations
      rather than conventional grammar checkers.
  sources:
    - https://alexjs.com
    - https://github.com/get-alex/alex#readme
    - source_facts.package-manager
  summary:
    - >
      alex is a command-line and JavaScript API tool for catching insensitive or
      inconsiderate writing. It belongs to the text-linting ecosystem around unified,
      retext, and markdown tooling, but its subject matter is inclusive language rather
      than syntax style.
  timeline:
    - >
      2015: Preliminary work and publication date recorded by official README and
      alexjs.com metadata.
    - '2015: Launch attracted social and press attention according to the README origin story.'
    - >
      2015 onward: Editor, build-tool, chat, GitHub, and browser integrations
      accumulated around the CLI.
    - >
      Current README: alex supports plain text, Markdown, MDX, and HTML inputs with CLI
      and JavaScript APIs.
  usage:
    - >
      Typical CLI usage is `alex example.md` or `alex .`, with warnings reported by
      source position, rule id, and suggested wording. The README also documents
      Markdown comments for inline disables and enables.
    - >
      Configuration can live in `.alexrc`, `.alexrc.yml`, `.alexrc.yaml`, `.alexrc.js`,
      or an `alex` field in `package.json`; directory scanning can be controlled with
      `.alexignore`. API users call functions such as `markdown`, `mdx`, `html`, or
      `text` and inspect returned VFile messages.
related-packages:
  - id: brew:vale
    reason: >
      Choose Vale when you need configurable, packageable editorial style guides across
      documentation formats; choose alex when the primary goal is focused
      inclusive-language checking.
    rel: alternative
    sources:
      - https://github.com/get-alex/alex#readme
      - https://docs.vale.sh/
      - https://docs.vale.sh/keys/packages
category: productivity
package-manager:
  apk: alex
  brew: alexjs
  debian: alex
  dnf: alex
  macports: alex
  nix: alex
  pacman: alex
  ubuntu: alex
  zypper: alex
package-manager-url: https://formulae.brew.sh/formula/alexjs
license: MIT
tags:
  - cli
  - inclusive-language
  - lint
  - writing
description: Catch insensitive, inconsiderate writing
executables:
  - alex
provenance:
  formula: alexjs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
