id: brew:lynx
display-name: Lynx
homepage: https://invisible-island.net/lynx/
repo: null
docs:
  - https://invisible-island.net/lynx
  - https://lynx.invisible-island.net/lynx_help
  - https://lynx.invisible-island.net/lynx_help/Lynx_users_guide.html
config-file-location:
  unix:
    - lynx.cfg
    - ~/.lynxrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Lynx became a standard Unix package because it solves a durable problem: browsing
      and testing the web from a terminal. The batch metadata lists packages across
      Alpine, Homebrew, Debian, Fedora/DNF, MacPorts, Nix, Arch, Scoop, Ubuntu, and
      openSUSE/Zypper.
    - >
      Its hosting history reflects long-lived open source infrastructure. The project
      started at the University of Kansas, moved through Salt Lake Community College,
      was hosted by ISC beginning in 1999, and moved to Thomas Dickey's Invisible Island
      site in late 2015 when ISC reduced that style of project hosting.
  package-nerd-significance:
    - >
      Lynx is package-manager lore: one of the tools people install on servers so they
      can inspect HTTP from a shell before `curl` and modern headless browsers became
      defaults. It is also a portability test case, because packagers deal with
      curses/slang builds, TLS libraries, compression libraries, character sets, help
      files, and decades of user expectations.
    - >
      For distributions, Lynx is a reminder that a small terminal browser can be both
      ancient and active. The current changelog still records releases in 2024 and 2026,
      with modern TLS, Unicode, compression, compiler, and platform fixes alongside
      traditional terminal-browser behavior.
  project-history:
    - >
      The official About Lynx page says Lynx was a product of the Distributed Computing
      Group within Academic Computing Services at the University of Kansas. It was
      originally developed by Lou Montulli, Michael Grobe, and Charles Rezac, with
      Garrett Blythe creating DosLynx and later joining the effort.
    - >
      Lynx's early history sits close to the early web itself: it used CERN World Wide
      Web client-library code, grew from pre-WWW hypertext influences, and supported
      terminal users on Unix, VMS, and other platforms. After departures from Kansas in
      1994, development and support continued through maintainers and the lynx-dev
      community.
    - >
      Thomas E. Dickey's development page says he became involved through auto-configure
      work, ncurses/color support, and robustness and security changes. Since the 2.8
      release in early 1998, he has acted as patch coordinator for ongoing Lynx
      development.
    - >
      The development page also records Lynx's unusual source-control history: very
      early 1990s development used no source control, most later development used PRCS
      archives on isc.org, Dickey also maintained local RCS archives, and after the
      project left ISC in 2015 he produced patches and releases directly from RCS
      archives.
  related-projects:
    - DosLynx was a related DOS port effort created by Garrett Blythe.
    - CERN WWW client-library code is part of Lynx's historical foundation.
    - ncurses and slang are important terminal libraries in Lynx builds.
  sources:
    - https://invisible-island.net/datafiles/release/lynx-cur.tar.gz
    - https://invisible-island.net/lynx/lynx-develop.html
    - https://invisible-island.net/lynx/lynx.html
    - https://lynx.invisible-island.net/current/
    - https://lynx.invisible-island.net/current/CHANGES.html
    - https://lynx.invisible-island.net/lynx_help/about_lynx.html
    - source_facts.package-manager
  summary:
    - >
      Lynx is a long-running text-mode World Wide Web browser for character-cell
      terminals and emulators. It remains useful for terminal browsing, accessibility
      workflows, remote systems, scripted inspection, and package-minimal environments.
  timeline:
    - >
      1990s: Lynx originates at the University of Kansas and grows with early World Wide
      Web tooling.
    - '1994: Key early developers leave Kansas for Netscape; community maintenance continues.'
    - '1997: Klaus Weide sets up PRCS on a previous host, according to the development page.'
    - '1998: Lynx 2.8 is released; Thomas Dickey becomes patch coordinator afterward.'
    - '1999: Lynx hosting and PRCS archives move to ISC.'
    - '2015: Lynx moves from ISC hosting to lynx.invisible-island.net.'
    - '2024: Lynx 2.9.0, 2.9.1, and 2.9.2 are released.'
    - '2026: Lynx 2.9.3 and 2.9.3a appear in the official changelog.'
  usage:
    - >
      Lynx is used interactively from terminals to view HTML and follow links without a
      graphical browser. It also remains valuable for checking whether pages degrade to
      text, opening web resources over SSH, using simple forms, downloading content, and
      testing documentation in low-resource or accessibility-minded environments.
    - >
      The official source configuration documents `lynx.cfg` as the main configuration
      file, with Unix default placement at `/usr/local/lib/lynx.cfg`; it also documents
      `~/.lynxrc` as the personal options file and notes that `-cfg` or the `LYNX_CFG`
      environment variable can override the configuration path.
related-packages:
  - id: brew:w3m
    reason: >
      Choose w3m when terminal browsing must double as a pager or an HTML-to-plain-text
      formatter; its official site explicitly describes Lynx as a neighboring browser.
    rel: alternative
    sources:
      - https://w3m.sourceforge.net/eng/
      - https://lynx.invisible-island.net/lynx_help/about_lynx.html
  - id: brew:links
    reason: >
      Choose Links when you want both terminal browsing and an optional graphics mode
      with tables, frames, images, menus, and mouse support.
    rel: alternative
    sources:
      - https://links.twibright.com/features.php
      - https://lynx.invisible-island.net/lynx_help/about_lynx.html
