  brew: hexgui
  nix: hexgui
package-manager-url: https://formulae.brew.sh/formula/hexgui
license: GPL-3.0-or-later
tags:
  - board-game
  - cli
  - gui
  - hex-game
  - hex-text-protocol
description: GUI for playing Hex over Hex Text Protocol
executables:
  - hexgui
provenance:
  formula: hexgui
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
