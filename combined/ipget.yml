id: brew:ipget
display-name: ipget
homepage: https://github.com/ipfs/ipget/
repo: https://github.com/ipfs/ipget
docs:
  - https://github.com/ipfs/ipget#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ipget's adoption niche is narrower than the core IPFS daemon: it serves users who
      want a simple fetch command for IPFS content rather than a full node-management
      workflow.
    - >
      The project ships binaries through IPFS distribution channels and appears in
      Homebrew and Nix, matching the roadmap's emphasis on package-manager availability.
  package-nerd-significance:
    - >
      ipget is package-nerdy because it maps the familiar Unix downloader shape onto a
      content-addressed network. It is smaller in scope than Kubo/go-ipfs, but that is
      exactly why it fits package-manager culture: install one binary, fetch one thing.
    - >
      It also documents a common IPFS packaging tension: users want IPFS retrieval as a
      normal CLI utility, while the underlying protocol normally implies node behavior,
      peers, and network bootstrapping.
  project-history:
    - >
      The GitHub repository was created in 2015 under the IPFS organization. Its README
      frames the tool as a standalone downloader with its own IPFS node, so users do not
      need a separate IPFS daemon just to fetch content.
    - >
      A 2016 1.0.0 roadmap shows the early project goals clearly: reliable retrieval,
      better first-time user experience, binary distribution, and availability through
      major package managers.
  related-projects:
    - IPFS provides the protocol and network that ipget retrieves from.
    - GNU wget is the user-interface analogy cited by the ipget README.
    - >
      Kubo/go-ipfs is the fuller IPFS node implementation that ipget avoids requiring
      for simple downloads.
  sources:
    - https://github.com/ipfs/ipget
    - https://github.com/ipfs/ipget/issues/18
    - https://github.com/ipfs/ipget/releases
  summary:
    - >
      ipget is an IPFS command-line downloader: the project describes it as `wget for
      IPFS`, focused on retrieving files and directory structures from the IPFS network
      and saving them locally.
  timeline:
    - '2015: GitHub repository created under the IPFS organization.'
    - >
      2016: 1.0.0 roadmap calls out reliable builds and retrieval, first-time user
      experience, binary releases, and package-manager distribution.
    - '2023: v0.10.0 release published on GitHub.'
    - '2026: v0.13.1 release published on GitHub.'
  usage:
    - >
      Users pass an IPFS path, CID, or IPNS path and optionally choose an output path.
      The command can use local, spawned, temporary, or fallback node strategies and can
      display progress.
    - >
      The package is useful in scripts that need to fetch content-addressed data without
      teaching the script how to manage a long-running IPFS daemon.
related-packages:
  - id: brew:kubo
    reason: >
      Kubo is the maintained alternative explicitly recommended by ipget's maintainers;
      `ipfs get` performs the same downloads while reusing a persistent IPFS node.
    rel: alternative
    sources:
      - https://github.com/ipfs/ipget
      - https://docs.ipfs.tech/reference/kubo/cli/#ipfs-get
category: networking
package-manager:
  brew: ipget
  nix: ipget
package-manager-url: https://formulae.brew.sh/formula/ipget
license: MIT
tags:
  - cli
  - distributed-web
  - downloader
  - file-transfer
  - ipfs
description: Retrieve files over IPFS and save them locally
executables:
  - ipget
provenance:
  formula: ipget
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
