id: brew:gdu
display-name: gdu
homepage: https://github.com/dundee/gdu
repo: https://github.com/dundee/gdu
docs:
  - https://github.com/dundee/gdu#readme
config-file-location:
  unix:
    - ~/.config/gdu/gdu.yaml
    - ~/.gdu.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation page lists packages or installation methods across Arch
      Linux, Debian, Ubuntu, NixOS, Homebrew, Mise, Snap, Binenv, Go, Winget, Scoop,
      X-cmd, and COPR builds. In Homebrew, the package is installed as gdu-go to avoid a
      conflict with GNU coreutils.
  package-nerd-significance:
    - >
      gdu belongs to the modern wave of fast, packaged replacements for classic Unix
      inspection tools: a Go binary with cross-platform releases, package-manager
      breadth, and terminal UI ergonomics. Its Homebrew rename to gdu-go is a small but
      classic package-manager detail caused by command-name conflicts.
  project-history:
    - >
      The official repository was created in 2018 and presents gdu as a Go disk-usage
      analyzer with a console interface. Its README emphasizes interactive,
      non-interactive, and export modes, and explains that Gdu is primarily intended for
      SSD disks while still supporting HDDs with less performance gain.
    - >
      Over time gdu added YAML configuration, JSON export/import, database-backed saved
      analyses, archive browsing, profiling, file viewing and deletion controls, and
      terminal styling options, while remaining a single command-line utility.
  related-projects:
    - >
      gdu is related to classic du-style disk accounting tools and terminal disk
      analyzers. Its package-manager story is also related to GNU coreutils because
      Homebrew avoids installing it as gdu when that name would conflict.
  sources:
    - https://github.com/dundee/gdu
    - https://github.com/dundee/gdu#readme
    - https://github.com/dundee/gdu/blob/master/INSTALL.md
    - https://github.com/dundee/gdu/releases
  summary:
    - >
      gdu is a fast terminal disk-usage analyzer written in Go, intended especially for
      SSDs where parallel directory scanning can be used effectively.
  timeline:
    - '2018: Official GitHub repository created.'
    - '2024: v5.x line continued with regular releases.'
    - '2026: v5.36.x releases published.'
  usage:
    - >
      Typical usage is running gdu against a directory or filesystem to browse large
      files interactively, or using non-interactive flags for summaries, top-N output,
      JSON export, ignored paths, age filters, and apparent-size or disk-usage views.
      Configuration is read from ~/.config/gdu/gdu.yaml or ~/.gdu.yaml.
related-packages:
  - id: brew:ncdu
    reason: >
      Choose ncdu for the long-established ncurses-style disk analyzer and its
      documented scan export/import workflow; gdu instead emphasizes parallel SSD
      scanning and a Go-based interface.
    rel: alternative
    sources:
      - https://github.com/dundee/gdu#alternatives
      - https://dev.yorhel.nl/ncdu
  - id: brew:dua-cli
    reason: >
      Choose dua-cli when you prefer a Rust implementation with separate aggregate and
      interactive modes; gdu's own documentation identifies dua as an interface-similar
      alternative.
    rel: alternative
    sources:
      - https://github.com/dundee/gdu#alternatives
      - https://github.com/Byron/dua-cli
category: system
package-manager:
  apk: gdu
  brew: gdu
  chocolatey: gdu
  debian: gdu
  dnf: gdu
  macports: gdu
  nix: gdu
  pacman: gdu
  scoop: main/gdu
  ubuntu: gdu
  winget: dundee.gdu
  zypper: gdu
package-manager-url: https://formulae.brew.sh/formula/gdu
license: MIT
tags:
  - cli
  - disk-usage
  - go
  - storage
  - terminal-ui
description: Disk usage analyzer with console interface written in Go
executables:
  - gdu-go
provenance:
  formula: gdu
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
