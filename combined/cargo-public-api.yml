id: brew:cargo-public-api
display-name: cargo-public-api
homepage: https://github.com/cargo-public-api/cargo-public-api
repo: https://github.com/cargo-public-api/cargo-public-api
docs:
  - https://github.com/cargo-public-api/cargo-public-api#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool is packaged on crates.io and listed in Homebrew, Nix, and Arch package
      facts for this batch. crates.io classifies it as both a command-line utility and a
      Cargo plugin, reflecting its use from local terminals and CI.
  package-nerd-significance:
    - >
      Rust package maintainers use it to make semver review concrete: instead of
      manually scanning exported items, they can diff rustdoc-derived public API output
      and gate changes in CI.
  project-history:
    - >
      The GitHub repository was created in January 2022, and the crate appeared on
      crates.io in April 2022. The README explains that it builds rustdoc JSON and uses
      it to list public items or compare APIs across releases and commits.
  related-projects:
    - The project relies on rustdoc JSON from the Rust toolchain.
    - >
      The README recommends public-api, rustdoc-json, and rustup-toolchain crates for CI
      tests.
  sources:
    - https://api.github.com/repos/cargo-public-api/cargo-public-api
    - https://github.com/cargo-public-api/cargo-public-api
    - https://github.com/cargo-public-api/cargo-public-api#readme
    - https://crates.io/api/v1/crates/cargo-public-api
    - https://formulae.brew.sh/api/formula/cargo-public-api.json
  summary:
    - >
      cargo-public-api is a Cargo subcommand and companion tooling for listing and
      diffing the public API of Rust library crates.
  timeline:
    - '2022: GitHub repository created and first crates.io release published.'
    - '2025: README compatibility matrix tied releases to specific rustdoc JSON nightly ranges.'
    - '2026: crates.io reported v0.52.0 as the latest release.'
  usage:
    - >
      The README shows cargo public-api for listing a crate API, cargo public-api diff
      for comparing against a published version, latest release, or commit range, and a
      CI pattern that snapshots API output to catch unintended public API changes.
related-packages: []
category: developer-tools
package-manager:
  brew: cargo-public-api
  nix: cargo-public-api
  pacman: cargo-public-api
package-manager-url: https://formulae.brew.sh/formula/cargo-public-api
license: MIT
tags:
  - api
  - breaking-changes
  - cargo
  - cli
  - code-analysis
  - public-api
  - rust
  - semver
description: List and diff the public API of Rust library crates
executables:
  - cargo-public-api
provenance:
  formula: cargo-public-api
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
