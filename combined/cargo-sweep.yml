id: brew:cargo-sweep
display-name: cargo-sweep
homepage: https://github.com/holmgr/cargo-sweep
repo: https://github.com/holmgr/cargo-sweep
docs:
  - https://docs.rs/crate/cargo-sweep/latest
  - https://github.com/holmgr/cargo-sweep#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub records the repository as created in November 2018, and crates.io records
      the first cargo-sweep release in the same month. The input package facts list
      Homebrew, Nix, and Arch packages.
  package-nerd-significance:
    - >
      cargo-sweep is notable for Cargo users who accumulate large target directories or
      CI caches, because it offers narrower cleanup choices than Cargo's built-in `cargo
      clean`.
  project-history:
    - >
      The README describes cargo-sweep as a selective cleanup tool for Cargo build
      artifacts and currently marks the project as unmaintained while pointing users
      toward cargo-clean-all as an alternative.
  related-projects:
    - >
      The README lists Cargo's built-in `cargo clean` and cargo-clean-all as related
      cleanup tools.
  sources:
    - https://api.github.com/repos/holmgr/cargo-sweep
    - https://github.com/holmgr/cargo-sweep
    - https://docs.rs/crate/cargo-sweep/latest
    - https://github.com/holmgr/cargo-sweep#readme
    - https://crates.io/api/v1/crates/cargo-sweep
    - https://formulae.brew.sh/api/formula/cargo-sweep.json
  summary:
    - >
      cargo-sweep is a Cargo subcommand for deleting old or unused build artifacts from
      target directories without running a full cargo clean.
  timeline:
    - '2018: GitHub repository created and first crates.io release recorded.'
    - '2025: crates.io records max_version 0.8.0.'
    - >
      2026: GitHub repository metadata still shows recent pushes, while the README marks
      the project unmaintained.
  usage:
    - >
      The official README documents cleaning by age, installed toolchains, maximum
      target-directory size, recursive project search, dry-run previews, and a timestamp
      workflow using `--stamp` and `--file`.
related-packages: []
category: developer-tools
package-manager:
  brew: cargo-sweep
  nix: cargo-sweep
  pacman: cargo-sweep
package-manager-url: https://formulae.brew.sh/formula/cargo-sweep
license: MIT
tags:
  - build-cache
  - cargo-plugin
  - cleanup
  - cli
  - developer-tools
  - disk-space
  - rust
description: Utility for cleaning up unused build files generated by Cargo
executables:
  - cargo-sweep
provenance:
  formula: cargo-sweep
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
