id: brew:inotify-tools
display-name: inotify-tools
homepage: https://github.com/inotify-tools/inotify-tools
repo: https://github.com/inotify-tools/inotify-tools
docs:
  - https://github.com/inotify-tools/inotify-tools#readme
  - https://github.com/inotify-tools/inotify-tools/tree/master/man
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      inotify-tools is broadly packaged across Linux distributions and developer package
      managers because it is a small, dependable building block for file watchers,
      deploy hooks, build scripts, sync scripts, and daemon glue. Homebrew metadata
      lists packages across Alpine, Debian, Fedora, Nix, Pacman, Ubuntu, WinGet, and
      openSUSE.
  package-nerd-significance:
    - >
      For package maintainers, inotify-tools is one of the canonical tiny Unix tools: it
      bridges a Linux-specific kernel facility into shell-friendly text output. Its
      presence in package indexes often enables other packages' test suites, file-reload
      scripts, and live-build tooling.
  project-history:
    - >
      The NEWS file records that inotify-tools began on 19 October 2005, close to the
      arrival of Linux inotify in the 2.6 kernel era. The project grew around
      `inotifywait`, `inotifywatch`, and `libinotifytools`, making filesystem event
      monitoring scriptable without each script needing to call kernel APIs directly.
    - >
      The repository later added `fsnotifywait` and `fsnotifywatch` for
      fanotify-oriented workflows, and the README explicitly recommends enhancing the
      Rust version of the codebase over the older C/C++ version. That note captures an
      unusual maintenance transition for a long-lived Linux utility package.
  related-projects:
    - >
      Related technologies include Linux inotify, Linux fanotify, fsnotify, shell
      scripting, `watch`-style terminal tools, and higher-level file watcher packages
      that build on kernel event APIs.
  sources:
    - https://formulae.brew.sh/formula/inotify-tools
    - https://github.com/inotify-tools/inotify-tools
    - https://github.com/inotify-tools/inotify-tools/releases
    - https://raw.githubusercontent.com/inotify-tools/inotify-tools/master/NEWS
    - https://raw.githubusercontent.com/inotify-tools/inotify-tools/master/README.md
    - >
      https://raw.githubusercontent.com/inotify-tools/inotify-tools/master/man/inotifywait.1.in
  summary:
    - >
      inotify-tools is a Linux-focused package of command-line utilities and a C library
      that expose the kernel inotify interface to shell scripts. The README says its
      purpose is to let inotify features be used from scripts, while the man page
      describes `inotifywait` as an efficient way to wait for filesystem changes.
  timeline:
    - '2005: NEWS records inotify-tools begun.'
    - >
      2005-2010s: `inotifywait`, `inotifywatch`, and `libinotifytools` become standard
      package-manager entries for Linux file-event scripting.
    - >
      2020s: Repository includes fanotify-facing `fsnotifywait` and `fsnotifywatch`
      alongside the inotify tools.
    - '2025: GitHub releases page lists release 4.25.9.0.'
  usage:
    - >
      The most common command is `inotifywait`, which waits for events on files or
      directories, exits after a single event by default, or streams events with
      `--monitor`. The man page documents recursive watching, event selection, CSV and
      custom output formatting, daemon mode, syslog output, and warnings about watch
      limits such as `/proc/sys/fs/inotify/max_user_watches`.
related-packages:
  - id: brew:entr
    reason: >
      Choose entr when the primary goal is to rerun a command after input files change
      using a small Unix pipeline, including on BSD and macOS as well as Linux.
    rel: alternative
    sources:
      - https://github.com/inotify-tools/inotify-tools
      - https://eradman.com/entrproject/
  - id: brew:watchexec
    reason: >
      Choose watchexec for cross-platform recursive watching with ignore-file handling
      and built-in child-process supervision.
    rel: alternative
    sources:
      - https://github.com/inotify-tools/inotify-tools
      - https://watchexec.github.io/docs/
  - id: brew:fswatch
    reason: >
      Choose fswatch when one portable command or library must abstract native
      filesystem notification mechanisms across multiple operating systems.
    rel: alternative
    sources:
      - https://github.com/inotify-tools/inotify-tools
      - https://emcrisostomo.github.io/fswatch/documentation.html
category: system
package-manager:
  apk: inotify-tools
  brew: inotify-tools
  debian: inotify-tools
  dnf: inotify-tools
  nix: inotify-tools
  pacman: inotify-tools
  ubuntu: inotify-tools
  winget: thekid.inotifywait
  zypper: inotify-tools
package-manager-url: https://formulae.brew.sh/formula/inotify-tools
license: GPL-2.0-or-later
