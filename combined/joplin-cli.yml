id: brew:joplin-cli
display-name: Joplin CLI
homepage: https://joplinapp.org/
repo: https://github.com/laurent22/joplin
docs:
  - https://joplinapp.org/help
  - https://joplinapp.org/help/apps/terminal
config-file-location:
  unix: ~/.config/joplin/keymap.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Joplin's adoption is unusually broad for a CLI-associated note tool: by July 1,
      2026 the same upstream project served graphical users, mobile users, web clipper
      users, Joplin Cloud users, and terminal users. Homebrew packages the terminal
      client separately as joplin-cli, while other package managers in the input record
      expose either the terminal app or the broader Joplin application family.
    - >
      The terminal client also has package-nerd appeal because it keeps personal notes
      scriptable. It lets Unix users combine encrypted synchronized notes with external
      editors, backups, shell workflows, and plain-file inspection rather than locking
      all usage behind a desktop UI.
  package-nerd-significance:
    - >
      Joplin CLI sits at the intersection of tools-for-thought culture and Unix
      packaging culture: it is a serious cross-platform note system that still exposes a
      first-class terminal workflow. For package maintainers, the split Homebrew formula
      is significant because it lets users install the lighter command-line client
      without treating the Electron desktop app as the only official surface.
  project-history:
    - >
      Laurent Cozic described starting work in 2016 after finding that commercial note
      applications made notes, attachments, and tags hard to export or manipulate with
      other tools. He first built a simple mobile and terminal application with sync
      capabilities, and the desktop application followed as the project expanded.
    - >
      The public repository was created on GitHub in January 2017 and the project site
      identifies Joplin as open source software with apps for Windows, macOS, Linux,
      Android, iOS, and a terminal application. The terminal documentation presents the
      CLI as a full note and to-do application able to import Evernote ENEX data, use
      Markdown, and synchronize through file-system, Nextcloud, Dropbox, OneDrive,
      WebDAV, and other targets.
  related-projects:
    - >
      Joplin's related surfaces include the Joplin desktop and mobile apps, the browser
      web clipper, Joplin Server, and Joplin Cloud. Its import path from Evernote ENEX
      and its Markdown storage model also make it part of the broader migration
      ecosystem around Evernote alternatives, Markdown note vaults, and self-hosted
      sync.
  sources:
    - https://formulae.brew.sh/formula/joplin-cli
    - https://github.com/laurent22/joplin
    - https://joplinapp.org/
    - https://joplinapp.org/help/apps/terminal/
    - https://opensource.com/article/22/9/joplin-interview
  summary:
    - >
      Joplin CLI is the terminal front end of Joplin, Laurent Cozic's open source
      note-taking and to-do system with Markdown storage, synchronization, and
      end-to-end encryption. The command-line package matters because Joplin began
      partly as a terminal-friendly answer to closed note applications, then grew into a
      family of desktop, mobile, web clipper, server, cloud, and terminal clients.
  timeline:
    - '2016: Laurent Cozic began building Joplin after evaluating commercial note applications.'
    - '2017: The laurent22/joplin repository was created on GitHub.'
    - >
      2021: Joplin Cloud and Joplin Server broadened the sync and sharing story beyond
      third-party sync targets.
    - >
      2026-07-01: The project site described Joplin as available on desktop, mobile, and
      terminal platforms.
  usage:
    - >
      The documented installation path for the terminal app is an npm global install
      that exposes the joplin command. Typical use is managing notebooks, notes, tags,
      synchronization, import/export, and editing note bodies from a preferred text
      editor.
related-packages: []
