id: brew:aqua
display-name: aqua
homepage: https://aquaproj.github.io/
repo: https://github.com/aquaproj/aqua
docs:
  - https://aquaproj.github.io/docs
  - https://aquaproj.github.io/docs/reference/config
config-file-location:
  unix:
    - $AQUA_CONFIG
    - aqua.yaml
    - .aqua.yaml
    - aqua/aqua.yaml
    - .aqua/aqua.yaml
    - $AQUA_GLOBAL_CONFIG
credentials-file-location: null
history:
  adoption-history:
    - >
      aqua is distributed through Homebrew, Chocolatey, Scoop, and winget in the input
      metadata. The official repository metadata shows active development, a four-digit
      star count, and topics around CLI tooling and version management.
    - >
      The project explicitly documents Renovate integration, YAML language-server
      schemas, a standard registry, and using aqua together with other version managers
      such as asdf. That makes its adoption story especially package-manager-native: it
      is designed for repositories to declare the tools they need and let bots update
      those declarations.
  package-nerd-significance:
    - >
      aqua is interesting because it treats command-line tools themselves as lockable,
      reviewable project dependencies. The registry and Renovate conventions put CLI
      installation into the same maintenance loop as library dependencies, which is
      exactly the sort of thing package nerds care about.
  project-history:
    - >
      The official aqua repository was created in August 2021. The repository
      description calls it a declarative CLI version manager with lazy install, a
      registry, Renovate support, and seamless command version switching.
    - >
      The documentation centers on `aqua.yaml` and registry-backed package definitions.
      The config reference documents local and global config discovery, standard and
      local registries, JSON Schema support, checksum settings, and security toggles for
      provenance verification.
  related-projects:
    - >
      Related projects and systems include aqua-registry, Renovate, GitHub Actions, YAML
      Language Server, Cosign, SLSA Provenance, GitHub Artifact Attestations, ghtkn,
      Keyring, and asdf.
  sources:
    - https://api.github.com/repos/aquaproj/aqua
    - https://aquaproj.github.io/docs
    - https://aquaproj.github.io/docs/reference/config
    - source_facts.package-manager
  summary:
    - >
      aqua is a declarative CLI version manager written in Go. It installs and switches
      command-line tools from YAML configuration, aiming at the same daily workflow
      space as asdf-style tool managers but with a registry, lazy install behavior, and
      Renovate-friendly version declarations.
  timeline:
    - '2021: The official aqua repository was created.'
    - >
      2021: The documentation copyright begins and the project published docs under
      aquaproj.github.io.
    - >
      2023: The config reference notes aqua v1.33.0 support for keeping configuration
      files in `.aqua` directories.
    - >
      2024: The config reference documents v2-era provenance and policy controls such as
      Cosign, SLSA, and GitHub Artifact Attestation toggles.
    - '2026: The repository remains actively maintained in the 2.x release line.'
  usage:
    - >
      Users add packages such as `helm/helm@v3.7.0` or `golangci/golangci-lint@v1.42.1`
      to aqua configuration, pin a standard registry ref, and let aqua install or lazily
      install the requested executables.
    - >
      Configuration discovery is intentionally repository-friendly: aqua checks
      `$AQUA_CONFIG`, then `.aqua.yaml`, `aqua.yaml`, `aqua/aqua.yaml`, and
      `.aqua/aqua.yaml` while walking up from the current directory, with
      `$AQUA_GLOBAL_CONFIG` for global tools.
related-packages:
  - id: brew:asdf
    reason: >
      Choose asdf when its broad language-runtime plugin ecosystem and `.tool-versions`
      convention are required; choose aqua for lazy installation, a central declarative
      registry, Renovate integration, and built-in checksum-oriented workflows.
    rel: alternative
    sources:
      - https://aquaproj.github.io/docs/
      - https://asdf-vm.com/guide/getting-started.html
  - id: brew:mise
    reason: >
      Choose mise when one tool should manage runtimes, environment variables, and tasks
      as well as CLI versions; it can also consume aqua registry packages through its
      aqua backend.
    rel: alternative
    sources:
      - https://mise.jdx.dev/dev-tools/backends/aqua.html
      - https://mise.jdx.dev/dev-tools/comparison-to-asdf.html
      - https://aquaproj.github.io/docs/reference/registry/
  - id: brew:renovate
    reason: >
      Renovate can update tool versions and registry references in committed aqua
      configuration using aqua's official preset and regex-manager conventions.
    rel: adjacent_workflow
    sources:
      - https://aquaproj.github.io/docs/guides/renovate/
      - https://docs.renovatebot.com/modules/manager/regex/
category: developer-tools
package-manager:
  brew: aqua
  chocolatey: aqua
  scoop: main/aqua
  winget: aquaproj.aqua
package-manager-url: https://formulae.brew.sh/formula/aqua
license: MIT
tags:
  - cli
  - developer-tools
  - renovate
  - version-manager
  - yaml
description: Declarative CLI Version manager
executables:
  - aqua
provenance:
  formula: aqua
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
