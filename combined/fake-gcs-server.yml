id: brew:fake-gcs-server
display-name: fake-gcs-server
homepage: https://github.com/fsouza/fake-gcs-server
repo: https://github.com/fsouza/fake-gcs-server
docs:
  - https://github.com/fsouza/fake-gcs-server#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project fits the common package-manager role of a local service emulator:
      install a small binary, run it in tests or CI, and point client code at a local
      endpoint. The README also documents Docker Hub images and GitHub releases, which
      broaden adoption beyond Go-only consumers.
  package-nerd-significance:
    - >
      For packagers, fake-gcs-server is useful because it turns cloud-storage
      integration tests into local, reproducible processes. Its split identity as both a
      Go test library and a command-line emulator makes it useful in mixed-language test
      suites.
  project-history:
    - >
      The public GitHub repository was created in May 2017. Its README presents the
      project both as a Go library, exposed through the fakestorage package, and as a
      standalone binary or Docker image.
  related-projects:
    - >
      fake-gcs-server sits in the same tooling family as local emulators for datastore,
      pub/sub, and other cloud APIs used in integration tests.
  sources:
    - https://github.com/fsouza/fake-gcs-server
    - https://github.com/fsouza/fake-gcs-server#readme
    - https://api.github.com/repos/fsouza/fake-gcs-server
    - https://api.github.com/repos/fsouza/fake-gcs-server/releases?per_page=5
  summary:
    - >
      fake-gcs-server is a Go-based emulator for the Google Cloud Storage API. It is
      designed for tests that need local bucket and object behavior without talking to
      Google Cloud.
  timeline:
    - '2017: The GitHub repository is created.'
    - '2026: v1.54.0 is published on GitHub releases.'
  usage:
    - >
      Typical use is to start fake-gcs-server on a local port, optionally preload
      bucket/object data by mounting a /data directory, and run tests against its HTTP
      or HTTPS Google Cloud Storage-compatible endpoints. Server flags can also be
      supplied through FAKE_GCS_* environment variables.
