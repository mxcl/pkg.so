id: brew:g2o
display-name: g2o
homepage: https://openslam-org.github.io/g2o.html
repo: https://github.com/RainerKuemmerle/g2o
docs:
  - https://github.com/RainerKuemmerle/g2o#readme
  - https://openslam-org.github.io/g2o.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      g2o entered package-manager culture because it packages a research-grade SLAM and
      bundle-adjustment optimizer as a reusable C++ library and CLI toolkit. The
      upstream README explicitly documents Homebrew installation, and the input package
      facts list Homebrew, Debian, Ubuntu, and Nix package names.
    - >
      The project also attracted wrapper projects, including a Python binding published
      separately and a .NET wrapper, showing use beyond direct C++ embedding.
  package-nerd-significance:
    - >
      g2o is significant because it is a classic academic C++ optimizer that escaped
      paper-code status into long-lived distro packaging. It carries the usual
      package-maintainer wrinkles: optional SuiteSparse, Qt/libQGLViewer GUI pieces,
      mixed license notes for subcomponents, and ABI-sensitive C++ dependencies.
  project-history:
    - >
      The project was presented by Rainer Kuemmerle, Giorgio Grisetti, Hauke Strasdat,
      Kurt Konolige, and Wolfram Burgard as "g2o: A General Framework for Graph
      Optimization" at ICRA 2011. OpenSLAM described the hosted code as a stable release
      and pointed users to the GitHub repository for development code, including an
      improved Schur complement implementation and BSD relicensing.
    - >
      The GitHub repository was created in January 2012 and describes g2o as a framework
      for optimizing graph-based nonlinear error functions. Its README documents
      CMake/Eigen-based builds, multiple command-line programs, and current support
      across Linux, macOS, Windows, and Android-related build flows.
  related-projects:
    - OpenSLAM hosted the original project page and stable release information.
    - g2o-python provides separately packaged Python bindings.
    - The README also points to a .NET wrapper for g2o.
  sources:
    - https://api.github.com/repos/RainerKuemmerle/g2o
    - https://github.com/RainerKuemmerle/g2o
    - https://openslam-org.github.io/g2o.html
    - https://raw.githubusercontent.com/RainerKuemmerle/g2o/master/README.md
  summary:
    - >
      g2o is an open-source C++ framework for graph-based nonlinear optimization, best
      known in robotics and computer vision for simultaneous localization and mapping
      (SLAM) and bundle adjustment (BA) problems.
  timeline:
    - '2011: g2o paper published at IEEE ICRA.'
    - '2012: Development repository created on GitHub.'
    - >
      2010s: Packaged across Homebrew, Debian/Ubuntu, and Nix according to the supplied
      package facts.
    - >
      2020s: README documents cross-platform CI/build support and related Python/.NET
      wrapper projects.
  usage:
    - >
      Users model problems as graph nodes and edges and run g2o's optimizers on
      nonlinear least-squares graph formulations. Upstream examples and documentation
      emphasize SLAM, bundle adjustment, and text log formats containing node and edge
      messages.
    - >
      Package users commonly install the library and tools, then link against g2o from
      robotics or computer-vision software, or use its command-line binaries such as g2o
      and the simulator tools.
related-packages:
  - id: brew:suite-sparse
    reason: >
      Install SuiteSparse when building or using g2o workloads that benefit from its
      optional CHOLMOD-backed sparse factorization support, while reviewing the
      licensing caveat documented by g2o.
    rel: adjacent_workflow
    sources:
      - https://github.com/RainerKuemmerle/g2o#requirements
      - https://github.com/DrTimothyAldenDavis/SuiteSparse
category: science
package-manager:
  brew: g2o
  debian: libg2o-dev
  nix: g2o
  ubuntu: libg2o-dev
package-manager-url: https://formulae.brew.sh/formula/g2o
license: BSD-2-Clause
tags:
  - c-plus-plus
  - cli
  - computer-vision
  - graph-optimization
  - optimization
  - robotics
  - slam
description: General framework for graph optimization
executables:
  - g2o
  - g2o_simulator2d
  - g2o_simulator3d
provenance:
  formula: g2o
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
