id: brew:ghcup
display-name: GHCup
homepage: https://www.haskell.org/ghcup/
repo: https://github.com/haskell/ghcup-hs
docs:
  - https://www.haskell.org/ghcup
  - https://www.haskell.org/ghcup/guide
  - https://www.haskell.org/ghcup/install
config-file-location:
  unix: ~/.ghcup/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      GHCup gained ecosystem significance because it solved a practical bootstrapping
      problem: Haskell users often need specific compiler and tool versions for each
      project. By living under haskell.org documentation and the haskell GitHub
      organization, it became a central installation path for the Haskell toolchain
      rather than a distro-specific add-on.
  package-nerd-significance:
    - >
      For package maintainers and compiler testers, GHCup matters because it turns
      compiler version juggling into a reproducible user-level operation. It also
      exposes metadata and separate companion repositories for metadata, web
      documentation, Docker images, and GitHub Actions setup.
  project-history:
    - >
      The ghcup-hs repository describes GHCup as the main installer for the Haskell
      language. Hackage describes the Haskell implementation as a rewrite of an earlier
      shell-script ghcup, and the repository release history shows a 0.1.0-pre release
      in 2020 followed by Hackage publication in 2021.
  related-projects:
    - >
      The ghcup-hs README points to ghcup-metadata, ghcup-www, ghcup-docker, and
      ghcup-setup as companion projects.
  sources:
    - https://github.com/haskell/ghcup-hs
    - https://github.com/haskell/ghcup-hs/releases/tag/0.1.0-pre
    - https://hackage.haskell.org/package/ghcup
    - https://hackage.haskell.org/package/ghcup-0.1.14.1
    - https://www.haskell.org/ghcup/
    - https://www.haskell.org/ghcup/guide/
  summary:
    - >
      GHCup is the Haskell toolchain installer used to install and switch versions of
      GHC and related tools such as Cabal, Haskell Language Server, and Stack.
  timeline:
    - '2020: ghcup-hs was created on GitHub and 0.1.0-pre was released.'
    - '2021: ghcup 0.1.14.1 was uploaded to Hackage.'
    - '2023: ghcup 0.1.20.0 added Windows TUI support and Stack metadata support.'
    - '2026: ghcup 0.2.1.0 introduced the installer DSL and revision support.'
  usage:
    - >
      Practitioners use ghcup to install, list, set, remove, and compile toolchain
      versions. Its guide and changelog show growth beyond basic installation into a
      TUI, metadata-driven installation, release channels, tool revisions, health
      checks, and support for editor workflows that depend on Haskell Language Server.
related-packages:
  - id: brew:ghc
    reason: >
      Install GHC alongside GHCup when you need the compiler itself; GHCup manages and
      switches among installed GHC toolchains.
    rel: adjacent_workflow
    sources:
      - https://www.haskell.org/ghcup/guide/
      - https://www.haskell.org/ghc/
  - id: brew:cabal-install
    reason: >
      Use cabal-install for Haskell builds and package management after GHCup has
      provisioned the desired compiler and Cabal tool versions.
    rel: adjacent_workflow
    sources:
      - https://www.haskell.org/ghcup/guide/
      - https://www.haskell.org/cabal/
  - id: brew:haskell-language-server
    reason: >
      Add Haskell Language Server for editor diagnostics and navigation; GHCup supports
      installing HLS versions that match installed GHC toolchains.
    rel: adjacent_workflow
    sources:
      - https://www.haskell.org/ghcup/guide/
      - https://haskell-language-server.readthedocs.io/
category: developer-tools
package-manager:
  brew: ghcup
  scoop: main/ghcup
package-manager-url: https://formulae.brew.sh/formula/ghcup
license: LGPL-3.0-only
tags:
  - cli
  - haskell
  - installer
  - toolchain
  - version-manager
description: Installer for the general purpose language Haskell
executables:
  - ghcup
provenance:
  formula: ghcup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
