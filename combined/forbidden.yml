id: brew:forbidden
display-name: Forbidden
homepage: https://github.com/ivan-sincek/forbidden
repo: https://github.com/ivan-sincek/forbidden
docs:
  - https://github.com/ivan-sincek/forbidden
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README positions pip as the standard installation route and mentions a
      Homebrew formula as an alternative that is not maintained by the author. That
      combination places Forbidden in the common pentesting-tool distribution pattern of
      upstream Python packaging plus downstream CLI formulas.
  package-nerd-significance:
    - >
      Forbidden is package-nerd relevant as a compact example of a Python security CLI
      that depends on multiple HTTP engines to exercise edge cases that ordinary curl
      invocations cannot always produce, such as duplicate Host headers or requests
      without a Host header.
  project-history:
    - >
      The public project history available from official sources is mostly README-level
      rather than narrative. The maintained README documents a mature command set, a
      v13.4 build artifact in source-install instructions, and a roadmap of future tests
      such as hop-by-hop headers, User-Agent headers, cookies, HTTP smuggling, CRLF,
      Log4j, and AWS metadata SSRF.
  related-projects:
    - >
      The README names Python Requests, PycURL, and Python HTTP Client as implementation
      engines and links to internal forbidden.py, test.py, and value.py files for the
      test definitions.
  sources:
    - https://github.com/ivan-sincek/forbidden
    - https://raw.githubusercontent.com/ivan-sincek/forbidden/main/README.md
  summary:
    - >
      Forbidden is a security testing CLI for attempting bypasses of 4xx HTTP response
      status codes and related web access-control behaviors. Its README describes
      separate forbidden and stresser commands and states that the tool is based on
      Python Requests, PycURL, and Python's HTTP client.
  timeline:
    - >
      v13.4: README source-install instructions reference building
      forbidden-13.4-py3-none-any.whl.
    - >
      Current README: Homebrew installation is documented as an alternative not
      maintained by the author.
  usage:
    - >
      Typical use is to supply a target URL and choose test groups such as protocols,
      methods, uploads, overrides, headers, path mutations, encodings, authentication
      bypasses, redirects, and parser tests. The README cautions about proxies
      normalizing URLs, rate limiting, anti-bot protections, and engine-specific
      behavior.
related-packages: []
category: security
package-manager:
  brew: forbidden
  nix: forbidden
package-manager-url: https://formulae.brew.sh/formula/forbidden
license: MIT
tags:
  - cli
  - http
  - pentesting
  - security
description: Bypass 4xx HTTP response status codes and more
executables:
  - forbidden
  - stresser
provenance:
  formula: forbidden
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
