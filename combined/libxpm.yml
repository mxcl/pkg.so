id: brew:libxpm
display-name: libXpm
homepage: https://www.x.org/
repo: https://gitlab.freedesktop.org/xorg/lib/libxpm
docs:
  - https://gitlab.freedesktop.org/xorg/lib/libxpm
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libXpm was adopted because X11 applications needed small color icons and pixmaps
      in a format that could be stored as plain text and embedded in C source. The
      library traveled with X.Org and downstream distributions, so applications could
      keep reading old XPM assets without each toolkit carrying its own parser.
  package-nerd-significance:
    - >
      libXpm is a classic example of X11 compatibility baggage that still matters. It is
      small, old, and easy to overlook, yet it appears in dependency graphs for
      graphical software and has had security-sensitive parser behavior, including
      compressed-file handling and fixes for malformed image inputs.
  project-history:
    - >
      The X.Org repository README identifies libXpm as the X Pixmap image file format
      library and points development to freedesktop.org GitLab. The preserved NEWS.old
      file carries Groupe Bull copyright years 1989-95 and a detailed history of
      user-visible library changes through the 1990s.
    - >
      The XPM format grew out of XBM's C-source-friendly bitmap model into a color
      pixmap format with symbolic colors and transparency. X.Org's archived sxpm manual
      documents support for XPM versions 1, 2, and 3 and describes sxpm as a viewer and
      converter for older XPM files.
  related-projects:
    - >
      libXpm belongs to the X.Org/X11 library family and is related to XBM, Xlib image
      and pixmap APIs, sxpm, cxpm, and older desktop icon assets used by X applications.
  sources:
    - https://gitlab.freedesktop.org/xorg/lib/libxpm
    - https://gitlab.freedesktop.org/xorg/lib/libxpm/-/raw/master/NEWS.old
    - https://gitlab.freedesktop.org/xorg/lib/libxpm/-/raw/master/README.md
    - https://www.x.org/archive/X11R7.5/doc/man/man1/sxpm.1.html
  summary:
    - >
      libXpm is the X.Org library for the X Pixmap image format, the text-based
      color-pixmap format associated with X11 icons, cursors, and small UI images. It
      packages both the legacy file format support and the cxpm validation utility.
  timeline:
    - '1989: Groupe Bull copyright begins for the XPM code preserved in NEWS.old.'
    - '1995: NEWS.old copyright range ends at 1989-95 while 3.4-era releases continue.'
    - '1996: libXpm 3.4h and 3.4j entries document portability and API improvements.'
    - '1998: libXpm 3.4k added the cxpm checker according to NEWS.old.'
    - '2009: X.Org archived the X11R7.5 sxpm manual describing XPM 1, 2, and 3 support.'
  usage:
    - >
      Applications use libXpm to read and write XPM data as X images or pixmaps, while
      the cxpm tool checks XPM files. Package builds also care about its optional
      compressed-file behavior because historically libXpm could invoke compress,
      uncompress, or gzip when opening .Z or .gz pixmap files.
