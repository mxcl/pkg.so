id: brew:ffuf
display-name: ffuf
homepage: https://github.com/ffuf/ffuf
repo: https://github.com/ffuf/ffuf
docs:
  - https://github.com/ffuf/ffuf/wiki
  - https://github.com/ffuf/ffuf#readme
config-file-location:
  unix: $XDG_CONFIG_HOME/ffuf/ffufrc
credentials-file-location: null
history:
  adoption-history:
    - >
      ffuf is packaged widely for security practitioners, including Homebrew,
      Debian/Ubuntu, Fedora, MacPorts, Nix, Scoop, winget, and Alpine according to the
      package facts in this batch. The repository metadata also shows a large public
      GitHub audience for a focused security CLI.
    - >
      Its adoption follows a familiar package-manager path for Go security tools: a
      single static-friendly executable, a clear upstream release page, documented `go
      install` support, and examples that map directly to common bug-bounty and
      penetration-testing tasks.
  package-nerd-significance:
    - >
      ffuf matters in package collections because it is a small, high-demand security
      tool with frequent real-world use and simple installation expectations. Users
      expect it to be present in developer laptops, security workstations, and
      reproducible lab environments without compiling Go code by hand.
  project-history:
    - >
      The GitHub project was created in November 2018, and the first release listed by
      the GitHub API is v0.1 on the same date. The README has consistently described the
      tool as a fast web fuzzer written in Go, with examples centered on the `FUZZ`
      keyword embedded in URLs, headers, and request bodies.
    - >
      By the v2 release line, the README documented a broad set of operational features:
      recursive discovery, multiple matchers and filters, auto-calibration, rate
      limiting, request replay through a proxy, JSON output, external input commands,
      and an interactive mode.
  related-projects:
    - >
      The README documents external mutator use with Radamsa and practice targets such
      as ffufme. In package culture it sits near other web-content discovery and fuzzing
      tools used by penetration testers.
  sources:
    - https://github.com/ffuf/ffuf
    - https://api.github.com/repos/ffuf/ffuf
    - https://api.github.com/repos/ffuf/ffuf/releases
    - https://github.com/ffuf/ffuf/wiki
    - https://formulae.brew.sh/formula/ffuf
  summary:
    - >
      ffuf is a Go-based web fuzzer whose name expands to Fuzz Faster U Fool. It became
      a standard CLI in web-security workflows because it makes content discovery,
      virtual-host discovery, parameter fuzzing, request mutation, filtering, replay,
      and automation fit into one fast binary.
  timeline:
    - '2018: GitHub project created and v0.1 released.'
    - '2023: v2.1.0 released in the GitHub release stream cited for this record.'
    - '2026: Repository metadata showed continued activity and broad public adoption.'
  usage:
    - >
      The core usage pattern is `ffuf -w wordlist -u https://target/FUZZ`, then refine
      results with status-code, size, word, line, regex, or timing matchers and filters.
      The README also documents virtual-host fuzzing with a Host header, GET and POST
      parameter fuzzing, external mutators such as Radamsa, recursion, per-job time
      limits, and JSON output.
    - >
      ffuf reads a default config file from `$XDG_CONFIG_HOME/ffuf/ffufrc` when present.
      Command-line options override values from that default file, while repeatable
      flags such as headers are appended.
related-packages:
  - id: brew:gobuster
    reason: >
      Choose Gobuster when you want explicit modes for directory/file, DNS,
      virtual-host, bucket, or TFTP enumeration instead of ffuf's general keyword-driven
      request fuzzing.
    rel: alternative
    sources:
      - https://github.com/ffuf/ffuf#readme
      - https://github.com/OJ/gobuster#readme
  - id: brew:feroxbuster
    reason: >
      Choose feroxbuster when recursive forced browsing and automatic link extraction
      are the center of the task; choose ffuf for more general placement of fuzz inputs
      in URLs, headers, and bodies.
    rel: alternative
    sources:
      - https://github.com/ffuf/ffuf#readme
      - https://github.com/epi052/feroxbuster#readme
  - id: brew:radamsa
    reason: >
      ffuf's official README documents feeding Radamsa-generated mutations through
      `--input-cmd`, making Radamsa a concrete companion for payload generation.
    rel: adjacent_workflow
    sources:
      - https://github.com/ffuf/ffuf#using-external-mutator-to-produce-test-cases
      - https://gitlab.com/akihe/radamsa
category: security
package-manager:
  apk: ffuf
  brew: ffuf
  debian: ffuf
  dnf: ffuf
  macports: ffuf
  nix: ffuf
  scoop: main/ffuf
  ubuntu: ffuf
  winget: ffuf.ffuf
package-manager-url: https://formulae.brew.sh/formula/ffuf
license: MIT
tags:
  - cli
  - fuzzing
  - go
  - pentesting
  - web-security
description: Fast web fuzzer written in Go
executables:
  - ffuf
provenance:
  formula: ffuf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
