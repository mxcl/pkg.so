id: brew:lsd
display-name: lsd
homepage: https://github.com/lsd-rs/lsd
repo: https://github.com/lsd-rs/lsd
docs:
  - https://github.com/lsd-rs/lsd#readme
config-file-location:
  unix:
    - ~/.config/lsd/config.yaml
    - ~/.config/lsd/colors.yaml
    - ~/.config/lsd/icons.yaml
    - $XDG_CONFIG_HOME/lsd/config.yaml
    - $XDG_CONFIG_HOME/lsd/colors.yaml
    - $XDG_CONFIG_HOME/lsd/icons.yaml
  windows:
    - '%USERPROFILE%\.config\lsd\config.yaml'
    - '%USERPROFILE%\.config\lsd\colors.yaml'
    - '%USERPROFILE%\.config\lsd\icons.yaml'
    - '%APPDATA%\lsd\config.yaml'
    - '%APPDATA%\lsd\colors.yaml'
    - '%APPDATA%\lsd\icons.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      lsd has become one of the best-known modern `ls` replacements in package-manager
      culture. GitHub metadata showed about 16k stars and over 500 forks by July 2026,
      and the supplied package-manager facts list Alpine, Homebrew, Debian, Fedora,
      MacPorts, Nix, Arch, Scoop, Ubuntu, WinGet, and openSUSE.
    - >
      Its adoption follows the broader terminal-aesthetics wave around Nerd Fonts,
      icons, themes, and Rust CLI tools: users often install it alongside shells, prompt
      themes, and other replacements for classic Unix commands.
  package-nerd-significance:
    - >
      lsd is significant because it packages a complete modern terminal visual style
      into a small command. For package nerds, it is the canonical example of a Rust CLI
      replacing a core Unix affordance while still fitting naturally into Homebrew,
      distro repositories, and Windows package managers.
  project-history:
    - >
      The official repository describes lsd as 'the next gen ls command'. It was created
      on GitHub in November 2018 and early releases appeared in December 2018, followed
      by v1.0.0 in August 2023 and v1.2.0 in October 2025.
    - >
      The README documents a familiar package-manager installation matrix across Linux
      distributions, macOS, BSDs, Windows, and source builds. It also credits the
      colorls project and sharkdp's fd project for inspiration and CI ideas.
  related-projects:
    - >
      lsd is related to GNU/BSD `ls`, colorls, exa/eza, Nerd Fonts, Font Awesome, and
      the wider Rust CLI ecosystem.
  sources:
    - https://api.github.com/repos/lsd-rs/lsd
    - https://api.github.com/repos/lsd-rs/lsd/releases?per_page=100
    - https://github.com/lsd-rs/lsd
    - https://raw.githubusercontent.com/lsd-rs/lsd/master/README.md
    - source_facts.package-manager
  summary:
    - >
      lsd is a Rust implementation of a modern `ls`-style file-listing command with
      color, icons, themes, and configuration.
  timeline:
    - '2018: GitHub repository created and early 0.x releases published.'
    - '2023: v1.0.0 released.'
    - '2025: v1.2.0 released.'
    - '2026: GitHub metadata shows broad adoption and continued activity.'
  usage:
    - >
      Users run `lsd` directly or alias `ls` to `lsd` in shell startup files. The README
      documents icon prerequisites, package-manager installation commands, and optional
      shell configuration.
    - >
      Customization is via `config.yaml`, `colors.yaml`, and `icons.yaml` under the lsd
      configuration directory. On Unix-like systems the README says lsd follows XDG and
      checks `$HOME/.config/lsd` and `$XDG_CONFIG_HOME/lsd`; on Windows it checks
      `%USERPROFILE%\.config\lsd` and `%APPDATA%\lsd`.
related-packages:
  - id: brew:eza
    reason: >
      Choose eza when Git metadata, hyperlinks, mount details, and a maintained modern
      `ls` interface matter more than lsd's LSDeluxe-specific configuration and
      presentation style.
    rel: alternative
    sources:
      - https://github.com/eza-community/eza
      - https://github.com/lsd-rs/lsd
category: system
package-manager:
  apk: lsd
  brew: lsd
  debian: lsd
  dnf: lsd
  macports: lsd
  nix: lsd
  pacman: lsd
  scoop: main/lsd
  ubuntu: lsd
  winget: lsd-rs.lsd
  zypper: lsd
package-manager-url: https://formulae.brew.sh/formula/lsd
license: Apache-2.0
tags:
  - cli
  - file-listing
  - icons
  - ls
  - rust
  - terminal
description: Clone of ls with colorful output, file type icons, and more
executables:
  - lsd
provenance:
  formula: lsd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
