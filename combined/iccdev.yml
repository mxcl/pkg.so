id: brew:iccdev
display-name: iccDEV
homepage: https://github.com/InternationalColorConsortium/iccDEV
repo: https://github.com/InternationalColorConsortium/iccDEV
docs:
  - https://github.com/InternationalColorConsortium/iccDEV
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README lists installation paths through Homebrew, npm, and Docker, while the
      build documentation gives platform-specific CMake instructions for Ubuntu, macOS,
      Windows MSVC, Windows ClangCL, and MinGW. That packaging spread reflects a mixed
      audience of color-management developers, conformance testers, and users converting
      or inspecting profile data.
  package-nerd-significance:
    - >
      iccDEV is package-nerdy because it turns a standards consortium's color-science
      artifacts into installable CLI tools. It sits far from the common web/server
      package mainstream, yet it is exactly the sort of domain-specific tooling that
      package managers preserve for reproducible technical workflows.
  project-history:
    - >
      The ICC README describes the consortium's purpose as promoting open,
      vendor-neutral, cross-platform color management systems and explains that iccDEV
      grew out of DemoIccMAX. It supports both the ICC profile specification and the
      iccMAX profile specification, tying the codebase directly to ICC standardization
      work.
    - >
      The broader ICC site traces the consortium to its 1993 founding by eight industry
      vendors and explains the ICC profile format as a cross-platform device profile
      format. iccDEV is therefore not just a utility bundle; it is executable reference
      and developer tooling around a profile format used across imaging, print, display,
      and color workflows.
  related-projects:
    - >
      Related projects and standards include ICC profiles, iccMAX, ISO 15076-1, ICC v4
      profiles, color management modules, profile XML/JSON representations, image
      metadata tooling, and the International Color Consortium's technical working
      groups.
  sources:
    - https://formulae.brew.sh/formula/iccdev
    - https://github.com/InternationalColorConsortium/iccDEV
    - >
      https://raw.githubusercontent.com/InternationalColorConsortium/iccDEV/master/docs/build.md
    - https://www.color.org/abouticc.xalter
    - https://www.color.org/icc_specs2.xalter
  summary:
    - >
      iccDEV is the International Color Consortium's open-source library and tool
      collection for interacting with, manipulating, and applying ICC-based color
      management profiles. The project was formerly known as DemoIccMAX and now packages
      command-line tools, libraries, build recipes, and developer documentation around
      ICC and iccMAX profile work.
  timeline:
    - '1993: International Color Consortium established by eight industry vendors.'
    - >
      2010: ICC profile specification published as ISO 15076-1:2010 according to ICC's
      overview.
    - >
      2010s: DemoIccMAX served as the earlier project identity for iccMAX-oriented demo
      and reference tooling.
    - >
      2020s: iccDEV packaging includes Homebrew, npm, and Docker installation paths,
      with CMake build support across major desktop/server platforms.
  usage:
    - >
      The Homebrew formula exposes many specialized tools, including profile
      application, XML/JSON conversion, profile dumping, TIFF/PNG helpers, round-trip
      tests, visualization, and iccMAX/v4 compatibility helpers. Typical use is
      inspecting ICC profiles, converting profile representations, applying color
      transforms, and validating profile behavior in development pipelines.
related-packages: []
