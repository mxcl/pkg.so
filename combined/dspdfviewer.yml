id: brew:dspdfviewer
display-name: dspdfviewer
homepage: https://dspdfviewer.danny-edel.de/
repo: https://github.com/dannyedel/dspdfviewer
docs:
  - https://dspdfviewer.danny-edel.de/
  - https://github.com/dannyedel/dspdfviewer#readme
config-file-location:
  unix: ~/.config/dspdfviewer.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      dspdfviewer spread through academic and LaTeX presentation workflows rather than a
      broad desktop-app audience. It is packaged by Homebrew, Debian, Ubuntu, and
      MacPorts, which matches the needs of conference speakers and TeX users on
      Unix-like systems.
    - >
      Homebrew analytics showed 610 installs over the preceding 365 days during this
      batch, unusually healthy for a small, old presenter utility.
  package-nerd-significance:
    - >
      dspdfviewer matters to package nerds because it is a compact domain-specific GUI
      that survives through distro packaging: it solves one Beamer/presenter workflow
      well, has stable old releases, and depends on desktop PDF/Qt plumbing that package
      maintainers keep integrating long after upstream release activity slows.
  project-history:
    - >
      The README describes a deliberately narrow tool: split a Beamer-generated PDF into
      left and right halves and render the audience and speaker-note views on separate
      screens. The public GitHub release history shows the mature 1.13 through 1.15 line
      active in 2015 and 2016.
    - >
      Version 1.14, published on 2015-12-01, was a notable portability release adding
      Windows, Qt5, and translation support. The final published GitHub release in the
      observed series, 1.15.1, followed on 2016-09-13 as a bugfix release for 1.15.
  related-projects:
    - >
      LaTeX Beamer is the presentation system whose notes-on-second-screen output
      dspdfviewer targets.
    - Qt is the desktop toolkit family highlighted by the v1.14 release notes.
    - >
      General PDF viewers overlap for ordinary slides, but dspdfviewer is specialized
      around presenter notes and dual-screen splitting.
  sources:
    - https://github.com/dannyedel/dspdfviewer#readme
    - https://github.com/dannyedel/dspdfviewer/releases/tag/v1.14
    - https://github.com/dannyedel/dspdfviewer/releases/tag/v1.15
    - https://github.com/dannyedel/dspdfviewer/releases/tag/v1.15.1
    - https://formulae.brew.sh/formula/dspdfviewer
  summary:
    - >
      dspdfviewer is Danny Edel's dual-screen PDF presenter for LaTeX Beamer talks,
      especially PDFs produced with Beamer's notes-on-second-screen layout.
  timeline:
    - '2015-08-01: v1.13 was published in the GitHub release history.'
    - '2015-12-01: v1.14 was published with Windows, Qt5, and translation support.'
    - '2016-04-05: v1.15 was published.'
    - '2016-09-13: v1.15.1 was published as a bugfix release for v1.15.'
    - >
      2026 batch check: Homebrew still packaged v1.15.1 and showed 610 installs over the
      preceding 365 days.
  usage:
    - >
      The usual workflow is to build a LaTeX Beamer PDF with speaker notes, then run
      dspdfviewer on the resulting PDF. The README documents navigation keys, screen
      swapping, blanking the audience screen, and a `-f` mode for using ordinary PDFs.
related-packages:
  - id: brew:pdfpc
    reason: >
      Choose pdfpc for a broader GTK presenter console with notes, next-slide previews,
      timing, drawing, media support, REST control, and presentation metadata beyond
      dspdfviewer's split-Beamer-page model.
    rel: alternative
    sources:
      - https://github.com/pdfpc/pdfpc#readme
      - https://dspdfviewer.danny-edel.de/manpage.html
  - id: brew:pympress
    reason: >
      Choose Pympress for a portable, highly configurable presenter console that
      supports Beamer notes, LibreOffice notes pages, annotations, embedded media, and
      editable layouts across Linux, macOS, and Windows.
    rel: alternative
    sources:
      - https://github.com/Cimbali/pympress/blob/main/README.md
      - https://dspdfviewer.danny-edel.de/manpage.html
category: media
package-manager:
  brew: dspdfviewer
  debian: dspdfviewer
  macports: dspdfviewer
  ubuntu: dspdfviewer
package-manager-url: https://formulae.brew.sh/formula/dspdfviewer
license: GPL-2.0-or-later
tags:
  - cli
  - desktop-app
  - latex-beamer
  - pdf-viewer
  - presenter-notes
  - qt
description: Dual-Screen PDF Viewer for latex-beamer
executables:
  - dspdfviewer
provenance:
  formula: dspdfviewer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
