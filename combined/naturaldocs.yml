id: brew:naturaldocs
display-name: Natural Docs
homepage: https://www.naturaldocs.org/
repo: https://github.com/NaturalDocs/NaturalDocs
docs:
  - https://www.naturaldocs.org/getting_started
  - https://www.naturaldocs.org/reference
config-file-location:
  unix: Project.txt in the project configuration folder
credentials-file-location: null
history:
  adoption-history:
    - >
      Natural Docs has a long tail rather than a large modern package-manager footprint.
      The official site says it is used by educational institutions, government,
      companies, and individuals, and points to public pages generated by Natural Docs
      as evidence. Homebrew analytics consulted on 2026-07-01 listed 113 installs over
      the preceding 365 days.
  package-nerd-significance:
    - >
      Natural Docs is interesting to package maintainers because it spans two eras of
      language tooling: old Perl-era source documentation and the 2.x C#/Mono packaging
      story. The Homebrew formula still depends on Mono, which makes it a reminder that
      documentation generators often carry runtime packaging constraints long after
      their core idea stabilizes.
  project-history:
    - >
      The official About page says Greg Valure wrote Natural Docs after rejecting
      heavier documentation workflows, open sourced it, and has maintained it since its
      first release in 2003. The same page records the major architectural shift from
      the original Perl implementation to Natural Docs 2.0, a C# rewrite with a new
      engine.
    - >
      The GitHub repository for the 2.x code was created on 2017-04-17. Public GitHub
      releases include Natural Docs 2.3 on 2023-09-12, 2.3.1 on 2025-02-01, and 2.4 beta
      work in 2026.
  related-projects:
    - >
      Comparable documentation generators include Doxygen, Javadoc-style tooling,
      Sphinx, and language-native documentation systems, but Natural Docs'
      distinguishing feature is its plain-English comment style.
  sources:
    - https://api.github.com/repos/NaturalDocs/NaturalDocs
    - https://formulae.brew.sh/formula/naturaldocs
    - https://github.com/NaturalDocs/NaturalDocs
    - https://github.com/NaturalDocs/NaturalDocs/releases
    - https://www.naturaldocs.org/about/
    - https://www.naturaldocs.org/reference/project.txt/
  summary:
    - >
      Natural Docs is a multi-language source-code documentation generator built around
      comments that stay readable in the source file. Its niche is documentation that
      feels closer to prose than annotation syntax, while still producing browsable HTML
      output.
  timeline:
    - '2003: First Natural Docs release, according to the official About page.'
    - '2015-05-04: Natural Docs 2.0 development release tag appears in the GitHub repository.'
    - '2017-04-17: GitHub repository created for the 2.x source tree.'
    - '2023-09-12: Natural Docs 2.3 released.'
    - '2025-02-01: Natural Docs 2.3.1 released.'
    - '2026-05-26: Natural Docs 2.4 Beta 1 released as a prerelease.'
  usage:
    - >
      Users configure a project with `Project.txt`, which tells Natural Docs which
      source folders to scan, where to write generated documentation, and project
      metadata such as title. The reference documentation says command-line options can
      override parts of Project.txt, partly for compatibility with Natural Docs 1.x
      workflows.
related-packages:
  - id: brew:doxygen
    reason: >
      Choose Doxygen when you need its extensive annotation formats, source browsing,
      and HTML, man-page, XML, or LaTeX output; choose Natural Docs when readable
      plain-language source comments are the priority.
    rel: alternative
    sources:
      - https://www.naturaldocs.org/about/
      - https://www.doxygen.nl/manual/docblocks.html
      - https://www.doxygen.nl/manual/output.html
category: developer-tools
package-manager:
  brew: naturaldocs
  debian: naturaldocs
  dnf: NaturalDocs
  macports: naturaldocs
  ubuntu: naturaldocs
package-manager-url: https://formulae.brew.sh/formula/naturaldocs
license: AGPL-3.0-only
tags:
  - cli
  - developer-tools
  - documentation
  - documentation-generator
  - multi-language
description: Extensible, multi-language documentation generator
executables:
  - naturaldocs
provenance:
  formula: naturaldocs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
