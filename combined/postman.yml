id: cask:postman
display-name: Postman
homepage: https://www.postman.com/
repo: null
docs:
  - https://learning.postman.com/docs
  - https://learning.postman.com/docs/getting-started/installation/install-overview
config-file-location:
  linux: ~/.config/Postman/
  macos: ~/Library/Application Support/Postman/
  windows:
    - '%LOCALAPPDATA%\Postman\'
    - '%APPDATA%\Postman\'
credentials-file-location: null
history:
  adoption-history:
    - >
      The original Chrome application approached half a million users before the company
      was formed. Postman reports that its platform now serves more than 40 million
      users and 500,000 companies, including 98% of the Fortune 500.
  package-nerd-significance:
    - >
      Postman helped turn ad hoc HTTP request testing into a mainstream,
      collection-oriented API workflow. For package-manager users, its desktop cask is a
      common workstation tool spanning request construction, automated tests,
      environments, documentation, collaboration and API governance.
  project-history:
    - >
      Abhinav Asthana conceived Postman after encountering cumbersome API testing and
      debugging workflows. The first public announcement appeared in a Stack Overflow
      reply in 2012, and the tool initially spread as a Chrome application.
    - >
      Rapid adoption led Asthana, Ankit Sobti and Abhijit Kane to establish Postman,
      Inc. in 2014. The product subsequently expanded from a request client into a
      collaborative platform covering the API lifecycle.
  related-projects:
    - Postman web app
    - Postman Desktop Agent
    - Postman CLI
    - Newman
    - Postman Visual Studio Code extension
    - Postman Collections
  sources:
    - 'Official company history: https://www.postman.com/company/about-postman/'
    - 'Official documentation: https://learning.postman.com/docs/'
    - >
      Official founder history:
      https://blog.postman.com/how-we-built-postman-product-and-company/
    - 'Official press facts: https://www.postman.com/company/press-media/'
  summary:
    - >
      Postman is an API development and collaboration platform. Its desktop application
      supports sending and debugging requests, organizing APIs and collections, running
      tests, managing variables and secrets, and collaborating through cloud workspaces.
  timeline:
    - '2012: First public announcement of the Postman tool'
    - '2014: Postman, Inc. was established'
    - '2021: Postman reported 17 million developers and 50 million active collections'
    - '2026: Postman reported more than 40 million users and 500,000 companies'
  usage:
    - >
      Developers use the desktop application to construct HTTP requests, inspect
      responses, automate tests with collections, work with environments and variables,
      manage authorization data, configure certificates and proxies, and synchronize
      work through Postman Cloud or supported Git workflows.
category: developer-tools
package-manager:
  brew-cask: postman
package-manager-url: https://formulae.brew.sh/cask/postman
tags:
  - api-client
