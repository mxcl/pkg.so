history:
  adoption-history:
    - >
      ircII appears in Homebrew, Debian, Ubuntu, MacPorts, Alpine, and other package
      indexes because it remains a compact terminal client for IRC users who prefer a
      classic Unix interface. IRC help material also documents ircII as a Unix-shell
      client and discusses EPIC and other clients in relation to ircII.
  package-nerd-significance:
    - >
      ircII is package-nerd material because it preserves an older Unix distribution
      model: source tarballs, termcap UI, generated help files, and small command-line
      companion programs. Its versioned executable names in package managers are a
      reminder that old IRC clients often need to coexist with scripts and user habits
      built over decades.
  project-history:
    - >
      The project site describes ircII as an IRC and ICB client for most Unix platforms,
      distributed in source form and maintained by a group that incorporates fixes and
      features. Its release news shows date-stamped source releases continuing through
      the 2000s and 2010s, including changes for SSL IRC servers, UTF-8 handling,
      lastlog behavior, macOS fixes, sanitizer-derived bug fixes, and generated HTML
      help.
    - >
      The package's long-lived source archive style is part of its identity: the project
      publishes tarballs and a daily expanded source tree rather than presenting a
      modern forge as the primary source-control interface.
  related-projects:
    - >
      ircII is historically adjacent to other Unix IRC clients such as EPIC, BitchX,
      ScrollZ, Irssi, and WeeChat, and to ICB clients through its combined IRC/ICB
      support.
  sources:
    - http://www.eterna23.net/ircii
    - http://www.eterna23.net/ircii/news.html
    - https://formulae.brew.sh/formula/ircii
    - https://ircii.warped.com/
    - https://manpages.debian.org/testing/ircii/ircII.1.en.html
    - https://www.irchelp.org/clients/unix/ircii/
  summary:
    - >
      ircII is a source-distributed Unix IRC and ICB client maintained by the ircII
      project. It is important in package history because it represents the early
      terminal IRC client tradition from which several later Unix IRC clients took
      inspiration or code.
  timeline:
    - '2006: Project news lists public releases in July 2006.'
    - '2011: Project news lists the 20110228 and 20111115 releases.'
    - >
      2014: Releases added HTTP proxy and SSL IRC server support, followed by resize and
      display fixes.
    - '2017: A release focused on UTF-8, log, lastlog, resize, and macOS fixes.'
    - '2019: Releases added lastlog restore support and early HTML help conversion.'
    - '2021: A release included memory leak, crash, and sanitizer-derived fixes.'
    - '2024: The project published 20240111 and 20240918 source releases.'
    - '2026: The project published the 20260115 source release.'
  usage:
    - >
      Users run `irc` or versioned helper binaries from a terminal to connect to IRC or
      ICB services. The Debian manpage describes it as a full-screen termcap interface
      that exposes normal IRC functions plus additional options, which matches its
      package-manager role as a lightweight console chat client.
related-packages:
  - id: brew:weechat
    reason: >
      Choose WeeChat when you want a newer, plugin-oriented terminal IRC client with
      scripting, split views, SASL, relay interfaces, and active comprehensive
      documentation.
    rel: alternative
    sources:
      - http://www.eterna23.net/ircii
      - https://weechat.org/about/features/
  - id: brew:irssi
    reason: >
      Choose Irssi for a modular terminal IRC client with extensive settings, scripting,
      and maintained user documentation, while ircII retains the older IRC/ICB interface
      tradition.
    rel: alternative
    sources:
      - http://www.eterna23.net/ircii
      - https://irssi.org/documentation/
