id: brew:md-tui
display-name: MD-TUI
homepage: https://github.com/henriklovhaug/md-tui
repo: https://github.com/henriklovhaug/md-tui
docs:
  - https://github.com/henriklovhaug/md-tui#readme
config-file-location:
  unix: ~/.config/mdt/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      By July 2026, GitHub metadata showed about 491 stars, 28 forks, and 40 releases,
      with v0.10.3 published in June 2026. That is moderate adoption for a focused
      terminal reader, especially one aimed at users who prefer reading Markdown inside
      a terminal rather than opening a browser or editor preview.
    - >
      The README's package list shows adoption across several packaging communities:
      Arch, Cargo, Conda-Forge via Pixi, Homebrew, and Nix. This is exactly the pattern
      common to small Rust TUIs that become useful enough to package outside crates.io.
  package-nerd-significance:
    - >
      MD-TUI is package-nerd significant as a modern Rust TUI in the Markdown viewer
      niche: small binary, terminal-first workflow, config under XDG-style paths, and
      distribution through Cargo plus system package managers. It sits beside tools like
      `glow` and editor previews, but chooses file-tree navigation and key-driven
      reading as its shape.
    - >
      Its executable name, `mdt`, is also worth recording because the package name is
      `md-tui` while the command users run is shorter. That distinction matters for
      package databases and command-to-package lookup.
  project-history:
    - >
      The public GitHub repository was created in October 2023. The README presents
      MD-TUI as a terminal-based Markdown viewer rather than a converter: users run `mdt
      <file.md>`, run `mdt` to browse Markdown files under the current directory, or
      pipe Markdown into the program.
    - >
      The project grew into a packaged Rust CLI with a documented configuration file at
      `~/.config/mdt/config.toml`, release binaries, Cargo installation, Homebrew, Arch,
      Conda-Forge/Pixi, and Nix options. Its README also notes a related Neovim plugin
      variant and possible library use, though library use is not the primary documented
      surface.
  related-projects:
    - >
      MD-TUI is related to terminal Markdown viewers, Rust TUI applications,
      `$EDITOR`-driven note workflows, and the companion Neovim preview plugin mentioned
      by the README.
  sources:
    - https://api.github.com/repos/henriklovhaug/md-tui
    - https://api.github.com/repos/henriklovhaug/md-tui/releases
    - https://github.com/henriklovhaug/md-tui
  summary:
    - >
      MD-TUI is a Rust terminal application for viewing and navigating Markdown files.
      It focuses on keyboard-driven reading, link navigation, file-tree browsing,
      search, syntax highlighting, optional terminal image rendering, and a configurable
      terminal UI.
  timeline:
    - '2023-10: Public GitHub repository created.'
    - '2024-02: v0.2.1 release published.'
    - '2026-06: v0.10.3 release published.'
    - >
      2026-07: Repository metadata shows 40 releases and package instructions for Cargo,
      Homebrew, Arch, Conda-Forge/Pixi, and Nix.
  usage:
    - >
      Typical usage is `mdt README.md`, plain `mdt` for recursive Markdown discovery
      with a file tree, or piping content with `cat README.md | mdt`. The default key
      bindings support scrolling, search, link selection, details folding, hover
      previews, editor handoff through `$EDITOR`, sorting, and quitting.
    - >
      The official README documents `~/.config/mdt/config.toml` for keyboard and
      color/misc settings. It also lists supported syntax highlighting languages for
      code blocks, including shell, C/C++, CSS, Go, HTML, Java, JavaScript, JSON, Lua,
      Python, Rust, TypeScript, YAML, and others.
related-packages:
  - id: brew:glow
    reason: >
      Choose Glow for a polished Markdown reader that discovers local files and
      repository documentation; choose MD-TUI when configurable key bindings, link
      navigation, and an explicit file-tree interface are central.
    rel: alternative
    sources:
      - https://github.com/henriklovhaug/md-tui#readme
      - https://github.com/charmbracelet/glow#readme
  - id: brew:mdcat
    reason: >
      Choose mdcat for cat-like Markdown rendering with modern terminal hyperlink and
      image features; choose MD-TUI for an interactive navigational interface with
      search and editor handoff.
    rel: alternative
    sources:
      - https://github.com/henriklovhaug/md-tui#readme
      - https://github.com/BIRSAx2/mdcat#readme
category: productivity
package-manager:
  brew: md-tui
  chocolatey: MDT
  nix: md-tui
  pacman: md-tui
  scoop: main/md-tui
package-manager-url: https://formulae.brew.sh/formula/md-tui
license: AGPL-3.0-or-later
tags:
  - cli
  - markdown
  - rust
  - terminal
  - viewer
description: Markdown renderer in the terminal written in rust
executables:
  - mdt
provenance:
  formula: md-tui
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
