id: brew:gpx
display-name: GPX
homepage: https://github.com/markwal/GPX/blob/HEAD/README.md
repo: https://github.com/markwal/GPX
docs:
  - https://github.com/markwal/GPX#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GPX found a home among owners of pre-fifth-generation MakerBot printers and
      compatible clones, especially users running Sailfish firmware or using modern
      slicers instead of the original MakerBot workflow.
    - >
      The README documents Linux package installation, Windows release zips, macOS dmg
      files, and Homebrew, which explains its presence as a package-manager utility
      rather than only a printer-forum binary.
  package-nerd-significance:
    - >
      GPX is a preservation package for a specific hardware generation. It keeps old
      MakerBot-compatible printers usable with general slicers and modern host operating
      systems.
    - >
      It is also a good example of why package managers carry small hardware
      translators: the binary is tiny, the domain is narrow, and the alternative is
      reviving a full legacy printer software stack.
  project-history:
    - >
      The README says GPX was created by Dr. Henry Thomas, also known as Wingcommander,
      in April 2013. Repository history begins in April 2013 with work-in-progress
      commits and an alpha 0.1 commit.
    - >
      The tool's purpose was to open older MakerBot-style printers to a wider set of
      slicing tools such as Cura, KISSlicer, S3DCreator, and Slic3r by translating their
      G-code output into the X3G format those printers could consume.
  related-projects:
    - GpxUi is a graphical wrapper around GPX.
    - >
      OctoPrint-GPX uses GPX to translate G-code to X3G under OctoPrint for
      MakerBot-style printers.
    - >
      Sailfish firmware is a common target firmware named by GPX and OctoPrint-GPX
      documentation.
  sources:
    - https://github.com/markwal/GPX
    - https://github.com/markwal/GPX#readme
    - https://github.com/markwal/GpxUi
    - https://github.com/markwal/OctoPrint-GPX
  summary:
    - >
      GPX is a command-line post-processing utility that converts sliced 3D-printer
      G-code into X3G files for MakerBot Cupcake, Thing-O-Matic, Replicator-family, and
      clone printers, including Sailfish firmware setups.
  timeline:
    - '2013-04: GPX is created by Dr. Henry Thomas.'
    - '2013-04-11: Public repository history begins with work-in-progress commits.'
    - '2013-04-17: Repository history records an alpha 0.1 commit.'
    - '2014-2015: README copyright credits additional changes by DNewman and MWalker.'
    - '2020-11-26: Repository history records version-number work for 2.6.8.'
  usage:
    - >
      Typical usage is `gpx` with a machine preset and a sliced `.gcode` input,
      producing an `.x3g` output for SD-card printing or a downstream workflow. It also
      accepts custom machine and EEPROM `.ini` files through command-line options, but
      the official README does not define a fixed config-file location.
    - >
      Related workflows include GpxUi for users who want a graphical wrapper and
      OctoPrint-GPX for translating G-code to X3G inside an OctoPrint communication
      path.
related-packages: []
category: developer-tools
package-manager:
  brew: gpx
  debian: gpx
  nix: gpx
  ubuntu: gpx
package-manager-url: https://formulae.brew.sh/formula/gpx
license: GPL-2.0-or-later
tags:
  - 3d-printing
  - cli
  - gcode
  - sailfish
  - x3g
description: Gcode to x3g converter for 3D printers running Sailfish
executables:
  - gpx
  - machines
  - s3gdump
provenance:
  formula: gpx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
