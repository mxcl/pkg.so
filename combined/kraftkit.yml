id: brew:kraftkit
display-name: KraftKit
homepage: https://unikraft.org/docs/cli
repo: https://github.com/unikraft/kraftkit
docs:
  - https://unikraft.org/docs/cli
config-file-location:
  unix: ~/.config/kraftkit/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      KraftKit adoption tracks the effort to make unikernels approachable beyond
      research labs. The official docs call `kraft` Unikraft's companion command-line
      tool and say it was modeled after popular package managers and build tools to make
      building and managing applications as unikernels easier.
    - >
      Homebrew packaging matters for KraftKit because local macOS installation is one of
      the low-friction paths into a workflow that otherwise spans compilers,
      virtualization, OCI-style packaging, manifests, cloud deployment, and runtime
      management.
  package-nerd-significance:
    - >
      KraftKit is interesting to package nerds because it treats unikernel components
      like packageable artifacts. It combines a language/toolchain installer, build
      orchestrator, package manager, local VM runner, and cloud deployer into one CLI,
      which is exactly the kind of tool that benefits from clean Homebrew distribution.
  project-history:
    - >
      The unikraft/kraftkit repository was created on March 16, 2022, as the Go-based
      successor and companion tooling around the Unikraft unikernel project. The
      repository describes KraftKit as a suite of tools for custom, minimal, immutable
      lightweight unikernel virtual machines based on Unikraft.
    - >
      Unikraft itself came from the systems-research and unikernel world, where the goal
      is to compile an application with only the OS components it needs. KraftKit made
      that workflow look more like a modern developer CLI: install a `kraft` binary,
      build a project, run it locally with backends such as QEMU, package artifacts, and
      deploy to Unikraft Cloud.
  related-projects:
    - >
      KraftKit is related to Unikraft, KraftCloud or Unikraft Cloud, QEMU, Xen,
      Firecracker, OCI registries, BuildKit, Dockerfile and Compose workflows, and
      unikernel systems research.
  sources:
    - https://github.com/unikraft/kraftkit
    - https://github.com/unikraft/kraftkit/commit/f22d740e3e1e49dea89bdb0f129ef592cfa15e81
    - https://github.com/unikraft/kraftkit/releases/tag/v0.12.13-22-g189cd286
    - https://github.com/unikraft/kraftkit/releases/tag/v0.12.5-172-g4d204f63
    - https://unikraft.com/blog
    - https://unikraft.org/docs/cli
  summary:
    - >
      KraftKit is the `kraft` command-line tool and Go framework for building,
      packaging, running, and deploying Unikraft unikernel virtual machines. It packages
      the unikernel workflow into a developer-facing CLI modeled after familiar package
      managers and build tools.
  timeline:
    - '2022-03-16: unikraft/kraftkit repository created on GitHub.'
    - '2022-10-27: v0.1.0 tag commit recorded in the KraftKit repository.'
    - '2024-04: Unikraft Cloud was announced as a cloud platform built on Unikraft technology.'
    - >
      2026-03-08: GitHub release v0.12.5-172-g4d204f63 was published in the observed
      release stream.
    - >
      2026-06-26: GitHub release v0.12.13-22-g189cd286 was published in the observed
      release stream.
  usage:
    - >
      The package installs the `kraft` executable. The CLI can build, clean, configure,
      package, pull, push, run, start, stop, inspect, and deploy Unikraft unikernels;
      the official CLI reference also documents local runtime, networking, volume,
      compose, cloud, image, service, autoscale, certificate, and completion commands.
related-packages:
  - id: brew:qemu
    reason: >
      QEMU is a documented local hypervisor backend used by kraft run to instantiate
      supported Unikraft images and is also useful for inspecting or debugging the
      resulting virtual machines directly.
    rel: adjacent_workflow
    sources:
      - https://unikraft.org/docs/cli/running
      - https://www.qemu.org/docs/master/
category: cloud-infrastructure
package-manager:
  apk: kraftkit
  brew: kraftkit
  nix: kraft
  ubuntu: kraft
  zypper: kraft
package-manager-url: https://formulae.brew.sh/formula/kraftkit
license: BSD-3-Clause
tags:
  - cli
  - unikernel
  - unikraft
  - virtual-machines
description: Build and use highly customized and ultra-lightweight unikernel VMs
executables:
  - kraft
provenance:
  formula: kraftkit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
