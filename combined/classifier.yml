id: brew:classifier
display-name: Ruby Classifier
homepage: https://rubyclassifier.com
repo: https://github.com/cardmagic/classifier
docs:
  - https://rubyclassifier.com/docs
  - https://rubydoc.info/gems/classifier
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      RubyGems reported 1,162,163 total downloads for the classifier gem, making the
      Ruby package history much larger than the Homebrew CLI footprint. Homebrew
      packages version 2.6.0 and reported 131 installs over the prior 365 days.
  package-nerd-significance:
    - >
      classifier is notable because an old Ruby ML/text-processing gem now spans
      RubyGems, generated API docs, a dedicated docs site, native extension compilation,
      and a Homebrew CLI package.
  project-history:
    - >
      The GitHub repository was created in 2008. The gemspec and README describe it as a
      Ruby library for text classification with Naive Bayes, LSI, logistic regression,
      kNN, TF-IDF, pluggable persistence, and a native C extension.
    - >
      The modern 2.x series refreshed the package in late 2025 and 2026, adding current
      documentation at rubyclassifier.com and a CLI-oriented Homebrew distribution path.
  related-projects:
    - >
      The package relates to RubyGems and RubyDoc as its primary Ruby distribution and
      API documentation surfaces.
    - >
      Its README positions it against older forks by emphasizing additional algorithms,
      incremental LSI, streaming, persistence, and native acceleration.
  sources:
    - https://github.com/cardmagic/classifier#readme
    - https://rubyclassifier.com/docs
    - https://rubygems.org/api/v1/gems/classifier.json
    - https://rubygems.org/api/v1/versions/classifier.json
    - https://api.github.com/repos/cardmagic/classifier
    - https://api.github.com/repos/cardmagic/classifier/releases
    - https://formulae.brew.sh/api/formula/classifier.json
  summary:
    - >
      Ruby Classifier is a Ruby text-classification library and CLI providing Bayesian
      classification, LSI, logistic regression, k-nearest neighbors, TF-IDF
      vectorization, streaming training, persistence, and native LSI acceleration.
  timeline:
    - '2008: GitHub repository created.'
    - '2024: v1.4.4 released in the 1.x line.'
    - '2025: v2.0.0 released.'
    - '2026: v2.6.0 released and packaged by Homebrew as stable.'
  usage:
    - >
      As a Ruby gem, users require classifier classes for Bayes, LSI, logistic
      regression, kNN, and TF-IDF workflows. As a CLI, users can classify text with
      pretrained models, list models, train categories from files, and classify new
      strings.
related-packages:
  - id: cask:claude-code
    reason: >
      Classifier's official README provides a Claude Code plugin that adds
      classification skills and slash commands, making Claude Code a documented host
      workflow for the package.
    rel: adjacent_workflow
    sources:
      - https://github.com/cardmagic/classifier#readme
      - https://code.claude.com/docs/en/plugins
category: data
package-manager:
  brew: classifier
package-manager-url: https://formulae.brew.sh/formula/classifier
license: LGPL-2.1-or-later
tags:
  - bayes
  - cli
  - knn
  - logistic-regression
  - lsi
  - machine-learning
  - ruby
  - text-classification
  - tf-idf
description: Text classification with Bayes, LSI, kNN, Logistic Regression, and TF-IDF
executables:
  - classifier
provenance:
  formula: classifier
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
