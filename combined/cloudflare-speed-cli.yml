id: brew:cloudflare-speed-cli
display-name: cloudflare-speed-cli
homepage: https://github.com/kavehtehrani/cloudflare-speed-cli
repo: https://github.com/kavehtehrani/cloudflare-speed-cli
docs:
  - https://github.com/kavehtehrani/cloudflare-speed-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Cargo, Homebrew tap, MacPorts, Arch Linux, Nix, release
      binaries, and Docker installation paths, showing adoption across Rust, Unix
      package-manager, and container workflows.
  package-nerd-significance:
    - >
      It is interesting to package nerds because the project spans several distribution
      styles at once: crates.io source builds, distro packages, static release archives,
      Homebrew/MacPorts, Nix, and OCI images.
  project-history:
    - >
      The official README positions the tool around Cloudflare speed test results, with
      features including proxy support, TLS trust options, interface binding, an
      interactive TUI, history, and JSON or CSV export.
  related-projects:
    - >
      The README says the tool uses endpoints from speed.cloudflare.com and links
      Cloudflare's explanation of how the speed test works.
  sources:
    - >
      https://github.com/kavehtehrani/cloudflare-speed-cli#readme describes the CLI,
      TUI, output modes, install channels, and Cloudflare speed test source.
    - >
      https://github.com/kavehtehrani/cloudflare-speed-cli/releases lists release
      artifacts for macOS, Windows, and Linux.
    - source_facts.package-manager lists Homebrew, MacPorts, and pacman package names.
  summary:
    - >
      cloudflare-speed-cli is a Rust command-line network speed test client that uses
      Cloudflare's speed test service and can run as a TUI or script-friendly text/JSON
      command.
  timeline:
    - '2026: GitHub releases list v1.0.6 as the latest visible release.'
    - >
      2026: The README documents multiple install channels including Cargo, Homebrew,
      MacPorts, Arch Linux, NixOS, binaries, and Docker.
  usage:
    - >
      Users run cloudflare-speed-cli for the default TUI, use --text for text output,
      and can export results or use headless JSON modes for scripting.
related-packages:
  - id: brew:speedtest-cli
    reason: >
      Choose speedtest-cli when you need the long-established Speedtest.net-based
      workflow; choose cloudflare-speed-cli for Cloudflare endpoints, a TUI, and its
      broader latency and packet-quality diagnostics.
    rel: alternative
    sources:
      - https://github.com/kavehtehrani/cloudflare-speed-cli#readme
      - https://github.com/sivel/speedtest-cli#readme
category: networking
package-manager:
  brew: cloudflare-speed-cli
  macports: cloudflare-speed-cli
  pacman: cloudflare-speed-cli
  scoop: extras/cloudflare-speed-cli
package-manager-url: https://formulae.brew.sh/formula/cloudflare-speed-cli
license: GPL-3.0-only
tags:
  - cli
  - cloudflare
  - network-diagnostics
  - speed-test
  - tui
description: Cloudflare-based speed test with optional TUI
executables:
  - cloudflare-speed-cli
provenance:
  formula: cloudflare-speed-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
