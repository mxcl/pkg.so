id: brew:lbdb
display-name: lbdb
homepage: https://www.spinnaker.de/lbdb/
repo: https://github.com/Rolander/lbdb
docs:
  - https://www.spinnaker.de/lbdb
  - https://www.spinnaker.de/lbdb/manpage-lbdb-fetchaddr.html
  - https://www.spinnaker.de/lbdb/manpage-lbdbq.html
  - https://www.spinnaker.de/lbdb/manpage-mutt_ldap_query.html
config-file-location:
  unix:
    - /usr/local/etc/lbdb.rc
    - $XDG_CONFIG_HOME/lbdb/config
    - ~/.lbdbrc
    - ~/.lbdb/lbdbrc
    - ~/.lbdb/rc
credentials-file-location: null
history:
  adoption-history:
    - >
      lbdb's long package-manager footprint comes from its fit with text-mode mail
      workflows: the input data lists Homebrew, Debian, Fedora, MacPorts, Nix, Ubuntu,
      and openSUSE packaging.
  package-nerd-significance:
    - >
      lbdb is a classic Unix mail add-on: it is small, modular, and oriented around
      composing tools such as Mutt rather than replacing them with a full contact
      manager.
  project-history:
    - >
      The official lbdb page names Thomas Roessler as the initial author and Roland
      Rosenfeld as maintainer. It says the package was inspired by the Emacs Big Brother
      Database package and Brandon Long's external query patch for Mutt, a patch
      incorporated into Mutt starting with Mutt 0.93.
  related-projects:
    - >
      The official page relates lbdb to Mutt, Big Brother Database for Emacs mailers, YP
      maps, finger, LDAP query tooling, and lbdb's own helper commands such as
      lbdb-fetchaddr and mutt_ldap_query.
  sources:
    - https://api.github.com/repos/RolandRosenfeld/lbdb
    - https://github.com/RolandRosenfeld/lbdb
    - https://www.spinnaker.de/lbdb
    - https://www.spinnaker.de/lbdb/manpage-lbdbq.html
  summary:
    - >
      lbdb, the Little Brother's Database, is an address lookup helper associated with
      the Mutt mail reader.
  timeline:
    - 'Mutt 0.93 era: Mutt incorporated the external query patch that helped motivate lbdb.'
    - >
      2017-12-03: The maintainer GitHub repository referenced from the official site was
      created.
    - '2026-01-17: The maintainer GitHub repository metadata showed activity on that date.'
  usage:
    - >
      Users query it with `lbdbq <something>`. The official page says lbdbq invokes
      modules to gather matching person records from sources such as received-mail
      address lists, YP maps, and finger lookups.
related-packages:
  - id: brew:mutt
    reason: >
      Mutt's external address-query interface directly motivated lbdb, which supplies
      address matches while composing mail in Mutt.
    rel: adjacent_workflow
    sources:
      - https://www.spinnaker.de/lbdb/
      - https://www.mutt.org/
  - id: brew:abook
    reason: >
      lbdb's `m_abook` module queries one or more abook files, combining abook's
      editable terminal address book with lbdb's federated lookup.
    rel: adjacent_workflow
    sources:
      - https://www.spinnaker.de/lbdb/
      - https://abook.sourceforge.io/
  - id: brew:khard
    reason: >
      lbdb's `m_khard` module queries CardDAV-backed address books through khard, making
      khard-managed vCards available to lbdb consumers.
    rel: adjacent_workflow
    sources:
      - https://www.spinnaker.de/lbdb/
      - https://khard.readthedocs.io/en/latest/
  - id: brew:mu
    reason: >
      lbdb's `m_mu` module extracts address matches from mu's indexed Maildir, pairing
      fast mail indexing with Mutt-style address completion.
    rel: adjacent_workflow
    sources:
      - https://www.spinnaker.de/lbdb/
      - https://www.djcbsoftware.nl/code/mu/
  - id: brew:notmuch
    reason: >
      lbdb's `m_notmuch_addrlookup` module searches addresses in a Notmuch mail
      database, exposing indexed correspondents through lbdb queries.
    rel: adjacent_workflow
    sources:
      - https://www.spinnaker.de/lbdb/
      - https://notmuchmail.org/
category: productivity
package-manager:
  brew: lbdb
  debian: elpa-lbdb
  dnf: lbdb
  macports: lbdb
  nix: lbdb
  ubuntu: elpa-lbdb
  zypper: lbdb
package-manager-url: https://formulae.brew.sh/formula/lbdb
license: GPL-2.0-or-later
tags:
  - address-book
  - cli
  - contacts
  - email
  - ldap
  - mutt
description: Little brother's database for the mutt mail reader
executables:
  - lbdb-fetchaddr
  - lbdb_dotlock
  - lbdbq
  - mutt_ldap_query
  - nodelist2lbdb
provenance:
  formula: lbdb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
