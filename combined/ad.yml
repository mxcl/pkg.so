id: brew:ad
display-name: ad
homepage: https://github.com/sminez/ad
repo: https://github.com/sminez/ad
docs:
  - https://github.com/sminez/ad#readme
config-file-location:
  unix: ~/.ad/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is available through Homebrew and Nix according to the supplied
      package-manager facts, but the README warns that user-facing documentation is
      limited and that the editor is not yet recommended as a primary editor.
  package-nerd-significance:
    - >
      `ad` is interesting to package maintainers as a compact Rust editor with
      nontrivial runtime data files. Packaging is less about a single binary and more
      about whether default dotfiles and helper directories are installed or generated
      cleanly.
  project-history:
    - >
      The README presents `ad` as a personal, experimental editor rather than a polished
      replacement for Vim, Kakoune, or Emacs. Its design centers on text that can be
      executed as well as edited, a filesystem interface inspired by Acme, and
      command-language ideas from Sam.
    - >
      The GitHub repository was created in 2023 and is developed on the `develop`
      branch. Its setup task creates a `~/.ad` dotfile directory and copies default
      configuration, plumbing rules, helper scripts, libraries, colorschemes, and syntax
      data.
  related-projects:
    - >
      The README explicitly cites vi, Neovim, Kakoune, Acme, Sam, Plan 9, Tree-sitter,
      LSP, and the author's extracted `structex` crate as influences or related
      components.
  sources:
    - https://api.github.com/repos/sminez/ad
    - https://github.com/sminez/ad#readme
    - https://raw.githubusercontent.com/sminez/ad/develop/xtask/src/setup.rs
  summary:
    - >
      `ad` is an adaptable Rust text editor that combines modal editing ideas from vi
      and Kakoune with Plan 9 Acme-style external-tool integration.
  timeline:
    - '2023: GitHub repository `sminez/ad` was created.'
    - '2023: README documented `ad` as an Acme, Sam, vi, and Kakoune-inspired adaptable editor.'
    - >
      2026: Repository metadata shows active development and Homebrew/Nix package
      availability is present in the supplied facts.
  usage:
    - >
      Users install or build `ad`, run `cargo xtask setup-dotfiles` for the default
      dotfiles, and then use the editor's built-in `:help` command. The tool is aimed at
      users who want a small hackable editor with external-program integration.
related-packages:
  - id: brew:kakoune
    reason: >
      Choose Kakoune for a mature selection-first modal editor with documented
      configuration and a broader packaged ecosystem; choose ad to experiment with
      Acme-style executable text and external-tool integration.
    rel: alternative
    sources:
      - https://github.com/sminez/ad#readme
      - https://kakoune.org/
      - https://github.com/mawww/kakoune#readme
category: productivity
package-manager:
  brew: ad
  nix: ad
package-manager-url: https://formulae.brew.sh/formula/ad
license: MIT
tags:
  - 9p
  - acme
  - cli
  - kakoune
  - plan9
  - rust
  - text-editor
  - vi
description: Adaptable text editor inspired by vi, kakoune, and acme
executables:
  - ad
provenance:
  formula: ad
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
