id: brew:changelogen
display-name: changelogen
homepage: https://github.com/unjs/changelogen
repo: https://github.com/unjs/changelogen
docs:
  - https://github.com/unjs/changelogen#readme
  - https://unjs.io/packages/changelogen
config-file-location:
  unix:
    - ./changelog.config.json
    - ./changelog.config.ts
    - ./changelog.config.js
    - ./changelog.config.mjs
    - ./changelog.config.cjs
    - ./.changelogrc
    - ./package.json#changelog
credentials-file-location:
  unix:
    - ./.env
    - ~/.changlogenrc
history:
  adoption-history:
    - >
      changelogen is distributed through npm and can be run directly with npx. The input
      package facts also identify Homebrew and Nix packaging, making it available both
      to JavaScript projects and to users who prefer system package managers.
  package-nerd-significance:
    - >
      changelogen is package-nerd significant as a focused Conventional Commits
      automation tool from the UNJS ecosystem. It ties together semver bumping,
      changelog generation, npm publishing, GitHub release notes, c12 config loading,
      and package-manager distribution in one small CLI.
  project-history:
    - >
      The npm package and GitHub repository were created in May 2022. The README centers
      the project on Conventional Commits and exposes the common npx changelogen@latest
      workflow.
    - >
      GitHub releases show the v0.5 line beginning in 2023 and v0.6 releases in 2025.
      The npm registry records 0.6.2 in the queried release metadata.
  related-projects:
    - Conventional Commits provides the commit-message convention changelogen parses.
    - unjs/c12 is the configuration loader documented by the README.
    - GitHub CLI authentication can be used by changelogen gh release.
  sources:
    - https://github.com/unjs/changelogen#readme
    - https://unjs.io/packages/changelogen
    - https://github.com/unjs/changelogen/releases
    - https://api.github.com/repos/unjs/changelogen
    - https://registry.npmjs.org/changelogen
  summary:
    - >
      changelogen is a UNJS release tool that generates Markdown changelogs from
      Conventional Commits. It can also bump package versions, update CHANGELOG.md,
      create git commits and tags, publish to npm, and sync GitHub releases.
  timeline:
    - '2022: npm package and GitHub repository created.'
    - '2023: v0.5.0 published on GitHub releases.'
    - '2025: v0.6.2 published and recorded in the npm registry.'
  usage:
    - >
      The README documents console changelog generation, --bump for package.json and
      CHANGELOG.md updates, --release for commit and tag creation, gh release for GitHub
      release synchronization, and --publish for npm publishing. Configuration is loaded
      through c12 from changelog.config files, .changelogrc, or the changelog field in
      package.json.
related-packages:
  - id: brew:changie
    reason: >
      Choose Changie when contributors should create explicit YAML change fragments as
      work is completed; changelogen instead derives release notes primarily from
      Conventional Commit history.
    rel: alternative
    sources:
      - https://unjs.io/packages/changelogen/
      - https://changie.dev/guide/
  - id: brew:gh
    reason: >
      GitHub CLI complements changelogen's GitHub Release synchronization because
      changelogen can reuse the token established by `gh auth login`.
    rel: adjacent_workflow
    sources:
      - https://unjs.io/packages/changelogen/
      - https://cli.github.com/manual/gh_auth_login
category: developer-tools
package-manager:
  brew: changelogen
  nix: changelogen
package-manager-url: https://formulae.brew.sh/formula/changelogen
license: MIT
tags:
  - changelog
  - cli
  - conventional-commits
  - github-releases
  - release-automation
  - typescript
  - versioning
description: Generate Beautiful Changelogs using Conventional Commits
executables:
  - changelogen
provenance:
  formula: changelogen
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
