id: brew:dalfox
display-name: Dalfox
homepage: https://dalfox.hahwul.com
repo: https://github.com/hahwul/dalfox
docs:
  - https://dalfox.hahwul.com/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/dalfox/config.toml
    - ~/.config/dalfox/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Dalfox became package-manager friendly because it ships as a single CLI and
      documents installation through Homebrew, Snap, Nix, cargo, Arch AUR, prebuilt
      binaries, and source builds. Its official pages emphasize fitting into existing
      recon stacks instead of requiring a heavy scanner platform.
  package-nerd-significance:
    - >
      For package maintainers, Dalfox is a modern security CLI with a clean
      single-binary distribution story and a visible language/runtime transition from Go
      v2 to Rust v3, making it a useful example of how security tools move across
      ecosystems while keeping package channels alive.
  project-history:
    - >
      The project identifies itself as Dalfox, combining the Korean word for moon with
      'Fox', and its older Go-era README described it as a successor-style rewrite after
      XSpear. Current official documentation presents v3 as a Rust rewrite while
      preserving the Go v2 branch for security backports.
  related-projects:
    - >
      Dalfox's own history points back to XSpear as prior XSS tooling by the same
      author, and its package ecosystem sits beside proxy/recon tools such as Caido,
      Burp-style raw request workflows, and CI code-scanning consumers of SARIF.
  sources:
    - https://dalfox.hahwul.com/
    - https://dalfox.hahwul.com/getting-started/
    - https://dalfox.hahwul.com/getting-started/installation/
    - https://dalfox.hahwul.com/getting-started/configuration/
    - https://github.com/hahwul/dalfox
    - https://www.hahwul.com/blog/2025/dalfox_2_12_released/
  summary:
    - >
      Dalfox is an open-source XSS scanner and security automation CLI built around
      parameter discovery, context-aware payload generation, and verified reporting
      formats useful in bug bounty and DevSecOps workflows.
  timeline:
    - '2020: Go module metadata records a stable v1-era Dalfox release.'
    - >
      2025: Official release notes documented expanded server, report, and raw request
      workflow support in the v2 line.
    - '2026: Official docs present Dalfox v3.1.2 and a Rust-based v3 line.'
  usage:
    - >
      Typical use is to scan a single URL, a file of URLs, raw HTTP input, or piped
      crawler output, then export findings as plain text, JSON, JSONL, Markdown, SARIF,
      TOML, or through REST and MCP server modes.
related-packages:
  - id: cask:caido
    reason: >
      Use Caido with Dalfox when you want XSS scans launched from Caido Active Workflows
      and returned as findings during interactive proxy testing.
    rel: adjacent_workflow
    sources:
      - https://dalfox.hahwul.com/integrations/caido/
      - https://docs.caido.io/
category: security
package-manager:
  brew: dalfox
  macports: dalfox
  nix: dalfox
package-manager-url: https://formulae.brew.sh/formula/dalfox
license: MIT
tags:
  - automation
  - cli
  - vulnerability-scanning
  - web-security
  - xss-scanner
description: XSS scanner and utility focused on automation
executables:
  - dalfox
provenance:
  formula: dalfox
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
