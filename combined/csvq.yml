id: brew:csvq
display-name: csvq
homepage: https://mithrandie.github.io/csvq
repo: https://github.com/mithrandie/csvq
docs:
  - https://mithrandie.github.io/csvq
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/csvq/csvq_env.json
    - ~/.config/csvq/csvq_env.json
    - ~/.csvq_env.json
    - ~/.csvq/csvq_env.json
    - ./csvq_env.json
    - $XDG_CONFIG_HOME/csvq/csvqrc
    - ~/.config/csvq/csvqrc
    - ~/.csvqrc
    - ~/.csvq/csvqrc
    - ./csvqrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents installation by release archive, Go install, Ubuntu
      PPA, Arch AUR packages, and Homebrew. That spread reflects csvq's role as a
      portable single-binary data tool rather than a library that must be embedded into
      an application.
  package-nerd-significance:
    - >
      For package users, csvq occupies the SQL-on-flat-files niche: more expressive than
      simple cut/filter tools, lighter to install than a database, and useful in scripts
      when CSV, TSV, fixed-width, JSON, or JSON Lines files need ad hoc querying.
  project-history:
    - >
      The official changelog marks version 1.0.0, released on September 19, 2017, as the
      first general release. Subsequent releases expanded the language and format
      surface, including analytic-function behavior, Go modules, JSON support,
      fixed-length input, JSON Lines output, and later Go 1.18 dependency updates.
  related-projects:
    - >
      The README links csvq-driver for executing csvq statements in Go and a csvq Emacs
      extension, showing a small ecosystem around the command language.
  sources:
    - https://mithrandie.github.io/csvq
    - https://github.com/mithrandie/csvq#readme
    - https://github.com/mithrandie/csvq/blob/master/CHANGELOG.md
    - https://github.com/mithrandie/csvq/releases
  summary:
    - >
      csvq is a Go command-line tool that brings a SQL-like query language to CSV and
      related text formats. It supports reading, updating, deleting, transactions,
      procedures, an interactive shell, and exports to formats such as JSON and text
      tables.
  timeline:
    - '2017: Version 1.0.0 first general release.'
    - >
      2018: Version 1.3.0 enhanced JSON support; version 1.5.0 added fixed-length format
      support.
    - '2022: Version 1.16.0 added JSON Lines and BOX export formats.'
    - '2023: Version 1.18.x updated dependencies and required Go 1.18 or later.'
  usage:
    - >
      csvq is aimed at one-time queries and routine processing over data sizes that fit
      in memory and are comparable to spreadsheet workloads. The README explicitly warns
      that it is not optimized for very large data because query execution keeps data in
      memory and does not use indexes or query planning.
related-packages:
  - id: brew:trdsql
    reason: >
      Choose trdsql when you want SQL over CSV and other text formats but need
      selectable SQLite, PostgreSQL, or MySQL execution semantics and a broader
      format-conversion surface.
    rel: alternative
    sources:
      - https://mithrandie.github.io/csvq
      - https://github.com/noborus/trdsql#readme
category: data
package-manager:
  apk: csvq
  brew: csvq
  nix: csvq
package-manager-url: https://formulae.brew.sh/formula/csvq
license: MIT
tags:
  - cli
  - csv
  - data
  - query-language
  - sql
description: SQL-like query language for csv
executables:
  - csvq
provenance:
  formula: csvq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
