id: brew:cargo-clone
display-name: cargo-clone
homepage: https://github.com/JanLikar/cargo-clone
repo: https://github.com/JanLikar/cargo-clone
docs:
  - https://github.com/JanLikar/cargo-clone#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cargo-clone is a niche utility rather than a broad platform component. Its
      adoption is visible through crates.io publication and packaging in Homebrew, Nix,
      and pacman, mostly serving developers who inspect crate contents or reproduce
      package sources.
  package-nerd-significance:
    - >
      The tool matters to package nerds because it distinguishes registry source from
      repository source. That distinction is central to auditing Rust packages: the code
      published to crates.io is the artifact Cargo actually builds.
  project-history:
    - >
      The GitHub repository was created in January 2016, early in Cargo's third-party
      subcommand culture. The README positions cargo-clone as a way to fetch Rust crate
      source from a registry and, optionally, clone the upstream git repository recorded
      in crate metadata.
  related-projects:
    - >
      Cargo provides the external subcommand mechanism that lets `cargo clone` dispatch
      to cargo-clone.
    - crates.io is the registry source that cargo-clone queries and downloads from.
    - git is used when users choose the README-documented `--git` path.
  sources:
    - https://api.github.com/repos/JanLikar/cargo-clone
    - https://crates.io/api/v1/crates/cargo-clone
    - https://github.com/JanLikar/cargo-clone#readme
  summary:
    - >
      cargo-clone is a small Cargo subcommand that downloads the source code of crates
      from a registry. It fills a simple inspection gap: getting a crate's packaged
      source without manually navigating registry storage or repository metadata.
  timeline:
    - '2016: GitHub repository created.'
    - '2016: First crates.io publication recorded for cargo-clone.'
    - >
      2025: crates.io metadata shows continued updates, with version 1.2.4 current by
      the sampled registry data.
  usage:
    - >
      Users run commands such as `cargo clone serde` or append a version requirement
      such as `cargo clone cargo-clone@1.0.0`. With `--git`, the tool uses the
      repository URL from crate metadata and delegates to git clone.
related-packages: []
category: developer-tools
package-manager:
  brew: cargo-clone
  nix: cargo-clone
  pacman: cargo-clone
package-manager-url: https://formulae.brew.sh/formula/cargo-clone
license: Apache-2.0 OR MIT
tags:
  - cargo
  - cargo-subcommand
  - cli
  - crate-source
  - rust
  - source-fetching
description: Cargo subcommand to fetch the source code of a Rust crate
executables:
  - cargo-clone
provenance:
  formula: cargo-clone
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
