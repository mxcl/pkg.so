id: brew:mbw
display-name: MBW
homepage: https://github.com/raas/mbw/
repo: https://github.com/raas/mbw
docs:
  - https://github.com/raas/mbw#readme
  - https://github.com/raas/mbw/blob/master/mbw.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records MBW packages for Homebrew, Debian, and
      Ubuntu. This modest cross-platform distribution suits a small benchmark intended
      for quick local checks rather than a comprehensive profiling suite.
  package-nerd-significance:
    - >
      MBW appeals to package users because it is easy to build, easy to audit, and quick
      to invoke when a full benchmark suite would be excessive.
  project-history:
    - >
      The upstream manpage is dated April 2006, while the GitHub repository was imported
      in March 2012. The repository has maintained a small tagged release series through
      v2.0, reflecting the project's long-lived, single-purpose design.
  related-projects:
    - >
      MBW occupies the same package niche as small memory and system benchmarks such as
      STREAM and lmbench, while remaining focused on copy throughput.
  sources:
    - https://github.com/raas/mbw#readme
    - https://github.com/raas/mbw/blob/master/mbw.1
    - https://github.com/raas/mbw/tags
    - source_facts.package-manager
  summary:
    - >
      MBW is a compact command-line memory bandwidth benchmark. It times copies between
      large in-memory arrays to provide a quick estimate of available memory throughput.
  timeline:
    - "2006: The upstream manpage documents MBW's benchmark interface."
    - '2012: The code is imported into the public GitHub repository and v1.2 is tagged.'
    - '2022: v1.5 is tagged.'
    - '2023: v2.0 is tagged.'
  usage:
    - >
      Users give mbw an array size in MiB and may select tests for memcpy, a simple
      element-by-element copy, or arbitrary-block copies. The manpage advises avoiding
      paging and busy systems so the reported throughput better represents memory
      copying.
related-packages: []
category: system
package-manager:
  brew: mbw
  debian: mbw
  ubuntu: mbw
