license: GPL-3.0-or-later
tags:
  - bandwidth
  - benchmark
  - cli
  - memory
  - performance
description: Memory Bandwidth Benchmark
executables:
  - mbw
provenance:
  formula: mbw
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
