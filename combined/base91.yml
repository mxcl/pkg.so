id: brew:base91
display-name: basE91
homepage: https://base91.sourceforge.net/
repo: https://sourceforge.net/projects/base91
docs:
  - https://base91.sourceforge.net/
  - https://sourceforge.net/projects/base91
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      basE91 remains niche, but the input package metadata lists Homebrew, MacPorts, and
      Nix packaging, and the SourceForge project records tens of thousands of file
      downloads over its lifetime. Its adoption is mostly among developers who
      specifically need denser ASCII armoring than Base64 rather than users of
      general-purpose OS tooling.
    - >
      The project page classifies it under data formats, terminals, email, algorithms,
      and internet topics, reflecting the encoding's intended transport and storage use
      cases.
  package-nerd-significance:
    - >
      basE91 is significant as one of the better-known post-Base64 ASCII-armoring
      experiments. It trades simplicity and universal support for denser output, which
      makes it a useful reference point in discussions of binary-to-text encoding
      efficiency.
    - >
      Its package-manager presence is also a classic long-tail case: a 2006 SourceForge
      utility still appears in modern package indexes because encoding tools age slowly
      when their formats are stable.
  project-history:
    - >
      The SourceForge project page describes basE91 as an advanced method for encoding
      binary data as ASCII characters, similar to uuencode or Base64 but more efficient.
      It reports overhead of at most 23 percent and as low as 14 percent depending on
      input.
    - >
      The SourceForge files page identifies the latest 0.6.0 Java archive release in
      November 2006, and the project page shows project activity dating to October 2006.
      The project's official website remains base91.sourceforge.net.
  related-projects:
    - >
      Base64 and uuencode are the official comparison points named by the SourceForge
      description.
    - >
      Other ASCII-armoring and binary-to-text encodings, including Ascii85/Base85, are
      conceptually adjacent even though they are separate formats.
    - SourceForge hosts the original project site and release files for basE91.
  sources:
    - https://base91.sourceforge.net/
    - https://sourceforge.net/projects/base91
    - https://sourceforge.net/projects/base91/files/
    - source_facts.package-manager
  summary:
    - >
      basE91 is a binary-to-text encoding method and command-line tool that encodes
      binary data as ASCII characters with less overhead than Base64 for many inputs.
  timeline:
    - '2006: SourceForge project activity and project metadata date basE91 to October 2006.'
    - '2006: Latest SourceForge release path records version 0.6.0 in November 2006.'
    - >
      2020s: Input package metadata shows basE91 available through Homebrew, MacPorts,
      and Nix.
  usage:
    - >
      The packaged CLI exposes base91 plus b91enc and b91dec executables according to
      the Homebrew input metadata. It is used as an encoder/decoder filter for files or
      streams where ASCII-safe text output is required.
    - >
      There is no documented configuration file or credentials store; the tool is a
      stateless encoder/decoder.
related-packages:
  - id: brew:base64
    reason: >
      Choose Base64 for maximum protocol and tooling compatibility; choose basE91 when
      reduced ASCII encoding overhead justifies a less common format.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/base91/
      - https://www.fourmilab.ch/webtools/base64/
  - id: brew:base16384
    reason: >
      Choose base16384 for a denser Unicode-based representation when UTF-16BE transport
      is acceptable, while basE91 remains ASCII-oriented.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/base91/
      - https://github.com/fumiama/base16384#readme
