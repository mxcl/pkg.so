id: brew:infracost
display-name: Infracost
homepage: https://www.infracost.io/docs/
repo: https://github.com/infracost/cli
docs:
  - https://www.infracost.io/docs
config-file-location:
  unix:
    - infracost.yml
    - infracost.yml.tmpl
  windows:
    - infracost.yml
    - infracost.yml.tmpl
credentials-file-location: null
history:
  adoption-history:
    - >
      Infracost adoption followed infrastructure-as-code review habits: developers run
      it locally, CI systems post cost changes to pull requests, and teams discuss cost
      before merging. In 2023, Infracost made its GitHub App integration free,
      emphasizing broad PR coverage and simpler setup across many repositories.
    - >
      Package-manager availability matters because the tool is usually installed on
      developer laptops, CI runners, and automation images rather than deployed as a
      long-lived server.
  package-nerd-significance:
    - >
      Infracost is significant in package-manager culture because it turns cloud billing
      into a local lint-like developer concern. Installing it with Homebrew puts a
      FinOps check beside formatters, linters, Terraform, and cloud CLIs.
    - >
      It also marks a shift in infrastructure tooling from deployment-only commands to
      pre-merge economic analysis, a small executable sitting in the path between IaC
      authors and cloud invoices.
  project-history:
    - >
      Infracost's early public explanation framed the project as a response to
      cloud-pricing complexity and tools that surfaced cost too late in the delivery
      process. The August 2020 launch post described a CLI for bringing cost visibility
      into development and operations workflows, initially around AWS and Terraform.
    - >
      The project expanded from a standalone open source CLI into a broader FinOps
      workflow around pull requests, CI/CD, editor integrations, and Infracost Cloud.
      Its README describes the CLI as the core engine for Terraform, Terragrunt, and
      CloudFormation cost analysis.
  related-projects:
    - >
      Related projects and surfaces include Terraform, Terragrunt, CloudFormation,
      Infracost Cloud, Infracost GitHub App, Infracost GitHub Actions, editor
      extensions, and cloud-pricing APIs.
  sources:
    - https://github.com/infracost/cli
    - https://github.com/infracost/cli/releases
    - https://www.infracost.io/docs
    - https://www.infracost.io/resources/blog/infracost-cloud-costs-for-devs
    - https://www.infracost.io/resources/blog/mar-2023-update
  summary:
    - >
      Infracost is a cloud-cost estimation CLI for infrastructure as code, built to show
      engineers cost impact before infrastructure changes are deployed.
  timeline:
    - >
      2020: Infracost was introduced publicly as a CLI for cloud cost estimates from
      infrastructure as code.
    - >
      2020: Initial support focused on AWS and Terraform, with Google Cloud support
      added later that year.
    - >
      2023: Infracost made its GitHub App integration free and tied the update to CLI
      v0.10.18.
    - >
      2026: The GitHub release stream for the CLI included 2.x releases, reflecting
      continued packaging of the standalone executable.
  usage:
    - >
      Users run the `infracost` CLI against IaC directories to estimate cost, compare
      diffs, or scan projects. The tool pairs naturally with Terraform and Terragrunt
      workflows, where cost feedback in a pull request can change a resource choice
      before it reaches production.
    - >
      The CLI has authentication flows and SaaS integrations, but the package itself is
      best understood as a developer and CI executable. The input data is infrastructure
      code; the output is a cost breakdown, policy signal, or PR comment.
related-packages:
  - id: brew:terragrunt
    reason: >
      Terragrunt organizes reusable Terraform-compatible stacks, and Infracost
      explicitly analyzes Terragrunt projects to add cost feedback to that workflow.
    rel: adjacent_workflow
    sources:
      - https://www.infracost.io/docs/features/terragrunt/
      - https://terragrunt.gruntwork.io/docs/
category: cloud-infrastructure
package-manager:
  brew: infracost
  chocolatey: infracost
  macports: infracost
  nix: infracost
  scoop: main/infracost
  winget: Infracost.Infracost
package-manager-url: https://formulae.brew.sh/formula/infracost
license: Apache-2.0
