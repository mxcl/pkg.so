id: brew:conan
display-name: Conan
homepage: https://conan.io
repo: https://github.com/conan-io/conan
docs:
  - https://docs.conan.io/
config-file-location:
  unix:
    - ~/.conan2/global.conf
    - ~/.conan2/profiles/default
    - ~/.conan2/remotes.json
credentials-file-location:
  unix:
    - ~/.conan2/credentials.json
    - ~/.conan2/source_credentials.json
history:
  adoption-history:
    - >
      Conan became important in C and C++ packaging because it addressed binary
      compatibility, cross-building, and private package hosting in ecosystems that
      historically relied on system package managers, vendored dependencies, or
      build-system-specific fetch logic. The official README highlights production use,
      integration with Artifactory, and a large community around GitHub, Slack,
      ConanCenter, and earlier Bintray-era repositories.
  package-nerd-significance:
    - >
      For package-manager watchers, Conan is one of the major language-adjacent package
      managers for native code: it is decentralized, recipe-driven, binary-aware,
      CI-friendly, and intentionally independent of any single compiler or build system.
  project-history:
    - >
      The Conan repository was created in 2015 and reached a 1.0 release in January
      2018. Its 2.0 release followed in February 2023, marking the current major
      generation of the client and documentation while Conan 1.x remained documented
      separately as a legacy line.
  related-projects:
    - >
      Conan is commonly discussed alongside CMake, Meson, MSBuild, vcpkg, Artifactory,
      and ConanCenter because those are the build, binary-hosting, and package-index
      surfaces that shape day-to-day use.
  sources:
    - https://github.com/conan-io/conan
    - https://github.com/conan-io/conan/releases/tag/1.0.0
    - https://github.com/conan-io/conan/releases/tag/2.0.0
    - https://docs.conan.io/2/
    - https://docs.conan.io/2/reference/config_files/global_conf.html
    - https://docs.conan.io/2/reference/config_files/credentials.html
    - https://docs.conan.io/2/reference/config_files/source_credentials.html
  summary:
    - >
      Conan is a decentralized, open-source package manager for C and C++ developers,
      designed to manage source recipes and binary packages across operating systems,
      compilers, architectures, build systems, and private or public remotes.
  timeline:
    - '2015: Official GitHub repository created.'
    - '2018: Conan 1.0.0 released.'
    - '2023: Conan 2.0.0 released.'
  usage:
    - >
      Typical Conan workflows install dependencies from a conanfile, generate
      toolchain/build-system files, build or consume binary packages, and authenticate
      to remotes. Conan 2 stores user-level configuration under the Conan home,
      including global.conf, profiles, remotes.json, credentials.json, and
      source_credentials.json.
related-packages:
  - id: brew:cmake
    reason: >
      Use CMake with Conan when you want Conan to resolve C or C++ dependencies and
      generate CMake dependency and toolchain files for the project build.
    rel: adjacent_workflow
    sources:
      - https://docs.conan.io/2/integrations/cmake.html
      - https://cmake.org/cmake/help/latest/
  - id: brew:vcpkg
    reason: >
      Choose vcpkg as an alternative when you prefer Microsoft's manifest, registry,
      triplet, and binary-caching workflow for C and C++ libraries instead of Conan's
      recipe-and-remote model.
    rel: alternative
    sources:
      - https://learn.microsoft.com/en-us/vcpkg/
      - https://docs.conan.io/2/introduction.html
category: developer-tools
package-manager:
  brew: conan
  chocolatey: conan
  dnf: conan
  nix: conan
  scoop: main/conan
  winget: JFrog.Conan
  zypper: conan
package-manager-url: https://formulae.brew.sh/formula/conan
license: MIT
tags:
  - build-systems
  - c
  - cli
  - cpp
  - dependency-manager
  - package-manager
  - python
description: Distributed, open source, package manager for C/C++
executables:
  - conan
provenance:
  formula: conan
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
