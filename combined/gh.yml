id: brew:gh
display-name: GitHub CLI
homepage: https://cli.github.com/
repo: https://github.com/cli/cli
docs:
  - https://docs.github.com/en/github-cli/github-cli/about-github-cli
  - https://cli.github.com/manual/gh
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/gh/config.yml
    - ~/.config/gh/config.yml
  windows: '%AppData%\GitHub CLI\config.yml'
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/gh/hosts.yml
    - ~/.config/gh/hosts.yml
  windows: '%AppData%\GitHub CLI\hosts.yml'
history:
  adoption-history:
    - >
      GitHub CLI has broad adoption because it is distributed through GitHub's own
      package repositories and release binaries, package managers such as Homebrew and
      WinGet, and GitHub-hosted Actions runner images. Its first-party status made it a
      standard automation interface for GitHub workflows in shells and CI jobs.
  package-nerd-significance:
    - >
      For package and automation ecosystems, `gh` is important because it gives GitHub
      an official, versioned executable surface. Package maintainers can depend on
      consistent commands across macOS, Linux, and Windows, while CI authors can use a
      preinstalled or easily installed binary instead of hand-rolling API calls.
  project-history:
    - >
      GitHub created the cli/cli repository in October 2019 and opened the project as a
      new official CLI distinct from the older community `hub` tool. GitHub announced
      the beta in February 2020 and released GitHub CLI 1.0 in September 2020.
    - >
      The README frames `gh` as a standalone tool that brings GitHub concepts next to
      `git` and source code work. The project grew into a cross-platform Go CLI with
      first-party manuals, release binaries, package repositories, GitHub Enterprise
      support, extension support, API helpers, and later supply-chain features such as
      build provenance attestations for release artifacts.
  related-projects:
    - >
      The README compares GitHub CLI with `hub`, noting that `hub` behaves as a proxy to
      `git` while `gh` is a standalone tool for GitHub workflows.
  sources:
    - https://api.github.com/repos/cli/cli
    - https://api.github.com/repos/cli/cli/releases
    - https://cli.github.com/manual/gh
    - https://docs.github.com/en/github-cli/github-cli/about-github-cli
    - https://formulae.brew.sh/formula/gh
    - >
      https://github.blog/2020-02-12-supercharge-your-command-line-experience-github-cli-is-now-in-beta/
    - https://github.blog/2020-09-17-github-cli-1-0-is-now-available/
    - https://github.com/cli/cli
    - https://raw.githubusercontent.com/cli/cli/trunk/README.md
  summary:
    - >
      GitHub CLI, invoked as `gh`, is GitHub's official command-line tool for working
      with pull requests, issues, repositories, releases, Actions, authentication, and
      GitHub API data from a terminal.
  timeline:
    - '2019: The cli/cli repository was created.'
    - '2020: GitHub announced GitHub CLI beta.'
    - '2020: GitHub CLI 1.0.0 was published.'
    - >
      2024: The README records release build provenance attestations beginning with
      version 2.50.0.
  usage:
    - >
      Practitioners use `gh` to create and review pull requests, triage issues, clone
      and browse repositories, trigger or inspect Actions workflows, manage releases and
      gists, authenticate to GitHub hosts, call the GitHub API, and script repository
      operations without leaving the command line.
related-packages:
  - id: brew:hub
    reason: >
      Choose `hub` when you want GitHub features expressed as extensions to familiar Git
      commands; choose `gh` for GitHub's first-party standalone command hierarchy and
      broader platform workflow coverage.
    rel: alternative
    sources:
      - https://github.com/cli/cli#github-cli
      - https://github.com/mislav/hub#readme
category: developer-tools
package-manager:
  brew: gh
  chocolatey: gh
  debian: gh
  dnf: gh
  macports: gh
  nix: gh
  scoop: main/gh
  ubuntu: gh
  winget: GitHub.cli
  zypper: gh
package-manager-url: https://formulae.brew.sh/formula/gh
license: MIT
tags:
  - automation
  - cli
  - developer-tools
  - git
  - github
description: GitHub command-line tool
executables:
  - gh
provenance:
  formula: gh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
