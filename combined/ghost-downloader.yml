display-name: Ghost Downloader
homepage: https://gd.xychr.com/
repo: https://github.com/XiaoYouChR/Ghost-Downloader-3
docs:
  - https://github.com/XiaoYouChR/Ghost-Downloader-3#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project grew as an open-source cross-platform downloader and is distributed
      for Windows, macOS, Linux, and Android. Its repository also notes community
      packaging in the Arch User Repository, while official GitHub releases provide
      platform-specific installers and portable artifacts.
  package-nerd-significance:
    - >
      Ghost Downloader is interesting to package maintainers because it combines a
      Python/PySide desktop interface with multiple protocol engines and external
      runtimes, then ships native installers across desktop and mobile platforms. Its
      Homebrew cask and community AUR packages illustrate the split between upstream
      release artifacts and downstream package-manager integration.
  project-history:
    - >
      Ghost Downloader is an open-source download manager created by XiaoYouChR. The
      maintainer describes it as a first Python project originally built to help a
      Bilibili creator integrate downloadable resources.
    - >
      The application developed into a multi-protocol desktop and Android downloader
      with intelligent HTTP chunking, streaming-media support, BitTorrent and magnet
      handling, browser integration, and an aria2-compatible RPC interface. Current
      releases use a shared business engine across supported platforms.
  related-projects:
    - yt-dlp supplies media extraction capabilities used by the project.
    - N_m3u8DL-RE powers parts of its segmented-stream workflow.
    - >
      A companion browser extension can detect media and hand downloads to the desktop
      application.
    - Its RPC interface is designed for compatibility with aria2 clients.
  sources:
    - 'Official releases: https://github.com/XiaoYouChR/Ghost-Downloader-3/releases'
    - 'Official repository and README: https://github.com/XiaoYouChR/Ghost-Downloader-3'
    - source_facts.description
    - source_facts.source-archive
  summary:
    - >
      Ghost Downloader is a GPL-licensed, cross-platform, multithreaded download
      manager. It handles ordinary files and several specialized protocols while
      integrating with browsers and media-download tooling.
  timeline:
    - '2023: The public GitHub repository was established.'
    - '2024: Upstream copyright history begins in the current project documentation.'
    - '2026: The project shipped 4.x releases for Windows, macOS, Linux, and Android.'
  usage:
    - >
      Users employ Ghost Downloader for segmented HTTP transfers, resumable downloads,
      BitTorrent and magnet links, FTP, adaptive-stream downloads, and supported video
      sites. Its browser extension can capture resources and forward tasks to the
      desktop service, while an aria2-compatible RPC endpoint permits third-party task
      submission.
    - >
      Some media workflows depend on bundled or detected auxiliary runtimes. Users
      should review release notes and security advisories when enabling local
      integration services such as browser control or RPC.
