id: brew:desk
display-name: desk
homepage: https://github.com/jamesob/desk
repo: https://github.com/jamesob/desk
docs:
  - https://github.com/jamesob/desk#readme
config-file-location:
  unix:
    - ~/.desk
    - ~/.desk/desks/*.sh
    - ./Deskfile
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documented Homebrew installation, direct curl installation, git
      installation, shell completions for bash, zsh, and fish, and zsh plugin-manager
      integration through tools such as oh-my-zsh, Antigen, and zgen. That made it easy
      to adopt in dotfile-heavy developer environments.
  package-nerd-significance:
    - >
      desk is package-nerd interesting because it is intentionally small shell
      infrastructure: it competes more with dotfiles, aliases, and shell plugin managers
      than with large workspace systems, and packages as a single command with no
      dependency beyond bash.
  project-history:
    - >
      desk's first GitHub release was v0.1.0 in October 2015. The README frames it as
      deliberately simple: a shell script that sources another shell script in a new
      shell, but with enough structure to document aliases, functions, environment
      variables, and project directories.
  related-projects:
    - The README names godesk as a related fuzzy-filtering launcher for desk.
  sources:
    - https://github.com/jamesob/desk#readme
    - https://github.com/jamesob/desk/releases/tag/v0.1.0
    - https://github.com/jamesob/desk/releases/tag/v0.6.0
  summary:
    - >
      desk is a lightweight workspace manager for shells. It associates a named project
      context with a shell script, then starts a shell where that context has been
      loaded.
  timeline:
    - '2015: v0.1.0 initial release.'
    - '2015: v0.4.0 added formatting and desk run work.'
    - '2016: v0.5.0 added Deskfile work and fish fixes.'
    - '2016: v0.6.0 changed shell startup to use exec.'
  usage:
    - >
      Users create deskfiles under ~/.desk/desks or add a Deskfile to a project
      directory, then run desk commands to activate, list, edit, or run commands inside
      those environments. Deskfiles are normal shell scripts with comments used as
      descriptions and inline command documentation.
related-packages:
  - id: brew:direnv
    reason: >
      Choose direnv when the main requirement is automatically loading and unloading
      project environment variables on directory changes; choose desk when you want
      explicit named workspaces that can also change directory and define aliases,
      functions, and commands.
    rel: alternative
    sources:
      - https://github.com/jamesob/desk#readme
      - https://github.com/direnv/direnv#readme
category: developer-tools
package-manager:
  brew: desk
package-manager-url: https://formulae.brew.sh/formula/desk
license: MIT
tags:
  - cli
  - developer-productivity
  - shell
  - workspace-manager
description: Lightweight workspace manager for the shell
executables:
  - desk
provenance:
  formula: desk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
