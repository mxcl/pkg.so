id: brew:nasm
display-name: NASM
homepage: https://www.nasm.us/
repo: https://github.com/netwide-assembler/nasm
docs:
  - https://www.nasm.us/docs.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      NASM is packaged almost everywhere: Homebrew input data lists Alpine, Debian,
      Fedora, MacPorts, Nix, pacman, Scoop, Ubuntu, winget, and zypper package names.
      Homebrew's formula JSON generated on 2026-07-01 reported 93,847 installs over 365
      days and 35,027 installs-on-request over 365 days, making it the dominant package
      in this batch by Homebrew adoption.
    - >
      GitHub API data fetched on 2026-07-01 showed 3,249 stars and 410 forks for the
      current GitHub-hosted repository. Those numbers understate its age because NASM
      predates GitHub by more than two decades and has long been distributed through
      project tarballs, OS packages, compiler-course notes, and low-level systems
      tutorials.
  package-nerd-significance:
    - >
      NASM is one of the canonical x86 assembler packages. It matters because it is
      small, scriptable, cross-platform, and stable enough to appear as a dependency in
      build systems that need exact x86 object generation without invoking a full
      compiler frontend.
  project-history:
    - >
      The official NASM site says the project was originally developed by Simon Tatham
      and Julian Hall and is maintained by a team led by H. Peter Anvin. The
      documentation's version history records version 0.90 in October 1996 as the first
      release version and the first support for object-file output.
    - >
      NASM 2.00 added general x86-64 support, Win64 COFF, ELF64, and Mach-O output
      formats. NASM 3 series became the production version in 2025 and added APX
      instruction encodings and preprocessor improvements. The official site listed
      stable version 3.02 on 2026-06-29 and a development snapshot dated 2026-07-01.
  related-projects:
    - ndisasm
    - Yasm
    - GNU assembler
    - Intel Software Developer Manual
  sources:
    - https://api.github.com/repos/netwide-assembler/nasm
    - https://formulae.brew.sh/api/formula/nasm.json
    - https://formulae.brew.sh/formula/nasm
    - https://github.com/netwide-assembler/nasm
    - https://www.nasm.us/
    - https://www.nasm.us/doc/nasm01.html
    - https://www.nasm.us/doc/nasm02.html
    - https://www.nasm.us/doc/nasmac.html
  summary:
    - >
      NASM, the Netwide Assembler, is a long-running x86 and x86-64 assembler with
      Intel-like syntax, broad object-format support, a companion disassembler
      `ndisasm`, and a reputation as a standard tool for low-level x86 work.
  timeline:
    - >
      1996-10: NASM 0.90 released as the first release version with object-file output
      support.
    - '2007: NASM 2.00 series added general x86-64 support and 64-bit object formats.'
    - '2025: NASM 3 series became the production line, adding APX instruction encodings.'
    - '2026-06-29: NASM 3.02 listed by the official site as stable.'
    - >
      2026-07-01: Homebrew formula JSON listed stable version 3.02 and 93,847 installs
      over 365 days.
  usage:
    - >
      Users assemble source with commands such as `nasm -f elf myfile.asm` for object
      files or `nasm -f bin program.asm -o program.com` for flat binaries. The package
      also installs `ndisasm`, useful for disassembling raw x86 byte streams.
    - >
      Package nerds encounter NASM as a build dependency for projects containing
      hand-written x86 assembly, codec kernels, bootloaders, OS-dev experiments,
      exploit/reversing exercises, and compiler or architecture classes. Its value is
      the predictable Intel-like syntax and explicit output-format selection.
related-packages:
  - id: brew:yasm
    reason: >
      Yasm is a modular BSD-licensed assembler that began as a NASM rewrite and offers
      strong NASM-syntax compatibility, making it useful when its modular architecture
      or additional parser support is preferred.
    rel: alternative
    sources:
      - https://www.tortall.net/projects/yasm/manual/html/_preface.html
      - https://www.tortall.net/projects/yasm/manual/html/manual.html
      - https://www.nasm.us/doc/nasm01.html
