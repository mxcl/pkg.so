id: brew:humanbound
display-name: Humanbound
homepage: https://docs.humanbound.ai/
repo: https://github.com/humanbound/humanbound
docs:
  - https://docs.humanbound.ai/
  - https://docs.humanbound.ai/reference/cli
config-file-location:
  unix: ~/.humanbound/config.yaml
credentials-file-location:
  unix: ~/.humanbound/
history:
  adoption-history:
    - >
      Humanbound is a young project, so its reliable adoption history is limited.
      Official materials show distribution through PyPI, Homebrew in the supplied
      package facts, and an official GitHub Action for security gates in continuous
      integration.
  package-nerd-significance:
    - >
      Humanbound is notable as an AI-security tool that packages an engine, SDK, and CLI
      under one Python distribution while keeping the firewall as a composable sibling
      package. Its optional extras let package users choose the provider engine,
      firewall runtime, or both.
  project-history:
    - >
      The official Humanbound repository was created in February 2026 and is maintained
      by the verified Humanbound GitHub organization. The project combines an
      Apache-licensed local engine with an optional hosted platform, allowing initial
      testing without a login while preserving a path to managed posture tracking.
    - >
      The official release notes describe a consolidation around the humanbound PyPI
      package: the earlier humanbound-cli package was yanked, and the CLI and public SDK
      now ship together. The same repository also integrates with the sibling
      humanbound-firewall package for a test-to-guardrail workflow.
  related-projects:
    - >
      humanbound-firewall is the sibling Apache-licensed runtime that deploys rules
      generated from Humanbound findings.
    - humanbound/actions is the official GitHub Action for running Humanbound checks in CI.
  sources:
    - https://docs.humanbound.ai/
    - https://docs.humanbound.ai/authentication/
    - https://docs.humanbound.ai/local-engine/provider-config/
    - https://github.com/humanbound/humanbound
    - https://github.com/humanbound/humanbound/releases
    - source_facts.package-manager
  summary:
    - >
      Humanbound is an open-source adversarial testing engine, Python SDK, and hb
      command-line interface for AI agents. It drives multi-turn attacks against live
      agent endpoints, evaluates failures, and can turn findings into runtime guardrail
      rules.
  timeline:
    - '2026: The official humanbound/humanbound repository was created.'
    - >
      2026: The project consolidated the CLI and SDK in the humanbound PyPI package and
      yanked the older humanbound-cli package.
    - '2026: The official release feed reached the v2.7 series.'
  usage:
    - >
      Users describe an agent endpoint in a JSON configuration file and optionally
      define permitted and restricted behavior in a scope file. The hb test command runs
      attacks locally or through the platform; hb posture, hb logs, and hb report
      inspect the results.
    - >
      Local attack generation and judging can use OpenAI, Anthropic, Gemini, Azure
      OpenAI, Grok, or Ollama. Provider settings resolve from CLI flags, environment
      variables, and then ~/.humanbound/config.yaml; platform login credentials are
      stored under ~/.humanbound/.
related-packages:
  - id: brew:ollama
    reason: >
      Use Ollama as Humanbound's documented local model provider when adversarial attack
      generation and evaluation must run without an external model API.
    rel: adjacent_workflow
    sources:
      - https://docs.humanbound.ai/local-engine/provider-config/
      - https://docs.ollama.com/
category: security
package-manager:
  brew: humanbound
package-manager-url: https://formulae.brew.sh/formula/humanbound
license: Apache-2.0
tags:
  - adversarial-testing
  - ai-agents
  - ai-security
  - cli
  - llm-security
  - red-teaming
description: Adversarial security testing engine, SDK, and CLI for AI agents
executables:
  - hb
provenance:
  formula: humanbound
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
