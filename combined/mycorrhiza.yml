id: brew:mycorrhiza
display-name: Mycorrhiza Wiki
homepage: https://mycorrhiza.wiki
repo: https://github.com/bouncepaw/mycorrhiza
docs:
  - https://mycorrhiza.wiki/
  - https://mycorrhiza.wiki/help
config-file-location:
  unix: <wiki-root>/config.ini
credentials-file-location:
  unix: <wiki-root>/config.ini
history:
  project-history:
    - >
      The name comes from the biological idea of mycorrhiza: a symbiotic connection
      between fungus and plant. A project essay says Bouncepaw chose the metaphor in
      summer 2020 after noticing similarities between fungal structures and wikis:
      hyphae map to pages or files, and mycelia map to whole wikis. During release/1.2
      development the name changed from MycorrhizaWiki to Mycorrhiza Wiki because
      CamelCase made little sense for Mycomarkup's case-insensitive link and hypha
      names.
  sources:
    - https://github.com/bouncepaw/mycorrhiza
    - https://mycorrhiza.wiki/
    - https://mycorrhiza.wiki/hypha/deployment
    - https://mycorrhiza.wiki/hypha/name
    - https://mycorrhiza.wiki/hypha/release/1.15.1
    - https://raw.githubusercontent.com/bouncepaw/mycorrhiza/master/README.md
  summary:
    - >
      Mycorrhiza Wiki is a lightweight, free and open-source wiki engine for the
      independent web, developed by Bouncepaw with contributors. The project describes
      itself as a filesystem and Git-based wiki written in Go, using its own Mycomarkup
      language as the primary markup format.
  usage:
    - >
      Technically, Mycorrhiza's main milestones are its content model and storage
      choices. It stores content as plain files rather than in a database, records
      change history in Git, treats every content unit as a hypha, supports
      transclusion, nesting, categories, feeds for recent changes, authorization, Open
      Graph metadata, interwiki links, and keyboard-driven navigation. In practice it
      targets personal wikis, digital gardens, commonplace books, and small community
      wikis, and its own site runs on the engine. Packaging in Homebrew, Alpine, and Nix
      puts it in the self-hosted wiki niche rather than the large enterprise wiki
      category.
related-packages: []
category: productivity
package-manager:
  apk: mycorrhiza
  brew: mycorrhiza
  nix: mycorrhiza
package-manager-url: https://formulae.brew.sh/formula/mycorrhiza
license: AGPL-3.0-only
tags:
  - cli
  - digital-garden
  - git-backed
  - personal-wiki
  - web-server
  - wiki
description: Lightweight wiki engine with hierarchy support
executables:
  - mycorrhiza
provenance:
  formula: mycorrhiza
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
