id: brew:ndpi
display-name: nDPI
homepage: https://www.ntop.org/products/deep-packet-inspection/ndpi/
repo: https://github.com/ntop/nDPI
docs:
  - https://github.com/ntop/nDPI#readme
  - https://www.ntop.org/guides/nDPI
  - https://www.ntop.org/products/ndpi
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nDPI has the strongest adoption signal in this batch. ntop says it is used in ntop
      tools and third-party applications, including ntopng and nProbe Cento, to detect
      application protocols independently of ports. The official product page lists
      enterprise and ISP use cases such as traffic classification, content filtering,
      anomaly detection, QoS, bandwidth management, and IDS/IPS enrichment.
    - >
      The repository had about 4.5k GitHub stars and 993 forks on July 1, 2026. Homebrew
      Formulae listed stable 5.0, 739 installs, and 142 installs-on-request in its
      365-day analytics window on the same date.
  package-nerd-significance:
    - >
      nDPI is package-significant because it is both a library and a CLI/tooling
      package. It sits at the boundary between observability, security, packet capture,
      and policy enforcement, and its protocol database needs continuing updates as
      applications move ports, encrypt traffic, or change signatures.
  project-history:
    - >
      ntop describes nDPI as a maintained DPI toolkit released under LGPL, created to
      extend the original OpenDPI library with protocols that were otherwise available
      only in the paid OpenDPI version. The project was also modified for
      traffic-monitoring workloads by disabling features that slowed down the DPI engine
      without helping monitoring use cases.
    - >
      The nDPI README cites the 2014 IWCMC paper `nDPI: Open-source high-speed deep
      packet inspection`, anchoring the project in academic and operational
      network-monitoring history. The GitHub API reports the ntop/nDPI repository was
      created on April 19, 2015.
  related-projects:
    - OpenDPI
    - ntopng
    - nProbe
    - nProbe Cento
    - PF_RING
    - nfstream
    - nDPId
    - Wireshark
  sources:
    - https://api.github.com/repos/ntop/nDPI
    - https://formulae.brew.sh/formula/ndpi
    - https://github.com/ntop/nDPI
    - https://packages.debian.org/unstable/libndpi-bin
    - https://www.ntop.org/guides/nDPI/what_is_ndpi.html
    - https://www.ntop.org/products/deep-packet-inspection/ndpi/
  summary:
    - >
      nDPI is ntop's open source deep packet inspection library for classifying
      application-layer traffic, extracting selected metadata, analyzing encrypted
      traffic, and exposing APIs for traffic analysis.
  timeline:
    - >
      {'date': '2014', 'event': 'The nDPI README cites the IWCMC paper on open-source
      high-speed deep packet inspection.'}
    - >
      {'date': '2015-04-19', 'event': 'ntop/nDPI repository creation date reported by
      the GitHub API.'}
    - >
      {'date': '2025-11-17', 'event': 'GitHub release listing showed nDPI 5.0 Stable as
      the latest release.'}
    - >
      {'date': '2026-07-01', 'event': 'Homebrew Formulae listed stable 5.0 and 739
      installs in the 365-day analytics window.'}
  usage:
    - >
      Developers embed the C library into probes, firewalls, monitoring agents, or
      security tools, then feed it packets or flows to classify protocols, risks, and
      metadata. The README also documents `ndpiReader`, build steps, test scripts, and
      the process for adding a new protocol dissector.
    - >
      Operational users tend to encounter nDPI indirectly through ntopng, nProbe, nProbe
      Cento, Wireshark-related packaging, or distro packages such as Debian's
      libndpi-bin/libndpi-dev.
related-packages:
  - id: brew:wireshark
    reason: >
      Use Wireshark alongside nDPI when you want nDPI's application classifications
      displayed and filtered during interactive packet analysis through the project's
      documented extcap and Lua plugin.
    rel: adjacent_workflow
    sources:
      - https://github.com/ntop/nDPI/blob/dev/wireshark/README.md
      - https://www.wireshark.org/docs/
category: networking
package-manager:
  apk: ndpi
  brew: ndpi
  debian: libndpi-bin
  nix: ndpi
  ubuntu: libndpi-bin
  zypper: libndpi-devel
package-manager-url: https://formulae.brew.sh/formula/ndpi
license: LGPL-3.0-or-later
tags:
  - c-library
  - cli
  - deep-packet-inspection
  - networking
  - protocol-detection
  - traffic-analysis
description: Deep Packet Inspection (DPI) library
executables:
  - ndpiReader
provenance:
  formula: ndpi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
