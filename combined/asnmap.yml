id: brew:asnmap
display-name: asnmap
homepage: https://github.com/projectdiscovery/asnmap
repo: https://github.com/projectdiscovery/asnmap
docs:
  - https://github.com/projectdiscovery/asnmap#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The Homebrew input records asnmap in Homebrew, dnf, and Nix. Upstream installation
      also documents `go install github.com/projectdiscovery/asnmap/cmd/asnmap@latest`
      and precompiled binaries from the GitHub releases page, which is typical for
      ProjectDiscovery tools distributed both through Go and OS package managers.
  package-nerd-significance:
    - >
      For package nerds, asnmap is notable less as a standalone network database and
      more as a glue utility: it converts high-level organization or ASN targets into
      CIDR material that the rest of a CLI security toolchain can consume.
    - >
      The tool's API-token support also marks a shift seen in modern recon CLIs: a
      packaged open-source binary can still depend on a hosted platform token for full
      operation.
  project-history:
    - >
      The official README presents asnmap as both a command-line tool and Go library
      built on top of the ASNMap API. It acknowledges Frank Denis for maintaining the
      free IPtoASN database, making the project a packaged interface around ASN/CIDR
      lookup data useful in security and network inventory workflows.
  related-projects:
    - >
      The README documents direct workflow use with `tlsx`, `dnsx`, `naabu`, `httpx`,
      and `nuclei`, all in the ProjectDiscovery CLI ecosystem.
    - >
      The README acknowledges the IPtoASN database maintained by Frank Denis as related
      data infrastructure.
  sources:
    - https://github.com/projectdiscovery/asnmap#readme
    - input.source_facts.package-manager
  summary:
    - >
      asnmap is ProjectDiscovery's Go CLI and library for mapping autonomous system,
      organization, domain, and IP inputs to network ranges. It fits the
      ProjectDiscovery style of small composable reconnaissance tools with stdin/stdout
      support and automation-friendly JSON and CSV output.
  timeline:
    - >
      2022: README examples show v0.0.1-era output and timestamped JSON examples for
      ASN/CIDR lookup.
    - >
      Current README: Installation requires Go 1.21, supports precompiled releases, and
      documents ProjectDiscovery Cloud API token configuration.
  usage:
    - >
      asnmap accepts ASN, IP, domain, organization, file, and stdin input. Common
      package-manager usage is simple shell composition: query an organization or AS
      number, emit CIDR ranges, and pipe them into other recon tools.
    - >
      The README explicitly shows pipelines into ProjectDiscovery tools such as `tlsx`,
      `dnsx`, `naabu`, `httpx`, and `nuclei`, and it documents JSON and CSV output for
      post-processing.
related-packages:
  - id: brew:naabu
    reason: >
      Pipe asnmap's CIDR output into Naabu to discover open ports across the mapped
      network ranges.
    rel: adjacent_workflow
    sources:
      - https://github.com/projectdiscovery/asnmap#readme
      - https://docs.projectdiscovery.io/opensource/naabu/running
  - id: brew:tlsx
    reason: >
      Pipe mapped ranges directly into tlsx when the next step is TLS certificate,
      cipher, or endpoint inspection.
    rel: adjacent_workflow
    sources:
      - https://github.com/projectdiscovery/asnmap#readme
      - https://github.com/projectdiscovery/tlsx#readme
  - id: brew:dnsx
    reason: >
      Use dnsx with asnmap output and `-ptr` to perform reverse-DNS reconnaissance on
      mapped address ranges.
    rel: adjacent_workflow
    sources:
      - https://github.com/projectdiscovery/asnmap#readme
      - https://docs.projectdiscovery.io/opensource/dnsx/overview
  - id: brew:httpx
    reason: >
      After Naabu identifies web ports in an asnmap range, httpx can probe the resulting
      HTTP services and emit structured metadata.
    rel: adjacent_workflow
    sources:
      - https://github.com/projectdiscovery/asnmap#readme
      - https://docs.projectdiscovery.io/tools/httpx/overview
  - id: brew:nuclei
    reason: >
      Nuclei can consume the live HTTP targets produced by the documented
      asnmap-to-naabu-to-httpx pipeline for template-based checks.
    rel: adjacent_workflow
    sources:
      - https://github.com/projectdiscovery/asnmap#readme
      - https://docs.projectdiscovery.io/opensource/nuclei
category: networking
package-manager:
  brew: asnmap
  dnf: asnmap
  nix: asnmap
package-manager-url: https://formulae.brew.sh/formula/asnmap
license: MIT
tags:
  - asn
  - cidr
  - cli
  - network
  - osint
  - projectdiscovery
  - recon
description: Quickly map organization network ranges using ASN information
executables:
  - asnmap
provenance:
  formula: asnmap
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
