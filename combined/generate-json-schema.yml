id: brew:generate-json-schema
display-name: Generate Schemas
homepage: https://github.com/Nijikokun/generate-schema
repo: https://github.com/Nijikokun/generate-schema
docs:
  - https://github.com/Nijikokun/generate-schema#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is mostly in JavaScript and CLI workflows rather than as a platform
      standard. Its npm package is the upstream distribution, while Homebrew exposes the
      executable for users who want a system-level generate-schema command without
      managing a Node project.
  package-nerd-significance:
    - >
      For package-manager users, generate-json-schema is a convenience wrapper around a
      Node ecosystem utility: useful for bootstrapping schemas quickly, but not a
      substitute for hand-maintained contracts in production APIs.
  project-history:
    - >
      The GitHub repository and npm package were created in February 2015. The README
      presents the project as a converter from JSON objects to MySQL table schemas, JSON
      Schema, Mongoose schemas, ClickHouse schemas, Google BigQuery schemas, and generic
      templates, showing an evolution from a narrow JSON Schema helper into a small
      multi-target schema generator.
  related-projects:
    - >
      Related schema targets include JSON Schema, Mongoose, MySQL, Google BigQuery, and
      ClickHouse.
  sources:
    - https://formulae.brew.sh/formula/generate-json-schema
    - https://github.com/Nijikokun/generate-schema
    - https://raw.githubusercontent.com/Nijikokun/generate-schema/master/readme.md
    - https://registry.npmjs.org/generate-schema
  summary:
    - >
      Generate Schemas is the command-line and Node.js package distributed upstream as
      generate-schema and packaged in Homebrew as generate-json-schema. It derives
      schema-like definitions from sample JSON objects, turning example payloads into
      JSON Schema, database table definitions, ODM schemas, and warehouse schemas.
  timeline:
    - '2015: GitHub repository and npm package were created.'
    - >
      2023: npm registry metadata showed the package still distributed as
      generate-schema 2.6.0.
    - >
      2024: the GitHub repository recorded later source activity after the original 2015
      publication.
  usage:
    - >
      Practitioners use it when they have representative JSON and need a quick starter
      schema for validation, documentation, database modeling, or exploratory ingestion.
      The README documents both a file-oriented CLI and a library API, plus an
      interactive REPL mode when no file is supplied.
related-packages: []
category: developer-tools
package-manager:
  brew: generate-json-schema
package-manager-url: https://formulae.brew.sh/formula/generate-json-schema
license: MIT
tags:
  - cli
  - json-schema
  - nodejs
  - schema-generation
description: Generate a JSON Schema from Sample JSON
executables:
  - generate-schema
provenance:
  formula: generate-json-schema
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
