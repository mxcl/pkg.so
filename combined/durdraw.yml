id: brew:durdraw
display-name: Durdraw
homepage: https://durdraw.org
repo: https://github.com/cmang/durdraw
docs:
  - https://durdraw.org/
  - https://github.com/cmang/durdraw#readme
config-file-location:
  unix: ~/.durdraw/durdraw.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Durdraw's README points users to OS repositories, source installation, and direct
      GitHub-based pip installs. Its Homebrew, Debian, and Ubuntu packaging place it in
      the niche but durable category of terminal-art tools that survive because package
      managers make them easy to try.
    - >
      Release activity remained visible into the mid-2020s, including the 0.29.0 GitHub
      release in March 2025. That is unusual longevity for a terminal art editor and
      helps explain its package-nerd appeal.
  package-nerd-significance:
    - >
      Durdraw matters as a bridge between the ANSI art scene and modern Unix packaging.
      It gives package-manager users a maintained way to view and create
      CP437/ANSI-style art without a DOS environment, while keeping the interface
      terminal-native.
  project-history:
    - >
      The GitHub repository was created in March 2014. The README describes Durdraw as
      heavily inspired by classic MS-DOS and Windows ANSI editors such as TheDraw,
      Aciddraw, and Pablodraw, but rebuilt with a modern Unix orientation.
    - >
      The project grew beyond static text art into playback, frame animation, ANSI and
      CP437 handling, Unicode conversion, HTML and mIRC output, themes, and companion
      tools such as `durfetch` and `durview`.
  related-projects:
    - >
      The README names TheDraw, Aciddraw, and Pablodraw as direct inspirations. It also
      documents optional integration with ansilove for image export and Neofetch through
      the `durfetch` companion command.
  sources:
    - https://durdraw.org/
    - https://github.com/cmang/durdraw
    - https://api.github.com/repos/cmang/durdraw
    - https://api.github.com/repos/cmang/durdraw/releases
  summary:
    - >
      Durdraw is a terminal ASCII, Unicode, and ANSI art editor for Unix-like systems.
      Its history is tied to preserving old ANSI-art-editor workflows while adapting
      them to modern UTF-8 terminals, Python, ncurses, mouse input, themes, and
      frame-based animation.
  timeline:
    - '2014-03-28: GitHub repository created.'
    - '2024-01-09: Durdraw 0.25.0 released on GitHub.'
    - '2024-10-19: Durdraw 0.28.0 released.'
    - '2025-03-08: Durdraw 0.29.0 released.'
  usage:
    - >
      Users run `durdraw` to edit or play `.dur`, `.ANS`, and `.ASC` files, use keyboard
      and mouse commands for drawing, and can set startup preferences in
      `~/.durdraw/durdraw.ini`. The README also documents theme files and custom
      character sets under `~/.durdraw/`.
related-packages:
  - id: brew:ansilove
    reason: >
      Install Ansilove to enable Durdraw's documented PNG and animated-GIF export
      workflow for compatible 16-color CP437 artwork.
    rel: adjacent_workflow
    sources:
      - https://github.com/durdraw/durdraw#requirements
      - https://github.com/ansilove/ansilove#readme
  - id: brew:fastfetch
    reason: >
      Install Fastfetch to provide the system-information output used by Durdraw's
      `durfetch` companion command.
    rel: adjacent_workflow
    sources:
      - https://github.com/durdraw/durdraw#requirements
      - https://github.com/fastfetch-cli/fastfetch#readme
category: media
package-manager:
  brew: durdraw
  debian: durdraw
  ubuntu: durdraw
package-manager-url: https://formulae.brew.sh/formula/durdraw
license: BSD-3-Clause
tags:
  - animation
  - ansi-art
  - ascii-art
  - cli
  - editor
  - terminal-ui
  - unicode
description: Versatile ASCII and ANSI Art text editor for drawing in the terminal
executables:
  - durdraw
  - durfetch
  - durview
provenance:
  formula: durdraw
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
