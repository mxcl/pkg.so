id: brew:helix-db
display-name: HelixDB
homepage: https://helix-db.com
repo: https://github.com/HelixDB/helix-db
docs:
  - https://docs.helix-db.com/
  - https://docs.helix-db.com/documentation/cli-v2/getting-started
config-file-location:
  unix:
    - helix.toml
    - ~/.helix/config
credentials-file-location:
  unix: ~/.helix/credentials
history:
  adoption-history:
    - >
      HelixDB's adoption history is early-stage but visible: the repository metadata
      records thousands of GitHub stars, the README links to docs, Discord, and Launch
      YC, and GitHub releases show active versioned release packaging. The input facts
      record Homebrew packaging for `helix-db`, giving developers a package-manager
      route to the CLI rather than only a shell installer.
    - >
      Because the project is young, its package-manager significance is more about
      experimentation and developer onboarding than long-standing distro integration.
      The CLI is the adoption surface: install it, initialize a project, run a local
      database, query via SDK-generated JSON, or authenticate to Helix Cloud.
  package-nerd-significance:
    - >
      For package nerds, HelixDB is interesting because it packages a database workflow
      as a CLI-first developer experience. The Homebrew formula gives a single `helix`
      command that can scaffold files such as `helix.toml`, create a `.helix` workspace,
      run a local database, seed examples, and query a service without manually
      assembling database binaries and SDKs.
    - >
      It also shows a broader package trend around AI infrastructure: graph, vector,
      full-text, cloud auth, local containers, SDK code generation, and agent-oriented
      project scaffolding are being folded into one command-line tool.
  project-history:
    - >
      GitHub repository metadata records the HelixDB public repository from November
      2024. The README describes HelixDB as a graph-vector database for knowledge graphs
      and AI memory, built from scratch in Rust, with SDKs and a CLI for local and cloud
      workflows.
    - >
      The official documentation describes an architectural shift between the earlier
      open-source v1 LMDB-based implementation and Helix Cloud's object-storage-backed
      architecture. The docs present Helix Cloud as combining a property graph engine
      with approximate vector search and BM25 full-text search, with gateways, a single
      writer, auto-scaling readers, durable object storage, and cache layers.
    - >
      The project also launched publicly through Y Combinator's Launch YC in 2025, where
      the founders positioned it as an open-source graph-vector database for RAG and AI
      applications. That launch framing matches the repository and docs: reduce the need
      to stitch together separate vector databases, graph databases, and sync layers.
  related-projects:
    - >
      HelixDB is related to graph databases, vector databases, BM25/full-text engines,
      RAG infrastructure, knowledge-graph tools, object-storage-backed databases,
      Docker/Podman local development, and SDK-driven query builders in Rust,
      TypeScript, Go, and Python.
  sources:
    - https://api.github.com/repos/HelixDB/helix-db
    - https://api.github.com/repos/HelixDB/helix-db/releases
    - https://docs.helix-db.com/
    - https://docs.helix-db.com/llms.txt
    - https://github.com/HelixDB/helix-db
    - https://raw.githubusercontent.com/HelixDB/helix-db/main/README.md
    - https://www.ycombinator.com/launches/Naz-helixdb-the-database-for-rag-ai
  summary:
    - >
      HelixDB is a young graph-vector database project built in Rust for knowledge
      graphs, AI memory, RAG-style retrieval, and agent data workflows. The Homebrew
      package installs the `helix` CLI, which scaffolds projects, runs local instances,
      sends dynamic queries, and connects to Helix Cloud.
  timeline:
    - '2024: GitHub repository metadata records the HelixDB source repository.'
    - '2025: Launch YC published HelixDB as a database for RAG and AI.'
    - '2026: GitHub releases show a v3.0 series and continued CLI/database packaging work.'
    - 'Package-manager era: The input package facts record Homebrew packaging as `helix-db`.'
  usage:
    - >
      The README and docs show the CLI installing via `install.helix-db.com`, then using
      commands such as `helix init`, `helix start dev`, `helix query`, `helix stop`, and
      cloud-oriented commands for authentication, workspace/project selection, sync, and
      querying. Local development can run an in-memory containerized instance, while
      cloud use pulls endpoint and auth details into project configuration.
    - >
      Queries are authored through Rust, TypeScript, Go, or Python DSLs or sent as
      dynamic JSON over HTTP. The docs emphasize graph, vector, text search, dynamic
      query bundles, serializable snapshot isolation, and a workflow where applications
      can send query definitions directly to a running instance.
related-packages:
  - id: brew:neo4j
    reason: >
      Choose Neo4j for its established Cypher-centered property-graph platform and graph
      tooling; consider HelixDB when a Rust-built engine combining graph, vector, and
      BM25 queries behind SDK-generated JSON better matches the application.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/HelixDB/helix-db/main/README.md
      - https://neo4j.com/docs/getting-started/graph-database/
      - https://neo4j.com/docs/cypher-manual/current/indexes/search-indexes/vector-indexes/
category: data
