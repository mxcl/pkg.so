id: cask:browseros-ai/tap/browseros-neo
display-name: BrowserOS neo
homepage: https://browseros.com/
repo: https://github.com/browseros-ai/BrowserOS
docs:
  - https://docs.browseros.com/
  - https://docs.browseros.com/neo/how-it-works
  - https://docs.browseros.com/neo/mcp
config-file-location:
  unix: ~/.browserclaw/
credentials-file-location: null
history:
  adoption-history:
    - >
      BrowserOS neo targets users of MCP-capable agents including Claude Code, Codex,
      Cursor, VS Code, Zed, OpenClaw, and Hermes. Its one-click connection flow and
      Chrome import are designed to reduce the setup friction that commonly limits
      authenticated browser automation.
  package-nerd-significance:
    - >
      BrowserOS neo represents a shift from disposable headless-browser sessions toward
      a locally installed, inspectable browser environment for agents. Package users get
      a reproducible desktop installation while retaining real browser state, isolated
      agent tabs, an MCP endpoint, and on-disk audit artifacts.
  project-history:
    - >
      BrowserOS originated in 2025 as an open-source Chromium-based agentic-browser
      project. The repository now ships two related products: BrowserOS, an AI browser
      driven by a person, and BrowserOS neo, a secondary browser driven by external AI
      agents.
    - >
      Neo combines a Chromium fork with a Rust MCP and JSON backend plus a browser
      dashboard. Its product design centers on imported browser state, parallel agent
      sessions, live observation, and replayable local audit trails.
  related-projects:
    - BrowserOS
    - Chromium
    - Model Context Protocol
    - Claude Code
    - Codex
    - Cursor
  sources:
    - https://browseros.com/
    - https://docs.browseros.com/
    - https://docs.browseros.com/llms.txt
    - https://github.com/browseros-ai/BrowserOS
  summary:
    - >
      BrowserOS neo is a free, open-source secondary browser that lets MCP-compatible AI
      agents operate authenticated web sessions while users watch and replay their
      actions.
  timeline:
    - >
      2025: The BrowserOS project identifies its origin year in the repository's
      official citation metadata.
    - >
      2026: BrowserOS neo is documented as a distinct agent-driven browser shipping from
      the BrowserOS monorepo.
  usage:
    - >
      Users install neo, import logins, bookmarks, extensions, and settings from Chrome,
      then connect an MCP-capable agent. Agent work appears in isolated tabs and in a
      new-tab dashboard, with each session available for later replay.
    - >
      Official documentation says session history, screenshots, settings, and replay
      data remain on the local computer under ~/.browserclaw/. The browser is intended
      for authenticated tasks such as inbox work, filing expenses, updating web
      applications, and retrieving reports.
related-packages:
  - id: brew:agent-browser
    reason: >
      Choose agent-browser for scriptable headless automation and CI with fresh browser
      sessions; BrowserOS neo's official comparison positions neo for local, visible
      automation that retains the user's real signed-in state.
    rel: alternative
    sources:
      - https://browseros.com/
      - https://github.com/browseros-ai/BrowserOS
      - https://agent-browser.dev/
category: ai
package-manager:
  brew-cask: browseros-ai/tap/browseros-neo
