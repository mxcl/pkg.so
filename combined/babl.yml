id: brew:babl
display-name: babl
homepage: https://www.gegl.org/babl/
repo: https://gitlab.gnome.org/GNOME/babl
docs:
  - https://gegl.org/babl
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      babl's adoption is mostly indirect: the official documentation states that GIMP
      pixel storage uses GEGL's GeglBuffer and implicit conversions using babl formats.
      The package appears across Homebrew, Debian/Ubuntu, Fedora, Arch, Nix, MacPorts,
      Alpine, and openSUSE metadata in the supplied package-manager facts.
  package-nerd-significance:
    - >
      For package maintainers, babl is a classic small-but-central graphics dependency:
      it is not flashy, but version skew can affect GIMP/GEGL builds, color-management
      behavior, SIMD dispatch, and cross-platform packaging. Its significance is the
      kind dependency-graph people notice when a desktop graphics stack fails to build.
  project-history:
    - >
      The official babl site describes it as a pixel encoding and color-space conversion
      engine with a vocabulary for building new pixel formats from existing primitives.
      Its source tree is hosted by GNOME, and the site says babl releases are often made
      just before GEGL releases when GEGL needs significant babl improvements.
    - >
      The project has grown from a format-conversion library into a
      portability-sensitive graphics component. Recent NEWS entries show work on ICC
      handling, SIMD and CPU-specific paths, lookup-table behavior, Windows/MSVC
      support, and a command-line tool added in the 0.1.94 release.
  related-projects:
    - >
      GEGL is babl's closest companion project: the babl site explicitly links babl
      releases and GEGL needs. GIMP is the major downstream application named by the
      official docs. lcms2 is relevant for ICC profile and CMYK color-management
      support.
  sources:
    - https://gegl.org/babl
    - https://gitlab.gnome.org/GNOME/babl/-/raw/master/NEWS
    - source_facts.package-manager
  summary:
    - >
      babl is a C library and small command-line tool for pixel encoding, pixel-format
      introspection, and color-space conversion. It is most visible as infrastructure
      under GEGL and GIMP rather than as an end-user application.
  timeline:
    - '2018: GNOME GitLab metadata records the babl project on gitlab.gnome.org.'
    - '2019: babl 0.1.62 NEWS notes initial CMYK spaces with lcms2-based ICC support.'
    - '2022: babl 0.1.94 NEWS notes the addition of a command-line tool.'
    - '2025: babl 0.1.114 NEWS notes ICC TRC cache fixes and BABL_ICC_INTENT_DEFAULT.'
    - '2026: babl 0.1.126 NEWS notes that building with MSVC is now possible.'
  usage:
    - >
      Most users encounter babl as a build and runtime dependency of image software.
      Developers use its C API to name formats, convert buffers, add color models or
      data types, and rely on babl's runtime profiling and cached conversion selection
      for fast pixel pipelines.
related-packages:
  - id: brew:gegl
    reason: >
      GEGL uses babl for pixel-format and color-space conversion, making it the primary
      framework to pair with babl when building graph-based image-processing pipelines.
    rel: adjacent_workflow
    sources:
      - https://gegl.org/babl/
      - https://gegl.org/
  - id: cask:gimp
    reason: >
      GIMP uses GEGL buffers with implicit babl-format conversions, so it is the
      principal end-user application built on this graphics stack.
    rel: adjacent_workflow
    sources:
      - https://gegl.org/babl/
      - https://www.gimp.org/about/
category: media
package-manager:
  apk: babl
  brew: babl
  debian: gir1.2-babl-0.1
  dnf: babl
