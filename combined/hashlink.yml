id: brew:hashlink
display-name: HashLink
homepage: https://hashlink.haxe.org/
repo: https://github.com/HaxeFoundation/hashlink
docs:
  - https://github.com/HaxeFoundation/hashlink/wiki
  - https://hashlink.haxe.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      HashLink became an official Haxe target for system, server, desktop, and game
      workloads. The official case study documents Shiro Games moving Northgard from
      Adobe AIR to HashLink and HLSDL while retaining cross-platform releases.
    - >
      source_facts.package-manager records availability through Homebrew, Nix, Arch,
      Scoop, and openSUSE-related packaging.
  package-nerd-significance:
    - >
      HashLink gives Haxe users a runtime package separate from the compiler, with a
      compact `hl` command, native libraries, JIT execution, and a C-generation path. It
      is especially interesting to runtime packagers because optional multimedia,
      database, networking, and cryptographic libraries affect builds.
    - >
      Its dual execution model lets developers use bytecode and JIT compilation for
      quick iteration, then generate C for optimized release binaries while retaining
      the same runtime semantics.
  project-history:
    - >
      Nicolas Cannasse developed HashLink for roughly a year before announcing it as a
      new Haxe target in 2016. He described it as a conceptual successor to NekoVM for
      system, server, and desktop applications, but with a different and incompatible
      architecture.
    - >
      HashLink supports direct bytecode execution through HL/JIT and conversion to C
      through HL/C. The Haxe Foundation later sponsored work on an Immix-derived garbage
      collector to improve allocation-heavy performance.
  related-projects:
    - Haxe is the language and compiler that emits HashLink bytecode or C output.
    - NekoVM is HashLink's conceptual predecessor, though the runtimes are not compatible.
    - >
      Heaps is an open-source Haxe game engine used with HashLink in projects including
      Northgard.
  sources:
    - https://github.com/HaxeFoundation/hashlink
    - https://hashlink.haxe.org/
    - https://haxe.org/blog/hashlink-gc/
    - https://haxe.org/blog/hashlink-in-depth-p2/
    - https://haxe.org/blog/hashlink-indepth/
  summary:
    - >
      HashLink is the Haxe Foundation's virtual machine and native-code target for
      running Haxe applications through JIT-compiled bytecode or generated C.
  timeline:
    - '2016: HashLink is announced as a new Haxe target.'
    - '2016-11: Nicolas Cannasse publishes the first official HashLink in-depth article.'
    - '2016-12: The second in-depth article documents the runtime architecture.'
    - '2020: Haxe Foundation material presents work on an Immix-based garbage collector.'
    - '2025: The official repository releases HashLink 1.15.'
  usage:
    - >
      Compile bytecode with `haxe -hl output.hl -main MyApp` and execute it with `hl
      output.hl`. For native release builds, generate C with the Haxe compiler and
      compile that output against the HashLink runtime.
    - >
      The runtime supplies standard Haxe facilities and optional libraries for graphics,
      audio, networking, databases, cryptography, and other native integrations.
related-packages:
  - id: brew:haxe
    reason: >
      Install Haxe alongside HashLink to compile Haxe source into `.hl` bytecode or
      generated C that the HashLink runtime executes or links.
    rel: adjacent_workflow
    sources:
      - https://hashlink.haxe.org/
      - https://github.com/HaxeFoundation/haxe
  - id: brew:neko
    reason: >
      Choose Neko for compatibility with older Haxe projects targeting Neko bytecode;
      choose HashLink for the newer JIT and native-C target designed as Neko's
      successor.
    rel: alternative
    sources:
      - https://haxe.org/blog/hashlink-indepth/
      - https://nekovm.org/
category: language-runtime
package-manager:
  brew: hashlink
  nix: hashlink
  pacman: hl
  scoop: main/hashlink
  zypper: hashlink
package-manager-url: https://formulae.brew.sh/formula/hashlink
license: MIT
tags:
  - bytecode
  - cli
  - compiler-target
  - haxe
  - jit
  - runtime
  - virtual-machine
description: Virtual machine for Haxe
executables:
