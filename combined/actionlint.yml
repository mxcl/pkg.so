id: brew:actionlint
display-name: actionlint
homepage: https://rhysd.github.io/actionlint/
repo: https://github.com/rhysd/actionlint
docs:
  - https://github.com/rhysd/actionlint/blob/main/docs/config.md
  - https://rhysd.github.io/actionlint
  - https://rhysd.github.io/actionlint/usage.html
config-file-location:
  unix:
    - .github/actionlint.yaml
    - .github/actionlint.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      actionlint was packaged broadly across developer distributions. The supplied
      package-manager facts list apk, Homebrew, MacPorts, Nix, pacman, Scoop, and
      winget, matching the official installation documentation's emphasis on released
      binaries, Homebrew, go install, Docker, and integrations.
    - >
      GitHub repository metadata showed nearly 4,000 stars by June 2026, a strong
      adoption signal for a specialized workflow linter.
  package-nerd-significance:
    - >
      Package maintainers care about actionlint because it packages a fast,
      self-contained static analysis tool for a file format used by a huge share of open
      source projects. It also bridges ecosystems by integrating ShellCheck, pyflakes,
      reviewdog, pre-commit, editor tooling, Docker images, and GitHub Actions itself.
  project-history:
    - >
      The rhysd/actionlint repository was created on 2021-05-25. Its README presents the
      tool as a static checker for GitHub Actions workflow files with syntax checks,
      expression type checks, action input/output checks, reusable workflow checks,
      ShellCheck and pyflakes integrations, and security checks.
    - >
      The first GitHub release, v1.0.0, was published on 2021-06-16. The project
      continued as a Go command-line tool with install, usage, configuration, API, and
      reference documentation.
  related-projects:
    - >
      actionlint is related to GitHub Actions, ShellCheck, pyflakes, reviewdog,
      pre-commit, super-linter, and editor or CI integrations that surface workflow
      diagnostics.
  sources:
    - https://api.github.com/repos/rhysd/actionlint
    - https://api.github.com/repos/rhysd/actionlint/releases
    - https://github.com/rhysd/actionlint#readme
    - https://github.com/rhysd/actionlint/blob/main/docs/config.md
    - source_facts.package-manager
  summary:
    - >
      actionlint is a static checker for GitHub Actions workflow files. It matters in
      CLI package culture because it brought fast local linting, expression checks,
      action input validation, and CI-friendly diagnostics to a workflow format that
      many repositories otherwise validate only after pushing.
  timeline:
    - '2021-05-25: rhysd/actionlint repository created on GitHub.'
    - '2021-06-16: v1.0.0 published as the first GitHub release.'
    - >
      2026-06: GitHub API metadata showed active maintenance and broad package-manager
      availability.
  usage:
    - >
      The common local workflow is simply running actionlint at the repository root so
      it auto-detects workflow files. Optional configuration files live at
      .github/actionlint.yaml or .github/actionlint.yml, mainly for self-hosted runner
      labels, repository variables, and path-specific ignores.
related-packages:
  - id: brew:action-validator
    reason: >
      Choose action-validator for schema-oriented validation of both action metadata and
      workflow files, including repository path-glob checks; choose actionlint for
      deeper workflow expression, reusable-workflow, script, and security analysis.
    rel: alternative
    sources:
      - https://github.com/rhysd/actionlint#readme
      - https://github.com/mpalmer/action-validator#readme
  - id: brew:actions-languageserver
    reason: >
      Use the GitHub Actions Language Server for interactive editor completion and
      diagnostics, then run actionlint locally or in CI for a dedicated static-analysis
      gate.
    rel: adjacent_workflow
    sources:
      - https://github.com/actions/languageservices/tree/main/languageserver#readme
      - https://github.com/rhysd/actionlint#readme
  - id: brew:shellcheck
    reason: >
      actionlint explicitly invokes ShellCheck to analyze shell scripts embedded in
      workflow run steps, so installing ShellCheck enables that additional diagnostic
      layer.
    rel: adjacent_workflow
    sources:
      - https://github.com/rhysd/actionlint#readme
      - https://github.com/koalaman/shellcheck#readme
  - id: brew:pre-commit
    reason: >
      actionlint publishes an official pre-commit hook, allowing pre-commit to reject
      invalid GitHub Actions workflows before they enter repository history.
    rel: adjacent_workflow
    sources:
      - https://github.com/rhysd/actionlint/blob/main/docs/usage.md
      - https://pre-commit.com/
category: developer-tools
package-manager:
  apk: actionlint
  brew: actionlint
  macports: actionlint
  nix: actionlint
  pacman: actionlint
  scoop: main/actionlint
  winget: rhysd.actionlint
package-manager-url: https://formulae.brew.sh/formula/actionlint
license: MIT
tags:
  - ci
  - cli
  - github-actions
  - linting
  - static-analysis
description: Static checker for GitHub Actions workflow files
executables:
  - actionlint
provenance:
  formula: actionlint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
