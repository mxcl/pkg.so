id: brew:execstack
display-name: execstack
homepage: https://people.redhat.com/jakub/prelink/
repo: null
docs:
  - https://people.redhat.com/jakub/prelink
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      execstack became a packaging and security-maintenance utility rather than a
      day-to-day application. It is most useful when a third-party ELF binary or shared
      object has incorrect PT_GNU_STACK markings and a packager needs to verify or clear
      them without rebuilding the original source.
  package-nerd-significance:
    - >
      Package maintainers care about execstack because it sits at the boundary between
      compiler metadata, linker policy, and runtime hardening. A single bad
      executable-stack bit can change security posture, so a tiny utility remains useful
      even after prelink itself stopped being fashionable.
  project-history:
    - >
      The tool belongs to the early-2000s Linux transition away from assuming that
      process stacks were executable. Jakub Jelinek's 2003 binutils work introduced
      PT_GNU_STACK so compilers, assemblers, and linkers could describe whether an
      executable stack was needed; execstack provided a post-link command-line way to
      inspect and override that metadata.
    - >
      The upstream prelink archive shows prelink tarballs beginning in 2001 and
      continuing through a 2013 snapshot. The execstack manual page was obtained from
      the prelink-20130503 tarball and dates the utility's documentation to October
      2003.
  related-projects:
    - >
      execstack is tied to prelink, GNU binutils, GCC .note.GNU-stack metadata, and ELF
      dynamic-linker hardening behavior.
  sources:
    - https://people.redhat.com/jakub/prelink/
    - https://man7.org/linux/man-pages/man8/execstack.8.html
    - https://sourceware.org/legacy-ml/binutils/2003-05/msg00741.html
  summary:
    - >
      execstack is a small ELF hardening utility from the prelink project. It exists to
      query, set, or clear the executable-stack requirement recorded in ELF program
      headers.
  timeline:
    - '2001: The prelink archive begins publishing source snapshots.'
    - '2003: PT_GNU_STACK support is proposed for binutils.'
    - '2003: execstack documentation describes querying and changing PT_GNU_STACK markings.'
    - >
      2013: The prelink archive publishes a later source snapshot used by manual-page
      renderers.
  usage:
    - >
      The common workflow is intentionally narrow: run execstack -q to report whether
      files require an executable stack, execstack -c to mark known-safe objects as not
      requiring one, or execstack -s for the rare case where a binary really needs
      executable stack support.
related-packages:
  - id: brew:patchelf
    reason: >
      Choose PatchELF when you need the same GNU_STACK print, clear, or set operations
      together with broader ELF interpreter, RPATH, and dependency editing.
    rel: alternative
    sources:
      - https://people.redhat.com/jakub/prelink/
      - https://github.com/NixOS/patchelf/blob/master/patchelf.1
  - id: brew:binutils
    reason: >
      Use binutils readelf to inspect GNU_STACK headers and ld options to prevent
      executable-stack markings during linking, reserving execstack for post-link
      changes.
    rel: adjacent_workflow
    sources:
      - >
        https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/9.6_release_notes/new-features
      - https://sourceware.org/binutils/docs/ld/Options.html
