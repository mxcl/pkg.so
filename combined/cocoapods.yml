id: brew:cocoapods
display-name: CocoaPods
homepage: https://cocoapods.org/
repo: https://github.com/CocoaPods/CocoaPods
docs:
  - https://guides.cocoapods.org/
  - https://guides.cocoapods.org/using/the-podfile.html
  - https://guides.cocoapods.org/using/using-cocoapods
config-file-location:
  unix: Podfile
credentials-file-location: null
history:
  adoption-history:
    - >
      The official homepage states that CocoaPods has over 107 thousand libraries and is
      used in over 3 million apps. RubyGems records more than 100 million downloads for
      the `cocoapods` gem.
    - >
      CocoaPods' adoption has also reached a late-maintenance phase. The official blog
      announced a plan to make CocoaPods trunk read-only, while keeping existing
      Specs/CDN infrastructure available so existing builds continue to work.
  package-nerd-significance:
    - >
      CocoaPods is historically important because it brought a package-index workflow to
      Apple platform development before Swift Package Manager was mature. It normalized
      lockfiles, central package metadata, semantic versions, and repeatable third-party
      dependency integration for Xcode projects.
    - >
      It is also a case study in package registry lifecycle. The planned read-only trunk
      transition shows how an ecosystem can preserve installability while reducing the
      operational and security burden of accepting new package submissions.
  project-history:
    - >
      The CocoaPods GitHub repository was created in 2011 and the project presents
      itself as the dependency manager for iOS and Mac projects. The official site says
      CocoaPods is developed on GitHub by the CocoaPods Dev Team with many contributors.
    - >
      CocoaPods matured into a full package ecosystem: a command-line installer, a
      central specs index, project integration for Xcode workspaces, documentation,
      search, and trunk publishing for podspecs.
  related-projects:
    - CocoaPods Specs is the central podspec repository/trunk data set.
    - RubyGems distributes the `cocoapods` CLI gem.
    - Swift Package Manager and Carthage are adjacent Apple-platform dependency managers.
  sources:
    - https://cocoapods.org/
    - https://guides.cocoapods.org/using/using-cocoapods.html
    - https://guides.cocoapods.org/using/the-podfile.html
    - https://github.com/CocoaPods/CocoaPods
    - https://rubygems.org/gems/cocoapods
    - https://blog.cocoapods.org/CocoaPods-Specs-Repo/
  summary:
    - >
      CocoaPods is the long-running dependency manager for Swift and Objective-C Cocoa
      projects. It is one of the defining package tools of iOS and macOS development,
      centered on the `pod` CLI, the Podfile, podspecs, and the CocoaPods Specs/trunk
      ecosystem.
  timeline:
    - '2011: `CocoaPods/CocoaPods` repository created on GitHub.'
    - >
      2010s: CocoaPods becomes the dominant third-party dependency manager for
      Objective-C and Swift Cocoa projects.
    - '2016: CocoaPods 1.0 series released.'
    - '2024: CocoaPods 1.16.2 released.'
    - >
      2024: Official blog announces a read-only plan for CocoaPods trunk, later updated
      in May 2025.
    - >
      2026: Blog plan says new trunk submissions will be stopped while existing builds
      continue to work.
  usage:
    - >
      A user writes dependencies in a `Podfile`, runs `pod install`, and then opens the
      generated `.xcworkspace` rather than the original Xcode project. The official
      guide says the `Podfile` and `Podfile.lock` should be kept under version control.
    - >
      CocoaPods also supports creating and publishing pods through podspecs, with
      commands such as `pod spec create`, `pod spec lint`, and publishing through trunk.
related-packages:
  - id: brew:carthage
    reason: >
      Choose Carthage when you want decentralized Cocoa dependency resolution and
      explicit framework integration; CocoaPods instead provides centralized discovery
      and automatically manages an Xcode workspace.
    rel: alternative
    sources:
      - https://github.com/Carthage/Carthage#differences-between-carthage-and-cocoapods
      - https://cocoapods.org/about
category: developer-tools
