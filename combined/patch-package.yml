id: brew:patch-package
display-name: patch-package
homepage: https://github.com/ds300/patch-package
repo: https://github.com/ds300/patch-package
docs:
  - https://github.com/ds300/patch-package#readme
config-file-location:
  unix: <project>/package.json
  windows: <project>\package.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The project became a widely used workaround in npm and Yarn applications because
      it lets teams version local dependency fixes without publishing a fork. Its
      official repository documents automatic application through package-manager
      lifecycle hooks and has accumulated substantial community use.
  package-nerd-significance:
    - >
      patch-package formalized a pragmatic pattern familiar to package maintainers:
      carry a small downstream patch while waiting for upstream. It makes those changes
      visible in ordinary code review and reproducible on developer machines and CI,
      occupying a useful middle ground between directly editing node_modules and
      maintaining a permanent fork.
  project-history:
    - >
      patch-package was created for JavaScript application authors who needed to
      preserve fixes made inside installed npm dependencies. The project evolved beyond
      basic patch creation and application to support nested packages, dev-only patches,
      ordered patch sequences, rebasing, partial application, reverse application, CI
      behavior, and alternate patch directories.
  related-projects:
    - >
      The project integrates with npm and Yarn workflows. Its documentation also
      discusses postinstall-postinstall for older Yarn lifecycle behavior and contrasts
      its workflow with maintaining dependency forks.
  sources:
    - 'Official changelog: https://github.com/ds300/patch-package/blob/master/CHANGELOG.md'
    - 'Official releases: https://github.com/ds300/patch-package/releases'
    - 'Official repository and README: https://github.com/ds300/patch-package'
  summary:
    - >
      patch-package creates versioned diff files from local changes to Node.js
      dependencies and reapplies them after dependency installation.
  timeline:
    - >
      The project expanded from basic dependency patches to CI-aware application,
      dev-only patches, partial application, and ordered patch sequences.
  usage:
    - >
      A developer edits an installed dependency under node_modules and runs
      patch-package for that package. The tool writes a versioned patch under the
      application's patches directory; the patch is committed with the application and
      normally reapplied from a postinstall script. Teams should keep patches focused
      and reassess them when dependency versions change.
category: developer-tools
package-manager:
  brew: patch-package
  nix: patch-package
package-manager-url: https://formulae.brew.sh/formula/patch-package
license: MIT
tags:
  - cli
  - dependencies
  - nodejs
  - npm
  - package-management
  - patches
description: Fix broken node modules instantly
executables:
  - patch-package
provenance:
  formula: patch-package
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
