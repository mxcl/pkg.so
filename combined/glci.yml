  - docker
  - gitlab
  - local-ci
  - pipeline-runner
  - podman
  - tui
description: Run GitLab CI/CD pipelines locally
executables:
  - glci
provenance:
  formula: glci
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
