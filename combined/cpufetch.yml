id: brew:cpufetch
display-name: cpufetch
homepage: https://github.com/Dr-Noob/cpufetch
repo: https://github.com/Dr-Noob/cpufetch
docs:
  - https://github.com/Dr-Noob/cpufetch#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README directs users first to OS packages and shows a Repology packaging
      badge, with source builds and release binaries as fallbacks. That packaging-first
      installation path fits the tool's role as a small terminal utility distributed
      across Unix-like and Windows package ecosystems.
  package-nerd-significance:
    - >
      cpufetch is package-nerd friendly because it is a small C utility with broad
      OS/architecture packaging, visible hardware-support churn, and a release cadence
      driven by newly detected microarchitectures.
  project-history:
    - >
      The official GitHub repository was created in 2018. Its README describes cpufetch
      as a simple CPU architecture fetching tool that displays CPU information in a
      clean terminal presentation.
  related-projects:
    - The README points to gpufetch as the related GPU-oriented companion project.
  sources:
    - https://github.com/Dr-Noob/cpufetch
    - https://raw.githubusercontent.com/Dr-Noob/cpufetch/master/README.md
    - https://api.github.com/repos/Dr-Noob/cpufetch
    - https://github.com/Dr-Noob/cpufetch/releases/tag/v1.07
  summary:
    - >
      cpufetch is a command-line CPU information display tool written in C, styled after
      the fetch-tool family but focused on CPU architecture details.
  timeline:
    - '2018: The Dr-Noob/cpufetch repository was created.'
    - '2023: v1.03 and v1.04 releases were published.'
    - '2024: v1.05 and v1.06 releases were published.'
    - '2025: v1.07 was published.'
  usage:
    - >
      Users run cpufetch to print CPU details and an architecture/manufacturer-themed
      logo. The README documents supported operating-system and architecture
      combinations, color customization, source builds, Android/Termux use, and debug
      reporting for unknown microarchitectures.
related-packages: []
category: system
package-manager:
  apk: cpufetch
  brew: cpufetch
  debian: cpufetch
  dnf: cpufetch
  macports: cpufetch
  nix: cpufetch
  pacman: cpufetch
  scoop: main/cpufetch
  ubuntu: cpufetch
  winget: Dr-Noob.cpufetch
  zypper: cpufetch
package-manager-url: https://formulae.brew.sh/formula/cpufetch
license: GPL-2.0-only
tags:
  - cli
  - cpu
  - cross-platform
  - hardware-info
  - system-info
description: CPU architecture fetching tool
executables:
  - cpufetch
provenance:
  formula: cpufetch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
