id: brew:astgen
display-name: astgen
homepage: https://github.com/joernio/astgen-monorepo
repo: https://github.com/joernio/astgen-monorepo
docs:
  - https://github.com/joernio/astgen#readme
  - https://github.com/joernio/astgen-monorepo#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption evidence is thin: the supplied facts show a Homebrew formula,
      while the original repository has a small public footprint. The package is best
      understood as a Joern ecosystem utility rather than a broad standalone developer
      tool.
  package-nerd-significance:
    - >
      The interesting package-manager detail is the repository transition: a Homebrew
      package points at a historical standalone tool, while upstream now collects
      multiple AST generators under one monorepo with per-language releases and
      checksums.
    - >
      That makes source provenance and release-tag selection more important than the
      package's public popularity.
  project-history:
    - >
      The original joernio/astgen repository describes the package as generating AST in
      JSON format for JavaScript and TypeScript. GitHub now marks that repository
      archived, and its README directs future work to joernio/astgen-monorepo.
    - >
      The replacement monorepo reframes astgen as a family of language-specific AST
      generators for the Joern code analysis platform. Its README lists ABAP, .NET, Go,
      JavaScript/TypeScript, Ruby, Rust, and Swift generators, each with its own build
      system, dependencies, tests, and release workflow.
  related-projects:
    - >
      Joern is the code analysis platform named by the monorepo README as the consumer
      context for the AST generators.
    - >
      javascript-astgen in the monorepo is the closest successor to the standalone JS/TS
      astgen package.
    - >
      Other monorepo siblings include abap-astgen, dotnet-astgen, go-astgen,
      ruby-astgen, rust-astgen, and swift-astgen.
  sources:
    - https://github.com/joernio/astgen#readme
    - https://github.com/joernio/astgen-monorepo#readme
    - source_facts.package-manager
  summary:
    - >
      astgen is a Joern-related AST generator package for producing JSON AST output for
      JavaScript and TypeScript. The original standalone repository is now archived and
      points to joernio/astgen-monorepo.
  timeline:
    - >
      2026: joernio/astgen was archived and its README directed users to
      joernio/astgen-monorepo.
    - >
      2026: astgen-monorepo README documents independently versioned language generators
      and prefixed release tags.
  usage:
    - >
      Package users invoke the astgen executable to produce AST JSON for
      JavaScript/TypeScript workflows. In current upstream development, users should
      expect language-specific directories and prefixed release tags in the monorepo
      rather than all work happening in the archived standalone repository.
related-packages:
  - id: brew:joern
    reason: >
      Use Joern when you want the complete static-analysis workflow that consumes
      language frontend ASTs and turns source into queryable code property graphs.
    rel: adjacent_workflow
    sources:
      - https://github.com/joernio/astgen-monorepo#readme
      - https://docs.joern.io/frontends/
category: developer-tools
package-manager:
  brew: astgen
package-manager-url: https://formulae.brew.sh/formula/astgen
license: Apache-2.0
tags:
  - ast
  - cli
  - code-analysis
  - javascript
  - joern
  - typescript
description: Generate AST in json format for JS/TS
executables:
  - astgen
provenance:
  formula: astgen
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
