history:
  adoption-history:
    - >
      Manus reported rapid early adoption after its 2025 launch, including millions of
      users' workloads, tens of trillions of processed tokens, and tens of millions of
      virtual computers created.
    - >
      By December 2025, Manus reported crossing $100 million in annual recurring revenue
      eight months after launch. Later that month it announced that it was joining Meta
      while continuing the existing service.
    - >
      The March 2026 desktop release extended Manus from its cloud sandbox to
      user-authorized local folders, command-line tools, and hardware on macOS and
      Windows.
  package-nerd-significance:
    - >
      Manus represents the shift from conversational AI toward packaged agents that
      receive goals and operate a browser, filesystem, terminal, integrations, and
      persistent workspaces to produce finished artifacts.
    - >
      The desktop application is especially relevant to package and automation
      enthusiasts because it connects a hosted agent to local development tools and
      compute while retaining folder-scoped permissions and command approval.
  project-history:
    - >
      Manus launched in 2025 as a general-purpose autonomous AI agent operating in a
      cloud virtual computer rather than only returning chat responses.
    - >
      During 2025 the service added capabilities such as Wide Research, projects,
      collaboration, connectors, application building, browser operation, and successive
      agent versions including Manus 1.5.
    - >
      Manus announced in December 2025 that it was joining Meta. In March 2026, the My
      Computer feature and desktop application brought its agent workflow to local macOS
      and Windows environments.
  related-projects:
    - >
      The product belongs to the general-purpose AI-agent category and integrates with
      projects, scheduled tasks, browser automation, cloud connectors, local
      command-line tools, and software-development environments.
  sources:
    - >
      Official Meta announcement:
      https://manus.im/en/blog/manus-joins-meta-for-next-era-of-innovation
    - 'Official adoption update: https://manus.im/blog/manus-100m-arr'
    - 'Official desktop announcement: https://manus.im/blog/manus-my-computer-desktop'
    - 'Official introduction: https://manus.im/docs/introduction/welcome'
    - >
      Official retrospective:
      https://manus.im/blog/what-we-saw-in-the-past-three-months-and-what-we-see-in-the-future
  summary:
    - >
      Manus is a general-purpose autonomous AI agent launched in 2025. It plans and
      executes multi-step computer work in a managed cloud environment, while its later
      desktop application adds controlled access to local files, command-line tools,
      applications, and compute resources.
  timeline:
    - 'March 2025: Manus launched as a general-purpose autonomous AI agent.'
    - >
      October 2025: Manus 1.5 introduced a re-architected agent system and expanded
      collaboration and application-building capabilities.
    - 'December 2025: Manus reported $100 million ARR and announced that it was joining Meta.'
    - 'March 2026: Manus Desktop and the My Computer capability launched for macOS and Windows.'
  usage:
    - >
      Users delegate research, analysis, content creation, presentations, application
      development, browser work, and other multi-step tasks to an agent with its own
      working environment.
    - >
      With Manus Desktop, users authorize selected local folders and approve terminal
      commands so the agent can organize files, run development tools, use local
      hardware, and participate in scheduled or remotely initiated workflows.
