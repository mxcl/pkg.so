id: brew:ctx7
display-name: ctx7
homepage: https://context7.com
repo: https://github.com/upstash/context7
docs:
  - https://context7.com/docs
  - https://context7.com/docs/clients/cli
  - https://context7.com/docs/skills
config-file-location:
  unix:
    - .mcp.json
    - .cursor/mcp.json
    - .opencode.json
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/context7/credentials.json
    - ~/.config/context7/credentials.json
    - ~/.context7/credentials.json
history:
  adoption-history:
    - >
      The CLI documentation targets AI coding users who want terminal access to indexed
      library docs and one-command setup for tools such as Claude Code, Cursor,
      OpenCode, and MCP-compatible agents.
  package-nerd-significance:
    - >
      As a Homebrew formula, ctx7 packages a fast-moving AI developer-tool CLI outside
      the Node-only install path, making Context7 setup scriptable for users who prefer
      system package managers.
  project-history:
    - >
      Context7's public repository was created in 2025 under the Upstash organization.
      The official docs position the platform around reducing stale or hallucinated
      library API answers by injecting current documentation into prompts and agent
      workflows.
  related-projects:
    - Context7 MCP server, Upstash, Model Context Protocol, AI coding assistants.
  sources:
    - https://context7.com/docs
    - https://context7.com/docs/clients/cli
    - https://github.com/upstash/context7
    - https://api.github.com/repos/upstash/context7
  summary:
    - >
      ctx7 is the command-line interface for Context7, an Upstash project that supplies
      current, version-specific library documentation to AI coding assistants.
  timeline:
    - '2025: Public upstash/context7 repository created.'
    - >
      2025: Official Context7 CLI docs describe terminal documentation queries and
      coding-agent setup.
  usage:
    - >
      ctx7 is used both interactively, for commands such as resolving a library and
      querying docs, and as a setup helper that writes MCP or skill configuration for
      coding agents.
related-packages:
  - id: brew:context7-mcp
    reason: >
      Choose Context7 MCP when you want an MCP client to call Context7 tools directly;
      choose ctx7 for terminal queries or one-command MCP and skill setup.
    rel: alternative
    sources:
      - https://context7.com/docs/clients/cli
      - https://github.com/upstash/context7
category: ai
package-manager:
  brew: ctx7
  nix: ctx7
package-manager-url: https://formulae.brew.sh/formula/ctx7
license: MIT
tags:
  - ai
  - ai-coding
  - cli
  - documentation-context
  - mcp
  - skills
description: Manage AI coding skills and documentation context
executables:
  - ctx7
provenance:
  formula: ctx7
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
