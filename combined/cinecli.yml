id: brew:cinecli
display-name: CineCLI
homepage: https://github.com/eyeblech/cinecli
repo: https://github.com/eyeblech/cinecli
docs:
  - https://github.com/eyeblech/cinecli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Distribution is split across Python packaging, Homebrew, Nix flake usage, and
      source installs. The README documents pip install, nix run/profile commands, and
      editable source installs; Homebrew packages version 0.1.2 from the PyPI source
      distribution.
  package-nerd-significance:
    - >
      CineCLI is package-nerd interesting as a young Python CLI that reached several
      distribution channels quickly: PyPI, Homebrew, Nix flake usage, and GitHub source
      installs. It also shows the current pattern of terminal apps leaning on Rich and
      Typer for polished CLI UX.
  project-history:
    - >
      The official README presents CineCLI as a fast, cross-platform, minimal terminal
      app built with Python, Typer, Rich, Requests, and the YTS API. Its repository
      includes Python packaging metadata and Nix flake files.
  related-projects:
    - YTS API is the movie and torrent data source named by the official README.
    - >
      Typer and Rich are the Python CLI and terminal UI libraries named by the official
      README.
    - Nix flake support is documented as a first-class install and run path.
  sources:
    - https://formulae.brew.sh/api/formula/cinecli.json
    - https://formulae.brew.sh/formula/cinecli
    - https://github.com/eyeblech/cinecli#readme
  summary:
    - >
      CineCLI is a Python terminal movie browser that searches YTS, displays movie
      details, and launches magnet links or downloads torrent files.
  timeline:
    - '2026: Official README documents pip, Nix flake, source, and terminal command usage.'
    - '2026: Homebrew packages cinecli 0.1.2 from a Python source distribution.'
  usage:
    - >
      Documented commands include cinecli search, cinecli watch, and cinecli
      interactive. CineCLI delegates magnet handling to the operating system's
      registered magnet-link handler, such as qBittorrent or Transmission.
related-packages:
  - id: cask:transmission
    reason: >
      Transmission can serve as the registered BitTorrent client that receives the
      magnet links CineCLI launches through the operating system.
    rel: adjacent_workflow
    sources:
      - https://github.com/eyeblech/cinecli#how-magnet-launching-works
      - https://transmissionbt.com/
category: media
package-manager:
  brew: cinecli
package-manager-url: https://formulae.brew.sh/formula/cinecli
license: MIT
tags:
  - cli
  - magnet-links
  - movies
  - python
  - terminal
  - torrents
  - yts
description: Browse, inspect, and launch movie torrents directly from your terminal
executables:
  - cinecli
provenance:
  formula: cinecli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
