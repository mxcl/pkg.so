id: cask:julia-app
display-name: Julia
homepage: https://julialang.org/
repo: https://github.com/JuliaLang/julia
docs:
  - https://docs.julialang.org/
  - https://julialang.org/downloads/platform
  - https://pkgdocs.julialang.org/
config-file-location:
  unix: ~/.julia/config/startup.jl
  windows: C:\Users\USERNAME\.julia\config\startup.jl
credentials-file-location: null
history:
  adoption-history:
    - >
      Julia developed a substantial technical-computing community after its 2012 public
      introduction. By its tenth anniversary, the official project reported hundreds of
      thousands of users, teaching at hundreds of universities, and use in areas
      including medicine, climate modeling, materials research, and space-mission
      planning.
  package-nerd-significance:
    - >
      Julia is notable to package enthusiasts for combining a language runtime with an
      integrated environment and package manager. Pkg uses project environments,
      manifests, registries, artifacts, precompilation caches, and configurable depots,
      making reproducible scientific environments a central part of ordinary Julia
      usage.
    - >
      Package-manager users should distinguish the official Julia binaries and Juliaup
      from community OS packages: the Julia project recommends Juliaup and states that
      third-party package-manager builds are not maintained or endorsed by the project.
  project-history:
    - >
      Work on Julia began around 2009 at MIT, motivated by the desire for an open-source
      language combining interactive, high-level numerical programming with compiled
      performance, multiple dispatch, parallel computing, and familiar mathematical
      notation.
    - >
      Jeff Bezanson, Stefan Karpinski, Viral B. Shah, and Alan Edelman publicly
      introduced Julia in February 2012. Julia 1.0 followed in 2018, establishing the
      stable language line used for broader production adoption.
  related-projects:
    - Juliaup is the Julia project's recommended installer and version manager.
    - Pkg.jl is Julia's standard package manager.
    - >
      IJulia and Pluto.jl provide prominent notebook workflows, while the Julia VS Code
      extension provides an IDE workflow.
  sources:
    - https://github.com/JuliaLang/julia
    - https://julialang.org/blog/2012/02/why-we-created-julia/
    - https://julialang.org/blog/2022/02/10years/
    - https://pkgdocs.julialang.org/
  summary:
    - >
      Julia is an open-source, high-level, high-performance programming language created
      for technical and scientific computing. Its design seeks to bridge the traditional
      split between productive dynamic-language code and lower-level performance
      implementations.
  timeline:
    - '2009: Work on the Julia language began at MIT.'
    - '2012: Julia was publicly introduced through the official “Why We Created Julia” post.'
    - '2014: The first JuliaCon was held.'
    - '2018: Julia 1.0 was released.'
    - "2022: The project marked ten years since Julia's public introduction."
  usage:
    - >
      Users commonly run Julia interactively through its REPL, execute scripts, manage
      reproducible project environments with Pkg, and work through VS Code or notebook
      systems such as IJulia and Pluto.
    - >
      The default user depot is normally `~/.julia`. It contains registries, installed
      packages, project environments, repository clones, artifacts, caches,
      configuration, and REPL history; `JULIA_DEPOT_PATH` can relocate or extend it.
category: language-runtime
package-manager:
  brew-cask: julia-app
package-manager-url: https://formulae.brew.sh/cask/julia-app
tags:
  - julia
  - multiple-dispatch
  - numerical-computing
  - package-manager
  - programming-language
  - repl
  - scientific-computing
  - technical-computing
description: Programming language for technical computing
applications:
  - Julia-1.13.app
provenance:
  cask: julia-app
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
aliases:
  - julia
