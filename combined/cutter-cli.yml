id: brew:cutter-cli
display-name: Cutter
homepage: https://github.com/clear-code/cutter
repo: https://github.com/clear-code/cutter
docs:
  - https://github.com/clear-code/cutter#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Cutter's own USERS file lists projects that used it, including groonga, mroonga,
      milter manager, and other C/C++ or systems projects. That usage profile places it
      in the older Unix library-testing ecosystem: small, native-code projects that
      wanted richer test output without moving to a different language runtime.
  package-nerd-significance:
    - >
      Cutter is package-nerd relevant because it is the kind of test framework that
      often exists as a build-time dependency for other native packages. Its 2025
      release notes also show a packaging-oriented maintenance detail: moving official
      source archive distribution to GitHub Releases.
  project-history:
    - >
      The upstream GitHub repository was created in 2011, while the project files
      preserve an older SourceForge-oriented homepage reference. The README names Kouhei
      Sutou, Hiroyuki Ikezoe, and Yuto Hayamizu as program authors and describes Cutter
      as a C/C++ testing framework built around recursively loaded `test_*.so` test
      modules.
  related-projects:
    - >
      The upstream USERS file lists groonga, mroonga, milter manager, Hatohol, and
      several other projects as Cutter users.
  sources:
    - https://raw.githubusercontent.com/clear-code/cutter/master/README
    - https://raw.githubusercontent.com/clear-code/cutter/master/FEATURES
    - https://raw.githubusercontent.com/clear-code/cutter/master/USERS
    - https://raw.githubusercontent.com/clear-code/cutter/master/NEWS.md
    - https://api.github.com/repos/clear-code/cutter
    - https://api.github.com/repos/clear-code/cutter/releases?per_page=10
  summary:
    - >
      Cutter is an xUnit-family unit testing framework for C and C++. Its README
      emphasizes easy test writing, debugging-oriented output, and tests built as shared
      libraries.
  timeline:
    - '2011: Public GitHub repository created.'
    - '2015: GitHub release 1.2.5 published.'
    - '2019: GitHub release 1.2.7 published.'
    - '2025: Release 1.2.9 published, with source archives distributed through GitHub Releases.'
  usage:
    - >
      The normal command shape is `cutter [OPTION ...] TEST_DIRECTORY`; the runner
      searches recursively for shared-library tests and reports progress, failures,
      errors, pending tests, notifications, summaries, and optional XML output. Its
      feature list includes fixtures, automatic test discovery, many assertions,
      coverage support, backtraces, and multi-process or multi-thread support.
related-packages:
  - id: brew:check
    reason: >
      Choose Check for C-only testing with each test isolated in a separate address
      space; choose Cutter when C++ support and recursively loaded shared-library test
      modules better fit the project.
    rel: alternative
    sources:
      - https://github.com/clear-code/cutter
      - https://libcheck.github.io/check/
      - https://github.com/libcheck/check
category: developer-tools
package-manager:
  apk: cutter
  brew: cutter-cli
  macports: cutter
  nix: cutter
  pacman: cutter
  scoop: extras/cutter
  winget: Rizin.Cutter
package-manager-url: https://formulae.brew.sh/formula/cutter-cli
license: LGPL-3.0-or-later
tags:
  - c
  - cli
  - cpp
  - unit-testing
  - xunit
description: Unit Testing Framework for C and C++
executables:
  - cut-diff
  - cutter
provenance:
  formula: cutter-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
