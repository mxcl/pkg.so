id: cask:homerow
display-name: Homerow
homepage: https://www.homerow.app/
repo: https://github.com/nchudleigh/homerow
docs:
  - https://www.homerow.app/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homerow is aimed at keyboard-focused macOS users, including people accustomed to
      Vimium-style navigation. The official site describes compatibility with native
      applications and web-based desktop applications, while the public repository
      provides an issue tracker for compatibility reports.
  package-nerd-significance:
    - >
      Homerow brings browser-style hint navigation to the wider macOS interface. It is
      useful in reproducible Mac setups because Homebrew Cask can install the
      application while its shortcuts replace many pointer-driven interactions.
  project-history:
    - >
      Homerow is an independently developed macOS keyboard-navigation utility. Its
      public repository documents searching for interface elements, selecting generated
      labels, clicking, and scrolling with HJKL-style controls.
    - >
      The stable 1.0 release arrived in June 2024. Later releases added additional
      navigation modes, application compatibility, alternative keyboard-layout support,
      and redesigned settings.
  related-projects:
    - >
      The official user guide cites Vimium and Vimperator as inspirations for its
      keyboard-driven navigation model.
    - >
      The guide also documents optional Hyper Key workflows using Hyperkey or
      Karabiner-Elements.
  sources:
    - https://github.com/nchudleigh/homerow
    - https://www.homerow.app/
    - https://www.homerow.app/changelog
  summary:
    - >
      Homerow is a macOS accessibility and productivity utility that assigns keyboard
      labels to interface elements, enabling users to click, navigate, and scroll
      without a mouse.
  timeline:
    - '2024-06-12: Homerow 1.0 was released.'
    - '2024-12-09: Homerow 1.3 introduced redesigned settings.'
    - >
      2026-03-15: Homerow 1.5 added Mission Control navigation and further Chromium
      improvements.
  usage:
    - >
      Users activate Homerow with a shortcut, search for an interface element or type
      its displayed label, and press Return to click it. A labels-only workflow is also
      available.
    - >
      A separate scrolling mode provides HJKL navigation, faster dash scrolling,
      movement among scroll areas, and numeric selection of a scroll area. macOS
      Accessibility permission is required for interface control.
category: productivity
