id: brew:gtree
display-name: gtree
homepage: https://ddddddo.github.io/gtree/
repo: https://github.com/ddddddO/gtree
docs:
  - https://ddddddo.github.io/gtree
  - https://github.com/ddddddO/gtree#readme
  - https://pkg.go.dev/github.com/ddddddO/gtree
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gtree moved into package-manager workflows through Go modules and release
      artifacts, with the README documenting installation through `go install`,
      Homebrew, Nix, MacPorts, Scoop, Docker images, and binary packages. The input
      metadata records Homebrew, MacPorts, and Nix packaging.
  package-nerd-significance:
    - >
      gtree is not a replacement for the classic Unix `tree` command; it is more of a
      programmable tree printer and scaffolding verifier. That makes it interesting to
      package nerds who care about small Go CLIs, documentation examples, generated
      project skeletons, and terminal-friendly visualization of nested data.
  project-history:
    - >
      The public repository traces back to a first commit on 2019-02-12. Its README
      frames the library as a simple way for Go programs to output tree structures, then
      documents CLI surfaces around Markdown and structured-data input.
    - >
      The project split its practical surface into the `gtree` CLI for Markdown-based
      trees, directory creation, and directory verification, plus `xtree` for JSON,
      YAML, and TOML input. A WebAssembly-backed web page, Tree Maker, extends the same
      Markdown-to-tree idea into a browser tool.
  related-projects:
    - >
      The README acknowledges related tree-output tools for cloud storage, including
      stree for Amazon S3 and gcstree for Google Cloud Storage. In use, gtree also sits
      near the classic `tree` utility, Markdown processors, and small JSON/YAML/TOML
      inspection tools.
  sources:
    - https://api.github.com/repos/ddddddO/gtree
    - https://api.github.com/repos/ddddddO/gtree/releases?per_page=100
    - https://ddddddo.github.io/gtree/
    - https://github.com/ddddddO/gtree
    - https://pkg.go.dev/github.com/ddddddO/gtree
  summary:
    - >
      gtree is a Go package and CLI family for turning structured input into ASCII
      trees, directory skeletons, and verification checks. It began as a
      developer-facing Go library, then grew into command-line tooling for Markdown,
      JSON, YAML, and TOML tree generation.
  timeline:
    - '2019-02-12: Public repository first commit.'
    - '2021-05-30: GitHub repository metadata records repository creation.'
    - '2022-08-19: Release metadata includes v1.7.12.'
    - >
      2020s: README documents Go package, Markdown CLI, WebAssembly Tree Maker, and
      xtree structured-data workflows.
  usage:
    - >
      Developers can call package functions such as `OutputFromRoot`, `MkdirFromRoot`,
      `VerifyFromRoot`, and Markdown equivalents from Go code. CLI users pipe Markdown
      unordered lists into `gtree output`, use templates to create directories and
      files, or compare a Markdown description with an existing filesystem tree.
    - >
      `xtree` covers another common package-user workflow: piping JSON, YAML, or TOML
      into a tree renderer for quick inspection of nested configuration or API-shaped
      data.
related-packages:
  - id: brew:tree
    reason: >
      Use tree to display an existing filesystem hierarchy; gtree is the stronger choice
      when the hierarchy starts as Markdown and must also be created or verified.
    rel: adjacent_workflow
    sources:
      - https://github.com/ddddddO/gtree#readme
      - https://github.com/Old-Man-Programmer/tree#readme
category: developer-tools
package-manager:
  brew: gtree
  macports: gtree
  nix: gtree
package-manager-url: https://formulae.brew.sh/formula/gtree
license: BSD-2-Clause
tags:
  - cli
  - directory-tree
  - documentation
  - go
  - markdown
description: Generate directory trees and directories using Markdown or programmatically
executables:
  - gtree
provenance:
  formula: gtree
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
