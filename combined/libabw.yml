id: brew:libabw
display-name: libabw
homepage: https://wiki.documentfoundation.org/DLP/Libraries/libabw
repo: https://git.libreoffice.org/libabw
docs:
  - https://wiki.documentfoundation.org/DLP/Libraries/libabw
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LibreOffice added an AbiWord import filter around the external libabw library in
      2013, tying the small parser library to a major office-suite import path. The
      Document Foundation continued to list libabw among the Document Liberation
      libraries in later project updates.
  package-nerd-significance:
    - >
      libabw is package-nerd catnip because it is a tiny library whose whole point is
      rescuing old office documents. It represents the long tail of format support that
      keeps distributions useful for archival and migration work.
  project-history:
    - >
      The Document Foundation's Document Liberation Project was created to recover user
      data from legacy and proprietary document formats by building reusable import
      libraries. libabw covers AbiWord documents in that family, with sources hosted
      under LibreOffice infrastructure.
  related-projects:
    - >
      Related projects include AbiWord, LibreOffice Writer, the Document Liberation
      Project, libwpd, libwps, libmspub, libvisio, and other file-format import
      libraries.
  sources:
    - https://blog.documentfoundation.org/blog/2018/01/22/dlp-five-new-libraries/
    - >
      https://blog.documentfoundation.org/blog/2019/08/21/updates-from-the-document-liberation-project/
    - >
      https://cgit.freedesktop.org/libreoffice/core/commit/?id=10eaaac020e32f0bbb3869cecee94df0955b6a3b
    - https://git.libreoffice.org/libabw
    - https://wiki.documentfoundation.org/DLP/Libraries/libabw
    - https://www.documentliberation.org/
    - https://www.documentliberation.org/about/
  summary:
    - >
      libabw is a Document Liberation Project library for parsing AbiWord documents. Its
      job is narrow but useful: keep .abw files readable by conversion tools and office
      suites even when AbiWord itself is not installed.
  timeline:
    - '2013: LibreOffice added an AbiWord import filter backed by external libabw build files.'
    - >
      2018-01-22: The Document Foundation listed libabw among Document Liberation
      Project libraries for document import.
    - >
      2019-08-21: The Document Foundation announced libabw 0.1.3 with OSS-Fuzz-driven
      hardening fixes.
  usage:
    - >
      Users encounter libabw through LibreOffice imports or command-line converters such
      as abw2html, abw2raw, and abw2text. The package is mostly a plumbing dependency
      for document migration and test conversion.
related-packages:
  - id: brew:writerperfect
    reason: >
      writerperfect uses libabw as an optional importer to convert AbiWord documents
      into ODF or EPUB from the command line.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/libwpd/wiki/writerperfect/
      - https://www.documentliberation.org/projects/
