id: cask:wispr-flow
display-name: Wispr Flow
homepage: https://wisprflow.ai/
repo: null
docs:
  - https://docs.wisprflow.ai/
  - https://wisprflow.ai/support
config-file-location:
  macos:
    - ~/Library/Application Support/Wispr Flow/config.json
    - ~/Library/Application Support/Flow/prefs.yml
  windows: '%APPDATA%\Wispr Flow\config.json'
credentials-file-location:
  macos: ~/Library/Application Support/Wispr Flow/session.json
  windows: '%APPDATA%\Wispr Flow\session.json'
history:
  adoption-history:
    - >
      Wispr positions Flow as a cross-platform consumer and workplace dictation product
      available on macOS, Windows, iOS, and Android. Official setup documentation covers
      individual accounts, enterprise SSO, SCIM provisioning, external audio devices,
      and managed-team onboarding.
    - >
      Adoption centers on users who want to dictate directly into existing applications
      instead of moving text through a separate transcription editor.
  package-nerd-significance:
    - >
      Flow represents the newer class of AI-assisted input utilities: it combines speech
      recognition with contextual formatting and rewriting, then inserts the result into
      arbitrary applications.
    - >
      For desktop-package users, its significance lies in being a system-wide input tool
      whose usefulness depends on microphone, accessibility, and automation permissions
      rather than a traditional document-oriented application.
  project-history:
    - >
      Wispr AI, Inc. was founded in 2023. Flow is the company’s first product and
      applies its conversational-interface work to everyday voice dictation.
    - >
      The product expanded into a multi-platform service with consumer, Pro, team, and
      enterprise workflows.
  related-projects:
    - >
      Wispr Flow API: Wispr’s separately documented developer interface for audio
      transcription.
    - >
      Operating-system dictation services: built-in alternatives whose input role Flow
      augments.
  sources:
    - https://docs.wisprflow.ai/articles/3152211871-setup-guide
    - https://docs.wisprflow.ai/articles/3467817258-security-and-compliance-faq
    - https://wisprflow.ai/about
    - https://wisprflow.ai/support
  summary:
    - >
      Wispr Flow is an AI-assisted voice-dictation application that transcribes speech,
      applies contextual editing and formatting, and inserts text into other
      applications.
  timeline:
    - '2023: Wispr AI, Inc. is founded.'
    - >
      2026: Official documentation describes Flow across macOS, Windows, iOS, and
      Android, including consumer and enterprise setup.
  usage:
    - >
      Users invoke Flow’s dictation control or shortcut inside a text field, speak
      naturally, and receive formatted text in the active application.
    - >
      Initial desktop setup requires sign-in plus microphone and accessibility
      permissions. The service supports contextual editing, multiple languages, external
      audio devices, and hands-free workflows.
category: productivity
