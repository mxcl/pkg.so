id: brew:ncrack
display-name: Ncrack
homepage: https://nmap.org/ncrack/
repo: https://github.com/nmap/ncrack
docs:
  - https://nmap.org/ncrack
  - https://nmap.org/ncrack/man.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ncrack's adoption came from the Nmap ecosystem and password-auditing niche:
      security professionals used it to test large networks for weak or default
      passwords. The official page later added a deprecation notice saying Ncrack is
      useful for some purposes but not fully developed or maintained, and that Nmap's
      focus shifted to brute-force scripts in NSE.
  package-nerd-significance:
    - >
      Ncrack is significant less because it became the dominant password-auditing tool
      and more because it shows how the Nmap community tried to split credential testing
      into a specialized engine. The later deprecation notice is part of the package
      story: keeping it available helps reproduce old workflows, but users should notice
      that active Nmap credential work moved elsewhere.
  project-history:
    - >
      The official Ncrack page says it began as a Google Summer of Code project in 2009.
      The man page describes it as a Summer 2009 project and beta-quality software,
      while a September 10, 2010 nmap-dev announcement calls Ncrack 0.3ALPHA a post-SoC
      release and highlights new SMB and RDP modules.
  related-projects:
    - >
      Nmap, Nmap Scripting Engine, Nsock, password auditing tools, Hydra-like credential
      testing workflows
  sources:
    - https://formulae.brew.sh/formula/ncrack
    - https://nmap.org/ncrack/
    - https://nmap.org/ncrack/man.html
    - https://seclists.org/nmap-dev/2010/q3/697
  summary:
    - >
      Ncrack is the Nmap project's standalone network-authentication cracking tool. It
      was built for high-speed, parallel credential testing across many network
      services, with Nmap-like command-line syntax, timing controls, runtime
      interaction, and a modular protocol architecture.
  timeline:
    - 'Summer 2009: Ncrack starts as a Google Summer of Code project.'
    - 'September 10, 2010: Ncrack 0.3ALPHA announced with SMB and RDP modules.'
    - >
      2019: Official page identifies 0.7 as the latest release and says main focus
      shifted to Nmap NSE brute-force scripts.
  usage:
    - >
      Package users run ncrack against authorized targets with service-qualified host
      specs, username and password lists, timing templates, and per-service options. It
      can consume Nmap target output formats, report discovered credentials, and test
      modules such as SSH, RDP, FTP, Telnet, HTTP(S), SMB, VNC, databases, and other
      network protocols.
related-packages:
  - id: brew:nmap
    reason: >
      Choose Nmap's NSE brute-force scripts for actively maintained credential-auditing
      workflows; Ncrack upstream explicitly says project focus moved there, and Nmap
      documents scripts for many network services.
    rel: alternative
    sources:
      - https://nmap.org/ncrack/
      - https://nmap.org/nsedoc/categories/brute.html
  - id: brew:hydra
    reason: >
      Choose Hydra when you need another dedicated, actively maintained network-login
      auditing CLI with a broad collection of protocol modules.
    rel: alternative
    sources:
      - https://nmap.org/ncrack/
      - https://github.com/vanhauser-thc/thc-hydra
category: security
