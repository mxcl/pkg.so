id: brew:khal
display-name: khal
homepage: https://lostpackets.de/khal/
repo: https://github.com/pimutils/khal
docs:
  - https://khal.readthedocs.io/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/khal/config
    - ~/.config/khal/config
    - ~/.khal/khal.conf
    - ./khal.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      khal belongs to the Unix personal-information-management stack built around
      vdirsyncer and local vdir storage. Its README documents packaging for
      Debian/Ubuntu, Nix, Arch, Homebrew, Fedora, and FreeBSD, and notes that khal is
      packaged for most operating systems.
    - >
      The project appealed to users who wanted scriptable, offline-friendly calendar
      workflows instead of browser-only calendaring. The split between khal and
      vdirsyncer kept synchronization separate from presentation, which matched the Unix
      style of composing small tools.
  package-nerd-significance:
    - >
      khal is significant in package-manager culture as part of the terminal PIM family:
      it turns CalDAV/iCalendar data into plain local files and a packageable CLI,
      making calendars available to shells, text UIs, and dotfile-managed systems.
  project-history:
    - >
      The project copyright and changelog place khal's early development in the
      2013-2014 period. By September 2014, version 0.3.0 introduced unified
      Sphinx-generated documentation and changed the configuration syntax. Version 0.5.0
      on June 1, 2015 added search, at, birthday-calendar support, recurring-event
      options, and Python 3 support.
    - >
      Version 0.8.0 on April 13, 2016 dropped Python 2 support, raised the vdirsyncer
      dependency, added the configure command, and moved the git repository to the
      pimutils GitHub organization. Later releases kept pace with Python and dependency
      changes, including 0.11.0 in April 2023 dropping Python versions before 3.8 and
      0.14.0 in March 2026 dropping Python versions before 3.10.
  related-projects:
    - >
      vdirsyncer is the main companion synchronizer. khard is the related console
      address-book tool in the same terminal PIM ecosystem, while gcalcli and
      calendar-cli are documented alternatives with different storage and service
      assumptions.
  sources:
    - https://formulae.brew.sh/formula/khal
    - https://github.com/pimutils/khal
    - https://khal.readthedocs.io/
    - https://raw.githubusercontent.com/pimutils/khal/master/CHANGELOG.rst
    - https://raw.githubusercontent.com/pimutils/khal/master/README.rst
  summary:
    - >
      khal is a standards-based command-line and terminal calendar program for local
      iCalendar/vdir collections, commonly paired with vdirsyncer for CalDAV
      synchronization. Its interactive mode, ikhal, gives terminal users a text UI for
      browsing and editing calendars.
  timeline:
    - '2014-09-03: khal 0.3.0 introduced unified Sphinx documentation.'
    - '2015-06-01: khal 0.5.0 added search, at, birthday support, and Python 3 support.'
    - >
      2016-04-13: khal 0.8.0 dropped Python 2 support and moved to the pimutils GitHub
      organization.
    - '2023-04-23: khal 0.11.0 dropped Python versions before 3.8.'
    - >
      2026-03-24: khal 0.14.0 dropped Python versions before 3.10 and added Python 3.14
      support.
  usage:
    - >
      Users configure one or more local calendar collections, often synchronized from
      CalDAV by vdirsyncer, then use khal for agenda views, date queries, quick event
      creation, imports, searches, and terminal UI editing through ikhal.
related-packages:
  - id: brew:vdirsyncer
    reason: >
      Use vdirsyncer alongside khal to synchronize khal's local vdir calendars with
      CalDAV servers; khal's official configuration guide explicitly requires it for
      CalDAV.
    rel: adjacent_workflow
    sources:
      - https://khal.readthedocs.io/en/master/configure.html
      - https://vdirsyncer.pimutils.org/en/stable/tutorial.html
category: productivity
package-manager:
  apk: khal
  brew: khal
  debian: khal
  dnf: khal
  nix: khal
  pacman: khal
  ubuntu: khal
package-manager-url: https://formulae.brew.sh/formula/khal
license: MIT
tags:
  - caldav
  - calendar
  - cli
  - python
  - terminal
description: CLI calendar application
executables:
  - ikhal
  - khal
provenance:
  formula: khal
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
