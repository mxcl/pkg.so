id: brew:freeradius-server
display-name: FreeRADIUS Server
homepage: https://freeradius.org/
repo: https://github.com/FreeRADIUS/freeradius-server
docs:
  - https://www.freeradius.org/documentation
  - https://www.freeradius.org/documentation/freeradius-server/3.2.9/index.html
  - https://doc.freeradius.org/
  - https://wiki.freeradius.org/
config-file-location:
  unix: /etc/raddb/radiusd.conf
credentials-file-location:
  unix:
    - /etc/raddb/clients.conf
    - /etc/raddb/mods-config/files/authorize
history:
  adoption-history:
    - >
      The official site describes FreeRADIUS as the most widely used RADIUS server in
      the world, used by major ISPs, telecommunications companies, eduroam, cloud
      identity providers, equipment vendors, and token-card manufacturers. The supplied
      package facts list Homebrew and openSUSE for this Homebrew package record, while
      upstream also points users to project packages and release notes.
  package-nerd-significance:
    - >
      FreeRADIUS is a classic heavyweight network-service package: it ships a daemon,
      many CLI tools, policy language, modules, dictionaries, SQL and directory
      integrations, sample configuration, documentation, and support utilities. Package
      details such as default config paths, module installation, database backends, and
      debug symbols directly affect whether administrators can deploy it.
  project-history:
    - >
      The official About page says FreeRADIUS was founded in June 1999 by Miquel van
      Smoorenburg and Alan DeKok, with an alpha release in August 1999 and version 0.1
      in May 2001. The project later expanded beyond the server into related RADIUS
      client, Apache, and PAM modules.
  related-projects:
    - >
      Official related projects include freeradius-client, mod_auth_radius, and
      pam_radius_auth. FreeRADIUS is also closely tied to RADIUS, eduroam, SQL and LDAP
      backends, Active Directory, and network access equipment integrations.
  sources:
    - https://github.com/FreeRADIUS/freeradius-server
    - https://raw.githubusercontent.com/FreeRADIUS/freeradius-server/master/README.md
    - https://www.freeradius.org/
    - https://www.freeradius.org/about/
    - https://www.freeradius.org/documentation
  summary:
    - >
      FreeRADIUS Server is a high-performance, highly configurable open source RADIUS
      and multi-protocol policy server. It is one of the canonical AAA packages for
      ISPs, enterprises, education networks, Wi-Fi, VPNs, and identity infrastructure.
  timeline:
    - '1999: FreeRADIUS founded in June; first public alpha released in August.'
    - '2001: Version 0.1 released in May.'
    - >
      2010s: FreeRADIUS became a default open source RADIUS choice for ISPs, education
      roaming, and enterprise networks.
    - >
      2020s: The server is described by upstream as authenticating hundreds of millions
      of users daily and supporting RADIUS, DHCP, DNS, TACACS+, and VMPS.
  usage:
    - >
      Administrators run radiusd and related utilities to centralize authentication,
      authorization, and accounting for 802.1X Wi-Fi, dialup, PPPoE, VPN, VoIP, and
      other network access systems. The upstream README emphasizes starting from the
      default configuration, running radiusd -X for debugging, and making small tested
      configuration changes.
related-packages:
  - id: brew:freediameter
    reason: >
      Choose freeDiameter when an AAA deployment requires Diameter peer routing and
      Diameter applications; retain FreeRADIUS for RADIUS clients and RADIUS-centered
      network-access policy.
    rel: alternative
    sources:
      - https://github.com/freeDiameter/freeDiameter#readme
      - https://www.freeradius.org/
category: networking
package-manager:
  brew: freeradius-server
  zypper: freeradius-server
package-manager-url: https://formulae.brew.sh/formula/freeradius-server
license: GPL-2.0-or-later AND LGPL-2.1-or-later
tags:
  - aaa
  - accounting
  - authentication
  - authorization
  - cli
  - network-policy
  - radius
  - server
description: High-performance and highly configurable RADIUS server
executables:
  - checkrad
  - dhcpclient
  - map_unit
  - rad_counter
  - radattr
  - radclient
  - radcrypt
  - raddebug
  - radeapclient
  - radiusd
  - radlast
  - radmin
  - radsecret
  - radsniff
  - radsqlrelay
  - radtest
  - radwho
  - radzap
  - rc.radiusd
  - rlm_ippool_tool
  - rlm_sqlippool_tool
  - smbencrypt
provenance:
  formula: freeradius-server
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
