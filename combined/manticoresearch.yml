id: brew:manticoresearch
display-name: Manticore Search
homepage: https://manticoresearch.com
repo: https://github.com/manticoresoftware/manticoresearch
docs:
  - https://manual.manticoresearch.com/
config-file-location:
  linux: /etc/manticoresearch/manticore.conf
  windows: C:\Manticore\manticore.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The README names Craigslist, Socialgist, PubChem, Rozetka, and others as users of
      Manticore for search and stream filtering. It also points to official package
      repositories, Docker images, Homebrew installation, cloud offerings, a forum,
      Slack, Telegram, and language clients, indicating adoption as both server software
      and developer-facing infrastructure.
    - >
      By 2026 the repository had over ten thousand GitHub stars and hundreds of forks.
      That is a significant footprint for an open-source search engine outside the
      Elasticsearch/OpenSearch mainstream.
  package-nerd-significance:
    - >
      Manticore matters to package maintainers because it is not just a CLI: it ships a
      daemon, indexer tools, config files, data directories, service integration,
      protocol compatibility, optional authentication, and language clients. Its Sphinx
      lineage also makes it part of the long-running history of self-hosted full-text
      search engines.
  project-history:
    - >
      The official README says Manticore Search was forked from Sphinx 2.3.2 in 2017.
      The public GitHub repository was created in June 2017, and the README still
      carries the historical line from Sphinx to Manticore while presenting Manticore as
      its own database and search server.
    - >
      The project is implemented primarily in C++ and keeps the search-daemon heritage
      visible through commands such as `searchd`, `indexer`, and configuration in
      `manticore.conf`. Over time, the README has expanded the positioning from
      full-text search to a broader search database with real-time indexing, SQL,
      JSON/HTTP APIs, vector search, replication, backup tooling, and client libraries.
  related-projects:
    - Sphinx Search is the upstream project from which Manticore was forked.
    - Manticore Columnar Library is listed by the README as supporting columnar storage.
    - >
      Official clients exist for PHP, Python, Python asyncio, JavaScript, TypeScript,
      Java, Elixir, Go, and Rust.
  sources:
    - https://github.com/manticoresoftware/manticoresearch
    - https://github.com/manticoresoftware/manticoresearch#readme
    - https://github.com/manticoresoftware/manticoresearch/releases/tag/27.1.5
    - https://manual.manticoresearch.com/
    - https://manual.manticoresearch.com/Security/Authentication_and_authorization
    - https://manual.manticoresearch.com/Starting_the_server/Manually
  summary:
    - >
      Manticore Search is an open-source search database focused on full-text, vector,
      and hybrid search with SQL and HTTP interfaces. It is positioned by its
      maintainers as a fast, easy-to-use alternative to Elasticsearch.
  timeline:
    - '2017: Manticore Search forked from Sphinx 2.3.2 according to the official README.'
    - '2017: Public GitHub repository created.'
    - '2025: release-15.1.0 published.'
    - '2026: 27.1.5 release published.'
  usage:
    - >
      Users run Manticore as a service or container, configure `searchd`, create tables,
      insert data, and query through MySQL-compatible SQL or HTTP JSON APIs. The manual
      documents explicit startup with `searchd --config
      /etc/manticoresearch/manticore.conf`, Linux service management, and Windows
      startup with `searchd -c manticore.conf`.
    - >
      The README emphasizes full-text operators, ranking, filtering, faceting,
      geospatial search, hybrid search, KNN/vector search, spell correction, stream
      filtering, replication, backup and restore, data import from databases or files,
      and clients for languages including PHP, Python, JavaScript, TypeScript, Java,
      Elixir, Go, and Rust.
category: data
package-manager:
  brew: manticoresearch
  nix: manticoresearch
  zypper: sphinx
package-manager-url: https://formulae.brew.sh/formula/manticoresearch
license: GPL-3.0-or-later AND GPL-2.0-only AND (Unlicense OR MIT)
tags:
  - cli
  - database
  - full-text-search
  - indexing
  - search-engine
description: Open source text search engine
executables:
  - index_converter
  - indexer
  - indextool
  - searchd
  - spelldump
  - wordbreaker
provenance:
  formula: manticoresearch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
