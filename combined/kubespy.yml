id: brew:kubespy
display-name: kubespy
homepage: https://github.com/pulumi/kubespy
repo: https://github.com/pulumi/kubespy
docs:
  - https://github.com/pulumi/kubespy#readme
config-file-location: null
credentials-file-location:
  unix: ~/.kube/config
  windows: $HOME\.kube\config
history:
  adoption-history:
    - >
      kubespy remained a focused utility rather than a broad platform. Its GitHub
      repository accumulated thousands of stars and packaging across Homebrew, MacPorts,
      Nix, Scoop, and zypper metadata, which fits the pattern of a CLI that is useful
      during debugging but not usually installed as a cluster component.
  package-nerd-significance:
    - >
      kubespy is notable because it packages Kubernetes watch/discovery-client behavior
      as a small observability command. It sits in the same mental drawer as kubectl get
      -w, stern, and k9s, but it is narrower: it is about making controller transitions
      readable during rollout and failure analysis.
  project-history:
    - >
      Pulumi introduced kubespy publicly on September 18, 2018 as a small tool for
      displaying changes made to Kubernetes objects in real time. The repository README
      says the tool grew out of Pulumi CLI work on making Kubernetes deployments
      predictable, and the command set settled around status, changes, trace, and record
      views over arbitrary Kubernetes resources.
  related-projects:
    - >
      Related tools include Pulumi CLI, kubectl, Kubernetes external kubectl plugins,
      stern-style log tailers, and TUI dashboards such as k9s. kubespy is narrower than
      those tools because it focuses on object-status evolution rather than log
      aggregation or full cluster browsing.
  sources:
    - https://formulae.brew.sh/formula/kubespy
    - https://github.com/pulumi/kubespy
    - https://github.com/pulumi/kubespy/releases
    - >
      https://www.pulumi.com/blog/kubespy-and-the-lifecycle-of-a-kubernetes-pod-in-four-images/
    - >
      https://www.pulumi.com/blog/kubespy-trace-a-real-time-view-into-the-heart-of-a-kubernetes-service/
  summary:
    - >
      kubespy is a Pulumi-origin Kubernetes diagnostic CLI for watching API objects
      change in real time. Its package-nerd appeal is that it exposes Kubernetes
      controller behavior from the terminal instead of hiding rollout state behind a
      dashboard or a single kubectl status line.
  timeline:
    - '2018: Pulumi announced kubespy with a blog post on watching Pod lifecycle changes.'
    - '2018: Follow-up Pulumi posts used kubespy trace to explain Services and Deployments.'
    - '2024: The GitHub release page listed v0.6.3 with ARM64 support.'
  usage:
    - >
      Users run kubespy against a resource such as a Pod, Service, or Deployment to see
      status diffs, object changes, or a higher-level trace of related resources. The
      README also documents use as a kubectl plugin by installing it as kubectl-spy,
      reflecting the Kubernetes 1.12 plugin convention.
related-packages:
  - id: brew:pulumi
    reason: >
      Pulumi can create or update Kubernetes resources while kubespy, which originated
      from Pulumi's deployment-status work, provides a live view of the resulting object
      transitions.
    rel: adjacent_workflow
    sources:
      - https://github.com/pulumi/kubespy#readme
      - >
        https://www.pulumi.com/blog/kubespy-and-the-lifecycle-of-a-kubernetes-pod-in-four-images/
      - https://www.pulumi.com/docs/iac/clouds/kubernetes/
category: cloud-infrastructure
