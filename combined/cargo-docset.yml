id: brew:cargo-docset
display-name: cargo-docset
homepage: https://github.com/Robzz/cargo-docset
repo: https://github.com/Robzz/cargo-docset
docs:
  - https://github.com/Robzz/cargo-docset#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears specialized: the supplied package-manager facts list Homebrew and
      Nix packages, and crates.io shows modest lifetime downloads. It fits a narrower
      offline-documentation workflow than general Cargo dependency or build tooling.
  package-nerd-significance:
    - >
      cargo-docset is interesting because it bridges Rust's native rustdoc output with
      the older Dash/Zeal docset ecosystem. It shows how package metadata, generated
      HTML, and SQLite indexes can be stitched together without inventing a new
      documentation browser.
    - >
      For maintainers who work offline or across many local crates, it packages a
      workspace's documentation into a format that external developer tools already
      understand.
  project-history:
    - >
      The GitHub repository was created in August 2019, and the crate was published on
      crates.io the same month. The README defines the tool around generating Dash/Zeal
      docsets for Rust packages and their dependencies.
    - >
      Rather than parsing Rust items directly, cargo-docset runs Cargo to generate
      documentation, walks the generated documentation directory, and fills a SQLite
      database in the docset format. That implementation choice keeps the project small
      and aligned with rustdoc output.
  related-projects:
    - rustdoc and `cargo doc` generate the HTML documentation that cargo-docset packages.
    - Dash and Zeal are the docset browsers targeted by the generated output.
    - SQLite is used by the Dash docset format for indexing.
  sources:
    - https://api.github.com/repos/Robzz/cargo-docset
    - https://crates.io/api/v1/crates/cargo-docset
    - https://github.com/Robzz/cargo-docset#readme
    - https://raw.githubusercontent.com/Robzz/cargo-docset/master/README.md
    - input.source_facts.package-manager
  summary:
    - >
      cargo-docset is a Cargo subcommand that converts rustdoc output for a crate or
      workspace into a Dash- and Zeal-compatible docset. It serves developers who want
      offline, indexed Rust API documentation inside docset browsers.
  timeline:
    - '2019: Robzz/cargo-docset GitHub repository created.'
    - '2019: cargo-docset crate first published on crates.io.'
    - '2022: crates.io metadata shows the 0.3.1 release as the current line.'
  usage:
    - >
      Users run `cargo docset` in a crate directory. By default the generated docset is
      placed in `target/docset`, then copied into the Dash or Zeal docset directory.
    - >
      The command supports many `cargo doc`-style options, including feature flags,
      package selection, target selection, workspace generation, and private item
      documentation.
related-packages:
  - id: cask:dash
    reason: >
      cargo-docset creates the indexed docset bundle, while Dash installs and searches
      that bundle as offline API documentation on macOS.
    rel: adjacent_workflow
    sources:
      - https://github.com/Robzz/cargo-docset#readme
      - https://kapeli.com/dash_guide
      - https://kapeli.com/docsets
category: developer-tools
package-manager:
  brew: cargo-docset
  nix: cargo-docset
package-manager-url: https://formulae.brew.sh/formula/cargo-docset
license: Apache-2.0
tags:
  - cargo
  - cli
  - dash
  - docset
  - documentation
  - rust
  - zeal
description: Cargo subcommand to generate a Dash/Zeal docset for your Rust packages
executables:
  - cargo-docset
provenance:
  formula: cargo-docset
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
