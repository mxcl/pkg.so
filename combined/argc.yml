id: brew:argc
display-name: Argc
homepage: https://github.com/sigoden/argc
repo: https://github.com/sigoden/argc
docs:
  - https://github.com/sigoden/argc/blob/main/docs/specification.md
  - https://github.com/sigoden/argc/tree/main/docs
  - https://github.com/sigoden/argc#readme
config-file-location:
  unix: Argcfile.sh
  windows: Argcfile.sh
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Cargo, Homebrew/Linuxbrew, AUR, release
      binaries, a shell installer, and GitHub Actions. Homebrew builds it as a Rust
      formula, generates completions, and tests command-runner creation with `argc
      --argc-create`, which reflects its dual role as both parser generator and task
      runner.
  package-nerd-significance:
    - >
      Argc is package-nerd bait because it gives Bash scripts a structured CLI surface
      without forcing a rewrite in Go, Rust, Python, or Node. It also sits at an
      interesting boundary: installed as one compiled binary, but primarily useful for
      making shell scripts more distributable, documented, and completion-friendly.
  project-history:
    - >
      The GitHub repository was created in February 2022, and the earliest GitHub
      release visible through the releases API is v0.2.1 from the same month. The
      project has since grown into a 1.x tool with documented specifications for comment
      tags such as `@cmd`, `@arg`, `@option`, `@flag`, `@env`, and `@meta`.
  related-projects:
    - >
      The README points to argc-completions for shell-completion behavior and
      install-binary for GitHub Actions installation, tying argc to the author's
      small-tool ecosystem around command-line distribution.
  sources:
    - https://api.github.com/repos/sigoden/argc
    - https://api.github.com/repos/sigoden/argc/releases
    - https://github.com/sigoden/argc#readme
    - https://github.com/sigoden/argc/blob/main/docs/command-runner.md
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/a/argc.rb
  summary:
    - >
      Argc is a Rust-distributed command-line tool for writing Bash CLIs and command
      runners from annotated shell comments. It generates argument parsing, usage text,
      completions, man pages, and standalone Bash scripts while keeping the user's
      command logic in ordinary shell functions.
  timeline:
    - '2022: GitHub repository created.'
    - '2022: v0.2.1 published as the earliest GitHub release visible through the releases API.'
    - '2024: v1.x line continues with regular feature releases.'
    - '2026: v1.24.0 published and packaged by Homebrew.'
  usage:
    - >
      In CLI mode, a script adds comment tags above Bash code and evaluates `argc
      --argc-eval` to bind parsed arguments into `argc_` variables. In command-runner
      mode, users keep recipes in `Argcfile.sh`, generate one with `argc --argc-create`,
      and run recipes much like a Makefile-style task runner.
related-packages:
  - id: brew:just
    reason: >
      Choose just when you want a purpose-built `justfile` recipe language; choose Argc
      when recipes should remain Bash functions and also expose structured CLI
      arguments.
    rel: alternative
    sources:
      - https://github.com/sigoden/argc/blob/main/docs/command-runner.md
      - https://just.systems/man/en/
  - id: brew:go-task
    reason: >
      Choose Task when a readable cross-platform YAML Taskfile is preferable; choose
      Argc when Bash-native recipes and CLI generation are the priority.
    rel: alternative
    sources:
      - https://github.com/sigoden/argc/blob/main/docs/command-runner.md
      - https://taskfile.dev/
category: developer-tools
package-manager:
  brew: argc
  macports: argc
  nix: argc
package-manager-url: https://formulae.brew.sh/formula/argc
license: Apache-2.0 OR MIT
tags:
  - bash
  - cli
  - cli-framework
  - command-line-parser
  - rust
  - shell
  - task-runner
description: Easily create and use cli based on bash script
executables:
  - argc
provenance:
  formula: argc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
