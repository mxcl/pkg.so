id: brew:cpulimit
display-name: cpulimit
homepage: https://github.com/opsengine/cpulimit
repo: https://github.com/opsengine/cpulimit
docs:
  - https://github.com/opsengine/cpulimit#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cpulimit has remained packaged as a straightforward Unix-style utility for
      administrators and users who need to tame batch jobs. The input package metadata
      shows distribution through Homebrew and several Linux package managers.
  package-nerd-significance:
    - >
      The package is significant because it solves a familiar operational problem with a
      tiny C tool and no service manager dependency: package it once, expose a single
      executable, and users can apply soft CPU throttling to existing processes.
  project-history:
    - >
      The README credits Angelo Marletta as the developer and describes the tool's goal:
      prevent a process from running for more than a specified CPU time ratio. The
      official GitHub repository was created in 2012.
  related-projects:
    - >
      cpulimit is related by purpose to Unix process-management tools such as nice and
      schedulers, but the README distinguishes it by controlling real CPU usage through
      stop/continue signals rather than priority.
  sources:
    - https://github.com/opsengine/cpulimit
    - https://raw.githubusercontent.com/opsengine/cpulimit/master/README.md
    - https://api.github.com/repos/opsengine/cpulimit
    - https://api.github.com/repos/opsengine/cpulimit/tags
  summary:
    - >
      cpulimit is a small process-control utility that limits a process's observed CPU
      usage percentage without changing its nice value or scheduler priority.
  timeline:
    - '2012: The opsengine/cpulimit repository was created.'
    - 'Repository era: v0.1 and v0.2 tags exist in the official GitHub repository.'
    - '2024: The official repository was still receiving updates.'
  usage:
    - >
      cpulimit controls CPU consumption by sending SIGSTOP and SIGCONT POSIX signals.
      The README notes that child processes and threads of the selected process share
      the configured CPU percentage, and documents simple make-based builds for Linux,
      OS X, and FreeBSD.
related-packages: []
category: system
package-manager:
  apk: cpulimit
  brew: cpulimit
  debian: cpulimit
  dnf: cpulimit
  nix: cpulimit
  ubuntu: cpulimit
  zypper: cpulimit
package-manager-url: https://formulae.brew.sh/formula/cpulimit
license: GPL-2.0-or-later
tags:
  - cli
  - cpu
  - linux
  - process-management
  - resource-limits
description: CPU usage limiter
executables:
  - cpulimit
provenance:
  formula: cpulimit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
