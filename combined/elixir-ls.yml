id: brew:elixir-ls
display-name: ElixirLS
homepage: https://elixir-lsp.github.io/elixir-ls
repo: https://github.com/elixir-lsp/elixir-ls
docs:
  - https://elixir-lsp.github.io/elixir-ls
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ElixirLS became important because LSP turned editor integration from one-off
      plugins into a standard server/client contract. The Elixir project notes that, as
      LSP adoption grew, Elixir's implementation became the main way many Elixir users
      interacted with the language from their editors.
  package-nerd-significance:
    - >
      ElixirLS matters to package nerds because it packages editor intelligence as a
      standalone executable instead of baking it into one editor extension. That makes
      it a natural Homebrew/Scoop-style developer-tool package and a compatibility
      pressure point whenever Elixir, Erlang/OTP, Mix, or the LSP/DAP specifications
      move.
  project-history:
    - >
      The official Elixir language-server announcement describes the first Elixir LSP
      implementation as started by Jake Becker in 2017 alongside a Visual Studio Code
      implementation. It relied on ElixirSense for extracting language intelligence,
      then grew as LSP adoption grew across editors.
    - >
      The same announcement says the implementation later moved into its own GitHub
      organization, with maintenance passing to Lukasz Samson and Jason Axelson. By
      2024, the Elixir project announced an official Language Server team and described
      a path toward unifying ideas from ElixirLS, Lexical, and Next LS into shared
      code-intelligence infrastructure.
  related-projects:
    - ElixirSense supplies language-intelligence extraction used by ElixirLS.
    - >
      Lexical and Next LS are sibling Elixir language-server efforts discussed by the
      Elixir project in the 2024 official language-server announcement.
    - >
      Expert is the newer official language-server effort mentioned by the Elixir
      project as the follow-on unification work.
  sources:
    - https://elixir-lsp.github.io/elixir-ls/
    - https://github.com/elixir-lsp/elixir-ls
    - https://github.com/elixir-lsp/elixir-ls/blob/master/CHANGELOG.md
    - https://github.com/elixir-lsp/elixir-ls/releases
    - https://elixir-lang.org/blog/2024/08/15/welcome-elixir-language-server-team/
  summary:
    - >
      ElixirLS is the long-running Elixir language-server and debug-adapter package. It
      provides editor-independent code intelligence for Elixir Mix projects through the
      Language Server Protocol and step-through debugging through the Debug Adapter
      Protocol.
  timeline:
    - '2017: First Elixir LSP implementation started alongside Visual Studio Code support.'
    - >
      2017: Early ElixirLS changelog entries record Windows support and packaging
      changes for easier installs.
    - >
      2024: The Elixir project announced an official Language Server team and described
      ElixirLS as the most complete and widely functional implementation among the
      existing options.
    - '2026: ElixirLS 0.31 releases added support for Elixir 1.20 and OTP 29.'
  usage:
    - >
      In package-manager terms, ElixirLS is installed next to Elixir and started by an
      editor or plugin against a Mix project. The server runs in the background to
      provide diagnostics, completion, navigation, and other language intelligence; the
      bundled debug adapter is used by clients that speak the VS Code Debug Protocol.
related-packages:
  - id: brew:expert
    reason: >
      Choose Expert when you want the newer official Elixir language server formed from
      ElixirLS, Lexical, and Next LS; it is still a younger pre-1.0 implementation.
    rel: alternative
    sources:
      - https://expert-lsp.org/
      - https://elixir-lang.org/blog/2024/08/15/welcome-elixir-language-server-team/
  - id: brew:elixir
    reason: >
      ElixirLS operates on Elixir Mix projects and uses the installed Elixir and Erlang
      toolchain to compile, analyze, format, and debug their code.
    rel: adjacent_workflow
    sources:
      - https://elixir-lsp.github.io/elixir-ls/features/
      - https://elixir-lsp.github.io/elixir-ls/getting-started/overview/
      - https://elixir-lang.org/docs/
