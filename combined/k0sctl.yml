id: brew:k0sctl
display-name: k0sctl
homepage: https://github.com/k0sproject/k0sctl
repo: https://github.com/k0sproject/k0sctl
docs:
  - https://docs.k0sproject.io/stable/k0sctl-install
  - https://github.com/k0sproject/k0sctl#readme
config-file-location:
  unix: k0sctl.yaml
credentials-file-location:
  unix:
    - ~/.ssh/identity
    - ~/.ssh/id_rsa
    - ~/.ssh/id_dsa
history:
  adoption-history:
    - >
      Adoption follows k0s adoption: users who want a small Kubernetes distribution but
      do not want to hand-roll SSH loops, install commands, token exchange, and
      kubeconfig retrieval can use k0sctl as the repeatable wrapper.
  package-nerd-significance:
    - >
      k0sctl is a good example of a package-manager-friendly infrastructure binary: one
      statically distributed CLI, a declarative local YAML file, no daemon, and behavior
      that turns a cluster installation process into a repeatable command.
  project-history:
    - >
      k0sctl appeared with the k0s project after k0s began public releases in November
      2020. Its early 2021 releases established the `k0sctl apply` workflow: describe
      hosts and desired cluster state in `k0sctl.yaml`, then let the tool connect over
      SSH and converge the cluster.
    - >
      The k0s documentation positioned k0sctl as an automatic and repeatable way to
      create multi-node and production clusters, making it part of the official
      installation story rather than a third-party convenience script.
  related-projects:
    - >
      k0sctl is tightly coupled to k0s, and sits in the same broad Kubernetes bootstrap
      space as k3sup, kubeadm wrappers, and other SSH-driven cluster installers.
  sources:
    - https://docs.k0sproject.io/stable/k0sctl-install
    - https://docs.k0sproject.io/v1.21.0%2Bk0s.0/k0sctl-install/
    - https://github.com/k0sproject/k0s
    - https://github.com/k0sproject/k0sctl
    - https://github.com/k0sproject/k0sctl/releases/tag/v0.4.0
  summary:
    - >
      k0sctl is the companion command-line bootstrap and lifecycle tool for k0s
      Kubernetes clusters, using SSH and a YAML cluster definition to configure hosts
      and deploy k0s.
  timeline:
    - '2020: k0s made its initial public release in November.'
    - '2021: k0sctl v0.4.0 was published in February.'
    - >
      2021: k0s documentation for v1.21.0+k0s.0 recommended k0sctl for production
      cluster installation and automatic upgrades.
  usage:
    - >
      The main workflow is `k0sctl apply`, pointed at a `k0sctl.yaml` file in the
      working directory or another path passed with `--config`. The tool gathers host
      state through SSH, installs k0s, joins nodes, and can generate kubeconfig output.
related-packages:
  - id: brew:k3sup
    reason: >
      Choose k3sup for a smaller imperative SSH workflow that installs k3s and retrieves
      kubeconfig, whereas k0sctl declaratively manages k0s clusters from YAML.
    rel: alternative
    sources:
      - https://docs.k0sproject.io/stable/k0sctl-install/
      - https://github.com/alexellis/k3sup
category: cloud-infrastructure
package-manager:
  apk: k0sctl
  brew: k0sctl
  macports: k0sctl
  nix: k0sctl
  winget: k0sproject.k0sctl
  zypper: k0sctl
package-manager-url: https://formulae.brew.sh/formula/k0sctl
license: Apache-2.0
tags:
  - bootstrap
  - cli
  - cluster-management
  - k0s
  - kubernetes
  - ssh
description: Bootstrapping and management tool for k0s clusters
executables:
  - k0sctl
provenance:
  formula: k0sctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
