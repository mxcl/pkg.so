id: brew:klog
display-name: klog
homepage: https://klog.jotaen.net
repo: https://github.com/jotaen/klog
docs:
  - https://github.com/jotaen/klog/blob/main/Specification.md
  - https://klog.jotaen.net/
config-file-location:
  linux: ${XDG_CONFIG_HOME:-$HOME/.config}/klog/config.ini
  macos: ~/Library/Application Support/klog/config.ini
  windows: '%LOCALAPPDATA%\klog\config.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      klog's adoption has been strongest among plain-text productivity users rather than
      large platform deployments. The project documentation lists installs through
      Homebrew, AUR, Nix, openSUSE, Go, and downloadable binaries, which is typical for
      a small cross-platform Go CLI that appeals to users already comfortable storing
      data in versionable text files.
  package-nerd-significance:
    - >
      klog is package-nerd catnip because it treats the data format as the product, not
      merely as an implementation detail. It belongs in the lineage of Ledger, todo.txt,
      Markdown, and other small tools where durable text, predictable CLI output, and
      easy packaging matter more than a service backend.
  project-history:
    - >
      Jan Heuermann created klog as a small Go tool and file format for human-readable
      `.klg` files. Version 1.0 was released on 2021-02-06 with commands for totals,
      reports, tags, and bookmarks; version 2.0 followed in March 2021 with commands for
      creating records and starting or stopping open-ended time ranges.
    - >
      The file-format side became more explicit in version 2.6 on 2021-07-25, when the
      changelog records the first version of the formal file format specification. The
      repository notes that the command-line tool and the file-format specification use
      independent version numbering and different license terms.
  related-projects:
    - >
      klog is related to plain-text accounting and productivity tools such as Ledger,
      hledger, todo.txt, Timewarrior, and Taskwarrior, but it keeps the domain focused
      on human-readable time logs.
  sources:
    - https://github.com/jotaen/klog
    - https://github.com/jotaen/klog/blob/main/CHANGELOG.md
    - https://github.com/jotaen/klog/blob/main/Specification.md
    - https://klog.jotaen.net/
  summary:
    - >
      klog is both a command-line time tracker and a plain-text time-tracking file
      format. Its documentation frames the format as a notebook-like way to keep work
      logs editable in any text editor while still supporting terminal queries and
      reports.
  timeline:
    - '2021-02-02: v1.0-rc release published on GitHub.'
    - '2021-02-06: v1.0 release added report, tags, bookmark, and renamed `eval` to `total`.'
    - '2021-03-16: v2.0 release added create, track, start, and stop commands.'
    - '2021-03-19: v2.1 release provided a native Windows binary.'
    - '2021-07-25: v2.6 release published the first file-format specification version.'
    - >
      2021-10-07: v3.0 release added named bookmarks, editor integration, and more
      report aggregation options.
  usage:
    - >
      A user writes records in `.klg` files, with dates, summaries, time ranges,
      durations, tags, open-ended ranges, and should-total annotations. The `klog`
      command then searches, totals, reports, edits bookmarks, and supports workflows
      where the same file remains readable without the tool.
related-packages:
  - id: brew:timewarrior
    reason: >
      Choose Timewarrior for interval-based terminal tracking and documented Taskwarrior
      integration; choose klog when directly editable, notebook-like plain-text files
      are the primary requirement.
    rel: alternative
    sources:
      - https://klog.jotaen.net/
      - https://timewarrior.net/
      - https://timewarrior.net/docs/taskwarrior/
category: productivity
package-manager:
  brew: klog
  debian: klog
  dnf: klog
  macports: klog
  nix: klog
  ubuntu: klog
  winget: EA4K.KLog
  zypper: klog
package-manager-url: https://formulae.brew.sh/formula/klog
license: MIT
tags:
  - cli
  - file-format
  - go
  - plain-text
  - productivity
  - time-tracking
description: Command-line tool for time tracking in a human-readable, plain-text file format
executables:
  - klog
provenance:
  formula: klog
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
