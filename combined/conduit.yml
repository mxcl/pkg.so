id: brew:conduit
display-name: Conduit
homepage: https://conduitio.github.io/
repo: https://github.com/ConduitIO/conduit
docs:
  - https://docs.conduit.io/
  - https://conduit.io/docs/getting-started
config-file-location:
  unix:
    - ./conduit.yaml
    - ./pipelines/
credentials-file-location: null
history:
  adoption-history:
    - >
      Conduit targets users who want connector-based streaming without operating Kafka
      Connect. Official packaging includes Homebrew, release binaries, Debian and RPM
      packages, Docker images on GitHub Container Registry, and source builds.
  package-nerd-significance:
    - >
      For package catalogs, Conduit is interesting because it packages a
      data-integration runtime as a single Go binary with optional external connector
      binaries, offering a non-JVM distribution model for workloads often associated
      with Kafka Connect.
  project-history:
    - >
      The official repository was created in January 2022. The README says Conduit was
      created and open-sourced by Meroxa, and describes a pipeline runtime built from
      connectors, processors, observability, goroutines, Go channels, and gRPC-based
      connector plugins.
  related-projects:
    - >
      Conduit is related to Kafka Connect, Apache Kafka, PostgreSQL, S3, Go connector
      plugins, Cobra, Viper, and Conduit's ecdysis CLI library.
  sources:
    - https://github.com/ConduitIO/conduit
    - https://github.com/ConduitIO/conduit#readme
    - https://github.com/ConduitIO/conduit/releases/tag/v0.1.0
    - https://github.com/ConduitIO/conduit/releases/tag/v0.14.0
    - https://conduit.io/docs/getting-started
    - https://docs.conduit.io/
  summary:
    - >
      Conduit is an open-source data streaming tool written in Go for building real-time
      pipelines between production data stores, positioned by its own metadata as a
      Kafka Connect replacement that does not require a JVM.
  timeline:
    - '2022: Official GitHub repository created.'
    - '2023: v0.1.0 release published.'
    - '2025: v0.14.0 release published with continued pipeline and processor work.'
  usage:
    - >
      Users run the conduit service, configure it with CLI flags, CONDUIT-prefixed
      environment variables, or a conduit.yaml file, and define pipelines and
      connectors. The project documents built-in connectors for files, Kafka,
      PostgreSQL, S3, generator, and log use cases, plus standalone connector plugins.
related-packages:
  - id: brew:kafka
    reason: >
      Use Apache Kafka with Conduit when Kafka is the source or destination for a
      pipeline; Conduit treats Kafka as one optional datastore and does not require a
      Kafka cluster for other pipelines.
    rel: adjacent_workflow
    sources:
      - https://conduitdata.io/docs
      - https://kafka.apache.org/documentation/
category: data
package-manager:
  apk: conduit
  brew: conduit
  nix: conduit
  winget: Icehunter.conduit
package-manager-url: https://formulae.brew.sh/formula/conduit
license: Apache-2.0
tags:
  - cli
  - connectors
  - data-integration
  - data-streaming
  - go
  - kafka-connect
  - pipelines
description: Streams data between data stores. Kafka Connect replacement. No JVM required
executables:
  - conduit
provenance:
  formula: conduit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
