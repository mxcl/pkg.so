id: brew:ladybug
display-name: Ladybug
homepage: https://ladybugdb.com/
repo: https://github.com/LadybugDB/ladybug
docs:
  - https://docs.ladybugdb.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption evidence is thin because the project is young, but the official
      site advertises curl and Homebrew installation, and the GitHub release feed shows
      packaged CLI and library artifacts for Linux, macOS, and Windows. That makes the
      Homebrew formula part of the project's early distribution story rather than an
      afterthought.
  package-nerd-significance:
    - >
      For package watchers, Ladybug is interesting as a fast-moving database
      fork/successor story: a research-heavy embedded graph database lineage repackaged
      with command-line binaries, language SDKs, and Homebrew installation soon after
      launch.
  project-history:
    - >
      The LadybugDB site frames the project as a response to Kuzu's open-source
      development halt after acquisition, with LadybugDB carrying forward the embedded
      graph database idea with an open-source license, enterprise support, and a
      low-friction install path. The documentation describes Ladybug as an embedded
      graph database optimized for complex join-heavy analytical workloads on large
      graphs, using property graphs, Cypher, columnar disk storage, CSR adjacency and
      join indexes, vectorized and factorized execution, multi-core query parallelism,
      and serializable ACID transactions.
  related-projects:
    - >
      LadybugDB is explicitly related to Kuzu, Cypher, DuckDB, Parquet, Arrow, and
      embedded analytical database workflows.
  sources:
    - https://docs.ladybugdb.com/
    - https://github.com/LadybugDB/ladybug
    - https://github.com/LadybugDB/ladybug/releases
    - https://ladybugdb.com/
  summary:
    - >
      Ladybug is a newer embedded columnar graph database with a command-line shell and
      language bindings. Its official positioning is as a Kuzu successor and as a
      graph-oriented analogue to the embedded, analytical database style popularized by
      DuckDB.
  timeline:
    - >
      2026: The official website described LadybugDB as a Kuzu successor and advertised
      Homebrew installation.
    - >
      2026-06-02: GitHub release v0.17.1 published CLI and library artifacts for Linux,
      macOS, and Windows.
  usage:
    - >
      Users can run the lbug CLI as a standalone shell for Cypher interaction, or embed
      Ladybug through language bindings. The docs emphasize in-process use with no
      external DBMS server, plus interoperability with formats and systems such as
      Parquet, Arrow, and DuckDB.
related-packages:
  - id: brew:kuzu
    reason: >
      Kuzu is the direct predecessor for maintaining existing Kuzu applications and
      data, while Ladybug is the actively developed successor for new deployments.
    rel: alternative
    sources:
      - https://ladybugdb.com/
      - https://github.com/kuzudb/kuzu
  - id: brew:duckdb
    reason: >
      Ladybug's official DuckDB extension attaches DuckDB databases so relational tables
      can be scanned or copied into graph workflows.
    rel: adjacent_workflow
    sources:
      - https://docs.ladybugdb.com/extensions/attach/duckdb/
      - https://duckdb.org/docs
  - id: brew:neo4j
    reason: >
      Ladybug provides an official Neo4j extension specifically for migrating Neo4j
      graph data into an embedded Ladybug database.
    rel: adjacent_workflow
    sources:
      - https://docs.ladybugdb.com/extensions/
      - https://neo4j.com/docs
category: data
package-manager:
  brew: ladybug
package-manager-url: https://formulae.brew.sh/formula/ladybug
license: MIT
tags:
  - cli
  - columnar
  - cypher
  - embedded-database
  - graph-database
description: Embedded graph database built for query speed and scalability
executables:
  - lbug
provenance:
  formula: ladybug
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
