id: brew:msmtp
display-name: msmtp
homepage: https://marlam.de/msmtp/
repo: https://git.marlam.de/git/msmtp.git
docs:
  - https://marlam.de/msmtp/documentation
  - https://marlam.de/msmtp/msmtp.html
  - https://marlam.de/msmtp/msmtp.pdf
config-file-location:
  unix:
    - SYSCONFDIR/msmtprc
    - ~/.msmtprc
    - $XDG_CONFIG_HOME/msmtp/config
credentials-file-location:
  unix:
    - ~/.netrc
    - SYSCONFDIR/netrc
history:
  project-history:
    - >
      The project grew into a focused replacement for the sending side of a local mail
      transfer agent. Its configuration organizes SMTP servers as accounts with host,
      authentication, TLS, and related settings, and the manual documents TLS, multiple
      authentication mechanisms, delivery status notifications, PIPELINING,
      server-information mode, Remote Message Queue Starting, and the minimal SMTP
      server msmtpd.
  sources:
    - https://formulae.brew.sh/formula/msmtp
    - https://github.com/marlam/msmtp/blob/master/AUTHORS
    - https://marlam.de/msmtp/msmtp.html
    - https://wiki.debian.org/msmtp
  summary:
    - >
      msmtp is Martin Lambers's lightweight SMTP client for Unix-like mail workflows.
      The AUTHORS file says msmtp was mostly written by Lambers and that much of its
      code is shared with mpop. Its manual describes the default mode: read a message
      from standard input and send it to a configured SMTP server, while keeping
      command-line options and exit codes compatible with sendmail.
  usage:
    - >
      msmtp's adoption niche is the modular command-line mail stack. It is commonly
      paired with MUAs rather than acting as a full mail server: the Debian wiki names
      Mutt and Emacs as examples, and the manual includes examples for Mutt and
      traditional mail commands. Package managers often provide it as both the `msmtp`
      executable and a sendmail-compatible MTA alternative for scripts, cron jobs, and
      small systems that only need outbound SMTP relay.
related-packages:
  - id: brew:mutt
    reason: >
      Mutt can invoke msmtp through its `sendmail` setting, giving the mail reader a
      lightweight, account-aware SMTP delivery backend.
    rel: adjacent_workflow
    sources:
      - https://marlam.de/msmtp/msmtp.html
      - http://www.mutt.org/
  - id: brew:mpop
    reason: >
      Pair mpop's POP3 mail retrieval with msmtp's SMTP submission when assembling a
      lightweight send-and-receive command-line mail stack.
    rel: adjacent_workflow
    sources:
      - https://marlam.de/mpop/
      - https://marlam.de/msmtp/
category: networking
package-manager:
  apk: msmtp
  brew: msmtp
  debian: msmtp
  dnf: msmtp
  macports: msmtp
  nix: msmtp
  pacman: msmtp
  ubuntu: msmtp
  zypper: msmtp
package-manager-url: https://formulae.brew.sh/formula/msmtp
license: GPL-3.0-or-later
tags:
  - cli
  - daemon
  - email
  - mail-client
  - mutt
  - sendmail-compatible
  - smtp
description: SMTP client that can be used as an SMTP plugin for Mutt
executables:
  - msmtp
  - msmtpd
provenance:
  formula: msmtp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
