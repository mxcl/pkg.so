id: brew:cpi
display-name: cpi
homepage: https://treefrogframework.github.io/cpi/
repo: https://github.com/treefrogframework/cpi
docs:
  - https://github.com/treefrogframework/cpi#readme
  - https://treefrogframework.github.io/cpi
config-file-location:
  unix: ~/.config/cpi/cpi.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Package-manager adoption appears niche: the supplied package facts list Homebrew
      and MacPorts. That is consistent with cpi's role as a developer convenience tool
      rather than a core language runtime.
  package-nerd-significance:
    - >
      cpi is interesting to packagers because it exposes C++ as something close to a
      scripting workflow while still needing normal C++ and Qt build dependencies. Its
      documented per-user INI file also means an otherwise small CLI has a real
      configuration surface.
  project-history:
    - >
      The public GitHub repository was created in December 2012. The README documents a
      design that uses an installed C++ compiler internally, with Qt 6 and a C++
      compiler as build/runtime requirements, so the package sits between a REPL, a
      script runner, and a thin compile-and-run wrapper.
  related-projects:
    - TreeFrog Framework is the upstream GitHub organization for cpi.
    - Qt and GCC, LLVM, or MSVC are documented build/runtime requirements.
  sources:
    - https://api.github.com/repos/treefrogframework/cpi
    - https://github.com/treefrogframework/cpi#readme
    - https://raw.githubusercontent.com/treefrogframework/cpi/master/README.md
  summary:
    - >
      cpi is a small C++ interpreter-style command-line tool from the TreeFrog Framework
      organization. Its upstream description and README present it as a tiny interpreter
      for C++20 or C++23 rather than as a separate language implementation.
  timeline:
    - '2012: Public GitHub repository created.'
    - '2025: README examples document cpi 2.2.0 and C++20/C++23 usage.'
    - '2026: Upstream tags include 2.2.x releases and test-release tags.'
  usage:
    - >
      The README shows interactive mode, execution of saved C++ source files, per-file
      compile options, pkg-config integration, and Qt examples. For package users, the
      important behavior is that cpi depends on the host compiler toolchain rather than
      shipping an independent C++ execution engine.
related-packages:
  - id: brew:cling
    reason: >
      Choose Cling when you need an LLVM-based interactive C++ environment or ROOT
      integration; cpi is a smaller compile-and-run tool aimed at lightweight REPL and
      script workflows.
    rel: alternative
    sources:
      - https://github.com/treefrogframework/cpi#readme
      - https://root.cern/manual/cling/
category: language-runtime
package-manager:
  brew: cpi
  macports: cpi
package-manager-url: https://formulae.brew.sh/formula/cpi
license: MIT
tags:
  - c-plus-plus
  - cli
  - interpreter
  - repl
  - scripting
description: Tiny c++ interpreter
executables:
  - cpi
provenance:
  formula: cpi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
