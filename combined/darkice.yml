id: brew:darkice
display-name: DarkIce
homepage: http://www.darkice.org/
repo: https://github.com/rafael2k/darkice
docs:
  - http://www.darkice.org/
  - https://github.com/rafael2k/darkice#readme
config-file-location:
  unix: /etc/darkice.cfg
credentials-file-location:
  unix: /etc/darkice.cfg
history:
  adoption-history:
    - >
      DarkIce grew with early internet radio infrastructure: the official site documents
      OSS, ALSA, Solaris audio, Jack, PulseAudio, MP3, MP2, Ogg Vorbis, Opus, FLAC, AAC,
      ShoutCast, Icecast, Darwin Streaming Server, and Unix-like operating systems
      including FreeBSD, Linux, macOS, BSDs, and Solaris.
  package-nerd-significance:
    - >
      DarkIce is historically interesting because it packages a full live
      encoder/uploader workflow into a Unix daemon-style CLI with a plain text config
      file, matching the way many early online radio and community streaming setups were
      deployed.
  project-history:
    - >
      The official site names Akos Maroy as the initial author and Rafael Diniz as the
      current author and maintainer. It says DarkIce has been used in 24-hour production
      since fall 2000, and its ChangeLog starts with a 0.1 release in November 2000.
  related-projects:
    - >
      The official site links DarkSnow as a GTK frontend and positions DarkIce around
      Icecast, ShoutCast, Darwin Streaming Server, LAME, TwoLame, Ogg Vorbis, Opus,
      FAAC, and libaacplus.
  sources:
    - http://www.darkice.org/
    - https://github.com/rafael2k/darkice
    - https://github.com/rafael2k/darkice/blob/master/darkice/ChangeLog
    - https://github.com/rafael2k/darkice/releases
  summary:
    - >
      DarkIce is a live audio streamer that records from an audio interface, encodes the
      stream, and sends it to streaming servers such as Icecast and ShoutCast.
  timeline:
    - '2000: DarkIce 0.1 was released.'
    - >
      2001: ShoutCast, Ogg Vorbis, Solaris, FreeBSD, and man-page support appeared
      across early releases.
    - '2005: 0.15 added Jack input support and BSD portability work.'
    - '2009: Rafael Diniz became maintainer in the 0.20 release.'
    - '2010: DarkIce 1.0 was released.'
    - '2024: v1.5 was published on GitHub.'
    - '2026: v1.6 was published on GitHub.'
  usage:
    - >
      The darkice command reads a configuration file, defaulting to /etc/darkice.cfg
      when no -c path is supplied. The man page documents sections for general settings,
      input, Icecast, Icecast2, ShoutCast, and file outputs, including password fields
      for streaming servers.
related-packages:
  - id: brew:icecast
    reason: >
      Use Icecast as the receiving server for streams encoded and uploaded by DarkIce;
      DarkIce's official documentation explicitly supports Icecast source connections.
    rel: adjacent_workflow
    sources:
      - https://github.com/rafael2k/darkice/tree/master/darkice
      - https://github.com/rafael2k/darkice/blob/master/darkice/darkice.cfg
      - https://icecast.org/docs/
category: media
package-manager:
  apk: darkice
  brew: darkice
  debian: darkice
  macports: darkice
  nix: darkice
  ubuntu: darkice
package-manager-url: https://formulae.brew.sh/formula/darkice
license: GPL-3.0-or-later
tags:
  - audio
  - cli
  - encoder
  - icecast
  - live-audio
  - streaming
description: Live audio streamer
executables:
  - darkice
provenance:
  formula: darkice
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
