id: brew:pdfpc
display-name: pdfpc
homepage: https://pdfpc.github.io/
repo: https://github.com/pdfpc/pdfpc
docs:
  - https://github.com/pdfpc/pdfpc#readme
  - https://pdfpc.github.io/
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/pdfpc/pdfpcrc
    - ~/.config/pdfpc/pdfpcrc
    - ~/.pdfpcrc
    - ${SYSCONFDIR}/pdfpcrc
credentials-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/pdfpc/pdfpcrc
    - ~/.config/pdfpc/pdfpcrc
    - ${CMAKE_INSTALL_FULL_SYSCONFDIR}/pdfpcrc
history:
  adoption-history:
    - >
      pdfpc is packaged by Homebrew, Fedora, Arch, MacPorts, and Nix. It is especially
      associated with Linux and open-source presentation workflows where slides are
      produced as PDFs, often through LaTeX Beamer.
  package-nerd-significance:
    - >
      pdfpc supplies a free-software presenter console independent of a proprietary
      slide-authoring suite. Its support for PDF, Beamer notes, configurable controls,
      media, and multiple monitors makes it a distinctive component of conference and
      academic presentation setups.
  project-history:
    - >
      The project began as PDF Presenter Console. Its changelog records an initial 1.0
      release, a substantial 2.0 rewrite in 2010, and a May 2012 rename to pdfpc when it
      was forked from the earlier project.
    - >
      Version 4.0 in June 2015 moved the application to GTK+3 under a new maintainer.
      Later releases added improved Wayland and HiDPI behavior, drawing, media controls,
      PDF annotations, REST control, JSON presentation metadata, and other presentation
      features.
  related-projects:
    - >
      pdfpc is a fork of Jakob Westhoff's PDF Presenter Console. Its official
      organization also maintains latex-pdfpc, a companion LaTeX package for embedding
      notes and presentation metadata.
  sources:
    - https://github.com/pdfpc/latex-pdfpc
    - https://github.com/pdfpc/pdfpc
    - https://github.com/pdfpc/pdfpc/blob/master/CHANGELOG.rst
    - https://pdfpc.github.io/
  summary:
    - >
      pdfpc is a GTK-based PDF presentation viewer that provides a presenter console on
      one display and the audience presentation on another. It shows information such as
      the current and next slides, notes, and remaining time.
  timeline:
    - '2010: PDF Presenter Console 2.0 released.'
    - '2012: Project renamed to pdfpc with version 3.0.'
    - '2015: Version 4.0 moved to GTK+3 under a new maintainer.'
    - >
      2020: Version 4.5 introduced JSON presentation metadata and expanded notes and
      presentation features.
    - '2022: Version 4.6 added REST control and undo/redo for drawings.'
    - '2024: Version 4.7 released in December.'
  usage:
    - >
      Presenters open a PDF with pdfpc and use the presenter window for notes, previews,
      timing, overview navigation, drawing, and audience-screen control.
    - >
      Global behavior and key bindings can be configured in pdfpcrc. The documented
      lookup includes XDG configuration paths, the legacy ~/.pdfpcrc path, and a system
      configuration path.
    - >
      A companion .pdfpc file can hold presentation-specific notes and state; it is
      presentation data rather than the global application configuration file.
category: productivity
package-manager:
  brew: pdfpc
  dnf: pdfpc
  macports: pdfpc
  nix: pdfpc
  pacman: pdfpc
package-manager-url: https://formulae.brew.sh/formula/pdfpc
license: GPL-3.0-or-later
tags:
  - cli
  - gtk
  - gui
  - multi-monitor
  - pdf
  - presentation
  - presenter-console
description: Presenter console with multi-monitor support for PDF files
executables:
  - pdfpc
provenance:
  formula: pdfpc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
