id: brew:clib
display-name: clib
homepage: https://github.com/clibs/clib
repo: https://github.com/clibs/clib
docs:
  - https://github.com/clibs/clib#readme
  - https://main--clibs.netlify.app/
config-file-location:
  unix: ./clib.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, MacPorts, Nix, and source
      builds on Ubuntu and Fedora, showing packaging across both macOS package managers
      and Unix-like source workflows.
    - >
      GitHub repository metadata showed thousands of stars at research time, and the
      project has continued publishing 2.x releases through 2024. That combination makes
      it one of the more recognizable attempts to give C a lightweight package-manager
      workflow.
  package-nerd-significance:
    - >
      clib is significant because C has no single dominant package manager comparable to
      npm or Cargo. clib's deliberately small model, GitHub-centered registry, vendored
      source expectation, and manifest format capture a practical answer to C's
      fragmented library-discovery problem.
    - >
      For package nerds, clib sits in the lineage of language package managers but keeps
      C's cultural preference for source files, makefiles, and minimal runtime
      assumptions. Its Homebrew/MacPorts/Nix availability also made it easy to try
      without adopting a whole new platform.
  project-history:
    - >
      The clib GitHub repository was created in October 2012 and presents the project as
      a package manager for C. The README describes it as a way to promote small C
      utilities, improve discovery, and avoid pulling large frameworks into C projects.
    - >
      clib's project model expects packages to describe themselves with `clib.json`,
      including fields such as name, version, repo, description, keywords, license,
      sources, and install commands. The wiki package listing acts as the registry and
      feeds `clib-search`.
  related-projects:
    - >
      The clibs GitHub organization and clib wiki package list are related because the
      README describes them as the package registry.
    - >
      Homebrew, MacPorts, and Nix are related distribution channels documented by the
      README and input package metadata.
    - libcurl is a build dependency named by the README.
  sources:
    - https://github.com/clibs/clib#readme
    - https://api.github.com/repos/clibs/clib
    - https://api.github.com/repos/clibs/clib/releases
  summary:
    - >
      clib is a package manager for the C programming language, built around small
      standalone C libraries and a `clib.json` manifest.
  timeline:
    - '2012: The GitHub repository is created.'
    - '2017: GitHub release metadata records clib 1.8.1.'
    - '2023: GitHub release metadata records clib 2.8.3 and 2.8.5.'
    - '2024: GitHub release metadata records clib 2.8.7.'
  usage:
    - >
      clib is used to initialize projects, install dependencies, update or uninstall
      packages, configure and build dependencies, and search the registry. The README
      recommends checking fetched files into the consuming repository so end users and
      contributors do not need clib installed.
    - >
      Common commands include `clib install clibs/ms clibs/commander`, installing
      packages into `./deps` or another output directory, and using `clib.json` to
      describe both libraries and executables.
related-packages:
  - id: brew:vcpkg
    reason: >
      Choose vcpkg when you need a curated cross-platform C/C++ registry, ABI-aware
      source builds, triplets, binary caching, or CMake/MSBuild integration rather than
      clib's small vendored-source workflow.
    rel: alternative
    sources:
      - https://github.com/clibs/clib#readme
      - https://learn.microsoft.com/vcpkg/get_started/overview
  - id: brew:conan
    reason: >
      Choose Conan when native dependencies require decentralized remotes, reusable
      binary packages, profiles, and compiler- or architecture-specific package
      management.
    rel: alternative
    sources:
      - https://github.com/clibs/clib#readme
      - https://docs.conan.io/2/
category: developer-tools
package-manager:
  brew: clib
  macports: clib
  nix: clib
package-manager-url: https://formulae.brew.sh/formula/clib
license: MIT
tags:
  - c
  - cli
  - dependency-management
  - package-manager
description: Package manager for C programming
executables:
  - clib
  - clib-build
  - clib-configure
  - clib-init
  - clib-install
  - clib-search
  - clib-uninstall
  - clib-update
  - clib-upgrade
provenance:
  formula: clib
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
