id: brew:ddate
display-name: ddate
homepage: https://github.com/bo0ts/ddate
repo: https://github.com/bo0ts/ddate
docs:
  - https://github.com/bo0ts/ddate#readme
  - https://github.com/bo0ts/ddate/blob/master/ddate.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ddate survives as a small Unix culture package: not operationally critical, but
      still present in Homebrew, Linux distributions, and Nix for users who want the
      classic command without depending on util-linux to ship it.
  package-nerd-significance:
    - >
      Package nerds care about ddate because it is a tiny artifact of Unix humor and
      distribution policy. Its continued packaging shows how small commands can outlive
      their original host project when users still value the behavior.
  project-history:
    - >
      The bo0ts/ddate repository was created in 2011 after ddate's status in util-linux
      changed. Its README preserves the compact converter and includes the calendar's
      seasons, weekdays, holidays, and Saint Tib's Day rules.
  related-projects:
    - util-linux, Arch User Repository
  sources:
    - https://github.com/bo0ts/ddate
    - https://github.com/bo0ts/ddate#readme
    - https://github.com/bo0ts/ddate/blob/master/ddate.1
    - https://api.github.com/repos/bo0ts/ddate
  summary:
    - >
      ddate converts Gregorian dates to the Discordian, or POEE, calendar. The
      standalone repository describes itself as the same ddate version from util-linux
      2.20, kept separate because util-linux no longer builds ddate by default.
  timeline:
    - '2011: Standalone GitHub repository created'
    - '2011: README says the code matches util-linux 2.20'
    - '2011: Project preserved because util-linux stopped building ddate by default'
  usage:
    - >
      Users run ddate as a date-conversion CLI. The bundled manpage and README document
      the Discordian calendar rather than application configuration, so it has no
      persistent config or credential file.
related-packages: []
category: productivity
package-manager:
  apk: ddate
  brew: ddate
  debian: ddate
  dnf: ddate
  nix: ddate
  ubuntu: ddate
package-manager-url: https://formulae.brew.sh/formula/ddate
license: LicenseRef-Homebrew-public-domain
tags:
  - calendar
  - cli
  - date-conversion
  - discordian-calendar
  - util-linux
description: Converts boring normal dates to fun Discordian Date
executables:
  - ddate
provenance:
  formula: ddate
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
