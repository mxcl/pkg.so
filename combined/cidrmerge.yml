id: brew:cidrmerge
display-name: CIDRMerge
homepage: https://cidrmerge.sourceforge.net/
repo: https://sourceforge.net/p/cidrmerge/code
docs:
  - https://cidrmerge.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The homepage says CIDRMerge has been widely used for blacklist merge and
      optimization and notes use by big ISPs. SourceForge file history shows releases
      from 1.1.0 in August 2005 through 1.5.3 in July 2008, and Homebrew still packages
      1.5.3.
  package-nerd-significance:
    - >
      CIDRMerge is old-school package-nerd material: a small C utility, CVS-hosted on
      SourceForge, still useful enough to be bottled by Homebrew years after its last
      upstream release. It reflects the practical sysadmin lineage of packaging compact
      network-list tools for spam filtering, firewalling, and route-table maintenance.
  project-history:
    - >
      The SourceForge project was created in August 2005 by Daniele Depetrini. The
      homepage describes a CIDR merge implementation whose output is summarized as small
      as possible, with an optimization library, a command-line program, and conversion
      scripts for netmask and CIDR formats.
  related-projects:
    - >
      The homepage explicitly mentions RBLDNS and Michael Tokarev's qsort code; related
      package-manager peers in this batch include cidr and cidr2range.
  sources:
    - https://cidrmerge.sourceforge.net/
    - https://sourceforge.net/rest/p/cidrmerge
    - https://sourceforge.net/projects/cidrmerge/rss?path=/
    - https://sourceforge.net/p/cidrmerge/code/
    - https://formulae.brew.sh/api/formula/cidrmerge.json
  summary:
    - >
      CIDRMerge is a C command-line tool and library for merging CIDR networks while
      applying whitelist-based network exclusion.
  timeline:
    - '2005: SourceForge project created.'
    - '2005: cidrmerge-1.1.0 released.'
    - '2005: cidrmerge-1.5.0 and 1.5.1 released.'
    - '2008: cidrmerge-1.5.3 released.'
    - '2026: Homebrew formula still packages cidrmerge-1.5.3.'
  usage:
    - >
      Users feed CIDR-formatted lines on standard input, optionally pass a whitelist
      file, and receive merged or whitelist-filtered CIDR output. The homepage calls out
      blacklist optimization, RBLDNS workflows, ACL or routing-table reduction, and
      network-complement computation.
related-packages: []
category: networking
