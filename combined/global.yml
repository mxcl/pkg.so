id: brew:global
display-name: GNU GLOBAL
homepage: https://www.gnu.org/software/global/
repo: https://savannah.gnu.org/cvs?group=global
docs:
  - https://www.gnu.org/software/global/manual
  - https://www.gnu.org/software/global/globaldoc_toc.html
config-file-location:
  unix:
    - ./gtags.conf
    - ./obj/gtags.conf
    - ~/.globalrc
    - /etc/gtags.conf
    - /usr/local/etc/gtags.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      GLOBAL became part of the GNU developer-tool family for users who wanted a tags
      system broader than classic ctags. Its command set integrates with Emacs, Vim,
      cscope-style workflows, shell completion, and generated HTML browsing, which made
      it useful for large C and mixed-language source trees before language-server
      tooling became common.
    - >
      Package-manager adoption across Unix-like systems reflects that niche: GLOBAL is
      not a compiler or build tool, but it is a durable code-navigation utility that
      developers install on workstations, build hosts, and source-analysis environments.
  package-nerd-significance:
    - >
      GNU GLOBAL is package-nerd significant because it packages a whole
      source-navigation workflow as small POSIX command-line tools. It also illustrates
      a long-lived GNU pattern: simple generated databases, editor adapters, manpages,
      Texinfo docs, and optional parser plug-ins rather than a background service.
  project-history:
    - >
      GNU GLOBAL's distributed README identifies it as a source code tagging system for
      diverse environments and carries Tama Communications Corporation copyright years
      beginning in 2000. The README describes support for GNU, BSD, macOS, and other
      POSIX-compatible systems, with language support originally focused on C, Yacc,
      Java, PHP4, and assembly.
    - >
      GNU FTP release archives show the 6.x series beginning in 2011 and continuing with
      small compatibility, parser, security, and editor-integration releases. Later NEWS
      entries document Universal Ctags support, Pygments parser work, SQLite
      configuration choices, Emacs TRAMP support, and security fixes for generated HTML
      workflows.
  related-projects:
    - >
      GNU GLOBAL is related to ctags, Universal Ctags, cscope, Emacs gtags modes, Vim
      integrations, Pygments parsers, and source cross-reference generators such as
      LXR-style HTML browsers.
  sources:
    - https://ftp.gnu.org/gnu/global/
    - https://www.gnu.org/software/global/
    - https://www.gnu.org/software/global/globaldoc_toc.html
    - https://www.gnu.org/software/global/manual
  summary:
    - >
      GNU GLOBAL is a source-code tagging and navigation system centered on `gtags`
      databases and the `global` query command. It indexes source trees so programmers
      and editor integrations can jump to definitions, references, files, and generated
      hypertext views.
  timeline:
    - '2000: README copyright range begins, matching early public GNU GLOBAL development.'
    - '2011: GNU FTP archive lists GLOBAL 6.0.'
    - '2017: GLOBAL 6.6 release line began.'
    - '2021: Emacs TRAMP support added to `gtags.el`.'
    - '2024: NEWS documents a command-injection fix in `htags`.'
    - '2026: GLOBAL 6.6.15 released.'
  usage:
    - >
      Practitioners run `gtags` at a project root to create tag databases, then use
      `global` to query symbols, files, references, and completion data. Companion tools
      such as `gozilla`, `htags`, `gtags-cscope`, `globash`, and `htags-server` connect
      those databases to browsers, shells, editors, and cscope-like interfaces.
    - >
      The package is useful when a source tree does not have a language server, when
      developers need fast offline symbol lookup, or when generated cross-reference HTML
      is more convenient than editor-only navigation.
related-packages:
  - id: brew:universal-ctags
    reason: >
      Universal Ctags is a documented parser plug-in for GNU GLOBAL, extending language
      parsing while GLOBAL continues to provide its cross-reference databases and query
      tools.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/global/globaldoc_toc.html
      - https://docs.ctags.io/
  - id: brew:cscope
    reason: >
      cscope is an alternative interactive source browser for C-family code; choose it
      for the traditional cscope workflow, while GLOBAL offers broader editor, shell,
      and generated-hypertext interfaces.
    rel: alternative
    sources:
      - https://www.gnu.org/software/global/
      - https://cscope.sourceforge.net/
      - https://cscope.sourceforge.net/cscope_man_page.html
category: developer-tools
