history:
  adoption-history:
    - >
      Purge is distributed as a native macOS application, including through Homebrew,
      and is developed in public under the MIT license. Its audience includes both
      ordinary Mac users and developers with large Xcode, package-manager, container,
      editor, and build caches.
    - >
      Successive releases broadened it from cache cleanup into storage overview,
      large-file review, application removal, leftover detection, scheduled cleaning,
      Shortcuts actions, Time Machine snapshot review, and developer-worktree cleanup.
  package-nerd-significance:
    - >
      Disk cleaners deserve unusual scrutiny because mistakes can destroy user data.
      Purge's package-nerd appeal is its auditable source, generated never-touch list,
      fixed allowlist, plain-language safety labels, and Trash-first deletion model.
    - >
      It also recognizes package and development ecosystems directly, including
      Homebrew, npm, pnpm, Yarn, CocoaPods, Gradle, Flutter, Docker, VS Code, Cursor,
      JetBrains, Cargo, Terraform, and Xcode artifacts.
  project-history:
    - >
      Jithin Sabu developed Purge as a free, open-source macOS cleaner centered on
      conservative deletion. Rather than listing every possible removable file, it
      identifies known cache or rebuildable locations, labels uncertain items for
      review, and excludes unidentified folders.
    - >
      The project subsequently added a disk overview, application uninstaller,
      deleted-app leftover review, menu-bar and scheduled workflows, large-file and
      duplicate discovery, and more detailed protection for active projects and running
      applications.
  related-projects:
    - >
      Purge uses Sparkle for signed in-app updates and Apple's native macOS facilities
      for permissions, login items, Shortcuts, and selected system operations.
  sources:
    - 'Official product page: https://purgemac.com/'
    - 'Official releases: https://github.com/jithin-sabu/purge-app/releases'
    - 'Official repository README: https://github.com/jithin-sabu/purge-app'
    - 'Official safety reference: https://purgemac.com/safety'
  summary:
    - >
      Purge is a free, open-source macOS storage cleaner and application uninstaller
      that favors allowlisted findings, user review, and moving files to Trash.
  timeline:
    - >
      2026: The release line expanded Purge with whole-disk overview, large-file review,
      application leftovers, Shortcuts actions, Time Machine snapshot handling, and
      Finder integration.
    - >
      2026: The project formalized a generated safety reference describing locations its
      cleanup engine refuses to touch.
  usage:
    - >
      Scan app caches and developer artifacts, review the safety labels, and clean
      selected items or only those marked safe. Most removals go to Trash so the user
      can recover them before emptying it.
    - >
      Optional workflows include scheduled safe cleaning, menu-bar actions, reviewing
      leftovers after an app is removed, locating large files and duplicates, and
      uninstalling applications with their associated data.
    - >
      Full Disk Access is optional for initial cache and developer-junk scans but is
      needed for deeper large-file and application-leftover coverage.
related-packages:
