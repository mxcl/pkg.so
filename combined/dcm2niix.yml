id: brew:dcm2niix
display-name: dcm2niix
homepage: https://www.nitrc.org/plugins/mwiki/index.php/dcm2nii:MainPage
repo: https://github.com/rordenlab/dcm2niix
docs:
  - https://github.com/rordenlab/dcm2niix/blob/master/docs/source/dcm2niix.rst
  - https://www.nitrc.org/plugins/mwiki/index.php/dcm2nii:MainPage
config-file-location:
  unix: Path printed by `dcm2niix -h` as `Defaults file` (user-specific)
  windows: Windows Registry (exact key not documented in the official CLI manual)
credentials-file-location: null
history:
  adoption-history:
    - >
      dcm2niix became central to neuroimaging data conversion because it handles DICOM
      vendor variation, writes NIfTI outputs, and can generate BIDS sidecar JSON. The
      official README explicitly calls it a core dependency of BIDS converters and lists
      many wrappers, research pipelines, GUI tools, and platforms that invoke it.
  package-nerd-significance:
    - >
      dcm2niix is significant because it is the boring executable underneath a large
      amount of modern neuroimaging workflow automation. Packagers care about it because
      one small binary unlocks reproducible import into NIfTI and BIDS-oriented
      pipelines across Linux, macOS, and Windows.
  project-history:
    - >
      The GitHub repository was created in 2014 and hosts developmental source code,
      while stable compiled builds are distributed through GitHub releases and MRIcroGL.
      The project also documents a NITRC wiki/manual lineage under the dcm2nii name,
      with dcm2nii listed as the deprecated predecessor for older images and dcm2niix
      positioned as the modern converter.
  related-projects:
    - >
      The README names dcm2nii as the deprecated predecessor and MRIcroGL as a
      distribution path. It also links dcm2niix to BIDS converters and many neuroimaging
      tools that shell out to the converter.
  sources:
    - https://github.com/rordenlab/dcm2niix
    - https://raw.githubusercontent.com/rordenlab/dcm2niix/master/README.md
    - https://raw.githubusercontent.com/rordenlab/dcm2niix/master/docs/source/dcm2niix.rst
    - https://api.github.com/repos/rordenlab/dcm2niix
  summary:
    - >
      dcm2niix is a command-line DICOM-to-NIfTI converter for neuroimaging data. The
      official README frames the problem plainly: medical imaging devices usually save
      DICOM, while many scientific tools expect the simpler NIfTI format.
  timeline:
    - '2014: Official GitHub repository created.'
    - >
      2016: README cites the DICOM-to-NIfTI conversion methods paper by Li, Morgan,
      Ashburner, Smith, and Rorden.
    - >
      2010s-2020s: README documents adoption by many BIDS converters and neuroimaging
      pipelines.
    - '2026: Official GitHub API metadata shows repository activity continuing into June 2026.'
  usage:
    - >
      Typical package-manager usage is a simple conversion command against a DICOM
      folder, optionally selecting output directory, filename format, gzip compression,
      anonymized BIDS sidecars, and vendor-specific conversion behavior. The CLI also
      has a defaults file mode and can use pigz for faster compression when available.
related-packages:
  - id: brew:dcmtk
    reason: >
      Use DCMTK to inspect, validate, modify, send, or receive DICOM objects around a
      workflow in which dcm2niix converts those objects into research-oriented NIfTI
      data.
    rel: adjacent_workflow
    sources:
      - https://github.com/rordenlab/dcm2niix/blob/master/docs/source/dcm2niix.rst
      - https://dcmtk.org/en/dcmtk/
category: science
package-manager:
  brew: dcm2niix
  debian: dcm2niix
  dnf: dcm2niix
  macports: dcm2niix
  nix: dcm2niix
  ubuntu: dcm2niix
package-manager-url: https://formulae.brew.sh/formula/dcm2niix
license: BSD-3-Clause
