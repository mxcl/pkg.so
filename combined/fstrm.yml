id: brew:fstrm
display-name: fstrm
homepage: https://github.com/farsightsec/fstrm
repo: https://github.com/farsightsec/fstrm
docs:
  - https://farsightsec.github.io/fstrm
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      fstrm was originally written to support high-speed binary logging in C DNS servers
      using the dnstap log format. The supplied package data shows broad packaging
      across Alpine, Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE
      families.
  package-nerd-significance:
    - >
      fstrm is a package-nerd package because it is infrastructure glue: small, C,
      ABI-conscious, and important to DNS telemetry stacks even though end users rarely
      invoke it directly. Its pkg-config workflow and reference tools make it easy for
      distributions to package and for C projects to consume.
  project-history:
    - >
      The repository was created in 2014. The README describes Frame Streams as a
      lightweight, binary-clean framing protocol for sequences of encoded payloads,
      usable over reliable byte streams and as a file format.
    - >
      The upstream ChangeLog records fstrm 0.1.0 as the initial release in February
      2014, followed by 0.2.0 in November 2014 with API and protocol changes, Doxygen
      documentation, and the fstrm_capture utility.
  related-projects:
    - The README names dnstap as the logging format that motivated fstrm.
    - >
      Frame Streams is designed to carry arbitrary encodings such as Protocol Buffers,
      XML, JSON, MessagePack, and YAML.
  sources:
    - https://api.github.com/repos/farsightsec/fstrm
    - https://farsightsec.github.io/fstrm
    - https://github.com/farsightsec/fstrm
    - https://raw.githubusercontent.com/farsightsec/fstrm/master/ChangeLog
    - https://raw.githubusercontent.com/farsightsec/fstrm/master/README.md
  summary:
    - >
      fstrm is Farsight Security's C implementation of the Frame Streams data transport
      protocol, with a library and small reference programs.
  timeline:
    - '2014: Public GitHub repository created.'
    - '2014: fstrm 0.1.0 initial release.'
    - '2014: fstrm 0.2.0 added Doxygen documentation and fstrm_capture.'
    - '2016: fstrm 0.3.0 added OS X build support and output flush/rotation fixes.'
    - >
      2017: fstrm 0.4.0 added fstrm_replay, TCP support, and manual pages for reference
      programs.
  usage:
    - >
      Developers include fstrm.h, compile with pkg-config --cflags libfstrm, and link
      with pkg-config --libs libfstrm. The library provides APIs for a dedicated Frame
      Streams I/O thread and asynchronous frame submission from worker threads.
    - >
      The package also ships fstrm_capture, fstrm_dump, and fstrm_replay. Later
      ChangeLog entries added TCP support, replay support, capture options, output
      rotation, and portability fixes.
related-packages:
  - id: brew:protobuf-c
    reason: >
      Use protobuf-c alongside fstrm when a C application needs to generate and encode
      Protocol Buffers payloads for transport inside Frame Streams.
    rel: adjacent_workflow
    sources:
      - https://farsightsec.github.io/fstrm/
      - https://github.com/protobuf-c/protobuf-c
      - https://protobuf-c.github.io/protobuf-c/
category: developer-tools
package-manager:
  apk: fstrm
  brew: fstrm
  debian: fstrm-bin
  dnf: fstrm
  macports: fstrm
  nix: fstrm
  pacman: fstrm
  ubuntu: fstrm-bin
  zypper: fstrm
package-manager-url: https://formulae.brew.sh/formula/fstrm
license: MIT
tags:
  - api-documentation
  - c-library
  - cli
  - data-transport
  - frame-streams
  - protocol
description: Frame Streams implementation in C
executables:
  - fstrm_capture
  - fstrm_dump
  - fstrm_replay
provenance:
  formula: fstrm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
