id: brew:zshdb
display-name: zshdb
homepage: https://github.com/Trepan-Debuggers/zshdb
repo: https://github.com/Trepan-Debuggers/zshdb
docs:
  - https://zshdb.readthedocs.io/en/latest
  - https://github.com/Trepan-Debuggers/zshdb#readme
config-file-location:
  unix: ~/.zshdbinit
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is specialized. Most shell users rely on tracing, but maintainers of
      larger shell scripts, shell libraries, or Zsh-specific tooling can benefit from
      real stepping and breakpoints. That niche is why zshdb appears in several package
      managers even without mainstream visibility.
    - >
      The package is also part of a debugger lineage: users who discover bashdb, pydb,
      or Trepan-style tools can recognize zshdb as the Zsh-specific member of that
      family.
  package-nerd-significance:
    - >
      zshdb matters because it packages observability for shell scripts, a corner of
      developer tooling that is often under-served. Shells are everywhere, but
      source-level shell debuggers remain niche enough that package-manager discovery is
      important.
    - >
      It is also a useful sibling entry for package databases: bashdb, zshdb, and
      Trepan-related debuggers show a family of small, language-specific debugging tools
      rather than one monolithic debugger package.
  project-history:
    - >
      The public GitHub repository was created on 2008-08-08. The README and Read the
      Docs site describe zshdb as a debugger for Zsh, aligned with Rocky Bernstein's
      broader Trepan debugger work and sibling shell debuggers.
    - >
      zshdb's premise is deliberately narrow: Zsh scripts deserve source-level debugging
      too. Rather than implementing a new shell, it wraps and instruments Zsh execution
      to provide debugger commands familiar from gdb-style workflows.
  related-projects:
    - >
      Related projects include Zsh, bashdb, Trepan debuggers, gdb, kshdb, shell tracing
      with `set -x`, and Zsh test/debugging workflows.
  sources:
    - https://api.github.com/repos/Trepan-Debuggers/zshdb
    - https://github.com/Trepan-Debuggers/zshdb
    - https://raw.githubusercontent.com/Trepan-Debuggers/zshdb/master/README.md
    - https://zshdb.readthedocs.io/en/latest/
  summary:
    - >
      zshdb is a gdb-like debugger for Zsh scripts. It is part of the Trepan debugger
      family and brings stepping, breakpoints, stack inspection, and debugger-style
      command interaction to shell code that is otherwise usually debugged with `set -x`
      and print statements.
  timeline:
    - '2008-08-08: The Trepan-Debuggers/zshdb GitHub repository is created.'
    - >
      2010s: zshdb is documented through README material and Read the Docs as part of
      the Trepan debugger ecosystem.
    - >
      2020s: zshdb remains packaged by Homebrew, MacPorts, and Arch-derived package
      metadata for users who need Zsh script debugging.
  usage:
    - >
      Developers run `zshdb` against a Zsh script to step through execution, inspect
      call frames and variables, set breakpoints, and diagnose control-flow problems. It
      is most useful when `set -x` output becomes too noisy or when a script uses
      Zsh-specific behavior that a POSIX-sh debugger would not understand.
    - >
      Because it is a command-line debugger, packaging matters: installing it from
      Homebrew, MacPorts, or Arch puts a repeatable debugger binary alongside the shell
      it targets.
category: developer-tools
package-manager:
  brew: zshdb
  macports: zshdb
  pacman: zshdb
package-manager-url: https://formulae.brew.sh/formula/zshdb
license: GPL-2.0-or-later AND GPL-3.0-or-later AND HPND-sell-variant
tags:
  - cli
  - debugger
  - shell
  - zsh
description: Debugger for zsh
executables:
  - zshdb
provenance:
  formula: zshdb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
