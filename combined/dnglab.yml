id: brew:dnglab
display-name: dnglab
homepage: https://github.com/dnglab/dnglab
repo: https://github.com/dnglab/dnglab
docs:
  - https://github.com/dnglab/dnglab
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DNGLab's adoption is centered on photographers and RAW-format tinkerers who need
      batch conversion, metadata inspection, or camera-format experimentation from the
      terminal. Release notes show the project expanding camera and file-format support
      over time, especially around the v0.5 line.
  package-nerd-significance:
    - >
      Package nerds care about DNGLab because it is a modern Rust entry in a space long
      dominated by desktop photo applications and vendor converters. Its single-binary
      CLI model fits Homebrew, Nix, and other developer-oriented package channels.
  project-history:
    - >
      The project README presents DNGLab as an alpha-stage RAW-to-DNG converter and
      points users to the GitHub issue tracker for bugs. Its related rawler crate is
      published separately for RAW parsing, with the README warning that the API is not
      yet stable.
  related-projects:
    - rawler is the related RAW parsing crate from the same project family.
    - Adobe DNG Converter is the proprietary reference point for many RAW-to-DNG workflows.
  sources:
    - https://github.com/dnglab/dnglab
    - https://github.com/dnglab/dnglab/releases
    - https://github.com/dnglab/dnglab/blob/main/SUPPORTED_CAMERAS.md
  summary:
    - >
      DNGLab is a Rust command-line tool for converting camera RAW files into Adobe
      Digital Negative files. It sits in the photography-tooling niche where users want
      open, scriptable conversion outside proprietary camera vendor utilities.
  timeline:
    - '2021: Early public releases establish DNGLab as a CR3-focused RAW-to-DNG converter.'
    - '2022: v0.5.0 broadens supported file formats and improves DNG output.'
    - '2026: v0.7.x releases continue shipping prebuilt binaries.'
  usage:
    - >
      The CLI supports converting a single RAW file or a directory, analyzing RAW
      structure as JSON or YAML, extracting embedded originals from DNG files, and
      low-level DNG creation. That combination makes it useful both as a conversion
      command and as an inspection tool for RAW-format debugging.
related-packages: []
category: media
package-manager:
  brew: dnglab
  nix: dnglab
  zypper: dnglab
