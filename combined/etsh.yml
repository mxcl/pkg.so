id: brew:etsh
display-name: Etsh
homepage: https://etsh.dev/
repo: https://etsh.dev/anoncvs
docs:
  - https://etsh.dev/doc
  - https://etsh.dev/man/_etsh.1.html
  - https://etsh.dev/usage
config-file-location:
  unix:
    - /usr/local/etc/etsh.login
    - /usr/local/etc/etsh.etshrc
    - ~/.etsh.login
    - ~/.etshrc
    - /usr/local/etc/etsh.logout
    - ~/.etsh.logout
credentials-file-location: null
history:
  adoption-history:
    - >
      Etsh's adoption is niche and heritage-oriented rather than mass-market. Official
      project notes emphasize successful builds on DragonFly BSD, FreeBSD, macOS,
      NetBSD, OpenBSD, OpenIndiana, and GNU/Linux, and the package appears in Unix-like
      ports systems for users who want the V6 shell experience on modern machines.
  package-nerd-significance:
    - >
      Etsh matters to package nerds because it is both software and executable computing
      history. Installing it through a package manager gives modern systems a maintained
      port of a pre-Bourne-shell command language, complete with the companion utilities
      needed for authentic behavior.
    - >
      It is also a reminder that shell packaging is not just about default user shells:
      small historical interpreters need careful source provenance, licensing, manpages,
      and installation paths so they can coexist with modern `/bin/sh` implementations.
  project-history:
    - >
      The project is explicitly dedicated to preserving the Version 6 Unix `sh(1)`
      lineage. Its sources trace back to the Thompson shell, principally written by Ken
      Thompson at Bell Labs, with related V6 utilities such as glob, if, and goto
      included because they were part of the shell's practical command-file environment.
    - >
      Jeffrey Allen Neitzel has maintained the etsh project since July 2003. The project
      keeps the historical interface available while adding enough portability and
      interactive-shell improvements for modern POSIX-like systems.
  related-projects:
    - >
      tsh is the unenhanced Thompson shell port shipped by the same project, while glob,
      if, goto, and fd2 provide supporting shell functionality.
    - >
      The V6 Sh History site and TUHS source materials provide historical context for
      the original Thompson shell and related Unix manuals.
  sources:
    - https://etsh.dev/
    - https://etsh.dev/about/
    - https://etsh.dev/anoncvs/
    - https://etsh.dev/usage/
    - https://etsh.dev/man/_etsh.1.html
    - https://v6sh.org/
  summary:
    - >
      Etsh is a historical Unix shell package that maintains two ports of the Thompson
      shell from Sixth Edition Unix: an enhanced interactive-compatible shell named etsh
      and an unenhanced port named tsh. It is packaged less as a mainstream login shell
      and more as a living, buildable preservation of early Unix shell behavior.
  timeline:
    - '1975: Sixth Edition Unix shipped with the Thompson shell as `/bin/sh`.'
    - >
      1979: Seventh Edition Unix replaced the Thompson shell with the Bourne shell,
      while retaining the older shell as `osh`.
    - >
      2003: Jeffrey Allen Neitzel became principal developer and maintainer of the etsh
      project.
    - >
      2019: Etsh 5.4.0 manual pages documented the maintained ports and their V6 shell
      lineage.
  usage:
    - >
      Users run etsh or tsh as command interpreters, either interactively or for scripts
      that fit the V6 shell model. The usage guide frames the shells as a way to do
      useful work with a small shell plus classic Unix pipelines and external tools such
      as awk, expr, grep, and sed.
related-packages:
  - id: brew:dash-shell
    reason: >
      Choose dash for a small modern POSIX `/bin/sh` and portability testing; choose
      Etsh when historical V6 Thompson-shell behavior is the point.
    rel: alternative
    sources:
      - https://etsh.dev/man/_etsh.1.html
      - https://git.kernel.org/pub/scm/utils/dash/dash.git/tree/src/dash.1
category: system
package-manager:
  brew: etsh
  macports: etsh
package-manager-url: https://formulae.brew.sh/formula/etsh
license: BSD-2-Clause AND BSD-3-Clause AND BSD-4-Clause AND LicenseRef-Homebrew-public-domain
tags:
  - cli
  - posix
  - shell
  - thompson-shell
  - unix
  - v6-unix
description: Two ports of /bin/sh from V6 UNIX (circa 1975)
executables:
  - etsh
  - sh6
provenance:
  formula: etsh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
