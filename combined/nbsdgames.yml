id: brew:nbsdgames
display-name: nbsdgames
homepage: https://github.com/abakh/nbsdgames
repo: https://github.com/abakh/nbsdgames
docs:
  - https://github.com/abakh/nbsdgames
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The maintainer README says nbsdgames is packaged in Debian and other DEB
      repositories, OpenSUSE and other RPM repositories, AUR, Alpine, FreeBSD, NetBSD,
      DragonFly BSD, Minix, Homebrew, and more, and points to Repology for version
      tracking.
    - >
      GitHub API data retrieved on 2026-07-01 showed 301 stars and 24 forks. Homebrew
      Formulae reported stable version 6.0.2 and 601 installs over the prior 365 days,
      which is respectable for a terminal game bundle.
  package-nerd-significance:
    - >
      nbsdgames keeps the old Unix 'games in the base-ish package set' idea alive
      without trying to become a game platform. It is small, portable, public-domain
      packaged by Homebrew, and weird in the right terminal-native way.
  project-history:
    - >
      The GitHub repository was created on 2018-09-21. The README frames the project as
      'New BSD Games': a lightweight modern answer to classic terminal game collections,
      with games such as Jewels, Sudoku, Mines, Reversi, Checkers, Battleship, SOS,
      Rabbithole, Pipes, Fifteen, Fisher, Muncher, Darrt, Snakeduel, and Revenge.
    - >
      The project is intentionally portable and modest. Its build requirements are POSIX
      make, a C99 compiler, the standard library, and ncurses, with notes that it is
      known to work on Windows through PDCurses, has been ported to Plan 9, and can run
      on DOS and other PDCurses-supported platforms.
  sources:
    - https://api.github.com/repos/abakh/nbsdgames
    - https://api.github.com/repos/abakh/nbsdgames/releases
    - https://formulae.brew.sh/api/formula/nbsdgames.json
    - https://github.com/abakh/nbsdgames
    - https://raw.githubusercontent.com/abakh/nbsdgames/master/README.md
    - https://repology.org/project/nbsdgames/versions
  summary:
    - >
      nbsdgames is a compact C/ncurses collection of 21 terminal games, mixing
      classic-style board, puzzle, arcade, and original text games under one menu and
      individual executables.
  timeline:
    - '2018-09-21: abakh/nbsdgames repository created.'
    - '2021-07-18: v4.1.2 release published.'
    - '2022-02-02: v5 release published.'
    - '2026-04-26: v6 release published.'
    - '2026-06-10: v6.0.2 release published.'
  usage:
    - >
      Users can run individual game commands or enter nbsdgames to get the menu. Several
      games expose simple command-line options for difficulty or board dimensions, so
      the package works both as a quick terminal distraction and as a source of small
      C/ncurses examples.
    - >
      The package-nerd appeal is the same as bsdgames: install once, get a pile of tiny
      terminal games that work over SSH, in tmux, on small systems, and on platforms
      where graphical games are beside the point.
related-packages:
  - id: brew:bastet
    reason: >
      Choose Bastet for a focused, deliberately adversarial falling-block terminal game
      instead of nbsdgames' broad collection of board, puzzle, and arcade games.
    rel: alternative
    sources:
      - https://github.com/abakh/nbsdgames
      - https://fph.altervista.org/prog/bastet.html
      - https://github.com/fph/bastet
  - id: brew:curseofwar
    reason: >
      Choose Curse of War when the desired terminal game is a real-time strategy
      experience with local and multiplayer modes rather than a menu of short puzzle and
      board games.
    rel: alternative
    sources:
      - https://github.com/abakh/nbsdgames
      - https://a-nikolaev.github.io/curseofwar/
      - https://github.com/a-nikolaev/curseofwar
