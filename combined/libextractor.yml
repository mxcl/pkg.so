id: brew:libextractor
display-name: GNU Libextractor
homepage: https://www.gnu.org/software/libextractor/
repo: https://git.gnunet.org/libextractor.git
docs:
  - https://www.gnu.org/software/libextractor/manual/extractor.html
  - https://www.gnu.org/software/libextractor
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project sits near GNUnet historically and operationally: GNUnet source
      instructions tell builders to install GNU libextractor first. Debian describes it
      as a universal metadata library for file-sharing networks, file managers, and
      WWW-indexing bots, which matches the project's original packaging niche.
  package-nerd-significance:
    - >
      libextractor matters to package nerds because it is the Unix-library answer to a
      messy metadata problem: many formats, many optional helper libraries, and one
      stable API for callers that only want structured metadata.
  project-history:
    - >
      GNU's manual describes libextractor as a developer library with a small API,
      plugins for many file types, and language bindings beyond C/C++. GNU's FTP archive
      lists libextractor source releases from December 2005, with the 0.6 series in
      2010, the 1.0 series in September 2012, and later 1.x releases.
  related-projects:
    - >
      Related projects include GNUnet, file managers, search/indexing tools, metadata
      plugins, and language bindings for Java, Perl, PHP, Mono, Python, and Ruby.
  sources:
    - https://ftp.gnu.org/gnu/libextractor/
    - https://github.com/GNUnet-Mirror/GNUnet
    - https://packages.debian.org/sid/libextractor-dev
    - https://www.gnu.org/software/libextractor
    - https://www.gnu.org/software/libextractor/manual/html_node/Introduction.html
  summary:
    - >
      GNU Libextractor is a C library and extract command for obtaining metadata from
      files of arbitrary type. It is built around helper libraries and plugins, so
      file-type knowledge can be packaged separately from applications that need
      metadata.
  timeline:
    - '2005-12-23: GNU FTP archive lists libextractor 0.5.9.'
    - '2010-01-13: GNU FTP archive lists libextractor 0.6.0.'
    - '2012-09-25: GNU FTP archive lists libextractor 1.0.0.'
    - '2023-12-02: GNU FTP archive lists libextractor 1.12.'
    - '2026-06-30: GNU FTP archive lists libextractor 1.16.'
  usage:
    - >
      End users usually meet it through the extract CLI or through applications that
      link against the library to populate detail views, search indexes, forensic
      inventories, or file-sharing metadata.
related-packages:
  - id: brew:gnunet
    reason: >
      Use GNUnet with Libextractor when publishing or indexing metadata in GNUnet
      file-sharing workflows; GNUnet's handbook recommends building with Libextractor.
    rel: adjacent_workflow
    sources:
      - https://git.gnunet.org/gnunet/gnunet-handbook/
      - https://www.gnu.org/software/libextractor/
category: data
package-manager:
  brew: libextractor
  debian: extract
  dnf: libextractor
  macports: libextractor
  nix: libextractor
  pacman: libextractor
  ubuntu: extract
  zypper: libextractor
package-manager-url: https://formulae.brew.sh/formula/libextractor
license: GPL-3.0-or-later
tags:
  - c-library
  - cli
  - file-analysis
  - gnu
  - metadata
  - plugins
description: Library to extract meta data from files
executables:
  - extract
provenance:
  formula: libextractor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
