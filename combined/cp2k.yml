id: brew:cp2k
display-name: CP2K
homepage: https://www.cp2k.org/
repo: https://github.com/cp2k/cp2k
docs:
  - https://www.cp2k.org/docs
  - https://manual.cp2k.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CP2K's official download page explicitly lists both source releases and
      distribution channels, including Debian, Fedora, Ubuntu, Arch, Homebrew, Docker,
      NVIDIA NGC, EasyBuild, Spack, conda-forge, Nix, and FreeBSD. That breadth reflects
      its role as an HPC/scientific package that downstream package systems carry for
      reproducible simulation environments.
    - >
      The version history records packaging-relevant platform work such as migration
      from SVN to Git in version 7.1, macOS build fixes in 9.1, ARM64 support in 8.2,
      container support in 2023.2, and GPU/offload work across multiple releases.
  package-nerd-significance:
    - >
      CP2K is package-manager-significant because it combines a large Fortran scientific
      codebase, MPI/OpenMP/GPU build variants, bundled and external numerical libraries,
      test/regression expectations, and heavy downstream demand from HPC environments.
      Its official distribution list spans both general-purpose OS repositories and
      specialist scientific package managers.
  project-history:
    - >
      The official CP2K site describes the program as a Fortran 2008 code supporting
      DFT, DFTB, MP2, RPA, semi-empirical methods, classical force fields, molecular
      dynamics, Monte Carlo, metadynamics, vibrational analysis, and related simulation
      workflows. It is GPL-licensed and developed openly on GitHub.
    - >
      The official version history shows a long release line, with entries at least back
      to version 2.0 and continuing through date-based releases such as 2026.1. The
      project also documents trunk development in Git, indicating an active development
      branch alongside released versions.
  related-projects:
    - >
      The official site names DBCSR as CP2K's sparse matrix library and documents its
      standalone availability. The version history also references integrations and
      adjacent scientific tools such as SIRIUS, COSMA, ELPA, libxc, Docker, Spack, and
      conda-forge.
  sources:
    - https://www.cp2k.org/about
    - https://www.cp2k.org/download
    - https://www.cp2k.org/version_history
  summary:
    - >
      CP2K is an open-source quantum chemistry and solid-state physics package for
      atomistic simulations of molecular, periodic, materials, crystal, liquid, and
      biological systems.
  timeline:
    - '2.0: Earliest release listed on the official version-history page.'
    - '2019: Version 7.1 notes that development moved from SVN to Git.'
    - '2021: Version 8.2 added ARM64 support.'
    - '2023: Version 2023.2 added Apptainer/Singularity container support.'
    - '2026: Version 2026.1 was released on January 6, 2026.'
  usage:
    - >
      Users run CP2K for computational chemistry and materials-science simulations,
      usually through input files and HPC-style execution rather than as an interactive
      desktop tool. The official site emphasizes both the manual and scientific
      references because results depend on the selected methods and modules.
related-packages:
  - id: brew:nwchem
    reason: >
      Choose NWChem as an alternative computational-chemistry suite when its molecular
      electronic-structure, QM/MM, plane-wave, or classical molecular-dynamics methods
      better match the calculation.
    rel: alternative
    sources:
      - https://www.cp2k.org/about
      - https://nwchemgit.github.io/Capabilities.html
category: science
