id: brew:bedtk
display-name: bedtk
homepage: https://github.com/lh3/bedtk
repo: https://github.com/lh3/bedtk
docs:
  - https://github.com/lh3/bedtk#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists Homebrew packaging. Upstream positions bedtk
      as a narrow, performance-oriented companion rather than a complete bedtools
      replacement.
  package-nerd-significance:
    - >
      bedtk is notable because it comes from the lh3 bioinformatics tool lineage and
      deliberately keeps the surface area small. It is the kind of package a genomics
      CLI user installs when they care about speed and memory more than a broad command
      catalog.
  project-history:
    - >
      The bedtk repository was created in October 2019, with the first visible commit
      adding interval intersection. Its README describes a simple BED toolset
      implementing intersection, subtraction, sorting, merging, and breadth-of-coverage
      calculations.
    - >
      The project is tied to the 2021 Bioinformatics article 'Bedtk: finding interval
      overlap with implicit interval tree,' which explains its algorithmic focus.
      Upstream releases reached v1.0 in April 2025 and v1.2 in August 2025.
  related-projects:
    - bedtools is explicitly named by upstream as broader and more versatile.
    - >
      cgranges is linked from the README and is related to the interval-overlap
      implementation family.
  sources:
    - https://api.github.com/repos/lh3/bedtk
    - https://github.com/lh3/bedtk#readme
    - https://github.com/lh3/bedtk/releases
    - source_facts.package-manager
  summary:
    - >
      bedtk is Heng Li's compact command-line toolkit for BED files, focused on fast
      interval overlap operations with a smaller scope than bedtools.
  timeline:
    - '2019: Repository created and initial intersection work committed.'
    - '2021: bedtk paper published in Bioinformatics.'
    - '2025: v1.0, v1.1, and v1.2 releases published.'
  usage:
    - >
      bedtk is used for operations such as filtering overlapping or non-overlapping
      BED/VCF records, intersection without pre-sorting, coverage breadth, sorting, and
      merging.
related-packages:
  - id: brew:bedtools
    reason: >
      Choose bedtools when you need a much broader genome-arithmetic feature set; choose
      bedtk when its smaller set of interval operations covers the task and performance
      or memory use is the priority.
    rel: alternative
    sources:
      - https://github.com/lh3/bedtk#readme
      - https://github.com/arq5x/bedtools2#readme
      - https://bedtools.readthedocs.io/en/latest/
category: science
package-manager:
  brew: bedtk
package-manager-url: https://formulae.brew.sh/formula/bedtk
license: MIT
tags:
  - bed
  - bioinformatics
  - cli
  - genomics
description: Simple toolset for BED files
executables:
  - bedtk
provenance:
  formula: bedtk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
