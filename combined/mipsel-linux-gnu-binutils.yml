id: brew:mipsel-linux-gnu-binutils
display-name: mipsel-linux-gnu-binutils
homepage: https://www.gnu.org/software/binutils/
repo: https://sourceware.org/git/binutils-gdb.git
docs:
  - https://sourceware.org/binutils/docs
  - https://www.gnu.org/software/binutils
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/mipsel-linux-gnu-binutils
    - https://packages.debian.org/sid/binutils-mipsel-linux-gnu
    - https://sourceware.org/binutils/docs
    - https://www.debian.org/ports/mips/
    - https://www.gnu.org/software/binutils/
  summary:
    - >
      mipsel-linux-gnu-binutils is the little-endian MIPS companion to
      mips-linux-gnu-binutils: a Homebrew package of GNU Binutils configured for the
      mipsel-linux-gnu cross target. GNU Binutils supplies the basic binary-manipulation
      layer of the GNU toolchain, including ld, as, ar, nm, objcopy, objdump, readelf,
      strings, size, and strip. The formula installs target-prefixed commands such as
      mipsel-linux-gnu-as and mipsel-linux-gnu-objdump so the cross tools do not collide
      with native system tools.
  usage:
    - >
      The practical niche is cross-compilation and binary inspection for little-endian
      MIPS Linux systems. Debian's mipsel package describes the same audience:
      developers who need assembler, linker, and binary utilities for mipsel-linux-gnu
      while working on another native platform. Debian's MIPS port documentation
      explains why separate mips and mipsel packages exist: MIPS processors can run in
      either endian mode, but Linux distributions publish separate binary architectures.
      In use, this package sits below a cross GCC or Clang setup and is also useful on
      its own for disassembling firmware, reading ELF metadata, stripping symbols, and
      manipulating object files for mipsel targets.
related-packages:
  - id: brew:crosstool-ng
    reason: >
      Use crosstool-NG when you need to generate a complete configurable
      cross-toolchain—compiler, Binutils, and C library—rather than installing only the
      mipsel-targeted binary utilities.
    rel: adjacent_workflow
    sources:
      - https://github.com/crosstool-ng/crosstool-ng
      - https://crosstool-ng.github.io/docs/toolchain-usage/
category: developer-tools
