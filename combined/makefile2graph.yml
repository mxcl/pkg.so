id: brew:makefile2graph
display-name: makefile2graph
homepage: https://github.com/lindenb/makefile2graph
repo: https://github.com/lindenb/makefile2graph
docs:
  - https://github.com/lindenb/makefile2graph#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README describes a specific package-maintainer workflow: pipe 'make
      -Bnd' into make2graph, then feed dot output to Graphviz or emit XML, PlantUML,
      Mermaid, target lists, or deepest independent targets.
    - >
      Its adoption evidence is mostly repository-level and use-case based rather than
      institutional. The README's cluster note for deepest independent targets shows the
      tool solving a real build-analysis problem for complex makefiles.
  package-nerd-significance:
    - >
      makefile2graph is the sort of tool package maintainers reach for when a makefile
      has become a dependency maze. It gives a visual or list-oriented view of what GNU
      Make thinks it is going to do.
    - >
      It is also interesting because it depends on GNU Make's own debug output rather
      than reimplementing a makefile parser. That keeps the tool small, but ties it to
      GNU Make output format and locale.
  project-history:
    - >
      The upstream repository was created in 2014 and the README history records active
      feature work starting in September 2014, including fixes for GNU Make 4.0 output,
      long options, basename and suffix handling, root node output, and version
      printing.
    - >
      The README shows the tool widening beyond its original Graphviz/dot and GEXF XML
      output. It added a 'deep' output mode in December 2014, graph formatting controls
      in August 2023, and PlantUML and Mermaid output formats on August 30, 2023.
  related-projects:
    - GNU Make is the input source whose debug output makefile2graph parses.
    - Graphviz/dot is the default graph output target.
    - PlantUML and Mermaid are later text graph output targets.
  sources:
    - https://api.github.com/repos/lindenb/makefile2graph
    - https://github.com/lindenb/makefile2graph
    - https://raw.githubusercontent.com/lindenb/makefile2graph/master/README.md
  summary:
    - >
      makefile2graph is a small command-line tool that turns GNU Make's debug database
      output into dependency graphs.
  timeline:
    - '2014: GitHub repository is created.'
    - '2014: README history records fixes for GNU Make 4.0 output and early CLI options.'
    - "2014: 'deep' output is added for deepest independent targets."
    - '2023: Graph, node, edge, and dirty attribute options are added.'
    - '2023: PlantUML and Mermaid output formats are added.'
  usage:
    - >
      Typical usage is 'make -Bnd | make2graph > output.dot' or piping the result to
      Graphviz to render an image. Other formats include GEXF XML, Mermaid, PlantUML,
      all-target lists, and deepest independent target output.
    - >
      The README notes an important parser constraint: make2graph only parses English
      messages from GNU Make, so users with another locale should set LC_ALL=C. It also
      states that sub-makefiles are not supported.
related-packages:
  - id: brew:make
    reason: >
      makefile2graph consumes the diagnostic database produced by 'make -Bnd', so GNU
      Make is the required source of its dependency-graph input.
    rel: adjacent_workflow
    sources:
      - https://github.com/lindenb/makefile2graph#usage
      - https://www.gnu.org/software/make/manual/
  - id: brew:graphviz
    reason: >
      makefile2graph emits Graphviz DOT by default, and Graphviz renders that output
      into visual formats such as PNG or SVG.
    rel: adjacent_workflow
    sources:
      - https://github.com/lindenb/makefile2graph#usage
      - https://graphviz.org/documentation/
category: developer-tools
package-manager:
  brew: makefile2graph
  debian: makefile2graph
  nix: makefile2graph
  ubuntu: makefile2graph
package-manager-url: https://formulae.brew.sh/formula/makefile2graph
license: MIT
tags:
  - cli
  - dependency-graph
  - graphviz
  - makefiles
  - mermaid
  - plantuml
description: Create a graph of dependencies from GNU-Make
executables:
  - make2graph
  - makefile2graph
provenance:
  formula: makefile2graph
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
