id: brew:killswitch
display-name: killswitch
homepage: https://killswitch.network
repo: https://github.com/vpn-kill-switch/killswitch
docs:
  - https://github.com/vpn-kill-switch/killswitch#readme
  - https://vpn-kill-switch.com/post/how-it-works
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      killswitch has narrower packaging than the other projects in this batch; the
      Homebrew formula documents it as a macOS VPN kill switch, and the project README
      focuses on local builds and root-required enable/disable commands.
  package-nerd-significance:
    - >
      killswitch is notable as a small packageable security utility that exposes macOS
      `pf` behavior through a single CLI, useful for users who want a
      provider-independent VPN leak guard rather than an application-specific setting.
  project-history:
    - >
      The GitHub repository was created in 2016, with a 0.7.0 GitHub release published
      on 2019-03-09. The README explains the core design: write temporary `pf` rules to
      `/tmp/killswitch.pf.conf`, load them with `pfctl`, and avoid modifying the system
      default `/etc/pf.conf`.
  related-projects:
    - >
      The README links the design to the Packet Filter firewall documented by FreeBSD
      and to macOS networking tools such as `pfctl`, `sysctl`, `netstat`, `scutil`, and
      `ifconfig`.
  sources:
    - https://docs.freebsd.org/en/books/handbook/firewalls/#firewalls-pf
    - https://formulae.brew.sh/formula/killswitch
    - https://github.com/vpn-kill-switch/killswitch
    - https://github.com/vpn-kill-switch/killswitch/releases
    - https://vpn-kill-switch.com/post/how-it-works
  summary:
    - >
      killswitch is a macOS VPN kill-switch CLI that uses the `pf` firewall to block
      outgoing traffic when the VPN tunnel disappears.
  timeline:
    - '2016: vpn-kill-switch/killswitch repository created on GitHub.'
    - '2019: 0.7.0 release published.'
    - '2020: 0.7.1 and v0.7.2 releases published.'
    - '2023: v0.7.3 release published.'
    - '2026: 0.8.x releases published from February through April.'
  usage:
    - >
      Users run `sudo killswitch -e` to enable firewall rules, `sudo killswitch -d` to
      disable and restore default rules, or `killswitch --print` to inspect rules before
      applying them.
related-packages: []
category: security
package-manager:
  brew: killswitch
package-manager-url: https://formulae.brew.sh/formula/killswitch
license: BSD-3-Clause
tags:
  - cli
  - firewall
  - macos
  - network-security
  - privacy
  - vpn
description: VPN kill switch for macOS
executables:
  - killswitch
provenance:
  formula: killswitch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
