id: brew:kubeone
display-name: KubeOne
homepage: https://kubeone.io
repo: https://github.com/kubermatic/kubeone
docs:
  - https://docs.kubermatic.com/kubeone
config-file-location:
  unix: kubeone.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      KubeOne's adoption followed Kubermatic's broader hybrid and multi-cloud Kubernetes
      story: the docs emphasize native support for AWS, Azure, DigitalOcean, GCP,
      Hetzner Cloud, Nutanix, OpenStack, VMware Cloud Director, and VMware vSphere, plus
      integration with Terraform and Kubermatic machine-controller.
  package-nerd-significance:
    - >
      For package managers, KubeOne is notable because it packages an opinionated
      cluster lifecycle controller as a local CLI rather than a hosted service. It gives
      Homebrew users a repeatable binary for a workflow that spans Terraform output,
      Kubernetes APIs, SSH access, and cloud-provider assumptions.
  project-history:
    - >
      Kubermatic describes KubeOne as first released before KubeCon Barcelona in May
      2019. By the August 18, 2020 KubeOne 1.0 announcement, the project had reached
      general availability after 15 months of development, 760 commits, and 600 GitHub
      stars, with a focus on automating highly available Kubernetes cluster operations.
  related-projects:
    - >
      KubeOne is related to Kubermatic Kubernetes Platform, Terraform, Cluster API,
      Kubermatic machine-controller, kubeadm, and upstream Kubernetes conformance work.
  sources:
    - https://docs.kubermatic.com/kubeone
    - https://github.com/kubermatic/kubeone
    - >
      https://www.kubermatic.com/blog/unveiling-kubeone-1-simplified-kubernetes-operations-for-everyone/
    - >
      https://www.kubermatic.com/resources/demo-deploy-and-manage-your-cluster-everywhere-with-kubeone/
  summary:
    - >
      KubeOne is Kubermatic's open source Kubernetes cluster lifecycle CLI for
      installing, upgrading, repairing, and unprovisioning clusters across cloud,
      on-prem, edge, and IoT environments. The Homebrew package exposes the kubeone
      binary used by operators who want a declarative single-cluster management
      workflow.
  timeline:
    - '2019-05: Kubermatic says KubeOne was first released before KubeCon Barcelona.'
    - '2020-08-18: KubeOne 1.0 reached general availability.'
    - >
      2020: KubeOne 1.0 introduced static worker nodes, flexible CNI deployment, and
      broader operating-system support.
    - '2026: KubeOne documentation listed maintained versioned docs through v1.13.'
  usage:
    - >
      Users define clusters declaratively in a YAML manifest, commonly named
      kubeone.yaml, then use kubeone commands to reconcile infrastructure-derived state,
      Kubernetes versions, addons, certificates, and worker nodes. The 1.0 release made
      the apply command central to provisioning, upgrades, repair, and disaster-recovery
      workflows.
related-packages:
  - id: brew:kops
    reason: >
      kOps is an alternative production-cluster lifecycle CLI that also provisions cloud
      infrastructure, with official support concentrated on AWS and GCE rather than
      KubeOne's broader cloud, virtualization, and static-worker model.
    rel: alternative
    sources:
      - https://docs.kubermatic.com/kubeone/
      - https://kops.sigs.k8s.io/
  - id: brew:clusterctl
    reason: >
      clusterctl offers a Kubernetes Cluster API alternative built around provider
      components and a management cluster, whereas KubeOne manages a cluster directly
      from its manifest and infrastructure inputs.
    rel: alternative
    sources:
      - https://docs.kubermatic.com/kubeone/
      - https://cluster-api.sigs.k8s.io/user/quick-start
  - id: brew:kubernetes-cli
    reason: >
      kubectl is the standard client for inspecting and operating the Kubernetes cluster
      after KubeOne provisions and reconciles it.
    rel: adjacent_workflow
    sources:
      - https://docs.kubermatic.com/kubeone/v1.10/tutorials/creating-clusters/
      - https://kubernetes.io/docs/reference/kubectl/
category: developer-tools
package-manager:
  brew: kubeone
  nix: kubeone
  pacman: kubeone
  zypper: kubeone
package-manager-url: https://formulae.brew.sh/formula/kubeone
license: Apache-2.0
tags:
  - automation
  - cli
  - cluster-lifecycle
  - cluster-operations
  - kubernetes
  - terraform
description: Automate cluster operations on all your environments
executables:
  - kubeone
provenance:
  formula: kubeone
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
