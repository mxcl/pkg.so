id: brew:cadubi
display-name: CADUBI
homepage: https://github.com/statico/cadubi/
repo: https://github.com/statico/cadubi
docs:
  - https://github.com/statico/cadubi#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README says CADUBI became widely adopted and available as a package on most
      Linux distributions. The Homebrew input records packages in Homebrew, Debian, and
      Ubuntu, matching the project's own install notes.
  package-nerd-significance:
    - >
      CADUBI is package-nerd charming because it is a tiny historical Perl art tool that
      still packages cleanly: one script, a man page, a dependency on Term::ReadKey, and
      a workflow rooted in terminal capabilities rather than modern graphics stacks.
  project-history:
    - >
      The official README says CADUBI was written around 1997, before the author knew
      much about Perl or Unix, and that the code has not changed much since. The GitHub
      repository preserves the script, man page, help text, screenshots, and
      packaging-oriented README.
    - >
      CADUBI belongs to the older terminal-art lineage where color, bold, inverse, and
      blink attributes are part of the drawing medium. Rather than being a bitmap
      editor, it edits text that can be displayed directly by cat, BBSes, email, login
      prompts, and terminal emulators.
  related-projects:
    - >
      Related tools and traditions include ANSI art editors, ASCII art utilities,
      terminal BBS art, Perl console programs using Term::ReadKey, and classic text
      editors such as pico and joe whose key-driven feel the README references.
  sources:
    - https://github.com/statico/cadubi#readme
    - https://raw.githubusercontent.com/statico/cadubi/master/README.md
    - source_facts.package-manager
  summary:
    - >
      CADUBI is a Perl terminal drawing program for creating ANSI/ASCII art in
      Unix-style consoles. Its name expands to Creative ASCII Drawing Utility By Ian,
      and its README dates the original program to around 1997.
  timeline:
    - '1997: CADUBI is written, according to the official README.'
    - '2010s: Project is preserved on GitHub with README, screenshots, script, and man page.'
    - '2016: GitHub releases show cadubi-1.3.3 as the latest release.'
    - '2020s: CADUBI remains available through Homebrew, Debian, and Ubuntu packaging.'
  usage:
    - >
      CADUBI provides a movable cursor, a current pen character, foreground and
      background colors, bold, inverse, blink, text mode, file read/write commands, and
      a size option for fixed-width workspaces. Its command-line form is cadubi
      [OPTIONS] [FILE].
related-packages: []
