history:
  adoption-history:
    - >
      The modern package is not merely a developer library; it is part of the
      operating-system graphics substrate. Mesa implements APIs including OpenGL, OpenGL
      ES, Vulkan, EGL, OpenCL, and VA-API, and provides hardware, layered, virtual-GPU,
      and software drivers. Its documented driver set includes Intel, AMD Radeon, NVIDIA
      NVK/Nouveau-related support, Qualcomm Adreno/Freedreno, Broadcom VC4/V3D, ARM Mali
      drivers, Vivante, VMware SVGA3D, VirGL, Zink, LLVMpipe, and Softpipe.
  project-history:
    - >
      Mesa's technical milestones track the rise of open graphics acceleration. Mesa 2.0
      implemented OpenGL 1.1 in 1996; Mesa 2.2 added support for 3dfx Voodoo through
      Glide in 1997; Mesa 3.0 was the first public implementation of the OpenGL 1.2 API
      in 1998. In 1999 Mesa became a key component of Direct Rendering Infrastructure
      work for XFree86, with drivers following for 3dfx, 3dLabs, Intel, Matrox, and ATI
      hardware. Tungsten Graphics, cofounded by Paul and other graphics developers in
      2001 and later acquired by VMware, became another major chapter in Mesa's
      development. Gallium, developed by Keith Whitwell and other Tungsten Graphics
      employees, introduced a GPU abstraction layer that shaped later Mesa drivers.
  sources:
    - https://docs.mesa3d.org/history.html
    - https://docs.mesa3d.org/repository.html
    - https://docs.mesa3d.org/systems.html
    - https://formulae.brew.sh/formula/mesa
    - https://www.mesa3d.org/
  summary:
    - >
      Mesa is one of the foundational open-source graphics libraries in Unix and Linux
      graphics stacks. Brian Paul began the project in August 1993 as a spare-time
      implementation of a simple 3D graphics library using the then-new OpenGL API,
      inspired partly by VOGL. After negotiating with SGI over distribution of an
      OpenGL-like library, Mesa 1.0 was released on the internet in February 1995. The
      project history notes that Mesa soon received patches, features, and daily user
      feedback, and that it helped many users encounter OpenGL on systems where vendor
      OpenGL support was limited.
  usage:
    - >
      In Homebrew and other package managers, Mesa fills the graphics-runtime and
      development-library niche: applications, toolkits, games, emulators, CI
      environments, and headless renderers depend on it for standardized graphics APIs
      without bundling vendor-specific stacks. Its history explains why the package is
      both a library and an infrastructure project, maintained through freedesktop.org
      with an upstream GitLab workflow and broad hardware-driver participation.
related-packages:
