id: brew:awk
display-name: One True Awk
homepage: https://www.cs.princeton.edu/~bwk/btl.mirror/
repo: https://github.com/onetrueawk/awk
docs:
  - https://awk.dev/
  - https://github.com/onetrueawk/awk#readme
  - https://github.com/onetrueawk/awk/blob/master/awk.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Awk spread through Unix culture because it sits between grep, sed, cut, and a full
      programming language. Its pattern-action model lets shell users write small data
      programs directly in pipelines without compiling anything or creating a larger
      script project.
    - >
      The 2023 second edition of The AWK Programming Language and the continuing
      maintenance of the onetrueawk repository are part of awk's unusual afterlife: an
      old Unix language remains relevant because CSV-ish logs, columnar text, and quick
      data checks have not gone away.
  package-nerd-significance:
    - >
      For package nerds, awk is a tiny package with oversized cultural weight. It
      overlaps with POSIX awk, BWK awk, gawk, mawk, and system-provided /usr/bin/awk, so
      the packaging question is often which awk you are intentionally installing rather
      than whether awk exists at all.
    - >
      Homebrew's awk formula is useful on macOS because it gives users a current One
      True Awk without replacing the system awk. That makes it attractive for people
      testing portability, newer awk fixes, or scripts that should stay close to the
      original language rather than GNU awk extensions.
  project-history:
    - >
      Awk was developed at Bell Labs by Alfred Aho, Brian Kernighan, and Peter
      Weinberger. The original paper, referenced from the official awk.dev site,
      describes awk as a pattern scanning and processing language; the 1985 technical
      report covered the expanded language that became the basis for the 1988 book.
    - >
      The official awk.dev page for The AWK Programming Language, Second Edition says
      the first edition was written by Aho, Kernighan, and Weinberger in 1988, and
      points to the maintained source at github.com/onetrueawk/awk. That repository is
      the modern home for the implementation commonly called One True Awk.
  related-projects:
    - >
      GNU awk, or gawk, is the GNU Project implementation and has its own manual and
      release stream.
    - mawk is another long-lived awk implementation focused on speed and small size.
    - >
      sed, grep, cut, perl, and shell are neighboring tools in the same Unix
      text-processing workflow.
  sources:
    - https://awk.dev/
    - https://github.com/onetrueawk/awk
    - https://github.com/onetrueawk/awk/blob/master/awk.1
    - https://www.cs.princeton.edu/~bwk/
    - source_facts.description
    - source_facts.repo
  summary:
    - >
      One True Awk is Brian Kernighan's maintained awk implementation, packaged by
      Homebrew as awk. It is the direct lineage most Unix people mean when they say awk
      as a small pattern-action language for scanning text, selecting fields, computing
      summaries, and printing reports.
  timeline:
    - '1979: The original Awk paper appeared in Software: Practice and Experience.'
    - '1985: Bell Labs technical report CSTR 118 documented the expanded awk language.'
    - '1988: The first edition of The AWK Programming Language was published.'
    - >
      2023: The AWK Programming Language, Second Edition was published with an official
      companion site.
    - '2026: awk.dev continues to point users to the maintained onetrueawk source repository.'
  usage:
    - >
      Typical usage is inline and pipeline-oriented: match records, split fields,
      accumulate counters, transform columns, and print reports. The man page and
      historical papers emphasize scanning input lines for patterns and executing
      actions for matching lines.
    - >
      There is no project-specific config or credential file. Awk programs are supplied
      on the command line or in script files, and behavior is controlled by variables,
      input files, and environment inherited from the shell.
related-packages:
  - id: brew:gawk
    reason: >
      Choose GNU Awk when scripts need GNU-specific capabilities such as networking,
      profiling, debugging, sorted-array helpers, or dynamically loaded C/C++
      extensions.
    rel: alternative
    sources:
      - https://www.gnu.org/software/gawk/manual/gawk.html
      - https://awk.dev/
  - id: brew:mawk
    reason: >
      Choose mawk when you want a POSIX-oriented AWK interpreter with a comparatively
      small set of implementation extensions and broad Unix package availability.
    rel: alternative
    sources:
      - https://invisible-island.net/mawk/mawk.html
      - https://invisible-island.net/mawk/manpage/mawk.html
      - https://awk.dev/
category: language-runtime
package-manager:
  brew: awk
  chocolatey: awk
  pacman: gawk
  zypper: gawk
package-manager-url: https://formulae.brew.sh/formula/awk
license: SMLNJ
tags:
  - awk
  - cli
  - scripting-language
  - text-processing
  - unix
description: Text processing scripting language
executables:
  - awk
provenance:
  formula: awk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
