id: brew:admesh
display-name: ADMesh
homepage: https://github.com/admesh/admesh
repo: https://github.com/admesh/admesh
docs:
  - https://admesh.readthedocs.io/
  - https://github.com/admesh/admesh#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ADMesh predates the current 3D-printing boom, but its feature set maps cleanly
      onto package-manager utility expectations: one CLI, a C library, documented
      examples, and repair operations for flawed STL files. The supplied package
      metadata shows availability through Homebrew, Alpine, Debian, Fedora, MacPorts,
      and Ubuntu.
    - >
      The historical README also records portability testing on Linux, SunOS, IRIX,
      DOS/Windows via DJGPP, and Windows NT-era systems. That cross-platform C heritage
      helps explain why the tool survived as a small packageable mesh utility.
  package-nerd-significance:
    - >
      ADMesh is the kind of package that keeps old CAD and rapid-prototyping workflows
      reproducible: compact ANSI C, GPL, no service component, and behavior centered on
      file transformations. For package maintainers, it is a practical example of
      preserving a niche engineering tool by moving it into a shared upstream
      repository.
  project-history:
    - >
      The official README says ADMesh was released as an application in 1995/96 and that
      not much happened for a long time afterward. The modern GitHub repository was
      created in October 2013 as a fork to provide a shared library and collect bug
      fixes from downstream users.
    - >
      The project documentation describes ADMesh as ANSI C software, GPLv2+, and focused
      on STL input with output support for STL, VRML, OFF, and DXF. The README states
      that no further feature development is planned, but bugs may be resolved and pull
      requests are welcome if they keep the code warning-clean.
  related-projects:
    - >
      Anthony Martin's master's thesis is cited by the official docs for the underlying
      algorithms.
    - Python bindings are documented by the project.
  sources:
    - https://admesh.readthedocs.io/
    - https://api.github.com/repos/admesh/admesh
    - https://api.github.com/repos/admesh/admesh/tags?per_page=100
    - https://github.com/admesh/admesh#readme
    - source_facts.package-manager
  summary:
    - >
      ADMesh is an old-school command-line and C-library tool for reading, checking,
      repairing, transforming, and writing STL-based triangulated solid meshes. It is
      especially associated with rapid prototyping and 3D-printing-era STL repair
      workflows.
  timeline:
    - '1995/96: README says ADMesh was released as an application.'
    - '2013-10: GitHub repository created for the modern shared-library fork.'
    - 'v0.98.x: Modern releases document the CLI, C API, and packageable tarballs.'
  usage:
    - >
      Users run admesh on STL files to inspect mesh statistics, repair disconnected
      facets, fill holes, fix normals, remove degenerate facets, merge files, transform
      coordinates, scale parts, and export to other mesh formats.
    - >
      The docs expose both a command-line interface and C API, plus Python bindings
      documentation. That makes ADMesh useful as a shell utility, a library dependency,
      or a backend for simple mesh-repair workflows.
related-packages: []
category: media
