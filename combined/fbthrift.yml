id: brew:fbthrift
display-name: fbthrift
homepage: https://github.com/facebook/fbthrift
repo: https://github.com/facebook/fbthrift
docs:
  - https://github.com/facebook/fbthrift/wiki
  - https://github.com/facebook/fbthrift#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The strongest adoption signal is internal: the fbthrift README says most Facebook
      services use Thrift for RPC, and some storage systems use Thrift for serializing
      records on disk.
    - >
      Outside Meta, fbthrift is mostly adopted by developers who specifically need
      Meta's C++ Thrift stack rather than the Apache distribution. Package managers
      expose it as a compiler/runtime toolchain, with Homebrew's formula providing the
      `thrift1` executable.
  package-nerd-significance:
    - >
      fbthrift is the package-manager face of Meta's Thrift branch: a heavy but
      important toolchain package for people who need compatibility with Facebook/Meta
      thrift definitions, C++ service infrastructure, or projects built against fbthrift
      rather than Apache Thrift.
    - >
      It also illustrates a common packaging split: the upstream concept is Thrift, but
      the formula name distinguishes Meta's branch from the Apache implementation so
      both can exist in package ecosystems without pretending they are interchangeable.
  project-history:
    - >
      Thrift began as the cross-language service framework associated with Facebook and
      Apache Thrift. Apache Thrift's own site describes the framework as combining a
      software stack with a code-generation engine for scalable cross-language services
      development.
    - >
      Facebook maintained an internal branch for production service communication, then
      publicly re-released that branch as fbthrift in 2014. The public repository was
      created in 2013, and the project README states that the open-source release
      initially tracked Apache Thrift closely before diverging in new directions.
  related-projects:
    - >
      Apache Thrift is the upstream family and comparison point, while fbthrift is
      Meta's evolved branch.
    - >
      Folly, Fizz, Wangle, and other Meta C++ libraries appear in the fbthrift build
      dependency stack.
  sources:
    - https://github.com/facebook/fbthrift
    - https://raw.githubusercontent.com/facebook/fbthrift/main/README.md
    - >
      https://engineering.fb.com/2014/02/20/open-source/under-the-hood-building-and-open-sourcing-fbthrift/
    - https://thrift.apache.org/
  summary:
    - >
      Facebook Thrift, usually packaged as fbthrift, is Meta's open-source branch of
      Thrift: a serialization, code-generation, and RPC framework for service
      communication. The project matters to package users because it ships the `thrift1`
      compiler and C++/Python-oriented runtime pieces used to generate service types,
      clients, and servers from `.thrift` interface files.
    - >
      The project is significant because it is not just a repackaged Apache Thrift
      release. The README describes it as an evolved internal Facebook branch that was
      re-released to the open-source community in February 2014, with a rewritten
      compiler and a fully asynchronous Thrift server.
  timeline:
    - >
      2007: Apache Thrift material describes the cross-language service framework and
      compiler model.
    - '2013: The public facebook/fbthrift GitHub repository was created.'
    - >
      2014: Facebook re-released its evolved internal Thrift branch to the open-source
      community.
    - >
      2014 onward: fbthrift diverged from Apache Thrift with a rewritten compiler and
      asynchronous C++ server support.
  usage:
    - >
      Users write `.thrift` files to define serializable types and service interfaces,
      then run the compiler to generate language-specific structures, clients, and
      server stubs. The README frames Thrift as a code generator, serialization
      framework, and RPC framework.
    - >
      The package is most relevant for C++ service developers because fbthrift
      emphasizes cpp2 support, asynchronous servers, and integration with other Meta C++
      infrastructure such as Folly.
related-packages:
  - id: brew:thrift
    reason: >
      Choose Apache Thrift for the community-governed, broadly cross-language
      implementation; choose fbthrift when a project specifically requires Meta's
      divergent compiler or asynchronous C++ stack.
    rel: alternative
    sources:
      - https://github.com/facebook/fbthrift
      - https://thrift.apache.org/docs/
      - https://github.com/apache/thrift
category: developer-tools
package-manager:
  brew: fbthrift
  macports: fbthrift
  nix: fbthrift
package-manager-url: https://formulae.brew.sh/formula/fbthrift
license: Apache-2.0
tags:
  - cli
  - code-generation
  - cpp
  - rpc
  - serialization
  - thrift
description: Facebook's branch of Apache Thrift, including a new C++ server
executables:
  - thrift1
provenance:
  formula: fbthrift
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
