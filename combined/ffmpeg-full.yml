id: brew:ffmpeg-full
display-name: FFmpeg Full
homepage: https://ffmpeg.org/
repo: https://git.ffmpeg.org/ffmpeg.git
docs:
  - https://ffmpeg.org/documentation.html
config-file-location:
  unix:
    - $FFMPEG_DATADIR/*.ffpreset
    - ~/.ffmpeg/*.ffpreset
    - PREFIX/share/ffmpeg/*.ffpreset
credentials-file-location: null
history:
  adoption-history:
    - >
      FFmpeg's official site lists distribution/package paths for Debian, Ubuntu,
      Fedora/RHEL, Windows builds, and macOS static builds, reflecting its role as
      infrastructure consumed through operating-system and language/package ecosystems
      as much as through direct source builds.
    - >
      The Homebrew ffmpeg-full formula uses the FFmpeg release tarball and depends on a
      broad set of optional libraries, including AV1, subtitle, streaming, image,
      speech, and classic codec libraries. That makes it the package for users who want
      fewer surprises about codec availability on macOS.
  package-nerd-significance:
    - >
      Package nerds care about ffmpeg-full because FFmpeg's behavior is heavily shaped
      by compile-time options and linked libraries. Two machines can both have `ffmpeg`
      installed while supporting different encoders, decoders, filters, and protocols.
    - >
      The formula embodies the long-running packaging tradeoff around FFmpeg: broad
      codec coverage and convenience versus larger dependency closures, licensing
      implications, and more moving parts to rebuild.
  project-history:
    - >
      FFmpeg describes itself as a leading multimedia framework able to decode, encode,
      transcode, mux, demux, stream, filter, and play media. The upstream contains
      command-line tools such as ffmpeg, ffplay, and ffprobe, plus libraries including
      libavcodec, libavformat, libavfilter, libavdevice, libswscale, and libswresample.
    - >
      The official download page emphasizes that FFmpeg upstream provides source code,
      while compiled packages are supplied by distributions and build providers. That
      source-first posture is why package formulas matter: the package decides which
      optional libraries and codecs are present for end users.
  related-projects:
    - FFmpeg is the upstream project.
    - >
      Homebrew's regular ffmpeg formula is the leaner sibling formula with a smaller
      dependency set.
    - >
      libavcodec, libavformat, libavfilter, ffmpeg, ffplay, and ffprobe are the upstream
      libraries and tools exposed by FFmpeg builds.
  sources:
    - https://ffmpeg.org/about.html
    - https://ffmpeg.org/download.html
    - https://formulae.brew.sh/api/formula/ffmpeg-full.json
    - https://formulae.brew.sh/api/formula/ffmpeg.json
  summary:
    - >
      ffmpeg-full is a packaging variant of FFmpeg rather than a separate upstream
      project. Its history is FFmpeg's history plus the package-manager concern of
      building the same multimedia framework with a broader codec and feature surface.
  timeline:
    - >
      2000s: FFmpeg becomes a central free-software multimedia framework and
      command-line toolkit.
    - '2011: FFmpeg release signing key date appears in upstream release verification docs.'
    - >
      2026: Upstream download docs list FFmpeg 8.1.2 as a current stable source release;
      Homebrew ffmpeg-full builds from FFmpeg's release tarball with a broad dependency
      set.
  usage:
    - >
      Usage remains the normal FFmpeg command-line model: convert, inspect, stream,
      filter, and remux media with ffmpeg, ffprobe, and related tools. The point of
      ffmpeg-full is not a new UI; it is broader compiled-in functionality.
    - >
      Compared with leaner FFmpeg formulas, ffmpeg-full is useful when workflows depend
      on external codec libraries or protocol support that may not be enabled in a
      smaller build.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose the regular ffmpeg formula when its selected codecs cover the workflow and
      a smaller dependency set is preferable to ffmpeg-full's additional tools and
      libraries.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/ffmpeg
      - https://formulae.brew.sh/formula/ffmpeg-full
  - id: brew:yt-dlp
    reason: >
      yt-dlp uses ffmpeg and ffprobe to merge downloaded audio and video streams and run
      post-processing steps, benefiting from an FFmpeg build with the required formats
      enabled.
    rel: adjacent_workflow
    sources:
      - https://github.com/yt-dlp/yt-dlp
      - https://ffmpeg.org/ffmpeg.html
  - id: brew:ab-av1
    reason: >
      ab-av1 invokes FFmpeg for VMAF-guided AV1 and other encoder workflows and
      documents the required FFmpeg libraries and encoders.
    rel: adjacent_workflow
    sources:
      - https://github.com/alexheretic/ab-av1
      - https://ffmpeg.org/ffmpeg.html
category: media
package-manager:
  brew: ffmpeg-full
  chocolatey: ffmpeg-full
package-manager-url: https://formulae.brew.sh/formula/ffmpeg-full
license: GPL-3.0-or-later
tags:
  - audio
  - cli
  - codec
  - streaming
  - transcoding
  - video
description: Play, record, convert, and stream many audio and video codecs
executables:
  - zmqsend
provenance:
  formula: ffmpeg-full
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
