id: brew:nco
display-name: NCO
homepage: https://nco.sourceforge.net/
repo: https://github.com/nco/nco
docs:
  - https://nco.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      NCO became a durable part of the netCDF ecosystem because it gives scientists
      scriptable Unix-style tools instead of requiring a custom C, Fortran, Python,
      MATLAB, or IDL program for every data-editing task. The project says SourceForge
      began hosting NCO in March 2000, which helped collaboration, contributions, and
      support.
  package-nerd-significance:
    - >
      NCO is a classic example of domain-specific CLI tooling that stayed relevant
      because the file format stayed relevant. It is important for package collections
      because it bridges lower-level libraries such as netCDF and HDF with practical
      batch workflows used by climate, atmospheric, oceanographic, and earth-system
      researchers.
  project-history:
    - >
      Charlie Zender's NCO documentation traces the package back to software needs from
      NCAR, NASA, and ARM-funded work, with copyright beginning in 1995 and a May 1997
      foreword offering the tools freely to the scientific community. Unidata's netCDF
      history places NCO 1.0 in June 1997, one month after netCDF 3.3.
  related-projects:
    - netCDF, HDF4, HDF5, DAP, OPeNDAP, Unidata, ESMF, climate and geoscience model outputs
  sources:
    - https://docs.unidata.ucar.edu/nug/2.0-draft/netcdf_history.html
    - https://formulae.brew.sh/formula/nco
    - https://github.com/nco/nco/blob/master/CITATION
    - https://nco.sourceforge.net/
    - https://nco.sourceforge.net/nco.html
    - https://nco.sourceforge.net/src/
  summary:
    - >
      NCO, the netCDF Operators, is a suite of standalone shell commands for
      manipulating netCDF, HDF, and DAP scientific-data files. The project sits in the
      geoscience data-tooling world: derive fields, compute statistics, print and
      hyperslab data, edit metadata, concatenate files, regrid data, and emit text,
      binary, or netCDF outputs.
  timeline:
    - >
      1995: NCO source/documentation copyright begins and the project describes itself
      as GPL open source since 1995.
    - 'June 1997: Unidata history records Charlie Zender releasing NCO 1.0.'
    - 'March 2000: SourceForge hosting begins for collaboration and support.'
    - '2008: Recommended software citation published in Environmental Modelling & Software.'
    - >
      2020s: 5.x releases continue adding climate, remapping, compression, and
      model-workflow features.
  usage:
    - >
      Package users reach for commands like ncks for inspection and extraction, ncrcat
      for record concatenation, ncra or ncwa for averages, ncatted and ncrename for
      metadata cleanup, ncap2 for derived variables, and ncremap/ncclimo for climate and
      regridding workflows. The shell-command style is the point: build reproducible
      data-processing pipelines with normal scripts.
related-packages:
  - id: brew:cdo
    reason: >
      Choose Climate Data Operators when a climate or numerical-weather workflow needs
      its broader collection of operators and support for GRIB, netCDF, SERVICE, EXTRA,
      and IEG formats.
    rel: alternative
    sources:
      - https://code.mpimet.mpg.de/projects/cdo
      - https://nco.sourceforge.net/
  - id: brew:netcdf
    reason: >
      Install netCDF as the foundational library and utility layer for creating,
      inspecting, and converting the files that NCO processes in more elaborate
      scientific-data pipelines.
    rel: adjacent_workflow
    sources:
      - https://docs.unidata.ucar.edu/netcdf-c/current/
      - https://docs.unidata.ucar.edu/netcdf-c/current/netcdf_working_with_netcdf_files.html
      - https://nco.sourceforge.net/
