id: brew:mu
display-name: mu
homepage: https://www.djcbsoftware.nl/code/mu/
repo: https://github.com/djcb/mu
docs:
  - https://www.djcbsoftware.nl/code/mu
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      Its technical niche is the combination of fast Maildir indexing, a Xapian-backed
      query database, and package-shipped companion interfaces. The best-known companion
      is mu4e, a GNU Emacs mail client built on top of mu; the package also exposes
      Guile/Scheme bindings. In practice, users initialize a database for a Maildir, run
      `mu index` after mail is delivered by tools such as mbsync, offlineimap, or
      fetchmail, and query it from the `mu` CLI or from mu4e inside Emacs.
  sources:
    - https://api.github.com/repos/djcb/mu
    - https://formulae.brew.sh/formula/mu
    - https://github.com/djcb/mu
    - https://www.djcbsoftware.nl/code/mu/
  summary:
    - >
      mu is Dirk-Jan C. Binnema's Maildir search and indexing toolkit for Unix-like
      systems. The project site says the first mu versions date to 2008, and presents
      the package as a response to large personal mail stores: index the Maildir once,
      then find, view, extract attachments from, and organize messages through
      command-line tools.
  usage:
    - >
      In package-manager terms, mu sits at the intersection of mail tooling, desktop
      productivity, and Emacs workflows. It is packaged by several Unix-like
      distributions, sometimes under the name `maildir-utils`, while Homebrew and
      similar managers expose it as `mu`.
related-packages:
  - id: brew:notmuch
    reason: >
      Choose notmuch as an alternative local email index when arbitrary tags, library
      APIs, and its own editor frontends are more important than mu's bundled mu4e
      workflow.
    rel: alternative
    sources:
      - https://www.djcbsoftware.nl/code/mu/
      - https://notmuchmail.org/
  - id: brew:isync
    reason: >
      Use isync's `mbsync` to synchronize IMAP mail into Maildir before mu or mu4e
      indexes it; the mu4e manual explicitly documents this retrieval command.
    rel: adjacent_workflow
    sources:
      - https://www.djcbsoftware.nl/code/mu/mu4e/Retrieval-and-indexing.html
      - https://isync.sourceforge.io/mbsync.html
category: productivity
package-manager:
  apk: guile-mu
  brew: mu
  macports: mu
  nix: mu
  winget: Mu.Mu
package-manager-url: https://formulae.brew.sh/formula/mu
license: GPL-3.0-or-later
tags:
