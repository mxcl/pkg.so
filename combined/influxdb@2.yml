id: brew:influxdb@2
display-name: InfluxDB 2
homepage: https://influxdata.com/time-series-platform/influxdb/
repo: https://github.com/influxdata/influxdb
docs:
  - https://docs.influxdata.com/influxdb/v2
  - https://docs.influxdata.com/influxdb/v2/reference/config-options
config-file-location:
  linux: /etc/influxdb/config.toml
  unix:
    - ./config.yaml
    - ./config.yml
    - ./config.toml
    - ./config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      InfluxData's 2.0 announcement positioned the release as a successor to 1.0, which
      had shipped in September 2016, and cited millions of open source downloads plus
      hundreds of thousands of daily active instances across the preceding years.
    - >
      The package-manager story is shaped by coexistence: `influxdb@1` and `influxdb@2`
      remain separate because operators often need to choose between the 1.x
      compatibility surface and the 2.x integrated platform model.
  package-nerd-significance:
    - >
      InfluxDB 2 is significant because it turned a package-manager upgrade into a
      product-line choice. The formula boundary preserves an operational distinction
      between InfluxQL-era infrastructure and Flux/token/UI-era infrastructure.
    - >
      It also captures a common infrastructure pattern: a daemon that absorbs adjacent
      tools from its ecosystem into one installable unit while keeping data collection
      in a companion agent.
  project-history:
    - >
      InfluxDB 2 evolved from the 1.x database and the surrounding TICK stack.
      InfluxData described Cloud 2.0 as the evolution of Telegraf, InfluxDB, Chronograf,
      and Kapacitor into a unified experience, with Telegraf remaining the edge data
      collector.
    - >
      The 2.0 open source release reached general availability in November 2020. Its
      public messaging emphasized a single binary, token-based security, built-in UI,
      Flux, and upgrade paths from earlier InfluxDB installations.
  related-projects:
    - >
      Related projects include InfluxDB 1.x, Telegraf, Chronograf, Kapacitor, Flux,
      InfluxDB Cloud 2.0, and later InfluxDB 3 work in the same repository.
  sources:
    - https://docs.influxdata.com/influxdb/v2
    - https://github.com/influxdata/influxdb
    - >
      https://www.influxdata.com/blog/influxdata-advances-possibilities-of-time-series-data-with-general-availability-of-influxdb-2-0/
    - https://www.influxdata.com/blog/influxdb-2-0-open-source-is-generally-available/
    - >
      https://www.influxdata.com/blog/influxdb-cloud-2-0-launches-as-a-serverless-platform-for-time-series-data/
    - >
      https://www.influxdata.com/blog/why-were-building-flux-a-new-data-scripting-and-query-language/
  summary:
    - >
      InfluxDB 2 is the second major open source InfluxDB line, combining storage, UI,
      visualization, processing, monitoring, and alerting into a single time-series
      platform.
  timeline:
    - '2019: InfluxDB 2.0 alpha builds appeared in the public GitHub release stream.'
    - '2020: InfluxDB Cloud 2.0 was announced as a unified TICK-stack experience.'
    - '2020: InfluxDB Open Source 2.0 reached general availability.'
    - '2020: InfluxData announced a storage reimagining project alongside the 2.0 platform.'
  usage:
    - >
      The Homebrew formula exposes `influxd` for running the server. In the 2.x line,
      users commonly interact with the database through the web UI, token-authenticated
      APIs, Flux queries, and the separate Influx CLI.
    - >
      InfluxDB 2 is used for metrics, events, observability, IoT, and application
      time-series workloads where the database, UI, tasks, and alerting are expected to
      arrive as one platform rather than several separately deployed components.
related-packages:
  - id: brew:influxdb-cli
    reason: >
      Use the standalone influx CLI to initialize the server and manage its buckets,
      organizations, tokens, tasks, backups, and other v2 resources.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/influxdb/v2/tools/influx-cli/
      - https://docs.influxdata.com/influxdb/v2/reference/cli/influx/
  - id: brew:telegraf
    reason: >
      Telegraf collects and processes metrics before writing them to InfluxDB 2, and its
      configurations can be managed through the v2 API and CLI.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/telegraf/v1/
      - https://docs.influxdata.com/influxdb/v2/reference/cli/influx/telegrafs/
category: data
package-manager:
  brew: influxdb@2
  debian: golang-github-influxdb-influxdb-dev
  macports: influxdb
  nix: influxdb2
  pacman: influxdb
  scoop: versions/influxdb2
  ubuntu: golang-github-influxdb-influxdb-dev
  zypper: influxdb2
package-manager-match:
  debian: fallback
  macports: fallback
  pacman: fallback
  ubuntu: fallback
package-manager-url: https://formulae.brew.sh/formula/influxdb@2
license: MIT
tags:
  - cli
  - database
  - events
  - metrics
  - server
  - time-series
description: Time series, events, and metrics database
executables:
  - influxd
provenance:
  formula: influxdb@2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
