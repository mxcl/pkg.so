history:
  adoption-history:
    - >
      ProPresenter was initially built for houses of worship, where its lyric,
      scripture, copyright, video, and stage-display workflows provided a
      domain-specific alternative to general-purpose slide software.
    - >
      Renewed Vision later expanded the product's audience to concerts, schools,
      businesses, sports, broadcast production, and other live events. Official product
      material documents multi-screen output, stage displays, broadcast hardware,
      streaming, automation, APIs, and third-party integrations.
    - >
      The beta package exposes Renewed Vision's more frequently updated pre-release
      channel. The vendor warns that beta builds may not be fully tested and recommends
      extensive evaluation before using them in a live-production environment.
  package-nerd-significance:
    - >
      ProPresenter is a heavyweight proprietary desktop package whose value comes from
      integrated show-control and live-output workflows rather than ordinary slide
      authoring. Homebrew Cask makes both stable and beta application channels available
      to managed macOS installations.
    - >
      The beta token is particularly useful to production engineers and integrators
      evaluating compatibility with displays, capture hardware, control protocols, and
      show files before an update reaches the stable channel.
  project-history:
    - >
      Renewed Vision was established in 2000 to create production tools for ministries,
      and ProPresenter grew from that worship-presentation focus. Official legacy
      documentation records an established ProPresenter 3 desktop product by 2008.
    - >
      By the ProPresenter 6 era, the application was used for worship, television,
      streaming, and multi-venue live production. ProPresenter 7 expanded its documented
      scope around layered presentations, screen configuration, stage layouts,
      recording, RTMP streaming, network control, APIs, and integrations.
    - >
      The product subsequently adopted account-based subscriptions and cloud-connected
      services while retaining downloadable applications for macOS and Windows.
  related-projects:
    - >
      The stable ProPresenter channel offers the same core product with releases
      intended for live production.
    - >
      Renewed Vision positions ProVideoPlayer alongside ProPresenter for professional
      video playback, screen mapping, and broadcast workflows.
  sources:
    - https://learn.renewedvision.com/propresenter
    - https://learn.renewedvision.com/propresenter/preferences
    - https://renewedvision.com/propresenter
    - https://www.renewedvision.com/about-renewed-vision
    - https://www.renewedvision.com/downloads/pp3_manual.pdf
  summary:
    - >
      ProPresenter Beta is the pre-release channel of Renewed Vision's commercial
      presentation and live-production application for worship, events, multi-screen
      output, and broadcast graphics.
  timeline:
    - '2000: Renewed Vision was established to create production tools for ministries.'
    - >
      2008: Official ProPresenter 3 documentation recorded an established downloadable
      desktop product.
    - >
      2010s: ProPresenter expanded across worship, streaming, broadcast, and multi-venue
      production workflows.
    - >
      2020s: ProPresenter 7 formalized layered output, streaming, APIs, network control,
      and extensive integrations.
    - >
      Present: Renewed Vision maintains release and beta update channels, with beta
      builds published more frequently for pre-production testing.
  usage:
    - >
      Operators combine slides, lyrics, scripture, images, audio, video, and live
      inputs, then send tailored layouts to audience screens, stage displays, lobby
      feeds, recordings, streams, or broadcast hardware.
    - >
      Beta builds are appropriate for testing upcoming changes and integrations, but
      Renewed Vision recommends the release channel for live production unless a beta
      has been extensively tested in the user's environment.
related-packages:
  - id: cask:propresenter
    reason: >
      Choose the stable ProPresenter cask for live-production systems where Renewed
      Vision's more thoroughly tested release channel is preferable to frequent beta
      updates.
    rel: alternative
    sources:
      - https://learn.renewedvision.com/propresenter/preferences
      - https://renewedvision.com/propresenter
  - id: cask:provideoplayer
    reason: >
      Use ProVideoPlayer alongside ProPresenter when a production needs dedicated
      multi-screen media playback, compositing, or display mapping within Renewed
      Vision's documented live-production workflow.
    rel: adjacent_workflow
    sources:
      - https://renewedvision.com/propresenter
      - https://renewedvision.com/provideoplayer
