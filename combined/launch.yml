id: brew:launch
display-name: launch
homepage: https://sabi.net/nriley/software/#launch
repo: https://github.com/nriley/launch
docs:
  - https://github.com/nriley/launch#readme
  - https://sabi.net/nriley/software
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      launch is packaged by Homebrew and MacPorts, which fits its audience: macOS users
      who live in the shell but need Launch Services features more detailed than open's
      default interface.
  package-nerd-significance:
    - >
      For package nerds, launch is a compact example of why macOS package collections
      are not just Unix ports: they also preserve small native utilities that bridge
      shell workflows to Cocoa-era system APIs.
  project-history:
    - >
      The README states the motivation plainly: macOS already has open, but launch
      offers additional options. Its version history shows continuing maintenance across
      OS X and macOS transitions, including 64-bit Intel binaries for OS X 10.8 and
      later in 1.2.4, a 2018 1.2.5 fix, and unreleased Universal 2 signing work for
      macOS/OS X 10.9 and later.
    - >
      The public GitHub repository is a distribution and maintenance point with no
      GitHub Releases published, so the README's embedded version history is the main
      authoritative chronology.
  related-projects:
    - >
      Related tools include Apple's open(1), macOS Launch Services, Homebrew's launch
      formula, and the MacPorts launch port.
  sources:
    - https://formulae.brew.sh/formula/launch
    - https://github.com/nriley/launch
    - https://sabi.net/nriley/software
  summary:
    - >
      launch is a macOS command-line launcher written by Nicholas Riley in the spirit of
      Apple's open(1), adding options that Apple's built-in tool did not expose. It
      belongs to the small tradition of Mac developer utilities that wrap Launch
      Services behavior in scriptable Unix-style commands.
  timeline:
    - >
      2017: Version 1.2.4 dated 2017-10-01 adjusted installation paths and macOS 10.13
      SDK compatibility.
    - '2018: Version 1.2.5 dated 2018-04-02 fixed option restrictions involving -l.'
    - >
      2020s: Version 1.2.6d1 README marks unreleased signed Universal 2 binary work for
      macOS/OS X 10.9 and later.
  usage:
    - >
      Users invoke launch from scripts or terminals to open files, URLs, applications,
      or Launch Services targets with more control than open(1). Its usefulness is
      mostly macOS-specific and tied to desktop integration rather than portable Unix
      behavior.
related-packages: []
category: system
