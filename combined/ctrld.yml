id: brew:ctrld
display-name: ctrld
homepage: https://github.com/Control-D-Inc/ctrld
repo: https://github.com/Control-D-Inc/ctrld
docs:
  - https://docs.controld.com/docs/ctrld
  - https://github.com/Control-D-Inc/ctrld/tree/main/docs
  - https://github.com/Control-D-Inc/ctrld#readme
config-file-location:
  unix:
    - /etc/controld/ctrld.toml
    - ./ctrld.toml
    - ./config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official documentation frames adoption around network operators, users who
      need secure DNS on devices without native support, split-horizon DNS deployments,
      roaming clients, and router-style installations.
  package-nerd-significance:
    - >
      For package managers, ctrld is a small but operationally important DNS daemon: it
      ships a single CLI/service binary, has persistent configuration paths, and bridges
      a hosted DNS control plane with local Unix-like service management.
  project-history:
    - >
      Control D documents ctrld as an open-source daemon developed to make onboarding
      possible on many device types. The public GitHub repository describes it as a
      highly configurable, multi-protocol DNS forwarding proxy and was created in late
      2022.
  related-projects:
    - Control D, secure DNS protocols, DNS-over-HTTPS, DNS-over-TLS, local DNS forwarders.
  sources:
    - https://docs.controld.com/docs/ctrld
    - https://github.com/Control-D-Inc/ctrld
    - https://api.github.com/repos/Control-D-Inc/ctrld
  summary:
    - >
      ctrld is Control D's open-source command-line daemon for running a local DNS proxy
      and forwarding service on routers, servers, and client machines.
  timeline:
    - '2022: Public Control-D-Inc/ctrld repository created.'
    - >
      2020s: Control D documents ctrld as the command-line daemon for router, LAN, and
      roaming-client DNS deployments.
  usage:
    - >
      Typical use is to install ctrld as a local service, point a device or LAN at it
      for DNS, and configure Control D resolver behavior through generated or local TOML
      configuration.
related-packages:
  - id: brew:dnscrypt-proxy
    reason: >
      Choose dnscrypt-proxy for a provider-neutral encrypted-DNS proxy centered on
      DNSCrypt, DoH, filtering, and anonymized relays; choose ctrld for Control
      D-managed policy and device onboarding.
    rel: alternative
    sources:
      - https://github.com/Control-D-Inc/ctrld#readme
      - https://github.com/DNSCrypt/dnscrypt-proxy#readme
  - id: brew:bind
    reason: >
      BIND supplies dig, the DNS client used in ctrld's official verification workflow,
      for querying the local listener and confirming forwarding behavior.
    rel: adjacent_workflow
    sources:
      - https://github.com/Control-D-Inc/ctrld#readme
      - https://bind9.readthedocs.io/en/latest/manpages.html
category: networking
package-manager:
  brew: ctrld
package-manager-url: https://formulae.brew.sh/formula/ctrld
license: MIT
tags:
  - cli
  - control-d
  - daemon
  - dns
  - forwarder
  - proxy
description: Highly configurable, multi-protocol DNS forwarding proxy
executables:
  - ctrld
provenance:
  formula: ctrld
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
