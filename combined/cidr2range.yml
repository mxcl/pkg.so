id: brew:cidr2range
display-name: cidr2range
homepage: https://ipinfo.io
repo: https://github.com/ipinfo/cli
docs:
  - https://github.com/ipinfo/cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README says the IPinfo CLI suite is distributed through Homebrew,
      Ubuntu PPA, Debian or Ubuntu install scripts and debs, FreeBSD ports, Arch AUR,
      Scoop, Docker, Go install, GitHub release artifacts, and source builds. The batch
      input records cidr2range itself as a Homebrew formula.
  package-nerd-significance:
    - >
      cidr2range is useful because package managers can expose a tiny, script-friendly
      IP conversion tool without requiring users to remember a larger CLI subcommand. It
      is also an example of one upstream Go repository producing several separately
      packaged command binaries.
  project-history:
    - >
      IPinfo's CLI repository was created in October 2020 for the company's official
      command-line interface. Its README lists cidr2range among the separately shipped
      subcommand binaries, alongside cidr2ip, range2cidr, range2ip, splitcidr, prips,
      matchip, and other IP helpers.
  related-projects:
    - >
      Related IPinfo helper binaries include cidr2ip, range2cidr, range2ip, splitcidr,
      prips, matchip, grepip, randip, and mmdb.
  sources:
    - https://github.com/ipinfo/cli#readme
    - https://api.github.com/repos/ipinfo/cli
    - https://api.github.com/repos/ipinfo/cli/releases
  summary:
    - >
      cidr2range is one of the standalone helper binaries shipped from IPinfo's official
      CLI repository; it converts CIDR prefixes into IP ranges.
  timeline:
    - '2020: IPinfo CLI repository created.'
    - '2021: cidr2range-1.2.0 release published.'
    - '2020s: IPinfo CLI README documents cidr2range as a separately shipped subcommand binary.'
  usage:
    - >
      As a standalone binary, cidr2range handles the narrow conversion from CIDR
      notation to start-end IP ranges. It is part of a family of small IP list, range,
      and CIDR utilities distributed with IPinfo CLI releases.
related-packages:
  - id: brew:range2cidr
    reason: >
      range2cidr performs the inverse operation, turning an address range back into
      equivalent CIDR blocks for round-trip conversion and range normalization
      workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/ipinfo/cli#readme
      - https://github.com/ipinfo/cli/tree/master/range2cidr
  - id: brew:prips
    reason: >
      prips can enumerate the individual addresses represented by a CIDR block or
      explicit range when cidr2range's boundary output needs to become a line-oriented
      address list.
    rel: adjacent_workflow
    sources:
      - https://github.com/ipinfo/cli#readme
      - https://devel.ringlet.net/sysutils/prips/
category: networking
package-manager:
  brew: cidr2range
package-manager-url: https://formulae.brew.sh/formula/cidr2range
license: Apache-2.0
tags:
  - cidr
  - cli
  - ip-ranges
  - ipinfo
  - networking
description: Converts CIDRs to IP ranges
executables:
  - cidr2range
provenance:
  formula: cidr2range
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
