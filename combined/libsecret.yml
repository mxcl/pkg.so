id: brew:libsecret
display-name: libsecret
homepage: https://wiki.gnome.org/Projects/Libsecret
repo: https://gitlab.gnome.org/GNOME/libsecret
docs:
  - https://gnome.pages.gitlab.gnome.org/libsecret
  - https://gnome.pages.gitlab.gnome.org/libsecret/libsecret-using.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libsecret's adoption is tied to the move from application-specific password files
      toward desktop keyring services reachable over D-Bus. It gives GNOME applications,
      command-line helpers such as secret-tool, and language bindings a shared library
      interface over the Secret Service API.
  package-nerd-significance:
    - >
      libsecret is a small but sensitive dependency: it bridges package-managed
      applications to session keyrings without each package carrying its own
      password-storage backend. It is also a common build dependency for tools that only
      need secret storage on desktop Linux.
  project-history:
    - >
      The freedesktop.org Secret Service specification was authored by GNOME Keyring and
      KWallet developers and describes collections, items, sessions, prompts, and D-Bus
      interfaces for desktop secret storage. libsecret implements the client side of
      that model for GNOME-style C, GObject Introspection, JavaScript, Python, and Vala
      users.
    - >
      The GNOME API documentation identifies libsecret as a Secret Service D-Bus client
      library authored by Stef Walter, Daiki Ueno, and Niels De Graef. GitLab tag
      history shows the project publishing 0.1 in March 2012 and reaching the 0.20 and
      0.21 series in the 2020s.
  related-projects:
    - >
      Related projects include GNOME Keyring, KWallet, D-Bus, GObject Introspection,
      freedesktop.org Secret Service, and secret-tool.
  sources:
    - https://gitlab.gnome.org/GNOME/libsecret
    - https://gnome.pages.gitlab.gnome.org/libsecret
    - https://gnome.pages.gitlab.gnome.org/libsecret/libsecret-using.html
    - https://specifications.freedesktop.org/secret-service-spec/latest/
  summary:
    - >
      libsecret is GNOME's GObject-based client library for the freedesktop.org Secret
      Service D-Bus API. It is the package behind many Linux desktop applications that
      need to store passwords, tokens, and other secrets without binding directly to a
      particular keyring implementation.
  timeline:
    - >
      2008-2011: The Secret Service API copyright period covers the specification
      authorship window.
    - '2012: libsecret 0.1 was tagged in March.'
    - '2020: libsecret 0.20.0 was tagged in January.'
    - '2023: libsecret 0.21.0 was tagged in August.'
    - '2025: libsecret 0.21.7 was tagged in March.'
  usage:
    - >
      Applications define schemas and attributes, then store, look up, and delete
      secrets through the Secret Service. The official usage documentation shows
      pkg-config integration for C, imports through GObject Introspection for JavaScript
      and Python, and Vala package usage.
related-packages:
  - id: brew:git-credential-libsecret
    reason: >
      Install git-credential-libsecret when Git HTTPS credentials should be stored
      through libsecret in a Secret Service wallet instead of a plaintext credential
      file.
    rel: adjacent_workflow
    sources:
      - https://git-scm.com/doc/credential-helpers
      - https://git-scm.com/docs/gitcredentials
      - https://gnome.pages.gitlab.gnome.org/libsecret/
category: security
package-manager:
  apk: libsecret
  brew: libsecret
  debian: gir1.2-secret-1
  dnf: libsecret
  macports: libsecret
  nix: libsecret
  pacman: libsecret
  ubuntu: gir1.2-secret-1
  zypper: libsecret-1-0
package-manager-url: https://formulae.brew.sh/formula/libsecret
license: LGPL-2.1-or-later
