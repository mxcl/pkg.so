id: brew:jc
display-name: jc
homepage: https://github.com/kellyjonbrazil/jc
repo: https://github.com/kellyjonbrazil/jc
docs:
  - https://github.com/kellyjonbrazil/jc/blob/master/README.md
  - https://kellyjonbrazil.github.io/jc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      jc spread beyond a single Python package into operating-system repositories and
      automation ecosystems. The README documents installation through pip, Homebrew,
      Debian and Ubuntu, Fedora, openSUSE, Arch, Nix, Guix, Gentoo, Photon, FreeBSD
      ports, prebuilt binaries, an Ansible filter plugin, and a FortiSOAR connector.
  package-nerd-significance:
    - >
      jc is important to command-line package nerds because it reduces the need for
      brittle awk, sed, and regex parsing around legacy Unix tools. It sits in the same
      cultural lane as jq and jello: make shell pipelines structured without waiting for
      every upstream command to add a JSON flag.
  project-history:
    - >
      The public repository was created in 2019, and the project quickly centered on
      parser coverage: commands, proc files, package metadata, network tools, logs, and
      common string formats. The README links the author's project motivation under the
      theme of bringing Unix-style text pipelines into a JSON-aware shell environment.
  related-projects:
    - >
      Related projects and ecosystems named by the README include jq, jello, Ansible
      community.general, FortiSOAR, libxo, PowerShell ConvertTo-Json, and the author's
      jc web demo and REST API projects.
  sources:
    - https://formulae.brew.sh/formula/jc
    - https://github.com/kellyjonbrazil/jc
    - https://github.com/kellyjonbrazil/jc/blob/master/CHANGELOG
    - https://github.com/kellyjonbrazil/jc/blob/master/README.md
    - https://kellyjonbrazil.github.io/jc
  summary:
    - >
      jc, short for JSON Convert, is a CLI tool and Python library that turns the output
      of many command-line tools, file formats, and strings into JSON, YAML, or Python
      data structures. Its README frames the core workflow as piping familiar Unix
      command output into jc and then into tools such as jq.
  timeline:
    - '2019: The jc repository was created.'
    - '2020: The project documented automation use cases for Ansible, SaltStack, and Nornir.'
    - '2021: README examples showed piping jc output to jq and using jc as a Python library.'
    - >
      2024: Version 1.25.0 added slurp support, parser metadata improvements, and more
      parser coverage.
    - >
      2026: Version 1.25.7 added CSV and TSV parser variants, Bash variable parsers, and
      parser fixes.
  usage:
    - >
      The standard usage is to pipe command output into jc with a parser flag, or to use
      the magic syntax that prefixes the original command with jc. It can also be
      imported as a Python library, returning dictionaries, lists, or lazy iterables for
      streaming parsers.
related-packages:
  - id: brew:jq
    reason: >
      Pipe jc's generated JSON into jq when you want its purpose-built filter language
      for selecting and transforming fields, as demonstrated in jc's official README.
    rel: adjacent_workflow
    sources:
      - https://github.com/kellyjonbrazil/jc/blob/master/README.md
      - https://jqlang.github.io/jq/manual/
  - id: brew:jello
    reason: >
      Pipe jc output into jello when you prefer filtering JSON with standard Python list
      and dictionary syntax instead of jq's language.
    rel: adjacent_workflow
    sources:
      - https://github.com/kellyjonbrazil/jc/blob/master/README.md
      - https://github.com/kellyjonbrazil/jello#readme
category: developer-tools
package-manager:
  apk: jc
  brew: jc
  debian: jc
  dnf: jc
  macports: jc
  nix: jc
  pacman: jc
  scoop: main/jc
  ubuntu: jc
  winget: KellyBrazil.jc
  zypper: jc
package-manager-url: https://formulae.brew.sh/formula/jc
license: MIT
tags:
