id: brew:yutu
display-name: yutu
homepage: https://yutu.ifor.dev
repo: https://github.com/eat-pray-ai/yutu
docs:
  - https://github.com/eat-pray-ai/yutu/tree/main/docs
  - https://github.com/eat-pray-ai/yutu#readme
config-file-location: null
credentials-file-location:
  unix:
    - client_secret.json
    - youtube.token.json
history:
  adoption-history:
    - >
      Public GitHub metadata showed hundreds of stars by July 2026, making it visible
      but still young compared with long-lived YouTube automation tools. Its adoption
      signal is mostly in packaging breadth and AI-tooling integration rather than long
      historical deployment.
  package-nerd-significance:
    - >
      yutu is notable as an example of a media CLI being repackaged for agentic
      workflows. It is not just a YouTube uploader; in package-index terms it shows how
      command-line tools are becoming MCP servers and agent backends while still needing
      ordinary package-manager distribution.
  project-history:
    - >
      The GitHub repository was created in May 2023. By the 2026 README, the project had
      expanded beyond a simple YouTube utility into a combined CLI, MCP server, skill,
      and agent package distributed through GitHub releases, Homebrew, WinGet, npm,
      Docker, and Go install workflows.
    - >
      The project sits in the post-MCP tooling wave: the README foregrounds its MCP
      server and agent modes, with Google OAuth setup as the prerequisite for delegated
      YouTube operations.
  related-projects:
    - YouTube Data API v3 is the required Google API for core yutu operations.
    - >
      YouTube Analytics API and YouTube Reporting API are optional APIs named by the
      README for extended workflows.
    - MCP clients are a target integration surface for yutu's server mode.
  sources:
    - https://api.github.com/repos/eat-pray-ai/yutu
    - https://github.com/eat-pray-ai/yutu
    - https://raw.githubusercontent.com/eat-pray-ai/yutu/main/README.md
  summary:
    - >
      yutu is a Go-based CLI, MCP server, and AI-agent toolkit for YouTube workflows.
      Its README positions it around uploading and optimizing videos, managing comments,
      playlists, captions, thumbnails, analytics-related APIs, and channel operations
      through both command-line and agent interfaces.
  timeline:
    - '2023-05-20: GitHub repository is created.'
    - >
      2026: README describes yutu as a CLI, MCP server, skill, and AI agent for YouTube
      workflows.
    - >
      2026-07-02: GitHub metadata shows active repository updates on the day of this
      enrichment run.
  usage:
    - >
      Users create a Google Cloud project, enable YouTube APIs, download OAuth desktop
      credentials as client_secret.json, run yutu auth, and then use the generated
      youtube.token.json for later commands. The README also documents environment
      variables for overriding credential and token paths.
    - >
      Practical use cases include YouTube upload automation, metadata and playlist
      management, comment operations, caption and watermark tasks, and exposing these
      capabilities to MCP clients or the project's own agent mode.
related-packages: []
category: ai
package-manager:
  brew: yutu
  winget: eat-pray-ai.yutu
package-manager-url: https://formulae.brew.sh/formula/yutu
license: Apache-2.0
tags:
  - ai
  - ai-agent
  - automation
  - cli
  - mcp
  - media
  - youtube
description: CLI, MCP server, and AI agent to automate YouTube workflows
executables:
  - yutu
provenance:
  formula: yutu
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
