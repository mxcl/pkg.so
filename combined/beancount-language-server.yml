id: brew:beancount-language-server
display-name: Beancount Language Server
homepage: https://github.com/polarmutex/beancount-language-server
repo: https://github.com/polarmutex/beancount-language-server
docs:
  - https://github.com/polarmutex/beancount-language-server#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is concentrated in the Beancount and plain-text accounting community. The
      batch package facts show Homebrew, Alpine, and Nix packages, while the README
      documents Cargo install, GitHub release binaries, Homebrew, Nix, and source
      builds.
    - >
      Repository metadata showed 238 stars and 34 forks on 2026-06-30, which is modest
      in absolute terms but meaningful for an editor integration aimed at Beancount
      users rather than a general-purpose language.
  package-nerd-significance:
    - >
      This package is notable because it packages editor intelligence for a data format,
      not a programming language. It shows how LSP escaped compilers and IDEs and became
      a general protocol for structured text domains such as accounting ledgers.
    - >
      For package maintainers, it is also interesting because it bridges Rust binaries,
      Python ABI compatibility, the Beancount Python package, prebuilt cross-platform
      release artifacts, Homebrew, Nix, Alpine, and Cargo.
  project-history:
    - >
      The public repository was created on 2020-05-19. Its README frames the project as
      an LSP for Beancount and documents a Rust/Cargo distribution model with optional
      Python/Beancount integration for validation.
    - >
      The 2026 release feed shows active 1.x development, including 1.5.0 through 1.9.2
      releases in January and February 2026. The README documents a default PyO3
      embedded checker, fallbacks to system Python and bean-check, and performance
      comparisons intended to make diagnostics fast enough for editor feedback.
  related-projects:
    - Beancount is the ledger language and Python package validated by the server.
    - Language Server Protocol is the editor protocol implemented by the package.
    - >
      bean-check and bean-format are Beancount tools mirrored in the language server's
      diagnostics and formatting behavior.
  sources:
    - https://api.github.com/repos/polarmutex/beancount-language-server
    - https://api.github.com/repos/polarmutex/beancount-language-server/releases
    - https://raw.githubusercontent.com/polarmutex/beancount-language-server/main/README.md
  summary:
    - >
      beancount-language-server is a Language Server Protocol implementation for
      Beancount plain-text accounting files. It brings editor features such as
      completions, diagnostics, formatting, rename, references, semantic highlighting,
      and inlay hints to a niche but technically demanding personal-finance workflow.
  timeline:
    - '2020-05-19: polarmutex/beancount-language-server repository is created.'
    - '2025-01-26: Release metadata includes version 1.3.7.'
    - '2025-07-21: Release metadata includes version 1.4.1.'
    - '2026-01-04: 1.5.0 is published.'
    - '2026-02-12: 1.9.2 is published.'
  usage:
    - >
      Users install the server and configure an editor LSP client to launch
      beancount-language-server. The server can validate files using embedded Python,
      system Python, or bean-check, and it supports optional workspace settings such as
      journal_file for multi-file ledgers and formatting widths aligned with bean-format
      behavior.
    - >
      The README emphasizes that all configuration is optional for simple cases: the
      server auto-detects the best checker method, uses project-local virtual
      environments when present, and can scope completions to a configured main journal
      for multi-ledger workspaces.
related-packages:
  - id: brew:beancount
    reason: >
      Install Beancount with the language server to provide the ledger language, Python
      modules, bean-check validation, and bean-format-compatible workflow it is designed
      to support.
    rel: adjacent_workflow
    sources:
      - https://github.com/polarmutex/beancount-language-server#requirements
      - https://github.com/beancount/beancount
category: developer-tools
package-manager:
  apk: beancount-language-server
  brew: beancount-language-server
  nix: beancount-language-server
