id: brew:cidr
display-name: cidr
homepage: https://github.com/bschaatsbergen/cidr
repo: https://github.com/bschaatsbergen/cidr
docs:
  - https://github.com/bschaatsbergen/cidr#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew installation, Debian and Ubuntu packages for newer
      releases, and prebuilt binaries for Linux, macOS, and Windows. The batch input
      also records MacPorts packaging.
  package-nerd-significance:
    - >
      cidr is package-nerd useful because it packages common subnet arithmetic into a
      simple cross-platform CLI, replacing shell snippets or ad hoc web calculators in
      scripts, package tests, and network automation.
  project-history:
    - >
      The GitHub repository was created in September 2022, and the first GitHub release
      followed that month. The README defines the tool around CIDR explanation, address
      containment, address counting, overlap checks, and division into smaller networks.
  related-projects:
    - >
      Related tools in this batch include cidr2range, cidrmerge, and IPinfo CLI's
      IP-range helper binaries.
  sources:
    - https://github.com/bschaatsbergen/cidr#readme
    - https://api.github.com/repos/bschaatsbergen/cidr
    - https://api.github.com/repos/bschaatsbergen/cidr/releases
  summary:
    - >
      cidr is a small Go command-line tool for inspecting, counting, checking, and
      subdividing IPv4 and IPv6 CIDR prefixes.
  timeline:
    - '2022: Public GitHub repository and v0.1.0 release.'
    - '2023: v1.x releases established the CLI line.'
    - '2024: v2.0.0 released.'
    - '2025: v2.3.0 released.'
  usage:
    - >
      Typical commands include explaining a CIDR range, testing whether an address
      belongs to a range, counting addresses, checking whether two prefixes overlap, and
      dividing a prefix into distinct networks. The README examples cover both IPv4 and
      IPv6.
related-packages:
  - id: brew:ipcalc
    reason: >
      Choose ipcalc for traditional human-readable subnet reports with binary address
      visualization; choose cidr for a subcommand-oriented IPv4/IPv6 interface covering
      containment, overlap, counting, and division.
    rel: alternative
    sources:
      - https://github.com/bschaatsbergen/cidr#readme
      - https://jodies.de/ipcalc
category: networking
package-manager:
  brew: cidr
  debian: cidr
  macports: cidr
package-manager-url: https://formulae.brew.sh/formula/cidr
license: MIT
tags:
  - cidr
  - cli
  - ip-addresses
  - networking
  - subnetting
description: CLI to perform various actions on CIDR ranges
executables:
  - cidr
provenance:
  formula: cidr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
