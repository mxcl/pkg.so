id: cask:audacity@3
display-name: Audacity 3
homepage: https://www.audacityteam.org/
repo: https://github.com/audacity/audacity
docs:
  - https://manual.audacityteam.org/
  - https://support.audacityteam.org/
config-file-location:
  linux:
    - ~/.config/audacity/audacity.cfg
    - ~/.audacity-data/audacity.cfg
  macos: ~/Library/Application Support/audacity/audacity.cfg
  windows: '%APPDATA%\audacity\audacity.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      Audacity developed from a university research tool into a general audio editor
      with contributions from a wider community.
    - >
      Its distribution spans Windows, macOS, and Linux. During the 3.x series, upstream
      added an official Linux AppImage, providing another installation route alongside
      system packaging.
  package-nerd-significance:
    - >
      Audacity combines a desktop application with audio libraries and plugin
      interfaces, making dependency and architecture compatibility relevant to
      packagers.
    - >
      The 3.x history includes a transition to 64-bit Windows builds and matching plugin
      and FFmpeg requirements. The versioned cask identifies this major release family
      separately.
  project-history:
    - >
      Dominic Mazzoni began Audacity in 1999 at Carnegie Mellon University while working
      with Roger Dannenberg. Their research required a way to visualize audio-analysis
      algorithms; the application subsequently grew into a general editor.
    - >
      Audacity 3.0.0 was released in March 2021. Later 3.x releases expanded editing
      workflows, including clip handles and playback looping.
  related-projects:
    - FFmpeg; Nyquist; audio effect plugins.
  sources:
    - https://manual.audacityteam.org/
    - https://manual.audacityteam.org/man/credits.html
    - >
      https://support.audacityteam.org/additional-resources/changelog/older-versions/audacity-3.0.0/audacity-3.0.3
    - https://www.audacityteam.org/changelog/
    - https://www.audacityteam.org/download/older-versions/
  summary:
    - >
      Audacity 3 is the third major release family of the free, open-source multitrack
      audio editor and recorder.
  timeline:
    - '1999: Development began at Carnegie Mellon University.'
    - '2021-03-17: Audacity 3.0.0 released.'
    - >
      2021-07-26: Audacity 3.0.3 introduced official Linux AppImage distribution and
      64-bit Windows builds.
    - '2021-10-28: Audacity 3.1 introduced clip handles and playback looping.'
  usage:
    - >
      Typical workflows include recording tracks, editing speech or music, applying
      effects, and exporting audio. Additional format support can require FFmpeg;
      plugins must match the application's architecture.
category: media
package-manager:
  brew-cask: audacity@3
package-manager-url: https://formulae.brew.sh/cask/audacity@3
tags:
  - audio
  - audio-editor
  - cross-platform
  - gui
  - multitrack
  - recording
description: Multi-track audio editor and recorder
applications:
  - Audacity.app
provenance:
  cask: audacity@3
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
