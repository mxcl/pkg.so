id: brew:dvdbackup
display-name: dvdbackup
homepage: https://dvdbackup.sourceforge.net/
repo: https://code.launchpad.net/~dvdbackup-dev/dvdbackup/trunk
docs:
  - https://dvdbackup.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dvdbackup was packaged broadly across Linux and Unix-like systems, including
      Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, and Nix. That adoption
      came from being a simple CLI for a common maintenance task: copying a DVD title,
      chapter, or full disc structure without launching a larger transcoder or media
      suite.
  package-nerd-significance:
    - >
      dvdbackup is significant as a small leaf package in the DVD toolchain: not an
      authoring suite, not a transcoder, and not a player, just a focused ripper. That
      makes it easy for package managers to keep around for archival, migration, and
      old-script compatibility.
  project-history:
    - >
      The official homepage says dvdbackup was originally written by Olaf Beck and later
      maintained by Benjamin Drung and Stephen Gran. It lists stable release 0.4.2 dated
      2012-06-24, with new progress reporting, translation updates, FreeBSD
      title-detection fixes, and fragmented-chapter copy fixes.
    - >
      The project used SourceForge for releases and Launchpad/Bazaar for development.
      The homepage links directly to the Launchpad trunk and instructs developers to
      branch `lp:dvdbackup`, placing it in the late-2000s/early-2010s era of
      Bazaar-hosted free-software projects.
  related-projects:
    - >
      dvdbackup sits near libdvdread, libdvdcss, dvd+rw-tools, dvdauthor, VLC, MPlayer,
      and FFmpeg in the older Unix DVD ecosystem.
  sources:
    - https://dvdbackup.sourceforge.net/
    - https://sourceforge.net/projects/dvdbackup/files/dvdbackup/
    - https://code.launchpad.net/~dvdbackup-dev/dvdbackup/trunk
    - https://launchpad.net/dvdbackup
  summary:
    - >
      dvdbackup is a small command-line DVD ripping tool focused on copying video DVDs.
      Its upstream homepage presents the package in very Unix terms: small, fast, easy
      to use, and maintained around libdvdread/libdvdcss-era DVD access rather than a
      full media-center interface.
  timeline:
    - '2009-03-02: SourceForge file listing shows dvdbackup 0.4 release.'
    - '2009-06-08: SourceForge file listing shows dvdbackup 0.4.1 release.'
    - '2012-06-24: Official homepage lists stable release 0.4.2.'
    - '2012-06-24: SourceForge file listing shows dvdbackup-0.4.2.tar.xz.'
  usage:
    - >
      Users typically run `dvdbackup` from a terminal to copy a full DVD, selected
      titles, or chapters. The tool relies on libdvdread and, where legally and locally
      appropriate, libdvdcss for encrypted discs; the output is commonly fed into other
      DVD or video processing tools.
related-packages:
  - id: brew:dvdauthor
    reason: >
      Use dvdauthor after a feature-only or titleset-only dvdbackup extraction when new
      DVD-Video IFO and navigation structures must be constructed.
    rel: adjacent_workflow
    sources:
      - https://dvdbackup.sourceforge.net/usage.html
      - https://dvdauthor.sourceforge.net/
category: media
package-manager:
  apk: dvdbackup
  brew: dvdbackup
  debian: dvdbackup
  dnf: dvdbackup
  macports: dvdbackup
  nix: dvdbackup
  pacman: dvdbackup
  ubuntu: dvdbackup
package-manager-url: https://formulae.brew.sh/formula/dvdbackup
license: GPL-3.0-or-later
