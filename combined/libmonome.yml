id: brew:libmonome
display-name: libmonome
homepage: https://monome.org/
repo: https://github.com/monome/libmonome
docs:
  - https://monome.org/docs/grid/libraries
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libmonome's adoption is intentionally small and hardware-centered. It is packaged
      by Homebrew for users building monome-related tools on macOS or Linux, and
      monome's documentation points users toward libraries for different creative-coding
      environments rather than a single application stack.
    - >
      The project is important inside the monome community because grid and arc hardware
      are used by musicians, live coders, Max/MSP users, SuperCollider users, norns
      users, and experimental instrument builders who often bridge hardware events into
      their own software.
  package-nerd-significance:
    - >
      libmonome is a wonderfully specific package: a small C library for a family of
      boutique grid controllers. It shows how package managers carry not just servers
      and compilers but the driver glue for creative hardware communities.
    - >
      For maintainers, it is a reminder that niche hardware packages need stable build
      recipes because musicians and artists often depend on old tools continuing to
      compile years after the hardware first shipped.
  project-history:
    - >
      The libmonome README says the library was written by William Light and developed
      to make monome devices easy to use from languages such as C and Python. It
      supports 40h and series devices through a unified API and can communicate with a
      physical device or with a running monomeserial instance through OSC.
    - >
      The broader monome software stack moved toward serialosc, a daemon that converts
      USB serial communication into OSC and lets applications discover and connect to
      grid and arc devices. libmonome remains part of that low-level stack for programs
      that need direct or native-library interaction.
  related-projects:
    - serialosc is the companion daemon that routes monome hardware communication over OSC.
    - monome grid and arc are the hardware families libmonome targets.
    - >
      monomeSC, Max objects, norns, and grid studies are higher-level creative-coding
      layers in the monome ecosystem.
  sources:
    - https://formulae.brew.sh/formula/libmonome
    - https://github.com/monome/libmonome
    - https://github.com/monome/libmonome/releases
    - https://github.com/monome/serialosc
    - https://monome.org/docs/grid/libraries
    - https://monome.org/docs/serialosc/
  summary:
    - >
      libmonome is the C library for interacting with monome grid controllers. It sits
      between monome's minimalist music hardware and applications written in C, Python,
      or other languages that can wrap a C API.
  timeline:
    - '2010s: libmonome is developed as C-library glue for monome 40h and series devices.'
    - >
      2010s: serialosc becomes the documented background service that converts monome
      USB serial communication into OSC for grid and arc applications.
    - '2024: libmonome 1.4.9 adds arc intensity support.'
    - '2026: libmonome 1.4.10 is released with a soname version fix.'
  usage:
    - >
      Applications use libmonome to open monome devices, receive key events, and send
      LED updates through a C API. The related monomeserial and serialosc tools bridge
      device serial communication into OSC so creative applications can interact over
      local UDP ports.
    - >
      Package users usually encounter libmonome as a prerequisite for monome utilities
      or language bindings, not as a standalone user-facing application.
related-packages:
  - id: brew:serialosc
    reason: >
      Use serialosc with libmonome-backed hardware when applications need automatic
      device discovery and language-neutral OSC endpoints instead of direct C device
      access.
    rel: adjacent_workflow
    sources:
      - https://monome.org/docs/grid/grid-computer/
      - https://monome.org/docs/serialosc/
      - https://github.com/monome/serialosc
category: media
