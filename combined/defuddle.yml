id: brew:defuddle
display-name: Defuddle
homepage: https://defuddle.md
repo: https://github.com/kepano/defuddle
docs:
  - https://github.com/kepano/defuddle#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Defuddle is distributed through npm for JavaScript and Node.js users, includes a
      global CLI, and is packaged by Homebrew. Its official site also exposes the core
      value proposition directly: getting the main content of a page as Markdown.
  package-nerd-significance:
    - >
      Defuddle is package-nerd-relevant because it packages article extraction as both a
      JavaScript library and a terminal command. It lives in the lineage of readability
      tools, but with modern Markdown, metadata, and Obsidian-oriented workflows baked
      into the distribution.
  project-history:
    - >
      The official README says Defuddle was created for the Obsidian Web Clipper browser
      extension but designed to run in any environment. It positions the project as a
      replacement-style alternative to Mozilla Readability, with different tradeoffs
      around preserving uncertain content, metadata extraction, math, code blocks, and
      page standardization.
    - >
      The release stream shows a young, active project: a 0.1.1 release in March 2025
      and frequent 0.x releases through 0.19.1 in June 2026.
  related-projects:
    - >
      The README names Obsidian Web Clipper as the original motivating application and
      Mozilla Readability as the closest conceptual comparison.
  sources:
    - https://defuddle.md
    - https://github.com/kepano/defuddle
    - https://github.com/kepano/defuddle/releases/tag/0.1.1
    - https://github.com/kepano/defuddle/releases/tag/0.12.0
    - https://github.com/kepano/defuddle/releases/tag/0.19.1
    - https://formulae.brew.sh/formula/defuddle
  summary:
    - >
      Defuddle is a web-page content extraction library and CLI for turning cluttered
      pages into readable HTML, Markdown, JSON, and metadata.
  timeline:
    - '2025: 0.1.1 is published.'
    - '2026: 0.12.0 is published in March.'
    - '2026: 0.19.1 is published in June.'
  usage:
    - >
      Developers use Defuddle in browser code, Node.js code with a DOM implementation
      such as linkedom or JSDOM, or through the CLI. The README documents parsing local
      files, URLs, and stdin, with options for Markdown, JSON, frontmatter, property
      extraction, custom user agents, and debug output.
related-packages:
  - id: brew:pandoc
    reason: >
      Defuddle can extract a page as clean Markdown, after which Pandoc can convert that
      Markdown into document and publishing formats such as HTML, PDF, EPUB, or DOCX.
    rel: adjacent_workflow
    sources:
      - https://defuddle.md/docs
      - https://pandoc.org/MANUAL.html
  - id: brew:jq
    reason: >
      Defuddle's JSON output includes extracted content and article metadata, which jq
      can select, reshape, and feed into shell-based publishing or archival pipelines.
    rel: adjacent_workflow
    sources:
      - https://defuddle.md/docs
      - https://jqlang.github.io/jq/manual/
category: developer-tools
package-manager:
  brew: defuddle
  nix: defuddle
package-manager-url: https://formulae.brew.sh/formula/defuddle
license: MIT
tags:
