id: brew:carthage
display-name: Carthage
homepage: https://github.com/Carthage/Carthage
repo: https://github.com/Carthage/Carthage
docs:
  - https://github.com/Carthage/Carthage/tree/master/Documentation
  - https://github.com/Carthage/Carthage#readme
config-file-location:
  unix:
    - ./Cartfile
    - ./Cartfile.private
    - ./Cartfile.resolved
credentials-file-location:
  unix: ~/.netrc
history:
  adoption-history:
    - >
      Carthage became a major alternative to CocoaPods for iOS and macOS projects that
      preferred explicit framework integration. Its documentation emphasizes manual
      Xcode integration, shared schemes, tagged releases, binary framework archives, and
      reproducible bootstrap through committed Cartfile.resolved files.
  package-nerd-significance:
    - >
      Carthage is one of the canonical package-manager stories in Apple development: it
      rejects project mutation as a feature, relies on Git tags and semantic versions,
      and treats dependency builds as visible artifacts. For package-manager catalogs,
      it is a historically important Cocoa tool because it captures a distinct design
      point from CocoaPods and Swift Package Manager.
  project-history:
    - >
      The public repository was created in 2014, during the period when Swift and modern
      Cocoa dependency management were taking shape. Carthage's official pitch was
      simplicity and decentralization: dependencies are declared in a Cartfile, resolved
      to exact versions in Cartfile.resolved, and built or downloaded without
      automatically editing the Xcode project.
  related-projects:
    - Official documentation compares Carthage's approach with CocoaPods.
    - Carthage operates in the Cocoa, Xcode, Swift, iOS, macOS, tvOS, and watchOS ecosystem.
    - >
      Its artifacts and binary-project-specification docs connect it to GitHub releases
      and HTTPS-hosted framework archives.
  sources:
    - https://api.github.com/repos/Carthage/Carthage
    - https://github.com/Carthage/Carthage
    - https://github.com/Carthage/Carthage/tree/master/Documentation
    - https://github.com/Carthage/Carthage#readme
    - https://formulae.brew.sh/api/formula/carthage.json
  summary:
    - >
      Carthage is a decentralized dependency manager for Cocoa. Its README says it
      builds dependencies and provides binary frameworks while leaving project structure
      and build settings under the developer's control.
  timeline:
    - '2014: Public GitHub repository created.'
    - >
      2021: README says version 0.37.0 encouraged XCFrameworks and required them for
      Apple Silicon Macs.
    - >
      2020s: Documentation describes Cartfile, Cartfile.private, Cartfile.resolved,
      Carthage/Build, Carthage/Checkouts, and the shared cache under
      ~/Library/Caches/org.carthage.CarthageKit.
  usage:
    - >
      A typical project creates a Cartfile next to its .xcodeproj or .xcworkspace, runs
      carthage update, then adds built frameworks or XCFrameworks from Carthage/Build
      into Xcode. Carthage can also checkout dependencies into Carthage/Checkouts, use
      Git submodules, cache builds, and authenticate binary framework downloads through
      ~/.netrc when --use-netrc is set.
related-packages:
  - id: brew:cocoapods
    reason: >
      CocoaPods is the official comparison point for the same Cocoa
      dependency-management task: choose it for centralized discovery and automatic
      Xcode workspace integration, while Carthage favors decentralized packages and
      manual integration.
    rel: alternative
    sources:
      - https://github.com/Carthage/Carthage#differences-between-carthage-and-cocoapods
      - https://cocoapods.org/
category: developer-tools
package-manager:
  brew: carthage
  macports: carthage
package-manager-url: https://formulae.brew.sh/formula/carthage
license: MIT
tags:
  - cli
  - cocoa
  - dependency-manager
  - ios
  - macos
  - swift
description: Decentralized dependency manager for Cocoa
executables:
  - carthage
provenance:
  formula: carthage
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
