id: brew:gibo
display-name: gibo
homepage: https://github.com/simonwhitaker/gibo
repo: https://github.com/simonwhitaker/gibo
docs:
  - https://github.com/simonwhitaker/gibo#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gibo's adoption follows the popularity of GitHub's template collection. GitHub
      uses that collection to populate `.gitignore` choices in its web interface, and
      gibo made the same shared corpus available from terminals and scripts.
    - >
      Package-manager support gave gibo a place in developer bootstrap scripts, dotfile
      setups, and language-specific project starters. It is useful precisely because
      `.gitignore` files are mundane and repetitive, so teams prefer a shared maintained
      template over hand-written ignores.
  package-nerd-significance:
    - >
      gibo is package-nerd friendly because it is tiny, reproducible, and delegates
      content authority to GitHub's template repository. The package is mostly a
      convenient delivery mechanism for the command and its update path, not a
      complicated runtime.
  project-history:
    - >
      Simon Whitaker created the public gibo repository in May 2012. The README explains
      the name as short for `.gitignore boilerplates` and credits the tool to Whitaker,
      with GitHub's `github/gitignore` repository as the template source.
    - >
      The project later shipped tagged releases and install paths through Homebrew,
      Scoop, Chocolatey, Docker, binary releases, and the Go toolchain. The version 3
      release line reflects an actively packaged Go CLI rather than a one-off script.
  related-projects:
    - >
      gibo is closely related to GitHub's `github/gitignore` template repository, Git's
      `gitignore(5)` behavior, and project bootstrap tools that generate repository
      boilerplate.
  sources:
    - https://api.github.com/repos/simonwhitaker/gibo
    - https://github.com/github/gitignore
    - https://github.com/simonwhitaker/gibo
    - https://github.com/simonwhitaker/gibo/releases
  summary:
    - >
      gibo is a command-line helper for fetching and dumping `.gitignore` boilerplates
      from GitHub's gitignore template collection. It turns a common repository setup
      chore into a small shell-friendly command.
  timeline:
    - '2012: Public GitHub repository created.'
    - '2024: Version 3.0.12 was published as a GitHub release.'
    - '2026: The 3.0 release line continued with packaged binary releases.'
  usage:
    - >
      Practitioners commonly run commands such as `gibo dump Swift Xcode >> .gitignore`
      to append templates for one or more languages, frameworks, editors, or platforms.
      The README also documents shell completion and using the same output to seed
      Mercurial `.hgignore` files that use glob syntax.
    - >
      The tool is most useful at repository creation time, during cleanup of an
      accidental noisy working tree, or in project generators that need a reasonable
      ignore file without vendoring template text.
related-packages:
  - id: brew:gitnr
    reason: >
      gitnr is a more feature-rich alternative that can combine GitHub, TopTal,
      local-file, arbitrary-repository, and URL templates with interactive search and
      duplicate-line filtering.
    rel: alternative
    sources:
      - https://github.com/simonwhitaker/gibo#readme
      - https://github.com/reemus-dev/gitnr#readme
category: developer-tools
package-manager:
  brew: gibo
  nix: gibo
  scoop: main/gibo
package-manager-url: https://formulae.brew.sh/formula/gibo
license: Unlicense
tags:
  - cli
  - github
  - gitignore
  - templates
description: Access GitHub's .gitignore boilerplates
executables:
  - gibo
provenance:
  formula: gibo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
