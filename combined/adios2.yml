id: brew:adios2
display-name: ADIOS2
homepage: https://adios2.readthedocs.io
repo: https://github.com/ornladios/ADIOS2
docs:
  - https://adios2.readthedocs.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official documentation says ADIOS2 is used in supercomputer applications that
      write and read up to several petabytes in a single simulation run. It also
      documents use on DOE machines such as NERSC Perlmutter, OLCF Frontier, and ALCF
      Aurora.
    - >
      The package ecosystem reflects that HPC role: the supplied metadata shows
      Homebrew, Debian/Ubuntu data packages, Nix, Arch/pacman, and openSUSE zypper
      packaging. The docs also describe package installation through Conda, PyPI, Spack,
      and Docker, and state a commitment to releasing a new version every six months.
  package-nerd-significance:
    - >
      ADIOS2 is interesting to package nerds because it sits at the junction of HPC ABI
      management, optional transport/compression dependencies, Python wheels, MPI
      variants, and CLI utilities. A formula or distro package is not just installing
      one binary; it is selecting a matrix of engines, bindings, and data formats that
      scientific applications depend on.
    - >
      It is also a good example of modern scientific infrastructure becoming ordinary
      package-manager material: the same project appears in source builds, Spack
      environments, Python packaging, Conda, system packages, and Homebrew.
  project-history:
    - >
      The ADIOS2 documentation describes it as the latest implementation of ADIOS and
      explicitly positions it as a new architecture that continues the performance
      legacy of ADIOS1. The GitHub repository was created in December 2016 under the
      ornladios organization, and the repository description calls it the next
      generation of ADIOS developed in the Exascale Computing Program.
    - >
      The project is a multi-institutional collaboration involving Oak Ridge National
      Laboratory, Kitware, Lawrence Berkeley National Laboratory, Georgia Institute of
      Technology, and Rutgers University. The docs emphasize modular C++17 architecture,
      sustainability through CI and unit testing, and language support for C++, C,
      Python, Fortran, and Matlab.
    - >
      ADIOS2's architecture abstracts data variables and attributes across files,
      wide-area networks, in-memory staging, and other transports. Its docs distinguish
      it from a file-only I/O library: file-system performance is a primary goal, but
      code coupling and in situ analysis through special engines are core design points.
  related-projects:
    - ADIOS1 is the predecessor explicitly referenced by the docs.
    - HDF5 integration is documented through VOL support.
    - Spack, Conda, PyPI, and Docker are documented installation channels.
  sources:
    - https://adios2.readthedocs.io/
    - https://adios2.readthedocs.io/en/latest/setting_up/setting_up.html
    - https://api.github.com/repos/ornladios/ADIOS2
    - https://api.github.com/repos/ornladios/ADIOS2/tags?per_page=20
    - source_facts.package-manager
  summary:
    - >
      ADIOS2 is the second-generation Adaptable Input Output System: a high-performance
      scientific data I/O framework funded by the U.S. Department of Energy Exascale
      Computing Project. It is designed for parallel, streaming-oriented,
      self-describing data movement at supercomputer scale.
  timeline:
    - '2016-12: GitHub repository created.'
    - >
      2020s: ADIOS2 documentation describes ECP funding, ADIOS1 succession, and
      multi-institutional development.
    - >
      Current docs: ADIOS2 states a six-month release cadence and documents v2.12-era
      features.
  usage:
    - >
      Developers use ADIOS2 as a library from C++, C, Fortran, Python, and Matlab,
      commonly through MPI-capable applications. The docs describe variables,
      attributes, engines, operators, high-level and full APIs, Python APIs, and
      command-line ecosystem utilities such as bpls and data reorganization tools.
    - >
      Package builds are CMake-centered and feature-sensitive. The setup docs show
      toggles for MPI, Fortran, Python, SST, DataMan, compression operators, profiling,
      and other backends, which explains why distro packages often split runtime,
      development, bindings, and data utilities.
related-packages:
  - id: brew:hdf5
    reason: >
      Install HDF5 when an ADIOS2 workflow needs HDF5 files or APIs; ADIOS2 officially
      provides an HDF5 engine and a VOL connector for interoperating with HDF5 clients.
    rel: adjacent_workflow
    sources:
      - https://adios2.readthedocs.io/en/latest/engines/engines.html
      - https://adios2.readthedocs.io/en/latest/ecosystem/h5vol.html
      - https://docs.hdfgroup.org/documentation/hdf5/latest/
