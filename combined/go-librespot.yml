id: brew:go-librespot
display-name: go-librespot
homepage: https://github.com/devgianlu/go-librespot
repo: https://github.com/devgianlu/go-librespot
docs:
  - https://github.com/devgianlu/go-librespot#readme
config-file-location:
  linux: ~/.config/go-librespot/config.yml
  macos: ~/Library/Application Support/go-librespot/config.yml
  windows: '%APPDATA%\go-librespot\config.yml'
credentials-file-location:
  linux: ~/.config/go-librespot/state.json
  macos: ~/Library/Application Support/go-librespot/state.json
  windows: '%APPDATA%\go-librespot\state.json'
history:
  adoption-history:
    - >
      The project sits in the broader librespot ecosystem of open-source Spotify
      clients. The Rust librespot project describes that space as an alternative to
      Spotify's deprecated closed-source libspotify, while go-librespot packages the
      idea as a Go daemon with mDNS registration and audio backend configuration.
  package-nerd-significance:
    - >
      For package users, go-librespot is notable because Spotify Connect compatibility
      usually depends on background service behavior, audio libraries, mDNS, and state
      storage; Homebrew and container packaging reduce that setup to a reproducible
      install.
  project-history:
    - >
      The public repository was created in 2023. Its README presents the project as an
      open-source Spotify Connect compatible client written in Go, with release
      binaries, Docker images, Homebrew packaging, and source builds around a daemon
      entry point.
  related-projects:
    - >
      librespot-org/librespot is the Rust open-source Spotify client library that frames
      the wider librespot lineage and Spotify Connect receiver use case.
  sources:
    - https://api.github.com/repos/devgianlu/go-librespot
    - https://formulae.brew.sh/formula/go-librespot
    - https://github.com/devgianlu/go-librespot
    - https://github.com/devgianlu/go-librespot/releases
    - https://github.com/librespot-org/librespot
  summary:
    - >
      go-librespot is a Go Spotify Connect compatible client for running a local
      playback receiver.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2024: v0.x releases established the Go client as a packaged daemon.'
    - '2026: v0.7.x release series published.'
  usage:
    - >
      Practitioners use go-librespot to make a machine appear as a Spotify Connect
      device on a local network. The README documents Zeroconf mode, mDNS backend
      selection, audio-related build dependencies, container use, and a configuration
      directory holding config.yml, state.json, and a lockfile.
related-packages:
  - id: brew:librespot
    reason: >
      librespot provides the same headless Spotify Connect receiver task through the
      established Rust implementation and a broader library ecosystem, while
      go-librespot is written in Go and uses YAML configuration.
    rel: alternative
    sources:
      - https://github.com/devgianlu/go-librespot
      - https://github.com/librespot-org/librespot
category: media
package-manager:
  brew: go-librespot
  nix: go-librespot
package-manager-url: https://formulae.brew.sh/formula/go-librespot
license: GPL-3.0-only
tags:
  - audio
  - cli
  - client
  - go
  - spotify
  - spotify-connect
  - streaming
description: Spotify client
executables:
  - go-librespot
provenance:
  formula: go-librespot
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
