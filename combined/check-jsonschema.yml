id: brew:check-jsonschema
display-name: check-jsonschema
homepage: https://github.com/python-jsonschema/check-jsonschema
repo: https://github.com/python-jsonschema/check-jsonschema
docs:
  - https://check-jsonschema.readthedocs.io/en/latest
  - https://github.com/python-jsonschema/check-jsonschema#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README and documentation show two adoption paths: direct CLI installation with
      pipx or Homebrew, and use as a pre-commit hook. The batch input records additional
      packaging in Alpine, Nix, and Arch Linux.
  package-nerd-significance:
    - >
      Package nerds care because check-jsonschema packages SchemaStore-style validation
      and pre-commit integration into one small command, making repository metadata, CI
      files, and dependency-bot configs checkable from editors, hooks, and CI.
  project-history:
    - >
      The repository and first PyPI release both date to January 2021. The project is
      part of the python-jsonschema GitHub organization and is documented as a CLI and
      hook built on the jsonschema library, with local and remote schema support.
  related-projects:
    - python-jsonschema/jsonschema is the underlying validation library.
    - pre-commit is a primary integration surface.
    - SchemaStore and vendor CI/config schemas are used through built-in schema choices.
  sources:
    - https://github.com/python-jsonschema/check-jsonschema
    - https://check-jsonschema.readthedocs.io/en/stable/
    - https://check-jsonschema.readthedocs.io/en/stable/usage.html
    - https://pypi.org/pypi/check-jsonschema/json
  summary:
    - >
      check-jsonschema is a Python CLI and pre-commit hook for validating JSON, YAML,
      and related configuration files against JSON Schema.
  timeline:
    - '2021: GitHub repository created.'
    - '2021: 0.1.0 uploaded to PyPI.'
    - '2023: 0.23.x releases published on GitHub.'
    - '2026: Documentation version 0.37.4 published on Read the Docs.'
  usage:
    - >
      A common command is `check-jsonschema --schemafile schema.json instance.json`. The
      tool can also use built-in schemas for GitHub Actions, Azure Pipelines, Renovate,
      GitLab CI, Read the Docs, Dependabot, and other configuration formats.
related-packages:
  - id: brew:pre-commit
    reason: >
      pre-commit is check-jsonschema’s officially documented hook runner, allowing
      schema validation to run automatically against selected files before commits.
    rel: adjacent_workflow
    sources:
      - https://check-jsonschema.readthedocs.io/en/latest/precommit_usage.html
      - https://pre-commit.com/
category: developer-tools
package-manager:
  apk: check-jsonschema
  brew: check-jsonschema
  nix: check-jsonschema
  pacman: check-jsonschema
package-manager-url: https://formulae.brew.sh/formula/check-jsonschema
license: Apache-2.0
tags:
  - cli
  - json-schema
  - pre-commit
  - python
  - validation
description: JSON Schema CLI
executables:
  - check-jsonschema
provenance:
  formula: check-jsonschema
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
