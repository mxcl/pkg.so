id: brew:ldapvi
display-name: ldapvi
homepage: http://www.lichteblau.com/ldapvi/
repo: https://github.com/ldapvi/ldapvi
docs:
  - http://www.lichteblau.com/ldapvi
config-file-location:
  unix:
    - ~/.ldaprc
    - /etc/ldap/ldap.conf
    - ~/.ldapvirc
credentials-file-location: null
history:
  adoption-history:
    - >
      ldapvi became a niche but durable administrator tool because it matched an
      existing Unix idiom: dump structured system state into an editor, validate the
      edited result, then commit changes interactively.
    - >
      Its package-manager presence across Homebrew, Debian, Ubuntu, Fedora-family
      systems, Alpine, MacPorts, Nix, and other Unix-like distributions reflects
      long-tail sysadmin adoption rather than mass developer-tool popularity.
  package-nerd-significance:
    - >
      ldapvi matters to package nerds because it is the rare LDAP administration package
      built around vi-era Unix ergonomics rather than a GUI, web console, or one-shot
      ldapmodify pipeline.
    - >
      Its release history is also a tidy example of a small C utility surviving
      dependency churn: OpenLDAP, SASL, TLS libraries, readline, curses, and distro
      packaging all show up in the NEWS file.
  project-history:
    - >
      ldapvi was written by David Lichteblau and released as a small C/autoconf Unix
      utility. The project's official site describes it as an interactive LDAP client
      for updating LDAP entries with an editor and links both the manual and the GitHub
      repository.
    - >
      The NEWS file records 1.0 as the initial release on 2004-01-01. During the
      2004-2007 release series, ldapvi gained .ldaprc setup support, naming-context
      discovery, TLS options, SASL support, LDIF compatibility modes, UTF-8 support, and
      its own ldapvi configuration file syntax.
    - >
      A 1.8 release was published on 2026-02-14, collecting modern build fixes and
      long-running packaging patches while preserving the old editor-centered workflow.
  related-projects:
    - >
      ldapvi sits alongside OpenLDAP command-line tools such as ldapsearch, ldapmodify,
      ldapdelete, and ldapmoddn; version 1.6 explicitly added compatibility-style
      command-line modes for several of those tools.
  sources:
    - http://www.lichteblau.com/ldapvi/
    - http://www.lichteblau.com/ldapvi/ldapvi-news.txt
    - http://www.lichteblau.com/ldapvi/manual/
    - https://formulae.brew.sh/formula/ldapvi
    - https://github.com/ldapvi/ldapvi
  summary:
    - >
      ldapvi is an interactive Unix terminal LDAP client that lets administrators edit
      LDAP directory entries with a text editor, explicitly framed by its author as
      vipw(1) for LDAP.
  timeline:
    - '2004-01-01: ldapvi 1.0 initial release.'
    - '2005-11-13: ldapvi 1.3 adds --config, --discover, and --class workflows.'
    - >
      2006-11-04: ldapvi 1.6 adds SASL support, LDIF support, UTF-8 support, and
      ~/.ldapvirc or /etc/ldapvi.conf.
    - '2007-05-05: ldapvi 1.7 fixes a buffer overrun in home_filename().'
    - '2026-02-14: ldapvi 1.8 ships accumulated build, packaging, and compatibility fixes.'
  usage:
    - >
      Typical use is to bind to an LDAP server, fetch entries into an editor buffer,
      make changes in ldapvi syntax or LDIF-like forms, review the detected
      add/rename/modify/delete operations, and then confirm or re-edit.
    - >
      The manual documents conventional OpenLDAP configuration files such as ~/.ldaprc
      and /etc/ldap/ldap.conf, plus ldapvi's own ~/.ldapvirc or /etc/ldapvi.conf format
      for profiles and command options.
related-packages:
  - id: brew:openldap
    reason: >
      Use OpenLDAP alongside ldapvi for the underlying LDAP client libraries,
      conventional client configuration, and complementary ldapsearch/ldapmodify-style
      command-line workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/ldapvi/ldapvi#readme
      - https://www.openldap.org/software/
category: developer-tools
package-manager:
  apk: ldapvi
  brew: ldapvi
  debian: ldapvi
  dnf: ldapvi
  macports: ldapvi
  nix: ldapvi
  ubuntu: ldapvi
package-manager-url: https://formulae.brew.sh/formula/ldapvi
license: GPL-2.0-or-later
tags:
  - administration
  - cli
  - ldap
  - ldif
  - text-editor
description: Update LDAP entries with a text editor
executables:
  - ldapvi
provenance:
  formula: ldapvi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
