id: brew:mcat
display-name: mcat
homepage: https://github.com/Skardyy/mcat
repo: https://github.com/Skardyy/mcat
docs:
  - https://github.com/Skardyy/mcat#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package-manager facts supplied for this run list mcat in Homebrew, Nix, Scoop,
      and WinGet. That breadth suggests adoption beyond a single ecosystem even though
      the project is still young.
    - >
      GitHub repository metadata from July 2026 showed active recent maintenance and
      more than a thousand stars, indicating visible interest among terminal-tool users.
  package-nerd-significance:
    - >
      For package-history purposes, mcat is notable as part of the current wave of Rust
      CLIs that make terminals media-capable without asking users to leave the shell.
      Its value to package managers is straightforward: one small binary, cross-platform
      install paths, and obvious demo value.
  project-history:
    - >
      The official GitHub repository was created in April 2025 and published early
      tagged releases the same month, with v0.1.3 appearing on GitHub releases on
      2025-04-23. The project continued to ship frequent 0.x releases through 2026,
      including v0.6.2 in June 2026.
    - >
      The README documents installation through Cargo, prebuilt GitHub releases,
      Homebrew, Nix, Scoop, and WinGet, which is typical for a modern Rust CLI that
      wants to be easy to try across macOS, Linux, and Windows.
  related-projects:
    - >
      Related terminal media viewers include chafa, viu, catimg, and terminal Markdown
      preview tools; mcat's official README positions it as a combined image, video,
      directory, and Markdown viewer rather than a single-format utility.
  sources:
    - https://github.com/Skardyy/mcat
    - https://github.com/Skardyy/mcat#readme
    - https://github.com/Skardyy/mcat/releases
    - source_facts.package-manager
  summary:
    - >
      mcat is a Rust command-line viewer for rendering images, videos, directories, and
      Markdown in a terminal workflow. It sits in the same practical niche as tools such
      as catimg, viu, chafa, and terminal Markdown previewers, but its README presents
      it as one small command for multiple rich media types.
  timeline:
    - '2025-04: GitHub repository created.'
    - '2025-04: v0.1.3 published on GitHub releases.'
    - '2026-06: v0.6.2 published on GitHub releases.'
  usage:
    - >
      mcat is used as a terminal-first preview command for images, video, Markdown, and
      directories. The README documents examples and optional fetching of Chromium and
      FFmpeg support when needed for richer rendering paths.
related-packages:
  - id: brew:timg
    reason: >
      Choose timg when the main task is viewing images, animated GIFs, or video with
      Sixel, Kitty, iTerm2, or Unicode rendering; mcat is broader and also handles
      documents and conversions.
    rel: alternative
    sources:
      - https://github.com/Skardyy/mcat#readme
      - https://github.com/hzeller/timg#readme
  - id: brew:chafa
    reason: >
      Choose Chafa for highly configurable image and animation rendering, character-art
      output, or an embeddable C API; mcat additionally handles video and document
      formats.
    rel: alternative
    sources:
      - https://github.com/Skardyy/mcat#readme
      - https://hpjansson.org/chafa/
  - id: brew:glow
    reason: >
      Choose Glow for a focused terminal Markdown reader and repository-documentation
      browser; mcat is preferable when the same workflow must also render PDFs, Office
      files, images, or video.
    rel: alternative
    sources:
      - https://github.com/Skardyy/mcat#readme
      - https://github.com/charmbracelet/glow#readme
category: media
package-manager:
  brew: mcat
  nix: mcat
  scoop: main/mcat
  winget: skardyy.mcat
