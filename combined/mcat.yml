license: MIT
tags:
  - cli
  - documents
  - image-viewer
  - markdown
  - terminal
  - video-viewer
description: Terminal image, video, directory, and Markdown viewer
executables:
  - mcat
provenance:
  formula: mcat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
