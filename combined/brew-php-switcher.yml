id: brew:brew-php-switcher
display-name: Brew PHP Switcher
homepage: https://github.com/philcook/brew-php-switcher
repo: https://github.com/philcook/brew-php-switcher
docs:
  - https://github.com/philcook/brew-php-switcher#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package gained a durable niche among macOS PHP developers because it automated
      edits that were otherwise easy to get wrong: Apache module lines, CLI symlinks,
      and optional Valet configuration. GitHub metadata shows over a thousand stars, and
      Homebrew analytics reported thousands of installs over the prior year at lookup
      time.
  package-nerd-significance:
    - >
      The package is a classic Homebrew-era local development helper: small shell code
      wrapped as a formula, solving the impedance mismatch between language runtime
      versions and macOS web-server configuration. It is historically tied to the long
      tail of PHP projects that require multiple runtime versions on one laptop.
  project-history:
    - >
      The project was created in March 2014 and published v1.0 in April 2014. Its README
      frames the tool as a one-command answer for developers supporting multiple PHP
      projects that require different PHP major versions.
    - >
      The script tracks Homebrew PHP layout changes over time. The README documents
      support for older PHP 5.6 and 7.x versions through modern 8.x versions, and recent
      commits mention Apple Silicon Homebrew Apache path handling.
  related-projects:
    - Homebrew PHP formulae are the runtime packages switched by the tool.
    - Apache configuration is one of the script's central targets.
    - >
      Valet configuration is supported through skip and target options documented in the
      README.
  sources:
    - https://formulae.brew.sh/api/formula/brew-php-switcher.json
    - https://github.com/philcook/brew-php-switcher
    - https://raw.githubusercontent.com/philcook/brew-php-switcher/master/README.md
  summary:
    - >
      Brew PHP Switcher is a macOS shell utility for switching Homebrew-installed PHP
      versions across command-line, Apache, and Valet-oriented development setups.
  timeline:
    - '2014: Repository created and v1.0 released.'
    - '2019: v2.2 released during the PHP 7.x Homebrew era.'
    - '2021: v2.4 released with continued PHP version updates.'
    - '2024: v2.6 released.'
    - '2026: Homebrew stable version reported as 2.6.'
  usage:
    - >
      Users install it with Homebrew and run commands such as `brew-php-switcher 8.3` or
      `brew-php-switcher 5.6`. Options allow skipping Apache or Valet changes, or
      targeting only a specific config area.
related-packages:
  - id: brew:php
    reason: >
      Brew PHP Switcher operates on Homebrew-installed PHP runtimes, so install the
      relevant PHP formulae before using it to change the active CLI or Apache
      configuration.
    rel: adjacent_workflow
    sources:
      - https://github.com/philcook/brew-php-switcher#readme
      - https://www.php.net/manual/en/install.macosx.packages.php
category: developer-tools
package-manager:
  brew: brew-php-switcher
package-manager-url: https://formulae.brew.sh/formula/brew-php-switcher
license: MIT
tags:
  - apache
  - cli
  - homebrew
  - macos
  - php
  - valet
  - version-switching
description: Switch Apache / Valet / CLI configs between PHP versions
executables:
  - brew-php-switcher
  - phpswitch.sh
provenance:
  formula: brew-php-switcher
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
