id: brew:eralchemy
display-name: ERAlchemy
homepage: https://github.com/eralchemy/eralchemy
repo: https://github.com/eralchemy/eralchemy
docs:
  - https://github.com/eralchemy/eralchemy#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ERAlchemy's adoption is mostly in the Python database-tooling niche: the README
      emphasizes pip, conda-forge, SQLAlchemy URLs, Graphviz output, and command-line
      generation. Homebrew and Fedora packaging make it convenient outside Python-only
      workflows, but the project remains a focused documentation and
      schema-visualization utility rather than a broad platform.
  package-nerd-significance:
    - >
      Package nerds care about ERAlchemy because it bridges Python packaging, system
      Graphviz dependencies, database drivers, and CLI ergonomics. It is a small example
      of why Homebrew-style formulas matter for Python tools that need native
      graph-rendering support.
  project-history:
    - >
      The official repository was created in 2015 and published a 1.0.0 GitHub release
      later that year. Its README says the tool was inspired by BurntSushi's `erd`, but
      differs by rendering diagrams directly from databases rather than only from ER
      markup.
  related-projects:
    - >
      ERAlchemy is related to SQLAlchemy, Graphviz, PyGraphviz, Mermaid ER diagrams, and
      BurntSushi's `erd` markup-oriented diagram tool.
  sources:
    - https://github.com/eralchemy/eralchemy
    - https://github.com/eralchemy/eralchemy/releases
    - https://api.github.com/repos/eralchemy/eralchemy
  summary:
    - >
      ERAlchemy is a Python command-line and library tool for generating
      entity-relationship diagrams from live databases, SQLAlchemy models, or its own
      markdown-like ER representation.
  timeline:
    - '2015: The GitHub repository was created.'
    - '2015: Version 1.0.0 was published on GitHub releases.'
    - >
      2020s: The README documents Graphviz/PyGraphviz backends, conda-forge packaging,
      Mermaid ER output, and SQLAlchemy-based database URLs.
  usage:
    - >
      Common usage is `eralchemy -i DATABASE_URL -o diagram.pdf` or rendering from
      SQLAlchemy metadata in Python. The README also documents markdown input, Graphviz
      or PyGraphviz backends, Mermaid ER output, filtering tables or columns, and schema
      selection for PostgreSQL.
related-packages:
  - id: brew:graphviz
    reason: >
      Install Graphviz alongside ERAlchemy when you want its documented PDF and image
      rendering workflow rather than markup-only output.
    rel: adjacent_workflow
    sources:
      - https://github.com/eralchemy/eralchemy/blob/main/README.md
      - https://graphviz.org/documentation/
category: developer-tools
package-manager:
  brew: eralchemy
  dnf: eralchemy
package-manager-url: https://formulae.brew.sh/formula/eralchemy
license: Apache-2.0
tags:
  - cli
  - database
  - diagram-generation
  - er-diagrams
  - python
  - sqlalchemy
description: Simple entity relation (ER) diagrams generation
executables:
  - eralchemy
provenance:
  formula: eralchemy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
