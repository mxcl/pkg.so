config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project became known in the Standard ML community for aggressive whole-program
      optimization and standalone native executables. Its own repository describes
      support for SML97, a complete Standard ML Basis Library, the ML Basis system, a C
      foreign-function interface, source-level profiling, mllex, mlyacc, and mlnlffigen.
      The implementation emphasizes small executables and runtime performance through
      unboxed representations, native arrays, GMP-backed arbitrary precision arithmetic,
      multiple code generators, and multiple garbage-collection strategies.
  sources:
    - http://mlton.org/History
    - https://formulae.brew.sh/formula/mlton
    - https://github.com/MLton/mlton
    - https://icfpconference.org/archived/icfp2001/cristal.inria.fr/ICFP2001/Abstracts/48.html
  summary:
    - >
      MLton grew out of Standard ML compiler research in the late 1990s. The project
      history traces its start to April 1997, when Stephen Weeks wrote a defunctorizer
      for Standard ML and integrated it with SML/NJ. That origin explains the shape of
      the compiler: MLton is not an interactive SML environment, but a whole-program
      compiler that takes the complete program as input and uses that global view for
      optimization.
  usage:
    - >
      In package-manager terms, MLton occupies the serious native-code SML compiler
      niche alongside SML/NJ, Poly/ML, and MLKit rather than the lightweight scripting
      or teaching niche. It is used when SML code needs to be compiled into fast
      standalone programs, when whole-program analysis is useful, or when tools from the
      MLton distribution such as mllex, mlyacc, and mlprof are part of the workflow.
related-packages:
  - id: brew:mlkit
    reason: >
      Choose MLKit when region-inferred memory management, explicit-region research, or
      Standard ML-to-JavaScript tooling matters more than MLton's whole-program
      optimization.
    rel: alternative
    sources:
      - https://github.com/MLton/mlton
      - https://melsman.github.io/mlkit/
  - id: brew:smlnj
    reason: >
      Choose Standard ML of New Jersey when an interactive programming environment is
      important; MLton instead emphasizes optimized standalone executables and has no
      interactive top level.
    rel: alternative
    sources:
      - https://www.mlton.org/Drawbacks
      - https://www.smlnj.org/
  - id: brew:polyml
    reason: >
      Choose Poly/ML for interactive Standard ML development and runtime-centered
      workloads; choose MLton for aggressive whole-program native compilation.
    rel: alternative
    sources:
      - https://www.mlton.org/WholeProgramOptimization
      - https://www.polyml.org/
