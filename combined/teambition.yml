history:
  adoption-history:
    - >
      Teambition developed from a startup product into part of Alibaba Group and is now
      deeply integrated with DingTalk. Its official site presents it as an enterprise
      collaboration platform for manufacturing, technology, retail, product, research
      and development, marketing, office, and PMO teams.
  package-nerd-significance:
    - >
      The cask represents a desktop client for a China-focused enterprise SaaS platform
      whose durable project state normally resides in the hosted service. It is useful
      to package managers primarily as a reproducible way to deploy the native client
      rather than as a self-contained local tool.
  project-history:
    - >
      Teambition was created by Shanghai Huiyi Information Technology as both the
      studio's brand and its collaboration application. The team describes its
      trajectory as moving from startup to Alibaba Group, where the product became
      integrated with DingTalk's collaboration ecosystem.
  related-projects:
    - >
      DingTalk provides the surrounding Alibaba enterprise-collaboration ecosystem and
      integrations for Teambition.
  sources:
    - >
      Official Help Manual linked by Teambition:
      https://alidocs.dingtalk.com/i/p/nb9XJlxV4RlvLGyA
    - 'Official company page: https://www.teambition.com/about'
    - 'Official product site: https://www.teambition.com/'
  summary:
    - >
      Teambition is an Alibaba Group team-collaboration and project-management service
      integrated with DingTalk.
  timeline:
    - >
      Startup period: Teambition was developed as a standalone collaboration product by
      Shanghai Huiyi Information Technology.
    - >
      Alibaba period: The company and product joined Alibaba Group and became integrated
      with DingTalk.
  usage:
    - >
      Organizations use Teambition to plan and monitor projects, assign and track tasks,
      manage knowledge, coordinate agile development, and connect project work with
      DingTalk chat, documents, and approvals.
