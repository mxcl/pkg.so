id: brew:kommit
display-name: kommit
homepage: https://github.com/vigo/kommit
repo: https://github.com/vigo/kommit
docs:
  - https://github.com/vigo/kommit#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kommit's adoption footprint is intentionally small: it is a shell tool distributed
      through Homebrew and other Unix package sets for developers who want a scratchpad
      for commit-message detail without modifying source code.
  package-nerd-significance:
    - >
      Kommit is notable as a compact example of Git's external-command convention and
      hook system: a single executable named `git-kommit` becomes `git kommit` and
      coordinates with `.git/hooks/prepare-commit-msg`.
  project-history:
    - >
      The repository was created on 2016-01-15, matching the README changelog entry for
      the initial commit. Version 0.1.0 followed on 2016-01-16, and the README records
      the 2016-02-10 switch to the `git-kommit` filename for Git subcommand integration.
  related-projects:
    - >
      The README cites commit-comments as an inspiration point and lists editor
      integrations for TextMate, Atom, Sublime, Vim, and Emacs.
  sources:
    - https://api.github.com/repos/vigo/kommit
    - https://github.com/vigo/kommit
    - https://github.com/vigo/kommit/releases/tag/v1.1.0
    - https://raw.githubusercontent.com/vigo/kommit/main/README.md
  summary:
    - >
      Kommit is a small Git helper that lets users collect detailed commit-message notes
      before running `git commit`. It stores the notes in `.git/kommit-message` and uses
      a `prepare-commit-msg` hook to append them to the final commit message.
  timeline:
    - '2016-01-15: Initial commit recorded in the README changelog.'
    - '2016-01-16: v0.1.0 released.'
    - '2016-02-10: Renamed to `git-kommit` for Git integration.'
    - >
      2016-03-05: Commit-message hook behavior updated so `git commit -m` includes
      Kommit notes.
  usage:
    - >
      Typical use is `git kommit -m` or `git kommit -t` to append notes, `git kommit -s`
      to show them, and `git kommit -i` to install the Git hook.
related-packages: []
category: developer-tools
package-manager:
  apk: kommit
  brew: kommit
  dnf: kommit
  pacman: kommit
  zypper: kommit
package-manager-url: https://formulae.brew.sh/formula/kommit
license: MIT
tags:
  - cli
  - commit-message
  - git
  - version-control
description: More detailed commit messages without committing!
executables:
  - git-kommit
provenance:
  formula: kommit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
