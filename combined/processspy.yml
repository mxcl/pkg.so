history:
  adoption-history:
    - >
      The developer describes ProcessSpy as serving developers, system administrators,
      and power users who need more process identity and history than macOS Activity
      Monitor exposes. The official site states that it is used by thousands of users,
      while offering core features free and advanced capabilities under a paid license.
  package-nerd-significance:
    - >
      ProcessSpy is a native macOS counterpart to tools such as Windows Process Explorer
      and terminal process monitors. Package users care about its combination of process
      hierarchy, resource history, command-line inspection, code-signing details,
      environment inspection, JavaScript filters, and Homebrew Cask distribution.
  project-history:
    - >
      ProcessSpy was created by an independent developer who needed to distinguish
      several same-named Java processes using different JDK versions. The application
      grew from basic CPU, memory, thread, and search functionality into a detailed
      native macOS process inspector.
    - >
      Successive releases added JavaScript filters, hierarchy views, signature and
      entitlement inspection, historical charts, finished-process recall, a menu-bar
      dashboard, network and GPU statistics, alerts, and a privileged helper for
      inspecting system processes.
  related-projects:
    - macOS Activity Monitor
    - Sysinternals Process Explorer
    - htop
  sources:
    - https://github.com/robert-v/ProcessSpy-public
    - https://process-spy.app/
    - https://process-spy.app/changelog
  summary:
    - >
      ProcessSpy is a native macOS process monitor designed for detailed inspection,
      filtering, historical analysis, and resource troubleshooting.
  timeline:
    - >
      Early releases: ProcessSpy added CPU, RAM, thread columns, search, and
      process-path inspection.
    - >
      Later releases: JavaScript filters, hierarchical views, environment inspection,
      signing details, and historical charts expanded the tool.
    - >
      Recent releases: Menu-bar monitoring, network and GPU statistics, alerts, and
      privileged system-process inspection were added.
  usage:
    - >
      Users inspect live and finished processes, distinguish identical executable names
      through paths and command lines, search with regular expressions, define
      JavaScript filters, analyze CPU and memory history, inspect signatures and
      entitlements, and export observations for further analysis.
