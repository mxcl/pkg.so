id: brew:jump
display-name: Jump
homepage: https://github.com/gsamokovarov/jump
repo: https://github.com/gsamokovarov/jump
docs:
  - https://github.com/gsamokovarov/jump
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Jump was packaged for macOS through Homebrew and MacPorts, for Nix, for Snap, and
      through downloadable Debian and RPM artifacts. That distribution mix put it in the
      same everyday CLI category as `autojump`, `z`, and other frecency-style directory
      jumpers.
    - >
      The README's import support for `autojump` and `z` shows that Jump was designed to
      meet users already carrying directory-history databases from earlier tools.
  package-nerd-significance:
    - >
      Jump is a tidy example of a small Go CLI that becomes useful only through shell
      integration. The package-manager job is not just installing a binary, but making a
      discoverable post-install path for shell init.
    - >
      It belongs to the package-nerd genre of tools that optimize `cd`, a deceptively
      small workflow improvement that heavy terminal users notice immediately.
  project-history:
    - >
      Jump's public GitHub releases begin with v0.1.0 on September 6, 2015. The README
      describes the central idea that the tool integrates with the shell, tracks visited
      directories, and jumps to the right directory with a few fuzzy-typed characters.
    - >
      The tool evolved from a simple Go command into a cross-shell navigation helper
      with Bash, Zsh, Fish, PowerShell, Nushell, and Murex integration. Later releases
      added behavior such as deep jumps, reverse jumps, relative jumps, pins, imports
      from `autojump` or `z`, and based mode for repository or monorepo navigation.
  related-projects:
    - Jump is related to `autojump`, `z`, `zoxide`, and shell-native directory stack features.
    - >
      The README documents import support for `autojump` and `z`, making those tools
      explicit migration sources.
  sources:
    - https://github.com/gsamokovarov/jump
    - https://github.com/gsamokovarov/jump/releases
  summary:
    - >
      Jump is a shell-integrated directory jumper. It records directories a user visits
      and lets the user move back to them with short fuzzy queries through a shell
      helper, usually bound as `j`.
  timeline:
    - '2015-09-06: GitHub release v0.1.0 was published.'
    - '2016-02-19: GitHub release v0.7.1 was published.'
    - '2019-04-08: GitHub release v0.23.0 was published.'
    - '2022-08-07: GitHub release v0.51.0 was published.'
    - '2025-12-12: GitHub release v0.67.0 was published.'
  usage:
    - >
      Users install Jump, evaluate `jump shell` in their shell startup, and then use `j`
      queries to move through the filesystem. The README documents fuzzy, exact, deep,
      relative, reverse, case-sensitive, pinned, and based-mode jumps.
    - >
      Database commands such as `jump clean`, `jump forget`, and `jump top` manage or
      inspect the learned directory data.
related-packages:
  - id: brew:zoxide
    reason: >
      Choose zoxide for a similar frecency-based directory jumper with broad shell
      support; Jump can directly import an existing zoxide database.
    rel: alternative
    sources:
      - https://github.com/gsamokovarov/jump#readme
      - https://github.com/ajeetdsouza/zoxide#readme
  - id: brew:autojump
    reason: >
      Choose autojump for the older directory-jumping workflow and established `j`
      command; Jump provides an official command for importing its history.
    rel: alternative
    sources:
      - https://github.com/gsamokovarov/jump#readme
      - https://github.com/wting/autojump#readme
category: developer-tools
package-manager:
  brew: jump
  macports: jump
  nix: jump
package-manager-url: https://formulae.brew.sh/formula/jump
license: MIT
tags:
  - bash
  - cli
  - filesystem-navigation
  - fish
  - fuzzy-search
  - shell
  - zsh
description: Helps you navigate your file system faster by learning your habits
executables:
  - jump
provenance:
  formula: jump
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
