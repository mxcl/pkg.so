id: brew:mosquitto
display-name: Eclipse Mosquitto
homepage: https://mosquitto.org/
repo: https://github.com/eclipse-mosquitto/mosquitto
docs:
  - https://mosquitto.org/documentation
config-file-location:
  linux: /etc/mosquitto/mosquitto.conf
  unix:
    - mosquitto.conf
    - path passed with --config-file/-c
credentials-file-location:
  unix: password_file path configured in mosquitto.conf
history:
  project-history:
    - >
      Mosquitto's software-paper milestone is Roger A. Light's 2017 Journal of Open
      Source Software article, "Mosquitto: server and client implementation of the MQTT
      protocol." The JOSS metadata places the project in the Internet of Things, MQTT,
      pub/sub, and messaging categories. The project homepage explains the broader use
      case: MQTT is a lightweight publish/subscribe protocol suited to IoT messaging for
      low-power sensors, mobile devices, embedded computers, and microcontrollers.
  sources:
    - https://formulae.brew.sh/formula/mosquitto
    - https://github.com/eclipse-mosquitto/mosquitto
    - https://joss.theoj.org/papers/10.21105/joss.00265
    - https://mosquitto.org/
  summary:
    - >
      Eclipse Mosquitto is an open-source MQTT broker and client-tool project written by
      Roger A. Light. The project implements server support for MQTT 5.0, 3.1.1, and
      3.1, and also ships C and C++ client libraries plus command-line utilities such as
      mosquitto_pub, mosquitto_sub, mosquitto_rr, mosquitto_ctrl, mosquitto_signal, and
      mosquitto_passwd.
  usage:
    - >
      The broker is used as a small, easily deployed MQTT server for development,
      testing, gateways, and production IoT systems; the bundled clients are widely used
      for smoke tests, scripts, and examples. Within package managers, Mosquitto is the
      default lightweight MQTT broker option and complements Eclipse Paho, which focuses
      on MQTT client libraries. The project is part of the Eclipse Foundation's IoT
      ecosystem, with development driven by Cedalo.
related-packages:
  - id: brew:libpaho-mqtt
    reason: >
      Eclipse Paho's C client library complements Mosquitto by letting applications
      publish and subscribe over MQTT to a Mosquitto broker rather than relying on the
      bundled command-line clients.
    rel: adjacent_workflow
    sources:
      - https://eclipse-paho.github.io/paho.mqtt.c/MQTTClient/html/
      - https://github.com/eclipse-mosquitto/mosquitto
category: networking
package-manager:
  apk: mosquitto
  brew: mosquitto
  debian: libmosquitto-dev
  dnf: mosquitto
  macports: mosquitto
  nix: mosquitto
  pacman: mosquitto
  scoop: main/mosquitto
  ubuntu: libmosquitto-dev
  winget: EclipseFoundation.Mosquitto
  zypper: libmosquitto1
package-manager-url: https://formulae.brew.sh/formula/mosquitto
license: EPL-1.0 OR BSD-3-Clause
tags:
  - cli
  - iot
  - message-broker
  - mqtt
  - publish-subscribe
description: Message broker implementing the MQTT protocol
executables:
  - mosquitto
  - mosquitto_ctrl
  - mosquitto_db_dump
  - mosquitto_passwd
  - mosquitto_pub
  - mosquitto_rr
  - mosquitto_signal
