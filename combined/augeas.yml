id: brew:augeas
display-name: Augeas
homepage: https://augeas.net/
repo: https://github.com/hercules-team/augeas
docs:
  - https://augeas.net/docs/index.html
  - https://augeas.net/tour.html
  - https://github.com/hercules-team/augeas#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Augeas spread through system packaging rather than app-store style distribution.
      The supplied package facts list Alpine, Homebrew, Debian, Fedora, MacPorts, Nix,
      Arch, Ubuntu, and openSUSE packages. Its adoption is also visible in the broad
      contributor list, which includes Linux distribution and configuration-management
      contributors, and in the stock-lens model that lets downstreams add support for
      local config formats.
  package-nerd-significance:
    - >
      Augeas matters because it packages policy as parsers. Distros and operations tools
      need to edit config files without destroying comments, ordering, or local syntax;
      Augeas offers a stable library and CLI for that job. Its package value is in the
      lens corpus, ABI, bindings, and test fixtures as much as the augtool executable.
  project-history:
    - >
      Augeas was written by David Lutterkort at Red Hat, according to the official
      AUTHORS file. The official README frames the project around a deliberately narrow
      problem: edit actual Linux configuration files in a controlled manner while
      preserving each file's native format rather than inventing a new cross-platform
      configuration abstraction.
    - >
      The Augeas web documentation includes a 2008 Ottawa Linux Symposium talk and Red
      Hat Summit material, and the GitHub repository was created in 2008. The project
      has continued as a long-lived system tool with a C API, augtool, language
      bindings, and a growing stock of lenses for common configuration formats.
    - >
      Release notes show the modern maintenance arc: 1.10 added augmatch and new API
      helpers in 2018, 1.13 added preview support and path-expression improvements in
      2021, 1.14 added augprint and more lens coverage in 2022, and 1.14.1 in 2023
      continued compatibility and lens updates.
  related-projects:
    - >
      Augeas is related to configuration-management systems, language bindings around
      libaugeas, and other Hercules-team/system tooling. Its docs also expose libfa, the
      finite-automata library used by the project.
  sources:
    - https://api.github.com/repos/hercules-team/augeas
    - https://augeas.net/docs/index.html
    - https://augeas.net/tour.html
    - https://github.com/hercules-team/augeas#readme
    - https://raw.githubusercontent.com/hercules-team/augeas/master/AUTHORS
    - https://raw.githubusercontent.com/hercules-team/augeas/master/NEWS
  summary:
    - >
      Augeas is a library and command-line toolkit for editing real system configuration
      files through a structured tree API. It is famous among Unix configuration people
      for replacing brittle sed and awk edits with lenses: bidirectional parsers that
      understand native config-file syntax.
  timeline:
    - >
      2008: Augeas material was presented at Ottawa Linux Symposium and Red Hat Summit;
      the GitHub repository was created.
    - '2016: GitHub release tags include 1.6.0 and 1.7.0.'
    - '2018: Version 1.10 added augmatch and API additions.'
    - '2021: Version 1.13 added preview support and path-expression improvements.'
    - '2022: Version 1.14 added augprint and expanded lenses.'
    - '2023: Version 1.14.1 shipped compatibility fixes and lens updates.'
  usage:
    - >
      Users normally explore and modify the parsed tree with augtool, for example under
      /files/etc/hosts or /files/etc/grub.conf. Developers and configuration-management
      systems can call the C API or bindings, while lens authors write small schema-like
      descriptions to teach Augeas about new file formats.
related-packages:
  - id: brew:ansible
    reason: >
      With the community.general collection installed, Ansible can apply Augeas lens
      expressions from playbooks for structured edits that preserve unmanaged
      configuration text.
    rel: adjacent_workflow
    sources:
      - https://docs.ansible.com/ansible/latest/collections/community/general/augeas_module.html
      - https://augeas.net/
category: system
