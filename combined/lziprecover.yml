id: brew:lziprecover
display-name: Lziprecover
homepage: https://www.nongnu.org/lzip/lziprecover.html
repo: https://cvs.savannah.nongnu.org/viewvc?root=lzip
docs:
  - https://www.nongnu.org/lzip/manual/lziprecover_manual.html
  - https://www.nongnu.org/lzip/lziprecover.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lziprecover is narrower than lzip itself, but package managers include it because
      a recovery story is part of why some users choose .lz archives. The input package
      facts show packages in Homebrew, Debian/Ubuntu, Fedora, Nix, and openSUSE-style
      ecosystems.
    - >
      It is most likely to be installed by users handling backups, source archives,
      damaged media, or archival workflows where a regular decompressor is not enough.
  package-nerd-significance:
    - >
      Lziprecover is a small but unusually package-nerdy tool because it validates the
      package format's social promise: compressed source and backup archives should be
      inspectable and salvageable years later. It is not just a decompressor; it is part
      of the lzip ecosystem's argument for safe long-term distribution.
    - >
      For maintainers, it is the sort of leaf utility that looks optional until a
      damaged source archive or backup turns it into the only tool that matters.
  project-history:
    - >
      Lziprecover exists because lzip's format was deliberately designed with recovery
      in mind: simple members, CRC-protected original data, member sizes, and LZMA
      stream constraints make corruption easier to locate and reason about. The recovery
      tool turns those format choices into user-visible operations.
    - >
      The official release indexes show lziprecover distributed as part of the lzip
      family by at least 2012, with a dedicated lziprecover release directory starting
      at 1.15 in 2013 and continuing through 1.26 in 2026. Over time the tool became the
      practical proof point for lzip's long-term-archiving claims.
  related-projects:
    - lzip creates the .lz format that lziprecover repairs.
    - >
      GNU ddrescue is recommended by the lziprecover manual as a complementary tool when
      corruption comes from damaged media.
    - plzip, clzip, pdlzip, lzlib, and lunzip are sibling tools in the lzip family.
  sources:
    - https://download-mirror.savannah.gnu.org/releases/lzip/old/
    - https://download.savannah.nongnu.org/releases/lzip/lziprecover/
    - https://www.nongnu.org/lzip/lziprecover.html
    - https://www.nongnu.org/lzip/manual/lziprecover_manual.html
    - source_facts.package-manager
  summary:
    - >
      Lziprecover is the recovery and decompression companion for the lzip compressed
      data format. Its official manual describes a tool that can repair slightly damaged
      .lz files, merge good parts from multiple damaged copies, extract data from
      damaged files, test integrity, and generate Forward Error Correction files.
  timeline:
    - '2012: lziprecover releases are present in the Savannah old-release index.'
    - '2013: lziprecover 1.15 appears in the dedicated Savannah release directory.'
    - '2026: lziprecover 1.26 is published in the official release directory.'
  usage:
    - >
      Typical uses include testing .lz files, decompressing damaged archives as far as
      possible, repairing a one-byte error in a member, merging two or more damaged
      copies into a correct file, and extracting tar members from a damaged tar.lz
      stream.
    - >
      The official page gives the common tar pipeline pattern with lziprecover writing
      decompressed data to stdout and tar reading it from stdin.
related-packages:
  - id: brew:lzip
    reason: >
      Use Lzip to create and normally decompress .lz archives; Lziprecover is its
      specialized companion for testing, repairing, and salvaging damaged archives.
    rel: adjacent_workflow
    sources:
      - https://www.nongnu.org/lzip/lziprecover.html
      - https://www.nongnu.org/lzip/manual/lzip_manual.html
  - id: brew:ddrescue
    reason: >
      Image failing media with GNU ddrescue first, then use Lziprecover on the rescued
      .lz file; the Lziprecover project explicitly recommends this combination for
      storage-media corruption.
    rel: adjacent_workflow
    sources:
      - https://www.nongnu.org/lzip/lziprecover.html
      - https://www.gnu.org/software/ddrescue/manual/ddrescue_manual.html
category: system
