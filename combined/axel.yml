id: brew:axel
display-name: Axel
homepage: https://github.com/axel-download-accelerator/axel
repo: https://github.com/axel-download-accelerator/axel
docs:
  - https://github.com/axel-download-accelerator/axel#readme
  - https://github.com/axel-download-accelerator/axel/blob/master/doc/axel.txt
config-file-location:
  unix:
    - /etc/axelrc
    - ~/.axelrc
credentials-file-location:
  unix: ~/.netrc
history:
  adoption-history:
    - >
      Axel's adoption is visible in its packaging footprint. The batch input lists
      packages across Homebrew, Debian, Ubuntu, Fedora/DNF, openSUSE/Zypper,
      Arch/Pacman, Alpine/APK, MacPorts, Nix, and Chocolatey. That spread is
      characteristic of a mature small CLI: it is not a platform product, but it is
      useful enough to be available almost everywhere package nerds look first.
  package-nerd-significance:
    - >
      Axel matters in package-manager culture because it represents the tiny C utility
      lane next to heavier downloaders such as aria2. It gives maintainers a
      low-dependency, autotools-built downloader with a stable CLI, a man page, and
      config files in conventional Unix locations.
    - >
      Its long packaging tail also makes it a useful compatibility check for distro
      maintainers: TLS library choices, getopt behavior, rc-file locations, and
      documentation installation paths all matter more here than shiny features.
  project-history:
    - >
      The current official GitHub repository was created in August 2015 under the
      axel-download-accelerator organization. The README credits Wilmer van der Gaast as
      the original developer and notes that the project has had contributors over the
      years, reflecting a continuation of an older Unix utility rather than a brand-new
      2015 tool.
    - >
      The project has stayed intentionally narrow. The official manual page describes a
      program that downloads through multiple connections, supports mirror URLs, can
      search for mirrors, and reads simple system-wide and per-user rc files. The README
      still points users to the man page rather than a large web documentation site.
  related-projects:
    - The official README lists aria2, hget, lftp, nugget, and pget as related projects.
  sources:
    - GitHub releases API lists v2.14 in 2017, v2.17 in 2019, and v2.17.14 in 2024.
    - 'GitHub repository metadata: created_at 2015-08-13.'
    - >
      Official README credits original developer Wilmer van der Gaast and long-running
      contributors.
    - Official manpage documents purpose, protocols, rc files, and examples.
    - input.source_facts.package-manager lists broad distro and package-manager adoption.
  summary:
    - >
      Axel is a lightweight command-line download accelerator for HTTP, HTTPS, FTP, and
      FTPS. Its core trick is old-school and Unix-friendly: split a file across multiple
      connections, write directly into the destination file, and keep the program small
      enough for constrained systems.
  timeline:
    - '2015: Current official GitHub repository created.'
    - '2017: GitHub releases include the v2.14 and v2.16 series.'
    - '2019: v2.17 release series begins.'
    - '2024: v2.17.14 release published.'
  usage:
    - >
      Users run `axel` with one or more URLs, choose connection counts with
      `--num-connections`, limit bandwidth with `--max-speed`, resume interrupted
      transfers from state, and optionally configure defaults in `/etc/axelrc` or
      `~/.axelrc`. The man page also documents proxy, protocol, output, progress, and
      timeout flags.
related-packages:
  - id: brew:aria2
    reason: >
      Choose aria2 when the same accelerated-download workflow also needs BitTorrent,
      Metalink, SFTP, checksums, or remote control through an RPC service.
    rel: alternative
    sources:
      - https://github.com/axel-download-accelerator/axel#related-projects
      - https://aria2.github.io/manual/en/html/aria2c.html
  - id: brew:lftp
    reason: >
      Choose lftp when downloads are part of a broader interactive or scripted transfer
      workflow requiring uploads, directory mirroring, queues, background jobs, WebDAV,
      or SFTP.
    rel: alternative
    sources:
      - https://github.com/axel-download-accelerator/axel#related-projects
      - https://lftp.yar.ru/lftp-man.html
category: networking
package-manager:
  apk: axel
  brew: axel
  chocolatey: axel
  debian: axel
  dnf: axel
  macports: axel
  nix: axel
  pacman: axel
  ubuntu: axel
  zypper: axel
package-manager-url: https://formulae.brew.sh/formula/axel
license: GPL-2.0-or-later WITH cryptsetup-OpenSSL-exception
tags:
  - accelerator
  - cli
  - download
  - ftp
  - http
description: Light UNIX download accelerator
executables:
  - axel
provenance:
  formula: axel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
