id: brew:checkbashisms
display-name: checkbashisms
homepage: https://launchpad.net/ubuntu/+source/devscripts/
repo: https://salsa.debian.org/debian/devscripts
docs:
  - https://manpages.debian.org/testing/devscripts/checkbashisms.1.en.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      checkbashisms entered devscripts as a new script in the August 2003 changelog.
      Because devscripts is a standard Debian developer utility package, the command
      spread first through Debian and Ubuntu workflows, then through repackaging in
      Homebrew, Alpine, Nix, Arch, and openSUSE as recorded in the batch input.
  package-nerd-significance:
    - >
      checkbashisms is package-nerd folklore because it encodes Debian Policy and POSIX
      shell portability expectations into a tiny linter, catching scripts that
      accidentally require bash when packaged as /bin/sh-compatible.
  project-history:
    - >
      The Debian manpage says checkbashisms was originally written as a shell script by
      Yann Dirson and rewritten in Perl by Julian Gilbey. The current script says it is
      based on a Lintian scripts check with copyright ancestry from Richard Braakman,
      Josip Rodin, and Julian Gilbey.
  related-projects:
    - devscripts is the Debian utility collection that ships checkbashisms.
    - Lintian is the source of the original check logic described in the script and manpage.
    - dash, POSIX sh, Debian Policy, and bash are the compatibility context for the command.
  sources:
    - https://salsa.debian.org/debian/devscripts
    - https://manpages.debian.org/testing/devscripts/checkbashisms.1.en.html
    - https://sources.debian.org/data/main/d/devscripts/2.26.9/scripts/checkbashisms.1
    - https://sources.debian.org/data/main/d/devscripts/2.26.9/scripts/checkbashisms.pl
    - https://sources.debian.org/data/main/d/devscripts/2.26.9/debian/changelog
  summary:
    - >
      checkbashisms is a Debian devscripts command that scans shell scripts for possible
      bash-specific constructs in scripts intended to run as /bin/sh.
  timeline:
    - '1997: devscripts split off from debmake.'
    - "1998: Lintian-era scripts checks provide part of checkbashisms' ancestry."
    - '2003: checkbashisms added to devscripts.'
    - '2018: Debian devscripts repository created on Salsa.'
    - '2026: devscripts 2.26.9 source published in Debian unstable.'
  usage:
    - >
      Users run `checkbashisms script ...` to warn about constructs not required by
      POSIX, with options for stricter POSIX checking, force-checking, lint-style editor
      output, extra context, and early failure.
related-packages:
  - id: brew:shellcheck
    reason: >
      Choose ShellCheck when you want broader Bash and POSIX-shell analysis covering
      quoting, semantics, robustness, and portability rather than checkbashisms' focused
      `/bin/sh` Bashism checks.
    rel: alternative
    sources:
      - https://manpages.debian.org/testing/devscripts/checkbashisms.1.en.html
      - https://www.shellcheck.net/
      - https://github.com/koalaman/shellcheck#readme
category: developer-tools
package-manager:
  apk: checkbashisms
  brew: checkbashisms
  nix: checkbashisms
  pacman: checkbashisms
  zypper: checkbashisms
package-manager-url: https://formulae.brew.sh/formula/checkbashisms
license: GPL-2.0-or-later
tags:
  - cli
  - debian
  - linting
  - perl
  - posix
  - shell
description: Checks for bashisms in shell scripts
executables:
  - checkbashisms
provenance:
  formula: checkbashisms
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
