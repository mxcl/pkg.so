config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      picocom became broadly available across Unix-like package collections, including
      Homebrew, MacPorts, Debian, Ubuntu, Fedora-family repositories, Arch Linux, Alpine
      Linux, Nix, and openSUSE. This reach reflects its usefulness as a small default
      serial-console utility.
    - >
      The project moved issue and source activity to GitHub after earlier Google
      Code-era development, while preserving a deliberately small and portable design.
  package-nerd-significance:
    - >
      picocom embodies the small-tool Unix ideal: it handles interactive serial
      communication without the menus and larger configuration model associated with
      minicom. Its tiny footprint also makes it suitable for constrained development and
      embedded hosts.
  project-history:
    - >
      Nick Patavalis created picocom as a minimal dumb-terminal emulator. Its name
      deliberately contrasts it with minicom: “pico” rather than “mini.”
    - >
      The program was designed for manual modem setup, testing, and debugging, then
      found wider use for consoles on routers, embedded boards, and other serially
      managed hardware. Release 2.0 changed external transfer-command execution to avoid
      using /bin/sh, improving command handling security.
  related-projects:
    - >
      The official README explicitly positions picocom as a smaller counterpart to
      minicom. It can also invoke external file-transfer programs when send and receive
      commands are configured.
  sources:
    - 'Official manual: https://github.com/npat-efault/picocom/blob/master/picocom.1.html'
    - 'Official repository and README: https://github.com/npat-efault/picocom'
    - source_facts.package-manager
  summary:
    - >
      picocom is a compact Unix serial terminal intended for modem configuration,
      hardware debugging, and access to device consoles. It favors command-line options
      and interactive escape commands over a full-screen configuration interface.
  timeline:
    - >
      Early project: picocom created by Nick Patavalis as a deliberately smaller
      alternative to minicom.
    - '2014: A logging feature request originated in the project’s Google Code tracker.'
    - '2015: Earlier Google Code issues were migrated to GitHub.'
    - 'Release 2.0: External send/receive commands stopped being executed through /bin/sh.'
    - >
      Release 3.1: Current long-lived stable release line documented by the official
      repository.
  usage:
    - >
      A typical invocation selects a serial device and baud rate, such as picocom -b
      115200 /dev/ttyUSB0. It is commonly used to inspect boot logs, configure modems,
      interact with microcontroller boards, and expose serial ports through simple
      SSH-based terminal servers.
