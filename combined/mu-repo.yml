id: brew:mu-repo
display-name: mu-repo
homepage: https://github.com/fabioz/mu-repo
repo: https://github.com/fabioz/mu-repo
docs:
  - https://github.com/fabioz/mu-repo#readme
config-file-location:
  unix: .mu_repo
  windows: .mu_repo
credentials-file-location: null
history:
  project-history:
    - >
      The project grew by adding practical multi-repository conveniences rather than by
      replacing Git. Its documentation and PyPI page list cloning multiple repositories,
      grouping repositories, diffing changes with external tools such as WinMerge or
      meld, checking out branches by partial names, previewing incoming changes,
      shortcuts for common Git operations, opening pull-request URLs across
      repositories, and running arbitrary commands through mu sh. The changelog-style
      notes on the project site show several of those features arriving in the 1.x line,
      including cloning multiple repositories in 1.2.0, upward directory discovery in
      1.3.0, pull-request URL support in 1.5.0, and non-Git command execution in 1.6.0.
  sources:
    - https://fabioz.github.io/mu-repo/
    - https://formulae.brew.sh/formula/mu-repo
    - https://github.com/fabioz/mu-repo
    - https://pypi.org/project/mu-repo/
  summary:
    - >
      mu-repo is Fabio Zadrozny's Python command-line tool for working with related Git
      repositories as a group. Its own site expands the name as Multiple Repositories
      and starts from the everyday problem of running the same Git operation across
      several sibling repositories without forgetting one of them. The core workflow is
      to register repositories once and then run commands such as fetch, checkout,
      branch creation, or arbitrary shell commands across the registered set.
  usage:
    - >
      Its niche overlaps with tools such as repo, mr, git submodules, and bulk-update
      scripts, but mu-repo stays closer to a convenience wrapper around existing Git
      repositories. Package managers expose it as the mu executable for developers
      maintaining split codebases, plugin families, or organization-wide changes that
      need the same operation repeated across many repositories.
related-packages:
  - id: brew:repo
    reason: >
      Choose Android's Repo when a large multi-repository source tree should be defined
      by versioned XML manifests; choose mu-repo for lighter project-local registration
      and repeated Git or shell commands.
    rel: alternative
    sources:
      - https://fabioz.github.io/mu-repo/
      - https://source.android.com/docs/setup/download/source-control-tools
      - https://source.android.com/docs/setup/reference/repo
category: developer-tools
package-manager:
  apk: guile-mu
  brew: mu-repo
  macports: mu
  nix: mu-repo
  winget: Mu.Mu
package-manager-url: https://formulae.brew.sh/formula/mu-repo
license: GPL-3.0-only
tags:
  - cli
  - git
  - multi-repository
  - repository-management
description: Tool to work with multiple git repositories
executables:
  - mu
provenance:
  formula: mu-repo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
