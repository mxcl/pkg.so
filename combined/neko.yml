id: brew:neko
display-name: Neko
homepage: https://nekovm.org/
repo: https://github.com/HaxeFoundation/neko
docs:
  - https://github.com/HaxeFoundation/neko#readme
  - https://nekovm.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Neko's adoption followed Haxe's early toolchain and server/runtime story rather
      than becoming a mainstream standalone language. The Neko GitHub repository's
      README marked the project deprecated on 2021-09-09, saying it is no longer
      actively maintained and is kept compatible with existing Haxe standard-library and
      language features.
    - >
      Despite that deprecation, package-manager usage persists because old Haxe
      projects, tooling, and runtime integrations still need it. Homebrew listed stable
      version 2.4.1 and showed 1,052 installs over 365 days, 174 over 90 days, and 72
      over 30 days when checked on 2026-07-01. The GitHub API showed 584 stars and 110
      forks the same day.
  package-nerd-significance:
    - >
      Neko is significant as an early piece of the Haxe ecosystem and a predecessor to
      HashLink. It is a good example of a package that remains useful after deprecation
      because language ecosystems have long tails of bytecode targets, build scripts,
      and runtime assumptions.
  project-history:
    - >
      The Neko website says it was developed as part of Motion-Twin's research and
      development work on better languages by Nicolas Cannasse. The same site describes
      the compiler as producing `.n` bytecode executed by the VM, with a lightweight
      embeddable runtime and a C foreign-function interface.
    - >
      The Haxe manual records Neko as a VM originally designed for Haxe and says it was
      superseded by HashLink, introduced with Haxe 3.4. Nicolas Cannasse's 2016 HashLink
      article adds the historical detail that Neko was designed before Haxe and intended
      for several languages, but in practice NekoML and Haxe were the two that targeted
      it.
  related-projects:
    - Haxe
    - HashLink
    - NekoML
    - Motion-Twin
    - mod_neko
  sources:
    - https://api.github.com/repos/HaxeFoundation/neko
    - https://formulae.brew.sh/formula/neko
    - https://github.com/HaxeFoundation/neko
    - https://haxe.org/blog/hashlink-indepth/
    - https://haxe.org/manual/introduction-haxe-history.html
    - https://haxe.org/manual/target-neko.html
    - https://nekovm.org/
  summary:
    - >
      Neko is both a small dynamically typed programming language and a virtual machine
      designed as a common runtime for multiple languages. In package-manager practice,
      it is most historically tied to Haxe, which supported compilation to Neko bytecode
      before HashLink became the preferred successor target.
  timeline:
    - '2005: Haxe started; Neko predates or overlaps the earliest Haxe runtime design work.'
    - '2013-05-25: HaxeFoundation/neko GitHub repository created.'
    - >
      2016-11-22: HashLink article described HashLink as the successor to NekoVM for
      Haxe system/server/desktop applications.
    - '2021-09-09: Neko README marked the project deprecated and not actively maintained.'
    - '2026-07-01: Homebrew formula stable version observed as 2.4.1.'
  usage:
    - >
      Users install `neko`, `nekoc`, `nekoml`, and `nekotools` to run Neko bytecode,
      compile `.neko` sources, support legacy Haxe targets, or work with Neko's bundled
      libraries and Apache module history. Homebrew's formula notes the `NEKOPATH`
      environment variable, which matters because Neko expects to find its runtime
      libraries.
    - >
      For package nerds, Neko is less about new application development and more about
      keeping an older cross-language VM and Haxe target buildable. Its dependencies on
      a garbage collector, regex, TLS, database, and build tooling also show the VM's
      broader ambition as an embeddable and server-capable runtime.
related-packages:
  - id: brew:haxe
    reason: >
      Install Haxe alongside Neko to compile Haxe applications to Neko bytecode for
      execution by the Neko VM.
    rel: adjacent_workflow
    sources:
      - https://haxe.org/manual/target-neko.html
      - https://github.com/HaxeFoundation/haxe
  - id: brew:hashlink
    reason: >
      Choose HashLink for newer Haxe system, server, or desktop projects needing typed
      bytecode or native C output; choose Neko when maintaining the older, incompatible
      Neko target.
    rel: alternative
    sources:
      - https://haxe.org/blog/hashlink-indepth/
      - https://github.com/HaxeFoundation/hashlink
      - https://github.com/HaxeFoundation/neko
category: language-runtime
