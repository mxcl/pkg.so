  macos: ~/Library/Application Support/Minecraftpe/Games/com.mojang
credentials-file-location: null
history:
  adoption-history:
    - >
      Minecraft Education's official site reports use by more than 40,000 school systems
      across 140 countries. It is available across Windows, macOS, Chromebook, iPad,
      Android, and iOS and is licensed through educational subscriptions, including
      eligible Microsoft 365 Education arrangements.
  package-nerd-significance:
    - >
      Minecraft Education is notable as an education-focused downstream edition of a
      major commercial game, packaged for managed classroom deployment across several
      operating systems. Administrators care about licensing, device deployment, local
      world storage, and cross-platform compatibility as much as gameplay.
  project-history:
    - >
      Minecraft Education adapts Minecraft's open-world building model for schools,
      adding secure sign-in, classroom collaboration, assessment and teaching features,
      tutorials, coding tools, and curriculum content. Official material records its
      launch on November 1, 2016.
  related-projects:
    - >
      Minecraft is the underlying game family. Microsoft 365 Education supplies
      organizational identity and licensing in many deployments, while MakeCode is used
      by the Code Builder feature.
  sources:
    - >
      https://education.minecraft.net/content/dam/education-edition/software-downloads/Minecraft_Education_Edition_Design_Guide_June_2021.pdf
    - https://education.minecraft.net/en-us
    - https://education.minecraft.net/en-us/discover/what-is-minecraft
    - https://edusupport.minecraft.net/hc/en-us/articles/4404785703316-Location-of-World-Files
  summary:
    - >
      Minecraft Education is a classroom-oriented edition of Minecraft designed for
      game-based learning, collaboration, coding, and curriculum-aligned instruction.
  timeline:
    - 'November 1, 2016: Minecraft: Education Edition officially launched.'
    - 'By 2021: Official material described millions of monthly users.'
    - >
      By 2026: The official site reported adoption by more than 40,000 school systems in
      140 countries.
  usage:
    - >
      Teachers use prepared lessons and immersive worlds or build their own activities
      across STEM, coding, history, language arts, social-emotional learning, and other
      subjects. Students collaborate in school-managed worlds, while administrators
      manage licenses and device deployment. On macOS, local game data and worlds reside
      beneath the documented com.mojang directory.
