history:
  adoption-history:
    - >
      Jianying developed within the same product family that serves international users
      as CapCut. Official CapCut material dates the wider platform's founding and global
      launch to 2020 and describes its adoption as an accessible editor for social-media
      and general creative work.
    - >
      The desktop Professional edition extends the product beyond quick mobile edits
      with multi-timeline and multicamera workflows, detailed color and audio tools, and
      AI-assisted generation and cleanup.
  package-nerd-significance:
    - >
      The `videofusion` cask is notable because its package token and installed bundle
      name do not match the product's public Chinese name: it installs
      `VideoFusion-macOS.app`, while the curated display name is 剪映专业版. Accurate
      curation prevents users from mistaking it for an unrelated editor.
    - >
      It also illustrates regional software naming: Jianying is the China-market member
      of the broader CapCut editing family and is distributed from `capcut.cn`, while
      CapCut serves international markets.
  project-history:
    - >
      剪映专业版 is the desktop professional edition of Jianying, an all-in-one
      video-creation product operated by Shenzhen Lianmeng Technology. The current
      application combines conventional timeline editing with generation, enhancement,
      transcription, audio, and other AI-assisted tools.
    - >
      Official CapCut material identifies 2020 as the broader editing platform's
      founding year and April 2020 as its global launch period. The Chinese desktop
      edition subsequently grew into a professional editor offering masks, keyframes,
      multicamera alignment, multiple timelines, color controls, and extensive audio
      processing.
  related-projects:
    - CapCut, the international product in the same editing family.
    - 剪映 mobile, the companion mobile edition linked from the official Chinese site.
    - 即梦AI, an affiliated creative-AI service linked by Jianying.
  sources:
    - >
      Input evidence: `source_facts.applications`, `source_facts.homepage`, and
      `current_curation`.
    - 'Official CapCut newsroom history: https://www.capcut.com/newsroom/capcut-world-singapore'
    - 'Official CapCut platform history: https://www.capcut.com/resource/capcut-app'
    - 'Official Jianying homepage: https://www.capcut.cn/'
    - 'Official Jianying learning center: https://www.capcut.cn/learning'
  summary:
    - >
      剪映专业版 is Jianying's desktop video editor for the Chinese market. It combines
      timeline-based video and audio editing with effects, color tools, multicamera
      workflows, media enhancement, and AI-assisted creation.
  timeline:
    - '2020: The broader CapCut editing platform was founded and launched internationally.'
    - >
      2022: The official Chinese site's copyright marker identifies the established
      Jianying web and desktop distribution surface.
    - >
      2026: The desktop Professional edition is promoted as an AI-assisted editor
      alongside its conventional professional editing tools.
  usage:
    - >
      Creators use the desktop application to import media, assemble projects on one or
      more timelines, edit video and audio, apply masks and keyframes, perform color
      work, and export completed videos.
    - >
      The official site emphasizes workflows for social-media presentation, film and
      television remixing, marketing, organizational communications, and professional
      editing. AI features assist with generation, background removal, enhancement,
      speech cleanup, narration, music, and rough cuts.
