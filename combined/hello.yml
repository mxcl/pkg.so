id: brew:hello
display-name: GNU Hello
homepage: https://www.gnu.org/software/hello/
repo: https://git.savannah.gnu.org/git/hello.git
docs:
  - https://www.gnu.org/software/hello/manual
  - https://www.gnu.org/software/hello/manual/hello.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Hello appears in traditional Unix-like packaging systems because it is small,
      portable, and useful as a smoke test for source-based and binary package
      workflows. The supplied package metadata lists Homebrew, Debian, Fedora, MacPorts,
      Nix, Ubuntu, and openSUSE packaging.
    - >
      GNU Guix documentation uses GNU Hello as an example package, which reinforces its
      role as teaching material for package definitions, source fetching, checksums,
      build systems, and dependency declaration.
  package-nerd-significance:
    - >
      GNU Hello is valuable precisely because it is over-equipped for its surface
      behavior. It lets maintainers test compiler invocation, gettext catalogs, Texinfo
      documentation, Autotools-style release layout, checks, install targets, and
      package metadata without the noise of a large application.
    - >
      It is the package equivalent of a tuning fork: small enough to understand at a
      glance, but formal enough to reveal whether a packaging system handles
      conventional GNU software correctly.
  project-history:
    - >
      GNU Hello dates back to the early 1990s. The GNU FTP archive lists early 1.x patch
      files and a 1.3 tarball in 1992 and 1993, then later 2.x releases across the
      2000s, 2010s, 2020s, and 2026.
    - >
      The project has served as a stable reference point for GNU maintainership. Because
      the core program is deliberately simple, changes in the package often illustrate
      build-system, translation, portability, and distribution practice rather than
      application complexity.
  related-projects:
    - GNU Coding Standards explain the conventions Hello is commonly used to demonstrate.
    - GNU Guix uses Hello in package-definition examples.
    - >
      Autoconf, Automake, gettext, and Texinfo are closely related to the style of GNU
      source distribution that Hello exemplifies.
  sources:
    - https://ftp.gnu.org/gnu/hello/
    - https://git.savannah.gnu.org/git/hello.git
    - >
      https://guix.gnu.org/cookbook/en/html_node/A-_0060_0060Hello-World_0027_0027-package.html
    - https://www.gnu.org/software/hello/
    - https://www.gnu.org/software/hello/manual/hello.html
  summary:
    - >
      GNU Hello is the GNU Project's intentionally small greeting program and sample
      package. Its job is not only to print a friendly greeting, but to demonstrate GNU
      package structure, coding conventions, localization, documentation, and release
      practice around a tiny program.
    - >
      That makes it a classic package-manager specimen: the runtime behavior is trivial,
      while the source distribution exercises the machinery expected of a serious GNU
      package.
  timeline:
    - '1992: GNU FTP archive lists early Hello 1.0 to 1.1 patch material.'
    - '1993: GNU FTP archive lists the Hello 1.3 source tarball.'
    - '2002: GNU FTP archive lists the 2.1.x release line.'
    - '2014: GNU FTP archive lists Hello 2.10.'
    - '2022: GNU FTP archive lists Hello 2.11 and 2.12.x releases.'
    - '2026: GNU FTP archive lists Hello 2.12.3.'
  usage:
    - >
      End users run `hello` to print a greeting. The program is often more important to
      developers and packagers than to interactive users, because it provides a minimal
      but complete GNU-style source distribution.
    - >
      There is no normal per-user configuration file or credentials file: the package is
      a command-line demonstration program, not a stateful client.
related-packages: []
category: developer-tools
package-manager:
  brew: hello
  debian: hello
  dnf: hello
  macports: hello
  nix: hello
  ubuntu: hello
  zypper: hello
package-manager-url: https://formulae.brew.sh/formula/hello
license: GPL-3.0-or-later
tags:
  - c
  - cli
  - coding-standards
  - example-package
  - gnu
description: Program providing model for GNU coding standards and practices
executables:
  - hello
provenance:
  formula: hello
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
