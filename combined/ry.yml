id: brew:ry
display-name: ry
homepage: https://github.com/jneen/ry
repo: https://github.com/jneen/ry
docs:
  - https://github.com/jneen/ry#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README explicitly supports Homebrew installation on macOS and manual
      installation to a chosen prefix. It supplies no adoption measurements.
  package-nerd-significance:
    - >
      Its small Bash implementation illustrates minimalist version management through
      PATH and symlinks, with optional integration into other Unix tools.
  project-history:
    - >
      The jneen/ry project was designed for explicit, unobtrusive Ruby version
      selection. Its README cites the Node.js version manager n as an inspiration.
  related-projects:
    - ry integrates with ruby-build and suggests direnv for automatic shell-local activation.
  sources:
    - '[Official README](https://github.com/jneen/ry#readme)'
  summary:
    - ry is a Bash-based Ruby virtual-environment and version-management tool.
  timeline:
    - 'Undated: The README documents Homebrew distribution and ruby-build integration.'
  usage:
    - >
      Install named Rubies with ry install and select them with ry use. Selection
      changes a shared symlink; ry fullpath supports shell-local PATH selection.
category: developer-tools
package-manager:
  apk: ry
  brew: ry
package-manager-url: https://formulae.brew.sh/formula/ry
license: MIT
tags:
  - cli
  - ruby
  - shell
  - version-manager
  - virtualenv
description: Ruby virtual env tool
executables:
  - ry
provenance:
  formula: ry
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
