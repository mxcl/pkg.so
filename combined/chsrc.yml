id: brew:chsrc
display-name: chsrc
homepage: https://chsrc.run/
repo: https://github.com/RubyMetric/chsrc
docs:
  - https://github.com/RubyMetric/chsrc#readme
  - https://github.com/RubyMetric/chsrc/tree/main/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents packaging through Homebrew, Scoop, WinGet, and AUR,
      while the batch input also records Nix packaging. The README says the tool
      supports more than 65 source-changing targets, which gives it a broader scope than
      one-off mirror-switch scripts.
  package-nerd-significance:
    - >
      chsrc matters to package-manager users because it treats mirror selection as a
      repeatable CLI workflow across many ecosystems rather than as hand-edited per-tool
      configuration. Its package-manager distribution also makes it a
      meta-package-management utility: a package installed by package managers to
      reconfigure package sources.
  project-history:
    - >
      The public GitHub repository was created in September 2023, and the README
      describes the project as a C11-based tool intended to avoid forcing users to
      install a large interpreted-language runtime just to change sources. Its docs
      frame chsrc as both a CLI and a recipe-oriented source-switching framework.
  related-projects:
    - >
      The README references chsrc-bootstrap for platforms without prebuilt binaries and
      describes recipes as the way contributors add new source-changing targets.
  sources:
    - https://github.com/RubyMetric/chsrc
    - https://github.com/RubyMetric/chsrc#readme
    - https://api.github.com/repos/RubyMetric/chsrc
    - https://api.github.com/repos/RubyMetric/chsrc/releases
    - https://formulae.brew.sh/api/formula/chsrc.json
  summary:
    - >
      chsrc is a cross-platform command-line tool and framework for switching software
      download and package sources, aimed especially at environments where mirror choice
      affects install speed or reachability.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2024: Pre-release binaries published on GitHub Releases.'
    - '2025: v0.2.0 and later releases continued the packaged CLI line.'
    - '2026: Homebrew formula tracks v0.2.5.'
  usage:
    - >
      Typical use is to list supported targets and mirrors, measure mirror speed, set a
      target to the fastest or selected mirror, inspect the current source, or reset a
      target to its upstream default. The README shows package-manager installation plus
      curl-based installers for POSIX and Windows systems.
related-packages: []
category: developer-tools
package-manager:
  brew: chsrc
  nix: chsrc
  scoop: main/chsrc
  winget: RubyMetric.chsrc
package-manager-url: https://formulae.brew.sh/formula/chsrc
license: GPL-3.0-or-later
tags:
  - cli
  - cross-platform
  - mirrors
  - package-managers
  - package-sources
description: Change Source for every software on every platform from the command-line
executables:
  - chsrc
provenance:
  formula: chsrc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
