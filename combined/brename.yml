id: brew:brename
display-name: brename
homepage: https://github.com/shenwei356/brename
repo: https://github.com/shenwei356/brename
docs:
  - https://github.com/shenwei356/brename#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README lists prebuilt release binaries for Linux, macOS, and Windows,
      plus installation through Conda, Homebrew, Arch AUR, Scoop, and source builds. The
      input package facts also record Homebrew and Scoop packaging.
    - >
      Its adoption is niche but practical: users who need repeatable bulk renames get a
      single static-style CLI rather than shelling together find, sed, mv, and
      platform-specific rename variants.
  package-nerd-significance:
    - >
      brename is not a foundational package, but it is a useful example of a modern
      single-purpose Go CLI that packages well across Homebrew, Scoop, Conda, and
      downloadable release archives.
    - >
      For package maintainers, it sits in the long family of rename tools while
      emphasizing safety and portability rather than just exposing a regular-expression
      substitution primitive.
  project-history:
    - >
      The GitHub repository was created in September 2013. The README presents brename
      as a practical cross-platform tool for safely batch renaming files and directories
      via regular expression.
    - >
      The project evolved around safety checks that plain mv or rename commands do not
      provide, such as detecting existing targets, newly overwritten paths, empty target
      paths, and Windows-problematic path endings.
  related-projects:
    - >
      Traditional Unix mv and rename commands are the simpler tools brename's safety
      checks are meant to improve upon.
    - Go is the implementation language and source-build toolchain named by the README.
    - >
      Scoop and Homebrew are package-manager channels documented by the README and input
      facts.
  sources:
    - https://api.github.com/repos/shenwei356/brename
    - https://github.com/shenwei356/brename#readme
    - https://github.com/shenwei356/brename/releases
    - source_facts.package-manager
  summary:
    - >
      brename is a Go command-line batch-renaming tool focused on safe
      regular-expression based file and directory renames. Its distinguishing features
      are dry runs, conflict detection, cross-platform path safety, filters, recursive
      operation, and undo support.
  timeline:
    - '2013-09: The brename GitHub repository was created.'
    - '2025: Official repository metadata showed activity into August 2025.'
    - >
      2025: The README documented brename 2.14.0 release binaries for Linux, macOS, and
      Windows.
  usage:
    - >
      The README documents pattern replacement with -p and -r, dry-run mode, include and
      exclude filters, recursive operation, directory renaming, key-value replacement
      files, ascending-number replacements, extension preservation, listing matches, and
      undoing the last successful operation.
    - >
      Cross-platform safety is a major usage theme. The README calls out
      case-insensitive filesystems such as FAT and NTFS and documents flags for
      case-insensitive or case-sensitive path handling.
related-packages:
  - id: brew:rename
    reason: >
      rename is a Perl-expression-based alternative for Unix pipelines, while brename
      emphasizes cross-platform conflict detection, recursive operations, and undo
      support.
    rel: alternative
    sources:
      - https://github.com/shenwei356/brename#readme
      - https://github.com/ap/rename
category: system
package-manager:
  brew: brename
  scoop: main/brename
package-manager-url: https://formulae.brew.sh/formula/brename
license: MIT
tags:
  - batch-rename
  - cli
  - cross-platform
  - file-management
  - regular-expression
description: Cross-platform command-line tool for safe batch renaming via regular expressions
executables:
  - brename
provenance:
  formula: brename
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
