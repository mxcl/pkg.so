id: brew:libkiwix
display-name: libkiwix
homepage: https://github.com/kiwix/libkiwix
repo: https://github.com/kiwix/libkiwix
docs:
  - https://libkiwix.readthedocs.io/en/stable
  - https://github.com/kiwix/libkiwix#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libkiwix adoption follows Kiwix adoption: schools, offline deployments,
      constrained networks, and personal archives need native tools that can read ZIM
      files and expose them through desktop interfaces or HTTP servers. Packages in
      Homebrew and major Linux distributions make the shared core available without
      building the whole Kiwix stack by hand.
    - >
      Its dependency list shows where it sits in the offline-content stack: libzim for
      archive access, ICU for language handling, libcurl and aria2 for network/download
      support, microhttpd for serving, and Meson/Ninja for modern builds.
  package-nerd-significance:
    - >
      libkiwix is a good example of a project-specific shared core becoming a
      distribution package because downstream ports need consistent ABI, dependencies,
      and data-format behavior. For package managers, it connects a large
      offline-knowledge application family to the smaller openZIM/libzim ecosystem.
  project-history:
    - >
      Kiwix developed around the idea that large web knowledge bases, especially
      Wikipedia, should be browsable without a network connection. libkiwix separated
      the shared application core from individual ports, giving Kiwix a library layer
      for ZIM integration, HTTP serving, resource compilation, internationalization, and
      common UI/server assets.
    - >
      The repository's 0.1 tag is anchored in March 2017, with a 1.0.0 release merge in
      October 2017 and a 3.1.0 release merge in December 2018. The README describes the
      library as code shared by all Kiwix ports on Windows, GNU/Linux, macOS, Android,
      iOS, and other platforms.
  related-projects:
    - >
      Related projects include Kiwix Desktop, kiwix-tools, openZIM, libzim, zimwriterfs,
      ICU, aria2, libcurl, GNU libmicrohttpd, and the broader Kiwix offline-content
      catalog.
  sources:
    - https://formulae.brew.sh/formula/libkiwix
    - https://github.com/kiwix/kiwix-desktop
    - https://github.com/kiwix/kiwix-tools
    - https://github.com/kiwix/libkiwix
    - https://github.com/kiwix/libkiwix/tags
    - https://libkiwix.readthedocs.io/en/stable
  summary:
    - >
      libkiwix is the shared C++ core of the Kiwix software suite, which reads and
      serves offline web-content archives in the ZIM format. It packages the reusable
      pieces used across Kiwix ports for desktop, mobile, server, and related tools.
  timeline:
    - '2017-03-21: 0.1 tag points at a Meson project-version fix.'
    - '2017-10-23: 1.0.0 release merge.'
    - '2018-12-03: 3.1.0 release merge.'
    - >
      2020s: README documents shared use across Windows, GNU/Linux, macOS, Android, iOS,
      and POSIX build paths.
  usage:
    - >
      End users usually see libkiwix through Kiwix applications rather than calling the
      library directly. Developers and packagers use it to build Kiwix Desktop,
      kiwix-tools, embedded HTTP serving, library management, resource compilation, and
      custom index pages for ZIM collections.
related-packages:
  - id: cask:kiwix
    reason: >
      Kiwix Desktop is the user-facing offline ZIM reader and manager that officially
      depends on libkiwix, making it the natural application for users who do not need
      to program against the library.
    rel: adjacent_workflow
    sources:
      - https://github.com/kiwix/kiwix-desktop/blob/main/README.md
      - https://github.com/kiwix/libkiwix
category: data
package-manager:
  apk: libkiwix
  brew: libkiwix
