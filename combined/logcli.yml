id: brew:logcli
display-name: logcli
homepage: https://grafana.com/oss/loki
repo: https://github.com/grafana/loki
docs:
  - https://grafana.com/docs/loki/latest/query/logcli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      logcli's adoption follows Loki adoption. The Loki README points to an ADOPTERS.md
      file listing organizations using Loki, including Grafana Labs, Red Hat, Dropbox,
      ASML, and others. Package metadata in this batch shows logcli distributed through
      Homebrew, Arch, Scoop, and openSUSE.
    - >
      In operational teams, logcli fills the same niche that `curl`, `kubectl logs`, and
      Prometheus query CLIs fill elsewhere: repeatable shell access to observability
      data, useful for incident response, automation, and checking label cardinality or
      query volume.
  package-nerd-significance:
    - >
      logcli is package-nerd significant because it packages a small, scriptable
      interface to a much larger observability system. Homebrew and other package
      managers let operators install only the query client without deploying Loki
      locally, which is exactly the sort of CLI split that package ecosystems are good
      at.
  project-history:
    - >
      logcli is developed inside the Grafana Loki repository. Loki itself is described
      by Grafana as a horizontally scalable, highly available, multi-tenant log
      aggregation system inspired by Prometheus, designed to index labels rather than
      full log contents.
    - >
      Grafana introduced Loki publicly in 2018 as Prometheus-inspired logging for
      cloud-native systems, and GitHub release metadata records the v0.1.0 beta in June
      2019. logcli became the terminal-facing companion to that stack, giving users a
      way to query Loki without Grafana's web UI.
  related-projects:
    - 'Grafana Loki: the log aggregation system queried by logcli.'
    - "LogQL: Loki's query language used by logcli."
    - 'Grafana: the visualization and exploration UI commonly used with Loki.'
    - 'Prometheus: the monitoring system whose label model inspired Loki.'
  sources:
    - https://github.com/grafana/loki
    - https://github.com/grafana/loki/blob/main/ADOPTERS.md
    - https://github.com/grafana/loki/releases/tag/v0.1.0
    - https://grafana.com/docs/loki/latest/query/logcli/
    - https://grafana.com/docs/loki/latest/query/logcli/getting-started/
  summary:
    - >
      logcli is Grafana Loki's command-line client for running LogQL queries, inspecting
      labels and series, and using Loki from scripts or terminal workflows.
  timeline:
    - '2018: Grafana announces Loki as Prometheus-inspired logging for cloud-native use.'
    - '2019: Loki v0.1.0 beta release is published on GitHub.'
    - >
      Current: Grafana documentation lists logcli as the Loki command-line tool for
      querying and exploring logs.
  usage:
    - >
      Grafana's documentation describes logcli as a query tool, not an ingestion tool.
      Users set `LOKI_ADDR` or `--addr`, optionally provide username/password, bearer
      token, tenant id, certificate paths, or proxy settings, and run commands such as
      `query`, `labels`, `series`, `stats`, and `volume`.
    - >
      The docs recommend matching the logcli version to the Loki server version and
      downloading binaries from Loki releases or building `cmd/logcli/logcli` from the
      Loki source tree.
related-packages:
  - id: brew:loki
    reason: >
      LogCLI is Loki's dedicated command-line client, so install Loki when you need to
      operate the server that stores logs and executes LogQL queries.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/loki/latest/query/logcli/
      - https://github.com/grafana/loki
  - id: brew:grafana-alloy
    reason: >
      Use Grafana Alloy to collect, transform, and send logs into Loki before querying
      them with LogCLI; Grafana recommends Alloy as Loki's primary ingestion method.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/loki/latest/send-data/alloy/
      - https://grafana.com/docs/loki/latest/query/logcli/
  - id: brew:grafana
    reason: >
      Use Grafana when the same Loki data and LogQL queries need interactive
      exploration, Logs Drilldown, or dashboards instead of terminal output.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/loki/latest/visualize/grafana/
      - https://grafana.com/docs/loki/latest/query/logcli/
category: cloud-infrastructure
package-manager:
  brew: logcli
  pacman: logcli
  scoop: main/logcli
  zypper: logcli
package-manager-url: https://formulae.brew.sh/formula/logcli
license: AGPL-3.0-only
tags:
  - cli
  - grafana
  - logql
  - loki
  - observability
description: Run LogQL queries against a Loki server
executables:
  - logcli
provenance:
  formula: logcli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
