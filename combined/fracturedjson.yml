id: brew:fracturedjson
display-name: FracturedJson
homepage: https://github.com/j-brooke/FracturedJson
repo: https://github.com/j-brooke/FracturedJson
docs:
  - https://github.com/j-brooke/FracturedJson/wiki
  - https://github.com/j-brooke/FracturedJson#readme
config-file-location:
  unix:
    - .fracturedjson
    - .fracturedjson.jsonc
    - .fracturedjson.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Official documentation lists NuGet packages for both the library and CLI, an NPM
      package for the JavaScript/TypeScript implementation, and editor distribution
      through the VS Code Marketplace and Open VSX. The README also points users to
      GitHub Releases for standalone CLI executables and to a GitHub Pages browser
      formatter.
  package-nerd-significance:
    - >
      FracturedJson matters to package collectors because it represents a formatter
      policy that is deliberately different from canonical pretty printers. Its
      packaging spread across NuGet, NPM, Homebrew, standalone release assets, a web
      app, and editor extensions makes it a small but unusually cross-surface developer
      tool.
  project-history:
    - >
      The public GitHub repository was created in October 2020 and the first GitHub
      release was the FracturedJson .NET library v1.0.0. The repository later grew into
      a family of official implementations: a .NET library, the fracjson CLI, a browser
      formatter, a JavaScript/TypeScript package, and a VS Code extension.
    - >
      Release history shows the formatter becoming more specialized over time. Version
      2.0.0 added tabular formatting, version 3.0.0 added JSON-with-comments support and
      deeper table formatting, version 4.x refined numeric alignment and formatting
      options, and separate CLI v1.0.0 releases in 2026 added self-contained binaries
      for common operating systems.
  related-projects:
    - >
      Official related projects include FracturedJsonJs for JavaScript/TypeScript,
      FracturedJsonVSC for VS Code, the browser formatter hosted on GitHub Pages, and
      community ports listed by the project wiki for Python and Rust.
  sources:
    - https://api.github.com/repos/j-brooke/FracturedJson
    - https://github.com/j-brooke/FracturedJson
    - https://github.com/j-brooke/FracturedJson/releases
    - https://github.com/j-brooke/FracturedJson/wiki/Available-Versions-and-Ports
  summary:
    - >
      FracturedJson is a JSON and JSONC formatter whose niche is compact human-readable
      output rather than fully expanded pretty printing. It keeps arrays and objects on
      one line when they remain short and simple, and aligns repeated object or array
      structures into table-like columns.
  timeline:
    - '2020: GitHub repository created and FracturedJson .NET library v1.0.0 released.'
    - '2021: Version 2.0.0 added tabular formatting.'
    - >
      2022: Version 3.0.0 added JSONC comments, deep table formatting, blank-line
      preservation, and trailing-comma handling.
    - '2024: Version 4.0.0 introduced NumberListAlignment.'
    - >
      2025: Version 4.1.0 added table comma placement options and .NET 8 targets for CLI
      and tests.
    - '2026: fracjson CLI v1.0.0 published with self-contained release binaries.'
  usage:
    - >
      The package is used as a command-line formatter through the fracjson executable,
      as a .NET library, through JavaScript/TypeScript bindings, in the browser, or
      inside VS Code. The package is most useful when dense JSON needs to remain
      scannable, such as coordinate lists, repeated records, and JSONC files where
      comments should be preserved.
related-packages:
  - id: brew:jq
    reason: >
      Choose jq when JSON formatting is part of a larger filtering, extraction,
      transformation, or streaming pipeline; choose FracturedJson when compact
      table-like human readability is the primary goal.
    rel: alternative
    sources:
      - https://github.com/j-brooke/FracturedJson/wiki/fracjson-CLI
      - https://jqlang.org/manual/
category: developer-tools
package-manager:
  brew: fracturedjson
  nix: fracjson
package-manager-url: https://formulae.brew.sh/formula/fracturedjson
license: MIT
tags:
  - cli
  - developer-tool
  - formatter
  - json
  - pretty-printer
description: JSON formatter that produces highly readable but fairly compact output
executables:
  - fracjson
provenance:
  formula: fracturedjson
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
