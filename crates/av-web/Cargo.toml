[package]
name = "av-web"
version = "1.16.0"
edition = "2024"
publish = false

[[bin]]
name = "av-web"
path = "main.rs"

[dependencies]
httpdate = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
